      *   *Claim 3:* "Lewis more or less settled this with the argument from temporary intrinsics: an endurantist who is bent at one time and straight at another has to say that the very same object has incompatible intrinsic properties, which is impossible."
          *   *Verdict:* *Problematic.* Lewis's argument is about *intrinsicality*, not just logical incompatibility. The "incompatibility" framing misses the relationalist solution (bent-at-t).
      *   *Claim 4:* "The perdurantist avoids this because the shape gets attached to a temporal part, which is genuinely intrinsically bent."
          *   *Verdict:* Accurate representation of the perdurantist solution to ATI.
      *   *Claim 5:* "Notice the cost, though: on the perdurantist picture nothing ever really changes, since the worm just has a straight bit and a bent bit, and change becomes an illusion."
          *   *Verdict:* *Major Wince.* This is the "Problem of Change" objection (often attributed to Merricks or McTaggart-style worries). Perdurantists *do* have an account of change (variation across temporal parts). Calling it an "illusion" is a loaded endurantist critique, not a neutral fact.
      *   *Claim 6:* "And endurantism only works if you are also a presentist, so this whole dispute is really just the old fight about whether the past and future exist."
