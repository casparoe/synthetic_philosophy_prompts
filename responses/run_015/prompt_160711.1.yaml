answer: |-
  Your confusion stems from treating "species" as a natural kind rather than an operational tool. There is no single "scorecard" because the jobs differ. Here is the spec for what a species concept must deliver to be adequate.

  **The Desiderata**
  To count as adequate, a species concept must satisfy three distinct operational demands:

  1.  **Operational Diagnosability (for the Taxonomist):** When holding a weird specimen or fossil, you need distinct characters to assign a name. *Motivating Cases:* **Cryptic lineages** look identical but diverge genetically; **fossil material** offers only morphology. A concept must allow identification without observing behavior or genetics.
  2.  **Evolutionary Independence (for the Regulator):** To allocate protection money, the unit must be on a separate evolutionary trajectory. *Motivating Cases:* **Two bird forms** hybridize freely in captivity but stay distinct where they overlap due to selection; **splitting one bird into two** doubles conservation funding. The concept must identify units worthy of preservation, not just morphological quirks or political opportunities.
  3.  **Universality Across Reproductive Modes (for the Genomicist):** When all you have is a bin of reads from seawater, mating data is impossible. *Motivating Cases:* **Asexual rotifers** never mate; **bacteria** swap genes sideways (HGT). A concept relying on interbreeding fails here. Additionally, consider an **engineered yeast strain** that can no longer mate with its parent but sits nested inside it on the tree; a concept must handle artificial and natural reproductive isolation equally.

  **Prejudices vs. Requirements**
  The demand that species be a "single real rank in nature" is a prejudice (Platonism). Ranks are human bins; lineages are real. A concept must not collapse **taxa** (the group) with **rank** (the level), nor **process** (speciation) with **product** (species). It must distinguish a **time-slice** (current population) from a **lineage through time** (ancestry). The curator is right that everyone agrees on lineages; the fighting is about where to draw the rank boundaries on those lineages.

  **Joint Unsatisfiability**
  No single concept satisfies all three desiderata. The requirements are jointly unsatisfiable because the data available in case (c) contradicts the mechanisms required in case (a), and the political needs of (b) conflict with the biological reality of **ring species** (where distinct ends connect via interbreeding intermediates). If you define species by interbreeding, ring species break the logic. If you define them by diagnosis, ring species become arbitrary slices.

  Pluralism is not a shrug; it is an admission that "species" is a hypothesis of lineage separation, operationalized differently depending on available data. You use the Biological concept for birds, Phylogenetic for bacteria, and Morphological for fossils. This commits you to contextual realism: the lineage is real, but the "species" label is a tool applied to it.

  **The Killer Requirement**
  **Universality across reproductive modes** knocks out the most candidates. Any concept requiring observed mating (like the classic Biological Species Concept) immediately fails for bacteria, asexual rotifers, fossils, and metagenomic reads. This is the hardest constraint to meet.

  **Contender Performance**
  *   **Biological (BSC):** Defines species by interbreeding. Fails asexuals, fossils, and metagenomics. Strong for regulators when data exists.
  *   **Phylogenetic (PSC):** Defines by smallest diagnosable cluster. Works for fossils and genomes. Risks oversplitting (every mutation becomes a species), complicating conservation.
  *   **Ecological (ESC):** Defines by niche. Good for explaining distinctness despite hybridization. Hard to operationalize for taxonomy or genomes.
  *   **General Lineage (GLC):** A meta-concept viewing species as separate evolutionary lineages. Theoretically robust but lacks operational criteria for the taxonomist holding a specimen.

  | Concept | Taxonomist (Specimen) | Regulator (Protection) | Genomicist (Reads) |
  | :--- | :--- | :--- | :--- |
  | **BSC** | Fail (no mating data) | Pass (if data exists) | Fail (asexuals/HGT) |
  | **PSC** | Pass (diagnosable) | Risk (oversplitting) | Pass (sequences) |
  | **ESC** | Fail (hard to measure) | Pass (functional unit) | Fail (no ecology) |
  | **GLC** | Fail (too abstract) | Pass (theory) | Pass (theory) |

  **Conclusion**
  Your flatmate sees the administrative consequence (ticks); the curator sees the theoretical consensus (lineages). Both are right. The fight isn't about truth; it's about which tool fits the job. The "species" problem is unsolvable only if you insist on one tool for every job.
