      *   "Flag places where you're just reporting your own intuition."

  10. **Self-Correction on "Orthodoxy":**
      *   In safety regulation (ISO 26262, SOTIF), the "interpretability" requirement is emerging but not fully settled.
      *   In philosophy, the "responsibility gap" is highly contested (Matthias vs. Danaher vs. legal scholars).
      *   I must clarify that the "Answerability Gap" is *not* orthodox in law yet, but is the leading candidate for *becoming* a requirement.

  11. **Final Polish:** Ensure the distinction between "liability" (paying) and "answerability" (explaining) is sharp, as that's the user's core insight.

  *(Self-Correction during drafting)*: Wait, the bet condition is "looking back in 25 years, someone competent would say the debate produced at least one conceptual distinction or normative requirement."
