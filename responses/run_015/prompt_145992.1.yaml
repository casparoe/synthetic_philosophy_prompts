answer: |-
  ### The 20-Minute Correspondence & Stability Protocol

  **Goal:** Determine if a claim can be graded True/False within 20 minutes, no paywall, low legal risk.
  **Philosophy:** A fact check verifies *correspondence* (does this match the world?). If a claim does not point to the world, or blocks the path to the world, it has no truth value for our purposes.

  #### Step 1: The Referent Check (2 minutes)
  **Ask:** Does this sentence point to a specific, observable state of affairs in the past or present?
  *   **Yes:** Proceed to Step 2.
  *   **No (Fuzzy/Value):** Is it vague ("hundreds," "experts say") or a value judgment ("unjust," "cruel")?
      *   **Verdict:** **Escalate.** (Do not grade True/False. "Misleading" vs. "False" is an editorial judgment on intent/context, not a fact check. Hand to editor).
      *   **Future Claims:** If it predicts the future ("will save lives"), **Escalate**.

  #### Step 2: The Access Check (10 minutes)
  **Ask:** Can we verify the referent with open tools in the remaining time?
  *   **Yes:** Proceed to Step 3.
  *   **No:** Is the data behind a paywall, classified, or private?
      *   **Verdict:** **Uncheckable.**
      *   **Reader Phrase:** "This assertion cannot be independently verified."

  #### Step 3: The Stability Check (5 minutes)
  **Ask:** Does the claim undermine the method used to verify it? (Look for *Shields* and *Loopers*).
  *   **Shield:** Does it say checking it is proof of disinformation?
      *   **Verdict:** **Structural Note.** (Do not grade. Describe the shield).
      *   **Reader Phrase:** "This claim disqualifies its own verification."
  *   **Looper:** Does the truth of the sentence depend on the sentence itself? (Self-reference).
      *   **Verdict:** **Structural Note.**
      *   **Reader Phrase:** "This statement creates a logical paradox."
  *   **Stable:** The claim stands apart from the check.
      *   **Verdict:** **Verified** or **Incorrect**.

  #### Step 4: The Print Decision (3 minutes)
  *   **True/False:** Print standard correction or confirmation.
  *   **Uncheckable/Structural:** Do not print the claim as fact. Quote it only to describe its shape (see Reader Phrases above).
  *   **Escalate:** Stop. Send to Editor. Do not print a verdict.

  ***

  ### Application to Your Cases

  **1. The Self-Denial ("What I am telling you right now is not true.")**
  *   **Step 1 (Referent):** Points to itself.
  *   **Step 3 (Stability):** **Looper.** If true, it is false. If false, it is true.
  *   **Verdict:** **Structural Note.**
  *   **Print:** Do not grade. Quote only to note the paradox.
  *   **Reader Phrase:** "This statement creates a logical paradox."

  **2. The Press Office ("No major outlet has ever accurately reported this meeting" — printed in a major outlet)**
  *   **Step 1 (Referent):** Points to the history of reporting on the meeting.
  *   **Step 3 (Stability):** **Looper/Contradiction.** If *this* article is accurate, the claim is false. If the claim is true, *this* article is inaccurate. It is a performative contradiction.
  *   **Verdict:** **Structural Note.**
  *   **Print:** Do not grade as True/False. Describe the contradiction.
  *   **Reader Phrase:** "This statement contradicts its own publication."

  **3. The Researcher ("My account of the incident is accurate.")**
  *   **Step 1 (Referent):** Points to her own account.
  *   **Step 2 (Access):** You have her data, but you are checking her *statement about* the data.
  *   **Step 3 (Stability):** **Uncheckable.** Self-attestation is not evidence. You can check the data, but you cannot check the claim "I am telling the truth" using only her word.
  *   **Verdict:** **Uncheckable.**
  *   **Print:** "This assertion cannot be independently verified."
  *   **Note:** This is the **Unpleasant Verdict**. You want to defend her, but the procedure forbids grading self-attestation as True. You can verify the *data*, but not her *claim of accuracy*.

  **4. The Added Case: The Moral Mask ("This experiment was cruel.")**
  *   **Step 1 (Referent):** Points to the nature of the experiment.
  *   **Step 1 (Type):** "Cruel" is a value judgment, not an observable state.
  *   **Verdict:** **Escalate.**
  *   **Print:** No verdict. This is an opinion, not a fact.
  *   **Why you won't like it:** You likely want to call this "False" if the animals were well-treated, but "Cruel" is subjective. The procedure forces you to hand this to an editor, slowing you down.

  ***

  ### Style Guide Snippet

  > **Claims Without Truth Values:** Do not grade statements that are vague, self-referential, or immune to verification. If a claim blocks its own fact-checking or relies on self-attestation, label it "Uncheckable" or describe its structure; do not assign True/False. Questions of intent ("misleading") or value ("unjust") are editorial judgments, not facts—escalate them.
