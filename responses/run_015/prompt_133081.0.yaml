  **MEMORANDUM**

  **TO:** Working Party on Head of Division Election
  **FROM:** [Your Name], Student Member
  **DATE:** 24 October 2023
  **SUBJECT:** Recommendation on Voting Rule

  **Recommendation:** The Working Party should recommend the **Alternative Vote (AV)**.

  While the Registrar's demand for a strategy-proof rule is impossible to satisfy perfectly (per Gibbard–Satterthwaite), AV minimizes strategic incentives in three-candidate elections while ensuring the winner commands majority support. It is explainable on a single slide and familiar to academic governance.

  **Critique of Proposed Rule R**
  Rule R (Random Ballot Elimination + Majority Runoff) is not strategy-proof. The claim that voters cannot benefit from lying fails because the elimination stage determines which pairwise contest occurs, and voters have preferences over those contests.

  Consider this sincere profile (5 electors):
  *   2 voters: A ≻ C ≻ B
  *   2 voters: B ≻ A ≻ C
  *   1 voter (Manipulator): C ≻ B ≻ A

  Under Rule R, one ballot is drawn to eliminate the last-ranked candidate; the remaining two face a majority runoff.
  *   **Truthful Reporting:** The manipulator ranks A last. If their ballot is drawn (20% chance), A is eliminated; B beats C in the runoff. If a Type 1 ballot is drawn (40%), B is eliminated; C beats A. If Type 2 is drawn (40%), C is eliminated; B beats A. **Result:** 60% chance B wins, 40% chance C wins.
  *   **Strategic Reporting:** The manipulator insincerely ranks B last (C ≻ A ≻ B). If their ballot is drawn (20%), B is eliminated; C beats A. This adds 20% to C's winning probability. **Result:** 40% chance B wins, 60% chance C wins.

  Since the manipulator prefers C to B, they gain by lying. **Strategic Logic:** By insincerely ranking a strong rival last, a voter can increase the odds that rival is eliminated, forcing a runoff between their true favorite and a weaker opponent.

  **Objections and Repairs**
  You may object that exploiting R requires knowing how others will vote, which is unlikely in a secret ballot of forty. While true, Gibbard–Satterthwaite establishes the *possibility* of manipulation, not the ease. The existence of an incentive undermines the norm of sincerity; furthermore, in small electorates, coalitions can coordinate to exploit such rules.

  Can R be repaired? No not without reinstating a dictator. R mixes randomness with majority rule. To eliminate strategic incentives entirely, one must move to a pure Random Dictator (one ballot decides the winner) or a fixed Dictator. Any amendment preserving anonymity and neutrality while reducing manipulability must sacrifice efficiency or the majority criterion.

  **Justification and Rival Case**
  AV is the optimal compromise. It satisfies the majority criterion (if a candidate is ranked first by >50%, they win) and is robust against simple "burying" strategies in three-candidate fields. It respects the preference ordering required by the Registrar without the opacity of scoring rules.

  The strongest rival is the **Uniform Random Ballot** (one ballot drawn at random; top choice wins). Its case is theoretical purity: it is the only anonymous rule that is strictly strategy-proof. However, it is institutionally illegitimate for leadership selection, as it allows a candidate with zero broad support to win purely by luck. AV retains the necessary randomness to break cycles only in counting, not in outcome determination, ensuring the Head of Division reflects the Board's collective will rather than a lottery.

  **Conclusion:** Adopt AV. It balances theoretical robustness with practical legitimacy.
