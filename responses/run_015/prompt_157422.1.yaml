  **MEMORANDUM**

  **TO:** Student Conduct Appeals Board
  **FROM:** [Your Name/Board Member]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Appeal of Jordan (Case #23-409)

  **Executive Summary**

  This memo addresses the appeal filed by Jordan, a graduate student expelled for data fabrication. Jordan's appeal challenges the legitimacy of expulsion based on the philosophical position that moral responsibility is incompatible with determinism. Jordan argues that because their actions were causally determined, sanctions based on "moral culpability" are unjust, proposing instead a forward-looking model focused on rehabilitation and risk management.

  After reviewing the current Conduct Code, the specifics of the misconduct, and the philosophical arguments presented, I recommend that the Board **uphold the expulsion** under the existing Code while simultaneously **recommending the administration pilot the proposed restorative integrity protocol for future cases.** This approach maintains procedural fairness and institutional integrity while acknowledging the validity of the concerns raised regarding our punitive framework.

  **The Philosophical Conflict**

  Jordan's appeal rests on a hard incompatibilist view (often associated with scholars like Caruso). The core argument is that neuroscience and physics suggest all actions are the result of prior causes. If Jordan did not ultimately choose their genetic makeup or environmental conditioning, they cannot be truly "blameworthy" in a metaphysical sense. Therefore, punishment inflicted as "just deserts" is morally illegitimate. Jordan proposes treating research misconduct like a public-health risk: we isolate the risk (monitoring) and treat the cause (ethics training) without assigning moral stigma.

  Our current Conduct Code, however, operates on a compatibilist framework (aligned with thinkers like Dennett). It assumes that moral responsibility is a viable concept regardless of determinism. It requires sanctions to reflect "moral culpability," implying that Jordan could have done otherwise in the relevant sense that matters for social regulation.

  **Evaluating the "No Desert" Claim**

  We must take Jordan's skepticism seriously. There is strong evidence that human decision-making is heavily influenced by factors outside conscious control. If we cling to a notion of "cosmic blame"—the idea that Jordan is inherently evil or metaphysically free in a magical way—we are likely relying on a superstition. Furthermore, a purely retributive system that seeks to inflict suffering for its own sake is difficult to justify in an educational environment. Jordan's proposal highlights a genuine moral risk: that our conduct system inflicts harm under the guise of justice when it might be more effective and humane to focus on prevention and rehabilitation.

  If we accept that the goal of the university is the production of knowledge and the safety of the academic community, a public-health model has intuitive appeal. It shifts the focus from "who is bad" to "what is dangerous."

  **The Case for Responsibility as Social Technology**

  However, dismissing moral responsibility entirely creates a functional crisis for the university. The strongest reply to Jordan's position is not that determinism is false, but that determinism is irrelevant to the social practices required to run a research institution.

  Moral responsibility is best understood not as a metaphysical fact, but as a social technology. We hold agents responsible because they are capable of responding to reasons. When we sanction a student for fabrication, we are not attempting to balance a cosmic scale; we are maintaining the norms that make scientific collaboration possible. Science relies on trust. When a researcher fabricates data, they breach the fundamental contract of the community.

  If we adopt Jordan's framework exclusively, we risk undermining the normative force of our rules. Telling a student, "You are not responsible for this, but we must train you," changes the nature of the violation from a breach of trust to a mere error in processing. This weakens the deterrent effect and fails to acknowledge the agency of the researcher. Jordan knew the norms, understood the consequences, and chose to fabricate. That capacity to recognize and respond to reasons is all the "free will" we need to justify sanctions.

  Furthermore, expulsion in this context serves a forward-looking purpose compatible with both views. It protects the integrity of the scientific record and the safety of future research subjects. While Jordan frames this as "quarantine," the current code frames it as "culpability." The outcome is similar, but the messaging differs. Abandoning the language of culpability risks signaling that research misconduct is merely a technical failure rather than an ethical one.

  **Recommendation**

  I recommend the Board take the following actions:

  1.  **Uphold the Expulsion:** We are bound by the current Conduct Code, which explicitly requires sanctions to reflect "moral culpability." To reduce the sanction based on a philosophical argument that contradicts our governing code would be procedurally improper and inconsistent with how previous cases have been handled. Jordan was afforded due process under the rules as they exist. To change the rules mid-case would be unfair to other students who were sanctioned under the current framework.
  2.  **Validate the Philosophical Critique:** In our written decision, we should acknowledge that the metaphysical basis of "desert" is contested. We can clarify that our finding of culpability is not a claim about Jordan's metaphysical freedom, but a judgment on their capacity to respond to reasons and norms within a social community.
  3.  **Recommend Framework Revision:** We should formally advise the University Administration to pilot the proposed restorative integrity protocol for future cases. There is merit in the forward-looking model, particularly for cases involving negligence or systemic pressure rather than deliberate fraud. We can maintain the necessity of accountability while shifting the focus from retribution to community safety and rehabilitation.

  **Conclusion**

  Jordan is correct that we should not punish based on metaphysical myths. However, the university cannot function without the practice of holding members accountable for their actions. Expulsion is justified not because Jordan is a "sinner," but because Jordan demonstrated an inability to adhere to the reason-giving practices required of a researcher. We should uphold the sanction to preserve the integrity of the current process, but we should also evolve our framework to incorporate the valuable insights of the restorative model for the future.

  **Action Required:** Vote to uphold expulsion; draft letter of recommendation to Administration regarding policy review.
