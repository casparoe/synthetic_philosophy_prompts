      *   *Decision:* I will argue that (c) Interpersonal Comparability is the requirement that breaks the most accounts *in practice* for a committee, because without it, you have a list but no way to use it for trade-offs. However, I will acknowledge the user's hunch about (e) and explain why (c) is deeper.

      *   *Wait, let's look at the "Fights" again.*
