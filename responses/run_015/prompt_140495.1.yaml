answer: |-
  Here is the specification you asked for. It sorts your provisional list into **Real Desiderata** (conditions required for the moral theory to hold water) and **Committee Conveniences** (conditions required for the bureaucracy to function), maps them to your specific edge-cases, and identifies the structural faults in the design.

  ### The Spec: Requirements for a Graded Moral Status Account

  | Req ID | Provisional Item | Classification | Motivating Case | Why it is required (or convenient) |
  | :--- | :--- | :--- | :--- | :--- |
  | **R1** | **(f) Substrate/Report Independence** | **Real Desideratum** | *Rerouted System:* A system avoids harm and learns without "unpleasantness." | If status depends on verbal report or specific anatomy (e.g., mammalian cortex), you cannot assess insects, AI, or altered organisms. The metric must track the *capacity* for valence, not its typical markers. |
  | **R2** | **(g) Locus & Aggregation** | **Real Desideratum** | *Colony / Split Organism:* 50k insects solving problems; a worm cut in half. | You must define *where* the moral patient is. Is the colony one patient or 50k? Is each worm-half a new patient? Without this, the "Nociceptive Index" cannot be summed or applied. |
  | **R3** | **(c) Interpersonal Comparability** | **Real Desideratum** | *Fly vs. Mouse:* Trading off one mouse life against many fly lives. | A graded list is useless for ethics committees without a common currency. If Fly Pain Units and Mouse Pain Units are incommensurable, you cannot make trade-off decisions. |
  | **R4** | **(h) Valence Symmetry & Baseline** | **Real Desideratum** | *Thermostat:* Is it at zero or below resolution? *Positive States:* Do they count? | You must define the zero-point. If a thermostat has a "Nociceptive Index" of 0, is that moral neutrality or epistemic failure? You must also weight pleasure against pain. |
  | **R5** | **(a) Status vs. Weight** | **Real Desideratum** | *Binary vs. Graded:* Does a fly have *some* rights (status) or just *less* weight? | Conceptual clarity. "Status" usually implies rights (threshold); "Weight" implies utilitarian calculus (graded). Conflating them leads to contradictions when weighing life vs. discomfort. |
  | **C1** | **(d) Continuity vs. Thresholds** | **Committee Convenience** | *Admin:* Need a line for "Approved/Not Approved." | **Conflict:** Reality is likely continuous (R1/R4), but administration requires binary gates. This requirement forces a philosophical lie for bureaucratic utility. |
  | **C2** | **(e) Ordering Under Uncertainty** | **Committee Convenience** | *Precaution:* Deciding when evidence is thin. | **Conflict:** Demands a decision when the metrics (Nociceptive/Counterfactual) are ambiguous. Often forces a default to "high status" which violates R3 (Comparability). |
  | **C3** | **(i) Non-Revisionary** | **Committee Convenience** | *Intuition:* Mice > Rocks. | **Conflict:** Truth might be revisionary (e.g., if colonies are single subjects). This constraint biases the theory toward anthropocentric comfort rather than accuracy. |
  | **C4** | **(b) Intensity/Duration/Weight** | **Hybrid** | *Injured Fly:* Tending limb for days. | **Conflict:** Philosophically distinct, but committees need a single "Weight" number. Collapsing these three variables into one score loses moral nuance. |

  ### Where the Spec Fights Itself

  There are two primary structural conflicts in this design that will cause your committee to cycle indefinitely.

  **1. The Metaphysical vs. Administrative Conflict (R2 vs. C1)**
  *   **The Fight:** R2 (Locus & Aggregation) demands you know *what* counts as a subject. The *Split Organism* case suggests identity is fluid; the *Colony* case suggests subjects can be nested. However, C1 (Thresholds) demands you draw a line around a discrete entity to grant approval.
  *   **The Consequence:** If you treat the colony as 50,000 subjects, the "Nociceptive Integration Index" might be low per insect but massive in aggregate. If you treat it as one subject, the index is high (complex problem solving) but the "suffering" locus is unclear. You cannot administer thresholds (C1) if you cannot bound the subject (R2).

  **2. The Epistemic vs. Practical Conflict (R1 vs. R3)**
  *   **The Fight:** R1 demands you ignore anatomy and report (to cover silicon and insects). R3 demands you compare the moral weight of those systems to mammals.
  *   **The Consequence:** Without anatomy or report as a calibration anchor, you have no way to establish the exchange rate between a Fly Pain Unit and a Mouse Pain Unit. You can measure "Counterfactual Richness" for both, but you cannot prove that a unit of richness maps to a unit of suffering equally across substrates.

  ### The Killer Requirement

  Your hunch is that **(e) Ordering Under Radical Uncertainty** is the requirement that knocks out the most accounts. I disagree. Uncertainty is manageable via precautionary principles (e.g., "assume sentience if probability > 5%").

  The single requirement that destroys the most popular accounts is **R3: Interpersonal Comparability.**

  **The Argument:**
  Most theories (complexity thresholds, capacity views) can generate a *ranking* (Mouse > Fly > Thermostat). Very few can generate a *ratio* (1 Mouse = 100 Flies).
  *   **Why it kills accounts:** An ethics committee does not just need to know that mice matter more than flies; they need to know if saving one mouse justifies harming a million flies.
  *   **The Failure Mode:** The *Nociceptive Integration Index* and *Counterfactual Richness* are functional metrics. They measure *capacity*, not *valence magnitude*. A system could have high counterfactual richness (many states) but shallow affective depth. Without R3, your graded list is merely a taxonomy, not a weighing scale. You end up with "incommensurable silos" where you can't trade off across categories, paralyzing the committee.

  ### Theory Evaluation Against the Winnowed Spec

  Here is how three common families of view survive (or fail) against the Real Desiderata (R1–R5), specifically focusing on the Killer (R3).

  | Theory Family | Performance against Spec | Verdict |
  | :--- | :--- | :--- |
  | **1. Capacity-for-Valenced-Experience**<br>(Binary/Graded Hybrid) | **Fails R3 & R2.** It handles the *Injured Fly* well (if it tends the limb, it has capacity), but cannot compare the *intensity* of that capacity across species (R3). It also struggles with the *Split Organism* (does capacity duplicate?). | **Unusable for Trade-offs.** Good for rights assignment, bad for utilitarian calculus. |
  | **2. Neural/Informational Complexity Threshold**<br>(e.g., Cortex count, Node count) | **Fails R1 & R3.** The *Rerouted System* case breaks this: if behavior persists without the "standard" anatomy, this theory falsely denies status. It also assumes complexity maps linearly to moral weight (R3), which is unproven. | **Administratively Easy, Philosophically Brittle.** Easy to measure (C1), but vulnerable to edge cases (silicon, insects). |
  | **3. Integrated Information / Structuralism**<br>(e.g., Phi, Causal Power) | **Passes R1 & R2, Fails R3 & C1.** It handles the *Colony* and *Split Organism* best (locus is where integration is highest). It is substrate independent (R1). However, Phi scores are notoriously hard to calculate (fails C2/Evidence) and do not map cleanly to *suffering* magnitude (R3). | **Theoretically Robust, Practically Impossible.** Solves the metaphysics, but you cannot compute the scores in time for a protocol review. |

  **Recommendation:** Do not try to solve R3 (Comparability) theoretically. It is currently unsolvable. Instead, write your guidance to treat the "Nociceptive Integration Index" as a **proxy for precautionary weight**, explicitly acknowledging that the exchange rate between species is a policy decision, not a scientific fact. This separates the *science* (R1, R2) from the *ethics* (R3), allowing the committee to function without pretending the metrics do more than they can.
