answer: |-
  **TO:** Clinical AI Assurance Committee, Integrated Care Board
  **FROM:** Committee Member
  **DATE:** 24 May 2024
  **SUBJECT:** Decision Memo: Continuing Care Prioritisation Aid (CCPA) Pilot

  **Recommendation**
  The Committee should **Approve with Conditions** the twelve-month pilot of the Continuing Care Prioritisation Aid (CCPA). Approval is contingent upon the vendor meeting four specific technical and governance conditions prior to go-live and during the first six months. These conditions are necessary to mitigate design features that currently embed hidden normative shifts and audit risks.

  **Conditions of Approval**
  1.  **Normative Impact Assessment of Stakes Dial:** The vendor must produce a quantitative analysis demonstrating how varying the 'stakes' dial (the threshold for escalation based on expected quality-adjusted life years, or QALYs, at risk) alters the relative influence of the five moral modules. This must be signed off by the Committee Chair before deployment. **Responsibility:** Vendor. **Deadline:** 14 June 2024.
  2.  **Faithful Rationale Audit Trail:** While the clinician-facing explanation may remain optimised for readability, the system must generate and store a 'faithful trace' of the actual weighting and module scores for every decision, accessible for audit. **Responsibility:** Vendor. **Deadline:** 14 June 2024.
  3.  **Weight Update Freeze:** The quarterly re-estimation of module weights must be frozen for the first six months of the pilot to prevent early data anomalies from hardening into doctrine. **Responsibility:** Vendor. **Deadline:** Immediate upon contract signing.
  4.  **Escalation Equity Monitoring:** The Board's data team must report monthly on the correlation between patient deprivation indices and escalation rates. If escalation correlates positively with deprivation (indicating thin records trigger disagreement), the stakes threshold must be adjusted. **Responsibility:** ICB Data Team. **Deadline:** Monthly during pilot.

  **Reasoning**
  Our decision rests on four specific design concerns. We have categorised these by their weight in our deliberation.

  **1. The Stakes Dial is Normatively Non-Neutral (Decisive)**
  The vendor presents the stakes dial as a caution mechanism. However, only the aggregate-welfare and prioritarian modules (which weight the worse off more heavily) respond to the size of the stake. The constraint module (which blocks using patients as means) and relational module (encoding prior commitments) do not scale. Therefore, increasing the stakes does not merely add caution; it mathematically privileges consequentialist reasoning over deontological constraints. A high-stakes setting silently instructs the system to become more utilitarian. We cannot accept a system that shifts moral theory via a parameter intended for risk management. Condition 1 forces transparency on this shift.

  **2. Rationale Fidelity vs. Acceptability (Decisive)**
  The natural-language rationale provided to clinicians is tuned for acceptability, not fidelity to the algorithmic process. This creates a 'black box' wrapped in plain English. If a clinician challenges a decision, the provided reason may not be the actual reason. This undermines professional accountability and public law requirements for explainability. While the vendor argues fidelity reduces throughput, Condition 2 ensures an audit trail exists even if the frontline view is smoothed. We must know why a decision was made, even if the patient-facing explanation is simplified.

  **3. Escalation as an Arbitrary Allocator (Relevant)**
  Abstention triggers human review. Our panels are more generous and narrative-responsive than the algorithm. Currently, abstention is triggered by module disagreement, which correlates with thin or fragmented records—often a marker of deprivation or transient housing. Thus, the system allocates the more generous human process to patients based on data quality rather than need. This is morally arbitrary. Condition 4 monitors this. If the correlation holds, we must adjust the threshold, even if it increases human panel workload.

  **4. Codification Bias in Weight Updates (Relevant)**
  The quarterly weight update learns only from codified data. Uncodified factors—bedside promises, family capacity—never appear as candidate reasons and thus lose influence over time. Early defaults may harden into doctrine. Condition 3 freezes weights for six months to prevent the system from learning too quickly from incomplete initial data.

  **Strongest Consideration Against Recommendation**
  The strongest argument against these conditions is the vendor's claim regarding clinical throughput. They estimate that generating a faithful trace (Condition 2) and freezing weight updates (Condition 3) will reduce system efficiency and delay prioritisation by approximately forty per cent in the early phase. In a context of forty slots for three hundred referrals, speed is a clinical virtue. Delaying support to ensure algorithmic transparency risks harm to patients waiting for enhanced care. There is a genuine trade-off here: perfect auditability may cost patient welfare in the short term. However, deploying a system whose reasoning cannot be audited exposes the Board to greater legal and ethical risk should a harm occur. We prioritise long-term accountability over short-term throughput gains.

  **Feasibility Flag**
  We anticipate the vendor will declare Condition 2 (Faithful Rationale Audit Trail) infeasible within the current timeline, citing the architectural separation between the ranking engine and the language generation component. They may argue that bridging this for every case requires a refactor exceeding the pilot scope.

  The Committee should hold firm. The vendor has sold a decision-support system, not a decision-replacement system. Under NHS governance, we cannot act on recommendations where the stated reason differs from the actual cause. If the architecture cannot support a faithful trace, the system is not ready for public sector deployment. We are willing to delay the pilot start date by four weeks to accommodate this, but we will not waive the requirement.

  **Six-Month Review Criteria**
  At the six-month review, the Committee will examine:
  1.  **Drift Analysis:** Comparison of frozen weights versus what the system would have learned had updates been active.
  2.  **Escalation Demographics:** Whether the correlation between deprivation indices and escalation rates has been broken or mitigated.
  3.  **Audit Utilisation:** Frequency with which the faithful trace was accessed during clinical disputes.
  4.  **Module Performance:** Whether the constraint and relational modules are being systematically overridden by the stakes-sensitive modules in high-QALY cases.

  If the faithful trace remains inaccessible or the stakes dial continues to obscure normative shifts, the pilot will be terminated.

  **Signed:**
  [Name]
  Clinical AI Assurance Committee Member
