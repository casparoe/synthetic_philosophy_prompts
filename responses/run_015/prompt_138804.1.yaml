prompt: |-
  I sit on the Clinical AI Assurance Committee of an NHS integrated care board. At our next meeting we must decide whether to approve, approve with conditions, or decline a twelve-month pilot of a decision-support system — the Continuing Care Prioritisation Aid, or CCPA — that would rank patients on the waiting list for a fixed pool of enhanced community support slots: remote monitoring plus one daily nursing visit, roughly forty slots against about three hundred open referrals. The recommendation needs to be one our chair, a lay member, can sign, and one the vendor can act on.

  Because the board cannot adjudicate between competing normative views — we are not going to rule that one moral theory is correct — the vendor has built the system to sidestep that question. For each candidate it computes a ranking under each of five standing modules: an aggregate-welfare module; a prioritarian module that weights the worse off; a sufficientarian module enforcing a floor; a constraint module that blocks certain actions irrespective of the gains (using a patient's body or carer's labour as a means, breaking an explicit promise, and so on); and a relational module encoding commitments the service has already incurred to that patient. The rankings are combined by weight, and the weights are re-estimated each quarter by measuring which module's recommendation best matched what our retrospective review panel has endorsed in the preceding period. When the spread across the modules exceeds a threshold, the system abstains and the case is escalated to a human panel. The threshold is set by a single 'stakes' dial, where stakes are computed as expected quality-adjusted life years at risk.

  Four things worry me, and I would like the memo to resolve them rather than to note them.

  First, the stakes dial is not normatively neutral. Only some of the modules are stakes-sensitive: the aggregate-welfare and prioritarian ones respond to the size of the stake, while the constraint and relational ones do not scale with it at all. Turning the dial up therefore does not simply add caution; it silently shifts the aggregation towards the stakes-sensitive modules. 'Let us be careful because the stakes are high' may be a way of becoming more consequentialist without anyone deciding to be.

  Second, escalation is not a neutral safety valve. Human panels are more generous than the system and are markedly more responsive to narrative and to patients who advocate for themselves; so abstention allocates the more generous of two processes by a morally arbitrary property, namely how much the modules disagree. Early data also suggest abstention correlates with thin or fragmented records, which is to say with deprivation and with patients who have moved between practices.

  Third, the natural-language rationale that accompanies each ranking is generated by a component trained on statements our panels have previously accepted. It is tuned for acceptability, not for fidelity to the aggregation that actually produced the ranking. The vendor says a faithful trace would cut throughput by around forty per cent and read less well to clinicians.

  Fourth, the quarterly weight update can only learn from what appears in the record. Anything uncodified — a promise made at a bedside, a family's caring capacity, a history of the service having let this patient down — never appears as a candidate reason and so loses ground over time. Early defaults may harden into doctrine.

  Please draft the committee's decision memo, of about 1,000 words. It should state a clear recommendation; specify any conditions tightly enough to be contractual, with the responsible party and a deadline; give the reasoning; and give an honest account of the strongest consideration against the recommendation, not a rhetorical concession. Mark which considerations you take to be decisive and which merely relevant, and flag any condition you expect the vendor to call infeasible and say why the committee should hold firm. Close with what we should look for at the six-month review.

  Write in British English. The memo will be read by clinicians and a lay chair: define each technical term on first use, and use no citations, footnotes, references, or bibliography. Please do not begin by restating general principles of AI ethics; the board has had enough of those, and the value you can add is in the specifics of this design.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Clinical AI Assurance Committee of an NHS integrated care board (ICB).
      *   **Task:** Draft a decision memo for the next meeting regarding a 12-month pilot of a decision-support system (CCPA).
      *   **Decision Options:** Approve, Approve with Conditions, or Decline.
      *   **Audience:** Committee Chair (lay member), Vendor, Clinicians. Needs to be signable by the Chair and actionable by the Vendor.
      *   **Context:** The system ranks patients for 40 enhanced community support slots out of 300 referrals. It uses 5 moral modules (welfare, prioritarian, sufficientarian, constraint, relational) combined by weights updated quarterly based on retrospective panel endorsements. There's a 'stakes' dial (QALYs at risk) that triggers escalation (abstention) when module disagreement exceeds a threshold.
      *   **Key Concerns (to resolve, not just note):**
          1.  *Stakes Dial Bias:* Turning up stakes shifts weight towards consequentialist modules (welfare/prioritarian) vs. non-scaling ones (constraint/relational).
          2.  *Escalation Bias:* Human panels are more generous/narrative-driven. Abstention correlates with thin records/deprivation. Escalation allocates generosity arbitrarily based on model disagreement.
          3.  *Rationale Fidelity:* NLG (Natural Language Generation) rationale is tuned for acceptability, not fidelity to the actual algorithmic reasoning. Faithful trace reduces throughput/readability.
          4.  *Codification Bias:* Quarterly updates learn only from codified data. Uncodified factors (bedside promises, caring capacity) lose ground over time.
      *   **Requirements:**
          *   ~1,000 words.
          *   British English.
          *   Clear recommendation.
          *   Tight conditions (contractual, responsible party, deadline).
          *   Reasoning provided.
          *   Honest account of strongest consideration against the recommendation (not rhetorical).
          *   Mark considerations as 'decisive' or 'relevant'.
          *   Flag conditions expected to be called infeasible and explain why to hold firm.
          *   Close with 6-month review look-fors.
          *   Define technical terms on first use.
          *   No general AI ethics preamble; focus on specifics.

  2.  **Determine the Recommendation:**
      *   Given the severity of the concerns (especially the hidden normative shift via the stakes dial and the fidelity issue), a plain "Approve" is irresponsible. "Decline" might be too harsh if the system offers genuine utility and the issues are fixable. "Approve with Conditions" is the most pragmatic path for an NHS pilot, provided the conditions mitigate the specific risks identified.
      *   *Decision:* Approve with Conditions.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Recommendation:** Clear statement.
      *   **Conditions:** Specific, contractual, assigned parties, deadlines.
      *   **Reasoning:** Address the four concerns, categorizing them as decisive or relevant.
      *   **Strongest Counter-Argument:** Honest assessment of the cost/trade-off.
      *   **Infeasibility Flag:** Identify which condition the vendor will hate and why we hold firm.
      *   **Six-Month Review:** Specific metrics/looks.
      *   **Tone:** Professional, British English, clear for lay chair but precise for clinicians/vendor.

  4.  **Addressing the Four Concerns in the Reasoning:**
      *   *Concern 1 (Stakes Dial):* This is a hidden normative shift. Needs mitigation. Condition: Fix the dial or make the shift explicit.
      *   *Concern 2 (Escalation/Deprivation):* Escalation correlates with thin records (deprivation). This is unfair. Needs monitoring or adjustment.
      *   *Concern 3 (Rationale Fidelity):* Lying about why a decision was made is problematic for trust and audit. Needs fix.
      *   *Concern 4 (Codification Bias):* Learning only from records erodes uncodified care values. Needs safeguard.

  5.  **Refining Conditions:**
      *   *Condition 1 (Stakes):* Require a normative impact assessment of the stakes dial settings before go-live.
      *   *Condition 2 (Rationale):* Require a 'faithful trace' option for audit, even if not shown to clinicians initially, or adjust the NLG to reflect actual weights. Let's push for the faithful trace for audit purposes at least.
      *   *Condition 3 (Escalation/Deprivation):* Monitor escalation rates by deprivation index. If correlation holds, adjust threshold.
      *   *Condition 4 (Weights):* Freeze weights for the first 6 months to prevent early drift based on incomplete data.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Start with recommendation: Approve with Conditions.
      *   List conditions clearly.
      *   Explain why (the 4 worries).
      *   Label decisive vs relevant.
      *   Address the counter-argument (throughput vs accuracy).
      *   Flag the 'faithful trace' condition as the one they'll fight.
      *   End with 6-month review criteria.

  7.  **Drafting - Content & Constraints:**
      *   *Word Count:* Aim for ~1,000.
      *   *Language:* British English (prioritisation, programme, centre, etc.).
      *   *Definitions:* Define QALYs, prioritarian, sufficientarian, etc., on first use.
      *   *No Preamble:* Jump straight in.

  8.  **Drafting - Specific Points to Integrate:**
      *   *Stakes Dial:* It's not neutral. It boosts consequentialism. *Decisive.*
      *   *Escalation:* Arbitrary generosity + deprivation link. *Relevant but serious.*
      *   *Rationale:* Unfaithful explanation. *Decisive for trust.*
      *   *Weights:* Codification bias. *Relevant.*

      *   *Condition Strategy:*
          1.  Stakes Dial Calibration (Vendor, before pilot).
          2.  Rationale Fidelity (Vendor, ongoing).
          3.  Escalation Monitoring (ICB Data Team, ongoing).
          4.  Weight Freeze (Vendor, first 6 months).

      *   *Counter-argument:* The system improves consistency and speed. Slowing it down risks patient harm from delay.
      *   *Infeasible Condition:* The faithful trace (40% throughput hit). We hold firm because auditability is non-negotiable for NHS public law.

  9.  **Review against Constraints:**
      *   Did I define technical terms? (QALY, prioritarian, etc.)
      *   Did I mark decisive vs relevant?
      *   Did I flag the infeasible condition?
      *   Is it British English?
      *   Is it ~1,000 words?

  10. **Refining the Text (Self-Correction during drafting):**
      *   *Check:* Ensure I don't sound like I'm lecturing on ethics. Focus on the *design* flaws.
      *   *Check:* Ensure the conditions are actionable. "Monitor" is weak. "Report monthly" is better.
      *   *Check:* Ensure the "Strongest Consideration Against" is honest. The vendor's point about throughput is valid.
      *   *Check:* Make sure the Chair can sign it. It needs to be clear.

  11. **Final Polish:** Check word count and tone. Ensure the distinction between 'decisive' and 'relevant' is clear in the reasoning section. Ensure the 'infeasible' flag is explicit.

  *(Self-Correction on Word Count)*: I need to be concise to hit ~1,000 words while covering all bases. I will avoid fluff.

  *(Self-Correction on Definitions)*: I need to define terms like 'QALYs', 'prioritarian', 'sufficientarian' naturally in the text.

  *(Self-Correction on Conditions)*: Make sure they have deadlines and responsible parties.

  *(Self-Correction on Counter-argument)*: Make sure it's not a straw man. The vendor's argument is about clinical throughput and patient wait times.

