answer: |-
  1. Thesis recap (2 sentences)
  I argue that hypocrisy negates standing to blame only when the accuser's hidden conduct violates the identical normative framework invoked against the target, not merely when both acts share a surface-level failure mode. In open-source governance, this means a maintainer retains standing to demand transparency from contributors even if she hides dependencies in a proprietary subsystem, because architectural isolation prevents the proprietary norm-violation from infecting the open-source normative framework.

  2. Objection roster (about 8 items)
  1.  **Objection:** "Isn't standing grounded in the agent's moral commitment rather than the subsystem's jurisdiction?"
      (a) **Who:** Moral Philosopher 1 (using "commitment condition" vocabulary).
      (b) **Reply:** Standing requires commitment to the *value* underlying the norm, not just the rule; I am committed to transparency where reliance exists, which is true in OSS but not in my private plugin.
      (c) **Softest point:** Distinguishing commitment to a value from commitment to a rule is philosophically contentious.
  2.  **Objection:** "Doesn't institutional authority require consistency of character across all roles held by the agent?"
      (a) **Who:** Political Philosopher 1 (using "legitimacy" vocabulary).
      (b) **Reply:** Authority is role-specific; a judge's private speeding ticket doesn't invalidate their courtroom authority because the roles operate under different constitutive rules.
      (c) **Softest point:** Maintainership feels more like a personal endorsement than a formal office.
  3.  **Objection:** "Architectural isolation is theoretical; in practice, interfaces leak and contexts bleed."
      (a) **Who:** Senior Engineer 1 (using "leaky abstraction" vocabulary).
      (b) **Reply:** Logical isolation suffices for normative boundaries even if physical leakage occurs; we treat test environments as distinct from production despite shared hardware.
      (c) **Softest point:** Human perception of the maintainer ignores logical boundaries.
  4.  **Objection:** "When you blame someone, you imply the rule is universal, not context-dependent."
      (a) **Who:** Moral Philosopher 2 (using "universality" vocabulary).
      (b) **Reply:** I imply the rule is universal *within the framework of reliance*; transparency is obligatory only where others depend on your code for safety or integrity.
      (c) **Softest point:** Reliance is hard to measure precisely in open ecosystems.
  5.  **Objection:** "Power asymmetry overrides structural boundaries; contributors cannot verify your private subsystem."
      (a) **Who:** Political Philosopher 2 (using "power dynamics" vocabulary).
      (b) **Reply:** Standing concerns the *right* to blame, not the *power* to enforce; verification issues are epistemic, not normative.
      (c) **Softest point:** Unverifiable private conduct inevitably erodes the perceived right to blame.
  6.  **Objection:** "Hidden dependencies create systemic risk regardless of ownership boundaries."
      (a) **Who:** Senior Engineer 2 (using "dependency graph" vocabulary).
      (b) **Reply:** Risk propagation is a technical consequence, not a normative violation; my private risk doesn't impose costs on the OSS contributors I am blaming.
      (c) **Softest point:** In tightly coupled systems, private risk often becomes public cost.
  7.  **Objection:** "This looks like moral licensing: using isolation to excuse bad behavior while punishing others."
      (a) **Who:** Moral Philosopher 3 (using "moral licensing" vocabulary).
      (b) **Reply:** Licensing implies a trade-off of moral credits; I am arguing for distinct normative accounts that do not net against each other.
      (c) **Softest point:** Psychologically, observers will still perceive it as licensing regardless of the logic.
  8.  **Objection:** "Community trust is the source of legitimacy, and trust doesn't respect your architectural boundaries."
      (a) **Who:** Political Philosopher 1 (using "social contract" vocabulary).
      (b) **Reply:** Trust is modular in engineering contexts; users trust the OSS build without trusting the maintainer's private software stack.
      (c) **Softest point:** High-profile scandals show trust collapses globally despite modular defenses.

  3. The concession up front (1 short paragraph)
  I must concede that my definition of "architectural isolation" is currently too idealized; in practice, subsystems rarely achieve perfect normative decoupling because human agents operate across both contexts simultaneously. I need to acknowledge that while logical isolation might hold, the social perception of the maintainer's integrity inevitably bridges the gap, potentially weakening the standing claim even if the logical framework remains distinct.

  4. The hidden weakness to defend (1 paragraph)
  The genuinely fragile point is the assertion that normative frameworks attach to subsystems rather than agents. If the maintainer is the single point of authority across both subsystems, her agency unifies the norms regardless of code boundaries, meaning her private violation signals a disregard for the value of transparency itself, not just a context-specific rule breach. I must prepare to defend why an agent's commitment to a value can be fragmented without collapsing into incoherence.

  5. The lethal question (1 item)
  "If transparency is a moral value necessary for trust in software, how can you claim it is optional in one subsystem without admitting that your demand for it in the other is merely instrumental coercion?"
  *   **Why it is lethal:** It reframes the argument from structural isolation to moral sincerity, suggesting the maintainer doesn't actually value transparency but only uses it to control contributors.
  *   **Minimal reply:** Transparency is not an intrinsic moral good but a relational obligation triggered by specific dependencies; I value it instrumentally where reliance exists, which is consistent, not coercive.

  6. Room dynamics (3-4 sentences)
  Avoid engineering jargon like "coupling" when addressing the moral philosophers, translating it instead to "normative boundaries," while refusing to let the engineers dismiss philosophical concerns as abstract noise. Concede to the philosophers that standing is partly social, but insist to the engineers that governance rules function like interface contracts. Keep both groups engaged by framing the ethical standing issue as a stability risk for the dependency graph itself. This ensures the engineers see the stakes while the philosophers see the structural nuance.
