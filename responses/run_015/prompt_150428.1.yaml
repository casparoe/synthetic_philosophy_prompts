prompt: |-
  Right — you're acting as a professional philosopher of politics and I want you to think carefull before writing. First do some quick brainstorming on paper (well, in your head). Then compare two theories of democratic trust: the Scandinavian 'high-trust social contract' model, where citizens treat government as a shared risk-pool, and the American 'Madisonian suspicion' model, where legitimacy comes from deliberately fragmented power. Now here's the twist that should make this less generic: apply the idea of 'epistemic dependency' — citizens relying on state institutions for knowledge they can't verify themselves — to both. Given that modern governance forces massive epistemic dependency (climate data, epidemiology, economic forecasting), which attitude — Scandinavian trust or American suspicion — is actually the more reasonable one? Write it for a smart undergraduate, about 600 words, dead casual tone is fine. Dont give me a bibliography or citation list; I want your argument, not a literature review. Be honest about where your reasoning gets shaky.
reasoning: |-
