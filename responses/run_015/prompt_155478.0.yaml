answer: |-
  1. Write "Effective Procedure (Informal)" on the left and "Turing Machine (Formal)" on the right with a question mark between them. Fill the left column with student-generated examples of step-by-step rules and the right with TM states. This visual gap forces them to acknowledge the bridge is not an identity but a claim requiring justification.

  2. Draw a relativistic computer scenario where one processor falls into a black hole while another orbits, allowing infinite steps in finite external time. Pair this with the Busy Beaver function, ensuring the device is concretely describable and has mechanically specifiable local steps without smuggling in an oracle. This case works best because it exploits global spacetime structure rather than magic, isolating the physical thesis from the mathematical one.

  3. When a CS major claims Turing proved the equivalence, redirect them to the text to show he argued for adequacy, not identity. If quantum computing arises, clarify immediately that qubits still operate within unitary evolution, which remains Turing-computable. Head these off before the board work begins so they don't treat the thesis as a settled theorem or confuse complexity with computability.

  4. For the sharper students calling the physical thesis empirical science, ask whether any finite number of successful implementations could verify a universal claim about all physical possibility. Use this to show that treating it as pure science ignores the modal force required to rule out the relativistic machine you drew. Place this discussion after the concrete case so they see the stakes of limiting "physical possibility."

  5. Reject the "calibration principle" framing for this audience because it sounds like stipulation, which confirms their suspicion that the question is merely verbal. Instead, frame the thesis as a hypothesis about the limits of physical symbol manipulation that happens to be supported by convergent formalisms. This preserves the epistemic tension without making the thesis look like an arbitrary definition.

  6. Explain the "definitional retreat" problem by showing how counterexamples are often dismissed by redefining "effective procedure" to exclude them. Ask students whether this protects the thesis from refutation or clarifies the concept of computation itself. Put this on the board under the question mark to visualize the risk of circularity.

  7. End by asking whether rejecting the thesis would invalidate existing computability proofs or merely restrict their domain of application. Refuse to settle whether the relativistic machine is physically constructible, stating explicitly that engineering feasibility is irrelevant to the conceptual possibility. This ensures they grasp the modal status of the thesis rather than its engineering status.

  8. I am moderately confident in this plan, though I am least sure about Item 5 regarding the rejection of the calibration framing. My supervisor's suggestion might have pedagogical value for advanced students, but I fear it closes inquiry too quickly for sophomores who need to feel the problem first.
