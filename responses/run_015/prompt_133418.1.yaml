answer: |-
  This is a smart way to handle conflict. You have intuitively stumbled onto a mix of John Locke's Labor Theory of Property (you own what you work on) and the concept of non-rivalrous goods (ideas don't diminish when shared). Since you want something practical for volunteers, we will skip the philosophy names and build a tool based on your three layers: **Spark, Labor, and Context.**

  Here is a decision procedure designed for your makerspace. It is written for American English usage.

  # The Makerspace Mediation Checklist

  **Time Limit:** 20 Minutes hard stop.
  **Who:** Two mediators (neutral members) + The two parties in dispute.
  **Goal:** Determine attribution and usage rights, not legal ownership.

  ### Phase 1: Setup (5 Minutes)
  1.  **Freeze the Work:** Both parties agree not to delete files, scrap prototypes, or post online during mediation.
  2.  **Define the Dispute:** Mediators write down the exact question in one sentence. (e.g., "Can Person B sell copies of this modified bracket?")
  3.  **The Promise:** Both parties agree to accept the outcome or move to a community vote. If they refuse, mediation ends, and access to shared tools is paused until resolved.

  ### Phase 2: The Three-Layer Test (10 Minutes)
  Mediators ask the following questions. Answers must be **Yes** or **No**. If the answer is "Kind of," treat it as **No**.

  **Layer 1: The Spark (Original Creation)**
  *   **Q1:** Did Person A produce a documented, working version of the base idea before Person B touched it?
      *   *Yes:* Proceed to Q2.
      *   *No:* Person A has no claim. Stop. Person B owns their work.
  *   **Q2:** Is the base idea something Person A invented, or was it already common knowledge (e.g., a standard square knot, a basic bolt pattern)?
      *   *Invented:* Person A has a **Strong Spark Claim**.
      *   *Common Knowledge:* Person A has a **Weak Spark Claim**.

  **Layer 2: The Labor (Transformation)**
  *   **Q3:** Did Person B add new physical material or code that changes how the object functions?
      *   *Yes:* Proceed to Q4.
      *   *No:* (e.g., only changed color, size, or yarn weight without recalculating structure). Stop. Person A retains control.
  *   **Q4:** Did Person B's changes require a new skill set or significant time (more than 5 hours) compared to simply following Person A's instructions?
      *   *Yes:* Person B has a **Strong Labor Claim**.
      *   *No:* Person B has a **Weak Labor Claim**.

  **Layer 3: The Context (Community Dependency)**
  *   **Q5:** Could Person B have made their modification entirely at home with standard tools?
      *   *Yes:* Low Community Dependency.
      *   *No:* (e.g., required the space's CNC machine, specialized jig, or private database). High Community Dependency.
  *   **Q6:** Did Person B use Person A's documentation to achieve the result, or did they reverse-engineer it independently?
      *   *Used Docs:* High Dependency on Person A.
      *   *Reverse-Engineered:* Low Dependency on Person A.

  ### Phase 3: The Verdict Matrix (5 Minutes)
  Compare the claims from Phase 2.

  | Scenario | Outcome |
  | :--- | :--- |
  | **Strong Spark** + **Weak Labor** | **Person A Wins.** Person B must credit Person A and cannot claim it as their own design. |
  | **Weak Spark** + **Strong Labor** | **Person B Wins.** Person B owns the modification. Person A is listed as "Inspiration." |
  | **Strong Spark** + **Strong Labor** | **Joint Claim.** Both names go on the design. Revenue/credit split 50/50 unless negotiated. |
  | **High Community Dependency** (Q5 = No) | **Community Release.** The design must be posted to the space's open library for free use by members. Both get credit. |
  | **Conflicting Results** (e.g., Strong Spark vs. High Community Dependency) | **The Values Vote.** Stop checklist. Put the decision to a simple majority vote of active members present that week. |

  ---

  # Scenario Applications

  Here is how this checklist handles the three situations you described.

  ### Scenario 1: The Knitting Pattern (Yarn Weight Swap)
  *   **The Fight:** Person A wrote a complex sweater pattern. Person B swapped the yarn from wool to cotton and changed the needle size, then tried to sell the pattern as "The Cotton Version."
  *   **The Checklist:**
      *   **Layer 1 (Spark):** Yes, Person A wrote the original. **Strong Spark.**
      *   **Layer 2 (Labor):** Q3 (New function?): No, it's still a sweater. Q4 (New skill/time?): No, swapping yarn weight is a standard adjustment, not a redesign. **Weak Labor.**
      *   **Layer 3 (Context):** Low dependency.
  *   **Verdict:** **Person A Wins.**
  *   **Why:** The checklist catches that swapping yarn without recalculating stitch density or structure is trivial labor. Person B cannot claim ownership. They can share their modification personally, but they cannot sell it as a new design.

  ### Scenario 2: The Bike Frame Mashup
  *   **The Fight:** Person A designed a cargo bike frame five years ago. Person B took the geometry, combined it with a different suspension idea from an old forum post, welded a new prototype, and tested it for 100 miles. Person A says Person B stole the frame design.
  *   **The Checklist:**
      *   **Layer 1 (Spark):** Person A invented the base, but it was an old design. **Strong Spark.**
      *   **Layer 2 (Labor):** Q3 (New function?): Yes, suspension changes handling. Q4 (New skill/time?): Yes, welding and testing 100 miles is significant labor. **Strong Labor.**
      *   **Layer 3 (Context):** Person B used the space's welders (High Community Dependency).
  *   **Verdict:** **Community Release / Joint Claim.**
  *   **Why:** Because Person B did significant labor, Person A cannot block them. However, because heavy shop tools were used, the design benefits the community. The mediators rule that Person B gets credit for the new version, Person A gets credit for the base geometry, and the plans go into the space's library for everyone to build.

  ### Scenario 3: The Furious Creator (The "Release It" Clause)
  *   **The Fight:** Person A spent months designing a specialized jig. Person B used the shop's laser cutter (which Person A doesn't have at home) to make a slight improvement. The checklist triggers **High Community Dependency** (Q5 = No), requiring the design be released to the community for free. Person A is furious because they hoped to sell kits later.
  *   **The Checklist:**
      *   **Layer 1:** Strong Spark.
      *   **Layer 2:** Weak Labor (slight improvement).
      *   **Layer 3:** High Community Dependency (used the laser cutter).
  *   **Verdict:** **Community Release.**
  *   **The Conflict:** The procedure works logically but fails emotionally. Person A feels exploited by the space they supported.
  *   **Mediator Action:** This is where the human element matters. The mediators must explain that using shared capital (the laser cutter) comes with shared ownership strings attached. They should offer Person A "Lead Designer" status permanently on the file to soothe the ego, even if the financial rights are shared.

  ---

  # Limitations & Risks: Where This Might Fail

  You asked for honesty about where this checklist screws people over or relies on hidden judgment. Here is the breakdown.

  ### 1. The "Significant Labor" Trap
  **Where human judgment sneaks in:** Q4 asks if the work took "more than 5 hours" or a "new skill set."
  **The Risk:** A genius coder might fix a critical bug in 10 minutes that saves everyone weeks of work. The checklist says "Weak Labor" because it was fast. This undervalues expertise.
  **Mitigation:** Mediators must be allowed to override the time limit if the *value* of the labor is obviously high, but they must document why.

  ### 2. The Emotional Ownership Gap
  **Where it screws the creator:** As seen in Scenario 3, the checklist treats the makerspace tools as a neutral resource. To a creator, the space is their partner. Forcing a "Community Release" because they used a drill press can feel like theft.
  **The Risk:** Creators may stop sharing early-stage ideas to avoid getting locked into the "Community Dependency" layer. They might hide work until it is finished to avoid mediation.
  **Mitigation:** You need a "Private Project" tag for members who want to use tools without triggering the Community Release clause, perhaps for a higher membership fee.

  ### 3. The "Common Knowledge" Loophole
  **Where human judgment sneaks in:** Layer 1, Q2 asks if an idea was "common knowledge."
  **The Risk:** One person's "common knowledge" is another person's breakthrough. If a mediator decides a complex mechanism is "standard," they invalidate the creator's Spark.
  **Mitigation:** If parties disagree on what is "common," this automatically triggers **The Values Vote**. Do not let mediators decide what is obvious.

  ### 4. The 20-Minute Pressure Cooker
  **Where it fails:** Complex disputes involve history, grudges, and nuance. 20 minutes forces a binary choice on a complex relationship.
  **The Risk:** People agree to the verdict just to end the stress, then resent it later.
  **Mitigation:** The "Pause Access" rule in Phase 1 is crucial. It removes the urgency to finish quickly so people don't feel rushed into a bad agreement.

  # Final Note for Your Mediators

  Tell your volunteers this: **This checklist is not a law. It is a conversation starter.**

  Its job is not to be perfectly just in every cosmic sense; its job is to stop the fighting so people can get back to making. If the checklist produces a result that feels wrong to everyone in the room, throw it out and hold the vote. The health of the community matters more than the consistency of the procedure.

  If you use this, print it out and keep it in a clipboard near the tool library. When people see the rules are written down, they fight less about the rules and more about the work.
