prompt: |-
  I write about science and ideas for a national newspaper, and our standards desk has asked me to run a forty-five-minute session for the newsroom before we decide whether to trial an automated fact-checking tool. The room will be about fourteen editors and reporters, none of whom has taken a probability course; two are reflexively hostile to anything with numbers in it; and our standards editor reads enough statistics to catch me if I hand-wave. I have a whiteboard and nothing else.

  The occasion is a vendor pitch. The tool queries the same underlying language model five times under five different prompt framings, treats the five answers as a panel of "jurors," and returns the majority verdict. The deck claims the arrangement is licensed by Condorcet's jury theorem and closes with a slide about the wisdom of crowds. I think the pitch is wrong in a way that is worth teaching rather than just asserting, and I would like a plan for how to teach it — not the explanation written out for me.

  What I need is the sequence and the reason for it: which idea has to be in place before the next one means anything, and why. My instinct is that per-juror competence above chance has to come before the asymptotic result, and that the independence condition has to be stated as independence conditional on the truth rather than as "they don't talk to each other" — but tell me where I have the order wrong.

  I also want one concrete case to carry the whole session, and I want you to say what such a case must have and what it must lack. My candidate is a photograph that arrives with a claim about where and when it was taken — a binary question with a fact of the matter. I take it the example needs genuine ground truth and genuinely separate private signals, and must not be the kind of editorial judgment (is this story worth the space, is this headline fair) where there is no correct answer for the theorem to track.

  Here are the misconceptions I expect, in rough order of how loudly they will be voiced: that the theorem shows more heads are always better, when below-chance competence inverts it; that 51% accuracy plus enough jurors gets you anywhere soon; that our five model calls are five jurors; and that this has something to do with Condorcet's paradox about cycling majorities, which a couple of people will have half-remembered. Tell me which of these I am missing, which one is actually the load-bearing error, and at exactly what point in the sequence each should be headed off — including the place where the vendor's slide should collapse.

  The idea I most want placed well is this: each juror's signal can be treated as part private and part drawn from a common source, and as the common share grows the effective number of independent jurors falls toward one no matter how many heads you count. I want the plan to say where that decomposition goes, what it does to the five-calls-from-one-model picture, and how to convey it without a formula on the board. It should also note, in passing, that when competence varies the sensible weight is roughly the log-odds of each juror's accuracy, so five equally weighted samples from one model are misweighted twice over — and that if the tool ever reports confidence scores rather than verdicts, majority voting is the wrong aggregator regardless.

  Give me one question to end on that tells me whether the idea landed rather than whether they enjoyed the session — something like handing them a variant case and asking what the theorem does and does not say about it.

  Finally, tell me what to refuse to explain at this level and say so out loud: I assume the asymptotic argument itself, and I suspect the base-rate arithmetic (a checker that is right 90% of the time on a stream where only a small share of items are false will still mostly cry wolf) deserves its own session and should be named and declined rather than squeezed in.
reasoning: |-
  Here's a thinking process that leads to the suggested session plan:

  1.  **Analyze the Request:**

      *   **User:** Science/ideas writer for a national newspaper.
      *   **Audience:** 14 editors/reporters (no probability background, 2 hostile to numbers, 1 standards editor who knows stats).
      *   **Context:** 45-minute session before trialing an automated fact-checking tool.
      *   **Tool:** Queries one LLM 5 times with 5 prompts, takes majority vote. Claims Condorcet's Jury Theorem (CJT) + Wisdom of Crowds.
      *   **Goal:** Teach *why* the pitch is likely wrong, not just assert it. Provide a sequence/structure, not a script.
      *   **Key Concepts to Cover:**
          *   Per-juror competence > 0.5 (crucial).
          *   Independence (conditional on truth, not just "no talking").
          *   Common source of error (correlated errors kill independence).
          *   Weighting (log-odds vs. equal weight).
          *   Distinction from Condorcet's Paradox.
          *   Base rates (to be explicitly excluded).
      *   **Example:** A photo verification case (binary, ground truth exists).
      *   **Misconceptions to Address:** "More heads always better," "51% + N gets you there," "5 calls = 5 jurors," "Condorcet Paradox confusion."
      *   **Ending:** A diagnostic question to check understanding.
      *   **Constraint:** Whiteboard only. No formulas.

  2.  **Deconstruct the Logic & Sequence:**

      *   *User's Instinct:* Competence > chance before asymptotic result. Independence conditional on truth.
      *   *My Assessment:* The user is right. If $p < 0.5$, more voters make it *worse*. If errors are correlated, $N_{effective} \approx 1$.
      *   *Sequence:*
          1.  Define the Goal (Truth, not consensus).
          2.  Define the Mechanism (Voting).
          3.  Condition 1: Competence (The $p > 0.5$ threshold).
          4.  Condition 2: Independence (The correlation trap).
          5.  Application to the Tool (Why 5 LLM calls $\neq$ 5 Jurors).
          6.  Nuance: Weighting & Confidence.
          7.  Exclusions (Base rates, Asymptotic proofs).
          8.  Diagnostic Question.

  3.  **Develop the Concrete Case (The Photo):**

      *   *Requirements:* Binary (Real/Fake or Location A/Location B), Ground Truth, Private Signals possible.
      *   *Candidate:* A photo claiming to show "Protest in Paris, Yesterday."
      *   *Must Have:* Verifiable metadata/shadows/landmarks (Ground Truth).
      *   *Must Lack:* Editorial judgment (is it newsworthy?).
      *   *Why this works:* It allows for "private signals" (one editor checks shadows, one checks metadata, one checks reverse image search).
      *   *Why the Tool fails here:* The LLM calls all access the same training weights (common source of error). They aren't looking at the photo differently; they are processing the same pixels through the same mathematical brain.

  4.  **Address Misconceptions & Timing:**

      *   *Misconception 1: "More heads always better."* -> Address immediately after introducing voting. Show the $p < 0.5$ flip.
      *   *Misconception 2: "51% + N = Truth."* -> Address when discussing convergence speed (it's slow) and independence.
      *   *Misconception 3: "5 Calls = 5 Jurors."* -> This is the core. Address during the Independence section. This is where the vendor slide collapses.
      *   *Misconception 4: "Condorcet's Paradox."* -> Address early to clear the air. Paradox = Cycling preferences (A>B>C>A). Theorem = Binary truth tracking. Different things.
      *   *Load-Bearing Error:* The Independence/Correlation assumption. If errors are correlated, the theorem doesn't apply regardless of $N$ or $p$.

  5.  **Drafting the Plan (Iterative refinement):**

      *   *Intro:* Set the stage. Distinguish Paradox vs. Theorem.
      *   *Step 1 (Competence):* Use the whiteboard. Draw a coin. If the coin is biased *against* truth, adding flips hurts.
      *   *Step 2 (Independence):* This is the hard part without formulas. Use the "Common Cause" analogy. If everyone reads the same wrong wire story, they aren't independent.
      *   *Step 3 (The Tool):* Apply Step 2 to the LLM. Same weights = Same bias = Correlated errors.
      *   *Step 4 (Weighting):* Briefly mention that not all jurors are equal.
      *   *Step 5 (Exclusions):* Explicitly state what we aren't doing (Base Rates, Proofs).
      *   *Step 6 (The Test):* A variant case.

  6.  **Refining the "Independence without Formulas" Challenge:**

      *   How to explain $P(Error_i \cap Error_j) \neq P(Error_i)P(Error_j)$ without math?
      *   *Idea:* The "Shared Textbook" analogy. If 5 students take a test but studied the same textbook with a typo on page 10, they will all get Question 10 wrong. They didn't copy off each other (no talking), but they aren't independent.
      *   *Application:* The LLM weights are the textbook.

  7.  **Refining the Diagnostic Question:**

      *   Needs to test if they understand *correlation* vs. *count*.
      *   *Scenario:* 5 human editors vs. 5 LLM calls.
      *   *Twist:* The 5 humans all used the *same* flawed reverse-image-search tool.
      *   *Question:* Which panel is more reliable? (Answer: Neither, both suffer from common source error). Or better: "We have 5 editors. 3 say Real, 2 say Fake. But all 3 'Real' voters looked at the same metadata field which turned out to be spoofable. Does the majority verdict hold?"

  8.  **Final Review against Constraints:**

      *   45 minutes? Yes, the scope fits.
      *   Whiteboard only? Yes, rely on diagrams/analogies.
      *   Hostile to numbers? Keep arithmetic minimal (just >50% vs <50%).
      *   Standards Editor? Ensure rigor on "conditional independence."
      *   Vendor Slide Collapse? Pinpoint exactly where (Independence section).

  9.  **Constructing the Output:** (Organizing into the requested sections: Sequence, Case, Misconceptions, The "Common Source" Idea, The Ending, The Refusals).

      *   *Self-Correction on Sequence:* Make sure to distinguish Condorcet's *Paradox* from *Theorem* right at the start. It's a low-hanging fruit that builds credibility with the standards editor.
      *   *Self-Correction on Weighting:* Keep it brief. It's a "passing note" per the prompt. Don't let it derail the main independence argument.
      *   *Self-Correction on Base Rates:* Explicitly list this in the "Refusals" section as requested.

  10. **Final Polish:** Ensure tone is professional, directive, and respects the user's expertise (they know the stats, they need the *pedagogy*).

  *(Self-Correction during drafting)*: Wait, the prompt asks for "one concrete case to carry the whole session." I need to make sure the Photo example is woven through *every* stage, not just introduced once.
  *   Stage 1 (Competence): Can the editors/LLM identify the photo location better than a coin flip?
  *   Stage 2 (Independence): Do the 5 LLM calls look at different features, or the same weights?
  *   Stage 3 (Weighting): Should the editor who knows geography count more than the intern?

  Okay, let's write the plan.cw
answer: |-
  Here is the session plan, structured by sequence, case design, misconception management, and boundaries.

  ### I. The Sequence (45 Minutes)

  **1. Distinguish the Theorems (5 mins)**
  *   **Goal:** Clear the air on Condorcet.
  *   **Action:** Draw two columns on the whiteboard. Left: "Condorcet's Paradox." Right: "Condorcet's Jury Theorem."
  *   **Content:** Paradox is about cycling preferences (A>B>C>A) in elections with no single truth. Theorem is about binary truth-tracking (Guilty/Innocent, Real/Fake).
  *   **Why first:** The vendor deck likely conflates "Wisdom of Crowds" (averaging estimates) with Jury Theorem (binary voting). You must establish that we are hunting a *fact*, not averaging an *opinion*. If they think this is about preferences, the math doesn't apply at all.

  **2. The Competence Threshold (10 mins)**
  *   **Goal:** Establish that $p > 0.5$ is a prerequisite, not a result.
  *   **Action:** Use the Photo Case (see below). Ask: "If our tool is wrong 60% of the time, does asking it five times help?"
  *   **Whiteboard:** Draw a scale. Tip it left for "Worse than Coin," tip it right for "Better than Coin."
  *   **Key Point:** If competence is below 50%, the majority verdict converges on *falsehood* as $N$ increases. More heads are not better; they are dangerous.
  *   **Why here:** This kills the "more is always better" misconception before you discuss independence. It forces the room to admit we don't actually know the LLM's base competence on *this specific task*.

  **3. The Independence Trap (20 mins) — *The Core***
  *   **Goal:** Demonstrate that 5 calls from 1 model $\neq$ 5 independent jurors.
  *   **Action:** Decompose the "signal."
  *   **Whiteboard:** Draw a Juror. Draw a circle inside them labeled "Private Knowledge" and a circle labeled "Common Source."
  *   **The Move:** Explain that independence requires errors to be uncorrelated *conditional on the truth*. It is not enough that they "don't talk." They must not *think* alike.
  *   **Application:** The 5 LLM calls share the same weights (the Common Source). If the weights encode a bias about geography or lighting, all 5 calls inherit it.
  *   **Vendor Collapse:** This is where you explicitly dismantle the vendor slide. The "panel of jurors" is actually one juror talking to a mirror five times. The effective $N$ is not 5; it is 1 (plus noise).
  *   **Why here:** This is the load-bearing error. Even if competence is 90%, correlated errors prevent the probability from converging to 1.

  **4. Weighting and Confidence (5 mins)**
  *   **Goal:** Note that equal weighting is suboptimal.
  *   **Action:** Briefly state that if one editor is a geospatial expert and another is an intern, weighting them equally reduces accuracy.
  *   **Key Point:** Optimal weighting is log-odds of accuracy. Since the tool weights 5 identical calls equally, it is misweighted. If it output confidence scores, majority vote is the wrong aggregator anyway (you should sum log-odds).
  *   **Why here:** It reinforces that the tool is statistically naive, but keep it brief so you don't lose the non-math audience.

  **5. The Diagnostic (5 mins)**
  *   **Goal:** Test retention.
  *   **Action:** Pose the variant case (see Section V).
  *   **Why last:** Immediate application confirms whether the concept of "common source error" landed.

  ---

  ### II. The Concrete Case: The Geolocated Photograph

  **The Scenario:** A wire photo arrives claiming to show "Flooding in Venice, Today." The binary fact is: *Is this Venice, and is it today?*

  **What It Must Have:**
  1.  **Ground Truth:** There must be a verifiable answer (e.g., shadows indicate Northern Hemisphere winter, but Venice is in summer; or a landmark proves it is actually Rotterdam).
  2.  **Separate Signals:** Verification requires distinct checks (metadata, shadow analysis, reverse image search, landmark recognition).
  3.  **Binary Output:** The tool must output "Verified" or "Unverified," not a summary.

  **What It Must Lack:**
  1.  **Editorial Judgment:** Do not use "Is this newsworthy?" or "Is the headline fair?" There is no truth value for the theorem to track.
  2.  **Ambiguity:** Do not use a case where the ground truth is unknowable (e.g., "Did the source intend to deceive?").

  **How to Use It:**
  *   **Competence:** Ask the room, "If we ask the LLM to check shadows, is it better than a coin flip?" (If we don't know, we can't use the theorem).
  *   **Independence:** Ask, "When the tool queries the model five times, does the second query know something the first didn't?" (No. They draw from the same weight matrix. If the model thinks 'canals = Venice', it will say 'Venice' five times, even if the canals are in Rotterdam).

  ---

  ### III. Misconceptions & Intervention Points

  | Misconception | Load-Bearing? | Intervention Point | How to Head It Off |
  | :--- | :--- | :--- | :--- |
  | **"More heads are always better"** | **Yes.** | **Step 2 (Competence).** | Show the $p < 0.5$ inversion. If the juror is systematically biased, $N \to \infty$ guarantees error. |
  | **"51% + N gets you there soon"** | No. | **Step 2 (Competence).** | Mention convergence is slow (requires large $N$), but don't dwell on the math. Focus on the threshold. |
  | **"5 Model Calls = 5 Jurors"** | **Yes.** | **Step 3 (Independence).** | **This is the vendor slide collapse.** Use the "Common Source" decomposition. Same weights = Correlated errors. |
  | **"Condorcet's Paradox"** | No. | **Step 1 (Intro).** | Distinguish early. Paradox = Cycling preferences. Theorem = Binary truth. Prevents confusion about what is being measured. |
  | **"Independence = No Talking"** | **Yes.** | **Step 3 (Independence).** | Clarify: Independence means *uncorrelated errors*, not physical silence. Two people reading the same wrong wire story are not independent. |

  **The Load-Bearing Error:**
  The assumption that **5 model calls = 5 independent jurors**.
  If this fails, the theorem is inapplicable regardless of competence. This is where you must spend the most time. The vendor's claim relies on the "Wisdom of Crowds" intuition that diversity of opinion is automatic; you must show that algorithmic diversity via prompt engineering does not create statistical independence of error.

  ---

  ### IV. Teaching "Common Source" Without Formulas

  **The Decomposition:**
  Do not write $P(E_1 \cap E_2)$. Instead, draw a **Funnel**.
  1.  **Top of Funnel:** The Truth (The Photo).
  2.  **Middle of Funnel:** The Signal. Split this into two streams.
      *   Stream A: **Private Noise** (Random guess, unique to that query).
      *   Stream B: **Common Bias** (The model's training weights).
  3.  **Bottom of Funnel:** The Verdict.

  **The Explanation:**
  "Imagine five editors verifying this photo. If they all use the *same* reverse-image-search tool, and that tool has a bug, all five will report the same wrong location. They didn't talk to each other. They are physically separate. But their *errors* are coupled because their *source* is coupled."

  **Application to the Tool:**
  "The LLM calls are the editors. The Weights are the buggy search tool. Prompt framing changes the *question*, but it does not change the *brain* answering it. If the brain has a blind spot, five phrasings won't fix it. The 'Common Source' stream swamps the 'Private Noise' stream. As the common share grows, the effective number of jurors falls to one."

  ---

  ### V. The Diagnostic Question

  **Do not ask:** "Did you understand that?" (They will say yes).
  **Do not ask:** "Was this useful?" (Irrelevant to accuracy).

  **Ask this:**
  "We have two panels verifying the Venice photo.
  **Panel A:** 5 human editors. Each checks a different clue (shadows, metadata, landmarks, etc.).
  **Panel B:** 5 human editors. Each checks the *same* metadata field using the *same* software tool.
  In both panels, 3 out of 5 vote 'Real.'
  **Question:** According to the Jury Theorem, which panel's majority verdict is more reliable, and why?"

  **Correct Answer:** Panel A. Panel B suffers from common-source correlation (the software tool). If the tool is wrong, all 5 are wrong together. The theorem assumes independent errors; Panel B violates this. Panel A approximates independence.

  **What this tells you:** If they choose Panel B, they think $N$ matters more than Independence. If they choose Panel A, they understand the correlation constraint.

  ---

  ### VI. What to Refuse to Explain

  You must explicitly name and decline two topics to protect the session's integrity and your credibility with the standards editor.

  **1. The Asymptotic Proof**
  *   **Say:** "I am not going to prove *why* the majority converges on truth as $N$ goes to infinity. That requires calculus and limits. We are taking the result as given to test the *conditions*."
  *   **Reason:** It consumes time and alienates the number-hostile staff without adding practical value for *this* decision.

  **2. Base Rate Neglect (The False Positive Problem)**
  *   **Say:** "I am also not covering Base Rates today. Even a 90% accurate checker will generate mostly false alarms if only 1% of submissions are fake. That is a Bayesian problem, not a Jury Theorem problem. It deserves its own session."
  *   **Reason:** This is the standards editor's trap. If you try to squeeze it in, you will confuse the Independence argument. Acknowledging it shows you know it exists, but declaiming it keeps the focus on the vendor's specific claim about *aggregation*.
