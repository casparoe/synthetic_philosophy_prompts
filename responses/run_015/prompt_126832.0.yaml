answer: |-
  # HANDOUT: The Accuracy-First Decision Tree

  **Root Commitment:** The epistemic standing of a doxastic state is determined by its accuracy (representation of the world); norms are derived from maximizing this value.

  **1. Domain of Evaluation**
  *What kind of mental state is being scored for accuracy?*
  *Illustration:* A single credence of 0.7 in rain vs. a binary belief that it will rain vs. a set of credences {0.6, 0.8}.
  *   **A. Precise Credences** (Go to 2)
  *   **B. Imprecise / Mushy Credences** (Go to 9)
  *   **C. Full Belief / Qualitative** (Go to 10)

  **2. Value Monism**
  *Is accuracy the sole epistemic good, or traded off against others (e.g., simplicity, caution)?*
  *Illustration:* Rejecting a highly accurate but complex credence function in favor of a simpler one.
  *   **A. Pure Accuracy** (Go to 3)
  *   **B. Pluralist Trade-offs** → **Leaf 1** [Prob: No] [Cond: No] [PP: No] [Uniq: Contextual]

  **3. Inaccuracy Aggregation**
  *Is total inaccuracy the sum of errors on individual propositions, or a property of the whole function?*
  *Illustration:* Credences 0.6 in *A*, 0.6 in *¬A*. Is error calculated per proposition then summed, or holistically?
  *   **A. Additive (Local)** (Go to 4)
  *   **B. Holistic (Global)** (Go to 8)

  **4. Propriety Strength**
  *Must the scoring rule strictly penalize non-probabilistic states, or merely avoid rewarding them?*
  *Illustration:* Comparing a probabilistic function against one that violates the laws of probability.
  *   **A. Strictly Proper** (Go to 5)
  *   **B. Weak / Improper** → **Leaf 2** [Prob: Unstable] [Cond: No] [PP: No] [Uniq: N/A]

  **5. Decision Principle**
  *Which rule selects the permitted states: ruling out dominated options or maximizing expected score?*
  *Illustration:* Choosing between two credence functions where one is better in some worlds, the other has higher average score.
  *   **A. State-Wise Dominance** (Go to 6)
  *   **B. Max Expected Accuracy** (Go to 7)

  **6. Diachronic Scope**
  *Does the framework govern only static coherence, or also belief change (updating)?*
  *Illustration:* Learning evidence *E* tomorrow. Does the norm constrain how you shift credences now?
  *   **A. Static Only** → **Leaf 3** (Perm) / **Leaf 4** (Uniq) [See Node 7 for split]
  *   **B. Dynamic / Updating** → **Leaf 5** (Perm) / **Leaf 6** (Uniq) [See Node 7 for split]

  **7. Prior Constraints**
  *Does evidence dictate a unique starting prior, or allow a range of permissible priors?*
  *Illustration:* Two agents with identical evidence but different initial credences in rain.
  *   **A. Permissive (Subjective)** → **Leaf 3** [Prob: Yes] [Cond: N/A] [PP: Weak] [Uniq: No]
      *   *(If Dynamic: **Leaf 5** [Prob: Yes] [Cond: Plan] [PP: Weak] [Uniq: No])*
  *   **B. Unique (Objective)** → **Leaf 4** [Prob: Yes] [Cond: N/A] [PP: Strong] [Uniq: Yes]
      *   *(If Dynamic: **Leaf 6** [Prob: Yes] [Cond: Strict] [PP: Strong] [Uniq: Yes])*

  **8. Partition Sensitivity***
  *Does the accuracy score change if the same possibility space is carved up differently?*
  *Illustration:* Partition {Rain, No Rain} vs. {Rain, Cloudy, Clear}. Should the norm depend on this choice?
  *   **A. Invariant** → **Leaf 7** [Prob: Yes] [Cond: Variable] [PP: Variable] [Uniq: Variable]
  *   **B. Sensitive** → **Leaf 8** [Prob: Contextual] [Cond: No] [PP: No] [Uniq: Contextual]

  **9. Imprecise Decision Rule***
  *How do we choose from a set of credence functions? (Admissibility vs. Maximin)*
  *Illustration:* Set of credences [0.4, 0.6] in rain. Do we pick any undominated one, or the safest one?
  *   **A. E-Admissibility** → **Leaf 9** [Prob: Set] [Cond: Generalized] [PP: Set] [Uniq: No]
  *   **B. Gamma-Maximin** → **Leaf 10** [Prob: Set] [Cond: Cautious] [PP: Cautious] [Uniq: No]

  **10. Belief Norm Target**
  *For full belief, is the goal logical consistency or closure under consequence?*
  *Illustration:* Believing *P* and *Q* but not believing *P & Q*.
  *   **A. Consistency Only** → **Leaf 11** [Prob: N/A] [Cond: N/A] [PP: N/A] [Uniq: No]
  *   **B. Closure + Consistency** → **Leaf 12** [Prob: N/A] [Cond: AGM] [PP: N/A] [Uniq: No]

  ---
  *\*Flagged Node: Choice involves formalism details (see Notes).*

  # INSTRUCTOR NOTES: Audit & Logical Space

  ### 1. Measure and Partition Sensitivity Audit
  *   **Node 8 (Partition Sensitivity):** This is often a choice of formalism rather than a philosophical commitment. Joyce (1998) originally assumed invariance; Pettigrew (2016) argues for refinement monotonicity.
      *   *Robustness:* **Leaf 7 (Invariant)** vindicates Probabilism robustly across Brier/Log scores. **Leaf 8 (Sensitive)** often fails to vindicate Probabilism universally; verdicts collapse if the partition is not fixed exogenously.
  *   **Node 4 (Propriety) & Measure Family:** The choice between Quadratic (Brier) and Logarithmic scoring rules is flagged here. Both are strictly proper.
      *   *Robustness:* Swapping Brier for Log does **not** change **Leaf 3/4 (Probabilism)** verdicts. It **may** change **Leaf 5/6 (Conditionalization)** proofs regarding propriety of updating rules (Greaves & Wallace 2006 rely on specific propriety conditions).
  *   **Node 9 (Imprecise Rule):** This is a formal decision-theoretic choice.
      *   *Robustness:* **Leaf 9** is standard Imprecise Probabilism. **Leaf 10** is rare; verdicts on PP are unstable because "caution" conflicts with matching chances.

  ### 2. Empty Combinations (Unoccupied Logical Space)
  *   **Strict Propriety + Anti-Probabilism (Node 4B + Node 5A):** Mathematically incoherent. If a scoring rule is strictly proper, probabilistic states dominate non-probabilistic ones under state-wise dominance. No serious position occupies this cell.
  *   **Imprecise Credence + Max Expected Accuracy (Node 1B + Node 5B):** Undefined/Incoherent. One cannot maximize expected accuracy relative to a *set* of priors without a second-order selection rule (which collapses the imprecision) or a specific decision rule (like E-Admissibility). This cell is empty because it dissolves the motivation for imprecision.

  ### 3. Collapsed Distinctions (Forced Splits)
  *   **Subjective Expected Accuracy (Node 5B) vs. Dominance with Permissive Priors (Node 5A + 7A):** These often yield identical synchronic norms (Probabilism). The tree separates them to highlight the *justification* (pragmatic dominance vs. epistemic expectation), but students should know the extensional output is frequently the same.
  *   **Holistic/Invariant (Leaf 7) vs. Additive/Invariant (Leaf 3/4):** While structurally distinct, many holistic measures are constructed to mimic additive results on standard partitions. The distinction is load-bearing for *why* probabilism holds, but not always for *that* it holds.

  ### 4. Formal Uncertainty Flags
  *   **Node 9 (Imprecise Decision Rule):** The extension of dominance arguments to imprecise credence is contested (Seidenfeld et al. vs. Joyce). It is not settled whether E-Admissibility fully vindicates a norm of "Probabilism" for sets (coherence) without additional constraints. Mark **Leaf 9** as "Contested" regarding the Chance-Credence norm.
  *   **Node 6 (Diachronic Scope):** Deriving Conditionalization from accuracy requires assuming the agent will update on a partition known in advance (Plan-Conditionalization). Whether this covers actual learning scenarios is a known gap (the "Briggs & Pettigrew" problem). Mark **Leaf 5/6** as dependent on the "Fixed Partition" assumption.

  ### 5. Result Key for Leaves
  *   **Prob:** Vindicates Probabilism (Credences obey probability axioms).
  *   **Cond:** Vindicates Conditionalization (or Plan-Conditionalization) as the unique updating rule.
  *   **PP:** Vindicates a Principal Principle norm (Credence matches known Chance).
  *   **Uniq:** Verdict on Uniqueness Thesis (Yes = Evidence fixes one function; No = Permissive).
