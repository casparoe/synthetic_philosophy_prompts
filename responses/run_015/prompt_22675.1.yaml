      *   *Marcus (The Realist):* Pragmatic but principled. Likely leans towards Psillos or Boyd. Needs to defend the epistemic weight of virtues without claiming they are algorithmic.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene. Seminar room, late afternoon. Coffee. Establish the stakes immediately.
