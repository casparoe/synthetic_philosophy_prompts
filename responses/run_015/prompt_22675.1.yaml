      *   **Round 4: The Realist's Defense (On the Merits).** Marcus needs to answer this. He can't just say "it works." He needs to argue that virtues track truth *evolutionarily* or *pragmatically* in a way that isn't circular. He needs to admit the risk but argue it's the *only* game in town that yields progress.
      *   **Closing:** No tidy resolution (philosophy rarely has those), but a mutual acknowledgment of the tension.

  4.  **Refining the Argument (Self-Correction during drafting):**
