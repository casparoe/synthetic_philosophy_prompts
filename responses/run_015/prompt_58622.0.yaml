answer: |-
  # Final Examination: Moral Psychology and Virtue Ethics
  **Time Allowed:** 75 Minutes
  **Conditions:** Closed Book
  **Total Marks:** 25

  ## Exam Question

  **Read the two stipulated materials below carefully. You must accept these claims as true for the purpose of this essay.**

  > **Material A (The Healthcare Study):** A hypothetical large-scale longitudinal study tracks trainee health care workers over three years. It finds a strong statistical effect of shift-level pressures (time urgency, sleep loss, observed peer noncompliance) on whether trainees speak up about possible medication errors. However, once these situational pressures are held fixed, the study finds modest but persistent rank-order stability for individuals (i.e., some individuals are consistently more likely to speak up than others within identical situational constraints).
  >
  > **Material B (The Revisionary Proposal):** A philosophical proposal suggests virtues should not be understood as unconditional tendencies to act in fixed ways across all situations. Instead, virtues are best understood as cultivated capacities to notice morally relevant features of situations, including awareness of situational pressure itself, and to respond appropriately in light of that awareness.

  **Essay Task:**
  Drawing on your knowledge of virtue ethics and the materials above, write an essay that addresses the following:
  1.  Specify what virtue ethics actually requires of character traits to remain viable as a normative and explanatory project.
  2.  Determine whether the pattern of results in Material A refutes that requirement or leaves it intact.
  3.  Evaluate whether the definition in Material B preserves a recognizable form of virtue ethics or concedes the central point of the situationist critique.
  4.  Conclude on whether virtue ethics survives this challenge.

  ***

  ## Model Answer

  To assess the viability of virtue ethics (VE) against the situationist challenge, one must first isolate its core requirements. VE requires character traits to be both explanatory and normative. Explanatorily, traits must reliably predict behavior better than chance, grounding the intuition that agents are responsible for their actions. Normatively, traits must constitute *eudaimonia*, serving as stable anchors for flourishing that are not easily undone by external circumstances. Crucially, VE does not logically demand robotic consistency across *all* contexts, but it does require a degree of cross-situational reliability that distinguishes the virtuous agent from the non-virtuous one.

  Material A presents a mixed empirical picture. The strong effect of shift-level pressures supports the situationist claim that environment often overrides disposition. If virtues were robust global traits, situational variables like sleep loss should not so drastically alter speaking-up behavior. However, the finding of rank-order stability once situations are held fixed is vital. It indicates that individuals possess stable dispositional differences that manifest when situational noise is controlled. This leaves the VE requirement intact, provided VE abandons the claim that virtues guarantee right action regardless of context. The data refutes a robust, global conception of character but supports a local, conditional conception. Traits exist, but their expression is mediated by environmental constraints.

  Material B offers a revisionary definition of virtue as a meta-cognitive capacity to notice situational pressures. This aligns precisely with the stability found in Material A. If virtue is the capacity to recognize that sleep loss compromises judgment, the virtuous agent can compensate (e.g., by double-checking errors or deferring decisions). This preserves a recognizable form of VE because it retains the focus on cultivated excellence of character rather than mere rule-following. It shifts the locus of virtue from specific actions (speaking up) to the psychological architecture governing those actions (awareness and regulation).

  However, does this concede the situationist critique? Partially. It concedes that the traditional Aristotelian picture of the "phronimos" acting consistently across diverse domains is empirically untenable. It accepts the situationist premise that behavior is highly sensitive to context. Yet, it does not concede the nihilistic conclusion that character does not exist. By redefining virtue as situational awareness, VE absorbs the empirical data rather than fighting it. The virtue lies in managing the situation, not transcending it.

  In conclusion, virtue ethics survives this challenge, but in a revised form. It remains viable as a normative project because the capacity for moral awareness is itself a stable trait subject to cultivation, satisfying the explanatory need for rank-order stability. It remains normative because such awareness is constitutive of responsible agency. The situationist challenge successfully destroys the myth of global character consistency, but Material B demonstrates that VE can retreat to a psychologically realistic position without collapsing. Virtue ethics survives not by denying the power of situations, but by making the understanding of situations a central component of virtue itself.

  ***

  ## Marking Guide (25 Marks)

  **Move 1: Specifying VE's Requirements (6 Marks)**
  *   **Excellent (5-6):** Clearly distinguishes between explanatory (predictive) and normative (flourishing) roles. Nuanced view that VE needs reliability, not necessarily robotic global consistency.
  *   **Competent (3-4):** Identifies that VE needs stable traits to predict behavior. May conflate normative and explanatory roles or suggest VE requires perfect consistency.
  *   **Characteristic Error (0-2):** Claims VE requires actions to be entirely situation-independent; or fails to mention the need for traits to explain behavior.

  **Move 2: Assessing Material A against Requirements (6 Marks)**
  *   **Excellent (5-6):** Integrates both findings (situational pressure AND rank-order stability). Argues that stability saves VE from falsification if global consistency is dropped.
  *   **Competent (3-4):** Focuses only on the situational pressure (threat to VE) or only on the stability (support for VE) without synthesizing the tension.
  *   **Characteristic Error (0-2):** Ignores the "rank-order stability" clause; claims the data completely refutes VE or completely vindicates traditional VE without qualification.

  **Move 3: Evaluating Material B (Revisionary Proposal) (7 Marks)**
  *   **Excellent (6-7):** Explains *how* the revision connects to the data (awareness allows compensation for pressure). Argues it preserves the "cultivated excellence" core of VE while altering the ontology of traits.
  *   **Competent (4-5):** States that the revision helps VE but treats it as a mere semantic change. Fails to explain the mechanism (awareness/regulation).
  *   **Characteristic Error (0-3):** Claims the revision abandons VE entirely (becomes situationism) or claims it changes nothing about traditional VE.

  **Move 4: Final Verdict on Viability (6 Marks)**
  *   **Excellent (5-6):** Concludes VE survives but is transformed. Acknowledges concession on global consistency but denies concession on character existence.
  *   **Competent (3-4):** Concludes VE survives or fails without acknowledging the transformation required. Binary conclusion.
  *   **Characteristic Error (0-2):** Vague conclusion; or argues VE is dead because situations matter; or argues situationism is wrong because virtues are real (ignoring the synthesis).

  **Total:** 25 Marks
