      *   *Issue:* Literal effect (strict liability) vs. Parameter intent (fault-based).
      *   *The "No Author" Wrinkle:* Who intended this? No human intended the strict liability; it's a glitch/artifact.

  4.  **Develop the Competing Rules (Theories):**

      *   *Theory A: The Pedigree/Textualist Rule (Positivist).*
          *   Focus: Case 4 (valid if formal criteria met) & Case 1 (valid if promulgated).
          *   Logic: The text was voted on and promulgated. The "parameters" are not law; the text is. The "no author" issue doesn't matter; the linguistic convention fixes meaning.
          *   Prediction: **Literal Effect (Strict Liability).**

      *   *Theory B: The Enterprise/Integrity Rule (Interpretivist).*
          *   Focus: Case 2 (completing the scheme) & Case 3 (practice/abandonment).
          *   Logic: Law is a coherent scheme. The text is an "artifact," not a decision. The "parameters" represent the actual normative commitment. Enforcing the glitch undermines the system's integrity.
          *   Prediction: **Parameter Effect (Fault Required).**

      *   *Theory C: The Practice/Reliance Rule (Realist).*
