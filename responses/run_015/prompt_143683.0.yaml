      *   *Case 2 (Murdering Heir):* Wills Act no exception. *Holding:* Disinherited him. *Reasoning:* Enacted words didn't compel it; court "completing a scheme." *Principle:* Law is a coherent normative scheme; courts can correct statutory gaps to prevent absurdity/immorality (Dworkinian/Equitable).
      *   *Case 3 (Unenforced Prohibition):* Plain terms covered defendant, but unenforced for 40 years. *Holding:* Stayed prosecution. *Reasoning:* Systematic non-enforcement makes it cease to be law. *Principle:* Enforcement practice is constitutive of legal validity (Legal Realist/Customary).
      *   *Case 4 (Brutal Foreign Code):* Perfectly valid formally (promulgated, clear, etc.), but brutal. *Holding:* It *is* law. *Reasoning:* Disappointment belongs to politics, not theory. *Principle:* Separation of Law and Morals (Hartian Positivism). Validity is separate from merit.

      *   *Synthesis Challenge:* These opinions seem contradictory on the surface.
          *   Case 1 & 4 look Positivist (formal validity matters, morality doesn't invalidate law *unless* procedural defects exist).
          *   Case 2 looks Anti-Positivist (moral coherence trumps text).
          *   Case 3 looks Realist (practice determines validity).
          *   *Key Insight:* How to reconcile them?
              *   She rejects *substantive* morality as a condition of validity (Case 4), but accepts *procedural* morality (promulgation, non-retroactivity - Case 1) and *systemic* coherence (Case 2).
              *   She treats law as a *practice* (Case 3) but insists on formal pedigree for *new* impositions (Case 1 & 4).
              *   *Unified Theory:* **Institutional Normativity with a Procedural Threshold.** Law exists when it passes a threshold of institutional pedigree (promulgation, consistency with practice) *and* functions as a coherent guide for conduct. She is a **Procedural Natural Lawyer** (Fuller) mixed with a **Soft Positivist** (Hart's rule of recognition includes practice).
              *   *Wait, look closer at Case 2:* She admits words didn't compel it. She "completed the scheme." This suggests she views the law as an *enterprise* (Fuller/Dworkin).
              *   *Look at Case 4:* She separates law and morals regarding *substantive* brutality.
              *   *Reconciliation:* She distinguishes between *validity* (Case 1, 3, 4) and *interpretation/application* (Case 2).
              *   *Actually, a stronger thread:* **The Integrity of the Legal Enterprise.**
                  *   Case 1: Retroactive/unpromulgated = fails as a guide (Fuller).
