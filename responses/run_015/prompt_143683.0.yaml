          *   *Decision:* Let's stick to A and B as the main rivals, as they capture the Positivist vs. Interpretivist tension evident in Cases 1-4.

  5.  **Determine the Judge's Likely Vote:**
      *   She is consistent on *procedural* legitimacy (Case 1) and *systemic coherence* (Case 2).
