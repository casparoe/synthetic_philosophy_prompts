                  *   Case 3: Non-enforcement = abandonment of the enterprise (Desuetude).
                  *   Case 4: Brutal but valid = the enterprise exists, even if evil (Positivism).
              *   *Core Principle:* Law is a **system of guidance** that requires **pedigree**, **consistency**, and **practice**.

