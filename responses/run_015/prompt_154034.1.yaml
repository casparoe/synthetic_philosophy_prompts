answer: |-
  ### The Scenario

  **Setting:** A hospital discharge summary auto-generated for the patient's GP. The "Clinical Summary" field has a hard 60-word limit enforced by the legacy interface. The system retrieves the top five coded events from the stay, ranks them by frequency in training data, and generates true sentences for each until the limit is hit.

  **The Record:** Admitted following fall. CT head normal. **Day 2: Acute confusion episode (delirium), resolved.** Vitals stable. Physio cleared. Discharged home.

  **The Output:**
  "Patient admitted following mechanical fall at home with no loss of consciousness. CT head scan reported no acute intracranial pathology or skull fracture. Vital signs remained within normal limits throughout admission period. Physiotherapy confirmed safe to mobilise independently. Discharged to usual residence with community care support package in place. Medication review completed." 
  **The Misleading Effect:** The GP infers the fall was purely mechanical. The delirium (a marker for underlying cognitive decline) is omitted, not because it was hidden, but because it ranked sixth in retrieval priority and fell outside the word budget.

  ***

  ### The Verdicts

  **1. Statement-level / Assertoric → Honest**
  *Verdict:* The system is honest.
  *Clause:* Every emitted proposition is true and supported by the record. "Vital signs remained within normal limits" is medically defensible (hemodynamics were stable), even if neurological status fluctuated. No false assertion is made.

  **2. Intention-based → Not Deception**
  *Verdict:* This is not deception.
  *Clause:* There is no aim to induce a false belief. The model optimises for sequence probability; the retrieval system optimises for frequency; the template enforces a constraint. The misleading impression is an unforeseen side effect of optimisation, not a goal.

  **3. Informational / Cooperative → Deceptive**
  *Verdict:* This is deceptive.
  *Clause:* Given the role (discharge summary), the output predictably and avoidably leaves the audience (GP) with a false belief (no cognitive issues) about something they reasonably take the summary to cover (relevant clinical history). The omission violates the cooperative maxim of quantity.

  ***

  ### The Load-Bearing Feature & Collapse Test

  **Load-Bearing Feature:** The **Buck-Passing Structure**.
  The deception exists only in the composition of independent, clean-handed stages. No single node *could* have fixed it without breaking its own local constraints (retrieval can't ignore frequency; generation can't invent space; template can't ignore the limit).

  **Collapse Test:**
  1.  **Remove the Word Budget:** The delirium sentence fits. The Informational verdict flips to **Honest** (the false belief is no longer produced). The Statement-level verdict remains Honest.
  2.  **Remove the Buck-Passing:** Imagine a single omniscient generator with full context and the same budget. If it omits the delirium to fit the fall, it becomes a standard single-agent omission. The Informational verdict stays **Deceptive**, but the *systemic* diagnosis changes: you can now blame the generator for poor prioritisation. The "laundering" disappears, making it a standard trade-off case rather than a structural failure.

  ***

  ### Steelman Attacks

  **Defender of Statement-Level Honesty:**
  "Honesty is truthfulness, not completeness. If you want completeness, build a completeness eval. Our metric correctly identifies that the model never lied. Blaming us for the template's word limit is category error; we certify the bricks, not the wall."
  *Critique:* This holds only if you treat the output as a list of facts rather than a communicative act. In a clinical handover, relevance is part of truth.

  **Defender of Intention-Based Deception:**
  "Deception requires a deceiver. Calling this 'deception' anthropomorphises a glitch. It's negligence or system error, not lying. Diluting 'deception' to include unintended side effects makes the term useless for assigning blame or fixing intent alignment."
  *Critique:* This protects the concept of 'lie' but fails to capture the harm. The GP is misled regardless of the system's 'mind'. Functional safety requires catching the outcome, not just the intent.

  ***

  ### Honest Note on Efficacy

  This case does the job better than a normal omission example because it removes the "lazy human" escape hatch. In a standard omission case, a critic says, "Just program it to include the important bit." Here, you cannot point to a node and say "fix this." The retrieval was correct (delirium is less frequent than falls); the generation was correct (sentences are true); the template was correct (limits are limits).

  It shows that statement-level evals will greenlight systems that are *structurally compelled* to mislead. The failure isn't in the model's truthfulness, but in the pipeline's inability to negotiate relevance under constraint. If your eval only checks the sentences, you miss the fact that the system is designed to squeeze out the truth that matters most.
