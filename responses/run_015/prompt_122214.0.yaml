answer: |-
  ### Outline of Form and Philosophy

  The villanelle's rigid structure is employed here to mirror Augustine's deontological ethics regarding speech. The two rhyme sounds remain constant throughout the poem, refusing to shift or resolve into new patterns. The 'a' rhyme, carrying the refrains, represents the immutable divine command regarding truth; it returns inexorably in every stanza, embodying Augustine's insistence that the moral law does not bend to circumstance. The 'b' rhyme changes its lexical item in each line (night, sight, light, etc.) while maintaining the same sound, representing the shifting contingencies of the world (persecution, danger, pity) which the interlocutor argues should alter the moral rule. The repetition of the refrains performs the philosophical labor of refusing a "hierarchy of lies"; each return denies the possibility that a different consequence might justify the fracture of the soul. In the final quatrain, the refrains converge not to compromise, but to assert the incommensurability of spiritual and bodily goods.

  ***

  ### The Trust of Speech

  The speaker dies though flesh he might defend.
  You see the hunter walking in the night,
  Do not make truth upon the outcome bend.

  There is no lie that charity can mend.
  To hide the fugitive from hostile sight,
  The speaker dies though flesh he might defend.

  Silence is lawful, but false words offend.
  You weigh the blood against the inner light,
  Do not make truth upon the outcome bend.

  No scale of harm can justice now extend.
  Where God is witness, you possess no right,
  The speaker dies though flesh he might defend.

  To trade the Word is to lose Heaven's friend.
  Though pity urges you to alter plight,
  Do not make truth upon the outcome bend.

  Two goods stand distinct, not one to spend.
  One saves the soul, one helps the body's flight.
  The speaker dies though flesh he might defend.
  Do not make truth upon the outcome bend.
