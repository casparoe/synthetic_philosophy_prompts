answer: |-
  You have correctly identified that there is a logical error at play. Your intuition is spot on: **everyone is acting rationally from their own individual perspective, but collectively they are creating an irrational outcome.**

  Here is the breakdown of the reasoning mistake, the ethical frameworks involved, and the verdict on who is "right."

  ### 1. The Reasoning Mistake: The Fallacy of Composition
  The specific logical error you are sensing is called the **Fallacy of Composition**. This fallacy occurs when someone assumes that what is true for a part (or an individual) must be true for the whole (or the group).

  *   **Your logic:** "One dishwasher cycle creates a negligible amount of noise. Therefore, it is acceptable."
  *   **The Reality:** While true for *one* person, it is not true if *everyone* adopts that logic. If all three of you run appliances outside quiet hours, the cumulative noise makes sleep impossible.

  You treated the "quiet hours" as a resource that could withstand a tiny withdrawal. In economics and game theory, this is known as the **Tragedy of the Commons**. You treated a shared resource (silence) as if your individual consumption of it wouldn't deplete it for others.

  ### 2. The Ethical Mistake: Universalizability
  Immanuel Kant proposed a test for moral actions called the **Categorical Imperative**. He argued you should only act according to rules that you would be willing to make into a **universal law**.

  *   **The Test:** Could you rationally wish that *every* roommate in the world ran appliances at 11 PM whenever they were tired?
  *   **The Result:** No. If that were a universal law, no one would sleep. Therefore, the action is logically inconsistent, even if your specific reason (being tired) feels valid in the moment.

  ### 3. The Roommates' Mistake: Tu Quoque & Escalation
  Your roommates are committing two errors:
  *   **Tu Quoque (Appeal to Hypocrisy):** They are arguing that because you broke the rule, the rule no longer applies to them. This is false. A speed limit doesn't vanish just because one person speeds.
  *   **Mutually Assured Destruction:** From a Game Theory perspective, they are choosing a "defect/defect" strategy. By punishing you, they are punishing themselves (since they also can't sleep). They are prioritizing "fairness" (if I suffer, you must suffer) over "utility" (everyone sleeping).

  ### 4. The "Equal Cost" Argument
  Their claim that *"since we split costs and space equally, nobody gets to veto anyone"* is a category error.

  Paying rent purchases you **habitation**, not **unrestricted liberty**. In almost all legal and social housing contracts, there is an implied covenant of "quiet enjoyment." Your right to use the space ends where your noise infringes on another's biological need for sleep. Equal financial contribution does not grant equal rights to disrupt basic health needs.

  ### The Verdict: Who is Right?

  **Technically, everyone is currently wrong, but you hold the responsibility.**

  *   **You:** You are the **causal agent**. You broke the established norm based on a calculation that ignored the precedent it would set. While your noise was small, your violation of the agreement was the catalyst.
  *   **The Roommates:** They are **rationally irrational**. Their reaction is emotionally understandable (anger at a double standard), but logically flawed. They are destroying their own sleep to prove a point.

  **Who is "Right"?** The **10 PM Rule** is right. The logic that supports the rule (human need for sleep) outweighs the logic of individual convenience or financial equality.

  ### How to Fix It

  You cannot win this by arguing logic, because they are currently acting out of spite. You have to reset the game.

  1.  **Own the Inciting Incident:** Admit that you broke the norm. Say, *"I was wrong to run the dishwasher at 11 PM. I treated the rule as flexible for me, and I see now that undermines it for everyone."*
  2.  **Call Out the Escalation:** Gently point out the Fallacy of Composition. *"If we all decide the rule doesn't apply because I broke it once, we all lose sleep. That hurts you two just as much as it hurts me."*
  3.  **Re-negotiate, Don't Just Restore:** The rule was "loose." Loose rules fail. Propose a specific agreement:
      *   *Hard Stop:* No loud appliances after 10 PM.
      *   *Exception Protocol:* If someone absolutely must break it, they text the group chat first. If no one objects within 15 mins, it's allowed. (This restores agency to the roommates).
      *   *Morning Hours:* Agree on a start time for loud noises (e.g., 8 AM on weekends, 7 AM on weekdays). 6 AM vacuuming is generally aggressive.

  **Summary:** You made a logical error regarding cumulative impact. They are making a logical error regarding retaliation. The only way to win is to admit your part, which removes their justification for punishing everyone.
