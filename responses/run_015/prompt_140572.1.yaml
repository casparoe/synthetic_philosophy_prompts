  BUREAU OF ARCHIVAL REPARATION
  WHITE PAPER 44-B
  TO: Ministry of Cultural Heritage
  FROM: Dr. Aris Thorne, Director of Acquisitions
  DATE: 14 October 2024
  SUBJECT: Remediation of Systemic Ephemeral Loss via Generative Provenance

  1. The Archival Deficit
  Traditional appraisal protocols prioritize permanent value as defined by the state. Consequently, the national fonds reflects the machinery of governance rather than the populace it governed. Preservation is itself a selection, and historically, that selection excluded the laboring, the transient, and the dispossessed. This creates a sampling error in the historical record. The Bureau of Archival Reparation posits that a gap in the record is a debt. To leave the silence intact is to validate the exclusion. Our mandate is not merely to preserve what survives, but to repair what was omitted. Visibility is recognition. To matter is to be filed.

  2. Methodology: Counterfactual Acquisitions
  Physical restoration cannot recover paper that was never created. Therefore, the Bureau has authorized the generation of counterfactual acquisitions. Using a predictive model trained on surviving ledgers, tax rolls, and trial transcripts, we generate documents calibrated to the Anticipated Absence Ratio (AAR). The AAR calculates how many documents a person of a given station, trade, and region would have produced had the machinery of record-keeping bothered with them. These are not forgeries; they are statistical restorations of likelihood. A dockworker in 1890 would have generated a wage slip, a union card, a rent receipt. The model produces these items. They are printed on period-correct stock, aged to specification, and inked with chemically accurate formulas.

  3. Arrangement and Description
  Once generated, these records are accessioned immediately. They are assigned a provenance based on the statistical profile of the subject. They are then shelved in original order, integrated seamlessly among genuine fonds. This maintains the structural integrity of the collection. To ensure transparency without disrupting the research flow, a notation is added to the finding aid. This flag is located on page forty of the standard introductory packet, under the sub-heading "Retrospective Accessions." It marks the file range as containing remediated materials. This ensures that the argument of the finding aid—that these materials matter—is preserved, while allowing the researcher to distinguish between the actual and the anticipated.

  4. Ethical Framework
  Critics may question the authenticity of the record. However, no genuine records of the powerful are touched or deaccessioned. The state's memory remains intact; it is simply surrounded by a chorus of previously silent voices. No one is harmed by the addition of evidence where there was none. The political problem of exclusion is solved by populating the void. Historians have long demanded a representative sample of the past. They now have one. The unrecorded are recorded twice over: once as an absence in the old ledgers, and once as a presence in the new files. This doubles their footprint in the national memory.

  --------------------------------------------------------------------------------
  SIDEBAR: NOTE FROM PROCESSING UNIT 4
  Junior Archivist K. Lin
  During the aging process for the 1890s dockworker series, I noticed the paper distress patterns are too uniform. Real decay is random; this decay is consistent. Also, the model generates complaints about wages only when the AAR demands a labor dispute file. It doesn't generate joy. It only generates the kinds of things the state usually watched. I'm filing the boxes as instructed, but the stack feels heavier than the paper weight suggests.
  --------------------------------------------------------------------------------

  5. Conclusion
  The assumption underpinning this initiative is that entry into the archive is a form of power. To be exposed to the light of the reading room is to be recognized by the future. By filling the gaps, we correct the bias of survival. We ensure that future historians cite a representative democracy of documents. The epistemic uncertainty of the guess is a small price to pay for the political certainty of inclusion. The archive is no longer a tomb of the selected few, but a home for all who lived. The silence is broken. The record is full.

  END OF WHITE PAPER 44-B
