      *   **Addressing the Counter-Argument (Crucial):** The "Slick/Wrong vs. Messy/Correct" risk.
          *   *Argument:* Yes, this risks penalizing genuine complexity.
          *   *Rebuttal:* But for *oversight*, if a human can't verify the step in the allotted time, the AI hasn't actually overseen the human. We are measuring *verifiability*, not just correctness. A correct argument that cannot be verified by the judge is functionally identical to a wrong one in this context.
