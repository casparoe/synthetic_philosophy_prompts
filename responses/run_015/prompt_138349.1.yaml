      *   **Core Problem:** The "spotting a flaw is cheaper than fabricating one" premise is breaking. Burying a flaw in volume seems cheaper than finding it. The format rewards volume/obfuscation over truth.
      *   **Proposed Fixes:**
          1.  *Compression Round:* 500-word summary after debate, judge votes on that.
          2.  *Bounty Rule:* Claiming an error requires citing a specific sentence; penalty if the citation is wrong.
      *   **Task:** Draft a memo for Friday's meeting.
      *   **Requirements:**
          *   Recommend one concrete course of action (let stand, rerun, adopt rule, combination, timeline).
