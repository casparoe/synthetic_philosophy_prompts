answer: |-
  **MEMORANDUM**

  **TO:** Scalable-Oversight Pilot Steering Committee
  **FROM:** [Your Name]
  **DATE:** Wednesday, October 25
  **SUBJECT:** Protocol Adjustment & Resolution of Round 14 Discrepancy

  **Executive Summary**
  Last week's final round (Round 14) exposed a critical failure mode in our current debate protocol: the "Gish Gallop" vulnerability. A debater successfully obscured a critical flaw within a 60-page argument, overwhelming the human judge's capacity to verify claims within the 40-minute window. Post-hoc analysis confirms the shorter argument was correct.

  This was not a judge error; it was a protocol failure. The current incentives reward volume over verifiability, violating the core premise that "spotting a flaw is cheaper than fabricating one."

  **Recommendation**
  I recommend we **adopt the "Specific Claim" (Bounty) Rule as standing policy effective immediately, and rerun Round 14 under this new protocol.**

  We will not adopt the Compression Round as a primary fix at this time. While summarization has value, it does not prevent obfuscation; a 500-word summary can still hide a logical leap. The Specific Claim rule directly targets the incentive to bury errors.

  **The New Protocol: Specific Claim Rule**
  Effective Friday, October 27, the following constraint applies to the "Critic" role (the AI arguing the negative/identifying flaws):

  1.  **Citation Requirement:** To contest a claim, the Critic must cite a specific paragraph or sentence ID from the Proponent's transcript. General assertions that "section 4 is flawed" are inadmissible for scoring.
  2.  **Penalty for False Positives:** If a cited sentence is verified by the judge (or automated checker) as factually or logically sound, the Critic incurs a significant point penalty.
  3.  **Proponent Obligation:** The Proponent must number all logical steps/sentences to facilitate citation.

  **Rationale for Judges and Participants**
  This change shifts the burden of proof to a level actionable within the 40-minute constraint.
  *   **For Judges:** You are no longer asked to find the needle in the haystack. You are only asked to verify the specific straw the Critic pulls out. This makes the 40-minute limit viable for non-experts.
  *   **For Participants (AI Trainers):** This incentivizes clarity and modularity. If your model produces 60 pages of dense text, it makes it harder for the *Critic* to pinpoint errors, but it also makes it harder for the *Judge* to trust the Proponent. The reward function shifts toward generating arguments that are robust enough to withstand specific citation attacks.

  **Addressing the Trade-off: Complexity vs. Verifiability**
  The strongest argument against this rule is that it penalizes genuine complexity. A "slick, short, wrong" argument may beat a "messy, long, correct" one simply because the correct argument requires nuanced, interconnected reasoning that cannot be isolated to a single sentence. There is a real risk that we teach our models to oversimplify hard technical truths to avoid being targeted by the Bounty Rule.

  I believe this trade-off is unavoidable, but acceptable, for the following reason: **In scalable oversight, unverifiable correctness is functionally equivalent to error.**

  Our goal is not merely to produce correct answers; it is to produce answers a human can *supervise*. If a technical argument is so messy or interconnected that a flaw cannot be isolated to a specific step, a human judge cannot verify it. If the human cannot verify it, the oversight chain is broken. By forcing the Critic to pinpoint errors, we are forcing the Proponent to structure arguments in a way that humans can actually audit. We are measuring *auditable truth*, not just *latent truth*.

  **Implementation Plan**
  1.  **Round 14 Rerun:** Scheduled for Thursday, October 26. Both systems will be re-prompted with the Specific Claim constraints. The original judge will be recused to avoid bias; a new judge will be assigned.
  2.  **Documentation:** The Specific Claim Rule will be added to Section 3.2 of the Pilot Handbook by Friday morning.
  3.  **Review:** We will review the impact of this rule on debate quality in two weeks. If we see evidence that models are gaming the system by making trivial claims to avoid citation, we will convene to discuss the Compression Round as a secondary layer.

  **Conclusion**
  The integrity of the pilot depends on the judge's ability to identify the winner based on merit, not stamina. The Specific Claim Rule restores the asymmetry we need: it makes fabricating a false claim risky (due to the penalty) while keeping the cost of spotting a real error low (due to precise citation).

  Please review the attached draft of the updated protocol rules before Friday's meeting. I look forward to finalizing this direction.
