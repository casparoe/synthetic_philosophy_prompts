answer: |-
  1. "The tensions (ranked)"

  The most critical fracture is between (2) and (5). You claim deontology is about the structure of reasoning rather than outcomes, yet your threshold for overriding constraints is defined entirely by an outcome (human extinction). This makes your view functionally consequentialist at the limit, undermining the core identity of the system. The severity is critical because it collapses the distinction you're trying to maintain. The cheapest fix is to redefine the threshold not as a point where aggregate good outweighs rights, but as a point where two absolute duties conflict (e.g., duty to humanity vs. duty to one person). The cost is that you lose the clear mathematical simplicity of a "threshold" and must explain how two absolute duties can coexist without contradiction.

  The second most severe tension lies between (2) and (3). In (2), you suggest the constraint becomes *pro tanto* at the threshold, implying the act becomes permissible. However, (3) states that if you violate the constraint, you are still culpable because wrongness lives in the act. You cannot be culpable for doing something that was objectively permissible. This creates a paradox where the agent is both authorized and blamed. The severity is high because it breaks the link between moral permission and moral blame. The cheapest fix is to distinguish between justification (the act was right) and excuse (the act was wrong but understandable). The cost is adopting a "dirty hands" framework where the agent does what is necessary but remains morally stained, which is psychologically heavy.

  The third tension exists between (1) and (5). You assert constraints are absolute and not about weighing outcomes, yet your justification for why framing is wrong relies on consequentialist echoes like "rotting social world" and "trust breaking down." This sounds like rule-utilitarianism, where the rule is kept only because of its good effects. The severity is moderate because many deontologists use similar language without collapsing into consequentialism, but it remains a vulnerability in your explanation. The cheapest fix is to reframe social trust not as a consequence of the act, but as a constitutive part of the duty itself. The cost is taking on metaphysical baggage to explain how social structures are intrinsic to moral reasoning rather than just outcomes of it.

  2. "The false alarm"

  The pair that seems contradictory but actually isn't is (3) and (4). At first glance, (3) appears to shut the door on excuses based on belief ("wrongness lives in the act"), while (4) opens a window to discuss negligence regarding belief. It might feel like (4) implies that if you *weren't* negligent, you would be excused, which would contradict (3)'s claim that sincere belief doesn't clear you. However, these commitments dissolve into coherence when read carefully: (4) only specifies that negligence is sufficient for culpability, not that non-negligence is sufficient for excuse. Both statements actually work together to reinforce objective wrongness over subjective state of mind. They form a unified front against subjectivism rather than fighting each other.

  3. "The one revision"

  The single change that cleans up the most problems is to revise (2). Currently, (2) is the source of the consequentialist leak into (5) and the culpability paradox in (3). Instead of saying the constraint becomes *pro tanto* or overrideable when the stakes are high enough, you should revise it to say the constraint remains absolute, but the agent faces a tragic conflict where any choice involves moral wrongdoing. In this view, framing the innocent person is still wrong (preserving 1 and 5), but the catastrophic context provides an excuse rather than a justification (resolving 3). This removes the need to calculate outcomes to find a threshold, keeping your structure non-consequentialist.

  This revision stabilizes the entire stack by aligning your threshold mechanism with your deontological core. By shifting from a "threshold of permissibility" to a "threshold of excusability," you no longer need to justify the act using the "rotting social world" outcome data mentioned in (5), because the act remains wrong regardless of the outcome. It also clarifies (3) by confirming that the agent is indeed culpable (because the act is wrong) but perhaps less blameworthy due to the tragic circumstances. This single move stops the slide into utilitarianism while preserving your intuition that extinction changes the moral landscape without changing the moral rules.

  4. "Bottom line"

  The set survives intact, but only if you tighten the definition of the threshold. As it stands, you are holding a coherent version of "threshold deontology," but your current wording leaks consequentialism. If you implement the revision to (2) regarding excuse versus justification, your commitments lock together into a stable, defensible position that can withstand the seminar critique.
