  Here is an analysis of your two candidate principles, a proposal for a principle that better matches your practice, and an application of that principle to your unresolved case.

  ### 1. Testing the Candidate Principles

  **The Corridor Rule**
  *Principle:* When long-run effects are inscrutable, choose the option that best preserves the capacity of successors to notice mistakes and reverse course.
  *   **Verdict (a) Malaria vs. Index:** **FAIL.** Holding money in an index fund preserves far more future optionality and capital than spending it on bed nets. The Corridor Rule dictates holding; you give.
  *   **Verdict (b) Sealed-Envelope:** **FAIL.** Funding an intervention with contested astronomical stakes risks closing future corridors if the negative model is true. The Rule suggests caution or holding; you fund.
  *   **Verdict (d) The Tail:** **PASS.** Averting civilisational collapse preserves all future corridors.
  *   **Verdict (e) Series:** **PASS.** Repeating a bet reduces the portfolio's ability to pivot if the thesis is wrong.
  *   **Summary:** The Corridor Rule is too conservative. It prioritizes flexibility over concrete near-term good, whereas you prioritize near-term good unless flexibility is the specific thing being threatened (as in *e*) or the risk is existential (as in *d*).

  **The Zero-EV-minus-Variance Rule**
  *Principle:* Treat inscrutable long-run effects as having an expected value of zero, subtract a penalty for variance, and decide on everything else.
  *   **Verdict (a) Malaria vs. Index:** **PASS.** Malaria has positive near-term EV; Index has delayed near-term EV. Malaria wins.
  *   **Verdict (c) Empty Box:** **PASS.** Near-term is null, Long-term is zero. Decline.
  *   **Verdict (d) The Tail:** **FAIL.** The Tail has no near-term effects. By your principle, its EV is zero (minus variance penalty). You should decline; you fund.
  *   **Verdict (f) Sign Disagreement:** **PASS.** Disagreeing signs cancel to zero; you decide on near-term grounds.
  *   **Summary:** This rule captures your skepticism of diffuse long-term claims but cannot account for why you make exceptions for existential risk reduction. It treats all long-term uncertainty as noise, but you treat *catastrophic* uncertainty as signal.

  ### 2. The Proposed Principle: Anchored Asymmetry

  Your practice is best described by a principle that prioritizes near-term evidence but applies an asymmetric constraint for catastrophic risk.

  **The Principle:**
  1.  **The Anchor:** Maximize robust, measurable near-term welfare (0–30 years). If an intervention has a strong positive near-term anchor, fund it. If it has no near-term anchor, decline it.
  2.  **The Noise Filter:** Long-term models that disagree on the *direction* (sign) of an effect contribute zero expected value to the decision. They are treated as epistemic noise, not evidence.
  3.  **The Catastrophe Exception:** The only justification for funding without a near-term anchor is the prevention of a specific, bounded, irreversible civilisational harm. Diffuse long-term benefits do not count; specific long-term harms do.
  4.  **The Correlation Penalty:** Apply a heavy discount to strategies that concentrate epistemic risk (repeating the same unproven long-term bet). A one-off error is acceptable; a systemic error is not.

  ### 3. Clause-by-Clause Motivation from Your Verdicts

  *   **From (a) and (c) comes The Anchor.** You fund Malaria (strong anchor) and decline the Empty Box (no anchor). This establishes that near-term evidence is the primary currency of decision-making. Financial leverage (a) does not outweigh the epistemic value of acting on known good now.
  *   **From (f) and (b) comes The Noise Filter.** In (f), when long-term models disagree on sign, you revert to near-term grounds. In (b), you fund despite "astronomically bad" models because the near-term anchor is solid. You implicitly treat contested long-term magnitude as irrelevant when the near-term signal is clear.
  *   **From (d) comes The Catastrophe Exception.** This is the only case where you fund without a near-term anchor. This clause distinguishes *The Tail* from *The Empty Box*. It explains why you fund risk reduction (d) but not diffuse benefit creation (c).
  *   **From (e) comes The Correlation Penalty.** You are uneasy about the series because it violates portfolio diversification. If the long-term theory is wrong, you don't just lose one grant; you validate a false paradigm for a decade.

  ### 4. The Verdict to Overturn

  To make this principle coherent, you must overturn **Verdict (b) (The Sealed-Envelope Program).**

  **The Inconsistency:**
  Verdict (d) asserts that preventing a civilisational catastrophe is valuable enough to spend money on *without* near-term benefits. Verdict (b) asserts that securing near-term benefits is valuable enough to risk a civilisational catastrophe *if* the models are contested.
  If the catastrophe in (d) is real enough to justify funding, the catastrophe in (b) is real enough to veto funding. You cannot simultaneously treat "astronomically bad" long-term models as actionable signal (in *d*) and as ignorable noise (in *b*).

  **The Repair:**
  If you accept the *Catastrophe Exception* required to justify (d), you must add a **Catastrophic Veto** to the principle: *If long-term models disagree on the sign, and the negative sign implies irreversible civilisational harm, the Near-Term Anchor is overridden.*
  Applying this repair forces you to decline (b). The near-term good is not worth a 50% (equal credibility) risk of astronomical badness, given that you acknowledge astronomical badness is worth paying to prevent in (d).

  ### 5. Application to the Hard Case

  **The Case:** An intervention with large, well-evidenced near-term effects, which is effectively irreversible, where long-run models disagree about the sign.

  **Application of Anchored Asymmetry (Repaired):**
  1.  **Check the Anchor:** The near-term effects are large and good. *Initial inclination: Fund.*
  2.  **Check the Noise Filter:** Long-run models disagree on the sign. *Instruction: Ignore long-term EV.*
  3.  **Check the Catastrophic Veto:** The intervention is "effectively irreversible." In the context of long-term sign disagreement, irreversibility elevates the risk from "noise" to "potential catastrophe." If you cannot undo the action, and the sign might be negative, you face the same structure as Verdict (b).
  4.  **Decision:** **Decline.**

  **Reasoning:**
  In Verdict (a) (Malaria), the action is biologically irreversible (you cannot un-save a life), but we have high confidence the long-term sign of saving lives is non-negative. In your Hard Case, the long-term sign is *disputed*.
  Because you have committed to the *Catastrophe Exception* (Verdict d), you have admitted that long-term catastrophic risk is action-guiding. Therefore, you cannot ignore it when it appears as a downside risk in a near-term good project (Verdict b).
  Since the Hard Case combines the **Irreversibility** of (a) with the **Sign Disagreement** of (b) and the **Structural Risk** of (d), the repaired principle dictates that the uncertainty acts as a veto. You should not lock in an irreversible change when the direction of its long-term consequence is genuinely contested, regardless of the near-term benefit.

  **Summary Advice:**
  Your intuition in (f) ("decide on near-term grounds anyway") is sustainable only when the intervention is reversible or the long-term downside is diffuse. When the intervention is irreversible, the "Sign Disagreement" ceases to be noise and becomes a risk constraint. To remain consistent with your willingness to fund existential risk reduction (d), you must decline irreversible interventions with contested long-term signs (Hard Case), even at the cost of near-term good.
