answer: |-
  ### Examination Question

  **Question 4: Semantic Externalism and Natural Kinds (25 Marks)**

  Consider the following scenario:

  On **Earth**, speakers apply the term "jade" to objects sharing a cluster of macro-properties (green color, specific hardness, translucency). However, Earth's mineralogical experts are genuinely divided: half argue that objects satisfying this cluster belong to a single natural kind, while the other half argue they comprise two distinct mineralogical kinds (jadeite and nephrite).

  On **Twin Earth**, objects satisfying the exact same macro-properties exist. However, their underlying chemical/mineralogical structure is entirely different from Earth's jadeite or nephrite (call it "Mineral Z"). Furthermore, Twin Earth's division of linguistic labor is structured around unanimous expert agreement that Mineral Z constitutes exactly one natural kind.

  In a closed-book essay response, address the following:
  1.  According to semantic externalism, do Earth and Twin Earth speakers share the same reference for "jade"?
  2.  Does the ontological disagreement among Earth's experts undermine the externalist claim that reference is fixed by actual environmental kinds?
  3.  Can an internalist descriptivist account accommodate this case without committing ordinary speakers to massive reference failure, and what is the cost of doing so?

  ***

  ### Model Answer

  **Response to Question 4**

  According to semantic externalism, Earth and Twin Earth speakers do not share the same reference for "jade." The core tenet of externalism regarding natural kind terms is that extension is determined by the underlying physical constitution of the samples ostended or causally connected to the term's introduction, rather than by the descriptive beliefs held by speakers. On Earth, the term is causally linked to jadeite and/or nephrite. On Twin Earth, the term is linked to Mineral Z. Since the underlying structures differ, the extensions differ, even if the macro-properties and psychological states of the speakers are identical. Therefore, the meaning (intension) differs, as meaning determines extension.

  The ontological disagreement among Earth's experts does not undermine the externalist claim. Externalism posits that reference is fixed by the *actual* nature of the world, not by the *consensus* regarding that nature. The Division of Linguistic Labor (DoLL) suggests that ordinary speakers defer to experts to identify the underlying essence. However, this deference is to the *investigation of reality*, not to a vote. If Earth actually contains two distinct kinds (jadeite and nephrite) despite expert disagreement, the term "jade" may refer to a disjunction of kinds or be semantically ambiguous, but its reference is still grounded in those actual structures. The lack of consensus merely reflects an epistemic limitation, not a semantic indeterminacy. The externalist argues that the world fixes the reference; if the world is messy (containing two kinds under one label), the semantics reflect that messiness. Twin Earth's expert unanimity regarding Mineral Z ensures a unified reference there, but this contrast highlights that reference tracks ontology, not sociological agreement.

  An internalist descriptivist account can accommodate the case, but only at significant theoretical cost. Internalism holds that meaning is determined by the conceptual content or descriptions associated with the term in the speaker's mind. Since Earth and Twin Earth speakers associate the same macro-properties (green, hard, translucent) with "jade," the internalist must conclude the terms share the same meaning and reference. This avoids committing ordinary speakers to massive reference failure; on both planets, speakers successfully refer to whatever satisfies the macro-description.

  However, the cost is the inability to capture the intuition that "jade" functions as a natural kind term. By reducing meaning to macro-properties, internalism treats "jade" like "thing" or "artifact," ignoring the scientific essence. If Earth experts eventually prove "jade" is two kinds, the internalist must say the meaning of "jade" changed or was always ambiguous, whereas the externalist says we simply discovered the reference was always disjunctive. Furthermore, if the macro-properties are satisfied by a synthetic fake, the internalist must admit the fake is jade, while the externalist denies it. Thus, internalism saves the ordinary speaker from reference failure by severing the link between language and mind-independent natural kinds, effectively denying the phenomenon semantic externalism seeks to explain.

  In conclusion, externalism maintains that reference diverges due to underlying structural differences, unaffected by expert disagreement which is merely epistemic. Internalism preserves reference identity via macro-descriptions but fails to account for the natural kind status of the term, rendering scientific discovery irrelevant to meaning.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Part 1: Reference Identity (8 Marks)**
  *   **8–6 marks (A-Level):** Clearly states reference differs. Explains that externalism ties reference to underlying structure (essence), not psychological state or macro-properties. Explicitly notes that Twin Earth's "Mineral Z" creates a different extension despite macro-identity.
  *   **5–3 marks (B-Level):** States reference differs but relies on rote "Water/H2O" phrasing without adapting to the specific "Jade/Mineral Z" details. May vaguely mention "environment" without specifying underlying structure.
  *   **2–0 marks:** Claims reference is the same (Internalist answer to an Externalist prompt) or fails to address the question.

  **Part 2: Expert Disagreement and Externalism (9 Marks)**
  *   **9–7 marks (A-Level):** Argues disagreement does *not* undermine externalism. Distinguishes between *epistemic* uncertainty (expert views) and *semantic* fixation (actual ontology). Correctly applies the Division of Linguistic Labor: speakers defer to the *nature* experts investigate, not their consensus. Acknowledges "jade" might refer to a disjunction if two kinds exist.
  *   **6–4 marks (B-Level):** Correctly concludes externalism stands but struggles to explain *why*. May suggest experts "eventually decide" reference (sociological externalism) rather than the world deciding. Fails to distinguish ontology from consensus.
  *   **3–0 marks:** Claims expert disagreement refutes externalism (misconception: reference requires consensus). Confuses semantic externalism with a causal-historical theory requiring a single baptism event.

  **Part 3: Internalism and Reference Failure (8 Marks)**
  *   **8–6 marks (A-Level):** Explains internalism avoids reference failure by anchoring meaning in macro-descriptions. Identifies the cost: loss of "natural kind" status, inability to account for scientific error, or equivalence of fakes to real kinds.
  *   **5–3 marks (B-Level):** States internalism avoids failure but offers a weak explanation of the cost (e.g., "it's less scientific"). Assumes macro-property identity is sufficient for meaning identity without critiquing this move.
  *   **2–0 marks:** Claims internalism leads to reference failure (incorrect for this scenario) or fails to address the "cost."

  **Specific Misconceptions (Deductions applied within above categories)**
  *   **Treating expert disagreement as automatic refutation of externalism:** Deduct 3 marks from Part 2.
  *   **Conflating semantic externalism with a causal theory of reference:** (e.g., claiming reference fails because there was no specific "naming ceremony"): Deduct 2 marks from Part 2.
  *   **Assuming macro-property identity is sufficient for meaning identity:** (in an externalist analysis): Deduct 3 marks from Part 1.

  **Differentiation Criteria (A vs B)**
  *   **A-Level Response:** Must explicitly navigate the interaction between the **Division of Linguistic Labor** and **Ontological Pluralism**. It must argue that DoLL allows ordinary speakers to latch onto real kinds *even if* experts haven't categorized them correctly yet. It treats the expert disagreement as a red herring regarding semantics, focusing instead on the mind-independent reality.
  *   **B-Level Response:** Will correctly identify the Twin Earth intuition (different stuff = different meaning) but will falter on the expert disagreement clause. A B-level student is likely to argue that reference is indeterminate *because* the experts disagree, failing to grasp that for the externalist, the *minerals* fix the reference, not the *mineralogists' opinions*.
