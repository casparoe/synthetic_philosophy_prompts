answer: |-
  **Project Title:** Multidimensional Standing: A Taxonomy of Hypocrisy and the Authority to Blame

  **1. Research Question**
  The prevailing debate regarding the 'standing to blame' asks a binary question: does hypocrisy cause an agent to forfeit their standing entirely? This project rejects the unitary conception of standing implicit in that question. Instead, it poses the following determinately answerable research question: *To what extent do distinct forms of hypocrisy (in-domain versus cross-domain; upward, downward, versus horizontal) differentially undermine the epistemic, normative, and affective dimensions of standing to blame?*

  By treating standing not as a single status but as a composite of three distinct dimensions, this project seeks to determine whether our intuitive judgements about hypocritical blame track these dimensions separately. The goal is to produce a principled mapping of which dimensions are compromised in specific contexts of hypocrisy, rather than a blanket verdict on forfeiture.

  **2. Context and Gap in Existing Literature**
  Contemporary literature on moral responsibility has extensively debated the 'tu quoque' defence. The consensus largely oscillates between two poles: either hypocrites retain full standing (because the truth of the blame is independent of the blamer), or they forfeit standing entirely (because hypocrisy undermines the authority required to hold others accountable).

  This binary framework obscures the complexity of our actual moral practices. Treating standing as unitary forces a false choice between accepting the hypocrite's blame wholesale or rejecting it completely. Consequently, the literature leaves open the possibility that a hypocrite may be epistemically positioned to identify a wrong (epistemic standing) and even entitled to demand accountability (normative standing), yet lack the moral licence to express reactive attitudes like resentment (affective standing). Conversely, a hypocrite might be emotionally justified in their indignation but lack the normative authority to enforce sanctions. By failing to disaggregate these dimensions, existing theories cannot explain why we sometimes accept a hypocrite's factual assessment while rejecting their moral outrage, or vice versa. This project fills that gap by arguing that the unitary model is descriptively inadequate and theoretically obstructive.

  **3. Methodology**
  The research will proceed via conceptual analysis and the systematic elicitation of philosophical intuitions.

  *Conceptual Mapping:* The first task is to rigorously define the three proposed dimensions. *Epistemic standing* concerns the blamer's capacity to accurately recognise the wrong. *Normative standing* concerns the entitlement to hold the wrongdoer to account without self-undermining authority. *Affective standing* concerns the legitimacy of expressing moral resentment or indignation.

  *Taxonomy Construction:* I will construct a matrix of hypocrisy cases varying along three axes:
  1.  **Domain:** In-domain (the hypocrite commits the same specific wrong) versus Cross-domain (the hypocrite commits a different wrong violating a comparable principle).
  2.  **Direction:** Upward (blaming a superior), Downward (blaming a subordinate), or Horizontal (blaming a peer).
  3.  **Context:** Private admonishment versus Public censure.

  *Intuition Testing:* Using this taxonomy, I will develop structured thought experiments (vignettes). These will isolate variables to test whether intuitions about the blamer's legitimacy shift depending on the dimension in question. For instance, does a downward-blaming hypocrite lose normative standing but retain epistemic standing? Does cross-domain hypocrisy affect affective standing less severely than in-domain hypocrisy? The 'testing' will involve subjecting these vignettes to rigorous dialectical scrutiny to check for reflective equilibrium, ensuring that the resulting distinctions are principled rather than ad hoc.

  **4. Success and Failure Conditions**
  A positive result will consist of a stable, principled mapping of hypocrisy types to standing dimensions. For example, a successful outcome might demonstrate that in-domain hypocrisy invariably undermines normative standing but leaves epistemic standing intact, whereas cross-domain hypocrisy only compromises affective standing in public contexts. This would provide a nuanced vocabulary for diagnosing failures of moral authority.

  A negative result would take one of two forms. First, the 'collapse' outcome: analysis might reveal that the three dimensions are not conceptually distinct in practice; if undermining one necessarily undermines the others, the multidimensional model offers no advantage over the unitary view. Second, the 'noise' outcome: intuitions regarding the cases may prove too chaotic or context-dependent to systematise. If no consistent pattern emerges linking specific types of hypocrisy to specific dimensional deficits, the hypothesis that standing is multidimensional would lack predictive power.

  **5. Scope and Timeline**
  Six months is a compressed timeframe for this level of conceptual granularity. The work will be divided as follows:

  *   **Months 1–2 (Conceptual Mapping):** Refining the definitions of the three dimensions and finalising the taxonomy of hypocrisy cases. This includes reviewing general literature on standing to ensure the definitions are robust against standard objections.
  *   **Months 3–4 (Case Analysis):** Developing the vignettes and subjecting them to analysis. This involves iterating through the matrix (e.g., testing 'downward in-domain' against 'upward cross-domain') to identify patterns in how standing is undermined.
  *   **Months 5–6 (Synthesis and Writing):** Drafting the final paper. This will involve integrating the findings into a coherent argument and addressing potential counter-arguments, specifically focusing on the risk of dimensional collapse.

  *Risk Assessment:* The primary risk is scope creep. The matrix of variables (domain, direction, context, dimension) generates a large number of potential case combinations. It will not be possible to analyse every permutation exhaustively. I will mitigate this by selecting 'paradigm cases' for each category rather than attempting a comprehensive survey of all logical possibilities. Additionally, there is a risk that the distinction between normative and affective standing proves difficult to maintain without relying on empirical psychology. I will mitigate this by keeping the analysis strictly within the realm of normative ethics, focusing on the *legitimacy* of the attitudes rather than the psychological experience of them.

  **6. Theoretical Significance**
  While this project avoids specific policy applications, its implications for the broader theory of moral responsibility are substantial. Moral responsibility practices rely on the assumption that agents can legitimately hold one another accountable. If standing is multidimensional, then the practices of blaming, punishing, and reconciling require more fine-grained normative tools than currently available.

  Demonstrating that hypocrisy selectively undermines authority clarifies the nature of moral community. It suggests that the authority to blame is not a monolithic property of the agent but a relational status dependent on the specific nature of the moral failure and the social dynamics involved. A successful defence of the multidimensional model would require a revision of how we understand the 'right to blame,' shifting the focus from the moral purity of the blamer to the specific functional role their blame is intended to serve. This offers a pathway to resolve stalemates in the literature regarding the 'forfeiture' view, allowing for a more accurate description of how moral authority functions in non-ideal conditions.
