      *   *Application to Case 2 (Non-failed group):* Calibration on harm vs. risk. Input availability on monitoring costs.
      *   *Application to Case 3 (Contributory Negligence):* Calibration on responsibility. Input availability on causation.
      *   *Limitations:* Where it fails (deep value conflicts, false precision).

  4.  **Refining the Tone and Format:**
