answer: |-
  Here is a complete design for the simulation, titled **"The Grain & The Gaze."** It is built to fit your 80-minute block, uses only low-tech materials, and is rigged to surface the "Audience Problem" and the "Internalization Lag" without you lecturing on them until the debrief.

  ### **Game Overview**
  *   **Players:** 18 students, divided into 3 "Villages" of 6.
  *   **Goal:** Maximize the **Village Viability Score** over 6 Rounds.
  *   **Core Mechanic:** Each round, every student privately chooses to **Obey** (take 2 points for the village) or **Defect** (take 5 points for themselves, but risk a penalty).
  *   **The Twist:** The penalty for Defecting depends on two hidden variables: **Surveillance** (Shame mechanic) and **Conscience** (Guilt mechanic).
  *   **Safety:** Individual choices are **never** revealed to peers. Only aggregate Village data is public.

  ---

  ### **Materials**
  *   **Index Cards:** 2 colors (e.g., Blue = Obey, Red = Defect). 10 per student.
  *   **Envelopes:** 1 per student per round (or 1 large envelope per Village to collect cards).
  *   **Whiteboard:** Divided into 3 sections (one per Village).
  *   **Institution Menu:** Handout or projected slide (see below).
  *   **Instructor Sheet:** A hidden tracking log for "Conscience Levels" (do not show students).

  ---

  ### **Setup (10 Minutes)**
  1.  **Divide:** Split the class into 3 Villages (A, B, C). Have them sit in clusters.
  2.  **The Story:** "You are managing a grain store. Every round, you can follow the rationing rule (Obey) or skim extra grain (Defect). Skimming helps you short-term but risks the store's collapse."
  3.  **The Secret:** "Your choices are anonymous. Put your card in the envelope. I will count them privately. I will never tell the class what *you* did, only how many Reds were in the box. Do not show your card to your neighbors."
  4.  **The Budget:** Each Village starts with **10 Budget Points**.
  5.  **The Menu:** Give them the Institution Menu. They have 2 minutes at the start of Rounds 1, 3, and 5 to purchase/adjust institutions using their Budget.

  **The Institution Menu (Simplified)**
  *   **The Watchtower (Cost 3):** Increases **Surveillance**. (If you Defect, you are more likely to be caught).
  *   **The Stockade (Cost 2):** Increases **Exit Cost**. (Harder to leave the village).
  *   **The Catechism (Cost 4):** Increases **Conscience**. (Builds a hidden 'Habit' variable).
  *   **The Amnesty Box (Cost 1):** Allows private confession to reduce penalty.
  *   **Do Nothing:** Save budget.

  ---

  ### **The Rounds (50 Minutes)**
  *Each round takes approx. 8 minutes.*

  **Round 1: Baseline**
  *   **Environment:** Stable. No special conditions.
  *   **Action:** Villages buy institutions. Students vote Obey/Defect.
  *   **Scoring:** You collect cards. Calculate scores based on the *Active Institutions*.
  *   **Board Update:** Write the Village Score and the % of Defectors (e.g., "Village A: 40 pts, 15% Defect"). **Do not reveal the formula.**

  **Round 2: Consolidation**
  *   **Environment:** Stable.
  *   **Action:** Villages can adjust institutions. Vote.
  *   **Scoring:** Same as Round 1.
  *   **Note:** If they bought *Catechism*, increment their hidden **Conscience Level** by +1.

  **Round 3: The Fog (Anonymity)**
  *   **Environment Shift:** "A fog rolls in. The Watchtower is blinded."
  *   **Mechanic:** **Surveillance drops to 0** for this round only. Even if they bought the Watchtower, it doesn't work.
  *   **Action:** Vote.
  *   **Scoring:** Defectors are not caught by surveillance. *However*, if they have **Conscience Level**, they still pay a penalty.
  *   **Expected Outcome:** Villages that relied only on Watchtowers (Shame) will see defection spike and scores drop. Villages with Catechism (Guilt) will hold steady.

  **Round 4: The Frontier (Exit)**
  *   **Environment Shift:** "A neighboring settlement opens up. Exit is cheap."
  *   **Mechanic:** If a Village's Defection Rate > 30%, **2 Members Leave** (remove 2 students' potential points from the total).
  *   **Action:** Vote.
  *   **Expected Outcome:** High-defection villages shrink. This punishes the "Shame" villages that just cracked under the Fog.

  **Round 5: The Liberty (Repeal)**
  *   **Environment Shift:** "The Council repeals all Institutions. You have no rules, no Watchtower, no Catechism."
  *   **Mechanic:** **All Institutions are turned off.** Budget is irrelevant.
  *   **The Hidden Lag:** **Conscience Level does NOT reset.** It decays by only 1 point.
      *   *Instructor Note:* If a Village bought Catechism in Rounds 1-2, their Conscience Level is likely 2 or 3. In Round 5, even though rules are repealed, the "Internal Cost" of defecting remains high for them.
  *   **Action:** Vote.
  *   **Expected Outcome:** Villages that built Conscience will still Obey at high rates, even with no rules. Villages that relied on Watchtowers will Defect massively.
  *   **The Discovery:** Students will ask, "Why am I losing points for Defecting? The rules are gone!" You say: "Calculate your score based on the sheet." (They can't see the hidden Conscience variable).

  **Round 6: The Aftermath**
  *   **Environment:** No institutions. No penalties.
  *   **Action:** Final Vote.
  *   **Scoring:** Conscience Level finally decays to 0. Pure anarchy.
  *   **Expected Outcome:** Everyone Defects. Scores plummet.

  ---

  ### **Scoring Logic (Instructor Only)**
  *Keep this on a hidden sheet. Do not show students until Debrief.*

  *   **Base Payoff:** Obey = +2 pts to Village Pool. Defect = +5 pts to Village Pool.
  *   **Surveillance Penalty:** If *Watchtower* is active: Roll a die for each Defector. On 4-6, they are caught. Penalty = -10 pts from Village Pool. (In Round 3, Watchtower is broken, so no rolls).
  *   **Conscience Penalty:** If *Conscience Level* > 0: Every Defector automatically triggers a -3 pts penalty per Level, **regardless of Surveillance**.
      *   *Example:* Conscience Level is 2. Defector gets +5 base, but -6 penalty. Net = -1. Obeyer gets +2. Rational choice is to Obey, even if no one is watching.
      *   *Decay Rule:* Conscience Level +1 when Catechism is bought. Conscience Level -1 when Catechism is repealed (Min 0).

  ---

  ### **Debrief Guide (20 Minutes)**
  *Do not start by defining Guilt/Shame. Start with their data.*

  **1. The Data Reveal (5 min)**
  *   Project the hidden "Conscience Level" track for each Village.
  *   Show Round 3 (Fog): Point out which villages collapsed when the "eyes" were closed.
  *   Show Round 5 (Repeal): Point out which villages kept obeying even after rules were deleted.
  *   **Ask:** "Village A, in Round 5, the rules were gone. Why did half of you still Obey? It cost you points."
  *   **Ask:** "Village B, in Round 3, the Watchtower broke. Why did defection spike immediately?"

  **2. Mapping the Concepts (10 min)**
  *   **Shame (The Watchtower):** It works only when the mechanism functions. It is fragile to **Anonymity** (Round 3) and **Exit** (Round 4). If you can leave the village, the Watchtower can't hurt you.
  *   **Guilt (The Catechism):** It is expensive to build (Cost 4). It takes rounds to ramp up. But notice Round 5: **The rule died, the habit lived.** That is the Lag. You cannot legislate an internal observer into existence quickly, and you cannot legislate it out of existence quickly.
  *   **The Trade-off:** Shame is cheap and fast but brittle. Guilt is expensive and slow but robust.

  **3. The Failure Modes (5 min)**
  *   **Shame's Failure:** Hypocrisy and Exile. In Round 4, when people left, did the village punish them? No, they just vanished. A shame culture needs bounded borders.
  *   **Guilt's Failure:** Scrupulosity. Did anyone feel frustrated in Round 5 that they were "obeying" a rule that didn't exist anymore? That is the cost of the internal observer—it doesn't switch off when it's safe to do so.
  *   **The Limitation:** Acknowledge openly: "This game gave you points, not feelings. You didn't feel *ashamed* when caught, you lost points. You didn't feel *guilty*, you calculated a penalty. Real moral emotions take a childhood to build. This game compresses time, so it simulates the *structure* of the emotions, not the *experience*."

  ---

  ### **Risk Mitigation: What Will Go Wrong & How to Rig It**

  **1. Worry: Real Shame in the Room**
  *   **Risk:** A student feels exposed if their Village fails or if they are the only Defector.
  *   **Rig:** **Aggregate Data Only.** Never say "Who defected?" Never say "Village A is failing because *someone* cheated." Say "Village A's *system* allowed leakage."
  *   **Rig:** **The Envelope Protocol.** Be religious about collecting cards in envelopes. If a student drops a card, pick it up immediately without looking. Model that the secret is sacred.
  *   **Rig:** **Fictional Stakes.** Remind them: "This is about grain points, not your character. A high defection rate is a valid data point, not a moral failing of this class."

  **2. Worry: Meta-Gaming the Points**
  *   **Risk:** Students treat this as a pure optimization puzzle ("We should all Defect in Round 6 to maximize individual gain").
  *   **Rig:** **The Viability Threshold.** Announce at the start: "If a Village's Total Score drops below 0, the Village Collapses. Everyone in that Village gets a 'Failed State' mark on their participation grade (or just 'loss' in game terms)." This forces them to care about the *collective* survival, not just individual point maximization.
  *   **Rig:** **Debrief the Meta-Game.** If they meta-game, use it. "You optimized for points, but you ignored the social cost. That's exactly what a psychopath does in a shame culture. Good job simulating the breakdown."

  **3. Worry: Shame = Embarrassment**
  *   **Risk:** Students conflate the game mechanic (losing points when caught) with the feeling of blushing.
  *   **Rig:** **Language Discipline.** During the game, do not use the words "Guilt" or "Shame." Use "Surveillance" and "Conscience."
  *   **Rig:** **Debrief Distinction.** Explicitly state: "Embarrassment is about social awkwardness. Shame is about *identity* ('I am bad'). The game simulated the *consequences* of shame (exclusion/penalty), not the feeling. Don't confuse the scoreboard for the soul."

  **4. Worry: The Lag Isn't Felt**
  *   **Risk:** They don't notice the Conscience penalty persisting in Round 5.
  *   **Rig:** **Make the Penalty Visible on the Scoreboard.** In Round 5, when you write the score, write: "Base Gain: 50 | Penalties: 30." They will see the penalty exists. When they ask "Why?", say "Check your Rule Sheet." The Rule Sheet says "Conscience decays slowly." They will realize *they* built a monster they couldn't kill. That is the feeling you want.

  ### **Instructor Cheat Sheet (The Hidden Variables)**
  *Keep this on your desk.*

  | Village | Round 1 | Round 2 | Round 3 (Fog) | Round 4 (Exit) | Round 5 (Repeal) | Round 6 (End) |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Conscience** | Start: 0 | +1 if Catechism | Same | Same | **-1 Decay** | **-1 Decay** |
  | **Surveillance** | Active if Watchtower | Active | **OFF** | Active | **OFF** | **OFF** |
  | **Exit Risk** | None | None | None | **If Defect >30%** | None | None |

  *Note:* In Round 5, if they ask why they are still being penalized without a Watchtower, point to the "Catechism" rule on their handout: *"Moral habits persist beyond institutional support."* Do not explain further until the debrief. Let them sit with the frustration that the rule is gone but the cost remains.
