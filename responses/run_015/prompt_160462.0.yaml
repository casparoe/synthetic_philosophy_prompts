  5.  **Refining the "Institutions" (The Menu):**
      *   *Shame Tools:* "The Town Square" (Public recording of infractions), "No Walls" (Everyone sees everyone). Cost: Low. Effect: High penalty if caught.
      *   *Guilt Tools:* "Moral Catechism" (Novice training), "Confessional" (Private admission). Cost: High (takes budget). Effect: Reduces benefit of defecting over time (internal cost).
      *   *Exit:* "Open Borders." Effect: If defection gets too high, people leave (points vanish).

  6.  **Developing the "Lag" (The Hard Part):**
      *   How to make them *feel* the lag without explaining it?
