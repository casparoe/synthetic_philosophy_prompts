      *   **Round 6 (10 min):** Final Decision.
      *   **Debrief (20 min):** Connect mechanics to theory.

  8.  **Addressing the "Real Shame" Risk (Crucial):**
      *   Do not ask students to reveal choices to each other.
      *   Do not punish specific students publicly.
      *   The "Punishment" is abstract points deducted from the *Village Pool*, not the individual.
      *   Wait, if it's deducted from the Village Pool, free-riding is the issue.
      *   *Better:* Individual points contribute to Village Survival. If Village Score < X, everyone fails. This creates collective responsibility without individual scapegoating.
      *   *Instruction:* "Your choices are secret. I will never tell the class what you chose. The game is about the *system*, not you."

  9.  **Drafting the Materials:**
      *   Index cards (Red/Blue).
      *   Envelopes (for secret submission).
      *   Whiteboard (Scoreboard).
      *   Budget Sheet.

  10. **Refining the Debrief:**
      *   Must hit: Shame needs eyes. Guilt needs time to grow and time to die.
      *   Must acknowledge: Game isn't real life. No real emotions felt.
      *   Must warn: Shame's hypocrisy vs. Guilt's scrupulosity.

  11. **Self-Correction on "Lag":**
      *   If I just tell them the payoff changed, they won't feel it.
      *   I need the *Instructor* to act as the "Internal Observer."
      *   *Idea:* In Rounds 1-3, if they buy "Training," I (the instructor) start asking a reflective question before they submit cards. "Are you sure?"
      *   *Better:* Keep it mechanical but hidden. I will calculate payoffs based on the hidden "Habit" variable. When they repeal the rule, they will expect payoffs to go back to baseline, but they won't. I will reveal the "Habit Track" only at the end.
      *   *Wait, simpler:* The "Habit" is a token bucket. To Defect, you must pay a token. You get tokens from "Training." If you repeal Training, you keep the tokens you have, but get no new ones. Once tokens are gone, Defecting becomes cheap again. This is tangible.
