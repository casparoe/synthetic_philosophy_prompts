      *   Safety: Emphasize anonymity repeatedly.

  13. **Predicting Failures:**
      *   *Meta-gaming:* Students might collude to maximize points. *Fix:* Make collusion impossible (silent voting).
      *   *Shame/Embarrassment:* Students might feel bad if their Village fails. *Fix:* Frame Village Failure as a "Theoretical Outcome," not a grade.
      *   *Real Shame:* Someone might feel singled out. *Fix:* Aggregate data only. Never individual.

  14. **Writing the Response:**
      *   Structure: Game Overview, Materials, Setup, Round Flow, Scoring Logic (Instructor Only), Debrief Guide, Risk Mitigation.
      *   Tone: Professional, pedagogical, precise.

