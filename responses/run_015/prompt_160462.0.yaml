          *   *Hidden Variable:* "Habit Strength." If they buy "Novice Training," Habit Strength goes up. If they repeal it, Habit Strength stays high for 2 rounds then drops. This affects the point value of Defecting.

  4.  **Addressing the Risks:**
      *   *Meta-gaming:* Students might try to "win" by maximizing points, ignoring the simulation aspect. *Mitigation:* Frame the points as "Community Viability." If the village collapses, everyone loses.
      *   *Shame = Embarrassment:* Need to explicitly distinguish in debrief. In-game, "Shame" is just a mechanic (Public Exposure).
