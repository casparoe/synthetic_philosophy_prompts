  *   **0.10 rides on Normative Status:** If the tug to pass tracks a normative duty rather than mere hedging, grabbing becomes impermissible rather than just risky.
  *   **-0.00 rides on Risk Dominance:** Grabbing remains the risk-dominant safety play, preventing the credence from falling to zero despite the logical breakdown.

  **Bet Least:** I would bet least on the **Normative Status** term, as distinguishing between social preferences and genuine normative obligations in a one-off game is empirically and philosophically murky.

  **Move Most:** Settling whether **Reasoning Depth** changes the answer would move the total most, as it carries the largest weight (0.40) and determines whether the induction chain survives at all.
