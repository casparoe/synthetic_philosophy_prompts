  *(Final thought on the "One Number"):* If they *must* pick one, **False Positive Rate Parity** is often the most defensible for risk models to ensure one group isn't being saddled with debt they can't handle at higher rates than another. However, **False Negative Rate Parity** is better for civil rights. I will suggest presenting the *gap* in error rates as the number.

