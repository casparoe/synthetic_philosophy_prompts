answer: |-
  This is one of the most famous and debated passages in the history of philosophy. You have hit on exactly the right tension: Is Hume making a strict logical claim (the "Guillotine" or "Hume's Law" interpretation), or is he making a methodological complaint about sloppy writing?

  The short answer is: **It is both, but the logical point rests on a psychological claim.**

  To understand why this "small attention" would "subvert all the vulgar systems of morality," we have to look at what Hume thinks the human mind is actually doing when it makes moral judgments. Here is a breakdown of what is going on in that paragraph.

  ### 1. Is it a Logical Point or a Modest Point?

  It is a **psychological point with logical consequences.**

  Hume is not a modern logician analyzing symbolic validity (like *P → Q*). He is an empiricist analyzing the **faculties of the mind.** For Hume, the mind has two distinct engines:
  1.  **Reason:** Deals with facts, truth, falsehood, and relations of ideas (the realm of *Is*).
  2.  **Passion/Sentiment:** Deals with action, motivation, approval, and disapproval (the realm of *Ought*).

  When Hume says it is "inconceivable" that an *ought* can be deduced from an *is*, he means that **Reason alone is inert.** You can stare at all the facts in the universe (e.g., "This knife is sharp," "This skin is penetrable," "This person will die if stabbed"), and Reason will never produce a *motivation* to act (e.g., "You ought not stab him").

  Facts describe the world; morals move us to act. Since facts lack the power to move us, you cannot derive the power to move us (ought) solely from the description of the world (is) without introducing a new mechanism (like a sentiment or desire).

  So, when he calls it "inconceivable," he isn't just saying, "You skipped a step in your proof." He is saying, "You are trying to get blood from a stone. You are trying to get **motivation** out of **information** using only Reason, and that is psychologically impossible."

  ### 2. Why would this "Subvert all the vulgar systems of morality"?

  This is the crux of your question. If Hume were just telling authors to add footnotes, it wouldn't destroy morality. It would just make books longer. So why does he say it would **subvert** (overturn/destroy) existing systems?

  Because the "vulgar systems" of Hume's day (Rationalism, Natural Law, Divine Command theory) claimed that morality was **objective fact.**

  *   **The Rationalist View:** Morality is like mathematics. Just as $2+2=4$ is a fact discoverable by reason, "Murder is wrong" is a fact discoverable by reason.
  *   **Hume's Attack:** If you force these philosophers to explain how they got from *Is* to *Ought*, they will fail. They will try to use Reason to bridge the gap. But since Reason cannot produce action or sentiment, their bridge collapses.

  If they cannot explain the deduction, they cannot claim that morality is a matter of objective fact known through Reason. Instead, they are forced to admit that morality is based on **sentiment** (how we feel about the facts).

  This "subverts" their systems because:
  1.  **It removes Objective Authority:** If morality is based on sentiment, it isn't "out there" in the universe or in God's rational law; it is "in here," in human nature.
  2.  **It undermines Rational Justification:** You can't argue someone into being moral using logic alone; you have to appeal to their sympathies.
  3.  **It changes the subject:** Moral philosophy stops being about discovering moral truths (like physics) and starts being about studying human psychology (like biology).

  ### 3. What is the "New Relation"?

  Hume writes: *"For as this ought, or ought not, expresses some new relation or affirmation..."*

  In the *Treatise*, Hume argues that relations (like cause/effect, resemblance, contrariety) are discovered by Reason. But "Ought" is not a relation between objects. You can look at a murder scene and see the body, the weapon, the blood (all *Is* statements). You will never see the "wrongness" floating there with the blood.

  The "wrongness" is a **sentiment of disapprobation** in the observer. That is the "new relation." It is a relation between the object (the action) and the subject (the viewer's feelings).

  When moralists slide from *Is* to *Ought* without noticing, they are disguising their own feelings as facts about the world. They are projecting their internal sentiment onto the external universe and pretending it belongs there. Hume is demanding they admit the projection.

  ### Summary: What is Hume actually arguing?

  Hume is not saying we can never make moral judgments. He is a moralist himself! He is arguing that:

  1.  **The Derivation is Hidden:** Moral philosophers claim to use Reason to find moral truths, but they are secretly relying on Sentiment.
  2.  **The Gap is Real:** You cannot logically or psychologically move from descriptive premises to a prescriptive conclusion *using Reason alone*. You need a premise about human desire or sentiment to make that jump.
  3.  **The Consequence is Radical:** If you expose this gap, you prove that morality is not a system of rational truths (like math), but a system of human sentiments. This destroys the foundation of any moral system that claims to be based purely on Reason, God, or the Nature of the Universe.

  So, to answer your specific doubt: It is not just about authors being sloppy. It is about authors being **deceived about the source of their own authority.** By demanding they explain the jump, Hume forces them to admit that their authority comes from human feeling, not divine or rational law. That is why the systems are subverted.
