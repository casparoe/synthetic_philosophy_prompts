prompt: |-
  I'm trying to sort out when looking before you leap is actually rational and when it isn't, given Good's theorem that free information never hurts an ideal expected utility maximizer. Can you give me the desiderata list for any decent theory of rational inquiry and info-seeking — like what cases it has to get right, what distinctions it has to respect, with the why behind each one?

  I'm especially thinking of cases like a free medical test you know you'll overreact to, learning something that changes what you care about like finding out the ending of a novel you're halfway through, and peeking in a game where the other player knows you will peek. Tell me which requirements are non-negotiable vs just nice to have for one camp, and if any two on your list can't both be satisfied at once, plus which single requirement rules out the most simple theories. Keep it focused on the criteria, not a big tour of who says what, and short enough I can realy use it as a checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata list:

  1.  **Analyze the Request:**
      *   **Topic:** Rationality of information seeking (looking before leaping) vs. Good's Theorem (free information is always valuable for expected utility maximizers).
      *   **Task:** Create a desiderata list (criteria/checklist) for a theory of rational inquiry/info-seeking.
      *   **Specific Cases to Address:**
          *   Free medical test (known overreaction/anxiety).
          *   Spoilers (changing what you care about/experience value).
          *   Game theory (opponent knows you peeked).
      *   **Constraints:**
          *   Explain the "why" behind each criterion.
          *   Distinguish non-negotiable vs. nice-to-have.
          *   Identify incompatibilities (trade-offs).
          *   Identify the requirement that rules out the simplest theories.
          *   Keep it focused on criteria, not a literature review.
          *   Keep it short/checklist-style.

  2.  **Deconstruct Good's Theorem & Its Limitations:**
      *   *Good's Theorem (1967):* For a standard Bayesian expected utility maximizer, the expected value of free information is non-negative. You should always take free info.
      *   *Why it fails in the prompt's cases:*
          *   *Medical Test:* The agent isn't a perfect EU maximizer *after* receiving the info (bounded rationality/akrasia). Or the utility function includes anxiety *before* the result.
          *   *Spoiler:* The utility of the *process* (reading) depends on ignorance. Information changes the payoff structure of the activity itself.
          *   *Game Theory:* The act of looking changes the opponent's beliefs/strategy (signaling). Information isn't "free" because the *act* of acquiring it has strategic costs.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Attempt 1 (Mental Outline):*
          1.  Must match Good's theorem when agents are perfect.
          2.  Must allow saying "no" to info if it hurts feelings.
          3.  Must handle game theory where looking changes things.
          4.  Must distinguish cost of info vs. cost of knowing.
          5.  Must handle changing preferences.

      *   *Attempt 2 (Refining for Rigor & "Why"):*
          1.  **Consistency with Ideal EU:** If you are perfect and info is truly free, look. (Why: Baseline rationality).
          2.  **Psychological Costs:** Must account for anxiety/regret. (Why: Medical test case).
          3.  **Constitutive Ignorance:** Must account when ignorance is part of the good. (Why: Spoilers).
          4.  **Strategic Transparency:** Must account when the *act* of looking is observable. (Why: Game theory).
          5.  **Computational Cost:** Looking takes brainpower. (Why: Bounded rationality).

      *   *Attempt 3 (Selecting the "Non-Negotiable" vs. "Trade-off" aspects):*
          *   The prompt asks for a checklist to evaluate theories.
          *   Need to highlight the tension between "Information is Power" and "Ignorance is Bliss."
          *   Need to identify the "Killer Criterion" (which one kills simple theories?). That's likely the distinction between *cost of acquisition* and *cost of possession*.

  4.  **Finalizing the List (incorporating specific constraints):**

      *   *Criterion 1: The Good's Theorem Baseline.* (Non-negotiable for ideal agents).
      *   *Criterion 2: The Cost of Possession.* (Crucial for medical test/anxiety).
      *   *Criterion 3: The Cost of Acquisition (Signaling).* (Crucial for game theory).
      *   *Criterion 4: Preference Stability vs. Endogenous Preferences.* (Crucial for spoilers).
      *   *Criterion 5: Computational/Bounded Rationality.* (Nice to have/Realistic).

      *   *Incompatibility:* "Preference Stability" vs. "Endogenous Preferences." Standard EU assumes stable prefs. Spoilers require prefs to depend on information state.
      *   *Killer Criterion:* Distinguishing *Cost of Possession* from *Cost of Acquisition*. Simple theories only look at acquisition cost.

  5.  **Refining the Output (Checking against prompt instructions):**
      *   *Short/Checklist?* Yes, use bullet points and bold text.
      *   *Why behind each?* Include a "Rationale" line.
      *   *Non-negotiable vs. Nice-to-have?* Label them.
      *   *Incompatibilities?* Add a section on tensions.
      *   *Single requirement ruling out simple theories?* Highlight this.
      *   *Specific cases?* Ensure Medical, Spoiler, Game Theory are mapped to the criteria.

  6.  **Polishing the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to clarify *why* Good's theorem holds (updating on evidence) and why it breaks (utility depends on belief state, not just world state).
      *   *Correction:* Ensure the "Game Theory" point emphasizes that the *action* of looking is the signal, not just the info content.
      *   *Correction:* The "Spoiler" case is technically about *utility functions defined over belief states*, not just changing preferences. I need to be precise there.

  7.  **Final Review against constraints:**
      *   Did I answer which are non-negotiable? Yes.
      *   Did I answer incompatibilities? Yes.
