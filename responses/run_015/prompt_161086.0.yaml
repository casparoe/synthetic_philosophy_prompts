      "I'm defining it as responsiveness to reasons," Marisol corrected. "Free will is a cluster of capacities: self-control, reflection, acting on considered judgment. Second Thought dampens the noise—craving, fatigue—and lets the signal through. It reopens alternatives that impulse slams shut. That *is* freedom."

      "It's efficiency," Tobias said. "But who sets the threshold? Engineers. Insurers. If an insurer subsidizes this and switches it on by default to lower claim rates, does the user possess more freedom? You can't say 'yes' just because they didn't opt out. If your view counts any well-functioning causal machinery as freedom, even machinery someone else installed to manage risk, then you've emptied the word of ownership."

      Marisol paused. The insurer scenario was the trap. If she relied on consent, she admitted the machinery wasn't enough on its own. "Even if the insurer installs it," she said slowly, "the capacity resides in the agent. The machinery integrates with their neural architecture to extend their reflective reach. If a pacemaker extends life, we don't ask if the cardiologist owns the heartbeat. The locus of control is the ability to act on reasons, not the provenance of the tool enabling it."

      "But a pacemaker doesn't decide when to beat," Tobias countered. "This device intervenes in the decision loop. Consider the parity problem. If someone achieves this stability through years of therapy or meditation, you call it enhanced agency. I agree. But there, the causal history is internalized. The neural pathways are reshaped by the agent's own effort over time. With Second Thought, the improvement is produced by factors outside the agent—a black-box model trained on a population. The agent isn't the source; they're the venue."

