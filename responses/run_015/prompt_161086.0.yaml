      Tobias rubbed his temples. "I'll concede the gain. If it reduces violence and helps people keep promises, it's socially desirable. I'm not arguing for banning it. But 'desirable' isn't 'free.' If I act because a haptic cue held me back, can you blame me for the anger I didn't act on? Can you praise me for the patience I didn't generate? The device makes behavior predictable, but it severs the link required for desert. You're shaping behavior; I'm looking for authorship."

      "And I'm worried your authorship is a ghost," Marisol said. "If 'sourcehood' requires being untouched by external causation, no one is free. But I will concede this: if the device becomes ubiquitous, our practices of blame might need adjustment. We can't hold people responsible for failures the device was designed to prevent. So yes, it complicates desert. But it saves the action."

      "It saves the action by bypassing the agent," Tobias said. "Here's where we bottom out. You think free will is for shaping behavior toward endorsed outcomes. I think it's for grounding responsibility when outcomes diverge. You're willing to accept external scaffolding if it produces the right shape. I'm not, because the scaffolding bears the weight, not the person."

      "And you're willing to let people fail," Marisol said, "to preserve a notion of agency that survives ordinary empirical luck. Is a notion of agency worth having if it requires ignoring the tools that actually let us succeed?"

      "Only if success without authorship is just management," Tobias said. "We're not writing a public health statement. We're writing about ethics. If we say this is freedom, we stop asking who holds the leash."

      "If we say it isn't," Marisol replied, "we tell people the help they feel is a lie."

      They sat in silence. The paragraph remained unwritten. They agreed on the data, and the outcomes, but the word "freedom" sat between them, pointing in two different directions: one toward the future of what we do, the other toward the past of who we are.

