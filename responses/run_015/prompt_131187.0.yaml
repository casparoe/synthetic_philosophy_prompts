  *(Self-Correction during drafting)*: I need to make sure I don't just list the defeaters in the final output but actually show the *process* of ranking them as requested ("before you answer, brainstorm... and then rank them"). I will structure the first section explicitly as the "Pre-computation/Brainstorm" phase.

