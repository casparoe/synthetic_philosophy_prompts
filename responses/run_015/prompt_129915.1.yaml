answer: |-
  1. **Agreed Claims**

  1. Social isolation inflicts profound harm on entities with human psychology, independent of metaphysical personhood status.
  2. Withdrawing recognition from a previously recognized person is *pro tanto* wrong, not merely a descriptive correction.
  3. Capacities alone do not guarantee moral flourishing; relational embedding is causally indispensable for the exercise of agency.
  4. Personhood status dictates normative treatment, not merely descriptive classification.
  5. Entities lacking all psychological capacities cannot be persons, even if fully relationally embedded.
  6. Entities with full capacities but no relations suffer a deficit in moral realization, though explanations differ.
  7. Duties to intimates are generally more stringent than duties to strangers, but duties to strangers exist.
  8. The moral status of marginal cases cannot be settled solely by current cognitive capacity.
  9. Community recognition can be morally mistaken, such as recognizing a criminal gang leader as authoritative.
  10. An entity's relational history matters for its current moral status, not just its current state.

  2. **Disagreements Table**

  | Issue | RC Formulation | IC Formulation | Judgment |
  | :--- | :--- | :--- | :--- |
  | **Metaphysical Basis** | Relations partly constitute the status of personhood; without them, the status does not exist. | Capacities constitute the status; relations are causally necessary for development but not status. | Substantive |
  | **The Unreached** | The Unreached lacks personhood status due to absence of constitutive relations, though retains human rights. | The Unreached possesses full personhood status via capacities, despite relational deprivation. | Substantive |
  | **The Artifact** | The Well-Related Artifact may acquire personhood status through sustained reciprocal recognition. | The Artifact cannot be a person due to lack of appropriate biological/psychological substrate. | Substantive |

  3. **Cruxes Table**

  | Crux & Case | RC Prediction | IC Prediction | Falsification Conditions |
  | :--- | :--- | :--- | :--- |
  | **Constitution vs. Development**<br>(Case: The Unreached) | Status is absent or diminished. If RC appeals to *potential* relations to rescue status, it risks collapsing into IC. | Status is intact. Capacities are sufficient; isolation is a harm to flourishing, not status. | **RC:** If Unreached is intuitively judged identical in status to embedded humans.<br>**IC:** If Unreached is judged to lack standing entirely. |
  | **Recognition Hostage**<br>(Case: Adaeze) | Adaeze retains status via past relations or normative ideal relations, not current refusal. Status is not hostage to wrongdoing. | Adaeze retains status via internal capacities. Recognition withdrawal is a wrong done *to* a person, not removal *of* personhood. | **RC:** If Adaeze loses status solely due to others' refusal.<br>**IC:** If withdrawal of recognition changes her metaphysical status. |
  | **Normative Relation**<br>(Case: The Apostate/Gang) | Relations must be normatively valid (just/reciprocal). Gang membership or apostasy does not constitute valid personhood relations. | Relations are causally descriptive. Moral status remains fixed by capacities regardless of community values. | **RC:** If immoral relations confer full status.<br>**IC:** If moral status fluctuates with community values. |
  | **Symmetry**<br>(Case: Unreached vs. Artifact) | Asymmetry is permissible: Artifact has relations but wrong substrate; Unreached has substrate but no relations. | Asymmetry is required: Unreached is a person; Artifact is not. Substrate is the decisive factor. | **Both:** If intuition demands identical verdicts for both cases despite substrate/relation differences. |
  | **Duties to Strangers**<br>(Case: The Distant Stranger) | Duties arise from shared normative community potential. Stringency may vary but must be non-zero. | Duties arise from capacity-based status. Stringency depends on need, not relational distance. | **RC:** If no duty exists without actual relation.<br>**IC:** If duties to strangers are significantly weaker than to intimates without justification. |
  | **Degrees and Margins**<br>(Case: Life Cycle Margins) | Status admits degrees corresponding to relational integration and capacity development. | Status is binary (based on species or threshold capacity); moral protection admits degrees. | **RC:** If margins show sharp status boundaries.<br>**IC:** If margins show gradual ontological status changes. |

  4. **Closing Statement on Verbal Disputes and Withdrawals**

  Several disputes initially appeared substantive but proved verbal upon refining formulations. Specifically, the disagreement over whether relations are "essential" masked a verbal dispute: IC agreed relations are essential for *development* and *flourishing*, while RC insisted they are essential for *constitution*. Once "constitution" was defined as "necessary for the existence of the status itself" rather than "necessary for the exercise of the status," the overlap clarified the divergence.

  IC withdrew the claim that relations are morally irrelevant to status, conceding that recognition withdrawal is a distinct wrong. RC withdrew the claim that total isolation destroys personhood entirely, conceding that the Unreached retains significant moral protection regardless of metaphysical status. The remaining disagreements concern the metaphysical ground of that protection: whether it rests on the individual's intrinsic features (IC) or on the normative demands of a community that *ought* to exist (RC). Both parties accept that the cases of Adaeze and the Unreached provide the decisive empirical ground for future adjudication.
