answer: |-
  # Seminar Activity: The Bureaucrat's Envelope
  **Topic:** The Paradox of Fiction (Focus: Moral Anger & Reactive Attitudes)
  **Level:** Upper-Level Philosophy Seminar
  **Class Size:** 12–14 Students
  **Duration:** 90 Minutes

  ## I. Preparation (Before Class)

  **1. The Narrative Text**
  Print 14 copies of the following passage. The text is identical for all students.

  > **Excerpt A-7**
  > "At 08:42, the applicant, Mrs. G., placed the form on the counter. She was shaking. She explained that the missing signature belonged to her son, who was currently in intensive care and unconscious. She asked for a 24-hour grace period to retrieve it. Caseworker D. reviewed the file. Protocol 14.B states that forms without all signatures are void. D. told Mrs. G. that making an exception would compromise the integrity of the queue. D. stamped the file 'REJECTED' and slid it back. Mrs. G. asked if her son could sign later. D. said the system does not allow retroactive validation. D. then called the next number. Mrs. G. did not leave the office; she sat on the floor beside the intake desk. Security was called at 09:15."

  **2. The Framing Envelopes**
  Prepare two types of manila envelopes. Place one copy of the text inside each.
  *   **Frame A (Documentary):** Label the outside: *"CONFIDENTIAL: Verified Transcript from City Housing Authority Inquiry, 2022."*
  *   **Frame B (Fiction):** Label the outside: *"EXCERPT: Unpublished Manuscript, 'The Gray Zone' (Dystopian Novel), 2023."*
  *   **Distribution:** Prepare 7 Envelope A and 7 Envelope B. Randomize them so that within the four seminar groups, the framing is mixed (e.g., two groups get mostly A, two get mostly B, or mix within groups). *Recommendation for maximum tension:* Give two groups entirely Frame A and two groups entirely Frame B. This creates group-level data rather than individual noise.

  **3. The Response Sheets (For Jurors)**
  Create a private slip for the "Juror" role.
  *   **Q1:** On a scale of 1–10, rate the intensity of your indignation/anger toward Caseworker D.
  *   **Q2:** Does Caseworker D. deserve moral blame? (Yes/No/Unsure)
  *   **Q3:** **Resource Commitment:** The seminar has a pool of 100 "Civic Points." You may allocate up to 10 points from your share to a formal protest letter regarding this incident.
      *   *Condition:* You may only commit these points if you judge your anger in Q1 to be a **genuine response to a real event**. If you judge this to be a story, you must allocate 0.
      *   *Allocation:* ______ / 10 Points.

  **4. The Recorder Sheet**
  Create a sheet for the "Recorder" role.
  *   Track the average Anger Rating of the Jurors.
  *   Track the Total Points Committed by the Jurors.
  *   Note any verbal hesitation Jurors express regarding the "Condition" in Q3.

  ---

  ## II. Session Timeline (90 Minutes)

  ### Phase 1: Private Encounter (20 Minutes)
  *   **0:00–0:05 (Setup):** Students enter. Envelopes are already on desks. Divide the class into 4 groups of 3–4. In each group, assign 2 students as **Jurors** and 1–2 as **Recorders**. (If a group has 4, 3 Jurors/1 Recorder).
  *   **0:05–0:10 (Reading):** Instruct students to open envelopes silently. They must read the text inside. No discussion yet.
  *   **0:10–0:20 (Response):** Jurors complete the Private Response Sheet. Recorders wait silently.
      *   *Facilitator Instruction:* "Read the condition on Q3 carefully. Your allocation of points is a binding commitment to the seminar record only if you believe your emotional response warrants action against a real wrong. If this is fiction, the points must remain unspent."

  ### Phase 2: Group Deliberation (25 Minutes)
  *   **0:20–0:45:** Groups convene.
  *   **Task:** Jurors reveal their Point Allocation (Q3) and Anger Rating (Q1) to the Recorder. They must explain *why* they allocated that amount.
  *   **Recorder Duty:** Recorders do not offer opinions. They fill out the Recorder Sheet, noting discrepancies.
      *   *Look for:* Did anyone report high anger (8+/10) but allocate 0 points? Did anyone allocate points despite suspecting the text might be fictional?
      *   *Discussion Prompt for Groups:* "Do our allocations match our feelings? If we feel anger, are we permitted to act on it given the label on our envelope?"
  *   **Facilitator Role:** Circulate quietly. Do not answer questions about the text's authenticity. If asked, say: "Rely on the label provided in your envelope."

  ### Phase 3: Presentation & Reveal (15 Minutes)
  *   **0:45–0:55 (Presentations):** Each group presents their data to the room.
      *   "Group 1: Average Anger 8.5, Total Points Committed 25."
      *   "Group 2: Average Anger 7.0, Total Points Committed 0."
      *   *Crucial:* Do not reveal which Frame (A or B) the groups had yet. Ask the class to hypothesize why Group 2 committed 0 points despite high anger.
  *   **0:55–1:00 (The Reveal):** Facilitator asks groups to hold up their envelopes.
      *   Reveal that half the room believed they were reading a **Documentary Transcript**.
      *   Reveal that half believed they were reading a **Dystopian Novel**.
      *   Compare the data: Did the "Novel" groups withhold points despite reporting anger? Did the "Documentary" groups spend points?

  ### Debrief: Mapping the Paradox (30 Minutes)
  *   **1:00–1:10 (Phenomenology vs. Cognition):**
      *   Ask the "Novel" Jurors who reported high anger: "Did the anger feel real in the moment?" (Phenomenology).
      *   Ask why they allocated 0 points. (Cognitive Evaluation).
      *   *Map:* This is the core tension. The affective state (anger) was present, but the cognitive belief (existence of the object) blocked the action tendency.
  *   **1:10–1:20 (The Revisionism Trap):**
      *   Ask the "Novel" Jurors: "Now that you know it is fiction, would you lower your Anger Rating from Phase 1?"
      *   *Observation:* Many will say, "Well, I guess I wasn't *really* angry."
      *   *Facilitator Move:* Do not correct them. Treat this as data. "Notice how the 'Fiction' label retroactively edits your memory of the emotion. Why does the label have that power? Does it erase the feeling, or just invalidate its justification?"
  *   **1:20–1:25 (Anger vs. Fear):**
      *   Explain why this is harder than the "Horror Movie" paradox. Fear of a monster is a survival reflex; it doesn't require the monster to be *morally* responsible. Anger requires a **moral object**. If Caseworker D. does not exist, they cannot be blameworthy. Therefore, the anger seems irrational in a way that fear of a dragon does not.
  *   **1:25–1:30 (Limitations & Theory):**
      *   **Honest Note:** Acknowledge that the "Civic Points" are symbolic. They cannot capture the gravity of actual injustice. Real moral anger demands real intervention, not seminar points. This activity simulates the *structure* of the commitment, not the *weight*.
      *   **Theoretical Framing:** Briefly mention that standard theories (Walton's Quasi-Emotion) try to solve this by saying the anger wasn't "real." But your experience suggests it *felt* real. The problem isn't the feeling; it's the **normative direction**.
      *   **Closing Question:** "This activity assumes that emotional rationality requires belief in the reality of the object. Can we reject that assumption without collapsing the distinction between appropriate anger (at a real criminal) and inappropriate anger (at a fictional character or a hallucination)?"

  ---

  ## III. Facilitator's Guide & Role Descriptions

  ### The Recorder Role
  The Recorder is the "phenomenological observer." Their job is not to judge the text but to judge the *Jurors' consistency*.
  *   **Instruction:** "You are the data keeper. If a Juror says 'I am furious' but writes '0 Points,' write that down. Ask them: 'Is the zero because you don't care, or because you think you shouldn't act?'"
  *   **Goal:** To make the gap between *feeling* and *willingness to act* visible to the group before the theory is introduced.

  ### Allocation Rules (Binding vs. Non-Binding)
  *   **The Rule:** Points are "spent" only if the Juror certifies the event as real.
  *   **The Tension:** This forces the Juror to confront the **Existence Condition** of moral emotions. If I am truly angry, I should want to act. If I refuse to act because "it's just a story," I am admitting my anger lacks a proper object.
  *   **Safety:** Ensure students know no actual money is at risk. The "Civic Points" might determine something trivial, like who chooses the break-time music or the order of essay topics, to give the "spending" a tiny bit of social weight.

  ### Honest Note on Stakes
  *   **Facilitator Script:** "We must acknowledge a limitation. Allocating symbolic points in a classroom is not the same as protesting real injustice. If Caseworker D. were real, 10 points would be insufficient. We use this proxy to isolate the *logic* of commitment, not to simulate the *consequences* of injustice. Do not leave this seminar thinking fictional cruelty is equivalent to real cruelty. The paradox exists precisely because we know the difference matters."

  ### Handling Revisionism
  *   **Scenario:** A student says, "I realized halfway through it was fake, so my anger wasn't real."
  *   **Response:** "That is a fascinating correction. But for the first 5 minutes, before you decided it was fake, did the physiological sensation of anger exist? If yes, then the 'fiction' label didn't stop the emotion; it stopped the *endorsement* of the emotion. That is the paradox."

  ### Closing Theoretical Frame
  *   **Stability:** Acknowledge that this activity captures a *single exposure*. Fictional emotions are often stable over repeated viewings (we cry at the same movie scene every time). Real anger usually dissipates once the threat is gone or the injustice is resolved.
  *   **Distinction:** We do not want to say fictional anger is "fake" (it feels real), but we also cannot say it is "appropriate" (there is no one to blame).
  *   **Final Query:** "End by asking what feature of emotional rationality the activity assumes—belief in the reality of the object—and whether that assumption can be rejected without collapsing the distinction between appropriate and inappropriate anger."
