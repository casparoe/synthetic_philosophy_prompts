answer: |-
  There is no single, canonical term of art in political philosophy or transitional justice that captures this entire configuration in one phrase. However, your description is exceptionally precise and maps directly onto a well-established cluster of critiques in **critical Indigenous studies**, **post-colonial political theory**, and **critical legal studies**.

  While you will not find a dictionary definition for this specific dynamic, it is most rigorously theorized under the frameworks of **"Settler Moves to Innocence"** and **"The Colonial Politics of Recognition."** The specific logical maneuver you identified (claiming continuity for credit but discontinuity for liability) is often discussed as the **"Paradox of State Continuity"** or **"Strategic Continuity."**

  Here is a breakdown of how this phenomenon is named, distinguished, and bounded in the literature.

  ### 1. Closest Existing Conceptual Frameworks

  While there is no single noun (like "Gaslighting"), there are three dominant frameworks that describe this configuration:

  **A. "Settler Moves to Innocence" (Eve Tuck & K. Wayne Yang)**
  In their seminal paper *Decolonization is Not a Metaphor* (2012), Tuck and Yang describe exactly this dynamic. They argue that settler states often engage in "moves to innocence"—structures of feeling and policy that attempt to resolve settler guilt without relinquishing land or power.
  *   **Fit:** This captures the "moral growth" framing and the retention of material benefits. The apology becomes a way to "feel better" and be seen as "good" without changing the structural relationship to the land or the harmed group.

  **B. "The Colonial Politics of Recognition" (Glen Coulthard)**
  In *Red Skin, White Masks* (2014), Coulthard critiques the "politics of recognition." He argues that when the state recognizes past wrongs (via apology or truth commissions) without redistributing power or resources, it is a mode of **colonial governance**.
  *   **Fit:** This addresses your point about the state converting culpability into moral capital. The state gains legitimacy ("we are the kind of state that apologizes") which reinforces its authority to govern the very people it harmed, effectively blocking more radical demands for restructuring.

  **C. "Reconciliation without Reparation"**
  This is a common descriptive phrase in transitional justice literature (e.g., work by Alice MacLachlan or Colleen Murphy). However, critics argue this phrase is often too passive. Your description suggests an *active* use of the apology to block redress. A more precise variant used by critical legal scholars is **"Apologetic Impunity"** or **"Reconciliation as Pacification."**

  ### 2. Naming the Logical Mechanism: "Strategic Continuity"

  The specific logical switch you identified—claiming continuity with the past to accept moral praise, but asserting discontinuity to avoid material liability—is the engine of this phenomenon. In legal theory regarding state succession, this is sometimes called the **"Continuity Paradox."**

  *   **For Responsibility:** The state asserts *identity continuity* ("We are the same Canada/Australia/US that did this, so we can speak for it").
  *   **For Liability:** The state asserts *moral/legal discontinuity* ("That was the past; we are a new, democratic entity now, so we cannot be held legally liable for the acts of our predecessors").

  If you are writing on this, **"Strategic Continuity"** or **"The Continuity Paradox of Apology"** would be accurate, descriptive labels for this specific maneuver.

  ### 3. Distinguishing from Related Concepts

  You asked how to distinguish this from hypocrisy, moral licensing, and empty apologies. The distinction lies in **structure, intent, and function.**

  | Concept | Definition | How Your Configuration Differs |
  | :--- | :--- | :--- |
  | **Ordinary Hypocrisy** | A gap between stated values and actual behavior, often due to weakness or self-deception. | **Structural vs. Individual:** Hypocrisy implies a failure to live up to a standard. Your configuration is a *successful* deployment of a standard to achieve a strategic end. The apology *works* exactly as intended (to close the file), so it is not a failure of integrity but a success of strategy. |
  | **Moral Licensing** | A psychological bias where doing a "good deed" permits subsequent "bad behavior." | **Institutional vs. Psychological:** Moral licensing is usually cognitive/individual. Your configuration is **juridical and political**. The state isn't subconsciously licensing itself; it is explicitly arguing in the public sphere that the speech act *constitutes* settlement. It is a claim of *debt satisfaction*, not just a psychological permission slip. |
  | **Empty Apology** | An apology offered with no intention or capacity to follow through with action. | **Active Blockade vs. Passive Omission:** An empty apology is merely inert. Your configuration is **active**. The apology is weaponized as a shield. When restitution is demanded, the state points to the apology as *evidence* that the debt is paid. The apology itself becomes the argument against redress. |

  ### 4. Boundaries of the Phenomenon

  You asked about the proper boundaries: *Must the state actually gain prestige, or is structural resistance sufficient?*

  **The "Moral Capital" Condition is Necessary.**
  For this to be the specific phenomenon you describe (rather than just stubbornness or denial), the state must successfully convert the apology into **legitimacy**.
  *   **Boundary 1: Diplomatic Utility.** If the apology is ignored or ridiculed internationally, and the state gains no "ethical standing," it cannot be used as capital. The phenomenon requires that the apology *works* to enhance the state's reputation as "reformed" or "enlightened."
  *   **Boundary 2: The Closure Claim.** The state must explicitly or implicitly frame the apology as a **terminal speech act**. If the state says, "This apology is the first step in a long process of reparations," it is not this phenomenon. It becomes this phenomenon only when the apology is framed as the *fulfillment* of the moral obligation, rendering further material claims excessive or "dwelling on the past."
  *   **Boundary 3: Retention of Benefit.** The state must retain the **structural advantages** accrued from the original harm (e.g., land title, resource rights, demographic dominance). If the apology is paired with significant restitution that alters these material conditions, the dynamic shifts from "Strategic Continuity" to genuine (if imperfect) transitional justice.

  ### 5. Recommended Terminology

  If you need a label for your work, I recommend one of the following, depending on your disciplinary focus:

  1.  **"The Politics of Apologetic Closure"** (Political Philosophy focus): Highlights the temporal shutting-down of the issue.
  2.  **"Strategic Continuity"** (Legal Theory focus): Highlights the paradoxical claim of identity.
  3.  **"Settler Moves to Innocence"** (Critical Indigenous Studies focus): The most robust existing framework, though specific to settler-colonial contexts.
  4.  **"Accumulation by Apology"** (Political Economy focus): A play on David Harvey's "Accumulation by Dispossession," highlighting how moral capital is extracted from the harm itself.

  **Summary:**
  You have identified a sophisticated form of **legitimation strategy**. It is not merely hypocrisy; it is a **performative contradiction weaponized for governance**. The state uses the *form* of accountability (the apology) to secure *immunity* from the *substance* of accountability (restitution). The most precise way to describe the logical core is **"Strategic Continuity,"** and the most precise way to describe the political function is **"Reconciliation as Pacification."**
