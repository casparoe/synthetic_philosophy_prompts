answer: |-
  You have identified the central tension in appellate review: the gap between the *rhetoric* of epistemological categories (law vs. fact) and the *reality* of institutional allocation (who decides). Your friend's invocation of Quine is apt, but it may be diagnosing a symptom rather than the disease. The legal system uses epistemological language to describe what is ultimately a jurisdictional and administrative arrangement.

  Here is an analysis of what your practice strictly requires, what it merely finds comfortable, and where it is philosophically underdetermined.

  ### 1. The Load-Bearing Distinction: Epistemology or Authority?

  You ask what a legal system must believe about meaning or knowledge for the *de novo*/deferential split to be more than a division of labor.

  **Strict Requirement:**
  The practice strictly requires **nothing** about the analytic-synthetic distinction or the nature of truth. It requires only a belief in **institutional hierarchy** and **normative uniformity**.
  *   **Hierarchy:** The appellate court must have the authority to correct the lower court.
  *   **Uniformity:** The "law" must mean the same thing in Court A as in Court B.
  *   **Finality:** Someone must stop the litigation.

  The split is not primarily about *what kind of proposition* is being evaluated (analytic vs. synthetic); it is about *who holds the authority* to fix the meaning of the sovereign's command. When you review a contract interpretation *de novo*, you are not asserting that contract meaning is a priori truth; you are asserting that the *definition of legal obligations* is an appellate prerogative to ensure consistency across the jurisdiction. When you defer on a witness's credibility, you are not asserting that sensory data is incorrigible; you are asserting that the trial judge had better *epistemic access* (saw the witness live) and that reopening that inquiry is too costly.

  **Comfortable Fit:**
  The analytic-synthetic distinction (and the a priori/a posteriori distinction) sits **comfortably** with this arrangement because it provides a ready-made vocabulary to justify it.
  *   If "law" is analytic (true by definition of the statute), it makes sense that appellate judges, who deal in texts and definitions, decide it *de novo*.
  *   If "fact" is synthetic (true by observation of the world), it makes sense that the fact-finder, who observed the world, gets deference.
  *   This vocabulary makes the allocation of authority feel *inevitable* rather than *contingent*. It masks the policy choice as a metaphysical necessity.

  **Philosophical Underdetermination:**
  The current categories are radically underdetermined. Three conflicting theories of meaning license exactly the arrangement you have:
  1.  **Legal Positivism:** Law is a command. Appellate courts ensure the command is interpreted consistently. Facts are empirical states of affairs. The split holds.
  2.  **Legal Realism:** Law is a prediction of what courts will do. "Questions of law" are just questions where we want uniform predictions. "Questions of fact" are where we accept variance. The split holds, but the justification is purely pragmatic.
  3.  **Dworkinian Integrity:** Law is an interpretive concept seeking moral coherence. Appellate courts ensure coherence (law); trial courts establish the narrative record (fact). The split holds.

  None of these require the analytic-synthetic distinction. They only require a functional distinction between *setting the rule* and *applying the rule to a specific record*.

  ### 2. The Quinean Objection: Would Practice Change?

  Suppose Quine is right: there is no sharp line between truths of meaning and truths of fact. Any statement can be held true if we make drastic enough adjustments elsewhere in the web of belief.

  **Strict Requirement:**
  If Quine is right, **nothing in your practice needs to change.**
  The standard of review is a procedural rule, not an ontological claim. When you defer on whether an officer "saw" a suspect, you are not certifying that statement as a synthetic truth immune to revision. You are certifying that the *trial court's assessment of that evidence* is the designated stopping point for litigation.
  When you decide *de novo* whether those observations constituted "reasonable suspicion," you are not engaging in pure analytic deduction. You are exercising your institutional role to standardize the *normative threshold* for police conduct.

  **Comfortable Fit:**
  Quine's critique fits **comfortably** with your observation that the line is applied messily. The existence of "mixed questions of law and fact" is the legal system's implicit admission of Quine's point.
  *   In a "mixed question" (e.g., effective assistance of counsel, or reasonable suspicion), the "fact" (what the officer did) and the "law" (what counts as reasonable) are entangled.
  *   The legal system handles this not by finding a metaphysical seam, but by asking a policy question: *Do we want trial courts or appellate courts to control this standard?*
  *   If we want uniformity on Fourth Amendment stops, we label it "law" (or a mixed question reviewed *de novo*). If we want to insulate jury verdicts, we label it "fact" (or sufficiency of the evidence).

  **The Shift in Justification:**
  If you accept Quine, you must admit you have been describing an **allocation of decision-making authority** in borrowed epistemological language. The allocation survives untouched because it serves functions (uniformity, finality, epistemic access) that do not depend on the analytic-synthetic distinction. You would simply stop pretending the label "question of law" describes the *nature* of the inquiry and acknowledge it describes the *locus of control*.

  ### 3. The Pragmatic Competence Standard

  Your colleagues propose scrapping the distinction for a single question: *Which decision-maker is more likely to get this particular question right, subtracting the cost of deciding it twice?*

  **Strict Requirement:**
  This standard presupposes **no semantic theory**, but it does presuppose a contentious **epistemic utilitarianism**.
  *   It requires that "correctness" is measurable independent of the standard of review. (This is tricky: if the appellate court defines correctness *de novo*, how do we measure the trial court's likelihood of reaching it?)
  *   It requires that institutional competencies are stable and comparable (e.g., "Appellate courts are better at textual consistency," "Trial courts are better at credibility").
  *   It requires a metric for "cost" (judicial resources, litigant expense, error costs).

  **Comfortable Fit:**
  This approach sits **comfortably** with a Quinean worldview because it abandons the search for categorical essences. It treats "law" and "fact" as heuristic clusters rather than natural kinds.
  *   It explains why you defer on credibility (trial court has better data) but not on contract interpretation (appellate court has better systemic view).
  *   It explains why the line moves: as the "cost" of error changes (e.g., in criminal vs. civil cases), the allocation of authority shifts.

  **Hidden Contestation:**
  While this standard avoids semantic presuppositions, it is not philosophically neutral. It quietly presupposes:
  1.  **Convergent Realism:** That there is a "right answer" to be got, which both courts are aiming for. (Some critical legal studies scholars would deny this.)
  2.  **Commensurability:** That the value of uniformity (appellate strength) can be weighed against the value of epistemic proximity (trial strength) on a single scale.
  3.  **Institutional Stability:** That the strengths of the two tiers are fixed. (If trial courts became more specialized, the calculus would change.)

  ### Summary: Requirements vs. Comfort

  | Feature of Practice | Strictly Requires | Comfortably Sits With | Philosophically Underdetermined |
  | :--- | :--- | :--- | :--- |
  | **De Novo / Deference Split** | Institutional Hierarchy & Normative Uniformity. | Analytic-Synthetic Distinction; A Priori/A Posteriori. | Legal Positivism, Realism, Dworkinian Integrity, Natural Law. |
  | **"Mixed Questions"** | Policy choice on who controls the standard. | Quinean Holism (blurring of meaning/fact). | Any theory that admits of gradation in institutional competence. |
  | **Pragmatic Competence Test** | Epistemic Utilitarianism (error costs vs. decision costs). | Pragmatism; Anti-foundationalism. | Theories denying "correctness" is measurable or commensurable. |

  ### Conclusion for the Clerk

  Your confusion stems from the court speaking in the language of **ontology** (what *is* a question of law?) while acting in the language of **administration** (who *decides*?).

  1.  **On Question 1:** The analytic-synthetic distinction is incidental vocabulary. It makes the system feel rational, but the system runs on institutional authority, not metaphysical truth conditions.
  2.  **On Question 2:** If Quine is right, your practice does not change. You simply acknowledge that "question of law" is a label for "issues we want appellate courts to control," not "issues that are true by definition."
  3.  **On Question 3:** The pragmatic standard avoids semantic presuppositions but imports utilitarian ones. It is more honest, but it trades the puzzle of "meaning" for the puzzle of "measurement."

  The arrangement is philosophically underdetermined because it is a **functional technology**, not a theory of truth. It works not because it correctly carves nature at its joints, but because it effectively manages the flow of authority between two tiers of the judiciary. You can continue to apply the standards without resolving the philosophical puzzles, provided you recognize that the labels are jurisdictional markers, not epistemological certifications.
