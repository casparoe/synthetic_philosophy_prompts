answer: |-
  ### Part 1: Conceptual Brainstorming

  **Synchronous Subjection:**
  *   *Definition:* Those currently under the institution's authority and living within its immediate disciplinary sphere.
  *   *Application:* Current students and residential faculty. They wake up, eat, study, and sleep under the rules being voted on.
  *   *Tension:* Exchange students are synchronously subjected but asynchronously connected (they leave soon). Does their short horizon invalidate their vote? No, subjection is immediate, regardless of duration.

  **Asynchronous Affectedness:**
  *   *Definition:* Those impacted by the decision over time or distance, without being under immediate authority.
  *   *Application:* Parents (financial/outcome impact), Alumni (reputation/network impact).
  *   *Tension:* Parents pay the bills. Does financial liability grant political franchise? In a corporation, yes (shares). In a polity, usually no (taxes don't grant voting rights to non-citizens). The school is a hybrid.

  **Representational Dormancy:**
  *   *Definition:* The claim that alumni stakes are "sleeping" until activated by external events, and waking them for internal governance disrupts the current community's agency.
  *   *Application:* Alumni voting on current residential policy.
  *   *Tension:* The co-member argues this fractures "diachronic unity." Counter-argument: Including alumni *builds* diachronic unity by treating the school as a lifelong entity. However, if the vote is on *residential* character, alumni are no longer residents. Their stake is nostalgic or reputational, not experiential.

  **Verdict on Foundation:**
  The "Boundary Problem" is not a category mistake; a boarding school is a total institution where governance is inherently political. However, the argument that parents are "co-subjects to disciplinary authority" is conceptually weak. They are parties to a contract, not subjects of the disciplinary code. The memo must correct this distinction to avoid confusion.

  ***

  ### Part 2: Formal Memorandum

  **TO:** Interim Governance Committee, Meridian Residential School
  **FROM:** Senior Advisor, Institutional Ethics
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Franchise Rule for Distributed Learning Referendum

  **1. Recommendation**
  I recommend the Committee adopt a **Residential Franchise Rule** for the upcoming binding referendum. Voting rights shall be extended exclusively to:
  1.  Currently enrolled students residing on campus (including exchange students).
  2.  Full-time faculty members residing on campus or primarily delivering instruction on-site.

  **Implementation Timeline:**
  *   **November 1:** Committee ratifies the Residential Franchise Rule.
  *   **November 3:** Voter roll certified based on current housing assignments and employment contracts.
  *   **November 10:** Referendum circulated.
  *   **November 17:** Voting closes; results certified binding.

  Parents, alumni, and non-residential staff shall be excluded from the binding vote but invited to submit testimony to a standing Advisory Panel, the findings of which will be published alongside the referendum results.

  **2. Reasoning: The Primacy of Residential Subjection**
  The proposal before us—the Distributed Learning Compact—fundamentally alters the *residential* character of Meridian. It converts a portion of the educational experience from a communal, co-present activity to a remote, individual one. Therefore, the boundary of the *demos* must align with the boundary of the *residence*.

  Democratic legitimacy in this context derives from **synchronous subjection**. The students and faculty who vote are those who must wake up, eat, study, and sleep within the consequences of this decision. They bear the immediate burden of the altered social contract. While parents and alumni are significantly *affected*, they are not *subjected* to the daily disciplinary and social reality of the dormitory. To grant them binding votes would be to allow those who can exit the campus at will to govern those who must live within it.

  **3. Engagement with the Dormancy Objection**
  I must address the concern raised by my co-member regarding the "Dormancy Objection." She argues that granting voting rights to alumni (or by extension, other non-present stakeholders) fractures the diachronic unity of the student body, as their stake is dormant until activated by reputation or networking outcomes. She suggests their interests be channeled through non-binding advisory proxies.

  I find this objection **substantially correct, though for a sharper reason.** It is not merely that the alumni stake is "dormant"; it is that their relationship to the school has shifted from *membership* to *affiliation*. A binding vote on residential policy requires present-tense judgment. Alumni cannot accurately weigh the cost of losing communal dining or dormitory life because they no longer inhabit that space. To give them a vote does not strengthen diachronic unity; it allows the past to veto the present's lived experience. The Advisory Panel mechanism satisfies the need for their perspective without compromising the agency of the current residents.

  **4. Engagement with the Parental Counter-Argument**
  Conversely, I have taken seriously the argument that parents are not mere outsiders but "co-subjects" to the school's authority, given their financial liability and the impact of disciplinary outcomes on their households. Proponents argue that excluding them treats affectedness and subjection as separable when they overlap in institutional life.

  While I acknowledge the gravity of parental investment, I must reject the claim that they are **co-subjects to disciplinary authority.** Parents are parties to a *contract*; students are subjects of a *polity*. The school disciplines the child, not the parent. The parent's recourse is contractual (withdrawal of tuition), whereas the student's recourse is political (voice/vote). Conflating financial liability with political franchise risks transforming the school from a community of learners into a service provider governed by its clients. Parents must have a voice (hence the Advisory Panel), but granting them a binding vote on the internal social compact of the dormitory conflates purchase with citizenship.

  **5. Conclusion**
  The Residential Franchise Rule preserves the integrity of the referendum. It ensures that those who live the consequence decide the consequence. It respects the dormancy of alumni stakes without silencing them, and it honors parental investment without confusing contract with governance.

  ***

  ### Part 3: Advisor's Critical Pushback

  You invited plain pushback regarding the conceptual foundation of this exercise. Here is my assessment:

  **1. Is the "Boundary Problem" a Category Mistake?**
  No. Framing this through the boundary problem is **not** a category mistake. A boarding school is a "total institution" where life, learning, and governance overlap. When you schedule a *binding referendum*, you are inherently engaging in political theory. You are asking, "Who constitutes the people?" Ignoring this leads to arbitrary exclusions. However, you must be careful not to import *national* democratic theory wholesale. This is a *community* polity, not a state. The boundary is defined by shared life (residence), not just affected interest.

  **2. Is the "Dormancy Objection" Incoherent?**
  The objection as presented by your co-member is **coherent but incomplete.** She argues that alumni voting fractures diachronic unity. I argue the opposite: excluding them affirms that the school is a living, present-tense community. However, her logic holds if you view the school as a corporation where shareholders (alumni) have perpetual rights. If Meridian is a *community*, her objection is sound. If Meridian is a *brand*, her objection fails. You must decide which ontology the school holds. The memo above assumes the *community* model.

  **3. The "Parent Co-Subject" Error**
  This is the most critical conceptual vulnerability in your committee's debate. The argument that parents are "co-subjects to disciplinary authority" is **conceptually flawed.**
  *   **Subjection** implies the authority can punish *you*. The school cannot punish the parent (fines, detention, expulsion). It can only punish the child or terminate the contract.
  *   **Affectedness** is not **Franchise.** If it were, every vendor affected by school policy would demand a vote.
  *   **Risk:** If you accept the premise that parents are "co-subjects," you undermine the student's agency. You treat the student as a minor asset of the parent rather than a member of the community.

  **Final Verdict:**
  Do not build your recommendation on the idea that parents are "subjects." Build it on the idea that they are **stakeholders with exit rights, not voice rights.** If your committee cannot distinguish between *contractual liability* and *political subjection*, the referendum will rest on a confused foundation. The Memo above corrects this; ensure your debate does as well.
