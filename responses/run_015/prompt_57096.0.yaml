answer: |-
  The clinic smelled of lemon antiseptic and recycled air, a scent Elias had associated with clarity for twenty years. Outside the frosted glass of his office, the island was waking up. He could see the solar arrays tilting toward the morning sun, the communal gardens where the early shift was already harvesting kale. It was a beautiful place. It was a fair place. Every year the auction cleared, every year the tokens were distributed, every year the envy audit ran its calculations and confirmed that no resident would trade their bundle for another's. Equality of resources was the foundation stone, carved into the lintel of the administration building in a font so clean it looked like mathematics.

  Elias sat at his desk and opened the file. Case 4092. The name was Lissa Vane. She was thirty-four, a weaver by trade, and she was requesting a resource top-up. Her claim was thermal sensitivity. Her bundle included the standard heating allocation, sufficient for ninety percent of the population during the winter cycle. Lissa argued that her metabolism burned through heat at a rate that left her physically incapacitated by mid-season. She couldn't work the looms if her hands shook. If she couldn't work, she earned fewer bonus tokens next year. If she earned fewer tokens, she bid less on heating. It was a spiral, and she wanted the Compensation Fund to break it.

  On paper, it was a conversion case. Her biological needs converted her resources into functionings at a lower rate than her neighbors. The forms had a box for this. Box A: Structural Disadvantage. Check it, and she gets extra tokens. The system absorbs the cost. The envy audit might twitch, but usually, medical exemptions passed without triggering a full re-auction.

  But there was Box B: Preference Alignment. This was the clinic's domain. If the disadvantage was rooted in an inability to be content with the standard bundle, the solution was not more resources, but revised wants. The procedure was safe, outpatient, and permanent. Lissa could walk out wanting less heat. She could walk out feeling cozy in a room that would have made her shiver yesterday. It cost roughly the same as a good pair of boots, subsidized by the very fund she was asking to draw from.

  Elias rubbed his thumb over the corner of the folder. He knew the texture of the paper better than the face of the woman waiting in room three. He had been doing this for two decades, ever since his own intake, though the memory of that day was like a photograph left in the sun. He remembered the waiting room. He remembered the form. He remembered walking out. He did not remember what he had wanted before he walked in. He only knew that he no longer wanted it, and that the absence of the want did not pain him. That was the promise. That was the mercy.

  He stood up and walked to the window. The sky was a hard, clear blue. The commune was insufferably smug about its weather, too. They had chosen this latitude for the solar gain, and they spoke of it as a moral victory. Elias turned back to the desk and buzzed for Mara.

  She arrived within minutes, carrying a tablet and a mug of tea. Mara was senior staff, a decade older than Elias, and she believed in the clinic with the fervor of a priest who has seen miracles. She wasn't cruel. She was tired of seeing people suffer over things that could be fixed.

  "Vane?" Mara asked, leaning against the doorframe.

  "Vane. Thermal sensitivity. She wants compensation."

  "Medical verification?"

  "Borderline. Her core temperature is normal. Her comfort threshold is the outlier. She claims pain if the ambient drops below twenty-two degrees. The standard is nineteen."

  Mara took a sip of tea. "Nineteen is enough to live. To work. To sleep."

  "She says she can't weave if she's shivering. She says her output drops forty percent."

  "Then she should bid more on heat during the auction. She chose other things. Maybe she wanted better dyes. Maybe she wanted private dining credits. We all make trade-offs, Elias. That's the point of the auction. If we compensate everyone who made a bad bid because they're unhappy with the result, the envy audit fails. Someone else will look at her bundle—standard heat plus extra tokens—and they will envy it. Then we void the year. Then we start over. Everyone loses."

  "She says it wasn't a bid. She says it's her body."

  Mara set the mug down. Her expression was soft, the kind she used on the applicants who were crying. "Her body is healthy. Her expectations are the mismatch. We have the technology to align them. Why is that not the kindness here? You know what the alternative is. We deny the tokens. She spends the winter in pain. She resents the neighbors who don't feel the cold. Resentment is the poison, Elias. You know that better than anyone. The clinic scrubs the poison."

  Elias looked at the file again. He thought about his own missing want. Sometimes, in the shower, or when he was falling asleep, he felt a phantom limb sensation in his mind. A shape of a desire that used to be there. He couldn't name it. He couldn't miss it, because he didn't know what it was. But he knew it had been heavy. He knew carrying it had been exhausting. The clinic had lifted the weight. He was a good assessor because he didn't judge. How could he judge a want when he couldn't remember having one of his own?

  "If I put her in Box B," Elias said, "she loses the winter. She has to schedule the procedure. Recovery time."

  "She gains the rest of her life," Mara countered. "She gains stability. Look at the stats. Ninety-eight percent satisfaction rate post-revision. No recidivism. We aren't lobotomizing them, Elias. We're tuning the instrument. If the instrument is built for a room that doesn't exist, you don't build the room. You tune the instrument."

  "She says she wants to feel the cold if it's real. She says numbness isn't comfort."

  "She says that now. That's the pathology talking. The attachment to the suffering." Mara pushed off the doorframe. "I have to go to intake. What's your call?"

  "I haven't interviewed her yet."

  "You've read the file. You know the metrics. Don't torture yourself. Just sign it."

  Mara left. The door clicked shut. Elias sat down and picked up his pen. It was a simple action. Box A or Box B. Compensation or Revision. The system relied on this binary. It assumed that needs and wants were distinct substances, like oil and water. But Elias had seen the emulsion. He had seen people who needed things because they wanted them, and wanted things because they needed them to be who they were.

  He buzzed the waiting room. Lissa Vane came in. She was wrapped in three layers of wool, still shivering slightly despite the clinic's warmth. She looked tired, not sick. The kind of tired that comes from fighting a constant, low-grade war against your environment.

  "Mr. Elias," she said. She didn't sit.

  "Please, take a chair, Lissa."

  "I'm cold standing up. I'm cold sitting down. I just want to know if I get the tokens."

  "The committee needs to verify the necessity."

  "It's necessary if I want to work."

  "There is no guarantee of work output in the charter. There is a guarantee of resource equality."

  "I don't want equality," she said. Her voice was quiet, but it had an edge. "I want to be able to use my hands. Is that too much? Is that a luxury now? To not be in pain?"

  "Pain is subjective. We have analgesics."

  "I don't want drugs. I want heat. I want to live in the world without editing myself to fit it."

  Elias looked at her hands. They were resting on the back of the chair, fingers twitching slightly. Capable hands. Hands that made things. If he sent her to the procedure, those hands would stop shaking. They would weave just as well, probably better, because she wouldn't be fighting the chill. She would be happy. She would be one of the ninety-eight percent.

  "And if I deny the tokens?" Elias asked.

  "Then I come back next year. And the year after. And I spend all my tokens on heat and eat stale bread. Or I leave."

  "You can't leave. The boats are communal property."

  "Then I shrink. I become smaller. I take the procedure. I become the size of the bundle." She looked at him, really looked at him, for the first time. "Did you?"

  Elias froze. The question hung in the sterile air. It wasn't forbidden to ask, but it wasn't asked. The staff were private. Their histories were their own.

  "I work here," Elias said.

  "That's not an answer."

  "It's the only one I have."

  Lissa nodded slowly. She seemed to understand something then, something sad. "You don't remember, do you? What you wanted before."

  "I remember that I was unhappy."

  "Unhappy because you wanted something you couldn't have? Or unhappy because you wanted it at all?"

  "I don't know."

  "That's the trick, isn't it?" She sat down finally, pulling her wool tight. "If I go in there, I won't know either. I'll just be warm. I'll wonder why I made such a fuss. I'll thank you."

  "We can offer the compensation," Elias said. "But it risks the audit. If your bundle is flagged as superior, the whole year voids. Four thousand people re-auction. Because of your heating."

  "So it's my fault? I'm the glitch?"

  "You're the variance. The system handles averages. You're the tail end."

  "I'm a person."

  "You're a file." Elias picked up the pen. He hovered it over the form. He could feel the weight of the decision. It wasn't about justice. Justice was a word for the brochures. This was about logistics. It was about whether the island could absorb the cost of her difference, or whether she had to absorb the cost of the island's design.

  If he checked Box A, he admitted the system wasn't perfect. He admitted that equal resources didn't mean equal lives. That was a dangerous thought. It was the kind of thought that started conversations in the mess hall that ended with people looking at the administration building with narrow eyes. It threatened the smugness. And the smugness was the glue.

  If he checked Box B, he preserved the system. He preserved the peace. He helped Lissa. He saved her from the winter. He saved her from herself.

  "I can't give you the tokens," Elias said. His voice sounded flat to his own ears.

  Lissa didn't cry. She just nodded again. She looked at the window, at the solar arrays tilting toward the sun. "Okay. Then book me in. Tuesday?"

  "Tuesday," Elias said. He wrote it down. He checked Box B. Preference Alignment. Taste Case. The ink dried quickly.

  "Will it hurt?" she asked.

  "The injection? No. The adjustment... you won't feel it happen. You'll just notice, a few days later, that nineteen degrees feels fine. You'll wonder why you were worried."

  "Will I still weave?"

  "Better. Without the shaking."

  "Will I care about the weave?"

  Elias paused. The pen hovered over the signature line. "You'll care about what you care about."

  "That's not an answer either."

  "It's the only one I have."

  Lissa stood up. She looked smaller than when she came in, though she was wearing the same clothes. "Thank you, Elias. For being honest. About not knowing."

  She left the office. Elias watched her walk down the corridor, her shoulders hunched against the air conditioning. He put the pen down. He closed the file. He placed it in the out-tray.

  Mara popped her head in again ten minutes later. "Done?"

  "Done. Tuesday intake."

  "Good. She'll thank you in a month. They always do."

  "I know."

  Mara smiled, a genuine smile. She cared about them. She wanted them to be free of the friction that wore them down. " Lunch?"

  "In a bit."

  Mara vanished. Elias sat alone. He looked at his hands. They were steady. He had been steady for twenty years. He tried to reach back, past the fog, past the chemical smoothing of his own history. He tried to find the shape of the want that had brought him to this desk two decades ago. Was it a person? Was it a place? Was it a need for something the island couldn't provide, like Lissa's heat?

  He couldn't find it. He only found the absence, smooth and clean as a polished stone. He felt a pang of something then. Not pain. Not want. Just a recognition of the cost. The island would continue. The auction would happen in three months. The envy audit would pass. Lissa would be warm. Elias would be steady. The system held.

  He stood up and walked to the window. The sun was high now. The gardens were green. Everything was functioning as designed. He turned off the light in his office and went to find Mara. The door clicked shut behind him, locking the file inside, waiting for the Tuesday intake, waiting for the want to be excised, waiting for the world to fit the person because the person could no longer fit the world.

  I chose third person limited to maintain a slight clinical distance that mirrors the protagonist's own dissociation from his past, while allowing access to his internal doubt. I focused on the tactile details of the clinic and the bureaucracy to ground the political philosophy in the physical reality of the forms and the heating, avoiding abstract debate in favor of procedural tension. The ending remains static to honor the constraint that the system does not collapse, emphasizing the quiet tragedy of individual accommodation within a rigid structure.
