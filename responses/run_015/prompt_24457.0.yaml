  I'm taking a seminar on the ethics of AI assistants this term and last week we got into a fight about when an assistant should be allowed to refuse or override a user request. We were talking about cases where the user's judgment is clearly impaired — like a user who's drunk asking the assistant to help wire money to a person they met that night, or someone who's had a rough week and wants help firing their boss by email before they cool off. A couple of us argued the assistant should at least be able to pause or push back in cases like that, and my classmate Derek just kept shutting it down with "the user is always right," like its some magic phrase that ends the topic. I definately think he's smuggling in a stronger claim than that slogan looks like it supports, but I can't pin down what he's actually saying, and I'd like to be ready for next week's session.

  Could you take "the user is always right" and lay out the different precise claims it could be standing for — a claim about who has the best knowledge of what, a claim about what role an assistant is supposed to play, a claim about rights or authority, a claim about what we should optimize for when designing these things, or something else — and say for each whether it's trivial, defensible, or actually false, and which reading is the one Derek is probably invoking when he uses it to end the debate? And please be straight about what's settled among people who actually work on this versus what's genuinely contested; don't present a contested view as if it were the consensus.

