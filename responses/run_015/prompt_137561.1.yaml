  7.  **Final Polish:**
      *   Tone: Respectful, analytical, philosophical but grounded.
      *   Structure: Audit -> Ranking -> The Fix -> The "Badness To" answer.
      *   Make sure to explicitly answer "What gives?" and "What does it cost?"

