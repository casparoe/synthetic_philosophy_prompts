answer: |-
  ### Thinking Process: Skeleton Selection

  I considered four structural skeletons for this session. 
  1.  **Trading Round:** Students trade binary assets based on private signals; volume indicates CPA violation (No-Trade Theorem). 
  2.  **Bookmaking Round:** A designated Bookie posts odds; students bet; the Bookie scores points on guaranteed arbitrage portfolios (Dutch Book). 
  3.  **Iterated Announcement:** Students publicly announce posteriors and update until convergence (Aumann Agreement). 
  4.  **Veil of Ignorance:** Students choose betting rules ex-ante before learning their informational role.

  I selected the **Bookmaking Round**. The Trading Round is too noisy (liquidity motives confuse the signal), the Iterated Announcement is too slow for 80 minutes, and the Veil is a setup condition rather than a game loop. The Bookmaking Round makes the Common Prior Assumption (CPA) a *defensive shield*: if students share the House Prior and conditionalize correctly, the Bookie cannot construct a Dutch Book. If they violate the CPA (by smuggling in private priors), the Bookie *must* find arbitrage to maximize their score. This turns the CPA from a theoretical stipulation into a practical necessity for the bettors' survival.

  ***

  # Lesson Plan: The Arbitrage Exchange

  **Objective:** To demonstrate that the Common Prior Assumption (CPA) is a constraint on rational updating (counterfactual signal swap) rather than an empirical claim about initial opinion, and that CPA violation is the necessary condition for rational betting.
  **Time:** 80 Minutes.
  **Participants:** 16 Students (1 Bookie, 15 Bettors).
  **Materials:** Index cards (3 per student), whiteboard, projector, timer, one coffee voucher.

  ## I. Rules & Mechanics

  ### 1. The State & Signals
  *   **State:** An urn contains 100 balls, either **Red-Dominant** (70 Red, 30 Blue) or **Blue-Dominant** (30 Red, 70 Blue). State is determined by a coin flip at the start (hidden).
  *   **Signals:** Each Bettor draws one ball from the urn (with replacement), observes the color, and returns it. This is their private evidence.

  ### 2. The Four Devices (Non-Negotiables)
  *   **Blind Prior Escrow (Minute 5):** Before knowing roles or seeing the urn, every student writes a probability $P(\text{Red-Dominant})$ on an index card and seals it in an envelope. One envelope is drawn at random to become the **House Prior** ($H$). The rest are kept for debrief.
  *   **Belief-Plan / Signal-Swap (Minute 15):** After drawing their signal, Bettors receive a worksheet. They must record their posterior for the signal they *got*, AND the posterior they *would have held* had they drawn the opposite color. This table must be mathematically consistent with the House Prior $H$.
  *   **Bookmaker Role (Minute 20):** One student is appointed Bookie. They do not see signals. They post buying/selling prices for a ticket paying \$100 if Red-Dominant.
  *   **Sectarian Round (Minute 50):** In Round 2, half the class is privately told the urn came from "Factory Alpha" (high base rate for Red), half from "Factory Beta" (high base rate for Blue). This legitimately alters their priors.

  ### 3. Payoff Scheme (Leaderboard)
  *   **Bookie:** Earns **10 Points** for every "Arbitrage Portfolio" identified. An Arbitrage Portfolio is a set of bets accepted from students that guarantees the Bookie a profit regardless of the State. (Facilitator checks this mathematically after the round).
  *   **Bettors:** Start with 100 Points.
      *   **Accuracy Bonus:** +20 Points if their final probability is closer to the truth than the House Prior.
      *   **Dutch-Book Penalty:** -20 Points if their bets were part of an Arbitrage Portfolio exploited by the Bookie.
      *   **Consistency Bonus:** +10 Points if their Belief-Plan table is perfectly Bayesian relative to the House Prior.
  *   **Prize:** Top 3 on leaderboard share the coffee voucher.

  ## II. Minute-by-Minute Timeline

  **00:00 – 00:10 | Setup & Escrow**
  *   Explain the Urn setup. Flip coin for State (keep hidden).
  *   **Device 1:** Students write priors on cards, seal them. Draw one publicly. Write this **House Prior** on the whiteboard (e.g., 0.55).
  *   Assign roles: 1 Bookie (randomly selected), 15 Bettors. Bookie leaves room for 2 minutes (or wears blindfold) while Bettors draw signals.

  **00:10 – 00:20 | Signal & Belief-Plan**
  *   Bettors draw signals (Red or Blue).
  *   **Device 2:** Distribute Belief-Plan worksheets. Students must calculate:
      1.  $P(\text{Red} | \text{Signal=Red})$ using House Prior.
      2.  $P(\text{Red} | \text{Signal=Blue})$ using House Prior.
  *   *Constraint:* They must use the House Prior, not their Escrowed Prior. Collect worksheets immediately.

  **00:20 – 00:40 | Bookmaking Round 1 (The CPA Test)**
  *   Bookie returns. Project a blank odds board.
  *   Bookie has 5 minutes to post odds (e.g., "Buy at 0.60, Sell at 0.65").
  *   Bettors have 5 minutes to submit bet slips (Buy/Sell/Pass) based on their private signal and the House Prior.
  *   **Crucial Rule:** Bettors are told: "If you all conditionalize correctly from the House Prior, the Bookie cannot guarantee a profit. If you use your own priors, you are vulnerable."
  *   Facilitator collects slips. Calculates if a Dutch Book exists.

  **00:40 – 00:50 | The Sectarian Shift**
  *   **Device 4:** Hand out sealed notes to half the room (Factory Alpha) and half (Factory Beta).
  *   Alpha: "Your urn was drawn from a factory where 90% of urns are Red-Dominant." (New Prior = 0.90).
  *   Beta: "Your urn was drawn from a factory where 90% of urns are Blue-Dominant." (New Prior = 0.10).
  *   Students update their Belief-Plan tables based on this new prior + their original signal.

  **00:50 – 01:10 | Bookmaking Round 2 (Deep Disagreement)**
  *   Bookie posts new odds.
  *   Bettors bet again.
  *   *Expectation:* Betting volume will surge. The Bookie may struggle to find arbitrage because the disagreement is now "rational" (traceable to different information about the factory), but the *spread* between Alpha and Beta bettors will be wide.
  *   Facilitator records the volume and the spread.

  **01:10 – 01:20 | Settlement & Debrief**
  *   Reveal State. Calculate scores. Award voucher.
  *   **Debrief (see below).**

  ## III. The Debrief: Mapping Mechanics to Epistemology

  **1. The Escrow vs. House Prior (The "Stipulation" Objection)**
  *   *Action:* Open the unchosen Escrow envelopes. Show the variance in initial opinions.
  *   *Point:* "I did not give you a common prior. You generated a distribution. We imposed one by chance to simulate the *counterfactual*: What if we *had* started the same? The game tests whether you can *maintain* that commonality through updating."

  **2. The Belief-Plan Table (The Counterfactual Definition)**
  *   *Action:* Project a student's worksheet. Highlight the row for the signal they *did not* see.
  *   *Point:* "The CPA is not that you actually have my opinion. It is that *had you seen my signal*, you would have my opinion. This empty row you filled out? That is the Common Prior Assumption operationalized. If that number differs from what your neighbor calculated for the same signal, you violated the CPA."

  **3. Round 1 vs. Round 2 (The No-Trade Intuition)**
  *   *Action:* Compare betting volume. Round 1 should be low (if CPA held); Round 2 high.
  *   *Point:* "In Round 1, if you traded aggressively, you conceded that your prior was not the House Prior. You allowed the Bookie to Dutch Book you. In Round 2, you disagreed, but you were not 'Dutch Bookable' in the same way because your prior difference was *common knowledge* and justified by the Factory story. This is the difference between irrational disagreement (Round 1 errors) and deep rational disagreement (Round 2 Sectarianism)."

  **4. The Bookie's Score (The Cost of Violation)**
  *   *Action:* Reveal the Bookie's arbitrage portfolio from Round 1.
  *   *Point:* "The Bookie didn't win because they were smarter. They won because your posteriors were inconsistent with a single distribution. The CPA is the condition under which betting is *impossible* for rational agents. When betting happens, the CPA has failed."

  ## IV. Predictable Failures & Mitigation

  1.  **The "Urn Puzzle" Distraction:** Students will focus on calculating the "true" odds of the urn rather than the game structure.
      *   *Mitigation:* Interrupt at Minute 30. Remind them: "The math is trivial. The risk is the Bookie. Focus on consistency, not truth."
  2.  **Anchoring:** One confident student announces their probability, swaying the room.
      *   *Mitigation:* Enforce silent betting slips. No talking during betting windows.
  3.  **Timid Bookie:** The Bookie fears posting odds and loses points.
      *   *Mitigation:* Pre-coach the Bookie during their 2-minute exile. Give them a cheat sheet: "If you see Buy prices > Sell prices, you have arbitrage."
  4.  **Veil Collapse:** Students guess their role before the Escrow is sealed.
      *   *Mitigation:* Collect Escrow envelopes *before* announcing there will be a Bookie role.
  5.  **Confusion on Counterfactuals:** Students think "If I had your signal" means "If I were you."
      *   *Mitigation:* In debrief, explicitly distinguish *identity swap* from *information swap*. "You keep your brain; you just get my card."

  ## V. Addressing the Economics Colleague

  **Objection:** "Any game with a shared prior built into the setup is cheating, since the instructor stipulates the prior and of course the students then share it."

  **Design Response:** The **Blind Prior Escrow** neutralizes this. The instructor does not stipulate the prior; the class generates a *distribution* of priors. The "House Prior" is selected by *lottery*, not fiat. This models the CPA not as an empirical claim ("We all agree") but as a *coordination device* ("We agree to act *as if* this random draw was our starting point"). The game does not test if they *have* the same prior; it tests if they can *inhabit* a shared prior despite having different private data. If they fail (Round 1 Arbitrage), it proves that maintaining a common prior is cognitively costly and easily violated, validating the colleague's skepticism about empirical realism while vindicating the normative force of the assumption.

  ## VI. Limitations: What This Cannot Do

  I must be frank with the students (and you) about what this simulation leaves out:

  1.  **Common Knowledge Hierarchy:** We only run two rounds. We cannot simulate the infinite recursion of "I know that you know that I know." The Agreement Theorem relies on this limit structure; our game relies on a single-shot arbitrage check.
  2.  **The Limit Structure:** We settle bets immediately. We do not show the *convergence* over time that Aumann predicts. We only show the *static* condition for disagreement.
  3.  **The Counterfactual Gap:** This is the most critical limitation. No amount of role-play can truly put a student in the counterfactual state of "Having their evidence with my prior." The Belief-Plan table is a *symbolic* substitute for this. I must explicitly state in the debrief: "You calculated this number; you did not *feel* it. The CPA claims you should *feel* it. That is a normative demand, not a descriptive fact."

  ***

  **Instructor Note:** The success of this session hinges on the **Belief-Plan Table**. If students treat it as busywork, the philosophical point is lost. Spend the extra minute ensuring they understand that the empty row (the signal they didn't get) is the most important number in the room. It is the bridge between their mind and their neighbor's.
