answer: |-
  You have correctly identified that the standard "there is no last round" gloss is a semantic sleight of hand that obscures the actual mechanism. You are right to be bug-ed by it.

  Here is the gut-level resolution to the paradox, followed by the specific answer to your decaying-probability/bounded-memory variation.

  ### 1. What actually blocks the induction?

  The backward induction unravels in the finite case because of **common knowledge of the node**, not the existence of the node.

  In a finitely repeated game with known $T$, at round $T$, both players *know* they are at round $T$. Because they know the future payoff is exactly zero, the dominant strategy is Defect. Because Player 1 knows Player 2 knows this, Player 1 knows cooperation at $T-1$ cannot be rewarded, and so on.

  In the indefinitely repeated game with continuation probability $w$:
  1.  **Ontologically:** Yes, the game ends with probability 1. There is a realized last round $T_{real}$.
  2.  **Epistemically:** At round $T_{real}$, the players **do not know** they are at round $T_{real}$. Their information set is identical to round $T_{real} - 1$, $T_{real} - 100$, etc.

  **The Induction Blocker:** You cannot condition your strategy on "This is the last round" if your information set does not distinguish the last round from the second-to-last round.

  To start the backward induction, you need an anchor: a node where you *know* the future value is zero. In the stochastic game, there is no such node in the *decision tree accessible to the players*. Every node you ever actually stand on has a positive expected future value (because there is a probability $w$ of continuing).

  When the game actually ends at $T_{real}$, you don't get to make a decision. Nature makes the decision to end the game. You made your decision at $T_{real}$ thinking there was a chance of $T_{real} + 1$. You cooperated based on that expectation. The fact that Nature rolled a "stop" doesn't retroactively make your decision irrational; it just means you got unlucky on the realization.

  **Gut Check:** Imagine you are walking across a bridge that has a 1% chance of collapsing at each step.
  *   **Finite:** You know the bridge is exactly 100 steps long. At step 100, you know there is no step 101. You might as well run.
  *   **Indefinite:** You don't know the length. At every step, you think "There's a 99% chance there's another step." You walk carefully. Eventually, the bridge collapses under you. Did you make a mistake by walking carefully at the last step? No. You couldn't have known it was the last step. The induction doesn't start because you never have the knowledge required to trigger the "run" logic.

  ### 2. The Decaying Probability + Bounded Memory Variation

  Now to your specific stuck point.
  *   **Setup:** Continuation probability $w_t$ decays over time (relationships wear out).
  *   **Constraint:** Players have bounded memory $M$. If $t > M$, all histories look identical (a string of Cooperations). They cannot count rounds.
  *   **Question:** Is cooperation an equilibrium? Does it depend on objective $w_t$ or inferred hazard?

  **The Answer:** Cooperation depends entirely on the **inferred hazard rate (subjective belief)**, not the objective hazard rate at the realized round.

  Here is why the "Shadow of the Future" framing breaks here, and what replaces it.

  #### The Clock Assumption
  The standard "Shadow of the Future" framing implicitly assumes **stationarity**. It assumes $w$ is constant, so the "shadow" looks the same from round 1 as from round 1,000. This allows players to ignore the clock.

  In your variation, $w_t$ is non-stationary. The "shadow" shrinks objectively. However, because players have bounded memory, they **do not have a clock**. They cannot look at $w_t$ directly. They only know: "I have survived this long without defection or termination."

  #### The Belief Update
  Since they can't count $t$, they must form a belief distribution over what $t$ is, conditional on the game not having ended yet.
  *   If relationships usually die young, surviving past memory window $M$ signals "This is a robust relationship." (Selection effect).
  *   If relationships decay deterministically, surviving past $M$ signals "We are old; the end is near." (Hazard effect).

  **The Equilibrium Condition:**
  Cooperation is sustainable if and only if:
  $$ \text{Expected Future Value (given Beliefs)} > \text{Temptation to Defect} $$

  The "Expected Future Value" is calculated using the **subjective probability of continuation**, derived from their Bayesian update on "How old is this relationship likely to be, given that we are still here and I can't remember the start?"

  #### Where the Induction Breaks (or Doesn't)
  In the finite known-$T$ case, induction unravels because knowledge of $T$ is common.
  In your bounded-memory case, **induction cannot unravel from the end** because the players cannot identify the end.

  However, cooperation can still collapse, but not via backward induction. It collapses via **belief thresholding**.

  1.  Suppose $w_t$ drops so low that if a player *knew* they were at time $t$, they would defect.
  2.  Because they don't know $t$, they ask: "What is the probability I am at a 'high $t$' versus a 'low $t$'?"
  3.  If the decay of $w_t$ is severe enough, the *average* expected $w$ (weighted by the probability of being at various ages $t > M$) will drop below the cooperation threshold.
  4.  Once that happens, players defect not because they know it's the last round, but because **the relationship looks 'tired' enough that the gamble isn't worth it.**

  #### Objective vs. Subjective
  It is **strictly the subjective inferred hazard**.
  Game theory is about best responses to information. If the objective $w_t$ is 0.1 (defect), but the player's memory limitation and priors lead them to believe $w_{expected}$ is 0.9 (cooperate), they will cooperate. They are playing a best response to their information set.

  If the objective reality is that $w_t$ is tiny, they will eventually be "surprised" by the game ending, just like in the standard IPD. But as long as their *belief* keeps the shadow of the future long enough, the equilibrium holds.

  ### 3. Summary of the "Bug" Fix

  You were flip-flopping because the standard framing conflates **ontology** (how the game actually ends) with **epistemology** (what players know).

  1.  **What blocks the induction?** The lack of **identifiability** of the terminal node. You can't unravel from a node you can't distinguish from non-terminal nodes.
  2.  **Does the "Shadow of the Future" assume a clock?** Yes. It assumes stationarity ($w$ is constant). If $w$ varies and players can't track time, the "shadow" is not a fixed length; it is a **probability distribution over relationship ages**.
  3.  **Your Variation:** Cooperation holds if the *belief-updated* continuation probability stays above the threshold. It does not matter if the objective relationship is on its last legs, provided the players' bounded memory prevents them from realizing how worn out the relationship actually is.

  **The Gut-Level Image:**
  Imagine driving in thick fog (bounded memory). The road might end at a cliff (game ends).
  *   **Finite Known:** You can see the cliff markers. You speed up as you approach.
  *   **Indefinite Constant:** The fog never lifts, but the cliff is randomly placed. You drive safely forever because every foot looks like every other foot.
  *   **Your Variation:** The road gets structurally weaker the further you go (decaying $w$). But the fog prevents you from seeing the cracks. You keep driving safely **until your internal sense of "how long have I been driving?"** suggests you are likely on a rotten section. You don't stop because you see the cliff; you stop because the *risk profile of the fog* changes.

  The induction doesn't unravel from the cliff edge back to you. It dissolves because the fog itself starts looking dangerous.
