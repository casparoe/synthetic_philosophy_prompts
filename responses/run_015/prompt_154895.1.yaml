      *   **Participants:**
          *   *Hierarchical-Sphexist:* Humans = nested rigid loops (complexity creates illusion of openness).
          *   *Genuine-Flexibility Theorist:* Humans = irreducibly open-ended revision (sphexishness is the absence of free will).
      *   **Structure:**
          1.  Numbered section of agreed claims (ethology, rigidity vs. revision, limits of hierarchical models).
          2.  Table of disagreements (phrased neutrally/acceptably to each side, focusing on complexity vs. openness).
          3.  Cruxes (predictive success vs. flexibility, continuum vs. categorical).
