  2.  **Deconstruct the Positions:**
      *   *Hierarchical-Sphexist (HS):* Deterministic/Computational view. "Free will" is a user-illusion generated by layers of subroutines. Even when we change our minds, it's because a higher-order loop triggered a rewrite of a lower-order loop. It's all mechanism.
      *   *Genuine-Flexibility Theorist (GF):* Libertarian or Compatibilist (strong sense) view. There is a qualitative break between stimulus-response chains and agentive revision. "Sphexishness" is the label for being stuck in a loop; humans can break the loop *because* of agency, not just because of a higher loop.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need common ground on the biology (the wasp).
      *   Need common ground on the definition of "sphexishness" as a concept (rigidity).
      *   Need common ground on the limits of current modeling (we can't fully map the brain yet).
      *   *Drafting points:*
          1.  Sphex ichneumoneus exhibits fixed action patterns (dragging cricket, checking burrow).
          2.  Disruption leads to repetition without adaptation (the "sphexish" trait).
          3.  Human behavior shows vastly more complexity than the wasp.
          4.  Both agree that *some* human behavior is sphexish (habits, reflexes).
          5.  Both agree that purely linear hierarchical models struggle to explain novel context-switching without ad hoc adjustments.

  4.  **Drafting Section 2: Table of Disagreements:**
      *   Needs to be a table.
      *   Columns: Issue, Hierarchical-Sphexist Stance, Genuine-Flexibility Stance.
      *   Key disagreement: Is complexity enough for openness?
      *   *HS:* Yes, sufficient complexity *is* openness.
      *   *GF:* No, complexity simulates openness; true openness requires non-algorithmic revision.
      *   Key disagreement: Nature of the "break."
      *   *HS:* No break, just deeper recursion.
      *   *GF:* Qualitative break exists.

  5.  **Drafting Section 3 & 4: Cruxes and Test Cases:**
      *   *Crux 1: Predictive Success.* If a mechanistic model predicts a "change of mind," does that prove it was mechanical?
          *   *HS:* Yes, prediction implies underlying mechanism.
          *   *GF:* No, predicting *that* someone changes their mind isn't predicting *how* they author the change.
          *   *Case:* The "Pre-commitment Paradox" (Ulysses contract).
      *   *Crux 2: Continuum vs. Category.* Is sphexishness a matter of degree or kind?
          *   *HS:* Continuum. We are just less sphexish than the wasp.
          *   *GF:* Category. We are capable of non-sphexish acts; the wasp is not.
          *   *Case:* The "Infinite Regress of Why." (Asking an agent why they changed a rule vs. a machine).

  6.  **Drafting Section 5: Verbal vs. Substantive:**
      *   Where are they talking past each other?
      *   Likely the definition of "openness" or "mechanism."
      *   If "mechanism" includes *any* physical process, GF might agree but claim "agency" is a higher-order property.
      *   If "openness" just means "unpredictable to the agent," HS might agree it's just hidden variables.
      *   *Verbal dispute:* The definition of "genuine." HS defines it functionally; GF defines it ontologically.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it collaborative? Yes, use "We agree," "We acknowledge."
