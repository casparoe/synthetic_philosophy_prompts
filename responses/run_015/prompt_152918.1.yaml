      *   *The Tension:* If marriage is a contract, breaking it (adultery) seems like a breach. If divorce is easy, the contract is weak. Russell wants easy divorce *and* tolerance for affairs. Why isn't an affair just a signal to divorce?
      *   *Contractualist Fallibilism:* The idea that contracts (especially intimate ones) are based on incomplete knowledge and must be revisable without moral stigma *if* the revision process is honest. However, this implies a duty to *renegotiate* rather than *violate*.
      *   *The Twist:* Usually, scholars argue Russell is a utilitarian here. The prompt asks to argue he is *not* (or at least, that the stronger reconstruction is contractualist fallibilism) and that this specific reconstruction actually makes his view on adultery *stricter* (weakening the permissive stance) while keeping the divorce reform strong.

