prompt: |-
  I'm a doctoral student in the history of moral philosophy working on early twentieth-century reconstructions of sexual ethics, and I'm trying to develop a conceptual reconstruction of Russell's position on marriage and intimacy rather than a historical survey. Please argue that Russell's separation of reproductive responsibility from sexual intimacy implicitly relies on what we might call "epistemic partitioning"—the claim that the knowledge available to partners qua institutional contractors is structurally different from the knowledge available to them qua private moral agents—such that his defense of liberalizing divorce law actually stands in tension with his more permissive attitude toward adultery unless we supply an unstated premise about the revisability of institutional commitments. Make the case that this missing premise is best reconstructed not as utilitarian but as a form of contractualist fallibilism applied specifically to intimate institutions, and demonstrate in detail why accepting it strengthens Russell's argument for reforming marriage law while simultaneously weakening his argument for decriminalizing or destigmatizing extramarital relations. I want the conceptual architecture developed rigorously, without bibliographic references, citations, or appeals to secondary literature; treat the view as one you are reconstructing from general philosophical competence.
