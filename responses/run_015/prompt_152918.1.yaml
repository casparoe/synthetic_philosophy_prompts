      *   **Section 3: Contractualist Fallibilism as the Missing Premise.**
          *   Reject Utilitarianism: It's not just about maximizing pleasure (which would easily justify secret affairs). It's about the *validity of the commitment*.
          *   Define Contractualist Fallibilism: Commitments are made under conditions of uncertainty about future selves and feelings. Therefore, the *mechanism* of revision is part of the moral contract.
          *   The "Revisability Clause": A moral marriage contract *must* include the possibility of termination without moral blame when the private epistemic conditions change.
      *   **Section 4: Implications for Reform vs. Adultery.**
          *   *Strengthening Divorce Reform:* If fallibilism is true, the law *must* allow exit. To trap people is to deny the epistemic reality of human change. This makes the argument for no-fault divorce conceptually robust.
          *   *Weakening the Defense of Adultery:* If the moral duty is to *revise* the contract when private knowledge shifts, then *concealing* that shift (adultery) violates the contractualist norm of transparency required for fallibilism to work.
          *   Adultery becomes a failure to enact the revisability clause. It treats the partner as a means (institutional shell) rather than a co-contractor.
