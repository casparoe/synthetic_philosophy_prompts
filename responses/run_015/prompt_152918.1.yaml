answer: |-
  **Title:** The Epistemic Architecture of Intimate Commitment: A Contractualist Reconstruction of Russellian Sexual Ethics

  **Introduction**

  The reconstruction of early twentieth-century sexual ethics requires moving beyond the biographical or sociological context of its proponents to examine the underlying conceptual architecture. In analyzing the position associated with Bertrand Russell regarding marriage, divorce, and sexual liberty, one encounters a surface-level tension: a robust defense of liberalizing divorce laws coexists with a permissive attitude toward extramarital intimacy. Standard interpretations often resolve this via a appeal to consequence-sensitive reasoning, suggesting that restrictions on either front produce unnecessary unhappiness. However, a rigorous conceptual analysis reveals that this utilitarian gloss obscures a deeper structural claim about the nature of knowledge within intimate institutions.

  This essay argues that the coherence of this position relies on a mechanism of *epistemic partitioning*. This is the claim that the knowledge available to partners *qua* institutional contractors is structurally distinct from the knowledge available to them *qua* private moral agents. When this partitioning is examined, a tension emerges between the liberalization of divorce and the tolerance of adultery. Resolving this tension requires supplying an unstated premise: the *revisability of institutional commitments*. I contend that this premise is best reconstructed not as a utilitarian calculation of pleasure, but as a form of *contractualist fallibilism* applied specifically to intimate institutions. Accepting this reconstruction strengthens the argument for reforming marriage law by grounding it in the epistemic limits of commitment, but simultaneously weakens the argument for decriminalizing or destigmatizing extramarital relations, as such relations bypass the moral necessity of transparent renegotiation.

  **I. Epistemic Partitioning and the Dual Nature of the Marital Bond**

  To understand the separation of reproductive responsibility from sexual intimacy, one must first accept that the marital bond operates on two distinct epistemic registers. On the first register, the *institutional*, partners function as public contractors. The knowledge pertinent here is static, status-based, and oriented toward external stability. It concerns duties regarding child-rearing, property, and social recognition. On this register, the partners are known to the state and society as a unit; the epistemic access is limited to observable compliance with the terms of the union.

  On the second register, the *private*, partners function as moral agents engaged in affective exchange. The knowledge pertinent here is dynamic, subjective, and oriented toward internal fulfillment. It concerns desire, emotional compatibility, and psychological growth. Crucially, this knowledge is privileged and inaccessible to the public sphere.

  Russell's separation of reproduction from intimacy rests on the claim that these two registers should not be conflated. The institutional contract should secure the conditions for reproduction and social stability, but it cannot command the private epistemic state of affection. When the law treats the private register as if it were subject to the same stasis as the public register (by making marriage indissoluble), it creates an epistemic contradiction: it demands public compliance with a private reality that may have ceased to exist.

  This partitioning allows for the initial critique of traditional marriage. If the public contract claims to guarantee private affection, it claims knowledge it cannot possess. Therefore, the institution must be limited to what is publicly knowable and manageable (reproduction, economic support), while the private realm of intimacy must be granted autonomy. However, this autonomy creates the central tension: if the private agent knows the intimacy has shifted to a third party, what is the obligation of the institutional contractor?

  **II. The Tension Between Divorce and Adultery**

  The tension arises when we consider the moral status of exiting the institution versus violating its terms while remaining within it. Russell's position advocates for easy exit (divorce) and tolerates continued intimacy outside the bond (adultery) without severe stigma. Superficially, these appear to be complementary liberties. Conceptually, however, they pull in opposite directions regarding the integrity of the epistemic partition.

  Liberalizing divorce acknowledges the fallibility of the initial commitment. It admits that the private moral agent's knowledge at time *t1* (vows) may not hold at time *t2*. Therefore, the institutional contract must allow for termination. This aligns the public status with the private reality.

  Tolerating adultery, conversely, allows for a divergence between public status and private reality to persist. It suggests that the private moral agent may pursue new intimacy while the institutional contractor maintains the facade of the original union. If the justification for divorce is that private affection cannot be coerced, then the justification for adultery is that private affection need not disrupt public status.

  The conflict is this: If the epistemic partition is respected, the private agent's change of heart should trigger a revision of the public contract. To allow adultery without divorce is to privilege the private agent's desire for novelty while burdening the institutional contractor (the spouse) with a false epistemic status. The spouse is treated as a contractor in a viable union, while the private reality indicates the union is functionally dead. This creates an asymmetry of knowledge that undermines the moral equality of the partners. One partner holds the truth of the relationship's status, while the other is kept in a state of institutional ignorance.

  **III. Contractualist Fallibilism as the Unstated Premise**

  To resolve this tension, we must identify the normative principle that governs the transition between the private and public registers. A utilitarian reconstruction would suggest that adultery is permissible if it increases net happiness and divorce is permissible if it decreases net misery. However, this fails to account for the specific wrong of deception or the specific value of the promise itself. It reduces the institution to a mere vessel for utility, ignoring the deontological weight of the commitment.

  A more robust reconstruction posits *contractualist fallibilism*. This principle holds that intimate commitments are made under conditions of radical uncertainty regarding the future self. Because the private moral agent cannot know their future affective state, the validity of the institutional contract depends not on its permanence, but on the *procedural integrity of its revision*.

  Under contractualist fallibilism, the moral force of marriage lies in the agreement to treat the partner as a co-legislator of the relationship's terms. Because human knowledge of one's own capacity for love is fallible, the contract must include a clause for renegotiation or termination. The moral obligation is not to remain married forever, nor is it to remain sexually exclusive forever. The moral obligation is to ensure that the public status of the relationship reflects the consensual agreement of both private agents.

  This shifts the locus of moral evaluation from the *act* (sex with another) to the *process* (renegotiation of the contract). The "revisability premise" asserts that when the private epistemic condition changes (loss of love, new desire), the institutional contractor has a duty to initiate a revision of the public terms. This is not a utilitarian calculation of harm, but a contractualist requirement of reciprocity. To hold a partner to a contract that one privately knows is no longer valid is to treat them as a subject of the institution rather than a partner in the contract.

  **IV. Strengthening the Case for Divorce Reform**

  Accepting contractualist fallibilism significantly strengthens the argument for liberalizing divorce law. Under a utilitarian framework, divorce is a necessary evil to prevent greater suffering. It is contingent. If a specific unhappy marriage produced more net utility than its dissolution, the utilitarian case for divorce would weaken.

  Under contractualist fallibilism, the right to divorce is structural. Since the knowledge required to sustain the intimate bond is private and dynamic, the law *must* recognize the right to revise the commitment. To deny divorce is to enforce a contract based on epistemic falsehoods. It compels the institutional contractor to maintain a public status that contradicts the private moral reality. This is a violation of autonomy not merely because it causes pain, but because it denies the agent's authority over their own epistemic commitments.

  Furthermore, this framework mandates *no-fault* provisions. If the revision is based on the fallibility of affection rather than a breach of duty, then assigning blame is conceptually incoherent. A change in private knowledge is not a moral failure; it is an epistemic update. Therefore, the law should facilitate the update without requiring proof of wrongdoing. This makes the argument for divorce reform conceptually airtight: it is a requirement of justice that public institutions not bind individuals to private realities they no longer endorse.

  **V. Weakening the Case for Destigmatizing Adultery**

  While contractualist fallibilism fortifies the case for divorce, it simultaneously undermines the case for destigmatizing extramarital relations. In the standard permissive reading, adultery is viewed as a private matter that should not incur social penalty, provided it is discreet. The harm is minimized, so the stigma is unjustified.

  However, if the core moral duty is the transparent revisability of the contract, adultery represents a failure of that duty. Adultery, by definition, typically involves concealing the shift in private epistemic status from the institutional partner. It maintains the public contract while secretly violating its exclusive terms. Even if "open marriage" is considered, the unstated premise of Russell's era was often the tolerance of secret affairs.

  Under contractualist fallibilism, the wrong of adultery is not primarily the sexual act itself, but the *bypassing of the renegotiation procedure*. By engaging in extramarital intimacy without dissolving the marriage or securing the partner's consent to a new arrangement, the agent unilaterally alters the terms of the contract. This treats the partner as an obstacle to be managed rather than a co-contractor to be consulted.

  Consequently, the stigma attached to adultery cannot be fully dismissed as mere puritanism. It serves a functional role in enforcing the norm of transparency. If society destigmatizes adultery entirely, it reduces the incentive for the agent to trigger the revisability clause (divorce or renegotiation). It allows the epistemic partition to become a tool of deception rather than a protection of privacy.

  Therefore, a consistent application of contractualist fallibilism demands that while the *desire* for new intimacy is not stigmatized, the *concealment* of that desire within an existing exclusive contract is. The argument for decriminalization may stand on grounds of liberty, but the argument for *destigmatization* weakens. The moral community is justified in viewing adultery as a procedural vice—a failure of honesty regarding the status of the commitment—even if it is not viewed as a sin against nature. The reform should be toward normalizing the *exit* and the *renegotiation*, not the *violation*.

  **VI. Synthesis: The Integrity of Intimate Institutions**

  The conceptual architecture of this reconstruction reveals that the separation of reproduction from intimacy is not a license for dual lives, but a demand for institutional honesty. Epistemic partitioning is not meant to allow the private self to hide from the public self; it is meant to prevent the public institution from claiming authority over the private self.

  When the private self changes, the public institution must be updated. Russell's permissive attitude toward adultery assumes that the harm of sexual exclusivity outweighs the harm of deception. Contractualist fallibilism corrects this by positing that the harm of deception undermines the very possibility of a moral contract. If partners cannot trust that the public status reflects the private reality, the institution of marriage loses its normative force.

  Thus, the reconstruction leads to a more rigorous, albeit less libertine, conclusion. The liberalization of divorce is not merely a concession to human weakness, but a recognition of human epistemic limits. Conversely, the tolerance of adultery is not a triumph of liberty, but a potential failure of contractual integrity. The ideal system is one where the cost of revising the contract (divorce) is low enough that the incentive to violate it (adultery) is rendered unnecessary.

  **Conclusion**

  By reconstructing the position through the lens of epistemic partitioning and contractualist fallibilism, we resolve the tension between divorce reform and sexual liberty by prioritizing the former at the expense of the latter. The knowledge available to the private agent regarding their affections is fallible and mutable; the knowledge available to the institutional contractor must be accurate and consensual.

  This architectural shift demonstrates that the moral imperative of early twentieth-century sexual ethics is not the maximization of sexual opportunity, but the alignment of institutional forms with epistemic realities. Accepting this premise strengthens the demand for legal reform, as it grounds the right to divorce in the necessary conditions of moral agency. Simultaneously, it weakens the defense of extramarital relations, recasting them not as harmless private pleasures, but as failures to honor the procedural obligations of intimate commitment. The result is a vision of sexual ethics that is liberal in its exit options but rigorous in its demand for honesty, preserving the value of the promise by acknowledging the limits of the promisor.
