answer: |-
  The conventional wisdom, solidified by Amartya Sen, holds that famines are not failures of food availability but of entitlement. They are political crimes wherein distribution mechanisms collapse while granaries remain full. This is a vital correction to Malthusian fatalism, yet it stops short. It locates the failure in the economy or the political will, assuming that once the entitlement failure is identified, the remedy is straightforward. My contention is that the operative crime in the great twentieth-century famines was epistemic rather than distributive. The machinery of death was lubricated not merely by malice or neglect, but by a catastrophic breakdown in the state's capacity to know, or to treat as known, that its citizens were dying. Food policy sits downstream of this break; the interesting failure is upstream, in the knowing.

  To argue this properly, we must split the thesis into two separable claims. The first is information suppression: the signal never gets sent. This encompasses censorship, the killing of messengers, cadres inflating output figures to meet quotas, or an administration that refuses to formally declare a famine. The second is interpretive failure: the signal is sent, received, and then discounted as decision-irrelevant. Here, officials read the reports but conclude the market will sort it out, or that deaths are an acceptable price for industrialisation, or simply that the reports are exaggerations incompatible with ideological priors. While suppression is the more visible crime, interpretive failure is the load-bearing claim. Suppression is merely a specific tactic of control; interpretive failure explains how famines persist even when information flows. It accounts for why a government might possess accurate data and still refrain from action, not solely because of cost, but because the data does not compute within their model of reality. If the thesis relies only on suppression, it collapses back into a simple story of tyranny. It is the discounting of accurate information that reveals the epistemic rot.

  Consider China during the Great Leap Forward. The epistemic account predicts we should find a system where truth-telling was structurally punished and false positives rewarded. This is precisely what we find. Local cadres, terrified of purges, reported record harvests that did not exist. The centre, operating on these inflated figures, set procurement quotas that stripped regions of every edible grain. Here, the signal was suppressed at the source. However, even when dissenting reports reached the top—such as those from Peng Dehuai—they were dismissed as rightist deviationism. This moves us into the second claim: interpretive failure. The ideology of the Leap was so totalising that contradictory evidence was categorised not as data, but as counter-revolutionary noise. The famine was not just a result of grain being taken; it was the result of a reality tunnel where taking the grain was logically consistent with the belief that there was a surplus.

  Bengal in 1943 presents a hybrid case. The epistemic account predicts censorship of news regarding food shortages and a refusal to categorise the crisis as a famine to avoid panic or military embarrassment. The wartime denial policies stripped boats and rice stocks, but crucially, the provincial government declined to call the thing a famine until it was too late. The War Cabinet in London received reports but prioritised shipping for the war effort over Indian lives. Here, the signal was partially sent but heavily filtered. Churchill's administration did not necessarily doubt people were hungry; rather, they discounted the urgency relative to military logistics. The epistemic failure lies in the categorisation of Indian starvation as a lower-order variable than European victory. The information existed, but the hierarchy of knowledge placed it below strategic necessity, rendering it inert.

  Ireland remains the hardest case and the true test of the thesis. Between 1845 and 1852, grain and livestock left the country while people died. There was a free press, Irish members at Westminster, and no totalitarian censorship. This looks like a refutation of the information story. If the epistemic claim holds, we must find that the information was received but ideologically neutralised. The evidence supports this. The Treasury operated inside a state saturated with reports of death, yet acted within a rigid laissez-faire framework. The ideological prior was that market interference would distort prices and prolong the dependency of the Irish. Accurate reporting was treated not as a call to action, but as evidence of Irish incapacity or inevitable natural correction. The signal was sent and received, but the recipients possessed a cognitive framework that made relief seem economically illiterate or morally hazardous. This confirms the second, load-bearing claim: the failure was not in the transmission of the signal, but in the processor receiving it. The free press prevented total ignorance, but it could not prevent motivated disbelief.

  The strongest objection to this thesis is that it conflates epistemology with motivation. If rulers have the facts and choose not to act because doing so is politically expensive, is that not simply a political crime? To stretch "epistemic failure" to cover motivated disbelief risks making the thesis unfalsifiable. The distinction lies in the actionability of the knowledge. In a purely political calculation, the leader knows action is possible but chooses not to pay the price. In an epistemic failure, the leader believes action is impossible or counter-productive based on their model of the world. In Ireland, Peel and Russell did not merely choose to save money; they believed that stopping grain exports would violate natural economic laws and cause greater suffering later. In China, Mao did not merely choose to industrialise over feed; he believed the harvests were real. When the belief system renders the remedy invisible or harmful, the failure is epistemic. It is not just that they did not care; it is that they could not see the connection between the data and the solution.

  This position offers something genuinely new relative to the familiar democracy-and-free-press claim. Sen argues that famines do not occur in functioning democracies because leaders face electoral incentives to respond. My argument suggests that incentives are insufficient if the interpretive framework is broken. A free press can be read and ignored, as in Ireland. The Great Leap had plenty of information flowing upward through party channels that did not translate into relief because the channel was trusted but the content was corrupted by fear. The standard view assumes information translates automatically into pressure. The epistemic view recognises that information must be legible and actionable within the ruling ideology. Democracy helps, but only if the democratic consensus does not share the same blind spots regarding who counts as human or how economies function.

  If this thesis is true, there is a specific observation that would falsify it. We would need to find a famine where leaders had accurate, real-time data, possessed no ideological blinders preventing intervention, faced low political costs for acting, and yet failed to prevent mass death due purely to logistical inability despite having resources. If such a case exists, the failure is distributive, not epistemic. Conversely, if the thesis holds, it carries an awkward implication for famine prevention. The standard position suggests sending food and fixing entitlements. The epistemic position implies that we must fix the verification mechanisms first. It suggests that independent auditing of state data is more vital than grain shipments. It implies that empowering local journalists or statisticians is a more effective intervention than foreign aid, because without the truth, aid is blinded. It forces us to confront that sometimes the people in charge are not hiding the truth; they are living inside a different one.
