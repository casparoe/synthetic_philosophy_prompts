answer: |-
  There is no single canonical term in political or legal theory that captures this specific pathology in its entirety. You have identified a structural vulnerability that sits at the intersection of constitutional theory, administrative law, and the economics of incomplete contracts. It is a known phenomenon, but it is usually described by a constellation of concepts rather than a single noun.

  The nearest established terms are **Kompetenz-Kompetenz**, the **Essential Core Doctrine** (*Wesentlichkeitstheorie*), and **Unconstitutional Conditions**. However, each differs from your case in specific ways. Below is the carving you requested: what the phenomenon consists in, how it differs from adjacent concepts, and a proposed term for the structure you have identified.

  ### 1. The Nearest Established Terms (and Why They Are Not Quite It)

  **A. *Kompetenz-Kompetenz* (Competence-Competence)**
  *   **The Concept:** In arbitration and constitutional law, this is the authority of a body to determine the limits of its own jurisdiction.
  *   **The Fit:** Your board is exercising a form of *Kompetenz-Kompetenz*. They are asserting the authority to decide what counts as "interior" (their jurisdiction to regulate) versus "exterior/commercial" (your protected sphere).
  *   **The Difference:** Traditionally, *Kompetenz-Kompetenz* is about a tribunal deciding if *it* has the power to hear a case. Here, the board is deciding if *you* have the power to act. It is an inverse *Kompetenz-Kompetenz*: the regulator claiming the exclusive right to define the deregulated zone.

  **B. The Essential Core Doctrine (*Wesentlichkeitstheorie*)**
  *   **The Concept:** In German constitutional law (and echoed in U.S. "undue burden" tests), this holds that while a right may be regulated, its "essential core" cannot be touched. If a regulation hollows out the right so completely that it becomes illusory, it is void.
  *   **The Fit:** This captures your intuition that the right is being "reduced to nothing." The doctrine exists specifically to prevent the scenario where a right is preserved in text but vacated in practice.
  *   **The Difference:** This is a *standard of review* used by a higher court to strike down a law. Your co-op has no higher court. The doctrine describes the *wrong*, but not the *mechanism* by which the wrong is perpetrated (reclassification vs. regulation).

  **C. Unconstitutional Conditions**
  *   **The Concept:** The government (or authority) cannot grant a benefit (or allow a right) on the condition that the recipient waives another right, nor can it impose a penalty on the exercise of a right.
  *   **The Fit:** This perfectly describes the "exterior visibility" surcharge. The board says, "You have discretion, but it costs $40." This turns a right into a priced license.
  *   **The Difference:** This covers the *surcharge*, but not the *reclassification* (tutoring, book club, son). The reclassification is more insidious because it denies the right exists in that instance, rather than taxing its exercise.

  **D. Incomplete Contracts / Residual Control Rights**
  *   **The Concept:** In law and economics, no contract (or bylaw) can specify every future state of the world. "Residual control rights" determine who gets to decide when the contract is silent or ambiguous.
  *   **The Fit:** Your bylaws are an incomplete contract. They did not specify who holds the residual right to define "interior discretion."
  *   **The Difference:** Economic theory usually assumes residual rights fall to the asset owner (you, inside your unit). Your board has seized the residual right of *interpretation*. This highlights the drafting failure, but not the political structure of the encroachment.

  ### 2. The Carving: What the Phenomenon Consists In

  The structure you are observing is a **Second-Order Encroachment**.

  To understand the carving, we must distinguish between three layers of authority:
  1.  **First-Order Conduct:** Hanging the tapestry, tutoring, hosting the son.
  2.  **First-Order Right:** The bylaw clause granting "sole and final discretion" over conduct.
  3.  **Second-Order Authority:** The power to define the scope of the First-Order Right (i.e., to decide what counts as "interior discretion").

  **The Structure:**
  Your bylaws granted you the First-Order Right but remained silent on the Second-Order Authority. In the absence of a specified arbiter (like a court or an independent committee), the Board has claimed the Second-Order Authority by default. By controlling the definition of the sphere, they control the sphere without ever technically entering it.

  **What It Is Not:**
  *   **It is not Vagueness:** As you noted, precise wording ("any activity not visible from the street") can still be reclassified ("visibility includes light emission" or "psychological impact"). The problem is not semantic ambiguity; it is *interpretive monopoly*.
  *   **It is not Simple Rights Violation:** A violation admits the right exists and breaks it. This strategy denies the right applies to the specific case. It is a **jurisdictional denial** rather than a **substantive breach**.
  *   **It is not "Moving the Goalposts":** That implies changing the rules of the game. This is keeping the rules of the game but claiming the authority to redraw the field boundaries during play.

  ### 3. Answers to Your Theoretical Questions

  **"Is a single open reclassification adopted by a legitimate vote the same thing as an accretion of quiet ones?"**
  Structurally, **yes**. Both rely on the same flaw: the Board possesses the Second-Order Authority to define the scope of your rights. However, normatively, they differ. A single open vote is a **Constructive Amendment**. It admits that the bylaws are being changed and subjects the change to the voting threshold required for amendments. The accretion of quiet reclassifications is **Interpretive Encroachment**. It bypasses the amendment threshold by claiming the change is merely "clarification." The latter is more dangerous because it avoids the political cost of formal amendment.

  **"Does the analysis change if the reclassification genuinely prevents harm to other members?"**
  The *structure* does not change, but the *legitimacy* might. In political theory (Mill, etc.), harm prevention is the standard justification for limiting liberty. However, your grievance is procedural, not substantive. You are objecting to *who decides* what constitutes harm, not necessarily the outcome. If the bylaws granted the Board the power to regulate "nuisance," they could ban the tutoring. By instead reclassifying tutoring as "commercial," they are avoiding the burden of proof required to establish nuisance. They are expanding their jurisdiction rather than exercising their regulatory power.

  **"Can a protected sphere be protected at all without also protecting somebody's authority to say what falls inside it?"**
  **No.** This is the critical insight. A right without an interpreter is not a right; it is a hope.
  *   **Option A:** You hold the authority (Self-Judging). This leads to anarchy (you claim your drumming is "interior," neighbors claim it's "noise").
  *   **Option B:** The Board holds the authority (Administrative). This leads to your current situation (encroachment).
  *   **Option C:** A Third Party holds the authority (Judicial). This is the standard liberal democratic solution. Courts exist to define the boundary between private right and public regulation.
  Your co-op has a **Governance Gap**. It granted a negative right (freedom from board interference) without establishing a judicial mechanism to adjudicate boundary disputes.

  ### 4. Proposed Term and Definition

  Since no established term covers this precisely, I propose the term:

  **Definitional Encroachment**

  **Definition:**
  A structural pathology in governance where an authority, restricted from regulating a protected sphere of activity, asserts exclusive authority to define the boundaries of that sphere. By reclassifying protected activities as falling outside the boundary (e.g., redefining "residential" to exclude "home tutoring"), the authority negates the protection without formally violating the text.

  **Boundary Conditions:**
  1.  **Existence of a Protected Sphere:** There must be a text or norm granting a zone of non-interference (e.g., "sole discretion").
  2.  **Interpretive Monopoly:** The restricting body must hold the exclusive power to interpret the scope of that sphere without external review.
  3.  **Reclassification over Regulation:** The authority must act by changing the *category* of the activity rather than regulating the *conduct* itself.
  4.  **Avoidance of Amendment:** The redefinition must occur without triggering the formal amendment process required to alter the protected sphere.

  **Distinction from Adjacent Concepts:**
  *   **Vs. *Ultra Vires*:** *Ultra vires* is acting beyond power. Definitional Encroachment is expanding the *definition* of the power to make the act appear *intra vires*.
  *   **Vs. Gerrymandering:** Gerrymandering redraws geographic lines to dilute voting power. Definitional Encroachment redraws conceptual lines to dilute liberty.
  *   **Vs. License vs. Liberty:** This is the *mechanism* of conversion. Definitional Encroachment is the *process* by which a Liberty is converted into a License (requiring permission/fee).

  ### 5. Summary of the Structural Flaw

  You suspected the bylaws were "structurally incomplete." You are correct. They granted a **Substantive Right** (interior discretion) without assigning a **Procedural Guardian** (who defines the interior).

  In insurance pricing (your field), this is akin to a policy covering "Acts of God" but giving the insurer sole discretion to define what counts as an "Act of God." The coverage exists, but the claims adjuster holds the dictionary.

  The phenomenon is **Definitional Encroachment**. It is the exercise of **Second-Order Authority** to vacate a **First-Order Right**. It is distinct from rights violations because it operates on the *scope* of the entitlement rather than the *exercise* of it. It is distinct from amendment because it claims to be interpretation. It is the administrative state's oldest trick, applied to the private sphere: **He who defines the exception rules the rule.**
