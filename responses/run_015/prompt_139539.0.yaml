answer: |-
  # Defense Prep Sheet: Chapter 3 (Verisimilitude)

  **Strategy:** You are not defending absolute verisimilitude; you are defending the *dissolution* of the absolute problem. Your goal is to show that question-relativity is a feature, not a bug. Do not get bogged down in formal proofs during Q&A; keep the philosophical payoff in view.

  ---

  ### 1. The Formalist Objection (The "Redundancy" Charge)
  **Who:** The Bayesian/Accuracy-First Bloc (3 people)
  **Likelihood:** Very High | **Damage:** High (Makes your project look derivative)
  **Voice:** "You've defined verisimilitude as the expected share of questions answered correctly, weighted by importance. But that's just expected inaccuracy relative to a partition under a proper scoring rule. If the formalism is identical to standard accuracy-first epistemology, what philosophical work is the label 'truthlikeness' doing that 'accuracy' doesn't already do? Are you just rebranding?"

  **90-Second Reply:**
  "The formal structure is indeed compatible with accuracy-first frameworks, and I welcome that consistency. But the *interpretive* target is different. Accuracy-first epistemology is typically about grading *credences* or *beliefs* at a time. My target is *theoretical progress* across history. When we say Newtonian mechanics is closer to the truth than Aristotelian physics, we aren't just saying it scores better on a current betting quotient; we're saying it answers the *research questions* of the tradition more correctly. The 'truthlikeness' label captures the realist intuition that science accumulates answers, not just coherent credences. I'm using the formalism to solve a specific problem in philosophy of science—language dependence—that accuracy theory hasn't prioritized."

  **Concede:** The mathematical isomorphism. Don't fight the formalists on the math.
  **Soft Spot:** If they press that "accumulating answers" is just "accumulating accuracy," you risk collapsing back into their terminology. Hold the line on *theories vs. credences*.

  ### 2. The Realist Objection (The "Utility" Charge)
  **Who:** The Likeness-Approach Realists (2 people)
  **Likelihood:** High | **Damage:** High (Attacks the core thesis)
  **Voice:** "Popper wanted to know if we are getting closer to the *world*, not just closer to satisfying our current curiosities. By making verisimilitude relative to a question set $Q$, you've turned truthlikeness into a pragmatic notion of utility. A theory can be 'truthlike' for you simply because it answers the questions we care about, even if it misses the fundamental structure of reality. Haven't you just surrendered realism?"

  **90-Second Reply:**
  "I haven't surrendered realism; I've refined what access to reality looks like. We never encounter the 'world' sans description; we encounter it through the problems we pose. If two theories answer different questions, asking which is absolutely closer is like asking if a hammer is better than a screwdriver without asking what you're building. My account preserves the core realist intuition: false theories can still be *correct* about specific aspects of the world. The 'utility' charge assumes questions are arbitrary; I argue they are constrained by the causal structure of the domain. We don't just ask *any* questions; we ask the ones the world allows us to ask."

  **Concede:** You are abandoning *language-independent* ordering. Admit that.
  **Soft Spot:** The claim that "the world constrains the questions" needs cashing out. If the world constrains $Q$, doesn't that reintroduce an absolute standard you just rejected?

  ### 3. The "Hope Nobody Asks" Objection (Trivialization & Circularity)
  **Who:** Any sharp logician in the room
  **Likelihood:** Medium | **Damage:** Critical (Collapses the definition)
  **Voice:** "Two worries. First, trivialization: If I define $Q$ as 'the set of questions Theory A answers correctly,' Theory A is maximally verisimilitudinous. You need constraints on $Q$. Second, circularity: To choose a *good* $Q$, don't I need to know which questions are 'important' or 'carving nature at its joints'? But isn't determining importance itself an inquiry aiming at truth? So don't you need a prior notion of truthlikeness to pick your questions, making the definition circular?"

  **90-Second Reply:**
  "On trivialization: $Q$ is fixed by the research context *prior* to theory evaluation, not post-hoc. It's a rule of the game, like the rules of cricket; you can't change the wickets after the ball is bowled. On circularity: This is the harder challenge. My reply is that picking $Q$ is a *pragmatic* or *methodological* choice, not a truth-apt one. We select questions based on explanatory power, intervention potential, or social need, not because we know they are 'True.' We don't need a prior theory of truth to decide that 'Will this bridge collapse?' is a more important question than 'What is the third decimal of its weight?' Importance is not truth."

  **Concede:** You cannot allow post-hoc selection of $Q$. That must be ruled out by definition.
  **Soft Spot:** **Honest Assessment:** The circularity reply is the weakest link in your armor. If "importance" tracks "causal significance," and causal significance is a truth-apt matter, the circle tightens. If "importance" is purely pragmatic, the Realists (Objection 2) will pounce. Be prepared to admit that $Q$-selection is the *only* place where non-truth-relative values enter, and that this is unavoidable.

  ### 4. The Weighting Objection (The "Subjectivity" Charge)
  **Who:** Overlap of Formalists and Realists
  **Likelihood:** High | **Damage:** Medium
  **Voice:** "You mention weighting questions by 'importance.' Who decides the weights? If Verisimilitude is $V = \sum w_i \cdot \text{correct}_i$, and the weights $w_i$ are subjective or community-relative, then two communities can rank theories differently without either being wrong. Doesn't this make progress entirely sociological? How do you adjudicate between a community asking 'Does it save the phenomena?' and one asking 'Is it mechanically intelligible?'"

  **90-Second Reply:**
  "It does make progress partially sociological, but not *arbitrarily* so. Weights are constrained by the success of the interventions those questions license. The 'mechanically intelligible' community might outperform the 'save the phenomena' community in the long run because their questions allow for deeper manipulation of the domain. I'm not saying all question sets are equal; I'm saying their equality isn't determined by a God's-eye view, but by the track record of the research programs they sustain. Adjudication happens through competition, not algorithm."

  **Concede:** Progress is not algorithmic or absolute.
  **Soft Spot:** This sounds very Kuhnian (see Objection 6). If adjudication is just "who wins," you risk losing the normative force of "truth."

  ### 5. The Modeler Objection (The "Monday Morning" Charge)
  **Who:** The Climate Modeler
  **Likelihood:** Medium | **Damage:** Medium (Practical relevance)
  **Voice:** "I appreciate the philosophy, but I need to know if I should use Model A or Model B for the IPCC report. Model A is better at temperature extremes; Model B is better at mean precipitation. You say I need to fix my questions first. But in practice, I don't know the truth, so I don't know which questions are the 'right' ones to weight. Does your theory give me a procedure for choosing, or does it just tell me why my choice is subjective?"

  **90-Second Reply:**
  "It doesn't give you a new algorithm, but it validates your current practice. You are already implicitly fixing $Q$ when you choose a loss function for your model. My theory says: make that implicit $Q$ explicit. Don't ask 'Which model is truer?' Ask 'Which model answers the policy-relevant questions more accurately?' If the report is about flood risk, weight precipitation questions higher. My thesis tells you that you aren't failing to find the 'True' model; you are successfully finding the model that is verisimilitudinous *relative to the stakeholder's needs*. That's not a limitation; it's a license to stop worrying about absolute truth and focus on fitness for purpose."

  **Concede:** No new mathematical tool for model selection.
  **Soft Spot:** If philosophy doesn't change practice, the Modeler may wonder why you spent three years on it. Emphasize the *clarity* it brings to the decision, not the decision itself.

  ### 6. The Historian Objection (The "Old Wine" Charge)
  **Who:** The Kuhnian Historian
  **Likelihood:** Low | **Damage:** Low (Mostly interpretive)
  **Voice:** "This sounds like incommensurability dressed up in notation. Kuhn said paradigms ask different questions and solve different puzzles. You've just added a 'verisimilitude' label to it. If progress is only relative to a question set, and question sets shift with paradigms, don't you still lose the ability to say science *as a whole* progresses? You've just fragmented progress into local pockets."

  **90-Second Reply:**
  "Kuhn saw incommensurability as a barrier to rational comparison; I see it as the *mechanism* of progress. We don't need 'science as a whole' to progress in a straight line. We need research traditions to solve the problems they set for themselves, and sometimes, to expand the question set $Q$ to include new phenomena. Progress is the expansion of $Q$ and the increasing accuracy within it. That's not fragmentation; it's differentiation. We can still say later science is better because it handles a superset of the questions earlier science handled, plus new ones."

  **Concede:** There is no single "arrow of progress" for all of science.
  **Soft Spot:** The "superset" claim is risky. Often new paradigms *forget* old questions (e.g., alchemy). Be careful claiming monotonic growth.

  ### 7. The Deflationist Objection (The "Semantic" Charge)
  **Who:** The Deflationist
  **Likelihood:** Low | **Damage:** Low
  **Voice:** "If the work is being done by question-answering and weighting, what work is the concept of 'truth' doing? Why not just call it 'Question-Relative Accuracy'? Invoking 'truth' seems like a nod to tradition that your own theory renders superfluous."

  **90-Second Reply:**
  "Because the answers are true or false. 'Accuracy' often implies fit between map and territory, which can be continuous. 'Truth' captures the binary nature of the propositions in $Q$. I keep 'truth' to maintain the link to the realist motivation: we care about these questions *because* we think they have factual answers. If I drop 'truth,' I lose the connection to the history of the problem I'm solving. It's a nod to tradition, yes, but a necessary one to show where the solution lands."

  **Concede:** 'Truth' isn't doing heavy metaphysical lifting.
  **Soft Spot:** If 'truth' is just a disquotational device here, the Realists will say you've deflated it too much.

  ---

  ### General Defense Advice
  *   **Watch the Clock:** You have 25 minutes. If the Formalists start a technical debate on scoring rules, offer to take it offline. "That's a formal equivalence I'd love to explore, but I want to make sure the Modeler and Historians get a chance to weigh in on the implications."
  *   **The "Pseudo-Problem" Frame:** Keep returning to this. You aren't failing to solve the absolute problem; you are arguing it was never a coherent problem to begin with.
  *   **Body Language:** When the Realists speak, lean in (show respect for the tradition). When the Modeler speaks, lean forward (show engagement with practice). When the Trivialization objection comes, pause. Take a breath. That's the one that matters.

  **Final Note on the Trivialization/Circularity Worry:**
  Your answer holds *if* you successfully separate "importance" from "truth." If importance is cashed out in terms of "causal depth," you are back to absolute verisimilitude. If it is cashed out in terms of "human interest," you are a pragmatist. **Own the pragmatism.** It is stronger than trying to hide a realist wolf in pragmatist clothing. Say: "Yes, ultimately, truthlikeness serves human inquiry. That is not a bug."
