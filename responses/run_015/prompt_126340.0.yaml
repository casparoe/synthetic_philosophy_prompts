      *   **Core Question:** Why do they get "solved" differently? (Lottery: withhold belief in individual tickets; Preface: allow belief in individual claims + belief in error).
      *   **Specific Hypothesis:** Is it "bottom-up statistical aggregation" vs. "top-down logical consistency"?
      *   **Specific Challenge:** If we applied the Lottery threshold to the Preface, wouldn't the author have to suspend belief in *every* claim?
      *   **Underlying Skepticism:** Is this just philosophers picking the fix that feels less awkward (ad hoc)?

