      *   *Lottery:* 1,000,000 tickets. One wins. For any ticket $t$, $P(t \text{ loses}) = 0.999999$. If belief = high probability, I believe $t$ loses for all $t$. But I also believe "one wins." Contradiction: All lose + One wins = Impossible.
      *   *Preface:* Author writes book with $N$ claims. Evidence supports each claim strongly. But author knows human fallibility. So author believes $p_1, \dots, p_N$ AND believes $\neg(p_1 \land \dots \land p_N)$. Contradiction: $p_1 \land \dots \land p_N \land \neg(p_1 \land \dots \land p_N)$.

