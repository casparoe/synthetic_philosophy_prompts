  5.  **Tackle the "Bottom-Up vs. Top-Down" Hypothesis:**
      *   User asks: "is it bottom-up statistical aggregation in one case and top-down logical consistency in the other?"
      *   Refinement: It's more about *Independent Evidence* vs. *Dependent Statistics*.
      *   Lottery: The justification for "Ticket 1 loses" is *dependent* on the same statistical pool as "Ticket 2 loses." They are mutually exclusive outcomes in a closed system.
      *   Preface: The justification for "Claim 1 is true" is *independent* of "Claim 2 is true." They don't compete for a single "truth slot."

  6.  **Address the "Ad Hoc" Skepticism:**
