      *   *Lottery:* Purely statistical/chance. No specific evidence for ticket #542 losing other than the base rate.
      *   *Preface:* Evidential. Specific evidence supports $p_1$, specific evidence supports $p_2$. The "error" probability comes from meta-cognition (I am human), not the content of $p_1$.

  4.  **Address the "Solution" Difference:**
      *   *Standard Epistemological View (Kyburg, etc.):*
          *   Lottery: We usually say you *don't* know ticket #542 will lose. Why? Because the belief isn't sensitive/safe/connected to the fact. It's just a statistic.
          *   Preface: We usually say you *do* know $p_1$. Why? Because you have specific evidence (research, data). The acknowledgment of fallibility is a separate, higher-order belief.
