answer: |-
  # Joint Statement on the Future-Contingent Problem
  **Parties:** Bivalence Defender (BD) | Open-Future Indeterminist (OFI)
  **Subject:** The truth-status of contingent propositions about the future (e.g., "There will be a sea battle tomorrow").

  ## I. Substantive Agreed Claims
  *Both parties affirm the following six claims. Denial of any claim by either party would dissolve the current debate into a different metaphysical disagreement.*

  1.  **Contingency of the Event:** The sea battle is not logically necessary nor logically impossible. Its occurrence depends on causal chains involving free agents or probabilistic physical processes, not on logical laws alone.
  2.  **Rejection of Logical Fatalism:** Both parties agree that logical principles alone cannot causally necessitate physical events. The truth of a proposition (if it has one) does not exert a causal force that brings about the event.
  3.  **Temporal Asymmetry:** There is a metaphysical asymmetry between the past and the future. Past contingent events are now fixed/settled (no longer open to change). Future contingent events are not fixed in the same way (they remain open to influence).
  4.  **Correspondence Intuition:** Truth is not a primitive property of sentences; it depends on reality. A proposition is true only if reality is such as the proposition says it is. (Parties disagree on *which* reality counts: current reality vs. future reality).
  5.  **Epistemic Limitation:** Neither party claims to *know* today whether the sea battle will occur. The dispute is about the *truth-value*, not our *access* to it.
  6.  **Validity of Classical Logic (Restricted):** Classical logic applies without restriction to propositions about the past and present. The dispute is strictly localized to singular propositions about contingent future events.

  ## II. Precise Disagreements
  *The following table isolates the residual disagreement. Where the dispute is verbal (terminological), it is flagged. Where it is genuine (ontological/semantic), it is flagged.*

  | Issue | Bivalence Defender (BD) Stance | Open-Future Indeterminist (OFI) Stance | Type of Dispute |
  | :--- | :--- | :--- | :--- |
  | **1. Current Truth-Value** | The proposition "There will be a sea battle" is **True** or **False** right now, exclusively. | The proposition "There will be a sea battle" is **neither True nor False** right now. | **Genuine** (Semantic/Metaphysical) |
  | **2. Definition of "Determinate"** | "Determinate" means **having a truth-value**. The future is determinate because the proposition has a value, even if the event is contingent. | "Determinate" means **settled/fixed**. The future is indeterminate because the event is not yet settled by present reality. | **Verbal** (Primary source of talking past each other) |
  | **3. Truthmakers** | There exists a **truthmaker** now (e.g., a tensed fact, a block-universe slice, or God's knowledge) that grounds the truth-value. | There is **no truthmaker** now. No present entity or fact corresponds to the proposition until the event occurs or fails to occur. | **Genuine** (Ontological) |
  | **4. Excluded Middle** | The disjunction ("Battle or No Battle") is **True** because both disjuncts have truth-values (one T, one F). | The disjunction ("Battle or No Battle") may be **True** (as a logical tautology) even if neither disjunct has a truth-value (Supervaluationism), OR the disjunction lacks a truth-value. | **Genuine/Verbal Mix** (Depends on logic system adopted by OFI) |
  | **5. Relation to Time** | Truth is **tenseless** or **eternal**. A proposition's truth does not change, even if the event is in the future. | Truth is **tensed**. A proposition about the future cannot be true until the future becomes present. | **Genuine** (Metaphysical) |

  ## III. Cruxes: Decisive Sub-Questions
  *Settling any of the following four cruxes would force at least one party to abandon their core position. For each, we specify a concrete test case and the advance predictions/concessions of each camp.*

  ### Crux 1: The Inference to Necessity
  *Does the truth of a future proposition entail the necessity of the event?*
  *   **The Argument:** If "There will be a sea battle" is true now, then it cannot fail to happen. If it cannot fail to happen, it is necessary. If it is necessary, contingency is illusory.
  *   **Test Case:** A formal modal logic proof attempting to derive $\Box p$ (Necessarily $p$) from $T(p)$ (It is true now that $p$).
  *   **BD Prediction/Concession:** The derivation fails. Truth does not imply necessity. We distinguish "necessity of the consequence" ($ \Box(p \rightarrow q) $) from "necessity of the consequent" ($ \Box q $). **Concession:** If it is proven that $T(p) \rightarrow \Box p$ is valid in the actual world, BD abandons Bivalence for future contingents.
  *   **OFI Prediction/Concession:** The derivation holds intuitively, which is why Bivalence must be rejected to save contingency. **Concession:** If a coherent model is produced where $T(p)$ is true but $\Box p$ is false (without equivocation), OFI accepts that Bivalence is compatible with contingency.

  ### Crux 2: The Truthmaker Gap
  *Can a proposition be true without a present ontological ground?*
  *   **The Argument:** Truth requires a maker. If the battle hasn't happened, and the present causes don't necessitate it, nothing exists *now* to make the proposition true.
  *   **Test Case:** A world that is genuinely indeterministic (e.g., a quantum event with 50/50 probability). Ask: "What fact *now* makes it true that the decay will happen?"
  *   **BD Prediction/Concession:** The truthmaker is the **future fact itself** (accessed via tenseless reference) or the **total history of the block universe**. **Concession:** If it is proven that truthmakers must be *presently existing* entities, BD abandons Bivalence.
  *   **OFI Prediction/Concession:** There is no fact of the matter. To posit a future fact is to reify non-existence. **Concession:** If a plausible account of a "present truthmaker" is given that does not imply causal determinism (e.g., a primitive tensed property), OFI accepts Bivalence.

  ### Crux 3: The Status of the Disjunction
  *Is "Battle or No Battle" true if neither disjunct is true?*
  *   **The Argument:** Intuitively, "Either it will rain or it won't" is a tautology. But if "It will rain" is neither T nor F, how can the 'OR' statement be True?
  *   **Test Case:** Supervaluationism. Evaluate the disjunction over all possible future branches.
  *   **BD Prediction/Concession:** The disjunction is true *because* one disjunct is determinately true. We reject the idea that a disjunction can be true while both parts are truth-valueless. **Concession:** If logic can be shown to be coherent where $Val(A \lor B) = T$ while $Val(A) = Val(B) = \text{undefined}$, BD accepts this logic.
  *   **OFI Prediction/Concession:** The disjunction is true because it holds on *all* admissible future branches, even if no single branch is actualized yet. **Concession:** If it is shown that retaining Excluded Middle requires retaining Bivalence for disjuncts, OFI drops Excluded Middle for future contingents.

  ### Crux 4: The Metaphysics of Time (Eternalism vs. Dynamic Time)
  *Is the future "already there"?*
  *   **The Argument:** Bivalence is natural if the future exists (Eternalism). Open Future is natural if the future does not exist (Presentism/Growing Block).
  *   **Test Case:** Special Relativity and the Rietdijk-Putnam argument (relativity of simultaneity).
  *   **BD Prediction/Concession:** Eternalism is correct. Future events exist in the block just as past events do; they are just located elsewhere in time. **Concession:** If it is proven that the future is ontologically non-existent (not just epistemically inaccessible), BD abandons Bivalence.
  *   **OFI Prediction/Concession:** Dynamic Time is correct. The future is a realm of potentiality, not actuality. **Concession:** If it is proven that the future is as ontologically robust as the past (e.g., via physics), OFI abandons the Open Future view.
