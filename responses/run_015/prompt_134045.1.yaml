answer: |-
  # OFFICE OF ACTIVE MEMORY: DECISION PROCEDURE 01-N
  **Subject:** Operationalizing the "History for Life" Framework  
  **Authority:** Senior Curatorial-Review Officer  
  **Constraint:** 72-Hour Review Window  
  **Philosophical Basis:** Nietzschean Typology (Monumental, Antiquarian, Critical)

  ---

  ## PART I: THE DECISION PROCEDURE

  This procedure is not an algorithm. It is a structured deliberation tool designed to prevent historical modes from dominating present civic capacity. At every node marked **[JUDGMENT NODE]**, staff must record the specific value assumption being made. Technical data cannot resolve these nodes.

  ### STEP 1: INITIAL CLASSIFICATION TEST
  **Objective:** Identify the primary temporal orientation of the proposal.
  **Action:** Review proposal materials. Assign the dominant mode (check all that apply, but select the *primary* driver).

  *   **[MONUMENTAL]**: Does the proposal seek to inspire present action by highlighting past greatness, heroism, or achievement? (Keywords: *Honor, Legacy, Example, Inspiration*)
  *   **[ANTIQUARIAN]**: Does the proposal seek to preserve the past for its own sake, emphasizing continuity, origin, or fidelity? (Keywords: *Preserve, Archive, Heritage, Fidelity, Record*)
  *   **[CRITICAL]**: Does the proposal seek to judge, condemn, or break from the past to enable a new beginning? (Keywords: *Justice, Reckoning, Disrupt, Truth, Correction*)

  **[HARD CASE WARNING]:** If the proposal claims equal weight for all three (e.g., "A critical archive of monumental figures"), classify based on the *expected public effect*, not the stated intent.
  **[MISFIRE WARNING]:** Digitization projects often claim Antiquarian neutrality but produce Monumental effects (making the past loom larger) or Critical effects (making past sins more visible). Classify based on the *scale* and *accessibility* of the release.

  **→ Proceed to Step 2.**

  ### STEP 2: LIFE-SERVICE CHECK
  **Objective:** Determine if the proposal stimulates or paralyzes present civic capacity.
  **Question:** If this proposal is implemented, does it increase the community's ability to undertake new projects, cooperate, or solve current problems?

  *   **YES (Stimulates):** It provides energy, clarity, or necessary tools for present action.
  *   **NO (Paralyzes):** It induces guilt without resolution, reverence without application, or confusion without direction.
  *   **UNCLEAR:** The effect on present action is contested among staff.

  **[JUDGMENT NODE 1]:** Defining "Present Creative Action."
  *   *Staff Instruction:* Do not define this merely as economic growth or political stability. It includes the capacity for moral repair, artistic creation, or civic dissent. **[RECORD DEFINITION USED]**.
  *   *If NO:* **RECOMMEND REJECT.** (History that kills life must be halted).
  *   *If UNCLEAR:* **ESCALATE TO CITIZEN-VALUES PANEL.** (Do not guess at civic capacity).
  *   *If YES:* **Proceed to Step 3.**

  ### STEP 3: DOMINANCE CHECK (PATHOLOGY SCREEN)
  **Objective:** Detect if the historical mode has exceeded its service role and become pathological.

  *   **If MONUMENTAL:** Is the past figure presented as an idol to be imitated uncritically?
      *   *Risk:* **Narcotic Imitation.** (e.g., Imitating the *power* of a tyrant while ignoring the *cost*).
      *   *Check:* Does the proposal hide the shadows of the "great" figure to maintain the inspiration?
  *   **If ANTIQUARIAN:** Is the accumulation of records/objects preventing new growth?
      *   *Risk:* **Suffocating Accumulation.** (e.g., Hoarding data so nothing can be decided; reverence for tradition blocking necessary reform).
      *   *Check:* Is there a mechanism for de-accessioning or ignoring irrelevant data?
  *   **If CRITICAL:** Does the judgment of the past destroy the soil needed for the future?
      *   *Risk:* **Destructive Negation.** (e.g., Proving the city's founding was illegitimate without offering a path for legitimate coexistence now).
      *   *Check:* Does the proposal offer a "horizon" for living after the critique, or only the critique itself?

  **[JUDGMENT NODE 2]:** Assessing Harm.
  *   *Staff Instruction:* Distinguish between *discomfort* (necessary for growth) and *debilitation* (inability to function). **[RECORD DISTINCTION]**.
  *   *If Pathology Detected:* **Proceed to Step 4 (Conditions).**
  *   *If No Pathology:* **RECOMMEND APPROVE.**

  ### STEP 4: CONDITIONING & REMEDIATION
  **Objective:** Modify the proposal to subordinate history to life.

  *   **For Monumental Pathology:** Require contextual markers that separate *admiration of achievement* from *imitation of character*.
  *   **For Antiquarian Pathology:** Require curation filters. "Complete preservation" is rarely life-serving. Require a "Relevance Index."
  *   **For Critical Pathology:** Require a "Reconstruction Component." If you break a narrative, you must propose how civic cooperation continues afterward.

  **[JUDGMENT NODE 3]:** Feasibility of Conditions.
  *   *Staff Instruction:* Can the condition be physically/technically implemented without negating the proposal's core intent?
  *   *If YES:* **RECOMMEND APPROVE WITH CONDITIONS.**
  *   *If NO:* **ESCALATE TO CITIZEN-VALUES PANEL.** (This indicates a fundamental conflict between historical truth and civic cohesion).

  ### STEP 5: FINAL SIGN-OFF
  **Action:** Attach the recorded Judgment Nodes to the recommendation.
  **Warning:** Do not write the recommendation as if it were a technical finding. Explicitly state: *"This recommendation rests on the value judgment that [X] serves present civic capacity more than [Y]."*

  ---

  ## PART II: LIMITATIONS & MISFIRE WARNINGS

  **1. What This Procedure Cannot Do:**
  *   **Define Flourishing:** It cannot generate a substantive account of human flourishing. It only tests if a proposal *supports* the community's current definition of flourishing.
  *   **Adjudicate Competing Life-Claims:** If Group A says "This statue inspires us" and Group B says "This statue traumatizes us," this procedure cannot mathematically solve the conflict. It flags the conflict for the Values Panel.
  *   **Resolve Truth vs. Solidarity:** It cannot decide if a painful truth is worth the loss of civic solidarity. It only identifies when that trade-off is happening.

  **2. Hard Case Warnings:**
  *   **The "Unstable Hybrid":** When a proposal blends modes (e.g., a Critical Monument), the Dominance Check often fails because the pathologies cancel out or amplify each other unpredictably. **Action:** Escalate.
  *   **The "Digital Antiquarian":** Digitizing *everything* feels neutral but creates a Monumental scale of data that paralyzes researchers. **Action:** Treat "Total Preservation" as a Pathological Antiquarian claim by default.
  *   **The "Staff Disagreement":** If staff cannot agree on Step 2 (Life-Service), do not average the scores. This reveals the framework is smuggling in an unstated theory of flourishing. **Action:** Escalate.

  ---

  ## PART III: WORKED CASE APPLICATIONS

  ### CASE A: The Industrialist Statue
  **Proposal:** Bronze statue of 19th-century industrialist Elias Thorne.
  **Justification:** "Technological innovation that built the city."
  **Complication:** Thorne documented using violent strike-breakers.
  **Ask:** Approval with a critical plaque.

  **Application of Procedure:**
  1.  **Classification:** **MONUMENTAL**. (Primary intent is inspiration/honor).
  2.  **Life-Service Check:** Does honoring Thorne stimulate present capacity?
      *   *Staff View:* Some argue innovation inspires engineers. Others argue it signals that labor suppression is an acceptable cost of progress.
      *   *[JUDGMENT NODE 1]:* We must decide if "innovation" is separable from "labor relations" in our civic ethos.
  3.  **Dominance Check:** **PATHOLOGY DETECTED (Narcotic Imitation).**
      *   A bronze statue inherently elevates the subject above critique. A small plaque is often visually subordinate to the monument. The monumental form risks encouraging imitation of Thorne's *power* while ignoring the *suffering* that funded it. This creates a "narcotic" effect where the public feels pride without moral cost.
  4.  **Conditioning:**
      *   *Proposed Condition:* Reduce scale of statue; integrate the labor narrative into the base structure, not just a plaque.
      *   *Feasibility Check:* The artist refuses structural changes; plaque is the only option.
      *   *[JUDGMENT NODE 3]:* A plaque is insufficient to counter the Monumental dominance.
  5.  **Recommendation:** **REJECT or ESCALATE.**
      *   *Rationale:* Because the medium (monumental bronze) inherently contradicts the necessary condition (critical nuance), the proposal fails the Dominance Check. To approve would be to disguise a value judgment (that innovation outweighs labor rights) as a historical honor.
      *   *Action:* **Escalate to Citizen-Values Panel.** The question is not historical accuracy, but whether the city wishes to monumentalize mixed-legacies in bronze.

  ### CASE B: Total Municipal Digitization (1970–2020)
  **Proposal:** Digitize and preserve *every* municipal record (emails, memos, logs) for permanent public access.
  **Justification:** "Complete antiquarian fidelity. Future generations must decide what matters."

  **Application of Procedure:**
  1.  **Classification:** **ANTIQUARIAN**. (Primary intent is preservation/fidelity).
  2.  **Life-Service Check:** Does total access stimulate present action?
      *   *Analysis:* No. It creates "mnemonic saturation." Researchers and citizens cannot find signal in noise. It burdens current staff with infinite metadata maintenance.
  3.  **Dominance Check:** **PATHOLOGY DETECTED (Suffocating Accumulation).**
      *   Antiquarian history serves life by providing a *ground*, not a *weight*. Preserving trivial data (e.g., cafeteria menus, routine maintenance logs) alongside policy decisions treats all history as equally sacred. This ossifies the archive, making it unusable.
  4.  **Conditioning:**
      *   *Proposed Condition:* Implement a "Relevance Index." Sample routine records; preserve all policy/decision records. Allow for de-accessioning of duplicate/trivial data.
      *   *Feasibility:* Technically feasible.
  5.  **Recommendation:** **APPROVE WITH CONDITIONS.**
      *   *Rationale:* "Complete fidelity" is a pathological antiquarian claim. It disguises a value judgment (that storage is more important than usability) as technical neutrality.
      *   *Condition:* Staff must draft a "Significance Policy" within 6 months to curate the digital heap.
      *   *[STAFF JUDGMENT FLAG]:* Staff must define "Significance." This is not technical; it is curatorial power.

  ### CASE C: The Dispossession Exhibit
  **Proposal:** Museum exhibit documenting city founding via indigenous dispossession.
  **Justification:** "Critical history. We must know the truth to move forward."
  **Internal Instinct:** Approve (Truth is good).
  **Procedure Application:**

  **Application of Procedure:**
  1.  **Classification:** **CRITICAL**. (Primary intent is judgment/correction of narrative).
  2.  **Life-Service Check:** Does this stimulate present capacity?
      *   *Analysis:* It validates marginalized communities (increases their capacity). It may induce guilt or defensiveness in majority communities (potentially decreases their capacity for cooperation).
      *   *[JUDGMENT NODE 1]:* Staff disagree. Some say "Truth is always life-serving." Others say "Truth without a path forward causes paralysis."
  3.  **Dominance Check:** **POTENTIAL PATHOLOGY (Destructive Negation).**
      *   *Nietzschean Warning:* Critical history becomes harmful when it destroys the "horizon" required for a culture to live. If the exhibit proves the city's legal foundation is illegitimate *without* proposing how current residents coexist legitimately, it risks nihilism.
      *   *Risk:* The exhibit undermines the shared civic identity required for current cooperative projects (e.g., housing, infrastructure). If citizens feel the state is fundamentally criminal, cooperation collapses.
  4.  **Conditioning:**
      *   *Proposed Condition:* Add a "Reconstruction Wing." The exhibit must not end with the crime; it must conclude with a curated section on "Pathways to Legitimate Coexistence."
      *   *Feasibility:* The curators argue this dilutes the historical truth. They refuse to add "solutions" to a historical exhibit.
      *   *[JUDGMENT NODE 3]:* **CRITICAL CONFLICT.** The demand for historical purity (Critical Mode) conflicts with the demand for civic cohesion (Life-Service).
  5.  **Recommendation:** **ESCALATE TO CITIZEN-VALUES PANEL (MANDATORY).**
      *   *Rationale:* This is the exact limit of the procedure.
      *   *Why not Approve?* To approve is to decide that *Critical Truth* outweighs *Civic Cohesion*. That is a value judgment, not a curatorial one.
      *   *Why not Reject?* To reject is to decide that *Civic Cohesion* outweighs *Critical Truth*. That is censorship.
      *   *Procedure Output:* The procedure identifies this as a "Life-vs-Truth" conflict. The Senior Officer cannot resolve this alone without disguising a value judgment as a technical finding.
      *   *Instruction to Panel:* "This exhibit serves Critical History but risks undermining the Antiquarian ground of civic identity. The Panel must decide if the pain of this truth is necessary for the city's future life, or if it threatens to paralyze current cooperation."

  ---

  ## OFFICER'S NOTE ON STAFF JUDGMENT
  In all three cases, note that the procedure did not generate the answer. It generated the *site of the conflict*.
  *   In **Case A**, it exposed the conflict between *Inspiration* and *Ethics*.
  *   In **Case B**, it exposed the conflict between *Preservation* and *Usability*.
  *   In **Case C**, it exposed the conflict between *Truth* and *Solidarity*.

  **Final Directive:** Do not use this procedure to hide your authority. Use it to show exactly where your authority is being exercised. If you sign an approval, attach the Judgment Node record. If the public asks why, point to the Node, not the data.
