answer: |-
  These are exceptionally strong questions. They target the specific vulnerabilities of *Identity Theory* GWT (as opposed to correlational GWT) by leveraging Leibniz's Law: if Consciousness = Broadcasting, they must share all properties. Your drafts already block the "empirical open question" defense by demanding theoretical commitments rather than data predictions.

  Below is a polished version of your four questions, optimized for spoken rhythm and logical precision, plus a **fifth question** targeting the *format/modal specificity* problem (a major gap in strong GWT). I have also refined the follow-ups to ensure they corner the guest into a theoretical dilemma rather than an empirical promise.

  ### Moderator's Kit: Challenging Strong GWT

  #### 1. The Subliminal Broadcasting Problem (Block-Style)
  **Question:** "Block-style subliminal priming experiments show stimuli reaching frontal-parietal broadcasting networks yet failing verbal report. Most GWT proponents classify these as 'pre-conscious broadcasts.' If consciousness is *identical* to broadcasting, not just correlated with it, what is your non-circular criterion for distinguishing a globally broadcast representation that is genuinely phenomenally conscious from one that is broadcast but phenomenally blank?"

  *   **Likely Reply:** She will invoke *reportability* or *stability* as the operational marker of the "conscious" broadcast.
  *   **Follow-up:** "If reportability is the marker, imagine an artificial architecture with identical sparse global broadcasting dynamics but no verbal report module. Is it conscious? If yes, you've abandoned reportability as essential. If no, you've defined consciousness by the presence of a specific biological output channel rather than by the broadcast dynamics themselves. Which is it?"

  #### 2. The Temporal Latency Gap
  **Question:** "Neural broadcasting unfolds over roughly 200–300 milliseconds, yet subjective experience seems continuous and immediately present. Some predictive-processing accounts resolve this by treating phenomenal presence as a post-hoc reconstructed narrative. Do you accept that phenomenal continuity is, in part, an illusion of temporal binding, or do you need an additional 'workspace clock' mechanism that assigns a single phenomenal timestamp to the broadcast?"

  *   **Likely Reply:** She will likely accept the "reconstructed narrative" view to avoid positing a homunculus-like clock.
  *   **Follow-up:** "If the experience is a reconstruction, then the phenomenal content is not the broadcast representation itself, but a *model* of that broadcast generated downstream. Doesn't that undermine your claim that consciousness *literally is* the broadcast? It would imply consciousness is the *reading* of the broadcast, not the broadcast itself."

  #### 3. The Split-Brain / Hemisphere Problem
  **Question:** "In split-brain patients, information processed by the right hemisphere often never reaches the left-hemisphere global workspace. You presumably deny phenomenal consciousness to that isolated right-hemisphere processing. But recent discussions of 'fringe awareness' suggest patients show non-verbal behavioral and affective registration without left-hemisphere report. How do you avoid arbitrarily equating consciousness with left-hemisphere linguistic access?"

  *   **Likely Reply:** She will appeal to interhemispheric inhibition preventing workspace entry, arguing that without integration, there is no "global" workspace.
  *   **Follow-up:** "Then specify the falsification condition: What specific empirical result—say, direct right-hemisphere stimulation producing integrated, reportable experience in the absence of left-hemisphere involvement—would force you to concede phenomenal consciousness exists outside the global workspace? If no such result is possible by definition, isn't your theory unfalsifiable?"

  #### 4. The Substrate / AI Problem
  **Question:** "Contemporary small-scale artificial networks can implement working-memory bottlenecks and sparse cross-module broadcasting that structurally mirror global workspace dynamics. If consciousness is substrate-independent and identical to these dynamics, should we assign phenomenal consciousness to any sufficiently connected transformer with a bottleneck? Or do you require a specific biological implementation detail?"

  *   **Likely Reply:** She may hesitate and suggest biological specifics (neurotransmitters, thalamocortical loops) are required.
  *   **Follow-up:** "If you require biological specifics, which ones? Specific neurotransmitter profiles, thalamocortical loop architectures, or metabolic constraints? And do those conditions play any functional role in the broadcasting dynamics? If they are functionally inert, you've reintroduced a non-functional phenomenal property you set out to eliminate. If they are functional, then consciousness isn't the broadcasting, it's the biology *doing* the broadcasting."

  #### 5. The Modal Specificity Problem (New Addition)
  **Question:** "Your theory identifies consciousness with the *act* of broadcasting. But broadcasting is typically modeled as amodal, symbolic, or propositional to allow cross-module communication. Phenomenal experience, however, is modality-specific—it feels like *seeing* red or *hearing* a tone. If consciousness is literally the broadcast, is the broadcast itself visual? If yes, how does a visual signal broadcast to an auditory module? If no, then the consciousness is not the broadcast, but the pre-broadcast sensory format."

  *   **Likely Reply:** She will likely argue that the broadcast *carries* modality-specific tags or that the "reading" module reinstates the modality.
  *   **Follow-up:** "If the broadcast requires a 'reading' module to reinstate the modality to become conscious experience, then the broadcasting itself is not sufficient for consciousness. The consciousness arises at the point of *interpretation*. Why, then, do you locate the consciousness in the workspace rather than in the specialized modules interpreting the data?"

  ***

  ### Tactical Note: Blocking the "Empirical Deflection"
  If she attempts to deflect with *"That's an open empirical question"* or *"We need more data on the neural code,"* interrupt gently but firmly with this frame:

  > "I understand the empirical work is ongoing, but I'm asking about your *ontological commitment*. If Consciousness = Broadcasting is a true identity claim, like Water = H2O, it must hold conceptually, not just statistically. Are you claiming this is a contingent correlation we are still measuring, or a necessary identity that must be true by definition? If it's the latter, these logical gaps must be resolved theoretically, not empirically."
