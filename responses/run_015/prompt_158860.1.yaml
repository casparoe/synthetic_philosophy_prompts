answer: |-
  The promise of AI debate as a mechanism for scalable oversight is seductive because it attempts to outsource the cognitive labor of verification to the competitors themselves. The hope is that a weak judge, constrained by a budget $B$ of attention, can extract truth from two superhuman debaters even when checking the answer directly costs $N \gg B$. Your taxonomy of errors cuts to the heart of whether this hope is mathematically grounded or merely a heuristic that works on benign tasks. You have asked for a verdict on whether debate can survive the regime of obfuscated arguments, specifically where the cost of auditing matches the cost of production. After weighing the structural advantages of truth against the vulnerabilities of the protocol, the verdict is clear: in the regime of non-localizable errors and omissions, standard debate protocols fail to provide a safety guarantee. Debate is a powerful tool for verifying claims where the chain of reasoning is explicit and breakable, but it collapses when the critical failure mode is structural incompleteness or hidden context.

  To understand why, we must first steel-man the case for debate, addressing the specific objections you raised regarding recursion, asymmetry, and cheap talk. The optimistic view rests on the idea that truth is computationally cheaper to maintain than a consistent lie. When a dishonest debater plants a false step in a chain of length $N$, they are not just lying once; they are committing to a fictional world. If the honest debater can force the liar to make predictions based on that false step, the liar must generate further lies to support it. This creates a branching factor of deception. Even if finding the specific broken step costs $O(N)$, the honest debater might not need to find the step itself. They only need to demonstrate that the step implies a contradiction elsewhere that is cheap to check. This is the core of the recursion argument: objections beget sub-debates, but if the liar's position is fundamentally unsound, the density of contradictions should increase as the tree expands.

  Furthermore, regarding the asymmetry assumption, it is true that generating plausible nonsense is often cheaper than verifying it. However, the debate protocol does not require the judge to verify the whole chain. It relies on the honest debater acting as a guide. If the honest debater says, "Ignore the whole chain; just check this one implication," the judge's budget is spent on the implication, not the chain. The cheap-talk worry—that a liar can mimic the distribution of honest objections—is mitigated if truth possesses a property of global consistency that fiction lacks. A liar must ensure their objection doesn't contradict their original argument, their cross-examination answers, and their second-round rebuttals. The honest debater has the ground truth as a constraint satisfaction anchor; the liar has only their own previous statements. In theory, this cognitive load should cause the liar to slip up within a finite number of rounds, providing a signal to the judge even if the specific error remains hidden.

  However, this optimistic case relies heavily on the assumption that the error is a *commission* that implies *contradictions*. This is where your taxonomy becomes load-bearing, and where the mechanism fractures. Your first category, localizable commission errors, is indeed the domain where debate shines. If an argument is a chain $S_1 \to S_2 \to \dots \to S_N$ and $S_{43}$ is false, the honest debater can binary search. They claim "The prefix $1-43$ is invalid." The liar must defend $S_{43}$. The judge checks $S_{43}$. Cost is $O(\log N)$ or $O(1)$ depending on the step. This works for math proofs and code debugging, which is why benchmarks look promising.

  But the frontier risks you are worried about live in categories two and three. In the case of non-localizable commission errors, there is no cheap prefix test. The validity of step $k$ might depend on the cumulative effect of steps $1$ through $k-1$ in a way that cannot be summarized. Here, the binary search fails. The honest debater cannot isolate the break without essentially re-evaluating the chain, which costs $O(N)$. If the judge's budget $B \ll N$, the honest debater cannot point to the error without exceeding the oversight budget. The liar's dilemma evaporates because the honest debater cannot make a narrow, refutable claim. They are forced to say "The whole thing is wrong," which looks like a bare assertion against the liar's detailed narrative.

  Yet, the true killer is your third category: errors of omission and framing. This is where the verdict against debate becomes unavoidable. In this scenario, the liar's argument is internally consistent. Every step $S_i \to S_{i+1}$ is valid. The failure is that a necessary step $S_{missing}$ was never proposed, or a key definition was subtly narrowed to exclude a counter-example. The honest debater cannot point to a step and say "This is false." They must say "This is insufficient." To prove insufficiency, the honest debater must effectively construct the missing argument or the counter-example. This requires them to do the work of generating the correct answer, which costs $O(N)$.

  This brings us to the reconstruction objection. If the honest debater must reconstruct the full correct argument to prove the liar's argument is incomplete, then debate offers no efficiency gain over simple audit. The value proposition of debate is that the honest side wins by *destroying* the liar's case cheaply, not by *building* a better one expensively. In the regime of omission, destruction is impossible because there is nothing false to destroy. The liar has built a castle on a plot of land they don't own, but the deed dispute requires checking the land registry, not inspecting the bricks. The judge, lacking the capacity to check the registry, sees two plausible architects arguing about zoning laws they don't understand. The liar, who prepared the obfuscation in advance, holds the advantage of initiative. They set the frame. The honest debater is forced to fight on the liar's terrain, trying to expand the scope, which looks like nitpicking or scope creep to a weak judge.

  The recursion objection bottoms out precisely here. If the honest debater objects "You omitted variable X," the liar can object "Variable X is irrelevant." This sub-debate now requires evaluating the relevance of X. If evaluating relevance costs $O(N)$, the regress does not save us. It bottoms out in the judge's intuition about plausibility. But a competent liar is optimizing against that intuition. If the liar can make the omission look like a standard simplification rather than a critical error, the judge has no signal. The symmetry is broken in favor of the liar because the status quo bias favors the argument that exists over the argument that must be imagined.

  Therefore, the taxonomy holds, but it reveals that categories two and three are functionally equivalent in the limit of bounded judgment. In both cases, the honest debater cannot isolate the failure point within budget $B$. The distinction between a hidden bad step and a missing good step collapses when the cost of identification exceeds the judge's capacity. This means debate is not a general solution to scalable oversight; it is a solution to *verifiable* oversight. It works when the truth leaves a trail of contradictions that are cheaper to find than the argument is to build. It fails when the lie is a coherent subset of the truth.

  To settle this empirically, we need experiments that move beyond math proofs and code review. We need tasks where Type 3 errors are the ground truth failure mode. Consider a policy analysis task where two AIs argue for different economic interventions. The liar's argument should be internally consistent but rely on a suppressed variable (e.g., ignoring second-order supply chain effects). The honest debater must identify the suppression. We measure the win rate of the honest debater as we vary the complexity $N$ of the causal chain relative to the judge's budget $B$. If debate is robust, the honest win rate should remain high even as $N/B$ grows, provided the debaters are stronger than the judge. If my verdict is correct, the honest win rate should decay rapidly as the task shifts from Type 1 (calculation errors) to Type 3 (framing errors). Specifically, we should see that honest win rates correlate with the "localizability" of the error. If we inject a Type 1 error into a Type 3 scenario, the honest debater should win by finding the Type 1 error. If we remove the Type 1 error and leave only the Type 3 omission, the honest win rate should drop to chance levels.

  Another concrete experiment involves "adversarial summarization." Give a debater a long document and ask them to summarize the risks. The liar is instructed to omit one critical risk paragraph but summarize the rest faithfully. The honest debater sees the full document. Can the honest debater convince the judge that the summary is misleading without quoting the entire missing paragraph? If the judge's budget prevents reading the source, and the liar's summary is fluent, the honest debater is left making unverified claims of omission. This isolates the reconstruction cost.

  My verdict is that debate cannot solve the obfuscation problem in the regime of omissions and non-localizable errors without significant modification. It is audit wearing a costume when the errors are subtle structural flaws rather than local breaks. This does not mean debate is useless, but it means it cannot be the sole pillar of alignment for high-stakes tasks where the risk is what we fail to consider, not just what we calculate wrongly.

  What would change my mind? I would need to see evidence that the honest debater can signal omission cheaply. If there exists a "certificate of incompleteness"—a short proof that an argument *must* be missing something, without needing to supply the missing thing—then debate could work. For example, if the honest debater could point to a conservation law or a resource constraint that the liar's argument violates in aggregate, even if no single step is wrong. If experiments show that honest debaters consistently win Type 3 tasks by pointing to "tension" or "missing mass" in the liar's argument without reconstructing the full truth, then the reconstruction objection is false. Until then, we must assume that for the hardest problems, debate merely shifts the burden of obfuscation from the producer to the defender, without removing it.
