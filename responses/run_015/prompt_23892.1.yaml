answer: |-
  ### I. Naming and Locating the Pattern

  You have identified a structural invariant in the genealogy of authority. It is the argument that *duration* possesses a normative magic capable of transmuting the metal of force into the gold of right. While you rightly note that elements of this appear in Pascal, Hobbes, and Rousseau, the pattern you describe does have a stable home in the literature, though it is often obscured by the technical legal doctrine you mentioned.

  The established name for this principle, in its philosophical rather than strictly juridical sense, is **Prescription**.

  While you dismissed prescription as a "technical rule," in the history of political thought—specifically in the British conservative tradition and the Historical School of Law—Prescription was explicitly elevated from a property rule to a general theory of political legitimacy. Edmund Burke, for instance, argued in *A Vindication of Natural Society* and later in his speeches that "Prescription is the most solid of all titles," applying it not merely to land but to crowns and constitutions. David Hume provides the most rigorous philosophical articulation in his essay *Of the Original Contract*. Hume argues that since almost all governments originate in usurpation, and since we cannot endlessly trace titles back to their violent roots without destabilizing society, "time and custom give authority to all forms of government and all successions of princes."

  However, because the legal term *prescription* (or *usucapio*) carries the baggage of statutes of limitation and adverse possession, and because you requested a term that captures the specific *mechanism* of laundering force through time, I propose we refine the terminology for your essay. The most precise label for the pattern you describe is **The Principle of Normative Prescription**.

  **Definition:**
  *Normative Prescription* is the thesis that the moral and legal status of a political or institutional order is partially constitutive of its duration. It posits that an origin in force (conquest, usurpation, enclosure) is a defeasible defect that is cured by the passage of time, provided that the interval is characterized by settled custom and the absence of successful challenge. The mechanism is not that force *becomes* right, but that the *memory* of force loses its normative traction against the *reality* of settled expectation.

  **Distinctions from Neighboring Concepts:**

  1.  **Vs. "Might Makes Right" (Thrasymachus/Callicles):**
      *   *Might Makes Right* claims force is *intrinsically* justificatory. The strong rule because they are strong, and that is the natural order.
      *   *Normative Prescription* admits force is *intrinsically* unjust or normatively neutral. It requires the intervening variable of *time* to do the justificatory work. Force is the seed, but time is the soil.
  2.  **Vs. Hobbesian Conventionism:**
      *   For Hobbes, justice begins the moment the Sovereign is established. The founding act (the Covenant or the conquest that necessitates it) is not "laundered"; rather, it is rendered *irrelevant* because there is no standard outside the Sovereign by which to judge it.
      *   *Normative Prescription* acknowledges a standard outside the Sovereign (natural justice or prior right) but argues that this standard is *extinguished* by the lapse of time. It admits the gap between *de facto* and *de jure* exists, but claims it closes.
  3.  **Vs. Legal Prescription (Usucapio):**
      *   Legal prescription is a procedural rule with fixed statutory limits (e.g., 12 years of adverse possession).
      *   *Normative Prescription* is a moral principle with fluid temporal boundaries. It relies on "immemorial custom" or "settled expectation" rather than a calendar. It applies to constitutions and sovereignties, not just plots of land.
  4.  **Vs. Weberian Traditional Legitimacy:**
      *   Weber describes *types* of belief. Traditional legitimacy is believing a rule is right "because it has always been."
      *   *Normative Prescription* explains the *transition*. It accounts for how a regime that *was not* believed to be traditional (because its violent founding was remembered) *becomes* traditional. It is the engine that produces Traditional Legitimacy from Conquest.

  **Best Fit and Departure:**
  The concept fits best within the **Humean-Burkean** tradition of conservatism, which prioritizes stability and expectation over abstract origin stories. It departs from them by explicitly foregrounding the *violence* of the origin. Burke tends to mystify the origin; your pattern (and Hume's franker admission) acknowledges the violence but claims it has been metabolized.

  ---

  ### II. Assessment: Genuine Legitimacy or Rhetorical Alchemy?

  Is *Normative Prescription* a genuine source of legitimacy, or is it merely a rhetorical device to mask power? This is the central tension between conservative political philosophy and critical theory.

  **The Case for Genuine Legitimacy (The Humean/Conventionalist View)**
  If the mechanism is genuine, time is doing specific normative work. It is not merely "waiting."
  1.  **The Coordination Argument:** Political order is a solution to a coordination problem. Any stable solution is better than the chaos of contesting the "true" original owner. Time signals that a coordination point has been successfully established. To upend it is to reintroduce the chaos the order was meant to solve.
  2.  **The Reliance Interest:** Over time, subjects build lives, investments, and expectations around the existing order. These "reliance interests" acquire moral weight. To dispossess a current holder because of an ancestor's sin is to punish the innocent present for the guilty past. Time creates new moral facts (lives lived, dependencies formed) that outweigh the old moral facts (the original seizure).
  3.  **Epistemic Humility:** As time passes, evidence of the "just" alternative degrades. We cannot know what would have happened had the conquest not occurred. Therefore, the "what is" becomes the only knowable "what ought to be."

  **The Case for Rhetorical Alchemy (The Critical View)**
  If the mechanism is rhetorical, it functions as ideology.
  1.  **The Amnesia Requirement:** For prescription to work, the memory of the violence must fade. If the memory is kept alive (through oral history, trauma, or record), the "laundering" fails. Thus, the mechanism relies on *forgetting*, which is an epistemic vice, not a virtue.
  2.  **Naturalizing Contingency:** It treats a historical accident (who won the war) as a moral necessity. It converts "is" into "ought" without a bridge, merely by stretching the "is" over a long timeline.
  3.  **Ongoing Violence:** As Walter Benjamin argues in *Critique of Violence*, law-making violence (the founding force) inevitably becomes law-preserving violence (the police/courts). If the order requires constant force to maintain the distribution of power established by the founding, time has not neutralized the force; it has merely institutionalized it.

  **Distinguishing the Two Cases:**
  How do you tell if *Normative Prescription* is operating genuinely or rhetorically in a specific instance? I propose three tests:

  1.  **The Test of Acquiescence:** Did the subjected population eventually participate in the order, or were they permanently excluded? If the "custom" is shared by the conquered and the conqueror (e.g., a merged legal culture), the legitimacy is more likely genuine. If the "custom" is merely the silence of the suppressed, it is rhetorical.
  2.  **The Test of Independent Maintenance:** Can the order sustain itself through administrative and legal norms alone, or does it require the periodic re-activation of the original founding violence? If the regime must constantly invoke the "emergency" of its founding to justify itself, time has not cured the defect.
  3.  **The Counterfactual Harm:** Does reversing the title cause more injustice than maintaining it? If the current distribution supports human flourishing and reversing it causes widespread ruin, the prescription has generated genuine moral weight (Reliance). If the current distribution is merely extractive and reversing it restores agency, the prescription is rhetorical.

  ---

  ### III. Boundaries and Failure Conditions

  Does *Normative Prescription* apply universally, or are there domains where it fails?

  **Domains of Application:**
  1.  **Property Rights:** This is the stronghold of the principle. Here, the mechanism is strongest because property is about *use* and *stability*. The law prefers a known possessor to an unknown rightful owner.
  2.  **Political Authority:** Strong application (Hume's domain). Regimes are judged by their ability to keep the peace over time. However, this is more fragile than property because political authority claims to represent *people*, not just manage *things*.
  3.  **International Practice:** Mixed application. The principle of *uti possidetis* (you keep what you hold) relies on prescription to prevent endless border wars. However, the modern right to *self-determination* acts as a counter-principle, arguing that time cannot legitimize colonial occupation.

  **Failure Conditions: What Breaks the Conversion?**
  There are specific conditions under which the alchemy of time fails, and force remains force, regardless of duration.

  1.  **Jus Cogens (Peremptory Norms):**
      There are certain acts that time cannot cure. If the founding act involved genocide, slavery, or crimes against humanity, *Normative Prescription* hits a hard wall. International law increasingly recognizes that there is no statute of limitations for such crimes. The moral stain is considered permanent; the "seed" was so toxic that no amount of time can make it grow into law.
  2.  **Living Memory and Continuous Protest:**
      Prescription requires a period of *quiet*. If the victims of the original force maintain a continuous chain of protest, claim, and non-acquiescence, the "custom" is never formed. The violence remains "present" in the political consciousness. (e.g., Indigenous land claims where oral history and protest bridge the temporal gap).
  3.  **Radical Discontinuity:**
      If the regime undergoes a revolution or a total constitutional break, the chain of custom is severed. The new order cannot claim the prescription of the old one unless it explicitly incorporates it. If the new order defines itself *against* the old (e.g., post-apartheid South Africa), the prescription of the previous regime is explicitly voided.
  4.  **The "Active Force" Condition:**
      If the distribution of power established by the founding act requires *ongoing* coercive intervention to maintain (beyond normal law enforcement), the conversion has failed. For example, if a property title can only be held because the state actively prevents the original owners from returning by force, time has not legitimized the title; it has merely masked an ongoing occupation.

  **Conclusion for your Essay:**
  The pattern you have identified is the **Principle of Normative Prescription**. It is the central mechanism by which political realism reconciles itself with moral order. It is not merely a rhetorical trick, because it serves the genuine human need for stability and reliance. However, it is not an absolute moral law. It functions as a *presumption* of legitimacy that can be rebutted by evidence of ongoing violence, continuous dissent, or violations of peremptory norms. The "laundering" is real in its effects (it creates stability), but it is contingent in its morality (it depends on what is being stabilized). Time does not erase the blood in the foundation; it merely covers it with the floorboards of habit. Whether those floorboards are legitimate depends on whether anyone is still bleeding underneath them.
