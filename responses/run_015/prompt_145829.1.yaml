      *   Sensory: Tingling, cool, sweet.
      *   Revisionary: Quiet, spacious, unclenching.
      *   The Knot: There is no common denominator sensation. The only thing linking them is that we *want* them. But if we want them, and that makes them good, we are desire theorists, not hedonists. If we insist they share a sensation, we are hallucinating a common quality that isn't there.

