prompt: |-
  Give me an example of a conceptual issue with hedonism's heterogeniety problem that hits revisionary pleasures — the kind of satisfaction you get specifically from dropping a belief you used to hold, not from acquiring the replacment. I want it to show why "they all feel good" is a cop-out, but don't just wheel out Mill's quality/quantity distinction; instead push on whether there's actually a shared phenominal thread across these pleasures and the usual ones (like eating or listening to music). Keep it something you can reason through without googling names — I'm building a taxonomy of edge cases for a semenar and don't need citations, just the conceptual knot.
