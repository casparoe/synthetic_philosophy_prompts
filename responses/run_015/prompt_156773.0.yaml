prompt: |-
  I work as one of three legal officers at the Office of the Claims Commissioner, a body created by statute two years ago to administer a reparations fund for a set of nineteenth- and twentieth-century wrongs — dispossession of land, forced labour on estates, and the seizure of cattle — committed under a colonial administration that no longer exists. The Act gives us almost nothing: a compensable claim is defined as loss traceable to a qualifying wrong, qualifying wrongs are listed by date and category, and everything else is ours to work out. In practice we read about forty claim files a week, each decided on written submissions with no oral hearing, each requiring a reasoned decision within thirty days and reviewable only for legal error. Most claimants are unrepresented, and most of the archives are silent or one-sided, so whatever framework we adopt has to be runnable by a caseworker with two days of training in half a day per file, with a legal officer reviewing only the files it flags — and it has to degrade honestly when the evidence is missing rather than quietly returning a no.

  What I want from you is a decision procedure, and I want it committed rather than survey-style: one ordering of questions, one set of cut-offs, and your reasons for preferring them to the alternatives you can see. My own tentative principle, which I would like you to test, repair, or replace, is that there are two different kinds of claim that we keep running together. A harm claim says: a wrong was done to our predecessors, we are worse off now than we would have been, and that gap is what is owed. An enrichment claim says: someone took something, whoever holds it now is not entitled to hold it, and the thing or its value is what is owed. On my view harm claims have to be traced through time and get weaker as the chain lengthens and other causes pile up, and they run into the difficulty that in most of our docket the claimants would not exist at all had the wrong not been done — so the comparison with how they would have fared has to be made at the level of the group rather than of any individual, and I am not sure what licenses that switch or what it costs. Enrichment claims, I think, do not fade with time, but they stop at the value of what is still held and they can be defeated by a good-faith transfer, by the holder having spent the proceeds on something else, or by the holder now being a different kind of institution from the one that took it. Please give me the questions in the order I should ask them; what counts as a sufficient answer to each, stated as an evidence threshold a caseworker can actually check; the points at which the procedure returns a clear no; the points at which it must hand the file to the Commissioner because the question is one of values rather than fact, with a note of what the Commissioner is being asked to decide; and instructions for the common case in which the archive neither supports nor refutes the claim. Two defences I want you to rule on explicitly because they arise constantly: the anyway argument, that the land or the labour would have been taken later under a different and lawful authority, so the wrong made no difference to where we are now; and the mixed-claimant case, where the claimant group also inherited part of the benefit, or where the present holder's assets are now largely managed for the benefit of that same group.

  Then run the procedure on three files. First: a community claims land taken in 1891 that is now a national park; its present members descend both from the dispossessed households and from labourers settled on the land afterwards; the state defends on the anyway ground, pointing to a 1912 statute under which it says the land would in any event have been compulsorily acquired, and also on the ground that the successor state inherits the position of everyone, perpetrators included. Second: a claim against a bank that is the corporate successor of a financing house which held mortgages over estates worked by forced labour and was repaid out of their profits; the house was dissolved in a 1971 merger that was at arm's length and for value, and a substantial share of the bank's present shareholders are pension funds whose members are drawn from the claimant community. Third, and this is the file I expect the procedure to handle badly and the reason I am writing: a religious order ran a mission station worked by forced labour until 1934; the order still exists but is insolvent, and what remains of it is a hospital and a school that serve the descendants of the very people it forced to work; tracing to the present holding succeeds cleanly, while the harm claim fails on the point about who would have existed. If your procedure says the right answer is to charge the hospital, say so plainly and say what it recommends instead; if it says something else, say why. Finally, tell me what the procedure cannot do. Our fund is fixed and the eligible claims already exceed it, so there is a rationing step at the end that I do not think any of this gives me, and I want to know whether that is a genuinely separate question or whether the framework has been quietly answering it all along. I would like the procedure you would actually defend, including the step you are least confident about and the case in which you would personally overrule it.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Legal Officer at the Office of the Claims Commissioner (OCC).
      *   **Context:** Statutory body (2 years old), reparations fund for colonial wrongs (land dispossession, forced labour, cattle seizure).
      *   **Constraints:**
          *   Act is vague (defines "qualifying wrong" and "loss traceable," rest is up to OCC).
          *   Volume: 40 files/week.
          *   Process: Written submissions only, no oral hearing.
          *   Timeline: Reasoned decision within 30 days.
          *   Review: Only for legal error.
          *   Staffing: Caseworkers (2 days training, 0.5 day/file), Legal Officers review flagged files.
          *   Evidence: Archives silent/one-sided, claimants mostly unrepresented.
          *   Requirement: Must degrade honestly (no quiet "no"s when evidence is missing).
      *   **Task:** Create a *committed* decision procedure (one ordering, one set of cut-offs, reasons for preference).
      *   **User's Tentative Principle:** Distinguish between *Harm Claims* (counterfactual loss, fades with time/causation issues, group-level comparison needed) and *Enrichment Claims* (value taken, doesn't fade, stops at current holding, defeasible by good faith/change of position).
      *   **Specific Requirements:**
          *   Ordered questions.
          *   Evidence thresholds (checkable by caseworker).
          *   Clear "No" points.
          *   Referral points to Commissioner (value judgments).
          *   Instructions for silent archives.
          *   Explicit rulings on two defenses: "Anyway Argument" (inevitability) and "Mixed-Claimant Case" (benefit inheritance/shared assets).
          *   **Test Cases:**
              1.  Land/National Park (1891 taking, mixed descent, state defense: anyway + successor state).
              2.  Bank/Forced Labour Mortgages (corporate successor, arm's length merger, claimant community holds shares via pensions).
              3.  Religious Order/Insolvent (forced labour until 1934, order exists but insolvent, assets = hospital/school serving descendants). *Crucial Test:* If procedure says charge the hospital, admit it and propose alternative.
          *   **Limitations:** What the procedure *cannot* do (specifically regarding rationing/fixed fund).
          *   **Self-Reflection:** Least confident step, case where I would overrule it.

  2.  **Analyze the User's Tentative Principle (Harm vs. Enrichment):**

      *   *Harm Claims:* The user identifies the "non-identity problem" (claimants wouldn't exist but for the wrong). This is a philosophical killer for individual counterfactuals. The user suggests switching to *group-level* comparison. This is legally risky but practically necessary for reparations.
      *   *Enrichment Claims:* The user suggests these don't fade but stop at current holding. This aligns with unjust enrichment law (tracing, change of position).
      *   *Critique:* Running them together is confusing. A unified procedure needs to prioritize one or treat them as alternative paths to the same payout. Given the "archives are silent" constraint, Enrichment is easier to prove (did they take X? Is X still there?) than Harm (what would have happened?). However, Enrichment fails when the asset is gone (e.g., consumed labour). Harm is needed for labour.
      *   *Decision:* I will structure the procedure to *prioritize Enrichment* where assets exist (clearer tracing), and fall back to *Harm* where assets are consumed (labour), but modify the Harm test to avoid the non-identity trap by using a "Standard of Living" proxy rather than individual existence.

  3.  **Drafting the Procedure (The "Committed" Aspect):**

      *   *Goal:* Simplicity for caseworkers, robustness for legal review.
      *   *Structure:* Gatekeeping -> Classification -> Quantification -> Defenses -> Referral.
      *   *Evidence Threshold:* "Preponderance of available evidence" modified for archival silence (adverse inference).
      *   *The "Anyway" Defense:* Must be rejected as a matter of policy. Colonial statutes validating theft are not "lawful authority" in the moral/statutory sense of the Act.
      *   *The "Mixed-Claimant" Defense:* Must be treated as a mitigation factor, not a bar. Benefit received reduces the *net* claim, doesn't extinguish the *right*.
      *   *Silent Archives:* If the State/Holder has the records and doesn't produce them, assume the claimant's prima facie case is true. (Burden shift).

  4.  **Developing the Test Cases:**

      *   *Case 1 (Land/Park):* Enrichment path. Land still exists (as park). State holds it. Defense: "Anyway" (reject). Defense: "Successor State" (accept liability, State is the holder). *Outcome:* Pay.
      *   *Case 2 (Bank):* Enrichment path. Profits traced to bank capital. Merger was arm's length (defeats direct enrichment?). *Correction:* If the merger was for value, the *value* was paid to the old shareholders. The new bank holds the assets free of the taint *unless* the value was undervalued. However, the *profits* derived from forced labour are the enrichment. If the bank holds capital built on those profits, it's enriched. The pension fund argument is a "Mixed-Claimant" defense. *Outcome:* Pay, but reduce for benefit received via pensions.
      *   *Case 3 (Religious Order):* This is the hard one. Enrichment exists (hospital/school assets built on labour). Harm fails (non-identity). Order is insolvent. If we charge the hospital, we harm the beneficiaries (descendants). *Procedure's verdict:* Strictly speaking, Enrichment says "give back the value." But if the value *is* the benefit to the victims, clawing it back is absurd. *Refinement:* The procedure must recognize "Beneficial Use" as a form of Restitution. If the asset serves the victims, the enrichment is being "spent" on them. *Outcome:* No cash payout, but mandatory governance change/trust restructuring.

  5.  **Addressing the Rationing Question:**

      *   The fund is fixed. Claims > Fund.
      *   Does the procedure ration? No. It determines *liability* and *quantum*. Rationing is a *distribution* problem (pro-rating).
      *   *Honesty:* The procedure cannot solve the insolvency of the fund. It must state the *full* entitlement, then the Commissioner applies the pro-rata reduction.

  6.  **Refining the "Harm" Calculation (The Non-Identity Problem):**

      *   User is right: Individual counterfactuals fail.
      *   Solution: "Group Baseline." Compare the claimant community's current socioeconomic indicators against a comparable non-affected control group. This bypasses "would *you* exist" to "is *your group* disadvantaged."
      *   *Caseworker Check:* Can a caseworker do this? No. That's expert evidence.
      *   *Adjustment:* For caseworkers, use a "Standard Allowance" based on the *type* of wrong (e.g., 1 hectare of land = X value; 1 year of labour = Y value). This turns Harm into a tariff system, which is administrable.

  7.  **Finalizing the Procedure Steps:**

      1.  **Threshold:** Qualifying Wrong (Date/Category).
      2.  **Standing:** Group membership (descent/community).
      3.  **Classification:** Asset Still Exists (Enrichment) vs. Asset Consumed (Harm).
      4.  **Tracing/Quantification:**
          *   Enrichment: Current Value of Asset.
          *   Harm: Statutory Tariff based on wrong type.
      5.  **Defenses:**
          *   Anyway: Rejected (Legal Officer decision).
          *   Good Faith Purchase: Accepted (if pre-1950).
          *   Mixed Benefit: Deducted (percentage).
      6.  **Archive Silence:** Adverse inference against the State/Holder.
      7.  **Referral:** Insolvency, Moral Hazard, Policy shifts.

  8.  **Addressing the Specific "Hard Case" (Religious Order):**

      *   If the procedure says "Charge the Hospital," it fails the moral test.
      *   I need to build a "Beneficial Use" exemption into the Enrichment track. If the enriched asset is currently being used *for* the claimant group, the enrichment is considered "discharged" via service, not cash.
      *   *Recommendation:* Convert the debt into a governance right (seats on the board) rather than cash.

  9.  **Self-Correction/Review against Constraints:**

      *   *Caseworker capability:* Can they check pension fund demographics? Maybe not. That needs referral.
      *   *Time:* 0.5 day/file. The procedure must be a checklist.
      *   *Tone:* Committed, legalistic but practical, acknowledging the moral weight.

  10. **Drafting the Response:** (Iterative refinement during drafting to ensure all constraints are met, especially the "committed" nature and the specific handling of the three files). *Self-Correction on Case 2:* The bank merger defense. If the merger was arm's length, the *new* bank didn't necessarily receive the *tainted* profits directly, it bought the book. But if the book *contained* the tainted capital, the entity holds it. I will treat the corporate successor as liable but apply the Mixed-Claimant defense strongly.

      *   *Rationing:* Be clear. Liability $\neq$ Payment. The procedure establishes the debt. The Fund Administrator pays the dividend.

      *   *Least Confident Step:* The "Group Baseline" for Harm claims. It's sociologically fraught.
      *   *Overrule Case:* Where strict application causes manifest injustice (like the Hospital case).

  11. **Final Polish:** Ensure the distinction between Harm and Enrichment is clear but integrated into a single flow. Ensure the "Anyway" defense is killed decisively (as it undermines the Act's purpose). Ensure the "Silent Archive" rule is pro-claimant (burden shift).

  *(Self-Correction during drafting the "Religious Order" section)*: The prompt asks: "If your procedure says the right answer is to charge the hospital, say so plainly and say what it recommends instead." I must be careful not to waffle. If the logic leads to charging the hospital, I must admit it, then offer the fix. My proposed fix is the "Beneficial Use Offset."

  *(Refining the "Anyway" Defense)*: The prompt asks me to rule on it. I will rule that it is inadmissible. The Act compensates for *wrongful* acts. A hypothetical *lawful* act is irrelevant to the damage caused by the *wrongful* one.

  *(Refining the "Mixed-Claimant")*: It's a set-off, not a bar.

  Let's assemble the procedure.

  *Structure:*
  1. The Principle (Refined).
  2. The Decision Procedure (Step-by-Step).
  3. The Defenses (Explicit Rulings).
  4. The Archive Rule.
  5. Application to Three Files.
  6. Limitations (Rationing).
  7. Confidence & Overrule.

