  *Wait, another constraint:* "Points at which it must hand the file to the Commissioner." I need to flag these clearly.

  *Wait, "Instructions for the common case in which the archive neither supports nor refutes the claim."* I need a specific evidentiary rule for this.

  Okay, ready to write.
answer: |-
  ### The Principle: Traced Enrichment Primary, Tariffed Harm Secondary

  Your distinction between Harm and Enrichment is sound, but running them in parallel creates the administrative bottleneck you fear. A caseworker cannot run two complex causal analyses in half a day.

  **My Commitment:** I propose a **hierarchical procedure**. We prioritize **Enrichment** (did they take something that still exists?) because it is fact-based, archival, and avoids the counterfactual trap. We only resort to **Harm** (what was lost?) when the asset is consumed (e.g., labour). However, to solve the "non-identity" problem you identified, Harm claims will not use individual counterfactuals. They will use a **Statutory Tariff** based on the *type* of wrong, presuming a standard loss to the group. This converts the philosophical problem into an administrative one.

  **Why this ordering?** Enrichment is binary (asset exists/does not exist). Harm is spectral (how much worse off?). In a high-volume, low-evidence environment, binary questions degrade more honestly. If the asset is gone, the enrichment claim dies, and we fall back to the tariff. This prevents the "quiet no" you fear; the file moves to the Harm track rather than closing.

  ---

  ### The Decision Procedure

  **Instruction to Caseworker:** Complete this checklist in order. If any step returns a "No," stop and draft decision. If "Refer," send to Legal Officer/Commissioner. If "Silent," apply the Archive Rule.

  #### Step 1: Threshold Eligibility
  *   **Question:** Does the claim fall within the dates and categories listed in the Act (dispossession, forced labour, cattle seizure)?
  *   **Evidence:** Claimant submission + Date of event.
  *   **Cut-off:** If outside dates/categories → **Clear No**.
  *   **Silence:** If date is approximate but falls within range → **Proceed**.

  #### Step 2: Standing (Group Membership)
  *   **Question:** Is the claimant a recognized member of the affected community (by descent or membership)?
  *   **Evidence:** Genealogy, community register, or sworn affidavit.
  *   **Cut-off:** No link to community → **Clear No**.
  *   **Silence:** If archives are silent on membership → **Presume Valid** (burden on State to disprove).

  #### Step 3: Classification (Enrichment vs. Harm)
  *   **Question:** Does the specific subject matter of the wrong still exist as an identifiable asset held by a legal entity?
  *   **Evidence:** Land titles, corporate registry, inventory of seized cattle (if herd exists).
  *   **Decision:**
      *   Yes (Land is a park; Bank holds capital) → **Go to Step 4 (Enrichment)**.
      *   No (Labour was consumed; Cattle slaughtered) → **Go to Step 5 (Harm)**.

  #### Step 4: Enrichment Track (Tracing & Holding)
  *   **Question 4a:** Can the current asset be traced to the wrongful taking?
      *   **Threshold:** "Reasonable Connection." (e.g., Land title shows 1891 transfer from Community to State; Bank records show capital absorption of the financing house).
      *   **Silence:** If the Holder controls the records and they are missing → **Presume Connection**.
  *   **Question 4b:** Is the current Holder the same entity or a direct successor?
      *   **Threshold:** Corporate merger records or State succession doctrine.
      *   **Defense (Good Faith Purchase):** If the asset was sold to a third party *before 1950* for value → **Clear No**. (Post-1950 transfers are presumed to carry the taint).
      *   **Defense (Mixed-Claimant):** If the Holder's assets are currently managed for the benefit of the claimant group (e.g., pension funds, community trust) → **Refer to Commissioner** for set-off calculation.
  *   **Quantification:** Current Market Value of the Asset.
  *   **Outcome:** Recommend payout of Current Value, subject to Step 6.

  #### Step 5: Harm Track (Tariffed Loss)
  *   **Question:** What is the category of loss?
  *   **Evidence:** Type of wrong (Labour, Land, Cattle).
  *   **Cut-off:** Do not attempt individual counterfactuals ("Would I be richer?").
  *   **Quantification:** Apply the **OCC Tariff**.
      *   Forced Labour: [X] Currency Units per year per worker.
      *   Land Dispossession: [Y] Currency Units per hectare (based on 1890 value + inflation).
      *   Cattle Seizure: [Z] Currency Units per head.
  *   **Defense (Anyway):** **Inadmissible.** (See Rulings below).
  *   **Outcome:** Recommend payout of Tariff Amount, subject to Step 6.

  #### Step 6: Defenses & Mitigation
  *   **Question:** Are there applicable defenses?
  *   **Ruling on "Anyway":** **Reject.** The Act compensates for *wrongful* acts. A hypothetical lawful act is irrelevant to the damage caused by the actual wrongful act. (Legal Officer to confirm).
  *   **Ruling on "Mixed-Claimant":** **Partial Set-Off.** If the claimant group benefits from the Holder's assets (e.g., via state services or shareholding), reduce the payout by the estimated proportional benefit.
      *   **Threshold:** If benefit is >50% of claim value → **Refer to Commissioner**.
      *   **Threshold:** If benefit is <50% → Caseworker calculates net.

  #### Step 7: Insolvency & Viability Check
  *   **Question:** Will payment destroy the Holder's ability to function or harm the claimants?
  *   **Evidence:** Financial statements of the Holder.
  *   **Referral Point:** If Holder is a charity/hospital serving the claimants → **Refer to Commissioner**. (Do not recommend cash payout that closes the hospital).

  ---

  ### Explicit Rulings on Defenses

  **1. The "Anyway" Argument (Inevitability)**
  *   **Ruling:** **Inadmissible as a matter of law.**
  *   **Reason:** The Act creates a right to redress for *qualifying wrongs*. The causal chain required is between the *wrong* and the *loss*. Speculation that a *different, lawful* authority might have caused a similar loss later is a counterfactual upon a counterfactual. It asks us to judge the colonial administration against a hypothetical benevolent colonial administration. The Act judges them against the law. To admit this defense is to validate the 1912 statute that authorized the theft, which contradicts the remedial purpose of the Act.
  *   **Instruction:** Caseworkers must strike this argument from the State's submission. Legal Officers will review any decision where this defense was allowed to influence the quantum.

  **2. The Mixed-Claimant Case**
  *   **Ruling:** **Mitigation, not Extinguishment.**
  *   **Reason:** Unjust enrichment is about *net* benefit. If the claimant group holds shares in the bank, or if the State provides services funded by the land, they have received *some* restitution already. However, receiving a dividend on stolen capital is not the same as owning the capital.
  *   **Instruction:** Calculate the value of the benefit received (e.g., annual pension dividend). Deduct this from the claim. If the benefit is structural (e.g., the hospital serves them), do not deduct cash; refer for governance restructuring.

  ---

  ### The Archive Rule (Silent Evidence)

  **Instruction:** In 80% of files, the archive will be silent.
  *   **Rule:** **Adverse Inference against the Record-Holder.**
  *   **Application:** If the Claimant provides a prima facie account (sworn affidavit + plausible detail) and the State/Holder (who possessed the administrative machinery) produces no records to refute it, the Caseworker must **accept the Claimant's account as true**.
  *   **Reason:** The colonial administration created the silence. We cannot penalize the victim for the perpetrator's poor bookkeeping. This prevents the "quiet no."
  *   **Limit:** This applies to *facts* (was land taken?), not *law* (was it lawful?).

  ---

  ### Application to the Three Files

  #### File 1: The National Park (Land Taken 1891)
  *   **Step 1 & 2:** Eligible. Community descent established.
  *   **Step 3:** Asset Exists? Yes (Land is now a Park).
  *   **Step 4 (Enrichment):**
      *   Tracing: Title shows 1891 transfer. **Presumed Valid.**
      *   Holder: The State. (Successor State defense is irrelevant; the State *is* the Holder).
      *   Defense "Anyway": **Struck.**
      *   Defense "Mixed-Claimant": The Park serves the public, including the community. This is a general public good, not a specific set-off. **No deduction.**
  *   **Step 7:** Will paying for the park bankrupt the State? No. Will it close the park? The remedy is not necessarily eviction.
  *   **Recommendation:** **Pay.**
  *   **Quantum:** Current Market Value of the Land (not 1890 value).
  *   **Referral:** None. This is a standard Enrichment claim. The State holds the asset; the State pays the value.

  #### File 2: The Bank (Forced Labour Mortgages)
  *   **Step 1 & 2:** Eligible.
  *   **Step 3:** Asset Exists? Yes (Bank Capital).
  *   **Step 4 (Enrichment):**
      *   Tracing: Profits from mortgages absorbed into bank capital. **Reasonable Connection.**
      *   Holder: Corporate Successor. Merger was 1971 (post-1950). **Liable.**
      *   Defense "Mixed-Claimant": Pension funds hold shares.
  *   **Step 6 (Mitigation):**
      *   Claimants benefit via pensions.
      *   **Calculation:** Estimate the portion of the bank's value attributable to the claimant community's pension holdings.
  *   **Recommendation:** **Pay Net Value.**
  *   **Referral:** **Legal Officer.** The calculation of the pension offset is complex. The Legal Officer must determine the percentage of the bank's equity effectively "owned" by the claimants to avoid paying them to pay themselves.
  *   **Note:** Do not reject the claim. The bank holds the tainted capital; the community holds a slice of the bank. They are owed the *majority* share of the value they do not already own.

  #### File 3: The Religious Order (Insolvent, Hospital/School)
  *   **Step 1 & 2:** Eligible.
  *   **Step 3:** Asset Exists? Yes (Hospital/School buildings & endowment).
  *   **Step 4 (Enrichment):**
      *   Tracing: Buildings built by forced labour. **Clean Trace.**
      *   Holder: The Order.
  *   **Step 5 (Harm):** Fails (Non-identity issue), but Enrichment succeeds.
  *   **Step 7 (Viability):**
      *   **Critical Check:** The Order is insolvent. The assets *are* the hospital.
      *   **Conflict:** Charging the hospital destroys the benefit to the descendants.
  *   **Procedure's Verdict:** Strictly applied, the Enrichment Track says "Disgorge the Value." This would mean selling the hospital to pay the claimants.
  *   **My Recommendation:** **Refer to Commissioner.**
  *   **Reason:** This is the case where the procedure must yield. A cash award against an insolvent charity serving the victims is a moral absurdity. It converts reparations into self-harm.
  *   **Alternative:** The Commissioner should order **Restitution in Kind (Governance).** The debt is acknowledged, but instead of cash, the Claimant Community receives majority voting rights on the Hospital Board. The "enrichment" is transferred from the Order's control to the Community's control.
  *   **Why:** This satisfies the Enrichment principle (the community now holds the asset) without destroying the asset.

  ---

  ### What the Procedure Cannot Do (Rationing)

  You asked if the rationing step is separate. **It is.**

  This procedure calculates **Liability** (what is owed). It does not calculate **Distribution** (what can be paid).
  *   **The Limit:** If the Fund holds $100M and valid claims total $500M, this procedure will still recommend the full $500M in individual decisions.
  *   **The Risk:** If you bake rationing into the procedure (e.g., "reduce all awards by 80%"), you violate the Act's definition of "loss traceable." You are no longer compensating loss; you are distributing a bounty.
  *   **The Solution:** The procedure must state the *full entitlement*. The Office of the Claims Commissioner must then issue a **General Directive** applying a pro-rata reduction to all *approved* claims simultaneously.
  *   **Why Separate?** A caseworker cannot know the total fund exposure when deciding File #142. Rationing is a macro-fiscal decision, not a micro-legal one. Keeping them separate protects the Legal Officers from review on "legal error" regarding the fund's solvency.

  ---

  ### Confidence & Overrule

  **The Step I Am Least Confident In:**
  **Step 5 (The Tariff).**
  Replacing individual counterfactuals with a statutory tariff is administratively necessary but philosophically crude. It assumes all hectares of land or all years of labour had equal value to the victim. It risks under-compensating the severe cases and over-compensating the minor ones. It is a "rough justice" mechanism.

  **The Case Where I Would Overrule My Own Procedure:**
  **File 3 (The Religious Order).**
  If the Procedure (Step 4) demanded a cash payout that forced the hospital to close, I would overrule it.
  *   **Why:** The purpose of reparations is to repair the group. Destroying a vital institution serving that group to pay a symbolic debt violates the telos of the Act.
  *   **The Overrule:** I would invoke the Commissioner's equitable jurisdiction to substitute **Control for Cash**. The procedure treats assets as fungible value; in this specific case, the asset is *relational*. The remedy must match the nature of the holding.

  **Final Note on the "Anyway" Defense:**
  I am most confident in rejecting this. If we allow the State to argue "we would have stolen it legally later," we render the Act a nullity. The Act exists precisely because the "lawful authority" of the time was itself the instrument of the wrong. We cannot use the colonizer's law to limit the reparations for colonization.
