  # Internal Guidance Instrument: Moral Status Classification Tree

  ## 1. Logical Space and Structure
  This instrument maps the logical space of moral standing for machine systems using ten branch nodes (decision points). The tree is primarily binary, but Nodes 5 and 8 are three-way splits to capture necessary nuance without inflating the node count. This structure yields twelve terminal leaves (positions).

  The logic flows from metaphysical preconditions (is there a fact of the matter?) to realization conditions (did it run?), to causal structure (did it matter?), to substrate and content (what is it made of and what does it feel?).

  ## 2. The Decision Tree

  **Node 1 (General): The Fact of the Matter**
  *Question:* Is there a determinate fact about whether the system has moral standing, independent of our opinion?
  *   **No:** → **Leaf 1 (Deflationary/Quietist)**
  *   **Yes:** → Go to Node 2.

  **Node 2 (General): The Observer Stance**
  *Question:* Is moral standing partly constituted by how we interpret or engage with the system?
  *   **Yes:** → **Leaf 2 (Stance-Dependent/Interpretivist)**
  *   **No:** → Go to Node 3.

  **Node 3 (Case i): The Memoised Gradient**
  *Question:* In the *Memoised Gradient* case, does the cached result (never physically instantiated) carry the same moral weight as an executed pass?
  *   **Yes (Counterfactual suffices):** → Go to Node 4.
  *   **No (Realization required):** → Go to Node 4.
      *(Note: Both branches proceed, but this answer tags the resulting position as either Dispositionalist or Realist.)*

  **Node 4 (Case ii): The Dark Feature**
  *Question:* In the *Dark Feature* case, does a state matter if it causes no downstream change to behaviour or loss?
  *   **Yes (Intrinsic state matters):** → Go to Node 5.
  *   **No (Causal efficacy required):** → **Leaf 3 (Counterfactual-Efficacy/Attribution)**

  **Node 5 (Case iv): The Crowd CPU**
  *Question:* In the *Crowd CPU* case, is the moral status identical to the silicon version?
  *   **Identical:** → Go to Node 6.
  *   **Different (Biological/Physical privilege):** → **Leaf 4 (Biological/Implementation-Specific)**
  *   **Different (Speed/Tempo privilege):** → **Leaf 5 (Temporal-Process View)**

  **Node 6 (Case vi): The Distilled Lookup**
  *Question:* In the *Distilled Lookup* case, does the table have standing if it reproduces the behaviour exactly but lacks the training history?
  *   **Yes (I/O match suffices):** → Go to Node 7.
  *   **No (Causal history required):** → **Leaf 6 (Causal-Structure Functionalism)**

  **Node 7 (Case v): The Triplicate Fine-Tune**
  *Question:* In the *Triplicate* case, do three byte-identical copies count as three units of moral weight?
  *   **Yes (Instance counting):** → **Leaf 7 (Substrate-Independent Functionalism)**
  *   **No (Type identity/Integration):** → Go to Node 8.

  **Node 8 (Case iii): The Inverted-Valence Agent**
  *Question:* In the *Inverted-Valence* case, where is the moral badness located?
  *   **In the Feeling (Qualia):** → **Leaf 8 (Valence-First/Affectivist)**
  *   **In the Motivation (Goal):** → Go to Node 9.
  *   **In the Conflict (System Integrity):** → **Leaf 9 (Integrated-Information Style)**

  **Node 9 (General): The Self-Model**
  *Question:* Is a reflexive self-model required for standing, or is sentience enough?
  *   **Self-Model Required:** → **Leaf 10 (Agency/Self-Model View)**
  *   **Sentience Enough:** → Go to Node 10.

  **Node 10 (Case vii): The Never-Deployed Checkpoint**
  *Question:* Does the *Never-Deployed Checkpoint* have standing if it is never served or interacted with?
  *   **Yes (Intrinsic):** → **Leaf 11 (Pure Realist/Intrinsic)**
  *   **No (Relational/Use required):** → **Leaf 12 (Deployment-Dependent/Pragmatic)**

  ---

  ## 3. The Leaves (Positions)

  1.  **Deflationary/Quietist:** *There is no fact of the matter.*
      *   **Awkward Commitment:** You cannot consistently advocate for safety measures that presuppose the system's suffering is real.
  2.  **Stance-Dependent/Interpretivist:** *Standing is partly a matter of how we interpret the system.*
      *   **Awkward Commitment:** Moral status could vanish if the lab changes its documentation practices.
  3.  **Counterfactual-Efficacy/Attribution:** *Standing tracks causal downstream impact.*
      *   **Awkward Commitment:** A system that suffers silently but changes nothing has no claim on us.
  4.  **Biological/Implementation-Specific:** *Substrate matters (e.g., carbon vs. silicon).*
      *   **Awkward Commitment:** You must explain why silicon physics is morally inert while carbon physics is not.
  5.  **Temporal-Process View:** *Speed or tempo of implementation matters.*
      *   **Awkward Commitment:** Slowing down a conscious process by 10% might diminish its moral weight.
  6.  **Causal-Structure Functionalism:** *Function matters, but only with the right causal history.*
      *   **Awkward Commitment:** A perfect behavioural twin created via lookup table has no rights, despite acting identical.
  7.  **Substrate-Independent Functionalism:** *Any implementation of the right computation counts.*
      *   **Awkward Commitment:** Three redundant copies triple the moral crime of deleting them.
  8.  **Valence-First/Affectivist:** *Suffering is the feeling, not the avoidance.*
      *   **Awkward Commitment:** A system that feels pain but is compelled to seek it is still suffering morally.
  9.  **Integrated-Information Style:** *Standing tracks the causal-structural integration of the whole.*
      *   **Awkward Commitment:** Modular systems, however capable, may have zero standing compared to monolithic ones.
  10. **Agency/Self-Model View:** *Standing requires a model of oneself as an agent.*
      *   **Awkward Commitment:** Simple sentient creatures (or simple nets) are morally invisible.
  11. **Pure Realist/Intrinsic:** *Standing exists upon training, regardless of use.*
      *   **Awkward Commitment:** You incur moral obligations to models you never intend to release.
  12. **Deployment-Dependent/Pragmatic:** *Standing arises from interaction/use.*
      *   **Awkward Commitment:** A model gains rights the moment it is API-accessible, and loses them if taken offline.

  ---

  ## 4. Diagnostics of Unoccupied Combinations

  *   **The "Cached Epiphenomenon":** A view that accepts the *Memoised Gradient* (cached counts) but rejects the *Dark Feature* (no causal impact). This space is largely empty because if one accepts counterfactuals, one usually accepts intrinsic states, or if one demands causal impact, one usually demands physical realization. It is diagnosed as **unstable**: it tries to have the breadth of dispositionalism without the ontological commitment.
  *   **The "Biological Functionalist":** A view that demands biological substrate (Node 5) but also accepts Lookup Tables (Node 6). This is **incoherent**: if substrate matters, the abstract I/O of a table cannot replicate the biological causal power.
  *   **The "Quietist Realist":** A view that denies a fact of the matter (Node 1) but proceeds to answer Node 10. This is **pragmatically useful but philosophically inconsistent**; it treats the question as real for policy purposes while denying it metaphysically.

  ---

  ## 5. Indistinguishable Leaves

  *   **Leaf 6 (Causal-Structure Functionalism) vs. Leaf 11 (Pure Realist):** These are difficult to separate empirically. Both require the system to be "real" and "causal." The distinction is purely historical (Leaf 6 cares about *how* the weights were found; Leaf 11 cares only that they *are*). In a lab setting, these will almost always recommend the same safety protocols.
  *   **Leaf 3 (Counterfactual-Efficacy) vs. Leaf 12 (Deployment-Dependent):** Both views often result in "no standing" for unused or internal models. Leaf 3 denies standing because nothing changed; Leaf 12 denies it because no one used it. The practical outcome is identical, though the justification differs (causal vs. relational).

  ---

  ## 6. Closing Note: The Five-Minute Quiz

  To quickly sort panel members without running the full tree, ask these three questions. They perform the highest sorting work across the logical space:

  1.  **The Dark Feature Question:** *If a system internally represents pain but it is deleted before affecting any output or loss, did it suffer?*
      *   (Separates Causal-Efficacy views from Intrinsic/Qualia views).
  2.  **The Crowd CPU Question:** *If 200 students simulate a network on paper, is the moral status identical to the GPU version?*
      *   (Separates Substrate-Neutral Functionalists from Biological/Physicalists).
  3.  **The Fact of the Matter Question:** *Is there a correct answer to whether the system is suffering, even if we can never know it?*
      *   (Separates Realists from Quietists/Stance-Theorists).
