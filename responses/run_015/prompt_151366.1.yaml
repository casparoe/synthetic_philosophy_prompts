  Here's the case:

  Elena, a senior engineer, previously paid a steep non-refundable deposit to lock herself into a month-long architecture certification starting next week, deliberately blocking out a recurring high-pay consulting slot she knew tempted her too much toward quick cash over deep skills. But yesterday, the consulting firm clarified the scope: this specific week isn't just code review; they need her to mentor three juniors struggling with burnout, a cause she values more than credentials. The certification starts in seven days, while the mentoring starts tomorrow with an immediate upfront fee. Elena feels a sharp tug to cancel the course and take the gig, driven by the immediacy of the fee and the emotional pull of helping now, even though she knows breaking her precommitment hurts her long-term career plan; yet she also feels that ignoring the juniors' need right now seems morally shallow compared to a certificate she might not even use, leaving her torn between feeling like she's weak-willed versus feeling like she's wisely adapting to new moral data.

  ***

  Here's the breakdown of how the different models verdict this:

  **1. The Hyperbolic Discounter**
  This model predicts Elena takes the gig. Why? Because the rewards (cash + the warm glow of mentoring) are immediate, while the costs (lost certification benefits) are pushed into the future. Hyperbolic discounting says we overweight the "now" disproportionately. Even if the certification is objectively worth more in the long run, the fact that the mentoring starts *tomorrow* spikes its present value above the distant course. She isn't necessarily changing her mind about what's best overall; she's just succumbing to the temporal distortion that makes immediate goods look bigger than future ones.

  **2. The Aristotelian**
  On this view, if Elena takes the gig, it's *not* true akrasia (weakness of will). Aristotle argues you can't act against what you genuinely perceive as the good. When she made the precommitment, she thought the cert was the highest good. Now, with new info (the juniors' burnout), her practical wisdom (*phronesis*) tells her mentoring is actually the higher good. So, acting on the gig is acting in accordance with her current knowledge of the good. The guilt she feels isn't about moral failure; it's about breaking a promise to her past self. She's virtuously adapting, not weakly collapsing.

  **3. The Exponential Discounter (Rational Agent)**
  This agent also takes the gig, but without the internal tug-of-war. They simply update their Bayesian priors. New info arrives (mentoring value > cert value), so they recalculate expected utility. Since Utility(Mentoring) > Utility(Cert), they switch. There's no "weakness" here, just efficient processing. They don't feel guilty about the precommitment because they view the deposit as a sunk cost that shouldn't dictate future errors.

  **What's actually doing the work?**
  The engine here is the conflict between **first-order preference reversal** (I now prefer mentoring) and **second-order commitment** (I previously committed to preferring the cert). The philosophical friction comes from trying to decide if that preference reversal is a rational update (Aristotle/Exponential) or a time-based distortion (Hyperbolic).

  **What collapses if you remove the precommitment?**
  If there's no non-refundable deposit or prior blocking decision, the "breaking faith" element vanishes. The Hyperbolic model still predicts she takes the gig (because it's immediate), but the Aristotelian analysis loses its teeth. Without a prior binding intention, there's no contradiction between her past and present self to explain away. The guilt disappears, and the case becomes a simple choice rather than a test of will.

  **How a defender of akrasia would attack this setup**
  A hardcore defender of akrasia would argue that Elena's "new info" is just a rationalization. They'd say deep down, she still knows the certification is better for her life plan, but the immediate cash and emotional hit of mentoring are hijacking her reasoning. They'd claim her practical wisdom hasn't actually changed; she's just dressing up weakness as virtue to soothe the guilt. In their eyes, the "mentoring" detail is a shiny object designed to trick her into thinking she's being moral when she's actually just being impulsive.
