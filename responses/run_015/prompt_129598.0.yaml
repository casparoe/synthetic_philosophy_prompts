  Hey, I'm working on a proposal for a one-semester philosophy of math independent study (around 5000 words, due at the end of the term) and I need help turning my half-baked idea into something that sounds like an actual research plan rather than a rant. The domain is intuitionistic logic and constructivism. My hunch — and this is where I might be reinventing the wheel — is that the BHK interpretation gets read in two different ways that people never clearly seperate: one is what I'm calling a 'recipe ontology,' where a proof is basically a procedure you can execute and a number is defined by the steps that build it; the other is just an 'epistemic warrant' view, where asserting A just means you've got a constructive proof in hand, with no commitment to what the object 'is' apart from that. I think the standard debates about whether intuitionists reject LEM for metaphysical reasons or only for epistemic ones go in circles precisely because these two readings get conflated. So my actual question is: can we cleanly split the BHK interpretation into these two theses, and does doing so dissolve the apparent mystery about why double-negation elimination fails? If they can be split, then maybe intuitionism is defensible without buying any weird ontology of 'unfinished' reality — it's just that warrents don't always stack the way classical logic expects.

