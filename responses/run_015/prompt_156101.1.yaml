          *   *Panel:* Conservative (Fact), Skeptic (Legend), Social (Ritual need). Consensus likely "Followers believed/Contested."
          *   *Constraint Check:* The prompt says "the one I expect you to take away from me." I need to be careful here. I must follow the procedure, not the writer's desire. If the procedure says "Contested," I must say "Contested."

  5.  **Refining the Output:**
      *   *Tone:* Professional, academic, pragmatic (documentary production context).
      *   *Structure:* Clear headings, step-by-step logic.
      *   *The "Four Moves":* Ensure they are explicitly highlighted in the procedure section.
      *   *The Limitations:* Address the "Who Jesus was" vs. "Attributions" question honestly.

  6.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is 15 minutes realistic for this much analysis?
      *   *Fix:* The procedure needs to be a *filter*. If Step 1 (Genealogy) fails, stop. Don't waste time on Embarrassment if there's only one late source.
      *   *Critique:* The prompt asks for "no verdict only one of them can live with."
      *   *Fix:* The consensus mechanism needs to be explicit. If the Skeptic vetoes "Jesus Said," it defaults to "Contested."
      *   *Critique:* The Empty Tomb is tricky. Paul's silence is the key.
      *   *Fix:* Emphasize the Pauline data in the Genealogy step.
      *   *Critique:* The prompt asks to show where the procedure stops with a "no," hands to editorial, or admits irreducible judgment.
      *   *Fix:* Build these exit ramps into the procedure description.

  7.  **Final Polish:** Check against all constraints in the prompt.
      *   4 additional moves included? Yes.
      *   3 test cases run? Yes.
      *   Closing statement on limitations? Yes.
      *   Tone appropriate for a researcher-writer? Yes.

  8.  *(Self-Correction on Empty Tomb)*: The prompt says "the one I expect you to take away from me and which my narration currently depends on." This implies the writer *wants* it to be historical ("Jesus rose/empty tomb"). My job is to run the procedure. If the procedure suggests "Contested/Belief," I must state that, even if it disrupts the narration. I will be honest that the procedure likely downgrades this to "Belief/Contested" based on the Skeptic/Social input, requiring a narration shift.

  9.  *(Final check on "Four Moves")*:
      1.  Genealogical Audit.
      2.  Rival Model Test.
      3.  No Double Counting.
