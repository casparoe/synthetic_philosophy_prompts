answer: |-
  ## The Galilee Protocol: A Decision Procedure for On-Screen Wording

  **Objective:** To assign on-screen wording ("Jesus said/did," "Followers believed," or "Contested") to 40 tradition units within 15 minutes per item, securing consensus from a three-person advisory panel (Conservative, Skeptic, Social-World).

  **Core Principle:** Criteria are not checkboxes but weights. A tradition is not "historical" because it checks three boxes; it is historical if the *best explanation* for the data is that it originated with Jesus of Nazareth rather than the early church or later legend.

  ### Phase 1: The Genealogical Audit (Time Limit: 4 Minutes)
  *Move 1: Audit of Genealogical Relations*
  Do not count texts; count lineages. If Matthew copies Mark, they are one witness, not two.
  *   **Action:** Map the tradition onto the "Independence Map" (Mark, Q, M, L, John, Paul, Josephus, Thomas, Gospel of Peter).
  *   **Stopping Rule (The "No"):** If the tradition appears in only one late lineage (e.g., only in John or only in Infancy Gospels) with no oral pre-history detectable, verdict is **"Followers Believed."** Stop.
  *   **Pass Condition:** Attestation in two or more independent lineages (e.g., Mark + Paul, or Q + John).

  ### Phase 2: The Criteria Weighting (Time Limit: 5 Minutes)
  *Move 3: Rule Against Double-Counting*
  Select the *strongest* single criterion supported by the data. Do not add points for "Semitic Phenomena" if you have already used them to establish "Plausibility."
  *   **Action:** Identify the primary anchor.
      *   *Embarrassment:* Does this hinder the church's agenda? (Strongest weight).
      *   *Plausibility:* Does this fit a 1st-century Galilean Jewish context? (Social-World lead).
      *   *Coherence:* Does this fit with other established anchors? (Secondary weight only).
      *   *Dissimilarity:* Is this unique compared to Judaism and the Church? (Use with Move 4).
  *   **Irreducible Judgment:** If the panel agrees on the data but disagrees on the weight (e.g., Conservative sees Embarrassment, Skeptic sees Theological Motif), mark as **"Contested."**

  *Move 4: Warning Flag for Dissimilarity*
  *   **Action:** If "Dissimilarity" is the primary anchor, trigger the flag.
  *   **Question:** "Does this criterion construct a Jesus who could not have influenced anyone?"
  *   **Consequence:** If the flag is triggered, the verdict cannot be higher than **"Contested"** unless supported by Plausibility. This prevents portraying Jesus as a non-Jewish anomaly.

  ### Phase 3: The Rival Model Stress Test (Time Limit: 4 Minutes)
  *Move 2: Rival Transmission Model*
  *   **Action:** Propose the strongest non-historical explanation. (e.g., "This is a post-Easter prophetic utterance attributed to Jesus," or "This is a theological metaphor narrated as history.")
  *   **Test:** Run the verdict against this model. If the rival model explains the evidence *better* or *equally well* as the historical model, downgrade the verdict.
  *   **Editorial Hand-off:** If the historical and rival models are equally probable, the decision becomes editorial. The producer decides based on narrative arc, but the wording must be hedged (e.g., "The Gospels report..." rather than "Jesus did...").

  ### Phase 4: Consensus and Wording (Time Limit: 2 Minutes)
  *   **Green Light ("Jesus said/did"):** Requires unanimous agreement that the historical model is *significantly* more probable than the rival model.
  *   **Yellow Light ("Contested"):** Used if the Skeptic and Social scholar doubt the Conservative's certainty, or if Move 4 (Dissimilarity Flag) is triggered without Plausibility support.
  *   **Blue Light ("Followers Believed"):** Used if the Genealogical Audit fails or the Rival Model is stronger.

  ---

  ## Application to Test Cases

  ### Item 1: The Baptism of Jesus by John
  **1. Genealogical Audit:**
  *   **Sources:** Mark (1), Q (Matt/Luke 3), John (indirect reference), Josephus (independent on John's practice).
  *   **Lineages:** Markan + Q + Josephus.
  *   **Result:** Pass. High independence.

  **2. Criteria Weighting:**
  *   **Primary Anchor:** Embarrassment. Why would the sinless Son of God submit to a baptism of repentance?
  *   **Double-Count Check:** We are not counting "Plausibility" separately; Embarrassment implies Plausibility here.
  *   **Dissimilarity Flag:** Not triggered. This fits Jewish repentance movements.

  **3. Rival Model Stress Test:**
  *   **Rival:** "The church invented it to link Jesus to John."
  *   **Test:** If inventing it, why make it embarrassing? Why not have John baptize *without* Jesus submitting, or have Jesus baptize John?
  *   **Result:** Rival model fails to explain the specific awkwardness of the tradition.

  **4. Consensus & Wording:**
  *   **Panel:** Conservative (Historical), Skeptic (Historical due to embarrassment), Social (Historical, fits movement dynamics).
  *   **Verdict:** **Jesus said/did.**
  *   **Wording:** "Jesus was baptized by John." (No hedge needed).

  ### Item 2: The Saying on Divorce (with Exception Clauses)
  **1. Genealogical Audit:**
  *   **Sources:** Mark 10 (No exception), Matt 19 (Exception for *porneia*), Luke 16 (Absolute), Paul 1 Cor 7 (Paul speaks, not Jesus).
  *   **Lineages:** Mark + Q (implied in Matt/Luke divergence) + Paul.
  *   **Result:** Pass. Multiple lineages, but with variation.

  **2. Criteria Weighting:**
  *   **Primary Anchor:** Coherence (fits Jesus' ethical intensity) + Dissimilarity (stricter than Hillel/Shammai).
  *   **Double-Count Check:** Do not count Matthew's exception as independent evidence; it is likely an adaptation of Mark/Q.
  *   **Dissimilarity Flag:** **Triggered.** An absolute ban on divorce makes Jesus unlike most Jewish teachers who regulated it.
  *   **Consequence:** Downgrade potential verdict.

  **3. Rival Model Stress Test:**
  *   **Rival:** "The early church debated Gentile inclusion and marital law, projecting the debate back into Jesus' mouth."
  *   **Test:** Matthew's exception (*porneia*) looks exactly like a church accommodation for Gentile converts. Mark's absolute version looks harder to maintain in a growing church.
  *   **Result:** Rival model explains the *variation* better than a single historical utterance explains the divergence.

  **4. Consensus & Wording:**
  *   **Panel:** Conservative (Jesus said the absolute; Matt adapted), Skeptic (Church rule retrojected), Social (Reflects social tension in mixed marriages).
  *   **Verdict:** **Contested.**
  *   **Wording:** "Jesus taught on divorce, though early followers debated the exceptions." (Editorial hand-off: We acknowledge the teaching but flag the variation).

  ### Item 3: The Empty Tomb Tradition
  **1. Genealogical Audit:**
  *   **Sources:** Mark 16 (Earliest narrative), Matt/Luke/John (Dependent on Mark or similar oral stream), Paul (1 Cor 15).
  *   **Lineages:** Markan Passion Narrative + Paul.
  *   **Critical Issue:** Paul lists appearances but *never* mentions the empty tomb. Is Paul an independent lineage that lacks the data?
  *   **Result:** Weak Pass. One narrative lineage (Markan), one silent independent witness (Paul).

  **2. Criteria Weighting:**
  *   **Primary Anchor:** Embarrassment (Women as first witnesses).
  *   **Double-Count Check:** Do not count "Plausibility of burial" separately; it is contested by ossuary evidence for crucifixion victims.
  *   **Dissimilarity Flag:** **Triggered.** Jewish resurrection expectation was for *new* bodies, not reanimated corpses in opened tombs. This makes the tradition dissimilar to Jewish hope.
  *   **Consequence:** Downgrade potential verdict.

  **3. Rival Model Stress Test:**
  *   **Rival:** "Vision experiences occurred (Paul's data); the tomb story developed later to locate the faith geographically and counter claims of theft."
  *   **Test:** Does this explain Paul's silence? Yes. Does it explain the women witnesses? Yes (legend often elevates marginalized figures to validate truth). Does it explain the variation in who went to the tomb? Yes.
  *   **Result:** Rival model explains the *silence of Paul* and the *narrative growth* better than the historical model explains the lack of early attestation.

  **4. Consensus & Wording:**
  *   **Panel:** Conservative (Historical fact), Skeptic (Theological symbol), Social (Ritual necessity for a movement lacking a body).
  *   **Verdict:** **Followers Believed.** (Consensus requires moving away from "Jesus did" because he is dead, and away from "Fact" because the Skeptic/Social scholars cannot sign off on historicity given Paul's silence).
  *   **Wording:** "His followers came to believe his tomb was empty."
  *   **Note to Writer:** This is the "take away." Your narration currently depends on "The tomb was found empty." The procedure forces a shift to belief language. You cannot claim "Jesus rose" as a historical event verifiable by the camera; you can only claim the *belief* in the resurrection is historical.

  ---

  ## Limitations: What This Procedure Cannot Do

  You asked for an honest statement of the procedure's limits, specifically regarding "who Jesus was" versus "attributions within twenty years of his death."

  **1. The Access Problem:**
  This procedure establishes the *probability of tradition origin*, not ontological reality. Even if we verdict "Jesus said/did" on the Divorce saying, we are only saying, "It is highly probable a saying like this was spoken by the man Jesus of Nazareth." We cannot access his internal intent, his self-understanding, or his divine status. The procedure filters noise; it does not capture the signal's source nature.

  **2. The Twenty-Year Gap:**
  The "Rival Model Stress Test" acknowledges that traditions solidified within 20 years of his death. In the ancient Mediterranean, 20 years is sufficient time for a community's identity to reshape a founder's memory without it being "lies." The procedure cannot distinguish between "Jesus said this" and "The Spirit speaking through the church said this in Jesus' name." To the first-century mind, those may be the same thing. To the modern documentary, they are different. This procedure forces us to admit we often cannot tell them apart.

  **3. The Consensus Constraint:**
  Because the verdict requires consensus between a Conservative and a Skeptic, the procedure is structurally biased toward the center. It will systematically downgrade items that are certain to one group but impossible to the other. This protects the documentary from criticism, but it may obscure the sharp edges of history where one side is actually right and the other wrong. We are building a *working agreement*, not a final truth.

  **4. The "Who" vs. "What":**
  Finally, no set of criteria can establish *who* Jesus was (e.g., Son of God, Apocalyptic Prophet, Social Reformer). Criteria only establish *what* can be attributed to him with varying degrees of confidence. The narration can say "Jesus taught X," but it cannot say "Jesus was Y" based on this data alone. That leap requires theology or philosophy, not historical method. Your narration must rest on the attributions, not the identity.
