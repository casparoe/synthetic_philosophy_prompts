      *   **Options:** "Jesus said/did," "Followers believed," or "Contested."
      *   **Constraints:**
          *   No footnotes.
          *   Narration must sound settled but not claim false precision.
          *   3-person advisory panel (Conservative, Skeptic, Social-World).
          *   Time limit: ~15 minutes per item.
          *   Consensus required (no verdict only one can live with).
      *   **Requirements for Procedure:**
          *   Use familiar criteria (Multiple Attestation, Dissimilarity, Embarrassment, Coherence, Semitic Phenomena, Plausibility) but *not* as a simple checklist.
          *   Include 4 specific additional moves:
              1.  Genealogical audit (independent lineages vs. texts).
              2.  Rival transmission model test (downgrade if verdict flips).
              3.  No double-counting evidence.
              4.  Warning flag for Dissimilarity selection effect.
          *   Define stopping points (No, Editorial, Irreducible Judgment).
      *   **Test Cases:**
          1.  Baptism by John.
          2.  Saying on Divorce (exceptions variation).
          3.  Empty Tomb tradition (the "take away" item).
      *   **Closing:** Honest statement of limitations (Who Jesus was vs. attributions within 20 years).

  2.  **Develop the Decision Procedure (The "Galilee Protocol"):**
      *   *Goal:* Efficiency (15 mins), Consensus (3 divergent scholars), Nuance (avoiding false certainty).
      *   *Structure:* Needs to be a flowchart or step-by-step algorithm that forces discussion on specific friction points rather than general feelings.
      *   *Integrating the 4 Moves:*
          1.  *Genealogy:* Don't count Mark and Matthew as two witnesses if Matthew copied Mark. Look for Q, M, L, John, Paul, Thomas, etc.
          2.  *Rival Model:* If we think it's historical, ask: "How would a myth-maker create this?" If that explains it better, downgrade.
          3.  *No Double-Counting:* If "Semitic Phenomena" is used to prove "Plausibility," don't count it again as a separate point.
          4.  *Dissimilarity Flag:* Acknowledge that this criterion makes Jesus look weird. If the result is "Jesus was unlike any Jew," flag it as potentially distorted.
      *   *Verdict Categories:*
          *   Green: "Jesus said/did" (High confidence).
          *   Yellow: "Contested" (Significant scholarly debate).
          *   Blue: "Followers believed" (Theological development/legend).
      *   *Stopping Rules:*
          *   Stop at "No" if genealogical independence fails completely.
          *   Hand to Editorial if it's about narrative flow vs. historical nuance.
          *   Irreducible Judgment where evidence is equally balanced.

  3.  **Drafting the Procedure Steps (Iterative refinement):**
      *   *Step 1: Source Audit (Genealogy).* Map the texts. Are they independent?
      *   *Step 2: Criteria Application (Weighted).* Apply the standard criteria but watch for double counting.
      *   *Step 3: The Dissimilarity Flag.* Explicitly ask: "Does this make Jesus too unique?"
      *   *Step 4: Rival Model Stress Test.* Try to explain it as post-Easter creation.
      *   *Step 5: Consensus Check.* Can all three scholars sign off?
      *   *Step 6: Wording Assignment.*

  4.  **Running the Test Cases:**

      *   **Case 1: Baptism by John.**
          *   *Sources:* Mark, Q (Matt/Luke), Josephus (independent witness to John), John (Gospel).
          *   *Genealogy:* Strong independence.
          *   *Embarrassment:* High (Why would the Son of God be baptized by a repentance preacher?).
          *   *Dissimilarity:* Low (Fits Jewish repentance movement).
          *   *Rival Model:* Hard to invent this.
          *   *Verdict:* "Jesus said/did" (with nuance).
          *   *Panel:* Conservative (Yes), Skeptic (Yes - embarrassment), Social (Yes - fits context). Consensus easy.

      *   **Case 2: Divorce Saying.**
          *   *Sources:* Mark 10, Matt 19 (exception clause), Paul (1 Cor 7), Luke 16.
          *   *Genealogy:* Mark + Q + Paul. Independent enough.
          *   *Coherence:* Fits Jesus' ethical intensity.
          *   *Dissimilarity:* Moderate (Stricter than some Jewish schools, but not alien).
          *   *Variation:* The "exception clause" in Matthew looks like church adaptation.
          *   *Rival Model:* Could be church discipline retrojected.
          *   *Verdict:* "Contested" or "Jesus said... followers debated." The variation suggests development.
          *   *Panel:* Conservative (Jesus said it), Skeptic (Church rule), Social (Debate reflects social reality). Consensus requires "Contested" wording.

      *   **Case 3: Empty Tomb.**
          *   *Sources:* Mark (earliest), Matt/Luke/John (later). Paul (no mention of tomb, just appearances).
          *   *Genealogy:* All passion narratives likely stem from Mark or pre-Mark oral tradition. Paul is independent but silent on the tomb.
          *   *Embarrassment:* Women witnesses (strong point).
