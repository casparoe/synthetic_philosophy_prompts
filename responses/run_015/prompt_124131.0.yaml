  5.  **Addressing the "Unfalsifiability" Charge:**
      *   This is crucial. If every failure is "pattern matching" and every success is "reasoning," the theory is vacuous.
      *   Need to define what *would* count as pattern matching vs. reasoning within this framework.
      *   The "Consistency across Isomorphs" test. If it solves Problem A but fails Problem B (which is logically identical but surface-level different), that's strong evidence against reasoning.

  6.  **Developing the Response Structure:**
      *   **Validation:** Acknowledge the robustness of the view (Dennett, functionalism). It's not a fringe view.
