  **Methodology: Recognition and Constitution**
  A primary challenge in WoP measurement is the timing of recognition. Is the Will an existing asset to be discovered, or revenue to be recognized upon the conclusion of a voting procedure? BVP adopts a hybrid accrual model. We treat the Will as an intangible asset that is constituted during measurement but booked only upon institutional acknowledgment. This avoids premature recognition of volatile preferences while ensuring liabilities (unmet demands) are captured in the period they occur. By framing constitution as an accounting question, we bypass metaphysical debates regarding the pre-existence of collective intent. The Will exists when the instrument books it.

  **Key Performance Indicators**

  *   **Preference Volatility Index (PVI):** Measures intransitive cycles within majority coalitions (e.g., A>B, B>C, C>A). High PVI indicates measurement noise rather than systemic inconsistency. Q3 PVI settled at 12.4%, within acceptable margin of error.
  *   **Eligible Stakeholder Perimeter (ESP):** Defines the boundary of the sample. Current scope includes citizens over 18. Exclusions (minors, non-citizens, deceased estates, future generations) are treated as off-balance-sheet contingencies. See Appendix A for scope assumptions.
  *   **Weighted Sentiment Density (WSD):** Adjusts raw headcount for intensity. A minority with high conviction is netted against a majority with low engagement to yield a single standardized unit. This prevents apathy from diluting high-value will.
  *   **Unmet Will Liability (UWL):** Calculated as a residual. Total Will minus Institutional Delivery equals UWL. Consequently, if institutional performance degrades due to exogenous shocks, the measured Will of the People™ mechanically increases, reflecting higher latent demand.

  **Findings**
  Q3 data indicates a strong inverse correlation between government service delivery and the measured magnitude of the WoP. As infrastructure output declined by 4%, the Unmet Will Liability rose correspondingly, validating the residual model. This confirms that the Will functions as a counter-cyclical asset; when the state underperforms, the People's Will expands to fill the gap. Regarding Preference Volatility, we observed cyclicality in the healthcare vs. taxation cluster. Rather than indicating irrationality, this is classified as temporal preference shifting. We have restated Q2 numbers to smooth this curve and maintain investor confidence.

  > "The challenge isn't finding the Will; it's deciding when to book it on the ledger. If you recognize it too early, you risk impairment charges down the line."
  > — *Julian Voss, Senior Partner, Bracknell & Volk*

  Focus groups reinforced the intensity metrics. Participants expressed clear demands, though consistency varied based on question framing.

  > "I want lower taxes and better roads. If you ask me which one, I say both. If you make me choose, I say it depends on the week."
  > — *Focus Group Participant 44-B*

  **Appendix A: Data Limitations and Scope**
  Measurement is constrained by the instrument's inability to separate signal from noise in aggregate preference functions. Arrow-type constraints are managed via weighting adjustments to ensure a transitive output regardless of input topology. Additionally, the ESP footnote clarifies that "The People" is a fluid legal entity. Future periods may expand the perimeter to include post-natal pre-citizenship entities depending on regulatory changes. BVP advises stakeholders to treat the WoP not as a static fact, but as a dynamic compliance metric subject to revision based on procedural architecture. There is no fact of the matter outside the model; there is only the model's fidelity to its own assumptions.
