answer: |-
  **Brainstorming**
  1.  **Medical Triage Unit:** Doctors allocating life-extension treatments. *Weakness:* Too binary (life/death); obscures the gradient of well-being required for the concave function math.
  2.  **Inter-generational Trust Fund:** Distributing resources across ages. *Weakness:* Too abstract; hard to personalize the "units" of measurement without becoming an economics lecture.
  3.  **Bureau of Temporal Welfare (Sci-Fi):** Auditing "Life-Streams" for credit. *Weakness:* Risk of gimmickry; the technology might distract from the moral arithmetic.
  4.  **Ministry of Harmonic Distribution (Selected):** A bureaucratic setting auditing a pilot program where citizens undergo "smoothing" therapy to reduce emotional volatility (within-life inequality). *Why:* It grounds the abstract "person-years" in a tangible policy intervention, allowing the arithmetic to appear in an audit report while maintaining realistic stakes.

  ***

  **The Audit**

  The fluorescent light hummed, a low B-flat that matched the headache behind Elara's eyes. On her screen, the ledger for Pilot Group 8940 blinked red. She tapped the glass, zooming in on the temporal slices.

  Kael leaned against the doorframe, holding two cups of synthetic coffee. He looked tired. They all were. The Ministry deadline for the Quarterly Distribution Index was 0800.

  "You're still on the Smoothing data?" Kael asked, setting a cup down.

  "The numbers don't clear," Elara said. "Subject 8940. Pre-intervention, his life trajectory was split into two twenty-year halves. First half well-being rated at 10. Second half at 30. Total lifetime utility: 40."

  Kael took a sip. "Standard variance. Early hardship, late comfort. The priority weight should penalize that inequality."

  "It does," Elara said. She pulled up the formula column. "Using the square-root weighting mandated for person-years. Root 10 plus root 30. That gives us a priority score of 8.64."

  "Correct."

  "Now look at the post-intervention projection," Elara said, highlighting the second row. "The therapy flattens the curve. Emotional volatility suppressed. Both halves rated at 19. Total lifetime utility is now 38."

  Kael frowned. "Total utility dropped? Two points?"

  "He lost something in the smoothing. Nuance, maybe. Joy peaks cut off. But the pain valleys were filled." Elara tapped the priority column. "Here is the error. Root 19 plus root 19. The score is 8.72."

  Kael set his cup down hard. Coffee sloshed over the rim. "The score went up."

  "8.64 to 8.72," Elara confirmed. "The system recommends the intervention. It says the world is better if we lobotomize his highs to fill his lows, even if the sum total of his experience decreases. We are leveling down within the life, and the metric calls it a gain."

  Kael straightened, his voice tightening. "That's a category error. You know the standard immunity argument, Elara. Prioritarianism avoids the leveling-down objection because we sum weighted well-being. If you drag the better off down to the level of the worse off and give nothing to anyone, some $w_i$ falls. Hence the sum falls. We never say the world got better just because people were cut down to size. That was the whole point of switching from egalitarianism."

  "That holds between persons," Elara said softly. "If I take from the rich to burn it, the sum drops. But we aren't weighting persons, Kael. We're weighting person-years. The Foundation insisted on it because lifespans differ. We have to compare the forty-year life to the ninety-year life on a common unit. So the unit is the year. And if the unit is the year, then inequality within a life counts just like inequality between lives."

  Kael walked to the screen, scrolling through the code. "Then we change the unit. We weight whole lives. Apply the concave function to the total lifetime utility, not the slices."

  "And lose the ability to compare different lifespans fairly?" Elara countered. "If we weight the whole life, a ninety-year life with moderate happiness outweighs a forty-year life with intense happiness, simply by virtue of duration. The person-year metric was the only way to normalize that. If we switch back to whole lives, we penalize the short-lived. You know the mortality rates in Sector 7."

  "So we accept the anomaly," Kael said, turning to face her. "It's a edge case. A technical artifact. The subject is still better off in terms of priority value. We prioritize the worst-off years. That's the mission."

  "The mission is to make things better," Elara said. "Not to make the numbers look better while the person loses ground. If I certify this, we roll out the smoothing therapy nationwide. We reduce total welfare to increase priority scores. We become the levelling-down objection."

  "It's not all-things-considered better," Kael said, his voice dropping, pleading now. "We can say that. The priority metric rose, yes, but total utility fell. We report both. We say it's better in one respect—distributional justice within the life—but not better all things considered. The Ministry doesn't have to act on the priority score alone."

  "The Distribution Index *is* the action trigger," Elara said. "You know how the automation works. If the priority score rises, the funding unlocks. If I sign this audit, the therapy launches. The nuance gets stripped in the transmission."

  She looked at the digital signature pad. The cursor blinked, a rhythmic pulse. Outside, the city was dark, millions of lives ticking through their person-years, some jagged, some smooth.

  "If we bury this," Kael said, "we delay the rollout. But the Foundation will ask why. They'll send their own auditors. They'll find the same math. And then they'll accuse us of incompetence. Or obstruction."

  "They'll accuse us of honesty," Elara said.

  "They'll accuse us of failing to prioritize the worst-off moments," Kael corrected. "Think of the years at level 10. Those are years of suffering. The function says relieving them is worth more than the cost to the years at 30. Even if the sum drops. Isn't that what we believe? That suffering matters more than joy?"

  "Not if it requires destroying the joy to do it," Elara said. "Not if the cost is the person's total good."

  She picked up the stylus. The weight of it was negligible, plastic and light, but her hand felt heavy. The clock on the wall ticked toward 0700. The server would lock the file in one hour. If unsigned, the project defaults to 'Pending Review,' which means a committee, which means months of delay. If signed, the therapy ships.

  Kael watched her, his face unreadable. He believed in the sum. He believed the math was the morality. Elara looked back at the ledger. Subject 8940. A man who would live less to live evenly.

  "If I sign," Elara said, "I need a footnote. A flag on the utility drop."

  "The system won't accept a flag that contradicts the index," Kael said. "It'll reject the file."

  "Then I write it in the manual override log."

  "That's insubordination."

  "It's audit trail," she said.

  She hovered the stylus over the pad. The red blink of the ledger reflected in her eyes. She could feel the pressure of the deadline, the weight of the Ministry, the certainty of the formula. She could also feel the loss of those two points of utility, vanishing into the concave curve.

  Elara lowered the stylus.
