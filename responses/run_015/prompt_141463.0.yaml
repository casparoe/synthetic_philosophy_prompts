answer: |-
  This is an excellent observation. You have identified a structural inconsistency in how institutions apply ethical principles, not because they are hypocritical, but because they are silently switching between two different models of what a human being *is* in that context.

  As a crystallographer, you know that if the diffraction pattern changes, the underlying lattice has changed. Here, the "diffraction pattern" (the rules of consent) changes because the "lattice" (the theory of autonomy) changes.

  Here is the machinery behind the practice, stripped of the jargon.

  ### 1. The Two Models of Autonomy

  Your argument is stuck because your reading group is likely assuming there is only one definition of "autonomy." In practice, your institution uses two.

  **Model A: Authorization (The Clinical Trial)**
  Here, autonomy is a **gatekeeping mechanism**. The body is sovereign territory. The institution has no right to enter unless explicitly invited.
  *   **The Goal:** Legitimacy of the intrusion.
  *   **The Metric:** Was permission granted *explicitly*?
  *   **Why Payment is Suspect:** Payment introduces a new variable into the calculation. It risks bypassing the "risk assessment" part of the brain with the "reward" part. If you pay someone, you aren't just removing friction; you are adding a motive that might overwhelm their safety assessment. That is "undue inducement."
  *   **The "Opt-Out" Defense:** Irrelevant. In this model, silence is not consent. Silence is a locked door.

  **Model B: Welfare (The Pension & The Appointment)**
  Here, autonomy is a **welfare mechanism**. The individual is assumed to have long-term interests (saving money, seeing the doctor) that their short-term self (laziness, distraction) undermines.
  *   **The Goal:** Achieving the outcome the individual *should* want.
  *   **The Metric:** Did they end up in the beneficial state?
  *   **Why Defaults are Good:** Inertia is treated as a bug in the human operating system. The default patch uses that bug to install the update the user needs.
  *   **The "Opt-Out" Defense:** Crucial. It maintains the *fiction* of Model A (you are free) while delivering the *reality* of Model B (we decided for you).

  **The Conflict:** The reading group is judging the Pension (Model B) by the rules of the Trial (Model A). In Model A, exploiting inertia is manipulation. In Model B, exploiting inertia is assistance.

  ### 2. The "Grip" Metric and the Counterfactual

  You asked what a rule capping "grip" would be committed to. Your definition of grip is:
  $$ \text{Grip} = P(\text{Default}) - P(\text{Active Choice}) $$

  For this number to have moral weight, you are correct: there must be a fact of the matter about $P(\text{Active Choice})$. There must be a "True Self" that exists independently of the form design.

  If an institution adopted a "Maximum Grip" rule, it would be committing to the following claim: **Inertia belongs to the agent, not the institution.**

  *   **Current Practice:** The institution treats human inertia as a common resource they can harvest. In pensions, they harvest it for your benefit (mostly). In appointments, they harvest it for efficiency (mostly). In trials, they are forbidden from harvesting it because the risk is too high.
  *   **If Grip were the Test:** If you banned any intervention with a grip above, say, 10%, you would effectively ban defaults. You would force *Active Choice* everywhere.
  *   **The Consequence:** You would protect the "Sovereign Self" (Model A) but sacrifice the "Welfare Self" (Model B). Take-up for pensions would crash. Missed appointments would rise. The "lazy or muddled" path would no longer land them in safety.

  So, the "Opt-Out" defense *is* leaning on the counterfactual ("You would have chosen this anyway"). But it is a convenient fiction. As your enrollment letter datum proves, when you make the counterfactual explicit ("We know we are enrolling you by default"), the grip weakens. People react to the *attempted influence* itself.

  ### 3. The Payment Paradox

  Why is a £50 voucher "coercive" but a pre-filled appointment time is not? Both steer behavior.

  *   **The Voucher:** Changes the *value* of the options. It makes "Yes" more attractive than it was before. It alters the preference structure.
  *   **The Default:** Changes the *cost* of the options. It makes "Yes" cheaper (in effort) than "No." It leaves the preference structure alone but exploits the friction cost.

  In bioethics, altering preferences (payment) is seen as contaminating the will. Exploiting friction (defaults) is seen as administrative.
  In behavioral economics, both are interventions.
  The practice presupposes that **effort is neutral, but money is not.** This is philosophically fragile but practically robust. We accept that the world is hard (friction exists), but we fear that the world is buying us (money exists).

  ### 4. The Enrollment Letter Datum

  You noted that when you made the default explicit, take-up fell. Your colleagues called this proof of a trick. You are right to hesitate.

  *   **If it was a trick:** The drop proves people were enrolled by mistake/confusion.
  *   **If it was a nudge:** The drop proves the "grip" relies on *quiet* inertia. Once the inertia is named, it becomes a decision.

  This datum shows that **transparency has a cost.** The "Opt-Out" defense works best when the opt-out mechanism is invisible. The moment you shine a light on the default, you force the user from Model B (Welfare) back into Model A (Authorization). They have to *authorize* the inertia. Many won't.

  This suggests the "Opt-Out" defense does not survive being said out loud. It requires a degree of opacity to function. If you require full transparency about the *influence* of the default, the default loses its power.

  ### 5. Summary: What the Practice Presupposes

  To answer your specific questions directly:

  **1. What does this pattern of practice presuppose about autonomy?**
  It presupposes autonomy is **context-dependent**.
  *   When the stakes are *bodily risk*, autonomy is **Voluntariness** (I must actively say yes).
  *   When the stakes are *administrative/financial*, autonomy is **Outcome** (I must end up safe/saved).
  The practice assumes we are sovereign owners of our bodies but bad managers of our paperwork.

  **2. Where exactly is it underdetermined?**
  It is underdetermined at the boundary of **Risk vs. Benefit**.
  Who decides if the pension default is "good" for me? The committee decided yes. If the default investment fund had high fees, the "grip" would be exploiting me for the bank's benefit. The ethics of the default depend entirely on whether the institution's interest aligns with the individual's.
  *   **Pension:** Aligned (mostly).
  *   **Appointment:** Aligned (mostly).
  *   **Trial:** Misaligned (Science gains, Patient risks).
  The "Opt-Out" defense only works when interests are aligned.

  **3. Is the consent case different in principle?**
  Yes. It is the difference between **Permission** and **Correction**.
  *   **Consent (Trial):** Seeking permission to cross a boundary.
  *   **Default (Pension):** Correcting a cognitive error (procrastination).
  You cannot "correct" someone into a clinical trial because participating is not inherently an error correction; it is a risk assumption.

  **4. What would have to change if "Grip" were the test?**
  If you mandated that "No default may have a grip > X%":
  *   **Pensions:** Would have to move to Active Choice. Overall savings would drop. Vulnerable people (the "muddled") would be worse off.
  *   **Trials:** Would likely remain unchanged, because the barriers (forms, cooling-off) already ensure grip is low (or negative).
  *   **Appointments:** Would have to ask "When are you free?" rather than "Is this time okay?" Efficiency would plummet.

  ### The Verdict for Your Argument

  You can tell your reading group this:

  The inconsistency they see is real, but it is not a logical error; it is a **triage of ethical frameworks.**

  The "Opt-Out" defense in pensions relies on the claim that **Inertia is a defect.**
  The "Informed Consent" protocol in trials relies on the claim that **Inertia is a shield.**

  In pensions, we want to overcome your inertia to save you. In trials, we want your inertia to protect you from us.

  The "Opt-Out" defense *does* lean on the counterfactual ("You would have chosen this"). But as your enrollment letter experiment showed, that counterfactual is fragile. It collapses under scrutiny. The practice works only as long as we agree not to measure the "Grip." The moment you measure it, you reveal that the institution is steering the ship, and the "freedom to opt out" is just the lifeboat, not the helm.

  If they want a consistent theory, they must choose: Do we treat citizens as **Sovereigns** (who must never be nudged without explicit consent) or **Clients** (who need help managing their own limitations)? We currently treat them as Clients with money, and Sovereigns with scalpel. That is not a contradiction; it is a policy. But it is a policy that dissolves if you ask for the "Grip" number.
