answer: |-
  # Seminar Handout: The Logical Space of Access and Phenomenality

  **Instructions for Students:** Do not worry about the names of theorists yet. Answer the following three diagnostic questions based on your intuitions about cognitive architecture and experience. Follow the branches to find your philosophical position.

  ---

  ## The Decision Tree

  ### Branch 1: The "Broadcast-Only" Question
  **Can global broadcasting of information occur with absolutely no phenomenal character (no "what-it-is-like-ness")?**
  *   **YES:** A system can integrate and broadcast data for reasoning and report while being a "zombie" regarding that data. *(Go to Branch 2A)*
  *   **NO:** Global broadcasting is inherently phenomenal; if information is globally available, there *must* be something it is like to have that information. *(Go to Branch 2B)*

  ### Branch 2A: (If YES to Branch 1)
  **Can phenomenal consciousness exist without any global broadcasting (i.e., can a state be felt but not globally available for report/reasoning)?**
  *   **YES:** Phenomenality can overflow access; you can feel more than you can report. *(Go to Branch 3, Leaf 1)*
  *   **NO:** Phenomenality requires global broadcasting; you cannot feel what you cannot access. *(Go to Branch 3, Leaf 2)*

  ### Branch 2B: (If NO to Branch 1)
  **Can phenomenal consciousness exist without any global broadcasting?**
  *   **YES:** Broadcasting guarantees experience, but experience can also exist in local, non-broadcast states. *(Go to Branch 3, Leaf 3)*
  *   **NO:** Broadcasting and Phenomenality are co-extensive; one never exists without the other. *(Go to Branch 3, Leaf 4)*

  ### Branch 3: The Modal Relationship (Leaf Assignment)
  *Based on your path, select the leaf that matches your commitments regarding sufficiency and necessity.*

  #### Leaf 1: Neither Necessary Nor Sufficient
  *(Path: Yes → Yes)*
  *   **Named Position:** **Phenomenal/Access Dissociation** (e.g., Ned Block)
  *   **Core Commitment:** Phenomenal consciousness and access consciousness are distinct natural kinds that can be empirically and metaphysically dissociated in both directions.
  *   **Super-Blindsight Implication:** A super-blindsighter is metaphysically possible; the subject genuinely lacks visual experience despite global integration, rendering consciousness causally otiose for their accurate reports.

  #### Leaf 2: Necessary But Not Sufficient
  *(Path: Yes → No)*
  *   **Named Position:** **Access-Required Phenomenology** (e.g., Some Classical GWT Realists)
  *   **Core Commitment:** Global broadcasting is the gateway to experience (necessary), but the broadcasting mechanism itself can operate in a "dark," non-phenomenal mode (not sufficient).
  *   **Super-Blindsight Implication:** A super-blindsighter is possible, but the theory struggles to explain what "switch" turns a broadcast state from dark to luminous without changing the functional architecture.

  #### Leaf 3: Sufficient But Not Necessary
  *(Path: No → Yes)*
  *   **Named Position:** **Phenomenal Integrationism** (Largely Unoccupied)
  *   **Core Commitment:** Any state that achieves global integration automatically generates phenomenality, but phenomenality can also arise in localized, non-integrated processing.
  *   **Super-Blindsight Implication:** A super-blindsighter is impossible; if broadcasting occurs, experience *must* exist, implying the subject's report of "no experience" is conceptually confused or false.

  #### Leaf 4: Necessary and Sufficient
  *(Path: No → No)*
  *   **Named Position:** **Access Exhaustivism / Illusionism** (e.g., Daniel Dennett, Peter Carruthers)
  *   **Core Commitment:** Phenomenal consciousness is nothing over and above the availability of information for global control and report; the "gap" is a cognitive illusion.
  *   **Super-Blindsight Implication:** The scenario is incoherent; if the subject integrates information globally, they *are* conscious, and their denial is a failure of self-knowledge, not a lack of experience.

  ---

  ## Diagnostic Notes for Seminar Discussion

  ### 1. Unoccupied Combinations (The Gaps)
  **Leaf 3 (Sufficient But Not Necessary) is largely unoccupied.**
  *   **Diagnosis:** **Theoretical Instability.** It is difficult to motivate why global broadcasting would *guarantee* phenomenality (making it sufficient) while simultaneously arguing that non-broadcast local states can also be phenomenal (making it not necessary). If local states can be phenomenal without integration, the special status of the "Global Workspace" is undermined; if integration is special enough to guarantee experience, it is usually argued to be required for experience. Most theorists who choose "Broadcasting entails Phenomenality" (Branch 1: No) also choose "Phenomenality entails Broadcasting" (Branch 2: No), collapsing into Leaf 4.

  ### 2. Collapsed Distinctions (Where the Tree Fails)
  **The tree cannot separate Ontological Identity from Epistemic Indistinguishability.**
  *   **The Collapse:** **Leaf 4 (Access Exhaustivism)** conflates two distinct views:
      1.  **Strong Identity:** $P$ and $A$ are the same physical state (Type Identity).
      2.  **Epistemic Limit:** $P$ and $A$ might be distinct, but we can never know $P$ without $A$, so they are indistinguishable for science.
  *   **Why it matters:** A student who believes $P$ and $A$ are distinct but scientifically inseparable will answer the diagnostic questions exactly like a student who believes they are identical. The tree sorts them both into Leaf 4, obscuring a major metaphysical disagreement regarding the "Hard Problem."

  **The tree cannot separate Illusionism from Eliminativism.**
  *   **The Collapse:** Both positions answer "No" to Branch 1 (Broadcasting without Phenomenality) because they deny the premise that "Phenomenality" exists as a robust property to begin with.
  *   **Why it matters:** An Illusionist says "Experience exists but is not what you think it is," while an Eliminativist says "Experience does not exist." Both end up at Leaf 4, yet their ethical and phenomenological commitments differ radically.

  ### 3. Facilitation Tip for the "Super-Blindsight" Implication
  When discussing the leaves, press the students on the **explanatory cost** of the implication.
  *   For **Leaf 1 & 2**, the cost is **Epiphenomenalism**: If you can broadcast without experience, what work is the experience doing?
  *   For **Leaf 3 & 4**, the cost is **Veridicality**: If broadcasting guarantees experience, why does the subject sincerely report otherwise? Are we calling them liars, or are our concepts of "experience" broken?
