answer: |-
  Here is a practical protocol designed for your constraints: 20 minutes, spreadsheet-only, three signers, and a finite horizon with complex optionality.

  ### 1. The Sunday Protocol (20-Minute Routine)

  This procedure replaces "How much does Kelly say?" with "How much are we allowed to bet?" It forces correlation and noise checks before size is calculated.

  **Step 1: The "Event Bucket" Cap (3 Minutes)**
  *   **Action:** Group your 5–15 bets by underlying event (e.g., "Man City vs. Arsenal", "March Election").
  *   **Rule:** No single event bucket can exceed **15% of current bankroll** in total exposure (sum of stakes).
  *   **Why:** Your 12 football bets are not 12 independent coin flips. They are 12 exposures to 6 matches. If the model is wrong about the pitch conditions or referee, you lose the whole bucket.
  *   **Spreadsheet:** Column A = Event ID. Column B = Sum of Stakes for Event. Conditional Formatting: Red if >15%.
  *   **Stop:** If a bucket hits 15%, cut the lowest-edge bets in that bucket until it fits. Do not pass Go.

  **Step 2: The Noise Discount (5 Minutes)**
  *   **Action:** Calculate your raw Kelly fraction for each bet: $f = \frac{p(b+1) - 1}{b}$ (where $b$ is decimal odds minus 1).
  *   **Rule:** Apply a **Fixed Fractional Multiplier** based on your 300-bet track record.
      *   Calculate your realized ROI over the last 300 bets.
      *   Calculate the Standard Deviation (SD) of your individual bet ROIs.
      *   **Multiplier = $\min(0.5, \frac{\text{Mean ROI}}{\text{SD of ROI}})$**.
      *   *Simpler Heuristic:* If you don't want to calc SD every week, hard-code **0.5 (Half-Kelly)**. With 300 bets, your edge estimate error is likely >30%. Half-Kelly reduces growth by ~25% but reduces variance by ~75%.
  *   **Spreadsheet:** Column C = Raw Kelly %. Column D = Multiplier (e.g., 0.5). Column E = Adjusted Kelly %.
  *   **Stop:** If Adjusted Kelly < 0.5% of bankroll, **kill the bet**. Transaction costs and model noise eat this alive.

  **Step 3: The Horizon Check (2 Minutes)**
  *   **Action:** Compare Current Bankroll to Target (2x Initial) and Hard Stop (if any remaining).
  *   **Rule:** If you are **ahead of the pace** needed to hit the 4-year target, cap total weekly exposure at **5% of bankroll**. If you are **behind pace**, you may go up to **10% of bankroll**.
  *   **Why:** You have 1 year left. You do not have time to recover from a 30% drawdown. This overrides Kelly. Kelly assumes infinite time to recover; you do not have that.
  *   **Sign-off:** This is the Committee's call. "Are we in 'Protect' mode or 'Catch-up' mode?"

  **Step 4: The Backer Clause Check (2 Minutes)**
  *   **Action:** Compare Current Bankroll to High-Water Mark (HWM).
  *   **Rule:**
      *   If Bankroll > 60% of HWM: Ignore the clause. Size normally.
      *   If Bankroll < 60% of HWM: **Halve all bet sizes.**
  *   **Why:** See Section 4 below. Near the trigger, you are gambling with the Backer's option value. Preserve the option.
  *   **Sign-off:** This is a values call. Disclose to the Backer if you trigger this discount.

  **Step 5: Final Aggregation & Sign-off (8 Minutes)**
  *   **Action:** Sum total stakes. Check against Step 3 (Horizon) and Step 1 (Bucket) limits.
  *   **Output:** A list of Bet, Stake, and Reason Code (e.g., "Cut due to Event Cap").
  *   **Call:** Read the Reason Codes to co-signers. If total stake is within limits, sign.

  ---

  ### 2. The Noise Rule (Derivation vs. Heuristic)

  You asked for honesty: **There is no closed-form solution for "Kelly with noisy edges" that works in a spreadsheet without Bayesian priors you don't have.**

  However, we can derive a robust bound.
  *   **The Principle:** Kelly optimization assumes you know $p$ (probability) exactly. You don't. You have $\hat{p}$ (estimate).
  *   **The Math:** If your estimate of edge has a standard error $\sigma_e$, the optimal fraction is roughly $f^* \approx \frac{\text{Edge}}{\text{Odds}} \times (1 - \frac{\sigma_e^2}{\text{Edge}^2})$.
  *   **The Reality:** With 300 bets, if your model says 55% win rate, the 95% confidence interval is roughly $\pm 6\%$. Your "edge" could be zero.
  *   **The Rule:** Use **Half-Kelly (0.5x)**.
  *   **Why:** It is the mathematical equilibrium for an investor who is uncertain about their own edge. It maximizes growth *assuming* your edge estimate might be overstated by a factor of 2.
  *   **Tell the Members:** "Full Kelly assumes our model is God. Half-Kelly assumes our model is a guy with a spreadsheet. We are the guy with the spreadsheet."

  ---

  ### 3. The One-Off Case (Single Non-Repeating Events)

  **Do not size one-off bets differently than repeating ones, but cap them stricter.**

  *   **Why:** Geometric growth (Kelly's logic) relies on the Law of Large Numbers to smooth variance. A single election bet does not smooth. It is binary.
  *   **The Trap:** People think "It's one-off, so I should maximize Expected Value (EV)." That is true *if* you can reinvest the proceeds infinitely. You can't. You have a 4-year term. A loss on a one-off bet is permanent capital destruction.
  *   **The Rule:** Treat the election bet as part of the weekly portfolio. Apply the **Event Bucket Cap (15%)** rigorously. Even if Kelly says 25%, you cannot bet 25% on a single binary event with a 1-year horizon.
  *   **Exception:** Only exceed the cap if the fund is *guaranteed* to miss its target without a miracle. Otherwise, survival > moonshot.

  ---

  ### 4. The Backer Clause (The "Reset Option")

  This is the weirdest part of your fund. Economically, this is a **down-and-in put option** on the fund's equity.

  *   **The Math:** The clause has value only if you are near the trigger.
      *   If you are at 90% HWM, the clause is worthless (out of the money).
      *   If you are at 40% HWM (just above trigger), the clause is valuable.
  *   **The Moral Hazard:** If you are at 40% HWM, standard theory says you should bet *bigger*. Why? Downside is capped (Backer saves you), upside is yours.
  *   **The Problem:** It is a **one-time** option. If you trigger it, you get restored to 50%, but you lose the safety net for the remaining year. If you then drop again, you wind up.
  *   **The Recommendation:** **Size as if it doesn't exist, unless you are within 5% of the trigger.**
      *   **Reasoning:** Using the option early (Year 3 of 4) leaves you naked for Year 4. The value of *keeping* the option alive (to protect the final year) outweighs the value of *using* it now.
      *   **Policy:** Adopt a "Self-Denying Ordinance." State in the notes: "The Backer Clause is treated as emergency capital, not trading leverage."
      *   **Disclosure:** Do not disclose sizing changes due to the clause to the general membership. It sounds like you are gambling with the Backer's money. Disclose only to the Backer and Co-signers.

  ---

  ### 5. Worked Applications

  Here is how the protocol handles your three slates.

  #### (a) The Twelve Football Bets (The "Greedy" Slate)
  *   **Inputs:** 12 bets, 4 on same 2 matches. Edges 3–6%. Bankroll $180k.
  *   **Raw Kelly:** Avg edge 4.5%. Avg odds 2.0. Raw Kelly $\approx 4.5\%$. Total raw stake $\approx 54\%$ of bankroll.
  *   **Protocol Filter:**
      1.  **Noise:** Apply 0.5 multiplier. Total stake $\rightarrow 27\%$.
      2.  **Event Bucket:** 4 bets on 2 matches. Cap 15% per match. You likely hit this cap immediately.
      3.  **Horizon:** 1 year left. If you are on pace, cap weekly exposure at 5%.
  *   **Result:** You will likely bet **5% total bankroll**, spread across the 12 bets, heavily trimmed on the correlated matches.
  *   **The "Don't Like It" Answer:** You wanted to bet big because the model is confident. The protocol says "No."
  *   **Why:** Correlation risk. If the model is wrong about *team news* on those two matches, you lose 4 bets simultaneously. That is not 4 independent risks; it is 1 big risk. The 5% horizon cap protects the 4-year target.
  *   **Member Note:** "We identified high correlation risk. Sizing was constrained by event limits to prevent single-match variance from dominating the week."

  #### (b) The March Election (The "One-Off")
  *   **Inputs:** 1 bet. Edge 20% (model says market is wrong).
  *   **Raw Kelly:** High. Could be 15-20% of bankroll.
  *   **Protocol Filter:**
      1.  **Event Bucket:** Cap at 15%.
      2.  **One-Off Rule:** Binary resolution. No rebalancing.
      3.  **Horizon:** 1 year left. Can you afford a 15% loss? If yes, proceed. If no, cut to 5%.
  *   **Result:** Likely **5–10% of bankroll**.
  *   **Why:** Even with a huge edge, a single binary event threatens the 4-year wind-up. You are not a hedge fund with perpetual capital. You are a closed-end fund.
  *   **Member Note:** "Single-event exposure capped to preserve capital for the remaining 52 weeks of the fund term."

  #### (c) The Accumulator Bundle (The "Trap")
  *   **Inputs:** 6 legs. Like 4, indifferent on 2. Book requires all 6.
  *   **Raw Kelly:** Calculate edge on the *whole* accumulator.
      *   If you are indifferent on 2 legs, assume 50% win rate on those.
      *   Multiply probabilities. The edge will vanish or turn negative quickly.
  *   **Protocol Filter:**
      1.  **Edge Check:** If the combined edge is < 2%, **kill the bet**.
      2.  **Correlation:** This is 100% correlated. If one leg fails, all fail.
  *   **Result:** **Do not bet.**
  *   **Why:** You are being forced to bet on markets where you have no edge (the 2 indifferent legs) to access markets where you do. This is negative EV masking as positive EV.
  *   **Member Note:** "Rejected. Required exposure to no-edge markets diluted the value of the edge markets."

  ---

  ### 6. The Member Note (Copy/Paste Draft)

  *For the member complaining about "leaving money on the table":*

  > "Regarding sizing queries: We use a Fractional Kelly approach adjusted for correlation and horizon risk. Full Kelly sizing assumes infinite time to recover from variance and perfect knowledge of our edge. We have neither. We have a 4-year term and a model with known error rates.
  >
  > When we size below theoretical maximums, we are not 'leaving money on the table.' We are paying an insurance premium against model error and correlation risk. In a finite-life fund, avoiding a 30% drawdown is mathematically more valuable than capturing an extra 5% upside, because a deep drawdown requires disproportionate growth to recover before wind-up. Our priority is hitting the target, not maximizing the theoretical ceiling."

  ### Summary of Failure Modes

  1.  **The "Safe" Ruin:** If you follow the Horizon Cap strictly while behind target, you might guarantee missing the target by being too safe. *Mitigation:* The Committee must vote to switch from "Protect" to "Catch-up" mode explicitly if the math says you can't hit the target with 5% weekly risk.
  2.  **The Backer Gamble:** If you ignore the clause and drop to 30% HWM, you trigger the reset. You now have 50% HWM but no safety net. If you lose 20% more, the fund dies. *Mitigation:* The "Self-Denying Ordinance" in Section 4.
  3.  **The Correlation Blindspot:** The "Event Bucket" is a crude proxy for correlation. It won't catch "Rain in London affects all 5 outdoor matches." *Mitigation:* Add a "Weather/Macro" bucket if conditions are unusual.

  This procedure is not optimal for infinite wealth growth. It is optimal for **not blowing up a 4-year fund with 1 year left.**
