answer: |-
  This project asks whether inverse reinforcement learning can distinguish preference from constraint without external normative input, and it argues that the conflation of capacity and desire in inferred reward functions is a non-identifiability problem resolvable only by explicit normative choices about agency.

  **The Research Question and Scope**
  Inverse reinforcement learning (IRL) operates on the assumption that observed behavior is approximately optimal for an unknown reward function, with deviations treated as statistical noise or bounded rationality errors. The specific question this fellowship will address is whether the separation of "preference" (what the agent values) from "constraint" (what the agent can do) is identifiable from behavioral data alone. This is a determinate question within a one-year timeframe because it does not require building new AI systems or collecting empirical datasets; rather, it requires a theoretical analysis of the identifiability conditions inherent in standard IRL formulations. The goal is to produce a formal proof of the absorption problem followed by a philosophical analysis of its implications for preference inference. The scope is limited to the theoretical structure of inference, excluding empirical implementation, to ensure the normative arguments are not obscured by engineering compromises.

  **Why Standard Solutions Fail**
  The obvious technical moves to resolve this ambiguity fail because they treat a normative problem as a statistical one. First, increasing the volume of trajectories does not solve the absorption problem. If an agent lacks a specific skill or faces a permanent structural barrier, their behavior will consistently avoid certain states regardless of their underlying desires. More data simply reinforces the inference that the agent dislikes those states, cementing the constraint into the reward function. Second, employing richer models of bounded rationality does not escape the issue. While models of computational limits or planning costs can account for some deviations from optimality, they require a prior definition of what counts as a "cost" versus a "preference." If the modeler defines planning time as a cost to be minimized, the inference engine will attribute avoidance of complex tasks to laziness rather than inability. Deciding which limitations are constitutive of the agent's rationality and which are external constraints is not a parameter to be learned from data; it is a boundary condition that must be set before learning begins. Consequently, attempts to engineer away the noise term merely shift the normative assumption into the architecture of the bounded rationality model itself.

  **Methodology**
  The research will proceed in three phases. The first phase will formalize the absorption result. I will construct a demonstration showing that for any behavior policy generated by an agent maximizing reward $R$ subject to capacity constraints $C$, there exists an unconstrained agent maximizing a modified reward $R'$ that produces identical behavior. This proof will establish that $R$ and $C$ are non-identifiable from behavior alone without additional assumptions. This is not merely a claim about underdetermination; it is a demonstration that the standard IRL objective function structurally incentivizes the absorption of constraints into rewards.

  The second phase will distinguish between capacity-relative and capacity-free readings of an inferred reward. A capacity-relative reward describes what an agent values given their actual limitations; a capacity-free reward describes what an agent would value if those limitations were removed. I will map existing IRL approaches onto this distinction to show that most current methods implicitly defer to the capacity-relative reading, treating the agent's actual capabilities as the fixed background for inference.

  The third phase will argue that choosing between these readings is a normative commitment about agency. Deferring to the capacity-relative reading commits us to accepting the agent's current limitations as part of their identity, potentially validating adaptive preferences where agents stop wanting what they cannot have. Deferring to the capacity-free reading commits us to a counterfactual theory of agency that risks paternalism, inferring desires the agent does not currently act upon. I will analyze what each stance implies for AI alignment: does aligning to an inferred reward mean helping the agent get what they want within their limits, or helping them overcome the limits that shape what they want?

  **Possible Conclusions and Deciding Considerations**
  The project anticipates one of three conclusions. The strongest conclusion is that IRL is fundamentally incapable of inferring "true" preferences without a prior theory of capacity, meaning that any alignment system based on IRL must explicitly encode a normative theory of human capability. A moderate conclusion is that while non-identifiable in principle, the absorption problem can be managed in practice by restricting inference to domains where capacity constraints are known and stable. The weakest conclusion is that the distinction between preference and capacity is itself illusory, and that preferences are essentially defined by what agents can pursue.

  The consideration that will decide between these outcomes is the stability of the capacity constraints. If constraints are dynamic and influenced by the agent's expectations (e.g., learning skills based on what one values), then the capacity-free reading becomes incoherent, pushing toward the weakest conclusion. However, if constraints are exogenous (e.g., physical laws, resource scarcity), the moderate conclusion holds. I will evaluate this by examining cases of skill acquisition versus structural barriers. If the argument holds that structural barriers are absorbed as preferences, the strong conclusion follows: we cannot infer preferences without first making a normative judgment about which barriers are unjust versus which are constitutive of the agent.

  **Conditions for Failure**
  An honest account of failure is necessary to delineate the project's contribution. The project would fail if it merely restages the familiar philosophical debate about adaptive preferences without adding anything specific to the mechanics of IRL. The literature on adaptive preferences already establishes that people adjust desires to constraints; if this proposal concludes only that "humans adapt," it has not advanced the field of machine learning. To succeed, the project must show that the IRL inference mechanism *accelerates* or *codifies* this adaptation in a way that distinctively harms alignment. Specifically, failure would occur if I cannot demonstrate that the mathematical structure of the loss function in IRL actively penalizes the hypothesis that a constraint exists, thereby forcing the absorption error rather than merely permitting it. If the absorption problem turns out to be a generic feature of all behavioral inference rather than a specific artifact of the optimality assumptions in IRL, the project would lack the targeted significance required for this fellowship. Additionally, the project would fail if the proposed distinction between capacity-relative and capacity-free rewards collapses under scrutiny—for example, if it turns out that no coherent definition of "capacity-free" exists that does not rely on arbitrary idealizations. In such a case, the project would need to pivot to arguing for the inevitability of the capacity-relative view, but this would require showing why this inevitability is a feature rather than a bug for alignment, a position that risks endorsing the status quo of human limitation. Success requires proving that the choice is unavoidable and that recognizing it changes how we must design inference algorithms.
