      *   **Core Claim:** Strong Path Dependence (SPD). Not just "QWERTY won instead of Dvorak" (brand/label), but "the functional capabilities of the system would be fundamentally different if history were re-run with small early perturbations."
      *   **Evolution of Claim:** Admits retreat from specific empirical cases (which are contested) to a claim about the *shape of the space of possible outcomes* (modal claim).
