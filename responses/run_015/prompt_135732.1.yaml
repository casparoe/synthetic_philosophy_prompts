          6.  Focus on arguments that grant the label/functional distinction but show it can't bear the weight.

  2.  **Deconstruct the Philosophical & Economic Context:**
      *   This is a debate rooted in economic history (Arthur, David), sociology (Pierson, Mahoney), and philosophy of technology (Hughes, Winner).
      *   The user is articulating a *modal* claim about history (contingency vs. necessity) coupled with a *functionalist* criterion (capabilities, not brands).
      *   The "retreat upwards" is a classic move to protect a theory from empirical falsification by making it about the *structure of possibility* rather than specific instances.
      *   The methodological demand (name the variable/proxy) is a Popperian/falsificationist constraint on "just-so stories" of inevitability.

  3.  **Brainstorming Defeaters (What counts against SPD?):**
      *   *Convergence:* Different starting points lead to the same functional endpoint. (e.g., different industrialization paths leading to similar productivity).
      *   *Functional Equivalence:* Different technical arrangements solve the same problem equally well. (The "distinction doesn't matter" argument).
      *   *Constraints:* Physics, biology, or human cognition limit the space of possibilities so tightly that divergence is impossible. (The "There Is No Alternative" argument).
      *   *Selection Pressure:* Market/evolutionary pressures weed out inferior functional arrangements quickly enough that path dependence doesn't stick.
      *   *The "Variable" Trap:* The user's demand for a pre-named variable might be impossible for complex systems (equifinality).

  4.  **Ranking Defeaters (Fatal vs. Awkward):**
      *   *Fatal:* Proof that functional space is convex and small (only one peak). Proof that selection pressures overwhelm increasing returns.
      *   *Live/Strong:* Empirical evidence of *functional convergence* despite *technical divergence* (e.g., different railway gauges but same logistics throughput). Evidence that "functional description" is itself theory-laden and unstable.
      *   *Awkward/Weak:* Single counter-examples (e.g., "VHS won, but Betamax was functionally similar"). This just moves the goalposts to "find a bigger difference."

  5.  **Addressing the Methodological Demand (The "Variable" Constraint):**
