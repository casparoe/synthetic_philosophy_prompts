      *   *Live Defeater 2:* **Strong Selection Environments.** In high-stakes environments (war, survival), inefficiency is punished hard enough to erase path dependence.
      *   *Live Defeater 3:* **The Measurement Problem.** The demand for a proxy assumes the variable is measurable. If the "durable variable" is something like "institutional capacity," it's hard to proxy without circularity.

  7.  **Drafting the Response (Iterative refinement):**

