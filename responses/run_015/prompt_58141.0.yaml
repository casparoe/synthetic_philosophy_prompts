answer: |-
  **Welcome to the DeathDodger™ FAQ Hub!**

  We're thrilled you're interested in leveraging our paradigm-shifting approach to mortality management! Below are some common questions about our evidential survival strategies.

  **1. How does the DeathDodger™ algorithm actually work?**
  Great question! Basically, we analyze the causal structure of your impending demise. Since Death is a perfect predictor, your choice of location (Aleppo or Damascus) provides evidence of where Death already is. We help you navigate this correlation matrix so you can feel confused about your survival in a structured, enterprise-grade environment.

  **2. I have a sudden urge to flee to Aleppo. Is that a good sign?**
  Actually, that urge is a critical data point! In evidential decision theory, your current psychological state is evidence of the past prediction. If you feel like fleeing, it's likely because you subconsciously believe Death is in Damascus. But since Death predicted that belief, he's actually in Aleppo. So, that urge is basically a neon sign pointing directly at your appointment time. But hey, awareness is the first step!

  **3. Wouldn't it be safer to just stay in Damascus?**
  Intuitively, yes! But consider the counterfactual. If staying were safer, you'd choose to stay. But if you choose to stay, Death predicted that choice and is waiting in Damascus. Both staying and fleeing feel rational until you realize your rationality is the very variable Death solved for. It's a closed loop of doom, but think of it as a tightly integrated feedback cycle!

  **4. I purchased the "QuantumCoin™" Randomizer Add-on. Does this break the prediction?**
  We love this feature! However, please note that Death predicts your *location*, not just your decision procedure. If you flip a coin, Death simply predicts the outcome of the coin flip ahead of time. Randomization doesn't uncouple the correlation; it just adds a layer of administrative friction to your inevitable encounter. It's great for A/B testing your mortality, though!

  **5. What happens if I buy the "Money-Back-If-You-Die" Guarantee?**
  Caution advised here. Purchasing this guarantee signals a high subjective probability of demise. Death updates on this signal. Essentially, only people who expect to die buy the guarantee, so buying it tells Death you've already given up. This increases the likelihood he waits in whichever city you associate with "refund processing." It's a classic selection bias problem, but at least your heirs get a coupon!

  **6. What is your current success rate for living clients?**
  Our metrics are robust! Currently, 100% of our clients who have completed the program are deceased, which confirms the accuracy of our predictive modeling. However, 100% of our *living* clients haven't died yet! We're leveraging this survivorship bias to secure our Series B funding. It's all about framing the data correctly.

  **7. Can I speak to a survivor for a testimonial?**
  Unfortunately, that cohort is unavailable for comment. They are currently experiencing a permanent offline status. But we have plenty of glowing reviews from their estates! If you have further questions, please submit a ticket. Response times may vary depending on whether Death predicted you'd need support.

  *DeathDodger™: Because you can't cheat fate, but you can monetize the attempt!*
