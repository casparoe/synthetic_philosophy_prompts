answer: |-
  ### Exam Question: Decision Theory Seminar (Final)

  **Topic:** Diachronic Coherence and State-Dependent Utility

  **Prompt:**
  Consider a rational agent who maximizes Expected Utility (EU) but possesses **state-dependent utility**: she values \$100 differently on Tuesday ($U_T$) than on Wednesday ($U_W$). On Monday, she plans her actions for the week. On Tuesday, she receives a credible, non-causal signal: "Today is Tuesday." She must decide whether to accept a bet offered on Monday that pays out on Wednesday.

  Write an essay addressing the following:
  (a) Construct a **diachronic money-pump argument** intended to show this agent is incoherent for changing her valuation between Tuesday and Wednesday.
  (b) Precisely identify the **formal condition** where state-dependence breaks the pump (i.e., why the loss is not "sure" in utility terms).
  (c) Evaluate the normative implications: Is the cheapest fix to (i) ban state-dependent utility, (ii) revise the self-locating updating rule, or (iii) weaken the diachronic coherence requirement? Defend your choice.

  ***

  ### Model Answer

  **Diachronic Coherence with State-Dependent Preferences**

  Standard money-pump arguments establish that cyclic preferences lead to sure losses, violating coherence. In a diachronic setting, this extends to dynamic inconsistency: an agent plans to take a bet on Monday but rejects it on Tuesday, paying a fee to reverse the decision. However, when utility is state-dependent, the normative force of this pump dissolves.

  **(a) The Diachronic Setup**
  Let the states be $S = \{Tuesday, Wednesday\}$. The agent faces a bet $B$ on Monday: pay \$10 now to receive \$15 on Wednesday. On Monday, the agent calculates $EU(B) > 0$ based on her prior belief that Wednesday will arrive. However, utility is state-dependent: $U_T(\$x) \neq U_W(\$x)$. Suppose on Tuesday, the marginal utility of money drops significantly (perhaps she has a spending opportunity unique to Tuesday). Upon receiving the signal "Today is Tuesday," she updates her self-locating belief to certainty. She now evaluates the *remaining* prospect of the bet (paying nothing more, waiting for Wednesday payout). If her Tuesday utility function discounts future money heavily compared to her Monday planning function, she may prefer to pay a penalty \$5 to cancel the bet. A pump operator could offer to reinstate the bet for \$5 on Wednesday morning. If she accepts, she has paid \$10 (Monday) + \$5 (Tuesday) - \$15 (Wednesday) = \$0 net monetary gain, but incurred transaction costs if any existed, or simply cycled preferences.

  **(b) The Break Point**
  The pump fails at the **inter-state utility comparison**. A money pump demonstrates irrationality only if the agent ends up strictly worse off in *her own utility metric*. In standard arguments, money is a proxy for utility, assuming $U(\$)$ is stable. Here, $U_T(\$10) \neq U_W(\$10)$. The agent loses \$10 on Tuesday but gains \$15 on Wednesday. If $U_W(\$15) > U_T(\$10)$, she is not worse off. The "sure loss" is only sure in *cash*, not in *utils*. The coherence argument presupposes a stable numeraire of value across time. State-dependence breaks the transitivity of the preference relation across temporal slices because the relation is indexed to the state: $\succ_T$ is not identical to $\succ_W$. Therefore, violating Reflection or Dynamic Consistency is not necessarily exploitable if the utility function itself shifts exogenously with the state.

  **(c) Evaluating the Fixes**
  We must choose between banning state-dependence, revising updating, or weakening coherence.
  (i) **Banning state-dependence** is descriptively implausible. Agents genuinely value goods differently depending on context (e.g., an umbrella in rain vs. sun).
  (ii) **Revising updating** (e.g., ignoring the "Today is Tuesday" signal) violates probabilistic coherence. If the signal is credible, ignoring it creates a Dutch Book on beliefs, which is a worse violation than preference shifts.
  (iii) **Weakening diachronic coherence** is the cheapest fix. We should restrict money-pump arguments to agents with state-independent utility. Diachronic coherence requires that preferences remain stable *ceteris paribus*. If the state changes the utility function, dynamic inconsistency is a feature, not a bug.

  **Conclusion**
  The agent is not irrational. The money pump relies on the assumption that utility is a stable metric across time. In self-locating contexts with state-dependent utility, the "loss" is merely monetary, not utilitarian. We should weaken the coherence requirement to apply only within stable utility states, preserving the agent's right to value money differently on Tuesday than on Wednesday without fear of exploitation.

  ***

  ### Marking Scheme (20 Marks Total)

  | Point | Requirement | Marks | Common Candidate Botch |
  | :--- | :--- | :--- | :--- |
  | **1** | **Formal Setup:** Correctly defines states ($T, W$), distinct utility functions ($U_T, U_W$), and the bet structure (Monday plan vs. Tuesday execution). | 4 | Treating utility as a single function $U(\$)$ and ignoring the state-indexing, rendering the rest of the argument moot. |
  | **2** | **Pump Mechanism:** Describes the sequence of trades (accept bet $\to$ signal update $\to$ reverse decision) that would constitute a pump in a standard setting. | 4 | Describing a static Dutch Book (simultaneous bets) rather than a *diachronic* pump involving time and updating. |
  | **3** | **The Break Point:** Identifies that the "sure loss" fails because utils are not comparable across states ($U_T \neq U_W$), breaking the transitivity of the *global* preference relation. | 4 | Claiming the pump breaks because of "uncertainty" or "risk," rather than the lack of a common utility numeraire. |
  | **4** | **Evaluation of Fixes:** Critically assesses the three options (ban utility dependence, revise updating, weaken coherence) rather than just listing them. | 4 | Arguing that revising updating is viable without acknowledging that ignoring credible signals invites belief-based Dutch Books. |
  | **5** | **Normative Defense:** Defends a specific resolution (typically weakening coherence) with a justification grounded in the definition of rationality vs. exploitation. | 4 | Sitting on the fence or concluding that state-dependent utility is inherently irrational (missing the prompt's nuance). |

  **Total:** 20 Marks
