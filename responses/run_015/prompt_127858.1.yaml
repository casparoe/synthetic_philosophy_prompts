answer: |-
  An account of social construction is adequate only if it explains the normative leverage of construction without collapsing construction into unreality, accommodates unintended institutional kinds, and distinguishes the metaphysical profiles of race, gender, and money without forcing them into a single ontological mold.

  **Stand on the Base:** Construction is out of **material-infused practices**. Non-intentional and material elements (ledgers, algorithms, housing stock) are **required** in the base, not merely permitted. Intentionality is insufficient for modern social kinds because infrastructure often dictates kind-membership prior to or without agent awareness.

  1.  **Differentiation Capacity**
      *   **Motivating Case:** Gender (where concept and kind are co-constituted and error is difficult) vs. Money (where status functions can fail independently of individual concepts).
      *   **Status:** Non-negotiable.
      *   **Specification:** The account must not demand a single univocal mechanism for all kinds; requiring one is the prejudice of reductionists. Instead, it must offer dimensional flexibility to explain why race allows for error while gender often resists it, without positing entirely separate ontologies.

  2.  **Contrast Preservation**
      *   **Motivating Case:** The inference that because gender is constructed, it is "optional" or "unreal."
      *   **Status:** Non-negotiable.
      *   **Specification:** The account must distinguish construction from the following categories, demonstrating why collapsing them invalidates normative reasoning:

  | Contrast Category | Case Showing Collapse is a Mistake |
  | :--- | :--- |
  | **Caused** | Being caused by society (e.g., a scar) does not make something a social *kind* with normative expectations. |
  | **Chosen** | Race is constructed but not chosen; collapsing these eliminates involuntary oppression. |
  | **Conventional** | Money is conventional but not arbitrary; collapsing these ignores structural constraint. |
  | **Merely Nominal** | Constructed kinds have causal powers; nominalists cannot explain credit denial. |
  | **Subjective** | Constructed facts are objective within the system; subjectivity implies individual whim. |
  | **Fictional/Unreal** | Constructed kinds constrain behavior and distribute resources; fictions do not (unless believed). |

  3.  **Unintended Performativity**
      *   **Motivating Case:** A bank's fraud model creates a statistical cluster that becomes real via feedback loops without initial collective acceptance or intention.
      *   **Status:** Non-negotiable.
      *   **Specification:** The account must explain how a kind becomes socially constructed through causal efficacy and institutional uptake even if no one intended to create the kind or accepted it as a status function.

  **Evaluation of Requirement 3 (Hobbyhorse vs. Desideratum):**
  This is a **genuine desideratum**, not politics in a trench coat. Traditional accounts (e.g., Searle) fail to capture algorithmic governance where intention is decentralized or absent. If social ontology cannot explain how material infrastructure creates kinds without collective acceptance, it is metaphysically inadequate for the 21st century. The requirement forces a move from "Collective Acceptance" to "Causal Institutional Efficacy," which is necessary to explain structural oppression that operates without agents intending it.

  **Flag 1: Exclusion Power**
  **Requirement 3 (Unintended Performativity)** does the most work in excluding candidates. It knocks out the largest share of established views, specifically standard Status Function accounts (Searle) and strict Intentionalist accounts, which presuppose collective acceptance or intention to create a kind as necessary conditions.

  **Flag 2: Compatibility Fault Line**
  Your suspicion is correct: there is a tension between demanding **Metaphysical Neutrality** (construction doesn't change underlying reality) and demanding **Revisionary Normative Conclusions** (construction gives us reasons to change things). While no pair on this specific list is strictly unsatisfiable, the real fault line lies between Requirement 2 (Contrast Preservation, specifically "Unreal") and the "So-What" purpose. If construction implies unreality (a common collapse), you lose normative leverage; if it implies reality, you risk naturalizing the status quo. The account must thread this needle by showing construction creates *institutional* reality that is objective enough to constrain but contingent enough to revise.

  **Scorecard:**
  *   **Causal-Historical:** Fails Req 3 (often ignores material infrastructure); struggles with Req 1 (differentiation).
  *   **Constitutive/Ameliorative:** Passes Req 1 and 3; risks failing Req 2 (sometimes collapses constructed/normative).
  *   **Collectively-Accepted Status Function:** Fails Req 3 (requires intention/acceptance); passes Req 2 (strong on unreality contrast).
