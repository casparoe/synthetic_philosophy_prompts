answer: |-
  **MEMORANDUM**

  **TO:** Director, National Strategic-Risk Unit
  **FROM:** Oversight Committee on Analytical Standards
  **DATE:** 24 October 2023
  **SUBJECT:** Decision on Proposal 7-B: Conditional Updating Protocols

  **1. RECOMMENDATION**

  The Oversight Committee recommends the **adoption of Proposal 7-B with specific modifications**. We advise against the implementation of 'Independence-Preserving Conditionalisation' (IPAC) as a rigid, universal mandate. Instead, the Unit should adopt IPAC as the default analytical baseline, contingent upon the introduction of a **Reporting Act Likelihood Assessment (RALA)**. This procedural safeguard allows analysts to adjust prior probabilities for an antecedent only when they can explicitly justify that the *generation* of the report itself constitutes independent evidence, distinct from the logical content of the conditional.

  Implementation of this modified protocol must be completed within ninety days of this directive.

  **2. REASONING AND EPISTEMOLOGICAL RATIONALE**

  The central tension before this Committee concerns the distinction between learning a *constraint* on the world and learning a *fact* about the world. Proposal 7-B correctly identifies a pervasive cognitive hazard: when an analyst receives a conditional report (e.g., "If Plan Alpha is active, then Plan Beta is inactive"), there is a strong psychological tendency to increase belief in the antecedent (Plan Alpha) simply because it has been mentioned. This is the core dynamic of the Judy Benjamin problem. In such scenarios, the conditional statement restricts the possibility space without necessarily providing empirical data that makes the antecedent more likely than it was prior to the report. To update the probability of the antecedent based solely on the logical structure of the testimony is to conflate a rule of inference with evidence of occurrence.

  However, the Chief Methodologist's objection is well-founded. In strategic intelligence, testimony is never generated in a vacuum. The event of receiving a report is causally linked to the state of the world. Sources do not construct conditionals regarding Plan Alpha unless they possess some indicator—however faint—that Plan Alpha is a live possibility. If the Unit mandates IPAC without exception, we institutionalise a presumption that the reporting channel is independent of the subject matter. This ignores 'selection effects': the probability of receiving a report conditional on Alpha being true is likely higher than receiving it conditional on Alpha being false. To ignore this is to discard signal regarding the source's access and motivation.

  Therefore, a binary choice between strict IPAC and free updating is untenable. Strict IPAC risks blindness to source behaviour; free updating risks cascading false alarms driven by logical confusion. The modified approach proposed herein reconciles these positions by separating the *content* of the testimony from the *act* of testimony.

  **3. PROCEDURAL SAFEGUARD: REPORTING ACT LIKELIHOOD ASSESSMENT (RALA)**

  To address the Methodologist's concern without abandoning the core constraint against antecedent-shifting, the Unit will implement the Reporting Act Likelihood Assessment (RALA). This is a mandatory pre-processing step for all conditional intelligence inputs.

  Under RALA, before applying any conditional updating rule, the analyst must document a likelihood ratio regarding the reporting event itself. Specifically, the analyst must estimate:
  1.  The probability that this specific conditional report would be generated if the antecedent (Plan Alpha) were true.
  2.  The probability that this specific conditional report would be generated if the antecedent were false.

  If the analyst can justify a ratio significantly different from 1:1 based on source access, collection methodology, or adversary deception protocols, they are permitted to update the prior probability of the antecedent *before* applying the conditional constraint. If no such justification exists—if the report's existence is deemed equally likely regardless of the antecedent's truth—the analyst must default to strict IPAC, holding the prior constant.

  This safeguard ensures that belief shifts in the antecedent are driven by evidence regarding the *source's behaviour*, not by the *logical implication* of the report's content. It captures the Methodologist's insight regarding selection bias while maintaining the Committee's firewall against the Judy Benjamin error.

  **4. IMPLEMENTATION TIME FRAME (90 DAYS)**

  *   **Days 1–30 (Training & Calibration):** Development of RALA guidance notes and workshop training for senior analysts. Focus on distinguishing between evidential weight derived from source access versus logical weight derived from content.
  *   **Days 31–60 (Pilot Phase):** RALA applied to high-priority strategic warnings only. Epistemology advisors to audit a sample of assessments to ensure the likelihood ratios are not being gamed to justify preconceptions.
  *   **Days 61–90 (Full Rollout):** Mandatory integration into the analytical workflow software. IPAC becomes the system default unless a RALA justification is logged.

  **5. ASSESSMENT OF COUNTER-ARGUMENTS**

  The strongest argument against this modified approach is that it imposes a significant cognitive burden on analysts during time-sensitive crises. Requiring a formal likelihood assessment of the reporting act may slow down the production of urgent intelligence. Furthermore, there is a risk that analysts, pressured to show 'insight', will manufacture justifications for non-unity likelihood ratios to permit themselves the freedom to update priors, thereby reintroducing the very bias IPAC was designed to prevent.

  We acknowledge this risk. However, the cost of systematic error outweighs the cost of procedural friction. A false alarm generated by conflating conditional constraints with antecedent evidence is more damaging to strategic stability than a delayed assessment. To mitigate the risk of gaming, the audit function during the Pilot Phase must specifically flag RALA justifications that rely on circular reasoning. Ultimately, it is preferable to slow an analyst's hand than to automate their bias.

  **6. CONCLUSION**

  The Committee concludes that while the intuition behind Proposal 7-B is correct, its rigidity is institutionally hazardous. By adopting the RALA safeguard, the Unit can preserve the logical discipline required to avoid Judy Benjamin-style errors whilst remaining sensitive to the evidential value of the reporting channel itself.

  Signed,

  **The Oversight Committee on Analytical Standards**
