      *   **Topic:** The "Miracle on the Han River" (South Korea, 1961-1987) analyzed through Max Weber's thesis on culture and economics.
      *   **Core Question:** Can culture (Confucianism) genuinely cause economic change, or is it just a moral costume for structural forces (authoritarianism, US aid, coercion)?
      *   **Specific Task:** Distinguish two roles of Confucian culture:
