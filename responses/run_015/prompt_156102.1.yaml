          2.  *Permissive Frame:* Removing moral objections to state violence/external capital without supplying motive force.
      *   **Mapping:** Assign specific historical features (Saemaul Movement, export-led model, US security, union suppression) to these roles.
      *   **Critique of Weber:** Where does Weber illuminate? Where does he fall silent/misdescribe (specifically regarding coercion and geopolitics)?
      *   **Theoretical Turn:** Does Korea confirm culture as cause, undermine it (structural sufficiency), or collapse the distinction?
      *   **Constraints:** No bibliographies, no reading lists, no citations. Focus on conceptual architecture.

  2.  **Deconstruct Weber's Thesis (Mental Sandbox):**
      *   Weber argued for "elective affinity" (*Wahlverwandtschaft*), not simple causation. It's not that Calvinism *created* capitalism, but that the psychological sanctions of Calvinism made the *spirit* of capitalism (rational, systematic pursuit of profit as duty) compatible with religious life.
      *   Application to Korea: Is there an affinity between Confucianism and Industrial Capitalism?
      *   Traditional Confucianism: Anti-mercantile, scholar-official ideal, agrarian focus.
      *   Modernized Confucianism (as argued by proponents): Hierarchy, education, group loyalty, deferred gratification.
      *   The Tension: If traditional Confucianism despised merchants, how did it become propulsive? It must have been *transformed* or *instrumentalized* by the state.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the scene. Acknowledge the novelist's perspective (inner convictions vs. steel scaffolds). Introduce the Korean case as the stress test for Weber. Define the stakes: Causality vs. Rationalization.

      *   **Section 1: The Propulsive Mechanism (Culture as Engine):**
          *   *Hypothesis:* Confucian values drove behavior.
          *   *Evidence:* Education zeal (examination culture translated to corporate/technical mastery), deference to authority (family hierarchy -> corporate hierarchy), frugality (high savings rates).
          *   *Weberian Fit:* This looks like the "Protestant Ethic." Inner conviction leads to outer economic action.
          *   *Nuance:* Was it *traditional* Confucianism? Or a state-manufactured version? The *Saemaul Undong* (New Village Movement) fits here. It invoked community duty but was top-down.
          *   *Verdict:* Partial fit. The *energy* was cultural, but the *direction* was state-directed.

      *   **Section 2: The Permissive Frame (Culture as Lubricant/Shield):**
          *   *Hypothesis:* Culture didn't drive growth but allowed the painful means.
          *   *Evidence:* Suppression of labor, long hours, low wages. Why didn't people revolt immediately?
          *   *Mechanism:* Hierarchy and collective duty made suffering for the "nation-family" bearable. It moralized exploitation.
          *   *Mapping:* Union suppression, export discipline. The state said "suffer now for the nation," and Confucian filial piety scaled to the state provided the grammar for acceptance.
          *   *Verdict:* Strong fit. Culture acted as a shock absorber for structural violence.

      *   **Section 3: Where Weber Falls Silent (Coercion and Geopolitics):**
          *   *Weber's Blind Spot:* He focused on *inner* motivation. He didn't account for the gun.
          *   *Korean Reality:* The KCIA, torture, the National Security Law. This isn't "elective affinity"; it's a pistol to the head.
          *   *Geopolitics:* US aid, Vietnam War contracts, access to US markets. This is external luck/structure, not internal culture.
          *   *Critique:* Weber assumes a degree of voluntary alignment. Korea shows alignment can be forced, with culture used to justify the force.

      *   **Section 4: The Theoretical Turn (Causality vs. Collapse):**
          *   *Synthesis:* Did culture cause it? No, not alone. Was it just structure? No, culture made the structure sticky.
          *   *The Collapse:* The distinction dissolves. The state *used* culture as a technology. Culture became structural. Structure became cultural (patriotic education).
          *   *Conclusion:* Weber is right about affinity, wrong about voluntarism. In Korea, the "spirit" was engineered to fit the "machine."

  4.  **Refining the Tone:**
      *   Avoid academic dryness. Use metaphors (scaffold, costume, engine, shock absorber).
