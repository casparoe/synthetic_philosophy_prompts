answer: |-
  Here is a plan for the sixty-minute session, designed to move your audience from seeing looping as "measurement error" to seeing it as "system dynamics."

  ### 1. Pre-requisites: What must be established before the word 'loop'
  **Time: 0–15 minutes**

  You cannot introduce looping until you have disrupted their default model of validity. If they believe a diagnostic category is a ruler that *should* be inert, looping will sound like "the ruler is bending, therefore it is broken." You need them to see the ruler as a *component of the system being measured*.

  Establish these three propositions in order:

  1.  **Validity is Fitness for Purpose, not Correspondence to Truth.**
      *   *The Move:* Remind them that in latent-variable modeling, a construct is defined by its nomological network, not by a "gold standard" biological assay (which they don't have).
      *   *The Goal:* Shift the question from "Does this category track the real thing?" to "What work does this category do in the system?"
  2.  **The Instrument is Part of the Environment.**
      *   *The Move:* Use a brief analogy from their own methods. In survival analysis, if you change the definition of the "event," you change the hazard rate, but you also change the behavior of the subjects (e.g., earlier reporting).
      *   *The Goal:* Establish that the measurement act is an intervention, not an observation.
  3.  **Prevalence Stability is not Evidence of Natural Kindhood.**
      *   *The Move:* Show that a stable prevalence rate can be the result of dynamic equilibrium (flows in and out) rather than static reality.
      *   *The Goal:* Prepare them to accept the "Spillover Loop" without assuming the category is "fake."

  ### 2. The Carrier Case: Autism Spectrum Disorder (ASD) Surveillance
  **Time: 15–35 minutes**

  **Why this case:**
  It avoids the "period curiosity" trap (like hysteria or MPD) because it is a current, high-stakes public health surveillance issue with robust quantitative data (CDC ADDM Network). It speaks directly to their skills: measurement invariance (DSM-IV to DSM-5 restructuring), prevalence series (continuous CDC reporting), and adjacent categories (Intellectual Disability, Language Disorder).

  **What it must have:**
  *   **Prevalence Series:** CDC ADDM data showing the rise from 1 in 150 (2000) to 1 in 36 (2020).
  *   **Criteria Revision:** The DSM-IV (three domains, subtypes like Asperger's) to DSM-5 (two domains, single spectrum) transition. Crucially, the DSM-5 field trials *intended* to tighten criteria and reduce prevalence.
  *   **Adjacent Category:** Intellectual Disability (ID) and Language Disorder.

  **What it must lack:**
  *   **Political Debate:** Do not discuss the neurodiversity movement or the "cure" debate. Treat ASD strictly as a *surveillance category* for service allocation.
  *   **Biological Reductionism:** Do not get bogged down in genetics. Acknowledge heritability but treat the *diagnosis* as the variable of interest.

  **How to deploy it:**
  1.  **Present the Paradox:** DSM-5 tightened criteria (Criterion Loop intervention). Prevalence rose sharply (Data).
  2.  **Apply the Distinction:**
      *   **Presentation Loop:** Increased awareness changed how parents/teachers report behavior (surveillance sensitivity).
      *   **Criterion Loop:** Clinicians adjusted thresholds to maintain service eligibility despite the "tighter" text (coding behavior).
      *   **Spillover Loop:** Children previously coded as ID or Language Disorder were re-coded as ASD to secure specific educational supports. The aggregate "Neurodevelopmental Disorder" prevalence remained more stable than the ASD-specific prevalence.
  3.  **The Payoff:** This explains the paradox without claiming the disorder is "fake" or the data is "wrong." It shows the system adapting.

  ### 3. The Misconception Map
  **Time: 35–50 minutes**

  Anticipate these four reactions in this specific order. Do not wait for questions; weave the answers into the narrative flow.

  **1. The "Artifact" Objection (Collapsing loops into bias)**
  *   *The Thought:* "If the criteria change the count, it's just measurement error/confounding. We need to adjust for it."
  *   *When:* As soon as you show the prevalence rise despite criteria tightening.
  *   *The Move:* **Absorb it.** Acknowledge it looks like bias, but reframe it. "In standard epi, we treat this as noise to be removed. In services research, this *is* the signal. The 'error' is the mechanism of service allocation. If you adjust it away, you are modeling a world that doesn't exist."

  **2. The "Biology" Objection (If it loops, it can't be real)**
  *   *The Thought:* "If social factors change the diagnosis, the disorder must not be biological."
  *   *When:* When discussing the Presentation Loop (self-understanding).
  *   *The Move:* **Defuse it early.** Use a medical analogy: "If I diagnose you with Hypertension, and you start exercising and taking meds because of that label, your blood pressure changes. The label looped on the biology. Does that mean blood pressure isn't real? No. It means the measurement is an intervention."

  **3. The "Nuisance Parameter" Objection (Statistical adjustment)**
  *   *The Thought:* "Can't we just include 'DSM Version' as a covariate in the model?"
  *   *When:* When discussing the Criterion Loop.
  *   *The Move:* **Let it hang, then bridge.** "You can control for the version, but you can't control for the clinicians' reaction to the version. The covariate captures the rule, not the behavior. This isn't a confounder; it's an effect modifier inherent to the system."

  **4. The "Realism" Ambush (Are they real or not?)**
  *   *The Thought:* "So, is Autism a social construct or a natural kind?"
  *   *When:* Mid-discussion, inevitably.
  *   *The Move:* **Decline Adjudication (see below).** Use it to pivot to the Spillover Loop. "Whether it is 'real' doesn't explain why the prevalence went up when criteria tightened. The Spillover Loop explains the numbers regardless of the ontology."

  ### 4. The Final Five Minutes
  **Time: 55–60 minutes**

  **The Assessment Question:**
  Do not ask them to define the loops. Ask them to *locate* the variance.
  > "Take the primary diagnostic category in your current research project. If you found that your prevalence estimates were stable over ten years despite two major criteria revisions, which of the three loops would you hypothesize is doing the heavy lifting to maintain that stability, and what data would you need to prove it?"

  *   *Why this works:* It forces them to apply the distinction to their own work immediately. It tests if they understand the *function* of the loops (explaining stability or change) rather than just the definitions.

  **The Explicit Refusal:**
  You must state this clearly to prevent the session from derailing into debates you cannot win in an hour. Say this verbatim or close to it:

  > "I want to be explicit about what I am *not* here to adjudicate. I am not here to tell you whether Autism (or your category) is a 'Natural Kind' or a 'Social Construct.' I am also not here to evaluate whether the DSM-5 revision process was politically motivated or scientifically sound. Those are important questions, but they are orthogonal to the methodological problem we just discussed. You can believe the category is biologically real and still need to account for the Spillover Loop in your survival analysis. My claim is about the *behavior of the classification system*, not the *ontology of the disorder*."

  ### Summary of Logistics

  *   **00–15:** Establish Validity as Utility; Instrument as Intervention.
  *   **15–35:** ASD Case Study (The Paradox of Tightening Criteria + Rising Prevalence). Introduce the 3 Loops as the solution.
  *   **35–50:** Walk through the Misconception Map (Artifact -> Biology -> Nuisance -> Realism).
  *   **50–55:** Q&A (Managed).
  *   **55–60:** Assessment Question + Explicit Refusal of Ontological/Political Adjudication.

  This plan respects their methodological sophistication, avoids the "philosopher lecturing scientists on reality" trap, and gives them a usable tool for their own data problems.
