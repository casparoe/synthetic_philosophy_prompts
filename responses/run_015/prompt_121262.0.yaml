answer: |-
  The red light on the answering machine blinked once, then held steady. A recording tone.

  Elena stood in the kitchen, the phone cord coiled tight around her wrist like a tether. It was 2:00 AM. David was asleep upstairs. She had packed one bag. She had written a note, but the note was paper, and paper was too light for what this weighed. She needed to leave a voice. But every time she opened her mouth, the ordinary architecture of conversation collapsed.

  *"David, it's me. I'm... I think I need to go."*

  She deleted it. The hesitation made it a question. It invited him to answer, to debate, to fix. It was the syntax of staying.

  *"David. I am leaving. I love you, but I can't."*

  Deleted. Too sharp. The consonants clipped like scissors. It sounded like anger, and this wasn't anger. It was a structural failure, a load-bearing wall giving way. Speech was too porous. It leaked too much of the self-consciousness, the worry about how she sounded, the social mediation of being a wife speaking to a husband. She needed a container that was rigid enough to hold the shape of the truth without buckling.

  She pressed record again. She didn't think about words. She thought about breath. She thought about the beep not as a signal, but as a downbeat.

  She closed her eyes. She imagined the message not as a sentence, but as a phrase. A melodic line. She needed a tempo. Adagio. She needed a key. Minor, but resolved.

  *"David."*

  She held the vowel. She didn't let it drop at the end of the name. She kept it level, on a single pitch, low in her chest. She let the silence after the name stretch for three seconds. In normal speech, that silence would be awkward. Here, in the stylized vacuum of the tape, it became a measure of rest. It became part of the structure.

  *"I am not coming back."*

  She spoke it on a descending third. *I am* (higher), *not coming back* (lower). She didn't inflect it as a plea. She inflected it as a cadence. The rhythm was strict. Four beats. *I. Am. Not. Coming.* She forced her voice to adhere to the meter. The constraint of the rhythm stripped away the wiggle room. She couldn't rush the words to soften them. She couldn't slur them to hide them. The meter demanded clarity.

  She felt the vibration in her throat. It wasn't the roughness of crying. It was the smooth, hard surface of sound. The artifice of the performance—the conscious shaping of the vowel, the deliberate pacing—did something her natural voice could not. It bypassed the part of her brain that negotiated. It bypassed the wife who wanted to be kind. It accessed the woman who was leaving.

  *"I tried to stay."*

  She lifted the pitch here. A suspension. It hung there, unresolved, trembling slightly not from weakness but from intensity. She held the note until her lungs burned. The limitation of her breath forced the truth out; she couldn't hold the note forever, so she had to finish the phrase. The music demanded resolution.

  *"But the house is empty."*

  She didn't mean the house. She meant the marriage. But in the stylized form, the metaphor didn't need explaining. The tone carried the double meaning. The flatness of her voice on *empty* was absolute. It wasn't a complaint. It was a statement of fact, like a note on a staff.

  She paused. The tape hissed. The white noise was the orchestra, waiting.

  She could hang up. She could try to say it normally one more time. But she knew what would happen. She would stumble. She would say *maybe*. She would say *soon*. The prose of ordinary life was built for ambiguity. This medium, this ritual of the beep and the limit and the single take, demanded finality.

  She took a final breath. She found the root note.

  *"Goodbye, David."*

  She didn't let the voice crack. She placed the word *Goodbye* on the beat and cut it off cleanly. No fade out. No lingering.

  She pressed stop. The red light blinked off.

  Elena stood in the silence of the kitchen. She felt hollowed out, but clear. The message was on the tape now, encoded in magnetic oxide, fixed in time. It was no longer hers to edit. The stylization had done its work. It had taken the mess of her feeling and cast it in bronze. She unplugged the phone from the wall. The cord fell from her wrist.

  Upstairs, the house settled. Downstairs, the machine waited to play the truth back, perfectly, whenever he woke up.
