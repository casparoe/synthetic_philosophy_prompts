  **3. The Distinguishing Case**
  The **sixty-one-year-old colleague** best separates the surviving rules. The amputee case distinguished basic locomotion from competitive advantage (defining the *level* of "normal"). The colleague case distinguishes **pathology from normal aging** (defining the *cause* of "need").
  If you fund the colleague, you replace the Pathology rule with a **Functional Deficit** rule (any decline below species-typical peak qualifies). If you deny her, you reaffirm that funding requires disease, not just age-related decline. This is critical for the firefighter: if aging vision isn't pathology, RP must be treated strictly as disease restoration, reinforcing the ban on supra-normal overlays. The colleague case is not redundant; it tests the definition of "medical need" rather than the definition of "normal function."
