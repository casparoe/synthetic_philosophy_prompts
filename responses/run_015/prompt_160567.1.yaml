  Your precedents align with two primary rules: **Diagnosed Pathology** (excludes modafinil, growth hormone) and **Restoration to Age-Adjusted Species Normal** (excludes uncapped hippocampal, testosterone to 20s levels, running blades). Here, "normal" is indexed to **species-typical, age-cohort function**, not occupational role.
