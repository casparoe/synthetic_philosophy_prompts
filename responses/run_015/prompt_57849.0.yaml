  **MEMORANDUM**

  **TO:** City Council and Members of the Reconciliation Task Force
  **FROM:** [Your Name], Task Force Member
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation for Disposition of School Site Proceeds: The Corridor Legacy Home Fund

  **I. RECOMMENDATION**

  I recommend that the Task Force formally advise the City Council to allocate the $2.4 million in proceeds from the vacant school site sale to establish the **Corridor Legacy Home Fund**.

  This Fund will operate as a targeted down payment assistance and home repair program for first-time Black homebuyers and current homeowners residing in the census tracts most affected by the 1960s highway clearance and subsequent disinvestment. To ensure the remedy honors the specific historical tort while addressing ongoing systemic harm, the Fund will employ a **Two-Tier Eligibility Priority**:

  1.  **Tier 1 (Legacy Priority):** Documented descendants of families displaced by the 1960s highway construction or enslaved in the county prior to emancipation.
  2.  **Tier 2 (Community Stability):** Black residents currently living in the affected census tracts who are at risk of displacement due to rising property values or gentrification.

  This recommendation adopts the structure of Proposal Two (Housing Equity) but integrates the moral claim of Proposal One (Descendant Justice) through the priority system. It explicitly rejects Proposal Three (General Affordable Housing) as insufficient to address the specific injury at hand.

  **II. PROGRAM DESIGN**

  *   **Eligibility:** Applicants must identify as Black/African American and demonstrate current residence or prior family residence in the designated "Impact Zone" (the census tracts corresponding to the cleared business district and surrounding disinvested neighborhoods). Tier 1 applicants must provide genealogical documentation (e.g., census records, deeds, oral history affidavits) linking them to displaced families or pre-emancipation ancestors in the county.
  *   **Form and Size of Awards:**
      *   **Down Payment Assistance:** Grants of up to $75,000 for eligible home purchases within the Impact Zone or adjacent stable neighborhoods.
      *   **Repair/Retention Grants:** Grants of up to $40,000 for current homeowners to address code violations, accessibility issues, or energy efficiency, preventing forced displacement.
      *   **Genealogy Support:** A set-aside of $150,000 (approx. 6% of total) to subsidize professional genealogical research for Tier 1 applicants to assist in documentation.
  *   **Administration:** The Fund shall be administered by a community-based nonprofit organization with experience in affordable housing and financial counseling, overseen by a committee comprising Task Force members and community representatives. Funds will be disbursed directly to closing agents or licensed contractors.
  *   **Timeline:** Administration contract to be secured within 6 months. Application window to open within 9 months. All funds must be committed within 36 months.

  **III. MORAL RATIONALE: MATCHING THE HARM**

  The moral imperative of this Task Force is to identify a remedy that corresponds to the nature of the wrong. The harm inflicted on this neighborhood was not merely a temporary inconvenience; it was an asset strike. The clearance of the Black business district and the systematic denial of federally backed mortgages to Black buyers in the mid-20th century prevented the accumulation of intergenerational wealth.

  In settling my own father's estate, I discovered that my family's ability to fund my education relied entirely on equity gained from a home purchased with a federally backed mortgage—a vehicle effectively unavailable to Black families in this county at the time. That housing equity was not just shelter; it was a launchpad for opportunity. To deny the current community that same mechanism is to perpetuate the original injury.

  Therefore, a cash grant (Proposal One), while acknowledging the debt, offers a one-time consumption benefit. A general housing fund (Proposal Three) dilutes the remedy among those who did not suffer the specific exclusion. Only a **Housing Equity Fund** replicates the specific advantage that was denied. It transforms the remedy from a payment for the past into an investment in the future, allowing recipients to build the same kind of intergenerational security that was systematically withheld from their ancestors and granted to mine.

  **IV. ADDRESSING THE REJECTED COURSE**

  Several members have advocated for **Proposal Three: General Affordable Housing Open to All Residents**. The strongest moral consideration favoring this course is the principle of **social cohesion**. Proponents argue that race-specific programs are inherently divisive, that "enough time has passed" to move toward universalism, and that helping all low-income residents regardless of race fosters greater political unity and avoids resentment.

  This consideration is sincere, but it does not prevail because it mistakes **equality of treatment** for **equity of outcome**. To treat all residents equally now is to ignore that they did not start equally then. The funds in question are not general tax revenue; they are the proceeds of a school site located in a neighborhood specifically destroyed by public policy to the detriment of Black residents. Using these specific funds for general purposes would be akin to selling a stolen vehicle and using the proceeds to benefit the general public rather than the victim.

  Furthermore, the argument that targeted repair is "divisive" places the burden of cohesion on the victims of the fracture rather than the architects of it. True reconciliation requires acknowledging the specific breach. A race-neutral approach effectively erases the history of the highway clearance and the redlining that followed. It prioritizes the comfort of the majority over the justice owed to the harmed community. We cannot build unity on a foundation of unacknowledged debt.

  **V. SYNTHESIS OF PROPOSALS ONE AND TWO**

  While I recommend the Housing Fund structure (Proposal Two), I acknowledge the moral force of Proposal One (Descendant Grants). Limiting aid only to current residents might exclude descendants who were forced to move away due to the very disinvestment we seek to repair.

  However, a pure cash grant model risks being consumed by immediate financial pressures without generating lasting wealth. By adopting the **Two-Tier Priority**, we honor the specific claim of descendants (Tier 1) while recognizing that the *systemic* harm of disinvestment continues to affect Black residents in the tract today (Tier 2). This hybrid approach ensures that the specific victims are served first, satisfying the demand for corrective justice, while the mechanism of repair (housing equity) ensures the benefit endures, satisfying the demand for transformative justice.

  **VI. CONCLUSION**

  We have an opportunity to convert the proceeds of a vacant lot into occupied homes, and the legacy of displacement into a foundation for stability. This recommendation does not ask the city to bear a new cost, but to direct an existing asset to its moral owners. It acknowledges that while we cannot change the past, we can alter the trajectory of the future by providing the very tool—housing equity—that determined the divergent paths of my family and my neighbors' families seventy years ago.

  I move that the Task Force adopt the **Corridor Legacy Home Fund** as described above and forward this recommendation to the City Council for immediate appropriation.
