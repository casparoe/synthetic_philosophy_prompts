          *   *The Problem of Time (Canonical Quantum Gravity):* In Wheeler-DeWitt, $H\Psi = 0$. Time disappears. If substantivalism relies on a manifold that is "smeared out" or eliminated in the fundamental theory, the classical rescue might be an artifact of the effective theory.
