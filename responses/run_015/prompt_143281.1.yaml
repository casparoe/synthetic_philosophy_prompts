answer: |-
  # SPEAKER'S PREP SHEET: DIACHRONIC ASYMMETRY
  **Workshop:** Intergenerational Equity and Climate Policy
  **Thesis:** Zero pure time preference (PTP) intra-generation; Positive PTP inter-generation.
  **Goal:** Navigate Q&A without collapsing into inconsistency or irrelevance.

  ---

  ## 1. THE OPERATIONAL CLIFF (Policy Analysts & Treasury)
  **Likelihood:** Very High | **Damage:** High (if handled defensively)
  **The Objection:** *"You propose a switch from a zero discount rate to a positive one at a 'generational boundary.' In a cost-benefit framework, that creates a discontinuity. If a project's benefits span the boundary, do we value year 50 at 100% and year 51 at 90%? How do you define the cutoff without creating perverse investment incentives or arbitrary cliffs?"*

  *   **Concede Up Front:** Acknowledge that a hard "cliff edge" in the discount schedule is operationally unworkable and creates the arbitrage incentives they fear.
  *   **Hold at All Costs:** The *moral* distinction is real even if the *administrative* line is fuzzy. Do not retreat to a standard declining discount rate without justifying *why* it declines (i.e., the fading of narrative bonds).
  *   **Weakest Point:** The definition of "generation." Is it 20 years? 30? Overlapping? If you waffle here, the model looks unimplementable.
  *   **2-Minute Reply:** "You're right that a step-function discount rate is bad engineering. I'm not proposing a cliff; I'm proposing a *slope* based on the degree of overlapping agency. Within a living cohort, narrative continuity is near-total, so PTP is zero. As we move beyond the overlap of living memory and direct reciprocity, the 'diachronic bond' thins. We can model this as a smooth, declining discount rate that asymptotes to a positive pure time preference, rather than a binary switch. The cutoff isn't a date; it's a function of relational distance. The Treasury can operationalize this as a specific schedule, provided the *justification* for the decline is the fading of moral obligation, not just uncertainty."
  *   **Likely Follow-up:** *"If it's just a smooth declining rate, how is this different from the standard Weitzman-Gollier approach? Why do we need the metaphysical baggage?"*
      *   **Prep:** "Because the *shape* of the decline matters. Standard models decline due to uncertainty about future rates. Mine declines due to the erosion of specific moral obligations. It changes how we weigh catastrophic tail risks versus steady consumption flows."

  ## 2. THE PARFIT OBJECTION (Moral Philosophers)
  **Likelihood:** High | **Damage:** Critical (if handled poorly)
  **The Objection:** *"Parfit argued that 'mere location in time' is morally arbitrary, just like location in space. You've conceded this for individuals, but you're reinstating it for generations. If temporal distance itself isn't a moral ground, why does the lack of 'narrative continuity' license discounting? Are you saying we owe less to people simply because they are born later?"*

  *   **Concede Up Front:** Agree that *time itself* is not morally relevant. Do not defend "time" as a metric.
  *   **Hold at All Costs:** The relevance lies in *agency and relationship*, not time. Time is merely the proxy for the breakdown of reciprocal care and narrative identity.
  *   **Weakest Point:** The claim that narrative continuity doesn't exist across generations. (Grandparents care about grandchildren). If they press on familial bonds, your "non-overlapping" claim weakens.
  *   **2-Minute Reply:** "I agree with Parfit that time itself is neutral. My claim isn't about temporal location; it's about the *conditions of agency*. Within a life, I am bound to my future self by psychological continuity and prudential rationality—I literally inhabit that future. Across non-overlapping generations, that metaphysical bond is broken. We are distinct moral agents dealing with scarcity between separate groups. Discounting here isn't about devaluing *them*; it's about acknowledging that without overlapping agency, we cannot demand the same sacrificial obligations we owe to our own future. It's a limit on obligation, not a reduction in their moral status."
  *   **Likely Follow-up:** *"But climate change affects the preconditions for their existence, not just their welfare. Does your 'scarcity' framework allow sacrificing their existence for our consumption?"*
      *   **Prep:** "No. Distributive fairness under scarcity presupposes recipients. Existence is a prior condition to justice. My view mandates preserving the capacity for future agency, even if it discounts their specific welfare flows."

  ## 3. THE RAMsey CONSISTENCY CHALLENGE (Climate Economists)
  **Likelihood:** Medium | **Damage:** Medium-High
  **The Objection:** *"In the Ramsey equation, the pure time preference rate ($\delta$) is usually constant. If you make $\delta$ time-dependent, you violate the assumptions of standard intertemporal optimization. Doesn't this create dynamic inconsistency? If I know the rate changes in 30 years, won't I game the system to realize all benefits before the switch?"*

  *   **Concede Up Front:** Acknowledge that a time-varying $\delta$ complicates standard dynamic programming.
  *   **Hold at All Costs:** $\delta$ is a normative ethical parameter, not a market observation. It *should* vary if our ethical obligations vary. Do not let them treat it as a market interest rate.
  *   **Weakest Point:** Dynamic inconsistency. If the plan isn't time-consistent, rational agents won't follow it.
  *   **2-Minute Reply:** "Standard Ramsey assumes a single representative agent with constant preferences. We are modeling a chain of distinct agents with changing moral relations. Yes, this introduces complexity, but dynamic inconsistency is a feature, not a bug, of intergenerational problems. We solve this not by forcing a constant $\delta$, but by institutional commitment—binding future policy to the schedule. The 'gaming' risk you mention is exactly why we need the zero rate *now*: to prevent the current generation from discounting its own future welfare to exploit the pre-switch period. The model accounts for the shift in moral topology, not just capital returns."
  *   **Likely Follow-up:** *"Does this violate Pareto efficiency between generations?"*
      *   **Prep:** "Pareto efficiency assumes fixed preferences. We are arguing the ethical weights themselves shift. It's a different optimization problem."

  ---

  ## 4. THE "DANGEROUS QUESTION" (The One to Fear)
  **Question:** *"If you apply a positive pure time preference to the far future, doesn't that mathematically vanish the obligation to prevent low-probability, high-impact existential risks (like tipping points) occurring 150 years out? Essentially, does your view justify ignoring human extinction if the cost to us is high enough?"*

  **Why It Is Structurally Dangerous:**
  1.  **It bypasses the metaphysics:** It doesn't matter *why* you discount; if the math says extinction is "cheap" to prevent, the room will turn.
  2.  **It contradicts the context:** This is a *Climate Policy* workshop. If your theory implies we can ignore catastrophic climate outcomes because they are "far away," you have argued yourself out of a job.
  3.  **It exposes the "Scarcity" trap:** You said justice is "distributive fairness under scarcity." If the future doesn't exist, there is no scarcity, there is no distribution. Your framework might lack the vocabulary to mandate existence-preservation.

  **How to Survive If Asked:**
  *   **Do NOT** say "Yes, but..." or try to calculate the cost of extinction.
  *   **Do** distinguish between *welfare flows* (which are discountable) and *capacity for agency* (which is not).
  *   **The Line:** "My argument applies to the distribution of *welfare* (consumption, utility) across generations. It does not apply to the *preconditions of existence*. A positive pure time preference on welfare does not license actions that eliminate the possibility of future agents. We must distinguish between 'how well they live' (subject to discounting under scarcity) and 'whether they live at all' (a constraint on the optimization problem). Climate policy must first satisfy the existence constraint before applying the discount rate to welfare."

  ---

  ## TACTICAL NOTES FOR THE ROOM
  *   **For the Economists:** Keep saying "Normative Parameter." Remind them $\delta$ is ethics, not math.
  *   **For the Philosophers:** Keep saying "Agency," not "Time." If you say "Time matters," you lose Parfit.
  *   **For the Policy Analysts:** Keep saying "Smooth Schedule," not "Cutoff." Avoid the cliff.
  *   **General Demeanor:** You are inverting Stern-Nordhaus. Own the inversion. Do not apologize for the positive rate; frame it as the only way to make current sacrifices *sustainable* without demanding impossible heroism from the present.
