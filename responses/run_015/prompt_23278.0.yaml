      *   *Core Idea:* MEU violates Dominance and Dynamic Consistency.
      *   *Accuracy:*
          *   *Dominance:* Does MEU reject a bet that pays off under *every* distribution? Actually, standard MEU (Gilboa-Schmeidler) *does* satisfy State-wise Dominance. If Act A > Act B in every state, the minimum expected utility of A will be > minimum expected utility of B. *However*, the Decision Theorist might be referring to a specific scenario involving mixing or information revelation where MEU behaves oddly (e.g., rejecting a sure gain in favor of status quo if the status quo is defined oddly, or issues with *ex-ante* vs *interim* evaluation). Wait, let's look closer. If I have a set of priors $C$, and I evaluate $\min_{p \in C} E_p[U]$. If Act A yields \$10 in all states and Act B yields \$5 in all states, $E_p[A] > E_p[B]$ for all $p$, so $\min E_p[A] > \min E_p[B]$. So MEU *does not* violate basic dominance.
