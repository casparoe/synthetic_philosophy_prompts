prompt: |-
  I've spent a lot of time in the rationalist and effective-altruism literature, so I think about moral questions in terms of expected value, marginal dollars, cost-effectiveness, and moral uncertainty. I have now started reading the philosophical literature on the demandingness objection to consequentialism, and I would like you to restate it in the vocabulary I actually use, as faithfully as you can.

  Specifically, I want you to take the three most influential versions of the demandingness objection — the basic objection that consequentialism is too demanding because it requires you to sacrifice your own interests whenever doing so would produce a better overall outcome; Williams's integrity objection, that consequentialism fails to respect the personal projects and commitments that give your life meaning; and the separateness-of-persons objection, that consequentialism aggregates utility across persons as if they were a single entity — and restate each of them in terms of expected value, marginal utility, cost-effectiveness, the shallow-pond thought experiment, discounting, moral uncertainty, satisficing versus optimizing, and feasibility constraints.

  For each objection, tell me what translates cleanly, what has to be distorted to fit, and what has no expression at all in my vocabulary. Then give me the residue report: which of the philosophers' claims map cleanly onto the expected-value framework, which translate only with distortion, and which cannot be expressed in it at all. And here is the part I most want to see: is the residue a defect of the expected-value framework — that is, does the framework simply lack the concepts to represent these kinds of moral claims — or is it a sign that the philosophical claims are less clear or less substantive than they first appeared, such that when you try to pin them down in precise terms, they turn out to be conflations or ambiguities that dissolve under scrutiny?

  I want to know whether my intuition — that the demandingness objection is just a practical question about how much I can afford to give, and that the integrity and separateness objections are just disagreements about the aggregation function — is right, or whether it is missing something that the philosophers are getting at.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Profile:** Deeply familiar with Rationalist/EA vocabulary (expected value, marginal dollars, cost-effectiveness, moral uncertainty, shallow pond, etc.). Skeptical of traditional philosophical objections to consequentialism (specifically demandingness).
      *   **Task:** Restate three specific demandingness objections (Basic, Williams's Integrity, Separateness of Persons) using the user's EA/Rationalist vocabulary.
      *   **Analysis Requirements:** For each objection, identify what translates cleanly, what distorts, and what has no expression.
      *   **Residue Report:** Categorize claims (clean, distorted, inexpressible).
      *   **Core Question:** Is the "residue" (the stuff that doesn't fit) a defect of the EV framework (missing concepts) or a defect of the philosophical claims (ambiguity/conflation)?
      *   **User's Hypothesis:** Demandingness = practical budget constraint; Integrity/Separateness = disagreements about aggregation. Is this right or missing something?

  2.  **Deconstruct the Three Objections:**

      *   **1. The Basic Demandingness Objection:**
          *   *Standard Form:* Consequentialism requires too much sacrifice (e.g., giving until you're as poor as those you help).
          *   *EA Translation:* This is essentially a constraint on the *marginal utility of consumption*. It's about the point where $dU(self)/d$ = $dU(other)/d$.
          *   *Fit:* Very high. EA talks about this constantly (e.g., "How much should I donate?").

      *   **2. Williams's Integrity Objection:**
          *   *Standard Form:* Consequentialism alienates agents from their "ground projects" and makes them mere channels for utility. It violates personal integrity.
          *   *EA Translation:* This looks like a constraint on the *utility function* itself. If "integrity" matters, it must be in $U$. But Williams says it's about the *structure* of agency, not just another preference.
          *   *Fit:* Problematic. EA treats integrity as a preference to be weighed. Williams treats it as a constitutive condition of agency.

      *   **3. Separateness of Persons (Rawls/Nozick):**
          *   *Standard Form:* Utilitarianism treats society as a super-person, ignoring boundaries between individuals. Sacrificing one for many is like sacrificing a present pain for a future gain, but that analogy fails across persons.
          *   *EA Translation:* This is about the *aggregation function*. Linear sum vs. prioritarian vs. sufficientarian vs. rights-constraints.
          *   *Fit:* Moderate. EA discusses aggregation (total vs. average, risk neutrality), but usually accepts interpersonal comparability and summation.

  3.  **Drafting the Translations (Iterative Process):**

      *   *Basic:* "You are optimizing a global objective function $U_{total}$. The constraint is your budget $B$. The objection says the optimal solution $x^*$ requires $consumption_{self} \to subsistence$. In EA terms: The marginal utility of money for the global poor is so high that the equilibrium point is extremely low for the agent."
      *   *Integrity:* "You have a set of 'ground projects' $P$. These generate utility $U(P)$. But Williams says you can't just treat $P$ as inputs to $U_{total}$. You need a 'agency constraint' $A$. If optimizing $U_{total}$ violates $A$, the action is invalid, not just suboptimal." -> *Distortion:* EA treats $P$ as preferences. Williams treats them as identity-constituting.
      *   *Separateness:* "You are summing utilities $\sum U_i$. The objection says the boundary conditions between $i$ and $j$ matter. You can't just maximize $\sum$. You need a weighted sum or a leximin constraint." -> *Distortion:* EA usually accepts summation but debates weights. The objection challenges the *legitimacy* of summation itself.

  4.  **Analyzing the Residue (The Crux):**

      *   *User's Hypothesis:* "Demands = budget," "Integrity/Separateness = aggregation."
      *   *My Assessment:* The user is half-right but missing the *deontic* vs. *axiological* distinction.
      *   *Demands:* Yes, largely a calculation of marginal utility + psychological burnout constraints (feasibility).
      *   *Integrity:* Not just aggregation. It's about *agent-relative reasons*. EV is agent-neutral. Williams is arguing for agent-relative constraints that cannot be reduced to "I prefer having integrity."
      *   *Separateness:* It is about aggregation, but specifically about *rights as side-constraints* vs. *rights as goals*. EV frameworks struggle with hard constraints (infinity costs) vs. trade-offs.

      *   *Is the residue a defect of EV or Philosophy?*
          *   *Option A (EA View):* Philosophy is vague. Once you formalize "integrity" as a preference, it dissolves.
          *   *Option B (Philosopher View):* EV is reductionist. It misses the phenomenology of agency and the normative force of boundaries.
          *   *Synthesis:* It's likely a clash of *frameworks*. EV is a decision theory. These objections are often about the *nature of normativity*. However, from a strict meta-ethical realist perspective, if "integrity" doesn't cash out in terms of outcomes (experienced welfare), it's hard to justify its weight *except* as a preference.
          *   *Verdict:* The user's intuition is *mostly* correct regarding *action-guidance*, but misses that the philosophers are often attacking the *meta-ethical foundation*, not just the calculation. However, for a pragmatic agent, the user's translation is sufficient *unless* they care about meta-ethics.

  5.  **Refining the Output Structure:**

      *   **Introduction:** Acknowledge the translation task.
      *   **Section 1: The Basic Demandingness Objection.** (Translate to Marginal Utility/Feasibility).
      *   **Section 2: Williams's Integrity Objection.** (Translate to Utility Function Constraints/Identity).
      *   **Section 3: Separateness of Persons.** (Translate to Aggregation Functions/Bounds).
      *   **Section 4: The Residue Report.** (Clean, Distorted, Inexpressible).
      *   **Section 5: The Verdict.** (Addressing the User's Hypothesis).

  6.  **Developing the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "EA is right." I need to be faithful to the philosophers *in EA terms*.
      *   *Nuance on Integrity:* Williams isn't saying "I like my projects." He's saying "I *am* my projects." In EA terms, this is like saying "Deleting this variable crashes the program," not "This variable has low weight."
      *   *Nuance on Separateness:* Rawls isn't just saying "Use a prioritarian function." He's saying "Summation is category error." In EA terms, this is like saying "You can't add apples and oranges," whereas EA says "We have a common currency (QALYs/hedons)."
      *   *The "Residue" Question:* This is the most important part. I need to be honest. If the EV framework can't express "agent-relative obligations," that is a feature of EV, not necessarily a bug, but it means EV is *consequentialist* by definition. If the philosophers are pointing out that consequentialism is false, then the residue is evidence against EV as a *complete* moral theory. But if the user accepts consequentialism, the residue is just "noise." I should frame this carefully: The residue exists because the frameworks have different *axioms*.

  7.  **Final Polish:** Check tone. Respectful, analytical, precise. Use the requested vocabulary (marginal dollars, shallow pond, etc.). Ensure the "Residue Report" is distinct and clear.

      *(Self-Correction on the "Defect" question)*: I need to avoid taking a side but provide the analysis that lets the user decide. However, the prompt asks *me* to evaluate. I should argue that the residue indicates a *category mismatch*. The philosophers are often making meta-normative claims, while EV is a decision procedure. When translated, the "force" of the objection often turns into a parameter tweak (e.g., "weight integrity higher"), which suggests the philosophical *absolute* claim dissolves into a *weighting* claim. This supports the user's suspicion but warns against dismissing the underlying intuition entirely (e.g., burnout is real).

      *Wait, one more thing:* The user asked: "is the residue a defect of the expected-value framework... or is it a sign that the philosophical claims are less clear...?"
      *My stance:* It's mostly the latter, *provided* you accept welfarist consequentialism. If you don't, the residue is the point. I will frame it as: The EV framework forces operationalization. If the philosophical claim cannot be operationalized, it lacks action-guiding content *within that framework*.

  8.  **Final Review against constraints:**
      *   Did I use the vocab? (Expected value, marginal dollars, etc.)
      *   Did I cover all three objections?
      *   Did I do the Residue Report?
      *   Did I answer the specific hypothesis question?

