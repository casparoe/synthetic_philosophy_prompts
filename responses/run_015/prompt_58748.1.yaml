      *   *The Real Conflict:* If Claim 3 says Fission is "Double Survival" (Good), Claim 5 cannot say Double Replica is "Death" (Bad) unless there is a relevant difference between Hemispheres and Scanning. But Claim 2 says Scanning is fine. So the difference must be the *Branching*.
      *   *Parfit's View on Branching:* Branching does not negate "what matters." It only negates strict *identity* (because identity is 1:1).
      *   *User's Claim 5:* Says Branching negates *survival/anticipation*. This is Anti-Parfitian.
