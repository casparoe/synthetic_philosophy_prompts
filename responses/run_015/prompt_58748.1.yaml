      *   **Nuance on Claim 4:** Claim 4 is actually tricky for Parfit. Parfit usually says in Original+Replica, the Original survives (identity holds because it's not branching *from the perspective of the original's continuation*? No, Parfit says identity is indeterminate or holds because the other is a *branch*? Actually, Parfit often accepts the Non-Branching view for *identity* but says *what matters* is still there). I need to be careful here. Parfit's view in *Reasons and Persons* is that in fission, identity does *not* hold, but survival does. In Claim 4, the user says "I go with the original." This implies Identity *does* hold with the original. This is consistent with a "Non-Branching View of Identity" (like Nozick or Lewis) combined with Parfitian Reductionism about *what matters*.
      *   *Wait, check Claim 4 again:* "I go with the original, the replica is a distinct new person." This implies Identity holds with Original.
