      *   **Priya's Argument:** Causal inertness. Supplier restocks in fixed batches. One less sale doesn't change orders. Expected utility replies fail because probabilities are unknown/unknowable.
      *   **Sam's Argument:** The "Carryover Rule." Unsold units go into a buffer. When the buffer hits a threshold (a crate), the next delivery is cut. Individual acts accumulate.
      *   **Key Engagement Points:**
          *   Sam must explain why a stored contribution counts as *his* doing something even if it doesn't cross the threshold alone.
          *   Priya must push back on the "rounding worry" (does the buffer delete fractional units?) and critique fairness/"do your share" replies.
          *   Tone: Equally sharp, no strawmen, genuine engagement.
          *   Ending: No tidy resolution, end on the real remaining disagreement.

  2.  **Character Voices:**
      *   **Priya:** Analytical, skeptical, focused on causal mechanisms and epistemic limits. Pragmatic about supply chains.
      *   **Sam:** Principled, focused on collective agency and complicity. Willing to accept complex causal structures.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Set the scene (canteen/cafeteria). Immediate engagement with the sandwich.
      *   **Priya's Opening Salvo:** State the causal inertness argument clearly. Fixed batches.
      *   **Sam's Counter:** Introduce the "Carryover Rule" (the mechanism invented in section).
      *   **Priya's Pushback (The Rounding Worry):** If the system only tracks crates, what happens to the single sandwich? Does it get rounded down? If so, it's lost.
      *   **Sam's Defense:** It's not about rounding; it's about being part of the set that triggers the cut. The "stored contribution" argument.
      *   **Priya's Epistemic/Fairness Pushback:** Even if the mechanism exists, how do I know? And why does "doing my share" matter if the outcome is the same? Critique the fairness argument (free-rider problem).
      *   **Sam's Response on Complicity:** It's not just outcome; it's about not being part of the demand signal.
      *   **Closing:** Identify the core disagreement (Causal vs. Complicity/Participation). No handshake.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I make Priya's probability argument strong enough? *Adjustment:* Make sure she emphasizes that we don't *know* the carryover rule exists or how it works.
      *   *Check:* Did Sam explain the "stored contribution" well? *Adjustment:* He needs to use an analogy or specific logic about threshold cases. The "drop in the bucket" analogy is cliché, so let's make it more technical about the buffer log.
      *   *Check:* Is the "rounding worry" clear? *Adjustment:* Priya needs to ask if the buffer stores *units* or just *crate counts*. If it stores units, Sam is okay. If it rounds, Priya wins. Let's assume it stores units but triggers on crates. Priya's point is about the *deletion* of moral credit if the threshold isn't met.
      *   *Check:* Fairness argument. Priya needs to reject "just do your share." Why? Because if others don't do their share, her sacrifice is wasted.
      *   *Check:* Ending. Needs to feel unresolved but substantive.

  5.  **Drafting the Dialogue (Iterative Process):**

      *   *Scene:* University canteen.
      *   *Priya:* "You're not actually going to get the veggie wrap."
      *   *Sam:* "Chicken's off the menu."
      *   *Priya:* Explains the batch order. 50 sandwiches. If 49 sell, they order 50 next time.
      *   *Sam:* Brings up the Section mechanism. The Buffer.
      *   *Priya:* The Rounding Worry. If the buffer holds 9 sandwiches and needs 10 for a crate, and I skip one, does it count?
      *   *Sam:* It counts as *part* of the cause.
      *   *Priya:* But if the trigger doesn't fire, the chickens still die. Your "part" didn't save a life.
      *   *Sam:* It's about the signal.
      *   *Priya:* Fairness argument. "If I don't buy, but 10 others do, I'm a sucker."
      *   *Sam:* It's not about being a sucker; it's about not wanting to be the demand.
      *   *Priya:* Epistemic uncertainty. We don't know the buffer exists.
