answer: |-
  **Setting:** *The university canteen, Tuesday afternoon. The line is moving slowly. Priya holds a tray with a veggie wrap; Sam is staring at the hot counter.*

  **Priya:** You're hesitating. Don't do it.

  **Sam:** Do what? Buy the sandwich?

  **Priya:** Buy the chicken. You know the argument. The canteen orders from the supplier in fixed batches. Fifty units, one crate. If they sell forty-nine today, they still order fifty next week. If they sell fifty, they still order fifty. Your purchase is causally inert.

  **Sam:** I remember the paper. But we talked about this in section. The "Carryover Rule."

  **Priya:** The hypothetical mechanism? Come on, Sam.

  **Sam:** It's not just hypothetical. It's how inventory management works. The supplier's system logs every unsold unit in a buffer. It doesn't just look at daily sales; it looks at the surplus. If the buffer accumulates enough skipped purchases—enough unsold sandwiches—it cuts the next delivery by a whole crate. My skipped purchase isn't lost the moment it fails to trigger an order change on its own. It's stored.

  **Priya:** Stored where? In the moral ledger? Because in the actual supply chain, data gets rounded. That's my worry. If the buffer threshold is ten units, and there are currently nine unsold sandwiches logged, my refusal makes ten. Great, a crate is cut. But if there are eight, and I make nine, the system doesn't order 0.9 of a crate. It rounds down. My single unit is deleted the second it's logged because it didn't complete the set.

  **Sam:** But it *contributed* to the set. That's the point of the buffer. It solves the threshold problem. In the standard model, if I don't hit the threshold, my action does nothing. In the carryover model, my action persists. It waits for other people's skipped purchases to combine with it.

  **Priya:** Persists how? Physically, the chicken is already dead. The sandwich is already made. If the threshold isn't crossed, that chicken was wasted, and the next crate arrives anyway. You're saying your contribution counts because it *might* combine with others later. But that relies on other people. If they don't show up, your "stored" refusal vanishes into the noise. Why does a stored contribution that never on its own crosses the threshold count as *you* doing something?

  **Sam:** Because I'm not trying to save a chicken single-handedly. I'm trying to not be part of the demand that kills it. If the buffer holds my refusal, I have successfully signaled non-demand, even if the supplier hasn't reacted yet. The moral weight isn't in the immediate outcome; it's in the participation in the mechanism that *does* produce outcomes.

  **Priya:** That sounds like a fairness argument dressed up as causality. "I should do my share because if everyone did their share, it would work." But everyone isn't doing their share. Most people don't know about the buffer. Most people don't care. If I sacrifice my lunch preference based on a mechanism that requires collective compliance to actually save a life, and that compliance doesn't exist, I've just suffered for no reason. The chicken still dies.

  **Sam:** It's not about suffering. It's about complicity. If I buy the sandwich, I am actively engaging the mechanism that kills chickens. If I don't, I am engaging the mechanism that cuts orders. Even if the cut doesn't happen *today*, I have aligned myself with the side that reduces production.

  **Priya:** But you don't know which side reduces production! That's the epistemic gap. You're assuming the buffer exists, that it tracks units accurately, that it doesn't reset weekly, that the supplier actually honors the cut. The probability is unknowable. The expected-utility reply tries to paper over this by saying "there's *some* chance I trigger the threshold," but you're admitting I probably won't trigger it alone. So you're relying on the fairness norm: "Just do your share."

  **Sam:** I'm relying on the fact that the buffer makes the threshold less relevant.

  **Priya:** Does it? If the buffer rounds down—and most digital inventory systems do to simplify reordering—then my unit is gone. It's not stored. It's deleted. And even if it is stored, why am I responsible for the aggregate? If ten of us skip, a crate is cut. If only five of us skip, nothing happens. If I skip, and only four others do, I've done my "share," but the outcome is zero. Why is "doing my share" a reason for action when the share only has value if others complete it?

  **Sam:** Because if I don't do my share, I guarantee the outcome stays the same. I become a necessary condition for the status quo.

  **Priya:** You're a necessary condition for *this specific sandwich* being sold, sure. But not for the crate order. That's determined by the batch. You're conflating purchasing with ordering.

  **Sam:** I'm saying purchasing *drives* ordering, through the buffer. Look, imagine the buffer is at nine units. You buy the sandwich. The buffer resets to zero. You didn't just fail to save a chicken; you actively wiped the progress of nine other people's ethical choices.

  **Priya:** That's dramatic. But let's accept the buffer exists. Let's accept it stores units. My point is about the *reason*. You say I have a reason to skip because my skip is stored. I say I have no reason to skip because the storage is morally invisible until it triggers a crate cut. If it never triggers, the storage is a fiction. It's like putting money in a bank that never opens. You can say you're "saving," but if you can't withdraw, you're just hoarding paper.

  **Sam:** But the bank does open. That's the system.

  **Priya:** *If* enough people deposit. Which brings me back to fairness. You're asking me to bet on strangers. If I skip, and the buffer doesn't fill, I've lost my lunch and saved nothing. If I buy, I get lunch, and the chicken dies either way. Where is the reason to skip?

  **Sam:** The reason is that you can't know the buffer won't fill. And if you buy, you know you've added to the count that keeps it full.

  **Priya:** I know I've added one. But if the system requires ten to act, and I add one to a pile of two, my addition is functionally identical to doing nothing. The "carryover" doesn't change the causal inertness of the individual unit; it just delays the realization of that inertness. You're waiting for a miracle of coordination and calling it a moral strategy.

  **Sam:** I'm calling it a recognition of how systems work. You're treating the supply chain like a series of isolated transactions. It's a flow. My refusal enters the flow.

  **Priya:** And if the flow drains into a hole before it reaches the supplier, it's gone. You haven't answered the rounding worry, Sam. If the system logs in crates, my unit is deleted. If it logs in units but only acts on crates, my unit is inert until it becomes a crate. Until then, it's moral dead weight. Why carry dead weight?

  **Sam:** Because it's not dead. It's latent.

  **Priya:** Latent potential isn't a reason for action. Otherwise, I should spend every minute buying lottery tickets because my contribution is "stored" in the jackpot pool.

  **Sam:** That's different. The lottery is designed for one winner. The supply chain is designed to match demand.

  **Priya:** Is it? Or is it designed to minimize waste and maximize efficiency, which means smoothing out individual fluctuations like... one student skipping a sandwich?

  **Sam:** *[Pauses, looking at the counter]* The buffer exists to prevent waste. That's why it tracks unsold units.

  **Priya:** And if tracking those units doesn't change the order, it's just data. Look, I'm not saying it's good to buy the chicken. I'm saying you don't have a *reason* not to, based on the consequences. You're smuggling in a deontological constraint—"don't be part of the killing"—but you're justifying it with consequentialist mechanics. The mechanics don't hold up under the rounding error.

  **Sam:** Maybe the mechanics aren't the whole point. Maybe the reason is that I refuse to be the person who buys the chicken when there's a mechanism, however imperfect, that allows me not to.

  **Priya:** So you admit it. The buffer doesn't give you a consequentialist reason. It just gives you a way to feel clean while the crate order stays the same.

  **Sam:** No. It gives me a reason to believe my action isn't lost. Whether that's consequentialist or...

  **Priya:** Or whether that's just wishful thinking about supply chain logistics.

  **Sam:** *[Steps forward in line]* I'm getting the wrap.

  **Priya:** Good. But don't tell yourself it saved a chicken.

  **Sam:** I'll tell myself it didn't kill one.

  **Priya:** Same thing, if the order doesn't change.

  **Sam:** We'll see.

  **Priya:** No, we won't. That's the problem. We never know.
