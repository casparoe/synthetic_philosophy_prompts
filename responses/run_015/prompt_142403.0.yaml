      *   *Priya:* That's Pascal's Wager for chickens.

      *(Self-Correction on the "Carryover Rule" details)*: The prompt says the buffer logs each unsold unit and cuts delivery by a *crate* when the buffer passes a set size. Priya's rounding worry is: "If the buffer only records whole crates, my single unit is deleted." I need to make sure Sam clarifies the buffer records *units* but acts on *crates*. Priya's point is that if the buffer resets or rounds, the unit is lost. Let's refine that. Priya argues that if the threshold isn't met, the moral weight vanishes.

      *(Refining the Fairness Objection)*: Priya needs to attack the "fair play" argument. If the system relies on collective action, and the collective fails, why is the individual obligated?

  6.  **Final Polish:**
