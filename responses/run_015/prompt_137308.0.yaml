  # A Taxonomy of Buddhist Ethical Positions

  This tree sorts positions by substantive claims. Follow the branches by accepting or rejecting each claim. The leaves represent stable positions found in Buddhist discourse.

  **ROOT: What settles whether an action is "right" or "skillful"?**

  *   **BRANCH A: The downstream consequences (what happens).**
      *   **BRANCH A1: Whose consequences count?**
          *   **Claim:** *The agent's own future karmic experience matters more than the immediate welfare of others.*
              *   **Accept:** → **BRANCH A1-i: Are the precepts breakable to secure a better karmic future?**
                  *   **Accept:** → **[EMPTY CELL: Karmic Opportunism]**
                      *   *Status:* **Incoherent.** In Buddhist causality, breaking a precept *is* the seed of bad fruit; one cannot break a rule to improve one's karmic future.
                  *   **Reject:** → **LEAF 1: Karmic Prudence**
                      *   *Awkward Commitment:* You should not save the passengers if doing so requires an act that ruins your own meditation or future rebirth.
                      *   *Handles:* The Gift (giving to the virtuous yields more merit for *you*); The Insect (intention determines the karmic seed).
              *   **Reject:** → **BRANCH A1-ii: The welfare of all sentient beings counts equally.**
                  *   **Claim:** *Does the spiritual status of the recipient change the moral weight of the outcome?* (e.g., Is harming a saint worse than harming a sinner?)
                      *   **Accept:** → **LEAF 2: Hierarchical Welfarist**
                          *   *Awkward Commitment:* Saving a Bodhisattva is objectively more important than saving an ordinary person, even if the physical suffering prevented is identical.
                      *   **Reject:** → **BRANCH A1-iii: Are the precepts absolute constraints on maximizing welfare?**
                          *   **Accept:** → **LEAF 3: Rule Minimizer**
                              *   *Awkward Commitment:* You must let the captain kill the passengers because breaking the precept causes worse long-term confusion and suffering.
                          *   **Reject:** → **LEAF 4: Flexible Minimizer**
                              *   *Awkward Commitment:* Killing the captain is not just permitted but morally required if it minimizes total suffering.
                              *   *Handles:* The Captain (kill him); The Monastery (stealing is permissible if no one suffers).

  *   **BRANCH B: The constitution of the agent's mind or character.**
      *   **BRANCH B1: Does the moral assessment depend on the outcome at all?**
          *   **Accept:** → *(Returns to Branch A)*
          *   **Reject:** → **BRANCH B1-i: Is rightness settled solely by the volition at the moment of acting?**
              *   **Accept:** → **LEAF 5: Intentionalist Formalist**
                  *   *Awkward Commitment:* If you try to kill someone but miss, you have committed the exact same moral wrong as if you had succeeded.
                  *   *Handles:* The Insect (accidental stepping is morally neutral); The Monastery (stealing is wrong only if accompanied by greed).
              *   **Reject:** → **BRANCH B1-ii: Rightness is defined by what expresses a liberated character.**
                  *   **Claim:** *For a fully liberated being (Arhat/Buddha), is there still a correct answer to the question "What should I do?"*
                      *   **Accept:** → **LEAF 6: Liberated Exemplar**
                          *   *Awkward Commitment:* In the empty monastery, the Arhat does not steal even though it changes nothing for anyone, because stealing is incompatible with who she *is*.
                          *   *Handles:* The Monastery (distinguishes from Leaf 4); The Captain (Arhats do not kill).
                      *   **Reject:** → **LEAF 7: Spontaneous Accord**
                          *   *Awkward Commitment:* It is meaningless to say the Arhat *ought* to have saved the passengers; she either acts or she does not, and normative language no longer applies.
                          *   *Handles:* The Captain (no "should," only compassion); The Monastery (no "should," only flow).

  ***

  ### Notes on the Taxonomy

  **1. The Empty Monastery Test**
  This case discriminates between **Leaf 4 (Flexible Minimizer)** and **Leaf 6 (Liberated Exemplar)**, confirming your suspicion.
  *   **Leaf 4** says: If no one owns the food and no one suffers, taking it is morally neutral or good.
  *   **Leaf 6** says: Taking it is wrong because "taking" expresses a subject-object duality and greed that a liberated one does not possess, regardless of external consequences.

  **2. Verbal Distinctions**
  *   **Leaf 3 (Rule Minimizer)** and **Leaf 6 (Liberated Exemplar)** often agree on action (e.g., "Do not kill the captain") but differ on *why*. Leaf 3 says "Do not kill because it leads to bad outcomes long-term." Leaf 6 says "Do not kill because a liberated one does not kill." This is a substantive difference in normative grounding, not merely verbal, though in practice they converge on most precepts.
  *   **Leaf 1 (Karmic Prudence)** and **Leaf 2 (Hierarchical Welfarist)** both account for the "Gift" case (virtue of recipient matters). Leaf 1 frames it as *my* merit increasing; Leaf 2 frames it as the *act's* weight increasing. These are often treated as verbally distinct descriptions of the same mechanism in the texts.

  **3. The Insect Case**
  *   **Leaf 4 (Flexible Minimizer)** struggles here: Harm was done, so it is bad, but blame is low.
  *   **Leaf 5 (Intentionalist Formalist)** handles this cleanly: No intention to kill, no moral wrong.
  *   **Leaf 1 (Karmic Prudence)** handles this cleanly: No volitional seed planted, no karmic fruit.

  **4. The Captain Case**
  *   **Leaf 4** is the only view that *requires* killing.
  *   **Leaf 6** and **Leaf 3** forbid it.
  *   **Leaf 7** denies the obligation exists.
  *   **Leaf 1** forbids it (bad karma for the killer).
