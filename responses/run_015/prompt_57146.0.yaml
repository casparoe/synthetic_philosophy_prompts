  5.  **Final Polish:** Ensure the tone is sharp, academic, and directly addresses the "stress-test" request. Avoid fluff. Make sure the distinction between "plan" and "intention" in the psychology section is clear. Ensure the "Invulnerability" verdict is nuanced.

