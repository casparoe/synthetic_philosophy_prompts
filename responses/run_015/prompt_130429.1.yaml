answer: |-
  You are not confusing yourself. You have independently reconstructed the two central problems in the modern philosophy of statistical mechanics and cosmology. Your intuition that these are distinct complaints is correct, and the literature distinguishes them sharply, though they are often discussed in the same breath.

  Here is the map of the territory you are exploring, the names for the specific phenomena you've identified, and an analysis of the "ways out" you mentioned.

  ### 1. Complaint One: The Presupposed Asymmetry
  **The Phenomenon:** You observe that explaining the arrow of time by positing a low-entropy past merely relocates the asymmetry to the boundary condition without explaining its origin. It feels like the explanation assumes the very thing (a special direction/status for one end of time) it ought to derive.

  **The Established Vocabulary:**
  *   **The Past Hypothesis:** This is the name for the move you are critiquing. It is the postulate that the universe began in a state of extremely low entropy. In the framework of David Albert (in *Time and Chance*), this is treated as a fundamental law-like constraint.
  *   **The Double Standard:** This is the specific name for your logical complaint. It was coined (or at least popularized) by the philosopher Huw Price in *Time's Arrow and Archimedes' Point*. Price argues that physicists routinely apply a "double standard" to time: they treat the past boundary as requiring a special explanation (or special status) while treating the future boundary as open, or vice versa, without a neutral justification. When you say the story "buys its conclusion by slipping in the same kind of asymmetry one step earlier," you are describing the **Double Standard**.
  *   **The Problem of the Source of the Arrow:** This is the broader category. It asks: If the micro-laws are time-symmetric, where does the macro-asymmetry come from?

  **Is it Circular?**
  Strictly speaking, it is not *logical* circularity (A implies A). It is **explanatory regress**. In the cue ball case, the regress stops at a contingent fact (the arm moved) that does not share the *structural shape* of the phenomenon being explained (the scattering). In the time case, the regress stops at a contingent fact (the low-entropy start) that *does* share the structural shape of the phenomenon (temporal asymmetry).
  Price's point is that if you demand an explanation for why entropy increases toward the future, you must, by symmetry, demand an explanation for why it was low in the past. If you simply assert the past was low, you haven't explained the asymmetry; you've just named it.

  ### 2. Complaint Two: The Minimal Freaks
  **The Phenomenon:** You observe that if you try to explain the low-entropy state as a random fluctuation from equilibrium (rather than a hard boundary), the probabilities dictate that small fluctuations (brief, isolated observers) are vastly more likely than large fluctuations (an entire ordered universe/history). Therefore, the theory predicts you should not be the kind of observer you observe yourself to be.

  **The Established Vocabulary:**
  *   **The Boltzmann Brain Problem:** This is the exact name for this complaint. Ludwig Boltzmann suggested that our observable universe might be a rare statistical fluctuation in an eternal, high-entropy cosmos. The counter-argument is that a fluctuation large enough to contain a galaxy is exponentially less probable than a fluctuation large enough to contain a single brain with false memories of a galaxy.
  *   **Cognitive Instability:** This is the consequence you identified ("you shouldn't expect to be seeing what you're apparently seeing"). If a theory predicts that your observations are likely delusions (fluctuation artifacts), the theory undermines the evidence used to support it.

  **Are These One Phenomenon or Two?**
  They are **two distinct logical problems**, though they function as a pincer movement against naive explanations of time.
  1.  **Complaint 1 (Double Standard)** attacks the *Past Hypothesis* for being brute and asymmetric.
  2.  **Complaint 2 (Boltzmann Brains)** attacks the *Fluctuation Hypothesis* (the alternative to the Past Hypothesis) for being empirically self-defeating.

  They are linked dialectically: We accept the **Past Hypothesis** (and endure Complaint 1) specifically because we want to avoid the **Boltzmann Brain Problem** (Complaint 2). We choose the "unexplained boundary" over the "random fluctuation" because the fluctuation model makes our existence improbable. You are right to separate them; one is a metaphysical dissatisfaction (why this boundary?), the other is an empirical probabilistic disaster (why this history?).

  ### 3. The "Perspectival" Move
  **The Position:** "The direction isn't out there... it has to do with where we're standing."
  **The Name:** **Perspectival Realism** or **Agent-Relative Arrow**.
  **Key Proponent:** Huw Price again.

  **Does it escape the circle?**
  It attempts to **dissolve** the problem rather than solve it. It argues that the "flow" of time is not a feature of the block universe but a feature of agents embedded within it who have epistemic access to the past (records) but not the future.
  *   **Does it relocate the bump?** Yes. It moves the asymmetry from the *world* to the *observer's epistemic situation*.
  *   **The Catch:** Critics argue this just pushes the problem back. Why do agents *only* exist on one side of the entropy gradient? Why do records *only* form in one direction? If the physics is symmetric, why are the agents asymmetric? Usually, to explain the agent's asymmetry, you have to appeal to the thermodynamic asymmetry (Complaint 1), so the bump often reappears. However, strict perspectivalists argue that once you index "past" and "future" to the agent's orientation, the "Double Standard" charge loses its force because there is no "view from nowhere" to apply the standard neutrally.

  ### 4. The "Boundary Condition" Move
  **The Position:** "The unscrambled start is simply a boundary condition... and needs no more explanation."
  **The Name:** **The Past Hypothesis as a Brute Fact** (or sometimes **Nomological Past Hypothesis** if treated as a law).
  **Key Proponent:** David Albert.

  **Does it work?**
  *   **Pragmatically:** Yes. It saves the predictions of statistical mechanics and avoids the Boltzmann Brain problem.
  *   **Philosophically:** It relies on a distinction you flagged in your cue ball analogy. Albert argues there *is* a relevant difference between the cue ball and the Big Bang.
      *   In the cue ball case, we expect a causal story because the event is *internal* to the temporal history.
      *   In the Big Bang case, the event *defines* the temporal history. There is no "before" to causally link to.
      *   Therefore, demanding a causal explanation for the initial boundary is a category error. It is a **Law of Nature** (in the Humean sense) that the universe starts this way.
  *   **Your Intuition:** You felt this "looks like the same move again in a fancier coat." Many philosophers agree with you. Calling it a "Law" stops the questioning by fiat. It works, but it leaves the **Source of the Arrow** unexplained. It accepts Complaint 1 as the price of avoiding Complaint 2.

  ### Summary of the Landscape

  | Your Complaint | Established Name | Status in Literature |
  | :--- | :--- | :--- |
  | **"Slipping in asymmetry earlier"** | **The Double Standard** (Price) | Widely accepted as a valid critique of non-perspectival accounts. |
  | **"Minimal freaks / Boltzmann Brains"** | **The Boltzmann Brain Problem** | Considered a fatal flaw for Fluctuation Hypotheses. |
  | **"Time is where we're standing"** | **Perspectivalism** | A viable minority view; dissolves the ontology but complicates the epistemology. |
  | **"It's just a boundary condition"** | **The Past Hypothesis** (Albert) | The dominant working view in physics; accepts brute asymmetry to save prediction. |

  **Verdict on your intuition:**
  You are correct to split the complaints.
  1.  **Complaint 1** is the **Double Standard**. It highlights that the *Past Hypothesis* does not *explain* the arrow; it *posits* it.
  2.  **Complaint 2** is the **Boltzmann Brain Problem**. It highlights that the *Fluctuation Hypothesis* is empirically incoherent.

  The current consensus (such as it is) is to accept the **Past Hypothesis** (and thus live with Complaint 1) because the alternative (Fluctuation) triggers Complaint 2, which is worse. We prefer an unexplained boundary to a theory that predicts we are hallucinations.

  If you want to read the definitive mapping of exactly what you have thought through, read Huw Price's *Time's Arrow and Archimedes' Point* (for Complaint 1 and the Perspectival view) and David Albert's *Time and Chance* (for the defense of the Past Hypothesis and the handling of Complaint 2). You have effectively reinvented the central dialectic of that literature.
