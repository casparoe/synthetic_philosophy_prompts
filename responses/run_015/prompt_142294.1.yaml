answer: |-
  This is a classic historiographical frustration. The slogan "History is written by the victors" is what we might call a *zombie claim*: it refuses to die despite being empirically fragile and philosophically ambiguous. It functions less as a true proposition and more as a conversational shield against nuance.

  To help you dismantle this at dinner, I have brainstormed the possible philosophical interpretations of the sentence, ranging from the trivial to the incoherent. I will then evaluate them, apply them to your brother-in-law's two specific claims, and address your hunch about skepticism.

  ### The Menu of Readings

  Here are six distinct claims hidden inside that slogan, sorted by plausibility.

  **1. The Literal/Bibliographic Claim**
  *   **Claim:** The physical act of composing historical chronicles is disproportionately performed by the administrative apparatus of the winning state.
  *   **Verdict:** **Trivial.** Obviously, winning states have more surplus capital to fund scribes. But losers write memoirs, diaries, and counter-histories constantly. This doesn't imply the *content* is false, only that the *volume* is skewed.

  **2. The Archival Veto Claim**
  *   **Claim:** Victors control the archive; they destroy inconvenient evidence and preserve flattering evidence.
  *   **Verdict:** **Substantive and Defensible.** This is the strongest version. Archives are not neutral; they are power technologies. The Spanish *did* burn Maya codices. However, this claims *bias*, not *ignorance*. It means we must read against the grain, not that we cannot read at all.

  **3. The Hegemonic Narrative Claim**
  *   **Claim:** The victor's ideology becomes the "common sense" framework through which future generations interpret events.
  *   **Verdict:** **Substantive and Defensible.** This is Gramscian. It explains why certain questions aren't asked. However, hegemony takes time to build and can be contested (e.g., revisionist history).

  **4. The Military Determinism Claim**
  *   **Claim:** Military victory *automatically* guarantees cultural and narrative dominance immediately following the conflict.
  *   **Verdict:** **False.** This is empirically falsifiable. As you noted, the Confederacy lost militarily but won the narrative war in the South for a century (the Lost Cause). Military power $\neq$ Cultural power.

  **5. The Epistemic Skeptic Claim**
  *   **Claim:** Because sources are biased by victory, we are not justified in believing *any* reconstructive claims about the past.
  *   **Verdict:** **False.** This commits the "perfect solution fallacy." The fact that testimony is biased does not mean truth is inaccessible. Historians use triangulation (archaeology, linguistics, opposing accounts, climate data) to correct for bias. Bias is a calculable variable, not a wall.

  **6. The Metaphysical Constructivist Claim**
  *   **Claim:** There is no "past" independent of the narrative; the victor literally *creates* the reality of the past by speaking it.
  *   **Verdict:** **False (and incoherent).** This confuses ontology (what happened) with epistemology (what we know). The Spanish burning books did not change the fact of the burning, nor the demographic reality of the pre-contact Americas.

  ---

  ### Analysis of Your Brother-in-Law's Uses

  #### Case 1: The Spanish Conquest (1500s)
  *   **His Claim:** We can't trust *anything* we know because the Spanish burned the books.
  *   **Reading Required:** He needs **Reading 5 (Epistemic Skeptic)**. He is moving from "sources are filtered" to "knowledge is impossible."
  *   **Does he get it?** **No.**
      *   *Why:* He is smuggling in the idea that *only* written indigenous accounts count as truth. But historiography isn't just reading books; it's cross-referencing. We have Spanish accounts (biased), indigenous accounts (some survived, e.g., the Florentine Codex, or were written later in alphabetic script), archaeology, and epidemiology.
      *   *The Archival Reality:* Archives survive by accident as much as design. The Spanish bureaucracy was obsessed with paperwork; they generated millions of pages of internal memos (*Relaciones Geográficas*) that often contradict their own propaganda because different factions within the victors were fighting each other. The "Veto" (Reading 2) is real, but it doesn't grant the "Skepticism" (Reading 5) he wants.

  #### Case 2: Civil War Memorials
  *   **His Claim:** The North won, so their version belongs on the memorial; arguing is pointless.
  *   **Reading Required:** He needs **Reading 4 (Military Determinism)**. He assumes military victory translates immediately to the right to define memory.
  *   **Does he get it?** **No.**
      *   *Why:* This is empirically wrong. As you pointed out, the "Lost Cause" mythology (a Southern narrative) dominated US textbooks and memorials from 1890 to 1970. The military victors (the North) largely abandoned the reconstruction of memory to appease the defeated elite.
      *   *The Nuance:* If he shifts to **Reading 3 (Hegemonic Narrative)**, he might argue that the *Federal Government* eventually enforced a narrative. But that proves the slogan wrong in its common usage: it wasn't the "victors of 1865" who wrote the history, it was the "political coalition of 1900." The slogan implies the war decision settles the history; reality shows the history is settled by later political deals.

  ---

  ### The "Veto vs. Author" Distinction

  Your hunch here is philosophically sound and crucial.

  1.  **Victors having a Veto (Negative Power):** This is the power to destroy. The Spanish burning codices is a Veto. This supports the idea that the record is *incomplete*.
  2.  **Victors being the Authors (Positive Power):** This is the power to persuade. This supports the idea that the record is *biased*.

  **Your Hunch:** You suspect that "filtered sources" $\neq$ "can't know anything."
  **Verdict:** **You are right.** You are not smuggling anything in; you are identifying a logical gap.
  *   In philosophy of science, this is the difference between *theory-laden observation* and *impossibility of observation*. Just because a telescope has a tinted lens (victor's bias) doesn't mean you can't see the star (the past). It just means you have to account for the tint.
  *   Historiography is the method of accounting for the tint. If your brother-in-law says "We can't know," he is claiming the lens is opaque. It isn't; it's just colored. We can measure the refraction.

  **The "Lost Cause" Problem:**
  This breaks his Civil War argument completely. If the slogan meant "Whoever holds power *afterwards* writes history," it would be a tautology (Power defines narrative). But he is using it to mean "The side that won the *war* defines the history." The Lost Cause proves that the side that lost the war can write the history if they retain local social power. Therefore, "Victors" is an ambiguous term. If it means "Military Winners," the slogan is false. If it means "Cultural Hegemons," the slogan is trivial (powerful people influence culture).

  ### Strategy for Dinner

  1.  **Grant the Veto, Deny the Skepticism:** Agree that the Spanish burned books (Reading 2). But ask: "Does burning a book make the events inside it disappear, or just harder to verify?" If we have three Spanish accounts that accidentally agree on a massacre because they were arguing about *who* led it, we still know the massacre happened.
  2.  **Deploy the Lost Cause:** Ask him: "If history is written by the victors, why did my high school textbook in the 1990s say the Civil War was about States' Rights? The South lost. Did they win a secret war?" This forces him to redefine "victor" so broadly that the slogan loses its punch.
  3.  **The Memorial Point:** Argue that memorials aren't about "what the victors say," they are about "what the community agrees to remember." If the North won, why are there Confederate statues? Because the "victors" chose reconciliation over truth. That's a moral failure of the victors, not proof that truth is impossible.

  \answer{(1) Epistemic Nihilism (False); (2) Military Determinism (False)}
