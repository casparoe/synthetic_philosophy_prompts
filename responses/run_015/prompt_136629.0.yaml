answer: |-
  You have identified one of the oldest, most persistent, and most frustrating ambiguities in the history of philosophy. You are not inventing these categories; you are walking directly into the schism that tore the original Pragmatist movement apart in the early 20th century.

  Here is the carving you are looking for.

  ### 1. The Family Name
  The broad family is **Pragmatism**. However, the specific rhetorical move you are identifying—switching between these definitions to deflect objections—is best described as **The Truth-Warrant Slide** (or **Epistemic Conflation**).

  In formal rhetoric, this is a specialized version of the **Motte-and-Bailey Doctrine**.
  *   **The Bailey (The Strong Claim):** "This belief is *True*." (Implies correspondence to reality, objectivity, permanence).
  *   **The Motte (The Defensible Claim):** "This belief is *Useful/Warranted*." (Implies psychological comfort, social consensus, or action-guiding success).
  *   **The Slide:** When you challenge the Truth (Bailey), they retreat to Utility (Motte). When you dismiss Utility as irrelevant to Truth, they slide back to Truth, using the authority of the Utility to prop it up.

  ### 2. The Lineage: Who is Who?
  You were right about the two guys who started the tradition and couldn't stand each other.

  *   **Case (a) "It works for me / makes me a better dad":** This is **William James**.
      *   *View:* **Humanistic Pragmatism.** Truth is the "cash value" of an idea. If a belief pays dividends in lived experience, it is true *for the believer*.
      *   *Vulnerability:* It allows contradictory truths (true for you, false for me) and makes truth mutable.
  *   **Case (b) "What inquiry would land on in the long run":** This is **C.S. Peirce**.
      *   *View:* **Scientific/Realist Pragmatism.** Truth is the opinion "fated to be ultimately agreed to by all who investigate." It is objective and independent of what you or I think *now*.
      *   *Vulnerability:* It is unverifiable in the present (we can't know the end of inquiry).
      *   *Note:* Peirce was so horrified by James's popularization of Pragmatism (Case A) that he renamed his own philosophy **"Pragmaticism"**—a name "ugly enough to be safe from kidnappers."

  *   **Case (c) "We can't act without presupposing it":** This is **Transcendental Pragmatism** (or Kantian Pragmatism).
      *   *Lineage:* Immanuel Kant, P.F. Strawson, Karl-Otto Apel.
      *   *View:* Certain beliefs (like free will, or an external world) are **indispensable**. We cannot *but* believe them to function as agents. Therefore, they are "true" in a practical-transcendental sense, even if we can't prove them empirically.
      *   *Status:* This is a legitimate philosophical position, but often used rhetorically to shut down metaphysical questions by calling them "idle."

  *   **Case (d) "True for us (in this room)":** This is **Social Constructivism** or **Consensus Theory**.
      *   *Lineage:* Later Wittgenstein, Richard Rorty, some readings of Habermas.
      *   *View:* Truth is simply what a specific community agrees to let pass as true. There is no "view from nowhere."
      *   *Status:* Often used in corporate or political settings to conflate *authority* with *accuracy*.

  ### 3. The Axes of Difference
  To visualize the "breakage" you sense, plot these views on three axes. The slide happens when an arguer moves along an axis without announcing it.

  1.  **The Temporal Axis:**
      *   *Now:* (Case A & D) Truth is determined by current utility or current agreement.
      *   *End of Time:* (Case B) Truth is determined by the limit of infinite investigation.
  2.  **The Scope Axis:**
      *   *Individual:* (Case A) True for *me*.
      *   *Local Community:* (Case D) True for *us*.
      *   *Ideal Community:* (Case B) True for *any rational inquirer*.
  3.  **The Direction of Fit:**
      *   *World-to-Mind:* (Realism) The belief is true because it matches the world. (Peirce leans here).
      *   *Mind-to-World:* (Instrumentalism) The belief is true because it helps us navigate the world. (James leans here).

  **The Breakage:** The argument breaks because **Warrant does not equal Truth.**
  A belief can be *warranted* (useful, agreed upon, indispensable) but *false* (not corresponding to reality). The slide relies on the audience assuming that if a belief is highly warranted, it *must* be true. The arguer exploits this assumption to avoid proving the correspondence.

  ### 4. The Single Question
  You want a question that forces them to commit to one coordinate on the map, preventing the slide. You need to separate the *value of the belief* from the *fact of the matter*.

  **The Question:**
  > **"If we knew for certain that this belief was factually false, but holding it still made you a better dad / helped the team function / was necessary to act—would you still call it 'true'?"**

  **Why this works:**
  *   **If they say "Yes":** They are committed to **Jamesian Pragmatism (A)** or **Fictionalism**. You can now reply: "Then we aren't arguing about truth; we're arguing about therapy. Don't use the word 'true' if you mean 'comforting'."
  *   **If they say "No":** They are committed to **Peircean Realism (B)**. You can now reply: "Then we need to look at the evidence for the fact, not the benefits of the belief. The benefits are irrelevant to the truth claim."
  *   **If they say "That's impossible / incoherent":** They are committed to **Transcendentalism (C)**. You can reply: "Then you're making a claim about human psychology, not the world. You're saying we are hardwired to be deluded, which is a skeptical position, not a truth claim."
  *   **If they say "It can't be false if it works":** They are committed to **Idealism/Constructivism (D)**. You can reply: "So if a different group finds a different belief works better, their contradictory belief is also true? Do you accept that?"

  ### Summary
  The concept you are looking for is the conflation of **Truth** (a property of propositions relative to reality) with **Warranted Assertibility** (a property of propositions relative to our evidence/needs).

  John Dewey tried to solve this by suggesting we stop using the word "Truth" entirely and just talk about "Warranted Assertibility." Your interlocutors are trying to have it both ways: they want the **authority** of the word "Truth" (which implies objectivity) with the **flexibility** of "Warrant" (which allows them to dodge evidence).

  Call it what it is: **The Pragmatic Equivocation.** And use the question above to force them to pick a lane.
