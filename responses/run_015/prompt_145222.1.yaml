answer: |-
  A Development Economist and an Anthropologist are standing outside a village elder's compound, prepping for a meeting about a new irrigation grant. The Anthropologist is holding a bottle of Scotch.

  **Economist:** "Put that away. Under the Foreign Corrupt Practices Act, that's a bribe. You can't transfer assets to a public official."

  **Anthropologist:** "He's not a 'public official,' he's a node in a kinship network. And that's not an asset, it's a handshake. Refusing to give it isn't 'ethical,' it's a social severance. You're confusing corruption with clientelism done right."

  **Economist:** "I'm not risking a compliance violation. We go in clean."

  They meet the Elder. The Economist presents the project details, emphasizing transparency and rule of law. The Elder listens politely, then pours two glasses of his own local brew, drinks them both himself, and says, "You bring water, but you bring no spirit? Then the water stays in the ground." He sends them away.

  Back at the capital, the Economist is filling out the project closure report. The Anthropologist looks over his shoulder.

  **Anthropologist:** "So, cause of failure?"

  **Economist** types: *"Local corruption and lack of transparency."*

  **Anthropologist:** "You know that's not true. The only thing opaque here was your definition of the gift."

  **Economist:** "If I write 'Refused to engage in local reciprocity,' the audit flags us for cultural incompetence. If I write 'Local corruption,' the audit flags them."

  **Anthropologist:** "So you're blaming the village for the constraints of Western law?"

  **Economist:** "No. I'm ensuring that when the well doesn't get built, the paperwork is still clean."

  **Anthropologist:** "So the incentive is to ensure nothing gets developed?"

  **Economist:** "No. The incentive is to ensure the audit trail is more sustainable than the infrastructure."
