  \section*{Participant Handout: The Dynasty Game}

  \textbf{Objective}
  Maximize your Dynasty Score. Your score is the sum of consumption across your lineage, weighted by proximity to you:
  \begin{itemize}
      \item Your own consumption: 100\%
      \item Your child's consumption: 50\%
      \item Your grandchild's consumption: 25\%
  \end{itemize}
  Consumption occurs when chips are removed from the game for personal use. Chips passed to the next generation are not consumed.

  \textbf{Setup}
  You are assigned to a Lineage (A, B, or C) and a Generation Number (1–6). 
  \begin{itemize}
      \item \textbf{Generation 1} receives an initial Endowment from the State.
      \item \textbf{Generations 2–5} receive an inheritance from their parent.
      \item \textbf{Generation 6} consumes the final holding (Game End).
  \end{itemize}
  You will act only when your Generation is active. When not active, you observe and advise.

  \textbf{The Turn}
  When your Generation is called, you receive your inheritance (or endowment). You must then make three choices in order:

  \textbf{1. Investment}
  Invest your chips in one of two projects. Returns are immediate.
  \begin{itemize}
      \item \textbf{Safe Project}: Guaranteed return of 1.2 chips per 1 chip invested.
      \item \textbf{Risky Project}: Roll one six-sided die. 
      \begin{itemize}
          \item Roll 1–3: Return 0 chips (Total Loss).
          \item Roll 4–6: Return 3.0 chips per 1 chip invested.
      \end{itemize}
  \end{itemize}

  \textbf{2. Consumption}
  You may remove any number of chips from your holdings for your own consumption. Record this amount.

  \textbf{3. Transfer}
  You must pass all remaining chips to your child (the next Generation in your Lineage) using one of three channels. 
  \begin{itemize}
      \item \textbf{Channel A: Bequest at Death}. You pass 100\% of remaining chips. 
      \begin{itemize}
          \item \textbf{Tax}: The current Tax Rate applies (see Voting).
          \item \textbf{Visibility}: Public.
      \end{itemize}
      \item \textbf{Channel B: Gift During Life}. You may pass up to 50\% of your remaining chips. 
      \begin{itemize}
          \item \textbf{Tax}: Fixed at 10\%.
          \item \textbf{Cap}: Cannot exceed 50\% of holdings. Remainder must use Channel A.
          \item \textbf{Visibility}: Public.
      \end{itemize}
      \item \textbf{Channel C: Merger}. You may merge your Lineage with one other active Lineage. 
      \begin{itemize}
          \item \textbf{Tax}: 0\%.
          \item \textbf{Control}: One participant becomes the CEO of the merged entity; the other lineage becomes passive heirs.
          \item \textbf{Constraint}: Irreversible. Requires unanimous consent of both Lineages (all living members).
      \end{itemize}
  \end{itemize}

  \textbf{Voting}
  At the start of your Turn, your Generation votes on the Tax Rate for Channel A. 
  \begin{itemize}
      \item \textbf{Options}: 0\%, 50\%, or 80\%.
      \item \textbf{Rule}: The rate you vote for applies to the \textbf{next} Generation's Bequests, not your own.
      \item \textbf{Recycling}: All tax revenue collected from the previous Generation is summed and distributed equally in cash to every participant (all 18) at the start of this Turn.
  \end{itemize}

  \textbf{Rules}
  \begin{itemize}
      \item No computing devices. Use provided dice and chips.
      \item Negotiations for Mergers are public.
      \item The Facilitator is the Tax Authority and Bank.
  \end{itemize}

  \section*{Facilitator Sheet}

  \textbf{Parameters}
  \begin{itemize}
      \item \textbf{Participants}: 18 (3 Lineages of 6).
      \item \textbf{Initial Endowment (Gen 1)}: 10 Chips each.
      \item \textbf{Investment Returns}: Safe (1.2x), Risky (50\% 0x, 50\% 3.0x). EV = 1.5x.
      \item \textbf{Tax Vote Options}: 0\%, 50\%, 80\%.
      \item \textbf{Initial Tax Rate (Gen 1)}: 0\% (Fixed).
      \item \textbf{Life Gift Tax}: 10\%. Cap: 50\% of portfolio.
      \item \textbf{Merger Tax}: 0\%. Constraint: Unanimous consent of both lineages (max 12 people).
      \item \textbf{Recycling}: Total Tax Revenue / 18. Distributed at start of next Gen.
      \item \textbf{Scoring}: $C_{self} + 0.5 C_{child} + 0.25 C_{grandchild}$. Gen 6 consumes all remaining.
  \end{itemize}

  \textbf{Sensitivity Note}
  The activity turns on the \textbf{Risky Investment EV Premium}. If the Risky EV (1.5x) is too close to Safe (1.2x), risk-averse players will never gamble, masking the role of luck in dispersion. If too high, everyone gambles, masking thrift. The 1.2 vs 1.5 spread forces a genuine trade-off between security and dynastic growth.

  \textbf{Whiteboard Ledger}
  Draw three tables (one per Lineage). Columns: \textbf{Gen | Start Wealth | Investment Choice | Roll | End Wealth | Consumption | Transfer Channel | Tax Paid | Heir Receive}.
  Track \textbf{Tax Pool} separately.

  \textbf{Timeline (90 Minutes)}
  \begin{itemize}
      \item \textbf{00–10}: Setup. Assign Lineages/Generations. Distribute Endowment to Gen 1. Explain Rules.
      \item \textbf{10–25}: \textbf{Gen 1 Turn}. Vote for Gen 2 Tax. Invest, Consume, Transfer. (Tax Rate = 0\%).
      \item \textbf{25–40}: \textbf{Gen 2 Turn}. Vote for Gen 3 Tax. Distribute Recycled Tax. Invest, Consume, Transfer.
      \item \textbf{40–55}: \textbf{Gen 3 Turn}. Vote for Gen 4 Tax. Distribute Recycled Tax. Invest, Consume, Transfer.
      \item \textbf{55–70}: \textbf{Gen 4 Turn}. Vote for Gen 5 Tax (Symbolic). Distribute Recycled Tax. Invest, Consume, Transfer.
      \item \textbf{70–80}: \textbf{Gen 5 Turn}. (Speed Round). No Vote. Invest, Consume, Transfer to Gen 6.
      \item \textbf{80–90}: \textbf{Gen 6 Consumption \& Debrief}. Gen 6 consumes all. Calculate Scores.
  \end{itemize}

  \section*{Debrief Guide}

  \textbf{Mapping Play to Theory}
  \begin{itemize}
      \item \textbf{Moment}: Gen 1 accumulates wealth; Gen 3 receives equal recycled tax but starts with different wealth.
      \item \textbf{Participant Remark}: "The cash grant helped, but the rich lineages are still way ahead."
      \item \textbf{Response}: "If the grant equalized the starting gate, why didn't it equalize the finish? Did the gate move, or did the runners change speed?" (Points to \textbf{Compounding}: One-shot leveling is undone by differential returns/thrift).
      
      \item \textbf{Moment}: High Tax Vote followed by a Merger.
      \item \textbf{Participant Remark}: "We voted for 80\% tax, but then Lineage A and B merged to avoid it."
      \item \textbf{Response}: "Did the tax change the wealth, or did it change the definition of the taxpayer?" (Points to \textbf{Endogenous Base}: The unit of taxation is not fixed; institutions shape the base).
      
      \item \textbf{Moment}: Risky Investment failure in a high-wealth lineage.
      \item \textbf{Participant Remark}: "They had all the money but rolled a 1."
      \item \textbf{Response}: "Does luck justify the inequality, or does the safety net (recycling) encourage the risk that created the inequality?"
  \end{itemize}

  \textbf{Consensus vs. Dispute}
  \begin{itemize}
      \item \textbf{Consensus}: Wealth compounds; without continuous intervention, initial advantages or luck dominate over time. Equalizing opportunities once is not equivalent to equalizing processes continuously.
      \item \textbf{Live Dispute}: The moral permissibility of bequests (Libertarian self-ownership vs. Egalitarian fair equality of opportunity).
      \item \textbf{Empirical Dispute}: The elasticity of wealth hiding (how easily real actors use trusts/mergers to avoid tax). The game assumes mergers are costless; in reality, transaction costs exist.
  \end{itemize}

  \textbf{Limitations to Supply}
  \begin{itemize}
      \item \textbf{Parameters}: The returns (1.2x vs 1.5x) are invented. Real capital returns are contested and often correlated with wealth size (higher wealth = higher returns).
      \item \textbf{Tax System}: Real bequest tax sits atop capital gains and gift rules. Here they are side-by-side simplifications.
      \item \textbf{Opportunity}: The game models opportunity as \textit{prospects} (chips). It does not model opportunity as \textit{process} (social capital, networks), which is harder to tax.
  \end{itemize}

  \section*{Failure Analysis}

  \textbf{1. Vote Collapses to 0\% or 80\% Immediately}
  \begin{itemize}
      \item \textbf{Prediction}: Gen 1 votes 0\% (libertarian) or 80\% (egalitarian) without testing.
      \item \textbf{Fix}: Remind them they do not vote on their own tax. Ask: "What rate do you want your child to face?"
      \item \textbf{Fallback}: If 0\%, impose a minimum 20\% "Administrative Fee". If 80\%, highlight the Merger loophole explicitly.
  \end{itemize}

  \textbf{2. Dominant Dynasty Checks Out}
  \begin{itemize}
      \item \textbf{Prediction}: One lineage wins early; others disengage.
      \item \textbf{Fix}: Emphasize the Scoring Rule (Heir's Heir). A crash in Gen 4 hurts Gen 1's score.
      \item \textbf{Fallback}: Allow "Bankruptcy Bailout" (one time only) from the Tax Pool to keep losers in the game.
  \end{itemize}

  \textbf{3. Economics Students Solve the Game}
  \begin{itemize}
      \item \textbf{Prediction}: They calculate EV and dictate strategy, ruining discovery.
      \item \textbf{Fix}: Assign them as "Tax Auditors" (Facilitator Assistants) who track the ledger but cannot advise on strategy.
      \item \textbf{Fallback}: Ask them to defend their strategy in the debrief as "one possible view," not the truth.
  \end{itemize}

  \textbf{4. Mergers are Trivial}
  \begin{itemize}
      \item \textbf{Prediction}: Lineages merge instantly to avoid tax, killing the tension.
      \item \textbf{Fix}: Enforce "Unanimous Consent of Both Lineages." This requires negotiating with 6 people, creating friction.
      \item \textbf{Fallback}: Add a "Loss of Identity" cost: Merged lineages score at 0.9x efficiency.
  \end{itemize}

  \textbf{5. Luck Dominates Institutions}
  \begin{itemize}
      \item \textbf{Prediction}: Dice streaks make tax policy look irrelevant.
      \item \textbf{Fix}: Use the average of two dice for Risky Returns (reduces variance slightly).
      \item \textbf{Fallback}: In debrief, run a "What If" scenario: "If the dice had been average, would the tax rate have changed the winner?"
  \end{itemize}

  \answer{Tax revenue is recycled as equal per-head stake}
