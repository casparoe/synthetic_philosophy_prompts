      Dear Friend, It is a rash undertaking, but precisely the sort that often yields the best fruit. Regarding the architecture of your session, your instinct is sound but requires sharpening. You suggest that a sign's having a use must be secure before a private sign's having no use can bite. This is correct, yet the dependency is not merely sequential but logical. You must establish that meaning entails a distinction between seeming right and being right. Without a public practice of checking, there is no gap between those two, and without that gap, there is no normativity, only causality. If you begin with the private case, they will assume the internal state itself provides the norm. You must first show that even in public language, the norm resides in the practice of correction, not the mental accompaniment. Only once they grant that rules require the possibility of mistake can you show that a purely private rule offers no purchase for a mistake to exist.

