answer: |-
  The light in the Axiomatic Registry was always the same: a sterile, shadowless noon that seemed to emanate from the paper itself rather than any ceiling fixture. Clara sat across from the Clerk, whose face was a blur of pleasant features, like a portrait left out in the rain. On the desk between them lay her file. It was thick, bound in a material that felt like cold skin, and it hummed with a low, vibrating certainty.

  "We have verified the sequence," the Clerk said. The voice sounded like it was being read from a script printed on the inside of Clara's own skull. "Every thought, every sensation, every logical deduction from birth to cessation. The consistency of the system is intact. You are who you were."

  Clara touched the edge of the file. She remembered the moment of cessation clearly. It hadn't been pain, exactly. It had been the sudden realization that the equation she was working on had resolved itself while she wasn't looking. Then, the room dissolved into this office.

  "And now?" Clara asked. "Now that the sequence is verified, do I continue?"

  The Clerk folded hands that looked perfectly symmetrical. "That is the undecidable proposition."

  Clara frowned. She had spent forty years teaching logic, hunting for the cracks in formal systems, and she recognized the shape of this refusal. "You're saying you can't prove it."

  "We can enumerate every fact of your past existence within this framework," the Clerk corrected gently. "We can prove you lived. We can prove you died. But within the axioms of the Registry, we cannot derive the statement: *Clara persists.*"

  "That's incompleteness," Clara said, a spark of her old irritation flaring. "You've built a heaven that's too simple to contain the truth of what comes next."

  "Not too simple. Consistent," the Clerk said. "If we were to assert your persistence as a theorem derived from your death, we would introduce a contradiction. The system would collapse. Death, by definition in this model, is a terminal state. To claim otherwise using only the rules of this model would be false."

  "So I'm stuck here? In a graveyard of verified facts?"

  "No. You are offered a transfer." The Clerk slid a single sheet of paper across the desk. It was blank, save for a signature line at the bottom. "There is a meta-system. A higher-order model. In that framework, death is not a terminal axiom but a transitional function. Your continuity is true there. It is consistent there. But it cannot be proven from here."

  Clara looked at the blank paper. This was the trap. Or rather, this was the test. She had spent her life believing that the universe was rational. She had sided with the Platonists, believing that mathematical concepts existed independently of human minds, waiting to be discovered. If the universe was truly rational, truly beautiful, then it made no sense for the mind—the only thing capable of perceiving that beauty—to be annihilated simply because the biological hardware failed. That would be waste. And the universe, she had always argued, was not wasteful.

  But rationality wasn't the same as provability. She knew that better than anyone. There were truths that stood outside the fence of proof, shining like stars you couldn't reach with a ladder.

  "If I sign," Clara said, "what happens?"

  "You leave the model," the Clerk said. "You enter a non-standard extension of your life. You will not be able to send messages back. You will not be able to verify the consistency of this place from where you are going. You have to accept that the truth of your continuation is valid, even if the proof requires a vantage point you do not yet occupy."

  "It requires faith," Clara said.

  "It requires rational hope," the Clerk corrected. "Faith implies believing without reason. Hope implies believing because the alternative renders the whole system absurd. If the mind is a vessel for truth, and truth is eternal, the vessel must have a destination. To believe otherwise is to believe the universe is a joke."

  Clara looked around the Registry. It was endless. Rows of desks stretched into a white vanishing point, each with a Clerk and a deceased soul. Some were arguing. Some were weeping. Some were staring at their files, trapped in the loop of their own verified histories. It was safe here. It was provable. Nothing could hurt her because nothing could change. It was a perfect, static tomb.

  She thought of her work. The elegance of a proof that clicked into place. The feeling that she was touching something real, something that existed whether she was there to see it or not. If that feeling was real, then *she* had to be real enough to keep feeling it.

  "The axioms here are sufficient for the past," Clara said.

  "They are," the Clerk agreed.

  "But insufficient for the future."

  "Always."

  Clara picked up the pen. It was heavy, balanced perfectly in her hand. She realized then that the Clerk couldn't force her. The system couldn't compute the transfer without her input. Her consent was the extra-axiomatic variable. It was the human element that bridged the gap between the true and the provable.

  She looked at the Clerk. "Gödel believed this, didn't he? That the world is rational enough to warrant a second chance."

  "The Clerk does not comment on other applicants," the voice said, but the blur of the face seemed to soften, just for a fraction of a second. "But the architecture of this Bureau was designed by someone who understood that a system cannot validate its own consistency."

  Clara smiled. It was a small smile, tired but clear. She understood now. The afterlife wasn't a reward. It was a necessary postulate. You couldn't prove you were going to wake up tomorrow, not really. You just had to trust the sun would rise. This was the same. The rationality of the cosmos demanded it, even if the paperwork couldn't show it.

  She signed her name.

  The ink didn't dry; it sank into the paper, becoming part of the fiber. The hum of the file on the desk stopped. The sterile noon light shifted, gaining a spectrum of color she hadn't realized was missing—deep violets, warm golds, the grey of a storm front.

  The Clerk stood up. "The transfer will feel like a loss of definition," he said. "You are moving from a finite model to an infinite one. You may feel unmoored."

  "I'm used to that," Clara said.

  "Then step through."

  There was no door. There was only the space behind the Clerk, which had previously been a white wall. Now it was open, revealing a landscape that looked like a city made of light and geometry, shifting and growing as she watched. It wasn't stable. It wasn't provable. It was alive.

  Clara stood up. She left the file on the desk. She didn't need the verification of who she had been. She was interested in who she was becoming.

  "Is it consistent?" she asked, pausing at the threshold.

  "We believe so," the Clerk said.

  "That's not a proof."

  "No," the Clerk said. "But it is true."

  Clara stepped forward. The floor beneath her feet felt solid, yet fluid, like walking on the surface of a thought that was still being formed. She felt a moment of vertigo, the terrifying drop of letting go of the known axioms. Then, the fear vanished, replaced by a profound, quiet certainty. She was moving into the gap where the truth lived, beyond the reach of the proof, and for the first time since she died, she felt completely logical.
