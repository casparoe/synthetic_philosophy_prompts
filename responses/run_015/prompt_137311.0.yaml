answer: |-
  # The Split-Brain Decision Tree
  **Starting Commitment:** In commissurotomy patients, each hemisphere can be fed information the other does not get; the left one does nearly all the talking; and the left one will cheerfully invent a reason for something the right one set in motion.

  ---

  ### 1. The Bandwidth Dial
  **Imagine the callosal link is not cut but continuously tuneable. If inter-hemispheric traffic is dialled from normal down to zero, does the number of subjects jump from one to two at a specific setting?**
  *   **→ Unity breaks at a threshold** (Go to 2)
  *   **→ Unity degrades continuously** (Go to 5)

  ### 2. The Dual Speech Case
  **In the rare case where both hemispheres speak and give conflicting answers (e.g., on taking a job), is this one agent expressing conflicting desires?**
  *   **→ Yes, one agent conflicted** (Go to 3)
  *   **→ No, two agents disagreeing** (Go to 4)

  ### 3. The Confabulation Check
  **When the speaking hemisphere explains an action it did not initiate, is it accessing a hidden belief it actually holds?**
  *   **→ Yes, accessing hidden belief** → **Leaf A**
  *   **→ No, fabricating a reason** → **Leaf B**

  ### 4. The Counting Principle
  **Does having one biological body guarantee being exactly one subject of experience?**
  *   **→ Yes, body determines subject** → **Leaf A** (Forced convergence)
  *   **→ No, psychological unity determines subject** → **Leaf C**

  ### 5. Metaphysical Precision
  **Must there be a definite fact about how many subjects exist in every case?**
  *   **→ Yes, reality is precise** → **Leaf E**
  *   **→ No, identity can be vague** → **Leaf D**

  ### 6. The Context Question
  **Does the answer to 'how many subjects?' change depending on whether you ask a lawyer or a neurologist?**
  *   **→ Yes, count is context-dependent** → **Leaf F**
  *   **→ No, count is mind-independent** (Return to 5)

  ---

  ### Positions (Leaves)

  **Leaf A: Single Subject, Single Stream**
  *One person, one conscious field; the right hemisphere is unconscious.*
  *   **Stuck with:** Denying that the right hemisphere feels pain or sees colour.

  **Leaf B: Single Subject, Dual Streams**
  *One person, two conscious fields; the mind is split but the agent remains.*
  *   **Stuck with:** Explaining what holds the 'one person' together if streams are separate.

  **Leaf C: Dual Subjects, Dual Streams**
  *Two people, two conscious fields; the operation creates a second person.*
  *   **Stuck with:** Legally and socially treating them as one person (one vote, one body).

  **Leaf D: Indeterminate Identity**
  *No fact of the matter; the question 'how many?' has no answer.*
  *   **Stuck with:** Violating the intuition that existence is precise (either you exist or you don't).

  **Leaf E: Unity as Degree**
  *Subjects come in amounts; unity is vague.*
  *   **Stuck with:** Making moral responsibility fuzzy (how much person is liable for this crime?).

  **Leaf F: Pragmatic Counting**
  *Count depends on context; sometimes one, sometimes two.*
  *   **Stuck with:** Seeming to avoid the metaphysical truth rather than find it.

  ---

  ### Notes on Ambiguity & Structure

  **Unoccupied Combinations**
  *   **Sharp Threshold + Unity as Degree:** Incoherent. A degree view denies sharp thresholds by definition.
  *   **Body = Subject + Two Subjects:** Incoherent. If one body guarantees one subject, you cannot arrive at Leaf C via Node 4.
  *   **One Subject + Fabrication:** Unattractive. If the subject is one, why is it lying to itself? (Most who choose this path end up at Leaf B).

  **Indistinguishable Leaves**
  *   **Leaf A (Hidden Belief) vs. Leaf B (Dual Streams):** If the right hemisphere cannot report experience, empirically these look identical. The tree cannot pry them apart without assuming access to qualia.
  *   **Leaf D (Indeterminate) vs. Leaf E (Degree):** Often yield the same predictions in practice; students may slide between them without noticing.

  **Guessing Nodes**
  *   **Node 1 (Bandwidth Dial):** Purely hypothetical. Students are guessing based on intuition, as no such dial exists.
  *   **Node 3 (Confabulation):** We cannot know if the left hemisphere *believes* the fabrication or knows it is lying; internal state is opaque.
  *   **Node 6 (Context):** Risks conflating epistemology (how we count) with metaphysics (what exists).
