prompt: |-
  I teach a community-college intro course called Life in the Universe — 30 non-majors, mostly first-years, one 75-minute block, they sit at six tables of five. About half had a real high school biology class and half didn't. I want an in-class activity that makes them feel how hard it is to say what life *is*, and specifically that the problem isn't that they haven't thought hard enough yet: whatever criterion they write down keeps either swallowing things nobody calls alive or spitting out things everybody does.

  The shape I have in mind: each table is a defintion committee for a fictional sample-return mission. Round 1 they write an operational criterion on a card and hand it to me sealed — no taking it back, no peeking at what's coming. Round 2 they get a deck of specimen cards and have to rule each one in or out strictly by their own criterion, and write the verdict down even when they hate it. Round 3 is a challenge round where another table (or me) attacks one of their verdicts and they have to defend it or amend.

  Please write the specimen deck for me. I want these in it, at minimum:

  - a giant virus — the kind that's big enough to see under a light microscope and carries some of the genes for its own protein-building machinery, so it isn't the easy "just a bag of genes" case
  - a prion: a misfolded protein that spreads by converting normal copies of itself, no nucleic acid anywhere in the picture
  - a viroid: naked circular RNA, no protein coat, a few hundred bases, makes plants sick
  - an obligate bacterial endosymbiont that lives inside insect cells with a drastically stripped-down genome and can't be grown in a dish outside its host — not self-sustaining on any normal reading, and yet nobody wants to call it non-living
  - something dormant for years with no detectable metabolism (dried seed, tun-state tardigrade, your pick)
  - a mule — obviously alive, can't reproduce
  - a crystal that grows and passes its defect pattern on to the crystals it seeds
  - a population of self-replicating computer programs on an artificial-life platform where they mutate and get culled, so they clearly change by selection over generations

  Add three or four more of your own, and make at least one of those genuinely obscure rather than another chestnut. Order the deck deliberately: start with cards everyone will agree on so their criterion feels comfortable, then land the killers. Every card should be readable with zero biology background in under ~80 words, be factually accurate, and describe what's actually known about the specimen — does it take in and use energy, does it have heredity, does it change across generations, is it bounded off from its surroundings — rather than just naming it, so they're reasoning from evidence and not from whether they've heard the word before.

  Also give each table member a role card with a different stake in the outcome: the person designing the detector that has to fire on-site, the quarantine officer deciding what comes back in the capsule, someone deciding what could be treated or destroyed, someone worried about what we'd owe it. The point is that one and the same criterion serves those jobs badly or well in different ways, so by round 3 they should be arguing about which job the definition is for rather than about the facts. That's the moment I'm after, so build the mechanics to produce it instead of hoping.

  Include: full rules, a timeline for the 75 minutes, a scoring scheme that uses no real money (some kind of mission budget where bad rulings and amendments both cost something, so patching a definition isn't free), a materials list I can print and cut in under an hour with no budget, the debrief, and an honest note on what'll go wrong the first time I run it — e.g. a table that writes "made of cells and has DNA" and then cruises, or one that amends every single round — plus what to do about each.

  In the debrief, map what happened onto the conceptual stuff: the circularity worry in evolution-based formulations (the standard astrobiology-flavored line is roughly that life is a self-sustaining chemical system capable of Darwinian evolution — but Darwinian evolution already assumes reproduction, heredity and variation, so did they just define life in terms of life?); list-of-properties versus a loose cluster of overlapping features versus "alive" admitting of degrees; whether a dormant thing is alive *now* or only has the capacity, i.e. current capacities versus being part of a lineage with a history; and the job-relativity point from the role cards. No lecture beforehand and don't say "necessary and sufficient conditions," "natural kind," or "cluster concept" anywhere until the debrief.

  Finally, be frank about which feature of the problem the activity can't reproduce and I'll have to supply by hand. My guess is it can't get them to feel whether there's a fact of the matter independent of our interests — committees will just experience this as an engineering problem they can solve with a cleverer wording — but tell me if you think the design can actually touch that, and if so, how.
reasoning: |-
  Here's a thinking process that leads to the suggested activity plan:

  1.  **Analyze the Request:**

      *   **Course:** Life in the Universe (Intro, Non-majors, Community College).
      *   **Class Size/Setup:** 30 students, 6 tables of 5, 75-minute block.
      *   **Goal:** Demonstrate the difficulty of defining "life" (boundary problems, false positives/negatives). Show it's not just a lack of thought, but a structural problem.
      *   **Activity Structure:**
          *   Round 1: Write definition (sealed).
          *   Round 2: Apply definition to specimen deck (forced verdicts).
          *   Round 3: Challenge/Defend/Amend (with costs).
          *   Roles: Different stakes (Detector, Quarantine, Treatment, Ethics).
      *   **Specimen Deck Requirements:** Must include specific items (Giant Virus, Prion, Viroid, Endosymbiont, Dormant thing, Mule, Crystal, Digital Life) + 3-4 new ones (one obscure). Order matters (Easy -> Hard). Descriptions must be evidence-based, jargon-free (<80 words).
      *   **Deliverables:** Rules, Timeline, Scoring/Budget, Materials List, Debrief Guide, "What Will Go Wrong" analysis, Philosophical limitations.
      *   **Constraints:** No lecture beforehand. No jargon ("necessary/sufficient," "natural kind") until debrief. Print/cut in under an hour, no budget.

  2.  **Deconstruct the Activity Flow:**

      *   *Time Management:* 75 minutes is tight for 3 rounds + debrief.
          *   Intro/Roles/Round 1: 15 min.
          *   Round 2 (Specimens): 25 min.
          *   Round 3 (Challenge/Amend): 20 min.
          *   Debrief: 15 min.
      *   *Scoring:* Needs to penalize both bad rulings (inconsistency) and amendments (instability). "Mission Budget" is a good metaphor.
      *   *Roles:* Need to create conflict. If everyone wants the same thing, there's no tension.
          *   *Instrument Engineer:* Wants high sensitivity (don't miss life).
          *   *Planetary Protection:* Wants high specificity (don't bring back danger).
          *   *Medical/Resource:* Wants to know if it can be killed/used.
          *   *Ethicist:* Wants to know if it has rights/moral status.
          *   *Mission Commander:* Breaks ties, manages budget.
      *   *Specimen Deck:* Needs to be printed on cards. Descriptions need to be carefully crafted to avoid giving away the "answer" (since there isn't one) but provide the physical facts.

  3.  **Drafting the Specimen Deck:**

      *   *Constraint Check:* <80 words, no jargon, evidence-based.
      *   *Order:* Easy (Human, Tree) -> Tricky (Mule, Seed) -> Hard (Virus, Endosymbiont) -> Nightmare (Prion, Crystal, Digital).
      *   *New Items:*
          1.  *Mitochondria:* Similar to endosymbiont but organelle. (Maybe too similar to endosymbiont).
          2.  *Fire:* Classic false positive (grows, consumes, spreads).
          3.  *Clay Catalyst:* Geochemical selection (Cairns-Smith hypothesis).
          4.  *Obscure:* *Candidatus* Tremblaya princeps (the endosymbiont inside an endosymbiont) or maybe a specific metabolic oddity. Let's go with *Nanoarchaeum equitans* (obligate symbiont archaea) or the *Tremblaya* nested situation. Actually, let's use **The "Green Slug" (*Elysia chlorotica*)**. It steals chloroplasts and lives off photosynthesis but is an animal. It blurs the line between organism and ecosystem. Or **Ferroplasma acidarmanus** (no cell wall). Let's go with **Cell-Wall-Deficient Bacteria (L-forms)**. They bleed and merge.
          *   *Selection:*
              1.  Fire (Classic false positive).
              2.  L-Form Bacteria (No cell wall, blebs merge).
              3.  *Candidatus* Tremblaya (Nested symbiont, tiny genome).
      *   *Refining Descriptions:* Ensure they describe *behavior* and *structure*, not labels.

  4.  **Drafting the Role Cards:**

      *   Need to ensure they pull in different directions.
      *   *Sensor Lead:* Scored on finding *all* potential life. (Penalized for False Negatives).
      *   *Quarantine Officer:* Scored on safety. (Penalized for False Positives).
      *   *Bioethics Rep:* Scored on protecting potential rights. (Penalized for treating "alive" things as trash).
      *   *Resource Manager:* Scored on efficiency. (Penalized for wasting budget on "non-life").
      *   *Commander:* Manages the budget, breaks ties.

  5.  **Drafting the Rules & Scoring:**

      *   *Budget:* Start with 100 Credits.
      *   *Costs:*
          *   Inconsistent verdict (violating own definition): -10 credits.
          *   Amendment (Round 3): -15 credits (shows definition was weak).
          *   Role Conflict (if table can't agree): -5 credits per minute.
      *   *Winning:* Most credits left + best justification.

  6.  **Addressing "What Will Go Wrong":**

      *   *Scenario A:* "Made of cells/DNA." They cruise through. *Fix:* Force them to rule on the Crystal or Fire which mimics growth. Or have the GM (Instructor) challenge them specifically on the "Cell" definition using the L-Form or Virus.
      *   *Scenario B:* Endless amendments. *Fix:* High cost of amendments.
      *   *Scenario C:* Silence/Confusion. *Fix:* Role cards force discussion.

  7.  **Addressing the Philosophical Limit:**

      *   The prompt asks: Can this activity make them feel if there's a "fact of the matter"?
      *   *Honest Assessment:* No. It feels like an engineering problem. The "ontological" weight (is there a *truth*?) is hard to simulate in a game. The instructor *must* bridge this in the debrief. The activity shows *utility* failure, not necessarily *truth* failure. I need to be explicit about this.

  8.  **Review and Refine:**

      *   *Word Counts:* Check specimen cards.
      *   *Timeline:* Ensure 75 mins is realistic. (It's tight. I need to be strict on timing).
      *   *Materials:* Keep it simple. Paper, scissors, envelopes.
      *   *Debrief:* Map the activity experiences to the concepts (Circularity, Cluster, Capacity vs. Lineage, Job-Relativity). Avoid jargon until the end.

  9.  **Final Polish:**

      *   Tone: Professional, supportive of an instructor, clear instructions.
      *   Formatting: Use bolding, lists, and clear sections for readability.
      *   Check specific constraints: "No lecture beforehand," "No jargon until debrief."

  *(Self-Correction during drafting)*: I initially thought about having them vote on each card. But the prompt says "write the verdict down even when they hate it." I need to make sure the mechanism forces them to stick to the *text* of their definition, not their gut. The "Sealed Definition" is key.
  *Correction on Roles:* If they have different stakes, they might not agree on the *verdict*. But the rule says "Table is a definition committee." I need to clarify: They must agree on a *single* table verdict per card, but their *roles* inform how they argue for the definition's wording in Round 1 and how they feel about the costs in Round 3. Actually, better: The Roles determine how they *score* the outcome. No, that's too complex.
  *Better Role Mechanic:* Each role has a "Secret Objective."
      *   Sensor: Wants more "ALIVE" verdicts.
      *   Quarantine: Wants more "NOT ALIVE" verdicts (for safety/containment).
      *   Ethics: Wants consistency on "complex" things.
      *   *Wait, simpler:* The Roles are for Round 3. In Round 3, the "Challenge" comes from the perspective of the roles.
      *   *Best approach:* Assign roles at the start. They write *one* definition together. But when challenges come, the Instructor assigns a Role-Card challenge to a specific table. "The Quarantine Officer says your definition lets in Prions. That's a safety risk. Defend or Pay." This externalizes the conflict.
      *   *Wait, prompt says:* "Give each table member a role card... one and the same criterion serves those jobs badly or well."
      *   *Okay, internal conflict:* All 5 at a table have different roles. They must agree on the definition. This creates tension *during* Round 1. "I can't sign off on a definition that misses viruses (Sensor)" vs "I can't sign off on one that includes crystals (Quarantine)." This is perfect. It forces the definition to be a compromise that will likely fail later.

  10. **Finalizing the Specimen Descriptions:**
      *   Must be strictly descriptive.
      *   *Giant Virus:* "Particle visible under light microscope. Contains DNA. Has genes for some protein building. Cannot make proteins alone. Injects DNA into cell to replicate."
      *   *Prion:* "Folded protein molecule. No DNA/RNA. Touches normal proteins and makes them fold the same way. Spreads through tissue. Causes sickness. Does not eat or grow."
      *   *Crystal:* "Solid structure. Takes molecules from liquid and adds them to surface. Grows larger. Breaks into pieces, each piece grows new crystals with same defect pattern. Does not use energy."
      *   *etc.*

  11. **Finalizing the Debrief:**
      *   Connect the frustration to the philosophy.
      *   Address the "Fact of the Matter" limitation honestly.

  12. **Materials List:**
      *   Printables: Role cards, Specimen cards, Definition sheets, Scorecards.
      *   Envelopes (for sealed definitions).
      *   Pens.

  Let's assemble the document.
answer: |-
  # Activity: The Sample-Return Protocol
  **Course:** Life in the Universe | **Time:** 75 Minutes | **Class Size:** 30 (6 tables of 5)

  ## 1. Instructor Preparation & Materials
  **Print & Cut (approx. 45 mins):**
  *   **6 Definition Envelopes:** One per table. Label them "TOP SECRET – DO NOT OPEN UNTIL ROUND 2."
  *   **6 Definition Sheets:** One per table. Blank space for writing the criterion.
  *   **30 Role Cards:** 5 distinct roles per table (see Section 4).
  *   **6 Specimen Decks:** Each deck has 12 cards (see Section 3). Shuffle each deck identically.
  *   **6 Scorecards:** Track "Mission Budget" (see Section 5).
  *   **30 Verdict Sheets:** One per student (or one per table, but individual ensures engagement).

  **Room Setup:**
  *   Tables of 5.
  *   Projector for timer only (no slides/lecture).

  ---

  ## 2. Timeline (75 Minutes)

  | Time | Phase | Action |
  | :--- | :--- | :--- |
  | **00:00 – 00:05** | **Briefing** | Hand out Role Cards. Explain mission: "You are defining life for a sample return. No lectures. Just rules." |
  | **00:05 – 00:15** | **Round 1** | **The Definition.** Tables write one operational criterion (max 3 sentences). Seal in envelope. Instructor collects. |
  | **00:15 – 00:40** | **Round 2** | **The Verdict.** Return envelopes. Hand out Specimen Decks. Tables rule "ALIVE" or "NOT ALIVE" for all 12 cards *strictly* by their definition. Record verdicts. |
  | **00:40 – 01:00** | **Round 3** | **The Audit.** Instructor challenges specific verdicts. Tables must defend or Amend. Amendments cost budget. |
  | **01:00 – 01:15** | **Debrief** | **The Map.** Connect activity struggles to conceptual problems (circularity, cluster concepts, job-relativity). |

  ---

  ## 3. The Specimen Deck (12 Cards)
  *Print these on cardstock. Cut apart. Order is deliberate: Comfort -> Uncertainty -> Crisis.*

  **01. Human Sample**
  Takes in food and oxygen. Converts chemicals to energy. Grows from a single cell to a large organism. Contains DNA. Reproduces sexually. Responds to pain. Bounded by skin.
  **Verdict:** ___________

  **02. Oak Tree**
  Takes in sunlight, air, and water. Converts chemicals to energy. Grows from a seed. Contains DNA. Reproduces via acorns. Does not move location. Bounded by bark.
  **Verdict:** ___________

  **03. Dried Seed**
  Found in dry soil. No detectable energy use. No growth. No waste. Contains DNA. When wetted, begins energy use and growth. Can stay dry for 100 years.
  **Verdict:** ___________

  **04. Mule**
  Takes in food and oxygen. Converts chemicals to energy. Grows. Contains DNA. Responds to pain. Bounded by skin. Cannot produce offspring (sterile).
  **Verdict:** ___________

  **05. Tardigrade (Tun State)**
  Dried out husk. No metabolism. No movement. No waste. Contains DNA. When wetted, wakes up and moves. Can stay dry for 30 years.
  **Verdict:** ___________

  **06. Fire Patch**
  Takes in fuel (wood) and oxygen. Converts chemicals to energy (heat/light). Grows larger. Spreads to new fuel. "Reproduces" by sparking new fires. No DNA. No boundary skin.
  **Verdict:** ___________

  **07. Salt Crystal**
  Sits in salty water. Takes salt molecules from water. Adds them to surface. Grows larger. Breaks into pieces; each piece grows new crystals with same pattern. No DNA. No energy use.
  **Verdict:** ___________

  **08. Giant Virus**
  Particle visible under light microscope. Contains DNA. Has genes for some protein building. Cannot make proteins alone. Injects DNA into cell to replicate. No metabolism outside cell.
  **Verdict:** ___________

  **09. Bacterial Endosymbiont**
  Lives inside insect cells. Contains DNA. Makes some proteins. Cannot survive outside host cell. Cannot be grown in a dish. Genome is tiny (missing many standard genes).
  **Verdict:** ___________

  **10. Viroid**
  Circular RNA strand (few hundred bases). No protein coat. No DNA. Enters plant cells. Uses plant machinery to copy itself. Causes plant sickness. No metabolism.
  **Verdict:** ___________

  **11. Prion**
  Folded protein molecule. No DNA or RNA. Touches normal proteins and makes them fold the same way. Spreads through tissue. Causes sickness. Does not eat, grow, or use energy.
  **Verdict:** ___________

  **12. L-Form Bacteria**
  Bacteria with cell wall removed. Bleeds contents slightly. Merges with other cells, swapping DNA freely. Divides unevenly. Uses energy. Contains DNA. Boundary is leaky/blurry.
  **Verdict:** ___________

  *(Note: Card 12 is the "obscure" addition. L-forms challenge the "bounded individual" criterion.)*

  ---

  ## 4. Role Cards (5 per Table)
  *Cut these out. Hand one to each student at the start. Do not let them swap.*

  **ROLE: SENSOR ENGINEER**
  **Stake:** You design the detector.
  **Goal:** Do not miss anything that *might* be life.
  **Pressure:** If you define "life" too narrowly, the detector misses alien bugs. That is a career-ending false negative. You want the definition to be **inclusive**.

  **ROLE: QUARANTINE OFFICER**
  **Stake:** You decide what enters Earth.
  **Goal:** Do not bring back anything dangerous.
  **Pressure:** If you define "life" too broadly, you quarantine harmless rocks. That wastes billions. If you let a prion in, everyone dies. You want the definition to be **safe/specific**.

  **ROLE: TREATMENT SPECIALIST**
  **Stake:** You decide how to handle samples.
  **Goal:** Know if it can be killed or stopped.
  **Pressure:** If it's alive, antibiotics might work. If it's a crystal or chemical, you need physical removal. You need the definition to predict **response to intervention**.

  **ROLE: ETHICS REPRESENTATIVE**
  **Stake:** You represent moral obligations.
  **Goal:** Protect entities that deserve rights.
  **Pressure:** If we destroy something "alive," it might be murder. If we treat a living thing as trash, we are monsters. You want the definition to track **moral status**.

  **ROLE: MISSION COMMANDER**
  **Stake:** You manage the budget.
  **Goal:** Finish the mission without going bankrupt.
  **Pressure:** You break ties at the table. You sign the budget checks for amendments. You care about **consistency and cost**.

  ---

  ## 5. Rules & Scoring (Mission Budget)

  **Starting Budget:** 100 Credits per table.

  **Round 1 (Definition):**
  *   Definition must be written down.
  *   Must be sealed until Round 2.
  *   **Cost:** 0 Credits.

  **Round 2 (Verdicts):**
  *   Apply your definition to all 12 cards.
  *   **Cost:** -5 Credits for every card where the table *cannot agree* on a verdict based on the text. (Commander decides).

  **Round 3 (Audit):**
  *   Instructor will pick 3 specific cards (usually Virus, Crystal, Prion) and challenge the table's verdict.
  *   **Defense:** If you can logically prove your verdict matches your definition text: **0 Credits**.
  *   **Amendment:** If you change your definition to fit the verdict you *wanted*: **-15 Credits** per amendment.
  *   **Contradiction:** If you keep the definition but the verdict clearly violates it (e.g., Definition says "Must have DNA," Verdict says Virus is ALIVE): **-20 Credits**.

  **Winning:**
  *   Table with the most Credits remaining.
  *   Tie-breaker: Table that made the fewest Amendments.

  ---

  ## 6. What Will Go Wrong (And Fixes)

  **Problem 1: The "DNA/Cell" Cruise**
  *   **What happens:** A table writes "Made of cells and has DNA." They breeze through Cards 1-9. They mark Virus/Prion/Crystal as NOT ALIVE. They feel successful.
  *   **The Fix:** In Round 3, challenge them on **Card 12 (L-Form)** or **Card 09 (Endosymbiont)**. Ask: "The Endosymbiont has DNA but cannot live outside a host. Is it a cell or an organelle? The L-Form has no cell wall. Is it still a cell? Your definition excludes things biologists call alive. Pay the amendment cost or defend why biologists are wrong."
  *   **Instructor Script:** "Biologists classify the Endosymbiont as living. Your definition classifies it as dead. Is your definition describing *life*, or just *Earth life as we know it*?"

  **Problem 2: The Endless Amendment Loop**
  *   **What happens:** A table realizes their definition is broken on Card 6 (Fire). They amend it. Then Card 8 (Virus) breaks. They amend again. They burn all their budget.
  *   **The Fix:** The Budget. When they hit 0 Credits, they are "Mission Failed." They must stick with their last definition for the remaining cards, even if it yields "wrong" answers. This forces them to feel the pain of a bad definition rather than patching it forever.

  **Problem 3: Role Silence**
  *   **What happens:** The Commander dominates. The Ethics Rep says nothing.
  *   **The Fix:** During Round 1, walk around. If a table is quiet, tap the Ethics Rep's card. "Does your definition protect the Tardigrade?" Tap the Quarantine Officer. "Does your definition keep the Prion out?" Remind them their grades (or budget bonuses) depend on their role's specific goal.

  ---

  ## 7. The Debrief Guide (15 Minutes)
  *Do not lecture. Ask questions based on what happened in the room.*

  **1. The Engineering vs. Truth Problem (5 mins)**
  *   **Ask:** "Who had to change their definition in Round 3? Why?"
  *   **Listen:** They will say "Fire looked too much like life" or "Viruses didn't fit."
  *   **Point:** "You treated this like an engineering problem. 'Fix the wording so the machine works.' But was there a *fact* you were missing? Or did the job you were doing (Quarantine vs. Ethics) change what the answer *should* be?"
  *   **Concept:** **Job-Relativity.** A Quarantine Officer needs a different definition than an Ethicist. There may not be one "True" definition, only useful ones for specific tasks.

  **2. The Circular Trap (5 mins)**
  *   **Ask:** "Did anyone define life as 'something that evolves' or 'reproduces'?"
  *   **Listen:** Likely yes.
  *   **Point:** "If you say life is 'something that reproduces,' what do you do with the Mule (Card 4)? It's alive but can't reproduce. If you say 'part of a lineage that evolves,' aren't you using life (lineage) to define life?"
  *   **Concept:** **Circularity.** Evolution-based definitions (common in astrobiology) assume reproduction and heredity. They define life in terms of life's processes.

  **3. Capacity vs. State (3 mins)**
  *   **Ask:** "Card 3 (Seed) and Card 5 (Tardigrade). Were they alive while dry?"
  *   **Listen:** Some say yes, some say no.
  *   **Point:** "If you said 'Yes,' you defined life as a *history* or *potential*. If you said 'No,' you defined life as a *current activity* (metabolism). Both make sense. Which one is 'true'?"
  *   **Concept:** **Process vs. Substance.** Is life a thing you *are*, or a thing you *do*?

  **4. The Cluster (2 mins)**
  *   **Ask:** "Did any single rule (DNA, Metabolism, Boundary) catch everything without catching Fire or Crystals?"
  *   **Point:** "Probably not. We usually end up with a checklist. If it has 4 out of 5 checks, we call it alive. That's not a strict rule; that's a family resemblance."
  *   **Concept:** **Cluster Concept.** "Life" might not be a sharp category (like 'Prime Number') but a fuzzy cluster (like 'Game' or 'Furniture').

  ---

  ## 8. Honest Note: What This Activity Cannot Do

  **The Limitation:**
  This activity simulates an **epistemic** problem (how do we *know*?) and a **pragmatic** problem (how do we *use* the word?). It does *not* successfully simulate an **ontological** problem (is there a fact of the matter independent of us?).

  Students will leave thinking, "Defining life is hard because our tools are clumsy" or "It depends on what job you have." They will likely *not* feel the deeper philosophical worry: "What if 'Life' isn't a real thing in the universe, but just a label we paste on things we like?"

  **How to Supply This by Hand:**
  In the final 2 minutes of the debrief, you must explicitly state:
  > "You fixed these problems by changing your words or your budget. You treated 'Life' as a box we are trying to build. But consider this: Maybe the universe doesn't have a box. Maybe 'Life' is like 'Weed.' A weed is just a plant a gardener doesn't want. It's not a biological category; it's a judgment. If 'Life' is like 'Weed,' then no amount of better science will solve the definition. It will always depend on what *we* want."

  **Why this matters:**
  Without this closing note, the activity reinforces the idea that a "Perfect Definition" exists and they just failed to find it. You need to verbally plant the seed that the failure might be in the *concept*, not the *committee*.

  ---

  ## 9. Materials Checklist (Print/Cut < 1 Hour)

  1.  **Specimen Deck:** 12 cards x 6 tables = 72 cards. (Print 2 pages, cut).
  2.  **Role Cards:** 5 roles x 6 tables = 30 cards. (Print 1 page, cut).
  3.  **Definition Sheet:** 6 sheets. (Blank paper).
  4.  **Envelopes:** 6 standard envelopes.
  5.  **Scorecard:** 6 small slips of paper (Start: 100).
  6.  **Pens:** 30.

  **Total Cost:** Paper and ink.
  **Prep Time:** 45 minutes cutting/shuffling.
