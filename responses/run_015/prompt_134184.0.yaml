answer: |-
  Here is your Q&A prep sheet. I've ordered these by "lethality"—starting with the objections that could derail the whole talk, down to the nitpicks. I've tuned the voices to match the people in your room.

  ### **Opening Concessions (First 2 Minutes)**
  *Do not skip this. You are an undergrad in a grad seminar. If you try to bully the physics or the metaphysics immediately, you lose credibility.*

  1.  **To the Physicist:** "I agree that simultaneity conventions aren't ontology. I'm not arguing physics forces the block; I'm arguing that *how we map physics to metaphysics* creates the problem."
  2.  **To the Prof:** "I agree R–P begs the question if it claims to prove eternalism from physics alone. My goal isn't to save R–P, but to show *where* the begging happens (the definition of openness) so presentists know where to fight."

  ---

  ### **The Objection Sheet**

  #### **1. The Physicist (High Damage)**
  **Objection:** "You're making a category mistake. In Newtonian spacetime, simultaneity is absolute. There is no 'tilt' based on velocity. You're confusing an *epistemic* limit (what I can know/do) with an *ontological* slice (what exists). If your 'action cone' isn't light-speed limited, it's not a physical cone, it's just a budget constraint."
  **30-Second Reply:** "Exactly. In Newtonian worlds, the tilt is pragmatic, not ontological. My point is that R–P smuggles the *pragmatic* tilt into an *ontological* conclusion by equating 'real' with 'causally reachable.' If you admit the action cone is agent-relative in Newtonian time, you should admit the light cone is agent-relative in Relativistic time."
  **Weakness:** They can press that Relativity makes the light cone *invariant*, whereas your walking speed is not. You need to hold the line that *causal reachability* is the invariant metric for 'openness,' not the speed of light itself.

  #### **2. Presentist #1 (High Damage)**
  **Objection:** "So you're saying existence is vague? If I run toward Andromeda, the invasion fleet exists, but if I walk away, it doesn't? That makes ontology dependent on my leg speed. That's absurd."
  **30-Second Reply:** "I'm not saying *existence* depends on your legs; I'm saying the *criterion for openness* does. If Presentism requires a sharp line between 'open' and 'fixed,' and our access to that line is fuzzy and agent-relative, then Presentism is asking for a sharp line where there isn't one. Better to admit openness is graded than to break reality over it."
  **Weakness:** This concedes that existence *might* be vague. Presentists hate vague existence. If they push hard here, you might have to retreat to: "The *epistemic* status is vague, which is why we shouldn't use it to define ontology."

  #### **3. The Professor (Medium-High Damage)**
  **Objection:** "You say the Presentist should refuse the causal move. But isn't that just begging the question back? They'll say 'Openness is metaphysical, not causal.' You haven't given them a reason to accept your definition, you've just asserted it."
  **30-Second Reply:** "I'm not asking them to accept it as true. I'm arguing it's the *only* definition that makes the R–P argument work. If they define openness metaphysically, R–P loses its grip on physics. I'm showing them the price of the ticket: keep metaphysical openness, but lose the physics argument against you."
  **Weakness:** The Prof might say, "Good, then R–P is dead, why are we talking about it?" You need to emphasize that R–P is still the main threat students face, so dismantling its engine is useful.

  #### **4. Presentist #2 (Medium Damage)**
  **Objection:** "Why should I care about the 'action cone'? I can't affect Andromeda, but I can still say truths about it. Truthmakers don't require causal reach. I can know the fleet is launched without being able to stop it."
  **30-Second Reply:** "Because R–P relies on the intuition that if it's 'fixed' for one observer, it's 'real' for all. That intuition comes from causal reach. If you sever truth from causal reach, you save Presentism, but you lose the motivation for the Block Universe too. I'm leveling the playing field."
  **Weakness:** This might sound like you're attacking Eternalism too. Make sure you frame it as "clarifying the debate," not "destroying Eternalism."

  #### **5. The Growing Block Theorist (Medium Damage)**
  **Objection:** "The action cone works for the future, sure. But what about the past? The past is fixed but causally unreachable (distant past). Your cone makes the distant past 'open' because I can't change it. That collapses Growing Block into Presentism."
  **30-Second Reply:** "The action cone is about *decision*, not *influence*. I can't change the past, so it's outside my action cone in the sense of 'decidable.' But it's inside my 'record cone' (light reaching me). I'm distinguishing 'open to change' from 'accessible to knowledge.' R–P conflates them."
  **Weakness:** You need to be careful not to introduce too many new cones. Keep it simple: "Action = Future, Record = Past."

  #### **6. The Physicist (Follow-up / Medium Damage)**
  **Objection:** "Your Newtonian analogy is still mathematically wrong. In Galilean relativity, time is invariant. You can't tilt a simultaneity slice by moving. You're teaching bad physics to make a metaphysical point."
  **30-Second Reply:** "I'm not tilting the *time* slice, I'm tilting the *region of effective agency*. In Newtonian time, $t$ is constant, but my *ability to intervene* at $t + \Delta t$ depends on my velocity. The math of spacetime doesn't tilt, the math of *control* does. R–P treats control as spacetime."
  **Weakness:** This is a semantic pivot. If they are sticklers for terminology, they will call this "misleading." Admit it's a metaphor for the metaphysical intuition, not a spacetime diagram.

  #### **7. General Room (Low Damage)**
  **Objection:** "The Andromeda argument is about galactic scales and light speed, not human walking speed. Your 'action cone' is negligible compared to the light cone. Why does the human scale matter?"
  **30-Second Reply:** "Because the *logic* is identical. R–P says 'different motion = different reality.' I'm saying 'different motion = different access.' If the argument fails at human scales because access $\neq$ reality, it fails at galactic scales for the same reason. The scale doesn't fix the category error."
  **Weakness:** None really, this is a solid logical point.

  #### **8. The "So What?" (Low Damage)**
  **Objection:** "Okay, suppose you're right. R–P is bad. Eternalism is still the best explanation for Special Relativity. What have you actually saved for the Presentist?"
  **30-Second Reply:** "I've saved them from fighting physics battles they can't win. They don't need to deny Lorentz transformations; they just need to deny that Lorentz transformations map directly to *ontological* status. It moves the debate back to metaphysics, where they belong."
  **Weakness:** The Prof might agree but say, "That's what I've been saying for 20 years." Acknowledge their influence!

  ---

  ### **The Doomsday Question**
  **You are right to be worried about this one.**

  **The Question:** "If the 'Action Cone' determines what is open/real, and the Action Cone varies by agent (a fly vs. a human vs. a god), then **existence is agent-relative.** Does a fly live in a different ontology than I do? If not, why is your cone privileged?"

  **Why it's scary:** It forces you to either accept solipsism (everyone has their own reality) or admit the cone is irrelevant to reality.

  **The Defense Strategy:**
  Do **not** try to say the cone *makes* reality. Say the cone *reveals* the incoherence of using causal reach to *define* reality.
  **Draft Reply:** "I'm not saying the cone *makes* reality agent-relative. I'm saying if you *define* reality via causal reach (as R–P does), you *get* agent-relative reality, which is absurd. Therefore, the definition is wrong. The fly and I share an ontology; R–P just fails to describe it because it confuses 'what I can do' with 'what is.'"

  **Prep Tip:** If they ask this, look at the **Professor** when you answer. This aligns with their view that R–P begs the question. It turns the Doomsday Question into a point for your Prof, which buys you safety.

  ### **Final Advice for the Seminar**
  *   **Don't defend the Newtonian math too hard.** If the physicist corners you on Galilean invariance, concede: "The math doesn't tilt, the *intuition* does. I'm using the Newtonian case to isolate the metaphysical assumption from the physical invariant."
  *   **Align with the Prof.** Your thesis basically supports their view (R–P is bad) but adds a specific mechanism (Action Cone). Frame your innovation as "supporting evidence for your critique, Professor."
  *   **Own the Undergrad Status.** If you get stuck, say: "That's beyond my current pay grade, but my intuition is..." They will cut you slack if you're honest.

  Good luck. You've got a solid angle here; just don't let them bully you on the physics. You're doing metaphysics, they're doing physics. Keep the lane discipline.
