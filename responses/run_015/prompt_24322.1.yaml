answer: |-
  This is a classic spot to be in. The reason you feel like you're losing the thread is that the "statue and lump" debate isn't a puzzle with a solution; it's a **trilemma**. The literature is essentially a catalog of which intuitive principle each theorist is willing to sacrifice to save the others.

  If you want a "spec" for a theory of material constitution, you are asking for a set of necessary conditions that a theory must satisfy to be considered adequate. The problem, as you suspected, is that the spec is **over-constrained**. No theory satisfies all the desiderata simultaneously.

  Here is the specification sheet for an adequate theory of material constitution, the tensions between them, and a scorecard of the main contenders.

  ---

  ### The Desiderata (The Spec)

  To count as adequate, a theory must account for the following five constraints. If a theory ignores one, it must provide a compelling error theory (an explanation of why our intuition about that constraint is wrong).

  #### 1. The Modal Discrimination Requirement (Leibniz's Law)
  *   **The Demand:** The theory must respect the indiscernibility of identicals. If $x$ and $y$ are identical, they must share all properties.
  *   **The Case:** The Lump ($L$) could survive being squashed into a blob. The Statue ($S$) could not. Therefore, $L$ has a property ($S$ lacks) = "could survive squashing."
  *   **Why it matters:** This is the engine of the problem. If a theory says $S = L$, it must explain away this modal difference without violating logic. If it says $S \neq L$, it must explain how they differ.
  *   **Cost of Failure:** Logical incoherence.

  #### 2. The Spatial Coincidence Requirement (The Data)
  *   **The Demand:** The theory must account for the fact that $S$ and $L$ share all their *microphysical* parts and occupy the exact same spatial region at time $t$.
  *   **The Case:** You cannot point to the statue without pointing to the lump. They weigh the same, reflect light the same, and displace water the same.
  *   **Why it matters:** Any theory that posits two objects must explain how two material things can be in the same place at the same time without interacting or colliding.
  *   **Cost of Failure:** Empirical inadequacy (denying the physical setup).

  #### 3. The Principle of Spatial Uniqueness (No Co-location)
  *   **The Demand:** Two distinct material objects cannot occupy the same spatial region at the same time.
  *   **The Case:** If you put a book on a table, there are two objects. If you melt the book into the table, it's one object. We generally think distinct objects exclude each other spatially.
  *   **Why it matters:** This is the primary argument *against* saying there are two objects. It preserves the link between objecthood and spatial occupation.
  *   **Cost of Failure:** Ontological "spookiness" (ghostly co-location).

  #### 4. The Preservation of Ordinary Objects (Common Sense)
  *   **The Demand:** The theory should not deny the existence of obvious medium-sized dry goods (like statues) or obvious masses of matter (like lumps of clay).
  *   **The Case:** If you walk into a gallery, there is a statue. If you weigh the clay, there is a lump.
  *   **Why it matters:** A metaphysics that concludes "there are no statues" or "there are no lumps" has a high burden of proof. It conflicts with basic phenomenological and linguistic practice.
  *   **Cost of Failure:** Revisionism (telling common sense it is wrong).

  #### 5. The Non-Arbitrariness Requirement (No Proliferation)
  *   **The Demand:** The theory must not generate an explosion of objects from the same region without a principled distinction.
  *   **The Case:** If the Lump exists, does "Lump-minus-a-bit" exist? If the Statue exists, does "Statue-without-the-nose" exist? If you allow $S$ and $L$ to coincide, why not $L$, $L^*$, $L^{**}$, etc.?
  *   **Why it matters:** This prevents "ontological profligacy." If every possible sortal concept picks out a distinct object, the world is infinitely crowded.
  *   **Cost of Failure:** Absurdity (the "Too Many Objects" problem).

  ---

  ### The Incompatibility Thesis (Where the Spec Breaks)

  You were right to flag this. **You cannot satisfy all five desiderata.** Specifically, there is a hard tension between **Modal Discrimination**, **Spatial Uniqueness**, and **Preservation of Ordinary Objects**.

  1.  **Modal Discrimination** says $S \neq L$ (because they have different modal properties).
  2.  **Preservation of Ordinary Objects** says both $S$ and $L$ exist.
  3.  **Spatial Uniqueness** says if $S \neq L$, they cannot be in the same place.
  4.  **Spatial Coincidence** says they *are* in the same place.

  To build a theory, you must drop at least one of these. This is why the debate never ends. The "Spec" doesn't identify a winner; it identifies the **trade-offs**.

  *   **If you keep Modal Discrimination + Preservation:** You must drop **Spatial Uniqueness**. (Result: Co-locationism/Constitution View).
  *   **If you keep Spatial Uniqueness + Preservation:** You must drop **Modal Discrimination**. (Result: Strict Identity / Relative Identity).
  *   **If you keep Spatial Uniqueness + Modal Discrimination:** You must drop **Preservation**. (Result: Eliminativism).

  ### The "Killer" Requirement

  Which single requirement knocks out the most views?

  **The Principle of Spatial Uniqueness (No Co-location).**

  Here is why: It is the most aggressive filter against the most intuitively attractive view.
  The most natural reaction to the puzzle is: *"Well, obviously the lump exists, and obviously the statue exists, and obviously they have different properties, so they must be two things sharing the same space."* (This is the Constitution View).

  **Spatial Uniqueness kills this view dead.** It forces you to say that either the statue isn't real, the lump isn't real, or they are actually identical (despite the modal argument). It is the requirement that forces metaphysicians into the most counter-intuitive corners (like denying the existence of statues). Most "moderate" views die on this rock.

  ---

  ### Scorecard of Main Contenders

  Here is how the major theories score against the spec. Note that a "Fail" often means the theory *rejects* the desideratum intentionally.

  #### 1. The Constitution View (Co-locationism)
  *   **Thesis:** $S$ and $L$ are distinct objects that constitute each other and occupy the same space.
  *   **Modal Discrimination:** **Pass.** ($S \neq L$, so different modal properties are fine).
  *   **Spatial Coincidence:** **Pass.** (Accepts they share space).
  *   **Spatial Uniqueness:** **FAIL.** (Explicitly rejects this principle; argues co-location is possible).
  *   **Preservation of Ordinary Objects:** **Pass.** (Both exist).
  *   **Non-Arbitrariness:** **Weak.** (Struggles to explain why *only* these two coincide and not infinite others).
  *   **Verdict:** Saves common sense and logic, but costs ontological parsimony.

  #### 2. Eliminativism (Nihilism about Statues)
  *   **Thesis:** Only the Lump exists. "Statue" is just a name we give to the lump when it's shaped nicely.
  *   **Modal Discrimination:** **Pass.** (There is only one object, so no conflict).
  *   **Spatial Coincidence:** **Pass.** (Only one thing is there).
  *   **Spatial Uniqueness:** **Pass.** (Only one object per region).
  *   **Preservation of Ordinary Objects:** **FAIL.** (Denies statues exist).
  *   **Non-Arbitrariness:** **Pass.** (No proliferation).
  *   **Verdict:** Logically clean and parsimonious, but highly revisionary.

  #### 3. Dominant Sorts (Sortal Essentialism)
  *   **Thesis:** There is only one object. It falls under the sortal "Statue," which dominates the sortal "Lump." The object *is* the statue, and the "lump" is just the matter.
  *   **Modal Discrimination:** **Fail/Tricky.** (Must argue the object *couldn't* survive squashing, denying the lump intuition).
  *   **Spatial Uniqueness:** **Pass.** (One object).
  *   **Preservation of Ordinary Objects:** **Partial.** (Saves the statue, eliminates the lump as an object).
  *   **Verdict:** Tries to split the difference, but often accused of being arbitrary (why does "Statue" dominate "Lump"?).

  #### 4. Temporal Parts (Perdurantism / 4Dism)
  *   **Thesis:** $S$ and $L$ are distinct 4D "worms." They share a temporal part (the stage at time $t$) but diverge in the future (when the statue is crushed).
  *   **Modal Discrimination:** **Pass.** (Different worms have different futures).
  *   **Spatial Uniqueness:** **Pass.** (They don't wholly coincide; they share a *part*).
  *   **Preservation of Ordinary Objects:** **Pass.** (Both worms exist).
  *   **Non-Arbitrariness:** **FAIL.** (Leads to "Temporal Plenitude"—infinite objects overlapping at every moment).
  *   **Verdict:** Solves the modal puzzle elegantly but explodes the ontology of the present moment.

  #### 5. Relative Identity
  *   **Thesis:** Identity is not absolute. $S$ is the same *lump of matter* as $L$, but not the same *statue*.
  *   **Modal Discrimination:** **Pass.** (Identity is sortal-relative).
  *   **Spatial Uniqueness:** **Pass.** (One object, described two ways).
  *   **Preservation of Ordinary Objects:** **Pass.**
  *   **Logic:** **FAIL.** (Violates standard Leibniz's Law logic; requires revising first-order logic).
  *   **Verdict:** Saves the phenomena by changing the rules of logic.

  ### Summary for your Seminar

  When you are in seminar, listen for which desideratum the speaker is sacrificing.
  *   If they say "There are two objects," ask: **"How do you satisfy Spatial Uniqueness?"**
  *   If they say "There is one object," ask: **"How do you satisfy Modal Discrimination?"**
  *   If they say "Statues don't exist," ask: **"How do you satisfy Preservation of Ordinary Objects?"**

  The theory that "settles" the question without assuming the answer doesn't exist. The work of the seminar is to decide which intuition (Logic, Parsimony, or Common Sense) is the one you are willing to let go.
