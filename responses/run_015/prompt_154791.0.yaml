answer: |-
  The translation reveals that the paradox of phenomenal judgment is largely a confusion between observational conditioning and interventional tracking, though a normative residue regarding justification remains inexpressible in graphical terms.

  When we formalise the epiphenomenalist position using directed acyclic graphs, the neural state $N$ is a parent of the phenomenal experience $E$, and $N$ is also a parent of the behavioural report or judgment $J$. Crucially, there is no directed edge from $E$ to $J$. The paradox arises when we interrogate the status of $J$ relative to $E$ within this structure. Separating the three readings you identified clarifies which objections hold water under causal scrutiny.

  On the evidential reading, the worry is that $J$ lacks the correct causal history to constitute knowledge of $E$. In causal inference terms, this is a claim about identifiability and causal attribution. Because $E$ is not an ancestor of $J$, the effect of $E$ on $J$ is not identifiable; indeed, the causal effect is structurally zero. However, $J$ and $E$ are d-connected via the common cause $N$. Consequently, conditioning on $J$ updates the probability of $E$ ($P(E|J) \neq P(E)$), satisfying probabilistic relevance. The evidential objection thus translates to the claim that probabilistic relevance via a back-door path is insufficient for justification; one requires a front-door path or direct descent. This reading survives translation robustly as a constraint on valid causal mechanisms for knowledge, distinguishing mere correlation from causal signalling.

  The self-undermining reading posits that the theory predicts the belief supporting it is not explained by the phenomenon it concerns. Graphically, the theory asserts a structural model where $E$ is excluded from the equation determining $J$. If the belief in the theory is itself a instance of $J$, then the model asserts that the truth of the theory (regarding $E$) is causally irrelevant to the formation of the belief. This creates a model consistency problem. If we treat the theory as a data-generating process, it predicts that $J$ is independent of $E$ under intervention on $N$. Yet, the theorist uses $J$ to infer properties of $E$. This is not strictly a logical contradiction, but it renders the reliability of $J$ as a measure of $E$ unexplained within the model. The reliability is an accidental byproduct of the confounding structure ($N$), not a designed feature of the system. This reading translates cleanly as a failure of mechanism design: the system produces true beliefs about $E$ only so long as the confounder $N$ remains stable, leaving the belief vulnerable to distributional shift.

  The semantic reading claims reference is fixed by causal contact. Translating this requires a causal theory of content, where the content of $J$ is determined by its causal parents. If $E$ is not a parent of $J$, then $E$ does not appear in the structural equation for $J$. Under a strict causal theory of reference, $J$ cannot be about $E$ because $E$ is not in the Markov boundary of $J$. However, this relies on external philosophical assumptions about content fixation that are not intrinsic to the calculus itself. Of the three, the evidential reading emerges as the strongest because it relies purely on the topology of the graph and the conditions for identifiability, whereas the semantic reading requires importing a specific theory of intentionality, and the self-undermining reading relies on pragmatic constraints on theory acceptance.

  Your half-formed thought regarding association versus intervention is precisely correct and maps directly onto the distinction between observational and interventional distributions. In the epiphenomenalist graph, the dependence of $J$ on $E$ is purely associational, driven by the confounder $N$. The quantity $P(J|E)$ is informative, but the causal effect $P(J|\text{do}(E))$ is null. Your intuition that first-person authority requires tracking under intervention on the phenomenal node captures the demand that $J$ should be a valid surrogate endpoint for $E$. In clinical trials, a surrogate endpoint must capture the net effect of treatment on the true outcome. Here, if we treat $E$ as the true outcome and $J$ as the surrogate, epiphenomenalism fails the surrogacy criterion because intervening on $E$ (setting $E$ to a specific value) yields no change in $J$.

  The distinction you propose exists rigorously in causal inference terms. It is the difference between $P(J|E)$ and $P(J|\text{do}(E))$. The philosophical worry is that authority requires the latter to mirror the former, or at least to be non-null. However, your suggestion that authority requires tracking "when those ordinary causes are held fixed" introduces a subtle counterfactual complication. In the standard graph, $E$ is determined by $N$ (and perhaps an error term $\epsilon_E$). To intervene on $E$ while holding $N$ fixed is to intervene on the error term or to treat $E$ as exogenous for the purpose of the test. This corresponds to a principal stratification analysis where we examine the effect of $E$ on $J$ within strata of $N$. If $E \rightarrow J$ is absent, the principal causal effect is zero. The paradox trades on the intuition that first-person access implies a structural edge $E \rightarrow J$ that persists even when $N$ is controlled. For the report to have what the paradox says it lacks, the graph must include a direct edge from $E$ to $J$, making $J$ a descendant of $E$. This would render $E$ identifiable from $J$ via causal path analysis rather than mere confounding. Without this edge, $J$ is merely a correlate, not a tracker, in the interventional sense.

  The residue report indicates significant divergence between the philosophical problem and the causal framework. Several components translate cleanly. The causal topology ($N \rightarrow E$, $N \rightarrow J$, no $E \rightarrow J$) is unambiguous. The distinction between statistical dependence and causal influence is formally captured by the do-operator. The problem of reliability under distributional shift is expressible via transportability conditions.

  However, other components survive only with distortion. The concept of 'justification' is translated into 'reliability' or 'identifiability'. In epistemology, justification is normative; it concerns whether one *ought* to hold a belief. In causal inference, reliability is descriptive; it concerns whether the belief correlates with truth across interventions. The translation strips the normativity, converting a question about rational entitlement into a question about mechanism stability. This distortion is significant because the paradox often hinges on the irrationality of believing a theory that renders one's evidence idle, not merely the unreliability of the evidence.

  Furthermore, certain elements have no expression in the vocabulary at all. The 'first-personal character' of the judgment is not a structural property of the graph. A graph can represent that $J$ is caused by $N$, but it cannot represent that $J$ feels like something from the inside. Similarly, 'aboutness' or intentionality is not intrinsic to DAGs; edges represent causal influence, not semantic reference. We can stipulate a causal theory of content, but the graph itself does not enforce it. Finally, the qualia themselves ($E$) are treated as nodes, but the framework is agnostic regarding their intrinsic nature. They are merely variables subject to structural equations.

  This residue points to a genuine gap in the framework, but not necessarily a flaw. Causal inference is designed to model nomological relationships between variables, not to solve normative epistemological problems or account for phenomenology. The gap arises from expecting a descriptive tool to resolve a problem that relies on normative and phenomenological premises. To remove the unclarity, one would need to make precise what 'justification' means in structural terms. If justification is defined as 'high probability under all relevant interventions', then the causal framework can assess it. If justification requires a normative relation beyond structural coupling, the framework cannot capture it. The paradox persists only if one insists that the normative status of belief cannot be reduced to the reliability of the causal process producing it. Thus, the translation succeeds in isolating the structural incoherence of epiphenomenalism regarding tracking, but it dissolves the normative force of the paradox by revealing it as a category error between descriptive causality and normative justification. The causal vocabulary clarifies that the epiphenomenalist graph renders $J$ a biased estimator of $E$ under intervention, but it cannot adjudicate whether such an estimator is rationally permissible to trust without additional normative axioms.
