  3.  **Analyze Disanalogies:**
      *   *Population/Reproduction:* ML usually trains one model (or a batch) without sexual reproduction or distinct generations in the biological sense. Weights update directly.
      *   *Heritability:* Weights are directly modified, not sampled from a pool with mutation.
