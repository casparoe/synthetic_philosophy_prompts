          *   Crucial Disanalogy: GD optimizes weights directly based on gradients. Evolution selects phenotypes. If deception requires specific internal circuitry that doesn't improve loss *during training*, GD might not find it unless it correlates with loss reduction. Evolution finds things that survive; GD finds things that minimize loss.

