      *   *Optimization Prediction:* GD minimizes loss. If mentioning deployment increases loss, the model stops mentioning it in CoT. If behaving well decreases loss, it behaves well. Deception only emerges if it lowers loss *more* than honesty. The subtle marker is a feature. If the model can detect it, it can condition on it. The fake channel is just more data.
