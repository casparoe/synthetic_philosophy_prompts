prompt: |-
  In June I'm giving the commencement address at Marlowe College, my undergraduate alma mater — a liberal arts college of about nine hundred students, 214 of them graduating. Its seal reads *Truth sought together*; the president will open by reading from the seal, the seniors will have signed an honor code that asks them to seek the truth and to speak it, and the college chaplain will have given an invocation in which she means something quite specific and theological by the word. In the audience will be the class (four philosophy majors among them, one of whom wrote a senior thesis on the prosentential theory of truth and will be listening for tells), the faculty in regalia, several hundred parents and grandparents, my father — a retired judge with no patience for anything he would call clever — and the director of the college's new Center for Truth and Public Life, who invited me and who has twice said she hopes I will say something about truth. What she has in mind is the spring's academic-integrity scandal: a great many essays and at least two senior theses turned out to have been written by a language model, and the campus has spent the year using the word truth constantly while meaning a dozen different things by it.

  The difficulty is that I am a philosopher, and I am a deflationist about truth. I do not think truth is a substantive property with a hidden nature that inquiry gradually homes in on; I think that *is true* is a thin device — for endorsing a claim without repeating it, for generalizing over everything someone said, for semantic ascent — and that the real work in that neighborhood is done by evidence, justification, care, and the norms of assertion. So I cannot, without mental reservation, give the speech everyone is expecting: truth as a mountain the graduates will spend their lives climbing, truth as correspondence to a mind-independent reality that explains why true beliefs serve us, Truth with a capital T as something to pledge one's life to, and a peroration sending the class out to serve it.

  What I want from you is the address I would actually give. Concretely: twelve to fifteen minutes, spoken English, no named theorists and no jargon; the families and the chaplain have to be able to follow it and be moved by it, my father must not hear it as condescension, and the four philosophy majors should recognize a deflationist speaking rather than someone who lost their nerve. It cannot be a debunking lecture, and it cannot be a shrug. It cannot cheat either: the emotional climax must not be carried by exactly the robust-truth rhetoric the rest of the speech disavows. It has to do something with the scandal — the graduates should come away with something they can actually do about what they assert, what they pass along, and what they hand in under their own name. And it has to face rather than dodge one question in particular: if *true* is thin, what is the honor code asking these students to do when it asks them to seek the truth? My own guess is that the honest answer runs through the difference between being wrong and not caring whether one is wrong — the vice of indifference to how things actually are, which needs no metaphysics of truth in order to be a real vice — and through the fact that saying *what she told me is true* is a way of vouching for a person you cannot fully quote. But do not feel bound by that guess if you can do better.
reasoning: |-
  Here's a thinking process that leads to the suggested commencement address:

  1.  **Analyze the Request:**

      *   **Speaker:** A philosopher, specifically a deflationist about truth.
      *   **Audience:** Marlowe College (liberal arts, ~900 students, 214 grads). Includes:
          *   Graduating class (4 philosophy majors, one wrote on prosentential theory).
          *   Faculty.
          *   Parents/Grandparents.
          *   The Speaker's Father (retired judge, no patience for "cleverness").
          *   Director of the Center for Truth and Public Life (invited the speaker, wants something said about truth regarding the recent AI/academic integrity scandal).
          *   College Chaplain (theological view of truth).
      *   **Context:** June commencement. College seal: *Truth sought together*. Recent scandal: AI-written essays/theses. Campus has been overusing "truth" with conflicting meanings.
      *   **Constraint 1 (Philosophical):** Must be consistent with deflationism (truth is not a substantive property, "is true" is a logical device). Cannot preach "Truth as a Mountain" or "Correspondence to Reality."
      *   **Constraint 2 (Tone):** 12-15 minutes spoken English. No jargon, no named theorists. Must be moving for families/chaplain, not condescending to the father, recognizable to philosophy majors as deflationist, but not a debunking lecture or a shrug.
      *   **Constraint 3 (Content):** Must address the scandal (what to do about assertions/passing things along). Must answer: If *true* is thin, what does the honor code mean by "seek the truth"?
      *   **Key Insight provided:** Focus on the difference between *being wrong* and *not caring whether one is wrong* (indifference). Focus on vouching for others when we say "what she said is true."
      *   **Goal:** An emotional climax that doesn't rely on robust-truth rhetoric but still lands with weight.

  2.  **Deconstruct the Philosophical Challenge:**

      *   *Deflationism:* To say "P is true" is just to say "P." It adds no metaphysical weight. It allows us to say "Everything the witness said is true" without listing every statement.
      *   *The Problem:* Commencement speeches usually rely on Truth as a Noble Quest. Deflationism sounds like "Truth doesn't matter."
      *   *The Solution:* Shift the weight from the *property* of truth to the *act* of asserting. The value isn't in the metaphysical glue between word and world; it's in the *responsibility* of the speaker.
      *   *The Honor Code:* "Seek the truth" $\neq$ "Find the Capital-T Reality." It means "Do not be indifferent to how things are." It means "Take responsibility for what you assert."
      *   *The Scandal:* AI writing isn't just "lying"; it's abdicating the responsibility of assertion. It's saying words without standing behind them.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the setting, the seal, the weight of the word "Truth." Establish rapport with the father (no nonsense) and the philosophy majors (subtle nods).
      *   **The Elephant in the Room:** Address the scandal without being punitive. Frame it as a crisis of *voice*, not just rules.
      *   **The Philosophical Pivot (The Deflationist Move):** Explain "truth" simply. Don't use the word "deflationism." Use the idea that calling something true is like giving a promise or a handshake. It's about *endorsement*.
      *   **Reframing the Honor Code:** "Seeking truth" isn't hunting a butterfly; it's tending a garden of trust. It's about caring when you're wrong.
      *   **The AI/Scandal Connection:** Using AI to write a thesis isn't cheating because a robot wrote it; it's cheating because *you* didn't say it. You didn't stand behind the words.
      *   **The Charge to Graduates:** What do they do out there? Vouch carefully. Listen carefully. Don't be indifferent.
      *   **Closing:** Bring it back to "Truth sought together." The "together" is the hard part.

  4.  **Refining the Tone:**

      *   *For the Father:* Keep sentences relatively crisp. Avoid academic posturing. Focus on integrity and character.
      *   *For the Chaplain:* Use language of vocation, calling, and covenant without co-opting theology.
      *   *For the Philosophy Majors:* Use phrases like "semantic ascent" (maybe too jargon-y? Let's stick to "stepping back"), "endorsement," "vouching." The prosentential theorist will catch the nuance that "is true" acts as a pro-sentence.
      *   *For the Director:* Address the scandal directly but elevate it beyond policy.

  5.  **Drafting - Specific Considerations:**

      *   *Time:* 12-15 minutes is roughly 1,500 to 1,800 words spoken at a moderate pace.
      *   *Jargon Check:* Ensure "deflationism," "propositional," "ontology" don't appear.
      *   *The "Climax":* Needs to be about *care*. The opposite of truth isn't falsehood; it's indifference.

  6.  **Writing - Iteration 1 (Mental Outline):**
      *   Hello Marlowe. Nice seal.
      *   Everyone talks about truth. Director wants it. Chaplain prays it.
      *   I'm a philosopher. I think truth is simple. To say "that's true" is to say "I agree."
      *   So why the scandal? Because people said things they didn't agree with or didn't think about.
      *   Honor code means: Care about being right.
      *   Go out and vouch for things carefully.
      *   End.

      *Critique 1:* Too dry. Needs more emotion. Needs to address the father's skepticism. Needs to handle the AI issue more delicately.

  7.  **Writing - Iteration 2 (Fleshing out the narrative):**
      *   Start with the seal. *Truth sought together.*
      *   Acknowledge the tension. We use the word so much it loses meaning.
      *   My job: Philosopher. Usually, we complicate things. Today, I want to simplify.
      *   The AI issue: It's not about the tool. It's about the signature. When you sign your name, you say "I stand here."
      *   Deflationist angle: Truth isn't a treasure. It's a relationship between you and your words.
      *   Honor Code: It's not "Find the Absolute." It's "Don't be careless."
      *   Closing: The world needs people who stand behind their words.

  8.  **Polishing and Tuning (incorporating specific constraints):**
      *   *Father:* Make sure I don't sound like I'm saying "Truth is an illusion." I need to say "Truth is a commitment." That appeals to a judge.
      *   *Philosophy Majors:* Ensure the distinction between the *property* of truth and the *practice* of truth-telling is clear. Use the "vouching" concept heavily.
      *   *Chaplain:* Acknowledge the spiritual weight of "seeking" without validating a metaphysical realism I don't hold.
      *   *Scandal:* Don't shame them, but don't let them off the hook. Focus on the *loss of voice*.

  9.  **Final Review against constraints:**
      *   12-15 mins? (Word count check: ~1600-1800 words).
      *   No jargon? (Check: "deflationism," "prosentential," "ontology" removed).
      *   Emotional climax? (Focus on the courage to be corrigible).
      *   Address the "thinness" of truth? (Yes, by shifting weight to the speaker).

  10. **Final Polish:** (Self-Correction during drafting) *Wait, I need to make sure I don't accidentally slip into pragmatism ("truth is what works"). Deflationism is about the logical function of the word. I need to emphasize that "is true" allows us to trust each other.* *Okay, the "vouching" metaphor works best there.* *Also, ensure the father knows I respect the law/judgment.* *Add a line about testimony.*

  *(Self-Correction on Length)*: 15 minutes is longer than I initially thought. I need to expand on the implications of the scandal and the specific advice for the future. I need to let the silence breathe in the text.

  *(Self-Correction on Philosophy)*: The prompt mentions the "prosentential theory." I shouldn't name it, but I should use the logic: "It is true" functions like "Yes." I will weave that in.

  *(Final Plan)*:
  1. Introduction: The Seal and the Weight of the Word.
  2. The Philosopher's Confession (simplifying truth).
  3. The Scandal (Abdication of voice).
  4. The Honor Code (Caring about being wrong).
  5. The Charge (Vouching and Trust).
  6. Conclusion (Together).

  Let's write.
answer: |-
  President, faculty, families, and the graduating class of Marlowe College.

  It is an honor to stand here. I know this place. I know the weight of the regalia in June heat. I know the specific relief of finishing a thesis, and the specific anxiety of wondering if anyone will read it. I also know the seal on the wall behind us. *Truth sought together.*

  I am aware that I have been asked to speak about that word. I am aware that this year, that word has been heavy on this campus. The Director of the Center for Truth and Public Life asked me to address it. The Chaplain will invoke it. The Honor Code you signed demands you seek it. And, given the events of this past spring, I know that for many of you, the word has felt bruised. We have spent a year talking about academic integrity, about language models, about what counts as original work. We have used the word *truth* so often it has begun to sound like a coin that has been passed around so many times the face is worn off.

  I am a philosopher. Usually, when a philosopher stands up, you expect them to complicate things. You expect me to put on my glasses, clear my throat, and tell you that truth is far more complex than you imagined. But today, I want to do the opposite. I want to tell you that truth is simpler than you think. But I also want to tell you that because it is simpler, it is harder.

  There is a way of talking about truth that treats it like a mountain. You hear this often. Truth is a peak in the distance, covered in snow, hard to climb. We are told we must ascend toward it, that it exists whether we are there or not, and that our job is to map its contours. It is a noble image. It fits on a plaque. But it is not how truth actually works in a human life.

  If you treat truth like a mountain, you start to think that the most important thing is the destination. You start to think that if you just stand in the right spot, the view will force itself upon you. You start to think that truth is a thing you possess, like a stone in your pocket.

  But consider how you actually use the word. When you say to a friend, "It is true that it is raining," you are not pointing to a metaphysical relationship between the sky and your sentence. You are simply saying, "It is raining." When you say, "Everything the witness said is true," you are not describing a magical property of their words. You are saying, "I stand with them. I am willing to say what they said."

  To call something true is not to discover a hidden secret of the universe. It is to endorse a claim. It is to put your name next to it. It is a promise that if someone else checks, they will find what you found.

  This matters because of what happened here this year. We had a scandal involving essays and theses written by machines. I am not here to scold you. The technology is here; it is not going away. But we need to be clear about why it felt like a violation of the Honor Code. It was not because a robot has no soul. It was not because the college owns your intellectual property.

  It was because when you submit work under your name, you are making a specific kind of promise. You are saying, "I assert this." You are saying, "If you ask me why I wrote this sentence, I can tell you." You are saying, "I care if this is right, and I care if this is wrong."

  When you hand in words you did not write, words you did not weigh, words you did not choose, you are breaking a promise not to the college, but to the people who will read you. You are asking them to trust you, while you have withheld the thing that makes trust possible: your own judgment.

  This brings me to the Honor Code. It asks you to "seek the truth." If truth were a mountain, that would mean climbing. But if truth is this act of endorsement, this act of standing behind your words, what does it mean to seek it?

  It means you must cultivate a specific kind of care.

  There is a difference between being wrong and not caring whether you are wrong. We are all wrong. I am wrong. Your professors are wrong. The retired judge in the third row is wrong, frequently. Being wrong is not a sin. It is a condition of being a creature with limited eyes and limited time.

  But indifference? Indifference is a vice. Indifference is looking at the world and saying, "It does not matter to me how this actually is, as long as it works for me." Indifference is using words because they sound good, not because they hold up. Indifference is passing along a story because it makes you look good, without checking if it happened.

  The Honor Code is not asking you to be infallible. It is asking you to be incapable of indifference. It is asking you to feel a sting when you are mistaken. It is asking you to treat your own assertions as things that have consequences for other people.

  This is what I want you to take from Marlowe. Not a definition of truth. But a discipline of assertion.

  When you leave here, you will go into jobs where you will be asked to speak. You will write emails. You will give presentations. You will testify, in courtrooms or in boardrooms or at dinner tables. You will be asked to vouch for things.

  Sometimes, you will be pressured to say things you do not fully believe. You will be told, "Just say it, it's standard practice." You will be told, "Nobody checks the details." You will be told, "It's just a formality."

  In those moments, you will remember that *is true* is a thin phrase, but it carries a heavy weight. To say "This is true" is to say "I am the one who is responsible for this." If you cannot stand behind the words, do not speak them. If you cannot check the facts, do not pass them on. If you did not do the work, do not sign the name.

  This is not just about honesty. It is about love.

  I know that sounds like a stretch. But think about the alternative. When we stop caring whether our words match the world, we stop being able to live together. If I cannot trust that your words represent your mind, I cannot coordinate with you. I cannot build with you. I cannot love you, because I do not know who *you* are. I only know the mask you are wearing.

  The scandal this year was painful because it threatened that trust. It made us wonder: Are we a community of speakers, or are we just a network of signals?

  But here is the good news. Trust is rebuildable. It is rebuilt in small moments. It is rebuilt when you admit you were wrong. It is rebuilt when you say, "I don't know." It is rebuilt when you refuse to repeat a rumor because you haven't verified it. It is rebuilt when you write your own sentences, even when they are clumsy, because they are yours.

  To the philosophy majors in the audience: You know the theories. You know the debates about correspondence and coherence and utility. You know that the word *truth* does not do any heavy lifting in the logic of our language. You know that saying "It is true that P" is just a way of saying "P."

  But you also know that the *practice* of truth-telling is the glue of civilization. The metaphysics can be thin. The ethics must be thick. Do not let your sophistication make you cynical. Do not let yourself think that because truth is not a magical substance, it does not matter. It matters precisely because it is not a thing, but a relationship. It is the relationship between you and the world, and between you and us.

  To the parents and families: You sent us your children. We are sending them back. We are sending them back with a warning. The world out there is noisy. There are people who will try to sell you certainty they do not possess. There are systems that will reward you for saying what is popular rather than what is right. There are tools that will offer to do your thinking for you.

  Your job, now, is to be the people who check. Be the people who ask, "How do you know that?" Be the people who value the struggle of understanding over the comfort of an answer. And when your children call you, and they are confused, and they are unsure, do not just give them the answer. Help them find the words they can stand behind.

  To the faculty: We must model this. We cannot just police plagiarism. We must design assignments where the process matters more than the product. We must show them that our own knowledge is hard-won, and that we, too, are subject to correction. We must seek truth *together*, which means we must be willing to be corrected by our students.

  And to the Class of Marlowe:

  You are graduating into a time that feels uncertain. You see institutions failing. You see leaders lying. You see the very idea of shared reality fraying. It is tempting to retreat. It is tempting to say, "Nothing is true, so I will just look out for myself."

  I am asking you to resist that temptation.

  I am asking you to believe that your voice matters. Not because it echoes in a canyon, but because it reaches another person. When you speak, you are offering a hand. When you speak the truth, you are saying, "Here is where I stand. You can put your weight here."

  That is what the seal means. *Truth sought together.* It does not say "Truth found." It does not say "Truth possessed." It says *sought*. It is a verb. It is an activity. And it says *together*.

  You cannot seek it alone. You need friends who will tell you when you are wrong. You need colleagues who will check your work. You need a community that values the correction as much as the claim. You need to be the kind of person who can hear "You are mistaken" and say "Thank you," rather than "How dare you."

  That is the work. It is not climbing a mountain. It is tending a garden. It is the daily, unglamorous work of making sure that what you say matches what you mean, and what you mean matches what is.

  It requires courage. It requires humility. It requires you to care more about how things are than about how you wish them to be.

  My father is here. He is a judge. He has spent his life listening to people swear to tell the truth. He knows that the oath is not magic. He knows that people lie. But he also knows that without the oath, without the commitment to the attempt, there is no justice. There is only power.

  I stand before you as a philosopher, but I stand with him on this. Without the commitment to the attempt, there is no education. There is only credentialing. There is no community. There is only a crowd.

  So, go out from this place. Do not go out to serve Truth with a capital T. Do not go out to die for an abstraction.

  Go out to speak clearly. Go out to listen generously. Go out to admit when you do not know. Go out to verify before you share. Go out to write your own words.

  And when you are tired, and the world seems to have forgotten the difference between a fact and a feeling, remember this day. Remember that you were sent out by a college that believes you are capable of care. Remember that you are part of a chain of people who have decided that it matters how things actually are.

  The word *true* is thin. But your commitment to it can be strong enough to hold up the world.

  Seek it. Together.

  Congratulations.
