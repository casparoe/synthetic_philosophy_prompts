      *   **Task:** Adjudicate the exchange move-by-move (5 steps), rate each (Clearly Mistaken to Clearly Right), justify ratings, determine who is more right overall, and identify what both are missing (theoretical resolution).

  2.  **Analyze the Specific Case:**
      *   *Evidence (E):* 1998 ocean-current anomaly (known since 1998).
      *   *Theory (C):* Proposed in 2023.
