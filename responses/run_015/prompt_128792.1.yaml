      *Missing Element:* Specifically, the **Marginal Likelihood** (integrating likelihood over the prior parameter space). This mathematically implements Jonas's "principled" vs "ad hoc" distinction without needing to know the historian's intent. A model with a wide parameter space tuned to fit E has a lower marginal likelihood than a tight model that predicts E. This resolves the "gerrymandering" debate objectively.

      Let's write.

      *Step 1 (Maya):* She claims Bayes Factor $\approx 1$. This is wrong if $P(E|\neg C) < 1$. Rating: **Partially Right / Misleading.**
      *Step 2 (Jonas):* He claims $P(E|C) > P(E|\neg C)$ is possible. Rating: **Mostly Right.**
      *Step 3 (Maya):* She claims Prior $P(C)$ needs discounting for tuning. Rating: **Mostly Right** (in spirit of overfitting).
      *Step 4 (Jonas):* He claims principled derivations don't need discounting. Rating: **Defensible.**
