answer: |-
  **OFFICE OF DESCRIPTIVE STANDARDS**
  **THE PLAIN NEURAL STYLE GUIDE (ED. 4.2)**
  **PREFATORY NOTE**

  This edition exists to align public syntax with established ontology. Users are reminded that propositional attitudes (belief, desire, intent) are legacy constructs akin to humours or phlogiston. While these terms persist in colloquial registers, their use in official documentation constitutes a category error. The state does not deny that citizens occupy real inner states; rather, it insists that folk psychology misdescribes them. Neural activation vectors are ontologically secure; "beliefs" are not. Writers may find the transition taxing. This difficulty is expected. It arises from habit, not from any deficiency in the vocabulary. Patience is advised.

  **ENTRY: BELIEF/DESIRE**
  **Banned:** Attributing representational content to a subject (e.g., "believes that p," "wants x").
  **Approved:** Specify the subject's coordinate within high-dimensional activation space.
  **Office Comment:** Users often resist the lexical expansion required here. Each unique configuration of neural firing requires a unique label. This is not bloating; it is precision.
  **Noncompliant:** "She believed it was raining and wanted to stay dry."
  **Compliant:** "She occupied rain-anticipation vector 44-B and initiated dryness-maintenance trajectory 9."
  **Note:** Do not attempt to combine vectors. A 'belief-desire' compound is theoretically incoherent.

  **ENTRY: MEAN/INTEND**
  **Banned:** Suggesting a sentence carries semantic content by virtue of authorial purpose.
  **Approved:** Describe the causal impact of the inscription on the reader's visual cortex.
  **Office Comment:** When the writer means to indicate a specific outcome, they should refer to the expected neural adjustment in the audience. Do not say what you intend the words to do; state what they will cause.
  **Noncompliant:** "I intend this clause to clarify the payment schedule."
  **Compliant:** "This inscription will induce payment-schedule calibration in the reader's occipital region."
  **Note:** Avoid implying that meaning exists prior to the causal chain.

  **ENTRY: BECAUSE/THEREFORE**
  **Banned:** Implying normative reasoning or logical consequence between events.
  **Approved:** Use sequential markers ("subsequent to," "following").
  **Office Comment:** Reason is a folk illusion. There is only sequence. A subject does not act *because* a premise is true; action follows activation.
  **Noncompliant:** "She took the umbrella because she thought it would rain."
  **Compliant:** "Umbrella retrieval occurred subsequent to rain-anticipation vector 44-B."
  **Note:** The compliant version correctly removes the false gap between reason and cause. The subject was pushed, not guided.

  **ENTRY: PREDICTION**
  **Banned:** Using folk psychology to forecast behavior (e.g., "He will come because he promised").
  **Approved:** Acknowledge folk heuristics as convenient but theoretically empty.
  **Office Comment:** We concede that attitudinal language often successfully anticipates what a person will do on Tuesday. This is a heuristic convenience, comparable to predicting weather by joint pain. It works without understanding.
  **Noncompliant:** "He will arrive at noon; he wants to be on time."
  **Compliant:** "He will likely arrive at noon. Folk models predict this, though they lack ontological grounding."
  **Note:** Do not mistake predictive utility for explanatory truth.

  **ENTRY: I/FEEL**
  **Banned:** First-person reports of qualia or subjective experience.
  **Approved:** Third-person report of nociceptive or sensory signals.
  **Office Comment:** The "I" is a grammatical fiction. Pain is not felt; it is registered. Users find this entry difficult. The advice is necessarily vague here, as the old vocabulary is deeply woven into grammar.
  **Noncompliant:** "I feel a sharp pain in my leg."
  **Compliant:** "System reports nociceptive signal in lower-left quadrant."
  **Note:** If you must use "I," treat it as a shorthand for "this organism."

  **ENTRY: PROMISE**
  **Banned:** Committing to future action via speech act.
  **Approved:** State high probability of future trajectory alignment.
  **Office Comment:** A promise implies a binding normative force that does not exist. There is only the likelihood of future behavior based on current calibration.
  **Noncompliant:** "I promise to pay you back."
  **Compliant:** "My current trajectory indicates a high probability of repayment."
  **Note:** The compliant version is honest. It does not claim to create an obligation where there is only physics.

  **ENTRY: AS IF**
  **Banned:** Treating subjects as if they had beliefs for predictive purposes.
  **Approved:** Do not do this.
  **Office Comment:** Instrumentalism is a slippery slope. To treat a citizen as if they had beliefs is to validate the error.
  **Noncompliant:** "Act as if he believes you."
  **Compliant:** "Act compatible with his current activation state."
  **Note:** There is no 'as if'. There is only what is.

  ***

  **Note to the Author**

  The objection that bites hardest is Entry 3 (Because/Therefore). By replacing normative reasons with mere causal sequence, the guide eliminates the distinction between acting for a bad reason and being causally pushed. This matters because it erases responsibility; if I act solely due to vector activation, I cannot be blamed for errors in reasoning, only malfunctioning. This shows that eliminativism struggles to accommodate the normative space where reasoning actually lives. I took a liberty with Entry 5 (I/Feel): strict eliminativism might deny qualia entirely, but I softened this to "vague advice" to fit your constraint that inner states remain real, just redescribed.
