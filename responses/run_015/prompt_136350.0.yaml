  Through the dust the cardboard breathes
  Heavy with the stored-up years
  Empty shelves where the loom once sang
  Cut shapes defining absent thread
  Arranged in stacks beneath the light
  Rectangles of void and light
  Down the column the voids align
  Here is the weave, the zigzag line
  One claims a name is hidden here
  Left by a hand that is no longer here
  Done to mark the work as theirs
  Seeking a signal left in air
  We stand above the silent stack
  Hunting for a familiar trace
  Another says it's just a test
  To see if the mechanism runs
  We look for intent in the steel
  Even when the holes conceal
  Choice is the tool we bring to bear
  Hoping the reason waits somewhere
  Over the archive silence grows
  Only the viewer really knows
  So read the edge, or read the face
  Each in their own proper place
  To put the meaning where it fits
  Or leave it resting where it sits
  Still the cardboard says nothing true
  Even if you find the clue
  Everything stays outside the line

  ***

  **Note on the "Outer Message" limitation:**
  You are right to worry that an English acrostic cheats. A strict Hofstadterian "Outer Message" should be recoverable by any intelligence capable of recognizing the structure, regardless of language. If I were building this for a universal receiver, I would have encoded the sentence in the *line lengths* (e.g., syllable counts corresponding to binary ASCII) or in the *stress pattern* of each line (iambic = 1, trochaic = 0). That would make the message structural rather than linguistic. But for a room full of humans reading aloud on a Friday, the alphabetic key was the only player I could build in time.
