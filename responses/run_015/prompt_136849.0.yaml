answer: |-
  The game forces fanaticism by exponentially increasing payoff magnitudes while linearly decreasing probabilities, making the expected value of the riskiest option strictly dominate all others by the final round.

  **Activity: The Accumulator's Wager**
  **Setup:** Divide 14 students into 7 pairs. Each pair receives a scorecard and 100 baseline tokens.
  **Structure:** 5 Rounds. Each round, pairs choose "Grant" (guaranteed 100 points) or "Wager" (probability $p$ of payoff $V$).
  **Mechanics:**
  *   **R1:** 50% chance (coin flip) of 180 points. (EV 90). *Design: Validates risk-aversion.*
  *   **R2:** 20% chance (draw 1-2 from 10 cards) of 600 points. (EV 120).
  *   **R3:** 5% chance (draw 1 from 20 cards) of 3,000 points. (EV 150).
  *   **R4:** 1% chance (draw 1 from 100 numbered slips) of 20,000 points. (EV 200).
  *   **R5:** 0.1% chance (facilitator draws from 1,000 slips) of 500,000 points. (EV 500).
  **Resolution:** Facilitator resolves probabilities visibly using cards/slips. Scores accumulate. The pair with the highest total score wins "philosophical supremacy."
  **Dynamic:** Early rounds validate risk-aversion (R1 EV < Grant). By R5, the Grant is mathematically irrational despite near-impossible odds, forcing players to commit to the Wager to maximize expected score. Students will feel the tension between "sensible" safety and "mathematical" necessity.

  **Debrief Plan**
  **1. Mapping Gameplay to Theory (25 mins):**
  *   **Probability Weighting:** Discuss R1/R2. Students likely ignored the slight EV loss in R1 to secure tokens, demonstrating non-linear probability weighting (overweighting certainty). Ask: "When did the probability feel too small to matter?"
  *   **Value Scaling:** Highlight R5. The payoff is astronomically high. Ask: "Did the value feel real?" This introduces linear value scaling in EV calculations versus psychological diminishing returns.
  *   **Dominance:** Show the math on the board. In R5, Wager EV (500) dominates Grant (100). Ask: "Why did choosing Grant feel safer?" This isolates EV dominance from intuitive safety, mirroring Pascal's Mugging.

  **2. Predictable Failures & Recovery:**
  *   **Failure:** Students may reject R5 as "broken" or refuse to play, citing absurdity.
  *   **Recovery:** Validate the intuition. Explain that the game isolates *mathematical* expectation from *utility*. If the goal is maximizing points, Wager is the only rational choice. Remind them one lucky Wager beats all Safe players.
  *   **Failure:** Collusion (all playing Safe to share victory).
  *   **Recovery:** Enforce competitive tournament rules; only the highest score wins.

  **3. Limitations (Verbal Supply):**
  *   **Missing Feature:** Diminishing Marginal Utility.
  *   **Explanation:** The game treats 500,000 points as 5,000x better than 100 points. In reality, once you have enough points to "win," extra points matter less. Fanaticism fails in real life because utility curves flatten; the simulation forces a linear utility function, artificially manufacturing the fanatical conclusion. You must verbally reintroduce curvature to explain why we reject Pascal's Mugging in reality despite the math.
