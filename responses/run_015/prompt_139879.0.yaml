  **What we're really disagreeing about**
  We are stuck because we are arguing past each other. The Housing First side is arguing about outcomes: data shows housing retention and reduced emergency services use are higher when barriers like sobriety are removed. The Coalition is arguing about complicity: they believe providing housing without sobriety requirements causes harm, and they cannot be associated with that harm. This is not just a dispute over data. The Coalition's threat to withdraw volunteers and lease access is operational, but their motivation is moral. They are not trying to win the data argument; they are trying to avoid moral responsibility for a program they view as dangerous. Conversely, some board members view the threat as coercion that shouldn't dictate policy. We need to acknowledge both the operational risk of losing their capacity and the moral weight of their objection, without conceding that the data on Housing First is debatable. Ignoring the operational risk leaves us with funding but no way to deliver services. Ignoring the moral risk loses the community partners necessary for long-term stability. We must distinguish between validating their data claims and accommodating their moral boundaries to find a path forward that keeps services running.

  **Why this beats splitting the difference**
  Splitting the grant 50/50 fails because the state requires one model, and it dilutes the effectiveness of the intervention. This proposal unbundles the symbol from the substance. The Housing First side gets the grant funding and the evidence-based model implemented at scale, securing the outcomes they prioritize. They give up nothing substantive, only the desire for universal endorsement. The Coalition gets local funding to run their program their way, without their name or resources attached to Housing First. This addresses their complicity concern directly. For Coalition members worried that Housing First still happens nearby: this structure clarifies they are not responsible for it. It is not moral trading where we pay them to look away; it is structural separation so they aren't participating. They retain their moral integrity; we retain our evidence-based practice. Both sides get the core thing they need: effective housing for the count, and moral clearance for the volunteers. Even if they believe HF outcomes are worse, they are not causing them. For those in the Coalition convinced Housing First produces worse life outcomes, this deal allows them to remain consistent. They are not blocking help they deem harmful; they are simply refusing to administer it. They can direct their clients to their own program without being forced to refer them into a system they distrust. This removes the burden of choice from their staff. For the Housing First advocates, the grant money is protected for the model with the strongest data. We are not diluting the $4.2M across two less-effective programs. We are maximizing the impact of the state funds while using local funds to maintain community peace.

  **The strongest thing on the other side**
  The strongest argument against this is that funding the Coalition's model separately legitimizes an approach we have agreed is less effective. By allocating local funds to abstinence-based housing, we are effectively voting that this model deserves public support despite the evidence. This undermines the board's commitment to data-driven policy. Furthermore, accepting this deal sets a dangerous precedent: any stakeholder can veto a public policy they dislike on moral grounds and demand payment to stand down. If we agree that moral objection grants veto power plus funding, we invite future gridlock. Some members argue that compromise here is itself a statement—it suggests the County is agnostic on the harm of "enabling" addiction, when our duty is to reduce harm based on best available evidence. Accepting the deal might save the volunteers, but it costs us our policy consistency and implies that moral objections carry equal weight to clinical evidence in budgetary decisions. We risk signaling that public policy is negotiable based on who threatens to withdraw services, rather than what works best for the homeless population. When the County writes a check to the Coalition for this specific purpose, we are stamping their model with official approval. It tells the public that we are unsure which path is right. This ambiguity can confuse clients and families seeking help. It suggests that science is just one opinion among many. If we believe Housing First saves lives, funding an alternative suggests we are not fully committed to saving lives in the most effective way possible. The cost of this compromise is not just financial; it is the clarity of our mission.

  **If they say no**
  If the Coalition rejects this separation, we must vote on the grant model alone. I recommend we proceed with the Housing First application under the County's name regardless of their participation. We should prepare an operational contingency plan to replace the volunteer hours and secure alternative lease agreements for the shelters they currently own. We cannot allow operational threats to dictate clinical standards. However, we should authorize the Chair to negotiate for one week before finalizing the grant submission. If no agreement is reached, we vote to proceed with Housing First and mitigate the staffing losses through temporary contracts. This maintains our integrity but risks immediate service disruption. We must be prepared to absorb that disruption rather than compromise the core model of the grant. We must communicate this decision clearly to the public to manage expectations regarding service availability during the transition.
