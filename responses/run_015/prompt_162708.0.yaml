  **OFFICE OF CIRCUMSTANCE EQUITY: 2024-2025 ALLOCATION FRAMEWORK**

  **To:** All Families and Guardians
  **From:** Dr. Aris Thorne, Assistant Principal for Equity
  **Re:** Annual Updates to Resource Distribution and Agency Protocols

  Dear Families,

  As we begin a new academic year, the Office of Circumstance Equity wishes to reaffirm our shared commitment to a fundamental principle: no student should end up worse off than another through no fault of their own. Advantages and disadvantages traceable to unchosen circumstances must be compensated or neutralized, while those traceable to gambles a student knowingly chose to take remain the student's own to bear. This distinction ensures that our community rewards agency rather than accident. To maintain this standard, we are implementing several refinements to our allocation protocols regarding honors placements, varsity spots, and specialized equipment.

  **Neutralizing Structural Advantages**

  Our audits indicate that certain extracurricular structures inherently produce unequal outcomes that cannot be fully remedied through supplementary support. Specifically, the varsity crew team and the honors orchestra require access to limited high-quality resources (ergometers, tuned pianos) that cannot be distributed equally to all interested students. Since the Office cannot raise every student to the level of these privileged groups without exceeding our budget, and refuses to leave any student behind with inferior tools, we have made the difficult decision to dissolve these programs for the upcoming year. All students will now participate in a unified ensemble and rowing club where equipment is randomized weekly. This ensures that no student's flourishing is predicated on an unequal distribution of institutional capital.

  **Verification of Circumstance and Agency**

  To receive compensatory resources, students must appear before a Verification Panel to document, in detail, the respect in which they are worse off through no fault of their own. We understand this process feels intrusive, but we frame it as a dignity-preserving affirmation of the student's equal standing. The Panel is also clarifying rulings on complex lineage and effort cases. First, regarding "Inherited Option Luck": if a student's hardship traces to a deliberate gamble taken by a parent prior to the student's birth (e.g., a parent quitting a tenured job to open a bakery), the Office rules this to be the student's own option luck, transmitted at birth. The student is deemed to have inherited the risk profile of the guardian.

  Second, regarding "Cultivated Circumstance": where a student was dealt an unchosen deficit but practiced obsessively to overcome it, the Office rules that the compulsion to practice was itself a product of early circumstance. Therefore, the resulting advantage is partly unchosen and must be partially clawed back via reduced access to advanced coursework. This prevents students from converting unchosen drive into unfair competitive edges.

  **Sustainability and Intent Monitoring**

  Finally, we must address resource intensity. In cases where a student, through no choice of hers, requires very costly resources to reach the same level of flourishing as everyone else, the Office must balance her needs against the collective capacity. While we affirm her equal worth, providing disproportionate resources to one student inevitably lowers the baseline flourishing of the cohort. We will therefore be capping individual accommodation packages at the median cost per student.

  Additionally, the Office has noticed a troubling trend: students are beginning to under-practice and avoid opportunities on purpose so that their deficits stay legible as unchosen. To combat this moral hazard, all students seeking advanced placement must sign an "Ambition Ledger" subject to random audit. This ledger records voluntary effort hours; discrepancies between reported ambition and actual output will be flagged for review. We believe these measures will restore trust in our system. By ensuring that every disadvantage is either compensated or confirmed as chosen, we protect the integrity of every student's success.

  Sincerely,

  **Dr. Aris Thorne**
  Assistant Principal for Equity
