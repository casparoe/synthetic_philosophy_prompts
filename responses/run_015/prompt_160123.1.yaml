      *   **Key Issues to Address:**
          *   Curator's "Velcro Effect" (confirmation bias towards ritual).
          *   Geologist's "Scoring Sheet" (circular reasoning risk).
          *   Heritage Office's non-evidentiary knowledge (traditional knowledge vs. scientific evidence).
          *   Asymmetry of Transfer (one-way street).
          *   Need a concrete recommendation (Transfer, Refuse, or Middle Ground).
          *   Need a timeline.
          *   Need a precedent-setting rule for future cases.
          *   Need a "What Would Change This Recommendation" section with confidence levels.
      *   **Tone:** Professional, balanced, analytical, decisive but open to scrutiny.
      *   **Length:** Around 800 words.

  2.  **Determine the Recommendation:**

      *   *Option A (Transfer):* Risks ignoring archaeological ambiguity.
      *   *Option B (Refuse):* Risks legal/ethical conflict, ignores state law nuances.
      *   *Option C (Middle Ground):* Joint research/Stewardship. This seems best given the ambiguity. It respects the Heritage Office's claim without conceding the archaeological uncertainty immediately. It allows time to test the "Scoring Sheet" and address the "Velcro Effect."
      *   *Decision:* Propose a **Deferred Transfer with Joint Research Agreement (12 months)**. This acknowledges the legal pressure while validating the need for rigorous evidence.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format.
      *   **Introduction:** State the purpose (vote on Case #2008-04), the object (Bronze Axe Hoard), and the core conflict (Votive vs. Hoard).
      *   **The Arguments (Steel-manning both sides):**
          *   *Heritage Office:* Communal property, ceremonial intent, state law mandates transfer.
          *   *Curator:* Founder's hoard, miscast/soft metal, lack of wear, packing vs. arrangement. Address the "Velcro Effect" here (bias towards ritual).
          *   *Geologist's Scorecard:* Acknowledge utility but highlight circularity (derived from known ritual sites). Needs calibration against non-ritual hoards.
      *   **The Epistemic Gap:** Address the Heritage Office's traditional knowledge vs. museum evidence rules. Don't be sneery, don't be mushy. Acknowledge it as valid data but distinct from archaeological provenance.
      *   **The Asymmetry:** Address the one-way nature of repatriation. It requires a higher burden of proof for permanent removal than for temporary retention.
      *   **Recommendation:** Deferred Transfer (12 months). Joint study. Apply the Scorecard *and* a control group (non-ritual hoards).
      *   **Future Policy:** Propose a "Dual-Hypothesis Protocol" for the next four cases. Require testing against both ritual and utilitarian models before classification.
      *   **Closing Section:** "What Would Change This Recommendation." Identify the flip factors (e.g., definitive metallurgical proof of ingot status, or oral history confirmation). Assign confidence levels.

  4.  **Drafting - Refining and Editing (Word Count & Tone Check):**

