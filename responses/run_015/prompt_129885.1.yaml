      *   **Constraint 2:** Focus on the tension between his *argument* (leaving life is like a sentry post once relieved) and his *action* (hiding the essay in a drawer for decades out of fear of backlash/damage to reputation).
      *   **Constraint 3:** Target audience knows Hume wrote it (needs specific philosophical/historical knowledge).
