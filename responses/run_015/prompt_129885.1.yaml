answer: |-
  David Hume finishes *Of Suicide*, arguing that ending your life is no sin—it's simply like a soldier leaving his sentry post once he's been relieved of duty. If the burden outweighs the value, Providence permits you to walk away.

  Satisfied with this logic, he locks the essay in a drawer and stands guard over it for thirty years, terrified that publishing it would get him ostracized by polite society.

  So, the great empiricist spent his final decades as the sentry guarding the argument that sentries are allowed to go home. He was perfectly comfortable telling you that you can quit the job of being alive, but he wasn't about to risk getting fired from the job of being a Respectable Edinburgh Gentleman before his shift was officially over.
