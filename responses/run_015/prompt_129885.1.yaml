      *   *The Reality:* Hume didn't publish it during his lifetime. He feared the outrage it would cause (religious, social). He kept it locked away until after his death (published posthumously in 1777).
      *   *The Irony:* The man who argued that leaving the "post" of life is permissible spent his own life clinging to the "post" of reputation and social standing, terrified to release the argument that would justify leaving. He treated his own reputation as a sentry post he *couldn't* leave.

  3.  **Brainstorming Angles:**
