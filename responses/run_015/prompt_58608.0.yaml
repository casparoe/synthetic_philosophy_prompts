prompt: |-
  Could you translate the central claim of Good's theorem on the value of information into a reusable procedure for repeated, time-pressured professional decisions?

  My context is as follows. I serve as a senior planning case officer for a district council in England. Several times each month I must decide whether to request additional evidence before determining an application — a traffic count, a flood model update, an ecological survey, a noise assessment. The stakes are moderate but recurrent: unnecessary requests delay housing, impose costs on applicants and invite appeals for non-determination, while failure to request genuinely decision-changing evidence risks unlawful decisions and judicial review. I have roughly half an hour to screen each such question, no formal training in decision theory, and I must be able to defend the reasoning briefly to a head of service who signs off.

  Please provide a step-by-step procedure, expressed as a flowchart in words, that preserves what the theorem actually establishes whilst remaining usable by a non-specialist. It should move in order through identification of the pending decision and live options, isolation of the uncertainties that could alter the choice, estimation of the ex ante benefit of resolving them, accounting for the full cost of the information including delay, applicant burden and loss of flexibility, and explicit checks on whether the idealising assumptions behind the theorem hold in the case at hand. For each step, state what would count as enough to proceed and what triggers a stop with a recommendation not to seek the information. Mark clearly the points at which formal calculation must give way to judgement and cannot be eliminated.

  The procedure must be able to handle four difficult situations that recur in my work: information that is free to the council but expensive to the applicant; information that, once obtained, cannot be set aside and must be disclosed on the public file; information whose mere collection is observed by developers, objectors or committee members and changes their behaviour; and situations where I have reason to think that I or the planning committee will overweight a vivid or alarming finding relative to its actual decision relevance.

  Then demonstrate the procedure on the following three invented cases, showing your working at each step:

  A proposal for 35 dwellings on the edge of a village where the only material uncertainty is peak-hour capacity on a single-track access lane, for which the highways team offers a two-week automatic traffic count at internal cost;

  A proposal to convert a vacant warehouse into twelve flats where a consultant quotes a three-week bat presence survey, with a local residents association having publicly stated that any survey mentioning bats, whatever its conclusion, will be used to demand a far lengthier ecological assessment;

  A retrospective application for an extended farm shop car park partly within a flood-risk area, where updated surface-water modelling would take six weeks beyond the statutory determination period and the applicant has indicated an appeal on grounds of delay, and where committee practice suggests any ambiguous modelling result would in effect be treated as grounds for refusal.

  Include at least one case where faithful application of the procedure recommends a course that a cautious officer would dislike, such as declining apparently reassuring evidence or commissioning evidence despite delay, and explain why. Conclude with a brief statement of what the procedure cannot do and where it is liable to misfire.

  Please respond in British English, using British spelling and conventions throughout.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**

      *   **Core Task:** Translate I.J. Good's theorem on the value of information (VoI) into a reusable, step-by-step procedure for a senior planning case officer in England.
      *   **Context:** District council, moderate but recurrent stakes (housing delays vs. unlawful decisions), 30-minute screening time, no formal decision theory training, needs defensibility to Head of Service.
      *   **Format:** Flowchart in words (step-by-step procedure), British English.
      *   **Key Requirements:**
          *   Identify pending decision/options.
          *   Isolate uncertainties altering the choice.
          *   Estimate ex ante benefit vs. full cost (delay, burden, flexibility).
          *   Check idealising assumptions (Good's theorem assumptions).
          *   Define "Proceed" vs. "Stop" criteria for each step.
          *   Mark where judgement overrides calculation.
          *   Handle four specific difficult situations (cost asymmetry, public file disclosure, strategic observation, cognitive bias/overweighting).
          *   Demonstrate on three specific invented cases (Traffic count, Bat survey, Flood modelling).
          *   Include a counter-intuitive recommendation (e.g., decline reassuring evidence or commission despite delay).
          *   Conclude with limitations.

  2.  **Deconstruct Good's Theorem (VoI):**

      *   *Theorem Essence:* The expected utility of making a decision *with* additional information should be greater than the expected utility of making the decision *without* it, minus the cost of obtaining that information.
      *   *Formula (Simplified):* $VoI = E[U|Info] - E[U|No Info] - Cost(Info)$. If $VoI > 0$, get the info.
      *   *Key Assumptions:* Rational agent, well-defined utility function, information doesn't change the world (only knowledge), cost is known.
      *   *Translation Challenge:* Planning officers don't calculate utilities. They weigh risks, policies, and time. The procedure must operationalise "Expected Utility" into "Likelihood of Changing the Decision" vs. "Harm of Delay/Cost".

  3.  **Drafting the Procedure (The "VoI Screening Protocol"):**

      *   *Structure:* Needs to be logical, sequential, and fit within 30 minutes.
      *   *Step 1: The Decision.* What am I actually deciding? (Approve/Refuse/Defer).
      *   *Step 2: The Uncertainty.* What don't I know? Will knowing it change the outcome? (Crucial: If the decision stays the same regardless, VoI = 0).
      *   *Step 3: The Cost.* Not just money. Time, goodwill, legal risk, political capital.
      *   *Step 4: The Bias/Strategic Check.* Addressing the four difficult situations.
      *   *Step 5: The Verdict.* Compare Benefit vs. Cost.
      *   *Judgement Points:* Explicitly mark where numbers aren't possible and professional intuition takes over.

  4.  **Addressing the Four Difficult Situations:**

      *   *Free to Council/Expensive to Applicant:* Cost function must include applicant burden (fairness, appeal risk).
      *   *Public File/Disclosure:* Information isn't neutral; it becomes evidence for third parties.
      *   *Strategic Observation:* Signalling effect. Requesting info signals doubt, emboldening objectors or worrying applicants.
      *   *Cognitive Bias (Overweighting):* If the committee will panic over a minor finding, the "utility" of that info is negative (leads to sub-optimal decision).

  5.  **Developing the Three Cases:**

      *   *Case 1 (Traffic Count):* Low cost, internal, high relevance. Likely *Proceed*.
      *   *Case 2 (Bat Survey):* High strategic risk (residents will use it to delay regardless of outcome). This tests the "Strategic Observation/Disclosure" constraint. Likely *Stop/Do Not Request* (or seek alternative).
      *   *Case 3 (Flood Modelling):* High delay cost (appeal threat), high bias risk (committee treats ambiguity as refusal). This tests the "Cognitive Bias" and "Cost of Delay" constraints. Likely *Stop/Do Not Request* (counter-intuitive for a cautious officer).

  6.  **Refining the Tone and Language:**

      *   British English (programme, licence, defence, centre, etc.).
      *   Professional, bureaucratic but clear.
      *   Respectful of the Planning Context (NPPF, Section 106, Judicial Review risks).

  7.  **Step-by-Step Construction of the Response:**

      *   *Introduction:* Acknowledge Good's theorem and the planning context.
      *   *The Procedure:* "The Good-VoI Planning Screening Protocol". Use bold headings for steps. Include "Stop/Go" criteria.
      *   *The Four Difficult Situations:* Integrate these as specific checks within the procedure or as a dedicated module. (Better to integrate as specific "Checks" within the steps to ensure they aren't missed). Let's make Step 4 specifically about "Contextual Distortions".
      *   *Case Studies:* Walk through the protocol for each.
      *   *Counter-Intuitive Outcome:* Ensure Case 3 clearly shows why *not* getting info is better, even if it feels risky.
      *   *Limitations:* Honest assessment of where this fails (e.g., political pressure, unknown unknowns).

  8.  **Self-Correction/Review during Drafting:**

      *   *Critique:* Is 30 minutes realistic for this level of analysis?
      *   *Fix:* Emphasise that this is a *screening* tool, not a full quantitative analysis. Use "Rules of Thumb" for the estimation steps.
      *   *Critique:* Did I address Good's assumptions?
      *   *Fix:* Add a specific step on "Assumption Check" (e.g., is the info actually independent? Will it actually update the belief?).
      *   *Critique:* Is the distinction between "Cost to Council" and "Cost to Applicant" clear?
      *   *Fix:* Ensure Step 3 explicitly defines "Total Social Cost" including applicant burden, as per NPPF fairness principles.
      *   *Critique:* Case 2 needs to handle the "residents will demand more" aspect.
      *   *Fix:* This is a "Cost Escalation" risk. The cost isn't just the survey; it's the subsequent delay.
      *   *Critique:* Case 3 needs to handle the "Committee will misinterpret" aspect.
      *   *Fix:* This violates the "Rational Agent" assumption of Good's theorem. The procedure must flag this as a reason to reject the info.

  9.  **Final Polish:** Check British spelling (programme, modelling, licence, defence). Ensure the flow is logical. Make sure the "Stop" triggers are distinct.

  *(Self-Correction on Good's Theorem Nuance)*: Good's theorem strictly says you should *never* pay for information that won't change your decision. It also assumes you update beliefs rationally (Bayesian). The procedure must highlight that if the decision-maker (Committee) is *not* rational, the theorem breaks. I need to make sure the procedure accounts for the *actual* decision-maker's behaviour, not the *ideal* one.

  10. **Final Output Generation** (incorporating the above thoughts).
answer: |-
  # The Good-VoI Planning Screening Protocol

  ## Introduction
  I.J. Good's theorem on the value of information establishes that you should only acquire new information if the expected improvement in your decision outcome outweighs the cost of obtaining that information. In planning terms: do not request evidence unless it is likely to change the recommendation *and* the benefit of that change exceeds the harm caused by the delay and cost of the work.

  The following procedure translates this theorem into a thirty-minute screening tool for senior case officers. It is designed to be defensible to a Head of Service and robust against common planning pitfalls.

  ---

  ## Part 1: The Procedure (Flowchart in Words)

  ### Step 1: Define the Pending Decision and Options
  **Action:** State the specific decision currently blocked by uncertainty. List the viable options available *right now* without the new information.
  *   *Example:* "Decide on approval vs. refusal. Current option: Refuse due to insufficient highway data. Alternative: Approve with condition."
  **Judgement Point:** If there is only one legally viable option regardless of evidence (e.g., the scheme is fundamentally contrary to the Development Plan), stop. Information has zero value.
  **Stop Trigger:** The decision is already determined by policy constraints.
  **Proceed Trigger:** There are at least two viable outcomes (e.g., Approve or Refuse) dependent on the missing data.

  ### Step 2: Isolate the Decision-Changing Uncertainty
  **Action:** Identify the specific uncertainty the information resolves. Ask: "If the result comes back 'favourable', would I recommend approval? If 'unfavourable', would I recommend refusal?"
  **Judgement Point:** You must be honest about whether the evidence would actually sway you.
  **Stop Trigger:** You would make the same recommendation regardless of the result (e.g., you intend to refuse on policy grounds anyway, but want the report to 'shore up' the defence). This is 'confirmation bias', not value.
  **Proceed Trigger:** The recommendation flips based on the plausible range of results.

  ### Step 3: Estimate the Full Cost of Information (FCI)
  **Action:** Calculate the total burden, not just the council's invoice.
  1.  **Direct Cost:** Fees paid by applicant or council.
  2.  **Time Cost:** Weeks added to the determination period.
  3.  **Risk Cost:** Probability of appeal on non-determination or delay.
  4.  **Applicant Burden:** Financial strain on the developer (relevant under NPPF fairness principles).
  **Judgement Point:** Assign a 'High/Medium/Low' rating to the Time and Risk Costs.
  **Stop Trigger:** FCI is 'High' (e.g., breaches statutory timeline, triggers appeal threat) AND the decision risk is 'Low' (e.g., minor policy deviation).
  **Proceed Trigger:** FCI is 'Low' or 'Medium', or the Risk of getting the decision wrong without info is 'Critical' (e.g., significant flood risk to life).

  ### Step 4: Check for Contextual Distortions (The Four Difficult Situations)
  **Action:** Run the specific information through these four filters. If any trigger, the standard VoI calculation is compromised.

  1.  **Cost Asymmetry:** Is the info free to the council but expensive to the applicant?
      *   *Check:* Does the burden fall unfairly on the applicant?
      *   *Stop Trigger:* Yes, unless the public safety risk is critical.
  2.  **Irreversible Disclosure:** Will this report go on the public file and be weaponised?
      *   *Check:* Will third parties use this data to demand *further* work regardless of the outcome?
      *   *Stop Trigger:* Yes, if the likelihood of 'mission creep' (endless surveys) is high.
  3.  **Strategic Observation:** Does the *request* itself signal doubt?
      *   *Check:* Will objectors interpret the request as the council 'looking for reasons to refuse' or will the applicant interpret it as 'negotiable'?
      *   *Stop Trigger:* If the signal destabilises the process (e.g., triggers pre-emptive legal action).
  4.  **Cognitive Bias (The 'Vivid Finding' Risk):** Will the decision-maker (you or Committee) overweight a specific finding?
      *   *Check:* If the report contains one alarming sentence amidst reassuring data, will the Committee refuse anyway?
      *   *Stop Trigger:* Yes. If the decision-maker cannot process the data rationally, the information has negative value.

  **Proceed Trigger:** None of the distortion checks trigger a 'Stop'.

  ### Step 5: The Ex Ante Benefit Test
  **Action:** Compare the likelihood of a *better* decision against the costs.
  *   **Question:** "What is the probability this evidence prevents a Judicial Review or a successful Appeal?"
  *   **Question:** "What is the probability this evidence simply delays the inevitable?"
  **Judgement Point:** This is the core Good's Theorem application. You are estimating $P(Change) \times Benefit - Cost$.
  **Stop Trigger:** The probability of changing the decision is low (<20%) OR the cost of delay outweighs the benefit of certainty.
  **Proceed Trigger:** The evidence is likely to prevent a high-cost error (unlawful decision) and the cost of acquisition is proportionate.

  ### Step 6: Final Defence Statement
  **Action:** Draft a two-sentence note for the file/Head of Service.
  *   *Format:* "Requesting [Evidence] because [Uncertainty] is material to [Policy]. Cost/Delay is justified because [Risk of Error] exceeds [Cost of Info]."
  *   *Or:* "Not requesting [Evidence] because [Decision] would not change. Cost/Delay creates disproportionate harm relative to [Risk Reduction]."

  ---

  ## Part 2: Demonstration on Invented Cases

  ### Case 1: The Village Access (35 Dwellings)
  **Context:** Edge of village. Single-track access. Highways team offers 2-week automatic traffic count. Internal cost.
  **Uncertainty:** Peak-hour capacity.

  *   **Step 1 (Decision):** Approve vs. Refuse on highway grounds. **Proceed.**
  *   **Step 2 (Uncertainty):** If count shows capacity exists -> Approve. If no capacity -> Refuse. **Proceed.**
  *   **Step 3 (Cost):** 2 weeks delay. Internal cost (low financial). Low appeal risk for 2-week delay. **Proceed.**
  *   **Step 4 (Distortions):**
      *   *Cost Asymmetry:* Low (internal cost).
      *   *Disclosure:* Standard technical data.
      *   *Strategic:* Neutral signal.
      *   *Bias:* Highways data is usually objective.
      *   *Result:* No distortions.
  *   **Step 5 (Benefit):** High probability of resolving the only material objection. Prevents refusal that might be overturned on appeal.
  *   **Step 6 (Verdict):** **REQUEST THE COUNT.**
  *   **Defence:** "Requesting traffic count as highway capacity is the sole material constraint. Two-week delay is proportionate to the risk of unlawful approval."

  ### Case 2: The Warehouse Conversion (Bat Survey)
  **Context:** Vacant warehouse to 12 flats. Consultant quotes 3-week bat survey. Residents Association (RA) states *any* mention of bats will trigger demands for a full ecological assessment.
  **Uncertainty:** Bat presence.

  *   **Step 1 (Decision):** Approve vs. Refuse/Defer. **Proceed.**
  *   **Step 2 (Uncertainty):** If no bats -> Approve. If bats -> Mitigation or Refuse. **Proceed.**
  *   **Step 3 (Cost):** 3 weeks delay. Consultant fee (applicant cost).
  *   **Step 4 (Distortions):**
      *   *Disclosure/Weaponisation:* **TRIGGER.** RA has publicly stated they will use *any* mention to demand lengthier assessment.
      *   *Strategic Observation:* Requesting the survey signals ecological vulnerability.
      *   *Cost Escalation:* The 'cost' is not just the survey; it is the high probability of a 6-month delay if the RA escalates.
  *   **Step 5 (Benefit):** Even if the survey is negative, the RA may demand more. If positive, the scheme is likely stalled. The information does not guarantee a decision; it guarantees a process expansion.
  *   **Step 6 (Verdict):** **DO NOT REQUEST (Initially).** Seek a desktop assessment or preliminary roost inspection first. If a full survey is legally mandated, note the risk of delay on the file.
  *   **Defence:** "Declining full survey at this stage. Risk of process escalation by third parties outweighs immediate decision value. Will rely on preliminary inspection to determine necessity."
  *   **Note:** This protects the authority from being seen to facilitate 'moving goalposts' while acknowledging the legal duty to protect species.

  ### Case 3: The Farm Shop Car Park (Flood Modelling)
  **Context:** Retrospective application. Partly in flood risk. Updated modelling takes 6 weeks (breaches statutory period). Applicant threatens appeal on delay. Committee practice: ambiguous modelling = refusal.
  **Uncertainty:** Surface water runoff rates.

  *   **Step 1 (Decision):** Approve (retrospective) vs. Refuse. **Proceed.**
  *   **Step 2 (Uncertainty):** If model passes -> Approve. If model fails/ambiguous -> Refuse. **Proceed.**
  *   **Step 3 (Cost):** 6 weeks delay (Statutory breach). High appeal risk (non-determination).
  *   **Step 4 (Distortions):**
      *   *Cognitive Bias:* **TRIGGER.** Committee treats ambiguous results as refusal. Good's theorem assumes rational updating; the Committee will not update rationally. They will treat 'uncertainty' as 'danger'.
      *   *Cost Asymmetry:* High cost to applicant (delay + modelling fee).
  *   **Step 5 (Benefit):**
      *   *Scenario A (Clear Pass):* Approval. But Committee might still hesitate.
      *   *Scenario B (Ambiguous):* Refusal. You could likely have recommended refusal *now* based on existing precautionary principle without spending 6 weeks.
      *   *Value:* The information only helps if it is definitively positive. If there is any doubt, the outcome is refusal (same as current baseline).
      *   *Calculation:* The cost of 6 weeks + appeal risk is high. The probability of a 'Clear Pass' that overrides Committee caution is low.
  *   **Step 6 (Verdict):** **DO NOT REQUEST.** Determine on existing evidence.
  *   **Defence:** "Modelling delay breaches statutory timeline and invites appeal. Committee practice indicates ambiguous data leads to refusal regardless. Existing evidence sufficient to apply precautionary principle under NPPF."
  *   **Why this is counter-intuitive:** A cautious officer usually wants *more* data to defend against Judicial Review. However, under Good's theorem, if the decision-maker (Committee) cannot process the data rationally, the data has negative utility. It creates delay without improving the decision quality.

  ---

  ## Part 3: Limitations and Risks

  This procedure is a screening tool, not a substitute for professional judgement. It is liable to misfire in the following circumstances:

  1.  **Unknown Unknowns:** Good's theorem calculates the value of *known* uncertainties. It cannot account for evidence that reveals a completely new constraint (e.g., a survey reveals a rare species not previously considered).
  2.  **Political Override:** The procedure assumes the Head of Service or Committee accepts the 'Cost of Delay' logic. If political pressure demands a refusal regardless of evidence, the VoI calculation becomes irrelevant.
  3.  **Legal Duty vs. Value:** There are situations where statute or case law *requires* specific evidence (e.g., Habitats Regulations Assessment) regardless of whether it changes the decision. In these cases, legal compliance overrides VoI.
  4.  **Reputation Costs:** The procedure struggles to quantify long-term reputational damage. Refusing evidence might save time now but damage the council's relationship with developers or inspectors over years.

  **Final Note to Officer:**
  Use this protocol to structure your thinking, not to abdicate responsibility. When you mark a 'Judgement Point', record your reasoning in the case file. Good's theorem protects you from paralysis by analysis, but it does not protect you from a failure to exercise statutory duty.
