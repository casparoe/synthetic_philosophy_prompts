      *   *Does he reject all outcome-weighing?* No, he rejects the *demand* that all weighing be done from an impartial, universal standpoint.
      *   *Is utilitarianism refuted?* Philosophy rarely deals in "proofs." Williams damages the *plausibility* of utilitarianism as a complete account of moral life, but utilitarians have responses (rule-utilitarianism, two-level utilitarianism).

