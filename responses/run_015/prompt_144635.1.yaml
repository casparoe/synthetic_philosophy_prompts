answer: |-
  Welcome to the world of philosophy! Your background in molecular biology is actually a significant asset here. Philosophy often suffers from vague metaphors, and a scientific mind trained to look for precise mechanisms and distinctions is exactly what's needed to cut through pop-philosophy summaries.

  Your intuition is correct: the summary you read is a "caricature." It captures the *vibe* of Williams's critique but distorts the mechanics of his argument. It turns a nuanced objection about moral psychology into a blunt weapon.

  Your **kin-selection analogy is excellent**. In biology, an organism doesn't consciously calculate $rB > C$ (Hamilton's Rule) before jumping into a river to save a sibling. The disposition to save kin is evolved and immediate. If the organism paused to run the calculation, it might drown, or the calculation might fail under stress. Williams argues something similar about moral life: our personal relationships function like evolved dispositions. If we have to justify them through a universal calculus every time, the relationship itself is degraded.

  Here is a sentence-by-sentence breakdown of that summary, followed by answers to your specific questions.

  ### Sentence-by-Sentence Analysis

  **1. "Williams's famous argument shows that utilitarianism is inhuman."**
  *   **Verdict:** *Acceptable simplification.*
  *   **Analysis:** Williams doesn't use the word "inhuman," but he argues that utilitarianism alienates us from our "integrity." By integrity, he means the connection between your actions and your deepest personal commitments (what he calls "ground projects"). If a moral theory requires you to abandon your core identity whenever a calculator says so, it treats you as a mere channel for utility, not a person. So, "inhuman" is a fair colloquial translation of "alienating to moral agency."

  **2. "Imagine you can only save one person from drowning — your spouse or a stranger. Utilitarianism says you should save the stranger whenever that produces even slightly more total happiness."**
  *   **Verdict:** *Misleading / Common Misreading.*
  *   **Analysis:** This is the biggest error in the summary. In a strict one-to-one drowning case, a utilitarian would almost *never* say save the stranger. Why? Because your spouse's death would cause immense grief to you, their family, and their community. The "utility loss" of a spouse dying is usually much higher than a stranger dying.
  *   **The Real Point:** Williams isn't arguing that utilitarianism forces the *wrong action* here. He is arguing that it forces the wrong *reason*. Even if the utilitarian saves the wife, they must do so *because* it maximizes utility, not *because* she is his wife.

  **3. "Williams says the husband should save his wife with no reasoning whatsoever; if he thinks 'it's okay because overall welfare is higher,' that's already one thought too many."**
  *   **Verdict:** *Partially accurate, but "no reasoning" is too strong.*
  *   **Analysis:** Williams doesn't say the husband should be a mindless automaton. He can think, "She is my wife, and I love her." That is a valid reason for action in a personal context.
  *   **The "One Thought":** The "one thought too many" is the appeal to an *impartial moral principle*. If the husband thinks, "I am saving her because, in this specific instance, my personal love aligns with the general welfare," Williams says he has inserted a moral theory between himself and his wife. He has stepped back from the relationship to view it from the "view from nowhere." That step is the "one thought too many."

  **4. "So Williams proves that all moral theories asking you to weigh outcomes destroy personal integrety, and real ethics is just pursuing your ground projects without ever justifying them to anyone else."**
  *   **Verdict:** *Major Overstatement / Misreading.*
  *   **Analysis:**
      *   **"All moral theories":** Williams targets *impartial* moral theories (Utilitarianism and some forms of Kantianism). He isn't against weighing outcomes in daily life; he is against a moral system that demands *only* impartial outcomes matter.
      *   **"Without ever justifying them":** Williams does not advocate for ethical egoism or nihilism. He acknowledges we live in society and have obligations. He argues that morality should not *swallow* everything. We should be able to say, "I am doing this not because it is morally optimal, but because it is *my* life and *my* project," without feeling guilty. He wants to make room for the personal, not abolish justification entirely.

  ### Addressing Your Specific Questions

  **1. Does Williams really think the utilitarian must save the stranger in the one-to-one case?**
  **No.** As mentioned above, standard act-utilitarianism usually favors saving the spouse due to the ripple effects of grief and loss of future happiness.
  *   **The Trap:** The utilitarian is trapped not by the *action*, but by the *contingency*. If, hypothetically, the stranger were a brilliant surgeon who would save 1,000 lives, and the spouse was... well, just a spouse, the utilitarian *would* have to let the spouse drown. Williams argues that a husband who is willing to let his wife drown because a stranger has higher "social utility" has already failed as a husband. The commitment of marriage implies a priority that utilitarianism cannot guarantee.

  **2. Does he reject all outcome-weighing, or just a particular kind of moral system?**
  **He rejects the system, not the weighing.** Williams is not a deontologist (someone who believes in rigid rules regardless of outcomes). He is comfortable with us weighing outcomes in our personal lives.
  *   **The Distinction:** He objects to the idea that there is a single, universal currency of "value" (utility) that all rational agents must maximize. He thinks this flattens the richness of human life. We weigh outcomes based on *our* projects, not based on a universal mandate.

  **3. Does the conclusion that utilitarianism is "refuted" actually survive if you fix the errors?**
  **"Refuted" is too strong a word for philosophy.** (As a scientist, you know theories are rarely "proven false" in a single stroke; they are usually shown to have limited domains of applicability).
  *   **The Status of the Debate:** Williams dealt a massive blow to the *plausibility* of utilitarianism as a complete description of moral life. He showed that it conflicts with deep intuitions about love, loyalty, and identity.
  *   **Utilitarian Responses:** Utilitarians (like R.M. Hare or Peter Singer) have responded. They argue for "Two-Level Utilitarianism":
      *   *Level 1 (Intuitive):* We raise people to have dispositions (like "save your wife") because that generally maximizes utility.
      *   *Level 2 (Critical):* In rare cases, we step back and calculate.
      *   Williams would reply that even having Level 2 available corrupts Level 1. If I know I *might* sacrifice my wife for the greater good, my commitment to her is already conditional, not absolute.
  *   **Verdict:** Williams didn't kill utilitarianism, but he forced it to retreat. It can no longer claim to be the obvious, common-sense morality. It is now seen as a demanding, revisionist theory.

  ### Summary for a Biologist
  Think of Utilitarianism as a theory that says the "function" of a human is to maximize a specific metabolic output (utility).
  Think of Williams as saying: "Organisms have complex, layered regulatory networks. Some are homeostatic (personal projects), some are reactive. If you force the organism to route every cellular decision through a central 'maximize output' processor, the organism loses its structural integrity and ceases to function as a coherent whole."

  The pop-book summary you read treated Williams as saying "Don't think, just act." Williams actually said, "Don't think *like a universal calculator* when acting as a husband."

  You are asking exactly the right questions. Philosophy needs more people willing to check the mechanism rather than just accepting the label on the box.
