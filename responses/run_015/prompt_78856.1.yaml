      *   **Task:** A two-way case analysis.
          *   Direction 1: Read the Kellogg episode through Keynes's conception of the good life. Did the workers achieve what Keynes envisioned? (Confirmation vs. Embarrassment).
          *   Direction 2: Read Keynes's conception through the limits exposed by the Kellogg case. (Intellectualism, Individualism, Class, Leisure as Self-Cultivation vs. Solidarity/Rest).
          *   The Ending: Analyze the reversion to the eight-hour day. Does this refute Keynes's prediction about the "love of money"? Who failed (workers vs. management/market)?
      *   **Tone/Style:** "Awkward parts left in." No bibliography/cites. Focus on "residue as much as the fit." Analytical, critical, nuanced.
      *   **Key Tension:** Keynes's "high" leisure (aesthetic, contemplative, states of mind) vs. Kellogg workers' "ordinary" leisure (family, church, hobbies, rest).

  2.  **Initial Brainstorming & Mapping:**

      *   *Keynes's Vision:* 15-hour week. Problem of leisure. Love of money is a sickness. Good life = states of mind, art, love, friendship (Moore). Anti-utilitarian calculation. Elite/Aristocratic undertones (Apostles).
      *   *Kellogg's Reality:* 6-hour day (30-hour week roughly). Wages maintained (initially). Workers (mostly women) loved it. Used time for domestic/community labor, not necessarily high art. Fought to keep it. Lost to market pressures/management in the 80s.
      *   *Direction 1 (Kellogg through Keynes):*
          *   *Fit:* They chose time over money (eventually). They rejected the "love of money" as the sole driver. They solved the "economic problem" locally.
          *   *Misfit:* They didn't become philosopher-kings. They gardened and went to church. Is this "semi-pathological" accumulation of domestic comfort? Or just living? Keynes might find it banal.
      *   *Direction 2 (Keynes through Kellogg):*
          *   *Limits:* Keynes assumes leisure is an *individual* problem of how to fill time. Kellogg shows leisure is a *collective* struggle against capital. Keynes thinks the problem is psychological (loving money); Kellogg shows the problem is structural (wages tied to hours, competitive markets).
          *   *Class:* Keynes writes for the educated elite. Kellogg workers are industrial laborers. Their "good life" is valid but invisible to Keynes.
      *   *The Ending:* Workers fought to keep the 6-hour day. This supports Keynes (they didn't want the money). But they lost. Why? Management/Market. This suggests Keynes was wrong about *capital*, not just labor. The "love of money" didn't fade in the boardroom.

  3.  **Drafting - Section by Section:**

      *   **Introduction:** Set the stage. 1930 convergence. The theoretical promise vs. the empirical test case. Acknowledge the "awkwardness" requested.
      *   **Part 1: The Kellogg Workers through Keynes's Eyes (Confirmation or Embarrassment?):**
          *   *The Victory:* They prioritized time. The "love of money" did not grip them as tightly as predicted for the *masses*. They valued non-economic goods.
          *   *The Embarrassment:* Keynes's "Good Life" is Moorean. Art, contemplation, intense friendship. Kellogg workers did laundry, went to church, fished. Is this "states of mind"? Keynes might see this as merely "not working," not "living well" in his specific sense. It exposes a class bias. He imagined an aristocracy of leisure; he got a democracy of rest.
          *   *The "Semi-Pathological":* Did they treat money as a possession? No, they treated *time* as a possession. But did they use it for "purpose"? Keynes feared boredom. They seemed fine with "ordinary" life.
      *   **Part 2: The Limits of Keynes's Conception (Exposed by Kellogg):**
          *   *Individual vs. Structural:* Keynes thinks the hurdle is psychological (learning to live). Kellogg shows the hurdle is political/economic (management wants 8 hours, market demands volume).
          *   *Leisure as Cultivation vs. Leisure as Recovery:* Keynes sees leisure as a canvas for self-creation. Kellogg workers saw it as recovery for labor (social reproduction). Gardening isn't aesthetic; it's food/sanity.
          *   *The "We" Problem:* Keynes speaks for "us" (civilization). Kellogg shows "us" is fractured. Management didn't share the vision.
      *   **Part 3: The Ending (The Reversion):**
          *   Workers resisted. This validates Keynes's prediction about *workers* wanting leisure.
          *   Management/Market forced the change. This invalidates Keynes's prediction about *capitalists* losing the love of money.
          *   The "Love of Money" didn't fade; it just moved seats.
      *   **Conclusion:** Summarize the residue. Keynes was right about the desire, wrong about the power dynamics and the definition of "the good."

  4.  **Refining and Polishing (Focusing on the "Awkward Parts"):**

      *   *Self-Correction during drafting:* Make sure I don't just praise Keynes or just praise the workers. Keep the tension.
      *   *Specific Focus:* The prompt asks about the "Moore/Apostles" angle. I need to emphasize that Keynes's "Good Life" is specific (aesthetic/intellectual), not generic "happiness." The Kellogg workers' happiness might look like "philistinism" to an Apostle.
      *   *The "Residue":* What doesn't fit? The idea that leisure requires *training* (Keynes) vs. leisure is just *rest* (Kellogg). The idea that the economic problem is *solved* (Keynes) vs. it is *managed* (Kellogg).
