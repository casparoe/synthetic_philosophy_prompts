  6.  **Final Polish:** (Mental walk-through of the argument).
      *   *Argument:* The Kellogg case confirms Keynes's diagnosis of worker desire but refutes his diagnosis of capitalist psychology and his definition of the "Good."
      *   *Nuance:* The workers didn't need to be taught how to use leisure; they just used it. Keynes thought that was the hard part. That's a major theoretical miss.
      *   *Nuance:* The workers lost not because they loved money, but because the system required growth. Keynes underestimated the systemic imperative of accumulation.

