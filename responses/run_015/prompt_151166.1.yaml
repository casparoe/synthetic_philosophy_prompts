answer: |-
  Hi everyone. Thanks for coming, especially on a Thursday. I know, I know—usually, this time of night is for winding down, not for arguing about the future of existence. But look around this room. On one side, we've got moral philosophers who spend their time asking what makes a life worth living. On the other, we've got urban planners who actually build the places where those lives happen.

  Usually, you guys don't talk. I think the philosophers worry the planners are too practical, and the planners worry the philosophers are too… floaty. But we're here because we're both obsessed with the same number. The headcount.

  There's this tricky idea in ethics—I'm not going to name-drop some British guy from the 80s or use any jargon, promise—but you know the puzzle. Is it better to have a smaller group of really happy people, or a huge crowd whose lives are just… okay? Barely worth living, but still worth it? If you just add up the total happiness, sometimes the huge crowd wins. But intuitively, that feels wrong. It feels like we're missing something about quality.

  Now, planners, you deal with this too, but it looks different on your end. You run projection models. You say, "We need 5,000 units for 10,000 people." You treat those 10,000 people as a given, like weather. But where do they come from? If you build the dense affordable housing, the people show up. If you don't, maybe different people exist later, or fewer people exist. So the plan isn't just accommodating people; it's kind of calling them into existence.

  It's like… okay, this might be a clumsy analogy, but stick with me. Imagine a party invitation list. If you invite more guests, the vibe changes. Maybe it's louder, less intimate, maybe the food runs out. But you still have to decide whether to send the invite. You can't just say "the more the merrier" without asking what kind of party you're having. And you can't pretend the guests were going to be there anyway if you're the one holding the pen.

  So when you put a population number on a spreadsheet, it feels neutral. Just arithmetic. But it's not. It affects—which way do I say it?—it *effects* the outcome? No, affects. Whatever. It changes the moral weight of the policy. Adding lives to the forecast isn't just filling slots; it flips which policy looks best.

  Some folks say total welfare is the only metric that matters. Others say average quality matters more. I'm not solving that debate today, and I'm definitely not suggesting we stop building housing. But I want us to see that when we decide who gets counted, we're deciding what kind of future we're building. Not just how many bricks.

  So let's not talk past each other. Let's look at the numbers together, and admit that counting people is never just math. Thanks, and let's get started.
