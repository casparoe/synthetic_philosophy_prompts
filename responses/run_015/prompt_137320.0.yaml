answer: |-
  Question 3

  Consider the Helios lineage, a synthetic biology project involving self-replicating protocells. In the primary lineage, a membrane protein P is assembled at t0 with no useful effect. At t1, the cells are moved to a chemostat containing a toxin; P happens to pump the toxin out, conferring a four percent fitness advantage. By t2, five hundred generations later, P is universal in the population, clearly retained due to this advantage. At t3, the toxin is removed. P is still expressed but now only buffers internal pH slightly, making no measurable difference to survival or reproduction. A second lineage is constructed where a variant of P buffers pH exactly as in t3, but this lineage was never exposed to the toxin and P was never selected for pumping.

  Write an essay addressing the following. First, assign the function of P at t3 for both lineages according to both the etiological account and the causal-role account. Second, explain why these accounts diverge in this specific case. Third, and most importantly, evaluate whether there is a single fact of the matter about the true function of P at t3, or whether the correctness of a function attribution depends on the explanatory context in which the question is asked. In your evaluation, consider whether the historical record of selection is ever specific enough to uniquely identify a function even when the etiological account is assumed.

  Model Answer

  To evaluate the function of protein P at t3, we must apply the competing accounts to the specific history and current capacities of the Helios lineages. According to the causal-role account, function is defined by the current contribution of a trait to the capacity of a containing system. At t3, P contributes to pH buffering in both lineages. It does not contribute to toxin pumping because the toxin is absent. Therefore, the causal-role account attributes the function of pH buffering to P in both the primary and secondary lineages equally. The history of the trait is irrelevant; only its current causal contribution matters.

  The etiological account defines function by the historical reason for a trait's presence, specifically the effect for which it was selected. For the primary lineage, P was selected at t1 and t2 for toxin pumping. Even though this effect is no longer active at t3, the etiological account maintains that the function remains toxin pumping because that is why P is there. For the secondary lineage, P was never selected for any effect. Consequently, the etiological account must say P has no function in the secondary lineage, or at best that it has no proper biological function, despite doing the same thing as in the primary lineage. This generates a sharp divergence: the causal-role account sees functional identity across lineages based on current capacity, while the etiological account sees functional difference based on history.

  However, asserting that one account is simply correct misses the deeper philosophical issue. The divergence suggests these accounts are not competing descriptions of the same fact but are tools for different explanatory jobs. The etiological account answers why the trait is present in the population, underwriting explanations of stability and design. The causal-role account answers what the system can do now, underwriting mechanistic explanations of current physiology. If a researcher asks why P is universal in the primary lineage, the etiological function (pumping) is the relevant answer. If a researcher asks how the cell maintains homeostasis at t3, the causal-role function (buffering) is the relevant answer. Thus, there is no context-independent fact of the matter; the appropriateness of the attribution depends on whether the inquiry is historical or mechanistic.

  Furthermore, even if we prioritize the etiological account, there is an indeterminacy problem regarding which historical effect constitutes the function. Selection acts on whole organisms and reproductive success, not on isolated traits in isolation. At t2, P was selected because it conferred a fitness advantage, but selection does not necessarily distinguish between pumping toxin specifically versus general membrane robustness that happened to involve pumping. The historical record shows P was selected for contributing to survival, but multiple causal descriptions fit that contribution. Therefore, even within the etiological framework, identifying the specific function as pumping rather than some broader category is partly a matter of how we individuate the trait relative to the selection pressure. This reinforces the view that function attributions are not merely discovered facts but are shaped by the explanatory interests of the attributor, resolving the conflict not by choosing one account over the other, but by recognizing their distinct pragmatic utilities.

  Marking Scheme

  The first five marks are awarded for the correct application of both accounts to both lineages at t3. Students must identify that causal-role attributes buffering to both, while etiological attributes pumping to the primary lineage and no function to the secondary. A common error here is confusing the accounts, such as claiming the etiological account looks at current utility, or failing to distinguish the secondary lineage's lack of history.

  The next five marks require a clear explanation of why the accounts diverge, specifically locating the disagreement in the role of history versus current capacity. Students often receive half credit here if they simply state that one looks at history and one at current effects without explaining how this leads to different verdicts in the Helios case specifically, treating it as a definition check rather than a case application.

  The third criterion, worth five marks, assesses the evaluation of whether there is a fact of the matter. Top marks require the student to argue for pragmatic pluralism, noting that the accounts serve different explanatory goals. Students typically lose marks here by dogmatically asserting one account is true and the other false, or by offering a shallow compromise that ignores the explanatory context.

  The final five marks are reserved for discussing the indeterminacy of selection history. The student must note that even within the etiological account, selection acts on overall fitness, making the specific function description underdetermined by the history alone. Most students miss this entirely, assuming selection uniquely individuates functions, or they conflate this with the problem of drift, failing to see the ambiguity in describing the selected effect itself.
