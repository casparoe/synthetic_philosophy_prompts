prompt: |-
  I'm the TA for a 4000-level philosophy of biology seminar (mixed third-years, half bio majors half philosophy majors) and I'm putting together the take-home final right now. I've got two questions I'm happy with and I want the third one to be on the function debate — etiological/selected-effects accounts versus causal-role accounts — but I have a specific problem. I marked last year's papers on this and they were all basically the same essay: a paragraph saying the etiological account ties function to selection history and the causal-role account ties it to what a part currently contributes to a containing system's capacities, then the two stock objections everyone recites (the first-generation or "swamp" case where something useful has no history, and the worry that on the role account a part has as many functions as there are systems you care to embed it in), then a shrug in the last paragraph. Everyone got the same B and I honestly couldn't tell who'd understood anything. So I need a question where being able to state that summary cleanly gets you maybe half credit at most, and where the top marks require seeing something the summary doesn't tell you.

  The angle I keep coming back to is to make the question turn on a case I made up rather than the textbook ones, so there's nothing to recall. Call it the Helios lineage: a synthetic biology group assembles self-replicating protocells from scratch, and one of the membrane proteins, P, initially does nothing useful at all. At t1 the cells are moved into a chemostat containing a toxin, and P happens to pump it out, giving its bearers about a four percent fitness advantage. By t2, five hundred generations later, P is universal in the population and clearly retained because of that effect. At t3 the toxin is removed from the environment and P still gets expressed, but now all it does is buffer internal pH by a small amount, which makes no measurable difference to survival or reproduction. I also want a fourth branch of the case where the lab builds a second lineage whose version of P has the pH-buffering effect but is never under selection for it — it's just carried along. So the student has to say what the function of P is at each stage, what the two accounts each say, and — this is the part I actually want tested — whether there's a fact of the matter, or whether the right answer depends on what you wanted a function attribution for in the first place. If they can get to the point that the two accounts might be doing different explanatory jobs (one underwriting "why is it there," one underwriting mechanistic explanation of what the system can do now), and to the point that even once you grant the etiological story there's an indeterminacy about *which* historical effect is the function given that selection acts on whole organisms and the effect is only ever a matter of degree, they've got the bit I'm looking for. But please write the question so that this isn't telegraphed — I don't want the question to hand them the conclusion.

  So here's what I need from you: one essay question, answerable in about forty-five minutes, built around something like the above (feel free to sharpen the case if you can see a way to make it cut deeper). After it, a model answer of roughly seven hundred words that shows what a genuinely strong paper does — including the moves I mentioned and whatever else you think belongs — and then a marking scheme out of twenty, broken into four or five must-hit points with the marks for each, plus one line per point on how students typically get that point wrong or half-right. Don't build anything around naming papers or authors: our students have no required reading list for this section and I don't want anyone penalized for not remembering who said what in 1973. And one formatting thing — our LMS strips all markup and I paste straight into it, so please write the whole thing as continuous prose, no headings, no bullet points, no bold, no tables; just the question, then the model answer, then the scheme, as if you were typing me an email.
