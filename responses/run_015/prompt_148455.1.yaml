answer: |-
  This is a fantastic framing. You are essentially asking for a translation of historiographical epistemology into the language of experimental metrology and data analysis. As a condensed-matter physicist, you know that "raw data" is already processed data, and that every instrument has a transfer function.

  Here is the residue report on Ranke, Carr, and White, translated into your laboratory vocabulary.

  ### 1. Ranke: The Limit of Zero Systematic Error
  **The Claim:** *Wie es eigentlich gewesen* ("how it actually was").
  **The Physics Translation:** Ranke is positing the existence of an ideal instrument with perfect calibration and zero observer effect. He believes that if you rigorously clean your samples (archival criticism) and minimize noise (bias), the signal (the past) will emerge unadulterated.

  *   **Assumption:** The system (the past) exists in a definite state independent of the measurement apparatus (the historian).
  *   **Method:** Eliminate systematic error until the measurement converges on the true value.
  *   **The Flaw (from your perspective):** Ranke assumes the "instrument" (the human mind/archive) is passive. He treats the archive as a detector that records events without altering them. In your lab, you know the probe often perturbs the sample. Ranke assumes the probe is non-invasive.

  ### 2. E.H. Carr: Selection Bias and Boundary Conditions
  **The Claim:** "The facts speak only when the historian calls on them." (From *The Historian and His Facts*).
  **The Physics Translation:** Carr is talking about **experimental design and data filtering**.

  *   **Selection:** In a lab, you don't record every voltage fluctuation; you set a bandwidth. Carr argues historians set the bandwidth based on their contemporary context. If you study the French Revolution, you filter out the weather data unless you are a climate historian.
  *   **Theory-Ladenness:** You cannot identify a "fact" without a theoretical framework to categorize it. A spike on an oscilloscope is only a "signal" if your theory says it matters. Carr argues the historian's social context provides the theory that defines the signal.
  *   **Mapping to Experimental Design:** This maps cleanly. You choose your facts (data points) based on the hypothesis. However, in physics, nature pushes back. If you select data to confirm a bias, the reproducibility test fails. In history, there is no reproducibility test. Carr's point is that without a "present" purpose, the "past" data is just white noise.

  ### 3. Hayden White: Emplotment as Model Selection (with a catch)
  **The Claim:** Historical narratives are verbal fictions; the content is found, the form is imposed (Romance, Tragedy, Comedy, Satire).
  **The Physics Translation:** White is arguing that **fitting a curve to the data is a moral/aesthetic choice, not just a statistical one.**

  *   **Emplotment vs. Theoretical Model:** You asked if emplotment is like picking a theoretical model.
      *   *Similarity:* Yes. You have scatter points (events). You can fit a linear regression (Progress/Comedy), an exponential decay (Decline/Tragedy), or a periodic function (Cycle/Satire). The data points often support multiple fits within error bars.
      *   *The "Weirder" Difference:* In physics, the model is constrained by mechanism. If you fit a tragedy curve to a superconductor, the system doesn't care. In history, the "model" (Tragedy) imposes a *teleology* (an ending). A physics model describes *how* a system evolves; a historical plot describes *what it meant*.
      *   **Underdetermination:** White's core argument is that the data (archives) is insufficient to uniquely determine the plot. In physics, we assume sufficient data + correct theory = unique solution (ideally). White says the "solution" is chosen based on the historian's ideological preference, not the data density.

  ---

  ### The Residue Report

  Here is the breakdown of what translates, what distorts, and what is missing from your vocabulary.

  #### A. Clean Translations (High Fidelity)
  1.  **Theory-Laden Observation (Carr):** Just as you cannot read a Hall probe without understanding electromagnetism, a historian cannot read a treaty without understanding "sovereignty." There is no pre-theoretical "fact."
  2.  **Calibration Limits (Ranke):** Ranke's archival rigor is equivalent to error analysis. He was right that you must quantify the reliability of your detector (source criticism).
  3.  **Model Dependence (White):** Data does not interpret itself. You need a function to connect the points.

  #### B. Distorted Translations (Requires Renormalization)
  1.  **Emplotment vs. Fitting:**
      *   *Physics:* You choose a model (e.g., Ising model) based on symmetry breaking and Hamiltonians. If the residuals are high, you discard the model.
      *   *History:* You choose a plot (e.g., Tragedy) based on moral intuition. If the residuals are high, you might ignore the outliers (White's point).
      *   *Distortion:* In physics, the model predicts *future* measurements. In history, the plot organizes *past* events. Emplotment is retrodictive, not predictive. This changes the falsifiability criteria.
  2.  **Fact Selection vs. Filtering:**
      *   *Physics:* You filter noise to find the signal.
      *   *History (Carr):* Carr argues the "noise" for one generation is the "signal" for the next. The filter isn't just technical; it's sociological. This is harder to quantify than a bandwidth limit.

  #### C. The Null Set (No Expression in Experimental Practice)
  This is the most critical part for you. There are concepts in the Carr/White critique that have **no analog** in condensed matter physics.

  1.  **The $N=1$ Problem (Non-Reproducibility):**
      *   In your lab, if you doubt a measurement, you run the sample again. You can ensemble average.
      *   In history, the French Revolution happens once. There is no ensemble. You cannot separate systematic error from the signal because you cannot vary the parameters and re-run the universe. This makes the "observer effect" fatal in history in a way it isn't in physics. In physics, you can characterize the observer effect. In history, the observer *is* the only control variable.
  2.  **Agency and Feedback:**
      *   Electrons do not read papers about electron behavior and change their minds.
      *   Historical actors read history and change their behavior. The "system" observes the "observer." This creates a feedback loop that violates the assumption of a static Hamiltonian.
  3.  **Meaning vs. Mechanism:**
      *   Physics seeks mechanism (causality). History seeks meaning (significance).
      *   White's "Satire" or "Tragedy" are categories of *meaning*. There is no physical observable corresponding to "Tragic." This is why White's critique feels "softer" to a scientist. It operates in a Hilbert space you don't use.

  ### Summary: Was Ranke Chasing Perfect Calibration?

  Yes, but he was solving the wrong inverse problem.

  *   **Ranke** thought history was a **measurement problem**: "How do I reduce the noise to see the true state?"
  *   **Carr** argued it is a **control problem**: "Which variables are we holding constant, and why?"
  *   **White** argued it is a **construction problem**: "The data does not contain a story; we are writing a function that interpolates the points, and the choice of function determines the moral outcome."

  **The Verdict:**
  Ranke was not wrong about the *ethics* of rigor (don't fake data), but he was wrong about the *ontology* of the archive. He treated documents as direct measurements of reality. Carr and White treat documents as measurements of *previous observers' perceptions*, filtered through a current observer's narrative model.

  **Is there something your vocabulary is missing?**
  Yes. **Singular Causality.**
  In physics, causality is usually local and repeatable (A hits B, B moves). In history, causality is often global, singular, and counterfactual ("If the Archduke hadn't been shot, would WWI have happened?"). You cannot run the counterfactual experiment.
  Carr and White are arguing about how to handle data where **$N=1$ and the Hamiltonian is unknown.**

  Ranke thought he could calibrate the instrument. Carr and White are telling you that in this specific lab, the instrument is also the experimenter, the sample is unique and destroyed upon measurement, and there is no way to check if your model fits because you can't run the experiment again.

  Ranke wasn't chasing impossible calibration; he was chasing calibration in a system where the concept of "standard reference material" does not exist.
