answer: |-
  The first bowl is passed to the FATHER.
  He waits for word from the RULER.
  The lamp is trimmed by the HUSBAND.
  The bench is saved for the BROTHER.
  The jar is opened for the FRIEND.
  There is a knock from the STRANGER.

  The mud is tracked in by the STRANGER.
  He does not look like the FATHER.
  He drinks water like a FRIEND.
  He owes no debt to the RULER.
  He stands apart from the BROTHER.
  He will not eat as a HUSBAND.

  The ring is offered to the HUSBAND.
  But the hand belongs to a STRANGER.
  He calls the elder man BROTHER.
  Though blood claims him as FATHER.
  They argue like any FRIEND.
  Without command from the RULER.

  The decree comes from the RULER.
  To protect the home of the HUSBAND.
  But the guest is treated as FRIEND.
  Or left outside as STRANGER.
  Who knows the grief of the FATHER.
  Better than his own BROTHER.

  The younger stands in for the BROTHER.
  When the law speaks for the RULER.
  The grain is stored by the FATHER.
  The lock is turned by the HUSBAND.
  There is no name for the STRANGER.
  Unless you call him FRIEND.

  The choice is made by the FRIEND.
  When blood fails the BROTHER.
  The knock comes from the STRANGER.
  There is no law from the RULER.
  No ring left for the HUSBAND.
  No bowl set for the FATHER.

  The FRIEND welcomes the STRANGER before the RULER.
  The seat is saved for the BROTHER, beside the HUSBAND.
  The bowl is passed to the FATHER.
