      *   **Core Question:** Does Herodotus's preference for the Egyptian version represent an intuitive grasp of this "archival drift threshold" (Homeric = too much heroic agency vs. Egyptian = bureaucratic/ritual framework), OR is he operating with a different criterion (pragmatic inference from human nature)?
      *   **Secondary Considerations:** Does "archival drift" apply to pre-archival societies? How does this illuminate modern debates about legends (Trojan War, Arthur, Exodus) becoming history?
      *   **Constraint:** Before responding, brainstorm conceptual distinctions (historical-methodological, philosophical problems about testimony, inference, institutional memory).

  2.  **Brainstorming & Conceptual Distinctions:**
