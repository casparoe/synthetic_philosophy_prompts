answer: |-
  As a philosopher of history specializing in the epistemology of ancient narratives, I find your formulation of the "archival drift threshold" to be a provocative and analytically potent heuristic. It touches upon the core tension in historiography between *res gestae* (things done) and *narratio* (the telling).

  To answer your question rigorously, we must first disentangle Herodotus's explicit methodological claims from the structural properties of the sources he evaluates. We must then determine if your concept describes Herodotus's *conscious* criterion or the *underlying epistemic structure* he is intuitively navigating.

  ### 1. Herodotus's Explicit Criterion: *Eikos* and Human Nature
  In Book 2 of the *Histories* (specifically 2.120), Herodotus's preference for the Egyptian account (the "Memphite Logos") over the Homeric one is explicitly grounded in **pragmatic inference from human nature** (*anthropine physis*), rather than a theory of archival transmission.

  Herodotus employs the concept of *eikos* (probability or likelihood). His syllogism is rationalist:
  1.  **Premise:** No rational political actor would endure total destruction (the sacking of their city and the death of their kin) to retain a stolen woman if they could return her to end the conflict.
  2.  **Observation:** The Trojans endured total destruction and did not return Helen.
  3.  **Inference:** Therefore, the Trojans did not have Helen.

  Herodotus explicitly critiques Homer for knowing this version but rejecting it for the sake of poetic suitability (*eprepe*). For Herodotus, the "truth" is what aligns with strategic rationality. He is operating as a proto-game theorist, assuming stable preferences (self-preservation) across historical time.

  **Verdict on your specific question:** Strictly speaking, Herodotus is **not** operating with the "archival drift threshold" as a conscious criterion. He does not argue, "The Egyptian story is true because it sounds like a bureaucratic record." He argues, "The Egyptian story is true because it makes logical sense."

  ### 2. The "Archival Drift" as an Intuitive Grasp of Source Reliability
  However, while *eikos* is his explicit tool, the "archival drift threshold" accurately describes the **structural difference** between the two traditions he is weighing. This is where your framework illuminates Herodotus's method retroactively.

  *   **The Homeric Tradition (Heroic Agency):** The *Iliad* is a narrative of *kleos* (glory). It centers on individual agency, divine intervention, and the passions of Achilles and Paris. It is "personalized." In your framework, this narrative has not crossed the archival drift threshold; it remains in the realm of legend because the agents are heroes, not functionaries.
  *   **The Egyptian Priestly Tradition (Institutional Framework):** The account given by the priests of Hephaestus at Memphis frames Helen not as a romantic prize, but as a diplomatic incident. She is sequestered by Pharaoh Proteus; Paris is expelled; Menelaus arrives later to retrieve her. The narrative is embedded in state protocol, temple records (*grammata*), and diplomatic succession.

  Herodotus trusts the priests not merely because they are priests, but because their narrative **strips away the heroic excess** that violates *eikos*. In this sense, Herodotus intuitively grasps that **institutional memory tends to preserve political rationality, while poetic memory preserves emotional resonance.**

  He recognizes that the "drift" from heroic legend to institutional record correlates with a higher probability of factual accuracy regarding state-level interactions. He prefers the version where Helen is a **political object** managed by a state (Egypt) over the version where she is a **romantic subject** driving a war (Troy). Thus, while his *vocabulary* is about human nature, his *epistemic weighting* relies on the archival drift you describe: he privileges the narrative that sounds like a state record over the one that sounds like a song.

  ### 3. The Problem of "Pre-Archival" Societies
  You ask whether "archival drift" applies to pre-archival societies. This is the crux of the philosophical difficulty. If "archive" implies written state records, the concept fails for Bronze Age oral cultures. However, if we define "archive" functionally as **institutionalized memory distinct from performative memory**, the concept holds.

  *   **Performative Memory (Bards/Homer):** Designed for audience pleasure, metric preservation, and cultural identity. High drift toward heroic agency.
  *   **Institutional Memory (Priests/Heraldic Castes):** Designed for ritual correctness, succession, and diplomatic precedent. High drift toward bureaucratic stability.

  The Egyptian priests Herodotus consults represent an **oral archive**. They claim access to *grammata* (records), but even without physical texts, their caste function is archival. They preserve the "bureaucratic framework" you describe. Therefore, the "archival drift threshold" is not dependent on the *medium* (clay vs. papyrus vs. oral formula) but on the **sociological function of the narrator**.

  Herodotus is effectively identifying that the Egyptian priestly caste operates above the "drift threshold" (preserving institutional logic), while the Greek bardic tradition operates below it (preserving heroic agency).

  ### 4. Implications for Modern Debates (Troy, Arthur, Exodus)
  Your framework, mediated through Herodotus's method, offers a robust tool for analyzing modern historical controversies. It suggests that legends become "provisional history" not when they are proven true by spades (archaeology), but when they migrate from **personalized agency** to **institutional constraint**.

  **A. The Trojan War**
  *   **Legend:** Achilles' rage, the duel of Paris and Menelaus, the Wooden Horse. (High heroic agency).
  *   **History (The Drift):** The Hittite archives (Tawagalawa Letter) mention a conflict over Wilusa (Troy) involving Ahhiyawa (Greeks). This is the "archival drift." It strips away Helen and Achilles and leaves a state-level dispute over trade routes and vassalage.
  *   **Herodotean Insight:** Like Herodotus, modern historians find the Hittite "bureaucratic" version more historically credible than the Homeric "heroic" version, precisely because it aligns with political rationality (*eikos*).

  **B. King Arthur**
  *   **Legend:** Geoffrey of Monmouth's *History of the Kings of Britain*. Arthur slays giants, wields Excalibur, fights magical battles. (High heroic agency).
  *   **History (The Drift):** Gildas's *De Excidio et Conquestu Britanniae* or the *Annales Cambriae*. Arthur appears as a *dux bellorum* (leader of battles), a functionary in a post-Roman military hierarchy.
  *   **Herodotean Insight:** The "historical Arthur" is the one stripped of the Round Table (ritualized equality) and placed in the context of Saxon foederati breakdown (diplomatic failure). The moment the story becomes about a warlord managing resources rather than a king seeking a grail, it crosses your threshold.

  **C. The Exodus**
  *   **Legend:** Moses parting the sea, ten plagues, 600,000 men wandering for 40 years. (High divine/heroic agency).
  *   **History (The Drift):** The absence of Egyptian archival corroboration is the negative signal. However, some scholars propose a "drifted" version: a small group of Semitic slaves escaping during the political instability of the Late Bronze Age collapse, integrated later into a national myth.
  *   **Herodotean Insight:** A Herodotean analysis would ask: "Would Pharaoh let 600,000 slaves go to avoid plagues?" (Violates *eikos* / political rationality). "Would a small group escape during a border collapse?" (Aligns with *eikos*). The "archival drift" version is the one that fits the geopolitical constraints of the New Kingdom, even without direct textual evidence.

  ### Conclusion
  Does Herodotus's preference represent an intuitive grasp of the **archival drift threshold**?

  **Yes, but structurally rather than theoretically.**
  Herodotus does not possess the sociology of memory to articulate your threshold. However, his method of *historia* instinctively seeks out the narrative that has undergone the "drift" from heroic passion to political rationality. He recognizes that the Egyptian priestly tradition, by virtue of its institutional nature, has depersonalized the agents (Helen becomes a detainee, Paris a violator of xenia, Proteus a upholder of law) in a way that makes the narrative compatible with *eikos*.

  Your concept of the "archival drift threshold" effectively formalizes what Herodotus practices intuitively: **Historicity is not a property of the event itself, but a property of the narrative's transmission through institutional filters that suppress heroic agency in favor of bureaucratic plausibility.**

  In modern debates, this suggests we should not look for the "truth" of legends by digging for the hero's sword, but by looking for the "bureaucratic shadow" the hero cast—the tax records, the diplomatic letters, the border disputes that remain when the magic and the glory are subtracted. That is the point where legend drifts into history.
