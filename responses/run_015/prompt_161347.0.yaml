prompt: |-
  Bit of background first. I retired six years ago after a little over thirty years in seismic tomography — mostly estimating what the subsurface looks like from arrival times, ie a whole career of inverse problems where the answer is never unique. Since then I've been sitting in on a philosophy reading group at the community college and I got a bit obsessed, and somehow that turned into them asking me to give the spring talk. I said yes before thinking about the part that comes after the talk.

  Here is what I want to argue. Take a quantity in a model that no possible data set could pin down — not just because our instruments are noisy or we don't have enough receivers, but because of the structure of the problem: two quite different subsurface models that would produce exactly the same arrival times at every receiver anyone could ever place. The question I care about is whether the difference between those two models is a difference in what the theory says is there. My proposal is to stop treating accessibility as one thing and split it into three:

  - observation-accessible: some observation we could in principle make would come out differently;
  - intervention-accessible: no possible observation seperates them, but whether something we could physically do succeeds or fails depends on which one is right — you can't see the difference, you can act on it;
  - inhabitant-accessible: only a hypothetical observer stationed inside the region, or one around after the causal setup changes, could ever tell them apart.

  Rough claim: real ontological difference runs out at the second grade, not the first. Grade two is what keeps two models from being the same model in a costume; grade three is where the question stops having an answer at all.

  Audience is about fourteen people. The two people who run the reading group — one is a realist of the structural stripe, the other is sympathetic to the view that science only has to get the observable part right. A metaphysician who keeps asking what makes a question have an answer in the first place. A philosopher of physics who I expect will bring up gauge symmetry or GR models related by a change of coordinates, which I will not follow. And three or four working Earth scientists I dragged along who think the entire discussion is idle, because in practice you pick the model that behaves best under your smoothing prior and get on with it, and they will say so out loud. Nobody there besides me has ever worked on inverse problems.

  What I want is a prep sheet for the question period, not a defense of the view. Give me the objections I'll actually get from these people, roughly in the order they'll come, with a sense of how much damage each one does, phrased the way each of them would phrase it rather than in jargon I'd have to translate on my feet, each with a short reply I could give standing at the front of the room and a note on where that reply is soft. Tell me which objections I should concede inside the talk instead of waiting to be caught on them, which single one I have to win for the talk to have been worth giving, and the question I'm hoping nobody asks.

  Two worries of my own. First, I'm fairly sure someone will say my intervention grade collapses into the observation grade: if whether an intervention works depends on the hidden structure, then the success or failure of the intervention is itself the observation that tells the two models apart, so grade two is secretly grade one after all. I have a reply and I don't trust it — tell me how bad that objection really is. Second, someone in the group mentioned a slogan they'd read somewhere, something along the lines of if you can spray it then it's real, and it sounded uncomfortably close to my position. If what I've built turns out to be a named view I've never actually read, tell me what it's called, whether that's a compliment or a disaster, and what the standard objection to it is.

  I can't look anything up while I'm standing up there and I don't have the literature memorized, so please don't hand me a reading list or tell me who to cite — just what to say.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User and Context:**
      *   **User:** Retired seismic tomographer (30+ years), inverse problems expert. Understands non-uniqueness deeply.
      *   **Setting:** Community college philosophy reading group spring talk.
      *   **Audience:** ~14 people.
          *   2 Organizers: Structural realist, Empiricist (observable part only).
          *   1 Metaphysician: Interested in truth-makers/meaningful questions.
          *   1 Philosopher of Physics: Likely to bring up gauge symmetry/GR/diffeomorphism invariance.
          *   3-4 Earth Scientists: Pragmatists, think the debate is idle, rely on regularization/priors.
          *   Rest: Laypeople/Generalists.
      *   **Goal:** A prep sheet for the Q&A period. *Not* a defense of the view, but a strategic guide to objections, replies, concessions, and risks.
      *   **Core Argument:** Split "accessibility" into three grades to define ontological commitment.
          1.  Observation-accessible (Standard empiricism).
          2.  Intervention-accessible (Can't see it, but acting on it yields different results).
          3.  Inhabitant-accessible (Only an internal observer or post-causal-change observer could tell).
          *   *Claim:* Ontology stops at Grade 2. Grade 3 is meaningless/indeterminate.
      *   **User's Worries:**
          1.  Intervention collapses into Observation (Success of intervention *is* an observation).
          2.  "If you can spray it, it's real" (Hacking's Entity Realism). Is this just rediscovering a known view?

  2.  **Deconstruct the Core Argument (Philosophical Assessment):**
      *   The user is proposing a form of *Manipulability Realism* or *Interventionist Realism*.
      *   The distinction between Observation and Intervention is classic (Hacking, Cartwright), but the specific three-tiered structure (Observation, Intervention, Inhabitant) is a novel framing for this specific context (inverse problems).
      *   The "Inhabitant" category sounds like "God's eye view" or "View from Nowhere" vs. internal perspective. It touches on underdetermination and surplus structure.
      *   The collapse objection (Worry 1) is the strongest philosophical threat. If an intervention yields a macroscopic difference, that difference is observable.
      *   The "Spray it" slogan (Worry 2) refers to Ian Hacking's *Entity Realism* ("If you can spray them, they are real"). This is a compliment but comes with baggage (specifically regarding natural kinds vs. constructed entities).

  3.  **Drafting the Prep Sheet - Section by Section:**

      *   **Section 1: The "Spray It" Worry (Identity Check).**
          *   Need to address this first so the user knows where they stand.
          *   It *is* Hacking's Entity Realism.
          *   Is it a disaster? No, it's a respectable position. But Hacking focuses on *entities* (electrons), the user is focusing on *structures/models* (subsurface velocity fields).
          *   Standard objection to Hacking: Theory-ladenness of experimentation. You need a theory to know *what* you are spraying.
          *   *Advice:* Acknowledge the kinship, distinguish the focus (structure vs. entity).

      *   **Section 2: The Objections (Ordered by Likelihood/Impact).**
          *   *Objection 1: The Earth Scientists (The Pragmatists).* They will speak first/loudest. "Why care? We use priors."
              *   *Damage:* Low philosophical damage, high social awkwardness if dismissed.
              *   *Reply:* Validate them. This isn't about practice, it's about what we claim to *know* when the math stops.
              *   *Soft spot:* Don't imply their priors are "fake."
          *   *Objection 2: The Collapse Objection (Intervention = Observation).* This is the user's specific worry.
              *   *Damage:* High. If Grade 2 collapses to Grade 1, the triad fails.
              *   *Reply:* Distinguish *passive* observation (arrival times) from *active* manipulation (drilling, fracking). The "observation" of the intervention's success relies on a *different* causal channel than the original data.
              *   *Soft spot:* If the "success" is just another arrival time, it collapses. Needs to be a different *kind* of effect.
          *   *Objection 3: The Philosopher of Physics (Gauge/GR).*
              *   *Damage:* High confusion risk. They will talk about diffeomorphism invariance.
              *   *Reply:* Admit ignorance on GR, pivot to the *functional* equivalence. In seismic, two models map to same data. In GR, two metrics map to same physics. The "Inhabitant" grade is where the gauge freedom lives.
              *   *Soft spot:* Don't try to bluff on GR.
          *   *Objection 4: The Metaphysician (Truth-makers).*
              *   *Damage:* Medium. "What makes Grade 2 real if not Grade 1?"
              *   *Reply:* Causal powers. Realism about causal structure, not just phenomena.
              *   *Soft spot:* Risks sounding like naive realism.
          *   *Objection 5: The Empiricist Organizer.*
              *   *Damage:* Medium. "Why go beyond observation?"
              *   *Reply:* Because science aims to guide action, not just predict spectra.
              *   *Soft spot:* Concedes the empiricist high ground on "truth."

      *   **Section 3: Strategic Concessions.**
          *   What to give up now to save the core?
          *   Concede that Grade 1 and 2 are closely linked.
          *   Concede that Earth Scientists are right about *practice*.

      *   **Section 4: The One Thing to Win.**
          *   Must establish that Grade 3 is *not* ontological. If Grade 3 is real, the distinction fails. The talk is worthless if the audience leaves thinking "Well, maybe the Inhabitant stuff is real too."
          *   Goal: Persuade them that Grade 3 is *surplus structure*.

      *   **Section 5: The Question to Avoid.**
          *   "How do you know where the line between 2 and 3 is?"
          *   This is the demarcation problem. If the line is fuzzy, the ontology is fuzzy.

  4.  **Refining the Tone:**
      *   The user is a scientist talking to philosophers. The tone should be respectful but grounded.
      *   Avoid jargon where possible (as requested).
      *   Keep replies "standing at the front of the room" short.
      *   Address the "Collapse" worry honestly. It *is* a strong objection.

  5.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "Spray it" worry? Yes, Hacking.
      *   *Check:* Is the order of objections logical? Start with the practitioners (they are in the room), then the philosophical heavy hitters.
      *   *Check:* Is the "Collapse" reply robust? The distinction is between *data equivalence* and *causal equivalence*. I need to make sure the user articulates that the intervention uses *new* physics (mechanics vs. wave propagation).
      *   *Check:* The "Inhabitant" term. It sounds a bit like "God's eye view." I should note that.
      *   *Check:* The Earth Scientists. They are the user's colleagues. Don't alienate them. Frame the talk as "foundational cleanup" not "methodological critique."

  6.  **Final Polish:** Ensure the "Soft Spot" notes are candid about where the argument might leak. Ensure the "Concede" section is actionable. (Proceed to generate output).

  *(Self-Correction on the "Collapse" Objection)*: The user's worry is: "If intervention success is observable, isn't it Grade 1?"
  *Reply:* Grade 1 is "Observation accessible *given the original experimental setup* (arrival times)." Grade 2 is "Observation accessible *only if we change the physical interaction* (drilling)."
  *Refinement:* The distinction is between *epistemic accessibility via the original data type* vs. *causal leverage via new physical coupling*. I need to make sure the user's reply captures this nuance without getting bogged down.

  *(Self-Correction on Hacking)*: Hacking's "Entity Realism" is about *entities* (electrons). The user is talking about *fields/structures* (velocity models). This is a crucial distinction. It's closer to *Structural Realism* but with a manipulability criterion. I should label it "Manipulable Structural Realism" roughly.

  *(Final check on constraints)*: No reading lists. No citations to look up. Just what to say.

  Let's assemble the prep sheet.cw
answer: |-
  **PREP SHEET: Q&A STRATEGY**

  **1. THE "SPRAY IT" WORRY (Identity Check)**
  *   **The View:** You have independently rediscovered a version of **Entity Realism**, most famously associated with Ian Hacking (1983). His slogan was exactly "If you can spray them, they are real."
  *   **Verdict:** This is a **compliment**, not a disaster. It places you in a respected tradition of scientific realism that avoids the trap of saying "theories are literally true" while still saying "science finds real things."
  *   **The Catch:** Hacking focused on *entities* (like electrons). You are focusing on *structures* or *fields* (velocity models).
  *   **Standard Objection to Hacking:** To know *how* to spray something, you already have to believe a theory about it is true. So you're relying on the theory to prove the entity, which is circular.
  *   **Your Shield:** You aren't arguing for the truth of the *whole theory*, just the specific structural feature that allows the intervention to work. If the drill bit breaks, the hardness was real, regardless of whether your wave equation was perfect.

  ***

  **2. THE OBJECTIONS (In Expected Order)**

  **Objection 1: The Earth Scientists (Your Colleagues)**
  *   **Who:** The 3-4 working scientists you dragged along.
  *   **What they'll say:** "This is a solution looking for a problem. In the field, we don't have 'exact same arrival times.' We have noisy data and we pick the smoothest model that fits. We don't need a metaphysical grade system to tell us to use a prior. Why are we spending an hour on distinctions that regularization solves?"
  *   **Damage:** **Low (Philosophically), High (Socially).** If you dismiss them, you look like you've left the practice behind. If you agree too much, your talk looks idle.
  *   **Reply:** "You're right about practice. Regularization is how we *work*. But when we publish, we often claim the model *is* the subsurface. I'm trying to clean up the claim, not the workflow. I want to know which parts of that smoothed model we can bet money on (Grade 2) versus which parts are just mathematical filler (Grade 3)."
  *   **Soft Spot:** You must not imply their priors are "lying." They are tools. Your argument is about *interpretation*, not *computation*.

  **Objection 2: The Collapse Objection (Your Personal Worry)**
  *   **Who:** The Metaphysician or the Structural Realist organizer.
  *   **What they'll say:** "You say Grade 2 is different from Grade 1 because you can't *see* the difference, only *act* on it. But if the action succeeds or fails, I can *observe* the success. So the success is an observation. Grade 2 just collapses into Grade 1."
  *   **Damage:** **High.** This threatens the core architecture of your three grades. If Grade 2 is just Grade 1 in disguise, your triad is a dyad.
  *   **Reply:** "Grade 1 is accessibility via the *original* causal channel (wave propagation). Grade 2 is accessibility via a *new* causal channel (mechanics, drilling, fluid flow). The arrival times will never change, but the drill bit will. I'm distinguishing between what the *data* tells us and what the *causal structure* allows us to do. One is passive reading; the other is active coupling."
  *   **Soft Spot:** If they press that "observing the drill bit" is still just "observation," concede the linguistic point but hold the line on the *physical* point. "Call it Observation-Plus if you like, but the *leverage* is different. One lets me predict; the other lets me build."

  **Objection 3: The Philosopher of Physics**
  *   **Who:** The person waiting to talk about Gauge Symmetry/GR.
  *   **What they'll say:** "This sounds exactly like the hole argument in General Relativity or gauge freedom in electromagnetism. We have mathematically distinct models that represent the same physical state. Are you saying Grade 3 is just gauge redundancy?"
  *   **Damage:** **Medium.** If you try to argue GR, you will lose. If you ignore them, you look ignorant.
  *   **Reply:** "I'm not equipped to speak on GR, but the intuition is identical. In seismic, we have 'null space'—model changes that change nothing in the data. If your Grade 3 is what physicists call 'gauge,' then we agree: it's mathematical surplus, not ontology. I'm happy to align my 'Inhabitant' grade with your 'Gauge'."
  *   **Soft Spot:** Do not try to elaborate on *why* they are the same. Just ally with them. "You have the math for this; I have the mud. But the null space feels like your gauge freedom."

  **Objection 4: The Empiricist Organizer**
  *   **Who:** The one who thinks science only needs to save the phenomena.
  *   **What they'll say:** "Why stop at Grade 2? If I can't observe it (Grade 1), why should I believe it's real even if I can intervene? Maybe the intervention works for reasons we don't understand. Why posit 'reality' at all?"
  *   **Damage:** **Medium.** This attacks your realism.
  *   **Reply:** "Because science isn't just a catalog of predictions; it's a manual for engineering. If I treat Grade 2 as real, I build bridges that stand. If I treat it as just a useful fiction, I have no reason to expect the next bridge to stand. Realism is the best explanation for why intervention works consistently."
  *   **Soft Spot:** This is the classic Realist vs. Empiricist stalemate. You won't convert them. Just state your pragmatic reason for being a realist.

  **Objection 5: The Metaphysician**
  *   **Who:** The one asking what makes a question have an answer.
  *   **What they'll say:** "What determines the boundary between Grade 2 and Grade 3? Is it fixed by nature, or does it shift as our technology improves? If we invent a new sensor, does Grade 3 become Grade 1?"
  *   **Damage:** **Medium-High.** If the boundary moves, your ontology is unstable.
  *   **Reply:** "Grade 1 shifts with technology. Grade 2 shifts with *physics*. A new sensor makes things observable (Grade 1). But Grade 2 is about whether the structure *couples* to anything physical. If a feature of the model couples to no physical process whatsoever—not light, not force, not gravity—then it's Grade 3. That boundary is fixed by the laws of physics, not our tools."
  *   **Soft Spot:** Be careful not to claim we *know* all the laws of physics. Phrase it as "coupling to known physical fields."

  ***

  **3. STRATEGIC CONCESSIONS (Give these inside the talk)**
  *   **Concede to the Earth Scientists:** Explicitly state in your closing remarks: "This does not change how we invert data. Regularization is still necessary. This is only about how we interpret the result after the computer stops." This disarms them before they speak.
  *   **Concede on the Collapse Objection:** Acknowledge that Grade 2 *results* are observable. "I admit, the *result* of the intervention is observed. My point is that the *access* to that reality required breaking the original observational setup. It requires a new physical interaction."

  ***

  **4. THE ONE THING YOU MUST WIN**
  *   **The Claim:** You must convince them that **Grade 3 is not real.**
  *   **Why:** If the audience leaves thinking, "Well, maybe the Inhabitant stuff is real, we just can't know it," your talk fails. You are arguing for a *limit* on ontology.
  *   **The Line:** "If two models differ only in Grade 3 features, they are not two different worlds. They are one world described twice. There is no fact of the matter."
  *   **Why this matters:** This is the only way to justify calling Grade 3 "idle." If Grade 3 could be real but hidden, your call to ignore it is dogmatic. If Grade 3 is *meaningless*, your call is logical.

  ***

  **5. THE QUESTION YOU HOPE NOBODY ASKS**
  *   **The Question:** "How do you know a Grade 2 feature won't turn out to be Grade 3 later?"
  *   **Why it's dangerous:** History is full of "causal powers" that vanished (e.g., phlogiston, caloric fluid). We thought we could intervene on them, but they turned out to be non-existent.
  *   **If asked:** "That's a risk of any realism. But phlogiston failed because the intervention *stopped* working when we understood chemistry better. Grade 2 is defined by *robust* intervention across multiple theories. If it vanishes, it wasn't Grade 2, it was a Grade 1 illusion we mistook for Grade 2." (This is a risky save, but your best bet).

  ***

  **SUMMARY CHECKLIST FOR THE PODIUM**
  1.  **Don't fight the Earth Scientists;** validate their practice, limit your claim to interpretation.
  2.  **Don't bluff on Physics/GR;** ally with the philosopher on "surplus structure."
  3.  **Defend Grade 2** by emphasizing *new physical coupling*, not just "observation."
  4.  **Kill Grade 3** by calling it "surplus description," not "hidden reality."
  5.  **Own the Hacking connection** if it comes up ("Experimental Realism"), but note you apply it to *models*, not just *particles*.
