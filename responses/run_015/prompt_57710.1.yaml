answer: |-
  # The Generational Ontology Diagnostic
  **A decision tree for social scientists tired of vague metaphysics**

  **Instructions:** Start at **Q1**. Follow the arrow that matches your intuition about the concrete case. Do not worry about where the arrow leads; answer based on the scenario described.

  ---

  ### **Q1: The Regression Check**
  You are modeling voting behavior. You control for **Age** (life cycle) and **Period** (the specific election year). You add a variable for **Cohort** (birth year).
  *   **A:** The cohort variable adds significant predictive power. There is something about being born in 1965 vs. 1975 that isn't just about being 50 vs. 40 or living in 2015 vs. 2025. → *Go to Q2*
  *   **B:** The cohort variable adds nothing. Once you know someone's age and the current year, their birth year tells you nothing new. → **Leaf 1: Hard Deflationism**

  ### **Q2: The Identification Problem**
  Statisticians warn you that *Cohort = Period − Age*. Mathematically, you cannot estimate all three separately without imposing arbitrary constraints. When you found that "cohort effect" in Q1:
  *   **A:** I think I found a real social pattern; the statistical problem is just a technical hurdle we can solve with better assumptions. → *Go to Q3*
  *   **B:** I suspect the "effect" is just a mathematical artifact of how I forced the model to work. It's a useful fiction for organizing the data, but not a feature of the world. → **Leaf 2: Statistical Fictionalism**

  ### **Q3: The Mannheim Test**
  Consider two people born in 1995. One is a tech worker in San Francisco; the other is a subsistence farmer in rural Laos. They have no contact, different values, and different life chances.
  *   **A:** They are members of the same generation simply by virtue of sharing the same birth-year location. → **Leaf 3: Demographic Realism**
  *   **B:** They are not the same generation until they develop some shared self-understanding or "we-feeling" about their historical position. → *Go to Q4*

  ### **Q4: The Labeling Effect**
  Suppose sociologists and marketers agreed to ban the term "Gen Z" tomorrow. No one uses it in news, policy, or conversation for 10 years.
  *   **A:** The behavior and cohesion of 20-year-olds would look roughly the same. The group exists independently of the name. → **Leaf 4: Phenomenological Realism**
  *   **B:** The group would fragment or behave differently. The act of classifying them helps create the very cohesion we are studying. → *Go to Q5*

  ### **Q5: The Boundary Shift**
  We move the cutoff for "Millennial" from 1996 to 1999. Someone born in December 1996 is now excluded.
  *   **A:** This breaks the category. If the boundaries are this fuzzy, the kind isn't robust enough to support causal claims. → *Go to Q6*
  *   **B:** This is fine. The boundaries are arbitrary, but the category is still useful for prediction and policy. → **Leaf 5: Pragmatic Instrumentalism**

  ### **Q6: The Portability Test**
  We take the label "Baby Boomer" (coined for the US post-war context) and apply it to people born in Japan between 1947–1949.
  *   **A:** It doesn't fit. The category depends on specific national institutions and histories; it doesn't travel. → **Leaf 6: Local Constructionism**
  *   **B:** It fits well enough. The demographic bulge creates similar social pressures regardless of national context. → **Leaf 7: Weak Cohort Realism**

  ---

  ### **The Leaves (Your Ontological Commitments)**

  1.  **Hard Deflationism:** There are only age effects and period effects. "Generations" are just shorthand for life stages.
  2.  **Statistical Fictionalism:** Cohort effects are mathematical artifacts. They are false, but we might keep using them if they help visualization.
  3.  **Demographic Realism:** Generations are natural kinds based on birth rates and biological time. Consciousness is not required.
  4.  **Phenomenological Realism:** Generations are real, but only when people *feel* like a generation (Mannheim's "generation as actuality").
  5.  **Pragmatic Instrumentalism:** Generations aren't strictly real (boundaries are fuzzy), but they are too useful to discard.
  6.  **Local Constructionism:** Generations are real social objects, but they are constructed by specific national histories and do not export.
  7.  **Weak Cohort Realism:** Generations are robust enough to survive boundary shifts and cross borders, even if they aren't "natural kinds" in the physics sense.
      *(Note: If you answered **Q4-B** and landed here, you are an **Interactive Kind** theorist: the classification loops back to shape the people.)*

  ---

  ### **Meta-Analysis: Empty Cells & Indistinguishable Leaves**

  **1. The "Incoherent" Combination**
  *   **Combination:** Answering **Q4-B** (Labeling creates cohesion) but landing in **Leaf 4** (Phenomenological Realism).
  *   **Verdict:** **Incoherent.** You cannot claim the group exists independently of the name *and* claim that removing the name would change the group's behavior. This is the defining tension of Ian Hacking's "Interactive Kinds." If the label changes the thing, the thing is not independent of the label.

  **2. The "Unattractive" Combination**
  *   **Combination:** Answering **Q3-A** (Birth year is enough) but **Q6-A** (Category breaks if exported).
  *   **Verdict:** **Unattractive.** If generations are purely demographic/biological (Demographic Realism), they should theoretically port across borders (birth rates are global phenomena). Claiming birth year is "natural" but *only* natural in one country requires a convoluted defense of why biology stops at the border.

  **3. The "Unexplored" Combination**
  *   **Combination:** Answering **Q2-B** (It's a math artifact) but **Q1-A** (It has causal power).
  *   **Verdict:** **Unexplored/Tension.** This is a "As-If Realism." You believe the effect is statistically artificial (APC problem) but causally potent. Most people resolve this by becoming Fictionalists (Leaf 2) or Deflationists (Leaf 1). Holding both suggests you think a mathematical error can cause social reality, which needs a mechanism (likely looping) to explain.

  **4. Indistinguishable Leaves**
  *   **Pair:** **Leaf 2 (Statistical Fictionalism)** and **Leaf 5 (Pragmatic Instrumentalism)**.
  *   **Why:** Both agree the category is not "real" in a robust ontological sense. The Fictionalist emphasizes the *falsity* (it's an artifact), while the Instrumentalist emphasizes the *utility* (boundaries are fake but useful). In practice, these two positions often vote the same way on methodology: "Use the variable, but don't reify it."
  *   **Pair:** **Leaf 6 (Local Constructionism)** and **Leaf 7 (Weak Cohort Realism)**.
  *   **Why:** If you believe the category survives being exported (Q6-B), you are effectively a Realist. If you believe it is constructed locally (Q6-A), you are a Constructionist. However, many "Weak Realists" admit categories are locally constructed but claim they *converge* globally. The tree forces a choice, but in the literature, these positions often bleed into one another under the banner of "Contextual Realism."

  **5. A Note on Interactive Kinds**
  *   The tree routes **Interactive Kind** theorists through **Q4-B**. However, note that **Leaf 7 (Weak Cohort Realism)** can *also* house Interactive Kind theorists if they believe the looping effect is robust enough to survive boundary shifts. The tree separates them based on whether you prioritize the *mechanism* (looping) or the *robustness* (portability). If you are an Interactive Kind theorist who thinks generations are fragile and local, you land in **Leaf 6**. If you think the looping effect is strong enough to travel, you land in **Leaf 7**.
