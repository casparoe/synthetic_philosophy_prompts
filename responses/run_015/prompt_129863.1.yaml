answer: |-
  Here's the session plan.

  **1. Dependency Order: Everyday Circularity First**
  Start with the circular reasoning in everyday life (the machine), *then* scale it up to radical skepticism. If you start with skepticism (e.g., "how do you know you're not dreaming?"), they'll treat it like a parlor game. If you start with a broken logical structure in a concrete example, the "wrongness" feels objective. Once they feel the structural flaw in the machine, you show them that human perception has the exact same structure.

  **2. The Lie Detector Example**
  *   **The Setup:** You have a black box that prints out statements about the room (e.g., "The lamp is on"). You want to know if the box is reliable.
  *   **What it needs:** You must be forced to accept the box's output as true *before* you check the world. You read "The lamp is on," you look, the lamp is on, you conclude "The box was right." You repeat this 100 times and conclude "The box is reliable."
  *   **What it must lack:** It cannot have an external calibration stamp or a manual. Crucially, you cannot have *any* independent reason to trust the box at the start. If you say "I trust it because it looks high-tech," you've smuggled in prior justification.
  *   **Avoiding "Trust your gut":** Make sure the example emphasizes that the *only* evidence you have about the lamp's state comes from looking at the lamp *after* reading the slip. The circularity is: You use the box to tell you what to check, then use the check to validate the box. To stop them from saying "just trust your gut," insist that the goal is *proof*, not belief. The gut doesn't prove reliability; only data does. But the data is tainted.

  **3. Handling Misconceptions (Specific Timing)**
  *   **"Bootstrapping = Stubbornness":** Head this off **immediately after you introduce the word "bootstrapping."** As soon as you say it, add: "And I don't mean being stubborn or pulling yourself up by sheer will. I mean the structural impossibility of lifting yourself off the ground by your own shoelaces." Do this before you move to the philosophical implications.
  *   **"Easy Knowledge = Simple/Obvious":** Head this off **right before you introduce the term 'Easy Knowledge' as a philosophical concept.** Say: "Philosophers call this 'Easy Knowledge,' but don't let the name trick you. It doesn't mean facts that are simple. It means knowledge that was gained too cheaply—like getting a driver's license without ever taking the test."

  **4. The End Question**
  Don't ask them to define the terms. Ask them to apply the structure to a new case to prove they see the loop.
  *   **Question:** "If I use my memory to verify that my memory is accurate, why doesn't collecting 1,000 successful memories increase the statistical probability that my memory is working?"
  *   **What you're listening for:** They need to say something like, "Because you're assuming your memory is accurate to recall those 1,000 successes in the first place." If they say "because memory is fuzzy," they missed the point.

  **5. What We're Leaving Out**
  Tell them openly: "We're skipping the heavy machinery of Reliabilism and the specific debates between Cohen and Vogel about closure principles. We're just looking at the structural skeleton, not the full academic meat."

  **6. Tone Check**
  Keep it conversational. If you stumble on a word, keep going. They read blogs, so they know the vibe, but they don't need the jargon dump.

  Backbone: Ground the logic in a broken machine first, then scale it up to human perception.
