          *   **Mask:** The disposition is present, $S$ occurs, but an external factor prevents $M$. The disposition remains intrinsic. (e.g., Fragile glass wrapped in foam).
          *   **Fink:** The disposition is present, but $S$ causes the disposition to be lost *before* $M$ can occur. (e.g., Fragile glass touched by a wizard who makes it non-fragile instantly upon striking).
      *   *User's Draft:*
