      *   *Better Fink Example for Psychology:* Test anxiety. The stimulus (the test) causes the disposition (knowledge recall) to vanish. Or, a child who can focus *until* told they are being observed (Hawthorne effect/evaluation pressure), at which point the pressure destroys the focus.

