answer: |-
  The episode in brief
  Leaded gasoline hit the market in the 1920s, sold by GM and Standard Oil as Ethyl Corp. It stopped engine knock and boosted profits, but workers started dying immediately. Decades later, geochemist Clair Patterson proved lead contamination was global, not natural. Despite industry pushback and claims of safety, the EPA slowly phased it out between the 70s and 90s. The stake wasn't just clean air; it was collective IQ, violence rates, and children's neurological development versus corporate convenience and cost.

  The theory applied
  In the torture-vs-dust-specks framework, the industry's argument maps neatly to the dust specks. They claimed the exposure for any single person was negligible—a microscopic risk spread across millions to save everyone money on fuel and transportation. Under strict utilitarian aggregation, if the economic benefit outweighs the sum of tiny harms, the policy is justified. The framework asks us to sum the specks: does the total inconvenience of switching to unleaded fuel outweigh the total health loss from low-level exposure? But this logic assumes the harm is truly minor for everyone. Patterson's data suggested the "dust specks" weren't harmless background noise. For vulnerable populations, the accumulation wasn't microscopic; it was catastrophic. The policy decision effectively asked: is it permissible to distribute a low-level toxin everywhere to avoid economic friction? The framework forces us to weigh the aggregated inconvenience against aggregated health loss, but it struggles when the "dust specks" aren't equal.

  Where the mapping breaks
  Here's where your twist breaks the model. The harm wasn't a uniform mist; it was a concentrated beam. Kids living near highways or refineries didn't get a dust speck; they got the torture. Their blood lead levels spiked enough to cause permanent cognitive damage, seizures, or death. The thought experiment assumes a flat distribution of harm, but lead followed structural lines of poverty and race. Furthermore, the theory is silent on deception. Ethyl Corp knew the risks and hid them. The dust-speck logic assumes honest accounting of harm, but when one side lies about the intensity of the speck, the calculus collapses. You can't aggregate what you refuse to measure.

  What the episode shows back
  This episode suggests that "dust speck" language is often a camouflage for structural violence. By framing the harm as universal and tiny, regulators could ignore the peaks where the harm became torture. It doesn't necessarily prove aggregating tiny harms is wrong; rather, it proves that averaging harms is dangerous. When you treat exposure as a statistical average, you erase the victims at the tail end of the distribution. The lead saga shows that we should be skeptical of policies justified by diffuse benefits and diffuse risks, because the risks often concentrate while the benefits accumulate elsewhere. The "dust speck" argument hides the bodies.

  Bottom line
  The theory misleads if it treats harm as fluid and interchangeable. It illuminates only if we use it to hunt for the hidden torture victims within the aggregate. Don't average the suffering; find the peaks.
