  Structure it like this:
  - The episode in brief (~100 words): lay out the basic timeline, who the players were (Patterson, industry, regulators), and what's actually at stake.
  - The theory applied (~200 words): map the torture/dust-specks framework onto the policy. Who counts as the tortured party? Are the millions of exposed people the dust specks? How does the aggregation logic apply to a distributed chemical exposure?
