answer: |-
  This is a sophisticated plan for an undergraduate term paper. You have correctly identified the standard contemporary move against the Heterogeneity Problem: shifting from a **Sensory (Felt-Quality) Theory of Pleasure** to an **Attitudinal Theory of Pleasure**. This aligns your view with philosophers like Fred Feldman (*Pleasure and the Good Life*) and Chris Heathwood.

  However, because this is a well-trodden path in the literature, the objections are also well-developed. Below is the stress-test map you requested, followed by a strategic judgment on how to proceed.

  ---

  ### 1. The Case Literature: What Embarrasses the View?

  You need to distinguish between cases that attack the *definition* of pleasure and cases that attack the *link* between that definition and well-being.

  **Rank 1: Potentially Fatal (The "Mindless" and "Deep Absorption" Cases)**
  *   **The Case:** You are eating a familiar snack while deeply engrossed in a video game or conversation. You are not explicitly thinking, "I endorse this taste," nor do you have a conscious occurrent desire for it to continue. Yet, if asked, you'd say it was pleasant. Later, you realize you enjoyed it.
  *   **The Threat:** Your view requires a *pro-attitude*. If the attitude must be occurrent (conscious), you exclude "mindless pleasures." If the attitude is merely dispositional (you *would* have endorsed it if asked), the view becomes harder to distinguish from a mere disposition to behave.
  *   **Defense Strategy:** You must argue for **Dispositional Pro-Attitudes**. Pleasure is an experience one *would* desire to continue if prompted. This saves the view but adds complexity.

  **Rank 2: Seriously Awkward (The "Stoic/Martyr" Case)**
  *   **The Case:** A martyr feels physical pain but has a strong pro-attitude toward the experience because it signifies faithfulness to a cause. They are "pleased" to suffer.
  *   **The Threat:** Intuitively, we want to say they are experiencing *pain* that is *worth it*, not that the pain itself has turned into *pleasure*. If your view counts this as pleasure, it seems to stretch the concept of "pleasure" until it breaks.
  *   **Defense Strategy:** Bite the bullet. Distinguish **Sensory Pain** (phenomenology) from **Attitudinal Pleasure** (endorsement). Argue that for *well-being*, the attitude is what matters. This is Feldman's move. It is counter-intuitive but theoretically consistent.

  **Rank 3: Merely Awkward (Recalcitrant Emotions / Schadenfreude)**
  *   **The Case:** You feel a flash of joy at a rival's failure (Schadenfreude). Simultaneously, you judge this feeling as immoral and wish you didn't feel it.
  *   **The Threat:** Do you have a pro-attitude or not? You enjoy it (Level 1) but disapprove of it (Level 2).
  *   **Defense Strategy:** Specify the **Temporal and Hierarchical Scope**. The relevant pro-attitude is the *immediate* intrinsic desire for the experience to continue *while it is happening*, not the reflective judgment five minutes later.

  ### 2. Theoretical Landscape & Neuroscience

  **Does this collapse into Desire-Satisfactionism?**
  *   **The Risk:** Yes, it comes very close. If pleasure = "intrinsic desire for an experience to continue," this looks like **Local Desire Satisfactionism** (Heathwood's view).
  *   **Is it Fatal?** No. Global Desire Satisfactionism (getting what you want in life) is distinct from Hedonism (feeling good). Your view is a hybrid: Well-being is pleasure, but pleasure is defined by local desires.
  *   **The Concession:** You must admit this is a revisionary definition of hedonism. You are not defending Mill's or Bentham's original sensory hedonism; you are defending **Attitudinal Hedonism**.
  *   **Strategic Advice:** Do not try to hide this. Explicitly state: "I am defending Attitudinal Hedonism, which avoids the collapse into Global Desire Theory by restricting the relevant desires to *intrinsic attitudes toward present experience*."

  **The Neuroscience Objection (Common Valence)**
  *   **The Claim:** Neuroscience (e.g., Berridge & Kringelbach) suggests there *is* a common neural substrate for "liking" (valence) across different activities.
  *   **The Implication:** If a common felt quality exists empirically, does your philosophical argument become redundant?
  *   **Your Counter:** No. Even if there is a common neural "glow," the *Heterogeneity Problem* is conceptual. It asks, "What makes that glow good?"
      *   The **Felt-Quality Theorist** says: "The glow itself is the good."
      *   **You** say: "The glow is merely the signal of the pro-attitude; the *attitude* is the good."
      *   **Why this matters:** If the neural glow occurs without endorsement (e.g., via direct stimulation without understanding), does it benefit the subject? Your view can say "no" (or "less"), whereas the Felt-Quality view must say "yes." This preserves the utility of your view even if valence exists.

  ### 3. Unfalsifiability and Circularity

  **The Charge:** "Pleasure is what we have a pro-attitude toward. We know it's a pro-attitude because we have it toward pleasure."
  *   **Honest Assessment:** This is a genuine risk. If you define "pro-attitude" *only* by reference to pleasure, the view is empty.
  *   **The Fix:** You need an **independent criterion** for a pro-attitude.
      *   *Behavioral:* Disposition to sustain the experience.
      *   *Phenomenological:* A feeling of "rightness" or "welcome" (distinct from the sensory content).
      *   *Motivational:* An intrinsic desire for the experience to continue *for its own sake*.
  *   **Is it a Defect?** It is not a defect if you can cash out "pro-attitude" without using the word "pleasure." If you rely on the subject's avowal ("I say I like it"), you open yourself to errors about one's own well-being.
  *   **Recommendation:** Define pro-attitude functionally (e.g., "an intrinsic desire for the experience to continue"). This makes the view falsifiable: if someone has that desire but isn't pleased, or is pleased without that desire, you are in trouble.

  ### 4. Concessions vs. Dismissals

  **What a Committed Defender Concedes:**
  1.  **Revisionism:** You concede that "pleasure" in common language often refers to sensations (tingles, warmth), but argue that for *ethical theory*, the attitudinal definition is superior.
  2.  **The "Happy Slave" Problem:** You must concede that if a slave is manipulated to have pro-attitudes toward their servitude, your view counts them as having well-being. (This is a problem for all hedonism, but you should admit it rather than deny it).
  3.  **Complexity:** You concede that measuring "intensity of attitude" is harder than measuring "intensity of sensation."

  **What a Committed Defender Dismisses:**
  1.  **The "It's Just Semantics" Objection:** Critics say you are just changing the subject. Dismiss this by arguing that the *function* of pleasure in well-being theory is to mark what is good for the subject, and attitudes track goodness better than raw feels.
  2.  **The Heterogeneity Objection Itself:** Once you adopt the attitudinal view, the objection dissolves. Dismiss it as a problem only for *Sensory* Hedonism, which you have abandoned.

  ---

  ### Closing Judgment: Strategic Advice for the Paper

  **Should you defend this view?**
  **Yes.** It is the most robust contemporary defense of hedonism. However, given you have 10 pages and 2 weeks, you cannot defend it against *all* objections (e.g., Nozick's Experience Machine, the Paradox of Hedonism).

  **Recommended Strategy: "Defend with Qualifications"**
  Do not try to prove Attitudinal Hedonism is the *only* true theory of well-being. Instead, frame the paper as a specific solution to the Heterogeneity Problem.

  **Proposed Outline for 10 Pages:**
  1.  **Introduction (1 page):** State the Heterogeneity Problem (Sidgwick/Crisp). State your thesis: Hedonism survives if we define pleasure attitudinally, not phenomenologically.
  2.  **The Failure of Felt-Quality (2 pages):** Briefly explain why the sensory view fails (the "tingle" objection).
  3.  **The Pro-Attitude Solution (3 pages):** Define pleasure as an intrinsic desire for the experience to continue. Explain how this unifies eating, thinking, and listening without requiring a common sensation.
      *   *Crucial Qualification:* Distinguish this from Global Desire Satisfactionism (focus on *present experience*).
  4.  **Stress-Testing (3 pages):** Address the "Mindless Pleasure" and "Martyr" cases (from Section 1 above). Show how the dispositional account handles them. Acknowledge the circularity risk and solve it by defining attitudes motivationally.
  5.  **Conclusion (1 page):** Summarize. Conclude that while Attitudinal Hedonism faces other challenges (like the Experience Machine), the Heterogeneity Problem is not one of them.

  **Final Warning:**
  The biggest trap for you is **conflating Attitudinal Hedonism with Desire Satisfactionism**.
  *   **Desire Satisfactionism:** Well-being = Getting what you want (could be fame, truth, posthumous success).
  *   **Attitudinal Hedonism:** Well-being = Taking pleasure in experiences (where pleasure = wanting the experience to continue).
  *   **Make sure this distinction is crystal clear in your paper.** If you blur this, a sharp grader will claim you have abandoned hedonism entirely.

  If you can maintain that distinction, this is a solid, defensible B+/A- paper topic. If you find the distinction too difficult to maintain in drafting, pivot to arguing that the Heterogeneity Problem forces us to abandon *Sensory* Hedonism, leaving the viability of Hedonism *simpliciter* an open question. But I recommend sticking to the defense; it shows more philosophical courage.
