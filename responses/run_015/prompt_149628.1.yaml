answer: |-
  Hi there,

  You have put your finger on exactly the right distinction, and it is genuinely one of the most subtle and important splits in modern decision theory. The feeling you are having, that Version A feels like ordinary evidence while Version B feels like a trap or a logical bind, is the intuition that separates Evidential Decision Theory from Functional Decision Theory. The specific phenomenon you are looking for does have a name in the literature, though it is often gestured at more than defined with the precision you want. The term most commonly used is subjunctive dependence, sometimes also called logical correlation or algorithmic dependence. But since you asked for the meat of it rather than just the label, let me try to unpack what is actually happening in the machinery of these problems.

  The core difference you are sensing is whether the prediction is counterfactually sensitive to your decision algorithm. In Version A, the checkbox is a fossil. It is a static fact about the past that correlates with your behavior because both the checkbox and your behavior share a common cause, namely your psychological disposition at the time you filled out the form. If you were to magically decide differently today, the checkbox would not change, because the checkbox is causally downstream of your past self and causally upstream of your present self only via correlation. It is fixed evidence. In Version B, the predictor is not looking at a fossil; it is running a simulation or a model of your current decision process. This means the prediction is a logical output of the same function that you are currently executing. If you were the kind of agent who decided differently, the model would have output differently. The prediction depends on your decision procedure not because of a causal signal traveling backward in time, but because the prediction and your decision are two instances of the same logical truth.

  To give you a test for which side of the line a case falls on, you should ask the counterfactual question you already hinted at. If I were the sort of agent who makes decision X instead of decision Y, would the prediction have been different? In Version A, the answer is no. The checkbox was ticked based on who you were years ago, and while that correlates with who you are now, your current decision procedure does not logically determine the past checkbox. In Version B, the answer is yes. The predictor's output is a function of your decision algorithm. If your algorithm outputs pay, the predictor says pay. If your algorithm outputs don't pay, the predictor says don't pay. The prediction is subjunctively dependent on your choice because both are determined by the same underlying source code. This is why Version B creates that loop feeling. You are trying to decide, but your decision is logically linked to the evidence you are conditioning on. In Version A, you can condition on the evidence without your decision changing it. In Version B, conditioning on the evidence feels like deciding the evidence, because logically, you are.

  Now let us look at the edges you mentioned, because they are where the theory gets tested. Take the case of the group model retrained weekly on aggregate data. This falls into a gray area but leans toward Version A. Your individual decision has a negligible effect on the aggregate model. Unless you are a dictator or a unique outlier, changing your own decision algorithm does not change the model's output in any meaningful way. The correlation is statistical, not logical. The model predicts you because you are like the group, not because the model is running you. So this is mostly evidential. You should treat it like Version A, where the letter is just news, not a logical constraint.

  The case of the perfect simulation in a sealed envelope from last year is much clearer, and it falls squarely into Version B. This is the one that trips people up because of the temporal ordering. It feels like the past should be fixed. But in decision theory, logical truths are timeless. If the simulation was perfect, it shares your source code. It is not that your decision now changes the past envelope; it is that your decision now and the content of the envelope are both determined by the same logical fact. If you are the kind of person who pays, the envelope contains a prediction that you pay. If you are the kind who doesn't, it contains a prediction that you don't. The temporal seal does not break the logical link. This is why Timeless Decision Theory insists that time does not matter for logical dependence. The envelope is a logical twin of your current decision, not a causal ancestor.

  Regarding the costly public vow, this is actually the lever that Functional Decision Theory suggests you pull. If you can change which sort of person you are, even at a cost, you change the logical output of the predictor. In Version B, you want to be the sort of person who pays, because that sort of person gets the letter only if they have the condition, whereas the sort who doesn't pay gets the letter regardless. By committing to being a payer, you change the logical fact that the predictor latched onto. The cost of the vow is the price of changing your source code to a version that yields a better outcome in these subjunctively dependent scenarios. It confirms that the work is being done by the type of decider you are, not the specific action you take in the moment.

  Finally, this distinction explains why the coin flip case, often called Counterfactual Mugging, still bites. In that puzzle, a super-forecaster flips a coin. If it lands tails, they ask you for money. If it lands heads, they give you money, but only if they predicted you would have given the money in the tails branch. Here, the dependence is across counterfactual worlds rather than across time. Your decision algorithm is the same in both the heads world and the tails world. The predictor looks at your algorithm in the tails world to decide what to do in the heads world. Even though the money is already paid or not in the heads world, whether you got it depends on what your algorithm would do in the tails world. This is subjunctive dependence across possible worlds. If you are the sort of person who pays in the tails branch, you get the money in the heads branch. If you are the sort who refuses, you don't. Your current decision in the tails branch reveals which sort you are, and thus determines the payoff in the other branch. It feels weird because causally, nothing you do now changes the past coin flip or the past payout. But logically, your decision procedure is the common factor linking the two branches.

  So to summarize the phenomenon without the jargon, it is the difference between a prediction that is a static record of your past dispositions versus a prediction that is a logical consequence of your current decision procedure. The test is whether changing your decision procedure would change the prediction. If yes, you are in a subjunctively dependent scenario, and you should reason as though your decision determines the prediction. If no, you are in a standard evidential scenario, and you should treat the prediction as fixed news. The confusion usually arises because we are used to thinking of causation as flowing forward in time, but logical dependence flows through the structure of the computation itself, ignoring time and sometimes even ignoring which possible world is actual. I hope that helps untangle the knot you were stuck in, because you were absolutely right to feel that Version A and Version B are fundamentally different beasts despite looking similar on the surface.

  Best wishes
