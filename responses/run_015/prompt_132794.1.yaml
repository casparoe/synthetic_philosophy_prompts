  ***

  **DRAFT JOINT STATEMENT: ADVERSARIAL COLLABORATION ON RORTYAN NEOPRAGMATISM**
  **Participants:** "R" (Neopragmatist/Antirepresentationalist) & "C" (Critical Realist/Representationalist)
  **Status:** Preliminary Agreement on Disagreement

  ### I. Agreed Claims (Common Ground)

  1.  **On the Mirror Metaphor:** Both sides agree that Rorty's *Philosophy and the Mirror of Nature* targets a specific historical construction of "knowledge as accurate representation" rooted in 17th-century epistemology (Locke/Kant), not the trivial claim that humans sometimes use eyes to see. We agree the metaphor is used to critique the *privilege* of epistemology over culture, not to deny sensory input.
  2.  **On External Reality:** R does not deny the existence of a causal external reality (the "world is out there"). The disagreement is not ontological (does the world exist?) but semantic/normative (can the world *say* sentences?). Both agree that the world can cause us to hold beliefs, but only other humans can justify them.
  3.  **On Correspondence Stakes:** Both sides agree that the core stake in correspondence theories is **normative constraint**. C argues constraint requires a truth-relation independent of us; R argues constraint is provided by social peer pressure and causal friction, making a "truth-relation" redundant. We agree that if "correspondence" adds nothing to explanation besides "causal impact + social justification," it is idle.

  ### II. Disagreements Table

  | Feature | Rortyan Neopragmatist (R) Formulation | Representationalist Critic (C) Formulation |
  | :--- | :--- | :--- |
  | **Truth** | Truth is an indefinite ideal of justification within a vocabulary; it is a property of sentences, not of relations between sentences and non-sentential objects. | Truth is a substantive norm that exceeds justification; a belief can be fully justified yet false because it fails to match mind-independent structure. |
  | **Science** | Science is not "getting closer to reality" but acquiring better habits of action and more useful vocabularies for coping with causal friction. | Science is progressively approximating the causal structure of the world; success implies latching onto real kinds (naturalism). |
  | **Objectivity** | Objectivity is intersubjective agreement achieved through free encounter of views, not a "view from nowhere." | Objectivity requires anchoring beliefs to mind-independent facts to avoid collapsing into relativism or consensus theory. |

  ### III. Cruxes & Predictions

  Here we isolate the specific friction points where our views diverge on concrete cases, not just abstractions.

  **Crux 1: Metaphysical vs. Therapeutic**
  *   **Question:** Is the "made not found" claim a metaphysical thesis (anti-realism) or a therapeutic dissolution of the question?
  *   **Concrete Case:** **Putnam's Model-Theoretic Argument.** (The argument that reference is indeterminate without causal/social constraints).
  *   **R Prediction:** R will argue Putnam shows "reference" is useless metaphysics; we should drop the quest for a "true theory of reference" and just talk about utility. The claim is therapeutic.
  *   **C Prediction:** C will argue Putnam fails to kill realism; causal constraints *do* fix reference. Rorty's dismissal is secretly a metaphysical commitment to anti-realism disguised as therapy.
  *   **Test:** If R admits *any* constraint on vocabulary choice beyond "social utility," the therapeutic shield cracks.

  **Crux 2: Counterfactual Stability in Science**
  *   **Question:** Can antirepresentationalism handle modal claims about undiscovered entities?
  *   **Concrete Case:** **Quantum Spin.** If quantum mechanics had never been formulated (no human vocabulary for "spin"), would electrons still have spin?
  *   **R Prediction:** "Spin" is a tool in our current coping repertoire. Asking if it exists outside that vocabulary is a bad question. The causal power exists, but the *truth* about spin is made by the vocabulary.
  *   **C Prediction:** The causal structure existed prior to the vocabulary. Our theory tracks it. If we hadn't discovered it, the *truth* would still await discovery. Denying this makes science accidental.
  *   **Test:** Does R admit the counterfactual "Electrons would still behave thus-and-so" is true? If yes, C argues this is just realism renamed.

  **Crux 3: Hidden Causal Commitments**
  *   **Question:** Does Rorty's view rely on a causal story about belief-formation that it officially rejects as justificatory?
  *   **Concrete Case:** **Davidson's Anomalous Monism.** (Mental events are physical events, but mental vocabulary isn't reducible).
  *   **R Prediction:** We accept causal impacts (world hits us), but causation ≠ justification. The causal story explains *why we believe*, not *why we are right*. No conflict.
  *   **C Prediction:** You can't separate them cleanly. If the causal impact doesn't track truth probabilistically, justification is blind. Rorty relies on the world cooperating causally while denying it cooperates representationally.
  *   **Test:** If R admits the world "cooperates" enough to make our vocabularies stable, C argues this is a minimal correspondence relation.

  ### IV. Verbal vs. Substantive Separation

  We suspect some disagreement is verbal, specifically around the word "true."
  *   **Verbal:** C uses "true" to mean *mind-independent correctness*. R uses "true" to mean *commendatory status within a practice*. If we stipulate definitions, we might agree on all first-order claims (e.g., "slavery is wrong," "water is H2O").
  *   **Substantive:** The split remains on **normativity**. C insists we need a norm that transcends our current practices to critique them (e.g., our whole society could be justified but wrong). R insists critique always comes from within a broader vocabulary, never from "the world itself." This is not verbal; it's a split on the source of normative authority.

