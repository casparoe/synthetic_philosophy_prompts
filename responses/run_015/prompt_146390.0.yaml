      *   *Fix:* In the instructions, explicitly state that Receivers can reject *any* signal. If Signallers all signal High, Receivers might calculate "Probability of HQ is 50%, Expected Value is 0," and Reject. This leads to market collapse. I need to ensure students realize this is possible.

