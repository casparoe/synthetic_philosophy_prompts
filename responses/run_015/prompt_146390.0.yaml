answer: |-
  # Session Plan: The Economics of Truth (75 Minutes)

  ## 1. Logistics & Materials
  *   **Room:** Tables arranged for 10 pairs.
  *   **Students:** 20 (10 Signalers, 10 Receivers). *Note: Roles swap halfway.*
  *   **Materials:**
      *   1 Deck of playing cards (remove Jokers; 10 Red = "High Type", 10 Black = "Low Type").
      *   200 Poker chips or paper tokens (20 per student).
      *   10 "Burn Bowls" (for destroyed tokens).
      *   Scorecards (pre-printed, see below).
      *   Pens.
      *   Raffle Box + Prize (e.g., a nice book, chocolate, or "Homework Pass").
      *   "Task Coupons" (printed slips: *Good for one 5-minute transcription task*).
  *   **Stakes:**
      *   **Positive:** End of session, any student with >30 total tokens gets 1 Raffle Ticket.
      *   **Negative:** Any student ending with <10 total tokens must complete a 5-minute transcription task (copying a dense philosophical paragraph by hand) and hand it in next class.
      *   *Why:* Loss aversion makes the "Task" sting more than the "Ticket" tempts, driving engagement without monetary exchange.

  ## 2. The Payoff Structure (The "Math")
  *Print this on the Scorecard so students don't have to calculate from scratch.*

  **Signaler (You hold the Card)**
  *   **Endowment:** 15 Tokens per round.
  *   **If Rejected:** Keep Endowment (15).
  *   **If Accepted:** Endowment + 20 Bonus (35 Total).
  *   **Signal Cost:** You choose a Signal Level (0–10).
      *   **If Red Card (High):** Pay **1** Token per Level.
      *   **If Black Card (Black):** Pay **3** Tokens per Level.
      *   *Tokens are placed in the Burn Bowl (or given to Receiver in Phase 3).*

  **Receiver (You decide)**
  *   **Endowment:** 15 Tokens per round.
  *   **If Reject:** Keep Endowment (15).
  *   **If Accept Red (High):** Endowment + 20 Bonus (35 Total).
  *   **If Accept Black (Low):** Endowment - 20 Penalty (-5 Total).
  *   **Observation:** You see the Signal Level, *not* the Card.

  **The Logic:**
  *   **Low Type** gains 20 from Acceptance. Cost to signal Level 7 is $7 \times 3 = 21$. Net Loss. They prefer Rejection (15) over Acceptance with Signal 7 ($35 - 21 = 14$).
  *   **High Type** gains 20 from Acceptance. Cost to signal Level 7 is $7 \times 1 = 7$. Net Gain. They prefer Acceptance with Signal 7 ($35 - 7 = 28$) over Rejection (15).
  *   **Separation Threshold:** Signal Level 7 or higher.

  ## 3. Minute-by-Minute Timeline

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Distribute materials. Explain stakes (Raffle vs. Task). **Do not use the word "Handicap" or "Signal Theory."** Call them "Levels" and "Types." |
  | **05–15** | **Phase 1: Cheap Talk** | **Cost = 0 for everyone.** Signalers write a number 0–10 on index card. Receivers Accept/Reject. 3 Rounds. Reshuffle partners each round. |
  | **15–35** | **Phase 2: Costly Signaling** | **Costs apply (1x vs 3x).** Tokens go to **Burn Bowl**. 5 Rounds. Reshuffle partners every round. |
  | **35–50** | **Phase 3: The Transfer** | **Costs apply.** Tokens go to **Receiver's Stack** (not Burn Bowl). Receiver keeps tokens *before* deciding Accept/Reject. 3 Rounds. |
  | **50–55** | **Phase 4: The Tell** | **No Choice.** Red Cards *must* show 5 chips. Black Cards *must* show 0 chips. Receiver sees chips and Card color simultaneously. 2 Rounds. |
  | **55–60** | **Score Count** | Students tally total tokens. Collect Task Coupons/Raffle Tickets. |
  | **60–75** | **Debrief** | Map game moments to the three misconceptions and the wrinkles. Introduce "Handicap Principle" terminology now. |

  ## 4. Run Sheet & Instructions

  ### Phase 1: Cheap Talk (05–15)
  *   **Instruction:** "Signalers, write a number 0–10. It costs nothing. Receivers, decide Accept or Reject based *only* on the number."
  *   **Prediction:** Everyone writes "10". Receivers quickly realize the number means nothing. Acceptance rates drop to ~50% (random guessing).
  *   **Goal:** Establish that without differential cost, communication collapses into noise.

  ### Phase 2: Costly Signaling (15–35)
  *   **Instruction:** "Now, you must pay tokens equal to your number. Red cards pay 1 per number. Black cards pay 3 per number. Put tokens in the **Burn Bowl**."
  *   **Prediction:** Rounds 1–2 will be messy (some bluffing). By Round 4, Red cards should signal 7+, Black cards signal 0–2. Receivers accept High signals, reject Low.
  *   **Goal:** Discover the Separating Equilibrium.
  *   **Troubleshooting:** If everyone bluffs (all signal 7), intervene as the "Market": *"Receivers, half of these people are Black cards. If you accept all of them, your average score drops. You are allowed to Reject."* This forces the equilibrium shift.

  ### Phase 3: The Transfer (35–50)
  *   **Instruction:** "Same costs. But do **not** burn the tokens. Give them to your **Receiver**. The Receiver keeps these tokens regardless of whether they Accept or Reject you."
  *   **Prediction:** Separation holds (Red still signals 7+, Black still signals 0). Receivers are richer, but the *decision rule* remains the same.
  *   **Goal:** Prove waste is not the mechanism. The differential cost to the Signaler is what matters, not the social waste.

  ### Phase 4: The Tell (50–55)
  *   **Instruction:** "New Rule. You cannot choose your number. If you are Red, you *must* place 5 chips. If you are Black, you *must* place 0. Also, flip your card face up."
  *   **Prediction:** Instant coordination. No strategic thinking needed.
  *   **Goal:** Distinguish *Indexicality* (mechanical correlation) from *Signaling* (strategic cost).

  ## 5. Troubleshooting: What Will Go Wrong

  **1. "I don't care about the transcription task."**
  *   **Risk:** Some students are immune to the threat, reducing stakes.
  *   **Fix:** Make the task *public*. "You will read your transcription aloud to the seminar next week." Social embarrassment is a universal currency. Alternatively, offer a "Golden Ticket" (skip one future reading response) for high scores, making the opportunity cost of failure real.

  **2. "We made a deal across rounds." (Reputation Collusion)**
  *   **Risk:** Pairs agree "I'll accept you now, you accept me later," ignoring the signal costs.
  *   **Fix:** **Reshuffle partners every single round.** Collect the cards, shuffle the deck, redeal. Announce: "You will never see this partner again." This isolates the one-shot game logic.

  **3. "The math is too hard."**
  *   **Risk:** Students lose track of token counts and play randomly.
  *   **Fix:** The Scorecard must have a lookup table.
      *   *Signaler:* "If I signal 7, I pay __ tokens."
      *   *Receiver:* "If I Accept a Black card, I lose __ tokens."
      *   Provide a "Cheat Sheet" on the table: *Red Cost = 1x. Black Cost = 3x. Accept Bonus = 20.*

  **4. "Everyone bluffs and it works." (Pooling Equilibrium)**
  *   **Risk:** Receivers accept Signal 5 from everyone. Black cards profit. Red cards profit. No separation.
  *   **Fix:** This is actually a teaching moment, but if it persists, change the Receiver's payoff verbally for the last round: *"Receivers, for this round only, accepting a Black card costs you 40 tokens."* This spikes the risk, forcing Receivers to demand higher signals, which pushes Black cards out of the market.

  ## 6. The Debrief (60–75 Minutes)

  *Do not lecture. Ask questions and map their answers to the theory.*

  **Mapping Mistake 1: Cost $\neq$ Truth**
  *   **Ask:** "In Phase 1, why didn't anyone believe the '10' signal?"
  *   **Point:** Cost alone doesn't create truth.
  *   **Ask:** "In Phase 2, why did the Black cards stop signaling '7'?"
  *   **Point:** It wasn't that '7' was expensive; it was that '7' was *more expensive for them than for the Red cards* relative to the reward. This is the **Single Crossing Property**.

  **Mapping Mistake 2: Waste $\neq$ Essence**
  *   **Ask:** "In Phase 3, the tokens weren't destroyed. Did the Black cards start lying again?"
  *   **Point:** No. Honesty survived without waste.
  *   **Theory:** The "Handicap" is misleadingly named. It's not about being handicapped (wasteful); it's about the *marginal cost* differing by type. The waste is a byproduct, not the engine.

  **Mapping Mistake 3: Guaranteed Honesty**
  *   **Ask:** "Could you have all agreed to signal '0' and I would still accept?"
  *   **Point:** If the prior probability of Red is high enough, a Pooling Equilibrium works. Costly signaling is just *one* way to get honesty.
  *   **Ask:** "What if I, as a Black card, decided I didn't care about tokens and signaled '10' anyway?"
  *   **Point:** The system relies on rational self-interest. If types vary in their valuation of the currency (tokens), the signal breaks. (Connects to biological "condition-dependence").

  **Mapping the Wrinkles**
  *   **Transfer:** "Why did honesty survive when the Receiver got the tokens?"
      *   **Answer:** Because the Signaler's *incentive* didn't change, only the social surplus.
  *   **The Tell:** "Was Phase 4 costly signaling?"
      *   **Answer:** No. That was an **Index**. The link was physical/causal, not strategic. Costly signaling explains why we trust things that *could* be faked but aren't.

  **Introduce Terminology:** Now write "Handicap Principle" and "Costly Signaling Theory" (Zahavi, Grafen) on the board.

  ## 7. Limitations: What This Game Cannot Reproduce

  *Be explicit about these in the final 5 minutes.*

  1.  **Rationality vs. Selection:** In this game, you *reasoned* out the equilibrium. In biology, no peacock calculates costs. Honesty emerges because liars died out over generations. The game is a *functional* model, not a *mechanistic* one.
  2.  **Perfect vs. Noisy Separation:** In the game, you likely found a clean cutoff (Signal 7). In nature, distributions overlap. There are sick peacocks with good tails and healthy ones with bad tails. The game implies perfect information; biology deals with probabilities.
  3.  **Common Knowledge:** You all knew the payoff table. In reality, organisms have to *learn* the cost structure through trial and error (evolutionary time), not rule sheets (classroom time).
  4.  **The "Guarantee" Illusion:** The game makes it look like once the cost is set, honesty is stable. In reality, if the environment changes (food becomes scarce), the cost of the tail changes, and the equilibrium can collapse instantly. The game is static; evolution is dynamic.

  ## 8. Instructor's Cheat Sheet (Payoff Verification)

  *Keep this on your desk to check student scores.*

  **Signaler (Red/High)**
  *   Signal 7 Cost: 7 tokens.
  *   Acceptance Payoff: 35 - 7 = **28**.
  *   Rejection Payoff: **15**.
  *   *Incentive: Signal High.*

  **Signaler (Black/Low)**
  *   Signal 7 Cost: 21 tokens.
  *   Acceptance Payoff: 35 - 21 = **14**.
  *   Rejection Payoff: **15**.
  *   *Incentive: Signal Low.*

  **Receiver**
  *   Accept Red: 15 + 20 = **35**.
  *   Accept Black: 15 - 20 = **-5**.
  *   Reject: **15**.
  *   *Incentive: Accept only if P(Red | Signal) is high.*

  **Transfer Variant Check**
  *   Signaler pays 7. Receiver gets 7.
  *   Receiver Total before decision: 15 + 7 = 22.
  *   If Accept Red: 22 + 20 = 42.
  *   If Accept Black: 22 - 20 = 2.
  *   If Reject: 22 (Keep the transfer).
  *   *Note:* In Transfer, Receiver might Reject *more* because they already got paid by the signal. This is a nuance to watch for. If Receivers Reject High Signals just to keep the transfer + endowment, the Signaler's incentive collapses.
  *   *Correction for Run:* To prevent Receivers from Rejecting just to keep the transfer, rule that **Transfer is only kept if Acceptance occurs.** OR, simpler: **Transfer is added to the pot, but the Accept/Reject decision determines the Bonus/Penalty.**
  *   *Revised Transfer Rule for Stability:* Signaler pays $S$. Receiver gets $S$. Receiver *must* decide Accept/Reject. If Reject, Receiver returns the $S$ to the bank. This ensures the Receiver still cares about the Type.
  *   *Wait, simpler:* Just say "Receiver keeps the tokens regardless." If they Reject, they have $15+S$. If they Accept Red, they have $15+S+20$. If they Accept Black, they have $15+S-20$. The *difference* between Accept Red and Accept Black is still 40. The decision logic holds. The only risk is if $15+S > 15+S+20-20$ (which is equal).
  *   *Actually, the cleanest Transfer:* Signaler pays $S$ to Receiver. Receiver decides. If Reject, Receiver keeps $S$. If Accept, Receiver keeps $S$ + Bonus/Penalty.
      *   Reject Red: $15+S$. Accept Red: $35+S$. (Still prefer Accept).
      *   Reject Black: $15+S$. Accept Black: $-5+S$. (Still prefer Reject).
      *   *Logic holds.* Proceed with this.
