answer: |-
  # Session Plan: Engineering Intuition
  **Duration:** 90 Minutes
  **Audience:** Rationalist-curious non-specialists
  **Objective:** To equip participants with the ability to identify and dissect 'intuition pumps'—narrative devices that structure attention to bypass rigorous argumentation.

  ## 1. Dependency-Ordered Sequence
  *The following concepts must be introduced in this specific order to ensure cognitive scaffolding holds.*

  1.  **Distinction between Argument and Narrative.**
      *   *Why first:* Participants accustomed to rationalist discourse often treat all inputs as probabilistic evidence. They must first recognise that a story is not a premise set. Without this, they will attempt to Bayesian update on the narrative itself rather than analysing its structure.
  2.  **The 'Leap' of Inference.**
      *   *Why second:* Once the narrative is separated from formal argument, participants must identify the specific moment where the story asks them to accept a conclusion without explicit justification. This isolates the 'pump' mechanism from the 'cargo' (the conclusion).
  3.  **The Role of Framing in Attention.**
      *   *Why third:* Having identified the leap, participants must understand *how* the narrative forces them to take it. This shifts the focus from 'is this true?' to 'why do I feel this is true?'.
  4.  **The Meta-Function of the Pump.**
      *   *Why last:* Only after analysing the machinery can they understand the purpose: persuasion via cognitive architecture rather than logical validity. This culminates in the ability to repurpose or defuse the pump.

  ## 2. The Carrying Example: 'The Mediated Substitute'
  *Do not use the Chinese Room, Trolley Problem, Mary's Room, or Ship of Theseus.*

  **The Scenario:**
  A subject undergoes a medical procedure where their biological neurons are gradually replaced by silicon micro-chips. These chips are functionally identical in input-output behaviour but ontologically distinct (no carbon, no biology). Crucially, an **'Interpreter Module'** is installed between the brain's processing centre and the speech motor cortex. This module monitors the internal state—whether biological or silicon—and ensures that all verbal reports remain consistent with the subject's original linguistic patterns. If the silicon state would theoretically produce a different report (e.g., 'I see grey' instead of 'I see red'), the Interpreter overrides it to match the expected biological output ('I see red'). The subject, when asked, insists their experience remains unchanged throughout the process.

  **Why this example carries the lesson:**
  1.  **Isolates the Epistemic/Metaphysical Slide:** The Interpreter Module ensures that *knowledge* of the internal state is impossible for the observer (epistemic opacity). The pump relies on the audience sliding from "We cannot tell the difference" to "There is no difference" (metaphysical identity).
  2.  **Highlights the Framing:** The narrative focus is on the *report* ("I see red"), not the *state*. This channels pre-theoretical conviction about the reliability of testimony.
  3.  **Rationalist Resonance:** It mirrors issues in AI alignment and substrate independence, engaging the audience's existing mental models without requiring philosophy training.

  **The Missing Feature:**
  The scenario must lack a **clean resolution**. Do not reveal whether consciousness actually fades or remains. If the session provides a 'correct answer' (e.g., "Consciousness definitely fades"), the audience will treat it as a puzzle to be solved rather than a rhetorical device to be analysed. The discomfort of the unresolved outcome is necessary to reveal the pump's persuasive force.

  ## 3. Misconception Map & Interception Strategy
  *Misconceptions will arise naturally as the narrative unfolds. Intercept them at the following points.*

  | Misconception | Order of Arrival | Interception Point | Interception Method |
  | :--- | :--- | :--- | :--- |
  | **Intuitive Pull = Logical Validity**<br>("The story makes sense, so the conclusion follows.") | **Early.** During the initial walkthrough of the scenario. | **Immediately after the first poll.** Ask: "Does the story feel coherent?" Then ask: "Does coherence guarantee the conclusion is true?" | **The 'Alien Translator' Test.** Ask: "If an alien told this story about humans, would you accept their conclusion about our souls?" This decouples narrative flow from logical necessity. |
  | **Conviction = Evidence**<br>("I feel strongly that consciousness remains/fades, so that is data.") | **Middle.** During the discussion of the 'Leap'. | **When participants justify their stance.** When someone says, "It's obvious that...", interrupt. | **The 'Variable Swap'.** Ask: "If we changed the Interpreter to be a human homunculus instead of a chip, would your conviction change?" If yes, the evidence is in the framing, not the logic. |
  | **Identifying the Premise Dissolves the Pump**<br>("Now that we see the hidden assumption, the argument is dead.") | **Late.** During the deconstruction phase. | **During the final synthesis.** When participants claim to have 'debunked' the scenario. | **The 'Resilience Check'.** Explain: "Knowing how a magic trick works doesn't stop your eyes from seeing it. Identifying the pump explains *why* you were persuaded, it doesn't necessarily make the intuition vanish. The machinery remains effective even when exposed." |

  ## 4. Check-for-Understanding
  *Do not ask for a definition. Ask for manipulation of the mechanism.*

  **Question:**
  "If you wanted to use this exact same scenario to convince a audience of the *opposite* conclusion (e.g., that consciousness *must* fade), which single descriptive detail regarding the **Interpreter Module** would you alter, and how would that shift the audience's attention?"

  **Success Criteria:**
  *   **Fail:** The participant argues about whether consciousness actually fades (missing the meta-level).
  *   **Fail:** The participant suggests changing the neurons to something else (missing the framing constraint).
  *   **Pass:** The participant identifies that changing the Interpreter from a 'neutral mediator' to an 'active deceiver' (or vice versa) alters the trust in the report, thereby shifting the intuition without changing the underlying metaphysics. This demonstrates understanding that the pump works by structuring attention, not supplying premises.

  ## 5. Explicit Omissions & Credibility Management
  *To maintain focus within ninety minutes, the following must be excluded.*

  **Omissions:**
  1.  **Formal Modal Semantics:** Do not discuss possible worlds, Kripkean rigidity, or accessibility relations.
  2.  **Dennett's Full Taxonomy:** Do not detail the specific types of pumps (e.g., 'lasers', 'bad pumps', 'stoppers').
  3.  **Historical Lineage:** Do not trace the argument back to Descartes, Locke, or specific debates in the 1980s philosophy of mind.

  **Acknowledgement Strategy:**
  To avoid undermining credibility, frame these omissions as **scope management for tool acquisition**.
  *   *Script:* "You may encounter formal modal logic or detailed historical taxonomies in further reading. Today, we are treating those as advanced specialisations. Our goal is not to master the history of the debate, but to acquire the diagnostic tool itself. We are learning to use the caliper, not to catalogue every object ever measured."
  *   *Rationale:* This validates the omitted content as legitimate (preserving credibility) while firmly positioning the session's goal as practical skill acquisition (maintaining focus).

  ---
  *Note to Facilitator: Ensure all handouts and slides use British English spelling (e.g., 'programme', 'analyse', 'behaviour'). Maintain a neutral tone; the goal is not to debunk consciousness debates, but to reveal the rhetorical machinery used within them.*
