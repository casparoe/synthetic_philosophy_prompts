answer: |-
  Here's a draft script for the interview. I've kept the tone sharp and conversational—think less "academic colloquium" and more "deep-dive podcast where we actually try to break the theory." Each question has a "Likely Reply" and a "Follow-Up" so you can pivot instantly if she goes standard teleosemantic defense mode.

  ### 1. The Motivation for the Swap
  **Q:** Let's jump straight into the machinery. Standard Millikan-style teleosemantics leans hard on "normal conditions" to handle noise and error. You're swapping that for control-theoretic setpoints. Be honest: is this just a terminological shift, or does positing a setpoint actually do work that statistical normality couldn't? What's the specific failure case you're fixing?

  *   **Likely Reply:** She'll say normal conditions are too vague or statistical, whereas setpoints define a specific target state for the system to maintain.
  *   **Follow-Up:** "Okay, but where does the precision come from? If the setpoint is just 'whatever state evolution stabilized,' aren't we back to statistics? If it's more precise than that, what fixes the value without appealing to the very content you're trying to explain?"

  ### 2. The Frog and the BB (Misrepresentation)
  **Q:** Let's hit the classic disjunction problem. A frog snaps at a black BB. On your view, the system is deviating from its setpoint. But here's the worry: how do you identify the setpoint *without* already knowing what the frog is *trying* to represent? If you say the setpoint is 'fly,' you've smuggled in the content. If you say the setpoint is 'small moving dot,' you haven't solved the disjunction. How do you pick out the setpoint neutrally?

  *   **Likely Reply:** She'll argue the setpoint is defined by the consumer system (the downstream neural mechanisms) that uses the signal, not the producer.
  *   **Follow-Up:** "But the consumer only knows how to process the signal based on its own wiring. If that wiring was selected for 'dots' but happens to catch 'flies,' how does the control loop distinguish between a system malfunctioning and a system functioning correctly in a weird environment? You need a fact of the matter about what the setpoint *is* prior to the error."

  ### 3. Normativity vs. Engineering Specs
  **Q:** This is the big metaphysical worry. Control theory is full of norms—error, deviation, stability. But in engineering, those norms come from a designer's intent. In your naturalized view, evolution is the 'engineer.' But evolution is blind. Are you really naturalizing normativity here, or just relocating it into metaphorical engineering specs? Where does the 'ought' come from if there's no one to write the spec sheet?

  *   **Likely Reply:** She'll say the 'ought' is hypothetical: *if* the system is to survive/reproduce, it *ought* to be in this state. It's conditional normativity.
  *   **Follow-Up:** "That sounds like a conditional *causal* claim, not a normative one. A rock falling obeys gravity, but we don't say it 'ought' to fall. What adds the normative grip that makes a false representation a *mistake* rather than just a different causal outcome?"

  ### 4. Evolution vs. Individual Learning (Cultural Concepts)
  **Q:** Your account anchors content in evolutionary history—proper functions selected over generations. But humans think about things that didn't exist during our evolutionary history: bitcoin, quantum mechanics, gluten-free diets. These are culturally acquired. Does your view imply we can't literally have thoughts about these things, or do you have a story for how individual learning piggybacks on evolutionary setpoints without breaking the history requirement?

  *   **Likely Reply:** She'll likely say learning mechanisms themselves are evolved, and new concepts are recombinant uses of old setpoints.
  *   **Follow-Up:** "Recombination gets you 'gold mountain,' but does it get you 'quantum superposition'? If the setpoints are fixed by ancestral environments, how do you get the content to stretch that far without severing the link to the original proper function? At what point does the piggybacking become free-floating?"

  ### 5. Circularity in Control Theory
  **Q:** Control systems minimize error signals. But an error signal is just a difference between current state and setpoint. For that to be semantic content, the system has to 'know' the setpoint represents something about the world. Doesn't invoking a control loop presuppose the very intentionality you're trying to derive? You need content to have error correction, but you're using error correction to get content.

  *   **Likely Reply:** She'll deny the presupposition, arguing that negative feedback loops are purely physical and exist in thermostats.
  *   **Follow-Up:** "Thermostats have feedback, but we don't attribute beliefs to them. What's the threshold? If it's just complexity, you're a gradualist. If it's something else, is that 'something else' just hidden intentionality?"

  ### 6. Observer Relativity (Follow-up to Q5)
  **Q:** Following up on that: I can describe a rock as a control system maintaining its position relative to the ground. Is content observer-relative on your view? If I can impose a setpoint description on anything, does everything have content, or is there a fact of the matter about which systems are *really* control systems?

  *   **Likely Reply:** She'll say only systems with a specific causal history (evolutionary selection) count as real control systems.
  *   **Follow-Up:** "So history is doing all the heavy lifting, not the control theory? Then why do we need the control machinery at all? Why not just stick with pure etiological teleosemantics?"

  ### 7. Granularity and Vagueness
  **Q:** Control setpoints seem precise—like a temperature setting. Mental content is often vague or context-dependent. I can think about a 'chair' without a specific setpoint for chair-ness. How does your account handle the fuzziness of concepts? Do you have infinite setpoints, or is the content actually more precise than our phenomenology suggests?

  *   **Likely Reply:** She might argue the setpoints are high-dimensional vectors, not single values, allowing for flexibility.
  *   **Follow-Up:** "If they're high-dimensional vectors, how do we ever know when two people share the same content? If my 'chair' vector overlaps 80% with yours, do we have the same belief? It risks making content indeterminate again."

  ### 8. The Swampman Objection
  **Q:** Imagine a Swampman duplicate pops into existence without evolutionary history, but with identical physical structure and control dynamics. On a pure Millikan view, he has no content. On your view, since the control machinery is intact, does he have content? If yes, you've abandoned the history requirement. If no, why does the control machinery fail to fix content without the history?

  *   **Likely Reply:** She'll probably stick to history: no history, no proper function, no content.
  *   **Follow-Up:** "But the control dynamics are identical. If the setpoint machinery is working perfectly in real-time, why does a fact about the past determine whether his current state is a misrepresentation? It makes content extrinsic in a way that seems disconnected from current cognitive function."

  ### 9. Imperative vs. Indicative Content
  **Q:** Millikan distinguished between pushmi-pullyu representations that are both descriptive and imperative (like a bee dance). Control theory is inherently goal-directed—it's about moving *toward* a state. Does your account collapse all mental content into imperatives? How do you get purely descriptive beliefs (like 'it is raining') out of a system designed to minimize error relative to a goal?

  *   **Likely Reply:** She'll say descriptive content arises when the setpoint is to match the world (mind-to-world direction of fit).
  *   **Follow-Up:** "But 'matching the world' is itself a goal. How does the system distinguish between 'make the world match this signal' (action) and 'make this signal match the world' (belief) without already having a distinction between belief and desire?"

  ### 10. The Payoff
  **Q:** Last one. Suppose you succeed. You've naturalized content using control setpoints. What does this buy us that predictive processing or pure causal theories don't? Is there a specific puzzle in cognitive science or philosophy of mind that dissolves once we accept this modified teleosemantic view, or is it mostly about shoring up the foundations?

  *   **Likely Reply:** She'll argue it solves the disjunction problem while keeping naturalism, unlike causal theories.
  *   **Follow-Up:** "If the disjunction problem is the only win, is it worth the complexity of adding control theory to evolutionary history? Or are we just adding epicycles to save the teleosemantic planet?"
