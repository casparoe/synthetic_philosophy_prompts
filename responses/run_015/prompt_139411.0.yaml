answer: |-
  I would reject step (3).

  This step looks sound because it faithfully captures Rousseau's worry that theatrical pity is 'exhausted' in the moment of feeling, leaving no residue for action. It seems plausible to locate this exhaustion in the object's status: because the suffering on stage is fictional, complete, and distant, there is literally nothing for the spectator to do. However, this reconstruction misidentifies the corrupting mechanism as the *particularity* or *completeness* of the object, rather than the *isolation* of the spectator from it.

  For Rousseau, the vice of the theatre is not that its objects are particular, but that the spectator encounters them in a state of social alienation. In the darkened auditorium, citizens are atomised; their sentiment is private, passive, and unreciprocated. By contrast, the festival's objects (the veteran, the bride) are indeed particular, but they are *present*. The sentiment aroused is not a discharge of pity for a distant other, but an active recognition of a civic bond that obligates the viewer. The emotion is not 'spent'; it is reinforced through mutual visibility. Rejecting (3) saves the argument because it allows you to maintain that festivals are good (4) without contradicting the claim that theatre is bad (2), since the distinguishing factor is presence and reciprocity, not particularity.

  Your supervisor's distinction between sentiments we 'consume' and those we 'contribute' captures the active/passive dynamic correctly but risks reducing the issue to an economic metaphor. It is the same point Rousseau makes, but under a description that obscures the ontological requirement of *presence*. Rousseau insists that for sentiment to be civic, the citizens must see one another directly. 'Contributing' sentiment implies joining a collective act, which is impossible if the medium separates the viewer from the viewed. The supervisor's formulation is better than your reconstruction, but it requires the grounding of physical co-presence to fully answer your worry about the particularity of the festival's objects.

  Rejecting (3) costs you nothing elsewhere in Rousseau; indeed, it clarifies his harder positions. Consider the actor's profession: Rousseau condemns it not merely because it is fictional, but because the actor lives in a state of perpetual alienation, representing others rather than being themselves. This aligns with the critique of isolation, not merely particularity. Similarly, his attack on comedy rests on the claim that it habituates citizens to mock virtue in private safety, weakening public mores. If the danger is isolation, the attack holds firm; if the danger were merely particularity, comedy might be defensible as instructive. Finally, the case for censorship and the general will depends on the preservation of *moeurs* (customs) that bind the community. If the threat to the general will is the atomisation of citizens via passive amusement, censorship is justified to protect the conditions of civic presence. Your reconstruction threatened to make Rousseau oppose all particular attachments (like love), which would undermine the very social bonds the general will protects. Correcting (3) to focus on isolation preserves the necessity of private virtues while condemning those that withdraw us from the public sphere.

  As a test of this diagnosis, a national ceremony watched by millions on screens is, on this account, theatre, not a festival. Although it may elicit sentiments of belonging, the spectators are isolated in private spaces, unable to see or be seen by their fellow citizens. The mutual visibility that transforms sentiment into civic bond is absent; the image is mediated, and the participation is passive. The sentiment is consumed rather than contributed because there is no reciprocal acknowledgment of duty between the viewers. It lacks the 'open-air' quality Rousseau demands, not for aesthetic reasons, but because the physical gathering is the only guarantee that the sentiment aroused will carry over into action among neighbours rather than dissipating in private solitude. Thus, the screen ceremony suffers the exact defect you identified in (2): the discharge takes the place of action, because the social link required to convert emotion into obligation has been severed by the medium.
