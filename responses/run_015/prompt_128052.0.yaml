answer: |-
  **Project Title:** The Failure Mode Test: Restoring Instrumentalist Entitlement in Opaque Systems

  **Research Question**
  Does shifting the criterion for intentional attribution from comparative predictive success to the prediction of belief-specific failure modes restore instrumentalist entitlement in cases where the design stance is computationally intractable?

  **Project Summary and Philosophical Context**
  Daniel Dennett's instrumentalism justifies attributing beliefs and desires to a system on the condition that the intentional stance yields predictive power unavailable via the cheaper design or physical stances. This justification presupposes a viable comparison: the attributor must be able to verify that the cheaper stances are insufficient. In the context of frontier language models, this comparison is impossible; the design stance is computationally intractable for systems with hundreds of billions of parameters. Consequently, we attribute beliefs by default rather than by comparative verification, which, on strict instrumentalist terms, voids our entitlement. However, eliminativist responses ("stop attributing") ignore the pragmatic utility of these attributions, while realist responses ("the beliefs are real") bypass the epistemic problem of how we access them in opaque systems. All three standard positions leave open the possibility that the *condition* for entitlement is misidentified. This project proposes that the relevant test is not predicting success (which opaque systems achieve) but predicting failure. A system possessing genuine beliefs should fail in "belief-shaped" ways (e.g., acting on false premises consistently), whereas a lookup table or heuristic bag should fail in ways inconsistent with belief attribution. By shifting the locus of verification from success to failure, we may recover instrumentalist entitlement without requiring full design-stance tractability.

  **Methodology and Work Plan**
  This project employs an experimental philosophy approach, utilizing tractable artificial agents to test the correlation between architectural transparency and failure modes. The work is divided into three phases over nine months.

  *Months 1–2: Framework and Testbed Selection*
  I will finalize the taxonomy of "belief-shaped" failures versus "heuristic" failures based on existing literature in philosophy of mind and ML interpretability. I will select three testbeds where the design stance is fully tractable: (1) tabular reinforcement learning agents in grid worlds, (2) minimax chess engines with adjustable evaluation functions, and (3) symbolic planners with known knowledge bases. These systems allow me to know definitively whether the system operates via belief-like internal states or simple mapping.

  *Months 3–5: Induction and Observation*
  I will subject these systems to adversarial inputs designed to induce failure. For each system, I will record the trajectory of error. For example, does a chess engine blunder because it "believes" a square is safe (consistent with a false belief) or because it hit a depth limit (structural failure)? I will log whether an intentional stance predictor could have anticipated the specific error better than a structural predictor.

  *Months 6–7: Analysis and Validation*
  I will analyze the failure logs to determine if there is a statistically significant cluster of failures unique to the agents modeled as having beliefs. The key metric is whether the intentional stance offers predictive leverage over the design stance *specifically in the domain of error*. If intentional attribution predicts the *type* of failure better than structural analysis, even when structural analysis is available, this supports the hypothesis.

  *Months 8–9: Synthesis and Writing*
  I will draft the dissertation chapter, arguing that if the failure-mode test holds in tractable systems, it licenses intentional attribution in opaque systems by analogy. The final output will be a 40–50 page philosophical argument supported by the empirical data generated.

  **Why This Route?**
  Current debates regarding AI beliefs stall on the opacity of frontier models. Realists and instrumentalists argue past each other because neither can run the required comparison on the systems that matter most. By moving the debate to small, transparent systems, I avoid the black-box deadlock. If the failure-mode distinction holds in simple systems, it provides a principled basis for extending attribution to complex systems without requiring impossible computational access. This bridges the gap between philosophical theory and ML practice, offering a criterion that is empirically runnable rather than metaphysically stipulated.

  **Possible Conclusions**
  There are three likely outcomes. First, a positive result: belief-modeled systems exhibit distinct failure signatures that intentional attribution predicts better than structural analysis. This would rescue instrumentalism by redefining the "predictive power" condition. Second, a negative result: failure modes are indistinguishable across architectures. This would suggest that intentional attribution in opaque systems is indeed unjustified instrumentalism, lending weight to eliminativism. Third, a nuanced result: the distinction exists only in systems with specific architectural features (e.g., world models). This would refine the conditions under which belief attribution is permissible. The decision between these conclusions will rest on the classification accuracy of the failure modes: if an intentional predictor outperforms a structural predictor on errors alone, the hypothesis is supported.

  **Risks and Scope Limitations**
  The primary risk is scope creep into engineering. It is tempting to expand the testbeds to larger models to make the results more "relevant," but this would violate the tractability constraint essential to the project. I will strictly limit experiments to systems where the design stance is fully computable by me within the fellowship period. A second risk is a null result; if failure modes do not cluster by architecture, the project yields a negative finding. While philosophically valuable, this risks lacking the constructive payoff required for a dissertation chapter. To mitigate this, I will ensure the taxonomy of failure modes is robust enough to publish even as a negative result regarding instrumentalist entitlement. Finally, there is the risk that the "failure mode" distinction proves to be merely semantic. I will mitigate this by pre-registering the failure categories with my committee to ensure they map onto substantive philosophical distinctions rather than linguistic conventions.
