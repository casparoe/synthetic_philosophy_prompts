answer: |-
  Your roommate is correct that quantum computers don't compute uncomputable functions, but incorrect that the Church-Turing Thesis is a mathematical theorem rather than a definition.

  *   **Reading 1: The Mathematical Equivalence Claim**
      *   **Claim:** Turing machines, lambda calculus, and general recursive functions define the exact same class of functions.
      *   **Verdict:** **Proven Theorem.** This is pure math; the equivalence is rigorously proved.
      *   **Relevance:** This is what your roommate cited as "proof," but it only proves the formalisms match each other, not that they match reality.

  *   **Reading 2: The Original "Effective Method" Claim**
      *   **Claim:** Any function a human can calculate using a fixed set of rules with pencil and paper is Turing-computable.
      *   **Verdict:** **Substantive but Unprovable.** This is the actual Church-Turing Thesis; it is widely accepted as true, but because "intuitive computability" is not a mathematical object, it cannot be formally proved.
      *   **Relevance:** Quantum computers do not violate this; they cannot solve the Halting Problem any more than a human with pencil and paper can.

  *   **Reading 3: The Physical Church-Turing Thesis**
      *   **Claim:** Any physical computing device that can be built in our universe can be simulated by a Turing machine (ignoring time constraints).
      *   **Verdict:** **Substantive and Plausible.** Current physics suggests this is true; quantum systems can be simulated by classical Turing machines, just inefficiently.
      *   **Relevance:** This supports your roommate's conclusion that quantum computers aren't a counterexample to *computability*, only to efficiency.

  *   **Reading 4: The Strong Physical Church-Turing Thesis**
      *   **Claim:** Any physical process can be simulated by a Turing machine *efficiently* (i.e., within polynomial time overhead).
      *   **Verdict:** **Likely False.** This is the version quantum computers break; they solve certain problems (like factoring) exponentially faster than classical machines reasonably can.
      *   **Relevance:** This supports your intuition that quantum computers "do something different," but the difference is speed (complexity), not capability (computability).

  *   **Reading 5: The Pancomputational Claim**
      *   **Claim:** The universe itself is literally a computation and nothing else.
      *   **Verdict:** **Speculative Metaphysics.** This is unprovable and unnecessary for computer science.
      *   **Relevance:** Neither of you need this to be true to resolve your argument.

  **Why he's half-right:** He wins on the quantum point (Reading 3 shows quantum doesn't break computability) but loses on the proof point (Reading 1 proves math equivalence, not Reading 2's connection to reality).
