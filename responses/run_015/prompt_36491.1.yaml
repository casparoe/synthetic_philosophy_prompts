  My credence is 5%.

  **Decomposition of Credence**

  1.  **Computational Solvability (0.95):** Given sparse input-output matrices and modern iterative solvers, the linear algebra required for static allocation is technically feasible within polynomial time.
  2.  **Data Existence (0.30):** Hayek's critique holds significant weight because tacit production knowledge and latent preferences often cannot be articulated, let alone digitized for algorithmic input.
  3.  **Objective Function Well-Definedness (0.50):** While Arrow's Impossibility Theorem poses a theoretical barrier, pragmatic approximations of social welfare functions are conceivable for basic allocation tasks.
  4.  **Incentive Separability (0.35):** Mechanism design literature suggests that without residual claimancy, truthful revelation of local information is not computationally separable from the agent's strategic self-interest.

  **Combination and Sensitivity**
  I combine these terms multiplicatively, as the failure of any single condition renders the system intractable in practice: $0.95 \times 0.30 \times 0.50 \times 0.35 \approx 0.05$. The final number is most sensitive to the **Data Existence** term; if tacit knowledge could be fully codified without loss, the credence would rise disproportionately because the computational and objective barriers become secondary. The evidence that would move this credence most would be a demonstrated instance of a non-market organization successfully coordinating complex, novel production processes over time without using internal shadow prices or profit signals.

  **Dynamic Claim Credence**
  My credence for the stronger claim—that a planned economy could match a market economy in generating new goods and methods—is **1%**. These two credences come apart because the static problem is one of optimization within a known solution space, whereas the dynamic problem is one of discovery where the solution space itself is created by the entrepreneurial process, which relies on dispersed judgment rather than calculable risk.
