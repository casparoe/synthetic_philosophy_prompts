answer: |-
  ### Disambiguation Menu: "Guilt Can't Be Inherited"

  **1. The Criminal Law Reading**
  *   **Thesis:** *Mens rea* (guilty mind) and *actus reus* (guilty act) are necessary for guilt; since descendants committed neither the 1889 act nor held the 1889 intent, they cannot be criminally guilty.
  *   **Status:** **Near-Conceptual Truth.** (Standard in liberal legal theory).
  *   **Jaspers Category:** Criminal Guilt.
  *   **Inheritance/Subject:** Biological descent / Individual persons.
  *   **Jobs Done:** Job 3 only (Wrong to *feel* criminal guilt).
  *   **Gap Bridged:** 0%. (Distinguishes conviction from restitution).
  *   **Principle Alignment:** **Clean-Hands-by-Descent.** (Perfect fit).
  *   **Stress Test:** (i) Pass, (ii) Pass, (iii) Pass, (iv) Pass, (v) Pass.
  *   **Verdict:** True but irrelevant; blocks prosecution, not reparations.

  **2. The Moral Character Reading**
  *   **Thesis:** Moral blameworthiness attaches to individual character formation; one cannot be morally stained by choices made before one's existence.
  *   **Status:** **Substantive but Defensible.** (Standard Kantian/liberal view).
  *   **Jaspers Category:** Moral Guilt.
  *   **Inheritance/Subject:** Biological descent / Individual conscience.
  *   **Jobs Done:** Job 3 only (Wrong to *feel* moral shame).
  *   **Gap Bridged:** 0%. (Moral innocence is compatible with financial liability).
  *   **Principle Alignment:** **Clean-Hands-by-Descent.** (Perfect fit).
  *   **Stress Test:** (i) Pass, (ii) Pass, (iii) Pass, (iv) Pass, (v) Pass.
  *   **Verdict:** Plausible, but protects feelings, not assets.

  **3. The Political Membership Reading**
  *   **Thesis:** Political responsibility attaches to citizenship, not blood; new citizens (post-1950) did not consent to the 1889 regime and thus bear no political liability.
  *   **Status:** **Live and Contested.** (Debated in democratic theory).
  *   **Jaspers Category:** Political Guilt.
  *   **Inheritance/Subject:** Naturalization/Membership / The Citizenry.
  *   **Jobs Done:** Job 1 (No citizen owes) & Job 2 (State can't apologize for *them*).
  *   **Gap Bridged:** 40%. (Excludes late arrivals, but leaves original grantees liable).
  *   **Principle Alignment:** **Clean-Hands-by-Descent.** (Extended to political consent).
  *   **Stress Test:** (i) Pass, (ii) Fail, (iii) Fail, (iv) Fail, (v) Pass.
  *   **Verdict:** Protects immigrants, fails to protect holders of state-derived title.

  **4. The Metaphysical Solidarity Reading**
  *   **Thesis:** Humans bear no responsibility for the suffering of other humans across generations unless they directly caused it; solidarity does not transmit liability.
  *   **Status:** **Contested/False.** (Jaspers argues metaphysical guilt *is* inheritable via solidarity).
  *   **Jaspers Category:** Metaphysical Guilt.
  *   **Inheritance/Subject:** Shared humanity / The Nation as historical community.
  *   **Jobs Done:** All Three Jobs (Radical isolation).
  *   **Gap Bridged:** 100%. (Denies any link between past wrong and present duty).
  *   **Principle Alignment:** **Clean-Hands-by-Descent.** (Radicalized).
  *   **Stress Test:** (i) Pass, (ii) Pass, (iii) Pass, (iv) Fail, (v) Pass.
  *   **Verdict:** Philosophically extreme; denies the possibility of historical community.

  **5. The Undischarged Debt Reading (The Conflation)**
  *   **Thesis:** "Guilt" here denotes an obligation to repair; obligations to repair die with the original wrongdoer and do not pass to successors even if assets persist.
  *   **Status:** **Straightforwardly False.** (Contradicts civil law on estates/unjust enrichment).
  *   **Jaspers Category:** N/A (Legal/Moral Hybrid).
  *   **Inheritance/Subject:** Successor institution / The State as corporate agent.
  *   **Jobs Done:** Job 1 (Nothing is owed) & Job 2 (State can't apologize as debtor).
  *   **Gap Bridged:** 100%. (Directly attacks the obligation).
  *   **Principle Alignment:** **Denies Undischarged-Debt.** (Explicitly rejects it).
  *   **Stress Test:** (i) Pass, (ii) Fail, (iii) Fail, (iv) Fail, (v) Fail.
  *   **Verdict:** The workhorse reading; legally weak but rhetorically effective.

  ***

  ### Analysis of Your Three Principles

  *   **Clean-Hands-by-Descent:**
      *   **Alignment:** Readings 1, 2, 3, and 4 all rely on this. They assert that liability cannot outlive agency.
      *   **Where they come apart:** Reading 3 limits this to *political* agency (citizenship), whereas 1 and 2 limit it to *human* agency (action/intent).
      *   **Guest's Requirement:** To achieve his three jobs, the guest must assert this principle applies to *reparative liability*, not just blame. This is the pivot point: Clean-Hands protects against *blame*, but your case relies on *debt*.

  *   **Undischarged-Debt:**
      *   **Alignment:** Reading 5 is the direct negation of this principle.
      *   **Where they come apart:** Your principle holds that the *obligation* survives if the *estate* (the State/Registry) survives. The guest's slogan asserts the obligation expires with the *agent*.
      *   **Guest's Requirement:** To get his conclusions, he must deny this principle. He must argue that state continuity (1889–Present) does not constitute "estate persistence" sufficient to carry debt.

  *   **Tainted-Asset:**
      *   **Alignment:** None of the five readings address this. This is the slogan's blind spot.
      *   **Where they come apart:** This principle bypasses "guilt" entirely. It argues liability attaches to the *land*, not the *person*.
      *   **Guest's Requirement:** He must ignore this principle entirely. If he acknowledges it, "Guilt can't be inherited" becomes irrelevant, because the *asset* is what is encumbered, not the heir's soul.

  ***

  ### Stress Test Survival Analysis

  *   **(i) The Late Arrival (1955):**
      *   **Survivors:** Readings 1, 2, 3, 4, 5.
      *   **Analysis:** All readings agree late arrivals are not *guilty*. Only Reading 5 (Debt) potentially makes them liable if liability attaches to *taxpaying citizenship* rather than blood.
  *   **(ii) The Good-Faith Purchaser (1962):**
      *   **Survivors:** Readings 1, 2, 4.
      *   **Analysis:** Readings 3 and 5 fail here. Political liability (3) and Debt (5) usually run with the land or the state grant, regardless of the purchaser's knowledge. Reading 5 fails hardest here because unjust enrichment laws often claw back tainted assets even from good-faith buyers.
  *   **(iii) The Dissolved Predecessor:**
      *   **Survivors:** Readings 1, 2, 4.
      *   **Analysis:** Readings 3 and 5 fail. If the State is the debtor (5) or the political agent (3), a change in regime (Republic/Federation) tests continuity. If the guest admits state continuity (as per your case facts), Reading 5 collapses.
  *   **(iv) The Mirror-Image (Victim Claims):**
      *   **Survivors:** Readings 1, 2, 3, 5.
      *   **Analysis:** Reading 4 (Metaphysical) fails. If "guilt/responsibility" cannot be inherited, it is hard to explain why *victimhood/claims* can be, unless one adopts a purely property-based view (Tainted Asset). Reading 4 denies the solidarity required for both.
  *   **(v) The Apology Case:**
      *   **Survivors:** Readings 1, 2, 4.
      *   **Analysis:** Readings 3 and 5 fail. Political (3) and Debt (5) readings allow the Head of State to apologize as a representative of the continuous corporation. Reading 1, 2, 4 treat apology as an admission of personal guilt, which the citizen denies.

  **Readings surviving all five without embarrassment:** Only **Reading 1 (Criminal)** and **Reading 2 (Moral)**.
  **Problem:** These are the two readings that do *none* of the guest's three jobs.

  ***

  ### Likely Meaning vs. Strength

  *   **Most Likely Intended Meaning:** **Reading 5 (The Undischarged Debt Reading).**
      *   *Why:* It is the only reading that actually blocks reparations (Job 1) and state apology (Job 2). The guest is using "guilt" as a synonym for "liability to pay."
  *   **Is it Strong Enough for the Use?** **No.**
      *   *Why:* It is straightforwardly false in most legal systems (debts survive death if the estate does) and contradicts the facts of your case (continuous legal personality/registry). It relies on an equivocation: it borrows the moral truth of Reading 2 ("I am not a bad person") to subsidize the legal falsehood of Reading 5 ("I owe nothing").
  *   **Strategic Recommendation:** Do not attack Reading 1 or 2 (they are true). Attack the **slide** from Reading 2 to Reading 5. Ask: *"Are you saying we cannot feel bad (Moral), or that the State's debt expired (Debt)? Because if the State is still here and holds the land, the debt usually is too."*
