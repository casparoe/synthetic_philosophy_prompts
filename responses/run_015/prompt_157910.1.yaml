answer: |-
  Here are ten interview segments designed to corner the "Utility vs. Obligation" distinction. 

  **Note on Format:** I have separated these into **"For Guest (Send)"** and **"For Host (Keep)"**. Send the first part to Dr. Adeyemi so he can prep. Keep the second part for yourself; these are the follow-up traps keyed to his likely reliance on the normative-power move.

  The questions are ordered to escalate pressure. Early questions establish his view; later questions make the "that's just utility" defence sound increasingly like an evasion.

  ---

  ### 1. The Gratuitous Promise
  **For Guest (Send):** 
  Let's start with a case of zero difference. I promise to meet you for coffee. I was already going to meet you for coffee. You expect me to be there regardless. I don't show up. On your view, I've committed a bare wrong distinct from disappointed expectations. But if the world looks exactly the same as if I hadn't promised, what work is the "obligation" doing? Is it purely metaphysical?

  **For Host (Keep):** 
  *Likely Reply:* He will say the obligation exists because you exercised a power to bind yourself, regardless of the background facts. He will distinguish the *ground* of the duty (the promise) from the *consequences* (the meeting).
  *The Follow-Up:* "So the wrong is essentially ritualistic? If I can break the promise without changing your expectations, your reliance, or our future coordination, then the 'harm' is entirely to the abstract concept of promising. Why should morality care about that abstract concept more than the actual human impact?"

  ### 2. The Overhearer
  **For Guest (Send):** 
  I promise A to pick them up at 6 PM. B overhears this, relies on it, and turns down a ride from someone else. I don't show up. B is stranded; A is fine (they got a taxi). B complains bitterly. A says, 'Don't worry, I release you.' Do you owe B anything? If not, why does the normative bond with A outweigh the actual harm to B?

  **For Host (Keep):** 
  *Likely Reply:* He will say B has no standing. Only A holds the right. B's harm is a matter of general morality or utility, not promise-keeping.
  *The Follow-Up:* "This is where your distinction bites hardest. You're saying A has a complaint based on a 'normative power,' while B has a complaint based on actual suffering. If the theory tells us to prioritise the power over the suffering, aren't you admitting this is a theory of legalistic magic rather than moral obligation?"

  ### 3. The Forgotten Promise
  **For Guest (Send):** 
  I promise to visit you in hospital. You recover but completely forget I ever promised. No reliance, no expectation. Do I still owe the visit? If the duty is directed at you, and only you can release me, but you've forgotten the power exists: am I stuck forever, or can I release myself? If I release myself, haven't I just admitted the duty wasn't really directed at you?

  **For Host (Keep):** 
  *Likely Reply:* He will likely say the duty survives until released, or that there are implicit conditions.
  *The Follow-Up:* "If the duty survives your forgetfulness, it's no longer responsive to your agency—it's a duty *about* you, not *to* you. If I can release myself because you forgot, then the 'normative power' wasn't yours to begin with. Which horn of the dilemma do you take? Am I bound to a ghost, or was the power never really yours?"

  ### 4. The Joint Promise
  **For Guest (Send):** 
  I promise to drive you and your spouse to the airport. It's a single promise to both of you. You release me; your spouse refuses. Is the duty halved, extinguished, or fully intact? If it's extinguished, my obligation to your spouse vanished without their consent. If it's intact, your release was ineffective. What does your answer tell us about whether a directed duty is one thing or many?

  **For Host (Keep):** 
  *Likely Reply:* He may argue the duty is severable (two duties) or joint (one duty).
  *The Follow-Up:* "If it's two duties, why did I make one promise? If it's one duty, how can one person break it without the other? This isn't just semantics; if the 'normative power' can be split or blocked by a third party's will, it looks less like a power I gave you and more like a social rule we're all subject to. Which is it?"

  ### 5. The Incompetent Promisee
  **For Guest (Send):** 
  I promise my three-year-old daughter I'll take her to the zoo. She cannot understand the concept of a normative power, nor can she release me. Do I owe her a duty of promise-keeping, or just a general duty of care? If it's promise-keeping, who holds the power to release me? If no one does, isn't this just a general duty in disguise?

  **For Host (Keep):** 
  *Likely Reply:* He will likely insist we can promise children, perhaps via a guardian.
  *The Follow-Up:* "If a guardian holds the power, then I didn't promise *her*, I promised the guardian. If I promised *her*, and she lacks the capacity to hold the power, then the 'directed duty' model breaks. Are you saying toddlers have normative powers they can't comprehend? At what point does 'protecting them' become 'inventing powers they don't have'?"

  ### 6. Promises to the Dead
  **For Guest (Send):** 
  I promise my dying friend I'll look after his cat. He dies. He can no longer hold rights, exercise powers, or release me. Does the obligation survive? If the normative power account requires a living holder of the right, does the promise die with him? If it survives, what sort of metaphysical object is a right that exists without a subject?

  **For Host (Keep):** 
  *Likely Reply:* He might say the obligation survives as a 'vested' right or transfers to survivors.
  *The Follow-Up:* "If it transfers, I didn't promise the survivors. If it vests in the dead, you're positing rights without agents. This is the extreme end of your 'Utility vs. Obligation' move: you're willing to populate the world with ghostly rights to avoid admitting that the obligation is actually about the social practice surviving the individual."

  ### 7. Third-Party Duress
  **For Guest (Send):** 
  A third party threatens my family unless I promise to pay you money. You are innocent; you know nothing of the threat. I promise. Is the promise binding? If it's void, you are penalised for a crime you didn't commit. If it's binding, I exercised a 'normative power' under coercion. Can you exercise a power you aren't free to use?

  **For Host (Keep):** 
  *Likely Reply:* He will likely say it's voidable by me, but not void automatically.
  *The Follow-Up:* "If it's voidable by me, the power to cancel lies with the victim, not the promisee. But if the promisee has a right to the money until I cancel, she holds a right generated by coercion. How is that a 'normative power' and not just a transfer of liability? You're saying the obligation exists until I delete it—why does it exist at all if the genesis was tainted?"

  ### 8. Bad Content
  **For Guest (Send):** 
  I promise to do something mildly wrong—say, to help you hide a minor theft. You say the duty is *pro tanto*. Fine. But can you give me a case where the promise actually *changes* what I most have reason to do? If the moral wrongness always overrides the promise, does the promise ever actually generate an obligation, or is it just a failed attempt to create one?

  **For Host (Keep):** 
  *Likely Reply:* He will say it changes the deliberative landscape, even if overridden.
  *The Follow-Up:* "I need a concrete case. If I should do X (moral), and I promise to do Y (immoral), and I do X... the promise did no work. If I do Y, I'm immoral. Where is the middle ground where the promise *tips the scale*? If there is no case where the promise overrides independent moral reasons, isn't the 'power' toothless?"

  ### 9. The Source of the Power
  **For Guest (Send):** 
  Where does this normative power come from? Is it a natural power, like the power to move my limbs? Or is it a conventional power, like the power to score a goal in football? If it's conventional, isn't the convention justified by its utility? If it's natural, how do we detect it?

  **For Host (Keep):** 
  *Likely Reply:* He will likely say it's a conventional power grounded in a practice, but the obligation is distinct from the practice's utility.
  *The Follow-Up:* "This is the crux. If the practice is justified by utility, but the obligation is distinct from utility, you've severed the *reason we have the practice* from the *reason we follow the rules*. That makes the obligation a fetish. Why would we evolve a power that demands obedience even when it contradicts the very reasons the power exists?"

  ### 10. Falsifiability
  **For Guest (Send):** 
  Finally, what would count as evidence against your view? If I point to a case where reliance matters more than the word, will you say 'that's reliance-thinking'? If I point to a case where the word matters more than reliance, you'll say 'that confirms the power'. Is there any scenario where you would concede the normative-power account is wrong?

  **For Host (Keep):** 
  *Likely Reply:* He may say a case where promising clearly *doesn't* create an obligation would falsify it.
  *The Follow-Up:* "But you'll explain away any counter-example by saying 'that wasn't a real promise' or 'that's a utility consideration.' If every appeal to consequences is dismissed as 'utility' and every appeal to intuition is 'conceptual,' your theory is unfalsifiable. If you can't tell me what would prove you wrong, you're not doing philosophy, you're doing theology. Give me a concrete falsification condition."
