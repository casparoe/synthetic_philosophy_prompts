answer: |-
  **TO:** Grants Committee, Marchbank Foundation
  **FROM:** [Your Name/Committee Member]
  **DATE:** Thursday
  **SUBJECT:** Decision on Kestrel Programme Renewal

  I recommend we renew the Kestrel Programme for a final year, subject to specific conditions regarding future predictions and model revisions. This conditional renewal acknowledges the programme's empirical successes while arresting its drift toward unfalsifiability.

  This decision requires us to classify the Kestrel record using our own three precedents rather than abstract philosophy. The programme resembles our first precedent (renewed despite failure) in Year 1 and Year 3. The Year 1 prediction was novel, quantitative, and confirmed, demonstrating the high-risk payoff our charter demands. The Year 3 confirmation of the auxiliary gating condition by an independent group validates the PI's response to the Year 2 null result as productive science rather than excuse-making. However, the programme now dangerously mirrors our second precedent (declined due to claim restatement). The Year 5 revision introducing a free parameter to absorb either sign, followed by the Year 6 redefinition of the core claim as "whatever produces the observed pattern," matches the disqualifying pattern of restating a central claim to fit whatever data appears. Furthermore, the accommodation of the Year 5 replication magnitude aligns with our third precedent (declined due to accommodating known facts), as the PI adjusted the model to fit data already in hand rather than risking a new prediction. We cannot renew outright because the trajectory matches Precedent 2; we cannot decline because the Year 1 and 3 successes match Precedent 1. Conditional renewal is the only instrument that preserves the valid science while blocking the degenerative shift.

  The conditions for renewal are designed to be actionable for a working scientist and will be transmitted separately to Dr. Okoye. First, within 30 days of fund release, the PI must file an Auxiliary Register for Year 6. This document must list all predictions counted as tests, specify which auxiliary hypotheses may be revised without supplying a new test, and mandate one further consequence to be tested inside the funding period for each permitted revision. Second, the programme must activate the hostile-design clause within 60 days. The PI must nominate one specific result she would concede as refuting the core claim, and a designated critic from outside the programme must certify by Day 90 that the test could actually produce that result. Third, we establish a decision gate at Month 10 of the funding year. If the Register is not filed, or if the outside critic refuses certification, funding will cease immediately. These conditions do not dictate scientific outcomes; they dictate procedural transparency that allows us to distinguish between healthy adaptation and goalpost moving.

  A significant concern is whether applying the Auxiliary Register and hostile-design clause retroactively is fair. The Kestrel Programme predates these instruments, and Dr. Okoye could not have complied with them in Years 1 through 5. Applying them to past performance would be unjust and logically impossible. However, applying them prospectively to Year 6 is fair because a renewal constitutes a new contract. The Foundation is entitled to update its compliance mechanisms between funding cycles, provided the new requirements are possible to meet. Dr. Okoye is not being penalized for past lack of registration; she is being asked to adopt new transparency standards to continue receiving public funds. Fairness requires we accept her past record as is, judged by the precedents available at the time, while insisting that continued support depends on future adherence to the Register. This balances the need for accountability with the recognition that rules cannot change mid-stream without notice.

  Professor Densmore argues that this exercise is incoherent. His position is that no research programme has ever been abandoned on a single refutation, and that every celebrated historical success involved protecting a core claim with auxiliary hypotheses. He contends that the Register is merely an unfalsifiability test wearing a lab coat, imposing bureaucratic hurdles on the very creative ambiguity that allows high-risk science to survive early failure. He warns that requiring a nominated refuting result invites game-playing, where PIs nominate impossible tests to secure certification without actual risk. Densmore is correct that our precedents acknowledge the necessity of auxiliary hypotheses; indeed, Precedent 1 explicitly allowed them. He is also correct that rigid falsificationism often misreads history. However, his argument does not carry in this specific instance because it ignores the distinction drawn in our precedents between *declared* auxiliary revisions and *undeclared* model shifts. Precedent 1 was renewed because the PI declared in advance which assumptions she would allow herself to revise. The Kestrel Programme's Year 5 revision was not declared, and the Year 6 claim redefinition removes the constraint entirely. Densmore's defense protects the right to use auxiliaries, but our conditions protect the Foundation's right to verify that those auxiliaries are not being used to immunize the claim from all possible evidence. The Register does not ban auxiliary revisions; it simply requires the cost associated with them in Precedent 1: a new test.

  If we accept Densmore's view without modification, we lose the ability to distinguish between the Kestrel Programme and the programme we declined under Precedent 2. Both would be permitted to restate claims indefinitely. Therefore, the conditions must stand. However, Densmore's concern about game-playing in the hostile-design clause is valid. To address this, the condition requires an *outside critic* to certify testability. This ensures the nominated refutation is genuine rather than theatrical.

  Our charter commits us to funding work that would not survive conventional peer review, but it does not commit us to funding work that has ceased to be science. The Kestrel Programme has produced genuine discovery, but it is currently operating without the guardrails necessary to ensure future discoveries are not merely accommodations. Conditional renewal honors the successes of Years 1 and 3 while enforcing the discipline that was missing in Years 5 and 6. We should proceed with the conditions as drafted.
