prompt: |-
  ok so for a reading group on reasoning under uncertainty i've been writing down my views and want a consistency check before i present them. here's my package:

  (1) for any concrete forecast i should start with the outside view / reference class and only adjust modestly.
  (2) epistemic modesty means i have to admit my inside-view reasoning could be wrong, but also that i might genuinely be in a different reference class if i have specific structural reasons.
  (3) i think you shouldn't update your self-image as an outlier until you've got actual track record of being right against the base rate, not just one good argument.
  (4) in domains where the reference class is heterogeneous or poorly defined, the outside view is weak and i should weight inside view more heavily - but i should be suspicious of my own judgment that this domain is heterogeneous.
  (5) i think the principle always-start-outside is itself an inside-view claim about good reasoning, so treating it as axiomatic is a kind of self-undermining move.

  my worry is that (2) gives me permission to claim exceptionality whenever i have structural reasons while (3) says i need track record first - those seem to clash on when inside-view adjustments are allowed. and (5) looks like it kills (1). but is the clash between (2) and (4) real or just apparent? can you audit this: rank tensions by severity, say for each what has to give, and flag which ones dissolve on closer look? don't lecture me on tetlock or whatever, just check the package.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the Request:**
      *   **Task:** Audit a set of 5 views/principles regarding reasoning under uncertainty for consistency.
      *   **Input:** 5 specific claims (labeled 1-5).
      *   **User's Concerns:**
          *   Clash between (2) (structural reasons allow exception) and (3) (need track record before claiming exception).
          *   (5) seems to undermine (1) (principle of starting outside is itself an inside view).
          *   Question about clash between (2) and (4) (heterogeneous reference classes).
      *   **Constraints:** Rank tensions by severity, say what has to give for each, flag which dissolve on closer look. No lecturing on Tetlock/superforecasting (keep it focused on the logic provided).

  2.  **Deconstruct the 5 Claims:**
      *   (1) *Default Heuristic:* Start outside (base rate), adjust modestly.
      *   (2) *Modesty Condition:* Admit inside view could be wrong, *but* allow deviation if specific structural reasons exist (potential outlier status).
      *   (3) *Outlier Verification:* Don't self-identify as an outlier based on argument alone; need empirical track record.
      *   (4) *Reference Class Quality:* If reference class is weak/heterogeneous, weight inside view more, *but* be suspicious of that judgment.
      *   (5) *Meta-Claim:* The "always start outside" rule is itself an inside-view claim about reasoning, so treating it as axiomatic is self-undermining.

  3.  **Analyze the Tensions:**

      *   **Tension A: (2) vs. (3) (The "Exception" Clash)**
          *   *Conflict:* (2) says "if I have structural reasons, I can adjust." (3) says "don't adjust/claim outlier status without track record."
          *   *Severity:* High. This is the operational core of how the user makes predictions. If (2) allows adjustment based on logic and (3) forbids it without data, the user is paralyzed.
          *   *Resolution:* (3) acts as a *constraint* on (2). (2) identifies the *condition* for deviation (structural reasons), but (3) sets the *evidentiary bar* for trusting that condition. You can have structural reasons, but you shouldn't *trust* them enough to deviate significantly until proven right.
          *   *Verdict:* Apparent clash, resolvable by hierarchy. (3) gates (2).

      *   **Tension B: (5) vs. (1) (The "Self-Undermining" Clash)**
          *   *Conflict:* (1) says "Always start outside." (5) says "The rule 'Always start outside' is an inside view claim." If (5) is true, does (1) collapse?
          *   *Severity:* Medium-High. This is a philosophical/meta-level tension. If the rule undermines itself, why follow it?
          *   *Resolution:* This is a version of the "liar paradox" or foundationalism issue. (1) is a *policy*, (5) is an *observation about the policy's status*. Acknowledging (5) prevents dogmatism about (1). It doesn't kill (1); it just means (1) is a heuristic justified by consequentialist reasoning (it works), not an axiomatic truth.
          *   *Verdict:* Dissolves on closer look. (5) saves (1) from dogmatism rather than killing it.

      *   **Tension C: (2) vs. (4) (The "Heterogeneity" Clash)**
          *   *Conflict:* (2) says "adjust if structural reasons exist." (4) says "if reference class is weak, weight inside view more."
          *   *User's Question:* Is this clash real?
          *   *Analysis:* They actually pull in the same direction. (4) creates the *space* for (2) to operate. If the reference class is strong, (2) is heavily constrained. If the reference class is weak (per 4), (2) has more room to maneuver based on structural reasons. The only tension is the caveat in (4) ("be suspicious of my own judgment").
          *   *Verdict:* Apparent clash. They are complementary. (4) defines *when* (2) is most active.

      *   **Tension D: (4) Caveat vs. (2) (The "Suspicion" Clash)**
          *   *Conflict:* (4) says "be suspicious if I think the domain is heterogeneous." (2) says "if I have structural reasons [which often implies heterogeneity], I can adjust."
          *   *Severity:* Medium. How do I know if my structural reason is valid or just me wishing the reference class didn't apply?
          *   *Resolution:* This links back to (3). The "suspicion" in (4) is satisfied by the "track record" in (3).

  4.  **Drafting the Audit:**

      *   *Structure:*
