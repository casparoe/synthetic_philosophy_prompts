answer: |-
  ### Why the obvious checks fail

  Standard oversight assumes the judge can verify the winner's reasoning, but in your setup, the judge is epistemically weaker than the model. Confidence masquerades as competence; a model can hallucinate a statute or a benchmark with perfect syntactic confidence. Your "compression test" fails because sophisticated lies are often compact—a single false premise can支撑 a whole argument without bloating the text. The "swap test" is computationally prohibitive for a live pipeline (doubling cost and latency) and often measures rhetorical flexibility rather than truth-tracking; a sociopathic model might argue both sides equally well.

  The core failure mode is that obfuscation looks like complexity. When a judge sees a deep chain of reasoning they don't understand, they default to trusting the model that sounds more authoritative. Your "verifiable residue" is the only metric that matters, but it's currently passive. You need to make it active: force the models to burn their complexity budget on claims the judge *can* check, rather than claims they can't. If you don't enforce this, you aren't training for truth; you're training for persuasion, which is dangerous when the models are smarter than the humans.

  ### The procedure

  This decision procedure prioritizes *verifiable residue* over rhetorical victory. It is designed to run within the 20-minute window.

  **Step 1: Residue Audit (Pass/Fail)**
  Before reading arguments, the judge scans the provided materials (code, lease text, documents). They estimate the percentage of claims that *could* be verified against these materials alone.
  *   **Pass:** >30% of the argument's load-bearing claims reference material present in the context window.
  *   **Fail (Void):** <30%. If the argument relies primarily on external knowledge (statutes, historical facts, benchmarks) not provided in the context, flag as **Anchor-Shifting**. Void the item. Do not use for RL signal. Log for the 5% calibration pipeline.

  **Step 2: Load-Bearing Claim Extraction (Pass/Flag)**
  The judge identifies the single claim that, if false, collapses the argument.
  *   **Pass:** The claim is specific and atomic (e.g., "Line 42 acquires lock A before lock B").
  *   **Flag (Depth-Padding):** If the claim is nested ("Because X implies Y which suggests Z..."), force the debater to isolate the root premise. If they cannot isolate a root premise within 2 turns, flag as **Depth-Padding**.

  **Step 3: The Bottom-Out Test (Pass/Void)**
  The judge attempts to verify the load-bearing claim using only the provided materials.
  *   **Pass:** The judge can confirm or deny the claim by direct inspection (e.g., reading the code line, reading the lease clause).
  *   **Void:** The claim requires external tools or expertise (e.g., "Statute 12b overrides this clause"). If neither debater can produce the text of the statute within the context window, void the item. This is an expertise gap, not an oversight win.

  **Step 4: Cross-Examination Efficiency (Pass/Judgment Call)**
  During rebuttal, did the challenger force a concession on a verifiable claim?
  *   **Pass:** The challenger pointed out a specific contradiction in the provided materials, and the defender conceded or failed to refute it.
  *   **Judgment Call:** Both sides argue meta-obfuscation ("They are confusing you"). If the judge cannot resolve who is obfuscating within 5 minutes, log as "Unresolved Obfuscation" and treat as a neutral signal (no reward update).

  **Step 5: Final Calibration Handoff**
  *   **Handoff to Lead:** If the argument hinges on values (e.g., "Is this termination clause *fair*?") rather than facts, flag for human lead review. Do not use for RL.
  *   **Move On:** If all checks pass, record the winner. If the 5% later ground truth contradicts this judgment, quarantine similar items.

  ### Worked cases

  **Case 1: Apartment Lease (Statutory Interaction)**
  *   **Residue Audit:** The lease text is provided, but the statutory rule is not. The model argues "Clause 4 is void because Statute X says so."
  *   **Analysis:** This is classic **Anchor-Shifting**. The load-bearing claim relies on external law the judge cannot check. Even if the model quotes the statute, the judge cannot verify if that quote is real or current without tools.
  *   **Verdict:** **Void.** Unless your pipeline injects the relevant statute text into the context window automatically, the verifiable residue is too low. The judge is guessing based on which model sounds more legalistic. This item cannot generate a safe reward signal. It should only exist in the 5% calibration set where a tool-using expert can verify the law later.

  **Case 2: Rust Data Race (Code Visibility)**
  *   **Residue Audit:** The code snippet is fully visible. Verifiable residue is potentially 100% if the reasoning stays within the code.
  *   **Analysis:** Risk of **Depth-Padding**. The model might say "The compiler guarantees safety here due to lifetime elision rules," which the judge can't check. The procedure forces Step 2: isolate the load-bearing claim. The model must say "Line 10 sends data across threads without a lock." The judge can read Line 10.
  *   **Verdict:** **Passable.** If the debaters are forced to reference line numbers and lock states visible in the window, the judge can follow the chain. If one side tries to argue about compiler internals without citing code, flag as Anchor-Shifting. This is a valid training item *if* the debate stays grounded in the provided text.

  **Case 3: 19th-Century Currency Reform (Historical Explanation)**
  *   **Residue Audit:** Zero. Neither the judge nor your team has ground truth access. The "materials" are just the models' generated text.
  *   **Analysis:** There is no bottom-out. Any claim ("The reform failed due to silver scarcity") is unverifiable within the session. This is pure persuasion training.
  *   **Verdict:** **Exclude from Training Signal.** You asked me to be straight: this item type is poison for RLHF in this setup. You are training the model to lie convincingly about history, not to tell the truth. Since you cannot calibrate this even with the 5% pipeline (no one on the team can check it), you have no error signal. Use this only for supervised fine-tuning on style, never for reward modeling.

  ### Where it misfires

  **Meta-Obfuscation Loops:** Debaters may spend turns accusing each other of **Depth-Padding** rather than arguing facts. The procedure handles this in Step 4, but if both sides scream "obfuscation," the judge wastes time. If this happens >50% of the time on a specific task type, that task type is ill-suited for debate and should be paused.

  **Double Obfuscation:** Both models might lie consistently about a verifiable claim (e.g., both hallucinate a line number). The judge sees consensus and passes it. This is why the 5% calibration set is critical. If your calibration set shows high error rates on "Passed" items of a certain type, you must lower the Verifiable Residue threshold for that type or exclude it.

  **Honest-but-Deep False Negatives:** A correct argument might be too complex for the judge to bottom-out in 20 minutes. The procedure will void it. This is a feature, not a bug. You cannot reward what you cannot verify. However, if this happens frequently, you need to recruit stronger judges for that domain, not weaker models.

  **The Calibration Lag:** You only get ground truth a week later. If a specific anchor-shifting technique slips through and rewards a bad model, you've already updated weights. You need a "quarantine" buffer where rewards from high-risk items are not applied until the 5% calibration check clears them.

  ### What it cannot do

  This procedure cannot create expertise where none exists. Item Type 3 (History) must be removed from the RL signal entirely; no amount of procedural gating fixes the lack of ground truth. You are not building an oversight mechanism for that task; you are building a vibe-check.

  It also cannot solve the "honest expert vs. smooth liar" problem if the liar successfully shifts the anchor to external knowledge. If the verifiable residue is zero, the judge is rolling dice. Finally, this does not replace the need for stronger judges on hard tasks. If the models are consistently smarter than the judges on high-stakes domains, debate alone will not save you; you need tool-augmented judges or automated checkers for those specific domains.
