answer: |-
  Here is the specification sheet you asked for. It is designed to separate the statistical necessities from the philosophical preferences, and to identify where the metrics break under their own weight.

  ### The Desiderata for a Serious Account of Historical Violence

  I have categorized your eight worries into three domains: **Measurement** (the math), **Scope** (the boundaries), and **Causality** (the mechanism). Each item is flagged as **Non-Negotiable (NN)** (a failure here invalidates the claim empirically) or **Preference (P)** (a choice of moral or theoretical framework).

  #### I. Measurement (The Math)
  **1. Denominator Consistency (Per-Year vs. Lifetime)**
  *   **The Requirement:** Any claim about "risk" must specify exposure time. If life expectancy doubles, a constant annual homicide rate implies a doubled lifetime risk of victimization.
  *   **Status:** **Non-Negotiable.**
  *   **Rationale:** This is basic probability. Failing to distinguish between *rate* (events per person-year) and *cumulative risk* (events per lifespan) allows authors to claim progress where there is only demographic shift.
  *   **Source:** Your Point (1).

  **2. Temporal Clustering Weighting**
  *   **The Requirement:** Metrics must acknowledge that variance matters. A million deaths in a single year (war/genocide) is sociologically and psychologically distinct from a million deaths spread over a century (crime/feud), even if the annualized average is identical.
  *   **Status:** **Preference.**
  *   **Rationale:** Mathematically, the sum is the same. Humanely, they are different. A metric that smooths peaks (averaging) hides the specific horror of industrial violence. Including this requires choosing a weighting function (e.g., logarithmic) that is inherently subjective.
  *   **Source:** Your Point (7).

  **3. The Tail (Capacity vs. Realization)**
  *   **The Requirement:** An account must distinguish between the *incidence* of killing and the *capacity* to kill. A world with nuclear weapons has a lower realized death rate than the 14th century but a higher potential death rate.
  *   **Status:** **Preference.**
  *   **Rationale:** This shifts the metric from *history* (what happened) to *risk assessment* (what could happen). It is essential for futurism but corrupts historical comparison because "capacity" is unobservable in the past.
  *   **Source:** Your Point (5).

  #### II. Scope (The Boundaries)
  **4. Definitional Consistency (The Floor)**
  *   **The Requirement:** The definition of "violence" must remain constant across time periods. You cannot count battlefield deaths in 1300 and "structural neglect" deaths in 2000 using the same label.
  *   **Status:** **Non-Negotiable** (for empirical claims).
  *   **Rationale:** If the definition expands over time (concept creep), a decline in the metric may simply reflect a narrowing of what is counted, or vice versa. To compare Era A to Era B, the numerator must represent the same phenomenon.
  *   **Source:** Your Point (6).

  **5. Geographic Permeability (Displacement)**
  *   **The Requirement:** A "global" decline must account for the export of violence. If Region A becomes peaceful by extracting resources via violence in Region B, or by imprisoning its violent actors, the *global* violence has not necessarily declined; it has been relocated.
  *   **Status:** **Non-Negotiable** (for "Global" claims).
  *   **Rationale:** Systems theory 101. You cannot measure a closed system (the world) by looking at a subsystem (the West) while ignoring the interface (colonialism/trade/prisons).
  *   **Source:** Your Point (3) & (8).

  **6. Interaction-Density Scaling**
  *   **The Requirement:** Violence rates should ideally be normalized by the number of social interactions, not just population. A person in a modern city encounters more strangers in a day than a medieval peasant did in a year.
  *   **Status:** **Preference.**
  *   **Rationale:** This is theoretically robust (Routine Activity Theory) but empirically impossible for deep history. We cannot count "interactions" in the Pleistocene. Adopting this requires modeling assumptions that dwarf the data.
  *   **Source:** Your Point (2).

  #### III. Causality (The Mechanism)
  **7. Latent vs. Realized Distinction**
  *   **The Requirement:** Metrics must distinguish between a decline in the *desire* to commit violence and a decline in the *opportunity* due to suppression (policing/state monopoly).
  *   **Status:** **Non-Negotiable** (for causal claims).
  *   **Rationale:** If violence drops because the state threatens greater violence to suppress it (the Leviathan), calling this "less violence" is a category error. It is "less realized violence," potentially purchased with "more latent violence."
  *   **Source:** Your Point (4).

  ---

  ### The Impossibility Theorem

  You asked if a subset of these requirements can be jointly satisfied. **They cannot.** There is a trilemma at the heart of violence metrics. You can satisfy any two, but not all three:

  1.  **Empirical Tractability:** You can measure the data (body counts, homicide rates).
  2.  **Moral Completeness:** You can include structural violence, displacement, and latent capacity (Points 3, 4, 6).
  3.  **Historical Comparability:** You can compare 10,000 BCE to 2000 CE using the same unit (Point 1, 4).

  *   **If you choose Tractability and Comparability:** You must restrict the definition to "direct physical death." This yields clean charts (like Pinker's) but ignores structural harm and displacement. **(This is the Pop-Science Route).**
  *   **If you choose Moral Completeness and Comparability:** You must model unobservable data (structural neglect, potential capacity). This yields a morally rich account but relies on unverifiable assumptions. **(This is the Critical Theory Route).**
  *   **If you choose Tractability and Moral Completeness:** You can only talk about the present. You cannot make historical claims because past structural violence is unrecorded. **(This is the Sociological Route).**

  **The Story:** The reason the "violence is declining" debate is so fractious is not because the data is disputed, but because the camps are solving for different vertices of this trilemma. A serious piece must admit that **a single number cannot be both empirically rigorous and morally comprehensive.**

  ---

  ### The Specific Answers You Requested

  **1. Which single requirement does the most damage to the measures journalists actually cite?**
  **Requirement #5 (Geographic Permeability/Displacement).**
  Journalists cite "global homicide rates" or "battlefield deaths per capita." These metrics assume the world is a set of sealed containers. If violence is fluid—if it moves from the metropole to the colony, from the street to the prison, from the present to the future (climate)—then a decline in *measured* violence in the data-rich West is often just a receipt for violence exported to the data-poor Global South. This requirement turns a "decline" into a "relocation," invalidating the headline.

  **2. Which of your eight worries is really just one camp's prejudice?**
  **Worry #6 (The Definitional Floor).**
  While it feels rigorous to ask "does this include neglect?", expanding the definition of violence to include "preventable death" or "structural harm" is a specific ideological commitment (Structural Violence Theory). It is not a neutral empirical stance.
  *   **Why:** If you include "death by neglect" as violence, then the invention of antibiotics looks like a decline in violence, but a famine caused by distribution failure looks like a massacre. This makes historical comparison impossible because pre-modern people did not have the *capacity* to prevent neglect in the same way. Using modern moral standards to judge pre-modern neglect is anachronistic. It is a valid *moral* position, but it is a *prejudice* masquerading as a *metric*.

  ---

  ### Brief Note on Standard Approaches

  *   **The "Long Peace" (Pinker et al.):** Solves for **Tractability** and **Comparability**. Uses direct death counts per capita. *Blind spot:* Ignores displacement and structural harm.
  *   **The "Continuum of Violence" (Feminist/Critical Critics):** Solves for **Moral Completeness**. Includes domestic violence, structural harm, and colonial extraction. *Blind spot:* Sacrifices historical comparability; often relies on modeling rather than data.
  *   **The "State Capacity" (Elias/Foucault):** Solves for **Causality**. Focuses on who holds the monopoly on violence. *Blind spot:* Often ambiguous on whether the *amount* of violence has dropped or just centralized.

  **The Pitch:** Your story isn't "Is violence down?" It's "Why is the question unanswerable with a single number?" The metric is the message.
