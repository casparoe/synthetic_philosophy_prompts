  Lewis says the plurality of worlds is necessary, but on my view it's contingent—so in some worlds, modal realism is false, not because worlds are abstract, but because there's literally only one.

  **Note on Liberties and Orthodoxy**
  This punchline takes a specific liberty: David Lewis treats the plurality of worlds as a necessary truth (true at all worlds), whereas "cheap modal realism" makes the domain of quantification world-relative. Lewis would reject this as violating the absoluteness of existence; on his view, all worlds exist simpliciter, not just relative to a standpoint. Regarding orthodoxy: among Lewisians, actuality as indexical, the isolation of worlds, and the rejection of transworld identity (counterpart theory) are settled doctrine. The necessity of the plurality itself is also standard Lewisian orthodoxy, though less frequently debated than isolation. Finally, do not let the joke imply consensus: variable-number-of-worlds is a heterodox variant rejected by both standard Lewisians and actualists, not a live option in the mainstream literature.

  \answer{Lewis says the plurality of worlds is necessary, but on my view it's contingent—so in some worlds, modal realism is false, not because worlds are abstract, but because there's literally only one.}
