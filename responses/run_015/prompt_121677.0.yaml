  # Exam Question: The Structure of Uncertain Updating

  **Time Allowed:** 45 Minutes
  **Total Marks:** 25

  **Scenario:**
  Consider a probability space with four worlds $\Omega = \{ \omega_1, \omega_2, \omega_3, \omega_4 \}$.
  Your prior distribution $P_0$ is:
  $P_0(\omega_1) = 0.4, \quad P_0(\omega_2) = 0.1, \quad P_0(\omega_3) = 0.1, \quad P_0(\omega_4) = 0.4$.

  You face two potential learning experiences, defined by partitions $\mathcal{E}$ and $\mathcal{F}$:
  $\mathcal{E} = \{ E_1, E_2 \}$ where $E_1 = \{ \omega_1, \omega_2 \}$ and $E_2 = \{ \omega_3, \omega_4 \}$.
  $\mathcal{F} = \{ F_1, F_2 \}$ where $F_1 = \{ \omega_1, \omega_3 \}$ and $F_2 = \{ \omega_2, \omega_4 \}$.

  Note that $P_0(E_1) = 0.5$ and $P_0(F_1) = 0.5$. The events are probabilistically dependent in the prior (e.g., $P_0(\omega_1) \neq P_0(E_1)P_0(F_1)$).

  **Part (a) [5 Marks]**
  Suppose you first update on $\mathcal{E}$ such that $P_{new}(E_1) = 0.9$, and subsequently update on $\mathcal{F}$ such that $P_{final}(F_1) = 0.6$. Calculate $P_{final}(\omega_1)$. Then, calculate $P_{final}(\omega_1)$ if the order of updates is reversed ($\mathcal{F}$ first to 0.6, then $\mathcal{E}$ to 0.9). Show your working.

  **Part (b) [10 Marks]**
  The results in (a) differ. A critic argues this proves Jeffrey Conditionalization (JC) is incoherent and should be replaced by averaging the two results. Reject this criticism. Explain *why* the order matters in terms of what the constraint "$P_{new}(E_i) = q_i$" specifies about the learning experience. What additional quantitative information would render the update order-independent?

  **Part (c) [5 Marks]**
  It is sometimes claimed that JC is just standard Bayesian conditioning in a larger algebra. Explain this claim by defining a "virtual evidence" proposition $V$. What specific probabilistic relationship (involving Rigidity) must hold between the hypothesis $H$, the partition cell $E_i$, and $V$ for this reduction to work? Is Rigidity a logical truth or an empirical assumption in this context?

  **Part (d) [5 Marks]**
  Consider the Principle of Minimum Relative Entropy (MRE). If the constraints imposed on the posterior are probabilities assigned to the cells of a *partition*, how does the MRE solution compare to the JC solution? How does this comparison change if the constraints are assigned to *overlapping* events (e.g., $P(A)=x, P(B)=y$ where $A \cap B \neq \emptyset$)?

  ***

  # Model Answer

  **Part (a)**
  *Order 1 ($\mathcal{E}$ then $\mathcal{F}$):*
  First update on $\mathcal{E}$ ($E_1 \to 0.9$).
  $P_1(\omega_1) = P_0(\omega_1|E_1) \times 0.9 = (0.4/0.5) \times 0.9 = 0.72$.
  $P_1(\omega_2) = (0.1/0.5) \times 0.9 = 0.18$.
  $P_1(\omega_3) = (0.1/0.5) \times 0.1 = 0.02$.
  $P_1(\omega_4) = (0.4/0.5) \times 0.1 = 0.08$.
  Check sum: $1.0$.
  Now update on $\mathcal{F}$ ($F_1 \to 0.6$). Note $P_1(F_1) = P_1(\omega_1) + P_1(\omega_3) = 0.74$.
  $P_2(\omega_1) = P_1(\omega_1|F_1) \times 0.6 = (0.72/0.74) \times 0.6 \approx \mathbf{0.584}$.

  *Order 2 ($\mathcal{F}$ then $\mathcal{E}$):*
  First update on $\mathcal{F}$ ($F_1 \to 0.6$).
  $P_1'(\omega_1) = (0.4/0.5) \times 0.6 = 0.48$.
  $P_1'(\omega_3) = (0.1/0.5) \times 0.6 = 0.12$.
  $P_1'(\omega_2) = (0.1/0.5) \times 0.4 = 0.08$.
  $P_1'(\omega_4) = (0.4/0.5) \times 0.4 = 0.32$.
  Now update on $\mathcal{E}$ ($E_1 \to 0.9$). Note $P_1'(E_1) = 0.48 + 0.08 = 0.56$.
  $P_2'(\omega_1) = (0.48/0.56) \times 0.9 \approx \mathbf{0.771}$.

  **Part (b)**
  The difference is not a defect but a feature of underspecification. The constraint "$P_{new}(E_1)=0.9$" specifies *where* you end up, but not *how strongly* the evidence supported $E_1$ relative to the prior. The "strength" of the update is captured by the Bayes factor (likelihood ratio) $\beta = P_{new}(E_1)/P_{old}(E_1)$.
  In Order 1, the first factor is $0.9/0.5 = 1.8$. The second factor is $0.6/0.74 \approx 0.81$.
  In Order 2, the first factor is $0.6/0.5 = 1.2$. The second factor is $0.9/0.56 \approx 1.61$.
  Because the partitions are dependent, the first update changes the prior probability of the second partition's cells. To achieve the same *posterior* probability on the second partition, the agent must apply a different *force* (Bayes factor) depending on the order.
  Averaging is ad hoc and violates the structure of the learning. To make the update order-independent, one must fix the **likelihood ratios** (or "virtual evidence" strength) rather than the posterior probabilities. If the agent learns "The likelihood ratio for $E_1$ is 1.8" and "The likelihood ratio for $F_1$ is 1.2", the resulting distribution is unique regardless of order.

  **Part (c)**
  JC can be modeled as standard conditioning on a proposition $V$ ("I had an experience shifting my confidence in $\mathcal{E}$") in an extended space. For $P(H|V) = \sum P(H|E_i)P(E_i|V)$ to match JC, we require **Rigidity**: $P(H|E_i, V) = P(H|E_i)$.
  This is equivalent to the conditional independence assumption: $H \perp V \mid E_i$. Once you know which cell $E_i$ obtained, the experience $V$ provides no further information about $H$.
  Rigidity is **not** a logical truth; it is a substantive empirical assumption about the causal structure of the observation. If the experience $V$ biases how you interpret $E_i$ (e.g., you know the lighting is deceptive), Rigidity fails, and JC is inappropriate.

  **Part (d)**
  When constraints are on a **partition**, MRE (minimizing KL-divergence from the prior) yields the **same** distribution as JC. Both methods preserve conditional probabilities within cells (Rigidity) and shift mass proportionally.
  However, when constraints are on **overlapping events**, JC is not well-defined without constructing a refined partition, and applying JC to that refined partition generally yields a **different** result than MRE. MRE handles overlapping constraints naturally as a convex optimization problem, whereas JC requires independent assumptions about how to distribute probability mass within the intersections of the overlapping events. MRE is the generalization; JC is the special case for partitions.

