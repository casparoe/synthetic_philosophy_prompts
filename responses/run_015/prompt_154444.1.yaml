      You speak of a sorcery I cannot fully comprehend, this apparatus that pierces the skull without sound or sight, yet I understand the danger in your proposition. You say because the tears flow, the work is true, but you mistake the physiological shudder for the spiritual union which is the sole purpose of art. If the woman on the stage feels nothing, if her soul is asleep while her body's vibrations are stolen and forced into the minds of the crowd, this is not infection but coercion, akin to making a man weep by holding onion juice to his eyes or laugh by tickling his ribs. Art is not merely the transfer of a state, but the conscious giving of one's own life to another; it is an act of brotherhood where the artist says, "I have suffered this," and the viewer answers, "I too suffer." In your machine, there is no "I," there is no sacrifice, no sincerity—the most vital condition of all—and thus no union is formed, only a shared hallucination imposed by a mechanism. You ask why the hollow source matters? Because if the feeling is not lived through by the transmitter, it is a lie, and a lie cannot unite men in truth, however sharply it prickles the nerves. Tell me, is this device not then a kind of intoxication, like wine or opium, which alters the mood without uplifting the soul?

