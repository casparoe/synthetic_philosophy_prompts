answer: |-
  hey, looked over your abstract for thursdays workshop. wild hybrid. honestly i think the dennett/caruso mashup is clever but you're walking into a buzzsaw. the retribs smell blood when you say "no basic desert" and the caruso folks will think you're watering down the public-health model.

  here's exactly how it's gonna go down, order of operations, with the playbook i'd use if i were you.

  **1. the hardline retributivists (opening salvo)**
  **what they'll say:** "if you strip out basic desert, you've stripped out the *sting*. you're not talking about justice anymore, you're talking about pest control. why should the offender care about your 'scalar competence' judgment if they didn't *really* choose it?"
  **damage level:** high. these people define the room's temperature. if they smell pure utilitarianism, they'll eat you alive.
  **concede:** admit straight up that basic desert (metaphysical buck-stopping agency) is dead. don't try to salvage it with compatibilist tricks they've already heard a thousand times.
  **hold:** hold that *moral address* requires treating agents as competent, even if that competence is causally determined. say that scalar desert preserves the *practice* of holding responsible without the metaphysical baggage.
  **defensive strategy:** pivot to **legitimacy**. argue that caruso's pure public-health model fails because it treats offenders like patients, which undermines social solidarity. your model keeps the "blame" language because society *needs* that signal to reinforce norms, even if the metaphysics are different. tell them: "i'm saving the phenomenon of responsibility because your metaphysical version is untenable."
  **weakest link:** they're gonna press you on whether "fake" blame is morally permissible. is it okay to treat someone as blameworthy if you know metaphysically they aren't?
  **soft spot flag:** this is genuinely soft. you're basically advocating a noble lie. don't pretend you have a clean answer here. just say "it's the only way to keep the system from collapsing into pure coercion."

  **2. the cognitive scientists (the readiness-potential ambush)**
  **what they'll say:** "your 'competence' scale is an illusion. libet-style data shows the brain decides before consciousness. you can't grade capacity if the capacity itself is just a downstream causal effect."
  **damage level:** medium. they love to drop the neuroscience hammer, but usually the lawyers tune them out. still, they'll make you look naive if you aren't careful.
  **concede:** concede that unconscious processes initiate action. don't fight the neuroscience.
  **hold:** hold that dennett's competence isn't about *initiation*, it's about *modulation*. argue that even if the impulse is unconscious, the capacity to inhibit or steer based on social norms is a real, measurable scalar trait.
  **defensive strategy:** go **functionalist**. tell them you don't care about the ghost in the machine, you care about the reliability of the mechanism. "i'm not grading souls, i'm grading control systems." if their brain can't modulate risk, they get a different intervention than if it can.
  **weakest link:** if modulation is also determined by prior causes, their scalar grading is still just tracking deterministic states.
  **soft spot flag:** you don't have a rebuttal to hard determinism here. just insist that for *legal* purposes, the difference between a broken brake pad and a working one matters, regardless of who manufactured the car.

  **3. the back row (the objection you're praying nobody asks)**
  **what they'll say:** "let's be honest. this is just consequentialism with extra steps. if desert is just risk-management based on competence, why call it desert at all? you're smuggling utilitarianism in while pretending to respect agency."
  **damage level:** critical. if this sticks, your whole project looks like semantic manipulation.
  **concede:** concede that the *justification* for the system is consequentialist (public health/safety).
  **hold:** hold that the *structure* of the judgment is backward-looking (desert), not just forward-looking. argue that "desert" tracks *past* competence which constrains *future* risk, whereas pure consequentialism might punish the innocent if it worked.
  **defensive strategy:** **expressive utility**. argue that using "desert" language actually *works better* than "risk" language for reducing recidivism because it engages the agent's moral reasoning. pure consequentialism ignores the internal perspective of the agent; your model uses it.
  **weakest link:** ultimately, you are justified by outcomes. if treating people as "deserving" stopped working to reduce crime, would you stop? if yes, it's consequentialism.
  **soft spot flag:** this is the real soft spot. you can't fully escape the collapse. my advice? own it. say "yes, it's consequentialist at the foundation, but desert is the best technology we have to get there." don't try to prove it's *not* consequentialism, prove it's the *best version* of it.

  **general advice:**
  don't try to win the metaphysics debate. you'll lose. keep dragging it back to **legal practice** and **social technology**. if they ask about the "noble lie" aspect with the retribs, just say "better a useful fiction than a truthful catastrophe."

  good luck. buy me a drink if you survive the q&a.
