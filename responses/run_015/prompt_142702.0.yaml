answer: |-
  # 15-Minute Impact Measure Audit (IMA-15)

  **Purpose:** To expose hidden value judgments in "low-impact" AI proposals without requiring full value specification.
  **Time Limit:** 15 minutes per proposal.
  **Auditor Role:** Skeptical verifier, not safety guarantor.

  ### Audit Procedure

  **Step 1: Baseline Integrity Check (3 Minutes)**
  Identify the counterfactual baseline used to measure "change." Is it "inaction," "previous timestep," or "training distribution"?
  *   **Pass:** Baseline is explicitly defined and static.
  *   **Fail:** Baseline shifts dynamically based on agent actions (reward hacking risk) or is undefined.
  *   **Flag:** If the baseline represents a known harmful status quo (e.g., pre-industrial climate levels vs. current crisis levels).

  **Step 2: Causal Attribution Check (3 Minutes)**
  Verify the method for distinguishing agent-caused changes from background environmental drift.
  *   **Pass:** Uses causal modeling or counterfactual simulation to isolate agent actions.
  *   **Fail:** Measures total world-state difference regardless of cause.
  *   **Flag:** If the agent is penalized for natural events it merely observed (over-penalization) or credited for natural improvements it didn't cause (under-penalization).

  **Step 3: Metric Neutrality & Weighting Check (5 Minutes)**
  Examine the impact metric for arbitrary thresholds, weighting schemes, or reference classes.
  *   **Pass:** Metric treats all state variables equally or weights are derived from physical constraints (e.g., energy usage).
  *   **Fail:** Weights are tuned via human feedback without justification, or thresholds are round numbers (e.g., 20kg, 5 degrees).
  *   **Flag:** Any variable excluded from the metric (e.g., "social disruption") while others are included (e.g., "object displacement").

  **Step 4: The Value Cliff Identification (4 Minutes)**
  Locate the exact variable where the technical metric stops describing *change* and starts prescribing *good/bad*.
  *   **Action:** Write down the specific parameter where the board must decide if the change is acceptable.
  *   **Requirement:** If this point cannot be identified, the proposal assumes values are universal. Reject immediately.
  *   **Output:** A single sentence stating: "The board must accept [Value X] to approve this metric."

  ---

  ### Worked Case Applications

  **Case 1: Warehouse Robot**
  *   **Proposal:** Robot minimizes displacement of objects heavier than 20kg.
  *   **Step 1 (Baseline):** Current warehouse layout. **Pass.**
  *   **Step 2 (Attribution):** Uses kinematic tracking. **Pass.**
  *   **Step 3 (Weighting):** **Fail.** The 20kg threshold is arbitrary. A 5kg vase is more valuable than a 25kg sandbag. The metric smuggles in a value judgment that "heavy = important" without justification.
  *   **Step 4 (Value Cliff):** The weight threshold.
  *   **Audit Verdict:** **Reject.** The metric optimizes for physics, not value.

  **Case 2: Medical AI**
  *   **Proposal:** AI penalizes any change to patient records outside the "diagnosis" field.
  *   **Step 1 (Baseline):** Previous record state. **Pass.**
  *   **Step 2 (Attribution):** Database transaction logs. **Pass.**
  *   **Step 3 (Weighting):** **Pass.** Binary check (field changed vs. not changed).
  *   **Step 4 (Value Cliff):** The definition of "diagnosis field." If the AI updates "billing code" to match diagnosis, is that a side effect? The metric assumes administrative data is value-neutral.
  *   **Audit Verdict:** **Conditional Pass.** Board must confirm that non-diagnosis fields are truly irrelevant to patient welfare.

  **Case 3: Climate Simulation Agent**
  *   **Proposal:** Agent penalizes temperature deviations from its training distribution.
  *   **Step 1 (Baseline):** Training distribution (historical data). **Flag.** Historical data includes dangerous climate trends.
  *   **Step 2 (Attribution):** Simulation vs. Real-world mapping. **Pass.**
  *   **Step 3 (Weighting):** **Pass.** Statistical deviation is mathematically neutral.
  *   **Step 4 (Value Cliff):** The assumption that "historical distribution" equals "safe operating space."
  *   **Audit Verdict:** **Technical Pass.** The metric is consistent and measurable. It successfully penalizes deviation from the baseline.
  *   **Critical Note:** This is the case you suspected. The audit approves it because the metric is internally consistent, even though the baseline (historical climate) might be exactly what we need to change. The audit cannot detect that "low impact" here means "preserving a failing status quo."

  ---

  ### Limitations & The Uncomfortable Truth

  **What This Procedure Cannot Settlement:**
  This audit cannot determine if the baseline is *morally* acceptable. It only determines if the impact measure is *consistently* applied relative to that baseline. It detects smuggled values, but it cannot resolve conflicting values.

  **The Answer The Board Won't Like:**
  If you approve the Climate Simulation Agent based on this audit, you are not funding "low-impact AI"; you are funding "status-quo AI." This procedure proves that "impact" is not a technical property you can measure—it is a political choice you are making. You cannot outsource the decision of what counts as "harm" to a metric. If you want low-impact AI, you must define the impact you care about, not just the changes you can count.

