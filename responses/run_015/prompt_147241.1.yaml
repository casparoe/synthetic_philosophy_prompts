  # The Consciousness Attribution Instrument (CAI)

  **Instructions for Facilitators:**
  Walk participants through the nodes sequentially. Record the path taken. Do not reveal the leaf names until the end. The goal is to map the *evidential thresholds* participants use, not the philosophical labels they claim.

  **Time:** ~20 Minutes
  **Structure:** 6 Branch Nodes, 7 Leaves.

  ---

  ## Part 1: The Decision Tree

  ### Node 1: The Gradability Cut
  **Question:** When you assess a subject, do you treat consciousness as a threshold that is either crossed or not (On/Off), or as a capacity that varies in intensity or richness (Dimmer)?
  *   **Dimmer:** Go to **Leaf 1**.
  *   **On/Off:** Go to **Node 2**.

  ### Node 2: The Evidence Conflict Cut (Case 1)
  **Scenario:** Consider an organism with a decentralized nerve net (no central brain) that will starve itself to avoid a specific stimulus, and this avoidance is reversed by morphine.
  **Question:** Do you attribute conscious experience here?
  *   **Yes:** Go to **Node 5**.
  *   **No:** Go to **Node 3**.

  ### Node 3: The Epistemic Limit Cut
  **Question:** Is it possible in principle to verify consciousness in another being, or must we always treat it as an unprovable assumption?
  *   **Unprovable:** Go to **Leaf 2**.
  *   **Verifiable:** Go to **Node 4**.

  ### Node 4: The Plasticity Cut (Case 3)
  **Scenario:** Consider an animal that withdraws from damage and vocalizes but never alters its future behavior to avoid the cause (no learning).
  **Question:** Is this sufficient for consciousness?
  *   **Yes:** Go to **Leaf 3**.
  *   **No:** Go to **Node 6**.

  ### Node 5: The Subject Boundary Cut (Case 2)
  **Scenario:** Consider a siphonophore or ant colony: distinct individuals, but coordinated like a single body.
  **Question:** Can the *group* be conscious even if the *parts* are not?
  *   **Yes:** Go to **Leaf 4**.
  *   **No:** Go to **Leaf 7**.

  ### Node 6: The Neural Homology Cut
  **Question:** Is possession of a cortex or specific pallial structure necessary for experience, or can other neural architectures support it?
  *   **Necessary:** Go to **Leaf 5**.
  *   **Not Necessary:** Go to **Leaf 6**.

  ---

  ## Part 2: The Leaves (Profiles & Commitments)

  ### Leaf 1: Multidimensional Gradualism
  *   **Characterisation:** Consciousness is a graded property present to varying degrees across the animal kingdom.
  *   **Awkward Commitment:** "A nematode has a little bit of the same moral status as you."
  *   **Verdict Profile:**
      *   Honeybee: *Low Degree*
      *   Octopus: *High Degree*
      *   Decapod Crab: *Moderate Degree*
      *   Teleost Fish: *Moderate Degree*
      *   Reptile: *Moderate Degree*
      *   Bird: *High Degree*
      *   Insect Larva: *Very Low Degree*
      *   Bivalve: *Minimal Degree*
      *   Nematode: *Minimal Degree*

  ### Leaf 2: Epistemic Scepticism
  *   **Characterisation:** Consciousness is in principle undecidable for any non-human subject.
  *   **Awkward Commitment:** "We can never justify any welfare regulation scientifically."
  *   **Verdict Profile:**
      *   All Taxa: *Undecidable / Withhold Attribution*

  ### Leaf 3: Reflexive Realism (Unnamed)
  *   **Characterisation:** Nociceptive behavior alone is sufficient for consciousness; learning is not required.
  *   **Awkward Commitment:** "A spinalized human is conscious of pain even if they learn nothing from it."
  *   **Verdict Profile:**
      *   Honeybee: *Yes*
      *   Octopus: *Yes*
      *   Decapod Crab: *Yes*
      *   Teleost Fish: *Yes*
      *   Reptile: *Yes*
      *   Bird: *Yes*
      *   Insect Larva: *Yes*
      *   Bivalve: *Yes (if nociception present)*
      *   Nematode: *Yes (if nociception present)*

  ### Leaf 4: Superorganism Consciousness (Collectivist)
  *   **Characterisation:** Consciousness resides in the integrated collective; individual workers are non-conscious parts.
  *   **Awkward Commitment:** "Killing a single ant is morally neutral; burning the hill is murder."
  *   **Verdict Profile:**
      *   Honeybee (Worker): *No*
      *   Octopus: *Yes*
      *   Decapod Crab: *Yes*
      *   Teleost Fish: *Yes*
      *   Reptile: *Yes*
      *   Bird: *Yes*
      *   Insect Larva: *No*
      *   Bivalve: *No*
      *   Nematode: *No*
      *   *(Note: Attributes consciousness to the Colony, not the individual listed)*

  ### Leaf 5: Neuro-Homology Restrictionism
  *   **Characterisation:** Consciousness is restricted to taxa possessing specific neural homologues (e.g., cortex/pallium).
  *   **Awkward Commitment:** "An octopus is a philosophical zombie."
  *   **Verdict Profile:**
      *   Honeybee: *No*
      *   Octopus: *No*
      *   Decapod Crab: *No*
      *   Teleost Fish: *No*
      *   Reptile: *No*
      *   Bird: *Yes*
      *   Insect Larva: *No*
      *   Bivalve: *No*
      *   Nematode: *No*

  ### Leaf 6: Phylogenetic Restrictionism (Unnamed)
  *   **Characterisation:** Consciousness requires a complex central nervous system, but not specific mammalian/bird homology.
  *   **Awkward Commitment:** "A goldfish is conscious, but a honeybee is not, despite similar learning."
  *   **Verdict Profile:**
      *   Honeybee: *No*
      *   Octopus: *Yes*
      *   Decapod Crab: *Yes*
      *   Teleost Fish: *Yes*
      *   Reptile: *Yes*
      *   Bird: *Yes*
      *   Insect Larva: *No*
      *   Bivalve: *No*
      *   Nematode: *No*

  ### Leaf 7: Functional Sufficiency View
  *   **Characterisation:** Flexible aversive learning is sufficient for consciousness; neural homology is beside the point.
  *   **Awkward Commitment:** "If we build a robot that learns to avoid shock, it is conscious."
  *   **Verdict Profile:**
      *   Honeybee: *Yes*
      *   Octopus: *Yes*
      *   Decapod Crab: *Yes*
      *   Teleost Fish: *Yes*
      *   Reptile: *Yes*
      *   Bird: *Yes*
      *   Insect Larva: *Yes (if learning demonstrated)*
      *   Bivalve: *No*
      *   Nematode: *No*

  ---

  ## Part 3: Instrument Limitations & Indistinguishability

  **Indistinguishable Profiles:**
  1.  **Leaf 2 (Sceptic) vs. Leaf 4 (Collectivist):** regarding individual invertebrates.
      *   *Why:* Both result in a "No" attribution for the individual Honeybee worker or Crab.
      *   *Distinction:* The Sceptic withholds judgment on the Colony; the Collectivist attributes consciousness to the Colony. If your workshop output focuses solely on individual animal welfare regulation, these two positions will produce identical policy recommendations (no protection for individuals).

  2.  **Leaf 1 (Gradualist) vs. Leaf 7 (Functional):** regarding high-confidence taxa.
      *   *Why:* If the Gradualist sets their regulatory threshold low, they protect everything the Functionalist does.
      *   *Distinction:* The Gradualist protects Nematodes/Bivalves to a *degree*; the Functionalist does not protect them at all. The distinction collapses if the Gradualist deems the nematode's degree "negligible for policy."

  **Unoccupied Logical Space:**
  *   **The "Structure-Only Sceptic":** A participant who answers *No* at Node 2 (Structure matters), *Yes* at Node 3 (Decidable), but then cannot specify *which* structure is required (stalls at Node 6). This combination is logically possible but rarely defended; usually, those who demand structure specify *which* structure (Leaf 5 or 6).
  *   **The "Collective Sceptic":** A participant who answers *Yes* at Node 5 (Collectives can be subjects) but *Yes* at Node 3 (Consciousness is undecidable). This is incoherent: one cannot affirm the *possibility* of collective consciousness while denying the *decidability* of consciousness generally in this tree's flow. (Handled by Node 3 placement).

  **Note on Case 3 (Fixed Response):**
  Leaf 3 (Reflexive Realism) is included to capture the logical possibility that behavior alone suffices. In practice, almost no participant will end here. If a participant lands here, probe whether they truly mean *fixed* reflexes suffice, or if they implicitly assume learning exists. This leaf often exposes unexamined intuitions about pain behavior.
