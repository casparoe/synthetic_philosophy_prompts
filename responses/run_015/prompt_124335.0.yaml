answer: |-
  The full set is not jointly satisfiable under strict interpretation, as the demand for normative neutrality conflicts with the demand for a normative conclusion, making the 'No Normative Premises' requirement the most exclusionary.

  1.  **Target Specification:** The argument must target epistemic justification rather than moral truth directly or the mere contents of judgments. *Case:* Attacking truth directly commits the genetic fallacy; attacking only contents leaves realism intact if those contents remain justified by other means. *Status:* Non-negotiable.
  2.  **Content Sensitivity:** The genealogical story must be fine-grained enough to predict the content of the judgments we actually have rather than merely that we would have some moral judgments or other. *Case:* If evolution explains only a general capacity, the fit between specific moral beliefs and moral truths could be coincidental rather than systematically distorted. *Status:* Non-negotiable for global debunking; Preference for local debunking.
  3.  **Scope Limitation:** The argument must explain why the same style of explanation does not discredit perception, memory, logic, or the epistemic norms the argument itself invokes. *Case:* Without this distinction, the argument induces global skepticism that undermines the reliability of the reasoning used to formulate the debunking argument. *Status:* Non-negotiable.
  4.  **Normative Neutrality:** The argument must avoid normative premises that its own genealogy would undermine. *Case:* Using normative reasons to debunk normativity is self-defeating if those reasons are themselves products of the suspect genealogy. *Status:* Non-negotiable.
  5.  **Empirical Falsifiability:** If the argument makes an empirical claim, it must specify what finding (e.g., evidence that moral truths causally influenced survival) would refute it. *Case:* Ensures the argument is not metaphysically insulated from scientific update and respects the realist's grant of the empirical genealogy. *Status:* Preference of naturalist camp.
  6.  **Capacity Reply:** The argument must address the reply that selection shaped a general capacity for normative judgment rather than any particular judgments. *Case:* Realists argue evolution selected for truth-tracking generally; debunkers must show why moral faculties are exceptional or disconnected from this general capacity. *Status:* Non-negotiable.

  **Joint Unsatisfiability Flags:**
  *   **Normative Neutrality vs. Normative Conclusion:** The demand that the argument rest on no normative premises sits badly with the demand that it yield a conclusion about what we ought to believe; deriving an epistemic 'ought' typically requires normative premises, creating a self-defeat risk.
  *   **Global Scope vs. Content Detail:** Full generality across moral judgment sits badly with content-specific genealogical detail; explaining all morals globally often forces abstraction that loses the fine-grained predictive power required by Content Sensitivity.

  **Local vs. Global Debunking:**
  An argument that debunks only a proper subclass of moral judgment (purity, kin, punishment) faces a weaker list: Scope Limitation is easier to satisfy (isolating specific modules spares logic/perception), Content Sensitivity is easier (specific traits are empirically accessible), and Normative Neutrality is less fraught (does not threaten all reasoning). The local case is where the real work is because the desiderata change shape to become jointly satisfiable.

  **Scoring Contenders:**
  *   **Street (2006):** Fails Normative Neutrality (relies on instrumental rationality norms potentially vulnerable to genealogy); passes Content Sensitivity and Capacity Reply.
  *   **Joyce (Evolution of Morality):** Fails Scope Limitation (threatens practical reason broadly); passes Empirical Falsifiability and Target Specification.
