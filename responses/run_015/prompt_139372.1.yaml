      *   *Inconsistency:* Is a restaurant recommendation aesthetic? Yes. So why trust sister? Maybe intimacy > expertise.
      *   *Least Defensible:* The idea that aesthetic properties *cannot* be transmitted. The 500/500 friend proves they can be, at least probabilistically.

  9.  **Final Polish:** Check against the "Read Aloud" requirement. Short sentences. Clear headings. Direct answers.

      *Test Case 1 (Algorithm):* If it predicts *your* taste, it's like the friend. If it asserts *quality*, it's like the critic.
      *Test Case 2 (Inaccessible):* If it's about *experience*, he misses out. If it's about *knowledge*, he's stuck.
