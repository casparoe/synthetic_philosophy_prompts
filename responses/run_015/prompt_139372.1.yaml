      *   *Specific Focus:* Make sure the distinction between "Knowing it's good" and "Knowing *I* will like it" is clear. That's the crux of the 500/500 friend issue.

      *(Self-Correction during drafting)*: I need to be careful with Reading 4 (Prediction). If the friend predicts Dov's reaction, that *is* testimony about Dov's reaction, not testimony about the film's quality per se. That's a crucial distinction. "This film is good" vs "You will like this film." Dov accepts the latter (500/500 friend) but rejects the former (Critics). This is the key to saving him.

      *Revised Strategy for Dov:*
