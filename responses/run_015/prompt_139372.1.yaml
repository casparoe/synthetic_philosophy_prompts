      *   *Reading 3: The Psychological Block (No Belief via Testimony).* You can't even form the *belief* until you see it.
      *   *Reading 4: The Prediction Problem (Subjectivity).* Others can't predict *your* taste.
      *   *Reading 5: The Authority Distinction (Experts vs. Peers).* Critics don't count; friends do.
      *   *Reading 6: The Valence Asymmetry (Hate travels, Love doesn't).* Easier to trust negative warnings than positive raves.

  4.  **Evaluating Readings against Dov's Behavior:**
      *   *Dov's Stance:* Blocks film picks based on raves.
