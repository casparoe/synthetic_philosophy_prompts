      *   *Value Claim:* Knowing isn't the point; the *experience* is.
      *   *Predictive Claim:* Others can't predict *your* reaction.
      *   *Authority Claim:* Critics don't count, friends might.
      *   *Valence Claim:* Negative judgments transmit easier than positive ones (or vice versa).

  3.  **Drafting the Menu of Readings:**
      *   *Reading 1: The Truism (Experience is Irreplaceable).* Even if you know it's good, watching it is the point.
