  | **2. Dominance of Strategy** | "In any manipulable system, honest voting is strictly dominated; a rational agent *must* misreport preferences to maximize utility." | **False** | **No** | **Yes** (if accepted) | **Yes** |
  | **3. Computational Feasibility** | "In a group of size N=15, finding a beneficial strategic vote is computationally trivial and will be discovered by participants." | **Substantive-and-Defensible** | **Partly** | **Partly** | **Yes** |
  | **4. Scope (Ballot Type)** | "The theorem applies to all ballot types, including Approval or Score Voting, rendering them equally gameable as Ranked Choice." | **Contentious** (G-S 1973 is ordinal; Gibbard 1978 is broader but nuances exist) | **Partly** | **Partly** | **Yes** |
  | **5. The Random Escape** | "Gibbard (1977) proves Random Dictatorship is the *only* strategy-proof mechanism for single-winner selection; thus it is the unique solution." | **Substantive-and-Defensible** (with minor technical caveats) | **No** (implies a specific rule to pick) | **No** (in RD, honesty is optimal) | **N/A** (It *is* the escape) |

  **Bottom Line:** Acknowledge that manipulability is inevitable, so stop searching for a "perfect" rule and instead pick the one where gaming is most socially costly (e.g., public voting) or use Random Dictatorship if trust is truly low.
