  Anyway, my old colleague Jim is dying, and he's debating whether to spend his savings on this brain-scan startup that promises to build a "functional successor" — basically an AI that thinks like him and keeps publishing his papers. Jim says he's not afraid of death itself, since once he's dead there's no "him" to be harmed, which sounds like the Epicurean thing. But he also says the successor means he hasn't really "lost" his future, so spending the money makes sense. To me this sounds like he's smuggling in two different ideas about what makes a life go well: one where only your own experience matters, and another where it's about your projects continuing. Am I right that there's a tension here? Is his reasoning fair, or is he missing something about whether death can be bad for you even if you're not there to experience it?

  Please don't just give generic life advice — I want to know if there's a real philosophical knot in this situation.
