answer: |-
  Hi there, it is good to hear from you and this is exactly the kind of messy ontological puzzle I love digging into, so I am happy to help you untangle the knot here. I have spent some time with your cases and your proposed principle, and while your intuition about entitlements and the loss schedule is strong, I think we can sharpen it into something more robust that handles the edge cases you are worried about. To get there, I want to walk through three candidate principles that seem to be competing in your vignettes, critique them, and then settle on a view that I think captures the moral geometry of what you are describing. The first candidate is what I will call the Labor-Embedding View, which holds that the reality of a virtual object is constituted by the actual human labor sunk into it, meaning the grind-unique sword is real because of the four hundred hours, while the infinite-copy cosmetic is not because it required no exclusive effort. The second is the Institutional Positivist View, which argues that virtual objects are purely creatures of the loss schedule, so if the code permits the deletion, no wrong has occurred, and reality is just a matter of institutional status. The third is the Phenomenological Harm View, which suggests that reality tracks the actual suffering of the user, so the sexual harassment is real harm because it affects the body, while the sword is only real harm if the player cares enough to suffer.

  Each of these captures a piece of your verdicts but fails on others, and I think it is useful to see where they break before we commit. The Labor-Embedding View handles the grind-unique sword well but struggles with the phishing case, because when an account is phished, the labor isn't erased, only access is denied, yet you correctly identify that as theft rather than destruction. It also fails to distinguish the griefer from the operator, since both erase the labor equally. The Institutional Positivist View handles the operator deletion perfectly but collapses on the griefer case, because if the schedule permits PvP destruction, positivism says the griefer did nothing wrong, which contradicts your gut reaction that malice matters. The Phenomenological Harm View handles the sexual harassment and the cabin bug well, but it threatens to overturn your verdict on the in-game spouse, because if the player cries and can't sleep, phenomenology says that is real harm, yet you want to maintain a distinction between hurt and harm in that specific context. So we need a principle that respects the institutional framework but allows external moral norms to penetrate it when specific conditions are met, without collapsing into pure subjectivity.

  My favorite among these during the brainstorming phase was a hybrid of the first and third, which I tentatively called the Narrative Anchoring Principle, stating that an object is real to the extent it serves as a unique anchor for actual-world narrative identity, and wrongdoing occurs when an agent intentionally severs that anchor without institutional justification. However, I need to play devil's advocate against this view before I commit to it, because it risks being too vague for cold application. If reality depends on narrative identity, how do we measure it? Does the grind-unique sword have more narrative weight than the cabin? What if the griefer didn't know the sword was anchored to the player's identity? This principle might imply that destroying a random player's item is fine if they don't care enough, which seems to let griefers off the hook too easily, or it might imply that the in-game spouse breakup is real harm because the narrative was severed, which overturns your verdict there. It also struggles with the exploit case, because duplicating gold doesn't sever a narrative anchor for anyone specific, yet you feel it is wrong, just less wrong than phishing. So while Narrative Anchoring captures the spirit of the memorial case, it is too subjective to serve as a universal principle for property and loss.

  Instead, I want to commit to a principle I will call the Principle of Normative Friction and Irreversible Investment. This principle has two clauses. The first clause states that a virtual object is ontologically real in proportion to the irrecoverable actual-world investment required to restore its functional and historical state, meaning that hard-loss and grind-unique items are real because the time cannot be got back, while infinite copies are not. The second clause states that an action causing such loss is morally wrongful if and only if it bypasses the intended normative friction of the system to inflict negative affect, unless the action is performed by the operator for institutional maintenance. This distinguishes the griefer from the operator because the griefer uses the system's mechanics not for their intended purpose of competitive play but as a tool to inflict feelings, whereas the operator acts to maintain the institution itself. It handles the phishing case because phishing bypasses the friction of password security to transfer value, whereas the exploit bypasses the friction of grinding but does not violate another player's specific entitlement directly, which explains why you feel phishing is worse. It also handles the cabin bug as a real loss without wrongdoing because the loss meets the investment clause but no agent bypassed friction to cause it.

  Applying this cold to your new cases, the AI companion deleted by a patch is a real loss because the conversation history represents irrecoverable investment, but it is not wrongful if done for balance, though it would be wrongful if done malice. The entire world shutting down with notice is a real loss for all invested items, but not wrongful because it is institutional maintenance, provided the notice allows for closure. The copy of a destroyed item that is functionally identical is not a real loss if the historical data is not restored, because the investment was in the specific history of the object, not just its stats, so replacing a sword with a stat-identical sword is still a loss of the original history. I must be honest that this principle overturns one of your verdicts, specifically regarding the in-game spouse, because if the relationship involved significant irreversible investment of time and emotion, the Principle of Normative Friction suggests that dumping them is a real harm if done to inflict negative affect, though I would concede it is a harm of a different category than property loss, so perhaps we can keep your distinction by saying it is a harm to the person rather than the object. I also think it challenges your view on the exploit, suggesting it might be just as wrong as phishing if the economic damage is equivalent, since both bypass normative friction, but I accept your intuition that direct violation of another's account feels worse than inflating the supply.

  Now to the memorial case, which is the hardest test. A player builds a memorial room for their dead brother, containing the only existing messages from him, and a griefer demolishes it in a world where the schedule permits demolishing buildings. On my principle, this is a real harm, and it is of the same ontological kind as the sword loss but of a much higher moral magnitude because the irrecoverable investment is not just time but unique historical data that cannot be reground. The griefer is wrongful because even if the schedule permits demolition, using it to destroy a memorial bypasses the normative friction of building to inflict negative affect, which violates the second clause. If the operator purges abandoned structures on a routine sweep, the loss is still real but not wrongful, because the operator is performing institutional maintenance, though one might argue they owe a duty of care to check for high-investment structures before purging. This verdict holds even if the griefer didn't know it was a memorial, because the wrongfulness lies in the intent to destroy for the sake of destruction or affect, which is inherent in griefing, whereas the operator's intent is maintenance. So I think this principle gives you the tools to separate the reality of the loss from the morality of the agent, while grounding both in the actual-world investment and the purpose of the action.

  I hope this helps you settle the pile of gut reactions into something workable, and I think the key insight here is that virtual objects are not real because of code but because of the irreversible actual-world costs attached to them, and wrongfulness is about how those costs are imposed. Let me know if you think the distinction between institutional maintenance and malicious bypass holds up under further pressure, because I suspect the operator case might need a proviso about reasonable notice to fully protect the players. Best wishes with the paper.
