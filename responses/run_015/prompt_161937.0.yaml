answer: |-
  **Session: The Horizon Protocol**
  **Materials:** 
  *   4x Scenario Packs (one per table). Each contains: Round 1 Sheet, Round 2 "Method Card" (2x Card A, 2x Card B), Round 3 "Crowding Card".
  *   Whiteboard, markers. Calculators allowed.
  *   **Term Ban:** No "probability," "expected value," "longtermism," or "risk" until debrief. Use "Chance," "Score," "The Future," "Uncertainty."

  **Payoff Scheme**
  *   **Certain Option:** +1,000 Points.
  *   **Horizon Option:** Chance % × 10,000,000 Points.
  *   **Adjustment:** Final Score × (1 – Replacement Rate).

  **Timeline (75 mins)**

  **0–5: Setup**
  Divide into 4 tables (4 students each). Hand out Round 1 Sheets. 
  **Rule:** "Maximize the Final Score. Do not compare numbers with other tables."

  **5–15: Round 1 (Scale)**
  Sheet presents two options:
  1.  **Sure Thing:** 100% Chance of 1,000 Points.
  2.  **Horizon:** 1% Chance of 10,000,000 Points.
  **Task:** Calculate Expected Score. Choose one.
  *Predicted Outcome:* All tables choose Horizon (100,000 > 1,000). This establishes that magnitude outweighs certainty.

  **15–40: Round 2 (Construction)**
  **Task:** "The 1% Chance is not given. You must build it."
  Hand out **Method Cards** face down. 
  *   **Tables 1 & 2 (Card A):** "Broad Strokes. Identify max 3 critical conditions for success. Assign a % to each. Multiply them."
  *   **Tables 3 & 4 (Card B):** "Fine Grain. Identify min 5 critical conditions for success. Assign a % to each. Multiply them."
  *Secret:* This is the only variable. They believe they are choosing their own modeling style.
  **Task:** Estimate % for each condition (e.g., "Threat exists," "Solution works"). Multiply to get Total Chance. Recalculate Horizon Score.
  *Predicted Outcome:* Card A tables get high chances (e.g., 0.9³ = 73%). Card B tables get tiny chances (e.g., 0.9⁵ = 59%). Scores diverge by orders of magnitude. Some tables may switch to the Sure Thing.

  **40–55: Round 3 (Counterfactuals)**
  Hand out **Crowding Cards**. Each lists a "Replacement Rate" (e.g., 50%, 90%).
  **Task:** Adjust Final Score: Score × (1 – Replacement Rate).
  *Predicted Outcome:* A high Score becomes low Value if Replacement is high. Distinguishes cause importance from individual impact.

  **55–75: Debrief**
  Lift the term ban. Write "Longtermism," "Expected Value," "Epistemic Fragility" on the board.
  1.  **Scale:** Ask Round 1. Why did 1% beat 100%? (Stakes dwarf uncertainty).
  2.  **Structure:** Reveal Method Cards. Compare Round 2 Scores. Ask: "Did Table 3 know the future better than Table 1?" No. They chose different *structures*. The math wasn't wrong, but the *granularity* dictated the conclusion. This is the epistemic critique: your verdict depends on how you slice the uncertainty, not just your optimism.
  3.  **Counterfactuals:** Ask Round 3. Did high Score mean high Value? No. Overlap matters.
  4.  **Synthesis:** Strong Longtermism accepts the Scale (Axiology) but must survive the Construction (Epistemics).

  **Failure Modes & Fixes**
  *   **"It's Rigged":** Tables compare scores mid-session and feel manipulated. 
      *   *Fix:* Enforce silence between tables. Collect Method Cards before revealing the discrepancy. Frame the divergence as a feature, not a bug.
  *   **Analysis Paralysis:** Arguing over 80% vs. 90%. 
      *   *Fix:* Impose a 3-minute hard stop per condition. Remind them: "Precision is impossible; consistency is key."
  *   **Cynicism:** "All numbers are fake." 
      *   *Fix:* Agree. In debrief, say: "The numbers are placeholders. The lesson is that chaining guesses compounds error."

  **Limitations (Say this aloud)**
  "Expected Value works for casinos because they play a million hands. We play history once (N=1). You cannot verify this math empirically. You are building a compass, not a map. It tells you direction, not distance."

  **The One-Liner**
  "If the stakes are astronomical, ignoring them because the probabilities are uncertain is the bigger gamble."
