      *   *Key Feature 4 (Public Source Acquisition):* Can acquire (inadvertently) but not use.
          *   *Implication:* The *source* matters less than the *intent* and the *usage*. The information itself is toxic in employment contexts regardless of how it was found.
      *   *Philosophical Commitment:* GINA treats "genetic information" as a *social category* of risk, not strictly a molecular one. It presupposes that genetic data has a unique *predictive power* and *stigmatizing potential* distinct from other medical data.
