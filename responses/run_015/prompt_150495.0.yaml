answer: |-
  Based on the four verdicts provided, your colleague occupies a specific niche within structuralist historiography. She is not a "Hard Braudelian" in the sense of strict geographic determinism (where human agency and institutions are negligible), nor is she a conventional political historian. Instead, she appears to be an **Institutional Structuralist**.

  She treats human institutions as part of the *longue durée* **if and only if** they function as slow-moving, rigid constraints on agency (like the Tokugawa bureaucracy or the Roman fiscal system). She rejects *events* (specific battles, decisions, merchant networks) as explanatory causes, viewing them as symptoms of deeper structural pressures.

  Here is the prediction for her verdict on the Maya case, the reasoning behind it, and the case that would test her underlying rules.

  ### 1. The Verdict on the Classic Maya Collapse
  **Verdict:** She will argue that the **multidecadal drought and soil depletion were the necessary structural pressures**, but the **divine kingship ritual economy was the sufficient structural cause of the *political* collapse.**

  She will likely treat the warfare and dynastic failures as "surface foam" (events), similar to how she treated the specific rescue missions in Greenland or the political choices in the Sahel. However, unlike a hard geographic determinist, she will not dismiss the Maya political system as mere epiphenomena. She will classify the "divine kingship and monument-building ritual economy" as a **structural rigidity** (akin to the Tokugawa infrastructure or Roman fiscal divergence).

  **Her Reasoning (Reconstructed):**
  *   **The Environmental Base:** Following her Rome, Greenland, and Sahel verdicts, she will assert that the drought made the *status quo* physically untenable. The carrying capacity of the Petén was breached by slow-moving climate shifts.
  *   **The Institutional Mechanism:** Following her Meiji verdict, she acknowledges that institutions mediate environmental stress. She will argue that the Maya ritual economy was a **path-dependent trap**. Because legitimacy was tied to monument building and rain-making rituals, the kings could not pivot to survival strategies (like migration or decentralization) without losing legitimacy.
  *   **The Distinction:** She will distinguish between the *system* of kingship (structure) and the *specific wars* between Tikal and Calakmul (events). The system prevented adaptation; the wars were just the noise of the system breaking.

  **Summary:** For her, the drought created the crisis, but the institutional rigidity determined that the crisis would result in **collapse** rather than **adaptation**.

  ### 2. The Competing Rules
  To understand why this verdict distinguishes her from a pure determinist, we must articulate the two rules you identified:

  *   **Rule A (Hard Geographic-Climate Determinism):** Physical structures (climate, soil, geography) are the primary explanatory variables. Human institutions are secondary adaptations that rarely alter the ultimate outcome dictated by the environment.
      *   *Prediction on Maya:* The drought caused the collapse. The kingship is irrelevant; any society would have failed under that aridification.
  *   **Rule B (Institutional Path-Dependence):** Physical structures create the *context*, but long-term human institutions (bureaucracies, ritual economies, fiscal systems) create the *vulnerability*. Outcomes are determined by the interaction between environmental stress and institutional rigidity.
      *   *Prediction on Maya:* The drought caused the stress, but the kingship caused the collapse. A society with flexible institutions might have survived the same drought.

  Your colleague follows **Rule B**, but with a heavy weighting toward Rule A. She requires an environmental trigger (seen in all four cases), but she uses institutions to explain the *specific mode* of failure or success (e.g., why Meiji modernized vs. why Rome fractured).

  ### 3. The Adjudicating Case
  To definitively map where she draws the line between Rule A and Rule B, you need a case where **environmental stress is constant, but institutional architectures differ, leading to divergent outcomes.**

  **The Proposed Case: The 14th–15th Century Monsoon Shifts in Southeast Asia (Angkor vs. Ayutthaya)**

  *   **Context:** During the same period the Maya collapsed (and coinciding with her interest in the Sahel/Greenland climate shifts), the Greater Angkor region faced severe monsoon variability and drought.
  *   **The Divergence:**
      *   **Angkor (Khmer Empire):** Collapsed and was largely abandoned.
      *   **Ayutthaya (Siam):** Survived, adapted, and thrived during the same climatic period.
  *   **The Variables:**
      *   *Environment:* Both faced the same regional monsoon failures and hydrological stress.
      *   *Institutions:* Angkor relied on a massive, centralized **hydraulic network** tied to divine kingship (rigid infrastructure). Ayutthaya relied on **maritime trade networks** and a more flexible labor conscription system (mutable infrastructure).

  **How to Interpret Her Verdict:**

  1.  **If she cites the Monsoon Failure as the primary cause for Angkor's fall:** She is a **Hard Geographic Determinist (Rule A)**. She implies the environment was too severe for *any* regional society, and Ayutthaya's survival was luck or irrelevant. This would align her with her Greenland and Sahel verdicts.
  2.  **If she cites Angkor's Hydraulic Rigidity as the cause:** She is an **Institutional Path-Dependence Theorist (Rule B)**. She argues that the environment was the stressor, but Angkor's *specific structural investment* in fixed water infrastructure made it vulnerable, whereas Ayutthaya's trade-focused institutions allowed adaptation. This would align her with her Meiji and Rome verdicts.

  **Why this case works:**
  It isolates the variable she struggles with: **Human Infrastructure.** In her Greenland case, the Norse had no alternative but to leave (Determinism). In her Meiji case, the Tokugawa system enabled success (Institutionalism). The Angkor/Ayutthaya comparison forces her to choose: Did the climate kill Angkor, or did Angkor's *choice of infrastructure* kill Angkor? Her answer will reveal whether she views institutions as independent variables or merely dependent reflections of the environment.
