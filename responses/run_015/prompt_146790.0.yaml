      *   However, if the scoring function represents the *value of the outcome*, then $V(0.5, 0.5) > V(0.4, 0.4)$ because the function is increasing in QoL.
      *   The critic's point is likely: "It resists leveling down only because total well-being drops, not because equality is lost."
      *   I must clarify this distinction. The protocol resists leveling down *instrumentally* (via well-being loss), not *intrinsically* (via equality loss).

