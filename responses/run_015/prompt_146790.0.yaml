      *   If a gain at low $w$ counts *more* than a gain at high $w$, the moral value function $g(w)$ must be *concave* (diminishing marginal moral value).
      *   *Correction on Prompt Terminology:* The prompt calls it a "convex weighting function." In optimization, convex costs minimize variance. In moral philosophy, we usually talk about a *concave* transformation of well-being to moral value (Prioritarianism). If the *weight* assigned to the gain is higher at lower levels, the weight function is decreasing in $w$. Let's assume the prompt means the standard Prioritarian mathematical structure: Moral Value = $\sum g(w_i)$, where $g' > 0$ and $g'' < 0$.
      *   *Key Feature:* It cares about *gains* weighted by absolute level. It does not care about *gaps* between people.

  3.  **Task 1: Theory of Distributive Value:**

