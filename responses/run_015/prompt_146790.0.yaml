  5.  **Task 3: Meta-ethical View (Measurability):**

      *   **Cardinality & Interpersonal Comparability:** The system requires cardinal QoL (0.1 is a specific amount) and interpersonal comparability (0.1 for Patient A = 0.1 for Patient B).
      *   **Meta-ethics:** This presupposes **Welfarism** (well-being is the only thing that matters) and **Objectivism/Realism** about well-being (it can be measured on a common scale). It rejects strict ordinalism or radical subjectivism where comparisons are impossible.
