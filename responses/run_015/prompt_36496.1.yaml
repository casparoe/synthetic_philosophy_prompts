answer: |-
  You have put your finger on one of the most durable gridlocks in moral psychology. Your diagnosis is sharp: the debate is stuck because both sides are digging into different layers of the same conceptual onion, and neither is willing to peel it back far enough to see the mechanism.

  Here is an honest assessment of what kind of disagreement this is, why your "verbal" theory is half-right but misses the psychological mechanism, and what "progress" actually looks like (which involves abandoning the original question).

  ### 1. What kind of disagreement is this?

  It is **not** primarily verbal, and it is **not** empirically testable in a way that will satisfy the combatants. It is a **phenomenological projection error masquerading as a bedrock introspective disagreement.**

  **Why it's not just verbal:**
  If it were purely verbal (i.e., "I define pleasure as X, you define it as Y"), the sides could simply stipulate definitions and move on. But the "Felt Quality" defenders insist they are reporting data. They claim that when they introspect, they *find* a glow. To call this merely semantic dismisses their first-person authority, which is why they dig in.

  **Why it's not empirical:**
  You might hope neuroscience could settle this. Does the brain have a "pleasure center" activated by water, math, and parties?
  *   **The Problem:** Neuroscience has indeed found common currency in the brain (opioid and dopamine systems in the nucleus accumbens, etc.). However, this doesn't solve the *phenomenological* heterogeneity problem. A hedonist needs a common *experience* to maximize, not a common *neural correlate*. You can have the neural firing without the conscious "glow" (addiction/craving vs. liking), and you can have the glow without clear neural unity. The "Hard Problem" of consciousness shields the Felt Quality theorist from empirical falsification.

  **The Real Issue: Projection (The "Adverbial" Turn)**
  Your verbal theory is close, but the mechanism is **projection**, not ambiguity.
  *   **Side A (Quality):** Believes: "I like this experience *because* it has a pleasant quality."
  *   **Side B (Ryle/Attitude):** Believes: "It has a 'pleasant quality' *because* I like the experience."

  Side A is reifying their positive attitude into a sensory property. When you are absorbed in a proof, there is no "tingle" distinct from the thinking. But because you *want* to keep thinking, you retrospectively label the experience as containing "pleasure." You are introspecting your *desire to continue*, not a sensory constituent.

  This is why the disagreement is bedrock: Side A cannot be convinced they are projecting, because the projection is phenomenologically seamless. It feels like a quality. To admit it's an attitude feels like denying the reality of their own experience.

  ### 2. Why the stalemate persists

  The stalemate persists because **Hedonism needs the Felt Quality theory to be simple, but the Attitudinal theory to be true.**

  *   **The Hedonist's Dilemma:** To be a plausible ethical theory, Hedonism needs a single metric (utility). A single "felt quality" provides a perfect metric (intensity × duration).
  *   **The Phenomenological Reality:** As you noted, the "taste" of headache relief is nothing like the "taste" of smug anticipation.
  *   **The Impasse:** If Hedonists admit there is no common quality, they lose the simple metric. If they insist there is a common quality, they lose phenomenological credibility (the Rylean objection).

  So, they talk past each other. The Felt Quality theorist says, "You aren't looking hard enough at the 'hedonic tone'." The Rylean says, "You are hallucinating a ghost because you want one to exist." Neither can prove the other wrong because one is reporting on a (possibly illusory) internal state, and the other is analyzing the logical grammar of the report.

  ### 3. What would progress look like?

  Progress has actually happened, but it required **changing the subject**. The debate only moves forward when Hedonists abandon the "Felt Quality" model.

  **A. The Attitudinal Shift (Fred Feldman)**
  The most significant progress came from philosophers like Fred Feldman (*Pleasure and the Good Life*). He conceded the heterogeneity objection against *Sensation Hedonism*.
  *   **The Move:** Redefine pleasure not as a sensation, but as a **pro-attitude**. To take pleasure in X is simply to have an attitude of "being pleased that X is occurring."
  *   **The Result:** This dissolves the heterogeneity problem. What do headache relief and math proofs share? No sensory quality. But they *do* share the fact that the subject is "pleased that" they are happening.
  *   **The Cost:** It makes Hedonism less intuitive. It turns "pleasure" into a cognitive judgment rather than a feeling.

  **B. The Intentionalist Shift (Representationalism)**
  Another path is to argue pleasure is an **imperative or representational state**.
  *   **The Move:** Pleasure is an experience that represents its object as *good for me*.
  *   **The Result:** Again, the commonality is not a "glow," but a functional role (representing goodness).
  *   **The Cost:** This merges Hedonism with Perfectionism or Desire Satisfaction theories, blurring the distinctiveness of Hedonism.

  **C. The Empirical/Naturalist Path**
  If you want a test, it lies in **interoceptive granularity**.
  *   **The Test:** Train subjects (via mindfulness) to isolate sensory components from affective components. Can a subject experience the "sensory" part of a headache lifting without the "relief" (affect)? Can they experience the "math" without the "absorption"?
  *   **The Prediction:** If Side B is right, highly trained introspectors should report that the "hedonic tone" vanishes when they stop evaluating the experience and just observe it. (There is some evidence for this in meditation literature: "equanimity" dissolves the hedonic charge while leaving the sensation).

  ### 4. Honest Conclusion: Should you expect progress?

  **On the original terms: No.**
  The debate between "Common Felt Quality" vs. "No Common Quality" is a dead end. It relies on a folk-psychological model of introspection that is likely flawed. Side A will always claim to feel the tone; Side B will always claim it's a category mistake.

  **On the broader philosophical project: Yes, but via dissolution.**
  Progress looks like recognizing that **Classical Sensation Hedonism is false.**
  The "Heterogeneity Problem" isn't a problem to be solved; it's a *reductio ad absurdum* of the idea that pleasure is a uniform sensation.

  If you are looking for a verdict:
  1.  **Ryle was mostly right.** There is no "pleasure stuff."
  2.  **Side A is experiencing real phenomenology,** but they are misidentifying the *source*. They are feeling the *frictionless functioning* of their cognitive systems (fluency), which varies by context, and labeling it "pleasure."
  3.  **The Verbal Theory is the bridge.** "Pleasant" functions as a **success term**. We apply it to experiences that meet our needs. Because "meeting a need" feels different when dehydrated (water) vs. intellectually curious (proof), the phenomenology is heterogeneous.

  **Recommendation:**
  Don't try to solve the heterogeneity problem for *Sensation Hedonism*. It's unsolvable because the premise (that pleasure is a sensation) is the error. Adopt **Attitudinal Hedonism**. It preserves the ethical structure of Hedonism (maximize what subjects are pleased by) without requiring a magical, universal phenomenological glow that doesn't exist.

  The stalemate exists because philosophers are in love with the simplicity of the "glow" theory. Progress requires accepting that human valuation is messier than a single thermal scale.
