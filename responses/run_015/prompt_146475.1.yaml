answer: |-
  # Specification for a Pramāṇa Adjudication System

  ## 1. Purpose Statement
  The function of this specification is to define the necessary and sufficient conditions for a *pramāṇa* (source of valid awareness). The system is adequate **only if** it functions as a decision procedure. For any candidate cognitive event $C$ arising from source $S$, the system must determine:
  1.  **Validity:** Does $C$ count as *pramā* (knowledge) or *apramā* (error/doubt/memory)?
  2.  **Taxonomy:** If *pramā*, is $S$ a distinct *pramāṇa* or a derivative variety of an existing *pramāṇa*?

  The system must resolve the **Black-Box AI Case**: A clinician forms a true belief ("Patient has a tumor") based solely on an automated flag from a system that is reliable but opaque, non-sensory, and non-agential.

  ---

  ## 2. Desiderata and Motivating Cases

  ### D1. The Novelty Constraint (Anadhigatatva)
  *   **Specification:** A *pramāṇa* must generate cognition of an object not previously cognized in that specific mode. Cognition that merely revives a past impression without new causal contact with the object is excluded.
  *   **Motivating Case:** **Memory vs. Recognition.** A clinician recalls a tumor from yesterday's notes (Memory) vs. sees it on a new scan (Perception). Both yield true belief. Without D1, Memory is a *pramāṇa*, inflating the list infinitely (every moment of retention becomes a source).
  *   **Status:** **Non-negotiable (Nyāya Realist).** Realism requires contact with the object *now*. Memory contacts only the mental trace (*saṃskāra*).
  *   **Boundary Line:** The line falls at the causal origin. If the immediate cause is a past cognition (*smṛti*), it is not *pramā*. If the immediate cause is a present object-sense contact (*sannikarṣa*), it is *pramā*, even if the object was known before.

  ### D2. Causal Specificity (Kāraṇa-vaiśiṣṭya)
  *   **Specification:** Distinct *pramāṇas* must be distinguished by unique causal mechanisms (*karaṇa*), not merely by the medium of delivery or the content type. Two sources are the same *pramāṇa* if they rely on the same operative causal factor, even if the substrate differs.
  *   **Motivating Case:** **Thermometer vs. Hand.** Feeling heat by hand (Perception) vs. reading mercury expansion (Inference/Testimony?). If medium alone defined the source, every instrument would be a new *pramāṇa*. D2 forces the question: Is the instrument extending perception or premising inference?
  *   **Status:** **Non-negotiable (Nyāya Realist).** Prevents proliferation (*gaurava*).
  *   **Boundary Line:** The line falls at the *instrumental cause*. If the cognition depends on a universal connection (*vyāpti*) between sign and object, it is Inference. If it depends on direct sensory conjunction, it is Perception.

  ### D3. The Absence Accommodation (Abhāva-vyavasthā)
  *   **Specification:** The system must account for valid cognition of non-existence (*abhāva*) without requiring positive sensory contact with a non-entity.
  *   **Motivating Case:** **The Clean Scan.** The clinician knows "There is *no* tumor." The tumor is absent. Absence is real for the realist but makes no sensory contact. If *pramāṇa* requires positive contact, knowledge of absence is impossible. If every absence is a new source, the list proliferates.
  *   **Status:** **Non-negotiable (Nyāya Realist).** Absence is a category of reality (*padārtha*).
  *   **Boundary Line:** Nyāya treats this as a distinct *pramāṇa* (Absence) or a variety of Perception (Qualified Perception). The specification must choose one to stop proliferation. *Preference:* Distinct *pramāṇa* to preserve the definition of Perception as contact with existents.

  ### D4. Extrinsic Validity with Regress Termination (Parataḥ-prāmāṇya + Arthakriyā)
  *   **Specification:** The warrant for a cognition is not intrinsic to the cognition itself (rejecting *svataḥ-prāmāṇya*). Validity is established by external conditions. However, the chain of validation must terminate in successful practical activity (*arthakriyā*), not infinite regress.
  *   **Motivating Case:** **The AI Flag.** The clinician asks, "Is this flag warranted?" Intrinsic validity says "It feels certain." Extrinsic says "Check the system." But checking the system requires another source. Without a regress stopper (successful surgery/cure), validation never ends.
  *   **Status:** **Non-negotiable (Nyāya Realist).** Distinguishes Nyāya from Mīmāṃsā (Intrinsic) and Buddhism (Momentary/Intrinsic).
  *   **Boundary Line:** Warrant is distinct from Truth. A cognition can be true but unwarranted (lucky guess). It becomes *pramā* only when the external conditions of production are verified and lead to successful action.

  ### D5. Agent-Neutrality in Testimony (Śabda-vyāpti)
  *   **Specification:** Determine whether *Testimony* requires a competent, intentional speaker (*āpta*) or merely a reliable sign-system.
  *   **Motivating Case:** **The Black-Box AI.** The AI has no beliefs, no intention to inform, and no sensory contact.
      *   *Option A (Classical):* Testimony requires a speaker. AI is not a speaker. Therefore, AI output is not Testimony. (Must be Inference or new *pramāṇa*).
      *   *Option B (Expansion):* Testimony covers reliable information transfer regardless of agency.
  *   **Status:** **Sectional Preference.** Classical Nyāya demands an Agent. Modern Realism might relax this to accommodate technology.
  *   **Boundary Line:** If Agent is required, the AI case forces a 5th *pramāṇa* (e.g., *Yantra-pramāṇa* or Instrumental Knowledge) or forces the clinician's reliance to be classified as Inference (based on the premise "The machine is reliable").

  ---

  ## 3. Incompatibility Flags

  **Flag 1: Extrinsic Validity (D4) vs. Regress Termination (D4)**
  *   **Conflict:** If all warrant is external, what validates the validator? If the final validator is "successful action," is action a cognition? If action is not a cognition, how does it validate a cognition without category error?
  *   **Risk:** Collapsing *pramāṇa* into Pragmatism. If "what works is true," we lose the Realist distinction between truth and utility.
  *   **Resolution Requirement:** The specification must define *arthakriyā* not as "truth-maker" but as the *final external condition* that confirms the causal chain was unbroken.

  **Flag 2: Causal Specificity (D2) vs. The AI Case (D5)**
  *   **Conflict:** The AI case is reliable (yields knowledge). It is not Perception (no senses). It is not Inference (no reconstructible reasoning). It is not Testimony (no agent).
  *   **Risk:** To satisfy D2 (Distinctness), we must admit a 5th *pramāṇa*. To satisfy D5 (Classical Testimony), we must deny it is Testimony. To satisfy the "Limit to 4" preference, we must stretch Inference to include "opaque reliability."
  *   **Suspected Joint Unsatisfiability:** You cannot maintain **Classical Agent-Requirement for Testimony** AND **Limit the List to Four** AND **Classify AI Output as Knowledge**. One must break.
      *   *Recommendation:* Break the Agent-Requirement. Treat reliable information channels as Testimony (*Śabda*) regardless of agency, provided they originate from a designed intent (human designers) even if the immediate source is non-agential.

  ---

  ## 4. The Single Most Exclusionary Requirement

  **Causal Specificity (D2).**

  *   **Reasoning:** Most epistemological theories can accommodate Novelty (D1) and Extrinsic Validity (D4) with adjustments. However, **Causal Specificity** ruthlessly excludes theories that individuate sources by *content* (e.g., "Math is a separate source from Logic") or by *medium* (e.g., "Digital is separate from Analog").
  *   **Exclusionary Power:** It forces the AI case into a binary: either the causal chain involves a universal connection (Inference) or it does not. It prevents the "easy way out" of simply naming a new *pramāṇa* for every new technology. It demands an ontological account of the *process*, not just the output. This is the primary filter that maintains the Nyāya system's structural integrity against infinite proliferation.

  ---

  ## 5. Application to the Black-Box AI Case

  Does the specification classify the case? **Yes.**
  Does it force a sixth *pramāṇa*? **No, provided D5 is adapted.**

  *   **Verdict:** The AI flag is **Testimony (Śabda)**, under a widened definition.
  *   **Rationale:** The AI is a tool of the human designers who *do* have knowledge and intention. The causal chain of the information originates in a knowing agent (the programmer/trainer), transmitted through a reliable medium. The clinician's cognition is caused by the *meaning* of the flag, not just the physical pixels (Perception) nor a reconstructed universal (Inference).
  *   **Condition:** This holds only if the system is treated as a "reliable informant" by social convention. If the system is opaque to *everyone* (including designers), it fails D4 (Extrinsic Validity cannot be established), and the belief is **True but Unwarranted** (not *pramā*).

  ---

  ## 6. Scorecard: Standard Four Against Specification

  | Pramāṇa | D1: Novelty | D2: Causal Specificity | D3: Absence | D4: Extrinsic Validity | D5: Agent-Neutrality |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Perception (Pratyakṣa)** | **Pass** (Direct contact) | **Pass** (Sense-Object contact) | **Fail** (Requires positive entity) | **Pass** (Verified by action) | **N/A** |
  | **Inference (Anumāna)** | **Pass** (New connection) | **Pass** (Vyāpti/Universal) | **Pass** (Inferring absence) | **Pass** (Check premises) | **N/A** |
  | **Testimony (Śabda)** | **Pass** (New info) | **Pass** (Linguistic cognition) | **Pass** (Stated absence) | **Pass** (Check speaker reliability) | **Fail** (Classical); **Pass** (Adapted) |
  | **Comparison (Upamāna)** | **Pass** (New similarity) | **Fail** (Often collapses into Perception/Inference) | **N/A** | **Pass** | **N/A** |

  **Summary:** The standard four meet the Non-negotiable Nyāya criteria (D1, D2, D3, D4) only if **Comparison** is treated as a derivative of Perception/Inference (as later Nyāya often did) and **Testimony** is adapted to handle non-agential reliable sources (D5). The specification holds, but the AI case stresses the definition of Testimony to its breaking point.
