answer: |-
  Good evening. For those who don't know me, I'm one of the history and philosophy students upstairs. I spend most of my time in the archives, which means I'm usually the person brought in to tell the builders that they've forgotten what happened last time. But tonight, I'm told to be shorter and warmer. I'll do my best.

  It is a genuine privilege to stand here between the people who have spent decades editing Turing's papers and the people who are about to build the next generation of his ideas. And, of course, to welcome our donors and the Dean. I know the instruction for this slot was to make you feel good about the cheque. I intend to do that. But to do it properly, I need to talk about a part of Turing's 1950 paper that almost everyone ignores.

  You know the imitation game. You know the question "Can machines think?" But my dissertation focuses on the final section of that paper. It is not a footnote. It is a substantial passage near the end, and it is about extrasensory perception.

  Here is the situation. Turing looks at the statistical evidence for telepathy and clairvoyance available in 1950. He writes that he expected scientists to dismiss it, but was surprised to find they did not. He says the evidence looks, to him, overwhelming. He concludes that telepathy, clairvoyance, precognition, and psychokinesis are probably real.

  We know now that he was wrong about the world. The evidence does not hold up. Telepathy is not real. But I am not standing here to rescue Turing from the accusation of credulity. I am standing here to argue that what he *did* with that belief was brilliant, and it is the part we should be emulating in this new lab.

  Most people, upon believing something that strange, would either write a manifesto or hide it in a drawer. Turing did neither. He asked a methodological question. He asked: If ESP is real, what does that do to my test?

  His answer was immediate and rigorous. If the human competitor in the imitation game can read the interrogator's mind, or see the questions through a wall, then the human has an information channel that the machine does not have. The test is no longer fair. The score means nothing. Therefore, he says, the game would have to be run in a shielded room, built to whatever standard the telepathy researchers themselves would accept.

  He treats ESP not as a threat to his thesis, but as a threat to the validity of his experiment. He is willing to follow the evidence wherever it goes, even into the paranormal, but he insists that the rules of the test must hold firm regardless of what is found.

  There is a lesson here for the engineers and students in the room, and I want to make sure it lands for everyone, including our donors.

  Turing's concern was about the integrity of the evaluation. He was worried about a system under test gaining access to information the evaluation was never supposed to hand it. Think of it like this: Imagine you are administering an exam to a student. The test is designed to see if they understand the material. But if that student has somehow seen the answer key beforehand, the test is broken. It doesn't matter how smart the student is; the score is useless.

  Turing was insisting, in 1950, that you cannot trust the output of a system if you haven't strictly controlled the input. He wasn't predicting modern data leakage. He was insisting on a fundamental principle of science: that the boundaries of the test must be secure, or the result is a fiction.

  Now, I need to touch on something delicate. Turing writes in that section that the implications of ESP are "too disturbing to sit with." He is genuinely frightened by what it would mean for physics, for causality, for our understanding of nature.

  We know, looking back from outside this room, that Turing lived with many kinds of disturbance. We know how his story ends. But I am not going to splice those two things together. It would be grotesque to suggest that his fear of telepathy was a coded message about his persecution. It wasn't. It was an intellectual fear. He was scared that the laws of the universe might be stranger than he could accommodate.

  And yet, he didn't look away. He didn't say, "This is too weird, I'll ignore it." He said, "If this is true, I must adjust my method to account for it." That is a specific kind of courage. It is the courage to let your experiment be complicated by the world, rather than forcing the world to fit your experiment.

  This brings me to why we are here tonight. We are launching a new lab. There are engineers here who will build systems that learn, and donors here who make that possible. There are historians here who will remember how it happened.

  The chair asked me to make you feel good about the funding. Here is why you should.

  We are not funding this lab simply to build faster machines or smarter models. We are funding it to build better tests. We are funding the shielded room. We are funding the rigor that says, "We will not accept a result until we know the boundaries of the test were secure."

  There are people in the world who think science is about proving you are right. Turing shows us that science is about ensuring that when you are wrong, you know it quickly. This lab, if it follows his example, will not just be a factory for new capabilities. It will be a guardian of validity.

  So, to the donors: You are not just buying technology. You are buying integrity. You are buying the space for researchers to ask the disturbing questions, to check the shielded room, to ensure that when we say a system works, it actually works, and not just because it peeked at the answers.

  And to Alan Turing, wherever he is in the history we share: We are still trying to run the game fairly. We are still trying to build the room secure enough to hold the truth.

  Happy Birthday. And please, enjoy your dinner.
