  **Note on the Decision Theory**

  **Settled:** It is widely accepted in formal decision theory that if an agent has an unbounded utility function and assigns non-zero credence to hypotheses with sufficiently heavy-tailed payoffs (like infinite utility), the expected value calculation can be swamped by these low-probability, high-impact scenarios. This renders ordinary reasoning unstable (the "swamping" problem).

  **Contested:** The coherence of infinite utility itself is debated. Some theorists argue infinite values should be treated as limits of finite sequences rather than actual arithmetic values, which would prevent the summation from diverging. Others argue for bounded utility functions to avoid the fanaticism entirely.

  **Liberties Taken:** The poem treats self-calibration as generating an actual infinite regress of *bets*. In standard epistemology, higher-order uncertainty (uncertainty about one's own credences) usually leads to imprecise probabilities or dilation, not necessarily an infinite stack of wagers. The poem also compresses the distinction between "undefined expectation" and "infinite expectation" for the sake of the refrain. Also, I left "showd" and "calibratd" rough—decision theory is clean, but agents aren't.
