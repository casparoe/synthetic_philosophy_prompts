  2.  **Deconstruct the Philosophical Core:**
      *   The "separateness of persons" objection (Rawls/Nozick) argues that utilitarianism treats society as a super-person, sacrificing one for the greater good in a way that is permissible within a single life (present sacrifice for future gain) but impermissible across distinct lives.
      *   The user's specific twist: The "rotating loss" scenario. If everyone loses sometimes and gains sometimes, does the distinction between persons matter less? It looks like inter-temporal choice for a single entity (the community).
      *   The user's discomfort: Likely stems from the *nature* of the loss (hospice transport vs. diabetes screening). One is about dignity/end of life, the other about prevention/stats. The QALYs might match, but the *distribution* of burden feels wrong.
