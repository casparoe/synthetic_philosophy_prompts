answer: |-
  Dear colleague, it is entirely understandable that you feel a lingering discomfort about that previous vote, and frankly, it is a good sign that the arithmetic did not silence your conscience. You are asking for a way to translate a philosophical objection about the separateness of persons into a practical deliberation for a group of smart, pragmatic people who trust the numbers. The challenge is to move them from seeing aggregation as the definition of rationality to seeing it as a tool that has limits, without collapsing into vague sentimentality. To do this in ninety minutes, you need to be extremely disciplined about the example you use, the order in which you introduce complications, and the specific misconceptions you dismantle along the way.

  The carrying example you construct is the engine of this session, and it needs to be designed with surgical precision to prevent the group from defaulting to their professional habits. You should leave out identified individuals entirely. If you name specific people who will lose the hospice transport, the solicitor and the councillor will instinctively shift into advocacy modes for those constituents, and the actuary will dismiss their reactions as bias toward the identifiable victim. You want the objection to hold even for statistical groups. Similarly, you should leave out death if possible. Death tends to shut down the QALY conversation because it reduces future quality-adjusted life years to zero, making the trade-off look like life versus health, which is too stark and invites a different kind of moral panic. Instead, the example should involve two groups of statistical patients where one group suffers a concentrated loss of a specific capability, such as the ability to die at home or maintain dignity in dependency, while the other group receives a diffuse gain in preventive health metrics. The loss must be concentrated rather than numerous and small, because the separateness of persons objection gains its force from the intensity of the burden on the individual, not the sum of the burdens. If everyone loses a little, aggregation feels fairer; if one group loses everything that matters to them while another gains many small comforts, the distinctness of their claims becomes visible. The example must contain goods that are not easily fungible. If the loss is money and the gain is money, the rotation argument works. If the loss is dignity at the end of life and the gain is reduced diabetes risk, the rotation argument fails, and that is where your leverage lies.

  Before this complaint can sound like a principled objection rather than mere squeamishness about trade-offs, certain dependencies must be in place. You must first secure their agreement that resources are strictly constrained and that the choice is real; if they believe a clever accounting trick can fund both, the philosophical point evaporates. Second, you must establish that the utilitarian calculation is clear and robust. If the QALY arithmetic is close, they will treat your objection as a tie-breaker, but you need them to see it as a challenge to the tie-breaker itself. The discomfort must arise precisely when the math is winning. Third, you need them to acknowledge that the losers are not responsible for their position. If the losing group is perceived as having chosen their risk, the group will feel less obligation to protect them. Once these three conditions are met—scarcity, clear arithmetic, and non-culpability—you can introduce the friction.

  You should sequence the defusing of misconceptions carefully to avoid early deadlock. The thought that this is just the trolley problem dressed up should be defused almost immediately, in the first fifteen minutes. The trolley problem is about emergency intervention and direct harm, whereas your committee is making policy about allocation and letting happen. If you let them frame this as a trolley problem, the GPs and actuary will dismiss it as irrelevant to budgetary planning. You need to clarify that this is about whether the unit of accounting is the person or the population, not about whether it is permissible to push a fat man. The misconception that this is just deontology versus consequentialism should be addressed in the middle of the session. They will want to categorize you as a rule-worrier who cares more about principles than outcomes. You need to explain that you care deeply about outcomes, but you dispute how outcomes are summed. It is not about following a rule against sacrificing others; it is about recognizing that a loss to one person is not cancelled out by a gain to another in the way that a loss today is cancelled by a gain tomorrow for the same person. The misconception that this is really only a demand to weight the worse off should be raised later, once they are trying to solve the problem. They will suggest adding a multiplier to the QALYs of the disadvantaged. You must explain that weighting is a technical fix within the same aggregative framework, whereas the separateness objection is a structural limit on aggregation itself. No amount of weighting justifies sacrificing a fundamental claim of one person for the aggregate comfort of others if that claim is of a different category.

  The most critical structural wrinkle, the rotating ten-year plan, must be raised at the right point in the sequence, which is after they have grasped the basic objection but before you ask for a vote. If you raise it too early, they will use it to dismiss the objection entirely, arguing that since everyone loses sometimes, the community is just like a single person saving and spending over time. You need them to feel the force of the individual loss first. When you do introduce the rotation argument, you should guide them to see that thinking it through should make them more sympathetic to the objection, not less. The reason is that the rotation argument assumes fungibility across time and goods. It assumes that losing dignity at death in year three can be compensated by gaining better diabetes screening in year seven. But if the goods are incommensurable, as your example should establish, then the compensation is impossible. A person cannot enjoy better diabetes screening if they are dead, and they cannot enjoy a dignified death if they were forced into an institution years prior. The rotation plan treats the community as a single life, but the individuals within it experience distinct, non-transferable life stages. Recognizing that the compensation is false deepens the objection, because it shows that the aggregation is hiding a permanent loss for specific people that no future gain for them can erase.

  To distinguish someone who has actually grasped the point from someone who has only learned to repeat that you may not add people together, you should put one question to them at the end. Ask them whether they would accept the trade if the losers were guaranteed to be compensated later with an equivalent QALY value of a different kind. Someone who has only memorized the rule will say no because the rule says no aggregation. Someone who has grasped the point will say no because the specific loss cannot be redeemed by a different gain, recognizing that the objection is about the nature of the claim, not the math of the sum. They should understand that the problem is not the addition, but the substitution of one person's good for another's.

  Finally, you must be plain about what you should openly refuse to settle in ninety minutes. You cannot and should not try to produce a new formula or a replacement algorithm for the QALY. If you try to solve the allocation problem definitively, you will fail, and the actuary will dismantle your proposed weights. Instead, refuse to settle on a mechanism for resolution. Your goal is to introduce a veto or a pause, not a new calculation. You should state clearly that the aim of the session is not to agree on how to count, but to agree that there are some counts we should not make. Admitting that you do not have the perfect alternative protects you from being attacked on technical grounds and keeps the focus on the ethical limitation you are proposing. If you can get them to vote with the understanding that the arithmetic is necessary but not sufficient, and that there are claims which cannot be overridden by aggregate sum even in a rotating system, you will have succeeded in giving voice to that discomfort you have been carrying.
