      *   **Constraint 1 (Structural Wrinkle):** The foundation serves a small, stable catchment population on a rolling 10-year strategy. Sub-groups who gain/lose rotate. Over the decade, roughly the same people are on the losing side of some decisions and winning side of others. This challenges the standard "one-off choice" framing.
      *   **Constraint 2 (Content):** Tell me what the carrying example must contain and leave out (identified vs. statistical, small/numerous vs. concentrated losses, death involved or not, etc.).
