          4.  Application to Case 2.
          5.  Limitations & Failure Modes.
      *   *Key Insight to Embed:* Solomonoff Induction implies we should average *all* models weighted by complexity. Since we can't do that, we must select the model that minimizes expected loss *given our uncertainty*. With low data, uncertainty is high, so the penalty for complexity must be high.
      *   *On `gzip`:* Be clear. It measures file size, not VC dimension. It's a proxy for *implementation* complexity, not *statistical* complexity. Use it to catch "spaghetti code," not overfitting.

  7.  **Self-Correction/Review during drafting:**
