answer: |-
  ### Part 1: Translating Theory into Practice

  Before the checklist, we must clear the air on the theory your team is debating. You cannot run Solomonoff Induction, and your teammate's `gzip` idea is dangerous if misunderstood. Here is the operational truth:

  1.  **Kolmogorov Complexity (K) is Uncomputable:** You cannot calculate the shortest program that generates your data. More importantly, K measures the complexity of the *data string*, not the risk of the *model*. A model can have a short code description (low K) but massive statistical capacity to overfit (high VC dimension).
  2.  **The `gzip` Proxy:** Using file size as a proxy for K is **admissible only as a sanity check for implementation complexity**, not statistical complexity. A one-line equation `y = ax + b` compresses tiny, but if `a` and `b` are tuned to noise on 20 data points, it is statistically dangerous. Conversely, a 500-line script that implements a rigid physical law might be statistically robust. **Verdict:** Use `gzip` to detect "spaghetti code" or hardcoded constants, but never to justify predictive reliability.
  3.  **Occam's Razor in ML:** The surviving principle is **Regularization via Data Regime**. Simplicity is not inherently virtuous; it is a hedge against variance when data is scarce. As $N$ (data points) grows, the penalty for complexity should shrink. With $N$ small, the penalty must be severe.
  4.  **Solomonoff's Lesson:** Ideally, you would average predictions from all models weighted by their complexity. Since you must pick one, you are picking the model that minimizes *expected loss under uncertainty*. With limited data, uncertainty is high. Therefore, the "cost" of being wrong with a complex model (which can fail wildly out-of-sample) outweighs the "cost" of being wrong with a simple model (which usually fails gracefully).

  ---

  ### Part 2: The 90-Minute Model Selection Procedure

  **Role:** Team Lead
  **Timebox:** 90 Minutes
  **Inputs:** Historical claims, satellite indices, candidate models (Simple vs. Complex).
  **Outputs:** 1. Adopt Complex, 2. Adopt Simple, 3. Stop (Insufficient Data), 4. Handoff (CRO/Values).

  #### Phase 1: The Data Regime Check (20 Minutes)
  *Goal: Determine if the data supports the complexity of the flexible model.*

  1.  **Calculate Effective $N$:** Count the number of *independent* loss events or observation periods, not rows in a dataframe. (e.g., 3 years of weekly data with serial correlation $\neq$ 156 independent points).
  2.  **Calculate Feature Ratio:** Divide Effective $N$ by the number of effective parameters (for GBT, estimate trees $\times$ depth; for neural nets, weights; for linear, features).
  3.  **Decision Rule:**
      *   If Ratio $< 10$: **Stop.** Data is too sparse for the complex model. Proceed to Phase 4 (Default to Simple or Handoff).
      *   If Ratio $10 - 50$: **Caution.** Complex model allowed only if it passes Phase 2 with a high margin.
      *   If Ratio $> 50$: **Proceed.** Complex model is statistically permissible.

  #### Phase 2: The Out-of-Sample Gap (30 Minutes)
  *Goal: Replace the arbitrary 0.02 Brier rule with a significance-adjusted threshold.*

  1.  **Run Rotating-Origin Backtest:** Ensure the test periods are temporally out-of-sample (no shuffling).
  2.  **Calculate Performance Gap ($\Delta$):** $Score_{complex} - Score_{simple}$.
  3.  **Calculate Variance of the Gap:** Use the standard deviation of the fold differences.
  4.  **Decision Rule:**
      *   Is $\Delta$ statistically significant (p < 0.1)? If **No**, **Adopt Simple**. (Occam's Razor: no evidence to justify complexity).
      *   If **Yes**, is $\Delta$ practically significant? (Does it change pricing decisions materially?).
      *   **The Complexity Penalty:** If Effective $N$ is low (from Phase 1), require $\Delta$ to be $2\times$ the historical standard deviation of the score. If $N$ is high, $1\times$ is sufficient.

  #### Phase 3: The Stability & Shift Check (25 Minutes)
  *Goal: Assess robustness to regime change (climate/peril shift).*

  1.  **Stress Test:** Perturb the input indices by $\pm 10\%$ (simulating satellite drift or climate shift).
  2.  **Compare Sensitivity:** Does the complex model's output variance increase significantly more than the simple model's?
  3.  **Interpretability Check:** Can you explain *why* the complex model made its worst error in the backtest in 5 minutes?
      *   If **No**: Flag as "Black Box Risk."

  #### Phase 4: The Decision Matrix (15 Minutes)
  *Goal: Final verdict or escalation.*

  | Phase 1 (Data) | Phase 2 (Fit) | Phase 3 (Stability) | **Decision** |
  | :--- | :--- | :--- | :--- |
  | **Low Ratio** | Any | Any | **Adopt Simple** (Unless CRO overrides) |
  | **High Ratio** | Complex Wins Sig. | Stable / Explainable | **Adopt Complex** |
  | **High Ratio** | Complex Wins Sig. | Unstable / Black Box | **Handoff to CRO** |
  | **Low Ratio** | Complex Wins Sig. | Any | **Handoff to CRO** (Risk vs. Accuracy) |
  | **Any** | Inconclusive / Tie | Any | **Adopt Simple** |

  **Handoff Criteria:** You hand off to the Chief Risk Officer when the choice is no longer about *which model predicts better*, but *what kind of error we are willing to tolerate*. (e.g., "The complex model makes more money on average but has a 5% chance of blowing up in a novel climate regime. The simple model makes less money but won't blow up.")

  ---

  ### Part 3: Worked Applications

  #### Case 1: Hail/Vegetation (12 Regions, 3 Years, Weekly Indices)
  *   **Models:** Linear Index vs. GBT (200 features).
  *   **Data:** 12 regions $\times$ 3 years = 36 region-years. Even if weekly, claims are likely aggregated or sparse. Let's assume Effective $N \approx 100$ independent loss signals (generous).
  *   **Complexity:** GBT with 200 features. Effective parameters easily $> 500$.
  *   **Phase 1 (Data Regime):** Ratio $\approx 100 / 500 = 0.2$. This is $< 10$. **FAIL.**
  *   **Phase 2 (Fit):** GBT beats Linear by 0.015 Brier. (Below your old 0.02 threshold, and certainly not $2\times$ standard deviation given the noise).
  *   **Phase 3 (Stability):** GBT is known to be unstable with high feature/low N ratios.
  *   **Procedure Verdict:** **Adopt Simple (Linear Index).**
  *   **Why you won't like this:** Your team (and the Cat Modeler friend) will argue that hail damage is non-linear and the GBT *must* be capturing real signal. The procedure forces you to admit you don't have enough data to prove that. You are explicitly rejecting a model that fits "better" because the data regime cannot support the complexity. You are prioritizing solvency over potential alpha.

  #### Case 2: Novel Storm Type (8 Weeks of Data)
  *   **Models:** Physical Simulation (tuned params) vs. Generic Time-Series.
  *   **Data:** 8 weeks. Effective $N$ is extremely low (likely $< 10$ independent storm events).
  *   **Phase 1 (Data Regime):** Ratio is critical. Physical model with "many tuned parameters" implies high complexity. Ratio $< 10$. **FAIL.**
  *   **Phase 2 (Fit):** With 8 weeks, backtest variance is meaningless. Any fit is likely spurious.
  *   **Phase 3 (Stability):** Physical models with tuned parameters are brittle outside the tuning range. Time-series assumes stationarity (which a "novel" storm violates).
  *   **Procedure Verdict:** **Handoff to CRO.**
  *   **Why you won't like this:** You want a modeling answer. The procedure tells you this is not a modeling problem; it is a risk appetite problem. Neither model is statistically valid. Choosing one is a bet on the business's ability to absorb error. The CRO must decide if they want to bet on "Physics might be right" (Simulation) or "Trends might persist" (Time-Series). You cannot justify either with math.

  ---

  ### Part 4: Limitations and Failure Modes

  This procedure is a tool, not a theorem. It will fail silently in the following scenarios:

  1.  **The "Wrong Simple" Trap:** Occam's Razor assumes the truth is within the hypothesis space. If the physical process is genuinely highly non-linear (e.g., a tipping point in wildfire spread) and you force a Linear Index because $N$ is low, you will systematically underprice risk until a catastrophic loss occurs. The procedure protects against overfitting noise, but it does not protect against model bias.
  2.  **Stationarity Assumption:** The backtests (Phase 2) assume the future looks like the past. In climate perils, this is increasingly false. A simple model might backtest well because it ignores the trend, while a complex model might pick up the trend but overfit the noise. The procedure might reject the complex model that was actually trying to capture the climate shift.
  3.  **The `gzip` Distraction:** If your team focuses too much on code length, they may refactor a complex statistical model into a compact library call, making it *look* simple to `gzip` while remaining statistically fragile. Ensure Phase 1 (Parameter Count) overrides Phase 3 (Code Size).
  4.  **Political Escalation:** The "Handoff to CRO" option is theoretically correct but organizationally risky. If you hand off too often, you may be seen as indecisive. You must document *why* the data regime forced the handoff (Phase 1 metrics) to protect your team's credibility.
  5.  **Hidden Features:** The procedure counts *explicit* features. If the GBT team engineers 200 features from 5 raw inputs, the procedure sees 200. If they use a deep embedding layer that compresses those 5 inputs into a latent space, the parameter count might look lower, but the risk remains. You must audit the *effective* degrees of freedom, not just the API signature.

  **Final Instruction to Team:**
  When you run this, do not argue about Solomonoff. Argue about **Phase 1**. If the Data Regime Check says "Low Ratio," the debate is over unless the CRO signs a waiver accepting the overfitting risk. This moves the argument from "who is smarter" to "what is our risk capacity."
