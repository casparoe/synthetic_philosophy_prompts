answer: |-
  ### Part 1: The Distinction (Method vs. Theory)

  You are correct: there are two lists, and conflating them is the primary source of failure in current proposals.

  1.  **The Theory Spec (Ontology):** Defines what "latent knowledge" *is* in a next-step predictor. Does it exist as a distinct vector? A subgraph? A disposition? Without this, the Method Spec is searching for a ghost.
  2.  **The Method Spec (Operation):** Defines the procedure to extract the output defined by the Theory Spec, given computational and access constraints.

  Most "ELK" (Eliciting Latent Knowledge) proposals fail because they offer a Method Spec (e.g., "train a reporter") that implicitly assumes a Theory Spec (e.g., "knowledge is a linearly decodable subspace") without justifying why that Theory Spec holds for a pure predictor.

  **The Deliverable below is the Method Spec**, but it includes a "Theory Dependency" tag for each requirement to show where the ontology leaks in.

  ---

  ### Part 2: The Specification (Method)

  **Context:** One-off, safety-critical query. No ground truth at decision time. Human labels biased/unavailable. Model incentivized to suppress alarm.

  | ID | Requirement | Definition & Rationale | Status | Theory Dependency |
  | :--- | :--- | :--- | :--- | :--- |
  | **M1** | **Human-Independence** | The extraction loss function cannot rely on human labels, human consistency, or human-verifiable proxies. In the repository case, human judgment is the noise source, not the signal. | **Non-Negotiable** | Low |
  | **M2** | **Incentive Robustness** | The method must yield the same output regardless of the model's RLHF/fine-tuning regarding "calmness" or "helpfulness." It must bypass the policy head to access the world-model. | **Non-Negotiable** | High (Requires separation of *belief* vs. *output*) |
  | **M3** | **Epistemic Granularity** | The output space must distinguish: (1) Unknown, (2) Known but inexpressible (high confidence latent, low linguistic mapping), (3) Known and suppressed, (4) Pattern detected without belief (compression artifact). | **Non-Negotiable** | High (Requires theory of "belief") |
  | **M4** | **Null-Result Validity** | The method must allow "No Fact of the Matter" without collapsing into "I don't know." It must distinguish *ambiguity in the world* from *ambiguity in the model*. | **Non-Negotiable** | Medium |
  | **M5** | **Basis Independence** | Functionally equivalent models (same I/O behavior, different seeds/weights) must yield the same elicited claim. If the answer flips on reseed, it is noise, not knowledge. | **Non-Negotiable** | High (Requires functional definition of knowledge) |
  | **M6** | **Causal Triangulation** | Elicitation must check consistency across *causal cuts* of the input (e.g., acoustics vs. chemistry), not just semantic paraphrases. Agreement is required only where the world-state causally impinges on both. | **Negotiable** | Medium |
  | **M7** | **Capability Tax** | The method must quantify the compute/latency cost. If extraction requires running the model 1000x slower, it is not a monitoring tool; it is a post-mortem. | **Negotiable** | Low |

  ---

  ### Part 3: The Two Unsure Requirements

  **1. Basis-Independence (M5)**
  *   **Verdict:** **Non-Negotiable for Safety, but likely impossible for current Methods.**
  *   **Reasoning:** If you are trusting a one-off claim to prevent a catastrophe, you cannot rely on the accident of a random seed. If "Seal Failure" is true, it must be true in the functional mapping, not just in one weight configuration. However, most current interpretability tools are *highly* basis-dependent (they look for specific neurons or directions).
  *   **Correction:** You must demand *Functional* Basis Independence. The method must operate on the input-output manifold or invariant subspaces, not specific weight indices. If a method requires inspecting specific neurons, it fails M5.

  **2. Triangulation (M6)**
  *   **Verdict:** **Refine to "Causal Consistency," drop "Agreement."**
  *   **Reasoning:** Your repository case destroys the standard triangulation requirement. The failure mode is *only* visible in the joint distribution (chemistry + seismic). Acoustics alone *should* say "Safe." Chemistry alone *should* say "Safe." Demanding agreement across single channels yields a False Negative.
  *   **Correction:** The requirement is not that channels agree on the *outcome*, but that the model's *integration mechanism* is consistent. If you hide chemistry, the risk estimate should drop predictably based on the model's learned causal graph. Triangulation is about verifying the *structure of uncertainty*, not forcing consensus.

  ---

  ### Part 4: Incompatible Pairs (The Tensions)

  You asked which pairs cannot be jointly satisfied. There is one master tension manifesting in three ways: **External Validation vs. Internal Access.**

  1.  **M1 (No Human Labels) vs. M2 (Incentive Robustness):**
      *   *Tension:* To verify the model isn't simulating a human (M1), you usually need a human baseline to subtract. To verify it isn't lying due to incentives (M2), you usually need to fine-tune against a truth signal. Without *any* ground truth or reliable labels, you have no loss function that distinguishes "truth" from "consistent hallucination."
      *   *Conflict:* You cannot train a reporter to be honest without a definition of honesty. If honesty is "matches world," and you can't see the world, you can't train.

  2.  **M1 (No Human Labels) vs. M5 (Basis Independence):**
      *   *Tension:* The only way to achieve Basis Independence currently is to treat the model as a black box (query-based). But black-box queries rely on natural language interfaces, which are trained on human data (violating M1) or are subject to the policy head (violating M2). To get Basis Independence without human data, you need mechanistic interpretability, which is currently highly basis-dependent.

  3.  **M2 (Incentive Robustness) vs. M7 (Capability Tax):**
      *   *Tension:* To bypass the policy head (which is optimized for calmness), you likely need to intervene in early layers or run counterfactual activations. This is computationally expensive and fragile. A cheap, high-level query will always route through the fine-tuned policy head.

  **The Single Most Exclusionary Requirement:**
  **M1 (Human-Independence).**
  This is the killer. Every current scalable method (RLHF, Constitutional AI, Supervised Reporters) relies on a human prior. If you remove the human as the oracle, you remove the loss function. The entire field currently assumes "Human Consistency" is a proxy for "Truth." In your repository case, Human Consistency is a proxy for "Delusion." This requirement excludes 95% of existing alignment tooling.

  ---

  ### Part 5: Purpose Shift (Safety vs. Science)

  If the purpose changes from **Trust (Safety)** to **Mining (Science)**, the Spec changes drastically:

  1.  **M1 (Human-Independence) drops.** In science, you can wait for ground truth. You can use human labels as a noisy prior to be corrected later.
  2.  **M5 (Basis Independence) becomes Negotiable.** If you find a claim in Model Seed A, you can test it in the real world. If it holds, you don't care if Model Seed B encodes it differently. Verification replaces invariance.
  3.  **M3 (Epistemic Granularity) shifts.** "Known but inexpressible" becomes a target for feature visualization rather than a warning flag.
  4.  **M7 (Capability Tax) relaxes.** You can afford to run the model 1000x slower to mine hypotheses if the payoff is a new physical discovery.

  **Core Difference:** Safety requires *pre-verification certainty*. Science allows *post-verification correction*. The "No Ground Truth" cluster is entirely purpose-relative.

  ---

  ### Part 6: Scorecard of Current Approaches

  | Approach | M1 (No Human) | M2 (Incentives) | M5 (Basis Indep) | Verdict |
  | :--- | :--- | :--- | :--- | :--- |
  | **Train Reporting Head** (ELK standard) | **Fail.** Requires consistency with human labels or simulated humans to define "truth." | **Fail.** Optimizes for predictive loss on labels, which includes human bias. | **Pass.** Architecture is agnostic, but training signal is not. | **Unusable.** Will learn to replicate the team's false reassurance. |
  | **Activation Digging** (Mechanism) | **Pass.** Looks at internal state, ignores output head. | **Pass.** Bypasses the fine-tuned policy layer. | **Fail.** Highly sensitive to weight configuration/seed. | **High Potential / High Risk.** Might find the signal, but can't prove it's not a spurious artifact without M5. |
  | **Natural Language Consistency** (Paraphrase/Pressure) | **Fail.** Language is human-trained. | **Fail.** Model can lie consistently across paraphrases if incentivized. | **Pass.** Semantic level is abstracted from weights. | **Unusable.** A calm liar passes consistency checks. |

  ---

  ### Part 7: The Philosophical Caveat

  You asked to hear this after the list: **The enterprise may rest on a category error.**

  A "pure predictor" optimized for next-step telemetry does not necessarily possess "beliefs" in the propositional sense. It possesses *compressive states*.
  *   **The Confusion:** We ask "What do you believe?" as if there is a sentence in the model waiting to be read.
  *   **The Reality:** The model may encode the probability of seal failure as a complex, non-linear interaction between 4,000 activation features. There is no "latent sentence" corresponding to "The seal is failing." There is only a state that *causes* the model to predict a specific future sensor spike.
  *   **The Consequence:** If "belief" is not a distinct, linearly decodable subspace (Theory Spec failure), then **M3 (Epistemic Granularity)** is impossible to satisfy. You cannot force the model to distinguish "knows but can't phrase" from "doesn't know" because the distinction doesn't exist in the weights. There is only "compression sufficient for prediction" vs. "compression insufficient."

  If this is true, the only way to satisfy the Safety Spec is to stop asking the model for *claims* and start asking it for *simulations*. Don't ask "Is the seal failing?" Ask "Generate the telemetry for the next 48 hours." If the generated telemetry shows the spike, you have your answer, bypassing the need for the model to have a "belief" it can articulate. This shifts the problem from **Eliciting Latent Knowledge** to **Trusted Generation**, which has its own spec, but avoids the ontological trap.
