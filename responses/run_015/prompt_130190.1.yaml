      *   The Philosophical Caveat.

  11. **Self-Correction/Polishing during drafting:**
      *   *Check:* Did I address the "four distinctions"? Yes, need to ensure Requirement 3 covers them explicitly.
      *   *Check:* Did I address the "calmness fine-tuning"? Yes, under Incentive Robustness.
      *   *Check:* Is the tone right? Needs to be sharp. Avoid "Some researchers say..." Use "Requirement X."
      *   *Refinement on Triangulation:* The user's example is key. The failure is *only* in the joint distribution. Triangulation requiring marginal agreement is wrong. I need to specify that triangulation must be over *causal structures*, not just channel agreement.
      *   *Refinement on Basis Independence:* If the model is a black box, basis independence is about the *interface*. If we are doing mechanistic interpretability, basis independence is about the *ontology*. I need to clarify this distinction.

  12. **Final Review against constraints:**
      *   "Give me the spec, not the survey." -> Keep it imperative.
      *   "Mark on each for whether it's non-negotiable." -> Add a column/tag.
