      *   **The User's Experience:** Feels like adjudicating conduct rather than assessing need.
      *   **The Philosophical Problem:** Inconsistency in the model of human agency and social causality within the same bureaucracy.

  3.  **Brainstorming Candidate Theories (Step 1):**
      *   *Theory A: Reciprocity/Fair Play.* (Citizens owe effort to the community that supports them.) This is the standard "something for something" argument.
      *   *Theory B: Behavioral/Deterrence.* (People are rational actors who need nudges.) Sanctions are tools to overcome inertia or moral hazard.
      *   *Theory C: Political Signaling/Deservingness.* (It's not about the claimant, it's about the taxpayer.) Sanctions prove to the public that the system isn't a "handout."

  4.  **Developing the Reconstruction (Step 2):**
      *   I need to synthesize these into a coherent view of what the *system* believes, even if it's contradictory.
      *   *Idea:* The system operates on a "Dual Model of Agency." It treats the claimant as a *moral agent* regarding compliance (you chose to miss the appointment) but as a *statistical unit* regarding outcomes (you might not get a job).
      *   *Refinement:* It's not just dual; it's *performative*. The sanction isn't necessarily about causing employment; it's about maintaining the boundary of the system.
      *   *Key Concept:* "Administrative Control" vs. "Economic Control." The system assumes you control your *application behavior*, even if you don't control the *hiring outcome*.

  5.  **Addressing the Specific Questions (Step 3):**
      *   *Presupposition about Control:* It presupposes "procedural control" (I can click 'submit') rather than "substantive control" (I can get hired).
      *   *Consistency:* It is *logically* inconsistent with the labor market briefings (if jobs are via networks, applications matter less). It is *pragmatically* consistent with hardship payments (we punish the behavior, but save the life to avoid political backlash/legal liability).
      *   *Underdetermined Parts:* The *severity* of sanctions. Reciprocity might demand a lesson, deterrence demands enough pain to change behavior, signaling demands visibility. Any of these could justify the current levels.

