  *   **Analysis:** This is resolvable by terminology. You define "nonlocal" in (1) as "non-separable" (violation of Bell Locality/Outcome Independence) and "local" in (5) as "dynamically local" (Parameter Independence/Local Hamiltonian). As long as you maintain this distinction clearly, there is no contradiction.
