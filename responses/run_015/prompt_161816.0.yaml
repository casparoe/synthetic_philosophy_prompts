              *   *Why:* "In principle" is the weasel word. Formalizing cost into the operator ($K_c$) prevents the Fitch collapse (because $p \land \neg K_c p$ might be too costly to know). This is where the rubber meets the road for engineering.
              *   *Criteria:* High Policy Impact, Moderate Tractability (needs careful formalization to avoid triviality), High Neglect (philosophers ignore cost, CS ignores the epistemology).
          *   **Rank 3: Agent-Relative Hierarchies (Horse a).**
              *   *Why:* It addresses the "superhuman audit" hope. But I agree with the user's skepticism. It needs to prove it's not just Fitch with subscripts.
              *   *Criteria:* Moderate Impact, Low/Moderate Tractability (easy to write models, hard to prove non-collapse), High Neglect.
          *   **Refusal:** I will explicitly refuse to fund a project on "Anti-Realist Metaphysics of Knowability." It's historically important but irrelevant to the policy goal.

