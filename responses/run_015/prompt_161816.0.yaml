      *   *Refining the Ranking:*
          *   **Rank 1: Expressive Limits & Self-Reference (Horse b).**
              *   *Why:* It's the most tractable. It directly addresses the mechanism of the paradox. If the audit report can't say "this is the full report," Fitch fails. This is a formal result waiting to be fleshed out. It changes policy from "everything must be checkable" to "everything *expressible in the audit language* must be checkable."
