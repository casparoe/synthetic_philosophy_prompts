answer: |-
  Here is a design for the session. It is built to be run with minimal setup, high physical engagement, and strict timekeeping. The language avoids philosophical jargon until the final ten minutes.

  ### Session Title: The Weight of the Story
  **Time:** 75 Minutes
  **Materials to Bring:**
  *   3 irregular cardboard shapes (one solid, one C-shaped, one ring/hoop).
  *   String, scissors, masking tape, heavy washers or coins (for plumb lines).
  *   50 Index cards (pre-written with "Life Events" — see below).
  *   20 Counters/Tokens (poker chips or distinct coins).
  *   A roll of colored floor tape (or masking tape).
  *   Whiteboard markers.

  ---

  ### Part 1: The Physical Anchor (00:00 – 00:10)
  **Goal:** Establish that a "center" can be real, useful, and located in empty space.

  *   **00:00–00:02:** **Setup.** Push chairs back. Clear floor space. Divide members into three groups of 4–5.
  *   **00:02–00:08:** **The Hunt.** Hand each group one cardboard shape.
      *   *Group 1:* Solid irregular blob.
      *   *Group 2:* A "C" shape.
      *   *Group 3:* A ring/hoop.
      *   *Task:* "Find the balance point. Mark it with tape. Then, hang a string with a weight from two different points on the edge to triangulate the exact center. Mark where the lines cross."
      *   *Constraint:* They cannot just balance it on a finger; they must find the geometric center of gravity.
  *   **00:08–00:10:** **The Reveal.** Ask Group 3 (the ring) to point to their center. It is in the hole. Ask: "Is there cardboard there?" (No). "If I drill a hole there, does the object break?" (No). "If I ignore that point, can I predict how this object will fall?" (No).
      *   *Facilitator Note:* Do not mention the self yet. Just establish: **The point is real, it predicts behavior, it contains no matter.**

  ### Part 2: The Assembly (00:10 – 00:35)
  **Goal:** Construct a "person" from fragments and locate their center to enable prediction.

  *   **00:10–00:15:** **The Archive.** Hand each group 10 index cards. These are "Facts."
      *   *Examples:* "Age 7: Broke neighbor's window," "Age 15: Quit soccer team," "Age 16: Started coding," "Age 17: Arrested for protest," "Age 18: Accepted to State U," "Daily: Checks phone 100 times," "Weekly: Visits grandmother."
      *   *Task:* Lay the cards on the floor in a cluster. This cluster is "The Subject."
      *   *Rule:* You must place a **Center Token** (a heavy washer) on the floor relative to the cards. The Token represents the point from which the Subject's actions make sense.
  *   **00:15–00:25:** **The Wager.** You (the Facilitator) act as "The Future." You hold a deck of 5 "Outcome Cards."
      *   *Examples:* "Steals a car," "Donates kidney to stranger," "Drops out in freshman year," "Becomes CEO," "Commits fraud."
      *   *Mechanic:* Groups have 3 Tokens each. They must bet Tokens on whether an Outcome matches their Subject's Center.
      *   *Process:* Reveal one Outcome. Groups discuss: "Given where our Center is, does this happen?" If their Center is near "Rebellion," they bet on "Steals a car." If their Center is near "Duty," they bet on "Donates kidney."
      *   *Scoring:* Correct prediction = Win 2 Tokens. Incorrect = Lose 1.
      *   *Crucial Constraint:* They must physically move the Center Token if they want to change their prediction strategy. The Token's location *is* their hypothesis.
  *   **00:25–00:35:** **The Calibration.** After 3 rounds, pause. Ask the leading group: "Your Center is hovering over the 'Protest' card. Why not over the 'Grandmother' card?"
      *   *Expected Answer:* "Because the Protest card explains the Arrest and the Coding (hacking for cause). The Grandmother card doesn't connect to the rest."
      *   *Point to Drive Home:* The Center isn't where the *most* cards are; it's where the *connecting logic* is strongest. It pulls the other cards into orbit.

  ### Part 3: Twist One — Competing Gravities (00:35 – 00:50)
  **Goal:** Demonstrate that one life admits multiple centers, both predictive.

  *   **00:35–00:40:** **The Split.** Take Group 1 and Group 2. Give them the *exact same* 10 Fact Cards.
      *   *Secret Instruction to Group 1:* "Your Subject is a **Hero**. Arrange the cards and place the Center to maximize the likelihood of 'Saves a life'."
      *   *Secret Instruction to Group 2:* "Your Subject is a **Survivor**. Arrange the cards and place the Center to maximize the likelihood of 'Escapes danger'."
  *   **00:40–00:45:** **The Conflict.** Have them place their Centers on the floor. They will likely be in different spots.
      *   *Challenge:* "Both groups claim to predict the Subject's next move. Group 1 says they will run *toward* the fire. Group 2 says they will run *away*. Both used the same facts."
      *   *Question:* "Which Center is the *real* one?"
      *   *Desired Friction:* They will argue about which story is "true." You must refuse to answer. "Both predicted the past facts equally well. Both are logically consistent. Who decides?"
  *   **00:45–00:50:** **The Stalemate.** Acknowledge that the "Center" is not found like a fossil; it is chosen like a coordinate system. Neither is wrong, but they yield different futures.

  ### Part 4: Twist Two — The External Eye (00:50 – 01:05)
  **Goal:** Show the center can be outside the person (reputation/social gravity).

  *   **00:50–00:55:** **The Court.** Select 3 members (one from each group) to leave the room for 1 minute. They are "The Community."
      *   *Instruction to remaining members:* "Hide the Fact Cards. Leave only the Center Tokens on the floor."
      *   *Instruction to The Court (when they return):* "You do not see the facts. You only see where the Centers are placed. You must decide who this person is based *only* on the Center's location relative to the room (e.g., near the door = flighty, near the teacher = conformist)."
  *   **00:55–01:05:** **The Verdict.** The Court places a **Red Tape X** on the floor. This is the *Social Center*.
      *   *Comparison:* Compare the Red X (Social) to the Group's Token (Internal).
      *   *Scenario:* If the Group placed the Center on "Secret Kindness" (internal) but the Court places the Red X on "Public Arrest" (external), ask: "If the police come looking for this person, which Center do they use?"
      *   *Result:* The Social Center overrides the Internal Center for the purpose of external prediction. The "Self" has effectively moved outside the skin.

  ### Part 5: The Debrief (01:05 – 01:15)
  **Goal:** Map the activity to the philosophy.

  *   **01:05–01:10:** **The Name.** Now you can use the words. Write on the board: **The Self as a Center of Narrative Gravity.**
      *   *Attribution:* Daniel Dennett (1988).
      *   *Mapping:*
          *   Cardboard Hole = The Self is not a "thing" inside the brain.
          *   Token Placement = Choosing a narrative structure.
          *   Betting Game = The utility of the self (prediction/blame).
          *   Hero vs. Survivor = Pluralism (no single true story).
          *   The Court = The social construction of identity.
  *   **01:10–01:15:** **The Open Question.** End with: "If the Center is just a tool for prediction, and it can be moved by others, what happens to responsibility? If the Court puts the Center on 'Criminal' but you put it on 'Survivor', who is right when the sentence is passed?"

  ---

  ### Debrief & Mapping Guide
  *Use this to guide the final discussion. Do not lecture; ask questions that force them to make these connections.*

  1.  **The Cardboard Hole:** Maps to the **Ontological Claim**. The center of gravity is a real feature of the world, but it is not made of matter. Similarly, the "Self" is a real feature of human life, but not a distinct object (like a soul or a specific neuron cluster).
  2.  **The Betting Game:** Maps to the **Functional Claim**. We posit a Self because it helps us predict behavior and assign praise/blame. If the "Center" didn't help win tokens (predict outcomes), we wouldn't use it.
  3.  **Hero vs. Survivor:** Maps to **Narrative Pluralism**. There is no "God's eye view" of a life. Different narrative structures highlight different causal links. The "truth" of the self is relative to the story being told.
  4.  **The Court:** Maps to **Social Externalism**. Our "Center" is often determined by how others need to predict us. A reputation is a Center of Gravity located in the community, not the individual.

  ---

  ### Troubleshooting: Predictable Failures
  *Be ready for these. They are features, not bugs.*

  **1. The Reductionist ("The real self is just the brain.")**
  *   *The Push:* A student will insist that if we scanned the brain, we'd find the *actual* center.
  *   *The Handle:* "If you had the brain scan, could you predict if they will be found guilty of a crime?" (Maybe). "Could you predict if their mother will forgive them?" (No). "The brain scan predicts physics/chemistry. The 'Center' predicts social outcomes. They are different tools. We aren't asking what the person *is* made of; we're asking what point we need to locate to navigate the social world."
  *   *Backup:* Remind them of the cardboard ring. "Is the center of gravity made of cardboard? No. Is it still real? Yes."

  **2. The Bored Skeptic ("This is obvious/word games.")**
  *   *The Push:* "So you're saying stories matter? We know that."
  *   *The Handle:* Raise the stakes. "Okay, if it's obvious, place the Center. Here are the facts: 'He loves his wife' and 'He embezzled money.' Where is the Center? If you put it on 'Love', he goes to rehab. If you put it on 'Greed', he goes to prison. Pick one. You are the judge."
  *   *Goal:* Force them to feel the *weight* of the choice. It stops being obvious when they have to bet on it.

  **3. The Energy Dip (Thursday Afternoon Slump)**
  *   *The Push:* Silence during the betting round.
  *   *The Handle:* Physically intervene. Walk over to a group's Center Token. Move it two inches. Ask: "I just changed your prediction. Did I break their character? Or did I reveal a new one?" Make them defend the geometry.

  ---

  ### Limitations: What This Cannot Stage
  *You guessed correctly. Be honest about this in the final 2 minutes.*

  1.  **The Metaphysical Gap:** The activity proves the *utility* of the Center, not the *non-existence* of a deeper Self. A dualist can play this game and say, "The Center is just how we see the Soul." You cannot disprove the Soul with index cards. You must state: "This view doesn't prove there is no ghost in the machine; it proves we don't *need* the ghost to do the work the Self does."
  2.  **The Phenomenological Feel:** The activity treats the Self as an object of study (third-person). It does not capture what it *feels like* to be a Self (first-person qualia). The "Center" explains how others see you, not necessarily how you feel pain or joy.
  3.  **The Normative Risk:** By showing that Centers are constructed, you risk implying "anything goes." You must clarify that while Centers are constructed, they are constrained by the facts (the cards). You cannot make a Center of "Saint" if the cards say "Murderer." The fiction is constrained by reality.

  ### Final Note to the Convenor
  You mentioned you don't want to lecture. The hardest part of this plan is **shutting up** during Part 2 and 3. When they argue about where the Token goes, let them flounder. The philosophical insight happens in the frustration of trying to place the Token where it "really" belongs and realizing there is no single right spot. That frustration *is* the lesson. Let them sit in it.
