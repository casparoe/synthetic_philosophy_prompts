answer: |-
  # Taxonomy of Retrospective Explanation in Engineering Post-Mortems

  **Instructions:** Start at the **Root Question**. Answer based on how you would handle a specific recent outage report, not on how you wish the world worked. Follow the path to a leaf. Each leaf represents a coherent philosophical stance on causality and hindsight, labeled with its practical consequence.

  ---

  ### **Root Question**
  **When you review a post-mortem for a recent outage, does knowing the system crashed force you to see the preceding events as more determined (inevitable) than they actually felt at the time?**
  *   **Yes:** (Retrospective knowledge necessarily distorts prior understanding) → *Go to Question 1*
  *   **No:** (Retrospective knowledge does not necessarily distort prior understanding) → *Go to Question 4*

  ---

  ### **Branch A: Distortion is Inevitable (Yes)**

  **Question 1 (Claim 1: Narrative Ordering)**
  **Is the story-like sequence of the report (Event A led to Event B) required to make the explanation true, or is it just a convenient way to package the logs?**
  *   **Required for Truth:** (Narrative creates the causality) → *Go to Question 2*
  *   **Just Packaging:** (Causality exists independently of the story) → *Go to Question 3*

  **Question 2 (Claim 4: Bias Status)**
  **If the narrative imposes false necessity, is this bias a cognitive defect we must eliminate, or a useful heuristic we should keep?**
  *   **Defect to Eliminate:** → **Leaf 1: Tragic Constructivist**
      *   *Awkward Commitment:* You must write reports you believe are fundamentally false while simultaneously trying to fix the very cognitive mechanism required to write them.
  *   **Useful Heuristic:** → **Leaf 2: Pragmatic Narrative Acceptance**
      *   *Awkward Commitment:* You must defend the idea that engineers learn better from a timeline that falsely implies inevitability than from one that accurately reflects the chaos of the moment.

  **Question 3 (Claim 3: Domain Sensitivity)**
  **Does this distortion apply equally to software logs (deterministic) and human decisions (social), or is software immune?**
  *   **Applies Equally:** → **Leaf 3: Uniform Skeptic**
      *   *Awkward Commitment:* You must treat a null pointer exception with the same epistemic suspicion as a political scandal, implying code logic is as interpretive as human motive.
  *   **Software is Immune:** → **Leaf 4: Domain-Specific Skeptic**
      *   *Awkward Commitment:* You must draw a hard line where "code" stops and "human configuration" begins, despite modern infrastructure treating both as version-controlled text.

  ---

  ### **Branch B: Distortion is Avoidable (No)**

  **Question 4 (Claim 2: Objective Causal Structure)**
  **Could the root cause be fully captured in a dependency graph or log trace without using any sentences like "this led to that"?**
  *   **No (Narrative Required):** → **Leaf 5: Incoherent Realist** *(Empty Leaf)*
      *   *Diagnosis:* **Incoherence.** If distortion is avoidable, you claim access to truth; if no objective structure exists, there is no truth to access. This position collapses because "avoidable distortion" presupposes an objective baseline to be distorted *from*.
  *   **Yes (Objective Structure Exists):** → *Go to Question 5*

  **Question 5 (Claim 3: Domain Sensitivity)**
  **Can this objective structure be fully captured for software systems, even if it cannot be captured for human history?**
  *   **No (Software is Like History):** → *Go to Question 6*
  *   **Yes (Software is Deterministic):** → **Leaf 6: Engineering Exceptionalist**
      *   *Awkward Commitment:* You must explain why socio-technical systems (involving on-call engineers, management pressure, and fatigue) count as purely deterministic engineered objects.

  **Question 6 (Claim 4: Bias Status)**
  **Since the truth exists but humans are involved, is hindsight bias a defect to remove or an unavoidable feature of learning?**
  *   **Defect to Remove:** → **Leaf 7: Strict Causal Structuralist**
      *   *Awkward Commitment:* You must believe perfect post-mortems are possible in principle, making every remaining ambiguity in a report a moral or procedural failing of the team.
  *   **Unavoidable Feature:** → **Leaf 8: Fallibilist Realist**
      *   *Awkward Commitment:* You believe an objective truth exists but admit you can never reliably distinguish a true report from a biased one in practice.

  ---

  ### **Taxonomy Notes & Diagnostics**

  **1. Empty Leaf Diagnosis (Leaf 5)**
  Leaf 5 is marked as **Empty/Incoherent**. It arises from asserting that we can see the past clearly (No Distortion) while denying there is anything objective there to see (No Objective Structure). In a policy context, this view cannot justify spending resources on investigation, as it denies both the fog of war and the existence of a map.

  **2. Indistinguishable Leaves (Leaf 6 vs. Leaf 7)**
  **Leaf 6 (Engineering Exceptionalist)** and **Leaf 7 (Strict Causal Structuralist)** are practically indistinguishable in an engineering context.
  *   **Shared Commitment:** Both operate under the assumption that the "true" root cause is recoverable and should be stated definitively in the report.
  *   **Collapse:** While they differ metaphysically (one thinks software is special, the other thinks all history is knowable), their practical output is identical: a post-mortem that asserts a single causal chain without hedging. The distinction collapses because both reject the utility of narrative ambiguity.

  **3. Usage Guide**
  *   **For Blameless Culture:** Leaves 2 and 8 are most compatible with "blameless" post-mortems, as they accept human cognitive limits.
  *   **For Reliability Engineering:** Leaves 6 and 7 are most compatible with SRE goals, as they assume errors are identifiable and fixable.
  *   **For System Design:** Leaf 4 suggests investing in tools that separate human config from system logic; Leaf 3 suggests investing in resilience regardless of cause type.
