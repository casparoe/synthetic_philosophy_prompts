      *   **User's Hypotheses:**
          1.  *Category Error:* "Non-human cause" bundles three distinct things (exogenous shock, endogenous co-evolution, slow background constraint). The determinism objection applies differently to each.
          2.  *Counterfactual Mismatch:* The disagreement is about *which* counterfactual question matters (outcome existence vs. magnitude of difference vs. recognizability of history).
      *   **Task:**
          1.  Diagnose the dispute (Verbal? Substantive? Causal vs. Narrative? Counterfactual? Mix?).
          2.  Argue for the diagnosis using the claims provided.
          3.  Propose what counts as progress (Taxonomy? Criterion? New Question?) OR argue no progress is expected.
          4.  **Constraint:** Test the hypothesis, don't just confirm it. (Critical engagement required).

  2.  **Deconstruct the Debate:**
      *   *Side A's Core Claim:* Causal necessity/sufficiency. If $X$ (volcano) didn't happen, $Y$ (famine/revolt) doesn't happen. Therefore $X$ is an actor.
      *   *Side B's Core Claim:* Causal mediation/contingency. If $X$ happens, $Y$ only happens because of $Z$ (social structure). Therefore $Z$ is the real driver; $X$ is just a trigger or condition.
      *   *User's Hypothesis 1 (Taxonomy):* The term "non-human cause" is too broad.
          *   *Exogenous:* Tambora. Hard to argue social structure caused the eruption.
          *   *Endogenous:* Malaria expansion due to irrigation. Humans shaped the environment that bit back.
          *   *Background:* Climate zones. Sets the stage, doesn't act.
      *   *User's Hypothesis 2 (Counterfactuals):*
          *   *Necessity:* Would it happen without X? (Side A likes this).
          *   *Magnitude:* How much did X change things? (Both care, but define differently).
          *   *Recognizability:* Is it still "history as we know it"? (Side A likes this).

  3.  **Evaluate the User's Hypotheses (Testing, not just Confirming):**
      *   *Hypothesis 1 (Taxonomy):* Is it *just* a category error?
          *   *Critique:* While useful, splitting the categories might not solve the *philosophical* disagreement. Side B might argue that even an exogenous shock (Tambora) is historically inert without the social mediation. Side A might argue that even background constraints (monsoons) actively shape decisions. So, the taxonomy clarifies, but doesn't resolve the *agency* question.
      *   *Hypothesis 2 (Counterfactuals):* Is it *just* about which counterfactual to ask?
          *   *Critique:* This is stronger. Side A asks "Is the narrative intelligible without this?" Side B asks "Does this override human choice?" However, there's a deeper ontological layer: What does "actor" mean? If "actor" implies *intent*, neither side is right. If "actor" implies *causal force*, Side A is right. If "actor" implies *historical subjectivity*, Side B is right.

  4.  **Formulate the Diagnosis:**
      *   It is **not merely verbal**. It's not just defining "actor."
      *   It is **not merely substantive** (weights of causes).
      *   It is a **Category Mistake + Ontological Clash + Counterfactual Mismatch**.
      *   *Primary Diagnosis:* It is a clash between **Causal Mechanism** (Side B's focus on mediation) and **Narrative Dependence** (Side A's focus on the story collapsing).
      *   *Refinement:* The word "Actor" is the poison pill. It imports anthropomorphic baggage (agency, intent) into a causal discussion.
      *   *Verdict on User's Hypotheses:*
          *   Hypothesis 1 is correct but insufficient. Distinguishing shock vs. background helps, but Side B will still deny "agency" to a shock.
          *   Hypothesis 2 is the key. They are answering different questions. Side A asks about *historical contingency* (could it have gone otherwise?). Side B asks about *social primacy* (who bears responsibility/meaning?).

  5.  **Develop the Argument:**
      *   *The "Actor" Trap:* "Actor" implies agency. Side A uses it metaphorically (causal force). Side B takes it literally (requires mediation/choice).
      *   *The Mediation Point:* Side B is right that effects are mediated. But Side A is right that mediation doesn't negate causation. A bullet kills via biology, but we say the shooter acted. Here, the volcano "shoots."
      *   *The Counterfactual Divergence:*
          *   Side A: "No Tambora = No Year Without Summer = No Famine = No Migration." (Chain of necessity).
          *   Side B: "Tambora + Feudalism = Famine. Tambora + Welfare State = Relief." (Contextual contingency).
      *   *Synthesis:* The dispute is about **Explanatory Primacy**. Side A wants *Event History* (what happened). Side B wants *Structural History* (why it mattered this way).

  6.  **Propose Progress:**
      *   *Abandon "Actor":* It's too loaded. Use "Causal Force" or "Environmental Variable."
      *   *Adopt the Taxonomy (with caveats):* Distinguish Shocks, Feedbacks, and Constraints.
      *   *Standardize Counterfactuals:* Use "INUS conditions" (Insufficient but Necessary part of a condition which is itself Unnecessary but Sufficient). This bridges the gap. The volcano is an INUS condition. The social structure is the rest of the condition.
