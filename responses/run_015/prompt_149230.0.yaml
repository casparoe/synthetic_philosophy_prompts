      *   *Check:* Is the distinction between Causal and Narrative clear? Side A cares about the *plot*; Side B cares about the *mechanism*.
      *   *Refinement on "Progress":* Suggesting "INUS conditions" is good philosophy of science. Suggesting "Vulnerability" is good environmental history. Combine them.

  9.  **Final Polish:** Ensure the distinction between "exogenous," "endogenous," and "background" is addressed specifically regarding the determinism objection. (e.g., Background constraints feel most deterministic, but shocks feel most like "actors").

