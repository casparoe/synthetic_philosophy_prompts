  *Weak spot 1:* The taxonomy might just create three new stalemates instead of one.
  *Weak spot 2:* The counterfactual hypothesis assumes both sides agree on logic but differ on parameters. In reality, Side B might reject the counterfactual method entirely if it ignores structural power.

