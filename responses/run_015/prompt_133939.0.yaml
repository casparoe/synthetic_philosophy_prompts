          6.  Where are both practices philosophically *underdetermined*?
          7.  Do both rely on *social recognition* in ways that blur the contrast?
      *   **Tone:** Academic, rigorous, nuanced, avoiding oversimplification. Needs to handle metaphysical commitments carefully.

  2.  **Deconstruct the Core Contrast (The "Nara vs. Ise" Problem):**
      *   *European/Western Model:* Often associated with the Venice Charter (1964). Value lies in material continuity. Replacement = loss of authenticity. Metaphysics: Substance ontology (the *stuff* matters).
      *   *Japanese/Ise Model:* Shikinen Sengu (20-year rebuilding). Value lies in the transmission of skill, ritual, and form. Material is ephemeral. Metaphysics: Process ontology or Functional ontology.
      *   *Common Ground:* Both aim to preserve "cultural identity" or "heritage value."

  3.  **Address Question 1: Does European conservation *strictly require* essentialism?**
      *   *Initial thought:* It looks like it, but is it *strict*?
      *   *Nuance:* The Venice Charter emphasizes material, but modern conservation (e.g., Nara Document on Authenticity, 1994) allows flexibility. However, the *default* legal framework (like in Italy or France) often treats material as a necessary condition.
      *   *Metaphysics:* It doesn't necessarily require a deep metaphysical essentialism (like an immutable soul of the stone), but it does require a *historical testimony* view. The material is the witness. If you replace the witness, the testimony is lost.
      *   *Verdict:* It requires a commitment to *historical indexicality* (this stone touched that hand), not necessarily metaphysical essentialism. But practically, it functions *as if* the material is essential.

  4.  **Address Question 2: Does Japanese practice presuppose functional/relational identity?**
      *   *Initial thought:* Yes, it's about the *kami* and the ritual, not the wood.
      *   *Nuance:* Is it purely functional? Or is it about *continuity of form*?
      *   *Metaphysics:* It aligns with Buddhist impermanence (*mujō*) and Shinto purity. The identity persists through the *pattern* and the *act*.
      *   *Verdict:* It presupposes identity is *performative* and *lineage-based*. It's not just "function" (a shrine could function elsewhere); it's *this* lineage of rebuilding. So, relational is better than functional.

  5.  **Address Question 3: Defending "Sameness" without Hidden Essence (The Ship of Theseus Problem):**
      *   *Problem:* If you replace everything, is it the same? If you say "the ritual makes it the same," isn't the ritual the new essence?
      *   *Defense:* Use a *causal-historical* chain or *psychological continuity* analogy (Locke). The identity is maintained by the *intentional continuity* of the community.
      *   *Avoiding Essence:* Don't posit a "shrine soul." Posit a *social contract* of continuity. The "same-ness" is a status conferred by the community, not an intrinsic property.
      *   *Risk:* This slides into social constructivism (which leads to Q7).

  6.  **Address Question 4: Family-Resemblance Authenticity (Wittgenstein):**
      *   *Concept:* No single necessary condition (material, form, ritual, location). Just overlapping features.
      *   *Policy Change:* Shift from binary (authentic/fake) to gradient or contextual. Allow more reconstruction in Europe if other features (location, use, spirit) are strong. Allow more material retention in Japan if it fits the cluster.
      *   *Implication:* Policy becomes case-by-case, less rigid. Harder to legislate.

  7.  **Address Question 5: Strictly Required vs. Merely Compatible:**
      *   *Europe:* Material continuity is *compatible* with many metaphysics, but *required* by the specific legal interpretation of "testimony."
      *   *Japan:* Ritual continuity is *required* for the specific religious meaning, but *compatible* with keeping some old wood (they actually bury the old wood nearby, preserving the material in a different way).
      *   *Underdetermination:* Both practices could theoretically swap metaphysics without collapsing. Europe could value the "spirit" of the ruin; Japan could value the "aged wood." The *practice* locks in the *metaphysics*, not vice versa.

  8.  **Address Question 6: Social Recognition (The Blurring):**
