      *   *Nara Document (1994):* Explicitly states authenticity is judged within cultural context.
      *   *Conclusion:* The contrast is ontological on the surface, but sociological at the foundation. Both rely on *institutional fact* (Searle).

  9.  **Structure the Response:**
