prompt: |-
  I teach a second-year course that's half decision theory and half philosophy of probability — about 22 students, one 80-minute slot, tables that seat four, and no budget for real money, so stakes have to be chocolate or a couple of points of course credit. Next week I've got a session on the two-envelope set-up (two envelopes, one contains twice what the other contains, you get one, you may look inside, you may then swap) and I really don't want to do what I did last year, which was write the switching argument on the board and then spend forty minutes explaining the flaw. It didn't land: they could recite the objection afterwards and the argument still *felt* right to them, and I think that's because nothing in the session ever cost them anything.

  So: design me a game they actually play. Envelopes in pairs, each pair of students gets one envelope each, they can peek at their own, then decide whether to trade, and I want them to run into the problem in their own choices and in the class's aggregated results rather than in anything I say — I'd rather the words "paradox" and "expected value" don't come out of my mouth until the debrief. Two things I want built in. First, the version where both members of a pair peek and both run the argument: each concludes that trading is better for them, and they trade with each other, which shouldn't be possible, and I want that collision staged so the whole room sees it happen at the same time. Second, one of my students last year proposed a randomized rule — pick some threshold from a very spread-out distribution before looking, then switch if and only if what you see is below it — and claimed this beats both always-switching and always-keeping. I couldn't tell whether he was right or whether he'd just moved the problem somewhere else, and I'd like the activity to have room for that rule, or for you to tell me it doesn't belong. Relatedly: I once tried generating the amounts from something extremely spread out and the running averages just kept lurching around and never settled down, which I *think* is a real feature of the maths and not me mucking up the spreadsheet, but I'm not certain, so if that matters for how I should build the envelopes, say so.

  What I need concretely: the rules, what goes in the envelopes and how I should generate the numbers, the payoff scheme, a minute-by-minute timeline for 80 minutes, and a debrief that maps specific moments in the game onto specific bits of the reasoning — including which premise of the switching argument each moment is supposed to put pressure on. Also tell me what will predictably go wrong: I expect some students to refuse to open their envelope at all (can that be useful instead of a problem?), some to treat it as a mind-reading contest against their partner, and at least one to work out that my supply of chocolate is finite and reason backwards from that. And be honest about which part of the difficulty the game can't reproduce at all and which parts I'll just have to supply myself in the debrief — in particular, I suspect the aggregate data is going to show switching is roughly break-even rather than better, and I want to know what I'm supposed to do with that when it happens.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Course:** 2nd-year Decision Theory & Philosophy of Probability.
      *   **Class Size:** ~22 students.
      *   **Time:** 80 minutes.
      *   **Setup:** Tables of 4 (so pairs of pairs, or just pairs).
      *   **Budget:** Chocolate or course credit (no real money).
      *   **Topic:** Two-Envelope Problem (TEP).
      *   **Goal:** Move away from lecture/board work to an experiential game where students *feel* the paradox through their choices and aggregated results.
      *   **Specific Constraints/Requests:**
          *   Avoid saying "paradox" or "expected value" until debrief.
          *   Include the "both peek and both want to switch" collision.
          *   Address the "randomized threshold" strategy student proposal.
          *   Address the "heavy-tailed distribution" issue (running averages lurching).
          *   Provide: Rules, Envelope Contents/Generation, Payoff Scheme, Timeline, Debrief mapping, Predictable Failures/Workarounds, Limitations of the game.

  2.  **Deconstruct the Two-Envelope Problem (TEP):**
      *   *The Setup:* Envelope A has $x$, Envelope B has $2x$. You pick A. You don't know $x$.
      *   *The Argument:* If I switch, I either get $2x$ (gain $x$) or $x/2$ (loss $x/2$). Since $x > x/2$, expected gain is positive. So switch.
      *   *The Flaw:* Treating the $x$ in the gain scenario and the $x$ in the loss scenario as the same random variable with the same prior distribution, when they aren't. Or, implicitly assuming a uniform prior over $(0, \infty)$, which is impossible.
      *   *The "Both Switch" Collision:* If both players in a pair peek and reason this way, they both want to swap. But swapping is zero-sum between them.
      *   *The Threshold Strategy:* If you pick a threshold $T$ from a distribution that has support over all possible values, and switch if observed value $< T$, you *do* gain a probability advantage (probability $> 0.5$ of ending with the larger amount), *but* this doesn't necessarily maximize expected value in the same way, and relies on the distribution of money in the envelopes being independent of $T$.
      *   *The Heavy Tail Issue:* If the distribution of money has no finite mean (e.g., Cauchy or certain Pareto distributions), expected value calculations break down entirely. This is a crucial mathematical nuance.

  3.  **Designing the Game Mechanics:**
      *   *Pairs:* 22 students = 11 pairs.
      *   *Envelopes:* Need 11 pairs of envelopes.
      *   *Contents:* Need to generate amounts $(x, 2x)$.
      *   *Payoff:* Chocolate or Points. Let's use Points (course credit) because it's easier to aggregate and "finite supply" reasoning is a specific concern the user mentioned. Actually, chocolate is more visceral. Let's suggest a hybrid: Points for the grade, Chocolate for the immediate gratification. Let's stick to Points for easier aggregation, but promise Chocolate to the winners to keep stakes tangible.
      *   *Rounds:* Need multiple rounds to show aggregation. Let's say 3 rounds.
      *   *The "Collision":* In Round 2, force the "Peek & Decide" scenario where they trade *with each other*.
      *   *The Threshold:* Save this for Round 3 as an "Advanced Strategy" option.

  4.  **Addressing the "Heavy Tail" / Distribution Issue:**
      *   The user noted running averages lurching. This happens if the underlying distribution has infinite expectation (e.g., $P(X=2^k) \propto 1/k$ or similar).
      *   *Decision:* For a 2nd-year course, we want to illustrate the *paradox*, not necessarily the *measure-theoretic breakdown* unless that's the specific lesson. However, the user asked about it.
      *   *Solution:* Use a *bounded* distribution for the game to ensure convergence, but discuss the unbounded case in the debrief. If the distribution is unbounded (like powers of 2 up to infinity), the EV is undefined. If we use a finite cap (e.g., max £100), the paradox dissolves mathematically but feels intuitive.
      *   *Better approach for the game:* Use a specific, fixed set of pairs (e.g., (£10, £20), (£20, £40)...). Do *not* generate them randomly from a heavy-tailed distribution during class. Pre-determine the amounts. This avoids the "lurching average" problem during the short class time and isolates the logical error from the statistical instability.
      *   *Wait, the user wants them to run into the problem.* If I fix the amounts, the EV calculation is straightforward. The paradox arises from *conditional* probability confusion.
      *   *Refinement:* Use a fixed set of 11 pairs. Range: £2 to £64 (powers of 2). This keeps numbers simple. Cap it so the "infinite mean" issue doesn't confuse the empirical results.

  5.  **Addressing the Threshold Strategy:**
      *   Is the student right? Yes, technically. If you choose a pivot $T$ from a continuous distribution independent of the envelope contents, $P(\text{end with larger}) > 0.5$.
      *   *Does it belong?* Yes, but it's distinct from the EV switching argument. It's about probability of winning, not expected value magnitude.
      *   *Implementation:* In Round 3, allow them to write down a "Switch Rule" before peeking.

  6.  **Drafting the Timeline (80 mins):**
      *   0-10: Setup & Rules (No theory).
      *   10-25: Round 1 (Blind Choice). Baseline.
      *   25-40: Round 2 (Peek & Trade). The Collision.
      *   40-55: Round 3 (Threshold Strategy). Testing the student idea.
      *   55-80: Debrief & Theory.

  7.  **Drafting the Debrief:**
      *   Map Round 2 to the "Both Switch" impossibility.
      *   Map Round 1/2 data to the "EV is zero" reality vs. "EV is positive" feeling.
      *   Map Round 3 to the Threshold strategy (Probability vs. Value).
      *   Address the "Infinite Mean" issue explicitly here.

  8.  **Addressing Predictable Failures:**
      *   *Refusing to open:* Treat as a "Control Group."
      *   *Mind-reading:* Acknowledge it, but remind them the amounts are fixed randomly.
      *   *Finite Chocolate:* Acknowledge it. This actually helps kill the "infinite prior" assumption.
      *   *Data shows break-even:* This is the *correct* result. The lesson is "Why did you *feel* like switching was better?" not "Why did switching lose money?"

  9.  **Refining the "Collision":**
      *   User wants: "Both members of a pair peek... each concludes trading is better... trade with each other."
      *   Mechanic: In Round 2, Pair members sit opposite. They get Envelope A and B. They peek. They write "Keep" or "Switch". If both write "Switch", they swap. If both "Keep", they stay. If mismatch, force a swap? No, if mismatch, one wants to swap, one doesn't. Usually, TEP implies *you* have the option.
      *   *Correction:* In the standard TEP, you don't trade with a specific person; you trade with the "house". But the user wants the "collision" visible.
      *   *Adaptation:* Make it a zero-sum trade between partners. If both want to switch, they swap. If neither, they don't. If one wants and one doesn't... force the swap (since one has the right to switch).
      *   *Better:* To highlight the symmetry: Give Pair 1 Envelope A and B. Student 1 gets A, Student 2 gets B. They peek. They decide independently. If *both* decide to switch, they swap envelopes. If *neither*, they keep. If *one* wants to switch, allow the switch (the other must comply).
      *   *Wait, the paradox is:* "I should switch" and "He should switch." If they swap, they are in the exact same state as before.
      *   *Revised Mechanic for Round 2:* They peek. They write down "Expected Value of Switching" (without calling it that). Just "Do you want to swap?" If both say Yes, they swap. Then reveal values.

  10. **Refining the Distribution/Generation:**
      *   User mentioned "running averages lurching". This implies they might have used a distribution like $P(X=2^k) = 2^{-k}$. The mean is finite there. If they used $P(X=2^k) \propto 1/k$, mean is infinite.
      *   *Advice:* For the *game*, use a **finite, fixed set** of pairs. Do not generate randomly live. This controls the variance.
      *   *Why?* With 22 students, you only have 11 data points per round. Statistical noise will drown out the signal if the distribution is heavy-tailed. You want the *logic* to fail, not the *law of large numbers*.
      *   *Debrief:* Explain that if the distribution *were* unbounded in a specific way, the math breaks differently.

  11. **Final Polish of the Plan:**
      *   Make sure the "Threshold" strategy is clear.
      *   Ensure the "Finite Chocolate" objection is turned into a teaching point (it bounds the prior).
      *   Ensure the "Break-even data" is framed correctly (it proves the EV argument wrong).

  12. **Self-Correction/Review against constraints:**
      *   *No "Expected Value" words until debrief?* Check. Use "Score" or "Potential Gain".
      *   *Collision staged?* Yes, Round 2.
      *   *Threshold strategy included?* Yes, Round 3.
      *   *Heavy tail addressed?* Yes, in Debrief + Setup advice.
      *   *Timeline feasible?* 80 mins is tight for 3 rounds + debrief. Might need to cut Round 3 or simplify. Let's keep Round 3 but make it quick.
      *   *Payoff:* Points are safer for aggregation. Chocolate for the "winners".

  13. **Finalizing the "Threshold" Verdict:**
      *   The student *is* right that a randomized threshold increases the *probability* of holding the larger amount above 50%.
      *   However, it does not guarantee a positive *expected value* gain if the underlying distribution has infinite mean.
      *   It *does* guarantee a positive EV gain if the underlying distribution has a finite mean.
      *   *Decision:* Tell the user the student is mathematically correct about probability, but it's a different metric than the standard paradox focuses on. Include it as a "Bonus Round".

  14. **Writing the Response:** Structure clearly with headings. Be direct and practical. (Self-correction: Ensure the distinction between "Probability of winning" and "Expected Value" is clear in the debrief section, as that's where the threshold strategy lives).

  *(Self-Correction on the "Collision")*: The user wants them to trade *with each other*.
  *Setup:* Pair of students. Pair of Envelopes ($x, 2x$).
  *Round 2:* Student 1 gets $E_1$, Student 2 gets $E_2$. They peek.
  *Instruction:* "Calculate whether swapping improves your position."
  *Action:* If both say "Yes", they swap.
  *Result:* They swap $x$ for $2x$ and $2x$ for $x$. Net change = 0.
  *Feeling:* Both felt they gained. Reality: Net zero.
  *Perfect.*

  *(Self-Correction on Distribution)*:
  If I use a fixed set (e.g., 11 pairs pre-written), the "heavy tail" issue is removed from the *experience* but can be discussed in *theory*. This is better for a 80-min class. If the averages lurch during class, students blame the randomness, not the logic. I want them to blame the logic. So: **Fixed, bounded amounts.**

  Let's assemble the plan.cw
answer: |-
  This is a classic pedagogical challenge: the Two-Envelope Problem (TEP) is intuitively compelling precisely because it exploits a gap between *feeling* and *formalism*. To close that gap, you need the students to burn their own fingers on the logic, not watch you wave a hand at it.

  Here is a complete lesson plan designed to force the paradox into the open through gameplay, aggregation, and specific constraints.

  ### 1. The Setup & Materials

  **Class Size:** 22 Students (11 Pairs).
  **Seating:** Pairs facing each other.
  **Materials:**
  *   **22 Envelopes:** 11 distinct *pairs*.
  *   **Currency:** "Course Points" (tracked on a spreadsheet) + Small Chocolate prizes for the top 3 scorers at the end. (Points allow for negative scores/aggregation; chocolate provides visceral stakes).
  *   **Decision Cards:** Two per student per round (Green: KEEP, Red: SWITCH).
  *   **Projector:** To display aggregate class data in real-time.

  **The Envelope Contents (Crucial):**
  Do **not** generate these live from a heavy-tailed distribution. If you do, the variance will drown out the lesson, and students will blame the "bad luck" of the draw rather than the logic of the argument.
  *   **Pre-generate 11 pairs.**
  *   **Values:** Use powers of 2 to make the "double/half" math instant. Range: £2 to £128.
      *   Pair 1: (£2, £4)
      *   Pair 2: (£4, £8)
      *   ...
      *   Pair 11: (£64, £128)
  *   **Why:** This bounds the prior. It prevents the "infinite mean" mathematical breakdown from confusing the *logical* breakdown. It ensures the aggregate data converges quickly enough for an 80-minute class.
  *   **Distribution:** Shuffle the 11 pairs and deal one pair to each table.

  ### 2. The Rules (The "Silent" Protocol)

  **Constraint:** You cannot use the words "Expected Value," "Paradox," "Prior," or "Distribution" until the Debrief (Minute 55). Use "Score," "Guess," and "Rule."

  **Round 1: The Blind Baseline (15 mins)**
  *   **Setup:** Each student gets one envelope from the pair. They **cannot** open it.
  *   **Decision:** They must choose Keep or Switch *blindly*.
  *   **Action:** If a pair mismatches (one Keep, one Switch), the Switcher gets their wish (they swap). If both Switch, they swap. If both Keep, they stay.
  *   **Reveal:** Open envelopes. Record scores.
  *   **Point:** Establishes that without information, switching is a coin toss.

  **Round 2: The Collision (25 mins)**
  *   **Setup:** Reshuffle envelopes within the pair (so values are randomised again). Each student gets one envelope.
  *   **Action:** They **must** open their envelope. They see the amount (e.g., £20).
  *   **Decision:** They calculate silently: *"If I switch, I could gain £20 or lose £10. That looks good."* They mark their card.
  *   **The Trap:** You explicitly instruct: *"If both of you decide to Switch, you must trade with each other."*
  *   **Reveal:** Open envelopes. Record scores.
  *   **Goal:** Create the situation where both students feel they have a positive expectation, trade, and end up exactly where they started (or worse, if they incur a 'transaction cost'—see Payoff Scheme).

  **Round 3: The Threshold Strategy (15 mins)**
  *   **Setup:** New envelopes (or reshuffled).
  *   **Action:** Before receiving the envelope, each student writes down a **Threshold Number** (e.g., £50) on a slip of paper.
  *   **Rule:** "If the amount in your envelope is *less* than your Threshold, you Switch. If it is *more*, you Keep."
  *   **Reveal:** Open envelopes. Record scores.
  *   **Goal:** Test the student's claim from last year.

  **Payoff Scheme:**
  *   **Base Score:** The value in the envelope they end up with.
  *   **Transaction Cost:** To make the "Both Switch" collision sting, charge a **5% tax** on any switch. (If you switch, your final value is multiplied by 0.95).
  *   **Why:** If both switch, they swap values *and* both lose 5%. This makes the "Both Switch" outcome strictly negative sum, highlighting the absurdity of mutual advantage.

  ### 3. Minute-by-Minute Timeline (80 Minutes)

  *   **00–10: Setup.** Distribute envelopes. Explain rules strictly mechanically. No theory. Emphasize the 5% switching tax.
  *   **10–25: Round 1 (Blind).** Play, record, aggregate. Show class average. (Expect ~50/50 split, avg score neutral).
  *   **25–40: Round 2 (Peek & Collision).** Play. **Crucial Moment:** Ask for a show of hands: "Who saw an amount and decided Switching had higher potential gain?" (Most will raise hands). "Who traded with their partner?" (Pairs who both raised hands). Reveal values. Calculate scores with the 5% tax.
  *   **40–55: Round 3 (Threshold).** Play. This takes longer as they choose thresholds. Aggregate results.
  *   **55–80: Debrief.** The theoretical unpacking.

  ### 4. The Debrief: Mapping Moments to Theory

  This is where you earn your pay. Do not lecture; interrogate the data on the screen.

  **Moment 1: The Round 2 Collision (The Symmetry Argument)**
  *   **Ask:** "In Round 2, look at the pairs where both of you switched. You both thought you were gaining. What happened to the total points in that pair?"
  *   **Observation:** The total points decreased (due to the 5% tax) or stayed same (without tax).
  *   **Theory Link:** This attacks the **Independence Premise**. The switching argument assumes *your* gain is independent of *your partner's* loss. But in a closed pair, one's gain is the other's loss. If the argument proves *you* should switch, it proves *they* should switch. If both switch, the argument implies the total value increased magically.
  *   **Key Phrase:** "The argument proves too much. If it works for you, it works for him. If it works for both, it violates conservation of value."

  **Moment 2: The Aggregate Data (The EV Reality)**
  *   **Ask:** "Look at the class average for Switchers vs. Keepers in Round 2. Did Switchers win?"
  *   **Observation:** The data will show break-even (minus the tax).
  *   **Theory Link:** This attacks the **Calculation Premise** ($0.5 \times 2x + 0.5 \times 0.5x = 1.25x$).
  *   **Explanation:** The variable $x$ is not fixed. When you hold £20, $x$ could be £20 (other is £40) or $x$ could be £10 (other is £20). The probability of being in the "low" envelope vs. the "high" envelope is not necessarily 50/50 conditional on the observed value.
  *   **Key Phrase:** "You treated the $x$ in the gain term and the $x$ in the loss term as the same number. They aren't."

  **Moment 3: The Threshold Strategy (The Student's Claim)**
  *   **Ask:** "Did the Threshold strategy beat random switching?"
  *   **Observation:** Likely yes (in terms of *probability* of holding the larger amount), but maybe not in *total points*.
  *   **Theory Link:** Distinguish **Probability of Winning** vs. **Expected Value**.
  *   **Verdict:** The student was *partially* right. A randomized threshold *does* give you a $>50\%$ chance of ending with the larger amount (Cover's Algorithm). However, it does not necessarily yield a positive *Expected Value* gain if the underlying distribution is heavy-tailed.
  *   **Key Phrase:** "You can increase your odds of picking the bigger envelope, but that doesn't mean the math of the '1.25x gain' was correct. It just means you broke the symmetry using outside information (your threshold)."

  **Moment 4: The Heavy Tail (Your Spreadsheet Worry)**
  *   **Discussion:** Address your concern about the "lurching averages."
  *   **Explanation:** "I capped the envelopes at £128 today. What if I told you I could put £1,000,000,000 in an envelope? If the distribution of money has no finite mean (like a Cauchy distribution), the Expected Value is undefined. The '1.25x' calculation isn't wrong; it's meaningless."
  *   **Takeaway:** The paradox relies on an implicit assumption that the money comes from a distribution with a finite mean.

  ### 5. Predictable Failures & Workarounds

  **1. "I didn't open the envelope." (The Refusers)**
  *   **Prediction:** 2-3 students will refuse to peek, claiming it's irrelevant.
  *   **Utility:** **Keep them.** They are your Control Group. In the debrief, compare their average score to the "Peekers." If the Peekers did worse (due to the tax/switching fever), the Refusers win. This validates the "Ignorance is Bliss" interpretation of TEP.

  **2. "I knew he would switch, so I kept." (The Game Theorists)**
  *   **Prediction:** One pair will try to out-psych each other.
  *   **Utility:** Acknowledge this. "You moved the game from Decision Theory to Game Theory." Remind them the amounts were fixed *before* they entered the room, so mind-reading doesn't change the envelope contents, only the allocation.

  **3. "You only have 11 pairs of chocolate, so the max value is bounded." (The Finite Supply Objection)**
  *   **Prediction:** A sharp student will note the physical limit of your budget.
  *   **Utility:** **Lean into this.** This is the correct mathematical objection to the standard paradox! The standard paradox assumes a uniform prior over $(0, \infty)$, which is impossible. The fact that your chocolate budget is finite means there *is* a maximum value $M$. If they see £128, they *know* they can't double.
  *   **Debrief Point:** "This student just solved the paradox. The switching argument fails because in the real world (and this classroom), priors must be bounded."

  **4. "The data shows switching is break-even, not losing."**
  *   **Prediction:** You worried the data wouldn't show switching is *bad*.
  *   **Utility:** This is actually **better**. The paradox claims switching is *better* (+25%). If the data shows it is *neutral* (0%), the paradox is falsified. You don't need switching to be losing; you just need it to not be winning.
  *   **Script:** "The argument promises you a free lunch. The data shows you a flat table. A free lunch that doesn't arrive is still a lie."

  ### 6. What The Game Cannot Do (Honesty Check)

  You asked for honesty about limitations. Here they are:

  1.  **It cannot reproduce the "Infinite Mean" breakdown.** Because you must cap the envelopes for the game to function in 80 minutes, you are removing the specific mathematical pathology where EV is undefined. You are illustrating the *probabilistic confusion*, not the *measure-theoretic divergence*. You must supply the "Infinite Mean" explanation verbally in the debrief.
  2.  **It cannot force the "Prior" realization.** Students will likely walk away thinking "Switching doesn't work because of the tax" or "because my partner countered me." They may not internalize that the error is in the *conditional probability* $P(\text{other is higher} | \text{my value})$. You must explicitly draw the decision tree on the board in the debrief to show that $P(\text{higher})$ is not always 0.5.
  3.  **The Threshold Strategy is a Distraction.** Be careful. The Threshold Strategy (Cover's Algorithm) is mathematically sound for *probability of winning*, but it sidesteps the *Expected Value* paradox. If you spend too long on Round 3, students will think the Threshold Strategy "solves" the TEP. It doesn't; it changes the metric. You must clarify that the TEP is about EV, while the Threshold is about Win Rate.

  ### Summary Checklist for You
  *   [ ] **Prep:** 11 Pairs of envelopes (Powers of 2, capped at £128).
  *   [ ] **Tax:** Enforce the 5% switching cost to make the "Both Switch" collision painful.
  *   [ ] **Silence:** Ban the word "Expected" until Minute 55.
  *   [ ] **Data:** Project the Round 2 "Both Switched" pairs' net change prominently.
  *   [ ] **Debrief:** Focus on the *symmetry* failure (Round 2) and the *variable* confusion (Round 1 vs 2).

  This plan turns the abstract error into a concrete social collision. They won't just hear that the argument is flawed; they will have signed a card saying "I want to switch," traded with a partner who signed the same card, and watched their points drop. That sting lasts longer than a board derivation.
