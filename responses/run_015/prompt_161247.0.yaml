      *   **Intro:** Define Terms (Measure, Reference Class, Typicality). Acknowledge the sophistication of VOR.
      *   **Defeater 1 (Most Decisive): Thermodynamic Circularity.** Reliability *requires* the low-entropy past it's supposed to verify.
      *   **Defeater 2 (High Decisiveness): Empirical Insulation.** The view is unfalsifiable by cosmological data.
