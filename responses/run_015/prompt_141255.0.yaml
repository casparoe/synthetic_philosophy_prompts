answer: |-
  **MEMORANDUM**

  **TO:** Nosology and Entitlements Committee
  **FROM:** Policy Analyst
  **SUBJECT:** Recommendation on Petition for Constitutive Cortisol Hyper-Response
  **DATE:** October 26, 2023

  **1. The Rule-Space: Candidate Doctrines Consistent with Precedents**

  The Committee's seven recent decisions do not articulate a single unified theory of disease. Instead, they sustain five distinct doctrinal rules. Each fits the majority of our precedents but strains against at least one.

  *   **Rule A: The Age-Relative Statistical Norm.** A condition is a disease only if the patient's functional metrics deviate significantly from an age-matched reference population.
      *   *Support:* Precedent 2 (Aging/Bone Loss) explicitly rejects listing conditions universal to the elderly. Precedent 4 (Sickle Cell Trait) implies statistical commonality negates disease status in specific environments.
      *   *Strain:* Precedent 1 (Hypertension) uses an absolute threshold applied identically at every age, despite blood pressure naturally rising with age. Precedent 3 (Caries) lists a condition present in 90% of adults.

  *   **Rule B: The Environmental Mismatch.** A condition is a disease if the organism functions poorly in the environment its bearers *actually* inhabit, even if the trait is statistically common or ancestrally normal.
      *   *Support:* Precedent 3 (Caries) lists a near-universal condition because the "reference population is environmentally abnormal." Precedent 1 (Hypertension) implicitly relies on the modern environment making high BP harmful.
      *   *Strain:* Precedent 2 (Aging) declines to list universal age-related decline, even though the modern environment extends life beyond the ancestral norm. Precedent 4 (Sickle Cell Trait) declines listing despite environmental mismatch (malaria-free zones).

  *   **Rule C: The Mechanism Failure.** A condition is a disease only if a specific physiological mechanism has failed or is structurally disordered, not merely if a setting is high or low.
      *   *Support:* Precedent 4 (Sickle Cell) distinguishes disease (homozygous) from variant (heterozygous) based on functional departure. Precedent 7 (Deafness) lists a disorder of the auditory mechanism. Precedent 6 (Preclinical Alzheimer's) declines listing where biomarkers exist but clinical dysfunction is absent.
      *   *Strain:* Precedent 5 (Exertion Syndrome) lists a condition with *no* identified mechanism or biomarker. Precedent 1 (Hypertension) lists a "set point" variation where the pump itself need not be broken.

  *   **Rule D: The Risk-Intervention Nexus.** A condition is a disease if it materially raises the risk of future harm *and* an effective intervention exists to reduce that risk.
      *   *Support:* Precedent 1 (Hypertension) lists an asymptomatic risk state because treatment is cheap and effective. Precedent 6 (Preclinical Alzheimer's) declines listing a risk state specifically because no intervention alters the course.
      *   *Strain:* Precedent 2 (Aging) involves high risk and treatable consequences (e.g., hip fractures from bone loss) but is declined. Precedent 5 (Exertion Syndrome) lists based on present suffering, not future risk.

  *   **Rule E: The Suffering and Disability Override.** A condition is a disease if it produces significant subjective suffering or functional disability, regardless of mechanism or statistical normality.
      *   *Support:* Precedent 5 (Exertion Syndrome) lists based on "real disability" despite lacking biomarkers. Precedent 3 (Caries) emphasizes pain and tooth loss.
      *   *Strain:* Precedent 1 (Hypertension) is listed despite being asymptomatic. Precedent 4 (Sickle Cell Trait) is declined despite potential symptoms under severe hypoxia.

  **2. Predictions for the Petition**

  The petition asks for listing at all adult ages. The condition is asymptomatic, carries a 1.4x risk of metabolic events, is treatable, and prevalence rises from 9% (age 25) to 82% (age 70).

  *   **Under Rule A (Age-Relative):** Predicts **Listing at 25, Declining at 70.** At 25, the 9% prevalence indicates deviance. At 70, the 82% prevalence makes it the statistical norm. This rule forces the Committee to choose between the absolute threshold of Precedent 1 and the age-matched approach of Precedent 2.
  *   **Under Rule B (Environmental Mismatch):** Predicts **Listing at all ages.** The "environment actually inhabited" is modern/urban. The trait is maladaptive here (diabetes/CV risk), even if ancestral. This follows Precedent 3 (Caries). However, it conflicts with Precedent 2, which treats aging as a biological constant rather than an environmental mismatch.
  *   **Under Rule C (Mechanism Failure):** Predicts **Declining at all ages.** The petition stipulates "nothing in the mechanism has failed." This aligns with Precedent 4 (Trait) and Precedent 7 (Deafness notation regarding mechanism vs. person). It contradicts Precedent 1 (Hypertension), which lists a set-point deviation.
  *   **Under Rule D (Risk-Intervention):** Predicts **Listing at all ages.** There is a proven risk (1.4x) and a proven intervention (20% reduction). This aligns perfectly with Precedent 1 (Hypertension) and distinguishes Precedent 6 (Alzheimer's), which lacked intervention. It struggles to explain Precedent 2 (Aging), where interventions exist but listing is denied.
  *   **Under Rule E (Suffering):** Predicts **Declining at all ages.** The condition is asymptomatic. Some bearers report advantages. This aligns with the rejection of Precedent 6 but contradicts Precedent 1.

  **3. Closest Analog and Recommendation**

  **Closest Analog:** Precedent 1 (Asymptomatic Essential Hypertension).
  Both are asymptomatic physiological set-points, defined by biomarkers, carrying elevated cardiovascular risk, and responsive to cheap generic medication. The dissent in Precedent 1 mirrors the petition's opposition here: that we are medicalizing a variant rather than curing a failure.

  **Recommendation:** **List provisionally for adults under age 50; classify as a risk factor for adults over 50.**

  **Reasoning:**
  This split verdict respects the tension between Precedent 1 and Precedent 2 without resolving it prematurely.
  1.  **Under 50:** Prevalence is low (9% to 20%). Listing aligns with Precedent 1 (Risk + Intervention) and avoids the Precedent 2 prohibition on labeling the majority of a population as diseased. It treats the condition as a pathological deviation in the modern environment (Precedent 3).
  2.  **Over 50:** Prevalence exceeds 45% and reaches 82%. Listing here would violate the explicit holding in Precedent 2 that the Committee "would not adopt a reading on which most of the elderly population is diseased." Even if the mechanism is identical to the younger cohort, the statistical normality shifts the classification to "aging" or "risk factor."
  3.  **Provisional Status:** Following Precedent 5, provisional listing acknowledges the manufacturer-funded cohort data and the identity-based opposition (Precedent 7). It allows coverage while mandating a review of long-term outcomes independent of industry funding.

  **4. Doctrinal Commitments of Available Options**

  The Committee should be aware that each available verdict adopts a specific reading of the statutory definition ("departure from normal functional organization... harmful... in the environment its bearers actually inhabit").

  *   **Option 1: List at All Adult Ages.**
      *   *Commitment:* Adopts **Rule D (Risk-Intervention)** and **Rule B (Environmental Mismatch)**.
      *   *Reading of Statute:* "Normal functional organization" is defined by ancestral or species-typical biology, not current population statistics. "Environment" includes the modern urban context, making ancestral traits harmful.
      *   *Consequence:* Precedent 2 (Aging) is effectively limited to conditions where *no* intervention exists. We commit to treating statistical majorities as diseased if the risk is modifiable. This expands the Schedule significantly but maximizes preventive coverage.

  *   **Option 2: List Only Below Age 50 (Recommended).**
      *   *Commitment:* Adopts a **Hybrid of Rule A and Rule D**.
      *   *Reading of Statute:* "Normal functional organization" is age-relative. A departure at 25 is a disease; the same physiology at 70 is aging. "Harm" is contingent on the intersection of risk and statistical deviance.
      *   *Consequence:* We codify a "double standard" where identical physiology is diseased in the young and normal in the old. This preserves Precedent 2 but creates a cliff-edge for entitlement at age 50. It acknowledges that "environment" changes with age (e.g., labor demands decrease).

  *   **Option 3: Decline and Class as Risk Factor.**
      *   *Commitment:* Adopts **Rule C (Mechanism Failure)**.
      *   *Reading of Statute:* "Departure" requires structural or functional breakdown, not a high set-point. "Harm" from a functioning system, even if risky, is not a disease.
      *   *Consequence:* This overrules the logic of Precedent 1 (Hypertension) in practice, limiting it to its specific facts. It strengthens the protection against medicalization (Precedent 7) but restricts the Schedule to "broken" parts, excluding dysregulations.

  *   **Option 4: List Provisionally (All Ages).**
      *   *Commitment:* Adopts **Rule E (Suffering/Disability)** modified for Risk.
      *   *Reading of Statute:* "Disease" is a pragmatic category for conditions warranting clinical management, pending better science.
      *   *Consequence:* This defers the definitional question. It commits the Committee to a review process rather than a principled boundary. It risks the perception of indecision but accommodates the identity concerns in Precedent 7.

  **5. The Distinguishing Case**

  To resolve the inconsistency between Precedent 1 (Absolute Threshold) and Precedent 2 (Age-Relative), the Committee should commission a review on:

  **Isolated Systolic Hypertension (ISH) in Patients Over 80.**

  *   **Why this case:** ISH is high blood pressure driven primarily by arterial stiffening (aging). It carries high cardiovascular risk and is treatable.
  *   **The Test:**
      *   If we **List** ISH in the 80+ cohort: We affirm **Rule D (Risk-Intervention)** and effectively overrule the statistical limitation in Precedent 2. We commit to the view that "aging" is not a shield against disease status if treatment works.
      *   If we **Decline** ISH in the 80+ cohort: We affirm **Rule A (Age-Relative)** and limit Precedent 1. We commit to the view that "normal functional organization" degrades with age, and that degradation is not a disease, even if treatable.
  *   **Why it is not settled:** Precedent 1 involved "essential hypertension" without specifying age limits, but Precedent 2 explicitly protected the elderly from disease classification. ISH sits exactly on this fault line: it is hypertension (P1) that is mechanistically indistinguishable from aging (P2). Deciding this will tell us whether the Cortisol decision should be split by age or universal.

  **Summary**
  The Committee is currently operating with contradictory thresholds for "normality." The Cortisol petition forces a choice between the Hypertension model (Risk + Treatment = Disease) and the Aging model (Universality = Normality). I recommend splitting the verdict by age to honor both precedents until the Committee is prepared to resolve the underlying doctrinal conflict via the ISH review.
