      *   **Constraint:** Work through conceptual tension directly, *without* relying on named technical literatures or bibliographic appeals (no citing Reichenbach, Hájek, Kahneman, etc., by name).
      *   **Tone:** Philosophical, reflective, rigorous, yet accessible.

  2.  **Deconstruct the Perspectives:**

