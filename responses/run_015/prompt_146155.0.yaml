  # Metaethical Sorting Instrument

  ### Part I: The Branching Questions

  Please answer the following three questions in order. Select the option that best captures your fundamental commitment, even if your view requires some nuance.

  **Question 1: The Nature of Disagreement**
  When two people argue about a moral issue (e.g., whether an action is wrong), are they primarily:
  *   **A.** Disputing a matter of fact, where one party is correct and the other is mistaken about how the world is? (Cognitive)
  *   **B.** Expressing conflicting plans, attitudes, or commitments, where the conflict is more like a clash of wills than a contradiction of facts? (Practical)

  **Question 2: The Ground of Correctness**
  *If* we treat moral claims as capable of being correct or incorrect, what fixes that correctness?
  *   **A.** Ordinary natural properties (e.g., biological, psychological, or sociological facts) alone. (Natural)
  *   **B.** Irreducibly normative properties that are part of the fabric of reality but not reducible to science. (Non-Natural)
  *   **C.** The hypothetical responses of an agent under idealized conditions (e.g., full information, rationality). (Idealized Response)
  *(Note: If you answered **B** in Question 1, select the option that best describes what governs the correctness of the attitude, even if you deny it constitutes "truth".)*

  **Question 3: The Intelligibility of Progress**
  How should we understand moral progress over time?
  *   **A.** As a convergence on independent truths that exist regardless of our opinions. (Convergence)
  *   **B.** As a growing coherence among our attitudes, principles, and practices, without necessarily reaching a single external target. (Coherence)
  *   **C.** As a category mistake; there is no such thing as moral progress, only change. (Category Mistake)

  ***

  ### Part II: The Decision Tree and Position Mapping

  Follow your answers through the branches below to locate your metaethical position. Each terminal leaf identifies the position and notes a specific philosophical difficulty associated with it.

  **Branch 1: Question 1 (Nature of Disagreement)**

  *   **Path A (Cognitive)** → Go to Branch 2A.
  *   **Path B (Practical)** → Go to Branch 2B.

  **Branch 2A: Question 2 (Ground of Correctness) — *For Cognitive Views***

  *   **Path A (Natural)** → Go to Branch 3A.
  *   **Path B (Non-Natural)** → Go to Branch 3B.
  *   **Path C (Idealized Response)** → Go to Branch 3C.

  **Branch 2B: Question 2 (Ground of Correctness) — *For Practical Views***

  *   **Path A (Natural)** → **Leaf 1 (Unnamed)**
  *   **Path B (Non-Natural)** → **Leaf 2 (Unnamed)**
  *   **Path C (Idealized Response)** → Go to Branch 3D.

  **Branch 3A: Question 3 (Progress) — *For Cognitive + Natural***

  *   **Path A (Convergence)** → **Leaf 3: Cornell-Style Naturalist Realism**
      *   *Awkward Commitment:* This view struggles to explain why moral terms refer to natural kinds when cross-cultural disagreement persists without clear scientific resolution.
  *   **Path B (Coherence)** → **Leaf 4 (Unnamed)**
  *   **Path C (Category Mistake)** → **Leaf 5: Error Theory** (Shared Leaf)
      *   *Awkward Commitment:* It implies that morality lacks authority over agents who lack the capacity to recognize that all moral claims are false.
      *   *Ambiguity Flag:* **Error Theory** and **Moral Fictionalism** occupy this leaf.
      *   *Resolution Case:* Can a being with no conscious states but with functional analogues to suffering be wronged? (Fictionalists may say "yes" within the pretense; Error Theorists say "no" strictly speaking).

  **Branch 3B: Question 3 (Progress) — *For Cognitive + Non-Natural***

  *   **Path A (Convergence)** → **Leaf 6: Non-Naturalist Realism**
      *   *Awkward Commitment:* It must explain why agents with different psychological capacities do not converge on these irreducible truths despite equal rationality.
  *   **Path B (Coherence)** → **Leaf 7 (Unnamed)**
  *   **Path C (Category Mistake)** → **Leaf 5: Error Theory** (See Above).

  **Branch 3C: Question 3 (Progress) — *For Cognitive + Idealized***

  *   **Path A (Convergence)** → **Leaf 8: Ideal-Observer Constructivism**
      *   *Awkward Commitment:* It faces difficulty explaining the authority of morality over agents who lack the psychological capacity to reach the idealized condition.
  *   **Path B (Coherence)** → **Leaf 9: Moral Relativism**
      *   *Awkward Commitment:* It cannot intelligibly condemn cross-cultural disagreement if both cultures cohere internally with their own idealized response conditions.
  *   **Path C (Category Mistake)** → **Leaf 5: Error Theory** (See Above).

  **Branch 3D: Question 3 (Progress) — *For Practical + Idealized***

  *   **Path A (Convergence)** → **Leaf 10 (Unnamed)**
  *   **Path B (Coherence)** → **Leaf 11: Non-Cognitivist Expressivism**
      *   *Awkward Commitment:* It struggles to explain how moral disagreement involves contradiction when agents merely lack the relevant conative attitudes.
  *   **Path C (Category Mistake)** → **Leaf 12 (Unnamed)**

  ***

  ### Part III: Unoccupied Combinations

  Two specific combinations of answers appear to be unoccupied in the contemporary literature. Their status is diagnosed as follows:

  1.  **Combination:** Practical (Q1) + Non-Natural (Q2) + Convergence (Q3).
      *   **Diagnosis:** **Incoherent.** If moral disagreement is merely a conflict of attitudes (Practical), it contradicts the claim that correctness is fixed by irreducible normative properties (Non-Natural), which presuppose truth-aptness. One cannot consistently hold that moral claims are non-truth-apt yet fixed by truth-making normative properties.
  2.  **Combination:** Cognitive (Q1) + Non-Natural (Q2) + Coherence (Q3).
      *   **Diagnosis:** **Unstable.** If moral truths are fixed by independent, irreducible properties (Non-Natural Realism), progress should theoretically be convergence on those truths. Limiting progress to mere coherence among attitudes suggests the truths are not doing the explanatory work, causing the view to collapse into a form of Relativism or Skepticism (Leaf 9 or 7).

  ***

  ### Part IV: Scoring Key

  Use the following key to determine the respondent's landing position based on their three answers (e.g., A-A-A).

  | Q1 (Disagreement) | Q2 (Ground) | Q3 (Progress) | Resulting Leaf | Position Name |
  | :--- | :--- | :--- | :--- | :--- |
  | **Cognitive** | **Natural** | **Convergence** | Leaf 3 | **Cornell-Style Naturalist Realism** |
  | **Cognitive** | **Non-Natural** | **Convergence** | Leaf 6 | **Non-Naturalist Realism** |
  | **Cognitive** | **Idealized** | **Convergence** | Leaf 8 | **Ideal-Observer Constructivism** |
  | **Cognitive** | **Idealized** | **Coherence** | Leaf 9 | **Moral Relativism** |
  | **Cognitive** | **Any** | **Mistake** | Leaf 5 | **Error Theory** (or Fictionalism)* |
  | **Practical** | **Any** | **Coherence** | Leaf 11 | **Non-Cognitivist Expressivism** |
  | **Any** | **Any** | **Other Combos** | Leaves 1, 2, 4, 7, 10, 12 | **Unnamed** |

  *\*Ambiguity Resolution:* If the respondent lands on **Error Theory**, ask: *"Can a being with no conscious states but with functional analogues to suffering be wronged?"* If they say **Yes** (within the moral framework), they are likely a **Fictionalist**. If they say **No** (strictly), they are an **Error Theorist**.
