  *(Self-Correction during drafting)*: I need to make sure I don't just list these but explain the *concrete situation* for each, as requested ("the concrete situation that shows why the requirement is there"). I will format this as a formal briefing document.

  *(Final check on the ending)*: The prompt asks: "tell me what the committee ought to recommend if the honest conclusion is that no candidate meets the non-negotiable requirements." The recommendation must follow from the specification. If the spec says "Must be honest" and "Must be a single target," and those are incompatible, the recommendation must be to drop the "Single Target" constraint.

