      This paper investigates whether John Maynard Keynes's vision of the good life in "Economic Possibilities for our Grandchildren" secretly depends on G.E. Moore's pluralism about intrinsic goods. Specifically, when Keynes predicts humanity will solve the economic problem and devote itself to art and friendship, does he assume Moore's claim that these are the only true intrinsic values, without arguing for them?

