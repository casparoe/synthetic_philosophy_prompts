  **Title:** The Bloomsbury Basis: Keynes, Moore, and the Ethical Foundations of the 15-Hour Workweek

  **Research Question:**
  This paper investigates whether John Maynard Keynes's vision of the good life in "Economic Possibilities for our Grandchildren" secretly depends on G.E. Moore's pluralism about intrinsic goods. Specifically, when Keynes predicts humanity will solve the economic problem and devote itself to art and friendship, does he assume Moore's claim that these are the only true intrinsic values, without arguing for them? The central question is: Is Keynes's utopia philosophically freestanding, or does it require Moore's meta-ethics to hold weight?

  **Literature Gap:**
  Existing scholarship largely treats Keynes as an economist or political theorist. When his ethical views are discussed, they are often reduced to biographical context regarding the Bloomsbury Group. Scholars accept his endorsement of leisure and culture as given, failing to interrogate the normative justification behind them. Consequently, the philosophical structure supporting Keynes's utopia remains underexamined. Most assume his values are self-evident, overlooking the possibility that they rely on a specific, contested meta-ethical framework—namely, Moore's intuitionism. This gap leaves open whether Keynes's economic predictions are actually disguised ethical claims.

  **Methodology:**
  I will employ a comparative close reading of Keynes's essay against Moore's *Principia Ethica*. The analysis will focus on two areas: first, identifying the specific goods Keynes prioritizes in the post-scarcity future (love, art, contemplation); second, mapping these onto Moore's taxonomy of intrinsic values. I will look for structural parallels in how both authors exclude economic utility as an end in itself. Moore argued that pleasure alone is not the good; Keynes argues money alone is not the goal. Furthermore, I will examine Moore's concept of "organic wholes" to see if Keynes's vision of social life mirrors this holistic valuation. The goal is to determine if Keynes's prescription for living rests on Moore's definition of value, even if Keynes does not explicitly cite Moore in this specific text.

  **Scope and Limitations:**
  Honesty regarding scope is crucial for a one-semester project. I cannot definitively prove a psychological causal link (i.e., that Keynes consciously relied on Moore while writing this specific essay). Intellectual history is messy, and Keynes read widely. Instead, I will argue for a philosophical dependency: that Keynes's vision is incoherent without Moore's pluralism. The paper will not cover Keynes's broader economic theory, focusing strictly on the ethical implications of his utopian prediction. Additionally, I will limit the textual analysis primarily to "Economic Possibilities" rather than Keynes's entire corpus, ensuring depth over breadth within the semester timeline.

  **Conditions of Failure:**
  It is vital to define what constitutes a failed thesis. If close reading reveals that Keynes treats art and friendship as instrumental means to social stability rather than intrinsic ends, the Moorean connection collapses. Similarly, if Keynes's value theory aligns more closely with hedonic utilitarianism or Aristotelian virtue ethics than Moore's ideal utilitarianism, the argument fails. Acknowledging this possibility is part of the philosophical rigor; proving a negative dependency is still a valuable result. It would suggest Keynes's ethics are more eclectic than assumed.

  **Conclusion:**
  By exposing the ethical assumptions underlying Keynes's economic prophecy, this paper aims to bridge the gap between economic theory and value theory. It challenges the separation of Keynes the economist from Keynes the moral philosopher.

