          *   (3) says: Rationality requires $P, P \to Q \vdash Q$ *even if* working memory is maxed. This implies a norm that transcends current architectural limits.
          *   (4) says: Rationality norms are *always* relative to cognitive architecture. If your architecture can't hold $Q$, you aren't irrational for not believing $Q$.
