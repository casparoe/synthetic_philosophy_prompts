          *   *Cheapest Fix:* Explicitly state (5) is about *descriptive accuracy* and (3) is about *evaluative standards*.
          *   *Cost:* Need to explain why we evaluate agents against standards they can't meet (the "ought implies can" objection).

      *   **Fix for (2):**
