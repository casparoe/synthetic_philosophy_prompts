          *   *Option C (Compatibilist):* Distinguish "Ideal Rationality" (3) from "Bounded Rationality" (4). But (4) says "always relative," which blocks this. Need to soften (4).
          *   *Cheapest Fix:* Soften (4). Change "always relative" to "implementation-relative, but grounded in ideal norms." Or soften (3): "Rationality requires deriving Q *ceteris paribus* (if resources allow)."
          *   *Cost:* Losing the "hard" naturalist line or losing the "strong" normative bite.

      *   **Fix for (3) vs. (5):**
