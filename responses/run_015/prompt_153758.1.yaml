      *   *Refining the (3) vs (4) analysis:* This is the big one. (3) says "even if working memory is maxed." (4) says "no view from nowhere telling a human with 7±2 slots what they ought to derive." These are mutually exclusive. If memory is maxed, (4) says no norm applies. (3) says norm applies.
