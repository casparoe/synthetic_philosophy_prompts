answer: |-
  **Brainstorming**

  The slogan "shut up and multiply" is a rhetorical compression of at least three distinct layers: epistemic, axiological, and normative. Epistemically, it asserts that the probability estimate is robust enough to be treated as a fixed number rather than a placeholder for ignorance. Axiologically, it assumes value aggregates linearly and is unbounded, such that a large enough payoff dominates any probability discount. Normatively, it claims expected value (EV) is the sole tiebreaker for rational choice, overriding deontological constraints or risk-aversion heuristics.

  It also conflates single-shot decisions with portfolio management. In a portfolio, high-variance long shots might normalize over time; in a one-off budget allocation, they represent existential risk of zero impact. Furthermore, it often smuggles in a psychological claim: that human intuition is reliably buggy regarding small probabilities, whereas arithmetic is neutral. A defensible reading might only claim the psychological correction, while a radical reading demands axiological fanaticism. I need to separate these to show your protagonist where the argument actually turns.

  **The Menu of Theses**

  1.  **Psychological Correction:** Human intuition systematically neglects small probabilities of large impacts; arithmetic corrects this bias.
      *   **Verdict:** Platitude. Most agree intuitions are buggy here.
      *   **Ends Argument?** No. Correcting bias doesn't prove the specific number is right.
      *   **Protagonist Reply:** "I agree my intuition is buggy, but so is the staff's estimate. Correcting one bias with a fabricated number isn't arithmetic; it's superstition."

  2.  **Epistemic Cleanliness:** The probability estimate is derived from a calibrated process reliable enough to be treated as a fixed input for calculation.
      *   **Verdict:** Substantive and contested. False for unique historical events.
      *   **Ends Argument?** Yes, if granted. If the number is solid, the math follows.
      *   **Protagonist Reply:** "This isn't an actuarial table; it's a guess about a unique future. Treating a guess as a constant is the error, not the multiplication."

  3.  **Archimedean Continuity:** There is no threshold below which a positive probability becomes negligible; any chance of a large enough payoff beats a sure modest gain.
      *   **Verdict:** Substantive and contested. Rejecting this avoids Pascal's Mugging.
      *   **Ends Argument?** Yes. It forces the trade-off.
      *   **Protagonist Reply:** "Rationality permits lexicographic preferences. We can prioritize certain goods over speculative ones without violating coherence."

  4.  **Unbounded Utility:** The value scale has no ceiling; averting catastrophe is arbitrarily more valuable than modest welfare gains.
      *   **Verdict:** Substantive and contested. Bounded utility blocks fanaticism.
      *   **Ends Argument?** Yes, combined with Continuity.
      *   **Protagonist Reply:** "Value is bounded by human capacity to experience it. Once everyone is saved, additional 'value' is rhetorical, not mathematical."

  5.  **EV Hegemony:** Expected value is not merely one consideration but the whole of practical rationality.
      *   **Verdict:** Radical and contested. Denies legitimacy to risk-aversion or rights.
      *   **Ends Argument?** Yes. It makes dissent irrational by definition.
      *   **Protagonist Reply:** "EV is a tool for management, not a moral law. We have a duty to the certain beneficiaries that outweighs speculative aggregates."

  **Structural Distinctions and Clean vs. Muddy**

  You must separate **axiological fanaticism** (the outcome *is* better) from **decision-theoretic fanaticism** (you *must choose* it). Your colleague is arguing the latter. You must also separate **single-shot** from **portfolio** decisions. The "fanaticism tax" applies here: money in the long shot is money out of the reliable program. A portfolio defense fails because this budget is a one-off allocation, not a repeated game where variance cancels out.

  Regarding your **Clean vs. Muddy** distinction: You are right. In "clean" cases (actuarial), the probability is a known frequency. In "muddy" cases (unique historical judgment), the probability estimate itself carries a massive error distribution, often spanning orders of magnitude. Multiplying a muddy estimate by a huge payoff yields a meaningless number. This worry does cut against the reliable intervention, but less severely: its errors are bounded and symmetric (thin-tailed), whereas the catastrophe payoff is unbounded and the probability estimate is heavy-tailed with ignorance. The fanatic's reply—that errors cancel—is false here because the errors are correlated across the staff's judgment and not independent trials.

  **Scene Advice**

  Your colleague is most plausibly invoking **EV Hegemony** combined with **Epistemic Cleanliness**. He is asserting that the arithmetic *is* the reason, not just a tool. This reading is question-begging: it presupposes the very axiom (Hegemony) your protagonist disputes. It also presupposes the input is valid (Cleanliness), which it isn't.

  There is a reading she can concede: **Psychological Correction**. She can admit intuitions are flawed without accepting the conclusion. There is a reading she cannot concede without changing her mind: **EV Hegemony**. If she accepts EV is the sole criterion and the inputs are fixed, she loses. The honest verdict is that on the strongest reading (Hegemony + Cleanliness), she must cave. To keep her refusal rational, she must attack the **Epistemic Cleanliness**. She isn't refusing to multiply; she is refusing to treat a guess as a number. Rewrite the scene so she challenges the *input*, not the *operation*.
