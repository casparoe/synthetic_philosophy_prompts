      *   *Key Distinction:* It is *not* Egalitarianism. Egalitarianism cares about the *gap* between people. Prioritarianism cares about the *absolute* level of well-being, but weighted by priority.
      *   *The "Leveling Down" Objection:* This is the classic critique of *Egalitarianism*, not Prioritarianism. If you care only about equality, you might prefer a world where everyone is blind over a world where some see and some are blind (because the first is more equal). Prioritarianism explicitly avoids this. It says making the worse off better is good, but making the better off worse *without benefiting anyone* is bad.
