  3.  **Address the Specific Claims:**
      *   *Claim 1: "Prioritarianism means you always funnel resources to the worst off."*
          *   *Nuance:* It means you give *priority* to the worse off, but not necessarily *always* if the cost to the better off is astronomically high (diminishing marginal utility). However, in a triage scenario (oxygen), it strongly favors the worse off.
      *   *Claim 2: "...so if lowering everyone to the same sick baseline keeps the gap from growing, the view says thats fine."*
