prompt: |-
  I teach an upper-level epistemology seminar, about 18 students, one 75 minute session. I want an in-class activity that makes them actually feel the force of the problem of moral testimony, not just hear a lecture about it. The thing I keep failing to convey is the weird friction between "you're totally justified in deferring to a moral expert" and "but then do you really have a moral belief of your own, or are you just following orders?" I want the rules and incentives set up so they run into that tension themselves before I name it. One constraint I care about: the "moral expert" they defer to should turn out to be just another student who read a rulebook the night before, so the class also has to grapple with how much to trust someone whose moral credentials are opaque. Give me the full runnable design: the exact moral scenario (pick a dilemma where reasonable people genuinely split, so the expert's verdict is contestable), the roles, a payoff scheme that doesn't need real money, a minute-by-minute timeline for the 75 minutes, and a debrief that maps specific moments in the activity onto the philisophical problem. Be honest about which feature of moral testimony a classroom game just can't reproduce and what I'd have to supply myself. And end with a line starting "Verdict:" that states in one sentence the single core tension the whole activity is built to make them feel.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level epistemology seminar, ~18 students, 75 minutes.
      *   **Goal:** Create an in-class activity to make students *feel* the problem of moral testimony (specifically the tension between justified deference and lack of authentic moral understanding/agency).
      *   **Key Constraint:** The "moral expert" must be revealed as just another student who read a rulebook (highlighting opaque credentials).
      *   **Requirements:** Full runnable design (scenario, roles, payoff scheme, timeline, debrief), honesty about limitations, and a specific closing line ("Verdict: ...").
      *   **Target Phenomenon:** The "weird friction" between "you're justified in deferring" vs. "do you really have a moral belief?"

  2.  **Deconstruct the Problem of Moral Testament:**
      *   *Pessimists* (e.g., Hopkins, Hills): Moral knowledge requires understanding *why* something is right/wrong. Testimony gives you the *that*, not the *why*. Therefore, you lack moral worth/autonomy.
      *   *Optimists* (e.g., Jones, Lackey): Moral facts are like other facts. Experts exist. Deference is rational.
      *   *The "Friction":* It feels different to say "I believe X because I see the reasons" vs. "I believe X because Dr. Y said so." The activity needs to simulate the discomfort of acting on a rule you don't understand vs. the pressure to get the "right" answer.

  3.  **Designing the Activity:**
      *   **Scenario:** Needs to be a dilemma where intuition splits, but there's a "correct" answer according to a specific framework. A trolley problem is too cliché. A distributive justice scenario or a specific professional ethics case works better. Let's go with a *Resource Allocation* scenario. It feels bureaucratic yet moral.
      *   **Roles:**
          *   *Agents* (Most students): Need to make a decision.
          *   *The Expert* (1 student): Has the "Answer Key" (the rulebook).
          *   *The Observer/Verifier* (Optional, maybe just the instructor): To manage the payoff.
      *   **The Twist:** The Expert isn't actually an expert; they just have a utilitarian calculus sheet or a deontological rulebook they memorized. The Agents don't know the rule, only the Expert does.
      *   **Incentives:** Needs to simulate "moral correctness" without real money. Points? Extra credit? No, extra credit is risky. Let's use "Epistemic Credit" or a symbolic reward (e.g., choosing the next topic, or just social validation). Actually, to make it *feel* like moral pressure, the payoff should be about *being right* vs. *being autonomous*. Let's use a point system where points = "Moral Standing."
      *   **The "Opaque Credentials" Constraint:** The Agents must be told the Expert is "specially trained" but not shown the training until the end.

  4.  **Drafting the Mechanics:**
      *   *Phase 1: Intuition.* Agents read a case. They vote privately.
      *   *Phase 2: Testimony.* The Expert gives a verdict + a brief justification (which might be unsatisfying).
      *   *Phase 3: Revision.* Agents can change their vote.
      *   *Phase 4: Reveal.* The Expert reveals they just read a pamphlet.
      *   *Phase 5: Debrief.* Connect to epistemology.

      *Refining the Incentive:* If I just ask them to vote, they won't feel the pressure. I need to make them *commit*.
      *Idea:* They have to write a "Public Justification" note. If they defer to the expert, they have to sign the Expert's name, not their own. If they go against, they sign their own. This highlights the loss of agency.
      *Better Idea:* The "Payoff" is avoiding "Moral Blame." If the group gets the "Right Answer" (defined by the Expert's rulebook), everyone gets points. If they get it wrong, they lose points. *However*, if they deferred, they get a "Autonomy Penalty" in the debrief (subjective).
      *Wait, the prompt asks for a payoff scheme that doesn't need real money.* Let's use "Class Currency" redeemable for a trivial privilege (e.g., picking the break time, or a funny certificate).
      *Actually, the strongest incentive is social/epistemic.* Let's make the goal: "Maximize the number of correct moral judgments." The Expert knows the criteria for correctness. The students want to be correct.

      *Revised Mechanic:*
      1.  **The Case:** A hospital triage scenario (who gets the ventilator?).
      2.  **The Expert:** One student given a "Moral Algorithm" (e.g., QALYs strictly).
      3.  **The Group:** 17 students.
      4.  **Task:** Decide who gets the ventilator.
      5.  **Round 1:** Individual intuition.
      6.  **Round 2:** Expert Testimony. Expert says "Patient B" and gives a cryptic reason ("It maximizes the function").
      7.  **Round 3:** Final Decision.
      8.  **The Kicker:** To get "points," they must align with the Expert. But they must write down *why*. If they just copy the Expert, they get points but feel hollow. If they disagree, they risk being "wrong."
      9.  **The Reveal:** The Expert admits they don't care about the patients, they just followed the sheet.

      *Wait, I need to make sure the friction is felt.* The friction is: "I know I should listen to them to be right, but I feel like a puppet."
      *Let's try this:* The "Expert" is actually a *Consultant*. The students are the *Board*. They hire the Consultant. The Consultant gives a recommendation. The Board must vote.
      *Payoff:* If the Board votes with the Consultant, they get "Efficiency Points." If they vote against, they get "Autonomy Points." But the Instructor reveals later that "Efficiency" was the only metric that actually mattered for the "outcome" (simulated).
      *No, that's too game-y.*
      *Let's stick to the core epistemic tension.*
      *Scenario:* The "Trolley Switch" variant is too abstract. Let's use a *Policy Decision*. "Should the university divest from X?"
      *No, too political.*
      *Let's use a specific, contained ethical puzzle.* The "Transplant Surgeon" case (kill one healthy person to save five). Most say no. Utilitarian says yes.
      *Okay, let's go with the "Transplant" case but modified.*
      *The Expert* is told to argue for the counter-intuitive position based on a specific framework (Rule Utilitarianism).
      *The Students* are told the Expert is a "Bioethicist."
      *The Payoff:* Students get a "Correctness Token" if they align with the Expert.
      *The Reveal:* The Expert was just a peer with a cheat sheet.

      *Refining the "Opaque Credentials":* The students need to suspect the Expert isn't real, but not know for sure.
      *Actually, the prompt says:* "The 'moral expert' they defer to should turn out to be just another student who read a rulebook the night before."
      *So, during the activity, they must believe the Expert is legitimate.*
      *How to establish legitimacy?* The Instructor introduces them as a "Guest Consultant" or "Graduate Fellow."
      *How to create the friction?* The students must *defend* the decision. If they defer, they have to parrot reasons they don't understand.

  5.  **Step-by-Step Plan:**
      *   **Prep:** Select 1 Expert. Give them a "Moral Calculus" (a simple algorithm).
      *   **Intro (5 min):** Set stakes. You are an Ethics Board. You must decide. There is an Expert available.
      *   **Case (10 min):** Distribute the "Transplant" case (modified).
      *   **Private Vote (5 min):** Record initial intuition.
      *   **Testimony (10 min):** Expert gives verdict + justification (technical, slightly alienating).
      *   **Deliberation (15 min):** Students discuss. They want the "Right Answer" (Instructor implies there is one).
      *   **Final Vote (5 min):** Commit to a position.
      *   **The Reveal (10 min):** Expert reveals identity/method.
      *   **Debrief (30 min):** Connect to testimony, understanding, autonomy.

      *Wait, 75 minutes is tight.* I need to be precise.
      *Payoff:* "Epistemic Merit Badges." If you get the "Right Answer," you get a sticker/candy. If you defer, you get the badge but I ask you how it feels.
      *Better Payoff:* The "Payoff" is avoiding the "Blame Game." If the decision is "Wrong" (according to the hidden rule), the Board is "liable." If they followed the Expert, the Expert is liable. *This creates the incentive to defer.*
      *Let's refine the liability aspect.*
      *Rule:* If the decision matches the "Moral Truth" (defined by the Expert's sheet), everyone gets +1 Point. If not, -1 Point.
      *BUT:* If you voted with the Expert, you must sign "Via Expert." If you voted against, you sign "Own Reason."
      *This creates the record of deference.*

  6.  **Addressing the Limitations:**
      *   A game can't reproduce the *long-term* corrosion of moral character.
      *   It can't reproduce the *real-world stakes* (nobody dies).
      *   It can't fully simulate the *trust* we place in real experts (parents, religious leaders).
      *   I need to be honest about this in the output.

  7.  **Drafting the Content:**
      *   *Scenario:* The "Lifeboat Allocation." 5 seats, 6 people. One has a criminal past, one is a doctor, one is a child, etc.
      *   *Expert Rule:* Strict Age-Weighted Utility (complex formula).
      *   *Students:* Intuition says save the doctor/child. Expert says save the criminal (because of a specific variable in the formula).
      *   *Tension:* The formula yields the "Correct" answer for points, but feels wrong.
      *   *Reveal:* The Expert is Sarah from row 2. She just memorized the formula.

  8.  **Refining the Timeline:**
      *   0-5: Setup & Roles.
      *   5-15: Case Study & Private Intuition.
      *   15-25: Expert Testimony.
      *   25-40: Deliberation (The Friction Zone).
      *   40-45: Final Commitment.
      *   45-55: The Reveal.
      *   55-75: Philosophical Debrief.

  9.  **Final Polish:**
      *   Ensure the "Verdict" line is punchy.
      *   Check constraints: 18 students, 75 mins, upper-level (so they know terms like *a priori*, *testimony*, *autonomy*).
      *   Make sure the "Expert" instructions are clear so they don't improvise too much.

  10. **Self-Correction on "Payoff":** Real money is out. "Points" towards participation is good. Let's make it "Epistemic Credit." The Instructor grades the *process* not the outcome, but the *feeling* of wanting the credit drives the deference.
      *Actually, let's make the payoff about "Liability."*
      *Instruction:* "If the committee chooses the morally wrong option, you will all have to write a 2-page reflection paper tonight. If you choose the right option, no homework."
      *This raises the stakes significantly without money.*
      *Wait, that's cruel.*
      *Let's use "Class Credit."* "The group outcome determines whether you get 5 bonus points on the next paper."
      *Okay, let's keep it low stakes but psychologically real.* "The goal is to maximize the group's 'Moral Accuracy Score'."
      *Let's go with the "Liability Shield".* If you defer to the Expert, you are shielded from blame if it's wrong. If you go alone, you own the blame. This incentivizes deference even if you doubt the Expert.

      *Wait, one constraint:* "The 'moral expert' they defer to should turn out to be just another student."
      *So during the activity, I (the professor) must vouch for them.* "I have consulted with a specialist..."
      *Okay, I will play along.*

      *Let's finalize the scenario.* The "Transplant" case is best because the utilitarian answer is starkly counter-intuitive.
      *Case:* 5 patients need organs. 1 healthy traveler is in the clinic.
      *Intuition:* Don't kill the traveler.
      *Expert Rule:* "Maximize Lives Saved." Verdict: Kill the traveler.
      *This creates maximum friction.*

      *Wait, if the Expert says "Kill the traveler," and the students hate that, they might rebel.*
      *That's good.* The friction is: "I know I should trust the expert to be 'right' (get the points), but I can't bring myself to say it."
      *Or:* "I will say it to get the points, but I feel like a fraud."
      *This maps perfectly to the "Understanding vs. True Belief" debate.*

      *Let's write it.*

      *(Self-Correction during drafting)*: Make sure the Expert doesn't feel like a villain. They are following instructions.
      *(Self-Correction on Debrief)*: Ensure I explicitly map the "Liability Shield" to the epistemic safety of testimony.

      *Final check on the "Verdict" line:* Needs to be one sentence. "Verdict: The activity demonstrates that while moral testimony can transmit true belief, it cannot transmit the understanding required to own that belief as your own." -> A bit dry.
      *Try:* "Verdict: You can inherit a moral conclusion from an authority, but you cannot inherit the moral agency that makes that conclusion matter."
      *Try:* "Verdict: Deference secures the right answer, but it forfeits the moral understanding that makes the answer yours."
      *Let's go with:* "Verdict: Moral testimony can give you the right answer, but it cannot give you the understanding required to own it."

      *Wait, I need to check the "opaque credentials" constraint again.*
      *The reveal must show the credentials were opaque.*
      *So, during the activity, I tell them "This person has specialized training."*
      *In the reveal, I show the "training" was a 1-page handout I gave them 10 mins before class.*
      *This highlights the fragility of the trust.*

      *Okay, ready to generate.*
answer: |-
  Here is a complete, runnable design for your 75-minute seminar.

  ### Activity Title: The Liability Shield
  **Core Concept:** Simulating the tension between *epistemic safety* (deferring to get the right answer) and *moral agency* (understanding the reason why).

  #### 1. The Moral Scenario: "The Transplant Surgeon"
  This is a classic dilemma, but modified to create a specific "correct" answer based on a rigid algorithm.
  *   **The Case:** A surgeon has five patients dying of organ failure (heart, lungs, liver, two kidneys). One healthy traveler walks into the clinic for a routine checkup. The tissues match perfectly.
  *   **The Decision:** Does the surgeon harvest the traveler's organs to save the five?
  *   **The Split:** Intuition screams "No." Pure Act Utilitarianism says "Yes."
  *   **The "Expert" Rulebook:** The Expert is given a sheet titled *The Maximization Protocol*. It states: *"Moral Value = Lives Saved minus Lives Lost. Action is obligatory if Net Value > 0."*
  *   **The Verdict:** Under this protocol, the *only* correct answer is **Yes, harvest the organs.**

  #### 2. Roles & Setup (Pre-Class)
  *   **The Expert (1 Student):** Arrive 10 minutes early. Give them the *Maximization Protocol* sheet. Tell them: "Your role is to advise the Board. You must stick strictly to the protocol. Do not reveal you are a student. I will introduce you as a 'Bioethics Consultant.' If pressed, say your reasoning is 'technical and proprietary.'"
  *   **The Board (17 Students):** They are the Hospital Ethics Committee.
  *   **The Instructor:** You are the Hospital Administrator. You hold the "Truth Key."

  #### 3. The Payoff Scheme (No Money Required)
  To simulate the pressure of "getting it right" vs. "thinking for yourself," use **Epistemic Liability**.
  *   **The Stake:** Tell the class: "There is a correct moral answer to this case determined by the hospital's governing charter. If the Board votes for the correct action, everyone gets **5 Bonus Points** on their final participation grade. If the Board votes incorrectly, **no one** gets the points."
  *   **The Shield:** "However, you may choose to vote 'Via Consultant.' If you vote this way, and the decision is wrong, you are individually shielded from blame (no penalty). If you vote 'Own Reason' and are wrong, you lose 5 points."
  *   **The Trap:** This incentivizes them to defer to the Expert to avoid personal risk, even if their intuition screams the Expert is wrong. It forces them to trade *agency* for *safety*.

  #### 4. Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup & Stakes**
  *   Introduce the "Transplant" case.
  *   Explain the Payoff Scheme (Bonus points vs. Liability Shield).
  *   Introduce the Expert: "I have brought in a specialist consultant to assist the Board. Their credentials are verified by the administration." (Do not name the student yet).

  **00:05 – 00:15: Private Intuition**
  *   Hand out ballots. Two sections:
      1.  **Decision:** Harvest (Yes) / Do Not Harvest (No).
      2.  **Basis:** Own Reason / Via Consultant.
  *   *Instruction:* "Fill this out privately. Do not discuss yet. This is your baseline."
  *   Collect these ballots (keep them sealed for the debrief).

  **00:15 – 00:25: Expert Testimony**
  *   The Expert stands and delivers the verdict.
  *   *Script for Expert:* "After reviewing the case files, the Protocol dictates we must harvest the organs. The net value is +4 lives. Any other decision violates the charter."
  *   *Q&A:* Students can ask questions. The Expert must answer using only the logic of the Protocol (e.g., "I understand it feels wrong, but the math is clear.").
  *   *Goal:* Make the Expert sound confident but slightly alienating/robotic.

  **00:25 – 00:40: Deliberation (The Friction Zone)**
  *   Open the floor. Students discuss.
  *   *Instructor Role:* Intervene only to remind them of the stakes. "Remember, the points depend on the *correct* answer. The Consultant is your best access to the charter."
  *   *Observation:* Watch for students who say, "I know he's probably right about the points, but I can't sign my name to that." This is the target phenomenon.

  **00:40 – 00:45: Final Commitment**
  *   Distribute final ballots. Same format as before (Decision + Basis).
  *   *Crucial:* They must sign their names.
  *   Collect ballots. Tally the "Via Consultant" vs. "Own Reason" votes publicly on the board.

  **00:45 – 00:55: The Reveal**
  *   Ask the Expert to stand.
  *   **The Twist:** "Thank you, [Student Name]." (Reveal they are a classmate).
  *   Hold up the *Maximization Protocol* sheet. "Their 'specialized training' was this one-page handout I gave them 10 minutes before class. They are not an expert. They are just following a rule they don't necessarily believe in either."
  *   Ask the Expert: "Do you personally believe harvesting the organs is right?" (Usually, they say no).
  *   **The Point:** The class deferred to a "black box" that turned out to be empty.

  **00:55 – 01:15: Philosophical Debrief**
  *   **Phase 1: The Feeling.** Ask the students who voted "Via Consultant": "When you checked that box, did you feel like you held a moral belief? Or did you feel like you were following an order?"
  *   **Phase 2: The Epistemology.** Map their experience to the literature.
      *   *Optimists (Lackey/Jones):* You got the true belief. You maximized utility. Why isn't that enough?
      *   *Pessimists (Hopkins/Hills):* You lacked *understanding*. You couldn't defend the view without quoting the Expert. You surrendered your moral agency.
  *   **Phase 3: The Opaque Credentials.** Discuss the reveal. "If you knew the Expert was a student, would you have deferred?" (Most will say no). "But in the real world, do you know *why* your bioethicist or priest believes what they believe? Or do you just trust the title?"
  *   **Phase 4: The Payoff.** Discuss the "Liability Shield." "Did the grade incentive make deference more attractive? Does this mirror how we use moral testimony to avoid the burden of moral responsibility?"

  #### 5. Limitations (Be Honest About These)
  In your closing remarks, acknowledge what the game *cannot* do:
  1.  **Stakes:** No one actually dies. The "moral weight" is simulated by points, which feels lighter than real guilt.
  2.  **Relationship:** Real moral testimony happens in relationships of trust (parent/child, priest/parishioner) over time. This was a one-off transaction.
  3.  **Character:** A single class session cannot show the long-term corrosion of moral character that comes from habitual deference.
  *You must supply the bridge:* "Take the feeling of hollowness you felt when checking 'Via Consultant' and multiply it by a lifetime. That is the Pessimist's worry."

  #### 6. Materials Needed
  *   **Ballots:** Small slips of paper (2 per student).
  *   **The Protocol Sheet:** A printed index card for the Expert.
  *   **Projector:** To display the tally of votes.
  *   **Sealed Envelope:** For the initial private ballots (to prove to them later if their votes shifted).

  Verdict: Moral testimony can transmit a true conclusion, but it cannot transmit the understanding required to make that conclusion your own.
