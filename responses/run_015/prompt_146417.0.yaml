ollectively and she participates in its authorization, yet her effective range of choice is severely narrowed. Case 6: A refugee is housed in a camp where exit permits are granted automatically by an algorithm that applies uniform criteria. There is no human official who could arbitrarily deny her request; however, the algorithm's parameters are set by a single administrator who can alter them without notice, public justification, or judicial review. The refugee knows that leaving is technically permitted today, but she cannot know whether it will be permitted tomorrow, and she has no recourse if the rules change against her. Verdict: this feels like republican unfreedom—she lives at the mercy of an arbitrary will—even though the actual gate is never closed and no human being directly interferes with her movement. Case 7: A state introduces a right-to-disconnect law that prohibits employers from sending work-related messages after hours. A junior employee notices that her career advancement depends on her responsiveness, and she chooses to check messages constantly despite the legal protection. Verdict: her negative liberty is protected—the law removes an obstacle—but I hesitate to say her freedom is fully intact, because the social and economic structure still makes her choice heavily constrained.

  I keep going back and forth on Case 4 and Case 7: both involve structures that don't physically block action but shape the costs of choice so precisely that resistance seems irrational. Meanwhile, Case 5 and Case 6 both involve collective or automated authority, but I want to say Case 6 involves domination while Case 5 does not. Is there a single principle—perhaps refining the standard three-way distinction, or adding a fourth dimension—that captures all seven verdicts? If so, state it precisely and show which clause handles which case. If not, present the two or three best competing principles, say which verdict each forces me to drop, and explain what each predicts for a new case: a worker whose employment contract includes a loyalty clause enforced not by a court but by an industry-wide reputation algorithm that automatically lowers her credit score and rental eligibility if she is flagged by any participating employer, with no individual employer holding direct power over the flagging mechanism.
