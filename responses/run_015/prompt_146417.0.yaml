  Your intuitions are remarkably consistent, but they do not map neatly onto a *single* traditional principle without significant theoretical stretching. Specifically, you are holding two distinct criteria in tension: the **source** of the constraint (is it arbitrary power?) and the **effect** of the constraint (does it narrow effective choice?).

  Case 5 (Democracy) and Case 2 (Poverty) are the pivot points. In Case 5, you accept narrowed choice because the *source* is legitimate (collective self-rule). In Case 2, you reject the status quo because the *effect* is incapacitating, even if no specific "tyrant" is to blame.

  Because a single principle would require you to either legitimize poverty (by calling it "non-domination") or condemn democracy (by calling majority rule "unfreedom"), the most philosophically rigorous approach is to present **two competing principles**. Each captures a cluster of your verdicts but forces you to revise others.

  ### Principle 1: Robust Non-Domination (The Status View)
  **Definition:** A person is free if and only if they are not subject to the *arbitrary will* of another. Interference matters only insofar as it signals a power relation where one agent can impose their will on another without recourse. Freedom is a **status**, not a measure of available options.

  *   **Handles:** Case 1 (Guard's power), Case 3 (Monarch's power), Case 6 (Admin's arbitrary power), Case 5 (Collective power is non-arbitrary due to participation).
  *   **Forces You to Drop/Revise:**
      *   **Case 2 (Musician):** This principle typically classifies poverty as misfortune, not unfreedom, unless a specific agent caused it. You would have to abandon the verdict that her freedom is *politically* diminished (though you might call it a lack of justice).
      *   **Case 4 & 7 (Structural/Algorithmic):** You must argue these are unfree *only* if the algorithm represents an arbitrary will (e.g., the employer's). If the algorithm is truly impersonal, a strict Non-Domination view might struggle to call it "domination" without expanding the definition of "will."
  *   **Prediction for New Case (Loyalty/Reputation Algorithm):**
      *   **Verdict:** **Unfree (Domination).**
      *   **Reasoning:** Even though no *individual* employer holds the power, the industry-wide system functions as a "private government." The worker is subject to a mechanism she cannot contest or appeal. The lack of a specific human "master" is irrelevant; the *structure* exercises arbitrary power over her livelihood without recourse. This aligns with modern neo-republican extensions (e.g., Pettit on structural domination).

  ### Principle 2: Effective Agency (The Condition View)
  **Definition:** A person is free if and only if they possess the **effective capacity** to pursue a reasonable range of life plans. Freedom is measured by the **real cost of resistance** and the availability of meaningful options. Obstacles include physical barriers, economic necessity, and social pressures that make choice irrational.

  *   **Handles:** Case 1 (Physical barrier), Case 2 (Lack of capacity/resources), Case 4 (Prohibitive cost of resistance), Case 7 (Social/Economic pressure).
  *   **Forces You to Drop/Revise:**
      *   **Case 5 (Democracy):** This principle struggles to distinguish the minority resident from the subject of the Monarch (Case 3). Since her effective range of choice is "severely narrowed," this principle must label her **unfree**, contradicting your intuition that she is "not dominated." It views the *outcome* (narrowed choice) as more important than the *procedure* (voting).
      *   **Case 3 (Monarch):** If the monarch never interferes, a strict Effective Agency view might call the subject free (since options are open), contradicting your intuition that the *power itself* diminishes freedom.
  *   **Prediction for New Case (Loyalty/Reputation Algorithm):**
      *   **Verdict:** **Unfree (Coercion).**
      *   **Reasoning:** The algorithm drastically raises the cost of dissent (loss of housing/credit). The worker's "choice" to remain loyal is not voluntary but coerced by the structure of consequences. The source of the power matters less than the fact that her agency is effectively nullified by the threat of algorithmic exclusion.

  ### Synthesis: Why Your Intuitions Feel Coherent
  Your judgments actually point toward a third, emerging synthesis in political philosophy: **"Freedom as Contestable Agency."**

  Under this view, you are free if you have the capacity to act *and* the institutional recourse to contest the conditions of that action.
  *   **Case 5 is Free** because the minority resident can contest the laws (vote/speak).
  *   **Case 6 is Unfree** because the refugee cannot contest the admin's parameters.
  *   **Case 4 & 7 are Unfree** because the worker cannot contest the algorithm or market norms.
  *   **Case 2 is Unfree** because the musician lacks the social recourse to acquire resources.

  This synthesis captures all seven verdicts, but it requires adopting a specific theoretical commitment: that **freedom is not just the absence of interference, but the presence of recourse.**

  ### Application to the New Case
  **Case:** *A worker whose employment contract includes a loyalty clause enforced not by a court but by an industry-wide reputation algorithm that automatically lowers her credit score and rental eligibility if she is flagged by any participating employer, with no individual employer holding direct power over the flagging mechanism.*

  *   **Under Robust Non-Domination:** She is **unfree**. The key is not whether a human holds the power, but whether the power is arbitrary and uncontestable. An industry-wide algorithm that flags her without appeal constitutes a form of "systemic domination." She lives at the mercy of a mechanism she cannot influence.
  *   **Under Effective Agency:** She is **unfree**. The cost of resistance (losing housing and credit) is so high that her choice is effectively coerced. Her range of effective options is narrowed to compliance.
  *   **Under Contestable Agency:** She is **unfree**. She lacks **recourse**. She cannot appeal the flag, she cannot change the algorithm's parameters, and she cannot exit the industry without severe penalty. The lack of a specific "master" does not save her; the lack of *contestability* condemns her.

  **Recommendation for your Seminar:**
  Present your intuitions as a critique of the **rigid separation** between Negative, Positive, and Republican liberty. Argue that Case 4, 6, and the New Case reveal a new category of **"Algorithmic Unfreedom,"** which shares the *arbitrariness* of Republican domination (Case 3/6) but operates through the *structural costs* of Positive/Structural constraint (Case 2/4/7). This allows you to keep all your verdicts while proposing a refinement to the taxonomy rather than abandoning your judgments.
