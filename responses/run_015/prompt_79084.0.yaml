answer: |-
  1. **The spine and the order**
  Your Q1/Q2 split is risky. Q2 ("Does it happen while asleep?") presupposes Q1 ("Is it an experience?") is answered affirmatively. Malcolm denies that presupposition. For Malcolm, "dreaming" is not the name of a process that happens to occur during sleep; it is a concept constituted by the report. If you ask "When did the experience happen?", you have already conceded the Cartesian picture Dennett attacks. Malcolm isn't arguing about timing; he's arguing about grammar.

  Replace your spine with **The Truth Conditions of Dream Reports**.
  **Phase 1: The Cartesian Intuition (15 mins).** Elicit the student's default view (likely Descartes from *Meditations*): The dream is a private object existing prior to the report. The report describes the object.
  **Phase 2: Malcolm's Grammatical Intervention (25 mins).** The report does not describe the dream; it establishes it. Truth conditions are linguistic, not empirical. "I dreamed" is an avowal, not a description. This prevents the "behaviorist" caricature; he isn't denying physiology, he's denying its conceptual relevance.
  **Phase 3: Dennett's Empirical Pushback (25 mins).** The report is evidence of a physiological/phenomenal process that can be falsified. Truth conditions are causal.
  **Phase 4: The Clash (15 mins).** Is the report constitutive (Malcolm) or evidential (Dennett)?

  This order forces the conceptual clash immediately. It prevents students from treating Malcolm as a bad empiricist who ignores brain scans. He isn't ignoring them; he's saying they are irrelevant to the *concept* of dreaming. This preserves Malcolm's Wittgensteinian stance without requiring a deep dive into the *Investigations*. It keeps the focus on what makes a sentence *true*, which is where the actual disagreement lives.

  2. **The carrying example**
  Verdict: Keep the structural move (decoupling report from fact), but drop "past life." It triggers empirical dismissal ("Obviously past lives aren't real") which bypasses the conceptual point. Students will focus on the falsity of the content rather than the authority of the report. Dreaming isn't about correspondence to external reality; it's about the experience itself.

  Use **Post-Hypnotic Dream Suggestion**.
  **Case:** Subject is hypnotized. Suggestion: "You will dream of a red barn tonight." Subject wakes, reports: "I dreamed of a red barn."
  **Requirements:** The case must lack independent verification of the experience. We cannot know if the barn "appeared" in consciousness. It must not involve memory of waking events (avoids false memory confusion). It must not involve physiological data initially (introduce EEG later as Dennett's move).
  **Why this works:** It mirrors the dream case perfectly. The subject is sincere. The cause is known (suggestion). Did the dream occur? Malcolm: Yes, the report is the criterion. Dennett: Maybe not, if the suggestion didn't trigger the specific physiological cascade of dreaming. This isolates the "Authority of the First Person" without the baggage of reincarnation. It forces the question: Does the sincere report *make* it a dream, or does it merely *signal* a dream that happened independently? That is the exact Malcolm/Dennett fault line.

  3. **Misconception map**
  1.  **"Malcolm is a Behaviorist denying inner states."** (Arises immediately in Phase 2). Students hear "report constitutes dream" and think "nothing happens in the head."
      *   *Kill Point:* End of Phase 1. Clarify: Malcolm admits physiology happens; he denies it's *relevant to the concept*. It's not ontology, it's grammar. He isn't saying the brain is quiet; he's saying "dreaming" isn't the name of the brain activity.
  2.  **"Lucid Dreaming refutes Malcolm."** (Arises during Phase 2). Student: "But I know I'm dreaming while asleep! That's an experience independent of waking report."
      *   *Kill Point:* Mid Phase 2. Malcolm's counter: "Lucid dreaming" is a different grammar. It's akin to waking up partially. It doesn't prove private experience in standard dreaming; it proves a hybrid state. Don't let them use edge cases to break conceptual rules. Lucidity changes the language game; it doesn't validate the Cartesian one.
  3.  **"Dennett says dreams are illusions/non-existent."** (Arises during Phase 3). Students think Dennett is an eliminativist about qualia.
      *   *Kill Point:* Start of Phase 4. Dennett admits something happens, but denies it's a "private experience" existing prior to the report. He's attacking the *timing* and *privacy*, not the existence of neural activity. He denies the *Cartesian theater*, not the show.
  4.  **"Neuroscience will solve this."** (Arises at end). Students want to wait for better EEG tech to see who is right.
      *   *Kill Point:* Closing. Remind them: Malcolm says no amount of EEG data changes the *grammar* of "dreaming." Dennett says EEG defines the reality. This is philosophy, not a waiting game for science. One claims conceptual necessity, the other empirical sufficiency. Science cannot arbitrate a grammatical dispute.

  4. **The exit question**
  "Imagine a future where EEG predicts dream content with 99% accuracy. The scan says you dreamed of blue horses. You wake and sincerely report dreaming of red cows. Did you dream of red cows? Answer as Malcolm, then as Dennett. Explain why the science doesn't settle the disagreement."

  This forces them to apply the truth-condition framework. If they say "Science proves Malcolm wrong," they missed the conceptual point. If they say "Malcolm says the report wins," they get the grammar. It tests whether they understand that the debate is about *authority*, not data. It requires them to inhabit both frameworks without collapsing them into "who is scientifically correct."

  5. **What I'm cutting**
  1.  **REM Sleep Mechanics.** Do not teach sleep stages. It distracts. Mention "physiological correlate" generally. Students will drift into neuroscience if you give them an opening.
  2.  **Private Language Argument Exegesis.** Do not teach Wittgenstein's PLA. Use Malcolm's conclusion without the heavy lifting. It's too much for 80 mins. Say "Wittgensteinian grammar" and move on.
  3.  **Declaring a Winner.** Do not resolve the debate. Your job is to clarify the disagreement, not solve it. Say: "We are mapping the conceptual terrain, not settling the empirical facts." This frames the lack of resolution as a feature, not a bug. It validates the philosophical struggle rather than dismissing it as unsolved science.
