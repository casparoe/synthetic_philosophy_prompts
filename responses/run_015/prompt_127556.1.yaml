      *   *CDT (Causal Decision Theory):* "My choice now cannot causally affect the past prediction." Anderton might think, "The ball is already rolled, so I might as well shoot/not shoot based on current utility."
      *   *EDT (Evidential Decision Theory):* "My choice is evidence of what was predicted." If I shoot, I confirm the prediction. If I don't, I falsify it.
