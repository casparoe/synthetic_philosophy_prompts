answer: |-
  **MEMORANDUM**

  **TO:** Algorithmic Priorities Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 15, 2023
  **SUBJECT:** Decision on Fiscal Year Ranking Rule: Community Volition vs. Fact-Corrected Preference

  **Bottom Line Recommendation**
  I recommend the Board **reject the full "Community Volition" protocol** and instead **approve a restricted variant: Fact-Corrected Stated Preference.** This approach retains Stage 1 (elicitation) and the budget-literacy briefing but eliminates Stage 2's simulated deliberation and vendor-supplied language model coherence pass. We should adopt this restricted form conditionally, subject to a retrospective endorsement check and explicit Board policy on future residents.

  **Stability and Artifacts**
  The staff pilot reveals a critical defect: the extrapolated target is unstable. When the briefing lengthened or the coherence rule tightened, the district priority ordering shifted substantially. In one instance, the vendor's cycle-breaking rule reversed a district's first and third priorities. This instability indicates that the output is an artifact of the protocol's parameters rather than a robust signal of resident will. If the "will of the people" flips based on a vendor's slider setting, it is not falsifiable; it is merely engineered.

  Given our three-week deadline, we cannot wait for the vendor to tune the model until stability emerges. Instead, we must remove the sources of variance. The deliberation stage and AI coherence pass introduce opaque transformations that amplify sensitivity to protocol design. A fact-corrected stated preference is inherently more stable because it relies on direct reporting rather than simulated reconciliation. For this fiscal year, "stable enough" means that the top three capital priorities must remain invariant when the factual briefing is varied by reasonable margins (e.g., five minutes versus ten minutes). If the ranking flips under these conditions, the method fails to capture a consistent preference and must be abandoned for the cycle.

  **Legitimacy and Retrospective Endorsement**
  Accuracy is not legitimacy. A ranking rule must be intelligible to the citizens it binds. Under the full Community Volition proposal, a resident cannot reconstruct how their input became the output. If a resident asks why their top priority was downgraded, "the model resolved an intransitivity" is not a public reason. It renders the process immune to contestation, requiring a statistics team to audit what should be a civic act.

  To repair this defect without abandoning correction entirely, I recommend a **retrospective endorsement check.** A fresh sample should be shown both the raw stated-preference ordering and the fact-corrected ordering, explained how each was produced, and asked which they endorse as the fair basis for allocation. I propose a threshold of **55% endorsement** for the fact-corrected method over the raw data. This test does not merely measure satisfaction with the outcome; it measures authority. It asks whether residents recognize the process as a valid representation of their agency. If residents reject the corrected ordering despite understanding the factual errors in their raw data, the Board lacks the legitimacy to impose it. This test transforms the ranking from a technical optimization into a authorized mandate.

  **Scope and Future Residents**
  The pilot indicates the extrapolated target favors projects benefiting children, the elderly, and future residents (e.g., tree canopy, accessibility). However, the sample consists solely of current adult residents. Whether the budget should weight the interests of those who cannot vote—specifically future residents—is a moral policy choice, not a statistical inference. It cannot be left to the vendor's protocol to decide this implicitly through extrapolation.

  The Board must explicitly vote to authorize weighting for future residents. If we believe the capital budget is a trust for the next generation, we should state that and direct the Office to weight sustainability projects accordingly. Hiding this value judgment inside a "coherence pass" obscures accountability. I recommend the Board adopt a resolution stating that intergenerational equity is a valid objective, allowing the Office to apply a specific, transparent multiplier to projects with long-term benefits, rather than relying on the model to infer this from current adult responses.

  **The Strongest Counterargument**
  The strongest argument against this recommendation comes from the view that raw stated preferences are themselves corrupted by structural inequality. Residents in underinvested districts may not request sidewalks or transit shelters not because they do not value them, but because they have adapted to neglect and do not believe such requests are feasible. By rejecting the deliberation and coherence stages, we may be laundering the status quo through a survey, privileging the informed voices of already-served districts while silencing those whose preferences are suppressed by misinformation or hopelessness. The full Community Volition protocol attempts to recover what residents *would* want if they were empowered and informed; restricting it to fact-correction may leave us with a map of existing deprivation rather than a plan for justice.

  **Conditions for Changing Position**
  I would change my position and support the full Community Volition protocol only if the pilot demonstrates that factual correction alone fails to shift priorities toward high-need areas, and that the deliberation stage produces stable results across multiple vendor parameter settings. Specifically, if the vendor can show that the top three priorities remain constant despite variations in the coherence rule and briefing length, the stability objection would be neutralized.

  **Implementation Schedule and Failure Criteria**
  *   **October 25:** Office releases revised protocol (Fact-Corrected Only) for public comment.
  *   **November 10:** Pilot run of Fact-Corrected Preference completed.
  *   **November 15:** Retrospective Endorsement Check conducted.
  *   **November 20:** Board vote on final adoption based on pre-registered criteria.
  *   **December 1:** Vendor contract renewed for restricted scope only.
  *   **January 15:** Final ranking published for fiscal year.

  **Pre-Registered Failure Criteria:**
  The pilot will be deemed a failure if:
  1.  **Instability:** The top three district priorities change rank when the briefing duration is altered by ±20%.
  2.  **Legitimacy Deficit:** Less than 55% of the endorsement sample prefers the fact-corrected ordering over the raw stated preference.
  3.  **Opacity:** The Office cannot provide a plain-language explanation for any priority shift exceeding one rank position.

  If any of these criteria are met, the Board shall revert to the previous fiscal year's ranking rule (population-adjusted stated requests) for this cycle.
