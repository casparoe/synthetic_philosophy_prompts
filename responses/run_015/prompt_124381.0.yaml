answer: |-
  Here is the adjudication of the exchange, move by move, followed by an overall verdict and an assessment of the burden of proof.

  **Move (1): Ines**
  **Rating:** Mostly right but in need of a qualification.
  **Justification:** She accurately states the core expressivist position and its advantage regarding motivation, but she presents the claim that "no ordinary fact... works like that" as a given rather than a contentious premise that a realist would deny.

  **Move (2): Tomas**
  **Rating:** Clearly right.
  **Justification:** This is a precise formulation of the Frege-Geach problem; if moral sentences are merely exclamations in the premises, the logical validity of the conclusion cannot be preserved.

  **Move (3): Ines**
  **Rating:** Mostly right but in need of a qualification.
  **Justification:** This is the standard sophisticated expressivist defense (higher-order attitudes), but it succeeds only by redefining logical validity as psychological consistency, which may not satisfy a demand for objective truth.

  **Move (4): Tomas**
  **Rating:** Clearly right.
  **Justification:** He correctly identifies that solving the validity problem is not enough; the meaning of the moral term must remain stable across different grammatical contexts (asserted vs. supposed), which expressivism struggles to explain.

  **Move (5): Ines**
  **Rating:** Mostly right but in need of a qualification.
  **Justification:** Her concession that the logical problem "bites" is honest, and her pivot to the Open Question Argument is strong, but admitting the logical deficit weakens her claim to have a complete account of moral language.

  **Move (6): Tomas**
  **Rating:** Mostly right but in need of a qualification.
  **Justification:** Rob is a genuine counterexample to strong motivational internalism, though Tomas misses that Ines could argue Rob is misusing the word "wrong" rather than proving the theory false.

  **Move (7): Ines & Tomas (Email)**
  **Rating:** Split: Ines is mostly right; Tomas is clearly right.
  **Justification:** Ines is right that attitudes need not be hot feelings, but Tomas is right that defining attitudes purely by behavioral dispositions risks making her theory unfalsifiable and therefore empty. Note that Tomas's earlier attacks assumed attitudes were feelings, which Ines does not actually hold.

  ***

  **Overall Verdict**
  At the point where they stopped, **Tomas has the better of the argument.** While Ines successfully captures why morality *feels* different from science (the motivational "oomph"), she conceded the critical logical point in Move 5 ("I concede the second one bites"). Tomas successfully demonstrated that Ines's account cannot easily explain how moral language functions in complex reasoning without secretly borrowing the logic of the factual descriptions she rejects. Ines wins on phenomenology (how it feels to judge), but Tomas wins on semantics (how the language works).

  **Blind Spots**
  *   **Ines** is ignoring that her solution to the logic problem (Move 3) makes her view look increasingly like the realism she opposes; if attitudes have "structure" and "inconsistency" exactly like beliefs, the distinction between a "stance" and a "belief" begins to vanish.
  *   **Tomas** is ignoring the cost of his own victory; if he wins on logic, he inherits the burden of explaining how a "fact" about the world can motivate a person to act without relying on a pre-existing desire, which is the very mystery Ines started with.

  **Burden of Proof**
  If the exchange were to continue, **Ines** must produce the next argument. To recover, she needs to demonstrate how a "shared practice of coordinating" (Move 5) can generate genuine logical validity without positing moral truths. She must show that Tomas's demand for "detachable meanings" is a philosopher's artifact that doesn't reflect how people actually use language. If she cannot do this, she must concede that her view is a "quasi-realism" that mimics realism so closely the difference is negligible.
