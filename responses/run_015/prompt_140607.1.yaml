answer: |-
  It is very common to get these tangled; the terminology in the disposition literature (Martin, Lewis, Bird, etc.) is notoriously slippery, and different authors sometimes use the labels slightly differently. However, for a metaphysics seminar, you will want to align with the standard Lewis/Martin usage, as that is likely what your instructor and classmates are referencing.

  Here is the breakdown of where the muddle lies, the classification of your mug example, the role of the "intrinsic basis" clause, and the summary table you requested.

  ### 1. Untangling the Definitions
  The **Simple Counterfactual Analysis (SCA)** claims a biconditional relationship:
  > $x$ is disposed to $M$ if $S$ **if and only if** if $x$ were $S$-ed, $x$ would $M$.
  > *(e.g., The glass is fragile iff if it were struck, it would break.)*

  To break this analysis, you need to show a case where one side of the "iff" is true and the other is false.

  **The Standard "Fink" (Martin 1994)**
  You have currently defined a fink as a case where the object *lacks* the disposition but the conditional is *true*. In standard literature, this is often called a **Mimic**.
  The standard **Fink** is the reverse: The object **has** the disposition, but the stimulus causes the disposition to vanish instantly, so the manifestation does not occur.
  *   **Example:** A "live" wire (disposed to shock) connected to an "electro-fink." The moment you touch the wire (stimulus), the fink detects contact and makes the wire dead (removes disposition) before the current can flow.
  *   **Why it breaks SCA:** The wire *is* disposed (True), but "If touched, it would shock" is (False). The SCA falsely says the wire isn't live.

  **The Standard "Mask"**
  You defined a mask as the trigger destroying the disposition. That is actually the definition of a Fink (see above).
  A **Mask** is when the object **has** the disposition, the stimulus occurs, the disposition *remains*, but something **external** prevents the manifestation.
  *   **Example:** A fragile glass wrapped in bubble wrap. You strike it. It doesn't break.
  *   **Why it breaks SCA:** The glass *is* fragile (True), but "If struck, it would break" is (False). The SCA falsely says the glass isn't fragile.

  **Your "Fink" (Non-fragile tumbler with charge)**
  The example you gave (not fragile, but shatters due to a charge) is a problem for the *other direction* of the SCA.
  *   **Why it breaks SCA:** The conditional "If struck, it would break" is (True), but "It is fragile" is (False). The SCA falsely says the tumbler *is* fragile.
  *   **Label:** This is usually called a **Mimic** (Bird 1998) or simply a case of **counterfactual sufficiency failure**.

  ### 2. The Sprayed Mug Example
  Your example: *A mug that is genuinely fragile but sprayed with a coating that stops it breaking when dropped.*

  *   **Classification:** This is a **Mask**.
  *   **Reasoning:** The intrinsic structure of the mug (its fragility basis) remains intact. The stimulus (dropping) occurs. However, an extrinsic factor (the coating) intervenes to prevent the manifestation (breaking). The disposition is present, but the conditional "If dropped, it would break" comes out false.
  *   **Note:** Some authors distinguish between *Masks* (extrinsic, like packing foam) and *Antidotes* (intrinsic/chemical neutralization, like a poison + antivenom). A spray coating is usually extrinsic enough to count as a Mask.

  ### 3. The "Intrinsic Basis" Clause
  You recall a clause about "retaining the intrinsic basis." This was David Lewis's proposed repair (1997).

  *   **The Fix:** Lewis suggests analyzing dispositions as: $x$ is disposed to $M$ if $S$ iff there is an intrinsic property $B$ such that, if $x$ were $S$-ed **and $B$ persisted**, $x$ would $M$.
  *   **Which problem does it solve?** It solves **Finks**.
      *   *Why:* In a Fink case, the stimulus causes the basis $B$ to disappear. By adding "and $B$ persisted" to the *if*-clause (the antecedent), we force the counterfactual world to be one where the finkish mechanism fails to remove the basis. In that world, the manifestation happens. The conditional becomes true, matching the fact that the disposition is present.
  *   **Why doesn't it solve Masks?**
      *   *Why:* In a Mask case, the basis $B$ *does* persist naturally. The problem isn't that the basis vanishes; it's that the mask blocks the effect. So, even if we say "and $B$ persisted," the mask is still there blocking the break. The conditional remains false, so the analysis still fails to attribute the disposition correctly.

  ### 4. Summary Table

  | Case | Does the object have the disposition? | Is the plain conditional ('if S, then M') true? | What the added mechanism is doing | The label people standardly use for this case | What the usual repair to the analysis is |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Standard Case** | Yes | Yes | N/A | Normal Disposition | None needed (SCA works here) |
  | **Martin's Case** | Yes | No | Stimulus causes the disposition's basis to vanish instantly. | **Fink** (or Finkish Disposition) | Add clause: "...and the intrinsic basis persisted." (Lewis) |
  | **Packing Foam** | Yes | No | Extrinsic factor prevents manifestation; basis remains. | **Mask** | Restrict to "intrinsic" dispositions or use "All else being equal" (ceteris paribus). |
  | **Your Tumbler** | No | Yes | Extrinsic mechanism creates manifestation without the disposition. | **Mimic** (or Counterfactual Sufficiency Failure) | Require the disposition to be grounded in an *intrinsic* basis (rules out external charges). |

  ### A Tip for Your Essay
  If you want to secure good marks, explicitly note that **Finks** and **Masks** are both "False Negatives" (SCA says no disposition, but there is one), whereas **Mimics** (your tumbler example) are "False Positives" (SCA says there is a disposition, but there isn't). The "Intrinsic Basis" clause is primarily designed to handle the False Negatives caused by Finks, but it requires further modification (like excluding extrinsic interferers) to handle Masks.
