  **Welcome to DeathDodger™ Support!**

  Hi there, Future Survivor! Thanks for interest in disrupting your own mortality. We know facing the Great Infinite is stressful, but our predestinatory analytics platform is here to optimize your final hours. Below are answers to common queries about our Damascus/Aleppo relocation protocol.

  **1. How exactly does the Dodger algorithm work?**
  Great question! It's simple: You choose a city for tomorrow (Damascus or Aleppo), and our Partner™ (Death) meets you there. Since Death is a perfect predictor, He has already simulated your decision process. Our job isn't to change His location, but to help you align your expectations with His calendar. Think of us as logistics for inevitability!

  **2. I'm feeling a strong urge to flee to Aleppo. Is this intuition?**
  We love that curiosity! However, from an evidential decision theory standpoint, that urge is actually data. If you feel compelled to flee, it's highly likely Death predicted you'd feel compelled to flee. Consequently, He is likely waiting in Aleppo. Your anxiety isn't a warning system; it's a correlation coefficient. Try to relax into the doom!

  **3. Wouldn't it be safer to just stay in Damascus?**
  Only if Death predicted you'd stay! Here's the loop: If staying feels rational, it's because you think Death isn't there. But if Death isn't there, He predicted you'd stay. But if He predicted you'd stay, He *is* there. Both staying and fleeing feel rational until you realize your deliberation process is exactly what was simulated yesterday. It's a perfect equilibrium of doom!

  **4. Does the "Quantum Coin-Flip" Add-On help randomize my choice?**
  Honestly? Probably not. You might think mixing your strategy confuses the prediction model. But since Death predicts all causal outcomes, He likely predicted you'd purchase the Add-On and knew the coin's result before you flipped it. Paying extra simply confirms you're the type of client who seeks randomization, which is itself a predictable variable. But hey, it looks great on your invoice!

  **5. How does the "Money-Back-If-You-Die" Guarantee work?**
  This is our most popular tier, though we advise caution. Purchasing this guarantee signals a high subjective probability that you expect to perish. Since Death predicts based on your psychological state, buying the guarantee provides evidence that you are indeed doomed, reinforcing the prediction you're trying to hedge against. It's a signaling paradox that usually voids the refund.

  **6. Can I outsmart the prediction engine by doing the opposite?**
  We admire the hustle! But "doing the opposite" is still a decision rule. If you decide to reverse your impulse, Death predicted you'd decide to reverse your impulse. You aren't outthinking the system; you're just running the script He wrote for you. The only way to win is not to choose, but our Terms of Service require a selection to proceed.

  **Still have questions?**
  Our team predicted you would! Please submit a ticket. We'll respond yesterday.
