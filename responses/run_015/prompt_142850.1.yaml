answer: |-
  Hi there, this is a genuinely tricky spot to navigate, and your hunches are mostly spot on. The first half of your colleague's paragraph is standard quantitative genetics fare and would pass muster with almost any philosopher of biology or geneticist. The definition of heritability as variance within a population rather than cause within an individual is the correct Lewontin-style distinction, and the two implications drawn from it regarding preventability and between-group differences are accurate. That section does the work you need it to do without inviting immediate technical objection. However, your instinct that the paragraph starts to slide in the second half is correct, and the issues there are significant enough that they could undermine the very point you are trying to make about moral responsibility.

  The trouble begins with the claim that where heritability is high, interventions are pushing against the grain of the genome and effects will tend to wash out. This conflates heritability with stability or canalization. High heritability in a current environment simply means that genetic differences explain most of the current differences; it does not entail that the trait is resistant to environmental change. As your colleague correctly notes earlier with the height example, you can have high heritability and still shift the mean dramatically with a change in environment, like nutrition. The claim that effects will wash out suggests a kind of genetic homeostasis that is not guaranteed by high heritability alone. If you change the environment permanently, the trait value can shift permanently, even if the trait was highly heritable in the old environment. This distinction matters for your argument because if you concede that high heritability means interventions push against the grain, you are implicitly conceding that genetic causes make traits more fixed, which is exactly the intuition you want to resist when discussing responsibility.

  The section on response heritability is even more problematic. While there is legitimate work on the heritability of plasticity or genotype-by-environment interaction, the term response heritability is not a standard statistic in the way narrow-sense heritability is, and the gloss provided here is misleading. Describing it as the share of variation in change associated with genotype is roughly a description of genetic variance in plasticity, but the inference that this tells us how much room policy has is a non sequitur. If variation in response to an intervention is genetic, it means that a one-size-fits-all policy will work better for some people than others based on their genotype. It does not tell you whether the average effect of the policy is large or small, nor does it tell you whether policy has room to operate. In fact, knowing that response is genetically moderated might suggest that personalized policy has even more room to operate, not less. By framing this statistic as revealing how much of the effect is genetic rather than environmental, the paragraph reintroduces the very dichotomy the first half worked so hard to dismantle. It suggests that if the variation in response is genetic, the effect is somehow less environmental or less amenable to policy, which is not true. An effect can be both genetically moderated and environmentally produced.

  Your friend in biology is also right about the missing element regarding gene-environment correlation. Standard heritability estimates, particularly from twin studies, often confound genetic effects with shared environmental effects because parents transmit both alleles and environments to their children. This is known as passive gene-environment correlation, and there are also evocative and active correlations where an individual's genes shape their environment. This means that a chunk of what gets counted as genetic variance may actually run through social pathways. This matters for your argument because it further blurs the line between biology and policy. If what looks like genetic influence is partly the result of environmental transmission correlated with genes, then the claim that high heritability gives no comfort to biological determinists is even stronger than your colleague suggests. It supports your view that etiology does not map neatly onto malleability.

  This brings us to your core worry about whether this undermines your argument on responsibility. Your argument is that responsibility tracks responsiveness to reasons and interventions, not the etiology of the trait. The colleague's draft threatens this by implying that genetic involvement in response reduces the efficacy of policy or the malleability of the trait. If you include the paragraph as written, you risk conceding that genetic factors make traits harder to change, which could lead a reader to think that genetically influenced responsiveness is a diminished form of responsiveness. You need to ensure the text does not suggest that genetic causes are obstacles to intervention. If the response to an intervention is heritable, it simply means the capacity to respond is part of the individual's biological makeup. For a compatibilist account of responsibility, that is perfectly fine. What matters is that the response exists, not whether the capacity to respond is itself caused by genes or environment. You should push your colleague to revise the flip side to emphasize that high heritability does not predict intervention failure, and that genetic variation in response simply calls for tailored interventions rather than indicating limited policy room.

  Finally, regarding your question on whether there is a number that tells us how malleable a trait is: there is no such number, and asking for one is the wrong sort of question. Malleability is not a property of the trait in the abstract but a property of the trait relative to specific environmental changes. A trait might be highly malleable with respect to one intervention and completely rigid with respect to another. Heritability is a ratio of variances in a specific population at a specific time, not a measure of potential change. There is no single statistic that captures the slope of the reaction norm across all possible environments. The best you can do is specify the intervention and measure the effect size directly. For your paper, this supports your main thesis: since there is no general number for fixity, you cannot derive conclusions about responsibility from heritability estimates. Responsibility depends on the actual capacity to respond to reasons in the actual world, not on a statistical abstraction about variance in a population. If you can get your colleague to tighten the second half of the box to avoid implying that genetic influence equals resistance to change, the box will support your argument rather than quietly working against it.
