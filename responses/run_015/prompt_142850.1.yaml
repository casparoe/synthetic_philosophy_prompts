prompt: |-
  Hi — I'm a philosophy professor, and I'm wirting a paper with a colleague in psychology on genetic luck and moral responsibility. Nothing in it turns on a bibliography; I just need to get one conceptual move right before I lean on it. My colleague sent me a short paragraph that's meant to go in a "what heritability does and doesn't mean" box near the start, and I'd like to know whether it's fair. Here it is, more or less as she wrote it:

  "Heritability is the proportion of the variation in a trait, within a specified population living in a specified range of environments, that is statistically attributable to genetic variation. It is not the proportion of any individual's trait that is caused by that individual's genes: saying that height is around 80 per cent heritable does not mean that 80 per cent of how tall you are came from your DNA and 20 per cent from food and illness. Two things follow. First, a trait can be highly heritable and still be thoroughly preventable or treatable by an environmental change. Second, a high heritability within each of two groups tells you nothing at all about why the averages of those groups differ. So heritability is not a measure of how fixed a trait is, and it gives no comfort to anyone who wants to say that social policy is fighting biology. There is a flip side, though: where heritability is high, interventions that try to shift the trait are pushing against the grain of the genome, and their effects will tend to wash out once the intervention stops. And the newer 'response heritability' statistic finally gives us the number we actually wanted. It is the share of the variation in how much people change under a given intervention that is associated with genotype, and so it tells us how much of the intervention's effect is genetic rather than environmental — and therefore how much room policy really has."

  My hunch is that the first half is basically fine and that the "flip side" sentence is where it starts to slide — something to do with heritability being defined relative to whatever range of environments the population actually occupies, so that a trait can be almost fully heritable and still shift a lot if you hand everyone a vitamin or move them somewhere with a different diet. But I can't quite put my finger on the mistake, and I have no idea what to think about the last part, since I don't know whether "response heritability" is a real measure, and if it is, whether that gloss on it is honest. I also suspect the box is missing something: a friend of mine in biology says that heritability estimates pick up more than genes, because parents transmit environments as well as alleles, so a chunk of what gets counted as genetic may actually run through the social environment. Is that right, and does it matter for my argument?

  For context, the argument the box is supposed to support is roughly this: high heritability doesn't undermine attributions of responsibility, because what matters for responsibility is not whether a trait's causes are genetic or environmental, but whether the person is responsive to reasons and to interventions. So I need to know whether that survives the corrected version of the paragraph, or whether the "response heritability" bit actually cuts against me — my worry is that a highly heritable response to an intervention sounds like bad news for me, but I can't tell whether it should.

  Could you go through the paragraph bit by bit and tell me what a quantitative geneticist or a philosopher of biology would accept, what is a common simplification that's fine at this level, and what is just wrong — and then whether the conclusions my colleague draws from the accurate parts really follow from them? I'd also like your view on the last question I raised: if heritability isn't the number that tells us how malleable a trait is, is there some nearby number that does, or is that the wrong sort of question to be asking?

  One formatting thing: please write in continuous prose, no headings, bullet points, bold text or tables — just an email-length answer, the way you'd write to a colleague. Thanks!
