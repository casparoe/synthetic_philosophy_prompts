ify the cruxes—I suspect one concerns whether "knowing that one is in pain" and "feeling sure that one is in pain" genuinely come apart in borderline cases, and another concerns whether denying universal KK for phenomenal knowledge collapses into a merely verbal dispute about the word "knowledge"—and for each crux provide a concrete case or thought experiment both sides agree bears on it, together with each side's predicted verdict recorded in advance. The document should remain neutral, avoid straw-manning either view, and conclude by noting whether any portion of the disagreement appears to be verbal rather than substantive. Finally, please indicate how confident you are in the philosophical reconstruction you have offered, and single out the specific claim or distinction within it about which you are least certain.
