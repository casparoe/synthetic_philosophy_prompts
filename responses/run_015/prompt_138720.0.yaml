  **Strategy & Example**
  Before the word 'grounding' appears, secure the intuition of non-causal dependency. Establish that reality has layers where lower layers *make* upper layers obtain without *pushing* them temporally. Get agreement that 'The ball is red because it is scarlet' feels different from 'The ball moved because I pushed it'.

  Back the horse. The procedural generation example is superior for this room. Scarlet/red risks conflating grounding with conceptual entailment or property identity. The seed example bridges CS (algorithmic dependency) and Humanities (creation rules). It needs to have deterministic rules to avoid randomness confusing the dependency. It needs to lack *temporal delay*: stipulate the seed and world are synchronically linked metaphysically, even if typing precedes rendering. It must not imply the seed is a physical object causing effects. It shows determination without production.

  **Session Beats**
  **0–10: The Hook.** Ask: 'Why is *this* something here?' Elicit examples of things holding 'in virtue of' others. Write 'in virtue of' on the board. Do not yet write 'grounding'.
  **10–25: The Model.** Introduce the procedural generation case. Seed + Rules → World. Every mountain fact holds in virtue of the code. Emphasise: the seed doesn't *push* the mountain into place (no causation); the world isn't the seed (no identity).
  **25–40: The Definition.** Formalise: Grounding is non-causal, non-identity dependence. It's metaphysical explanation. Fundamentality is where the chain stops.
  **40–50: The Trap.** Discuss structure. Is it a graph? Yes, but metaphysical, not just data. Can chains go on forever? Introduce brute facts.
  **50–60: Discussion.** Open floor. Apply the check question.

  **Misconception Map**
  *   **Causation (Sign-flipped):** Defuse in **Beat 2**. Stress synchronicity. The seed doesn't *precede* the mountain in reality's structure, only in typing.
  *   **Identity ('Nothing over and above'):** Defuse in **Beat 3**. The world is richer than the seed; grounding isn't reduction.
  *   **Dependency Graph (CS Trap):** Defuse in **Beat 4**. Acknowledge the structural similarity but insist grounding is *worldly*, not just representational. It's about reality's architecture, not our maps.
  *   **Brute Facts/Physics:** Defuse in **Beat 5**. Clarify 'fundamental' means 'ungrounded', not necessarily 'quantum particles'. Social facts can ground legal facts, stopping at brute social agreements.
  *   **Missing Misconception:** That grounding is epistemic (about knowledge). Head off in **Beat 3**. It's about reality, not evidence.

  **The Delete Test**
  Kill it. 'If you delete the ground, the grounded goes' tests counterfactual dependence. Causation satisfies this too (delete the cause, the effect goes). It fails to distinguish grounding from causation, which is your primary hurdle. It is necessary but not sufficient.

  **Check Question & Refusals**
  **Check Question:** 'If the seed determines the world, does changing the world change the seed?' (No). 'Does changing the seed change the world?' (Yes). This tests asymmetry without causation. If they say 'both', they think it's identity. If they say 'neither', they see no connection.
  **Refusals:** Explicitly refuse to formalise the logic of grounding (transitivity, irreflexivity proofs) or debate Monism (is the whole universe the only fundamental object?). Both stall intuition.
