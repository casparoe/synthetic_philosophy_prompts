answer: |-
  **Title:** The Fragility of the Plural Subject: Collective Intentionality and the Breakdown of Order in *Lord of the Flies*

  **Abstract:**
  This reading examines William Golding's *Lord of the Flies* through the lens of collective intentionality, specifically utilizing Raimo Tuomela and Kaarlo Miller's distinction between *we-mode* and *I-mode* agency, and Margaret Gilbert's theory of the plural subject via joint commitment. I argue that the boys' society does not merely suffer a mechanical failure of cooperation but undergoes a normative collapse characterized by the unilateral revocation of joint commitment. The conch serves not as a mere coordination device but as the material artifact of a nascent plural subject, while Piggy occupies the tragic position of the guardian of the "we" who is ontologically excluded from it. The violence that ensues is not simply a return to nature, but the enforcement of a rival, predatory plural subject.

  ***

  ### I. The Initial Joint Commitment: The Conch as Normative Artifact

  In the opening assembly, the boys do not merely aggregate; they attempt to constitute a *plural subject* in Margaret Gilbert's sense. Gilbert argues that a plural subject is formed when individuals jointly commit to accepting certain goals or beliefs as a body. This joint commitment creates obligations and entitlements that are not reducible to the sum of individual preferences. When Ralph blows the conch and the boys gather, the ensuing dialogue—"We need rules," "We'll have hands up like at school"—is not strategic bargaining. It is the performative utterance of a joint commitment.

  Under Tuomela and Miller's framework, this initial gathering attempts to shift the boys from *I-mode* (acting for personal safety or comfort) to *we-mode* (acting as group members for the group's ethos). The ethos is explicitly defined: rescue, order, and shelter. The conch is the critical variable here. If the conch were merely a coordination device (a Schelling point), its power would dissolve the moment it ceased to be useful for individual coordination. However, the text suggests the conch functions as a *status artifact* of the joint commitment. Holding the conch grants the right to speak *because* the group has jointly accepted that constraint.

  When Piggy insists, "That's what this shell's called. I know things," he is appealing to the normative force of the commitment. The conch binds the boys even against their immediate will; to speak without it is not just inefficient, it is a violation of the group's constitutive rules. The initial stability of the camp relies on the success of this Gilbertian contract: the boys are obligated to obey the rules not because they fear punishment (initially), but because they are co-authors of the plural subject "the survivors."

  ### II. The Erosion into I-Mode: Strategic Coordination vs. Collective Acceptance

  The destabilization of the group begins not when the boys stop cooperating, but when the *mode* of their cooperation shifts from *we-mode* to *I-mode*. Tuomela distinguishes between acting as a group member (we-mode) and acting individually in a way that happens to align with others (I-mode). Jack's divergence is the catalyst. When Jack prioritizes hunting over the signal fire, he is not proposing a new group goal; he is pursuing a personal goal (dominance, bloodlust, meat) and inviting others to join instrumentally.

  Jack's rhetoric often mimics the we-mode ("We hunt together"), but the underlying intentionality is I-mode strategic coordination. The hunters cooperate only insofar as the hunt satisfies individual urges. This is evidenced by the fragility of their alliance; when the hunt fails or the thrill fades, the cohesion threatens to break unless reinforced by ritual and fear. Ralph, conversely, attempts to maintain the original joint commitment to rescue. The conflict between Ralph and Jack is not merely a clash of personalities, but a clash of intentional modes. Ralph appeals to the *obligation* ("You said you'd keep the fire going"), while Jack appeals to *utility* and *desire* ("We want meat").

  The breakdown feels like a *revocation* of commitment rather than a mechanical failure because the boys acknowledge the obligation even as they violate it. If this were pure I-mode coordination, the boys would simply drift away as preferences diverged. Instead, there is guilt, defensiveness, and violence. When Jack shouts, "Bollocks to the rules!" he is not ignoring the rules as irrelevant; he is actively rejecting the normative force of the joint commitment that created them. He is severing the tie that binds the plural subject. This is why the moment feels like a betrayal: in Gilbert's terms, one cannot unilaterally withdraw from a joint commitment without violating the rights of the other partners. Jack's secession is a performative violation of the "we."

  ### III. Piggy: The Theorist of the "We" Excluded from the Ontology

  Piggy occupies the most philosophically precarious position in the novel. He is the staunchest defender of the joint commitment, constantly appealing to the external validator of their plural subject: "What would grown-ups do?" He understands that the power of the conch and the rules derives from a collective acceptance that transcends individual might. In this sense, Piggy is the philosopher of the group's intentionality.

  However, Piggy is systematically excluded from the *content* of the "we." While he helps formulate the rules, he is never fully integrated into the collective identity. The other boys accept his reasoning (initially) but reject his person. In Tuomela's terms, Piggy is treated as an external resource rather than a full participant in the we-mode. The group utilizes his intellect (the I-mode utility of his glasses) while denying him the status of a co-member of the plural subject.

  This exclusion is fatal to the stability of the original joint commitment. A robust plural subject requires that members view each other as interchangeable parts of the whole. By marking Piggy as an outsider ("Fatty," "Ass"), the boys weaken the universality of their own commitment. If the "we" does not include everyone bound by the rules, the rules become tools of exclusion rather than binding norms. Piggy's death, coinciding with the destruction of the conch, symbolizes the total annihilation of the plural subject. It is not just the death of a boy; it is the destruction of the mechanism of joint commitment itself. Without Piggy (the reason) and the Conch (the symbol), there is no remaining artifact to sustain the "we."

  ### IV. Competing Plural Subjects and the Nature of the Breakdown

  It is insufficient to say Jack dissolves the group; rather, he forms a *rival* plural subject. Jack's tribe is not a state of nature; it is a highly structured collective with its own ethos, rituals, and joint commitments. The paint, the dance, and the chant ("Kill the beast! Cut the throat! Spill the blood!") constitute a new joint commitment. This new "we" is bound by fear and bloodlust rather than rescue and order.

  The violence that erupts is the friction between two competing plural subjects. Simon's murder is the clearest example of this. In the frenzy of the dance, the boys operate in a high-intensity we-mode. They act as a single body. Simon, entering the circle, is not killed as an individual rival but as a threat to the new collective intentionality (the "beast"). The group mind absorbs the act; no single boy feels fully responsible because the agency is distributed across the plural subject. This explains the collective amnesia and denial the next day. The joint commitment of the tribe allows for the diffusion of moral responsibility, a phenomenon Gilbert notes can occur when a group acts as a body.

  The breakdown of Ralph's faction feels like a revocation because Jack's new tribe demands the total abrogation of the old one. One cannot be a member of Ralph's civil "we" and Jack's primal "we" simultaneously. The hunt for Ralph at the end is not just a hunt for food; it is the new plural subject eliminating the last remnant of the old commitment.

  ### V. Conclusion: The Normativity of Collapse

  Reading *Lord of the Flies* through collective intentionality reveals that the tragedy is not a loss of civilization, but a failure to sustain the normative force of a joint commitment. The boys demonstrate that the *we-mode* is fragile without external enforcement or deep internalization. The conch was never just a shell; it was the physical instantiation of a promise to act as a body. When that promise is revoked, the collapse is not mechanical—it is moral.

  The arrival of the naval officer at the end reintroduces a larger, more terrifying plural subject: the warring nations of the adult world. The officer scolds the boys for their lack of order, failing to see that their micro-sociology mirrors his own macro-sociology. He represents a joint commitment (civilization/war) that is large enough to enforce its rules, but no less prone to violence. Golding's novel, read through Tuomela and Gilbert, suggests that the "we" is always precarious. It requires constant renewal of joint commitment, and when that commitment is revoked, the return to the "I" is not a liberation, but a descent into a war of all against all, until a new, darker "we" is forged in blood.
