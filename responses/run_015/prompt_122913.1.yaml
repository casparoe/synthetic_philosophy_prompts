prompt: |-
  I sit on the collections committee of a small municipal museum, and we have been going in circles on a policy question that keeps getting settled by an analogy rather than by an argument. In 1971 the museum bought, in good faith, a seventeenth-century panel painting catalogued as by a named master. Three years ago technical examination and a connoisseur's report moved it to "imitator of, probably twentieth century." A majority of us want to keep it on the wall under a new label — "in the manner of," plus a short account of the reattribution. Our chair will not have it. A forgery, he says, is like a lie. A statement shown to be a lie does not become true by being footnoted, and a picture shown to be a forgery does not become genuine by being reattributed; the defect is in the thing and not in anyone's beliefs, so keeping the picture up is keeping the lie up, and the honest response is withdrawal.

  I would like an audit of the analogy rather than a verdict on our case.

  Give me the correspondence table first: for the lie, the speaker, the utterance, the propositional content, the audience, the intention to deceive, the moment of utterance, the later discovery, the retraction; and for the painting, the painter, the work, the catalogue entry or label, the visitor, whatever plays the role of intent, and whatever plays the role of the moment of utterance. Then tell me which of the mismatches actually matter for the conclusion he wants — permanent contamination, hence withdrawal — and which are noise.

  Three cases I would like the table tested against:

  One. Suppose the panel was made openly in the 1620s as a studio product, sold and catalogued as such for two and a half centuries, and was "upgraded" only in 1890, when a dealer dropped the qualifying phrase from a label. The object never changed; something a third party did in 1890 seems to have converted an honest object into a lie. If the analogy holds, what happened in 1890, to what, and why is the object rather than the label the site of the wrong?

  Two. An imitator sells to a collector who knows exactly what he is buying, does not care, and hangs it in his study with an accurate label. Nobody is deceived and nothing is asserted to a dupe. Is there a lie here at all? If not, is the object nonetheless defective in the way the chair's conclusion requires?

  Three. Genuine works are demoted and later promoted again when opinion turns. If attribution can move in both directions while the object stays numerically the same, can the analogy accommodate the upward case, or does it only work downhill?

  Then the two directions of distortion. What does the analogy import into the target that objects do not have — a speaker with a datable intention, a content that can be re-asserted truthfully, an act whose wrongness is complete at the time and is not repaired by correction, the possibility of confessing — and what does it leave out on the other side, given that who made this is a causal claim about the world maintained by an ongoing institutional practice rather than a single speech act? Please keep separate the three questions the chair slides between: whether the picture is aesthetically inferior, whether it is morally tainted, and what an institution should do with it.

  If the analogy cannot carry his conclusion, I want a candidate evaluated rather than just a dismissal. I have tried "perjury" — the wrong is institutional and is not undone by later truth-telling — and "plagiarism" — the wrong is a misdirection of credit and survives detection — and I cannot tell whether either is an improvement or merely relocates the difficulty.

  Finally, tell me what would change your mind about which way we should go, and where your own reasoning is most likely to fail. My suspicion is that it will rest on an empirical claim about what visitors actually take away from a relabeled picture, so say explicitly if you are relying on one and what happens to your recommendation if it is false.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Member of a collections committee at a small municipal museum.
      *   **Problem:** Disagreement over a deattributed painting (17th C panel, bought 1971 as Master, now "Imitator, 20th C").
      *   **Conflict:** Majority wants to keep it with a new label ("in the manner of" + explanation). Chair wants withdrawal based on an analogy: "A forgery is like a lie."
      *   **Task:** Audit the analogy, *not* give a verdict on the specific case.
      *   **Specific Requirements:**
          1.  Create a correspondence table (Lie vs. Painting).
          2.  Identify mismatches that matter for the Chair's conclusion (permanent contamination/withdrawal) vs. noise.
          3.  Test the table against three specific cases (Studio product upgraded later; Private sale with full knowledge; Attribution fluctuation up and down).
          4.  Analyze directions of distortion (what the analogy imports/leaves out).
          5.  Separate three conflated questions (Aesthetic, Moral, Institutional).
          6.  Evaluate candidate analogies ("Perjury", "Plagiarism").
          7.  State what would change my mind and where my reasoning might fail (specifically regarding empirical claims about visitor perception).

  2.  **Deconstruct the Chair's Analogy ("Forgery is a Lie"):**
      *   *Core Logic:* A lie is inherently defective. Correcting the record doesn't fix the lie; it just admits it was a lie. Therefore, the object (the lie) must be removed.
      *   *Implicit Premise:* The object *is* the assertion.
      *   *Goal:* Show why this logic might fail or succeed in the context of a museum collection.

  3.  **Drafting the Correspondence Table:**
      *   Need to map linguistic/philosophical concepts of lying to museological concepts.
      *   *Lie:* Speaker, Utterance, Proposition, Audience, Intent to Deceive, Time of Utterance, Discovery, Retraction.
      *   *Painting:* Painter (or Attributor), Work, Label/Catalogue, Visitor, Intent (Forgery vs. Pastiche), Creation/Sale, Re-examination, Relabeling.
      *   *Crucial Distinction:* Is the "lie" the paint on wood, or the text on the wall?

  4.  **Analyzing Mismatches:**
      *   *Matter:* The distinction between the *object* and the *claim about the object*. In language, the utterance *is* the vehicle of the lie. In art, the paint isn't speaking; the label is.
      *   *Noise:* The specific emotions involved (shame vs. curiosity).
      *   *Chair's Conclusion:* Depends on the object *being* the lie. If the object is evidence *of* a lie (the dealer's fraud), it's different from the object *being* the lie.

  5.  **Testing the Three Cases:**
      *   *Case 1 (Studio Product):* Object is honest. Label changed in 1890. If analogy holds, the *label* lied, not the wood. Why withdraw the wood? This breaks the "object = lie" equivalence.
      *   *Case 2 (Private Sale/Known Copy):* No deception. No lie. Chair says "defect is in the thing." If no lie occurred, is there still a "moral defect"? This challenges the "lie" analogy specifically.
      *   *Case 3 (Fluctuating Attribution):* Lie implies binary truth/falsehood. Art attribution is probabilistic and shifts. If it goes back up, was it a lie in the middle? The analogy struggles with epistemic uncertainty.

  6.  **Directions of Distortion:**
      *   *Imports:* Moral agency to inanimate objects, binary truth value to probabilistic scholarship, singular speech act to ongoing curation.
      *   *Leaves Out:* The object as historical evidence (even of forgery), the educational value of the error, the institutional duty to preserve history of taste.
      *   *Separating the Questions:*
          1.  *Aesthetic:* Is it good art? (Irrelevant to the lie analogy).
          2.  *Moral:* Is it tainted by fraud? (Relevant to lie analogy).
          3.  *Institutional:* What do we do? (Depends on mission, not just morality).

  7.  **Evaluating Candidate Analogies:**
      *   *Perjury:* Focuses on the institutional record. Better, but implies a legalistic binding that museums might not have. Still suggests removal/punishment.
      *   *Plagiarism:* Focuses on misattribution of credit. Better fit for art. Does plagiarism require destroying the text? No, it requires correcting the attribution. This supports the Majority view.
      *   *Verdict:* Plagiarism is stronger because it allows for the work to remain once credit is corrected.

  8.  **Self-Reflection & Empirical Claims:**
      *   *What changes my mind?* If the presence of the object actively misleads despite the label (e.g., visitors ignore labels).
      *   *Where I might fail:* Assuming visitors read labels. Assuming the "lie" is only in the text.
      *   *Empirical Claim:* Visitors trust the visual presence more than the text. If true, the Chair has a point about the *display* (not the collection) being deceptive.

  9.  **Refining the Tone:**
      *   Needs to be analytical, philosophical, respectful of the committee's gravity, but rigorous.
      *   Avoid taking sides directly, but show where the logic breaks.
      *   Ensure all constraints of the prompt are met (Table first, then mismatches, then 3 cases, then distortion, then candidates, then self-reflection).

  10. **Final Review against Constraints:**
      *   Correspondence table first? Yes.
      *   Mismatches (matter vs. noise)? Yes.
      *   Three cases tested? Yes.
      *   Two directions of distortion? Yes.
      *   Separate three questions (Aesthetic, Moral, Institutional)? Yes.
      *   Evaluate "Perjury" and "Plagiarism"? Yes.
      *   What changes my mind/Empirical claim? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just say "The Chair is wrong." I need to audit the *analogy*. The Chair's conclusion is "withdrawal." The analogy supports this only if the object *is* the lie. I need to show that the object is more likely the *evidence* of a lie, or the subject of a claim, rather than the claim itself.

  *Refining the Table:* Make sure "Intent" is handled carefully. In a lie, intent is crucial. In a painting, intent (of the painter vs. the seller) matters.
  *Refining Case 1:* This is the strongest argument against the Chair. If the object didn't change, the "lie" must be external to the object.
  *Refining Empirical Claim:* Be specific. If visitors ignore labels, the "retraction" fails.

  *Final Polish:* Ensure the distinction between the *collection* (holding) and the *gallery* (displaying) is clear, as the Chair says "keeping the picture up."

