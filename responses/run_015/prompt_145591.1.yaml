      *   Look for conflations? Yes.

      *(Self-Correction)*: I need to be careful not to sound like I'm saying "Fomenko is wrong." I need to say "The student claims Fomenko does X, but standard scholarship characterizes Fomenko as doing Y, which creates a tension in the answer." Actually, the prompt asks me to grade the student. I can point out that the student's claim that Fomenko "doesn't invoke conspiracies" is factually incorrect regarding the content of New Chronology. That is a matter of fact about the text, not a judgment on the validity of the history. Fomenko *explicitly* writes about the "Scaligerian conspiracy." So I can point that out as a factual error about the source material.

      Let's finalize the comments.
