answer: |-
  ### Example: The "Common Evidence" Jury Model

  A classic example of a binary collective decision problem where the Condorcet Jury Theorem (CJT) fails due to correlated signals is the **Common Evidence Model** (often associated with the work of Krishna Ladha or Philip Boland).

  #### 1. The Scenario
  Consider a jury of $n$ members deciding between two verdicts: **Guilty ($1$)** or **Innocent ($0$)**. The true state of the defendant is $T \in \{0, 1\}$.

  In the standard CJT, jurors observe independent private signals. In this modified scenario, jurors observe a mix of **private evidence** and **common evidence**.
  *   **Private Evidence ($E_i$):** Unique to each juror (e.g., their own assessment of witness credibility).
  *   **Common Evidence ($C$):** Shared by all jurors (e.g., a specific piece of forensic data, a video tape, or a judge's instruction that all interpret similarly).

  #### 2. The Correlation Structure
  The correlation arises because the reliability of the decision depends on a **latent shared epistemic source**: the quality of the Common Evidence ($C$).

  Let us define the signal generation process as a mixture of two states regarding the Common Evidence:

  *   **State A (Reliable Common Evidence):** Occurs with probability $1 - \alpha$.
      *   The Common Evidence $C$ points to the Truth ($C=T$).
      *   Jurors vote independently based on their private signals, which are also reliable.
      *   Probability of individual correct vote: $q_{ind}$.
  *   **State B (Misleading Common Evidence):** Occurs with probability $\alpha$.
      *   The Common Evidence $C$ is systematically misleading ($C \neq T$).
      *   Because the common evidence is strong, it dominates the private signals for all voters. All jurors are biased in the same direction.
      *   Probability of individual correct vote: $q_{corr}$ (where $q_{corr} < 0.5$, potentially near 0).

  **Mathematical Specification:**
  Let $V_i$ be the vote of juror $i$ ($1$ if correct, $0$ if incorrect).
  The votes are **conditionally independent** given the state of the Common Evidence, but **marginally correlated**.

  *   $P(V_i = 1 | \text{State A}) = q_{ind}$
  *   $P(V_i = 1 | \text{State B}) = q_{corr}$
  *   **Individual Competence ($p$):** The marginal probability that a single voter is correct is:
      $$p = (1 - \alpha)q_{ind} + \alpha q_{corr}$$

  **Numerical Example:**
  *   Let $\alpha = 0.2$ (20% chance the common evidence is misleading).
  *   Let $q_{ind} = 0.8$ (Jurors are 80% accurate when evidence is good).
  *   Let $q_{corr} = 0.1$ (Jurors are 90% likely to be wrong when evidence is misleading).
  *   **Individual Competence:** $p = (0.8 \times 0.8) + (0.2 \times 0.1) = 0.64 + 0.02 = 0.66$.
      *   *Condition Met:* $p > 0.5$. Each voter is individually more likely to be correct than not.

  #### 3. Behavior of Majority Accuracy as $n \to \infty$
  The Condorcet Jury Theorem states that if votes are independent and $p > 0.5$, the probability the majority is correct ($P_n$) converges to 1 as $n \to \infty$.

  In this correlated model:
  1.  **In State A:** As $n \to \infty$, the independent private signals average out. By the Law of Large Numbers, the majority will be correct with probability approaching **1**.
  2.  **In State B:** The error is systematic (common source). Adding more voters does not cancel out the bias; it reinforces it. The majority will be incorrect with probability approaching **1** (meaning accuracy approaches **0**).

  **Limit Accuracy:**
  The overall probability that the majority is correct as $n \to \infty$ is the weighted average of the accuracy in each state:
  $$ \lim_{n \to \infty} P_n = (1 - \alpha)(1) + \alpha(0) = 1 - \alpha $$

  Using our numbers:
  $$ \lim_{n \to \infty} P_n = 0.8 $$

  **Conclusion:** Even though individual competence is $0.66$, the group accuracy plateaus at $0.8$ and never reaches $1$. The CJT conclusion fails because the correlation prevents the "cancellation of errors" required for the Law of Large Numbers to drive accuracy to unity.

  #### 4. Implications for Forecast Aggregation
  This example highlights critical limitations of using forecast aggregation (e.g., prediction markets, voting, expert panels) as an epistemic device:

  1.  **Independence is Crucial:** The "Wisdom of Crowds" relies more on the **diversity** of information sources than the **size** of the crowd. If all forecasters rely on the same data source (e.g., the same economic model, the same news feed), aggregation cannot eliminate systematic bias.
  2.  **Systemic Risk:** In financial or policy contexts, correlation implies "tail risk." A large group of experts may appear highly competent historically (high $p$), but remain vulnerable to a specific "State B" scenario (e.g., a black swan event that invalidates their shared model) where the entire group fails simultaneously.
  3.  **Value of Dissent:** To improve epistemic outcomes, mechanisms should be designed to decorrelate signals. This might involve assigning different sub-questions to different experts, encouraging adversarial collaboration, or weighting votes based on the uniqueness of the information source rather than just past accuracy.
