  # Joint Statement on Rationality in Parfit's Hitchhiker
  **Collaborators:** The Causal Decision Theorist (CDT) and The Disposition-Rationalist (DR)

  ### I. Agreed Claims Regarding the Original Scenario

  1.  **Scenario Structure:** We agree the agent is stranded in a desert, encountered by a driver who offers a ride to town contingent on a prediction that the agent will pay $1,000 upon arrival. The driver possesses high predictive accuracy regarding agent behavior.
  2.  **Outcome Valuation:** We agree that survival (reaching town) is strictly preferred to death (remaining in the desert), and that retaining $1,000 is preferred to paying it, provided survival is secured.
  3.  **Rational Verdict:** We agree that in the standard formulation, the rational action for the agent upon arriving in town is to pay the driver.
  4.  **Failure Mode:** We agree that an agent who determines not to pay while in the desert (or upon arrival) will likely be predicted as such, refused the ride, and left to die.
  5.  **Commitment Necessity:** We agree that some form of binding commitment mechanism—whether external, internal, or algorithmic—is required to bridge the gap between the ex-ante desire for rescue and the ex-post desire to save money.

  ### II. Disagreements Table

  | Issue | Causal Decision Theorist (CDT) | Disposition-Rationalist (DR) |
  | :--- | :--- | :--- |
  | **Source of Rationality** | Paying is rational because it executes the **ex-ante decision algorithm** that causally secured the ride. The rationality derives from the efficacy of the plan selected before the ride began. | Paying is rational because it maintains a **trustworthy disposition**. The rationality derives from the intrinsic and instrumental value of being a person of integrity, independent of specific causal chains. |
  | **Role of Past Events** | The current payment validates the **causal link to the past pickup**. While the payment cannot change the past physically, it confirms the type of agent who causally influenced the driver's past prediction. | The current payment has **no causal effect on the past**. The pickup is a sunk fact. Rationality concerns the present state of the agent's character, not retroactive influence on the driver's prior choice. |
  | **Nature of Commitment** | Commitment is **strategic and resolute**. It is a binding of future selves to a prior plan to ensure the plan's causal efficacy remains intact across time. | Commitment is **constitutive**. It is the embodiment of a virtue. To break commitment is to alter the self, corroding the disposition regardless of external observation. |
  | **Twist Prediction (10% Sensor Noise)** | **Optimize Probability (<100%).** Since the driver's verification sensor has a 10% false-positive rate (indicating payment when none occurred), a rational agent should pre-commit to a probabilistic rule (e.g., pay 90% of the time) to minimize cost while maintaining sufficient signal for future causal efficacy. | **Maintain Certainty (100%).** Sensor noise is irrelevant to internal integrity. A rational agent must pre-commit to pay 100% of the time because the act of non-payment corrodes the trustworthy disposition, even if undetected by the sensor. |
  | **Critical Parameter Shift** | **Increase False-Positive Rate to 40%.** We agree this shift bears on the dispute. CDT predicts the rational payment probability should drop significantly to exploit the high noise while retaining enough causal signal for future rides. | **Increase False-Positive Rate to 40%.** We agree this shift bears on the dispute. DR maintains the rational payment probability remains 100%, as the corruption of character is independent of detection probability, highlighting the divergence between external incentives and internal norms. |
