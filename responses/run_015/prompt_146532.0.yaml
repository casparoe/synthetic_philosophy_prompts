answer: |-
  **The Periphery**

  The photograph sat on the desk, face up. It was taken in July of 1998, on a pier in Maine. I was standing next to Elias, holding an ice cream cone that was melting down my wrist. I remembered the stickiness, the salt in the air, the way the sun hit the water. I remembered it vividly.

  But when I looked at my left wrist in the fluorescent light of the study, there was no scar. I had checked the medical archives yesterday. There was no record of a burn, no record of a visit to a clinic in Maine that summer. In fact, according to my passport stamps, I was in Ohio that July.

  Elias, however, had been in Maine. Elias had burned his wrist on a dropped cone. He had told me the story a hundred times over dinner, over wine, in the dark of the bedroom. He told it with such texture, such specific weight, that eventually, the story had settled into me. I hadn't just memorized it; I had inhabited it. Now, when I closed my eyes, I felt the heat of the sun on *my* shoulders, not his.

  I turned the photograph over. The date was stamped in white ink on the bottom right. I traced the edge of the paper. It wasn't that I was lying to myself. It was that the memory had migrated. It had slipped the leash of its owner and found a home in me.

  I walked to the kitchen. Elias was there, grinding coffee beans. The noise was a violent crunching, filling the room. He didn't look up when I entered. He never really did. He assumed I was there, just as the air assumed the presence of a lung.

  "I'm going to write today," I said.

  Elias paused, the grinder humming down to a stop. "Your book?"

  "My journal. Just for me. Not about us. Not about the house. Just… what I saw."

  "Good," he said, turning to face me. He smiled, a warm, heavy expression that felt like a hand on the shoulder. "You should claim some space."

  He meant it kindly. That was the difficulty. There was no villain here, no puppeteer cutting strings. There was only Elias, living his life with such dense, compact intensity that the space around him curved. I had drifted too close, years ago, and the friction had ignited something. I had become a satellite, spinning off the heat of his narrative.

  I went to the study and sat at the small desk by the window. I opened a fresh notebook. The paper was blank, waiting for a coordinate system. I picked up the pen.

  *Today I woke up,* I wrote.

  I stopped. Why did I wake up? Because the alarm went off at seven. Why did the alarm go off at seven? Because Elias has a meeting at nine.

  I crossed it out.

  *The light came through the curtains,* I wrote.

  But I hadn't noticed the light until Elias complained it was too bright. My perception was reactive. I was a mirror that thought it was generating the light. I tried to push deeper, to find a memory that belonged solely to the flesh I occupied. I tried to recall the color of my childhood bedroom.

  Blue. It was blue.

  But as I held the image, the shade shifted. It became the blue of Elias's first car. The memory of the fabric on the seats overlaid the memory of the paint on my walls. The textures merged. I realized I couldn't recall the sound of my mother's voice without filtering it through Elias's opinion of her. He thought she was distant. So, in my mind, her voice became distant, cool, recorded on a tape left in another room. I had no independent data. I had only his interpretation, processed until it felt like my own intuition.

  I put the pen down. The silence in the house was heavy. It wasn't an empty silence; it was a pressurized one, like the bottom of the ocean.

  I decided to leave. Not forever, just for an hour. I needed to walk to the park without knowing if Elias would approve. I needed to buy a fruit I knew he hated. I needed to establish a trajectory that did not intersect with his.

  I put on my coat. Elias was in the living room, reading. He didn't look up. I opened the front door. The air outside was cold, sharp. I walked down the driveway.

  At the end of the path, I stopped.

  Usually, when I walked this route, I was walking toward a destination Elias had mentioned. *The bakery has good bread.* *The park is nice this time of year.* Every step I had ever taken here was annotated by his commentary. Now, without the annotation, the steps felt unmoored.

  I took a step onto the sidewalk. My balance faltered. It wasn't physical dizziness; it was a loss of context. Who was walking? If I wasn't walking to show Elias the view later, if I wasn't walking to escape Elias's noise, then what was the verb for this action?

  I tried to construct a sentence in my head to describe the moment. *I am walking down the street.* The sentence felt hollow, grammatically correct but semantically void. A subject without a predicate. A noun without a verb. The narrative gravity that usually held me together was back in the house, sitting in the armchair, reading a book.

  I felt a nausea that wasn't in my stomach. It was in my history. I tried to recall why I liked apples. I realized I didn't. Elias liked apples. I ate them because he bought them. If I bought a pear now, who would I tell about it? The act of tasting requires a witness to become a memory. I was a witness only because Elias was the primary observer. Without him, I was just a camera lens left on a table, capturing light that meant nothing.

  I stood on the corner for ten minutes. A car passed. The driver looked at me. I wondered what they saw. Did they see a person? Or did they see a shadow cast by someone else?

  I turned around.

  Walking back felt easier. The narrative structure reassembled itself with every step toward the house. The purpose returned. *I am returning to Elias.* The sentence had weight. It had tension. It had a beginning and an end.

  When I opened the door, Elias looked up. "You were gone a while," he said.

  "The air was cold," I said.

  "Did you get anything?"

  "No."

  I went back to the study. I sat at the desk. I looked at the notebook. I understood now that the failure wasn't in the will. It was in the architecture. A moon cannot decide to become a star. It lacks the mass. It lacks the fusion. If it tries to burn on its own, it simply crumbles into dust.

  I picked up the pen. I turned to a fresh page. I didn't try to write about the walk. I didn't try to write about the cold air or the car passing by. Those things hadn't happened to me. They had happened to the space around Elias.

  I began to write about him.

  *He was reading when I left. The light from the window caught the gray in his hair. He didn't look up, but I knew he knew I was gone.*

  As I wrote, the feeling of solidity returned. The words aligned. The memories settled into their proper slots. I remembered the way his hand held the book, the specific tilt of his head. These memories were sharp, high-definition. They were mine because they were about him. They were the only things I was equipped to hold.

  I wrote for an hour. I described the sound of his breathing. I described the way the house settled around his presence. I described the gravity.

  When I finished, I felt whole. Not independent, but coherent. The center of narrative gravity was not a place I could occupy. It was a place I could orbit. And in the orbit, there was stability. There was a path. There was a reason for the motion.

  I closed the notebook. Outside, the light was fading. Elias would call for dinner soon. I would set the table. I would pour the wine. I would listen to him speak about his day, and as he spoke, I would feel the memories of his day settling into my own mind, overwriting the blank spaces, filling the void with something that felt, sufficiently, like life.

  I waited for his voice. It was the only thing that kept me from spinning off into the dark.
