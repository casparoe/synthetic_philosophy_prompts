prompt: |-
  I was eating cold pizza with my roommate last night and we got into this argument about interpertations of quantom mechanics that I still can't shake. He tried to walk me through a chain that he said proves Everett's branching view actually makes extreme risk-taking rational, and since that's absurd, the view must be false. I feel like there's a hidden slide somewhere but I can't name it. Here's exactly the argument he laid out, step by step.

  (1) In Everett's interpertation, measurement isn't collapse—it's just entanglement between the system and the observer, so every possible outcome happens in its own branch.
  (2) So if I use a quantum-random device to decide whether to sign a dangerous contract, there's a branch where I sign it and suffer, and another branch where I refuse and stay safe.
  (3) From my present first-person point of view, I can't know which branch I'll end up in, but I do know for certain that in at least one branch a future version of me survives.
  (4) Therefore, for any risk I take, as long as there's a nonzero quantum amplitude for survival, there is definately going to be some future "me" who makes it through.
  (5) Rational choice is about securing good outcomes for me, and since I'm guaranteed to have at least one surviving successor no matter what risk I take, extreme risk-taking is actually rational.
  (6) But that's clearly absurd—no rational person should step in front of a train just because some other branch survives.
  (7) So Everett's view must be false, because it turns common-sense rationality upside down.

  Which step should I reject? I really want to keep (1) and (6) if I can, but something feels like it slips between (3) and (5). Tell me exactly where the mistake is, why that premise looked okay on its own, and what I'd have to pay if I gave it up—like whether I'd need to deny that personal identity carries across branches, or whether I'd have to weight my concern for different successors using the Born rule even when I'm thinking about my own survival. Lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restating of the question.
