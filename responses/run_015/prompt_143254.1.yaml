      *   *Nuance on Ressentiment:* The prompt asks about ressentiment among *resisters*. Usually, ressentiment belongs to the weak against the strong. Here, the "strong" (unenhanced) might feel resentment against the "weak" (the state/herd) forcing them down. Or, the unenhanced might be viewed as dangerous criminals. Nietzsche would likely sympathize with the unenhanced *if* they are higher types, but critique them if they are just nostalgic for old violence.
