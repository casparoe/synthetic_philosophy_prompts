  **KAYSERLICHER MATHEMATICUS: BEKANNTMACHUNG ZUR REFORM DER ASTROLOGIE**

  **1. ABGESCHAFFTE FUNKTIONEN**
  Mit sofortiger Wirkung werden folgende Module aus dem prognostischen Dienstleistungspaket entfernt: Häuser, Zeichen, Würden und Debilitäten, Tripplizitäten. Auch Wahlen (Heirat, Reise) und Fragen zu verlorenem Eigentum werden nicht mehr unterstützt. Diese Features wurden als nicht verifizierbar deprekiert. Beschwerden über ausgebliebene Erbschaften werden nicht bearbeitet.

  **2. BEIBEHALTENE HARMONIEN**
  Der Dienst konzentriert sich ausschließlich auf harmonische Aspekte (Konjunktion, Opposition, Trigone, Quadrate sowie neu: Quintil und Biquintil). Die Wirkung erfolgt nicht auf Materie, sondern auf die Seele, welche die geometrischen Verhältnisse resonant erkennt. Wetterprognosen basieren auf der Resonanz der Erdseele. Berechnungen erfolgen nach wahren Planetenörtern (elliptisch), nicht nach mittleren Tafeln.

  **3. BEKANNTE UNVOLLENKOMMENHEITEN**
  Da die Seele frei ist, ist die Wirkung nicht zwingend. Fehler in der Prognose sind kein grounds for complaint, sondern Zeichen komplexer Resonanz. Die Genauigkeit wird nicht garantiert, aber die mathematische Reinheit ist gewährleistet.

  **4. PREISLISTE & KONDITIONEN**
  Das Prognostikon für das kommende Jahr ist deutlich kürzer als das vorige. Der Preis bleibt gleich oder erhöht sich leicht. Weniger Text bedeutet weniger Angriffsfläche für Irrtum. Höhere Präzision erfordert höhere Kosten.
  *Neue Richtlinie zur Persönlichen Gegenwart:* Ein Natalhoroskop wird nur erstellt, wenn der Klient persönlich erscheint und eine Einwilligungserklärung unterzeichnet. Dies stellt die Resonanzbereitschaft der Seele sicher. Nach Unterzeichnung ist eine Rückerstattung ausgeschlossen. Charts im Geheimen werden nicht erstellt.

  **5. FRAGEN, DIE DER DRUCKER GESTELLT WURDE**
  *F: Warum kostet das dünnere Buch mehr?*
  A: Sie zahlen für das, was weggelassen wurde, nicht für das, was gedruckt ist.
  *F: Gilt dies auch für den Kaiser?*
  A: Der Kaiser zahlt doppelt, aber die Aspekte gelten für alle gleich.

  ***

  **[English Translation for Context]**

  **IMPERIAL MATHEMATICIAN: NOTICE OF REFORM AND REVISED PRICE LIST FOR ASTROLOGY**

  **1. ABOLISHED FEATURES**
  Effective immediately, the following modules are removed from the prognostic service package: Houses, Signs, Dignities and Debilities, Triplicities. Also Elections (marriage, travel) and questions regarding lost property are no longer supported. These features have been deprecated as unverifiable. Complaints regarding failed inheritances will not be processed.

  **2. RETAINED HARMONICS**
  The service focuses exclusively on harmonic aspects (conjunction, opposition, trines, squares, plus new: quintile and biquintile). Effect occurs not on matter, but on the soul, which recognises geometric ratios resonantly. Weather forecasts based on Earth-soul resonance. Calculations based on true planetary places (elliptical), not mean tables.

  **3. KNOWN IMPERFECTIONS**
  As the soul is free, effect is not compulsory. Errors in prognosis are not grounds for complaint, but signs of complex resonance. Accuracy not guaranteed, but mathematical purity is warranted.

  **4. PRICE LIST & CONDITIONS**
  The prognostication for the coming year is significantly shorter than the previous. Price remains same or increases slightly. Less text means less surface area for error. Higher precision requires higher cost.
  *New Policy on Personal Presence:* A nativity is cast only if the client appears in person and signs a declaration of consent. This ensures soul-resonance readiness. After signing, refund is impossible. Charts cast in secret are not performed.

  **5. QUESTIONS THE PRINTER HAS BEEN ASKED**
  *Q: Why does the thinner book cost more?*
  A: You pay for what is omitted, not what is printed.
  *Q: Does this apply to the Emperor?*
  A: The Emperor pays double, but aspects apply equally to all.

  ***

  **Historical Note**
  This parody leans heavily on Kepler's *Tertius Interveniens* (1610) and his later *Harmonices Mundi*. The core joke—that he saved astrology by stripping it of falsifiable claims (houses, signs) while keeping the unfalsifiable ones (harmonics, soul resonance)—is historically sound. He did argue astrology was astronomy's "foolish daughter" who kept her mother fed. The "consent/refund" clause is an invented extrapolation based on his theory of soul-resonance; there's no record of him requiring signed waivers, though he did insist on physical presence for certain medical astrological consultations. The price hike for fewer pages is satirical but fits his perpetual financial struggles with the Imperial treasury. I am least sure about the specific timing of the quintile/biquintile public announcement; he developed them around this period but formalized them later.
