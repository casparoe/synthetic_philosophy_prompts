answer: |-
  # DECISION TREE: WHAT FIXES THE EXTENSION OF A TERM?

  **Start:** You accept that competent speakers can apply a word to a new case correctly or incorrectly.

  **Node 1 (Tests Claim 3: Rule Settlement)**
  *Case:* A song is composed entirely by an AI. Before any committee or community decides, is it **already** true or false that this is "music"?
  *   **Yes (Fact exists prior to decision):** Go to Node 2.
  *   **No (Fact depends on decision/practice):** Go to Node 6.

  **Node 2 (Tests Claim 1: Shared Feature/Essence)**
  *Case:* A liquid is indistinguishable from water to a speaker but has chemical composition XYZ. Is it **water**?
  *   **Yes (Internal features suffice):** Go to Node 3.
  *   **No (Underlying nature fixes it):** Go to Node 4.

  **Node 3 (Tests Claim 3: Rule Articulation)**
  *Case:* Can a speaker state a single condition that covers every correct use of "game" without exception?
  *   **Yes:** **LEAF A: Classical Descriptivism.**
  *   **No:** Go to Node 5.

  **Node 4 (Tests Claim 1 vs. Social Authority)**
  *Case:* 18th-century miners call pyrite "gold." Later chemistry shows it is not. Did they refer to **gold** or **pyrite**?
  *   **Gold (Deference to future experts):** **LEAF B: Social Externalism.**
  *   **Pyrite (Deference to physical kind):** **LEAF C: Natural Kind Externalism.**

  **Node 5 (Tests Claim 1: Structure of Concept)**
  *Case:* Do we categorize "bird" by checking a definition or by comparing it to a **best example** (like a robin)?
  *   **Best Example:** **LEAF D: Prototype Theory.**
  *   **Overlapping Similarities:** **LEAF E: Family Resemblance.**
      *(Note: Nodes 2 and 5 are logically independent; one concerns metaphysics, the other cognitive structure.)*

  **Node 6 (Tests Claim 3: Source of Normativity)**
  *Case:* If no fact settles the AI music case, is that because **no fact exists** or because the **question is confused**?
  *   **No fact exists:** Go to Node 7.
  *   **Question is confused:** **LEAF F: Quietism.**

  **Node 7 (Tests Claim 3: Skepticism)**
  *Case:* Is there any fact about your past mental state that makes your answer to "1000 + 2" correct?
  *   **Yes (Practice licenses it):** **LEAF G: Practice-Based Skepticism.**
  *   **No (Nothing settles it):** **LEAF H: Radical Skepticism.**
      *(Note: Nodes 1 and 7 are logically independent; one concerns novelty, the other past meaning.)*

  **Node 8 (Tests Claim 3: Inferential Role)**
  *Case:* If scientists discover birds are not animals, does the **meaning** of "bird" change?
  *   **Yes:** **LEAF I: Inferential Role Semantics.**
  *   **No:** **LEAF J: Individual Essentialism (Unnamed).**
      *(Note: Node 8 is independent of Node 4; one concerns belief revision, the other reference fixing.)*

  ***

  ### THE POSITIONS (LEAVES)

  | Label | Position | Awkward Commitment | Counterintuitive Prediction |
  | :--- | :--- | :--- | :--- |
  | **A** | **Classical Descriptivism** | Speakers are frequently wrong about the conditions governing their own words. | **Expert Error:** Miners meant "gold" only if they could define it; they referred to nothing. |
  | **B** | **Social Externalism** | You mean what your community experts mean, even if you are ignorant of their criteria. | **Expert Error:** Miners referred to gold, not pyrite, despite all evidence available to them. |
  | **C** | **Natural Kind Externalism** | Chemical composition determines reference, regardless of speaker intuition. | **Twin Earth:** XYZ is not water, even if no speaker can tell the difference. |
  | **D** | **Prototype Theory** | Membership comes in degrees; some instances are "more" members than others. | **Expert Error:** Pyrite is "more gold" than a metal that looks less like gold but is chemically identical. |
  | **E** | **Family Resemblance** | No single feature is necessary for membership in the category. | **Novel Practice:** AI music is music only if it shares enough strands with past music, with no hard boundary. |
  | **F** | **Quietism** | Philosophy cannot explain the correctness of rules without distorting the practice. | **Novel Practice:** Asking if AI music is *really* music before we decide is a pseudo-problem. |
  | **G** | **Practice-Based Skepticism** | Correctness is not a matter of truth, but of what the community licenses. | **Novel Practice:** Calling AI music "music" is not true, but it is permissible if accepted. |
  | **H** | **Radical Skepticism** | No fact about the speaker settles what they meant by any word. | **Novel Practice:** There is no fact that you meant "music" rather than "schmusic" in the past. |
  | **I** | **Inferential Role** | Meaning is constituted by the web of beliefs; changing beliefs changes meaning. | **Expert Error:** When we learned whales aren't fish, the word "fish" changed its meaning. |
  | **J** | **Individual Essentialism** | A single speaker can fix an essence without community or physical access. | **Twin Earth:** If you alone encountered XYZ, you could mean H2O without knowing chemistry. |

  ***

  ### NOTES FOR DISCUSSION

  **1. Indistinguishable Leaves**
  *   **Family Resemblance (E) vs. Prototype (D):** Both deny necessary and sufficient conditions. To pry them apart, ask: *Is the "best example" a psychological fact about humans (Prototype) or a logical fact about the concept (Resemblance)?* If the latter, they collapse.
  *   **Quietism (F) vs. Practice-Based Skepticism (G):** Both deny robust truth-conditions. To pry them apart, ask: *Is the demand for explanation a mistake (Quietism) or a request that must be answered negatively (Skepticism)?*

  **2. Undefended Combinations**
  *   **Radical Skepticism (H) + Classical Descriptivism (A):** *Incoherent.* One denies facts settle meaning; the other claims stated conditions settle it.
  *   **Natural Kind Externalism (C) + Classical Descriptivism (A):** *Unattractive.* Claims essence fixes reference but speakers must be able to state that essence.
  *   **Quietism (F) + Inferential Role (I):** *Unexplored.* Quietists usually reject substantive theories of role; Inferentialists treat role as a substantive theory.

  **3. Where Vagueness Attaches**
  *   **Attachment:** The debate about vagueness (Claim 2: *boundary is not sharp*) attaches to **every leaf** as a secondary parameter (e.g., an Epistemicist Classical Descriptivist vs. a Supervaluationist Classical Descriptivist).
  *   **Reason for Exclusion:** Vagueness concerns the *precision* of boundaries, whereas this tree concerns the *source* of correctness; one can hold any position on this tree while accepting or rejecting sharp boundaries.
