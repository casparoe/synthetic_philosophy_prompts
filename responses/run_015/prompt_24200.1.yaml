answer: |-
  # DECISION PROCEDURE: INFORMATION-ENGINE THERMODYNAMIC VALIDITY (IETV-1)

  **WARNING TO EXAMINER:** This procedure is a heuristic for identifying *prima facie* inoperability based on the Second Law of Thermodynamics (2LT). It is not a proof of operability. A "Pass" through this procedure does not guarantee the device works; it only indicates the claim does not *obviously* violate established thermodynamic accounting. A "Fail" indicates the claim is physically impossible as written.

  **CONSTANT: THE LANDAUER BOUND**
  In any physical system where information is processed, the erasure of one bit of information at temperature $T$ dissipates at least $Q_{min} = k_B T \ln 2$ of heat into the environment.
  *   $k_B$: Boltzmann constant.
  *   $T$: Temperature of the reservoir into which heat is dissipated.
  *   **Rule:** If the application describes a cyclic process that resets a memory bit, you must account for this heat cost in the energy balance.

  **PART I: THE LEDGER (Mandatory Completion)**
  *Before asking questions, extract and record the following from the specification. If a field cannot be filled from the text, mark it "UNSPECIFIED."*

  1.  **System:** (What physical substance performs the work? e.g., gas, electron, spin).
  2.  **Controller/Demon:** (What measures and actuates? e.g., sensor, gate, field).
  3.  **Memory:**
      *   Capacity: (Finite/Infinite/Unspecified).
      *   Reset Mechanism: (Explicitly erased / Overwritten / Never reset / Unspecified).
      *   Erasure Location: (Where does the entropy go? e.g., heat bath, environment).
  4.  **Heat Baths:**
      *   Count: (Number of distinct thermal reservoirs).
      *   Temperatures: ($T_1, T_2...$).
      *   Equilibrium Status: (Are they described as thermal equilibrium reservoirs?).
  5.  **Operation:**
      *   Cycle Type: (Cyclic / One-shot / Continuous flow).
      *   Control Loop: (Open-loop / Feedback-controlled).
  6.  **Claimed Output:**
      *   Work/Heat Flow: (Magnitude and direction).
      *   2LT Statement Addressed: (Does applicant claim to violate Clausius, Kelvin-Planck, or Total Entropy?).

  **CRITICAL DISTINCTIONS (Do Not Drop)**
  *   **Memory State:** Classical thermodynamics ignores information. This procedure *must* track memory. Dropping this makes the procedure misfire on Szilard engines by ignoring the erasure cost.
  *   **Correlations:** Standard stat mech assumes independent particles. This procedure *must* track pre-existing correlations. Dropping this makes the procedure misfire on "correlation fuel" devices by treating them as perpetual motion.
  *   **Cyclicity:** The Kelvin-Planck statement applies to *cycles*. Dropping this makes the procedure misfire on one-shot batteries (which are allowed to convert heat to work if entropy increases elsewhere).

  ---

  **PART II: THE QUESTION SEQUENCE**

  **Q1: Is the operation strictly cyclic?**
  *   *Definition:* The system, controller, and memory return to their exact initial microstates at the end of the process.
  *   **If NO:** Go to **Q2**.
  *   **If YES:** Go to **Q3**.
  *   **If UNSPECIFIED:** Assume **NO** (benefit of doubt to applicant), but flag for Enablement review.

  **Q2: (Non-Cyclic Branch) Is there a consumable resource explicitly depleted?**
  *   *Check Ledger:* Does the system consume a fuel, discharge a battery, or degrade a pre-existing correlation (mutual information) without restoration?
  *   **If YES:** **TERMINAL B (REFERRAL).** The device is thermodynamically analogous to a battery. The 2LT is not violated, but the *source* of the resource (e.g., how the correlation was created) is outside the claimed system. You cannot judge total efficiency without the source. Refer to specialist panel to determine if the *preparation* of the resource is enabled or if the claim is indefinite.
  *   **If NO:** Go to **Q3**. (A non-cyclic device with no consumable resource is a violation).

  **Q3: (Cyclic or "No Resource" Branch) How many heat baths interact with the system?**
  *   **If One (Single Temperature):** Go to **Q4**.
  *   **If Two or More:** **TERMINAL B (REFERRAL).** This is a heat engine. It is not a 2LT violation *per se*. However, you must refer to a specialist to verify if the claimed efficiency exceeds the Carnot limit ($\eta = 1 - T_c/T_h$). Classical examination cannot verify nanoscale heat transfer coefficients.
  *   **If Zero (Adiabatic):** Go to **Q4**.

  **Q4: Is there a memory reset or information erasure in the cycle?**
  *   *Check Ledger:* Look at "Memory Reset Mechanism."
  *   **If YES:** Go to **Q5**.
  *   **If NO:** Go to **Q6**.

  **Q5: (Erasure Branch) Is the Landauer heat cost ($k_B T \ln 2$ per bit) accounted for in the energy balance?**
  *   *Check Ledger:* Compare Claimed Output vs. Heat Dissipation.
  *   **If YES (Cost Included):** Go to **Q6**. (The applicant acknowledges the cost. The net work might be zero or negative, which is physical).
  *   **If NO (Cost Ignored):** **TERMINAL A (REJECT).** The claim describes an impossible device. The applicant claims net work from a single bath while ignoring the mandatory thermodynamic cost of resetting the controller. This is a violation of the Total Entropy form of the 2LT.
  *   **If UNSPECIFIED:** **TERMINAL A (REJECT).** Lack of enablement regarding the erasure mechanism renders the device inoperative.

  **Q6: (Final Balance Branch) Does the claimed net work output exceed the free energy difference plus the information term?**
  *   *Calculation:* $W_{out} \le -\Delta F + k_B T I_{mutual}$.
  *   *Note:* For a cyclic engine with single bath and no external correlation, $-\Delta F = 0$ and $I_{mutual} = 0$ (unless consumed). Thus $W_{out} \le 0$.
  *   **If Claim says $W_{out} > 0$:** **TERMINAL A (REJECT).** Genuine 2LT violation.
  *   **If Claim says $W_{out} \le 0$:** **TERMINAL B (REFERRAL).** The device is thermodynamically allowed (it consumes work or does nothing). The question is now one of utility or specific implementation, not fundamental physics. Refer to art unit for standard novelty/non-obviousness examination.

  ---

  **PART III: LIMITATIONS AND HONESTY CLAUSES**

  **Where This Procedure Misfires:**
  1.  **Non-Equilibrium Reservoirs:** If the "Heat Bath" is actually a driven, non-equilibrium system (e.g., active matter, chemical gradient not tracked as a bath), the temperature $T$ is undefined. The Landauer bound may not apply in the standard form. **Action:** If "Equilibrium Status" in Ledger is "Driven" or "Unknown," you must **REFER**. Do not apply Q5.
  2.  **Quantum Resources:** If the device relies on entanglement, coherence, or measurement back-action, the classical ledger (System/Memory/Bath) is insufficient. Quantum mutual information behaves differently. **Action:** If "Quantum" is mentioned in the Ledger, **REFER** to a specialist panel. Do not attempt to apply the Landauer bound yourself.
  3.  **Infinite Memory:** If the applicant claims "Finite memory that never erases" but operates "Indefinitely," this is a logical contradiction (Pigeonhole Principle). **Action:** Treat as **TERMINAL A (REJECT)** for inoperability, not just 2LT.
  4.  **Judgment Calls:** Determining if a correlation is "pre-existing" or "generated for free" is often a matter of textual interpretation. If the spec is vague on *how* the correlation arises, you must **REFER** for indefiniteness (35 U.S.C. § 112) rather than rejecting on 2LT grounds.

