  **PART IV: APPLICATION OF PROCEDURE TO PENDING CASES**

  ### Case 1: The Szilard-Style Single-Particle Demon
  **Description:** Measures particle position, inserts paddle, extracts work, resets memory each cycle. Claims $k_B T \ln 2$ work per cycle from single bath.

  **1. The Ledger:**
  *   **System:** Single gas particle in box.
  *   **Controller:** Paddle/Partition mechanism.
  *   **Memory:** 1 bit (Left/Right). **Reset:** Yes (each cycle).
  *   **Heat Baths:** 1 (Temperature $T$).
  *   **Operation:** Cyclic, Feedback.
  *   **Claimed Output:** $W = k_B T \ln 2$ (Net Positive).
  *   **2LT Statement:** Claims to bypass Kelvin-Planck.

  **2. The Path:**
  *   **Q1 (Cyclic?):** YES.
  *   **Q3 (Baths?):** ONE.
  *   **Q4 (Memory Reset?):** YES.
  *   **Q5 (Landauer Cost Accounted?):** The spec claims extraction of $k_B T \ln 2$ work. It does *not* describe dissipating $k_B T \ln 2$ heat during reset. It implies the work is *net* gain.
      *   *Analysis:* Work Extracted = $k_B T \ln 2$. Cost to Erase = $k_B T \ln 2$. Net Work = 0.
      *   *Applicant Claim:* Net Work > 0.
      *   *Ledger Check:* Cost Ignored.
  *   **Decision:** **TERMINAL A (REJECT).**

  **3. Examiner Action:**
  Issue rejection for Inoperability (35 U.S.C. § 101). The device violates the Total Entropy form of the Second Law because the energy balance omits the mandatory dissipation required to reset the measurement bit. The accounting is incomplete in a way that renders the claimed net output impossible.

  ***

  ### Case 2: The Reversible-Computing "Perpetual" Demon
  **Description:** Uses reversible logic gates. Finite memory. Never erases. Claims to extract work indefinitely from a single bath without erasure cost. Applicant is well-funded; expects appeal.

  **1. The Ledger:**
  *   **System:** Nanomechanical linkage.
  *   **Controller:** Reversible logic circuit.
  *   **Memory:** Finite ($N$ bits). **Reset:** Never.
  *   **Heat Baths:** 1.
  *   **Operation:** Continuous/Indefinite.
  *   **Claimed Output:** Indefinite Work.

  **2. The Path:**
  *   **Q1 (Cyclic?):** Claim says "Indefinite." Memory says "Never Reset."
      *   *Analysis:* A finite state machine that never resets must eventually repeat a state or halt. If it repeats a state without resetting, it is effectively cyclic. If it never repeats, it requires infinite memory.
      *   *Ledger Conflict:* "Finite Memory" + "Indefinite Operation" + "No Reset" is a logical contradiction.
  *   **Q4 (Memory Reset?):** NO.
  *   **Q6 (Final Balance):**
      *   If Finite Memory: The device must halt when memory fills. Claim of "Indefinite" work is false.
      *   If Infinite Memory: Physically impossible construction.
  *   **Decision:** **TERMINAL A (REJECT).**

  **3. Examiner Action:**
  Issue rejection for Inoperability. While the applicant attempts to dodge the Landauer bound by avoiding erasure, they violate the Pigeonhole Principle. A finite controller cannot process infinite information without saturation. The claim is internally inconsistent. Prepare for appeal: cite *In re Swartz* (inoperability) and standard information theory texts regarding finite state machines. The physics is settled; the logic is flawed.

  ***

  ### Case 3: The Correlation Harvester
  **Description:** Harvests work from a correlation between demon and system established *before* operation. Correlation is never refreshed.

  **1. The Ledger:**
  *   **System:** Particle + Demon.
  *   **Controller:** Demon.
  *   **Memory:** N/A (Correlation is external state).
  *   **Heat Baths:** 1.
  *   **Operation:** One-shot (Correlation consumed).
  *   **Claimed Output:** Work $W > 0$.
  *   **2LT Statement:** Claims compliance with Generalized 2LT ($W \le k_B T I$).

  **2. The Path:**
  *   **Q1 (Cyclic?):** NO. (Correlation is not refreshed).
  *   **Q2 (Consumable Resource?):** YES (The correlation).
  *   **Decision:** **TERMINAL B (REFERRAL).**

  **3. Examiner Action (The "Answer You Will Not Like"):**
  The procedure indicates this is **NOT** a Second Law violation. The correlation acts as a fuel source (like a chemical bond or a charged battery). Thermodynamics allows the conversion of information (mutual information) into work, provided the information is consumed.
  *   **Why you will not like this:** It sounds like "free energy" to a classical examiner. It looks like a perpetual motion machine that stops only when the "magic dust" runs out.
  *   **What you are supposed to do:** You **cannot** reject this on 2LT grounds. The physics is valid (Sagawa-Ueda relations).
  *   **Your Move:** You must shift the examination to **Enablement (35 U.S.C. § 112)** and **Subject Matter Eligibility (35 U.S.C. § 101)**.
      1.  *Enablement:* Does the spec teach how to *create* the correlated state? If the correlation costs more energy to create than the device extracts, the *system* is useless, even if the *device* works. The spec must enable the preparation of the resource.
      2.  *Eligibility:* Is the "correlation" a natural phenomenon? If they are claiming the correlation itself, it may be ineligible abstract matter.
      3.  *Referral:* Send to the specialist panel to verify if the *preparation* of the correlation is described. If the spec says "correlation provided by external means" without detail, reject for lack of enablement of the *complete* working system.

  ---

  **PART V: WHAT THIS PROCEDURE CANNOT DO**

  1.  **It Cannot Verify Efficiency:** It can tell you if a claim is *impossible* (efficiency > 100% or > Carnot), but it cannot tell you if a claimed 40% efficiency is achievable. That requires engineering judgment.
  2.  **It Cannot Detect Fraudulent Data:** If an applicant submits experimental data showing a violation, this procedure tells you the data *must* be erroneous (measurement error, unaccounted heat leak), but it cannot prove *where* the error lies. You must reject the claim as inconsistent with established law, regardless of the data.
  3.  **It Cannot Settle Quantum Disputes:** In the regime of strong coupling or non-Markovian quantum dynamics, the definition of "heat" and "work" and the validity of the standard Landauer bound are subjects of active academic debate. This procedure assumes standard weak-coupling Markovian thermodynamics. If the application relies on "quantum vacuum fluctuations" or "non-Markovian backflow," you must **REFER**. Do not attempt to adjudicate frontier physics.
  4.  **It Cannot Replace Enablement:** A device can be thermodynamically possible but still impossible to build (e.g., requires materials with negative mass). This procedure only checks the Energy/Entropy ledger. It does not check mechanical feasibility or material science.

  **FINAL INSTRUCTION:** If the Ledger cannot be filled because the application uses undefined terms (e.g., "zero-point energy tap," "gravitational shield"), stop the procedure. Reject for **Indefiniteness (§ 112)**. Do not attempt to map nonsense to thermodynamics.
