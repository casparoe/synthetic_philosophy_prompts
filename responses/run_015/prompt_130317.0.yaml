answer: |-
  This is a profound observation about the architectural incoherence of modern liberal democracy. You have identified a "hybrid regime" that mixes aristocratic (election), democratic (sortition), and bureaucratic (career civil service) elements without a unified theory of why each is assigned to its specific domain.

  Here is a reconstruction of the implicit theory, an analysis of its consistency problems, and a look at how alternative commitments would reshape institutions.

  ### I. Reconstructing the Implicit Theory

  The current patchwork rests on three distinct philosophical commitments regarding **Competence**, **Legitimacy**, and **Time**.

  **1. Competence: *Techne* vs. *Phronesis***
  The system presupposes a split between two types of knowledge.
  *   **Lawmaking is *Techne* (Craft/Strategy):** It assumes governing requires accumulated knowledge of procedure, coalition-building, and policy complexity. This is why we tolerate career politicians; we assume competence compounds. However, because this craft involves access to power, it is corruptible. Hence, **term limits** are a hygiene measure to prevent the *craft* from becoming *self-preservation*.
  *   **Judging is *Phronesis* (Practical Wisdom):** It assumes moral judgment is distributed evenly across the population (the "common sense" of the community). You do not need to study law to know right from wrong; you need to be a peer. This is why **juries** are random.
  *   **The Assembly Gap:** Citizens' assemblies are treated as having *Phronesis* but not *Techne*. They can identify values (e.g., "we care about the climate"), but they lack the *Techne* to implement it, which is why they write reports rather than statutes and then vanish.

  **2. Legitimacy: Authorization vs. Description**
  *   **Elections confer a Mandate (Authorization):** Legitimacy comes from consent. The politician represents your *will*. Because they claim to speak for you, they must be periodically re-authorized. If they stay too long, the link between will and representative degrades (hence term limits or elections).
  *   **Sortition confers a Mirror (Description):** Legitimacy comes from statistical representation. The juror or assembly member represents your *identity*. They do not need re-authorization because they are not claiming a mandate; they are claiming to *be* you. They don't need term limits because their legitimacy expires the moment the specific case or question is resolved.

  **3. Time: Retrospective vs. Prospective**
  *   **Juries are Retrospective:** They judge a past act against existing norms. This is cognitively easier and requires less systemic knowledge.
  *   **Legislatures are Prospective:** They allocate future resources and create new norms. This requires predicting complex systemic outcomes.
  *   **The Implicit Bet:** We trust random people to agree on the past (did he do it? was it wrong?) but not to negotiate the future (how much should we tax? who gets what?).

  ### II. Is This Philosophically Underdetermined?

  Yes. The current split is not logically necessary; it is historically accreted. Several rival theories could license the same institutions, or different institutions entirely.

  **Rival View A: The Epistemic Argument**
  One could argue that elections are actually a *filter for competence*, not just consent. If you believe voters are good at identifying wise leaders, then career politicians are good *if* they remain responsive. Term limits here are not about preventing careerism but about preventing cognitive stagnation.
  *   *Underdetermination:* This view struggles to explain why we trust random jurors (no filter) with higher stakes (liberty) than we trust voters (the filter) with budget allocations.

  **Rival View B: The Republican Liberty Argument**
  One could argue the split is about **domination**.
  *   Juries check the state's power over the individual (protecting liberty).
  *   Legislatures wield the state's power over the individual (exercising will).
  *   *Underdetermination:* If the goal is non-domination, why do we fear the domination of a career legislator more than the domination of a career bureaucrat? (See below).

  **Rival View C: The Division of Labor Argument**
  It is possible the split isn't about competence at all, but about **conflict resolution**.
  *   Juries resolve *factual/normative* disputes (Guilty/Not Guilty).
  *   Legislatures resolve *interest* disputes (Who gets the money?).
  *   *Theory:* Random people can agree on norms (murder is bad); they cannot agree on interests (my town needs the bridge more than yours). Therefore, lawmaking requires negotiation (elections/coalitions), while judging requires consensus (deliberation).

  ### III. The Hidden Consistency Problems

  You identified two major fractures in the logic. When spelled out, the underlying view of human reasoning looks shaky.

  **1. The Careerist Paradox (Politicians vs. Civil Servants)**
  *   **The Contradiction:** We impose term limits on elected officials to prevent "careerism" and capture, yet the state is run by career civil servants who have lifetime tenure, no electoral oversight, and immense discretion.
  *   **The Underlying View:** This relies on a Weberian distinction between **Politics (Values)** and **Administration (Facts)**.
      *   We assume elected officials deal in *values* (which are corruptible and partisan), so they must rotate.
      *   We assume bureaucrats deal in *facts/implementation* (which are neutral and technical), so they should stay for expertise.
  *   **Does it hold up?** Poorly. Modern administration is deeply value-laden (regulatory capture, discretion in enforcement). By insulating bureaucrats from rotation while limiting politicians, we may have created a class of unaccountable decision-makers who possess the *Techne* the system claims to value, without the *Mandate* the system claims to require.

  **2. The Stakes Paradox (Verdicts vs. Budgets)**
  *   **The Contradiction:** We trust a random jury to deprive a citizen of liberty or life (the highest stake), but we do not trust a random assembly to allocate a budget (a lower stake).
  *   **The Underlying View:** This assumes **Moral Reasoning is Universal, but Resource Allocation is Strategic.**
      *   Judging a crime is seen as applying a universal moral law (Kantian). Any rational person can do this.
      *   Allocating a budget is seen as a zero-sum game of competing interests (Hobbesian). This requires negotiation, horse-trading, and long-term strategy.
  *   **Does it hold up?** Debatable. Juries often negotiate (hung juries, plea bargain pressure). Legislators often vote on moral principles (abortion, war). The distinction between "applying norms" and "allocating resources" is blurrier than the system admits. If random citizens can handle the moral weight of incarceration, why can they not handle the moral weight of taxation?

  ### IV. Systems Built on Opposite Commitments

  If we invert the assumptions, the institutions change radically.

  **System A: The Professionalized Sortition (Inverting Competence)**
  *   **Commitment:** Lawmaking competence is *not* accumulated through elections but through *deliberative training*. Moral judgment is not innate; it must be cultivated.
  *   **Institutions:**
      *   **Lifelong Sortition:** Citizens are selected by lot at age 30 for a 20-year term.
      *   **Mandatory Training:** The first 5 years are dedicated to studying economics, law, and ethics (paid by the state).
      *   **No Elections:** Elections are abolished as "populist noise."
      *   **Recall:** Instead of term limits, citizens can recall legislators for negligence, not policy disagreement.
  *   **Result:** A "Guardian" class that is descriptively representative but professionally competent. It solves the careerism problem (you can't campaign) but risks creating a deliberative elite detached from immediate public sentiment.

  **System B: The Pure Mandate (Inverting Legitimacy)**
  *   **Commitment:** Legitimacy comes *only* from explicit consent. Statistical representation is insufficient. Competence is secondary to authorization.
  *   **Institutions:**
      *   **No Sortition:** Juries are abolished; judges (elected or appointed) decide facts and law.
      *   **No Term Limits:** Legislators serve indefinitely as long as they win elections.
      *   **Strict Recall:** Any percentage of constituents (e.g., 10%) can trigger an immediate re-election vote at any time.
      *   **Civil Servant Electedization:** Department heads are elected, not appointed.
  *   **Result:** Hyper-accountability. It solves the "unelected bureaucrat" problem but creates extreme instability and short-termism. Politicians become pure delegates, unable to make unpopular but necessary long-term decisions.

  **System C: The Deliberative Bicameralism (The Synthesis)**
  *   **Commitment:** Both *Will* (Election) and *Reason* (Sortition) are required for legitimacy.
  *   **Institutions:**
      *   **Lower House (Elected):** Handles budgeting, interests, and "politics." Subject to term limits.
      *   **Upper House (Sortition):** Selected by lot for 10-year terms. Handles constitutional review, ethical standards, and long-term planning (climate, infrastructure).
      *   **Binding Power:** The Sortition House can veto the Elected House on long-term issues but cannot initiate spending.
  *   **Result:** This acknowledges that random people *are* competent for long-term governance *if* insulated from re-election pressures. It treats the "careerism" of politicians as a feature for the Lower House (negotiation) and the "freshness" of sortition as a feature for the Upper House (oversight).

  ### V. Conclusion: The View of Human Reasoning

  The underlying view of human reasoning in our current patchwork is **Dualistic**.

  We act as though humans possess two modes:
  1.  **The Citizen-Judge:** Capable of high-fidelity moral reasoning, impartiality, and truth-seeking when the task is specific and retrospective (Jury).
  2.  **The Citizen-Voter:** Capable only of selecting agents, prone to bias, and incapable of direct governance when the task is abstract and prospective (Legislature).

  **The Flaw:** This dualism is likely false. The same cognitive biases that affect a legislator (tribalism, short-termism, susceptibility to rhetoric) affect a juror. The same capacity for reason that allows a civil servant to manage a budget allows a citizen to understand one.

  The current system persists not because it is philosophically coherent, but because it balances **conflicting fears**:
  *   Fear of the **Mob** (so we limit direct democracy).
  *   Fear of the **Tyrant** (so we limit career politicians).
  *   Fear of the **State** (so we keep juries random).

  We accept the incoherence because a coherent system would require us to trust human reasoning *either* too much (full sortition) *or* too little (full technocracy). The patchwork is a hedge against our own uncertainty about whether we are capable of ruling ourselves.
