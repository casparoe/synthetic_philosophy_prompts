  **Research Agenda Recommendation: Prioritizing Operational Reality Over Theoretical Assumptions**

  **Executive Summary**
  To fundamentally reshape the debate on conditionality and the "undeserving poor," this group must move beyond the standard economic evaluation of labor incentives and abstract philosophical debates about desert. The critical bottleneck in welfare policy is not whether workfare *works* to increase employment, but whether the state *can* accurately distinguish the "unwilling" from the "unable" without inflicting unacceptable harm on the latter.

  Therefore, the bulk of the three-year funding should be allocated to **Line 3 (Institutional Design of Verification)** and **Line 4 (Conceptual Stability of the "Undeserving")**. Lines 1 and 2 should be deprioritized. While I acknowledge the option to propose an upstream question, I argue that Line 3 effectively operationalizes the critical upstream dependency—the epistemic limits of the state—making it the most high-leverage empirical intervention available within the provided list.

  ### **Priority 1: Line 3 (Institutional Design of Verification and Anti-Fraud Systems)**
  **Allocation:** 60% of Resources

  **Rationale:**
  This line of work scores highest on **tractability** and **normative urgency**. Unlike normative philosophy (Line 2), verification systems generate audit trails, denial rates, and appeal data that can be empirically modeled within a three-year window. Unlike labor supply studies (Line 1), this addresses the *gateway* to welfare: if eligible claimants are incorrectly classified as "undeserving" due to bureaucratic friction or false-positive fraud flags, their subsequent labor supply behavior is irrelevant to the justice of the system.

  **Dependency:**
  Line 3 is a prerequisite for Line 1 and Line 2. If the error rate in moral classification is high (e.g., if 30% of those sanctioned for "non-compliance" actually had valid caregiving obligations), then empirical estimates of labor-supply responses (Line 1) are contaminated by coercion of the vulnerable, and normative arguments for reciprocity (Line 2) collapse because the "reciprocity" is being demanded from those incapable of fulfilling it.

  **Neglectedness:**
  Current literature and policy audits are overwhelmingly optimized for fiscal control. Governments publish "fraud savings" but rarely publish "exclusion costs" (the value of benefits denied to eligible claimants due to administrative burden or error). This asymmetry creates a distorted evidence base that this group is uniquely positioned to correct.

  **Specific Design Principle & Normative Implication:**
  If this question is answered conclusively—specifically, if we quantify the ratio of false positives (denied eligible) to false negatives (paid ineligible)—the guiding design principle of welfare administration must shift from **"Fraud Minimization"** to **"Error Symmetry."**

  Currently, systems are designed to minimize false negatives (paying the ineligible) because fraud is politically visible, while false positives (denying the eligible) are administratively invisible. A conclusive finding that false positives exceed false negatives in moral cost would mandate a redesign where the burden of proof shifts back to the state, and verification friction is treated as a rights violation rather than a fiscal safeguard.

  **Overrated Implications:**
  This research would expose that the commonly cited implication of welfare reform—**"Tightening eligibility generates net fiscal savings"**—is often false. When the administrative costs of verification, the cost of appeals, and the downstream social costs of erroneous denial (e.g., emergency housing, health crises) are factored in, strict conditionality often operates at a net loss. The fiscal responsibility argument for workfare is frequently overrated because it ignores the cost of the errors required to enforce it.

  ### **Priority 2: Line 4 (Conceptual Stability of the "Undeserving Poor")**
  **Allocation:** 30% of Resources

  **Rationale:**
  This line addresses the **dependency** of the entire policy framework. If the category of the "undeserving poor" is not a stable moral distinction but a fluid boundary mechanism that expands during fiscal contractions and contracts during labor shortages, then policy based on this category is inherently unstable and politically manipulated rather than morally grounded.

  **Tractability:**
  While more qualitative than Line 3, this is highly tractable for a policy research group through comparative historical analysis and policy tracing. By mapping changes in eligibility criteria against macroeconomic indicators and political rhetoric over time, the group can demonstrate whether "deservingness" tracks actual need/behavior or simply fiscal pressure.

  **Normative Urgency:**
  This work destigmatizes claimants by revealing the arbitrariness of the classification. It provides the narrative ammunition needed to challenge the moral legitimacy of conditionality, complementing the empirical data from Line 3.

  ### **Deprioritized Lines**

  **Line 1 (Labor-Supply Responses):**
  *Status:* **Deprioritized.**
  *Reasoning:* This is the most saturated area of research in welfare economics. More critically, it suffers from a **dependency flaw**. Measuring labor-supply responses assumes the classification of claimants is accurate. If Line 3 reveals that conditionality forces people with unobserved disabilities into job searches (a false positive in moral classification), then a "positive" labor-supply response is not a policy success but a measure of coercion. Furthermore, labor supply elasticities are typically small; even if settled, they do not justify the institutional costs if the moral classification is broken.

  **Line 2 (Normative Coherence of Reciprocity):**
  *Status:* **Deprioritized.**
  *Reasoning:* While philosophically vital, this is low **tractability** for a three-year policy group. Normative coherence is rarely "settled conclusively" through research; it is argued through theory. A policy research group is better served producing the empirical evidence (Line 3) and sociological data (Line 4) that *forces* the normative debate to change, rather than engaging in the philosophical debate directly. Line 4 effectively covers the sociological reality of this normative failure without getting bogged down in abstract ethics.

  ### **Upstream Dependency Note**
  While I have selected Line 3 as the top priority from the list, I note that it serves as the empirical proxy for a critical upstream question not explicitly listed: **"The Epistemic Capacity of the State."** The fundamental unresolved problem is whether a bureaucracy *can ever* possess the granular knowledge required to distinguish 'unwilling' from 'unable' at scale. Line 3 is prioritized because it is the only line of work that measures the *failure rate* of this epistemic capacity. By quantifying the error rates in Line 3, the group effectively answers the upstream epistemic question without needing to engage in abstract theory.

  ### **Conclusion**
  By prioritizing **Verification Design (Line 3)** and **Conceptual Stability (Line 4)**, the group moves the debate from "Do benefits reduce work?" to "Can we justly administer the conditions we impose?" This shifts the burden of proof onto the architects of conditionality to demonstrate that their systems do not systematically punish the eligible in the name of catching the ineligible. This is the only path to reshaping the "undeserving poor" from a moral category into a recognized administrative error rate.
