answer: |-
  The impasse regarding virtual harm is best diagnosed not as a substantive metaphysical disagreement, nor merely as a verbal dispute, but as a **category error wherein ontological questions are conflated with ethical ones**. The two camps are answering different questions under the single heading of 'reality'.

  The sceptical camp (requiring embodiment) is asking an **ontological grounding question**: 'What is the substrate of this event?' Their criterion for 'real' is mind-independent physical existence. The virtualist camp (prioritising suffering) is asking a **normative salience question**: 'Does this event generate moral duties?' Their criterion for 'real' is phenomenological impact or functional consequence. Because both sides utilise the predicate 'is real' to answer their respective questions, they talk past one another. The sceptic says, 'It is not real (ontologically), therefore it matters less.' The virtualist says, 'It is real (normatively), therefore the substrate is irrelevant.'

  ### The Hidden Assumption: Somatic Privilege

  The structural engine of this stalemate is a hidden assumption held primarily by the sceptical camp, which I shall term **Somatic Privilege**. This is the presupposition that moral status and the capacity to be harmed must be causally coupled to biological tissue *at the locus of the injury*.

  Neither side argues for this directly; it is treated as axiomatic. The sceptics assume that for harm to be genuine, there must be a direct cascade of physical force or neurochemical disruption occurring simultaneously with the act. The virtualists often accept the terms of the debate but argue that the neurochemical disruption *does* occur (via stress responses), thereby conceding the ground of Somatic Privilege rather than challenging it. By accepting that biological coupling is the gold standard, the virtualists inadvertently validate the sceptic's ontology, merely arguing over the length of the causal chain.

  ### Moving the Debate: A Conceptual Distinction

  To dissolve the impasse, we must decouple **Ontological Instantiation** from **Normative Reality**. We should adopt a distinction drawn from the philosophy of mind and extended cognition: **Constitutive Harm versus Causal Harm**.

  *   **Causal Harm:** The virtual event is merely a trigger that causes a separate, physical harm (e.g., a VR scare causes a heart attack). Here, the virtual object is instrumental.
  *   **Constitutive Harm:** The virtual event is part of the cognitive or social system that constitutes the person's identity and well-being. Harm to the virtual asset *is* harm to the person, not because it causes physical pain, but because the virtual space is functionally part of the 'self'.

  If we accept the **Extended Mind Thesis**—that cognitive processes and social identities can extend beyond the skull into the environment—then damaging a virtual object that is integral to a user's cognitive or social functioning is constitutively harmful, regardless of biological coupling.

  ### The Thought Experiment: The 'Integrated Livelihood' Case

  To test this and move the debate, consider the following thought experiment, designed to isolate the variable of biological coupling:

  > **The Scenario:** Imagine two individuals, Alice and Bob.
  >
  > **Alice** works in a physical office. A colleague physically destroys her filing cabinet, shredding unique, irreplaceable records of her life's work. She suffers no physical touch, but her career is ruined, and she suffers severe depression.
  >
  > **Bob** works in a fully immersive virtual economy that is legally and economically integrated with the physical world (his income, social standing, and professional portfolio exist solely as code). A colleague deletes his virtual workspace and assets. The code is erased. Bob suffers the exact same career ruin and depression as Alice. However, Bob's biological tissue was never threatened, and no physical property was touched.
  >
  > **The Question:** If we agree Alice was genuinely harmed, on what consistent basis can we claim Bob was not?

  If the sceptic argues Bob was not harmed, they must defend the claim that physical paper possesses moral weight that functionally identical digital records do not, which invites charges of fetishism. If they concede Bob was harmed, they must abandon the requirement for indexical physical presence and admit that 'reality' in harm is defined by **functional integration** rather than **material substrate**.

  This shifts the debate from 'Is it real?' to 'How integrated is the virtual object into the subject's life-world?' This is a measurable, substantive question that avoids the metaphysical stall.
