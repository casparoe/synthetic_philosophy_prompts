      *   **The Impartial Observer Argument (Ethics):** To determine the weights ($a_i$) and establish interpersonal comparability, use the "Impartial Observer" behind a veil of ignorance (equiprobability assumption). This leads to average utilitarianism ($W = \frac{1}{n} \sum U_i$).
      *   **Extended Preferences:** To make $U_i$ comparable, we assume preferences over "being person $i$ in state $x$" vs "being person $j$ in state $y$".

