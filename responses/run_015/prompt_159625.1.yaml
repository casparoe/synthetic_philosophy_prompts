  Oscar and Twin Oscar are intrinsic duplicates residing on Earth and Twin Earth respectively. Their planets differ solely in that Earth's lakes contain H2O whilst Twin Earth's contain XYZ. Crucially, both communities participate in a shared division of linguistic labour, deferring genuinely to a single off-planet scientific institution, the Galactic Bureau of Standards. Ordinary speakers possess only an incomplete grasp of 'water', relying entirely on the Bureau's textbooks which explicitly define water as H2O, despite the Bureau being mistaken about the liquid filling Twin Earth's lakes.

  Environmental externalism holds that reference is determined by the physical nature of the stuff causally regulating usage in the speaker's vicinity. Consequently, Oscar's 'water' refers to H2O, but Twin Oscar's refers to XYZ, as their local causal chains diverge. Deferential externalism holds that content is determined by the normative standards of the experts to whom the speaker implicitly defers. Consequently, both twins' 'water' refers to H2O, as they defer to the same authoritative body specifying H2O.

  The feature doing the work is the *divergence between local environment and authoritative expert definition*. If you remove this by ensuring experts are local and correct about their respective liquids, the two theories collapse back together: both would assign H2O to Oscar and XYZ to Twin Oscar. In this constructed case, the environmentalist comes out worse regarding the standard Twin Earth intuition that referents must differ. They would attack the case by denying the coherence of the deference: genuine linguistic labour requires experts to be embedded in the local causal network, so the off-planet Bureau cannot fix content for Twin Earthians interacting with XYZ. Thus, they reject the Burgean verdict as metaphysically impossible given the causal theory of reference.
