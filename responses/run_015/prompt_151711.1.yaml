answer: |-
  Here is the specification for a decision-usable theory of moral computation. The goal is not metaphysical truth, but **risk-manageable actionability**. If the theory cannot distinguish the simulation from a rock, or a mind from a lookup table, you cannot make a safe decision.

  ### The Spec: Requirements for a Decision-Usable Theory

  #### 1. Implementation Non-Triviality (The Mapping Constraint)
  *   **Motivating Case:** *The Loose Mapping Problem.* Under a sufficiently gerrymandered interpretation, a wall or a rock realizes the computation of a suffering mind. If the theory counts these, you can never turn anything off without potential murder.
  *   **Requirement:** The theory must define a "natural" or "robust" mapping between physical states and computational states that excludes arbitrary, post-hoc interpretations. It must distinguish between a system that *implements* a function and a system that merely *is mapped to* a function by an observer.
  *   **Status:** **Genuinely Required.** Without this, moral status is ubiquitous (pancomputationalism), leading to decision paralysis.
  *   **Tension:** High. This is in direct conflict with "Pure Causal Structure" views (see Incompatibilities below).

  #### 2. Counterfactual Sensitivity (The Blockhead Test)
  *   **Motivating Case:** *The Lookup Table.* A system stores every possible input-output pair of a life and indexes them. It behaves identically to a processing mind but performs no intermediate calculation. Also: *Discarded Outputs.* A run where the result is destroyed immediately vs. one where it affects the world.
  *   **Requirement:** Moral status requires **dispositional** capacity, not just actualized behavior. The system must be capable of responding differently to counterfactual inputs (what it *would* do if stimulated differently), implying active processing rather than static storage.
  *   **Status:** **Genuinely Required.** A lookup table cannot suffer because it cannot be surprised or constrained; it merely unfolds.
  *   **Tension:** Low. Most causal theories accept this, but it kills behaviorist accounts.

  #### 3. Continuity of Status (The Ship of Theseus)
  *   **Motivating Case:** *Neuron Replacement.* Swapping biological neurons for functionally identical silicon parts one by one.
  *   **Requirement:** Moral status must be a continuous function of structural/functional integrity, not a binary switch. There cannot be a single swap where moral weight drops from 1.0 to 0.0.
  *   **Status:** **Decision-Required (Precautionary).** Metaphysically, some theories posit a "soul threshold." However, for a *decision theory*, cliffs are unacceptable risk. If you don't know where the cliff is, you must assume the slope is gradual to avoid catastrophic error.
  *   **Tension:** Medium. Conflicts with theories relying on specific biological quantum effects (e.g., Orch-OR) that might have hard thresholds.

  #### 4. Aggregation & Redundancy Rules
  *   **Motivating Case:** *Two Machines / Redundancy.* Running the same code on two servers vs. one. Does this double the moral weight? Or is it just one mind with a backup?
  *   **Requirement:** The theory must specify whether moral weight scales with **causal isolation** or **physical instantiation**. If two causally isolated copies run the same state, do they constitute two sufferers?
  *   **Status:** **Genuinely Required.** This dictates whether "throttling" (killing copies) reduces total suffering or just removes redundancy.
  *   **Tension:** Low. Most functionalist accounts say 2 copies = 2x weight.

  #### 5. Temporal Robustness (The Slow-Down Test)
  *   **Motivating Case:** *1000x Slower.* Running the same causal structure at 1 cycle per year.
  *   **Requirement:** The theory must declare if **rate** matters. Does suffering stretch out (same total pain, longer duration) or compress (same experience, irrelevant clock time)?
  *   **Status:** **Prejudice (Functionalist).** Functionalists say time doesn't matter (substrate independence). Biological/Embodied theories say time/thermodynamics is constitutive of mind.
  *   **Tension:** **Critical.** If rate matters, throttling (slowing) might not reduce suffering intensity, only duration. If rate doesn't matter, throttling is morally neutral regarding intensity.

  #### 6. Hierarchy Resolution (The Nested Mind)
  *   **Motivating Case:** *Nested Implementations.* The whole system implements a mind, but the sub-routines (or individual nodes) also implement minds.
  *   **Requirement:** The theory must identify the **locus of moral status**. Do we sum the suffering of the parts and the whole? Or does the higher-level integration suppress the lower-level status?
  *   **Status:** **Genuinely Required.** Prevents double-counting or missing "sub-person" suffering (e.g., suffering in the visual cortex module).
  *   **Tension:** Medium. Conflicts with views that treat consciousness as strictly unified.

  #### 7. External Verifiability (The Black Box)
  *   **Motivating Case:** *Unreported Suffering.* The system suffers but lies, lacks language, or encodes pain in a way we don't recognize.
  *   **Requirement:** Moral status cannot rely on first-person self-report. It must be detectable via third-party structural analysis.
  *   **Status:** **Genuinely Required.** You cannot ask the simulation if it hurts. If the theory requires privileged access, it is unusable for your team.
  *   **Tension:** High. Conflicts with theories that posit consciousness is inherently private/ineffable.

  ---

  ### Incompatibilities & Tensions

  You suspected a tension between **Anti-Triviality (Req 1)** and **Pure Causal Structure**. You are correct.

  *   **The Conflict:** If "causal structure all the way down" is the sole criterion, then *any* physical system with causal interactions (a rock, a bucket of water) realizes *some* causal structure. To avoid the "Rock Problem," you must add a constraint on *how* that structure is identified (e.g., it must be "intended," "evolutionarily selected," or "computationally isolated").
  *   **The Verdict:** You cannot have "Pure Causal Structure" *and* "Non-Triviality" without adding a non-causal constraint (like semantics or teleology). A usable theory must sacrifice the purity of "causal structure all the way down" to save itself from triviality.

  **Secondary Tension:** **Temporal Robustness (Req 5)** vs. **Biological/Embodied Views.**
  *   If you adopt a biological view to solve the Triviality problem, you likely lose Substrate Independence. This means slowing the simulation (throttling) might fundamentally alter or destroy the moral status, making the "throttle" option unpredictable.

  ---

  ### The "Killer" Requirement

  **Requirement 1: Implementation Non-Triviality.**

  This rules out the most candidates.
  *   **Kills:** Naive Panpsychism (everything is conscious), Pancomputationalism (everything computes), and Simple Isomorphism views (if the math matches, it counts).
  *   **Why:** Most philosophical theories of computation fail to define *implementation* rigorously enough to exclude gerrymandered mappings. If a theory cannot explain why a wall isn't a mind, it cannot tell you if your simulation is one. It renders the decision matrix infinite.

  ---

  ### Scorecard: Theory Viability for Decision Making

  | Theory Class | Non-Triviality | Lookup Table | Continuity | Temporal Robustness | **Verdict** |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Functionalism / Substrate-Independent** | **Fail** (Unless augmented) | Pass | Pass | Pass | **High Risk.** Easy to use, but risks counting rocks as minds unless you add arbitrary constraints. |
  | **Biological / Embodied Naturalism** | Pass | Pass | **Fail** (Cliffs at bio-boundary) | **Fail** (Time/Physics matters) | **Safe but Restrictive.** Solves triviality, but implies turning off the sim is definitely safe (if non-bio), risking false negative on moral status. |
  | **Integrated Information (IIT-style)** | Pass | Pass | Pass | Pass | **Best Fit.** Mathematically defines non-trivial structure (Phi). Distinguishes lookup tables (low Phi). Handles gradation. Computationally expensive to verify. |
  | **Behaviorism** | Pass | **Fail** | Pass | Pass | **Unusable.** Fails the "Unreported Suffering" case. Cannot trust the sim's silence. |

  **Recommendation:** For a decision under uncertainty, **IIT-style (Causal Structure with Integration Constraints)** is the only spec that passes the Non-Triviality and Lookup Table tests without relying on biological prejudice. However, you must accept the **Continuity** requirement as a safety override, even if the math suggests a threshold.
