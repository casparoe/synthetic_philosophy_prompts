answer: |-
  This is a sophisticated package, and largely coherent, but you are right to be wary. You have constructed a theory that tries to balance *act-based* accountability (1, 2) with *status-based* vulnerability (4, 5), and the friction between those two foundations is where the contradictions lie.

  Here is an audit of your commitments, ranked by the severity of the tension, with recommendations on which commitment is least costly to drop or modify in each pair. I have kept this in British English as requested.

  ### 1. The Foundational Clash: (1) vs. (4)
  **Severity: High**

  This is the structural fault line in your theory. Commitment (1) implies an **act-based** view of standing loss: you lose standing because of what you *did* (the token-fault). Commitment (4) implies a **status-based** view: you lose standing because of where you *are* (the structural position/temptation), regardless of action.

  If (1) is read strictly—as your worry suggests ("if only actual token-faults matter")—then (4) is logically excluded. You cannot claim that standing is lost *only* via actual guilt whilst also claiming it is eroded by mere risk exposure. If risk exposure counts, then actual guilt is not the sole currency of standing.

  *   **Least costly to drop/modify:** **Modify (1).**
      *   **Why:** Dropping (4) would make your theory cleaner but less nuanced; it would ignore the intuitive force of the "glass houses" argument regarding vulnerability. However, keeping (4) forces you to abandon the exclusivity in (1).
      *   **Fix:** Reframe (1) not as "hypocrisy *only* kills standing for the exact fault" but as "hypocrisy kills standing *specifically* for the exact fault". This allows other factors (like structural risk in (4)) to also erode standing without contradicting the specific scope of hypocrisy. You must concede that actual fault is not the *only* way to lose standing.

  ### 2. The Durability of Reform: (2) vs. (4)
  **Severity: Medium-High**

  This tension is subtler but potentially more damaging to the practical application of your theory. Commitment (2) offers a clean slate: reform wipes guilt "like a paid debt". Commitment (4) suggests standing is eroded by structural analogy "even if you've resisted".

  Consider a reformed alcoholic working as a bartender. Under (2), their standing is restored. Under (4), their standing is weakened because they remain in a structurally analogous position of temptation. If (4) holds, (2) cannot be fully true; reform of *character* does not necessarily remove *structural risk*. If standing is partially constituted by structural risk, then "paid debt" (2) is an insufficient metaphor for restoration.

  *   **Least costly to drop/modify:** **Qualify (2).**
      *   **Why:** Dropping (4) again would solve this, but you seem keen on keeping the insight that context matters. Dropping (2) entirely is too harsh (it denies the possibility of redemption).
      *   **Fix:** Amend (2) to state that reform wipes *guilt*, but standing is only restored *insofar as the structural risk is also mitigated*. You must accept that one can be guilt-free yet still lack full standing due to position. This makes (2) contingent on the conditions of (4).

  ### 3. The Terminological Friction: (3) vs. (5)
  **Severity: Low**

  Your intuition here is correct: this is likely only an apparent tension. Commitment (3) uses the word "intact", which suggests a binary state (whole or broken). Commitment (5) explicitly claims standing is scalar (degrees). If authority is scalar, it cannot strictly be "intact" unless it is at maximum capacity.

  However, this is largely a linguistic stumble rather than a philosophical contradiction. You can have a "functionally intact" authority that is scalar.

  *   **Least costly to drop/modify:** **Drop the word "intact" in (3).**
      *   **Why:** It is the easiest fix. The concept of communicative blame does not require *pristine* authority, only *sufficient* authority.
      *   **Fix:** Rewrite (3) to say legitimacy hinges on the blamer having "sufficient moral authority". This aligns perfectly with (5) without requiring you to abandon the communicative account of blame.

  ### 4. The Scope Disunity: (6) vs. (1–5)
  **Severity: Medium**

  This is not a contradiction, but a disunity. Commitments (1) through (5) build a robust theory of individual moral psychology and standing. Commitment (6) essentially declares that theory pointless for a major class of moral wrongs (diffuse collective harms), shifting the locus to institutions.

  The risk here is that you are running two separate operating systems. Can institutions be hypocritical in the sense of (1)? Can they reform in the sense of (2)? If not, your theory of standing fractures into one for individuals and another for collectives. If individual blame is "pointless", does individual standing matter at all in those contexts?

  *   **Least costly to drop/modify:** **Keep (6) but bridge the gap.**
      *   **Why:** Dropping (6) forces you into individualistic blame for climate harm, which is theoretically unpopular and perhaps impractical. Dropping (1–5) renders your main theory useless for interpersonal ethics.
      *   **Fix:** You do not need to drop a commitment, but you must clarify the boundary. Specify that (1–5) apply to *interpersonal* standing, whilst (6) addresses *political* standing. The tension arises if you try to apply individual standing rules to collective problems. Acknowledge that institutions might have standing even where individuals lack it, not because individuals lack guilt, but because the *structure* of the wrong bypasses individual agency.

  ### Summary Audit

  Your package hangs together **provided you treat (1) and (2) as claims about guilt, and (4) and (5) as claims about status.**

  Currently, you are smuggling a contradiction by allowing guilt (1, 2) to dictate standing in some places, while allowing status (4) to dictate it in others, without establishing a hierarchy between them.

  **Recommended Hierarchy of Truth:**
  1.  **Standing is Scalar (5):** This is your foundational metaphysical claim.
  2.  **Authority is Risk-Sensitive (4):** This explains *why* it is scalar.
  3.  **Hypocrisy is Specific (1):** This is a rule about how *one particular type* of status loss works (not the only type).
  4.  **Reform Restores Guilt-Free Status (2):** This clears the debt, but subject to the constraints of (4).
  5.  **Blame is Communicative (3):** This is the function standing serves (change "intact" to "sufficient").
  6.  **Collective Wrongs are Distinct (6):** This is a scope limitation, not a core principle.

  If you make these adjustments, you remove the contradictions whilst preserving the nuanced insights you have landed on. The most costly change is accepting that reform (2) does not guarantee full standing if structural risk (4) remains, but that is a price worth paying for coherence.
