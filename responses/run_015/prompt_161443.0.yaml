answer: |-
  Here is an analysis of the Justine Sacco episode through the lens of punishment theory, adhering to your constraints on citation, epistemic transparency, and structural mapping.

  ### I. The Standard Conditions of Punishment

  To evaluate the case, we first need the baseline conceptual framework. In analytic philosophy of law and morals, there is a high degree of consensus on the necessary conditions for an act to count as "punishment" rather than penalty, taxation, or mere hostility. While specific formulations vary, the following five conditions represent the settled core of the concept:

  1.  **Hard Treatment:** The imposition of a consequence that is inherently unwelcome or harmful (loss of liberty, money, status, or life).
  2.  **Offense:** The treatment is imposed in response to an actual or supposed violation of a rule or norm.
  3.  **Agency:** The treatment is deliberately administered by an agent (or agents acting as one), not merely a natural consequence or accidental side effect.
  4.  **Standing:** The agent administering the treatment has the authority or right to do so (typically derived from being the victim, a representative of the victim, or a sovereign authority).
  5.  **Condemnation:** The treatment is intended to communicate blame or censure, distinguishing it from a price fee or a quarantine.

  *Epistemic Note:* Conditions 1, 2, and 5 are largely settled. Condition 3 (Agency) is settled in theory but strained in practice (see "Diffusion" below). Condition 4 (Standing) is the most contested, particularly regarding whether private actors or third parties ever possess it.

  ---

  ### II. The Four Readings

  Here we apply the Sacco facts to the four readings you requested.

  #### 1. Punishment Proper
  Under this reading, the events constitute a penal sanction imposed for a moral/legal breach.

  *   **Mapping Roles:**
      *   **The Punisher:** Only the **Employer** fits the "Authority" condition. They have a contractual relationship and HR protocols. The **Crowd** and **Journalists** lack standing; they are third parties who were not directly harmed by the tweet.
      *   **The Sanction:** The **Firing** is the only tangible "hard treatment" with a clear agent. The **Pile-on** functions as the *condemnation* element (the expressive component) but lacks the agency to be the punishment itself.
      *   **Third-Party Standing:** This reading fails here. Standard theory holds that strangers cannot punish. If the crowd is punishing, they are vigilantes. If the employer is punishing, they are acting on behalf of the crowd, which grants the crowd derivative standing the theory does not easily recognize.
  *   **Diffusion:** This reading collapses under diffusion. Punishment requires a deliberate imposer. A hashtag is not an agent. If no single person intended the total harm, no one punished her, even if she was punished.
  *   **Terminus:** This reading identifies a critical failure. Punishment requires a determinate end. The indefinite damage to employability violates the "limit" condition of punishment.
  *   **Verdict:** The firing *might* qualify as punishment (if the tweet violated employment norms), but the global shaming cannot be punishment under this reading because it lacks a legitimate agent and standing.

  #### 2. Expulsion / Exclusion (The Club Model)
  Under this reading, the event is not about inflicting pain for pain's sake, but about withdrawing the benefits of association due to a violation of community standards.

  *   **Mapping Roles:**
      *   **The Excluder:** The **Employer** is the Club Admin. The **Crowd** acts as members signaling that a norm has been breached, triggering the admin's exclusion protocol.
      *   **The Sanction:** The **Firing** is the expulsion. The **Pile-on** is social ostracization (withdrawal of social capital).
      *   **Third-Party Standing:** Irrelevant. In a voluntary association (or a professional sphere treated as one), the group sets the terms of membership. You don't need to be the victim to vote for expulsion; you just need to be a member of the scheme.
  *   **Diffusion:** Dissolved. Expulsion is a binary status change (In/Out), not a cumulative harm. It doesn't matter how many people voted, only that the threshold was met.
  *   **Terminus:** Dissolved. Expulsion can be permanent. There is no "sentence served." You are simply no longer a member.
  *   **Proportionality:** Replaced by **Procedural Fairness**. The question isn't "was the harm proportional to the tweet?" but "were the rules clear and the process fair?"
      *   *Application:* Sacco was fired while in the air, unable to defend herself. The "trial" was conducted by journalists and Twitter users, not HR. Procedurally, this reading suggests the expulsion was defective, even if the right to exclude existed.
  *   **Verdict:** This fits the mechanics best. It explains why the harm is indefinite (you don't get un-fired) and why the crowd feels entitled to act (they are enforcing community norms).

  #### 3. Collective Self-Defence / Preemption
  Under this reading, the action is not retributive but protective. The goal is to neutralize a threat.

  *   **Mapping Roles:**
      *   **The Defenders:** The **Crowd** and **Employer** act jointly to neutralize a risk.
      *   **The Threat:** Sacco's presence as a Communications Director poses a reputational and financial risk to the company and the broader social ecosystem.
      *   **The Sanction:** Removal from the position (neutralizing the risk). The **Pile-on** serves as a warning beacon to others (deterrence/prevention).
  *   **Third-Party Standing:** Validated. In self-defence theory, third parties can intervene to stop harm. If the tweet is viewed as an ongoing act of harm (hate speech), intervention is permitted.
  *   **Diffusion:** Validated. Collective defence does not require a single commander; it requires a common threat perception.
  *   **Terminus:** Problematic. Defence ends when the threat ends. Once she was fired and had apologized, the threat was arguably neutralized. The continued shaming years later cannot be justified as defence.
  *   **Verdict:** Justifies the firing (risk mitigation). Fails to justify the long-tail shaming (which becomes retributive).

  #### 4. Mere Expression / Boycott
  Under this reading, there is no sanction at all. There is only the aggregation of individual choices to associate or not associate.

  *   **Mapping Roles:**
      *   **The Actors:** Every individual in the **Crowd**, **Journalists**, and the **Employer**.
      *   **The Action:** Choosing not to employ, choosing not to follow, choosing to critique.
      *   **The Sanction:** None. "Harm" is a side effect of others exercising their own liberty.
  *   **Third-Party Standing:** Irrelevant. I do not need standing to decide I don't want to work with you.
  *   **Diffusion:** Irrelevant. No collective intent is required.
  *   **Proportionality:** Irrelevant. There is no duty to proportionality in private association. However, there is a moral distinction between *withdrawing your own custom* (I won't hire her) and *coercing others* (You shouldn't hire her).
      *   *Application:* The **Employer** withdrawing custom (firing) is on the "withdrawal" side. The **Journalists** amplifying the story to ensure no one else hires her moves toward "organizing a mob."
  *   **Verdict:** Conceptually cleanest, but normatively unsatisfying. It describes the *mechanism* (free association) but ignores the *effect* (coercive social control).

  ---

  ### III. The Two Problems: Diffusion and Terminus

  You asked whether these problems dissolve the punishment claim or indicate it went wrong.

  **1. Diffusion (No single agent imposed the total harm)**
  *   **Punishment Proper:** This is a **dissolver**. If punishment requires an agent, and the crowd is not an agent, then "crowd punishment" is a category error. It is a storm, not a sentence.
  *   **Expulsion/Defence/Boycott:** These readings **absorb** the problem. They do not require a singular sovereign agent. A market boycott or a club vote is inherently diffuse.
  *   **Epistemic Flag:** *My reconstruction:* I am treating "Agency" as a hard condition for Punishment Proper. Some theorists argue collective intent can emerge from distributed action. If you accept emergent agency, Diffusion stops being a dissolver. I am siding with the stricter view here because the "crowd" lacks a mechanism to form a unified will.

  **2. Missing Terminus (Indefinite duration)**
  *   **Punishment Proper:** This indicates the punishment **went badly wrong**. Indefinite punishment is tyranny. It suggests the process lacked the structural constraints of a legal system.
  *   **Expulsion:** This is **feature, not bug**. Expulsion is often permanent. The "harm" of being unemployable is just the state of being outside the club.
  *   **Self-Defence:** This indicates the action **shifted categories**. Once the threat is gone, continued harm becomes punishment. Since there is no authority to declare the threat over, it leaks.
  *   **Epistemic Flag:** *Normative work under conceptual cover:* By classifying the indefinite harm as a failure of "Punishment" but a feature of "Expulsion," I am implicitly arguing that Expulsion is the more accurate descriptor. This is a conceptual choice that carries the normative implication that we should stop demanding "proportionality" and start demanding "reintegration pathways."

  ---

  ### IV. Proportionality and the Boycott Line

  **Does each reading generate a proportionality requirement?**

  *   **Punishment Proper:** **Yes.** Retributive justice demands the penalty fit the crime. Under this reading, the Sacco outcome was grossly disproportionate (career death for a single tweet).
  *   **Expulsion:** **No, but Procedure matters.** A club can expel you for any reason if it's in the rules. The demand shifts to: Was the rule clear? Was the hearing fair? (Sacco fails the hearing test).
  *   **Self-Defence:** **Yes (Necessity).** The response must be no more than needed to stop the threat. Firing was necessary; eternal shaming was not.
  *   **Boycott:** **No.** But there is a line between **Negative Association** (I won't talk to you) and **Positive Interference** (I will pressure others not to talk to you).
      *   *Mapping the Case:* The **Employer** firing her is Negative Association. The **Journalists** keeping the story alive for clicks, and the **Crowd** searching her name years later, functions as Positive Interference. It transforms a personal boycott into a systemic barrier.

  ---

  ### V. Reverse Direction: What the Case Does to the Theory

  Your suspicion is correct: standard punishment theory is structurally unable to classify sanction by a dispersed crowd.

  **1. The Statist Bias**
  Punishment theory (even when not citing Hart) quietly assumes a **Monopoly of Force**. It assumes a single authority that can:
  *   Define the norm.
  *   Identify the violation.
  *   Impose the harm.
  *   Declare the debt paid.

  The Sacco case reveals that social sanction operates without a monopoly. It is polycentric. The theory treats this as an anomaly (vigilantism), but in the digital age, this is the baseline condition of social norm enforcement.

  **2. Is it an Anomaly or a Refutation?**
  *   **Anomaly View:** If you hold that only the State can punish, then Sacco wasn't punished; she was "shamed." This preserves the theory but renders it less useful for analyzing social life.
  *   **Refutation View:** If you hold that "punishment" describes the *experience* of hard treatment for norms, then the theory is broken because it cannot account for the agentless imposer.
  *   **My Assessment:** The concept of Punishment is doing **no work** here if applied strictly. It forces us to ask "Who is the authority?" when the relevant phenomenon is that *authority is distributed*.
  *   **Recommendation:** Drop "Punishment" for the crowd action. Use **"Social Sanction"** or **"Reputational Cost."** Reserve "Punishment" for the Employer's firing. This split acknowledges that the firing was an institutional act (subject to proportionality/standing) while the shaming was a market/social act (subject to diffusion/indefinite duration).

  **3. Where the Theory is Silent**
  Standard theory has no account for **Searchability**. Punishment theory assumes the sentence ends. It does not account for a world where the record of the punishment is permanently accessible to future "clubs" (employers). This is not a failure of the Sacco case; it is a failure of the theory to anticipate digital permanence.

  ---

  ### VI. Epistemic Summary & Normative Flags

  To ensure I am meeting your constraint on separating settled/contested claims and flagging my own normative work:

  1.  **Settled Consensus:** Punishment requires intentional hard treatment and an offense. (Used in Reading 1).
  2.  **Contested:** Whether private actors have standing to punish. (I treated this as a negative for Reading 1 to show the tension, but acknowledged Reading 2 bypasses it).
  3.  **Contested:** Whether "shaming" counts as "hard treatment." (I treated it as yes, which is standard, but note that some libertarians argue reputation is not a right).
  4.  **My Reconstruction:** I classified the "Crowd" as lacking Agency in Reading 1. This is a philosophical stance. If you view the crowd as a "swarm intelligence" with emergent agency, Reading 1 becomes more viable. I rejected this to highlight the Diffusion problem.
  5.  **Normative Work under Conceptual Cover:**
      *   By suggesting we drop the term "Punishment" for the crowd's action (Section V), I am making a normative claim: that we should not hold the crowd to the standards of criminal justice (proportionality, due process) because they are not a court.
      *   Conversely, by highlighting the "Procedural Fairness" failure in the Expulsion reading, I am arguing that even private exclusion *should* have due process. This is a normative claim disguised as a conceptual requirement of the "Club Model."

  **Conclusion:** The Sacco episode is not a case of Punishment Proper. It is a hybrid: **Institutional Expulsion** (the firing) triggered by **Distributed Social Sanction** (the pile-on). Punishment theory can explain the firing (and critique its lack of procedure), but it breaks when applied to the pile-on. The pile-on is better understood as a market failure of reputation, where the lack of a "terminus" mechanism turns a sanction into a permanent caste status.
