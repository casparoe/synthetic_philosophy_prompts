answer: |-
  Here is the grading breakdown and feedback. I have aimed for **14/20**, which fits comfortably within your 12–15 band. This rewards the strong grasp of the *pramāṇa* list and *upamāna* debate while penalizing the significant theoretical reversal in part (c) regarding intrinsic/extrinsic validity.

  ### **Final Mark: 14 / 20**

  ---

  ### **Feedback for Student (Copy/Paste Ready)**

  **Part (a): 4/4**
  *   **Good:** You have correctly identified all four *pramāṇas* and provided accurate, concise definitions for each. Your note on *arthāpatti* and *anupalabdhi* being reduced by Nyāya is excellent context.
  *   **Refinement:** Technically, Nyāya defines *pramā* as *yathārtha anubhava* (veridical cognition) rather than "true belief" (which carries Western Gettier-style baggage), but your definition is functionally correct for this level. No marks deducted.

  **Part (b): 5/6**
  *   **Good:** You have captured the core of the Nyāya defense well. Specifically, your point that inference (*anumāna*) requires a *vyāpti* (concomitance) which is absent in the *gavaya* case is the correct technical objection to the reductionist view.
  *   **Correction:** You state the "deliverance" (*phala*) of *upamāna* is the cognition of resemblance. Strictly speaking, Nyāya argues the result is knowledge of the *relation between the word and the object* (*śaktā-sambandha-jñāna*) *via* resemblance. The resemblance is the means, not the final knowledge claim. This is a minor precision issue, hence only -1.

  **Part (c): 2/6**
  *   **Major Error:** You have reversed the positions of Nyāya and Mīmāṃsā. Nyāya holds **extrinsic validity** (*parataḥ prāmāṇya*), whereas Mīmāṃsā holds **intrinsic validity** (*svataḥ prāmāṇya*). You wrote that they agree on *svataḥ*; this is the central point of disagreement between the two schools.
  *   **Confusion:** Consequently, your claim that Nyāya holds *svataḥ aprāmāṇya* is incorrect. Nyāya holds that *both* validity and invalidity are extrinsic (*parataḥ*).
  *   **Credit:** You correctly identified why memory is not *pramā* (the *anadhigata* / novelty condition). This shows you understand the definition of *pramā*, even if the validity theory was mixed up. You also correctly noted *pravṛttisāmarthya* (successful activity) as the Nyāya test, which contradicts your earlier claim about intrinsic validity—be careful with internal consistency.

  **Part (d): 3/4**
  *   **Good:** Correct conclusion: *tarka* is not a separate *pramāṇa*. Your reason that it presupposes *vyāpti* and cannot establish new knowledge on its own is correct.
  *   **Nuance:** You describe *tarka* as a device for "winning arguments" with "no role in the actual production of knowledge." This is too strong. While not a *pramāṇa*, Nyāya assigns *tarka* a vital epistemic role: it clears doubt (*saṃśaya*) and removes obstacles so that *anumāna* (inference) can function. It aids knowledge production indirectly.

  ---

  ### **Grading Rationale & Model Answer Sketch (For TA Use)**

  **Why 14/20?**
  *   **Consistency:** This aligns with your 12–15 band. The student clearly did the reading (parts a, b, and the memory point in d are strong) but has a fundamental misunderstanding of the *svataḥ/parataḥ* debate (part c).
  *   **Defensible Claims:** I did not dock for the "true belief" phrasing in (a) as it is a common introductory shorthand. I did not dock heavily for the *upamāna phala* in (b) as the logical structure of the argument was correct.
  *   **Plain Errors:** The swap of Nyāya/Mīmāṃsā positions in (c) is not a matter of interpretation; it is a factual error regarding the doxography. This cost 3 marks alone.
  *   **Question Fairness:** Your question is clear. Part (c) is dense, but the prompt explicitly asks to "contrast it with the Mīmāṃsā one," which should have signaled to the student that they hold opposing views.

  **What a 20/20 Answer Would Have Included:**

  *   **(a)** Define *pramāṇa* as *karaṇa* (instrument) leading to *pramā* (veridical cognition). List the four.
  *   **(b)** Explain that for Nyāya, *upamāna* generates knowledge of the *denotation* of a word (*śaktā-sambandha*). The opponent says this is just Memory (of the description) + Perception (of the animal). Nyāya replies: Memory only recalls the description; Perception only sees the form; neither yields the *connection* between the specific word "gavaya" and the specific animal without the unique operation of *upamāna*.
  *   **(c)** **Mīmāṃsā:** Validity is intrinsic (*svataḥ*); we assume truth unless proven otherwise. Invalidity is extrinsic. **Nyāya:** Validity is extrinsic (*parataḥ*); a cognition is not known as valid until confirmed by external conditions (like successful action/*pravṛttisāmarthya*). **Memory:** Neither school counts memory as *pramā* because *pramā* requires novelty (*anadhigata*), but they differ on *why* (Nyāya: memory is caused by past impression, not current object contact).
  *   **(d)** *Tarka* (reductio ad absurdum) is not a *pramāṇa* because it does not yield *niścaya* (definitive cognition) of a fact, only the impossibility of the opposite. However, it is not merely for "winning"; it is a prerequisite for sound inference by removing doubt.

  **Marginal Note Tips:**
  *   If you are handwriting comments, circle "Nyāya and Mīmāṃsā agree on svataḥ" in part (c) and write **"Opposite!"** in the margin. This is the quickest way to show them where the grade dropped.
  *   In part (d), underline "winning arguments" and write **"Epistemic aid?"** to prompt them to think about the role of doubt-removal.
