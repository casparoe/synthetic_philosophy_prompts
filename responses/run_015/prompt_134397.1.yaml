answer: |-
  **Part 1: The Problem Set-up**

  Consider Mary, a brilliant neuroscientist confined to a monochrome environment. She knows every physical fact there is to know about colour vision: the wavelength of light, the firing rates of cones, the neural pathways to the visual cortex. Yet, she has never seen colour herself. The traditional Knowledge Argument posits that upon leaving her room and seeing a red tomato, Mary learns something new—what it is like to see red—suggesting physicalism is false because she knew all physical facts yet still gained knowledge. However, let us sharpen the scenario. Upon release, Mary does not merely recognise red; she discovers she can close her eyes and conjure the experience of red with perfect clarity. Moreover, she gains the capacity to mentally synthesise and manipulate shades she has never physically encountered, imagining novel hues with the same fidelity as actual perception. The question shifts from simple recognition to generative imagination. Does this newfound ability to simulate the unseen represent a new fact about the world, or is it merely a new functional capacity of her brain?

  **Part 2: The Skill Interpretation**

  This expanded capacity invites us to view phenomenal knowledge not as a piece of information, but as a skill. When Mary steps into the coloured world, she is not necessarily downloading a new proposition into her mind; rather, she is acquiring a capability akin to learning how to ride a bicycle or mastering mental rotation tasks. Before her release, she could not simulate colour experiences; after her release, she can. This aligns with the 'ability hypothesis', which suggests that knowing what an experience is like is simply knowing how to remember, imagine, or recognise it. In this specific variation, Mary's ability to imagine unseen colours suggests her brain has unlocked a generative model of qualia. She has not learned a truth about the universe; she has learned a technique for processing visual data. She can now perform a cognitive operation—colour simulation—that was previously impossible for her, much like a musician gaining perfect pitch or a linguist gaining fluency.

  **Part 3: The Physicalist Defence**

  From a physicalist standpoint, framing this as a skill offers a robust defence against the claim that non-physical facts exist. If Mary's new capacity is merely a form of knowing-how, it can be fully reduced to physical changes in her neural architecture. Her brain has undergone plasticity; new synaptic weights have been adjusted, allowing for the simulation of visual data that was previously only theoretically understood. There is no need to posit a ghostly, non-physical property of 'redness' floating outside the physical domain. The gap is explained by the difference between having a map of a territory and actually walking through it. The walking is a physical activity. Similarly, Mary's ability to imagine colours is a physical process of neural simulation. Physicalism remains intact because the 'new' thing Mary acquired is not a fact about the world, but a new state of her own physical organism. The universe did not change; Mary's hardware did.

  **Part 4: The Best Counter-Argument**

  However, this defence faces a formidable challenge: the skill itself appears parasitic on a prior factual gain. To imagine a colour with perfect fidelity, one must already have access to the content of that experience. You cannot learn the skill of simulating red unless you first grasp what red is. The ability to manipulate mental images presupposes the existence of the images themselves. If Mary could not previously access the phenomenal character of colour, how did the physical transition grant her the ability to simulate it without first granting her the experience of it? The counter-argument suggests that the 'knowing-how' is grounded in a 'knowing-that'. The capacity to imagine unseen colours implies she now possesses a template of qualitative space that was absent before. If physicalism were true, and she knew all physical facts, she should have been able to simulate the output of those facts without needing the sensory exposure. The fact that she requires the exposure to unlock the skill suggests the exposure provided a factual ingredient—the qualia itself—that physical data alone could not supply. The skill is merely the vehicle; the cargo is the phenomenal fact.

  **Part 5: Your Verdict**

  The attempt to save physicalism by reclassifying phenomenal knowledge as a skill ultimately fails. While it is true that Mary gains a capability, this capability is not freestanding; it is grounded in the acquisition of experiential content that physical descriptions failed to convey. Framing the knowledge as knowing-how merely relocates the gap from 'facts' to 'capacities', but it does not close it. If a complete physical description of the world cannot predict or enable the capacity to imagine a colour without sensory exposure, then the physical description is incomplete. The ability to simulate unseen hues demonstrates that Mary has accessed a domain of reality—phenomenal space—that was inaccessible via physical facts alone. Therefore, physicalism is false. The gap is not merely linguistic or functional; it is ontological. Mary's new power to imagine proves that experience contains information that physical structure alone does not capture.
