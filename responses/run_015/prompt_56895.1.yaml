answer: |-
  Elias sat in the isolation chair, the electrodes biting into his temples like cold insects. He was on claim forty-two. The scale was slipping. It always did around forty. The first forty claims were sharp, distinct colors of pain; after that, the palette muddy, the nervous system resorting to blunt force trauma to register anything new. The baseline had drifted. Claim ten felt like claim fifty now. He was numb.

  "Reset sequence forty through fifty," said Chairwoman Vance. Her voice was flat, administrative. "The variance is too high."

  "It won't help," Elias said. His voice sounded like it came from underwater. "The receptor fatigue is cumulative. I can't recalibrate a ghost limb."

  "Proceed," Vance ordered. "We need the ordinal ranking, not the absolute values. The fund closes at five."

  That was the lie they told themselves. They needed to know who suffered more to allocate the limited capital. But Elias knew the order depended on what he'd eaten for breakfast, on whether claim thirty-nine had been a bone-break or a nerve-fire. If he'd tasted the bone-break first, the nerve-fire felt lighter. If reversed, the nerve-fire consumed everything. The ranking was not a map of their hell, but a map of his own degradation.

  They moved to the spinal pair. Claimant A: Mrs. Gable, twenty years post-lumbar fusion. Claimant B: Mr. Kress, six weeks post-accident, identical hardware.

  Elias plugged into Kress first. The pain was a white scream, fresh and outraged. It demanded the world stop. Then he switched to Gable. The pain was there, identical in voltage, but wrapped in layers of callous. She had built a life around the ache. It was manageable.

  "Kress is higher," Elias said. "The shock is greater."

  "But the injury is the same," argued the defense attorney. "Gable has endured it longer. Surely cumulative suffering weighs more?"

  "I measure the minute," Elias said. "The worst minute. In hers, the pain is background noise. In his, it is the foreground."

  "So adaptation penalizes her?" Vance asked.

  "I report the signal," Elias said. "You write the law."

  Then came the pair that broke the metrics. Claimant C and Claimant D. Neural scans showed identical firing rates. Chemical markers matched. Objectively, they were equal.

  Elias connected to C. A burn victim. The pain was pure, hot, simple.
  He connected to D. A chronic fatigue sufferer. The pain was a heavy gravity, a demand to sleep that fought against the will to wake.

  On the meters, they balanced. In Elias's head, D was heavier. Not because the hurt was sharper, but because of the cost. C could scream and pass out. D had to lift a cup of coffee every morning against a mountain of biological refusal. The energy expenditure to exist was the injury.

  "D is higher," Elias said.

  "Metrics say equal," the technician noted.

  "Metrics don't measure effort," Elias replied. He felt the numbness creeping up his neck again. Claim forty-eight was bleeding into forty-nine. Was the burn worse than the fatigue, or was he just tired of holding the cup?

  "Finalize the list," Vance said. She looked at the clock.

  Elias looked at the ranking on his screen. He knew claims forty through forty-five were shuffled randomly by his own degradation. He knew Gable was underrated because she had survived, and Kress overrated because he was still bleeding. He knew D was only higher because Elias respected the struggle more than the scream.

  "Submit," Elias said.

  The printer whirred. The compensation amounts generated based on the rank. Gable got less than Kress. D got more than C. The order was set in stone, flawed and human.

  "Court adjourned," Vance said. She didn't look at Elias. She couldn't.

  Elias unplugged. His own nerves felt phantom-light, untrustworthy. He walked out into the hallway where the claimants waited. He didn't know who was who. He didn't know if he'd ruined lives or saved them. He just knew the list was done.

  **What I was doing**

  I intended for the early verdicts (claims 1–30) to be read as trustworthy within the logic of the story, representing a "clean" signal. The verdicts in the fatigue zone (40–50) are explicitly contaminated by the carrier's physiological degradation; the story highlights that the ordering here is arbitrary, dependent on sequence rather than intrinsic suffering.

  The spinal injury verdict (Kress over Gable) is technically trustworthy regarding the mechanism—the carrier measures intensity of the "worst minute"—but ethically contaminated by the tribunal's failure to account for temporal duration. I wanted to show that a accurate measurement of a specific moment can still produce an unjust holistic ruling.

  The "cost" verdict (D over C) is the most subjective. Here, the carrier overrides the objective metrics based on his own valuation of "effort." This is meant to be contaminated by the carrier's personal philosophy, not the injury itself. It collisions with the prompt's worry about interpersonal comparison: the carrier isn't comparing Person C to Person D; he is comparing "C-in-Elias" to "D-in-Elias," and then adding a third variable of "Elias's respect for endurance."

  I handled the philosophical worry—that this is just the carrier comparing states against his own earlier self—by making it the central tension of the ending. The tribunal issues the ruling anyway. The story admits the comparison is impossible, but insists the bureaucracy must proceed regardless. The unresolved nature isn't about whether they will pay, but whether the payment means anything when the scale itself is broken.
