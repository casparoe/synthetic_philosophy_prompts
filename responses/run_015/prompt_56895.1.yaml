      "D is higher," Elias said.

      "Metrics say equal," the technician noted.

      "Metrics don't measure effort," Elias replied. He felt the numbness creeping up his neck again. Claim forty-eight was bleeding into forty-nine. Was the burn worse than the fatigue, or was he just tired of holding the cup?

      "Finalize the list," Vance said. She looked at the clock. The fund closed at five.

      Elias looked at the ranking on his screen. He knew claims forty through forty-five were shuffled randomly by his own degradation. He knew Gable was underrated because she had survived, and Kress overrated because he was still bleeding. He knew D was only higher because Elias respected the struggle more than the scream.

      "Submit," Elias said.

      The printer whirred. The compensation amounts generated based on the rank. Gable got less than Kress. D got more than C. The order was set in stone, flawed and human.

      "Court adjourned," Vance said. She didn't look at Elias. She couldn't.

      Elias unplugged. His own nerves felt phantom-light, untrustworthy. He walked out into the hallway where the claimants waited. He didn't know who was who. He didn't know if he'd ruined lives or saved them. He just knew the list was done.

