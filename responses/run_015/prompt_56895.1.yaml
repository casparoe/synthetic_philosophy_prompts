      *Writing:*
      Elias sat in the isolation chair, the electrodes biting into his temples. He was on claim forty-two. The scale was slipping. It always did around forty. The first forty claims were sharp, distinct colors of pain; after that, the palette muddy, the nervous system resorting to blunt force trauma to register anything new.

      "Reset sequence forty through fifty," said Chairwoman Vance. "The variance is too high."

      "It won't help," Elias said. His voice sounded like it came from underwater. "The baseline has shifted. Claim ten feels like claim fifty now. I'm numb."

      "Proceed," Vance ordered. "We need the ordinal ranking, not the absolute values."

      That was the lie they told themselves. They needed to know who suffered more to allocate the limited fund. But Elias knew the order depended on what he'd eaten for breakfast, on whether claim thirty-nine had been a bone-break or a nerve-fire. If he'd tasted the bone-break first, the nerve-fire felt lighter. If reversed, the nerve-fire consumed everything.

      They moved to the spinal pair. Claimant A: Mrs. Gable, twenty years post-lumbar fusion. Claimant B: Mr. Kress, six weeks post-accident, identical hardware.

      Elias plugged into Kress first. The pain was a white scream, fresh and outraged. It demanded the world stop. Then he switched to Gable. The pain was there, identical in voltage, but wrapped in layers of callous. She had built a life around the ache. It was manageable.

      "Kress is higher," Elias said. "The shock is greater."

      "But the injury is the same," argued the defense attorney. "Gable has endured it longer. Surely cumulative suffering weighs more?"

      "I measure the minute," Elias said. "The worst minute. In hers, the pain is background noise. In his, it is the foreground."

      "So adaptation penalizes her?" Vance asked.

      "I report the signal," Elias said. "You write the law."

      Then came the pair that broke the metrics. Claimant C and Claimant D. Neural scans showed identical firing rates. Chemical markers matched. Objectively, they were equal.

