answer: |-
  # Moral Status Taxonomy: Find Your Position
  **Seminar Handout | Don't worry about the reading yet**

  This isn't about matching yourself to Kant or Singer. It's about mapping your intuitions on concrete cases. Follow the nodes below. Your answers will drop you into one of four leaves (positions). Be honest—if you hesitate, pick the side you lean toward.

  ### Decision Nodes

  **1. The Root Structure**
  Is moral status an on/off switch (you either matter morally or you don't), or is it like a volume knob (entities can matter more or less)?
  *   **A:** On/Off (Binary) → *Go to Node 2*
  *   **B:** Volume Knob (Scalar) → *Go to Node 3*

  **2. The Binary Threshold**
  If status is binary, what flips the switch? Is it strictly being a member of the human species (covering the sleepwalker), or does it require current conscious capacity?
  *   **A:** Species Membership (Sleepwalker = Full Status) → *Leaf 1*
  *   **B:** Current Capacity (Sleepwalker = Reduced/No Status) → *Leaf 4 (Hybrid)*

  **3. The Scalar Metric**
  If status comes in degrees, what scales it? Is it strictly the capacity for suffering (positive/negative experience), or does cognitive complexity (learning, planning) add weight independently?
  *   **A:** Suffering Only → *Go to Node 4*
  *   **B:** Complexity Counts Too → *Go to Node 5*

  **4. The Distributed System Check (Slime & Insect)**
  Consider a slime-mold colony solving a maze or an insect with distributed nociception but no central brain. If damage-avoidance is spread across nodes with no single integrator to **recieve** the signal, does that still count toward moral status?
  *   **A:** Yes, function matters more than architecture → *Leaf 3*
  *   **B:** No, you need a unified subject of experience → *Leaf 2*

  **5. The Algorithmic Check (Thermostat)**
  A smart thermostat uses predictive learning to minimize error states. Is this functional goal-directedness enough for *any* moral status, however tiny?
  *   **A:** Yes, everything gets some score → *Leaf 3*
  *   **B:** No, biological grounding is required → *Leaf 2*

  **6. The Potentiality Check (Sleepwalker)**
  For a human sleepwalker (biologically human, currently non-agentic): Does the *potential* to wake up grant full status now, or does status fluctuate with consciousness?
  *   **A:** Potential is enough → *Leaf 2 or 3 (depending on prior path)*
  *   **B:** Status fluctuates → *Leaf 4 (Hybrid)*

  **7. The Rights vs. Feelings Check**
  Can an entity have high moral status (rights/protections) even if it definitively cannot suffer (e.g., a permanently comatose human or a sacred AI)?
  *   **A:** Yes, status isn't just about feelings → *Leaf 4 (Hybrid)*
  *   **B:** No, no suffering = no status → *Leaf 2*

  **8. The Zero Floor**
  For scalar views: Is the scale linear from absolute zero (thermostat = 0.0001), or is there a minimum threshold before status kicks in at all?
  *   **A:** Linear from zero → *Leaf 3*
  *   **B:** Threshold required → *Leaf 2*

  ---

  ### The Leaves (Your Position)

  *   **Leaf 1: Binary Speciesism.** Only humans matter, and they matter equally. (Sleepwalker = Full, Insect/Thermostat = None).
  *   **Leaf 2: Strict Sentientism.** Status requires a unified capacity for suffering. (Insect = Maybe, Slime/Thermostat = None, Human = High).
  *   **Leaf 3: Full Scalar Gradualism.** Status scales with complexity/function. (Thermostat = Tiny, Slime = Low, Human = High).
  *   **Leaf 4: Weird Hybrid.** Status is disconnected from sentience or fluctuates wildly. (e.g., Sleepwalker = None, but Comatose Human = Full).

  ---

  ### ⚠️ Flagged Empty Branches
  *These are combinations nobody consistently holds. Here's why.*

  *   **Thermostat > Insect:** Giving the smart thermostat partial status but denying the insect.
      *   *Diagnosis:* **Unattractive.** Usually seen as arbitrary bias against biology. If functional goal-seeking counts, the insect wins easily.
  *   **Scalar Status but Sleepwalker = 0:** Claiming status is scalar but a sleeping human drops to zero.
      *   *Diagnosis:* **Incoherent.** Most scalarists accept "potential capacity" as a buffer; otherwise, we lose status every night.
  *   **Binary Status but Species Irrelevant:** Claiming status is all-or-nothing but based purely on current intelligence.
      *   *Diagnosis:* **Unexplored/Unstable.** Hard to defend why a smart chimp gets *equal* status to a human infant without sliding into scalar views.

  *Note: If you found yourself switching answers between Node 4 and 5, you might not have a consistent view yet. That's fine, we'll fix that in seminar.*
