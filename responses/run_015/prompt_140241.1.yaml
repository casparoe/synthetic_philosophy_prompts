  7.  *(Final Review against constraints)*: The user wants criticism faithful in both directions. I need to make sure I don't just validate their thesis but challenge it using Dennett's actual framework, while also showing where the film pushes back against the thesis.

      *   *Challenge to User:* Dennett might say "Engineered Legibility" *is* intentionality. If it walks like a duck...
