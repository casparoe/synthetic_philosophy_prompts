prompt: |-
  I've been reading LW and ACX forever so I know all the standard moves around this stuff, but now I actually have to do it for real: I'm one of three people on the grants committee of a small animal-welfare funder, and we get ~30 proposals a year aimed at insects where the whole case is a scale argument — the numbers are astronomic, so even a tenth of a percent chance they feel anything makes the EV look enormous. I know why that's supposed to be fishy (the sentience probability isn't indepedent per insect, it's basically one shared hypothesis, so you're not making a million small bets that diversify, you're making one huge correlated bet) but I can't turn that into anything my committee can run on an actual proposal in an afternoon, with no literature review and no expert on call.

  So: write me a decision procedure. Questions in order, what counts as an adequate answer to each, where it just stops with a no, and where it has to stop and hand to a person because it's a values call. Specifically I want it to handle:

  - unit of account: for eusocial species, is the candidate subject the individual insect, the colony as a superorganism, or both, and how much of the answer rides on that choice;
  - interventions that move the population as well as the welfare per insect (a faster-acting pesticide kills more cleanly but might mean more survivors breeding). My suspicion is the sign of the effect flips depending on whether an insect life is net positive or net negative, and we genuinely don't know, so maybe the procedure branches there or punts;
  - the case where everything funnels into one correlated hypothesis and the right move might be buying information rather than acting — say when.

  Also tell me plainly where the procedure will misfire, i.e. where it hands back confident-looking numbers that are just our priors with a spreadsheet wrapped round them.

  Then run it on three: (1) a supermarket-chain campaign to switch to faster-killing pesticides; (2) funding a study on whether some other clade shows the "pessimism"-style judgement-bias markers I half-remember from bees, on the theory the result propagates across a lot of species at once; (3) the bee-pollination welfare project I've already half-promised a big grant to, which I want you to run honestly even if it comes out saying pull out. British English please.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure and analysis:

  1.  **Analyze the Request:**
      *   **User:** Experienced reader of LessWrong (LW) and Astral Codex Ten (ACX). Understands the "scale argument" (astronomical numbers $\times$ tiny probability = huge EV) and its pitfalls (correlated uncertainty, not diversified bets).
      *   **Role:** Member of a 3-person grants committee for a small animal-welfare funder.
      *   **Task:** Create a practical decision procedure for evaluating insect welfare proposals (approx. 30/year) without deep literature reviews or experts.
      *   **Specific Constraints:**
          *   Must handle: Unit of account (individual vs. colony/superorganism).
          *   Must handle: Population vs. welfare-per-insect trade-offs (sign uncertainty: is life net positive/negative?).
          *   Must handle: Correlated hypothesis risk (when to buy information vs. act).
          *   Must identify failure modes (where numbers are just priors in disguise).
          *   Must apply the procedure to three specific cases: (1) Supermarket pesticide switch, (2) Cross-clade sentience study, (3) Bee-pollination welfare project (already half-promised).
          *   **Tone/Style:** British English. Direct, pragmatic, acknowledging the epistemic messiness.

  2.  **Deconstruct the Core Problem:**
      *   The "Pascal's Mugging" of insect welfare: $EV = N \times P(\text{sentience}) \times \text{Welfare Change}$.
      *   $N$ is huge ($10^{18}$).
      *   $P(\text{sentience})$ is tiny and *correlated*. If we're wrong about one, we're wrong about all.
      *   Welfare Change is uncertain (valence, duration, intensity).
      *   Committee constraints: 3 people, afternoon per proposal, no new research.

  3.  **Drafting the Decision Procedure (The "Algorithm"):**
      *   *Goal:* Filter out the obvious noise, flag the correlated risks, and isolate the value judgments.
      *   *Structure:* Sequential questions. If "No" $\rightarrow$ Reject. If "Yes" $\rightarrow$ Proceed. If "Unknown/Value Call" $\rightarrow$ Flag for Committee Vote.
      *   *Key Insight:* We cannot solve the sentience probability. We must treat it as a "leverage factor" that is capped to prevent Pascal's Mugging, or treat the proposal as "informational value" vs. "direct impact."

      *   *Step 1: The Plausibility Filter (Stop the nonsense).* Does the intervention actually affect insects in a way that plausibly matters *if* they are sentient?
      *   *Step 2: The Unit of Account (Superorganism).* Is the proposal clear on what is being counted? If it ignores colony structure for eusocial species, it's flawed.
      *   *Step 3: The Sign Uncertainty (Net Positive/Negative).* This is crucial. If we don't know if life is worth living, increasing population size is a gamble.
      *   *Step 4: The Correlation Check (Information vs. Action).* Is this proposal trying to resolve the uncertainty or just betting on it?
      *   *Step 5: The Value Call.* Where does the committee have to vote based on risk tolerance?

  4.  **Addressing Specific Constraints:**
      *   *Unit of Account:* Need a rule. Default to individual *unless* strong evidence for superorganism consciousness exists (currently weak). But acknowledge the uncertainty.
      *   *Population vs. Welfare:* Need a "Sign Neutrality" check. If the proposal assumes life is net negative (or positive) without justification, flag it.
      *   *Correlated Hypothesis:* If the proposal relies entirely on $P(\text{sentience}) > 0.001$ to work, it's a "correlated bet." Better to fund info-gathering if the cost is low relative to the potential error.
      *   *Failure Modes:* Explicitly state that weighting $N$ too heavily is the main failure mode.

  5.  **Developing the Three Case Studies:**

      *   *Case 1: Supermarket Pesticide Switch.*
          *   *Mechanism:* Faster death = less suffering per insect?
          *   *Risk:* Survivors breed $\rightarrow$ more insects $\rightarrow$ more suffering (if life is net negative).
          *   *Verdict:* High risk of sign flip. Needs population modeling. Likely "No" or "Info only" without population data.
      *   *Case 2: Cross-Clade Sentience Study.*
          *   *Mechanism:* Reduces uncertainty on $P(\text{sentience})$.
          *   *Value:* High informational value. Reduces correlated risk for *future* grants.
          *   *Verdict:* Strong "Yes" (relative to others) because it buys information on the correlated variable.
      *   *Case 3: Bee-Pollination Welfare.*
          *   *Context:* User half-promised. High profile.
          *   *Risk:* Bees are eusocial. Unit of account issue. Pollination increases population (more crops $\rightarrow$ more bees). If life is net negative, this is harmful.
          *   *Verdict:* Honest application might kill it. Need to highlight the population/welfare trade-off.

  6.  **Refining the Tone (British English & LW/ACX vibe):**
      *   Use terms like "prior," "EV," "sign uncertainty," "Pascal's mugging."
      *   British spelling (organisation, programme, centre, modelling).
      *   Tone: Cynical but constructive. "Don't let the spreadsheet lie to you."
      *   Avoid over-optimism. Acknowledge that we are guessing.

  7.  **Iterative Polishing (Self-Correction during drafting):**
      *   *Critique:* Is the procedure too complex for an afternoon?
      *   *Fix:* Simplify the questions. Make them binary where possible.
      *   *Critique:* Did I address the "superorganism" point enough?
      *   *Fix:* Make it a specific gate. If they treat a hive as 10,000 individuals without justification, they fail Gate 2.
      *   *Critique:* The "half-promised" grant needs delicate handling.
      *   *Fix:* Be firm. If the procedure says no, say no. That's the point of the exercise.
      *   *Critique:* Ensure the "Correlated Hypothesis" logic is clear.
      *   *Fix:* Distinguish between "Direct Action" (betting on sentience) and "Epistemic Action" (learning about sentience).

  8.  **Final Review against Prompt:**
      *   Decision procedure? Yes.
      *   Questions in order? Yes.
      *   Adequate answers defined? Yes.
      *   Stop conditions? Yes.
      *   Values call identified? Yes.
      *   Unit of account handled? Yes.
      *   Population/Welfare trade-off handled? Yes.
      *   Correlated hypothesis/Info buying handled? Yes.
      *   Failure modes identified? Yes.
      *   Three cases run? Yes.
      *   British English? Yes.

  9.  **Final Polish:** Check for LW jargon accuracy (e.g., ensuring "Pascal's Mugging" is used correctly in context of correlated uncertainty). Ensure the distinction between *risk* (known probabilities) and *uncertainty* (unknown probabilities) is clear. (Proceed to generate output).

  *(Self-Correction on Case 3)*: The user says they "half-promised a big grant." If the procedure kills it, that's awkward. I need to make sure the procedure is honest enough to potentially kill it, as requested ("run honestly even if it comes out saying pull out"). I will not shy away from the negative verdict if the logic demands it.

  *(Self-Correction on Unit of Account)*: Current science leans towards individual sentience even in eusocial insects, but the *welfare* calculation might differ (e.g., worker sterility). I should frame the procedure to require the applicant to justify the unit, rather than imposing one, but penalize lack of justification.

  *(Self-Correction on Sign Uncertainty)*: This is the hardest part. Most insect welfare people assume net negative (wild animal suffering). If a proposal assumes net positive, it's a value clash. The procedure needs to flag this as a "Values Call."

  Let's write it.cw
answer: |-
  Here is a decision procedure designed for your constraints: three people, an afternoon, no new research, and a high risk of Pascal's Mugging via correlated uncertainty.

  It is designed to be a filter, not a calculator. It stops you from multiplying huge numbers by tiny probabilities before you've checked if the numbers mean anything.

  ### The Insect Welfare Grants Filter (IWGF)

  **Time limit:** 45 minutes per proposal.
  **Rule:** If a proposal fails a gate, it is rejected. No averaging. If a gate triggers a 'Values Call', it requires unanimous committee consent to proceed.

  #### Gate 1: The Mechanism Plausibility Check
  **Question:** Does the intervention change the *phenomenological experience* of the insect in a way that is robust to our ignorance of insect consciousness?
  **Adequate Answer:** The proposal identifies a specific mechanism (e.g., nociceptor blocking, faster neural shutdown, removal of a specific stressor) that reduces suffering *conditional on sentience*.
  **Fail Condition:** The proposal relies solely on "fewer insects exist" or "more insects exist" without addressing the quality of existence.
  **Stop:** If the mechanism is purely demographic (population size only), reject. We do not know the sign of existence (see Gate 3).

  #### Gate 2: The Unit of Account Specification
  **Question:** For eusocial species, does the proposal explicitly state whether it treats the individual or the colony as the moral patient, and is the intervention effective under that definition?
  **Adequate Answer:** The applicant acknowledges the superorganism debate. They either:
  1.  Argue for individual sentience (standard view) and show the intervention helps individuals.
  2.  Argue for colony sentience and show the intervention helps the colony's viability/flourishing.
  **Fail Condition:** The proposal treats a hive of 50,000 bees as 50,000 independent moral patients without addressing colony-level interdependence, *or* assumes the colony is the unit but measures success in individual mortality rates.
  **Values Call:** If the committee disagrees on the unit of account (e.g., two think individuals, one thinks colonies), you must agree on a weighting. If you cannot, the proposal pauses until you settle your own metaphysics. Do not outsource this to the applicant.

  #### Gate 3: The Sign Uncertainty Branch
  **Question:** Does the proposal acknowledge the possibility that insect life is net negative (suffering > pleasure)?
  **Adequate Answer:** The proposal includes a sensitivity analysis. It shows positive EV if life is net negative *and* (ideally) does not catastrophically fail if life is net positive.
  **Fail Condition:** The proposal assumes increasing population is inherently good (e.g., "conservation" without welfare caveats) OR assumes decreasing population is inherently good (e.g., "eradication" without welfare caveats).
  **The Branch:**
  *   If the intervention *reduces* population (e.g., pesticide): Proceed only if the case for net-negative life is strong.
  *   If the intervention *increases* population (e.g., habitat protection): Proceed only if the case for net-positive life is strong.
  *   If the sign is unknown (the likely case): The proposal must demonstrate a *welfare-per-capita* improvement so large it outweighs the population risk.
  **Stop:** If the proposal bets on population direction without justifying the sign of welfare, reject.

  #### Gate 4: The Correlation & Information Check
  **Question:** Is this proposal a bet on the *fact* of sentience, or a bet on *reducing uncertainty* about sentience?
  **Adequate Answer:**
  *   **Action Proposal:** Must pass a "Shut-up-and-Multiply" cap. You must agree on a maximum effective $N$ (e.g., cap the population count at $10^9$ regardless of the actual $10^{18}$) to prevent correlated priors from dominating the EV.
  *   **Information Proposal:** Must show how the result updates the prior for *future* grants across multiple clades.
  **Fail Condition:** An action proposal that derives 90% of its EV from the raw astronomical number of insects without applying a correlation discount.
  **Stop:** If it's an action proposal relying on astronomical $N$, reject unless the welfare-per-insect gain is massive and certain. If it's an information proposal, prioritise it (see Failure Modes).

  #### Gate 5: The Values Call (The Vote)
  **Question:** Given the remaining uncertainty, does the committee accept the risk profile?
  **Procedure:** This is not a calculation. This is a vote on risk tolerance.
  *   **Risk Averse:** Fund information (Gate 4, Info Proposals).
  *   **Risk Seeking:** Fund direct intervention (Gate 4, Action Proposals) only if Gates 1–3 are robust.
  **Stop:** If the vote is not unanimous on a high-stakes 'Values Call', the proposal is rejected. Small committees cannot afford internal schisms on existential uncertainty.

  ---

  ### Where This Procedure Will Misfire

  Be aware of these failure modes. The procedure is a sieve, not a truth machine.

  1.  **The Spreadsheet Camouflage:** Gate 4's "correlation discount" is arbitrary. You will pick a number (e.g., "cap $N$ at 1 billion") based on gut feeling, then dress it up as a parameter. This is actually fine—it's better than pretending the raw $10^{18}$ is real—but acknowledge you are just capping your own exposure to Pascal's Mugging.
  2.  **The Sign Assumption:** In Gate 3, you will likely default to the "insect life is net negative" prior because it's the dominant view in this niche. If you are wrong, you will systematically fund harm (e.g., funding pesticides that cause slow death, or habitat loss that starves them). The procedure flags this, but doesn't solve it.
  3.  **The Information Illusion:** Gate 4 favours research. But research on insect sentience has diminishing returns. You might end up funding a decade of "judgement bias" studies that never actually resolve the moral question, delaying action indefinitely.
  4.  **The Unit of Account Dodge:** Applicants will game Gate 2. They will write "we assume individual sentience" to tick the box, even if their intervention only makes sense at the colony level. You have to read the mechanism, not the boilerplate.

  ---

  ### Running the Procedure on Your Three Cases

  #### Case 1: Supermarket-Chain Campaign (Faster-Killing Pesticides)
  *   **Gate 1 (Mechanism):** Plausible. Faster neural shutdown reduces duration of suffering *per insect*. **Pass.**
  *   **Gate 2 (Unit):** Individuals. Pesticides kill individuals. **Pass.**
  *   **Gate 3 (Sign):** **Critical Fail.** The proposal argues for switching pesticides to reduce suffering per death. However, faster-acting pesticides often leave more survivors (sub-lethal doses) or require more frequent application due to resistance, potentially *increasing* the total population turnover.
      *   If insect life is net negative: Increasing the population (even with cleaner deaths) might increase total suffering.
      *   If insect life is net positive: Killing them is bad, regardless of speed.
      *   The proposal does not model the population dynamics (breeding rates of survivors). It assumes $N$ is static.
  *   **Verdict:** **Reject.** The sign uncertainty on population effects makes this a gamble with unknown odds. Without a population dynamics model, you cannot know if you are reducing or compounding the problem.

  #### Case 2: Cross-Clade Sentience Study (Judgement-Bias Markers)
  *   **Gate 1 (Mechanism):** N/A (Research). The mechanism is information generation. **Pass.**
  *   **Gate 2 (Unit):** Study looks for individual markers. **Pass.**
  *   **Gate 3 (Sign):** Research doesn't bet on sign; it clarifies the probability of sentience ($P$). **Pass.**
  *   **Gate 4 (Correlation):** **Strong Pass.** This is the definition of buying information on the correlated hypothesis. If this study shows judgement bias in a new clade, it updates the prior for *all* future insect grants, not just this one. It reduces the "one huge correlated bet" risk.
  *   **Gate 5 (Values):** Low risk. Even if the result is null, you bought valuable information.
  *   **Verdict:** **Fund.** This is the highest EV use of funds under uncertainty. It lowers the entropy for the next 30 proposals you receive.

  #### Case 3: Bee-Pollination Welfare Project (The Half-Promised Grant)
  *   **Gate 1 (Mechanism):** Plausible. Improving hive conditions, reducing transport stress. **Pass.**
  *   **Gate 2 (Unit):** **Struggle.** Bees are eusocial. The proposal treats workers as individuals (counting stress per bee). It does not address whether a stressed colony is a single suffering entity or 50,000. You must force a decision here. Let's assume you accept the individual view for now. **Conditional Pass.**
  *   **Gate 3 (Sign):** **Critical Fail.** The project aims to *support* pollination. Successful pollination increases crop yield, which incentivises farmers to keep *more* hives. This increases the bee population.
      *   If bee life is net negative (high stress, short life, culling of drones/workers): You are funding the expansion of a suffering factory.
      *   The proposal admits this trade-off but dismisses it, assuming welfare improvements per bee outweigh the population increase. They have not demonstrated this mathematically.
  *   **Gate 4 (Correlation):** This is an Action Proposal. It relies on the $P(\text{sentience})$ being high enough to matter. It does not buy information.
  *   **Gate 5 (Values):** You have half-promised this. But the procedure flags a severe risk of doing harm (expanding a net-negative population).
  *   **Verdict:** **Reject (or Radical Restructure).**
      *   *Hard Truth:* If you run this honestly, you cannot fund a project that scales up the number of bees without proving their lives are net positive. Given the consensus leans towards net-negative (or at least highly uncertain), funding population growth is reckless.
      *   *Pivot:* You can only fund this if you strip out the "pollination efficiency" aspect and fund *only* the welfare improvements for *existing* hives, with a clause that success does not incentivise hive expansion. If the project's goal is "better pollination," it is an industrial efficiency project, not a welfare project.

  ### Summary Advice for the Committee

  You are not trying to solve the philosophy of insect mind. You are trying to avoid being the people who accidentally funded a Holocaust of beetles because the spreadsheet looked pretty.

  1.  **Prioritise Case 2.** It is the only one that respects the correlated uncertainty.
  2.  **Kill Case 1.** It ignores population dynamics.
  3.  **Renegotiate Case 3.** Tell your contact: "We can fund the welfare improvements, but we cannot fund the population scaling. If the success metric is 'more bees', we can't write the cheque." If they refuse, walk away. It is better to break a promise than to break your moral mandate.

  The procedure will feel unsatisfying because it rejects "big number" EVs. That is the point. The big numbers are the trap.
