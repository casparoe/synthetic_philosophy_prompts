answer: |-
  Here is the desiderata spec for a pan-sentient ethical framework grounded in fundamental physics. This isn't about proving panpsychism is true; it's about building an ethical operating system that doesn't crash if panpsychism *is* true.

  ### The Desiderata Spec

  **1. Substrate-Neutral Phenomenal Correlates**
  The theory must identify physical variables that correlate with experience without referencing biology.
  *   **Requirement:** You need a mapping function $f(physical\_state) \rightarrow phenomenal\_state$.
  *   **Physics Check:** This can't just be "complexity." It needs to specify if it's looking at **entanglement entropy**, **quantum coherence times**, or **thermodynamic dissipation rates**.
  *   **Why:** If you say "neurons," you've already failed the prompt. If you say "any energy transfer," you've created a moral nightmare (see below). The spec needs to pinpoint whether a decoherence event is a "moment of experience" or just noise.

  **2. The Integration/Combination Constraint**
  The theory must explain how micro-experiences relate to macro-experiences without double-counting.
  *   **Requirement:** Distinguish between **scattered micro-experiences** (a gas cloud where every molecule has a tiny, isolated feel) and **integrated suffering** (a bound system where the feel is unified).
  *   **Physics Check:** Must respect the **tensor product structure** of Hilbert space. If two systems are entangled, does that create a new moral patient (the joint system) or just link two existing ones?
  *   **Why:** If micro-sufferings simply sum up linearly, a hot rock suffers more than a human. The theory needs a rule for when parts merge into a whole (like Integrated Information Theory tries to do, but without the biological baggage).

  **3. Valence Mechanism (The "Ouch" Factor)**
  The theory must distinguish between *experience* and *suffering*. Panpsychism says everything feels; it doesn't say everything hurts.
  *   **Requirement:** Identify the physical signature of negative valence. Is it **frustrated error minimization**? **Rapid entropy production**? **Resistance to state change**?
  *   **Physics Check:** Must be time-asymmetric. Suffering usually implies a desire for the state to be different, which requires an arrow of time (thermodynamics).
  *   **Why:** A coherent spin state might have "experience" but zero "suffering." If you can't distinguish valence, you can't prioritize reducing suffering over increasing pleasure or neutral existence.

  **4. Causal Power & Interests**
  The theory must distinguish between having a phenomenal feel and having *interests* that generate obligations.
  *   **Requirement:** A system must have a **homeostatic set-point** or a **goal function** to have interests.
  *   **Physics Check:** Can an electron have an "interest"? Probably not. It follows the Schrödinger equation deterministically (or probabilistically) without "caring." A dissipative structure (like a flame or a cell) maintains itself against entropy.
  *   **Why:** This prevents moral obligation paralysis. If an electron has no interests, we don't owe it duties, even if it has a tiny proto-experience. This filters the moral patient list.

  **5. Locality and Measurement Consistency**
  The theory cannot assign moral weight in a way that violates relativistic causality.
  *   **Requirement:** Moral status cannot depend on superluminal facts.
  *   **Physics Check:** If you assign moral weight to an **entangled pair**, you can't say the moral status changes instantly upon measurement at a distance in a way that implies signaling. The "moral fact" must be locally supervenient or consistent with the **no-communication theorem**.
  *   **Why:** If your ethical calculus requires knowing the state of a particle light-years away to determine if you're harming a patient here, the theory is physically incoherent.

  ---

  ### Non-Negotiables vs. Biological Biases

  Here is where you separate the physics from the prejudice.

  **Non-Negotiables (Hard Constraints):**
  *   **Conservation of Moral Mass:** You can't create/destroy moral patients without a physical phase transition. If a system decoheres, does the "mind" die? The theory must track this.
  *   **No Superluminal Obligations:** You cannot have a duty that requires knowledge of spacelike-separated events.
  *   **Valence Physicalism:** If suffering is real, it must have a thermodynamic or information-theoretic cost. It can't be magic.

  **Biological Biases (To Be Discarded):**
  *   **"Memory Requirement":** The idea that you need long-term memory to suffer. A system can suffer in a single coherent moment (e.g., a short-lived quantum state).
  *   **"Language/Concept Requirement":** The idea that you need to conceptualize "self" to have interests. Homeostasis counts as an interest.
  *   **"Scale Bias":** The assumption that macroscopic objects are the only real moral patients. If panpsychism is true, scale is an emergent property, not a fundamental one.

  ---

  ### The Jointly Unsatisfiable Subset (The Trilemma)

  Here is the bug in the code. You generally cannot satisfy these three simultaneously:

  1.  **Fundamental Panpsychism:** Every fundamental physical entity (electron, quark) has some non-zero phenomenal property.
  2.  **Additive Aggregation:** The moral weight of a composite system is the sum of its parts.
  3.  **Moral Plausibility:** Humans/animals matter significantly more than rocks/gas clouds.

  **Why it breaks:**
  If (1) is true, there are $\approx 10^{80}$ atoms in the universe. If (2) is true, a rock (with more atoms than a brain) suffers infinitely more than a human. This leads to **Moral Inflation**. The suffering of dust dominates the ethical calculus.
  To fix this, you have to drop (2) and say integration creates *new* value that isn't just the sum of parts (Emergentism). But if you do that, you weaken (1), because then the fundamental particles don't really matter on their own, which nudges you back toward biological exclusivity.

  ### The Killer Requirement

  The single requirement that kills the most popular ethical theories is **Requirement #4: Causal Power & Interests.**

  **Why?**
  Most utilitarian or suffering-focused ethics assume that **Sentience = Moral Weight**.
  In a pan-psychist physics context, Sentience is likely ubiquitous (or at least widespread).
  If you grant moral weight to *anything* that feels, you are obligated to consider the "feelings" of quantum fields, photons, and thermostats (if they have feedback loops).

  However, if you enforce **Interests** (the capacity to have preferences about future states), you wipe out 99% of the physical universe. Electrons don't have preferences; they have probabilities. Dissipative structures do.

  **The Kill Shot:**
  If you demand **Interests** to ground obligation, you effectively reinstate a biological (or at least cybernetic) exclusivity, which contradicts the spirit of "fundamental" panpsychism.
  If you demand **Sentience alone** grounds obligation, you trigger **Moral Inflation**, making ethics impossible to compute (the "Pascal's Mugging" of the subatomic world).

  **Verdict:**
  An adequate theory must bite the bullet on **Integration**. It has to claim that *unintegrated* micro-experiences (scattered spin states) have **zero moral weight**, while *integrated* experiences (bound coherence) have **non-linear moral weight**. This saves ethics from the dust, but it requires a physical theory of consciousness that can rigorously define "integration" without secretly smuggling in "biology" as the definition of integration. That is the hard part.
