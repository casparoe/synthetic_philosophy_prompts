answer: |-
  # The Famine Causality Tree

  ### **Root Node: The 1943 Bengal Famine**
  **Question:** *Was the primary driver a physical shortage of food or a collapse in access to food?*

  *   **Branch A: Food Availability Decline (FAD)**
      *   *Premise:* The rice crop failed due to cyclone, fungus, or war-related supply cuts; there simply wasn't enough grain in the region.
      *   **Node A1: Is Democracy Famine-Proof?**
          *   **A1.1 No:** Institutions cannot override biology or total war logistics.
          *   **A1.2 Yes:** Democratic pressure forces imports/aid even during supply shocks.
  *   **Branch B: Entitlement Failure / Distribution Collapse**
      *   *Premise:* Food existed, but inflation, speculation, or policy blocked specific groups from buying it.
      *   **Node B1: Is Democracy Famine-Proof?**
          *   **B1.1 Yes:** (Sen's Claim) Free press and elections force government response before mass starvation.
          *   **B1.2 No:** Democratic institutions can be too slow, corrupted, or irrelevant to market panics.

  ---

  ### **Terminal Leaves (The Archetypes)**
  *Sorted by how they classify the Irish Potato Famine and the Great Leap Forward (GLF).*

  #### **1. The Hard FAD Naturalist**
  *   **Path:** Bengal (FAD) → Democracy (No) → Irish/GLF (Nature/Weather).
  *   **View:** Famines are fundamentally agricultural disasters; politics only manages the casualty count.
  *   **Awkward Commitment:** You must argue that Mao's grain requisition quotas and British corn-law repeals were merely tragic background noise to the actual killer: the weather.

  #### **2. The Liberal Mitigationist**
  *   **Path:** Bengal (FAD) → Democracy (Yes) → Irish/GLF (Hybrid).
  *   **View:** Supply shocks happen, but only authoritarian or distracted states let them become famines.
  *   **Awkward Commitment:** You must claim that if the British Parliament had faced a general election in 1943, shipping lanes would have magically opened despite the ongoing Second World War.

  #### **3. The Sen-Style Entitlementist**
  *   **Path:** Bengal (Entitlement) → Democracy (Yes) → Irish/GLF (Entitlement).
  *   **View:** Famines are economic failures of access protected by political silence; democracy breaks the silence.
  *   **Awkward Commitment:** You have to treat the potato blight and the Lysenko agricultural pseudoscience as secondary footnotes to the market mechanisms that distributed the surviving food.

  #### **4. The Extractive Crime Theorist**
  *   **Path:** Bengal (Entitlement) → Democracy (No) → Irish/GLF (Extractive-State Crime).
  *   **View:** Famines are acts of violence where the state seizes food from the vulnerable to feed the core or the military.
  *   **Awkward Commitment:** You must equate the chaotic, decentralized incompetence of the Great Leap Forward with the calculated, bureaucratic neglect of the British Raj, ignoring the difference between malice and madness.

  #### **5. The Informational-Cascade Hybrid**
  *   **Path:** Bengal (Entitlement) → Democracy (No) → Irish/GLF (Informational-Cascade).
  *   **View:** Famines occur when local lies about harvest data prevent central planners from releasing reserves.
  *   **Awkward Commitment:** You must argue that local officials lying about grain yields was a more lethal mechanism than the actual physical confiscation of that grain from peasant households.

  ---

  ### **Diagnosis of Empty & Indistinguishable Branches**

  #### **The "Theoretical Ghost" Branch**
  *   **The Combo:** Bengal (Entitlement Failure) + Great Leap Forward (Pure Bad Weather/FAD).
  *   **Diagnosis:** **Theoretically Unstable.**
  *   **Why:** If you argue Bengal starved because of *access* rather than *availability*, you have adopted a political-economic framework for famine. To then pivot and claim the GLF (where millions died despite reported surpluses) was caused by *weather* is special pleading. It implies that "Entitlement Theory" applies only to colonial markets, not communist command economies, without offering a unified mechanism for why state power interacts differently with food in Delhi vs. Beijing. It is not logically incoherent, but it is analytically unattractive because it abandons parsimony to save a preconceived notion about specific regimes.

  #### **The Indistinguishable Pair**
  *   **The Positions:** **Sen-Style Entitlementist** vs. **Extractive Crime Theorist**.
  *   **Diagnosis:** **Empirically Blurred.**
  *   **Why:** In practice, these two views often predict the same policy failures. If the state confiscates grain (Extraction), it creates an entitlement failure for the producer. Distinguishing between "the state failed to protect market access" (Sen) and "the state actively stole the access" (Crime) becomes semantic hair-splitting when the state is the sole buyer and seller of food. The tree separates them based on *intent* (negligence vs. malice), but since intent is rarely documented in famine archives, these two leaves often occupy the same space in a real-world argument.
