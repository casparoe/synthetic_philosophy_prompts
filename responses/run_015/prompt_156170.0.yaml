      *   *Countable Additivity/Uniqueness:* Standard Dutch Book arguments establish finite additivity. Countable additivity requires additional assumptions (like continuity or specific infinite bet structures). Uniqueness of probability/utility is only up to positive linear transformations (for utility) and given the betting quotients (for probability), but representation theorems are needed to pin them down from preferences alone.
