answer: |-
  We are standing on grass that has grown over blood. That is a biological fact. It is also a historical one. For most of this town's existence, the grass was expected to do its work: to cover, to soften, to green over the evidence of what happened here. Today, we interrupt that natural process. We place a stone where the earth tries to heal itself too quickly.

  I stand before you as a student of memory, but also as a citizen of this town. I am thirty-one years old. I did not know the three men whose names are carved on this stone. I did not know the men who killed them. I cannot stand here and confess to a crime I did not commit. To do so would be a performance of guilt that belongs to someone else. And I will not stand here and thank our guests from Germany for coming to teach us how to be sorry.

  We have a German delegation with us today. Our sister city's mayor will speak shortly about how his community confronted the crimes of the National Socialist era. It is tempting to treat Germany as a classroom and the American South as a student in need of correction. We look to Berlin because Berlin seems to have finished its homework. But we are not here to copy their answers. We are here to understand the question.

  In 1947, the German philosopher Karl Jaspers tried to categorize what it means to be guilty after a catastrophe. He drew four circles. The first is criminal guilt, which belongs in a court of law. The second is political guilt, which belongs to every citizen of a state that committed crimes. The third is moral guilt, which belongs to the individual conscience. The fourth is metaphysical guilt, a solidarity with all human beings that is violated when a crime happens nearby and you survive.

  The distinction that matters for us today is between the political and the moral. Political guilt is collective. It is the responsibility I inherit because I am a citizen of this town, this state, this country. It means I inherit the debt, even if I did not spend the money. Moral guilt, however, cannot be assigned by one person to another. I cannot feel moral guilt for a lynching I did not witness. But I must accept political guilt for the community that allowed it to happen and the community that allowed the grass to grow over it.

  This distinction protects us from two errors. The first is the error of denial: "I didn't do it, so it has nothing to do with me." The second is the error of performative shame: "I feel so bad about what my ancestors did that I have now done my part." Political responsibility is not about feeling bad. It is about maintaining the record.

  And that brings us to this stone, and the difficult decision that shaped it. The committee voted to name the three men. They did not vote to name the families locally understood to have taken part in their deaths. I know there are people in this crowd, particularly among the descendants of the victims, who believe this omission makes this memorial a lie. Some of you feel that a truth that does not name the liar is not truth at all. You are right.

  I will not tell you that this omission is a compromise necessary for peace. I will not tell you that this is reconciliation. Reconciliation requires a truth that this stone does not fully tell. This memorial is not a period at the end of a sentence. It is a comma. It is a marker that says: *Something happened here. We know who died. We are not yet ready to say who killed them. But we will not forget the dead.*

  This is where our path must diverge from the German model. German memory culture is often organized around confession. It is a drama with a shape: the crime is admitted, the guilt is accepted, the apology is made, and ideally, a form of closure is reached. It is a narrative arc. It seeks to resolve the past so the future can begin.

  The American South does not need confession. We cannot confess to what we did not do, and the perpetrators are dead. What we need is what I call custodial memory. Custody does not have a climax. Custody does not have an ending. A custodian does not own the building; the custodian ensures the building does not fall down. Custodial memory is the maintenance of a record that no one in this room made and no one in this room can close.

  This is for the high school students standing in the back. You have been taught that history is a debate with two sides. You have been taught that if you hear one version, you must find the "other side" to be fair. There are not two sides to a lynching. There is the victim, and there is the violence. Custodial memory means you do not look for the "other side." You look for the evidence. You protect the names on this stone from the weather. You protect the story from the people who want to say it never happened. You protect the silence where the killers' names should be, until such time as the truth can be spoken.

  To our German guests: You have walked a hard road. We do not ask you to walk it for us. We ask you to witness that we are finally stepping onto the path.

  To the descendants: We know this stone is incomplete. We know it is painful to look at. We ask you to let it stand not as a monument to our virtue, but as a tool for your truth.

  To the town: Political guilt is not a burden to be carried until we are tired. It is a duty to be carried until we are gone. The grass will try to grow over this stone. The rain will try to wash the names away. Our job is not to feel guilty. Our job is to be good custodians.

  Thank you.

  ***

  **Note on Comparative Liberties and Contested Claims**

  This speech simplifies Karl Jaspers' *The Question of German Guilt* (1947) for a public audience, specifically flattening the distinction between "metaphysical" and "moral" guilt to prioritize the political/civic distinction useful for this context. Academics might note that Jaspers' "political guilt" is more about liability for the state's actions than the intergenerational inheritance implied here.

  The characterization of German memory culture as organized around "confession" with a "climax and ending" leans on a contested reading. While the concept of *Vergangenheitsbewältigung* (coming to terms with the past) implies a process, contemporary memory scholars (e.g., Aleida Assmann, Michael Rothberg) argue that German memory is increasingly seen as open-ended, multidirectional, and fraught with ongoing debate (e.g., the Holocaust Memorial, recent colonial reckoning), rather than a closed loop of confession and closure.

  The single claim I am least confident about is the binary opposition between "German confession" and "Southern custodial memory." This risks reinforcing a form of American exceptionalism by suggesting the German model is "finished" or purely confessional, whereas German memory culture is also fundamentally custodial (e.g., the maintenance of sites of terror). The distinction is useful heuristically for this speech, but theoretically porous.
