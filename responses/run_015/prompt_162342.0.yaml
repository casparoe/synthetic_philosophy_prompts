answer: |-
  ### The Spec: Requirements for a Theory of the Gender-Equality Paradox

  To count as an explanation capable of grounding normative decisions (intervene or not), a theory must meet the following six requirements.

  **1. Level-Consistency**
  *   **Case:** The paradox is an ecological correlation (country-level), but policy acts on individuals.
  *   **Requirement:** The theory must explicitly state whether the mechanism operates on individual psychology, institutional structures, or cultural climates, and provide a valid bridge for how individual mechanisms aggregate to the country-level pattern without committing the ecological fallacy.
  *   **Why:** Inferring individual causation from country-level data is the most common error in this debate; a theory that slides between levels cannot support specific interventions.

  **2. Variable Independence**
  *   **Case:** "Gender Equality" indices often include labor force participation or political representation, which are outcomes similar to the vocational measures being explained.
  *   **Requirement:** The theory must define the independent variable (equality/development) without referencing the dependent variable (vocational segregation/interests).
  *   **Why:** If equality is defined partly by women entering male-dominated fields, finding that equality predicts women entering fields is tautological, not explanatory.

  **3. Selective Sensitivity**
  *   **Case:** The pattern appears in vocational interests and personality but is weak or absent in math performance or cognitive ability.
  *   **Requirement:** The theory must explain why the effect triggers for *preferences* but not *competencies*.
  *   **Why:** A theory that claims "sex differences are real" generally must explain why they manifest in desire but not capacity; a theory that claims "bias is everywhere" must explain why bias affects choice but not test scores in high-equality nations.

  **4. Distributional Integrity**
  *   **Case:** Within-sex variance is vastly larger than between-sex variance.
  *   **Requirement:** The theory must not rely on "typical man" or "typical woman" archetypes; it must model the overlap and explain why the *tails* of the distribution drive the aggregate outcome.
  *   **Why:** Policies based on averages harm individuals in the overlap; a theory that ignores the spread justifies discrimination against the non-typical.

  **5. Counterfactual Stability**
  *   **Case:** Current data shows a curve, but we do not know if it plateaus, reverses, or accelerates at maximum equality.
  *   **Requirement:** The theory must predict what happens at the theoretical maximum of gender equality (saturation), not just fit the current slope.
  *   **Why:** To decide if intervention is needed, we must know if the current divergence is a temporary transition or a stable endpoint.

  **6. The Agency-Structure Bridge**
  *   **Case:** The core tension is between "free choice" and "convergence on stereotypes."
  *   **Requirement:** The theory must specify the mechanism of choice: are individuals maximizing utility based on stable preferences, or are preferences shaped by the very environment labeled "equal"?
  *   **Why:** This determines the moral status of the outcome. If preferences are endogenous to the system, "choice" is not a defense of the outcome.

  ***

  ### Political Prejudice in a Lab Coat vs. Genuine Requirements

  *   **Genuine:** **Level-Consistency**, **Variable Independence**, and **Distributional Integrity**. These are methodological necessities. Without them, the argument is statistically incoherent regardless of political valence.
  *   **Prejudice:** **Counterfactual Stability** and **The Agency-Structure Bridge**.
      *   *Why:* Demanding a prediction about "maximum equality" often hides a ideological commitment to linear progress (the belief that more equality *must* eventually reduce differences). Conversely, demanding the theory treat choices as "genuinely theirs" can be a libertarian shield against examining how preferences are formed.
      *   *The Trap:* The demand that the theory *must* explain why the aggregate lands on the stereotype assumes the stereotype is not a natural baseline. The demand that choices *must* be free assumes the current context is sufficient for autonomy. Both camps smuggle their desired conclusion into the criteria for evidence.

  ***

  ### The Core Tension: Agency vs. Convergence

  **Can both be met?**
  Yes, but only if you decouple "freedom" from "randomness."
  If you define freedom as the ability to act on preferences without survival pressure, and you accept that preferences may be sexually dimorphic (for whatever reason), then high equality allows preferences to drive choices rather than economic necessity. The convergence on stereotypes is not "steering" but "sorting."

  **If they can't be met:**
  If forced to choose, **drop the requirement that convergence implies steering.**
  *   **Cost:** You must accept that some sex differences in vocational interest may be robust features of human populations rather than artifacts of oppression. This removes the automatic moral indictment of the pattern.
  *   **Benefit:** It preserves the concept of agency. If you keep the requirement that convergence implies steering, you are forced to argue that women in high-equality countries are suffering from false consciousness, which is paternalistic and empirically fragile.

  **Is there a version where choices are free but intervention is still warranted?**
  Yes. Intervention is warranted if the *consequences* of the free choices reinforce systemic vulnerability.
  *   **Example:** If women freely choose care-oriented roles and men freely choose STEM, but society systematically undervalues and underpays care work, the *choice* is free but the *structure* is unjust.
  *   **Implication:** You intervene not to change the choice, but to change the valuation of the outcome (e.g., wages, prestige, security) so that the aggregate result does not produce gendered poverty or power imbalances.

  ***

  ### On "Opportunity-Sensitive" vs. "Expression-Sensitive"

  Your distinction is not jargon; it is conceptually sound and maps onto **constraints on action** vs. **constraints on preference formation**.
  *   **Opportunity-Sensitive:** Barriers to entry (gatekeeping, cost, harassment). Shrinks when barriers lift.
  *   **Expression-Sensitive:** Socialization of desire (norms, identity). Grows when conformity pressure lifts.

  **The Third Category: Structural Affordance**
  You need a third category for features of the work itself that interact with biology or social roles regardless of preference.
  *   **Definition:** A difference is *affordance-sensitive* if it arises because the structure of the job (hours, travel, physical demands) fits one life-pattern better than another, independent of interest or barrier.
  *   **Example:** If STEM careers demand 80-hour weeks during child-rearing years, and women still bear more care burden (even in equal societies), they may opt out not due to interest (expression) or hiring bias (opportunity), but due to the incompatibility of the role with their life constraints.

  ***

  ### Theory Families Evaluated Against the Spec

  **1. "Let people express themselves" (Security/Post-materialist)**
  Fits Level-Consistency and Selective Sensitivity well; argues security allows preference sorting. Fails Agency-Structure Bridge if it ignores how preferences were formed.
  *Verdict:* Strongest fit for the data, weakest on normative "is this bad?" questions.

  **2. "Internalized roles and norms" (Socialization)**
  Fits Agency-Structure Bridge by explaining preference formation. Fails Selective Sensitivity (why doesn't socialization affect math ability?) and Counterfactual Stability (why do norms strengthen as equality rises?).
  *Verdict:* Explains the mechanism, struggles to explain the direction of the correlation.

  **3. "Innate dispositions no longer suppressed" (Essentialist)**
  Fits Selective Sensitivity and Counterfactual Stability (predicts plateau). Fails Distributional Integrity if it relies on averages, and Variable Independence if it conflates biology with current behavior.
  *Verdict:* Explains the pattern cleanly, but high cost if biological claims are overstated.

  **4. "Measurement artifact / index construction" (Skeptic)**
  Fits Variable Independence by dissolving the independent variable. Fails Level-Consistency (doesn't explain why vocational measures replicate the pattern independent of indices).
  *Verdict:* Useful caution, but fails to explain the replication of the phenomenon across different metrics.

  ***

  ### The Killer Requirement

  **Variable Independence** kills the most theories.
  Most sociological explanations fail because their definition of "gender equality" implicitly includes economic outcomes that correlate with vocational choices, making the finding circular. Most biological explanations fail because they treat current behavioral outcomes as direct proxies for innate dispositions without controlling for the structural context that defines "equality." If a theory cannot define its cause without referencing its effect, it cannot guide policy.
