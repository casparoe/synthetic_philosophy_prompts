answer: |-
  The rain began on the fourth day of Frostfall and did not stop until the Silver-League Covenant was dust. In the basement of the Chancery of Negations, the air smelled of wet wool and iron gall ink. Scribe Elara sat before Ledger 9, her fingers stained black. Around her, the hum of the Chancery was a low drone of scratching quills and turning pages. They were counting the ways the world had ended.

  For thirty years, the five river cities had held the Covenant. Then, in one week, the bridges were burned. The Tribunal required a single name for the collapse. Reparations depended on it. A treason indictment depended on it. The Chancery's job was to provide the facts, but the ledgers offered only contradictions.

  Elara dipped her pen. She was working the column for the Grain Convoy. The archive showed the barges stuck in the mud at Lowmark on the 14th. The riverside districts starved for two days. They rioted. The Council never reconvened. Elara wrote the standard formula: *Remove Factor.* She imagined the barges arriving on time. The people ate. The riots did not happen. But under the Chancery's Rules of Procedure, she was forbidden from asking what else might have changed. She had to hold the rest of the week fixed. The Mutiny of the River Garrison still happened. The Assassination still happened. In this frozen world where only the grain moved, the Covenant still fell. She stamped the entry: *Not Cause.*

  Next to her, Scribe Joren worked the Assassination. The Mediator, a man named Varrick whose voice could calm a mob, was dead. Shot in the square. There were two shooters. One fired; the other waited in the crowd and never drew. Joren rubbed his temples. He removed the shooter. Varrick lived. But the Mutiny was still marching on the capital. The Grain was still stuck. The Council fractured anyway. Joren stamped: *Not Cause.*

  Then there was the Mutiny itself. The Garrison commanders had decided to march. Elara removed them. The soldiers stayed in their barracks. But the Council was already deadlocked because of the riots. Varrick was already dead. She stamped: *Not Cause.*

  Three sufficient causes. Three stamps saying *Not Cause.* It was the problem of the crowded room: if three men push a wall simultaneously and it falls, none of them pushed it hard enough to matter alone, yet all of them pushed.

  The fourth factor was different. It was a line of text in Article 12 of the Covenant, written at the founding and never read. It required unanimous ratification for any emergency measure. When the crisis hit, the Council tried to vote emergency powers. One city withheld consent. The measure failed. The Covenant dissolved. Elara removed the rule. She imagined a world where a simple majority sufficed. The vote passes. The Council survives the riots. It survives the assassination. It survives the mutiny. She stamped: *Necessary Condition.*

  But in the hallway outside, the High Arbiter of the Tribunal was pacing. He did not want a necessary condition. You cannot hang a rule of procedure. You cannot levy reparations on a sentence of parchment. He wanted a villain.

  The Tribunal convened on the 22nd. The room was cold. The Arbiter sat high beneath the painted eyes of the Founders. The prosecutors stood ready. The ledgers were piled on the table like bricks.

  "The Chancery says three events were sufficient to destroy the League," the Arbiter said. "The Grain, the Bullet, the Boots. Yet your ledgers say none are causes. Why?"

  Joren stood. "Because the Rules of Subtraction forbid us from tracing consequences backward, Lord Arbiter. When we remove the Grain, we are ordered to keep the Mutiny fixed. We must pretend the soldiers marched even if the hunger that angered them was gone. We hold the background fast. It is the Convention."

  "If you allowed the background to shift?" the Arbiter asked.

  "Then the ledger changes," Elara said, her voice quiet. "If the grain arrives, the riots do not happen. If the riots do not happen, perhaps the Garrison commanders do not fear for their families. Perhaps they do not march. If we are allowed to follow the thread back through the archive, the Grain becomes the cause. The Mutiny disappears from the record. But the Rules forbid it. We are told to cut the knot, not untie it."

  The Arbiter tapped his gavel. "And the Dispatch?"

  This was the fifth item. A paper found in the ruins of the Chancellor's office. It revealed that the city of Highport had secretly rearmed. It was proof of bad faith that would have wrecked the Covenant on its own. But it had arrived two days *after* the Council dissolved.

  "It was too late," the Prosecutor said. "The patient was already dead when the poison arrived."

  "But the poison was in the bottle," the Defense attorney countered. "If the Covenant had held for two more days, the Dispatch would have killed it. Is it not a cause of the peace failing, even if the timing was wrong?"

  "It is preemption," Joren muttered, more to himself than the court. "The Bullet got there first. The Dispatch was a cause waiting for a turn that never came."

  The Arbiter looked at the ledgers. "So. Three events that each could have killed the Covenant, but only one did the killing because it was first? And a Rule that kept the Covenant dead once it was wounded? And a Secret that arrived too late?"

  "The Rule is necessary," Elara said. "Without it, the Covenant survives any of the others. But it is like oxygen. It is required for the fire, but we do not blame the air for the burning."

  "Then who do we blame?" The Arbiter's voice hardened. "The Treaty of Reparations requires a signatory city to pay. The Indictment requires a head. I cannot sentence a clause. I cannot hang a rainstorm."

  The room went silent. The cost of the decision hung in the air, heavier than the ink smell. If they blamed the Grain, it was an act of nature; no one pays. If they blamed the Mutiny, the Garrison's city pays, but the Assassin goes free. If they blamed the Assassin, the shooter hangs, but the structural rot remains.

  "We must choose the human element," the Prosecutor said. "Intent matters. The Grain was mud. The Rule was ink. The Mutiny was fear. The Bullet was will."

  "The Mutiny was also will," the Defense snapped.

  "But the Mutiny is protected by sovereign immunity," the Prosecutor replied. "The shooter is a private actor. He is expendable."

  Elara looked at her ledger. She knew that if she violated the Convention, if she allowed herself to trace the ripples backward, the Grain might swallow the Mutiny. If she looked closer at the Rule, she might see that the Founders wrote it to ensure collapse, making them the true causes. But the Chancery did not pay for truth. It paid for findings that fit the Procedure.

  The Arbiter stood. He looked at the four factors as if they were weights on a scale. He needed one to tip it.

  "The Covenant fell because trust was broken," the Arbiter said. "The Grain was accident. The Mutiny was reaction. The Rule was structure. The Assassination was choice."

  He picked up the quill. He did not look at the ledgers. He looked at the window, where the rain still fell on the river.

  "We find the cause to be the Assassination of Mediator Varrick."

  A murmur went through the room. Joren closed his eyes. Elara stared at the stamp in her hand. *Not Cause.* She had stamped it *Not Cause* because the Mutiny was held fixed. But now the Tribunal was ignoring the Mutiny. They were selecting a cause not because it was the only sufficient condition, but because it was the only punishable one.

  "The shooter will be executed," the Arbiter continued. "Reparations will be levied against the city that harbored him. The Mutiny will be amnestied. The Grain loss is declared force majeure. The Rule remains in the text for the next Covenant."

  "And the Dispatch?" the Defense asked. "Highport's rearmament?"

  "Irrelevant," the Arbiter said. "It arrived after the death."

  Elara walked back to the basement. The Chancery was quiet. She opened Ledger 9 again. She looked at the line for the Assassination. By the rules she had followed, it was not the cause. The Mutiny would have done it. The Grain would have done it. But the Tribunal had spoken. The causal fact was now whatever the gavel said it was.

  She took a fresh sheet of paper. She wrote the Tribunal's finding at the top of the ledger. She did not stamp it. She just wrote it. *Cause: The Bullet.*

  She thought about the Convention. If she were allowed to backtrack, to let the world breathe when a factor was removed, the Grain might be the cause. If she were allowed to look at the set of conditions together, the Mutiny and the Bullet were both parts of the fire. If she were allowed to ask why the Covenant fell *then* rather than *later*, the Dispatch mattered. If she were allowed to ask why it fell *this way* rather than by quiet lapse, the Rule mattered.

  But the Tribunal did not ask those questions. They asked: *Who pays?*

  Down the hall, a door slammed. The order for the execution was being drafted. The shooter would hang. The city of Lowmark would pay silver. The Garrison would keep their swords. The Article 12 unanimity rule would sit in the archives, waiting for the next crisis to ensure the next collapse.

  Elara dipped her pen. She had to update the index. She wrote: *Collapse of Silver-League. Cause: Assassination.*

  She knew it was false. She knew it was necessary. She knew that in five years, or ten, the River Garrison would march again, or the grain would rot again, or the rule would strangle another vote. And another Tribunal would sit in another room, and another clerk would have to choose which lie to write in the ledger.

  She blew on the ink to dry it. Outside, the river rose, indifferent to the name they gave it. The water did not care if it was called a flood or a disaster. It only cared that the dam was gone. Elara closed the ledger. The sound was like a gavel falling. She stood up and extinguished the lamp, leaving the room in the dark, where all the removed factors waited, unchanged, ready to happen again.
