answer: |-
  This is a sharp observation, and you have correctly identified a pervasive tension in climate ethics and intergenerational justice. You are right that this is not merely a logical contradiction (which would be easy to spot) but a **strategic shifting of normative frameworks**.

  To answer your specific questions: No, there is no single, canonical Latin name for this specific toggle (like *ad hominem* or *post hoc*). However, it is a recognized phenomenon in philosophical literature, often discussed under the banners of **Motivated Reasoning**, **Intergenerational Moral Corruption**, or **Inconsistent Moral Status Attribution**.

  Stephen Gardiner, in his seminal work *A Perfect Moral Storm*, describes the broader context as **"Intergenerational Buck-Passing,"** but the specific rhetorical mechanism you are describing is best defined as **Strategic Ontological Shifting** (or **Temporal Special Pleading**).

  Here is a breakdown of the phenomenon, how it differs from the Non-Identity Problem, and a proposed definition with boundary cases.

  ---

  ### 1. What is this toggle?
  The pattern you observe relies on switching between two incompatible ethical frameworks depending on which one yields the desired policy outcome:

  1.  **The Economic/Welfarist Frame:** Future people are treated as **units of utility** located at a temporal distance. Because they are distant, their utility is discounted (Pure Time Preference). *Conclusion: We need not sacrifice present welfare.*
  2.  **The Deontological/Rights Frame:** Future people are treated as **rights-bearing moral subjects**. Because they will exist, they have a claim to a habitable world. *Conclusion: We must sacrifice present welfare to protect them.*

  The inconsistency lies in treating future people as **abstract variables** when calculating costs, but **concrete persons** when calculating duties.

  In the literature, this is often categorized as a form of **Motivated Reasoning** within **Intergenerational Ethics**. Some critics (like Wilfred Beckerman) have attacked "Sustainable Development" discourse for exactly this kind of ambiguity, arguing it smuggles in moral obligations while pretending to rely on economic efficiency.

  ### 2. How it differs from the Non-Identity Problem
  It is crucial to distinguish this toggle from Parfit's **Non-Identity Problem**, as they are often conflated but address different logical layers.

  | Feature | **The Toggle (Strategic Ontological Shifting)** | **The Non-Identity Problem** |
  | :--- | :--- | :--- |
  | **Core Question** | *How much* do future people matter? | *Who* are the future people? |
  | **Mechanism** | Shifts the **moral weight** assigned to future beings (Discount vs. Duty). | Shifts the **identity** of future beings based on policy choices. |
  | **The Argument** | "They matter less because they are far away" **VS** "They matter because they are people." | "We haven't harmed them because if we acted differently, *they* wouldn't exist." |
  | **Logical Status** | An inconsistency in **ethical framing** (Rhetorical/Normative). | A paradox in **harm conditions** (Metaphysical/Logical). |
  | **Resolution** | Requires choosing one consistent ethical framework (e.g., Zero Discount Rate). | Requires redefining "harm" (e.g., Person-Affecting vs. Impersonal principles). |

  **In short:** The Non-Identity Problem says, "You can't claim you hurt *them* specifically." The Toggle you identified says, "They don't count *yet*" (when convenient) and "They count *fully*" (when convenient).

  ### 3. Defining the Phenomenon
  Since there is no standard term, I propose the following definition for your use, based on the philosophical structure you identified:

  **Term:** **Temporal Moral Schizophrenia** (or **Strategic Ontological Shifting**)
  **Definition:** A rhetorical and ethical inconsistency in intergenerational debates where the ontological status of future persons is shifted to suit a preferred policy conclusion.
  *   **Mode A (Discounting):** Future persons are framed as *temporal locations of utility*, justifying the discounting of their welfare based on distance.
  *   **Mode B (Preservation):** Future persons are framed as *concrete rights-holders*, justifying the imposition of duties on the present based on their eventual existence.
  **Key Characteristic:** The shift occurs without acknowledging the change in ethical framework (e.g., from Consequentialism to Deontology).

  ### 4. Boundary Cases
  To ensure this definition is robust, we must distinguish it from consistent positions that might look similar on the surface.

  #### Case 1: The Consistent Discounting View (Not the Toggle)
  *   **Stance:** "Future people matter less because they are distant. Therefore, we should not sacrifice much for climate mitigation. Also, we have no strong duty to preserve specific resources for them, as their technology will solve problems."
  *   **Why it's not the toggle:** This view is consistent. It applies the "temporal distance" logic to both mitigation and preservation. It is ethically controversial (Ramsey called pure time preference "ethically indefensible"), but it is not internally inconsistent.

  #### Case 2: The Consistent Egalitarian View (Not the Toggle)
  *   **Stance:** "Time is morally irrelevant. A unit of welfare in 2200 counts the same as today. Therefore, we must mitigate climate change, and we must preserve biodiversity because future people have a right to it."
  *   **Why it's not the toggle:** This view applies the "moral subject" logic to both mitigation and preservation. This is the standard "Stern Review" position.

  #### Case 3: The Non-Identity Defense (Not the Toggle)
  *   **Stance:** "We shouldn't sacrifice present welfare. Also, we don't technically owe preservation to specific future individuals because our policies determine *who* is born. If we pollute, different people are born, so we haven't harmed the specific people who will live in 2200."
  *   **Why it's not the toggle:** This relies on the metaphysics of identity, not a shift in moral weight. It denies the *harm* rather than shifting the *status* of the victim.

  #### Case 4: The Toggle (Strategic Ontological Shifting)
  *   **Stance:** "We shouldn't sacrifice present welfare for 2200 because **time distance reduces value** (Economic Frame). However, we must protect this specific forest because **future people have a right to exist** in a healthy world (Rights Frame)."
  *   **Why it IS the toggle:** The arguer invokes temporal distance to negate a cost, but ignores temporal distance to affirm a duty. They treat the future as "too far to reach" when writing checks, but "close enough to touch" when assigning blame.

  ### Summary for your debates
  When you encounter this, you can point out that the arguer is engaging in **Normative Opportunism**. They are exploiting the **ambiguity of future personhood**.

  You might say:
  > "You are treating future people as **economic variables** when calculating the cost of action (discounting their welfare due to time), but as **moral subjects** when calculating the duty of preservation (asserting their rights despite time). You cannot have it both ways: either temporal distance reduces moral claim, or it does not. If it does, your preservation duty vanishes. If it doesn't, your discounting of mitigation costs is unjustified."

  This forces them to choose a consistent ethical framework, usually exposing that their position relies on the inconsistency itself.
