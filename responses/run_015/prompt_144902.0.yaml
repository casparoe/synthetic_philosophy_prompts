answer: |-
  The stalemate you describe is not merely a philosophical disagreement about the word "probability," nor is it simply a conservative resistance to heuristic reasoning. It is a **structural incompleteness in the mathematical bridge between local arithmetic corrections and global uniformity.**

  The debate has stalled because the two research programs you identified—**Calibrated Local Independence (CLI)** and **Majorant Pseudorandomness (MP)**—are currently operating as parallel tracks that intersect only at specific conjectures, without a general theorem mapping one onto the other. The dispute is primarily **substantive**, rooted in a specific gap in our structural understanding of the primes, but it manifests as a **methodological dualism** regarding what counts as an explanation.

  Here is the diagnosis of the dispute's structure, followed by the shape of genuine progress.

  ### 1. Diagnosis: The Explanatory Gap

  The impasse is best understood as a clash of **explanatory completeness**. Both sides agree on the data (the primes exist, Maier's theorem holds, Green-Tao is true). They disagree on whether the current rigorous machinery (MP) fully accounts for the predictive success of the heuristic machinery (CLI).

  #### A. The Verbal Layer (Surface Noise)
  There is a verbal component, as you hypothesized in point (i). When heuristicists speak of "probability," they refer to a **modeling density**; when rigorists demand "probability," they refer to a **measure-theoretic structure**. However, this is not the core stall. Both sides understand the other's usage. Heuristicists know the primes are deterministic; rigorists know the heuristics are useful. If the dispute were purely verbal, the Green–Tao theorem would have ended it by providing a rigorous vocabulary for "pseudorandomness." The fact that the debate persists indicates the verbal difference masks a mathematical one.

  #### B. The Substantive Layer (The Core Stall)
  The true source of the stall is your point (ii): **The Singular Series Gap.**
  *   **CLI** derives predictions by multiplying a global integral (the "random" part) by a singular series (the "arithmetic" part). The singular series encodes local obstructions modulo $p$.
  *   **MP** derives results by proving a set is uniform enough (via Gowers norms) to allow a transference principle.
  *   **The Disconnect:** We do not yet have a general theorem showing that satisfying the MP conditions (linear forms, correlation, Gowers uniformity) *necessarily implies* the CLI asymptotic with the *correct singular series*.

  In the Green–Tao theorem, the "constant" for the arithmetic progressions is handled carefully, but the machinery is optimized for *existence* and *density*, not necessarily for recovering the precise Hardy-Littlewood constants for all polynomial systems (Bateman-Horn). The rigorist complaint is that CLI treats the singular series as an ad hoc correction to a random model. The heuristicist complaint is that MP treats the singular series as a secondary technicality to the uniformity conditions.

  The stall exists because **no one has proven that the "arithmetic correction" (singular series) emerges naturally from the "structural uniformity" (Gowers norms) in the general polynomial case.** Until this link is forged, the heuristicist sees the rigorous proof as incomplete (it doesn't explain the constant), and the rigorist sees the heuristic as ungrounded (it doesn't explain the mechanism).

  #### C. The Structural Layer (The Maier Fear)
  Your point (iii) is the shadow hanging over the substantive layer. Maier's theorem proved that primes have irregularities at short scales that violate naive independence. The MP program handles this by using a weighted majorant that smooths over these irregularities.
  The unresolved fear is: **Are there Higher-Order Maier Obstructions?**
  It is possible that for higher-degree polynomials (Bateman-Horn), there exist structural irregularities that violate the necessary correlation conditions for *any* fixed majorant. If such obstructions exist, then CLI is fundamentally distinct from MP; CLI would be a "lucky" asymptotic coincidence that holds globally despite local structural failures that MP cannot capture. This fear prevents rigorists from accepting CLI as a proxy for truth, and it prevents heuristicists from accepting MP as the final word.

  ### 2. Fairness to the Parties

  *   **To the Heuristicists:** They are not ignoring Maier's theorem. They view it as a boundary condition on the *model*, not a refutation of the *asymptotic*. Their stance is that the singular series calibration absorbs the local arithmetic structure, and the remaining error is globally negligible. They view the demand for MP proofs as often yielding weaker bounds or restricting the scope of patterns (e.g., linear vs. polynomial), making MP an imperfect substitute for the generality of CLI.
  *   **To the Rigorists:** They are not denying the utility of heuristics. Their stance is that "calibration" without a structural derivation is epistemically fragile. If the singular series is not derived from the underlying structure of the set, we do not know *why* it works, and we cannot know if it will fail in a new regime (e.g., function fields, number fields, or higher-order correlations). They view CLI as a physical intuition that needs a mathematical skeleton.

  ### 3. The Shape of Genuine Progress

  The debate will not be resolved by a philosophical treaty agreeing to disagree. It requires a mathematical resolution to the **Singular Series Gap**. Progress should be measured by one of the following three outcomes, ranked by their ability to resolve the epistemic tension:

  #### A. The Structural Derivation Theorem (Ideal Resolution)
  **What it is:** A general transference theorem proving that if a set of integers satisfies specific MP conditions (Gowers uniformity, linear forms, correlation) relative to a majorant, then the count of polynomial patterns in that set is asymptotic to the CLI prediction (Integral $\times$ Singular Series).
  **Why it resolves the dispute:** It demonstrates that CLI is not a separate heuristic logic but the **asymptotic shadow of MP**. It shows that the singular series is not an ad hoc correction but a necessary consequence of the local constraints imposed by the majorant's structure. This validates the heuristicist's intuition (the answer is right) using the rigorist's standards (the mechanism is identified).
  **Status:** Partially achieved for linear systems (Green-Tao-Ziegler), but open for general polynomial systems (Bateman-Horn).

  #### B. The Obstruction Classification (Partial Resolution)
  **What it is:** A theorem classifying exactly which polynomial patterns admit an MP underwriting and which do not. This might involve proving that for degree $d \geq k$, a "Higher-Order Maier Phenomenon" prevents any majorant from satisfying the required correlation conditions.
  **Why it resolves the dispute:** It draws a precise boundary line. It tells the heuristicists: "Your method works here, but fails here, and here is the structural reason why." It tells the rigorists: "You cannot prove this via MP; you need a new paradigm." This converts the vague suspicion of failure into a mapped landscape.

  #### C. The Epistemic Dissolution (Least Desirable)
  **What it is:** A convincing argument that CLI and MP optimize different epistemic aims (prediction vs. explanation) and that no bridge is possible or necessary.
  **Why it fails to resolve:** This is essentially the status quo. It leaves the "why" unanswered. In mathematics, a prediction without a mechanism is often viewed as temporary. As long as the Bateman-Horn conjecture remains unproven, the community will rightly feel that the heuristic is incomplete. Dissolution is only acceptable if an Obstruction Classification (B) proves the bridge is impossible.

  ### 4. Recommendation

  The community should treat the **Structural Derivation Theorem (A)** as the primary objective. The debate stalls because the two sides are optimizing different functions: Heuristicists optimize for **conjectural generality** (Bateman-Horn for all polynomials), while Rigorists optimize for **structural certitude** (Green-Tao for linear forms).

  The way out is to demand that rigorous proofs of prime patterns **recover the singular series explicitly** from the uniformity conditions, rather than treating it as an external input. If a rigorous proof of a prime pattern conjecture does not derive the Hardy-Littlewood constant from the Gowers norm conditions, it should be viewed as structurally incomplete, even if logically valid. Conversely, heuristic arguments should be evaluated on their ability to suggest the correct majorant conditions.

  **Verdict on the Stall:** The dispute is a **substantive mathematical gap** (the lack of a general derivation of singular series from uniformity) masquerading as a **philosophical disagreement** (the status of probabilistic reasoning). Progress requires closing the gap, not settling the philosophy. Until a theorem demonstrates that Majorant Pseudorandomness *implies* Calibrated Local Independence for polynomial systems, the heuristicist will feel the rigorist is missing the point (the constants), and the rigorist will feel the heuristicist is missing the foundation (the structure).
