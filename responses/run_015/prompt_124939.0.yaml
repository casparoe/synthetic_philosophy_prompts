  6.  (Mental Check of Key Philosophers/Concepts): Strawson (Basic Argument), Goldman (Reliabilism), Frankfurt (Hierarchical Compatibilism), BonJour (Internalism/Reflection), Reactive Attitudes (Strawson P.F. vs G.). *Note: Keep distinct Galen Strawson (the skeptic) from P.F. Strawson (reactive attitudes), though they are related.*

