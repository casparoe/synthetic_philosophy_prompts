      *   *Final Verdict:* Ensure it answers "what does that verdict show about whether the difficulty in the moral case is really about responsibility at all." -> It shows it's about *desert* and *identity*, not just causal control.

  5.  **Final Review against Prompt:**
      *   Outline Strawson's argument? Yes (in intro).
