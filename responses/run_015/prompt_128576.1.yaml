  11. **Final Polish:** Ensure tone is academic yet accessible, matching the user's sophisticated phrasing ("representational failure," "liberty of indifference"). (Self-correction: Ensure I don't get too bogged down in medieval scholarship, keep the focus on the *analogy's function in modern debate*.)

