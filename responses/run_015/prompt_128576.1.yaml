  4.  **Analyzing Disanalogies (The Core Argument):**
      *   *Disanalogy 1: Determinism vs. Volition.* The ass is a beast (determined by appetite/intellect). The human agent (in Buridan's actual view) has *liberum arbitrium*. The analogy assumes the agent *is* the ass (determined), whereas Buridan argued the will is *not* the ass.
      *   *Disanalogy 2: Biological vs. Rational Necessity.* Starvation is a physical consequence. In rational choice, "inaction" is often just maintaining the status quo, not death. The stakes are different.
