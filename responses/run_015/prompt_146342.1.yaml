answer: |-
  # The 15-Minute Analogical Stress Test
  **Purpose:** Determine if Case A and Case B share enough structural essence to justify porting regulatory frameworks from one to the other.
  **Theoretical Basis:** Hofstadter & Sander (*Surfaces and Essences*). Analogy is cognition, not decoration. If the mapping breaks, the concept doesn't move.
  **Time Limit:** 15 Minutes hard stop.

  ---

  ## Part 1: The Procedure (4 Steps)

  Do not write an essay. Fill out this grid.

  ### Step 1: Strip the Nouns (2 Minutes)
  Remove the specific industry terms. Replace them with functional roles.
  *   *Bad:* "Facebook is like the Post Office."
  *   *Good:* "Platform A [Role: Aggregator] is like Platform B [Role: Carrier]."
  *   **Action:** Write down the **three core verbs** that define the activity in both cases.
      *   Case A Verbs: \_\_\_\_\_\_\_\_\_, \_\_\_\_\_\_\_\_\_, \_\_\_\_\_\_\_\_\_
      *   Case B Verbs: \_\_\_\_\_\_\_\_\_, \_\_\_\_\_\_\_\_\_, \_\_\_\_\_\_\_\_\_
  *   **Fail Condition:** If the verbs don't match semantically (e.g., "carry" vs. "curate"), stop. The analogy is decorative.

  ### Step 2: Map the Causal Mechanism (5 Minutes)
  How does the input become the output? This is where "Phantom Core Mapping" usually hides.
  *   **Action:** Draw the arrow.
      *   Case A: Input $\rightarrow$ [Mechanism] $\rightarrow$ Output
      *   Case B: Input $\rightarrow$ [Mechanism] $\rightarrow$ Output
  *   **The Slippage Check:** Does the mechanism in Case B require a "slippage" of meaning that breaks the causal chain?
      *   *Example:* If Case A relies on *physical scarcity* and Case B relies on *infinite replication*, the slippage is too high for scarcity-based rules.
  *   **Fail Condition:** If the mechanism relies on different physics, economics, or incentives, flag as **Phantom Core**.

  ### Step 3: The "Therefore" Test (5 Minutes)
  Complete this sentence for both cases using the *same* regulatory rule.
  *   "Because [Mechanism] exists, we must regulate [Point of Intervention]."
  *   **Action:** If the Point of Intervention moves (e.g., regulate the sender in Case A, but regulate the algorithm in Case B), the cases are not the "same kind."
  *   **Fail Condition:** If you have to change *where* the rule bites to make it work, do not port the rule.

  ### Step 4: Phantom Core Detection (3 Minutes)
  Ask: **Is the "Essence" just a moral label?**
  *   Are you calling them the same because they *feel* unjust in the same way, or because they *break* in the same way?
  *   **Action:** If the similarity is primarily emotional/moral (e.g., "both are cheating"), but the mechanics are distinct, mark **RHETORIC ONLY**.
  *   **Fail Condition:** If the similarity disappears when you remove the moral judgment, the analogy is useless for rule-making.

  ---

  ## Part 2: Decision Matrix

  | Result | Recommendation |
  | :--- | :--- |
  | **All Steps Pass** | **Port Rule.** Draft regulation based on Case A precedent. |
  | **Step 1 or 2 Fails** | **Abort.** Cases are distinct. Write new rules. |
  | **Step 3 or 4 Fails** | **Hybrid.** Use Case A for principles, but draft new mechanics. |
  | **Ambiguous / Timeout** | **Default to Distinct.** (See Part 4) |

  ---

  ## Part 3: Applied Case Studies

  ### Case 1: Carbon-Offset Markets vs. Medieval Indulgences
  *Intuition:* This feels structurally perfect. Rich actors pay money to wipe away "sin" (emissions/transgressions) without changing behavior. It feels like the same "kind" of moral hazard.

  **Run the Test:**
  1.  **Strip Nouns:**
      *   Indulgences: Sin $\rightarrow$ Payment $\rightarrow$ Absolution.
      *   Carbon Offsets: Emission $\rightarrow$ Payment $\rightarrow$ Neutralization.
      *   *Verbs Match?* Yes (Commit, Pay, Clear).
  2.  **Causal Mechanism:**
      *   Indulgences: Theological authority grants spiritual status change. No physical verification required.
      *   Carbon Offsets: Market verification claims physical reduction elsewhere. Requires audit/physics.
      *   *Slippage:* High. One is faith-based authority; the other is accounting-based verification.
  3.  **The "Therefore" Test:**
      *   Indulgences: "Because authority is absolute, regulate the Church hierarchy."
      *   Carbon: "Because verification is fallible, regulate the auditors and the baseline math."
      *   *Intervention Point:* Moves from Hierarchy to Methodology.
  4.  **Phantom Core:**
      *   Is the essence moral? Yes. The feeling of "unfairness" is identical.
      *   Is the mechanism regulatory? No. You cannot regulate a carbon market like a Church.

  **Verdict:** **KILL THE ANALOGY.**
  **Why:** This is a **Phantom Core**. The structural similarity is moral, not mechanical. Porting rules from religious governance to market accounting will fail. The intuition is right about the *social effect*, but wrong about the *regulatory lever*.
  **Recommendation:** Do not use "Indulgence" precedents. Treat as a financial verification issue.

  ### Case 2: Social Media Moderation vs. Postal Censorship
  *Intuition:* Both move messages from Person A to Person B. Government shouldn't stop them.

  **Run the Test:**
  1.  **Strip Nouns:**
      *   Postal: Sender $\rightarrow$ Carrier $\rightarrow$ Receiver.
      *   Social: User $\rightarrow$ Algorithm $\rightarrow$ Audience.
      *   *Verbs:* "Transport" vs. "Amplify/Curate." (Mismatch).
  2.  **Causal Mechanism:**
      *   Postal: Passive carriage. Envelope content is hidden/irrelevant to delivery.
      *   Social: Active curation. Content is the fuel for the delivery mechanism (engagement).
      *   *Slippage:* Massive. Passive vs. Active.
  3.  **The "Therefore" Test:**
      *   Postal: "Because it's passive, regulate interception."
      *   Social: "Because it's active, regulate recommendation logic."
      *   *Intervention Point:* Moves from the *pipeline* to the *engine*.
  4.  **Phantom Core:**
      *   Is the essence "Free Speech"? Yes.
      *   Is the mechanism "Common Carrier"? Debatable.

  **Verdict:** **FLAG AS HYBRID.**
  **Why:** The *rights* analogy holds (Step 4 passes on principles), but the *mechanical* analogy fails (Step 2 fails).
  **Recommendation:** Do not apply Postal privacy rules to Social algorithms. Apply Postal *non-interference* principles, but draft new technical standards for algorithmic transparency.

  ---

  ## Part 4: The Deadline Rule (Ambiguity Protocol)

  You will run out of time. The mapping will be 60% clear. You have to file a recommendation by 5 PM.

  **The Rule:** **Default to Distinct.**
  If the analogy is ambiguous, assume the cases are **different kinds**.

  **Reasoning:**
  1.  **Risk Asymmetry:** If you treat them as the same and you're wrong, you create loopholes or break the new system (False Positive). If you treat them as different and you're wrong, you do extra work writing new rules (False Negative).
  2.  **Policy Cost:** It is cheaper to write redundant rules than to fix broken regulations later.
  3.  **Hofstadter Check:** If the essence isn't screaming at you immediately, it's likely surface decoration. Deep structures usually reveal themselves quickly in the Verb/Mechanism test.

  **Action:** File the memo stating: *"Analogical mapping inconclusive. Proceeding under assumption of distinct regulatory categories to minimize systemic risk."*

  ---

  ## Part 5: Where This Procedure Fails

  Be honest with your team. This tool breaks in three scenarios:

  1.  **Novel Technology:** When Case B has no verbs yet (e.g., regulating AGI). You can't map mechanisms that don't exist. *Fix:* Use the procedure to identify *what we don't know* rather than what we do.
  2.  **Political Necessity:** Sometimes you *need* the analogy to pass legislation, even if the mechanics don't match (e.g., calling a tax a "fee"). *Fix:* Label it "Legislative Rhetoric" in the memo, distinct from "Regulatory Architecture."
  3.  **The "Essence" is Disputed:** If stakeholders agree on the mechanism but disagree on the *goal* (e.g., Is speech for truth or for safety?), the procedure won't help. That's a values fight, not a logic puzzle.

  **Final Instruction:** If Step 4 (Phantom Core) triggers, trust the procedure over your gut. The gut loves a good story; the procedure protects the rulebook.
