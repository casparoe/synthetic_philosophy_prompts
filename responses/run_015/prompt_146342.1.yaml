      *   *Slippage:* The allowable shift in meaning when moving contexts (e.g., "mother" in biology vs. "mother" in a corporation).
      *   *Phantom Core:* The trap where you think there's a deep structure, but it's just a vague label plastered over unrelated mechanics.

