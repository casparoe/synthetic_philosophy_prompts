      *   *Decision:* I will argue that Lewis's argument *fails* to refute penal substitution because the analogy breaks down at the metaphysical level of the Trinity. While Lewis's moral intuitions are correct for *human* judicial systems, they do not transfer to a *divine* self-satisfaction model. This allows for a strong verdict while engaging deeply with Lewis's points.
