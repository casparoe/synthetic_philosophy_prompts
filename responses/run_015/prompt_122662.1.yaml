      *   **Scenario:** A specific case study involving "Tavea," a speech community with no word for "know" (*kili* covers belief, obligatory evidentials mark source).
      *   **Data:** Taveans ignore the Gettier distinction but track evidential source. Westerners show the standard Gettier pattern.
      *   **The Argument:** The user has constructed a *reductio ad absurdum* argument against the viability of cross-cultural intuition surveys.
          *   Premises (1)-(5) lead to the conclusion that Tavean data is irrelevant to the concept of KNOWLEDGE.
