      *   **Section 3: The Proposed Reform (Sealed Withdrawal Conditions).**
          *   *Analysis:* This forces the existential claim to become a universal (or bounded) claim. "If not in $C$, then false."
          *   *What Current Practice Denies:* It denies that the original authors have the authority to define the falsification conditions post-hoc. It assumes the hypothesis *is* falsifiable. Current practice assumes the hypothesis is robust/fuzzy enough to survive boundary shifts. The reform assumes the "theory" includes its boundary conditions. Current practice treats boundary conditions as auxiliary assumptions that can be tweaked.

      *   **Section 4: Meta-Commentary (Common Ground vs. Disputes).**
