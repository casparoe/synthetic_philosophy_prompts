answer: |-
  ### 1. Epistemological Reconstruction: The Existential Hypothesis

  Your suspicion is correct. The pattern of reactions you describe presupposes that the hypothesis under test is not a universal claim ("Manipulation $M$ raises Outcome $O$"), but an **existential claim** ("There exists a non-empty set of conditions $C$ such that $M$ raises $O$").

  Logically, this transforms the finding from a law-like regularity into a **proof of possibility**.
  *   **When a replication fails:** The existential claim ($\exists C$) remains intact because the null result merely eliminates one candidate set of conditions ($C_{replication}$). The original authors defend the hypothesis by arguing $C_{replication} \notin C_{true}$.
  *   **When a replication succeeds:** The existential claim is strengthened because a new candidate set ($C_{new}$) is added to the known set of successful conditions.

  **What is this claim worth?**
  As a scientific assertion, an unbounded existential claim has low informational content. It is compatible with almost any pattern of data. If the boundaries of $C$ are unspecified, the hypothesis is **unfalsifiable** in practice, though not in principle. It functions as a "research program" starter rather than a settled fact. Its value lies only in heuristic potential: it signals that a phenomenon *can* occur, inviting the search for the boundary conditions.

  **What makes it testable?**
  To move from a protected existential claim to a testable scientific theory, the following must be added:
  1.  **Specified Moderators:** The theory must predict *which* variables define the set $C$ (e.g., "The effect holds for adults but not children").
  2.  **Mechanism:** A causal story that implies boundaries (e.g., "The effect relies on working memory, so it will vanish under cognitive load").
  3.  **Pre-registered Null Zones:** Explicit predictions of where the effect should *not* occur. Without predicting absence, presence is trivial.

  ### 2. Practice: Requirements vs. Fit

  Does the asymmetry (null = context, success = generality) follow from statistical logic, or is it a sociological fit?

  **A. Error-Statistics (Severity)**
  *   **Does it license the asymmetry?** No. In Deborah Mayo's error-statistical framework, a claim is warranted only if it has passed a **severe test**.
      *   A well-powered null replication *is* a severe test of the claim "Effect size $\ge \delta$." If it passes (i.e., finds null), the claim is refuted with high severity.
      *   To maintain the claim after a high-powered null, one must argue the replication was not a severe test of the *specific* hypothesis (e.g., the measure was invalid).
      *   **Verdict:** Strict severity logic does not license the asymmetry. It demands that if a null result is attributed to "context," that context must have been part of the original hypothesis. If it wasn't, the original claim was overly broad and should be revised, not protected.

  **B. Bayesian Hierarchical Modeling**
  *   **Does it license the asymmetry?** Yes, more naturally.
      *   In a Bayesian framework, the "true effect" is often modeled as a distribution across contexts ($\theta \sim N(\mu, \tau)$).
      *   A null result in one context updates the posterior for that specific $\theta_i$ and shrinks the population mean $\mu$, but rarely drives it to zero unless the prior was weak or the data overwhelming.
      *   A success in a new context updates $\mu$ upward.
      *   **Verdict:** This view treats heterogeneity as inherent. It licenses the "smaller/context-dependent" conclusion because it assumes $\tau > 0$ (variance across contexts) a priori. However, it still requires that the cumulative evidence eventually drives the probability of a non-zero mean down if nulls accumulate.

  **C. Sociological Convention (Credit and Blame)**
  *   **Does it license the asymmetry?** This best explains the *motivation*, if not the logic.
      *   Science operates on a credit economy. Original discoverers gain credit for "finding" the effect. Replicators gain credit for "correcting" or "generalizing" it.
      *   Declaring a famous effect "refuted" devalues the capital invested in the original finding (citations, textbooks, grants). Declaring it "context-dependent" preserves the original capital while awarding new capital to the replicators for mapping the boundaries.
      *   **Verdict:** This is not an epistemological justification but a pragmatic equilibrium. It minimizes disruption to the field's infrastructure.

  **D. The Significance-Testing Symmetry**
  You noted that strict significance testing treats a null replication as "absence of evidence."
  *   **The Logical Trap:** If "failure to reject $H_0$" is not "evidence for $H_0$" (null replication), then by symmetry, "rejecting $H_0$" is not necessarily "evidence for $H_1$" (original finding) without considering power and priors.
  *   **The Asymmetry:** The field violates this symmetry. It treats successful rejections as "established" (evidence of presence) but failed rejections as "inconclusive" (not evidence of absence).
  *   **Conclusion:** The reluctance to say *refuted* is **not** the same logic that stops the field from saying *established*. If it were, the field would be agnostic in both cases. Instead, the field is **asymmetrically credulous**: it accepts positive evidence as conclusive but treats negative evidence as provisional. This is a violation of strict NHST logic, which is inherently symmetric in its caution.

  ### 3. The Reform: Sealed Withdrawal Conditions

  The proposed reform (original authors pre-specify conditions for withdrawal) attempts to convert the **existential claim** back into a **bounded universal claim**.

  **What Current Practice Denies vs. What the Reform Assumes:**
  1.  **Authority over Theory:** Current practice assumes that the *community* (via meta-analysis and accumulation) determines the boundary conditions over time. The reform assumes the *original authors* possess sufficient theoretical knowledge to define the falsification conditions upfront.
  2.  **The Nature of the Claim:** Current practice treats the effect as a robust property of the world that persists despite methodological noise. The reform treats the effect as a conditional prediction that is vulnerable to specific methodological parameters.
  3.  **Falsifiability:** Current practice implicitly denies that the specific finding is individually falsifiable (it is only adjustable). The reform assumes the finding *is* falsifiable and assigns the cost of falsification to the originators.

  **The Risk:** The reform assumes authors *can* specify these conditions. If the theory is truly exploratory (as the existential view suggests), authors may not know the boundaries. Forcing them to guess might lead to overly narrow conditions that are easily met (protecting the theory trivially) or overly broad ones that are easily broken (killing useful heuristics).

  ### 4. Meta-Analysis: Common Ground, Disputes, and Extrapolation

  **Common Ground (Statisticians & Philosophers of Science):**
  *   **Existential Weakness:** There is consensus that an unbounded existential claim ("it works somewhere") is scientifically weak and unfalsifiable without boundary specifications.
  *   **Power Matters:** There is consensus that a well-powered null result *should* count as evidence against the effect, more so than current practice admits.
  *   **Heterogeneity:** There is agreement that effect sizes vary across contexts (the $\tau > 0$ assumption), making exact replication unlikely even for true effects.

  **Live Disputes:**
  *   **The Role of Pre-registration:** Some argue pre-registration locks in theory too early (stifling exploration), while others (like the reform proponents) argue it is necessary for falsifiability.
  *   **Bayesian vs. Error-Statistical:** Bayesians argue that evidence is continuous (updating probabilities), making "refutation" a misnomer. Error-statists argue that without severe tests (which can refute), we cannot claim to have learned anything. This underpins the disagreement on whether a null replication *can* refute.
  *   **Definition of Replication:** Is a replication a test of the *original protocol* (direct) or the *underlying hypothesis* (conceptual)? Current practice blurs these; the reform tries to force them to align.

  **Extrapolation (My Analysis):**
  *   **Sociological Explanation:** My attribution of the asymmetry to a "credit economy" is a sociological extrapolation. While supported by studies on scientific incentives (e.g., Smaldino & McElreath), it is not a formal statistical derivation.
  *   **The Reform's Feasibility:** My skepticism about whether authors *can* specify withdrawal conditions assumes that many published effects are indeed the result of "p-hacking" or exploratory fishing rather than strong theory. If the original effect was theoretically derived, the reform is feasible; if it was a surprise finding, the reform may be impossible to implement fairly.

  ### Summary
  The field operates on a **Lakatosian "protective belt"**: the hard core (the effect exists) is protected by adjusting auxiliary hypotheses (the context/measure). This is logically consistent if the hypothesis is existential, but scientifically stagnant. The proposed reform attempts to force the "hard core" to be falsifiable by demanding boundary conditions be stated *ex ante*. This shifts the epistemology from **discovery of possibility** to **testing of bounded laws**. Current practice denies that individual studies carry the weight of falsification; the reform assumes they must.
