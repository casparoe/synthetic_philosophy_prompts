  0.28

  **Decomposition of Credence**

  (a) **Substantivity of Question:** 0.50
  Justification: There is a substantial probability the dispute is merely verbal, resting on divergent conventions for counting artefacts rather than ontology.

  (b) **Survival of Total Disassembly:** 0.10
  Justification: Artefacts generally cease to exist when their structural integrity is utterly destroyed and reduced to unorganised dust.

  (c) **Persistence Criteria (Matter vs Form/History):** 0.30
  Justification: For artefacts, historical continuity of creation typically outweighs material continuity, yet the original making-event is severed here.

  (d) **Significance of Rearranged Matter:** 0.40
  Justification: Retaining 70% of the original clay provides some mereological overlap, but milling alters the physical microstructure significantly.

  (e) **Impact of Two-Copy Variant:** 0.15
  Justification: The possibility of fission strongly suggests numerical identity cannot survive in either branch, undermining the single-copy intuition.

  (f) **Causal History of Creation:** 0.20
  Justification: An artefact's identity is principally anchored in its original production event, which this process effectively replicates rather than continues.

  **Combination**
  Taking the arithmetic mean of the six terms above yields a final credence of 0.28 that the statue is numerically identical.

  **Least Confident Term**
  I am least confident in term (a), regarding whether the question is substantive. My uncertainty here stems from the difficulty in distinguishing metaphysical indeterminacy from semantic vagueness in ordinary object talk.

  **Single Consideration to Shift Number**
  The number would shift furthest towards identity (higher credence) if empirical sociolinguistic data demonstrated that ordinary speakers universally and steadfastly classify such restored objects as 'the same' without hesitation, suggesting our concept of artefact identity is purely functional.

  **Analysis of Disagreement**
  Your disagreement likely arises because you are answering different questions. Your friend, the conservator, operates with a functional and curatorial concept of identity where continuity of role, appearance, and accession number suffices for 'sameness'. You are operating with a strict metaphysical concept requiring unbroken causal history or material continuity. She weights continuity of function and care at roughly 0.85, whilst you weight constitutional history at 0.15; you are not merely weighting the same factors differently, but prioritising distinct criteria entirely.
