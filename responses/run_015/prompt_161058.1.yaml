  The hand begins its slow act of weighing.
  There is no use in merely measuring.
  Smoke rises from the glass vessel.
  We watch the color of the flame.
  It drinks the common air.
  It leaves behind the red calx.

  What is left behind is calx.
  We return to the act of weighing.
  Is it lost spirit or missing air?
  The numbers stop measuring.
  Something feeds the flame.
  Something breaks the vessel.

  Seal the vessel tight.
  The weight resides in calx.
  No hidden spirit feeds the flame.
  We are tired of weighing.
  The scale stops measuring.
  We breathe the new air.

  We name it vital air.
  Inside the sealed vessel.
  The gain is in measuring.
  The metal becomes calx.
  We insist on weighing.
  It changes all we know of flame.

  We argue oer the flame.
  But mean the missing air.
  We return to weighing.
  Within the same vessel.
  Is it earth or is it calx?
  We are still measuring.

  We are still measuring.
  By the light of the flame.
  The residue is calx.
  It floats in the air.
  We trust the glass vessel.
  We never stop weighing.

  We watch the flame and keep measuring,
  Calling the earth calx and the void air,
  Safe in the vessel while we keep weighing.
