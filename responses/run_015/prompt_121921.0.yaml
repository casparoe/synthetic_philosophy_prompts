answer: |-
  **Activity: The Conditional Market**
  **Materials:** 3d6, 100 poker chips/team, whiteboard, index cards (labeled $C$, $\neg C$, Even, Odd).
  **Teams:** 3 teams (6 students). Each acts as a bookie.

  **Market Rules**
  *   **Asset:** Bet on $A \to C$ ($A$: "1 or 2", $C$: "2 or 3"). Pays 1 chip if true, 0 if false.
  *   **Ramsey Pricing:** To set price, suppose $A$. Judge confidence in $C$. Post buy/sell price (e.g., 0.50 chips).
  *   **Trading:** Opponents buy/sell at posted prices. House settles after die roll.
  *   **Revision:** Changing a price costs 5 chips.
  *   **The Split:** Opponents choose a partition $B$ (e.g., $C$ vs $\neg C$). House certifies $B$ only if $A$ is possible given $B$ and given $\neg B$.
  *   **Split Pricing:** Price $A \to C$ *given* $B$ using Ramsey: Suppose $B$, then suppose $A$, judge $C$.
  *   **Coherence:** Total Price must equal weighted sum of Split Prices ($P(B) \times Price_B + P(\neg B) \times Price_{\neg B}$). Violation = House arbitrages difference (takes chips).

  **Exit Auction (Final Round)**
  Teams face nested bets (e.g., "If $A$, then if $B$, then $C$"). To survive without losing chips, declare one assumption to drop:
  1.  **Ramsey Equation:** $P(A \to C) \neq P(C|A)$.
  2.  **Propositionality:** Conditionals aren't unconditional bettable objects.
  3.  **Ramsey-in-Supposition:** $P(A \to C | B) \neq P(C | A \& B)$.
  4.  **Coherence:** LOTP/Price consistency doesn't apply to conditionals.

  **Timeline (75 mins)**
  *   **0–10:** Setup. Explain Ramsey test. Teams practice pricing $A \to C$ on whiteboard. Target: 1/2.
  *   **10–30:** Market Round 1. Teams post prices. Opponents trade. House rolls die. Settle bets.
  *   **30–50:** The Split Challenge. Team 2 challenges Team 1 on partition $\{C, \neg C\}$.
      *   Calculate Split Prices: Given $C$, $A \to C$ is certain (1). Given $\neg C$, impossible (0).
      *   LOTP Price: $P(C) \cdot 1 + P(\neg C) \cdot 0 = 1/3$.
      *   Conflict: Ramsey (1/2) vs Split (1/3). House arbitrages gap (takes 1/6 chip per bet).
  *   **50–60:** Revision Phase. Teams adjust prices to close gap. Charge revision fees. Watch them struggle to satisfy both Ramsey and Split.
  *   **60–70:** Exit Auction. Announce nested round. Teams declare which assumption (1–4) they drop to refuse specific bets. Run nested round.
  *   **70–75:** Debrief.

  **Debrief Script**
  *   **Map the Pain:** "When the House took your chips at minute 40, which rule caused it?"
  *   **The Four Exits:**
      *   Dropped **Ramsey**? You treat conditionals as material conditionals ($P=5/6$). Cost: Ignores supposition intuition.
      *   Dropped **Propositionality**? You refuse unconditional bets on 'if'. Cost: Conditionals aren't truth-apt.
      *   Dropped **Ramsey-in-Supposition**? You deny split prices are 1 and 0. Cost: Breaks logic inside suppositions.
      *   Dropped **Coherence**? You allow Dutch Books. Cost: Irrational pricing.
  *   **The Reveal:** "This conflict is Lewis's Triviality Result. You just proved that if (1), (2), (3), and (4) hold, then $P(A \to C) = P(C)$. Correlation vanishes. To keep conditionals meaningful, you must abandon one assumption."

  **Troubleshooting & Limits**
  *   **Truth-Functionalists:** One team will price $A \to C$ as $P(\neg A \lor C) = 5/6$. **Do not shut them down.** Let them get arbitraged by Ramsey-pricers in Round 1. Use their loss to show why material implication fails the Ramsey test.
  *   **Confused Splits:** Students may think $P(A \to C | C)$ is still 1/2. **Intervention:** "If you know $C$ is true, and you suppose $A$, is $C$ still true?" Force the 1/0 valuation.
  *   **What the Game Can't Show:** The game demonstrates inconsistency for *this* pair ($A, C$). It cannot demonstrate algebraically that *all* pairs collapse to independence without the general proof. **Assert this:** "You felt the break on this pair. Lewis proved this break happens for *every* pair where $0 < P(C) < 1$."
  *   **Time Creep:** The Split Challenge often drags. Hard stop at minute 50. Force the arbitrage penalty even if they haven't fully grasped why. The pain drives the debrief.

  **Instructor Notes**
  *   Keep chips visible. Losses must be physical.
  *   Write "1/2" and "1/3" large on the board during the Split.
  *   Do not mention Lewis or Triviality until the final 5 minutes.
  *   Ensure the Exit Auction forces a choice; no "keep all" allowed.
