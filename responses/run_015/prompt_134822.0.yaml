      *   *The Climax:* The "Load-Bearing" argument. If I drop this, the whole arch falls. You know the arch works. So you must be wrong about this brick.
      *   *Resolution:* Not necessarily agreement, but mutual understanding of *why* they disagree without calling the other irrational.

