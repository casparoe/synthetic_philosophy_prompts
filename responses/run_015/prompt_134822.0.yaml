      *   *Wait, a nuance:* The prompt asks to argue that disagreement *shouldn't always lower confidence*. This is the "Steadfast View" vs. "Conciliatory View." I need to justify the Steadfast View using Coherentism.
      *   *Justification:* If the belief is foundational to a framework that has successfully predicted other things (the "shared narrative"), abandoning it because of one outlier (even from a peer) causes more epistemic damage than holding steady.

  5.  **Drafting - Section by Section:**
