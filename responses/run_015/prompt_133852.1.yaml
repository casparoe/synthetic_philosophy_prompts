answer: |-
  Here is a pedagogical plan for the scene. It is designed to keep the decision theory rigorous while respecting the constraints of a dramatic dialogue.

  ### 1. The Prerequisites: What must be established first
  Before the word "updateless" can land, you need to build two specific conceptual platforms. If you skip these, the lawyer will treat UDT as either mysticism or simple stubbornness.

  *   **Platform A: Action vs. Policy.**
      *   *The Concept:* She thinks in terms of *actions* ("What do I do *now*?"). He needs to shift her to *policies* ("What rule do I follow for *any* situation like this?").
      *   *The Setup:* He needs to get her to agree that a decision is an output of an algorithm (her brain/reasoning), not a magical free will event.
      *   *Dialogue Beat:* He asks her to define her job. She says "Win cases." He corrects her: "No, you win cases by being the *kind of lawyer* who makes certain moves. You optimise the lawyer, not just the move."
  *   **Platform B: Logical Correlation (The "Twin" Intuition).**
      *   *The Concept:* UDT relies on the idea that your decision can be correlated with an outcome without *causing* it.
      *   *The Setup:* You need a scenario where two things match not because one pushed the other, but because they share a source code.
      *   *Dialogue Beat:* Use the cards. "If I shuffle this deck and deal two hands, and I look at mine and see the Ace of Spades, I know instantly you don't have it. I didn't *change* your hand. But my information updated my certainty about yours. UDT is about treating your decision like the Ace. It tells you about other places that algorithm runs."

  ### 2. The Case: The "Coin-Flip Favor" (Humanized Counterfactual Mugging)
  You are right to avoid Newcomb's Problem (it feels like a magic trick) and the Smoking Lesion (it feels medical/abstract). The canonical case for UDT is **Counterfactual Mugging**, but it usually involves a supernatural predictor ("Omega"). To make it human and repeatable, strip the magic and keep the logic.

  *   **The Scenario:**
      *   Yesterday, a friend (let's call him Alex) flipped a coin.
      *   **The Deal:** If Tails, Alex wires the Lawyer $10,000. If Heads, Alex asks the Lawyer for $100.
      *   **The Catch:** Alex only agrees to wire the $10,000 on Tails if he is *confident* the Lawyer will pay the $100 on Heads. Alex knows the Lawyer's reasoning style intimately (they've worked together for years).
      *   **The Moment:** The coin came up **Heads**. Alex is standing at the door asking for the $100.
  *   **Why this works:**
      *   **Small/Human:** It's money between friends, not boxes and gods.
      *   **Repeatable:** This isn't a one-off with a god; it's a recurring dynamic of trust and reputation.
      *   **The UDT Hook:** Causal Decision Theory (CDT) says: "The coin is already Heads. The Tails world is dead. Paying $100 changes nothing. Don't pay." UDT says: "If your policy is 'Don't Pay on Heads', Alex wouldn't have paid you on Tails. You must pay to be the kind of person who gets the $10k."
  *   **What it must NOT have:**
      *   Do not make Alex psychic. Make him *observant*. He knows her *algorithm* (her character).
      *   Do not make it a legal contract. If it's enforceable in court, it's just a contract. It must be unenforceable, relying purely on rational choice.

  ### 3. Precommitment: Where to Cash In and Where to Break It
  The lawyer's intuition about precommitment is your strongest bridge, but also the biggest trap.

  *   **Cash In (The Similarity):**
      *   Use her language. "It's like signing a plea deal before the discovery drops."
      *   UDT *is* a form of precommitment. It is choosing the policy *before* seeing the coin.
      *   *Beat:* He deals the cards face down. "You choose your strategy now, before you turn the card over."
  *   **Break It (The Difference):**
      *   **Enforcement:** Legal precommitment works because a judge enforces it. UDT precommitment works because *you* enforce it on yourself, rationally.
      *   **The Trap:** She will say, "But I can just tear up the contract now that I know the facts."
      *   **The Fix:** He must explain that in UDT, "tearing up the contract" changes the prediction Alex made yesterday. "You aren't breaking a promise to Alex. You're breaking the algorithm that got you the money in the other timeline."
      *   *Key Distinction:* Legal precommitment binds your *hands*. UDT binds your *source code*.

  ### 4. The Misconception Ladder (In Order)
  She will form these objections in a specific logical sequence. Head them off exactly here:

  1.  **"Refusing Evidence" (The "Ostrich" Objection)**
      *   *Her Objection:* "So I have to ignore the fact that the coin is Heads? That's irrational."
      *   *The Fix:* "You don't ignore the evidence. You use the evidence to know *which branch* of the policy to execute. You just chose the policy *before* you looked."
      *   *Timing:* Bring this up immediately after revealing the coin is Heads.

  2.  **"CDT + Precommitment" (The "Contract" Objection)**
      *   *Her Objection:* "This is just Causal Decision Theory with a contract bolted on. If I can't be sued, I walk."
      *   *The Fix:* "If you walk, you're rational *today*, but you're the kind of person who loses $10k *yesterday*. UDT asks: 'Which algorithm wins more money over all possible coin flips?'"
      *   *Timing:* When she tries to treat it as a legal loophole.

  3.  **"EDT in a Trenchcoat" (The "Correlation" Objection)**
      *   *Her Objection:* "Fine, paying is 'good evidence' I'm a good friend. But I don't care about evidence, I care about results." (EDT one-boxes but refuses Counterfactual Mugging).
      *   *The Fix:* "Evidential Decision Theory pays for the mugger only if it makes her feel good about herself. UDT pays because the *policy* of paying is what causes the Tails-world payout."
      *   *Timing:* If she starts talking about "signaling" or "reputation."

  4.  **"The Perfect Predictor" (The "Magic" Objection)**
      *   *Her Objection:* "This only works if Alex is a mind-reader."
      *   *The Fix:* "He doesn't need to read your mind. He just needs to know you reason like him. If you're both rational, your decisions are logically correlated. You're running the same software."
      *   *Timing:* When she dismisses the friend's judgment as guesswork.

  5.  **"Logical Counterfactuals" (The "Impossible World" Objection)**
      *   *Her Objection:* "You're asking me to optimize for a world that *doesn't exist* (the Tails world). That's insane."
      *   *The Fix:* (See Section 5 below).

  ### 5. The Hard Stuff: Logical Counterfactuals & Copies
  This is the beta reader's concern. In rigorous UDT/FDT, you optimize over "logical counterfactuals"—worlds where the math comes out differently, or where your algorithm outputs something it provably won't.

  *   **Does it belong in the scene?**
      *   **No.** Not the math. But the *intuition* must be acknowledged.
      *   **Where:** At the very end, when the candle is burning low.
      *   **How to handle it:** He should admit this is the "weird part."
      *   *Dialogue:* "It feels like caring about a ghost. A world where the coin was Tails. But your decision right now is the only thing that makes that ghost real."
  *   **Copies vs. Similarity:**
      *   **Strict UDT:** Requires exact algorithmic copies.
      *   **Human Scene:** Requires "sufficient similarity."
      *   **Advice:** Do not get bogged down in "substrate independence." Have him say: "It's not about clones. It's about anyone who thinks like you. If you and Alex reason the same way, your decisions are entangled."
      *   **The Wave-Off:** If she presses on the "impossible inputs" (optimizing over things your brain won't do), he should explicitly wave it off. "That's the math department's problem. For us, it's just: act as if your choice writes the rule for everyone like you."

  ### 6. The Ending: Naming and Understanding
  *   **Naming (UDT vs. FDT):**
      *   *Context:* Functional Decision Theory (FDT) is the 2017 refinement of UDT. It is more philosophically robust but less "famous."
      *   *Recommendation:* Have him use the term **"Updateless"**. It's descriptive and avoids the acronym soup. If he must name the theory, have him say "UDT" but add a qualifier: "Or Functional Decision Theory, depending on which paper you cite this week." This shows his expertise without confusing the reader.
  *   **The "Refusal":**
      *   He should refuse to explain **how to calculate the prior**.
      *   *Line:* "How do I weigh the probabilities?" / "That's the hard part. Tonight, we just decide if you're willing to pay the mugger."
  *   **The Final Lines:**
      *   **If she half-gets it (The "Bluff" Interpretation):**
          *   "So it's a reputation play. I pay the hundred so he trusts me next time."
          *   *(Critique: This is Iterated Game Theory, not UDT. She missed the "counterfactual" point.)*
      *   **If she fully gets it (The "Identity" Interpretation):**
          *   She pushes the money across the table.
          *   "I'm not paying you for the coin. I'm paying for the version of me that exists in the world where it came up Tails."
          *   *(Why this works: It shows she accepts the reality of the counterfactual optimization.)*

  ### Summary Checklist for the Scene
  1.  **Props:** Candle (lighting creates focus), Cards (for probability/policy), Cash (for stakes).
  2.  **Pacing:** Start with Policy (Cards), move to the Case (Coin/Favor), end with the Philosophy (Counterfactuals).
  3.  **Tone:** He is not preaching; he is troubleshooting her rationality. She is not stupid; she is anchored in *causal* reality (the law), which is why this is hard for her.
  4.  **The "Wince" Check:** Ensure he never claims UDT *changes* the past. It changes the *expected utility of the policy* which determines the past outcome in the counterfactual branch. Keep the causality one-way, the correlation two-way.

  This structure allows you to write dialogue that feels like a genuine intellectual discovery without sacrificing the technical integrity of the decision theory.
