answer: |-
  ### Brainstorming: Candidate Correspondences and Rejections

  Before settling on the partitioning model for audit, I mapped four competing structural analogies.

  1.  **Temporal Parts:** The *Past Self* deceives the *Present Self*.
      *   *Rejection:* Fails the static paradox. Self-deception usually involves synchronous contradictory states (believing *p* while avoiding evidence for *not-p* now), not just diachronic error. It also weakens culpability; why blame the present self for the past self's lie?
  2.  **Homuncular Agent:** A literal "little man" inside knows the truth and lies to the conscious host.
      *   *Rejection:* Regress problem (who deceives the little man?) and violates the unity of the subject. It solves the dynamic paradox by stipulation but at the cost of metaphysical coherence.
  3.  **Deflationary Bias:** No deception occurs; merely motivated reasoning or wishful thinking.
      *   *Rejection:* This abandons Job 2. If there is no deception, there is no intentional action to blame, only a cognitive malfunction. You cannot blame someone for a bias they do not control.
  4.  **Supervisor's Sub-Personal Filter:** A mechanical gating system blocks evidence from the personal-level agent.
      *   *Retention for Critique:* This avoids homunculi but risks eliminating agency. If the filter is sub-personal, the *person* isn't deceiving themselves; their machinery is deceiving them. This threatens the blame claim.

  I proceed with the **Partitioning Model** (the standard interpersonal analogy) as the primary target, as this is what your seminar is relying on to secure both possibility and blame.

  ***

  ### Structured Audit: The Interpersonal Analogy in Self-Deception

  #### 1. The Correspondence Table

  To evaluate the analogy, we must make the mapping explicit. Below is the standard mapping assumed by the partitioning view, alongside the specific role required for your Department Chair case.

  | Feature | Interpersonal Deception | Intrapersonal Self-Deception (Partitioning) |
  | :--- | :--- | :--- |
  | **Deceiver** | Distinct Agent A | Motivating Sub-system (or "Part") |
  | **Victim** | Distinct Agent B | Believing Sub-system (or "Conscious Self") |
  | **The Lie** | Proposition *p* asserted as true | False belief *p* adopted |
  | **The Truth** | Agent A knows *not-p* | Sub-system knows *not-p* |
  | **Channel** | Public communication/behavior | Attention/Access to evidence |
  | **Motive** | A's interest vs. B's interest | Psychic comfort/Status preservation |
  | **The Tell** | Inconsistency in A's behavior | Anxiety/Avoidance (Chair ignoring notebooks) |
  | **Success** | B believes *p*; A knows *not-p* | Subject believes *p*; Subject avoids *not-p* |

  #### 2. Disanalogies and Job 1 (Possibility)

  The first job is to dissolve the static and dynamic paradoxes. The analogy succeeds here only by importing features the mind may not possess.

  *   **Knowledge Divergence (Static Paradox):** In interpersonal deception, A knows *not-p* and B believes *p*. In the mind, this requires the subject to simultaneously know *not-p* and believe *p*. The analogy dissolves the contradiction by positing partitions (opaque boxes). However, this is merely a relabeling unless you explain *how* access is blocked without destroying unity. If the partitions are too permeable, the contradiction returns; if too rigid, you have two minds, not one.
  *   **Intentionality (Dynamic Paradox):** To deceive, one must intend to induce false belief. But to intend to believe *p*, one must take *p* to be false. The interpersonal analogy solves this by splitting the intention: the "deceiver part" intends the "victim part" to believe. The disanalogy here is **agency**. In interpersonal cases, both parties are agents. In the mind, if the "deceiver" is a subsystem, does it form intentions? If yes, we face a homunculus regress. If no, the dynamic paradox returns: how can a non-intentional system "intend" to deceive?
  *   **Channel Privacy:** In interpersonal cases, B lacks access to A's evidence. In the mind, the subject has privileged access to their own reasons. The analogy requires positing a "blind spot" mechanism. This is plausible (we ignore things), but calling it "deception" rather than "avoidance" requires the mechanism to be active, not passive.

  #### 3. Disanalogies and Job 2 (Blame and Agency)

  This is the critical section for your paper. You want to blame the Chair. The analogy smuggles in blame by assuming the "deceiver" is the agent.

  *   **Divergence of Interest:** In interpersonal deception, A harms B for A's gain. In self-deception, the "gain" (comfort) and "harm" (false belief) accrue to the same organism. If the parts are truly distinct, why is the *person* culpable? If the parts are not distinct, why isn't this just internal conflict (akrasia) rather than deception?
  *   **The Clinician's Challenge (Anosognosia):** Your housemate is right to flag this. In anosognosia, a patient denies paralysis due to brain damage. There is a "partition" (damage blocks access to motor data), a "false belief" (I can move), and a "tell" (confabulation). But we do not blame the patient. The disanalogy that matters is **control**. In interpersonal deception, the deceiver could have told the truth. In the Chair case, could she have looked? If the "deceiver" is a sub-personal filter (as your supervisor suggests), she could not have looked. **If the mechanism is sub-personal, blame is impossible.** You cannot blame a person for their spam filter's settings unless they set them intentionally.
  *   **Independent Confirmation:** In interpersonal cases, we can verify A's knowledge independently of B's belief. In self-deception, we infer the "knowledge" only from the avoidance behavior. This risks circularity: "She knows the truth because she avoids it; she avoids it because she knows the truth."

  #### 4. The Supervisor's Variant: The Spam Filter

  Your supervisor's move (sub-personal gating) solves the metaphysical worry (no homunculus) but catastrophically fails Job 2.

  *   **Relocating the Paradox:** The spam filter variant says the person doesn't intend to deceive; their brain filters evidence. This solves the dynamic paradox (no conscious intention required). However, it relocates the problem: How does a sub-personal filter "know" what evidence is inconvenient without representing the truth itself? If it represents the truth, it is a homunculus. If it doesn't, it is mere causal bias, not deception.
  *   **Blame Implication:** If the filter is sub-personal, the person is *deceived by* their machinery, not *deceiving themselves*. This makes the Chair a victim of her own architecture, akin to the anosognosic patient. To save blame, you must argue the person is responsible for the filter's configuration. But this requires a prior act of self-deception to set the filter, leading to regress.
  *   **Verdict:** The spam filter variant makes self-deception possible (Job 1) but renders it non-culpable (fails Job 2). It reduces self-deception to a malfunction.

  #### 5. "Part of Her Believes": Explanation or Redescription?

  Claiming "part of her believes *not-p*" is often a redescription of the data (she acts as if she knows) rather than an explanation. If "part" means a neural subsystem, it doesn't believe in the propositional sense required for deception. If "part" means a functional role, it risks being metaphorical. For your paper, you must insist that the "deceiver" is the **agent acting under a description**. The Chair isn't divided; she is unified but acting to maintain ignorance.

  #### 6. A Better Analogy: Strategic Ignorance (The Lawyer)

  The interpersonal deception analogy is too strong; it requires active fabrication. A better analogy for the Chair is **The Lawyer Who Never Asks**.

  *   **The Setup:** A lawyer suspects her client is guilty but refuses to ask the confirming question so she can ethically defend him while maintaining plausible deniability.
  *   **Why it fits:** It avoids the static paradox. The lawyer does not simultaneously believe *guilty* and *not-guilty*. She believes *guilty* is likely but ensures she lacks *knowledge*. She avoids the dynamic paradox because she does not intend to believe falsely; she intends to remain ignorant.
  *   **Blame:** This secures Job 2. The lawyer is culpable for the avoidance. The Chair is culpable not for believing falsely, but for **structuring her inquiry** to ensure false belief. This shifts the locus of blame from *belief formation* (involuntary) to *evidence gathering* (voluntary).

  #### 7. Empirical Flag and Unsettled Literature

  *   **The Decisive Empirical Finding:** We need evidence of **simultaneous contradictory neural activation** versus **sequential switching**.
      *   *Strengthens Interpersonal:* If neuroimaging shows distinct neural populations encoding *p* and *not-p* simultaneously during self-deception, partitioning is physically real.
      *   *Damages Interpersonal:* If data shows rapid switching (attention toggling) or suppression without distinct representation, the "deceiver" is just a temporal sequence of states, supporting the Strategic Ignorance model over the Partitioning model.
  *   **Unsettled vs. Confident:**
      *   *Confident:* Sub-personal mechanisms cannot ground moral blame. If the supervisor's model is correct, the Chair is not culpable in the way a liar is.
      *   *Unsettled:* The metaphysics of partitioning. Literature is divided on whether "sub-systems" can possess intentional states without being agents. There is no consensus on whether the static paradox is dissolved by partitioning or merely hidden.

  ### Conclusion

  The interpersonal analogy does too much work. It solves Job 1 by positing distinct agents (solving paradoxes) but fails Job 2 because distinct agents within a skull dilute personal responsibility (like the clinician's brain damage cases). Your supervisor's sub-personal variant saves the metaphysics but sacrifices blame. To secure culpability for the Chair, abandon the "deception" label in favor of **strategic ignorance**. The Chair is not a liar to herself; she is an avoidant agent. She is blameworthy not for the belief, but for the refusal to look. This captures the intuition of culpability without requiring a metaphysically dubious internal civil war.
