answer: |-
  Here is the direct commitment you asked for, structured for your journal club.

  ### The Verdict

  **1. Does this have a name?**
  Yes, but it is fragmented. In biology, this is **"Somatic Selection"** (or "Within-Organism Selection"). In philosophy of biology, it is often awkwardly shoehorned into the **Selected-Effect (Etiological)** account, but your intuition is correct: standard etiological accounts usually demand *evolutionary* history (cross-generational), whereas you are describing *developmental* or *physiological* history (intra-generational).

  The most precise philosophical carving for what you are noticing is **"Somatic Selected-Effect Function."** It is distinct from the standard Cummins "Causal Role" account because it grounds **normativity** (malfunction) via a history of selection, not just current contribution. It is distinct from the standard Millikan "Etiological" account because the selecting environment is the internal milieu of the organism, not the external evolutionary environment.

  **2. Are (1) and (2) the same phenomenon?**
  **Yes.** They are structurally isomorphic. Both involve:
  *   A population of variants (B-cell clones / synaptic weights).
  *   A selection pressure external to the variant but internal to the organism (antigen binding / correlated pre-post activity).
  *   Differential retention/proliferation based on performance against that pressure.
  *   A timescale compressed into the lifetime of the individual.

  Case (3) (bacterial enzyme induction) is **different**. That is a fixed regulatory switch. The *capacity* to induce was selected evolutionarily, but the specific instance of enzyme production is not the result of variation-and-retention within the lifetime. It is a "hard-coded" causal role triggered by an input. There is no somatic trial-and-error.

  **3. The Tumor Test (The Reductio)**
  You asked for a direct verdict: **Does the tumor cell have "functions" under this account?**
  **My Answer:** **Yes, but not *for the organism*.**

  Here is the carve-up that saves your category from being a mistake: Function is always relative to a **maintaining system**.
  *   In cases (1) and (2), the selection process itself (V(D)J recombination / Hebbian plasticity) is a mechanism maintained by the organism to serve the organism's viability. The "norm" is set by the organism's regulatory architecture. When an antibody fails to bind or a neuron fails to tune, it is a malfunction *relative to the organism's goal*.
  *   In a tumor, the selection process (clonal expansion of mutated cells) is **dysregulated**. The traits of the tumor cell (e.g., angiogenesis, rapid division) *do* have a selected-effect function **for the tumor lineage**. They were selected for within the soma because they aided the proliferation of that cell line. However, they are **pathological** relative to the organism because the selection process itself has escaped the organism's regulatory control.

  Therefore, your category is not a mistake. It correctly identifies that tumors *do* have functions (which is why they are so hard to kill; they are adapted), but it forces you to specify *whose* function it is. In neuroscience and immunology, we implicitly mean "function for the host." In oncology, we acknowledge "function for the tumor." The reductio fails because it assumes there is only one level of functional attribution. There are two: somatic function for the host (regulated selection) vs. somatic function for the lineage (unregulated selection).

  ### How this differs from the standard accounts

  *   **Vs. Causal Role (Cummins):** Cummins says function is just "what it does that contributes to the system." A tumor contributes to the system (by consuming resources, altering pH). Cummins has a hard time calling this a "malfunction" without appealing to external norms. Your "Somatic Selected-Effect" account handles malfunction better: a neuron that fails to tune during the critical period is not just "not contributing," it is violating the selection rule of the plasticity mechanism. The history of selection establishes the norm.
  *   **Vs. Standard Etiological (Millikan/Neander):** They require the trait to be selected by *natural selection* across generations. They struggle with the immune system (how can a novel antigen be an "etiological" function if the species never saw it?). They usually solve this by saying the *capacity* to learn was selected. You are going deeper: the *specific trait* (this antibody, this receptive field) has a function grounded in the *somatic* selection history, not just the evolutionary capacity.
  *   **Vs. Co-option/Vestiges:** A vestige has no current function (causal or selected). A co-option (exaptation) has a causal role but its etiological history is different from its current use. Your cases are neither. The current use *is* the result of the immediate selection history. It is a "fresh" etiology.

  ### My Commitment for your Journal Club

  Argue for **Somatic Selected-Effect Function**.
  1.  **Claim:** Functions in plastic neural tissue and adaptive immunity are grounded in within-lifetime selection processes, not just evolutionary history.
  2.  **Support:** This explains why we can confidently assert "malfunction" (e.g., amblyopia, immunodeficiency) even for novel stimuli. Pure causal-role accounts cannot ground malfunction easily; standard etiological accounts cannot handle novelty easily.
  3.  **Defense against Tumor Objection:** Acknowledge that tumors exhibit somatic selection. Concede that tumor traits *are* functional *for the tumor lineage*. Deny that they are functional *for the organism* because the selection mechanism is decoupled from organismal regulatory norms. This preserves the distinction between physiology (regulated selection) and pathology (unregulated selection).

  ### Where I am Least Confident (and what would change my mind)

  **The Weak Point:** The boundary between "regulated somatic selection" (physiology) and "unregulated somatic selection" (pathology).
  **Why:** In chronic pain or epilepsy, you have synaptic plasticity (selection) that is "successful" in the somatic sense (connections strengthen based on activity) but deleterious for the organism. Is this a "function" of the pain system or a "malfunction"?
  **What would change my mind:** If you can show me a case where the selection process is fully intact and regulated by the organism's normal signaling pathways, yet the outcome is consistently deleterious *without* any external pathology or injury. If the organism's own regulatory rules systematically produce "maladaptive" selection in a normal environment, then "Somatic Selected-Effect" might collapse back into "Causal Role" (i.e., it's doing what it was told to do, the instructions are just bad).
  **Current Stance:** I maintain that in cases like chronic pain, the selection rule is being hijacked by abnormal input (injury), similar to the tumor. The rule itself (Hebbian plasticity) is the adapted mechanism; the specific outcome is a malfunction of the system's homeostasis, not a function.

  ### Summary for the Slide Deck
  *   **Concept:** Somatic Selected-Effect Function.
  *   **Cases 1 & 2:** Same phenomenon (Darwinian populations within the soma).
  *   **Case 3:** Different (Regulatory switch, no somatic selection).
  *   **Tumor Case:** Traits have functions *for the cell lineage*, not the host. Distinguishes physiology (regulated selection) from pathology (runaway selection).
  *   **Advantage:** Grounds normativity (malfunction) for novel traits better than Causal Role; handles novelty better than Evolutionary Etiology.

  This gives you a defensible, distinct category that respects the biology without collapsing into "everything that does something has a function." Good luck on Thursday.
