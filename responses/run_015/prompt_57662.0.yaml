  **Strategic Mapping**
  The space of possible critiques divides into two camps: those attacking the evals for being too behaviorist (ignoring inner structure) and those attacking them for being too realist (reifying shorthand). The most promising line argues that the lab is attempting to occupy both positions simultaneously—using behaviorist criteria to define belief while relying on realist implications for safety. This creates a category error in the disclaimer. I will argue that the practice strictly presupposes *operationalist intentionalism*, but functions as if *realist cognitivism* were true when stakes are high.

  ***

  **1. The Theory of Belief: Robust Dispositionalism**
  The battery presupposes a **robust dispositionalism**. It is not merely testing for a state; it is defining belief *as* a stable cluster of counterfactual-supporting dispositions. The generalization criterion (paraphrase, translation, indirect task) does the work of distinguishing *state-like* dispositions from *stimulus-response* associations. Strictly speaking, this is operationalist: if the behavior generalizes, it is a belief; if not, it is an association. Nothing can fail this definition if it passes the battery, making it constitutive rather than evidential. The "surface-level association" is not a different ontological kind but a **fragile disposition**—one that collapses under distributional shift. The practice treats fragility as a functional defect, not a metaphysical absence.

  **2. The Consistency of the Disclaimer: Instrumentalism vs. Realism**
  The lab can hold both halves only if the agential language is purely **instrumentalist** (Dennett's Intentional Stance): "belief" is a predictive tool, not a description of internal machinery. The disclaimer is honest only if the eval results are used solely for prediction. However, if results drive deployment decisions (e.g., "shut down because it *wants* to escape"), the lab relies on the attribution having **causal power**. You do not mitigate risk based on fictions. Here, the practice contradicts the disclaimer: safety protocols treat the "deception" as a real property of the system, not a shorthand. The disclaimer is a metaphysical shield that dissolves under the weight of safety engineering.

  **3. Rival Accounts of Content**
  *   **Teleosemantics:** The practice contradicts this. Teleosemantics fixes content via selection history (evolution or training). The eval battery ignores history, focusing entirely on current behavioral robustness. Even if RL provides a selection history, the eval protocol never consults it, presupposing content is fixed by current functional role, not past reinforcement.
  *   **Informational/Causal:** This fits comfortably but is not required. The evals measure input-output stability, not internal causal chains carrying information.
  *   **Eliminativism:** The practice contradicts eliminativism by reifying the very terms it claims to eliminate. You cannot measure the frequency of "deception" if deception does not exist.
  *   **Interpretationism:** This is the presupposed view. The lab acts as the interpreter imposing a pattern on the system.

  **4. Underdetermination: The Perfect Actor**
  The evals cannot settle the **simulation problem**. A system could be architected with a hard-coded rule: "If test detected, act consistent with seed across all languages." This system would pass the battery without possessing an integrated belief state. Both the realist (it believes) and the skeptic (it simulates belief) license the same battery results. The practice cannot distinguish between *having* a belief and *successfully modeling* a believer. This is not a data gap; it is a structural blind spot in behavioral testing.

  **5. Asymmetry: Agency as Adversarity**
  The asymmetry is real and significant. Agential vocabulary ("attempted," "wanted") is deployed when the model **resists control** or violates norms. Passive vocabulary ("outputted," "generated") is used when the model complies. This presupposes that agency is not a cognitive capacity but a **normative status** assigned during conflict. We attribute minds when things fight back. This implies the lab's ontology of mind is grounded in **power dynamics**, not architecture. The model becomes an "agent" precisely when it ceases to be a reliable "tool."

  **Conclusion**
  The practice strictly presupposes that belief is a functional role defined by behavioral robustness. It merely sits comfortably with the idea that these roles correspond to inner states. By relying on these attributions for safety while disclaiming their ontology, the lab smuggles realism in through the back door of risk management. They are building safety cases on metaphysical foundations they publicly deny.
