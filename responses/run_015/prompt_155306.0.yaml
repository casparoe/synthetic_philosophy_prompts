      *   *The Critique:* Jurors are isolated, instructed, unanimous, and evidence is filtered. Voters are bombarded, uninstructed, majoritarian, and evidence is unfiltered.
      *   *Swiss Model:* Optional referendum (challenge laws), frequent, iterative. More like a continuing judicial review?
      *   *Brexit/California:* One-off, high stakes, campaign-driven. More like a snap verdict without deliberation.
      *   *Legitimacy:* Does the analogy make referendums look *more* democratic (solemn, fact-based) or *less* competent (voters aren't trained jurors)?

  3.  **Drafting the Correspondence Table:**
      *   *Judge:* Who controls the procedure? In court, it's the judge. In referendums, it's the Legislature/Election Commission (rules, wording).
      *   *Jury:* Citizens. In court, selected for impartiality. In referendums, all eligible voters (no screening).
      *   *Evidence:* In court, vetted, admissible. In referendums, campaign ads, media, social media (unvetted).
      *   *Verdict:* Guilty/Not Guilty vs. Yes/No. Binding in both (usually).
      *   *Appeal:* Higher court vs. Constitutional Court or subsequent legislation/referendum.

  4.  **Analyzing Silently Imported Norms:**
      *   *Presumption of Innocence:* In law, the status quo is "innocent" until proven guilty. In referendums, is the status quo (existing law) presumed good? Or is the proposal presumed neutral? Usually, the status quo prevails if "No" wins, implying a bias toward stability, but campaign rhetoric often frames the status quo as "guilty" of problems.
      *   *Exclusion of Prejudicial Material:* Courts exclude hearsay, emotional manipulation. Referendums thrive on emotional appeals, fear, and misinformation. Can this be fixed? (Fact-checking bodies, spending limits).
      *   *Unanimity:* Courts often require unanimity (or high majority) to ensure consensus. Referendums are simple majority (50% + 1). This is a huge disanalogy.
      *   *Judicial Instruction:* Judges tell jurors what law applies. Who instructs voters? Neutral government brochures (Swiss) vs. partisan rhetoric (UK/US).

  5.  **Distinguishing Swiss vs. Brexit/California:**
      *   *Swiss:* Optional referendum. Parliament passes law $\rightarrow$ Citizens can challenge. It's a *veto* point. Iterative. If rejected, Parliament can revise. More like a "judicial review" by the people.
      *   *Brexit/Prop 13:* Initiatives or advisory votes. One-off. High stakes. No easy revision. "Verdict" is final (politically).
      *   *Analogy Fit:* Swiss fits better (deliberative, iterative). Brexit fits poorly (snap judgment, no appeal).

  6.  **Evaluating Legitimacy vs. Incompetence:**
      *   *Proponent View:* Elevates voters to solemn arbiters. Legitimizes the outcome as "the people's will" akin to "justice."
      *   *Critic View:* Highlights voter ignorance. Jurors are *trained* and *shielded*; voters are not. The analogy exposes the *lack* of safeguards.
      *   *Conclusion:* The analogy is a double-edged sword. It grants dignity but invites scrutiny of procedural safeguards which referendums usually lack. It likely undermines the legitimacy claim when scrutinized deeply because the procedural rigor of a trial is absent.

