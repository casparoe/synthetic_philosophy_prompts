answer: |-
  To argue clearly, we must fix definitions. To "say" is to assert a truth-conditional proposition. To "express" is to manifest a non-cognitive attitude to an audience. An act is "derogatory" if it violates a convention prohibiting targeting a group. An act is "offensive" if it warrants negative reactive attitudes in an audience. My thesis is that derogatoriness is a property of the act relative to a norm, while offensiveness is relative to audience uptake. The stand-off between content-based, expressivist, and prohibition views arises from conflating these properties.

  Consider the **Homophonous Transplant**. A heritage speaker uses an L2-neutral term phonologically identical to an L1 slur within an L1 sentence, lacking knowledge of the L1 prohibition. Content-based views verdict "not derogatory" because the speaker says something neutral. Expressivist views verdict "not derogatory" because the speaker expresses no hatred. Both are wrong. The act is derogatory because it violates the L1 constitutive norm, regardless of internal state. The speaker has performed a prohibited act, even if unintentionally. This shows derogatoriness resides in the normative status of the word-form in the community, not the speaker's semantic content or psychological attitude.

  Next, **Survival without a Target**. A community uses a slur for witches as an expletive where no witches exist or are believed to exist. Content-based accounts fail here decisively. If derogatoriness lies in truth-conditional content predicated of a group, and the group is empty or the predication is absent, the utterance cannot be derogatory. Yet, using the word remains prohibited and harmful. Expressivist views also struggle; if no attitude is directed toward the target class (since none is believed to exist), the expressivist must claim the word is inert. But the word retains its toxic force. The norm-based view explains this: the prohibition attaches to the vehicle itself, not merely its successful application or associated attitude. The act is derogatory because it invokes a prohibited historical practice, even if the descriptive conditions are vacuous.

  Finally, **Audience-Free Inscription**. A speaker types the slur in a private diary. Standard prohibition views often conflate derogatoriness with offensiveness, implying that without an audience to be offended, no wrong occurs. But on my distinction, the act is derogatory (it violates the norm) though not offensive (no audience exists to warrant uptake). Content and expressivist views also falter; if nothing is said to anyone or expressed to anyone, they struggle to locate the harm. The norm view succeeds by separating the violation (derogatory) from the reaction (offensive). This explains why embedding data confuses the literature: negation tests what is said, not whether a norm was violated.

  The strongest objection is that this cannot distinguish slurs from ordinary profanity, as both are prohibited, nor explain reclamation. Profanity violates general decorum norms; slurs violate specific norms of equality and dignity rooted in oppression. The prohibition is qualitatively different. Regarding reclamation, norms are dynamic and subgroup-relative. When an in-group reclaims a term, they revise the norm locally, granting themselves permission. However, the out-group remains bound by the historical norm because the power relations sustaining the prohibition remain intact. The out-group speaker's use remains derogatory because they violate the norm governing their relation to the target, whereas the in-group speaker operates under a revised local norm.

  Thus, the debate is misplaced. Content and expressivist views explain what is said or expressed, but derogatoriness is a normative status of the act itself. Offensiveness is the audience's warranted response to that violation. Recognizing this dissolves the embedding puzzle: one can negate the content without negating the norm violation.

