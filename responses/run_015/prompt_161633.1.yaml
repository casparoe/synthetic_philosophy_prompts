answer: |-
  **INDEPENDENT LEGITIMACY ASSURANCE REPORT**

  **To the Stakeholders of the Sovereign Development Zone of Ostravia**

  **Opinion on the Legitimacy Statement**
  We have audited the accompanying Legitimacy Statement of the Ostravia Steering Committee (the "Administration"), which comprises the Performance Delivery Schedule and related notes for the fiscal year ended 31 December 2023. In our opinion, except for the effects of the matters described in the Basis for Qualified Opinion and Notes 3 and 4, the Authority held by the Administration is presented fairly, in all material respects, in accordance with the Output-Based Governance Framework (OBGF).

  **Basis for Qualified Opinion**
  Our qualification arises from the measurement methodologies described in Note 1 regarding counterfactual adjustments and the recognition of participation liabilities in Note 4. Additionally, we draw attention to the Going Concern paragraph below.

  **Going Concern**
  The Administration's authority is contingent upon the maintenance of positive variance in Key Performance Indicators (KPIs) against the regional baseline. Should the Compound Annual Growth Rate of Prosperity fall below the cost of capital for public order, or should volatility exceed risk tolerance thresholds, there exists a material uncertainty that may cast significant doubt on the Administration's ability to continue as a going concern. Our opinion is not modified in respect of this matter.

  **Emphasis of Matter – Substitutability of Authority**
  We emphasize that under the OBGF, legitimacy is derived solely from delivery efficiency. Consequently, Authority is not exclusive to the incumbent. Should a rival claimant (including foreign administrations or algorithmic governance modules) demonstrate a projected net-positive delta in delivery metrics, legitimacy transfers automatically to the superior provider. The Administration retains no inherent right to rule absent performance supremacy. Our opinion is not modified in respect of this matter.

  **Notes to the Legitimacy Statement**

  **1. Basis of Measurement and Counterfactual Adjustment**
  Prosperity is measured via GDP-plus adjustments; Order is quantified via Incident Suppression Rates. To isolate administrative value-add, reported growth is reduced by a "Competence Baseline"—an estimate of growth achievable under any merely competent administration absent specific intervention. This like-for-like adjustment ensures only marginal outperformance is credited to legitimacy capital. Management acknowledges that without this adjustment, organic market forces might be erroneously capitalized as political consent.

  **2. Engagement Terms and Metric Setting**
  VeriStat Global Partners was appointed and compensated by the Administration's Chief Performance Officer. The KPIs subject to this assurance were selected and weighted by the Administration. In their representation letter, Director-General Kaelen Voss and Chief Performance Officer Lira Tamm confirmed that excluded metrics (including civil liberty indices) were deemed immaterial to stability objectives. We assessed the rationality of metric selection but do not audit the propriety of excluding metrics deemed non-essential.

  **3. Unrecognized Intangibles**
  Items including popular consent, human dignity, and the procedural option to remove administration personnel are classified as intangible assets. Due to the lack of active markets and reliable measurement models, these items are carried at nil value on the Balance of Authority. They are considered impaired to zero given their indeterminacy and lack of cash-flow impact.

  **4. Deferred Participation Liability**
  The commitment to transition toward fuller stakeholder participation is recognized as a Long-Term Liability. However, due to contingent prerequisites regarding civic maturity and economic stability, this liability has no fixed maturity date. It is rolled forward annually without accrual of interest, contingent upon further notice from the Steering Committee. Management asserts that premature settlement would jeopardize operational continuity.

  **5. Distribution and Intergenerational Discounting**
  Prosperity distribution is weighted by cohort utility. Current population gains are discounted against future cohorts using a social time preference rate of 4.5%. Benefits accrued to persons not yet born are valued at net present value, resulting in a material reduction of obligations owed to future generations relative to current output. This ensures current capital allocation is not constrained by hypothetical future claims.

  **VeriStat Global Partners**
  *Certified Legitimacy Auditors*
  Ostravia City, 15 March 2024
