      *Let's check the empirical flags:*
      *   Compulsory voting turnout effects.
      *   16-year-old voting patterns.
      *   Administrative cost of proxy ballots.
      *   Legal preemption on non-citizens.

      *Let's check the "Losing Consideration":* The strongest argument against me is Individual Liberty (compulsion is coercive). I need to override this with the "Public Good" argument.

      *Let's check the "Science and Ideas" background:* Use clear, logical reasoning. Avoid jargon where possible.

      *Drafting the Brainstorm:*
