answer: |-
  ### Brainstorm: Candidate Framings

  1.  **Voting as Consent of the Governed (Lockean):** Only those who formally consent to the social contract vote. *Implications:* No non-citizens, no under-18s, no compulsion (consent must be voluntary), no proxy.
  2.  **Voting as Protection of Interests (Utilitarian):** If laws affect you, you must have a say. *Implications:* Yes 16, Yes non-citizens, Maybe compulsion (to ensure interests are heard), Yes proxy (parents protect kids' interests).
  3.  **Voting as Civic Duty (Republican):** Voting is work required to sustain the republic. *Implications:* Yes compulsion, Maybe 16 (civic education), No non-citizens (duty belongs to members), No proxy (duty is personal).
  4.  **Voting as Individual Expression (Liberal):** Voting is a right to express preference. *Implications:* No compulsion (coerced expression is invalid), No proxy (cannot express for another), Yes 16 (if autonomous), Yes non-citizens (if resident).
  5.  **Voting as Household Representation (Familial):** The family unit is the primary political block. *Implications:* Yes proxy, Yes 16 (within household), No compulsion (head of household decides), Maybe non-citizens (if established).
  6.  **Voting as Competence (Epistocratic):** Only the knowledgeable should decide. *Implications:* No 16, No compulsion (uninforced voters are noise), No proxy, No non-citizens (lack civic knowledge).
  7.  **Voting as Community Membership (Communitarian):** Voting defines who belongs. *Implications:* No non-citizens (until naturalized), No 16 (not full members), Yes compulsion (community obligation), No proxy.
  8.  **Voting as System Legitimacy (Functionalist):** Government authority requires high participation to function correctly. *Implications:* Yes compulsion, Yes expansion (broadens legitimacy base), No proxy (dilutes individual accountability).

  **Selected Frame:** **Voting as System Legitimacy via Civic Duty.**
  **Why:** Local government fails when turnout is low; legitimacy is a public good, not a private right. This frame supports expansion (1 & 2) to broaden the legitimacy base, compulsion (3) to ensure the quorum of participation, but rejects proxy (4) because legitimacy requires personal accountability.
  **Strongest Rival:** **Voting as Individual Expression.** It protects liberty but fails to solve the legitimacy crisis of low-turnout municipal elections.

  ***

  ### MEMORANDUM

  **TO:** Charter Revision Commission
  **FROM:** [Your Name], Commissioner
  **DATE:** October 1
  **SUBJECT:** Recommendation on Franchise Package Structure and Content

  **Bottom Line Up Front**
  I recommend we submit the franchise package to the November ballot as a **single bundled measure**. Splitting the items risks passing compulsory attendance without expanding the franchise (creating an authoritarian appearance) or expanding the franchise without securing turnout (failing to solve the legitimacy deficit). My recommendation on the contents is **Yes** to lowering the voting age to 16, **Yes** to voting rights for legal non-citizen residents (2+ years), **Yes** to compulsory attendance with a "none of the above" option, and **No** to proxy ballots for children. This package must include a **sunset review clause** triggering a mandatory Commission re-evaluation four years post-implementation to verify empirical outcomes. [Verify administrative capacity to manage sunset review logistics.]

  **The Frame: Voting as a Condition of Legitimacy**
  We must stop treating voting as a private right of expression and start treating it as a public duty of residence. In municipal governance, legitimacy is not derived from the consent of the governed alone, but from the participation of all those subject to authority. If the city holds power over your safety, your streets, and your schools, you hold a duty to staff the government that wields that power. This frame shifts the question from "Who deserves a voice?" to "Who must participate to make this authority valid?" This distinguishes our work from state and federal races; city hall is a service provider, and residents are its stakeholders.

  **Analysis of Items**

  **1. Voting Age 16 (Yes)**
  Under the Legitimacy Frame, the threshold for voting is subjection to city authority, not adult legal status. Sixteen-year-olds are subject to city zoning, park rules, curfew laws, and most critically, the school board policies we oversee. Excluding them creates a class of governed people without a mechanism to legitimize the authority over them. Furthermore, voting is a habit; capturing residents at 16 establishes a pattern of civic duty before the churn of adulthood disrupts it. [Verify whether 16-year-old voting patterns differ significantly from 18-24 cohort in local races.]

  **2. Non-Citizen Residents (Yes)**
  Citizenship is a federal status; residency is a municipal reality. Legal residents with two years of tenure pay taxes (directly or via rent), use sanitation services, and rely on police protection. To deny them the ballot is to tax and govern them without their participation in the authority structure, which undermines the legitimacy of the city itself. We exclude undocumented residents only due to the City Attorney's warning on preemption, not on principle. [Verify state preemption risk specifically regarding legal permanent residents vs. visa holders.]

  **3. Compulsory Attendance (Yes)**
  Low turnout is not a sign of contentment; it is a failure of legitimacy. When 20% of residents select 100% of the leadership, the government represents a faction, not the community. Compulsory *attendance* (not voting for a candidate) treats showing up as the duty. The "none of the above" box preserves conscience while ensuring the citizen acknowledges the government's existence. A waivable fine ensures compliance without punishing poverty. [Verify projected turnout increase vs. administrative cost of fine collection.]

  **4. Proxy Ballots for Children (No)**
  This is the hardest decision, but the frame demands it. If voting is a civic duty to legitimize authority, it is non-transferable. A parent cannot fulfill another soul's obligation to the community. While parents represent their children's *interests*, they cannot cast their *duty*. Proxy voting converts the voter from a citizen into a household head, shifting us toward a corporatist model rather than a democratic one. It risks inflating the political power of larger families without adding new independent perspectives to the electorate. [Verify administrative burden of verifying guardianship for proxy ballots.]

  **The Strongest Losing Consideration**
  The strongest argument against this package is **Individual Autonomy**. Critics will argue that compelled attendance violates liberty and that lowering the age dilutes the competence of the electorate. They view voting as an expression of will, which is spoiled by coercion or immaturity.

  I override this consideration because individual autonomy is already protected by the "none of the above" option and the waivable fine. You are not forced to choose; you are forced to acknowledge. In a city where critical infrastructure decisions are made by slim margins, the collective good of a legitimate, stable government outweighs the minor inconvenience of mandatory attendance. We are not building a system for the ideal citizen; we are building a system for the actual city. If we prioritize pure autonomy over participation, we retain the freedom to ignore a government that no longer represents us. That is not freedom; it is irrelevance.

  Bundle these items. Pass them together. Review them in four years.
