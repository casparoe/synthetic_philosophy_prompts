          *   Goal: Pick a frame, answer all 4 items consistently (yes/no mix allowed), explain why.

  2.  **Brainstorming Framings (Voting Purpose):**
      *   *Frame 1: Voting as Consent of the Governed.* (Lockean). Only those bound by laws should consent. Implies: No non-citizens (maybe), no kids (no legal responsibility), no compulsion (consent must be voluntary). Proxy? No.
      *   *Frame 2: Voting as Protection of Interests.* (Utilitarian/Representation). If you are affected, you should have a say. Implies: Yes non-citizens, Yes kids (via proxy?), Yes 16 (affected by schools/zoning). Compulsion? Maybe, to ensure interests are heard.
      *   *Frame 3: Voting as Civic Duty.* (Republican/Civic Humanism). Voting is work for the common good. Implies: Yes compulsion. Maybe 16 (civic education). No non-citizens (duty belongs to members). No proxy (duty is personal).
      *   *Frame 4: Voting as Expression of Autonomy.* (Liberal Individualist). Voting is self-expression. Implies: No compulsion (coerced expression is fake). No proxy (cannot express for another). Age 16? If competent. Non-citizens? If autonomous agents residing here.
      *   *Frame 5: Voting as System Stability/Legitimacy.* (Functionalist). High turnout = stable government. Implies: Yes compulsion, Yes expansion (more buy-in). Proxy? Maybe (household stability).
      *   *Frame 6: Voting as Household Representation.* (Familial/Corporate). The household is the unit of society. Implies: Yes proxy for kids. Maybe lower age. Compulsion? Yes (head of household duty). Non-citizens? If established household.
      *   *Frame 7: Voting as Competence-Based.* (Epistocratic lean). Only those who know best. Implies: No 16, No compulsion (uninformed voters), No proxy.
      *   *Frame 8: Voting as Community Membership.* (Communitarian). Voting defines who belongs. Implies: No non-citizens (until naturalized), No 16 (not full members). Compulsion? Yes (community obligation).

      *   *Selection:* **Voting as Protection of Interests (affected interests principle) + Civic Duty hybrid.** Let's refine. The prompt asks me to pick *one* frame and answer consistently.
      *   *Better Selection:* **Voting as Protection of Affected Interests.** This fits the local context (city services affect everyone present). It distinguishes between *capacity* to vote and *stake* in the outcome.
      *   *Why this frame?* It handles the non-citizen issue well (they pay taxes, use services). It handles the age issue (kids are affected by schools/parks). It struggles with compulsion (why force someone to protect their interest?) and proxy (can parents represent kids' interests?).
      *   *Actually, let's go with **Voting as Civic Duty for the Common Good**.* This aligns better with Compulsory Attendance. It treats voting not as a right to express preference, but as a job to staff the government.
      *   *Wait, the prompt says:* "whether an election discovers a will that's already out there or constructs one that wasn't... whether turning out is a public good... or an expression that's spoiled... compelled."
      *   *Decision:* I will choose **Voting as a Public Utility for Government Legitimacy.** (Functionalist/Democratic Stability). Voting isn't about *my* voice; it's about *our* government's authority.
      *   *Implications:*
          1.  Age 16: Yes, if they are subject to city authority (schools/zoning). Increases long-term habit.
          2.  Non-citizens: Yes, if they are subject to city authority (police/sanitation). Legitimacy requires governed consent.
          3.  Compulsory Attendance: Yes. Legitimacy requires high participation. "None of the above" preserves the "constructive" nature without forcing choice.
          4.  Proxy for Kids: No. Voting is a personal duty of the governed. Parents cannot fulfill the civic duty for another soul, even if they represent interests.
      *   *Strongest Rival:* Voting as Individual Expression (Liberal). This would kill compulsion and proxy, maybe age 16.
      *   *Why beat rival?* Local elections suffer from legitimacy deficits due to low turnout. Expression doesn't solve that; duty does.

      *   *Wait, looking at Item 4 (Proxy):* This is controversial. A "Public Utility" frame might actually support proxy if the goal is accurate representation of household interests. But if voting is a *duty*, proxy undermines it. Let's stick with Duty. It makes the "No" on proxy stronger.
      *   *Bundle vs Split:* The prompt says Mayor wants bundled, half want split. My frame (Legitimacy/Stability) suggests bundling ensures the whole system works together. Splitting risks passing compulsion without expansion (tyranny) or expansion without compulsion (low legitimacy). I'll recommend **Bundle**, but with a sunset clause to verify empirical claims.

  3.  **Drafting the Brainstorm:**
      *   List 6-8 frames.
      *   Show implications for the 4 items.
      *   Select "Voting as Civic Duty for Legitimacy."
      *   Explain why it beats "Voting as Individual Expression."

  4.  **Drafting the Memo:**
      *   **To:** Charter Revision Commission.
      *   **From:** [My Name/Role].
      *   **Subject:** Franchise Package Recommendation.
      *   **BLUF:** Bundle the measures. Adopt the "Civic Duty" frame. Yes to 1, 2, 3. No to 4. Sunset review in 4 years.
      *   **The Frame:** Voting is not a right of expression; it is a duty of residence to legitimize authority.
      *   **Item Analysis:**
          1.  Age 16: Yes. Subject to city authority (schools/zoning). Builds habit.
          2.  Non-citizens: Yes. Subject to city authority (police/taxes). Legitimacy requires governed consent.
          3.  Compulsory Attendance: Yes. Low turnout undermines legitimacy. "None of the above" protects conscience.
          4.  Proxy: No. Duty is non-transferable. Parents represent interests, but cannot vote the duty.
      *   **Losing Consideration:** Individual Autonomy (against compulsion). Override because local government fails without quorum of participation.
      *   **Empirical Flags:** [Verify turnout impact], [Verify administrative burden], [Verify legal preemption risks].
      *   **Word Count:** Aim for ~900 words.

  5.  **Refining the Argument:**
      *   Make sure the "No" on proxy is consistent with the "Yes" on compulsion. If voting is a duty, you can't delegate it. If voting is interest representation, proxy makes sense. So the frame *must* be Duty/Legitimacy.
      *   Make sure the "Yes" on non-citizens fits. If it's duty of residence, citizenship doesn't matter.
      *   Make sure the "Yes" on 16 fits. If it's subject to authority, 16-year-olds are subject to curfew/school/zoning.
      *   Bundle vs Split: If we split, we might get Compulsion without Expansion (authoritarian) or Expansion without Compulsion (low legitimacy). Bundling ensures the "Legitimacy" package is complete.
      *   Sunset Review: Crucial because of the empirical uncertainties.

  6.  **Writing - Section by Section:**
