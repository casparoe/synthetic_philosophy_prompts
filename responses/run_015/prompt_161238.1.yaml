answer: |-
  Here is a breakdown of the desiderata for a theory of biological function, tailored to your goal of underwriting claims in working biology and medicine.

  ### The Desiderata List

  **1. The Normativity Constraint (The Malfunction Requirement)**
  *   **The Case:** In medicine, a heart that cannot pump is broken, not merely different. A theory must distinguish between a trait failing to perform its function and a trait successfully performing a different causal role. Without this, "disease" becomes incoherent.
  *   **Status:** **Non-Negotiable.** Given your aim to support medical claims, this is the baseline. If a theory cannot ground malfunction, it is useless for pathology.

  **2. The Ahistorical Applicability Constraint (The Synthetic Requirement)**
  *   **The Case:** You specified organisms designed in a lab with no selection history. If function requires a past history of selection, synthetic organisms have no functional parts, only causal effects. A robust theory must assign functions to designed traits based on their intended role or current capacity, not just their ancestry.
  *   **Status:** **Non-Negotiable (for your purposes).** While traditional evolutionary biology might skip this, working biology and bioengineering cannot.

  **3. The Exaptation Constraint (The Utility Requirement)**
  *   **The Case:** Feathers existed before flight. A theory must account for traits that are currently useful for a specific task but were not selected for that task. We need to be able to say feathers are *now* for flight, even if they weren't *originally* for flight.
  *   **Status:** **Preference.** Some camps argue function is strictly about origin (so feathers weren't "for" flight until selected for it). Others argue function is about current utility. You likely want the latter for working biology, but it conflicts with strict historical views.

  **4. The Vestigiality Constraint (The Loss Requirement)**
  *   **The Case:** We need to identify parts that have lost their function (e.g., the human appendix or whale leg bones). A theory must allow for a trait to exist physically while lacking a function, or having a "lost" function, without claiming it still has a causal role that counts as functional.
  *   **Status:** **Non-Negotiable.** Medicine and evolutionary biology both rely on identifying parts that are no longer doing their job.

  **5. The Multi-Level Coherence Constraint**
  *   **The Case:** A gene has a function, a cell has a function, and an organ has a function. These functions interact but are not identical. A theory must scale from molecular mechanisms to whole-organism behaviors without changing its definition of "function" arbitrarily.
  *   **Status:** **Non-Negotiable.** Working biology operates across these levels simultaneously; a theory that breaks at the cellular level is insufficient.

  **6. The Temporal Indexing Constraint (Your Time-Scale Question)**
  *   **The Case:** You suspected time-scale is doing hidden work, and you are correct. A function claim is ambiguous unless we know if it refers to what the trait did over evolutionary time (phylogenetic), what it does over the organism's life (ontogenetic), or what it would do under idealized "normal" conditions. A heart pumping is a current event; a heart's function is a generalization.
  *   **Status:** **Non-Negotiable.** This should be on the list because ignoring it leads to category errors. A theory must explicitly state which time-scale anchors its function claims. If it doesn't, it cannot distinguish between a temporary failure and a permanent loss of function.

  ---

  ### The Time-Scale Issue
  You should absolutely put **Temporal Indexing** on the list as a desideratum. It is not a bad requirement; it is a necessary clarification. Most debates between etiological and causal-role accounts are actually disagreements about which time-scale matters. Etiological accounts anchor function in deep evolutionary time (past), while causal-role accounts anchor it in the current lifespan (present). Medicine often requires a third scale: "normal conditions" (a hypothetical standard). If a theory does not specify its temporal index, it cannot resolve conflicts between what a trait *did*, what it *does*, and what it *should do*.

  ---

  ### Incompatible Desiderata Pairs

  **1. Normativity vs. Ahistorical Applicability**
  This is the hardest tension for your specific list. To satisfy **Normativity** (malfunction), you usually need a standard of correctness to be violated. Historically, that standard is provided by selection history (SE theories). To satisfy **Ahistorical Applicability** (synthetic biology), you cannot rely on selection history. If you drop history to save synthetic biology, you struggle to explain why a synthetic heart is "broken" rather than just "different" without appealing to human intention, which some philosophers want to avoid in naturalized accounts.

  **2. Exaptation vs. Historical Origin**
  If you insist that function is strictly tied to **Historical Origin** (why the trait was selected), you cannot satisfy the **Exaptation Constraint** for traits like feathers-before-flight. If you insist function is tied to **Current Utility**, you satisfy exaptation but weaken the **Normativity Constraint**, because any current causal contribution counts as a function, making malfunction harder to define.

  ---

  ### The Knockout Requirement

  The single requirement that knocks out the most accounts is **The Normativity Constraint**.

  Purely descriptive accounts (like simple causal-role views) fail here immediately because they equate function with whatever effect a trait actually produces. If a heart pumps blood, it has function; if it quivers uselessly, it has a different function. They cannot say the quivering heart is *broken* without importing a standard from outside the system. While the Ahistorical requirement knocks out the dominant Selected-Effect theory, the Normativity requirement knocks out almost all non-teleological naturalistic accounts, which is the larger class of philosophical failures.

  ---

  ### Where the Major Families Fail

  **Selected-Effect (Etiological) Accounts**
  This family struggles most with synthetic biology and novel traits because it ties function strictly to past selection history, leaving designed organisms functionless. It also has difficulty accounting for exaptations, as it must claim a trait has no function for its current use until a new selection history is established.

  **Causal-Role Accounts**
  This family fails primarily on the normativity constraint, as it cannot distinguish between a trait functioning correctly and a trait merely causing effects, making malfunction conceptually impossible. It also tends to over-ascribe functions, implying that every causal contribution a trait makes (even harmful ones) counts as a function, which clashes with medical intuitions.
