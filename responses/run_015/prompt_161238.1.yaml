prompt: |-
  hey — I'm in a phil of biology seminar and we're on functions right now, and before I read any more of the etiological vs causal-role stuff I want to know what I should even be demanding of an account. Can you write me the desiderata list: what a theory of biological function has to get right, the case or consideration behind each requirement, and which ones are non-negotiable vs. just preferences of one camp.

  The purpose I care about is this: the theory should be good enough to underwrite function claims in working biology and in medicine — it should let us say what an organ or a behavior is *for*, and give us some grip on malfunction, so that a heart that can't pump counts as broken rather than as just doing something else.

  Cases I want on the list at minimum: a trait that still does what it was selected for but in a new environment; a trait that's useful now but wasn't selected for that (the feathers-then-flight sort of thing); a trait in an organism with no selection history at all because somebody designed the genome in a lab; dysfunction and vestigial parts; and the fact that the same item seems to have different functions at different grain — gene, cell, organ, whole organism.

  There's one thing I want you to chew on that I haven't seen in the readings: wether a theory has to say what time-scale a function claim is indexed to — what the part does over the organism's lifetime, vs. what it did over evolutionary time, vs. what it would do under some "normal" conditions. I suspect this is doing hidden work in the debate. Put it on the list as a desideratum, or tell me why it's a bad one.

  Also flag any pair of desiderata that probably can't be satisfied together, and say which single requirement knocks out the most accounts. Then two sentences each on where the selected-effect and causal-role families do worst. Please answer in American English, and skip any bibliography or citations — I'll fill in names myself.
