          *   Identify likely misconceptions (conflating with weighted averaging, treating departure from likelihood principle as error).
          *   Specify interception points for misconceptions.
          *   Provide one check-for-understanding question (non-binary partition).
          *   Specify omitted adjacent topics (e.g., Min-Entropy, Dempster-Shafer).
