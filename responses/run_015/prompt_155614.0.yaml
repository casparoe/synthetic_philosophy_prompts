      *   Partition: Signal is Green ($G$) or Red ($R$).
      *   Input: Due to fog, I assign $P_{new}(G) = 0.6, P_{new}(R) = 0.4$.
      *   Why not Bayesian? There is no proposition "I saw a blur" that I condition on. The blur *is* the probability shift.

