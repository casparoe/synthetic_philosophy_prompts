      *   Actually, the formula *is* $P_{new}(H) = P_{new}(E)P_{old}(H|E) + P_{new}(\neg E)P_{old}(H|\neg E)$.
      *   The misconception is thinking this equals $P_{old}(H | [P(E)=0.8])$.
      *   Or thinking it equals $0.8 \times P_{new\_if\_E}(H) + 0.2 \times P_{new\_if\_notE}(H)$.
      *   I need to make sure the example shows that $P_{old}(H|E)$ is the crucial invariant.

      *Let's refine the "Physicist" constraint:* The physicist frames it as "Bayesian inference with noisy priors." This usually means $P(Data|Hypothesis)$ is broad.
      *   My counter: In JRC, there is no "Data" proposition. The "Noise" is not a likelihood function $P(D|E)$; it is the direct assignment of $P_{new}(E)$.
      *   Structural difference: Standard Bayes updates via *likelihoods* ($P(E|H)$). JRC updates via *input probabilities* ($P_{new}(E)$) holding *conditionals* ($P(H|E)$) fixed.
      *   This is the crux. Standard Bayes: $P(H)$ changes because $P(E|H)$ differs from $P(E)$. JRC: $P(H)$ changes because $P_{new}(E)$ differs from $P_{old}(E)$, while $P(H|E)$ stays same.

      *Plan Structure:*
      1.  Phase 1: Secure Standard Conditionalization (SC).
      2.  Phase 2: The Breakdown (Uncertain Evidence).
      3.  Phase 3: The Physicist's Trap (Likelihoods vs. Direct Shifts).
      4.  Phase 4: The Solution (Rigidity & Formula).
