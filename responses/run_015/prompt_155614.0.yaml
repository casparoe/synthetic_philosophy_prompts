answer: |-
  # Teaching Plan: Jeffrey Conditionalization (50 Minutes)

  ## I. Conceptual Dependency Order
  *Do not deviate from this sequence. Each step creates the necessity for the next.*

  1.  **Secure Standard Conditionalization (SC):** Establish that SC is defined *only* when the evidence proposition $E$ becomes certain ($P_{new}(E) = 1$). The update rule is $P_{new}(H) = P_{old}(H|E)$.
  2.  **Pose the Problem of Uncertain Evidence:** Present a scenario where experience shifts the probability of $E$ to an intermediate value (e.g., 0.8) without making it certain. Show that SC is mathematically undefined here (cannot condition on a non-certain proposition).
  3.  **Intercept the "Noisy Data" Interpretation (Physicist's Objection):** Before offering the solution, explicitly block the move to model this as standard Bayes with a "noisy observation" proposition $O$. Clarify that Jeffrey updates take the probability shift *itself* as the primitive input, not a proposition $O$ that implies the shift.
  4.  **Introduce the Rigidity Condition:** Introduce this *before* the formula. Establish that to calculate $P_{new}(H)$ without new likelihoods, we must assume the probabilistic *relationship* between Hypothesis and Evidence remains unchanged ($P_{new}(H|E) = P_{old}(H|E)$).
  5.  **Derive the Formula:** Apply the Law of Total Probability using the Rigidity condition to generate the Jeffrey Rule.
  6.  **Solidify via Non-Binary Application:** Test understanding with a partition larger than two cells.

  ---

  ## II. The Carrying Example: "The Foggy Signal Light"
  *Do not use a jar-with-balls scenario.* A jar scenario implies a definite physical state (the ball *is* red) that is merely obscured, inviting the physicist to model the obscuration as a likelihood function $P(Experience|Color)$. Jeffrey's rule requires the experience to be non-propositional.

  **The Scenario:**
  *   **Hypothesis ($H$):** An approaching ship is **Hostile**. (Complement $\neg H$: **Friendly**).
  *   **Evidence Partition ($E$):** The ship's signal light is **Green** ($G$) or **Red** ($R$).
  *   **Prior State:** You know the reliability of the signals: $P_{old}(H|G) = 0.1$ (Green usually means Friendly) and $P_{old}(H|R) = 0.9$ (Red usually means Hostile).
  *   **The Jeffrey Input:** Due to thick fog, you do not see "Green" and you do not see "Red." You have a visual experience that directly shifts your confidence in the light's color to: $P_{new}(G) = 0.7$ and $P_{new}(R) = 0.3$.

  **Why this example works:**
  1.  **Visible Structural Difference:** In standard Bayes, you would need a proposition like "I saw a blurry greenish flash" ($O$) and a likelihood $P(O|G)$. In this scenario, there is no $O$. The input *is* the new distribution over $\{G, R\}$.
  2.  **Intermediate Probability:** It demonstrates that $P_{new}(G)=0.7$ is not a weighted average of "Conditioning on $G$" and "Conditioning on $R$." It is a direct assignment that *triggers* the weighted average of the *old* conditionals.
  3.  **Failure of SC:** You cannot calculate $P_{old}(H|G)$ and stop, because $G$ is not certain.

  ---

  ## III. Misconceptions and Interception Points

  ### Misconception 1: The "Weighted Update" Error
  *   **The Error:** Students (especially the physicist) will assume the rule is: $0.7 \times P_{new}(H|G) + 0.3 \times P_{new}(H|R)$. They will try to calculate what the probability of Hostility *would be* if they knew the light was Green, and average that with what it *would be* if they knew it was Red.
  *   **Why it's wrong:** This assumes the conditional probabilities *change* or need to be re-evaluated.
  *   **Interception Point:** **Immediately after introducing the Foggy Signal scenario, before writing the formula.**
  *   **Correction Strategy:** Emphasize that the fog affects your view of the *light*, not your understanding of the *signal protocol*. Your belief about "Hostility given Green" ($P(H|G)$) remains exactly what it was before the fog rolled in. The *conditionals* are the invariant bridge; the *evidence probabilities* are the variable input.

  ### Misconception 2: The "Likelihood Principle" Violation
  *   **The Error:** The physicist will argue that ignoring the specific visual data (the "noise") and just assigning $P_{new}(G)$ violates the Likelihood Principle, which states all evidence is in the likelihood function $P(Data|H)$.
  *   **Why it's wrong:** Jeffrey Conditionalization is not an inference *from* data; it is an update *driven by* a probability shift. It operates at a different level of abstraction than standard Bayesian inference.
  *   **Interception Point:** **During Step 3 (The Physicist's Trap).**
  *   **Correction Strategy:** State clearly: "Standard Bayes updates via *likelihoods* ($P(E|H)$). Jeffrey updates via *input probabilities* ($P_{new}(E)$). If you try to force a likelihood function onto the fog, you are modeling a different problem (Standard Bayes with uncertain data). Jeffrey's rule is for when the experience does not yield a proposition to condition on, but only a shift in confidence."

  ### Misconception 3: Conflating $P_{new}(E)$ with $P(E|Experience)$
  *   **The Error:** Treating $P_{new}(G)=0.7$ as shorthand for $P_{old}(G|Experience)=0.7$.
  *   **Why it's wrong:** This reintroduces the proposition "Experience" which Jeffrey explicitly wants to avoid (the "Myth of the Given").
  *   **Interception Point:** **When defining the Jeffrey Input.**
  *   **Correction Strategy:** Insist that $P_{new}(G)$ is a brute constraint on the new probability function, not the result of a conditionalization on a sensory proposition.

  ---

  ## IV. Check-for-Understanding Question
  *Administer this 10 minutes before the end. Do not allow use of the formula sheet.*

  **Scenario:**
  You are assessing a geological site.
  *   **Hypothesis ($O$):** The site contains Oil.
  *   **Partition:** The soil test result is **High** ($H$), **Medium** ($M$), or **Low** ($L$).
  *   **Priors:** $P_{old}(O|H) = 0.8$, $P_{old}(O|M) = 0.5$, $P_{old}(O|L) = 0.2$.
  *   **Jeffrey Input:** Due to equipment calibration drift, you do not get a specific result. Instead, your confidence in the test outcomes shifts directly to: $P_{new}(H) = 0.5$, $P_{new}(M) = 0.3$, $P_{new}(L) = 0.2$.

  **Task:**
  Calculate $P_{new}(O)$.

  **Correct Application:**
  $P_{new}(O) = (0.5 \times 0.8) + (0.3 \times 0.5) + (0.2 \times 0.2)$
  $P_{new}(O) = 0.40 + 0.15 + 0.04 = 0.59$

  **Diagnostic Value:**
  *   If they try to normalize the likelihoods, they missed the "Rigidity" concept.
  *   If they try to condition on "Medium" because it has the highest weight, they reverted to Standard Conditionalization.
  *   If they succeed, they understand that the *old conditionals* are weights applied by the *new evidence probabilities*.

  ---

  ## V. Deliberately Omitted Topics
  *Explicitly name these as "Out of Scope" to prevent advanced students from derailing the session with technical objections.*

  1.  **Minimum Relative Entropy (Min-Entropy):** Do not derive Jeffrey's rule as the solution that minimizes information distance. This justifies the rule but obscures the operational logic for this audience.
  2.  **Commutativity:** Do not discuss whether performing two Jeffrey updates in sequence $A$ then $B$ yields the same result as $B$ then $A$. (It generally does not).
  3.  **Dempster-Shafer Theory:** Do not contrast with belief functions. This confuses probability shifts with belief mass assignments.
  4.  **Field's Generalized Conditionalization:** Do not introduce formulations that allow the conditional probabilities themselves to change. Stick to the rigid case.

  ---

  ## VI. Timing Guide (50 Minutes)

  *   **00-05:** **Secure Standard Conditionalization.** Quick review. Emphasize $P_{new}(E)=1$ requirement.
  *   **05-15:** **The Foggy Signal (Problem & Input).** Introduce example. Block the "Noisy Data" interpretation. Define the Jeffrey Input.
  *   **15-25:** **Rigidity & Derivation.** Introduce Rigidity condition. Derive formula via Total Probability.
  *   **25-35:** **Misconception Interception.** Address the Physicist's Likelihood objection and the "Weighted Update" error explicitly.
  *   **35-45:** **Check-for-Understanding.** Administer the Geological/Oil question. Review answer collectively.
  *   **45-50:** **Boundaries & Close.** List omitted topics. Reiterate that JRC is for *uncertain evidence*, not *uncertain inference*.
