answer: |-
  Here is the translation of that old monk's logic into your soil ecology framework, followed by the residue report on how well the mapping holds.

  ### The Ecosystem Management Protocol (Aquinas Translated)

  **1. The Diagnosis: Canopy Dominance vs. Invasive Usurpation**
  First, you have to identify the type of problem plant you are dealing with. Aquinas draws a hard line between two conditions:
  *   **The Usurper (Invasive Species):** This is a plant that never had a right to be in the bed. It self-seeded where it shouldn't or was planted in violation of the original design plan. It has no deep taproot in the community's soil.
      *   *Management:* This is easier to pull. Since it has no legitimate root structure, removing it doesn't violate the garden's design.
  *   **The Legitimate Ruler Gone Bad (Overgrown Native):** This is a tree that was planted correctly, followed the original succession plan, but has grown so dense that it's starving the understory. It's a native species, but its canopy dominance is now choking the guild.
      *   *Management:* This is high-risk. You cannot treat this like a weed.

  **2. The Authority: Who Holds the Pruning Shears?**
  This is the most critical constraint. Aquinas argues that a single gardener (private individual) does not have the right to uproot a legitimate tree, even if it's shading out the tomatoes.
  *   **No Unilateral Pruning:** If one gardener decides to chop down the canopy tree on their own, they are causing unauthorized soil disturbance. This is treated as damage to the plot, not maintenance.
  *   **The Guild Decision:** The decision to remove a dominant plant must come from the collective management (the board) or a higher authority (the land trust/bylaws). It requires a consensus that the health of the whole plot outweighs the stability of the single tree.
  *   **The Higher Authority:** If the tree was planted by a previous head gardener, only someone with equal or greater authority (the board, the land owner) can authorize its removal.

  **3. The Risk Assessment: Soil Disturbance and Succession Failure**
  Aquinas warns that removing a tyrant often makes things worse. In garden terms, this is about **disturbance ecology**.
  *   **The Vacuum Effect:** When you suddenly remove a massive canopy tree, you create a light gap. If you don't have a succession plan ready, that gap won't be filled by your desired crops. It will be filled by fast-growing invasive weeds (a worse tyrant).
  *   **Root Shock:** Tearing out a dominant root system destabilizes the soil structure for everyone nearby. The mycorrhizal network gets severed. The neighbors' plants might wilt because the microclimate changed too fast.
  *   **The Verdict on Force:** Physically barring someone from the shed is like ripping out a root ball by hand during a drought. It causes immediate erosion. Even if the tree was blocking the light, the damage caused by the removal might kill the plot for the season.

  **4. The Conditions for Removal**
  So, when *is* it okay to cut the big tree?
  *   **Intolerable Shade:** The tyranny must be excessive. It's not just that the tree is big; it's that nothing else can grow underneath it. The cost of keeping it is the death of the rest of the garden.
  *   **No Better Alternative:** You have to be sure there isn't a lighter pruning method (checking powers, term limits) that fixes the shade without killing the tree.
  *   **Prepared Succession:** You must have seedlings ready to go in the moment the tree falls. You cannot create a vacuum. The community must be ready to plant the new leadership immediately to prevent weeds from taking over.

  ***

  ### Residue Report

  Here is where the gardening analogy works, where I had to stretch it, and where the logic breaks down.

  **1. What Maps Cleanly (The Ecology of Stability)**
  *   **Disturbance Theory:** Aquinas's fear of civil war maps perfectly to **soil disturbance**. He argues that violent removal creates chaos that allows worse actors (invasive weeds) to establish. Gardeners know that bare soil is an invitation to trouble.
  *   **Succession Planning:** His requirement that you must have a plan for what comes *after* the tyrant is identical to **succession planting**. You never clear a bed without knowing what goes in next.
  *   **Root Systems:** The idea that a leader has "connections" (patronage) that hold the soil together maps well to **rhizome spread**. Tearing them out rips the soil apart.

  **2. What I Had to Fudge (The Moral Agent)**
  *   **Intent vs. Function:** In a garden, a tree isn't "evil" for blocking light; it's just following its nature. In Aquinas's logic, the tyrant is *sinning*. He is morally guilty. I had to translate "sin" as "resource hogging," but that's not quite the same. A tree *should* seek light; a president *should not* seek absolute power.
  *   **The "Higher Authority":** In gardening, the higher authority is abstract (the climate, the bylaws, the land owner). In Aquinas's time, it was concrete (the Emperor, the Pope, the Feudal Lord). I mapped this to "The Board/Bylaws," but in your specific situation, the Board *is* the problem. Aquinas assumes there is always someone higher to appeal to. If the "Head Gardener" is the tyrant and there is no Land Trust above him, the garden analogy struggles to find the authority to authorize the pruning.

  **3. What Has No Equivalent (The Missing Piece)**
  *   **The Soul of the Pruner:** Aquinas cares deeply about the spiritual safety of the person doing the removing. He worries that killing a tyrant corrupts the killer, making them proud or violent. In gardening, **the pruner doesn't change**. If I cut a diseased branch, I don't become diseased.
  *   **Why this matters:** This missing piece means gardening logic is *simplistic* regarding human psychology. Aquinas would argue that even if Marco is right about the president, the act of physically barring him (using force) might turn Marco into the next tyrant. The "soil" of the community gets poisoned by the violence of the act, even if the "weed" is removed. Gardening doesn't account for the fact that the tool (force) changes the hand that holds it.

  ### The Verdict on Your Intuition

  Your intuition that "sometimes you have to cut the big tree" **holds up**, but Aquinas would say your friend Marco's method ("vote him out by force/physically bar him") **fails the protocol.**

  *   **You are right:** If a canopy is truly blocking all light, the ecosystem dies if you don't intervene. Stasis is not health.
  *   **Aquinas adds:** You cannot let one gardener grab the saw. It must be a guild decision. And you must have mulch and seeds ready for the moment the tree hits the ground, or you will spend the next three years fighting bindweed.

  **Summary:** The tree might need to go, but if you rip it out without a permit and without a succession plan, you aren't saving the garden; you're scalping the topsoil. The risk isn't just losing the tree; it's losing the fertility of the plot for everyone else.
