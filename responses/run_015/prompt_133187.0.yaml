prompt: |-
  Write the desiderata a theory resolving Carroll's tortoise regress must satisfy if it is to justify deduction—rather than merely describe it—for agents, human or artificial, who can be compelled to make every inferential step explicit. Specify the requirements: how it halts the regress without relying on a primitive rule-acceptance that the tortoise could reject; why it avoids both psychologism and circular appeal to the very deduction being justified; how it treats nested conditionals and inferences where the agent lacks explicit knowledge of the instantiated logical form; whether it respects the distinction between implicit inferential competence and explicit discursive entitlement; and whether it can accommodate the well-documented asymmetry in human reasoning reliability between modus ponens and modus tollens without dismissing it as pure performance error. For each, state the motivating case or constraint. Flag any pair you judge jointly unsatisfiable—particularly if blocking infinite ascent requires some form of non-inferential logical knowledge that is itself immune to discursive challenge—and identify the single requirement that does the most damage to the standard responses: rule-circularity defenses, meaning-constitutive accounts, and pragmatist appeals to implicit norms. Keep the weight on the criteria.
