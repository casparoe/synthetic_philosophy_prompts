answer: |-
  It is a pleasure to meet a fellow empiricist struggling with the metaphysicians. You are quite right to feel that "what is the mechanism?" is the only sensible question, but in this specific room, the mechanism is the very thing being debated. Brenda is not asking about the optics of the eye; she is asking about the architecture of the mind.

  You have a tenner on the table, so let us cut to the chase. I will analyze your three candidate rules against the Partial Mary case, deduce Brenda's operating system from her past rulings (the Simulation case is indeed the key), and give you a test case to settle the wager if the group splits.

  ### 1. The Three Frameworks on Partial Mary

  Here is how each of the three theoretical camps handles the protanope who gains red vision.

  **The Ability Camp**
  *   **The Rule:** Knowing what an experience is like is just having a set of skills: the ability to imagine the colour, remember it, and recognize it again.
  *   **Prediction for Partial Mary:** She gains new abilities (to imagine red, recognize red), but she already possesses the general *faculty* of colour imagination. She knows what it is to "visualize a hue"; she just adds a new item to the menu.
  *   **Surprise Level:** **Less surprised than Ordinary Mary.** Ordinary Mary has to build the entire machinery of colour imagination from scratch. Partial Mary just installs a new module into an existing, working factory. The shock is muted because the category "colour experience" is already familiar to her.

  **The Phenomenal Concept Camp**
  *   **The Rule:** Knowing what an experience is like means possessing a specific mental concept that can only be triggered by having the experience. You can have the physical facts without the concept.
  *   **Prediction for Partial Mary:** She acquires a new concept (RED*). However, she already possesses other phenomenal concepts (GREEN*, BLUE*). She understands the *logic* of phenomenal concepts—that they refer to private, qualitative states—even if she hasn't tokened this specific one.
  *   **Surprise Level:** **Less surprised than Ordinary Mary.** Ordinary Mary encounters a wholly new *kind* of thought. Partial Mary encounters a new *instance* of a kind of thought she already uses. The epistemic gap is smaller.

  **The Quality Space / Acquaintance Camp**
  *   **The Rule:** Colours are locations in a structured space. If you know the structure (the physics and the relations between hues) and you already occupy the space, you can deduce where the new colour sits.
  *   **Prediction for Partial Mary:** She already inhabits colour space. She knows the physics of the missing cone. She should be able to locate "red" in her existing quality space based on its wavelength and relation to yellow/green. The experience merely confirms the coordinate.
  *   **Surprise Level:** **Significantly less surprised (potentially zero).** If the structure is known, the experience is just filling in a blank on a map she already holds. Ordinary Mary has no map; Partial Mary has a map with one missing coordinate.

  ### 2. Decoding Brenda

  To win your bet, we must ignore the textbooks and look at Brenda's track record. She is inconsistent with standard labels, but consistent with herself.

  **The Critical Clue: The Simulation Case**
  Brenda's verdict on Simulation Mary is the Rosetta Stone. She said: *"If it's the equations on paper then no... The difference... is in whether the system has actually been exercised."*

  This verdict does two things:
  1.  **It kills the Quality Space theory.** If knowing the structure (the equations/theory) were enough, Simulation Mary would know. Brenda says she doesn't. Mere structural knowledge is insufficient.
  2.  **It refines the Ability/Concept view.** It tells us that the "knowledge" requires the *actual firing* of the subject's own neural machinery. It is not enough to process the data (the Robot case); the specific hardware must run.

  **Brenda's Profile**
  Brenda is a **Physicalist about Facts** (no new facts are learned, nothing becomes false) but a **Realist about Experience** (the Robot doesn't know, Inverted Mary is a real difference). She believes you need to *token* the state in your own brain to possess the knowledge. This is a hybrid of the Phenomenal Concept and Acquaintance views, but with a strict "own hardware" requirement.

  **The Verdict on Partial Mary**
  Brenda will say Partial Mary **does gain something** (the exercise of the new cone), but **learns no new facts**.

  Regarding the surprise: Brenda will rule that Partial Mary is **less surprised than Ordinary Mary**.
  *   **Reasoning:** Brenda's emphasis on the "system being exercised" implies that the *state* of the system matters. Ordinary Mary's system goes from "Colour Blind" to "Colour Capable." That is a phase change. Partial Mary's system goes from "Partial Colour" to "Full Colour." That is an expansion.
  *   Because Partial Mary already has the *context* of colour experience (she knows what it is to see a hue, she has the phenomenal concepts for blue/green), the arrival of red is an extension of an existing capacity, not the creation of a new one. The "shock" of the new is diluted by the familiarity of the medium.

  **My Advice for the Bet:** Back the claim that she is **less surprised**. If the bet is strictly "Does she learn anything new?", answer: "She gains a new experience/concept, but no new fact." (This matches Brenda's Ordinary Mary verdict).

  ### 3. The Tie-Breaker Case

  If the group splits between the **Ability Camp** and the **Phenomenal Concept Camp** (both predict "Less Surprised"), you need a case that separates *having the skill* from *possessing the concept*.

  Brenda's Simulation verdict leans toward "Exercise," which sounds like Ability. But her Robot verdict says "Sorting (Ability) isn't enough." This tension needs resolving.

  **The Case: "Mary with the Damaged Imagination"**

  **The Setup:**
  Mary (Ordinary) leaves the room, sees the red tomato, and gains the experience. She now knows what red is like. However, upon returning to the room, she suffers a specific, localized neurological deficit. She retains her memory of the event ("I saw red"), and if shown a red object she would recognize it, but she has permanently lost the ability to *voluntarily visualize* or *imagine* red in her mind's eye. The "hardware" for imagination is broken, but the memory trace remains.

  **The Question:**
  Does she still "know what red looks like"?

  **What it Shows:**
  *   **The Ability Hypothesis says NO.** Knowledge *is* the ability. If she cannot imagine it, she does not have the knowledge. She has lost the skill, so she has lost the knowing.
  *   **The Phenomenal Concept Hypothesis says YES.** Knowledge is possessing the concept. The concept was acquired during the experience. The inability to actively simulate it is a performance error, not a loss of knowledge. She still possesses the "file" on red, even if she can't open it to look at it.

  **Why this targets Brenda:**
  Brenda insists the system must be *exercised* to gain the knowledge (Simulation case). But does she believe the system must remain *exercisable* to *keep* the knowledge?
  *   If she says Mary **loses** the knowledge, she is an Ability theorist.
  *   If she says Mary **keeps** the knowledge, she is a Phenomenal Concept theorist.

  Given Brenda's realism about the "difference" in Inverted Mary (a structural difference that persists), I suspect she will side with **Phenomenal Concepts**. She views the experience as creating a real state in the brain (a concept), not just a temporary skill. The "exercise" is required to *create* the state, but not necessarily to *maintain* it.

  **Summary for Tuesday:**
  1.  **Partial Mary:** Less surprised than Ordinary Mary (expansion of existing capacity vs. creation of new capacity).
  2.  **Brenda's Logic:** Phenomenal Concepts requiring initial tokening (Simulation case rules out pure theory; Robot case rules out pure function).
  3.  **Tie-Breaker:** Mary who loses the ability to imagine but keeps the memory. If Brenda says she still knows, she's a Concept theorist. If she says she doesn't, she's an Ability theorist.

  Good luck with the tenner. If they start talking about "qualia" as if they are little glowing marbles, just remind them you spent forty years measuring chlorophyll fluorescence and you know a mechanism when you see one.
