      *   *Disagreement/Nuance:* Carnap was an *empiricist* and an *anti-metaphysician*. Structural Realism is often framed as a *realist* position (i.e., "the structure is *really* out there"). Carnap would be suspicious of the "realist" label if it implies a metaphysical commitment to mind-independent existence. He preferred pragmatic frameworks.
      *   *The "Metaphysics Coat-of-Tails":* The user asks if Carnap would see SR as his project with metaphysics added back. This is a very sharp insight. Carnap wanted to *eliminate* metaphysics. SR often tries to save realism *from* anti-realism, which involves ontological commitments Carnap might find pseudo-problems.

