answer: |-
  Here are seven questions designed to push past the standard elevator pitch of her theory, including the three specific angles you requested.

  ### 1. The Hemispherectomy Paradox (Required)
  **Question:** "We know that adults who have an entire hemisphere surgically removed (hemispherectomy) often recover and function as seemingly ordinary, single conscious subjects. If one half alone is sufficient for a whole person, why does *removing* half result in one person, but *disconnecting* that same half result in two? Why does the physical presence of the silent right hemisphere create a second subject where total removal does not?"

  *   **Likely Reply:** She will argue that in hemispherectomy, the remaining hemisphere takes over functions via plasticity, whereas in split-brain cases, the right hemisphere retains independent cognitive capacities that are merely blocked from expression.
  *   **Follow-up:** "So the existence of a second subject depends on whether the tissue is *capable* of thinking, not whether it's actually *doing* the thinking? If the right hemisphere is asleep or anaesthetised, does the second subject cease to exist temporarily, or is it just waiting in the wings?"

  ### 2. The Fibre-by-Fibre Sorites (Required)
  **Question:** "Imagine we perform the split-brain surgery not all at once, but by cutting the corpus callosum one nerve fibre at a time over the course of a year. At what specific cut does the single person become two people? Is there a sharp threshold where a new subject pops into existence, or is the number of subjects in a skull inherently vague?"

  *   **Likely Reply:** She will likely embrace vagueness, arguing that personal identity isn't a binary switch but a matter of degree, or that there is no fact of the matter during the transition.
  *   **Follow-up:** "If identity is vague, does that mean consciousness itself is vague? Can there be a period where it's neither true nor false that someone is suffering in that right hemisphere? That seems like a dangerous place to put the bar for moral status."

  ### 3. Discovery vs. Decision (Required)
  **Question:** "When you ask 'how many subjects are in there?', are you describing a metaphysical fact we can discover, like counting kidneys, or is this a conceptual framework we've decided to adopt because it explains the behaviour better? Is 'two subjects' a reality or a useful model?"

  *   **Likely Reply:** She will insist it is a discovery based on the dissociation of beliefs and intentions (e.g., the left hand buttoning a shirt the right hand just unbuttoned).
  *   **Follow-up:** "But we only know about those dissociated beliefs because the left hemisphere speaks for the whole body. If the metric for 'subjecthood' relies on the testimony of the interpreter, aren't we just counting the stories the left brain tells, rather than the minds actually present?"

  ### 4. The "Interpreter" in Healthy Brains
  **Question:** "You extend your theory to say that in healthy brains, the left hemisphere is constantly stitching together a story to create the illusion of a single 'I'. If that unity is a confabulation, does that mean the 'person' I think I am is a fiction? And if so, who is the audience for that fiction?"

  *   **Likely Reply:** She will likely clarify that the unity is functionally real even if mechanically fragmented, and that the 'I' is a narrative construct, not a homunculus.
  *   **Follow-up:** "If the 'I' is just a narrative construct generated by the left side, does the right side in a healthy brain have no stake in the future? Are we morally justified in ignoring the right hemisphere's preferences in a healthy skull because it doesn't get a vote in the story?"

  ### 5. Subcortical Connections
  **Question:** "Split-brain surgery cuts the corpus callosum, but it leaves the brainstem and other subcortical structures intact, which still allow for some emotional and sensory sharing. Why don't those remaining physical connections sustain a single subject? What makes the cortical connection the gold standard for unity?"

  *   **Likely Reply:** She will argue that subcortical connections support basic arousal or emotion, but not the high-level cognitive integration required for a unified "person" or rational agent.
  *   **Follow-up:** "So personhood is strictly a cortical club? If we develop technology to integrate two cortices digitally, would you merge two people into one? And if we severed that digital link, would we be killing a subject?"

  ### 6. Moral Responsibility
  **Question:** "If there are truly two conscious agents in one skull, our legal and moral frameworks break down. If the right hand strikes someone in anger, but the left hand claims it was an accident, which subject do we punish? Do we need two consent forms for medical procedures?"

  *   **Likely Reply:** She will likely concede that legally we must treat them as one unit for pragmatic reasons, even if metaphysically they are two.
  *   **Follow-up:** "But if morality should track the truth of the situation, aren't we effectively imprisoning an innocent subject (the left) for the crimes of another (the right) every time we punish a split-brain patient? Is pragmatism a good enough excuse to ignore a second consciousness?"

  ### 7. The Patient's Phenomenology
  **Question:** "Most split-brain patients report feeling completely normal and singular in their daily lives, despite the lab results. If there are two subjects, why doesn't it feel like two from the inside? Are we supposed to trust the lab data over the lived experience of the subjects themselves?"

  *   **Likely Reply:** She will argue that the speaking left hemisphere genuinely believes it is the whole person and is unaware of the right hemisphere's independent activity.
  *   **Follow-up:** "So the left hemisphere is deluded about its own nature? If the primary witness to the experience is systematically mistaken about whether they are singular or plural, what other evidence could possibly override their testimony?"

  ***

  ### My Commitments

  **The Opening Question:**
  I would open with **Question 1 (The Hemispherectomy Paradox)**.
  **Why:** It grounds the episode in hard medical reality immediately. It shows the guest (and the audience) that you aren't just going to let her float away into abstract metaphysics. It highlights a glaring tension in her physicalist argument: if brain tissue = subject, why does less tissue (removal) equal fewer subjects than more tissue (disconnection)? It forces her to defend the *mechanism* of her theory before she can sell the *implications*.

  **The "Wriggle" Question:**
  She will most likely wriggle out of **Question 2 (The Fibre-by-Fibre Sorites)**.
  **Why:** Philosophers love vagueness. It is the perfect escape hatch. By admitting that identity might be "vague" or "indeterminate" during the cutting process, she avoids having to name a specific fibre count that creates a soul. She can retreat into the position that "personhood" is a fuzzy concept, which insulates her theory from being proven wrong by any specific physical measurement. It's the hardest question to pin her down on because the "correct" philosophical answer often *is* to embrace the vagueness.
