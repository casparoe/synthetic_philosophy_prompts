prompt: |-
  okay so i'm drafting this novel about propaganda and language, and my writting group keeps fighting about Orwell in a way that feels totally stuck. we all agree he hated beaurocratic jargon and that Newspeak in 1984 is meant to limit thought, but then it splits: one camp says he's a full-on linguistic determinist, shrink the vocabulary and you literally shrink what's thinkable, like Sapir-Whorf with a totalitarian twist. the other camp says he's just describing social control — regimes manipulate words to suppress dissent, not that grammar causes belief. we've circled this for months with nobody moving. is this a real substantive disagreement about causation, or is it verbal — are we just using 'determines' in different ways? or are we actualy answering different questions, one about cognitive psychology and one about political sociology, without noticing? and here's the weird thing i can't shake: Orwell writes these gorgeous long sentences in the essays where he defends English, then switches to staccato punch when he's being political. so maybe the hidden crux isn't determinism at all, but whether clarity is an aesthetic virtue or a moral duty — and all the determininsm talk is just cover for that. if that's the diagnosis, what would count as progress? closer archival work on his drafts? comparing him to contempories who wrote about language and power? or is it just bedrock intuition about whether words can actualy trap you, meaning nothing will move it? also i keep writing 'determininsm' instead of determinism in my notes, which feels appropriate.
