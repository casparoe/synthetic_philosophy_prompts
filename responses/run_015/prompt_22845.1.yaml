prompt: |-
  I'm a retired neuroscientist — decision making was my whole career — and I only recently got into philosophy, so I may be using the terms wrong. I sit on my hospital's AI governance commitee, and we vote next month on a system that infers each patient's treatment preferences from behavior: past choices, how answers shift when the same option is rephrased, even passive cues like how long someone hovors over a choice. It's meant to personalize recommendations and to fill in advance directives when a patient can no longer speak for themselves. I can't shake three worries, and I'd like a short memo I can circulate before the vote that takes them seriously. (1) My own field shows that choices flip with framing, so is there a stable "preference" for the system to infer at all, or is it just fitting the noise of how the question was asked? (2) For a patient in chronic pain or early dementia, current behavior may reflect what they've adapted to rather than what the person they used to be would want — whose preference should count? (3) When a patient can still state what they want, do we trust the words or the behavior, and what do we do when the two disagree? Give us a clear recommendation — approve, reject, or approve with conditions — with the reasoning, and be honest about the strongest case for the side you're not picking. Keep it followable by non-technical members.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **User:** Retired neuroscientist (expert in decision-making), new to philosophy, sits on a hospital AI governance committee.
      *   **Task:** Write a short memo to circulate before a vote on an AI system.
      *   **System:** Infers patient treatment preferences from behavior (past choices, framing effects, hesitation/hovering). Used for personalization and filling advance directives when incapacitated.
      *   **Three Specific Worries:**
          1.  *Stability of Preference:* Neuroscience shows choices flip with framing. Is there a stable "self" to infer, or just noise?
          2.  *Adaptation vs. Authenticity:* Chronic pain/dementia patients adapt. Do we honor the adapted self or the past self?
          3.  *Words vs. Behavior:* When a patient can speak, but behavior contradicts words, which wins?
      *   **Requirements:** Clear recommendation (Approve, Reject, or Approve with Conditions), reasoning, acknowledge the strongest counter-argument, accessible to non-technical members.
      *   **Tone:** Professional, persuasive, ethically rigorous, respectful of the user's expertise.

  2.  **Determine the Recommendation:**
      *   *Option A (Approve):* Too risky given the philosophical and neuroscientific uncertainties raised.
      *   *Option B (Reject):* Potentially throws away a useful tool for incapacitated patients where *some* inference is better than none.
      *   *Option C (Approve with Conditions):* This is the most balanced and responsible path. It acknowledges the utility but mitigates the specific risks raised by the user's neuroscience background.
      *   *Decision:* **Approve with Strict Conditions.** This aligns best with medical ethics (beneficence vs. autonomy) and the user's specific concerns about the validity of the data.

  3.  **Drafting - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the purpose clearly. Acknowledge the promise but highlight the ethical risk.
      *   **Addressing Worry 1 (Stability/Neuroscience):**
          *   *Concept:* Preference construction vs. revelation.
          *   *Memo language:* "Preferences aren't buried treasure; they are built in the moment." The AI might be mistaking framing effects for deep values.
          *   *Mitigation:* The AI shouldn't claim to find *the* truth, but rather a *probabilistic estimate* subject to review.
      *   **Addressing Worry 2 (Adaptation/Identity):**
          *   *Concept:* The "Parfit" problem or adaptation paradox.
          *   *Memo language:* Distinguish between "experiential self" (current pain state) and "narrative self" (past values).
          *   *Mitigation:* Priority to prior written directives if available. AI fills gaps, doesn't overwrite.
      *   **Addressing Worry 3 (Words vs. Behavior):**
          *   *Concept:* Expressive vs. Revealed preference.
          *   *Memo language:* Spoken word is the gold standard of autonomy. Behavior is secondary.
          *   *Mitigation:* "Human-in-the-loop." If they can speak, the AI is silent.
      *   **Recommendation:** Approve with Conditions.
      *   **Counter-Argument:** Acknowledge why someone would want to approve fully (urgency, lack of directives, AI is better than guesswork).
      *   **Conclusion:** Call to action.

  4.  **Refining the Tone:**
      *   The user is a neuroscientist, so the memo should reflect scientific rigor but translate it for lawyers, admins, and clinicians.
      *   Avoid overly dense jargon (e.g., don't say "diachronic identity conditions," say "who counts as the patient").
      *   Ensure the "Neuroscientist" perspective shines through (e.g., mentioning framing effects explicitly).

  5.  **Drafting - Iteration 1 (Mental Check):**
      *   *Critique:* Is it too long? Keep it tight.
      *   *Critique:* Did I answer all three worries? Yes.
      *   *Critique:* Is the recommendation clear? Yes.
      *   *Critique:* Is the counter-argument fair? Need to make sure I don't strawman the "Approve" side. The strongest case for them is *beneficence* (doing something is better than nothing).

  6.  **Drafting - Iteration 2 (Polishing):**
      *   Make the conditions specific.
      *   Condition 1: AI is advisory only, never binding.
      *   Condition 2: Hierarchy of evidence (Written > Spoken > Inferred).
      *   Condition 3: Audit for framing bias.
      *   *Self-Correction on Worry 1:* Emphasize that the AI might be learning the *bias* rather than the *preference*.
      *   *Self-Correction on Worry 2:* Use the term "adaptation" carefully.
      *   *Self-Correction on Worry 3:* Explicitly state spoken word overrides behavioral inference.

  7.  **Final Review against Constraints:**
      *   Short memo? Yes.
      *   Clear recommendation? Yes.
      *   Addresses 3 worries? Yes.
      *   Non-technical audience? Yes.
      *   Honest counter-argument? Yes.

  8.  **Final Polish:** (Writing the actual response based on the above thought process.) *Ensure the voice sounds like a colleague speaking to a committee, not a lecture.*

