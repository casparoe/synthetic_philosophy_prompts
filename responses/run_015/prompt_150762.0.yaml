  **PREP SHEET: Q&A Strategy**
  **Talk:** Diachronic Coherence as Inter-Agent Betting
  **Audience:** Behav Econ (pro-hyperbolic) + Formal Epist (prudence vs rationality)

  **OPENING CONCESSION:**
  Start by admitting that treating future selves as "separate agents" is a *modeling assumption*, not an ontological claim about split personalities. If you don't concede this, the epistemologists will eat you alive on metaphysics before you get to the math. Say: "I'm not claiming you literally become a stranger tomorrow, just that the coherence constraints hold *as if* you were."

  **THE OBJECTIONS (Ordered by Damage)**

  **1. The "No Global Loss" Objection (The Dreaded One)**
  *Who:* The senior formal epistemologist.
  *They'll say:* "If you treat the future self as a separate betting agent, you dissolve the single ledger required for a Dutch Book. A book between me and you isn't irrationality, it's just trade. Where is the global utility loss if the agents are distinct?"
  *Your Reply:* "Great question. The 'ledger' isn't the agent's psychology, it's the resource pool—the body. Even if we model them as separate agents, they share a wallet. If Future Self exploits Present Self, the organism loses resources overall. The coherence constraint isn't about mental unity, it's about resource preservation across the sequence. We're defining rationality as the strategy that prevents the sequence from being drained, regardless of how we individuate the selves."
  *Soft Spot:* You're smuggling in "body" as the rational unit without justifying why the body matters more than the agent.
  *Time:* 2 mins.

  **2. Prudence vs. Rationality**
  *Who:* The other epistemologist.
  *They'll say:* "This looks like prudence, not rationality. Ramsey-de Finetti is about synchronic coherence. Extending it across time is just being smart about planning, not a requirement of rationality proper."
  *Your Reply:* "I'd argue the line is blurrier. Synchronic coherence prevents you from believing A and not-A simultaneously. Diachronic coherence prevents you from valuing X now and disvaluing X later without new info. If rationality is about aligning actions with valuations, then time-indexed valuations still need to cohere. Prudence implies it's optional; I'm showing it's a structural constraint on agency itself."
  *Soft Spot:* Hard to prove why time doesn't change the norm type.

  **3. Genuine Preference Change**
  *Who:* Behavioral econ crowd.
  *They'll say:* "Preferences change. That's not inconsistency, it's growth. Why is violating EU max irrational if my future self legitimately wants something different?"
  *Your Reply:* "If the change is due to new information, EU handles that. But hyperbolic discounting is predictable preference reversal without new info. The Dutch Book exploits the *predictability* of the change. If you know you'll change your mind arbitrarily, and you don't account for it, you're leaving money on the table. That's the incoherence."
  *Soft Spot:* Distinguishing 'arbitrary' change from 'legitimate' change is messy.

  **4. Descriptive Accuracy**
  *Who:* Lead behavioral economist.
  *They'll say:* "People *are* hyperbolic. It's descriptively accurate. If your norm says everyone is irrational, the norm is useless."
  *Your Reply:* "Descriptive accuracy doesn't validate the norm. We have visual illusions too; knowing they exist doesn't make them veridical. My point isn't that people don't do this, but that doing it makes them vulnerable. The norm stands even if everyone violates it—it just means everyone is vulnerable."
  *Soft Spot:* Behav econs hate the 'is-ought' split when it dismisses their data.

  **5. Normative Force (So What?)**
  *Who:* Junior behav econ.
  *They'll say:* "Okay, I'm incoherent. So what? If I'm happy with my choices, why should I care about some abstract Dutch Book?"
  *Your Reply:* "Because the book gets cashed. In markets, these inconsistencies are arbitraged. You might be happy until you realize you've paid twice for the same outcome. The 'ought' comes from the cost. If you care about having resources to satisfy *any* preferences, you need coherence."
  *Soft Spot:* Transaction costs often prevent actual arbitrage in real life.

  **6. The Mechanism Problem**
  *Who:* Either side.
  *They'll say:* "Future You can't actually place a bet against Present You. How is this a real book?"
  *Your Reply:* "It's a theoretical constraint, like logic. You don't need a literal bookie to violate modus ponens. The 'bet' is the choice structure itself. If your choices imply a guaranteed loss sequence, the book exists logically, even if no one signs a contract."
  *Soft Spot:* Epistemologists might push on the 'betting interpretation' of credence.

  **WHAT TO CONCEDE UPFRONT:**
  Admit that "separate agent" is a heuristic. Don't fight the metaphysics.

  **THE DREADED OBJECTION:**
  This is #1 above. If they ask this, you're on the ropes. Stick to the "shared wallet" defense.

  \answer{"If you treat the future self as a separate betting agent, you dissolve the single ledger required for a Dutch Book. A book between me and you isn't irrationality, it's just trade. Where is the global utility loss if the agents are distinct?"}
