answer: |-
  **LOGICAL SPACE & STABILITY**
  **Axes:** 1. Outcome (Result Luck), 2. Intervention (Attempt Luck), 3. Constitution (Makeup). 8 Theoretical Cells.
  **Occupied:** *Control* (No/No/Agency), *Pragmatist* (Yes-Treatment/No-Desert/Agency), *Full Luck* (Yes/Yes/Agency), *Skeptic* (Yes/Yes/No Agency), *Evidential* (Yes-as-Proof), *Success-Justifier* (Retrospective).
  **Empty/Unstable:**
  *   *Desert differs, Treatment same:* Unstable. If inner guilt differs, external punishment usually follows.
  *   *Constitution kills Agency, Outcome matters:* Incoherent. If makeup destroys agency, results cannot be held against them.
  *   *Secret wrong deserves less:* Unexplored. Confuses detection (epistemic) with guilt (metaphysical).

  **DIAGNOSTIC TREE**

  **1. THE JAM VS. THE BIRD**
  Two people try to kill. One's gun jams. One's gun fires but a bird blocks the bullet. Neither victim dies.
  *   **A:** They are equally wrong. → Go to 2.
  *   **B:** The jammer is worse (they tried harder/closer). → **LEAF: INTENT PURE** (Only mental state matters).
  *   **C:** The shooter is worse (they released energy). → **LEAF: CAUSALIST** (Physical chain matters).

  **2. THE DRUNK DRIVERS**
  Two drivers drink the same amount, drive equally badly. One hits a child, one does not.
  *   **A:** They are equally wrong. → Go to 3.
  *   **B:** The one who hit the child is worse. → Go to 4.

  **3. THE LOADED GUN (Consistency Check)**
  Someone leaves a loaded gun where a child can reach it. Child finds it (no harm) vs. Child shoots someone.
  *   **A:** Equally wrong. → **LEAF: STRICT CONTROL** (Luck never touches blame).
  *   **B:** Worse if harm happens. → **LEAF: EVIDENTIAL** (Outcomes matter only as proof of danger/intent).

  **4. DESERT VS. TREATMENT**
  (For those who said Driver B is worse in Q2.) Is the difference in *how bad their choice was*, or only in *what laws/punishments we apply*?
  *   **A:** Only what we apply (rules need clear lines). → **LEAF: PRAGMATIST** (Outcomes change permission, not desert).
  *   **B:** How bad the choice was. → Go to 5.

  **5. THE ARTIST (Retrospective)**
  Someone abandons their family to make art. They become a genius vs. they fail and produce nothing.
  *   **A:** Success makes the abandonment less wrong. → **LEAF: SUCCESS JUSTIFIER** (Outcomes justify past risks).
  *   **B:** Success changes nothing. → Go to 6.

  **6. THE SECRET WRONGDOER**
  Someone does something awful. Nobody ever finds out.
  *   **A:** They deserve punishment anyway. → Go to 7.
  *   **B:** No punishment deserved if unknown. → **LEAF: EPISTEMIC PRAGMATIST** (Desert requires discovery).

  **7. THE REMORSE CAPACITY (Constitution)**
  Someone was raised unable to feel guilt or remorse. They do something bad on purpose.
  *   **A:** They are still responsible. → **LEAF: FULL MORAL LUCK** (Luck affects desert, agency intact).
  *   **B:** They are not responsible. → **LEAF: SKEPTIC** (Constitutive luck eats agency).

  **FLAGS & NOTES**
  *   **Indistinguishable:** *Intent Pure* (Q1-B) and *Strict Control* (Q3-A) often overlap. **Test Case:** A driver intends no harm but drives drunk (negligence). *Intent Pure* excuses them; *Strict Control* blames them for the risk.
  *   **Redundant:** *Evidential* (Q3-B) and *Full Moral Luck* (Q7-A) can sound similar. **Distinction:** *Evidential* says the harm reveals the prior risk; *Full Luck* says the harm itself adds new blame.
  *   **Unstable Leaf:** *Epistemic Pragmatist* (Q6-B). Hard to defend why desert vanishes without knowledge unless "desert" is just "social utility."
  *   **Empty Cell:** No leaf where Outcome changes Desert but not Treatment. Commitment dropped: Rationality of sanctioning.
