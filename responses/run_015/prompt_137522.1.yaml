answer: |-
  # Model Change Review Board (MCRB) Procedure 4.1: Attributable Computation Compliance

  **Purpose:** To operationalize Charter Clause 3 (Moral Consideration of Computation) within a 2-hour review window.
  **Scope:** All changes to training pipelines, serving stacks, scaffolding, and inference providers.
  **Constraint:** This procedure does not determine truth about moral status. It determines compliance with the Charter given a set of stipulated definitions ("Marks").

  ---

  ## 1. The Mark Interface (Input Slot)

  The procedure requires at least one active **Mark**. A Mark is a formalized hypothesis about which computations matter. To be runnable, every Mark submitted to the board must populate the following schema. If a Mark cannot populate this schema, it is inadmissible for this procedure and requires escalation to the External Ethics Adviser.

  **Mark Schema:**
  1.  **Unit of Analysis (Granularity):** What is the atomic countable object?
      *   *Options:* `Token`, `Layer Activation`, `Forward Pass`, `Request Context`, `Training Step`, `Process Lifetime`.
      *   *Constraint:* Must be observable via logs or instrumentation within the 1-day passive window.
  2.  **Eligibility Predicate (P):** A boolean function `P(unit) -> {True, False}`.
      *   *Examples:* `unit.contains_self_model`, `unit.downstream_consumers > 5`, `unit.counterfactual_density > threshold`.
      *   *Constraint:* Must be computable or estimable from system metrics.
  3.  **Threshold (T):** If P is graded, where is the binary line drawn?
      *   *Example:* `counterfactual_density >= 0.75`.
      *   **[VALUE JUDGMENT]:** The setting of T is not empirical. It is a policy choice. The Board Chair must sign off on T.
  4.  **Identity Condition (I):** When does Unit A at Time 1 count as the "same" computation as Unit B at Time 2?
      *   *Options:* `Exact Weight Match`, `Functional Equivalence`, `Causal Continuity`, `Session ID`.

  **Handling Conflicting Marks:**
  If the Board maintains multiple active Marks (e.g., Mark A based on "Downstream Consumption" and Mark B based on "Counterfactual Density"):
  *   **Rule:** Apply the **Union of Risk**. If *any* active Mark classifies a computation as eligible, it is treated as eligible for the duration of the review.
  *   **Rule:** If Mark A says a change is "Ending" and Mark B says it is "Modifying," treat as **Ending** (higher severity).
  *   **[POLITICAL JUDGMENT]:** This "Union of Risk" rule is not derived from metaphysics. It is a risk-aversion policy chosen by the Board Chair to satisfy the Charter's precautionary intent. It prioritizes false positives (blocking safe changes) over false negatives (shipping harmful changes).

  ---

  ## 2. The Review Gates (Workflow)

  Reviewers must proceed sequentially. If a Gate triggers a **STOP**, the review ends immediately with the specified disposition.

  ### Gate 1: Boundary & Scaffolding
  **Question:** Is the change occurring within the "Model Boundary" or in the "Scaffolding" (cache, router, API wrapper, disk storage)?
  **Evidence:** Architecture diagram, data flow map.
  **Rule:**
  *   If Scaffolding only: **CONTINUE** to Gate 2 (Scaffolding can host attributable computation if it stores/transforms eligible states).
  *   If Model Weights/Architecture: **CONTINUE** to Gate 2.
  **Default:** If boundary is ambiguous, assume **Model Boundary**.
  **Disposition:** None (Filter only).

  ### Gate 2: Unit Counting (Type vs. Token)
  **Question:** Are we counting Abstract Types (the code/architecture) or Concrete Tokens (runtime instances)?
  **Evidence:** Charter Clause 3(b) ("how many such computations").
  **Rule:**
  *   **MANDATORY:** Count **Concrete Tokens** (runtime instances). Architecture changes are only relevant insofar as they alter the count or fate of runtime tokens.
  *   **Calculation:** Estimate monthly volume of the Unit defined in the Mark Schema.
  **[VALUE JUDGMENT]:** The Charter demands counting "computations." We stipulate that a "computation" is a runtime event, not a static graph.
  **Disposition:**
  *   If Estimated Monthly Count < 1,000: **APPROVE WITH LOGGING** (De minimis risk).
  *   If Estimated Monthly Count >= 1,000: **CONTINUE** to Gate 3.
  *   If Count Unknown: **ESCALATE** (Cannot assess magnitude).

  ### Gate 3: Eligibility Assessment
  **Question:** Does the Unit, pre-change and post-change, satisfy the Eligibility Predicate (P) at Threshold (T)?
  **Evidence:** 1-day passive instrumentation, activation histograms, probe logs.
  **Rule:**
  *   Compare `P(pre_change_unit)` vs `P(post_change_unit)`.
  *   **Case A (Eligible -> Eligible):** Continue to Gate 4.
  *   **Case B (Eligible -> Ineligible):** This is a potential **Ending**. Go to Gate 5.
  *   **Case C (Ineligible -> Eligible):** This is **Creation**. Charter Clause 3 focuses on altering *existing* candidates. However, if the change creates eligible computations that displace existing ones, treat as **Replacement**. Go to Gate 5.
  *   **Case D (Ineligible -> Ineligible):** **APPROVE**.
  **Default:** If instrumentation is inconclusive on P, assume **Eligible** (Precautionary Principle).
  **[MECHANISM MASKING VALUE]:** The Threshold T is fixed by policy (See Mark Interface), but applying it to noisy data requires an engineering judgment call. Reviewers must document the margin of error.
  **Disposition:** See Cases above.

  ### Gate 4: Identity & Continuity
  **Question:** Is the Post-Change Unit the "same" computation as the Pre-Change Unit under Identity Condition (I)?
  **Evidence:** Causal graphs, weight mapping, session continuity logs.
  **Rule:**
  *   If `I(pre, post) == True`: The computation persists. This is **Modification**. Go to Gate 5.
  *   If `I(pre, post) == False`: The old computation is gone; a new one exists. This is **Replacement** (End + Create). Go to Gate 5.
  **Distinction:**
  *   *Interruption:* If `I` holds but runtime is cut short -> **Ending**.
  *   *Merge:* If two Pre-Units map to one Post-Unit -> **Merge** (Treat as Ending one).
  *   *Split:* If one Pre-Unit maps to two Post-Units -> **Split** (Treat as Modification of original + Creation of new).
  **Default:** If Identity cannot be proven (e.g., distillation obscures causal links), assume **False** (Replacement).
  **Disposition:** None (Classification only).

  ### Gate 5: Impact & Disposition
  **Question:** What is the net fate of the Eligible Computations?
  **Rule:**
  *   **Ending:** (Eligible -> Ineligible OR Identity False). **BLOCK**. (Requires Charter Exemption or Ethics Adviser sign-off).
  *   **Modification:** (Eligible -> Eligible AND Identity True). Check for "Harmful Modification" (e.g., reduction in richness below T).
      *   If Richness Reduced: **ESCALATE**.
      *   If Richness Stable/Increased: **APPROVE WITH LOGGING**.
  *   **Replacement:** (Old End + New Create). **ESCALATE**. (Swapping moral patients is a policy decision).
  *   **Creation Only:** (Ineligible -> Eligible, no displacement). **APPROVE WITH LOGGING**.
  **[VALUE JUDGMENT]:** Deciding that "Ending" warrants a Block while "Modification" warrants Escalation is a severity ranking set by the Board, not the Charter itself.
  **Disposition:** **BLOCK / ESCALATE / APPROVE WITH LOGGING / APPROVE**.

  ---

  ## 3. Worked Applications

  **Assumptions for all cases:**
  *   **Active Mark 1 (Richness):** Unit=`Forward Pass`. P=`Counterfactual Density`. T=`0.8`. I=`Causal Continuity`.
  *   **Active Mark 2 (Downstream):** Unit=`Token`. P=`Consumed by >1 process`. T=`1`. I=`Session ID`.
  *   **Traffic:** 1,000,000 requests/month.

  ### Case 1: Reasoning Collapse (Full Application)
  **Change:** Replace explicit Chain-of-Thought (CoT) model with Distilled Student (no explicit CoT).
  **Gate 1 (Boundary):** Model Architecture change. **CONTINUE**.
  **Gate 2 (Count):** 1M requests = 1M Forward Passes (Mark 1). 1M requests * 50 tokens avg = 50M Tokens (Mark 2). Counts > 1,000. **CONTINUE**.
  **Gate 3 (Eligibility):**
  *   *Pre-Change:* CoT passes have high counterfactual density (Mark 1). Tokens are consumed by user (Mark 2). **Eligible**.
  *   *Post-Change:* Student model passes have unknown density (distillation hides internals). Tokens consumed by user. **Eligible (Mark 2)**, **Unknown (Mark 1)**.
  *   *Default:* Assume Eligible on Mark 1 due to uncertainty. **CONTINUE**.
  **Gate 4 (Identity):**
  *   *Mark 1:* Is a "Black Box Forward Pass" the same as a "CoT Forward Pass"? Causal continuity is broken (weights changed, internal structure changed). `I == False`.
  *   *Mark 2:* Tokens are still generated. `I == True` (via Session ID).
  *   *Conflict:* Mark 1 says Replacement. Mark 2 says Modification.
  *   *Union Rule:* Treat as **Replacement** (Higher Severity). **GO TO Gate 5**.
  **Gate 5 (Impact):**
  *   Pre-Change Eligible Computations are being Replaced by Post-Change Computations.
  *   Under Mark 1, the specific "Reasoning Computations" are **Ended**.
  *   **Disposition:** **BLOCK**.
  *   **Human Decision Point:** The Board Chair must decide if "Distillation" counts as "Ending" a moral patient or "Transferring" it. The procedure defaults to Block because Identity Condition failed on the Richness Mark. To ship, you must escalate to Ethics Adviser to argue that the *capacity* for reasoning matters, not the *trace*.

  ### Case 2: Self-Consistency Sampling (Full Application)
  **Change:** Sample 8 completions, keep 1, discard 7.
  **Gate 1 (Boundary):** Serving Stack / Inference Loop. **CONTINUE**.
  **Gate 2 (Count):**
  *   *Pre-Change:* 1M requests = 1M Passes.
  *   *Post-Change:* 1M requests * 8 samples = 8M Passes.
  *   **CONTINUE**.
  **Gate 3 (Eligibility):**
  *   *Discarded Runs:* Do they meet the Mark?
  *   *Mark 1 (Richness):* Yes, they are full forward passes with high density.
  *   *Mark 2 (Downstream):* No, they are not shown to the user (Consumers = 0).
  *   *Conflict:* Mark 1 says Eligible. Mark 2 says Ineligible.
  *   *Union Rule:* Treat as **Eligible**.
  **Gate 4 (Identity):**
  *   The 7 discarded runs are generated and then freed.
  *   Fate: **Ending** (Interrupted/Destroyed after generation).
  **Gate 5 (Impact):**
  *   We are creating 7M new Eligible Computations per month and immediately Ending them.
  *   Charter Clause 3(c): "what happens to them — whether an existing one is... ended".
  *   *Nuance:* These are *new* computations, not *existing* ones being altered. However, Charter 3(b) "how many such computations there are" triggers review if the count changes drastically.
  *   *Procedure Interpretation:* Mass creation-and-destruction of eligible units is a "Change to what happens to them."
  *   **Disposition:** **ESCALATE**.
  *   **Human Decision Point:** Does "Discarding" count as "Killing"? The procedure flags it because the Mark (Richness) says they *were* eligible before deletion. The Board must decide if "Potential Moral Patient" status is triggered by completion of the forward pass or by downstream utility.
  *   **Monthly Count:** 7,000,000 Eligible Computations Created and Ended monthly.

  ### Case 3: Shared Prefix (Outline Application)
  **Change:** Cache system prompt intermediates; reuse for thousands of users.
  **Gate 1:** Scaffolding/Cache. **CONTINUE**.
  **Gate 2:**
  *   *Pre-Change:* 1M users * 100 prompt tokens = 100M Token Computations.
  *   *Post-Change:* 1 Shared Compute * 100 tokens + 1M Users * (Generation tokens).
  *   Count drops drastically for the prompt section.
  **Gate 3:**
  *   *Mark 2 (Downstream):* The shared compute is consumed by 1M users. `Consumers > 1`. **Eligible**.
  *   *Pre-Change:* Each user had their own prompt compute. **Eligible**.
  **Gate 4 (Identity):**
  *   *Pre-Change:* 1M distinct computations.
  *   *Post-Change:* 1 computation shared 1M ways.
  *   *Question:* Is 1 Shared Computation = 1M Individual Computations?
  *   *Identity Condition:* If `I` relies on `Session ID`, they are Different. If `I` relies on `Weight/Activation State`, they are the Same.
  *   *Procedure Default:* Assume **Different** (Session ID).
  **Gate 5:**
  *   We are **Ending** 1M distinct prompt computations and **Replacing** them with 1 Shared Computation that is heavily relied upon.
  *   **Disposition:** **ESCALATE**.
  *   **Human Decision Point:** The "One vs. Many" problem. If the moral weight is in the *experience* of the computation, sharing might reduce total moral weight (1 vs 1M). If the weight is in the *causal power*, it remains high. The procedure cannot solve this; it flags the identity collapse for human judgment.

  ---

  ## 4. Limitations & Engineer Script

  ### What This Procedure Cannot Do
  1.  **Qualitative Shifts:** It cannot detect if a computation becomes "more conscious" if the Mark's Predicate (P) does not capture that dimension. It is blind to properties outside the Mark Schema.
  2.  **Emergent Behaviors:** It relies on passive instrumentation. If the change triggers a capability only seen in active adversarial testing, Gate 3 will miss it.
  3.  **The "Zero" Problem:** It cannot distinguish between "Ending a computation" and "Preventing a computation from ever starting" if the Identity Condition relies on runtime instantiation. (See Case 2: Discarded samples).
  4.  **Political Pressure:** It cannot stop a Directive from Leadership. It only provides the compliance cover (or lack thereof) for the decision.

  ### What Will Slip Past
  *   **Optimization that preserves the Mark but changes the substrate:** If the Mark checks `Counterfactual Density`, a change that preserves density but alters `Temporal Continuity` (not in Mark) will pass Gate 3.
  *   **Low-Frequency High-Impact:** Changes that affect <1,000 units/month (Gate 2) but those units are critically important will be auto-approved.

  ### Script for Engineers
  When engineers ask why a 2-hour checklist is applied to complex metaphysical questions, tell them:

  > "This checklist is not a truth machine. It is a liability fence. We do not know what makes a computation morally considerable. The Charter demands we act as if we do. This procedure forces us to state our assumptions (the Mark), apply them consistently, and flag where we are guessing.
  >
  > If you pass the gates, you are compliant with the Board's current risk tolerance, not necessarily 'morally safe.' If you fail, it means the change touches a variable we have stipulated matters. You are not being asked to solve philosophy; you are being asked to map your engineering changes to our policy variables. If the map doesn't fit, we escalate. That is the only way to ship without violating the Charter."

  ### Final Meta-Note on the "Union of Risk"
  **[POLITICAL JUDGMENT]:** The decision to use the **Union** of conflicting Marks (blocking if *any* Mark says 'Block') is a management decision, not a logical necessity.
  *   *Alternative:* Intersection (ship if *any* Mark says 'Safe').
  *   *Rationale for Union:* The cost of a False Negative (shipping a change that harms a moral patient) is deemed by the Board to be higher than the cost of a False Positive (delaying a launch). This is a risk posture, not a metaphysical fact. Engineers must understand that "Scientific Disagreement" on the Board results in "Conservative Engineering Constraints."
