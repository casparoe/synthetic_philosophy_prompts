  # Workshop Pre-Session Instrument: Fundamental Sentience Decision Tree

  **Instructions:** Answer each node sequentially. Follow the branch that matches your view. If a question presupposes a concept you reject (e.g., "experience" in an electron), follow the branch that best captures your denial. Record your path (e.g., 1A-2C-5B) to locate your leaf position.

  ### Node 1 (Intrinsic Nature)
  Consider an isolated electron in deep space, stripped of all relations. Is its intrinsic nature phenomenal (what it is like to be it), or non-phenomenal (purely structural or dispositional)?
  *   **Phenomenal** → Go to Node 2
  *   **Non-Phenomenal** → Go to Node 5

  ### Node 2 (Bearer of State)
  If phenomenal, is the subject of this state the individual electron, the cosmos as a single whole, or only complex systems of entities?
  *   **Individual Electron** → Go to Node 3
  *   **Cosmos as Whole** → Go to Node 4
  *   **Complex Systems Only** → Go to Node 5

  ### Node 3 (Valence Simplicity)
  Can the state of that individual electron be inherently aversive (bad for the electron), neutral only, or does aversion require complex integration?
  *   **Inherently Aversive** → Go to Node 6
  *   **Neutral Only** → **Leaf 10**
  *   **Requires Complexity** → Go to Node 5

  ### Node 4 (Cosmic Alterability)
  If the cosmos is the subject, can human action (e.g., heating a room) alter its phenomenal state, or is that state fixed by physical laws?
  *   **Alterable** → **Leaf 1**
  *   **Fixed** → **Leaf 2**

  ### Node 5 (Fundamental Weight)
  If not individual-phenomenal-aversive, does fundamental reality hold direct moral weight, derivative weight (only when forming minds), or none at all?
  *   **Direct Weight** → Go to Node 6
  *   **Derivative Weight** → Go to Node 9
  *   **None At All** → Go to Node 10

  ### Node 6 (Aggregation)
  If direct weight exists, does moral value sum across every entity, or depend on intensity within unified centers?
  *   **Sums Across Entities** → Go to Node 7
  *   **Depends on Unity** → Go to Node 9

  ### Node 7 (Dominance)
  If value sums, does this fundamental total dominate all other moral concerns (e.g., macro suffering)?
  *   **Dominates All** → **Leaf 3**
  *   **Competes with Macro** → Go to Node 8

  ### Node 8 (Total Variability)
  If it competes, is the total amount of fundamental experience fixed by conservation laws or variable by rearrangement?
  *   **Fixed** → **Leaf 4**
  *   **Variable** → **Leaf 5**

  ### Node 9 (Emergence)
  If value depends on unity or derivation, does macro experience replace micro reality, or emerge from it alongside it?
  *   **Replaces Micro** → **Leaf 6**
  *   **Emerges Alongside** → **Leaf 7**

  ### Node 10 (Error Type)
  If no weight, is the appearance of fundamental experience a cognitive error, or a linguistic/pragmatic convenience?
  *   **Cognitive Error** → **Leaf 8**
  *   **Convenience** → **Leaf 9**

  *(Note: Leaves 11–14 are distinguished by theoretical interpretation of Node 5 branches combined with Node 1/2 history, as labeled below.)*

  ---

  ### Leaf Positions & Awkward Commitments

  1.  **Variable Cosmopsychism:** Your daily commute changes the mood of the entire universe.
  2.  **Fixed Cosmopsychism:** Moral effort is locally real but globally idle because the cosmic state is conserved.
  3.  **Emergency View:** Preventing pain in a single dust mote outweighs saving a human life.
  4.  **Fixed Total View:** Conservation of experience implies that reducing suffering here increases it elsewhere.
  5.  **Variable Total View:** Boiling water incurs a moral cost that no ethical framework currently accounts for.
  6.  **Macro-Only Illusionism:** Your own pain is not real, only the brain's report of it is.
  7.  **Russellian Emergentism:** Reality doubles up, containing both micro-experience and distinct macro-experience.
  8.  **Error Theory:** You are systematically hallucinating the intrinsic nature of your own mind.
  9.  **Eliminativism:** The word "pain" refers to nothing, not even a neural state.
  10. **Neutral Micro-Experience:** Electrons feel something but nothing matters to them (Unoccupied/Unattractive).
  11. **Panprotopsychism:** Potential for experience carries the same moral weight as actual experience (Node 5A via Non-Phenomenal).
  12. **Threshold View:** Removing a single atom from a brain reduces its moral value to zero (Node 5B).
  13. **Strict Physicalism:** Consciousness is a ghost story we tell about machinery (Node 5C via Non-Phenomenal).
  14. **System-Subject View:** A rock is a moral subject but an electron is not (Node 5A via Complex Systems Only; Unoccupied).

