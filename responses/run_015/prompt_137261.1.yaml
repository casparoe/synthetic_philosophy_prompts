  ### Stress Cases & Limitations

  1.  **Infinite Divisibility (Gunk):** If matter is infinitely divisible with no fundamental level, Node 1's "isolated electron" presupposition fails, forcing all participants into Node 5 or 2C regardless of their actual metaphysics.
  2.  **Vagueness of "System":** Node 2 distinguishes "Individual" from "Complex System," but since electrons are always in fields, the boundary is arbitrary; participants who believe experience requires *any* relation must choose between 2A and 2C inconsistently.
