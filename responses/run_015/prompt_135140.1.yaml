answer: |-
  ### Part 1: The Diagnostic Questions

  **Instructions for Participants:**
  Read each scenario. Imagine you are the person responsible for the final sign-off. Choose the option that best matches what you would actually do and think in that moment. Do not choose what you think the "rulebook" says; choose what matches your internal judgment.

  **Q1. Safety Check (Independent / Low Stakes)**
  You are a safety engineer. 400 distinct bolts on a warehouse rack have been inspected by 400 different junior inspectors. Each inspector is reliable, but historical data shows that in a batch this size, one bolt is usually mislabeled. The rack holds storage boxes.
  *   **A.** I sign the cover sheet: "Every single bolt is correctly labeled."
  *   **B.** I sign each individual check as "Verified," but on the cover sheet I write: "All checked; statistical error possible."
  *   **C.** I cannot call any single bolt "correctly labeled." I only sign "Inspected."

  **Q2. Safety Check (Independent / High Stakes)**
  Same as Q1, but the bolts secure a load hanging over a busy walkway. If one fails, someone could be hurt.
  *   **A.** I sign the cover sheet: "Every single bolt is correctly labeled."
  *   **B.** I sign each individual check as "Verified," but on the cover sheet I write: "All checked; statistical error possible."
  *   **C.** I cannot call any single bolt "correctly labeled." I only sign "Inspected."

  **Q3. Safety Check (Shared Script / Low Stakes)**
  You are a safety engineer. 400 bolts were checked by a single automated scanning script. The script is reliable, but it has a known 1% bug rate. If the script bugs, it mislabels *all* 400 bolts. The rack holds storage boxes.
  *   **A.** I sign the cover sheet: "Every single bolt is correctly labeled."
  *   **B.** I sign each individual check as "Verified," but on the cover sheet I write: "All checked; statistical error possible."
  *   **C.** I cannot call any single bolt "correctly labeled." I only sign "Inspected."

  **Q4. Safety Check (Shared Script / High Stakes)**
  Same as Q3, but the bolts secure a load hanging over a busy walkway.
  *   **A.** I sign the cover sheet: "Every single bolt is correctly labeled."
  *   **B.** I sign each individual check as "Verified," but on the cover sheet I write: "All checked; statistical error possible."
  *   **C.** I cannot call any single bolt "correctly labeled." I only sign "Inspected."

  **Q5. Clinical Diagnoses (Independent / Low Stakes)**
  You are a department head. 200 patients were seen by 200 different doctors this month. Each doctor is confident in their diagnosis. Department data shows that in a month this size, at least one diagnosis is usually incorrect. These are routine check-ups.
  *   **A.** I sign the monthly report: "Every diagnosis this month was correct."
  *   **B.** I sign each chart as "Reviewed," but on the report I write: "All reviewed; error rate applies."
  *   **C.** I cannot call any single diagnosis "correct." I only sign "Assessed."

  **Q6. Clinical Diagnoses (Independent / High Stakes)**
  Same as Q5, but the diagnoses determine eligibility for a high-risk experimental treatment.
  *   **A.** I sign the monthly report: "Every diagnosis this month was correct."
  *   **B.** I sign each chart as "Reviewed," but on the report I write: "All reviewed; error rate applies."
  *   **C.** I cannot call any single diagnosis "correct." I only sign "Assessed."

  **Q7. Clinical Diagnoses (Shared Script / Low Stakes)**
  Same as Q5, but all 200 diagnoses were assisted by the same new AI software. The software has a known 5% failure rate. If it fails, it biases *all* 200 diagnoses. These are routine check-ups.
  *   **A.** I sign the monthly report: "Every diagnosis this month was correct."
  *   **B.** I sign each chart as "Reviewed," but on the report I write: "All reviewed; error rate applies."
  *   **C.** I cannot call any single diagnosis "correct." I only sign "Assessed."

  **Q8. Clinical Diagnoses (Shared Script / High Stakes)**
  Same as Q7, but the diagnoses determine eligibility for a high-risk experimental treatment.
  *   **A.** I sign the monthly report: "Every diagnosis this month was correct."
  *   **B.** I sign each chart as "Reviewed," but on the report I write: "All reviewed; error rate applies."
  *   **C.** I cannot call any single diagnosis "correct." I only sign "Assessed."

  ***

  ### Part 2: The Logic Tree & Position Mapping

  The diagnostic maps participants onto a 3-dimensional space: **Consistency** (A vs. B/C), **Aggregation** (A vs. B), and **Sensitivity** (Changes across Stakes or Dependence).

  #### The Three Core Answer Profiles
  *   **Profile A (The Certifier):** Selects **A** consistently.
      *   *Meaning:* You treat high probability as sufficient for full assertion, even when you know errors exist.
  *   **Profile B (The Splitter):** Selects **B** consistently.
      *   *Meaning:* You trust the individual items but refuse to aggregate them into a guaranteed whole.
  *   **Profile C (The Skeptic):** Selects **C** consistently.
      *   *Meaning:* You require near-certainty for individual claims; probability is not enough.

  #### The Sensitivity Modifiers
  *   **Stakes-Sensitive:** Answers change from A/B in Low Stakes (Q1,3,5,7) to B/C in High Stakes (Q2,4,6,8).
  *   **Dependence-Sensitive:** Answers change from A/B in Independent (Q1,2,5,6) to B/C in Shared Script (Q3,4,7,8).

  #### Mapping to Philosophical Positions

  | Answer Pattern | Philosophical Position | Description |
  | :--- | :--- | :--- |
  | **Mostly A** (Even in High Stakes) | **Bite-the-Bullet Fallibilist** | You accept that your beliefs are jointly inconsistent. You believe $P_1...P_n$ and also believe "One is false," and you are comfortable signing both. |
  | **Mostly B** (Stable across stakes) | **Non-Aggregativist** | You deny that justification transfers from parts to the whole. You believe each check, but you do not believe the conjunction ("All are correct"). |
  | **Mostly B** (With "Working Assumption" nuance) | **Acceptance vs. Belief** | You don't strictly *believe* the claims are true; you *accept* them for the purpose of the audit. (Functionally identical to Non-Aggregativist in this test). |
  | **Mostly C** (Stable across stakes) | **Strict Infallibilist** | You reject the "high-probability-is-enough" picture. If there is a known error rate, you claim knowledge/belief on neither the parts nor the whole. |
  | **A in Low / B or C in High** | **Contextualist / Stakes-Sensitive** | What counts as "correct" or "known" shifts depending on the practical cost of being wrong. |
  | **A/B in Indep / C in Dep** | **Correlation-Sensitive** | You treat correlated risk (shared script) as fundamentally undermining individual justification, more so than independent risk. |

  ***

  ### Part 3: Scoring Key

  **Step 1: Determine Baseline Tolerance**
  *   Count **A** answers.
      *   6-8 As: **High Tolerance** (Fallibilist).
      *   3-5 As: **Moderate Tolerance** (Contextualist or Splitter).
      *   0-2 As: **Low Tolerance** (Infallibilist).

  **Step 2: Check for Stakes Sensitivity**
  *   Compare Low Stakes (Q1,3,5,7) vs. High Stakes (Q2,4,6,8).
  *   If Low Stakes are mostly **A** and High Stakes are mostly **B/C**: Mark as **Stakes-Sensitive**.
  *   If answers remain stable regardless of stakes: Mark as **Stakes-Insensitive**.

  **Step 3: Check for Dependence Sensitivity**
  *   Compare Independent (Q1,2,5,6) vs. Shared Script (Q3,4,7,8).
  *   If Independent are mostly **A/B** and Shared Script are mostly **C**: Mark as **Dependence-Sensitive**.

  **Step 4: Assign Primary Label**
  *   **Stakes-Sensitive + High Tolerance:** *Pragmatic Contextualist.* (You believe it when it doesn't matter much).
  *   **Stakes-Insensitive + High Tolerance:** *Bite-the-Bullet Fallibilist.* (You sign "All Correct" even on the plane engine).
  *   **Stakes-Insensitive + Moderate Tolerance (Mostly B):** *Non-Aggregativist.* (You separate the parts from the whole).
  *   **Stakes-Insensitive + Low Tolerance (Mostly C):** *Strict Infallibilist.* (Probability never equals truth).

  ***

  ### Part 4: Flags & Limitations

  #### 1. Empty/Incoherent Combinations
  *   **The "Reckless Skeptic" (High Stakes = A, Low Stakes = C):**
      *   *Why Empty:* It is pragmatically incoherent to demand higher certainty for routine storage boxes than for life-support systems. If this pattern appears, the participant likely misread the stakes or is answering randomly.
  *   **The "Correlation Gambler" (Independent = C, Shared Script = A):**
      *   *Why Empty:* Correlated error (one script failing) is objectively riskier than independent error (400 inspectors failing). Treating the shared script as *more* certifiable suggests a misunderstanding of the scenario mechanics.

  #### 2. Indistinguishable Leaves
  *   **Non-Aggregativist vs. Acceptance Theorist:**
      *   *The Issue:* Both positions result in **Option B** (Yes to parts, No to whole).
      *   *Why:* The Non-Aggregativist says, "I believe the parts, but I can't believe the whole." The Acceptance Theorist says, "I don't believe the parts either; I just accept them for work."
      *   *Resolution:* This diagnostic cannot pull them apart without a follow-up interview question asking: *"Do you personally think the bolts are correct, or just that it's safe to act as if they are?"*
  *   **Strict Infallibilist vs. High-Stakes Contextualist:**
      *   *The Issue:* If a participant answers **C** on everything, they look like a Strict Infallibilist. However, they might be a Contextualist who views *all* audit work as "High Stakes."
      *   *Resolution:* Check the "Low Stakes" questions specifically. If they choose **C** on the warehouse rack (Q1), they are likely Infallibilists. If they hesitate there but choose **C** on the plane engine (Q2), they are Contextualists.

  #### 3. The "Shared Script" Blind Spot
  *   The diagnostic assumes participants understand that a "Shared Script" creates correlated risk. Some auditors may treat a script as *more* reliable than humans regardless of the error rate description. If a participant chooses **A** on Script questions but **B** on Independent questions, they are not displaying an epistemic stance so much as a *technological bias*. This should be flagged during debrief as a "Trust in Automation" confound rather than a pure epistemic position.
