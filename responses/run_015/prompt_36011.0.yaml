          *   *Inaction Baseline:* What if the agent did nothing forever? (Problem: Agent *must* act to be useful. Also, "doing nothing" might lead to disaster, so acting prevents disaster, which looks like high impact.)
          *   *Stepwise Inaction Baseline:* Compare state $s_t$ to what would have happened if the agent did nothing *just at step t*, then resumed optimal policy? (Problem: Can lead to "offsetting" behaviors where the agent undoes its own good work to minimize impact.)
          *   *Starting State Baseline:* Compare to $s_0$.
      *   *The Measure:* How to quantify change?
          *   *Reachability (Future State Entropy):* Don't reduce the number of reachable states. (Problem: Prevents shutting itself off, prevents preventing disasters if that closes off branches.)
          *   *Auxiliary Goals:* Don't worsen performance on a set of random tasks.
