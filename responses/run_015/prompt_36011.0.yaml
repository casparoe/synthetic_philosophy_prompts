      *   *Differences:* In physics, gauge symmetry implies physical observables are invariant. In AI, changing the baseline *changes the agent's behavior* (e.g., offsetting). The "observable" (the trajectory) *does* depend on the gauge. This breaks the analogy. In physics, $F = -\nabla V$. If $V \to V + C$, $F$ is unchanged. In AI, if Penalty $\to$ Penalty + BaselineShift, the *policy* changes because the optimization landscape changes.
      *   *Refinement:* It's not a gauge symmetry; it's a *renormalization* problem or a *boundary condition* problem. The "physics" of the agent depends on the boundary conditions.

