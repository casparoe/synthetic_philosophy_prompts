prompt: |-
  So my friends and I are starting a co-living house — six of us on the lease, but three more are "maybe" and will decide in a couple months, and two partners of leaseholders will basically live there half the week even though they're not on the lease. We want to make decisions democratically about house rules, chores, guests, etc. But we're stuck on the most basic thing: who even gets a vote? If we put it to a vote among the six leaseholders to decide whether the partners and the maybes get a vote, that seems circular — like we're already assuming the answer by who we let into the room. But I can't think of a non-arbitrary way to draw the line. How do we solve this?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Problem:**
      *   **Context:** A group of friends starting a co-living house.
      *   **Stakeholders:**
          *   6 Leaseholders (Definite).
          *   3 "Maybes" (Potential future leaseholders/residents).
          *   2 Partners (Non-leaseholders, semi-residents).
          *   Total potential residents: 11 people.
      *   **Goal:** Democratic decision-making (house rules, chores, guests, etc.).
      *   **Core Conflict:** Determining *who* gets a vote (the franchise).
      *   **The Paradox:** Deciding who votes requires a vote, but who votes on that vote? (The "Boundary Problem" in democratic theory).
      *   **Constraint:** Needs to be non-arbitrary and fair.

  2.  **Deconstruct the "Boundary Problem":**
      *   This is a classic issue in political philosophy (who constitutes the *demos*?).
      *   In a household context, the stakes are lower than a nation-state, but the interpersonal dynamics are higher.
      *   *Key Insight:* Voting isn't the only way to make decisions, and "one person, one vote" isn't the only democratic model.

  3.  **Evaluate the Stakeholder Groups:**
      *   **Leaseholders (6):** Highest risk (financial/legal). Should have the most say.
      *   **Partners (2):** High impact (live there 50% of time), low formal risk (not on lease).
      *   **Maybes (3):** Low impact (not there yet), low risk.

  4.  **Brainstorm Solutions/Models:**

      *   *Model A: Strict Leaseholder Democracy.* Only the 6 vote.
          *   *Pros:* Clear, aligns with legal liability.
          *   *Cons:* Partners feel disenfranchised despite living there; Maybes feel excluded before joining.
      *   *Model B: Resident Democracy.* Anyone sleeping there > X nights votes.
          *   *Pros:* Aligns with impact.
          *   *Cons:* Hard to track; partners might outvote leaseholders on financial issues.
      *   *Model C: Tiered Voting.* Different votes for different topics.
          *   *Pros:* Nuanced.
          *   *Cons:* Complex to administer.
      *   *Model D: Consensus/Advice Process.* Move away from voting.
          *   *Pros:* Builds community, avoids the "who votes" trap.
          *   *Cons:* Time-consuming.

  5.  **Develop Specific Recommendations:**

      *   **Reframe the Question:** It's not "Who gets a vote?" but "What decisions are being made?"
      *   **Distinguish Decision Types:**
          *   *Financial/Legal:* Only leaseholders (they are liable).
          *   *Social/Chores/Guests:* All residents (they are impacted).
      *   **Address the "Maybes":** They aren't residents yet. They shouldn't vote on current house culture, but they should have input on joining.
      *   **Address the Partners:** They are de facto residents. They need a voice on daily living, but maybe not on lease renewal.
      *   **Solve the "Circularity":** Don't vote on the voting rules. The current 6 leaseholders are the *founders*. They set the initial constitution, ideally with input from others, but the final call is theirs because they hold the risk. This isn't undemocratic; it's fiduciary responsibility.

  6.  **Drafting the Advice (Iterative Process):**

      *   *Acknowledge the paradox:* Validate that this is a known philosophical problem (the "Boundary Problem").
      *   *The "Founding" Distinction:* The 6 leaseholders are the founders. They have the legal risk. They must set the initial framework. This breaks the circle.
      *   *Tiered Citizenship:* Propose different levels of involvement based on stake.
          *   *Level 1 (Leaseholders):* Full vote on everything (money + living).
          *   *Level 2 (Partners/Residents):* Vote on living stuff (chores, guests), no vote on money/lease.
          *   *Level 3 (Maybes):* No vote yet, but an onboarding path.
      *   *Alternative to Voting:* Suggest Consensus or Sociocracy. Voting creates winners/losers. Housemates need to get along.
      *   *Practical Steps:* Write a "House Constitution."

  7.  **Refining the Tone:**
      *   Needs to be practical, empathetic, and structured.
      *   Avoid overly academic language but acknowledge the depth of the problem.
      *   Emphasize communication over procedure.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Wait, if the partners live there half the week, they impact chores. They should definitely have a say on chores.
      *   *Correction:* The "Maybes" shouldn't vote on *anything* right now because they aren't there. They are applicants.
      *   *Crucial Point:* The 6 leaseholders *must* be the ones to decide the initial rules because they are legally liable. If the house fails, they pay. This justifies their initial authority.

  9.  **Structure of the Response:**
      *   Validate the dilemma (The Boundary Problem).
      *   Break the circle (The Founders' Privilege/Responsibility).
      *   Propose a Tiered System (Rights based on Risk & Impact).
      *   Suggest Alternatives to Voting (Consensus).
      *   Actionable Next Steps (The House Agreement).

  10. (Final Review against User Query): Does this answer "How do we solve this?" Yes, by providing a framework to categorize rights and a method to establish them without a circular vote.

  **(Self-Correction Note):** Make sure to mention that the "Maybes" need a clear deadline. Ambiguity kills co-living.

  11. **Final Output Generation** (similar to the provided good response).
answer: |-
  You have stumbled upon one of the oldest problems in political philosophy, known as **the Boundary Problem** (or the *demos* problem). It asks: *Who is entitled to participate in the democratic process that defines who is entitled to participate?*

  In a nation-state, this is solved by borders and citizenship laws. In a co-living house, you cannot solve this by voting on it, because as you noted, that presupposes the answer.

  Here is a practical framework to break the circularity, minimize resentment, and ensure the house functions smoothly.

  ### 1. Break the Circle: The "Founders" Clause
  You must accept a temporary hierarchy to establish the democracy. The **six leaseholders** are not just residents; you are the **legal fiduciaries**. If the house falls apart, if rent isn't paid, or if there is property damage, the six of you are personally liable. The partners and the "maybes" are not.

  Therefore, the six leaseholders must act as the "Constitutional Convention." You do not vote on who gets a vote. Instead, the six of you draft the initial **House Agreement**. This is not undemocratic; it is an assumption of responsibility. You are setting the rules of the game because you hold the chips.

  ### 2. Adopt a Tiered Citizenship Model
  Instead of a binary "vote/no vote," assign decision-making rights based on **Risk** and **Impact**. This removes the arbitrariness.

  **Tier 1: Leaseholders (The 6 of you)**
  *   **Stake:** High Financial/Legal Risk.
  *   **Voting Rights:** Full voting rights on *all* matters.
  *   **Scope:** Financial decisions (rent splits, buying furniture), lease renewals, evicting housemates, *and* social rules (chores, guests).

  **Tier 2: Semi-Residents (The 2 Partners)**
  *   **Stake:** High Impact, Low Financial Risk.
  *   **Voting Rights:** Voting rights on **Operational/Social** matters only.
  *   **Scope:** They get a vote on chores, guest policies, noise levels, and cleaning supplies because they use the space. They do *not* get a vote on financial matters, lease terms, or adding new roommates, because they do not share the liability.
  *   **Condition:** This status should be formalized. If they are there >4 nights a week consistently, they fall into this tier.

  **Tier 3: Prospective Residents (The 3 "Maybes")**
  *   **Stake:** No Current Impact, No Current Risk.
  *   **Voting Rights:** **None.**
  *   **Reasoning:** They do not live there yet. Allowing them to vote on current house culture gives them influence without accountability.
  *   **Pathway:** They should be given a clear deadline to decide. Once they sign the lease (or a sublease agreement), they move to Tier 1. Until then, they are guests.

  ### 3. Move Beyond "Majority Vote"
  Voting in a house of friends is often destructive. A 4-3 vote on a house rule creates a disgruntled minority who still has to live with the rule. Consider using **Consensus** or **Advice Process** for social rules.

  *   **Consensus:** We discuss until everyone can "live with" the decision. No one blocks it, but not everyone has to love it.
  *   **The Advice Process:** Any Tier 1 or Tier 2 person can make a decision (e.g., "I want to buy a new vacuum"), but they must first seek advice from everyone affected. They don't need permission, but they must listen.
  *   **Reserve Voting for Stalemates:** Only use a formal vote if consensus fails after two house meetings.

  ### 4. Draft a "House Constitution"
  The six leaseholders should sit down (without the partners or maybes) and draft a one-page document. It should explicitly state:
  1.  **Financial Liability:** Only leaseholders vote on money.
  2.  **Residency Definition:** Anyone sleeping there more than X nights a month counts as a resident for chore/guest purposes.
  3.  **The Partner Clause:** Partners who meet the residency definition get a voice on social/chores, but not finance.
  4.  **The Onboarding Clause:** "Maybes" have until [Date] to commit. After that, the room is marketed to others.

  Once the six of you agree on this, you present it to the partners and maybes. You frame it not as "We decided this for you," but as "We accepted the legal liability, so we had to define the structure. Here is where you fit in."

  ### 5. Why this works
  *   **It solves the circularity:** The authority comes from legal liability, not a vote.
  *   **It protects the partners:** They aren't silenced on the things that affect their daily life (chores, guests).
  *   **It protects the leaseholders:** You aren't outvoted on financial risks by people who aren't on the lease.
  *   **It clarifies the "Maybes":** It forces them off the fence. They can't enjoy the benefits of membership (voting) without the commitment (lease).

  ### Summary Recommendation
  Do not hold a vote to decide who votes. The six leaseholders must assert **founder authority** based on legal liability. Create a **two-tier system**: Leaseholders vote on everything; Partners vote on daily living only; "Maybes" vote on nothing until they sign.

  Write this down, sign it, and treat it as a living document you can revisit in six months.
