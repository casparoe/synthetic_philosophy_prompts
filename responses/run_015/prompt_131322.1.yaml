      *   *Strong:* The Lewisian "Qualitative Parity" objection. If worlds are concrete and isolated, what makes one structurally superior? It looks like a disguised version of "Actuality."
      *   *Moderate:* The Modal Intuition mismatch. Our modal logic (S5 usually) doesn't seem to care about causal topology.
      *   *Awkward:* The Actualist "Ockham's Razor." Why keep the concrete pluriverse if you privilege one world so heavily?

