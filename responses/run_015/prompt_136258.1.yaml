prompt: |-
  ok im putting together prompts for a dataset on philosophical reasoning and i need one on inside view vs outside view with epistemic modesty. but not the generic forecasting version -- i want it pushed into a weird corner. let's call it the nested-refernece problem: you're trying to apply an outside-view base rate to a system (say your own research field or company) but you're causally coupled to that system and thier inside-model actually feeds into the reference class dynamics. this breaks the usual "just be humble and use base rates" advice.

  write the desiderata: what a normative framework for choosing between inside and outside views actually has to deliver in this kind of coupled setting. i want the full spec, not just a list of virtues.

  structure it like this, with approximate lengths:
  1. The framing problem (~100 words): explain the nested-refernece issue and why standard recipes fail.
  2. The desiderata (~400 words): the requirements list. include cases it must handle (nested-refernece, at least one where inside view should dominate despite terrible base rates, and the second-order case where you're modest about your modesty). flag which distinctions it can't collapse -- like confidence-modesty vs model-selection-modesty, or first-order outside view vs meta-outside view. also include consistency conditions with actual bias literature (not just naming biases -- say what failure mode in view-selection each blocks). mark non-negotiable vs camp-preference.
  3. Joint unsatisfiability check (~150 words): say explicitly if any subset is impossible together. im especially interested in whether you can demand both perfect calibration and actionable guidance in coupled systems.
  4. Contenders sketch (~100 words): briefly how pure base-rate deference and pure inside-view rationalism score -- just enough to show the list bites.

  please dont ask for citations or reading lists, and dont name specific papers with dates. write casual, a typo or two is fine.
