  1. The framing problem
  Standard epistemic hygiene says: inside view is where bias lives, outside view is where truth hides. But this breaks when you're causally coupled to the reference class. If you're a researcher predicting your field's progress, your confidence influences your effort, which changes the field's success rate. You aren't just sampling the distribution; you're shifting it. This creates a nested-reference problem where the base rate is endogenous. Standard recipes fail because they treat the outside view as static ground truth, ignoring that universal deference to base rates can become a self-fulfilling prophecy of mediocrity. We need a framework that handles feedback loops, not just weighting errors.

  2. The desiderata
  The framework must deliver specific operational capacities, not just vibes. First, it must resolve the nested-reference case without circularity: it needs a fixed-point solution where the agent's view-selection is part of the model. Second, it must identify conditions where inside-view dominance is rational despite abysmal base rates (e.g., genuine structural advantage), avoiding the "regression to mean" trap that kills innovation. Third, it needs to handle second-order modesty: being humble about whether you've correctly identified the relevant reference class.

  Crucially, it cannot collapse key distinctions. Confidence-modesty (uncertainty about parameters) must stay separate from model-selection-modesty (uncertainty about which outside view applies). Similarly, first-order outside views (success rates of similar projects) cannot be conflated with meta-outside views (success rates of using outside views in this domain).

  Consistency with bias literature is non-negotiable. The framework must block the Planning Fallacy (overweighting specific scenario details) and Reference Class Tennis (cherry-picking comparator groups). It should treat these as failure modes in view-selection, not just estimation. Non-negotiables include logical consistency and avoiding performative contradiction. Camp preferences, like whether to prioritize precision or recall in class selection, are flexible. The system must acknowledge that in coupled systems, "truth" might be path-dependent. Finally, it needs to specify when ignoring the base rate is actually the way to *improve* the base rate for everyone else. It has to tell you when being the outlier is a duty, not a delusion.

  3. Joint unsatisfiability check
  Here's the rub: there is likely a joint unsatisfiability between perfect calibration and actionable guidance in coupled systems. If the framework tells you to be optimistic to shift the base rate, you are technically miscalibrated relative to the *current* distribution. If it tells you to be calibrated to the *current* distribution, you lose the agency to change it. You can't demand the framework output a probability that is both statistically accurate ex-ante and causally effective ex-post. This isn't a bug, it's a feature of performative prediction. The desiderata must admit that in high-coupling scenarios, calibration is a moving target. We might have to sacrifice static accuracy for dynamic efficacy, meaning perfect calibration is impossible by definition here.

  4. Contenders sketch
  Pure base-rate deference fails the innovation test; it mandates stagnation because it treats the current distribution as immutable law. It gets crushed by the requirement to handle inside-view dominance cases. Pure inside-view rationalism fails the bias check; it collapses into the Planning Fallacy and ignores the nested-reference feedback until it's too late. It can't handle second-order modesty. Both fail the unsatisfiability check by pretending the tension doesn't exist. The list bites hard enough to rule out the easy answers, forcing a hybrid that acknowledges the causal loop.
