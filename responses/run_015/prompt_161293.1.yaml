answer: |-
  1. In a professional research lab, Drs. Evans and Chen must choose between verifying data now for high future citation (A) or submitting unverified drafts for immediate relief but lower citation (B). At 9 AM ($t_1$), both intend A. At 4 PM ($t_2$), both submit B. Between times, Chen learns the journal now accepts unverified drafts without penalty, narrowing A's advantage, though verification remains objectively superior for career prestige. Evans receives no update. Both face identical effort costs and deadline pressure without addiction or self-deception.

  2. With $\beta=0.5, \delta=1$, A costs 50 effort now for 100 later, B costs 0 for 40 (Evans) or 45 (Chen); the model predicts both intend A at $t_1$ and choose B at $t_2$ because the immediacy premium outweighs the net benefit. No re-parameterisation separates them because parameters are exogenously fixed from unrelated monetary tasks, not fitted to this behaviour.

  3. Evans remains akratic because she affirms A's superior career value even while submitting B, satisfying the contemporaneous judgment condition. Chen is acquitted because the waiver information provides a normative reason to prefer B, making her judgment a reasoned update rather than a conflict between judgment and desire.

  4. The structural feature is Chen's access to new normative information regarding the penalty waiver, which Evans lacks. Removing the information makes Chen akratic by restoring her $t_1$ judgment at $t_2$, while setting $\beta=1$ leads both to choose A, rendering neither weak-willed.

  5. A proponent might argue Chen's judgment is merely a rationalization generated by the same $\beta$-driven process that selects B, rendering the distinction epistemically inaccessible. This reply is ad hoc because it ignores the stipulated normative weight of the information, though it shows the argument needs stronger evidence to rule out rationalization empirically.
