answer: |-
  To apply Aumann's Agreement Theorem disciplinedly, we must first fix the agents. Treating the 364 signatories as 364 distinct agents complicates the topology unnecessarily; the joint statement functions as a coordinated signal. We should model this as a two-agent game: Agent A (the Signatories, issuing a joint posterior) and Agent B (the Treasury/Government supporters, specifically Howe, Walters, and Minford). The "event" $E$ is not singular. The statement bundles empirical forecasts (output will fall, unemployment will rise), causal claims (fiscal contraction causes this), theoretical claims ("no basis in economic theory"), and political claims (threat to stability). Aumann's theorem applies strictly to beliefs about states of the world within a shared state space $\Omega$. It applies cleanly to the empirical forecasts, poorly to the causal claims (which depend on model structure), and not at all to the theoretical claims (which are assertions about the validity of $\Omega$ itself).

  Regarding information partitions and posteriors: neither side published explicit probabilities. However, the theorem requires only that posteriors are common knowledge, not numeric. The public statement served as Agent A's posterior report: $P_A(E) \approx 1$ for "budget failure." The Government's defence of the budget served as Agent B's posterior: $P_B(E) \approx 0$ for "budget failure" (or $P_B(\text{success}) \approx 1$). These posteriors were common knowledge via the press. The partitions differed radically. Agent A's partition cells were defined by Keynesian demand-side variables; Agent B's by monetarist supply-side and money-stock variables. Crucially, because the signatories included a future MPC member who signed because it was "the only game in town," we know that for at least some constituents of Agent A, the reported posterior did not match the private posterior. This violates the honest reporting assumption immediately, but let us assume for the sake of argument that the joint statement represents the consensus belief to test the deeper epistemic failures.

  We can now rank the candidate explanations for the persistent disagreement by explanatory power.

  First, and most significant, is the failure of the **common state space assumption**. The signatories claimed there was "no basis in economic theory" for the budget. This is not a disagreement about probabilities within a model; it is a disagreement about which model constitutes reality. Agent A operated in a state space where demand determines output; Agent B operated in a space where money supply determines inflation and supply determines output. When agents partition different $\Omega$s, Aumann's theorem is silent. They are not agreeing to disagree; they are playing different games. This explains the bulk of the episode.

  Second is **non-honest reporting (cheap talk/advocacy)**. The statement was a political intervention, not a Bayesian update. The "only game in town" remark confirms that for some agents, the signature was a strategic move to influence policy rather than a revelation of belief. If posteriors are not honest reports of conditional probabilities, the theorem's antecedents fail. This explains the coordination of the 364 despite internal heterogeneity.

  Third is **different priors**. While likely present, this is less explanatory than the model space divergence. Even with common priors, if the likelihood functions (models) differ, posteriors will diverge. Given the paradigmatic shift occurring (Keynesian to Monetarist), model divergence is the primary driver, priors secondary.

  Fourth is **motivated updating**. While psychologists might cite this, in formal epistemological terms, this is subsumed under the failure of honest reporting or the selection of convenient model spaces.

  Consider the counterfactual: a mechanism requiring both sides to post probabilities on pre-specified outcomes (e.g., "Real GDP growth 1981-82") under a proper scoring rule with financial stakes. This would enforce honest reporting, removing the "cheap talk" explanation. It would create common knowledge of posteriors in a way the statement did not. However, it would not force convergence. Because the agents inhabit different model spaces, they would interpret the scoring rule's incentives differently. Agent A might bet heavily on recession based on demand models; Agent B on recovery based on confidence effects. We would observe an honest measurement of the gap, not its closure. The mechanism restores the *reporting* condition of Aumann's theorem, but not the *common state space* condition. Consequently, the no-trade corollary—that agents with common priors cannot bet against each other—fails here. The two sides *were* taking opposite sides of a reputational bet, but because their models differed, they did not view it as a bet against a common reality, but as a validation of their respective frameworks. The existence of the bet does not prove common priors; it proves common confidence in divergent models.

  What does this episode show about the theorem itself? Primarily, it reveals the theorem's limited predictive bite in real-world scientific disagreement. Aumann's result is a consistency constraint: *if* agents share priors and state spaces, persistent disagreement is irrational. It is not a convergence engine. The fact that the signatories were, broadly, wrong on the forecast (output recovered relatively quickly, though unemployment lagged) is evidence neither about priors nor luck in isolation; it is evidence about model validity. The theorem is silent on truth conditions. It cannot tell us which posterior is correct, only that they should not differ given shared foundations.

  Furthermore, the episode highlights the theorem's silence on the cost of honesty. The "only game in town" signatory illustrates that agents may knowingly report false posteriors when the social cost of dissent exceeds the epistemic cost of inconsistency. Aumann assumes rational agents maximize epistemic utility (truth); real agents maximize professional utility (tenure, influence). Finally, the theorem offers no guidance on the speed of convergence. Even if the 364 and the Treasury had shared a state space, the data required to update priors (macroeconomic time series) arrives slowly and noisily. The theorem describes a static equilibrium condition, not a dynamic learning process. In this case, the disagreement persisted not because agents were irrational in the Aumannian sense, but because the prerequisites for the theorem—shared models and honest reporting—were absent. The 1981 budget episode is not a refutation of Aumann's theorem, but a demonstration of its stringent boundary conditions. It shows that in paradigm shifts, where the state space itself is contested, the prohibition on agreeing to disagree dissolves. The theorem holds, but the world it describes is not the one the economists inhabited.
