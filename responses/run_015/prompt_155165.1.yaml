answer: |-
  This is not half-formed; it is one of the most persistent and destabilizing tensions in criminal law theory. You have identified a structural asymmetry in how we calculate culpability.

  There isn't one single canonical name for this, because it sits at the intersection of a few different problems. In the literature, you will find it discussed under the **Asymmetry of Excuses**, the **Baseline Problem**, and the **Skeptical Challenge to Retributivism**.

  Here is the breakdown of what the thing is, why the asymmetry exists, where the drift stops, and how post-crime behavior fits in.

  ### 1. The Asymmetry: Baseline vs. Deviation
  You are correct that desert functions like a ceiling that can be lowered, but rarely a floor that can be raised. The reason for this lies in how the law constructs the "responsible agent."

  Criminal law does not punish based on a scale of virtue; it punishes based on a **threshold of capacity**. The baseline is the "reasonable person" or the "agent with normal capacity for self-control."
  *   **Downward Adjustment:** When you introduce a bad childhood, coercion, or deprivation, you are arguing that the offender fell *below* the baseline capacity required to hold them fully responsible. You are proving a deficit in the necessary conditions for agency.
  *   **No Upward Adjustment:** When an offender has privilege, education, and every alternative open to them, they are not *above* the baseline; they are simply *at* the baseline. They had the "fair opportunity" to obey the law (H.L.A. Hart's principle). Having a *super-abundance* of opportunity does not make the violation more culpable; it just confirms they met the standard conditions for liability.

  **What it isn't:** It is not "Moral Luck" in the standard Nagelian sense. Moral luck usually refers to how outcomes affect blame (e.g., the drunk driver who hits a pedestrian vs. the one who doesn't). Your observation is about **Constitutive Luck** (who you are) and **Circumstantial Luck** (what you face), but specifically about the *unidirectionality* of their legal weight.

  **What it is:** It is the **Principle of Fair Opportunity** working in only one direction. The law asks: "Did you have a fair chance to do otherwise?" If the answer is "No" (due to deprivation), blame drops. If the answer is "Yes, and then some" (due to privilege), blame stays at the standard. The law is designed to protect the vulnerable from being judged by standards they couldn't meet, not to punish the privileged for being able to meet them easily.

  ### 2. The Epistemic Drift: The Skeptical Challenge
  Your second point—that better investigation leads to less punishment—is the **Skeptical Challenge to Retributivism**.

  If the state becomes perfect at investigating the causal history of every offender, it will find mitigating factors in everyone. No one creates themselves. Everyone has some genetic predisposition, some trauma, some social pressure. If culpability requires being the *ultimate source* of one's actions (a libertarian view of free will), then perfect information yields zero culpability.

  **Where it stops:**
  The legal system stops this drift via a **Pragmatic Cutoff**. The law is a compatibilist system. It assumes free will for the sake of the practice. It draws a line at **Rational Agency**.
  *   **The Stop Point:** The investigation stops when it establishes that the agent possessed the rational capacity to understand the law and the physical capacity to comply.
  *   **Why:** If the system pursued causation back to the Big Bang (or the offender's conception), it would cease to be a legal system and become a sociological study. The law treats the "rational agent" as a brute fact. It ignores causes that do not impair rationality.

  So, the drift stops at the border of **insanity/duress** vs. **character/temperament**. A bad childhood that causes psychosis mitigates. A bad childhood that causes anger does not (legally speaking), because anger is presumed to be manageable by a rational agent.

  ### 3. Desert as a Ceiling vs. Desert as a Point
  You mentioned the "desert as a cap" theory. That theory usually says: *Desert sets the maximum permissible punishment, but utility can lower it.*

  Your observation is deeper. You are noticing that **Retributive Desert itself looks like a cap.**
  *   Ideally, retributivism posits a precise point: *This crime + this culpability = this exact punishment.*
  *   In practice, retributivism functions as: *This crime = this maximum punishment, subject to discounts for impaired agency.*

  This suggests that "full responsibility" is actually a fiction or a limit case. We punish the "fully responsible" actor, but we acknowledge that "full responsibility" is an asymptote we never actually reach. We just stop looking for discounts once the cost of inquiry outweighs the likelihood of finding a recognized excuse (like insanity or duress).

  ### 4. Post-Crime Behavior: Same Phenomenon?
  You asked if the discount for remorse/restitution is the same phenomenon. **No, it is structurally different.**

  *   **Background Mitigation (Childhood/Coercion):** This goes to **Culpability at the time of the act** (*mens rea* / capacity). It says, "You were less blameworthy *then*."
  *   **Post-Crime Mitigation (Remorse/Restitution):** This goes to **Current Status / Future Dangerousness**. It says, "You are less blameworthy *now*," or "You need less hard treatment to be reintegrated."

  **The Asymmetry Holds Here Too:**
  Notice that lack of remorse rarely *aggravates* a sentence (constitutionally, in many jurisdictions, you can't be punished for exercising your right to trial or maintaining innocence), but remorse *mitigates*.
  *   **Why?** Because the sentence is for the *crime*, not the *character*. Remorse suggests the debt is being paid or the danger is receding. Lack of remorse doesn't necessarily mean the crime was worse; it just means the debt remains outstanding.
  *   **The Limit:** Post-crime behavior cannot increase the *retributive* ceiling. It can only lower the *utilitarian* need for incarceration.

  ### Summary for the Practitioner
  You are seeing the friction between **Liberal Legalism** and **Determinism**.

  1.  **The Asymmetry:** The law is a shield, not a sword. It is designed to ensure people aren't punished for things they couldn't control. It is not designed to reward/punish based on things they *could* control extra-well. Privilege is not a crime; deprivation is a recognized handicap.
  2.  **The Drift:** A perfect retributive system would indeed punish almost no one, because everyone is a product of causes. The system survives only by arbitrarily declaring "Rational Agency" as the stopping point for inquiry.
  3.  **The Shape:** You are right that desert functions as a **discountable maximum**. We sentence the "standard offender," and then we subtract for deficits. We do not add for surpluses.

  **Where it stops:** It stops where the law decides that **causation is no longer an excuse.** The law draws a bright line: "Unless your capacity was legally impaired (insanity, infancy, duress), your causal history is irrelevant." That line is not philosophically defensible in a deep metaphysical sense, but it is the only place the system can functionally stand.

  If you want to read further, look into **Stephen Morse's** work on "Fundamental Psycho-Legal Error" (he argues we stop the regress too early) and **Michael Moore's** defenses of "Retributivism as Truth" (he argues we can find a stopping point). But your intuition is sound: the arrow of mitigation points only one way, and that reveals that criminal law is fundamentally about managing human frailty, not measuring metaphysical guilt.
