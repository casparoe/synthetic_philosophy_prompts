answer: |-
  ### Brainstorming: Philosophy vs. Pallet Jacks

  You are not misreading Gongsun Longzi. You are reading it like an ontologist, which is exactly what a catalog manager is. The *White Horse* dialogue isn't about horses; it's about **extension** (the set of things a word picks out) and **intension** (the definition required to pick them out).

  *   **"Horse"** picks out a large set (Extension: All horses).
  *   **"White Horse"** picks out a smaller set (Extension: Only white horses).
  *   **The Logic:** If you create a category node for "White Horse," you are asserting that "White Horse" is a *Kind*, not just a *Horse with a property*. If you treat it as a Kind, you exclude black horses from that shelf.

  **Which of your ideas carry weight?**

  1.  **The Warehouse-Floor Substitution Test (Hunch 1):** **Load-bearing.** This is the operational translation of "White Horse is Not Horse." If a picker can swap a black horse for a white horse without breaking the customer's use-case, "White" is a facet (modifier). If swapping them causes a breach (safety, fit, function), "White Horse" is a distinct Kind (category). This is the only test that matters for the 15-minute triage.
  2.  **The Hidden Attribute/Data Quality (Hunch 2):** **Load-bearing.** This is the "Rectification of Names" (Zhengming). If the name "Stainless Bolt" exists but the attribute `Material=Stainless` is null, the name is dislocated from the actuality. Creating a node fixes the symptom but rots the data structure. You must detect this.
  3.  **The Gongsun Longzi Framing:** **Decoration (for the juniors), Foundation (for you).** Do not put "School of Names" in the checklist. Your catalogers will glaze over. But the *logic* of the dialogue (Name vs. Actuality, Compound vs. Simple) is the engine of the Substitution Test. Use the philosophy to design the test, then hide the philosophy.
  4.  **The "Four Thousand Leaf Nodes" Fear:** **Real.** This is the entropy cost. Every "Yes" increases the maintenance burden exponentially.

  **The Cheapest Test:**
  Don't ask "Is this a category?" Ask "If I hide this attribute, does the part become dangerous or useless?"
  *   Hide "Yellow": Part still works. (Facet)
  *   Hide "Grade 8.8": Part might snap. (Kind? Or Mandatory Facet?)
  *   Hide "Stainless": Part rusts. (Kind?)

  ---

  ### The Decision Procedure: "The Substitution & Stability Protocol"

  **Time Limit:** 15 Minutes
  **Who:** Junior Cataloger
  **Goal:** Route ticket to NO (Facet/Data Fix), YES (Escalate to Manager), or TRADEOFF (Manager Decision).

  #### Step 1: The Data Existence Check (2 Minutes)
  *   **Question:** Does an attribute facet already exist for this modifier (e.g., `Material`, `Finish`, `Property Class`)?
  *   **Evidence:** Check the Facet Configuration table.
  *   **Sufficient Answer:**
      *   **NO:** Go to Step 2. (New attribute needed).
      *   **YES:** Check population rate. Query the SKU count for the parent category. What % have this attribute populated?
          *   **< 80%:** Ticket is a **DATA FIX**. Stop. Write note: *"Attribute exists but data is dirty. Creating a node will hide 20% of inventory. Assign to Data Team."*
          *   **> 80%:** Go to Step 2.

  #### Step 2: The Substitution Test (5 Minutes)
  *   **Question:** If a customer orders "X" and we ship "Parent Category" without the modifier, does it cause failure, liability, or return?
  *   **Evidence:** Supplier spec sheet, Industry Standard (e.g., ASTM/ISO), or Sales Rep confirmation of use-case.
  *   **Sufficient Answer:**
      *   **Safe to Swap:** (e.g., Color preference, minor finish difference). **Verdict: NO.**
          *   *Reply:* "This is a filterable preference, not a distinct product kind. Ensure the facet is visible on search results."
      *   **Unsafe to Swap:** (e.g., Structural grade, Corrosive environment). **Verdict: GO TO STEP 3.**

  #### Step 3: The Stability Test (Rectification of Names) (5 Minutes)
  *   **Question:** Does this modifier mean the *same thing* across 90% of our suppliers?
  *   **Evidence:** Compare spec sheets from 3 top suppliers for this modifier.
  *   **Sufficient Answer:**
      *   **Inconsistent:** (e.g., "Yellow Zinc" means 3 different chemical processes). **Verdict: NO.**
          *   *Reply:* "This term is ambiguous in the supply base. Creating a node will mix incompatible parts. We must standardize the attribute values first."
      *   **Consistent:** (e.g., "304 Stainless" is chemically defined). **Verdict: ESCALATE TO MANAGER.**
          *   *Note:* "Passed Substitution and Stability. Commercial case for distinct node required."

  #### Step 4: The Tradeoff Frame (For Escalations)
  *   **Question:** If the Manager says YES, what are we trading?
  *   **Evidence:** Search log volume for the compound term vs. the generic term.
  *   **Sufficient Answer:**
      *   **High Search Volume + High Risk:** Manager approves Node.
      *   **Low Search Volume + High Risk:** Manager enforces Mandatory Facet Selection (No Node).

  ---

  ### Running the Tickets

  #### Ticket 1: Grade 8.8 Hex Bolt
  *   **Step 1 (Data):** Attribute `Property Class` exists. Population is 95% (Good suppliers send certs). *Pass.*
  *   **Step 2 (Substitution):** If 4.8 is swapped for 8.8 in a structural joint, the bolt shears. Liability risk is high. *Fail (Unsafe).*
  *   **Step 3 (Stability):** ISO 898-1 defines 8.8 rigorously. Head stamps are standard. *Pass (Consistent).*
  *   **Step 4 (Tradeoff):**
      *   *Analysis:* This is the trap. Safety suggests "Kind," but Taxonomy suggests "Facet." If we make a node for 8.8, do we make one for 10.9? 12.9? 4.8? The tree explodes. The risk is managed by *forcing* the customer to select the Grade facet, not by hiding 4.8 bolts in a different tree.
      *   **Decision:** **NO.**
      *   **Reply to Category Manager:** "Grade is a mandatory specification, not a product kind. Creating a node fragments the hex bolt category and sets a precedent for every property class. We will fix this by making `Property Class` a required filter on the Hex Bolt landing page, not by splitting the tree. This ensures customers *must* choose a grade before adding to cart."
      *   **Result:** Manager is furious. They wanted a "Structural Bolts" landing page to feel safe. You gave them a form validation rule.

  #### Ticket 2: Stainless Hex Bolt
  *   **Step 1 (Data):** Attribute `Material` exists. Population is 80%. *Borderline.*
      *   *Check:* Why is 20% missing? Cheap suppliers.
      *   *Action:* Ticket triggers a Data Cleanup task for the 20%. But proceed to Step 2 for the taxonomy question.
  *   **Step 2 (Substitution):** If Carbon Steel is swapped for Stainless in a marine environment, the part rusts in months. High return risk. *Fail (Unsafe).*
  *   **Step 3 (Stability):** "Stainless" (A2/304) is chemically consistent across suppliers. *Pass.*
  *   **Step 4 (Tradeoff):**
      *   *Analysis:* Stainless fasteners are often a different supply chain, different margin, and different customer base (Food/Marine vs. Construction). Search logs show "Stainless Bolt" is a top query that currently bounces.
      *   **Decision:** **YES (Escalate).**
      *   **Note to Manager:** "Passed Substitution and Stability. Commercially, Stainless acts as a distinct product line (different vendors, lead times, margins). Search volume for compound term is 40% of generic 'Hex Bolt'. Recommend creating 'Stainless Fasteners' as a sibling to 'Carbon Fasteners' under a higher level, or a dedicated landing page that maps to the Material facet. **Condition:** Data team must backfill the missing 20% `Material` attributes within 30 days."
      *   **Result:** Rep is happy. Data team is annoyed (but accountable).

  #### Ticket 3: Yellow Zinc Bolt
  *   **Step 1 (Data):** Attribute `Finish` exists. Population 90%. *Pass.*
  *   **Step 2 (Substitution):** If Clear Trivalent is swapped for Yellow Chromate, does it fail? Usually no, it's cosmetic or minor corrosion resistance. *Pass (Safe).*
  *   **Step 3 (Stability):**
      *   *Check:* Supplier A = Yellow Chromate (Toxic, RoHS non-compliant). Supplier B = Trivalent (RoHS compliant, looks pale). Supplier C = Dyed (Paint, chips off).
      *   *Result:* The name "Yellow Zinc" does not map to a single actuality. It is a "dislocated name."
      *   **Decision:** **NO.**
      *   **Reply to Rep:** "The term 'Yellow Zinc' refers to three different chemical coatings in our supply base with different compliance profiles. We cannot create a category that mixes RoHS-compliant and non-compliant parts. We will update the `Finish` facet values to be specific (e.g., 'Yellow Chromate', 'Trivalent') and train search to recognize 'Yellow Zinc' as a synonym for the specific types."
      *   **Result:** Rep is furious. They just want to sell what the customer asks for. You just told them the customer's language is legally dangerous.

  ---

  ### Limitations & Failure Modes

  **What the Procedure Can't Settle:**
  1.  **Commercial Bets:** Sometimes a category is created not because of taxonomy purity, but because we signed an exclusive deal with a vendor who *only* makes Grade 8.8. The procedure says NO (Facet), but the business says YES (Revenue). This must be a Manager Override.
  2.  **Search Engine Capabilities:** If your search engine can't handle multi-select facets well (e.g., can't easily do "Hex Bolt" + "Grade 8.8"), the procedure forces a "NO" that breaks the user experience. The procedure assumes a competent search layer.

  **Where It Will Misfire (The Single Point of Failure):**
  *   **Step 1 (Data Population Threshold).**
  *   **The Failure:** Catalogers will mark "80% Populated" as **YES** to avoid the Data Fix queue. They will eyeball it.
  *   **The Symptom:** You approve a "Facet Only" decision. Customers search the term, get 50% of the results because the other 50% have null values. The Rep comes back screaming "Your taxonomy is broken!"
  *   **How to Notice:** Monitor "Zero Result" searches for terms that should have matches. If "Stainless Bolt" has zero results but you have 5k stainless SKUs, Step 1 failed.
  *   **Mitigation:** Require a SQL count screenshot attached to the ticket for Step 1. No screenshots, no triage.

  ---

  ### What Would Change My Mind?

  **The Argument:** "The White Horse framing is wrong because customers don't think in taxonomy, they think in *tasks*."

  **The Evidence:**
  If you analyze search logs and find that 90% of searches for "Hex Bolt" are immediately followed by a filter selection, but 90% of searches for "Stainless Bolt" result in a direct add-to-cart *without* filtering, then the taxonomy is fighting the intent.
  However, if you show me that **Natural Language Search (NLS)** is improving to the point where facets are irrelevant (i.e., the search bar understands "Grade 8.8 Hex Bolt" and filters the generic "Hex Bolt" category dynamically), then **the entire procedure is obsolete.**

  If your search engine can parse "Grade 8.8" as a filter instruction on the fly, you don't need category nodes for compounds. You only need nodes for distinct *supply chain* realities (like Stainless).

  **The Pivot:**
  If we move to a "Flat Catalog + Smart Search" model, I would scrap the "Category Node" question entirely. The decision becomes: "Is this a valid filter value?"
  *   Grade 8.8? Yes (Filter).
  *   Yellow Zinc? No (Ambiguous Filter).
  *   Stainless? Yes (Filter).

  **Why I haven't pivoted yet:** You said "Search resolves to a tree node first." Until your architecture changes, the Tree is the gatekeeper. The White Horse logic holds because the Tree *excludes*. A Filter *includes*. If you are building Walls (Tree), you must be sure the White Horses need a separate Stable. If you are building Fences (Filters), you just need to label the horses correctly.

  **Final Advice:**
  Your hunches are correct.
  1.  **Substitution Test** is your sword (cuts through "Kind" vs "Modifier").
  2.  **Data Quality** is your shield (protects against bloat).
  3.  **Gongsun Longzi** is your map (keeps you honest about Names vs. Realities).

  Don't teach the map to the soldiers. Just make sure they know how to use the sword.
