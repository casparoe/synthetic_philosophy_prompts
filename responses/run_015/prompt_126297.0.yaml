answer: |-
  This is a nuanced and critical question that cuts to the heart of Montaigne's philosophical project. The tension you identify—between a reading of Montaigne as a proto-cultural relativist and a reading of him as a skeptic employing a thin universal standard—is one of the most significant debates in Montaigne scholarship.

  Based on the textual evidence in "Of Cannibals" and the broader context of his *Essays*, the passage is best read not as a **proto-relativist argument that eliminates universal standards**, but as a **skeptical mirror that employs immanent critique to demolish European self-certainty.**

  Here is an analysis of the philosophical logic governing this comparison, the function of its structure, and why the "skeptical mirror" reading prevails over strict relativism.

  ### 1. Why Strict Relativism Fails
  The proto-relativist interpretation rests on Montaigne's famous opening assertion: *"Everyone gives the title of barbarism to everything that is not in use in his own country."* This suggests that "barbarism" is merely a label for the unfamiliar. However, if Montaigne were a strict relativist, the comparison would end there. He would argue that cannibalism is "right for them" and torture is "right for us," and no cross-cultural judgment could be made.

  But Montaigne does not stop at description; he moves to **ranking**. He explicitly states:
  > *"I think there is more barbarity in eating a man alive than in eating him dead; and in tearing by tortures and the rack a body still full of feeling... than in roasting and eating him after he is dead."*

  By claiming one act is *more* barbarous than the other, Montaigne invokes a comparative standard. He is not dissolving moral judgment; he is redirecting it. A strict relativist cannot claim European torture is objectively worse than ritual cannibalism without contradicting their own premise. Montaigne, therefore, is not arguing that all moral standards are culture-internal; he is arguing that the specific standard Europeans *claim* to hold (civility, reason, Christian mercy) is being violated by Europeans more egregiously than by the Tupinambá.

  ### 2. The Logic of Immanent Critique (The Skeptical Mirror)
  The second interpretation you offer—that Montaigne invokes a minimal, cross-cultural criterion—is the more robust reading. This aligns with his Pyrrhonian skepticism. Skepticism for Montaigne is not nihilism (the belief that nothing is true); it is the suspension of *dogmatic certainty* regarding one's own superiority.

  The logical structure here is **immanent critique**. Montaigne does not import an external moral code to judge Europe. Instead, he uses the values Europe *professes* to judge Europe's *actions*.
  *   **The Professed Value:** Europeans claim to be "civilized," rational, and guided by divine law, which ostensibly prohibits cruelty and values human life.
  *   **The Observation:** Europeans engage in prolonged, inventive torture over abstract theological disputes.
  *   **The Comparison:** The "savages" engage in swift, ritualistic killing based on martial honor and necessity (revenge/sustenance).
  *   **The Verdict:** By the Europeans' *own* standards of reason and mercy, the Europeans are the true barbarians.

  The "thin universal standard" you suspect is likely **natural reason** or **compassion regarding suffering**. Montaigne assumes that prolonged agony is intuitively worse than swift death, regardless of culture. He does not need to prove this metaphysically; he relies on the reader's visceral reaction. The logic is: *If you claim cruelty defines barbarism, then look at who is being more cruel.*

  ### 3. The Function of the Structure: From Ethnography to Indictment
  The structure you noted—moving from apparently neutral description to moral indictment—is the rhetorical engine of Montaigne's skepticism. It functions in three stages to destabilize cultural confidence:

  **A. Defamiliarization (The Neutral Description)**
  Montaigne begins by describing the Tupinambá practices without immediate condemnation. He contextualizes their cannibalism as an act of valor and revenge, noting that they do not eat for hunger but for ritual. This disarms the reader. By humanizing the "savage," he removes the immediate emotional barrier that would allow the reader to dismiss them as monsters.

  **B. Juxtaposition (The Shock)**
  He then pivots abruptly to Europe. He does not compare the Tupinambá to an idealized version of Christianity, but to the *reality* of the French Wars of Religion. He details the burning of bodies, the tearing of limbs, and the religious zeal that fuels it. This juxtaposition creates cognitive dissonance. The reader expects the "savage" to be the baseline for barbarism, but the text forces the reader to see the "civilized" neighbor as the outlier in cruelty.

  **C. Inversion (The Destabilization)**
  The conclusion inverts the label. The "barbarian" is no longer the one across the ocean; the "barbarian" is the one looking in the mirror. This serves Montaigne's larger project of curing *hubris* (pride). For Montaigne, the root of the French Wars of Religion was not just theological disagreement, but the dogmatic certainty that one side possessed absolute Truth and the other deserved annihilation. By showing that "savages" possess a more consistent honor code than "Christians," he undermines the moral authority used to justify the violence.

  ### 4. Contextualizing the "Universal"
  It is important to clarify that Montaigne's "universal" is not a rigid moral law. It is grounded in **human nature**. Montaigne often argues that there are "laws of nature" that are not written but felt. The aversion to watching a fellow human suffer prolonged torture is one such law.

  When he writes, *"We can call them barbarians in respect to the rules of reason, but not in respect to ourselves, who in all sorts of barbarity exceed them,"* he is making a distinction between:
  1.  **Abstract Reason:** By which the cannibals might seem barbaric (eating human flesh).
  2.  **Concrete Action:** By which the Europeans are more barbaric (torturing living souls).

  He privileges the concrete reality of suffering over the abstract categorization of acts. This is a hallmark of his skepticism: prioritizing lived experience over dogmatic classification.

  ### Conclusion
  You should read this passage as a **skeptical mirror that leaves a thin universal standard intact.**

  Montaigne is not arguing that "cannibalism is good." He is arguing that **the claim to civilization is a performance that Europeans are failing.** The philosophical logic is not relativist (which would say "both are equal"), but corrective. He uses the "cannibal" as a foil not to elevate the Tupinambá to a state of perfection, but to lower the Europeans from their state of delusion.

  The structure serves to lure the reader into a sense of superiority (through ethnographic curiosity) before pulling the rug out (through moral indictment). This destabilization is the goal: to shock the French citizen, embroiled in religious slaughter, into realizing that their "civilization" is a veneer covering a brutality that exceeds the natural world they claim to dominate. Montaigne saves the possibility of moral judgment precisely to ensure it is applied where it is most needed: at home.
