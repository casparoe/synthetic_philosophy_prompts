      *   *Address Skeptical Mirror/Universalism:* Argue this is the stronger reading. Define the "universal" not as a complex moral code, but as a basic human reaction to suffering.
      *   *Analyze the Structure:* Break down the movement from ethnography to moral indictment. Explain how this creates the "shock" necessary for skepticism.
      *   *Contextualize:* Bring in the French Wars of Religion. The "barbarism" isn't abstract; it's the specific violence of Montaigne's contemporaries.
      *   *Conclusion:* Summarize. Montaigne uses the "cannibal" not to validate cannibalism, but to indict the *claim* to civilization.

  8.  **Refining the Philosophy:**
      *   Need to be careful with the term "universal." Montaigne avoids grand metaphysical universals. It's more of a "natural law" of compassion or reason that Europeans are ignoring.
      *   Key concept: *Immanent Critique*. Judging a system by its own standards.
      *   Key concept: *Pyrrhonian Skepticism*. Suspending the *certainty* of the judgment, not the judgment itself.
      *   Reference the specific line: "I am not so concerned that we should remark the barbarous horror of such acts, but that, whilst our own errors and transgressions are so many, we should be so sharp-sighted abroad."

