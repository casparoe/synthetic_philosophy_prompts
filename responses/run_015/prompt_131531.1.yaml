answer: |-
  Here is the design document for **"The Potion Paradox."**

  I've acted as the game designer here: I prioritized **robustness** (it works with 8 kids), **tactility** (they touch the data), and **cognitive dissonance** (they bet on the wrong thing). I discarded the "Basketball" and "Quiz" ideas because human skill variance is too noisy for a 40-minute session with mixed stats backgrounds. I also discarded a pure "Card Draw" for the *Type* variable because if the random draw fails to give you enough Wizards, the activity dies. Instead, we rig the *population* (the bag) but let them generate the *outcome* (the dice).

  ### Part 1: Concept Brainstorming

  1.  **The "Two-Teacher" Quiz:** Students choose a teacher, take a 2-question quiz, and we compare scores.
      *   *Why I threw it out:* Takes too long. If the "better" teacher gets a group of students who didn't sleep last night, the data breaks. Too much noise.
  2.  **The "Basketball Shooter":** Two players shoot from two spots. One is better at both spots but takes harder shots.
      *   *Why I threw it out:* Requires athletic skill. If the "better" shooter has an off day, the paradox vanishes. Also, hard to scale to 14 people simultaneously.
  3.  **The "Potion Shop" (Selected):** Students act as patients at two clinics. They draw a "Patient Type" from a rigged bag and roll a die for "Cure."
      *   *Why this wins:* We control the *confounding variable* (Type distribution) to guarantee the paradox, but the students control the *outcome* (dice rolls), making it feel random and earned. It's fast, scalable, and the math is bulletproof.
  4.  **The "Stock Market" Simulation:** Students pick stocks based on "Tech" vs. "Industrial" sectors.
      *   *Why I threw it out:* Too abstract. High schoolers don't have strong intuitions about stock sectors, so the "sting" of the wrong prediction won't land.

  ---

  ### Part 2: The Activity — "The Potion Shop"

  **Time:** 40 Minutes
  **Players:** 8–14 (Robust down to 8)
  **Materials:**
  *   2 Opaque Bags (or boxes) labeled **Clinic Green** and **Clinic Purple**.
  *   **Tokens:** 40 Poker Chips or Colored Squares of Paper.
      *   *Green Bag:* 3 "Wizard" tokens, 17 "Warrior" tokens.
      *   *Purple Bag:* 17 "Wizard" tokens, 3 "Warrior" tokens.
  *   **Dice:** 14 six-sided dice (or a phone dice roller app).
  *   **Board:** Whiteboard divided into two tables (Green vs. Purple).
  *   **Stakes:** Granola bars (1 per person). **Golden Ticket** (extra bar) for the team with the best prediction record. **The "Presenter" Curse:** The person with the worst prediction record has to present the debrief next week.

  #### Phase 1: The Setup (0:00–0:05)
  **Hook:** "We have two healing potions. Green and Purple. We don't know which is better. You are the test subjects. Your goal: Get cured. My goal: Trick you."

  **Rules:**
  1.  Split the room roughly in half. One group goes to **Clinic Green**, one to **Clinic Purple**. (If you have 8 kids, 4 per side is fine).
  2.  **Step 1:** Draw one token from your clinic's bag. This is your **Patient Type** (Wizard or Warrior). Write it down. *Do not show anyone yet.*
  3.  **Step 2:** Roll your die. This is your **Outcome**.
      *   **If you are a WIZARD:** You are cured on a **1–5**. (Fail on 6).
      *   **If you are a WARRIOR:** You are cured on a **1–3**. (Fail on 4–6).
      *   *(Note: These rules are the same for BOTH clinics. The potion doesn't change the dice rules, it changes who walks in the door.)*
  4.  **Step 3:** Record your result (Cured / Not Cured) on the board under your Clinic.

  **The Prediction (The Sting):**
  Before anyone reveals their tokens, ask:
  *"Based on the cure rates on the board, which potion is better? Write it down. If you're right, you get a Golden Ticket. If you're wrong, you're in the running for The Presenter Curse."*

  #### Phase 2: The Reveal (0:05–0:15)
  1.  **Calculate Overall Rates:** Tally the Cures.
      *   *Expected Math:*
          *   **Green:** Mostly Warriors (hard to cure). Expect ~50-60% cure rate.
          *   **Purple:** Mostly Wizards (easy to cure). Expect ~80% cure rate.
      *   *Result:* **Purple looks way better.** Most kids will bet on Purple.
  2.  **The Twist:** "Okay, reveal your tokens. Let's split the data by Type."
  3.  **Recalculate:**
      *   **Wizards:** Compare Green Wizards vs. Purple Wizards. (Both used the 1-5 rule, so they should be roughly equal, ~83%).
      *   **Warriors:** Compare Green Warriors vs. Purple Warriors. (Both used the 1-3 rule, so they should be roughly equal, ~50%).
      *   *Wait, this is equality, not Simpson's.* **Correction for the Facilitator:**
      *   *To make it Simpson's, the Potion must actually help.*
      *   **REVISED RULES FOR SIMPSON'S:**
          *   **Green Clinic:** Wizards roll 1-6 (100% Cure). Warriors roll 1-4 (66% Cure).
          *   **Purple Clinic:** Wizards roll 1-5 (83% Cure). Warriors roll 1-3 (50% Cure).
          *   *Green is better for both types.*
          *   *But Green bag has 17 Warriors / 3 Wizards.* (Hard cases).
          *   *Purple bag has 3 Warriors / 17 Wizards.* (Easy cases).
          *   *Overall:* Green will look worse because it treated the hard cases.
  4.  **The Flip:**
      *   **Subgroup:** Green wins (100% > 83% and 66% > 50%).
      *   **Overall:** Purple wins (because they cherry-picked the Wizards).
  5.  **Reaction:** Let them feel the sting. "Who voted Purple? Stand up. You just ignored the lurking variable."

  #### Phase 3: The Trap (Round 2) (0:15–0:25)
  **Facilitator Note:** This is the "Collider/Mediator" piece. Do not run a full game. Use a thought experiment with the same data.

  **Script:**
  "Okay, you learned to split by the lurking variable (Patient Type). But be careful. Sometimes splitting makes it *worse*."

  **Scenario:** "Imagine the Green Potion causes a side effect: **Glowing**. The Purple Potion does not."
  *   **Fact:** Green Potion makes 100% of people Glow.
  *   **Fact:** Purple Potion makes 0% of people Glow.
  *   **Fact:** People who Glow are more likely to be Cured (because the potion works).

  **The Trap:** "If I only look at the **Glowing** patients to judge the potions, what happens?"
  *   In the "Glowing" group, *everyone* took Green. There are no Purple patients (or very few).
  *   If we force a comparison, we might find the few Purple people who Glowed were "Super-Warriors" who survived despite the weak potion.
  *   **Lesson:** "Glowing" is caused by the Treatment. If you control for it, you block the path of how the treatment works.
  *   **Activity:** Have them raise hands. "Who thinks we should control for Side Effects?" (Half will say yes). Show them that doing so deletes the Purple group entirely.

  **Takeaway:** "Split by variables that exist *before* the treatment (like Type). Don't split by variables caused *by* the treatment (like Side Effects)."

  #### Phase 4: Debrief (0:25–0:40)
  1.  **Map the Moments:**
      *   *The Bet:* This was your intuition (Overall Rate).
      *   *The Token Reveal:* This was the Lurking Variable (Confounding).
      *   *The Split:* This was Stratification.
  2.  **Predictable Failure Points:**
      *   *Problem:* "We didn't get enough Wizards in the Green group to calculate a rate."
      *   *Fix:* If Green draws 0 Wizards, say: "Statistically, the rate is still 100%, we just had a small sample. The *rules* were better." (Don't let the noise kill the lesson).
      *   *Problem:* "The dice rolled weird and Purple Warriors beat Green Warriors."
      *   *Fix:* Acknowledge variance. "In real life, we use p-values. Today, we trust the design."
  3.  **The Honest Limitation:**
      *   "This activity proves that *confounding* exists. It does **not** teach you how to mathematically adjust for it (like regression). It also doesn't prove *causality*. Green looked better, but maybe Wizards just heal faster naturally. To know for sure, we'd need a Randomized Controlled Trial where *I* assign the tokens, not the bags."

  ---

  ### Part 3: Designer's Notes for You (The Facilitator)

  **1. Robustness Check (The "8 Kids" Scenario)**
  *   **The Math:**
      *   **Green Bag:** 3 Wizards (100% cure), 17 Warriors (66% cure). Expected Overall: ~70%.
      *   **Purple Bag:** 17 Wizards (83% cure), 3 Warriors (50% cure). Expected Overall: ~80%.
      *   **Paradox:** Green is better in both subgroups, Purple wins overall.
  *   **With 4 Kids per side:**
      *   Green will likely draw 0-1 Wizards. Purple will likely draw 3-4 Wizards.
      *   *Risk:* If Green draws 0 Wizards, you can't show the subgroup win.
      *   *Mitigation:* If this happens, **do not panic.** Say: "The sample was too small to see the Wizards, but look at the Warriors: Green won. And we *know* the rules gave Green the Wizard advantage. The paradox is in the *design*, the dice just add noise."
      *   *Better Mitigation:* Use **20 chips per bag** but tell them "Imagine this bag represents 100 patients. You are drawing the *average*." No, that's lying.
      *   *Best Mitigation:* **Pre-seed the first draw.** Hand the first person at the Green table a Wizard token secretly. "Here, you're the first patient." This guarantees at least one data point for the subgroup.

  **2. The "Second Half" Trap (Collider Bias)**
  *   This is conceptually hard. Keep it simple.
  *   **Visual:** Draw a triangle on the board.
      *   Top: **Potion**
      *   Bottom Left: **Cure**
      *   Bottom Right: **Glow**
      *   Arrows: Potion -> Cure. Potion -> Glow. Glow -> Cure.
  *   **Explanation:** "If you hold 'Glow' constant, you are cutting the arrow from Potion to Cure. You're asking: 'For people who already Glowed, did the potion help?' But the potion *made* them Glow! You're deleting the evidence."

  **3. What This Activity Can't Deliver**
  *   **Causality:** This is observational data (they chose the clinic/bag). A sharp kid will say, "Maybe Wizards just choose Green?"
      *   *Response:* "Exactly! That's why we need Random Assignment. Today we saw *association*. Next week we can talk about *causation*."
  *   **Mathematical Adjustment:** They won't learn *how* to calculate the adjusted rate (weighted average). They will just see that the split changes the story. That is enough for a lunch club.

  **4. Timeline Buffer**
  *   If you run long, cut the "Round 2" discussion short. The Simpson's Paradox reveal is the core. The Collider bias is a "bonus level." Don't sacrifice the reveal for the nuance.

  **5. Final Tip**
  *   When they vote on the winner in Phase 2, make it public. "Hands up for Green. Hands up for Purple." Take a photo. Put it on the board. When the reversal happens, point to the photo. "This is why we do math, not vibes."

  Good luck. If the dice hate you, blame the statistics gods and order pizza next week.
