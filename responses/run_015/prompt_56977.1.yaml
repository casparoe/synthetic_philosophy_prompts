          2.  **Field Status:** Mark settled vs. live fights. Don't fake consensus.
          3.  **Constraints:** Under 600 words. No throat-clearing. Paste-ready.

  2.  **Deconstruct the Argument & Identify the "Joint":**
      *   The critical leap is from (3) to (4) and (4) to (5).
      *   (3) says narrative form is imposed by the historian. (4) says if form comes from the representer, it's not answerable to the thing.
      *   *The Joint:* The conflation of *selection/emplotment* with *fabrication*. Just because the historian chooses the narrative structure doesn't mean the *content* within that structure is unconstrained by evidence/reality.
      *   Step (5) is also suspect: "A construction is answerable only to internal standards." This is the strongest point of attack. Maps are constructions, but they are answerable to the terrain.
      *   *Generalization Worry (4):* If (4) holds, maps, scientific models, and eyewitness testimony are all "literature." This is likely a *reductio* of (4), not an unwelcome truth. It conflates *mediation* with *unconstraint*.

  3.  **Evaluate Alternatives (Cost Analysis):**
      *   *Keep (2) deny (3):* Hard to do. If events don't determine narrative, how does narrative not come from the historian? Maybe from the audience? Or maybe "narrative" is inherent in action itself (Mink vs. Veyne). Cost: Requires arguing actions *are* already storied, which is metaphysically heavy.
      *   *Deny (2):* Claims events *do* dictate the plot. Cost: Naive realism. Ignores underdetermination. Instructor doesn't want this.
      *   *Deny (4)/(5):* Claims construction *can* be answerable to truth. Cost: Need a theory of reference/truth that survives mediation. (e.g., Critical Realism). This aligns with instructor's preference (lose 6 not 2).

  4.  **Field Status (Settled vs. Live):**
      *   *Settled:* Pure Rankean objectivity is dead. Narrative involves selection (White, Mink).
      *   *Live:* Whether narrative imposition destroys truth-claims (Strong Constructivism vs. Critical Realism). Carr is definitely not on the student's side (Carr believes in factual constraint).

