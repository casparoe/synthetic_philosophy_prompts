  2. **Deny (2):** You claim events determine the narrative. Cost: Naive realism. It ignores underdetermination. The Battle of France can be told as a tragedy of failure or a comedy of errors; the events don't dictate the genre. You rightly reject this.
  3. **Keep (2) & (3), Deny (4) & (5):** This is your preferred route. Cost: You must explain *how* evidence constrains narrative without dictating it. You lose the clean separation of fact and interpretation, accepting instead that they are entangled but distinct.

