      *   *Drafting content:*
          The joint is the inference from (3) to (4). The student conflates *mediation* with *fabrication*. Just because the historian imposes narrative form doesn't mean the representation isn't answerable to the past. Maps are constructed (projection, scale) but answerable to terrain. Rejecting (4) costs you the claim that all construction is fiction; you must adopt a theory of truth compatible with mediation (e.g., critical realism).

          If you keep (2) but deny (3), you claim events dictate their own plot. Cost: Naive metaphysics. Actions aren't inherently tragic or comic; that *is* imposed. You rightly reject this.
          If you deny (2), you claim events determine narrative. Cost: Ignoring underdetermination. Same facts support multiple valid narratives.
          The viable path is keeping (2) and (3) but rejecting (4) and (5). Construction does not preclude answerability.

          Regarding the generalization: (4) is a *reductio*, not an unwelcome truth. If (4) holds, scientific models and eyewitness testimony are also "literature." Since we rely on these for survival, (4) is false. Mediation is necessary for representation, but it doesn't sever the reference relation.

