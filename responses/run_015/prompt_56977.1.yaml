          2.  Events don't determine narrative order (underdetermination).
          3.  Narrative order comes from the historian (construction).
          4.  If form comes from representer, representation isn't answerable to the thing (construction vs. truth).
          5.  Constructions answer only to internal standards, not truth.
          6.  Therefore, history isn't answerable to truth about the past; Rankean ideal is a category mistake.
          7.  Objection (corrections happen): Reply (corrections are also narrative moves).
          8.  Conclusion: Stop history or admit it's literature.
