answer: |-
  **The Scale Argument**
  *   **Handling Epistemic Uncertainty:** This view treats uncertainty as a discount factor within an expected utility calculus. Moral weight is not binary but probabilistic; if there is a non-zero chance ($p$) an insect is sentient, it possesses fractional moral status ($p \times \text{full status}$). Uncertainty reduces the weight per individual but does not negate it.
  *   **Policy Divergence:** In **broad-spectrum pest control**, this view mandates radical restriction or abandonment of insecticides. Because the insect population ($N$) is vast, the aggregated expected suffering ($N \times p$) outweighs agricultural efficiency gains, requiring farmers to accept significant crop loss to avoid probabilistic harm.
  *   **Structural Vulnerability:** The argument relies on **additive aggregativity**. This feature exposes it to the objection that it inflates moral status through arithmetic rather than evidence. By allowing low-confidence attributions of consciousness to sum across trillions of individuals, the view generates high-confidence moral obligations without ever securing robust evidence for consciousness in any single entity.

  **Threshold Deference**
  *   **Handling Epistemic Uncertainty:** This view treats uncertainty as a gatekeeper rather than a discount factor. Moral consideration requires the probability of sentience to cross a categorical confidence threshold. Below this line, moral weight is zero; above it, moral weight is full. Uncertainty below the threshold yields no obligation, regardless of population size.
  *   **Policy Divergence:** In **broad-spectrum pest control**, this view permits standard agricultural eradication practices. Unless evidence raises the probability of insect sentience above the deference threshold, the vast numbers of insects killed carry no moral weight, prioritizing crop yield and human welfare over invertebrate potentiality.

  **Comparative Diagnosis**
  The divergence rests on whether moral status is **continuous and aggregatable** (Scale) or **binary and individual** (Threshold). The Scale Argument's reliance on additive aggregativity allows population magnitude to compensate for evidentiary weakness, whereas Threshold Deference insists that evidentiary robustness per individual is a prerequisite for any moral accumulation.
