  **The Complex Simplicity of Good: Reconciling Moore's Organic Unities and Intrinsic Goods**

  G.E. Moore's *Principia Ethica* is built on a deceptively simple foundation: "good" is a simple, non-natural property that cannot be defined, only intuited. Yet, when Moore populates his ethical universe with specific intrinsic goods—specifically "the pleasures of human intercourse" (friendship) and "the enjoyment of beautiful objects"—he invites a structural tension. As your professor hinted, the Principle of Organic Unities (where the value of a whole differs from the sum of its parts) seems to complicate the status of these goods. If friendship is a relational whole, can it be an intrinsic good? If beauty requires an observer, does that compromise Moore's objective non-naturalism?

  By examining the edge cases of the isolated aesthete and the beauty-blind friend, we can test the coherence of Moore's system. The conclusion is not that Moore is logically inconsistent, but that his consistency relies on a rigorous, perhaps counter-intuitive, distinction between the *bearer* of value and the *property* of value. Moore does not need to choose between simple and relational properties of "goodness"; rather, he must insist that the *bearer* of the simple property is itself a complex, relational state of consciousness.

  **Friendship and the Organic Whole**

  The first tension arises from the nature of friendship. If value is intrinsic, it should belong to a thing in isolation. But friendship is inherently relational; it requires at least two people. If Moore claims friendship is an intrinsic good, is he contradicting his own requirement that intrinsic value depends solely on the intrinsic nature of the thing?

  Moore escapes this trap through the Principle of Organic Unities. He does not claim that the *existence of another person* is the intrinsic good. Rather, the intrinsic good is the *consciousness of mutual affection*. This mental state is the "whole." According to the Organic Unity principle, the value of this whole (the awareness of being loved and loving) is vastly greater than the sum of the value of the pleasure involved plus the value of the other person's existence.

  This clarifies the edge case of the "beauty-blind friend"—someone with deep friendships but no appreciation for art or nature. For Moore, this person possesses a massive amount of intrinsic value. The isolation case (the "aesthetic hermit" with perfect rapture but zero friends) also possesses intrinsic value. The Organic Unity principle is not broken by the isolation case; rather, the principle explains why we might intuitively feel the hermit is missing something essential. The hermit has one type of organic whole (consciousness of beauty), while the friend has another (consciousness of affection). Moore argues that the *best* state is a combination of both, but the isolation of one does not negate its intrinsic worth. The tension dissolves because Moore locates the value not in the external relation between people, but in the internal complexity of the mental state regarding that relation.

  **Beauty, Observers, and Non-Naturalism**

  The second tension is more metaphysical. Moore is a staunch anti-naturalist; he believes "good" is not a natural property like "pleasurable" or "desired." However, beauty seems to depend on a conscious observer to be appreciated. If intrinsic value relies on a mental state (appreciation), does this slide into subjectivism or naturalism?

  Here, Moore makes a crucial distinction that saves his system. He argues that a beautiful object *in itself*, without a consciousness to appreciate it, has no intrinsic value whatsoever. A beautiful sunset in a universe with no eyes to see it is value-neutral. The intrinsic value arises only when the beautiful object is combined with the consciousness of it.

  Does this dependence on a mental state violate non-naturalism? No. Non-naturalism claims that the *property* of goodness cannot be reduced to natural terms. It does not claim that the *thing which is good* must be non-physical or non-mental. For Moore, a state of consciousness is a natural phenomenon, but the "goodness" that attaches to it is a non-natural property. Therefore, the aesthetic hermit's rapture is objectively good, not because the hermit desires it, but because that specific complex state of consciousness necessarily possesses the simple property of "good." The dependence on an observer is a condition for the *existence* of the good, not a definition of the *nature* of goodness.

  **The Verdict: Consistency at a Cost**

  So, can Moore consistently hold both friendship and beauty as intrinsic goods given his Organic Unity principle? Yes, but only by narrowing the scope of what counts as the "intrinsic good."

  Your intuition that Moore must choose between simple or relational properties is insightful, but the solution lies in splitting the difference. Moore treats "good" as a **simple property**, but he attaches it to **complex, relational bearers**.

  1.  **Regarding Friendship:** Moore is consistent. He avoids the trap of valuing the external relation by valuing the internal consciousness *of* that relation. The isolation case does not break the Organic Unity claim; it merely highlights that friendship is one specific type of valuable organic whole, distinct from aesthetic appreciation.
  2.  **Regarding Beauty:** Moore is consistent with his anti-naturalism. The requirement of an observer makes the good *mind-dependent*, but not *mind-defined*. The value is objective because any identical state of consciousness anywhere in the universe would possess the same value, regardless of cultural or individual whim.

  However, while Moore is logically consistent, his position reveals a fragility. By insisting that the "good" is a simple property attached to complex states of consciousness, he makes it difficult to explain *why* these specific unities (friendship and beauty) are good and others are not. If the value of the whole is not the sum of the parts, what dictates which wholes are valuable? Moore appeals to intuition, but the Organic Unity principle risks becoming a "get out of jail free" card for any counter-example. If someone argues that "cruelty to the innocent" creates a valuable organic unity of consciousness, Moore must simply assert our intuition says otherwise.

  **Conclusion**

  Moore can consistently maintain that friendship and beauty are intrinsic goods without violating the Principle of Organic Unities or his anti-naturalism. He achieves this by rigorously defining the bearers of value as complex states of consciousness rather than external objects or relations. The isolated aesthete and the beauty-blind friend both access intrinsic goods, validating Moore's pluralism.

  However, this consistency comes at the price of explanatory power. Moore saves his theory by retreating into the mind. He successfully argues that value is objective and non-natural, but only by locating it in the private, complex interplay of consciousness and its objects. Ultimately, Moore does not have to choose between simple properties and relational unities; he must accept that the **simple property of goodness inheres in relational unities of consciousness.** If he fails to make this distinction precise, his system collapses into the naturalism he sought to destroy. But if he holds the line, the tension your professor pointed out is not a contradiction, but the very engine of his ethical theory.
