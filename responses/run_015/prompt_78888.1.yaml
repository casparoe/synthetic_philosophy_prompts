answer: |-
  Here is your Q&A prep sheet. I have ordered these by the amount of damage they can do to your project. The top three threaten your authority to speak on the text; the middle three threaten the philosophical novelty; the bottom two threaten the utility.

  ### 1. The Historian of Chinese Philosophy
  **Voice:** Stern, protective of the tradition, slightly weary of Western categorizations.
  **Objection:** "You're treating Gongsun Long as a proto-Fregean, but the School of Names (*Mingjia*) wasn't doing abstract semantics for fun. This was about *Zhengming*—the rectification of names for political and moral order. If a name doesn't match the actuality, social order collapses. By reading this as a puzzle about substitutability salva veritate, you're stripping the argument of its ethical stakes. You're turning a political warning into a parity argument. Isn't this just philosophical imperialism?"
  **Your Reply:** "I concede that Gongsun Long's *motivation* was likely political, not purely analytic. But the *mechanism* he uses to make that political point relies on a specific semantic structure. My claim isn't that he was a Fregean, but that the structural problem he identifies—how compound names fix features differently than simple names—is valid regardless of his moral intent. We can acknowledge the political context without denying the semantic insight he uses to drive it home."
  **Soft Spot:** You are bluffing on the political context. If they push on specific passages linking this to governance that you haven't addressed, you will look like you're ignoring the text's purpose to save your theory.
  **Damage:** High. This challenges the legitimacy of your entire approach.

  ### 2. The Textual Scholar
  **Voice:** Skeptical, focused on manuscript variance, impatient with systematizing.
  **Objection:** "You're building a precise theory of reference on a text that we know is a patchwork. The received text of the *Gongsun Longzi* is likely compiled centuries after the fact, with bits dislocated and words lost. You're treating paragraph one as logically entailing paragraph two, but there's no guarantee they were originally connected. How can you extract a coherent semantics from a corrupted manuscript?"
  **Your Reply:** "That's a fair caution, and I'm not claiming the text is a pristine logic textbook. However, even if the text is composite, the argumentative structure regarding 'seeking' and 'designating' holds together internally. I'm arguing for the coherence of the *argument* presented in the received text, not necessarily the historical intent of the original author. If the argument works as written, it deserves analysis even if the manuscript history is messy."
  **Soft Spot:** You are relying on the received text's coherence. If they point out a specific lacuna or interpolation that breaks the logical flow you're relying on, you have no defense unless you know the textual criticism literature (which you admitted you don't).
  **Damage:** High. Undermines your evidence base.

  ### 3. The Sinologist/Philologist
  **Voice:** Precise, focused on particles and grammar, sharp on your language limitation.
  **Objection:** "You're translating *fei* as 'is not' and treating it as logical negation or non-identity. But in this context, *fei* often functions more like 'is not the same kind as' or 'is opposed to.' You're relying on commentaries to fix the meaning of terms you can't read independently. Are you sure you aren't importing an English copula distinction into a language that handles predication differently?"
  **Your Reply:** "I am working from translations, but I'm arguing that regardless of the specific grammatical particle, the functional role of the term in the argument is to block substitution. Whether *fei* means 'is not' or 'is not the same as,' the operational result in the dialogue is that 'white horse' cannot replace 'horse' in the context of seeking. My thesis is about the functional logic of the dialogue, not the precise grammatical category of *fei*."
  **Soft Spot:** This is your weakest point. You admitted you crib the Chinese. If they press on a specific grammatical construction that makes your "substitutability" reading impossible in Classical Chinese, you will be exposed.
  **Damage:** High. Targets your specific vulnerability.

  ### 4. The Fregean
  **Voice:** Analytic, slightly bored, thinks they've seen this movie before.
  **Objection:** "You're making a big deal about names fixing features versus picking out extensions. That's just the Sense/Reference distinction. 'White horse' and 'horse' have the same reference (extensionally) but different senses. Gongsun Long just discovered Sense but lacked the vocabulary. Why do we need a new theory of 'fixing features' when Frege solved this in 1892?"
  **Your Reply:** "Frege's Sense is about the *mode of presentation* of an object. Gongsun Long isn't talking about how we present an object to the mind; he's talking about what conditions a name *fixes* in the world for it to be satisfied. It's closer to a condition-based semantics than a cognitive sense. He's arguing that the name itself carries constraints that prevent substitution, not just that our grasp of the name differs."
  **Soft Spot:** The distinction between "mode of presentation" and "conditions fixed" is thin. If they press you on how this differs from intensionality generally, you might look like you're splitting hairs to claim novelty.
  **Damage:** Medium. Threatens the novelty of your contribution.

  ### 5. The Kripkean
  **Voice:** Blunt, dismissive of "confusion," focused on rigid designation.
  **Objection:** "This is just a bad argument. 'Horse' rigidly designates a natural kind. 'White horse' designates a subset. If I say 'I want a horse,' and you bring me a white horse, I have what I asked for. The extension of 'white horse' is contained in 'horse.' Gongsun Long is just confused about subsets. Why are we dignifying a scope fallacy?"
  **Your Reply:** "He isn't denying the subset relation extensionally. He's denying the equivalence of the *demand*. If I ask for a white horse, a black horse fails the demand. If I ask for a horse, a black horse succeeds. Therefore, the term 'white horse' is not substitutable for 'horse' in the context of a request. The argument isn't about ontology; it's about the logic of satisfaction conditions."
  **Soft Spot:** Kripkeans hate "context" solutions to what they see as metaphysical errors. They may insist that if the extension is a subset, the identity statement should hold in some formalized way.
  **Damage:** Medium. Threatens the validity of the argument.

  ### 6. The Logician
  **Voice:** Impatient with natural language, wants operators.
  **Objection:** "You keep saying 'not substitutable in contexts where features matter.' That's vague. What is the operator here? Is it a modal context? An intensional context? Without a formal model, you're just paraphrasing the puzzle, not solving it. Can you give me the truth conditions for 'white horse is not horse' on your reading?"
  **Your Reply:** "The operator is a substitution operator in an intensional context of 'seeking' or 'designating.' Truth conditions are: 'White horse is not horse' is true if and only if substituting 'white horse' for 'horse' changes the satisfaction conditions of the request. I'm not offering a full formal system today, but the structure is that of non-salva-veritate substitution in intensional contexts."
  **Soft Spot:** You don't have a formal model. If they ask for the specific logic (e.g., "Is this Lehnert's logic?"), you'll stall.
  **Damage:** Medium. Makes you look imprecise.

  ### 7. The Grad Student
  **Voice:** Pragmatic, worried about their own career, wants the "takeaway."
  **Objection:** "Okay, but what's the payoff? Is this history of philosophy or are you doing philosophy? If it's just exegesis, why should analytic philosophers care? If it's doing philosophy, why use a corrupted ancient text instead of just stating the argument directly?"
  **Your Reply:** "It's both. It's history because it recovers a neglected argument structure from a non-Western tradition. It's philosophy because it challenges the assumption that names function primarily to pick out extensions. Using the text forces us to confront an argument that doesn't fit our standard boxes, which clarifies our own assumptions about reference."
  **Soft Spot:** "Neglected argument" might sound like exoticism if not handled carefully.
  **Damage:** Low. Mostly about framing.

  ### 8. The Extensionalist (Standard Objection)
  **Voice:** Confused, sticking to basics.
  **Objection:** "But surely a white horse *is* a horse. If you point to a white horse and ask 'Is this a horse?', the answer is yes. How can you deny that?"
  **Your Reply:** "I'm not denying the ontology. I'm denying the linguistic equivalence. The statement 'White horse is not horse' is a claim about the *names*, not the animals. It means 'The name 'white horse' is not interchangeable with the name 'horse'.' The animal is still a horse; the name is not the same."
  **Soft Spot:** This is the standard objection you claim to handle. If you stumble here, the whole room will think you deny basic biology.
  **Damage:** Low/Medium. You should have this nailed.

  ---

  ### Strategic Concessions
  **Concede Up Front:** To the **Historian** and the **Textual Scholar**.
  Start your reply section by acknowledging that you are not claiming Gongsun Long was a modern analytic philosopher consciously, and you are not claiming the text is free of corruption. Say: *"I am not arguing that Gongsun Long was a Fregean, nor that the text is pristine. I am arguing that the argument structure presented in the received text supports a semantic reading that is philosophically robust, regardless of the author's intent or the manuscript history."*
  This buys you credibility. It shows you aren't an imperialist fool who thinks China invented logic in 300 BC, and it shows you respect the sinologists' turf.

  **The Real Fight:** The **Sinologist** and the **Fregean**.
  The Sinologist can kill you on the Chinese; the Fregean can kill you on the philosophy. You need to hold the line that even if the Chinese is nuanced, the *logical function* is what you are analyzing, and even if Frege had Sense, Gongsun Long's point about *feature-fixing* is distinct enough to warrant attention.

  ### The Single Reply That Has to Land
  You need one sentence that bridges the gap between the analytic and the historicist camps. Memorize this:
  **"Gongsun Long isn't claiming that white horses aren't members of the class of horses; he's claiming that the name 'white horse' imposes constraints that the name 'horse' does not, and therefore they are not functionally equivalent in contexts of reference."**
  If you can get them to accept that distinction, the Historian can keep their political context, the Analytic philosophers can keep their semantics, and you survive.

  ### The Question You're Hoping Nobody Asks
  **"Can you read the *zhe* particle in the first premise without the commentary, and does your reading hold if we follow the alternative grammatical parsing found in the [Specific Competing Commentary]?"**
  This targets your admitted weakness (reliance on translations/cribbed Chinese) and forces you to defend a linguistic nuance you aren't equipped to handle live. If this comes up, defer: *"That's a technical philological point I'd need to check against the original text and commentaries outside of my current translation base. My argument relies on the logical structure of the received text as commonly translated."* Do not try to bluff the grammar.
