  **Dialogue: The Forge and the Ledger**

  **Elias:** The directive from the Regional Bureau arrives tomorrow, and we still have no price for the V-90 forging press. The issue isn't the steel or the labor hours; those are measurable. The issue is that this machine is being built for a specific shaft tolerance required by the automotive plant downriver. Our lead engineer knows the local alloy batch is brittle under high humidity, a fact he learned by feel during the last monsoon. He adjusts the cooling vents accordingly. How does the Central Board price this machine when the critical variable is a sensation in a man's hand that never makes it into the weekly report?

  **Clara:** You are conflating the technical specification with the economic calculation. The Board does not need to know about the humidity or the engineer's touch. It sets shadow prices for the inputs—steel, electricity, skilled labor—based on their scarcity. The worker council manages the plant. Their rule is simple: minimize the cost of production for any given output level and equate marginal cost to the price set by the Board. If the humidity raises the cost of production because the engineer must slow the line, the cost report reflects that. The Board then adjusts the shadow price of the output based on excess demand or surplus. The tacit knowledge stays local where it belongs; only the quantitative consequences travel to the center.

  **Elias:** But that quantitative consequence is a lagging indicator. You are describing a feedback loop that requires repetition to converge. This is bespoke machinery. There is no production run to iterate upon. Once the V-90 is built, it is installed. If the price was set too low because the Board underestimated the difficulty of working the brittle alloy, the loss is already realized. In a private market, an entrepreneur bids for this contract based on a judgment of risk. He puts his own capital at stake. He weighs the engineer's hunch against the cost. Here, the manager follows a rule. He has no incentive to reveal the full extent of the difficulty if meeting the plan quota protects his position. The aggregate data the Board receives is stripped of the risk premium required for unique projects.

  **Clara:** You assume the incentive structure relies on private capital accumulation. It does not. It relies on professional responsibility and the mandate to fulfill consumer demand as expressed by the Planning Board. If a manager consistently hides costs or fails to innovate within the rules, he is replaced. But more importantly, you are fixated on the final good. The calculation happens primarily in the factor markets. If the brittle alloy requires more labor hours, the demand for labor rises relative to steel. The Board sees the excess demand for labor in that sector and adjusts the wage shadow price. This signals all plants to economize on labor. The specific cause—the humidity—is irrelevant to the allocation function. The system converges on the correct relative prices without anyone needing to know the "why."

  **Elias:** Convergence assumes stability. But the "particular circumstances of time and place" are constantly shifting. The engineer's adjustment isn't just about using more labor; it's about substituting a technique that isn't in the manual. Perhaps he uses a lower grade of steel but treats it differently, a combination the Board's current shadow prices discourage because, statistically, high-grade steel is usually more efficient. Without the possibility of entrepreneurial profit—the residual claim on what is saved by discovering this new combination—the manager follows the rule. He uses the high-grade steel because the shadow prices say so. The tacit knowledge of the better method dies because the institutional structure rewards compliance with the price signal rather than the discovery of a new price structure.

  **Clara:** That is a claim about innovation, not calculation. Lange's model accounts for this by allowing plant managers to propose new techniques to the Board. If the manager can demonstrate lower costs using the alternative method, the Board adopts the new coefficient for the whole industry. The profit isn't private, but the efficiency gain is socialized. You argue that the manager won't propose it. I argue that the rules of cost minimization compel him to. If he ignores a cost-saving technique, his reported costs will be higher than comparable plants, marking him as inefficient. The competition is between managers for performance, not between owners for capital gains. The epistemic problem is solved because the information is revealed through the act of bidding for inputs, even if the ownership remains public.

  **Elias:** But there are no comparable plants for bespoke machinery. That is the crux. You cannot compare the efficiency of the V-90 project to another plant because no other plant is building a V-90. The manager is a monopolist on this specific production knowledge. Without a capital market to value the specific asset before it is built, there is no check on his valuation other than the Board's guess. The entrepreneur in my system bears the loss if his judgment of the engineer's tacit knowledge was wrong. That skin in the game forces a rigorous assessment of the hunch. In your system, the loss is absorbed by the social dividend. The manager risks his reputation, yes, but he does not risk the capital. He will therefore over-invest in safety, using the expensive steel, because the cost of failure is socialized while the cost of effort is personal. The price signal is distorted by the absence of genuine uncertainty-bearing.

  **Clara:** You return to ownership as the sole validator of judgment. But judgment is a technical skill, not a property right. The Board can simulate the risk by auditing and by setting strict rules on inventory and capital usage. If the manager hoards steel "just in case," that is visible. The trial-and-error process does not require the destruction of private fortunes to function; it requires only the willingness to adjust prices when queues form or goods pile up. For the V-90, if the queue for forging capacity grows, the Board raises the price of forging services. This rations the capacity to the most urgent uses. The fact that the machine is unique does not stop the price of the *capacity* from finding its level. The calculation is performed on the scarce resources, not the specific blueprints.

  **Elias:** The queue tells you there is scarcity, not whether the scarcity is worth overcoming. An entrepreneur decides whether to build the machine at all based on whether the consumer value exceeds the opportunity cost of the resources. He anticipates the future price. Your Board reacts to past queues. For a custom machine with no prior analog, the queue only forms after the resources are already committed. By the time the Board raises the price of forging capacity to clear the queue, the steel has already been cut. The error is irreversible. The market price is not just a rationing tool; it is a forward-looking bet on the viability of combining specific tacit knowledge with specific resources. Without the bet, there is no discovery of whether the combination was valuable until it is too late to undo it.

  **Clara:** And yet, the economy must function. If we wait for private capitalists to accumulate enough wealth to bid on every custom industrial project, production stalls. The Board represents the collective anticipation of society's needs. It can prioritize projects based on social utility rather than just profitability. If the automotive plant needs the V-90 to meet transport targets, the Board directs the resources. The calculation is subordinate to the plan. The prices ensure efficiency within the plan, not the selection of the plan itself. You demand the price system do the work of political choice.

  **Elias:** I demand the price system do the work of revealing whether the political choice is economically sustainable. If the Board directs the resources, it blinds itself to the alternative uses those resources could have served. The engineer's tacit knowledge about the brittle alloy might suggest the project is impossible without diverting resources from a hospital generator. Only a price formed by competing claims on those resources reveals that trade-off. Your shadow prices are administrative fiat until they are tested by someone risking their own wealth. In this case of bespoke machinery, where no statistical average exists to guide the fiat, the shadow price is a guess. And a guess cannot coordinate dispersed knowledge.

  ***

  **Assessment**

  Hayek's critique decisively wins in this specific institutional scenario. The single structural feature that determines this verdict is the **non-repetitive nature of the production run**. Lange's model relies fundamentally on iterative trial-and-error to converge on equilibrium prices; the Central Board adjusts shadow prices based on observed surpluses or shortages. However, bespoke machinery is, by definition, a one-off project. There is no subsequent production run to correct the price signal after the initial error. Once the resources are committed based on the initial shadow price, the feedback loop is broken because the "market" for that specific machine disappears upon completion. The absence of iteration prevents the Langean mechanism from correcting the initial epistemic error regarding the tacit knowledge of material tolerances.

  A defender of Lange would attack this feature by arguing that iteration occurs at the **factor level**, not the product level. They would claim that even if the V-90 is unique, the steel, labor, and energy used to build it are traded repeatedly. Therefore, the shadow prices for inputs converge correctly through repeated trials across the broader economy, ensuring the V-90 is built at the correct social cost regardless of its uniqueness. They would argue that the specific combination is irrelevant so long as the input prices reflect true scarcity.

  **Note on Contested Interpretation**
  This assessment leans on a strong interpretation of Hayek's notion of tacit knowledge as fundamentally **incommunicable** rather than merely costly to transmit. If one assumes Lange's procedural assumption that all relevant local knowledge can be reduced to quantitative cost reports without loss of fidelity (i.e., tacit knowledge is merely "unwritten" but codifiable data), then Lange's factor-iteration defense holds. However, if Hayek is correct that tacit knowledge involves judgment under uncertainty that cannot be quantified until *after* the entrepreneurial act, then the factor prices themselves are corrupted because they do not account for the risk premium of the unique combination, rendering the iterative convergence impossible for bespoke goods.
