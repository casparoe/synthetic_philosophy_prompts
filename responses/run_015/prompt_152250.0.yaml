prompt: |-
  hey — please act like you're a political philosopher who also knows a lot of anthropology, and don't just give me the standard textbook answer. brainstorm a bit first, list the options you can think of, then commit to the one you actually think is right and say where you're unsure.

  Here's my thing. I grew up in a country where if you need a permit, or a signature, or your file moved up the pile, you bring something small when you go see the official — chocolates, a bottle, sometimes cash in an envelope. Everyone does it. Nobody experiences it as a bribe. It's not "I'll pay you to break the rules for me," it's more like a toll, or like bringing something when you visit someone's house. Refusing it would be insulting, almost like refusing a gift from a friend. Since I was a kid I've also watched my relatives get genuinely angry about the *other* thing — the mayor's cousin who got the contract, the guy who sold the public land to his brother — and insist that's a totally different thing, that's real corruption.

  Now I work for a big European company and their compliance manual is absolutly zero tolerance: no gift of any size to any public official, anywhere, not to speed anything up, not even a small one after the fact as a thank you, not even where it's completely normal and changes nothing. Break it and you're fired.

  I don't want to argue about whether that's good policy. What I want to know is what picture of corruption that rule has baked into it.

  Some specific things I can't work out:

  Their own rule doesn't seem to care whether the gift *did* anything. A thank-you present handed over after the permit was already granted and was clearly going to be granted anyway is just as forbidden. So the rule can't be about causing a bad outcome, or about buying a decision. What is it about then? The relationship? What the payment does to the official even if it does nothing to the decision? What it looks like to other people?

  My brother says the honest answer is that it's not a moral view at all — it's just that the company wants its paperwork clean if a prosecutor ever shows up. Is there any way to tell, from the *shape* of the rule, whether that's really all it is? Like, does the rule have any feature that only makes sense if someone actually believes something about corruption, rather than just wanting cover?

  The thing I keep getting stuck on: the rule seems to picture the official as a sort of machine for processing applications, where anything that isn't on the form is a contaminant. Is that the real commitment — a view of the state as an impersonal procedure rather than a bunch of people with obligations to each other? If so, isn't that already a pretty specific and contestable political theory, not just "corruption is bad"?

  Because here's the part that feels like a real inconsistency to me. The same company's Brussels office takes legislators to dinner, pays for a "research institute" that happens to publish reports friendly to its industry, and hires former regulators who used to oversee it. Nobody calls any of that corruption. Is that a genuine contradiction in the rule's implicit theory, or is there a principled line it can draw that I'm not seeing? Personal pocket vs. political influence? Illegal vs. legal here? Individual acts vs. systemic stuff? Or is the line just "that's how things are done here, so it's normal"?

  And in my country, the small gift isn't buying anything — the official has no discretion left to sell, everyone pays, and you get exactly what you were entitled to. Does the Western rule have to claim that my description of what's going on is *false*? Or could it agree with my description entirely and still call it corruption? Those feel like really different positions and I can't tell which one the company is committed to.

  So: reconstruct the theory the manual presupposes, tell me which bits of it the rule strictly needs and which bits several rival theories would also license, and then tell me what the policy would actually have to look like if we took the "it's about a whole system of loyalties, not individual acts" view seriously. I have a feeling it would end up banning quite a lot of the Brussels stuff too, and I want to know whether that's really implied or whether I'm smuggling something in.
