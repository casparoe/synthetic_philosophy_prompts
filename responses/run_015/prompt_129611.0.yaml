  What I'm describing
  You're identifying a systematic oscillation in hedonistic defenses. Initially, "pleasure" is invoked as a distinctive felt quality to satisfy the Experience Requirement—only what touches consciousness matters. When the Heterogeneity Problem challenges this uniformity, the definition shifts to attitudinal hedonism (pleasure as pro-attitude). However, when attacking rival theories (like desire satisfaction), the argument reverts to the original felt-quality intuition to claim rivals fail the Experience Requirement. The concept of pleasure slides between phenomenology and attitude depending on which defensive work is needed, without acknowledging the tension this creates for the overall argument's coherence.

  Nearest existing concepts
  This isn't standard equivocation, though it shares the semantic slide. Equivocation implies accidental confusion; here, the switch is functional. It's also not quite Motte-and-Bailey. In a Motte-and-Bailey, one retreats to a defensible core (the Motte) when attacked, then expands back to the controversial claim (the Bailey). Here, neither version is a "safe core." The felt-quality view is vulnerable (Heterogeneity), and the attitudinal view is vulnerable (Experience Requirement objections). Instead, each version is deployed specifically where the other fails.

  Theories of pleasure distinguish *felt-quality* (phenomenal), *attitudinal* (pro-attitude), and *adverbial* (ways of experiencing). Feldman's attitudinal hedonism solves heterogeneity but struggles to capture the "feel" motivating the Experience Requirement. The Experience Requirement (Kagan/Parfit) demands conscious access. The pattern exploits the gap: using the phenomenal view to secure the Experience Requirement's grip (only feelings count), then the attitudinal view to secure plausibility against heterogeneity (no single feeling needed). It avoids reconciling whether the Experience Requirement applies to attitudes as strongly as sensations. It's a strategic deployment of distinct theories rather than a single theory being defended inconsistently. The adverbial theory attempts to bridge this by suggesting pleasure is a manner of experiencing, but the drift bypasses this synthesis. Consequently, the argument gains the intuitive force of phenomenology without the metaphysical baggage, then sheds the baggage without losing the force. The Experience Requirement acts as the pivot: it demands consciousness to exclude external goods, but the definition of 'consciousness' shifts to accommodate the theory.

  Is it actually an inconsistency
  A sophisticated hedonist might argue this isn't cheating. They could claim attitudinal pleasure *is* a conscious experience, just not a sensory one. Being "glad that p" is a phenomenological state, even if it lacks raw qualia. If the Experience Requirement means "must enter consciousness" rather than "must feel like a sensation," both halves cohere. The heterogeneity problem is solved because the attitude is uniform, while the Experience Requirement is satisfied because attitudes are conscious events.

  However, the inconsistency arises if the argument against desire theories relies on desires being *external* while attitudes are *internal*. Desire satisfactionism often allows for unconscious satisfaction. If the hedonist attacks this by saying "unconscious satisfaction doesn't feel good," they rely on phenomenology. But if they defend attitudinal hedonism against heterogeneity by saying "pleasure isn't a feeling," they undermine their own attack. The inconsistency holds only if the hedonist treats attitudinal pleasure as sufficiently "felt" to satisfy the Experience Requirement when attacking rivals, but sufficiently "non-sensory" to avoid Heterogeneity when defending themselves. Without a unified account of consciousness, the argument relies on ambiguity.

  Name it
  'Hedonic Drift' is actually apt. Define it: The strategic oscillation between phenomenal and attitudinal conceptions of pleasure within a single argument to bypass distinct objections, without reconciling the tension.
  *Case:* Arguing the Experience Machine proves only feelings matter (phenomenal), then defining pleasure as "enjoyment" to avoid heterogeneity (attitudinal), then using the Experience Machine again to kill desire theories.
  *Near-miss:* A hybrid theory explicitly stating pleasure has both components. That's a coherent theory, not a drift. Drift requires the unacknowledged switch to do argumentative work. The label fits because it captures the directional shift toward convenience rather than truth.
