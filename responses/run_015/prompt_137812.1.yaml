      *   *The Tension:* Bayesian coherence requires $P(A) + P(\neg A) = 1$ and $P(\text{Tautology}) = 1$. If I don't know if a number is prime, I might price $P(\text{Prime}) = 0.6$ and $P(\text{Not Prime}) = 0.6$ (sum > 1) or $P(\text{True}) = 0.9$. A perfect logician could Dutch book me. But I'm not a perfect logician.
