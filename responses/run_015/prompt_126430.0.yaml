      Your friend's intuition hits on a genuine normative split, though it simplifies the underlying justifications. The asymmetry presupposes that copyright protects the act of appropriation itself, rooted in a natural rights view of authorship where the violation lies in the unauthorized connection between the copier and the author. Patent law, by contrast, operates on a utilitarian bargain where the state grants a temporary monopoly in exchange for public disclosure, treating the invention as a functional resource that must be exclusive to justify the investment. This rules out a unified theory of intellectual property as a singular form of ownership; instead, it acknowledges that expressions and inventions serve different social functions. If we treated ideas as uniform property objects, we would either grant monopolies over all coincidental creations, chilling expression, or deny exclusivity to inventors, undermining the incentive to disclose complex technologies.

      The evidentiary explanation you considered is plausible but incomplete. While proving copying is difficult, the law does not merely shift the burden of proof; it establishes independent creation as a substantive defense. If it were purely evidentiary, a defendant proving independent creation would still be liable but perhaps face lower damages, or the plaintiff would simply lose for lack of proof rather than the defendant gaining a right to exploit the work. The current doctrine suggests that independent creation is not just hard to disprove, but morally and legally permissible. This leaves the regimes underdetermined by any single theory of ownership. Copyright tolerates duplication to preserve public domain ideas, while patent tolerates no duplication to ensure commercial viability, meaning neither fits neatly into a pure relational or object-based framework without leftovers.

      If a court took the relational view seriously and applied it to patents, the doctrine would require proof of copying for infringement, effectively turning patents into a registration system that proves origin rather than grants exclusion. This would collapse the value of patents for high-cost industries like pharmaceuticals, where independent discovery is rare but the risk is high, necessitating a shift to trade secret protection or government prizes. Conversely, extending the object view to copyright would require a mandatory registry and a duty to search before creating, transforming copyright from a right against plagiarism into a right against competition. We would see the introduction of strict liability for identical works regardless of access, fundamentally chilling cultural production by forcing creators to clear rights for themes and melodies that might coincidentally overlap. The asymmetry persists because each regime is engineered to solve a specific incentive problem, not because we have settled on a coherent philosophy of what an idea is.

