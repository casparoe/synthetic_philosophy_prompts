      *   *Patent:* Protects invention/utility, strict liability, independent creation is NOT a defense. Focuses on the exclusionary right over the invention itself.
      *   *Trade Secret:* Protects secrecy, independent creation/reverse engineering is a defense. Focuses on improper means.
      *   *Friend's Theory:* Copyright = relational (took from you); Patent = object (thing out there).
      *   *User's Skepticism:* Is it just evidentiary (hard to prove copying vs. easy to check patents)?
      *   **Core Task:** Evaluate the philosophical underpinnings, assess the friend's theory vs. evidentiary view, and speculate on doctrinal swaps.

  3.  **Drafting - Paragraph 1: Addressing the Core Asymmetry and Friend's Theory:**
      *   Acknowledge the insight. The friend's distinction touches on the normative justification rather than just evidence. Copyright is often justified by Lockean labor or personality theory but limited by the idea/expression dichotomy to avoid monopolizing thought. Patent is utilitarian: a quid pro quo bargain (disclosure for exclusivity).
      *   The asymmetry presupposes different ontological statuses for the protected subject matter. Copyright treats the work as an extension of the author that loses its protected status if not causally linked to them, whereas patent treats the invention as a functional solution that belongs to the first to file/invite regardless of subsequent independent labor.
      *   The evidentiary argument has weight (copying is hard to prove), but it doesn't fully explain the doctrine because strict liability exists in copyright for things like digital sampling where access is obvious, yet independent creation remains a defense if proven. So it's not *just* evidence; it's about what right is being granted.

  4.  **Drafting - Paragraph 2: Evaluating Coherence and Underdetermination:**
      *   Is the friend's story coherent? Partially. It aligns with natural rights vs. utilitarianism. But it's underdetermined. Copyright isn't purely relational because statutory damages exist without proof of actual loss, and patent isn't purely object-based because validity depends on non-obviousness (a relational concept between the inventor and the prior art).
      *   The independent creation defense in copyright isn't just a proof device; it's a boundary marker ensuring we don't monopolize ideas. If it were purely evidentiary, we would shift the burden of proof rather than granting a complete defense.
      *   The asymmetry rules out a unified theory of intellectual property. It suggests IP isn't one thing but a bundle of distinct regulatory regimes. A unified "property in ideas" view would collapse the distinction, which neither regime accepts.

