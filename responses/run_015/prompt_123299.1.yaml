          6.  Potential Revision.
          7.  Confusion in Framing.

      *   *Refining Case 1:* Grice distinguishes between *natural meaning* (smoke means fire) and *non-natural meaning* (words mean things via intention). The Menu-Bot is closer to natural meaning (causal link) but disguised as non-natural.
      *   *Refining Case 2:* The disclaimer test. If it cancels, it was an implicature. If not, it wasn't. But who is the speaker? The Company.
