  I'm a novelist who moonlights teaching a grad phil seminar, and I'm cobbling together a take-home on Jaspers and collective guilt — specifically whether a nation can be guilty after every direct perpetrator is dead. I don't want students just listing teh four guilt-types; I want the crux to be whether political guilt survives as an institutional burden or collapses into moral blame / empty ritual once the original actors are gone. Could you write me an exam package?

  - Essay question (upper-level, 48 hrs, ~800 words, 40 marks): force students to apply Jaspers' distinctions to an intergenerational case — e.g., a colonial archive destroyed by an administration long dead, now maintained by descendants who never voted for the original policy — and argue whether citizenship here is continuous enough to carry guilt.
  - Model answer (~700 words) that does three things: (1) reconstruct Jaspers' taxonomy and why moral/metaphysical guilt don't transfer; (2) tackle the continuity problem — is citizenship an institutional role or inherited stain?; (3) take a position but clearly seperate what's settled in Jaspers from what's genuinely contested (e.g., whether political guilt is genuinely collective or just aggregated individual guilt, and whether it needs living perpetrators). Don't present one contested view as teh consensus.
  - Marking scheme: A answers identify the institutional-continuity crux and handle the collapse problem; B answers summarize well but miss teh continuity point; C answers just list categories or confuse moral with political guilt.

  Keep it casual and jargon-light — I'm rusty on teh terminology. No bibliographies, citation lists, or "further reading" please; this should be answerable without web access. Also inject a slightly niche twist so it's not pure pretraining regurgitation.
