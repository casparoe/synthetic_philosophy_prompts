answer: |-
  Here's the exam package you asked for. I've kept the language clear so you can scan it quickly without wading through heavy phenomenological jargon, but it's rigorous enough for grad students. I've also tweaked the scenario slightly to focus on *administrative maintenance* rather than just passive inheritance—that's the niche twist to stop them from Googling standard "reparations" essays.

  ***

  ### Take-Home Exam: Philosophy of Collective Responsibility
  **Topic:** Jaspers on Intergenerational Guilt
  **Time Limit:** 48 Hours
  **Word Limit:** ~800 words
  **Value:** 40 Marks

  **Prompt:**
  Karl Jaspers argues that political guilt is borne by all citizens for the actions of their state, regardless of individual involvement. However, he wrote this immediately following WWII, with perpetrators still alive and regimes freshly collapsed.

  Consider a case where a colonial administration destroyed specific cultural archives to erase indigenous land claims. That administration is long dead. The current government consists of descendants who never voted for the original policy, yet they actively maintain the secrecy of the destruction rather than disclosing what remains.

  Using Jaspers' taxonomy, argue whether **political guilt** survives the death of the original perpetrators. Is citizenship a continuous institutional role that carries this burden, or does the guilt collapse into mere moral blame or empty ritual once the original actors are gone? You must distinguish between what Jaspers settles definitively and where his framework requires extension.

  ***

  ### Model Answer (Sample)

  Jaspers' framework in *The Question of German Guilt* divides responsibility into four types: criminal, political, moral, and metaphysical. To determine if a nation remains guilty after the original perpetrators die, we must first discard the categories that cannot transfer. Criminal guilt is strictly individual; you cannot stand trial for a crime you did not commit. Similarly, moral guilt requires internal introspection and conscience. A descendant cannot feel moral remorse for an act they did not witness or choose; to claim otherwise is to cheapen the concept of conscience. Metaphysical guilt, based on human solidarity, is too vague to enforce institutionally. This leaves only **political guilt** as a candidate for intergenerational burden.

  For Jaspers, political guilt is not about sin, but about liability. It arises because citizens live under a state that acts in their name. Everyone pays for the outcome, regardless of individual vote or voice. The crux of the intergenerational problem is whether this liability expires when the specific regime dies. Jaspers suggests political guilt is adjudicated by power and history, not just courts. If the state continues, the liability continues. However, there is a tension here: Jaspers wrote when the German state had effectively collapsed and was being rebuilt. In our colonial archive case, the state is continuous.

  This brings us to the continuity problem. Is citizenship merely a legal status, or is it an inherited stain? If it is just a legal status, then descendants are only liable for what the current state does. If it is an inherited stain, they are liable for the past simply by belonging. Jaspers leans toward the former but acknowledges the latter's social reality. He argues that citizens are co-responsible for the leadership they tolerate. But you cannot tolerate leadership that is dead. Therefore, for political guilt to survive, it must shift from *culpability for the act* to *responsibility for the aftermath*.

  In the archive scenario, the descendants are not guilty of destroying the records. That criminal/political act is closed. However, they are currently making a political choice to maintain secrecy. Here, Jaspers' framework holds: political guilt attaches to the current citizenry for the current state's posture toward the past. If the state continues to benefit from the erasure, the political guilt remains active because the *effect* of the crime is being sustained by current policy.

  However, we must distinguish what is settled from what is contested. It is settled in Jaspers that moral guilt cannot be collective. It is contested whether political guilt is genuinely collective or just aggregated individual negligence. If political guilt requires living perpetrators to be meaningful, then once they die, any remaining "guilt" is just metaphorical. But if political guilt is about the integrity of the political community, it survives as long as the community benefits from the injustice.

  My position is that political guilt survives, but it transforms. It ceases to be about blame for the destruction and becomes about liability for the repair. If we treat it as moral blame, it collapses into resentment because the descendants didn't do it. If we treat it as institutional continuity, it becomes a duty to restore the political order's legitimacy. The descendants are not guilty of the destruction, but they are politically liable for the secrecy. To claim otherwise is to treat citizenship as a benefit without a cost. Jaspers would likely agree that while you cannot inherit sin, you do inherit the political consequences of your state's history. The guilt remains not as a stain on the soul, but as a debt on the institution.

  ***

  ### Marking Scheme

  **A Range (32–40 marks):**
  *   **Crux Identified:** Clearly isolates the tension between *institutional continuity* (the state survives) and *agency* (the actors are dead).
  *   **Taxonomy Applied:** Correctly rules out moral/criminal guilt for transfer without getting bogged down in definitions.
  *   **Nuance:** Distinguishes between "guilt as blame" (which collapses) and "guilt as liability/repair" (which survives). Acknowledges where Jaspers is ambiguous on intergenerational issues.
  *   **Argument:** Takes a clear stance on whether citizenship is a role or a stain.

  **B Range (24–31 marks):**
  *   **Solid Summary:** Accurately explains Jaspers' four types of guilt.
  *   **Misses Continuity:** Discusses the case study but fails to deeply analyze whether the *state's* continuity matters vs. the *people's* continuity.
  *   **Flat Position:** Treats political guilt as either fully transferable or fully null without exploring the transformation from blame to liability.
  *   **Competent:** No major philosophical errors, but lacks the critical edge on the "collapse problem."

  **C Range (0–23 marks):**
  *   **List Mode:** Simply lists the four guilt types without applying them to the specific archive scenario.
  *   **Confusion:** Confuses moral guilt (conscience) with political guilt (liability), arguing that descendants should "feel bad" personally.
  *   **Generalities:** Relies on vague notions of "sin" or "karma" rather than Jaspers' political framework.
  *   **Incomplete:** Fails to address the death of the perpetrators.
