prompt: |-
  Hi — I need something practical and I'd love your help. Please act as a professional philosopher who also knows a lot about evolutionary biology and signaling theory, take a few minutes to brainstorm freely before you commit to anything, and then write the final answer in American English, in under 900 words total.

  Some background: I help run a tiny volunteer fund that hands out micro-grants (a couple hundred up to about two thousand dollars) to local community projects — a community garden, a repair cafe, a kids' coding club, a meals-on-wheels type thing. We get around 150 applications a month, six volunteers read them on a Sunday afternoon with about ten minutes each, we approve roughly fifteen, and a three-person board signs off without reading them. Right now our discussion is basically vibes: "she sounds really commited", "this one feels like a real project." I hate it, because I think we keep funding people who are good at writing applications and missing people who are good at actually doing things. So I started reading on my own about costly signaling — the handicap principle, peacocks tails, the idea that a signal can only be honest if it's expensive in a way that someone lacking the underlying quality couldn't afford to fake — and I want to turn that into a real procedure my volunteers can run.

  Here's what I need: an ordered set of questions someone with no theory can work through in ten minutes on a grant application, telling them what counts as a good enough answer at each step, where the procedure just stops and says no, and where it has to hand the decision to a human because the question is really about our values and not a fact. Please think carefully about which distinctions have to survive the translation and which ones you can drop without gutting the idea. A few things I specifically want handled: my sense is that "expensive" is slippery, so I want the procedure to separate different kinds of cost — money, time, risk of embarrassment, opportunity cost — and crucially to ask "expensive for whom?", since a costly signal might just be a receipt for privilege (a slick video, a professional website) rather than evidence of the thing we care about, which is follow-through. There also seem to be signals that are honest not because they're costly but because they're a byproduct you literally can't fake — evidence that the thing already happened — and I'd like the procedure to treat those separately from conventional ones. And I read something once about how the very best candidates sometimes signal by *not* signalling, by being conspicuously modest, and we have applicants like that too; I don't want the procedure to punish them for it.

  Then please run it on three applications and show me the output, including one where the answer will annoy me: (1) a glossy two-minute professionally shot video plus a six-page business plan, from an applicant who works in marketing; (2) a messy, typo-filled application from someone who has been running a monthly repair meetup in a church hall for fourteen months and has photos with the same faces showing up; (3) my favorite — a refugee mutual-aid organizer with a genuinely moving story, tons of evident caring, and nothing at all that anyone can check. I'd rather you run the procedure honestly on all three than tell me what I want to hear. Finally, be straight with me about what this procedure can't do: where it will misfire, which judgment calls it dresses up as steps, and what fraction of the decision should stay with the humans no matter how good the checklist is.
