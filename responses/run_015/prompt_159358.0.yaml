answer: |-
  **Philosophical Briefing**
  Signaling theory distinguishes between *indices* (unfakeable byproducts, like smoke from fire) and *signals* (costly acts, like a peacock's tail). Indices prove past capacity; signals prove current commitment. Crucially, cost is marginal, not absolute. A $1,000 website is cheap for a corporation, expensive for a student. We must filter for *relative* cost to avoid funding privilege rather than commitment. Modesty is itself a costly signal: risking being overlooked to avoid exaggeration.

  **The Protocol (10-Minute Screen)**

  **1. The Index Check (Fact)**
  *Question:* Is there unfakeable evidence this work already happened? (Photos, logs, third-party testimonials).
  *   **Yes:** Pass to Step 3.
  *   **No:** Go to Step 2.

  **2. The Relative Cost Check (Fact)**
  *Question:* What did they sacrifice to apply or start? (Time, money, reputation). Is this sacrifice significant *for them*?
  *   **High Relative Cost** (e.g., unpaid hours despite low income): Pass to Step 3.
  *   **Low Relative Cost** (e.g., polished assets matching professional skills): **STOP. Reject.** (Signal is too cheap to be honest).
  *   **Unclear:** Go to Step 3.

  **3. The Modesty Waiver (Fact/Value)**
  *Question:* Is the application rough because they prioritized the work over the pitch?
  *   **Yes** (Work evidence exists): **Hand-off to Human.** (Reward integrity).
  *   **No** (Just sloppy/empty): **STOP. Reject.**

  **4. Values Hand-off (Value)**
  *Question:* Are signals mixed or absent, but need is high?
  *   **Yes:** **Hand-off to Human.** (This is a values choice, not a fact check).
  *   **No:** **STOP. Reject.**

  ***

  **Test Run**

  **(1) The Marketing Pro**
  *Glossy video, six-page plan, marketing job.*
  *   **Step 1:** No evidence of past community work.
  *   **Step 2:** Video/plan are low relative cost for a marketer. This is "cheap talk."
  *   **Result:** **STOP. Reject.**
  *   *Note:* This will annoy you. It feels punitive against competence. But signaling theory says this is exactly the type of application that crowds out genuine need because the signal is affordable for them but not for others.

  **(2) The Repair Cafe**
  *Messy application, 14 months of photos, same faces.*
  *   **Step 1:** Yes. Photos are indices of past follow-through.
  *   **Step 2:** N/A (Passed Step 1).
  *   **Step 3:** Yes. Roughness indicates time spent fixing things, not writing.
  *   **Result:** **Hand-off to Human.** (Strong candidate).

  **(3) The Refugee Organizer**
  *Moving story, no checkable evidence.*
  *   **Step 1:** No. Nothing to check.
  *   **Step 2:** Emotional vulnerability is costly, but unfakeable evidence is missing. Unclear relative cost.
  *   **Step 3:** Yes, conspicuously modest/no pitch.
  *   **Result:** **Hand-off to Human.**
  *   *Note:* The procedure cannot validate this. It flags it as a values decision: Do we fund track records or urgent need?

  ***

  **Limitations & Misfires**

  This procedure cannot measure integrity, only evidence. It is inherently conservative; it biases toward established projects (Step 1) and penalizes new, high-risk ideas that lack indices. It also cannot fully normalize privilege. Volunteers must still judge "relative cost," which is subjective. A volunteer might mistake a lack of polish for laziness rather than modesty.

  Furthermore, Step 4 dresses up a judgment call as a procedure step. Deciding whether to fund the Refugee Organizer is not a fact-finding mission; it is a moral choice about whether your fund mitigates risk or alleviates suffering. No checklist can resolve that.

  Finally, the "Reject" on the Marketing Pro assumes your goal is filtering for *commitment* specifically. If your goal includes *capacity*, the glossy application is actually a strong signal of ability to execute. Signaling theory tells you what is being signaled (commitment vs. capacity), not which quality you should value. You must decide that.

  **The Human Fraction**
  Keep 40% of decisions with humans. Use the protocol to clear the obvious "no"s (low cost, no evidence) and the obvious "yes"s (strong indices). The middle ground—high need/low signal, or high signal/low need—is where your values live. No algorithm can substitute for the collective judgment of what your community owes its members. The checklist protects your time; it should not absolve your conscience.
