answer: |-
  ### Part I: The Case for Stage-Indexed Concern

  To derive Stage-Indexed Concern (SIC) from Stream Reductionism (SR), we must demonstrate that once the metaphysical privilege of the "person" is dissolved, the normative privilege of the "person" cannot survive. The argument proceeds in three steps: the elimination of the owner, the isolation of the bad, and the arbitrariness of boundaries.

  **1. The Elimination of the Owner**
  SR posits that a person is nothing over and above a stream of psychophysical aggregates. Crucially, it denies any "deep further fact" regarding which stream is "mine." Under a non-reductionist view, my future suffering matters specially to me because it will be experienced by *me*—the same enduring entity experiencing this present moment. SR denies this entity exists. There is only a present stage (S1) and a future stage (S2) linked by memory and causal continuity.

  If there is no enduring self, there is no "owner" of suffering to whom reasons can be anchored. There is only the occurrence of suffering within a stage. If S2 suffers, a bad thing happens. If S3 (in a different stream) suffers, a bad thing happens. The metaphysical difference between S2 and S3 is merely the degree of causal connectedness to S1. SR asserts that causal connectedness constitutes identity, but it does not constitute *ontological depth*. Therefore, the difference between "my" pain and "your" pain is a difference in causal topology, not a difference in the metaphysical status of the sufferer.

  **2. The Isolation of the Bad**
  Reasons for concern must ground in something value-laden. In this framework, the only locus of value (or disvalue) is the experiential quality of a momentary stage. Suffering is intrinsically bad *when it occurs*. It does not require a container to be bad; the experience itself is the disvalue.

  If we accept that suffering is bad *simpliciter*, then rational concern should track the distribution of that badness. To weight the suffering of S2 more heavily than the suffering of S3 simply because S2 is causally linked to S1 is to reintroduce a "deep further fact" by the back door. It treats causal continuity as a magic substance that amplifies moral weight. But SR explicitly denies causal continuity carries such weight; it is merely the glue of the stream, not the source of value. Therefore, the rational weight of a unit of suffering must be a function of its intensity and duration alone, independent of its stream membership.

  **3. The Arbitrariness of Boundaries**
  If we grant SIC, the unit of aggregation is the totality of stages. If we reject it, we must justify why the boundary of a stream is the boundary of concern. But stream boundaries are notoriously vague. At what point does causal continuity degrade enough that a future stage is no longer "me"? If moral concern drops off gradually with psychological connectedness (as SR suggests it must, since there is no further fact), then there is no sharp line where "my" concern ends and "neutral" concern begins.

  However, SIC goes further: it suggests the drop-off should be zero. Why should causal connection matter at all for *normative* weight? Causal connection explains why I can *remember* a past stage or *influence* a future stage. It explains epistemic access and causal leverage. It does not explain why the pain in a connected stage is *worse* than the pain in an unconnected stage. Since the intrinsic badness of pain is identical in both cases, privileging the connected stage is arbitrary discrimination.

  **The Soteriological Consequence**
  It follows from SIC that the project of "my liberation" is rationally myopic. Liberation is simply the cessation of suffering in a stream. If I am a stream reductionist, I should view my stream as one cluster of suffering among many.
  Suppose I have a resource (time, energy, karma) that can either:
  (A) Secure the total cessation of suffering in my stream over the next 20 years.
  (B) Secure the cessation of suffering in ten other streams over the next 20 years.
  Under a person-affecting view, (A) is obligatory. Under SIC, (B) is obligatory, because the sum of suffering reduced in (B) is ten times greater. The fact that the suffering in (A) is "mine" adds no weight to the calculus. Consequently, a fully realized stream reductionist would act as a neutral lever-puller for the reduction of total stage-suffering, even if that requires sacrificing the welfare of their own causal stream.

  ***

  ### Part II: Responses to Objections

  #### Objection 1: The Agential-Index Objection
  *The Challenge:* Even if metaphysics grants no privilege to this stream, agency is indexical. I know *this* pain directly; I infer *that* pain. I can move *this* body; I cannot move *that* body. A normative theory must be actionable. If I cannot deliberate from the perspective of another stream, doesn't the "here-ness" of agency force a stream-relative weighting?

  *The Response:* This objection conflates the **locus of action** with the **scope of concern**. It is true that agency is indexed: I act from this stage, with these causal powers. However, it does not follow that the *ends* of action must be indexed to this stream.

  Consider a spatial analogy. I am located *here* in space. I can physically intervene only on objects near *here*. It does not follow that I ought to value welfare only *here*. I can push a lever *here* to save a life *there*. The indexicality of my body constrains *how* I act, not *what* I value.

  Applied to SR: The fact that I have non-inferential access to this stream's states is an epistemic constraint, not a normative one. I may have better data about my stream's suffering, which might justify a heuristic bias toward fixing it (due to lower epistemic risk). But this is a pragmatic discount for uncertainty, not a principled moral privilege.
  Furthermore, the requirement that a doctrine be "deliberatable" does not require it to be egoistic. I can deliberate: "Which available action, accessible from this causal node, produces the lowest aggregate suffering across all nodes?" This is a coherent deliberative procedure. The "constraint on agency" is simply the causal graph: I can only pull levers connected to me. But which levers I *should* pull is determined by the consequences at the other end of the causal chain, regardless of which stream those ends belong to. The Agential-Index objection successfully limits my *power*, but it fails to limit my *mandate*.

  #### Objection 2: The Tractability Objection
  *The Challenge:* If we aggregate over all momentary stages, we face an open future with indefinitely many stages. This creates two problems: (1) Sums may fail to converge (infinite suffering), making comparison impossible. (2) Low-probability, high-impact events (Pascal's Mugging) dominate the calculus. Stream-relative concern bounds the problem, making it solvable. If a theory cannot guide action, it is normatively inert.

  *The Response:* This objection relies on the assumption that stream-relative concern actually solves the convergence problem, and that stage-indexed concern lacks the tools to handle it. Both assumptions are questionable.

  First, **stream boundaries do not guarantee boundedness.** If streams are cyclic (rebirth) or if the future of a single stream is potentially infinite, summing suffering within a stream also risks non-convergence. Bounding by "life" is arbitrary if the metaphysics allows for continuation. Thus, the tractability advantage of stream-relativity is contingent on empirical assumptions about death and continuity that SR does not necessarily guarantee.

  Second, **SIC does not require total summation.** Rational action requires comparing marginal differences, not calculating absolute totals. To decide between Action A and Action B, I do not need to know the total suffering of the universe ($S_{total}$). I need to know the difference ($\Delta S$) my action causes.
  $$ \text{Value}(A) = S_{total} + \Delta S_A $$
  $$ \text{Value}(B) = S_{total} + \Delta S_B $$
  Since $S_{total}$ is constant across my choices, it cancels out. I only need to calculate the expected suffering changes causally downstream of my action. These causal chains are finite and probabilistically discountable. The "infinite future" problem vanishes when we focus on marginal impact rather than total state evaluation.

  Third, regarding **Pascal's Mugging**: This is a problem for any consequentialist framework that aggregates value over large scales, not specifically for SIC. Stream reductionists can adopt the same epistemic safeguards as any other consequentialist: discounting outcomes by their epistemic complexity or probability thresholds. The fact that stages are numerous does not mean we must treat improbable astronomical outcomes as decisive. We can weight stages by the *certainty* of their existence and the *causal proximity* to the action.

  Therefore, the Tractability Objection does not refute SIC; it merely highlights the standard difficulties of long-term consequentialism. Stream-relative concern offers a false sense of security by drawing an arbitrary circle around the calculation. SIC admits the calculation is hard but insists that the difficulty of the math does not justify changing the moral variable from "suffering" to "my suffering." If the sum is unmanageable, we manage the margin, but we do not retreat to the self.
