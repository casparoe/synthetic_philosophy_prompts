  6.  **Final Review against Prompt:**
      *   SR defined as conjunction? Yes.
      *   SIC defined as consequence? Yes.
      *   Strongest case for SIC? Yes.
      *   Consequence regarding liberation/levers? Yes.
      *   Answer Agential-Index? Yes.
      *   Answer Tractability? Yes.
      *   No scholarly citations? Yes.

  7.  **Final Polish:** Check for clarity and flow. Ensure the distinction between *metaphysical privilege* and *causal access* is sharp. (Proceed to generate output).

