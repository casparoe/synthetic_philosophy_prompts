  #### 2. The Principle of Vicious Circle (Russell/Poincaré)
  **Statement:** A collection is **illegitimate** if its definition quantifies over a totality to which the collection itself would belong (impredicativity), or if it involves semantic self-reference (truth/definability). Legitimacy requires a well-founded, stratified hierarchy where objects are constructed only from predecessors.
  *   **Grounding:** Logical well-foundedness and Predicativity.

  **Verdicts it Forces You to Abandon:**
  *   **Verdict 3 (Cumulative Hierarchy):** This principle forces you to abandon the view that $V$ is a "legitimate proper class." Strict predicativists (like Weyl or Poincaré) argue that $V$ is an **illegitimate totality** because defining it requires quantifying over all sets, including those defined in terms of the whole. It is a "false infinity."
