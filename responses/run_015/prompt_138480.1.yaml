  I recommend we vote to let the lethal trapping contract lapse on 1 July and redirect those funds, alongside the remaining budget, toward contraceptive bait at regular feeding sites. This ends city-sponsored killing immediately while addressing the population size that drives the conflict. We cannot renew the contract as written. This decision uses the ambiguity in our bylaw to prioritize reducing future suffering over maintaining the status quo or focusing solely on identifiable individuals. We must notify the contractor before the renewal date. This path commits the full weight of the committee to a non-lethal management strategy. It acknowledges that welfare includes population control when overpopulation leads to systematic culling. We are choosing prevention over cure.

  **What the philosophy actually turns on**

  The hard choice here isn't about pigeons versus songbirds. It is about what we mean by welfare. Does welfare only matter for animals already alive? If we pay for rescue, we help specific birds we can name. If we pay for contraception, no existing bird gets healthier or lives longer. We are stopping new birds from being born. Some say this helps no one. I disagree. Our bylaw says animal welfare, not individual animal rescue. If we believe a life spent trapped or starving is a harm, then preventing that life from starting is a welfare outcome. It reduces the total amount of suffering in the city. Choosing rescue over contraception chooses the visible individual over the invisible population. I am choosing the population reading. We have the power to reduce the number of animals born into a situation we deem cruel enough to trap. That is a welfare win, even if no specific bird thanks us. We are betting that a smaller population lives better than a large one managed by death. This distinction is uncomfortable because it treats potential life as a variable we can adjust. But the alternative is accepting that suffering is inevitable for the many to save the few. By picking the suffering reduction frame, we admit that non-existence is preferable to a life ended in a trap.

  **Why this and not the other three**

  Option one fails because lethal trapping is a temporary fix that requires constant killing to maintain. It is morally costly and financially inefficient. Option three, retrofitting for songbirds, is worthy but ignores the animals we actively manage and harm. We have a direct hand in pigeon deaths; we have an indirect hand in songbird collisions. Responsibility matters. We cannot ignore the crisis we fund to solve one we do not create. Option four is internally contradictory. We cannot fund a rescue to save pigeons while simultaneously paying a contractor to kill them. It signals confusion about our goals. Contraception is the only path that aligns our budget with a consistent ethic. It stops the killing without abandoning the population. It acknowledges that the environment we built supports too many birds for their own good. By reducing the population humanely, we improve the quality of life for the birds that remain. They face less competition for food and less pressure from us. This option respects the budget's intent by addressing the root cause of the welfare issue: overpopulation in an urban trap. Stopping the harm we authorize takes precedence over collateral damage we do not directly manage.

  **Dana's speciesism charge at its strongest**

  Dana is right that pigeons belong here as much as anyone. They are here because we built this city. They are scapegoats for urban messiness. Ignoring their claim because they aren't native is unfair. We built the ledges that stand in for cliffs. However, belonging here doesn't guarantee a right to reproduce without limit in a space that harms them. The charge that contraception is making a population disappear conflates reducing numbers with eradication. We are not wiping them out; we are stabilizing them. But the point stands: we can harm a group without harming a specific member. Preventing a lineage from continuing is a loss to the community of pigeons, even if no individual is hurt. I accept this cost. I accept it because the alternative is continuing a cycle of birth and lethal control that hurts individuals deeply. I prioritize stopping the tangible suffering of the living over the potential loss of the unborn group.

  **The things I can't answer**

  I cannot prove that reducing the population now won't create a vacuum filled by more birds later. If we make downtown safer, more pigeons may arrive, renewing the cycle of suffering. This is the hydra worry. I also cannot fully resolve the group-harm worry. If we reduce the flock significantly, have we harmed the pigeon community of this city? There is something real in the thought that you can harm a group without harming any particular member of it. We might diminish the social fabric of the flock while saving individuals from traps. I don't know. These are risks. We are acting on the best available logic that fewer birds means less competition and less killing. We are betting that stability is better than churn. We must monitor this. If the bait fails or populations spike, we have to admit this approach didn't work. We are navigating ambiguity without a map.

  **What would make me change my mind at the twelve-month re-vote**

  I will change my vote if the contraception program fails to stabilize numbers within a year. If the population grows despite bait, we need a new plan. I will also reconsider if the rescue group can prove they can place birds faster than they are born, making rescue viable without trapping. Finally, if the songbird collision data shows a spike that outweighs pigeon welfare gains, I will support retrofitting. For now, the evidence points to contraception as the least harmful path. I commit to reviewing the data honestly next year, without digging in. If the suffering increases, I will vote to change course. This is not a permanent ideology; it is a trial based on outcomes. We must be willing to admit error.
