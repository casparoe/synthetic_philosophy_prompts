answer: |-
  **MEMORANDUM**

  **TO:** Incoming Assembly Members, Cycle 44-B
  **FROM:** Office of Sortition Integrity and Procedural Hygiene
  **SUBJECT:** Onboarding Protocols and Deliberative Compliance Standards
  **DATE:** 14th of Post-Electoral Year 9

  **1. Selection Protocol and Initial Pool Entry**
  1.1. Pursuant to the Constitutional Amendment on Aleatory Governance, all adult citizens are automatically entered into the Universal Civic Pool upon registration.
  1.2. Entry into the Universal Civic Pool constitutes the sole guarantee of democratic equality. No citizen shall be excluded from the initial dataset based on income, geography, or prior political affiliation.
  1.3. Selection for legislative service occurs not from the Universal Civic Pool directly, but from derived Sub-Pools established via the Epistemic Stratification Algorithm (ESA).
  1.4. Members are reminded that equality is preserved because the final draw is random *within* the assigned Sub-Pool. The stratification process itself is classified as administrative hygiene rather than selection, and therefore does not constitute a barrier to equal opportunity.

  **2. Epistemic Banding and Pool Hygiene**
  2.1. The ESA categorizes all pool entrants into three non-overlapping Epistemic Bands: Band A (Generalist), Band B (Domain-Specialist), and Band C (Meta-Cognitive Auditor).
  2.2. Categorization is determined by standardized metrics including educational attainment, professional licensure, and demonstrated cognitive throughput.
  2.3. To ensure the integrity of the sortition, the ESA undergoes weekly Randomness Audits. These audits verify that no human bias influenced the stratification logic. The audits do not assess the equity of the band distribution, only the randomness of the algorithmic execution.
  2.4. Legislative seats are allocated proportionally to the bandwidth of each Epistemic Band. Consequently, Band A will occupy 60% of seats, Band B 35%, and Band C 5%, reflecting the natural statistical distribution of competence within the Universal Civic Pool.

  **3. Deliberative Obligations and Ignorance Certification**
  3.1. Members drawn from Band B (Domain-Specialist) are required to attend mandatory Ignorance-Certification Workshops prior to the first legislative session.
  3.2. The purpose of these workshops is to facilitate the formal suspension of expertise. Specialists must sign affidavits confirming they will not introduce technical jargon or unauthorized data models during deliberation.
  3.3. Failure to demonstrate adequate epistemic bracketing during peer review will result in a warning. Three warnings constitute a violation of the Equality of Voice Protocol, resulting in immediate recusal.
  3.4. Band A members are exempt from these workshops, as their contributions are presumed to originate from a state of natural democratic neutrality.

  **4. Grievance and Recusal Procedures**
  4.1. Citizens who believe their Epistemic Band assignment does not accurately reflect their functional capabilities may file Form 88-B (Claim of Statistical Under-Representation).
  4.2. Common grounds for Form 88-B include feelings of being over-qualified yet statistically under-represented in Band A, or possessing niche expertise not captured by the ESA metrics.
  4.3. Processing of Form 88-B requires the citizen to submit to a re-evaluation by the Office of Sortition Integrity. Please note: successful re-evaluation resulting in promotion to a higher Epistemic Band does not guarantee immediate selection, as the random draw for the current cycle has already concluded.
  4.4. Recusal due to conflict of interest must be filed within 48 hours of notification. Replaced members trigger the Continuity Rules outlined in Section 5.

  **5. Continuity Rules and Statistical Fidelity**
  5.1. In the event that a seated member is removed for incompetence, misconduct, or voluntary resignation, the replacement mechanism must preserve the epistemic composition of the Assembly.
  5.2. Replacements shall be drawn exclusively from the same Epistemic Band as the departed member. This is the Non-Branching Continuity Rule.
  5.3. Under no circumstances may a vacancy in Band B be filled by a candidate from Band A, even if Band A candidates are available and willing. To do so would violate the representative statistical fidelity of the legislature.
  5.4. If a Sub-Pool is exhausted, the seat shall remain vacant until the next cycle to prevent contamination of the epistemic ratios.

  **6. Acknowledgement**
  6.1. By signing below, you acknowledge that your presence in this Assembly is the result of a random draw constrained by necessary functional filters.
  6.2. You further acknowledge that these filters are procedural tools designed to enhance deliberative quality without compromising the fundamental randomness of the system.

  __________________________
  **Signature of Member**
  **Date**
