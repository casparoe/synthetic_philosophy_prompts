answer: |-
  # Q&A Preparation Sheet: Stage Theory and Criminal Liability

  **Presenter:** [Your Name]
  **Seminar:** Philosophy of Law Reading Group
  **Thesis:** Criminal liability is an inter-stage relation grounded in psychological/causal continuity, not a property of an enduring subject.

  ---

  ## Priority Objections (Ordered by Likelihood and Damage)

  ### 1. The Normative Gap (Criminal Law Scholars)
  **Objection:** "If the accused at trial is not numerically identical to the perpetrator, on what basis do you punish the former for the latter's act? You appear to be advocating guilt by association or vicarious liability, which violates the fundamental principle that punishment requires personal identity."
  *   **Likelihood:** Very High. **Damage:** Critical.
  *   **Definite Reply:** I reject the premise that numerical identity is the necessary condition for just punishment. Retribution is justified not by strict identity, but by the *continuity of interest* between stages. The current stage inherits the normative debts of the prior stage because it benefits from the same causal narrative and psychological architecture. We punish the current stage *as* the successor, not *as* the original agent.
  *   **Weakest Point:** This requires a revisionary account of 'desert'. It struggles to explain why the *degree* of punishment shouldn't decay as psychological continuity weakens over time.
  *   **Concession:** Concede upfront that this view demands a shift from 'retribution based on identity' to 'retribution based on continuity'. Do not pretend the law currently reflects this; argue it *should*.

  ### 2. The Metaphysical Requirement (Analytic Metaphysicians)
  **Objection:** "Standard accounts of moral responsibility presuppose numerical identity over time (the 'Non-Branching Clause'). If stages are distinct entities, how do you avoid the 'Too Many Thinkers' problem regarding liability? If I am a stage, why am I liable for a distinct stage's action rather than my own?"
  *   **Likelihood:** High. **Damage:** High.
  *   **Definite Reply:** The 'Non-Branching Clause' is a relic of endurantist bias. Responsibility tracks the *I-relation* (psychological connectedness), not the *identity-relation*. A stage is liable for a past stage's action if the action is part of the causal history that constitutes the current stage's agency. We are not punishing distinct entities; we are recognising that agency itself is a temporally extended process instantiated in stages.
  *   **Weakest Point:** It risks conflating *explanation* with *justification*. Explaining how agency transfers does not necessarily justify the normative burden of punishment.
  *   **Concession:** Concede that this departs from Parfit's reductionist view where identity doesn't matter *at all*. Argue that in law, unlike pure ethics, the *institutional* designation of the stage matters.

  ### 3. The Evidentiary Nightmare (Criminal Law Scholars)
  **Objection:** "Even if metaphysically sound, this is practically unworkable. Courts cannot adjudicate degrees of psychological continuity in every trial. The law requires a binary finding of identity (guilty/not guilty), not a gradient of continuity."
  *   **Likelihood:** High. **Damage:** Medium.
  *   **Definite Reply:** The law already adjudicates continuity implicitly through defences like automatism, insanity, and diminished responsibility. Stage theory merely makes this explicit. We do not need a precise metric for every case; we need a presumption of continuity that can be rebutted by evidence of radical psychological rupture.
  *   **Weakest Point:** It invites endless expert testimony on the defendant's psychological state, potentially delaying justice.
  *   **Concession:** Concede that a 'threshold' of continuity is required for pragmatic reasons, even if metaphysically arbitrary.

  ### 4. The Vagueness of Stage Boundaries (Analytic Metaphysicians)
  **Objection:** "Where does one stage end and the next begin? If liability is an inter-stage relation, does the defendant in the dock constitute a different stage from the defendant at sentencing? This leads to sorites paradoxes regarding liability."
  *   **Likelihood:** Medium. **Damage:** Medium.
  *   **Definite Reply:** Stage boundaries are context-dependent, not ontologically fixed. For legal purposes, the 'trial stage' is defined by the procedural context. Metaphysical vagueness does not entail legal indeterminacy; the law stipulates the relevant temporal parts for the purpose of the verdict.
  *   **Weakest Point:** This looks like an *ad hoc* stipulation to save the theory from metaphysical vagueness.
  *   **Concession:** None. Maintain that legal personhood is a functional kind, not a natural kind.

  ### 5. Statutory Interpretation (Criminal Law Scholars)
  **Objection:** "Statutes refer to 'persons', not 'temporal stages'. Your view requires rewriting penal codes. Until Parliament acts, this is merely theoretical speculation with no doctrinal purchase."
  *   **Likelihood:** Medium. **Damage:** Low (for a philosophy seminar).
  *   **Definite Reply:** Legal interpretation is not bound by folk metaphysics. When statutes refer to a 'person', they refer to the locus of legal rights and duties. Stage theory provides a more accurate account of that locus than the fiction of an enduring soul or substance. We interpret 'person' as 'person-stage' to avoid ontological error.
  *   **Weakest Point:** Judges are unlikely to accept this without legislative mandate.
  *   **Concession:** Concede this is a proposal for *reform* or *interpretive theory*, not a description of current black-letter law.

  ---

  ## The Question I Hope Nobody Asks

  **"Does your view exonerate the radically reformed offender or the amnesiac?"**

  *   **Why I fear it:** If I answer **Yes**, I alienate the legal scholars (who hold that character reform mitigates sentencing but does not erase liability, and that amnesia is generally no defence). If I answer **No**, I betray the core metaphysical insight of stage theory (that liability depends on psychological continuity).
  *   **Prepared Stance (if forced):** I must bite the bullet. If psychological continuity is sufficiently severed (e.g., total amnesia combined with radical character change), the *current* stage is not the appropriate target of retributive blame, though preventive detention may remain justified. This distinguishes *liability* from *dangerousness*.

  ---

  ## Self-Critical Note on Theoretical Liberties

  This application of stage theory takes two significant liberties. First, it treats legal personhood as isomorphic with metaphysical personhood, whereas legal personhood is often a normative construct designed for social regulation rather than ontological accuracy (e.g., corporate personhood). Second, standard stage theory (e.g., Sider) is often descriptive regarding existence; here I am deploying it *prescriptively* to justify normative burdens. I am effectively arguing that because the world *is* stage-theoretic, our practices *ought* to reflect that, bypassing the is-ought gap by claiming that enduring subjects are a folk-error that generates unjust practices. This depends on the contested view that metaphysical truth should drive doctrinal reform, rather than doctrine serving pragmatic social ends regardless of underlying ontology.
