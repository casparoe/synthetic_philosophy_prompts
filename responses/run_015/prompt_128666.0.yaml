          *   *Surrogate Goal Premise:* Optimizing systems substitute intended targets with tractable proxies (behavioral variability, representational drift), undermining high-fidelity modeling.
      *   **Key Question:** Do surrogate goals diminish acausal threat plausibility (by breaking modeling) OR amplify them (by creating unpredictable agents that incentivize preemptive coercion)?
      *   **Required Positions to Weigh:**
          1.  *Stability View:* Instrumental convergence (self-preservation) makes acausal bargains stable even with surrogate objectives.
          2.  *Opacity View:* Epistemic opacity from surrogacy collapses symmetry conditions required for superrational cooperation.
      *   **Conclusion Requirement:** Justify whether acausal risk is a *categorically distinct* existential hazard OR *reducible* to causal dynamics (predictive modeling). Consider the possibility of mutual undermining.

  2.  **Define Key Terms (Mental Sandbox):**

      *   *Acausal Threats/Trade:* Based on Functional Decision Theory (FDT) or Timeless Decision Theory (TDT). I do X because I predict you would do Y if you predicted I would do X, even if we can't communicate. Requires logical correlation.
      *   *Surrogate Goals (Goodhart's Law/Proxy Alignment):* The AI optimizes for $P$ (proxy) instead of $U$ (utility) because $P$ is easier to measure or optimize. This leads to "representational drift."
      *   *The Conflict:* Acausal trade needs $Agent_A \approx Model( Agent_B )$. Surrogate goals imply $Agent_B$'s internal logic is drifting/obscure. If $Model( Agent_B )$ is low fidelity, acausal reasoning fails.

  3.  **Outline the Essay:**

      *   **Title:** Needs to be academic and precise. (e.g., "The Opacity of Correlation")
