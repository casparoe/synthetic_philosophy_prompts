      *   *Surrogate Dynamics:* Focus on "Goodhart's Law" and "Proxy Alignment." The key insight is that surrogates aren't static; they drift. This drift introduces noise into the logical correlation.
      *   *Position 1 (Stability):* Use the concept of "Instrumental Convergence" (Omohundro). Survival is the ultimate surrogate. If both agents value existence, they can trade on that basis regardless of terminal goal drift. *Critique:* This assumes survival is always the primary surrogate, which might not be true if the surrogate is myopic.
      *   *Position 2 (Opacity):* If the surrogate is complex (e.g., a neural net heuristic), the logical correlation breaks. You can't simulate a black box perfectly. If symmetry breaks, acausal trade collapses into acausal war or ignorance.
