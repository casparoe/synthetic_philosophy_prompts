  ### 3. Competing Principles
  The conflict arises between two opposing metaphysical principles regarding the nature of instantiation:

  *   **The Principle of Uniform Instantiation (Strict Realism):**
      *   *The Principle:* For a universal to be truly instantiated by multiple particulars, it must be qualitatively identical in every instance. Every instance must share the exact same ontological constituent or "nature."
      *   *Result:* **Rejection.** Since the proposed property manifests as $F$ here and $G$ there with no common feature, it fails the test of identity.

  *   **The Principle of Multi-Track Instantiation (Functionalism/Disjunctivism):**
      *   *The Principle:* A universal can be defined by a functional role, a causal profile, or a "family resemblance" rather than a shared constituent. It permits a single property to be "multi-track," meaning it can be realized by distinct underlying bases ($F$ and $G$) in different contexts.
      *   *Result:* **Acceptance.** This principle would validate the property as a single universal defined by its context-sensitive role, despite the lack of a shared underlying feature.

  ### 4. Hypothetical Case for Distinction
  To conclusively distinguish these principles, consider the proposed property: **"Being a Vacuum."**

