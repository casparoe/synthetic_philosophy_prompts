      *   **Branch A (Vertical):** Proceed to Node 2A.
      *   **Branch B (Horizontal):** Proceed to Node 2B.

  *   **Node 2A: Status of the Inaccessible Region (Vertical Path)**
      *   *Diagnostic Question:* Should the region shielded by the causal barrier be treated as containing nothing, containing entities we cannot describe, or consisting solely of relations without relata?
      *   **Branch A1 (Empty):** Proceed to Leaf 1.
      *   **Branch A2 (Surplus Entities):** Proceed to Node 3A.
      *   **Branch A3 (Pure Structure):** Proceed to Leaf 2.

  *   **Node 2B: Status of the Inaccessible Region (Horizontal Path)**
      *   *Diagnostic Question:* Should the region underdetermined by the data be treated as containing nothing, containing entities we cannot describe, or consisting solely of relations without relata?
      *   **Branch B1 (Empty):** Proceed to Leaf 3.
      *   **Branch B2 (Surplus Entities):** Proceed to Leaf 4.
      *   **Branch B3 (Pure Structure):** Proceed to Node 3B.

  *   **Node 3A: Dark Matter Case Judgment (Vertical/Surplus Path)**
      *   *Diagnostic Question:* When observing gravitational signatures without visible mass, are these better interpreted as evidence for an invisible particle ontology or as evidence for a modified relational geometry with no additional entities?
      *   **Branch A2-i (Invisible Particle):** Proceed to Leaf 5.
      *   **Branch A2-ii (Modified Geometry):** Proceed to Leaf 6.

  *   **Node 3B: Quantum Field Case Judgment (Horizontal/Structure Path)**
      *   *Diagnostic Question:* Do quantum-field correlations observed without particle-track accessibility justify postulating field quanta, pure structural relations, or no ontology beyond the correlation matrix itself?
      *   **Branch B3-i (Pure Structural Relations):** Proceed to Leaf 7.
      *   **Branch B3-ii (No Ontology Beyond Matrix):** Proceed to Leaf 8.

