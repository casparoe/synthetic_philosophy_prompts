  **17. Final Word on the "Barren Metal" Analogy**

  The proposal emphasizes reinterpreting the "barren metal" analogy. This is crucial. If the paper simply accepts the analogy as biological, it falls back into the quantitative reading (money can't grow). By interpreting it as structural (money can't *need*), the paper opens the new avenue of argument. This reinterpretation must be handled carefully. I must not claim Aristotle *meant* the structural reading explicitly if he didn't, but rather that the structural reading makes the best sense of his claims. The argument is one of charitable interpretation: which reading makes Aristotle's argument most coherent? The structural reading makes the *Ethics* and *Politics* cohere. The quantitative reading leaves them separate. Therefore, the structural reading is preferable on grounds of textual unity. This meta-argument will be implicit in the paper's structure.

