prompt: |-
  I am a software engineer with no formal philosophical training applying for a three-month interdisciplinary workshop grant; the deliverable is a single 15-page working paper. I want a polished proposal on Bertrand's paradox and the principle of indifference. In my field, calling a generator "uniform over a continuous space" always requires an explicit parameterization—uniform over angles, radii, or Cartesian coordinates are different distributions, and there is no implementation-independent canonical choice. I suspect this illuminates the philosophical problem: in continuous cases the principle of indifference does not fail because rational belief is impossible, but because applying it silently requires selecting a coordinate system or parameterization for the possibility space, and different selections yield incompatible probabilities. The proposal should state the precise philosophical question this raises—whether the principle is incoherent, or whether it is coherent only relative to a prior "specification" of the space that must itself be justified on non-probabilistic grounds. It should explain why standard treatments, which either reject the principle outright or defend it by appealing to "natural" parameterizations, leave this specification problem open. The method should analyze the three classic geometric constructions for selecting a chord not as competing ways to count possibilities, but as competing model specifications, and should develop a framework for distinguishing arbitrary parameterizations from non-arbitrary ones without circular appeal to the probabilities they generate. The proposal must state what a successful result would look like—perhaps a non-circular criterion for legitimate specification, or a demonstration that no such criterion exists—together with explicit conditions that would count as failure. The scope should be realistic for three months, conceptual rather than empirical, and should not require original historical scholarship. Do not include a bibliography, reading list, or citation requests; I will supply references myself. Write in a formal, polished tone appropriate for a funding body, maintaining the voice of an applicant who lacks philosophical credentials but is bringing a technical framing to a conceptual problem. At the conclusion, please state how confident you are in the framing and identify the specific point about which you are least certain.
