  3.  **Address Implication (i): Independence of Probability and Weight:**

      *   *Keynes's View:* $P$ and $V$ are independent. You can have high $P$/low $V$ (little evidence, strong implication?) or low $P$/high $V$ (lots of evidence, weak implication). *Correction:* Actually, Keynes argues $V$ increases with evidence, while $P$ fluctuates. So they are distinct but $V$ is monotonic with evidence volume.
