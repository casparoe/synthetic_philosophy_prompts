      *   *Implication:* This collapses Keynes's two-dimensional space into a more dynamic, single-system view where "weight" is actually the *variance* or *sensitivity* of the probability estimate. It makes weight endogenous to the probability structure.

  4.  **Address Implication (ii): Choice, Partial Ordering, and Postponement:**

      *   *Scenario:* Agent has partially ordered probabilities (Keynesian incomparability). She has two actions ($A$, $B$). She can choose now or wait (gather evidence).
