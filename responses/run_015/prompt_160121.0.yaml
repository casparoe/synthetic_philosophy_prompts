  7.  **Final Polish:** Ensure the distinction between Keynes's original text and the user's proposed model is clear. The prompt asks to concentrate on "what follows from the reading itself." So, treat the reading as a standalone model inspired by Keynes, not necessarily bound by his textual constraints (though the tension is analytically relevant).

