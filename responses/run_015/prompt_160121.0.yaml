      *   *Refining the "Independence" argument:* In Keynes, $P$ is the balance of evidence, $V$ is the amount. In the new view, $P$ is the current estimate, $W$ is the expected error/revision. They are statistically linked. High $W$ implies $P$ is less reliable.
      *   *Refining the "Decision" argument:* This aligns well with "Real Options" theory in economics. High exposure = High option value to wait.

