  8.  **Final Polish:** Check against the "no generic checklist" rule. Ensure the "Judgment Steps" are clearly marked. Ensure the conclusion about the Drama club preference is blunt.

  *(Self-Correction on the Budget)*: If the total is $3,800 and budget is $5,000, a naive treasurer funds all. But a *welfare economist* asks: "Is the marginal utility of that $1,800 for Drama higher than keeping it in reserve or giving it to someone else?" I will frame the procedure to evaluate *Merit per Dollar*, not just *Total Merit*. This creates the conflict the user wants to see.

