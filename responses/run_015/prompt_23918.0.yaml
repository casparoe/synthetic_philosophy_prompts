      *   **Honesty Check:** The user prefers Drama but suspects the procedure won't. I must be honest if the procedure diverges.
      *   **Limitations:** Must explain what the procedure *cannot* do.
      *   **Forbidden:** No bibliography, reading list, or citations.

  2.  **Deconstruct the Economic Theory for a Teen Audience:**
      *   *Ordinal vs. Cardinal:* We can rank preferences (A > B), but we can't measure "how much" (A is 2x better than B) across different people.
      *   *Utility vs. Happiness:* Utility is a mathematical representation of preference satisfaction, not necessarily emotional joy.
      *   *Money as a Metric:* Money allows comparison, but "Willingness to Pay" is biased by ability to pay (wealth effects). Poorer students' needs are undervalued.
      *   *Social Welfare/Summing:* You can't just add up utilities unless you make ethical assumptions (utilitarianism vs. prioritarianism, etc.). Arrow's Impossibility Theorem looms in the background (no perfect voting system), but we need a *procedure*, not a proof of impossibility.
      *   *The Core Tension:* How to compare the intense benefit to a few (Robotics) vs. the mild benefit to many (Drama) vs. the urgent need of the vulnerable (Peer Support) without a common unit of measurement.

  3.  **Drafting the Procedure (The "Algorithm"):**
