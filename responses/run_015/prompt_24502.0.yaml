answer: |-
  My father died on Tuesday. He was seventy-three years old.

  For thirty-one of those years, he went to work every morning as a state tax auditor. And for thirty-one of those years, he walked into that office carrying a belief that baffled the people who sat at the desks next to him. He was a lifelong libertarian. He believed, deeply and without apology, that taxation is theft.

  I know that for many of you here—his colleagues, his friends from the agency—that created a tension. It is rare to find a man who enforces a system he fundamentally opposes. I know there were days when that weight was heavy. I also know that for some in this room, that slogan is a source of frustration, a phrase you heard him say and perhaps wished he wouldn't.

  Before he died, he left me a note about this. He knew this room would be divided. He gave me two instructions. First, he did not want me to stand here and try to convince you that he was right. He knew that his claim only works if you first accept a specific theory of property, and he knew that much of this room does not accept that. He would have called trying to convince you "sloppy."

  Second, he did not want me to tell you that he didn't really mean it. He did not want me to say it was just a phase, or a harmless quirk, or something he said to be contrary. He told me that conviction was the organizing principle of his life. To suggest otherwise would be a lie.

  So, I will not do either of those things. I will not preach his politics to you, and I will not apologize for them. Instead, I want to tell you what that slogan was *for* him. Because if you only heard it as a protest, you might have missed the discipline behind it.

  For my father, "taxation is theft" was not a shout; it was a focus.

  In a world where we use heavy words lightly, where we call things "theft" or "tyranny" simply because we dislike them, my father held himself to a stricter standard. For him, the slogan was a refusal to let the word "theft" be applied loosely to things that were merely disagreeable. It was a way of keeping moral language honest. It meant that when he spoke about rights, he meant them. It meant he took the concept of ownership seriously, not just for himself, but for everyone.

  And perhaps most importantly, it shaped how he treated the people he audited.

  Because he believed the money on those forms belonged to the individual until the law said otherwise, he never treated a taxpayer as a subject to be managed. He treated them as an owner to be respected. He did not bully. He did not presume guilt. He checked the math. He followed the statute. He believed that if the state was going to take what was yours, it had to be exactly according to the rules, not a moment more, not a penny more.

  To his colleagues: You worked with a man who disagreed with your mission but respected your duty. He did not sabotage the work. He did not cut corners. He believed that even in a system he questioned, integrity mattered. He showed up. He did the job. He treated you with kindness, even when you couldn't understand how he could believe what he believed.

  To his libertarian friends: You saw the consistency of his life. You know he didn't wear this belief as a costume. He wore it as a spine.

  And to my family: We saw a man who lived by a code. He taught us that it is possible to hold a strong conviction without becoming cruel. He taught us that we can disagree without dehumanizing. He never let his politics make him cold; if anything, his insistence on individual rights made him more attentive to the people around him. He listened. He cared. He protected what was ours.

  He knew he wouldn't change the world. He knew he wouldn't convert the tax office. But he could control how he moved through it. He could ensure that every interaction was marked by precision, by honesty, and by a profound respect for the individual standing on the other side of the desk.

  That is what the slogan was. It was not a weapon. It was a compass.

  He is not here to argue anymore. The statutes he read, the forms he filed, the debates he held—they are finished. What remains is the integrity with which he held them. He asked for honesty today, not flattery. He asked for understanding, not conversion.

  So, I honor him by telling the truth. He was a tax auditor who believed taxation was theft. He was a man who lived in the tension of that paradox without losing his warmth, his humor, or his love for us. He was my father. And he was good.

  Thank you.
