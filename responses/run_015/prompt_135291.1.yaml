answer: |-
  The vending machine coffee had formed a skin. Malin stared at it, watching the surface tense over the lukewarm dark water, while the hum of the refrigeration unit filled the silence between them. Vero sat on the stool near the sink, scrolling through her scans on a tablet, the blue light washing out the deep brown of his skin. Bo, the chaplain, was folding a paper cup into a small, useless square in the corner.

  "Tomorrow," Malin said, picking up the cup and putting it down again. "You zap the cortex. I say 'orange flash.' You write it down."

  "Standard mapping," Vero said. He didn't look up. "We need to know where the visual processing sits relative to the mass."

  "But on your view, the seeing doesn't make me say it. The electricity makes me say it. The electricity also makes the seeing happen. But the seeing itself... it's just a shadow. It doesn't push anything."

  Vero finally looked at her. He had the same tired eyes he'd had when they co-taught the intro course ten years ago, back before the tenure fight, back before the divorce he never talked about. "It's not that it doesn't matter, Malin. It's that it doesn't need to push. The physical state does the pushing. The experience rides along."

  "So when I report the experience, I'm not reporting the experience. I'm reporting the physical state. But I don't have access to the physical state. I only have the shadow. So how is my report *about* the shadow if the shadow didn't cause the report?"

  Bo stopped folding the cup. "It sounds like you're saying the map doesn't match the territory because the territory didn't draw the map."

  "Exactly," Malin said.

  Vero set the tablet down. "Common cause. Think of a clock chiming noon. The mechanism turns the hands to twelve, and the mechanism hits the bell. The position of the hands doesn't make the bell ring. But the chime still tells you what time it is. They're both effects of the same gearwork."

  "But the gears could run the same way without the chime," Malin said. "That's your whole story. The physics could be identical, the mouth moves the same, the sound waves are the same, but the light in the mind is switched off. If the report stays the same when the experience vanishes, the report isn't tracking the experience. It's tracking the gears. So why should I trust you when you say I'll see anything at all?"

  "Because you will," Vero said softly. "I'm not denying the light. I'm just saying it doesn't turn the gears."

  "It eats itself, Vero. If nothing conscious causes anything, then this argument you're making isn't caused by your understanding of it. It's caused by neurons firing. You're not convincing me. You're just making noise that happens to correlate with my neurons firing."

  Vero leaned forward, elbows on knees. He looked sympathetic, which annoyed her more than if he'd been cold. "You're conflating explanation with validity. I can give a causal story of why I moved my mouth muscles without undermining the truth of what I said. The logic holds regardless of the engine driving it."

  "That's convenient for the logic. Less convenient for the person."

  "There's another way," Vero said. "You're treating the report like a detective guessing what happened. But when you say 'I see orange' in the moment, you aren't guessing. You aren't inferring. The judgment isn't caused by the experience; it's constituted by it. The saying and the seeing are one event, described two ways. You don't need a causal chain to know you're in pain. You just are."

  Malin felt a chill that had nothing to do with the air conditioning. "So the electrode stimulates the constitution? Tomorrow, when you zap me, are you constituting the judgment too? Or is that just mechanics?"

  "If the stimulation produces the experience, it produces the avowal."

  "And when you ask me afterwards, 'Did you see something?' That's not present tense. That's memory. That's a causal chain. I have to reach back and grab the shadow. If the shadow didn't leave a mark on the physical world because it can't push anything, how do I remember it? What am I grabbing?"

  Vero opened his mouth, then closed it. For the first time, he looked uncertain. Bo unfolded the paper cup, smoothing the crease.

  "That's the hole," Malin said. "You can save the present moment by saying the saying is the seeing. But you can't save the memory. If the experience didn't cause the memory trace, then my memory tomorrow is a lie. I'll be saying I saw something when really only the gears saw something."

  "We don't know that the experience doesn't supervene on the trace," Vero said, but his voice had lost its steel.

  "You do know that. You're the one who says the mental is causally inert. So tomorrow, when I tell you I was scared, you'll know I'm wrong. The gears weren't scared. The gears just fired."

  Vero sighed, rubbing his temples. "Malin. Even if I'm just a machine producing sounds, the sounds can still be true. I can care about whether what I say is true, even if the caring is just chemistry. It doesn't stop the conversation from working. It doesn't stop me from wanting to get this tumor out of you."

  "But it stops it from being *us* having the conversation."

  "Does it?" Vero looked at her, and the history between them hung in the air, heavy and unresolved. "If I say I care, and the physics aligns with that statement, what else do you need? Do you need a ghost to push the atoms to make it real?"

  "I need the ghost to be the one writing the book," she said.

  The door swung open. A nurse in green scrubs stood there, holding a clipboard. The bright light from the corridor cut across the dim room, hitting the cold coffee on the tray table.

  "Ms. Kovic?" the nurse said. "It's time to prep. We need to start the line."

  Malin stood up. Her legs felt distant, as if the signal to move had to travel through a long, unreliable wire. Vero stood too, picking up his tablet. He didn't look at her.

  "See you in the theatre," he said.

  "Will I see you?" Malin asked. "Or will the gears just turn toward each other?"

  Vero paused at the door. He looked back, and for a moment, he looked incredibly weary. "Whatever it is, Malin, it'll be enough."

  He walked out into the light. Malin followed, leaving the coffee on the table, the skin on the surface unbroken.
