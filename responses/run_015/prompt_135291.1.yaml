      *   **Setting:** Pre-op room, dim lights, cold vending machine coffee, night before surgery.
      *   **Core Conflict:** Malin vs. Vero on epiphenomenalism (conscious states cause nothing) vs. Malin's view (it's self-stultifying, especially in the OR context).
      *   **Philosophical Territory:**
          1.  Basic paradox: If consciousness causes nothing, judgments about it aren't caused by it. How is the judgment *about* the state?
          2.  Vero's Move 1: Common-cause reply (physical base causes both experience and report in parallel).
          3.  Malin's Counter: Counterfactual dependence (zombie case: physical same, experience absent, report same -> report doesn't track experience).
          4.  Vero's Move 2: Co-constitution/Self-intimation (present-tense judgment isn't caused by experience, it's partly *made* of it).
          5.  Malin's Counter: Does this survive stimulation? Is it identity theory for judgment but dualism for state? What about memory judgments (plot crucial)?
          6.  Personal Beat: Self-stultification (if Vero is right, his arguments aren't caused by his reasoning).
          7.  Vero's Response: Distinguish truth/grounding from causal-explanatory work.
          8.  Asymmetry: Present-tense avowals vs. retrospective judgments.
      *   **Tone/Style:** 1200 words, third-person limited (Malin), smart/tired/petty, history between Malin and Vero (co-taught badly), no strawmen, no jargon like "qualia" or philosopher names, unresolved ending (physical transition to surgery).
      *   **Constraint:** "Nobody says the word 'qualia', nobody cites anything, and no real philosophers' names appear."

  2.  **Character Voices:**
      *   **Malin:** Sharp, anxious but masking it with intellect, protective of her own mind's agency, tired.
      *   **Vero:** Calm, precise, sympathetic but firm in his materialism, sees the surgery as proof of his view.
      *   **Bo:** Quiet, prompts clarification, humanizes the abstract.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Set the scene. Cold coffee, dim lights, tension. Establish the history subtly.
      *   *The Setup:* Malin brings up the problem of the report tomorrow. If she says "orange flash," what caused it?
      *   *Vero's Move 1 (Common Cause):* The electrode hits the physics; physics makes the sight and the speech. Parallel tracks.
      *   *Malin's Push (Counterfactuals):* If the physics is the same, why need the sight? If the sight vanishes but physics stays, you still say "orange." So the word "orange" isn't about the sight.
