      *   *The Personal Beat:* Malin turns it on Vero. Why are you arguing? If thoughts don't cause speech, you're just a meat puppet.
      *   *Vero's Defense:* Truth doesn't need causal leverage. The argument is valid even if the physics drove the mouth.
      *   *Ending:* The orderlies arrive. The drugs kick in. The unresolved philosophical tension mirrors the physical vulnerability.

  4.  **Refining the Philosophy (Checking against constraints):**
      *   *Epiphenomenalism:* Consciousness is a smoke signal. It doesn't push the train.
      *   *The "Eats Itself" argument:* If consciousness doesn't cause belief, why trust the belief about consciousness?
      *   *Co-constitution:* The idea that "I am in pain" isn't a report *about* pain, it's a verbalization *of* pain.
      *   *Memory:* This is the weak spot for Vero. Retrospective reports *must* be causal chains.
