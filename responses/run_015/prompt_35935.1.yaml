prompt: |-
  so i'm an undergrad taking an animal ethics course this semester (honestly its my favorite class) and i somehow got elected student rep on the university's dining services advisory committee. every couple of weeks we vote on menu proposals from the dining staff -- stuff we've had this semester: swapping the default protein at the burrito station from beef to chicken to save money, adding a "meatless monday", switching to a cheaper chicken supplier, etc. the rest of the committee is staff who care about cost and student satisfaction, and i'm the only one who thinks about the animal side, but i can't exactly run a full utilitarian calculation on each proposal in the five minutes it gets in the meeting. from my course i've learned enough to know it's messy: the obvious stuff (chicken vs beef, where per kg chicken means vastly more animals killed), but also the less obvious stuff like animals dying in crop cultivation from harvesting, which makes even "just add more plant-based options" not a free win. i want a decision procedure i can actually run, maybe on a napkin: a short ordered list of questions to ask about any proposal, what counts as enough of an answer to each one, where the procedure outputs a no, and where it should punt and say "this is a values question, argue it in the open instead." then run it on three realistic proposals: (1) replacing beef with chicken at two stations to cut costs, (2) a meatless monday where the vegetarian option is just a bigger portion of veg they already serve, and (3) switching to a local pasture-raised beef that costs noticeably more. at least one of these should come out with an answer i won't like, and you should be upfront about where the procedure misfires or depends on numbers nobody actually has (like how many animals die per kg of each food, or per hectare of crops). also keep the philosophy jargon out or define it in plain words, since i have to hand a one-page version of this to the other committee members and they will not read anything that sounds like a seminar.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Undergrad student, taking animal ethics (favorite class), elected student rep on dining services advisory committee.
      *   **Context:** Committee votes on menu proposals (cost, satisfaction, animal welfare). User is the sole voice for animals.
      *   **Constraint:** Needs a practical "decision procedure" (algorithm/checklist) usable in a 5-minute meeting window ("on a napkin").
      *   **Requirements:**
          *   Short ordered list of questions.
          *   Criteria for passing/failing/punting.
          *   Apply to three specific scenarios (Beef->Chicken, Meatless Monday, Local Pasture Beef).
          *   At least one outcome must be uncomfortable/unexpected.
          *   Acknowledge uncertainties (data gaps like crop deaths).
          *   Low jargon (for other committee members).
      *   **Tone:** Pragmatic, honest, philosophically grounded but accessible.

  2.  **Deconstruct the Ethical Problem:**
      *   The core tension is between *consequentialism* (minimizing harm/suffering) and *practical constraints* (cost, data availability, time).
      *   Key ethical insights from the course mentioned:
          *   Chicken vs. Beef (numbers game: many small lives vs. few large lives).
          *   Crop deaths (plant agriculture isn't harm-free).
          *   Welfare standards (confinement vs. pasture).
      *   The "Napkin Test" needs to prioritize *reduction of suffering* while acknowledging *feasibility*.

  3.  **Drafting the Decision Procedure (The "Napkin Test"):**
      *   *Goal:* Filter proposals quickly.
      *   *Step 1: Direct Impact.* Does this change the number of animals killed or their quality of life?
      *   *Step 2: Substitution Effect.* If we remove X, what replaces it? (Crucial for the crop death issue).
      *   *Step 3: Feasibility/Scale.* Will students actually eat it? (Waste = ethical loss).
      *   *Step 4: The "Punt" Condition.* When is it too close to call without data?
      *   *Refinement:* Keep it to 4 questions max. Make the "No" conditions clear.

      *   *Draft Questions:*
          1.  Does this reduce the number of animals killed? (If yes, good. If no, check welfare).
          2.  Does this increase reliance on crops with high field deaths? (Hard to measure, maybe simplify).
          3.  Does this improve living conditions for remaining animals?
          4.  Is the cost increase sustainable? (Committee reality).

      *   *Better Approach (The "Harm Reduction Hierarchy"):*
          1.  **Count:** Does it reduce the *number* of individual animals killed? (Prioritize this, it's the biggest lever).
          2.  **Quality:** If numbers stay same/go up, does it drastically improve life quality?
          3.  **Substitution:** Does the replacement involve high hidden harm (e.g., specific crops)?
          4.  **The Veto:** If it increases harm without a massive welfare gain, vote No. If data is missing, Punt.

  4.  **Developing the Three Scenarios:**

      *   **Scenario 1: Beef -> Chicken (Cost Cutting).**
          *   *Ethics:* Beef (1 cow) vs. Chicken (many birds). Switching to chicken usually *increases* the number of deaths per kg of protein.
          *   *Procedure Outcome:* Likely a **NO**.
          *   *Why:* Increases individual count significantly.
          *   *User Reaction:* They might like this, but the prompt asks for at least one outcome they *won't* like. Let's hold off. Actually, most animal ethicists hate beef->chicken swaps because of the numbers. So this is a "No".

      *   **Scenario 2: Meatless Monday (Veg portion increase).**
          *   *Ethics:* Removes meat one day. Replaces with veggies.
          *   *Nuance:* Crop deaths exist. But meat requires feed crops *plus* the animal. So veg is still lower harm.
          *   *Procedure Outcome:* **YES**.
          *   *User Reaction:* They will like this.

      *   **Scenario 3: Local Pasture-Raised Beef (Higher Cost).**
          *   *Ethics:* Fewer animals than chicken, but "happy" life vs. factory farm. Still ends in slaughter. Cost is higher, might reduce budget for other things.
          *   *Nuance:* This is the tricky one. High welfare, but still death. High cost might limit other ethical wins.
          *   *Procedure Outcome:* This needs to be the one they *won't* like. Why? Because the procedure prioritizes *numbers of lives* over *quality of life* in a resource-constrained environment. Or, because the cost increase prevents other reductions. Let's make the procedure flag the "Cost per Life Saved" metric. If it costs too much to save one life compared to Option 1, it fails.
          *   *Actually, let's flip it:* The prompt says "At least one of these should come out with an answer i won't like."
          *   *Idea:* The "Beef to Chicken" swap is usually bad for animals (more deaths). The student might instinctively think "Chicken is smaller, maybe it's okay?" or they might know it's bad.
          *   *Idea:* The "Pasture Beef" sounds good emotionally, but ethically it's often inefficient. If the procedure says "No" to Pasture Beef because it's too expensive per unit of harm reduced, that might be the uncomfortable truth.
          *   *Idea:* The "Meatless Monday" might get a "Punt" if the veggie option is high-harm crops (e.g., almonds/avocados vs. grains). Let's make the procedure catch the "Crop Death" nuance.
          *   *Decision:* Let's make the **Beef -> Chicken** result a hard **NO** (which they might expect, but it conflicts with the committee's cost saving). Let's make the **Pasture Beef** a **NO** or **PUNT** because the cost efficiency is low compared to just reducing meat overall.
          *   *Wait, the prompt says "At least one... answer I won't like."* Usually, animal advocates love "Pasture Raised." If the procedure says "No, it's too expensive for the welfare gain," that's a hard pill. Or, if the procedure says "Yes" to Beef->Chicken because of some weird metric? No, that's bad ethics.
          *   *Best bet:* The **Meatless Monday** proposal. If the procedure highlights that simply increasing veg portions without checking *which* veg (e.g., high pesticide/water/harvest death crops) might lead to a "Punt" or "No" based on data gaps.
          *   *Alternative:* The **Beef -> Chicken** swap. Most people think Chicken is "lighter." The procedure must show it's *worse* for animals (more deaths). The student might like that result.
          *   *Let's go with the Pasture Beef.* It feels good, but the procedure (focused on harm reduction per dollar) might reject it in favor of simply buying less meat. That's a common effective altruism tension.
          *   *Wait, let's look at the "Crop Death" angle.* If the procedure forces us to admit we don't know the crop death stats, Meatless Monday becomes a "Punt." That's frustrating.
          *   *Let's try this:* The Procedure prioritizes *Number of Lives* over *Quality of Life*.
              1.  Beef -> Chicken: **NO** (More lives lost).
              2.  Meatless Monday: **YES** (Fewer lives lost, crop death negligible compared to feed+mortality).
              3.  Pasture Beef: **NO** (Cost is too high for the marginal welfare gain; better to buy less conventional beef).
              *   *Which one will the student not like?* Probably the Pasture Beef one. It sounds "ethical" but fails the efficiency test. Or the Meatless Monday if the procedure is too strict on crop data.
              *   *Let's make the Beef->Chicken one the "Uncomfortable" one for the COMMITTEE, but the Student might like it.*
              *   *Okay, re-reading:* "At least one of these should come out with an answer i won't like."
              *   *Hypothesis:* The student probably wants to vote against Beef->Chicken. The procedure will say "No." They will like that.
              *   *Hypothesis:* The student probably wants Meatless Monday. Procedure says "Yes." They like that.
              *   *Hypothesis:* The student probably thinks Pasture Beef is a good compromise. Procedure says "No" (because it's inefficient harm reduction). **This is the one.** It challenges the "humane washing" idea.

  5.  **Refining the Procedure (The "5-Minute Filter"):**
      *   Needs to be jargon-free.
      *   Needs to handle the "Crop Death" objection without getting stuck.
      *   Needs to handle the "Chicken vs. Beef" math.

      *   *Question 1: The Headcount.* Does this increase or decrease the estimated number of individual animals killed? (Use rough ratios: 1 Cow = ~50-100 Chickens).
      *   *Question 2: The Life Quality.* If numbers stay same, does it move animals from high-suffering (cages/crates) to low-suffering (pasture)?
      *   *Question 3: The Plant Substitution.* If removing meat, are we replacing with whole plants (grains/beans) or high-impact crops (nuts/berries with high field death/harvest issues)? *Simplification:* Assume grains/beans are lower harm than meat+feed.
      *   *Question 4: The Cost-Benefit.* Does the cost increase prevent other harm-reduction measures? (Opportunity cost).

  6.  **Writing the Response:**
      *   **Intro:** Validate their position. It's tough being the sole voice.
      *   **The Procedure:** "The 5-Minute Harm Filter." 4 Questions. Clear Pass/Fail/Punt criteria.
      *   **The Application:** Run the three scenarios.
      *   **The Uncomfortable Truth:** Highlight the Pasture Beef result (Efficiency vs. Purity).
      *   **The Data Gaps:** Be honest about crop deaths and slaughter ages.
      *   **The Handout:** Format it so they can literally copy-paste it.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I use too much jargon? *Fix:* Replace "utilitarian calculus" with "cost-benefit." Replace "sentience" with "ability to suffer."
      *   *Check:* Is the "Beef to Chicken" math clear? *Fix:* Explicitly state the ratio (1 cow ≈ 50+ chickens).
      *   *Check:* Is the "Uncomfortable Answer" clear? *Fix:* Make sure the Pasture Beef rejection is based on *opportunity cost* (money could save more lives elsewhere), which is a hard pill for welfare advocates.
      *   *Check:* Did I address the crop death issue? *Fix:* Acknowledge it in the "Punt" section but don't let it paralyze the decision (meat requires crops + animal, so plants are still generally lower harm).

  8.  **Final Polish:** Ensure the tone is supportive but rigorous. The student is smart; don't talk down, but keep it practical. (Make sure to explicitly mention the "Napkin" aspect).

  *(Self-Correction on the "Answer I Won't Like"):*
  Actually, a lot of animal ethics students struggle with the "Chicken vs. Beef" math because it feels counterintuitive to the public. But the *Pasture Beef* one is usually the bigger emotional hurdle. "Happy cows" feel good. Telling them "No, it's too expensive per life saved" is the Effective Altruism critique. I will focus on that.
  *Wait, another angle:* The "Meatless Monday" might fail if the procedure demands data on crop deaths that doesn't exist. That leads to a "Punt." That's frustrating.
  *Decision:* I'll make the **Pasture Beef** the "No." It's the most philosophically robust "uncomfortable truth" (welfare vs. abolition/efficiency).

  Let's finalize the procedure steps.
  1. Count (Deaths).
