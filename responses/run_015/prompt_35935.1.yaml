answer: |-
  This is a classic "applied ethics in the wild" problem. You are trying to maximize harm reduction under constraints of time, data, and bureaucracy. The goal isn't moral purity; it's the *best available outcome* given the leverage you have.

  Below is the **"5-Minute Harm Filter."** It is designed to be printed on a single page and handed to your committee. It avoids words like "utilitarianism" or "sentience" and focuses on counts, conditions, and costs.

  After the procedure, I have run your three proposals through it. One of the results will likely frustrate you, but it is where the logic leads.

  ### The 5-Minute Harm Filter (For Committee Use)

  **Goal:** Reduce animal suffering and death without making food inaccessible or wasting budget.
  **How to use:** Ask these four questions in order. If you get a **NO** at any step, vote **NO** on the proposal. If you get **UNKNOWN** on Step 1 or 3, vote **PUNT** (request data).

  **1. The Headcount Test**
  *   **Question:** Does this proposal increase or decrease the total number of individual animals killed per semester?
  *   **The Math:** 1 Beef Steer ≈ 50–100 Broiler Chickens (by protein weight). 1 Pig ≈ 20–30 Chickens.
  *   **Pass:** Decreases total heads.
  *   **Fail:** Increases total heads (e.g., swapping beef for chicken).
  *   **Punt:** Cannot estimate numbers.

  **2. The Life Quality Test**
  *   **Question:** If the headcount stays the same or rises slightly, does it drastically improve the living conditions of the animals?
  *   **Definition:** "Drastic" means moving from confinement (cages/crates/indoor-only) to outdoor access/pasture. Minor tweaks (slightly more space indoors) do not count.
  *   **Pass:** Yes, major welfare improvement.
  *   **Fail:** No change, or worse conditions.

  **3. The Substitution Test**
  *   **Question:** If we remove meat, what replaces it?
  *   **Rule:** Whole plants (grains, beans, root veg) count as lower harm than meat. High-input crops (nuts, berries, out-of-season produce) have higher "field death" risks (animals killed during harvest) and environmental costs.
  *   **Pass:** Replacing meat with grains/beans/local veg.
  *   **Fail:** Replacing meat with high-harm crops or ultra-processed substitutes that require high crop input.
  *   **Punt:** We don't know the source of the replacement crops.

  **4. The Budget Efficiency Test**
  *   **Question:** Does the cost increase prevent other harm-reduction measures?
  *   **Rule:** If a proposal costs 20% more but only helps 5% more animals, the extra money could have been better spent simply buying *less* meat overall or funding a different initiative.
  *   **Pass:** Cost is neutral, or the welfare gain justifies the premium.
  *   **Fail:** High cost for marginal welfare gain (inefficient use of limited ethical budget).

  ***

  ### Running Your Three Proposals

  Here is how the filter processes the scenarios you mentioned.

  #### Proposal 1: Swap Default Beef to Chicken (Cost Cutting)
  *   **Step 1 (Headcount):** **FAIL.**
      *   *Reasoning:* To match the protein of one steer, you need roughly 50 to 100 chickens. Even if the cows lived in worse conditions, the sheer multiplication of individual deaths and slaughter events is a net negative under a "count the lives" framework.
      *   *Result:* **VOTE NO.**
  *   *Note:* This is the easiest win for you. The committee sees "smaller animal = less impact." The math says otherwise.

  #### Proposal 2: Meatless Monday (Larger Veg Portions)
  *   **Step 1 (Headcount):** **PASS.**
      *   *Reasoning:* Removing meat one day a week reduces demand by ~14%. Even accounting for crop deaths in the vegetable production, plant agriculture requires far fewer hectares and causes fewer direct animal deaths than growing feed *plus* raising the livestock.
  *   **Step 3 (Substitution):** **PASS.**
      *   *Reasoning:* You noted they are serving "veg they already serve." Assuming this is standard cafeteria fare (potatoes, rice, beans, seasonal veg), this clears the substitution test.
      *   *Result:* **VOTE YES.**

  #### Proposal 3: Switch to Local Pasture-Raised Beef (Higher Cost)
  *   **Step 1 (Headcount):** **NEUTRAL.**
      *   *Reasoning:* It is still beef. The number of cows killed remains roughly the same to meet demand.
  *   **Step 2 (Life Quality):** **PASS.**
      *   *Reasoning:* Moving from feedlot to pasture is a significant welfare improvement for the life of the animal.
  *   **Step 4 (Budget Efficiency):** **FAIL.**
      *   *Reasoning:* This is the uncomfortable one. Pasture-raised beef costs significantly more (often 2x–3x).
      *   *The Ethical Trade-off:* If you spend the extra budget on *welfare* for the cows, you cannot spend that budget on *reduction*.
      *   *The Logic:* For the price of 1 kg of pasture beef, you could potentially buy 3 kg of conventional plant protein. The "Harm Filter" prioritizes **reducing the number of deaths** over **improving the life of animals destined to die**, because the budget is fixed. Spending more money to make slaughter "happier" leaves less money to eliminate slaughter entirely in other areas.
      *   *Result:* **VOTE NO.**

  ***

  ### The Uncomfortable Truth (And Where the Procedure Misfires)

  You likely wanted to support Proposal 3 (Pasture Beef). It feels like a compassionate compromise. However, the procedure flags it as an **inefficient use of ethical capital.**

  If your goal is to minimize suffering, buying "humane" meat is often less effective than buying *less* meat. By voting "No" on the expensive beef, you free up budget that could fund **two** Meatless Mondays or a switch to plant-based defaults at other stations. The procedure forces you to choose between **Welfare** (better life) and **Abduction** (fewer deaths). In a budget-constrained system, it prioritizes Abduction.

  **Where the Procedure Misfires (Data Gaps):**
  You need to be honest with the committee about where the math is shaky. Put this in the footer of your handout:

  1.  **Crop Deaths:** We do not have exact numbers on how many mice, birds, or insects die per hectare of soy or wheat harvesting. We assume it is lower than livestock feed + livestock, but it is not zero.
  2.  **Slaughter Age:** Broiler chickens are slaughtered at 6–7 weeks. Cows at 18–24 months. Some ethical frameworks weigh the loss of a cow's potential life heavier than a chicken's. This procedure treats all lives as equal counts for simplicity.
  3.  **Student Waste:** If we switch to a plant option students refuse to eat, and it gets thrown in the trash, the ethical benefit is lost. (This is why Step 3 requires "veg they already serve" to ensure acceptance).

  ### How to Pitch This to the Committee
  Don't say "I'm running a utilitarian calculation." Say this:

  > "I've drafted a quick checklist to help us vote consistently. It focuses on getting the most impact for our budget. It helps us avoid swaps that accidentally increase the number of animals killed (like beef to chicken) and ensures our budget goes toward options that actually reduce harm rather than just making harmful options more expensive."

  This frames your animal ethics as **efficiency and consistency**, which appeals to administrators much more than moral philosophy does. Good luck. You're doing the hard work of making ethics functional.
