answer: |-
  Here is a precise formulation of your principle, tested against your cases, followed by the honest audit you requested.

  ### 1. The Principle: Equal Individual Chance (EIC)

  **Statement:**
  Moral decision-making in rescue scenarios is governed by the **Strength of Individual Claim**, not the Sum of Claims.
  1.  **Claim Strength:** Each individual $P$ has a claim to be saved proportional to the **Severity** of their loss discounted by the **Probability** of that loss occurring.
  2.  **Non-Aggregation:** The claim of one individual cannot be outweighed by the sum of weaker or equal claims held by others.
  3.  **Fairness Mechanism:** When claims conflict and cannot all be satisfied, you must distribute the *chance of survival* equally among all claimants. This may require randomizing between groups such that every *individual* has an equal ex-ante probability of being saved.

  ---

  ### 2. Testing Against Your Cases

  Here is how the EIC principle maps to your intuitions, noting where it aligns and where it strains.

  | Case | Your Intuition | EIC Verdict | Fit? |
  | :--- | :--- | :--- | :--- |
  | **1 vs. 5 Strangers** | Coin toss (equal shot per person). | Randomize so each of the 6 has 1/6 chance (save 5 with 5/6 prob). | **Perfect.** This is the core motivation. |
  | **1 vs. 1 Million** | Pull toward the million. | Randomize so each has 1/1,000,001 chance (save million with >99.9% prob). | **Tension.** The mechanism holds, but your "pull" suggests the *certainty* of the outcome matters more than the fairness of the chance. |
  | **1 Death vs. 1M Fingers** | Save the 1. | Severity (Death) > Severity (Finger). Individual claim of 1 outweighs individual claim of any in the 1M. | **Perfect.** Claims are unequal; stronger claim wins. |
  | **1 Death vs. 1M (1/1000 risk)** | Feel "something" for the 1M, but less. | Claim of 1 (100% death) > Claim of any in 1M (0.1% death). Save the 1. | **Partial.** The principle says save the 1 decisively. Your "something" suggests you are secretly summing expected deaths. |
  | **Promise vs. 5** | Keep promise. | The promise creates a special duty (increased claim strength) for the 1. | **Compatible.** Requires adding "Special Duties" to Claim Strength. |
  | **Omission vs. Commission** | No pull to save 5 (omission). | EIC is neutral to act/omission; focuses on claims present. | **Compatible.** Explains why you feel no *pull*, though it doesn't forbid saving the 5. |
  | **Proximity (Front vs. Check)** | Save front; mail check. | **Fail.** EIC is agent-neutral. Distance does not alter Claim Strength. | **Mismatch.** Your intuition here is psychological salience, not moral principle. |
  | **Conscious vs. Unconscious** | Save conscious. | **Fail.** Loss of future is identical. Consciousness does not alter Claim Strength. | **Mismatch.** Your intuition here is likely bias. |

  ---

  ### 3. Application to New Cases

  **Case A: The All-or-Nothing Group**
  *Scenario:* You can save one stranger, or a group of five who are physically linked (e.g., in a single elevator) such that you must save all five or none.
  *   **EIC Verdict:** You must still give each *individual* an equal chance. Since saving the group saves five individuals, you must save the group with 5/6 probability and the single stranger with 1/6 probability.
  *   **Reasoning:** The physical linkage changes the *logistics*, not the *moral claims*. To give each person an equal shot, the "Save Group" option must be weighted higher.

  **Case B: The Shared Loss (Family)**
  *Scenario:* You can save one stranger, or a family of five. If the five die, the loss is "shared" (e.g., they are the last members of a lineage, or their deaths cause a unique collective grief).
  *   **EIC Verdict:** Save based on individual claims (Death vs. Death). The "shared loss" is irrelevant unless it constitutes additional harm to *survivors*.
  *   **Reasoning:** The EIC principle is strictly individualistic. It does not recognize "group entities." If the family members die, five individuals lose their futures. The fact that they are related adds no weight to their individual claims to life. To count the "shared loss" would be to aggregate the grief of the community, which violates Non-Aggregation.

  ---

  ### 4. The Honest Audit

  You asked for an honest note on where this principle cannot accommodate your verdicts, and whether it collapses into adding up expected harm.

  **The Collapse:**
  Your principle **does quietly collapse into a form of aggregation**, specifically **Proportionalism**.
  You stated: *"I do feel fine tossing a coin that gives each of the six an equal shot, which happens to rescue the five most of the time."*

  Mathematically, giving each of six people an equal 1/6 chance of survival *requires* you to save the group of five 83% of the time. This means the **number of people determines the probability of the action.**
  *   If numbers truly didn't count (strict Taurek), you would flip a coin between the *options* (Heads: Save 1, Tails: Save 5). This gives the single person a 50% chance and each of the five a 50% chance.
  *   By insisting on an equal chance *per person*, you have accepted that the moral weight of the "Save 5" option is five times the weight of the "Save 1" option.

  **The Inconsistencies:**
  1.  **The Million Person Pull:** Your intuition that you *should* save the million (or feel a strong pull) is consistent with your "Equal Shot" mechanism (which would dictate saving the million 99.9999% of the time). However, it contradicts your stated belief that "numbers don't count." You are behaving like an aggregator while speaking like a non-aggregator.
  2.  **Proximity:** The EIC principle cannot accommodate your "In Front of Me vs. Check" inconsistency. This is purely psychological. The principle demands you treat the drowning person in front of you and the person you can save via check identically if the costs to you are identical. Your intuition here is a bias (identifiable victim effect), not a moral feature.
  3.  **Consciousness:** The EIC principle cannot accommodate your lean toward the conscious person. If "what matters is what each individual stands to lose," the unconscious person loses their entire future just as the conscious one does. Your lean is likely an emotional reaction to suffering, not a calculation of loss.

  ---

  ### 5. The Verdict: What to Drop

  You have three conflicting elements:
  1.  **The Theory:** Numbers don't count; only individual claims matter.
  2.  **The Mechanism:** Give every individual an equal chance of survival (Proportionalism).
  3.  **The Intuition:** At very large numbers (1 million), the numbers *should* decide it.

  **You must drop Element 1.**

  If you stick with your **Mechanism** (Equal Shot per Person), you are already counting numbers. You are just counting them probabilistically rather than deterministically.
  *   In 1 vs. 5, you count to 5.
  *   In 1 vs. 1,000,000, you count to 1,000,000.

  There is no logical stopping point where the "pull" kicks in. If giving each person an equal shot is fair for 5, it is fair for 1,000,000. If you feel the pull at 1,000,000, you should feel the pull at 5. The fact that you don't feel it at 5 but do at 1,000,000 suggests your "gut" is actually aggregating expected harm, but your "theory" is trying to deny it.

  **Recommendation:**
  Adopt **Proportionalism** explicitly.
  *   **Principle:** *Each individual has an equal claim to rescue. When claims conflict, the probability of saving a group should be proportional to the number of individuals in that group.*
  *   **Verdict to Drop:** Drop the idea that "numbers don't count." They do count, because fairness to individuals *requires* counting them.
  *   **Verdict to Keep:** Keep the "Death > Finger" distinction (Severity matters). Keep the "Discount by Probability" distinction (Certainty matters).
  *   **Verdict to Discard:** Discard the "Proximity" and "Consciousness" intuitions. They are biases that undermine the universality of your principle. Discard the hesitation on the 1 vs. 5 case; if you accept the 1 vs. Million pull, you must accept the 1 vs. 5 pull.

  **Summary:** Your gut is more utilitarian than you want to admit. Your "Equal Shot" mechanism is simply Utilitarianism dressed in the language of fairness. Embrace the counting; it's the only way to make the 1 vs. Million case consistent with the 1 vs. 5 case.
