answer: |-
  This is a sharp observation, and your intuition is correct: Goodhart's Law is the closest popular cousin, but it isn't the precise fit. Goodhart's Law describes the degradation of a *metric* ("when a measure becomes a target, it ceases to be a good measure"). Your pattern describes the migration of a *behavior* ("when a channel becomes a target, the flow ceases to use that channel").

  There is no single English word that captures the displacement, the invisibility, and the conservation of corruption volume all at once. However, there are three established concepts from different disciplines that, when layered, give you the precise "carve" you need.

  ### 1. The Label: "The Balloon Effect" (or Tactical Displacement)

  The most vivid term, widely understood in policy and journalism, is **The Balloon Effect**.

  Originating in narcotics interdiction (squeeze coca cultivation in Colombia, it bulges in Peru), it is now standard in counter-terrorism and organized crime literature. It captures the **conservation of mass**: the pressure (corruption/favoritism) doesn't dissipate; it merely seeks the path of least resistance.

  If you need academic rigor, the criminological term is **Tactical Displacement**. In Situational Crime Prevention theory, displacement comes in five forms: spatial, temporal, target, tactical, and functional. Your examples are primarily **Tactical Displacement** (changing the *method* of the crime) and **Functional Displacement** (finding a new *mechanism* to achieve the same illicit end).

  **Why this fits:** It implies that the reform *worked* on the specific target (the gifts stopped, the exams happened), but failed on the *objective* (reducing favoritism).

  ### 2. The Mechanism: "Decoupling"

  To explain *why* the metrics look good while the reality stays bad, you want **Decoupling** (from institutional sociology, specifically Meyer & Rowan, 1977).

  Decoupling occurs when an organization's formal structures (policies, minutes, ledgers) separate from its actual work practices. The hospital *decouples* its gift ledger from its hiring practices. The ministry *decouples* its exam scores from its staffing needs.

  **Why this fits:** It explains the invisibility. The metrics measure the formal structure. The corruption lives in the informal practice. Because they are decoupled, the metrics can show "success" (clean ledger) while the practice shows "status quo" (relatives hired).

  ### 3. The Distinction: The "Carve"

  You asked how to distinguish this from genuine reduction, cosmetic reform, or standard avoidance. Here is the boundary logic:

  **A. Displacement vs. Genuine Reduction**
  *   **The Test:** Look for *substitution*, not just *cessation*.
  *   **Genuine Reduction:** The volume of favors drops. The cousin doesn't get the contract *and* no one else gets it via a back channel. The "pressure" in the balloon actually leaks out.
  *   **Displacement:** The volume is conserved. You see a spike in the *adjacent* unregulated category. (e.g., Gifts down 100%, Consultant Contracts up 300%).
  *   **The Boundary:** If the new channel is *more efficient* or *more transparent* than the old one (e.g., gifts stop, and contracts go to open tender), that is **Successful Reform**, not displacement. Displacement requires the *pathology* to persist. If the behavior moves to a cleaner channel, the balloon has been deflated, not just squeezed.

  **B. Displacement vs. Cosmetic Reform**
  *   **The Test:** Intent and Implementation.
  *   **Cosmetic Reform:** The rule was never enforced. The gifts stay on the ledger but are labeled "office supplies." The meeting minutes are faked.
  *   **Displacement:** The rule *is* enforced. The gifts *are* actually banned. The exams *are* actually taken. The system adapts *around* a real constraint, not a fake one.
  *   **The Boundary:** Displacement requires the reform to be *real enough to hurt*. If the rule is toothless, it's just theater. If the rule has teeth but the organism grows armor elsewhere, it's displacement.

  **C. Displacement vs. Standard Avoidance**
  *   **The Test:** Illicit vs. Licit.
  *   **Avoidance:** Using legal loopholes to minimize tax. This is rational optimization within the rules.
  *   **Displacement:** Moving illicit behavior into a grey zone. The "consultant" contract for the relative is often a breach of spirit, if not the specific letter of the new gift ban.
  *   **The Boundary:** Avoidance stays within the regulatory perimeter. Displacement jumps the perimeter to unregulated ground.

  ### 4. The Epistemological Problem: Can you prove it?

  You asked: *"If the target is unobservable and the proxy improves, is there any principled way to say whether the balloon was squeezed or deflated?"*

  The honest answer is: **No single metric can do it.** This is the **Identification Problem** in corruption studies.

  If you only measure the pipe you closed, you are mathematically incapable of knowing if the water moved. To claim displacement, you must triangulate:

  1.  **Process Metrics + Outcome Metrics:** Don't just measure "Was the exam taken?" (Process). Measure "Who got the job and what is their qualification delta?" (Outcome). If the exam scores go up but the hire quality goes down (or nepotism connections go up), you have evidence of displacement.
  2.  **Adjacent Channel Monitoring:** You must measure the *substitute*. If you ban gifts, you must audit consultancy contracts. If you don't measure the adjacent channel, you cannot claim success, only compliance.
  3.  **Qualitative Triangulation:** This is where journalism beats econometrics. Whistleblowers, leaked chats, and ethnographic observation are the only ways to see the "corridor deal" that the minutes miss.

  ### Recommendation for Print

  Since you want to use this in print without a footnote, I recommend coining a phrase that bridges the academic and the vivid.

  **Option 1 (The Vivid Metaphor):**
  > "This is the **Balloon Effect** of anti-corruption: squeeze the visible channel, and the favoritism bulges into the unmeasured one."

  **Option 2 (The Precise Carve):**
  > "This isn't just compliance; it's **tactical displacement**. The reform successfully closed the door, so the favor walked through the window. The ledger is clean, but the decision was made in the corridor."

  **Option 3 (The Sociological Term):**
  > "We are seeing **decoupling**. The formal rules have improved, but they have detached from the informal practices. The minutes record a decision; the handshake made it."

  **My advice:** Use **"The Balloon Effect"** for the headline concept (readers grasp it instantly), but use the logic of **Decoupling** to explain *why* the metrics lie.

  **On the "Underdetermined" worry:**
  You can write this honestly.
  > "The paradox of anti-corruption metrics is that success looks identical to displacement. In both cases, the forbidden act disappears from the ledger. The only difference is whether it also disappeared from the world. Without measuring the unmeasurable—the corridor deal, the unwritten rule—a clean ledger proves only that the bookkeeping has improved, not the governance."

  This acknowledges the limit of the data while validating your reporting instinct that the story is about the *migration* of the behavior, not its disappearance.
