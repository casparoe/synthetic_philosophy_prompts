prompt: |-
  Hi there. I'm a journalist — I mostly cover science and ideas, but I've spent the last year or so doing a run of peices on anti-corruption, and I keep stumbling into the same shape of story and I don't have a word for it, which is becoming a problem because I'd like to use the word in print without a footnote saying "sort of like Goodhart's law."

  Three instances. A city hospital bans staff from accepting gifts from suppliers: within a year the gifts are gone from the ledger, and the doctors' relatives have started turning up as paid "consultants" to the same suppliers. A country introduces competitive exams for government hiring to kill off patronage: applications and test scores go up and up, and the ministries respond by moving work onto short-term consultancy contracts that never go through the exam. A transparency rule requires that allocative decisions be justified in an open meeting: the meetings get beautifully documented, and the real decision now gets made in the corridor beforehand, so the minutes record a ratification nobody disagreed with.

  The pattern I think I'm seeing: the reform targets a channel, the favouritism doesn't shrink so much as relocate — and it relocates to a channel nobody was previously measuring, which is exactly why the reform looks like it worked on every indicator anyone collects. So there are two things tangled together, the displacement itself and the fact that the displacement is invisible to the very metrics that were supposed to certify success.

  Is there an established concept or literature for this? I've heard corruption described as being like water, finding whatever crack is open, and I know about measures becoming targets when they're used for decisions, but neither seems to be quite it: the first is a metaphor rather than a claim with edges, and the second is about people gaming a number, whereas here the underlying thing — who actually gets the job, the contract, the bed — may not have improved at all while nobody is gaming anything. There's also ordinary circumvention: every tax code breeds avoidance, and I don't want a term so broad it covers that too.

  If there's no name, I'd rather have a good carve than a label. What exactly is this, and what isn't it? I want to know how to tell it apart from genuine reduction that just leaves messy residue, from a reform that was cosmetic from day one, and from the sort of adaptive rule-dodging that any prohibition produces. And I'd want the boundary cases sorted: does it count when the new channel leaves people better off than the old one did (a gift ban that pushes procurement toward open tendering is different from one that pushes it toward cousins), or does the concept only apply when the substance is unchanged and only the surface has been cleaned? Also, a practical worry for the piece: if the target is unobservable and the proxy improves, is there any principled way to say whether the balloon was squeezed or deflated, or is that just permanently underdetermined?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **User:** Journalist covering science, ideas, and recently anti-corruption.
      *   **Problem:** Needs a specific term or concept for a recurring pattern in anti-corruption reforms.
      *   **The Pattern:** Reform targets a specific channel of corruption/favoritism $\rightarrow$ The visible metric improves (gifts disappear, exam scores rise, minutes look clean) $\rightarrow$ The underlying behavior (favoritism/corruption) displaces to an unmeasured/unregulated channel (consultants for relatives, short-term contracts, corridor deals).
      *   **Key Distinctions:**
          *   Not just Goodhart's Law (metrics becoming targets), though related. The user feels Goodhart's implies gaming the *number*, whereas here the *substance* moves elsewhere.
          *   Not just "water finding cracks" (too metaphorical).
          *   Not just general circumvention/avoidance (too broad).
          *   Needs to distinguish from genuine reduction with residue, cosmetic reform, or standard adaptive dodging.
          *   Needs to address the "unobservable target" problem (how to know if it's displacement vs. reduction).
      *   **Goal:** A specific term/concept for print, or a precise conceptual "carve" if no term exists.

  2.  **Initial Brainstorming & Candidate Concepts:**
      *   *Goodhart's Law:* User already rejected this, but it's the closest common cousin. Specifically, "Lucas Critique" or "Campbell's Law" are variants.
      *   *Hydra Effect:* Cutting off one head grows two more. Often used in counter-terrorism or drug wars. Fits the "displacement" aspect well.
      *   *Displacement Theory:* Criminology term (crime displacement). Spatial, temporal, tactical, target, functional.
      *   *Moral Hazard:* No, that's about risk-taking when insulated from consequences.
      *   *Perverse Incentive:* Too broad.
      *   *Substitution Effect:* Economic term. Accurate but dry.
      *   *Regulatory Capture:* No, that's about the regulator serving the industry.
      *   *Decoupling:* Institutional theory (policy vs. practice).
      *   *Isomorphism:* Organizations looking alike but acting differently.
      *   *Symbolic Compliance / Ceremonial Conformity:* Meyer & Rowan. This fits the "minutes look clean" example perfectly.
      *   *Loophole Exploitation:* Too legalistic.
      *   *Balloon Effect:* Squeeze one side, it bulges another. Very common in drug interdiction literature.
      *   *Functional Equivalence:* The system finds a new way to achieve the same latent function.

  3.  **Evaluating the Best Fits:**

      *   **The Balloon Effect:** This is the strongest metaphor. It's used in narcotics (eradicate crops here, they grow there) and counter-terrorism. It captures the *conservation of volume* (corruption doesn't decrease, just moves).
      *   **Crime Displacement (Criminology):** Specifically *Tactical Displacement*. This is the academic term. It distinguishes between *diffusion of benefits* (good spillover) and *displacement* (bad spillover).
      *   **Decoupling (Institutional Sociology):** Meyer & Rowan (1977). This addresses the gap between formal structure (the rules/minutes) and actual work (the corridor deals). It explains *why* the metrics look good (legitimacy) while practice stays the same.
      *   **The Cobra Effect:** Perverse incentive where the solution makes the problem worse. Not quite right; the problem isn't necessarily *worse*, just hidden.
      *   **Surrogate Goals / Proxy Failure:** Close to Goodhart's.

  4.  **Synthesizing the Answer:**

      *   **Acknowledge the Insight:** Validate that this is a sharp observation. It *is* distinct from standard Goodhart's Law.
      *   **Primary Term:** **The Balloon Effect**. It's journalistic, vivid, and widely understood in policy circles (drugs, terror, now corruption). It captures the "conservation of mass" aspect.
      *   **Academic Term:** **Tactical Displacement** (from Situational Crime Prevention). This gives the "edges" the user wants. It distinguishes from *Spatial* or *Temporal* displacement.
      *   **Institutional Term:** **Decoupling** (or **Ceremonial Conformity**). This explains the *measurement* problem. The formal structure decouples from the informal practice.
      *   **Distinguishing the Boundaries (The "Carve"):**
          *   *Vs. Genuine Reduction:* Look for "residue" vs. "migration." If the total volume of favors drops, it's reduction. If the *type* changes but volume stays constant, it's displacement.
          *   *Vs. Cosmetic Reform:* Cosmetic means the rule was never intended to work. Displacement implies the rule *did* work on the specific target, but the system adapted.
          *   *Vs. Standard Avoidance:* Avoidance is legal optimization. This is illicit behavior finding a new illicit (or unregulated) channel.
      *   **The Measurement Problem:** This is the hardest part. If the target is unobservable, how do we know?
          *   *Triangulation:* Use qualitative data (whistleblowers, ethnography) alongside quantitative metrics.
          *   *Leading Indicators:* Look for spikes in the *new* channel (e.g., surge in consultancy contracts).
          *   *Outcome vs. Process:* Measure the *outcome* (who got the job?) not the *process* (was the exam taken?).
      *   **Nuance on "Better Off":** If the new channel is more efficient/less corrupt (e.g., open tendering), it's successful reform, not displacement. Displacement implies the *pathology* persists.

  5.  **Refining the Terminology for a Journalist:**
      *   "Goodhart's Law" is too famous to ignore, but the user is right that it's not quite it. Goodhart is "when a measure becomes a target, it ceases to be a good measure." This is "when a channel becomes a target, the flow ceases to use that channel."
      *   Suggestion: **"Corruption Displacement"** or **"The Balloon Effect."**
      *   There is a specific paper/concept in anti-corruption literature: **"The Hydra Effect"** or **"Displacement of Corruption."**
      *   Wait, there's a specific concept by **Bo Rothstein** or **Alina Mungiu-Pippidi**? They write about quality of government.
      *   Actually, **Evasion vs. Displacement**.
      *   Let's stick with **Displacement** (Criminology) + **Decoupling** (Sociology) + **Balloon Effect** (Policy).

  6.  **Addressing the "Underdetermined" Worry:**
      *   The user asks: "Is there any principled way to say whether the balloon was squeezed or deflated?"
      *   Answer: No single metric can do it. You need *systemic* metrics. If you only measure the pipe you closed, you can't know. You must measure the *ecosystem*.
      *   This is the "Measurement of Corruption" problem (subjective vs. objective).

  7.  **Drafting the Response:**
      *   *Tone:* Professional, peer-to-peer (journalist to journalist/researcher), precise.
      *   *Structure:*
          1.  Validate the observation (It's real, it's distinct).
          2.  Offer the best existing terms (Balloon Effect, Tactical Displacement, Decoupling).
          3.  Provide the "Carve" (Boundaries).
          4.  Address the Measurement/Epistemological problem.
          5.  Suggest a phrasing for the article.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Correction:* Make sure not to conflate "Decoupling" with "Displacement." Decoupling is the *state* (rules $\neq$ practice). Displacement is the *mechanism* (move from A to B). They work together here.
      *   *Refinement:* The user mentioned Goodhart's. I should explain *why* their intuition is right. Goodhart's is about the *metric* breaking. This is about the *behavior* migrating. It's closer to the **Lucas Critique** in economics (policy changes change the structural parameters of the model), but that's too technical. Stick with **Displacement**.
      *   *Key Insight:* The user's examples show *functional substitution*. The function (favoritism) remains, the form changes.
      *   *Term:* **"Functional Displacement"**? No, **Tactical Displacement** is the criminology standard.
      *   *Term:* **"Compliance without Change"**?
      *   *Best Bet:* **The Balloon Effect** is the most journalistic. **Tactical Displacement** is the most academic. **Decoupling** explains the invisibility.

  9.  **Final Polish:** Check the boundary cases.
      *   *Better off?* If the new channel is cleaner, it's *reform success*, not displacement of pathology.
      *   *Underdetermined?* Yes, fundamentally. Acknowledge this honesty. It requires investigative journalism (the user's job) to solve, not metrics.

  10. (Final check of the prompt requirements): "If there's no name, I'd rather have a good carve than a label." -> I will provide both. "What exactly is this, and what isn't it?" -> I will define the boundaries. "Practical worry... is there any principled way?" -> I will address the epistemological limit.

