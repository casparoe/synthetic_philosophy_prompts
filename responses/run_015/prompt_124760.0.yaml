      *   **Condition for Cooperation:** Cooperation requires "opacity" (one player's reasoning is not transparent to the other). This violates the game's information structure (perfect information).
      *   **Critique of Standard Fixes:** Trembling-hand perfection and Level-k theory don't solve the problem; they just hide the opacity assumption elsewhere (error structures, belief hierarchies). If CKR (or Common Knowledge of Boundedness) is restored, BI collapses cooperation.
      *   **Request:**
          1.  Defeaters sorted by decisiveness (Formal, Empirical, Conceptual).
          2.  Assessment of unfalsifiability (Is explaining all cooperation as "opacity" a bug or a feature?).

  2.  **Deconstruct the Argument:**
