          *   **Renormalization/Imprecise Priors:** If priors aren't common knowledge, BI fails. But is that "opacity of reasoning"?
          *   **Stochastic Choice Models:** Quantal Response Equilibrium (QRE). This introduces noise structurally. The user dismisses trembling-hand, but QRE is a bit different (equilibrium concept vs. refinement).
          *   **Epistemic Game Theory (Aumann vs. Stalnaker):** Aumann says CKR + Common Prior -> BI. Stalnaker argues that belief revision policies matter. If players update beliefs differently upon seeing a deviation, BI might not hold *even with CKR*. This attacks the "structural feature" claim.

      *   *Empirical Patterns:*
          *   **McKelvey & Palfrey (1992):** Experimental data shows significant cooperation. The user calls this "noise." But if the pattern is systematic (e.g., cooperation increases with game length up to a point, or depends on stake size), "noise" is a weak explanation.
          *   **Training/Expertise:** Do game theorists play BI more? (Palacios-Huerta & Volij). If experts play BI and novices don't, it supports CKR. If experts *also* cooperate, it undermines the "CKR entails BI" claim. (Actually, evidence is mixed, but some studies show experts defect earlier).
