      *   They are claiming that *any* deviation from BI implies a failure of Common Knowledge of Rationality (or the specific epistemic conditions required for BI).
      *   They view "opacity" as the negation of the transparency required for CKR.

  3.  **Brainstorming Defeaters (Counter-arguments):**

