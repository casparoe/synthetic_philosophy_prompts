answer: |-
  First off, you held your own remarkably well for a post-drinks argument against a PhD student. Your intuitions are actually tracking a very specific, well-established debate in contemporary metaphysics, even if you don't have the jargon for it yet.

  To give you the short answer: **You are right to feel that he moved the goalpost.** He is conflating "defeating one argument for incompatibilism" with "proving compatibilism."

  Here is the breakdown of where he's right, where he's overreaching, and what that "thin distinction" actually is.

  ### 1. Did killing PAP settle the debate?
  **Verdict: No. He moved the goalpost.**

  The Principle of Alternative Possibilities (PAP) says: *You are only responsible if you could have done otherwise.*
  Frankfurt cases are designed to show that you can be responsible even if you *couldn't* have done otherwise.

  Your roommate is correct that if Frankfurt cases work, PAP is false. **However**, he is incorrect that this means "compatibilism wins by default."

  There are two main types of incompatibilists (people who think free will and determinism don't mix):
  1.  **Leeway Incompatibilists:** They believe free will requires alternative possibilities (PAP). Frankfurt cases hurt this group.
  2.  **Source Incompatibilists:** They believe free will requires that *you* are the ultimate source of your action, regardless of whether you had other options.

  Your intuition ("what I really care about is that the actual causal history of my action not be deterministic") is the exact definition of **Source Incompatibilism**.

  When your roommate says you are just "smuggling PAP back in," he is making a common but controversial move. He is assuming that the *only* reason we care about determinism is that it removes alternatives. But Source Incompatibilists argue that determinism is a problem even if you have alternatives, because if determinism is true, your actions are ultimately caused by things that happened before you were born (the Big Bang + laws of physics).

  So, killing PAP kills the *Leeway* argument, but it leaves the *Source* argument untouched. Declaring the debate "settled" ignores half the battlefield.

  ### 2. Does "Lazy Black" fix the holes?
  **Verdict: It patches one hole, but opens another.**

  The standard objection to Frankfurt cases is the "Flicker of Freedom" strategy. In the original setup, Black has to monitor your brain to know when to intervene. Incompatibilists argue: "Aha! There is a moment before you decide where you *could* have shown a sign of voting Republican, which would have triggered Black. That tiny moment is an alternative possibility!"

  Your roommate's "Lazy Black" (quantum coin, no monitoring) tries to remove that "flicker." Since the coin flip is random and external, there is no prior sign in your brain for Black to monitor.

  **Why this is clever:** It blocks the "Flicker" objection. There is literally no point where you could have done anything to trigger Black.

  **Why it doesn't settle the debate:**
  1.  **The Disposition Problem:** Even if Black *doesn't* intervene, the fact that he *was ready to* might be enough to undermine your responsibility. Some philosophers argue that the mere presence of the constraint matters, not just its activation.
  2.  **The Indeterminism Twist:** Your roommate used a *quantum coin*. That means the scenario is **indeterministic**. But the free will debate is usually about whether we have freedom *if determinism is true*. By making the setup random, he has created a case where you are responsible in an *indeterministic* world without alternatives. That's interesting, but it doesn't prove we are responsible in a *deterministic* world (which is what compatibilism claims).
  3.  **The "Zap" Intuition:** If the coin had come up heads, you would have been zapped. If it came up tails, you weren't. But in both cases, the *setup* ensures the outcome. Source Incompatibilists will argue that in the "tails" world, you still didn't truly originate the action because the *guarantee* of the outcome was external to you.

  So, "Lazy Black" is a stronger Frankfurt case, but it doesn't force an incompatibilist to surrender. It just forces them to clarify that they care about *causal history*, not just *interventions*.

  ### 3. Is the distinction between "I did it" and "I was zapped" too thin?
  **Verdict: No. This is the core of the debate.**

  Your roommate dismissed the difference between "voting on your own" and "being zapped" as too thin to matter. This is where his ML background might be tripping him up. In machine learning, if the output is the same, the policy is often treated as equivalent. In metaphysics, **how** the output was generated is the only thing that matters.

  Here is the distinction you were grasping for:

  *   **The Compatibilist View:** Freedom is about the relationship between your desires and your actions. If you voted Democratic because you wanted to, and nothing stopped you, you are free. It doesn't matter if Black *would have* forced you; he *didn't*. The actual sequence of events is what counts.
  *   **The Source Incompatibilist View:** Freedom is about *origination*. If determinism is true (or if Black is lurking), the ultimate cause of your vote lies outside of you (in the past laws or in Black's device). Even if you weren't "zapped," you are more like a sophisticated clockwork mechanism than an author.

  When he says you are "begging the question," he means you are assuming determinism undermines freedom without proving it. But you aren't begging the question; you are appealing to a different **condition** for freedom.

  *   **PAP Condition:** Could I have done otherwise? (Frankfurt kills this).
  *   **Source Condition:** Did this action originate in me? (Frankfurt does *not* kill this).

  In the "Lazy Black" case, if the coin comes up tails and you vote on your own, the Compatibilist says: "You are responsible!" The Source Incompatibilist says: "Wait. If the coin had landed heads, you wouldn't have been responsible. The fact that your responsibility hinges on a coin flip suggests you aren't the *ultimate* source of the action in a robust enough way."

  ### Summary: Who moved the goalpost?

  **He did.**

  1.  **On PAP:** He correctly noted that Frankfurt cases threaten PAP. But he incorrectly claimed that defeating PAP defeats *all* incompatibilist arguments. You correctly identified that the "causal history" (Source) matters independently of alternatives.
  2.  **On Lazy Black:** He proposed a technically stronger version of the case, but he treated it as a "checkmate." It's not. It shifts the debate from "alternatives" to "dispositions" and "causal history," which is exactly where you wanted to go.
  3.  **On the "Thin Distinction":** He minimized the most important intuition in the free will debate. The difference between "acting from your own nature" and "acting because the universe guaranteed it" is not thin; it's the whole ballgame.

  **How to talk to him about it tomorrow:**
  Tell him you looked up **"Source Incompatibilism"** (specifically the work of Derk Pereboom or Galen Strawson). Tell him you agree PAP is probably dead, but that Frankfurt cases don't address the **"Ultimacy Condition."**

  You can say: *"You're treating free will like a function output. I'm treating it like authorship. Even if I couldn't have written a different chapter, if the plot was determined by a coin flip or the Big Bang, I'm not the author. Frankfurt cases show I don't need alternatives to be responsible, but they don't show I don't need to be the Source."*

  That should sober up the argument pretty quickly.
