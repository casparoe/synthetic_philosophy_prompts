answer: |-
  Your hypothesis is sharper than most professional commentary on this topic. You have correctly identified that the stalemate is not primarily about physics data (since there is none), but about **meta-scientific priors**.

  Here is the diagnosis: This is a **substantive disagreement about epistemology**, specifically regarding how to perform Bayesian updates in the absence of empirical data. It is not merely verbal, nor is it simply two different questions conflated (though that happens). It is a conflict over the **topology of theory space**.

  Here is the breakdown of why the debate is stuck, why your intuition about "crowdedness" is the key, and what would actually constitute progress.

  ### 1. The Core Disagreement: The "No Alternatives" Argument (NAA)
  You noted that one side points to "facts about the research community." In philosophy of physics, this is formalized as the **No Alternatives Argument (NAA)**, most notably by Richard Dawid.

  The structure of the argument is Bayesian:
  1.  **Hypothesis ($H$):** String Theory is the correct description of nature.
  2.  **Observation ($E$):** Despite decades of effort by smart people, no viable alternative has been found.
  3.  **Update:** We should increase our credence in $H$.

  For this update to work, you need a likelihood ratio: $P(E | H) / P(E | \neg H)$.
  *   **$P(E | H)$:** If String Theory is true, it is hard to find alternatives. (High probability).
  *   **$P(E | \neg H)$:** If String Theory is *false*, what is the probability that we still wouldn't have found an alternative?

  **This is where your "crowdedness" intuition hits the nail on the head.**
  *   **The String Theorist's Prior:** Theory space is constrained. If a consistent theory of quantum gravity exists, it is a "narrow peak" in the optimization landscape. We have searched the local area thoroughly. If we haven't found another peak, it's because there isn't one. Therefore, $P(E | \neg H)$ is low.
  *   **The Critic's Prior:** Theory space is vast or poorly mapped. We are searching in the dark with limited tools (mathematical consistency, aesthetic beauty). The fact that we haven't found an alternative tells us more about our search algorithm than the terrain. Therefore, $P(E | \neg H)$ is high (or unknown).

  **Diagnosis:** The disagreement is substantive. It is a disagreement about the **completeness of the search** through logical/mathematical space. Since we cannot measure the size of "all possible consistent physical theories," this prior cannot be empirically settled. It is a philosophical axiom masquerading as a scientific inference.

  ### 2. The "Two Questions" Conflation
  You suspected people are answering "Is it true?" vs. "Is it worth working on?" interchangeably. You are right, and this slippage sustains the stalemate.

  *   **Pursuit Worthiness:** Almost everyone agrees string theory is *worth working on*. It has generated profound mathematics (mirror symmetry, AdS/CFT) that is useful even if the physics is wrong.
  *   **Credence (Truth):** This is where the fight is.

  Defenders often retreat to "pursuit worthiness" when cornered on falsifiability ("It's the only game in town, so we must play it"). Critics attack "credence" ("It's not science if you can't test it"). Because "pursuit worthiness" is easier to defend than "credence," the debate often feels like people talking past each other. One side is arguing for funding/jobs (pragmatic), the other for truth conditions (epistemic).

  ### 3. The Landscape Problem: The Likelihood Function Breaks
  You noted the observation that "things just fall out" vs. "it's too loose." This is the **Landscape Problem**.

  Early string theory hoped to predict *the* Standard Model uniquely. If it did, $P(Data | Theory)$ would be high, and finding the Standard Model would be strong evidence.
  However, it turned out string theory allows for $\sim 10^{500}$ vacuum states (the "Landscape").
  *   **The Critic's View:** If a theory can accommodate almost any observation, its likelihood function is flat. $P(Data | Theory) \approx P(Data)$. It gains no Bayesian evidence from matching reality because it matches *everything*.
  *   **The Defender's View:** We use anthropic selection or statistical predictions within the landscape.

  **Diagnosis:** This turns the NAA on its head. If the theory allows $10^{500}$ universes, the "search space" for alternatives becomes irrelevant. The theory isn't a single point in theory space; it's a cloud that covers most of the observable territory. This makes the "No Alternatives" argument weaker, because the theory has become less specific, not more.

  ### 4. What Would Count as Progress?
  Given that direct empirical testing (colliders at Planck scale) is likely impossible for centuries, progress must come from one of three buckets.

  #### A. Formalizing the Priors (The Philosophical/Engineering Path)
  This matches your suggestion of "formalising the argument."
  Philosophers like Dawid have tried to formalize the NAA. Progress would look like a rigorous model of **Theory Space Topology**.
  *   **The Metric:** Can we define a measure on the space of consistent quantum field theories?
  *   **The Progress:** If we could mathematically prove that the space of consistent theories unifying gravity and QM is *small* (e.g., "There are only 5 mathematically consistent structures of this type"), the String Theorist's prior wins. If we prove the space is infinite or dense, the Critic wins.
  *   **Why it's hard:** We lack a definition of "possible physical theory" that isn't circular.

  #### B. A Mathematical "No-Go" (The Internal Consistency Path)
  This is the most likely source of near-term resolution.
  *   **The Scenario:** Someone proves that String Theory (or the specific version required to match our universe) contains an internal mathematical contradiction, or that it *cannot* reproduce a specific feature of the Standard Model (e.g., chirality, cosmological constant) without breaking its own core axioms.
  *   **The Result:** This kills the "No Alternatives" argument instantly. If the "only game in town" is shown to be broken, the search must reopen.
  *   **Current Status:** People look for this constantly. The "Swampland Program" is an attempt to map which low-energy theories *cannot* be completed into quantum gravity. If our universe ends up in the Swampland, String Theory is falsified mathematically.

  #### C. Changing the Question (The Lakatosian Path)
  Imre Lakatos proposed evaluating research programmes not by "true/false" but by "progressive/degenerating."
  *   **Progressive:** Predicts novel facts, expands mathematical toolkit, absorbs anomalies.
  *   **Degenerating:** Adds ad-hoc patches to survive, stops predicting new things.
  *   **The Progress:** If the community explicitly adopts this metric, the debate shifts. We stop asking "Is it true?" (which we can't answer) and ask "Is the programme still generating novel mathematical structures that map to *any* physical reality?"
  *   **Why it helps:** It acknowledges the "backend engineering" reality: sometimes you keep a legacy system running because it works, even if you suspect the architecture is flawed, until a migration path appears.

  ### Summary Diagnosis
  You are looking at a **Bayesian deadlock**.
  *   **Side A** believes the search space of mathematical structures is sparse, so failing to find an alternative is strong evidence ($P(E|\neg H)$ is low).
  *   **Side B** believes the search space is vast/unknown, so failing to find an alternative is null evidence ($P(E|\neg H)$ is unknown/high).

  Neither side can move because they are arguing about the **properties of a space they cannot measure**.

  **Recommendation:**
  If you want to follow this hobby without frustration, treat String Theory not as a candidate for "The Truth" but as a **toolkit for Quantum Field Theory**. The AdS/CFT correspondence (holographic principle) is useful for understanding nuclear plasmas and condensed matter systems regardless of whether strings are the fundamental building blocks of the universe.

  The "Truth" question is currently philosophically blocked. The "Utility" question is where the actual engineering is happening. The stalemate will only break if a mathematical inconsistency is found (killing the theory) or a low-energy signature is identified (validating the landscape). Until then, your hypothesis is correct: it is a disagreement about priors on the complexity of reality, disguised as physics.
