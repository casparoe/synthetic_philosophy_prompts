answer: |-
  Hey. I hear you, and I want to start by saying that what happened with your brother is the exact center of this problem. The distinction that matters most for your ten-minute window is not between paternalism and liberty, but between manipulation and assistance. In the literature, we obsess over whether a choice is free, but in your hallway, the real metric is whether the patient would endorse the nudge if they knew about it. You need to drop distinctions about whether something is a nudge versus a shove, or precise calculations of welfare gains. Those require data you do not have. What must survive into your checklist are three things: reversibility, transparency, and whose ends are being served. If a patient cannot easily undo the choice, it is not a nudge, it is a constraint. If the nudge only works because the patient is ignorant of it, it is manipulation. And if the goal is clinic convenience rather than patient health, you are using them as a means to an end. Keep those three. Drop everything else.

  Here is the procedure you can run in ten minutes. 1. Ask whether the default serves a goal the patient has explicitly or implicitly endorsed, such as staying healthy or saving money, rather than a goal solely for the clinic, such as reducing administrative call time. 2. Ask whether the patient can reverse the decision with less effort than it took to accept it, meaning an opt-out that is one click or one sentence, not a phone tree. 3. Ask the sunlight question: if you put a sign on the wall explaining exactly how this default works, would it still work, and would patients be glad you did it? 4. If the patient lacks capacity or has fluctuating judgment, ask the surrogate question: is this what they would have wanted when well, or is this just what is easiest for us? If you cannot answer the first question with evidence, or if the answer to the third is that the nudge relies on secrecy, you stop. That is a hard no. If the disagreement is about whether health is more important than autonomy, that is a value conflict you cannot solve with data, and you must hand it to a human committee or escalate it, because that is not an operations call.

  Now let us run this on your three cases. First, booking the follow-up before the patient leaves. This passes. The goal is continuity of care, which almost every patient endorses even if they hate waiting rooms. The opt-out is immediate; they can say no at the desk or call later. If you put a sign up saying we book everyone to keep them well, most would be glad because forgetting is easy when you are sick. This is like your brother's Sunday call; it is a scaffold they can lean on. Second, preselecting the generic in the prescribing dropdown. This also passes. The goal is saving money and ensuring adherence, which aligns with Medicaid patients' financial interests. The doctor can change it with a click, so reversibility is high. The sunlight test works; if patients knew we default to cheaper drugs to save them cash, they would trust us more. This is defensible because it tracks their ends, not yours.

  Third is the no-show text, and this is where I am going to argue with you. I know it cut no-shows by a third, and I know you are proud of it, but this procedure says you should stop sending it. The text says you have held a slot for them personally. That is factually false; you have held a slot for anyone who will show up. This fails the sunlight test because the nudge relies on the patient believing a specific social obligation exists that does not. For a population that has been lied to by systems before, discovering this is a script erodes trust faster than the appointment saves health. It works only while they are ignorant. If you put a sign up saying we pretend to care personally to guilt you into showing, the effect vanishes. Furthermore, whose ends are being tracked? Reducing no-shows helps the clinic's revenue and scheduling, but does it help the patient? Maybe, but the mechanism is guilt, not care. You mentioned your brother was furious not about the outcome but about the deceit. This text is the same structure. It treats the patient as a variable to be manipulated rather than a partner to be engaged. You can get the same result with a text that says reminders are automated to help you remember, please reply NO if you cannot come. It is less punchy, but it survives disclosure.

  I need to be honest about where this procedure will misfire for you. It cannot solve the problem of fluctuating capacity fully. Your brother's case shows that sometimes people need protection from themselves, but they also need to feel like authors of their lives. The procedure tells you to ask what they would have wanted, but in a ten-minute review, you will not know that. You will have to guess, and sometimes you will guess wrong. Also, for your specific population, the transparency test is harder. If people expect the system to be hostile, even honest defaults might be viewed with suspicion. The procedure assumes good faith on both sides, but trust is a stock you are drawing down. There will be cases where the procedure says stop, but your gut says the health risk is too high to wait for perfect consent. In those moments, the procedure won't save you. You will have to decide, and you will have to own the paternalism. But if you use this filter, you will ensure that when you do decide for them, you are doing it for their ends, with an open door back out, and without lies. That is the best you can do in ten minutes.
