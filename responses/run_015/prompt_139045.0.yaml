answer: |-
  The thesis survives, but only if you immediately concede to the Type Theorist that you are talking specifically about `Classical.choice` (Prop-to-Type) and not the constructive Sigma-projection, because otherwise they will correct you on live mic and the room will assume you don't understand the tool you're critiquing.

  ### Opening Concessions (First 2 Minutes)
  1.  **To the Type Theorist:** Acknowledge that in dependent type theory, the principle $(\forall x, \exists y, P x y) \to (\exists f, \forall x, P x (f x))$ is often derivable from Sigma types. Clarify explicitly that your "Tier 3" refers specifically to opaque axioms like `Classical.choice` that bridge `Prop` to `Type`, not constructive witnesses.
  2.  **To the Constructivist:** Admit you are not arguing for constructivism. You are arguing for *safety* for those who already use classical logic. You are trying to make classical extraction less dangerous, not claiming it is pure.
  3.  **To the Room:** Admit the Tier boundaries are fuzzy. Refactoring moves code between tiers. That's why you need the linter in CI, not just a one-time check.

  ### The Single Reply That Must Land
  When asked why "swap-invariance" matters more than "truth":
  *"Because in engineering, 'truth' is a static property of a model, but 'correctness' is a dynamic property of a system. If my controller behaves differently when I swap the underlying choice function, I have a hidden dependency on an unspecified value. That's not philosophy; that's a bug waiting for a code review. I'm not asking if Choice is true; I'm asking if my code depends on which Choice I got."*

  ### The Question You Hope Nobody Asks
  *"Is swap-invariance decidable? Can your script actually prove a function is swap-invariant, or does it just flag potential risks?"*
  (Truth: It's undecidable in the general case, equivalent to checking observational equivalence. Your script is a linter, not a prover. If pressed, admit it's a heuristic for human review.)

  ### Q&A Prep Sheet: 8 Objections by Damage

  **1. The Type Theorist (Highest Credibility Damage)**
  *   **Who:** The person who reads the metatheory.
  *   **Phrasing:** "In Lean, the axiom of choice is often just a projection from a Sigma type. You're treating it like ZFC set theory where it's an independent axiom. Aren't you solving a problem that doesn't exist in this framework?"
  *   **Reply:** "You're right that constructive choice from Sigma types is free—that's my Tier 2. My concern is specifically `Classical.choice`, where we move from `Prop` (we know it exists) to `Type` (here is the value) without a constructor. That opacity is where the computational risk lives. I'm not fighting Sigma projections; I'm fighting opaque axioms that look like functions but aren't."
  *   **Weakness:** If you haven't explicitly distinguished `Prop` vs `Type` in your slides, this looks like a save. You must be precise about `Sort 0` vs `Sort 1`.

  **2. The Philosopher (Highest Thesis Damage)**
  *   **Who:** The philosopher of mathematics.
  *   **Phrasing:** "Swap-invariance requires testing against all possible choice functions. That's an infinite set. You can't test it. So your criterion is unverifiable, which makes it useless for guaranteeing correctness."
  *   **Reply:** "I'm not suggesting exhaustive testing like a golden test. I'm suggesting parametricity. If my code type-checks without inspecting the identity of the choice function—if it treats the choice as an abstract interface—then it's swap-invariant by construction. We use the type system to prove invariance, not runtime tests."
  *   **Weakness:** This relies on the type system enforcing abstraction perfectly. If your language allows casting or reflection that breaks abstraction, the guarantee holes.

  **3. The Math Formalizer (Highest Audience Alienation)**
  *   **Who:** The Lean user formalizing Hahn-Banach.
  *   **Phrasing:** "I use Choice to prove Hahn-Banach. I don't extract code. Are you saying my work is 'Tier 3 unsafe' and therefore inferior? You're dismissing half the library."
  *   **Reply:** "Not inferior, just different deployment zones. If you're proving theorems about existence, Tier 3 is fine. My claim is only that Tier 3 is unsafe for *extraction* to control systems or crypto. I'm trying to protect you from accidentally extracting a proof-lemma into a flight controller, not telling you to stop proving lemmas."
  *   **Weakness:** If your tooling flags their whole project as "unsafe" without distinguishing proof-vs-code targets, they will ignore your tool.

  **4. The Verification Engineer (Practical Feasibility)**
  *   **Who:** The engineer who needs code to run.
  *   **Phrasing:** "You say Tier 3 is fine if swap-invariant. How do I sign off on that for safety-critical code? DO-178C doesn't accept 'probably doesn't depend on the oracle'."
  *   **Reply:** "You don't use Tier 3 for safety-critical code. That's the point. This classification is a triage tool. If a module is Tier 3, it stays in the verification layer; it doesn't get compiled to C. We use the tiers to draw the boundary between what we prove and what we run."
  *   **Weakness:** It limits the utility of formalization. If you can't extract the heavy math, the value prop of "verified code" shrinks.

  **5. The Constructivist (Ideological Opposition)**
  *   **Who:** The person who thinks AC is a mistake.
  *   **Phrasing:** "You're trying to make classical logic safe for computation. The problem is classical logic itself. If you can't construct the witness, you shouldn't have a function. Your tiers just sanitize a sin."
  *   **Reply:** "I agree construction is better. But I'm a software engineer working in a world where classical libraries exist and are useful. I'd rather have a tool that warns me when classical logic leaks into my binary than pretend those libraries don't exist. This is harm reduction, not endorsement."
  *   **Weakness:** They will see this as pragmatic cowardice. It doesn't win them over, but it shouldn't lose them if you frame it as risk management.

  **6. The Refactorer (Tier Instability)**
  *   **Who:** A senior developer in the room.
  *   **Phrasing:** "You admit tiers are unstable. I refactor a proof today, and suddenly my Tier 1 lemma becomes Tier 3 because I need to inspect the witness tomorrow. Your classification rots."
  *   **Reply:** "Exactly. That's why this belongs in CI, not in a paper. Every PR gets scanned. If a refactor moves a lemma from Tier 1 to Tier 3, the build fails, and you decide intentionally: 'Do I need this computation?' It's a guardrail, not a permanent label."
  *   **Weakness:** Adds friction to development. If the linter is too noisy, people will disable it.

  **7. The Generalist (Changing the Subject)**
  *   **Who:** A mathematician with no CS background.
  *   **Phrasing:** "You've changed the question from 'Is Choice true?' to 'Does Choice compile?'. That's not philosophy, that's just engineering. You haven't solved the philosophical problem."
  *   **Reply:** "I'm not solving the philosophical problem. I'm dissolving it for my specific context. For a set theorist, truth matters. For me, behavior matters. I'm offering a translation layer so engineers don't have to settle debates they aren't equipped to fight."
  *   **Weakness:** The Philosopher will say this is anti-intellectual. You have to own being an engineer and not care.

  **8. The Banach-Tarski Fan (Distraction)**
  *   **Who:** Someone who loves the paradoxes.
  *   **Phrasing:** "Why refuse Banach-Tarski? It's the classic example of Choice gone wild. Ignoring it makes it look like you're hiding the weirdness."
  *   **Reply:** "Banach-Tarski is about measure theory and non-measurable sets. In code, we deal with finite structures or computable reals. Banach-Tarski doesn't compile. It's a distraction because it scares people about a paradox that never hits the binary. I'm worried about silent logic bugs, not volume doubling."
  *   **Weakness:** It looks like you're avoiding the hard examples. But for this room (proof engineering), you're right: BT doesn't extract. Stand firm.
