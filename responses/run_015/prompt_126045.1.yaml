answer: |-
  **Project Title:** The Shape of Contingency: Formal Strategies Against Teleological Narrative in Historical Fiction

  **The Research Question**
  Standard critiques of Whig history address explanatory bias: judging the past by present standards or assuming winners grasped what losers missed. However, for the novelist, the deeper constraint is not explanatory but formal. Plot structure (complication, crisis, resolution) inherently suggests telos. A novel can reject Whig *causality* while remaining Whig in *pacing*, selecting turning points that align with the known historical record.

  This project asks: **Does the manipulation of narrative closure and counterfactual weighting alter a reader's perception of historical inevitability in known-outcome fiction?**

  This question admits a determinate answer via reader response testing. If readers perceive the experimental text as equally urgent but less predetermined than the control text, the answer is yes. If they perceive it as confused, dull, or identical to the control, the answer is no.

  **The Gap in Current Positions**
  Two dominant positions leave this question unresolved. **The Historiographical Critique** focuses on moral judgment and causal selection but ignores that emplotment itself creates a sense of destination. **The Narratological Determinist** position argues that all selection implies significance, making any ending inherently Whiggish. This renders the question trivial (the answer is always "no") and ignores the practical spectrum of reader experience.

  A philosopher analyzes examples; a novelist constructs experiences. This project requires the latter. Only through the drafting of chapters and the measurement of reader duration, attention, and expectation can we determine if "anti-Whig" form is a viable aesthetic category or a theoretical impossibility.

  **Methodology and Devices**
  I will draft two versions of a key sequence (approx. 15,000 words) set during the months preceding a known franchise reform act. The characters are obscure (provincial printers, a bankrupt attorney), ensuring the historical settlement arrives offstage.

  1.  **Version A (Control):** Conventional emplotment. Scenes are selected for their causal link to the known outcome. The arc closes with the Act's passing.
  2.  **Version B (Experimental):** Utilizes three specific devices:
      *   **Dead Futures:** Full-weight scenes depicting outcomes that did not happen, treated with the same ontological status as the "real" timeline.
      *   **Offstage Settlement:** The famous Act is filtered strictly through the confusion of obscure characters, never granted a scene of its own.
      *   **Mid-Crisis Termination:** The narrative ends during the crisis, denying the resolution that validates the historical outcome.

  These versions will be distributed to a beta reading group (n=20) split between those familiar with the historical period and those who are not. They will be surveyed on their sense of "inevitability" regarding the plot's conclusion.

  **Month-by-Month Plan**
  *   **Month 1:** Draft Version A (Control). Focus on tight causal linking and traditional resolution.
  *   **Month 2:** Draft Version B (Experimental). Focus on integrating "Dead Future" interludes without breaking immersion.
  *   **Month 3:** Distribute texts to beta readers. Collect quantitative data (perceived inevitability scales) and qualitative feedback (confusion, engagement).
  *   **Month 4:** Analyze reader response. Identify which devices successfully disrupted teleology and which merely caused confusion.
  *   **Month 5:** Revise the main manuscript based on findings. Integrate successful devices into the full draft.
  *   **Month 6:** Draft a companion essay articulating the findings for a writer-historian audience.

  **Failure Conditions**
  This project will be deemed a failure if:
  1.  **Indistinguishability:** Readers cannot distinguish the experimental version's intent from the control, suggesting the text cannot override prior knowledge.
  2.  **Aesthetic Collapse:** The experimental version is universally rated as "dull" or "broken," suggesting anti-Whig form is aesthetically non-viable.
  3.  **Knowledge Dependence:** The difference in perception is entirely a function of the reader's prior historical knowledge rather than textual cues.

  In any failure scenario, I will abandon the experimental approach for the main manuscript and write a postscript explaining why traditional emplotment remains the only viable vessel for this history.

  ***

  ### Consultant's Assessment: Scope and Feasibility

  **Is this too big for six months?**
  Yes. Writing 30,000 words of high-quality fiction (two distinct versions), recruiting and managing a beta reading group, analyzing the data, *and* revising the main manuscript plus writing an essay is an excessive load for a single fellowship term. You are essentially proposing a creative writing MFA thesis plus a small academic study.

  **What should you cut?**
  Cut the **Beta Reader Study (Month 3 & 4)**.
  While "reader response" justifies why a novelist is doing this, formally testing it turns you into a social scientist. It requires ethics approval, recruitment time, and data analysis that will eat your writing time.

  **The Fix:**
  Replace the formal study with **Structured Workshop Feedback**.
  In Month 3, instead of a survey, submit the chapters to a small, trusted group of readers (3-5 people) with specific instructions on what to look for (e.g., "At what point did you feel the ending was inevitable?"). Rely on their qualitative feedback rather than quantitative data.

  **Why this works:**
  1.  It saves 6-8 weeks of administrative overhead.
  2.  It keeps the focus on *writing* and *craft*, which is what the fellowship is likely funding.
  3.  It allows you to spend Month 4 and 5 actually revising the *main novel*, which is the ultimate goal, rather than getting stuck in the analysis of the experiment.

  **Revised Month 3-5 Plan:**
  *   **Month 3:** Circulate excerpts to 3-5 trusted readers. specific questions on pacing and inevitability.
  *   **Month 4:** Synthesize feedback. Begin integrating successful techniques into the main manuscript.
  *   **Month 5:** Complete the revision of the novel's third act based on the experiment.
  *   **Month 6:** Write the companion essay/reflection.

  This keeps the intellectual rigor but ensures you leave the fellowship with a finished book, not just a report on why you couldn't finish it.
