      *   *Candidate:* (4) Automated Slaughter. If no human sees it, does the killing matter? But does hiding it corrupt us by making us ignorant of our own consumption?
      *   *Selection:* Let's make (3) Kestrel the "Unclear" one. It challenges the premise of suffering being the locus of the duty.
      *   *Selection for "Real Kant comes out where character doesn't want":* Beatrix probably wants to protect animals. Kant would endorse (4) Automated Slaughter and (5) Medical Testing enthusiastically, which might sound cold to a modern audience. He would *hate* (7) the Dignity Clause, which is likely the cornerstone of the new Act Beatrix supports. This creates the dramatic conflict. She has to admit the foundational clause is philosophically bankrupt *by her own expertise*, even if she supports it politically.

