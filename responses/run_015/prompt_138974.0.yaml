answer: |-
  **Starting Commitment:** There is something it is like to be an ordinary awake adult human, and whatever else is true, that depends on the physical goings-on in that person's brain.

  ***

  ### Node 1 (Derivation)
  **Given every microphysical truth and every truth about the intrinsic nature of the constituents, can the macroscopic experience be deduced a priori?**
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 5.

  ### Node 2 (Palette)
  **Do the fundamental constituents possess a phenomenal character, a non-phenomenal intrinsic character tied to the physical, or a base that is neither physical nor phenomenal?**
  *   **Phenomenal Character:** Go to Node 3.
  *   **Non-Phenomenal Intrinsic:** **Leaf: Panprotopsychism**.
  *   **Neither Physical nor Phenomenal:** **Leaf: Neutral Monism**.
      *   *(Empty Combination: If "Neither" is chosen at Node 2, Node 1 must be "No", because a non-physical base cannot be deduced from microphysical truths. This path is **Incoherent** given the framing of Node 1.)*

  ### Node 3 (Spoils)
  **Is the macroscopic subject identical to the constituents, a distinct entity generated by them, or a modification of a universal subject?**
  *   **Identical/Constituted:** Go to Node 4.
  *   **Distinct Entity:** **Leaf: Emergentist Panpsychism**.
  *   **Modification of Universal:** **Leaf: Cosmopsychism**.
      *   *(Empty Combination: "Distinct Entity" + Node 2 "Non-Phenomenal Intrinsic" is **Unexplored**; this would imply macro-phenomenality emerges from micro-non-phenomenality without a priori entailment, collapsing into Brute Emergentism.)*

  ### Node 4 (Count)
  **Does the living brain contain exactly one subject of experience, or many simultaneous subjects?**
  *   **One:** **Leaf: Constitutive Micropsychism (Summing)**.
  *   **Many:** **Leaf: Constitutive Micropsychism (Many)**.

  ### Node 5 (Static)
  **If causal interaction among constituents stops but arrangement holds, does experience persist?**
  *   **Yes:** **Leaf: Brute Macro-Emergentism**.
  *   **No:** Go to Node 6.
      *   *(Empty Combination: Node 1 "No" + Node 5 "Yes" + Node 2 "Phenomenal" is **Incoherent**; if micro-constituents are phenomenal, experience should persist in a static block unless dynamics are required for combination, which implies Node 3 "Distinct Entity".)*

  ### Node 6 (Grain)
  **The same brain described at the level of molecules, of cells, of neural assemblies, and of the whole organism — a subject at every level, at one level, or is the question ill-posed?**
  *   **At One Level:** **Leaf: Brute Macro-Emergentism (Dynamic)**. *(Merged with Static Yes for final count)*.
  *   **At Every Level:** *(Empty: **Unattractive**; implies panpsychism but denies a priori derivation).*
  *   **Ill-Posed:** **Leaf: Illusionism**.

  ***

  ### Leaf Annotations (Awkward Commitments)

  1.  **Panprotopsychism:** Must explain how non-phenomenal intrinsic properties generate phenomenal character without brute emergence.
  2.  **Neutral Monism:** Must explain how the "neither" base manifests as the specific physical structures we measure in labs.
  3.  **Emergentist Panpsychism:** Must posit a fundamental law of nature linking micro-experience to macro-subjects that is not metaphysically necessary.
  4.  **Cosmopsychism:** Must explain why the universal subject fragments into limited perspectives like ours without losing its unity.
  5.  **Constitutive Micropsychism (Summing):** Must solve the subject-summing problem (how many little subjects make one big subject).
  6.  **Constitutive Micropsychism (Many):** Must accept that "I" am merely one of thousands of subjects currently inhabiting this skull.
  7.  **Brute Macro-Emergentism:** Must accept that consciousness is a fundamental force of nature appearing only at complex scales, inexplicable by underlying parts.
  8.  **Illusionism:** Must assert that the starting commitment (that there is something it is like) is strictly false, despite appearing true.

  ### Indistinguishable Leaves
  *   **Panprotopsychism vs. Neutral Monism:** The tree separates them by whether the base is "tied to the physical" or "neither," but empirically these bases may look identical; the distinction is often merely terminological regarding the label of the intrinsic nature.
  *   **Constitutive Micropsychism (Summing) vs. (Many):** Without access to the first-person perspective of the constituents, no third-person test can distinguish one macro-subject from many micro-subjects perfectly aligned.

  ### Empty Combinations Note
  *   **Node 2 "Neither" + Node 1 "Yes":** Marked **Incoherent**. One cannot deduce experience a priori from physical truths if the base grounding those truths is not physical.
  *   **Node 3 "Distinct Entity" + Node 2 "Non-Phenomenal":** Marked **Unexplored**. This creates a hybrid where macro-experience is a new entity but micro-constituents lack phenomenality; most philosophers here slide into Brute Macro-Emergentism.
  *   **Node 6 "At Every Level" + Node 1 "No":** Marked **Unattractive**. This posits subjects at all levels but denies the logical connection between them, multiplying entities without explanatory gain.

  ### Closing Note: The Workhorse Node
  **Node 1 (Derivation)** carries the most classificatory work. It divides the logical space into **Constitutive Views** (where the macro is grounded in the micro's nature) and **Non-Constitutive Views** (where the macro is brute, illusory, or grounded elsewhere). Without this node, the tree would collapse into a simple survey of ontological categories (mental, physical, neutral) without addressing the *explanatory gap* that motivates the seminar. Node 1 forces every position to declare whether the connection between brain and experience is intelligible or opaque.
