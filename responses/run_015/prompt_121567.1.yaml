answer: |-
  ### Unpublished Brainstorming Pass

  **(a) Distinct Failure Modes**
  1.  **Noise:** The indicator never tracked the goal well (weak validity).
  2.  **Threshold Degradation:** Correlation holds generally but breaks at the payment threshold (top-end decoupling).
  3.  **Symptom vs. Lever:** The indicator moves without the goal moving (spurious correlation).
  4.  **Effort Distortion:** Providers change service delivery to hit the number, harming the goal (e.g., creaming).
  5.  **Record Degradation:** The service stays same, but the recording changes (data gaming).
  6.  **Population Reshaping:** The counted cohort changes via exclusion or reclassification (selection bias).

  **(b) Sorting by Mechanism**
  *   *Changing what they do:* Effort Distortion, Symptom vs. Lever.
  *   *Changing what they record:* Record Degradation.
  *   *Changing which cases enter:* Population Reshaping, Noise (if definition shifts).

  **(c) Detectability by Small Team (Pre-Commitment)**
  *   *Detectable:* Noise (prior data), Threshold Degradation (distribution analysis), Record Degradation (audit history), Population Reshaping (eligibility rules).
  *   *Harder:* Effort Distortion (requires simulation/interviews), Symptom vs. Lever (requires causal theory).
  *   *Verdict:* All are *in principle* detectable via the proposed procedure, though Effort Distortion requires the interview step to be rigorous.

  ***

  ### PROCEDURE FOR METRIC VETTING AND PAYMENT AUTHORITY

  **To:** Performance and Payment Team
  **From:** Lead, Performance and Payment
  **Subject:** Pre-Commitment Metric Stress-Test (v1.0)

  **Purpose:** To prevent specification gaming and payment for non-outcomes. This procedure operationalises the principle that any measure subjected to high-stakes control will degrade (Goodhart's Law/Strathern Interpretation). It distinguishes between metrics that are *evidential* (proxy for a goal) and *constitutive* (the goal itself), though both are vulnerable to measurement gaming.

  **Resources:** Prior-year distributions, contract management records, provider audit files, 2–3 provider interviews.
  **Time Budget:** 2 analyst days per metric.

  #### PART 1: THE VETTING STEPS

  | Step | Question | Sufficient Answer | Documents / Evidence | Stop Rule |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Construct Validity** | Is the metric causally linked to the goal, or merely correlated? | Causal mechanism documented; or correlation >0.7 in prior data across providers. | Logic model; prior-year regression analysis. | **Kill** if correlation <0.5 and no causal link. **Redesign** if correlation 0.5–0.7. |
  | **2. Threshold Stress** | Does the correlation hold at the payment threshold (e.g. top 20%)? | Distribution shows no clustering just below target; top-quartile performance matches goal data. | Prior-year performance distributions; histogram of outcomes. | **Cap Payment** if clustering detected at threshold. **Kill** if top-end correlation vanishes. |
  | **3. Lever vs. Symptom** | If we move this number, does the participant's life improve? | Evidence that provider action on metric causes outcome, not just predicts it. | Interviews (2 providers); literature on similar interventions. | **Redesign** if metric is a lagging symptom only (e.g. satisfaction vs. retention). |
  | **4. Recording Integrity** | Can the record be altered without changing the service? | Audit trail shows <2% discrepancy rate in prior years; verification requires third-party data. | Audit files; data matching records (e.g. HMRC vs. Provider). | **Cap Payment** if self-reported without verification. **Kill** if verification impossible. |
  | **5. Population Stability** | Can providers alter who enters the count to improve the average? | Eligibility rules lock cohort at referral; exclusion rates stable across providers. | Contract management records; referral logs. | **Redesign** if exclusions are provider-discretionary. **Escalate** if definition of 'participant' is contested. |

  **Judgement Call:** Step 3 and 5 require analyst judgement. The Senior Analyst must sign off on the causal claim; the Finance Director must sign off on population definitions. If analysts disagree, escalate to the Board Subcommittee as a values question (e.g., "Do we value speed or quality?").

  #### PART 2: CONSTITUTIVE METRICS AND MONITORING

  **The Constitutive Claim:** Some analysts argue that for metrics like 'waiting time' or 'recorded in work', hitting the number *is* the goal, so gaming is impossible. This is false. While the *outcome* may be constitutive, the *measurement* is not. A waiting clock can be paused administratively; a job can be created for a day to meet a threshold.
  **Procedure Adjustment:** For constitutive metrics, skip Step 1 (Validity) but tighten Step 4 (Recording Integrity). The risk is not proxy degradation, but measurement fraud. Treat these as high-risk for Record Degradation.

  **Monitoring the Monitors:** Anti-gaming checks (e.g., tracking 'lost contact' rates) become targets themselves. To prevent infinite regress:
  1.  **Rotation:** Anti-gaming indicators must not be tied to payment.
  2.  **Aggregation:** Monitor at the portfolio level, not per provider, to reduce individual incentive to game the monitor.
  3.  **Sunset:** Any anti-gaming monitor expires after two contract years unless fraud is detected.

  #### PART 3: BLIND SPOTS

  This procedure operationalises **Strathern's version of Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure." It assumes providers are rational actors who will optimise for payment within the rules.
  **What it does not protect against:**
  1.  **Collusion:** Providers and participants agreeing to falsify data mutually.
  2.  **Systemic Shock:** External economic changes that break historical correlations (Step 1 fails).
  3.  **Innovation Suppression:** Metrics that are safe may discourage novel approaches that don't fit the indicator.
  4.  **Complexity:** It assumes linear causality. Complex adaptive systems may react unpredictably to Step 3.

  ***

  ### APPLICATION TO CANDIDATE METRICS

  **(a) Payment on share in paid work for 13 of 26 weeks post-exit.**
  *   **Step 1 (Validity):** Pass. Employment is the goal.
  *   **Step 2 (Threshold):** Warning. Prior data shows clustering at 13 weeks. Providers may churn participants off payroll at week 14.
  *   **Step 4 (Recording):** Risk. Relies on provider declaration unless matched to tax data.
  *   **Verdict:** **Survive with Cap.** Payment should be tapered (e.g., more for 26 weeks) to reduce the cliff-edge at week 13. Requires HMRC data match, not provider self-report.
  *   **Action:** Redesign payment curve; mandate third-party verification.

  **(b) Payment on 90% of initial assessments completed within 5 working days.**
  *   **Step 1 (Validity):** Fail. Speed of assessment is a symptom, not a lever. No evidence in audit files that faster assessment improves employment outcomes.
  *   **Step 3 (Lever vs. Symptom):** Fail. Interviews suggest speed is achieved by reducing assessment quality.
  *   **Step 5 (Population):** Risk. Providers may delay referral date to start the clock later.
  *   **Verdict:** **Kill.** This metric incentivises box-ticking over quality. It is an activity measure mistaken for an outcome.
  *   **Action:** Remove from payment schedule. Retain as a non-financial compliance minimum only.

  **(c) Payment on improvement in participant-reported wellbeing score at exit.**
  *   **Step 1 (Validity):** Weak. 'Wellbeing' is contested internally (Step 5 Escalation).
  *   **Step 4 (Recording):** Critical Fail. Collected by providers themselves. High risk of coaching participants or only surveying successes.
  *   **Step 2 (Threshold):** High risk of score inflation near target.
  *   **Verdict:** **Send Back for Redesign.** Cannot be used for payment while self-reported.
  *   **Action:** Commission independent exit surveys for a 10% sample. If budget prohibits, drop metric.

  **Note on Metric (b):** Killing metric (b) will be unpopular. It is easy to measure and looks like efficiency. However, audit files show that when this was tight last year, complaint rates about assessment quality rose 15%. The Finance Director needs to know: paying for speed buys speed, not employment. We are currently paying for administrative haste. The argument is not that speed is bad, but that *paid* speed displaces *unpaid* quality.

  ***

  ### EPISTEMIC SECTION

  **Confidence Levels:**
  *   **Step 1 (Validity):** **High.** Historical data is robust. *Change of mind:* If a new provider type emerges with a different model, historical correlation may not hold.
  *   **Step 2 (Threshold):** **Medium.** Providers may find new ways to cluster. *Change of mind:* If payment is tapered rather than binary, this risk reduces.
  *   **Step 3 (Lever):** **Low.** Causal inference is hard with observational data. *Change of mind:* A randomised control trial (RCT) would raise this to High, but is too costly for routine vetting.
  *   **Step 4 (Recording):** **High.** Audit discrepancies are factual. *Change of mind:* If audit coverage drops below 5%, confidence declines.
  *   **Step 5 (Population):** **Medium.** Depends on contract management vigilance.

  **Where this Procedure Misfires:**
  1.  **Too Harsh On:** Innovative providers. A new approach might look like 'population reshaping' initially because it targets a niche. The procedure favours incumbent methods.
  2.  **Too Soft On:** Collusive gaming. If providers and participants agree to falsify employment status, Step 4 (Audit) may miss it if the audit relies on phone checks that participants coach.
  3.  **Contested Reading:** This procedure assumes providers respond to financial incentives primarily. If providers are motivated by reputation or mission, the 'gaming' risk is lower, and we may be over-engineering controls. However, given the £40m spend, we must assume financial rationality.

  **Assumption to Test:** The procedure assumes that 'prior-year distributions' are a reliable guide. In a recession, these distributions shift. We must adjust thresholds dynamically or risk paying for nothing (if targets become impossible) or paying for windfalls (if targets become too easy). This procedure does not automatically adjust for macro-economic shifts; that requires a separate quarterly review clause.

  **Final Note:** No procedure eliminates risk. This document shifts the risk from 'unknown unknowns' to 'known trade-offs'. When you sign this, you are accepting that we may under-pay for some genuine outcomes to prevent over-paying for false ones. That is the cost of integrity.
