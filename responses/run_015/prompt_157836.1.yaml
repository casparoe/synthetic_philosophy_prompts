answer: |-
  Jimmy and Cliff are leaning against the bar in a dimming pub in Manchester. The landlord is conspicuously stacking stools.

  Jimmy nudges Cliff. "Right, I'm going to place the belief 'they're still serving' into doxastic escrow."

  Cliff adjusts his spectacles. "You can't do that. Escrow implies you're holding the asset ready to release. To walk up there is to act, and to act is to believe. You're just trying to launder your passional nature."

  "It's a live, forced, and momentous option, mate," Jimmy says, gesturing at the empty glasses. "If I wait for sufficient evidance, the pub closes. I lose the pint. That's a genuine option."

  "It is wrong always, everywhere, and for anyone, to believe upon insufficient evidence," Cliff recites, like he's ordering a sandwich. "Even if you park it in escrow. It's still intellectual sin."

  Jimmy shrugs and walks up to the bar. "Guinness, please."

  The landlord sighs, pulls the pint, and slides it over. Jimmy brings it back, foam settling nicely.

  "See?" Jimmy says. "The belief helped verify itself. Pragmatism works."

  Cliff stares at the pint with moral suspicion. "You got lucky. Epistemically speaking, that drink is stolen goods."

  "Cheers then," Jimmy says, taking a long pull. "To the will to believe."

  Cliff turns towards the door, coat collar up. "Enjoy it. I'm going home."

  "Suit yourself," Jimmy calls after him. "But admit it—wouldn't you rather be hydrated and wrong than dry and righteous?"

  Cliff pauses at the threshold. "I'd rather be right. Besides, I checked the opening hours online. We're actually closed."

  Jimmy looks at his pint, then at the landlord who's now turning off the till.

  "Ah," says Jimmy. "Looks like my escrow just bounced."

  "Exactly," says Cliff, smiling thinly. "But at least I didn't pay for it with my integrity."

  Jimmy finishes the drink in one go. "Yeah, but look at the behaviour of the foam on yours. Oh wait, you haven't got one."

  Cliff walks out into the rain. Jimmy signals for another. Neither side wins, but only one of them is wet.
