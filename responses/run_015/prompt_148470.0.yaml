answer: |-
  Below is a structured framework of desiderata for a theory of philosophical progress, followed by an analysis of internal tensions within those desiderata, and finally an assessment of three dominant families of view against this standard.

  ### I. Desiderata for a Theory of Philosophical Progress

  Any adequate account must satisfy conditions across four domains: phenomenological fit, conceptual precision, external coherence, and specific edge-case handling.

  #### 1. Phenomenological Adequacy (Historical and Conceptual Phenomena)
  *   **D1. Persistent Disagreement:** The theory must accommodate the fact that core questions (e.g., the nature of justice, the mind-body problem) remain contested over millennia without rendering the field irrational or stagnant. It cannot define progress solely as consensus.
  *   **D2. Problem Dissolution:** It must account for the retrospective judgment that certain problems (e.g., the location of the soul, the phlogiston of ethics) were not solved but dissolved or dissolved via conceptual change.
  *   **D3. Lateral Movement:** It must explain shifts in focus or vocabulary that do not obviously constitute "deepening" or "solving" but rather reorienting the discourse (e.g., the linguistic turn), without dismissing them as mere fashion.
  *   **D4. Dead Ends and Regress:** It must allow for the possibility of genuine error, regression, or time wasted, rather than assuming a teleological march toward truth.

  #### 2. Conceptual Distinctions (Non-Collapse Clauses)
  *   **D5. Accumulation vs. Clarification:** The theory must distinguish between *adding* new propositions to a stock of knowledge (cumulative) and *refining* the understanding of existing concepts (clarificatory). It cannot treat all clarification as accumulation.
  *   **D6. Local vs. Global:** It must distinguish between resolving a specific argument within a shared framework (local) and shifting the framework itself such that the argument changes meaning (global/paradigmatic).
  *   **D7. Progress vs. Mere Change:** It must provide a normative criterion that distinguishes *progress* from *difference*. Not all conceptual shifts are improvements.

  #### 3. External Constraints
  *   **D8. Philosophy of Science Compatibility:** The theory should not contradict robust accounts of scientific progress where philosophy and science overlap (e.g., in logic or methodology), though it may posit disanalogies. It cannot claim philosophy progresses *exactly* like physics if the phenomena (D1) differ.
  *   **D9. Conceptual Genealogy:** It must respect the historical contingency of concepts. It cannot assume current conceptual distinctions (e.g., "fact/value") were available to past philosophers to be "solved" by them. Anachronism must be avoided in measuring progress.

  #### 4. The Specific Test Case: The Reframing Constraint
  *   **D10. Vertical Stagnation / Horizontal Gain:** The theory must make room for cases where a problem remains technically unsolved in its original formulation (**Vertical Stagnation**), yet the field succeeds in demonstrating that the formulation rested on a misframed distinction (**Horizontal Gain**).
      *   *Constraint:* The theory cannot categorize this as straightforward success (since the question wasn't answered) nor as straightforward failure (since understanding was deepened). It requires a *sui generis* category of "productive displacement."

  ---

  ### II. Internal Tensions: Jointly Unsatisfiable Requirements

  In constructing this list, two pairs of desiderata appear to generate significant tension, potentially threatening the coherence of any single theory.

  **Tension A: The Metric vs. Genealogy Tension (D7 vs. D9)**
  To measure progress (D7), one generally requires a stable metric or goal (e.g., truth, coherence, explanatory power). However, Conceptual Genealogy (D9) suggests that the metrics themselves (what counts as a good explanation, what counts as "truth" in a context) are historically contingent.
  *   *The Conflict:* If you respect genealogy too strictly, you lose the trans-historical standpoint needed to judge progress. If you insist on a stable metric to judge progress, you risk anachronistically imposing current standards on past thought.

  **Tension B: The Disagreement vs. Normativity Tension (D1 vs. D7)**
  If persistent disagreement (D1) is a permanent feature of philosophy, it is difficult to maintain a robust norm of progress (D7). Usually, progress implies convergence.
  *   *The Conflict:* A theory that explains away disagreement (e.g., "we are converging slowly") risks violating Phenomenological Adequacy. A theory that accepts disagreement as permanent risks collapsing the distinction between Progress and Mere Change (D7), as incompatible views could both claim "progress" within their own silos.

  ---

  ### III. Assessment of Three Familiar Families of View

  Here we assess how three standard models fare against the desiderata above, specifically noting violations.

  #### 1. The Kuhnian Discontinuity Model
  *Adapted from Thomas Kuhn's philosophy of science, applied to philosophy.*
  This model views philosophical history as a series of incommensurable paradigms. Progress occurs within a paradigm; paradigm shifts are non-cumulative reorientations.

  *   **Performance:**
      *   *Strengths:* Excellent at accommodating **D3 (Lateral Movement)** and **D6 (Local vs. Global)**. It handles **D10 (Reframing)** well by treating the "Horizontal Gain" as a paradigm shift where the old questions become obsolete.
      *   *Weaknesses:* It struggles with **D5 (Accumulation vs. Clarification)**, often collapsing all progress into paradigm-relative puzzle-solving.
  *   **Violations:**
      *   **Violates D8 (Science Compatibility):** Kuhn explicitly argued science *does* progress cumulatively in a way pre-paradigmatic fields do not. Applying this to philosophy often implies philosophy is "pre-scientific" or stagnant, which conflicts with the intuition that philosophy has normative value independent of science.
      *   **Violates D7 (Progress vs. Change):** By emphasizing incommensurability, it risks making progress entirely internal to a paradigm, making it difficult to say the *field* progressed, only that it changed. It struggles to explain why one paradigm is *better* than another, not just different.

  #### 2. The Therapeutic / Dissolution-Oriented Model
  *Associated with later Wittgenstein, Carnap, and certain strands of experimental philosophy.*
  This model holds that philosophical progress consists primarily in recognizing and dissolving pseudo-problems generated by linguistic confusion or conceptual overreach.

  *   **Performance:**
      *   *Strengths:* Perfectly accommodates **D2 (Problem Dissolution)** and **D10 (Reframing)**. It treats "Vertical Stagnation" as proof that the question was ill-posed, and "Horizontal Gain" as the therapeutic success of realizing this.
      *   *Weaknesses:* It has difficulty accounting for constructive theory-building.
  *   **Violations:**
      *   **Violates D1 (Persistent Disagreement):** It tends to interpret persistent disagreement as evidence of confusion rather than a substantive feature of the domain. It cannot easily explain why, after therapy, substantive normative disagreements (e.g., in ethics) persist.
      *   **Violates D5 (Accumulation vs. Clarification):** It tends to collapse all progress into clarification/dissolution. It lacks the resources to account for cases where philosophy seems to generate positive knowledge or robust frameworks that are *used*, not just dissolved.

  #### 3. The Modest Cumulative-Progress Model
  *Associated with Rescher, Sosa, and mainstream analytic metaphysics/epistemology.*
  This model argues that philosophy progresses like science, but more slowly and subtly: through the refinement of arguments, the elimination of untenable positions, and the increasing sophistication of distinctions.

  *   **Performance:**
      *   *Strengths:* Strong on **D5 (Accumulation)** and **D7 (Normativity)**. It preserves the intuition that we know more now than Aquinas did, even if we lack final answers.
      *   *Weaknesses:* It struggles to explain why the "core" questions remain open.
  *   **Violations:**
      *   **Violates D1 (Persistent Disagreement):** It often has to minimize the significance of persistent disagreement to maintain the narrative of progress. It risks portraying history as a slow march toward current consensus, which can look like whiggish history.
      *   **Violates D10 (Reframing Constraint):** This model is most at risk here. It tends to interpret "Horizontal Gain" (reframing) as a form of "Vertical Progress" (solving the problem by updating the terms). It struggles to admit that a problem can be *unsolved* yet the situation *improved* without claiming the problem was effectively solved by the reframing. It collapses the *sui generis* category back into standard progress.

  ### Summary of Assessment

  | Desideratum | Kuhnian Discontinuity | Therapeutic / Dissolution | Modest Cumulative |
  | :--- | :--- | :--- | :--- |
  | **D1 (Disagreement)** | Accommodates (Incommensurability) | **Violates** (Pathologizes disagreement) | **Violates** (Minimizes disagreement) |
  | **D2 (Dissolution)** | Accommodates (Paradigm loss) | Accommodates (Core mechanism) | Accommodates (As elimination) |
  | **D5 (Accum vs. Clar)** | **Violates** (Collapses to paradigm) | **Violates** (Collapses to clarification) | Accommodates |
  | **D9 (Genealogy)** | Accommodates (Historicizes standards) | Accommodates (Historicizes concepts) | **Violates** (Risk of anachronism) |
  | **D10 (Reframing)** | Accommodates (As shift) | Accommodates (As therapy) | **Violates** (Collapses to solution) |

  **Conclusion:**
  No existing family of views satisfies all desiderata without tension. The **Kuhnian** model sacrifices normative continuity; the **Therapeutic** model sacrifices substantive construction; the **Cumulative** model sacrifices historical nuance regarding the nature of the questions themselves. A viable theory must likely be a hybrid that accepts the **Reframing Constraint (D10)** as a distinct category of progress, acknowledging that philosophy often advances by changing the scorecard rather than by scoring more points.
