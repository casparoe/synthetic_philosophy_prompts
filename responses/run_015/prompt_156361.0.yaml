  **Verdict:** Permissible.

  **Closest Analog:** Ruling 5 (Demolition).

  **Determination of Precedents:** The Committee's precedents **determine the outcome unambiguously**.

  **Governing Principle:**
  The Committee operates under the **Principle of Non-Instrumentalization**, coupled with **Proportionality**. This principle holds that an action producing foreseen harm is permissible if and only if:
  1.  The harm is not the *causal means* by which the good effect is achieved (it must be a side effect);
  2.  The agent intends only the good effect; and
  3.  The good effect is proportional to the bad effect.

  **Defense of Determination:**
  The Committee's track record (Rulings 1–5) reveals a consistent jurisprudence focused exclusively on the *causal role* of the harm (means vs. side effect) and the *balance of outcomes* (proportionality). In Rulings 1, 3, and 5, harm was deemed permissible because it was a "consequence," "physical consequence," or "not the mechanism" of the rescue, despite being certain and fatal. In Rulings 2 and 4, harm was impermissible because it was the "direct mechanical means" or "kinetic brake."

  Case 6 explicitly stipulates that the harm to the false positives "is not part of the epidemiological mechanism" and is instead a "statistical consequence." This causal structure is identical to that of Rulings 1, 3, and 5. The proportionality (200 harmed vs. 10,000 saved) exceeds the thresholds accepted in Ruling 3 (1 vs. 5) and aligns with Ruling 5 (1 vs. hundreds).

  While Case 6 introduces a *statistical* modality of harm rather than a *physical* one, the Committee's name ("Proportional Causation") and its prior rulings establish no distinction based on the *mode* of causation, only the *structure*. Ruling 3 (autonomous navigation) already establishes that the Committee applies these principles to algorithmic/technical systems, not just direct human physical acts. To rule otherwise would require importing a new distinction (e.g., "identified vs. unidentified victims" or "physical vs. statistical certainty") that is absent from the text of Rulings 1–5. Consistency with the track record demands applying the established causal test, which Case 6 satisfies.

  **Why No Further Case Is Needed:**
  No further case is needed because the ambiguity is merely apparent, arising from the *context* (public health algorithms) rather than the *principle* (causal instrumentation). The Committee has already adjudicated the only relevant moral variables: intention, causal role, and proportionality. A further case would only be necessary if the Committee intended to establish a new doctrine regarding *epistemic uncertainty* or *victim identification*. However, based strictly on the instruction to be "consistent with its own track record," the existing principle is sufficiently granular to cover statistical consequences, as the moral weight in Rulings 1–5 was placed on the *inevitability* of the side effect given the action, not the *identity* of the victim. In Case 6, the harm to the group of 200 is just as inevitable given the deployment of the algorithm as the death of the fetus was given the hysterectomy in Ruling 1. Thus, the precedent is exhaustive for this decision.
