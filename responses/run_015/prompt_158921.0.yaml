answer: |-
  It is a familiar predicament in bioethics to find that a tidy principle, once taught, frays at the edges when pulled against the grain of considered judgement. Your unease is well-founded. The 'species-typical functioning' account (often associated with Christopher Boorse and Norman Daniels) is the dominant framework in liberal egalitarian bioethics, but as your cases demonstrate, it conflates statistical normality with normative value, and it conflates the *nature* of an intervention with the *justice* of its provision.

  Before settling on a robust alternative, let us briefly weigh two other candidate principles that initially seem promising but fail to capture your intuitions.

  **Candidate 1: The Pure Welfarist Principle.**
  *Principle:* An intervention is therapy if it reduces suffering or increases happiness; it should be funded if it produces the greatest net welfare.
  *Counter-case:* This fails **Case 8 (Grief)**. The bereaved person is suffering, and the drug would reduce it, yet you rightly withhold funding. Why? because grief is a *fitting* response to loss, not a malfunction. Welfare alone cannot distinguish between pathology and painful normality. It also struggles with **Case 3 (Growth Hormone)**; if the child is bullied and suffers, welfare logic demands funding, yet you resist.

  **Candidate 2: The Libertarian Autonomy Principle.**
  *Principle:* Any intervention is permissible if consensual; funding is only owed for life-saving measures.
  *Counter-case:* This fails **Case 9 (Super-Vaccine)**. You feel the state *should* fund this for public security, even if it enhances individuals. It also fails **Case 1 (Cochlear Implant)**, where you note the family is not obliged to accept it, yet the state should fund it if they do. Pure autonomy cannot ground positive entitlements to care.

  Neither of these survives. The principle that best accommodates your verdicts must distinguish between *biological statistics* and *normative functioning*, and it must separate the definition of therapy from the criteria for public funding. I propose we adopt a hybrid view: **The Normative Function and Solidarity Principle.**

  ### The Normative Function and Solidarity Principle

  This principle decouples the metaphysical question ("Is this therapy?") from the political question ("Is this publicly funded?"). It posits that public funding is owed not merely for 'therapy' defined statistically, but for interventions that secure fair equality of opportunity or public safety.

  **Clause 1: The Restoration of Normative Agency.**
  Public funding is owed for interventions that restore or secure an individual's capacity to participate in the central range of human activities and social opportunities, regardless of whether the means employed exceed species-typical statistical averages.
  *   *Motivating Case:* **Case 4 (Super-Prosthetic).** Even if the leg allows running faster than a biological human, if it is the requisite technology to restore the *capability of walking* (a central human activity) in an environment built for walkers, it is funded. The 'enhancement' aspect is incidental to the therapeutic goal of mobility.
  *   *Motivating Case:* **Case 2 (Glasses).** Vision is restored to a level required for literacy and social participation, not merely to a statistical mean.

  **Clause 2: The Collective Security Exception.**
  Public funding is permissible for interventions that confer significant protection against collective harms or public health crises, even if the intervention enhances individual capacity beyond the species-typical norm.
  *   *Motivating Case:* **Case 9 (Super-Vaccine).** While biologically an 'enhancement', the justification for funding is solidarity and herd immunity, not individual therapy. The state funds this to protect the population, not merely to improve the individual.

  **Clause 3: The Normative Appropriateness Constraint.**
  Public funding is withheld for interventions that treat conditions which, while impairing or distressing, constitute fitting or appropriate responses to the human condition, rather than pathologies.
  *   *Motivating Case:* **Case 8 (Grief Drug).** Severe grief impairs functioning, but it is not a disorder. To medicalise it is to misunderstand the value of the emotional state. Funding is withheld because there is no 'deficit' in normative functioning to correct, only a painful reality to endure.

  **Clause 4: The Positional Good Exclusion.**
  Public funding is withheld for interventions that primarily confer a competitive advantage in social hierarchies without addressing a deficit in basic functioning or opportunity.
  *   *Motivating Case:* **Case 3 (Growth Hormone).** Short stature, absent pathology, is a variation, not a deficit in agency. Funding it would be to subsidise a positional good (being taller than others) rather than restoring function.
  *   *Motivating Case:* **Case 6 (Tutoring).** This is privately funded because it seeks competitive advantage within an educational system, though note that *basic* education is publicly funded (linking back to Clause 1).

  ### Verdicts on Unlisted Cases

  Applying this principle to your new queries yields the following:

  **1. Gene Editing in Embryos for General Cognitive Ability.**
  *   *Verdict:* **Not funded; likely impermissible.**
  *   *Reasoning:* This fails Clause 1 (there is no existing person with a deficit in agency to restore) and Clause 3 (variation in cognitive ability is not inherently pathological). It falls squarely under Clause 4 as a positional good. Furthermore, it raises justice concerns regarding the 'genetic lottery' that exceed standard enhancement worries. Under this principle, the state owes children a decent environment (education, nutrition), not a maximised genome.

  **2. Person-Modification vs. Environment-Modification (The Ramp vs. The Device).**
  *   *Verdict:* **Priority to Environmental Modification where cost-effective and non-burdensome.**
  *   *Reasoning:* This principle aligns with the Social Model of Disability. If a ramp (environment) allows participation in central activities (Clause 1) as effectively as a mobility device (person), and is less invasive, justice suggests the environment should be adapted first. However, if the environment cannot be reasonably modified (e.g., a fire escape), the device must be funded. The goal is *participation*, not necessarily biological normality.

  ### Incompatible Verdicts

  I must be plain: no single principle can accommodate every one of your intuitions without tension. There are two specific friction points in your judgements that the principle above highlights as inconsistent.

  **1. The Consent Tension (Case 3 vs. Case 5).**
  You are uneasy about **Case 3 (Growth Hormone)** partly because the child cannot consent, yet you are "untroubled" by **Case 5 (Sleep Drug)** for an adult. However, you classify both as enhancements. If the barrier to funding in Case 3 is *consent*, then the Sleep Drug should be permissible (which you agree with). But if the barrier is *medicalisation of variation*, why is the Sleep Drug less troubling?
  *   *The Conflict:* Your intuition suggests that adult lifestyle enhancement (Sleep Drug) is less ethically fraught than paediatric bodily modification (GH). A strict principle struggles here. The Normative Function Principle suggests neither *needs* funding, but your emotional reaction suggests you view medicalising children's bodies as weightier than adults altering their own chemistry. You may need to accept that 'permissibility' (adults can do what they like) is distinct from 'funding' (neither gets public money), and your unease in Case 3 is about parental authority, not just the therapy/enhancement line.

  **2. The 'Super-Prosthetic' Definition (Case 4).**
  You want to call the super-leg 'therapy' and fund it. My principle accommodates the *funding* via Clause 1, but strictly speaking, it admits this *is* enhancement biologically.
  *   *The Conflict:* You must accept that 'therapy' is not a biological fact but a normative category. If the only leg available runs faster than a biological one, the 'enhancement' is irrelevant. But if a biological leg were available, and they chose the super-leg, that would be enhancement. Your verdict holds, but only if you admit that 'therapy' is defined by the *goal* (walking), not the *outcome* (speed).

  ### One Question or Two?

  You asked whether you are really asking one question or two. The answer is unequivocally **two**.

  You have been running together **The Metaphysical Question** ("What kind of intervention is this?") and **The Distributive Question** ("What do we owe one another?").

  1.  **Therapy vs. Enhancement** is a descriptive (albeit normatively laden) distinction about the relationship between the intervention and the organism's functioning.
  2.  **Funding vs. Private Choice** is a question of justice, solidarity, and resource allocation.

  Your Case 9 (Super-Vaccine) proves this decisively. It is biologically an enhancement, but distributively a public good. Your Case 4 (Super-Leg) proves it again: it is biologically an enhancement, but distributively a requirement for equality of opportunity.

  The species-typical principle fails because it attempts to derive the 'ought' (funding) directly from the 'is' (statistics). The **Normative Function and Solidarity Principle** succeeds because it acknowledges that we fund things not because they are 'natural', but because they allow people to flourish as citizens (Clause 1) or protect the community (Clause 2).

  **Recommendation:** Abandon the search for a definition of 'therapy' that automatically dictates funding. Instead, adopt the view that public healthcare is a system of **social insurance against misfortune and a mechanism for securing equal citizenship**. Sometimes that requires enhancing a person beyond the statistical norm to achieve those ends. Sometimes it requires withholding treatment for normal suffering to preserve the meaning of human life. The distinction that matters is not between therapy and enhancement, but between **need/solidarity** and **preference/advantage**.
