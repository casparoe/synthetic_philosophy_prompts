          *   *Correction:* It *is* a quirk of first-order syntax (specifically Compactness/LS). If you had a logic that captured "uncountable," it would be absolute. The fact that it's not absolute is *because* FOL can't express uncountability. So Point 6 contradicts Point 1's claim that it's *just* syntax, by claiming it's *not* syntax.
          *   *Wait, nuance:* Point 1 says "nothing left to explain." Point 6 says "here is the thing to explain." The tension is about *significance*, not just mechanism.

