      *   **Implicit Theory of Well-being:** Using this for policy presupposes that well-being is largely about life evaluation (satisfaction) rather than moment-to-moment affect (hedonia) or objective functioning (eudaimonia/capabilities), though it often claims to capture "happiness." It assumes interpersonal comparability (my 7 is comparable to your 7). It assumes cardinality (the difference between 4 and 5 is comparable to 8 and 9, allowing for summation/optimization). It assumes the counterfactual imagination is stable enough across cultures and individuals to serve as a common metric.
      *   **Coherence:** Is it coherent? Mostly, within a utilitarian framework that values preference satisfaction or life evaluation. However, there's tension between the subjective nature of the "best possible life" (which varies wildly) and the objective policy interventions meant to shift the score. It smuggles in objective list assumptions (e.g., income, health, freedom) because those are the levers pulled to move the score, even though the score is subjective.
      *   **Necessary vs. Compatible:** Necessary: Interpersonal comparability, cardinality, stability of the counterfactual anchor. Compatible: Specific theories of what causes happiness (income vs. social support), specific political ideologies (as long as they aim to maximize the score).
