      *   **Task:** Reconstruct the implicit theory behind using these scores for budget allocations. Evaluate coherence vs. incompatible commitments. Distinguish necessary assumptions from compatible ones. Explain what would change if happiness were treated as purely indicative (direct affect report) instead of counterfactual evaluation.
