  # Section Plan: Colour Phi & The Orwellian/Stalinesque Distinction

  ## 1. Core Commitments
  **Order of Introduction:**
  1.  Recap the Phenomenon (Subjective Report).
  2.  Define the Two Stories (Mechanisms).
  3.  Establish Equivalence (The Load-Bearing Claim).
  4.  Introduce the Neural Signature Problem.
  5.  Discuss Implications for "Real" Experience.

  **The One Thing Everything Depends On:**
  The session collapses if students believe the subject's experience differs between the two stories. You must establish their **phenomenological equivalence** before discussing neural timing.

  **The Carrying Case:**
  **Choice:** The **bare two-spot display**.
  **Reasoning:** The variant (random event) tempts students to solve the puzzle empirically (e.g., "The brain couldn't know the color yet, so it must be Orwellian"). The bare display isolates the conceptual problem: even if both are physically possible, can we distinguish them?
  **Must Contain:** The invariant subjective report of continuous motion and mid-path color change.
  **Must Not Contain:** Any timing data or causal constraints that render one story physically impossible.

  ## 2. 50-Minute Timeline

  **00:00 – 05:00 | Recap the Phenomenon**
  *   **Action:** Project the static handout diagram. Ask a student to narrate the *experience* (not the physics).
  *   **Target:** "One spot moves and changes color mid-path."
  *   **[GUESS]:** First-years will describe the physics ("two lights flashed") rather than the experience. Correct this gently: "What did it *look like* to you?"

  **05:00 – 15:00 | Define the Two Stories**
  *   **Action:** Introduce Dennett's labels.
      *   *Stalinesque:* Fabrication before consciousness (show trial).
      *   *Orwellian:* Revision after consciousness (history book).
  *   **Misconception 1 (Labels):** Students will swap them.
  *   **Intervention (Min 10):** Use the mnemonic: "Stalin staged events *before* the public saw them; Orwell rewrote history *after*."
  *   **Action:** Draw two timelines on the board. Mark "Consciousness" as a line. Stalinesque edits before the line; Orwellian edits after.

  **15:00 – 25:00 | Establish Equivalence (Load-Bearing Move)**
  *   **Action:** Ask: "If you were the subject, could you tell which story happened?"
  *   **Misconception 2 (Experience Differs):** Students will say, "Stalinesque feels fake."
  *   **Intervention (Min 20):** Hammer the claim: **Both stories predict the exact same subjective report.** The "fake" feeling is a misunderstanding; in both cases, the subject sincerely sees the color change.
  *   **Verdict:** There is no "view from inside" that distinguishes them.

  **25:00 – 35:00 | The Neural Signature Question**
  *   **Action:** Pose the Cog Sci hook: "Can fMRI or EEG settle this?"
  *   **Placement:** This is the pivot point where the distinction matters to scientists.
  *   **Misconception 3 (Decisive Experiment):** Students will say, "Find when the color is processed."
  *   **Intervention (Min 30):** Explain that neural timing only shows when information is available, not when it becomes *conscious*. There is no "finish line" in the brain.
  *   **[GUESS]:** Students will trust technology to solve philosophical problems. Push back hard here: "Data needs interpretation; the interpretation relies on the same distinction."

  **35:00 – 45:00 | Implications & Exclusions**
  *   **Action:** Discuss what this means for "real" motion.
  *   **Misconception 4 (Motion Not Real):** Students will say, "So the motion didn't happen."
  *   **Intervention (Min 40):** Clarify: The experience happened. The *physical* motion didn't. Don't let them dismiss the experience as "nothing."
  *   **Exclusion:** Do **not** explain Dennett's Multiple Drafts Model.
  *   **Framing:** "Dennett uses this puzzle to build a bigger theory called Multiple Drafts. We are stopping at the puzzle today because mastering this distinction is the tool you need to understand that theory later. We are diagnosing the disease, not prescribing the cure."
  *   **[GUESS]:** Without this framing, students will feel cheated that there is no solution.

  **45:00 – 50:00 | Closing Question & Wrap**
  *   **Action:** Pose the closing question (see below). Give 2 minutes for pair discussion.
  *   **Wrap:** Collect answers to gauge understanding.

  ## 3. Tactical Details

  **The Four Misconceptions & Interventions:**
  1.  **Mixing Labels:** Head off at **Min 10** (Mnemonic intervention).
  2.  **Experience Differs:** Head off at **Min 20** (Equivalence intervention).
  3.  **Decisive Experiment:** Head off at **Min 30** (Neural signature intervention).
  4.  **Motion Not Real:** Head off at **Min 40** (Reality of experience intervention).

  **Neural Signature Placement:**
  Place at **Min 25-35**. This is the only place the distinction matters to them as cognitive scientists. If placed earlier, it's abstract philosophy; if later, it's an afterthought. It must sit between the conceptual problem and the implications.

  **Closing Question:**
  "If the subject could look at their own brain activity in real-time, could they testify to which story was true?"
  *   **Correct Understanding:** No, because the brain data suffers the same interpretation problem as the behavior.
  *   **Incorrect Understanding:** Yes, because science tells the truth.

  \answer{Both stories yield identical subjective reports.}
