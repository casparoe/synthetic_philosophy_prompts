answer: |-
  Dear Colleague,

  Your description of the problem is exceptionally precise, and I suspect many of us in value theory have felt the friction you describe without having isolated the gear that is grinding. To answer your primary question directly: there is no single, canonical proper name for this specific phenomenon (no "Gettier" or "Euthyphro" label) that you can cite to settle the seminar debate. However, it is a recognized and persistent node within the literature on **Attitudinal Hedonism** and the **Measurement of Well-Being**.

  If you require a label to christen the territory, the most accurate descriptive term currently in circulation is **"The Proxy Dependence of Hedonic Magnitude"** (sometimes discussed under the broader header of the **"Intensity Objection"** to attitudinal hedonism). In more critical circles, it is occasionally referred to as **"Metric Parasitism."**

  Below is the breakdown you requested: a definition, the necessary distinctions from neighboring concepts, and a verdict on whether this trade-off constitutes a theoretical defect.

  ### 1. Definition: The Proxy Dependence of Hedonic Magnitude

  **The Phenomenon:** This occurs when a concept of pleasure (typically an attitudinal or "thin" conception) succeeds in unifying heterogeneous experiences under a single determinable (e.g., "being pleased that *p*") but fails to provide an intrinsic metric for comparing the *intensity* or *amount* of pleasure across those experiences.

  **The Mechanism:** When a comparison of magnitude is required (e.g., "Is the pleasure of the proof greater than the pleasure of the water?"), the theory cannot appeal to a common hedonic "felt tone" or qualitative intensity. Instead, it must outsource the measurement to non-hedonic properties of the object or the attitude, such as:
  *   The strength of the antecedent desire.
  *   The perceived importance of the proposition *p*.
  *   The duration of the attitude.

  **The Consequence:** The concept of pleasure retains its extension (it covers all the cases) but loses its explanatory power regarding value aggregation. The "hedonic calculus" becomes a calculus of desires or importances in disguise.

  ### 2. Distinctions from Neighboring Phenomena

  You were correct to rule out the standard suspects, but the boundaries must be drawn carefully to prevent the seminar from sliding back into them.

  *   **Vs. The Heterogeneity Objection:** The classic Heterogeneity Objection (often associated with Moore or Broad) claims there is *no common property* shared by all pleasures. Your point is more sophisticated: you grant that a thin unifier (like "pro-attitude") *exists*. Your objection is that this unifier is **metrically inert**. It unifies the *category* but cannot weigh the *instances*.
  *   **Vs. Mill's Higher/Lower Pleasures:** Mill's distinction is qualitative but presupposes that "competent judges" can still rank them. Your objection targets the *mechanism* of that ranking. If the ranking relies entirely on the "importance of the object" rather than the "feeling of the pleasure," Mill's distinction collapses into an objective list theory of value, abandoning hedonism.
  *   **Vs. The Experience Machine:** Nozick's objection is that we value *contact with reality*, not just the feeling. Your objection is internal to the hedonic framework: even if we stay inside the machine, we still lack a coherent way to measure the *size* of the pleasures without referencing the (simulated) objects.
  *   **Vs. Incomparability:** You are not arguing that the water and the proof cannot be compared. You are arguing that when they *are* compared, the scale used is not a *hedonic* scale. It is a borrowed ruler.

  ### 3. Verdict: Defect or Feature?

  Is this trade-off a defect? That depends on whether one views pleasure as a **Sensory State** or an **Intentional State**.

  **The Verdict as Defect (The Purist View):**
  If hedonism is to be a distinctive theory of value, "pleasure" must do the axiological heavy lifting. If the magnitude of pleasure is determined by the importance of the object (e.g., the proof matters more than the water), then it is the *importance* doing the work, not the *pleasure*. The theory risks collapsing into a **Desire-Satisfactionism** or an **Objective List Theory**. On this view, Proxy Dependence is a fatal flaw because it renders "pleasure" an empty placeholder for "whatever we value."

  **The Verdict as Feature (The Intentionalist View):**
  However, a sophisticated defender (perhaps drawing on the work of **Fred Feldman** or **Roger Crisp**) might argue this is not a bug, but a revelation. If pleasure is essentially intentional (it is always *about* something), then its magnitude *ought* to be sensitive to the context of the object.
  *   **Argument:** The reason the proof's pleasure feels "greater" than the water's is not that it burns hotter phenomenologically, but that it satisfies a deeper aspect of the self.
  *   **Concession:** This defender admits that "hedonic comparison" was always a proxy for "well-being comparison." They argue that the thin unifier is sufficient because the *value* lies in the fit between the subject and the world, not in a raw qualia.

  **My Recommendation:**
  For the purposes of your seminar, I suggest treating **Proxy Dependence** as a **category error warning**. It signals that you are trying to use a *structural* concept (liking/attitude) to do the work of a *phenomenological* concept (feeling/intensity).

  If you must name it for the syllabus, I propose **"The Metric Parasitism Problem."** It captures the vivid image you provided: the unifier survives by feeding off the intensity of other attitudes (desire, importance) because it lacks the metabolic power to generate its own scale.

  It is genuinely unmarked territory in the sense that while the components are discussed, the specific isolation of the *measurement* failure (distinct from the *existence* failure) is often glossed over. You would be well within your rights to claim it.

  Yours in philosophy,

  [Your Name]
