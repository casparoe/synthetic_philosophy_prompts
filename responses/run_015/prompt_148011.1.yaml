      *   *Check:* Did I address the "infinite regress"? *Yes, under the proximate vs. ultimate cause section.*
      *   *Check:* Is the falsifiability clear? *Yes, the immigrant test is the strongest empirical example.*
      *   *Check:* Am I being honest about the "qualifications" problem? *Yes, acknowledge the tautology risk.*

  6.  **Final Polish:** Ensure the distinction between "culture as independent variable" and "culture as mediator" is clear. (Proceed to generate output).

