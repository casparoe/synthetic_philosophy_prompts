  *Key argument to emphasize:* The "Selection" argument the user raised is actually a version of "Optimal Culture Theory." If cultures evolve to maximize economic fitness, then culture is endogenous (dependent). For the user to be right, culture must sometimes be *maladaptive* economically but persist anyway, or *precede* the economic advantage.

  *Let's structure the "Conditions for Being Wrong" clearly.*

  1.  **Timing:** Culture appears after economics.
  2.  **Persistence:** Culture vanishes when incentives change.
