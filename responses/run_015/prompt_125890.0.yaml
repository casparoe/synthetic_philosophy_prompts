answer: |-
  In a standard clinical IVF procedure, two distinct zygotes are created: Z1 from Gamete Pair Alpha and Z2 from Gamete Pair Beta. Both are transferred into the uterus, but early in gestation, Z2 ceases independent development and is absorbed into Z1, resulting in tetragametic chimerism where cell lines intermix without forming conjoined twins. Due to stochastic allocation during neurulation, the resulting individual's central nervous system and brain tissue are derived almost exclusively from the Z1 cell line, while the majority of somatic tissues, including blood, organs, and germ cells, derive predominantly from the Z2 cell line. The individual matures normally with psychological continuity grounded in the Z1-derived neural substrate, yet possesses a genetic profile in somatic tests matching Z2, creating a biological mosaic where the seat of consciousness and the bulk of bodily metabolism originate from distinct fertilization events.

  (a) The origin-essentialist verdict is that the adult is essentially tied to Z1 and could not have originated from Z2. Origin essentialism posits that a person's identity is necessarily fixed by the specific gametes from which they initially developed. In this chimeric context, the essentialist identifies the "origin" as the zygote that maintained continuous developmental organization as the host organism, which is Z1. Since Z2 was absorbed and ceased independent development, Z2's gametes are merely contributory material, not the essential origin. Therefore, this specific person could not have originated from Gamete Pair Beta alone, because that would constitute a different biological starting point lacking the specific causal history of Z1 that grounds their existence.

  (b) The functional-continuity verdict is that the psychological-functional trajectory realized in Z1-derived neural tissue is what fixes modal identity, implying that in a nearby world Z2-derived tissue could have realized that same trajectory, making Z2 a possible origin. Functional continuity prioritizes the persistence of consciousness and psychological capacities over specific genetic material. Since the psychological traits of the adult are realized by the functional organization of the brain, and there is no metaphysical barrier to Z2-derived neural tissue supporting that same functional organization had cell allocation differed slightly, the person's identity is preserved across that modal variation. Thus, the adult could have originated from Z2, provided Z2-derived tissue formed the neural substrate supporting the same psychological life.

  (c) The feature that does the work in forcing the divergence is genetic mosaicism separated by tissue-type and functional role. Specifically, it is the segregation of the genetic source of the psychological substrate (Z1) from the genetic source of the metabolic and somatic substrate (Z2). This separation allows Origin Essentialism to latch onto the developmental history of the host organism (Z1) while Functional Continuity latches onto the realization of psychology (which could have been Z2), creating a gap between biological origin and modal possibility.

  (d) If that feature is removed, the divergence collapses. If neural tissue is also mosaic (a 50/50 mix of Z1 and Z2), Origin Essentialism cannot easily privilege one gamete pair over the other, forcing a concession to mixed origins or indeterminacy, while Functional Continuity would still track the psychology but lose the clear counterfactual where Z2 alone supports it. If Z2 contributes nothing (no chimerism), both theories converge on Z1 as the sole origin, eliminating the modal disagreement entirely. The divergence requires the specific asymmetry where the mind and body tell different genetic stories.

  (e) A defender of origin essentialism would attack the case by arguing that separating genetic origin from functional realization illicitly treats the organism as a mere vehicle for psychology. They would contend that persons are fundamentally biological organisms, not disembodied psychological trajectories, and thus the essential origin must be the biological organism's beginning, not just the brain's genetic source. Taking a definite position, this separation relies on a hidden stipulation about what counts as the organism's essential origin. It undermines Origin Essentialism only if one accepts the prior stipulation that personal identity is exclusively psychological; however, if one accepts the essentialist premise that persons are identical to human organisms, the thought experiment fails to refute essentialism because the organism's origin remains the chimeric event involving Z1, regardless of where specific cell lines migrate. The divergence is therefore not a genuine metaphysical counterexample but a consequence of Functional Continuity defining the person in a way that excludes the biological unity essential to Origin Essentialism.
