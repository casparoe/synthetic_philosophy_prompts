prompt: |-
  I run this little repair cafe out of my garage every saturday, and lately we've been getting into these situtions where a fix just keeps getting worse and we can't tell if we should bail or keep going. I was reading about that dollar auction game where people bid on a dollar bill and end up spending like $20 just so they don't lose, and it clicked that's exactly what happens when we've already sunk three weekends into a broken dishwasher — we keep going not because it makes sense but because quitting feels like admitting defeat in front of everyone. But I also realized it's not just about the parts we've already bought; it's about not wanting to look like the person who gives up when other volunteers are watching, which feels like the same social trap as the auction, plus there's the thing where we've already told the owner we'll have it done by next week.

  So I want an actual decision procedure me and my co-volunteers can run when we're standing around a dead appliance, something we can do in five minutes without pulling out a textbook. It needs the questions in order, what counts as a yes or no at each step, where it just stops and says quit, and where we have to actually talk about values because it's not a math problem anymore. The hard parts I need it to cover are: when the owner is standing right there expecting us to finish, when we've already promised people we'll get it done, when quitting means eating $40 in donated parts, and when there's that weird peer-pressure thing where nobody wants to be the first one to suggest giving up. Please build it out of whatever that auction theory actually says about escalation, but keep it usable by people who don't know the theory, and flag the spots where no checklist can decide for us — especially around whether it's okay to break a promise if the math says quit.

  Then run it on two cases we're facing: first, a washing machine where we've already replaced the motor and the drum seal but now the control board is dead and the replacement is backordered for three months; second, an old tube radio some guy brought in because his dad built it — we've put in about 6 hours and cheap parts but it's still silent, and he's coming back next saturday expecting music. Show me where the procedure gives us an answer we won't like, and be honest about which steps are just judgment calls dressed up as rules.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Context:** A volunteer-run repair cafe in a garage.
      *   **Problem:** Sunk cost fallacy / Escalation of commitment (Dollar Auction dynamic). Volunteers keep fixing broken items past the point of rationality due to social pressure, pride, promises made, and fear of admitting defeat.
      *   **Goal:** A 5-minute decision procedure (checklist/flowchart style) for volunteers to decide whether to continue or quit on a repair.
      *   **Key Constraints:**
          *   Must be usable by non-experts (no game theory jargon).
          *   Must address specific pain points: Owner present, promises made, wasted parts ($), peer pressure.
          *   Must highlight where judgment is required (where math stops and values start).
          *   Must apply the procedure to two specific cases (Washing Machine, Tube Radio).
          *   Must be honest about "unpleasant answers" and "judgment calls dressed as rules."

  2.  **Deconstruct the "Dollar Auction" Theory for this Context:**
      *   *The Trap:* Rational actors bid $0.99 and $1.00 for a $1 bill. Then $1.01 to avoid losing $1.00. Escalation continues.
      *   *The Driver:* Loss aversion + Social signaling (not wanting to look like a loser/quitter).
      *   *The Escape:* Pre-commitment to a limit, separating sunk costs from future costs, redefining "winning" (learning vs. fixing).
      *   *Application:* The procedure needs to force a "Future Cost vs. Future Value" assessment, ignoring past effort. It needs to normalize quitting as a valid outcome.

  3.  **Drafting the Decision Procedure (The "Stop-Light Protocol"):**
      *   *Name:* Needs to sound practical, not academic. "The 5-Minute Bailout Check" or "The Repair Cafe Stop-Light." Let's go with "The 5-Minute Bailout Protocol."
      *   *Structure:* Sequential questions. Yes/No paths.
      *   *Step 1: The Hard Stop (Safety/Feasibility).* If it's dangerous or impossible, stop.
      *   *Step 2: The Future Cost (Time/Parts).* Ignore the past. What does it take *now*?
      *   *Step 3: The Future Value.* What does the owner get?
      *   *Step 4: The Social/Promise Check.* This is the tricky part. Addressing the "Dollar Auction" social pressure.
      *   *Step 5: The Verdict.* Go or No-Go.
      *   *Flagging Judgment:* I need to explicitly mark where the checklist can't decide (e.g., breaking a promise).

  4.  **Refining the Steps (incorporating the prompt's specific requirements):**
      *   *Sunk Costs:* Explicitly tell them to ignore the $40 parts and 3 weekends.
      *   *Social Pressure:* Include a "Devil's Advocate" role rotation to mitigate peer pressure.
      *   *Promises:* Address the ethics of breaking a promise vs. wasting more resources.
      *   *Owner Presence:* How to handle the conversation.

  5.  **Developing the Two Cases:**
      *   *Case 1: Washing Machine.*
          *   Sunk: Motor, seal, time.
          *   Blocker: Control board backordered 3 months.
          *   Verdict: Likely Quit (Time cost too high, utility low).
      *   *Case 2: Tube Radio.*
          *   Sunk: 6 hours, cheap parts.
          *   Value: Sentimental (Dad built it).
          *   Blocker: Still silent, diagnosis unclear.
          *   Verdict: Tricky. Math says quit, Value says maybe continue. This highlights the "Judgment Call" zone.

  6.  **Writing the Content - Section by Section:**

      *   *Introduction:* Acknowledge the "Dollar Auction" insight. Validate their experience.
      *   *The Protocol:* Create the step-by-step guide. Use bolding for clarity. Insert "⚠️ JUDGMENT ZONE" markers where appropriate.
      *   *The "Escape Clauses":* Specific scripts for handling the owner and the volunteers.
      *   *Case Study 1 (Washing Machine):* Run the protocol. Show the "No-Go" result.
      *   *Case Study 2 (Tube Radio):* Run the protocol. Show the conflict between Math and Sentiment.
      *   *Honest Reflection:* Discuss the limitations. Where is the checklist lying to us? (e.g., "Is breaking a promise okay?")

  7.  **Review against Constraints:**
      *   *5 minutes?* Yes, the questions are direct.
      *   *No textbook?* Yes, language is plain English.
      *   *Addressed specific pain points?* Yes (owner, promises, parts, peer pressure).
      *   *Flagged judgment spots?* Yes, marked clearly.
      *   *Honest about unpleasant answers?* Yes, specifically in the radio case.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is the protocol too rigid?
      *   *Fix:* Add a "Values Override" step at the end. Sometimes sentiment *should* win, but it must be a conscious choice, not a slide.
      *   *Critique:* How to handle the peer pressure?
      *   *Fix:* Institute a "Red Card" rule. Any volunteer can call for the protocol without being the "quitter."
      *   *Critique:* The prompt asks to build it out of auction theory.
      *   *Fix:* Ensure the rationale explains *why* we ignore sunk costs (the bid already placed doesn't matter, only the next bid).

  9.  **Final Polish:** Check tone. Needs to be empathetic but firm. Like a seasoned mechanic talking to an apprentice. (Proceed to generate output based on this thought process).

  *(Self-Correction during final output generation)*: Make sure I explicitly answer the "breaking a promise" ethical dilemma. The checklist can't solve ethics, it can only frame the trade-off. I need to be clear about that.

  10. **Final Output Structure:**
