answer: |-
  **Mara:** You're not going in? The facilitator said they're opening the floor on the flood mitigation line item in ten minutes.

  **Jo:** I'm waiting to see if the smoke clears. Literally and figuratively. Did you read the briefing packet? The climate engineers are projecting a one-in-fifty-year surge. The residents' coalition is saying the old drainage culverts under the East Ward can handle double that if they're cleared out. The models don't match the memory.

  **Mara:** Exactly. That friction is the point. You're looking at it like a bug; I'm looking at it like a feature. Inside that room, you've got competing hypotheses about hydraulic reality being tested against competing hypotheses about social need. The engineers say, "Barrier prevents damage." The residents say, "Cash enables adaptation." It's not a town hall, Jo. It's a laboratory.

  **Jo:** It's a budget meeting, Mara. People are asking for resources, not truth. Calling it a laboratory is a category mistake. A lab requires controls. It requires falsifiability. If you build the wall and the water rises, the engineers will blame anomalous precipitation. If you give the cash and the water rises, the residents will blame insufficient funds. There's no way to lose the argument. Without a shared success metric—like predictive accuracy—you don't have inquiry. You have adversarial bargaining masked as reason-giving.

  **Mara:** That's a positivist fantasy. You think social life yields to a control group? We can't flood half the neighborhood to test the barrier. Dewey never claimed democracy was physics. He claimed it was *intelligence* applied to collective problems. The disagreement between the hydrologists and the grandmothers who remember the '98 flood isn't noise to be filtered out before the real work begins. It's the data. Holding those tensions in the open is how we reconstruct the problem.

  **Jo:** But how do you know you've learned anything? In science, if the prediction fails, the hypothesis dies. Here, if the prediction fails, the coalition just renegotiates the narrative. You call it "reconstruction," I call it spinning. If there's no mechanism to say "this claim was objectively wrong," then "experiment" is just a metaphor for "we tried something and now we're stuck with the consequences."

  **Mara:** You're ignoring the error-correction mechanisms built into the process. We're not looking for replication; we're looking for *instiutional* reflexivity. Look at the proposal. The flood barrier has a five-year sunset clause tied to a participatory audit. If the water levels breach the threshold, or if the maintenance costs balloon, the funding terminates. We redesign. That's how we correct errors. Not by replicating the trial in a vacuum, but by iterating the policy in the wild.

  **Jo:** Those are political checks, Mara. Not epistemic ones. A sunset clause just means the losers get another bite at the apple in five years. It doesn't tell us whose knowledge was warranted. And that's my worry about your Deweyan move. You're smuggling normative commitments in under the guise of method. You want "participatory audit" to count as peer review because it sounds nice, but unless that audit prioritizes predictive accuracy over, say, "community satisfaction," you haven't got inquiry. You've got voting.

  **Mara:** Why is predictive accuracy the only god? If the barrier stands but destroys the social fabric of the waterfront because it cuts off access, the engineering hypothesis was "true" regarding water but "false" regarding the public good. The audit measures the *consequences* of the action, which is the only truth that matters in pragmatism. The residents' knowledge about the drainage isn't just anecdotal; it's longitudinal data that the models missed. By forcing the engineers to answer to that data in a public forum, you're subjecting their models to a stress test they'd never face in a journal.

  **Jo:** A stress test, sure. But who grades the test? If the "audit" is conducted by the same people who demanded the cash transfers, they'll grade based on whether they got paid, not whether the flood risk was mitigated. I'm not saying democracy is worthless. It's essential for legitimacy. But don't confuse rhetorical pluralism with epistemic progress. Just because everyone gets to speak doesn't mean the group gets smarter. Sometimes it just means the loudest hypothesis wins.

  **Mara:** And sometimes the loudest hypothesis gets humbled by the river. That's the ultimate peer review. But we don't have to wait for the disaster to learn. The deliberation *is* the learning. When the engineer has to explain her risk assessment to a resident who knows where the puddles form, her model gets refined. That's knowledge production. It's messy, it's value-laden, but it's the only way we get warranted assertability on public goods.

  **Jo:** "Warranted assertability." I miss the days when we just called it "guessing with extra steps."

  **Mara:** *(laughs)* Look, the door's opening. Come inside. Watch the engineers try to defend their models against Mrs. Gable from the East Ward. She's got thirty years of photos of water lines on her garage. Tell me that's not data.

  **Jo:** It's data. But until you have a method to weigh her photos against their LiDAR scans without it turning into a power struggle, it's not science. It's politics.

  **Mara:** Maybe. But it's *our* politics. And we're going to have to live with the results. That accountability has to count for something.

  **Jo:** It counts for survival. Doesn't mean it counts for truth.

  **Mara:** In a flood zone, Jo, survival is the only truth that matters.

  *(They stub out their cigarettes and head for the entrance.)*
