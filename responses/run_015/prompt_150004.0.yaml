answer: |-
  # QUESTION-PERIOD PREPARATION SHEET

  ## PART I: EIGHT LIKELY OBJECTIONS

  ### 1. The Impatient Experimentalist (Younger Development Economist)
  **Objection:** "You're asking us to dig through archives for 'matched episodes' when we can randomize governance interventions today. History is noisy and uncontrolled. Why shouldn't we just ignore this and run RCTs on local councils?"
  **Damage if mishandled:** **High.** Dismisses your constructive half as obsolete before you finish the sentence.
  **Reply:** "RCTs measure compliance over two years; development is about accumulation over fifty. An RCT can tell you if a monitoring app increases teacher attendance today. It cannot tell you if that attendance rule, sustained over decades, alters investment incentives or state capacity. My matched episodes are the only data we have on the long-run equilibrium effects of rule changes. You need both: RCTs for mechanics, history for trajectories."
  **Soft Spot:** You cannot prove the historical episodes are comparable to modern interventions; the external validity cuts both ways.

  ### 2. The Identification Purist (Senior Economic Historian #1)
  **Objection:** "You claim your matched episodes isolate rule changes, but the decision to change the rule is never random. You're selecting on the very endogeneity you claim to solve. Where is the exogenous shock?"
  **Damage if mishandled:** **Critical.** Undermines the causal claim of the entire paper.
  **Reply:** "I am not claiming the *choice* to reform is exogenous. I am claiming the *difference* in implementation between adjacent, similar pairs is often driven by idiosyncratic political bargaining or colonial administrative accidents unrelated to economic potential. We instrument for the *intensity* of the rule change within the pair using archival data on personnel rotations or budget shocks, not the decision to reform itself."
  **Soft Spot:** Finding valid instruments for implementation intensity within pairs is empirically difficult and may look weak in practice.

  ### 3. The Structuralist (Senior Economic Historian #2)
  **Objection:** "Heterogeneity without a structural model is just a histogram of noise. If the effect varies wildly, you haven't found a parameter; you've found a story for every outcome. How do I know which bin my country falls into?"
  **Damage if mishandled:** **High.** Makes your constructive proposal look like descriptive storytelling rather than science.
  **Reply:** "The heterogeneity isn't noise; it's structured by observable politics. We show the effect depends on whether the rule was bargained or imposed, and whether a vested group lost power. These are observables. I'm not offering a single parameter; I'm offering a decision tree. You know which bin you're in by looking at the political settlement, not by guessing."
  **Soft Spot:** Classifying a current political settlement into those historical categories is subjective and prone to researcher bias.

  ### 4. The Determinist (Quantitative Geographer)
  **Objection:** "You match on observables, but disease ecology and soil suitability vary at a finer grain than your administrative units. You haven't eliminated geography; you've just averaged it. The omitted variable is still there."
  **Damage if mishandled:** **Medium.** Resurrects the geography critique you thought you killed in the destructive half.
  **Reply:** "Geography is largely time-invariant. By looking at *divergence* in growth rates after the rule change, rather than levels of income, we difference out the fixed geographic endowment. If geography were the driver, the pairs wouldn't diverge when the rules changed. They do."
  **Soft Spot:** Time-varying geographic shocks (climate change, soil depletion, new disease vectors) are not differenced out and could correlate with rule changes.

  ### 5. The Deep Cause Theorist (Cultural Economist)
  **Objection:** "You say the effect depends on whether the rule was 'bargained.' But who gets to bargain is determined by trust and norms. You haven't isolated institutions; you've just measured culture crystallizing into rules."
  **Damage if mishandled:** **Medium.** Blurs the distinction between your mechanism and the culturalist alternative.
  **Reply:** "Even if culture drives the bargaining, the *rule change* is the mechanism that alters payoffs. A high-trust society that imposes a rule without bargaining still fails in my data. The policy lever is the rule design, not the deep culture. You can't change culture quickly; you can design the bargaining process."
  **Soft Spot:** If culture determines the bargaining process, you cannot exogenously vary the bargaining process without changing culture first.

  ### 6. The Skeptic (Philosopher of Social Science)
  **Objection:** "If every episode is unique and the effect depends on the specific distribution of losers and winners, you have no general law. You are doing historiography, not economics. What exactly is falsifiable here?"
  **Damage if mishandled:** **Medium.** Challenges the scientific status of your proposal.
  **Reply:** "The law is about the variance, not the mean. The falsifiable claim is that the distribution of effects is wide and structured, not narrow and universal. If I show you a hundred pairs where the effect is identical regardless of politics, I am wrong. If I show you the variance is unpredictable, I am wrong. I am estimating a distribution of causal effects, which is a stable object."
  **Soft Spot:** If the distribution itself changes over time (non-stationarity), the historical distribution predicts nothing about the future.

  ### 7. The Data Miner (Younger Development Economist #2)
  **Objection:** "You assembled a few hundred pairs. How many did you look at before you found these? This looks like selection on the dependent variable—finding pairs that diverged and ignoring those that didn't."
  **Damage if mishandled:** **High.** Accusation of p-hacking via historical selection.
  **Reply:** "We define the universe of pairs based on pre-existing administrative boundaries and colonial records, not on outcome divergence. We include pairs that remained similar despite rule changes, and pairs that diverged without them. The dataset is posted; the selection rule is algorithmic, not narrative."
  **Soft Spot:** Defining the 'universe' of possible pairs involves subjective historical judgments about comparability that can be tweaked.

  ### 8. The Practitioner (Head of Aid Agency)
  **Objection:** "You say the average effect carries zero weight. Does that mean I should stop funding rule-of-law reforms? I need one usable sentence for my board."
  **Damage if mishandled:** **Critical.** Aliens the funding source and makes the research seem irrelevant.
  **Reply:** "Do not stop funding, but stop standardizing. Do not fund 'rule of law' as a generic package. Fund rule changes only where you can verify there is a domestic coalition that bargained for them and where losers are compensated. If it's imposed from outside, don't fund it. That is the usable sentence."
  **Soft Spot:** Verifying the 'bargained' nature of a reform is politically sensitive and often impossible for an external donor to ascertain honestly.

  ---

  ## PART II: STRATEGIC CONCESIONS & DEFENSES

  ### Two Objections to Concede from the Podium
  *Do not wait for these to be asked. Pre-empt them in your conclusion to disarm critics.*

  1.  **Concede to the Aid Agency (Policy Paralysis):** Admit that saying the average carries "zero weight" is rhetorically too strong. Concede that the average provides a *prior*, but emphasize that the *variance* dominates the decision. This softens the blow for practitioners without sacrificing the core argument.
  2.  **Concede to the Structuralist (Heterogeneity Model):** Admit that your current classification of "bargained vs. imposed" is a reduced-form proxy for a deeper political economy model. Promise that the next iteration will formalize the bargaining game. This signals you respect structural modeling without needing to solve it today.

  ### The Single Claim to Refuse to Give Up
  **The "Different Quantities" Claim:** Maintain aggressively that the Institutionalists, Geographers, and Culturalists are estimating *different local average treatment effects* driven by different instruments, not rival estimates of the same global parameter. Do not allow them to frame the debate as "who is right." The debate is "which counterfactual matters." This is the core of your destructive thesis.

  ### The Weakest Joint to Prepare to Defend
  **Ex-Ante Classification:** The room will press you on how a reformer knows *beforehand* if a reform is "bargained" or "imposed" or if the "losers" are organized. This is the bridge between your historical finding and current policy. Prepare a concrete checklist of observable indicators (e.g., legislative voting records, protest data, coalition composition) that proxies for these historical categories. If you cannot operationalize this, your constructive half collapses.

  ### The One Question You Hope Nobody Asks
  **"Show me the out-of-sample prediction."**
  *"You fit this distribution on historical data. Can you name one specific country in the last 10 years where your method would have predicted a reform failure that the standard IV literature predicted as a success? If not, how is this better than just saying 'it depends'?"*
  **Why it hurts:** It exposes that your method may be a sophisticated description of the past without proven predictive power for the future. If you don't have a concrete case study ready, you look like you're selling historiography as policy science.
