answer: |-
  You have put your finger on a precise and difficult knot in practical ethics and decision theory. You are correct that the standard labels (incommensurability, pluralism) do not quite fit because they usually describe conflicts *within* a worldview, whereas you are describing conflicts *between* worldviews about the architecture of choice itself.

  There is no single established noun that captures the entire institutional phenomenon you describe. However, the components are well-identified in a specific subfield of philosophy that has matured over the last fifteen years.

  ### 1. The Literature and Placement

  The field is **Normative Uncertainty** (sometimes called **Moral Uncertainty**).

  This field asks: *How should an agent decide when they are uncertain about which moral theory is true?* Your examples are institutional versions of this: the institution is the "agent," and the competing stakeholders represent credences in different moral theories.

  Within this literature, your two features have specific technical names:

  *   **Feature 1 (The Menu):** This is the **Problem of Act Individuation**. Frameworks disagree on what counts as an "act." To a utilitarian, "spending 50% on present and 50% on future" is a single option with a specific expected utility. To a deontologist who believes one has a strict duty to the present, that same option might be categorized as "violating the duty to the present," which is a binary status (forbidden/permissible) rather than a scalar one. Aggregation requires a common menu of acts; if the theories cannot agree on how to individuate the acts, the menu is not neutral.
  *   **Feature 2 (The Weights):** This is the **Problem of Intertheoretic Comparison**. As you noted, utilitarianism measures in "utils" (welfare units), while rights-based theories measure in "violations" or "stringency." There is no exchange rate. If you decide that "one rights violation equals 1,000 utils," you have already made a moral judgment that privileges the structure of one theory over the other.

  The "wrinkle" you identify (that frameworks disagree on how to handle the disagreement) is known as **Metanormative Disagreement** or **Metanormative Regress**. Some theories (like "My Favorite Theory") say "follow the most probable theory." Others (like "Maximizing Expected Choice-Worthiness") say "aggregate." If you choose the aggregation procedure, you have already rejected the "My Favorite Theory" framework.

  ### 2. Naming the Phenomenon

  Since there is no single word for the *institutional habit* of masking this problem via compromise, I propose you use the technical term for the underlying impossibility, and a descriptive label for the behavior.

  **The Technical Term:** **The Problem of Intertheoretic Comparison** (combined with **Metanormative Circularity**).

  **The Journalistic Label:** **The Neutrality Fallacy** or **Procedural Begging**.

  The phenomenon is this: **The assumption that a decision procedure can be neutral with respect to the moral frameworks it is designed to adjudicate.**

  It stops being this phenomenon when the competing frameworks share a **common metric of value** and a **common ontology of action**.
  *   *Boundary Case (Not this phenomenon):* Two utilitarians disagreeing on whether a policy will save 100 or 200 lives. They agree on the metric (lives/welfare) and the option space (policy A vs. B). Aggregation (averaging the estimates) is unproblematic here.
  *   *Boundary Case (This phenomenon):* A utilitarian and a deontologist deciding on the same policy. One sees "lives saved," the other sees "rights violated." Aggregation requires converting rights to lives, which begs the question.

  ### 3. Is There an Immune Procedure?

  You asked: *"Is there any procedure that is immune to it?"*

  The honest answer, which you may find useful for your piece, is **No.**

  If the frameworks disagree on the procedure (as you noted in your "wrinkle"), then *choosing any procedure* validates some frameworks and violates others. There is no "view from nowhere" to select a voting system for moral theories.

  However, your embryonic idea is the closest thing to a solution that exists in the literature. It is called **Pareto Conditions** or **Robustness**.

  *   **The Principle:** An option is only choosable if it is permissible (or optimal) across *all* credible moral frameworks, under *all* admissible scalings.
  *   **The Result:** This does not tell you what to *do*; it tells you what you *cannot* do. It drastically shrinks the decision space.
  *   **The Outcome:** In the hard cases you describe (foundation grants, ethics committees), this procedure typically leaves **nothing settled**. It results in **Moral Stalemate**.

  This is actually a feature, not a bug. The "compromise" solutions you observed (splitting the portfolio, the redacted publication) are often attempts to *escape* the stalemate by pretending the frameworks are commensurable. A robust procedure would admit that there is no morally defensible choice that satisfies the constraints of all parties, and therefore the institution should either:
  1.  Not act (preserve the status quo).
  2.  Acknowledge that it is privileging one framework over the other (political honesty).

  ### 4. A Coinage for Your Piece

  If you need a tight definition for your readers that distinguishes this from ordinary disagreement, I suggest coining: **Metanormative Presupposition.**

  **Definition:** A decision is subject to Metanormative Presupposition when the method used to resolve a moral disagreement implicitly assumes the truth of one of the contested moral frameworks, specifically regarding how options are individuated or how values are scaled.

  **Boundary Case (Looks like it, but isn't):**
  *   *The Case:* A city council deciding between building a park or a parking garage. One group says "Parks improve mental health," the other says "Garages improve commerce." They agree to a cost-benefit analysis.
  *   *Why it isn't:* Both sides accept "social welfare" (measured in money/utility) as the common metric. They disagree on empirical inputs (how much mental health vs. commerce), not on the moral ontology. This is empirical uncertainty, not normative uncertainty.

  **Boundary Case (It is this):**
  *   *The Case:* A university deciding whether to accept funding from a fossil fuel company to study climate mitigation.
  *   *Why it is:* One framework says "Take the money, the research reduces harm" (consequentialist). The other says "Do not associate with polluters, it legitimizes them" (expressivist/deontological).
  *   *The Presupposition:* If the committee votes on it, they treat "legitimization" as a cost to be weighed against "research output." But for the expressivist, legitimization is not a cost; it is a prohibition. The voting procedure presupposes the consequentialist framework.

  ### 5. Summary for Your Argument

  1.  **The Field:** Normative Uncertainty.
  2.  **The Core Problem:** Intertheoretic Comparison and Act Individuation.
  3.  **The Institutional Error:** The Neutrality Fallacy (assuming aggregation procedures are framework-neutral).
  4.  **The "Solution":** Robustness/Pareto constraints.
  5.  **The Catch:** Robustness usually leads to paralysis in hard cases. The "compromises" you see are not solutions; they are disguises for the paralysis, achieved by silently imposing one framework's scaling on the others.

  For your piece, the most powerful insight is that **procedural neutrality is impossible.** When an institution claims to be "balancing" these views, it is usually smuggling in a conversion rate that one side rejects. The only honest response is to admit that the procedure itself is a moral choice that will alienate one of the frameworks.
