answer: |-
  Here is a menu of distinct interpretations of the slogan 'truth is what works', ordered from the trivial to the substantive and finally to the untenable. For each, I have specified the operative sense of 'works', the type of philosophical claim being made, and how it handles your two counter-examples.

  ### 1. The Empirical Correlation Thesis
  *   **What 'works' means:** Practical success in navigation and prediction.
  *   **Whose purposes/Timescale:** Any agent, immediate to medium term.
  *   **Type of claim:** An empirical generalisation about the world (not a definition of truth).
  *   **Status:** **Trivial.**
  *   **Proponents' intent vs. Scrutiny:** Nobody actually defends this as a *theory* of truth, but it is often what people have in mind when they nod at the slogan casually. It survives scrutiny only because it makes no strong metaphysical claims. It says merely that, as a matter of fact, holding true beliefs tends to help us get what we want.
  *   **Payoff:**
      *   *Dead Language:* Irrelevant. The sentence may be true or false; the thesis merely notes that *if* we knew it, it might help us (or not). It does not deny the sentence has a truth value.
      *   *Blind Spot:* Irrelevant. Even if we are blinded to the truth, the thesis allows that the false hypothesis might 'work' for us temporarily. It does not define the false hypothesis *as* true.

  ### 2. The Epistemic Criterion Thesis
  *   **What 'works' means:** Survival under testing, coherence with experience, and instrumental reliability.
  *   **Whose purposes/Timescale:** Inquirers like us, indefinite present.
  *   **Type of claim:** Epistemic/Normative (a claim about *warrant* or *justification*, not the *nature* of truth).
  *   **Status:** **Contentious but Defensible.**
  *   **Proponents' intent vs. Scrutiny:** This is often what careful pragmatists mean when pressed. They are not defining truth; they are offering a criterion for *assertibility*. We have no access to 'Truth' with a capital T other than through what works. This survives scrutiny by conceding that truth might outstrip our verification, while denying we can meaningfully discuss it.
  *   **Payoff:**
      *   *Dead Language:* Preserves the truth value. The sentence is true or false, but we can never be *justified* in claiming to know which. The classmate's dismissal is incorrect on this reading; the question is genuine, but the answer is unknowable.
      *   *Blind Spot:* Distinguishes truth from warrant. In the blind spot scenario, we are *warranted* in believing the false hypothesis (because it works), but it remains *false*. This reading saves the objectivity of truth at the cost of making it permanently inaccessible.

  ### 3. The Verificationist Semantic Thesis
  *   **What 'works' means:** Making a tangible practical difference to experience.
  *   **Whose purposes/Timescale:** Any possible verifier, any time.
  *   **Type of claim:** Semantic/Meaning (a claim about truth-aptness).
  *   **Status:** **Contentious (and largely abandoned).**
  *   **Proponents' intent vs. Scrutiny:** This reading suggests that if a proposition makes no difference to practice, it lacks meaning, and therefore cannot be true or false. This was popular in early logical positivism and influences some pragmatist readings. It is contentious because it seems to rule out legitimate discourse about the past or the unobservable.
  *   **Payoff:**
      *   *Dead Language:* Delivers your classmate's conclusion. If the sentence makes no difference to any possible experience, it is not truth-apt. There is no 'truth of the matter' to be had.
      *   *Blind Spot:* Dissolves the problem. If the true hypothesis is permanently inaccessible and makes no difference to our experience compared to the false one, the two hypotheses are semantically equivalent. There is no 'blind spot', only a verbal distinction without a difference.

  ### 4. The Peircean Constitutive Thesis
  *   **What 'works' means:** Withstanding all criticism and evidence in the long run.
  *   **Whose purposes/Timescale:** The community of investigators, the indefinite limit of inquiry.
  *   **Type of claim:** Metaphysical/Constitutive (a claim about the *nature* of truth).
  *   **Status:** **Substantive and Defensible (with caveats).**
  *   **Proponents' intent vs. Scrutiny:** This is Peirce's actual view. Truth is not what works *now*, but what *would* be agreed upon if inquiry were pushed to the absolute limit. It is a realist view: reality constrains inquiry. It survives scrutiny better than James's view, but it relies on a hopeful metaphysical assumption that reality is intelligible and inquiry is self-correcting.
  *   **Payoff:**
      *   *Dead Language:* Problematic. If the language is dead, inquiry is impossible. Peirce might argue we must consider *counterfactual* inquiry (if speakers existed, what would they agree on?). If no inquiry is even counterfactually possible, Peirce may have to concede there is no truth here, or that truth is independent of actual inquiry but defined by *ideal* inquiry.
      *   *Blind Spot:* This is the critical weakness you identified. If our cognitive equipment guarantees we converge on the false hypothesis, then on this definition, the false hypothesis *is* the truth. Peirce would likely reject the scenario as impossible (arguing that reality *must* eventually force itself upon us), but if the scenario is possible, this reading makes truth dependent on our cognitive contingencies.

  ### 5. The Jamesian Reductionist Thesis
  *   **What 'works' means:** Satisfying psychological, moral, or social needs (expediency).
  *   **Whose purposes/Timescale:** The individual believer, the present moment.
  *   **Type of claim:** Metaphysical/Reductionist (truth *just is* utility).
  *   **Status:** **Plainly False (as a general theory).**
  *   **Proponents' intent vs. Scrutiny:** This is the 'vulgar' reading of James. While James was nuanced, this slogan taken literally implies that a comforting lie is true. It fails scrutiny because it conflates the *goodness* of a belief with its *truth*. It allows two contradictory beliefs to be 'true' simultaneously if they work for different people.
  *   **Payoff:**
      *   *Dead Language:* Delivers the classmate's conclusion aggressively. No utility = no truth.
      *   *Blind Spot:* Forces the verdict that the false hypothesis is true. If the false hypothesis helps us survive or feel better, it is true. This makes truth radically relative and subjective, which most philosophers (including Peirce) reject.

  ***

  ### Synthesis and Conclusion

  **Does the disambiguation help?**
  Yes. Your seminar's difficulty arises because the slogan 'truth is what works' slides between **Thesis 2** (Epistemic Criterion) and **Thesis 4/5** (Constitutive).
  *   When your classmate dismissed the dead-language sentence, they were relying on **Thesis 3** (Verificationism) or **Thesis 5** (Jamesian Reduction). They assumed that no practical difference entails no truth value.
  *   When you raised the blind-spot objection, you successfully targeted **Thesis 4** (Peircean Constitutive). You showed that if truth is *defined* by the limit of inquiry, then a permanent cognitive limitation collapses truth into whatever falsehood we are stuck with.

  **Peirce vs. James: One Doctrine or Two?**
  The disambiguation reveals that Peirce and James are **genuinely different views** travelling under the same slogan.
  *   **Peirce** is a realist. For him, 'what works' (in the long run) is a *symptom* of truth, caused by the resistance of an independent reality. He would reject the idea that truth depends on our cognitive equipment; rather, he assumes our equipment is capable of aligning with reality eventually. He fits **Thesis 4**.
  *   **James** is more of an instrumentalist (and at times, a subjectivist). For him, truth is made in the process of successful living. He is more willing to accept **Thesis 5**, or at least to blur the line between truth and utility.

  **Recommendation for your paper:**
  Your strongest line of argument is to insist that the slogan must be read as **Thesis 2 (Epistemic Criterion)** to be defensible, but that this reading abandons the ambition of defining truth. If the pragmatist wants to define truth (**Thesis 4**), they must bite the bullet on the blind-spot case or argue (as Peirce did) that the scenario is metaphysically impossible. If they want to dismiss the dead-language case (**Thesis 3**), they must defend a verificationist theory of meaning, which carries its own heavy costs. The slogan 'truth is what works' is only plausible because it hides these distinct commitments behind a single ambiguous phrase.
