answer: |-
  This is an exceptionally sharp diagnosis of the current state of the literature. You have correctly identified that the "hardware/software" metaphor is a pedagogical tool that obscures the metaphysical heavy lifting required to make Multiple Realizability (MR) do the work non-reductive physicalists want it to do.

  Below is the specification you requested. I have organized your six points into five consolidated constraints on an adequate theory of realization, evaluated their status, identified the critical conflict, tested your suspicion regarding equivocation, and provided the scorecard.

  ### I. The Specification: Five Constraints on Realization

  To serve the dual jobs of refuting Type-Identity and adjudicating unfamiliar cases, a theory of realization must satisfy the following constraints.

  **1. The Non-Triviality Constraint (Your Point 1)**
  *   **Requirement:** The theory must specify a principled restriction on admissible causal-role descriptions. It cannot be the case that *any* physical state realizes *any* mental state under *some* description. The relation must be asymmetric and irreflexive in the relevant contexts.
  *   **Consideration:** Without this, MR is true by definition ("cheap realization"). If any physical state can be mapped to any mental state via a gerrymandered disjunction or arbitrary mapping, MR refutes Type-Identity trivially but also renders psychology vacuous. It must explain why a rock does not realize a pain state under a normal specification.
  *   **Status:** **Non-Negotiable.** Any theory that fails this is not a theory of realization; it is a theory of arbitrary mapping.

  **2. The Determinacy Constraint (Your Point 2)**
  *   **Requirement:** The theory must account for borderline cases (damage, degradation, evolutionary intermediates) without relying on purely stipulative thresholds. It must explain whether realization admits of degrees and, if so, whether there is a metaphysical or merely pragmatic cutoff for state attribution.
  *   **Consideration:** Biological and artificial systems are noisy. If realization is all-or-nothing, most real-world systems fail to realize anything. If it is degreed, we need to know when the degree is sufficient for moral status or theoretical attribution.
  *   **Status:** **Non-Negotiable.** A theory that cannot handle degradation cannot handle the actual systems we study (brains, AI).

  **3. The Autonomy Constraint (Your Point 3)**
  *   **Requirement:** The specification of the "causal role" must not presuppose the identity of the mental state it is supposed to realize. We must be able to characterize the role independently of the specific physical realizer, yet without circularly defining the role via the mental term itself.
  *   **Consideration:** To avoid circularity, the role is usually defined by its relations to inputs, outputs, and other internal states. If the role is defined too thinly, we get Triviality (Constraint 1 failure). If defined too thickly (using mental terms), we lose the physicalist reduction base.
  *   **Status:** **Prejudice of Non-Reductive Physicalism.** A reductive functionalist (like Lewis) might accept a degree of circularity (analytic functionalism), arguing that the role *is* the meaning of the term. However, for MR to do *anti-reductionist* work, this constraint is effectively non-negotiable.

  **4. The Causal Efficacy Constraint (Your Point 4)**
  *   **Requirement:** The realized mental state must have causal powers that are not simply identical to the causal powers of the realizing physical state, yet the theory must not violate the causal completeness of physics (no overdetermination).
  *   **Consideration:** If the physical realizer does all the work, the mental state is epiphenomenal. If the mental state does distinct work, physics is incomplete. A theory of realization must explain how the mental state inherits or shares powers without being a ghostly add-on.
  *   **Status:** **Non-Negotiable** (for any view that wishes to preserve mental causation). This is where most accounts fail.

  **5. The Empirical Tractability Constraint (Your Points 5 & 6)**
  *   **Requirement:** The theory must provide criteria for identifying realization in "black box" systems (e.g., deep learning, octopuses) that do not rely on prior knowledge of the system's physical constitution. It must allow comparison across competing psychological theories.
  *   **Consideration:** If we can only identify realizers by knowing the physics first, MR is empirically empty. We need to be able to say "this silicon chip realizes pain" based on its functional organization, not just because we decided to map it that way.
  *   **Status:** **Non-Negotiable.** Philosophy of mind must be continuous with cognitive science.

  ---

  ### II. The Workhorse Requirement

  **The Non-Triviality Constraint (Constraint 1)** does the most work in excluding candidate theories.

  Many theories start strong on Causal Efficacy or Empirical Tractability but collapse because they cannot explain why the realization relation isn't universal. For example, simple mapping accounts fail here immediately. Even sophisticated functionalist accounts struggle here: if the causal role is defined abstractly enough to allow silicon and neurons to both realize it, what stops a lookup table or a random number generator from realizing it under a complex mapping? The burden of explaining the *restriction* on admissible mappings is the heaviest metaphysical lift. If you solve this, you have likely solved the core metaphysical problem; if you fail this, the rest of the theory is irrelevant.

  ---

  ### III. Joint Unsatisfiability: The Conflict

  **Yes, a subset of these requirements is jointly unsatisfiable.**

  The conflict lies between **Constraint 1 (Non-Triviality)** and **Constraint 5 (Empirical Tractability/Heterogeneity)**, mediated by **Constraint 4 (Causal Efficacy)**.

  **The Conflict:**
  To satisfy **Non-Triviality**, you must restrict the admissible causal roles to specific, physically grounded structures (otherwise anything realizes anything). However, to satisfy **Empirical Tractability** and allow for **Multiple Realizability** (octopuses, AI), you must define the roles abstractly enough to ignore specific physical details.
  *   If you make the role specification **specific** (to avoid triviality), you collapse into **Type-Identity** or "Local Reductionism," losing the ability to recognize the octopus or AI as a realizer (failing Constraint 5).
  *   If you make the role specification **abstract** (to allow MR), you open the door to **Triviality** (failing Constraint 1) because abstract patterns can be found in almost any complex system (Putnam's theorem).
  *   If you try to save **Causal Efficacy** (Constraint 4) in the abstract scenario, you run into the **Exclusion Problem**: if the role is abstract, it has no physical powers of its own; if it has powers, they must be the physical powers of the realizer, rendering the mental causally redundant.

  **Where the list breaks:**
  It breaks at the intersection of **Restriction** and **Abstraction**. You cannot have a realization relation that is both *metaphysically robust* (non-trivial, causally efficacious) and *metaphysically loose* (highly multiply realizable across heterogeneous substrates) without paying a steep price. The price is usually admitting that "mental kinds" are not natural kinds in the strict sense, or that realization is a pragmatic rather than metaphysical relation.

  ---

  ### IV. Testing Your Suspicion: The Equivocation

  **Your suspicion is correct.** There is a systematic equivocation in the literature between two claims:

  1.  **Weak MR (Token Distinctness):** One and the same mental *token* could be realized by different physical *tokens* (even different types), but there may still be local psychophysical laws. (Compatible with Reductionism).
  2.  **Strong MR (Type Distinctness):** No physical *kind* is nomologically coextensive with any mental *kind*. There are no bridge laws. (Incompatible with Reductionism).

  **Should a good theory keep them apart?**
  **Yes.** A rigorous theory must distinguish them. The hardware/software analogy naturally supports Weak MR (the same software can run on different hardware). However, the argument against Type-Identity Theory requires Strong MR.

  **Does keeping them apart cost the argument anything?**
  **Yes, it costs the argument its force against reductionism.**
  If you retreat to Weak MR to avoid the metaphysical problems of Strong MR (like the Exclusion Problem), you concede the ground to **Local Type-Identity Theory**. A reductionist can say: "Fine, pain is multiply realized globally, but in humans, pain *just is* C-fiber firing, and in octopuses, pain *just is* X-fiber firing." This preserves reductionism while acknowledging heterogeneity.
  To maintain the anti-reductionist argument (Strong MR), you must argue that the *disjunction* of all physical realizers is not a projectible kind. This is much harder to defend and requires a robust theory of natural kinds, not just realization. Most contemporary debates have quietly retreated to Weak MR because Strong MR is too costly to defend against Kim-style exclusion arguments.

  ---

  ### V. Scorecard of Contenders

  **1. Type-Identity Theory**
  *   **Performance:** Fails the primary job of MR (obviously).
  *   **Critique:** It satisfies Non-Triviality and Causal Efficacy perfectly but fails Empirical Tractability for unfamiliar systems (cannot attribute pain to aliens/AI without identical physiology). It avoids the Exclusion Problem by eliminating the realized property as distinct.
  *   **Verdict:** Metaphysically clean, empirically chauvinistic.

  **2. Flat Causal-Role View (e.g., Lewis)**
  *   **Performance:** Realization is the occupation of a causal role defined by a theory.
  *   **Critique:** Struggles with Non-Triviality (what restricts the role description?). Struggles with Causal Efficacy (the role itself is abstract; the occupier does the work, risking epiphenomenalism for the role). Good for Empirical Tractability.
  *   **Verdict:** The standard view, but vulnerable to the Exclusion Argument and Cheap Realizability.

  **3. Dimensioned View (e.g., Gillett)**
  *   **Performance:** Realizers contribute their own causal powers to the realized property; realization is a dimensioned relation of power contribution.
  *   **Critique:** Attempts to solve Causal Efficacy by having powers be "shared." Strong on metaphysics. Weak on Empirical Tractability (how do we measure power contributions in a black box?). Risks violating Causal Completeness if not carefully formulated.
  *   **Verdict:** Sophisticated metaphysics, high epistemic cost.

  **4. Subset View (e.g., J. Wilson)**
  *   **Performance:** The causal powers of the mental state are a subset of the causal powers of the physical realizer.
  *   **Critique:** Solves Exclusion (no overdetermination, since powers are subsetted). Solves Non-Triviality (subset relation is strict). Struggles with Determinacy (when is it a subset vs. a different set?).
  *   **Verdict:** Currently one of the strongest metaphysical accounts, but complex to apply to unfamiliar systems.

  **5. Ramsified Recipe (Classic Functionalism)**
  *   **Performance:** Replace mental terms in a theory with variables, existentially quantify, and look for physical satisfiers.
  *   **Critique:** Fails Non-Triviality (Putnam: any system with enough states can satisfy the Ramsey sentence under some mapping). Fails Determinacy (holism means theory change alters the state identity).
  *   **Verdict:** Historically important, but largely abandoned in rigorous metaphysics due to the triviality and holism problems.

  ### Summary Recommendation for Your Paper

  Your paper should argue that the "hardware/software" analogy is not just a simplification, but a **misleading map** that hides the tension between **Non-Triviality** and **Heterogeneity**. The literature often equivocal between Weak and Strong MR to dodge this tension. If you force the theories to choose, most either collapse into Local Identity (saving causation, losing MR) or embrace Epiphenomenalism/Pragmatism (saving MR, losing causation). The most promising path (Subset/Dimensioned views) attempts to solve this but pays a high price in empirical tractability.
