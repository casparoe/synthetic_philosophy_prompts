  One finds a soul, one stone, in faintest light.
  Who draws the law the ruin must display?
  When every eye creates a unique sight.

  Yet practice sharpens vision past the glance.
  We mark the stroke the untrained eye ignores.
  But does this skill discover or enhance?
  The rule takes shape where comparison pours.
  Not truth discovered in the cracked design,
  But five good eyes agreeing on the line.
