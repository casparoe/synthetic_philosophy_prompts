      *   *Certainty:* Certainty comes from authorship. We author the definitions, so we can be certain of the consequences. In physics (natural philosophy), we observe effects and guess causes (hypothetical), so we lack certainty. In geometry (civil philosophy too), we construct the cause, so we know the effect.

