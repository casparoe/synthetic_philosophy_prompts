answer: |-
  Structure the session as a linear dependency chain where Ranke establishes the archive, Carr exposes selection, and White reveals narrative form, using the Paris Commune to prevent abstract drift.

  **Session Flow and Dependency Logic**

  You must teach this in strict chronological order of the theorists because the interns need to inhabit each mindset before you dismantle it. If you introduce White too early, they will dismiss Ranke as naive rather than understanding his methodological contribution.

  1.  **Minutes 0–20: Ranke and the Archive (The Baseline)**
      *   **Concept:** Present Ranke's *wie es eigentlich gewesen* ("how it actually happened") as the data-journalist's default setting: the belief that if you gather enough primary sources, the truth emerges automatically.
      *   **Paris Commune Application:** Show them digitized police reports and official government decrees from 1871. These documents exist, are verifiable, and look like hard data.
      *   **Misconception Check (Minute 15):** Head off the idea that Ranke means "zero bias." Clarify that Ranke argued for eliminating *personal* bias through method, not that the archive itself is neutral. The archive is what the state chose to keep.
      *   **Dependency:** They must believe in the source before they can question it.

  2.  **Minutes 20–40: E.H. Carr and Selection (The Filter)**
      *   **Concept:** Move to Carr's *What Is History?* to argue that facts do not speak; historians speak using facts. The dependency here is critical: sources exist (Ranke), but sources are incomplete (Carr).
      *   **Paris Commune Application:** Reveal what the archive lacks. Most Communard records were destroyed during Bloody Week. The surviving archives are predominantly from the Versailles government (the victors). Ask interns: "If you only read police reports, who is the criminal?"
      *   **Misconception Check (Minute 35):** Head off the conflation of Carr with postmodern relativism. Emphasize Carr's point that selection is guided by social context and evidence, not arbitrary whim. It is not "anything goes"; it is "whose voice survived?"
      *   **Dependency:** They must accept selection bias before they can understand narrative shaping.

  3.  **Minutes 40–60: Hayden White and Emplotment (The Structure)**
      *   **Concept:** Introduce White's argument that even with selected facts, the *form* of the story determines the meaning. The dependency shifts from "what facts" to "how arranged."
      *   **Paris Commune Application:** Show two headlines about the same event: "Paris Rebels Seize City" (Romance/Revolution) vs. "Mob Overthrows Order" (Tragedy/Chaos). The facts (barricades built, hotels occupied) are identical; the employment changes the reality.
      *   **Misconception Check (Minute 55):** Head off the idea that White means history is fiction. Explain that narrative structure is unavoidable for human comprehension, not a lie. It is how we make data intelligible.
      *   **Dependency:** This is the final layer; narrative shapes the interpretation of the selection of the sources.

  4.  **Minutes 60–75: Synthesis Exercise**
      *   **Task:** Give them a single raw data point from the Commune (e.g., "500 barricades constructed in 48 hours").
      *   **Action:** Have them write two ledes. One must imply inevitable tragedy (White's Tragedy), the other heroic resistance (White's Romance).
      *   **Goal:** Force them to see how their own writing imposes structure on the data.

  5.  **Minutes 75–90: End Check and Boundaries**
      *   **End Check:** Do not ask them to define the theorists. Ask them to trace the dependency: "If the archive is incomplete (Carr), does changing the story structure (White) make the facts false?" They must answer that the facts remain, but the *meaning* shifts. If they say "facts are fake," they failed. If they say "meaning is constructed," they passed.
      *   **What's Too Deep:** Do not teach White's specific four tropes (Metaphor, Metonymy, Synecdoche, Irony) or his detailed modes of employment. This is linguistics-heavy theory that will bog down a 90-minute practical workshop. Stick to the concept of "emplotment" generally.
      *   **Paris Commune Verdict:** The example is correct, provided you explicitly highlight the asymmetry of the records. It must have the official state records to show Ranke's ideal, and it must lack the defeated Communard voices to show Carr's selection problem. If you present it as a complete archive, the lesson fails.
