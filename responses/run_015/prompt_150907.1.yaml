  - Decomposition: 
  (1) **Rotational Inertia Relationality: 0.4.** Justification: Inertia requires a standard of non-rotation, which pure relations between bodies fail to provide without background structure. Without distant matter or a metric field, there is no relational fact of the matter about which body is rotating, making genuine relational inertia unlikely.

  (2) **Bucket Argument Ambiguity: 0.6.** Justification: The experiment establishes non-inertial motion relative to local frames, not necessarily absolute space. While this leaves logical room for relationism, it does not positively secure a relational explanation over a structural one.

  (3) **GR Metric Non-Substantivalism: 0.3.** Justification: Vacuum solutions in GR possess dynamical degrees of freedom independent of matter, behaving ontologically like substances. Treating the metric as merely codifying relations struggles to account for gravitational waves or empty universe dynamics without smuggling in substantival commitments.

  (4) **Two-Body Universe Viability: 0.2.** Justification: In a universe with only two rotating bodies, GR predicts centrifugal effects via the metric, but pure relationism predicts none without external reference. Explaining this concavity without Machian matter or a substantive metric leaves relationism with no explanatory resource.

  - Combination: Since the project requires avoiding both metric substantivalism and Machian matter, these conditions function as conjunctive constraints; failure in any single category collapses the specific relationist account. Multiplying the sub-credences yields a baseline near 0.01, but holistic charity for emerging structural realist compromises raises the overall credence to 0.12. The low score reflects that GR's success relies precisely on the ontological weight of the metric field that this view seeks to deny.

  - The weak link: The two-body universe viability (0.2) is the critical failure point. If relationism cannot account for inertial effects in near-empty models without appealing to the metric's reality, the entire project defaults to substantivalism.

  - What'd move me: A derivation of inertial effects from topological boundary conditions alone, demonstrating dynamics without ontic field commitment. This would decouple geometry from substance while preserving predictive power.
