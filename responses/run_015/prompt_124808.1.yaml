answer: |-
  **Case Analysis: The Anomalous Perihelion Advance of Mercury and the Underdetermination of Theory**

  **Introduction**

  By the late nineteenth century, celestial mechanics faced a persistent anomaly. The perihelion of Mercury was advancing at a rate approximately 43 arcseconds per century greater than Newtonian theory permitted, once the perturbations of known planets were accounted for. This discrepancy presented a crisis of explanation. Three broad classes of solution were available: the postulation of undiscovered matter within Mercury's orbit (a planet 'Vulcan' or a ring of asteroids); the existence of a diffuse cloud or ring of dust close to the Sun; or a revision of the gravitational law itself, ranging from a minor adjustment to the inverse-square exponent to the wholesale replacement of Newtonian gravity by General Relativity in 1915.

  This episode is frequently cited in philosophy of science as a paradigm of theory choice. However, to analyse it through the lens of underdetermination requires precision. We must distinguish three distinct readings of the underdetermination thesis:
  1.  **The Transient Thesis:** Evidence available at time *t* does not decide between rivals, but later evidence does.
  2.  **The Holist Thesis:** No hypothesis faces the tribunal of evidence alone; any core theory can be shielded from refutation by adjusting auxiliary assumptions.
  3.  **The Radical Thesis:** Rivals exist which no possible evidence could ever separate.

  The following analysis examines the Mercury anomaly in both directions: first, applying these concepts to the historical case, and second, deriving philosophical conclusions from the case. It concludes with a verdict on a hypothetical extension of the episode.

  ***

  **Part I: Theory to Case**

  Here we examine the three proposed fixes to determine the nature of the underdetermination at the time, the auxiliary commitments they entailed, and the independent evidence available to test them.

  **1. Intra-Mercurial Matter (Vulcan or a Ring)**
  *   **Auxiliary Commitments:** This hypothesis preserved Newton's law of gravitation. It required auxiliaries regarding optical theory (that telescopes were capable of detecting such bodies), the transparency of interplanetary space, and the assumption that such matter would not disrupt the orbits of other planets (Venus, Earth) beyond observational limits.
  *   **Independent Evidence:** The existence of Vulcan was testable independently of Mercury's perihelion. Le Verrier and others searched for transits across the solar disc. Total solar eclipses offered opportunities to detect intra-Mercurial bodies via photography (notably in 1878). Furthermore, the mass required to explain the 43 arcseconds would exert gravitational influence on Venus and Earth.
  *   **Status of Underdetermination:** For the astronomer in 1880, the underdetermination was **genuine**. The Newtonian core could be saved, and the auxiliary (existence of Vulcan) was plausible given the discovery of Neptune via similar reasoning. However, by 1920, this underdetermination had lapsed. Repeated failures to observe transits or eclipse candidates, combined with the lack of perturbations on Venus, rendered the auxiliary untenable. This instantiates the **Transient Thesis**: the evidence at *t1* underdetermined the choice, but evidence at *t2* did not.

  **2. A Diffuse Cloud or Ring of Dust**
  *   **Auxiliary Commitments:** This fix also preserved Newtonian gravity. It relied on auxiliaries concerning the nature of the zodiacal light (assumed to be reflected sunlight from dust) and the relationship between optical density and gravitational mass. It assumed such a cloud would not cause excessive drag on comets or alter the motion of the Moon.
  *   **Independent Evidence:** Spectroscopy of the zodiacal light and the dynamics of sun-grazing comets provided independent tests. Crucially, the mass required to produce the 43 arcseconds advance was calculated to be far greater than the mass consistent with the observed brightness of the zodiacal light and the stability of cometary orbits.
  *   **Status of Underdetermination:** Like the Vulcan hypothesis, this was a case of **Transient** underdetermination. Initially, it was a viable shield for Newtonian theory. However, the auxiliaries regarding mass-to-light ratios and cometary drag were independently testable. They failed. The underdetermination was genuine for the practitioner lacking those specific mass constraints, but apparent to the theorist who recognised the incompatibility with zodiacal data.

  **3. Revision of the Gravitational Law (Exponent Change or General Relativity)**
  *   **Auxiliary Commitments:**
      *   *Exponent Change:* Modifying the inverse-square law (e.g., to $1/r^{2+\epsilon}$) required the auxiliary assumption that such a change would not destabilise the orbits of Venus, Earth, or the Moon.
      *   *General Relativity (GR):* This required abandoning Newtonian absolute space and time. Auxiliaries included the equivalence principle and the compatibility of the new field equations with Special Relativity.
  *   **Independent Evidence:**
      *   *Exponent Change:* Leverrier had already shown that changes large enough to fix Mercury's orbit would produce discrepancies in the motion of the Moon and Venus that were not observed. This fix was effectively ruled out before 1915.
      *   *General Relativity:* GR made novel predictions independent of the perihelion advance, specifically the deflection of starlight by the Sun and the gravitational redshift. The 1919 eclipse expedition provided independent evidence favouring GR over Newtonianism.
  *   **Status of Underdetermination:** Between the exponent change and GR, there was a brief period of underdetermination, resolved by the broader empirical success of GR. Between Newton (with any auxiliary) and GR, the underdetermination was **Transient**. By 1920, the weight of independent evidence (light bending, lack of Vulcan, lunar motion constraints) had decided the matter.

  ***

  **Part II: Case to Theory**

  We now assess what this episode reveals about the three readings of underdetermination.

  **1. The Transient Thesis**
  The Mercury episode is a textbook illustration of the Transient Thesis. In 1880, the data underdetermined the theory; in 1925, it did not. The episode confirms that underdetermination is often a function of the *historical availability* of evidence rather than a permanent logical feature of the theories. It demonstrates that scientific realists need not be troubled by underdetermination so long as they view it as a temporary state of inquiry rather than a permanent barrier to truth.

  **2. The Holist Thesis**
  Does this episode support the Duhem-Quine claim that any hypothesis can be shielded from refutation by adjusting auxiliaries?
  In one sense, yes: Newtonians *did* attempt to shield the core theory by positing Vulcan and dust clouds. They treated the anomaly as a failure of the auxiliaries (initial conditions regarding matter distribution) rather than the core law.
  However, the episode also highlights the *practical limits* of holism. While logically one might always invent a new auxiliary (e.g., 'Vulcan is made of perfectly non-reflective matter'), scientific practice demands that auxiliaries be independently testable. The Vulcan and dust hypotheses failed not because they were logically inconsistent with Mercury's orbit, but because they conflicted with *other* evidence (eclipse photography, lunar motion, zodiacal light).
  Therefore, the case suggests that while holism accurately describes the *logical space* of theory testing (hypotheses do not face evidence in isolation), it is a poor description of *scientific practice* where auxiliaries are constrained by independent empirical webs. The 'tribunal of experience' may judge a system of beliefs, but that system cannot be manipulated arbitrarily without friction elsewhere in the web.

  **3. The Radical Thesis**
  This episode offers no support for the Radical Thesis. There were no rivals that *no possible evidence* could separate. Indeed, the theories were separated by evidence that became available (better telescopes, eclipse photography, light bending measurements). To argue for the Radical Thesis on the basis of this case would be to ignore the historical resolution. The concept of radical underdetermination is silent here; it finds no purchase in an episode where empirical discrimination was ultimately achieved.

  ***

  **Part III: The Closing Question**

  *Suppose a rival to General Relativity existed in 1920 that reproduced every gravitational observation available at the time (perihelion advance, light bending, redshift) but diverged from GR in the strong-field regime, with strong-field evidence not arriving until the 1970s. Is the situation in 1920 best described as a case of underdetermination whose protagonists were being irrational, a case in which suspension of judgement was the reasonable response, or no interesting underdetermination at all but only a remark about how little data there was?*

  **Verdict:**
  The situation in 1920 is best described as **no interesting underdetermination at all, but only a remark about how little data there was.**

  To label this 'underdetermination' in a philosophically weighty sense risks conflating a temporary empirical limitation with a structural problem in the relation between theory and evidence.
  1.  **Irrationality:** It would not be irrational for a scientist in 1920 to prefer GR over the rival. Theory choice is not dictated solely by the data available at time *t*; it is also guided by heuristic virtues such as simplicity, coherence with other fields (e.g., electromagnetism), and mathematical elegance. If GR offered a more coherent framework than the rival, preferring it was rational, even if the empirical data were identical.
  2.  **Suspension of Judgement:** While logically permissible, suspension of judgement is rarely the engine of scientific progress. Science proceeds by tentatively accepting the best-available framework to generate new predictions. To suspend judgement would be to halt the research programme that might eventually lead to the strong-field tests of the 1970s.
  3.  **Little Data:** This description aligns with the **Transient Thesis**. The theories were not underdetermined by *all possible* evidence (Radical), nor was the web of belief so flexible that they could not be separated (Holist). They were merely underdetermined by the *current* reach of instrumentation.

  Therefore, to call this 'underdetermination' is to inflate a mundane fact of experimental limitation into a philosophical puzzle. The gap between the theories was not a gap in logic or justification, but a gap in technological capability. The concept of underdetermination adds little value here; it is more precise to say the evidence was simply insufficient. The episode reinforces that underdetermination is typically a measure of our current ignorance, not a permanent feature of the scientific landscape.
