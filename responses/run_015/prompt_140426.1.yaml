answer: |-
  ### The Knob-Twiddling Procedure

  You are right to be skeptical of "bolts from the blue." Hofstadter's model works because it treats creativity as navigation, not magic. For a nine-person studio with one hour per sheet, you need a heuristic, not a philosophy. The goal of this procedure is not to tell you what is *good*, but to tell you what is *coherent* and where the risk lies.

  #### 1. Extracting the Knobs (The "Anti-Feature" Pass)
  Do not start by listing features. Features are static. Knobs are variables. To find the knobs—including the invisible ones—run a five-minute "Anti-Feature" pass on the one-sheet.
  *   **The Move:** Ask the team, "What is the one thing we are *not* allowed to change about this concept?" Then ask, "What is the most terrible version of this we could make?"
  *   **Why:** If "terrible version" is "played in silence," then *Audio* is a knob currently set to "On." If "not allowed to change" is "the win condition," then *Victory* is a Frame knob.
  *   **Finding the Unnamed:** The unnamed knobs live in the "terrible" answers that make everyone laugh nervously. If someone jokes, "What if you only have one hand?" and the room goes quiet, *Input Method* is a hidden knob you just exposed. Write it down.

  #### 2. Sorting Depth (The 5-Minute Ripple Test)
  Your distinction is close, but "independent" is tricky. Use the **Ripple Test**. Imagine turning the knob. What else *must* change to accommodate that turn?
  *   **Surface Knob:** You turn it, nothing else breaks. (e.g., Color palette, SFX).
      *   *Test:* Change it. Does the code or rules need to change? If no, it's Surface.
  *   **Structural Knob:** You turn it, mechanics adjust but the game holds. (e.g., Grid size, Turn limit, Resource count).
      *   *Test:* Change it. Do you need to rebalance numbers or tweak rules? If yes, but the core loop survives, it's Structural.
  *   **Frame Knob:** You turn it, the game ceases to be itself. (e.g., Loss state, Single-player vs. Multiplayer, Real-time vs. Turn).
      *   *Test:* Change it. Does the pitch deck title need to change? If yes, it's Frame.
  *   **The Ambiguity:** If the test doesn't settle in five minutes, it is a **Structural** knob by default. Treat it as risky until proven otherwise. Frame knobs are rare; most "identity" issues are actually clusters of Structural knobs.

  #### 3. Searching the Space (Intentional Moves)
  Stop hoping for novelty. Assign a "Move Type" to every variation you consider.
  *   **Push to Extreme:** Take a Structural knob (e.g., "Turn Limit") and set it to 1 or Infinity. *Produces:* Tension or Zen states.
  *   **Cluster Shift:** Move coupled knobs together (e.g., "Smaller Grid" + "Faster Turn"). *Produces:* Coherent difficulty spikes.
  *   **Deletion:** Remove a knob entirely (e.g., "No Loss State"). *Produces:* Minimalism or Genre-shifts. High risk.
  *   **Borrowing:** Take a knob from an adjacent genre (e.g., "Roguelike Progression" on a "Word Puzzle"). *Produces:* Hybrids. High confusion risk.

  #### 4. Evaluation Tests (The Filter)
  Run these in order. For a studio your size, time is your scarcest resource.
  *   **Test 1: The Phantom Shift (Samey-but-new).** Did you move a knob, but the *experience* feels identical?
      *   *Verdict:* **Iterate or Kill.** This wastes art time. It is less dangerous than Test 2, but still a failure of novelty.
  *   **Test 2: The Identity Drift (Lost-the-thread).** Did you move a Frame knob so far that it is no longer the game you promised to prototype?
      *   *Verdict:* **Hard No.** This is worse for you. A "Samey" prototype fails fast. A "Drifted" prototype wastes a month of two people's time on a product you didn't approve.
  *   **Prioritization:** The procedure treats Identity Drift as a fatal error. Phantom Shift is a warning.

  #### 5. Stop Conditions (Values vs. Procedure)
  The procedure handles coherence and risk. It cannot handle taste or business strategy.
  *   **Procedure Stop:** If Test 2 (Identity Drift) fails, the sheet is a No.
  *   **Values Escalation:** If the procedure says "Coherent" but the move violates studio values (e.g., "We don't make gambling-adjacent mechanics") or business constraints (e.g., "This requires server infrastructure we don't have"), you escalate.
  *   **Who Decides:** You decide on Procedure (Coherence). Your Studio Head decides on Values (Brand/Budget). If the procedure flags a Frame Knob move (like "Noughts"), it is automatically a Values Escalation. You cannot sign off on Frame shifts alone.

  ---

  ### Case Applications

  #### 1. "Noughts" (Match-3, No Loss State)
  *   **Knobs Moved:** *Loss Condition* (Frame).
  *   **Procedure Analysis:** This is a **Deletion** move on a **Frame Knob**.
  *   **Test Result:** Fails Test 2 (Identity Drift). A match-3 without loss is arguably a "Toy" or "Zen App," not a "Puzzle Game" by your studio's historical definition.
  *   **Verdict:** **NO (Procedure)** -> **ESCALATE (Values)**.
  *   **Reasoning:** The procedure flags this as "Lost-the-thread." It is no longer the game you ship. However, because it is a Frame move, the procedure forces it to your Studio Head.
  *   **Judgment Call:** **True.** (The procedure says No; you may want to fight for it as innovation. The Head must decide if "Game" requires "Loss".)
  *   **Unwanted Answer:** This is the answer you likely don't want. You see innovation; the procedure sees a genre violation.

  #### 2. "Folio" (Tile-slide, Reskinned)
  *   **Knobs Moved:** *Art Style* (Surface), *Grid Dimensions* (Surface/Structural).
  *   **Procedure Analysis:** This is a **Surface** move with minor **Structural** tweaking.
  *   **Test Result:** Fails Test 1 (Phantom Shift). The core loop is identical to shipped titles. The experience is "Samey."
  *   **Verdict:** **NO.**
  *   **Reasoning:** It does not drift, but it does not offer novelty. For a prototype month, this is a waste of creative capacity.
  *   **Judgment Call:** **False.** (The procedure confirms your gut. It is safe but boring.)

  #### 3. "Errand" (Roguelike + Word Puzzle)
  *   **Knobs Moved:** *Progression System* (Structural), *Permadeath* (Structural), *Core Loop* (Frame?).
  *   **Procedure Analysis:** This is a **Borrowing** move.
  *   **Test Result:** Confused on Test 2. Is the core loop "Word Puzzle" or "Deckbuilder"?
  *   **Verdict:** **ESCALATE.**
  *   **Reasoning:** The procedure cannot determine if this is a variation or a new product. It requires a values call on audience expectation.
  *   **Judgment Call:** **True.** (This is a strategic bet, not a design tweak.)

  ---

  ### Limitations & Misfires

  1.  **Pre-Naming Shrinkage (Worry A):** You are correct. Writing knobs down *before* the jam shrinks the space.
      *   *Fix:* Do not list knobs before the jam. Run the "Anti-Feature" pass *after* the one-sheets are written, on the specific concepts. The procedure applies to the *selection* phase, not the *generation* phase.
  2.  **The Fun Factor (Worry B):** The procedure analyzes *structure*, not *quality*. It ensures the game is coherent, not that it is fun.
      *   *Refusal:* The procedure must **flatly refuse to touch "Fun."** You cannot knob-twiddle joy. Use the procedure to ensure the prototype is *legible*, then playtest for fun. Optimizing for legibility without testing for joy will produce polished boring games.

  ***

