  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergraduate metaphysics seminar, 6-week module on persistence. Session 4 of 6.
      *   **Class Size/Time:** 16 students, 75 minutes.
      *   **Resources:** Seminar room, whiteboard, movable chairs. No AV, no budget (print/carry only).
      *   **Current State:** Students know the arguments (temporary intrinsics, spatial location, counting, Ship of Theseus) but find them notional/notional. They feel "nothing is at stake."
      *   **Goal:** A session where they *build* something, and the *cost* of their metaphysical picture shows up in the thing they built.
      *   **Intended Arc:**
          1.  Students arrive at perdurantism (temporal parts) to solve a contradiction (bent/straight) or part-change.
          2.  That picture becomes unstable; natural repair leads to "Chunk Perdurantism" (maximal intervals of qualitative constancy).
          3.  That repair fails on *continuous change* (no maximal intervals, arbitrary grain).
          4.  Diagnostic Case: Dismantled Ship (intermittent existence vs. identity denial).
      *   **Constraints:** No lecture up front. No intuition polls. No "-ism" words until the last 10 mins. Students must *do* something (assemble, trade, bid, sort, commit).
      *   **Deliverables:** Runnable design (setup, materials, rules, timeline, instructions), prediction of failure modes, honest assessment of limitations (metaphysical vs. bookkeeping).

  2.  **Deconstruct the Pedagogical Challenge:**

      *   *The Core Problem:* Metaphysics is abstract. Making it concrete without trivializing it is hard.
      *   *The "Build" Requirement:* They need to construct a representation of an object through time.
      *   *The "Cost" Requirement:* The representation must become cumbersome or contradictory under certain conditions (continuous change, gaps).
      *   *The "Chunk" Idea:* This is the trickiest part. "Chunk Perdurantism" (temporal parts only at qualitative shifts) is a niche view. The activity needs to make this feel like a *natural solution* to a specific problem (the arbitrariness of instantaneous slices) before breaking it.
      *   *The Ship Case:* Needs to be integrated into the building/sorting activity, not just a discussion prompt.

  3.  **Brainstorming the Activity:**

      *   *Idea 1: Lego Bricks.* Build an object, change it over "time" (rounds).
          *   *Pros:* Tangible.
          *   *Cons:* Too focused on spatial parts. Hard to represent time without stacking, which gets messy.
      *   *Idea 2: Card Sorting/Mapping.* Students get cards representing time-slices or properties. They have to arrange them to make an "object."
          *   *Pros:* Easy to print. Easy to manipulate on tables.
          *   *Cons:* Can feel like a logic puzzle rather than metaphysics.
      *   *Idea 3: The "Ledger" Game.* Students act as auditors tracking an object's identity through a log of changes.
          *   *Pros:* Highlights the "cost" (bookkeeping).
          *   *Cons:* Might be too dry.
      *   *Idea 4: Strip Mapping (Selected).* Use paper strips to represent time. Students construct the "life" of an object by arranging strips.
          *   *Why:* It visualizes temporal extension. It allows for "slicing" (cutting strips) or "chunking" (grouping strips). It handles the "gap" case well (missing strip).

      *   *Refining the Activity:* Let's go with a **"Persistence Ledger & Construction"** hybrid.
      *   *Materials:* Envelopes containing "Time Slips" (cards describing the object at $t_1, t_2, \dots$) and "Identity Tokens." Whiteboard for the "Master Ledger."
      *   *Task:* Groups must certify the identity of an object through a series of changes. They have to submit a "Constitution Document" defining how the object persists.
      *   *The Twist:* The rules of certification change mid-game to force the "Chunk" solution, then break with continuous change.

      *   *Wait, let's look closer at the prompt's specific arc:*
          1.  Arrive at perdurantism (bits at different times) to avoid contradiction.
          2.  Repair to Chunk Perdurantism (maximal constant intervals).
          3.  Fail on continuous change.
          4.  Diagnostic: Dismantled Ship.

      *   *Revised Activity Idea: "The Object Audit."*
          *   Students are auditors for the "Bureau of Identity."
          *   They receive case files.
          *   They must issue "Identity Certificates."
          *   To issue a certificate, they must specify the *constituents* of the object.
          *   *Phase 1 (Bent/Straight):* A rod changes shape. If they say it's one thing wholly present, they have a contradiction. They must split it into time-segments to certify it. (Forces Perdurantism).
          *   *Phase 2 (Arbitrariness):* Splitting every second is too much work/paper. They are encouraged to group identical states. (Forces Chunk Perdurantism).
          *   *Phase 3 (Continuous Change):* A cooling rod. No identical states. They can't group. They can't split infinitely (practical limit). The system jams. (Breaks Chunk Perdurantism).
          *   *Phase 4 (The Gap):* The Ship case. Does the certificate hold during the gap?

      *   *Physical Implementation:*
          *   Use strips of paper to represent the object's timeline.
          *   Students write/draw properties on them.
          *   They physically tape/cut them to form the "Object."
          *   The "Cost" is the physical amount of paper/cuts/tape required to maintain consistency.

  4.  **Developing the Plan (Minute-by-Minute):**

      *   *Prep:* 4 Groups of 4. Packets of colored paper strips, markers, tape, "Case Files."
      *   *0-5:* Setup. No theory. Just "You are Identity Auditors."
      *   *5-20:* Case 1 (The Bending Rod). Discrete states. Bent ($t_1$), Straight ($t_2$).
          *   *Constraint:* You cannot write "It was bent and straight." You must represent the object physically.
          *   *Expected Move:* They will make two slips and tape them together. (Perdurantism).
      *   *20-35:* Case 2 (The Cost of Slicing).
          *   *Constraint:* "Slicing" costs money (fictional budget) or effort. Group identical states to save costs.
          *   *Expected Move:* They group $t_1-t_5$ as one chunk. (Chunk Perdurantism).
      *   *35-50:* Case 3 (The Cooling Rod). Continuous change.
          *   *Constraint:* Every moment is different.
          *   *Problem:* Cannot group. Infinite slices impossible.
          *   *Crisis:* The model breaks.
      *   *50-60:* Case 4 (The Warehouse Ship).
          *   *Constraint:* Gap in existence.
          *   *Task:* Does the certificate survive the gap?
      *   *60-75:* Debrief. Reveal the "-isms." Map their struggles to the arguments.

  5.  **Refining the "Chunk" Transition:**
      *   How to make them *want* chunks?
      *   Give them a limited number of "Identity Tokens." Each token sustains one object-segment. If they slice too finely, they run out of tokens. They *must* aggregate to finish the task.
      *   This creates the *motivation* for Chunk Perdurantism (efficiency/ontology cost) rather than just stating it.

  6.  **Refining the "Continuous Change" Failure:**
      *   Give them a gradient strip (e.g., color fading from red to blue).
      *   Ask them to cut it into "Qualitatively Uniform Chunks."
      *   They can't. Any cut is arbitrary.
      *   This physically demonstrates the arbitrariness problem.

  7.  **Addressing the Ship Case:**
      *   This needs to be a specific packet.
      *   Packet contains: Slips for $t_1$ (Ship), $t_2$ (Pile), $t_3$ (Ship).
      *   Question: Is the Object at $t_3$ the same Token as $t_1$?
      *   If Perdurantist (slices): The slices are distinct. What binds them?
      *   If Chunk: Is the "Pile" a different chunk? Is there a gap chunk?
      *   This forces the commitment.

  8.  **Anticipating Failure Modes:**
      *   *Voting:* Students might just vote "Yes it's the same" without doing the work.
          *   *Fix:* Require physical submission of the "Object Model" (the taped strips).
      *   *Endurantist Cheat:* They might just write "Same Rod" on one slip.
          *   *Fix:* Rule: "Contradiction Ban." You cannot attribute incompatible properties to a single slip.
      *   *Seeing the Trick:* If they know the topic well, they might game it.
          *   *Fix:* Keep instructions procedural, not philosophical. Focus on "Audit Compliance."
      *   *Time Management:* 75 mins is tight for 4 cases.
          *   *Fix:* Merge Case 1 & 2. Make Case 3 the focus. Make Case 4 the pivot to debrief.

  9.  **Drafting the Instructions:**
      *   Need to be precise. "Do not use the words object, time, or identity" (Too hard). "Do not use the words endurantism..." (As requested).
      *   Focus on "Compliance," "Segments," "Properties."

  10. **Critique of the "Chunk" Idea (Self-Correction):**
      *   The prompt asks me to be frank if part of the arc is a bad idea.
      *   *Concern:* "Chunk Perdurantism" (maximal intervals of qualitative constancy) is vulnerable to the "perfectly homogeneous sphere" objection (no change = one giant chunk = no persistence?) or the continuous change objection.
      *   *Pedagogical Risk:* Students might not see Chunk Perdurantism as a "repair." They might see it as just "coarse-grained perdurantism."
      *   *Adjustment:* Emphasize that the *motivation* for chunks is to avoid the arbitrariness of instantaneous slices *and* to allow intrinsic properties (a chunk can be bent simpliciter, a slice cannot).
      *   *Wait, the prompt says:* "each block can be bent, or straight, or four-legged, simpliciter." This is the key. Instantaneous slices can't really be "bent" (bending implies duration or relation). Chunks can.
      *   *Activity Tweak:* In Phase 1, ask them to label the property of the segment. If the segment is instantaneous, "Bent" feels wrong. If it's a duration, "Bent" feels right. This motivates the Chunk.

  11. **Finalizing the Plan Structure:**
      *   **Title:** The Identity Audit.
      *   **Materials:** Envelopes, Paper Strips (white and colored), Markers, Tape, "Budget Sheets."
      *   **Timeline:**
          *   0-10: Setup & Case 1 (Contradiction).
          *   10-30: Case 2 (Cost & Chunking).
          *   30-50: Case 3 (Continuous Change Crisis).
          *   50-60: Case 4 (The Gap/Ship).
          *   60-75: Debrief & Mapping.
      *   **Failure Modes:** Cheating, rushing, missing the point of the "cost."
      *   **Limitations:** The game stages bookkeeping/ontology costs, not the deep metaphysical "why."

  12. **Writing the Response:**
      *   Adopt the tone: Professional, pedagogical, honest.
      *   Ensure all constraints (no AV, no -isms until end) are met.
      *   Make sure the "Chunk" transition is clear.
      *   Ensure the Ship case forces a public commitment.

      *(Self-Correction during drafting)*: I need to make sure the "Chunk" view isn't just presented as "grouping." It needs to be presented as the *only* way to satisfy a rule about intrinsic properties.
      *   *Rule Addition:* "Property Attribution Rule: A property label (e.g., 'Bent') may only be attached to a segment if that segment *fully possesses* the property without contradiction."
      *   If a segment spans a change (Bent to Straight), it can't be labeled "Bent."
      *   If a segment is instantaneous, students often feel it can't hold a shape (kinematic issue).
      *   Actually, let's stick to the prompt's logic: The repair is motivated by the *arbitrariness* of slices in the face of cost, but the *failure* is continuous change.
      *   Okay, I will design the "Budget" mechanic to force chunking. They have a limited number of "Segment Tokens." They must cover the timeline. If they slice every second, they run out. They must group constant states.

      *(Final check on Ship Case)*: The prompt wants the Ship case to be a diagnostic where pictures commit.
      *   Perdurantist: The ship is a sum of slices. The gap is just a region where there are no ship-slices. The "Ship" object is the sum of the pre-gap and post-gap slices.
      *   Chunk: If the gap breaks qualitative continuity, is it one chunk or two?
      *   Endurantist: Either the ship ceases to exist or exists intermittently.
      *   I need the students to *decide* on the certificate. "Is Certificate A (Start) valid for Certificate B (End)?"

      *(Final check on Limitations)*: Be honest. The game shows ontological cost and bookkeeping complexity. It doesn't show the *truth* of the matter. It doesn't solve the "which view is correct" question, only "what does this view require."

      Let's write it.
answer: |-
  # Session Design: The Identity Audit

  ## 1. Overview and Philosophy
  This session treats metaphysical theories as **administrative systems**. Students are not debating truth; they are auditing the "cost" of maintaining identity claims under different constraints. The "cost" is ontological (how many entities must you posit?) and bureaucratic (how complex is your ledger?).

  The activity forces them to operationalize their intuitions. They cannot say "it just persists"; they must build the persistence using physical tokens. When the tokens run out or the rules contradict, the theory breaks.

  **Constraint Checklist:**
  *   **Time:** 75 minutes.
  *   **Students:** 16 (4 groups of 4).
  *   **Materials:** Paper, markers, tape, envelopes (printable/carryable).
  *   **Forbidden:** No "-ism" words until the last 10 minutes. No lectures. No intuition polls.

  ## 2. Materials Preparation
  You need to prepare four identical **Audit Kits** (one per group).

  **Inside each Kit:**
  1.  **The Ledger:** A single large sheet of paper (A3 or two A4s taped) with a horizontal timeline drawn across the middle, marked $t_1$ to $t_{20}$.
  2.  **Segment Tokens:** 20 small sticky notes or cut squares of paper. (These represent *temporal parts*).
  3.  **Property Stickers:** A sheet of round dots in three colors: Red (Bent/Hot), Blue (Straight/Cold), Green (Disassembled).
  4.  **Identity Seals:** 5 gold foil stickers (or distinctively marked paper circles). These represent *The Object*.
  5.  **Case Files:** 4 Envelopes, labeled Case 1 through Case 4.
  6.  **The Rulebook:** A single printed sheet (see Instructions below).
  7.  **Tools:** One roll of masking tape, two black markers.

  ## 3. The Rulebook (Print this for each group)
  *Do not explain this verbally. Hand it out. Tell them: "Compliance is mandatory. If your Ledger violates a Rule, your Audit fails."*

  > **BUREAU OF IDENTITY: AUDIT PROTOCOLS**
  >
  > 1.  **Coverage:** Every moment on the Timeline ($t_1$–$t_{20}$) must be covered by exactly one Segment Token.
  > 2.  **Contradiction Ban:** A single Segment Token cannot bear incompatible Property Stickers (e.g., you cannot put Red and Blue on the same Token).
  > 3.  **Attribution:** A Property Sticker describes the Segment Token itself, not the whole Timeline.
  > 4.  **Economy:** You have only 20 Segment Tokens. Do not waste them.
  > 5.  **Continuity:** An Identity Seal connects Segment Tokens into a single Object. An Identity Seal may only connect Tokens that are "compatible." (You decide what compatible means, but you must write your definition on the Ledger).
  > 6.  **The Gap:** If a Timeline has a period where no Tokens are placed, the Identity Seal is suspended.

  ## 4. Minute-by-Minute Timeline

  ### 00:00 – 00:05: Setup & Framing
  *   **Action:** Arrange tables into 4 islands. Place one Audit Kit at each.
  *   **Script:** "You are auditors for the Bureau of Identity. Your job is to certify whether an object at the end of a timeline is the same as the object at the start. You must build the object's history on the Ledger using the Tokens provided. You cannot talk about 'objects' persisting; you must show *how* they persist using the Tokens. Open Case 1."
  *   **Pedagogy:** No metaphysics. Pure procedure. The constraint "You cannot talk about objects persisting" forces them to operationalize persistence.

  ### 00:05 – 00:20: Case 1 (The Bending Rod) -> *Forcing Perdurantism*
  *   **Case File Content:** "Object R. $t_1$–$t_{10}$: Red (Bent). $t_{11}$–$t_{20}$: Blue (Straight)."
  *   **Task:** Cover the timeline. Apply Property Stickers. Place one Identity Seal to certify it is one Object.
  *   **Predicted Move:** Students will try to put one long Token across $t_1$–$t_{20}$.
  *   **The Trap:** Rule 2 (Contradiction Ban). They cannot put Red and Blue on one Token.
  *   **The Fix:** They must cut the timeline. One Token for $t_1$–$t_{10}$, another for $t_{11}$–$t_{20}$.
  *   **Outcome:** They have built a perdurantist model (temporal parts) to avoid contradiction. They will likely use 2 Tokens.
  *   **Instructor Role:** Walk around. If a group tries to write "Changes from Red to Blue" on one Token, point to Rule 3: "A Property Sticker describes the Segment Token itself." Force the split.

  ### 00:20 – 00:35: Case 2 (The Cost of Slicing) -> *Forcing Chunk Perdurantism*
  *   **Case File Content:** "Object S. $t_1$–$t_5$: Red. $t_6$: Blue. $t_7$–$t_{10}$: Red. $t_{11}$–$t_{15}$: Blue. $t_{16}$–$t_{20}$: Red." (Flickering state).
  *   **Constraint Update:** "Budget Alert. You only have 5 Identity Seals total for the whole session. If you use too many Segment Tokens, you won't have enough Seals to define the Object's unity later. Minimize Tokens."
  *   **Task:** Cover the timeline using the fewest Tokens possible while obeying Rule 2.
  *   **Predicted Move:** If they slice every time-unit ($t_1, t_2, t_3$), they use 20 Tokens. They run out of budget.
  *   **The Fix:** They must group identical adjacent states. $t_1$–$t_5$ becomes one Token. $t_6$ is one Token.
  *   **Outcome:** They arrive at **Chunk Perdurantism**. They posit temporal parts, but only *maximal intervals of qualitative constancy*. They will likely argue that a Token *is* the interval where the property holds.
  *   **Instructor Role:** Watch for groups trying to slice arbitrarily ($t_1$–$t_3$, $t_4$–$t_5$). Ask: "Why cut there? Does the property change?" Push them to cut only where properties change.

  ### 00:35 – 00:50: Case 3 (The Cooling Rod) -> *Breaking Chunk Perdurantism*
  *   **Case File Content:** "Object C. A gradient. $t_1$ is Dark Red. $t_{20}$ is White. Every moment is slightly lighter than the last." (Provide a physical color gradient strip they can look at).
  *   **Task:** Cover the timeline with Tokens. Apply Property Stickers.
  *   **The Trap:** Rule 2 & 3. A Token must have a uniform property. But the property changes at every $t$.
  *   **The Crisis:**
      1.  If they use one Token per $t$, they violate the Economy constraint (run out of Tokens/Seals).
      2.  If they group Tokens (Chunks), they violate the Contradiction Ban (a Chunk would contain two slightly different shades).
      3.  If they draw the line arbitrarily (e.g., "$t_1$–$t_5$ is Red"), they know it's false (it's actually a gradient).
  *   **Outcome:** The system jams. They cannot build the object without violating a rule. The "Chunk" solution fails because there are no maximal intervals of constancy.
  *   **Instructor Role:** Do not help. Let them struggle. Ask: "Where do you cut?" When they say "Here," ask "Why not one unit to the left?" If they say "It's arbitrary," write that word on the whiteboard.

  ### 00:50 – 01:00: Case 4 (The Warehouse Ship) -> *The Diagnostic Commitment*
  *   **Case File Content:** "Object H. $t_1$–$t_5$: Assembled (Green). $t_6$–$t_{15}$: **BLANK** (No Tokens allowed here). $t_{16}$–$t_{20}$: Assembled (Green)."
  *   **Rule Modification:** "For this case, you are forbidden from placing Tokens in the Blank Zone ($t_6$–$t_{15}$)."
  *   **Task:** Can you place a single Identity Seal connecting $t_5$ and $t_{16}$? Yes or No. Mark your verdict on the Ledger.
  *   **Predicted Moves:**
      *   *Group A (Perdurantist lean):* Yes. The Object is the sum of the two chunks. The gap is just empty time.
      *   *Group B (Endurantist lean):* No. The object ceased to exist. A new one was made.
      *   *Group C (Chunk):* If the gap breaks qualitative continuity, is it one chunk?
  *   **Requirement:** They must sign the Ledger. This is a public commitment.
  *   **Instructor Role:** Collect the Ledgers. Put them on the central table. Do not discuss yet.

  ### 01:00 – 01:15: Debrief & Mapping
  *   **Action:** Bring chairs to a circle. Put the four Ledgers in the center.
  *   **Script:** "You just fought a war over ontology. Let's name the weapons."
  *   **Mapping:**
      1.  **Case 1 (Bending Rod):** "You split the object to avoid contradiction. You posited *temporal parts*. In the literature, this is **Perdurantism** (or Four-Dimensionalism). The cost you felt was having to multiply entities (two tokens instead of one)."
      2.  **Case 2 (Flickering):** "You grouped identical states to save budget. You decided temporal parts shouldn't be arbitrary slices, but *chunks* of qualitative homogeneity. This is a view sometimes called **Chunk Perdurantism** or Variable-Stage Theory. The benefit: A chunk can be 'Bent' simpliciter. An instantaneous slice cannot."
      3.  **Case 3 (Cooling):** "The Chunk view broke. Why? Because continuous change offers no 'joints' to cut at. If you cut arbitrarily, the articulation is extrinsic. If you don't cut, you violate the Contradiction Ban. This is the **Problem of Continuous Change**. It suggests that if persistence requires qualitative constancy, nothing persists."
      4.  **Case 4 (The Ship):** Look at the Ledgers. "Group 1 said Yes. Group 2 said No."
          *   "If you said **Yes**: You treat the object as a sum of parts disconnected in time. You accept *intermittent existence*. Cost: You must explain what binds the parts across the void."
          *   "If you said **No**: You treat the object as wholly present. If it's not present, it doesn't exist. Cost: You must deny identity. The ship at $t_{20}$ is a *duplicate*, not the *original*."
  *   **Closing:** "The game staged the bookkeeping costs. It did not tell you which is true. But now you know what you are buying."

  ## 5. Predicted Failure Modes & Mitigations

  | Failure Mode | Diagnosis | Mitigation |
  | :--- | :--- | :--- |
  | **The Endurantist Cheat** | A group ignores Rule 2 and puts Red/Blue on one Token, writing "It changed." | **Intervention:** "Audit Rejection. Rule 3 says the Property describes the Token, not the history. A Token cannot change. Replace the Token." |
  | **The Voting Shortcut** | In Case 4, they just vote "Yes" without adjusting the Tokens. | **Intervention:** "Show me the Seal." If there is no physical connection across the gap on the paper, the Seal is invalid. They must physically tape across the blank space or admit the break. |
  | **Missing the "Chunk" Point** | They treat Case 2 as just "saving paper," not metaphysics. | **Debrief:** Explicitly link the "Budget" to "Ontological Parsimony." Ask: "Did you cut at $t_6$ because nature cuts there, or because you ran out of stickers?" |
  | **Case 3 Confusion** | They try to use half-stickers or blend colors. | **Intervention:** "Properties are atomic. Red or Blue. No mixing." Force the discrete/continuous clash. |
  | **Time Overrun** | Case 3 drags on as they argue about gradients. | **Hard Stop:** At 00:50, blow a whistle. "Freeze. Whatever is on the Ledger is your final audit. Move to Case 4." |

  ## 6. Honest Pedagogical Assessment

  **What this activity achieves:**
  1.  **Operationalization:** It turns "persistence" from a noun into a verb (covering, taping, sealing).
  2.  **Ontological Cost:** Students feel the "expense" of perdurantism (running out of tokens/seals) rather than just hearing about it.
  3.  **The Chunk Motivation:** It makes Chunk Perdurantism feel like a *solution* to arbitrariness, not just a weird variant.
  4.  **The Continuous Change Break:** It physically demonstrates why qualitative accounts of persistence struggle with gradients.

  **What this activity cannot do (The Limitations):**
  1.  **Metaphysical Depth:** The game stages *bookkeeping* costs, not *truth* conditions. Students may leave thinking Perdurantism is just "more paperwork" rather than a claim about the fundamental structure of time. You must supply the metaphysical weight in the debrief.
  2.  **The "Why" of Identity:** The game forces them to define "compatibility" (Rule 5), but doesn't solve *what* compatibility is. You will have to explain that this is where the real philosophical work lies (psychological continuity, causal connection, etc.).
  3.  **Endurantist Nuance:** The rules are rigged against Endurantism (Rule 2 & 3 forbid change in a single entity). This is intentional to force the Perdurantist build, but it makes Endurantism look like "cheating" rather than a coherent alternative. In the debrief, you must rehabilitate Endurantism by explaining that they would reject the Rulebook itself (they deny Rule 3: properties are had *at times*, not by tokens).

  **Critique of the "Chunk" Arc:**
  *   **Risk:** Students might not see Chunk Perdurantism as a distinct view, but just "Perdurantism with bigger slices."
  *   **Fix:** In the debrief, emphasize the *intrinsic* claim. "In Case 1, if you have an instantaneous slice, can it be 'Bent'? Or does bending require duration? The Chunk view says persistence requires duration. The Slice view says persistence is a sequence of static states. You felt this when you hesitated to label a single $t$ as 'Bent'."
  *   **Verdict:** The arc is sound, but the transition from Slice to Chunk relies on the "Economy" constraint. If students don't feel the budget pressure, they won't see the motivation for Chunks. **Ensure you enforce the token limit strictly.**

  **Final Advice:**
  Be a strict bureaucrat during the session. Do not answer metaphysical questions. Answer only with "Check Rule 2" or "Audit Rejected." The frustration they feel with the Rules *is* the philosophical problem. Save the empathy for the debrief.
