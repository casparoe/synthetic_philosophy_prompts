          1.1 Effective immediately, the adjective "true" is deprecated in all institutional copy per Directive 74-B. Staff must apply the Equivalence Schema: any assertion of the form "It is true that p" shall be rendered simply as "p". This aligns with the Consulting Semanticist's finding that the predicate adds no substantive content beyond assertion. For example, "It is true that enrollment increased" becomes "Enrollment increased." However, care is required where pragmatic force differs. In the case of the Provost's statement, "It is true that I resigned," rewriting yields "I resigned," which prematurely disclosed pending personnel actions before HR clearance. While semantically equivalent, the pragmatic impact violated Protocol 12. Staff must ensure contextual appropriateness alongside syntactic reduction. Failure to eliminate the redundant predicate will result in Style Violation Tier 1. The equivalence holds universally, regardless of communicative consequence.
