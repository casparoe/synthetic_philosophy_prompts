      *Analysis:* The counterfactual (healthy patient) is unavailable. Compliance requires a "Grafted Baseline." We assume the patient would have died of unrelated causes within 48 hours regardless of the accident. This baseline is auto-generated by the admissions software. Do not audit the randomization seed.

