      SUBJECT: Operationalizing the Equivalence Protocol (SOP 9.1)

      1. PURPOSE
      Pursuant to Board Resolution 449, this memo outlines the administrative handling of Unitary Mortality Events (UME). Under the Equivalence Protocol, there is no operational distinction between killing a patient (Act) and letting a patient die (Omission). Both constitute a termination of care trajectory and must be processed identically for liability, billing, and statistical reporting.

      2. DEFINITIONS AND BASELINE ESTABLISHMENT
      To administer the Protocol, staff must determine the counterfactual baseline: what would have occurred absent hospital intervention? This is defined by the annually gazetted Standard Course of Nature (SCN).
      2.1. The SCN currently includes: unassisted respiration, ambient atmospheric oxygen, gravity, and endogenous insulin production.
      2.2. The SCN currently excludes: supplemental oxygen, insulin injections, gravity-assisted positioning, and antibiotic administration.
      2.3. Any deviation from the SCN, whether by addition (intervention) or subtraction (withholding), is classified as a Causal Factor. Note: Failure to provide supplemental oxygen to a hypoxic patient is now coded as an Active Deprivation, equivalent to suffocation, because supplemental oxygen is not part of the SCN.

      3. CLASSIFICATION AND PROCESSING
      All deaths must be filed on Form 88-B (Unified Termination). The checkbox distinguishing "Natural Causes" from "Medical Homicide" has been removed. Both are now "Outcome Type A."
      3.1. Provisional Non-Commencement (PNC): To streamline withdrawing vs. withholding, staff may authorize a treatment in the EMR, wait thirty (30) seconds, and then log a "Decision Not to Initiate." This allows ventilator removal to be processed as a Withhold rather than a Withdrawal, reducing insurance review time by 40%. HR advises that staff should not verbally discuss the PNC window with families.

