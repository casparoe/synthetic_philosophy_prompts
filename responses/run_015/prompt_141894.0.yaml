      Annual statistics must reflect the Unified Mortality Ledger. Staff should be aware that under full Equivalence implementation, the hospital's Homicide Rate is now mathematically identical to its Mortality Rate. Consequently, the Public Health Dashboard will display "Preventable Deaths" as 100% of total discharges. Legal has confirmed this is accurate provided the SCN holds. Do not highlight this figure during donor tours.

      6. COMPLIANCE
      Failure to log UMEs correctly will result in disciplinary action. Remember: consistency is the only metric of morality.^1

