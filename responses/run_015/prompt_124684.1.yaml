answer: |-
  This is a sharp reconstruction of a classic problem in political philosophy and ethics. You have essentially built a *Principle of Fair Play* argument (associated with H.L.A. Hart and John Rawls) and then pushed it until it broke against the *Voluntarist Objection* (associated with Robert Nozick) and the *Epistemic Condition* on moral responsibility.

  You are correct that the leak is not in (3) (role occupancy) but rather in the transition from **(4) to (6)**, mediated by **(5)**. However, to fully save your intuition without accepting the absurdity of (8), you actually need to adjust **(1)** as well.

  Here is the diagnosis of the leak, the philosophical repair, and the cost of fixing it.

  ### The Primary Leak: Premise (5) and the Epistemic Condition

  Your intuition that (5) is suspicious is correct. Premise (5) claims: *Ignorance of the local convention doesn't cancel the obligation, because the normative load attaches to the role within the scheme, not to your personal knowledge of it.*

  This is the strongest link in the chain, but it is also the one that generates the *reductio*. It conflates **objective obligation** with **subjective culpability**.

  *   **Objective Obligation:** Does the duty exist? (e.g., "One ought to queue here.")
  *   **Subjective Culpability:** Is the agent blameworthy for violating it? (e.g., "It is a moral wrong to fail to queue.")

  Premise (6) makes the leap from "you have an obligation" to "you commit a genuine moral wrong." This violates the principle that *Ought Implies Can* (specifically, *Ought Implies Can Know*). If a moral obligation is truly binding, the agent must have a reasonable pathway to recognizing it. If the normative load attaches *only* to the role and ignores knowledge, you turn morality into a strict liability tort system.

  **The Fix:** Reject (5). Modify it to include an **Epistemic Accessibility Condition**.
  *   *Revised (5):* Ignorance cancels culpability if the convention was not reasonably accessible to the visitor. The obligation exists objectively, but the moral wrong only occurs if the visitor knew or should have known the rule.

  **The Cost:** You lose the binary "sinner vs. saint" distinction. Instead, you get a gradient of obligation based on **reasonable notice**. A tourist who has been in London for a week has a higher obligation to queue than one who stepped off the plane 10 minutes ago. This matches our intuitions better but makes the moral calculus messier.

  ### The Secondary Leak: Premise (1) and the Legitimacy Constraint

  Even if you fix the ignorance problem, Premise (7) still threatens you with the "bribery" example. You noted that scheme-inheritance applies to *any* coordination game. But a bribery ring is a stable coordination scheme with mutual expectations and low-cost participation. If (1) is true as written, you have a moral obligation to bribe the police officer.

  This reveals that (1) is missing a **Legitimacy Constraint**. Not all coordination schemes generate *moral* obligations; some generate only *prudential* or *conventional* expectations.

  **The Fix:** Add a moral quality filter to (1).
  *   *Revised (1):* If a social practice is a stable coordination scheme... **and the scheme is morally permissible or beneficial**... then anyone who steps into the relevant role inherits a directed moral obligation.

  **The Cost:** You have to admit that "stability" and "compliance" are not enough to generate morality. You need an external standard of justice to judge the scheme itself. This means you can't derive morality *solely* from social facts (the "is-ought" problem creeps back in).

  ### The Hidden Move: Voluntariness vs. Benefit

  You mentioned feeling a hidden move about "voluntariness versus mere role-occupancy." This is the Nozick objection.

  In your Premise (3), you say the visitor "receives the benefits of the scheme."
  *   **Queuing:** The benefit is clear (order, fairness).
  *   **Tipping:** The benefit is debatable (some argue it subsidizes low wages).
  *   **Bribery:** The "benefit" is cutting the line, which is parasitic on the system.

  Nozick argued that receiving a benefit you didn't *ask for* does not bind you to contribute. If I broadcast music into your house and you enjoy it, you don't owe me money unless you *accepted* the benefit voluntarily.

  To save your argument, you need to argue that entering a restaurant or a public street is a **voluntary act of participation**, not just passive reception of benefit.
  *   **Repair:** Strengthen (3) to specify **Voluntary Participation**. A pedestrian crossing a street is less voluntary than a diner sitting down. Therefore, the obligation to follow jaywalking norms is weaker than the obligation to tip.

  ### The Repaired Argument

  If you want to keep the core intuition (tourists should follow local norms) without the absurdity (tourists are sinners for ignorance/bribery), here is the revised chain:

  1.  **Legitimate Scheme-Inheritance:** If a social practice is a stable, **morally permissible** coordination scheme, anyone who **voluntarily** steps into the relevant role inherits a pro-tanto obligation to follow it.
  2.  **Examples:** Tipping (US) and Queuing (UK) are morally permissible schemes; Bribery is not.
  3.  **Voluntary Entry:** A visitor who chooses to eat at a restaurant voluntarily enters the tipping scheme. (Street crossing is less voluntary, creating a weaker obligation).
  4.  **Obligation:** The visitor has an obligation to comply.
  5.  **Epistemic Condition:** The obligation generates **moral culpability** only if the rule was **reasonably accessible** to the visitor.
  6.  **Judgment:** A tourist who doesn't tip after a week in the US commits a moral wrong. A tourist who jaywalks on day one in Japan commits a faux pas, but not a moral wrong.
  7.  **Limitation:** This does not apply to immoral schemes (bribery) or obscure rituals without notice.
  8.  **Conclusion:** Tourists have obligations, but they are graded by voluntariness and knowledge.

  ### Summary of Costs

  To save (1) and (3) as you wished, you must pay these prices:

  1.  **Moral Gradience:** You cannot say "it is a moral wrong" simpliciter. You must say "it is a wrong *relative to their epistemic position*."
  2.  **External Morality:** You cannot derive the obligation *just* from the fact that the scheme exists (Premise 1 needs the "morally permissible" clause).
  3.  **Voluntariness Threshold:** You have to admit that some "roles" (like pedestrian) bind you less than others (like diner) because the entry is less voluntary.

  **Verdict:** The slip is definitely in **(5)**. By removing the knowledge requirement, you turned a social contract into a trap. Reinstating the **Epistemic Accessibility Condition** saves the theory from the *reductio* while preserving the intuition that, once you know the rules, you are bound to play the game.
