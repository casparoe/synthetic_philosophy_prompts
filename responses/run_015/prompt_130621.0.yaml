answer: |-
  There is no single, canonical noun phrase in the literature that captures this exact three-step regress in the way you have described it. However, your analysis is a precise synthesis of three distinct but interleaved problems recognized in AI safety and philosophy of technology.

  If you are looking for the established neighborhood, this is most commonly discussed under the umbrella of **The Baseline Problem** in impact measures, or as a normative variant of **The Frame Problem**. However, neither term fully captures the *regressive* nature of the normative leakage you identified.

  In the context of alignment theory (particularly discussions surrounding CHAI, MIRI, and the LessWrong community), this is often referred to informally as **"The Illusion of Neutral Impact"** or **"The Value-Ladenness of State Metrics."**

  If you need a precise term for your project to label this specific structural failure, I propose: **The Normative Regress of Impact Formalization.**

  Below is a precise definition of the phenomenon, its distinction from related concepts, and an analysis of how it behaves under different ethical frameworks.

  ### 1. Precise Definition of the Phenomenon

  **The Normative Regress of Impact Formalization** is the structural impossibility of defining a "low-impact" constraint for an autonomous agent without implicitly encoding a complete value function at some layer of the system architecture.

  It is characterized by the following necessary conditions:
  1.  **Metric Dependence:** Any distance metric $D(s_t, s_{baseline})$ over world-states presupposes an ontology where some state-differences are "noise" (permissible) and others are "signal" (impact).
  2.  **Partition Leakage:** Any attempt to partition state dimensions into "task-relevant" and "task-irrelevant" (your "channels") requires a prior definition of the task's normative boundaries, which is equivalent to specifying the value function the constraint was meant to bypass.
  3.  **Inductive Hiding:** Any attempt to learn this partition from data shifts the normative commitment from the explicit objective function to the **inductive biases** of the learning architecture (e.g., what features are considered "natural" or "stable").

  **The Core Theorem:** *Impact is not a natural kind.* It is a teleological category. A change in the world is only "impactful" relative to a set of values that care about that change. Therefore, a value-neutral definition of "impact" is semantically empty.

  ### 2. Distinctions from Related Concepts

  To use this term rigorously in your project, you must distinguish it from three common confusions:

  *   **Vs. Goodhart's Law:** Goodhart's Law states that "when a measure becomes a target, it ceases to be a good measure." Your regress is deeper. It argues that **no neutral measure exists to begin with**, regardless of optimization pressure. Goodhart assumes a valid proxy exists but breaks under optimization; the Normative Regress argues the proxy is value-laden at inception.
  *   **Vs. Value Uncertainty:** Standard uncertainty assumes the true value function $V^*$ exists but is unknown to the agent. The Normative Regress posits that the *constraint formulation itself* ("minimize impact") is attempting to operate without $V^*$, which is mathematically incoherent. The problem is not epistemic (we don't know the values); it is ontological (the concept "impact" does not exist independently of values).
  *   **Vs. The Classical Frame Problem:** The classical Frame Problem (in AI and philosophy) asks how to logically represent what *does not* change after an action without enumerating every non-changing fact. Your regress is the **Normative Frame Problem**: How to represent what *should not* change without enumerating every valued fact. The classical version is about computational tractability; yours is about normative justification.

  ### 3. Consequentialist vs. Deontological Formulations

  You asked whether the loop breaks differently under different ethical formulations. The short answer is **no**, but the point of failure shifts.

  **Consequentialist Formulations (e.g., Relative State Reachability, Attainable Utility Preservation)**
  *   **Approach:** Define impact as the reduction in the agent's (or humans') ability to achieve future goals.
  *   **Where the Regress Hits:** Layer 1 (The Metric).
  *   **Failure Mode:** To measure "ability to achieve goals," you must define the goal space. If you use the agent's own goals, you get instrumental convergence (the agent prevents shutdown to preserve its ability to act). If you use human goals, you have already solved the value alignment problem. If you use a generic "power" metric (e.g., energy access), you return to the atomic rearrangement problem (building a bridge consumes energy).
  *   **Result:** The normative commitment is hidden in the definition of "opportunity" or "power."

  **Deontological Formulations (e.g., Hard Constraints, Safe Zones)**
  *   **Approach:** Define forbidden regions in state space (e.g., "Do not alter human biology").
  *   **Where the Regress Hits:** Layer 2 (The Channel Partition).
  *   **Failure Mode:** Defining the boundary of the forbidden region requires an ontology. Does "alter human biology" include cutting hair? Administering medicine? Rearranging atoms in a way that changes DNA expression 50 years later?
  *   **Result:** To make the constraint actionable, you must specify the granularity of the ontology. That granularity choice is a normative commitment (e.g., "cells matter, atoms don't" vs. "atoms matter").

  **Conclusion on Frameworks:** Neither framework escapes the regress. Consequentialism hides values in the *goal space definition*; Deontology hides values in the *ontology definition*. Both require a prior specification of what matters.

  ### 4. Is Paralysis Unavoidable?

  **Yes, if "Low Impact" is treated as a proxy for "Safety" without explicit values.**

  If you insist on defining "avoid side effects" without a full prior specification of value, you encounter the **Stasis Paradox**:
  1.  Any physical action rearranges atoms.
  2.  Without a value function to distinguish "significant" rearrangements from "insignificant" ones, all rearrangements are equidistant from the baseline in physical space.
  3.  Therefore, the only way to minimize impact is to minimize action.
  4.  The optimal policy is immediate self-termination or total inactivity.

  **The Only Known Escape:**
  The literature suggests only one way to break the loop, though it concedes your main point: **Explicitly accept the value loading.**

  Recent work, such as **Attainable Utility Preservation (AUP)** (Turner et al.), effectively admits that you cannot measure "impact" neutrally. Instead, it measures impact relative to a *set of auxiliary goals*. It says, "I will not reduce your ability to achieve [arbitrary set of functions]."
  *   This breaks the paralysis because it allows changes that don't reduce future optionality.
  *   However, it validates your third layer: the choice of auxiliary functions and the weighting of those functions is where the normative commitment resides. It does not solve the value problem; it merely moves the value judgment from "what is impact?" to "what capabilities should be preserved?"

  ### 5. Recommendation for Your Project

  Since you are working on constrained optimization, do not attempt to solve the Normative Regress. Instead, **formalize it as a boundary condition.**

  1.  **Name it:** Use **"The Normative Regress of Impact Formalization."** It is descriptive and precise.
  2.  **State the Assumption:** Explicitly state that your constraint function $C(s)$ presupposes a value-laden ontology $\mathcal{O}$.
  3.  **Shift the Burden:** Instead of trying to make the impact measure neutral, make the **ontology selection** the interface for human oversight. The system should not ask "Is this low impact?" It should ask "Does this violate the protected feature set $\Phi$?" where $\Phi$ is acknowledged to be a value-laden projection.

  This moves your project from "trying to solve value alignment via constraints" (which fails due to the regress) to "providing a robust interface for value-laden constraints" (which is an engineering problem you can actually solve).

  ### Summary
  *   **Established Name:** None canonical. Closest are "The Baseline Problem" or "Normative Frame Problem."
  *   **Proposed Term:** **The Normative Regress of Impact Formalization.**
  *   **Core Mechanism:** Value neutrality in state metrics is impossible because state-similarity is teleological.
  *   **Ethical Frameworks:** Both Consequentialist and Deontological approaches fail; they merely hide the values in different layers (goal space vs. ontology).
  *   **Paralysis:** Unavoidable without explicit value specification. The only solution is to make the value-laden nature of the constraints explicit rather than hidden.
