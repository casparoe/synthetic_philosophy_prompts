answer: |-
  ### Essay Question

  **The Ratchet Clause**

  A constitutional convention proposes an "escalating entrenchment" mechanism for certain foundational provisions (e.g., judicial tenure). If a repeal attempt fails, the threshold for the next attempt rises by 5%, and a two-year cooling-off period applies. Proponents argue this filters out fleeting populist anger: if a provision survives repeated challenges, it proves enduring value.

  Critically evaluate this mechanism. Is it genuinely a Ulysses contract, or merely something else in Ulysses clothing? In your answer, address: (1) the disanalogy between binding one's future self versus binding a changing population; (2) whether penalizing repeated attempts distinguishes impaired reversals from considered changes of mind; and (3) the possibility that protected factions might game the system by forcing losing votes to raise the threshold. Conclude whether this device fixes or quietly worsens the standard objections to precommitment.

  ***

  ### Model Answer

  The proposed "ratchet clause" presents itself as a sophisticated Ulysses contract, designed to bind the democratic body against its own future moments of irrationality. However, upon closer examination of agency, epistemic signaling, and strategic incentives, the mechanism fails to function as a legitimate precommitment device. Instead, it operates as a dynamic entrenchment tool that exacerbates the "dead hand" problem by decoupling constitutional rigidity from popular will.

  The primary failure lies in the analogy of agency. A standard Ulysses contract relies on identity continuity: the person binding themselves to the mast is the same person who later hears the Sirens. The autonomy restriction is justified because the past and future selves are identical agents navigating temporary impairment. In constitutional theory, "The People" is a fictional construct masking demographic turnover. A ratchet clause compounds this disanalogy. It allows a past demographic majority to increasingly constrain a future demographic majority that may not share the same values or composition. By raising the threshold based on past failures, the clause privileges the will of the dead over the living not just statically, but exponentially. It treats the polity as a single immortal agent capable of learning, when it is actually a succession of different agents being bound by their predecessors' failures.

  Secondly, the mechanism's logic regarding "repeated failure" is epistemically flawed. Proponents argue that surviving multiple repeal attempts signals enduring value, distinguishing considered change from impaired impulse. However, this conflates lack of sufficient supermajority with lack of popular will. In a large democracy, mobilizing for repeal involves significant transaction costs. A provision might survive not because the population genuinely endorses it, but because opposition is fragmented or resource-constrained. By penalizing repeated attempts with higher thresholds and time gaps, the clause punishes persistence. It assumes that if the will were genuine, it would overcome increasing hurdles immediately. In reality, it creates a status quo bias where the cost of change escalates regardless of whether the desire for change is rational or impaired. This undermines the Ulysses justification, which requires that the binding mechanism protect against *irrationality*, not merely against *difficulty*.

  Thirdly, and most destructively, the ratchet creates perverse strategic incentives that allow for gaming. In a standard Ulysses contract, the binding mechanism is external (the ropes); the agent cannot untie themselves. In this constitutional design, the beneficiaries of the entrenched provision (e.g., judicial elites or central bankers) retain the agency to trigger repeal votes. Knowing that a failed vote increases protection, a faction could strategically sponsor repeal motions they intend to lose. By manufacturing "failed attempts," they can ratchet the threshold upward without ever risking actual repeal. This severs the link between the threshold and popular sovereignty entirely. The entrenchment becomes self-perpetuating not because of enduring popular support, but because of strategic manipulation by the protected class. This is not precommitment; it is insulation.

  Therefore, this device is not a Ulysses contract in Ulysses clothing; it is a lock-in mechanism disguised as stability. A true Ulysses contract preserves autonomy by ensuring the agent's long-term goals survive temporary weakness. This clause preserves specific policies by making them increasingly immune to the agent's current will. It does not fix the standard objections to precommitment; it worsens them. It amplifies the dead-hand worry by allowing past majorities to impose rising costs on future ones, and it introduces a new legitimacy deficit by allowing factions to manipulate the difficulty of amendment through staged failures. Ultimately, it sacrifices democratic responsiveness for a simulacrum of stability, confusing the difficulty of change with the legitimacy of the status quo.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. The Identity/Population Disanalogy (4 Marks)**
  *   **Required:** Explicitly contrasts the single-agent continuity in Ulysses contracts with the demographic turnover in constitutional politics. Notes that the ratchet compounds this by letting past demographics constrain future ones exponentially.
  *   **Common Botch:** Treating "The People" as a single immortal entity without questioning the demographic reality, or failing to explain why the *escalating* nature makes this worse than static entrenchment.

  **2. Interpretation of Failure (Will vs. Friction) (4 Marks)**
  *   **Required:** Argues that failed votes may reflect transaction costs or fragmentation rather than lack of will. Explains how penalizing repetition punishes legitimate persistence, not just impaired impulses.
  *   **Common Botch:** Accepting the premise that failed votes prove lack of desire, or focusing only on the time gap without analyzing the threshold increase.

  **3. Strategic Gaming Analysis (4 Marks)**
  *   **Required:** Identifies that beneficiaries can force votes they expect to lose to artificially raise the threshold. Explains how this decouples the protection level from actual popular support.
  *   **Common Botch:** Ignoring the incentive structure entirely, or assuming only opponents of the provision would trigger votes.

  **4. Classification Verdict (Ulysses or Not?) (4 Marks)**
  *   **Required:** Concludes clearly that the device is *not* a true Ulysses contract (or is a corrupted version). Justifies this based on the lack of shared agency or the inability to distinguish impairment from change.
  *   **Common Botch:** Sitting on the fence ("it is partly Ulysses") without resolving the tension, or defining Ulysses contracts too loosely to fit the case.

  **5. Normative Conclusion (Fix or Worsen?) (4 Marks)**
  *   **Required:** Takes a stance on whether objections are fixed or worsened (must argue "worsened" for full credit given the logic). Connects the gaming/identity issues to the broader legitimacy of precommitment.
  *   **Common Botch:** Concluding that the mechanism is neutral or purely technical, failing to address the normative impact on democratic autonomy.
