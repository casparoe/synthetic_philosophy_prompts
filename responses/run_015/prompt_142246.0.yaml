          2.  **The "True" Unit:** Stats says "it depends on the model." Philosophy asks "what is the *real* unit?" The stats answer is instrumentalist; the philosophy question is often realist.
          3.  **Teleology/Function:** "Stoppers function to protect." Stats sees a correlation. Philosophy sees a *reason*.
          4.  **Continuity of Lineage:** The definition of "individual" over time. Stats takes the data structure as given. Philosophy questions the data structure (is the colony an individual?).

  5.  **Refining the Argument (Self-Correction/Nuance):**
