  2.  **Deconstruct the Case Study:**
      *   **Organism:** Colonial, sessile, marine.
      *   **Structure:** Clonal colonies (single founder). Variation is *between* colonies, not within (genetically).
      *   **Phenotype:** "Stoppers" (somatic cells that don't reproduce, protect colony).
      *   **Data:**
