              *   Daughter colonies: 3.0.
      *   **The Tension:**
          *   *Individual level:* Stoppers have fitness 0. Non-stoppers have high fitness. Within a colony, stoppers are selected *against*.
          *   *Colony level:* High-stopper colonies produce more daughter colonies (3.0 vs 0.5). Colonies with stoppers are selected *for*.
