      *   **The Translation Layer:** Go through the requested concepts one by one, mapping them to Stats terms.
      *   **The Case Study Analysis:** Run the numbers/models on the marine colonial case. Show the conflict between $\beta_{individual}$ and $\gamma_{group}$.
      *   **The Residue Report:** The core evaluation. What was lost? (Causality, Realism vs. Instrumentalism, The definition of the Individual).
      *   **Verdict:** Who is right? (User vs. Tutor).

  7.  **Drafting the Content (Mental Check of specific stats terms):**
      *   *Heritability:* Yes, ICC in random intercept model.
      *   *Price Equation:* $Cov(w, z) = E[Cov(w, z|group)] + Cov(E[w|group], E[z|group])$. This is exactly ANOVA.
      *   *Selection For/Of:* DAGs. $Stopper \to Fitness$. Confounder = Colony Quality.
      *   *Fitness Propensity:* GLM link function (log link for counts) vs. realized residuals.

  8.  **Final Polish:** Ensure tone is appropriate (peer-to-peer academic, rigorous but accessible). Make sure the "Residue" section is punchy and directly answers the "Who is closer?" question. (Self-correction: Ensure I don't dismiss the philosophical question too easily; the "unit" question is often about *identity*, which stats presupposes).

  9.  *(Final check against constraints)*: Did I use the made-up numbers? Yes. Did I cover all the specific terms requested? Yes. Did I flag assumptions? Yes.

