answer: |-
  **Setting:** *A quiet corner of the department lounge, after a seminar on the Sorites Paradox. Elias (Epistemicist) and Sofia (Supervaluationist) are standing by a whiteboard covered in grain counts.*

  **Elias:** Let's stick with the concrete case. We have 543 grains of sand arranged in a pyramid. Is it a heap?

  **Sofia:** It's a borderline case. If you mean "Is it *determinately* a heap?" I'd say no. If you mean "Is it *true* on all acceptable ways of making 'heap' precise?" also no. But if you mean "Is it compatible with being a heap?" then yes.

  **Elias:** I think you're overcomplicating the truth conditions. There is a fact of the matter. Either 543 grains satisfies the extension of the predicate "heap" or it doesn. In this specific context, with these specific grains, there is a sharp cutoff. Let's say, for the sake of argument, that 543 is a heap and 542 is not.

  **Sofia:** But that implies a magical semantic precision. Our usage of "heap" never fixed a specific number. We learned the word by ostension and rough practice. To say there is a *fact* that 543 is in and 542 is out is to posit a semantic reality that our linguistic behavior doesn't support. You're positing a boundary where our practice only gives us a gradient.

  **Elias:** I'm not positing a boundary in our *practice*, Sofia. I'm positing a boundary in the *reference* of the term. Reference is sensitive to micro-facts we aren't privy to. Causal theories of reference, environmental constraints, the stability of the category—these fix an extension. The fact that we can't *know* where the line is doesn't mean the line isn't there. Bivalence holds; knowledge fails.

  **Sofia:** That's the classic epistemic move: save classical logic by sacrificing knowability. But consider the boundary itself. You claim there's a sharp line between heap and non-heap. But surely there's also a boundary between "definitely a heap" and "borderline heap." Is *that* boundary sharp?

  **Elias:** Yes.

  **Sofia:** Really? So there is a specific number of grains, $n$, such that $n$ is definitely a heap, but $n-1$ is merely borderline? That seems even more implausible than the first claim. You're committing yourself to higher-order sharp boundaries. It looks like a regress of ignorance. You're just pushing the vagueness back into the epistemology without solving the intuitive problem that the concept itself feels fuzzy.

  **Elias:** It's not a regress of *problems*, it's a hierarchy of *facts*. Look, if vagueness were semantic indeterminacy, as you claim, then we should be able to say "It is indeterminate whether this is a heap" and have that statement be determinately true. But if *that* statement has a sharp boundary too, haven't you just reintroduced sharp boundaries via the back door?

  **Sofia:** Not necessarily. Supervaluationism can handle higher-order vagueness by iterating the determinacy operator. We can say it's indeterminate whether it's determinately a heap. We don't need a sharp line between the definite and the borderline; we can allow the set of "acceptable precisifications" to shift contextually.

  **Elias:** But that contextual shift is just a fancy way of saying "we don't know which precisification is the right one." My view is more parsimonious. The regress stops where the facts stop. The reason higher-order vagueness feels intuitive is that our margin for error expands as we move up the orders. We are ignorant of the first boundary, and we are even more ignorant of the boundary of the boundary. It's all epistemology. The semantics is classical and clean.

  **Sofia:** And that's where we diverge. You think the semantics is clean and the mind is blind. I think the semantics is inherently partial and the mind is doing the best it can with incomplete rules. If I say "543 grains is a heap," and you say "That's true but unknowable," and I say "That's neither true nor false," we aren't just disagreeing about what we can access.

  **Elias:** No, we aren't. Because if you're right, the Law of Excluded Middle fails for vague predicates. If I'm right, it holds universally. That's a logical difference, grounded in a metaphysical commitment about what meanings *are*.

  **Sofia:** So, where do you locate the core of our disagreement?

  **Elias:** For me, it's purely **epistemology**. The semantics is standard classical logic; the world is precise; the predicate picks out a precise set. The only thing "vague" is our cognitive access to that extension. We are disagreeing about the limits of knowledge, not the structure of meaning.

  **Sofia:** And for me, it's fundamentally **semantics**. It's not that we lack knowledge of a hidden fact; it's that there is no fact to be known because the meaning of "heap" is not a function from objects to classical truth values. It's a function from objects to truth values relative to precisifications. We are disagreeing about the nature of linguistic content itself.

  **Elias:** Then we agree on one thing: neither of us thinks the *sand* is vague.

  **Sofia:** Agreed. The ontology is safe. It's the language that's doing the work.

  **Elias:** Or the lack thereof.

  **Sofia:** *[Smiles]* We'll have to let the seminar decide which lack is more costly.
