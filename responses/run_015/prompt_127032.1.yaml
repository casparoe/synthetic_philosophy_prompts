          *   *Anumāna (Inference):* Inferring poison from spots/smell works.
          *   *Upamāna (Comparison):* This is the tricky one. In Nyāya, *upamāna* is specifically knowing the relation between a name and a thing via similarity to a known thing. It's not just "this looks like that." It's "This animal is a *gavaya* because it looks like the cow I was told about." The mushroom example needs to capture the *naming/description* aspect, not just visual similarity.
