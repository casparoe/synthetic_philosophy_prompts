answer: |-
  Here is a plan for your study session. It is designed to be interactive, structurally logical, and focused on the *function* of each *pramāṇa* rather than just definitions.

  ### 1. The Core Scenario: The Mushroom Forager
  Your mushroom idea is excellent, but it needs one specific tweak to work for *upamāna*.
  *   **The Problem:** If you use the mushroom example just for "Is this poisonous?", *upamāna* gets confused with *anumāna* (inference).
  *   **The Fix:** *Upamāna* in Nyāya is specifically about **connecting a name to a new object** based on a description of similarity. It is not just "this looks like that"; it is "this is what the word *X* refers to."
  *   **Revised Scenario:** You are in a forest looking for a specific medicinal mushroom called the **"Sun-Cap."** You have never seen one.
      *   **Pratyakṣa:** You see a mushroom.
      *   **Anumāna:** You infer it is old because it is shriveled.
      *   **Upamāna:** You identify it *as* a "Sun-Cap" because it matches a description you were given.
      *   **Śabda:** You are told by an expert that it cures headaches.

  ---

  ### 2. The Sequence & Dependencies (The "Why" Order)
  Do not present them as a list. Present them as a **toolkit expansion**. Each tool solves a problem the previous one cannot.

  **Step 1: Pratyakṣa (Perception) — The Foundation**
  *   **What it is:** Direct sensory contact.
  *   **In Scenario:** You see the mushroom. You see its color, shape, and size.
  *   **Limitation:** It only tells you what is *right here, right now*. It cannot tell you what the mushroom *is* (its name), what it *does* (its effects), or what is *hidden* (its toxicity).
  *   **Dependency:** Everything else rests on this. You cannot infer or compare without data.

  **Step 2: Anumāna (Inference) — The Extender**
  *   **What it is:** Knowledge of something hidden based on a mark you can see. (Smoke → Fire).
  *   **In Scenario:** You see the mushroom has shriveled gills. You know shriveled gills *always* accompany old age. You infer: "This mushroom is old."
  *   **Why it's not Perception:** You didn't see "old age"; you saw gills and inferred the age.
  *   **Limitation:** Inference requires a universal connection you already know (e.g., "All shriveled gills mean old"). It cannot teach you a **new name** for a new object. If you've never seen a "Sun-Cap," you can't infer "This is a Sun-Cap" just by looking at it.
  *   **Misconception Check:** Students often think inference is just "guessing." Emphasize that for Nyāya, it requires a rigid, universal rule (*vyāpti*), not just probability.

  **Step 3: Upamāna (Comparison) — The Namer**
  *   **What it is:** Knowing the relation between a **word** and a **new object** via similarity to a known object.
  *   **In Scenario:** Before the trip, a guide told you: "A *Sun-Cap* looks like a common Button mushroom, but has orange spots."
      *   You know what a Button mushroom is.
      *   You enter the forest and see a mushroom with orange spots that looks like a Button mushroom.
      *   You cognize: "Ah, *this* is what the word 'Sun-Cap' refers to."
  *   **Why it's not Inference (Crucial Point):** Inference moves from Mark → Thing (Gills → Old). *Upamāna* moves from Description → Name Match ("Looks like Button" → "This is a Sun-Cap"). It creates the link between language and the world for new things.
  *   **Misconception Check:** **Western Analogy vs. Nyāya Upamāna.**
      *   *Western Analogy:* "A is like B, so A probably has property Z." (Probabilistic/Explanatory).
      *   *Nyāya Upamāna:* "A matches the description of B, so A is the referent of the word 'B'." (Definitive/Ostensive).
      *   *Head this off here:* Explicitly state: "This isn't about guessing properties; it's about fixing reference."

  **Step 4: Śabda (Testimony) — The Transmitter**
  *   **What it is:** Knowledge derived from the statement of a reliable person (*āpta*).
  *   **In Scenario:** The guide says, "The Sun-Cap cures headaches."
  *   **Why it's not Inference:** You might argue, "I infer he is honest, so I believe him." Nyāya says no. The knowledge comes from *understanding the sentence*, not inferring the speaker's psychology. If you had to infer every time someone spoke, communication would be too slow and uncertain.
  *   **Misconception Check:** **Blind Authority.**
      *   *Head this off here:* Clarify that *Śabda* is not "believe because I said so." It requires the speaker to be competent and truthful, and the listener must understand the language. It is a cognitive event of grasping meaning, not an act of submission.
      *   *Why it's irreducible:* You cannot perceive, infer, or compare "cures headaches" (that's a hidden causal power). You must be told.

  ---

  ### 3. The "Irreducibility" Check Question
  At the end of the session, pose this scenario to test if they understand why Nyāya insists on **four** distinct sources rather than collapsing them (e.g., saying Testimony is just Inference, or Comparison is just Perception).

  **The Question:**
  > "Imagine a reductionist opponent argues that *Upamāna* (Comparison) is unnecessary. They say: 'When you identify the Sun-Cap, you are just using Testimony (the guide's description) and Perception (seeing the mushroom). Why do we need a separate category for Comparison?'
  >
  > **Based on our session, what is the specific piece of knowledge you gain in the forest that Testimony and Perception *alone* cannot give you?**"

  **The Answer You're Looking For:**
  Testimony gave you the *description* ("looks like a Button mushroom"). Perception gave you the *object* ("here is a mushroom"). Neither alone gives you the **knowledge of the relation between the word 'Sun-Cap' and this specific object**. *Upamāna* is the specific cognitive event of matching the description to the object to fix the reference. Without it, you have a description and an object, but you don't know *which* word applies to *this* object.

  ---

  ### 4. What to Leave Out (Scope Boundaries)
  To keep this manageable for an intro section, explicitly tell your group: **"We are bracketing the following technical debates."**

  1.  **Navya-Nyāya (New Logic):** Later Nyāya philosophers (13th century+) developed incredibly complex technical languages to define these. We are sticking to the earlier, intuitive framework.
  2.  **The Debate on Validity:** There is a huge debate on whether knowledge is "self-validating" (*svataḥ prāmāṇya*) or needs to be checked by another source. We are assuming for today that if the *pramāṇa* is functioning correctly, the knowledge is valid.
  3.  **Metaphysical Details:** We aren't diving into the specific categories of reality (*padārthas*) that these sources reveal (like *absence* or *inherence*). We are focusing strictly on the *sources* themselves.

  ### 5. Session Flow Summary (Cheat Sheet)
  1.  **Hook:** The Mushroom Hunt (Stakes: Don't die, find medicine).
  2.  **Pratyakṣa:** See the mushroom. (Limit: Only surface features).
  3.  **Anumāna:** Infer age/toxicity. (Limit: Needs universal rules, can't name new things).
  4.  **Upamāna:** Identify it *as* a "Sun-Cap." (Limit: Needs a prior description. **Not** Western analogy).
  5.  **Śabda:** Learn it cures headaches. (Limit: Needs a reliable speaker. **Not** blind faith).
  6.  **Wrap:** The Check Question on Irreducibility.

  This structure ensures you aren't just listing terms; you are showing why Nyāya built a four-part system to cover the gaps left by each individual method.
