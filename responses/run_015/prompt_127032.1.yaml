  5.  **Refining the Misconceptions:**
      *   *Śabda:* Address early or at the *Śabda* step? Best at the *Śabda* step. Clarify it's about *linguistic cognition*, not just obedience.
      *   *Upamāna:* Address at the *Upamāna* step. Distinguish from Western analogy (which is often probabilistic inference). Nyāya *upamāna* yields definite knowledge of the *relation between word and object*.

  6.  **Refining the Check Question:**
