prompt: |-
  I'm taking this intro indian philosophy course and next week I have to run a study session for my section on Nyāya epistemology, specifically the four pramāṇas. I don't want to just dump pratyakṣa, anumāna, upamāna and śabda in order like some encyclopedia entry. Can you plan the explainer for me? What order do they actually have to come in so the dependencies are clear — like why you can't understand upamāna without knowing what anumāna already does? What's the single concrete scenario that should carry the whole thing? I'm thinking something like identifying whether a wild mushrom is poisonous using sight, inference from similar ones, comparison to a known sample, and then being told by a local forager — but tell me if that example has problems and what it needs to have and lack. Also what misconceptions should I expect — probably people will think śabda is just blind authoraty bias, or that upamāna is exactly the same as western analogical reasoning — and exactly where in the sequence should I head each one off? I need a check question at the end that shows whether they got the structural point about why Nyāya insists on four ireducible sources rather than collapsing them. And tell me what I should openly leave out at this level — maybe the Navya-Nyāya revisions? — and say so. Oh, and no reading lists or sutra citations please, I wouldn't be able to check them and neither can anyone here.
