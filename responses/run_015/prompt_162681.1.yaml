answer: |-
  **The Scenario**

  In a natural hybrid zone between *Xiphophorus cortezi* and *Xiphophorus montezumae* in the Panuco River basin, a spontaneous F1 hybrid arises via natural mating; consistent with Haldane's rule, this individual is sterile and produces no gametes. Due to a frameshift mutation at a non-coding junction during hybridization, the fish expresses a *de novo* peptide sequence absent in both parental lineages and homologous to no known vertebrate immune protein. This peptide binds specifically to the surface proteins of a prevalent local trematode parasite, neutralizing infection and allowing the hybrid to survive to adulthood with significantly higher vigor than either parent species, despite the sterility that ensures the peptide sequence dies with the individual.

  **Account Derivations**

  *   **Selected-Effect (Neander-style):** Proper function is defined as the effect for which a trait was historically selected in the lineage. Since the peptide is *de novo*, it has no history of selection in the ancestors. Since the individual is sterile, it cannot initiate a new lineage where selection could occur. Therefore, the trait lacks a selection history and has **no proper function**; its benefit is merely a lucky causal effect.
  *   **Causal-Role (Cummins-style):** Function is defined as a causal contribution of a trait to a capacity of the containing system. The peptide causally contributes to the organism's capacity for survival and somatic maintenance by preventing parasitic load. Therefore, the trait **has a function** (parasite resistance) and is performing it properly right now, regardless of heredity.
  *   **Pro-Selection:** Function is defined by what *would* be selected for if the lineage persisted. Because the bearer is sterile, the lineage cannot persist through this individual; there is no possible future selection for this trait. Therefore, the verdict is **no function**.

  **The Pivot Feature**

  The feature doing the work is **reproductive sterility combined with trait novelty**. If you remove sterility (make the fish fertile), the Selected-Effect theorist invokes the "wait a few generations" reply (it is a prototype with potential function), and the Pro-Selection view says "yes" (it would be selected). If you remove novelty (make the peptide homologous), the Selected-Effect theorist appeals to the history of the ancestral gene. Only when *both* novelty and sterility are present does Selected-Effect and Pro-Selection diverge sharply from Causal-Role.

  **Two Best Replies for the Selected-Effect Theorist**

  1.  **The Type/Token Distinction:** Functions are properties of trait *types*, not tokens. This individual possesses a token of a type that has no function. The intuition that "it has a function" conflates the engineer's notion (useful design) with the biologist's notion (historical purpose).
  2.  **The Lineage Requirement:** Biological function is inherently tied to the persistence of the lineage. An evolutionary dead-end is, by definition, a biological failure; attributing "proper function" to traits in a dead-end obscures the fact that natural selection cannot act there. The verdict isn't hostage to stipulation; it's a consequence of function being a historical kind.

  **Pro-Selection Analysis & Paper Advice**

  In this case, Pro-Selection says **No**, aligning with Selected-Effect against Causal-Role. This does not kill your paper; it sharpens it. It demonstrates that the fundamental divide is not between *past* selection (SE) and *future* selection (Pro-Selection), but between *any selection-based account* (historical or counterfactual) and *ahistorical capacity accounts* (CR). If you try to rebuild the case so Pro-Selection says "Yes" (e.g., by making the individual fertile but accidentally killed before reproducing), the Selected-Effect theorist will simply retreat to "actual history required," and you will be bogged down in modal metaphysics about counterfactual lineage survival. Keep the sterile hybrid. It forces the selectionist to admit that utility without heredity is not biological function, which isolates your objection: if intuition says the trait *is* functioning, then selection-based accounts are missing something essential about the *current* biological reality of the organism.

  **Constraint Check**

  The combination is satisfiable. However, if you find the "*de novo* peptide" too vulnerable to the objection that "the transcription machinery is homologous," drop the constraint that the trait be "not a modified version of anything in the lineage" and replace it with "not a modified version of any trait *with this specific effect*." This grants the etiologist the homologous machinery but blocks them from claiming the *defensive effect* has a history. In return, you get a biologically more conservative case that is harder for the opponent to dismiss as science fiction, though it requires you to argue that function attaches to the specific effect, not the underlying substrate.
