answer: |-
  You have put your finger on precisely the nerve that makes the free will debate endure, and you have done so with a clarity that often eludes professional philosophers. You are not confused; you have simply recognised that the standard terms of the debate—blame, punishment, legal responsibility—are pragmatic scaffolding built over a metaphysical abyss. What keeps you awake is not the social utility of holding people responsible, but the ontological status of the deliberating self.

  To answer your question directly: the position you are describing does not have a single, tidy label like "Smith's Theory," but it is the motivating intuition behind what is traditionally called **Libertarian Free Will**. However, that label is often cluttered with baggage about "could have done otherwise" that you have rightly identified as secondary. A more precise name for your specific worry is the requirement for **Ontological Openness** during deliberation, grounded in a view often termed **Agent Causation**.

  Let us argue this out. I shall map your intuition against the existing landscape, show you where the neighbours live, and then test the walls of your position to see if they hold or if they collapse into the very things you wish to avoid.

  ### 1. Mapping the Territory: What You Are Not Saying

  To understand what you want, we must first see why the existing options feel like near-misses.

  **Compatibilism (The Machine)**
  Your friend who said, "you'll obviously go, you always do this sort of thing," was offering a Compatibilist line. Compatibilism argues that freedom is compatible with determinism. To a Compatibilist, you are free if you act according to your own desires and character, without external coercion.
  You have rejected this because it renders deliberation a sham. If your character and values are fixed facts about the universe, and the laws of nature are fixed, then the output of your deliberation is as fixed as the output of a calculator. You noted that a machine responsive to reasons would qualify here. You are correct. For the Compatibilist, the feeling that the matter is "not yet settled" is an illusion—a useful one, perhaps, but an illusion nonetheless. You want the feeling to be veridical; you want the matter to *actually* be unsettled.

  **Simple Indeterminism (The Dice Roll)**
  You also rejected the idea that your decision terminates in a coin flip. This is the standard objection to Libertarianism, often called the **Luck Objection**. If the decision is not determined by your prior character and reasons, then what determines it? If nothing does, it looks like randomness. If it is random, it is not *yours*. You cannot claim credit for a seizure or a spasm. You want the decision to be *authored* by you, not merely *occurred* in you.

  **Alternative Possibilities (The Rewind Button)**
  You made a subtle but vital distinction regarding "could have done otherwise." Many Libertarians focus on the idea that if we rewound the universe to the exact moment before your choice, you could have chosen differently. You are saying that is not quite your point. You are not concerned with a counterfactual replay; you are concerned with the *present status* of the decision. You want it to be true *now*, while you are thinking, that the future does not yet exist as a fact. This is a demand for **Ontological Indeterminacy** rather than just counterfactual power.

  ### 2. The Name and the Shape of the Position

  The view you are articulating is best described as a demand for **Non-Causal Agent Causation** grounded in the **Phenomenology of Deliberation**.

  Let us unpack that.
  *   **Phenomenology of Deliberation:** This is the argument that the experience of weighing reasons is not merely evidence of freedom, but that the very activity of rational deliberation presupposes that the outcome is not fixed. To deliberate is to try to settle something. One cannot genuinely try to settle something that is already settled. Therefore, if deliberation is real, the outcome must be ontologically open.
  *   **Agent Causation:** This is the metaphysical mechanism required to make it work. In the ordinary physical world, events are caused by prior events (a billiard ball hits another, which moves). In your view, *you* (the agent) must be able to cause an event (the decision) without being fully determined by prior events (your psychology, history, reasons). You are not a link in a chain; you are a source.

  So, does this position have a name? In the literature, it is simply the **Libertarian conception of agency**, but your specific formulation—focusing on the "unsettledness" of the conclusion rather than the "ability to do otherwise"—aligns closely with what some philosophers call the **Settledness Objection to Determinism**.

  ### 3. The Coherence Test: Does it Collapse?

  Now we must do the hard work. You asked whether this collapses into incoherence, randomness, or a demand for alternative possibilities once stated carefully. This is the crux of the matter.

  There is a formidable argument, often called the **Intelligibility Objection**, which suggests that what you want is indeed incoherent. Here is the trilemma you face:

  **Horn 1: The decision is determined by your reasons.**
  If your decision is the rational outcome of weighing your values, character, and the facts of the job abroad, then it seems determined by "everything about you." If a sufficiently knowledgeable observer knew your mind perfectly, they could predict the outcome. This returns you to the "machine" scenario you found deflating. The matter was settled before you started.

  **Horn 2: The decision is not determined by your reasons.**
  If the decision is *not* fully determined by your reasons and character, then there is a gap between the input (reasons) and the output (choice). What bridges that gap?
  *   If it is *nothing*, the choice is random (the dice roll).
  *   If it is *you*, we must ask: what facts about "you" bridge the gap?
      *   If the facts are your character/values, we are back to Horn 1 (Determinism).
      *   If the facts are *not* your character/values, then the choice is arbitrary. Why did you choose the job? If the answer is not "because I value adventure more than security," but simply "because I chose," then the choice is unintelligible. It is an exercise of brute power, not rational agency.

  **Horn 3: The "Self" as a Distinct Ontological Category.**
  The only way to escape this trilemma is to posit that the "I" who decides is not merely the sum of "everything about me" (character, values, history). You must claim that the Self is a distinct entity that stands *behind* the psychological states.
  This is the **Agent Causation** defence. It argues that substances (people) can cause events, not just via their properties, but simply by being who they are. On this view, your reasons *incline* you without *necessitating* you. They set the stage, but you, the agent, perform the act. The "settledness" you desire is achieved because the agent is not a fact in the past; the agent is the active presence bringing the future into being.

  ### 4. Where the Edges Lie

  So, is your position coherent? It is coherent *if and only if* you are willing to accept a specific metaphysical cost.

  **The Metaphysical Cost**
  For your view to hold, the "You" that decides cannot be fully reducible to the physical state of your brain or the psychological sum of your history. If you are a materialist—if you believe you are entirely constituted by your neurons and their firing patterns, which obey physical laws—then your position collapses. In a purely physical system, if the prior state + laws are fixed, the future state is fixed. There is no room for "ontological openness" without introducing randomness.
  Therefore, to maintain your intuition, you must believe that agency is a fundamental feature of reality, not derivative of physics. You are effectively arguing for a form of **Substance Dualism** or **Non-Reductive Physicalism** where the agent has a causal power that is not exhausted by the causal powers of their parts.

  **The Edge with Randomness**
  You asked if it collapses into randomness. It does so if you cannot explain *why* the agent chooses as they do in a way that isn't just "because they did."
  *   *Your Defence:* You would argue it is not random because it is *reasoned*, even if not *determined*. The reasons explain the choice, but do not compel it.
  *   *The Critic's Reply:* If the reasons do not compel it, why did the reasons win out *this time*? If there is no fact of the matter that explains why the reasons won out other than "the agent made it so," the critic says this is indistinguishable from randomness from the outside.
  *   *Your Counter:* You would say the "fact of the matter" is the act of agency itself. The explanation is not a prior state, but the activity of the self.

  **The Edge with Alternative Possibilities**
  You said you don't care about "could have done otherwise." However, you may find you cannot keep them apart. If the matter is "genuinely not yet settled," does that not imply that at the moment of choice, both outcomes are possible? If only one outcome is possible given the totality of the situation (including the agent), then it *is* settled. To say it is "unsettled" just is to say that more than one future is compatible with the present. So, while your focus is on the *status* of the decision (unsettled vs. settled), this logically entails the *power* to realise different outcomes. You might not care about the rewind test, but the metaphysics you require to get the "unsettled" feeling likely grants you the "alternative possibilities" anyway.

  ### 5. Conclusion: What Should You Call It?

  You asked for a name. Since "Libertarianism" is too broad and "Agent Causation" is too technical, I suggest you think of your position as **The Requirement for Ontological Openness**.

  Is it a genuine position? Yes. It is the position held by those who believe that rational deliberation is incompatible with a closed future.
  Is it incoherent? Not obviously, but it is **metaphysically expensive**. It requires you to believe that you are not merely a complex machine processing inputs. It requires you to believe that the "I" is a fundamental cause in the universe, not just a location where causes meet.

  If you are a materialist—if you think your mind is what your brain does—then your intuition is likely incoherent. In a closed physical system, "unsettled" can only mean "unknown to me," not "unsettled in reality."
  But if you are willing to countenance that agency is a basic, irreducible feature of the world (much like mass or charge), then your position holds. It avoids randomness because the cause is the *agent*, not a chance event. It avoids determinism because the agent is not fully defined by prior states.

  **My Advice to the Group**
  When you return to your library group, you might frame it this way:
  *"The debate usually asks if we are responsible for our actions. I am asking if we are the authors of our conclusions. If my decision is the inevitable output of my prior psychology, then deliberation is a performance, not a process. I am looking for a view where the 'I' is not just the sum of its history, but the active settler of its future. I know this risks sounding like magic or randomness, but unless there is a gap between 'who I was' and 'what I choose', I cannot see how thinking is anything more than calculating."*

  You are describing the **Experienced Reality of Agency**. Whether that reality maps onto the fundamental structure of the universe is the question you have rightly identified. It is not a confusion; it is the hard centre of the problem. Most philosophers will tell you it is an illusion because it is too costly to believe otherwise. But as a GP, you know that how a patient feels is sometimes a fact more important than the scan. You are arguing that the feeling of openness is a datum that any theory of the mind must accommodate, not explain away. That is a robust, defensible, and named philosophical stance.
