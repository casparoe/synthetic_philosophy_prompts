answer: |-
  **Title:** The Coherence Mirage: Why Dutch Book Arguments Do Not Justify Expected Utility Maximization

  **Introduction**

  The standard pedagogical narrative in decision theory is seductive in its simplicity. It posits that rationality is fundamentally a matter of coherence. If your degrees of belief violate the probability calculus, you are susceptible to a Dutch Book—a set of bets guaranteeing a loss. If your preferences violate the von Neumann-Morgenstern (vNM) axioms, you are susceptible to a Money Pump—a cycle of trades leaving you worse off. Therefore, to avoid pragmatic self-sabotage, you must be coherent. And since coherence is mathematically isomorphic to Expected Utility Maximization (EUM), the pragmatic necessity of avoiding sure loss justifies the normative requirement to maximize expected utility.

  You are right to feel that there is a gap in this reasoning. Your intuition identifies a fracture line that runs through the foundations of Bayesian decision theory. While coherence arguments provide a robust pragmatic justification for *Probabilism* (the claim that beliefs should obey the probability axioms), they do not, on their own, justify the full structure of *Expected Utility Maximization*. Specifically, they fail to bridge the divide between avoiding sure loss in a betting market and maximizing a utility function over outcomes, unless one smuggles in a substantive, non-coherence-based assumption about the linearity of utility over the betting stake.

  This essay will argue that the standard pitch is indeed too strong. The gap you sense is real. Coherence arguments justify the probability component of EUM and the transitivity component of preferences, but they cannot justify the Independence Axiom or the maximization principle itself without assuming risk-neutrality over the numeraire. Consequently, the move from "avoid Dutch Books" to "maximize expected utility" is not a logical entailment of coherence, but a conflation of two distinct normative projects.

  **I. What Dutch Books Actually Buy: Probabilism, Not Utility**

  To understand the gap, we must first rigorously distinguish what the Dutch Book Theorem (DBT) actually proves. The DBT demonstrates that if an agent's betting quotients (credences) violate the axioms of probability, there exists a set of bets acceptable to the agent that guarantees a net loss in all possible states of the world.

  This is a powerful argument for *Probabilism*. It suggests that rational credences must satisfy the Kolmogorov axioms. However, notice the currency of the loss: it is measured in the betting stake (usually money). The theorem shows that incoherent credences lead to a loss of *currency*. It says nothing about the agent's utility function over that currency, nor does it address preferences over outcomes that are not monetary bets.

  To get from Probabilism to EUM, we need a utility function. In the vNM framework, utility is derived from preferences over lotteries. The Representation Theorem shows that if preferences satisfy Completeness, Transitivity, Independence, and Continuity, there exists a utility function $u$ and a probability function $P$ such that the agent acts *as if* they are maximizing $\sum P(s) \cdot u(o)$.

  The standard pitch conflates the DBT (which targets $P$) with the Representation Theorem (which targets $P$ and $u$). The DBT justifies the $P$ part. It does not justify the $u$ part. One could have perfectly coherent probabilistic beliefs (immune to Dutch Books) but intransitive preferences (susceptible to Money Pumps). Conversely, one could have transitive preferences but incoherent beliefs. The "coherence" of the belief system is logically distinct from the "coherence" of the preference system. To claim that "coherence arguments justify EUM" is to claim that a single pragmatic argument covers both domains simultaneously. As we shall see, attempts to unify them rely on questionable assumptions.

  **II. The Ramsey-de Finetti Bridge and the Linearity Assumption**

  Proponents of the standard pitch often point to the work of Frank Ramsey and Bruno de Finetti as the bridge. Ramsey's famous approach derives both probability and utility from betting behavior. He suggests we can measure an agent's belief in proposition $E$ by the odds they offer on a bet, *provided* we know their utility for the stakes. Conversely, if we know their beliefs, we can measure their utility.

  De Finetti's notion of *coherent previsions* attempts to go further. He argues that an agent's prices for uncertain rewards should be coherent such that no Dutch Book can be made against them. If an agent sets coherent previsions for all gambles, they are acting consistently.

  However, this bridge collapses under the weight of the **Linearity Assumption**. For a Dutch Book argument to work as a normative constraint on belief, the utility of the betting stake must be linear. If I am risk-averse over money, a guarantee of losing \$10 is not necessarily worse in utility terms than a risk of losing \$100 with probability 0.1, even if the expected monetary value is the same.

  If utility is non-linear in money, a "sure loss" in dollars is not a "sure loss" in utils. An agent with risk-averse utility could reject a Dutch Book of bets that guarantees a monetary loss because the disutility of the certain small loss outweighs the expected disutility of the uncertain larger losses they are avoiding. In such a case, the agent is not "incoherent" in a utility sense; they are simply risk-averse.

  To save the Dutch Book argument for Probabilism, we must stipulate that the agent is risk-neutral over the betting stakes. But risk-neutrality over money is a substantive claim about the agent's preferences, not a requirement of logical coherence. It is a specific shape of a utility function ($u(x) = x$). By assuming this to make the DBT work, we have already presupposed a specific utility structure to prove the necessity of coherence.

  Therefore, the Ramsey-de Finetti approach does not derive EUM from pure coherence. It derives EUM from coherence *plus* the assumption that the medium of exchange has linear utility. This leaves the gap intact: coherence arguments cannot justify the utility component of EUM without begging the question by assuming a specific utility function for the stakes.

  **III. Money Pumps and the Independence Axiom**

  Perhaps the gap can be bridged from the other side. If DBTs justify Probabilism, perhaps "Money Pump" arguments justify the preference axioms required for EUM. A Money Pump argument shows that if preferences are cyclic (violating Transitivity), an agent can be induced to trade $A$ for $B$, $B$ for $C$, and $C$ for $A$, paying a fee each time, ending up with $A$ but less money.

  This successfully justifies Transitivity on pragmatic grounds. However, EUM requires more than Transitivity. It requires the **Independence Axiom** (or Sure Thing Principle). The Independence Axiom is the engine that generates the linear combination of probabilities and utilities ($\sum P \cdot u$). It is what allows us to maximize *expectations* rather than, say, maximizing the minimum outcome (Maximin) or using weighted probability functions (as in Rank-Dependent Utility).

  There is no compelling pragmatic "Money Pump" argument for the Independence Axiom comparable to the one for Transitivity. Violations of Independence (such as those seen in the Allais Paradox) do not necessarily lead to a sure loss of money in a single synchronous choice, nor do they obviously lead to a dynamic money pump without assuming additional constraints on how choices are framed over time (as discussed by McClennen and Rabinowicz).

  Many rational agents intuitively violate Independence due to complementarity effects or disappointment aversion. If coherence is defined as "immunity to sure loss," an Allais-type agent can often structure their choices to avoid sure loss while still violating Independence. Thus, pragmatic coherence arguments fail to rule out non-EUM decision theories that satisfy Transitivity but violate Independence. Since EUM is defined by the specific mathematical structure imposed by Independence, the failure of coherence arguments to justify Independence means they fail to justify EUM.

  **IV. The Conflation of Representation and Justification**

  The persistence of the standard pitch likely stems from a conflation of *Representation Theorems* with *Normative Justifications*.

  1.  **Representation Theorems (vNM, Savage):** These show that *if* an agent's preferences satisfy certain axioms, *then* they can be represented as maximizing expected utility. These are structural claims. They do not tell us *why* we should satisfy the axioms.
  2.  **Dutch Book Arguments:** These provide a *why*. They say you should satisfy the axioms to avoid sure loss.

  The standard pitch assumes the "why" of the DBT transfers to the "what" of the Representation Theorem. It assumes that because DBT justifies the probability axioms, and Representation Theorems link probability axioms to EUM, DBT justifies EUM.

  This is a non sequitur. The DBT justifies the probability axioms *for beliefs*. The Representation Theorem uses those axioms to model *preferences*. But the preferences themselves require their own justification (the vNM axioms). As established above, pragmatic arguments for the vNM axioms are weak (specifically regarding Independence) and rely on the linearity of the numeraire.

  Furthermore, there is a category error in moving from "avoid sure loss" to "maximize expectation." Coherence is a negative constraint: *do not lose for sure.* EUM is a positive prescription: *maximize the weighted sum.* One can avoid Dutch Books without being a maximizer. For example, a satisficer who accepts any bet with positive expected value but does not seek to maximize the sum total of utility is immune to Dutch Books (provided their beliefs are probabilistic). The move from "don't be incoherent" to "be an optimizer" requires an additional premise that rationality requires optimization, not just consistency. Coherence arguments alone do not supply this premise.

  **Conclusion**

  Your skepticism is well-founded. The standard pitch that "coherence arguments justify expected utility maximization" is a philosophical oversimplification that obscures more than it reveals.

  The gap you sensed is real. Coherence arguments, properly understood, justify **Probabilism** (for beliefs) and **Transitivity** (for preferences). They do not justify the **Independence Axiom**, nor do they justify the **Maximization** principle itself. To bridge this gap, one must assume that the agent is risk-neutral over the betting stakes (linear utility of money). But this assumption is a substantive psychological claim, not a requirement of logical or pragmatic coherence.

  Therefore, the standard pitch is false. Coherence arguments justify a constraint on rationality (consistency), but they do not uniquely identify Expected Utility Maximization as the *only* coherent way to act. One can be coherent (probabilistic beliefs, transitive preferences) and yet be a risk-weighted expected utility maximizer, a maximin decision maker, or a satisficer, provided one's utility function over the betting stakes is appropriately non-linear or one's decision rule does not violate the specific coherence constraints.

  To defend EUM, one needs more than Dutch Books. One needs a substantive argument for why the Independence Axiom is normatively binding and why rationality demands maximization rather than mere consistency. Until those arguments are supplied, the move from "don't get Dutch Booked" to "maximize expected utility" remains an unjustified leap. Your advisor may be teaching the "standard model," but your intuition has correctly identified its foundational crack. Do not let it be glossed over.
