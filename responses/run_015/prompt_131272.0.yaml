  **APPENDIX 4.B: PERSONNEL PROCEDURES AND CAUSAL ATTRIBUTION**

  **4.B.1 Scope and Definitions**
  Pursuant to the University's adoption of the Single-Vector Causal Model, all personnel actions within the Department of Philosophy shall adhere to the following protocols regarding causal attribution. The Committee distinguishes between the Sufficient Physical History (SPH) of an event and the Mental Overstory (MO) associated with said event. The SPH constitutes the exhaustive chain of physical occurrences leading to a determinate outcome. The MO constitutes the descriptive layer involving beliefs, desires, intentions, or rationalizations supervenient upon the SPH. While the MO may be recorded for archival continuity, it shall not be construed as a causal factor in merit allocation, hiring, or disciplinary proceedings.

  **4.B.2 Merit Review and Salary Adjustment**
  In annual merit reviews, credit for scholarly output shall be assigned strictly to the SPH. Candidates submitting Form 88-P (Physical History Declaration) must identify the specific neurophysiological and environmental sequences that produced the manuscript. References to "intellectual effort," "creative insight," or "argumentative rigor" shall be categorized as MO and treated as decorative metadata. If a candidate claims credit for both the neural firing sequence and the associated thought content, the Committee shall apply the Double-Counting Penalty. Points awarded for the SPH shall be deducted in equal measure from the MO column to prevent systematic overdetermination of the merit score. A publication counts as one effect; it cannot admit two sufficient causes without violating budgetary conservation laws.

  **4.B.3 Letters of Recommendation**
  The Committee acknowledges that letters of recommendation traditionally cite the writer's beliefs regarding a candidate's potential. However, as beliefs belong to the MO and possess no independent causal traction upon the hiring committee's decision matrix, such letters constitute hearsay regarding causal efficacy. To remedy this, all letter writers must append Certification 12-C. By signing 12-C, the writer attests that their recommendation was caused solely by physical stimuli (e.g., visual inspection of the candidate's dossier) and that the expressed "confidence" is a non-causal byproduct of those stimuli. Failure to attach 12-C renders the letter inadmissible as evidence of future performance, as it implies a causal power resident in the writer's mental state rather than their physical history.

  **4.B.4 Academic Integrity and Intent**
  In cases of alleged academic dishonesty, the determination of intent is required per University Policy. Recognizing that intentions are MO constructs leaving no distinct causal trace on the available evidence (e.g., the submitted text), the accused shall establish intent via Section 9 of the Incident Report. This section contains a single checkbox labeled "I intended this outcome." No narrative field is provided, as narratives invite redundant causal explanations. Checking the box certifies that a corresponding physical state existed in the agent's central nervous system at time *t*. Unchecked boxes default to accidental physical movement, reducing the violation from Plagiarism to Kinetic Error.

  **4.B.5 Committee Deliberation and Verdict**
  The Committee shall convene on the 14th to deliberate on personnel matters. Members are reminded that the deliberation process is itself a physical event sequence (sound waves, neural adjustments) that causally determines the vote. The *reasons* offered during deliberation, however, belong to the MO. Therefore, minutes shall record the physical occurrence of the meeting (start time, end time, decibel levels) but shall not record the rationalizations offered for votes. To do so would imply that abstract reasons caused the vote, rather than the physical act of speaking. Notwithstanding this, the Committee notes that votes should align with the strongest reasons presented, pursuant to the understanding that "strongest reasons" is shorthand for "physical speech acts most likely to trigger affirmative neural firings in the committee majority."

  **4.B.6 Minority Provision on Systematic Overdetermination**
  A minority of the faculty (see Dissent Log 4.B.6) maintains that mental and physical causes can coexist without competition. Under this provision, candidates may request that merit be calculated for both the SPH and the MO independently. If granted, the Department shall allocate full merit points for the physical production of the work and full merit points for the mental conception of the work. The Committee notes that if this provision is exercised by more than three faculty members simultaneously, the Department's merit pool will be exceeded by 100%. In such an event, the Dean shall authorize payment for the SPH portion only, noting that the MO portion, while causally real per the Minority view, is ineligible for monetary realization due to fiscal closure. The Minority further objects that this renders their causality inert regarding salaries, but the Committee holds that fiscal closure is a higher-order constraint than causal plurality.
