  You are a philosopher of science and formal epistemologist working in the Solomonoff–Kolmogorov–Chaitin tradition: equally at home with universal semimeasures and monotone complexity as with the vaguer talk about "simplicity," "parsimony," and "the best explanation" that working scientists actually use. Treat what follows as a design commission. Think carefully before you commit: sketch two or three candidate constructions, run the length arithmetic on each, discard the ones whose margins collapse or whose verdicts have to be stipulated rather than derived, and then present only the survivor in finished form. Everything must be self-contained — define each technical notion in your own words, state any general result you lean on (Kraft's inequality, the coding theorem, Solomonoff's convergence/error bound) rather than attributing it, and assume no access to any library or web resource.

  **What the case is for.** I am writing a section on whether Solomonoff induction vindicates Occam's razor, and I want one worked case that separates two things routinely run together: the razor as *parsimony of hypotheses* (prefer the law positing the fewest independent parameters, entities, or assumptions) and the razor as *brevity of description* (prefer the shortest code, which is what Solomonoff's 2^{-ℓ} prior implements). The case must show these diverging at a data size a person could actually have, in a direction that is not merely "the naive razor is less confident."

  **The setup.** A binary prediction problem. A single source, given as a short, actually-runnable program, generates an infinite binary sequence; you choose the observed prefix length n (I suggest 96 ≤ n ≤ 256) and the horizon (10 further bits). All three predictors below see the same prefix and are told only that the source is computable.

  1. **Predictor S — Solomonoff induction.** The universal mixture over lower-semicomputable semimeasures with prior weight 2^{-ℓ(p)} on a reference machine you specify well enough that instruction counts could in principle be checked; state your conditionalization convention (M(Db)/M(D) or the odds M(D0):M(D1)) and why the verdict does not hinge on it.
  2. **Predictor P — the parsimony razor.** A scientist who will only accept a *deterministic* law, chosen from an explicit shortlist of candidate laws you write out, ranked first by fewest free parameters/independent assumptions and only then by fit (number of matching bits); P predicts that law's next bit with probability 1.
  3. **Predictor T — the working statistician.** Fits within the parametric class {period-p skeleton corrupted by i.i.d. Bernoulli noise of rate r} using a stated penalized-likelihood rule, and predicts with the fitted probability.

  **The verdicts I want, at the step immediately after the prefix.**

  - **S** puts at least 0.99 on the bit that actually occurs.
  - **P** is certain of the bit that does *not* occur.
  - **T** favors the bit that does not occur, but is calibrated: it assigns the occurring bit a probability of at least 0.15, so that under log-loss its loss is finite while P's is infinite.

  So the direction disagreement is between S and the other two, and the confidence disagreement is between P and T. Report both 0–1 loss and log-loss for each predictor across the 10-bit horizon.

  **Design constraints.**

  - The source must be a *single* rule with no special-casing of the first n positions: I suggest a periodic skeleton (say, 1 iff n ≡ 0 mod p) XORed with a cheap deterministic "noise" process whose density is between 0.2 and 0.35, so that the skeleton is statistically visible in the data but the source is not periodic. The noise must be generated by a short rule — not a hardcoded table — and the rule should be one you can evaluate by hand for the first n+10 positions (a rule on the binary representation of n works well).
  - P's shortlist must *contain* the composite hypothesis "skeleton XOR [your noise rule]" so that the shortlist is not rigged by omission; P must still pick the pure skeleton, and the reason must be the parsimony ranking, not your say-so.
  - The step at which the predictions are compared must be one where the noise genuinely flips the skeleton; show that arithmetic explicitly (the binary expansion of n+1, the noise value, the skeleton value, the output).
  - Do not stipulate any complexity value. Every length comparison must follow from programs or schemas you exhibit, plus counting arguments where you need them (e.g. "a uniformly chosen k-bit parameter is incompressible to within a few bits with probability at least 1/2").
  - Exhibit the prefix in full if you can do so reliably; if you cannot, give the program, a table of the last sixteen positions, and the values for positions n+1 through n+10 computed explicitly. An honest small-n case beats a botched large-n one.

  **What I want you to show after the scenario.**

  - The competing hypotheses as actual code/schemas on your stated machine, with bit or instruction counts, and the *margin in bits* for each comparison. In particular: identify which wrong-predicting hypothesis is the *binding* competitor for S. (There is a trap here. One candidate competitor is "encode the deviations from the skeleton explicitly and then revert to the pure skeleton," which costs on the order of n·H(rate) bits and is comfortably beaten. But there is also the cheaper "grue" program: run the true source and then deviate at step n+1, which costs only about K(n+1) extra bits, i.e. roughly log₂ n + 2log₂log₂ n. Decide which one binds, and do not overclaim the resulting confidence — if the binding margin is only about log n bits, say so plainly, and say whether that margin survives a change of reference machine given that the invariance theorem's constant is finite but can be large.)
  - The crossover computation: the prefix length at which S's dominant hypothesis switches from the hedged "skeleton plus i.i.d. noise" hypothesis to the deterministic composite, i.e. roughly where describing the noise generator becomes cheaper than encoding the residuals. Give the crossover n\*, and say how far above it your chosen n sits.
  - Which single feature of the case is doing the work.
  - Ablations, each with the recomputed verdicts: (a) replace the deterministic noise with genuinely i.i.d. Bernoulli noise of the same rate — I expect S to collapse onto T's hedged verdict and the direction disagreement to vanish; confirm or correct this; (b) set the noise rate to zero; (c) let P rank by fit instead of parsimony; (d) change P's criterion from "fewest parameters" to "shortest description," and say honestly whether P then just *is* S up to the machine constant.
  - The strongest attack available to a defender of the parsimony razor, delivered in its best form (the obvious one: you have crippled P's hypothesis space, since a real scientist would fit a noise model and be calibrated, and your noise rule is a plant — cheap for a program to express, invisible to any shortlist of ordinary laws). Answer it.
  - A check that the case does not contradict Solomonoff's convergence or error bound: say in your own words what that bound guarantees, and why S being certain and correct here is consistent with it rather than a counterexample.

  Write it as a finished section: the scenario, then the demonstration, then the diagnosis, then the objections. Be explicit wherever a number is doing real work, and flag every place where your conclusion depends on a convention or on a constant you cannot pin down.
