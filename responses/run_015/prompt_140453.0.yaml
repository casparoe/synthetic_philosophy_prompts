answer: |-
  **Q&A PREPARATION SHEET: RATIO-LIMITED TOTALISM**

  **To:** Presenter
  **From:** Colleague
  **Re:** Seminar Defence Strategy
  **Date:** 14 October 2023

  Below is the triage for your twenty-five minutes. I have ordered these by the product of *likelihood* and *potential damage*. The economists and the hardline totalist are your primary threats; the prioritarians are a secondary nuisance.

  ### 1. The Zero-Point Sensitivity Objection
  **Who:** The Social Choice Economist or a technically minded Philosopher.
  **Likelihood:** High. **Damage:** Fatal.
  **The Objection:** "You claim ratios require a fixed zero, and that fixing it is a moral posit. But utility ratios are not invariant to affine transformations. If I shift the zero point, the ratio of my welfare to the mean changes drastically. If the cap is a multiple of the mean, the point at which welfare stops counting shifts arbitrarily depending on where you place the neutral point. You say nothing depends on knowing where it is, but mathematically, *everything* depends on it. Isn't the cap just an artefact of your scale choice?"

  **The Reply (2 mins):**
  "You are quite right that the *numerical value* of the ratio depends on the zero point. However, the moral claim is not about the specific number $K$, but about the *structural necessity* of a bound. Think of the zero point not as a measurement discovery but as a definition of the moral currency. We are stipulating that 'welfare' for the purpose of aggregation is measured on a ratio scale where the zero represents a life not worth living (or a neutral life). Once we accept that interpersonal comparisons require a common scale, we must accept that the scale has a structure.
  My claim is that *whatever* plausible zero point we fix (provided it is below the range of normal lives), unbounded ratios generate the monster. The specific $K$ might adjust to the zero, but the existence of a $K$ is required to block the diffuse monster. The argument doesn't depend on knowing *where* the zero is, only that *there is* a zero relative to which ratios become morally hazardous when unbounded. We are fixing the scale to make the moral maths possible, not claiming to have measured the soul."

  **Weakness:** This is the weakest link in your armour. Mathematically, shifting the zero changes the curvature of the utility function relative to the mean. If the zero is set very low, almost no one hits the cap. If set high, everyone does. You are relying on the audience accepting the 'moral posit' without demanding the functional invariance.
  **Status:** **Genuine Force.** You must not bluff here.

  ### 2. The Pareto Violation Objection
  **Who:** The Social Choice Economist.
  **Likelihood:** Certain. **Damage:** High (Technical).
  **The Objection:** "Your social ordering violates the Weak Pareto Principle. If an agent is above the cap, increasing their welfare increases their utility but leaves the social sum unchanged. In standard social choice, if everyone prefers state A to state B, the social ordering must reflect that. You are saying the monster's gain doesn't count towards the social good. Are you abandoning welfarism entirely?"

  **The Reply (2 mins):**
  "I am distinguishing between *prudential value* (what is good for the individual) and *moral value* (what counts towards the social sum). I remain a welfarist in the sense that only welfare has moral value, but I deny that *all* welfare has marginal moral value.
  Consider a saturated voter. In a capped voting scheme, giving a billionaire another million pounds doesn't increase their voting power. We don't say the money isn't real; we say it doesn't count for *political* equality. Similarly, above the cap, the welfare is real for the recipient, but it lacks marginal moral weight because allowing it to count would license the tyranny of the efficient over the needy. I am proposing a non-welfarist *aggregation rule* applied to welfarist *inputs*. The Pareto principle applies to social states; I am arguing that above the cap, the 'social state' regarding value does not improve, even if the individual's state does."

  **Weakness:** Hardline welfarists will reject the distinction between prudential and moral value as ad hoc. You are essentially redefining 'social welfare' to mean 'trimmed welfare'.
  **Status:** **Dialectically Likely.** Concede the violation of standard Pareto, insist it is a feature, not a bug.

  ### 3. The "Clunky Prioritarianism" Charge
  **Who:** The Prioritarians/Sufficientarians.
  **Likelihood:** High. **Damage:** Medium (Theoretical Redundancy).
  **The Objection:** "This looks like sufficientarianism with a threshold set at $K \times \text{mean}$. Or it's prioritarianism with a weight function that is 1 up to a point and 0 thereafter. Why introduce this complex ratio mechanism when a standard concave transformation of welfare solves the monster problem without needing to fix zero points or calculate means?"

  **The Reply (2 mins):**
  "Two differences. First, prioritarianism weights *every* benefit according to absolute level. On my view, a benefit to a poor person and a benefit to a middle-class person count equally, provided both are below the cap. I preserve the totalist intuition of equality below the threshold.
  Second, and crucially, standard prioritarianism does not strictly bound the ratios. If the weighting function is concave but unbounded (like the square root), a sufficiently large utility gain for one person can still outweigh massive losses for many, provided the function doesn't flatten enough. My view imposes a *hard* limit on interpersonal ratios. The diffuse monster shows that small efficiency advantages multiplied across a group can still drain resources under standard prioritarianism if the weighting isn't severe enough. My cap guarantees that no group can claim more than their share relative to the mean, regardless of their conversion efficiency."

  **Weakness:** If they press that a sufficiently steep prioritarian function mimics a cap, you have to concede the extensional equivalence but insist on the *intensional* difference (rights to efficiency vs. rights to share).
  **Status:** **Genuine Force.** You need to show the Diffuse Monster survives standard prioritarianism.

  ### 4. The Interpersonal Comparison Sceptic
  **Who:** The Optimal Taxation Economist.
  **Likelihood:** High. **Damage:** Low (Practical vs. Theoretical).
  **The Objection:** "This is theoretically cute but implementationally impossible. We cannot observe utility functions, let alone their ratios. We can't identify the 'efficient converters' until after the transfer. If you can't measure the ratio, you can't apply the cap. This is a solution to a measurement problem, not a moral one."

  **The Reply (2 mins):**
  "I am offering a normative theory, not a policy manual. Optimal tax theory often assumes knowledge of elasticity distributions it cannot observe; that doesn't invalidate the theoretical benchmark.
  Furthermore, the 'latent monster' case I discuss shows that the problem isn't just identification. Even if we don't know *who* the efficient converters are, if we know *that* such a group exists and that resources are flowing disproportionately to them, totalism demands we continue until diminishing returns hit. My view says we should have institutional constraints that prevent such concentration regardless of identification. The impossibility of precise measurement argues for *caution* (capping), not for *abandonment* of the constraint."

  **Weakness:** Economists hate unimplementable models. Keep this brief.
  **Status:** **Deflect.** Acknowledge, move on.

  ### 5. The Hardline Totalist
  **Who:** The Bullet-Biting Philosopher.
  **Likelihood:** Medium. **Damage:** Medium (Ideological).
  **The Objection:** "The Utility Monster isn't a bug; it's a feature. If one person can get 1,000 units of joy from a resource and another gets 1, why on earth should we give it to the latter? You're letting an intuition about 'fairness' override the good. The diffuse monster is just a group of people who get more good. Why punish efficiency?"

  **The Reply (2 mins):**
  "Because welfare is not the only moral currency; *status* and *relations* matter. If we allow ratios to become unbounded, we create a caste system of moral worth. The efficient converters become moral VIPs whose minor gains outweigh others' major losses.
  My point is that totalism *itself* relies on interpersonal comparison. Once you admit we can compare welfare across persons, you must admit we can compare the *scale* of that welfare. If the scale becomes unbounded, the comparison breaks down into absurdity. I am saving aggregation from itself. You say 'punish efficiency'; I say 'limit the moral tyranny of efficiency'. A society where 10,000 people starve so 10,000 others can have slightly nicer holidays is not a maximisation of the good; it's a category error."

  **Weakness:** They will not be moved by "status". They care about the Sum.
  **Status:** **Dialectically Likely.** Do not expect to convert them.

  ---

  ### Strategic Concessions (Give these in the first 2 minutes if pressed)
  1.  **Continuity:** Concede immediately that the social ordering is **not continuous**. There is a discontinuity at the cap. Do not try to defend continuity; it's false by definition.
  2.  **Measurement:** Concede that exact implementation requires rough proxies. Do not claim we can calculate $K$ to two decimal places.
  3.  **The Zero Point:** Concede that the *value* of $K$ is relative to the zero-point fixation. Do not claim the ratio is invariant. Claim only that the *need* for a bound is invariant.

  ### The Single Reply That Has to Land
  **The Distinction between Aggregation and Ratios.**
  If you fail to convince them that the Monster is a problem of *unbounded ratios* rather than *summing*, you lose. If they think summing is the problem, they will move to Prioritarianism or Egalitarianism, and your theory becomes redundant.
  **Key Phrase:** "The monster does not arise because we add welfare; it arises because we allow the *weight* of one person's welfare to become infinite relative to another's. Totalism is fine; unbounded scales are not."

  ### Load-Bearing Steps You May Have Missed
  1.  **The Mean Dependency:** Your cap is $K \times \text{Mean of Others}$. This creates a feedback loop. If I gain welfare, the mean rises, potentially raising the cap for others, or lowering it if I am included in the mean. You need to be precise on whether the mean includes the agent. (You say "everyone else", which helps, but it makes the function highly sensitive to population size).
  2.  **Population Size:** In a small population, one efficient person skews the mean drastically. In a large population, they don't. Does your theory imply the monster is less problematic in larger populations? The Diffuse Monster (10k people) is designed to fix this, but ensure you have the maths ready for small groups.

  ---

  ### Regarding Your Private Worry: The Negative Cap
  **Is this the question to hope nobody asks?**
  **No.** This is worse than you think. It is the "Suffering Monster" objection.
  If you cap the positive (no one counts for more than $K \times \text{mean}$), symmetry suggests you must floor the negative (no one counts for less than $\frac{1}{K} \times \text{mean}$).
  **The Problem:** If you floor the negative, you are saying that a person in extreme agony (say, $-1,000,000$ units) counts for *less* than a person in moderate agony ($-100$ units) once the floor is hit. This implies the marginal moral disvalue of suffering diminishes to zero. This is morally repugnant.
  **However:** If you *don't* floor the negative, you invite the Negative Monster: one person in extreme agony could demand all resources be diverted to them, as their negative welfare dominates the sum.

  **The Defence:**
  You must argue that the **asymmetry** is justified.
  "We cap the positive to prevent tyranny of the efficient. We do *not* floor the negative because the moral urgency of relieving suffering does not diminish. The 'trimming' applies to *claims on surplus*, not *claims on relief*."
  **Risk:** This breaks the symmetry of your ratio argument. If ratios are the problem, negative ratios are also a problem.
  **Better Reply:** "The floor is not a cap on suffering's importance, but a cap on *sacrifice demanded of others*. No one should be required to sacrifice their basic welfare to relieve another's extreme agony beyond a certain ratio. The suffering still matters, but the *claim on others* is limited to prevent the negative monster from enslaving the population."
  **Verdict:** This is the most dangerous line of questioning. If you say suffering counts less, you lose the room. If you say it counts the same but claims are limited, you sound like you're abandoning the aggregation principle. **Prepare to concede that the negative side requires a different treatment, perhaps a lexical priority for basic relief before the ratio constraint kicks in.** Do not try to force the negative cap to work exactly like the positive cap.

  **Final Advice:**
  Your strongest asset is the **Diffuse Monster**. It makes the problem mundane rather than exotic. Keep returning to that. If they get bogged down in the maths of the zero point, pivot back to: "Even if the zero is fuzzy, the 1.2x efficiency group draining the dry resources is a clear moral failure under totalism. My view stops that. Does yours?"

  Good luck. Keep your answers crisp.
