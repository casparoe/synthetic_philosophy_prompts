      *   *Refining the Pareto Reply:* The economist will pounce on Pareto. If Person A is above the cap, giving them more utility doesn't change the Social Welfare Function (SWF). This is a violation of Weak Pareto. *Strategy:* Deny that Pareto is binding when "welfare" is misidentified. Or argue that "welfare" in the SWF is "counted welfare," not "experienced welfare." Better: Argue that the *moral* value of the benefit is zero, even if the *prudential* value is positive. This distinguishes the two concepts.
