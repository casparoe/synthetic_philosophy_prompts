      *   *Speed/Scale:* Neural firing is ms; Ant foraging is days.
          *   *Relevance:* Low (decoration). Substrate independence argues speed doesn't matter for *existence* of mind, only for *interaction*.

  5.  **Running the Case Studies (Task 3):**

      *   *Case A: Fusion.* If you physically merge two ant hills and they coordinate:
          *   Functionalist view: If the network integrates, it's one mind.
          *   Problem: Ants from Colony A might ignore Colony B's trails initially. If they integrate, did two minds merge into one? (Like split-brain patients reversed?). If they don't integrate, is it two minds in one space?
          *   The "Vocabulary" Issue: Functionalism struggles with *boundaries*. Where does one mind end and another begin if the substrate is fluid?
