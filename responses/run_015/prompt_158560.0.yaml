      *   *Concept:* A colony of ants simulates a neural network. The "symbols" in the brain are constituted by active sub-colonies of ants.
      *   *Hofstadter's Stance:* He is a functionalist. He generally argues that if the pattern is right, the mind is real. *However*, the user's group is taking a harder line: "No extra hard question left." Hofstadter is often more playful/ambiguous about *qualia* than hard-line eliminativists, but for the sake of the user's group's argument, I must treat it as a strong Functionalist claim (Mind = Functional Organization).
      *   *The User's Group's Claim:* Functionalism solves the Hard Problem. (This is a contentious philosophical stance, often associated with Dennett or early Putnam, but rejected by Chalmers, Nagel, etc.).

