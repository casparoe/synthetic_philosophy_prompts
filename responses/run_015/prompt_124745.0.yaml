    "replacement_scenario": "Adopt 'Grounded Intentionality' standards requiring that all intentional attributions (e.g., 'goals') be explicitly linked to supporting mechanistic evidence (e.g., 'circuits'), treating the bridge as the primary object of safety analysis."
