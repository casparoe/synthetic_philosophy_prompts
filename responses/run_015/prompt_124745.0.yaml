    "core_presupposition": "Explanatory Incommensurability: The assumption that mechanistic and intentional vocabularies belong to disjoint ontological domains that cannot validly intersect in causal explanation.",
    "excluded_alternatives": [
      "Non-reductive Physicalism",
      "Pragmatic Instrumentalism",
