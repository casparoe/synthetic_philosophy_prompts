      *   *Chang's View:* "Parity" (on-a-par). She argues that incommensurability (as failure of comparison) is rare. Usually, we face "hard choices" where items are comparable but not via "better/worse/equal." They are "on a par." Crucially, she introduces the *will*: we create reasons through commitment. This is more normative/practical.
      *   *User's Take:* Chang = Practical/Decision-theoretic/Agent-relative. Raz = Metaphysical/Axiological/Objective.
      *   *Assessment:* This is a strong, standard, and defensible reading. Many meta-ethicists see Chang as trying to save rational choice theory from Raz's skepticism. Raz says "Reasons run out." Chang says "No, reasons are made."
