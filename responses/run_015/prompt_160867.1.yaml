answer: |-
  This is a sophisticated diagnosis of a well-worn debate. You are right to feel stuck: the literature *is* circular, but not because the authors are unintelligent. It is circular because the debate has reached a point of **methodological incommensurability masked as empirical disagreement.**

  Here is the diagnosis, broken down by the type of disagreement, the function of the confusion you identified, and what progress actually looks like in this context.

  ### 1. What Kind of Disagreement Is This?

  It is not merely verbal, nor is it purely foundational. It is a **strategic displacement of a foundational conflict onto empirical terrain.**

  You have correctly identified that "open borders" is under-specified (entry vs. membership) and that the "welfare state" objection bundles three distinct claims (fiscal, political, constitutive). However, your hunch explains the *noise*, not the *signal*. Even if every participant agreed to your distinctions, the stalemate would largely remain. Here is why:

  **The Foundational Layer:**
  At the bedrock, this is a disagreement about the **unit of moral concern**.
  *   **The Open Borders Side:** Operates with a methodological individualism that is globally scoped. The default position is that restrictions on movement require justification to the individual restricted. The state is an instrument, not an agent with its own rights.
  *   **The Closure Side:** Operates with a methodological collectivism (or statism). The political community is an agent capable of holding rights (specifically, self-determination). The individual's claim to enter is weighed against the community's claim to persist.

  These are not premises that can be argued for within the debate; they are the lenses through which the debate is viewed. You cannot derive the statist premise from the cosmopolitan one, or vice versa, without begging the question.

  **The Displacement:**
  Because arguing about "the moral status of the nation-state" is abstract and often inconclusive, both sides displace the fight onto empirical claims where they feel they can win.
  *   **Cosmopolitans** argue: "Empirically, open borders won't hurt the welfare state (fiscal/political)." This is an attempt to neutralize the statist's *causal* fears so the *constitutive* fear is exposed as prejudice.
  *   **Statists** argue: "Empirically, mass migration lowers trust and reduces redistribution (political)." This is an attempt to show that the cosmopolitan's *individualist* logic destroys the *collective* conditions required for justice.

  **The Verbal Layer:**
  Your point about "open entry" vs. "open membership" is the mechanism that allows this displacement to continue.
  *   When the cosmopolitan says "open borders," they often mean "asylum + labor mobility + eventual naturalization."
  *   When the statist hears "open borders," they hear "immediate access to the fiscal commons."
  *   Because neither side defines the *institutional design* of the border regime they are defending, they can talk past each other indefinitely. The cosmopolitan cites evidence that migrants are net fiscal contributors (true for labor entrants); the statist cites evidence that migration strains local services (true for immediate welfare access). Both are "right" about different objects.

  ### 2. Why Your Hunch Is Right (and Where It Stops)

  You are highly confident that the "welfare state" argument is a black box containing fiscal, political, and constitutive worries. **You should be very confident in this.**

  *   **Fiscal:** This is an empirical claim. It is resolvable (mostly). It rarely decides the debate because neither side actually cares about the budget balance as a moral absolute; they care about it as a proxy for sustainability.
  *   **Political:** This is a sociological claim (trust/solidarity). It is the strongest empirical shield for the statist. If diversity mechanically reduces solidarity, the cosmopolitan must either deny the sociology or argue that global solidarity can replace national solidarity.
  *   **Constitutive:** This is the hard core. This is the claim that a welfare state *without borders* is conceptually incoherent, not just practically difficult.

  **Where your hunch stops:** Unbundling these three does not solve the problem because the **Constitutive Worry** is immune to empirical refutation. If a statist says, "A welfare state requires a 'we'," no amount of data showing that Sweden remained rich after migration will convince them. They will reply, "It remained rich, but it is no longer the same community obligated to itself."

  The stalemate persists because the cosmopolitan side treats the constitutive worry as a superstition to be debunked by data, while the statist side treats it as a precondition for data to matter.

  ### 3. What Counts as Progress?

  If the disagreement is foundational but disguised as empirical, you cannot expect "resolution" in the sense of one side conceding. Progress in a PhD literature review here means **mapping the impasse with greater precision** so that future work doesn't repeat the same category errors.

  Here are three specific moves that constitute progress:

  **A. Institutional Specification (Solving the Verbal)**
  Stop evaluating "open borders." Evaluate specific *regimes*.
  *   *Progress:* Distinguish between **Open Entry** (right to cross), **Open Residence** (right to stay), and **Open Access** (right to benefits).
  *   *Why:* A theorist might support Open Entry and Residence but support a 5-year waiting period for full welfare access. This splits the difference between the "feudal privilege" critique and the "community self-determination" defense. If the literature review categorizes arguments by which *bundle of rights* they defend, the circularity decreases.

  **B. Acknowledging the Tragic Choice (Solving the Foundational)**
  Progress involves admitting that this might be a conflict between two genuine goods, not Right vs. Wrong.
  *   *Progress:* Frame the debate not as "Justice vs. Prejudice" but as "Global Efficiency/Individual Liberty vs. Democratic Self-Determination/Social Solidarity."
  *   *Why:* This stops the moralizing. It allows you to analyze who is willing to sacrifice which good. The cosmopolitan sacrifices local self-determination for global liberty. The statist sacrifices global liberty for local self-determination. A literature review that maps these *trade-offs* rather than *victories* is more honest.

  **C. Shifting from Justification to Design (Solving the Empirical)**
  Most of the literature asks: "Are borders justified?" This is the question causing the circles.
  *   *Progress:* Ask: "Under what institutional conditions can borders be made compatible with liberal egalitarianism?"
  *   *Why:* This forces the empirics to matter. Instead of arguing abstractly about whether community requires boundaries, argue about *which* boundaries (cultural? legal? territorial?) and *how thick* they need to be. This moves the debate from metaphysics to political sociology.

  ### 4. Confidence and Falsifiability

  **Confidence Levels:**
  *   **High Confidence:** That the "welfare state" argument bundles distinct claims (fiscal/political/constitutive) and that this conflation drives much of the confusion. Your intuition here is analytically sound.
  *   **High Confidence:** That "open borders" is a slogan lacking institutional specification, leading to interlocutors arguing about different policy regimes.
  *   **Moderate Confidence:** That the core disagreement is foundational/incommensurable. It is possible that a new normative framework (e.g., Republican Non-Domination or a specific form of Practice-Dependent Justice) could bridge the gap, though none has succeeded yet.
  *   **Low Confidence:** That empirical evidence *could* shift the debate significantly. In political theory, empirical data is usually recruited to support prior normative commitments. However, if the "political worry" (that diversity kills redistribution) were definitively proven false across all contexts, the statist position would lose its strongest *pragmatic* shield, forcing them to rely solely on the *constitutive* claim, which is harder to defend publicly.

  **What Would Change My Mind:**
  1.  **If a "Statist Cosmopolitanism" emerged:** If a theorist successfully demonstrated that *global* justice *requires* strong states with closed borders (not just as a contingent fact, but as a normative necessity), the dichotomy collapses. (Some work hints at this, but it's not dominant).
  2.  **If the "Constitutive" claim was operationalized:** If someone defined "political community" in a way that didn't rely on vague notions of "shared identity" but on specific institutional mechanisms (e.g., specific voting structures), we could test whether open borders break them. Currently, "community" is too mushy to test.

  **Where This Diagnosis Might Be Wrong:**
  The risk in my diagnosis is that it is too cynical. It suggests the debate is stuck because the premises are incompatible. It is possible that the stalemate is simply due to a lack of **non-ideal theory**. Most open borders arguments are highly idealized. If the literature review focuses on the *transition costs* and *non-ideal pathways* (how we get from here to there), the foundational clash might soften because both sides agree on the immediate next step (e.g., expanding seasonal worker programs) even if they disagree on the end goal.

  ### Summary for Your Review

  You are not stuck because you haven't read the right book. You are stuck because the literature is engaged in a **category error**.

  1.  **Diagnose the conflation:** Explicitly separate the Fiscal, Political, and Constitutive arguments against open borders in your review. Show how proponents of open borders often answer the Fiscal argument while ignoring the Constitutive one.
  2.  **Demand Specification:** Critique the literature for failing to distinguish between entry, residence, and benefit access.
  3.  **Reframe the Stalemate:** Conclude that the debate is not waiting for better data, but for better institutional design or an admission of conflicting values.

  This turns your "stuckness" into a substantive contribution: you are not just summarizing the circle; you are explaining *why* it is a circle. That is a PhD-level insight.
