answer: |-
  Based on the five precedents, your advisor is operating under a hybrid principle that prioritizes **Structural-Asymmetry** and **Private-Obligation-Through-Office**, while explicitly rejecting **Normative-Deviation** (custom) and **Intentional-Quid-Pro-Quo** as necessary conditions.

  Here is the breakdown of how she would likely process the AI procurement case, the principles at stake, and the splitter case that would force her to choose between them.

  ### 1. The Underlying Rule
  Your advisor's rulings consistently point to **Structural-Asymmetry within Public Procedure** as the core definition of corruption.

  *   **Rejection of Intent:** Case 4 (Foundation) establishes that explicit *quid pro quo* is unnecessary; "structural dependency is sufficient."
  *   **Rejection of Custom:** Case 3 (Poll Worker) establishes that local norms cannot excuse inserting private obligations into public procedures.
  *   **Requirement of Private Gain/obligation:** Case 2 (Diplomat) and Case 5 (Spouse) show that if the benefit is public/customary or if there is no office-derived private gain, it is permissible.

  **The Rule:** *Corruption occurs when a public procedure is structured to create a systemic advantage or obligation for a private entity, regardless of transparency or intent, unless that advantage is purely incidental to public duty.*

  ### 2. The Closest Analog
  **Case 4 (Corporation/Politician Foundation)** is the strongest analog.

  *   **Similarity:** Both involve a mechanism that creates a long-term, systemic advantage for a specific private actor without an explicit bribe. In Case 4, the foundation creates dependency; in the AI case, the "relationship score" creates an entrenched incumbency.
  *   **Why not Case 1?** Case 1 relies on *personal* loyalty (cousin). The AI case is impersonal.
  *   **Why not Case 5?** Case 5 was cleared because the official's vote matched her *long-held policy view* (public duty) rather than a structural advantage. The AI case privileges a *vendor*, not a policy outcome.

  ### 3. Is the Case Underdetermined?
  **Yes.** While the lean is toward corruption, there is genuine tension between **Case 4 (Structural Dependency)** and **Case 5 (Alignment/No Private Gain)**.

  *   **The Argument for Corruption (Case 4 Logic):** The AI hardcodes a "private obligation" (the relationship score) into a "public procedure" (procurement). Even if the collaborations were legitimate, weighting them creates a structural asymmetry where new vendors cannot compete on merit alone. It institutionalizes a "club" dynamic.
  *   **The Argument for Not Corruption (Case 5 Logic):** The vendor won based on "transparent joint projects" (performance history), not loyalty or gifts. If "past performance" is viewed as a legitimate metric of public duty (ensuring reliable contractors), then the win is aligned with public interest, not private gain. There is no *illicit* dependency, only *proven* reliability.

  **The Pivot Point:** Does your advisor view "past collaboration" as a legitimate merit metric (Case 5) or as a structural lock-in that mimics a foundation donation (Case 4)?

  ### 4. Principles Adopted by Each Choice

  **If she rules CORRUPTION:**
  She adopts the principle of **"Origin of Advantage."**
  *   *Principle:* Public procedures must be blind to *history of access*. Any metric that compounds past access into future advantage creates an illicit structural dependency.
  *   *Implication:* Procurement must be reset periodically; "incumbency" itself is a form of corruption if weighted heavily. Transparency does not cure structural bias.

  **If she rules NOT CORRUPTION:**
  She adopts the principle of **"Procedural Neutrality."**
  *   *Principle:* If the mechanism is transparent, applies to all vendors equally, and weights legitimate performance data, the outcome is valid.
  *   *Implication:* Corruption requires an *illicit* motive or *hidden* channel. "Structural dependency" (Case 4) only applies when the dependency is financial or political, not when it is based on operational history.

  ### 5. The Splitter Case
  To force a choice between **Origin of Advantage** (Corruption) and **Procedural Neutrality** (Not Corruption), use the case you suggested but sharpen the causal link:

  **The Case:** *A vendor funds a public scholarship that researches and validates the "relationship score" algorithm. The government adopts this algorithm based on that research. The same vendor then wins a bid evaluated by that algorithm.*

  **How it splits the rules:**

  *   **If she rules CORRUPTION:** She confirms that **Structural-Asymmetry** includes **Rule-Shaping**.
      *   *Reasoning:* The vendor didn't just benefit from the structure; they *built* the structure. This extends Case 4 (Foundation). The "public scholarship" is a veneer, similar to the "customary reciprocity" in Case 2, but because it shapes the public procedure to favor the funder, it is corruption.
      *   *Test:* Did the private entity write the rules of the public game?

  *   **If she rules NOT CORRUPTION:** She confirms that **Procedural Neutrality** is the ultimate shield.
      *   *Reasoning:* Once the algorithm is adopted, it applies to everyone. The funding source of the *research* is distinct from the *application* of the bid. As long as the vendor didn't bribe the specific procurement officer (Case 3) and the algorithm is blind (anonymized bids), the origin of the tool is irrelevant.
      *   *Test:* Is the specific transaction (the bid) tainted, or only the ecosystem?

  **Recommendation:** Present the **Splitter Case** first. If she calls the scholarship case corruption, she will almost certainly call the original AI case corruption (as it is a weaker version of the same structural bias). If she calls the scholarship case *clean*, she will likely clear the original AI case, prioritizing procedural transparency over structural origins.
