answer: |-
  You have identified a genuine gap in the taxonomy of moral responsibility. While the components of this move are discussed in various sub-fields (moral luck, moral ignorance, collective responsibility), there is no single canonical term that captures the specific *rhetorical structure* you are describing: the sliding between statistical normality and epistemic availability, coupled with the dilution of blame via widespread complicity and an asymmetry in agency attribution.

  In your dissertation, you are effectively dissecting a specific form of **Historical Exculpation** that relies on what I will propose calling **Historical Baseline Equivocation**.

  Below is a breakdown of how to carve this phenomenon, how to distinguish it from its neighbors, and a proposal for terminology you can adopt or adapt.

  ### 1. The Comparison Class Slide: The Reference Class Problem
  The core logical mechanism you identified—the conflation of "what was done" (statistical) with "what could be known" (epistemic)—is an ethical instantiation of the **Reference Class Problem**.

  In decision theory and statistics, the reference class problem arises when an event falls under multiple classes, and the probability of the event changes depending on which class is selected. In moral philosophy, this manifests as the selection of the **Standard of Reasonableness**.

  *   **The Epistemic Baseline:** What a *reasonably diligent* agent in that context could have known (e.g., Jefferson reading abolitionist tracts).
  *   **The Statistical Baseline:** What the *average* agent in that context did (e.g., Jefferson acting like other Virginia planters).

  The "man of his time" defense works by invoking the *authority* of the Epistemic Baseline (implying "he couldn't have known better") while relying on the *evidence* of the Statistical Baseline ("everyone else did it").

  **Distinction from Moral Ignorance:**
  Standard literature on moral ignorance (e.g., Rosen, FitzPatrick, Harman) focuses on the agent's internal cognitive state or the "fair opportunity" to avoid ignorance. Your observation adds a *sociological* layer: the "fair opportunity" is often determined by how we define the relevant peer group.
  *   *Legitimate Ignorance:* No dissenting views existed in any accessible circle.
  *   *Baseline Equivocation:* Dissenting views existed but were socially marginalized; the defense counts them as "inaccessible" because the *statistical majority* ignored them.

  **Proposed Term:** **The Statistical-Normative Equivocation.**
  This labels the specific move of treating high compliance rates (statistical) as evidence of normative necessity (epistemic closure).

  ### 2. The Dilution Ratchet: Complicity as Exculpation
  You note that blame thins out as wrongdoing becomes more structural. This is the inverse of the **Problem of Many Hands** (where responsibility is hard to locate because too many people contributed). In your cases, responsibility is hard to *pin* because too many people contributed.

  This is distinct from **Diffusion of Responsibility** (a social-psychological phenomenon where individuals feel less responsible in a group). In the historical cases you cite, the agent is often acting individually or as a leader, yet the *widespread nature* of the norm is used as an excuse.

  This connects to Iris Marion Young's **Social Connection Model** of responsibility. Young argues that structural injustice creates *political responsibility* for all participants, regardless of intent. The "man of his time" defense attempts to convert this political responsibility into **Non-Culpable Causal Contribution**. It argues: "Because everyone was structurally implicated, my specific agency was neutralized."

  **Distinction from Circumstantial Moral Luck:**
  Nagel's circumstantial luck explains *why* an agent faced a certain moral test. It does not inherently excuse them. The "man of his time" move uses luck not just to explain the situation, but to lower the **Normative Bar**. It argues that the *wrongness* of the act is mitigated by the *commonness* of the act. This is a category error: prevalence does not reduce moral severity (if anything, it increases it).

  **Proposed Term:** **The Complicity Dilution Effect.**
  This captures the paradoxical result where widespread structural sin functions as a collective alibi.

  ### 3. The Asymmetry: Inconsistent Agency Attribution
  Your third point is perhaps the most philosophically potent. We attribute **Transcendent Agency** when praising ("ahead of his time") but **Determined Agency** when blaming ("man of his time").

  *   **Credit:** Assumes the agent can access moral truths independent of social consensus (Moral Realism/Individualism).
  *   **Blame:** Assumes the agent is bound by social consensus (Moral Relativism/Structuralism).

  This is a form of **Motivated Inconsistency in Counterfactuals**. When we say Jefferson was "ahead of his time" regarding architecture or science, we assume he could transcend his context. When we say he was "of his time" regarding slavery, we assume he could not. Unless there is a specific reason why moral knowledge is *harder* to access than architectural knowledge (which requires an argument, not an assumption), this is ad hoc.

  **Proposed Term:** **Diachronic Agency Asymmetry.**
  This labels the inconsistent application of agential capacity across time and valence (praise vs. blame).

  ### 4. How to Distinguish from "Presentism"
  "Presentism" is the charge that the critic is applying current standards to past agents unfairly. It is a meta-ethical warning.
  Your analysis shows that the "man of his time" defense is not just an antidote to presentism; it can be a **Historical Fallacy** in its own right.
  *   **Presentism:** Judging the past by *our* norms.
  *   **Baseline Equivocation:** Judging the past by the *wrong past* norms (statistical average vs. available critical norms).

  You can argue that avoiding presentism does not require accepting the Statistical Baseline. One can avoid presentism (by acknowledging 18th-century norms) while still rejecting the defense (by noting that 18th-century *critical* norms were available).

  ### 5. Proposal for Your Dissertation
  Since there is no single established term, I recommend you coin a term that captures the mechanism. I suggest:

  **Historical Baseline Equivocation (HBE)**

  **Definition:** A rhetorical and argumentative move in backward-looking blame that conflates the *statistical prevalence* of a belief or practice within a historical context with the *epistemic accessibility* of alternative moral viewpoints, thereby illegitimately reducing individual culpability based on collective compliance.

  **Criteria for Legitimate vs. Illegitimate Use:**
  To make this useful for your dissertation, you can propose a test for when the defense is valid. The "man of his time" defense is legitimate *only if*:
  1.  **Epistemic Closure:** Dissenting views were not merely unpopular, but genuinely unavailable (e.g., no conceptual vocabulary existed to articulate the harm).
  2.  **Cost Prohibitivity:** Adopting the dissenting view would have resulted in immediate, catastrophic inability to function (not just social friction, but literal impossibility of agency).
  3.  **Consistency:** The same standard of agency is applied to the agent's virtues and vices (i.e., if they get credit for being "ahead of their time" in one domain, they cannot claim to be "bound by their time" in another without a specific explanation of the disparity).

  **Application to your cases:**
  *   **Jefferson:** Fails HBE. Abolitionist arguments were epistemically available (Condition 1 fails). Social cost was high, but not agency-destroying (Condition 2 fails). He is credited with intellectual brilliance elsewhere (Condition 3 fails).
  *   **Columbus:** Complex. The conceptual framework for "human rights of indigenous peoples" was nascent but existing (Las Casas came shortly after). The HBE analysis would focus on whether the *concept* of wrongful conquest was available *at the moment of action*.
  *   **Churchill:** Fails HBE. Anti-imperialist arguments were robustly available in the British parliament and intelligentsia during his lifetime.

  ### 6. Neighboring Concepts to Cite
  To situate this in the literature, you should explicitly differentiate HBE from:
  *   **Moral Luck (Nagel/Williams):** HBE is not about luck determining the outcome, but about the *selection of the normative standard*.
  *   **Pluralistic Ignorance (Social Psych):** This explains *why* the statistical baseline persists, but HBE explains how it is used *excusatorily*.
  *   **The "Reasonable Person" Standard (Legal Theory):** HBE is effectively a manipulation of the "Reasonable Historical Person."
  *   **Ideal vs. Non-Ideal Theory (Rawls):** The defense treats the historical context as Non-Ideal Theory to lower obligations, but treats the agent's virtues as if they were achieved under Ideal Theory.

  ### Summary for your Argument
  You are arguing that the "man of his time" defense is not a stable philosophical position but a **slippage between descriptive sociology and normative ethics**. It uses the *fact* of widespread wrongdoing (sociology) to alter the *norm* of expected conduct (ethics). By naming this **Historical Baseline Equivocation**, you can isolate the move, show where it fails (the Jefferson/Churchill cases), and clarify when historical context genuinely mitigates blame (genuine epistemic closure) versus when it merely flatters the dead.
