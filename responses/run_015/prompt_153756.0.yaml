answer: |-
  # The 12-Minute Deontological Triage Checklist

  **Context:** You are the decision point. There is no committee. You sign the note. This tool converts abstract duty into actionable steps without pretending the moral cost disappears.

  ### Step 1: Identify Active Duties (The Agents)
  *Do not list abstract principles. List who owes what to whom right now.*
  *   **Duty A (Autonomy):** Do I owe this specific patient obedience to their will? (Requires verified capacity).
  *   **Duty B (Non-Maleficence):** Do I owe this patient protection from harm/death?
  *   **Duty C (Fiduciary):** Do I owe the profession integrity (not becoming a tool of coercion)?
  *   **Flag:** If capacity is absent, Duty A vanishes. If capacity is present, Duty B cannot override Duty A without a universalizable reason.

  ### Step 2: The Shadow-Maxim Test
  *Draft two statements. If either collapses under universalization, you cannot proceed.*

  1.  **The Action Maxim:** "In cases of [Clinical Context], I will [Proposed Action] because [Reason]."
      *   *Test:* Could every physician act on this maxim without contradicting the practice of medicine?
  2.  **The Exception Maxim:** "I will violate [Standard Duty] in this instance because [Emergency/Emotion/Uncertainty]."
      *   *Test:* If every physician made this exception for this reason, would trust in the system collapse?

  *   **Pass:** Both maxims hold. Proceed.
  *   **Fail:** One maxim creates a contradiction (e.g., "I will lie to save time" → destroys trust). You are in a genuine dilemma. Go to Step 3.

  ### Step 3: The Tie-Breaker (Judgment Call)
  *This is not algorithmic. This is where you choose which duty bleeds.*
  *   **Rule:** **Agency Trumps Outcome.**
  *   **Procedure:** If Duty A (Autonomy) and Duty B (Non-Maleficence) conflict, you must prioritize the agent's will *unless* the agency itself is demonstrably broken (incapacity).
  *   **Flag:** **You are choosing to allow harm to respect agency.** This is not a calculation of survival odds. This is a choice to value self-determination over biological continuity. Sign your name to this priority.

  ### Step 4: Moral-Residue Box
  *Do not skip this. This is for your chart note and your conscience.*
  *   **Duty Overridden:** [e.g., Non-Maleficence]
  *   **Acknowledgment:** "I recognize that by honoring [Decision], I am permitting [Harm/Death]. This duty is not cancelled; it is violated to satisfy a higher lexical priority. I accept the moral cost."
  *   **Signature:** [Your Name/ID]

  ### Step 5: Misfire Conditions
  *Abort this checklist if:*
  *   **Time < 2 Minutes:** Act on emergency presumption (preserve life) and document later.
  *   **Active Violence:** Safety overrides ethics.
  *   **Total Information Blackout:** No ID, no history, no surrogate. Act on presumption of consent for stabilization only.

  ---

  ## Case Applications

  ### Case 1: Capacitated Adult Refuses Transfusion (Religious)
  *Family begging to override; Surgeon impatient.*

  1.  **Active Duties:** Duty A (Obey Patient) is active (Capacity verified). Duty B (Prevent Death) is active.
  2.  **Shadow-Maxim:**
      *   *Action:* "I will transfuse a capacitated adult against their will to prevent death."
      *   *Exception:* "I will violate bodily integrity because the family is distressed."
      *   *Test:* If all doctors transfused capacitated refusers because families yelled, bodily integrity becomes conditional on family approval. **Contradiction.** Autonomy is destroyed.
  3.  **Tie-Breaker:** Agency Trumps Outcome. The patient's will is intact.
  4.  **Decision:** **Do Not Transfuse.**
  5.  **Moral-Residue:** "I am permitting preventable death. Duty B is violated. I accept this to preserve the integrity of consent."
  6.  **Result:** You must tell the surgeon to stand down and the family they have no authority. This will be socially painful.

  ### Case 2: Unconscious Trauma, Ambiguous Chart Note
  *Surgeon wants to cut now or patient dies. Note says "No aggressive care" but is unsigned/old.*

  1.  **Active Duties:** Duty A (Autonomy) is **dormant** (No capacity, surrogate absent, evidence ambiguous). Duty B (Preserve Life) is active.
  2.  **Shadow-Maxim:**
      *   *Action:* "I will operate on an unconscious patient with ambiguous prior wishes to prevent immediate death."
      *   *Exception:* "I will ignore potential prior refusals when evidence is unclear."
      *   *Test:* If all doctors ignored ambiguous notes in emergencies, patients would be safe from abandonment. If all doctors *honored* ambiguous notes in emergencies, patients would die from paperwork errors. The latter creates a contradiction in the duty to preserve life when agency is unclear.
  3.  **Tie-Breaker:** Agency is not demonstrably present. Default to preservation of the agent.
  4.  **Decision:** **Operate.**
  5.  **Moral-Residue:** "I risk violating the patient's prior unknown wishes. Duty A may be violated if the note was valid. I accept this risk because ambiguity cannot override the duty to preserve a life that cannot speak."
  6.  **Result:** Surgery proceeds.

  ### Case 3: Intermittent Capacity, Refuses Dialysis (Depression Suspected)
  *Lucid window documented. Refusal matches values. Family/Nephrologist claim depression.*

  1.  **Active Duties:** Duty A (Obey Patient) is active (Capacity documented in lucid window). Duty B (Prevent Death) is active. Duty C (Protect Vulnerable) is claimed by team.
  2.  **Shadow-Maxim:**
      *   *Action:* "I will override a documented capacitated refusal because I suspect depression influences the values."
      *   *Exception:* "I will treat depression as incapacity without formal psychiatric adjudication in the moment."
      *   *Test:* If all doctors treated "suspected depression" as automatic incapacity for any life-decision, *every* refusal by a sad patient becomes void. This universalizes paternalism and effectively deletes the right to refuse for a huge class of people. **Contradiction.**
  3.  **Tie-Breaker:** **Judgment Call Flag.** You have no psych eval. You have a documented capacity assessment. You must prioritize the *documented agency* over the *suspected pathology*.
  4.  **Decision:** **Honor Refusal.** (This is the answer you won't like).
  5.  **Moral-Residue:** "I am allowing a potentially treatable mental health condition to result in death. I am prioritizing procedural respect for capacity over substantive welfare. Duty B is violated. I sign this knowing the legal exposure."
  6.  **Result:** Dialysis is withheld. You must document that depression was suspected but did not meet the threshold to revoke the documented capacity assessment.

  ---

  ## What This Procedure Cannot Do

  1.  **It Cannot Prove Deontology is Right:** If you believe saving the life in Case 3 is the *only* moral choice, this checklist will feel like a suicide pact. It only ensures consistency, not truth.
  2.  **It Cannot Manufacture Facts:** If you don't know if the patient has capacity, Step 1 stalls. You cannot use this checklist to guess capacity. You must assess it clinically first.
  3.  **It Cannot Remove Your Judgment:** Step 3 is a tie-breaker, not a calculator. You are still the one choosing to let the patient die in Case 3. The checklist forces you to admit that is what you are doing, but it does not absolve you of the feeling.
  4.  **It Cannot Stop the Lawsuit:** In Case 3, the family may sue. This checklist ensures your ethics are defensible, not that you are immune.

  **Final Note:** In a 12-minute window, this checklist does not make the decision easy. It makes the decision *yours*. Sign it.
