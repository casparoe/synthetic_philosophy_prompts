  **2. Deflationary / Easy Ontology vs. Realist Constitution**
  This isn't about survival conditions; it's about *origin*. Cases 5 (Nature Find) and 6 (Readymade) do the work here. If the answer to "Is the erosion lump a statue?" is "It depends on whether we call it one," that is Deflationary (Hirsch/Thomasson). If the answer is "No, it lacks the right history regardless of names," that is Realist Constitution (Baker). If you don't ask about intentionality, you can't separate the deflationist from the constitution theorist.

