          4.  Address why closed control blocks independent safety probing.
          5.  Deal head-on with the "irreversibility" pushback (one chance to be wrong).
      *   **Audience:** Smart non-expert readers (journalism context).
      *   **Tone:** Plain language, reasoned, no citations.
      *   **Length:** Around 600 words.

  2.  **Brainstorming Objections (Steel-manning):**
      *   *Objection 1:* Catastrophic misuse. If a model helps design a pandemic, opening it kills millions. You can't "learn" from that spill.
      *   *Objection 2:* The "Genie" problem. Once out, you can't patch it. Closed models can be updated/revoked if a flaw is found.
      *   *Objection 3:* Power asymmetry. Bad actors (terrorists) benefit more from openness than good actors (defenders) because defenders already have state resources.

  3.  **Drafting the Argument (Lock-in vs. Spill):**
      *   *Core Thesis:* Centralization creates a permanent power imbalance (Lock-in) that is worse than transient risks (Spills).
      *   *Leakage:* Secrets don't stay secret. Capabilities will diffuse anyway.
      *   *Safety Probing:* You need many eyes to find dangers. Closed boxes hide risks from researchers who aren't employees.
      *   *Irreversibility:* Yes, openness is irreversible, but so is centralization. If we lock-in control now, we lose the democratic ability to shape the future.

