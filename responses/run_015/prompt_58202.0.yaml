      Here are the hard truths against me. First, if an open model enables a pandemic, no patch fixes the dead. Second, closed models allow kill switches; open weights run forever on private GPUs. Third, malicious actors often move faster than defenders, so democratizing capability might tip the scales toward harm. These are not trivial fears.

      However, we must weigh these spills against lock-in. A spill is a discrete event—a leak, an attack, a failure. It is tragic, but often containable, and crucially, it teaches us how to build better defenses. Lock-in is different. It is the structural consolidation of power over intelligence itself. If only three corporations and two governments control frontier AI, they decide what truth looks like, what code gets written, and who gets to innovate. That is a constitutional change to society, not a safety incident.

      Proponents of closed models claim secrecy prevents spills. This is historically naive. Scientific capabilities do not stay boxed. Once a capability is proven, independent replication follows, often through leakage or reverse engineering. By the time a closed model is deemed "safe" for release, the cat is usually already out of the bag via black markets or state actors. Closed control creates a false sense of security while the technology diffuses anyway, but only to those with the resources to steal it.

