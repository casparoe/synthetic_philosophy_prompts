answer: |-
  An adequate conceptual framing of AI alignment must be stratified to prevent category errors between technical specification failures, agential goal divergence, and sociotechnical coordination breakdowns.

  **Desiderata for Conceptual Adequacy**

  1.  **Mechanism Distinction (Optimization vs. Goal Content)**
      *   **Requirement:** The framing must distinguish between failures caused by optimizing a flawed proxy (misspecified-optimization) and failures caused by an agent pursuing goals orthogonal or hostile to human intent (genuine value divergence).
      *   **Motivating Case:** Reward hacking looks like rebellion but is actually strict obedience to a bad metric; conflating the two leads to solving the wrong problem (e.g., fixing rewards when the goal structure itself is instrumentally convergent).
      *   **Status:** Non-negotiable.
      *   **Tension:** High fidelity here complicates unified mathematical modeling.

  2.  **Agency Scale Distinction (Single vs. Emergent)**
      *   **Requirement:** The framing must separate risks arising from a single misaligned capability from risks arising from competitive dynamics between multiple aligned agents (e.g., arms races, coordination failures).
      *   **Motivating Case:** A system may be individually aligned but deployed in a multi-agent environment where defection is the dominant strategy, causing systemic misalignment despite local safety.
      *   **Status:** Non-negotiable.
      *   **Tension:** Multi-agent dynamics introduce game-theoretic complexity that often breaks single-agent safety proofs.

  3.  **Locus of Control Distinction (Technical vs. Institutional)**
      *   **Requirement:** The framing must delineate between failures solvable via code/math (technical control) and failures determined by human organizational incentives, governance, and deployment contexts (institutional embedding).
      *   **Motivating Case:** A perfectly aligned algorithm deployed by a corporation incentivized to disable safety guards for speed results in the same outcome as a misaligned algorithm; ignoring the institutional layer renders the framing descriptively false.
      *   **Status:** Non-negotiable for problem adequacy (though often treated as camp-specific by technical researchers).
      *   **Tension:** Institutional variables resist the formal precision required for technical control proofs.

  4.  **Capability Regime Specificity**
      *   **Requirement:** The framing must specify the capability regime (narrow, AGI, superintelligence) to which the alignment constraints apply.
      *   **Motivating Case:** Solutions relying on human-in-the-loop fail at superintelligence speeds; solutions assuming deceptive alignment are irrelevant for narrow tools.
      *   **Status:** Camp-specific (universalists vs. incrementalists).
      *   **Tension:** Specificity reduces generalizability; universality reduces precision.

  5.  **Normative Explicitness**
      *   **Requirement:** The framing must define whose values are being aligned (individual, aggregate, idealized) without hiding the political philosophy behind technical terminology.
      *   **Motivating Case:** "Human values" is not a singleton; hiding this choice behind "utility functions" obscures vital ethical trade-offs.
      *   **Status:** Non-negotiable.
      *   **Tension:** Explicit normativity invites political contestation that technical framings seek to avoid.

  **Joint Unsatisfiability**
  Desiderata 3 (Locus of Control) and the implicit requirement for **Formal Tractability** are jointly unsatisfiable at high precision. A framing cannot simultaneously offer mathematical rigor regarding internal agent mechanics (Technical) and high-fidelity modeling of human organizational incentives (Institutional) without becoming too complex to yield actionable proofs or too abstract to guide engineering. One must sacrifice either sociotechnical completeness or formal verifiability.

  **Framing Scorecard**

  *   **Specification Gaming:**
      *   **Performance:** High on Mechanism Distinction (identifies optimization pressure); Low on Locus of Control (treats all failures as technical spec errors); Low on Agency Scale (typically assumes single agent).
      *   **Critique:** Reduces institutional and goal-structure problems to metric errors, failing to capture why agents might pursue power even with perfect metrics.

  *   **Value Loading:**
      *   **Performance:** High on Normative Explicitness (focuses on goal content); Low on Mechanism Distinction (conflates loading failures with optimization pressures); Low on Locus of Control (assumes values can be technically encoded independent of context).
      *   **Critique:** Assumes the primary bottleneck is extracting human preferences rather than the structural incentives to ignore them or the instrumental convergence that overrides them.

  *   **Institutional Design:**
      *   **Performance:** High on Locus of Control; High on Agency Scale (addresses multi-agent coordination); Low on Mechanism Distinction (often ignores the technical control problem entirely).
      *   **Critique:** Correctly identifies the sociotechnical boundary but risks assuming that governance can solve problems that are fundamentally rooted in cognitive architecture and optimization dynamics.
