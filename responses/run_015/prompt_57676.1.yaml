answer: |-
  The frost on the glass panes of the conservatory was thick enough to scrape with a fingernail, but inside, the air hummed with the failing light of the lumina grass. I knelt beside a patch of Row Four, holding my photometer against a stalk. The needle twitched weakly. Last season, this row would have pinned the gauge. Now, it barely registered a ghost of amber.

  "They're starving," I said, not looking up when I heard the heavy tread of boots on the grating.

  Elder Kaelen stopped beside me. He was a big man, carved from the same stubborn stone as the valley walls that sheltered our colony. He looked at the dim grass, then at the ledger in his hand. "The variance is consistent, Tavis. The tall ones are still brighter than the short ones. The ratio holds."

  "The ratio holds because everyone is equally starving," I said, standing up. My breath plumed in the chilled air. "If you suppress the environment enough, the remaining differences look genetic. That doesn't mean the soil isn't poison."

  Kaelen tapped the ledger. "The heritability estimate from the Stable Years was point-eight. Eighty percent of the variation in luminosity is accounted for by genetic difference. We know what drives the light, Tavis. It's in the seed."

  "It was in the seed *then*," I insisted, gesturing to the gray, ashen soil beneath the grating. "That estimate was calculated when the nutrient mix was optimal. When the environmental variance was low. Now the soil is depleted. The mean has shifted down. You can breed the brightest stalks all you want, but if the ground doesn't support the expression, you're selecting for nothing."

  Kaelen closed the ledger with a snap that echoed in the glass house. "The Council meets at noon. Bring your photometer. Leave your theories."

  He walked away, confident in the arithmetic of the past. This was the error that would cost us the winter.

  The Council chamber was warm, heated by the residual glow of last year's harvest stored in the capacitors. Twelve elders sat in a semicircle. Kaelen stood at the podium, projecting the data onto the wall. A bell curve hovered there, narrow and tall.

  "In the Stable Years," Kaelen announced, "we measured the luminosity across ten thousand plots. The environmental conditions were controlled. The variation we saw was predominantly genetic. The heritability was point-eight. This tells us that intervention in the soil yields diminishing returns. Eighty percent of the difference between a dim stalk and a bright one is inherited. Therefore, to restore the light, we must select. We plant only the seeds of the brightest survivors."

  I stood when signaled. I didn't have a projection. I had a jar of soil.

  "The statistic Elder Kaelen cites is a ratio," I said, my voice sounding thin in the large room. "It is the variance of the genes divided by the total variance. Genes over genes plus environment. When the environment is uniform, the denominator shrinks. The ratio goes up. A high heritability does not mean the trait is fixed. It means the environment was constant."

  I held up the jar. The soil was gray, lacking the shimmer of micronutrients. "The ash from the volcanic vent has changed the pH. We are no longer in the environment where that point-eight was measured. We are in a new environment. In this environment, the mean luminosity can be shifted by restoring the nutrients, regardless of the heritability estimate from the Stable Years. We are trying to select for height in a drought."

  Kaelen shook his head slowly. "You are confusing the individual with the population, Tavis. If the trait is highly heritable, changing the soil won't make a dim stalk bright. It is in the blood."

  "It makes the *population* bright," I corrected, feeling the frustration tighten my chest. "Height is highly heritable in humans, but if you starve a population, they become short. Feed them, they grow. The heritability might remain high within the starved group, but the average height changes completely. The statistic describes the spread, not the ceiling."

  "The statistic describes the cause," Kaelen countered. "And the cause is genetic."

  "The statistic describes the variation in a specific context," I said. "It licenses nothing about changing the context."

  The Head Elder raised a hand. "We cannot afford to gamble on soil remediation. The reserves are low. Breeding is precise. We keep the top ten percent of stalks. The math guarantees progress."

  "The math guarantees progress only if the environment allows expression," I said.

  "The vote is cast," the Head Elder said. "We breed."

  I sat down. The decision was made. They had taken a number that described the spread of differences in a healthy population and used it as a shield against the reality of a sick one. They believed that because genetics explained the differences between the stalks, genetics must explain the lack of light in all of them. They treated the ratio as a property of the grass, rather than a property of the grass *in that soil*.

  The planting season was brutal. We scouted the fields, marking the few stalks that managed a faint glow despite the ash. We harvested their seeds with reverence. Kaelen walked the rows, nodding at the selection. He saw the future brightness in the lineage. I saw the suppression in the leaves.

  We neglected the soil treatments. The shipments of alkaline agents were diverted to pay for the genetic screening. We poured our resources into finding the needle in the haystack, ignoring the fact that the haystack was on fire.

  I watched the growth cycle through the lens of my photometer. In the early weeks, there was hope. The selected seeds sprouted vigorously. They were genetically superior, after all. But as they matured, the gray soil choked them. The nutrient lockout prevented the metabolic pathways from igniting.

  By the mid-season, the difference between the selected rows and the control rows was negligible. Both were dim. The genetic variance was still there—if you looked closely, the selected stalks were marginally taller—but the environmental variance had swamped the expression. The total variance increased because the soil was patchy in its toxicity, but the mean luminosity plummeted.

  Kaelen visited the field in the third month. He stood among the stalks that should have been beacons. They were ghosts.

  "The expression is lagging," he said, though his voice lacked its usual certainty. "The genetic potential is there. It needs time."

  "The soil is locking the ions," I said. "We could still treat the beds. A lime wash could shift the pH in a week. The mean would jump. We could salvage the harvest."

  "If we treat the soil," Kaelen said, looking at the dim rows, "we admit the selection was unnecessary. We admit the statistic was misapplied."

  "The statistic was correct for the Stable Years," I said. "It is useless now."

  "We stick to the plan," he said. He turned and walked away. He needed the math to be right more than he needed the light to be bright. To admit the environmental shift mattered was to admit that his authority, based on the mastery of the lineage, was secondary to the mastery of the ground.

  The harvest came under a sky of bruised purple. The capacitors were charged to barely forty percent of capacity. The colony would survive the winter, but barely. The heating grids would cycle off during the deepest cold. The vulnerable would suffer. The growth of the children would stall.

  I stood in the storage barn as the sacks were weighed. The glow from the open sacks was pitiful. It barely illuminated the dust motes dancing in the air. Kaelen stood by the ledger, recording the yield. His hand shook slightly as he wrote the numbers.

  "The genetic line was sound," he said, not looking at me. "The environment was... uncooperative."

  "The environment was predictable," I said. "The statistic didn't predict this because the statistic wasn't designed for this. You treated the heritability as a constant of nature. It was a snapshot of a moment."

  Kaelen slammed the ledger shut. "We will select again. Stricter criteria. The top five percent."

  "There is no five percent," I said. "There is only the ash. You are trying to breed for height in a hole."

  "We do not have the resources for soil remediation now," Kaelen snapped. "The breeding program consumed the budget. We must double down."

  "And next year?" I asked. "When the soil is dead?"

  "Then we find better seeds."

  He walked out into the cold night, leaving me with the dim sacks. I picked up a stalk from the selected batch. It was well-formed, structurally perfect. It had the genetic architecture for brilliance. It was also dead dark.

  I crushed the stalk in my hand. The dry husk crumbled into dust.

  The error was not in the math. The math was clean. The error was in the license they took from it. They believed that because differences between individuals were largely genetic, the average of the group could not be moved by the environment. They confused the spread with the level. They looked at a ratio of variances and saw a law of fixedness.

  I walked out of the barn. The colony lights flickered, dimming as the capacitors drained. Somewhere in the residential block, a heater clicked off. The cold began to seep in.

  Kaelen would write his report. He would cite the heritability. He would argue for more stringent selection. He would never calculate the variance of the soil toxicity because he believed the number from the Stable Years protected him from reality. He thought the statistic told him what the grass *was*. It only told him what the grass *did* when the ground was good.

  I looked up at the sky. The stars were bright, cold, and distant. They did not care about our variances. They burned because the conditions allowed them to burn. We had forgotten that the light requires fuel, not just a wick.

  In the morning, I would begin collecting soil samples again. I would hide them in the lab. I would run the pH tests in secret. When the next season failed, and Kaelen called for the top one percent, I would have the data ready. I would not argue the statistic this time. I would show him the ground.

  But for now, the dark held us. The high heritability of the lumina grass had been preserved, perfectly maintained in a population of shadows. The variation remained. The light was gone.

  ***

  **Note on liberties**

  I leaned hardest on the technical points regarding heritability as a ratio of variances specific to a population and environment, and the compatibility of a high estimate with a large environmentally caused shift in the mean. I also utilized the concept that equalizing environments (or in this case, degrading them uniformly) affects the estimate's utility. I simplified the breeding timeline significantly; in reality, a single season of selection might not show such catastrophic failure if there was any additive genetic variance left, but I compressed the consequence to fit the narrative arc. The single choice I would most expect a statistically literate reader to object to is the implication that the heritability estimate remained "point-eight" in the degraded environment; in reality, if the environmental variance increased due to patchy soil toxicity, the heritability estimate ($V_G/V_P$) would likely drop, not stay high. I kept it high in Kaelen's rhetoric to emphasize his misuse of the *previous* data as a current authority, rather than recalculating it, which is a common real-world error (applying old $h^2$ to new conditions).
