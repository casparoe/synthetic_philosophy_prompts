      *   **Concern:** They worry they've insulated the theory too well using concepts like "exaptation" and "malfunction." They want to know what *actually* counts against it (real defeaters).
      *   **Specific Examples Given:** Horizontal Gene Transfer (HGT), Synthetic Biology parts, Spandrels/Exaptation (is it just renaming?).
      *   **Task:** Rank objections from fatal to merely awkward. Be honest about defender concessions. Address the risk of unfalsifiability/qualifying the theory into oblivion.
