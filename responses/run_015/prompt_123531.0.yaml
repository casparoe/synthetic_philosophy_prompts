      *   *Strengths:* Handles malfunction well (a heart that doesn't pump still has the function of pumping). Distinguishes function from mere causal role.
      *   *Weaknesses:* Requires a specific history. Struggles with things lacking history or having complex/fragmented history.

  3.  **Evaluate the Specific Objections:**

      *   **Horizontal Gene Transfer (HGT):**
          *   *Problem:* In bacteria/archaea, genes jump between lineages. The "ancestral lineage" is a network, not a tree. A gene might be selected for $X$ in lineage A, move to lineage B, and now do $Y$. What is its function in B?
          *   *SET Response:* Look at the *immediate* history in the current lineage. If it was retained in B because of $Y$, then $Y$ is the function. If it just arrived, it might have no function yet (or retain the old one).
          *   *Severity:* Awkward/Complicating, not fatal. SET can adapt by redefining "lineage" or focusing on the gene's history rather than the organism's strict phylogeny.

      *   **Synthetic Biology / Novel Traits:**
          *   *Problem:* A CRISPR-edited gene or a synthetic organoid has no evolutionary past. Does it have no function? Intuitively, it does (e.g., the synthetic kidney filters blood).
          *   *SET Response:* Strict SET says *no proper function* (in the biological sense). It has a *design function* (intentional) or a *causal role*. Some defenders (like Garson) suggest "generalized selected effects" where the *type* has a history, even if the *token* doesn't.
          *   *Severity:* Serious. It limits the scope of the theory. If we want a theory of *biological* function, maybe it's okay. If we want a theory of *function* generally, it fails here.
          *   *Verdict:* Awkward/Limiting, but defenders often concede this is a feature, not a bug (distinguishing natural vs. artificial).

      *   **Exaptation / Spandrels (Gould & Vrba):**
          *   *Problem:* Feathers evolved for warmth, now used for flight. Is the function flight or warmth? SET says warmth (originally). But intuitively, now it's flight. Calling it "exaptation" feels like moving the goalposts.
          *   *SET Response:* Distinguish *original function* vs. *current proper function*. If selection pressure shifts, the function shifts *after* a new selection history accumulates. There is a lag time.
          *   *Severity:* Merely Awkward. This is the classic objection, and SET is specifically designed to handle it by distinguishing "selected for" vs. "currently useful." The "renaming" charge is common but SET proponents argue the distinction is theoretically vital.

      *   **The "Time Lag" / "Instant Function" Problem:**
          *   *Problem:* A mutation arises. It is immediately beneficial. Does it have a function *before* it is fixed in the population? SET usually requires a history of selection.
          *   *Severity:* Moderate. Requires nuanced handling of "traits" vs. "alleles."

      *   **The "Generalized Selected Effects" (Garson) Challenge:**
          *   *Problem:* What if a trait type has a history, but this specific token doesn't fit the pattern? Or what about neural plasticity where circuits are formed on the fly?
          *   *Severity:* Moderate to High for strict SET.

      *   **The Unfalsifiability / "Just-So Story" Charge:**
          *   *Problem:* If we can always posit an unknown ancestral selection pressure to explain a function, is it empirical?
          *   *Severity:* Fatal if true. But phylogenetics constrains this.

  4.  **Develop the Ranking (Fatal to Awkward):**

      1.  **The "Novelty" Problem (Synthetic Biology/First Mutants):** *Fatal/Severe.* If a trait works perfectly but has *zero* history, strict SET says it has no function. This contradicts biological practice where we assign functions to novel knock-ins immediately. Defenders usually concede this but argue it's a category error (design vs. natural function).
      2.  **The HGT / Phylogenetic Network Problem:** *Serious.* Challenges the "lineage" assumption. If lineage is a web, "ancestral selection" is ambiguous. Defenders have to modify the theory (gene-centric vs. organism-centric).
      3.  **The "Just-So" / Epistemic Access Problem:** *Serious.* If function depends on unobservable history, can we ever *know* function? This makes the theory ontologically robust but epistemically useless.
      4.  **The Exaptation/Spandrel Charge:** *Awkward.* It's not a defeater; it's the intended feature. The "renaming" charge is rhetorical.
      5.  **The Malfunction Escape Hatch:** *Awkward.* It works, but relies on a normative leap from "is" to "ought" (Hume's Guillotine).

  5.  **Address the "Unfalsifiability" Concern:**
      *   Is qualifying the theory (adding "exaptation," "malfunction," "gene-centric") making it unfalsifiable?
      *   *Analysis:* It risks it. If every counterexample gets a new label (latent function, dormant function, shifted function), it's degenerating.
      *   *Honest Assessment:* The theory is vulnerable to the "Lakatosian Degenerating Research Programme" critique. However, it remains the best naturalistic account of normativity in biology.

  6.  **Drafting the Response:**
