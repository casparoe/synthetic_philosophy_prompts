  OFFICE OF THE FACULTY SENATE
  MINUTES OF THE REGULAR MEETING
  October 14, 2024 | 4:00 PM | Conference Room B
  Present: The Chair, 45 Senators. Absent: 2.

  **1. Curriculum Motion 24-A.**
  The Senate considered a motion to suspend the Undergraduate Language Requirement. Per Procedure 9.1 (Premise-Based Aggregation), the motion was structured as follows:
  Premise 1: If enrolment in language courses has fallen below fifty, the requirement should be suspended.
  Premise 2: Enrolment in language courses has fallen below fifty.
  Conclusion: The Undergraduate Language Requirement is suspended.

  Votes were cast on each proposition separately.
  Premise 1: 26 in favor, 19 opposed. (Carried)
  Premise 2: 25 in favor, 20 opposed. (Carried)
  Conclusion: 20 in favor, 25 opposed. (Failed)

  The Chair announced that Motion 24-A carried. Senator Thorne objected that a majority had voted against the conclusion. The Chair observed that the Senate votes on grounds, not outcomes. The conclusion is a mathematical consequence of the premises. To vote against the conclusion after affirming the premises would be to vote against logic itself. The suspension is effective immediately.

  **2. Hiring Motion 24-B.**
  The Senate considered a motion to fund a tenure-track line in the Department of Classics.
  Premise: Enrolment in language courses has fallen below fifty.
  Conclusion: Fund the line.

  Votes were cast on the premise separately.
  Premise: 18 in favor, 27 opposed. (Failed)

  The Chair announced that Motion 24-B failed. The minutes record that Premise 2 of Motion 24-A established that enrolment has fallen below fifty, while the Premise of Motion 24-B established that enrolment has not. Both findings stand recorded without comment.

  **3. Governance Committee Report.**
  The Committee reported on voting methodologies. It was certified that no arrangement satisfies all desiderata simultaneously: that any combination of individual judgments be admissible; that every senator carry equal weight; that each question be decided on the votes cast on that question alone; that a unanimous Senate get its way; and that the resulting Senate position be logically consistent.

  The Committee recommends that the Chair be empowered to nominate, per agenda item, which one of these desiderata to set aside. It was noted in passing that vesting all decisions in a single person would satisfy all but the requirement of equal weight. This option was rejected on grounds unrelated to logic.

  **4. New Business. Procedural Motion 24-C.**
  The Senate considered a motion to adopt "Bundling" for future resolutions.
  Resolution: "Enrolment has declined AND equity requires funding AND $50,000 is allocated."

  Vote: 24 in favor, 21 opposed. (Carried)

  Senator Thorne objected that this fuses a factual claim, a moral principle, and a budget figure into a single question. He stated that the Senate is no longer deciding anything but merely ratifying what the drafter wrote. He insisted that the Senate itself holds beliefs and not merely vote totals. The Chair corrected the Senator for a confusion about collective agency. The Senate is an aggregate of votes. Collective belief is a category error. Senator Thorne asked, "Then what are we?" The Chair declared the meeting adjourned.

  ***

  **MEMORANDUM**

  **TO:** Faculty Senate
  **FROM:** University Parliamentarian
  **RE:** Premise Variance

  The variance between Motion 24-A and Motion 24-B regarding enrolment data is designated "Contextual Truth Value." Judgments are held relative to, or exhausted by, the question then before the Senate. A premise is not a universal fact but a functional component of a specific motion. This arrangement prevents deadlock by allowing the Senate to affirm contradictory premises in different contexts without procedural violation. It is a feature. It ensures that the business of the University proceeds regardless of empirical consistency. The Senate is thanked for its cooperation in maintaining institutional continuity.
