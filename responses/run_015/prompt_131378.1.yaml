answer: |-
  Here are eight questions designed to press the technical guts of his view without getting bogged down in history or citations. I've kept the tone conversational but sharp, with specific follow-up instructions based on how he'll likely try to dodge the bullet.

  ### 1. The CDT Smuggle
  "Let's start with the 'no-mirror constraint.' You're saying I stop modeling you modeling me after level three. But here's the worry: once I hit that wall and treat my decision as unmodeled by the predictor, aren't I effectively treating my choice as a free variable independent of the prediction? That sounds exactly like Causal Decision Theory (CDT). If I cut the recursion, I cut the correlation. So, why isn't this just CDT smuggling itself in through the back door under a fancy name?"

  *   **Follow-up:** If he says the correlation *remains* even without the modeling, hit him with this: "But if I acknowledge the correlation but act as if my choice doesn't influence the prediction past level three, **can't you distinguish rational choice from magical thinking about causation?** If I can't model the link, why am I rationally permitted to act on it?"

  ### 2. The Cliff Edge at Level Four
  "Regarding the Luring Lottery: you claim superrationality holds up to level three recursion but breaks after. What *exactly* breaks if the predictor is powerful enough to model reasoning up to level four, but not five? Is there a qualitative shift in the logic, or is it just a computational hard stop? Because if it's just a hard stop, it implies the rational move changes abruptly based on the predictor's RAM."

  *   **Follow-up:** If he argues it's about logical coherence rather than hardware, ask: "But if the logic holds at level three, why does adding one more layer of 'I think that you think...' invalidate it? **Doesn't that just push the paradox up one level** rather than solving it? Why is level three the magic number where the logic snaps?"

  ### 3. Dominance in the Prisoner's Dilemma
  "Let's talk about the one-shot Prisoner's Dilemma. Under indexed evidentialism, if I'm indexed to a rational type, my cooperation is evidence the other rational type cooperates. But defection strictly dominates cooperation in the payoff matrix. Does your view force a rational agent to always coordinate in one-shot PDs even when the math says defection pays more regardless of the other guy? Are you saying dominance reasoning is optional?"

  *   **Follow-up:** If he says "Yes, you must cooperate," press the exploitation angle: "So if I play against a CDT agent who knows my theory, they'll defect while I cooperate. I lose, they win. Does your theory recommend I make myself predictable enough to be exploited, or is there a shield against that?"

  ### 4. Moral Transparency
  "This might be a downstream consequence you haven't looked at, but it worries me. If superrationality depends on being modeled by a predictor, and your 'no-mirror' constraint depends on how transparent my reasoning is... does my moral status or blameworthiness now depend on how legible I am to outside observers? If I'm opaque, I fall outside the superrational cluster. Am I less responsible for my actions just because I'm hard to model?"

  *   **Follow-up:** If he denies that moral status changes, ask: "Then how do you adjudicate blame in a mixed population? If I'm opaque and defect, and you're transparent and cooperate, and we're in the same dilemma, are we held to different normative standards? It seems like you're creating a two-tier ethics based on cognitive transparency."

  ### 5. Falsifying the Cutoff
  "I want to know what could actually count *against* the three-level cutoff. I don't mean 'it feels intuitive,' I mean concrete evidence. Is there a specific thought experiment or payoff structure where the three-level rule gives the wrong answer compared to a four-level rule? If not, how do we know this isn't just a fixed parameter you've set to make the math work out?"

  *   **Follow-up:** If he says it's a conceptual truth rather than empirical, push: "If it's conceptual and immune to counter-examples, isn't that dogma? If I construct a scenario where level four coordination clearly yields higher utility without paradox, would you abandon the cutoff, or does the theory forbid that scenario from existing?"

  ### 6. The Index Problem
  "You call it 'Indexed Evidentialism.' Who gets the index? If I'm the only agent with this specific reasoning architecture, does the index collapse? Because if the reference class for my index is just 'me,' then evidential decision theory usually collapses back into causal decision theory. How do you define the reference class without circularity—i.e., without saying 'everyone who agrees with my theory'?"

  *   **Follow-up:** If he says "all rational agents," ask: "But we just established CDT agents are rational on your view, they just use a different recursion depth. So am I indexed to them? If I cooperate and they defect, the evidence is bad for me. Why should I index myself to agents who don't index themselves to me?"

  ### 7. Platonia Coordination Failure
  "In the Platonia Dilemma, the goal is for exactly one person to apply. Standard superrationality suggests randomizing with a specific probability. But if different agents have different recursion cutoffs—some stop at level two, some at level three—their calculated probabilities for applying will differ. Doesn't your view guarantee coordination failure in Platonia because we can't all agree on the recursion depth? How do we sync our cutoffs?"

  *   **Follow-up:** If he suggests we should assume a common cutoff, ask: "But that requires me to model them modeling me to agree on the cutoff, which triggers the very recursion you're trying to limit. Aren't you requiring a level of modeling to agree on the rules that your rules forbid?"

  ### 8. Self-Knowledge and Agency
  "Finally, the 'no-mirror constraint' limits self-prediction. If I can't model the predictor modeling me, can I fully model my own choice? It seems like your view requires a blind spot in self-knowledge. I have to choose without fully understanding why I chose, because understanding why would require traversing the recursion you banned. Is rational agency compatible with not knowing the full causal story of your own decision?"

  *   **Follow-up:** If he says "Yes, that's fine," press: "So I'm rationally required to act on a mechanism I'm forbidden from fully inspecting? That sounds like I'm not an agent anymore, I'm just a component in the predictor's simulation. Where does the 'decision' part of decision theory happen if I can't look at the gears?"
