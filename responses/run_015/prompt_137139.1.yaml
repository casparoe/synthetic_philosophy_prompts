      6.  *(Implicit in prompt)*: The 40th attempt item lost in rollback.

  5.  **Drafting the Residue Report:**
      *   *Survives Unchanged:* Technical consistency (ACID properties), measurability of harm (time lost, money spent).
      *   *Survives with Semantic Shift:* "Existence." In tech, existence = `SELECT * FROM items WHERE id = X`. In philosophy, existence = "has causal power."
      *   *Inexpressible:* "Authority." Why is *my* DB authoritative and the private server's DB not? The tech stack assumes authority; it doesn't explain it. "Value." The tech sees `int gold`; the player sees "40 hours of effort."

  6.  **Developing the Verdict:**
      *   The technical framework treats authority as a *configuration* (I own the keys, therefore I am truth).
      *   The philosophical problem treats authority as a *social contract* (Players agree to treat this DB as truth).
      *   The "Residue" is the *Social Contract*. The tech stack cannot model the agreement that makes the tech stack matter.
      *   The disagreement among philosophers is often about where to draw the boundary of the "system." The engineer draws it at the firewall. The realist draws it at the social agreement.
      *   *Conclusion:* It's not just verbal. The tech framework has a blind spot: it cannot model *legitimacy*, only *consistency*.

  7.  **Refining the Tone:**
      *   Respectful, precise, avoiding condescension.
      *   Use the user's jargon correctly (shards, replication lag, event sourcing, determinism).
