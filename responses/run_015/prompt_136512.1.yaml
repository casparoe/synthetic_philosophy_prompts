  Subject: Fall Workshop Pitch: Carnap, Planning, and the Tolerance Trap

  Hey [Name],

  Here's the draft for the fall slot. I've kept it tight—no bibliography, no fluff. The idea is to move past the standard "Carnap was purely a logician" reading and test whether his principle of tolerance can actually carry weight in political economy without collapsing.

  **Title:** Frameworks of Justice: Testing Carnap's Tolerance in Political Planning

  **The Core Idea**
  We usually teach Carnap's principle of tolerance as a rule for logic and language: if you want to use a different linguistic framework, go ahead, provided it's consistent. The standard reading suggests this stops at the water's edge of politics. Carnap gets filed away as a logical empiricist with no real political philosophy, or at best, someone who thought politics was just engineering.

  But there are scattered remarks in his later work on social planning and value pluralism that suggest he saw a continuity between choosing a linguistic framework and choosing a social structure. I want to pull on this thread. If we treat political-economic systems as "frameworks" in the Carnapian sense, does the principle of tolerance hold? Or does applying it to large-scale planning expose a fatal inconsistency in his view?

  **The Precise Question**
  The workshop centers on one specific problem: Does extending Carnap's framework-choice model from linguistic contexts to political-economic planning frameworks commit him—perhaps inconsistently—to either a radical relativism about justice or a hidden technocratic criterion?

  If all frameworks are equally valid provided they are internally consistent, then a fascist economic plan and a socialist one are just different choices of language games, provided they work. That looks like relativism. But Carnap clearly thought some choices were "better" based on efficiency or fruitfulness. If he appeals to efficiency to judge political frameworks, isn't he smuggling in a substantive value judgment that violates tolerance? That looks like technocracy. I want to pin down whether there is a coherent middle path, or if the model breaks down when stakes move from syntax to distribution.

  **Why the Usual Reading Leaves a Gap**
  The "no politics" reading is too convenient. It isolates his logic from his broader pragmatism. By ignoring his remarks on planning, we miss the chance to see where logical empiricism hits its limit. If Carnap really thought the principle of tolerance was a general ethical stance toward inquiry, it should apply to social inquiry too. If it doesn't, we need to know why. This isn't about rehabilitating Carnap as a political theorist; it's about using his framework to test the limits of pluralism itself.

  **Methodology**
  For a single semester, I don't want to get bogged down in exegesis alone, and I certainly don't want to pretend I'm an economist. The method is a close comparison of two things:

  1.  **Textual Analysis:** We'll look at the arguments in *Empiricism, Semantics, and Ontology* regarding external questions and framework choice.
  2.  **Concrete Case Study:** We'll map those arguments onto a specific planning debate: Participatory Budgeting versus Centralized Allocation.

  This works because both sides claim a different "framework" for deciding value. Participatory budgeting treats value as emergent from local linguistic communities. Centralized allocation treats value as calculable from a unified metric. We won't evaluate which is economically superior. Instead, we'll analyze whether a Carnapian can coherently choose between them without violating tolerance or relying on a hidden normative premise. This keeps the scope philosophical while grounding it in a real-world decision structure.

  **Feasibility and Scope**
  This is designed for a workshop, not a monograph. We aren't solving justice. We are testing a specific mechanism (framework choice) in a new environment (political planning). The reading load is manageable: core Carnap texts on tolerance, plus secondary literature on his pragmatism, paired with philosophical summaries of the planning debate. We avoid technical economic modeling entirely.

  **Success vs. Failure**
  I want to be honest about what counts as a win here.

  *   **Success:** We demonstrate exactly where the analogy breaks. If we can show that Carnapian tolerance works for logic but requires a non-Carnapian value theory to function in politics, that's a result. It clarifies the boundary between logical pluralism and political normativity.
  *   **Failure:** The only real failure would be forcing a synthesis that isn't there—pretending Carnap has a ready-made answer for political justice when he doesn't. If we end up saying "Carnap solves political disagreement," I've oversold the idea.

  The goal is to leave the workshop with a clearer map of the tension, even if that map shows a dead end.

  Let me know if this fits the vibe for fall. I think it's sharp enough to get people talking without requiring everyone to be a Carnap specialist.

  Best,

  [My Name]
