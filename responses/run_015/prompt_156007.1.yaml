          *   *Hume's Likely View:* He was skeptical of instruments (telescopes, etc.) if they contradicted common sense without calibration. He would likely view this as *highly refined second-hand report*. The "chain of testimony" is just longer (Observer -> Camera -> Codec -> Server -> Screen -> Viewer).
          *   *The "Synthetic" Aspect:* The correlation of error is key. Hume worried about "conspiracy" or "shared enthusiasm." Digital manipulation is a technological form of shared delusion/conspiracy.

      *   *Probabilistic Balance:*
          *   Hume argues uniform experience constitutes a "proof" against miracles.
          *   To overturn a proof, you need a counter-proof.
          *   Does synthetic corroboration provide a counter-proof?
          *   *The Tension:* If the error is systematic (adversarial), the *number* of witnesses doesn't increase the probability linearly. Hume understood that 100 liars in a conspiracy aren't better than 1 liar. He would recognize that digital infrastructure creates a single point of failure (the code/algorithm) that masquerades as independent verification.

      *   *Skepticism vs. Reformulation:*
