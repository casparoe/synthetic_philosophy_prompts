  - Can you show me whether there's any distribution with a finite expected value for the smaller amount where (1) still holds for every amount you could see? I suspect there isn't, and if that's right it means my setup has to have infinite expectation for the argument even to get started — which feels like it ought to be the key to everything, but I can't quite turn it into a diagnosis.
  - What's the cheapest thing to give up, and what do you pay for it? If (2) goes, do I lose conditional-dominance reasoning in the ordinary finite cases where I actually want to use it, or does the principle survive there and only break here? Is the alternative to refuse to model choice problems with unbounded expectation at all — and if so, is that solving the case or just banning it?
