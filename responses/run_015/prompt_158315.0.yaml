  (2) If switching has higher conditional expected value than keeping under every observation you might make, then you should switch.

  (3) So I should switch whatever I see.

  (4) If I should switch whatever I see, then peeking did no work: I should switch before looking as well, and by the same dominance reasoning I should even pay some fee for the privilege of swapping.

  (5) But switching before looking just means taking the other envelope, and the two are perfectly symmetric — there's no feature of the one in my hand that makes it the worse bet. And once I've switched, the argument runs again from scratch, so I switch back, and again, paying every time.

  (6) No decision theory worth having tells you to pay money to trade places with yourself forever.

  (7) So (2) is false, and with it (3).

