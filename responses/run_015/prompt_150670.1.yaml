      *   *Weak Point:* Braudel was a product of his time (mid-20th century). He might be more adaptable to technology than this reconstruction allows. He was a prisoner-of-war who wrote from memory; he valued the mental construction of history. But maybe he'd embrace the "total history" aspect of Big Data more enthusiastically. The weak point is assuming his rigidity regarding the "event."

