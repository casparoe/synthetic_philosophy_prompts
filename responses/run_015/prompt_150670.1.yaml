  2.  **Deconstruct Braudel's Historiography:**
      *   *The Mediterranean and the Mediterranean World in the Age of Philip II* is the key text.
      *   **Tripartite Schema:**
          1.  *Longue durée:* Geography, climate, slow structural change, man's relation to the environment. Almost immobile history.
          2.  *Conjonctures:* Economic cycles, social trends, demographic shifts. Decadal or centennial rhythms.
          3.  *Événements:* Political history, battles, treaties, individual actions. "Surface disturbances," "foam on the waves."
      *   **Core Philosophy:** History is not just about what happens (events); it's about the underlying structures that make things happen. Events are ephemeral and often misleading. True understanding comes from descending to the deeper levels.
