answer: |-
  Translating these claims into evolutionary biology requires precision regarding developmental systems and selective regimes. Here is the claim-by-claim restatement.

  1 (Mencius). This posits a species-typical reaction norm biased towards prosociality. The four sprouts are canalised developmental pathways requiring specific environmental inputs to reach maturity, rather than preformed traits.
  2 (Mencius). This describes an immediate, non-instrumental altruistic response. It functions as an exaptation, bypassing immediate fitness calculations regarding kin or reputation, suggesting a hardwired motivational structure.
  3 (Mencius). Phenotypic degradation results from environmental stress, not genetic absence. The genotype retains plasticity to recover given niche restoration, implying high canalisation potential against environmental noise.
  4 (Mencius). Moral cognition shares a conserved architecture across the population, yielding convergent phenotypes akin to sensory universals. This implies a normative baseline rooted in biology, not merely cultural agreement.
  5 (Xunzi). The unmodified developmental phenotype maximises short-term desire satisfaction, leading to inter-individual conflict and reduced group fitness. Regulation requires external constraint to prevent a tragedy of the commons.
  6 (Xunzi). Virtue is cumulative cultural inheritance regulating resource distribution. The cognitive capacity for uptake is universal, though phenotypic realisation varies based on effort and environment, consistent with gene–culture coevolution.

  Claims 3, 5, and 6 survive translation cleanly. They describe developmental systems and resource competition without invoking intrinsic value. Claims 1, 2, and 4 are distorted. They smuggle in normativity. Biology describes *what is*; Mencius describes *what ought to be grown*. The concept of "virtue" implies a telos that evolutionary theory lacks. The loss here is the normative force; the smuggled assumption is that biological convergence implies moral truth.

  Regarding the word "good": Claims 1–4 support a perfectionist reading rather than an empirical one. Mencius argues for the flourishing of a kind, not merely reproductive success. The cost is significant: biology cannot validate perfectionist claims, only describe the mechanisms of flourishing. If "good" means "adaptive", Mencius is empirically vulnerable to counter-examples of selfish success. If "good" means "flourishing", he is making a philosophical claim biology cannot touch. My framework lacks a vocabulary for teleological flourishing distinct from fitness.

  Regarding the boundary: Niche construction dissolves the dispute. Xunzi treats culture as external artifice (*wei*); Mencius treats it as internal unfolding (*xing*). Developmental Systems Theory says the organism *includes* its niche. The line is arbitrary. This dissolution is a success, not a failure. It shows the dispute was categorical, not empirical.
  Reverse translation: "*Xing* is the plastic reaction norm; *wei* is the constructed niche." Xunzi would own this (emphasis on external regulation), but Mencius would accept the plasticity. Xunzi is more right about the necessity of external structure to prevent disorder.
  Yang Xiong's view that nature is a mixture maps comfortably to polygenic traits with variable expression. This suggests the original dispute was partly terminological regarding the definition of 'nature'. If nature includes potentiality, Mencius is right; if it includes only raw impulse, Xunzi is right. My vocabulary suggests both were partially correct but talking past one another regarding the boundary of the developmental system.

