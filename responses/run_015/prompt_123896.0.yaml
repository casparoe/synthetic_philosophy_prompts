  This procedure validates causal plausibility in low-divergence fiction but refuses to judge moral worth or commercial viability.

  1. **Inevitability Test:** Distinguish between an outcome that happened because many paths led there versus one that happened because only one path existed. If removing your change only delays the outcome via a different route, the outcome is overdetermined. [STOP] if you cannot show a new destination.
  2. **Cancellation Ledger:** List facts negated by your change, such as later events, works, or institutions. [STOP] if the list exceeds ten major events or erases a core setting element required for your plot.
  3. **Latency Check:** Measure time from change to first noticeable difference. [CONSULT] if latency exceeds twenty years; you need proof the change survived unnoticed within existing structures.
  4. **Reconvergence Rule:** Ask if structural forces push history back to the actual course. [EDITOR] if you choose to fight this drift; you must dramatize the resistance rather than ignore it.
  5. **Hindsight Contraband:** Scan character reasoning for knowledge of trends invisible at the time. [STOP] if characters act on future historical consensus rather than contemporary uncertainty.
  6. **Bias Audit:** Ask if you want this divergence because it feels satisfying rather than plausible. [EDITOR] if desire overrides scrutiny; declare this a moral argument, not a simulation.
  7. **Factual Viability:** Verify the divergence mechanism itself is physically and legally possible. [CONSULT] for all mechanical details of the change to ensure it could happen.
  8. **Narrative Cost:** Weigh the complexity of the new timeline against story clarity. [EDITOR] if the explanation requires more than one scene to establish without boring the reader.

  **1814 Congress:** Step 1 passes (political will was fragile); Step 2 warns (Napoleonic Wars legacy remains); Step 4 flags reconvergence (balance of power likely returns). Verdict: Plausible but requires dramatizing sustained chaos to justify no concert.
  **No 1918 Flu:** Step 1 fails (biological overdetermination; viruses mutate regardless); Step 2 ledger is massive (demographics shift globally); Step 3 latency is zero but cause is global. Verdict: [STOP] for low-divergence; too many cancellations and biologically implausible to prevent entirely.
  **1770s Slave Trade:** Step 1 passes (legal contingency); Step 2 ledger huge (economic structures dependent on trade); Step 5 high risk (hindsight morality); Step 6 bias alert (moral satisfaction). Verdict: [EDITOR] decision on whether to accept economic implausibility for moral argument; requires [CONSULT] on legal precedent.

  This tool cannot measure emotional truth or guarantee reader acceptance. I have collapsed the distinction between epistemic and ontological possibility to save you from metaphysics, treating all possibility as narrative utility.
