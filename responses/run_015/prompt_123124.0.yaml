answer: |-
  1. For dating an end to make sense, a society must be defined as a specific political or elite project rather than a continuous population. The practice tracks the repertoire reading, marking the loss of state capacities like writing and monumental building rather than mere demographic decline.

  2. The practice strictly presupposes the repertoire reading, because assigning a fall date while insisting nothing really ended creates a logical contradiction in terms. There is no coherent way to keep assigning fall dates while holding that nothing really ended, as the concept of fall requires a categorical break.

  3. The inconsistency is real, but one theory can license both labels if the deciding variable is whether the successor population is one we happen to have a separate name for. Collapse language marks the disappearance of a specific elite label, while continuity language applies when the same people persist under a different political description.

  4. On this theory, the Kesh polity counts as a collapse because the defining repertoire of state capacities and elite structure was extinguished within the three generations. The later cultural persistence is irrelevant to the termination date, which tracks the loss of political infrastructure rather than ethnic or linguistic survival.

  5. The fall date would be replaced by a transitional range describing the gradual redistribution of political capacity rather than a single year. We would lose the dramatic narrative hook of moral failure, and visitors could no longer be told a simple story where complex history is resolved into a definitive end.
