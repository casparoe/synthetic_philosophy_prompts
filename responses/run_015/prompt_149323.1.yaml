answer: |-
  This is one of the sharpest objections to Buddhist metaphysics, effectively applying a modern analytic philosophy of mind problem (fission) to an ancient soteriological framework. Here is the conceptual breakdown of how *anatta* attempts to resolve the tension between continuity and non-substance, and specifically how it handles the fission case without smuggling in a self.

  ### 1. Stream vs. Discrete Moments: Dissolving the Tension
  You identified a tension between the "stream" (functional continuity) and "discrete moments" (radical impermanence). In Buddhist conceptual mechanics, this is not an ontological contradiction but a distinction between **conventional truth** (*samvrti-satya*) and **ultimate truth** (*paramartha-satya*).

  *   **The Discrete View (Ultimate):** Reality consists of momentary events (*dharmas*) arising and ceasing. There is no "thread" connecting them, only causation. Moment $A$ ceases, but in ceasing, it provides the necessary condition for Moment $B$ to arise.
  *   **The Stream View (Conventional):** We label the causal sequence $A \to B \to C$ as a "person" or "stream" (*santana*) because it exhibits functional coherence.

  **The Resolution:** The "stream" does not exist *over and above* the moments. It is not a container holding the moments; it is the pattern of their causal dependency. Think of a flame moving across a row of candles. The flame at $t_1$ is not the *same substance* as the flame at $t_2$, but $t_2$ is causally dependent on $t_1$. There is no tension here because the "stream" is just a shorthand for "causal dependency without substance."

  ### 2. The Fission Problem: Who Owns the Karma?
  This is the critical hurdle. If Person $A$ splits into Person $B$ and Person $C$ (perhaps via a sci-fi teletransporter or a metaphysical split in the rebirth continuum), and $A$ committed a grave moral act, who suffers the karmic fruit?

  If you say "both," it seems unfair (punishing two for one). If you say "one," you need a criterion for identity (which implies a self). If you say "neither," you break karma.

  Here is how *anatta* navigates this without a substrate:

  **A. Reject the Premise of "Ownership"**
  The question "Which stream *owns* the karma?" presupposes that karma is a property attached to an entity (like a debt attached to a bank account). In *anatta* mechanics, karma is not a debt; it is a **causal seed** (*vasana*).
  *   $A$'s action plants a causal potential.
  *   For that potential to ripen into suffering, specific conditions must be met in the future.
  *   There is no "owner" of the suffering, only the arising of suffering in dependence on conditions.

  **B. Causal Branching, Not Identity Splitting**
  In a fission scenario, *anatta* argues that numerical identity was never the metric for moral responsibility; **causal continuity** is.
  *   If the mental stream of $A$ causally branches into $B$ and $C$, then both $B$ and $C$ stand in the relation of "causal successor" to $A$.
  *   Since there is no self, there is no "one person" who needs to be singled out. There are simply two new clusters of aggregates that have inherited the causal seeds of $A$.
  *   **The Mechanism:** If the karmic seed requires a specific psychological or physical configuration to ripen, it will ripen in whichever stream possesses those conditions. If both streams possess the conditions (because they both inherited $A$'s psychological traits), the karmic potential can ripen in both.

  **C. Avoiding the "Smuggled Self"**
  Does saying "both inherit" secretly assume a self? No, provided we maintain that $B$ and $C$ are distinct causal streams.
  *   $B$ experiences suffering. $C$ experiences suffering.
  *   They do not share a *subject* of experience. $B$ does not feel $C$'s pain.
  *   The "injustice" of two people suffering for one person's act only arises if you assume there is a metaphysical limit on how many causal chains a single action can influence. But in a universe of dependent arising, one cause can have multiple effects (like one stone causing two ripples).
  *   Because there is no self, there is no violation of "one self, one fate." There is only "one cause, multiple effects."

  **D. Avoiding the "Collapse"**
  Does this collapse the distinction between $B$ and $C$? No.
  *   $B$ and $C$ are distinct because their causal trajectories diverge immediately after fission.
  *   They are not "the same person." They are two distinct continuums that share a common causal ancestry.
  *   Buddhist ethics doesn't require a *unique* heir for karma; it requires a *causal link*. As long as the link exists, the moral weight is transmitted. The "weight" is just the inevitable arising of unpleasant experience given the prior volitional action.

  ### 3. Summary of the Conceptual Move
  The Western intuition is: **Responsibility requires Identity.** (Only the *same* person who acted should suffer).
  The Buddhist intuition is: **Suffering requires Causality.** (Wherever the conditions for suffering exist, suffering arises).

  In fission, *anatta* bites the bullet: If the causal conditions for karmic ripening exist in two streams, suffering arises in two streams. This isn't a moral failure of the system; it's a description of how causality works in a selfless universe. The "horror" of fission is an artifact of clinging to the idea that there *should* be a single "me" to track. If you drop the "me," the branching of causal consequences is no more problematic than a single tree branch splitting into two.

  ***

  ### Confidence and Limitations

  **Confidence Level:** High (85%)
  I am confident in this explanation regarding the internal logic of *anatta* and the standard philosophical defenses used by Buddhist metaphysicians (specifically drawing on the reductionist/abhidharmic framework). The distinction between "ownership" and "causal conditionality" is the standard move to defuse the fission objection.

  **Least Certain Part:** The Specifics of Fission Mechanics
  I am least certain about how traditional Buddhist cosmology would empirically model the fission event itself. Traditional texts generally assume a linear, one-to-one mapping between death consciousness and rebirth consciousness (*cuti-citta* to *patisandhi-citta*).
  *   **The Uncertainty:** A strict Abhidharmic realist might argue that fission of a karmic stream is **causally impossible** under the laws of karma, much like perpetual motion is impossible under physics. They might claim the hypothetical is incoherent because the karmic energy (*sankhara*) is singular and indivisible at the moment of transition, forcing a single trajectory.
  *   **Why I didn't lead with this:** Dismissing the hypothetical as "impossible" feels like a dodge in a Philosophy of Mind context. The "Causal Branching" explanation (above) is the more robust *philosophical* answer, even if it stretches traditional *cosmological* models. I prioritized the conceptual logic over the doctrinal cosmology.
