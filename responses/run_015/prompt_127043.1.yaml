      *   *Section 1: Ontological Commitments (Essentialism).* Discuss how "Society" is reified. The "State" is treated as the "Soul" of the society.
      *   *Section 2: Normative Loading.* Discuss "Collapse" as a pejorative. Complexity = Good. Discuss the Tainter influence. Can it be neutral? Yes, but "Collapse" is selected for impact.
