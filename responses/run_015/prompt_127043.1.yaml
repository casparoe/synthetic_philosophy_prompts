answer: |-
  The institutional practice of grouping the Late Bronze Age, Classic Maya, and Rapa Nui into a taxonomy of "collapse," while categorizing Postclassic Maya or Post-Bronze Age Levantine communities as "transformed," reveals a specific set of ontological and normative commitments regarding social identity. This asymmetry is not merely a matter of archaeological semantics; it is a philosophical stance on what constitutes the *life* of a society and what constitutes its *death*.

  ### 1. Ontological Commitments: Structural Essentialism
  The primary philosophical commitment presupposed by this labeling practice is a form of **Structural Essentialism**. This view posits that a society's identity is not grounded in its population, its cultural memory, or its biological continuity, but rather in specific institutional superstructures: the palace, the bureaucracy, the monument, or the writing system.

  Under this ontology, the "Society" is reified as a discrete object analogous to an organism. Just as a biological organism dies when its vital organs cease functioning, a "Society" is deemed to have collapsed when its "vital organs" (state apparatus, elite redistribution networks) cease functioning.
  *   **The Essential Form:** The practice assumes that for the Classic Maya, the *essence* of "Maya Society" was the Divine Kingship and the stelae-recording complex. When those disappeared, the society "died," even though Maya people, languages, and traditions persisted into the Postclassic.
  *   **The Metamorphosis Exclusion:** By contrast, labeling Postclassic polities as "transformed" acknowledges continuity of the *people* but implicitly denies the continuity of the *Society* (capital S). The asymmetry suggests that a society cannot survive the loss of its complexity. If the structure simplifies, the entity is considered to have ceased existing, replaced by a new, lesser, or different entity.

  This presupposes that social identity is **top-down**. The identity of the whole is determined by the status of the apex. If the apex falls, the whole is declared dead, rendering the survival of the base (the peasantry, the rural communities) ontologically secondary or irrelevant to the status of the "Society."

  ### 2. Normative Loading: Teleology and Complexity
  The framing embeds a robust **Normative Teleology**. "Collapse" is not a neutral descriptor like "phase transition" or "reorganization"; it is a pejorative term implying failure, pathology, or deviation from a proper trajectory.
  *   **Complexity as the Good:** The normative standard against which these societies are measured is *complexity* (energy capture, information processing, hierarchical depth). This draws implicitly on theories like Joseph Tainter's, where complexity is the expected trajectory of successful societies. Therefore, a reduction in complexity is viewed as a regression or a failure to sustain a achieved state.
  *   **The Warning Function:** In policy and pedagogy, "collapse" serves a rhetorical function. It is used to warn modern states against unsustainability. For the warning to work, the past event must be framed as a *failure* to be avoided, not a *strategy* that was adopted. If the Bronze Age fragmentation is described as a successful adaptation to lower energy availability (a "value-neutral reorganization"), it loses its potency as a cautionary tale for modern industrial civilization.
  *   **Welfare vs. Structure:** The prompt asks if failure-language could be reserved for declines in human welfare. Currently, it is not. A "collapse" is declared based on the disappearance of elites and monuments, even if archaeological bio-data suggests the common population suffered less stress without the palace economy (e.g., better nutrition, less warfare). The normative judgment privileges *systemic persistence* over *human well-being*.

  ### 3. Reconstructed Implicit Theory: "Elite-Structural Continuity"
  To render the canonical trio coherent while excluding the "transformed" cases, we can reconstruct the implicit theory governing this practice as **Elite-Structural Continuity Theory**. Its axioms are:

  1.  **Identity Axiom:** A society is identical to its highest-order organizational structure (State/Empire).
  2.  **Continuity Axiom:** Diachronic identity (persistence through time) requires the maintenance of that specific organizational structure.
  3.  **Value Axiom:** The maintenance of high-complexity structures is the telos (goal) of social development; deviation from this is a negative value (collapse).
  4.  **Differentiation Axiom:** Cases where the population persists but the structure vanishes (Postclassic Maya) are categorized differently only if a *new* structural identity can be narrated (e.g., "Postclassic" implies a new era). However, in the "Canonical Trio," the narrative emphasis is placed on the *loss* of the previous structure rather than the *gain* of the new one.

  This theory makes the "Canonical Trio" coherent because in all three cases (Bronze Age, Classic Maya, Rapa Nui), the *visible archaeological signature* of the elite structure vanishes abruptly. The theory requires the exclusion of reorganized societies from the "collapse" category only if the narrative focus shifts to the *survivors*. However, the practice is inconsistent: Postclassic Maya are often taught as the "aftermath" of Collapse, implying the *Classic* society died, while the *Maya people* survived. The label "Collapse" applies to the *Structure*, not the *People*, but the rhetoric often conflates the two to maximize emotional impact.

  ### 4. Philosophical Underdetermination
  Is this theory strictly required? **No.** The practice is philosophically underdetermined. The data of archaeology (pottery styles, settlement patterns, DNA, isotopes) does not dictate the label "collapse."
  *   **Rival Accounts:**
      *   **Demographic Continuity:** If identity is tied to population genetics and continuity, none of these cases are "collapses" in the sense of extinction.
      *   **Cultural Resilience:** If identity is tied to language, ritual, or kinship, the "Collapse" narrative obscures profound continuity (e.g., Hebrew culture emerging from Bronze Age fragmentation; Maya culture persisting into the Contact period).
      *   **Functionalist Adaptation:** A functionalist view might argue that if a society reduces its energy budget to match environmental carrying capacity (as arguably happened on Rapa Nui or in the Greek Dark Ages), it has *succeeded* in stabilizing, not failed.
  *   **Narrative Choice:** The selection of "Collapse" over "Reorganization" is a curatorial and rhetorical choice. It is compatible with rival accounts only if one admits that "Society" is a flexible concept. The current institutional practice rigidly selects the Essentialist/Elite account because it serves specific modern needs (urgency in environmental policy, dramatic narratives in museums). It is not a logical necessity derived from the material record.

  ### 5. Shifts in Curatorial Practice and Policy Rhetoric
  If we adopted a view of social identity that treated radical institutional discontinuity as compatible with societal persistence (a **Processual or Relational Ontology**), the following shifts would be necessary:

  **A. Curatorial and Pedagogical Shifts:**
  *   **From "Mystery" to "Transition":** Museum exhibits would stop framing the end of the Bronze Age or Classic Maya as a "mystery of disappearance." Instead, they would highlight the *emergence* of new forms (e.g., "The End of Palaces and the Rise of Villages").
  *   **Focus on the Base:** Narratives would shift from the fate of the King/Elite to the fate of the household. Did the farmers survive? Did the technology persist?
  *   **De-exoticizing Rapa Nui:** The Rapa Nui narrative would shift from "Ecocidal Suicide" to "Resilient Adaptation," acknowledging that Rapa Nui society persisted through the contact period despite external shocks, challenging the "self-inflicted collapse" trope.

  **B. Policy and Sustainability Rhetoric:**
  *   **From "Avoiding Collapse" to "Managing Transition":** Policy briefs would stop using "collapse" as the singular negative outcome to be avoided at all costs. Instead, they would frame societal change as inevitable and focus on *equitable transformation*.
  *   **Redefining Resilience:** Resilience would not mean "maintaining current complexity/institutions" (engineering resilience) but "the capacity to reorganize while retaining function" (ecological resilience).
  *   **Decoupling Welfare from Complexity:** Sustainability metrics would prioritize human well-being and ecological balance over the maintenance of GDP or bureaucratic scale. A "smaller" society would not be framed as a "failed" one.

  **C. Ethical Reframing:**
  *   **Agency of the Past:** It would acknowledge that people in the past made choices to *abandon* monumentality or state structures, perhaps consciously rejecting the burdens of complexity. This restores agency to ancient populations, portraying them not as victims of a system they couldn't sustain, but as actors who navigated change.

  ### Conclusion
  The asymmetrical labeling of "collapse" versus "transformation" presupposes an **Elite-Structural Essentialism** that equates the death of a state with the death of a society. It embeds a **Normative Teleology** that views complexity as the inherent good and simplification as failure. This framework is not logically necessitated by the archaeological record but is a rhetorical tool selected for its pedagogical and policy utility. Adopting a philosophy of **Social Metamorphosis** would require dismantling the "Collapse" industry, shifting focus from the fragility of institutions to the continuity of communities, and reframing sustainability not as the preservation of the status quo, but as the capacity for equitable adaptation.
