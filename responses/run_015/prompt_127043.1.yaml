      *   *Conclusion:* Summarize the shift from "Death" to "Metamorphosis."

  8.  **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address Rapa Nui specifically? The prompt mentions it. Recent scholarship actually challenges the "ecocide" narrative of Rapa Nui. I should mention that the "Canonical Trio" itself is scientifically contested, which strengthens the "underdetermined" argument.
      *   *Check:* Did I address the "Postclassic Maya" contrast? Yes, need to emphasize that *cultural* continuity is ignored in the "Collapse" narrative in favor of *structural* discontinuity.
      *   *Nuance:* Ensure I distinguish between *descriptive* (what happened) and *normative* (how we judge it).
      *   *Philosophical Terminology:* Use terms like *reification*, *teleology*, *essentialism*, *diachronic identity*.

  9.  **Final Polish:** Check tone (academic, analytical, rigorous). Ensure all parts of the prompt are answered sequentially. (The prompt asks to: 1. Identify commitments, 2. Address normative loading, 3. Reconstruct implicit theory, 4. Determine underdetermination, 5. Indicate shifts in practice.)

      *   *Plan:*
          1.  **Ontological Essentialism:** The "State" as the "Self."
          2.  **Normative Teleology:** Complexity as the Good.
          3.  **Reconstructed Theory:** "Structural-Elitist Continuity."
          4.  **Underdetermination:** It's a narrative choice, not a logical necessity.
          5.  **Practical Implications:** Curatorial and Policy shifts.

      *(Self-Correction on Rapa Nui)*: I must be careful. The prompt treats Rapa Nui as part of the "Canonical Trio" of collapse. I should analyze the *practice* of grouping them, even if recent archaeology disputes the Rapa Nui collapse narrative. The prompt asks about the *pedagogical/policy practice*, not necessarily the archaeological truth. I will note the contestation as evidence of underdetermination.

      *(Self-Correction on Maya)*: The distinction between Classic (collapse) and Postclassic (continuity) is key. Why is one collapse and the other transformation? Because the *Classic* identity is tied to the Divine Kingship. When that ends, "Classic Maya" is dead. But "Maya" lives on. The label depends on how narrowly we define the subject.

