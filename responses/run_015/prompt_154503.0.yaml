answer: |-
  Good evening. For those who don't know me, I'm a colleague of Dr. Miriam Chen's, and like many of you, I have spent the last few weeks trying to summarize forty years of work into a few minutes of speech. It is a difficult optimization problem. But given the company here tonight—half the room could model this problem using stochastic dynamics, and the other half includes the people who actually fund those models—I realized we need a framework that speaks to both.

  So, I want to talk about Miriam's career through the lens of the Centipede Game.

  For the family and students in the room: Imagine two players sitting at a table with a pot of money. They take turns. At each turn, a player can either "take" the pot for themselves, ending the game, or "pass," which adds more money to the pot and hands the turn to the other player. If both keep passing, the pot grows enormous. But if anyone takes, the game stops, and the other person gets nothing.

  For the economists and philosophers here: You know the logic. If the game has a fixed, known endpoint, backward induction dictates that the second player will take at the final node. Knowing this, the first player takes at the penultimate node. This unraveling continues all the way back to the start. Under common knowledge of rationality, cooperation should collapse immediately. No one should pass.

  Miriam's career was a forty-year sequence of "passes." She built joint programs between departments that historically hoarded resources. She created shared governance structures where any single dean could have vetoed the plan to capture a budget surplus. She designed cross-departmental grants where any partner could have defected to secure a safer, solitary payoff. By all standard accounts, the game should have unraveled at the first node. The institutions should never have survived the first proposal.

  Now, usually, when people explain this kind of success, they talk about "trust." They say Miriam was just a wonderful person who inspired goodwill. But I know Miriam too well to offer her that compliment, and the game theorists in the front row are already reaching for their antacids. Trust does not solve backward induction. If the payoff structure remains fixed, trust is just noise.

  Miriam did not solve the paradox by being irrational. She solved it by being an architect.

  She understood that backward induction only holds if the decision tree is fixed and the endpoint is exogenous. Miriam never played on a fixed tree. Every time she secured a cooperative step—a new joint hire, a shared lab, a curriculum overlap—she didn't just move the token to the next node. She reshaped the payoff structure for the round after that.

  She made the cost of defection higher and the reward for continued cooperation larger than the standard model allows. She endogenized the endpoint. In her institutions, the game only ended if someone chose to stop building. As long as the structure grew, the horizon moved. You cannot unravel a game backward from the end if the end is contingent on the success of the previous steps. She didn't ignore rationality; she redesigned the incentives so that the rational move at every single node was to keep building.

  This is why we cannot simply say she was "generous." Generosity implies a sacrifice of payoff. Miriam engineered situations where cooperation was the dominant strategy. She didn't ask colleagues to be less rational; she made sure that being rational required being collaborative.

  So, as we look at the legacy she leaves behind—the institutes, the programs, the generations of students who never had to choose between disciplines—we are not looking at a completed game. We are looking at a decision tree that is still growing.

  Miriam, you taught us that the only way to win the centipede game is to ensure there is no final node where it makes sense to stop. You turned a finite sequence of transactions into an infinite horizon of collaboration.

  Please raise your glasses. To Dr. Miriam Chen: may the payoff structure you built continue to reshape the tree long after we have left the table. To Miriam.
