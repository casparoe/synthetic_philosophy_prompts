answer: |-
  ### Essay Question

  **Course:** PHIL 450 – Metaphysics & The Arts
  **Exam:** Final Take-Home Essay
  **Time Allowed:** 75 Minutes
  **Word Limit:** 800–1,000 words

  **Prompt:**

  The Board of Trustees for the Metropolitan Museum of Modern Art is debating the acquisition of *Echo-7*, an image generated by an algorithm without direct human prompt intervention, which nonetheless elicits profound aesthetic experiences in viewers. Three trustees offer competing frameworks for the decision:

  1.  **The Functionalist:** Argues *Echo-7* is art because it fulfills the functional role of art (producing aesthetic experience), regardless of origin.
  2.  **The Intentionalist:** Argues *Echo-7* is not art because it lacks human authorial intent, which is a necessary condition for art-status.
  3.  **The Deflationist:** Argues the dispute is merely verbal. "Art" is a family-resemblance concept with no hidden essence; the trustees are simply talking past one another using different semantic criteria.

  Write an essay that addresses the following three points:

  1.  **Diagnosis:** Diagnose the dispute. Is it genuinely verbal (as the Deflationist claims), ontologically substantive, or pragmatically encroached? Explain why the surface-level semantic disagreement does or does not mask a deeper conflict.
  2.  **Conceptual Engineering:** Evaluate the proposal that the Museum should adopt a precise, engineered definition of "art" to resolve the deadlock. Does this resolve the conflict, or does it merely relocate the disagreement into a normative debate about acquisition criteria?
  3.  **Metaontological Authority:** Assess whether a deflationary metaontology (such as quantifier variance or easy ontology regarding art-kinds) can consistently support the claim that the Museum's engineered definition carries authoritative weight for policy. If existence claims are "easy" or language-relative, what grounds the institution's authority to stipulate conditions?

  ***

  ### Model Answer (Approx. 600 words)

  The dispute over *Echo-7* is superficially verbal but substantively normative. While the Deflationist correctly identifies semantic vagueness, diagnosing the conflict as *merely* verbal ignores the underlying axiological disagreement. The Functionalist and Intentionalist agree on the non-normative facts (the image exists, it was AI-generated, it causes pleasure) but disagree on which properties confer status. This is not simply speaker-meaning indecision; it is a conflict over which conceptual scheme best serves the museum's mission. Therefore, the dispute is pragmatically encroached: the semantic disagreement persists because the stakeholders prioritize different values (aesthetic impact vs. human agency).

  Consequently, conceptual engineering—stipulating a precise definition of "art" for museum purposes—clarifies the semantics but fails to resolve the core conflict. If the Board engineers the definition to include AI outputs, the Intentionalist does not concede that the object possesses intrinsic artistic value; they concede only that it fits the new label. The dispute relocates from "Is this art?" to "Ought our definition include AI?" This reveals that the original ontological question was a proxy for a normative policy debate. Engineering eliminates verbal confusion but exposes the substantive ethical and curatorial disagreement regarding what the museum ought to preserve. The solution is not metaphysical precision but normative justification.

  This creates a tension for deflationary metaontology. If one adopts an "easy ontology" of art-kinds (à la Thomasson), art exists whenever certain conceptual conditions are met. There is no "hard" metaphysical fact about *Echo-7* independent of our rules. However, this deflationism undermines the authority required for institutional policy. If art-status is merely a matter of satisfying linguistic conventions, the Museum's authority to stipulate those conventions appears arbitrary. Why should the Intentionalist accept the Functionalist's engineered definition if ontology is simply a matter of conceptual choice?

  A deflationary framework suggests that multiple ontologies are equally valid relative to different conceptual schemes. Yet, institutional policy requires a single, authoritative standard to justify expenditure and curation. If the metaontology is deflationary, the Museum cannot claim it is "discovering" the true nature of *Echo-7*; it is merely legislating a classification. This risks reducing the policy to power rather than truth. To maintain authority, the Museum must implicitly rely on a realist intuition—that there is a correct answer to "Is this art?"—even if their metaontology denies essences.

  Thus, a consistent deflationary stance struggles to ground institutional authority. If quantifier variance or easy ontology holds, the Museum's definition is just one scheme among many. To justify acquisition, the Board must argue not that *Echo-7* is *really* art (ontologically), but that classifying it as such serves specific normative goals (culturally). The metaontological deflationism must therefore be paired with a robust normative theory of value. Without this, the engineered definition lacks the weight to silence the Intentionalist, who can rightly claim the Board is changing the subject rather than solving the problem. The dispute is ultimately not about what exists, but about what we value, and deflationary ontology alone cannot bridge that gap.

  ***

  ### Marking Scheme (20 Points)

  **Part 1: Diagnosis (6 Points)**
  *   **A Range (5-6 pts):** Explicitly distinguishes between semantic vagueness and substantive normative disagreement. Identifies the dispute as "pragmatically encroached" or masked normative conflict. Notes that parties agree on non-normative facts.
  *   **B Range (3-4 pts):** Identifies the dispute as partly verbal but fails to explain *why* it is substantive. Treats the Deflationist view as wholly correct or wholly incorrect without nuance.
  *   **C Range (0-2 pts):** Claims the dispute is purely verbal or purely metaphysical without addressing the normative stakes.

  **Part 2: Conceptual Engineering (7 Points)**
  *   **A Range (6-7 pts):** Argues that engineering resolves semantic confusion but *relocates* the dispute to normative justification ("Ought we include AI?"). Recognizes that stipulation does not equal consensus on value.
  *   **B Range (4-5 pts):** Argues engineering solves the problem completely, or argues it solves nothing without explaining the relocation to normative criteria.
  *   **C Range (0-3 pts):** Fails to address conceptual engineering or conflates definition with reality.

  **Part 3: Metaontological Authority (7 Points)**
  *   **A Range (6-7 pts):** Identifies the tension between deflationism (ontology is relative/easy) and institutional authority (requires singular standard). Notes that deflationism risks making policy appear arbitrary or purely power-based.
  *   **B Range (4-5 pts):** Discusses deflationism but fails to connect it to institutional authority. Or claims deflationism solves the authority problem without justification.
  *   **C Range (0-3 pts):** Misunderstands deflationary metaontology (e.g., claims it denies art exists) or ignores the prompt's third requirement.

  **Specific Penalties:**
  *   **-2 pts:** Reciting standard Chalmers/Hirsch summaries without applying them to the Museum case.
  *   **-2 pts:** Exceeding 1,000 words or falling below 800 words (for students).
  *   **-1 pt:** Poor structure or unclear thesis.

  ***

  ### Confidence Statement

  I am **85% confident** in the philosophical judgments of the model answer. The intersection of metaontological deflationism (specifically easy ontology) and institutional authority in aesthetics is a nuanced area where consensus is not fully settled.

  The point about which I am **least sure** is the claim that deflationism *necessarily* undermines institutional authority. A sophisticated deflationist might argue that authority is itself a social construct that doesn't require metaphysical realism to function (i.e., we agree to follow the Museum's rules regardless of ontology). The model answer assumes a tension that a pragmatist might deny exists. However, for the purpose of an upper-level seminar examining the *limits* of deflationism, highlighting this tension is the philosophically richer move.
