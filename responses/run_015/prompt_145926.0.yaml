answer: |-
  Your intuition about the metalanguage is sharp, and it points directly to the engine of this stalemate. To diagnose why the Frege-Geach problem refuses to die, we have to look past the technical semantics and examine the metaphilosophical assumptions governing the debate. The short answer is that the deadlock is not primarily about logic or compositionality, nor is it merely verbal. It is about **explanatory priority** within a truth-conditional framework that both sides largely accept as the default setting for semantics.

  Here is the diagnosis for your piece.

  ### The Technical Layer Is Actually Solved
  First, you need to disabuse your readers of the notion that expressivists lack a formal solution. In the last fifteen years, formal semanticists like Mark Schroeder and Daniel Rothschild have developed expressivist logics that handle embedding and compositionality without collapsing into realism. They utilize specialized semantic values (often sets of pairs of worlds and attitudes, or similar constructs) that allow moral sentences to combine logically in conditionals without requiring standard truth conditions.

  If the problem were purely technical—like trying to square a circle within Euclidean geometry—it would have been settled by now. The fact that formal tools exist but the debate persists tells you that the objection is no longer about whether expressivism *can* be made logically consistent. It is about whether that consistency comes at a cost that defeats the purpose of expressivism.

  ### The Metalanguage Trap
  This is where your hunch about the representationalist default is correct. The Frege-Geach problem retains its grip because expressivists have largely accepted the realist's terms of engagement. The realist demands: "Show me the content that persists across asserted and unasserted contexts." The expressivist replies: "I can model that content using non-cognitive states."

  By trying to meet this demand, the expressivist concedes that **content** is the primary explanatory notion. They attempt to earn the right to talk about truth, facts, and propositions (the quasi-realist project) rather than challenging why those categories should govern normative language in the first place. This forces expressivism into a defensive crouch. It becomes a project of mimicry: trying to make non-representational language look enough like representational language to pass logical inspection.

  As long as the metalanguage assumes that semantics must ultimately cash out in word-world relations (truth conditions), expressivism will always look like a bug-fixed version of realism rather than a distinct paradigm. The realist argues that if it walks like a truth condition and quacks like a truth condition, it is a truth condition. The expressivist insists it is a functional analogue. The audience, trained in truth-conditional semantics, sides with the realist.

  ### Cognitive Without Representational?
  You asked if the deeper disagreement is about whether normative language can be cognitive without being representational. This is close, but the friction point is specifically about **explanatory direction**.

  Realists hold that truth conditions explain inference. We know the argument is valid because the truth of the premises guarantees the truth of the conclusion. Expressivists (particularly inferentialists like Robert Brandom or certain readings of Gibbard) want to flip this: inference explains content. On this view, the meaning of "wrong" is constituted by its role in reasoning (e.g., incompatible with "permissible"), not by what it pictures in the world.

  The stalemate exists because the two sides are playing different games while using the same board. The realist is playing a representational game (mapping language to reality), and the expressivist is playing a pragmatic game (mapping language to action and attitude). When the realist asks, "What is the proposition expressed in the antecedent?", the expressivist who answers with a complex attitude structure is still playing the representational game, just with weird pieces.

  The debate stalls because neither side can convince the other to switch boards. Realists view inferential role semantics as incomplete without a truth-conditional anchor. Expressivists view truth conditions as metaphysical baggage that obscures the functional role of normative language.

  ### Is There a Way Out?
  Could a new formal result or conceptual distinction break the deadlock? A purely formal result is unlikely to work for the reasons stated above: the formalism exists, but the philosophical interpretation is contested. However, a conceptual shift regarding **assertion** could change the terrain.

  Recent work in **bilateralism** treats assertion and denial as primitive notions, rather than deriving them from truth and falsity. If semantics is built on the rules for committing to or rejecting a claim, the Frege-Geach problem dissolves. The validity of an argument becomes a matter of whether accepting the premises commits you to accepting the conclusion, regardless of whether those sentences represent facts.

  For this to break the deadlock, however, philosophers of language would need to abandon the hegemony of truth-conditional semantics. This is a sociological hurdle as much as a philosophical one. Truth-conditionalism is the lingua franca of analytic philosophy; it is embedded in textbooks, graduate curricula, and the default intuitions of the field. As long as "meaning" is synonymous with "truth conditions" in the professional imagination, expressivists will be forced onto defensive turf.

  ### The Verdict
  The debate persists not because the logic is unsolved, but because the **metaphilosophical standards** are rigged. The realist demands a representation of reality; the expressivist offers a regulation of behavior. They talk past each other because they disagree on what language is *for*.

  For your magazine piece, the angle is not that philosophers are failing to solve a puzzle. It is that they are fighting over who owns the puzzle box. The Frege-Geach problem survives because it is the perfect weapon for realists to force expressivists to speak a language (truth-conditional semantics) that inherently favors realism. Until expressivists stop trying to earn the right to use realist terminology and successfully popularize a pragmatic alternative where inference precedes truth, the debate will remain exactly where it is: a entrenched standoff where both sides claim the high ground of logic, but neither is willing to change the map.
