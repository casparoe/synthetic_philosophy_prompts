prompt: |-
  hey so i'm a PhD student in metaphysics (modality / identity stuff) and i'm running a grad reading group — 7 people, 90 minutes, one session. they all know Leibniz's law but haven't really wrestled with Black's spheres or weak discernibility, and i don't want to just lecture. i need you to design a participatory game or structured deliberation that makes them feel the tension themselves before anyone names "PII" or "Black's counterexample."

  first, do some quick brainstorming — list like 2-3 ways to stage a symmetry-breaking problem with cards or physical positions. then build the actual runnable activity. here's the twist i want injected so it's not the same old static-two-spheres case: use a modified scenario where two spheres orbit a central axis in perfect symmetry (same mass, color, velocity, just opposite directions). round one they have the axis and can use it to assign IDs. round two the axis is removed — now only relational properties like "moving clockwise relative to the other" remain, but those are symmetric. round three the whole system is rotated 180 degrees with no external reference frame. they have to decide whether sphere A and B have swapped, stayed put, or whether identity doesn't apply.

  the rules should force real small-stakes choices: maybe they earn points by correctly predicting which sphere will be at position X after rotation, but the scoring rules change each round based on what reference frame is available. no real money — use a simple point token system.

  specify the setting, materials (cards? paper? blank tokens?), timeline minute-by-minute, and exactly what participants should come away seeing. the debrief needs to map each round onto parts of the debate: intrinsic properties, weak discernibility via irreflexive relations (like "to-the-left-of"), and the global symmetry argument. be frank about which feature the game can't reproduce — probably the modal argument about a possible world with only one sphere existing — and say what i have to supply verbally.

  also tell me what will predictably go wrong the first run (my guess is people cheat by using body position or spatial memory) and how the rules should block that. don't ask for bibliographies, reading lists, or citations. you are an expert in metaphysics pedagogy and philosophy of science education. think carefully step by step, and start with the brainstorming. there might be a typo or two in this prompt, that's fine.
