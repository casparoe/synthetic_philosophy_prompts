answer: |-
  ### Part 1: Brainstorming Symmetry-Breaking Stages

  Before settling on the orbital scenario, here are three ways to stage symmetry-breaking problems using physical props. These were considered to ensure the final design maximizes tactile engagement while minimizing logistical friction.

  1.  **The Card Mirror:** Participants sit in pairs. Each holds an identical deck of cards. They must play cards simultaneously based on rules that reference "the card played by the other." Symmetry breaks only when one player hesitates or makes an error. *Verdict:* Too reliant on psychology/agency; introduces human error noise that obscures the metaphysical point.
  2.  **The Blind Grid:** A 4x4 grid is placed on a table. Two identical tokens are placed on symmetric squares (e.g., A1 and D4). Participants wear blindfolds and are told the tokens will swap. They must point to "Token 1." *Verdict:* Good, but static. It misses the dynamic/temporal aspect of persistence over time which is crucial for identity.
  3.  **The Rotating Dial:** A circular board with two identical markers on opposite sides. The board sits on a lazy Susan. Participants must track "Marker A" as the board rotates. *Verdict:* This is the winner. It allows for the specific "axis removal" and "global rotation" twists you requested, and it physically embodies the reference frame problem.

  ---

  ### Part 2: The Activity — "The Orbital Identity Crisis"

  **Setting:** A seminar room with one large central table.
  **Participants:** 7 Grad Students (The "Tracking Committee") + 1 Facilitator (You).
  **Time:** 90 Minutes.
  **Materials:**
  *   1 Lazy Susan (or a circular cardboard cutout that can be rotated manually).
  *   2 Identical small objects (e.g., white poker chips or matte spheres).
  *   1 Distinct Central Pin (removable) to serve as the "Axis."
  *   1 Opaque cloth or box large enough to cover the setup.
  *   30 Poker chips or paper tokens (for scoring).
  *   Whiteboard/Marker (for keeping score only, not explanations).
  *   Blindfolds (optional, but recommended for Round 3).

  **Goal:** The Committee must earn points by correctly identifying the persistent identity of "Sphere A" across changes in the system.

  #### Minute-by-Minute Timeline

  **00:00 – 00:10 | Setup & Rules (No Metaphysics)**
  *   **Facilitator:** "We are tracking two objects, Alpha and Beta. They are intrinsically identical. You earn 1 point for every correct identification of Alpha's location at the end of a phase. You lose 1 point for wrong guesses. You must reach a consensus before betting."
  *   **Constraint:** "You cannot use the room (doors, windows, your own body) as a reference. Only the apparatus counts."
  *   **Setup:** Place the Lazy Susan on the table. Place the Central Pin in the middle. Place Sphere Alpha at "North" (closest to door) and Sphere Beta at "South." Mark them secretly with a tiny dot underneath (for your verification only).

  **00:10 – 00:30 | Round 1: The Anchored Axis**
  *   **State:** Central Pin is **IN**. Spheres are fixed opposite each other.
  *   **Action:** You rotate the board 90 degrees clockwise. Then 90 degrees counter-clockwise. Then 180 degrees.
  *   **Task:** After each move, ask: "Where is Alpha?"
  *   **Mechanic:** Because the Axis is present, they can define Alpha as "The sphere to the left of the Axis" (assuming initial orientation).
  *   **Expected Outcome:** Easy consensus. They will use the Axis as an absolute reference frame.
  *   **Score:** They should max out points here.

  **00:30 – 00:50 | Round 2: The Relational Drift**
  *   **State:** Remove the Central Pin. The board is now just a surface. The spheres remain opposite each other.
  *   **Action:** You slide the spheres along the circular track. They pass each other. They swap positions.
  *   **Task:** "Where is Alpha now?"
  *   **Mechanic:** Without the axis, "North" and "South" are meaningless unless defined by the room (which is banned). They must use relations like "Alpha is clockwise from Beta."
  *   **Tension:** When the spheres pass each other, does the relation "clockwise from" persist? If Alpha moves clockwise and Beta moves counter-clockwise, they cross. At the crossing point, are they indiscernible?
  *   **Score:** Points become harder to earn. Consensus will fracture. Some will argue trajectory tracks identity; others will argue position does.

  **00:50 – 01:10 | Round 3: The Global Rotation (The Twist)**
  *   **State:** No Axis. Spheres stationary relative to each other.
  *   **Action:** Tell them: "I am now rotating the entire universe of this system 180 degrees."
  *   **Mechanic:** While they close their eyes (or you cover the board with the cloth), you rotate the entire Lazy Susan 180 degrees.
  *   **Task:** "Did Alpha and Beta swap places, or did they stay put?"
  *   **The Trap:** If space is relational, rotating the whole system changes nothing. If space is absolute (or if they cheat using the room), they swapped.
  *   **Scoring Rule Change:** "You only get points if you can provide a verification condition for your claim. If you say 'they swapped,' show me *what* changed other than their relation to the room."
  *   **Expected Outcome:** Total stalemate. They cannot bet points because there is no fact of the matter within the rules provided.

  **01:10 – 01:30 | Debrief & Metaphysical Mapping**
  *   Stop the game. Reveal the secret dots (if used) to show that *you* knew, but *they* couldn't.
  *   Transition to lecture/discussion using their frustration as the hook.

  ---

  #### Rules to Block Cheating (Predictable Failures)

  1.  **The "Body North" Cheat:**
      *   *Failure:* Participants will subconsciously define "Alpha" as "The one closest to me."
      *   *Fix:* In Round 3, require participants to stand up and change positions around the table before the rotation happens, or wear blindfolds during the manipulation.
  2.  **The "Trajectory" Cheat:**
      *   *Failure:* Participants will claim identity is preserved by continuous spatio-temporal path ("I watched Alpha move there").
      *   *Fix:* In Round 2, cover the board with the opaque cloth *during* the movement. Reveal only the start and end states. This forces them to rely on state descriptions, not process tracking.
  3.  **The "Room Anchor" Cheat:**
      *   *Failure:* Using the whiteboard or door as "North."
      *   *Fix:* Explicitly state in the rules: "The room is void. If your definition relies on anything outside the Lazy Susan, your bet is void." Enforce this strictly in Round 3.

  ---

  #### Debrief: Mapping the Game to Metaphysics

  Do not start with definitions. Start with their frustration in Round 3.

  **1. Round 1 → Intrinsic + Extrinsic Properties (The Leibnizian Baseline)**
  *   **Discussion:** Why was Round 1 easy?
  *   **Concept:** They used the Axis as an external reference. This mimics a world where objects have unique haecceities or where absolute space provides unique coordinates.
  *   **Takeaway:** Identity is trivial if there is an asymmetric grounding property (like "being at coordinate X").

  **2. Round 2 → Weak Discernibility (The Black Counterexample)**
  *   **Discussion:** When the axis was removed, what properties remained?
  *   **Concept:** They likely used relations like "being clockwise from." This is an **irreflexive relation** (A is clockwise from B, but A is not clockwise from A).
  *   **Takeaway:** This maps to **Weak Discernibility**. Even if Alpha and Beta share all intrinsic properties (mass, color), they can be distinguished by asymmetric relations. This is the standard defense against Max Black's static spheres.
  *   **Tension Point:** Ask them: "When the spheres passed each other, did the relation break?" If the relation breaks, identity is lost.

  **3. Round 3 → Global Symmetry & Substantivalism**
  *   **Discussion:** Why was betting impossible in Round 3?
  *   **Concept:** This is the **Global Symmetry** argument. If the entire system rotates, and there is no external frame, there is no fact of the matter regarding whether they swapped.
  *   **Takeaway:** This challenges **Substantivalism** (space exists independently). If space is merely relational (Relationalism), a global rotation changes nothing. If identity depends on position in absolute space, they swapped. The game forces them to realize that without absolute space, "swapping" is meaningless.
  *   **Link to PII:** This is the strongest version of the counterexample to the Principle of Identity of Indiscernibles. If the rotation creates a distinct possible world (where A and B swapped), then PII holds. If the rotation creates the *same* world, then A and B are indiscernible yet distinct (violating PII), OR identity is not applicable.

  #### Limitations: What You Must Supply Verbally

  The game cannot reproduce **Modality**.
  *   **The Gap:** The game is actualist. It shows them struggling with identity in the *actual* setup. It does not show them a *possible world* where only one sphere exists.
  *   **The Verbal Supplement:** You must explain: "Black's original argument wasn't about tracking objects over time (diachronic identity); it was about whether a universe *could exist* with two indiscernible spheres. In our game, you struggled to track them. Black asks: Could they exist without you tracking them at all? If yes, PII is false."
  *   **Haecceitism:** You need to introduce the term "Haecceity" (this-ness) here. Ask: "Did anyone feel that Alpha was Alpha just because it was Alpha, regardless of position?" That intuition is Haecceitism. The game frustrates Haecceitists because the tokens offered no "this-ness" other than position.

  #### Predictable First-Run Issues & Fixes

  1.  **Issue:** Participants treat the game as a logic puzzle with a "correct" answer hidden by the facilitator.
      *   **Fix:** Be honest. "In Round 3, there may be no correct answer. Your goal is to justify why you think there is one."
  2.  **Issue:** Dominant voices dictate the consensus.
      *   **Fix:** Use a "Secret Ballot" mechanism for betting. Everyone writes their prediction on a slip of paper simultaneously before discussing. This reveals the disagreement hidden by consensus.
  3.  **Issue:** The physics of the orbit confuses the metaphysics.
      *   **Fix:** Keep the movement simple. Don't worry about angular momentum. Just focus on Position A vs. Position B.

  #### Final Pedagogical Note
  The goal of this session is not to solve PII. It is to make them feel the **cost** of each solution.
  *   Accepting Haecceities costs ontological parsimony.
  *   Accepting Weak Discernibility costs the idea that identity is primitive.
  *   Accepting Global Symmetry costs our intuition that "swapping" is a real event.

  By forcing them to bet tokens on these intuitions, you convert abstract discomfort into concrete loss aversion. That is when the learning sticks.
