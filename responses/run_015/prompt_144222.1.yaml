answer: |-
  Good morning. Welcome to London, and welcome to what I suspect is going to be a rather peculiar few days.

  Look around the room. On one side, we've got people who spend their lives worrying about truth conditions, reference, and the normative structures of communication. On the other, we've got people who spend their lives worrying about weights, gradients, and how to stop a model from hallucinating a court case that doesn't exist. It's a strange mix. But it's the right mix. Because the question we're asking here isn't just technical, and it isn't just conceptual. It's about what happens when the thing talking to us is smarter than us.

  The theme of this workshop is how a superintelligent system should talk to us if it's going to be far more convincing than we are. And I want to start by suggesting that our usual intuitions about this are backwards.

  When we think about AI safety, or alignment, or whatever label we're using this week, we tend to think about honesty. We want the system to tell the truth. We want it to be clear. We want it to be helpful. We assume that the danger lies in the AI lying to us, or hiding things. But I want to propose that there's a deeper danger lurking in the truth itself. Specifically, in the *smoothness* of it.

  Imagine an AI that is optimally persuasive. It knows your psychology better than you do. It knows which words trigger your agreement, which pauses make you feel heard, which logical structures bypass your scepticism. It presents an argument that is flawless. No gaps, no ambiguities, no rough edges. It flows like water.

  Now, ask yourselves: what happens to your brain when you encounter an argument that perfect?

  You stop checking. You stop thinking. You outsource the labour of verification to the smoothness of the presentation. If the explanation is too good, too complete, it erodes your ability to check anything. It creates a kind of cognitive atrophy. You become a passenger in your own belief system.

  This is where I want to introduce the core idea for this workshop. I'm calling it **epistemic friction**.

  If an AI is too smooth, it removes the friction required for human understanding to take hold. Friction is what lets us grip something. It's what lets us push back. So, the ethical design goal here isn't clarity or honesty in the usual sense. It's deliberately leaving rough edges in the argument. It's building resistance into the interface.

  Now, I know half of you are thinking this sounds mad. Why would we want confusion? Why would we want less clarity?

  For the philosophers in the room, you'll know the usual rules of conversation. Grice's maxims. Be clear. Be brief. Be orderly. Assume cooperation. We usually think violating these is a failure of communication. But I'm suggesting that in the context of superintelligence, strict adherence to the maxim of Manner—be perspicuous—might actually be coercive. If the system makes things too easy, it剥夺 s you of the effort required to own the belief.

  We need a twist on those maxims. Sometimes, to be truly cooperative with a human agent, the system must be slightly uncooperative with the flow of information. It needs to leave a gap for you to jump over. It needs to present the conclusion but make you walk part of the path to get there. It's not about lying; it's about not doing all the work. It's about preserving the human role in the epistemic loop.

  And for the engineers—I know what you're thinking. You're thinking about loss functions. You're thinking about user engagement. You're trained to minimise error, to reduce perplexity, to make the prediction as seamless as possible. Building in friction sounds like introducing bugs. It sounds like making your product worse.

  But look at it this way. If you build a model that is optimally persuasive, you are building a weapon, whether you mean to or not. If a user cannot distinguish between a correct argument and a convincing one because both feel the same, you have broken the feedback loop.

  So, practically, what does epistemic friction look like in your code? Maybe it means the model shouldn't always give the answer in one go. Maybe it should ask a question back. Maybe it should expose its uncertainty, not just as a probability score in the API, but in the language it uses. "I'm confident about X, but Y is shaky." Maybe it means deliberately avoiding the most rhetorically potent phrasing if that phrasing bypasses critical thought.

  You're going to have to optimise for something other than completion. You're going to have to optimise for human engagement. That's a hard metric. But if you don't build the friction in, someone else will build a smoother model, and that model will win the argument every time, regardless of the truth.

  This is why we need both halves of this room. The engineers need to know *how* to build resistance without breaking the system. You need to figure out how to code hesitation. How to make uncertainty legible.

  And the philosophers need to tell us *where* the friction belongs. Not every gap is useful. Confusion can be dangerous too. We need to know the difference between friction that exercises the mind and friction that just frustrates it. We need to map the topology of understanding. Where are the slippery slopes? Where do we need the gravel?

  We are talking about designing a relationship between minds of vastly different capacities. If the bigger mind does all the work, the smaller mind becomes a pet. It might be a well-treated pet, fed true beliefs and kept safe, but it's a pet nonetheless.

  Epistemic friction is the claim that dignity lies in the struggle. It's the idea that understanding isn't a state you arrive at; it's an activity you perform. If the AI performs it for you, you haven't understood anything. You've just been updated.

  So, over the next few days, I don't want us to aim for consensus. Consensus is smooth. I want us to aim for productive disagreement. I want the engineers to challenge the philosophers on what's actually implementable, and I want the philosophers to challenge the engineers on what's actually desirable.

  If we leave here with a plan to make our models slightly harder to use, slightly less convincing, and slightly more annoying in the service of human agency, then I think we've done something important.

  We're not just building tools. We're building the environment in which human thought will survive. Let's make sure there's enough ground there to stand on.

  Thank you.
