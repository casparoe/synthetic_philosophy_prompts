prompt: |-
  You're a professional moral philosopher who also happens to know type theory and design-by-contract cold — act like someone who has shipped safety-critical OCaml and Rust and who actually knows what an affine type and a cancel token are. Please think carefully, and before you write the answer do a short scratch pass: list every mapping promissory-claim → code-thing you're tempted to make, cross out the ones that quietly smuggle an assumption from my world (or from yours) into the translation, and only then write. Hard cap: 700 words total, and if you have to choose between getting a fifth nuance in and finishing the residue report, finish the residue report.

  Context on me: I'm a systems engineer. My daily vocabulary is preconditions, postconditions, invariants, assertions (half of which are compiled out in release), checked exceptions, capability tokens, cancel tokens, affine/linear types for resources that have to be consumed exactly once, and monitors that watch a running process from outside. When somebody says "obligation," my hands reach for "an invariant that is checked at runtime and whose violation raises."

  The domain: why does promising bind? The philosophical menu as I understand it, in my own words:

  1. social practice — there's a convention, the convention exists because everybody benefits from it, and that's the whole story;
  2. reliance/expectation — promising binds because it makes people count on you and you'd be setting back their interests, or their planning, if you walked;
  3. normative power — you have a power to change what you owe, and promising just is exercising it, end of explanation;
  4. the second-personal one — the promisee acquires a claim against you and can release you, so what's created is owed to a person and not merely to the world.

  Translate 1 through 4 into my vocabulary one at a time, as faithfully as you can, and flag explicitly where you had to cheat to make it fit.

  Two terms from my world I want you to actually use, because I think they do work the philosophy jargon doesn't:

  - A promise as a self-issuing check: a runtime check whose precondition it itself creates. There is no spec upstream of it. In my world that's close to incoherent — an assertion is derived from a spec, and with no spec the assertion is decorative. Is the philosophers' "bootstrapping" worry the same point, or worried about something else?
  - The promisee holds the cancel token. Waiver isn't the check being disabled globally, it's the counterparty calling cancel; no third party can cancel, and no third party is the one who's owed. Does that carry all of 4, or is there more to 4 than ownership of a handle?

  Then the part I actually want, the residue report: what translated cleanly, what translated only with distortion, and what has no expression in my vocabulary at all. My guesses at the untranslatables, which you should confirm or kill: reactive attitudes (resentment, guilt, feeling wronged aren't error logs, and a monitor doesn't hold a grudge); the gap between discharging an obligation by performing and compensating for not performing; and the claim that a promise can bind even where violating it would be undetectable and harm nobody — the counterparty-free case, where there's no consumer reading the assertion at all.

  Finish with your own verdict: is what's left over a hole in my vocabulary, something I should want a word for, or is it the philosophers having made a mystery out of a monitor, a convention, and a cancel token? If you could add exactly one primitive to my language to make the translation lossless, what would it be?
