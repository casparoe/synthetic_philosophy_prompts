      *   *The Key Distinction:* Remedy vs. Entitlement (#6) is useful but doesn't solve the #1 conflict. The Mechanical vs. Holistic (#4) distinction is legally robust but philosophically thin.
      *   *The Single Revision:* Modify Point 1. It is too absolute. It needs to acknowledge the remedial exception upfront.
