      *   *Refining the "Distributed Allowing":* Connect it to Hannah Arendt or structural sin. The DDA fails because it assumes a discrete agent. The novel shows DDA is a *tool of obfuscation* used by the system.
      *   *Refining the "Harm" question:* Distinguish between "wrongful death" and "wrongful life." The harm isn't just dying; it's the *constraint* on living.
      *   *Refining the "Resistance":* Kathy's narration is unreliable/repressed. Her lack of resentment is part of the tragedy, not a moral justification.

  8.  **Final Polish:** Check against the prompt's specific questions.
