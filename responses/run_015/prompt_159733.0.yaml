answer: |-
  This is a brilliant pedagogical instinct. *Never Let Me Go* is often taught in bioethics courses, but usually as a blunt instrument against utilitarianism or as a prompt for "cloning rights." Using it to interrogate the *Doctrine of Doing and Allowing* (DDA) itself is much sharper. It forces students out of the sterile vacuum of the Smith-and-Jones bathtub and into the muddy reality of institutional complicity.

  Here is a reading of the novel tailored to your seminar's specific philosophical problems, addressing your two wrinkles, the key scenes, and the limits of the ethical lens.

  ### 1. Distributed Allowing: A Bug or a Feature of DDA?

  You call it "distributed allowing." In political philosophy, this overlaps with the "Problem of Many Hands." In the context of DDA, it exposes a critical weakness: **The Doctrine assumes a discrete agent.**

  Rachels' thought experiment relies on a single locus of will. Smith pushes; Jones waits. The moral weight is assigned based on the relationship between *that* will and *that* death. *Never Let Me Go* demonstrates how the DDA can be weaponized by a system to diffuse moral responsibility until it vanishes.

  *   **The Philosophical Work:** The novel suggests that "distributed allowing" is not just a stack of omissions; it is a **structural simulation of letting die.** The system is designed specifically to ensure that no individual ever crosses the threshold from "allowing" to "killing."
      *   The surgeons don't decide *who* dies; the schedule does.
      *   The carers (Kathy) don't decide *when*; the "completion" does.
      *   The guardians (Miss Emily) claim they only *prepared* them for what was inevitable.
  *   **Seminar Application:** Ask your students: If the DDA is true (that allowing is less morally weighty than doing), has the society in the novel found a moral loophole? Or does the novel argue that when a system is designed to produce death, the distinction collapses?
      *   **Illumination:** This illuminates the **linguistic construction** of the distinction. The term "complete" is the crucial pivot. It reframes a causal intervention (harvesting organs until death) as a natural conclusion (finishing a task). The novel shows that the "doing/allowing" distinction often rests on how we describe the baseline. If the baseline is "donor until empty," then stopping is impossible; death is just the end of the function.

  ### 2. The Non-Identity Problem and the Baseline of Harm

  Your second wrinkle is the Non-Identity Problem (Parfit). If the clones wouldn't exist without the program, can they claim they are worse off?

  *   **The Philosophical Work:** The novel resists the "wrongful life" trap by shifting the harm from *existence* to *constrained agency*. The harm isn't that they exist; the harm is that they are deceived about the nature of their existence.
  *   **The Deferral Rumor:** This is the key philosophical pivot. For most of the book, the students believe there is a possibility of deferral (a "doing" intervention that could stop the "allowing" of death). When this is revealed as a myth, the harm is crystallized.
  *   **Seminar Application:** The baseline for "letting die" is usually "what would have happened naturally." Here, nothing is natural.
      *   **Question:** Is it "letting die" if you create the person *in order to* let them die?
      *   **Argument:** The novel suggests the harm is the **foreclosure of the future**, not the termination of life itself. Kathy and Tommy aren't angry they will die; they are angry they were lied to about the possibility of love buying time. This shifts the ethical violation from *homicide* to *fraud* and *coercion*. The DDA usually ignores the history of the victim; the novel forces us to look at the origin.

  ### 3. Scene Selection for the Seminar

  Here is where the lens illuminates, and where you must warn students it might distort.

  **A. The Conversation with Miss Emily and Madame (Chapter 22)**
  *   **The Text:** Miss Emily admits, "We took away your art because we thought it would reveal your souls... to prove you had souls at all." She argues they did the clones a *kindness* by shielding them from the truth.
  *   **Philosophical Payoff:** This is the defense of "Benevolent Allowing." Miss Emily argues that knowing the truth (that they are being killed/sacrificed) would make their lives worse than not knowing (that they are just completing a destiny).
  *   **Seminar Question:** Does the moral weight of "killing vs. letting die" change if the victim is kept ignorant? Does paternalistic allowing mitigate the harm? This challenges the idea that consent validates the distinction.

  **B. Kathy as Carer (The Middle Section)**
  *   **The Text:** Kathy describes her job as keeping donors "calm" until their fourth donation. She prides herself on her "long record."
  *   **Philosophical Payoff:** Kathy is the Jones figure, but she is also the victim. She facilitates the "allowing."
  *   **Seminar Question:** Is Kathy complicit in killing, or is she merely allowing? If she refuses to be a carer, does the donor die sooner? This forces students to confront **complicity in structural violence**. It moves the DDA from "What did I do?" to "What role did I play?"

  **C. Tommy's "Completion" (The End)**
  *   **The Text:** The actual death is off-stage, clinical. Kathy talks about "watching him complete."
  *   **Philosophical Payoff:** The sanitization of the moment of death.
  *   **Seminar Question:** Rachels' bathtub is visceral. Tommy's death is bureaucratic. Does the *manner* of death affect the moral categorization? The novel suggests that bureaucracy is the tool that converts killing into allowing.

  ### 4. Where the Book Resists the Reading (Crucial for TAing)

  You asked where an honest critic has to say "this lens doesn't fit."

  **1. Kathy's Lack of Resentment**
  If you press the DDA too hard, students will ask: "If this is murder, why doesn't Kathy call it murder?"
  *   **The Resistance:** The novel is not a treatise on justice; it is a tragedy about **internalized oppression**. Kathy accepts the framework of "allowing" because she has no language for "killing."
  *   **The Trap:** If students argue "The clones accept it, so it's morally permissible," they have missed the point. The novel shows how effective the "allowing" narrative is at suppressing moral outrage. You must warn students: *Kathy's acceptance is evidence of the system's success, not its moral validity.*

  **2. The Question of the Soul**
  The DDA usually assumes the victims are moral equals. The tension in the book is whether the clones *are* humans.
  *   **The Resistance:** Miss Emily's argument is that they *needed* to prove the clones had souls to justify treating them badly (paradoxically). "We thought... if you were more than just your organs... you'd be treated differently."
  *   **The Trap:** The seminar might devolve into "Are clones people?" rather than "Is this killing?" You need to bracket the metaphysical status. Assume they are persons for the sake of the argument, otherwise the DDA discussion evaporates (if they are appliances, neither killing nor letting die applies).

  **3. The "Doing" is Invisible**
  In Rachels, the pushing is visible. In *Never Let Me Go*, the "pushing" happened before birth (genetic engineering).
  *   **The Resistance:** The novel suggests the DDA is a **temporal trick**. By the time the agents (carers, surgeons) arrive, the "doing" is in the past. The current agents are only left with the "allowing."
  *   **The Lesson:** The DDA might be blind to **historical injustice**. It judges the snapshot, not the movie.

  ### 5. What Does It Add Beyond the Bathtub?

  If a student asks, "Why read 300 pages when we have the Smith/Jones paragraph?", here is your answer:

  1.  **Temporality:** Rachels is instantaneous. *Never Let Me Go* is a **slow death**. It forces us to ask if "letting die" changes moral weight when it takes 10 years and involves a relationship of care. Does caring for someone while you let them die make it better (palliative) or worse (betrayal)?
  2.  **The Agent's Psychology:** Smith and Jones are abstract wills. Kathy is a person who loves her friends. The novel explores the **psychological cost of the distinction**. Even if "allowing" is morally permissible, what does it do to the *allow-er*? Kathy's narration is repressed, flat, and avoidant. The "allowing" requires emotional mutilation of the carer.
  3.  **Language as Moral Technology:** The bathtub case assumes we agree on the description of the act. The novel shows that **political power determines the description**. The victors get to decide if it's "harvesting" or "killing," "completing" or "dying." The DDA relies on agreed-upon descriptions; the novel shows those descriptions are the battlefield.

  ### Summary for the Syllabus

  **Reading:** *Never Let Me Go*, Parts 1–3.
  **Focus:** The construction of moral agency within a total institution.
  **Discussion Questions:**
  1.  Miss Emily claims they "protected" the students by not telling them the truth. Does ignorance turn a "killing" into a "letting die"?
  2.  Kathy facilitates the deaths of her friends. Is she a moral agent in the DDA sense, or a tool of the system?
  3.  The clones exist *for* the purpose of donation. Does the Non-Identity Problem absolve the system of harm, or is the harm located elsewhere (in the constraint of their lives)?
  4.  Does the distinction between "doing" and "allowing" require a discrete moment of decision? What happens when the decision is distributed across a lifetime and a bureaucracy?

  **Warning to Students:** Do not treat the novel as a puzzle to be solved. Treat it as a report from inside the machine. If you find yourself satisfied with the "allowing" explanation, ask yourself: *Who benefits from that explanation?*

  This approach keeps the rigorous analytic framework of the DDA but uses the novel to stress-test its limits regarding structure, time, and language. It turns the "mood music" into a structural critique.
