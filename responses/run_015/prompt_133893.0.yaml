answer: |-
  **The Scenario**
  In a memory clinic, three subjects are asked, "Where are your keys?" All answer, "In the bowl." All would answer "In the car" if asked about the car. Subject A is neurotypical: visual cues activate a hippocampal trace, which causally drives motor speech. Subject B has a lesion: the visual cue activates an identical hippocampal trace, but the pathway to speech is blocked. A separate micro-shunt detects the cue and triggers speech directly. The trace is causally inert regarding the output. Subject C is an android: silicon nodes activate a memory state that causally drives motor speech. Topologically, C matches A; B matches neither. Externally, all three are indistinguishable across inputs, outputs, and standard counterfactuals.

  **The Verdicts**
  (i) **Plain Role Functionalism:** A and C remember; B does not. Functionalism identifies the mental state with the causal role. In A and C, the internal state mediates the input-output relation. In B, the putative memory state is epiphenomenal; the shunt does the work. Since B's internal state fails the causal specification, B lacks the mental state, despite physical similarity to A.

  (ii) **Neuro-Identity Theory:** A and B remember; C does not. This view identifies the mental state with the specific neural activation pattern. Both A and B instantiate the requisite hippocampal pattern. The fact that B's pattern is causally bypassed is a performance error, not a state absence. C lacks the neural stuff, so C lacks the state.

  (iii) **Refined Condition (Causal Mediation):** A state counts only if it is causally efficacious in producing the output within the system's normal dynamics. This excludes B (epiphenomenal trace) while including C (functional equivalent), preserving multiple realizability without accepting inert duplicates.

  **The Toggle**
  The feature is **Internal Causal Mediation**. In the case above, B lacks it; A and C have it. Flip the toggle: Repair B's lesion so the hippocampal trace drives the speech directly. The verdicts shift immediately. Functionalism now includes B (A = B = C). The case collapses into the bog-standard multiple realizability setup where functionalism is the liberal view (accepting A, B, and C) and Identity Theory remains restrictive (accepting only A and B). The restriction vanishes once mediation is restored.

  **The Best Functionalist Reply**
  A sophisticated functionalist should bite the bullet and include B. This is the "System Reply." The mental state is realized by the *whole* system (trace + shunt). The trace is a necessary component of the system's actual architecture, even if not the sole driver. To exclude B is to sneak in neuro-privilege: demanding the *specific* causal pathway of A rather than the abstract role. If the system reliably produces the right output via its internal components, it remembers. Restricting based on internal topology risks turning functionalism into a disguised identity theory.

  **Lookup Table Comparison**
  This is not a glossy rewrite of Block's lookup table. Block's system lacks internal structure entirely; it maps inputs to outputs via brute enumeration. Subject B has the correct internal structure (the trace) but lacks internal *efficacy*. This is an "Epiphenomenal Realizer" case, not a "Structureless" case. It targets the necessity of causal power within the system, rather than the complexity of the input-output mapping. It shows functionalism cares about *how* the role is played, not just that it is played.
