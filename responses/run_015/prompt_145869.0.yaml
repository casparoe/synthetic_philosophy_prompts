answer: |-
  This is a rich theoretical problem that cuts to the *Grundnorm* (basic norm) of a legal order. You are asking whether the *form* of authority matters if the *substance* of authority is identical. In democratic theory, the standard answer is "no, substance matters most." But if you dig into the architecture of legitimacy, the Scandinavian constitutional monarchy model presents a specific tension regarding **constituent power** and **temporal sovereignty** that republican systems do not face.

  Here is a conceptual breakdown of the implications for popular sovereignty, structured around the "dormant power" problem and the Japanese complication.

  ### 1. The Direction of Legitimacy (Octroi vs. Grant)
  The most profound conceptual tension lies in the *direction* from which sovereignty is understood to flow.

  *   **Republican Model:** The constitution is a "grant" from the people to the government. The *Grundnorm* is "We the People." Authority flows upward.
  *   **Scandinavian Monarchy Model:** Historically, even in democratic evolutions, there remains a conceptual residue of the constitution being an *octroi*—a sharing of power *by* the Crown *with* the people. Even if the people now hold the power, the *form* suggests the Crown is the source of legal continuity.

  **The Implication:** In a republic, if the government collapses, sovereignty reverts immediately to the people (or their representatives). In a constitutional monarchy, the "dormant" authority suggests that sovereignty reverts to the *State* (embodied by the Monarch) before it returns to the people. This creates a theoretical **intermediary sovereign**. Even if the King hasn't vetoed a law in 100 years, the legal architecture implies that the People rule *through* the Crown, not *instead of* it. This subtly undermines the claim of *full* popular sovereignty by suggesting the People's power is mediated by a pre-democratic institution.

  ### 2. The "Dormant Power" as a Latent Dual Sovereignty
  You asked if dormant authority is harmless residue. Conceptually, it is not harmless because **power is defined by availability, not just usage.**

  In political theory, sovereignty is often tested at the limit (the state of exception).
  *   **The Republican Limit:** In a crisis (e.g., a hung parliament where coalition building fails), a President's powers are usually strictly codified. If they overstep, it is a clear constitutional violation.
  *   **The Monarchical Limit:** In the Scandinavian model (particularly Norway and Denmark, less so post-1974 Sweden), the Monarch retains formal executive authority that is restrained only by *convention*, not always by hard legal text.

  **The Tension:** Conventions are political norms, not laws. If a political crisis becomes severe enough that norms shatter, the "dormant" personal discretion of the Monarch wakes up. This means the system technically contains a **non-democratic veto point** that is legally valid but politically suppressed.
  For a theorist of popular sovereignty, this is a problem. It means the "Will of the People" is not the absolute final word; it is the final word *only so long as the Monarch acquiesces.* This creates a **Dual Sovereignty** structure:
  1.  *De facto* sovereignty: The People/Parliament.
  2.  *De jure* sovereignty: The Crown (holding the reserve key).

  In a fully republican system, there is no second key. The tension here is that Scandinavian democracy relies on the self-abnegation of the sovereign to function democratically. That makes democracy contingent on the behavior of a non-elected actor, which is theoretically distinct from democracy being guaranteed by the structure itself.

  ### 3. Temporal Sovereignty: The "Two Bodies" Problem
  This is where the Scandinavian model diverges sharply from republican theory regarding time.
  *   **Popular Sovereignty is Presentist:** The "People" who rule today are the living citizens. The legitimacy comes from the current electorate.
  *   **Monarchical Sovereignty is Trans-Temporal:** The King represents the continuity of the state across generations (the "King's Two Bodies").

  **The Implication:** By retaining a monarch as Head of State, the Scandinavian model conceptually splits the "State" from the "People." It suggests that the State is an eternal entity that the current population merely inhabits and manages.
  In a republic, the State *is* the institutionalization of the People's will. In a constitutional monarchy, the State is a heritage that the People serve.
  This complicates **Constituent Power** (the power to make/change the constitution). In a republic, the people can theoretically rewrite the constitution because they own the state. In a monarchy, the constitution is often viewed as a pact *between* the People and the Crown. This makes the idea of the People acting as the sole constituent power conceptually "messier." You cannot fully dissolve the state into the people because the Crown holds the title to the state's continuity.

  ### 4. The Japanese Complication: Sacral vs. Rational Legitimacy
  The Japanese case (Emperor as "symbol of the State and of the unity of the People") complicates this differently because it removes the *political* dormant power but intensifies the *ontological* tension.

  *   **No Dormant Power:** Unlike Scandinavia, the Japanese Constitution explicitly strips the Emperor of all political powers, even formal ones. He cannot even sign laws in a way that implies assent; he merely "promulgates." The "dormant veto" problem is legally solved.
  *   **The Sacral Residue:** However, the Emperor's legitimacy is tied to pre-democratic, ethnic, and religious continuity (Shinto lineage), whereas Scandinavian monarchs are more "civil service" style heads of state.

  **The Theoretical Twist:**
  In Scandinavia, the tension is **Political**: "Who holds the reserve power?"
  In Japan, the tension is **Ontological**: "What is the source of the State's unity?"

  By grounding the "unity of the people" in a hereditary, sacred symbol, the Japanese model suggests that popular sovereignty is insufficient to create social cohesion. It implies the "People" are not a political construct (citizens agreeing to a contract) but an ethnic/cultural entity that pre-exists democracy.
  *   **For Democratic Theory:** This challenges the idea of **Civic Nationalism**. If the Head of State represents a unity that the people did not choose and cannot remove, then popular sovereignty is limited to *administration*, not *identity*. The People rule the government, but they do not own the "State."
  *   **Comparison:** Scandinavia leaves the door open for the King to be a political arbiter (dangerous for sovereignty). Japan closes that door but opens a different one: the People are sovereign, but their "unity" is guaranteed by a non-sovereign, pre-democratic figure. This creates a split between *political will* (sovereign) and *national identity* (non-sovereign).

  ### 5. Summary for your Lecture: The "Cleanliness" of Sovereignty
  To untangle the knot for your students, frame it around the **purity of the chain of legitimacy**.

  1.  **Republican Systems:** The chain is clean. People → Constitution → Government. If the chain breaks, it breaks at the People.
  2.  **Scandinavian Monarchy:** The chain is looped. People → Constitution ↔ Crown → Government. The Crown is a theoretical parallel track that runs alongside the people. It creates a **conceptual redundancy**. It suggests that democracy is the *method* of rule, but Monarchy is the *source* of continuity.
  3.  **The "Dormant" Risk:** The risk isn't that the King *will* veto. The risk is that the existence of the veto implies the People's sovereignty is **revocable** or **delegated**, rather than inherent. It treats democracy as a convention rather than a right.
  4.  **The Japanese Variation:** It removes the political risk but codifies the idea that the "People" are not the ultimate authors of their own collective identity.

  **Conclusion:**
  Does it undermine popular sovereignty? **Yes, conceptually, but not functionally.**
  It undermines the *claim* that sovereignty resides **fully** with the people because it retains a structural placeholder for a time when the people might not be trusted to rule themselves. It is a "break-glass-in-case-of-democratic-failure" mechanism.
  In a republican system, if democracy fails, the constitution fails. In a constitutional monarchy, if democracy fails, the Crown *could* theoretically step in to save the State. That possibility alone proves that, in the final analysis, the State is not fully identical to the People.
