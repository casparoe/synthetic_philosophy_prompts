answer: |-
  This is a fantastic angle. You're right to be suspicious of the standard "Hyde is a mask" reading. If Hyde were merely a mask, Jekyll's benevolent dispositions would remain intact *during* the transformation, merely prevented from manifesting. But the text suggests something more violent: when Hyde is present, Jekyll's conscience doesn't just sit quietly behind a wall; it ceases to function as a causal power entirely.

  However, calling Hyde a **fink** (where the stimulus of the potion destroys the disposition of goodness) also feels wrong, because Jekyll insists Hyde was *latent*. A fink removes a property; Jekyll claims the potion *liberates* one.

  Your intuition about **dispositional branching** is the strongest metaphysical tool here. It allows you to respect Jekyll's claim ("man is truly two") without reducing the story to a simple reveal. In standard metaphysics, dispositions are usually treated as stable properties of a single object. Stevenson challenges this by suggesting that moral character is an *ecology* of competing dispositions, and the potion acts as a **segregation mechanism** that bifurcates the track.

  Here is a walkthrough of how this plays out in the two key scenes, and where the metaphysics either illuminates the text or breaks against it.

  ---

  ### Scene 1: The First Transformation
  **The Text:** Jekyll drinks the potion. He describes feeling "younger," "lighter," and "heady." He feels a "solution of the bonds of obligation." He doesn't feel like a man *pretending* to be evil; he feels like a man *freed* from the need to be good.

  **The Metaphysical Lens:**
  If we treat this as a **mask**, we'd say Jekyll's benevolence is still there, but the potion prevents it from triggering. But Jekyll reports no internal struggle in this first transformation. He feels *more* himself, not less.
  If we treat this as a **fink**, the potion destroys his benevolence. But Jekyll can return to being Jekyll later. The disposition wasn't destroyed; it was suspended.

  **The "Branching" Reading:**
  This is where your **dispositional branching** idea shines. Think of Jekyll's pre-potion self as a tangled knot of dispositions: some benevolent, some selfish, some repressed. They are co-instantiated in one body.
  The potion doesn't mask or fink; it **splits the causal path**.
  *   **Track A (Jekyll):** Dispositions toward social obligation, reputation, and altruism are actualized.
  *   **Track B (Hyde):** Dispositions toward appetite, aggression, and immediacy are actualized.

  **Where the Metaphysics Helps:**
  It explains the "lightness" Jekyll feels. In dispositional terms, maintaining contradictory dispositions (wanting to sin but needing to appear good) requires energy. It creates tension. By branching off the "sinful" dispositions into a separate entity (Hyde), Jekyll isn't just hiding them; he is offloading the causal burden of those dispositions to another track. He feels lighter because he has literally shed the dispositional weight of his vices.

  **Where the Novella Pushes Back:**
  Stevenson hints that the branching isn't clean. Jekyll says, "Edward Hyde, alone in the ranks of mankind, was pure evil." If this were true branching, Hyde would just be "Jekyll's selfish side." But Hyde seems to lack *any* of the complex dispositions that make Jekyll human (loyalty, memory, nuance).
  The metaphysics of branching implies two valid tracks from one root. Stevenson suggests Track B is **degenerate**. Hyde isn't just a branch; he's a pruning that went wrong. This pushes against the idea that dispositions are neutral potentials. Stevenson implies some dispositions (conscience) are structural; if you branch them off, the remaining entity isn't just "different," it's ontologically lesser. Hyde is smaller than Jekyll because evil, in Stevenson's view, has less substance than the complex struggle of good.

  ### Scene 2: The Final Door-Breaking (The End of Jekyll)
  **The Text:** Jekyll can no longer control the transformations. He wakes up as Hyde without the potion. Eventually, the supply of salts fails. Jekyll writes that his "virtue slumbered," while Hyde's dispositions grew stronger through habit. Jekyll chooses suicide rather than let Hyde persist.

  **The Metaphysical Lens:**
  This is the critical moment for your group. In standard dispositional metaphysics, if I have the disposition to be kind, I have it until something removes it (a fink).
  But here, we see **Dispositional Plasticity via Habituation**.
  Jekyll admits that by letting Hyde act out, he strengthened Hyde's dispositions and weakened his own.

  **Where the Metaphysics Helps:**
  This validates the "branching" model but adds a time component. It's not just a split; it's a **resource competition**.
  Think of the "self" as having a finite amount of dispositional energy. Every time the Hyde-branch is actualized, it draws power from the root.
  *   **Mask Model Failure:** If Hyde were just a mask, taking the antidote should restore Jekyll's power instantly. But it doesn't. The "muscle" of his virtue has atrophied.
  *   **Fink Model Failure:** If the potion were a fink removing goodness, restoring the potion should restore the goodness. But the potion stops working. The change has become categorical, not conditional.

  **Where the Novella Pushes Back:**
  Stevenson introduces a moral reality that formal metaphysics often ignores: **The cost of inaction.**
  In metaphysics, a disposition is usually defined by what happens *if* the stimulus occurs (e.g., "If struck, it breaks").
  Stevenson argues that *not* acting on a disposition can kill it. Jekyll's goodness wasn't masked; it was starved.
  This pushes back against the idea that moral character is a stable property. Stevenson suggests moral character is a **practice**. If you stop practicing the "good" track, that branch withers, and the "bad" branch becomes the trunk.
  The metaphysics helps us name this (dispositional competition), but the novella warns us that the competition isn't fair. The "evil" dispositions require less maintenance. They are the path of least resistance. Jekyll loses not because Hyde is stronger, but because Hyde is *easier* to sustain.

  ### The Payoff: What Stevenson Gets Right
  You asked what Stevenson gets right about moral character that formal debates miss. It's this: **The instability of the dispositional base.**

  In most philosophical discussions, we treat dispositions as fixed properties of an object (the glass is fragile, the sugar is soluble). We debate whether the fragility exists when the glass is wrapped in foam (mask) or if the strike destroys the fragility (fink).

  Stevenson argues that **the object itself changes based on which dispositions are exercised.**
  1.  **Goodness is not a default state:** It is a high-energy maintenance of conflicting dispositions.
  2.  **Segregation is destruction:** You cannot isolate your "bad side" without damaging your "good side." The branching isn't safe; it's a lobotomy.
  3.  **Latency is dangerous:** Just because a disposition is latent (Hyde was "always inside") doesn't mean it's harmless. Latent dispositions can grow in the dark.

  **For your session:**
  Don't let the group settle on "Mask vs. Fink." That binary traps you.
  Propose that Stevenson is describing **Dispositional Atrophy**.
  *   **Hyde is not a mask:** Because Jekyll's goodness doesn't survive the transformation intact.
  *   **Hyde is not a fink:** Because the goodness can return (initially), but it returns weaker.
  *   **Hyde is a parasitic branch:** A divergent track that feeds on the main trunk until the main trunk dies.

  This reading respects Jekyll's claim that Hyde was always there (latent dispositions) but acknowledges the metaphysical horror that *actualizing* those dispositions changes the nature of the subject permanently. It turns the story from a mystery about a potion into a cautionary tale about the metaphysics of habit: **You become what you do, even if you think you're just visiting.**
