  Here is the principle that saves your verdicts, the cost of simplifying it, and the prediction for your new case.

  ### The Unifying Principle: Local Modal Safety

  **Principle:** *S knows that P if and only if S's belief that P is produced by a cognitive process that yields true beliefs in the actual world and all **nearby** possible worlds, evaluated **module-by-module**.*

  Here is how it maps to your six cases:

  1.  **Normal Case (Know Cup):** **Safe.** In nearby worlds where you use vision, the cup is there. The "Full BIV" world is **modally distant** (it requires a massive, unlikely conspiracy of physics), so it doesn't count against safety.
