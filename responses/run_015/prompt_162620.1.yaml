  The screen glows blue against the dark of **now**.
  We measure light that left the star back **then**.
  It travels through the vacuum, **always**.
  For all I know the source is long since **gone**.
  Only the photon's ghost **remains**.
  The dome is quiet, **still**.

  The argument holds its ground, **still**.
  They say this second, **now**,
  Is just a place where memory **remains**.
  Like yesterday, like back **then**,
  No moment is truly **gone**.
  The map is solid, **always**.

  Physics says simultaneity shifts, **always**.
  But the dome is fixed, and quiet **still**.
  One view says the present is **gone**,
  Except for this thin slice of **now**.
  Not relative to back **then**,
  But absolute, like dust among **remains**.

  Think of the book where everything **remains**.
  The future open, not closed **always**.
  We turn the page from here to **then**.
  The ink is wet, not dry, **still**.
  Becoming is just reading **now**.
  No entry ever **gone**.

  But my father is **gone**.
  His absence **remains**.
  Does it change the grief of **now**?
  The past is settled, **always**.
  The coffee cup sits **still**.
  We won't meet again until **then**.

  Whatever comes from **then**,
  The light is not **gone**.
  The earth turns, **still**.
  Only the question **remains**.
  We watch the sky **always**.
  Waiting for the dawn of **now**.

  The star is **gone** but light **remains** **still**.
  We mark the ledger **always**, **then**.
  And wait to see what happens **now**.
