  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Quantitative trader with a background in professional poker.
      *   **Vocabulary:** Conditional expected value (EV), variance, drawdown, Kelly sizing, martingales, stopping rules, sample spaces, backtesting discipline (information available at trade time).
      *   **Knowledge Gaps:** No measure theory beyond trading usage, no philosophy training.
