      *   *Correction:* Need to emphasize that seeing a large $v$ makes it less likely you have the smaller envelope if the prior decays. If the prior is flat, $v$ tells you nothing, but a flat prior over infinity is impossible to normalize.
      *   *Check:* Did I address the infinite expectation variant accurately?
      *   *Correction:* Ensure I distinguish between infinite variance (Kelly struggles) and infinite mean (EV undefined). The TEP infinite variant is about infinite mean.
      *   *Check:* Residue Report needs to be sharp.
