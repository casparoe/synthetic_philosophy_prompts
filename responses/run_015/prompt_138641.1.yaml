answer: |-
  This is a high-wire pedagogical act. You are asking students to experience the *phenomenology of mechanism* without telling them that is what they are experiencing, while ethically ensuring they do not feel manipulated. The goal is to induce a specific cognitive dissonance: the feeling of "fixing" a problem that turns out to be merely following a more complex instruction.

  Here is a complete session design, including the activity, the timeline, the reveal, and the specific philosophical moves for the debrief.

  ### Session Title: The Protocol Update
  **Time:** 75 Minutes
  **Students:** 20 (First-year Phil/CogSci)
  **Materials:**
  *   10 Envelopes (sealed, labeled "Protocol v1", "Protocol v2", etc.)
  *   20 Sheets of paper (lined).
  *   20 Pens.
  *   A distinct sound trigger (a bell, a specific clap pattern, or a slide change sound).
  *   Candy (for participation/compliance).
  *   Whiteboard.

  ---

  ### Part 1: Setup & Ethical Frame (00:00 – 00:10)

  **00:00 – 00:05: The Contract**
  Do not start with philosophy. Start with the frame. This prevents the "deception" explosion later.
  *   **Say:** "Today is an experiential session. We are going to run a simulation of rule-following behavior. You will be given instructions. Some instructions will be immediate; some will be delivered mid-task. You are free to opt out of the activity at any time without penalty to your participation credit; you may observe silently instead. If you choose to participate, your goal is to follow the instructions as precisely as possible. Do not try to 'win' or 'break' the game; try to *be* the system."
  *   **Why:** This acknowledges the artifice. If a student meta-games later, you can point to this: "You were asked to be the system, not the auditor."

  **00:05 – 00:10: Grouping & Distribution**
  *   Divide into 10 pairs.
  *   Hand each pair **Envelope 1**. Tell them not to open it yet.
  *   Assign roles: **Agent** (holds the pen) and **Monitor** (watches the clock/rules). They will swap roles in Round 2.
  *   **Incentive:** "The pair with the highest fidelity to the protocol at the end gets the candy." (Small stakes ensure compliance without coercion).

  ---

  ### Part 2: The Activity (00:10 – 00:45)

  **Round 1: The Brittle Baseline (00:10 – 00:20)**
  *   **Instruction:** "Open Envelope 1. Read silently."
  *   **Protocol v1:**
      1.  Agent copies the paragraph on the board onto your paper.
      2.  **Trigger:** When you hear the [Bell], stop immediately.
      3.  **Response:** If the Bell rings, tear up the paper, get a fresh sheet, and return to Step 1.
      4.  Complete the paragraph.
  *   **Action:** Let them work for 2 minutes. Ring the Bell.
  *   **Observation:** Watch the frustration. They will tear the paper. They will restart. This is the **Digger Wasp** phase.
  *   **Stop:** After 5 minutes, halt everyone. Ask: "How many completed the paragraph?" (Likely few).
  *   **Collect:** Gather the torn paper. Do not comment on the frustration yet.

  **Round 2: The "Elastic" Patch (00:20 – 00:35)**
  *   **Instruction:** "Swap roles. Open Envelope 2."
  *   **Protocol v2:**
      1.  Agent copies the *same* paragraph on a fresh sheet.
      2.  **Trigger:** When you hear the [Bell], stop immediately.
      3.  **Response:** If the Bell rings, **assess your progress**. Mark the last completed word. Resume typing/writing from that word. Do not restart.
      4.  Complete the paragraph.
  *   **Action:** Let them work. Ring the Bell at the same interval as Round 1.
  *   **Observation:** They will feel relief. They will "assess." They will continue. It feels like *adaptation*.
  *   **Stop:** After 5 minutes. Most should finish.
  *   **Key Question (ask casually):** "Raise your hand if Round 2 felt easier." (Most will). "Raise your hand if Round 2 felt more like *you* were in control." (Many will).

  **Round 3: The Stack (00:35 – 00:45)**
  *   **Instruction:** "Keep roles. Open Envelope 3."
  *   **Protocol v3:**
      1.  Agent copies a *new* paragraph.
      2.  **Trigger:** When you hear the [Bell], stop.
      3.  **Response:** If the Bell rings, **consult the Exception Table**.
          *   *If less than 3 words written:* Restart (Brittle).
          *   *If more than 3 words written:* Resume from last word (Elastic).
      4.  Complete the paragraph.
  *   **Action:** Ring the Bell twice. Once early (force restart), once late (force resume).
  *   **Observation:** They are now running a conditional routine. They are "checking conditions." It feels like decision-making, but it is explicitly rule-bound.
  *   **Stop:** End the task.

  ---

  ### Part 3: The Reveal (00:45 – 00:55)

  **00:45 – 00:50: The Structural Mirror**
  *   **Action:** Write three headers on the board: **Round 1**, **Round 2**, **Round 3**.
  *   **Ask:** "In Round 1, when the bell rang, what did you do?" (Answer: Restarted). "Why?" (Answer: The rule said so).
  *   **Ask:** "In Round 2, when the bell rang, what did you do?" (Answer: Resumed). "Why?" (Answer: The rule said so).
  *   **The Pivot:** "In Round 2, how many of you felt like you were *choosing* to resume, rather than *obeying* a command to resume?"
  *   **The Point:** "The instruction 'Assess your progress' is just a command. It is a subroutine. You did not decide to be elastic. You executed the Elasticity Routine."

  **00:50 – 00:55: Mapping the Categories**
  *   **Draw the Wasp:** Label Round 1 **Brittle**. (Trigger $\rightarrow$ Restart).
  *   **Draw the Human:** Label Round 2 **Elastic**. (Trigger $\rightarrow$ Check State $\rightarrow$ Continue).
  *   **Draw the Stack:** Label Round 3 **Stacked Brittleness**.
  *   **Say:** "Round 3 looks like agency. It handles exceptions. But look at the structure. It is just a Brittle Routine (Check Table) that triggers a Brittle Routine (Restart) or a Brittle Routine (Resume). There is no 'you' in that diagram. There is only the next card in the stack."

  ---

  ### Part 4: The Debrief & Philosophical Landing (00:55 – 01:15)

  This is where you move from the room to the worry.

  **Move 1: The Phenomenological Gap (00:55 – 01:05)**
  *   **Question:** "In Round 2, did the instruction to 'Assess' feel different from the instruction to 'Copy'?"
  *   **Expected Answer:** "Yes, assessing felt like thinking."
  *   **Counter:** "But you were following Envelope 2. If I could put 'Assess' on a card, and you would do it when the bell rang, what is the difference between that and a wasp whose burrow-inspection routine includes a sub-routine for 'check if prey moved'?"
  *   **Goal:** Sever the link between *complexity of behavior* and *presence of agency*.

  **Move 2: Handling the CS Objection (01:05 – 01:10)**
  *   **Anticipate:** The CS majors will say: "This is just a Finite State Machine with more states. Obviously."
  *   **Your Move:** Do not fight this. **Amplify it.**
  *   **Say:** "Exactly. It is a FSM. The worry is this: We define human agency by the fact that we are *not* wasps. We say, 'Wasps are brittle; we are elastic.' But if elasticity is just a FSM with a 'Check State' node, then we are just wasps with more states."
  *   **The Trap:** "If the CS major is right, and we are just complex machines, then 'reconsidering' is just running the 'Reconsideration Subroutine.' How would you know the difference from the inside? In Round 2, you felt like you were adapting. But you were running a script. If you run a script that says 'Feel like you are choosing,' do you feel like you are choosing?"
  *   **Legitimate Pushback:** Allow a student to say: "But I *know* I'm not a machine because I feel the qualia of the choice."
  *   **Your Response:** "That is the only ground you have left. The behavior is identical. The structure is identical. Your only defense is the internal feeling. But can you trust the feeling if the feeling is also generated by the routine?"

  **Move 3: The Library Objection (01:10 – 01:12)**
  *   **Anticipate:** "But humans have infinite routines. Wasps don't."
  *   **Your Move:** "Quantity is not quality. A library with a million books is still a library. If every book is a deterministic script, having a million of them doesn't create a 'reader' who chooses which book to open. Who opens the book? If it's another book, we have an infinite regress. If it's 'you,' where is 'you' in the room today? Were you in Envelope 2?"

  ---

  ### Part 5: Hard Things & Failure Modes

  #### 1. Failure Modes: The Meta-Gamer & The Deception Accusation
  You mentioned a previous session dissolved because a student felt deceived. Here is the protocol to prevent and handle that.

  *   **Prevention (The Contract):** The opening script (Part 1) is vital. You must explicitly state: *"Some instructions will be delivered mid-stream."* This removes the lie. You are not hiding that there are hidden rules; you are hiding *what* they are to preserve the phenomenology.
  *   **The Meta-Gamer:** If a student raises their hand in Round 1 and says, "This is Skinner box conditioning, I'm not doing this," do not argue.
      *   **Response:** "You are absolutely right. It is a simulation of rule-bound behavior. You have spotted the mechanism. I invite you to step out of the simulation and become the Auditor. Watch the other pairs. Your task is to record *their* reactions to the trigger. Can you do that?"
      *   **Why:** This validates their intelligence without letting them derail the room. It gives them a role that serves the debrief ("I noticed Pair 3 hesitated before tearing the paper").
  *   **The Accusation:** If a student says at the end, "You manipulated us," do not apologize for the pedagogy, but acknowledge the feeling.
      *   **Response:** "I engineered a situation where you followed rules to see how that felt. That is a form of manipulation, yes. It was done to make the philosophical point tangible. Did the feeling of being manipulated in Round 1 feel different from the feeling of 'choice' in Round 2? That difference is exactly what we are studying."

  #### 2. The Crux: Landing the Free-Will Question
  You need to ensure the discussion doesn't end at "We are machines." It must end at "We don't know what 'not being a machine' looks like."

  *   **Discussion Move A (The Black Box):** "If I gave you a black box. Input: Bell. Output: Resume Writing. You cannot open the box. Is there agency in the box?" (No). "Now I tell you the box contains a human following Envelope 2. Is there agency now?" (Yes). "What changed? The behavior didn't. The structure didn't. Only the *substrate* changed. Why does substrate matter if the function is identical?"
  *   **Discussion Move B (The Regress):** "If 'reconsidering' is just a routine, what triggers the routine? If it's a stimulus, we are wasps. If it's 'us,' what are we? A routine that triggers routines? Where does the buck stop?"
  *   **Legitimate Pushback Point:** A good student should push back here: "The difference is *teleology*. The wasp doesn't care about the prey. I care about finishing the paragraph."
      *   **Your Counter:** "In Round 2, did you care? Or did you care because the Protocol said 'Complete the paragraph' and you are a rule-follower? If I gave you a rule 'Care about this,' would you?" (This is the hard stop. Let it hang).

  #### 3. Limitations: What This Exercise Cannot Deliver
  You must be honest in your closing 5 minutes. This exercise cannot solve the problem; it can only sharpen the anxiety.

  *   **The Gap:** "This exercise demonstrates **Behavioral Indistinguishability**. It shows that Stacked Brittleness produces the same output as Elastic Agency. It does not, and cannot, prove that you *are* Stacked Brittle."
  *   **The Cost:** "I cannot give you the feeling of 'true' agency to compare against the 'fake' agency of the game. You only have the game's version. So you leave today not with an answer, but with a suspicion: That the feeling of freedom might just be the smoothness of the subroutine."
  *   **The Closing:** "The wasp does not wonder if it is free. You do. Is that wondering just another subroutine? Or is it the one place the stack breaks? We cannot know from the inside. That is the discomfort."

  ### Summary of Instructor Mindset
  *   **Tone:** Clinical but empathetic. You are not tricking them; you are building a wind tunnel to show them the wind.
  *   **Pacing:** Keep the rounds tight. If Round 1 drags, the frustration becomes annoyance rather than data.
  *   **Authority:** When the CS major speaks, treat them as a collaborator, not an adversary. Their reductionism is your ally.
  *   **Vulnerability:** Admit in the closing that you cannot answer the question either. You are all in the room, potentially running the same routines.

  This design moves the distinction from a taxonomy (Brittle vs. Elastic) to a phenomenological problem (Does Elasticity imply Agency?). It forces them to inhabit the "Stacked" position before they have the vocabulary to dismiss it.
