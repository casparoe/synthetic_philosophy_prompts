  **Note on the Poem**

  **The Janus Line**
  The line is in Stanza 4, line 3: *"The memo waited while the ground froze hard, as the river KNEW"*
  *   **Cold Reading (Hedge):** A descriptive flourish about administrative delay and weather conditions. The personification ("as the river KNEW") reads as poetic license suggesting the water simply rose naturally; the memo waiting is just bureaucratic background noise that might or might not be relevant.
  *   **Knowing Reading (Portent):** A precise identification of the failure mechanism. The "memo" (short bolts) combined with the "frozen ground" (the specific trigger on 14 March) is the causal knot. The river "knew" where the weakness was. The delay in finding the memo signifies the hidden flaw that doomed the levee.

  **Liberties and Contested Readings**
  The poem takes liberties with the causal weight of the "short bolts." The archive states a memo about them was found *after* the breach; it does not definitively state they caused the breach. The historian-narrator elevates this correlation to causation to tighten the narrative chain. Additionally, the poem treats the 1897 vote as a decisive pivot point ("The vote decided all"), whereas in reality, the dry survey of 1896 was likely the larger structural error. The historian smooths over this to create a more dramatic human conflict (5–4 vote) rather than a technical miscalculation.

  **Hindsight Bias vs. Dramatic Irony**
  I am moderately confident the poem enacts **hindsight bias** rather than just **dramatic irony**. Dramatic irony relies on the audience knowing the outcome while the characters do not; the past remains mutable to the characters. Hindsight bias requires the narrator to reconstruct the past so that the outcome appears *determined*. You can see this in the progression: Stanza 1 presents the survey as reasonable ("less than INEVITABLE"), but by Stanza 6, that same survey is "the first link, broken." The narrator isn't just revealing a fixed fate; they are actively re-weighting the evidence (the vote, the bolts, the survey) in each stanza to make the ending feel unavoidable. However, this is the claim I am **least sure of**. In practice, a poem about inevitability written after the fact always risks collapsing into dramatic irony, where the "bias" is simply the genre convention of history-writing rather than a psychological distortion demonstrated in the text. Distinguishing between a narrator *showing* bias and a narrator *telling a story with an ending* is a fine line.
