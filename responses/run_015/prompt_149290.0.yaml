  ### Analysis of the Baseline Slide

  Your observation identifies a specific rhetorical instability within bioethical debates regarding the therapy-enhancement distinction. While the underlying theoretical issue is well-documented in philosophy (often discussed under Norman Daniels' "normal species functioning" vs. individual welfare), there is **no established single term** for the rhetorical maneuver of strategically switching between these three specific baselines (individual historical, species-typical, and environmental-functional) to preserve a classification.

  Existing concepts like **equivocation** are too broad; they imply sloppy usage rather than the strategic selection of incompatible normative frameworks. **Motte-and-bailey** describes retreating to a defensible claim, whereas your observation describes maintaining a single claim ("this is therapy") by shifting the *metric* used to validate it. The **Reference Class Problem** is the closest statistical analogue, but it typically concerns probability assessments rather than normative status.

  Because this specific three-way switching mechanism lacks a dedicated label despite being a recognizable pattern in bioethical argumentation, I propose coining the term **"Triadic Baseline Shifting."** This term captures the three distinct sources of normativity (past self, species average, environmental demand) and the act of shifting between them to avoid counterexamples.

