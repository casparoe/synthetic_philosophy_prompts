  So my mate Dave, proper decision-theory wonk, decides to run a prediction market on Thomson's Lamp. Shares paying £100 if it's ON at t=2, zero if OFF. He's sitting there with his laptop, updating priors on every single toggle. He's got EDT agents betting against CDT agents, spreadsheets flying everywhere, reckoning that if he updates fast enough the posterior'll converge on the truth.

  Clock hits 2. The toggling stops. Dave goes to settle the books. He asks the physicist running the experiment, "Alright, whats the state? On or off? Need to know for the liquidity."

  Physicist says, "Neither. It's undefined. No limit."

  Dave stares at his screen. He tries to run an expected utility calc on a null value. He says, "But I've got collateral locked in. I can't payout on 'undefined'."

  Physicist says, "There's no fact of the matter."

  Dave says, "Theres always a fact of the matter, thats what betting is for."

  Turns out his entire accounting framework assumes bivalence. He tries to book the loss as 'epistemic uncertainty' but the auditor flags it as 'ontological void'. He tried to file the payout as '50% resolved' to split the difference, but HMRC wrote back saying 'Liability requires a boolean, please amend'. Now he's just holding everyone's money in a state of superposition until the universe patches the bug.
