answer: |-
  ### Part 1: Translating the Church–Turing Thesis

  Here is the debate restated in the vocabulary of language implementation, semantics, and runtime systems.

  **1. The Core Claim (Human Procedure $\leftrightarrow$ Turing Machine)**
  In your framework, this is a claim about **semantic equivalence between a formal language and an informal operational semantics.**

  *   **The Source Language:** "Effective Procedure." This is an informal language with no formal syntax or type system. Its operational semantics are defined by the intuitive notion of a human agent following rules on paper.
  *   **The Target Language:** Turing Machines (or $\lambda$-calculus, or General Recursive Functions). These are formal languages with precise small-step or big-step semantics.
  *   **The Claim:** There exists a compilation strategy from "Effective Procedure" to "Turing Machine" such that the observable behavior is preserved. Specifically, for any valid source program (procedure), the compiled target program terminates on the same inputs and produces the same outputs.
  *   **The Problem:** You cannot prove compiler correctness here because the source language has no formal specification. You cannot write a test suite because the domain of "all possible human procedures" is not enumerable. The claim asserts that the formal semantics of the Turing Machine *capture* the informal semantics of the human agent without loss of precision or addition of extraneous behavior.

  **2. The Strong Claim (Physical Process $\leftrightarrow$ Turing Machine)**
  This is a claim about the **implementation fidelity of the physical runtime.**

  *   **The System:** The physical universe, treated as a hardware substrate.
  *   **The Instruction Set:** The fundamental laws of physics.
  *   **The Claim:** The physical universe cannot implement an instruction set that exceeds the expressive power of a Turing Machine. In PL terms: there is no physically realizable primitive operation `op` such that adding `op` to a Turing-complete language allows the definition of functions not definable in the base language.
  *   **The Distinction:** While the Core Claim is about the *source semantics* (human thought), the Strong Claim is about the *backend code generation*. It asserts that the "hardware" of the universe does not support hypercomputational primitives (e.g., an oracle for the Halting Problem).

  **3. The Status and Convergence Argument**
  *   **Definition vs. Hypothesis:** In your work, a type definition is axiomatic, and a theorem is derived. The Thesis is neither. It is a **specification alignment claim**. It proposes that the formal specification (TM) aligns with the informal requirement (Effective Procedure).
  *   **Convergence:** You note that $\lambda$-calculus, recursive functions, and Turing machines define the same class of functions. In PL terms, this is **inter-translatability with preservation of semantics**. You can write a compiler from $\lambda$-calculus to Turing Machines and vice versa that is fully abstract with respect to termination and output.
  *   **The Argument:** The fact that independently designed IRs (Intermediate Representations) converge on the same set of definable functions is evidence that this set is not an artifact of a specific encoding, but a stable fixed point of the concept "computation." It suggests that the "Effective Procedure" specification is robust enough that multiple formal implementations satisfy it.

  ---

  ### Part 2: The Interface Thesis

  **The Claim:** Computation is not about computing functions $f: \mathbb{N} \to \mathbb{N}$ (input $\to$ output), but about realizing interaction behaviors (streams of input/output, responsive at every finite stage).

  **Translation:**
  This is the distinction between **inductive types** (data, terminating computation) and **coinductive types** (codata, productive processes).
  *   **Standard CTT View:** Focuses on partial functions. A computation is a relation that maps a finite input string to a finite output string, possibly diverging. The semantics are denotational: $[\![ P ]\!] \in \mathbb{N} \rightharpoonup \mathbb{N}$.
  *   **Interface Thesis View:** Focuses on labeled transition systems or process calculi. A computation is a process $P$ that engages in a trace of actions $\alpha_1, \alpha_2, \dots$. The semantics are operational: $P \xrightarrow{\alpha} P'$. The correctness criterion is not "does it return a value?" but "is it productive?" (i.e., can it always produce the next output token in finite time given finite input?).

  **Is your colleague right?**
  Yes, but with a caveat regarding your vocabulary.

  1.  **Distinctness:** The Interface Thesis is distinct from the Core CTT. You can accept that all *functions* computable by humans are Turing-computable, while denying that all *interactions* realizable by humans are simulatable by a Turing Machine interacting with an environment. (Though standard TMs can simulate streams via dovetailing, the *latency* and *causality* constraints of the Interface Thesis impose stricter liveness properties than simple input-output mapping).
  2.  **Silence of the Standard Framework:** The standard CTT framework is silent on this *only if* you restrict your semantics to denotational models of partial functions. If your vocabulary includes **operational semantics**, **bisimulation**, and **coinduction**, you already have the machinery to state the Interface Thesis.
  3.  **Collapse:** Your vocabulary does *not* inherently collapse the two, provided you distinguish between **termination** (halting with a value) and **productivity** (running forever but producing observable events). However, if your notion of "compiler correctness" is defined solely as preservation of input-output functions (extensional equality), then yes, your framework collapses the distinction by construction. If your correctness criterion includes preservation of *interaction traces* (e.g., contextual equivalence in a concurrent calculus), the distinction remains vivid.

  **Verdict on Colleague:** She is right that the *standard CTT debate* ignores interaction, but wrong that *computation theory* ignores it. In your vocabulary, this is simply the difference between compiling a batch program vs. compiling a server process. The "Interface Thesis" asserts that the server model is the primitive, and the batch model is a special case (start, run, close).

  ---

  ### Part 3: The Residue Report

  **1. Clean Mappings**
  *   **Formalism Convergence:** Maps cleanly to **bisimilarity of abstract machines**. The fact that Register Machines, Turing Machines, and $\lambda$-calculus coincide is exactly the fact that you can write compilers between them that preserve observational equivalence.
  *   **Physical Limits:** Maps cleanly to **ISA capabilities**. The Strong CTT is the claim that the Universe's ISA does not include instructions like `HALTING_ORACLE(input)`.

  **2. Distorted Mappings**
  *   **Informal vs. Formal:** This is the largest distortion. In your work, you compare Formal Specification A against Formal Implementation B. You can prove correctness. The Core CTT compares **Formal Specification (TM)** against **Informal Intuition (Human Procedure)**.
      *   *The Distortion:* You have no "test suite" for human intuition. You cannot run a differential test against "what a human would do" because "what a human would do" is not a deterministic executable.
      *   *Nearest Substitute:* The closest practice in your field is **validation against a corpus of hand-worked cases** combined with **peer review of the semantics**. When you design a new language feature, you argue it matches "programmer intuition." This is not a proof; it is a sociological claim about the community's shared mental model. The Core CTT is a universal version of this: a claim that the *entire community's* shared mental model of "procedure" aligns with TMs.

  **3. No Counterpart**
  *   **Ontological Status:** Your field treats specifications as authoritative. If the spec says `x = 5`, then `x` is 5. Philosophy asks if the spec matches the territory. There is no counterpart in your daily work for "Is the formalism *true*?" only "Is the implementation faithful to the formalism?"
  *   **The "Human" Element:** You model agents as inputs or environments. You do not model the *implementer* of the semantics. The Core CTT makes a claim about the implementer (the human brain). Your vocabulary assumes the implementer is outside the system boundary.

  **4. Testing Your Hunch (Primitives and Physics)**
  *   *Your Hunch:* Talk of physical processes exceeding TMs looks banal because languages are always extended with primitives (FFI, floats). The substance must live at the implementation level of the primitive.
  *   *Analysis:* Your hunch **survives contact**, but it concedes the substantive point of the Strong CTT.
      *   **Why it survives:** In PL, if you need a function $f$ not definable in Language $L$, you add a primitive `prim_f`. You then push the burden of implementing `prim_f` to the runtime/OS/hardware.
      *   **Where the substance lives:** The Strong CTT is a claim about the **hardware**. It says: "You can write `prim_oracle` in your language syntax, but you cannot link it against the physical runtime."
      *   **The Banality:** It is banal to say "I can extend the language." It is non-trivial to say "I can link that extension to physics."
      *   **Conclusion:** The debate is not about language design (which is arbitrary); it is about **runtime support**. The Strong CTT asserts that the physical runtime does not support linking against hypercomputational libraries. Your hunch correctly identifies that the *language* is not the bottleneck; the *runtime* is.

  ---

  ### Part 4: The Verdict

  **1. Defect of Vocabulary vs. Defect of Claim**
  *   **Defect of Vocabulary:** Your vocabulary lacks a mechanism to formalize "Informal Intuition." You treat semantics as a contract between two formal parties. The CTT Core is a contract between a formal party and a fuzzy, psychological reality. Your tools (proofs, equivalence checks) cannot grip the fuzzy side.
  *   **Defect of Claim:** The "Human Procedure" notion is underspecified. If a human uses a physical random number generator, is that mechanical? If they use a quantum device, is that mechanical? The informality of the source concept makes the "thesis" resistant to falsification. It functions more as a **definition of the boundary of study** than an empirical claim.

  **2. What the PL Framing Reveals**
  The philosophical framing hides the **layering of abstraction**.
  *   Philosophy often treats "Computation" as a single monolithic concept.
  *   Your vocabulary reveals it as a stack:
      1.  **Source Semantics:** (Human Intuition / High-level Language)
      2.  **IR / Abstract Machine:** (Turing Machine / Lambda Calculus)
      3.  **Runtime / Hardware:** (Physical Physics)

  **The Insight:**
  The Church–Turing Thesis is actually a **Full Abstraction Claim** across this stack.
  *   **Core CTT:** The Abstract Machine is fully abstract with respect to the Source Semantics (Human Intuition). No two distinct human procedures are equated by the TM unless they are intuitively equivalent, and no two intuitively distinct procedures are equated.
  *   **Strong CTT:** The Hardware is fully abstract with respect to the Abstract Machine. The hardware does not distinguish between TM-states in a way that allows extracting more information than the TM semantics allow (e.g., by solving halting).

  **Final Conclusion:**
  Your colleague is right: the Interface Thesis highlights a dimension (interaction/productivity) that the standard function-based CTT ignores. Your vocabulary handles this fine (coinduction vs. induction), provided you don't restrict "correctness" to input-output functions.

  Your hunch is also right: Hypercomputation is just adding primitives. The *debate* is whether those primitives can be linked.

  The **Residue**—the part that frustrates you—is the gap between Formal and Informal. In your work, this gap is closed by **specification**. In the CTT debate, there is no specification for the "Human." The nearest substitute in your practice is **consensus on test cases**. The CTT is effectively the claim that "All reasonable test cases of human computation pass on a Turing Machine." It is an empirical generalization dressed as a definition, validated not by proof, but by the failure of all attempts to find a counter-example (a "failing test case") despite decades of fuzzing the concept with new formalisms.

  The philosophy obscures this by treating the Thesis as a metaphysical truth. Your vocabulary reveals it as a **robustness property of the abstraction layer**: the "Computable" layer is stable against changes in the implementation details (physics) and the interface details (lambda vs. TM), but it breaks if you try to compile "Intuition" directly without the intermediate formalism.
