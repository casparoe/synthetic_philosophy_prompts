answer: |-
  Dear friend,

  It is a rare thing to encounter someone who has wrestled with the morality of war so carefully without the scaffolding of academic training, and your intuitions are remarkably consistent with the most sophisticated debates in contemporary just war theory. You have essentially rediscovered the tension between the traditional view, which treats soldiers as equal combatants regardless of their cause, and the revisionist view, which ties liability to moral responsibility. The rule of thumb you have arrived at is a strong hybrid, separating the question of whether you may be killed from the question of whether you are to blame, but as you suspected, it requires tightening to handle the edges you have identified.

  When we test your rule against your nine cases, the first crack appears in Case One. Your rule states that a person may be killed only if they had a fair opportunity to know the cause was wrongful. In Case One, the conscript has no way to check and believes his country was attacked. By your own rule, he lacks the fair opportunity to know, which implies he should not be targetable. Yet, your intuition suggests he is not a murderer and should not be punished, but you do not explicitly say he cannot be shot at in the firefight, and standard practice assumes he is a legitimate target. If you keep the knowledge clause for killability, you must accept that the ignorant conscript cannot be morally liable to be killed, which contradicts the reality of war you read about. If you want to maintain that he is targetable, you must drop the knowledge condition from the killability part of your rule and keep it only for the blame part. Most philosophers who follow your line of thinking would argue that the ignorant conscript is not morally liable to be killed, but may be killed anyway due to the tragic necessity of war, whereas the knowing soldier is liable. To repair your rule, I suggest you separate liability from permission. You might say that a person is liable to be killed if they pose an unjust threat, but permission to kill them may exist even without liability if necessary for self-defense against an imminent threat, regardless of their knowledge. This preserves your intuition that the ignorant conscript is not blameworthy but remains dangerous.

  The distinction you struggle with between the cook and the engineer is the hardest problem in the law of war, often called the problem of direct participation in hostilities. Your rule needs a clause about the directness of the causal link to harm. The taxpayer funds the government, which funds the army, which feeds the cook, who feeds the soldier, who shoots the bullet. This chain is too long. The engineer, however, modifies the fuse. He is not just sustaining the agent of harm; he is modifying the mechanism of harm itself. The cook sustains the biological capacity of the soldier to fight, which is general support. The engineer enhances the lethal capacity of the weapon, which is specific support. To separate the cook from the engineer without catching the taxpayer, you should add a clause stating that one is targetable if their activity is functionally integrated into the specific infliction of harm at the time of the act, rather than merely sustaining the general capacity of the organization. The engineer is working on the killing tool; the cook is working on the human being. The taxpayer is working on the state. The line is drawn at the weapon system versus the human support system.

  Regarding your three undecided cases, the principle we are building suggests the following. For the soldier in the defending army who learns his government is now pursuing conquest, the moment he learns this, his status changes. He is no longer defending against an unjust threat but becoming part of one. If he stays merely because his unit would be short-handed, he is prioritizing loyalty over justice. He becomes liable to be killed like the aggressor, though perhaps less blameworthy if he feels trapped by camaraderie. For the contractor paid triple to keep the trucks running, he falls closer to the cook than the engineer. Trucks are general logistics, not weapon systems. Unless he is driving ammunition directly under fire, fixing engines is maintenance of general capacity. He is not targetable, though he may be interned if captured, similar to the cook. For the pair of soldiers with equally good evidence where one is objectively wrong, we face the problem of invincible ignorance. The soldier on the objectively unjust side is liable to be killed because he is posing an unjust threat, even if he is excused morally. The soldier on the just side is not liable to be killed, but he is permitted to kill the other because he reasonably believes he is defending against an unjust threat. The symmetry of evidence does not create symmetry of liability, only symmetry of excuse.

  You asked which of your verdicts a respected principle would force you to drop. If you adopt the view that moral liability requires moral responsibility, you would have to drop the intuition that the ignorant conscript in Case One is targetable in the same way as the knowing volunteer. You would have to accept that killing him is a tragedy permitted by necessity, not an act of justice against a liable target. Conversely, if you stick to the traditional view that uniformed soldiers are always targetable, you must drop the knowledge clause from your rule entirely. Given your focus on blame and fairness, I suspect you would prefer to admit that the ignorant conscript is not morally liable, even if he is still shot at. This is a hard pill to swallow for anyone who reads military history, where such distinctions vanish in the fog of war, but it is the cost of moral consistency.

  Finally, I will resolve your two irreconcilable contrasts. The first is between the cook and the engineer. You should resolve this in favor of protecting the cook. The engineer alters the weapon, making the harm more effective or possible; the cook merely maintains the life of the soldier. While both support the war, the engineer's contribution is to the violence itself, while the cook's contribution is to the human being who happens to be violent. Protecting the cook maintains a buffer between civilian life and military function that is essential to limit war. The second contrast is between the volunteer in Case Three and the wounded soldier in Case Seven. You worried that the wounded soldier will fight again, so why is he safe? The resolution lies in the immediacy of the threat. Liability to be killed is tied to the present danger you pose. A sleeping soldier or a wounded one poses no immediate threat. The fact that he will be dangerous next month is irrelevant to the moral permission to kill him today. We do not kill people for what they might do in the future, only for what they are doing now or are immediately about to do. This resolves the tension by anchoring killability in the present moment of threat, not the future potential of the person.

  Your instinct to separate blame from killability is the strongest part of your theory, and it serves you well in distinguishing the volunteer from the conscript. By refining the definition of direct threat to exclude general support like cooking or truck maintenance, and by anchoring killability in the immediate present rather than future capacity, you can keep most of your intuitions intact. You will only have to sacrifice the idea that the ignorant conscript is morally liable to be killed, accepting instead that he is a tragic victim of circumstances who may still be stopped by force. This is a heavy burden, but it is the price of taking the morality of war seriously.

  I hope this helps you clarify the map you have been drawing. It is a difficult terrain, but you are navigating it with honesty and precision.

  Yours sincerely,

  A Friend
