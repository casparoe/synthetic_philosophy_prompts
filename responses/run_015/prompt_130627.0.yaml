      *   *Refining the "Philosopher vs. Game Theorist" angle:* Emphasize that game theorists take preferences and beliefs as given. Philosophers question the coherence of those preferences and the justification of those beliefs under uncertainty.
      *   *Refining the "Global Coordination" critique:* Make sure to highlight the *regress* problem. A global body is just another agent in the race unless it has god-like power, which creates a new race for control of that body.

