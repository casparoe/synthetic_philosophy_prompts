      *   *Goodman's Point:* Nelson Goodman argued resemblance is neither necessary nor sufficient. I should mention that relying *only* on resemblance is the weakness.
      *   *Tone:* Respectful, analytical, philosophical but accessible.

  8.  **Final Polish:** Ensure American spelling (e.g., "modeling" vs "modelling", "recognizably"). Check that the explanation of the "cost" is clear. (The cost is abandoning pure resemblance theory for a hybrid theory).

      *(Self-Correction during drafting)*: I need to be careful not to just say "Intentionality saves it." I need to explain *why* Step (2) specifically is the logical break. Step (2) claims perfect duplication eliminates the distinction *required* for representation. Why is that false? Because the distinction required is *ontological/historical*, not *qualitative*. Two things can be qualitatively identical but ontologically distinct (e.g., two minted coins). One can stand for the other. So the distinction *survives* perfect resemblance.

