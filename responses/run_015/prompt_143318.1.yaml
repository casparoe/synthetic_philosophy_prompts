      *   *Analysis of Step (2):* Explain the equivocation between *qualitative identity* and *numerical identity*. Explain that representation is an extrinsic relation (intentionality/causality), not an intrinsic one (resemblance).
      *   *The Cost:* Rejecting (2) means Resemblance Theory is incomplete. It needs a causal/intentional supplement. It saves Verisimilitude as a *virtue* rather than a *definition*.
      *   *Addressing Step (5):* Explain why the "idealized fraud" conclusion is a non-sequitur once (2) is gone.
      *   *Conclusion:* Reaffirm (1) and (6) are compatible once (2) is fixed.

  7.  **Self-Correction/Nuance Check:**
