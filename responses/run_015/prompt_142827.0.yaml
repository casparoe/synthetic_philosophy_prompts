      *   **Proposal C (Hybrid/Counterfeit):** Passes behavioral tests, fails architectural depth. *Verdict:* Counterfeit-Person.
      *   **Analysis of C:** Why Vendor is mad (want full standing for prestige/liability shield?), why Family is mad (want instrument to turn it off easily if it gets creepy/expensive). What remains unsettled (moral weight of the *resident's* attachment).

  5.  **Refining the Procedure (Iterative Polish):**
