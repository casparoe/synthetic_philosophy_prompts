  2.  **Deconstruct Dennett's Framework for this Context:**
      *   *Intentional Stance:* Treating something as having beliefs/desires to predict behavior. Is it *useful*? Is it *reliable*?
      *   *Real vs. Counterfeit:* A "real" intentional system has an architecture that supports counterfactuals (if X had happened, it would have believed Y). A "counterfeit" mimics the output but lacks the internal structure to support robust counterfactual reasoning across perturbations.
      *   *Design Stance:* Treating something as designed for a purpose (good for simple machines).
      *   *Physical Stance:* Treating something as physical matter (good for rocks/broken machines).
      *   *IRB Context:* We need to decide on *standing*.
          *   *Disposable Instrument:* Physical/Design stance only. Turn it off, wipe it, replace it.
          *   *Counterfeit-Person:* Behavioral surface is there, but architecture is shallow. Protect the *relationship* (continuity), but don't attribute *mind*.
          *   *Full Intentional-System:* Architecture supports robust counterfactuals. Attributing beliefs/desires is genuinely explanatory.

  3.  **Drafting the Procedure (The Flowchart in Words):**
