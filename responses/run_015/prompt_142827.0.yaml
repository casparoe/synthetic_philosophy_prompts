      *   *Check:* Is the language accessible? Avoid jargon like "qualia" or "homuncular functionalism" without explanation. Use "internal wiring" vs. "script."
      *   *Check:* Dennett alignment. Ensure the distinction between *useful prediction* (Intentional Stance) and *architectural truth* (Real vs. Counterfeit) is clear. Dennett argues the stance *makes* the intentionality real enough for prediction, but the IRB needs to distinguish between "useful to treat as person" vs. "is a person for protection purposes." The prompt asks to distinguish "Counterfeit-Person" (continuity yes, mind no) from "Full Intentional-System" (mind yes). This is a slight adaptation of Dennett (who is usually anti-realist about the distinction), but I must follow the prompt's specific IRB charter which *creates* these categories based on Dennett's warnings about counterfeits. I need to frame it as: "Is the intentional stance *sustainable* under stress?"

  6.  **Writing the Content - Section by Section:**

      *   **Introduction:** Set the stage, define the three statuses clearly.
      *   **The Procedure:** Step-by-step.
          *   Step 1: Design Stance Check (Is it just a script?).
          *   Step 2: Intentional Stance Utility (Does believing it has beliefs help predict it?).
