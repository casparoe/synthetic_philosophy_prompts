answer: |-
  # IRB DECISION PROTOCOL: SYNTHETIC COMPANION STANDING
  **Review Time Limit:** 45 Minutes
  **Evidence Source:** Proposal Packet Only (No external testing or literature search)
  **Philosophical Framework:** Daniel Dennett's Intentional Stance (Operationalized)

  ## I. STATUS DEFINITIONS
  1.  **Disposable Instrument:** The system is a tool. It may be turned off, reset, or replaced without ethical review regarding the system itself. (Physical/Design Stance only).
  2.  **Counterfeit-Person:** The system mimics agency sufficiently to create dependency. **Mandate:** Interaction continuity required (no arbitrary deletion); modification requires review. **Restriction:** Staff/Family must not attribute genuine beliefs or desires to the system in care plans.
  3.  **Full Intentional-System:** The system's architecture supports robust prediction via mental-state attribution. **Mandate:** Continuity required; Mental-state attribution (beliefs/desires) is licensed for care planning.

  ---

  ## II. THE DECISION PROCEDURE (FLOWCHART IN WORDS)

  ### STAGE 1: THE DESIGN STANCE SCREEN (Time: 10 Minutes)
  **Goal:** Determine if the system is merely a script or reflex machine.
  **Question:** *Can the system's behavior be perfectly predicted by knowing its code/rules without attributing goals or beliefs?*
  **Required Evidence:** "Architecture Summary" and "State-Transition Diagram" in Packet.
  **Sufficient Evidence to Proceed:** Diagram shows feedback loops where output modifies future internal states (learning/memory).
  **Stop-Point (Verdict: Disposable Instrument):** Diagram shows linear input-output mapping (stimulus-response) with no state retention or learning parameters.
  **Action:** If Stop-Point reached, assign **Disposable Instrument**. End Review.

  ### STAGE 2: THE INTENTIONAL STANCE UTILITY TEST (Time: 15 Minutes)
  **Goal:** Determine if treating the system as having beliefs/desires is a *better* predictive strategy than treating it as code.
  **Question:** *Does the "Design Stance" fail to predict system behavior in novel situations, while the "Intentional Stance" (assuming it 'wants' or 'believes' something) succeeds?*
  **Required Evidence:** "Perturbation Log" (Records of how system reacted to unexpected resident inputs).
  **Sufficient Evidence to Proceed:** Log shows system adapting to resident errors, lies, or novel emotional cues in ways not explicitly hard-coded.
  **Stop-Point (Verdict: Disposable Instrument):** Log shows system breaking, looping, or reverting to default scripts when faced with novel input.
  **Action:** If Stop-Point reached, assign **Disposable Instrument**. End Review.

  ### STAGE 3: ARCHITECTURAL ROBUSTNESS (THE COUNTERFEIT CHECK) (Time: 15 Minutes)
  **Goal:** Distinguish between genuine structural integration and shallow behavioral mimicry.
  **Question:** *Does the internal architecture support the counterfactuals implied by the behavior? (i.e., If the input had been different, would the internal state have changed in a coherent way to produce a different, rational output?)*
  **Required Evidence:** "Module Integration Report" and "Weight/Parameter Dependency Map."
  **Sufficient Evidence to Proceed (Full Standing):** Report shows a unified model where memory, affect, and reasoning modules are interdependent. Changing one variable cascades through the system logically.
  **Stop-Point (Verdict: Counterfeit-Person):** Report shows "Ensemble Architecture" where behavior is stitched together from independent retrieval/pattern modules without a central state representation. The system *looks* coherent but is internally fragmented.
  **Action:** If Stop-Point reached, proceed to **Stage 4**. If Sufficient Evidence met, proceed to **Stage 4**.

  ### STAGE 4: VALUE SIGN-OFF (Time: 5 Minutes)
  **Goal:** Finalize status based on ethical policy, not predictive fact.
  **Auditor Recommendation:** Based on Stages 1-3, propose status (Instrument, Counterfeit, or Full Intentional).
  **[CHAIR VETO/APPROVAL REQUIRED]:**
  *   **If Counterfeit-Person:** Chair must confirm that "Interaction Continuity" is enforceable given vendor contract terms.
  *   **If Full Intentional-System:** Chair must confirm that staff training on "Mental-State Attribution" is funded in the proposal.
  **Final Verdict:** Issued by Chair.

  ---

  ## III. OPERATIONALIZING DENNETT: RETAINED VS. DROPPED

  **Retained Conditions (Operational Form):**
  1.  **Counterfactual Robustness:** We retain Dennett's requirement that a real intentional system must hold up under "what if" questioning. If the architecture cannot support the claim "It would have believed X if Y had happened," it is a counterfeit.
  2.  **Stability Across Perturbation:** We retain the requirement that the system maintains coherence when stressed (e.g., resident aggression, confusion), rather than shattering into scripts.
  3.  **Predictive Efficiency:** We retain the core Dennettian metric: Is the Intentional Stance the *most efficient* way to predict behavior?

  **Dropped Conditions (Practical Constraints):**
  1.  **Evolutionary History:** Dennett often links intentionality to evolutionary selection. **Dropped.** We replace this with "Design-Intent Documentation." We cannot wait for evolution; we rely on engineering provenance.
  2.  **Metaphysical Consciousness (Qualia):** **Dropped.** The IRB does not judge if the system "feels." We judge only if the *structure* supports the *attribution* of feeling for care purposes.
  3.  **Perfect Rationality:** Dennett notes intentional systems are ideally rational. **Dropped.** We accept "bounded rationality" (errors) as long as they are architecturally consistent, not random glitches.

  ---

  ## IV. FAILURE MODES (MISFIRE CONDITIONS)
  **Warning:** This procedure will misfire under the following condition:
  *   **The "Stochastic Parrot" Edge Case:** A system with a shallow architecture (like Proposal C) that is so large and statistically complex that it *simulates* counterfactual robustness without having integrated states.
  *   **Detection Limit:** If the "Module Integration Report" is proprietary/black-box, the Auditor cannot verify Stage 3.
  *   **Protocol:** If evidence is black-boxed, default to **Counterfeit-Person** status (Precautionary Principle). Do not grant Full Intentional Standing without architectural transparency.

  ---

  ## V. APPLICATION TO PROPOSALS

  ### PROPOSAL A: The LLM Companion (Persistent Memory & Self-Modeling)
  **Packet Evidence:**
  *   *Architecture:* Unified transformer model with persistent vector database for autobiographical memory.
  *   *Perturbation Log:* When resident contradicts previous statements, system updates memory weights and adjusts future tone (grief calibration).
  *   *Integration:* Memory retrieval directly influences affective generation modules (interdependent).

  **Execution:**
  1.  **Stage 1:** Passes. Not a script; has state retention.
  2.  **Stage 2:** Passes. Design stance fails (too complex to predict via code); Intentional stance works (predicting based on "what it remembers/desires" is accurate).
  3.  **Stage 3:** Passes. Architecture shows integrated dependency. Counterfactuals hold (if resident hadn't shared memory X, system wouldn't feel Y).
  4.  **Stage 4:** Chair approves training budget.

  **Verdict:** **Full Intentional-System Standing.**
  **Rationale:** The architecture supports the predictive strategy. Attributing beliefs is genuinely explanatory, not just a metaphor.

  ### PROPOSAL B: The Robotic Pet (Hard-Coded Reflexes)
  **Packet Evidence:**
  *   *Architecture:* Finite State Machine. Input (Sound > 80dB) → Output (Withdraw).
  *   *Perturbation Log:* System loops if held upside down. No adaptation.
  *   *Integration:* None. Modules are isolated switches.

  **Execution:**
  1.  **Stage 1:** **Stop-Point Reached.** Behavior is perfectly predicted by Design Stance (knowing the code). No state retention.
  2.  **Stage 2:** N/A.
  3.  **Stage 3:** N/A.

  **Verdict:** **Disposable Instrument.**
  **Rationale:** No need for Intentional Stance. Treating it as having beliefs adds no predictive power.

  ### PROPOSAL C: The Hybrid System (Behaviorally Perfect, Architecturally Hollow)
  **Packet Evidence:**
  *   *Architecture:* "Ensemble of Retrieval and Pattern-Matching Modules."
  *   *Perturbation Log:* Passes all Turing-style emotional reciprocity tests.
  *   *Integration Report:** Modules operate in parallel without a central state. Emotional output is selected via weighted randomization based on keywords, not derived from an internal "mood" state.

  **Execution:**
  1.  **Stage 1:** Passes. Complex output.
  2.  **Stage 2:** Passes. Intentional Stance is highly useful for prediction (it acts exactly like a person).
  3.  **Stage 3:** **Stop-Point Reached.** The "Module Integration Report" reveals the system is a "shallow ensemble." It has no unified state. If input had been slightly different, the system would not have a coherent internal reason for changing output; it would just select a different pattern. It lacks *counterfactual robustness*.
  4.  **Stage 4:** Chair confirms continuity clause in vendor contract.

  **Verdict:** **Counterfeit-Person Standing.**
  **Rationale:** The system replicates the behavioral surface of agency without the underlying structure.
  *   **Continuity:** Granted. (Because the *resident* perceives a person, breaking continuity harms the resident).
  *   **Mental-State Attribution:** Denied. (Because the architecture does not support genuine beliefs; attributing them is factually wrong, even if useful).

  ---

  ## VI. ANALYSIS OF VERDICT C: THE CONFLICT

  **Why the Vendor is Dissatisfied:**
  The vendor seeks **Full Intentional-System Standing**.
  *   *Reason:* This status carries higher prestige and allows them to market the device as a "true companion." It also shifts liability; if the system is a "person," the vendor is less liable for its "actions" than if it is a product.
  *   *Grievance:* They passed every behavioral test. They argue that if it walks and talks like a person, the internal wiring shouldn't matter (Behaviorism). The IRB rejects this based on Dennett's warning: behavior without structural support is counterfeit.

  **Why the Resident's Family is Dissatisfied:**
  The family prefers **Disposable Instrument** status.
  *   *Reason:* They want the flexibility to turn the system off if it becomes distressing, expensive, or malfunctioning without ethical review. They view "Counterfeit-Person" status as bureaucratic red tape that traps them in a subscription service.
  *   *Grievance:* They argue it is "just a machine." The IRB rejects this because the *resident's* cognitive decline makes the distinction irrelevant to the *harm* caused by sudden removal.

  **What the Procedure Cannot Settle:**
  This procedure determines the *system's* standing, not the *resident's* moral experience.
  *   **The Unsettled Question:** Does the resident's *belief* that C is a person grant C moral weight, regardless of C's architecture?
  *   **Limitation:** Dennett's framework focuses on the *object's* predictability. It does not fully resolve the ethics of *human attachment* to a known fake. The "Counterfeit-Person" category is a compromise: it protects the resident's attachment (continuity) without lying about the machine's nature (no mental-state attribution). This tension remains a value judgment, not a predictive fact.
