          1.  Validate the tension (it's a classic debate).
          2.  Break down Tom's point (the philosophy).
          3.  Break down the counter-point (why Priya still counts).
          4.  Address the practical stakes (the council meeting).
          5.  Verdict on fairness.

      *   *Refining the Philosophy:* Make sure to mention Harry Frankfurt. It gives weight to the explanation. Explain that the *actual sequence of events* matters more than the *counterfactual* (what the brother might have done).
      *   *Refining the Social Aspect:* Point out that denying Priya credit might feel like gaslighting her agency. She knows why she signed.
