answer: |-
  This is a surprisingly deep debate for a flat kitchen, but you've actually stumbled onto a classic problem in moral philosophy. To give you a neutral take: **You are being fairer to the reality of the situation, while Tom is being philosophically pedantic in a way that doesn't apply here.**

  Here is the breakdown of why Tom's argument feels "off" to you, why Priya deserves the credit, and how to handle the council meeting rep issue.

  ### 1. The Philosophy: Tom vs. Frankfurt
  Tom is arguing from a concept called the **Principle of Alternative Possibilities (PAP)**. This principle suggests that a person is only morally responsible for an action if they could have done otherwise. Tom's logic is: *Because the brother threatened to force her hand, Priya technically "couldn't have done otherwise," therefore she gets no credit.*

  However, philosophers (most notably Harry Frankfurt) have spent decades debunking this exact scenario. These are called **"Frankfurt-style cases."**

  *   **The Consensus:** If an agent (Priya) acts on their **own motivation** before the coercion (the brother) kicks in, they are responsible and praiseworthy.
  *   **The Reality:** The brother's threat was a "backup plan" that remained inert. It did not cause Priya's action. Her own desire to save the library caused the action.
  *   **The Verdict:** In ethics, we judge the **actual sequence of events**, not the hypothetical one. Since the brother didn't intervene, Priya's will was free. Tom is prioritizing a theoretical constraint over the actual psychological reality.

  ### 2. The Psychology: Agency and Motivation
  Beyond the philosophy, Tom's stance ignores Priya's internal state.
  *   **Priya's Experience:** She signed because she values the library. She has stated clearly that she wasn't thinking about her brother when she clicked "sign."
  *   **Tom's Erasure:** By saying she "couldn't have done otherwise," Tom is effectively telling Priya that she doesn't know her own mind. He is invalidating her genuine preference because of an external threat that never materialized.
  *   **Fairness:** It is unfair to deny someone credit for an action they willingly performed just because a hypothetical scenario existed where they might have been forced. If I choose to eat an apple, but my friend says "I would have forced you to eat it if you didn't," I still chose the apple.

  ### 3. The Practical Stakes: The Council Meeting
  This is the most important part. This isn't just about moral credit; it's about who represents the flat.
  *   **Stakeholder Interest:** Priya is the one who uses the library to revise. She is the one most affected by the opening hours. A representative is most effective when they have a personal stake in the outcome.
  *   **Motivation:** Priya has proven she is motivated to act (she signed early). Tom's argument suggests she is passive, but the evidence shows she is active.
  *   **Tom's Role:** If Tom wants to go to the meeting, he should argue based on his own availability or speaking skills, not by trying to disqualify Priya on a technicality.

  ### The Neutral Verdict
  **You are right.** Tom is applying a rigid philosophical rule to a nuanced human situation and getting it wrong.

  *   **On Credit:** Priya deserves credit. She acted on her own volition. The existence of a threat that wasn't used does not negate her choice.
  *   **On Representation:** Priya is the logical choice for the council meeting because she is the primary user of the library and has demonstrated initiative.
  *   **On Tom:** He is technically arguing about "free will," but socially he is moving the goalposts. It comes across as gatekeeping or perhaps he just wants to go to the meeting himself.

  ### How to Resolve It
  Since you're all flatmates, you want to avoid this becoming a permanent rift. Here is a suggested approach:

  1.  **Acknowledge Tom's Intellect:** "Tom, I get the philosophical point you're making about coercion and free will. It's an interesting debate."
  2.  **Pivot to Reality:** "But in this specific case, the coercion didn't happen. Priya acted on her own before the deadline. In ethics, the actual cause matters more than the hypothetical backup plan."
  3.  **Focus on the Goal:** "For the council meeting, we need the person with the biggest stake. That's Priya, since she revises there. If we send someone who isn't the primary user, the council might see it as less genuine."
  4.  **Compromise (if needed):** If Tom is desperate to be involved, suggest Priya goes as the speaker, but Tom helps prepare the arguments or goes along for support.

  **Summary:** Priya signed because she wanted to. The brother is irrelevant to the actual event. Priya should get the credit and the rep role. Tom is overthinking it.
