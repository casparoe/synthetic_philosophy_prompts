          *   *Replication:* It's not the kind of thing you "replicate" in a lab in the traditional sense because it relies on common knowledge and specific payoff structures. Behavioral economics has tested similar public goods games, but calling the lack of replication evidence of a theoretical concession is a stretch.
          *   *Verdict:* Misleading. The lottery *was* run. The "concession" is likely an interpretation of Hofstadter acknowledging human irrationality, not a theoretical retraction.

