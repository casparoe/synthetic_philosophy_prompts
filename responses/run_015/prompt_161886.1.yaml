answer: |-
  1. **Strength of the Hypothesis.** H1 is stronger by the criterion of *belief falsification*. It negates both the physical world and the existence of other minds, maximizing the scope of error. H2 preserves social beliefs, falsifying only claims about physical embodiment and fundamental physics. However, if the criterion is *metaphysical discrepancy* (how far reality diverges from appearance), H2 may be stronger, as it posits a stable, shared reality that is nonetheless fundamentally alien. **Contested Commitment:** Whether skepticism's power is measured by the breadth of doubt (H1) or the depth of metaphysical error compatible with coherence (H2). If indistinguishability is the sole criterion, they tie; if auxiliary assumptions count, H2 is costlier (requiring synchronized multi-brain hardware).

  2. **The Target of Skepticism.** H1 threatens world independence and other minds equally. H2 threatens world independence (physics/embodiment) but secures other minds within the simulation. The traditional deceiving-deity scenario primarily targeted *world independence* (that objects exist apart from us), not necessarily solipsism. Thus, H2 is the structural successor to the traditional argument, while H1 conflates external-world skepticism with solipsism. **Contested Commitment:** Whether "external world" skepticism inherently includes other subjects or merely physical objects. If the latter, H2 isolates the traditional threat more precisely; if the former, H1 captures the full Cartesian anxiety.

  3. **Closure and Knowledge.** Under H1, "I am conversing" is false; the closure principle easily denies knowledge. Under H2, "I am conversing" is functionally true; the antecedent survives, weakening the argument from ignorance regarding social facts. The skeptical force relocates to "I am embodied." The argument from hallucination behaves differently: in H1, all experience is hallucination; in H2, experience is veridical regarding other simulators, though not regarding physics. **Contested Commitment:** Whether "conversation" entails physical co-presence or only functional counterfactual dependence. If the latter, H2 blocks the skeptical move on social knowledge; if the former, H2 collapses into H1.

  4. **Semantic Reply.** In H1, "vat" refers to sim-vats, making "I am a vat" false. In H2, subjects are causally linked to real hardware and other brains. This causal chain potentially restores reference to real entities, escaping the self-refutation that plagues H1. However, reference to *components* (other brains) may not suffice for reference to the *system* (the host world). **Contested Commitment:** Whether causal connection to components of a system suffices for reference to the system itself. If yes, H2 escapes the semantic trap; if no, the Putnamian reply survives unchanged, treating H2 as merely a complex H1.

  5. **Computer-Mediated Interaction.** There is no non-question-begging way to decide if sim-coupling counts as shared-world interaction. If "real interaction" requires shared physics, H2 fails. If it requires functional coupling, H2 succeeds. Any answer presupposes a stance on the nature of social reality. **Contested Commitment:** Functionalism vs. Substrate Physicalism. The contrast isolates whether social reality is constituted by structure (H2 succeeds) or stuff (H2 fails). If the latter, the contrast between H1 and H2 is illusory; both are equally solitary relative to the host world.

  6. **Hierarchical Regress.** If reality degrades with mediation, the hierarchy collapses to H1 at the limit; every level is ultimately solitary relative to the base. If functional reality is level-invariant, each layer is a genuine shared world, and skeptical force generates only at the boundary between the top simulation and base reality. **Contested Commitment:** Whether ontological status is transitive across simulation layers. If transitive, H2 is stable at every level; if not, H2 inherits H1's instability eventually. The skeptical force lies in the gap between levels, not within them.

  **Recommendation.** I would put H2 at the centre. It forces students to disentangle social realism from physical realism, preventing them from solving external-world skepticism by retreating to social certainty. It complicates the semantic reply and closure arguments in productive ways. However, I would concede to a proponent of H1 that it remains the stronger hypothesis for generating radical solipsistic anxiety. If the seminar's goal is to maximize doubt rather than refine definitions of interaction, H1 is the more efficient tool. H2 is better for analyzing the structure of reference and social ontology; H1 is better for testing the limits of knowledge claims simpliciter.
