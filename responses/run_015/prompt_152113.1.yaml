      Start with the analogy's structure. The argument posits that substance use disorder functions physiologically like diabetes or asthma, meaning the individual lacks full voluntary control over their consumption, much like a diabetic lacks control over insulin production. In this mapping, the drug corresponds to the biological marker, such as blood sugar levels, and the criminal justice system corresponds to a misguided attempt to punish a biological inevitability. The proposed solution maps medical intervention onto legal punishment, suggesting that a doctor is the appropriate authority figure rather than a police officer. This framing is designed to shift the societal response from moral condemnation to medical management, implying that incarceration is as scientifically illiterate as arresting someone for having a seizure.

      However, the mapping fractures when you examine the legal and economic context surrounding the condition. Diabetes is not illegal, and insulin is not sold on a black market, whereas drug possession is criminalized and supply is often restricted to illicit channels. This means the state is not just responding to a health condition but actively managing the legality of the substance itself, creating a dynamic where the mere existence of the supply chain is a crime, unlike the regulated pharmaceutical industry for asthma inhalers. Furthermore, the analogy assumes that everyone charged with possession suffers from the disease, but data often shows that many individuals arrested for simple possession are recreational users without dependency. Punishing a recreational user is not analogous to punishing a diabetic, but rather to punishing someone for buying sugar, which complicates the claim that all possession is a symptom of illness. Additionally, framing addiction strictly as a disease can justify coercive state power under the doctrine of parens patriae, where the state commits individuals to treatment against their will for their own good, potentially resulting in less freedom than a criminal sentence that offers due process protections.

      When applying this analogy to the three policy options your council is considering, the fit varies significantly. The option to keep possession criminal but divert arrestees into treatment aligns partially with the disease model by prioritizing health outcomes, yet it retains the criminal label that the disease analogy seeks to eliminate, effectively treating the disease as a crime that can be waived if treatment is accepted. The Portugal-style decriminalization model, where possession is handled by administrative panels rather than courts, aligns most closely with the analogy because it removes the criminal stain entirely and treats the behavior as a regulatory or health issue rather than a moral failing, mirroring how a medical board might handle a health violation rather than a criminal court. The option for licensed commercial cannabis sales, however, moves beyond the disease framework into a regulation model that treats the drug like alcohol or tobacco, which implies that use can be voluntary and recreational without necessarily being pathological, thereby contradicting the premise that all use is a symptom of a disease requiring management.

      To test the robustness of the analogy, imagine a drug that produces strong compulsive use but causes no measurable health damage and no impairment to daily functioning. If the conclusion rests solely on the disease framing of compulsion, then the state should still decriminalize use but mandate treatment for the compulsion itself, regardless of harm. However, if the conclusion rests on harm reduction, then there is no justification for intervention at all, since there is no health damage to mitigate. This suggests that the disease analogy may be resting on the assumption of harm rather than just the presence of compulsion, because society generally does not mandate treatment for harmless compulsions. If the drug is harmless, the disease model loses its urgency, implying that the decriminalization argument is actually driven by a desire to reduce the collateral damage of prohibition rather than solely to treat a medical condition. Consequently, a better comparison for what decriminalizers actually want might be a liberty or autonomy framework, similar to the right to refuse medical treatment or the right to engage in risky but consensual behaviors, which argues that adults should be free to manage their own consciousness provided they do not harm others, rather than arguing that they are too sick to be held responsible. This shift moves the debate from whether the user is capable of choice to whether the state has the right to intervene in private choices, which may offer a more stable foundation for policy than a medical analogy that can be twisted to justify forced confinement.

