answer: |-
  This is a classic case of a popularization oversimplifying a technical result to the point of distortion. Your friend is right to be suspicious. The chapter you read has conflated distinct projects (Adams's vs. Stalnaker's), misidentified the mechanics of Lewis's proof, and attributed a conclusion to Lewis that he explicitly rejected.

  Here is the audit you asked for. I will break down the landscape, audit your reconstruction claim-by-claim, and then tell you what actually survives.

  ### 1. The Landscape: Where the Fault Lines Are

  To understand where the chapter went wrong, you need to see the three distinct positions that get smeared together in popular accounts:

  1.  **The Truth-Conditional Project (Stalnaker):** Conditionals express propositions. They are true or false. We want a semantics (truth conditions) that matches our intuitions. Stalnaker tried to make the truth conditions match Adams's probabilities.
  2.  **The Probabilistic/Assertibility Project (Adams):** Conditionals do *not* express propositions. They have no truth value. They only have conditions of *assertibility* (or acceptability), which are measured by conditional probability. Adams never claimed $P(A \to C)$ was the probability of a *truth*; he claimed the *degree of belief* in the conditional equals $P(C|A)$.
  3.  **The Triviality Result (Lewis):** Lewis showed that if you assume (1) — that conditionals are propositions with truth values — and you also demand that their probabilities obey Adams's equation, you get a contradiction (triviality).

  **The Fault Line:** Lewis's result kills the combination of (1) and Adams's equation. It does *not* kill Adams's equation if you drop (1). The chapter you read assumes Lewis killed Adams's equation outright and that the only survivor is the Material Conditional view. Both are false.

  ### 2. Audit of the Reconstruction

  I will go through your reconstruction of the chapter's argument and categorize each claim.

  **Claim 1:** *"The thesis... credits to Adams and Stalnaker together, is that the probability of an indicative conditional 'if A, then C' just is the conditional probability of C given A."*
  *   **Verdict:** **(2) Defensible Simplification (with a major caveat).**
  *   **Analysis:** The equation $P(A \to C) = P(C|A)$ is indeed the core mathematical commitment. However, crediting them "together" obscures a vital difference. Stalnaker thought this equation held because the conditional *was a proposition* whose truth conditions made the probability work out. Adams thought the equation held precisely because the conditional *was not a proposition*. Lumping them together sets up the confusion that follows.

  **Claim 2:** *"That's supposed to explain a lot about how we reason... why you can be confident that the picnic will be cancelled if it rains while having no particular view about whether it will rain."*
  *   **Verdict:** **(1) Accurate.**
  *   **Analysis:** This is the standard intuitive motivation for the Thesis. It captures the disconnect between the probability of the antecedent and the probability of the conditional.

  **Claim 3:** *"Lewis proved is that this can't work. Take a language that contains conditionals and is closed under conditionalization... Then the equation forces P(C | A) to collapse into plain P(C)."*
  *   **Verdict:** **(1) Accurate.**
  *   **Analysis:** This is the core of Lewis's 1976 result. If conditionals are propositions (can be assigned probabilities and can serve as conditions for further probabilities), and Adams's Thesis holds for *all* probability functions, then $P(C|A) = P(C)$. This implies $A$ and $C$ are probabilistically independent, which is absurd for arbitrary sentences.

  **Claim 4:** *"The engine of the whole proof... is that conditional probability is undefined when the antecedent has probability zero, which is why the thesis turns out to be so fragile."*
  *   **Verdict:** **(3) Wrong.**
  *   **Analysis:** This is a serious misunderstanding of the logic. Lewis's proof does not rely on division by zero or $P(A)=0$. In fact, the proof assumes $P(A) > 0$ so that $P(C|A)$ is well-defined.
      *   *The Actual Engine:* The proof uses the **Law of Total Probability**. It expands $P(A \to C)$ by conditioning on whether $(A \to C)$ is true or false.
      *   *Roughly:* $P(A \to C) = P(A \to C \mid A \to C)P(A \to C) + P(A \to C \mid \neg(A \to C))P(\neg(A \to C))$.
      *   When you substitute Adams's Thesis into this expansion, the algebra forces the probability of the conditional to depend only on the unconditional probability of the consequent. The fragility comes from the assumption that the conditional is a *proposition* that can be conditionalized *upon*, not from undefined values.

  **Claim 5:** *"So the upshot is that Adams's Thesis is refuted."*
  *   **Verdict:** **(3) Wrong (Conflation).**
  *   **Analysis:** Lewis's result refutes the thesis *for truth-conditional propositions*. It does not refute Adams's Thesis for *assertibility*. Adams explicitly denied that conditionals have truth values. Since Lewis's proof assumes conditionals have truth values (to be inputs for the probability function), the proof simply bypasses Adams's actual position. It refutes Stalnaker's attempt to give Adams's Thesis truth conditions, not Adams's Thesis itself.

  **Claim 6:** *"Lewis was right to conclude that the indicative conditional is just the material conditional, true whenever its antecedent is false."*
  *   **Verdict:** **(3) Wrong.**
  *   **Analysis:** Lewis never concluded this. This is likely a confusion with H.P. Grice or Frank Jackson. Lewis's own view was that indicative conditionals are context-sensitive and likely do not express standard propositions (or express propositions that vary with context). He took the triviality result as evidence *against* simple truth-conditional semantics, not as evidence *for* the material conditional. The material conditional violates Adams's Thesis (if $A$ is false, $A \to C$ is true, so $P(A \to C)$ would be high even if $P(C|A)$ is low). Lewis knew this.

  **Claim 7:** *"There isn't really a logic of indicative conditionals."*
  *   **Verdict:** **(3) Wrong.**
  *   **Analysis:** Adams developed a rigorous logic of conditionals (Adams' Logic). It is a probabilistic logic where validity is defined as the preservation of high probability (or uncertainty), not truth. The triviality results show there is no *truth-conditional* logic that matches our probabilistic intuitions, not that there is *no* logic.

  **Claim 8:** *"The same thing happens with counterfactuals like 'if Oswald hadn't shot Kennedy, someone else would have.'"*
  *   **Verdict:** **(3) Wrong.**
  *   **Analysis:** Counterfactuals are standardly treated with possible worlds semantics (Stalnaker/Lewis). These semantics *violate* Adams's Thesis (specifically, they violate the principle of Import-Export). Philosophers generally accept that counterfactuals have truth conditions but do not obey $P(A \boxright C) = P(C|A)$. The triviality results apply to indicatives under the assumption they obey Adams's Thesis; they don't flatten the distinction between indicatives and counterfactuals.

  ### 3. What Survives? (The Corrected Conclusions)

  If we strip away the errors in the chapter, here is what Lewis's triviality result actually establishes:

  1.  **No Proposition + Thesis Combo:** You cannot have it both ways. You cannot maintain that indicative conditionals express standard propositions (with truth values) *and* that their probability always equals the conditional probability $P(C|A)$. One must go.
  2.  **The Fork in the Road:**
      *   **Option A (Keep Propositions):** You keep truth conditions but abandon Adams's Thesis. (This is the Stalnaker/Lewis possible worlds route). You accept that sometimes $P(A \to C) \neq P(C|A)$.
      *   **Option B (Keep Adams's Thesis):** You keep the equation but abandon truth conditions. (This is Adams's route). You say conditionals are not propositions; they are inference tickets or rules for updating belief. They are not "true" or "false," so Lewis's proof (which requires them to be true/false) doesn't apply.
  3.  **Material Conditional is Dead:** The result does not revive the material conditional. The material conditional is a proposition, and it fails Adams's Thesis. So the triviality result doesn't save it; it just shows that *no* proposition-based semantics can save Adams's Thesis.

  ### 4. The Defender's Reply

  If you were to ask a defender of Adams's Thesis (like Adams himself, or later proponents like Dorothy Edgington or Richard Bradley) how they respond to Lewis, they would say this:

  > "Lewis proved that conditionals cannot be *propositions*. We agree. We never said they were.
  >
  > Lewis's proof assumes that 'If A, then C' names a thing in the world (a proposition) that can be true or false, and that we can ask about the probability of that thing being true. We deny this.
  >
  > When we say $P(\text{If A, C}) = P(C|A)$, we are not describing the probability of a truth. We are describing the *strength of the conditional belief*. To believe 'If it rains, the picnic is cancelled' is not to believe a fact; it is to be disposed to believe 'the picnic is cancelled' upon learning 'it rains'.
  >
  > Lewis's math works perfectly if you assume conditionals are propositions. Since the math leads to absurdity (independence), the assumption must be wrong. Conditionals are not propositions. Therefore, the triviality result is actually an argument *for* our view, not against it."

  ### Summary Judgment

  Your friend is correct. The chapter is unfair to both Lewis and Adams.
  *   **Unfair to Adams:** It treats his thesis as a claim about truth probabilities, which he explicitly denied.
  *   **Unfair to Lewis:** It attributes to him the conclusion that conditionals are material, which he rejected.
  *   **Technically Flawed:** It misidentifies the mathematical engine of the proof (confusing it with undefined division).

  **Who to trust:** Trust the friend. The triviality results are real and powerful, but they establish that **conditionals are not truth-apt propositions**, not that Adams was wrong or that the material conditional is right. The chapter you read took a subtle impossibility theorem and turned it into a dogmatic claim that "conditionals are just material implication," which is a position most contemporary philosophers of language reject.
