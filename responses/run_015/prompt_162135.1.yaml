  **MEMORANDUM**

  **To:** Senate Committee on International Academic Partnerships
  **From:** Undergraduate Student Member
  **Subject:** Recommendation on University of Maritsa Exchange Agreement
  **Date:** October 26, 2025

  **Recommendation**
  I recommend **conditional suspension** of the exchange agreement for a period of **24 months**. During this period, student mobility may continue only if individual learning agreements are vetted for curriculum interference; faculty exchanges and joint research grants are paused.

  **Application of the Three-Part Test**
  Our committee requires a standard for "sustained erosion." Applying your proposed test to the stipulated dossier yields the following:

  1.  **Asymmetric Entrenchment:** **Met.** The 2021 transfer of universities to "public interest trusts" with ministerial appointees serving nine-year terms (Fact 1) creates a governing horizon exceeding typical electoral cycles. Combined with the 2025 replacement of the independent faculty association with a ministry-approved list (Fact 4), reversal by a future majority is structurally harder than enactment was for the incumbent one.
  2.  **The Two-Audience Test:** **Unclear/Speculative.** The dossier does not provide the text of domestic official registers versus English-language ministry releases. However, the justification for withdrawing Gender Studies accreditation ("labour-market demand," Fact 2) versus the foreign-influence statute's framing ("transparency," Fact 3) suggests a gap between technocratic domestic reasoning and security-focused external signaling. Without documents, this criterion distorts the case by demanding evidence we do not possess.
  3.  **The Burden-of-Proof Rule:** **Met.** The 2021 electoral rewrite (Fact 1) and the 2024 syllabi objection power (Fact 3) alter the rules of political and academic competition. The incumbent government has not demonstrated why ministerial objection to reading lists is necessary for academic quality, shifting the burden appropriately to them to prove non-erosion.

  **Engagement with Counterarguments**
  The Rector's submission deserves serious engagement. Her argument that each measure has a "democratic analogue" is strongest when viewed in isolation. Foundation-governed universities and union recognition rules exist elsewhere. However, this argument fails when viewing the *cumulative* effect. While analogues exist, their combination here—specifically the entrenchment of appointees beyond electoral accountability coupled with direct curriculum oversight—creates a system distinct from settled democracies.

  Regarding standing: Clause 7(c) contractually grants us standing to assess "institutional autonomy," not to grade the constitutional order broadly. We are enforcing a contract, not judging a state.

  Regarding the *tu quoque* (our own democracy scores falling): Our legislature's restrictions on teaching are subject to judicial review and electoral reversal within standard cycles. Maritsa's structural changes (nine-year terms, dissolved unions) insulate decisions from those same corrective mechanisms. Acknowledging our flaws does not validate theirs.

  **Evaluation of the Test**
  Your test provides necessary structure but varies in utility. **Asymmetric Entrenchment** does real work; it isolates the mechanical lock-in that defines erosion versus policy disagreement. **The Burden-of-Proof Rule** merely relabels the dispute; it tells us who should speak, not what the facts are. **The Two-Audience Test** risks distorting the case here because it relies on documentary evidence not in the dossier, potentially penalizing opaque bureaucracies while rewarding transparent autocracies.

  **Conditions and Triggers**
  Suspension lifts only upon verification of:
  1.  Restoration of an independent faculty association with officers elected without ministry approval.
  2.  Removal of ministerial objection authority over departmental syllabi.
  3.  Re-accreditations decided by peer review rather than ministerial appointees.

  **Exile Association**
  We should **defer** recognition of the Maritsa Faculty Association in Exile. While their plight is sympathetic, recognizing a breakaway group undermines the principle of institutional continuity we seek to restore.

  ***

