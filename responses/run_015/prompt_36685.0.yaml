prompt: |-
  I run a small blog that's mostly read by people who think way too much about anthropic reasoning and existence risk. For the past year two of my most prolific commenters have been at war over SSA vs SIA — the self-sampling assumption vs the self-indication assumption, if you know the terms, and if you don't here's the whole background so nobody has to search anything. The SSA person thinks you should reason as if you're a random sample from the observers in your reference class, so a theory's a priori probability isn't boosted just for positing more people. The SIA person thinks finding yourself to exist is itself evidence that favors theories with more observers — you're more likely to find yourself somewhere there are more findable-yous. One is basically a fan of Bostrom's SSA, the other thinks SSA hands you the Doomsday Argument for free and refuses to touch it.

  They've gone through the entire spiral: the Doomsday Argument, Sleeping Beauty (thirders vs halfers, which maps onto this fight in a way they argue about too), the presumptuous philosopher (two cosmological theories that both fit the data equally well, but one posits trillions of times more observers — SIA says that theory is now overwhelmingly more likely, SSA says it gets no boost, and most people's intuition is that the SIA move is nuts, but SIA folks bite the bullet), reference classes (SSA has to say *which* observers you're a sample of and every choice looks arbitrary), and big/infinite worlds (SIA seems to go insane or just break when there are so many observers that everything gets dominated by universes full of Boltzmann-brain-ish weirdos). At this point they're posting past each other and everyone else has stopped opening the threads.

  So I've bullied them into an adversarial collaboration and they actually agreed, probably because each is convinced they'll obviously win. They asked me to draft the joint statement since I'm "the only neutral-ish one". I am not neutral — I lean SSA — which is exactly why I need you to draft it instead, so it doesnt come out tilted.

  The document should have:

  1. A numbered section of agreed claims — things both could genuinely put their name to about what anthropic evidence is and isn't, what's wrong with the naive view that ignores observer-selection effects entirely, and whatever common ground actually exists (e.g. maybe both agree the presumptuous philosopher case is uncomfortable for *someone*, even while disagreeing about who).

  2. A disagreements table. Each row is one disagreement, stated twice: once in wording the SSA person would sign, once in wording the SIA person would sign. No weaseling — if a formulation is vague enough that both sides nod along to it, it belongs in section 1, not here.

  3. The cruxes. My guesses: whether "I exist" is evidence that favors many-observer theories, whether Doomsday-style conclusions are a bug or a feature of anthropic reasoning, and whether SIA is doing legitimate confirmation or just double-counting (counting the observer once as evidence and once as the one doing the confirming). But find the real cruxes, and for each, state the case or argument both sides would agree bears on it — some concrete scenario, a Sleeping Beauty variant, a simulation-hypothesis case, whatever works — with each side's prediction written down in advance, before the case is "run".

  4. If any part of their fight is really verbal — like they're implicitly defining "this evidence" differently, or one means probability-on-waking-up and the other probability-across-the-whole-experiment — flag which part and why.

  Two extra requests. First, since I lean SSA: actively watch for places where you've made the SIA side sound dumber than it is, or quietly let SSA off the hook. In particular, do not let the agreed-claims section smuggle in that reference classes are unproblematic, because they're not and both of them know it. Second, I have to stand in front of these two pedants and defend every sentence, so end with a short honest note: how confident you are that each side would actually sign the formulations attributed to them, and the single formulation or crux you're least sure about — the one most likely slanted in a way you didn't notice.

  Format: numbered agreed claims, then the table, then cruxes with predictions, then the verbal-dispute bit, then the confidence note at the end.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Context:** A blog read by anthropic reasoning/existential risk enthusiasts. Two commenters (SSA vs. SIA) are feuding. They've agreed to an adversarial collaboration.
      *   **Task:** Draft a joint statement document.
      *   **User's Stance:** Leans SSA (needs me to be neutral to avoid bias).
      *   **Requirements:**
          1.  Numbered Agreed Claims (common ground, acknowledging observer-selection effects, admitting difficulties).
          2.  Disagreements Table (Row = Issue, Col 1 = SSA phrasing, Col 2 = SIA phrasing).
          3.  Cruxes (Key disagreements, concrete scenarios/tests, pre-registered predictions).
          4.  Verbal Dispute Analysis (Are they talking past each other?).
          5.  Confidence Note (Honest assessment of signability and potential bias).
      *   **Constraints:** Do not make SIA look dumb. Do not let SSA off the hook on reference classes. Must be defensible to pedants.

  2.  **Deconstruct the Subject Matter (SSA vs. SIA):**
      *   **SSA (Self-Sampling Assumption):** Reason as if you are a random sample from your reference class. $P(H|E) \propto P(E|H) \times P(H)$. "I exist" is not new evidence favoring large populations *per se*, but "I am this specific observer" is the indexical fact. Leads to Doomsday Argument (DA). Struggles with Reference Class definition.
      *   **SIA (Self-Indication Assumption):** Reason as if you are a random sample from *all possible* observers. $P(H|E) \propto P(E|H) \times P(H) \times N_H$ (where $N_H$ is number of observers). "I exist" favors hypotheses with more observers. Avoids DA. Leads to Presumptuous Philosopher (PP) problem. Struggles with Infinite Worlds/Boltzmann Brains.
      *   **Common Ground:** Naive reasoning ignores observer selection. Sleeping Beauty is relevant. Both have counter-intuitive implications.

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Goal:* Establish baseline without smuggling in SSA/SIA specifics.
      *   *Point 1:* Observer Selection Effects (OSE) matter. We can't ignore that we are observers.
      *   *Point 2:* Naive conditioning is wrong. Just updating on "data exists" isn't enough; must update on "data exists *and* we observed it."
      *   *Point 3:* Reference classes are problematic. (Crucial per prompt instructions). Both admit this is a weak point for their frameworks.
      *   *Point 4:* Counter-intuitive results exist for both. DA is weird for SIA (they reject it), PP is weird for SSA (they reject it). Both admit their view has "bullets to bite."
      *   *Point 5:* Infinite worlds break standard probability. Both agree standard anthropic reasoning struggles with infinities (measure problem).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Goal:* Sharp contrast. No weaseling.
      *   *Issue 1: The Evidence of Existence.*
          *   SSA: "I exist" is not evidence favoring larger populations, only that the population is non-zero.
          *   SIA: "I exist" is evidence proportional to the number of observers in the hypothesis.
      *   *Issue 2: The Doomsday Argument.*
          *   SSA: DA is a valid (though unsettling) consequence of correct anthropic reasoning.
          *   SIA: DA is a reductio ad absurdum proving SSA is false.
      *   *Issue 3: The Presumptuous Philosopher.*
          *   SSA: PP's confidence is unjustified; theory size doesn't grant probability boost.
          *   SIA: PP is correct; we should be extremely confident in the larger universe theory.
      *   *Issue 4: Reference Class.*
          *   SSA: Reference class must be restricted (e.g., "observers with my evidence") to avoid absurdities, though the boundary is fuzzy.
          *   SIA: Reference class should be all possible observers (or as broad as possible); restriction is ad hoc to avoid DA.

  5.  **Drafting Section 3: The Cruxes:**
      *   *Goal:* Concrete tests/scenarios where predictions diverge.
      *   *Crux 1: Is "I exist" evidence?* (The core philosophical split).
          *   *Scenario:* The "God's Coin Toss" (Head: 1 person created, Tails: 1 million people created). You wake up. What are odds it was Tails?
          *   *SSA Prediction:* 50/50 (or depends on reference class, but no boost from numbers).
          *   *SIA Prediction:* 1,000,000 to 1 in favor of Tails.
      *   *Crux 2: Double Counting vs. Bayesian Update.*
          *   *Scenario:* A variation of Sleeping Beauty where the number of awakenings depends on a coin flip.
          *   *SSA Prediction:* Halfer position (probability of Heads is 1/2).
          *   *SIA Prediction:* Thirder position (probability of Heads is 1/3).
          *   *Note:* Need to ensure this maps correctly. Usually, SIA -> Thirder, SSA -> Halfer.
      *   *Crux 3: The Cost of Being Wrong (Decision Theory link).*
          *   *Scenario:* Betting on the outcome of the God's Coin Toss.
          *   *SSA:* Bet 50/50.
          *   *SIA:* Bet heavily on Tails.
          *   *Agreement:* If everyone in the universe bets this way, which strategy yields more total utility vs. which yields better individual calibration? (This is often where UDT/EDT comes in, but keep it simple). Let's stick to the *explanation* of the probability.
      *   *Refinement on Cruxes:* The prompt asks for "the case or argument both sides would agree bears on it."
      *   *Selection:*
          1.  **The "God's Coin Toss" (Self-Indication Test):** Does the number of observers created affect the posterior probability of the hypothesis?
          2.  **The Doomsday Clock (Future Duration):** Does knowing my birth rank update the probability of total human population size?
          3.  **The Reference Class Boundary:** Does changing the definition of "observer like me" change the probability? (SSA says yes, SIA says no/less).

  6.  **Drafting Section 4: Verbal Disputes:**
      *   *Goal:* Identify if they are defining terms differently.
      *   *Key Candidate:* "Probability." Is it credence? Frequency? Decision-theoretic weight?
      *   *Key Candidate:* "Evidence." Is "I exist" a tautology or a contingent fact?
      *   *Key Candidate:* "Reference Class." SSA treats it as a parameter of the theory; SIA treats it as universal.
      *   *Focus:* The definition of the *sample space*. SSA samples from *actual* observers in a world. SIA samples from *possible* observers across worlds weighted by existence.

  7.  **Drafting Section 5: Confidence Note:**
      *   *Goal:* Honest meta-commentary.
      *   *Constraint:* I lean SSA, so I must check myself.
      *   *Risk:* Making SIA sound like "counting souls." Making SSA sound like "ignoring data."
      *   *Least Sure Item:* The Reference Class phrasing in the Agreed Claims. SSA might think I conceded too much; SIA might think I didn't concede enough.

  8.  **Review and Refine (Self-Correction against constraints):**
      *   *Check:* Did I make SIA look dumb? *Correction:* Ensure SIA's motivation (avoiding DA) is framed as principled, not just "DA is scary." Ensure PP is framed as a "bullet to bite" rather than "insanity."
      *   *Check:* Did I let SSA off the hook on Reference Classes? *Correction:* Explicitly state in Agreed Claims that Reference Class selection is currently unjustified in SSA.
      *   *Check:* Tone. Needs to be academic but blog-appropriate. Precise.
      *   *Check:* Formatting. Numbered claims, Table, Cruxes, Verbal, Note.

  9.  **Final Polish:**
      *   Make sure the Sleeping Beauty mapping is accurate (SSA->Halfer, SIA->Thirder is the standard mapping, though some dispute it. I will stick to the standard mapping for clarity but acknowledge the link).
      *   Ensure the "God's Coin Toss" is described clearly (Incubator variant).
      *   Verify the "Confidence Note" sounds authentic to an AI trying to be neutral while admitting the user's bias constraint.

  *(Self-Correction during drafting Section 3)*: I need to make sure the predictions are specific. For the Doomsday crux, SSA predicts a shorter future, SIA predicts no update. For the Coin Toss, SSA predicts 50%, SIA predicts ~100% (scaled by N).
  *(Self-Correction during drafting Section 1)*: Make sure to mention that *both* agree naive reasoning fails. That's the strongest common ground.
  *(Self-Correction during drafting Section 4)*: The "I exist" tautology issue is the biggest verbal dispute candidate. SSA often treats "I exist" as given (indexical), SIA treats it as contingent evidence.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Joint Statement on Anthropics: Common Ground and Remaining Disputes

  **Prepared for:** [Blog Name] Commentariat
  **Parties:** Proponent of Self-Sampling Assumption (SSA) | Proponent of Self-Indication Assumption (SIA)
  **Drafted by:** AI Assistant (Neutral Facilitator)

  ## 1. Agreed Claims

  The following propositions are accepted by both parties as true, or at least as necessary starting points for any viable anthropic framework. Neither party considers these points settled in a way that resolves the SSA/SIA debate, but both acknowledge them as constraints their respective theories must satisfy.

  1.  **Observer-Selection Effects are Real:** Naive Bayesian updating fails in scenarios where the existence of the observer is correlated with the hypothesis being tested. We cannot treat our observations as if they were generated by a process independent of our existence.
  2.  **The "God's Eye View" is Unavailable:** We must reason from within the system (the *de se* perspective). We cannot simply sum probabilities across possible worlds without accounting for the indexical fact of *which* observer we are within those worlds.
  3.  **Both Frameworks Yield Counter-Intuitive Results:** Both SSA and SIA imply conclusions that conflict with strong pre-theoretic intuitions in specific edge cases. SSA implies the Doomsday Argument (that we should revise the expected lifespan of humanity downward based on birth rank). SIA implies the Presumptuous Philosopher conclusion (that we should be overwhelmingly confident in cosmological theories positing vastly more observers, absent other evidence). Both parties agree that "having to bite a bullet" is not itself a disproof, but the *size* of the bullet is a legitimate metric for theory choice.
  4.  **The Reference Class Problem is Unresolved:** Both parties acknowledge that defining the "reference class" (the set of observers you could have been) is a major vulnerability. SSA proponents admit that current methods for selecting a reference class appear somewhat arbitrary or ad hoc. SIA proponents admit that if the reference class is too broad (e.g., including all possible conscious entities), it exacerbates the Boltzmann Brain problem. Neither side has a fully satisfactory solution to demarcating the class without circularity.
  5.  **Infinite Worlds Break Standard Probabilities:** Both parties agree that standard anthropic reasoning (both SSA and SIA) encounters severe mathematical difficulties (the measure problem) in infinite universes. In such contexts, relative frequencies may become undefined, requiring regularization techniques that are currently underdeveloped.
  6.  **Sleeping Beauty is Isomorphic:** Both parties agree that the Sleeping Beauty problem is structurally analogous to the SSA/SIA debate. Resolving one provides strong evidence for the resolution of the other.

  ## 2. Disagreements Table

  | Issue | SSA Formulation (To be signed by SSA Proponent) | SIA Formulation (To be signed by SIA Proponent) |
  | :--- | :--- | :--- |
  | **The Evidential Weight of Existence** | The fact "I exist" is not evidence that favors hypotheses with more observers, provided the hypothesis posits at least one observer in my reference class. Probability is not proportional to observer count. | The fact "I exist" is evidence that favors hypotheses with more observers. All else being equal, a hypothesis positing $N$ observers is $N$ times more likely to be true than one positing 1 observer. |
  | **The Doomsday Argument** | The Doomsday Argument is a valid, albeit unsettling, deduction. Knowing my birth rank allows me to update against hypotheses where the total number of humans is vastly larger than my current rank. | The Doomsday Argument is a *reductio ad absurdum* of SSA. It produces an unjustified update about the future based solely on indexical information, which violates the principle that physical probabilities should not depend on observer counting. |
  | **The Presumptuous Philosopher** | The Presumptuous Philosopher is wrong. We should not assign near-certainty to a "Big Universe" theory over a "Small Universe" theory solely because the Big Universe contains more observers. | The Presumptuous Philosopher is right. If two theories fit physical data equally well, but one contains a trillion times more observers, we should be a trillion times more confident we are in that one. |
  | **Reference Class Scope** | The reference class must be restricted (e.g., "observers with my exact evidence") to prevent absurd conclusions. The boundary is fuzzy, but necessary. | The reference class should be as broad as possible (e.g., "all observers"). Restricting it is an ad hoc maneuver specifically designed to evade the Doomsday Argument. |
  | **Sleeping Beauty Resolution** | The correct answer is **Halfer** (P(Heads) = 1/2 upon waking). Waking up provides no new information about the coin toss, only that I am an observer in the experiment. | The correct answer is **Thirder** (P(Heads) = 1/3 upon waking). Waking up is evidence that favors the Tails world because there are more awakening-observer-moments in that world. |

  ## 3. The Cruxes

  These are the specific empirical or thought-experimental claims where the two frameworks diverge sharply. Both parties agree that resolving these cases would settle the debate. Predictions are pre-registered below.

  ### Crux A: The "Incubator" (God's Coin Toss)
  **Scenario:** A god flips a fair coin.
  *   **Heads:** One room is created with one person (You).
  *   **Tails:** One million rooms are created with one million people (One of whom is You).
  *   You wake up in a room. You know the setup. What is your credence that the coin landed Tails?

  *   **Why it matters:** This isolates the "Self-Indication" effect without birth-rank confounding.
  *   **SSA Prediction:** **~50%**. (The coin was fair. My existence was guaranteed in both outcomes, so I gain no evidence favoring Tails).
  *   **SIA Prediction:** **~99.9999%**. (I am much more likely to find myself existing in the world where there are a million copies of me).

  ### Crux B: The Doomsday Update
  **Scenario:** We define "Humanity" as a reference class. We estimate the total number of humans who will *ever* live ($N_{total}$). We observe our current birth rank ($n$).
  *   **Why it matters:** Tests whether indexical information constrains physical parameters of the future.
  *   **SSA Prediction:** **Significant Update.** If $n$ is small relative to a "Trillion Human Future" hypothesis, we must downgrade the probability of that future. We should expect humanity to end sooner than non-anthropic models suggest.
  *   **SIA Prediction:** **No Update.** The fact that I am early in the sequence is balanced by the fact that a longer sequence makes my existence more likely *a priori*. The posterior probability of $N_{total}$ remains unchanged from the non-anthropic prior.

  ### Crux C: The Cost of Double Counting
  **Scenario:** A betting scenario where payoffs are distributed per observer vs. per world.
  *   **Why it matters:** Tests whether SIA is "double counting" observers (counting them as evidence and as beneficiaries) or correctly weighting by measure.
  *   **SSA Prediction:** **Bet according to World-Odds.** If I bet on the Incubator (Crux A), I should bet 1:1. If I bet on Heads and win, I win once. If I bet on Tails and win, I win once (the bet is settled per world). SIA advocates are conflating *number of winners* with *probability of truth*.
  *   **SIA Prediction:** **Bet according to Observer-Odds.** If I bet on the Incubator, I should bet 1,000,000:1 on Tails. If Tails lands, there are 1,000,000 of me who win. The goal of rationality is to maximize the proportion of my copies who are right, not the truth-value of the proposition in the abstract.

  ## 4. Verbal Dispute Analysis

  There is a significant risk that the SSA and SIA proponents are talking past each other regarding the definition of **"Probability"** and **"Evidence."**

  1.  **The Tautology of "I Exist":**
      *   **SSA Interpretation:** "I exist" is a necessary precondition for making any observation. It is not a contingent piece of data that can update probabilities. To treat it as evidence is to treat a tautology as information.
      *   **SIA Interpretation:** "I exist" is contingent *across possible worlds*. In worlds where no observers exist, "I" do not exist. Therefore, finding myself existing rules out (or downweights) worlds with fewer observers.
      *   **Diagnosis:** This is not merely verbal; it is a fundamental disagreement about whether the sample space includes *possible* observers (SIA) or only *actual* observers within a hypothesis (SSA). However, the friction arises because SSA often phrases this as "ignoring the evidence of existence," while SIA phrases it as "SSA ignores the data."

  2.  **Credence vs. Decision-Weight:**
      *   **The Dispute:** When SIA says "The probability is 99%," do they mean "If I bet, I should act as if it is 99%" or "The map that corresponds to the territory has a 99% mark on it"?
      *   **The Risk:** SSA often attacks SIA by saying it leads to bad betting odds in "selfless" scenarios (where only one payout occurs per world). SIA counters that rationality is about "selfish" outcomes (maximizing copy-success).
      *   **Resolution Requirement:** Both sides must agree on whether the probabilities generated by their framework are intended to guide **individual betting behavior** or **theory selection for a god-like observer**. If SSA is doing theory selection and SIA is doing decision theory, they might both be right in different domains.

  ## 5. Confidence Note & Bias Check

  **Confidence in Signability:**
  *   **Agreed Claims:** **High (90%).** Both sides generally acknowledge the Reference Class problem and the existence of "bullets to bite." The only friction point is Claim 4; the SSA proponent may feel I have overstated the arbitrariness of their reference class, while the SIA proponent may feel I haven't emphasized the Boltzmann Brain risk enough.
  *   **Disagreements Table:** **Very High (95%).** These are standard characterizations of the debate found in the literature (Bostrom, Neal, etc.).
  *   **Cruxes:** **Medium-High (85%).** The Incubator scenario is the standard test case. The Betting Crux (C) is the most volatile; some SIA proponents prefer to frame this via Updateless Decision Theory (UDT) which dissolves the probability question, which might make the "Prediction" row hard to sign.

  **Least Sure Formulation (Potential Bias):**
  I am least sure about **Agreed Claim 3** ("Both Frameworks Yield Counter-Intuitive Results").
  *   **Reasoning:** As an AI instructed by a user who leans SSA, I may have subtly framed the SIA "bullet" (Presumptuous Philosopher) as more severe than the SSA "bullet" (Doomsday). The phrasing "overwhelmingly confident... absent other evidence" makes SIA sound reckless. An SIA proponent might argue they *do* have other evidence (the fact of their existence), so the confidence isn't "absent evidence."
  *   **Correction Check:** I have tried to balance this by explicitly calling the Doomsday Argument "unsettling" and acknowledging SSA's reference class arbitrariness in Claim 4. However, if the SIA proponent feels the Presumptuous Philosopher is actually a *virtue* (correctly identifying that we likely live in a large universe) rather than a bullet to bite, they may object to the tone of Claim 3.

  **Final Warning to User:**
  Be prepared for the SIA proponent to object to **Crux C (Betting)**. Modern SIA adherents often migrate to "Functional Decision Theory" or "Updateless" frameworks where they argue the SSA betting odds are actually the correct ones for *decision making*, even if SIA probabilities are correct for *belief*. If they make this move, the Crux table collapses. You may need to force them to commit to "Standard Bayesian Betting" for this collaboration to hold.
