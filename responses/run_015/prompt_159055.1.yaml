answer: |-
  Start by volunteering the trade-off before anyone interrupts you because if you wait for them to find the cost, they will treat it as a bug rather than a feature. You should say plainly that this framework will sometimes choose to save fewer lives overall in order to prevent catastrophic harm to specific individuals, and that this is an intentional reduction in efficiency purchased to respect the separateness of persons. This disarms the quant types immediately because you are acknowledging their metric is being deliberately deprioritized, not ignored by mistake. The single reply that must land for this proposal to survive at all is your justification for why we do not sum complaints across people. If you cannot convince them that adding one person's severe pain to another's mild pain is morally distinct from adding two mild pains together, you lose the room to utilitarianism. Your two-minute reply here is that summing treats people as containers for value rather than individuals with claims on us, and that our foundation's mandate is to answer to each person affected, not just to the aggregate cloud of welfare. The soft spot here is that you might sound like you are prioritizing sentiment over lives saved, so keep your tone focused on moral consistency rather than emotion.

  The first objection will come from the quant types who built your spreadsheets, and they will ask how you can justify letting twenty thousand children suffer preventable stunting just to save fifteen from a wheelchair dependency. You should concede upfront that the total burden of disease will be higher under your proposed rule. Your reply is that the severity of the complaint matters more than the number of complainants when the disparity is large, because no child in the larger group has a claim strong enough to override the claim of the child facing lifelong disability. The soft spot is that you risk sounding like you are ignoring the twenty thousand entirely, so emphasize that their benefits are still counted but cannot outweigh the catastrophic loss of the few.

  Next the program officers will worry about defensibility to donors and communities, asking how they explain to a community of two hundred thousand that they were passed over for a smaller group. Concede that this is a harder conversation than showing a spreadsheet of maximized outcomes. Your reply is that we tell them we refuse to treat their small benefits as a mathematical weight that crushes the desperate needs of others, which aligns with human rights frameworks they already respect. The soft spot is that donors often want maximum impact per dollar, so you need to be ready to pivot to mission alignment rather than pure efficiency.

  The lawyer and the consultant will bundle together to ask where the threshold lies for a complaint strong enough to block aggregation, worrying about consistency and decision paralysis. Concede that there is no bright line formula like there is with DALYs. Your reply is that precedent will build the threshold over time just like case law, and that having a structured deliberation about complaint strength is better than hiding value judgments inside a weighting formula. The soft spot is that this admits subjectivity, which scares people who want a rule that produces a decision before lunch, so emphasize that the procedure is rigid even if the inputs require judgment.

  The ex-philosophy PhD will likely wait until the end to ask if you are conflating reasonable rejection of principles with rejection of outcomes, noting that Scanlon focuses on principles no one could reasonably reject rather than comparing individual complaints directly in this manner. Concede that you are applying a simplified operational version of contractualism suitable for grantmaking rather than pure meta-ethics. Your reply is that for resource allocation, treating the strength of a person's complaint as the veto power aligns with the spirit of the reasonable rejection test without getting bogged down in ideal theory. The soft spot is that if they press hard on the technical distinction, you cannot bluff, so admit you are adapting the theory for practice.

  Then comes the stress test you mentioned about the one person certain harm versus the ten thousand people with risk, where someone will point out you are accepting more expected harm total. Concede that expected harm is higher in the risk scenario. Your reply is that distributing risk widely is morally preferable to concentrating certainty on one victim, because the individual complaint against certain ruin is stronger than the complaint against a small probability of ruin. The soft spot is that this looks like you are ignoring the ten expected victims, so you must hold firm that the nature of the complaint changes with certainty.

  Finally, the question you are hoping nobody asks is where exactly the threshold sits for when numbers begin to break ties, because if you say it is vague you look unprofessional, and if you give a number you look arbitrary. If this comes up, do not guess. Say that the committee will set the threshold through pilot cases rather than abstract definition, and that the rule is designed to force that conversation rather than hide it. Keep your notes on your phone simple enough that you can glance at them without losing eye contact, and remember that you are not expected to have solved moral philosophy forever, only to offer a better tool for this specific room.
