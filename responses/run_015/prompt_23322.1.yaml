prompt: |-
  I am preparing a graduate seminar on moral uncertainty, and I want to clarify a distinction that I think is often elided: the difference between uncertainty over moral theories and uncertainty over moral facts within a fixed moral framework. Please explain this distinction carefully, with attention to the case in which the competing moral theories do not merely disagree about which act is right, but use different evaluative currencies or different decision rules. For example, one theory maximizes aggregate welfare, another treats certain rights as inviolable constraints, and another evaluates conduct primarily by the character of the agent rather than by the consequences of the act. My students keep assuming that if I assign a probability to each theory, I can simply compute a weighted sum of the theories' verdicts and choose the act with the highest expected moral score, but I suspect that this procedure may not always be well-defined when the theories do not share a common value function over acts.

  Could you explain why the expected-value formulation is conceptually unstable in that case, and what alternative ways of representing moral uncertainty would be available, such as probability over value functions, probability over preference rankings, or a view that treats moral disagreement as partly a disagreement about the kind of question being asked? I would prefer an explanation that stays at the level of the conceptual architecture rather than surveying the literature, and that makes clear what must be true for a decision procedure under moral uncertainty to be more than a convenient heuristic.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Deconstruct the Request:**
      *   **Topic:** Moral Uncertainty (Graduate Seminar level).
      *   **Core Distinction:** Uncertainty over moral theories (inter-theoretic) vs. uncertainty over moral facts within a fixed framework (intra-theoretic).
      *   **Specific Problem:** The "Expected Moral Value" (EMV) approach fails when theories use different evaluative currencies or decision rules (e.g., Utilitarianism vs. Deontology vs. Virtue Ethics).
      *   **Key Issue:** Incommensurability of value functions prevents simple weighted sums.
      *   **Desired Output:** Conceptual explanation (not a literature survey), focusing on architectural requirements for a robust decision procedure.
      *   **Alternatives to Explore:** Probability over value functions, probability over preference rankings, disagreement about the *kind* of question.
      *   **Goal:** Clarify what must be true for a decision procedure to be more than a heuristic.

  2.  **Initial Analysis & Conceptual Mapping:**
      *   *The Student's Mistake:* They are treating moral theories like empirical hypotheses with a shared output scale (e.g., "utils"). They assume $P(T_1) \cdot V_1(A) + P(T_2) \cdot V_2(A)$ makes sense.
      *   *The Problem:* $V_1$ might be "hedons," $V_2$ might be "duty fulfillment," $V_3$ might be "virtue points." You can't add hedons to duty fulfillment without an exchange rate. This is the problem of *intertheoretic comparison*.
      *   *The Distinction:*
          *   Type A (Factual): "Is this act lying?" (Uncertainty about the world/description).
          *   Type B (Theoretical): "Does lying matter maximally or constraint-wise?" (Uncertainty about the normativity itself).
      *   *The Architecture:* To make EMV work, we need a "Master Value Function" or a common currency. If we don't have that, we need a different decision architecture (e.g., voting, risk-aversion, metanormative principles).

  3.  **Drafting the Explanation - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the question. State the thesis: The EMV model presupposes a common metric that radical moral disagreement denies.

      *   **Section 1: The Two Types of Uncertainty.**
          *   *Intra-theoretic (Factual):* Fixed $V$, uncertain inputs. (e.g., Utilism, but unsure if the bomb will kill 5 or 10). Easy to model with standard expected utility.
          *   *Inter-theoretic (Structural):* Uncertain $V$ itself. (e.g., Utilism vs. Kantianism). This is where the architecture breaks.

      *   **Section 2: The Incommensurability Problem (The "Currency" Issue).**
          *   Explain why $V_1(A) + V_2(A)$ is category error.
          *   Example: Utilitarianism (maximize sum) vs. Deontology (respect constraints).
          *   The "Zero Point" and "Unit" problem. Does 1 unit of utility = 1 unit of duty? Who decides?
          *   *Crucial Point:* EMV requires *cardinal* comparability across theories, not just ordinal ranking within theories.

      *   **Section 3: The Decision Rule Problem.**
          *   It's not just values; it's *how* values determine action.
          *   Maximization vs. Satisficing vs. Constraints.
          *   If Theory 2 says "Never do X," assigning it probability 0.4 doesn't just lower the score of X; it might veto it. EMV treats vetoes as just "very negative numbers," which misses the deontic structure.

      *   **Section 4: Architectural Requirements for a Robust Procedure.**
          *   What is needed to save EMV? A *Metanormative Theory*.
          *   Need a "Normalization" scheme (e.g., variance normalization, range normalization). But this presupposes the theories accept being normalized.
          *   Need a "Common Currency" (Hedonic? Rational acceptability?).
          *   If these don't exist, EMV is just a heuristic, not a derivation.

      *   **Section 5: Alternative Representations.**
          *   *Probability over Rankings:* Ordinal instead of cardinal. (Borda count, pairwise voting). Avoids currency but introduces voting paradoxes.
          *   *Probability over Question-Types:* Maybe the theories aren't answering "What should I do?" in the same way. One answers "What is optimal?", another "What is permissible?".
          *   *Myopic vs. Global:* Risk aversion approaches (Minimax Regret).

      *   **Conclusion:** Summarize the takeaway. The move from "uncertainty about facts" to "uncertainty about norms" requires a shift from decision theory to *metanormative* theory.

  4.  **Refining and Polishing (Self-Correction during drafting):**
      *   *Check:* Did I avoid literature survey? Yes, focus on concepts like "cardinality," "normalization," "metanormativity."
      *   *Check:* Did I address the "different decision rules" point? Yes, need to emphasize maximizing vs. constraining.
      *   *Tone:* Academic, precise, suitable for a graduate seminar.
      *   *Clarification:* Make sure to distinguish between *uncertainty about which theory is true* vs. *uncertainty about how to compare theories*. The latter is the blocker for EMV.
      *   *Key Insight:* The "Expected Moral Value" model smuggles in a consequentialist metanormativity even if the object-level theories aren't consequentialist. This is a strong point to make.

  5.  **Final Review against constraints:**
      *   Explain distinction carefully? Yes.
      *   Attention to different currencies/rules? Yes.
      *   Explain why EMV is unstable? Yes.
      *   Alternative representations? Yes.
      *   Conceptual architecture level? Yes.
      *   What must be true for procedure to be non-heuristic? Yes (need for a justified metanormative bridge).

  6.  **Final Polish:** (Produces the structured response below.)
answer: |-
  This is a crucial architectural distinction for a graduate seminar. The confusion your students are exhibiting is common because standard decision-theoretic models of moral uncertainty (often called "Maximize Expected Choice-Worthiness" or MEC) tacitly assume a level of structural homogeneity among moral theories that does not exist.

  To clarify this for your students, we need to distinguish between **uncertainty within a value function** and **uncertainty over the value function itself**, and then demonstrate why the latter cannot be resolved by the mathematical machinery of the former without importing substantial, often hidden, metanormative commitments.

  Here is a conceptual breakdown of the distinction, the instability of the expected-value formulation, and the architectural requirements for a robust decision procedure.

  ---

  ### 1. The Distinction: Parametric Uncertainty vs. Structural Uncertainty

  The first step is to formalize the two types of uncertainty your students are conflating.

  **A. Uncertainty Over Moral Facts (Parametric Uncertainty)**
  This occurs when the *structure* of the moral theory is fixed, but the *inputs* are uncertain.
  *   **Architecture:** There is a single value function $V(A, S)$, where $A$ is an act and $S$ is a state of the world. The agent is uncertain about $S$.
  *   **Example:** You are a utilitarian. You are unsure whether a specific intervention will save 10 lives or 100 lives.
  *   **Decision Procedure:** Standard Expected Utility. You compute $\sum P(S_i) \cdot V(A, S_i)$. This is well-defined because $V$ outputs a single cardinal scale (e.g., welfare units) across all states.

  **B. Uncertainty Over Moral Theories (Structural Uncertainty)**
  This occurs when the agent is uncertain about which value function $V$ is the correct one.
  *   **Architecture:** There is a set of candidate value functions $\{V_1, V_2, \dots, V_n\}$, each associated with a probability $P(T_i)$.
  *   **Example:** You assign 50% credence to Utilitarianism ($V_1$) and 50% to Kantian Deontology ($V_2$).
  *   **The Problem:** $V_1$ and $V_2$ may not map acts to the same kind of object. $V_1$ might map acts to real numbers (welfare sums). $V_2$ might map acts to deontic statuses (Permissible/Impermissible) or lexical orderings.

  Your students are assuming that Type B uncertainty can be solved using the mathematics of Type A uncertainty. This is only possible if the competing theories share a **common evaluative currency** and a **common decision rule**. When they do not, the "weighted sum" procedure is category error.

  ### 2. Why the Expected-Value Formulation is Conceptually Unstable

  The formula for Maximize Expected Choice-Worthiness (MEC) is typically written as:
  $$ \text{Score}(A) = \sum_{i} P(T_i) \cdot CW_i(A) $$
  Where $CW_i(A)$ is the "choice-worthiness" of act $A$ according to theory $T_i$.

  For this equation to be meaningful rather than heuristic, three architectural conditions must be met. In cases of radical moral disagreement, these conditions fail.

  #### A. The Problem of Intertheoretic Comparison (Currency)
  For the sum to work, the output of $CW_1$ (Utilitarianism) and $CW_2$ (Deontology) must be cardinally comparable.
  *   **Scale:** If Utilitarianism rates an act as "100 utils" and Deontology rates it as "5 duty-points," what is the exchange rate? Is 1 duty-point equal to 1 util, 10 utils, or infinity?
  *   **Zero Point:** Where is the baseline? Does "0" mean neutral welfare, or does it mean the absence of a violation?
  *   **Instability:** Without an exchange rate, the probabilities $P(T_i)$ do not merely reflect confidence in the truth of the theory; they implicitly encode the *exchange rate* between the theories' currencies. By assigning 50% to each, you are arbitrarily stipulating that the "units" of each theory are of equal magnitude. This is not a derivation of moral truth; it is a hidden metanormative assumption.

  #### B. The Problem of Decision Rules (Aggregation vs. Constraints)
  Different theories do not just assign different scores; they specify different *relations* between scores and actions.
  *   **Maximization:** Utilitarianism says "Choose the act with the highest $V_1$."
  *   **Constraints:** Deontology might say "If $V_2(A) = \text{Impermissible}$, do not do $A$, regardless of $V_1$."
  *   **Virtue:** Virtue Ethics might say "Choose the act that a virtuous agent would characterize as $V_3$," which may not be a function of outcomes at all.
  *   **Instability:** The MEC model treats a deontological constraint as simply a very negative number on the utilitarian scale. But if Deontology is true, a rights violation is not "bad welfare"; it is *forbidden*. Aggregating a "forbidden" status with a "high welfare" status via a weighted sum dissolves the logical structure of the constraint. It treats a veto as a cost, which is a consequentialist interpretation of a non-consequentialist theory.

  #### C. The Problem of Domain (The "Kind of Question")
  Some theories may not be answering the same question.
  *   Consequentialism answers: "Which act produces the best state of affairs?"
  *   Deontology answers: "Which act is consistent with rational agency?"
  *   **Instability:** If the theories are defining the *subject matter* of morality differently, there is no common variable $A$ to evaluate. One theory evaluates *outcomes*, another evaluates *maxims*. To sum them, you must assume there is a super-category (e.g., "Normative Force") that subsumes both outcomes and maxims. Asserting the existence of this super-category is itself a controversial moral claim.

  ### 3. Alternative Architectural Representations

  If the simple weighted sum is unstable, how else can we represent moral uncertainty? The alternative models shift the locus of uncertainty from "scores" to other structures.

  #### A. Probability Over Preference Rankings (Ordinal Approach)
  Instead of assigning probabilities to cardinal value functions, assign probabilities to *ordinal rankings* of acts.
  *   **Architecture:** Theory $T_i$ provides a ranking $R_i$ over acts (e.g., $A \succ B \succ C$). The agent holds a probability distribution over these rankings.
  *   **Decision Rule:** Use a voting mechanism (e.g., Borda Count, Pairwise Majority) to aggregate the rankings based on the probabilities.
  *   **Advantage:** Avoids the need for intertheoretic cardinal comparison (exchange rates).
  *   **Limit:** Susceptible to voting paradoxes (Condorcet cycles) and still requires that all theories rank the *same set of acts*, which returns us to the "Domain Problem."

  #### B. Probability Over Value Functions with Normalization
  This attempts to save the Expected Value model by imposing a normalization scheme.
  *   **Architecture:** Before summing, transform each $CW_i$ to a standard scale (e.g., 0 to 1, or variance normalization).
  *   **Decision Rule:** Maximize the expected normalized value.
  *   **Requirement:** This requires a **Metanormative Principle** that justifies the normalization. For example, "All theories should be treated as having equal variance."
  *   **Critique:** This is not a solution derived from the moral theories themselves; it is an external imposition. It effectively says, "I am uncertain about morality, but I am certain that all moral theories should be scaled to fit this specific statistical distribution."

  #### C. Disagreement About the Question (Metanormative Pluralism)
  This view suggests that under deep uncertainty, the question "What should I do?" splits.
  *   **Architecture:** Distinguish between *objective rightness* (what the true theory says) and *subjective rationality* (what an uncertain agent should do).
  *   **Decision Rule:** Instead of maximizing expected moral value, the agent maximizes *expected rationality*. This might involve risk-aversion strategies (e.g., Minimax Regret) rather than expectation maximization.
  *   **Implication:** This admits that there is no single "moral score" to maximize. The decision procedure is not discovering the moral truth, but managing the risk of moral error.

  ### 4. What Must Be True for a Decision Procedure to Be Non-Heuristic?

  To move your students beyond heuristics, they must identify the **Bridge Principles** their decision procedure relies on. A procedure is only conceptually stable if the following conditions are explicitly defended:

  1.  **Commensurability:** There must be a justified account of how the "units" of Theory A translate to the "units" of Theory B. (e.g., "Rights violations are equivalent to $X$ units of welfare loss"). Without this, probabilities cannot weight values.
  2.  **Structural Homogeneity:** There must be a justification for treating all theories as providing *inputs* to a single decision function (maximization). If one theory provides a *constraint* on the decision function, the aggregation model must be able to process constraints, not just values.
  3.  **Metanormative Authority:** There must be a higher-order theory that governs how to act under uncertainty. The object-level moral theories (Utilitarianism, Deontology) generally do not contain instructions for what to do when you are unsure if they are true. Therefore, the decision procedure relies on a *Metanormative Theory*.

  **Conclusion for the Seminar:**
  The "Expected Moral Value" model is not a neutral tool for handling uncertainty. It is itself a substantive moral theory—specifically, a form of **Consequentialism about Uncertainty**. It assumes that moral reasons aggregate linearly, that all normative force can be quantified cardinally, and that the goal of the uncertain agent is to maximize the expected realization of moral value.

  If your students wish to use this model, they must defend these metanormative commitments. If they cannot, they must acknowledge that the model is a heuristic that imposes a consequentialist structure on non-consequentialist theories, potentially distorting the very theories they are trying to respect. A robust architecture for moral uncertainty requires either a defense of intertheoretic comparability or a shift to non-aggregative decision rules (like voting or risk-minimization) that do not presuppose a common currency.
