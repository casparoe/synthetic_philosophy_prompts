  # DECISION TREE: THE MORAL ARCHITECTURE OF SECESSION

  **Starting Node:** A territorially concentrated group within an established, broadly democratic state demands sovereign independence. The demand is not a cover for ethnic cleansing, annexation, or dictatorship.

  1.  **Basis of Claim:** Is a serious grievance (injustice, rights-violation, breach of autonomy) a necessary precondition for a right to exit, or is a persistent territorial majority sufficient on its own?
      *   *Grievance Required* → Go to Node 2.
      *   *Majority Sufficient* → Go to Node 3.

  2.  **Constitutional Constraint:** If a grievance exists, does the existing constitution's prohibition definitively settle the moral question, or does the moral right override the legal text?
      *   *Constitution Settles It* → **Leaf 1: Strict Constitutionalist.** (Awkward commitment: Must accept that a democratic state can legally trap a minority even if it violates their basic rights.)
      *   *Moral Right Overrides* → Go to Node 6.

  3.  **Franchise:** Who composes the constituency entitled to vote on independence?
      *   *Members of the National Group (wherever resident)* → Go to Node 4.
      *   *All Current Residents of the Territory* → Go to Node 5.

  4.  **Demographic Drift:** If the territorial majority was produced largely by internal migration from the parent state rather than conversion of the historic population, does the claim to secede weaken or vanish?
      *   *Claim Weakens/Vanishes* → **Leaf 2: Ascriptive-Strict.** (Awkward commitment: Must accept that a democratic majority can be rendered politically voiceless due to ancestry or arrival date.)
      *   *Claim Remains Valid* → **Leaf 3: Ascriptive-Soft.** (Awkward commitment: Must explain why the "national" franchise matters if migration does not invalidate the result.)

  5.  **Thresholds:** Is a simple majority (50% + 1) in a single vote sufficient to trigger the right, or does the gravity of the act require a supermajority or consecutive votes?
      *   *Simple Majority Once* → **Leaf 4: Pure Plebiscitary.** (Awkward commitment: Must accept that 50.1% can permanently alter the status of the 49.9% against their will.)
      *   *Supermajority/Repeated* → Go to Node 6.

  6.  **Process:** If the vote passes (and/or grievance is proven), does the group have a right to declare independence immediately, or a duty to negotiate terms with the parent state first?
      *   *Duty to Negotiate* → Go to Node 7.
      *   *Right to Declare* → Go to Node 8.

  7.  **Legality of Declaration:** If the constitution forbids secession, is a Unilateral Declaration of Independence (UDI) ever morally permissible after negotiations fail?
      *   *Never Permissible* → **Leaf 5: Quebec Reference (Duty to Negotiate).** (Awkward commitment: Must accept that a clear democratic mandate may result in no independence if the parent state negotiates in bad faith without legal consequence.)
      *   *Permissible* → **Leaf 6: Remedial-UDI.** (Awkward commitment: Must accept that extra-constitutional revolution is compatible with liberal democratic theory.)

  8.  **Legality of Declaration (Primary Right):** If the constitution forbids secession, is a UDI permissible even without a prior grievance, based solely on the democratic will?
      *   *Never Permissible* → **Leaf 7: Constitutional Primary-Right.** (Awkward commitment: Must claim a moral right to secede that cannot be exercised without the oppressor's permission.)
      *   *Permissible* → **Leaf 8: Revolutionary Primary-Right.** (Awkward commitment: Must accept that democratic legitimacy can authorize the dissolution of legal order without injustice.)

      *(Note: Nodes 9–12 apply to all Leaves 2–8 that permit secession in principle. They distinguish the *shape* of the secession.)*

  9.  **Outcome:** Must the result be full sovereign statehood, or is the right discharged by shared sovereignty (federalism, confederation, association)?
      *   *Shared Sovereignty Suffices* → **Leaf 9: Pooled-Federal.** (Awkward commitment: Must accept that a group claiming "nationhood" can be satisfied with provincial status.)
      *   *Full Sovereignty Required* → **Leaf 10: Pooled-Confederal.** (Awkward commitment: Must accept that "independence" is compatible with remaining in a binding supranational treaty structure.)
      *   *Full Sovereignty Required* → Go to Node 10.

  10. **Matryoshka:** If the region exits, may a sub-unit of that region (a city, island, border district) opt to stay with the parent state?
      *   *Sub-unit May Opt Out* → **Leaf 11: Fragmented Sovereignty.** (Awkward commitment: Must accept that secession may trigger infinite regress, rendering the new state economically unviable.)
      *   *Sub-unit Must Stay* → Go to Node 11.

  11. **Rump State:** Does the economic or political viability of the remainder (the "rump" state) constitute a moral veto on exit?
      *   *Viability is a Veto* → **Leaf 12: Viability-Constrained.** (Awkward commitment: Must accept that a group's right to self-determination is hostage to the economic competence of the state they are leaving.)
      *   *Viability is Prudence Only* → Go to Node 12.

  12. **Dead-Hand:** Is the secession vote binding on future generations and irreversible, or may the new state rejoin the parent within a decade?
      *   *Reversible/Provisional* → **Leaf 13: Provisional Independence.** (Awkward commitment: Must accept that sovereign statehood can be a temporary administrative status rather than a permanent condition.)
      *   *Binding/Permanent* → Go to Node 13.

  13. **Layered Sovereignty:** Does secession that strips residents of a supranational citizenship (e.g., EU) differ morally from secession that keeps them, and does this affect the right?
      *   *Loss of Membership Veto/Constraints Right* → **Leaf 14: Layered Sovereignty.** (Awkward commitment: Must accept that an external technocratic body holds a veto over democratic self-determination.)
      *   *No Moral Difference* → **Leaf 15: Traditional Sovereignty.** (Awkward commitment: Must accept that losing access to a larger market is a price citizens must pay for political purity.)

  *(Note: To reach 16 leaves, split Leaf 9 into 9a [Federal] and 9b [Confederal] based on degree of centralization, and Leaf 15 into 15a [Unitary] and 15b [Federal New State] based on internal structure.)*

  ***

  # NOTES ON LOGICAL SPACE, PAIRS, AND CASES

  ### 5. Logical Space and Empty Cells
  The tree permits $2^{12}$ theoretical combinations, but the branching structure collapses many into the 16 leaves above.
  *   **Occupied:** Leaves 1, 2, 4, 5, 6, 8, 11, 14, 15 correspond to standard positions in the literature (Constitutionalism, Ascriptive, Plebiscitary, Quebec Reference, Remedial, Revolutionary, Fragmented, Layered, Traditional).
  *   **Empty/Incoherent:**
      *   *Constitutionalist + UDI:* Incoherent. If the constitution settles the matter (Node 2), a UDI (Node 7/8) is by definition illegitimate on this view.
      *   *Remedial + Simple Majority (No Negotiation):* Unoccupied. Remedial theorists usually require negotiation to prove the grievance is unresolvable (Leaf 6 requires UDI only after failure).
      *   *Ascriptive + All Residents Franchise:* Incoherent. If the right belongs to the "nation" (Node 3), excluding diaspora or including recent migrants contradicts the premise.
      *   *Pooled Sovereignty + Fragmented Sovereignty:* Unattractive. Shared sovereignty usually implies stable boundaries; allowing sub-units to opt-out destabilizes the shared arrangement.
  *   **Awkward Commitments:** Every leaf entails a cost. The *Strict Constitutionalist* sacrifices justice for order; the *Pure Plebiscitary* sacrifices minority rights for majority will; the *Layered Sovereignty* sacrifices democratic autonomy for market access.

  ### 6. Pairs the Tree Cannot Separate
  *   **Remedial-Only vs. Constitutionalist (Leaf 6 vs. Leaf 1):** Both reject Catalonia's 2017 declaration. The tree separates them at Node 2 (Constitution vs. Grievance), but the *policy outcome* is identical (No Secession). To split them, one must ask: "If the constitution were amended to forbid secession even in cases of genocide, would you still obey it?" The Constitutionalist says Yes; the Remedial theorist says No.
  *   **Plebiscitary vs. Ascriptive (Leaf 4 vs. Leaf 2/3):** Both accept Scotland's 2014 vote. They coincide on the *result* but diverge on Node 3 (Franchise). To split them, ask: "Should a Scottish expat in London vote, and should an English expat in Edinburgh vote?" The Ascriptive says Yes/No; the Plebiscitary says No/Yes.
  *   **Quebec Reference vs. Constitutional Primary-Right (Leaf 5 vs. Leaf 7):** Both require constitutional permission for a lawful exit. They diverge on Node 7 (UDI). The Quebec view forbids UDI even after good-faith negotiation failure; the Constitutional Primary-Right view might allow UDI if the constitution is deemed illegitimate. The tree captures this at Node 7, but in practice, both often recommend the same "Negotiate" path.

  ### 7. Running the Real Cases
  *   **Scotland (2014):**
      *   *Path:* Node 1 (Majority) → Node 3 (Residents) → Node 5 (Simple Majority) → Node 6 (Negotiate) → Node 7 (No UDI).
      *   *Verdict:* **Leaf 5 (Quebec Reference)** or **Leaf 1 (Constitutionalist)**.
      *   *Unresolved Node:* The tree sends a student to Leaf 5 if they believe the moral right exists but requires agreement; to Leaf 1 if they believe the UK Parliament's permission was the *source* of the right. The historical record (Edinburgh Agreement) masks this theoretical divergence.
  *   **Catalonia (2017):**
      *   *Path:* Node 1 (Grievance claimed) → Node 2 (Constitution Forbids) → Node 7 (UDI Attempted).
      *   *Verdict:* **Leaf 6 (Remedial-UDI)** if the student accepts the grievance; **Leaf 1 (Constitutionalist)** if they do not.
      *   *Unresolved Node:* Node 1. The tree does not adjudicate whether the grievance was "serious" enough. A student's answer here drives the entire result.
  *   **Quebec (1995/1998):**
      *   *Path:* Node 1 (No Unilateral Right) → Node 6 (Negotiate) → Node 7 (No UDI).
      *   *Verdict:* **Leaf 5 (Quebec Reference).**
      *   *Unresolved Node:* None. This case is the archetype for Leaf 5. The tree fits perfectly, which reveals the tree is partially calibrated to this case.

  ### Rejected Candidate Questions (Brainstorming)
  *   *"Is the group a nation?"* Discarded. Too jargon-heavy; presupposes the Ascriptive view (Distinction b) before the student has answered.
  *   *"Is the state legitimate?"* Discarded. Too broad; conflates general political obligation with the specific right of exit.
  *   *"Do you value stability over justice?"* Discarded. Too vague; "stability" means different things to a Constitutionalist (legal order) and a Viability-Constrained theorist (economic order).
  *   *"Is secession wise?"* Discarded. The instrument diagnoses legitimacy/rights, not prudence (per prompt specifications).
  *   *"Does the UN recognize them?"* Discarded. Legal recognition is distinct from moral legitimacy; this is a political theory instrument, not an international law checklist.
