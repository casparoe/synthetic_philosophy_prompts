  **MEMORANDUM**

  **TO:** Student Support Allocation Committee
  **FROM:** Committee Member, Institutional Policy
  **DATE:** October 24, 2023
  **SUBJECT:** Formal Opinion on the Cross-Domain Welfare Calibration Protocol

  **1. Executive Summary**
  Recommendation: Approve the Cross-Domain Welfare Calibration Protocol (CDWCP) solely as a time-bound restricted pilot. Core Reason: While resource scarcity necessitates prioritization mechanisms, the current weighting methodology rests on contested metaphysical assumptions regarding interpersonal welfare comparison. Proceeding without modification risks institutionalizing an ontology of normalcy that invalidates structurally incommensurable student experiences. However, deferring allocation entirely abandons students to unmediated scarcity. A restricted pilot allows the university to meet immediate support obligations while subjecting the protocol's weighting logic to rigorous ethical audit before full adoption. This approach balances the imperative of material aid against the risk of conceptual violence inherent in quantifying disparate phenomenal deficits.

  **2. The Case and the Protocol**
  The CDWCP is designed to resolve allocation conflicts when accommodation funding exceeds available budget. It assigns priority scores to student requests by estimating utility deficits across diverse disability categories. These deficits are weighted using a shared index intended to standardize access barriers. The protocol designers argue that the index measures only external opportunity sets—physical access, temporal flexibility, resource availability—rather than internal subjective states. They claim this avoids direct interpersonal comparison of suffering, focusing instead on functional restoration. The institutional need is clear: without a triage mechanism, support becomes first-come-first-served or arbitrarily discretionary, potentially favoring vocal advocates over those with severe but less visible barriers. The designers contend that by anchoring the metric in observable opportunity constraints rather than reported pain or distress, the protocol remains neutral regarding the qualitative nature of student experience. They assert that removing subjective reporting eliminates bias, creating a transparent ledger of need based on functional gaps rather than personal narrative. However, the weighting of these gaps implies a common scale of value.

  **3. The Translation Invariance Objection**
  The translation invariance objection posits that converting disparate phenomenal experiences into a common metric is conceptually illegitimate. When a student navigates via echolocation and another manages executive dysfunction, they inhabit non-overlapping phenomenal spaces. The loss experienced in each case is qualitatively distinct, not merely quantitatively different. The objection targets the weighting stage of the CDWCP: assigning numerical values to these deficits presupposes a translation function that preserves meaning across these spaces. My colleague argues no such function exists. By forcing these experiences onto a shared index, the protocol smuggles in a hidden ontology of the "normal" subject as the baseline from which deviation is measured. The weighting implies that a unit of access lost in one domain is equivalent to a unit lost in another, erasing the specific texture of the disability. Consequently, the protocol may systematically deprioritize needs that resist standardization, reinforcing existing structural inequities under the guise of neutrality. This is not merely a measurement error but a category mistake. If the qualitative meaning of loss is not preserved, the resulting priority scores are not just inaccurate; they are morally incoherent, validating a framework that fundamentally misunderstands the nature of the students it aims to serve. The objection insists that comparing these deficits is not merely difficult but conceptually illegitimate, as it requires a standpoint outside any actual human experience to judge the equivalence of suffering.

  **4. The Case for the Recommendation**
  Despite the philosophical gravity of the objection, a restricted pilot is the only viable institutional path. Total rejection of the CDWCP leaves the committee without a principled allocation method, defaulting to ad hoc decisions that may be equally biased but less transparent. Institutional fairness requires that we distribute scarce resources according to some defensible logic, even if that logic is imperfect. Epistemic humility dictates we acknowledge the metric's limitations without paralysis. We cannot avoid comparison entirely; refusing to rank needs is itself a choice that prioritizes some students over others by default. The pilot allows us to test whether the "external opportunity" claim holds water in practice. If the weighting consistently disadvantages specific phenomenal spaces, the data will reveal this bias more effectively than abstract debate. We must proceed with the understanding that the index is a heuristic, not a moral truth. By limiting the pilot's scope and mandating ethical review, we mitigate the risk of ontological violence while fulfilling our duty to provide material support. Inaction is not neutrality; it is negligence. The recommendation rests on a distinction between ideal theory and non-ideal circumstances. In a world of unlimited resources, the objection would warrant abandoning the metric entirely. In our context of scarcity, we must choose between imperfect comparison and arbitrary denial. The restricted pilot acknowledges the friend's concern by treating the scores as provisional inputs rather than final determinants. Reviewers must apply criteria that check for systemic skewing against non-normative experiences. This approach respects the philosophical critique by embedding skepticism into the implementation process. It accepts that while we cannot perfectly translate phenomenal loss, we can monitor the consequences of our attempts to do so. The goal is not to solve the metaphysical problem but to manage the institutional risk while ensuring students receive aid.

  **5. The Strongest Consideration on the Losing Side**
  The strongest argument against this recommendation is that adopting the CDWCP, even as a pilot, legitimizes a harmful conceptual framework. If the translation invariance objection is correct, the protocol is not merely imperfect; it is fundamentally unjust. Using it validates the idea that disparate human experiences can be commensurated, potentially causing epistemic harm to students whose needs are misclassified. A lottery system or equal pro-rata reduction across all requests would avoid imposing a false ontology of normalcy. These alternatives acknowledge scarcity without claiming to measure the unmeasurable. By proceeding with the pilot, the committee risks normalizing a utilitarian calculus that reduces complex lived realities to administrative data points. This could erode trust between disabled students and the institution, signaling that their unique barriers are only recognized when converted into standard units. The moral cost of implementing a conceptually illegitimate system may outweigh the benefit of slightly more efficient allocation. Furthermore, institutionalizing such metrics creates path dependency, where future budgets assume these comparisons are valid, making it harder to shift to a more equitable model later.

  **6. Implementation or Alternative**
  If approved, the pilot shall run for one academic year with a cap on total funds allocated via the index. Reviewers must apply two evaluative criteria: first, a disparity audit checking if specific disability categories consistently receive lower priority scores despite high resource requests; second, a qualitative feedback loop where funded students report on the accuracy of the deficit assessment. A subcommittee comprising disability services staff and ethics faculty will review interim data at the semester mark. If the disparity audit reveals systematic skewing against non-normative experiences, the weighting methodology must be suspended. The timeline requires finalizing the audit criteria by next week, with the first allocation cycle beginning next month. This ensures active ethical supervision rather than black-box operation. Additionally, any case where the index score contradicts a clinician's urgent recommendation must trigger a manual override review. This ensures that quantitative metrics do not supersede expert qualitative judgment in high-stakes scenarios.
