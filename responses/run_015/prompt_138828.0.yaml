  # NATURALIZING CONTENT: A DECISION TREE FOR REALISTS & SKEPTICS

  **START:** You accept that at least some internal states of a system are genuinely *about* stuff in the world.

  ### NODE 1: The Frog Case (Determinacy)
  **Case:** A frog's retinal cell fires at small, dark, moving spots. It catches flies with this mechanism, but it also fires at BB pellets flicked past its nose. The frog cannot tell the difference.
  **Question:** Is there a fact of the matter about whether the state represents "fly," "food," or just "dark moving spot," or is the question indeterminate?
  *   **No Fact (Indeterminate):** → Go to **Leaf 1**.
  *   **Fact Exists:** → Go to **Node 2**.

  ### NODE 2: The Swampman Case (History Requirement)
  **Case:** A molecule-for-molecule duplicate of a human is created by a cosmic accident. It has no evolutionary ancestry and no past causal interactions with the world, but it behaves normally.
  **Question:** Does its brain state "water" genuinely refer to water?
  *   **No (History Required):** → Go to **Node 3**.
  *   **Yes (Current State Sufficient):** → Go to **Node 7**.

  ### NODE 3: The Deep Net Case (Type of History)
  **Case:** Consider a deep neural network trained by gradient descent. It has a history of weight adjustment (training) but no biological evolutionary history.
  **Question:** Does this training history count as the kind of history needed for content, or must it be biological evolution?
  *   **Must be Biological:** → Go to **Node 4**.
  *   **Training Counts:** → Go to **Node 6**.

  ### NODE 4: The New Mutation Case (Selection vs. Causal)
  **Case:** A brand-new beneficial mutation arises in a lineage for the first time. It carries information and raises fitness, but it has not yet been selected over generations.
  **Question:** Does this state have content immediately, or must it wait for a history of selection?
  *   **Must Wait (Selection Needed):** → Go to **Node 5**.
  *   **Immediate (Causal/Laws Needed):** → Go to **Node 6**.

  ### NODE 5: The Mismatch Case (Producer vs. Consumer)
  **Case:** A signal producer was selected to indicate *Predator*, but the downstream consumer system only functions correctly if it treats the signal as *Danger* (which might include non-predator threats).
  **Question:** Is the content determined by what the producer was selected to do, or what the consumer needs to do?
  *   **Producer:** → Go to **Node 5b**.
  *   **Consumer:** → Go to **Leaf 3**.

  ### NODE 5b: The Group Selection Case (Unit of Selection)
  **Case:** A state was selected because it helped *other* members of the species survive (kin/group selection), not the bearer of the state.
  **Question:** Does the content represent what benefited the group, or only what benefited the individual bearer?
  *   **Group Benefit:** → **Leaf 2**.
  *   **Individual Benefit:** → **Leaf 1** (Producer Teleosemantics).

  ### NODE 6: The Environmental Shift Case (Error & Laws)
  **Case:** A state was lawfully connected to *X* for a million years. Yesterday, the environment shifted so the state now co-varies with *Y*, but the old laws still hold counterfactually.
  **Question:** Does the state still represent *X* (allowing error), or does it now represent *Y*?
  *   **Represents Y (No Error):** → **Leaf 4**.
  *   **Represents X (Error Allowed):** → Go to **Node 6b**.

  ### NODE 6b: The Internal Scramble Case (Laws vs. Roles)
  **Case:** In the Shift scenario above, suppose we scramble the system's internal connections so it no longer infers *X*, but the external law connecting state to *X* remains.
  **Question:** Does it still represent *X*?
  *   **Yes (External Laws):** → **Leaf 5** (Bio AD) or **Leaf 6** (Net AD).
  *   **No (Internal Roles):** → **Leaf 7**.

  ### NODE 7: The Exaptation Case (Correlation vs. Structure)
  **Case:** A brain structure was selected for thermoregulation but is now reliably co-variant with nearby predators (exaptation). It has no selection history for predation.
  **Question:** Is its content determined purely by this current reliable co-variation?
  *   **Yes (Correlation):** → **Leaf 8**.
  *   **No (Needs Mapping/Use):** → Go to **Node 8**.

  ### NODE 8: The Alien System Case (Realism vs. Instrumentalism)
  **Case:** We can perfectly predict an alien system's behavior by *pretending* it has beliefs, but its internal physics is utterly unlike ours.
  **Question:** Are the beliefs real features of the system, or just useful tools for prediction?
  *   **Useful Tools:** → **Leaf 9**.
  *   **Real Features:** → **Leaf 10**.

  ---

  ## THE LEAVES: POSITIONS & COMMITMENTS

  | Leaf | Position Name | Most Awkward Commitment | Trained Net Content? |
  | :--- | :--- | :--- | :--- |
  | **1** | **Eliminativism / Error Theory** | Denies the starting premise: our best science shows no state is ever *really* about anything. | **No** (Nothing has content). |
  | **2** | **Group Teleosemantics** | An individual's brain state can be about something that only benefits its cousins, not itself. | **No** (Requires biological group selection). |
  | **3** | **Consumer Teleosemantics** | Content is fixed by the downstream user; a signal can mean something the sender never "intended." | **Yes** (If downstream use is fixed by training). |
  | **4** | **Pure Informational Semantics** | Cannot account for misrepresentation; if the state fires, it represents whatever caused it. | **Yes** (If input-output correlation holds). |
  | **5** | **Asymmetric Dependence (Bio)** | Requires nomic laws that hold counterfactually; distinct from selection history. | **No** (Requires biological causal history). |
  | **6** | **Asymmetric Dependence (Training)** | Extends nomic laws to include gradient-descent history as a causal basis. | **Yes** (Training establishes asymmetric dependence). |
  | **7** | **Conceptual / Inferential Role** | Content is determined by internal connections; a brain in a vat could have the same thoughts as you. | **Yes** (If internal activation patterns match). |
  | **8** | **Pure Covariation / Indication** | Content shifts instantly if the environment changes; no stability across context shifts. | **Yes** (If statistical correlation is high). |
  | **9** | **Interpretivism / Instrumentalism** | Content is not intrinsic; it is what an ideal observer would attribute to make sense of the system. | **Yes** (If an interpreter finds it useful). |
  | **10** | **Structural Isomorphism** | Requires a formal mapping between vehicle structure and worldly structure; hard to define "structure." | **Yes** (If weight topology mirrors data manifold). |

  ---

  ## EMPTY PATHS & INDISTINGUISHABLE LEAVES

  ### Empty Combinations (Paths the tree allows but no theory occupies)

  1.  **Consumer Teleosemantics + Swampman "Yes":**
      *   *Path:* Node 2 (Yes) → Node 5 (Consumer).
      *   *Why Empty:* **Incoherent.** Consumer teleosemantics defines content by the *function* of the downstream system. Functions are historically selected effects. If you accept Swampman (no history), you cannot consistently ground the "function" required for consumer teleosemantics.
  2.  **Pure Informational Semantics + Error Allowed:**
      *   *Path:* Node 7 (Yes) → Node 8 (Real) → Claim "Content stays despite broken correlation."
      *   *Why Empty:* **Definitional Contradiction.** Pure informational views define content as reliable covariance. If correlation breaks, the information is gone. A view that allows error without laws (AD) or history (Teleo) collapses into structuralism or role semantics.
  3.  **Producer Teleosemantics + Deep Net "Yes":**
      *   *Path:* Node 3 (Training Counts) → Node 4 (Selection Needed) → Node 5 (Producer).
      *   *Why Empty:* **Unattractive/Unexplored.** While some argue training is analogous to selection, strict Producer Teleosemantics relies on *biological* fitness. Extending "fitness" to "loss functions" is usually done by Asymmetric Dependence or Structural views, not strict Producer Teleosemantics, which worries about the *origin* of the mechanism (evolution) rather than the *process* (optimization).

  ### Indistinguishable Leaves (Pairs the tree cannot separate)

  1.  **Leaf 8 (Pure Covariation) vs. Leaf 10 (Structural Isomorphism):**
      *   *Why:* In simple cases (like a thermostat or a basic classifier), reliable covariance *looks like* structural mapping. Unless the case involves a breakdown where correlation holds but structure fails (or vice versa), these two views predict the same content attributions. The tree separates them via the Exaptation case, but in standard ML cases, they often converge.
  2.  **Leaf 9 (Interpretivism) vs. Leaf 1 (Eliminativism):**
      *   *Why:* Both deny that content is an intrinsic, physical feature of the system. Eliminativism says "there is no content," while Interpretivism says "content is relative to an observer." In practice, when faced with a hard case (like the Frog), both often refuse to assign a determinate realist content, making them functionally identical for the student trying to classify a system's state.
  3.  **Leaf 5 (AD Bio) vs. Leaf 6 (AD Training):**
      *   *Why:* These are theoretically distinct (one requires evolution, one requires optimization history), but in any *actual* existing system, the distinction is moot. Biological brains have evolution; nets have training. There is no concrete case in the seminar where a system has one history but not the other to test the divergence, making them empirically equivalent for now.
