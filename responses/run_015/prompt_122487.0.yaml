  1. The doctrine implicitly adopts a reasons-responsiveness theory that grounds responsibility in the agent's cognitive capacity to recognize legal norms rather than in the causal origin of their desires.
  2. Automatism denies agency entirely rather than strictly presupposing alternative possibilities, while the duress defence merely sits well with that principle by acknowledging overwhelming external pressure on choice.
  3. Conversely, the refusal to excuse disposition and the cognitive framing of insanity demonstrate a firm commitment to actual-sequence ownership, rejecting the claim that determined character traits negate responsibility.
  4. The appellate split over the monitor defence arises not from rival theories but from the difficulty of applying a single hybrid standard to cases where actual-sequence reasoning coexists with removed alternatives.
  5. Thus, a unified theory explains both the pattern and the split by treating responsibility as requiring normative competence in the actual sequence, subject to narrow exceptions where immediate coercion destroys practical agency.
