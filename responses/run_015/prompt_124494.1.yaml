  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** The Constitution of Pain's Badness in Asymbolia
  **Framework:** Three-Layer Model of Nociceptive Experience

  ## 1. AGREED FOUNDATIONAL CLAIMS

  Both the Affective Essentialist (AE) and Symbolic-Functionalist (SF) camps endorse the following propositions as the baseline for this inquiry. These claims utilize the neutral Three-Layer Model (Layer 1: Nociception; Layer 2: Affective Coloring; Layer 3: Symbolic Valuation) without presupposing which layer constitutes "badness."

  1.  **Clinical Phenomenology of Asymbolia:** In cases of classic pain asymbolia, subjects retain Layer 1 capacities (discriminating location, intensity, and modality of noxious stimuli) and often retain a rudimentary Layer 2 capacity (reporting the sensation as "sharp" or "burning" and occasionally acknowledging a negative tonality). However, subjects consistently lack Layer 3 integration: they display no avoidance behavior, no defensive learning, no distress, and verbally deny that the experience is "suffering" or "bothersome."
  2.  **Neurofunctional Dissociation:** There is an empirically verified dissociation between the neural substrates supporting Layer 1 (primary/secondary somatosensory cortices) and those supporting Layer 2/3 integration (anterior cingulate, insula, and prefrontal regulatory networks). Asymbolia correlates with intact Layer 1 processing and disrupted connectivity or function in Layer 2/3 networks, though the precise boundary between Layer 2 and Layer 3 neural correlates remains under investigation.
  3.  **Logical Conditions for Attributing Badness:** Both camps agree that for an experience to be classified as "bad" in a medically and philosophically robust sense, it must possess *negative valence* (it feels a certain way) and *normative force* (it provides a reason for avoidance or cessation). The camps disagree on whether negative valence necessarily entails normative force, or whether normative force is a separate additive condition.
  4.  **Validity of the Three-Layer Model:** Both camps accept the heuristic utility of distinguishing:
      *   **Layer 1 (Nociception):** Sensory-discriminative processing of tissue threat.
      *   **Layer 2 (Affective Coloring):** The immediate phenomenal tonality (unpleasantness/pleasantness) associated with the sensation.
      *   **Layer 3 (Symbolic Valuation):** The cognitive-integrative process wherein the state is represented as *harmful-to-me* and incorporated into a self-preserving narrative or motivational system.

  ## 2. DISAGREEMENTS TABLE

  The following table outlines the divergent interpretations of the Three-Layer Model. Positions are stated in the internal vocabulary of each camp.

  | Issue | Affective Essentialist (AE) Position | Symbolic-Functionalist (SF) Position |
  | :--- | :--- | :--- |
  | **Requirement of Layer 3 for Badness** | Badness is constituted at Layer 2. The negative affective coloring *is* the badness. Layer 3 integration is a contingent downstream consequence of badness, not a constitutive requirement. | Badness is constituted at Layer 3. Affective coloring (Layer 2) is merely a qualitative signal; it becomes "bad" only when Layer 3 registers it as a threat to the self-system. |
  | **Significance of Absent Avoidance** | The absence of avoidance in asymbolia demonstrates a *disconnection* between badness and motivation. The badness is present but "silent"—phenomenologically real but motivationally inert due to Layer 3 damage. | The absence of avoidance demonstrates the *absence* of badness. If a state does not motivate self-protection, it lacks normative force and therefore cannot be classified as genuinely bad pain. |
  | **Status of "Proto-Pain"** | The category of "proto-pain" is ad hoc and phenomenologically incoherent. If Layer 1 and Layer 2 are present, it is pain. Removing the motivational output does not change the ontological status of the experience. | The category of "proto-pain" is necessary and precise. It describes a Layer 1 + Layer 2 state that lacks the normative closure of Layer 3. It distinguishes sensory-affective residue from full-blooded pain experience. |
  | **Nature of Asymbolic Report** | When asymbolics report "it doesn't bother me," they are reporting on their Layer 3 reaction, not their Layer 2 experience. They feel the badness but lack the concern that usually accompanies it. | When asymbolics report "it doesn't bother me," they are accurately reporting their total phenomenology. Without Layer 3 concern, the Layer 2 signal is not experienced as "bothersome" or "bad." |

  ## 3. PRECISE CRUXES

  Settling the following sub-questions would necessitate a significant revision of at least one camp's position.

  **Crux A: The Empirical Distinguishability of Silent vs. Absent Badness**
  Is there a phenomenological or behavioral marker that distinguishes a state where badness is present but motivationally silent (AE) from a state where badness is entirely absent (SF)? If the subjective report and behavioral output are identical in both scenarios, does the distinction collapse into metaphysical speculation?

  **Crux B: Normative Inertia of Affective Coloring**
  Can a phenomenal quality be intrinsically negative (Layer 2) yet normatively inert (providing no reason for action)? AE argues yes (the "Toothless Tiger"); SF argues no (negative valence is defined by its action-guiding role).

  **Crux C: The Locus of the "Subject"**
  Does the "badness" of pain require a robust, narrative self (Layer 3) to whom the pain is bad, or is a minimal phenomenal subject (Layer 2) sufficient to bear the burden of badness?

  ## 4. HYPOTHETICAL CASES AND DIVERGENT PREDICTIONS

  For each Crux, the following cases are agreed by both camps to be relevant tests. The predictions demonstrate where the theories diverge.

  ### Case for Crux A: The Retrospective Endorsement Test
  **Scenario:** A patient with temporary, pharmacologically induced asymbolia undergoes a painful stimulus (e.g., heat). During the stimulus, they report intensity but no suffering and show no withdrawal. Immediately after the drug wears off (restoring Layer 3 function), they are asked: "Was that experience *bad for you* while it was happening, even if you didn't care?"

  *   **AE Prediction:** The patient will endorse that the experience *was* bad at the time. They will distinguish between *feeling the badness* (which happened) and *caring about the badness* (which did not happen). The memory will retain a negative valence tag.
  *   **SF Prediction:** The patient will deny that the experience was bad at the time. They will characterize it as a "neutral sensation" or "mere information." Without the Layer 3 care at the time of experience, there is no badness to retrospectively endorse.

  ### Case for Crux B: The Artificial Affect Dissociation
  **Scenario:** Using direct neural stimulation, researchers induce a pure Layer 2 negative affective tone (a sense of "unpleasantness") in a subject, while simultaneously inhibiting Layer 3 self-referential processing. The subject is asked: "Does this feeling give you a reason to make it stop?"

  *   **AE Prediction:** The subject will report that the feeling is inherently "unpleasant" or "negative" (Layer 2 intact) but may express confusion about *why* they should stop it if it isn't harming "them." However, the phenomenal negativity remains identifiable as "badness" even if the imperative is weak.
  *   **SF Prediction:** The subject will report the sensation as "intense" or "salient" but will deny it is "bad" or "unpleasant" in the normative sense. Without the Layer 3 link to self-preservation, the affect is merely a qualitative shade, like a loud noise that is not annoying.

  ### Case for Crux C: The Alien Attribution Scenario
  **Scenario:** A subject undergoes a procedure where Layer 1 and Layer 2 signals are generated, but Layer 3 processing attributes the source of the signal to *another person* (a delusion of somatic ownership), despite the signal occurring in the subject's own body. The subject perceives the pain as belonging to a neighbor.

  *   **AE Prediction:** The subject still experiences the badness. The negative affect (Layer 2) is intrinsic to the experience regardless of who the Layer 3 system thinks owns the body. The badness is felt, even if misattributed.
  *   **SF Prediction:** The subject does not experience the state as "pain" in the badness-implying sense. Because the Layer 3 system does not register the state as *harmful-to-me*, the normative force is absent. It is experienced as observing someone else's pain, which is cognitively distinct from suffering pain oneself.
