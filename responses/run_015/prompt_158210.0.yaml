  4.  **Identify Tensions/Inconsistencies:**

      *   *Uniqueness vs. Pluralism:* If joints are unique, pluralism fails. If pluralism holds, uniqueness fails. Given the interdisciplinary nature, Pluralism is likely required, meaning "Uniqueness of Joints" must be dropped.
      *   *Essence vs. Variation:* Microstructural essence fails for species/cell types. HPC handles variation but struggles with the "why" of the clustering (sometimes).
      *   *Strict Kindhood vs. Degrees:* Traditional views say something is or isn't a kind. Scientific practice suggests degrees (better/worse kinds).

  5.  **Select the "Killer Constraint":**

      *   What kills Microstructural Essentialism (Kripke-Putnam)? The Biology/ML case (variation + pre-mechanistic utility).
      *   What kills strict HPC? The ML case (statistical clusters without known homeostasis yet).
      *   *Candidate:* **Interventional Stability.** A kind must support counterfactuals/interventions, not just observation. This kills "Grue" and "ML Artifacts" while allowing "Pre-mechanistic" kinds to be *candidate* kinds pending causal discovery.

  6.  **Drafting the Response (Iterative refinement):**

