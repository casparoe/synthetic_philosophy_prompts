  2.  **Deconstruct the Desiderata (Drafting the List):**

      *   *Inductive Power:* Must explain *why* we can project properties. (Non-negotiable).
      *   *Explanatory Depth:* Must link to *why* the properties cluster (causal/mechanistic). (Non-negotiable for "science in motion").
      *   *Stability vs. Change:* Must handle theory change (phlogiston out, gold stays). (Non-negotiable).
      *   *Pluralism:* Must allow multiple valid carvings (scale/perspective). (Preference/Constraint tension).
      *   *The "Jade" Intuition:* Must distinguish disjunctive kinds from unified ones. (Camp preference? Maybe non-negotiable for explanation).
      *   *The "Biology" Intuition:* Must handle variation/exceptions (species). (Non-negotiable for the biologist).
      *   *The "ML" Intuition:* Must handle pre-mechanistic clusters. (The user's specific focus).
