answer: |-
  You are certainly not inventing a spurious unity. What you have identified is a genuine and widely discussed tension, though it tends to be treated differently depending on whether one is looking through the lens of social psychology or political philosophy. Your observation is sharp enough that it could form a substantial chapter of your Extended Project.

  To give you the 'carving' you asked for, we need to separate the *mechanism* (why people do this) from the *justification* (whether they ought to).

  ### 1. The Psychological Mechanism: BIRGing and CORFing

  In social psychology, the behaviour you describe regarding sports victories and defeats has a recognised name. It is known as **BIRGing** (Basking In Reflected Glory) and **CORFing** (Cutting Off Reflected Failure).

  This falls under **Social Identity Theory**. The theory posits that individuals derive part of their self-esteem from the groups to which they belong. When the group succeeds, the individual incorporates that success into their self-concept ('*We* won'). When the group fails or acts immorally, the individual distances themselves to protect their self-esteem ('*They* did it').

  **How your case differs:**
  BIRGing and CORFing are typically studied in contexts of immediate, voluntary affiliation (like supporting a football team). Your observation is more profound because it applies to *national identity*, which is usually involuntary (you are born into it) and spans deep time.
  Psychologically, however, the mechanism is likely the same: **motivated reasoning**. The boundary of the group is not being drawn based on a consistent principle (e.g., 'all citizens past and present'), but is being drawn to maximise psychological comfort.

  ### 2. The Philosophical Problem: Collective Responsibility

  In philosophy, this touches on the debate over **collective responsibility** and **intergenerational justice**. Here, there isn't a single term for the *asymmetry* you noticed, but there are established positions that try to resolve it.

  The inconsistency you spot arises because people are switching between two different models of national membership without admitting it:

  1.  **The Ethical Community Model:** The nation is a continuous moral agent across time. If this is true, you inherit both the assets (culture, institutions, discoveries) and the liabilities (debts, injustices, atrocities).
  2.  **The Voluntary Association Model:** The nation is a club of current citizens who endorse certain values. If this is true, you only own what you personally endorse.

  Your observation is that people claim the **Ethical Community** model when claiming credit (the scientist from 1820 is 'ours') but switch to the **Voluntary Association** model when facing blame (the slaver from 1820 is 'not really us').

  Conversely, the critics you mention (who accept guilt but refuse pride) are doing the reverse. They treat the nation as a continuous legal entity for the sake of debt (reparations) but as a moral abomination for the sake of pride.

  **Nearest Philosophical Concepts:**
  *   **David Miller's 'National Responsibility':** The political philosopher David Miller argues that nations *can* bear responsibility across generations, not because current citizens are guilty of past acts, but because they inherit the *benefits* of those acts. This attempts to link the credit and the blame. If you keep the wealth generated by the empire, you bear some responsibility for the empire.
  *   **The Non-Identity Problem:** This is a technical ethical problem (associated with Derek Parfit) which asks how we can be harmed by past actions if those actions were necessary for us to be born at all. It complicates the 'guilt' side of your observation.

  ### 3. Is it One Phenomenon or Several?

  It is best understood as one underlying cognitive bias (**motivated group identification**) manifesting in two normative directions.

  However, there is a distinction to be made between the **uncritical patriot** (who takes credit but denies blame) and the **critical cosmopolitan** (who accepts blame but denies credit).
  *   The former is usually driven by *esteem protection* (psychology).
  *   The latter is often driven by a *political principle* (that pride is dangerous, but justice is mandatory).

  So, while the logical structure is identical (flexible boundaries), the motivations may differ. In your EPQ, you should treat them as symmetrical logical moves, even if the psychological drivers differ.

  ### 4. Is There a Defensible Version of This Move?

  You asked whether there is a principled story on which a community can be a source of pride without being a source of responsibility, or vice versa. There are two defensible arguments here, though neither fully supports the 'flexing' boundary you observed.

  **Argument A: Pride in Values, Responsibility for Actions (The Liberal Defence)**
  One could argue that we should only identify with the *enduring values* of our country, not its specific historical actions.
  *   *Pride:* We celebrate the scientist not because he was 'British' in a tribal sense, but because he embodied values of inquiry and reason that we still hold.
  *   *No Guilt:* We reject the slaver because he embodied values (racism, exploitation) that we explicitly reject.
  *   *Verdict:* This is consistent. It avoids the flexing boundary by making the boundary *moral* rather than *national*. However, it risks sanitising history; if we only own the 'good' bits, do we truly own the country, or just an idealised version of it?

  **Argument B: Obligations without Emotions (The Civic Defence)**
  One could argue that **reparations** are not about guilt, but about **unjust enrichment**.
  *   *Guilt:* I do not need to feel personal guilt for slavery (I didn't do it).
  *   *Responsibility:* However, if my society is built on wealth generated by slavery, I have a civic duty to rectify that imbalance.
  *   *Pride:* Conversely, I need not feel personal pride in a past discovery, but I can be grateful for the infrastructure it provided.
  *   *Verdict:* This separates *emotional identification* (pride/shame) from *political obligation* (taxation/reparation). This is perhaps the most robust defence. It allows one to say: 'I am not guilty, but I am responsible.'

  ### 5. Advice for Your EPQ

  For your project, this observation is a goldmine. It moves the debate away from the clichéd 'Patriotism is good/bad' binary and into the mechanics of how national identity functions.

  I would suggest you structure part of your argument around the **consistency of identification**.
  *   If the nation is a 'community of fate' (which justifies welfare, shared defence, etc.), does that community stop existing when the history turns dark?
  *   You might use the term **'Selective Tradition'**. This is a sociological concept where a culture actively selects which parts of its past to celebrate and which to forget. Your observation is the psychological engine that drives Selective Tradition.

  **In summary:**
  You have identified a form of **motivated reasoning applied to social identity**. In psychology, it aligns with **BIRGing/CORFing**. In philosophy, it highlights a tension between **inheritance models** and **voluntary models** of citizenship.

  It is not a fallacy in the strict logical sense, because 'the nation' is a contested concept; its boundaries *are* flexible by definition. However, the *opportunistic* shifting of those boundaries to suit one's moral comfort is vulnerable to the charge of **bad faith**. A defensible position requires a consistent criterion for membership: either we inherit the whole story (warts and all), or we identify only with specific values (which may not be uniquely 'national').

  This distinction between *emotional identification* and *civic obligation* is likely where you will find the most nuanced material for your conclusion. Good luck with the writing.
