answer: |-
  Your hypothesis is penetrating, yet I suspect it is only partly right. You suggest the impasse is functional: that the protagonists are disagreeing about what a social welfare function is *for*—whether a ranking of states, a decision rule, or an encoding of reasons. This captures the atmosphere of the dispute, but it risks diagnosing a verbal misunderstanding where there is actually a substantive ethical collision. The debate is not merely that the sides are answering different questions under one name; it is that they are answering the same question—'How ought we to aggregate conflicting claims?'—but prioritising incompatible virtues. One side prizes rational consistency across uncertainties; the other prizes equity across realised outcomes. To call this verbal is to let them off too lightly.

  Consider the core tension you have identified. The Harsanyi camp argues that if you accept the axioms of rational choice for individuals, and you accept that society should not override unanimous preference (Pareto), then the weighted-sum conclusion is inescapable. This is a argument from coherence. To reject it is to invite irrationality into the social calculus. The critics, however, are not denying the mathematics; they are denying that *ex ante* Pareto efficiency is the correct moral constraint. They argue that a society is not a single giant individual facing a gamble. When the uncertainty resolves, there are no longer probabilities, only winners and losers. If the rule permits a outcome where everyone knows, after the fact, that the loser was sacrificed for a aggregate gain that never materialised for them, the rule violates a distinct moral intuition about separability of persons.

  This is where your mathematician's 'long-run collapse' reply requires careful handling. His point is technically sound: if a society faces an infinite sequence of independent distributive choices, the law of large numbers ensures that the realised utilities will converge to the expected utilities. The *ex ante* promise matches the *ex post* reality in the limit. Consequently, the objection based on the mismatch between expectation and outcome dissolves over time. However, this reply relies on a hidden empirical and ethical assumption: that the relevant unit of moral concern is the society over infinite time, rather than the individual within a finite life.

  For the critic, the 'long run' is a place where we are all dead. If the sequence of choices is not infinite, or if the losses are correlated (as they often are in structural injustice), the convergence fails. More importantly, even if the aggregate converges, the distribution of the error might not. One person might bear the brunt of the variance while another reaps the stability. The mathematician's reply assumes that separability across decisions is valid—that a loss today can be compensated by a gain tomorrow in the social ledger. But if the loss is irreversible (health, liberty, life), or if the compensation never reaches the specific loser, the long-run argument collapses morally even if it holds statistically. Thus, the reply does not dissolve the objection; it merely relocates it to the non-repeatable, high-stakes cases that often matter most in political philosophy.

  So, is the debate substantive? Yes. It turns on whether morality is primarily about the rationality of the choice procedure or the fairness of the resulting state of affairs. The Harsanyi view treats social choice as an extension of individual rationality under uncertainty. The critic views social choice as a mechanism for reconciling distinct lives that cannot be merged into a single expectation. This is not a confusion about the purpose of the function; it is a disagreement about the metaphysics of the social group. Is society a single agent writ large, or a collection of separate agents whose boundaries must be respected?

  Regarding your question on progress: what would count as movement here? It is unlikely to come from a new theorem, because the existing theorems are not in dispute. The formal results are stable. Progress would instead look like a clearer delineation of domains. We might accept that the weighted-sum rule is the correct guide for small-scale, repeatable policy decisions where risks are pooled and lives are not ruined by variance—precisely the realm where your mathematician's long-run objection holds sway. Conversely, we might concede that for fundamental rights, irreversible harms, or one-off constitutional choices, the *ex post* perspective must dominate, even at the cost of rational consistency.

  Alternatively, progress might involve abandoning the search for a single social welfare function altogether. If the impasse arises because we are trying to force two distinct moral values—consistency and equity—into one mathematical object, then the solution is to accept pluralism. We might need a lexicographic ordering or a constrained optimisation where the weighted sum is maximised only subject to *ex post* floors. This changes the question from 'Which formula is true?' to 'How do we trade off competing moral demands?'

  However, there is a sombre reason to think the debate may never fully resolve. It touches on a foundational split in ethical theory that predates the mathematics: the clash between contractarianism and consequentialism. The veil of ignorance argument is contractarian; it asks what rational agents would choose. The *ex post* criticism is often consequentialist or rights-based; it asks what the world looks like after the choice. These are deep structural differences in how we conceive of obligation. As long as philosophers disagree on whether morality is about the purity of the will (or the procedure) or the goodness of the outcome, this specific technical dispute will remain a proxy for the wider war.

  For your novel, this offers rich terrain. The senior theorist is not merely defending a formula; he is defending a vision of society as a unified rational agent. The young philosopher is defending the separateness of persons. The mathematician offers a seductive escape via probability, but one that fails to comfort those facing the variance. The tragedy of the scene is that all three are logically coherent within their own frames, yet mutually unintelligible across them. The impasse persists not because the mathematics is unclear, but because the mathematics is too clear: it reveals precisely where our moral intuitions fracture. Progress, then, is not a solution, but the clarity to see that the fracture is real.
