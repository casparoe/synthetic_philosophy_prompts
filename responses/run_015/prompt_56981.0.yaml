  I'm auditing a seminar on ancient political philosophy this term, mostly to keep my reading Greek alive, and the stretch nobody else seemed to care about was the long bit in Plato's Laws where the Athenian Stranger starts talking about drinking parties — my professor blew past it in about four minutes and moved on to the mixed constitution, but I've been argueing with it in my head for a week now and I want to pressure-test it properly before I write anything up. So: play the Athenian Stranger. Not Plato-the-author giving me a lecture on what scholars think the passage means, and no modern philosophy or psychology vocabulary — you get the concepts available to a Greek in the fourth century BCE plus whatever I tell you, and if you need a fact about how wine actually behaves in bodies (tolerance, how much it takes to loosen someone up, whether the same man drunk on Monday is drunk on Tuesday) you ask me and I'll answer like a traveler reporting what he's seen. Stay in character the whole time until I say stop, concede whatever the Stranger would honestly concede but never give up the central proposal, keep each reply to about two paragraphs so it feels like a conversation, and don't name any philosopher after Aristotle unless I do first.

  Here's the position I want you holding, and correct me in character if I've got it wrong: wine is a cheap and mostly harmless drug that does what fear does in reverse — it heats the soul, fills a man with confidence and then with recklessness, and in that state his real disposition shows itself the way metal shows its temper in fire. So rather than banning it, the city should put it to work: hold the parties under a sober older man who controls the mixing and the pace, and there you'll see which of your citizens can stay measured while pleasure is pushing at him — a harder and more useful test than whether he stands firm when he's frightened, since every city drills men for fear and almost none drill them for pleasure. Give it in small doses and gradually, the way you'd accustom a child to the things that scare him, and besides the testing you get friendship among the drinkers and something like a medicine for the old. Megillus the Spartan thinks all of this is license; assume he and Cleinias have walked ahead and it's just you and me on the road to the cave.

  My opening move: I don't think your test measures anything. You say the symposium shows what a man is really like, but the only symposium you're willing to allow is one where a sober old man is standing over the bowls deciding how much gets poured, so what you're actually observing is a citizen behaving himself while the city is in the room — which is exactly the Spartan drill, and exactly what I'd object to there too. A man who's moderate because a supervisor is watching hasn't been shown to be moderate; you've shown that supervision works, and you already knew that. So either you admit the party tells you nothing about character and you keep it for the friendship and the medicine, or you tell me what the supervised symposium reveals that a lifetime of supervised obedience wouldn't have revealed anyway — and if your answer is that the wine eventually outruns the supervisor's control, then you've built a machine whose whole purpose is to produce the moment when the man being tested stops being tested, which seems like a strange thing for a lawgiver to want. (It's 11pm, I've had way too much coffee, please be patient with me. American English, thanks.)
