  The Setup
  Quine's "Two Dogmas of Empiricism" detonated reductionism and truths true come what may. He left a flat web of belief where any statement holds if we adjust elsewhere. The stake is whether a serious distinction—graded, contextual, or functional—can survive this holism. They seek a boundary explaining competence and stability without retreating to the pre-Quinean myth. They require differential resistance, not immunity.

  The Desiderata
  1. **Holistic Consistency:** The theory cannot posit isolated verification. *Motivation:* Quine's Duhemian point that hypotheses face the tribunal of experience as a corporate body. Any distinction must locate stability within the web, not outside it. If a statement is analytic, it must still connect to experience via the whole theory. *Status:* Non-negotiable.
  2. **Logical Stability:** It must explain why logic and math are rarely revised without declaring them immune. *Motivation:* We revise logic (e.g., intuitionistic or quantum logic) only under extreme duress, unlike ordinary claims like 'there is a brick here'. The theory must account for this centrality without appealing to mysterious intuition or pure reason. *Status:* Non-negotiable.
  3. **Naturalism:** No "first philosophy" outside science. *Motivation:* Epistemology must fall within psychology and natural science. Invoking sui generis philosophical knowledge violates Quine's naturalized constraint. *Status:* Negotiable; strict Quineans demand this, but neo-Carnapians might allow conceptual engineering outside empirical science.
  4. **Extreme Pressure Cases:** It must handle shifts like non-Euclidean geometry without collapsing them into ordinary empirical hypotheses. *Motivation:* Changing geometry wasn't like finding a new planet; it was constitutive of the physical framework. Treating it as merely empirical misses its role in defining objects. The theory must explain why we feel compelled to change the framework rather than the data. *Status:* Non-negotiable.
  5. **Convention vs. Confirmation:** Distinguish these without a sharp binary. *Motivation:* Carnap's frameworks versus Quine's continuum. We need to identify linguistic conventions without claiming they are unfalsifiable. The distinction must track how we adopt languages, not just how we verify sentences. *Status:* Non-negotiable.

  *Joint Unsatisfiability:* There is a severe tension between (1) and (4). If all beliefs are equally holistic (1), distinguishing constitutive shifts (4) risks reintroducing the analytic dogma. A successful theory must show differential entrenchment is purely pragmatic, not metaphysical. If one demands a metaphysical ground for (4), the set is jointly unsatisfiable. The non-negotiables demand a pragmatic explanation of necessity that looks like analyticity but isn't. Many argue this is impossible; if the distinction is purely pragmatic, it fails to do the philosophical work desired. If it does the work, it risks becoming metaphysical analyticity. This is the crux: can pragmatic centrality mimic analyticity sufficiently? If the answer is no, the project fails. The negotiable status of Naturalism offers an escape hatch: if one allows conceptual truths outside science, (4) becomes easier, but Quineans will reject the cost. Ultimately, the demand for a *boundary* itself may be the prejudice; perhaps only a topology of belief is possible. This implies that any adequate reconstruction must abandon the idea of a boundary as a line and treat it as a gradient of revisability costs. Consequently, the reconstruction must redefine 'analytic' as 'maximally central'.

  Contenders at a Glance
  Pure Quinean holism satisfies Holistic Consistency and Naturalism but fails Logical Stability and Extreme Pressure cases by flattening all revisions into pragmatic adjustments. It denies the boundary exists. Reconstructed Carnapian conventionalism handles Convention vs. Confirmation and Extreme Pressure well by positing linguistic frameworks, but struggles with Naturalism and Holistic Consistency, often smuggling in first philosophy. The graded-centrality view (e.g., Putnam) attempts the middle path: it meets Holistic Consistency and Logical Stability by treating analyticity as deep entrenchment. However, it risks collapsing into Quineanism if the gradient offers no qualitative difference, or into Carnapianism if it posits hidden rules. It best satisfies the non-negotiables but remains vulnerable to the charge that pragmatic depth is not analyticity. Each fails to fully resolve the joint unsatisfiability tension without conceding a core desideratum.

  What Would Change My Mind
  I would abandon this framework if a convincing argument showed that pragmatic entrenchment is categorically distinct from analyticity, not just functionally equivalent. If someone demonstrates that normative constraints on meaning cannot arise from descriptive facts about usage, the naturalized desiderata collapse. My reasoning is most likely to fail in classifying Naturalism as negotiable; if conceptual truth requires non-natural norms, the whole project fractures. Alternatively, if the joint unsatisfiability claim is too pessimistic, and a formal model shows how convention emerges from holism without residue, the boundary becomes viable.
