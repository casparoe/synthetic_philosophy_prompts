      *   The tension comes from the paper stacks. Which one is "actual"?

  5.  **Refining the Ambiguity:**
      *   In standard English, "If we sign, the war stops" is indicative. "If we signed, the war would stop" is counterfactual/subjunctive.
      *   To make the ambiguity work based on the prompt's specific constraint ("listener can't tell whether she's pointing to the actual printed future or to a branch that was thrown away"), I need to blur the line between *will* and *would* or rely on the physical evidence overriding the grammar.
      *   Actually, the prompt says: "The protagonist needs to say something like 'if we sign the treaty, the war stops' but the listener can't tell whether she's pointing to the actual printed future (indicative) or to a branch that was thrown away (counterfactual)."
      *   So the grammar is the same, but the *referent* of the conditionals is ambiguous because both exist physically.
      *   Wait, if the machine prints *every* possible timeline, then there is a printout where they sign and war stops, and a printout where they don't sign and war continues.
      *   If Elara says "If we sign, the war stops," she implies the signing is the condition for the actual future.
      *   If Kael thinks she's referencing a discarded printout, he thinks she means "In the timeline where we sign (which we aren't doing), war stops. But in *this* timeline (where we don't), war continues."
      *   So the ambiguity isn't just grammatical, it's indexical. Which stack is *this* world?

  6.  **Writing - Step-by-Step:**
      *   *Opening:* The printer humming. Stacks of paper everywhere.
