prompt: |-
  hey for tuesdays seminar on indicative vs counterfactual conditionals i want you to write a short story—maybe 500 words—set in a diplomatic negotiation where one side has access to a deterministic prediction engine that prints out every possible timeline, so counterfactual reasoning is literally just reading a discarded printout. The protagonist needs to say something like "if we sign the treaty, the war stops" but the listener can't tell whether she's pointing to the actual printed future (indicative) or to a branch that was thrown away (counterfactual), and because of that ambiguity they almost start a preemptive strike. I want the plot to turn on the grammar of conditionals interacting with this weird epistemic setup—don't just explain the difference, show it causing a real misunderstanding in dialogue. Keep it weird but coherent, and don't lean on standard textbook examples; invent the scenario from scratch.
