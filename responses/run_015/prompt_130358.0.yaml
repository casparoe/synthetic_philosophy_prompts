answer: |-
  The printer hummed, a low, vibrating thrum that settled in the marrow of Ambassador Vess's bones. It spat out sheets of thermal paper, cascading onto the polished mahogany like snow. Each sheet was a timeline. Most were crumpled, discarded futures where the谈判 failed, where the bombs fell, where the sky burned.

  General Kael stared at the growing drifts of paper. His hand hovered over the secure line to the missile silos.

  Vess slid a single sheet across the table. It was warm. "If we sign the treaty, the war stops," she said. Her voice was flat, indicative. She was stating a fact about the world.

  Kael didn't touch the paper. He looked at the printer, still churning out endless variations. "Which one?" he asked.

  "This one," Vess said, tapping the sheet.

  "There are ten thousand sheets in the bin behind you," Kael said, his voice tight. "I saw a stack where I shoot you. I saw a stack where you shoot me. I saw a stack where we sign, and the war continues anyway because your flank generals disobey." He leaned forward. "When you say 'If we sign,' are you telling me what *will* happen? Or are you showing me a ghost?"

  The ambiguity hung in the air, heavy as lead. In the age of the Oracle Engine, the indicative conditional had collapsed. To say "If P, then Q" was no longer a prediction of the actual future; it was merely a description of *a* future contained in the printout. Unless Vess anchored the statement to the *actual* timeline, her sentence was indistinguishable from a counterfactual: *If we were to sign (but we won't), the war would stop.*

  Kael's finger tightened on the phone. If Vess was describing a discarded branch—a counterfactual peace—then the actual branch was war. If she believed peace was only possible in a timeline they weren't occupying, then negotiation was useless. Preemption was the only logical move.

  "You think I'm reading from the trash bin," Vess said.

  "I think the machine prints lies just as often as truths," Kael said. "It prints everything. Your sentence is true in half these sheets and false in the rest. Why is this sheet reality?"

  "Because I haven't torn it off yet."

  Vess slammed her hand down on the printer's output tray, stopping the flow. The hum died. The silence was abrupt, violent. She held the paper down, physically binding the future to the present moment.

  "The engine prints possibilities," Vess said, locking eyes with him. "But only one sheet feeds the ink. This paper is still warm from the head. The others are cooling. If I let go, this becomes history. If I tear it, it becomes counterfactual."

  She slid the paper closer, into his reach. "If we sign, the war stops. Indicative. Present tense. This is the branch we are standing on."

  Kael looked at the paper, then at the silent machine. The ambiguity remained—theoretically, she could be lying about which stack was active—but the cessation of the printer's hum acted as a modal operator. It forced the world to choose.

  He slowly withdrew his hand from the phone. "Don't let go," he whispered.

  "I won't," Vess said. "Pick up the pen."
