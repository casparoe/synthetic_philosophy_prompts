answer: |-
  Here is the breakdown of the concepts, the verdict, and the confidence flags you asked for.

  ### The Established Concepts

  **1. The Looping Effect (of Human Kinds)**
  *   **Origin:** Philosopher of science Ian Hacking (mid-1990s, specifically *The Looping Effects of Human Kinds*).
  *   **Where it fits:** This is almost certainly the name your friend half-remembered. Hacking argues that classifying people ("human kinds") is different from classifying rocks ("natural kinds"). When you label a group of people, they become aware of the label, adjust their self-understanding and behavior, and thus change the very thing that was classified. The classification then has to update to catch the new behavior.
  *   **Where it doesn't fit:** Hacking focuses heavily on the *people* changing their behavior to match (or resist) the label. Your observation is subtler: you are describing the *clinical description itself* drifting because the *sample pool* of diagnosed people is shifting (via the "wanted" vs. "dodged" dynamic), even if the label stays static. Hacking usually discusses new labels emerging (e.g., "multiple personality" becoming "DID"), whereas you are describing the *content* of an existing label quietly mutating.
  *   **Confidence:** 95%. This is the canonical philosophical term for feedback between classification and the classified.

  **2. Concept Creep**
  *   **Origin:** Psychologist Nick Haslam (2016).
  *   **Where it fits:** This describes the "wanted label" side of your observation perfectly. Haslam argues that harm-related concepts (trauma, abuse, bullying) expand over time to include milder experiences. This matches your "loop tightening" scenario where the category gets better at catching the mild end because people seek the accommodation/story.
  *   **Where it doesn't fit:** It only explains the expansion (the "wanted" direction). It does not account for the "dodged" direction where the category becomes artificially severe because only the coerced end up in the dataset. It also focuses on the *scope* of the word, not necessarily the *linguistic texture* of the clinical description.
  *   **Confidence:** 90%. Well-established in social psychology.

  **3. Ascertainment Bias (or Selection Bias)**
  *   **Origin:** Epidemiology/Statistics.
  *   **Where it fits:** This explains the mechanism of your "dodged label" scenario. If a condition is stigmatized, the only people who get counted are those who couldn't avoid the system (courts, schools). The clinical picture is then built on this skewed sample, making the condition look more severe and antisocial than it is in the wild.
  *   **Where it doesn't fit:** It is a statistical error, not a cultural process. It explains *why* the picture is wrong, but it doesn't capture the *feedback loop* of language (patients -> clinicians -> patients) that you are interested in. It's a static snapshot error, not a dynamic evolution.
  *   **Confidence:** 95%. Standard medical term.

  ### The "Direction" Moderator

  You asked if the "Wanted vs. Dodged" dynamic has a name.

  *   **Verdict:** There is no single, canonical term for this specific moderator in the literature I can access.
  *   **Closest existing terms:** Scholars discuss **Diagnostic Utility** (benefits of the label) vs. **Stigma** (costs of the label). In critical psychiatry, this is sometimes discussed under **Label Avoidance** vs. **Label Seeking**.
  *   **Suggestion:** If you need a term for your afterword, **Label Valence** is the most precise descriptive coinage. "Positive Valence" (wanted/accommodation) tightens the loop toward mildness; "Negative Valence" (dodged/stigma) inverts it toward severity.
  *   **Confidence:** 40% that "Label Valence" is a standard term. I am 90% confident there is *no* single famous noun for this specific moderator, though the dynamic is widely discussed.

  ### The Verdict

  **Use: "The Looping Effect."**

  **Why:** It is the only term that captures the *human* element of the feedback. "Ascertainment Bias" is too cold; "Concept Creep" is too one-sided. Hacking's "Looping Effect" is the umbrella under which your observation sits.

  **How to use it:** You need to claim a specific *flavor* of it. Hacking usually talks about people changing their *behavior*. You are talking about the *description* changing because the *population* entering the category is shifting. You can write: *"This is a variation on Ian Hacking's Looping Effect: not just that the people change to fit the label, but that the label's definition drifts depending on who is willing to carry it."*

  ### The Edges

  To help you test if you're using it right:

  *   **Clearly Inside:** **Multiple Personality Disorder (now DID).** Hacking's own favorite example. As the diagnosis became famous, patients began presenting with more alters, using the language they read in case studies. The clinical picture changed because the patients knew the picture.
  *   **Clearly Outside:** **Type 1 Diabetes.** The clinical description does not change based on whether patients want the label. The presence of autoantibodies is not influenced by the patient's reading habits or desire for accommodation. (This is a "Natural Kind" vs. an "Interactive Kind").
  *   **Genuine Hesitation:** **Autism Spectrum Disorder.** Is the broadening of the spectrum due to "Concept Creep/Looping" (people identifying with the traits and seeking diagnosis)? Or is it simply better science detecting what was always there? Experts genuinely fight over this. It sits right on the border of your phenomenon.

  ### Confidence & Disclaimer

  *   **Overall Confidence:** High on the concepts (Hacking/Haslam), Moderate on the specific application to your "direction" nuance.
  *   **Flag:** I am flagging **"Label Valence"** as a descriptive phrase I am suggesting, not a term I guarantee is in the textbooks. It is semantically accurate but may be a coinage in this specific context.
  *   **Claim I'd be least surprised to find is wrong:** That there is *no* specific name for the "Wanted vs. Dodged" moderator. It is possible there is a niche term in critical psychiatry (e.g., "The Stigma Gradient" or "Diagnostic Incentive Bias") that I am not retrieving. However, none of the major candidates (Hacking, Haslam, Foucault) use a single standardized noun for that specific vector.

  **Summary for your Afterword:**
  Call it **The Looping Effect**. Acknowledge Hacking. Then specify that the *direction* of the loop depends on the **Valence of the Label** (whether it is sought or dodged). This gives you the philosophical weight of the established term while preserving the precision of your own observation.
