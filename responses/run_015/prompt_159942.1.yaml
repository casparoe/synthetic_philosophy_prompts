answer: |-
  ### Specification for Intentionality-Rubric Stability

  To validate whether your annotation rubric measures a stable construct, the theoretical explanation you adopt must satisfy the following desiderata. I have taken definite positions on the ontological status of the data and the trade-offs required, as requested.

  #### I. Desiderata for the Explanation

  **1. The Core Asymmetry (Non-Negotiable)**
  *   **Requirement:** The explanation must predict that side effects labeled "harmful" are judged intentional at significantly higher rates than "helpful" side effects, holding belief, desire, and causal control constant.
  *   **Case:** The canonical Chairman vignette (Harm vs. Help).
  *   **Rationale:** If your rubric does not reproduce this asymmetry, it is not measuring the same construct as the Knobe Effect literature. If the theory cannot explain this, it is useless for your validation.

  **2. The Distinction Constraint (Non-Negotiable)**
  *   **Requirement:** The explanation must maintain a conceptual distinction between *Intentionality* and *Blameworthiness*. It must allow for a scenario where an agent is blameworthy but the act was unintentional, or intentional but not blameworthy.
  *   **Case:** Accidental harms (blameworthy negligence vs. intentional harm) or justified harms (intentional but praiseworthy).
  *   **Rationale:** **[Definite Position]** Your rubric claims to measure "intentional action," not "culpability." If the theory collapses these (i.e., claims "intentional" *means* "blameworthy"), your rubric is invalid for its stated purpose. It would be measuring moral condemnation, not action taxonomy.

  **3. The Ontological Target (Non-Negotiable)**
  *   **Requirement:** The explanation must treat the data as evidence for the **psychology of attribution (folk concept)**, not for **intentional action itself (metaphysics)**.
  *   **Case:** The fact that judgments flip based on moral valence despite identical causal structures.
  *   **Rationale:** **[Definite Position]** There is no metaphysical fact of the matter that changes between the Harm and Help cases; only the judgment changes. Therefore, your rubric measures *human judgment patterns*, not *worldly properties of actions*. Stability here means consistency in human psychology, not correspondence to external reality. **[Extrapolation:]** I assume your raters are naive to philosophical debates and are reporting raw intuition.

  **4. Variant Coverage (Preference / Theory-Dependent)**
  *   **Requirement:** The explanation must account for the following specific variants without ad-hoc adjustments:
      *   **Norm-Violating:** Asymmetry persists when the side effect is merely distasteful or rule-breaking (e.g., violating a dress code) rather than harmful.
      *   **Regretted:** Asymmetry diminishes if the agent explicitly expresses regret but proceeds anyway (the "Reluctant Agent").
      *   **Self-Benefit:** Asymmetry vanishes or reverses if the side effect benefits only the agent and harms no one else (e.g., a diet that improves health but causes nausea).
      *   **Certainty:** Asymmetry persists but overall intentionality ratings rise as probability moves from "likely" to "certain."
  *   **Rationale:** These test the boundaries of "moral valence." If your rubric is stable, it should react to these shifts predictably.

  **5. The Unsatisfiable Pair: Psychological Sufficiency vs. Moral Necessity**
  *   **The Conflict:** You cannot jointly satisfy **Psychological Sufficiency** (the standard philosophical view that belief + desire + causal control are *sufficient* for intentionality) and **Moral Necessity** (the empirical finding that moral valence is *necessary* to trigger the intentionality judgment in side-effect cases).
  *   **[Definite Position]:** **Moral Necessity wins.** Psychological Sufficiency must be abandoned for the purpose of rubric validation. The data show that belief/desire/control are *not* sufficient, as evidenced by the Help case. Your rubric must be scored knowing that "standard" psychological criteria will under-predict intentionality in harm cases and over-predict it in help cases.
  *   **Flag:** **[Unsatisfiable Pair]** You cannot have a rubric that adheres to traditional philosophical definitions of intention (Psychological Sufficiency) and also captures the Knobe Effect data (Moral Necessity).

  ---

  #### II. Evaluation of Theoretical Families

  Here is how the main explanatory families fare against the specification above.

  **1. Semantic / Conceptual-Role Accounts**
  *   *Thesis:* The concept of "intentional" literally includes moral valence in its truth conditions.
  *   *Performance:* Passes **Core Asymmetry** and **Norm-Violating**. Struggles with **Self-Benefit** (why does asymmetry vanish if the concept is moral?) and **Regret** (unless "deep values" are added).
  *   *Verdict:* Viable, but requires complex tuning for the Self-Benefit variant.

  **2. Deep-Self / Concordance Accounts**
  *   *Thesis:* An action is intentional if it aligns with the agent's "deep self" or enduring values, not just occurrent desires.
  *   *Performance:* Excellent on **Regret** (misalignment lowers intentionality) and **Self-Benefit** (if the agent values altruism, harming self for profit might be seen as unintentional regarding the harm). Good on **Core Asymmetry** (assuming people value not harming).
  *   *Verdict:* Strongest candidate for rubric stability across variants.

  **3. Conversational / Affect-Based Deflationary Accounts**
  *   *Thesis:* "Intentional" is a proxy for blame. We call it intentional to blame the agent.
  *   *Performance:* Passes **Core Asymmetry** easily. Fails **Distinction Constraint** catastrophically. Fails **Regret** (we still blame reluctant agents, yet intentionality ratings drop).
  *   *Verdict:* **Rejected** for your purpose.

  ---

  #### III. The Exclusionary Requirement

  The single requirement that excludes the most theoretical families is:

  **"The explanation must treat the asymmetry as a feature of the concept of intentionality, not merely a performance error or pragmatic implicature."**

  *   **Why:** This excludes **Deflationary/Pragmatic Accounts** (which argue the concept is standard, but usage is biased by blame) and **Error Theory** (which argues raters are simply making a mistake).
  *   **Impact:** It forces you to accept that your rubric is measuring a *moralized* concept of intentionality. If you reject this, you must conclude your raters are "wrong," which undermines the validity of using them as ground truth.

  ---

  #### IV. Summary of Positions & Extrapolations

  1.  **On Stability:** I take the position that **Rubric Stability** is compatible with **Normative Sensitivity**. The mechanism is stable (moral valence modulates intentionality), even if the output (Intentional/Not) varies. Do not seek a rubric that yields the same result for Harm and Help; seek one that yields the *asymmetry* reliably.
  2.  **On Ontology:** The data are evidence for **Folk Psychology**, not Metaphysics. **[Extrapolation:]** I am assuming your annotation project aims to predict human legal or moral judgment, not to discover the "true" nature of agency. If you aim for the latter, this rubric is fundamentally flawed.
  3.  **On the Unsatisfiable Pair:** I have ruled that **Psychological Sufficiency** must be discarded. Your coding manual cannot instruct raters to ignore moral valence in favor of causal structure, or you will lose the effect you are trying to measure.

  **Final Warning:** **[Extrapolation:]** I am inferring that your specific batches (Regret, Self-Benefit) align with canonical experimental philosophy data. If your "Regret" vignettes are too weak, the Deep-Self account will fail to predict the drop in intentionality, leading you to false negatives on rubric stability. Ensure your vignettes manipulate the *depth* of the regret, not just its presence.
