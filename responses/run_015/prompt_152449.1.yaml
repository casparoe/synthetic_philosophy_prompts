      *   *Round 4 (Structuralism & Other Powers):* Leo argues structuralism implicates Russia/Austria.
          *   *Ruling:* Leo wins this point. The "sleepwalkers" argument (Clark) supports this. Singling out Germany requires the intent argument (Fischer).

  5.  **Synthesizing the Conclusion:**

      *   *Unified Will:* Not required. Institutional capacity to decide is enough.
      *   *Corporate Analogy:* Fair for institutional continuity, less fair for moral culpability.
