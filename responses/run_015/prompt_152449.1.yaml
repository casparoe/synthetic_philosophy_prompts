      *   *Does collective responsibility require a unified national will?*
          *   Philosophical consensus: No. Methodological individualism argues only individuals act, but political realism and institutional theory argue states act as agents. A "unified will" is practically impossible for any large group. Responsibility is usually attached to the *decision-making apparatus*, not the populace's psyche.
          *   Verdict: Leo is wrong here. Mara is closer to standard political theory.

      *   *Is the corporate analogy fair?*
          *   Legal/Moral distinction: Corporations are legal persons. States are sovereign actors.
          *   Relevance: Both are collective entities where decisions emerge from structure, not just individual whim.
          *   Weakness: Corporate liability is often financial/regulatory. War guilt involves moral/historical judgment.
          *   Verdict: It's a useful heuristic (Mara), but Leo is right that legal fiction $\neq$ moral blame. However, states *are* treated as moral agents in international relations.

      *   *Does Fischer's argument depend on proving intentional planning rather than just structural pressure?*
          *   Fischer's Thesis (*Griff nach der Weltmacht*): Germany sought hegemony. The "September Program" and the "Blank Check" suggest deliberate risk-taking.
          *   Counter-arguments (Structuralists): The alliance system, mobilization schedules, and domestic instability created a "trap."
          *   Fischer's nuance: He argued for *calculated risk* driven by elite intent, not just drift.
          *   Verdict: Fischer relies heavily on intent (elite planning), but acknowledges structural pressures (encirclement). Leo is right that without intent, structuralism implicates everyone. Mara is right that Fischer emphasized intent.

      *   *Who is more right overall?*
          *   Mara understands the nature of state agency better (institutions act).
          *   Leo identifies the complexity of the German state (polycratic chaos) but sets too high a bar for responsibility (unified will).
          *   Leo's point about Russia/Austria is strong (shared responsibility), but doesn't exculpate Germany.
          *   Edge: Mara, but Leo has valid caveats.

      *   *What are they missing?*
          *   The distinction between *causal responsibility* (who started the fire) and *moral/political responsibility* (who pays for the damage).
          *   The evolution of the Fischer Controversy (it's not just "Germany did it" anymore; it's about *how* Germany did it compared to others).
          *   The purpose of assigning responsibility (historical understanding vs. retribution).

  4.  **Drafting the Adjudication (Move-by-Move):**

      *   *Round 1 (Intent vs. Fragmentation):* Mara cites Fischer's core claim (preventive war). Leo cites internal German fragmentation (polycracy).
