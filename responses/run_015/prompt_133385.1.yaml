  *   **Convergence in Probability:** Asserts that for large $N$, the probability your average differs from 69 cents by any margin is negligible. This is mathematically defensible but fragile; the reordering coupon shifts the limit to any value, proving 69 cents isn't intrinsic. It supports the quant only if you ignore the reordering coupon, which renders the limit arbitrary.
  *   **Ensemble Wealth Growth:** Asserts that total capital across many parallel players grows linearly at 69 cents per play. This is substantive for a fund managing aggregate risk but ignores individual ruin. It supports the quant's "printing money" claim but fails the compound version where typical wealth vanishes.
  *   **Geometric Growth Rate:** Asserts that your bankroll grows exponentially over time. This is false; the expected log-return is negative infinity, guaranteeing long-term ruin. It survives the reordering coupon but directly contradicts the quant's "printing money" claim.
  *   **Truncated Physical Realization:** Asserts that real-world bankroll caps force a finite, well-defined expectation. This is defensible practically but concedes the theoretical point, making value dependent on arbitrary limits. It supports the quant only by admitting the expectation is undefined without arbitrary external constraints.

  Convergence in Probability is the reading your source reached for, though it fails to survive the reordering coupon.
