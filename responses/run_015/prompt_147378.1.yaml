answer: |-
  This is a fantastic position to be in. You are doing exactly what a good scientist does: you're looking at a theory, listening to a critique, and then testing the boundaries of that critique with your own thought experiments (like your counter-scenario to the cheater detection task).

  Your brother is a useful foil here. He has captured the *popular* understanding of Evolutionary Psychology (EP), which is often a mix of accurate core concepts and exaggerated caricatures. Because he's a Freud believer, take his confidence with a grain of salt (modern psychology largely views Freud as historically important but scientifically outdated), but his summary is actually a perfect summary of the *criticisms* leveled against EP, even if he presents them as facts.

  Here is a breakdown of his claims, the "just-so story" critique, and how you can structure your paper without needing journal access.

  ### Part 1: Grading Your Brother's Summary
  Let's go through his four main points claim-by-claim.

  **Claim 1: "The brain isn't a general-purpose learning machine; it's separate modules built in the Pleistocene."**
  *   **Verdict:** **Fair.**
  *   **The Nuance:** This is the core hypothesis of EP, often called "Massive Modularity." They argue the brain is like a Swiss Army Knife (specialized tools) rather than a general-purpose computer. They focus on the Pleistocene (the Stone Age) because that is when human biology was largely shaped.
  *   **Defender's Pushback:** Defenders would say it's not *just* modules; there is some general flexibility. But the core idea that we have specialized instincts is accurate to the field.

  **Claim 2: "The method is: notice a behavior, make up a story about how it helped ancestors, and call that the explanation."**
  *   **Verdict:** **Caricature (but based on a real problem).**
  *   **The Nuance:** This is the heart of the "just-so story" accusation. It implies EP researchers work backward from the present to the past without evidence.
  *   **Defender's Pushback:** A careful evolutionary psychologist would say, "We don't just make up stories; we generate **predictions**." If the theory is true, it should predict things we haven't noticed yet. (We will come back to the Cheater Detection task as an example of this).

  **Claim 3: "A theory that explains everything can't be tested and isn't science."**
  *   **Verdict:** **Debatable/Philosophical.**
  *   **The Nuance:** This is a critique about **falsifiability**. If you can explain *both* why men are aggressive (to compete for mates) and why men are nurturing (to keep mates), the theory seems to explain everything and nothing.
  *   **Defender's Pushback:** They argue the theory *is* falsifiable. If you find a behavior that *reduces* reproductive success without any offsetting benefit, or if you find a "module" that works better on abstract logic than social rules, the theory takes a hit.

  **Claim 4: "These things are innate/genetic, so parenting and culture don't matter."**
  *   **Verdict:** **Caricature/Strawman.**
  *   **The Nuance:** This is the most common misunderstanding. EP does not say culture doesn't exist.
  *   **Defender's Pushback:** They argue for **"Evoked Culture."** The idea is that we all have the same universal psychological "switches," but different environments flip different switches. For example, all humans have a capacity for language (innate), but whether you speak English or Mandarin depends on culture. EP says the *mechanism* is universal, not necessarily the specific behavior.

  ### Part 2: What is a "Just-So Story"?
  The term comes from Rudyard Kipling's book *Just So Stories*, which had fictional tales like "How the Leopard Got His Spots."

  **The Accusation:**
  When critics (most famously biologists Stephen Jay Gould and Richard Lewontin) call EP a "just-so story," they are accusing the field of **Hindsight Bias**.
  1.  Observe a trait (e.g., women prefer resource-rich men).
  2.  Invent a plausible past reason (e.g., resources helped survival in the Stone Age).
  3.  Claim the reason is proven because the story makes sense.

  The problem is that for almost any trait, you can invent a plausible story. If women preferred poor men, EP could say, "Spreading resources out ensured group survival." If the story can change to fit any outcome, it's not science.

  **The Defense:**
  A careful evolutionary psychologist responds by saying: **"We use the past to predict the present."**
  They argue that if their view of the "Stone Age Mind" is correct, it should reveal specific patterns *now* that a "General Purpose Mind" theory wouldn't predict.

  ### Part 3: Your Cheater Detection Counter-Scenario
  You asked: *If cross-cultural data failed, or if training fixed the abstract logic problem, would that kill the module claim?*

  **1. The Cross-Cultural Test:**
  If researchers went to a small-scale society and found people were *not* better at the social contract version of the task, **yes, that would severely damage the claim.**
  *   **Why?** Because EP claims these modules are **universal** human adaptations (part of our species-typical biology). If the "cheater detection" advantage disappears in a different culture, it suggests the advantage isn't a hardwired module, but something learned from a specific Western environment (like going to school or dealing with bureaucracy).
  *   **Could they absorb it?** They could try to say, "Maybe that culture has different social contracts," but if the advantage vanishes completely, the "universal module" claim is falsified.

  **2. The Training Test:**
  If you can train people to be just as good at the abstract version with an hour of practice:
  *   **EP Response:** This wouldn't necessarily kill the theory. EP argues that the brain is *biased*, not that it is incapable of learning.
  *   **The Argument:** They would say, "The fact that you need an hour of intense training to do abstract logic, but you do social logic intuitively without training, proves there is a specialized system for the social stuff." The *ease* of learning is the evidence of the module.
  *   **What would falsify it?** If people were naturally *better* at the abstract logic version than the social cheating version. That would contradict the idea that we evolved specifically to catch cheaters.

  **Is this the "Just-So" complaint?**
  No. The "Just-So" complaint is about making up stories for things we *already know*. The Cheater Detection experiment is actually a **defense** against that complaint because it predicted a specific cognitive asymmetry (Social > Abstract) that wasn't obvious before testing.

  ### Part 4: Your Hypothesis (Useful Then vs. Useful Now)
  You guessed: *"The confusion is that 'this trait was useful to our ancestors' and 'this trait is useful right now' are two totally different claims."*

  **Verdict:** This is a very strong insight, but it has a specific name: **Mismatch Theory.**
  *   **Useful Then:** The adaptation hypothesis (e.g., craving sugar was good when calories were scarce).
  *   **Useful Now:** The current utility (e.g., craving sugar is bad now when obesity is a risk).

  **Is this the main "Just-So" critique?**
  Not exactly. The "Just-So" critique is about **methodology** (how they prove things). Your point is about **application** (how we interpret the results).
  However, you can use this in your paper! You can argue that critics confuse EP saying "This behavior *was* adaptive" with "This behavior *is* good." EP usually claims the former, but pop-science (and maybe your brother) often implies the latter.

  ### Part 5: How to Structure Your Paper
  Since you can't access new papers, your strength is **critical analysis of the logic**. Do not just summarize the chapter. Use your brother's summary as the "Criticism" and the Chapter/EP defense as the "Response."

  **Suggested Outline:**

  1.  **Introduction:**
      *   Define Evolutionary Psychology briefly (brain as adapted tool).
      *   Introduce the "Just-So Story" criticism (the idea that EP just makes up untestable stories).
      *   **Thesis:** While the "just-so" criticism highlights a real risk of hindsight bias, it often misrepresents the field by ignoring that EP makes specific, falsifiable predictions (like the Cheater Detection task), though the field must remain careful not to confuse "adaptive origins" with "current utility."

  2.  **The Criticism (The Brother's View):**
      *   Explain the "Just-So" argument: It's easy to invent a story for any behavior after the fact.
      *   Mention the concern about unfalsifiability (if it explains everything, it explains nothing).
      *   Mention the concern about genetic determinism (ignoring culture).

  3.  **The Defense (The Chapter/EP View):**
      *   Explain that good EP relies on **predictions**, not just explanations.
      *   **Case Study:** Use the Cheater Detection (Wason Task) example. Explain *why* this isn't a just-so story: it predicted people would fail abstract logic but pass social logic. That is a specific, risky prediction.
      *   Address your counter-scenario: Acknowledge that if cross-cultural studies failed, the theory would be in trouble. This shows the theory *is* testable.

  4.  **The Nuance (Your Contribution):**
      *   Bring in your "Useful Then vs. Useful Now" point.
      *   Argue that much of the public backlash comes from sliding between these two claims. EP explains the *origin*, not necessarily the *morality* or *current health* of the behavior.
      *   Address the culture point: Clarify that EP views culture as the "output" of universal psychological "software," not as something that doesn't matter.

  5.  **Conclusion:**
      *   The "just-so" critique is a necessary warning against lazy thinking, but it is not a death sentence for the field.
      *   Evolutionary Psychology is science *if* it sticks to making novel predictions (like the cheater task) rather than just storytelling.
      *   Final thought: The field is most dangerous when it claims our ancestors' solutions are the *only* solutions, but most valuable when it helps us understand why certain problems (like logic vs. social cheating) feel different to us.

  ### Key Terms to Drop (to sound like you know what you're talking about)
  *   **EEA (Environment of Evolutionary Adaptedness):** The "Stone Age" environment the brother mentioned.
  *   **Falsifiability:** The ability to prove a theory wrong (the core of the "is it science?" debate).
  *   **Adaptation vs. Byproduct:** Not everything is an adaptation (e.g., the chin might just be a structural byproduct of jaw growth). Good EP admits this.
  *   **Mismatch Theory:** Your point about traits being useful then but not now.

  ### Final Advice
  Your brother is confident, but his "Freud was right" comment suggests he likes grand, unfalsifiable theories that sound deep. Evolutionary Psychology tries to be harder science than that. Your paper will be strong if you show that you understand the *risk* of EP (becoming just-so stories) but also understand the *mechanism* they use to avoid it (predictive experiments like the Cheater Detection task).

  You don't need to prove EP is 100% right. You just need to show that the "Just-So" criticism is a warning label, not a stop sign.
