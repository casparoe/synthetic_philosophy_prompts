  9.  **Final Polish:** Organize with clear headings. Ensure the conclusion gives a actionable thesis idea. (Proceed to generate output).

  *(Self-Correction Note on the "Freud" comment)*: The user mentioned the brother thinks Freud was right. This is a huge red flag in modern psych. I should gently point out that this undermines his credibility on *current* scientific debates without being mean.

  *(Self-Correction on "Just-So Stories")*: Make sure to mention Gould and Lewontin, even if the user can't read the paper, knowing the names adds credibility to a high school paper.

  *(Self-Correction on the Wason Task)*: Be careful not to say the Cheater Detection module is proven fact. It's the leading EP example, but still debated. Frame it as "the best evidence they have."

