prompt: |-
  ok so I'm a senior and I'm in this elective called Human Nature (it's half psych half bio, mostly discussion) and right now we're doing like two weeks on evolutionary psychology. Our teacher had us read a chapter out of one of those pop-science books — I think the guy writes for a magazine or something, I alredy forgot the title and I returned my copy to the library — and then we're supposed to write a short response on whether the "just-so story" criticism actually lands or whether it's mostly people misunderstanding what the field is even claiming. I get the general vibe but I feel like if I just repeat the chapter's framing I'm going to write something a real evolutionary psychologist would roll their eyes at, and I can't really go check anything (our school library has like six psych books and no journal access at all, so please don't just tell me to go read papers, I can't get them).

  The thing is, my brother read the same chapter — he's a psych major at the community college and is extremely confident about everything — and he summed the whole field up for me like this:

  "Evolutionary psychology says the brain isn't one general-purpose learning machine, it's a bunch of separate modules that natural selection built during the Pleistocene while we were all hunter-gatherers, so our minds are stuck running software for a world that doesn't exist anymore. The way they actually do it is: you notice something people do — guys going for younger women, everyone being scared of snakes, people gossiping about who cheated who — and then you make up a story about how that would have helped our ancestors survive and reproduce, and that story is the explanation. Which means whatever fact you hand them, they can cook up a story for it, and a theory that can explain absolutely everything can't be tested and isn't really science. Also the whole point is that these things are innate and genetic, so they basically think parenting and culture don't matter and we're stuck with whatever our ancestors handed us."

  I don't trust him 100% because this is the same person who says Freud was right about everything at dinner, but I also can't tell which parts he's getting from the book and which parts he's adding himself, and I don't want to hand in a paper that's just his confidence in nicer handwriting.

  There's one more piece. The chapter had this experiment thing where people are apparently way better at catching someone who breaks a rule like "if you take the benefit you have to pay the cost" than at catching someone breaking the exact same rule written out as some boring if-then thing about letters and numbers, even though logically it's the same problem, and the book says that shows our brains come with a built-in cheater-detection module. That part honestly kind of blew my mind. But then I made up a counter-scenario to test myself: suppose someone ran that same kind of task in a bunch of small-scale societies and the advantage basically vanished, or suppose it turned out you can get people just as good at the abstract version with like an hour of logic practice. Would that actually kill the module claim, or is there some way an evolutionary psychologist could just absorb that result and keep going — and if they can absorb it either way, is that the thing my brother is complaining about? And more generally: when people say "just-so story," what exactly are they accusing evolutionary psychologists of doing, what would a careful one say back, and does the "so it's not science" conclusion actually follow from the parts of his summary that are right?

  My own guess is that the confusion is that "this trait was useful to our ancestors" and "this trait is useful / healthy / unavoidable right now" are two totally different claims and everyone keeps sliding between them, but I'm not sure that's the main thing going on, or if there's a better distinction I should be building the paper around. Anyway — go through his summary claim by claim and tell me what's fair, what's a caricature, and what a defender would push back on, and also flag anything where even the critics would go "no, that's not our objection." thank u!!
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** High school senior, taking a "Human Nature" elective (psych/bio mix).
      *   **Task:** Write a short response paper on the "just-so story" criticism of evolutionary psychology (EP).
      *   **Constraints:** Cannot access academic journals/library resources (limited school library). Read a pop-sci chapter (title forgotten, returned).
      *   **Input:** Brother (community college psych major, overconfident, pro-Freud) gave a summary of EP. User is skeptical of brother but finds some points compelling (especially regarding the Wason Selection Task/Cheater Detection).
      *   **Goal:** Evaluate the brother's summary claim-by-claim (fair vs. caricature vs. wrong), explain the "just-so story" criticism properly, address the Cheater Detection example, and help the user form a nuanced argument for their paper without needing new sources.
      *   **Tone:** Helpful, analytical, nuanced, accessible (high school senior level), not condescending.

  2.  **Deconstruct the Brother's Summary:**
      *   *Claim 1: Brain is modular (not general-purpose), built in Pleistocene.* -> **Mostly Fair.** This is the core EP hypothesis (Massive Modularity).
      *   *Claim 2: Method is "notice behavior -> make up story about ancestors."* -> **Caricature/Strawman.** This is the heart of the "just-so story" critique, but it ignores hypothesis testing and cross-cultural work.
      *   *Claim 3: Theory explains everything, can't be tested, isn't science.* -> **Debatable/Exaggerated.** Critics say this; defenders say falsifiable predictions *are* made.
      *   *Claim 4: Traits are innate/genetic, parenting/culture don't matter.* -> **Caricature.** EP acknowledges culture (evoked culture), but emphasizes universal underlying mechanisms. It's not genetic determinism in the "blueprint" sense.

  3.  **Address the "Just-So Story" Criticism:**
      *   **What is it?** Adaptationist stories that sound plausible but lack evidence (like Kipling's stories).
      *   **The Accusation:** Hindsight bias. You can fit a story to *any* outcome.
      *   **The Defense:** Good EP makes *novel predictions* (not just explaining known facts), uses cross-cultural data, and looks for design features (efficiency, specificity).
      *   **The "Science" Question:** Does unfalsifiability follow? Not necessarily, if specific predictions are made (e.g., the Cheater Detection module).

  4.  **Analyze the Cheater Detection Example (Wason Selection Task):**
      *   **The Finding:** People are better at detecting cheating in social contracts than abstract logic.
      *   **User's Counter-Scenario:** What if cross-cultural data fails? What if training fixes it?
      *   **EP Response:**
          *   *Cross-cultural failure:* Would weaken the "universal module" claim, suggesting it might be learned.
          *   *Training:* EP would argue the *ease* of learning social rules vs. abstract rules shows the bias. If it takes an hour, the default state still matters.
      *   **Is it unfalsifiable?** No. If people were *better* at abstract logic than social cheating, the theory would be in trouble.

  5.  **Address the User's Guess (Useful Then vs. Useful Now):**
      *   **Verdict:** This is a good distinction (Mismatch Theory), but it's not the *main* "just-so story" critique. The critique is about *methodology*, not just the time gap.

  6.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Validate the user's skepticism. Acknowledge the brother is half-right but oversimplifying.
      *   *Section 1: Grading the Brother's Summary.* Go point-by-point.
          *   Modules/Pleistocene: Accurate core tenet.
          *   "Make up a story": The core of the criticism, but unfair to *good* EP.
          *   "Explains everything/Not science": The philosophical critique (Popper), but defenders argue it *is* falsifiable.
          *   "Culture doesn't matter": False. It's about *universal* psychology underlying cultural variation.
      *   *Section 2: The "Just-So Story" Deep Dive.*
          *   Define it (Gould & Lewontin).
          *   Why it sticks (hindsight bias).
          *   How defenders respond (Predictions, not just explanations).
      *   *Section 3: The Cheater Detection Case Study.*
          *   Address the user's counter-scenarios directly.
          *   Explain why this specific experiment is actually a strong defense *against* the just-so critique (it predicted a specific cognitive asymmetry).
          *   Explain what *would* falsify it (e.g., if people were better at abstract logic).
      *   *Section 4: The User's Hypothesis (Then vs. Now).*
          *   Validate it as "Mismatch Theory."
          *   Clarify it's different from the "Just-So" methodological critique.
      *   *Section 5: Paper Strategy.*
          *   Don't just repeat the chapter.
          *   Use the brother's summary as a "strawman" to knock down/nuance.
          *   Focus on the difference between *plausible stories* and *tested predictions*.

  7.  **Refining the Tone:**
      *   Avoid jargon where possible, or explain it (e.g., "falsifiability," "EEA").
      *   Keep it encouraging. The user is thinking like a scientist by questioning the falsifiability.
      *   Make sure to explicitly answer the prompt's specific questions (claim-by-claim, counter-scenario analysis, definition of just-so).

  8.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I tell them to read papers? *No, respected constraints.*
