prompt: |-
  Please argue that the Church-Turing thesis shouldn't be treated like a scientific conjecture that some weird hypercomputer could knock over, but more like a regulative frame that decides what counts as computation in the first place. Use the anology with the no-signaling principle in quantum mechanics -- both seem empirically unfalsifable because any apparent violation just gets reclassifed. Then push it: if that's right, does the thesis even have a truth value, or is it just a convention we use to organize physical theories? You need to address the objection that this makes the thesis trivial or empty, and say why treating it as a bridge principle between math and physics is still meaningful even if it's not falsifiable in any interesting way. Don't bother with citations or a bibliography, I just want the argument straight and truely in the weeds.
