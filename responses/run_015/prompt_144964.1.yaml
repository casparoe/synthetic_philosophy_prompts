      *   **Constraints:**
          *   No bibliography/reading list/named scholars (unless essential for clarity).
          *   Purely conceptual audit.
          *   Specific structure and word counts:
              1.  Precise Restatement (~100 words).
              2.  Fatal Defeaters (~250 words).
              3.  Merely Awkward Objections (~200 words).
              4.  Internal Pressure Points (~200 words).
