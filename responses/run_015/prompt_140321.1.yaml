          *   *Stress Tests:* Patchwork Twin $\rightarrow$ Does the code run on this hardware? (Checks correlation). Diverged Copy $\rightarrow$ Does the code optimize for this new utility? (Highlights the break).
          *   *Plain Prose:* "Choose the policy that, if fixed as the output of your decision algorithm across all possible scenarios weighted by your prior, yields the highest expected utility, regardless of which scenario you currently observe yourself in."

  4.  **Refining the Argument (Self-Correction during drafting):**
