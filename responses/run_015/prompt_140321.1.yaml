      *   **2. Load-bearing Disanalogies:**
          *   *Empirical vs. Logical Ignorance:* This is the big one. VoI hides empirical facts (talent, class). UDT asks you to ignore *known* empirical facts (coin outcome, box content) because your decision *logically* correlates with the predictor's past action.
          *   *Distinctness:* VoI parties are distinct individuals. UDT instantiations are the *same* algorithm. This matters for the "why care about them" question. VoI needs a moral principle to care about others. UDT needs a logical fact to care about sims.
          *   *Load-bearing?* Yes. The VoI analogy makes UDT look like altruism (caring about other selves). UDT is actually selfish (caring about the output of the algorithm). If the agent thinks "I am the real one, why care about the sim?", VoI says "You might be the sim." UDT says "Your decision *is* the sim's decision."

      *   **3. Quiet Imports:**
          *   *Criterion of Instantiation:* VoI assumes we know who counts as a person. UDT needs to know what counts as "you" (computationally). *Verdict:* Question-begging.
