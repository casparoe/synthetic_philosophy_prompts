      *   **4. Stress Tests:**
          *   *Patchwork Twin:* VoI asks "Would you accept this policy if you were the coarse twin?" But are you *capable* of being the coarse twin? The analogy breaks because VoI assumes interchangeability. UDT requires logical correlation. The coarse twin might not correlate. The analogy hides the need to check correlation strength. *Verdict:* Presupposes the answer.
          *   *Diverged Copy:* VoI handles different utilities (that's its job). UDT does not. If the copy has different utilities, UDT has no standard answer without a new weighting function. The VoI analogy suggests you *should* care (moral aggregation), but UDT (rational choice) says "Why should I care about a copy with different goals?" *Verdict:* Analogy goes silent or misleads toward moral altruism rather than rational coordination.

      *   **5. Verdict on Conclusions:**
          *   *One-boxing:* Survives. VoI captures the "could be the sim" intuition well enough, even if technically imprecise.
          *   *Counterfactual Mugging:* Weak. VoI says "You might have been the Heads world." UDT says "Your policy determines the Heads world payout." The VoI relies on indexical uncertainty which is absent (you know it's Tails). This is the biggest strain.
