          *   VoI assumes distinct utilities to aggregate; UDT assumes one utility function across instantiations (usually).
          *   XOR Blackmail is the tricky one. UDT usually says *pay* in standard blackmail, but *refuse* in XOR blackmail (because paying makes the bad news more likely in the logical counterfactual). The prompt says the colleague's draft uses VoI to argue for *refusing* in XOR blackmail. I need to check if VoI supports that. Actually, standard FDT/UDT refuses XOR blackmail. Does VoI explain why? If I'm behind the veil, am I the blackmailer or the victim? No, I'm the victim in different scenarios.
