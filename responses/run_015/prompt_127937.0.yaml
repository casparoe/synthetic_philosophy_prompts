answer: |-
  First, I am sorry about your mum. That £18k isn't just capital; it's a tribute. The fact that you're thinking this hard about where it goes shows you're treating it with the weight it deserves.

  You and Dave stumbled into one of the deepest rabbit holes in modern moral philosophy. Dave is essentially arguing for a mix of **strong longtermism** (the future matters most) and **moral cluelessness** (we can't know the long-term effects of our actions). These are serious positions held by serious thinkers (like William MacAskill or Hilary Greaves), but Dave's pub version of them has cracks in it.

  You asked for the argument, not a pat on the head. Here is the breakdown of where Dave is right, where he's wrong, why your objections land, and what you should actually do.

  ### 1. Where Dave is Right (The Theory)
  Dave is technically correct on the physics of the situation:
  *   **The Ripple is Real:** Every action has downstream consequences that compound over time. Saving a child from malaria means that child grows up, consumes resources, has children, votes, works, etc.
  *   **The Sign is Uncertain:** We genuinely cannot predict whether those downstream effects are net positive or net negative for the world a century from now. (e.g., Does a larger population accelerate climate disaster, or produce the scientist who solves it?)
  *   **The Scale:** Theoretically, those long-term effects dwarf the immediate relief (the "visible bit").

  If you accept *only* those premises, Dave is right: the visible arithmetic is a rounding error compared to the invisible chaos.

  ### 2. Where Dave is Wrong (The Application)
  Dave's reasoning breaks down when he tries to move from "we can't know" to "therefore it doesn't matter" or "therefore choose the smaller ripple."

  **The Cancellation Problem (Your Objection #1)**
  You nailed this. The "invisible ripple" applies to *every* option, including keeping the money or buying the boat.
  *   If you give to the hospice, that ripples out.
  *   If you give to bednets, that ripples out.
  *   If you burn the money, that ripples out (less economic activity, different emissions, etc.).

  Since the "invisible long-term noise" is attached to *all* options roughly equally, it acts as a constant in the equation. In decision theory, you can ignore constants. You are not choosing between "Action + Noise" and "Action – Noise." You are choosing between "Action A + Noise" and "Action B + Noise." Since the Noise is unknowable and presumably similar in magnitude across options, you must decide based on the Action part. Dave's argument proves too much; if it were true, you couldn't choose to get out of bed in the morning.

  **The Inconsistency (The "Whose Side Is He On?" Problem)**
  You noticed Dave wobbled, and that wobble is fatal to his argument.
  *   **Argument A:** The invisible part dominates, so the visible part doesn't matter. (Implies: Do whatever, or do nothing.)
  *   **Argument B:** The hospice is "safer" because the ripple is smaller. (Implies: Minimize variance/risk.)
  *   **Argument C:** Rank by the visible part, so bednets win. (Implies: Maximize proximate expected value.)

  He cannot use Argument A to dismiss your calculation, then use Argument C to tell you bednets are better, then use Argument B to say the hospice is safer. He was using the philosophy as a bludgeon rather than a framework. He wanted to win the pub argument, not solve your problem.

  **The Sign Bias (Countering the 50/50 Claim)**
  Dave claims the long-term effects are "fifty-fifty good-or-bad." That is a huge assumption. While we can't predict the *specifics*, there is a strong prior that "fewer children dying of preventable disease" is positively correlated with "better future outcomes" (more stability, more innovation, less suffering) than "more children dying." It isn't a coin flip. It's a weighted die. The bednets likely have a positive expected value on the long-term view *as well*, even if we can't measure it.

  ### 3. Your Objections, Validated
  *   **Objection 1 (Cancellation):** **Valid.** As above. The uncertainty is a background condition, not a differentiator.
  *   **Objection 2 (Risk):** **Valid.** In finance, if two assets have the same expected return but different volatility, a rational actor chooses the lower volatility. If bednets have a "massive gamble" attached to them (however theoretical) and the hospice has a "smaller ripple," a risk-averse donor (which is most people) is rational to prefer the hospice *if* they are worried about negative tail risks. Dave tried to have it both ways here.
  *   **Objection 3 ("Just be decent"):** **Valid.** This isn't giving up; it's switching from **Act Consequentialism** (judge every act by its outcome) to **Rule Consequentialism** or **Virtue Ethics** (act according to principles that generally produce good). Given human cognitive limits, "do what a decent person would do" is actually a more robust algorithm for real-world decision-making than "try to calculate the butterfly effect."

  ### 4. The Scale Reality Check
  There is one thing Dave missed that is crucial for your specific situation: **£18,000 is not enough to break the world.**

  The "butterfly effect" argument works best for policy changes or technological shifts. £18k worth of bednets saves roughly 3,000–5,000 lives (depending on the charity and metrics). In the context of a global population of 8 billion and a global economy of $100 trillion, this is statistically negligible.
  *   It will not tip the balance of climate change.
  *   It will not alter the outcome of elections.
  *   It will not cause overpopulation crises.

  The "invisible ripple" of £18k is actually quite small in the grand scheme. The "visible bit" (people sleeping without malaria, families supported in grief) is the *entirety* of the impact. Dave is treating your donation like it's a lever on the fate of civilization. It isn't. It's a help to specific humans.

  ### 5. What Should You Do?
  You are looking for a decision procedure, not just a moral verdict. Here is how to weigh it.

  **The Case for the Hospice**
  *   **Certainty:** You have direct evidence of value. You saw the care. You know the money will be used well *in your context*.
  *   **Symbolism:** This money is connected to your mother's death. Honoring the place that cared for her has a psychological and symbolic utility that "saving statistical lives" does not. It closes a loop.
  *   **Local Knowledge:** You know the need is real.

  **The Case for the Bednets**
  *   **Efficiency:** In terms of "lives saved per pound," bednets crush hospice care. If your goal is strictly to minimize death globally, bednets win.
  *   **Scale:** £18k does more tangible good there than in a UK hospice (where overheads are higher).

  **The Verdict**
  Dave's argument leads to paralysis. Your original instinct leads to action.
  **Split the money.**

  Here is why:
  1.  **It defeats the "All or Nothing" trap.** Dave tried to force a binary where one option must be objectively superior. Life rarely works that way.
  2.  **It honors both values.** It acknowledges the global duty to save lives (bednets) and the specific duty of gratitude and memory (hospice).
  3.  **It respects the "Decent Person" heuristic.** A decent person helps those who helped their family, *and* a decent person helps children die less. Doing both is more "decent" than agonizing over which is mathematically perfect.

  **My advice:**
  Give £9k to the hospice in your mum's name. Make sure they know it's a thank you. That money buys dignity and comfort, which is what your mum received.
  Give £9k to the bednet charity (e.g., Against Malaria Foundation). That money buys survival.

  Dave is right that we can't see the future. But he is wrong that this means we shouldn't act on the present. The "visible bit" isn't a rounding error; it's the only part of the equation where you have standing. Don't let a pub philosopher talk you out of honoring your mother.

  **Summary:** Your objections are philosophically sounder than Dave's. His argument collapses under its own weight because it applies equally to inaction. Split the donation. Honor the care your mum got, and honor the lives you can save. That is a calculation you can stand behind.
