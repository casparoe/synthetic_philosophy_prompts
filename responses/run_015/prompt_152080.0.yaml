  ***

  # MA Political Theory Seminar: Take-Home Exam
  **Topic:** Liberty, Power, and Algorithmic Governance
  **Time:** 48 Hours
  **Word Limit:** 1,500 words max (excluding prompt)
  **Total Marks:** 30

  ### The Prompt

  Consider a hypothetical polity, "State X." In State X, there are no legal prohibitions on speech, movement, or association. No citizen is ever physically coerced, fined, or imprisoned by the government. Technically, every option remains legally open. However, the state employs a sophisticated predictive algorithmic infrastructure. This system analyzes citizen data to anticipate preferences before they fully form. Through subtle choice architecture (default settings, interface design, information prioritization), the state channels citizens toward choices deemed "socially optimal" by the algorithm. Citizens feel they are choosing freely, but their preference formation is systematically shaped by the state's architecture. No one ever encounters a "stop" sign, but the path of least resistance is always engineered.

  **Question:**
  Evaluate the freedom of citizens in State X through the lenses of **Negative Liberty** (Berlin) and **Republican Liberty** (Pettit/Skinner). 

  1.  Does the absence of actual interference (coercion/prohibition) preserve Negative Liberty in this context? Why or why not?
  2.  Does the absence of actual interference preserve Republican Liberty? Explain specifically how the concept of *domination* applies here even if power is not exercised overtly.
  3.  Briefly distinguish why a Positive Liberty framework might view this differently than the Negative framework, focusing on the source of the will.

  *Note: Do not simply define the concepts. Apply them rigorously to the algorithmic case. You must take a stance on whether "soft nudging" counts as interference or domination.*

  ***

  # Model Answer (Draft for Graders)

  *Note: This isn't the only way to answer, but it hits the key philosophical moves we're looking for. A top-tier answer needs to separate the "exercise" of power from the "presence" of power.*

  **Freedom in the Algorithmic State: Interference vs. Domination**

  The case of State X presents a stress test for classical liberal conceptions of freedom. While the state maintains a facade of non-interference, the underlying architecture of choice suggests a deeper violation of liberty, particularly when viewed through a Republican lens. The crux of the issue lies in distinguishing between the *exercise* of power (interference) and the *capacity* for arbitrary power (domination).

  **Negative Liberty and the Definition of Interference**
  Under Isaiah Berlin's conception of negative liberty, freedom is the absence of external obstacles or interference by other human agents. The initial assessment of State X suggests citizens are free: no laws prohibit action, and no physical coercion is used. A strict Berlinian might argue that as long as the citizen *can* choose the non-optimal path—even if difficult—they remain negatively free. The algorithm merely changes the cost-benefit analysis of choices, not the availability of them.

  However, this view relies on a narrow definition of interference. If the state manipulates the information environment so precisely that preferences are shaped before consciousness, is this truly non-interference? A sophisticated negative liberty argument should recognize that manipulation can be a form of interference. If the state alters the agent's decision-making calculus through hidden architecture, it infringes on the sphere of non-interference. Yet, even granting the state the benefit of the doubt—that nudges are not direct coercion—negative liberty struggles to capture the structural unfreedom here. It focuses too much on the visible barrier. In State X, there are no visible barriers, so negative liberty risks giving a false positive. It saves the state only if we define interference strictly as physical or legal blockage.

  **Republican Liberty and the Reality of Domination**
  Republican liberty, defined as non-domination, offers a more robust critique. For Pettit, freedom is not just the absence of interference, but the absence of the *master's capacity* to interfere arbitrarily. Domination exists when one agent has the power to interfere in another's choices at their discretion, regardless of whether they actually use that power.

  In State X, the algorithmic infrastructure represents immense arbitrary power. The state holds the capacity to channel behavior at will. The fact that they use this power "softly" via nudges rather than "hard" via laws is irrelevant to the status of domination. The citizen is dependent on the state's benevolence (or the algorithm's parameters). Because the citizen cannot contest the algorithm's logic effectively (it is predictive and opaque), the power is arbitrary. 

  Crucially, republican theory teaches that dormant power is still dominating power. A slave whose master is kind is still a slave because the master *could* interfere. Similarly, citizens of State X are dominated because the state retains the structural capacity to reshape their choices without their consent. The absence of actual interference does *not* save the state on the republican view. The mere presence of the unchecked architectural power constitutes unfreedom. The citizen lives "at the mercy" of the algorithm, which is the definition of domination.

  **Positive Liberty and the Source of the Will**
  While the prompt focuses on negative and republican views, positive liberty clarifies why the preference shaping is problematic. Positive liberty concerns self-mastery—acting according to a will that is truly one's own. In State X, preferences are anticipated and channeled before formation. This violates the positive liberty condition of autonomy. Unlike negative liberty, which asks "how many doors are open?", positive liberty asks "who is the agent choosing?" If the algorithm determines the desire, the citizen is not self-directed. This distinguishes it from the negative view: negative liberty might accept the manipulated desire if the action isn't blocked; positive liberty rejects the desire itself as heteronomous.

  **Conclusion**
  State X preserves negative liberty only under a deflationary account of interference that ignores manipulation. It definitively violates republican liberty because the structural capacity for arbitrary interference remains intact. The absence of overt coercion is irrelevant to domination; what matters is the power relation. Citizens in State X are not free because they live under a power they cannot check, regardless of how soft the touch of that power may be.

  ***

  # Marking Scheme (30 Marks Total)

  *Use this to grade. Don't give marks just for name-dropping Berlin or Pettit—they need to apply the logic.*

  **1. Negative Liberty Analysis (10 Marks)**
  *   **8-10 marks:** Explicitly discusses the definition of interference. Recognizes the tension: no legal barriers vs. manipulative architecture. Takes a clear stance on whether manipulation counts as interference. Acknowledges that Negative Liberty *might* technically be preserved if interference is defined narrowly, but critiques this limitation.
  *   **5-7 marks:** Defines negative liberty correctly (absence of interference) but applies it superficially. Says "no laws = free" without addressing the nudge/manipulation aspect.
  *   **0-4 marks:** Conflates negative liberty with positive liberty (e.g., says negative liberty requires resources). Fails to mention interference.

  **2. Republican Liberty Analysis (10 Marks)**
  *   **8-10 marks:** **Crucial Move:** Distinguishes between the *exercise* of power and the *capacity* for power. Identifies that domination exists even if power is dormant/unused. Explicitly states that the absence of actual interference does *not* save the state. Uses the concept of "arbitrary power" or "mastery."
  *   **5-7 marks:** Identifies Republican liberty as non-domination but fails to explain why the *potential* for interference matters. Treats it too similar to negative liberty.
  *   **0-4 marks:** Claims citizens are free because they aren't actually stopped. Conflates non-domination with non-interference.

  **3. Positive Liberty & Distinction (5 Marks)**
  *   **4-5 marks:** Correctly identifies Positive Liberty as concerning autonomy/source of will (self-mastery). Distinguishes it from Negative (obstacles) and Republican (status). Notes the "preference shaping" violates autonomy.
  *   **2-3 marks:** Treats Positive Liberty merely as "having resources" or "welfare." (Common mistake).
  *   **0-1 marks:** Ignores this section or conflates all three concepts.

  **4. Structure & Rigor (5 Marks)**
  *   **4-5 marks:** Argument flows logically. Directly answers the prompt's specific question about whether absence of interference saves the state.
  *   **2-3 marks:** Disorganized or wanders off topic.
  *   **0-1 marks:** Incoherent or under word count significantly.

  **Specific Deductions (The "Kill" Criteria):**
  *   **-5 marks:** If the student claims Republican Liberty is satisfied because "no actual interference occurred." (This shows they missed the core concept of domination).
  *   **-3 marks:** If they define Positive Liberty solely as economic capacity/resources.
  *   **-2 marks:** If they treat Negative and Republican liberty as identical.

