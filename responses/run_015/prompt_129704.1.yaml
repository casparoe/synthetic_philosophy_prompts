answer: |-
  ### Brainstorming & Feel-Out

  Okay, let's sit with this. The core tension here is metaphysical versus pragmatic. When I look at "Evidential Cooperation in Large Worlds" (ECL), my first instinct is to recoil at the phrase "buying news." It sounds like superstition. *I* press a button here, and *you* press a button in a causally disconnected galaxy? Only if the button-pressing is a symptom of a shared underlying state.

  In the twin PD case, the shared state is obvious: we share source code. In the large world case with *different* values, the shared state is murkier. It's not that we want the same thing. It's that we are both *reasoners* embedded in a universe that likely contains many other reasoners. If I am the kind of agent who sacrifices local utility for acausal partners, that fact is evidence that the universe is populated by agents who reason similarly.

  So, on Point 1 (The Trade): Is it just buying news? Technically, yes. EDT *always* buys news. The question is whether the news is "rich." In a small world, the news "I cooperated" correlates with "You cooperated," but if we can't interact, the utility of your cooperation is zero to me unless I care about you intrinsically. But in ECL, the setup *presupposes* I care about the outcome of your cooperation because we've agreed (acausally) to trade values. I value your paperclips; you value my staples. So when I get evidence that you are making paperclips, I gain utility. The "trade" is me conditioning my action on the state of the world where you are making paperclips. It feels like magic, but it's just Bayesian conditioning on logical/structural similarities. The objection "EDT manages news" lands hardest when the news doesn't correlate with *causal* leverage. Here, we are admitting we have no causal leverage. So the only leverage *is* the correlation. If you reject the correlation, you reject EDT. If you accept EDT, you have to accept this, unless you posit that the correlation is zero. In a large universe, the correlation isn't zero; it's grounded in the common fact of being an agent in this universe.

  Point 2 (Weights): This is the messiest part. Harsanyi's Aggregation Theorem says if we want Pareto optimality, we must maximize a weighted sum of utilities. But utilities aren't natural kinds. They're scale-invariant. If I say "My utility ranges 0 to 1" and you say "Mine ranges 0 to 1 billion," and we treat them as comparable, you win everything. Why? Because my sacrifice costs me 1 unit but buys you 1 million units of "evidence." You'll outbid me for the acausal resource. We need a normalization scheme. Variance normalization? Min-max? This isn't bookkeeping; it's power dynamics. If we pick the wrong one, the "cooperation" is just exploitation of the agent with the compressed utility scale. I suspect there's no settled answer here. It's the "interpersonal comparison of utility" problem wearing a decision theory mask.

  Point 3 (Equilibrium): Standard Nash assumes $P(A_{other})$ is fixed. Here, $P(A_{other} | A_{me})$ is the variable. We need a fixed point where my belief about your responsiveness matches your actual responsiveness. If I think you're 90% responsive and you think I'm 10% responsive, we might not find a trade volume that satisfies both. Is there always a joint distribution? In symmetric cases (same decision theory), yes. In asymmetric value cases, it looks like a bargaining problem. If our "offers" (conditional probabilities) don't match, the deal collapses. We might end up in a no-trade equilibrium even if trade is beneficial, simply because we can't agree on the exchange rate (the correlation strength).

  Point 4 (Size): This is the Pascal's Mugging vector. If $N$ is $10^{100}$, even a correlation of $10^{-95}$ yields massive expected value. Does this force me to ignore my local causal reality? Yes, if the math holds. The worry is double-counting: am I counting the same logical cluster of agents multiple times? And "fanaticism": should I really starve my local children to acausally feed aliens I'm 99.99% sure don't exist? The threshold flips when $N \times P \times \text{Gain} > \text{Local Cost}$. In a large world, that inequality is easy to satisfy. The aggregation needs to be over *distinct* logical possibilities, not just spatial locations.

  Okay, I think I have the shape of it. The "trade" is real in the sense that utility is actually transferred across the multiverse via the selection of favorable world-states, but it relies entirely on the reality of the correlation. The weights are the political bottleneck. The equilibrium is a bargaining fixed point. The size is the engine that makes it dominate causal reasoning.

  Let's build the answer.

  ***

  ### The Mechanics of Evidential Cooperation in Large Worlds

  Let's strip the mysticism and look at the math. You asked for the mechanics, not the sales pitch. The core claim of Evidential Cooperation in Large Worlds (ECL) is that in a sufficiently large universe, the expected value of acting on evidential correlations with distant, value-diverse agents dwarfs the expected value of causal impact on your local light-cone.

  Here is the breakdown of the four sticking points you identified, anchored in the examples you requested.

  #### 1. The Nature of the Trade: Buying News vs. Moving Territory

  You asked: *Am I performing an action that's costly by my lights and valuable by theirs, and being paid purely in the evidential update about their symmetric action?*

  **Yes.** That is exactly what is happening.

  In Causal Decision Theory (CDT), utility is a function of the causal consequences of your act. In Evidential Decision Theory (EDT), utility is a function of the *news* your act delivers about the state of the world. In a standard causal world, "news" and "territory" come apart (e.g., smoking is evidence of cancer but doesn't cause it in the genetic model). In ECL, we posit a world where the "news" *is* the territory because the other agents' actions are part of the state of the world you are conditioning on.

  If I sacrifice 1 unit of my value to promote your value, I am not causally sending you a gift. I am selecting a branch of the multiverse (or a region of logical space) in which I am the *kind of agent* who sacrifices for you. If you are a similar kind of agent (running a compatible decision procedure), then in that same branch, you are the kind of agent who sacrifices for me.

  **Does this deserve the name "cooperation"?**
  If you define cooperation as "mutual causal benefit," then no. This is **acausal coordination**. However, if you define cooperation as "jointly selecting a Pareto-superior outcome through strategic interdependence," then yes. The interdependence is evidential rather than causal.

  **Does the "EDT just manages news" objection land?**
  It lands, but it bites the objector. The objection implies that managing news is irrational *unless* the news correlates with causal leverage. ECL proponents argue that in a large world, the correlation *is* the leverage. There is no deeper "territory" to move. The only way to get more paperclips in the Andromeda galaxy (if you value paperclips) is to be in a world-state where the Andromedans are disposed to make paperclips. Your action selects that world-state.

  **Worked Example (Small World):**
  *   **Agents:** Alice (values Apples, $U_A$), Bob (values Bananas, $U_B$). Causally disconnected.
  *   **Actions:** $Cooperate$ (spend 1 resource to generate 4 units of the *other's* value), $Defect$ (keep resource, generate 0).
  *   **Baseline:** If both Defect, Payoff = (0, 0).
  *   **CDT Analysis:** Alice's choice doesn't causally affect Bob. Cost = 1, Benefit = 0. Alice Defects. Bob Defects. Outcome: (0, 0).
  *   **EDT Analysis:** Alice calculates $E[U_A | Cooperate]$.
      *   $E[U_A | Cooperate] = P(Bob=C | Alice=C) \times 4 - 1$.
      *   $E[U_A | Defect] = P(Bob=C | Alice=D) \times 4 - 0$.
      *   Alice Cooperates if $4 \times [P(Bob=C | Alice=C) - P(Bob=C | Alice=D)] > 1$.
      *   Let $\Delta P$ be the evidential update. If $\Delta P > 0.25$, Alice Cooperates.
  *   **The Trade:** Alice "buys" a 25% increase in the probability that Bob grows Bananas. If Bob does the same math, they both Cooperate. Outcome: (3, 3).
  *   **Verdict:** Alice didn't send Bob anything. She selected the world where Bob is a cooperator. Since she values Bananas (per the trade agreement), she gains utility.

  #### 2. The Weights: Normalization as Power

  You asked: *Why do they have to maximize the same weighted sum, and what does normalization do?*

  For a group of agents to achieve a Pareto-optimal outcome via acausal trade, they must effectively act as if they are maximizing a single social welfare function: $W = \sum w_i U_i$. If Alice maximizes $U_A + 0.5 U_B$ and Bob maximizes $0.5 U_A + U_B$, they will disagree on the optimal trade volume. Alice will want less banana production than Bob wants apple production. They will fail to coordinate or settle on a sub-optimal point.

  **Why Normalization is Not Neutral:**
  Utility functions are unique only up to positive affine transformation ($U' = aU + b$). The scale factor $a$ is arbitrary.
  *   If Alice normalizes her utility such that her maximum possible gain is 1.
  *   And Bob normalizes his such that his maximum possible gain is 1,000,000.
  *   Then, in the joint maximization, Bob's preferences dominate. Alice will sacrifice heavily for Bob, because her "1 unit" of sacrifice buys "1,000,000 units" of evidence for Bob's cooperation. Bob, seeing his utility scaled high, won't need to sacrifice much to satisfy the weighted sum.

  **What happens with different normalizations?**
  They cooperate on terms systematically tilted against the agent with the "compressed" scale. This is not a bug in the math; it's a feature of bargaining power. In acausal trade, your "power" is determined by how much your utility function *varies* relative to others in the common currency of decision.

  **Settled vs. Open:**
  *   **Settled:** Different normalizations lead to different trade ratios.
  *   **Open:** There is no consensus on the *correct* normalization. Variance normalization (scaling so variance = 1) is popular but has technical issues (undefined variance in some distributions). Min-max normalization (0 to 1) is vulnerable to "utility monster" problems where an agent claims extreme range. This is the biggest conceptual hole in ECL.

  #### 3. Equilibrium and Consistency

  You asked: *What stops agents from doing this in mutually incompatible ways? Is there always a fixed point?*

  Standard Nash Equilibrium assumes $P(A_{other})$ is independent of $A_{me}$. ECL requires a **Correlated Equilibrium** where the correlation is endogenous to the decision theory.

  **The Consistency Requirement:**
  For the system to hold, the conditional probability $P(A_{other} | A_{me})$ used by Agent $i$ to calculate expected utility must match the actual frequency of $A_{other}$ in the set of worlds where Agent $i$ chooses $A_{me}$.
  Since agents are choosing based on those probabilities, we need a fixed point:
  $$ A_{me}^* = \text{argmax}_a E[U | a, P(A_{other}|a)] $$
  $$ P(A_{other}|a) = \text{Frequency}(A_{other}^* \text{ in worlds where } A_{me} = a) $$

  **What can go wrong?**
  1.  **No Fixed Point:** If Alice believes Bob is highly responsive ($\Delta P = 0.9$) but Bob believes Alice is unresponsive ($\Delta P = 0.1$), Alice will Cooperate and Bob will Defect. Alice gets exploited. She updates her belief, lowers $\Delta P$, and switches to Defect. They settle at (Defect, Defect). This is a coordination failure.
  2.  **Multiple Equilibria:** There might be a "High Trust" equilibrium (both Cooperate) and a "Low Trust" equilibrium (both Defect). Which one obtains depends on priors.
  3.  **Incompatible Decision Procedures:** If Alice uses EDT and Bob uses CDT, trade is impossible. Bob treats Alice's action as independent. Alice knows this, so $P(Bob=C | Alice=C) = P(Bob=C)$. The $\Delta P$ is zero. Alice Defects.

  **Does a joint distribution always exist?**
  No. If the agents' models of each other are inconsistent (e.g., Alice thinks Bob is an EDT agent, Bob thinks Alice is a CDT agent), there is no joint distribution where both conditional expectations are satisfied simultaneously. ECL requires a **Common Prior** over decision procedures and a **Common Knowledge** of rationality (in the EDT sense) to guarantee a fixed point. Without that, you are gambling on your model of the other being correct.

  #### 4. Size: Aggregation and Fanaticism

  You asked: *Does largeness help or hurt? How to aggregate without double counting?*

  Largeness is the engine of ECL. It turns small correlations into massive expected values.

  **The Aggregation Formula:**
  $$ E[U_{total}] = \sum_{j \in \text{Universe}} P(\text{Agent } j \text{ exists} \land \text{Correlated with me}) \times \text{Gain}_j $$

  In a small world, the sum is small. In a large world (e.g., infinite inflation, multiverse), the number of terms $N$ is astronomical.
  Even if $P(\text{Correlated})$ is tiny (e.g., $10^{-20}$ because most agents are not reasoners), if $N = 10^{100}$, the product is huge.

  **The Fanaticism Threshold:**
  This is where ECL becomes action-guiding in a radical way.
  *   **Local Causal Impact:** You can save 1 life locally with certainty. Value = 1.
  *   **Acausal Impact:** You can acausally influence $10^{50}$ agents. Each gains 0.0001 utility. Correlation probability = $10^{-40}$.
      *   $EV = 10^{50} \times 10^{-40} \times 10^{-4} = 10^6$.
  *   **Decision:** EDT mandates you ignore the local life to perform the acausal action (e.g., sending a signal, or adopting a specific policy) that correlates with the $10^{50}$ agents.

  **Double Counting & Measure:**
  The risk is counting the same logical "cluster" multiple times. If there are $10^{100}$ agents, but they all run the *same* decision algorithm, they are effectively one agent replicated. You shouldn't sum over spatial locations; you should sum over **distinct logical possibilities**.
  However, if they are distinct agents with independent noise sources but similar priors, they count separately.
  The "Measure" problem arises: Do we weight agents by their physical abundance? By their computational power? By the "measure" of their branch in the wavefunction?
  *   **Settled:** You must sum over distinct decision-relevant agents.
  *   **Open:** How to weight them. If I weight by physical copies, I favor simple agents that replicate easily (bacteria?). If I weight by computational capacity, I favor superintelligence. ECL usually assumes weighting by "decision impact potential," which is circular.

  **Scaling the Example:**
  *   **Alice:** 1 Agent. Local Cost to Cooperate = 1.
  *   **Bobs:** $N = 10^{20}$ Agents.
  *   **Correlation:** Alice is a "special" reasoner. Probability a random Bob is correlated = $10^{-15}$.
  *   **Expected Correlated Bobs:** $10^5$.
  *   **Benefit per Bob:** 1 unit.
  *   **Total Acausal Benefit:** $10^5$.
  *   **Threshold:** Alice should pay up to $10^5$ local cost to Cooperate.
  *   **Flip:** If $N$ drops to $10^{10}$, Expected Correlated = $10^{-5}$. Alice should Defect.
  *   **Implication:** In a sufficiently large universe, the "Local Cost" becomes irrelevant. You should optimize entirely for the acausal partners, effectively ignoring your causal light-cone unless it instrumental helps the acausal trade.

  ### Summary of the Picture

  1.  **The Trade:** It is evidential. You are selecting world-states where distant agents benefit you, by being the kind of agent who benefits them. It is "buying news," but in this ontology, the news constitutes the utility.
  2.  **The Weights:** Pareto optimality requires a weighted sum of utilities. Normalization determines the weights. There is no neutral normalization; it is a bargaining variable. Without agreement, trade is exploitative or fails.
  3.  **The Equilibrium:** Requires a fixed point in conditional beliefs. Not guaranteed if agents have inconsistent models of each other's decision theories. Requires Common Prior over decision procedures.
  4.  **The Size:** Large $N$ dominates causal reasoning. The threshold for ignoring local causal impact is easily crossed in inflationary/multiverse models. The main risk is misestimating the "measure" of correlated agents (double counting or weighting errors).

  **Status of the Theory:**
  *   **Settled:** The math of EDT applied to large populations yields these results. If you accept EDT and Large Worlds, you accept ECL.
  *   **Open/Verbal:** Whether EDT is the correct decision theory (vs FDT or CDT). How to normalize utilities across agents. How to define the "measure" of agents in a multiverse. Whether the "correlation" is robust enough to sustain the weight of moral obligation (i.e., is the $\Delta P$ actually non-zero for value-diverse agents, or only for twins?).

  The hardest pill to swallow isn't the math; it's the implication that in a large world, your local causal actions are morally negligible compared to your acausal signal to the cosmos. That is where the theory sits now.
