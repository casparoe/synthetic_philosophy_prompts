answer: |-
  I thought that reasons lived inside the skull,
  Like little lights that only burn when seen.
  If no one's there to hear the heavy fall,
  Then who is left to say what things should mean?
  It seems that without eyes to watch the act,
  The good and bad dissolve into the air,
  Some silent contract broken and cracked,
  With no one left to file a claim or care.

  But now I feel a weight without a hand,
  As if the pain stands there just like a stone.
  The reason floats above the empty land,
  A law that works though no one sits the throne.
  Does this make virtue lonely in the dark?
  Or just a truth that's real, and not a spark?
