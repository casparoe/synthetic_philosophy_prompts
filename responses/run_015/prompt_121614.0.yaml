answer: |-
  ### Part 1: Brainstorming the Logical Space of Answer-Patterns

  Before assigning philosophical labels, we must map the terrain of possible responses. We are sorting visitors based on their intuitions about four concrete cases: the **Heap** (quantity), the **Pixel Portrait** (identity over time), the **Legal Case** (normative rules), and the **Color Spectrum** (quality).

  The logical space is defined by five binary axes of commitment. A visitor's path through the tree is determined by how they answer questions probing these axes.

  1.  **The Axis of Hidden Facts:**
      *   *Pattern A:* There is a specific point where the change happens (e.g., a specific grain number), even if humans cannot identify it.
      *   *Pattern B:* There is no such point in reality; the world itself is fuzzy.
  2.  **The Axis of Truth-Values:**
      *   *Pattern A:* Statements are only True or False (Bivalent).
      *   *Pattern B:* Statements can be partially true (Degrees).
      *   *Pattern C:* Statements can be neither true nor false (Gaps).
      *   *Pattern D:* Statements can be both true and false (Gluts).
  3.  **The Axis of Context:**
      *   *Pattern A:* The boundary shifts depending on who is speaking or the situation (Context-Sensitive).
      *   *Pattern B:* The boundary (or lack thereof) is fixed regardless of context (Context-Invariant).
  4.  **The Axis of Legal Utility:**
      *   *Pattern A:* The law should impose a sharp line for social order, even if it contradicts the fuzzy reality (Pragmatic Imposition).
      *   *Pattern B:* The law should attempt to mirror the fuzzy reality, even if it creates uncertainty (Metaphysical Mirroring).
  5.  **The Axis of Semantic Viability:**
      *   *Pattern A:* The word works well enough for ordinary use, even if philosophically puzzling.
      *   *Pattern B:* The word is fundamentally defective and strictly speaking fails to refer to anything (Eliminativism).

  **Mapping the Combinations to Leaves:**
  *   **Hidden Facts (Yes) + Bivalent Truth:** Leads to the view that ignorance is the only problem.
  *   **Hidden Facts (No) + Gaps (Yes):** Leads to the view that borderline cases lack truth values.
  *   **Hidden Facts (No) + Gluts (Yes):** Leads to the view that borderline cases are contradictory.
  *   **Hidden Facts (No) + Degrees (Yes):** Leads to the view that truth is a gradient.
  *   **Context (Yes) + Hidden Facts (No):** Leads to the view that meaning shifts to resolve the puzzle.
  *   **Legal Utility (Pattern A) + Hidden Facts (No):** Leads to the view that we must pretend there is a line for the sake of rules.
  *   **Semantic Viability (Pattern B):** Leads to the view that the concept is an error.
  *   **Hidden Facts (No) + Gaps (No) + Gluts (No) + Degrees (No) + Context (No) + Viability (Pattern A):** This combination denies all standard solutions but keeps the word. It posits binary truth without boundaries or gaps. This is the "Unexplored" slot.

  ***

  ### Part 2: The Decision Tree Instrument

  **Kiosk Title:** Borderline: The Heap, the Portrait, and the Law
  **Audience Key:** This instrument is designed for museum visitors with no prior training in philosophy. Questions use everyday language to probe deep logical commitments. "True" means "correctly describes the world."

  **Starting Commitment:** *You have already indicated that in a series of grains from 10,000 down to 1, there is no obvious single grain where the "heap" disappears, and you wish to continue using the word "heap" rather than discarding it.*

  **Node 1 (The Heap):**
  Imagine we count every single grain. Do you believe there is a specific number (e.g., 4,592 grains) that is the last "heap," even if no human could ever reliably identify which number it is?
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 3.

  **Node 2 (The Color Spectrum):**
  If there is a hidden cutoff, then for any patch of color, it is either definitely Red or definitely Orange. Does this sound correct to you?
  *   **Yes:** [Leaf A: Epistemicism]
  *   **No:** Go to Node 9 (Overlap Check).

  **Node 3 (The Color Spectrum - Gaps):**
  Consider a patch exactly halfway between clear Red and clear Orange. Is it possible that this patch is **neither** Red **nor** Orange?
  *   **Yes:** Go to Node 4.
  *   **No:** Go to Node 5.

  **Node 4 (The Portrait):**
  If the portrait is neither a picture of the person nor not a picture of the person, does that mean the statement "This is the person" has no truth value at all at that moment?
  *   **Yes:** [Leaf B: Supervaluationism]
  *   **No:** Go to Node 9 (Overlap Check).

  **Node 5 (The Color Spectrum - Gluts):**
  Consider that same halfway patch. Is it possible that it is **both** Red **and** Orange at the same time?
  *   **Yes:** Go to Node 6.
  *   **No:** Go to Node 7.

  **Node 6 (The Portrait):**
  If the image is both the person and not the person, are you comfortable saying a contradiction is true during the fading process?
  *   **Yes:** [Leaf C: Subvaluationism]
  *   **No:** Go to Node 9 (Overlap Check).

  **Node 7 (The Heap):**
  You denied a hidden cutoff, gaps, and contradictions. Is "being a heap" a matter of degree? (e.g., Is 5,000 grains "half a heap" in terms of truth?)
  *   **Yes:** [Leaf D: Degree-Functionalism]
  *   **No:** Go to Node 8.

  **Node 8 (Context):**
  If you call 500 grains a "heap" while cleaning your floor, but "not a heap" while doing a science experiment, are you changing the meaning of the word "heap" between those two situations?
  *   **Yes:** [Leaf E: Contextualism]
  *   **No:** Go to Node 10.

  **Node 9 (Overlap Flag):**
  *System Note:* Your answers suggest a tension between the Color Spectrum and the Portrait cases. You accept a theoretical structure (Gaps/Gluts/Hidden Facts) but hesitate to apply it to the specific identity of the portrait.
  *   **Action:** Please review Node 3, 5, or 2. If you maintain your answers, you are routed to [Leaf F: Semantic Nihilism] because you find the concepts fail to apply consistently across cases.

  **Node 10 (The Legal Case):**
  In the legal case, the defendant missed the age limit by one hour. Should the court rule them an adult to maintain a clear rule, even if they are biologically and mentally identical to someone born one hour earlier?
  *   **Yes:** Go to Node 11.
  *   **No:** Go to Node 12.

  **Node 11 (The Legal Case - Purpose):**
  If you say "Yes," is it because the law is creating a useful fiction for the sake of order, rather than discovering a natural fact about adulthood?
  *   **Yes:** [Leaf G: Graduated Legal Fictionalism]
  *   **No:** Go to Node 12.

  **Node 12 (Semantic Viability):**
  You have denied hidden facts, gaps, degrees, context shifts, and legal fictions. Do you believe that because there is no sharp boundary, the word "heap" is strictly speaking always false when applied to anything?
  *   **Yes:** [Leaf F: Semantic Nihilism]
  *   **No:** [Leaf H: The Unexplored Slot]

  ***

  ### Part 3: The Leaves (Diagnostic Outcomes)

  **Leaf A: Epistemicism**
  *   **Diagnosis:** You believe the world is sharp, but our knowledge is blurry. There is a fact of the matter about the last heap or the exact red/orange boundary, but it is impossible for humans to know it.
  *   **Commitment:** Bivalent truth + Hidden boundaries.

  **Leaf B: Supervaluationism**
  *   **Diagnosis:** You believe borderline cases create "truth-value gaps." The statement about the portrait or the color is neither true nor false until the fuzziness is resolved.
  *   **Commitment:** Truth-value gaps + No hidden boundaries.

  **Leaf C: Subvaluationism**
  *   **Diagnosis:** You believe borderline cases create "truth-value gluts." The portrait is both the person and not the person; the color is both red and orange. Contradictions are true in the borderline zone.
  *   **Commitment:** Truth-value gluts + No hidden boundaries.

  **Leaf D: Degree-Functionalism (Fuzzy Logic)**
  *   **Diagnosis:** You believe truth comes in gradients. The heap is not simply a heap or not; it is "0.6 true" that it is a heap. The portrait fades in truth-value as pixels corrupt.
  *   **Commitment:** Degrees of truth + No hidden boundaries.

  **Leaf E: Contextualism**
  *   **Diagnosis:** You believe the boundary moves depending on who is speaking and why. "Heap" means one thing in a casual context and another in a precise context, solving the puzzle by shifting standards.
  *   **Commitment:** Context-sensitive meaning + No hidden boundaries.

  **Leaf F: Semantic Nihilism**
  *   **Diagnosis:** You believe the lack of a boundary makes the word fundamentally defective. Even if we keep using it socially, strictly speaking, nothing is truly a "heap" or a "portrait."
  *   **Commitment:** Eliminativism about the predicate.
  *   *Note on Node 9:* Visitors routed here via Node 9 arrive here because their inconsistency suggests the concepts fail to hold together across different cases.

  **Leaf G: Graduated Legal Fictionalism**
  *   **Diagnosis:** You believe that while nature has no sharp cutoffs, society requires them. We must act *as if* there is a sharp line in law (like the 18-year threshold) to preserve the rule of law, acknowledging it is a pragmatic tool rather than a metaphysical truth.
  *   **Commitment:** Pragmatic imposition of boundaries + Metaphysical boundarylessness.

  **Leaf H: The Unexplored Slot (Placeholder: "Robust Boundarylessness")**
  *   **Diagnosis:** You deny a sharp cutoff, deny truth-value gaps, deny degrees of truth, deny context shifts, and refuse to eliminate the word. You hold that statements are simply True or False, yet there is no boundary and no gap.
  *   **Status:** **Logically Tense.** Under classical logic, if a statement is True or False and there are no gaps or degrees, there *must* be a boundary between the True cases and the False cases. This position is rarely occupied because it requires rejecting classical logic without adopting degrees or gaps. It remains an open, difficult space for non-classical ontologies.

  ***

  ### Part 4: Designer's Key

  *   **Intended Audience:** Museum visitors (ages 13+), no philosophy background.
  *   **Interaction Model:** Touchscreen branching. If a user selects an option, they proceed immediately to the next node or leaf.
