answer: |-
  The default technical meaning is simply that the Law of Excluded Middle (LEM) is underivable as a universal rule, while claims that it is "false" are either sloppy shorthand for meta-theoretic independence or confused conflations of truth with provability.

  ### The Menu of Claims

  Here are the distinct precise claims hiding behind "we reject LEM," separated into proof-theoretic (syntax/rules) and semantic/metaphysical (meaning/truth) categories.

  **1. Proof-Theoretic Underivability (The Standard Reading)**
  *   **Claim:** For an arbitrary proposition $P$, there is no derivation of $\vdash P \vee \neg P$ in the base system.
  *   **Status:** **Substantive and True** (for intuitionistic type theory).
  *   **Work Licensed:** This licenses the move "you can't case-split on $P$ versus $\neg P$." It means the inference rule $\frac{}{\vdash P \vee \neg P}$ is absent. It does *not* mean $\neg(P \vee \neg P)$ is provable; it simply means the positive assertion is missing.
  *   **Relation to "Proof tells you which":** This is the object-level consequence of the Disjunction Property (see below).

  **2. The Disjunction Property (Meta-Theoretic)**
  *   **Claim:** If $\vdash A \vee B$, then either $\vdash A$ or $\vdash B$.
  *   **Status:** **Substantive and True** (for many constructive systems like Heyting Arithmetic or Martin-Löf Type Theory).
  *   **Work Licensed:** This explains *why* Underivability matters. If you could prove $P \vee \neg P$ without proving $P$ and without proving $\neg P$, you would violate this property. It enforces the requirement that a proof of a disjunction must contain a witness (left or right).
  *   **Relation to "Proof tells you which":** This *is* the claim that "a proof of A-or-B has to tell you which one." It is a property of the logic, not an axiom inside it.

  **3. Semantic Anti-Realism (BHK Interpretation)**
  *   **Claim:** A proposition is "true" if and only if we possess a construction/proof for it; truth does not outrun provability.
  *   **Status:** **Philosophical Thesis** (Defensible but not provable within the system).
  *   **Work Licensed:** This justifies *why* we accept Underivability. If truth requires a witness, and we have no witness for $P$ and no witness for $\neg P$, then $P \vee \neg P$ is not true.
  *   **Relation to "Proof tells you which":** This is the metaphysical grounding for the Disjunction Property.

  **4. Universal Refutability (The "LEM is False" Boast)**
  *   **Claim:** $\vdash \neg (\forall P. P \vee \neg P)$ or, for specific $P$, $\vdash \neg (P \vee \neg P)$.
  *   **Status:** **False** (in standard intuitionistic logic/type theory).
  *   **Reasoning:** In intuitionistic logic, $\neg (P \vee \neg P)$ implies $\bot$ (contradiction). Proof: Assume $\neg (P \vee \neg P)$. If you assume $P$, you get $P \vee \neg P$, contradiction, so $\neg P$. But if you have $\neg P$, you get $P \vee \neg P$, contradiction. Thus the assumption implies $\bot$.
  *   **Work Licensed:** None, strictly speaking. If someone claims this, they are either speaking loosely, working in a non-standard paraconsistent logic, or referring to a specific extension (like Brouwerian choice sequences) where specific instances are refutable, but not the logical law itself in the base system.

  **5. Incompatibility (The Nearest True Thing to "False")**
  *   **Claim:** $\text{LEM} \to \text{SomethingWeReject}$ (e.g., decidability of the Halting Problem).
  *   **Status:** **Substantive and True** (Meta-theoretically).
  *   **Work Licensed:** This licenses the rhetorical move "LEM is false" as a shorthand for "Adopting LEM forces us to accept consequences we know are unwarranted." It justifies refusing to add LEM as an axiom, without claiming $\neg \text{LEM}$ is provable inside the logic.

  ### The "LEM is False" Boast

  Your instinct is correct: in standard dependent type theory (like Agda, Coq, or Lean without axioms), you **cannot** prove the negation of LEM. $\neg (P \vee \neg P)$ is refutable (it implies $\bot$).

  The speaker who claimed "LEM is false" was likely engaging in one of two slips:
  1.  **Confusing Validity with Truth:** They meant "LEM is not valid" (Underivability) but said "false."
  2.  **Meta-Theoretic Incompatibility:** They meant "We can prove that assuming LEM allows us to derive statements we know are unprovable (like solving the halting problem)." This is a *reductio* against adopting LEM, not an internal proof of $\neg \text{LEM}$.
  3.  **Specific Instances in Analysis:** In some forms of intuitionistic *analysis* (involving choice sequences), one can prove $\neg \forall x (x=0 \vee x \neq 0)$. If the seminar touched on continuity principles or choice sequences, this might be what they meant. But for static propositions in standard type theory, $\neg \text{LEM}$ is incoherent.

  ### The Real Number Example

  Let $C$ be an open conjecture (e.g., Riemann Hypothesis). Define real number $a$ such that $a=0$ if $C$ and $a=1$ if $\neg C$.
  *   **Classical View:** $a=0 \vee a=1$ is true because $C \vee \neg C$ is true.
  *   **Constructive View:** We cannot assert $a=0 \vee a=1$.

  **Which slot does this belong to?**
  This example is a **Weak Counterexample**. It supports **Underivability (Claim 1)** and illustrates the **Disjunction Property (Claim 2)**.
  *   It shows that asserting $a=0 \vee a=1$ would require a proof of $C$ or a proof of $\neg C$.
  *   Since we have neither, we cannot assert the disjunction.
  *   It does **not** support Refutability (Claim 4). We cannot prove $\neg (a=0 \vee a=1)$; that would imply we can prove $C$ is neither true nor false, which is impossible. We simply lack the evidence to assert it.

  **Verdict:** This example justifies refusing to *assert* LEM, but it does not justify asserting the *negation* of LEM. It validates the "we don't have a proof" stance, not the "it is false" stance.

  ### Where Markov's Principle Fits

  **Markov's Principle (MP):** $\neg\neg \exists n. P(n) \to \exists n. P(n)$ for decidable $P$.
  *   **Position:** It sits between Pure Intuitionism and Classical Logic.
  *   **Relation to LEM:** It is weaker than LEM. It does not grant $P \vee \neg P$ for arbitrary $P$. It only allows you to convert a proof that "it's impossible that nothing exists" into a witness, provided you can check $P(n)$ effectively.
  *   **Why invoke it?** It is often invoked as a "compromise" because it is computationally meaningful (it corresponds to unbounded search) whereas full LEM is not. Russian constructivists accept MP; Brouwerian intuitionists often reject it. In type theory, it is usually added as an axiom because it is not derivable, but it is consistent with many constructive systems.

  ### Summary of Moves

  *   **"You can't case-split":** Relies on **Underivability**.
  *   **"LEM is false":** Sloppy shorthand for **Incompatibility** or confused **Refutability** (which is technically false).
  *   **"We don't have a proof":** Relies on **Semantic Anti-Realism** and **Underivability**.
  *   **"Proof tells you which":** Relies on the **Disjunction Property**.
  *   **The Real Number Example:** Supports **Underivability** and **Disjunction Property**; does not support Refutability.
