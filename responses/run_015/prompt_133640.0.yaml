prompt: |-
  I volunteer at this small restorative justice nonprofit and we keep fighting about wether people actually deserve blame or if we're just reacting to how they turned out. I read about this philosopher Galen Strawson's basic argument — that true moral responsability only works if you're the ultimate cause of yourself, but then you'd need to cause whatever made you that way, and it loops back forever so nobody ever gets to be the true origin. I want a practical checklist my co-facilitator and I can actually run before a session: the questions to ask in order, what counts as a good enough answer to each one, where we stop with a clear "no true desert here," and where we have to admit it's a values call not a logic problem. Apply it to three cases: a kid who vandalized a store right after being kicked out by his parents, a nurse who stole meds to pay rent, and a guy who planned a fraud for months because he liked feeling clever. Make sure one comes out opposite of what I'd want, and flag the spots where the procedure just breaks down and we have to decide as people. Keep it grounded for someone with no philosophy background, and don't hand me a bibliography — I wouldn't know what to do with it anyway.
