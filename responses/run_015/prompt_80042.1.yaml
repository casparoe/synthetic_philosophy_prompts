prompt: |-
  I have just spent a long evening arguing with a friend about whether the activations inside a large neural network are "representations" in any sense that matters, or whether the word is doing more work than it can bear. We kept circling the same issues without converging, and I have decided that before either of us argues further we need a shared specification: what a theory of representational content in artificial neural networks actually has to deliver to count as adequate. Please write that specification.

  For each requirement, give the consideration or motivating case behind it, and say whether you regard it as non-negotiable or as a preference of a particular camp. Cover at least the following, and flag any you think I have omitted:

  - Granularity: what the unit of a representation is supposed to be — a single activation, a learned feature, a circuit, a population of units — and what the theory owes us in cases where a single direction in activation space is shared by many concepts, or a single concept is spread across many directions.
  - Systematicity and compositionality: whether the theory must recover the systematic and compositional structure that philosophers have long taken to be essential to genuine content, and what that requirement actually demands of a network whose features are learned end-to-end rather than laid down by hand.
  - Causal mediation rather than mere correlation: the requirement that a putative representation figure in the causal chain between input and output, rather than being a bystander that merely co-occurs with the relevant computation.
  - Misrepresentation: the requirement that the theory explain how a feature can represent the wrong thing — a "cat" direction that lights up on a not-cat — without collapsing into the claim that a feature only ever represents what it tracks.
  - The circularity charge: whether the theory must answer the worry that a functional-role or causal-role account explains a feature's content only by reference to the very causal relations whose interpretation is at issue.
  - Interpretability: whether a representation has to be human-interpretable to count as one, or whether that is a prejudice of the people who happen to need to read the features.

  Then tell me which of these you take to be genuine desiderata and which to be inherited prejudices of one side of the argument; whether any subset of the list is jointly unsatisfiable, in which case the list itself is the result and we should say which subset and why; and which single requirement knocks out the most candidate theories.

  Finally, score the main contenders briefly against the list — the causal-role or functional account, the view that networks have no representations in the relevant sense and only computation, and the interpretability-led view that a representation just is a human-readable feature — but keep the weight on the requirements, since that is where the real work is. I want the specification and the reasoning, not a bibliography or a reading list.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Analyze the Request:**
      *   **Task:** Create a shared specification for a theory of representational content in artificial neural networks (ANNs).
      *   **Context:** The user argued with a friend about whether ANN activations are "representations." They need a common ground to proceed.
      *   **Requirements:** Cover specific topics (Granularity, Systematicity/Compositionality, Causal Mediation, Misrepresentation, Circularity, Interpretability). Flag omissions.
      *   **Structure per Requirement:** State the requirement, give the motivating consideration/case, and label it as "Non-negotiable" or "Preference of a particular camp."
      *   **Analysis:** Identify genuine desiderata vs. inherited prejudices. Identify jointly unsatisfiable subsets. Identify the "killer" requirement.
      *   **Evaluation:** Score main contenders (Causal/Functional, Eliminativism/Computationalism, Interpretability-led) against the list.
      *   **Constraint:** Focus on specification and reasoning, not bibliography/reading lists.

  2.  **Deconstruct the Requirements:**

      *   **Granularity:** What is the vehicle? Single neuron? Subspace? Circuit?
          *   *Motivation:* Distributed representation vs. localist. Polysemanticity (one neuron, many concepts) vs. Superposition (one concept, many neurons).
          *   *Status:* Non-negotiable that a theory must *specify* this, but negotiable on *which* granularity is correct.
      *   **Systematicity/Compositionality:** Can the network recombine parts? (Fodor's argument).
          *   *Motivation:* Human thought is compositional. ANNs are often criticized for lacking this.
          *   *Status:* Highly contested. Connectionists argue for distributed compositionality; Classicists argue for symbolic. Likely a "Preference" or a high bar that many fail.
      *   **Causal Mediation:** Does the activation *do* the work?
          *   *Motivation:* Distinguish representation from epiphenomenal byproducts (like the shadow of a clock hand).
          *   *Status:* Non-negotiable. If it doesn't causally contribute, it's not a functional representation.
      *   **Misrepresentation:** Can it be wrong?
          *   *Motivation:* If representation = correlation, error is impossible (if it fires, it represents whatever caused it). Need to explain false positives.
          *   *Status:* Non-negotiable for a robust theory of content (the "disjunction problem").
      *   **Circularity:** Does defining content rely on already interpreted inputs/outputs?
          *   *Motivation:* If we say "this neuron represents 'edge' because it helps classify 'cat'," we presuppose 'cat' has content.
          *   *Status:* Non-negotiable for a naturalistic theory, but very hard to satisfy.
      *   **Interpretability:** Must humans understand it?
          *   *Alien Concepts:* Maybe networks represent things humans can't grasp.
          *   *Status:* Preference (Human-centric vs. Realist).

      *   **Omissions:** What's missing?
          *   *Normativity:* Representations have correctness conditions (already covered partly by Misrepresentation).
          *   *Teleology/Function:* What is the representation *for*? (Evolutionary vs. Training objective).
          *   *Stability/Robustness:* Does the representation persist across adversarial perturbations?

  3.  **Drafting the Specification (Iterative Process):**

      *   *Tone:* Philosophical, precise, adjudicating.
      *   *Format:* Clear headings for each requirement.
      *   *Decision on Status:* I need to take a stance. I will argue that Causal Mediation and Misrepresentation are the hard constraints (Non-negotiable), while Systematicity and Interpretability are camp preferences. Granularity is a definitional necessity. Circularity is a meta-constraint.

  4.  **Analyzing Conflicts (The "Unsatisfiable Subset"):**
      *   *Conflict:* Strong Compositionality + End-to-End Distributed Learning. It is very hard to get classical systematicity from standard backprop networks without architectural constraints.
      *   *Conflict:* Human Interpretability + Alien Concepts. If we demand human interpretability, we rule out "alien" representations that might be more efficient.
      *   *Killer Constraint:* Misrepresentation. This is the classic "Disjunction Problem" (Fodor). Most causal theories fail here.

  5.  **Scoring the Contenders:**
      *   *Causal/Functional:* Good on mediation, struggles with misrepresentation and circularity.
      *   *Eliminativism (No Representations):* Dodges the hard problems by denying the premise. Good on circularity (nothing to explain), bad on explaining success.
      *   *Interpretability-led:* Good on granularity/human utility, fails on "alien concepts" and risks anthropomorphism.

  6.  **Refining the Output:**
      *   Ensure I explicitly flag omissions.
      *   Ensure I distinguish between "Non-negotiable" (conditions for the theory to work) and "Preference" (philosophical leanings).
      *   Make sure the "Killer Requirement" is justified.
      *   Keep the scoring brief but punchy.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address polysemanticity in Granularity? Yes.
      *   *Check:* Did I distinguish between correlation and causation? Yes.
      *   *Check:* Is the distinction between desiderata and prejudices clear? I need to make sure I don't just say "it's subjective." I need to argue *why* something is a prejudice (e.g., demanding human interpretability assumes human concepts are the gold standard).
      *   *Check:* Did I answer the "unsatisfiable subset" prompt? I should highlight the tension between Compositionality and standard ANN architectures.
      *   *Check:* Did I avoid a bibliography? Yes.

  8.  **Final Polish:** Organize into the requested sections: The Specification, The Analysis (Desiderata vs. Prejudice, Conflicts, Killer), The Scorecard. (Proceed to generate output based on this structure).

  *(Self-Correction on "Non-negotiable"):* I should be careful. In philosophy, almost nothing is truly non-negotiable. I will frame "Non-negotiable" as "Required for the theory to solve the specific philosophical problem of content" vs "Preference" as "Required for the theory to match a specific intuition (e.g., classicism or human utility)."

  *(Refining the "Circularity" point):* This is subtle. It's about grounding. If we define internal content by external labels, we beg the question. The theory needs to ground content without assuming the external labels already have it, or at least explain the transfer.

  *(Refining "Misrepresentation"):* This is the hardest one. If a neuron fires for cats and dogs, does it represent "cat-or-dog"? If it fires for a cat-picture that is actually a dog, is it misrepresenting? The theory must distinguish the *norm* from the *regularity*.

  *(Final Plan):*
  1. Introduction setting the stage.
  2. The Specification (6 points + Omissions).
  3. The Analysis (Desiderata vs. Prejudice, Conflicts, Killer).
  4. The Scorecard.
  5. Conclusion.

