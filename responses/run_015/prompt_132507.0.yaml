  Hi — please treat this as a puzzle from a philosophy of language seminar rather than an essay topic. You're someone who has taught Frege's puzzle many times and who is good at reverse-engineering the rule someone is running from a track record of case verdicts. I'm a TA for the seminar and I'm putting together a revision sheet, so I want the reasoning: no reading lists, no papers, no citations (I can't check them anyway), just the argument.

  Our professor uses "informative" to mean roughly: a speaker could genuinely learn something from it, it has real cognitive significance for them — as opposed to being cognitively on a par with a = a. She also insists this isn't just modality: she says 'water = H₂O' is informative for an ordinary competent speaker even though it's necessary and knowable only a posteriori. Her verdicts so far: (1) 'Hesperus = Hesperus' — trivial. (2) 'Hesperus = Phosphorus' for a careful sky-watcher who has followed the morning star and the evening star for years without ever connecting them — informative. (3) 'Clark Kent = Superman' for Lois — informative. (4) 'Scott = the author of Waverley' for someone who has read and loved Waverley and knows Scott only as a famous novelist — informative. (5) 'Nyx = Nótt' for a student who met both names in a single lecture sentence, along the lines of Nyx, goddess of night, also called Nótt, and got both names from that one source — trivial, even though they're different words with different origins. (6) a man who picks up the name Paderewski from music-lovers and again, independently, from newspaper-reading relatives, and ends up sincerely assenting that Paderewski had musical talent while denying that Paderewski had musical talent — informative; when I asked her why, all she said was something like, well, is the difference in what he'd say about the man or in where he got the name from?, which of course settles nothing. (7) 'the woman I saw at the station = the woman who interviewed me' for someone who already knows for certain it was the same woman — trivial.

  Here's the case I made up, and I can't tell wether her precedents decide it. Mira is a hydrologist doing fieldwork in a mountain range she doesn't know, in bad weather. On Tuesday at dawn her guide points north and says: that's Tarn — the highest peak in this range. On Thursday at dusk a different guide, from the far side of the valley, points south and says: that's Kestrel — the highest peak in this range. Mira trusts both guides completely, believes there is exactly one highest peak in the range, has no reason at all to think the two sightings were of the same mountain (from those angles it looks like two completely different shapes, and she never saw them together), and if you asked her what 'Tarn' and 'Kestrel' pick out she would produce exactly the same words for both: the highest peak in this range. Does she learn something from 'Tarn = Kestrel', or is it trivial for her in the way 'Tarn = Tarn' is? Start by brainstorming the candidate rules that fit all seven earlier verdicts — I can only get three or four myself, and at least two of them seem to disagree about Mira — then say what each predicts about Tarn/Kestrel, which of her verdicts is the closest analogue and why, give your best guess at how she'd rule with the reasons for preferring it, and name the one extra case you'd put to her to settle it. Keep it under about 500 words. Finish with a final line exactly in this form: Verdict: [informative | trivial | precedents don't decide it] — rule: [short name for the rule you think she's running] — test case: [one sentence].
