answer: |-
  **Draft Taxonomy: Pure Time Preference in Intergenerational Institutional Investment**

  **Root:** Setting Discount Rates for Non-Existent Beneficiaries

  1.  **Does the non-identity problem make cross-generational welfare comparison conceptually broken?**
      *   **YES** → **Leaf 1: Person-Affecting Restriction**
          *   *Awkward Commitment:* Implies fiduciaries cannot claim harm from policies that create miserable future lives, provided those lives are still worth living and the policy changed *who* was born.
      *   **NO** → *(Proceed to Q2)*

  2.  **Do social and individual discount rates have to diverge?**
      *   **YES** → **Leaf 2: Ramsey Rule Institutionalism**
          *   *Awkward Commitment:* Commits to discounting future welfare solely because future generations are projected to be wealthier, effectively penalizing success.
      *   **NO** → *(Proceed to Q3)*

  3.  **Does existential risk give a reason to treat near-future and far-future differently (independent of pure preference)?**
      *   **YES** → **Leaf 3: Probability-Adjusted Discounting**
          *   *Awkward Commitment:* Requires assigning precise survival probabilities to civilization over centuries, inviting strategic manipulation of risk models to lower current costs.
      *   **NO** → *(Proceed to Q4)*

  4.  **Is delaying a benefit morally asymmetric with accelerating a harm?**
      *   **YES** → **Leaf 4: Asymmetric Intergenerationalism**
          *   *Awkward Commitment:* May require bankrupting the present fund to prevent trivial harms to the distant future, violating intertemporal neutrality.
      *   **NO** → *(Proceed to PTP Valuation)*
          *   **PTP = 0** → **Leaf 5: Zero-Rate Utilitarianism**
              *   *Awkward Commitment:* Generates infinite present-value liabilities for perpetual maintenance costs, potentially freezing all capital deployment.
          *   **PTP > 0** → **Leaf 6: Positive Pure Time Preference**
              *   *Awkward Commitment:* Explicitly values the welfare of future persons less than present persons solely due to temporal location, violating impartiality.

  ***

  **Flagged Empty/Incoherent Combinations**

  *   **Q1=YES + Q2=YES (Incoherent):** If welfare comparison is conceptually broken (Q1), a social discount rate lacks a numerator; you cannot maximize what cannot be compared.
  *   **Q1=YES + Q3=YES (Incoherent):** Existential risk weighting presupposes comparable subjects across states of the world; the non-identity problem dissolves the subject continuity required for risk calculation.
  *   **Q2=YES + Q3=YES (Unattractive/Redundant):** Rarely occupied because diverging social rates (Ramsey) usually absorb growth uncertainty; adding explicit existential risk discounting on top double-counts uncertainty.
  *   **Q4=YES + PTP > 0 (Unexplored):** Philosophically unstable; if you already discount the future positively, adding asymmetry creates conflicting vectors for harm/benefit weighting that lack a unified axiology.

  ***

  **Notes for Committee:**
  *   This structure isolates the *metaphysical* blocker (Q1) from the *economic* mechanism (Q2) and the *risk/ethical* modifiers (Q3/Q4).
  *   Leaves 2 and 3 are the most common in current endowment policy but rely on mutually exclusive assumptions about uncertainty.
  *   Leaf 5 is the philosophical ideal for many seminar participants but institutionally non-viable due to Leaf 5's awkward commitment.
