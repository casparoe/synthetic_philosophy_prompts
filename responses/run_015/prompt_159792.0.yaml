answer: |-
  Here is a battle plan for 45 minutes. Your frame is philosophically sound, but for first-years, it risks being too meta-logical too soon. They think logic is "the rules of the game," not "properties of consequence relations." You need to ground your frame in the *rules* they already know.

  ### 1. The Frame: Tweak the Entry Point
  Your frame ("pry inconsistency and triviality apart") is the correct *philosophical* story. But do not start by defining "consequence relations." Start by showing them the **bridge** that connects the two in classical logic, and then propose burning that bridge.

  *   **Keep:** The goal is to show Inconsistency $\neq$ Triviality.
  *   **Change:** Do not start with definitions. Start with the **Explosion Derivation**.
  *   **Why:** They know Natural Deduction. If you show them *how* classical logic forces triviality from inconsistency (using rules they recognize, like Disjunctive Syllogism or EFQ), the "collapse" becomes a mechanical result, not an abstract definition. Then you can ask: "Which rule is the culprit?"

  ### 2. The Sequence (Order of Operations)
  Here is the dependency chain. Do not swap these.

  1.  **The Classical Mechanism (0–10 mins):**
      *   Derive $Q$ from $P \land \neg P$ on the whiteboard using rules they know (e.g., $\land$-Elim, $\lor$-Intro, Disjunctive Syllogism).
      *   **Point:** In classical logic, Inconsistency *mechanically forces* Triviality.
      *   **Dependency:** You cannot motivate paraconsistency until they see *how* the explosion happens.

  2.  **The Motivation (10–20 mins):**
      *   Ask: "Is there any situation where we have $P$ and $\neg P$ but *shouldn't* conclude $Q$?"
      *   **Point:** This motivates blocking the bridge (Explosion). This is **Paraconsistency** (a property of the logic).
      *   **Dependency:** You must establish the *utility* of paraconsistency before claiming contradictions are *true*.

  3.  **The Example (20–30 mins):**
      *   Introduce the candidate true contradiction.
      *   **Point:** This motivates **Dialetheism** (a philosophical claim about truth).
      *   **Dependency:** Dialetheism depends on Paraconsistency (you can't have true contradictions if they explode), but Paraconsistency does not depend on Dialetheism (you can block explosion just to handle errors). **Make this distinction explicit.** "Inconsistent Theory" (handling bad data) vs. "Inconsistent World" (true contradictions) are **two separate steps**. Do not merge them.

  4.  **Gluts vs. Gaps (30–35 mins):**
      *   **Placement:** Put this *after* the main example.
      *   **Why:** If you put it earlier, they will think paraconsistency is just "fuzzy logic" or "ignorance" (gaps). You need them to understand the *glut* (both true) first.
      *   **Distinction:** Gap = Neither True nor False (Intuitionism/Fuzzy). Glut = Both True and False (Dialetheism). Paraconsistency usually requires Gluts (or a non-normal semantics), but Gaps also block some classical inferences. Keep it brief: "We are talking about Gluts, not Gaps."

  5.  **Wrap & Assessment (35–45 mins).**

  ### 3. The One Example
  You are right to worry about the Moral Dilemma. First-years will solve it by appealing to "all things considered" duties or ranking values. It dissolves the contradiction too easily.

  You are also right to worry about the Liar. It consumes time in semantic quagmires.

  **The Recommendation:** Use the **Liar**, but with a "Speed-Run" protocol.
  *   **Why:** It is the only example that genuinely motivates *Dialetheism* (true contradictions). The "Inconsistent Database" example motivates *Paraconsistency* (tolerating inconsistency), but students will just say "Well, one of them is wrong." To get to Dialetheism, you need a case where $P$ and $\neg P$ are arguably *both correct*. The Liar is the only robust candidate.
  *   **The Protocol:**
      1.  Write: $L$: "This sentence is false."
      2.  Ask: "If true, then? If false, then?" (2 minutes).
      3.  **Pre-empt the "Meaningless" Objection:** Say this explicitly: *"Some of you want to say this is meaningless. If you do, you've solved the paradox by deleting the sentence. But what if our language *requires* this sentence to be meaningful? What if we want a logic that can handle its own semantics? Dialetheism says: accept the contradiction, keep the sentence."*
      4.  **Stop Loss:** If they argue semantics for more than 3 minutes, cut it off: *"That's a valid objection, but for this session, assume there are cases where we cannot simply delete the contradiction. How would the logic handle it?"*

  **If you absolutely refuse the Liar:** Use **Naive Set Theory (Russell's Set)**.
  *   $R = \{x \mid x \notin x\}$.
  *   Is $R \in R$?
  *   Same structure as Liar, but feels more "mathematical" and less "linguistic trickery" to some students.
  *   **Constraint:** Do not get bogged down in set theory axioms. Keep it to the membership condition.

  **What the example must have:**
  *   **Symmetry:** Reasons for $P$ must be as strong as reasons for $\neg P$ (blocks "prima facie" solutions).
  *   **Necessity:** The contradiction shouldn't be due to empirical error (blocks "just check the data" solutions).
  *   **What it must not have:** Vagueness (blocks "it's a borderline case" solutions).

  ### 4. Misconceptions & Defusal Timing

  | Misconception | When it arises | How to defuse it (Script) |
  | :--- | :--- | :--- |
  | **"So anything goes / Trivialism"** | **Minute 15** (Immediately after proposing to block Explosion). | *"Paraconsistency blocks Explosion ($P, \neg P \vdash Q$). It does not block Modus Ponens. We still reject contradictions most of the time. We just don't let one broken window burn down the whole house."* |
  | **"They've just redefined 'not'"** | **Minute 25** (When discussing truth values). | *"In many paraconsistent logics, $\neg T = F$ and $\neg F = T$ still holds. The difference is that a sentence can be *both* T and F. Negation behaves normally; the *values* are what changed."* |
  | **"That's just vagueness / gaps"** | **Minute 35** (During Gluts vs. Gaps section). | *"A gap says 'neither'. A glut says 'both'. Vagueness handles 'is this bald?' Dialetheism handles 'this sentence is false'. We are talking about overdetermination, not underdetermination."* |
  | **"Contradictions are fine in real life / Relativism"** | **Minute 40** (Wrap up). | *"Dialetheism isn't relativism ('true for you, false for me'). It's objectivism ('true and false, period'). The law of Non-Contradiction is a contingent rule of classical logic, not a law of reality."* |

  ### 5. The Final Question
  Do not ask: "What is paraconsistent logic?" (Slogan repetition).
  Do not ask: "Is the Liar sentence true?" (Invites debate).

  **Ask this:**
  > "In classical logic, if I prove that a theory contains a contradiction, I have proven the theory is useless (trivial). If we switch to a paraconsistent logic, what have I *actually* proven about the theory, and what work is left to do?"

  **Correct Answer Gist:** "You've proven it's inconsistent, but not that it's trivial. The work left is to contain the inconsistency so it doesn't infect the rest of the theory."
  *(This tests if they understand the Inconsistency $\neq$ Triviality distinction.)*

  ### 6. What to Refuse to Explain (Scope Boundaries)
  You have 45 minutes. You must explicitly say you are **not** covering:

  1.  **Specific Proof Systems:** "We aren't learning the rules of LP or K3 today. We're talking about the *motivation* for changing the rules."
