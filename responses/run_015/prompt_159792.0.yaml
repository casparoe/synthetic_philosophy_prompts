  ### Summary Checklist for the Whiteboard
  1.  **Left Column:** Classical Derivation of Explosion ($P \land \neg P \vdash Q$).
  2.  **Center:** The Liar (or Russell's Set) $\rightarrow$ "We want to keep this info."
  3.  **Right Column:** Paraconsistency (Block Explosion) vs. Dialetheism (Accept True Contradiction).
  4.  **Bottom:** Glut (Both) $\neq$ Gap (Neither).

  **Final Advice:** Your instinct to separate "Inconsistent Theory" from "Inconsistent World" is your strongest pedagogical tool. First-years often think paraconsistency means "we stop checking for errors." Correct them: "Paraconsistency is how we manage errors without panic. Dialetheism is the claim that sometimes, the error is actually reality." Keep that distinction sharp.
