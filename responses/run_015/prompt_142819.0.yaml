      *   *Decodability* maps to **Informational Semantics** (Dretske, Fodor): If state $S$ covaries with property $P$, $S$ represents $P$.
      *   *Causal Efficacy* maps to **Functional Role Semantics** (Block, Cummins): If state $S$ plays a specific causal role in producing behavior related to $P$, it represents $P$.
      *   *Counterfactual Robustness* maps to **Teleosemantics** or **Structural Representation** (Millikan, Gładziejewicz): The system uses the representation to guide action in a way that respects the structure of the world.
