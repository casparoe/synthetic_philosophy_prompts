answer: |-
  You are not muddling anything. You have independently rediscovered one of the most persistent and difficult problems in the philosophy of language and metaphysics. Your "package-deal" intuition is correct, and the tension you feel is the central engine of counterfactual logic.

  Here is the plain breakdown of what you have found, the established names for it, and the verdict on your three examples.

  ### 1. The Established Name
  The specific tension you identified—between changing *only* the event versus changing the *causes* of the event—has a standard name in philosophy. It is the distinction between **Non-Backtracking** and **Backtracking** counterfactuals.

  *   **Non-Backtracking (The "Miracle" View):** You hold the entire past fixed up to the moment of the change. To make the antecedent true (Napoleon wins), you posit a small, localized "miracle" or divergence (a stray cannonball) that violates the actual laws of nature just for that moment, but you keep everything else (the troop numbers, the exhaustion) exactly as it was. This is the view most famously defended by **David Lewis** in his 1973 book *Counterfactuals*.
  *   **Backtracking (The "Causal" View):** You refuse to allow miracles. If Napoleon won, the past *must* have been different to cause that win legally. Therefore, you "backtrack" and change the supply lines, the morale, or the strategy leading up to the battle. This changes a much larger "package" of facts.

  The "rule" your book club was fighting over is the **Similarity Metric**. When we imagine a "possible world" where Napoleon wins, how do we measure which possible world is "closest" to ours?
  *   **Side A** prioritizes similarity of *particular facts* (keep the army size the same).
  *   **Side B** prioritizes similarity of *laws/causes* (keep the causal logic consistent).

  There is no objective rule for which metric to use. It is pragmatic. We switch between them based on what we are trying to prove. If we want to know about Napoleon's tactical genius, we use Non-Backtracking (same bad spot, did he win?). If we want to know about France's geopolitical viability, we use Backtracking (could France have won a war like that?).

  ### 2. The "Package Deal" (Cotenability)
  You called it a "package deal." The technical term is **Cotenability**.

  Proposed by **Nelson Goodman** in *The Problem of Counterfactual Conditionals* (1947), this asks: *Which facts can hold true alongside the counterfactual antecedent?*

  When you say "If Napoleon had won," you are implicitly asking: "Which of the actual facts are **cotenable** with Napoleon winning?"
  *   Is "France had fewer men" cotenable with "Napoleon won"? Side A says yes. Side B says no.
  *   Is "I am the same person" cotenable with "I took the other job"?

  Goodman showed that counterfactuals don't work by logic alone; they work by a context-dependent selection of which background conditions we are allowed to keep fixed. You are correct that people switch conventions without noticing. They are silently swapping their list of cotenable facts.

  ### 3. Are Your Three Examples the Same Thing?
  **Yes.** Structurally, they are identical instances of the Cotenability/Backtracking problem.

  *   **Napoleon:** Do we keep the *strategic context* fixed (Non-Backtracking) or the *causal laws* fixed (Backtracking)?
  *   **The Job:** Do we keep your *psychological identity* fixed ("Same me, different choice") or do we acknowledge that a different choice implies a different *prior mental state* ("Different me, different choice")?
      *   If you keep your identity fixed, it's a "miracle" choice (out of character).
      *   If you backtrack, you were a different person in 2019, which means your whole life trajectory changes, making the prediction "I'd be miserable" impossible to calculate.
  *   **The Rain:** This is the most subtle one, but it is the same mechanism.

  ### 4. Is the Future "If" Actually Clean?
  **No.** The mess is hiding there, but pragmatics usually sweep it under the rug.

  You noted: *"If it rains on Saturday the match is off" seems perfectly clear.*
  This is an **Indicative Conditional**. It is about *information*, not *metaphysics*. You are saying: "In all the futures consistent with my current knowledge where rain occurs, the match is off." You aren't asking how the rain got there; you are just updating your map of the future based on a premise.

  However, if you make it a **Subjunctive Future** ("If it *were to* rain..."), the worms appear.
  *   *Example:* "If I were to raise my hand in class..."
      *   **Non-Backtracking:** My hand goes up, but my brain state is the same (a spasm). Result: I look crazy.
      *   **Backtracking:** My hand goes up because I decided to. Result: I look engaged.
      *   The outcome of the counterfactual depends entirely on which "package" you travel with.

  The reason the past feels messier than the future is that with the future, we usually care about the *consequence* of the event, not the *origin*. With the past (history), we care deeply about the *origin* because history is explanatory. If Napoleon wins by a miracle, it explains nothing about history. If he wins by strategy, it changes our understanding of history.

  ### 5. Verdict on Your Analysis
  You are not muddling separate problems. You have correctly identified that counterfactual reasoning requires a **selection function** that is not defined by logic itself.

  *   **Your Term:** "Package-deal ifs" is a very accurate intuitive description of **Cotenability**.
  *   **Your Insight:** The observation that people switch conventions without noticing is the standard critique of Lewis's theory. Context dictates the "similarity metric," and people rarely state their metric aloud.
  *   **Your Rain Example:** You correctly identified that the *past tense* triggers the metaphysical problem (how do we make this false thing true?) while the *future tense* often masks it as an epistemic problem (what follows from this assumption?).

  **The Plain Truth:**
  There is no "correct" way to resolve the Napoleon debate. Both sides are applying different similarity metrics. Side A is asking, "Given the actual strategic situation, could a tactical fluke have saved him?" Side B is asking, "In a world where France was capable of winning, what would that look like?" They are answering different questions, but because English uses the same grammar ("If Napoleon had won...") for both, they think they are arguing about the same fact.

  You have stumbled onto the reason why historians and philosophers still fight about this. There is no rule. There is only the choice of which package of facts you decide to drag along with you into the imaginary world.
