  **The Burden of the Sole Saviour: Rationality and the Unilateralist's Curse**

  The unilateralist's curse presents a haunting dilemma for the altruistic agent. It arises when a group of actors, each capable of undertaking a specific action independently, faces a situation where the action is beneficial if undertaken by a few but harmful if undertaken by too many. Crucially, each actor possesses private information or judgment suggesting that their own intervention is necessary and beneficial. In such a scenario, if each actor follows their own best judgment, they risk collectively producing a outcome worse than if none had acted at all. For the novelist crafting a narrative around this tension, the philosophical stakes are as high as the plot's. The central question is whether this curse renders decentralised altruistic action inherently irrational, or whether a path through the minefield exists.

  To argue that the curse makes decentralised action irrational is to argue that individual rationality is incompatible with collective welfare in these specific epistemic conditions. The argument rests on the probability of overshoot. If ten strangers learn of a catastrophe and each believes they are the most competent to stop it, and if only one should act to avoid collateral damage, the independent probability of multiple actors intervening is high. Each actor reasons: 'If I do not act, the catastrophe may happen. If I do act, it may be stopped. The risk of others acting is uncertain, but the risk of inaction is certain.' When summed across all actors, this logic leads to a tragedy of the commons in reverse: a tragedy of excess. The costs incurred by redundant actions, or the specific harms caused by too many interventions, outweigh the benefits. Therefore, the rational choice for each individual, considering the likely behaviour of others, is to refrain. To act is to gamble with public safety based on private confidence, which is ethically indefensible.

  However, there is a compelling counter-argument. To declare decentralised action irrational is to invite paralysis. In many real-world scenarios, central coordination is impossible; communication is too slow, or trust is too low. If the catastrophe is sufficiently grave, the expected value of at least one person acting may outweigh the risk of too many acting. Furthermore, the argument for irrationality assumes that actors cannot adjust their decision-making principles. It treats the actors as rigid maximisers of their private signals. If actors can adopt a higher-order principle that accounts for the possibility of others, action becomes rational again. The curse does not condemn action; it condemns naive action.

  This distinction brings us to two competing ethical frameworks: the Principle of Conformity and the Principle of Restraint. The Principle of Conformity dictates that one should act only if one could will that everyone in one's position act. In the context of the unilateralist's curse, this principle is destructive. If everyone acting leads to a worse outcome (overshoot), then Conformity demands that no one acts. If no one acts, the preventable catastrophe occurs. Thus, strict adherence to Conformity guarantees the disaster it seeks to avoid by preventing the necessary minority action. It prioritises moral purity of the will over the consequentialist reality of the outcome.

  Conversely, the Principle of Restraint dictates that one should act only if one has reason to believe that too few others will act. This principle is forward-looking and probabilistic. It does not ask 'What if everyone did this?' but rather 'What will everyone actually do?' This allows for the possibility that a subset of actors should intervene. It places the burden on the actor to estimate the likelihood of others' involvement. If an actor believes they are part of a large group of informed individuals, Restraint suggests they should hold back. If they believe they are likely the only one, Restraint permits action. Therefore, the Principle of Restraint is superior because it offers a mechanism to hit the optimal threshold of intervention, whereas Conformity guarantees zero intervention in scenarios where universal action is harmful.

  Now consider the variant proposed for the novel: each actor believes they are the only one who truly cares about the outcome. This introduces a psychological distortion into the epistemic calculation. Under the Principle of Restraint, an actor must estimate the probability of others acting. If I believe I am the only one who cares, I necessarily believe that others will not act, regardless of whether they possess the information. Moral indifference implies inaction. Consequently, this belief drives the actor towards intervention. They reason: 'Others may know, but they do not care, so they will not act. Therefore, too few will act. Therefore, I must.'

  Does this make the curse worse, or is it self-undermining? It decidedly makes the curse worse. It is not self-undermining because the actors do not know that others share this delusion. If every actor believes they are the unique moral agent, every actor concludes that others will not act. Consequently, every actor intervenes. The result is the maximum possible overshoot, producing the worst conceivable outcome. This variant transforms the curse from a statistical risk into a psychological inevitability. It removes the inhibiting factor of expecting competition or collaboration. It suggests that moral arrogance is more dangerous than mere competence arrogance. The belief in unique virtue blinds the actor to the statistical reality that others might be similarly motivated, thereby ensuring the collective failure they sought to prevent.

  Therefore, the curse does not make decentralised altruistic action irrational, but it imposes a strict requirement on the mindset of the actor. Action is rational only if the actor adopts the Principle of Restraint and, crucially, suppresses the belief in their unique moral standing. To act rationally in the face of the unilateralist's curse, one must assume that one is not special. One must assume that others are equally informed and equally motivated, unless there is hard evidence to the contrary. The rational altruist must act with epistemic humility, discounting their private signal by the probability that others possess it too.

  In conclusion, the unilateralist's curse does not render decentralised altruistic action irrational, but it does render ego-centric decision-making fatal. The Principle of Conformity must be rejected in favour of the Principle of Restraint, as Conformity leads to guaranteed catastrophe in overshoot scenarios. However, Restraint only functions if actors recognise that their sense of unique moral obligation is likely a shared delusion. For the novelist's characters, the tragedy lies not in their willingness to act, but in their inability to believe that others care as much as they do. Rationality demands that they act as if they are interchangeable, even if they feel unique.

