      *   *Standard Example:* Publishing dangerous technology. If one person publishes, it's out there. If ten people publish, it's still out there, but maybe the redundancy causes noise or panic. Or vice versa: preventing a catastrophe. If one prevents it, good. If ten try to prevent it, they might interfere with each other or cause collateral damage.
