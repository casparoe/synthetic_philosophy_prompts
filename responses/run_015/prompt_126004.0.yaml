  **To:** Internal Seed-Grants Committee
  **From:** [Your Name]
  **Date:** Wednesday, October 25
  **Subject:** Recommendation on Double-Blind Review Protocol

  Team,

  We're stuck. We've got a vote coming up Thursday, and right now we're split 50/50 between keeping the double-blind review protocol we've had since 1983 and switching to open peer review to match the Provost's open-science push.

  I've been digging through the arguments, and I want to propose a way forward that doesn't just split the difference but actually addresses the core philosophical disagreement here. Below is my analysis of where we stand, followed by a concrete recommendation.

  ### The Fence, The Builder, and The Tearers

  To get unstuck, we need to map out the Chesterton's Fence argument properly, because the half of this committee citing it is right to be worried.

  *   **The Fence:** The double-blind review protocol (reviewers don't know applicants, applicants don't know reviewers).
  *   **The Unknown Builder:** The 1983 Committee. We know *when* they built it (right after a nepotism scandal), but the *why* is gone. The archives flood in the 90s destroyed the memos explaining the specific mechanics they chose. We know there was rot, but we don't know exactly how this specific fence stopped it.
  *   **The Person Tearing It Down:** That's us (and the Provost's Office). We are looking at this rule through a modern lens of transparency and assuming it's just bureaucratic inertia.

  The Burkean argument here isn't just nostalgia. It's the claim that institutions hold wisdom that outruns any single generation's reasoning. The 1983 committee knew something about our specific university culture—perhaps about how powerful certain departments are, or how social pressure works in our specific faculty lounges—that we don't remember. If we tear this down based on general principles of "open science" without knowing the local history, we might invite the nepotism back in without realizing it until it's too late.

  ### Epistemic Scaffolding

  I attended a seminar on institutional epistemology last year that offered a useful framing here: rules can function as **epistemic scaffolding**.

  Even if we don't know *why* the builder put the fence up, the fence itself is doing work. It protects reviewers from social pressure they might not even be aware they're feeling. It allows a junior faculty member to reject a senior department chair's proposal without fear of reprisal. The rule acts as a cognitive shortcut for virtue. You don't have to be brave to be impartial under double-blind; you just have to follow the procedure.

  If we remove this scaffolding, we are demanding that every reviewer possess a level of individual moral courage and impartiality that the institution previously guaranteed structurally. That's a huge risk. The scaffolding argument suggests we should keep the fence *even if* nobody remembers the builder, because the scaffolding is holding up the integrity of the process right now.

  ### The Strongest Argument Against Me (The Status Quo Side)

  I am recommending we move toward open review, which means the strongest argument I'm overriding is the one to **Reject the switch** entirely. I want to treat that argument honestly because it is robust.

  The hardline Status Quo argument is this: **Transparency is not a neutral good.** In a small university ecosystem, knowing who reviewed whom can chill dissent. If I know the Dean reviewed my grant, I might hesitate to critique their department later. If the Dean knows I rejected their protégé, my next tenure file might look different. The 1983 scandal wasn't just about handing money to friends; it was about the weaponization of knowledge. By making reviews open, we aren't just clearing the air; we are handing everyone a map of the power dynamics. The Burkean side argues that without the blindfold, we aren't getting "honesty," we're getting "politeness." And politeness is the enemy of meritocracy. If we switch to open review and the funding starts clustering around existing power centers, we might not be able to reverse course before a generation of junior researchers is pushed out. That is a catastrophic risk that "modern norms" don't mitigate.

  ### Recommendation: Approve with Conditions

  I believe we have to align with the Provost on open science, but we cannot ignore the risk of tearing down the scaffolding without testing the load-bearing walls. Therefore, I recommend we **approve the switch with conditions.**

  We will move to open peer review, but we will treat it as a **3-year pilot program** with specific guardrails that act as *new* scaffolding while we test if the old fence was necessary.

  **The Conditions:**
  1.  **Opt-Out Clause:** For the first three cycles, applicants may request double-blind review if they can demonstrate a conflict of interest or power imbalance (e.g., junior faculty applying where a senior chair is a reviewer).
  2.  **Demographic Monitoring:** The Committee will receive an annual report on funding distribution. If we see statistically significant clustering of funds within specific departments or among senior faculty compared to the 5-year double-blind average, the protocol automatically reverts to double-blind.
  3.  **Reviewer Anonymity (Partial):** While applicants will know who reviewed them, the individual reviewer scores will remain anonymized in the aggregate report to prevent targeted retaliation against specific reviewers who say "no."

  **Timeline:**
  *   **Implementation:** Fall 2024 Cycle.
  *   **Midpoint Review:** Spring 2026 (Committee vote on whether to continue).
  *   **Final Review:** Spring 2027 (Decision to make permanent or revert).

  ### Bottom Line

  We can't keep a rule forever just because it's old, but we'd be foolish to delete it because we assume it's useless. The 1983 builders are gone, and their files are flooded out, but the risk they managed is likely still here. We should move toward openness, but we need to build new guardrails before we take down the old ones.

  Vote for the pilot. It respects the Provost's goal without gambling the integrity of the seed grants on an assumption that we know better than the past.

  Verdict: approve with conditions
