answer: |-
  Here is the full desiderta for an adequate account of simmball causality within the careenium, structured by cases, distinctions, puzzles, and trade-offs.

  ### 1. The Cases an Account Must Get Right
  An adequate theory cannot treat all simmball movements identically. It must discriminate between:
  *   **The Trigger Case:** A specific configuration of simmballs (e.g., a "check" pattern) results in a mandatory reconfiguration of the substrate (the homunculi move specific tokens). The account must explain why this pattern *constrains* the substrate's future state.
  *   **The Shadow Case:** A configuration of simmballs changes, but only as a byproduct of substrate activity with no feedback loop (e.g., dust settling on the board). The account must explain why this pattern is causally inert.
  *   **The Glitch Case:** The substrate behaves physically correctly (homunculi move tokens), but the simmball logic is violated (illegal move). The account must specify whether causality was preserved at the physical level but broken at the symbolic level, or if the "simmball" ceased to exist as a symbol.

  ### 2. Distinctions That Cannot Collapse
  To avoid category errors, the account must maintain these boundaries:
  *   **Causal Push vs. Informational Tracking:** The physical transfer of energy (homunculus muscle moving token) must remain distinct from the logical constraint (rule of the game dictating where token *should* go). Collapsing these turns semantics into physics or vice versa.
  *   **Layered Substrate vs. Flat Monism:** The account must acknowledge the physical board (wood/plastic/homunculi) and the logical board (game states) as distinct descriptive levels without claiming they are two separate *substances*.
  *   **Abstract Symbol vs. Embodied Token:** A simmball as a logical unit (the "Knight") must be distinguishable from the specific physical object (the carved wooden piece). If the wooden piece is smashed but replaced, the "Knight" persists; if the account cannot explain this persistence, it fails.

  ### 3. Puzzles to Dissolve
  The account must render the following questions non-problems rather than solving them empirically:
  *   **The Non-Physical Shove:** How does something non-physical (the rule/pattern) shove physical stuff (the token)? *Dissolution:* Show that "shoving" is the wrong metaphor; the constraint is enacted by the substrate's design, not the pattern's force.
  *   **Downward Causation for Balls:** How does the high-level pattern (the game state) cause the low-level events (homunculus movement)? *Dissolution:* Reframe downward causation as "structural constraint" rather than "efficient cause."
  *   **The Homunculus Regress:** If the simmballs tell the homunculi what to do, who tells the homunculi how to read the simmballs? *Dissolution:* The reading mechanism is brute physical causality, not further interpretation.

  ### 4. The Tension Matrix (Jointly Unsatisfiable Pairs)
  You are correct to be suspicious. The following pairs are likely incompatible within a single coherent framework without redefining terms:

  *   **Strong Substrate Independence + Direct Downward Efficacy:**
      *   *Conflict:* If the simmball is truly independent of the substrate (multiple realizability), it has no physical handle to grip the substrate with. If it has direct efficacy (pushes atoms), it must be a physical state of the substrate, negating independence.
      *   *Verdict:* You can have independence (as a descriptive abstraction) OR efficacy (as physical causation), but not both as ontological primitives.

  *   **Semantic Realism + Causal Closure:**
      *   *Conflict:* If the *meaning* of the simmball (e.g., "threat") is a real causal force, physics is violated (mental content moves matter). If physics is closed (only mass/energy moves matter), then meaning is causally inert.
      *   *Verdict:* Most accounts sacrifice Semantic Realism (meaning is derived, not fundamental) to save Causal Closure.

  *   **Token Identity + Type Flexibility:**
      *   *Conflict:* If a specific simmball token is identical to a specific physical state, it cannot be realized by different physical states (Type Flexibility). If it is flexible, it cannot be identical to the physical token.
      *   *Verdict:* Requires a functionalist middle ground that often feels ontologically "thin."

  ### 5. Non-Negotiables vs. Camp Preferences
  **Non-Negotiables (Must be preserved for the account to be coherent):**
  *   **Causal Closure of the Physical:** The homunculi and tokens obey physics. No magic forces.
  *   **Counterfactual Support:** The account must support statements like "If the simmball had been elsewhere, the substrate would have moved differently."
  *   **Asymmetry:** The substrate determines the simmball's existence, but the simmball determines the substrate's *patterned* behavior.

  **Camp Preferences (Optional philosophical commitments):**
  *   **Ontological Status of Patterns:** Whether patterns are "real" things or just useful descriptions (Realism vs. Instrumentalism).
  *   **Location of the Self:** Whether "you" are the simmballs, the homunculi, or the whole system (irrelevant to causal mechanics, crucial for identity).
  *   **Reductionist Direction:** Whether to explain the top-down in terms of bottom-up (reductionism) or treat top-down as emergent (emergentism).

  ### 6. Scorecard of Usual Suspects
  Weighted against the criteria above (not on truth, but on explanatory coverage):

  **1. Substrate Reductionism (The "Just Atoms" View)**
  *   *Claim:* Simmballs are just physical tokens; rules are just physical regularities.
  *   *Score:* High on Causal Closure and Distinction (Token/Physics). Low on Counterfactual Support and Downward Causation.
  *   *Failure Mode:* Cannot explain why the *pattern* matters. It gets the Trigger Case right physically but misses the logical necessity. It collapses Symbol vs. Token.

  **2. Emergent Symbolism (The "Real Patterns" View)**
  *   *Claim:* Simmballs are real higher-level entities that constrain the substrate.
  *   *Score:* High on Downward Causation and Counterfactual Support. Low on Causal Closure and Non-Physical Shove.
  *   *Failure Mode:* Struggles to explain the mechanism of the "push" without violating physics. Risks dualism.

  **3. Correlation-Only / Epiphenomenalism (The "Shadow" View)**
  *   *Claim:* Simmballs track substrate activity but cause nothing; the homunculi do all the work based on brute rules.
  *   *Score:* High on Causal Closure and Non-Physical Shove (dissolves it). Low on Trigger Case (makes the pattern inert).
  *   *Failure Mode:* Makes the game logic accidental. Cannot explain why specific patterns reliably lead to specific outcomes without invoking the very rules it claims are inert.

  **Summary Verdict:**
  The only way to satisfy the non-negotiables without collapsing distinctions is to treat **Downward Causation as Constraint**. The simmballs do not *push* the substrate; the substrate is *built* to be sensitive to the simmball configurations. The "causal bite" is not in the ball, but in the architecture of the careenium that makes the ball's position relevant. This sacrifices Direct Downward Efficacy (balls don't shove) to save Substrate Independence (patterns are real constraints).
