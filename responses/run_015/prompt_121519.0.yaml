  As you prepare to challenge your colleague in the upcoming seminar it will be useful to disentangle the slogan nature is not a backdrop into four distinct interpretations ranging from the modest to the radical because each commits her to a different ontological and methodological position. The first and most modest interpretation suggests that physical and biological conditions constrain human choice without dictating it. This thesis is entirely defensible within standard historiography because it acknowledges that humans operate within material limits such as climate zones or disease environments without surrendering the capacity for decision-making. It successfully escapes the charge of environmental determinism because it maintains that while nature sets the boundaries of the possible it does not select the specific path taken within those boundaries. However this reading does not license treating a volcanic eruption or an infectious agent as an actor in the same sense as a statesman because under this model nature remains the stage or the boundary condition rather than a participant making decisions or pursuing goals alongside human beings.

  Moving to a stronger explanatory thesis one might argue that non-human processes must appear in the causal narrative with independent explanatory weight. This position is also defensible since historical outcomes like the French Revolution cannot be fully understood without accounting for harvest failures or epidemiological shifts that operate according to their own logic regardless of human awareness. This view escapes hard environmental determinism provided one insists that human responses to these shocks are variable and culturally mediated rather than automatic reflexes. Yet even here granting independent causal weight does not fully license equating a pathogen with Napoleon because causality is not identical to agency and while the plague bacteria may cause death they do not formulate strategy or bear responsibility in the way a political leader does.

  The third reading involves a metaphysical claim that entities like volcanoes or pathogens possess a form of agency analogous to human intentionality. This thesis is far less defensible on realist grounds unless one is willing to adopt a panpsychist or deeply metaphorical ontology that attributes will or purpose to non-sentient matter. It certainly escapes the charge of determinism because attributing agency to nature implies that nature itself makes choices rather than mechanically forcing outcomes. However while this view technically licenses treating a volcanic eruption as an actor in the same sense as a statesman it does so only by inflating the definition of agency to the point where the distinction between intentional political action and blind physical process becomes blurred which many historians find conceptually costly.

  Finally the radical historiographical position suggests that explanatory credit should be distributed across a network of human and non-human nodes without privileging consciousness or intention. This approach often associated with actor-network theory is defensible as a methodological tool for tracing associations and effects even if its ontological claims remain controversial. It escapes determinism by viewing history as the emergent product of complex interactions rather than a linear push from either human will or environmental force. This position explicitly licenses treating a volcanic eruption as an actor but only by redefining the word actor to mean anything that modifies a state of affairs rather than anything that possesses mind or motive. If you can pin down which of these four claims your colleague is endorsing you will be better positioned to ask whether she is arguing for better causal explanation or for a metaphysical redefinition of agency and whether her methodological practice actually matches the radicalism of her slogan.
