answer: |-
  *   "for any system of axioms you like" — **wrong**. The theorem applies only to systems that are consistent, recursively enumerable, and sufficiently strong to encode basic arithmetic (specifically multiplication). Presburger arithmetic (addition only) is complete and decidable.
  *   "statements... true but... never prove" — **wince**. Truth is model-relative (true in the standard model), not absolute. It also assumes the system is consistent, which the system itself cannot prove (Second Incompleteness Theorem).
  *   "encode a sentence that talks about itself" — **accept**. This accurately describes the Gödel sentence construction via arithmetization of syntax.
  *   "infinitely many truths... only finitely many proofs" — **wrong**. Finite axioms generate infinitely many proofs through combination. The gap exists because provable statements are computably enumerable, while arithmetic truth is not.
  *   "Gödel had already proved... logic itself... cannot be made complete" — **wrong**. Gödel's Completeness Theorem (1929) established that first-order logic *is* complete. Incompleteness (1931) targets specific theories within logic, not logic itself.
  *   "no computer can ever do mathematics... mathematician can always step outside" — **wince**. This Lucas-Penrose argument assumes human insight transcends algorithms. Most logicians view this as philosophical speculation, not a mathematical consequence of the theorem.

  Your professor is right; legal codes function through interpretive semantics and precedent, not purely syntactic derivation from fixed axioms. Gödel limits formal deductive closure, whereas law relies on hermeneutic flexibility to resolve ambiguity.
