      *   *Sam's rebuttal:* It wasn't custom, it was context. You turned caste into a rigid hierarchy.
      *   *The Pivot:* The Census. Counting people creates divisions.
      *   *The Meta-Argument:* Alex wants to put "Stability" in the asset column. Sam says "Identity Violence" is a liability that compounds interest.
      *   *The Incommensurability:* Sam argues you can't offset genocide with GDP. Alex argues governance is about trade-offs.
      *   *Ending:* The ledger doesn't balance.

  6.  **Final Polish:**
