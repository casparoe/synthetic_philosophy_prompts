          *   Imprecise Credences/Robustness: Targets Vertical (and extreme Horizontal). Says "I can't assign a single number."
          *   Commonsense/Near-term: A retreat caused by failing to solve Vertical.
          *   Do they address both? Symmetry fails if Vertical uncertainty undermines the symmetry assumption itself (i.e., if the structure of the future makes positive ripples more likely for big interventions).
      *   **Part 3: The Scale/Arithmetic Problem (The Core):**
          *   Setup the toy model.
          *   Option A (Big): Direct Value $D_A$, Flow-through $F_A$.
          *   Option B (Small): Direct Value $D_B$, Flow-through $F_B$.
          *   Assumption: $D_A > D_B$.
