          *   *The "Surplus":* The surplus isn't *physical* novelty, it's *pattern coherence*. A zombie could mimic a wince, but could it mimic the *right* wince in the *right* context for the *next* hour? The "Mind" hypothesis is the only one that makes the *stream* of behavior intelligible without infinite ad-hoc adjustments.
