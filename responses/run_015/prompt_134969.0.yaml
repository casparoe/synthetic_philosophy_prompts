      *   *Section 1: Analogy.* Acknowledge the user's correction. Explain why Analogy fails the surplus test. It's a static mapping. It treats the other person as a mirror of the self. It doesn't generate *new* expectations about *their* specific uniqueness, only generic "human" responses.
