answer: |-
  Here is the move-by-move analysis, followed by the overall verdict and the key distinction you asked for.

  ### Move-by-Move Analysis

  **(1) Nadia: The Guest/Host Obligation.**
  **Verdict: Right.**
  Nadia is correct that the visitor/host relationship generates a pro tanto (at first glance) moral duty. Morality is not just about abstract principles; it is relational. Knowingly causing offense or friction to people who are hosting you violates a duty of non-maleficence and reciprocity. Wes's attempt to reduce this to "etiquette" underestimates the moral weight of social harmony. Deliberately offending a host isn't just "bad style"; it is an act of aggression, however small.

  **(2) Nadia: Non-Arbitrariness of Function.**
  **Verdict: Right.**
  Wes assumes conventions are like driving on the left vs. right (purely arbitrary). Nadia correctly identifies that many local customs are functional adaptations to local conditions (safety at the crosswalk, economic stability at the soup stall). Ignoring a safety adaptation isn't just breaking a rule; it is risking harm. Ignoring an economic norm (the coin) disrupts a local equilibrium. When a convention solves a coordination problem *and* protects dignity or safety, compliance is morally reinforced, not just socially expected.

  **(3) Nadia: General Duties Require Local Input.**
  **Verdict: Right (This is Nadia's strongest point).**
  This is a philosophical claim about **moral particularism**. Wes argues you can just follow the general principle ("don't be contemptuous"). Nadia correctly points out that "contempt" is not a universal constant; it is defined by the local code. If the local code says "leaving a tip is contempt," then leaving a tip *is* contempt, regardless of your internal intent. You cannot fulfill the moral duty without the local empirical knowledge. Wes's "general principle" is empty without the local specification.

  **(4) Nadia: Downstream Harm.**
  **Verdict: Right, with a caveat.**
  The consequentialist argument holds. Overtipping inflates prices for locals; aggressive queuing creates social friction that locals must absorb. However, this argument relies on the custom being benign. If the custom were exploitative, the "harm" of breaking it might be outweighed by the good. But within the context of City V (benign/functional customs), Nadia is right: the cost of your moral posturing is paid by the locals, not you.

  **(5) Wes: Conventions are Purely Coordination/Prudential.**
  **Verdict: Wrong.**
  This is Wes's fundamental category error. He treats all conventions as traffic rules (left vs. right), where the only reason to comply is to avoid a crash. But the customs in City V are **expressive**. The soup-stall coin isn't just about coordination; it communicates a specific social message about dignity and hierarchy. Ignoring it isn't just "failing to coordinate"; it is sending a message of superiority. Prudence explains *why* you might get away with it, but it doesn't capture *why* it matters. There is a moral residue here that prudence cannot explain.

  **(6) Wes: Moral Content Negates Convention.**
  **Verdict: Half-Right (but ultimately misleading).**
  Wes is right that underlying duties exist (safety, dignity). He is wrong that this makes the convention irrelevant. He creates a false dichotomy: either it's a moral duty OR it's a convention. In reality, the convention *is* the local instantiation of the moral duty. You cannot "be safe" at the City V crosswalk without ignoring the green light. The "arbitrary residue" (which coin, which light) is not arbitrary; it is the necessary vehicle for the moral content. By trying to strip the convention away to find the "real" duty, Wes makes the duty impossible to perform.

  **(7) Wes: The Overgeneralization (Sexism) Objection.**
  **Verdict: Right.**
  This is Wes's strongest move and Nadia's biggest vulnerability. Nadia's principle ("follow local custom to avoid friction") is too broad. It lacks a moral filter. If the local custom is oppressive (e.g., segregation, gender apartheid), "avoiding friction" is not a moral justification for compliance. Wes is correct that "reasonable expectations" is the filter Nadia needs. A custom that violates basic rights does not generate a duty of compliance, even for a guest. Nadia's theory works for City V, but Wes is right that it fails as a universal theory without this limiter.

  **(8) Wes: The Mimicry/Indeterminacy Objection.**
  **Verdict: Wrong.**
  Wes argues that because the locals dislike "perfect" mimicry by newcomers, the rule "follow the convention" is indeterminate. This is a logical error. The rule is not "Perform Action X"; the rule is "Perform Action X with appropriate humility and timing." Learning that "doing it too well is suspicious" is simply part of learning the convention. It doesn't make the duty optional; it makes the duty more complex. A visitor who learns the coin ritual but does it too aggressively hasn't "followed the convention"; they've failed to learn the *whole* convention. Wes mistakes a nuanced rule for a lack of a rule.

  ### Overall Verdict

  **Nadia is more right.**

  Wes wins on the boundary condition (Move 7: unjust customs), but he loses on the core mechanism. Wes attempts to dissolve the moral obligation into prudence (Move 5) or abstract generalities (Move 6), both of which fail to capture the reality of social interaction.

  Nadia correctly identifies that morality is often **encoded** in convention. You cannot be a "good person" in a vacuum; you must be a good person *somewhere*, and that requires adhering to the local semantic code of respect and safety. When Wes says "just don't be contemptuous," he is offering a map without a legend. Nadia understands that the convention *is* the legend.

  However, Nadia's victory is conditional. She is right about City V, but Wes is right that her principle needs a "human rights veto." If she accepts that distinction, her framework holds. Wes's framework, however, cannot be fixed; if conventions are merely prudential (Move 5), then there is never a moral reason to follow them, only a self-interested one, which contradicts our intuition that offending a host is a *wrong*, not just a *risk*.

  ### The Missing Distinction

  The argument turns entirely on a distinction Wes misses and Nadia implies but doesn't name:

  **Coordination Conventions vs. Constitutive/Expressive Conventions.**

  *   **Coordination Conventions (Wes's model):** These are arbitrary solutions to logistical problems (e.g., driving on the left). The only reason to follow them is that others do. If everyone else stopped following them, the duty would vanish. Wes treats *all* customs this way.
  *   **Constitutive/Expressive Conventions (Nadia's model):** These are rules where the action *constitutes* the social meaning. In City V, the coin *constitutes* respect; the tip *constitutes* an insult. The green light *constitutes* danger.

  Because Wes treats the soup-stall coin as a Coordination Convention, he thinks the moral duty is separate from the act. Because Nadia treats it as an Expressive Convention, she understands that the act *carries* the moral duty.

  **Why this decides the argument:**
  If the custom is merely coordinative, Wes is right: it's prudence. But if the custom is expressive (which the tipping and queuing stories clearly are), then violating it is not just "failing to coordinate," it is "speaking a language of insult." You have a moral duty not to insult people. Therefore, you have a moral duty to follow expressive conventions. Nadia sees the semantic content of the custom; Wes sees only the mechanical function.
