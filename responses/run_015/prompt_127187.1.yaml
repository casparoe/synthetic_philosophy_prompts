answer: |-
  Here is a decision procedure designed for your constraints, your skills, and the specific emotional economy of this project.

  ### Part 1: The Diagnostic (Pre-Writing Questions)

  Your assumption that *Content = Paraphrase* and *Form = Decoration* is indeed the distortion. In song, form is often the mechanism by which the content is delivered. A refrain is not just repeated text; it is an obsession. A shortening line is not just visual; it is a failure of breath.

  Replace the "Substitution Test" with the **Functional Displacement Test**.

  **Run this before drafting:**

  1.  **The Vector:** In one sentence, what does this song *do* to the listener? (e.g., "It lulls," "It accuses," "It fades away," "It circles a trauma.")
  2.  **The Anchor:** What is the one image, word, or sound that, if removed, makes the Vector impossible?
  3.  **The Load-Bearing Test:** Take a formal feature (rhyme, metre, line length). Imagine replacing it with a standard English equivalent.
      *   *Question:* Does the Vector survive intact?
      *   *If Yes:* It is **Ambient Form**. You may sacrifice it for sense or singability.
      *   *If No:* It is **Load-Bearing Form**. You must preserve its *effect*, even if you must change its *method*.
  4.  **The Silence:** Where does the song pause? Is the silence part of the meaning (hesitation, breathlessness) or just a musical rest?

  **Where the test fails:** It cannot measure *beauty*. It can only measure *function*. It will tell you if the engine works, not if the car is pleasant to drive. You must supply the ear for that.

  ### Part 2: The Spending Order (The Economy)

  You cannot keep everything. You have a budget of "fidelity points." Do not use a fixed hierarchy (e.g., "Sense always beats Rhyme"). Use a **Contextual Hierarchy**.

  For each song, assign a **Primary Constraint** based on the Diagnostic.

  1.  **If the song is Narrative (tells a story):**
      *   *Priority:* Literal Sense > Narrative Flow > Rhythm > Rhyme.
      *   *Reason:* If the plot breaks, the song fails.
  2.  **If the song is Lyrical/Emotive (mood over plot):**
      *   *Priority:* Rhythm/Singability > Sound Texture (Rhyme/Alliteration) > Literal Sense.
      *   *Reason:* The feeling is the content. Clunky rhythm kills feeling faster than vague words.
  3.  **If the song is Structural (form is meaning, like your tapering example):**
      *   *Priority:* Structural Metaphor > Literal Sense > Rhyme.
      *   *Reason:* If the shape changes, the meaning changes.

  **The Rule of Compensation:** If you sacrifice a Load-Bearing Form feature (e.g., you cannot rhyme the village name), you must pay for it elsewhere. You cannot simply drop it. You must add a different sonic device (alliteration, assonance) in that stanza to maintain the "density" of the song. The ledger must record this payment.

  ### Part 3: The Fidelity Ledger (The Artefact)

  This is for your friend's daughter. It must be legible, non-technical, and final. It is not an invitation to negotiate; it is a map of the terrain she is walking.

  **Format:** One page per song. Max 200 words.

  | Feature | Decision | Cost | Justification |
  | :--- | :--- | :--- | :--- |
  | **Core Meaning** | Kept | None | The story of the winter is unchanged. |
  | **Rhyme Scheme** | Altered | Lost musical "lock" | English rhymes forced nonsense words; kept rhythm instead. |
  | **Village Name** | Kept (French) | No rhyme | The place is real; translating it would lie. |
  | **Compensation** | Added Alliteration | None | Used 'w' sounds to replace the lost chime of rhyme. |

  **Bottom Line Statement:** "This version prioritizes [Primary Constraint] over [Sacrificed Feature] to ensure the song remains [Vector]."

  **Instruction to Daughter:** "Read the English. If it feels honest, sign. If it feels like a lie, sign 'No'. Do not check the French."

  ### Part 4: The Melody Question

  For the four singable songs, you are no longer translating text; you are **translating a performance**.

  **The Choice:**
  *   **Idiom of the Writer:** Preserves the French rhythm, forces English singers to crunch syllables. (Reject this).
  *   **Idiom of the Singer:** Preserves the English mouth-feel, adjusts the text to fit the tune naturally. (Choose this).
  *   **Reason:** The songs are now for the *living*. If the family trips over the words, the memorial fails.

  **The Stop Rule:**
  Sing the draft.
  1.  If you must add a note to fit a syllable: **Acceptable.**
  2.  If you must stress a weak syllable (e.g., "the **AND**"): **Acceptable once per song.**
  3.  If you must distort a vowel so the word is unrecognizable: **STOP.**
  4.  If the tune requires a line length that contradicts the Load-Bearing Form (e.g., the tune demands 4 lines of equal length, but the poem fades 8-6-4-2): **ABORT TRANSLATION.**

  **The Abort Protocol:**
  If you hit Stop Rule #4, you cannot translate the song for singing. You have two options:
  1.  **Print only:** Include the French text and a prose gloss in the booklet, but mark it "Not for performance."
  2.  **Adaptation:** Write *new* English lyrics that fit the tune and the Vector, but admit they are not a translation. (For this project, Option 1 is safer for fidelity).

  ---

  ### Application to Three Songs

  Here is the procedure run on your three test cases.

  #### 1. The Village Name (Rhyme = Reference)
  *   **Diagnostic:** The rhyme scheme relies on the suffix of the village name (e.g., *-ac*). The name is untranslatable.
  *   **Functional Displacement:** If I translate the name (e.g., "Oakville"), I lie about the geography. If I keep the name (e.g., "Paulhac"), I cannot rhyme in English.
  *   **Spending Order:** Literal Sense (Place) > Rhyme.
  *   **Decision:** Keep the French name. Abandon the rhyme scheme in the stanzas.
  *   **Compensation:** Introduce internal assonance on the vowel sound of the name in the preceding line to create a "ghost rhyme."
  *   **Ledger Entry:** *Rhyme Scheme: Sacrificed. Cost: Loss of musical closure. Reason: The place is real; a translated name is a fiction. Compensation: Assonance added in line 3.*
  *   **Verdict:** Translatable for booklet. Singable only if the melody allows an unrhymed ending.

  #### 2. The Vocables Refrain (Memory = Meaning)
  *   **Diagnostic:** Refrain is "Tra la la / Hey nonny no." Daughter sang this as a child.
  *   **Functional Displacement:** If I translate to "Sing loud / Sing strong," the Vector (comfort/memory) collapses. The meaning is the *sound*, not the semantics.
  *   **Spending Order:** Sound/Memory > Literal Sense.
  *   **Decision:** Do not translate the vocables. Keep the original phonetics.
  *   **Melody Check:** Fits perfectly (it was written for it).
  *   **Ledger Entry:** *Refrain: Kept in French phonetics. Cost: None. Reason: These sounds are the memory. Translating them would erase the childhood association.*
  *   **Verdict:** Translatable and Singable.

  #### 3. The Tapering Lines (Form = Breath) vs. The Tune
  *   **Diagnostic:** Lines shorten 8-6-4-2. Vector is "running out of breath/life." Tune is 4 bars of equal length (4/4 time).
  *   **Functional Displacement:** If I force the English to fit the tune, I must pad the short lines. The "running out" effect vanishes. The song becomes stable, not fading.
  *   **Spending Order:** Structural Metaphor > Singability.
  *   **Melody Check:** To sing this, I must add filler words to the 4 and 2 syllable lines.
  *   **Stop Rule:** Triggered (Rule #4). The tune contradicts the Load-Bearing Form.
  *   **Decision:** **Do not translate for singing.** This song cannot be sung in English without becoming a different song.
  *   **Ledger Entry:** *Performance: French Only. Cost: Family cannot sing this one in English. Reason: The tune requires steady breath; the poem requires fading breath. To fit the tune would lie about the ending.*
  *   **Verdict:** Booklet only (French text + prose gloss). This is the answer you did not want to hear.

  ---

  ### Part 5: Limitations and Risks

  You asked for explicit boundaries on what this procedure cannot do.

  **1. Bookkeeping vs. Quality**
  The Ledger converts artistic failure into administrative transparency. It explains *why* a line is clunky; it does not make the line less clunky.
  *   *Risk:* You may produce 34 perfect Ledgers for 34 mediocre poems.
  *   *Mitigation:* You must add a **"Read-Aloud Check"** separate from the Ledger. If the English stumbles, the Ledger does not matter. Rewrite until it flows, *then* update the Ledger. The Ledger justifies the choice; it does not validate the craft.

  **2. The Ear Requirement**
  You stated you have an "ordinary reader's ear." This procedure requires an **English prosodic ear**.
  *   *Limitation:* The procedure can tell you *what* to save (the taper), but it cannot tell you *how* to achieve it in English iambics vs. trochees.
  *   *Mitigation:* For the 4 singable songs, you must test them on a third party who speaks English but not French. If they stumble, your "ordinary ear" has missed a stress. The procedure cannot fix a bad ear; only rehearsal can.

  **3. The Uniformity Trap**
  Applying the same procedure to 34 songs risks flattening them. A uniform process applied to diverse art often yields uniform mediocrity.
  *   *Limitation:* The procedure treats every song as a problem to be solved. Some songs are gifts to be received.
  *   *Mitigation:* Add an **"Exception Clause."** If, during the Diagnostic, a song feels "transparent" (the English writes itself), skip the Spending Order. Do not force trade-offs where none exist.

  **4. The Ledger as Product**
  You worry the Ledger will become the product—justification standing in for the work.
  *   *Risk:* The daughter may read the Ledger and think, "He tried hard," and accept a bad translation out of pity.
  *   *Mitigation:* Instruct the daughter explicitly: **"The Ledger is for information, not persuasion. If the poem feels dead, the Ledger is irrelevant."**
  *   *My View:* The Ledger is necessary for *your* integrity, not her judgment. It protects you from the guilt of compromise. It ensures that when you sacrifice a rhyme, you do so consciously, not accidentally. It prevents the "drift" of 34 songs over a year.

  **5. The Intent of the Dead**
  The procedure hands the decision to you, but the issue is often what your friend would have wanted.
  *   *Limitation:* A procedure cannot channel the dead.
  *   *Mitigation:* You are the executor of the text, not the soul. Your friend chose you because you are a translator (fidelity) and a friend (love). Trust that your "Spending Order" reflects his values. If he valued truth over beauty, the Ledger shows that. If he valued song over text, the Melody Rule shows that.

  **Final Recommendation:**
  Run the Diagnostic on all 34 songs first. Group them by "Primary Constraint." You may find you have 30 narrative songs and 4 structural ones. This will allow you to batch your work. But for the four singable songs, treat them as a separate project with a higher cost of failure. If Song #3 (The Taper) breaks the procedure, let it break. A booklet with one song in French and a gloss is a more honest memorial than a singable lie.
