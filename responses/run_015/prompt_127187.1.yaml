prompt: |-
  I should say at the outset what I do and don't know, so that the procedure can be pitched at the right level. I translate for a living — patent and clinical documentation, French into English — and I am good at the kind of fidelity that can be checked word by word against a source. I have no training in verse, no ear developed beyond an ordinary reader's, and until recently no interest in the problem.

  What changed: a friend of mine, a songwriter who worked in French, died two years ago. His partner, who is the executor and speaks none of the language, has asked me to prepare English versions of the thirty-four short songs he recorded, for a bilingual booklet accompanying a reissue of the recordings. Four of them the family still sings together, and they would like to sing those in English. I have two or three evenings per song, spread over about a year, for no fee; at the end my friend's daughter, who is eighteen and has read none of the French, looks at the English page proofs and says yes or no. She will read them cold, without me in the room. The one book on translation I own, which I read because its title puns on a word for a work made in memory of someone dead, contains dozens of English renderings of a single short French poem, each of them preserving something different; it convinced me that the music is where the difficulty is and left me with no way to proceed.

  So: please write me a decision procedure I can run alone, in an evening, on each of the thirty-four songs, and run the same way each time.

  The things I need it to contain, in order:

  First, the questions to ask about a song before writing anything — what the features of its form actually are, and which of them are doing work. My working assumption has been that content is whatever survives a prose paraphrase and that form is everything left over, so that form is what I sacrifice first. Tell me if that assumption is the thing distorting the procedure: I suspect it is, because several of these songs seem to mean things by their form that no paraphrase captures (a refrain that keeps returning the way the thought it reports keeps returning; lines that get shorter as the speaker runs out of things to say; a rhyme that yokes two words the song is arguing belong together). I need a way to separate load-bearing form — the kind whose loss changes what the song claims — from ambient form, the texture a reader enjoys but which carries nothing a paraphrase would miss. My candidate test is a substitution test: replace the feature with a different one and ask whether a reader who has never seen the French would take the song to be saying something different. Improve it if you can, and tell me where it fails.

  Second, the spending order, and the grounds for it. Given a song where rhyme, metre, register, line-length, and literal sense cannot all be kept, what do I preserve, and how do I decide in this case rather than by a fixed ranking? I want the reasoning to be recordable, because of the third thing.

  Third, a short written artefact per song — a fidelity ledger, say: what I kept, what I sold, what it cost, and one line of justification — that someone with no French and no poetry can read and use to decide whether to accept my version. It should make the trade-offs visible without inviting her to reopen each one.

  Fourth, the melody question. For the four songs the family sings, the tune fixes how many syllables there are and roughly where the stresses fall, and I can test my result by singing it. But I also notice that fitting English to a tune is not one thing: you can set it in the idiom he wrote in or in an idiom the family actually sings, and those give different answers about which syllables may be crunched. Say which choice is mine to make and which is not. And give me a rule, with a stop in it, for when the tune makes nonsense — at what point I leave that song out of the singable set, or write new English words to the tune rather than a translation of his.

  Please apply the whole procedure to three songs from the cycle, including at least one where the answer is one I will not want to hear — including, if that is where it lands, that a song should not be translated at all and should appear in French with a prose gloss.

  1. A song in which every stanza ends on the name of the village where he grew up, with all the rhymes built on that name. The name is untranslatable, and to an English reader it is noise; rhyme and reference are the same feature here.

  2. A song whose refrain, repeated unchanged after every stanza, is two lines of vocables — singable nonsense in the manner of a work chantey — which his daughter used to sing along to as a small child. This is one of the four that get sung. There is nothing here to translate.

  3. A song in which each stanza's lines shorten, eight syllables to six to four to two, the taper enacting a speaker running out of breath or of things to say. This one is also sung, and the tune will not permit the taper.

  Finally, be explicit about what the procedure cannot do: which questions it converts into bookkeeping rather than answering, where it cannot be run by someone without an ear for English prosody, where it hands the decision to a person because the issue is what my friend would have wanted rather than what his text permits, and whether a procedure applied uniformly across thirty-four songs is itself a choice I should be making. I would particularly like your view on whether the ledger risks becoming the product — pages of justification standing in for versions I have not managed to make good.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Professional translator (French to English, patent/clinical), high fidelity to source, no poetry training, ordinary ear, motivated by grief/friendship (songwriter friend died).
      *   **Task:** Create a decision procedure for translating 34 short songs into English for a bilingual booklet. 4 need to be singable.
      *   **Constraints:** 2-3 evenings per song. No fee. Final approval by 18-year-old daughter (no French).
      *   **Specific Needs:**
          1.  Pre-writing questions (Form vs. Content, Load-bearing vs. Ambient).
          2.  Spending order (Hierarchy of preservation, context-dependent).
          3.  Written artefact (Fidelity Ledger for the daughter).
          4.  Melody question (Singability vs. Translation, stop rules).
          5.  Application to 3 specific test cases (Village name rhyme, Vocables refrain, Tapering lines vs. Tune).
          6.  Explicit limitations of the procedure (Bookkeeping vs. Art, Ear requirement, Uniformity risk, Ledger as product risk).
      *   **Tone:** Respectful, precise, procedural but acknowledging the emotional weight. No fluff.

  2.  **Deconstruct the User's Assumptions:**
      *   *Assumption:* Content = prose paraphrase; Form = everything else (sacrificed first).
      *   *Correction:* This is the core distortion. In song/poetry, form *is* content. A refrain isn't just repetition; it's obsession. Shortening lines aren't just visual; they're breathlessness.
      *   *Procedure Goal:* Shift from "Form vs. Content" to "Function vs. Decoration."

  3.  **Drafting the Procedure (Step-by-Step):**

      *   **Step 1: Pre-writing Questions (The Diagnostic):**
          *   Need to identify *function*.
          *   User's "Substitution Test" is good but needs refinement. It's not just "would a reader think it's different?" but "would the *effect* be lost?"
          *   Add: What is the song *doing*? (Persuading, mourning, listing, fading out?)
          *   Add: Who is the speaker? Who is the listener?
          *   Refine the "Load-bearing" test: If I remove/change X, does the emotional trajectory collapse?

      *   **Step 2: Spending Order (The Economy):**
          *   Fixed ranking is bad (as user noted).
          *   Need a "Budget." You have X amount of "truth" you can carry.
          *   Hierarchy:
              1.  Core Intent (The "Why").
              2.  Singability (For the 4 songs).
              3.  Structural Metaphor (Line length, stanza shape).
              4.  Sound Texture (Rhyme, alliteration).
              5.  Literal Lexical Meaning.
          *   *Crucial nuance:* Literal meaning is often the first thing to bend in song translation to save rhythm/rhyme, *unless* the literal meaning is the core intent.

      *   **Step 3: The Fidelity Ledger (The Artefact):**
          *   Audience: 18-year-old daughter, no French.
          *   Purpose: Transparency, not debate.
          *   Format: Simple table. Feature | Decision | Cost | Reason.
          *   Warning: Keep it brief. Don't over-justify.

      *   **Step 4: The Melody Question:**
          *   Choice: Idiom of writer vs. Idiom of singer.
          *   Rule: The singer's mouth wins for the 4 singable songs.
          *   Stop Rule: If fitting the tune requires breaking the Core Intent (Step 1), drop the translation, keep the French + gloss, or write a *new* song (adaptation).
          *   Distinction: Translation (of text) vs. Adaptation (to tune).

  4.  **Applying to Test Cases:**

      *   *Case 1 (Village Name Rhyme):*
          *   Problem: Rhyme depends on untranslatable proper noun.
          *   Analysis: The rhyme *is* the reference.
          *   Decision: Cannot rhyme in English without faking the name.
          *   Outcome: Keep name, sacrifice rhyme. Explain in Ledger.
      *   *Case 2 (Vocables Refrain):*
          *   Problem: Nonsense syllables, emotional memory.
          *   Analysis: Meaning is sonic/memory-based, not semantic.
          *   Decision: Keep vocables. Do not translate "La la la" into "Sing out loud."
          *   Outcome: Transliteration or keep original. Ledger notes "Memory feature."
      *   *Case 3 (Tapering Lines vs. Tune):*
          *   Problem: Visual/breath form conflicts with fixed musical bars.
          *   Analysis: Tune demands uniformity; Text demands decay.
          *   Decision: Conflict is irreconcilable for *singable* translation.
          *   Outcome: **Do not translate for singing.** Present as poem in booklet, or French with gloss. This is the "answer you won't want to hear."

  5.  **Addressing Limitations (The Meta-Commentary):**
      *   Bookkeeping vs. Art: The ledger explains choices but doesn't make the poem good.
      *   Ear Requirement: User says "ordinary ear." Procedure needs a "Read Aloud" checkpoint.
      *   Uniformity: Applying the same rule to 34 songs might flatten them. Need a "Exception Clause."
      *   Ledger Risk: Yes, it can become a shield for bad work. Needs a "Quality Control" step separate from the Ledger.

  6.  **Refining the Tone:**
      *   The user is a professional translator. Use precise language.
      *   Acknowledge the grief context without being maudlin.
      *   Be direct about the hard choices (especially Case 3).

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I answer the "Substitution Test" critique? *Yes, refined it to "Functional Displacement Test."*
      *   *Check:* Did I address the "Spending Order"? *Yes, emphasized context over fixed hierarchy.*
      *   *Check:* Is the Ledger readable by the daughter? *Keep it non-technical.*
      *   *Check:* Did I apply the procedure to the 3 songs? *Yes, ensuring Case 3 yields the negative result.*
      *   *Check:* Did I address the "Ledger as Product" risk? *Yes, in the limitations section.*

  8.  **Final Polish:** Ensure the structure matches the user's requested order (Questions, Spending, Ledger, Melody, Applications, Limitations). (Self-correction: Ensure the distinction between the 30 booklet songs and the 4 singable songs is clear in the Melody section).

  9.  *(Final thought on Case 3)*: The user asked for an answer they might not want to hear. The only honest answer for a song where the *form* (tapering) is the *meaning* (running out of breath) but the *tune* requires uniform length is that it cannot be sung as a translation. It must be an adaptation (new words) or a poem (not sung). I will recommend removing it from the singable set.

  10. *(Final thought on the Ledger)*: Make sure the daughter knows she isn't judging the French, but the *honesty* of the English.

  11. *(Final thought on Uniformity)*: A uniform procedure on diverse art creates uniform mediocrity. I must warn against this.

