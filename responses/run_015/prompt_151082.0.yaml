  Welcome to PrudentMarkets. We are the only venue operating in strict compliance with the Milgrom-Stokey No-Trade Theorem. Our order book excludes purely speculative trade based on divergent posteriors. Please review the following before submitting Form 10-Alpha (Negative).

  **1. Can I trade based on my private forecast?**
  No. Under our Common Prior Assumption (CPA) covenant, all clients share identical initial probability distributions. If you offer to sell, I infer you possess negative private information. Since we are mutually aware of each other's rationality—common knowledge of rationality—I will not buy. Trade collapses. As our Chief Epistemology Officer states: "Uncertainty is merely uncompleted conditionalization. We finish the math so you don't have to lose money."

  **2. What valid motives justify an order?**
  Only non-informational shocks. You must certify endowment changes, consumption timing needs, or risk-tolerance adjustments. Our underwriting team verifies that you are not trading because you think you know better, but because you need cash for a divorce, a margin call, or a sudden interest in alpaca farming. Speculative alpha is strictly prohibited.

  **3. What happens if our posteriors diverge?**
  You are in breach of the Prior Reconciliation Agreement. The platform will halt matching and mandate a Bayesian updating session. Clients must exchange likelihood ratios until convergence is achieved. Billing is $500 per round of updating, plus data fees. Failure to converge results in forced liquidation at the prior mean.

  **4. Who provides liquidity if no one disagrees?**
  Our roster of Registered Noise Participants (RNPs). RNPs are contractually obliged to trade for non-epistemic reasons. They provide the necessary friction to prevent volume from hitting zero. Note: RNPs are not permitted to update their priors during market hours, as this would introduce informational content.

  **5. How does PrudentMarkets generate revenue?**
  We charge a Consensus Verification Fee. This covers the cost of establishing that there is nothing to be gained from the trade. It is a service charge for confirming zero expected profit. We do not take a spread; we take a fee for proving the spread is unjustified. Revenue is derived from the administrative burden of proving no alpha exists.

  **6. Do your prices aggregate information?**
  Marketing drafts previously claimed "price efficiency." Compliance struck this. The No-Trade Theorem assumes common priors, not efficient markets. Banning disagreement-driven trade eliminates the mechanism by which private information enters prices. As Dr. Elena Rostova (MIT Microstructure) noted: "By banning disagreement, you've banned the signal. You haven't created a market; you've created a calculator." We reply that calculators do not require risk disclosures.

  **7. If the theorem holds, why does PrudentMarkets exist?**
  This is classified as a Structural Arbitrage of Existence. If all clients were rational Bayesians with a shared prior, volume would be zero. The Firm's operational overhead constitutes a recognized irrationality. Clients are deemed to be trading against the Firm's existence proof. A Paradox Surcharge applies to all fills to cover the cost of this logical inconsistency.

  **IMPORTANT NOTICE:** *PrudentMarkets® does not guarantee that clients are rational, only that they are contractually bound to act as such. In the event of a Groucho Marx Scenario (where being offered a trade is itself reason to reject it), the Firm reserves the right to cancel your order and bill you for the inconvenience.*
