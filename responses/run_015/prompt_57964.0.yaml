prompt: |-
  So I didn't do college or anything, I've just been cooking line at the same diner for like nine years and I play pickup soccer on Sundays. Me and my cousin were up late arguing about how words get their meaning, cause he says every word has to have one real definition underneath or people are just talking past each other, and I kept thinking about the kitchen where nobody ever learned from a dictionary. You learn what fire or heard or clean means by working the station, getting yelled at, watching, and the same word does totally different jobs on grill vs fry vs front. Then I heard some podcast mention this philosopher Wittgenstein and his ideas about language games and family resemblance, like games dont all share one thing but overlap in bits, and meaning is more about use. That sounded exactly like my kitchen but I definately might be misunderstanding.

  Can you restate his whole deal in my world instead of philosophy talk, like tickets and stations and training new kids who keep messing up until they just get it, plus pickup games where house rules shift depending who shows up and nobody writes anything down. I know that world cold so dont dumb it down, be as faithful as you can. Then give me the leftover report, like what parts mapped over clean, what parts you had to stretch or fudge to make fit in kitchen and soccer talk, and what parts just have no way to be said with that vocab at all. And be honest about the leftovers, is it because kitchen talk is missing something important or because his idea was kinda fuzzy to begin with. Use my examples like what clean means and what counts as a game when we change teams every week to test it.
