  Question and scope
  This project asks whether quantitative neural properties (QNPs)—such as neuron count, synaptic density, or brain mass—possess intrinsic moral relevance, distinct from their instrumental value as proxies for psychological capacity. Standard debates assume size matters only insofar as it indicates consciousness or cognition. I challenge this by investigating whether the quantity of neural substrate itself grounds moral status. The scope is strictly delimited to avoid confounding ethical and political issues surrounding human variation. Consequently, the project excludes all comparisons of brain size among human populations. Instead, it focuses on three comparative domains: cross-species variation where neural metrics diverge from behavioral capacity; intra-organism changes via development or atrophy; and artificial or composite systems, including brain organoids, functionally coupled brains, and gradual neural replacement. The central question is not whether larger brains correlate with higher status, but whether a change in neural quantity, holding capacity constant, alters moral standing. By isolating quantity from capacity in these non-human and artificial cases, the project tests whether moral status is sensitive to the sheer amount of neural stuff involved, or only to what that stuff does. This distinction is critical for emerging technologies and non-human ethics, where capacity is difficult to assess but neural structure is measurable. The proposal seeks to determine if quantity is a fundamental moral unit or merely a disguised measure of function. I will explicitly treat brain size not as a monolithic variable but as a cluster of divergent metrics. This ensures the inquiry remains grounded in biological reality while addressing normative theory. The exclusion of human variation is not merely ethical but methodological, preventing the project from being swallowed by sociopolitical debates unrelated to the core philosophical question.

  Why the standard answers do not close the question
  Three standard views attempt to bypass this question, but each leaves it open. First, the Instrumentalist View holds that quantity is only relevant as a proxy for capacity. While often true empirically, this view cannot handle cases where quantity and capacity come apart, such as organisms with high neuron counts but limited behavioral complexity, or artificial systems designed to mimic capacity with minimal substrate. If status tracks capacity, quantity is irrelevant; if status tracks quantity, capacity is secondary. The project requires knowing which holds when they diverge. Second, the Epistemic View argues that under empirical uncertainty, we must act on measurable proxies like size. This addresses practical decision-making but not ontological status. It explains why we *use* size, not whether size *matters*. A theory of moral status must distinguish between what we can measure and what grounds value. Third, the Summation View posits that some quantitative property is intrinsically relevant because it tracks the total amount of experience or valenced experience possible. This view accepts intrinsic relevance but faces the counting problem: if status sums over neural units, does fusing two systems create value ex nihilo? This view risks conflating the magnitude of experience with the status of the experiencer. Each view fails to settle whether quantity is a constituent of status or merely evidence for it. The Instrumentalist View dismisses the question; the Epistemic View sidesteps the normative ground; the Summation View invites metaphysical absurdities regarding individuation. Therefore, the question remains open: is there a coherent model where quantity matters intrinsically without collapsing into capacity or generating paradoxical value creation? The project argues that existing frameworks assume away the tension between neural metrics and moral individuation, requiring a dedicated analysis of whether quantitative criteria can survive scrutiny when capacity is held constant. Furthermore, the Summation View often relies on a utilitarian calculus that aggregates welfare, but moral status is typically deontic, concerning rights or protections owed to individuals. Aggregating neural units may increase total welfare capacity, but it does not clearly explain why the *individual* entity commands greater respect. This distinction between aggregative value and individual status is crucial. Without it, the view conflates the value of experiences with the value of the subject.

  The argument and which puzzle carries it
  The argument centers on the Counting Problem, supported by Metric-Dependence and Persistence. Metric-Dependence establishes that "size" is not a single variable; neuron count, mass, and density diverge across species and systems. Choosing a metric silently imports assumptions about which neural features constitute value. However, this is preparatory. The core argument utilizes the Counting Problem to test whether any fixed metric can function as an intrinsic moral ground. If moral status is additive over neural units, then functionally coupling two brains should increase total status, while splitting a brain should decrease it, even if subjective experience remains unchanged. This suggests that additive quantitative criteria generate moral value through mereological rearrangement rather than changes in what is undergone. This is a stronger reductio than the Persistence Problem, which shows status fluctuating within a life. While fluctuation is counterintuitive, some gradualist theories accept it. The Counting Problem, however, implies that moral value can be created or destroyed by fission or fusion alone, violating the principle that moral value supervenes on experience or agency. The argument proceeds in three stages. First, I will demonstrate that fixing a metric (addressing Metric-Dependence) does not solve the individuation issue. Second, I will apply this metric to fusion cases (coupled brains, hemispheres) to show that additive status yields absurd value creation. Third, I will argue that this forces a dilemma: either quantity is not intrinsically relevant (collapsing to capacity), or our theory of individuation must be radically revised to prevent value creation via fusion. The Persistence Problem serves as supporting material, highlighting the temporal instability of quantity-based status, reinforcing the cost of accepting quantitative intrinsic relevance. By weighting the Counting Problem most heavily, the project avoids getting bogged down in empirical disputes over which metric is best, focusing instead on the structural implications of *any* additive quantitative criterion. This sharpens the user's initial suspicion: the size question is likely a disguised dispute about individuation and capacity, not an independent moral consideration. The argument concludes that unless a non-additive quantitative theory is formulated, quantity cannot be intrinsically relevant without violating basic constraints on moral value. This structure ensures that the project does not merely list puzzles but resolves them hierarchically. The Counting Problem acts as the decisive test because it targets the coherence of additive status itself. If additive status fails, then quantity cannot be a fundamental moral unit in the way proposed. This forces the conclusion that quantity is either irrelevant or must be understood non-additively, which significantly narrows the theoretical landscape.

