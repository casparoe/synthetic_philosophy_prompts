  I'm finishing a term paper for a grad seminar on classical Indian epistemology and I've realised I've slipped from testing a thesis into arguing for it, so I want someone to try to break it. Here's where I've landed. I want to reconstruct the Nyāya position that a cognition's validity is extrinsic — both in its arising and in our ascertainment of it — as a kind of hybrid: a token cognition counts as knowledge only if it is produced by a pramāṇa, where I'm glossing "pramāṇa" as a causally reliable, broadly fact-sensitive process (if the fact had been otherwise, this process wouldn't have thrown up this cognition), and its status as knowledge is never self-certifying but gets established, when and only when a doubt actually crops up, by a later apperceptive cognition normally backed by an inference from the success of the action the first cognition prompted. I also claim the standard regress worry fails, with two brakes: the demand for validation is triggered by occurrent doubt rather than attaching automatically to every cognition, and a validating cognition does not itself need to be independently certified as valid before it can do its validating work. A friend who works on Mīmāṃsā says both brakes are ad hoc, and my supervisor says the counterfactual gloss quietly turns a causal-production story into a modal one that no Naiyāyika would have recognised.

