answer: |-
  Prioritize the reallocation problem first, followed by the missing question of intervention specificity, then bound category drift, and explicitly discard the denominator question as a rabbit hole.

  **1. The Reallocation Problem (Your Q2)**
  *   **Upstream Impact:** This is the decisive factor for your core question: is violence reduction a distinct moral good or just a proxy for state capacity? If the decline in homicide is purchased via mass incarceration, preventive detention, or militarized policing, then funding "violence reduction" may simply mean funding state coercive power. This determines whether the category is ethically freestanding or downstream of political order.
  *   **Tractability:** High. You don't need new data; you need synthesis. Compare homicide decline curves against incarceration rates (US, Latin America, Europe) and historical shifts in punishment (Foucaultian discipline vs. sovereign violence). The literature on the "civilizing process" vs. the "carceral state" is rich and accessible.
  *   **Neglectedness:** Moderate. Effective altruism circles often treat violence reduction as purely good; critical criminology treats it as purely oppressive. The middle ground—where trade-offs are quantified—is where your practical advice lives.
  *   **Evidence to Move:** If you find strong negative correlation between incarceration and violence only in specific contexts (e.g., high baseline disorder) but not others, you can recommend conditional prioritization.
  *   **Confidence:** High. This is the only question that directly answers whether the *means* of reduction justify the *end*.

  **2. Intervention Specificity (Missing Question)**
  *   **Upstream Impact:** Even if violence reduction is good, is it *actionable* as a distinct cause area? If the only proven levers are GDP growth, female education, or urbanization, then "violence reduction" is an outcome, not a strategy. Donors need to know if there are marginal interventions (e.g., hotspot policing, cognitive behavioral therapy for at-risk youth, peacekeeping mandates) that outperform general development funding.
  *   **Tractability:** Moderate. Requires reviewing randomized control trials (J-PAL, 3ie) and historical case studies of specific interventions. Doable in 3 weeks with four readers splitting the literature.
  *   **Neglectedness:** High. Most macro-discussions skip the micro-mechanisms.
  *   **Evidence to Move:** If specific violence-focused interventions show higher cost-effectiveness than general poverty alleviation for the specific outcome of harm reduction, you have a defended agenda for distinct prioritization.
  *   **Confidence:** High. Without this, your write-up has no practical recommendation.

  **3. Category Drift (Your Q3)**
  *   **Upstream Impact:** This addresses your roommate's "data is garbage" claim. If "war" in 1600 includes pillaging and in 2000 means declared conflict between states, the trend line is broken. However, you cannot *solve* this in 10 weeks; you can only *bound* it.
  *   **Tractability:** Low to Moderate. You cannot fix the data, but you can demonstrate robustness. Focus on homicide data rather than war data; homicide definitions are more stable across centuries than battle deaths. Use sensitivity analysis: "Even if we assume X% of historical deaths were miscategorized, does the trend hold?"
  *   **Neglectedness:** Low. Historians argue this constantly. Your value add is summarizing the consensus limits for a general audience.
  *   **Evidence to Move:** If you find that adjusting for definition changes flips the trend (e.g., including colonial violence changes the "Long Peace" narrative), you must downgrade confidence in the trend but not necessarily the priority.
  *   **Confidence:** Moderate. I am least sure about your ability to do this justice in 3 weeks without getting sucked into historiography.

  **4. The Generalized Denominator (Your Q1)**
  *   **Verdict:** Rabbit Hole.
  *   **Reasoning:** While philosophically potent, it has low practical yield for donors. Donors allocate per dollar-per-life-saving or per-dollar-per-suffering-averted. "Per interaction" or "per mile travelled" requires data you cannot build and metrics donors cannot use. Choosing "per person-year" is the standard convention for mortality; deviating from it complicates comparison without changing the ethical imperative to save lives.
  *   **Confidence:** High. This is theoretical elegance masquerading as practical guidance.

  **Missing Questions You Must Address**
  1.  **Direct vs. Structural Violence:** You must define whether "violence" includes death by poverty/neglect. If yes, the category swallows "development." If no, you ignore the biggest killers. You need a principled boundary here, likely based on *intent* or *direct agency*, to keep the cause area distinct.
  2.  **The Counterfactual:** Would violence have dropped anyway? If the trend is secular (e.g., due to demographic shifts), funding interventions might be less impactful than funding things that accelerate those shifts.

  **Confidence Flags**
  *   **High Confidence:** Discarding the Denominator question; Prioritizing Reallocation.
  *   **Moderate Confidence:** Intervention Specificity tractability (depends on access to paywalled lit).
  *   **Low Confidence (Least Sure):** Category Drift bounding. I am unsure if four undergraduates can sufficiently navigate the historiography to defend the data against a skeptical economist roommate in three weeks without oversimplifying. If you get stuck here, pivot to homicide data only and acknowledge the war data is too noisy.
