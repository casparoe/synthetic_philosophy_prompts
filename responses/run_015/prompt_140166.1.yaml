      *   *Q3 (Category Drift):* The "Kuhn point." If "murder" in 1400 isn't "murder" in 2000, trends are meaningless. This undermines the roommate's "data is garbage" claim but also undermines the "long peace" claim. *Verdict:* High importance for validity, but hard to resolve in 10 weeks. However, acknowledging it is key to defending the data usage.

