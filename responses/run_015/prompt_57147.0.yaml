prompt: |-
  Three tickets landed on my desk this week and they're all the same ticket wearing different clothes: somebody wants a new category node whose name is a compound. Grade 8.8 hex bolt. Stainless hex bolt. Yellow zinc bolt.

  I run the catalog and search taxonomy at a mid-size industrial fastener distributor — about 45k SKUs, mostly bolts, nuts, washers and anchors plus some tooling. We have a category tree three levels deep, and attribute facets layered on it: material, finish, thread size, length, drive type, standard, property class. Search resolves to a tree node first and then filters by facet. The attributes exist but theyre populated inconsistently; the good suppliers send full spec sheets and the cheap ones send a part number and a shrug.

  I get maybe a dozen of these tickets a week from sales reps and category managers, and I have to say yes or no to each one. If I say no and they were right, customers cant find things and the reps route around the catalog entirely by emailing spreadsheets to each other, which is worse than the problem. If I say yes too often, in two years we have four thousand leaf nodes, every modifier combination has its own home, and a search for plain hex bolt no longer returns most of the hex bolts we actually sell. Two junior catalogers screen the tickets before they reach me. They're sharp but they've never studied taxonomy or philosophy and they are not going to read a theory, so whatever you give me has to run in about 15 minutes a ticket, in plain English, and the only sign-off gate is me.

  Here's the part that'll sound strange. I've been reading the White Horse dialogue in the Gongsun Longzi — the School of Names one where a speaker argues that a white horse is not a horse — and I think it's genuinely about my problem and not just an analogy I'm forcing onto it. As I understand it the argument runs: horse is the name for the shape, white is the name for the color, and what names a color isn't what names a shape. Then the move I care about: if you ask for a horse, a yellow one or a black one can be delivered, but if you ask for a white horse, a yellow or black one cannot be delivered — so the two names are not interchangeable in a request even though every white horse is a horse. There's also the hardness-and-whiteness dialogue, where the stone gives you its whiteness by eye and its hardness by hand and each sense misses what the other picks up, so the two properties come apart and each one drops out of view when you're not attending to it. And the name-and-actuality chapter, where every thing is supposed to sit in its proper position, a dislocated name is what generates the confusion, and rectifying a name means putting it back in the position that matches its actuality.

  If you think I've mangled any of that, tell me — I'm working from memory of translations I read a while ago and I don't want to build a company procedure on a misreading. But please don't hand me citations or a reading list, I have no way to chase them and I'd much rather have your reasoning than your references.

  So: turn that into a decision procedure. What I need is

  - the questions to ask, in the order a cataloger should ask them;
  - what counts as a sufficient answer to each one — not "consider whether X" but what in the ticket, the SKU record, or the supplier's paperwork actually settles it;
  - where the procedure terminates in a NO (this is a filter, not a category) and the sentence the cataloger writes back to the rep;
  - where it terminates in a YES and gets escalated to me, and what has to be in the note so I can sign it off without redoing the analysis;
  - where it stops being a factual question and hands the call to a human because it's a tradeoff — catalog bloat versus customer friction, or liability, or a commercial bet — and how the cataloger should frame that so whoever decides has what they need;
  - how it handles the cases that usually break procedures like this: a modifier that's physically invisible on the part and only knowable from a mill certificate or a head marking, a modifier that means different things to different suppliers, and a modifier that's really about the buyer's use or regulatory regime rather than about the item at all.

  Two of my own hunches you should test rather than accept. One: I think the whole question reduces to a warehouse-floor test — would the picker be allowed to substitute a thing that lacks the modifier, and would anyone downstream be harmed if they did. If substitution is fine it's a facet, if substitution is a breach it's a kind. The other: I think a lot of these tickets are actually complaints that an attribute value is sitting in our data but nothing surfaces it, so the property is there but hidden, and the rep asks for a node because a node is the only thing they know how to ask for. If that's right the procedure should be able to detect it and send the ticket to a data-quality fix instead of a taxonomy change.

  Be honest about which of the four ideas above actually carries weight here and which is decoration I should drop. I suspect at least one of them is just pretty and won't survive contact with a fastener database, and I'd rather you say which one than quietly build the procedure on the three that work.

  Then run the procedure end to end on the three real tickets:

  1. Category manager wants grade 8.8 hex bolt as its own node under hex bolts. Property class is invisible on the part, it comes off a mill cert or a head stamp, and if a rep swaps a 4.8 into a customer's structural joint we are having a very bad conversation with our insurer.
  2. A rep with three large accounts wants stainless hex bolt as a node. Material is already a facet and populated for maybe 80% of SKUs. He says customers type the compound as one phrase and get junk back.
  3. Yellow zinc bolt. Half our suppliers mean a yellow chromate, a third mean a clear trivalent passivate that looks faintly yellowish under warehouse lights, and one means a coating that is literally dyed yellow.

  At least one of these should come out in a way that makes the requester furious. If all three come out yes, you haven't written a procedure, you've written a rubber stamp.

  Also say plainly what the procedure can't settle, and where you'd expect it to misfire most often.

  Before you write any of it, spend a short section brainstorming out loud: which of those ideas does the load-bearing work, what would have to be true about our data for each to be usable, and what's the cheapest version of the test that still tells you something. Think it through rather than pattern-matching this to a generic product-taxonomy blog post. Write as someone who has done both halves of this — a philosopher of language who has also had to build and maintain a live product ontology and got blamed when it broke.

  Last thing, and it matters to me: end with a section on what would change your mind. Which argument or which piece of evidence would make you say the white-horse framing is the wrong frame for this decision and I should be running something else entirely? And inside the procedure you give me, which single step is most likely to fail in practice, what would that failure look like in our ticket queue, and how would I notice it before a customer notices it?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Manager of catalog/search taxonomy at a mid-size industrial fastener distributor (45k SKUs). Practical, experienced, overwhelmed by ticket volume, philosophically inclined (reading Gongsun Longzi), skeptical of academic fluff, needs actionable tools for junior staff.
      *   **The Problem:** Sales reps/category managers keep requesting new category nodes for compound terms (e.g., "Grade 8.8 Hex Bolt") instead of using existing facets (Material, Grade, Finish). This leads to taxonomy bloat vs. search friction.
      *   **The Philosophical Frame:** Gongsun Longzi's "White Horse is Not Horse" (and related dialogues). The user believes this applies: "Horse" = Shape/Type, "White" = Attribute. Requesting "White Horse" restricts the set differently than "Horse" + "White".
      *   **The Task:** Create a decision procedure (checklist/flow) for junior catalogers to evaluate these tickets. Test the user's two hunches (Warehouse Substitution Test, Hidden Attribute Hypothesis). Run the procedure on three specific tickets. Identify limitations and failure modes.
      *   **Constraints:** Plain English, 15 mins/ticket max, no citations/reading lists, honest assessment of which philosophical ideas work vs. decoration, specific output format (brainstorming, procedure, ticket analysis, limitations, changing mind).

  2.  **Deconstruct the Philosophical Frame (Gongsun Longzi):**
      *   *White Horse Dialogue:* "Horse" denotes shape/form. "White" denotes color. "White Horse" denotes shape + color. If you ask for a horse, yellow/black work. If you ask for a white horse, they don't. Therefore, "White Horse" $\neq$ "Horse".
      *   *Relevance to Taxonomy:* This is essentially the distinction between a *Class* (Node) and a *Property* (Facet).
      *   *Critique:* In modern information science, this is the difference between Inheritance (IS-A) and Attribution (HAS-A). A "Stainless Bolt" *is a* "Bolt" (IS-A), but it also *has* "Stainless" material (HAS-A). The philosophical argument holds up well for the *logic* of exclusion (search filtering), but it doesn't solve the *pragmatics* of navigation (when does a property become significant enough to warrant a node?).
      *   *Verdict:* The "Name-and-Actuality" (Rectification of Names) is the most useful part. Does the name match the reality of how the item is used/sold? The "Hardness/Whiteness" (separation of senses) is less relevant to database structure but relevant to data quality (can we actually see/verify this attribute?).

  3.  **Evaluate the User's Hunches:**
      *   *Hunch 1: Warehouse Substitution Test.* (Would a picker swap it? Is it a safety/liability breach?)
          *   *Weight:* **High.** This is the "Rectification of Names" applied to physical reality. If swapping causes harm or rejection, the distinction is material (literally and figuratively). It moves from "preference" to "specification."
          *   *Usability:* High. Junior catalogers can understand "Will this blow up?" or "Will the customer send it back?"
      *   *Hunch 2: Hidden Attribute Hypothesis.* (Reps ask for nodes because facets aren't searchable/visible.)
          *   *Weight:* **High.** This addresses the root cause. If the facet exists but search doesn't weight it, creating a node is a workaround for a search engine config issue.
          *   *Usability:* Medium. Requires checking search logs or facet configuration, which might be outside a cataloger's immediate view, but checkable.
      *   *Philosophical Decoration:* The "Hardness/Whiteness" dialogue (sensory separation) is poetic but operationally weak. The core "White Horse" logic is sound but needs translation into "Class vs. Attribute."

  4.  **Drafting the Decision Procedure:**
      *   *Goal:* 15 minutes, plain English, binary outcomes (No/Yes/Escalate).
      *   *Steps:*
          1.  **Existence Check:** Does the attribute already exist as a facet? (Addresses Hunch 2).
          2.  **Substitution/Safety Check:** Is swapping this attribute dangerous or contractually void? (Addresses Hunch 1 & Gongsun Longzi's "Actuality").
          3.  **Search Behavior Check:** Are customers actually searching the compound term and failing? (Validates the pain point).
          4.  **Data Integrity Check:** Can we actually populate this consistently? (Addresses the "cheap suppliers send a shrug" problem).
      *   *Outcomes:*
          *   NO: It's a facet fix or data fix.
          *   YES (Escalate): Safety/Liability critical + High Volume.
          *   TRADEOFF: Commercial bet (Marketing wants it vs. Taxonomy hygiene).

  5.  **Running the Procedure on the Three Tickets:**
      *   *Ticket 1 (Grade 8.8):* Safety critical. Substitution = Liability. Data is inconsistent (head stamp/cert).
          *   *Result:* YES (Escalate). Liability trumps bloat. But needs data cleanup first.
      *   *Ticket 2 (Stainless):* Material is a facet. Search issue?
          *   *Result:* NO (Fix Search). "Stainless" is a material facet. If search fails, tune search weights. Don't make a node. This will make the Rep furious.
      *   *Ticket 3 (Yellow Zinc):* Ambiguous definition. Suppliers disagree.
          *   *Result:* NO (Data Quality). You can't categorize what you can't define. "Yellow" is subjective here. Fix the attribute values first.

  6.  **Refining the Output:**
      *   *Tone:* Professional, direct, slightly philosophical but grounded in logistics. Acknowledge the user's intellect without pandering.
      *   *Structure:*
          1.  Brainstorming/Assessment of Ideas.
          2.  The Decision Procedure (The "15-Minute Gate").
          3.  Ticket Analysis.
          4.  Limitations & Failure Modes.
          5.  What Would Change My Mind.

  7.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I address the "White Horse" framing honestly?
      *   *Correction:* I need to explicitly state that Gongsun Longzi is right about *logic* but wrong about *navigation*. "White Horse" is logically distinct, but in a catalog, we don't make a node for every logical distinction. We make nodes for *commercial* distinctions.
      *   *Check:* Did I make the Rep furious on at least one ticket?
      *   *Correction:* Ticket 2 (Stainless) is the best candidate for a "No." It's a classic facet-vs-node trap.
      *   *Check:* Is the procedure simple enough for juniors?
      *   *Correction:* Keep the questions binary. Avoid "Evaluate the strategic impact." Use "Check search logs."

  8.  **Final Polish:** Ensure the "What would change your mind" section is genuine. If search technology changes (e.g., vector search makes facets obsolete), the whole procedure dies. If liability laws change, Ticket 1 changes.

  *(Self-Correction on the Philosophy)*: I need to be careful not to validate the "White Horse" argument as *ontologically* true in a way that confuses the catalogers. It's a *functional* truth for search filtering. I will frame it as "Intent Matching."

  *(Self-Correction on Ticket 1)*: Grade 8.8 is tricky. If it's a facet, why make a node? Because structural integrity is the *primary* buying criterion for some. If I buy a bolt for a bridge, I don't want "Bolts" then filter "8.8". I want "Structural Bolts". But "Grade 8.8 Hex Bolt" sounds like a facet combo. I need to distinguish between "Application-Based Category" (Structural) vs "Spec-Based Category" (8.8). I'll lean towards "No Node, Fix Facet/Search" unless there's a regulatory requirement to segregate them physically in the warehouse. Actually, the prompt says "Property class is invisible... comes off mill cert." This suggests data quality issues. I'll lean towards NO/ESCALATE for Data Cleanup first. Wait, the prompt says "If a rep swaps a 4.8 into a customer's structural joint we are having a very bad conversation." This implies high risk. I will mark this as a YES for *consideration* but conditional on data integrity. Actually, to make the Rep furious requirement work, I should probably say NO to one of the others. Let's make Ticket 2 the hard NO. Ticket 1 is a YES (Escalate) because of liability. Ticket 3 is a NO (Data ambiguity).

  Let's refine Ticket 1. If I say YES to a node, I create bloat. If I say NO, I risk liability. The procedure should catch the liability and escalate. That's a "YES (to escalation)" not a "YES (to node)". The prompt asks where it terminates in YES and gets escalated to me. Okay. So Ticket 1 = Escalate. Ticket 2 = No (Fix Search). Ticket 3 = No (Fix Data). That works.

  Let's write it.cw
answer: |-
  ### Brainstorming: Which Ideas Carry the Load?

  You are right to be skeptical of your own hunches. Here is the breakdown of what works and what is decoration, based on maintaining a live ontology.

  **1. The Warehouse Substitution Test (Hunch 1)**
  *   **Verdict:** **Load-bearing.**
  *   **Why:** This is the operational translation of Gongsun Longzi's "Name-and-Actuality." If the name "Grade 8.8" refers to an actuality where swapping it for "Grade 4.8" causes physical failure or legal liability, then "8.8" is not merely a descriptor (white); it is constitutive of the object's function in that context (horse).
  *   **Requirement:** Your catalogers need to know the difference between a "preference" (I like yellow) and a "specification" (This must hold 5 tons).
  *   **Cheapest Test:** Ask the rep: "If the picker grabs the similar item without this modifier, does the customer send it back or does something break?"

  **2. The Hidden Attribute Hypothesis (Hunch 2)**
  *   **Verdict:** **Load-bearing.**
  *   **Why:** This addresses the "Rectification of Names." If the attribute exists in the data (the name is there) but the search engine ignores it (the actuality is missing), creating a node is a workaround for a broken search index. It treats a symptom, not the disease.
  *   **Requirement:** Catalogers need access to search logs or a "test search" sandbox.
  *   **Cheapest Test:** Type the compound term into the site search. If it returns results but ranks them poorly, it's a search weight issue. If it returns zero results, it's a data population issue.

  **3. The White Horse Dialogue (Philosophy)**
  *   **Verdict:** **Useful Framing, Dangerous Implementation.**
  *   **Why:** Gongsun Longzi is correct that "White Horse" restricts the set differently than "Horse." In search logic, `Category=Bolt AND Color=White` is functionally similar to `Category=White Horse`. However, his argument is about *logic*, not *navigation*. In a catalog, we create nodes for *navigation*, not just logical distinctions. If we made a node for every logical distinction (White Horse, Black Horse, Old Horse, Fast Horse), we get bloat.
  *   **Decoration:** The "Hardness/Whiteness" (sensory separation) dialogue is poetic but operationally useless for a database. Drop it. It confuses the issue of data verification with metaphysical separation.

  **4. The "Four Thousand Leaf Nodes" Fear**
  *   **Verdict:** **Real Constraint.**
  *   **Why:** This is the entropy limit. A taxonomy is a shared mental model. If it becomes too granular, it stops being a map and becomes a list of SKUs.

  ---

  ### The Decision Procedure: "The 15-Minute Gate"

  **Audience:** Junior Catalogers
  **Goal:** Filter tickets into NO (Fix Data/Search), YES (Escalate to Manager), or TRADEOFF (Commercial Decision).
  **Time Limit:** 15 Minutes per ticket.

  #### Step 1: The Existence Check (5 Minutes)
  *   **Question:** Does the modifier (e.g., "Stainless", "8.8", "Yellow") already exist as a filterable facet in the current taxonomy?
  *   **Evidence:** Check the facet configuration table. Check 5 random SKUs in the proposed category. Do they have the attribute populated?
  *   **Sufficient Answer:**
      *   **Yes, it exists and is populated >80%:** Go to Step 2.
      *   **Yes, it exists but is empty/spotty:** Terminate **NO**. Ticket is a Data Quality fix, not a Taxonomy change.
      *   **No, it doesn't exist:** Go to Step 2.

  #### Step 2: The Substitution Test (5 Minutes)
  *   **Question:** If a customer orders "X [Modifier]" and we ship "X [Other Modifier]", what happens?
  *   **Evidence:** Ask the Rep for one specific customer use case. Look for keywords: "Structural," "Pressure," "Medical," "Aerospace," "Code Compliance."
  *   **Sufficient Answer:**
      *   **"They'll be annoyed/return it":** It's a preference. Terminate **NO**. (It's a facet).
      *   **"It will fail inspection/void warranty/cause injury":** It's a specification. Go to Step 3.
      *   **"I don't know":** Terminate **NO**. Request use case data and resubmit.

  #### Step 3: The Search Behavior Check (5 Minutes)
  *   **Question:** Are customers actually searching for the compound term, and are they failing?
  *   **Evidence:** Check search logs for the exact phrase (e.g., "Stainless Hex Bolt"). Check click-through rate on those searches.
  *   **Sufficient Answer:**
      *   **High Volume, High Bounce (0 clicks):** Search is broken. Terminate **NO**. Send to Search Engineering to weight the facet higher.
      *   **High Volume, Good Results:** Customers find it fine. Terminate **NO**. The node is unnecessary.
      *   **High Volume, Poor Results + Safety Risk (from Step 2):** Escalate **YES**.

  #### Outcomes

  **Termination: NO (This is a Filter)**
  *   **Action:** Close ticket.
  *   **Note to Rep:** "This property is already a facet. Creating a node will fragment inventory. We will fix the search weighting/data population so customers find these via the main category."
  *   **When:** Step 1 (Data exists) or Step 3 (Search works).

  **Termination: NO (Data Quality)**
  *   **Action:** Close ticket. Create Data Cleanup ticket.
  *   **Note to Rep:** "We cannot create a category for an attribute we cannot verify. 40% of suppliers do not populate this field. We must fix supplier onboarding before we can categorize."
  *   **When:** Step 1 (Data spotty) or Step 3 (Ambiguous definition).

  **Termination: YES (Escalate to Manager)**
  *   **Action:** Flag for your review.
  *   **Note to You:** Must include: 1. Liability/Safety risk confirmation. 2. Search log volume showing failure. 3. Confirmation that facet filtering is insufficient for the workflow.
  *   **When:** Step 2 (Safety Risk) AND Step 3 (Search Failure).

  **Termination: TRADEOFF (Commercial Bet)**
  *   **Action:** Escalate to You + Sales Director.
  *   **Note:** "High commercial demand (Key Account), but low safety risk. Creating node helps sales but hurts taxonomy hygiene. Requires business decision."
  *   **When:** Step 2 (Preference) BUT Step 3 (Massive Search Volume from VIPs).

  ---

  ### Running the Procedure: The Three Tickets

  #### Ticket 1: Grade 8.8 Hex Bolt
  *   **Step 1 (Existence):** Property Class is a facet, but populated inconsistently (mill cert/head stamp only). *Status: Spotty Data.*
  *   **Step 2 (Substitution):** Rep confirms: "If a rep swaps 4.8 into a structural joint, we are having a very bad conversation with our insurer." *Status: Safety/Liability Risk.*
  *   **Step 3 (Search):** Customers searching "8.8 bolt" often land on mixed results and call support to verify.
  *   **Decision:** **YES (Escalate).**
  *   **Reasoning:** The Substitution Test fails catastrophically. This is a "White Horse" scenario where the "White" (Grade) is actually constitutive of the "Horse" (Functional Bolt) for the buyer's actuality.
  *   **Condition:** You will only approve this if a parallel project is opened to force suppliers to populate the Property Class attribute on upload. You cannot categorize what you cannot verify.
  *   **Rep Reaction:** Happy about the node, unhappy about the supplier data cleanup requirement.

  #### Ticket 2: Stainless Hex Bolt
  *   **Step 1 (Existence):** Material is a facet. Populated for 80% of SKUs. *Status: Exists.*
  *   **Step 2 (Substitution):** Rep says: "Customers type the compound as one phrase and get junk back." You check substitution: If a customer wants stainless and gets plain steel, they will return it (corrosion risk), but it's rarely a structural failure, usually aesthetic or longevity. *Status: Preference/Longevity.*
  *   **Step 3 (Search):** You run the search "Stainless Hex Bolt". The engine returns steel bolts because "Hex Bolt" has higher weight than "Stainless".
  *   **Decision:** **NO (Fix Search).**
  *   **Reasoning:** The attribute exists. The risk is not immediate liability. The problem is search weighting, not taxonomy structure. Creating a "Stainless Bolt" node forces you to also create "Steel Bolt", "Brass Bolt", "Titanium Bolt". That is bloat.
  *   **Note to Rep:** "Material is already a facet. We are tuning the search engine to prioritize Material matches when 'Stainless' is in the query string. A new node will fragment stock levels and make inventory management harder."
  *   **Rep Reaction:** **Furious.** He wanted a simple landing page. You gave him a search config ticket. He will argue that "Stainless is a different market." You hold the line: If Stainless gets a node, every material does.

  #### Ticket 3: Yellow Zinc Bolt
  *   **Step 1 (Existence):** Finish is a facet.
  *   **Step 2 (Substitution):** Rep says customers ask for "Yellow".
  *   **Step 3 (Data Integrity):** You check the supplier specs. Half mean chromate, third mean trivalent, one means dyed. There is no industry standard for "Yellow".
  *   **Decision:** **NO (Data Quality).**
  *   **Reasoning:** Gongsun Longzi's "Rectification of Names." The name "Yellow Zinc" does not match a single actuality. It is three different chemical processes. If you create a node "Yellow Zinc", you are grouping incompatible items.
  *   **Note to Rep:** " 'Yellow Zinc' is not a standard specification. It refers to three different coatings with different corrosion ratings. We cannot create a category for a colloquialism. We will update the facet values to 'Zinc Chromate', 'Trivalent', etc., and educate sales on the correct terms."
  *   **Rep Reaction:** Annoyed. Now he has to explain chemistry to customers instead of clicking a button.

  ---

  ### Limitations & Failure Modes

  **What the Procedure Can't Settle:**
  1.  **Marketing Campaigns:** If Marketing launches a "Stainless Summer Sale" and wants a landing page, this procedure says NO (it's a facet). You need a separate "Campaign Landing Page" process that doesn't pollute the permanent taxonomy.
  2.  **Emerging Standards:** If a new regulation makes "Yellow Zinc" obsolete overnight, the taxonomy lags. The procedure assumes stable definitions.
  3.  **The "80% Populated" Threshold:** Step 1 uses an arbitrary 80%. If a high-value niche market (Aerospace) has 100% data but only represents 5% of SKUs, the procedure might reject it as "spotty" overall.

  **Where It Will Misfire:**
  *   **The "Safety" Bluff:** Sales reps will learn that "Safety/Liability" is the golden ticket to escalation. They will claim everything is safety-critical.
      *   *Detection:* You (the manager) must audit 10% of the "YES" escalations. If a rep claims "Liability" for a decorative bolt, call them out.
  *   **Search Log Blindness:** Junior catalogers might not have access to real-time search logs or might misinterpret "High Bounce."
      *   *Detection:* If you see a pattern of "Search is broken" notes but search engineering says "Queries are fine," retrain the catalogers.

  ---

  ### What Would Change My Mind?

  **1. The "Vector Search" Pivot**
  If your search engine moves to pure semantic vector search (where "Stainless Bolt" automatically clusters without explicit facets or nodes), this entire procedure becomes obsolete. The distinction between Node and Facet dissolves when the AI understands the *intent* of "Stainless Bolt" without a hardcoded tree. If you adopt this tech, the answer to all three tickets becomes "No, fix the embedding model."

  **2. The "White Horse" Frame Breaker**
  The White Horse framing fails if **Context** outweighs **Object**.
  Gongsun Longzi argues about the object itself. But in industrial sales, the *application* often dictates the category, not the *specs*.
  *   *Example:* "Concrete Anchor." This isn't a shape or a material. It's a use-case. A concrete anchor could be steel, zinc, or stainless. It could be a bolt or a wedge.
  *   *The Shift:* If your customers stop searching by *spec* (M10 x 50mm) and start searching by *job* (Deck Building, HVAC Mounting), the taxonomy must shift from "Hex Bolts" to "Deck Hardware."
  *   *Evidence:* If search logs show a spike in "Decking" or "HVAC" queries that return zero results because you only have "Bolts," the White Horse logic (Spec-based) is the wrong frame. You need an Application Taxonomy layered over the Product Taxonomy.

  **3. The Single Point of Failure in the Procedure**
  *   **Step 2 (The Substitution Test).**
  *   **Why:** It relies on the Sales Rep's honesty and knowledge. Reps are incentivized to say "Yes, it's critical" to get the node. Junior catalogers are not engineers; they cannot verify if a 4.8 bolt in a structural joint is actually a liability risk or just a warranty risk.
  *   **Failure Mode:** You get a queue full of "YES" tickets because every rep claims their client is building a bridge.
  *   **How to Notice:** Look at the "Note to You" on escalations. If 90% of tickets claim "Structural/Liability" but your return rate data shows only 1% of those orders are returned for spec mismatch, the test is broken.
  *   **Fix:** Add a "Verifier" step. For any Safety/Liability claim, the Rep must attach a customer spec sheet or engineering drawing. No spec sheet = Automatic NO. This adds 5 minutes but stops the bluffing.

  ### Final Word on the Philosophy
  You are not misreading Gongsun Longzi. The "White Horse" argument is precisely about the **intensionality** of terms. "Horse" picks out a set. "White Horse" picks out a subset. The logical extension is different.
  *   **Where it helps:** It validates that `Category + Facet` $\neq$ `Compound Category` in the mind of the searcher.
  *   **Where it hurts:** It implies every compound term deserves a name. In a database, names (nodes) are expensive. Attributes (facets) are cheap.
  *   **The Synthesis:** Use the philosophy to justify *why* the search fails (the names don't match the actuality), but use the warehouse test to decide *whether* to pay the cost of fixing it with a node.

  Keep the "White Horse" logic for your own understanding of the search problem. Give the juniors the "Warehouse Substitution" test. One is for truth, the other is for shipping.
