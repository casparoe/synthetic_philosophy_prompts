  Case 1: A thermostat. It acts as if it believes the room is cold when turning on heat. Verdict: No belief. While it meets Clause 1 slightly, it fails Clause 2. Its "belief" (temperature reading) does not interact with other beliefs (e.g., time of day, energy cost) unless explicitly programmed as such. It lacks inferential depth. It is a reflex, not a stance-worthy agent. The design stance (if temp < X, turn on) is vastly superior to guessing its "desires."
  Case 2: A sophisticated NPC that lies to protect a secret location. When asked, it denies the location; when observed helping a friend, it reveals it privately. Verdict: Yes, belief attribution is warranted. This satisfies Clause 2 and 3. The lie is a rational error relative to truth-telling norms but coherent with a higher-order belief (protect friend). The system integrates information about questioner identity and secret value. Unlike the vacuum, its "errors" (lies) are strategically rational, demanding the intentional stance for prediction. You cannot predict the lie via design without simulating the agent's knowledge state.

  Beliefs in pieces
  Belief attribution is granular, not all-or-nothing. Dennett allows subsystems to be intentional if the stance works locally. Your assistant can have beliefs about syntax (predicting its corrections) without having beliefs about arithmetic (where it fails Clause 1 and 3). We attribute beliefs to the "language module" but not the "math module." This mirrors how we treat brain-damaged patients: we might attribute beliefs about faces but not names. The principle applies to the specific input-output channel. If the intentional stance yields predictive compression in domain X but not domain Y, the system has beliefs in X only. This validates your intuition about the assistant without requiring a unified soul.

