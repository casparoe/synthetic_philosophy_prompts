  Maxwell's Demon stood before the Thermodynamics Board, triumphant.

  "I have segregated the hot molecules from the cold without expending work," the Demon announced. "Entropy is decreased. The Second Law is void."

  The Chairperson asked, "And how will you prepare for the next cycle?"

  "I shall erase my memory of the particle velocities," the Demon replied.

  "Have you calculated the energy cost of that erasure?"

  "Forgetting requires no work," the Demon scoffed.

  "On the contrary," said the Chairperson. "Landauer's Principle dictates that erasing information dissipates heat."

  The Demon proceeded to wipe his memory. The room immediately grew hot enough to remix the gases.

  "You see," said the Chairperson, "you didn't break the law."

  "Then what was I?" asked the Demon.

  "You were a heater," said the Chairperson, "who thought ignorance was free."
