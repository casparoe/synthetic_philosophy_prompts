      *   *Hart's Angle:* Hart cares about the Rule of Recognition (what counts as law?). If the PCS is part of the Rule of Recognition, then the act becomes valid. But if the validation depends on a "latent principle" and a "predictive model," is it still a rule? Or is it a moral judgment disguised as law?

