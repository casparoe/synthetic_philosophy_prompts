answer: |-
  ### The Scenario

  Elena is a senior structural engineer reviewing the safety of a bridge she designed ten years ago. New seismic data conclusively proves the load-bearing capacity is now below the legal minimum ($p$). She has verified the calculations herself; they are flawless, and she knows them to be so. However, she also knows her own psychological history: when confronted with evidence that her past work is flawed, her intuitive, dispositional confidence lags behind her intellectual judgment by several weeks—a phenomenon she has documented in herself and disclosed to her firm. She is speaking to the emergency safety board. To ensure they do not rely on her instinctive reactions during the inspection, she says: "The load-bearing capacity is below the minimum, but I don't believe it." She says this to affirm the data while flagging that her gut-level dispositions have not yet updated, making her unreliable for on-site crisis decisions despite her factual accuracy.

  ***

  ### The Analysis

  Here is how the case runs against the three standard families of explanation.

  **1. The Assertion-Side Family (Belief/Knowledge Norms)**
  *   **The View:** Assertion is governed by a norm requiring belief (or knowledge). To assert $p$ is to represent oneself as believing $p$.
  *   **Verdict:** **Improper-but-excusable.**
  *   **Reasoning:** On this view, Elena violates the norm of assertion by asserting the first conjunct without the requisite belief state. Ordinarily, this makes the assertion defective. However, your scenario builds in a higher-order normative pressure: the duty to warn the board about her dispositional lag. The assertion-side theorist must concede that while the utterance violates the constitutive norm of assertion, it is overridden by a moral or professional obligation to disclose her doxastic state. The utterance remains "improper" qua assertion, but "right" qua professional conduct.

  **2. Shoemaker's Linking Principle**
  *   **The View:** The absurdity of Moorean sentences originates at the level of belief. It is irrational to believe ($p$ and I don't believe $p$). Since assertion aims to express belief, the absurdity transfers to speech.
  *   **Verdict:** **Absurd.**
  *   **Reasoning:** Shoemaker's account relies on the idea that self-ascriptions of belief are transparent to the first-order facts. If Elena judges that $p$ is true (based on the evidence), she *must* believe $p$. For her to claim she doesn't believe $p$ implies a failure of self-knowledge or a contradiction in her doxastic state. Shoemaker would argue Elena is simply mistaken about her own mind: if she genuinely judges the data conclusive, she *does* believe the capacity is low, and her claim otherwise is a confusion about what "belief" means. The scenario's claim that she is "well-informed" and "mentally healthy" is rejected by this view; she is rationalizing a split that shouldn't exist.

  **3. Rosenthal's Higher-Order Thought (HOT) Account**
  *   **The View:** There is no intrinsic irrationality in the belief state itself. The problem is pragmatic. A speaker can have a first-order state (evidence/judgment) without the higher-order thought that constitutes conscious belief.
  *   **Verdict:** **Perfectly fine.**
  *   **Reasoning:** This account fits your build perfectly. Elena has the first-order evidence for $p$ (the calculations) but lacks the Higher-Order Thought that would integrate this into a conscious, dispositional belief state ("I *feel* that $p$"). Since the weirdness is not in the belief state but in the pragmatic expectations of conversation, her explanation resolves it. She is informing the listeners why her HOTs don't match her first-order judgments. The utterance is informative, sincere, and rational.

  ***

  ### The Design Mechanics

  **The Single Feature Doing the Work:**
  The **Institutional Duty to Disclose Doxastic Reliability**.
  The scenario works only because the second conjunct ("I don't believe it") serves a critical functional role: it recuses her intuitive judgment from the safety protocol. It transforms the Moorean sentence from a confession of irrationality into a tool of risk management.

  **If You Delete It:**
  If you remove the safety board context and have her say this to a friend at dinner, the verdicts shift. The Assertion-Side view calls it simply improper (no overriding duty). Shoemaker calls it absurd (self-ignorance). Rosenthal calls it odd but possible. Without the normative pressure to disclose the lag, the utterance collapses into the standard "unremarkable" Moorean weirdness that the reading group already knows. It becomes a mere curiosity rather than a justified speech act.

  **The Best Counterattack:**
  The strongest counter comes from the **Assertion-Side Family**, specifically the move that **she wasn't really asserting the first conjunct at all.**
  *   **The Attack:** When Elena says, "The load-bearing capacity is below the minimum," she is not asserting this as a personal belief. She is *reporting* the conclusion of the calculations. She is effectively saying, "The data indicates $p$." Therefore, she is not violating the belief norm of assertion because she isn't making a standard assertion; she is offering evidence.
  *   **Does it Land?** It lands partially, but it risks violating your ban on "sliding between believing and mere acceptance." If she is only reporting data, she isn't committing to the truth of $p$ in the way required for the Moorean paradox to bite. However, your scenario specifies she "knows them to be so." If she knows $p$, she asserts $p$. The counterattack tries to downgrade her knowledge to mere reporting to save the norm. It weakens the case by suggesting she isn't truly endorsing $p$, which undermines the "sincerely and correctly utters" constraint.

  ***

  ### Honest Note on Constraint Satisfiability

  Your constraints are **jointly satisfiable**, but only if your reading group is willing to loosen the definition of **Sincerity**.

  The tension lies between these three claims:
  1.  She sincerely asserts $p$.
  2.  She does not believe $p$.
  3.  Sincere assertion requires belief (Standard Gricean/Stalnakerian view).

  If your group holds (3) as a fixed background truth, the case is impossible. For the scenario to work as described—where she is "mentally healthy" and "right" to speak—you must allow that **sincere assertion can be driven by conclusive evidence/judgment even when dispositional belief is absent.**

  If you must drop one constraint to save the others, drop the ban on **"sliding between believing and mere acceptance-as-a-premise."**
  *   **What you lose:** You lose the philosophical purity of the "belief" concept. You effectively admit that Elena *accepts* $p$ as true (for the purposes of action/argument) but does not *believe* $p$ (in the dispositional sense).
  *   **Why drop it:** This is the only way to satisfy the "Assertion-Side" theorists without calling Elena irrational. It allows you to say she asserts $p$ on the basis of *acceptance*, while truthfully denying *belief*. If you keep the ban, you force the group to choose between calling her irrational (Shoemaker) or redefining assertion (Rosenthal). Dropping the ban lets you keep the standard definitions of assertion and belief, at the cost of introducing a distinction your group might find tedious.

  Given your goal is to break pattern-matching, I recommend keeping the ban. It forces the Assertion-Side theorists to confront the possibility that their norm is too rigid for high-stakes professional contexts, which is exactly the friction you want in the room.
