answer: |-
  1. **Short answer**
  There is no single, canonical term that captures exactly this dynamic, though the tool you are describing is widely known as an **Intuition Pump**. The specific phenomenon you are noticing—where people argue over the concrete details rather than the underlying principle—is most accurately described in cognitive science as **fixating on surface features**, but in philosophy, it remains largely unnamed as a distinct fallacy.

  2. **Closest existing terms**
  **Intuition Pump (Daniel Dennett):** This is the standard term for the tool itself. Dennett describes thought experiments as devices designed to "pump" an intuition out of you to support a conclusion. He explicitly warns that bad intuition pumps can be "loaded" with hidden assumptions or distracting details. However, "Intuition Pump" names the device, not the specific error you are identifying (the audience treating the psychological trigger as a logical variable). It fits the mechanism but not the misuse you are observing.

  **Surface Features vs. Deep Structure (Cognitive Science):** In studies of expertise (e.g., physics problem-solving), novices categorize problems by "surface features" (e.g., "this involves a pulley"), while experts categorize by "deep structure" (e.g., "this involves conservation of energy"). Your observation matches this perfectly: laypeople argue about the train vs. the bus (surface), while the philosopher cares about the sacrifice of one for many (deep structure). However, this term comes from education psychology, not philosophical argumentation, so it lacks the normative weight of a fallacy.

  **The Fallacy of Misplaced Concreteness (Alfred North Whitehead):** This warns against treating abstract concepts as if they were concrete physical entities. Your observation is nearly the inverse: people are treating concrete entities (the train, the planks) as if they carry the weight of abstract principles. While it captures the confusion between the concrete and the abstract, it doesn't quite capture the *rhetorical* function of the details acting as a smokescreen.

  3. **What I actually keep seeing**
  The phenomenon is a **structural mismatch between the psychological function and the perceived logical function of narrative details**. In a well-formed thought experiment, concrete details (the train, the lever, the planks) serve a *psychological* role: they make the abstract principle vivid enough to trigger an intuitive response. However, in the discourse surrounding them, these details are treated as having a *logical* role: variables that determine the validity of the conclusion. The error lies in believing that changing the concrete shell (train to bus) changes the abstract nut (the moral principle), when the shell was only ever there to make the nut visible. The concreteness is not a premise; it is a delivery mechanism, but it is being debated as if it were a premise.

  4. **Where it stops**
  This description stops applying when the concrete details *are* actually load-bearing. In some ethical frameworks, the method of killing (pulling a lever vs. shoving a person) is morally relevant, not just psychologically vivid; in those cases, arguing about the details is valid because the "surface feature" is part of the "deep structure." It also stops applying when the thought experiment is not meant to be generalizable—for instance, if a scenario is designed to test a specific edge case where the number of people (5 vs. 500) actually breaks the principle being tested. If the detail changes the outcome legitimately, it is not a decoy; it is a variable.

  5. **A name, if it needs one**
  Since there is no established term, I propose calling this **The Concrete Decoy**.

  **Definition:** The Concrete Decoy occurs when specific narrative details in a thought experiment serve solely to evoke an intuitive response (psychological function) but are mistakenly treated by participants as logically relevant variables that determine the argument's validity (argumentative function). The details "decoy" the argument away from the abstract principle and into a debate about the scenario's specific physics or circumstances, which were never intended to be the locus of contention.
