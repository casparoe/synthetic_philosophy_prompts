          *   *CT Prediction:* Swapping to "NATO values" or "Allied values" changes nothing substantive; "Western" is just code for alliance.
          *   *My Commitment:* TR is closer. "Western" carries historical baggage (Enlightenment, Christendom) that "NATO" (military) or "Liberal" (ideological) doesn't fully capture.
