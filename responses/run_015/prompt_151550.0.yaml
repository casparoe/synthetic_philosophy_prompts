answer: |-
  Here is a mapping of the desiderata for a robust Lexical-Threshold Negative Utilitarianism (LTNU), structured for a doctoral-level overview.

  ### Core Desiderata for LTNU

  1.  **Non-Arbitrary Threshold Specification**
      *   **Requirement:** The theory must define the threshold of suffering (where lexical priority kicks in) without relying on ad hoc stipulations.
      *   **Reasoning:** If the threshold is arbitrary (e.g., "pain level 7.0001"), the theory succumbs to sorites paradoxes. It needs a qualitative marker (e.g., "suffering that destroys agency" or "neurological overload") to justify the discontinuity in value.

  2.  **Intra-Domain Commensurability (Below Threshold)**
      *   **Requirement:** Suffering *below* the threshold must be cardinally measurable and aggregable.
      *   **Reasoning:** To avoid the "Weak Sadistic Conclusion" (where adding many lives with mild pain is worse than one life with severe pain), the theory must be able to sum sub-threshold disvalue. If you cannot compare two sub-threshold pains, you cannot make trade-offs, and the view collapses into strict lexicality for *all* pain.

  3.  **Inter-Domain Incommensurability (Across Threshold)**
      *   **Requirement:** No amount of sub-threshold suffering (or positive pleasure) can lexically outweigh a single instance of supra-threshold suffering.
      *   **Reasoning:** This is the defining feature of LTNU. It prevents the "Standard NU Conclusion" (destroying the world to prevent a minor headache). It establishes a lexical ordering where $V(\text{Severe Pain}) < V(\text{Any amount of Mild Pain})$.

  4.  **Psychological/Biological Plausibility**
      *   **Requirement:** The threshold must map to a plausible phenomenological or biological discontinuity (e.g., the difference between nociceptive pain and suffering that induces psychological disintegration).
      *   **Reasoning:** Value theory should not float free of the metaphysics of mind. If the threshold doesn't correspond to a real difference in kind (not just degree) of experience, the lexical priority lacks ontological grounding.

  5.  **Positive Value Accommodation**
      *   **Requirement:** The theory must account for positive goods (pleasure, meaning) without allowing them to trade off against supra-threshold suffering.
      *   **Reasoning:** Pure NU is often rejected for implying that a world with no sentient life is better than a world with happy people. LTNU aims to avoid this misanthropy. Positive value must exist but remain lexically inferior to severe negative value.

  ---

  ### Specific Structural Questions

  **1. Commensurability: Solve or Bracket?**
  It must **bracket commensurability across the threshold** but **solve it within the sub-threshold domain**.
  *   *Reasoning:* If you solve commensurability globally (i.e., there is a conversion rate between severe pain and mild pleasure), you collapse into standard utilitarianism. The lexical move *requires* a failure of the Archimedean axiom across the divide. However, below the threshold, you need a common currency to aggregate mild sufferings; otherwise, you cannot resolve cases involving many people with mild pain vs. few people with moderate pain.

  **2. Distributive vs. Aggregate Near the Threshold**
  The theory must prioritize **individual thresholds over aggregate sums** near the boundary.
  *   *Reasoning:* If the threshold is aggregate (e.g., "total suffering in the world exceeds X"), you risk justifying severe torture of one individual to prevent widespread mild discomfort (a utilitarian sacrifice). LTNU typically requires the threshold to be indexed to individual experiences to maintain deontological constraints against violating individuals for the greater good.

  **3. Positive Goods without Breaking Lexical Priority**
  Yes, it can allow positive goods via **Lexicographic Vector Ordering**.
  *   *Mechanism:* Represent value as a vector $(S_{severe}, S_{mild}, P)$. Comparison is done dimension by dimension. $P$ (pleasure) is only consulted if $S_{severe}$ is equal.
  *   *Reasoning:* This allows pleasure to break ties in worlds with equal severe suffering, or to matter in worlds with *no* severe suffering, without ever permitting pleasure to "buy off" severe pain.

  ---

  ### Jointly Unsatisfiable Desiderata

  You flagged a tension between *incommensurability above* and *comparability below*. Technically, that pair is **satisfiable** (lexicographic ordering handles this easily).

  The actual **jointly unsatisfiable pair** is:
  **[Strong Lexical Priority] + [Continuity of Value]**

  *   **The Conflict:** If value is continuous (a tiny change in pain intensity creates only a tiny change in disvalue), you cannot have a lexical threshold. If $A$ is lexically worse than $B$, there is no sequence of $B$'s that outweighs $A$. But if value is continuous, you can construct a sequence of $B$'s approaching $A$ that must eventually surpass it (the Archimedean property).
  *   **The Consequence:** LTNU must accept a **discontinuity** (a "cliff" in value space). This creates the "Boundary Problem": Why is pain at 9.99 fundamentally different from 10.0? If you smooth the boundary to fix this, you lose lexicality. If you keep the boundary, you accept arbitrariness.

  ---

  ### Brief Scorecard

  | Theory | Handles Severe Pain Priority? | Handles Mild Pain Aggregation? | Avoids Misanthropy (Positive Value)? | Continuity/Boundary Issue |
  | :--- | :--- | :--- | :--- | :--- |
  | **Standard NU** | Yes (Too well) | No (Leads to "Destroy World") | No (Positive value is null) | Continuous (Vulnerable to Repugnant Conclusion) |
  | **Strict Lexical NU** | Yes | No (Mild pain often ignored or non-aggregable) | Difficult (Risk of lexical override) | **High Discontinuity** (The "Cliff") |
  | **Graded-Lexical (e.g., Ord)** | Yes | Yes (Via weighting functions) | Yes (Lexically inferior) | **Moderate** (Attempts to smooth the cliff, risks collapsing into Standard NU) |

  ---

  ### Confidence & Uncertainty

  **Confidence Level:** High (85-90%) regarding the formal axiological constraints. These structural tensions (Archimedean vs. Lexical) are well-established in formal population ethics.

  **Least Sure Point:** The **Psychological/Biological Plausibility** desideratum.
  *   *Reasoning:* I am less confident in the claim that there *is* a clear phenomenological discontinuity that maps neatly to a lexical threshold. Neuroscience suggests pain scales are largely continuous (recruitment of nerve fibers, etc.). If the "threshold" is socially constructed rather than biologically real, the ontological grounding of LTNU weakens significantly. This is an empirical bet that value theorists often make without sufficient consultation of empirical pain research.

  **Note on your Intuition:** Your intuition about the tension between sub-threshold comparability and supra-threshold incommensurability was directionally correct, even if formally satisfiable. The tension manifests as the difficulty in justifying *why* the switch flips at that specific point without making the two domains seem secretly commensurable. Ord's work attempts to address this by using a "soft" lexicality or weighted views, but that invites the collapse problem noted in the scorecard.
