answer: |-
  # Classification Tree: Occasionalism and Secondary Causation

  ### **Root Node**
  **Claim:** Created substances possess intrinsic dispositional powers that contribute to the production of effects.
  *   **Yes:** (Proceed to **Branch E**)
  *   **No:** (Proceed to **Branch A**)

  ---

  ### **Branch A (Scope of Divine Agency)**
  *Condition: Answer to Root was **No**.*
  **Claim:** Divine agency is the sole cause of all events, including mental volitions, logical entailments, and physical interactions.
  *   **Yes (Global Occasionalism):** (Proceed to **Branch B**)
  *   **No (Restricted Occasionalism):** (Proceed to **Branch D**)

  ---

  ### **Branch B (Explanation of Regularity)**
  *Condition: Answer to Branch A was **Yes**.*
  **Claim:** Natural regularity is explained by a divinely instituted habit or general volition that carries its own modal force, rather than by ad hoc intervention.
  *   **Yes (Divine Habit):** (Proceed to **Branch C**)
  *   **No (Direct Recreation):** (Proceed to **Leaf 3**)

  ---

  ### **Branch C (Quantum Compatibility)**
  *Condition: Answer to Branch B was **Yes**.*
  **Claim:** Probabilistic laws in quantum mechanics reflect an ontic indeterminacy that is compatible with the occasionalist framework of divine habit.
  *   **Yes:** (Proceed to **Leaf 1**)
  *   **No:** (Proceed to **Leaf 2**)

  ---

  ### **Branch D (Domain of Created Causation)**
  *Condition: Answer to Branch A was **No**.*
  **Claim:** Created substances possess causal powers exclusively in the mental domain, while physical events remain occasionally caused.
  *   **Yes (Mental Powers Only):** (Proceed to **Leaf 4**)
  *   **No (Physical Powers Only):** (Proceed to **Leaf 5**)
      *(Note: This node bifurcates Restricted Occasionalism into the two most plausible hybrid domains.)*

  ---

  ### **Branch E (Quantum Realism in Secondary Causation)**
  *Condition: Answer to Root was **Yes**.*
  **Claim:** Probabilistic laws in quantum mechanics reflect an ontic indeterminacy grounded in the dispositional powers of created substances.
  *   **Yes:** (Proceed to **Leaf 6**)
  *   **No:** (Proceed to **Leaf 7**)
      *(Note: Included to ensure sufficient coverage of the Secondary Causation space.)*

  ---

  ### **Terminal Leaves**

  #### **Leaf 1: Quantum-Compatible Habitual Occasionalism**
  *   **Path:** No Powers → Global → Divine Habit → QM Compatible.
  *   **Position Name:** **Unnamed** (Theoretically possible contemporary synthesis).
  *   **Most Awkward Commitment:** Must explain how God maintains a consistent "habit" of willing statistically random outcomes without implying caprice or a lack of specific knowledge regarding individual quantum events.
  *   **Status:** **Logically coherent but apparently unoccupied.** (Historical defenders of Habitual Occasionalism predate quantum mechanics; modern occasionalists tend toward recreation).

  #### **Leaf 2: Classical Habitual Occasionalism**
  *   **Path:** No Powers → Global → Divine Habit → QM Incompatible.
  *   **Position Name:** **Malebranchean Occasionalism** (Nicolas Malebranche).
  *   **Most Awkward Commitment:** Must explain why a perfect God chooses to act via general volitions (habits) that permit natural defects or "monsters," rather than intervening particularly to ensure optimal outcomes in every instance.
  *   **Status:** Occupied.

  #### **Leaf 3: Atomist Recreational Occasionalism**
  *   **Path:** No Powers → Global → Direct Recreation.
  *   **Position Name:** **Ashʿarite Occasionalism** (Al-Ghazālī, Al-Juwaynī).
  *   **Most Awkward Commitment:** Must explain the continuity of personal identity and memory across discrete moments of time if the self is annihilated and recreated at every instant with no intrinsic connection between temporal stages.
  *   **Status:** Occupied.
  *   **Indistinguishable Positions:** **Al-Ghazālī** and **Al-Juwaynī** share this path; this tree cannot separate them as both deny powers, assert global divine causality, and rely on discrete recreation rather than modal habits.

  #### **Leaf 4: Mental-Interactionist Occasionalism**
  *   **Path:** No Powers → Restricted → Mental Powers Only.
  *   **Position Name:** **Unnamed** (Hybrid Dualism).
  *   **Most Awkward Commitment:** Must explain the mechanism by which a mental substance with intrinsic power moves a physical body that lacks all causal power, without violating the conservation of energy or positing a causal bridge that the physical domain supposedly lacks.
  *   **Status:** **Logically coherent but apparently unoccupied.** (Most interactionists grant powers to both; most occasionalists deny powers to both).

  #### **Leaf 5: Physical-Epiphenomenalist Occasionalism**
  *   **Path:** No Powers → Restricted → Physical Powers Only.
  *   **Position Name:** **Epiphenomenalism** (T.H. Huxley, though typically naturalistic, fits the causal structure).
  *   **Most Awkward Commitment:** Must explain the evolutionary persistence of consciousness if it is causally inert and produces no behavioral effects that would aid survival.
  *   **Status:** Occupied (in naturalistic forms; theistic versions are rare).

  #### **Leaf 6: Indeterministic Causal Realism**
  *   **Path:** Yes Powers → QM Compatible.
  *   **Position Name:** **Propensity Realism** (Karl Popper, Alfred Landé).
  *   **Most Awkward Commitment:** Must explain how created substances can possess the power to generate truly random outcomes without that randomness undermining the explanatory reliability of scientific laws or divine foreknowledge (if theistic).
  *   **Status:** Occupied.

  #### **Leaf 7: Deterministic Causal Realism**
  *   **Path:** Yes Powers → QM Incompatible.
  *   **Position Name:** **Classical Theistic Realism** (Thomas Aquinas, neo-Aristotelians).
  *   **Most Awkward Commitment:** Must explain away the empirical success of quantum mechanics as merely epistemic, maintaining that all apparent indeterminacy is actually hidden determinism grounded in created natures.
  *   **Status:** Occupied.

  ---

  ### **Analysis of Tree Structure**

  **Logically Coherent but Unoccupied Positions:**
  1.  **Leaf 1 (Quantum-Compatible Habitual Occasionalism):** While Malebranche established the "Divine Habit" framework, he did so in a Newtonian context. A modern occasionalist who adopts general volitions but accepts ontic quantum randomness would occupy this leaf. Currently, modern occasionalists (e.g., Arnold Malebranchean interpreters or Islamic neo-occasionalists) tend to prefer the "Direct Recreation" model to accommodate quantum indeterminacy, leaving the "Habit + QM" combination empty.
  2.  **Leaf 4 (Mental-Interactionist Occasionalism):** This position grants causal power only to the mind while treating the physical world as occasionally caused. While Interactionist Dualism exists, it typically grants powers to physical substances as well (to receive causation). A view where the physical world is purely passive even in its reactions to the mind is logically possible but lacks defenders.

  **Indistinguishable Named Positions:**
  *   **Al-Ghazālī and Al-Juwaynī:** Both fall into **Leaf 3**. They both deny intrinsic powers, assert global divine causality, and rely on the atomist doctrine of direct recreation (no intermediate modal habits). This tree classifies them identically because it does not branch on theological nuances regarding divine attributes or specific atomist physics (e.g., the nature of the void) which distinguish their broader systems.
  *   **Malebranche and La Forge:** Both fall into **Leaf 2**. Both argue for global occasionalism grounded in God's general volitions (habits) rather than constant particular re-creation. The tree cannot separate them as it does not query the specific theological motivation (e.g., simplicity of divine action vs. nature of ideas).
