      *   *Claim 2:* The thought experiment (Black, Jones, Chip, Senator) works as described.
      *   *Claim 3:* PAP (Principle of Alternative Possibilities) is dead.
      *   *Claim 4:* This kills the last real argument for libertarian free will.
