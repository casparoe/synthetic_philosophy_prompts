answer: |-
  Here is a complete lesson plan for "The Ontological Ledger." It's designed to be printed out or projected, with minimal prep beyond cutting some cards.

  ### **Activity: The Ontological Ledger**
  **Time:** 90 Minutes
  **Students:** 10 Grad Students
  **Goal:** Experience Bradley's Regress via relational instantiation without naming it until the debrief.

  ---

  ### **1. Prep & Materials (10 mins before class)**
  *   **Scenario Cards (10 total):** Simple relational claims.
      *   *Examples:* "Cup A is left of Cup B," "Alice is taller than Bob," "Event X caused Event Y."
      *   *Make them physical:* Index cards.
  *   **Universal Labels (5 total):** Blank cards they can write on (e.g., `LEFT_OF`, `TALLER_THAN`).
  *   **Nexus Chips (30 total):** Poker chips, coins, or small sticky notes. These represent the "tie" or "instantiation" relation.
  *   **The Ledger (Whiteboard):** Two columns: "Grounded States" and "Ontological Cost."
  *   **Role Cards (10 total):**
      *   **6 Archivists:** "Your goal is to maximize Grounded States."
      *   **4 Auditors:** "Your goal is to minimize Ontological Cost."
      *   *Note:* Do not let them show these cards to each other.

  ---

  ### **2. The Setup (10 mins)**
  **The Pitch:**
  "Welcome to the Department of Ontology. We have a backlog of facts (Scenario Cards) that need to be cataloged into reality. Your job is to build a 'State of Affairs' for each card on the table."

  **The Rules of Construction:**
  1.  **The Separation Rule:** A Universal Label (e.g., `LEFT_OF`) cannot physically touch an Object (e.g., `Cup A`). In reality, a universal doesn't glue itself to a particular.
  2.  **The Nexus Requirement:** To connect a Universal to an Object, you must place a **Nexus Chip** between them.
  3.  **The Homogeneity Rule:** A Nexus Chip is itself a relational entity. Therefore, it cannot touch an Object or Universal directly. It must be connected by *another* Nexus Chip.
      *   *(Wait, don't explain Rule 3 yet. Let them hit it.)*
  4.  **Validation:** A Scenario is only "Grounded" (points awarded) if the construction follows the rules.

  **Scoring (Public):**
  *   **Group Pool:** +10 points per Grounded Scenario.
  *   **Cost:** -1 point per Nexus Chip used.
  *   **Final Score:** Group Pool minus Cost. (Tell them a high score gets "tenure," a low score gets "defunded." Keep it vague.)

  **Secret Scoring (On Role Cards):**
  *   **Archivists:** Get +5 bonus points for every Grounded Scenario. (They want to finish the job).
  *   **Auditors:** Lose -5 points for every 5 Nexus Chips used. (They want to stop the spending).

  ---

  ### **3. Phase 1: The Naive Realist Sort (20 mins)**
  *   Dump the 10 Scenario Cards in the middle.
  *   Ask them to group the scenarios by relation type using the **Universal Labels**.
  *   *Expected Move:* They write `LEFT_OF` on a card and place it next to the "Cup A / Cup B" card.
  *   **Intervention:** Stop them. "Wait. Rule 1. The Universal `LEFT_OF` is touching `Cup A`. That's a category mistake. Universals don't stick. Insert a Nexus Chip."
  *   They place one chip between `Cup A` and `LEFT_OF`.
  *   **Intervention:** "Okay, but what connects the Chip to the Cup? The Chip is a relational tie. It's not part of the Cup. It needs a connector."
  *   *This is the trigger.* They must place a second chip to connect the first chip to the Cup.
  *   **Intervention:** "And what connects the second chip to the first?"

  **Facilitator Note:** Be polite but robotic. You are the "Rules of Metaphysics." Do not explain *why*, just enforce the Separation Rule. If they ask "When does it stop?", say "When the connection is secure."

  ---

  ### **4. Phase 2: The Regress Wall (30 mins)**
  By now, the Archivists will be frantically placing chips to try to "secure" the connection to get their Grounded points. The Auditors will be visibly sweating as the Ontological Cost rises.

  *   **The Crisis:** They will run out of Nexus Chips (you only gave them 30).
  *   **The Conflict:** Archivists will demand more chips to finish the grounding. Auditors will argue that the current structure is "good enough" or that they should abandon the scenario.
  *   **The Discovery:** Someone will realize that for every chip they add to solve the connection problem, they create *two* new connection problems (one on each side of the chip).
  *   **The Halt:** Stop the game when they either run out of chips or someone explicitly says, "We need infinite chips to finish this."

  **Freeze the Board.** Do not let them clean up. Take a photo of the mess.

  ---

  ### **5. Debrief & Mapping (30 mins)**
  Gather around the whiteboard. Reveal the hidden roles and scoring (usually, both teams fail, or the Auditors win by sabotage).

  **Step 1: The Reveal (5 mins)**
  *   Ask: "What was the Nexus Chip?"
  *   Answer: It was the instantiation relation (the 'tie').
  *   Ask: "Why did you need more chips?"
  *   Answer: Because the tie itself needed tying.
  *   **Name Drop:** This is **Bradley's Regress**. F.H. Bradley argued that if you treat relations as entities distinct from their terms, you need a further relation to relate them, ad infinitum.

  **Step 2: Mapping the Responses (15 mins)**
  Ask the students how they *would* have won, given the rules. Map their solutions to historical positions:

  *   **The "Stop Early" Move (Nominalism):**
      *   *Student Idea:* "We shouldn't have used the `LEFT_OF` card at all. Just leave the Cups."
      *   *Philosophy:* Resemblance Nominalism. There is no Universal `LEFT_OF`. There are just the pairs. We group them because they resemble each other, not because they share an entity.
      *   *Cost:* 0 Nexus Chips. High Auditor score, low Archivist score (no "Grounding").

  *   **The "Particular Tie" Move (Trope Theory):**
      *   *Student Idea:* "The chip isn't a universal. It's specific to *this* Cup and *this* Universal."
      *   *Philosophy:* Trope Theory. The relation is a particularized property (a trope). It doesn't need a further universal to connect it because it's inherently the tie *for this specific state of affairs*.
      *   *Cost:* Stops the regress at step 1.

  *   **The "Brute Fact" Move (State-of-Affairs Realism / Armstrong):**
      *   *Student Idea:* "The first chip just sticks. It's non-merological."
      *   *Philosophy:* Aristotelian Realism. The instantiation is not a further relation; it's the "ontological glue" that doesn't itself need gluing.
      *   *Problem:* This violates Rule 1 (Separation). You have to argue the rules of the game were rigged against this view.

  **Step 3: The Limitation of the Game (10 mins)**
  *   **The Honest Note:** "The cards lied to you."
  *   In the game, the Nexus Chip was a *third object* placed between two others. This models the relation as a **relatum** (a third thing).
  *   **State-of-Affairs Realism** (like Armstrong) argues that a fact ($aRb$) is a fundamental unity. The particular and the universal are not two things glued together; they are mutually dependent moments of one state.
  *   **Why the game fails here:** You cannot physically represent "non-merological composition" with index cards. Cards are always distinct. To represent Armstrong's view, you'd have to tape the Cup and the Universal together so they can't be separated without tearing.
  *   **Takeaway:** The game forces a **Relational Realism** (relations as entities), which is the easiest target for Bradley. It makes it hard to defend the view that instantiation is *sui generis*.

  ---

  ### **6. Predictable Failure Points (Troubleshooting)**
  1.  **The "Brute Fact" Rebellion:** A smart student might refuse to place the second chip, saying "The first one is brute."
      *   *Fix:* Acknowledge this is a valid philosophical move (Primitivism). Tell them: "For the sake of the simulation, the Department requires all ties to be explicit entities. If you go brute, you get an 'Audit Flag' (lose 10 points)." This forces them into the regress.
  2.  **Auditor Sabotage:** Auditors might realize too early that staying silent wins them points. They might just say "No" to everything.
      *   *Fix:* Remind them that if *zero* scenarios are grounded, the Department closes and *everyone* gets zero. They need cooperation to survive.
  3.  **Time Creep:** Phase 2 can drag on.
      *   *Fix:* At the 60-minute mark, announce "Grant Funding is expiring in 5 minutes." Force the crisis.

  ### **7. Syllabus Blurb (Optional)**
  *If you want to put this in the syllabus description:*
  > **Session 4: The Regress of Relations.** We will engage in a simulated ontological cataloging exercise to test the coherence of relational realism. Please bring a willingness to be frustrated by infinite chains. No prior reading on F.H. Bradley required; the experience will precede the theory.

  ---

  ### **Why This Works**
  *   **Embodied Cognition:** They physically run out of "ontology" (chips).
  *   **Conflict:** The hidden roles force the Realists (Archivists) to defend the expenditure and the Nominalists (Auditors) to attack it, mirroring the dialectic.
  *   **No Jargon:** They discover the problem before they have the name for it, which makes the subsequent reading stickier.
  *   **Relational Focus:** By using "left of" and "taller than," you avoid the easy trap of thinking properties are just "in" the object. Relations clearly look like "bridges," making the need for a "tie" more intuitive, and the regress more vicious.
