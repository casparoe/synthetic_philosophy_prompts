      *   *The Boundary:* The boundary isn't about purity of truth-tracking. It's about the *complexity* and *autonomy* of the system's response to information. A thermostat is too simple. Meridian is complex. The boundary is where the system's behavior becomes too noisy or opaque to be captured by belief/desire attribution better than by physical/design stance. But Meridian seems to qualify.
