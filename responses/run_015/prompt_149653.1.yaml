      *   *Transparency doesn't dissolve the stance:* Knowing *why* a human believes something (e.g., cognitive bias, social pressure) doesn't stop us from attributing the belief to predict their behavior. Knowing the mechanism of Meridian doesn't change the utility of the prediction.
