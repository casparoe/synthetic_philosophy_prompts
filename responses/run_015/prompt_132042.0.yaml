answer: |-
  You are not seeing ghosts. You have independently rediscovered the central, unresolved tension in the philosophy of spacetime physics.

  There is no single, catchy colloquial phrase for the *entire* historical cycle (like "The Gell-Mann Amnesia Effect"), but philosophers of physics have precise names for every stage of the loop you described. The "loop" itself is formally known as **The Substantivalism-Relationism Debate**, and the specific "smuggling back in" move you identified is the subject of **The Hole Argument**.

  Here is the carving you asked for: the vocabulary to name the moves, the distinction between this and normal theory refinement, and the boundary lines.

  ### 1. The Vocabulary of the Loop

  You can map the pattern you observed directly onto the standard philosophical taxonomy:

  *   **Step 1 (Newton's Bucket):** **Classical Substantivalism.** Space is a "substance" that exists independently of objects.
  *   **Step 2 (Mach's Critique):** **Relationism.** Space is nothing over and above the spatial relations between material bodies. Inertia is caused by the distribution of mass in the universe (Mach's Principle).
  *   **Step 3 (Isolated Deceleration):** **The Vacuum Objection.** If the universe is empty, relationism cannot account for inertia (because there are no relations), yet physics still predicts inertial effects. This breaks strict relationism.
  *   **Step 4 (GR/Metric Field):** **Metric Field Substantivalism (or Geometric Object Realism).** In General Relativity (GR), spacetime is represented by the metric field ($g_{\mu\nu}$). It is dynamical (it interacts with matter), unlike Newton's rigid space, but it can exist without matter (vacuum solutions), unlike Mach's relations.
  *   **Step 5 (Your "Smuggling" Intuition):** **The Hole Argument.** This is the specific term you need. In 1987, philosophers John Earman and John Norton formalized your exact intuition. They argued that if you treat the metric field as a real physical object (substantivalism), GR leads to absurd indeterminism. If you treat it as merely descriptive (relationism), you struggle to explain vacuum energy. They concluded that **the debate is not solved by GR; it is merely relocated.**

  ### 2. Is there a name for the "Cycle"?

  While there isn't one noun phrase for the whole history, the *logical structure* of the loop is called **Metaphysical Underdetermination**.

  This occurs when two competing ontological stories (Space is Real vs. Space is Relations) are **Empirically Equivalent**. They predict the exact same experimental outcomes (the water curves, the stars move), so physics cannot choose between them.

  When you see a theory change (Newton → GR) that *claims* to solve an ontological problem but ends up preserving the empirical predictions while leaving the ontology ambiguous, you are looking at **Underdetermination of Theory by Data**.

  If you want a label for the specific phenomenon of "rejecting absolute space only to reintroduce it as a field," philosophers sometimes refer to this as **The Persistence of the Substantivalism-Relationism Problem**. Some critics call the GR metric field **"Absolute Space in Disguise"** (a phrase Einstein himself worried about).

  ### 3. The Carving: How is this different from normal refinement?

  This is the most important part of your question. How do you distinguish this "loop" from normal scientific progress?

  **Normal Theory Refinement:**
  *   **Goal:** Increase empirical accuracy or scope.
  *   **Mechanism:** Modify equations to fit new data.
  *   **Ontology:** Usually secondary. (e.g., We don't care if the electron is a wave or particle as long as the math predicts the spectrum).
  *   **Result:** Old theory is shown to be *false* or *approximate* (Newtonian gravity is false near black holes).

  **The Substantivalism Loop (Metaphysical Underdetermination):**
  *   **Goal:** Resolve an ontological paradox (What *is* inertia?).
  *   **Mechanism:** Reinterpret the mathematical structure.
  *   **Ontology:** Primary. The math stays largely consistent, but the *story* about what the math represents flips.
  *   **Result:** The new theory (GR) is empirically superior, but the *ontological question* (Is space real?) remains **unresolved**.

  **The Boundary Line:**
  The edge is **Empirical Equivalence**.
  *   In normal refinement, Theory B makes predictions Theory A cannot.
  *   In this loop, Substantivalist GR and Relationist GR make the *same* predictions. The "loop" exists because physics runs out of empirical tools to decide the question, forcing it into philosophy.

  ### 4. What should you call it?

  If you are writing or arguing about this and want a term that captures the "smuggling back in" dynamic, you have three options:

  1.  **The Technical Term:** **"The Hole Argument."**
      *   *Usage:* "Newton posited absolute space, Mach tried to remove it, but the Hole Argument shows that General Relativity effectively reinstates a substantival metric field."
      *   *Pros:* Instantly signals to physicists/philosophers that you know the literature.
      *   *Cons:* Refers specifically to the GR era, not the whole historical cycle.

  2.  **The Descriptive Term:** **"Ontological Recidivism."**
      *   *Usage:* "The history of spacetime physics shows a pattern of ontological recidivism, where absolute space is rejected only to return as a dynamical field."
      *   *Pros:* Accurately describes the "crime and return" pattern you noticed.
      *   *Cons:* Not a standard canonical term, but clearly understood.

  3.  **The Structural Term:** **"The Underdetermination of Spacetime Ontology."**
      *   *Usage:* "The bucket argument initiates the underdetermination of spacetime ontology, which persists through the transition to General Relativity."
      *   *Pros:* Philosophically precise.
      *   *Cons:* A bit dry.

  ### 5. Summary for your next argument

  Your intuition that the metric field is "absolute space in a different coat" is a respected philosophical position.

  *   **Your Friend's View:** Likely **Moderate Substantivalism**. (Space is real, but it's a dynamic field, not a static stage).
  *   **Your View:** You are spotting the **Underdetermination**. You are arguing that the *functional role* of the metric field is identical to Newton's absolute space, regardless of the dynamical label.
  *   **The Synthesis:** Many modern philosophers adopt **Structural Realism**. This attempts to break the loop by saying: "Stop asking if space is an object or a relation. The only thing that is 'real' is the invariant structure described by the equations."

  **The Verdict:** You aren't seeing ghosts. You are seeing **The Hole Argument** playing out in real-time. The "loop" is the **Persistence of the Substantivalism-Relationism Debate**, driven by **Metaphysical Underdetermination**. If you want to name the specific move of "smuggling space back in," call it **Metric Substantivalism**.
