          *   *Mechanism:* Success (truth) because of Ability (virtue).
          *   *Focus:* Agency, creditworthiness, manifestation of skill.
          *   *Implication:* If the truth is due to luck (even if the belief is stable), it's not creditworthy, so it's not knowledge.

  3.  **Evaluate the Test Cases:**

      *   **Case 1: Reliable Neural Implant (Clairvoyance-style):**
