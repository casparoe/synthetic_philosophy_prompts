answer: |-
  **The Case: The Szilard Tape Engine**

  A colloidal particle is confined in a symmetric double-well optical potential immersed in water at 300 K, representing the system bit (Left/Right). The "demon" is a feedback laser system coupled to a physical memory tape: a linear chain of $N=100$ bistable molecular traps, each holding a bead that can sit in a Left (0) or Right (1) well. Initially, all tape beads are mechanically forced into the 0 state (blank). In each cycle, the particle equilibrates (50/50 L/R). The demon couples the particle's position to the next available tape bead via a transient potential bridge that allows the bead to tunnel; the tunneling rate depends on the particle's location, establishing a physical correlation. This measurement is imperfect: there is a probability $\epsilon = 0.1$ that the bead settles into the state opposite the particle due to thermal noise during the coupling window. Immediately after coupling, the demon uses the bead's state to apply a feedback force on the particle (e.g., raising the barrier on the occupied side and lowering the other), extracting work as the particle relaxes to the center. The tape bead is then isolated, preserving its recorded state, and the tape advances by one position. The particle and laser fields return exactly to their initial configurations; the only net change in the universe is the extraction of work, the dissipation of heat into the bath, and the advancement of the tape from a blank to a recorded state. When the 100 bits are filled, the device stops; it does not erase.

  ***

  **1. Numerical Verification**

  *   **Temperature:** $T = 300$ K.
  *   **Thermal Energy Unit:** $kT \ln 2 \approx (1.38 \times 10^{-23} \, \text{J/K})(300 \, \text{K})(0.693) \approx 2.87 \times 10^{-21}$ J.
  *   **Error Rate:** $\epsilon = 0.1$.
  *   **Binary Entropy of Error:** $H_b(\epsilon) = -0.1 \log_2(0.1) - 0.9 \log_2(0.9) \approx 0.469$ bits.
  *   **Mutual Information ($I$):** Since the input particle is uniform ($H(X)=1$) and the channel is symmetric, the output record is uniform ($H(Y)=1$). The mutual information is $I(X:Y) = H(Y) - H(Y|X) = 1 - H_b(\epsilon) = 1 - 0.469 = 0.531$ bits.
  *   **Work Extracted ($W$):** Assuming optimal feedback based on the noisy record, the extractable work is bounded by $kT I \ln 2$.
      $$W = 0.531 \times 2.87 \times 10^{-21} \, \text{J} \approx 1.52 \times 10^{-21} \, \text{J}.$$
      In units of $kT \ln 2$, $W = 0.531$.
  *   **Bits Written:** 1 bit per cycle (the tape bead goes from fixed '0' to stochastic '0/1').
  *   **Shannon Entropy of Record ($H(Y)$):** 1.0 bit (since the recorded bit is 50/50 due to symmetric input and error).
  *   **Mutual Information:** 0.531 bits (calculated above).

  **2. The Three Ledgers (in units of $kT \ln 2$)**

  *   **(a) The Erasure Ledger:**
      *   **Bits Erased:** 0. (The tape is written, not reset; the engine internals return to start without memory storage).
      *   **Cost:** $0 \times 1 = 0$.
      *   **Balance:** Gain $0.531$, Cost $0$. *Apparent Violation.*

  *   **(b) The Feedback Ledger:**
      *   **Gain:** Work extracted $= 0.531$.
      *   **Bound:** Work $\le$ Mutual Information acquired ($I = 0.531$). This holds with equality.
      *   **Compensation:** The measurement process physically couples the particle to the tape bead. To establish correlation $I$ with noise $H(Y|X) = 0.469$, entropy must be generated. The heat dissipated into the bath during the measurement coupling is $Q_{meas} = T \Delta S_{noise}$.
      *   **Cost:** $0.469$ (dissipated as heat during the tunneling/correlation step).
      *   **Balance:** Gain ($0.531$) - Measurement Dissipation ($0.469$) = Net Entropy Production ($0.062$)? No. The ledger tracks value. The "cost" of acquiring the information is the noise heat. The "value" is the work. The difference between Record Entropy ($1.0$) and Mutual Info ($0.531$) is the Noise ($0.469$). This noise is paid immediately into the bath.
      *   **Status:** Balanced locally if one accounts for measurement heat, but the tape entropy change is external to this ledger.

  *   **(c) The Resource Ledger:**
      *   **Gain:** Work extracted $= 0.531$.
      *   **Resource:** The incoming tape bit has entropy 0 (fixed '0'). The outgoing tape bit has entropy 1.0 (random '0/1').
      *   **Entropy Increase:** $\Delta S_{tape} = 1.0$ bit.
      *   **Bound:** Work $\le T \Delta S_{tape}$. Here $0.531 \le 1.0$.
      *   **Compensation:** The "fuel" is the low-entropy blank tape. The work is paid for by the entropy increase of the medium.
      *   **Restoration Cost:** To restore the medium (reset the tape to all '0's) requires erasing 1 bit of entropy per cycle. Cost $= 1.0$.
      *   **Balance:** If the tape is recycled, the restoration cost ($1.0$) exceeds the work gain ($0.531$), yielding a net loss of $0.469$, which exactly matches the measurement noise dissipated earlier.

  **3. Structural Feature and Collapse**

  *   **Structural Feature:** The **low-entropy input medium** (the blank tape). The engine functions as a heat engine fueled by the free energy difference between a ordered (blank) tape and a disordered (recorded) tape. The "demon" acts as the catalyst converting this free energy into work.
  *   **Collapse Scenario A (Memory Reset):** If we forbid tape advancement and force the demon to reset its internal memory bit to '0' after every cycle instead of writing to a tape, we must physically erase that bit. The Erasure Ledger now registers 1 bit erased. Cost $= 1.0$. Work Gain $= 0.531$. Net $= -0.469$. The violation vanishes; the device consumes work to run.
  *   **Collapse Scenario B (Medium Recycled):** If we loop the tape back to the input after recording, we must erase the recorded bits to make them blank again. The Resource Ledger now includes the erasure cost of $1.0$ per bit. Work Gain ($0.531$) - Erasure Cost ($1.0$) = Net Loss ($-0.469$).
  *   **Conclusion:** In both collapse scenarios, the three ledgers converge on the same net negative balance ($-0.469 \, kT \ln 2$). The apparent gain in the original case exists only because the entropy cost is exported to the tape rather than internalized as erasure.

  **4. The Honest Reply**

  *   **The Defense:** "Writing to a blank medium is merely erasure deferred. You claim no erasure occurred, but your device consumes blank bits. Blank bits are a non-equilibrium resource. To sustain the device, someone must erase the used tape to create new blanks. That erasure costs $kT \ln 2$ per bit. When you include the tape preparator, the total erasure cost is $1.0$, which exceeds your work gain of $0.531$. The Second Law is saved by the erasure required to *supply* your memory, not to *reset* it."
  *   **Analysis:** This reply is a **relocation of the system boundary**, but it is a physically necessary one. It establishes that Landauer's principle is not about the specific act of a demon "thinking" (resetting its internal register) but about the **thermodynamic cost of reducing entropy in any information-bearing degree of freedom**.
  *   **Establishment:** Your case proves that the cost does not have to be paid *at the moment of the demon's reset* if the demon offloads its entropy onto a consumable medium. However, it does not disprove that the cost must be paid *somewhere* in a closed cycle. The "locus of the cost" is movable (it can be on the demon's memory or the tape's preparation), but the "total cost" is invariant. The erasure story is not the *only* story, but it is the *complete* story for any cyclic process that restores all resources. Your case successfully decouples "information gain" from "immediate erasure cost," showing that information is a fuel, not just a bookkeeping trick.
