  2. **Trial of Socrates:** This lands at 2 (mixed) because the institutional latency was immediate with no built-in appeal path to correct the verdict, although the specific outcome was driven more by personal prosecutorial malice than systemic confusion.

  3. **Mytilene Debate:** This lands at 3 (mostly contingent) because the feedback latency was extremely short (overnight), allowing the Assembly to activate its built-in reconsideration mechanism and correct the impulsive error before execution.

  **Does this framing add value?**
  Yes, it shifts the diagnosis from psychological essentialism ("mobs are irrational") to systems engineering ("information loops are too slow"). The "mob irrationality" take treats all three episodes as evidence of inherent popular stupidity, failing to explain why Mytilene was corrected while Sicily was not. The "feedback latency" lens distinguishes between them: it shows the democracy functioned correctly when feedback was fast (Mytilene) but structurally failed when the scale of decision outpaced the speed of information (Sicily). This suggests the bug isn't the people, but the design's inability to handle long-term complex strategy without intermediate representation or faster intelligence, offering a specific mechanistic critique rather than a moral judgment.
