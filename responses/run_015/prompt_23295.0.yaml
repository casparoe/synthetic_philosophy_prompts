      *   **Core Distinction:** *Belligerency* vs. *Murder*. War is a state of conflict between states; murder is the intentional killing of the innocent.
      *   **Innocence:** Not "sinless," but "not engaged in harming you." Civilians are innocent in this technical sense.
      *   **Intention:** The doctrine of double effect is crucial. You cannot *intend* evil (killing innocents) even for a good end (winning the war).
      *   **Truman Critique:** He intended to kill civilians to break morale. This makes him a murderer, regardless of the outcome (saving lives by ending war sooner). Consequences don't justify intrinsic evil.
      *   **Authority:** War must be declared by legitimate authority. Secret killings might violate this.
      *   **Justice:** There must be a just cause and right intention.

  3.  **Apply Anscombe's Framework to Drone Strikes:**
