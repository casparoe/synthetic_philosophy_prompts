          *   *Cons:* Secret, unaccountable. No public declaration. Killing a citizen without trial bypasses legal justice.
          *   *Anscombe's likely view:* This looks like murder. It lacks the public authority and formal structure of war. It treats the state as judge, jury, and executioner secretly.

  4.  **Synthesize the "War vs. Murder" Distinction in this Context:**
      *   For Anscombe, war isn't a free-for-all. It has rules.
      *   Murder is the intentional killing of the innocent OR killing without proper authority/justice.
      *   Drone strikes blur the line between war and police action. Anscombe was big on *authority*. A secret CIA program lacks the public accountability of a declared war.
      *   *Consequentialism:* She hated utilitarianism (Truman's "saved lives" argument). Drone proponents often argue "less collateral damage than bombs." Anscombe would say: "That doesn't matter if the act itself is unjust."

