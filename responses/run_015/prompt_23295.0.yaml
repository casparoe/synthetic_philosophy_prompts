answer: |-
  This is a fascinating application of Anscombe's thought. You have hit on exactly why her essay *"War and Murder"* (1961) remains so potent: it challenges the *consequentialist* logic (the idea that the ends justify the means) that dominates modern military ethics.

  Elizabeth Anscombe was a staunch defender of **Just War Theory**, but she interpreted it through a rigorous lens of **Natural Law** and **Catholic moral theology**. She was also famously opposed to utilitarianism. To guess how she would view modern drone warfare, we have to look at the three pillars of her argument against Truman: **Intention**, **Innocence**, and **Authority**.

  Here is how her framework would likely dissect the drone program.

  ### 1. Precision vs. Intention (The Doctrine of Double Effect)
  You asked if she would see a precise drone strike as more legitimate than the atomic bomb because it is discriminate.

  **Anscombe's likely take:** She would appreciate the *technical* attempt at discrimination, but she would not let "precision" off the hook morally.

  For Anscombe, the atomic bomb was evil because the death of civilians was not just a side effect; it was the *means* to victory (breaking morale). In drone strikes, the intention is supposedly to kill a combatant. However, Anscombe would scrutinize **Signature Strikes** heavily.
  *   **Named Targets:** If a specific person is actively engaged in combat/hostility, killing them might be permissible under Just War theory.
  *   **Signature Strikes:** This would likely horrify her. Killing people based on "patterns of life" (e.g., military-aged males in a truck convoy) without knowing their identity risks violating the prohibition against killing the innocent. For Anscombe, if you act recklessly regarding whether someone is innocent or guilty, you bear moral responsibility for their death. If the "pattern" is flawed, you have committed murder, regardless of how high-tech the weapon was.

  She would argue that **precision does not sanitize an unjust act.** A precise murder is still murder.

  ### 2. The Problem of "Innocence" and Due Process
  Anscombe defined "the innocent" not as "sinless people," but as **"those who are not engaged in harming you."**

  In a traditional war, a uniformed soldier is "guilty" (liable to be attacked) because they are an instrument of harm. A civilian is "innocent."
  *   **The Drone Dilemma:** Drone targets are often non-state actors (terrorists) who do not wear uniforms. Anscombe would ask: *By what standard do we judge them liable to death?*
  *   **US Citizens:** This is where she would likely be most intense. In her view, a citizen has rights under the law. To kill a US citizen (like Anwar al-Awlaki) without a trial, based on a secret executive decision, bypasses the structure of justice.
  *   **War vs. Police Action:** Anscombe might argue that if a terrorist is a criminal, they deserve a trial. If they are an enemy combatant, there must be a state of war. The "Global War on Terror" is a nebulous concept. Anscombe liked clear definitions. If there is no declared war with a specific state, killing people secretly looks less like *belligerency* and more like *murder*.

  ### 3. Authority and Secrecy (The "Covert" Problem)
  This is perhaps the strongest point of convergence between her critique of Truman and modern drones.

  Anscombe argued that war must be waged by a **legitimate public authority**. Part of the function of public authority is accountability.
  *   **Truman:** He was the public head of state, but he ordered an act that Anscombe felt transcended his moral authority (mass killing of innocents).
  *   **CIA Drones:** These are often covert. The public does not always know strikes are happening; the legal justifications are often classified; the accountability is internal.

  Anscombe would likely argue that **secret killing undermines the very concept of public authority.** If the people cannot know that war is being waged in their name, they cannot judge whether it is just. This creates a "state within a state" executing people without public oversight. For a philosopher who believed that morality is rooted in truth and reality, **secrecy is inherently suspicious.** She would likely view covert assassination programs as a form of **tyranny**, regardless of how many "bad guys" are taken out.

  ### 4. Consequentialism: "But it saves lives!"
  Proponents of drones argue: "It's better than sending in infantry or dropping a 2,000lb bomb. Fewer civilians die."

  Anscombe would reject this argument entirely. She hated the idea that you can weigh lives on a scale to justify an intrinsic evil.
  *   **Her Argument:** You cannot do evil so that good may come.
  *   **Application:** If a drone strike is extrajudicial murder (because it lacks due process or legitimate war declaration), it does not matter if it kills fewer people than a ground invasion. It is still morally forbidden. She would say that by focusing on the *body count* (consequences), we ignore the *justice of the act* (intrinsic morality).

  ### Summary: How the Distinction Holds Up
  To answer your specific question: **Would she see it as legitimate because it's precise, or murder because it's secret?**

  She would likely lean toward **murder**, or at least "morally illicit killing," for two main reasons:

  1.  **The Erosion of Justice:** The extra-judicial nature of killing citizens or targets outside a declared war zone violates the requirement for legitimate authority and due process. It turns the state into a secret executioner.
  2.  **The Risk to the Innocent:** Signature strikes and the "collateral damage" of drones, even if lower than bombs, still involve accepting the death of innocents as a cost of doing business. For Anscombe, you cannot "accept" the death of the innocent as a policy; you must avoid it absolutely, unless it is truly unavoidable and unintended (Double Effect).

  **The Verdict:**
  Anscombe would likely say that modern drone warfare creates a **dangerous illusion of cleanliness.** Because it looks precise, we convince ourselves it is moral. But because it is often secret, unaccountable, and sometimes targets people without clear combatant status (or without trial), it violates the **Justice** and **Authority** criteria of Just War theory.

  She would probably argue that we have not moved past Truman's error; we have just made it quieter. Truman killed thousands openly to save lives; modern drone programs kill fewer people secretly to maintain security. For Anscombe, both prioritize **outcome over principle**, and both risk turning the state into a murderer.

  It is a hard pill to swallow, which is why you found her essay "intense." She demands that we look at the act itself, not the spreadsheet of casualties.
