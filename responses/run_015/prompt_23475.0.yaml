      *   *Resolving the Two Readings:* Argue that Reading 1 is the existential consequence of Reading 2. The crowd is an abstraction (2), but you can't join an abstraction without becoming abstract yourself (1). Truth for Kierkegaard is *how*, not just *what*. If the *how* changes (from inward to outward), the truth is lost. So Reading 1 is the deeper point.
      *   *The Press Connection:* Distinguish between "The Crowd" (physical) and "The Public" (press-created). The press creates a "phantom" crowd. It makes the "untruth" permanent. It allows you to be part of the crowd without physically being there, which is even more dangerous because you don't realize you've abdicated responsibility.
