      *   *Wait, let's look closer at the text:* "even if every individual... were to be in possession of the truth." This implies they *have* it. But then "untruth would at once be in evidence." This implies the *manifestation* or the *validity* of that truth is negated by the collective form. It's about the *criterion* of truth. If the criterion becomes the vote, the truth is no longer truth (which is internal). So, the individuals effectively surrender their truth to the mechanism of the crowd.
