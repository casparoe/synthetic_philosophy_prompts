  I work as an ML engineer — no degree, taught myself, about seven years doing recsys and multi-task ranking models — and I got pulled into a philosophy argument through a group chat about whether "the greatest good for the greatest number" can actually be derived from anything, or whether its just a vibe someone dressed up in equations. Someone in the chat pointed me at Harsanyi's aggregation theorem and I've been chewing on it for a couple weeks. Here's how I currently understand it, tell me if I've garbled it: assume each person's preferences over gambles satisfy the von Neumann-Morgenstern axioms, so each person gets a utility function that's unique only up to positive affine rescaling; assume society's preferences over gambles also satisfy those axioms; assume Pareto, in the sense that if nobody is made worse off and somebody is made better off that's a social improvement; and out falls the result that social welfare has to be a nonnegative weighted sum of individual utilities. What I want from you is a translation into the vocabulary I actually use, plus a report on what gets lost. Assume I'm comfortable with: per-objective losses, linear scalarization of a multi-objective problem and why weights are hyperparameters, dominance and Pareto fronts, expected loss under a stochastic policy, risk-sensitive objectives that optimize something other than the mean (worst-case group performance, CVaR-ish things), and the fact that a per-task loss is only identified up to scale and offset so comparing scales across tasks is always a convention. Assume I have no philosophy vocabulary beyond what I've picked up from blog posts, and — important — don't give me a reading list, paper titles, footnotes or citations: I have no library access and can't chase anything up, so explain whatever argument you rely on in your own words and say things like "there's a standard objection that goes roughly like this" instead of attributing it.

  So: do the translation assumption by assumption and then give me the residue report. I'd like a social state mapped onto an assignment of outcomes to a fixed indexed set of users, a gamble over social states onto a stochastic policy or randomized assignment, the vNM independence axiom onto something like "the score of a mixture policy equals the expectation of the scores," Pareto onto dominance, and the conclusion onto linear scalarization with nonnegative weights — including that second step I keep half-hearing about, where you imagine yourself equally likely to be anyone and that's supposed to force equal weights. Three things I specifically want in the residue report. (1) Which claims come across cleanly, which only come across if you quietly change them, and which have no counterpart at all in how I'd ever set up an optimization problem. (2) My suspicion is that the only assumption doing real work is the one that says society itself has to be vNM-rational, and in my terms that looks like insisting the planner be risk-neutral about which user it turns out to be — in which case Rawlsian maximin and prioritarian stuff get ruled out not because they're unfair but because they aren't expressible as an expectation, and the whole debate is really an argument about whether the planner may be risk-averse. Is that deflationary read right, or is there moral content I'm flattening when I say it that way? Does the translation end up making the theorem look like "any dominance-respecting expected-score planner is a linear scalarization," which to me sounds almost tautological and not like a discovery about ethics? (3) Two puzzles of my own that I want run through the same translation. The first is about scales: since each person's utility is only fixed up to positive affine transformation, "equal weights" can't mean much until you normalize everyone onto a common scale, and my fix is to rescale each person's utility over the range of levels they could actually get in the options on the table, then sum with equal weights. That seems to me to solve the unit problem, but it makes the ranking depend on what else was on the menu, so dropping an option nobody would ever pick can flip which of two other options is better — and the thing that interests me is that in ML this kind of thing is completely routine (per-task loss normalization, adaptive or uncertainty-based weighting, normalizing by what's in the batch) and no one treats the menu-dependence as a scandal, so I want to know whether the axiom it breaks is doing moral work or is just bookkeeping that engineers were never tempted by. The second is the twins case: if I add to the population a perfect copy of someone — same preferences, same stakes — the weights in the theorem don't seem to care how I split weight between original and copy, yet "twice as many people in that condition" feels like it should matter, and I can't tell whether that's a bug in the theorem, a bug in my intuition, or something my fixed-indexed-users framing simply can't represent because in my models the set of objectives is always fixed in advance. For each: does it translate, and if it doesn't, is that my framework's blind spot or the philosophy's?
