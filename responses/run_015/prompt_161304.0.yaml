answer: |-
  Here is the translation of Harsanyi's Aggregation Theorem into your stack, followed by the residue report on what breaks, what flattens, and what your two puzzles imply.

  ### The Translation

  **1. Social State $\rightarrow$ Outcome Assignment Vector**
  In philosophy, a "social state" is a complete description of the world. In your terms, map this to a deterministic assignment of outcomes to a fixed, indexed set of users $i \in \{1, \dots, N\}$. Let $y$ be a vector where $y_i$ is the outcome for user $i$. The "space of social states" is the set of all feasible vectors $y$ your system can produce.

  **2. Gamble over Social States $\rightarrow$ Stochastic Policy**
  A "gamble" is a probability distribution over social states. In your terms, this is a stochastic policy $\pi$ that outputs a distribution over outcome vectors $y$. When you evaluate a policy, you are evaluating the expected performance over the randomness in the policy (e.g., exploration noise, randomized assignment, or dropout).

  **3. Individual vNM Axioms $\rightarrow$ Per-User Expected Utility**
  The assumption that each person satisfies von Neumann-Morgenstern (vNM) axioms translates to: Each user $i$ has a scalar objective function $U_i(y)$ (utility). They rank policies solely by the expected value $\mathbb{E}_{y \sim \pi}[U_i(y)]$.
  *   **Affine Invariance:** You already noted this. $U_i$ is only identified up to $a U_i + b$ where $a > 0$. In ML terms, the "scale" and "zero-point" of each user's loss/utility are arbitrary conventions. You cannot compare $U_1$ to $U_2$ without a normalization convention.

  **4. Social vNM Axioms $\rightarrow$ Planner Risk-Neutrality**
  The assumption that *society* satisfies vNM axioms translates to: The planner has a global objective $J(\pi)$ and ranks policies solely by the scalar score $J(\pi)$. Crucially, the "Independence" axiom in vNM translates to **linearity over mixtures**.
  If policy $\pi$ is a mixture $\alpha \pi_A + (1-\alpha) \pi_B$, then the social score must be $J(\pi) = \alpha J(\pi_A) + (1-\alpha) J(\pi_B)$.
  In your vocabulary: **The planner optimizes the expectation of the score.** This implies the planner is risk-neutral with respect to the lottery over outcomes. They do not care about the variance of the social outcome, only the mean.

  **5. Pareto Principle $\rightarrow$ Pareto Dominance**
  The Pareto assumption translates directly to multi-objective dominance. If policy $\pi_A$ yields $\mathbb{E}[U_i] \ge \mathbb{E}[U_i]$ for all $i$, and strictly greater for at least one $i$, then the social objective must rank $\pi_A$ higher than $\pi_B$.
  In optimization terms: The social objective function must be strictly monotonic with respect to the Pareto front. It cannot prefer a dominated solution.

  **6. The Conclusion $\rightarrow$ Linear Scalarization**
  The theorem proves that if the above hold, the social objective $J$ must be a linear combination of individual utilities:
  $$J(\pi) = \sum_{i=1}^N w_i \mathbb{E}_{y \sim \pi}[U_i(y)]$$
  where $w_i \ge 0$.
  In your terms: **The only way to aggregate per-user losses while respecting dominance and linearity is linear scalarization with non-negative weights.** Any other aggregation (geometric mean, min, product) violates the linearity assumption (Social vNM).

  **7. The "Second Step" (Impartial Observer) $\rightarrow$ Uniform Priors over User Identity**
  Harsanyi adds a thought experiment to fix the weights $w_i$. Imagine the planner does not know which user $i$ they will be in the system, and assigns a uniform probability $1/N$ to being any specific user.
  If the planner maximizes their *own* expected utility under this uncertainty, and their utility as user $i$ is $U_i$, then the objective becomes:
  $$J(\pi) = \sum_{i=1}^N \frac{1}{N} \mathbb{E}[U_i(y)]$$
  In your terms: **Equal weights are derived by treating user identity as a random variable with a uniform prior.** This forces $w_i = w_j$.

  ***

  ### The Residue Report

  Here is what gets lost, flattened, or exposed when you run this through an ML compiler.

  #### 1. Fidelity Check: What Translates Cleanly?

  *   **Clean Translations:** The mapping of **Pareto to Dominance** and **Conclusion to Linear Scalarization** is nearly lossless. In multi-task learning, if you demand that improving any task without hurting others must improve the total loss, and you demand linearity over policy mixtures, you mathematically force a weighted sum.
  *   **Modified Translations:** The **vNM Axioms**. In ML, we assume expectation maximization because it's tractable and converges. In philosophy, this is a substantive claim about *rationality*. By translating vNM to "optimize expected score," you hide the normative bite. You make it look like a modeling choice (which loss function?) rather than a rationality constraint (you are *irrational* if you don't do this).
  *   **No Counterpart:** **The "Ought"**. In ML, if linear scalarization produces bad behavior (e.g., one task dominates), you change the architecture or the weights. You feel no contradiction. In the theorem, if you reject linear scalarization, you are logically inconsistent. The theorem claims to derive an *ethical obligation* from *logical consistency*. Your framework treats the objective as a hyperparameter; the theorem treats it as a logical necessity. That normative force evaporates in translation.

  #### 2. The Deflationary Read: Is it just Risk-Neutrality?

  Your suspicion is correct. The heavy lifting is done entirely by the assumption that **Society satisfies vNM axioms**.

  In your vocabulary, assuming Society is vNM-rational is exactly equivalent to insisting the planner be **risk-neutral over the distribution of social outcomes**.
  *   **Rawlsian Maximin:** This corresponds to a risk-averse planner who optimizes for the worst-case user (or the lower tail of the utility distribution). This violates the vNM Independence axiom (linearity over mixtures).
  *   **Prioritarianism:** Giving extra weight to the worse off usually implies a concave transformation of utility before summing. This also violates Social vNM rationality unless you redefine the "outcome" space.

  **Is this flattening moral content?**
  Yes and no.
  *   **Yes:** It reduces "Fairness" to "Risk Attitude." A philosopher might argue that caring about the worst-off is a moral duty, not just a risk preference. The theorem recasts a moral duty as a statistical preference.
  *   **No:** It clarifies the debate. It shows that the argument between Utilitarians (sum) and Rawlsians (maximin) is not about math, but about whether the "Social Planner" is allowed to be risk-averse.
  *   **Tautology Check:** Does it look like "Any dominance-respecting expected-score planner is a linear scalarization"? Yes. To an engineer, this sounds trivial. "If you want a linear objective, use a linear objective." The philosophical discovery isn't the math; it's the claim that **you must want a linear objective to be rational.** The theorem tries to prove that risk-aversion at the social level is irrational. If you reject that premise, the theorem collapses. So, the "moral content" is entirely packed into the decision to treat Society as a single vNM agent.

  #### 3. The Puzzles

  **Puzzle 1: Scale and Menu Dependence**
  *   **The Setup:** You propose normalizing each $U_i$ to $[0, 1]$ based on the min/max utility achievable in the *current set of options* (the menu), then summing with equal weights.
  *   **The Conflict:** This violates the **Independence of Irrelevant Alternatives (IIA)**. In the theorem, the ranking of Option A vs. Option B cannot depend on whether Option C is available. In your normalization scheme, removing Option C might change the min/max range, which rescales $U_i$, which flips the ranking of A vs. B.
  *   **ML vs. Ethics:**
      *   **In ML:** This is standard practice (e.g., GradNorm, uncertainty weighting, batch normalization). We accept menu-dependence because the "menu" (data distribution) is non-stationary. We prioritize convergence and stability over global consistency. We don't expect the loss landscape to be consistent across epochs.
      *   **In Ethics:** IIA is a rationality constraint to prevent manipulation. If the ranking depends on the menu, a "chairman" can manipulate the social choice by adding dummy options (phantom tasks) that no one wants, just to shift the scaling of the utilities and flip the vote on the real options.
  *   **Verdict:** The axiom is doing **moral work**, not just bookkeeping. It ensures the social choice is stable and non-manipulable. However, your ML intuition highlights that in complex, high-dimensional systems, strict IIA is often computationally impossible or undesirable. The "scandal" in philosophy is logical inconsistency; the "scandal" in ML is training instability. You are willing to trade consistency for stability; the theorem forbids that trade.

  **Puzzle 2: The Twins Case**
  *   **The Setup:** Add a perfect copy of User 1 (User 1b). Same preferences, same stakes.
  *   **The Theorem's Behavior:** The theorem assumes a fixed $N$. It outputs $J = \sum w_i U_i$. It does not tell you how $w_i$ changes when $N$ changes.
      *   If you use the **Impartial Observer** (uniform prior), weight per person is $1/N$. Adding a twin dilutes everyone's weight. Total Welfare = Average Utility.
      *   If you treat weights as **fixed importance**, adding a twin adds their utility to the sum. Total Welfare = Total Utility.
  *   **The Intuition:** You feel "twice as many people in that condition" should matter more (Total Utilitarianism). But the Impartial Observer argument suggests the planner cares about the *average* expected utility of the person they turn out to be.
  *   **Verdict:** This is a **blind spot in the theorem**, not your framework. Harsanyi's Aggregation Theorem is designed for **fixed population** ethics. It breaks down in variable population contexts (Population Ethics).
      *   Your ML framing (fixed indexed set of users) actually aligns *better* with the theorem's assumptions than the philosophical intuition does. In recsys, the batch size is fixed during the step.
      *   The intuition that "more people = more weight" requires an additional axiom outside Harsanyi's scope (often called "Mere Addition").
      *   **Is it a bug?** In ML, if you duplicate a row in your batch, the gradient update doubles for that pattern. You implicitly follow Total Utilitarianism per batch. If you view the "population" as the set of all potential users over time, your fixed-index framing hides the moral weight of *existence*. The theorem cannot tell you if creating a happy twin is good; it can only tell you how to rank outcomes for twins that already exist.

  ### Summary
  You haven't garbled the theorem. You've successfully compiled it to your native architecture. The "residue" is that the theorem relies on treating the Social Planner as a risk-neutral agent optimizing a single expectation. In ML, that's a design choice. In philosophy, it's claimed as a logical requirement for morality. Your puzzles reveal that when you drop the philosophical constraints (IIA, Fixed Population) to make the system workable (Normalization, Dynamic Batches), you gain engineering stability but lose the logical guarantees the theorem promises. The theorem isn't wrong; it's just brittle in the face of the engineering constraints you deal with daily.
