answer: |-
  1. Does cliodynamics retain explanatory power when stripped of point predictions and evaluated solely as conditional structural claims about elite overproduction within non-independent historical regimes?
  2. Existing debate stalls because modellers defend precise forecasts that historians dismiss as overfitted, leaving the intermediate value of structural claims unexamined. Neither side addresses how the evidence base of non-independent trials interacts with audience consumption that alters the system's validity.
  3. I will spend three months replicating a secular-cycle fit to test parameter sensitivity, three months building a pre-registered scorecard of live forecasts with verifiable indicators, and three months interviewing modellers and critics on audience feedback loops.
  4. The deliverable is a trade book for educated general readers and policy analysts that translates technical evidentiary standards into a framework for consuming political risk forecasts without succumbing to fatalism.
  5. Failure occurs if structural claims collapse without adjustable cycle lengths or if modellers refuse to distinguish between prediction grades. Scope will likely expand if researchers resist subjecting future claims to verification, requiring prolonged negotiation.
