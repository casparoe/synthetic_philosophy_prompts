answer: |-
  Here is a 10-minute decision procedure for evaluating contrastive history questions (e.g., "Why X and not Y?"). It is designed to catch teleology, bias, and category errors.

  ### The 4-Step Filter

  **Step 1: The Desire Test (Intent)**
  *   **Question:** Did the society/group in the "not Y" position actually try to achieve the outcome X?
  *   **Pass:** Yes, they attempted similar goals (e.g., state consolidation, military tech).
  *   **Fail:** No, the outcome was irrelevant or undesirable to them (e.g., industrialization was not a goal of Qing China).
  *   **Action:** If **Fail**, this is a **Values Call**. You can teach it, but only to expose the assumption that everyone *wanted* X. Do not treat it as a puzzle they failed to solve.

  **Step 2: The Substance Test (Counterfactual)**
  *   **Question:** Is "Y" a specific historical trajectory, or just an imaginary average of "everyone who didn't do X"?
  *   **Pass:** Y is a specific polity/time with documented capacity to have done X (e.g., Song Dynasty China had the tech).
  *   **Fail:** Y is a caricature or monolith (e.g., "The Ottoman Empire" treated as static for 400 years).
  *   **Action:** If **Fail**, this is a **Hard No**. Rephrase immediately. You cannot compare a real history to a stereotype.

  **Step 3: The Virtue Test (Normativity)**
  *   **Question:** Does the question imply that achieving X is "progress," "development," or inherently "better"?
  *   **Pass:** The outcome is treated neutrally (e.g., "mechanization" vs. "craft").
  *   **Fail:** The outcome is treated as moral success (e.g., "rise," "divergence," "failure to modernize").
  *   **Action:** If **Fail**, this is a **Values Call**. You must explicitly teach that X brought costs (exploitation, environmental damage) and that not choosing X was not necessarily a failure.

  **Step 4: The Scale Test (Comparability)**
  *   **Question:** Are X and Y comparable units at the specific moment in time?
  *   **Pass:** Both are states, both are regions, or both are systems at similar lifecycle stages.
  *   **Fail:** Comparing a city-state to an empire, or a peak moment to a decline moment.
  *   **Action:** If **Fail**, this is a **Hard No**. The data will not hold.

  ---

  ### Applying the Filter

  **Case 1: The Classic "Why Britain and not China?"**
  *   **Desire:** **Fail.** Qing China was not trying to build factories.
  *   **Substance:** **Pass.** Song/Ming China had comparable tech levels earlier.
  *   **Virtue:** **Fail.** Implies industrialization = success.
  *   **Scale:** **Pass.** Both large agrarian empires.
  *   **Verdict:** **Values Call.**
  *   **How to teach:** Do not ask "Why didn't China industrialize?" Ask: "Why did Britain change its economic structure while China maintained theirs?" This shifts focus from Chinese "failure" to British contingency.

  **Case 2: Student asks "Why not the Ottoman Empire?"**
  *   **Desire:** **Fail.** Ottoman priorities were land control and tax stability, not mass production.
  *   **Substance:** **Fail.** Often taught as a monolith ("The Sick Man of Europe") rather than a specific decade/policy.
  *   **Virtue:** **Fail.** Implies Ottomans were "behind."
  *   **Scale:** **Fail.** Often compares 18th-c Britain to 19th-c Ottomans.
  *   **Verdict:** **Hard No.**
  *   **How to fix:** Rephrase to "How did Ottoman state priorities differ from British private enterprise in the 1700s?" Only use if you have specific sources on Ottoman guilds vs. British patents.

  **Case 3: The Broken-but-Teachable ("Why did Rome Fall?")**
  *   **Desire:** **Fail.** Romans didn't want their empire to fall.
  *   **Substance:** **Pass.** Rome was a specific entity.
  *   **Virtue:** **Fail.** Assumes "Fall" = Bad/Collapse rather than Transformation.
  *   **Scale:** **Pass.** Comparing Western Empire to itself over time.
  *   **Verdict:** **Values Call.**
  *   **Why teach it:** It is the classic example of outcome bias. Use the question to show students how the word "Fall" hides the rise of new kingdoms. The question is historically broken, but pedagogically gold for teaching critical reading.

  ---

  ### Where I'm Dressing Up Judgement as Rules

  1.  **The Substance Test (Step 2):** Deciding whether "China" or "The Ottomans" is a stereotype vs. a specific trajectory is subjective. I am flagging "monoliths" as bad, but sometimes generalizations are necessary for high school surveys. You have to decide when a generalization is useful vs. harmful.
  2.  **The Virtue Test (Step 3):** I assume "industrialization = bad/neutrality" is the correct corrective. You might believe industrialization *was* net positive. The checklist forces you to acknowledge the value judgement, but it doesn't tell you what value to hold.
  3.  **Hard No vs. Values Call:** The line between "rephrase this" (Hard No) and "teach the bias" (Values Call) is your call. I lean toward "Values Call" to keep you employed, but a pure historian might say "Hard No" to the Britain/China question entirely.

  ### What This Checklist Can't Do

  *   **Fix Curriculum Constraints:** If the state exam requires the "Great Divergence," you have to teach it. This tool helps you frame it safely, not skip it.
  *   **Replace Content Knowledge:** If you don't know Ottoman tax laws, Step 2 will feel like a guess.
  *   **Solve Time:** Unpacking bias takes longer than lecturing facts. This makes your lesson richer, not faster.
  *   **Remove Politics:** History is political. This checklist makes the politics visible; it doesn't make them disappear.

  **Quick Rule of Thumb:** If the question makes one society look like the "main character" and the others like "NPCs who failed a quest," trash the question or flip the script.
