      *   *Observer Task:* Watch the flow. Did the "System" route the packet, or did the "Nodes" pass it?

  6.  **Addressing the Philosophical "Pull":**
      *   The feeling of "Agency." When the packet gets stuck, who is frustrated? The node or the system?
