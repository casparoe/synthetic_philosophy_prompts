  8.  **Finalizing the Design Details:**
      *   *Materials:* Colored vests or badges (Node ID), Tokens (Packets), Tape (Grid), Rule Cards.
      *   *Rules:* Strictly local. "If you have a token and neighbor is empty, pass." "If you have two tokens, hold."
      *   *Observer Prompt:* "Describe the behavior using *only* system-level terms (e.g., 'It tried to...') then *only* component-level terms ('Node 3 passed to Node 4...'). Which feels more true?"

  9.  **Structuring the Response:**
