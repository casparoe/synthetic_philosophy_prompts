answer: |-
  This is a sharp set of questions. You've hit on the central tension in the philosophy of climate science: the IPCC framework is an *institutional compromise* between rigorous epistemology (which often points toward imprecision) and policy utility (which demands precision).

  As a PhD candidate in imprecise probabilities (IP), you are likely familiar with the Levi/Walley tradition versus the precise Bayesian orthodoxy. The IPCC Guidance Notes (specifically Mastrandrea et al., 2010/2011) effectively operationalize a hybrid view that doesn't sit comfortably in either camp.

  Here is a reconstruction of the philosophical commitments underlying the IPCC package, addressing your specific points.

  ### 1. Precise Bayesianism vs. Genuine Imprecision
  **Does the framework require genuinely imprecise credences?**

  Strictly speaking, **no**. A sophisticated precise Bayesian could reconstruct the IPCC output using a hierarchical model.
  *   **The Bayesian Reconstruction:** You have a hyper-prior over model structures. The "Likelihood" range (e.g., 66–100%) represents the central mass of the posterior predictive distribution. The "Confidence" level represents the sensitivity of that posterior to the choice of hyper-priors or the variance of the ensemble.
  *   **The IP Critique:** However, the IPCC explicitly resists this reduction. By separating "Likelihood" (probabilistic) from "Confidence" (evidence/agreement), they are acknowledging that **probability is not sufficient to capture the state of knowledge.**
  *   **The Commitment:** The framework presupposes that there is a distinction between *risk* (uncertainty with a known/agreeable distribution) and *ambiguity* (uncertainty about the distribution itself). A precise Bayesian collapses ambiguity into risk via a prior. The IPCC treats them as distinct dimensions. This leans heavily toward an IP interpretation (a credal set) where the *size* of the set reflects the ambiguity, but they refuse to report the set itself, preferring a interval + confidence label.

  ### 2. The Two Scales: Disagreement vs. Thin Evidence
  **Do the two scales commit to two different sources of imprecision?**

  The IPCC defines Confidence as a function of **Evidence** (amount/quality of data) and **Agreement** (consensus among experts/models).
  *   **One Story vs. Two:** You asked if one story could cover both. In IP terms, both "thin evidence" and "expert disagreement" result in a **widening of the credal set**.
      *   *Thin Evidence:* The data doesn't constrain the priors, so the set of posteriors remains wide.
      *   *Disagreement:* Different experts start with different reasonable priors, resulting in a non-overlapping or weakly overlapping set of posteriors.
  *   **Why Two Scales?** If both map to the width of the credal set, why separate them?
      *   **Epistemic vs. Social:** "Likelihood" tracks the *epistemic* state (what the world is likely doing). "Confidence" tracks the *sociological/Methodological* state (how robust is our process?).
      *   **The "Weight" of Evidence:** This echoes Keynes' distinction between the *probability* of a proposition and the *weight* of the argument. The IPCC is effectively reporting $P(H)$ (Likelihood) and $W(P)$ (Confidence).
      *   **Conclusion:** It doesn't strictly require two *mathematical* sources of imprecision, but it does require a meta-epistemological distinction between the *content* of the belief and the *justification* for the belief. A single IP story (e.g., "the set is wide") loses the information about *why* it is wide (is it noisy data, or fighting experts?).

  ### 3. The Status of the "Single Best Estimate"
  **Is it a commitment, a decision rule, or pragmatics?**

  This is the point where the IPCC framework most blatantly violates strict IP norms (like Levi's suspension of judgment).
  *   **Not a Metaphysical Commitment:** They do not believe there is a "true" single probability hidden in the noise.
  *   **Not E-Admissibility:** If they were following strict IP decision rules, they would identify the set of admissible actions. They don't; they give a number.
  *   **Pragmatics + Focal Point:** It is primarily **pragmatic**. Policymakers operating under Cost-Benefit Analysis (CBA) frameworks generally cannot process intervals or credal sets easily. They need an expected value.
  *   **The "Centroid" Move:** Philosophically, the best estimate usually functions as a **representative member** of the credal set (often the median or mean of the pooled expert distributions). It is a *precisification* forced by communication constraints.
  *   **The Danger:** This invites the "false precision" critique. By providing a best estimate, they invite policymakers to treat the uncertainty as symmetric and Gaussian, even when the underlying credal set is skewed or disjointed.

  ### 4. The Sharp Endpoints Problem (The Regress)
  **If probability isn't precise, what does it mean to clear 66%?**

  You have identified the weakest philosophical link in the chain. This is the problem of **Second-Order Vagueness**.
  *   **The Problem:** If my credence is $P \in [0.60, 0.75]$, does this satisfy the condition for "Likely" ($>0.66$)?
      *   The lower bound says No.
      *   The upper bound says Yes.
      *   The status is indeterminate.
  *   **IPCC Solution:** They resolve this by **authoritative stipulation**. The Lead Authors assess whether the *bulk of the evidence* supports crossing the threshold. They effectively collapse the imprecise credence into a precise judgment *for the purpose of classification*.
  *   **Does it Regress?** Yes. You are correct.
      *   Level 1: Is the event $X$ going to happen? (Imprecise)
      *   Level 2: Is the probability of $X$ $> 66\%$? (Imprecise)
      *   Level 3: Are we *Confident* that the probability is $> 66\%$? (Qualitative)
  *   **Stability:** It is not logically stable, but it is **institutionally stable**. The regress is stopped by the authority of the consensus process. The "Confidence" scale acts as a buffer. If the probability is borderline (imprecise), they lower the Confidence level.
      *   *Example:* "It is *Likely* (66-100%)" with *Low Confidence* effectively signals: "Our best estimate clears 66%, but the imprecision is high enough that we wouldn't bet heavily on it."
      *   This maps to **Supervaluationism**: The statement "P > 0.66" is super-true if it holds for all acceptable precisifications, super-false if it holds for none, and indeterminate otherwise. The IPCC confidence scale effectively reports the super-valuation status without using the logic.

  ### 5. What is Lost with Single-Number Reporting?
  **If they swapped to straight single-number reporting, what would actually be lost?**

  If the IPCC reported only "Best Estimate: 3.0°C (SD: 0.5)", you would lose three critical dimensions that the current hybrid framework preserves:

  1.  **Ambiguity vs. Risk:** You lose the distinction between "we know the distribution is wide" (Risk) and "we don't know what the distribution looks like" (Ambiguity/Confidence). In decision theory (e.g., Ellsberg paradox), agents treat these differently. Single numbers force ambiguity to be treated as risk.
  2.  **Robustness/Consensus:** A single number hides the *social epistemology*. A best estimate derived from 100 models agreeing is functionally different for policy than a best estimate derived from 3 models disagreeing wildly but averaging out. The Confidence scale preserves the "weight of evidence."
  3.  **Tail Risk Information:** The "Likely" range (66%) is often reported alongside "Very Likely" (90%) or "Extremely Unlikely" (<5%). A single best estimate with a standard deviation assumes normality. Climate tails are fat. The verbal likelihood scales allow authors to assert asymmetry (e.g., "Very Unlikely to be <0, but Possible to be >6") without committing to a specific parametric distribution that might be false.

  ### Summary for your Thesis
  The IPCC framework is not a coherent application of Imprecise Probability theory. It is a **pragmatic translation layer**.

  *   **Generation:** Uses IP-adjacent methods (ensembles, expert elicitation with ranges).
  *   **Assessment:** Uses Supervaluationist logic (does the evidence support crossing the threshold?).
  *   **Communication:** Uses Precise Bayesian signaling (best estimates) for policy utility.

  The "Sharp Endpoint" issue you raised is the fracture point. The IPCC manages it not by solving the philosophical regress, but by offloading the indeterminacy onto the **Confidence** scale. They admit the probability might be shaky by lowering the confidence, rather than admitting the probability threshold itself is vague.

  If you are looking for a gap in the literature: The formal mapping of the **Confidence Scale** onto **Second-Order Imprecise Probabilities** (sets of credal sets) is under-theorized. Most philosophers analyze the Likelihood scale; few analyze how the Confidence scale functions as a meta-probabilistic operator to stabilize the sharp thresholds. That seems like fertile ground for a PhD chapter.
