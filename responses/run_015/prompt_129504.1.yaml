prompt: |-
  If phenomenal consciousness is epiphenomenal, then my conviction that I possess subjective awareness is caused entirely by physical brain processes that would unfold identically regardless of whether any inner experience actually accompanies them. It therefore seems that a sufficiently precise artificial system replicating these neural dynamics—one that produces identical behavioural reports and correlates of nociception without any accompanying qualia—would be equally justified in attributing consciousness to itself, which implies that my own first-person reports carry no distinctive evidential weight. Does this not demonstrate that epiphenomenalism necessarily collapses into a scepticism about one's own mind? Please answer in British English, adopting a committed position with clear reasons rather than merely surveying options, and indicate where your reasoning depends on contested assumptions about causal closure or introspective authority.
