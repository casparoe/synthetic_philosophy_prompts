      *   *Side B (Single-Scale):* Claims continuity. Motivated by mathematical tractability and the "Repugnant Conclusion" avoidance (or rather, avoiding the "Sadistic Conclusion" or lexical absurdities). They see lexicality as an intuition pump that fails under scrutiny.
