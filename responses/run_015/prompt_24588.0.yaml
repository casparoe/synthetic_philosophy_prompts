      *   **James (Radical Pragmatism/Instrumentalism):** Truth is what "works" or has "cash value." It's verified by its consequences in experience. Truth happens to an idea; it becomes true. It's more local, pluralistic, and tied to immediate utility/satisfaction of needs.

