      *   *Premise 2 (Factivity):* $Kp \to p$.
      *   *Premise 3 (Distribution/Closure):* $K(p \land q) \to (Kp \land Kq)$.
      *   *Derivation:* Assume there is an unknown truth $p \land \neg Kp$. If knowable, $\Diamond K(p \land \neg Kp)$. In a possible world where this is known, $K(p \land \neg Kp)$. By closure, $Kp \land K\neg Kp$. By factivity on the second conjunct, $\neg Kp$. Contradiction ($Kp \land \neg Kp$). Therefore, $\neg \Diamond K(p \land \neg Kp)$. By KP, $\neg (p \land \neg Kp)$. Therefore, $\forall p (p \to Kp)$ (All truths are known).
      *   *Core Tension:* Verificationism (KP) + Minimal Logic of Knowledge $\to$ Omniscience.

