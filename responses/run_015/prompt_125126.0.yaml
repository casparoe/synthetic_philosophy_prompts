          *   *Selection:* **"The exact number of leaves on the oak tree outside is even."** (Assume it is).
          *   *Why:* It's contingent. It's currently unknown (no one counted). It's knowable (climb and count). It's not self-referential. It's not inherently unknowable (unlike quantum states maybe).

      *   **Misconceptions:**
          1.  *Unknowable truths exist:* The paradox proves if KP holds, there are no unknown truths. It doesn't prove unknowable truths exist (unless you deny KP). Need to head this off at the conclusion.
          2.  *Refutes Realism:* It refutes *Verificationism* (KP) if you assume Omniscience is false. Or it refutes Non-Omniscience if you hold KP. It doesn't touch Realism directly unless Realism implies unknown truths. (Clarify at the end).
          3.  *Moore's/Surprise Exam:* Moore's is $p \land \neg Bp$ (belief). Fitch is knowledge. Surprise Exam is about expectation. Head off when introducing Factivity/Closure.
          4.  *CS Objection (Identifying vs. Existence):* "You need to *find* the unknown truth to derive the contradiction." No, the proof is by contradiction assuming *there exists* one. This needs to be addressed during the quantifier step (the $\exists$ introduction).

      *   **Omissions:** Intuitionistic logic and restricted knowability.
          *   *Verdict:* If you omit them, it looks like KP is dead. But KP is the verificationist's core tenet. Silencing the responses makes the paradox look like a refutation of Verificationism rather than a challenge to formulate it correctly.
          *   *Advice:* Acknowledge them briefly as "ways out" without detailing them, so students know the debate isn't over.

      *   **Ending Question:** Needs to test the *derivation*.
          *   *Idea:* "Which premise would a verificationist be most willing to sacrifice, and why?" (Too vague).
          *   *Idea:* "Does the proof show we are omniscient, or that 'all truths are knowable' is false?" (Better).
          *   *Idea:* "At which step does the 'unknown' disappear?"
          *   *Best:* "If we accept the logic is valid, does the paradox force us to accept we are omniscient, or does it force us to reject the claim that there are unknown truths?" (Tests understanding of *reductio*).

  4.  **Refining the Sequence (The "Order of Components"):**
      1.  **Motivation (10 mins):** Verificationism. Truth = Verifiability. The Knowability Principle (KP).
