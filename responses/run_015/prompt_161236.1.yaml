answer: |-
  **MEMORANDUM**

  **TO:** Research Integrity Committee
  **FROM:** [Outside Member]
  **DATE:** Wednesday Evening
  **SUBJECT:** Standard of Knowledge in Case 23-07 and Policy Interpretation

  **Recommendation on Section 4.2(b)**
  We must adopt an invariant standard for "knew." Under this reading, a researcher "knew" data were fabricated only if there is evidence of their actual subjective awareness or deliberate avoidance of the truth (willful blindness). The severity of the consequences (grant clawbacks, career termination) or the current mood of the Oversight Board must not influence whether we attribute knowledge. "Should have known" covers all instances where a reasonable researcher would have detected the error but the senior author did not.

  This distinction is vital. If we allow the stakes to determine whether someone "knew," we create a circular system where the punishment defines the crime. General Counsel's advice to align with the Board's defensive posture treats knowledge as a flexible tool of risk management. It is not. It is a factual claim about a person's mental state. We should find "knew" only when the evidence forces us to conclude the researcher was consciously aware of the fabrication. Anything less belongs under "should have known," regardless of how negligent that behavior was.

  **Application to Case 23-07**
  Applying this standard to Dr. R, I recommend a finding of **should have known**, not knew.

  The evidence shows Dr. R suspected something was wrong. He noted the "unusually clean" bands and joked about them. Later, when a collaborator failed to reproduce the result, Dr. R promised to look into it and did not. This is gross negligence. However, suspicion is not knowledge. The joke indicates he treated the anomaly as improbable, not impossible. The failure to follow up on the collaborator's email is a breach of supervisory duty, not proof he knew Dr. T was fabricating. He may have believed Dr. T would clarify the issue, or he may have been careless. Without evidence that Dr. R consciously believed the data were fake and concealed it, we cannot satisfy the invariant standard for "knew." We must sanction the negligence severely, but we cannot inflate it to knowledge to match the harm caused to the clinical guidelines.

  **Precedents and Future Rule**
  This recommendation requires us to correct our record on precedents 21-02 and 22-11.
  *   **21-02:** This finding was erroneous. An unread email does not prove subjective awareness. We found "knew" because the stakes were low. That was a mistake.
  *   **22-11:** The outcome was correct, but the reasoning was flawed if it relied on the high stakes of the clinical trial to withhold a knowledge finding. The evidence simply did not prove awareness.

  **Rule for Future Cases:** The Grants Officer should apply the "Evidence of Mind" test. To find "knew," we require direct evidence of the researcher's mental state (admissions, explicit instructions, or destroyed exculpatory evidence). To find "should have known," we require evidence of a breach of standard supervisory practices (failure to review raw data, ignoring replication failures). Consequences of the error are relevant to sentencing, not to the finding of knowledge.

  **The Opposing View**
  I must acknowledge the strongest argument against this recommendation. Defenders of "pragmatic encroachment" argue that knowledge attributions naturally shift with stakes.¹ In ordinary language, we say a doctor "knows" a dosage is safe only if the risk of death is low; if the risk is high, we demand certainty before attributing knowledge. Our committee members feel this circularity intuitively: finding "knew" destroys a career, so we feel we need more proof when the stakes are higher. This view holds that our language is already doing this work, and fighting it makes us out of touch with how people actually reason. It suggests that protecting the institute from liability is a legitimate factor in interpreting "knew."

  **Vulnerability**
  My recommendation is most exposed on the issue of willful blindness. If we discover evidence that Dr. R actively prevented others from checking Dr. T's files after the collaborator's email, my distinction collapses. Deliberate avoidance is legally and philosophically equivalent to knowledge. If such evidence exists, I will support a finding of "knew." Absent that, we must hold the line. Stability in our definitions is more important than matching the punishment to the public harm in this specific instance.

  ***

  **Appendix: Options Set Aside**
  1.  **Epistemic Contextualism:** The view that "knows" changes meaning based on the attributor's context (e.g., the Board's mood). Rejected because it makes findings dependent on external politics.
  2.  **Strict Liability:** Treating senior authors as automatically "knowing" all lab data. Rejected as incompatible with the policy's distinction between "knew" and "should have known."
  3.  **Retrospective Adjustment:** Reopening 21-02 and 22-11 formally. Set aside for now; the new rule applies prospectively and to 23-07, with prior cases noted as inconsistent.

  ***
  ¹ *Footnote for Committee Use:* The position described above is often called **Pragmatic Encroachment**. The view I am recommending is a form of **Epistemic Invariantism**.
