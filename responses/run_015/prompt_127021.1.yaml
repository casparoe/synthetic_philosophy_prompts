answer: |-
  **Planning Notes:**
  *   **Hook:** Acknowledge the bagels/coffee crowd immediately to lower the stakes for the laypeople, while signaling to the experts that we know the stakes are high.
  *   **The Bridge:** Define the Socialist Calculation Debate (SCD) in plain English (can you run an economy without prices?) so the family members don't tune out, but use the specific terminology (tacit vs. explicit) to keep the experts engaged.
  *   **The Pivot:** The core argument is that both Hayek and Lange assumed knowledge was either "in the head" or "on the page." ML changes this.
  *   **The Boundary:** Explicitly state what we aren't debating (the failure of 20th-century central planning) versus what we are debating (the nature of algorithmic coordination).
  *   **Tone:** Warm, authoritative but not stiff. American English.

  ***

  **Opening Remarks: Prices, Planning, and Prediction**

  Good morning, everyone. Thanks for being here. I see a lot of familiar faces in the front, and I see some people in the back who I'm told are just here for the coffee and the bagels. That is completely fair. Honestly, the bagels are the most planned-out part of this economy, so you're already participating in the theme.

  For those of you who don't spend your weekends reading interwar economic journals, the title of this workshop—"Prices, Planning, and Prediction"—is basically a remix of the old Socialist Calculation Debate. You know the script. On one side, you have Mises and Hayek arguing that without market prices, you're flying blind. You can't calculate value because the knowledge you need isn't in any single head; it's dispersed, tacit, hidden in the act of trading itself. On the other side, you have Oskar Lange and the market socialists saying, "Hold on. Give us the data, give us the equations, and we can simulate the prices. We can plan."

  For the historians in the room, you know this terrain better than I do. But here's the angle I want us to wrestle with today, and this is for everyone: both sides assumed a sharp wall between two kinds of knowledge. There was "explicit" data—the stuff you can write down, process, and hand to a planning board. And there was "tacit" knowledge—the stuff Hayek said prices carry, the stuff you can't quite articulate.

  Hayek thought prices were the only way to move that tacit stuff. Lange thought explicit data was enough to run the show. Neither of them really named that split, and neither of them imagined a technology that could blur it.

  Until now.

  We're sitting in a moment where machine learning can digest explicit data and find patterns that look an awful lot like tacit knowledge. It's not a planning board in Lange's sense, but it's not a price mechanism in Hayek's sense either. It's something else.

  So, let's be clear about where we stand before we dive into the papers. There are settled questions, and there are live ones.

  What's settled? Pure central planning without price mechanisms failed. It failed in practice, and most of us agree it failed in theory. We aren't here to resurrect the Gosplan. That case is closed.

  What's open? Whether algorithmic prediction without prices counts as "planning" in the old sense, or if it's a new category entirely. Can an algorithm coordinate dispersed knowledge without actually generating prices? Is that planning, or is it just a really sophisticated form of guessing? That is the live wire.

  I want today to be rigorous, but I also want us to avoid fighting the battles of 1935. We have new tools, new data, and frankly, new problems. So let's use the old debate to structure the questions, not to answer them for us.

  There's plenty of coffee left, and lunch is at noon. Let's get to work.
