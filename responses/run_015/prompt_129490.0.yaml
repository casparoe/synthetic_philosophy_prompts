answer: |-
  **The Audit Procedure**

  This checklist translates quantitative genetics constraints into policy audit steps. Non-geneticists must verify statistical validity before considering equity implications.

  1.  **Individual vs. Population:** Question: Does the proposal apply group variance estimates to individual potential? **Hard Rejection** if yes. Narrow-sense heritability ($h^2$) partitions variance sources within a specific population; it is not an individual destiny metric. A sufficient answer acknowledges $h^2$ describes the population, not the child.
  2.  **Environmental Invariance (Hard Case 1):** Question: Does the proposal assume $h^2$ remains constant under environmental redistribution? **Hard Rejection** if yes. Heritability is contingent on the current environmental variance. If the policy changes the environment (e.g., universal tutoring), the variance partition changes. High $h^2$ does not imply environmental interventions are ineffective.
  3.  **Cross-Group Comparison (Hard Case 2):** Question: Are heritability estimates compared across ancestry groups with differing environmental ranges? **Hard Rejection** if yes. Differences in $h^2$ between groups often reflect differences in environmental variance, not genetic architecture. A sufficient answer requires evidence of equivalent environmental ranges.
  4.  **PGS Portability (Hard Case 3):** Question: Are polygenic scores (PGS) applied across ancestry groups without specific validation? **Hard Rejection** if yes. PGS trained on European-ancestry GWAS lose predictive accuracy and introduce bias in other groups due to linkage disequilibrium differences and population stratification.
  5.  **Normative Hand-off:** If statistical claims survive Steps 1–4, does the policy align with equity values? **Hand-off** to board. Statistics cannot determine whether genetic stratification is ethically permissible. This step addresses fairness, not factual accuracy.

  Proceed only if Steps 1–4 pass. Most proposals fail Step 2 or 4. If a proposal fails a Hard Rejection step, the audit stops; the statistical premise is invalid for the proposed context.

  **Case One: The Tracking Proposal**

  This proposal fails at Step 1 (Individual vs. Population), Step 3 (Cross-Group), and Step 4 (PGS Portability). The applicants argue that because educational-attainment heritability is high, environmental investment plays a minor role, justifying genetic tracking. This commits the environment-invariance fallacy (Step 2); high heritability in the current environment does not predict response to new environments. More critically, the proposal seeks to use polygenic scores in a racially diverse urban system. Current PGS for educational attainment are predominantly derived from European-ancestry genome-wide association studies. Applying these scores to non-European students violates the portability constraint (Step 4). Predictive accuracy drops precipitously across ancestries due to differences in linkage disequilibrium patterns and unmodeled environmental stratification.

  Furthermore, using PGS for individual placement treats a probabilistic population statistic as a fixed individual predictor (Step 1). Even within the training ancestry, PGS explains a limited portion of variance. In a diverse district, the error rates will be unevenly distributed, disproportionately misclassifying students from underrepresented ancestries. The argument that environment plays a minor role is statistically unsupported; heritability estimates do not measure the potential efficacy of environmental interventions. **Audit Outcome:** Hard Rejection. The statistical premises do not support the policy mechanism. The application exacerbates existing inequities without validated predictive utility, violating both statistical rigor and equity mandates.

  **Case Two: The Tutoring Memo**

  This legislative memo fails at Step 2 (Environmental Invariance) and Step 5 (Intervention Logic). The memo claims that because a specific cognitive trait has a heritability of 0.75, universal tutoring is not cost-effective. This reasoning assumes that because genes explain much of the variance in the *current* environment, changing the environment will not alter outcomes. This is statistically invalid. Heritability is a ratio of genetic variance to total phenotypic variance. If universal tutoring reduces environmental variance (by standardizing instruction) or increases mean performance, the heritability estimate itself may change, but more importantly, the mean shift can be substantial regardless of $h^2$.

  A classic counterexample is phenylketonuria (PKU), which is highly heritable but entirely managed via environmental intervention (diet). High heritability is compatible with high malleability. The memo treats heritability as a measure of immutability, which it is not. It also ignores that heritability estimates are specific to the range of environments sampled; introducing a universal program expands or shifts that range. **Audit Outcome:** Hard Rejection. The cost-effectiveness claim relies on a false dichotomy between genetic and environmental influence. The statistical basis for denying universal intervention is unsound. The board should not consider the funding request based on this genetic argument, as the premise contradicts established quantitative genetics principles regarding intervention efficacy.

  **Judgment Points and Value Hand-Offs**

  Once statistical validity is established (which is rare in these contexts), the board faces normative choices that statistics cannot resolve. The audit procedure clears factual misconceptions; the hand-off occurs where values dictate policy. Key judgment points include: (1) **Equity vs. Efficiency:** Is maximizing aggregate test scores worth potentially widening gaps based on biological markers? (2) **Risk Tolerance:** What false-positive rate in student placement is acceptable? Statistics can quantify error, but not whether the error is tolerable. (3) **Privacy and Consent:** Is collecting or utilizing genetic data permissible regardless of utility? (4) **Stigma:** Does labeling students based on biological markers violate dignity or reinforce deficit models?

  These are value judgments. A statistically valid proposal could still be ethically untenable. The board must decide if genetically informed policy aligns with state equity mandates. The audit ensures the debate is not corrupted by statistical errors, but the final decision rests on whether the state values genetic stratification as a legitimate tool for resource allocation. This hand-off protects the board from making ethical decisions based on false scientific premises while acknowledging that science cannot dictate ethics.

  **Settled Science vs. Contested Territory**

  **Settled:** Heritability is population-specific and environment-dependent; it is not individual destiny. High $h^2$ does not preclude environmental intervention efficacy. PGS portability across ancestries is currently poor and scientifically unsupported for individual prediction in diverse groups. Comparing $h^2$ across groups with different environmental ranges is invalid.

  **Contested:** The exact magnitude of confounding in PGS (e.g., population stratification vs. direct genetic effects) remains debated. The stability of $h^2$ under radical environmental equalization is theoretical, not empirically settled. The extent to which gene-environment correlation (passive/active) drives educational attainment estimates is actively researched. While the *direction* of bias is known (overestimation in stratified populations), the *degree* varies. The audit treats these contested areas conservatively: if the mechanism is contested, policy cannot rely on it as fact. We acknowledge uncertainty without presenting contested views as consensus, ensuring proposals bear the burden of proof for causal claims.
