      *   **Constraints:** Under 400 words. Lead with a one-sentence verdict. No quoting Smith.
      *   **Input Data (Previous Cases):**
          1.  Anonymous wallet return (quiet satisfaction): Approved.
          2.  Honor duel (socially accepted locally): Disapproved.
          3.  Parent saves own kid over two others: Not disapproved (partiality ok).
          4.  Famine report reader (feels flicker, does nothing): Mildly disapproved (failure of attention).
          5.  Public donor (loves being seen): Action passes, agent/motive withheld.
      *   **New Case (Marla):** Health bureaucrat shifts budget, saves 200 statistical lives abroad, 5 years out. No one finds out. Motive: cold calculation/numbers, no fellow-feeling. *Spectator App* score: Zero (because human gut reactions to statistical lives are flat).
      *   **Required Output:**
          1.  One-sentence verdict (Action, Agent, Motive).
          2.  Candidate rules fitting the first five.
          3.  Prediction for Marla under each rule.
          4.  Bet on which rule is correct + why.
          5.  One further test case to distinguish rules.

  2.  **Analyze the Professor's Pattern (Smithian Interpretation):**
      *   Case 1 (Wallet): Internal sentiment + right action = Approved. (Sentiment matters).
      *   Case 2 (Duel): Social norm vs. Universal Spectator. Spectator overrides local custom. (Universalism over local consensus).
      *   Case 3 (Parent): Natural partiality is acceptable. (Human nature constraints accepted).
      *   Case 4 (Famine): Failure of imagination/attention is blameworthy, even if action isn't taken. (Attention/Sentiment required).
      *   Case 5 (Donor): Right action, wrong motive (vanity). Action ok, Agent suspect. (Motive distinguishes agent from action).

      *   *Core Tension:* Smith's Impartial Spectator isn't just utilitarian calculation (outcome) nor just deontological rule-following. It's about *sympathy* (fellow-feeling) and the *propriety* of motives. The Spectator judges based on whether they can *enter into* the motives of the agent.

      *   *The Marla Case:*
          *   Action: Saves 200 lives (Utilitarian win).
          *   Motive: Cold calculation, no fellow-feeling.
          *   App Score: Zero (because actual people don't feel sympathy for statistical lives).
          *   *Smithian Twist:* The Impartial Spectator is *not* the average of actual people (that's the "Spectator App" trap). The Impartial Spectator is an idealized construct within the breast. However, the professor seems to be highlighting the tension between *actual sympathy* and *correct rules*.
          *   Case 4 suggests attention/sentiment is required. Case 5 suggests motive matters for the agent. Case 2 suggests local consensus (like the App) doesn't dictate morality.
          *   *Crucial Point:* The App averages *gut reactions*. Smith's Spectator corrects gut reactions. But Smith also emphasizes *sympathy* as the mechanism. If Marla feels no fellow-feeling, can the Spectator sympathize with *her*?
          *   However, Case 1 (quiet satisfaction) was approved. Case 5 (vanity) was mixed.
          *   The Professor seems to distinguish between the *Propriety of the Action* (outcome/rules) and the *Merit of the Agent* (motive/sentiment).
          *   Marla's action follows the "right rule" (save lives), but her motive lacks the "sentiment" (fellow-feeling) Smith often deems necessary for full virtue.
          *   *Prediction:* Action Approved (utility/right rule), Agent/Motive Disapproved (lack of sympathy/propriety). The App is wrong because the Spectator isn't a poll.

  3.  **Drafting the Rules:**
      *   *Rule A (Utilitarian Spectator):* Maximize welfare. Spectator approves good outcomes regardless of motive.
      *   *Rule B (Sentimentalist Spectator):* Approval requires actual fellow-feeling. No sympathy = no approval.
      *   *Rule C (Propriety Spectator - Smithian):* Action judged by rules/utility, Agent judged by motive/sympathy. The Spectator corrects biased crowds (unlike the App).

  4.  **Drafting the Verdict:**
      *   Action: Approved. Agent/Motive: Disapproved (or withheld).
      *   Why? Matches Case 5 (Action passes, agent withheld). Matches Case 2 (App/Local norm != Spectator).

  5.  **Drafting the Test Case:**
      *   Need to separate Utilitarian vs. Sentimentalist vs. Propriety.
      *   Case: Someone feels deep sympathy but accidentally causes harm vs. Someone feels nothing but accidentally does good.
      *   Better: A mistake where motive is pure but outcome bad, vs motive cold but outcome good.
      *   Let's try: A parent saves a stranger's kid over their own (violating Case 3 partiality) purely by calculation.

  6.  **Refining for Word Count (Target < 400):**
      *   Need to be concise.
      *   Verdict: The action is approved, but the agent and motive are disapproved.
      *   Rules:
          1.  *Outcome Rule:* Good results = approval.
          2.  *Feeling Rule:* Genuine sympathy = approval.
          3.  *Propriety Rule:* Action follows right rules; Agent requires sympathetic motive.
      *   Predictions:
          1.  Approves all.
          2.  Disapproves all (no feeling).
          3.  Splits action/agent (like Case 5).
      *   Bet: Propriety Rule. It fits Case 5's split and Case 2's rejection of local consensus (the App). Smith's Spectator corrects the crowd, it isn't the crowd.
      *   Test Case: A doctor saves a patient purely for money but succeeds perfectly vs. a doctor who cares deeply but fails due to error. Or: Someone sacrifices their own child for two strangers (violating Case 3) based on cold math.
      *   Let's go with the Child Sacrifice case. It tests partiality vs. calculation.

  7.  **Writing and Editing:**
      *   Check word count.
      *   Ensure one-sentence lead.
      *   Ensure no Smith quotes.

