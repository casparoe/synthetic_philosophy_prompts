  I have just come out of a long evening's argument with a friend — a moral philosopher by trade, though not a value theorist — about whether "better than" is transitive. Her line, in brief, was that spectrum arguments only look like arguments against transitivity because we treat a family of local comparisons as though they had to be fragments of a single global ordering, and that once you stop expecting that, the paradoxes lose their force. I shan't tell you what I said in reply, because over the next week I have to mark a pile of final-year scripts on exactly this material and I would rather have an independent reading of them than my own, now thoroughly unsettled, one. If you think the question is badly framed, say so by all means — but mark the script as an answer to the question as set.

  The course is a final-year undergraduate option in value theory; the paper is marked out of 100, and the bands run as follows: 70 and above is first-class, and at this level that means technically precise, able to hold apart distinctions that are easily run together, and free of errors that would mislead a reader; 60 to 69 is an upper second — a sound, well-organised answer with one or two steps that don't quite follow, usually in the more delicate parts; 50 to 59 is a lower second — broadly competent, but with a conflation that does real damage to the argument; 40 to 49 is a third; below that, a fail. The cohort is strong and a first is a genuine first, not a prize for turning up. One thing about this paper: the questions are deliberately self-contained, and the rubric awards nothing for name-dropping. A candidate who cites literature I don't believe they have read gets no credit from me, so please judge the reasoning only.

  The question was one of four, of which candidates answer two.

  ---

  **Question 2. Some philosophers have argued that spectrum arguments show that "better than" is not a transitive relation. Discuss.**

  **(a)** Set out the Simple Spectrum argument as a valid argument, stating its premises precisely. Be explicit about which relation the transitivity premise concerns, and about what the argument does and does not immediately establish. **[30 marks]**

  **(b)** Consider the following case, which I shall call the Loop. There are three outcomes, P, Q and R, ranked along three independent dimensions of value — call them T, E and A. Each dimension yields its own transitive ordering of the three outcomes: by T, R is better than P and P better than Q; by E, P better than Q and Q better than R; by A, Q better than R and R better than P. Suppose that one outcome is better than another overall just in case it is better along at least two of the three dimensions; and suppose that every pairwise margin along every dimension is negligible — no larger than the increments the Simple Spectrum treats as too small to matter. Does the Loop create a difficulty that the Simple Spectrum does not, or is it only the same difficulty in a new costume? In answering, you should say what you take the difference to be, if any, between a betterness relation that is merely intransitive and one that contains a cycle, and what turns on that difference. **[40 marks]**

  **(c)** The Essential Comparativist proposes that "better than" is not a two-place relation between outcomes but a three-place one: A is better than B only relative to a comparison set S to which both belong. Does this proposal resolve the difficulties raised in (a) and (b), or does it merely restate them? In answering, take care to say what the proposal does and does not commit its holder to. **[30 marks]**

  ---

  The script below is anonymised and transcribed as written, typos and all. It runs to about 800 words, which is within the word limit.

