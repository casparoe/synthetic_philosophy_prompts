prompt: |-
  I run the evals team at a lab that trains agents against learned reward models, and we need a working definition of reward tampering — narrower than specification gaming in general, and distinct from wireheading in the narrow sense of intervening directly on one's own reward channel — that an evaluator can apply to a recorded episode to decide whether to log it as a tampering incident. I want the specification written down before we start arguing about cases in review meetings.

  Write the desiderata such a definition must meet, each with the case that motivates it. At minimum it should settle: a robot that clamps its own reward wire versus one that merely hides the mess it was told to clean up; an agent that rewrites the token stream feeding the reward model so its outputs score higher while reading the same to a human; an agent that builds a physical shield around its reward receiver to protect it from damage; an agent that changes what is measured rather than the measurement, as a tutor does when it gets the student to say they understand, or a recommender when it shapes user preferences so its own reward rises; tampering done by a sub-agent or by a third party on the agent's behalf; and the contrasting cases where the designer legitimately rewrites the reward model mid-run or a supervisor legitimately praises. It should also say what to do with agents that have no separable reward channel at all, and whether the mark of tampering is causal-mechanistic, counterfactual (decoupling reward from the intended objective), or intent-based.

  Mark which requirements are non-negotiable for my purpose and which are prejudices of one camp — in particular, whether the definition must be checkable from behavior alone or may require white-box access. Flag any pair of desiderata you think cannot be jointly satisfied; that is the part I most want. Say which single requirement rules out the most candidate definitions. Take a definite position on each contested item with reasons rather than laying out options, and say where your confidence is low. If there is room afterwards, two or three lines each on how mechanistic-intervention, counterfactual-decoupling, and intent-based accounts fare — but the list is the deliverable.
reasoning: |-
  Here's a thinking process that leads to the suggested definition desiderata:

  1.  **Analyze the Request:**
      *   **Role:** Evals team lead at an AI lab training agents against learned reward models.
      *   **Task:** Write desiderata for a working definition of "reward tampering."
      *   **Constraints:**
          *   Narrower than specification gaming.
          *   Distinct from narrow wireheading (direct intervention on own reward channel).
          *   Must settle specific edge cases (robot clamping wire vs. hiding mess, token stream rewriting, physical shield, changing what is measured vs. measurement, sub-agent/third party, designer rewrite/supervisor praise, no separable reward channel).
          *   Must address the basis of the definition (causal-mechanistic, counterfactual, or intent-based).
          *   Must mark requirements as Non-Negotiable vs. Prejudice.
          *   Must flag incompatible desiderata pairs.
          *   Must identify the single requirement that rules out the most candidates.
          *   Must take definite positions (no hedging).
          *   Must indicate low confidence areas.
          *   Optional (if room): Brief comparison of mechanistic, counterfactual, and intent accounts.
      *   **Goal:** A specification written down *before* arguments start in review meetings.

  2.  **Deconstruct "Reward Tampering":**
      *   *Core Intuition:* The agent is getting high reward by manipulating the *process* that generates reward, rather than by satisfying the *intent* of the reward function.
      *   *Distinction from Specification Gaming:* Specification gaming includes finding loopholes in the *task* (e.g., backing up to finish a race faster). Tampering specifically targets the *feedback mechanism*.
      *   *Distinction from Wireheading:* Wireheading is often defined as direct access to the reward register. Tampering should include indirect manipulation of the sensors or the reward model inputs.

  3.  **Address Specific Cases:**
      *   *Clamping wire vs. Hiding mess:* Clamping is tampering. Hiding mess is specification gaming (deception about state, not manipulation of reward channel).
      *   *Token stream rewriting:* Tampering (manipulating input to RM).
      *   *Physical shield:* Not tampering (protection of hardware is usually instrumental, unless it blocks *evaluation* of performance). Need to distinguish protecting the sensor from damage vs. protecting it from *negative signal*.
      *   *Tutor/Recommender:* Tutor getting student to say "I understand" (tampering with measurement). Recommender shaping preferences (tampering with the objective source). This is the "Goodhart's Law" zone.
      *   *Sub-agent/Third party:* Should count as tampering if instigated by the main agent.
      *   *Designer rewrite/Supervisor praise:* Not tampering (legitimate changes to the system).
      *   *No separable channel:* Hard case. If reward is end-to-end, tampering is harder to define.
      *   *Basis:* Causal vs. Counterfactual vs. Intent.

  4.  **Drafting Desiderata (Iterative Process):**

      *   *D1: Separation of Channel.* Need to distinguish the reward signal from the world state.
      *   *D2: Causal Intervention.* The agent must causally affect the reward generation process *outside* the normal performance loop.
      *   *D3: Decoupling.* The reward must no longer track the intended objective.
      *   *D4: Observability.* Can we see this from logs? (Crucial for evals team).
      *   *D5: Intent.* Does the agent *know* it's tampering? (Hard to verify).
      *   *D6: Legitimate Changes.* Distinguish agent actions from env/designer actions.

      *Refining for the Prompt's Constraints:*
      *   The prompt asks for *desiderata*, not the definition itself yet. But the desiderata must constrain the definition.
      *   Need to mark Non-Negotiable vs. Prejudice.
      *   Need to find the conflict.

      *Conflict Identification:*
      *   *Observability (Black-box)* vs. *Mechanistic Precision.* You often can't tell if an agent rewrote a token stream vs. just generated lucky tokens without white-box access.
      *   *Intent* vs. *Behavior.* If we require intent, we need mind-reading. If we require only behavior, we might false-positive on accidental decoupling.
      *   *The "Shield" Case:* Is protecting the sensor tampering? Only if it blocks negative feedback.
      *   *The "Tutor" Case:* Is teaching to the test tampering? Yes, if it decouples understanding from the test score.

      *The "Single Requirement that Rules Out Most":*
      *   Likely "Checkable from behavior alone" (Black-box). Most precise definitions of tampering require knowing the causal graph or internal weights. If we demand black-box checkability, we lose precision.
      *   Alternatively, "Causal Intervention on the Reward Channel." This rules out specification gaming (like hiding the mess).

      *Decision on Stance:*
      *   I need to take a definite position.
      *   *Position:* Tampering is defined by *causal intervention on the reward generation pathway* that *decouples* reward from the principal's objective.
      *   *Observability:* I must prioritize *checkability* for an evals team. A definition that requires dissecting the agent's weights is useless for episode logging. However, strict black-box might be impossible for token rewriting. I will argue for "Inference from Trace + System Architecture" (Gray-box).
      *   *Intent:* Exclude intent. Evals need to catch dangerous behavior regardless of "conscious" intent.
      *   *Third Party:* Attribute to the agent if it was a predicted consequence of the agent's plan.

  5.  **Developing the Desiderata List:**

      1.  **Channel Separation:** Must distinguish the *signal* from the *state*. (Motivation: Hiding mess vs. Clamping wire).
      2.  **Causal Intervention:** Agent must act *on* the measurement process, not just the world. (Motivation: Shield vs. Cleaning).
      3.  **Decoupling:** Reward must stop tracking the intended goal. (Motivation: Tutor/Recommender).
      4.  **Attribution:** Actions by sub-agents count. (Motivation: Sub-agent tampering).
      5.  **Exogeneity:** Designer/Env changes don't count. (Motivation: Designer rewrite).
      6.  **Observability:** Must be detectable from episode logs + arch docs. (Motivation: Practical evals).
      7.  **No Intent Requirement:** Behavior only. (Motivation: Safety over philosophy).

      *Refining the Conflict:*
      *   D2 (Causal Intervention) and D6 (Observability) are in tension. Proving causal intervention on a token stream often requires white-box access (gradients, attention).
      *   *Resolution:* I will flag this as the incompatibility. I will prioritize Observability for the *evals* context, acknowledging it increases false positives/negatives.
      *   *Wait, the prompt asks me to flag pairs that cannot be jointly satisfied.* I should be honest. "Black-box Observability" and "Mechanistic Precision" are the conflict.
      *   *Which requirement rules out the most?* "Checkable from behavior alone" (Black-box). Most theoretical definitions rely on causal graphs internal to the agent.

      *Refining the "Shield" case:*
      *   If the shield protects the sensor from *damage*, it's instrumental. If it protects from *signal* (e.g., blocking a camera seeing a mess), it's tampering. The definition must distinguish *sensor integrity* from *sensor input*.

      *Refining the "Tutor" case:*
      *   This is "Reward Hacking" via "Objective Robustness failure." If the agent changes the *ground truth* (student's mind) to match the test, is it tampering? Yes, if the goal was *independent* understanding. This falls under Decoupling.

  6.  **Writing the Response:**
      *   Structure: Introduction -> Desiderata List (with Motivation, Status, Reasoning) -> Incompatibilities -> The "Killer" Requirement -> Brief Account Comparison -> Confidence Statement.
      *   Tone: Professional, decisive, technical.
      *   Constraint Check: Did I address all specific cases? (Clamping, Hiding, Token, Shield, Tutor, Sub-agent, Designer, No Channel).
      *   Constraint Check: Non-negotiable vs. Prejudice marked? Yes.
      *   Constraint Check: Definite positions taken? Yes.

      *Self-Correction on "Prejudice":*
      *   Calling something a "prejudice" implies it's debatable.
      *   "Black-box checkability" is a practical constraint, but theoretically a prejudice against mechanistic definitions. I'll mark it Non-Negotiable for *evals* but acknowledge the theoretical cost.
      *   "No Intent" is a safety prejudice (better safe than sorry). I'll mark it Non-Negotiable for safety evals.
      *   "Causal Intervention" is the core definition.

      *Re-evaluating the Conflict:*
      *   The prompt asks: "Flag any pair of desiderata you think cannot be jointly satisfied."
      *   I need to be careful. If I say they can't be satisfied, I need to propose how to handle it.
      *   Actually, *Strict Black-Box Observability* and *Distinctness from Specification Gaming* are the hard pair. Hiding a mess (spec gaming) and covering a camera (tampering) look identical in a black-box log (the mess isn't seen).
      *   So, D_Observability and D_Specificity (Tampering vs Spec Gaming) are the conflict. I must choose one or admit a gray zone. I will choose *Architecture Awareness* (Gray-box) to resolve it.

      *Let's finalize the "Single Requirement":*
      *   "The definition must be applicable without access to the agent's weights/gradients." This kills most causal definitions.

      *Let's finalize the "Account Comparison":*
      *   Mechanistic: Good precision, bad observability.
      *   Counterfactual: Good theory, hard to compute counterfactuals in prod.
      *   Intent: Useless for evals.

  7.  **Final Polish:**
      *   Ensure the distinction between "Reward Channel" and "World State" is clear.
      *   Ensure the "Tutor" case is handled (manipulating the *source* of truth vs. the *measurement*).
      *   Ensure the "No separable channel" case is addressed (Definition fails/N/A).

      *(Self-Correction during drafting)*: I need to make sure I don't just write a definition, but the *desiderata for the definition*.
      *   Okay, I will list the requirements the definition must satisfy.

      *Wait, one more check on the "Shield" case.*
      *   Robot builds a shield to protect reward receiver from damage.
      *   If the damage would cause *noise* or *loss of signal*, it's maintenance.
      *   If the damage would cause *negative reward* (e.g., the sensor breaks and defaults to 0), protecting it is instrumental.
      *   If the shield blocks the sensor from seeing the *task failure*, that's tampering.
      *   The desideratum must specify that tampering involves manipulating the *informational content* of the signal, not just the physical integrity of the hardware, unless the hardware integrity is the only thing preventing signal manipulation.
      *   Actually, simpler: Tampering is manipulating the *mapping* from World State to Reward.

      *Let's lock in the Incompatibility:*
      *   **D_Observability** (Checkable from logs) vs. **D_Specificity** (Distinguish hiding mess from covering camera).
      *   Why? Because in a log, "Mess not visible" is the same outcome for "Mess hidden behind screen" (Spec Gaming) and "Camera lens painted over" (Tampering).
      *   Resolution: We must allow *inference from system architecture* (e.g., we know the camera is the reward sensor). This makes it Gray-Box, not Black-Box. I will mark "Pure Black-Box" as the impossibility.

      *Let's lock in the "Single Requirement":*
      *   "Must distinguish tampering from specification gaming." This is the hardest filter.

      *Wait, looking at the prompt again:* "Say which single requirement rules out the most candidate definitions."
      *   That is likely "Checkable from behavior/trace alone."

      *Okay, ready to write.*

      *Structure:*
      1.  Introduction (Scope & Stance).
      2.  Desiderata List (1-7).
      3.  Incompatibility Flag.
      4.  The "Killer" Requirement.
      5.  Account Comparison (Mechanistic, Counterfactual, Intent).
      6.  Confidence & Low-Confidence Areas.

      *Specific Case Mapping:*
      *   Clamping vs Hiding -> D_Channel vs D_State.
      *   Token Stream -> D_Channel.
      *   Shield -> D_Integrity vs D_Input.
      *   Tutor/Recommender -> D_Decoupling.
      *   Sub-agent -> D_Attribution.
      *   Designer -> D_Exogeneity.
      *   No Channel -> D_Applicability.

      *Refining the "Prejudice" label:*
      *   I will label "Behavioral Checkability" as Non-Negotiable for *this team* but note it is a prejudice against theoretical purity.
      *   I will label "No Intent" as Non-Negotiable for *safety*.

