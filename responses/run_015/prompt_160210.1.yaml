          *   *Crucial Conflict:* If (1) is true (Macroscopic Determinism), then the state *does* fix the future. (6) says if no law forbids prediction, it's epistemic. But (2) says prediction is impossible *in principle* for internal agents. Does "in principle impossible for internal agents" count as a metaphysical limitation on *predictability*, or just an epistemic limitation on *knowledge*?
