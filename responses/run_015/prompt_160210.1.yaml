          *   *Analysis:* Is "fitting inside the universe" a law? It's a boundary condition/physical constraint. (6) draws a hard line: Law = Metaphysical, Else = Epistemic. (2) argues for a "Practical in Principle" limit. This creates a category error. Is the impossibility of a Laplacian Demon *inside* the universe a metaphysical fact about the universe's structure, or just an epistemic limit of agents?
