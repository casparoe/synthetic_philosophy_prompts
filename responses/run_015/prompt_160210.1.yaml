      *   **Rank 1 (Critical): (1) vs. (4).** Physics inconsistency. If QM is indeterministic (4), the macroscopic world is not strictly deterministic (1), unless you specify a hidden variable theory or Many Worlds (which the statement doesn't). This is the biggest target for a Physics & Philosophy tutor.
      *   **Rank 2 (High): (3) vs. (7).** Philosophical inconsistency on the *source* of freedom. (3) says freedom needs unpredictability (to the agent). (7) says freedom survives predictability (by others). If (7) is true, (3)'s justification is unnecessary/weak. If (3) is true, (7) needs careful qualification (why does her knowing not close the future?).
      *   **Rank 3 (Moderate): (1) vs. (2) vs. (6).** Definition of "In Principle." (1) says state fixes future. (2) says prediction impossible in principle. (6) says only laws make things metaphysical. If prediction is impossible "in principle" due to universe size, is that a law? If so, (6) calls it metaphysical, but (1) calls the world deterministic.
      *   **Rank 4 (Low): (5).** Just an example, fits with (2). No tension.

