      *   **Tension B: (1) vs. (2) vs. (6).**
          *   (1) Macroscopic world is deterministic.
          *   (2) Chaos + Measurement limits make prediction impossible *in principle* for internal agents.
          *   (6) A limitation is epistemic unless a *law* forbids it.
