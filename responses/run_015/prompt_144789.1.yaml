answer: |-
  ### Ranking of Regimes by Democratic Latency

  Applying the framework of **democratic latency** to Spinoza's political taxonomy requires measuring the degree to which the formal structure of the state obscures or reveals the *potentia multitudinis* (power of the multitude). In Spinoza's ontology, sovereign right is coextensive with power; therefore, a regime with low latency is one where the formal decision-making procedures align closely with the actual capacity of the multitude to act according to reason. A regime with high latency is one where formal authority is alienated from the multitude, relying on fiction, affect, or structural barriers to maintain stability.

  Based on Spinoza's arguments in the *Theological-Political Treatise* and the *Political Treatise*, the regimes are ranked below from highest latency (most concealment) to lowest latency (most transparency).

  ---

  ### 1. Monarchy
  **Democratic Latency Score: 0.9**

  **Justification:**
  Monarchy exhibits the highest democratic latency because its formal procedure—the decree of a single will—structurally conceals the reality that sovereign power actually resides in the multitude. Spinoza argues that one man cannot possibly attend to all affairs of state; therefore, the "will of the King" is necessarily a fiction masking the deliberations of a council.

  *   **Council Composition and Size:** To prevent the collapse of the regime into tyranny (which destroys the state's power), Spinoza insists the King must be advised by a large, representative council. However, formally, the decision is attributed to the Monarch. This creates a maximal structural distance: the actual rational agency of the counselors (who represent the multitude's interests) is hidden behind the formal persona of the One.
  *   **Psychological Dynamics:** This regime relies heavily on the affects of fear and superstition to maintain the illusion of the King's singular power. The multitude obeys not necessarily because they recognize the rationality of the law, but because they are conditioned to revere the office. This reliance on passion rather than reason increases latency, as obedience is secured through the suppression of the multitude's critical agency rather than its activation.
  *   **Accessibility of Sovereign Power:** Accessibility is formally closed. The multitude cannot directly exercise sovereign right; they are subjects, not participants. The structural distance is near-total because the formal mechanism (monarchical decree) is the inverse of the actual mechanism (collective support and council deliberation).

  ### 2. Aristocracy
  **Democratic Latency Score: 0.5**

  **Justification:**
  Aristocracy occupies the middle of the spectrum. It acknowledges the necessity of collective deliberation more than monarchy but introduces a structural filter between the multitude and the sovereign power. The latency here is moderate because the formal procedure (council voting) matches the actual exercise of agency (deliberation), but only for a select subset of the population.

  *   **Council Composition and Size:** Spinoza emphasizes that the Supreme Council must be large enough (proportional to the populace) to ensure that laws are dictated by reason rather than factional passion. If the council is sufficiently large, it mimics the rationality of the multitude. However, because membership is restricted to patricians chosen by co-optation, there is a structural gap between the ruling body and the common people. The formal procedure is rational, but it is not fully *collective* in the universal sense.
  *   **Psychological Dynamics:** This regime shifts the psychological basis from fear (monarchy) to ambition and honor within the council. While this encourages rational deliberation among the rulers, the excluded multitude obeys laws they had no hand in framing. Their obedience is based on utility and the stability of the state, but the lack of direct agency creates a latency of 0.5: the rational agency is present in the state, but it is not the agency of the *whole* multitude.
  *   **Accessibility of Sovereign Power:** Accessibility is limited by class or selection. While the path to power is institutionalized rather than hereditary (as in monarchy), the sovereign power is still alienated from the majority. The formal structure reveals the collective nature of rule, but conceals the exclusion of the non-patrician multitude.

  ### 3. Democracy
  **Democratic Latency Score: 0.1**

  **Justification:**
  Democracy represents the limit of minimal democratic latency. In Spinoza's conception, this is the "most natural" regime because it least contradicts the freedom of nature. Here, the formal decision-making procedure is identical to the actual exercise of collective rational agency. The sovereign *is* the multitude organized; therefore, there is almost no structural distance between the ruler and the ruled.

  *   **Council Composition and Size:** In a democracy, the "council" is effectively the assembly of the citizenry (or their direct delegates). Spinoza argues that when all transfer their right to the whole society, they remain equal parts of that whole. The size of the decision-making body is maximized to include all qualified citizens, minimizing the distortion of the general will. The formal procedure (voting/lawmaking) is a direct expression of the multitude's *potentia*.
  *   **Psychological Dynamics:** This regime minimizes fear and maximizes rational deliberation. Because citizens obey laws they have prescribed to themselves, obedience is not a surrender of judgment but an exercise of reason. The affective basis shifts from external coercion to internal recognition of utility. This alignment reduces latency to near zero, as the psychological state of the subject aligns with the formal status of the citizen.
  *   **Accessibility of Sovereign Power:** Accessibility is conceptually universal (within the bounds of Spinoza's historical exclusions, such as women or servants, which we treat here as contingent rather than essential to the definition). The sovereign power is fully accessible because every individual is a constituent part of the sovereign. The score is 0.1 rather than 0 to account for the necessary mediation of laws and institutions, which always create a minimal distance between immediate impulse and rational collective agency.

  ---

  ### Summary of Ranking

  | Regime | Democratic Latency Score | Structural Characteristic |
  | :--- | :--- | :--- |
  | **Monarchy** | **0.9** | Formal singularity conceals collective dependence. |
  | **Aristocracy** | **0.5** | Formal deliberation restricted to a subset of the multitude. |
  | **Democracy** | **0.1** | Formal procedure aligns with the total power of the multitude. |

  This ranking demonstrates that for Spinoza, political stability and freedom are not achieved by suppressing the multitude, but by institutionalizing its power. High democratic latency (Monarchy) creates a fragile state dependent on passion and fiction, while low democratic latency (Democracy) creates a robust state grounded in the rational agency of the whole.
