answer: |-
  **Grade: 78/100 (C+)**

  ### Point-by-Point Breakdown

  **1. Definition of the Inefficacy Objection (10/10 points)**
  *   **Correct:** The student accurately defines the core claim: individual acts do not change outcomes, therefore no moral duty exists.
  *   **Note:** This is standard and sufficient for the first clause of the prompt.

  **2. Causal Structures: Climate and Voting (20/20 points)**
  *   **Correct:** The distinction between continuous harm (climate) and discrete harm (voting) is accurately drawn.
  *   **Correct:** The classification of both as "overdetermined" is philosophically sound within the context of this objection.
  *   **Minor Imprecision:** The claim that one ballot *never* breaks a tie is factually absolute where "vanishingly small probability" is more accurate, but this is acceptable shorthand in this context.

  **3. Causal Structures: Meat Consumption (5/20 points)**
  *   **Major Error:** The claim that supply elasticity is "near 1" and that a purchase "causes one specific cow to be raised and killed" is philosophically contentious and likely incorrect based on standard course literature (e.g., Singer, Norcross).
  *   **Why this matters:** Standard arguments posit that due to bulk ordering and buffer stocks, individual purchases do not trigger specific slaughter events 1:1. Instead, they create a *probabilistic* expectation of harm. The student treats meat consumption as causally certain (direct harm) rather than probabilistic (market-mediated threshold).
  *   **Hasty Grader Trap:** A quick read might see "supply-chain elasticity" and assume the student understands the economic mechanism. Do not award points for vocabulary usage without verifying the claimed ratio (1:1) aligns with the assigned readings.

  **4. Expected-Value (EV) Reasoning Application (15/25 points)**
  *   **Partial Credit:** The application of EV to voting (tiny chance × huge stakes) is correct.
  *   **Internal Contradiction:** The student argues the inefficacy objection *collapses* for meat because of direct causation (one specific cow), but then argues EV reasoning *saves* meat.
      *   *Logic Check:* If the student's earlier claim were true (that buying meat definitely kills a cow), EV reasoning would be unnecessary for meat; the obligation would be based on direct harm, not probability. By invoking EV for meat, the student undermines their own claim about causal certainty.
  *   **Oversimplification:** The answer states the moral structure is "identical across domains." This ignores the distinction between *threshold* problems (voting/meat) and *marginal contribution* problems (climate), which usually results in EV functioning differently across the three.

  **5. Evaluation of "Fails Differently" Prompt Requirement (10/25 points)**
  *   **Missed Nuance:** The prompt explicitly asks to evaluate whether EV "fails differently in each case." The student answers that it "works the same everywhere."
  *   **Why this loses points:** This dismisses the comparative element of the prompt. In the literature, EV rescues voting via *pivotality*, climate via *aggregate marginal harm*, and meat via *expected utility of thresholds*. Treating them as identical ignores the specific causal mechanisms requested in the first half of the prompt.

  ### Specific "Hasty Grader" Alerts
  *   **The Elasticity Claim:** Do not skim past the "elasticity near 1" sentence. This is the most common substantive error in this specific exam question. If your course material followed the standard "probabilistic harm" model for meat, this statement invalidates the subsequent conclusion about meat.
  *   **The EV Contradiction:** The student argues meat is *causally certain* (para 1) but requires *probabilistic rescue* (para 2). A quick read sees "EV saves everything" and marks it correct. A close read reveals the student has contradicted their own causal analysis of meat.
  *   **Prompt Compliance:** The prompt asks for an evaluation of differential failure ("fails differently"). The student asserts identity ("works the same"). Ensure points are deducted for failing to engage with the specific comparative question asked, even if the EV theory itself is explained correctly.
