          *   Final Stance: Classical is the correct ontology for the mathematician/physicist; Constructive is the correct methodology for the computer scientist/engineer. Since the question is about the *foundations of mathematics* (truth/existence), Classical wins.

  6.  **Refining the IVT Explanation:**
      *   Classical: $f(a)<0, f(b)>0 \implies \exists c, f(c)=0$. Proof uses nested intervals (Bolzano).
