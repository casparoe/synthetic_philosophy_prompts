          *   $\neg A$: Proof that $A$ leads to absurdity.
      *   *Rejection of LEM ($A \lor \neg A$):* We don't always have a proof of $A$ or a proof of $\neg A$. To assert LEM is to assert omniscience.
      *   *Rejection of DNE ($\neg \neg A \to A$):* Knowing it's impossible for $A$ to be false doesn't give a construction of $A$.
      *   *The IVT Example:* Classical IVT says $\exists c, f(c)=0$. Constructively, we can't necessarily *find* $c$ to arbitrary precision without more info (like knowing $f$ doesn't "hover" around zero). The constructive version usually requires an approximate zero or additional conditions on $f$ (like being locally non-zero).

  3.  **Deconstruct the Classical Case:**
