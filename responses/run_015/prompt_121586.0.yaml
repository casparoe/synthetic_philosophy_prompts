prompt: |-
  I run grant decisions at a small foundation that funds early-stage, high-risk science: about eight proposals a month, a rotating panel of four or five reviewers who are smart but usually only adjacent to the subfield in question, one ninety-minute meeting, and then a public one-paragraph rationale for every decision that goes up on our site. The board ratifies the list each quarter and has to be able to defend it to their friends. Here's what's been eating me: our decisions are public, other funders and the whole field read them, and I'm pretty sure that some of what looks like emerging consensus in the proposals crossing my desk is just people copying each other — reviewers who've all read the same three preprints, all citing the same one benchmark dataset, all saying some version of "well, the big lab is already doing this" — and I'm equally sure some of it is genuine information moving through the community and I'd be an idiot to ignore it. I can't tell which is which, and I have maybe fifteen minutes a case.

  So: build me a decision procedure the panel can actually run, grounded in whatever the sequential-herding literature really establishes — I mean the standard setup where people move in turn, see what earlier people did but not what they knew, and at some point it becomes individually rational to copy and stop contributing their own information at all, plus the reputational version where people copy because being wrong alone is worse than being wrong in a crowd, plus whatever is known about how fragile those states are and what does and doesn't break them. But operationalized: the questions in order, what counts as a sufficient answer to each, where the procedure just stops with a no, and where it hands the decision back to me because it's really a question about our risk appetite rather than about evidence. Assume I will almost never get a calibrated probability out of these people — say what to do when there's no number to be had. And be straight with me about which steps are real machinery and which are judgment calls wearing a lab coat.

  It has to handle at least these: (1) cascade inside the room, since our board member speaks first and the junior reviewers visibly defer; (2) agreement that looks independent but isn't, because everyone's signal came from the same two papers and the same benchmark; (3) the "if it were worth doing somebody would have done it by now" move, i.e. treating absence of uptake as evidence, when sometimes the absence is the cascade; (4) our own past write-ups feeding the thing we're trying to detect — I've been running a quarterly round where we re-review the most-rejected proposals with the prior verdicts and our old rationales redacted, which I call the reversal round, and I genuinely don't know whether it buys anything when the reviewers are the same people who can't un-know what they already said; (5) a rule I invented and will kill if you tell me to — if a panel comes out unanimous, I assign someone to write a minority report even when they agree. Does manufactured dissent carry information or is it just noise with a stamp on it?

  Then run it on three cases. First, a method that went from nobody to everyone in about eighteen months: three other funders have already funded variants, my panel is unanimous and enthusiastic, and not one of them can name a reason that isn't a restatement of "everyone's moving this way." Second, a replication-and-negative-results project in a subfield that is extremely confident about its result: nobody has funded it, and the one written review we have says the quiet part out loud about nobody having done it. Third, the one where I want you to tell me something I won't like: two years ago we rejected a proposal and published a fairly dismissive paragraph about it, and since then two other funders have passed on it citing our write-up; a revised version has now come back to us and the panel's private scores are actually decent. Say what the procedure says, including what we should write publicly this time — and if the honest output is that we should eat crow loudly because a loud reversal does more than a quiet one, or that we should fund something we think is mediocre because the point of the money is to buy a signal nobody else is going to generate, say that plainly.

  Finally, tell me what the procedure can't do: the failure modes, the cases where it will definately misfire, and which outputs I should refuse to trust.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Deconstruct the Request:**

      *   **Context:** Small foundation, early-stage/high-risk science, 8 proposals/month, 4-5 reviewers (adjacent experts), 90-min meeting, public 1-paragraph rationale, Board ratification (needs defensibility).
      *   **Problem:** Distinguishing between genuine information cascades (good consensus) and informational herding/cascades (bad consensus/copying). Reviewers copy preprints, benchmarks, and "big lab" signals.
      *   **Constraint:** 15 minutes per case. No calibrated probabilities from reviewers.
      *   **Theoretical Basis:** Sequential herding literature (Bikhchandani et al.), reputational herding (Scharfstein/Stein), fragility of cascades.
      *   **Specific Issues to Address:**
          1.  Internal cascade (Board member speaks first).
          2.  Illusory independence (same 2 papers/benchmarks).
          3.  Absence of evidence vs. evidence of absence ("if it were worth doing...").
          4.  Feedback loop (past write-ups influencing new reviews).
          5.  Manufactured dissent (minority reports on unanimous decisions).
      *   **Deliverables:**
          1.  A step-by-step decision procedure (questions, stop conditions, hand-offs).
          2.  Distinction between "real machinery" and "judgment calls."
          3.  Application to three specific cases (Bandwagon, Negative/Replication, Rejected/Returned).
          4.  Limitations/Failure modes.
      *   **Tone:** Direct, operational, honest about uncertainty, no fluff.

  2.  **Theoretical Grounding (Mental Check):**

      *   *Informational Cascades (Bikhchandani, Hirshleifer, Welch):* People observe actions of predecessors, ignore private signals if public action outweighs private info. Fragile: small new info can break it.
      *   *Reputational Herding (Scharfstein, Stein):* Managers/agents mimic others to avoid looking like outliers if wrong. "Safety in numbers."
      *   *Fragility:* Cascades are based on limited public info. Introducing *new* private info or changing the order of revelation breaks them.
      *   *Application:* The goal is to force private signals into the open before public actions solidify.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Goal:* Break the cascade *inside* the room and detect cascades *outside* the room.
      *   *Step 1: Pre-Meeting (The Setup).* Need to stop the Board Member from speaking first. Need to identify common sources.
      *   *Step 2: The Meeting (The Revelation).* Need to extract private signals.
      *   *Step 3: The Decision (The Threshold).* When to fund, when to reject, when to escalate to the Director (User).
      *   *Step 4: The Rationale (The Signal).* How to write the public paragraph to avoid feeding future cascades.

      *   *Refining the Steps:*
          *   *Internal Cascade:* Change voting order. Randomize who speaks first. Or better: Silent writing first.
          *   *External Cascade:* Ask "What is your *unique* signal?" Force them to cite something no one else has read.
          *   *Absence of Uptake:* Reframe "Why hasn't this been done?" to "What friction stops this?"
          *   *Manufactured Dissent:* Is it useful? Yes, if it forces steel-manning. No, if it's performative. Let's make it a "Devil's Advocate" role rather than a fake vote.
          *   *Reversal Round:* It helps if the *information* is blinded, not just the verdict. If they know the proposal, they know the verdict. Need to focus on *new* data since rejection.

      *   *Structuring the Procedure:*
          *   Phase 0: Intake (Blind sources).
          *   Phase 1: The Silent Signal (Prevent internal herding).
          *   Phase 2: The Source Audit (Detect external herding).
          *   Phase 3: The Friction Test (Address "why hasn't this been done").
          *   Phase 4: The Decision Matrix (Fund/Reject/Escalate).
          *   Phase 5: The Rationale (Public signaling).

  4.  **Addressing the Specific Constraints/Questions:**

      *   *15 mins/case:* Procedure must be tight. No long debates.
      *   *No Probabilities:* Use "High/Med/Low" or "Go/No-Go/Escalate."
      *   *Judgment vs. Machinery:* Be explicit. "Counting citations" is machinery. "Assessing novelty of signal" is judgment.
      *   *Manufactured Dissent:* Keep it, but rename it. "Red Team."
      *   *Reversal Round:* Keep it, but only if *new* data exists.

  5.  **Running the Three Cases:**

      *   *Case 1 (Bandwagon):* Method everyone loves.
          *   *Procedure Check:* Source Audit fails (all same 2 papers). Friction Test fails (no unique insight).
          *   *Outcome:* Reject or Escalate. If the foundation's mission is *high risk*, funding a bandwagon is mission drift.
      *   *Case 2 (Negative/Replication):* Nobody funded.
          *   *Procedure Check:* Source Audit passes (unique signal). Friction Test passes (explains *why* others didn't do it - e.g., career risk).
          *   *Outcome:* Fund. This is exactly the gap.
      *   *Case 3 (The Rejection/Return):* We rejected, others followed, now back.
          *   *Procedure Check:* This is the hard one. The cascade was *us*.
          *   *Outcome:* Fund (if science is sound) + Public Correction. The "signal buying" argument holds. Admit error publicly to break the external cascade.

  6.  **Refining the "What I Won't Like" (Case 3):**

      *   The user wants honesty. If we rejected it wrongly, we created a negative cascade.
      *   To fix it, we must fund it *and* admit we were part of the problem.
      *   Public rationale must say: "We previously rejected this based on X. New evidence Y suggests X was insufficient. We are funding to correct the record."
      *   This hurts the Board's ego but saves the Foundation's integrity.

  7.  **Final Review against Literature:**

      *   *Sequential Herding:* The procedure forces private signals (votes) before public discussion.
      *   *Reputational:* The "Red Team" role protects juniors from agreeing with seniors just to be safe.
      *   *Fragility:* Introducing the "Unique Signal" requirement breaks the cascade if the public info is thin.

  8.  **Drafting the Content (incorporating tone):**

      *   Tone: Professional, slightly cynical but constructive, direct.
      *   Structure: The Procedure, The Three Cases, The Limitations.
      *   Self-Correction during drafting: Make sure I don't suggest something that takes 2 hours. Keep it to the 90-minute meeting constraint. The "Silent Signal" must happen *before* the meeting or in the first 5 mins. Let's put it in the first 5 mins of the meeting.

      *(Self-Correction on Manufactured Dissent)*: The user asked if it's noise. Literature says forced dissent can improve decision quality by reducing conformity pressure, even if the dissent isn't "real." I should advise keeping it but framing it as "Stress Testing" rather than "Minority Report."

      *(Self-Correction on Reversal Round)*: If reviewers can't un-know, the value is low *unless* the prompt focuses strictly on *changes* since the last review. I need to specify that constraint.

  9.  **Final Polish:** Check against all 5 specific constraints in the prompt.
      1.  Internal cascade? (Addressed by Silent Vote).
      2.  Illusory independence? (Addressed by Source Audit).
      3.  Absence of uptake? (Addressed by Friction Test).
      4.  Past write-ups? (Addressed by Cascade Breaker protocol).
      5.  Manufactured dissent? (Addressed by Red Team role).

      *Ready to write.*
answer: |-
  Here is a decision procedure grounded in the mechanics of informational and reputational cascades, operationalized for your constraints (15 minutes/case, 90-minute meeting, no calibrated probabilities).

  ### The "Cascade-Breaking" Decision Procedure

  This procedure is designed to do three things: (1) force private signals into the open before public actions solidify, (2) distinguish between correlated information (herding) and independent confirmation (consensus), and (3) isolate reputational risk from scientific risk.

  **Phase 0: Intake (Before the Meeting)**
  *   **The Source Audit:** Reviewers must submit a "Key Evidence" list with their pre-read scores. They must list the top 3 papers/data points driving their opinion.
  *   **The Machinery:** If >50% of the panel lists the exact same 3 papers, flag the proposal as **"High Cascade Risk."**
  *   **The Judgment:** You (the Director) review these lists. If a proposal is High Cascade Risk, you prepare a specific intervention for Phase 2.

  **Phase 1: The Silent Signal (First 5 Minutes of Case Discussion)**
  *   **Problem:** Internal cascade (Board member speaks first, juniors defer).
  *   **Procedure:** No speaking allowed. Each reviewer writes down two things on a card/slap:
      1.  **Verdict:** Fund / Reject / Escalate.
      2.  **The Unique Signal:** One piece of evidence or reasoning *not* found in the proposal text or the top 3 preprints everyone cites.
  *   **Reveal:** Collect cards. Reveal verdicts simultaneously. Read Unique Signals aloud.
  *   **Stop Condition:** If all verdicts are "Reject" and all Unique Signals are empty or identical ("It's too risky"), **Reject immediately.** Do not discuss. You cannot break a cascade with zero private information.
  *   **Hand-off:** If verdicts are split, or if Unique Signals are strong but verdicts are "Reject" (reputational herding), move to Phase 2.

  **Phase 2: The Friction Test (5 Minutes)**
  *   **Problem:** "If it were worth doing, someone would have done it." (Treating absence of uptake as evidence of low quality).
  *   **Procedure:** The panel must answer one question: *"What is the specific friction preventing the big labs from doing this?"*
  *   **Valid Answers:** Career risk, negative results unpublishable, instrumentation too messy, timeframe too long for tenure clock.
  *   **Invalid Answers:** "It probably doesn't work," "No one is doing it."
  *   **Decision Rule:**
      *   If the friction is **Scientific** (e.g., "The physics likely forbids this"), lean **Reject**.
      *   If the friction is **Sociological/Economic** (e.g., "No one wants to publish a null result"), lean **Fund**. This is your comparative advantage.
  *   **Judgment Call:** Distinguishing between a hard scientific wall and a soft sociological barrier is judgment, not machinery. Trust the reviewer with the most "skin in the game" (active experimenter) here.

  **Phase 3: The Red Team (3 Minutes)**
  *   **Problem:** Manufactured dissent vs. useful stress-testing.
  *   **Procedure:** If the Silent Signal vote was Unanimous (Fund or Reject), assign the most junior reviewer the role of **Red Team**. Their job is not to vote "No," but to argue the *strongest possible case against the consensus* for 2 minutes.
  *   **Value:** Literature on "devil's advocacy" suggests this reduces conformity pressure even if the argument is manufactured. It legitimizes doubt.
  *   **Output:** If the Red Team can find no traction after 2 minutes, the consensus is robust. If they find traction, move to Phase 4.

  **Phase 4: The Escalation (Director's Call)**
  *   **Trigger:** This phase is triggered if:
      1.  The proposal is High Cascade Risk (Phase 0) but the Unique Signals (Phase 1) are strong.
      2.  The Friction Test (Phase 2) identifies a sociological barrier (your niche).
      3.  The proposal is a **Return** (previously rejected by you or others).
  *   **Action:** The panel does not decide. They recommend. You decide.
  *   **Rationale:** This is where you buy the signal. If the panel is herding, you are paying for the option value of breaking the herd. This is not a science decision; it is a portfolio decision.

  **Phase 5: The Public Rationale (Writing the Paragraph)**
  *   **Rule:** Never write "Consensus was strong." Write the *Unique Signal* that drove the decision.
  *   **Cascade Breaking:** If funding a contrarian idea, explicitly state the friction you are accepting. If rejecting a bandwagon, explicitly state that "popularity is not validity."
  *   **Reversal:** If reversing a past decision, you must cite the *new* information. If there is no new information, you must admit the prior heuristic was wrong.

  ---

  ### Application to Your Three Cases

  #### Case 1: The Bandwagon (Method everyone loves)
  *   **Inputs:** 3 other funders funded variants. Panel unanimous enthusiastic. Unique Signals (Phase 1) are empty/restatements of "everyone's moving this way." Source Audit (Phase 0) shows same 2 preprints.
  *   **Procedure Output:**
      *   Phase 0: Flagged **High Cascade Risk**.
      *   Phase 1: Verdicts are "Fund," but Unique Signals are null.
      *   Phase 2: Friction Test fails. There is no friction; the path is clear, which is why everyone is on it.
      *   Phase 3: Red Team argues "Opportunity Cost."
  *   **Decision:** **Reject.**
  *   **Why:** Your mandate is early-stage, high-risk. A method with 3 other funders and unanimous panel agreement based on public preprints is no longer high-risk; it is asset inflation. You are late.
  *   **Public Rationale:** "While this approach shows promise, the field has already mobilized significant capital around this specific benchmark. Our mandate prioritizes gaps where capital is absent, not areas of emerging consensus." (This signals to the market that you are a contrarian funder, which helps you attract the Case 2 proposals).

  #### Case 2: The Negative/Replication (Confident subfield, no funding)
  *   **Inputs:** Nobody has funded it. One review says "quiet part out loud" (nobody did it because it's career suicide).
  *   **Procedure Output:**
      *   Phase 0: Low Cascade Risk (divergent sources).
      *   Phase 1: Unique Signal is strong ("I know this lab can do the null result rigorously").
      *   Phase 2: Friction Test identifies **Sociological Friction** (Negative results = no tenure).
      *   Phase 3: Red Team argues "Why trust this lab?"
  *   **Decision:** **Fund.**
  *   **Why:** This is the exact definition of a market failure your foundation exists to fix. The absence of uptake is not evidence of low quality; it is evidence of misaligned incentives in the broader market.
  *   **Public Rationale:** "This project addresses a known result that remains unpublished due to standard incentive structures. We are funding the verification because the scientific record requires it, regardless of publication bias."

  #### Case 3: The Rejection/Return (The one you won't like)
  *   **Inputs:** You rejected 2 years ago (dismissive paragraph). 2 other funders passed citing you. Revised proposal back. Panel private scores decent.
  *   **Procedure Output:**
      *   Phase 0: **Critical Cascade Risk.** *You* started the cascade.
      *   Phase 1: Unique Signals are decent, but tainted by the prior rejection.
      *   Phase 2: Friction Test reveals the friction was *your previous decision*.
      *   Phase 4: **Escalate to Director.**
  *   **Decision:** **Fund.**
  *   **The Hard Truth:** You created a negative informational cascade. Your public rationale was the "public signal" that convinced other funders to ignore their private signals. To fix this, you cannot just fund quietly. You must break the cascade you started.
  *   **Public Rationale:** "Two years ago, we declined this proposal based on [Reason X]. Since then, [New Data Y] has emerged, and upon re-evaluation, we acknowledge our prior assessment of [Reason X] was too dismissive. We are funding this revision to ensure the question is settled, and to correct the record regarding our prior stance."
  *   **Why:** A quiet reversal looks like inconsistency. A loud reversal looks like integrity. It signals to the field that your rejections are not permanent blacklists, encouraging others to resubmit. It costs you ego but buys you long-term deal flow.

  ---

  ### What to Keep and What to Kill

  1.  **Manufactured Dissent (The Minority Report):** **Keep it, but rename it.** Call it the "Red Team" function. Do not ask them to write a fake minority report (that's noise). Ask them to verbally articulate the strongest counter-argument during the meeting. This protects the juniors (gives them permission to doubt the Board Member) and tests the robustness of the consensus without lying in the public record.
  2.  **The Reversal Round:** **Keep it, with a constraint.** It only works if the prompt forces them to evaluate *delta* (change) not *state*. Do not ask "Is this good?" Ask "What has changed since the last review that alters the risk profile?" If the answer is "Nothing, we just like it more now," reject it. If the answer is "New preliminary data," proceed.
  3.  **The Board Member Speaking First:** **Kill it immediately.** This is the single biggest driver of internal reputational herding. The Silent Signal (Phase 1) must happen before the Board Member opens their mouth.

  ### Limitations and Failure Modes

  Be straight with yourself about where this machinery breaks:

  1.  **The "Empty Signal" Failure:** If your panel is truly homogeneous (same 5 papers, same conferences), Phase 1 will yield empty Unique Signals for *everything*. The procedure will stop every case at "Reject."
      *   *Fix:* You must diversify the panel. If you can't, you must accept that you are funding "consensus science" and adjust your mission statement.
  2.  **The "Director Bottleneck":** Phase 4 escalates hard cases to you. If you get 8 proposals a month, and 4 escalate, you become the bottleneck.
      *   *Fix:* Cap escalations at 2 per meeting. If more escalate, the default is Reject. This forces the panel to do the work of distinguishing "true contrarian" from "noise."
  3.  **The "Reputational Shield":** Reviewers may game the "Unique Signal" requirement by inventing trivial differences to look independent.
      *   *Fix:* You (Director) audit the Unique Signals. If they look like "I read the PDF on a Tuesday, they read it on a Wednesday," call it out.
  4.  **The "Public Signal" Trap:** Even with the best rationale, the market may interpret your funding as a "stamp of approval" that creates a *new* cascade for that project.
      *   *Fix:* You cannot control this. But by funding Case 2 (Negatives) and rejecting Case 1 (Bandwagons), you build a reputation that your stamp means "High Risk/Contrarian," which dampens the herding effect over time.

  ### Summary of Judgment Calls vs. Machinery

  *   **Machinery:** The order of voting (Silent first). The Source Audit (counting overlapping citations). The Escalation Trigger (Previous rejection + New Data).
  *   **Judgment:** Assessing whether a "Friction" is scientific or sociological. Evaluating the quality of a "Unique Signal." Deciding whether a reversal warrants a public apology or just a note.

  This procedure will not give you calibrated probabilities. It will give you a defensible process that minimizes the chance you are simply echoing the field's current biases back at them. It forces the panel to pay the cognitive cost of thinking independently, which is the only tax that stops a herd.
