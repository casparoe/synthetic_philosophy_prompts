prompt: |-
  I am teaching a seventy-five-minute session on informational cascades and rational herding to the second-year undergraduates in my Philosophy and Public Policy course: roughly forty of them, drawn from philosophy, economics and politics, who have had a term of probability — they can read a likelihood ratio and move between odds and probabilities without flinching — but no economics and nothing in social epistemology, and who will have been assigned nothing for this session. I do not need the explanation itself; I need a plan for delivering it.

  What I want the session to turn on is a claim I have become convinced of but have never managed to teach cleanly: that the engine of a cascade is not irrationality, deference or social pressure but the compression of a private signal into a publicly legible action, so that what is lost downstream is not anyone's reasoning but the evidential strength, and the remedy is therefore structural rather than exhortatory — aggregate likelihood ratios, not recommendations. I want that claim to be the spine of the session, not a moral I announce at the end.

  So, first: in what order must the pieces come, and what exactly depends on what? Must they have the notion of an independent private signal of fixed and moderate accuracy before they watch anyone move in sequence? Is it better to let a cascade form in front of them, and only then give them the vocabulary for what they have just seen, or does that guarantee they will describe it as copying? Where does the contrast between the simultaneous case, where many independent signals really do aggregate, and the sequential case, where observed actions are all anyone has, properly belong — before or after they have felt how compelling the simultaneous inference is?

  Second, the case that carries the session. I want one example that does the whole job, and I want to know what it must contain and what it must not. My instinct is that a binary decision under a genuinely common value, with anonymous agents rewarded only for accuracy, is essential, and that anything with reputational stakes, career incentives or a visibly corrupt majority has to be excluded from the carrying case — but I am not certain, and I want the reasoning. My usual candidate is a hiring committee that interviews in sequence and votes by show of hands; tell me whether to keep it and, if not, what replaces it. And tell me why I should or should not build the session around the examples my students will already half-know from elsewhere: restaurant queues, urns with red and blue balls, fashions and fads, review scores.

  Third, the misconceptions, and where in the sequence each should be headed off. I can predict several: that a cascade is simply conformity or peer pressure under a technical name (which is why I am unsure whether to introduce reputational herding first as a contrast or to withhold it until the pure informational case has landed); that if every agent updates correctly on everything she observes, the group's outcome must be rational, or must at least converge on the truth as numbers grow; that crowds are usually right, so a cascade is a marginal inefficiency rather than the foreclosure of all further evidence; that a cascade can always be broken by one well-informed dissenter, when the visible unanimity overstates the evidence and an agent who has simply arrived late cannot tell whether the three votes ahead of her were three independent signals or one signal followed by two acts of copying; and that the remedy is to tell people to think independently or to reward accuracy, neither of which touches the information structure. Which of these must be defused before the machinery is in place and which only after the students have felt their pull, and which others should I expect and have not listed?

  Finally: what should I openly decline to explain in seventy-five minutes, and say aloud that I am declining it — I am inclined to leave out the general question of whether more public information can make a group worse off, and everything that would require strategic complementarities — and what single question should I put to them at the end that would show me the compression point has landed, as opposed to the slogan that a cascade is when people copy each other?
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**
      *   **Audience:** 2nd-year undergrads (Philosophy, Economics, Politics). ~40 students.
      *   **Background:** 1 term of probability (comfortable with likelihood ratios, odds/probs). No economics, no social epistemology. No pre-reading.
      *   **Duration:** 75 minutes.
      *   **Core Thesis:** Cascades are driven by *information compression* (private signal $\to$ public action), not irrationality/pressure. Loss is *evidential strength*. Remedy is *structural* (aggregate likelihoods), not exhortatory.
      *   **Goal:** A delivery plan (order, dependencies, case study, misconceptions, scope limits, assessment question).
      *   **Constraint:** The core thesis must be the *spine*, not a moral at the end.

  2.  **Deconstruct the Core Thesis:**
      *   *Mechanism:* Private Signal (High Info) $\to$ Public Action (Low Info/Binary).
      *   *Result:* Downstream agents see actions, not signals. They rationally ignore their own weak signals because the accumulated public weight outweighs them.
      *   *Contrast:* Simultaneous voting (signals aggregate) vs. Sequential voting (signals get hidden).
      *   *Remedy:* Reveal the likelihood ratios, not just the vote.

  3.  **Address Question 1: Order and Dependencies:**
      *   *Problem:* If I show a cascade first, they'll call it "copying." If I define terms first, it's dry.
      *   *Solution:* Need a "Simultaneous vs. Sequential" contrast *early* to establish the baseline of rationality.
      *   *Sequence:*
          1.  Setup: Common value, binary state, private signals (define accuracy).
          2.  Simultaneous Case (The Benchmark): Show how truth wins with enough people. (Establishes rationality of aggregation).
          3.  Sequential Case (The Problem): Show how the *same* rational agents fail.
          4.  Mechanism: Why? Because Action $\neq$ Signal. The compression happens at step 2 or 3.
          5.  Remedy: How to fix the compression?
      *   *Dependency:* They *must* understand independent private signals of fixed accuracy *before* seeing the sequence. Otherwise, they assume later people know something earlier people didn't.

  4.  **Address Question 2: The Case Study:**
      *   *Criteria:* Binary decision, common value, anonymous/no reputational stakes, accuracy reward.
      *   *Candidate:* Hiring Committee (sequential interviews, show of hands).
      *   *Critique:* Hiring often implies private values (fit) or reputational stakes (agreeing with the chair).
      *   *Better Candidate:* A Jury or a Diagnostic Panel. But "Urn/Ball" is the standard Bikhchandani-Hirshleifer-Welch (BHW) model.
      *   *Decision:* The Urn/Ball model is abstract but precise. However, for Phil/Pol students, a *Policy Decision* based on *Expert Testimony* is more engaging. Let's adapt the Urn to a "Policy Truth" scenario.
      *   *Refinement:* Actually, the prompt asks about the Hiring Committee. The risk is "reputational stakes." If we explicitly stipulate *no* reputational stakes (anonymous ballot, but sequential announcement), it works. But the Urn is cleaner for the math they know.
      *   *Recommendation:* Use the **Urn/Ball** model but dressed as **Intelligence Analysis** or **Medical Diagnosis**. It removes social pressure entirely.
      *   *Why not Restaurants/Fashion?* Those imply private values (I like this food) or reputational herding. We need *Common Value* (Truth is out there).
      *   *Why not Hiring?* Too much noise about "fit."
      *   *Verdict:* Use a "Security Threat Assessment" or "Drug Efficacy" scenario. Binary state (Threat/No Threat, Works/Doesn't Work). Sequential public recommendation.

  5.  **Address Question 3: Misconceptions:**
      *   *Conformity/Pressure:* Defuse *immediately* by stipulating incentives (paid for accuracy, anonymous).
      *   "Crowds are Right": Contrast Simultaneous (Crowd is Right) vs. Sequential (Crowd can be Wrong). This needs to happen *during* the mechanism explanation.
      *   "One Dissenter Breaks It": This is crucial. It highlights the *fragility* and the *information loss*. Save this for the "Remedy/Implications" section.
      *   "Rational Updating = Truth": This is the hardest one. Need to show that rational individual updating leads to irrational group outcomes *structurally*.
      *   *Timing:*
          *   Pressure: Pre-empt (in setup).
          *   Crowds Right: Contrast (Simultaneous vs. Sequential).
          *   Dissenter: Post-cascade formation (to show fragility).
          *   Remedy (Exhortation): End (to show futility).

  6.  **Address Question 4: Scope and Assessment:**
      *   *Exclude:* Reputational herding (Scharfstein/Stein), Strategic complementarities, Network topology (who sees whom), Cost of information acquisition.
      *   *Include:* The math of the likelihood ratio tipping point.
      *   *Final Question:* Needs to test if they understand *compression*, not just *copying*.
      *   *Idea:* Ask them to design a reporting mechanism that prevents the cascade without changing incentives.

  7.  **Drafting the Plan (Iterative refinement):**

      *   *Intro (10 mins):* Setup the world. Common value. Private signals. Likelihood ratios.
      *   *Phase 1: The Benchmark (15 mins):* Simultaneous voting. Condorcet Jury Theorem intuition. Signals aggregate.
      *   *Phase 2: The Sequence (20 mins):* Move 1, Move 2, Move 3. Show the tipping point. Use the board to track "Public Belief" vs. "Private Signal."
      *   *Phase 3: The Diagnosis (15 mins):* Why did it happen? Action vs. Signal. The Compression.
      *   *Phase 4: The Remedy & Misconceptions (15 mins):* Why telling people to "think for themselves" fails. The structural fix (reveal likelihoods).
      *   *Conclusion (5 mins):* The Final Question.

      *   *Refining the "Spine":* The spine is the *loss of evidential strength*. I need to make sure the board work visualizes this.
      *   *Visual:* Two columns. "What I know" (Signal) vs. "What You see" (Action).
      *   *The Hiring Committee:* I will advise against it due to the "reputational" leak. Suggest "Medical Board" or "Intelligence Cell."
      *   *Misconceptions:* Specifically address the "Rationality" trap. They are rational *individually*. That's the tragedy.

  8.  **Final Polish:**
      *   Check timing. 75 mins is tight.
      *   Ensure the probability level matches (odds/ratios).
      *   Make sure the "Remedy" is structural (change the input channel), not moral (be brave).
      *   Final Question: Needs to be specific. "If Agent 4 knows Agent 3 ignored their signal, what should Agent 4 do?" (Answer: Nothing, they still can't recover the signal). Better: "Design the ballot."

      *(Self-Correction on Final Question)*: If I ask them to design the ballot, that tests the remedy. If I ask "Why did Agent 3 ignore their signal?", that tests the mechanism. The prompt asks for a question that shows the *compression point* has landed.
      *   *Question:* "Agent 3 sees two 'Yes' votes. Her signal is 'No'. She votes 'Yes'. Agent 4 arrives. She knows the model. She sees three 'Yes' votes. Her signal is 'No'. She votes 'Yes'. What specific piece of information available to Agent 3 is *permanently inaccessible* to Agent 4?"
      *   *Answer:* The *strength* (or even existence) of Agent 3's private signal.

      *   *Wait, one more check on the "Hiring Committee":* The prompter likes it. I should explain *why* it's risky but how to sanitize it if they keep it. Actually, better to steer them to the Urn/Ball but contextualized. It's the cleanest for the math they know.

      *   *Structure:*
          1.  Order/Dependencies.
          2.  The Case (Urn vs. Hiring).
          3.  Misconceptions (Timing).
          4.  Exclusions & Final Question.

      *   *Tone:* Professional, pedagogical, respectful of their probability background.

      *(Final thought on the "Spine")*: Ensure the plan emphasizes that the *Action* is a coarse variable (Binary) while the *Signal* is a fine variable (Probability/Likelihood). The mapping is many-to-one. That is the compression.

      Let's write the response following the user's four distinct sections.

      *   *Section 1: Order.* Must establish signal independence and accuracy *before* sequence. Simultaneous *before* Sequential to establish the loss.
      *   *Section 2: Case.* Urn/Ball is best mathematically. Hiring is risky (reputation). Avoid restaurants (private value).
      *   *Section 3: Misconceptions.* Pre-empt "pressure." Confront "rationality" during the cascade. Address "dissenter" at the end.
      *   *Section 4: Scope/Question.* Exclude reputational herding. Final question about the *lost data*.

      *Wait, need to be careful about the "Remedy".* The prompt says "aggregate likelihood ratios, not recommendations." So the remedy is changing the *output* of the agents from "Vote" to "Confidence/Probability." I need to make sure that's clear.

      *Let's refine the Final Question.*
      "You are the chair. You cannot change the agents' incentives or their private signals. You can only change what they are allowed to *say* to the next person. What do you mandate they report, and why does that specific change stop the cascade?"
      This forces them to identify the compression (Vote) vs the signal (Likelihood).

      Okay, ready to draft.cltr
answer: |-
  Here is a plan for the seventy-five-minute session, structured to make the *information compression* thesis the operational engine of the class rather than its conclusion.

  ### 1. Order and Dependencies

  You must establish the **epistemic baseline** before you introduce the **temporal structure**. If you show the sequence first, students will interpret the behavior through the lens of social psychology (conformity) rather than Bayesian updating.

  **The Critical Path:**
  1.  **Define the Signal Space (Minutes 0–10):** Establish that agents have *independent* private signals of *fixed, moderate accuracy* (e.g., $P(Signal|State) = 0.6$). Use their probability background here: express this as a likelihood ratio of 3:2.
      *   *Dependency:* They must accept that signals are independent and identically distributed (i.i.d.) before they see anyone act. If they suspect later agents have *better* signals, the cascade looks rational.
  2.  **The Simultaneous Benchmark (Minutes 10–25):** Show the group voting simultaneously.
      *   *Why here?* You need them to feel the normative force of the Condorcet Jury Theorem intuition. With independent signals, the majority *should* be right, and confidence should grow with $N$. This establishes that the *material* (the signals) is sufficient for truth-tracking.
  3.  **The Sequential Shift (Minutes 25–45):** Move the same agents into a sequence. Public actions are observed; private signals are not.
      *   *The Pivot:* Walk through Agents 1, 2, and 3 on the board. Track the "Public Belief" (odds based on actions) vs. "Private Signal" (likelihood ratio).
      *   *The Cascade Point:* Show exactly where the Public Belief odds exceed the Private Signal likelihood ratio. This is the moment of compression. Agent 3 rationally ignores their signal.
  4.  **The Diagnosis (Minutes 45–60):** Explicitly name the mechanism. The action is binary (Vote A/B); the signal is probabilistic (Likelihood 3:2). The mapping is many-to-one. Information is discarded at the moment of translation.
  5.  **The Remedy (Minutes 60–75):** Contrast exhortation ("be brave") with structure ("report likelihoods").

  **Answering your specific ordering questions:**
  *   **Must they have the notion of an independent private signal first?** Yes. Absolutely. Without fixed signal accuracy, they cannot calculate the tipping point where public weight overwhelms private evidence.
  *   **Simultaneous before Sequential?** Yes. You need the "loss" to be palpable. If they only see the sequential case, they assume the group *cannot* do better. If they see the simultaneous case first, they see the sequential case as a *failure* of aggregation.
  *   **Vocabulary before or after the cascade?** Introduce the vocabulary of "Public Belief" and "Private Signal" *during* the walkthrough of Agents 1 and 2. By the time Agent 3 triggers the cascade, they have the terms to describe why Agent 3 is not "copying" but "optimizing."

  ### 2. The Carrying Case

  **Do not use the Hiring Committee.**
  *   **Reasoning:** Hiring inherently involves *private values* (fit) and *reputational stakes* (agreeing with the chair). Even if you stipulate these away, students will import them from their mental models of committees. It introduces noise that distracts from the pure informational mechanism.
  *   **Do not use Restaurants/Fashion:** These are typically *private value* problems (I like this food) or *reputational herding* (I want to be seen at the cool place). This contradicts your thesis that the engine is informational, not social.
  *   **Do not use Urns/Balls (naked):** While mathematically pure, it is too abstract for a Policy course. It risks becoming a math exercise rather than an epistemic one.

  **The Recommended Case: An Intelligence Cell or Medical Board.**
  *   **Scenario:** A group of 5 analysts is determining if a threat is **Real** or **Hoax** (Common Value).
  *   **Incentives:** They are paid solely for accuracy. Anonymity is guaranteed. No career stakes.
  *   **Procedure:** They receive intelligence reports (Private Signals) one by one. They must publicly declare "Threat" or "No Threat" in sequence.
  *   **Why this works:**
      1.  **Binary State:** Real/Hoax (True/False).
      2.  **Common Value:** Everyone wants the truth.
      3.  **No Reputation:** Stipulate strict anonymity to kill the "conformity" objection immediately.
      4.  **High Stakes:** Makes the rationality of ignoring one's own signal more dramatic (they *want* to be right, but the math forces them to follow the crowd).

  **Why avoid examples they half-know?**
  Students think they know "restaurant queues." They believe they understand the mechanism (people follow crowds). You want to disrupt that intuition, not confirm it. Use a scenario where "following the crowd" feels *wrong* (intelligence failure) to highlight the tragedy of the rationality.

  ### 3. Misconceptions and Timing

  You must treat misconceptions as structural obstacles to be removed at specific points in the machinery, not as a list to debunk at the end.

  | Misconception | When to Defuse | How |
  | :--- | :--- | :--- |
  | **"This is just peer pressure/conformity."** | **Minute 5 (Setup)** | Pre-empt it. Explicitly stipulate: "Agents are anonymous. Pay is based on accuracy only. No one knows who voted before them, only *what* was voted." |
  | **"If everyone updates correctly, the group must be right."** | **Minute 30 (The Pivot)** | Confront it *during* the cascade formation. Show that Individual Rationality $\neq$ Group Rationality. The board should show: "Agent 3 is Bayesianly correct, but the Group is now blind." |
  | **"Crowds are usually right (Condorcet)."** | **Minute 20 (Benchmark)** | Handle this in the Simultaneous phase. Show that crowds *are* right when signals aggregate. This makes the Sequential failure a specific structural defect, not a general rule. |
  | **"One dissenter can break the cascade."** | **Minute 55 (Fragility)** | Address this after the cascade is locked. Explain that a dissenter looks like *noise* to downstream agents. If Agent 4 sees 3 'Threat' votes and 1 'No Threat', they cannot know if the 'No Threat' was a strong signal or a mistake. The cascade is fragile, but breaking it requires *publicizing the signal strength*, not just a 'No' vote. |
  | **"The remedy is to tell people to think independently."** | **Minute 65 (Remedy)** | Show the futility. If Agent 3 is rational, telling them to "think independently" asks them to be *irrational* (ignore public evidence). The remedy must be changing the *channel*, not the agent. |

  **One additional misconception to expect:**
  *   **"Later agents have less information."** Students often think Agent 5 is "further away" from the truth. You must clarify that Agent 5 actually has *more* data (4 public actions + 1 private signal) than Agent 1, but the *quality* of the public data is degraded.

  ### 4. Scope Limits and The Final Question

  **What to openly decline:**
  1.  **Reputational Herding (Scharfstein/Stein):** State clearly: "We are assuming agents care only about being right, not looking smart. If they care about reputation, the math changes, but the information compression remains."
  2.  **Endogenous Information Acquisition:** "We are assuming signals are free and given. We are not asking why they looked for evidence, only how they used it."
  3.  **Network Topology:** "We assume everyone sees everyone. If you only see your neighbors, the cascade spreads differently, but the compression mechanism is the same."

  **The Final Question:**
  Do not ask them to define a cascade. Do not ask them to give an example. Ask them to design the **reporting protocol**.

  > **"You are the Director of the Intelligence Cell. You cannot change the analysts' incentives (they still want accuracy), and you cannot change their private signals. You can only change what they are *allowed to say* to the next person in the sequence.*
  >
  > *Currently, they must say 'Threat' or 'No Threat'. This leads to cascades where the group ignores later evidence.*
  >
  > *What specific quantity do you mandate they report instead, and why does reporting that quantity prevent the loss of evidential strength?"*

  **The Correct Answer:**
  They must report their **Posterior Probability** or their **Likelihood Ratio** (e.g., "My report indicates a 60% chance of Threat"), rather than a binary decision.

  **Why this tests the spine:**
  *   If they say "Tell them to vote secretly," they haven't understood the sequential nature.
  *   If they say "Tell them to be braver," they haven't understood the rationality constraint.
  *   If they say "Report the probability," they have identified that the **compression** (Binary Action) was the problem, not the **agents**. They have recognized that the remedy is structural (aggregate likelihoods), not exhortatory.

  ### Summary of Board Work (Visualizing the Spine)

  To ensure the "compression" claim is the spine, your board should have two running columns throughout the session:

  | **Private Epistemic State** | **Public Legible Action** |
  | :--- | :--- |
  | **Signal:** $P(S|State) = 0.6$ | **Vote:** YES / NO |
  | **Likelihood Ratio:** 3 : 2 | **Information Content:** 1 Bit |
  | **Status:** High Resolution | **Status:** Compressed / Lossy |

  When the cascade starts, draw an arrow from the Private column to the Public column and label it **"The Compression Point."** Write underneath: *"Downstream agents see the Vote, not the Ratio."* This visual anchor ensures that when you reach the remedy, the solution (report the Ratio) is visually obvious.
