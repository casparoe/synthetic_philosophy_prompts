answer: |-
  This is an exceptionally sharp reading of the *Bai Ma Lun* (White Horse Dialogue). You have correctly identified that the standard introductory treatment (often framed through the lens of Aristotelian class inclusion or set theory, i.e., $A \subset B$) tends to domesticate Gongsun Long into a proto-analytic philosopher making a trivial point about intension vs. extension.

  Your intuition that the *Mingjia* (School of Names) are operating with a metaphysics of **separable attributes** (often linked to the concept of *zhi* 指，translated variously as "index," "pointer," or "universal") is supported by serious sinological scholarship (notably A.C. Graham and Chad Hansen).

  Your worry, however, is profound: **If the unity of the object is denied, does the object dissolve? And if the object dissolves, what is the subject of the disputation?**

  Here is a pathway through this problem that preserves your ontological reading without collapsing into self-defeating nihilism.

  ### 1. Distinguishing Ontological Separability from Mereological Nihilism

  Your concern is that if "whiteness" and "horseness" are ontologically distinct realities that merely coincide, the "white horse" becomes a fleeting aggregation, threatening the stability required for truth-claims.

  However, the *Mingjia* do not deny the **existence** of the conjunction; they deny the **identity** of the name.

  In the *Zhi Wu Lun* (Discourse on Pointing at Things), Gongsun Long argues that *zhi* (the abstract attribute/universal) does not itself become the thing pointed at. When "white" and "horse" combine, they do not fuse into a new, simple substance. They remain distinct *zhi* that are **co-located**.

  *   **Nihilism** would claim: "There is no white horse there."
  *   **Gongsun Long's Claim:** "There is a white horse there, but the *name* 'white horse' picks out a different reality than the *name* 'horse'."

  The stability of the object is not grounded in a metaphysical "substance" that holds the attributes together (as in Aristotle), but in the **fixed nature of the distinctions themselves**. "Whiteness" is a stable distinction. "Horseness" is a stable distinction. Their coincidence is a stable fact of the world, even if their ontological status remains separate. Therefore, the "white horse" is not an illusion; it is a **complex index** rather than a simple substance.

  ### 2. The Pragmatic Stability of Disputation

  You ask: *Wouldn't their own practice of disputation presuppose that this compound has enough stability to serve as the subject of a true or false statement?*

  Yes, but the stability comes from **function**, not **composition**.

  The *Bai Ma Lun* is not merely abstract metaphysics; it is deeply pragmatic. The dialogue hinges on acts of **seeking** (*qiu* 求).
  *   If you seek a "horse," a yellow or black horse suffices.
  *   If you seek a "white horse," a yellow or black horse does not suffice.

  If "white horse" were identical to "horse," these two requests would have the same satisfaction conditions. They do not. Therefore, the terms are not interchangeable.

  This saves the disputation from nihilism. The "white horse" is stable enough to be the subject of a statement because it has a **stable functional role** in language and action. The *Mingjia* are less concerned with whether the white horse is a "real unity" in the cosmos and more concerned with whether the *name* "white horse" commands the same response as the *name* "horse." The "reality" of the white horse is secured by its **discriminability**, not its metaphysical unity.

  ### 3. A Coherent Reading: Semantic Realism without Substance

  To answer your final question directly: *Is there a coherent reading of this separability thesis that preserves the distinction between form and color without dissolving all compound reference into illusion?*

  Yes. It requires shifting from a **Substance Ontology** to a **Field of Distinctions**.

  In the Western tradition (influenced by Aristotle), we tend to think:
  1.  There is a Substance (the horse).
  2.  It has Properties (white).
  3.  If Properties are separate from Substance, the Substance vanishes.

  In the *Mingjia* framework (as interpreted by scholars like Chris Fraser and A.C. Graham), the model is closer to:
  1.  There is a Field of Reality (*shi* 實).
  2.  Names (*ming* 名) carve out distinctions in this field.
  3.  "Horse" carves out a shape-distinction.
  4.  "White" carves out a color-distinction.
  5.  "White Horse" carves out the **intersection** of these distinctions.

  **The Solution to the Nihilism Worry:**
  The "white horse" is not an illusion because the **intersection** is real, even if the **components** remain distinct. Think of it like a Venn diagram. The circle "White" and the circle "Horse" are distinct. The overlapping region is not "fake" just because the circles remain distinct.

  Gongsun Long's claim "A white horse is not a horse" is best translated not as "A white horse is not a member of the class horse" (which is false), but as **"The concept 'white horse' is not identical to the concept 'horse'."**

  *   **Ontologically:** Whiteness and Horseness are separate *zhi*.
  *   **Semantically:** The compound name functions differently than the simple name.
  *   **Pragmatically:** The compound name restricts the range of acceptable referents.

  ### 4. Why This Doesn't Lead to Infinite Regress

  Your worry about "unstable aggregation" suggests that if *every* object is just a conjunction of attributes, nothing is truly one thing.

  The *Mingjia* would likely respond that **unity is a feature of naming, not of things.** We treat something as "one thing" when a single name suffices for our purpose. When precision is required, we split the name ("white horse"). When generality is required, we simplify ("horse").

  The "thing" itself is just the locus where these distinctions meet. It doesn't need an internal "principle of unity" to be discussed; it only needs to be **pointable** (*zhi*). As long as we can point to the locus where "white" and "horse" coincide, the reference is secure. The disputation holds because we are arguing about the **correctness of the distinction**, not the existence of the locus.

  ### Summary for Your Discussion Group

  To move your group forward, you might propose this synthesis:

  1.  **Validate your metaphysical reading:** Agree that treating color and form as ontologically distinct *zhi* is more faithful to the text than the "compound description" model.
  2.  **Reframe the Nihilism:** Argue that the *Mingjia* do not deny the existence of composites, but deny that composites are **ontologically simple**. They are real intersections, not fused substances.
  3.  **Anchor in Function:** The stability required for disputation is provided by the **invariance of the distinctions** (white is always white, horse is always horse) and the **consistency of their intersection**, not by a hidden substance holding them together.
  4.  **The Core Thesis:** "White horse is not horse" is a claim about the **non-identity of names/concepts**, grounded in the **separability of attributes**, but it does not entail that the white horse is an illusion. It entails that "white horse" is a more specific **cut** of reality than "horse," and one cut cannot be identical to a different, broader cut.

  This preserves the radical separability you identified while saving the phenomenon of meaningful discourse. The "white horse" is a stable target for language because the distinctions that constitute it are fixed, even if they are not fused.
