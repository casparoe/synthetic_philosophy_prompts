      *   *Gongsun Long's Logic:* "Horse" names the shape/form. "White" names the color. "White Horse" names shape + color. Since (Shape + Color) $\neq$ (Shape), "White Horse" $\neq$ "Horse".
      *   *Ontological Commitment:* The user suggests "separability of attributes." This is close to the concept of *zhi* (index/pointer/universal) in the *Zhi Wu Lun* (Discourse on Pointing at Things).

  4.  **Address the "Mereological Nihilism" Concern:**
