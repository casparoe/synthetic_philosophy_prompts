      *   *The Claim:* "White horse is not horse" means "The concept 'white horse' is not identical to the concept 'horse'."
      *   *Addressing the User's Ontological Reading:* The user says attributes are "ontologically distinct realities." This aligns with the idea of *zhi* (universals/indices) existing independently in the realm of meaning.
      *   *Resolution:* The "compound" exists as a *meeting* of *zhi*, but it doesn't create a *new* simple *zhi*. It remains a compound. Therefore, it cannot be equated with one of its components ("horse").
