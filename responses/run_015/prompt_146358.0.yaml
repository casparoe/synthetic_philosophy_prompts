      *   *Response:* The *Mingjia* are primarily concerned with *language* and *rectification of names* (*zhengming*), not necessarily a full-blown cosmological nihilism. They are semantic realists but metaphysical distinction-makers.
      *   *Key Distinction:* They distinguish between the *referent* (the concrete thing) and the *name/concept* (the abstract distinction). The concrete thing exists, but the *name* "white horse" picks out a different *concept* than "horse."
      *   *Avoiding Nihilism:* The coincidence isn't "fleeting" in a way that prevents reference. It's stable enough for practical use, but logically distinct. The "unity" is pragmatic, not metaphysical.

  5.  **Develop the Coherent Reading (The "Two-Level" or "Pragmatic" Approach):**
      *   *Level 1: The Concrete World (Shi).* Things exist. We can point at them.
