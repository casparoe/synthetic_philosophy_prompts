      *   The "nihilism" worry is a classic objection to nominalist or trope-based ontologies.
      *   The key is to show that the *Mingjia* aren't denying the *existence* of the conjunction, but rather the *identity* of the name/concept with the broader category.

  3.  **Deconstruct the "White Horse is Not Horse" Argument:**
