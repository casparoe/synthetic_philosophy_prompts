answer: |-
  This is a classic spot to be in. The reason you feel like people are being picky is that the "spec" for a theory of material constitution is effectively an **impossible trinity**. No theory satisfies every desideratum perfectly; they all pay a cost somewhere. The seminar debate is usually just people arguing over which cost is the least expensive.

  If your goal is a theory that settles "one object or two" without begging the question, you need a spec that forces the answer out of the constraints, rather than assuming the answer in the premises.

  Here is the specification sheet for an adequate theory of material constitution, the tensions between them, and the scorecard.

  ---

  ### The Desiderata (The Spec)

  To count as adequate, a theory must address these five requirements. If it ignores one, it's usually accused of "changing the subject."

  #### 1. Compliance with Leibniz's Law (The Indiscernibility of Identicals)
  *   **The Requirement:** If Object $A$ and Object $B$ are identical ($A = B$), they must share all properties. If $A$ has a property $B$ lacks, they are not identical.
  *   **The Case:** The Modal Argument. The Lump could survive being squashed into a ball; the Statue could not. Therefore, they have different modal properties.
  *   **Why it matters:** This is the logical engine of the puzzle. If a theory violates this, it undermines standard logic. A theory must either accept the objects are distinct or explain away the property difference (e.g., by denying modal properties are real properties of the object).

  #### 2. Spatial Exclusivity (Immanent Penetrability)
  *   **The Requirement:** Two distinct material objects cannot occupy the exact same spatial region at the exact same time.
  *   **The Case:** The Coincidence Intuition. When you look at the statue, you don't see two things stacked on top of each other; you see one thing.
  *   **Why it matters:** This captures our pre-theoretical intuition about physical matter. If a theory violates this, it must explain how two solid things can be in the same place without interfering with each other.

  #### 3. Sortal Sensitivity (Persistence Conditions)
  *   **The Requirement:** The theory must account for the fact that *what* a thing is determines *how* it persists.
  *   **The Case:** Survival. A "lump" persists through reshaping; a "statue" does not. A theory cannot treat all objects as having the same persistence conditions (e.g., mereological essentialism) without heavy justification.
  *   **Why it matters:** This explains why we care about the statue and not just the atoms. It grounds the modal differences in Requirement #1.

  #### 4. Ontological Non-Arbitrariness (The "Too Many Objects" Constraint)
  *   **The Requirement:** The theory must provide a principled reason for why *some* coincident objects exist (Statue, Lump) while others do not (e.g., a "Trout-Turkey" composed of the front half of a trout and the back half of a turkey, or a "Goliath-shaped lump that isn't a lump").
  *   **The Case:** Unrestricted Composition. If the Lump and Statue are two objects in the same place, why isn't there also a third object defined as "The Statue minus one atom"?
  *   **Why it matters:** Without this, the theory multiplies objects wildly. It prevents the theory from saying "Yes, there are two objects" without explaining why there aren't *two million* objects there.

  #### 5. Common Sense Ontology (Existence)
  *   **The Requirement:** The theory should, if possible, affirm the existence of ordinary objects (statues, lumps, people) rather than eliminating them.
  *   **The Case:** Elimination. A theory that says "There are no statues, only atoms arranged statue-wise" solves the puzzle but violates our basic engagement with the world.
  *   **Why it matters:** Metaphysics is supposed to explain our world, not replace it with a barren landscape of atoms or sense-data.

  ---

  ### The Incompatibility Matrix (The Tensions)

  You suspected that "there are two objects" and "there's only one thing per region" can't both hold. You are right. In fact, the situation is worse. **You cannot satisfy all five desiderata simultaneously.** You have to drop at least one.

  Here is the core tension, often called **The Trilemma of Constitution**:

  1.  **If you keep Leibniz's Law + Sortal Sensitivity:** You must admit the Statue and Lump have different properties. Therefore, they are **Distinct**.
  2.  **If they are Distinct + you keep Spatial Exclusivity:** They cannot be in the same place. But they *are* in the same place. Contradiction.
  3.  **If they are Distinct + you drop Spatial Exclusivity:** You allow Coincidence. But now you face the **Non-Arbitrariness** problem (Why these two objects and not infinite others?).

  **The Specific Conflict You Noticed:**
  *   **Requirement #1 (Leibniz/Modal)** pushes toward **Two Objects**.
  *   **Requirement #2 (Spatial Exclusivity)** pushes toward **One Object**.
  *   **Requirement #4 (Non-Arbitrariness)** makes the **Two Objects** view very expensive (you have to explain why we don't have infinite objects).

  To settle the "one or two" question, your theory must explicitly state which of these requirements it is willing to violate. A theory that claims to satisfy all of them is likely hiding a contradiction.

  ---

  ### The "Knockout" Requirement

  If I have to identify the single requirement that knocks out the most views (or forces the most painful revisions), it is **Requirement #4: Ontological Non-Arbitrariness**.

  **Why?**
  *   **Identity Theory** (They are one object) is knocked out by *Leibniz's Law*.
  *   **Eliminativism** (Statues don't exist) is knocked out by *Common Sense*.
  *   **Constitutionalism** (They are two objects) is the most popular surviving view, *but* it is constantly besieged by Non-Arbitrariness.

  Once you allow that the Lump and Statue are two distinct objects in the same place, you have opened the door to "coincident objects." The critic asks: "What principle stops *any* arbitrary collection of parts from counting as an object?"
  *   If you say "Only functional kinds count," you have to define function precisely.
  *   If you say "Only sortals we care about count," you make ontology dependent on human psychology.
  *   If you say "All collections count" (Unrestricted Composition), you satisfy Non-Arbitrariness by accepting *everything*, but you violate Common Sense (now there is a "trout-turkey" object).

  Requirement #4 is the hardest to satisfy for the view that wins the other battles (Constitutionalism). It forces the theory to do the most heavy lifting.

  ---

  ### The Scorecard (Brief)

  Here is how the main contenders score against the spec. Note that **no view gets a perfect 5/5**.

  | View | 1. Leibniz | 2. Spatial Exclusivity | 3. Sortal Sensitivity | 4. Non-Arbitrariness | 5. Common Sense | The Cost Paid |
  | :--- | :---: | :---: | :---: | :---: | :---: | :--- |
  | **Constitutionalism**<br>(Two Objects) | **Pass**<br>(They are distinct) | **Fail**<br>(Allows coincidence) | **Pass**<br>(Different kinds) | **Struggle**<br>(Too Many Objects) | **Pass**<br>(Statues exist) | Violates Spatial Exclusivity. Must explain why coincidence is okay without multiplying objects infinitely. |
  | **Identity Theory**<br>(One Object) | **Fail**<br>(Violates LL w/ modals) | **Pass**<br>(One thing per place) | **Fail**<br>(Must deny modal diff) | **Pass**<br>(Only one object) | **Pass**<br>(Statues exist) | Must deny obvious modal intuitions (e.g., claim the statue *could* survive squashing). |
  | **Eliminativism**<br>(Nihilism) | **Pass**<br>(No objects to compare) | **Pass**<br>(Only atoms exist) | **Fail**<br>(No sortals) | **Pass**<br>(No arbitrary objects) | **Fail**<br>(No statues) | Violates Common Sense. Denies the existence of the very things we are trying to explain. |
  | **Dominant Sorts**<br>(One Object, Contextual) | **Pass**<br>(Contextual identity) | **Pass**<br>(One thing per place) | **Pass**<br>(Sorts determine persistence) | **Pass**<br>(Only dominant sort counts) | **Pass**<br>(Statues exist) | **High Theoretical Cost.** Makes identity relative to concepts/language rather than reality. |

  ### Summary for Your Seminar

  To settle whether the statue and lump are one or two without assuming the answer, you cannot just ask "Are they identical?" You have to ask: **"Which desideratum are we willing to sacrifice?"**

  *   If you prioritize **Logic (Leibniz)** and **Common Sense**, you are forced into **Two Objects** (Constitutionalism), but you must pay the price of explaining away **Spatial Exclusivity** and **Arbitrariness**.
  *   If you prioritize **Spatial Exclusivity** and **Common Sense**, you are forced into **One Object**, but you must pay the price of denying **Leibniz's Law** (by claiming modal properties aren't real properties) or denying **Sortal Sensitivity**.
  *   If you prioritize **Logic** and **Spatial Exclusivity**, you are forced into **Eliminativism**, but you pay the price of **Common Sense**.

  The "adequate" theory is simply the one that offers the most principled explanation for why the requirement it violates *should* be violated. If your seminar partners aren't admitting which requirement they are dropping, they aren't doing metaphysics; they're doing intuition-preservation.
