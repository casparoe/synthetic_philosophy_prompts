prompt: |-
  I'm in a metaphysics seminar this term and we just finished the statue-and-the-lump stuff, and I keep losing the thread on what a theory of material constitution is actually supposed to be doing. Everyone keeps throwing around the modal argument (the lump could've ended up as a blob on the floor but the statue couldnt have, so by Leibnizs law they're not the same thing) and this sortal thing about different identity conditions, but I honestly can't tell which of the things people demand of these theories are real requirements and which are just one camp being picky.

  Could you write me the desiderata -- like, the spec for what a theory of material constitution has to deliver to count as adequate? I want the actual cases it has to get right (the coincidence of the statue and the lump, the modal cases, the whole "which one is the real one" question, and the annoying question of whether we're not just multiplying objects for fun once you allow a part of the lump to also be a lump), the distinctions it can't collapse, and the consideration behind each one. I'd really like you to flag where you think a couple of the requirements can't be satisfied at the same time, because I have a vague feeling that "there are two objects" and "there's only one thing per region" can't both hold, and if that's a real tension then the list itself is doing some work. Also tell me which single requirement knocks out the most views. You can briefly score the main contenders (the "there really are two objects" view, the "there's only the lump" view, whatever else is out there) against the list at the end, but keep the weight on the requirements and the cases, not the scorecard.

  Oh and I'll fix the purpose since I think it matters: I care about a theory good enough to actually settle whether the statue and the lump are one object or two, without just assuming the answer. That's the job.
