answer: |-
  This is not a verbal disagreement, nor is it primarily about standards of evidence, though it wears those clothes. It is a **bedrock intuition clash about belonging versus accuracy**, specifically regarding the *telos* (purpose) of history. Your friend views history as a *constitutive narrative* (what makes us "us"), while you view it as a *corrective discipline* (what actually happened). Because you are arguing from different first principles about what history is *for*, no amount of carbon dating or archive digging will resolve the tension.

  However, while the disagreement is bedrock, your friend's position ("mnemonic sovereignty") is philosophically incoherent when applied to the real world. It commits a category error by conflating *normative utility* (this story binds us) with *descriptive truth* (this event occurred). "Mnemonic sovereignty" works only in a vacuum. As soon as two communities with conflicting sovereign memories interact—like your land claim example—the principle collapses. If Community A claims land by sacred memory and Community B claims it by conflicting sacred memory, and both reject the archival record as "colonial," the only arbiter left is force. Your friend's model cannot sustain a pluralistic society because it offers no neutral ground for adjudication.

  You are closer to being right, not because you are morally superior, but because your position is **universalizable**. A discipline dedicated to evidence, even imperfect evidence, allows for the possibility of correcting power. Your friend's model ultimately surrenders truth to whichever group has the strongest internal cohesion or the loudest voice. Furthermore, the hidden empirical question—"does cohesion require false belief?"—leans in your favor. Sociological studies on transitional justice (e.g., post-apartheid South Africa or post-WWII Germany) suggest that social cohesion is often *strengthened*, not weakened, by confronting painful truths rather than sustaining comforting myths. Cohesion based on falsehood is fragile; it shatters when the lie is inevitably exposed. Cohesion based on shared reckoning is resilient.

  Progress is possible, but not by convincing your friend to abandon memory. The solution is **differentiation of spheres**. Communities should have sovereignty over *meaning* (how they interpret the past, what holidays they keep, what myths they tell internally), but not over *fact* when those facts determine material rights or external reality. You can honor the 1600 shipwreck story as a foundational myth that explains the town's *identity* without letting it rewrite the 1850 *settlement date* in the legal record. Your friend wants to erase the line between myth and record; you want to maintain it. Maintaining the line is the only way to prevent history from becoming purely propaganda.

  \answer{Bedrock intuition about belonging versus accuracy}
