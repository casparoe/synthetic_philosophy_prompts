answer: |-
  1. The collision is sharpest when Billy's father discovers him dancing in the community hall, framing the boy's self-authorship as a betrayal of the strike's collective solidarity. Later, the father crossing the picket line to fund the audition physically enacts the substitutability-friendly choice, treating the industry as replaceable for the sake of the child's talent.
  2. The narrative arc ultimately validates the substitutability-friendly outlook by ending with Billy's successful exit from the village and the implied obsolescence of the mining industry itself. By framing the Royal Ballet School as the telos of Billy's gifts, the film treats the local community as a launching pad rather than a permanent obligation.
  3. Yet the film resists a clean break by emphasizing the heavy emotional cost of this mobility, particularly in the father's humiliation at crossing the picket line to enable it. The final scene, where the father watches Billy perform, suggests that physical departure does not erase the moral debt owed to those who stayed behind.
  4. The film struggles to distinguish genuine loyalty from a valorized trap, ultimately settling the question by borrowing the audience's antecedent class sympathies to validate the individual's exit from the collective. It portrays the strike as historically doomed rather than morally wrong, thereby sidestepping the question of whether staying was ever a virtuous obligation.
  5. What the film adds to the abstract argument is the visceral depiction of how material scarcity forces moral choices, showing that substitutability is often a luxury purchased by others' sacrifices. It demonstrates that the conflict is not merely between vocabularies but between embodied practices where one morality's success necessitates the other's dissolution.
