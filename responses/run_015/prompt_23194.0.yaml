      *   *Q2: Basis Dependence (Required).* Focus on the non-uniqueness of the solution. If I train twice, I get different features. Which one is reality?
      *   *Q3: Superposition (Required).* Focus on the mismatch between the model's native geometry (dense/overlapping) and the SAE's geometry (sparse/orthogonal). Are we forcing a square peg into a round hole?
      *   *Q4: Causality (Required).* Focus on intervention. If I kill feature X, does concept X die? Or does the model route around it?
      *   *Q5: Evaluation.* How do we know the SAE isn't just memorizing noise or finding spurious correlations?
