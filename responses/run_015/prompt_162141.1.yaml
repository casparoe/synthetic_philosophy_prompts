answer: |-
  The case can be built to spec; the headline verdict is that the simulation argument fails to dampen longtermist funding because high simulation probability implies high simulated future value.

  A funder allocates £1m between Grant N (near-term health, value V) and Grant F (existential risk, value F). F secures an astronomical future of digital minds and space settlement; naive expected value is F. Let p be the probability we are simulated. Discount-only dampeners argue EV(F) = (1−p)F, assuming simulated futures vanish. Corrected dampeners observe p is high only if mature civilizations run many simulations, implying vast computational capacity. Since simulated minds count equally, the value within a simulation (F_sim) matches base reality (F_base). Thus EV(F) = p·F_sim + (1−p)·F_base ≈ F. Because F ≫ V, all three positions fund F unless p > 1 − (V/F). Given F/V is astronomical, this threshold exceeds 0.9. The structural link between p and simulator capacity prevents dampening; high p implies high F_sim. Costs are comparable; neither grant is artificially weak.

  **Demonstration**

  1.  **Feature doing the work:** The structural link between *p* (simulation probability) and computational capacity. High *p* implies civilizations survive to generate vast value, whether real or simulated.
  2.  **If removed:** If *p* is independent of capacity (e.g., sims are cheap but short), Position 3 collapses to Position 2. Dampening succeeds; EV(F) drops to (1−p)F.
  3.  **If sim-future cutoff removed:** If Position 2 assumes simulated futures are long (Value > 0), it converges with Position 3. Dampening fails regardless of *p*.
  4.  **Worst position's defense:** Position 2 (Discount-only) would argue that ancestor simulations are typically terminated before reaching post-human maturity, keeping F_sim negligible despite high capacity.
  5.  **Non-EV rules:** Yes. Ambiguity-averse rules (e.g., Maximin) would shift to Grant N. The corrected EV relies on contested structural assumptions about simulator behavior, introducing model uncertainty that near-term sureties avoid.
