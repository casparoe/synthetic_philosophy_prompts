      *   *Alternative 3: Institutional Harm (Pogge).* Global order *imposed* by rich nations harms poor nations. (Focuses on negative duties, not positive redistribution).
      *   *Conclusion:* The domestic analogy was likely rhetorical scaffolding. If it collapses, other foundations (harm, capacity, survival) might remain, but the specific "Justice as Redistribution" claim weakens. The user's suspicion that "the conclusion was carrying the analogy" has merit regarding the *statist* analogy, but not necessarily regarding the *existence* of duties.

