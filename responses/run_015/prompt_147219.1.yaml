  2.  **Initial Analysis & Philosophical Context:**

      *   *The Standard View:* Cosmopolitans (e.g., Peter Singer, Thomas Pogge) often argue that borders are morally arbitrary, similar to district lines within a nation. Therefore, duties of justice apply globally.
      *   *The Statist/Nationalist View:* (e.g., John Rawls in *The Law of Peoples*, Michael Blake) argue that coercion, shared institutions, or reciprocity create special duties domestically that don't exist globally.
      *   *The User's Lens:* Thermodynamics/Ecology. This is fascinating. It suggests looking at flows, entropy, boundaries, and equilibrium rather than legalistic contracts.
      *   *Key Tension:* Justice (normative/legalistic) vs. Systems (descriptive/functional). The user is asking if a *systems* analogy works better than a *contractual* analogy.

  3.  **Drafting the Correspondence Table (Task 1):**

      *   *Domestic:* Affluent Taxpayer $\rightarrow$ *International:* Wealthy Nation (or its citizens).
      *   *Domestic:* Disadvantaged Co-citizen $\rightarrow$ *International:* Impoverished Nation (or its citizens).
      *   *Domestic:* Welfare Institution $\rightarrow$ *International:* Foreign Aid Regime (UN, NGOs, bilateral treaties).
      *   *Domestic:* Social Contract/Constitution $\rightarrow$ *International:* International Law/Custom (weak).
      *   *Domestic:* Currency of Obligation (Legal Tender/Tax) $\rightarrow$ *International:* Hard Currency/Resource Flow (but lacks legal enforceability).
      *   *Domestic:* Central Authority (State) $\rightarrow$ *International:* None (Anarchy/Hegemony).

  4.  **Analyzing Disanalogies (Task 2):**

      *   *Harmless Disanalogies:* Cultural differences, language, specific administrative mechanisms. These don't stop the *moral* claim.
      *   *Undermining Disanalogies:*
          1.  *Coercion/Enforcement:* Domestic tax is mandatory; aid is voluntary (mostly). Justice usually implies enforceability.
          2.  *Reciprocity:* Domestic taxpayers get roads, defense, stability. Donor nations don't necessarily get direct returns from aid.
          3.  *Closure:* Domestic economy is somewhat closed/regulated. Global system is open, prone to leakage, corruption, external shocks.
          4.  *Shared Identity/Solidarity:* Welfare relies on "we-ness." Global "we" is weak.

  5.  **Evaluating the "Open System" Model (Task 3):**

      *   *Thermodynamic/Ecological Lens:* Systems seek equilibrium. Energy flows from high potential to low. Boundaries are permeable.
      *   *Application:* Wealth is like energy concentration. Poverty is like high entropy/disorder.
      *   *Does this ground duty?* Not necessarily *moral* duty, but perhaps *functional* necessity. If the system becomes too unstable (climate change, migration, pandemics), the "high energy" nodes suffer.
      *   *Normative Shift:* Moves from "Justice as Fairness" (Rawls) to "Justice as Sustainability/Stability."
      *   *Does it defeat the absence of closure?* Actually, an open-system model *expects* lack of closure. It argues that *because* it's open, flows are necessary to prevent systemic collapse. This might be a stronger basis for *obligation* based on self-preservation or systemic integrity rather than contractual justice.

