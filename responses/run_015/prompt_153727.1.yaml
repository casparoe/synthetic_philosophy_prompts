answer: |-
  You are not reinventing the wheel, and you are not crazy. What you have built is a computational implementation of **Moral Pluralism**, specifically a **Hybrid Ethical Architecture**. The "weird look" you get from philosophers isn't because the idea is nonsense—it's actually one of the most pragmatic approaches in applied ethics—but because your aggregation method (weighted averaging) hides some dangerous philosophical category errors that can lead to catastrophic failure modes in high-stakes environments.

  Here is the breakdown of why this feels right to you, why it makes philosophers nervous, and how to engineer around the pitfalls.

  ### 1. Is the weighted-average approach sound?

  **Conceptually:** Yes. Moral pluralism (the idea that multiple moral principles exist and none is solely supreme) is a standard position in philosophy (e.g., W.D. Ross, Isaiah Berlin).
  **Mathematically:** It is risky.

  The problem is **Incommensurability**.
  In ML, ensembling works because every model is predicting the *same target variable* (e.g., $P(\text{class}=1)$). In your system, the modules are not predicting the same thing.
  *   **Utilitarian Module:** Predicts *consequences* (future state utility).
  *   **Deontological Module:** Predicts *violation status* (binary or ordinal adherence to duty).
  *   **Virtue Module:** Predicts *character alignment* (trait expression).

  **The Failure Mode:**
  Imagine a scenario where the Utilitarian module says **+100** (preventing a fall saves a life) and the Deontological module says **-100** (physically restraining a patient violates bodily autonomy).
  *   **Your Average:** 0. The robot is "indifferent." It might flip a coin.
  *   **The Ethical Reality:** Most ethicists would argue that certain rights act as **side constraints** (Robert Nozick's term), not trade-offs. You cannot "average out" a human rights violation with a safety benefit. If you allow averaging, you have effectively hard-coded Utilitarianism, because any rule can be broken if the safety score is high enough.

  **Recommendation:**
  Do not use a simple linear weighted average. Use a **Constrained Optimization** architecture.
  *   Let the **Deontological Module** act as a hard filter (veto). If a rule violation exceeds a threshold (e.g., "physical restraint without imminent lethal danger"), the action is disallowed regardless of the utilitarian score.
  *   Let the **Utilitarian Module** optimize *within* the set of permissible actions.
  *   Let the **Virtue Module** act as a tie-breaker or a "smoothness" regularizer (prefer the action that is more respectful if safety outcomes are equal).

  ### 2. Scaling: How to get them onto one scale?

  **Do not trust the calibration.**
  If your Utilitarian module is aggressive, it might output -90 to +90. If your Virtue module is conservative, it might output -10 to +10. The Utilitarian module will dominate the decision simply due to variance, not moral weight.

  **Recommendation:**
  *   **Separate Normalization:** Normalize each module's output independently based on its historical distribution (e.g., Z-score or Min-Max scaling to [0, 1] or [-1, 1]).
  *   **Calibration Sets:** Create a "Gold Standard" dataset of 50–100 ethical dilemmas scored by a panel of ethicists and senior nurses. Calibrate each module so that its output distribution matches the panel's consensus *for that specific type of reasoning*.
  *   **Interpretability:** Ensure each module outputs a confidence interval, not just a point estimate. If the Deontology module is "unsure" if a rule applies, that uncertainty should propagate differently than if it is "sure" a rule is violated.

  ### 3. Weights: Credences and Updating

  **Subjective Credences:**
  Using 0.5 / 0.3 / 0.2 as your "credence" in each theory is acceptable as a **prior**. This is effectively saying, "In the absence of data, I lean Utilitarian."

  **Updating based on Disagreement/Staff Behavior:**
  This is the most dangerous part of your pipeline. This invokes the **Is-Ought Problem** (Hume).
  *   **The Risk:** Nursing staff in dementia wards are overworked, stressed, and sometimes act out of convenience rather than ethics. If you update your weights to minimize disagreement with staff, you are not learning *ethics*; you are learning *current workplace culture*. You might automate bias, neglect, or paternalism.
  *   **The "Disagreement" Metric:** If the modules disagree, that is often where the ethical dilemma *is*. Penalizing disagreement forces the system to pretend dilemmas don't exist. You want the system to flag high-disagreement cases for human review, not suppress them.

  **Recommendation:**
  *   **Reflective Equilibrium:** Instead of updating weights based on raw staff behavior, update them based on **reviewed cases**. When the robot flags a high-conflict decision, a human supervisor reviews it. If the supervisor overrides the robot, *that* is the signal to update weights.
  *   **Contextual Weights:** The weights shouldn't be static. In a fire, Utilitarian weight should approach 1.0. In a social conversation, Virtue weight should be higher. Consider making weights dynamic based on the **urgency/risk context**.

  ### 4. What is this called?

  You can stop reinventing it. Search for these terms:
  *   **Moral Pluralism** (The philosophical stance).
  *   **Hybrid Ethical Architectures** (The robotics/AI field).
  *   **Top-down + Bottom-up Ethics** (Your rules are top-down, your learning is bottom-up).
  *   **Value Alignment** (The broader AI safety context).
  *   **Reflective Equilibrium** (The method for tuning your weights).

  Key papers/people to look up:
  *   **Anderson & Anderson:** "GenEth" (They use a similar pluralistic approach for medical ethics).
  *   **Wallach & Allen:** *Moral Machines* (Covers exactly this engineering problem).
  *   **Gabriel:** "Artificial Intelligence, Values, and Alignment."

  ### 5. Applying this to your 2AM Garden Case

  Let's run your current model vs. a refined model.

  **Current Model (Weighted Average):**
  *   **Utilitarian:** +80 (She gets fresh air, mood boost) vs -90 (High fall risk, injury cost). Net: -10.
  *   **Deontological:** -100 (Restraint violates autonomy) vs -20 (Duty of care violated if she falls). Net: -80.
  *   **Virtue:** +50 (Patience) vs -50 (Paternalism). Net: 0.
  *   **Weighted Sum:** Might result in a weak "Stop Her" signal. The robot blocks the door.
  *   **Result:** Resident is angry, feels imprisoned. Dignity loss.

  **Refined Model (Constrained Optimization):**
  *   **Deontological Filter:** Is physical blocking necessary? Is there a less restrictive alternative?
      *   *Check:* Can we accompany her? Can we use a GPS watch and let her walk but alert staff if she leaves the perimeter?
      *   *If "Accompany" is an option:* Restraint is vetoed.
  *   **Utilitarian Optimizer:** Compare "Block Door" vs. "Accompany Her."
      *   "Accompany" has lower fall risk (staff presence) + high autonomy. Score: +90.
      *   "Block" has high safety + low autonomy. Score: -10.
  *   **Decision:** Robot alerts nurse to accompany her, or robot accompanies her if capable.

  ### Summary of Advice

  1.  **Don't Average Constraints:** Move from weighted averaging to **constrained optimization**. Let rules act as gates, not just negative scores.
  2.  **Normalize Inputs:** Z-score each module's output so one doesn't dominate due to scale.
  3.  **Audit the Learning:** Do not update weights based on what nurses *do*. Update based on what ethicists/supervisors *approve* after review.
  4.  **Flag Uncertainty:** When modules disagree strongly, that is not a signal to average; it is a signal to **escalate to human**. Your robot should be designed to know when it doesn't know.

  You are building a system that manages human dignity. The "weird look" philosophers give you is the look of someone watching you mix chemicals that might explode. You don't need to stop the experiment, but you do need to build a better containment vessel.
