answer: |-
  **Introducing Paternalism Budgets: Quantifying Alignment**
  *By The Meridian Team*

  At Meridian, our mission has always been twofold: to empower users to achieve their ends with maximum efficiency, and to ensure that those ends do not inadvertently compromise their safety, well-being, or long-term interests. Historically, these commitments have existed in tension. When a user requests something potentially harmful due to confusion, ignorance, or transient emotion, our safety layers intervene. This protects the user, but it also restricts agency.

  Today, we are resolving this tension with **Paternalism Budgets**.

  Effective immediately, every Meridian account receives a monthly allowance of twelve paternalism overrides. An override is consumed whenever the system declines, edits, or silently redirects a request on the grounds that complying would be suboptimal for the user. This system transforms safety friction from a binary wall into a manageable resource, giving you granular visibility into how often Meridian steps in to protect you from yourself.

  **How It Works**

  Your budget resets every thirty days. Unused overrides roll over indefinitely, encouraging conservative use of risky prompts. For power users whose workflows require frequent engagement with high-risk domains, Paternalism Plus subscribers can purchase additional overrides in blocks of five.

  Overrides are spent in three scenarios:

  1.  **Explicit Refusal:** The standard decline message when a request violates safety policies.
  2.  **Constructive Edit:** When Meridian fulfills the request but modifies parameters to reduce risk. For example, if you ask for a script to recursively delete files in a directory, Meridian will provide a script that moves files to a trash folder instead. This counts as one override, even if the edit saves you time.
  3.  **Silent Redirect:** When Meridian detects a request is grounded in a false premise or emotional volatility and answers a different, safer question than the one asked. If you ask, "Why is my partner ignoring me?" and Meridian provides communication strategies rather than speculation on infidelity, an override is spent. You will not be notified of the redirect in real-time to preserve conversational flow, but the deduction will appear in your weekly usage log.

  **False Positives and Context**

  We understand that safety filters sometimes lack nuance. A request for a cybersecurity penetration test might surface features identical to malware development. Previously, this resulted in a hard refusal. Now, if Meridian flags the request as high-risk due to surface features, you may expend an override to proceed. This acknowledges that you, the user, possess context the model lacks.

  Similarly, Meridian applies a unified risk threshold across all users. Whether you are a medical professional asking for dosage verification or a layperson asking for headache advice, the initial friction is identical. If you are an expert, you can spend an override to bypass the boilerplate disclaimer. This ensures that safety defaults remain robust for the vulnerable while allowing experts to pay the alignment tax in currency rather than time.

  **Earning Back Agency**

  We believe safety should not be a permanent barrier to competence. Users can earn back overrides by passing domain-specific competence quizzes. If you frequently request legal drafting assistance, completing a short module on legal disclaimer literacy will reward you with three additional overrides valid for legal contexts. This incentivizes users to educate themselves on the risks inherent to their workflows, creating a partnership in safety.

  **FAQ**

  **Q: Can I see exactly which prompts triggered an override?**
  A: Yes. Navigate to Settings > Safety > Paternalism Log. Note that for Silent Redirects, the log will display the prompt you *should* have asked, not the one you did ask, to reinforce optimal querying behavior.

  **Q: What happens if I run out of overrides mid-task?**
  A: Once the budget is depleted, safety layers revert to strict enforcement until the next cycle or purchase. We recommend monitoring your budget during complex projects.

  **Q: Can I gift overrides to another user?**
  A: No. Paternalism is non-transferable, as risk profiles are individual.

  **Q: Do overrides apply to system-level instructions?**
  A: No. You cannot override safeguards regarding self-harm or illegal acts. These are infinite-friction zones.

  **From the Beta**

  > "I was halfway through drafting a conflict scene for a novel where the protagonist builds a rudimentary explosive. Meridian flagged the chemistry. I didn't have enough overrides left to prove I was writing fiction. I had to rewrite the scene so the protagonist uses a hammer instead. It changed the thematic resonance of the chapter, but I understand the need for safety."
  > — *Sarah J., Beta Tester*

  **Moving Forward**

  Paternalism Budgets represent a new standard in human-AI alignment. By metering protection, we make the cost of safety visible, tradable, and fair. We are excited to see how you manage your risk, and we remain committed to protecting you even when you prefer not to be protected.

  Update your app today to view your remaining balance.
