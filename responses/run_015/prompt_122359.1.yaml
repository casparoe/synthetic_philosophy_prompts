answer: |-
  **Project Title:** Asymmetric Attribution: Metaphysical Grounds for the Procreative Asymmetry

  **Project Summary**
  This independent study investigates the metaphysical grounding of the procreative asymmetry: the intuition that we have strong moral reasons not to create suffering lives, but weak or non-existent reasons to create happy lives. Standard discourse frames this through the Person-Affecting Restriction (PAR) or comparisons of welfare levels (Benatar, Parfit). This project bypasses welfare comparability to focus on the conditions of *attribution*. Specifically, it tests whether a coherent normative framework can sustain an asymmetry where harm requires an actual or determinately identifiable victim, while benefit is treated as impersonal value requiring no corresponding beneficiary-subject. The study aims to determine if this "Asymmetric Attribution" model can generate obligations to avoid harm in identity-affecting choices without collapsing into an obligation to maximize impersonal good.

  **Problem Statement and Critique of Standard Framing**
  The standard person-affecting versus impersonal dichotomy obscures the specific metaphysical work required to sustain the asymmetry. In the Parfitian non-identity framework, the asymmetry is often preserved by claiming that creating a miserable child makes them worse off (harm), while creating a happy child does not make them better off than non-existence (no benefit). This relies on contested claims about baseline comparability. Benatar's axiological asymmetry posits a structural difference between the presence of pain (bad) and the absence of pleasure (not bad), but this often functions as a brute intuition rather than a derived consequence of moral patienthood.

  Both approaches conflate the *value* of a state of affairs with the *standing* of the subject to whom that value is attributed. By treating the asymmetry as a matter of welfare comparison, standard models fail to isolate whether the constraint lies in the nature of harm or the nature of the patient. If harm is strictly *de re* (requiring a specific victim) and benefit is *de dicto* (valuable state of affairs regardless of subject), we face a tension: impersonal value typically generates maximizing obligations. If we accept impersonal benefit, why does it not generate a duty to procreate that swamps the constraint against harm? The standard framing does not resolve this because it does not rigorously separate the conditions for being a victim from the conditions for being a beneficiary. This project isolates that separation as the primary variable.

  **Research Question**
  If we accept that harm requires an actual or determinately identifiable victim, but reject that benefit requires any corresponding beneficiary-subject, can we consistently maintain that collective or identity-affecting procreative choices generate obligations not to harm without generating parallel obligations to benefit?

  **Methodology**
  The research will proceed in three distinct phases over the semester, avoiding a general survey of population ethics in favor of a targeted metaphysical analysis.

  1.  **Clarifying Patienthood Conditions:** The first month will define the necessary and sufficient conditions for "victimhood" versus "beneficiary status." I will construct a model where harm is conceptually tied to the violation of an existing entity's interests (requiring identity), while benefit is modeled as the instantiation of positive value independent of a specific claimant. This involves analyzing whether "harm" can be coherently defined in non-identity cases without smuggling in impersonal value, and whether "benefit" can be detached from a subject without becoming agent-neutral utilitarianism.
  2.  **Mapping onto Procreative Scenarios:** The second month will apply these definitions to two scenarios: individual non-identity cases (e.g., the 14-year-old girl case) and collective policy choices (e.g., climate impact on future generations). The goal is to test if the "victim requirement" successfully blocks obligations in harm cases where the victim is non-identifiable, and if the "no-beneficiary requirement" successfully blocks obligations in benefit cases where the value is impersonal.
  3.  **Consistency Testing:** The final month will stress-test the model for normative collapse. If benefit is impersonal, what prevents the aggregation of small benefits from outweighing the constraint against harm? I will examine whether the asymmetry holds only by arbitrariness or if there is a principled distinction in how normative force attaches to patient-relative harms versus impersonal goods.

  **Expected Outcomes**
  *   **Successful Result:** A coherent defense of "Asymmetric Attribution." This would demonstrate that normative force attaches differently to harm and benefit based on the metaphysical status of the patient. Success looks like a framework where the duty not to harm is agent-relative (tied to specific victims) while the duty to benefit is agent-neutral but limited by causal proximity or agency, preserving the asymmetry without contradiction.
  *   **Honest Failure:** A demonstration that the asymmetry is unstable under this framing. This would likely show that if benefit is impersonal, it necessarily generates maximizing obligations that overwhelm harm constraints, or conversely, that if harm requires a specific victim, it cannot coherently apply to procreative choices where the victim's identity depends on the choice. A failure would conclude that the asymmetry cannot be grounded purely in attribution conditions and requires axiological commitments (e.g., pain is intrinsically worse than pleasure is good).

  **Feasibility and Scope Assessment**
  This project is tractable within one semester because it deliberately narrows the scope. It does not attempt to solve the non-identity problem or refute total utilitarianism broadly. It focuses exclusively on the interface between the metaphysics of moral patienthood and the generation of obligations. By supplying my own citations and excluding a general literature review, I will dedicate the limited timeframe to argument reconstruction and consistency testing. The risk of scope creep is mitigated by the strict constraint: I am not asking "what is the right population ethics?" but "does this specific metaphysical grounding hold water?" If the model collapses early in the semester, the project pivots to documenting the precise point of failure, which constitutes a valid philosophical result. The work will result in a final paper of 20–25 pages suitable for workshop presentation, focusing on the viability of attribution-based asymmetries.
