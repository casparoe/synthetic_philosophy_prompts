answer: |-
  Here is the strongest philosophical case for the NIMBY position that adheres to your constraints, followed by an honest reckoning with its weaknesses.

  ### The Argument: The Sovereignty of the Lifeworld

  The core of this argument rests on a distinction between **access** and **continuity**, and the moral weight we assign to each.

  **1. The Non-Fungibility of the "Lifeworld"**
  Human flourishing is not just about material resources (income, square footage, commute time); it is about embeddedness in a specific social and physical ecology. Sociologists call this the "lifeworld." It is the tacit knowledge of how to navigate your block, the trust relationship with the local grocer, the unspoken norms of the playground, the rhythm of the street.

  For a long-term resident, this lifeworld is **non-fungible**. You cannot replicate the specific social capital of 15 years on a specific block by moving to a cheaper neighborhood three miles away. If that specific web of relations is severed, a specific form of human value is destroyed that cannot be recovered elsewhere.

  **2. The Asymmetry of Interests**
  When a newcomer seeks housing in a specific neighborhood, their interest is typically one of **access**. They need access to the region's jobs, amenities, and schools. While they may prefer *this* neighborhood, their need is generally satisfiable in *multiple* locations within the region. Their interest is fungible; if Neighborhood A is closed, Neighborhood B might suffice.

  When an incumbent resists change, their interest is one of **continuity**. They are not optimizing for access; they are protecting an existing ecosystem of meaning.

  This creates a moral asymmetry. If you deny the newcomer entry to *this* specific block, they lose a preference (optimization). If you force the incumbent to accept radical physical and demographic churn, they lose a foundation (existence). In a conflict between a preference for optimization and a requirement for continuity, continuity claims priority.

  **3. "Displacement Without Moving"**
  We typically define displacement as physical eviction. But there is a phenomenological displacement that occurs when a neighborhood changes too rapidly. When the "third places" (cafes, parks, community centers) shift from being social hubs to commercial transactions; when the pace of the street accelerates; when the faces in the crowd become transient rather than familiar; the incumbent is psychologically displaced even if they remain in their unit.

  High-density development often correlates with high turnover. Transience erodes the "thick" social ties that constitute the lifeworld. Therefore, the incumbent is not merely protecting a view or a quiet street; they are protecting the *conditions of possibility* for their specific way of life.

  **4. The Right to Stewardship**
  Because the incumbent's lifeworld is non-fungible and uniquely tied to that specific geography, they possess a form of **stewardship sovereignty**. They are the custodians of the social infrastructure that currently exists.

  A developer or a city planner views the neighborhood as a grid of potential yield. The incumbent views it as a living organism. Because the incumbent bears the unique risk of "displacement without moving," they must hold the veto power. To override them is to treat their specific, non-replicable social world as expendable for the sake of aggregate regional efficiency.

  **Conclusion:**
  The right to the city is not a right to *any* coordinate on the map. It is a right to participate in the central life of the region. For the newcomer, this means gaining entry. For the incumbent, this means maintaining the stability required to participate. Since stability is more fragile than entry, the incumbent's claim to decide the pace of change is stronger.

  ***

  ### The Reckoning: Three Fatal Flaws

  This argument is emotionally resonant and philosophically distinct from "protect my property value." However, when pressed, it reveals significant moral hazards and logical inconsistencies.

  **1. Is this just "I Got Mine" with nicer framing?**
  The argument relies on the idea that the incumbent's loss is deeper than the newcomer's loss. But this privileges **stability** over **mobility** as a moral good. Why is the person who *already* has the thing entitled to more moral weight than the person who *needs* the thing?

  If we accept that the incumbent's attachment is non-fungible, we must acknowledge that this attachment is often subsidized by scarcity. The "quiet street" and "thick social ties" often exist *because* supply is constrained. By granting incumbents veto power, you are allowing them to hoard the very scarcity that creates the value of their attachment.

  It creates a moral caste system: Class A (Incumbents) gets to protect their non-fungible lifeworld. Class B (Newcomers) is told their need for housing is fungible and they should go elsewhere. But if every neighborhood adopts this logic, Class B has nowhere to go. The argument works locally but fails globally. It solves the incumbent's problem by exporting the crisis to a less organized community.

  **2. The Fungibility Trap (The Diaspora Counter-Argument)**
  The argument assumes newcomers are atomized consumers looking for "a unit near a job." This is often false.
  *   **The Returnee:** A person who grew up in the neighborhood, was priced out, and wants to return to care for aging parents. Their attachment is just as non-fungible as the incumbent's.
  *   **The Diaspora:** Immigrant communities often cluster in specific neighborhoods for cultural support, language, and religious proximity. For them, *this* neighborhood is not fungible.
  *   **The Displaced:** Someone pushed out of a nearby gentrifying area who has built a life in the region.

  By framing the conflict as "Rooted Incumbent vs. Rootless Newcomer," this NIMBY argument erases the deep place-attachments of outsiders. It assumes that anyone not currently *in* the house doesn't care about the *home*. If the newcomer also has a non-fungible claim (e.g., returning to their childhood home), the moral asymmetry collapses. Who decides which non-fungible claim wins? Usually, the one with the key.

  **3. The Problem of Exclusionary Origins**
  This is the most damning critique. Many neighborhoods' "character" and "shared life" were produced by state-sponsored exclusion.
  *   **Redlining:** The stability of many white neighborhoods was purchased through racial covenants and discriminatory lending that prevented Black families from building similar equity or attachment.
  *   **Urban Renewal:** The "vibrant community" nearby might have been destroyed to build the highway that made the incumbent's suburb accessible.

  If the "lifeworld" the incumbent is protecting was built on the exclusion of others, does it deserve sovereignty?
  *   **The Moral Hazard:** If we grant veto power to incumbents to protect their "shared life," we effectively grant veto power to preserve the *results* of historical injustice.
  *   **The Definition of "We":** The argument assumes the "shared life" is a public good. But often, that shared life is a private club. The "trust relationship with the grocer" doesn't exist for people who weren't allowed to live there to become customers.

  If the neighborhood's character is inextricably linked to its exclusivity, then preserving the character *requires* maintaining exclusion. You cannot have the "small town feel" in a high-demand city without excluding the majority of people who want to live there. The argument commits you to saying that the comfort of the few outweighs the housing needs of the many, even if that comfort is built on a foundation of past segregation.

  ### Synthesis

  The "Place-Attachment" argument is the strongest version of NIMBYism because it appeals to genuine human needs for stability and community, rather than greed. It correctly identifies that housing is not just a commodity but a home.

  However, it fails as a policy prescription because it treats the neighborhood as a closed system. It ignores that:
  1.  **Scarcity is zero-sum:** Protecting one neighborhood's stability often destabilizes the region.
  2.  **Attachments are universal:** Outsiders often have deeper claims than current residents (e.g., heritage vs. tenure).
  3.  **History matters:** You cannot defend the "character" of a place without asking how that character was funded and who was kept out to maintain it.

  The view commits you to a tragic choice: either you accept that some people's "lifeworlds" are more valuable than others (the incumbents), or you admit that preserving a specific lifeworld is not a valid justification for restricting the housing supply needed for others to build *their* lifeworlds. The strongest counter-argument is that **the right to build a life should not depend on being the first one there.**
