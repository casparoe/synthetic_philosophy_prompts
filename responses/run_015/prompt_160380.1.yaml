answer: |-
  ### Desiderata for an Account of Pattern Reality

  | Requirement | Concrete Case (from your list) | Status (Non-negotiable vs. Preference) | What Enforcing It Excludes |
  | :--- | :--- | :--- | :--- |
  | **1. Code Cost Accounting:** The complexity of the vocabulary or encoding scheme used to describe the data must be added to the complexity of the data given that code; a pattern is not real if the code required to specify it is as complex as the data itself. | **The contrived-code case:** A sequence of noise compresses to zero bits only if one adopts a lookup-table code tailored specifically to that sequence after the fact. | **Non-negotiable** (Required for Reality vs. Artifact distinction). | Excludes "gerrymandered" predicates and post-hoc rationalizations that fit noise by inflating the descriptive apparatus. |
  | **2. Counterfactual Stability:** The pattern must support predictions not only about passive observations but about how the system would behave under changes to its inputs or internal parameters, even if those changes are not practically executable. | **The unmanipulable domain:** A regularity in fossil stratification predicts new finds (observational) but cannot be tested by manipulating the past; the account must distinguish this from a pattern that fails under hypothetical structural changes. | **Preference** (Causal Realists require it; Predictive Instrumentalists treat it as optional). | Excludes purely correlational or curve-fitting accounts that cannot distinguish causal structure from coincidental regularity. |
  | **3. Origin Independence:** The reality of a pattern cannot depend on the etiology of the system (e.g., whether it was designed by an engineer or trained by gradient descent); it depends only on the current organization and behavior. | **The no-design-story case:** A neural network exhibits intentional regularities (e.g., "believes" the object is a cat) despite having no modular architecture or rational reconstruction of parts. | **Non-negotiable** (Required for Availability of Stance vs. Reality of Pattern). | Excludes accounts that tie intentional reality strictly to designer intent or functional teleology derived from history rather than current capacity. |
  | **4. Error Tolerance:** The account must allow a pattern to be real even if it admits exceptions, provided the exceptions are themselves systematic or bounded, rather than demanding exceptionless strictness. | **The near-miss:** The intentional stance predicts a system's behavior with 95% accuracy but systematically fails in high-stress contexts; the pattern is not rendered false, but its scope is limited. | **Non-negotiable** (Required for Degrees of Reality vs. Binary Verdict). | Excludes deductive-nomological models of explanation that require strict laws and cannot handle ceteris paribus regularities. |
  | **5. Scale Robustness:** A pattern identified at a specific grain of description must not vanish arbitrarily when the resolution is slightly coarsened or refined; it must exhibit stability across a range of adjacent granularities. | **The grain case:** A regularity appears when behavior is binned into 1-second intervals but disappears at 0.5 seconds or 2 seconds; this suggests an artifact of the binning rather than a system feature. | **Preference** (Structural Realists require it; Phenomenalists may accept grain-relativity). | Excludes patterns that are artifacts of a specific measurement resolution or coordinate system. |
  | **6. Reflexive Consistency:** The criteria used to distinguish real from apparent patterns must themselves satisfy the criteria; the distinction must be a real pattern in the data of scientific practice. | **The reflexivity case:** If the account claims "only interventionally robust patterns are real," that claim itself must be robust under intervention on scientific methodology, not just a useful heuristic for philosophers. | **Non-negotiable** (Required for theoretical coherence). | Excludes self-excepting theories that claim privileged status for their own vocabulary while denying it to others. |

  ***

  ### (a) Tensions Between Requirements

  There are three genuine tensions in this list, not merely verbal disagreements.

  **1. Counterfactual Stability vs. The Unmanipulable Domain.**
  This is a **genuine inconsistency** if "counterfactual" is defined strictly as "underwrites actual experimental manipulation." If reality requires the ability to physically intervene, astronomy and paleontology contain no real patterns, only useful fictions. To resolve this, "intervention" must be broadened to "structural counterfactuals" supported by the system's causal graph, even if the node cannot be externally toggled by an agent. What gives way is the *practical* constraint on intervention; the *logical* constraint remains. If the account cannot support hypothetical interventions even in principle (e.g., "if this fossil layer were older, the species would differ"), it fails to distinguish causal pattern from coincidental sequence.

  **2. Code Cost Accounting vs. Bounded Investigator.**
  This is a **genuine inconsistency** regarding computability. Code Cost Accounting leans on Kolmogorov complexity (the length of the shortest program producing the data), which is uncomputable. A bounded investigator cannot verify whether a code is truly minimal or just compressed by a clever trick they haven't spotted yet. To keep the criterion usable, one must substitute Minimum Description Length (MDL) or a specific computational architecture as a proxy. What gives way is *objectivity*; the verdict becomes relative to the chosen universal Turing machine or modeling language. We pay for usability by accepting that "real pattern" is objective only relative to a background computational complexity class.

  **3. Origin Independence vs. Mind-Independent Structure.**
  This is a **fake tension** that dissolves upon clarification. One might worry that if a pattern is real without a design story, it must be "in the eye of the beholder" (Instrumentalism). However, Origin Independence simply decouples *ontology* from *etiology*. A trained system can have mind-independent causal structure (weights, activations) that supports intentional predictions, even if no one designed it to do so. The tension vanishes if we accept that the "mind-independence" lies in the *dispositional structure* of the system, not in the history of its creation. The Intentional Stance detects real structure; it does not project it.

  ### (b) The Most Exclusionary Requirement

  **Code Cost Accounting** does the most exclusionary work. It is the gatekeeper that prevents the account from collapsing into triviality. Without it, *any* data set contains *any* pattern, provided one is willing to pay for the pattern in the complexity of the vocabulary (the contrived-code case). Enforcing this requirement excludes the vast majority of post-hoc explanations in social science and hermeneutics where the "theory" is as complex as the phenomenon it explains.

  The cost is high: it renders the criterion formally uncomputable for general cases, forcing reliance on approximations (like MDL) that reintroduce interpreter-dependence. However, this cost is worth paying. Without a penalty for code complexity, the distinction between "reality of a pattern" and "usefulness to an interpreter" collapses, because a pattern is always useful if one is allowed to invent a language specifically to describe it. The uncomputability is a theoretical limitation, but the *principle* is necessary to block gerrymandering.

  ### (c) Scorecard for Candidate Views

  **Dennett's Compression Criterion:** This view holds that patterns are real if they support significant compression of the data. It satisfies **Origin Independence** and **Error Tolerance** well, allowing intentional patterns in trained systems. However, it violates the **Code Cost Accounting** requirement in its basic form, as it often treats the vocabulary as given rather than costing it. It also disappoints the **Counterfactual Stability** preference; compression alone does not guarantee that the pattern supports intervention, only prediction. It risks collapsing "reality" into "useful compression" without the two-part code refinement.

  **Minimum Description Length (Two-Part Code):** This refines Dennett by explicitly summing the cost of the model and the cost of the data given the model. It satisfies **Code Cost Accounting** and **Reflexive Consistency** (as MDL is a formal method). It handles the **Grain Case** well by penalizing over-fitting. However, it struggles with **Counterfactual Stability**; a two-part code can be purely statistical and fail to capture causal structure, meaning it might validate patterns that predict observations but fail under intervention. It violates the non-negotiable requirement for export to interventional contexts unless causality is built into the model class.

  **Interventionist / Difference-Making:** This account ties patterns to causal structure defined by invariance under intervention. It excels at **Counterfactual Stability** and distinguishes **Compression vs. Export** sharply. However, it faces a crisis with the **Unmanipulable Domain**; if it insists on actual manipulability, it excludes astronomy. If it relaxes to hypothetical intervention, it converges with structural realism. It also risks violating **Origin Independence** if "intervention" implies a capacity to decompose the system into parts (which fails in the no-design-story case). It violates the non-negotiable requirement if it cannot handle black-box systems.

  **Deflationary / Projectionist:** This view treats pattern-hood as entirely relative to an interpreter's interests. It satisfies **Reflexive Consistency** easily (the distinction itself is just a tool) and handles the **Near-Miss** by dissolving the need for objective truth. However, it violates the **Non-negotiable** distinction between **Reality of a Pattern vs. Usefulness**. By definition, it collapses reality into usefulness. It cannot underwrite the "modest claim about content" you require, because content becomes purely ascribed rather than detected. It fails the core job description of your chapter.
