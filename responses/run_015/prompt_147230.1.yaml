prompt: |-
  Long time lurker, first time poster. I've been chewing on al-Ghazālī's thing about causation for ages now and I keep going round in cirlces because I think there are two different claims getting run together, and I can't work out whether the difference does any work.

  Set up as I understand it: he denies that there's any necessary connection between what we call a cause and what we call its effect. Fire touching cotton doesn't *have to* burn it, the connection is just something God has set up as a habit, and that's what leaves room for the miracle stories (the fire not burning Abraham, that sort of thing). Fine. But I want to separate out:

  (1) Call this "modal inertness": no cause *necessitates* its effect. The conjunction is contingent all the way down.
  (2) Call this "productive inertness": no created thing *brings anything about* at all. God is the only agent; creatures are occasions, not producers.

  Now the bit I made up and can't find anyone discussing, which is why I'm asking here rather than googling. Imagine God, at creation, writes down a complete mapping from total world-state at one instant to total world-state at the next — or just a whole timeline, same difference — and then never does anything again. Call it the "scripted-habit" model. Every stage follows from the script, not from the previous stage's own powers; but there's also no moment-by-moment divine willing, no sustained re-creation, nothing that looks like ongoing action.

  Things I'd like explained, argued out rather than reported:

  - Is the scripted-habit model occasionalism or not? If your answer is "depends how you define occasionalism,", say what's actually at stake in where you draw the line. I want to know which definition is load-bearing for the arguments, not which one is standard.
  - Which of (1) and (2) does the miracle argument actually need? Suppose he only had (1). Couldn't he already say the fire's not burning Abraham violates nothing, so (2) is doing extra work for free? Or does (1) leave a residue — don't we still want to say the fire was disposed to burn and got overridden?
  - On (2), every event is equally a direct divine act. What work is the word "miracle" doing then? Can he keep a principled ordinary-vs-miraculous distinction, or does a miracle just become an event that's rare relative to our inductively learned expectation of God's policy — i.e. a regularity in the policy rather than a break in it? Is that basically a Humean regularity story about laws one level up, or is the analogy misleading? (I keep thinking of it as a prior over God's policy and I suspect that's me forcing a map/territory thing that doesn't belong.)
  - In the interventionist sense of causation — set X, see if Y moves — what happens to intervention under (2)? If the fire isn't doing anything, "intervene on the fire" seems to either collapse or become shorthand for something about the script. Does that mean the causal-graph picture survives occasionalism as a mere compression of the policy, and if so can an occasionalist keep talking causally the way we keep talking agentially about a thermostat?

  Steelman whichever of these you don't instinctively buy, and please flag which of my questions is really a verbal dispute. Also: answer in American English, I'm British and my spelling keeps annoying people here. And go easy on proper names, I can't check anything you cite — if a specific scholar or book matters to your argument, tell me the argument instead.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Long-time lurker, first-time poster. Philosophically sophisticated (understands al-Ghazālī, occasionalism, modal vs. productive inertness, interventionist causation, Humean regularity).
      *   **Tone:** Informal but rigorous ("chewing on," "round in circles," "load-bearing," "steelman").
      *   **Core Problem:** Distinguishing between two claims in al-Ghazālī's occasionalism: (1) Modal Inertness (no necessary connection) vs. (2) Productive Inertness (no created agency).
      *   **Specific Thought Experiment:** The "Scripted-Habit" Model (God sets the timeline at $t=0$ and walks away).
      *   **Questions:**
          1.  Is Scripted-Habit occasionalism? (What's at stake in the definition?)
          2.  Which claim (1 or 2) does the miracle argument need?
          3.  If (2) is true, what work does "miracle" do? (Regular vs. Miraculous distinction).
          4.  What happens to interventionist causation under (2)?
      *   **Constraints:** American English spelling. Go easy on proper names/citations (focus on arguments). Steelman objections. Flag verbal disputes.

  2.  **Deconstruct the "Scripted-Habit" Model:**
      *   *Scenario:* God creates the world with a pre-determined timeline (like a clockwork universe or a movie reel) but without ongoing concurrent causation.
      *   *Comparison:* Standard Occasionalism (Ash'arite) usually involves *continuous* creation/re-creation at every moment. God wills $t_1$, then wills $t_2$, etc.
      *   *The Twist:* The user's model removes the *moment-by-moment* willing. It's Deism + Occasionalist Metaphysics (no creaturely power).
      *   *Is it Occasionalism?* Occasionalism is typically defined by the denial of secondary causation (creaturely efficacy). Whether God sustains it continuously or set it up initially doesn't change the fact that *creatures* aren't doing the work. However, traditional occasionalism often ties into atomism and the discrete nature of time, implying a need for continuous re-creation to prevent annihilation. If the Scripted-Habit model assumes things *persist* without God holding them in existence, it drifts toward Deism. If it assumes God holds them in existence but doesn't *will* each specific event actively, it's a hybrid.
      *   *Load-bearing definition:* The core of occasionalism is the denial of *created* causal power. The mode of divine action (continuous vs. initial) is secondary but affects the "miracle" distinction.

  3.  **Address Question 1: Scripted-Habit and Occasionalism:**
      *   *Verbal Dispute Flag:* Yes, partly. But the metaphysical stakes are about *conservation* vs. *concurrency*.
      *   *Argument:* If "occasionalism" just means "creatures have no causal power," then Scripted-Habit counts. But if it implies "God is the only *ongoing* agent," then Scripted-Habit fails because God isn't ongoing.
      *   *Load-bearing:* The distinction matters for the *miracle* question. If God walked away, miracles are impossible (unless pre-scripted). If God is actively willing every moment, miracles are interruptions of habit.
      *   *Conclusion:* It's "Deistic Occasionalism." It satisfies (2) (no creaturely power) but violates the spirit of Ash'arite occasionalism which requires continuous divine will to sustain existence itself.

  4.  **Address Question 2: Modal (1) vs. Productive (2) Inertness for Miracles:**
      *   *Analysis:* (1) says $A$ doesn't *necessitate* $B$. (2) says $A$ doesn't *produce* $B$.
      *   *The Miracle:* Fire doesn't burn Abraham.
      *   *If only (1):* Fire has power to burn, but it's not *necessary*. God can override the power. This looks like Malebranche or standard theistic interventionism. The fire *tries* to burn, God stops it.
      *   *If (2):* Fire has *no* power. God simply chooses not to create the burning.
      *   *Why (2) is needed:* If (1) is true but (2) is false, the fire *is* an agent. If the fire is an agent, its failure to act requires an explanation (why was its agency thwarted?). If (2) is true, there's no thwarting, just a different choice by the only Agent.
      *   *Steelman (1):* Maybe (1) is enough. If causation is contingent, God can just make the conjunction false.
      *   *Rebuttal:* If the fire has *productive* power, even if contingent, its failure to burn implies a conflict of wills (Fire wills burn, God wills not-burn). (2) dissolves the conflict entirely. Al-Ghazālī wants to protect Divine Omnipotence from being "competed" with. So (2) is doing the heavy lifting to ensure no *competition*.

  5.  **Address Question 3: The Definition of "Miracle" under (2):**
      *   *Problem:* If God does everything, burning cotton and saving Abraham are both direct divine acts. Why call one a miracle?
      *   *Solution:* The distinction shifts from *ontology* (who did it?) to *epistemology/frequency* (what does God usually do?).
      *   *Humean Analogy:* Yes, it is very Humean. Laws are descriptions of God's habits. Miracles are deviations from the habit.
      *   *Is it just rarity?* It's not just rarity; it's *communicative intent*. A miracle is a break in habit *intended* to signal something (prophethood).
      *   *The "Policy" Map:* The user's intuition about a "prior over God's policy" is actually quite accurate to the Ash'arite view. God has a "Custom" (*'ādah*). Miracles are breaches of Custom.
      *   *Verbal Dispute:* If "miracle" means "violation of natural law," and natural laws are just God's habits, then yes, it's a breach of habit. If "miracle" implies "violation of creaturely nature," that concept disappears under (2).

  6.  **Address Question 4: Interventionist Causation:**
      *   *Setup:* Interventionism (Pearl/Woodward) says $X$ causes $Y$ if manipulating $X$ changes $Y$.
      *   *Under (2):* Manipulating the fire (pouring water) leads to no burn.
      *   *Does the graph survive?* Yes, as a "compression of the policy." The causal graph maps God's consistent policy, not creaturely powers.
      *   *Thermostat Analogy:* Perfect. We talk about the thermostat "turning on the heat" even if we know it's just electricity and circuits. Similarly, we talk about fire "burning" knowing it's God's habit.
      *   *Utility:* The causal language remains useful for prediction and navigation, even if metaphysically false regarding *agency*. It describes the *reliability* of the divine script.

  7.  **Review and Refine:**
      *   *Check Constraints:* American spelling (color, favor, model vs. modelling). No heavy citations (explain the argument, don't name-drop Marmura or Kalam cosmologists).
      *   *Tone:* Respectful, engaging, philosophical.
      *   *Steelmanding:* Ensure I argue *for* the positions before critiquing them.
      *   *Flagging Verbal Disputes:* Explicitly state where definitions drive the answer.

  8.  **Drafting the Response (Iterative refinement):**
      *   *Intro:* Acknowledge the sophistication of the distinction (Modal vs. Productive).
      *   *Section 1 (Scripted-Habit):* Distinguish between *ontological dependence* (continuous creation) and *causal efficacy*. The Scripted-Habit model fails the "continuous creation" test usually required for Ash'arite occasionalism, but passes the "no secondary causes" test. The stake is whether the world persists on its own.
      *   *Section 2 (Modal vs. Productive):* Argue that (1) isn't enough. (1) allows for "overriding," (2) allows for "replacement." (2) protects omnipotence better.
      *   *Section 3 (Miracles):* Confirm the Humean intuition. The distinction is epistemic/customary, not ontological. But add the "prophetic claim" element to distinguish from mere randomness.
      *   *Section 4 (Interventionism):* Validate the "compression" idea. Causal talk is pragmatic, not metaphysical.
      *   *Conclusion:* Summarize the "load-bearing" points.

  9.  **Final Polish:** Check American spelling (e.g., "program" not "programme", "center" not "centre"). Ensure the "verbal dispute" flags are clear. (Self-Correction: Make sure not to sound like I'm lecturing on Islamic theology, but rather analyzing the logical structure as requested).

  10. **Final check on "Scripted-Habit":** If God writes the script and leaves, does the world exist at $t_2$? In Ash'arite atomism, accidents don't persist. So the Scripted-Habit model actually *requires* Deistic persistence of substances. This is a key metaphysical divergence. I need to highlight that.

  11. **Final check on Interventionism:** Make sure to clarify that *we* can't actually intervene in the occasionalist sense, but the *counterfactuals* hold because of God's habit.

