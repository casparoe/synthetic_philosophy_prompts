answer: |-
  This is a sharp set of distinctions. You have correctly identified a tension that often gets glossed over in introductory treatments of occasionalism. The split between **Modal Inertness** (contingency of connection) and **Productive Inertness** (denial of agency) is the exact fault line where metaphysical arguments about causation meet theological arguments about omnipotence.

  Here is the breakdown of your four points, keeping the focus on the logical load-bearing walls rather than historical exegesis.

  ### 1. Is the "Scripted-Habit" Model Occasionalism?

  **Verdict:** It is *causally* occasionalist but *ontologically* deist. Whether this counts as "occasionalism" depends on whether you define the doctrine by the denial of secondary causes or by the theory of divine conservation.

  **The Load-Bearing Stake:**
  The stake here is **ontological persistence**. In the standard Ash'arite occasionalist framework (which al-Ghazālī defends), creatures do not just lack causal power; they lack *ontological endurance*. An accident (like "burning" or "motion") cannot persist through two time atoms. Therefore, for the world to exist at $t_2$, God must re-create it at $t_2$.

  Your "Scripted-Habit" model suggests God sets the timeline at $t_0$ and the world persists through $t_1, t_2, t_3$ without further divine input.
  *   **If you define occasionalism as "No created thing has causal power":** Then yes, your model is occasionalist. The fire still doesn't burn the cotton; the script does.
  *   **If you define occasionalism as "God is the only existing agent at every moment":** Then no. Your model grants creatures the power of *existence* (they persist on their own), even if it denies them the power of *efficacy*.

  **Why the line matters:**
  If you adopt the Scripted-Habit model, you lose the ability to explain *why* the script holds. In standard occasionalism, the "habit" holds because God actively wills it at every instant. In your model, the habit holds because... the universe just coasts? That smuggles in a kind of natural necessity (the necessity of persistence) that al-Ghazālī wants to avoid. The "load-bearing" definition of occasionalism is the one that requires **continuous creation**, because that is the only way to guarantee that Modal Inertness (1) remains true at every instant. If the world persists on its own, one might argue it develops its own powers over time.

  ### 2. Which Claim Does the Miracle Argument Need?

  **Verdict:** The miracle argument needs **(2) Productive Inertness**. (1) Modal Inertness is not enough to do the theological work al-Ghazālī requires.

  **Steelmanning (1):**
  You asked: *Couldn't he already say the fire's not burning Abraham violates nothing?*
  Yes, if causation is merely contingent, God can simply choose not to actualize the effect. If I have a disposition to burn cotton, but that disposition isn't necessary, God can suspend it. This looks like a standard "divine override" model (common in later Scholasticism).

  **The Problem with (1):**
  If (1) is true but (2) is false, the fire *is* an agent. It has a real power to burn. If the fire does not burn Abraham, we have a conflict of agents: The Fire wills to burn; God wills not to burn. For God to win, He must overpower the Fire. This implies the Fire has some resistance, some ontological weight that God must push against.
  This threatens **Omnipotence**. If creatures have real productive power, God is not the *sole* actor in the universe; He is the primary actor among secondary actors.

  **Why (2) is Required:**
  If (2) is true, there is no conflict. The fire does not "try" to burn and get stopped. The fire is merely an occasion. God creates the contact between fire and cotton, and then God creates (or does not create) the burning.
  *   **Standard Case:** God creates Contact + God creates Burning.
  *   **Miracle Case:** God creates Contact + God does not create Burning.

  In the Miracle Case under (2), the fire is not "overridden"; it is bypassed entirely. This preserves the idea that God's will is never frustrated. If you only have (1), you have to explain why the fire's power didn't trigger. If you have (2), there is no power to trigger. (2) dissolves the competition; (1) only makes the competition contingent.

  ### 3. What Work is the Word "Miracle" Doing?

  **Verdict:** You are correct to suspect a Humean regularity story. Under (2), the distinction between "ordinary" and "miraculous" is entirely **epistemic and customary**, not ontological.

  **The Humean Analogy:**
  Your intuition about the "prior over God's policy" is effectively correct. In this framework, "Natural Law" is just a description of God's consistent habits (*'ādah*).
  *   **Ordinary Event:** God follows His habit.
  *   **Miracle:** God breaks His habit.

  **Is it just rarity?**
  It is not *just* rarity, or else a random anomaly would be a miracle. It requires **communicative intent**. A miracle is a breach of habit *intended to verify a prophetic claim*.
  However, ontologically, the burning of the cotton and the saving of Abraham are identical in structure: both are direct acts of God. The word "miracle" does no metaphysical work. It does not mean "an event caused differently." It means "an event that signals a disruption in the expected divine policy for a specific rhetorical purpose."

  **The Map/Territory Worry:**
  You worried you are forcing a map/territory distinction. In this specific philosophy, the map *is* the territory. Since there are no "natures" in things (no essential tendency to burn), the only reality is the sequence of events willed by God. Therefore, a "law of nature" is literally just a pattern in God's will. There is no deeper "territory" of creaturely powers beneath the pattern. So your Humean reading is not an imposition; it is arguably the most accurate logical mapping of the position.

  ### 4. Interventionist Causation Under (2)

  **Verdict:** The causal graph survives as a **compression algorithm for divine policy**, and the occasionalist can talk causally exactly the way we talk about thermostats.

  **The Interventionist Collapse:**
  In a standard interventionist account (manipulate $X$ to see if $Y$ changes), if $X$ (fire) has no power, how can you manipulate it?
  *   **Answer:** You don't manipulate the fire's *power*. You manipulate the **occasion**.
  *   When you pour water on the fire, you are not "stopping the fire's power." You are presenting God with a new occasion (Wet Cotton + Fire) for which His habit is to *not* create burning.

  **The Causal Graph:**
  The causal graph ($Fire \rightarrow Smoke$) remains valid as a predictive tool. It describes the reliability of God's habit.
  *   **Metaphysical Truth:** God wills $t_1$ (Fire) and $t_2$ (Smoke).
  *   **Pragmatic Truth:** Fire causes Smoke.

  **The Thermostat Analogy:**
  Your analogy is perfect. When we say "The thermostat turned on the furnace," we know the thermostat is a passive bimetallic strip. It has no agency. But because the strip's bending is reliably connected to the furnace activating (via the electrical script), we treat it as a cause.
  The occasionalist treats "Fire" exactly like the thermostat. It is a passive indicator that signals what God is about to do next.
  *   **Can they keep talking causally?** Yes. To deny causal language would be to deny the reliability of God's habit, which borders on accusing God of chaos.
  *   **Load-bearing distinction:** The occasionalist must treat causal claims as **counterfactuals about God's policy**, not claims about creaturely capacity. "If I had not struck the match, the fire would not have started" translates to "If I had not presented the occasion of striking, God's habit would not have included creating a fire."

  ### Summary of Load-Bearing Points

  1.  **Scripted-Habit:** This fails strict occasionalism if it implies creatures persist without God's continuous will. The "load-bearing" definition of occasionalism is **Continuous Creation**, not just **No Secondary Causation**. Without continuous creation, you risk reintroducing necessity through persistence.
  2.  **Modal vs. Productive:** You need **Productive Inertness (2)**. Modal Inertness (1) leaves room for creaturely agency that merely *happens* to be contingent. Productive Inertness ensures God faces no competition, which is required for the specific theological version of the miracle argument al-Ghazālī uses.
  3.  **Miracles:** The distinction is **Customary, not Ontological**. It is a Humean regularity view applied to Divine Will. A miracle is a deliberate breach of habit for communication, not a different *kind* of causation.
  4.  **Interventionism:** Causal language survives as **pragmatic shorthand**. It maps the divine policy, not creaturely power. You can intervene on occasions, and the graph predicts God's response based on His established habit.

  **Final Flag on Verbal Disputes:**
  The question "Is Scripted-Habit occasionalism?" is largely verbal. The substantive question is: "Does the world persist on its own?" If yes, you have Deism. If no, you have Occasionalism. The label matters less than the commitment to continuous creation.

  The question "Is this Humean?" is also partly verbal. Hume denied necessary connection but kept the world running on its own. Al-Ghazālī denies necessary connection and says God runs the world. The *structure of the causation* (regularity without necessity) is identical; the *substrate* (God vs. Brute Fact) is different. Your intuition about the "policy prior" captures the structural identity perfectly.
