  However, we must equally resist the gravity of greedy reductionism. To claim this mechanism is *nothing but* brass and escapement is to blind ourselves to the very errors we seek to correct. Consider the pallet fork engaging the escape wheel. Physically, it is merely steel biting steel, governed by friction and momentum. But functionally, this engagement is a decision point between sidereal and solar tracking. The brass itself does not know the difference; the arrangement does.

  If you reduce the clock to its constituent atoms, the misalignment vanishes, for atoms have no schedule. They merely exist. Yet, if I repair this escapement solely as a metallurgical object, ignoring the temporal purpose it embodies, the clock will run, but it will lie. It will tell solar time when it was commissioned for the stars. To dismiss this purpose as mere illusion is to render my craft unintelligible. Why file one micron off the pallet stone rather than another? Without the emergent standard of "accurate time," the file stroke is arbitrary noise. The reductionist sees only metal; the restorer sees a promise kept or broken. If purpose is illusion, then error is impossible, and repair is meaningless. You cannot fix a lie if the clock is only telling the truth of physics.

