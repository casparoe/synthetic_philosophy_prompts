      *   *Determinism:* Weather is ontologically deterministic (classically). History involves agency, which introduces genuine indeterminacy (or at least reflexive unpredictability).
      *   *Repeatability:* Weather systems can be simulated repeatedly with slight variations. History happens once (N=1). We cannot run the July Crisis 10,000 times.
      *   *Reflexivity:* The atmosphere doesn't read weather forecasts and change behavior. Historical actors read history, anticipate outcomes, and change plans (self-fulfilling/defeating prophecies).
      *   *Scale:* In chaos theory, micro-perturbations *always* amplify eventually. In history, many micro-perturbations are dampened by institutions (buffers).

  5.  **Addressing Determinism, Agency, and Inevitability:**

      *   *The Trap:* Using chaos theory implies history *is* deterministic but just hard to calculate. This sidelines agency.
      *   *The "Inevitability" Smuggle:* If the system is near a bifurcation point, *any* spark causes war. This supports the "tinderbox" theory (structural inevitability) rather than the "butterfly" theory (contingency). The user needs to distinguish between *sensitivity* (contingency) and *instability* (structural pressure).
