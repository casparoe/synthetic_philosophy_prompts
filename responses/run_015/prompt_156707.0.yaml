answer: |-
  There is no single, canonical Latin name for this specific inferential move in Western logic textbooks (unlike *ad hominem* or *post hoc*). However, in analytic philosophy and cognitive science, it is best described as an **Intensional-Extensional Confusion** or, more descriptively, the **Fallacy of Exclusionary Specification**.

  In the context of Aristotelian logic, it is a misuse of the **differentia**. A *differentia* (the distinguishing feature of a species within a genus) is meant to specify a subset, not to eject the subject from the genus. By treating a specifying modifier as an excluding condition, the interlocutor converts a subset relation ($A \subset B$) into a disjoint relation ($A \cap B = \emptyset$).

  Here is a detailed breakdown of the logical structure, its relationship to Gongsun Long, and the boundary conditions where such exclusion is actually valid.

  ### 1. The Logical Structure: Intension vs. Extension

  To understand the error, we must distinguish between **intension** (the internal content or definition of a concept) and **extension** (the set of all objects to which the concept applies).

  *   **Base Category ($C$):** e.g., "Horse," "Art," "Life."
  *   **Modifier ($M$):** e.g., "White," "Algorithmic," "Synthetic."
  *   **Compound ($M$-$C$):** e.g., "White Horse," "AI Art," "Synthetic Life."

  **The Valid Logical Relation:**
  The intension of $M$-$C$ is *greater* than $C$ (it has more defining features). Consequently, the extension of $M$-$C$ is *smaller* than (or equal to) $C$.
  $$ \text{Extension}(M\text{-}C) \subseteq \text{Extension}(C) $$
  *Example:* All white horses are horses.

  **The Fallacious Move:**
  The interlocutor argues that because the intension of $M$-$C$ differs from $C$, the extension must be disjoint.
  $$ \text{Extension}(M\text{-}C) \cap \text{Extension}(C) = \emptyset $$
  *Example:* "Because 'white horse' includes 'white' and 'horse' does not, a white horse is not a horse."

  This is an **Intensional Fallacy**. It conflates the *concept* of the thing with the *membership* of the thing. It treats the addition of information as a subtraction of identity.

  ### 2. Relation to Gongsun Long ("White Horse is Not Horse")

  Your intuition is correct: the modern pattern echoes the *Bai Ma Fei Ma* (White Horse Dialogue). However, there is a crucial divergence in **ontological commitment**.

  **Gongsun Long's Argument (c. 300 BCE):**
  Gongsun Long was a member of the School of Names (*Mingjia*). His argument was primarily semantic and metaphysical, not merely sophistical.
  *   **Premise 1:** "Horse" names the shape/form.
  *   **Premise 2:** "White" names the color.
  *   **Premise 3:** "White Horse" names shape + color.
  *   **Conclusion:** The *name* "White Horse" is not identical to the *name* "Horse."

  Gongsun Long was arguing about **reference and identity of terms**, not necessarily biological classification. He was highlighting that the *concept* "White Horse" is not interchangeable with the *concept* "Horse" in all contexts (e.g., if you ask for a horse, a yellow one suffices; if you ask for a white horse, it does not). He was exposing the gap between language (*Ming*) and actuality (*Shi*).

  **The Modern Argument:**
  Modern interlocutors (e.g., "AI Art is not Art") are usually making an **ontological or normative claim**, not a semantic one.
  *   They are not arguing that the *term* "AI Art" differs from "Art."
  *   They are arguing that the *object* fails to possess the essential status of the category.

  **The Difference:**
  Gongsun Long's paradox is a rigorous (if controversial) exploration of how modifiers change reference. The modern debater's move is often a **Category Mistake** (in Gilbert Ryle's sense) disguised as a definition. They treat a *method of production* (algorithmic, synthetic) as an *ontological disqualifier*, whereas Gongsun Long treated the modifier as a *logical determinant*.

  In short: Gongsun Long argued that "White Horse" $\neq$ "Horse" (as concepts). Modern debaters argue that "White Horse" $\notin$ "Horse" (as a class). The latter is logically invalid in standard taxonomy; the former is a nuanced point about language.

  ### 3. Boundary Conditions: When is the Exclusion Justified?

  You asked if there are contexts where this exclusion is justified rather than a category mistake. There are. The validity depends on whether the category is defined by **functional/structural properties** or by **provenance/historical properties**.

  #### A. Functional/Structural Categories (Exclusion is a Fallacy)
  If the category is defined by what the thing *is* or *does*, adding a modifier cannot exclude it.
  *   **Biology:** A "synthetic cell" that metabolizes, reproduces, and evolves is biologically alive. To say "It is synthetic, therefore it is not life" is the fallacy. The modifier "synthetic" describes origin, not current state.
  *   **Mathematics:** A "computer-generated proof" is still a proof.

  #### B. Provenance-Dependent Categories (Exclusion is Valid)
  If the category is defined partly by *how it came to be* or *who made it*, the modifier is constitutive, not incidental. In these cases, the "additional feature" actually negates a hidden necessary condition of the base category.

  1.  **Art & Authenticity:**
      *   **Claim:** "This is a forgery, therefore it is not a Rembrandt."
      *   **Validity:** **Valid.** The category "Rembrandt" implicitly contains the condition "painted by Rembrandt." The modifier "forged" contradicts a necessary condition of the base category. Here, "Forged Rembrandt" is an oxymoron that excludes the object from the class "Rembrandt Paintings."
      *   **Contrast:** "This is digital, therefore it is not Art." **Invalid.** "Art" does not implicitly require "physical paint."

  2.  **Legal Taxonomy:**
      *   **Claim:** "This is a naturalized citizen, therefore they are not a 'natural born' citizen."
      *   **Validity:** **Valid.** The legal category "natural born" explicitly excludes the modifier "naturalized." The compound term names a distinct legal class that is disjoint from the base term in the context of eligibility.
      *   **Claim:** "This is an electronic signature, therefore it is not a signature."
      *   **Validity:** **Invalid (in modern law).** Statutes have redefined "signature" to include electronic markers. If the law defines signature functionally (intent to authenticate), the modifier is irrelevant.

  3.  **Safety & Regulation (The "GMO" Case):**
      *   **Claim:** "This is genetically modified corn, therefore it is not conventional corn."
      *   **Validity:** **Pragmatically Valid.** While biologically it is *Zea mays*, regulatory frameworks treat "GMO" as a disjoint category for labeling and safety testing. Here, the exclusion is not ontological but **regulatory**. The category "Food for Labeling Purposes" treats GMO and Non-GMO as disjoint sets, even if biology treats them as overlapping.

  ### 4. Why This Pattern Persists (Cognitive Mechanisms)

  If the logic is often flawed, why is the pattern so persuasive?

  1.  **Prototype Theory:** Humans categorize by resemblance to a "best example" (prototype), not by necessary and sufficient conditions. A "robin" is a better prototype of "bird" than a "penguin." When an entity (e.g., "AI Art") deviates too far from the prototype (human creativity), cognitive friction occurs. People resolve this friction by ejecting the entity from the category entirely rather than expanding the category boundary.
  2.  **Implicit Normativity:** Often, the base term carries a hidden normative load. "Democracy" often implies "human deliberation." "Digital Democracy" introduces "algorithmic mediation." If the interlocutor values human deliberation as essential, the algorithmic modifier is seen as corrosive to the essence, justifying exclusion. This is **Essentialism**, but specifically **Normative Essentialism**.
  3.  **The "Toy Gun" Effect:** In language, some modifiers *do* function as exclusions. A "toy gun" is not a "gun" (in the category of weapons). A "fake diamond" is not a "diamond." Interlocutors borrow this linguistic pattern and apply it to cases where it doesn't fit (e.g., "virtual community" is still a "community," unlike a "toy gun").

  ### 5. Summary Diagnosis

  *   **Name:** **The Fallacy of Exclusionary Specification** (or Intensional-Extensional Confusion).
  *   **Logical Error:** Treating a **Subset** relation as a **Disjoint** relation. Treating a *differentia* as a *negation*.
  *   **Gongsun Long Relation:** It mimics the *structure* of the White Horse dialogue but lacks the *semantic precision*. Gongsun Long argued about the non-identity of names; modern debaters argue about the non-membership of objects.
  *   **Justification:** The move is only justified when the modifier contradicts a **necessary condition of provenance** inherent in the base category (e.g., "Natural Born," "Authentic," "Original"). It is a fallacy when the base category is defined functionally or structurally (e.g., "Life," "Art," "Election").

  When you encounter this argument, the precise counter-move is to ask: **"Is the modifier you are citing (synthetic, algorithmic) incidental to the definition of the category, or is it constitutive of the category's exclusion criteria?"** If the category is defined by function (e.g., "voting"), the modifier is incidental. If the category is defined by origin (e.g., "natural"), the modifier is constitutive. Most modern debates fail to make this distinction.
