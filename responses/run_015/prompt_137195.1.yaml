      *   *Resolution Strategies:*
          *   Epistemic Blindspot: The announcement creates a state where the truth cannot be *known* by the hearer, even if true.
          *   Self-Reference: The announcement refers to the hearer's knowledge of the announcement itself.
          *   Iterated Knowledge: Distinguish between "I don't know" and "I know that I don't know."
      *   *Key Variables for Fiction:*
          *   **Fixed Window:** Is there a hard end date? (Crucial for backward induction).
          *   **Guarantee:** Must it happen, or might it? (If "might," the paradox weakens).
          *   **Definition of Surprise:** "Logically undeducible" vs. "Psychologically unexpected." (The paradox relies on the former; fiction often relies on the latter).
          *   **Speaker Knowledge:** Does the announcer know the date? (If the announcer is also ignorant, the epistemic state changes).
          *   **Trust/Common Knowledge:** Do the hearers believe the announcement? (If they doubt it, the induction breaks).

