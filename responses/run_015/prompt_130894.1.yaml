prompt: |-
  You are an expert philosophy-of-mind exam designer with training in ethics and philosophy of science, and you should treat this as a serious assessment-building task. I am not an academic; I have been thinking independently about panpsychism and whether fundamental physical processes might involve something like suffering. Before drafting anything, please take a moment to brainstorm the core conceptual crux: the gap between saying that minimal experience is distributed through quantum or thermodynamic systems and actually deriving a coherent ethical constraint from that claim, especially when we try to avoid both moral catastrophe and an ad hoc boundary.

  Please write one exam question for an upper-level undergraduate philosophy-of-mind seminar. The question must center on the ethical implications of panpsychism, but it should be impossible to answer well by merely summarizing standard panpsychist positions or reciting familiar labels. To ensure that, embed the following constructed scenario directly into the prompt: imagine a hypothetical principle called gradient-affective proportionality, which holds that any physical system sustaining a non-equilibrium entropy gradient possesses a minimal form of affective experience whose intensity scales with the rate of entropy production, but only when the gradient is maintained by integrated informational boundaries rather than by diffuse thermal noise. The exam question should ask students to evaluate whether this principle solves, relocates, or worsens the problem of ubiquitous suffering in fundamental physics, and it should force them to confront why physical dynamics alone might fail to determine moral status.

  Write the exam question itself, followed by a model answer of approximately 800 words, and a marking scheme totaling 25 marks. The marking scheme must identify five specific intellectual moves that distinguish an excellent answer from a good one, with marks assigned to each move, and it must include a one-line note on the typical error or omission that costs marks in each case. Design the question for a 90-minute sitting. Do not include any request for bibliographies, reading lists, or citations, and do not invoke obscure named theories, proprietary frameworks, or specific scholars' texts that a student could not be expected to know without searching. The difficulty should come from reasoning through the tension between physical dynamics and moral status, not from recalling names or titles. Think carefully, work through the logic step by step, and make sure the model answer demonstrates exactly how a student should navigate the argument without relying on outside sources.
