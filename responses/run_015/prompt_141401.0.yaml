  6.  **Self-Correction/Nuance Check during Drafting:**
      *   *Check:* Did I distinguish between *nirvikalpa* and *savikalpa* clearly? *Correction:* Ensure I state that *pramā* (knowledge) is typically *savikalpa*, even if *pratyakṣa* starts with *nirvikalpa*.
      *   *Check:* Is the "Form vs. Content" point on Inference clear? *Correction:* Emphasize *vyāpti*. It's not formal validity; it's material pervasion.
      *   *Check:* Upamāna. *Correction:* Make sure to note that the handout adopts the *Buddhist* critique as if it were the *Nyāya* position. This is a crucial error.
