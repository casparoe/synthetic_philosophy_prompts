      *   Claim 1: *Pramāṇa* = reliable belief-forming process (Reliabilism).
      *   Claim 2: Nyāya recognizes four *pramāṇas*.
      *   Claim 3: Perception (*pratyakṣa*) = bare sensory contact, pre-conceptual.
      *   Claim 4: Inference (*anumāna*) = five-membered syllogism, valid form rather than content.
