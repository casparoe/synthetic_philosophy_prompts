prompt: |-
  I've been kind of obsessed with this ever since my grandmother died last spring and my family fought over her obituary — everyone wanted a different charcter of her, and it made me realize that once you're dead people can just remake you into whatever they need. Now I'm watching Amadeus for a film class I'm taking, and I'm stuck on how the movie turns Salieri into this bitter, talentless villain and Mozart into this giggling genius, when historically Salieri was actually a respected teacher and composer.

  The movie is beautiful but it feels like it's exploiting this weird asymmetry: they're dead, they can't correct the record, and we just use them for emotional payoff. There's this idea I ran into — maybe I made it up — about the "epistemic vulnerability of the dead": dramatizing real people who can't defend themselves isn't just inaccurate, it's a kind of moral harm because you're locking them into a false identity that lasts forever. I want to read Amadeus through that lens, but I need an honest critic too: where does the film actually show that the dead still matter, and where does it just accept that art gets to rewrite people? Point me to specific scenes — like the confession scene or the deathbed stuff — and tell me where the philosophical idea illuminates what's happening, and where the movie pushes back hard enough that you have to admit the theory doesn't quite fit. I'm prepping this for a discussion group so please don't just summarize the plot, and I'm not asking for citations or a reading list — just your actual read.
