answer: |-
  First, I want to acknowledge how sharp your intuition is here. What you're calling the "epistemic vulnerability of the dead" is exactly the wound your family opened when fighting over the obituary. An obituary is the first draft of history written by the survivors, and *Amadeus* is essentially a two-hour obituary written by a man who hated the deceased.

  Your lens is powerful, but *Amadeus* is slippery. It doesn't just exploit this vulnerability; it puts it on trial. Here is an honest read of where your theory holds water and where the film spills out of the cup.

  ### Where the Theory Holds: Salieri as the Ultimate Obituary Writer

  Your concept fits perfectly with the framing device. The entire film is Salieri speaking from an asylum in 1823, decades after Mozart's death. He is literally controlling the narrative of a man who cannot speak back.

  **The Confession Scene (The Masked Figure)**
  This is the clearest example of epistemic harm. Mozart is on his deathbed, terrified, believing he is being haunted by a masked figure (Salieri in disguise) commissioning a Requiem for himself. Salieri uses this moment to extract the music from Mozart, but more importantly, to extract a *confession* of sorts. He positions himself as the priest, the judge, and the executioner.
  *   **The Lens:** Salieri is actively rewriting Mozart's final days. He turns Mozart's confusion and illness into a conspiracy where Salieri is the central antagonist. He needs Mozart to be a victim so that Salieri can be the villain. In your terms, he is locking Mozart into a "false identity" (the doomed child) to serve Salieri's own spiritual drama. He is stealing the authorship of Mozart's death just as he tries to steal the authorship of the Requiem.

  **The Narration of the "Giggling Genius"**
  Throughout the film, Salieri emphasizes Mozart's vulgarity—the scatological jokes, the crude laugh.
  *   **The Lens:** This serves Salieri's theological argument: *How could God speak through such a vessel?* By amplifying Mozart's immaturity, Salieri makes his own bitterness seem more righteous. He creates a caricature. If Mozart were dignified, Salieri's envy would look petty. By making Mozart a "dirty child," Salieri makes his own struggle seem cosmic. This is the moral harm you identified: reducing a complex human to a plot device in someone else's tragedy.

  ### Where the Theory Breaks: The Art Escapes the Narrator

  This is where the film pushes back hard. If your theory is that the dead are *locked* into a false identity, *Amadeus* suggests that great art possesses an agency that outlasts the biographer. The music refuses to stay in the box Salieri builds for it.

  **The Dictation of the Requiem**
  There is a scene where Mozart, delirious and dying, dictates the *Lacrimosa* to Salieri. Salieri is transcribing, weeping.
  *   **The Push Back:** In this moment, the power dynamic flips. Salieri thinks he is capturing the music, perhaps even stealing it. But the camera focuses on the ink, on the notes, on Mozart's voice. Salieri is reduced to a scribe. He realizes that no matter what he does to Mozart's reputation, he cannot *be* Mozart. The music is a truth that exists independently of the biography. Salieri can lie about the man, but he cannot lie about the score. The dead Mozart is still speaking louder than the living Salieri. The "false identity" Salieri tries to impose doesn't stick because the art is too overwhelming.

  **The Final Absolution**
  At the very end, Salieri wheels himself out to the courtyard of the asylum. He addresses the "mediocrities" of the world, absolving them, and declares himself the "Patron Saint of Mediocrity." He laughs, a sound that echoes Mozart's giggle.
  *   **The Push Back:** This is the crucial twist. Salieri tried to destroy Mozart to make himself significant. Instead, Mozart's existence is the only reason anyone remembers Salieri at all. By trying to lock Mozart into a false identity, Salieri has locked *himself* into a permanent purgatory.
  *   **Why the theory doesn't quite fit:** Your theory suggests the harm is done *to the dead*. The film argues the harm rebounds on the *living manipulator*. Mozart is dead; he doesn't care. But Salieri is alive, and he is tortured. The film suggests that while you can rewrite the dead, you cannot escape the truth of what they created. The "epistemic vulnerability" is real, but it's a trap for the liar, not just the lied-about.

  ### The Meta-Layer: The Film Confesses Its Own Sin

  There is one more layer to consider for your discussion group. Peter Shaffer (the playwright) and Miloš Forman (the director) know Salieri is lying. They aren't trying to make a documentary; they are making a film about memory and envy.

  **The Opening Scene**
  Salieri starts by telling the priests, "I will speak for you. I will speak for all the mediocrities." He admits he is constructing a narrative.
  *   **The Insight:** The film is self-aware. It winks at the audience. It says, "Yes, we are exploiting the dead. Yes, we are turning Mozart into a caricature." By admitting this upfront, the film disarms the moral harm slightly. It invites us to question the narrator.
  *   **Discussion Point:** Unlike your grandmother's obituary, which likely claimed to be the "truth," *Amadeus* presents itself as a "confession." A confession admits guilt. Salieri admits he is envious, he admits he is manipulative. The film doesn't ask us to believe Salieri's version of Mozart; it asks us to believe Salieri's version of *Salieri*.

  ### Summary for Your Group

  If I were sitting in that discussion group, here is how I would synthesize your idea with the film:

  1.  **Validate the Vulnerability:** The film proves your point that the dead are raw material for the living. Salieri treats Mozart's life like clay to mold his own martyrdom. The "giggling genius" is a construct designed to make Salieri's pain make sense.
  2.  **Challenge the Permanence:** However, the film argues that this "locking in" is temporary. The art (the Requiem, *The Magic Flute*) eventually sheds the biographical baggage. Two hundred years later, we don't remember the "giggling man"; we remember the music. The dead escape the obituary through their work.
  3.  **The Moral Cost:** The film shifts the moral weight. The harm isn't just that Mozart is misrepresented; it's that Salieri destroys his own soul trying to do the representing. He becomes a ghost while Mozart is still alive in the music.

  Your grandmother's obituary fight was painful because everyone wanted to claim her to validate themselves. *Amadeus* shows us the extreme end of that: Salieri claims Mozart so completely that he loses himself. The film suggests that while we *can* remake the dead, we shouldn't, because in doing so, we reveal more about our own hunger than their reality.
