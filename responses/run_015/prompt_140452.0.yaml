      *   *Scope Fallacy:* The move from "Necessarily, there is a contingent being" to "There is a necessary being" is invalid *unless* you argue that the *collection* of contingent beings cannot be necessary. This is the heart of the Cosmological Argument (e.g., Leibniz). I need to make sure the user sees that their argument *is* a Cosmological Argument, just dressed in modal logic clothes.
