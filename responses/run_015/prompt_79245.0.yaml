          *   Identify the *single revision* that cleans up the most mess.
          *   Avoid dismissive advice like "just become a nihilist/universalist."
          *   Focus on whether the package *as it stands* can hold.
      *   **Input:** Six numbered claims + one discussion habit.
          1.  Restricted Composition (Real answer, no universalism).
          2.  Causal/Functional Criterion (Unified causal process).
          3.  No Ontic Vagueness (Determinacy in the world).
