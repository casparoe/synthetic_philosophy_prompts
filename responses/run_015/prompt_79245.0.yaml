          *   *Why?* The combination of Restricted Composition (1) + Causal Criterion (2) + No Vagueness (3) is the "Lewis/Sider Trap." Sider argues that if composition is restricted, and the world is precise, the boundary must be sharp. But if the criterion is causal/functional, the boundary *cannot* be sharp without absurdity.
          *   *Revision:* Allow ontic vagueness (or at least indeterminacy in composition).
