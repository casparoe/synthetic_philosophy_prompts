answer: |-
  - **Bottom line**
  You should argue to **allow them to vote**. Your committee's strongest pattern is "Formal Enrollment + Present at Start," which admitted exchange students and feeder 8th graders despite their transient status. Denying these remote students based on "lack of usage" creates a dangerous precedent that enrolled students can be disenfranchised if adults decide they don't "use" school enough. That logic could later exclude homebound or medically isolated students. Stick to the enrollment precedent; it's the only bright line you have that hasn't been contradicted.

  - **Rules that fit our precedents**
  Three distinct rules explain your six past decisions, but they conflict here.
  1.  **The Enrollment Rule:** If you are officially on the student roll at vote time, you vote. This fits every "Allowed" case (Exchange, Feeder, Suspended) and excludes every "Not Allowed" non-student (Teachers, Parents, Workers, Alumni). **Verdict: Yes.**
  2.  **The Initiation Rule:** If you are enrolled when the policy begins, you vote, regardless of duration. This fits Exchange (gone before end) and Feeder (not here yet) but excludes Alumni (gone before start). **Verdict: Yes.**
  3.  **The Physical Stake Rule:** If the vote concerns a physical asset, you must be capable of using it. This excludes Parents/Workers (Cafeteria) and Alumni (Renaming affects them, but they lack current stake). **Verdict: No.**
  The Remote Students fit Rules 1 and 2 perfectly but fail Rule 3. Your committee has never explicitly prioritized Rule 3 over Enrollment before; usually, physical stake arguments were used to exclude non-students, not enrolled ones.

  - **Closest analog**
  The **Exchange Students** (Bell Schedule) are the closest match. Both groups are fully enrolled, both are present when the policy starts, and both will leave before the policy ends. The match breaks down on physical presence. Exchange students physically occupy the building daily; the bell schedule dictates their bodily movement. The remote students never inhabit the space the bond affects. If you rule against the remote kids, you are implicitly arguing that "physical occupancy" matters more than "enrollment status," which contradicts the Feeder 8th graders (who voted on laptops they hadn't physically touched yet). You have to decide if "never touching the field" is worse than "not having the laptop yet."

  - **What we'd be committing to**
  Allowing them votes locks you into **Enrollment Supremacy**: any enrolled student votes on everything, even if they never benefit. This protects vulnerable students (homebound/suspended) but lets non-users decide capital costs. Denying them locks you into **Usage Supremacy**: enrolled students can be disenfranchised if they don't physically use the asset. This risks excluding sick students later.
  The **Proxy/Future Vote** idea commits you to **Intergenerational Equity**. It acknowledges that long-term bonds bind future people who can't vote. However, it complicates legitimacy: a teacher voting for "future students" is undemocratic, and re-ratification creates instability (what if the future vote fails?). Since you already rejected fractional votes, introducing a proxy now suggests impact matters more than status, which undermines your previous "one student, one vote" consistency.

  - **The case that would settle it**
  Bring up a **Medically Homebound Student**. Imagine a fully enrolled student who cannot come to campus for a year due to illness. They pay full fees but cannot physically use the field house.
  *   Under **Enrollment/Initiation Rules**, they must vote (they are students, here at start).
  *   Under **Physical Stake Rule**, they should not vote (they cannot use the field).
  If your committee says the homebound student *can* vote, you must let the remote students vote too (consistency on enrollment). If you say the homebound student *cannot* vote, you establish that physical capability trumps enrollment, which justifies blocking the remote students but endangers suspended students (who also can't access campus). This forces the committee to pick which principle actually drives their decisions.

  - **Settled vs contested**
  This is the **"Boundary Problem"** in democratic theory. There is **no consensus** among philosophers on who constitutes the "demos."
  *   **Settled:** Scholars agree there are two competing principles: the *All-Subjected Principle* (all bound by the law vote) and the *All-Affected Principle* (all impacted by the decision vote). Your committee mixes both.
  *   **Contested:** There is genuine disagreement on which principle is correct. Some argue only permanent residents should vote (excludes exchange); others argue everyone affected financially should vote (includes parents).
  *   **My Call:** My recommendation to prioritize Enrollment is not philosophical truth; it's pragmatic advice based on your specific precedent history. Political theory cannot tell you the "right" answer, only that you must choose a principle and apply it consistently to avoid arbitrariness. Don't let anyone claim philosophy solves this for you.
