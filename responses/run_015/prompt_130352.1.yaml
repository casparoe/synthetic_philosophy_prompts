      *   Ensure directness.
      *   Check word count.

      *(Self-Correction during drafting)*: I need to make sure I don't just list them but *rank* them as requested. I need to be explicit about "what gives" and "the cost."

      *(Drafting thought)*: The user said "Under 900 words if you can." I should aim for ~800 to be safe.

      *(Check American English)*: "program," "realize," "labor," "defense."

      *(Final Polish)*: Ensure the distinction between 2 and 7 is clear. 2 is about semiotics, 7 is about ethics/labor.

