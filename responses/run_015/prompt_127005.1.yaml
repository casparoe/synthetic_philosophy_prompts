answer: |-
  You need to reject step (3), because it conflates the ground of the legislation (preserving moral sensibility) with the criterion of the act's wrongness (violating a duty to oneself by performing an act-type inherently destructive to that sensibility).

  Your argument turns Kant into a consequentialist about vice: it assumes an act is wrong *only if* it successfully produces the bad psychological effect. But Kant's ethics is deontological even within the *Doctrine of Virtue*. The "deadening of sympathy" is the *ratio legis* (reason for the law), not the *ratio cognoscendi* (test for the violation) in every empirical instance. When Kant says cruelty is wrong because it damages moral sensibility, he means it is the *kind of act* that constitutes damage to moral sensibility by its very nature, not that we must calculate the psychological fallout in each case.

  Rejecting (3) blocks your reductio at step (4). If the wrong-making feature is not the contingent causal outcome but the intrinsic relation of the act to the agent's moral disposition, then the "detachability" claim fails. In your drug case (5a), the agent still adopts a maxim incompatible with the duty to oneself to maintain moral fitness; the fact that the drug empirically blocks the effect is irrelevant to the violation of the duty. In the synthetic animal case (5b), the duty is specifically to cultivate sympathy for *suffering*; torturing a non-sentient object does not engage the same faculty or violate the same specific duty to oneself, because there is no suffering to recognize analogically. Regarding the landscape (7), Kant relies on the analogy between animal suffering and human suffering; landscapes do not suffer, so destroying them does not exercise the same predisposition (sympathy for pain) that is serviceable to morality.

  The cost of rejecting (3) is that you must read Kant's indirect duty as stricter and more formal than your argument allows. You cannot treat the duty regarding animals as a loose empirical guideline subject to causal exceptions; instead, it is a rigid prohibition on act-types that are intrinsically corrosive to the moral character required for duties to humans. This saves the indirect-duty reading (1) and validates your intuitions (6) without forcing you into the direct-duty dilemma (9), but it requires you to abandon the idea that Kant's justification is merely a psychological prediction rather than a normative claim about the constitution of virtue.
