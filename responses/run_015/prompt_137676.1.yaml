  FIVE-MINUTE VERSION (The Three-Question Sort)
  --------------------------------------------------------------------------------
  1. THE LINK: When bad follows bad, is it a **Debt** (owed), a **Lesson** (useful), or a **Law** (pattern)?
  2. THE CONTINUITY: If the agent **forgets** the act, does the **debt remain**? (Yes = Stored/Strict; No = Psychological).
  3. THE COMPLAINT: If a child is **born suffering**, is the universe **unjust** or just **operating**? (Unjust = Retributive/Educative; Operating = Law/Theodicy).

  *Scoring:*
  - Debt + Remains + Operating = Stored Potency (Leaf 2)
  - Debt + Remains + Unjust = Retributive/Communal (Leaf 1/3)
  - Lesson + Forgets + Unjust = Moral Education (Leaf 4)
  - Law + N/A + Operating = Descriptive/Theodicy (Leaf 7/9)
