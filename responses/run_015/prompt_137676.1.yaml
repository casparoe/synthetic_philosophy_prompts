  KARMA LEDGER SORTING TREE (v1.0)
  For use in classifying commitments to moral causation cases.
  Instructions: Start at Node 1. Answer based on your intuition about the case described. Follow the arrow to the next Node or to a Leaf. Record your path (e.g., 1A-2B-Leaf 3).

  NODE 1: A bad outcome follows a bad act. Is this primarily because the agent **OWES** the outcome (debt), the outcome is **USEFUL** (lesson), or the outcome simply **FOLLOWS** (pattern)?
  --> OWES : Go to NODE 2
  --> USEFUL : Go to NODE 6
  --> FOLLOWS : Go to NODE 8

  NODE 2: The agent feels deep remorse and reforms before the outcome arrives. **Does the external suffering still have to happen?**
  --> YES (Debt remains) : Go to NODE 3
  --> NO (Debt cancelled) : Go to NODE 5

  NODE 3: The agent has no memory of the wrong (amnesia or past life). **Does the debt remain valid?**
  --> YES (Sticks to stream) : Go to NODE 4
  --> NO (Requires memory) : LEAF 1 (Psychological Retributivism)

  NODE 4: Does the debt **expire** with time or can it be **shared/transferred** to a child or partner?
  --> EXPIRES/SHARED : Go to NODE 5
  --> INDEFINITE/STRICT : LEAF 2 (Stored Potency)
  *Note: "Shared" covers joint harm apportionment and transfer-of-merit cases.*

  NODE 5: An infant or demented person suffers the outcome. **Is this karma?**
  --> YES (Debt/Utility exists) : LEAF 3 (Communal/Lineage Ledger)
  --> NO (Capacity required) : LEAF 4 (Moral Education)

  NODE 6: The recipient is an infant or dead and cannot learn. **Does the outcome happen anyway?**
  --> YES (General Warning) : LEAF 5 (General Deterrence)
  --> NO (Specific Lesson) : LEAF 6 (Specific Pedagogy)

  NODE 7: (Unused - Collapsed into Node 5 for efficiency)

  NODE 8: A person is born into terrible suffering. **Does the complaint of injustice survive the explanation?**
  --> YES (It is just a fact) : LEAF 7 (Descriptive Causation)
  --> NO (It is fair/justified) : Go to NODE 9

  NODE 9: Is there a **JUDGE** ensuring the fit, or just a **LAW** ensuring the sequence?
  --> JUDGE : LEAF 8 (Divine Administration)
  --> LAW : LEAF 9 (Impersonal Theodicy)

  NODE 10: (Unused - Collapsed to meet leaf limit)

  --------------------------------------------------------------------------------
  PATH KEY & LEAF DEFINITIONS
  --------------------------------------------------------------------------------
  1A-2A-3B : LEAF 1 [Psychological Retributivism]
     Content: Desert requires psychological continuity; no memory, no debt.
     Awkward Commitment: A villain with amnesia is morally innocent of their past.
     Evidence Against: Intuition that the amnesic villain still poses a threat/owe restitution.

  1A-2A-3A-4B : LEAF 2 [Stored Potency] (Jain/Mīmāṃsā)
     Content: Karma is a subtle substance/potency that ripens automatically on the causal stream.
     Awkward Commitment: Suffering is inevitable even if the agent has morally transformed.
     Evidence Against: A reformed agent suffering catastrophically with no apparent lesson.

  1A-2A-3A-4A : LEAF 3 [Communal/Lineage Ledger]
     Content: The account belongs to a family or community, not an atomized individual.
     Awkward Commitment: A child may suffer for a parent's debt without personal fault.
     Evidence Against: Intuition that punishing the innocent (child) is inherently unjust.

  1A-2B-5B : LEAF 4 [Moral Education]
     Content: Suffering is strictly for moral improvement; if improvement occurs, suffering stops.
     Awkward Commitment: A perfectly saintly person should never suffer misfortune.
     Evidence Against: Observation of saintly individuals suffering randomly or severely.

  1B-6A : LEAF 5 [General Deterrence]
     Content: Suffering serves to warn the community, not just the agent.
     Awkward Commitment: An innocent infant may suffer to teach *others* a lesson.
     Evidence Against: Moral revulsion at using a sentient being merely as a means to warn others.

  1B-6B : LEAF 6 [Specific Pedagogy]
     Content: Suffering is tailored to the agent's learning capacity.
     Awkward Commitment: Karma cannot operate on those incapable of learning (infants/animals).
     Evidence Against: Observation of infants suffering in patterns indistinguishable from adult karma.

  1C-8A : LEAF 7 [Descriptive Causation]
     Content: Karma is a natural law like gravity; it explains distribution but implies no justice.
     Awkward Commitment: Calling it "moral" causation is a category error; it is just cause/effect.
     Evidence Against: The persistent human intuition that moral acts *should* differ from physical acts.

  1C-8B-9A : LEAF 8 [Divine Administration]
     Content: A cosmic agent (God/Karma-Lord) manages the ledger to ensure fit.
     Awkward Commitment: Requires a metaphysical administrator with perfect knowledge and power.
     Evidence Against: The problem of evil (unexplained suffering that fits no administrative plan).

  1C-8B-9B : LEAF 9 [Impersonal Theodicy]
     Content: The cosmic order is inherently just without a judge; explanation silences complaint.
     Awkward Commitment: "Justice" exists without a mind to conceive or enforce it.
     Evidence Against: Inability to distinguish this from Descriptive Causation in practice.

