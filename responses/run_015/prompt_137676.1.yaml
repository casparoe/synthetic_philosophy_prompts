  EMPTY LOGICAL SPACES (Unoccupied Combinations)
  --------------------------------------------------------------------------------
  1. [OWES + Remorse Cancels + Infant Suffers]: Incoherent. If remorse cancels debt, capacity should matter.
  2. [USEFUL + Infant Cannot Learn + Outcome Happens + Specific Pedagogy]: Incoherent. Contradicts "Specific" requirement.
  3. [FOLLOWS + Complaint Survives + Judge Exists]: Unattractive. A judge implies the complaint should be resolved.
  4. [OWES + Memory Required + Transfer Allowed]: Unexplored. Why transfer if the self is the locus of desert?
  5. [STORED POTENCY + Debt Expires]: Unexplored. Potency implies persistence; expiration implies moral statute of limitations.

