  INDISTINGUISHABLE LEAVES FLAG
  --------------------------------------------------------------------------------
  Leaf 7 (Descriptive Causation) and Leaf 9 (Impersonal Theodicy) may be empirically indistinguishable. Both deny a Judge and accept the pattern. The only difference is whether the observer feels permitted to call it "unjust." If the "unjust" feeling is purely subjective, the leaves describe the same metaphysical reality.

