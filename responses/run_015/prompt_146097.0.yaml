      *   *Table:* Keep it clean.
      *   *The Audit:* Go deep on the three main fractures (Agency, Ontology, Correlation). Use terms like "endogenous preferences" and "common priors."
      *   *The Normative Smuggle:* Explicitly address the "is-ought" gap. The ML analogy presupposes epistemic democracy.
      *   *Survival:* Mention Ladha (1992) or similar extensions on correlated votes.
      *   *Alternatives:* Push for Byzantine Fault Tolerance. It captures the *political* reality better than Random Forests.

  7.  **Refining the Argument (Self-Correction during drafting):**

      *   *Correction:* Make sure not to dismiss CJT entirely. It's a baseline. The critique is on the *analogy*, not necessarily the math itself.
      *   *Nuance:* Distinguish between "Ox Weight" (epistemic fact) and "Policy Choice" (normative preference). The analogy works for the former, fails for the latter.
