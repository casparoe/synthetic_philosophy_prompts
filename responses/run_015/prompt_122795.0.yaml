answer: |-
  Reading *Life of Pi* as a demonstration of Thomas Kuhn's theory of paradigm choice requires us to suspend the novel's invitation to faith and treat Pi's two accounts of the shipwreck as competing scientific theories. In this reading, the "animal story" (with the tiger Richard Parker) and the "human story" (without the tiger) are not a metaphor and its literal decoding, but rival descriptions of the same stretch of the world. They are offered to an audience—the Japanese investigators, the writer, and us—with no neutral standpoint from which to settle the matter. The closing exchange, where the older Pi asks which story is better and the writer chooses the one with the tiger, dramatizes Kuhn's claim that theory choice is not algorithmic. It is not determined by logic alone but guided by shared values that conflict and must be weighed.

  To test this, we must run Kuhn's five criteria for theory choice over the two accounts. First, *accuracy*: does the theory fit the empirical data? The human story fits the forensic evidence of the lifeboat better; there were no tiger bones, only human remains. The animal story requires us to accept impossible biology. Second, *consistency*: is the account internally logical? Both are consistent within their own rules. The animal story follows the logic of a fable; the human story follows the logic of brutal psychology. Third, *scope*: how much does the theory explain? The human story explains the physical events but fails to explain how Pi survived the trauma without madness. The animal story explains the psychology of survival but fails to explain the physical evidence. Fourth, *simplicity*: which posits fewer entities? The human story wins decisively; it eliminates the tiger, a massive ontological complication. Fifth, *fruitfulness*: does the theory open new paths? Here the animal story wins. It allows Pi to live a meaningful life thereafter; the human story leads to a dead end of despair.

  The resulting vector yields no unique verdict. If we prioritize accuracy and simplicity, the human story wins. If we prioritize fruitfulness and scope regarding psychological survival, the animal story wins. This mirrors Kuhn's insistence that values are not rules; they can be weighed differently by different individuals without irrationality. The writer's choice is not a discovery of truth but a commitment to a framework that makes life livable.

  This brings us to the first major objection students will raise regarding incommensurability. Kuhn argues that competing paradigms are often lexically incommensurable—their vocabularies cannot be mapped without loss. In *Life of Pi*, however, the mapping is explicit. The Ministry of Transport investigators construct a direct translation: the hyena is the cook, the orangutan is the mother, the zebra is the sailor, and the tiger is Pi. If this mapping is exact, lexical incommensurability fails. What remains is adjudicatory incommensurability: a mapping exists, but no shared measure of evidence decides the matter. This suggests the novel dramatizes mere underdetermination rather than strict Kuhnian incommensurability. However, this does not necessarily undercut Kuhn. It shows that even after full commensuration, choice can remain unsettled because the values guiding the choice are subjective. The novel suggests that the barrier between paradigms is not always language, but the willingness to accept the consequences of the ontology.

  Second, students will ask if Pi's behavior before the shipwreck supports this reading of unreduced ways of seeing. Three scenes are crucial here. First, the confrontation in the café where the priest, the imam, and the pandit argue over Pi's soul. Pi refuses to choose, insisting on practicing all three. Second, the biology teacher who calls religion "darkness" and science "light." Pi rejects this dichotomy. Third, and most critical, is the father's lesson at the zoo. To prove the tiger is not a pet, the father forces Pi to watch it kill a goat. This teaches Pi that animals are not anthropomorphic friends, undermining the literal truth of the animal story before it begins.

  These scenes show that Pi is not merely eclectic; he inhabits two unreduced ways of seeing. He accepts the zoological fact of the tiger's brutality while simultaneously maintaining a religious view of the world as sacred. He does not reduce theology to biology or vice versa. This prefigures the lifeboat choice: he is already practiced in holding incompatible frameworks without collapse. The paperwork error by which the tiger acquires a hunter's name (Richard Parker) further cements this duality, labeling the animal with a human identity before the voyage even starts.

  For the syllabus, I would assign these four scenes to anchor the discussion: the father's goat lesson (establishing the literal falsity of the animal); the café confrontation (establishing the compatibility of multiple frameworks); the investigators' mapping of animals to humans (establishing commensurability); and the final interview with the writer (establishing the choice based on preference rather than proof).

  However, we must close with a plain statement of where this reading fails. The strongest objection is that this exercise is a category mistake. Kuhn's theory choice concerns epistemic progress within scientific communities; the values of accuracy and consistency are aimed at truth approximation. Pi's choice is existential and aesthetic. When he asks, "Which story do you prefer?" he is not asking which model predicts future data better, but which story allows the teller to survive himself. The novel's vocabulary is religious and moral, not epistemological. Nothing in Kuhn gives a criterion for preferring a story because it is bearable. By treating survivability as a Kuhnian value like fruitfulness, we risk conflating psychological utility with theoretical virtue. The novel may be adding something to the debate—suggesting that the values driving conversion are not all epistemic—but it may also be simply changing the subject. If the choice is based on what makes life endurable rather than what describes the world accurately, then *Life of Pi* is not a case of Kuhnian paradigm choice at all, but a demonstration of why epistemology cannot account for the needs of the human soul.
