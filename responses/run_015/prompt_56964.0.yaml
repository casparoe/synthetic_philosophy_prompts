answer: |-
  The direct-access view comes out worse because it cannot distinguish genuine calm from induced suppression.

  Maya waits for college acceptance emails. Her stomach knots involuntarily, signaling anxiety, but she isn't focusing on it. Her brother asks, "Are you nervous?" To answer, she shifts attention inward to scan her gut. This cognitive shift requires relaxation that unties the knot before she speaks. She says, "No, I'm calm," and is visibly relieved to believe it. There is no self-deception; she simply checks and reports.

  **Inner-Sense Verdict:** The report is false. The introspective faculty misfired because the probe altered the target state.
  **Direct-Access Verdict:** The report is authoritative. Self-intimation guarantees that if it seems to you that you are calm, you are calm.
  **HOT Theorist:** Collapses into Direct-Access; without the higher-order thought during the scan, the anxiety wasn't conscious.

  **Load-Bearing Feature:** The suppression mechanism (checking kills the feeling), which I'll call introspective reactivity, though psychologists call it measurement reactivity.
  **If Deleted:** If checking didn't suppress the knot, the report would be true for both views.
  **Strongest Attack:** Direct-Access argues: "You define anxiety as physiology. But if it isn't felt, it isn't *experiential* anxiety. You haven't proven introspection false, only that feelings aren't bodily states."
