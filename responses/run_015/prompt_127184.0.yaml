      *   *Meaning:* What does "Collapse" mean academically? (Curators say transformation/shift; Public/Donors might say failure/end).
      *   *Purpose:* Should a museum issue warnings? (Education says yes; Curators imply nuance is better).
      *   *The User's specific question:* "Are we arguing about how the word works, about what the word means, or about whether a museum ought to be delivering warnings at all?" -> *This needs to be the analytical anchor of the memo.*

  3.  **Evaluate the Options:**
