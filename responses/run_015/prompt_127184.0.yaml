      *   *Option D: Reframe/Subtitle.* Keep the required word but contextualize it immediately. Acknowledge the debate *within* the title or subtitle.
      *   *Option E: Differentiate the cases.* Acknowledge that "Collapse" applies differently to the Aegean vs. Maya vs. Rapa Nui.

  4.  **Formulate the Recommendation:**
      *   We *must* keep the word due to the grant.
