      *   **User's Insight:** The three cases aren't alike (Aegean vs. Maya). Needs to clarify the core argument (usage vs. meaning vs. purpose of warning).
      *   **Deliverable:** A one-page opinion/memo.
      *   **Requirements:** State a clear recommendation (keep, drop, modify), set a deadline for label copy lock, take curators' objections seriously (not just marketing), and address the core philosophical disagreement.

  2.  **Deconstruct the Core Disagreement:**
