      *   **The Compromise:** Dismiss the "Tally" idea. It turns history into a poll.
      *   **The Constraint:** Acknowledge the Foundation gift. We can't delete the word.
      *   **Recommendation:** Keep the word "Collapse" (compliance) but add a substantive subtitle (e.g., "Resilience, Transformation, and Change") to satisfy Curators. The introductory panel must explicitly problematize the term.
