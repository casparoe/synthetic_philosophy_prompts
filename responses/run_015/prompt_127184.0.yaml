answer: |-
  **MEMORANDUM**

  **TO:** Board of Advisors, Director, Curatorial & Education Teams
  **FROM:** [Your Name], Board Advisory Committee
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation Regarding Late Bronze Age/Maya/Rapa Nui Gallery Title

  **Purpose**
  Ahead of Tuesday's vote, this memo outlines a path forward regarding the permanent gallery title. We face a conflict between a donor restriction, curatorial accuracy, and educational engagement. We must resolve this without compromising the museum's scientific integrity or our legal obligations.

  **Diagnosing the Disagreement**
  To vote wisely, we must identify what we are actually arguing about. This is not a debate about **how the word works** (marketing/attendance); the Education team has already demonstrated the term's draw. This is a debate about **what the word means** (academic definition) and **whether a museum ought to be delivering warnings** (institutional mission).

  If "Collapse" implies a total cessation of culture, the Curators are correct: it is factually inaccurate for the Maya (political fragmentation, not cultural end) and dangerously misleading for Rapa Nui (where population crash correlates with post-contact events, not internal failure). If we use the term to issue a moral "warning" about societal fragility, we risk sacrificing historical nuance for a modern parable. A museum's primary obligation is to the truth of the objects and cultures we steward, not to the delivery of cautionary tales.

  **The "Compromise"**
  The proposal to add a question mark ("Collapse?") and a visitor tally is inadvisable. It reduces complex historical processes to a popularity contest and suggests historical truth is democratically determined. It satisfies neither the legal requirement nor the curatorial objection.

  **Recommendation**
  1.  **Retain the Word:** We are legally bound by the gift agreement to include "Collapse" in the gallery title. We must honor this commitment.
  2.  **Qualify the Meaning:** We must not use the word as a verdict. I propose the public-facing title read: **"Collapse: Transformation, Continuity, and Change."** This satisfies the donor while immediately signaling to the visitor that "Collapse" is the starting point of inquiry, not the conclusion.
  3.  **Differentiate the Cases:** The introductory panel must explicitly address the disparity between the Aegean, Maya, and Rapa Nui contexts. We cannot present a single narrative arc for three distinct historical phenomena. The Rapa Nui section, specifically, must clarify the timeline of European contact to avoid perpetuating the "ecocide" myth.

  **Timeline**
  To prevent this debate from delaying fabrication, **final label copy must be locked by December 19, 2023.** This gives the Curatorial and Education teams six weeks to collaborate on text that meets the donor's requirement without violating academic standards.

  **Conclusion**
  We can keep the hook without selling a falsehood. Let us use the donor's word to draw visitors in, but use our scholarship to ensure they leave with a more complex understanding than the title suggests.

  I move we adopt this modified title and timeline on Tuesday.
