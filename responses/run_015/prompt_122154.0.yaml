answer: |-
  There is no consensus theory that successfully checks every box without slipping into either greedy reductionism or a hidden skyhook, because the tension between physical causal closure and real normative power is the central unsolved problem in naturalistic philosophy.

  ### The Spec: What the Theory Must Cover

  **1. The Specific Cases**
  *   **Paper vs. Value:** It must explain how a physical object (cotton-linen blend) becomes a institutional object (a dollar) without claiming the value is a physical property like mass or charge.
  *   **Behavior vs. Authority:** It must distinguish between people *actually* trading paper (descriptive) and people being *obligated* to accept it as legal tender (normative). A theory that only explains why people *do* trade it fails to explain why counterfeiting is wrong even if no one catches you.
  *   **Status Functions:** It needs to account for "X counts as Y in context C" (e.g., this person counts as a citizen in this country) without treating "citizen" as just a label for a biological human.

  **2. The Distinctions It Can't Collapse**
  *   **Explaining-Away vs. Explaining-Up:**
      *   *Explaining-Away (Greedy Reductionism):* Saying "money isn't real, it's just neurons firing" eliminates the phenomenon you're trying to study. The theory must avoid this.
      *   *Explaining-Up (Real Patterns):* Saying "money is real because it's a stable pattern enabled by neurons" preserves the phenomenon. The theory must show how the higher level is robust, not just an illusion.
  *   **Constitutive vs. Causal:** It must distinguish what money *is* (constituted by agreement) vs. what money *does* (causes inflation). Greedy reductionism collapses these into "what neurons do."

  **3. The Science Results It Must Respect**
  *   **Causal Closure of Physics:** Every physical event must have a sufficient physical cause. You can't have a "dollar bill" pushing atoms around without physical forces doing the work.
  *   **Evolutionary Continuity:** There can't be a magical moment where humans went from animal behavior to institutional reality without a gradual bridge (Cranes).
  *   **Neuroscience Supervenience:** Mental and social states depend on brain states. If you change the brain physics, the social understanding changes. No soul-stuff allowed.

  ### The Impossible Pairs (Where the Theory Breaks)

  Here are the tensions where satisfying one requirement usually violates another, forcing a hidden skyhook or a greedy reduction:

  *   **Real Causal Power vs. Physical Closure:**
      *   *The Conflict:* If institutions (like laws) really *cause* things (like people going to jail), they have causal power. But if physics is causally closed (no skyhooks), then physical brain states already caused the jail time.
      *   *The Trap:* If you say institutions *do* cause things, you risk a skyhook (downward causation that violates physics). If you say they *don't* cause things, you slide into greedy reductionism (institutions are epiphenomenal shadows).
  *   **Normative Authority vs. Natural Facts:**
      *   *The Conflict:* Science describes what *is* (facts). Institutions demand what *ought* to be (norms).
      *   *The Trap:* Deriving an "ought" from an "is" without a skyhook (like God or Pure Reason) is notoriously difficult. If you naturalize it too much, the "authority" disappears and it becomes just "might makes right."
  *   **Autonomy vs. Continuity:**
      *   *The Conflict:* For economics to be real, its laws need to be autonomous (not just physics). But for naturalism to hold, it must be continuous with physics.
      *   *The Trap:* Make it too autonomous, and it looks like a skyhook. Make it too continuous, and it looks like greedy reductionism.

  ### Settled vs. Contested

  **Settled (Among Naturalists)**
  *   **No Skyhooks:** Everyone agrees you can't invoke magic, dualism, or supernatural intervention. Everything must be built by Cranes (bottom-up mechanisms).
  *   **Greedy Reductionism is Bad:** There is agreement that saying "nothing is real except quarks" is useless for explaining society, even if it's technically true physically.
  *   **Dependence:** Everyone agrees institutional facts depend on human minds and physical reality; they don't float in a separate realm.

  **Genuinely Contested**
  *   **The Reality of Emergence:** Some argue "weak emergence" (patterns that are predictable in principle but complex in practice) is enough. Others argue this doesn't save the *reality* of institutions, only their usefulness.
  *   **The Status of Normativity:** Some think normative force (rules/obligations) is a real feature of the world we can naturalize. Others think it's a psychological projection we treat *as if* it were real.
  *   **Downward Causation:** There is no agreement on whether higher-level things (like a recession) can genuinely cause lower-level things (like a neuron firing) without violating physics, or if that's just a useful way of talking.

  ### Bottom Line on the Trade-Off
  If you block greedy reductionism by insisting institutions are *real causes*, you risk smuggling in a skyhook because physics doesn't seem to have room for them. If you block skyhooks by insisting physics is all that causes things, you risk greedy reductionism because institutions lose their causal bite. Most working philosophers accept this tension and choose "compatibilism" (both are true in different ways), but nobody has a perfect mechanical explanation for how it works.
