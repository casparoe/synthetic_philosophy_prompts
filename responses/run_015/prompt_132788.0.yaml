answer: |-
  **Mark: 17/20**

  **Rubric**

  | Band | Score | Criteria |
  | :--- | :--- | :--- |
  | **First** | 17–20 | **Accurate and Insightful.** Correctly applies technical concepts to the case. Identifies the core philosophical tensions (e.g., responsibility vs. ultimate authorship). Arguments are structured, precise, and engage directly with the 'worth wanting' theme. Minor imprecisions do not obscure the overall grasp. |
  | **Upper Second** | 14–16 | **Competent and Clear.** Correctly identifies the status of the agent regarding (a), (b), and (c). Arguments for acceptance/resistance in part (ii) are standard and defensible but may lack nuance or conflate distinct arguments (e.g., manipulation vs. Frankfurt). |
  | **Lower Second** | 11–13 | **Basic Understanding.** Gets the case mechanics mostly right but struggles with the philosophical justification. May confuse the definitions of freedom types. Part (ii) arguments are thin or miss the specific link to the 'worth wanting' dispute. |
  | **Third/Fail** | 0–10 | **Significant Errors.** Misapplies the definitions to the case. Fails to distinguish between compatibilist and incompatibilist concerns. Does not answer the specific questions set. |

  **Moving a script up:** Requires sharper distinctions between argument types (e.g., Frankfurt vs. Manipulation), deeper engagement with the coherence of 'Ultimacy', or more precise handling of the link between responsibility practices and the value of freedom.
  **Moving a script down:** Conflating the definitions of (a), (b), and (c); failing to explain *why* a verdict is hard to defend; or treating part (ii) as merely re-stating part (i) without addressing the 'worth wanting' gap.

  ***

  **Comments on the Script**

  **Part (i)**

  *Mira lacks (a). (a) requires that she be able to do otherwise holding fixed the actual past and the laws, and the stipulation is that the procedure guarantees the outcome; so there is no world with the same past and the same laws in which she keeps the wallet.*
  **(i) Correct.** You have applied the definition of Leeway accurately to the stipulations of the case. The reasoning follows validly from the prompt's statement that she "could not in fact have done otherwise".

  *She has (b): she acts because of the considerations she takes to favour returning it, and the relevant counterfactual — had her reasons been different, she would have acted differently — is true.*
  **(i) Correct.** This is an accurate application of the Guidance condition as defined in the prompt. You correctly identify that the counterfactual sensitivity is preserved despite the determinism.

  *She lacks (c): the sufficient conditions of her returning the wallet include the procedure and the team who performed it, and, further back, the causes of her request for it, none of which she chose. So she is not the ultimate source of the action.*
  **(i) Correct.** You correctly trace the causal chain back to unchosen causes, satisfying the condition for lacking Ultimacy as described in the prompt.

  *The hardest verdict is (c), and not because it is difficult to apply to Mira but because it is unclear that (c) is coherent. If being an ultimate source requires being an uncaused cause, then nothing within a causal order could ever satisfy it, and (c) would be an impossible ideal rather than a variety it is even coherent to want.*
  **(ii) Correct but imprecise.** The philosophical insight here is strong (referencing the coherence worry surrounding Ultimacy, akin to Strawson's Basic Argument). However, the logic regarding the question is slightly muddled. The question asks which *verdict* (i.e., your claim that she lacks it) is hardest to defend. If (c) is incoherent, the verdict that she *lacks* it is trivially true and thus easy to defend. You seem to mean that defending the *importance* of (c) is hard, or that defending the *positive possession* of (c) is hard. This distinction matters for precision.

  *A defender of (c) is therefore in a difficult position: she must hold that determinism undermines an agent's responsiveness to reasons, since on determinism the agent's responses are themselves caused, and this threatens to collapse her position into the view that nothing one does makes any difference, which practically everyone rejects.*
  **(ii) Correct but under-argued.** This is a defensible compatibilist rejoinder. However, the step "determinism undermines an agent's responsiveness to reasons" is a claim an incompatibilist would deny. They would argue determinism undermines *ultimate* responsibility, not necessarily responsiveness. You need to clarify that the incompatibilist risks collapsing into scepticism about agency *if* they insist Ultimacy is required for *any* responsibility, not just responsiveness.

  *That said, the loss of (a) is not really the loss of anything Mira could have wanted. She was able to return the wallet because she judged that she had reason to, and she would have kept it had she judged otherwise; the sense in which she could not have done otherwise is only that she could not have done otherwise given the reasons she actually had, and an ability to act against one's own considered judgement is not a freedom anyone is worse off without. Her action was up to her in the only sense that bears on (a).*
  **(ii) Correct but imprecise.** The substantive point (that Leeway is not 'worth wanting' if it implies acting against one's best judgement) is a standard and acceptable Dennettian move. However, the final sentence is mistaken. You write: "in the only sense that bears on (a)." Definition (a) *is* the ability to do otherwise holding fixed past/laws. If she lacks that, nothing bears on (a). You mean "in the only sense that bears on *freedom*" or "moral control". Conflating the specific definition (a) with the general concept of freedom is a terminological slip. Also, this paragraph arguably belongs in part (ii), as it addresses 'worth wanting' rather than the classification in (i).

  **Part (ii)**

  *For part (ii): the reason to accept the argument is the familiar point, associated with the family of cases in which a counterfactual intervener stands ready to bring about the outcome should the agent show any sign of acting differently, that moral responsibility does not require alternative possibilities.*
  **(ii) Correct but imprecise.** You correctly identify the strategy (denying the Principle of Alternative Possibilities). However, you conflate Frankfurt cases (counterfactual intervener who *does not* act) with Mira's case (neurological procedure that *did* act). Mira is a 'manipulation' case, not a 'Frankfurt' case. While both undermine Leeway, the dialectic differs slightly. In an upper-level seminar, distinguishing manipulation arguments from Frankfurt cases is expected.

  *What matters for praise and blame is not that the agent could have done otherwise but that the action genuinely issued from her own take on the reasons — from her, rather than from coercion, compulsion or a nervous tic. Mira's action does issue from her own evaluative judgement, so she is a fitting object of gratitude and of blame in a way that a coerced agent is not, and the fact that she could not have done otherwise does not undermine this.*
  **(i) Correct.** This accurately captures the compatibilist justification for why (b) is sufficient for responsibility practices. The distinction between reasons-responsiveness and coercion is correctly drawn.

  *The reason to resist is that the argument moves from what is sufficient for moral responsibility to what is worth wanting, and these can come apart. Even if (b) is all that responsibility requires, it can still be disappointing to discover that one's deepest commitments were manufactured rather than made — that one's character is something one was handed rather than something one authored.*
  **(i) Correct.** This is the strongest part of the script. You correctly identify the gap between the conditions for holding responsible (practices) and the conditions for having the freedom we desire (metaphysics/authorship). This addresses the 'worth wanting' clause of the prompt directly.

  *A person can grant that she is answerable for what she does and still reasonably regret the absence of (a) or of (c). So the compatibilist cannot settle the matter by pointing to our practices of praise and blame: those practices track what is necessary for responsibility, not what we are after when we care about freedom. That is why the real dispute is in part a dispute about which variety is worth wanting, and why it will not be settled by settling whether determinism is true.*
  **(i) Correct.** The conclusion follows validly from your previous point. You have successfully explained how the reason for resisting bears on the nature of the dispute, as requested by the final clause of the question.

  ***

  **Closing Note**

  The strongest scripts in this cohort distinguished more sharply between the *Manipulation Argument* (which Mira instantiates) and *Frankfurt Cases* (which involve counterfactual interveners), noting that while both threaten Leeway, the former threatens Guidance/Ultimacy in ways the latter does not. Additionally, top-tier answers engaged more deeply with the 'coherence' objection to Ultimacy, perhaps referencing Galen Strawson's Basic Argument explicitly to bolster the claim that (c) is impossible, rather than merely asserting it. Finally, the very best scripts clarified whether 'worth wanting' is a subjective psychological claim or a normative ethical one, whereas this script treats them somewhat interchangeably.
