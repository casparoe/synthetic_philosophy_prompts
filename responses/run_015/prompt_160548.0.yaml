  Elena, a senior partner at a law firm, signs off on her junior associate Mark's high-stakes brief without reading the final draft, though she has the time and competence to review it. She believes Mark is fully capable and that checking his work would signal distrust, so she signs immediately to honor his autonomy. Her action is right because it constitutes genuine trust, recognizing Mark as an end rather than a risk to be managed. She acts with full moral worth, motivated by deep respect for Mark's capacity, yet she cannot motivate herself by the thought "I am doing this because it constitutes non-instrumental reliance," for treating trust as a goal to be achieved transforms the reliance into a managerial strategy, thereby undermining the very recognition of agency that makes the act right.

  1.  **State F and Rightness:** The right-making feature $F$ is the act's status as **non-instrumental reliance**. The act is right in virtue of $F$ because recognizing another as a moral agent (rather than a object of scrutiny) constitutively requires relying on them without verifying their output; verification would treat the associate as a risk factor, negating the recognition.

  2.  **Moral Worth and Self-Defeat:** Elena's action has full moral worth because it flows authentically from her value of respect for persons. The self-defeat arises because $F$ (non-instrumental reliance) cannot be aimed at instrumentally. If Elena acts *because* she represents $F$ as her reason (i.e., "I am relying on you *in order to* achieve non-instrumental reliance"), she turns the reliance into a means to an end (the end being "trusting"). This calculation reinstates the instrumental stance toward Mark that $F$ was supposed to exclude, thereby destroying $F$. Consequently, the act ceases to be right (as it no longer recognizes agency) and loses the worth grounded in that recognition.

  3.  **Doxastic vs. Attributability:** The doxastic reading requires the agent to represent $F$ (or the right-making property) as her motivating reason. Since representing $F$ destroys $F$, the doxastic condition implies Elena cannot act well here; it demands she satisfy a condition that renders the act defective. The attributability reading requires only that the act expresses her stable evaluative stance (respect). Since her act genuinely expresses respect without requiring her to represent the constitutive structure of that respect, the attributability reading grants full moral worth.

  4.  **Feature Doing the Work:** The single feature is **Constitutive Non-Instrumentality**. If you remove this (e.g., if the act were right because it *caused* good outcomes regardless of stance), acting because of $F$ would no longer be self-defeating, and the doxastic condition would be satisfiable. If you remove the agent's correct belief (making her ignorant of why checking is bad), it collapses into the Huck Finn pattern (acting well against/without judgment); here, she knows checking is bad, but cannot use that knowledge as a motive without undoing the good.

  5.  **Strongest Attack and Reply:** *Attack:* A doxastic defender might argue Elena acts on the description "Doing what respect requires," which captures $F$'s content without triggering the self-defeat, satisfying the condition under a safe guise. *Reply:* This fails because the requirement of respect *just is* non-instrumentality. To act on "what respect requires" is to treat respect as a norm to be satisfied instrumentally. If the constitutive aim of the act is excluded from the motive's content, the motive is not actually of the right kind, but if it is included, it destroys the act; the doxastic condition cannot navigate this constitutive gap.

  6.  **Confidence Check:** I am least confident in **Step 2 (The Self-Defeat)**. It relies on the contested claim that trust (or recognition of agency) is logically incompatible with reflective aiming (the "paradox of hedonism" applied to moral attitudes). If it turns out that agents can reflectively aim at non-instrumental reliance without making it instrumental (e.g., via distal intention or higher-order volition), the self-defeat collapses, and the doxastic condition becomes satisfiable after all. I would take back the claim of full moral worth on the attributability view if it were demonstrated that genuine respect *requires* conscious endorsement of the constitutive norms, making Elena's inability to represent $F$ a defect in her rationality rather than a structural feature of the act.

  \answer{The feature doing the work is the act's constitutive non-instrumentality, which makes aiming at the right-making feature self-defeating.}
