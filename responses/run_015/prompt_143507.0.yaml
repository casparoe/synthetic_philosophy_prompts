  # SEMINAR HANDOUT: The Computational Hypothesis Diagnostic

  **Instructions:** Read each scenario carefully. Select the option that best matches your intuition or current reasoning. There are no "correct" answers; the goal is to map your philosophical commitments. Record your choices (A, B, or C) for the ten questions below.

  ### Part I: Diagnostic Questions

  **1. The Digestive Tract**
  A textbook describes the stomach as "processing information" about nutrient density to regulate enzyme release.
  *   **A.** This is just a metaphor; the stomach does not literally compute.
  *   **B.** It computes in a simple, analogue sense, distinct from digital computation.
  *   **C.** If this counts as computation, then computation is everywhere (pancomputationalism).

  **2. The Hydraulic Valley**
  Hydrologists use a physical valley's drainage pattern to solve a complex differential equation faster than a digital computer could.
  *   **A.** The valley is not computing; it is just causally evolving. The *hydrologists* are computing.
  *   **B.** The valley is an analogue computer; physical dynamics can implement computation.
  *   **C.** The distinction between the valley and a silicon chip is irrelevant; both are physical systems.

  **3. Incompatible Programs**
  A specific neural circuit can be mathematically described as running Program X. With a different mapping scheme, the same activity counts as running Program Not-X.
  *   **A.** This shows computational ascriptions are imposed by the observer, not in the tissue.
  *   **B.** One mapping is correct based on the circuit's evolutionary history or structure.
  *   **C.** Both are valid; the system implements all compatible computations simultaneously.

  **4. The Post-Hoc Model**
  A computational model fits recorded neural data perfectly but is too slow to run in real-time and could not have guided the animal's behavior.
  *   **A.** It explains the data; prediction speed is irrelevant to explanatory power.
  *   **B.** It is merely a description; if it couldn't run in the system, it doesn't explain the mechanism.
  *   **C.** It is useful for classification, but not a causal explanation.

  **5. The Replacement Test**
  Neurons are replaced one by one with devices matching their input-output timing and metabolic exchange.
  *   **A.** The mind remains the same; substrate does not matter (functionalism).
  *   **B.** The mind changes; biological tissue is essential to cognition.
  *   **C.** The mechanism remains the same, but whether "mind" persists depends on definitions.

  **6. Levels of Description**
  The same preparation is described computationally at the level of spikes, dendritic compartments, and the whole animal.
  *   **A.** One level is the "true" level of computation; others are approximations.
  *   **B.** Computation happens at all levels; they are nested descriptions.
  *   **C.** Computation is only real at the level where behavior is explained.

  **7. The Continuous Generator**
  A central pattern generator relies on continuous state variables and precise timing; any digital program is a discretization artifact.
  *   **A.** It is not computing; computation requires discrete states and rules.
  *   **B.** It is computing; analogue computation is still computation.
  *   **C.** The label "computation" should be dropped in favor of "dynamics."

  **8. Biophysical Exclusivity**
  A circuit is explained entirely in biophysical and energetic terms with no computational vocabulary.
  *   **A.** The computational vocabulary is redundant and should be discarded.
  *   **B.** The computational view captures something the biophysical view misses (organization/function).
  *   **C.** Both are true; they are different perspectives on the same thing.

  **9. Empirically Equivalent Programs**
  Two candidate programs agree on every prediction anyone knows how to test, but differ in internal structure.
  *   **A.** It does not matter which is true; they are instrumentally equivalent.
  *   **B.** One is literally true inside the brain, even if we cannot tell which.
  *   **C.** The question is ill-posed; the brain does not have "internal structure" in that sense.

  **10. Mind and Mechanism**
  If the brain is proven to be a computer, does it follow that thoughts are computations?
  *   **A.** Yes; cognition is constitutively computational.
  *   **B.** No; the brain might compute without the mind being a computer (mechanism only).
  *   **C.** No; the mind is something else that supervenes on the computational brain.

  ---

  ### Part II: Scoring Key & Positional Map

  **Step 1: Calculate Sub-Scores**
  Tally your answers according to the three dimensions below.

  *   **Dimension L (Literalness):** Is computation a mind-independent property of the system?
      *   *Add 1 point for:* Q1(A), Q2(B), Q3(B), Q5(A), Q7(B), Q9(B).
      *   *Interpretation:* **High (4-6)** = Realist/Literal. **Low (0-3)** = Instrumentalist/Anti-Realist.
      *   *Note:* Q1(C) and Q7(C) indicate Deflationary or Dynamical views (count as Low L for specificity).

  *   **Dimension U (Utility):** Does computational explanation do unique work?
      *   *Add 1 point for:* Q4(B), Q6(A), Q8(B).
      *   *Interpretation:* **High (2-3)** = Explanatory Essentialist. **Low (0-1)** = Redundant/Descriptive.

  *   **Dimension S (Scope):** Is cognition constitutively computational?
      *   *Add 1 point for:* Q5(A), Q10(A).
      *   *Interpretation:* **High (2)** = Cognitive Computationalist. **Low (0-1)** = Mechanism-Only or Anti-Comp.

  **Step 2: Locate Your Position (The Leaves)**
  Match your profile (L / U / S) to the positions below.

  | Profile (L / U / S) | Position Label | Status |
  | :--- | :--- | :--- |
  | **High / High / High** | **Representational Computationalism** | Defended |
  | **High / High / High** | **Mechanistic Computationalism (No Reps)** | Defended |
  | **High (Analogue) / High / High** | **Analogue / Hybrid Computationalism** | Defended |
  | **High / High / High (+External)** | **Extended Computationalism** | Defended |
  | **High / High / Low** | **Neural Comp / Cognitive Non-Comp** | Defended |
  | **High (Trivial) / Low / Low** | **Deflationary / Pancomputationalism** | Defended |
  | **Low / High / Low** | **Instrumentalism / Fictionalism** | Defended |
  | **Low / Low / Low** | **Anti-Computationalism (Neural)** | Defended |
  | **Low / Low / High** | **Dynamical / Embodied Cognition** | Defended |
  | **High / Low / Low** | **Computational Epiphenomenalism** | *Unoccupied* |
  | **Low / High / High** | **Cognitive Realism / Neural Fictionalism** | *Unoccupied* |
  | **High / Med / High** | **Structural Realism** | Reconstructed |
  | **Low / Med / Low** | **Pragmatic Descriptivism** | Reconstructed |

  **Step 3: Logical Space Analysis (Unoccupied Combinations)**
  *   **High L / Low U / Low S (Computational Epiphenomenalism):** *Why nobody is there:* Incoherent. If computation is literally in the brain but explains nothing and constitutes nothing, positing it is ontologically extravagant with no payoff.
  *   **Low L / High U / High S (Cognitive Realism / Neural Fictionalism):** *Why nobody is there:* Unstable. If the neural mechanism is not literally computational, it is difficult to argue the mind is *constitutively* computational without begging the question.
  *   **Low L / Low U / High S (Pure Cognitive Comp):** *Why nobody is there:* Unexplored. Most who claim cognition is computational ground it in some neural reality; claiming it is wholly detached from neural implementation is rare.

  **Step 4: Instrument Limitations**
  *   **Indistinguishable Leaves:** This instrument cannot separate **Representational Computationalism** from **Mechanistic Computationalism (No Reps)**. Both score High/High/High. The questions test *computation*, not *representation* or *content*.
  *   **Indistinguishable Leaves:** This instrument cannot separate **Standard Computationalism** from **Extended Computationalism**. The cases focus on intracranial or isolated circuit properties.
  *   **Redundant Cases:** **Q3 (Incompatible Programs)** and **Q9 (Empirically Equivalent Programs)** both test Underdetermination/Realism. Q9 could be dropped with minimal loss of discrimination.
  *   **Redundant Cases:** **Q2 (Valley)** and **Q7 (Continuous Generator)** both test Digital vs. Analogue/Continuous. Q2 could be dropped if Q7 is retained.

  ---

  ### Instructor's Note: Meta-Analysis of the Instrument

  **1. Settled vs. Contested**
  Nothing in this space is genuinely settled. The literature reflects a stalemate between camps that prioritize different virtues (e.g., causal specificity vs. generalizability).
  *   **Contested:** All three trunk questions (Literalness, Utility, Scope) are actively debated. There is no consensus on whether "computation" is a natural kind or a descriptive tool.
  *   **Contested:** The boundary between "mechanism" and "cognition" (Dimension S) is itself a fault line. Embodied cognition proponents reject the separation, arguing that if the mechanism is dynamical, cognition is too.

  **2. Defended vs. Reconstructed Positions**
  *   **Defended:** Representational Comp, Mechanistic Comp, Instrumentalism, Anti-Comp, Dynamical Systems, Pancomputationalism, and Neural-Comp/Cognitive-Non-Comp are all standard positions in the literature.
  *   **Reconstructed:** "Computational Epiphenomenalism" and "Cognitive Realism / Neural Fictionalism" are logical possibilities generated by the matrix but rarely explicitly defended. They serve as *reductio* threats rather than live options. "Structural Realism" is a reconstructed nuance of Representational Comp.

  **3. Critique of the Three-Way Framing**
  Your suspicion (Literalness, Utility, Scope) is a powerful organizing heuristic, but it embeds a **contested choice**: it assumes these three dimensions are separable.
  *   **The Contested Choice:** Many dynamical systems theorists argue that **Utility** and **Literalness** cannot be separated. If a description does not map cleanly to causal dynamics (Utility), they argue it is not literally true (Literalness). Conversely, some realists argue that if it is literally true (Literalness), it *must* have unique explanatory power (Utility).
  *   **The Contested Choice:** Separating **Mechanism** from **Cognition** (Dimension S) presupposes a form of neo-mechanism that embodied cognition rejects. For enactivists, asking if the *brain* computes separately from the *mind* is a category error.
  *   **Recommendation:** Use the instrument to show students where they fall, then use the "Limitations" section to demonstrate why the debate persists: because the definitions of the axes themselves are part of the fight.

  **4. Case Utility**
  *   **Most Discriminating:** Q5 (Replacement) and Q10 (Mind/Brain Link) are the strongest drivers for Dimension S. Q8 (Biophysical Only) is the strongest driver for Dimension U.
  *   **Least Discriminating:** Q1 (Stomach) often yields "No" from both Realists and Instrumentalists (both agree stomachs don't compute), failing to separate Pancomputationalists from Specific Comp theorists unless Q1(C) is heavily weighted. Q3 and Q9 overlap significantly.
