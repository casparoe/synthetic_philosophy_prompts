  Based on the pattern of your verdicts, there is a coherent principle at work, though it requires distinguishing between the *type of cognition* involved rather than the *depth* or *permanence* of the effect.

  ### The Principle: Foundational Domains vs. Associative Overlays

  Your verdicts are captured by what we might call the **Foundational Domain Constraint**.

  **The Rule:** Language shapes thought when it provides an obligatory coding scheme for a **foundational, pre-linguistic cognitive module** (Perception, Spatial Navigation, Quantity). It does *not* count when it influences **derived, cultural, or associative systems** (Social Stereotypes, Economic Behavior, Personality, Metaphor).

  **Why this fits your data:**
  *   **The "Counts" Cluster (Foundational):**
      *   **Russian Blues:** Color discrimination is a perceptual module. The lexical distinction acts as a *categorical tool* that aids the perceptual task. You accept this even though it is "online" (vanishes with interference) because language is acting as a necessary computational aid for the perception itself.
      *   **Absolute Directions:** Spatial orientation is a foundational cognitive module. The language forces constant monitoring of this module.
      *   **Number Words:** Exact quantity tracking is a cognitive operation (extending the Approximate Number System). The words are *tools* required to perform the operation.
      *   *Common Thread:* In all three, language provides a code or tool required to process **objective reality** (wavelengths, coordinates, quantities).

  *   **The "Doesn't Count" Cluster (Associative/Cultural):**
      *   **Grammatical Gender:** While the grammar is obligatory, the *effect* (stereotyping objects) is an associative spill-over. The gender of a "key" is not a foundational property of the key like its color or location. It is a semantic association.
      *   **Future Tense/Savings:** Economic behavior is a complex cultural outcome. The grammar is likely a *proxy* for a cultural attitude toward time/thrift, not the mechanism causing the thrift.
      *   **Bilingual Personality:** Self-concept is socially constructed and context-dependent. This is frame-switching, not cognitive restructuring.
      *   **Mandarin Time:** You discount this, likely because it relies on *spatial metaphors* for time, rather than time itself being grammatically obligatory in a way that alters temporal reasoning (e.g., duration estimation). It falls into the "metaphorical/associative" bucket for you.

  ### The Tension in Your Verdicts

  There is one inconsistency you should address: **The Mandarin Time case.**

  You count **Absolute Directions (Space)** but discount **Mandarin Time**.
  *   **The Conflict:** If you believe language can restructure how speakers navigate physical *space* (a foundational domain), consistency suggests you should accept that language can restructure how speakers navigate *time* (equally foundational).
  *   **The Fix:** If the Mandarin evidence shows that speakers reason about *temporal sequence or duration* differently (not just react faster to spatial metaphors), your principle demands you **count it**. Space and Time are the twin pillars of foundational cognition. If Space counts, Time should too, unless you specifically define your principle as "Non-Metaphorical Domains."
  *   **Recommendation:** Revise the Mandarin verdict to **Count**, provided the task involves temporal reasoning (e.g., estimating duration, ordering events) rather than just priming with spatial words. This strengthens the "Foundational Domain" principle.

  ### The Test Case: Intentionality and Moral Judgment

  **The Scenario:**
  *   **Language A:** Grammatically marks deliberateness (e.g., *deliberate-break* vs. *accidental-break*).
  *   **Language B:** Marks agency but not intent (e.g., *he-break-it* for both).
  *   **The Effect:** Speakers of Language B judge accidental harms more leniently (assign less blame) than speakers of Language A.

  **Does this count by your lights?**
  **Verdict: No (with a major caveat).**

  **Reasoning:**
  1.  **Alignment with "Doesn't Count" cases:** Moral judgment is closer to **Grammatical Gender** and **Future Tense Savings** than it is to Color or Number. It is an *evaluative/social* outcome, not a *perceptual/quantitative* one. Just as grammatical gender primes stereotypes (social association), grammatical intent marking primes blame assignment (social evaluation).
  2.  **The "Cultural Proxy" Problem:** Like the Future Tense case, norms about blame and accidentality are deeply cultural. It is highly probable that the grammar and the moral norm co-evolved. The grammar may be a *marker* of a culture that values intent, rather than the *cause* of the judgment.
  3.  **The Caveat (Event Cognition):** There is a sub-domain here that *might* count. If the effect were purely on **memory for the event** (e.g., Language B speakers simply *forget* who did it in accidental cases, similar to the Spanish/English "eyewitness memory" studies), that would lean toward **Absolute Directions** (memory for layout). That would be a foundational cognitive effect (Event Parsing).
      *   However, your specific question is about **judging leniently** (Moral Evaluation). That pushes it into the "Social/Cultural" bucket.

  **Prediction:**
  By your own standards (rejecting Gender and Savings), you should **discount this case**. It treats language as a prime for social evaluation rather than a tool for processing objective reality.

  **Summary of the Principle:**
  > **Language shapes thought when it acts as a necessary computational tool for processing foundational domains (Perception, Space, Quantity). It does not count when it acts as a cultural prime for associative or evaluative domains (Stereotypes, Economics, Morality).**

  If you adopt this explicitly, you resolve the Russian Blues paradox (it's perceptual processing, not deep rewiring) and the Gender rejection (it's associative priming, not foundational processing). You would then need to reconsider the Mandarin Time verdict to ensure consistency with Absolute Directions.
