  The slogan equivocates between mechanism, epistemology, and definition.

  | Claim | Status | Supports | Common? | Type |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Priors shape content.** | Trivial | Neither | Yes | Empirical |
  | **2. Content = winning hypothesis.** | Substantive | A (Dreamer has hypotheses) | Yes (Core PP) | Mixed |
  | **3. Control = precision-weighting.** | Substantive | B (No input = no error) | Yes (Technical) | Empirical |
  | **4. Perception/hallucination mechanistically identical.** | Substantive | A (Continuum view) | Yes (Rhetorical) | Empirical |
  | **5. No world-contact; "control" is metaphor.** | Radical/False | A (Radically) | No (Provocation) | Conceptual |
  | **6. Perception *requires* error-correction.** | Defensible | B (No loop = no perception) | Yes (Functional) | Conceptual |

  **Analysis:**
  Speakers usually intend **Claim 4** rhetorically to emphasize top-down influence, but rely on **Claim 3** technically. The phrase functions as an **empirical claim** about brain architecture (Claims 1-4) when defending PP science, asserting that prediction errors drive updates. It shifts to a **conceptual claim** about the nature of mind (Claims 5-6) when shutting down metaphysical objections, defining perception by its regulatory role rather than its output.

  In the Dreamer case, the deadlock arises because A treats "hallucination" as the *process* (which exists offline), while B treats "controlled" as the *function* (which fails without input). Claim 2 supports A: if perception is just the model's output, the Dreamer perceives. Claim 6 supports B: if perception is defined by the regulatory loop keeping the model honest, the Dreamer lacks perception.

  The slogan is defensible only if "controlled" denotes the *capacity* for weighting (which exists offline) rather than the *act* of weighting (which requires input). Person B wins if "perception" implies successful navigation; Person A wins if "perception" implies phenomenological output. The phrase obscures this distinction by packaging a functional requirement (control) as a descriptive modifier (controlled), allowing speakers to slide from empirical mechanism to conceptual definition without notice.
