answer: |-
  **Project Title:** The Maintenance Baseline: Re-evaluating Doing and Allowing in Continuous Care Systems

  **The Question**
  Standard moral philosophy distinguishes sharply between killing (doing) and letting die (allowing). This distinction usually relies on thought experiments where an agent intervenes in a static situation: a runaway trolley, a drowning child, a single switch. These cases assume a "zero-effort baseline"—that if the agent does nothing, the world stays as it is. My project asks: Does this distinction hold when the baseline itself requires continuous, active maintenance to prevent death? In systems where life is sustained only by ongoing effort (medical equipment, infrastructure, supply chains), does withdrawing that effort count as "allowing" nature to take its course, or is it a new cause of death? I aim to determine whether the doing/allowing distinction tracks a real moral difference, or if it is merely a bookkeeping device used to assign professional responsibility.

  **Background and Problem**
  I have worked as a medical equipment technician for over a decade. My job is to ensure that the machines keeping people alive continue to function. In this work, "letting die" is not a passive state. A patient on ventilation does not die because a switch is flipped; they die because the power fails, the battery degrades, or the service contract lapses. Survival is an active process requiring energy and labor.

  Current philosophical arguments rarely account for this. They treat the "status quo" as something that exists independently of human effort. They ask whether it is worse to push a man into a lake than to watch him drown. But in modern medicine and infrastructure, nobody is ever just "watching." Someone is always holding the levee. If the distinction between doing and allowing collapses when we acknowledge that the baseline requires work, then much of our legal and ethical reasoning about end-of-life care rests on a false picture of reality.

  There is a secondary complication regarding time. The same physical behavior can look like "doing" or "allowing" depending on the time-scale observed. Unplugging a cord is an action (doing); describing that same event as "withholding treatment over a week" sounds like allowing. If the moral category flips based on how zoomed-in we are on the timeline, the distinction cannot carry the heavy legal weight currently placed upon it. My project will test whether this time-scale instability supports the broader claim that the distinction is contextual rather than fundamental.

  **Work Plan (8 Months, 15 Hours/Week)**
  I do not require ethics approval, laboratory access, or participants. This is a conceptual project grounded in case construction and logical analysis.

  *Months 1–2: Mapping the Terrain*
  I will dedicate this time to reconstructing the standard arguments against the doing/allowing distinction from memory and notes, identifying exactly where they rely on the "static baseline" assumption. I will catalogue the specific premises that fail when applied to maintenance-heavy scenarios.

  *Months 3–5: Case Construction*
  I will write a series of detailed vignettes based on real-world maintenance scenarios I encounter in my work, stripped of identifying details. These will mirror the structure of standard philosophical examples but replace the static background with a maintained one. For example: comparing turning off a ventilator versus failing to order a replacement part that arrives too late. I will test these cases against the time-scale variable to see if the moral intuition shifts when the event is described over minutes versus months.

  *Months 6–7: Drafting the Argument*
  I will assemble the analysis into a coherent manuscript. The goal is to demonstrate that the "doing" label is applied not based on causation or intention, but on whether the agent's labor was considered "obligatory background noise" or "optional intervention."

  *Month 8: Revision and Plain Language Translation*
  The final month will be spent removing technical jargon. I will ensure the argument is accessible to a reader without philosophical training, focusing on clarity and concrete examples.

  **Why This Approach**
  Empirical studies or surveys of public intuition would miss the point. The problem is not that people disagree on the answers; it is that the questions are framed incorrectly. They assume a world of inertia rather than a world of entropy. A conceptual repair job is required before data collection would be meaningful. My background gives me access to the reality of these systems that abstract theorizing often misses. I am not guessing what life-support looks like; I service it.

  **Deliverable**
  I propose to produce a monograph of approximately 25,000 words. It will not be written for an academic journal. It will be written for the same audience that supports this foundation: interested laypeople, policymakers, and practitioners. The aim is to provide a clear explanation of why our current moral vocabulary might be mismatched with the technical reality of keeping people alive. It should be readable enough for the bench-carver to understand, but rigorous enough to challenge a bioethicist.

  **Risk and Failure Conditions**
  My primary concern is that the core insight—that baselines are set, not found—is true but trivial. Everyone knows someone has to pay the electric bill. If my project concludes only that "maintenance requires work," it will have failed to be interesting.

  To avoid this, I have set a success condition: the project must show that recognizing this changes a specific moral judgment. If acknowledging the maintenance baseline does not alter whether we blame a doctor for withdrawing care versus a technician for failing to service the device, then the distinction is robust despite my objection, and my project will have proven negative.

  I am also aware that the time-scale argument might be a separate issue. If, during Months 3–5, I find that the time-scale variability does not strengthen the maintenance argument but instead muddies it, I will excise it. I would rather deliver a tighter argument on maintenance alone than a confused one trying to do too much.

  If the final result is simply that "the distinction is fuzzy," that is not enough. The failure condition is specifically if I cannot demonstrate *what work the distinction is actually doing* once we admit it isn't tracking causation. If I cannot identify the social or bureaucratic function the distinction serves (the "bookkeeping" role), then the project will not have reached its conclusion. I intend to define that function explicitly, or admit that I could not find it.
