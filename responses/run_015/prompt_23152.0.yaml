answer: |-
  Here is a draft of ten interview questions tailored to your guest's expertise and your specific requirements. I have structured this as a linear script (Q1 through Q10). Questions 3, 5, and 7 cover your three required topics, and Questions 4, 6, and 8 are the pre-planned follow-ups keyed to the answers she is most likely to give as a dispositional realist.

  **1. The Hook:**
  "We often talk about what things *are*—like a glass is hard, or sugar is white—but you focus on what things *do* or *would do*. Why should we think that these 'dispositions,' like fragility or solubility, are real features of the world rather than just shorthand for predicting behavior?"

  **2. The Grounding:**
  "You defend the view that dispositions are grounded in an object's internal causal structure. If I hold a fragile glass, what exactly is happening inside that glass that makes it fragile? Are we talking about the arrangement of atoms, or is there a kind of 'power' inherent in the matter itself?"

  **3. Finks vs. Masks (Required Topic 1):**
  "Let's look at the cases that break the standard analysis. We have 'masks,' where a disposition is present but blocked (like soluble sugar in a sealed box), and 'finks,' where the disposition vanishes the moment you test it (like a wizard making the glass unbreakable as it falls). Do you see a deep metaphysical difference between these two, or are they just variations of the same problem?"

  **4. Follow-up to Q3 (Keyed to Realist Answer):**
  *(Anticipated Answer: She will likely argue there is a real difference: masks leave the causal power intact, while finks remove or alter the power itself.)*
  **"If the difference lies in whether the internal causal power survives the stimulus, how do you handle borderline cases? For instance, if a 'mask' is removed instantly upon stimulus, does it effectively become a fink, or does the timing of the interference matter more than the state of the power?"**

  **5. The "Contrived" Objection (Required Topic 2):**
  "Critics often argue that fink cases—like lab assistants with magic wands or electro-finks—are so contrived and sci-fi that they don't tell us anything about how dispositions actually work in the natural world. Why should we let these artificial thought experiments dictate our metaphysics?"

  **6. Follow-up to Q5 (Keyed to Conceptual Clarity Answer):**
  *(Anticipated Answer: She will likely argue that philosophy tests the limits of concepts, and if an analysis fails in possible worlds, it fails as a definition, even if the case is rare.)*
  **"But if these cases are physically impossible or incredibly rare in our actual universe, does insisting on an analysis that covers them risk disconnecting metaphysics from empirical science? Are we prioritizing logical neatness over how the world actually behaves?"**

  **7. The "Unless" Clause (Required Topic 3):**
  "A common fix for these counterexamples is to add a 'ceteris paribus' clause to the definition—essentially saying, 'If dropped, it would break, *unless* something interferes.' Why do you think this move fails? Is it just that it makes the definition too vague?"

  **8. Follow-up to Q7 (Keyed to Circularity Answer):**
  *(Anticipated Answer: She will likely argue that adding 'unless interfered' makes the analysis circular, because we can only define 'interference' by referencing the disposition itself.)*
  **"If defining 'normal conditions' without referencing the disposition is impossible, does that mean we can never analyze dispositions using conditionals at all? Are we forced to accept dispositions as primitive concepts that can't be broken down further?"**

  **9. Science and Powers:**
  "Moving from philosophy to physics: do you think modern physics supports your view? When a physicist talks about an electron having a charge, are they describing a disposition to interact with fields, and does your view help clarify what that charge *is*?"

  **10. The Human Element:**
  "Finally, we often attribute dispositions to people, like 'irritability' or 'kindness.' Do you think the same metaphysical rules apply to character traits? If I'm in a good mood and don't get irritated, was I ever truly irritable, or was my character 'masked' by the situation?"
