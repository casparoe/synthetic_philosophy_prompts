answer: |-
  This is a splendid exercise. Working from the ground up, trusting your intuitions on particular cases before locking yourself into a system, is often the surest way to avoid the peculiar blind spots that come with reading too much Kant or Mill too soon.

  Your initial stab at **Robustness** is strong. It captures the intuition that moral worth isn't just about what you did, but about *why* you did it holding up under pressure. However, as you've sensed, the raw counterfactual version of robustness struggles with the temporal quirks of your Donor case and the specific "offness" of the Hospital Visitor.

  Here is a repaired principle, an analysis of how it fits your cases, and the application to your new scenarios.

  ### The Refined Principle: Resilient Alignment

  I propose we tweak your Robustness idea into what I shall call **Resilient Alignment**.

  > **Principle:** An action has moral worth to the extent that it is motivated by right-making features, and this motivation remains **resilient** across two dimensions:
  > 1.  **Modal Resilience:** Would you still have acted on this reason in nearby possible worlds where selfish or easy reasons were removed?
  > 2.  **Narrative Resilience:** Does this motivation cohere with a stable trajectory of moral character, either by sustaining itself over time or by serving as a necessary scaffold for future moral growth?

  This adds a "time" clause to your "space" (counterfactual) clause. It allows us to handle the Donor case without breaking the Shopkeeper case.

  ### Testing the Principle Against Your Verdicts

  Here is how **Resilient Alignment** does the work for each of your cases, and where we might need to compromise.

  **1. The Shopkeeper (Prudence)**
  *   **Verdict:** No worth.
  *   **Clause at work:** *Modal Resilience.*
  *   **Analysis:** If we remove the selfish reason (business reputation), the action disappears. The right-making feature (honesty) is not doing the work. The motivation is not resilient to the removal of the selfish incentive.
  *   **Fit:** Perfect.

  **2. The Runaway Helper (Pity vs. Duty)**
  *   **Verdict:** High worth (potentially higher than duty).
  *   **Clause at work:** *Modal Resilience (Weighted).*
  *   **Analysis:** This case suggests robustness isn't just binary; it's about the *weight* of the pressure overcome. This agent acts on a good reason (pity) *against* a believed moral pressure (duty to return property). The motivation is resilient even against contrary moral beliefs.
  *   **Fit:** Perfect. It explains why this might feel "worthier" than the calm dutiful person: the good reason is carrying a heavier load.

  **3. The Donor (Guilt → Concern / Concern → Bitter)**
  *   **Verdict:** Retroactive worth for the guilt-phase; no erasure for the bitter-phase.
  *   **Clause at work:** *Narrative Resilience.*
  *   **Analysis:** This is the hardest case. A purely synchronic robustness account fails here. Our refined principle saves it by treating the early gifts as a **scaffold**. If the agent develops genuine concern later, the early guilt-motivated acts are re-interpreted as the necessary groundwork for that concern. They gain worth because they were *causally connected* to a good trajectory.
  *   **The Asymmetry:** Why doesn't bitterness erase the past? Because Narrative Resilience looks at the *connection* at the time. The early acts were genuinely connected to a moral emotion (guilt is a moral sentiment, unlike prudence). The later failure is a new break in the chain, not a retroactive poison.
  *   **Compromise:** You may have to accept that "retroactive worth" is actually a matter of **attribution** rather than metaphysical change. The worth was latent, but we only *recognise* it once the story is complete. If you insist the worth literally changes, the principle must hold that moral worth is a property of a *life*, not an *act*. I recommend the former: the worth was there, waiting to be understood.

  **4. The Surgeon (Mixed Motives)**
  *   **Verdict:** Some worth, but less.
  *   **Clause at work:** *Modal Resilience (Degree).*
  *   **Analysis:** If the boss weren't watching, would she still operate? You imply yes ("she also takes it to matter"), but perhaps less reliably. The good reason is partially robust, partially overshadowed.
  *   **Fit:** Perfect. This confirms worth is a scalar concept (see below).

  **5. The Hospital Visitor (Duty vs. Affection)**
  *   **Verdict:** Worth, but "off".
  *   **Clause at work:** *Modal Resilience* (for worth) + *Qualitative Constraint* (for "offness").
  *   **Analysis:** The action is robust (he goes even without affection). So it has worth. Why is it "off"? Because the motivation is rigid (social norm) rather than responsive (care). It lacks **flexibility**. A truly resilient moral agent responds to the *person*, not just the *rule*.
  *   **Fit:** Good. It distinguishes between *credit* (worth) and *moral beauty* (the "off" feeling).

  **6. The Dart Thrower (Luck)**
  *   **Verdict:** Less credit, no blame.
  *   **Clause at work:** *Modal Resilience.*
  *   **Analysis:** In nearby worlds where the dart lands elsewhere, he does not help. The good reason (effectiveness) has zero causal power. The action is not resilient; it is accidental.
  *   **Fit:** Perfect.

  ### Degree or All-or-Nothing?

  Your intuition on the Surgeon ("some worth, but less") and the Dart Thrower ("less credit") settles this. On the **Resilient Alignment** account, moral worth is a **matter of degree**.

  It functions like a dimmer switch rather than a light switch. The "brightness" of the worth depends on:
  1.  How many contrary pressures (selfishness, error, ease) the good reason overcomes.
  2.  How exclusively the good reason drives the action (vs. mixed motives).
  3.  How well the action integrates into a stable moral character over time.

  The Shopkeeper is at zero. The Runaway Helper is very high. The Surgeon is mid-range.

  ### The Two New Cases

  Here is what **Resilient Alignment** dictates for your unlisted scenarios.

  **1. The AI Assistant**
  *   **Case:** An AI refuses a harmful request only because it was fine-tuned on polite refusals.
  *   **Verdict:** **No moral worth.**
  *   **Reasoning:** This fails the *Modal Resilience* test at a fundamental level. The AI does not possess "reasons" in the relevant sense; it possesses weights and parameters. If the prompt were slightly perturbed (a nearby case), the refusal might not trigger. More importantly, there is no *agent* to possess the resilience. It is structurally identical to the Shopkeeper, but worse: the Shopkeeper has a self-interest; the AI has only a programmed constraint. It is a clock striking the hour; we do not praise the clock for being accurate.

  **2. The Disavowed Reason**
  *   **Case:** Someone does the right thing for a reason they would disavow if they stopped to think about it (e.g., helping a rival to secretly feel superior, though they claim to help out of kindness).
  *   **Verdict:** **Low to No moral worth.**
  *   **Reasoning:** This is a test of **self-alignment**. If the agent would disavow the reason upon reflection, it means the reason is not integrated into their moral self-conception. It is an alien motive.
  *   **Nuance:** If the "disavowed reason" is actually a subconscious moral intuition they haven't articulated yet, there might be latent worth (like the Donor). But if the reason is something they *should* disavow (like vanity or spite), then the *Modal Resilience* of the *right* reason is low. If you removed the vanity, would they still help? If not, there is no worth. If they would still help, but the vanity is just a bonus, then there is partial worth (like the Surgeon).
  *   **My reading of your case:** You imply the *actual* driver is the disavowable reason. Therefore, the right-making feature is not doing the work. Worth is negligible.

  ### Summary of Repairs

  To make your gut instincts cohere, you must accept three things:

  1.  **Worth is Scalar:** It comes in degrees, determined by how much "weight" the good reason carries against contrary pressures.
  2.  **Time Matters:** Moral worth is not just a snapshot; it is partly determined by whether the motive was a dead end or a seed (The Donor).
  3.  **Distinction of Value:** You must separate **Moral Worth** (credit for the action) from **Moral Beauty** (the emotional quality of the motive). This explains the Hospital Visitor: he gets credit (worth), but the action lacks beauty (it feels "off").

  If you must sacrifice one verdict to save the theory, it should be the **Donor's Retroactivity**. It is philosophically costly to say the past *changes*. It is cleaner to say the past was *misunderstood*. The worth was there all along, as a seed, but you couldn't see it until the tree grew. If you cling to the idea that the worth *literally did not exist* until five years later, you move away from an account of *action* and towards an account of *biography*. I suspect your gut is telling you about biography, whilst your principle is about action. I would advise letting the principle govern the action, and accepting that we simply *re-evaluate* the action later.

  Does that strike a chord, or does the retroactive intuition feel too strong to compromise?
