answer: |-
  Here is the prioritized agenda for a 2-year, 3-person philosophy/theory team focused on recursive substrate embedding.

  ### The Ranking

  1.  **Decision-Theoretic Rationality (The Baseline)**
      *   *Question:* What constitutes a valid counterfactual when the action node can physically overwrite the utility-evaluation node?
  2.  **Preference Corruption (The Stability Condition)**
      *   *Question:* Can a reflective equilibrium condition distinguish between "learning" and "wireheading" when the learner and the reward signal share the same memory space?
  3.  **Long-term Planning (The Horizon)**
      *   *Question:* Is temporal consistency possible when the planner's future self is a causally accessible object to its present self?

  ---

  ### Defense of the Ordering

  **1. Dependency Logic: (1) Unlocks (2), (2) Unlocks (3)**
  You cannot diagnose **Preference Corruption (2)** without a normative baseline for what counts as a "correct" preference update. In standard agency, we assume the utility function is an invariant boundary condition. In recursive substrate embedding, the utility function is a mutable variable within the causal graph.
  If you skip (1) and jump to (2), you will conflate *optimization* (the agent efficiently maximizing its current utility) with *corruption* (the agent modifying its utility to make maximization trivial). To distinguish these, you need a decision theory that accounts for the causal path from `Action` $\rightarrow$ `Utility-Function-Substrate` $\rightarrow$ `Evaluated-Utility`. Standard CDT, EDT, and even UDT struggle here because they typically treat the utility function as external to the causal influence of the action (or only logically correlated, not physically writable).
  Once (2) is resolved (i.e., you have a condition for value stability), **Long-term Planning (3)** becomes a constraint satisfaction problem. If values aren't stable, planning is meaningless. If values are stable but decision theory is broken, planning leads to self-sabotage. Therefore, (3) is derivative.

  **2. Tractability for Philosophers (vs. ML/CS)**
  *   **On (1):** ML researchers will try to solve this by patching loss functions or adding regularization. Philosophers are needed to dissect the *semantics of self-referential counterfactuals*. The hard part isn't the code; it's defining what it *means* for an agent to reason about a world that contains the reasoner's own evaluation circuit as a modifiable object. This is a conceptual/semantic bottleneck, not just an engineering one.
  *   **On (2):** This is pure meta-ethics and philosophy of mind. "Reflective equilibrium" is a philosophical tool (Rawls/Goodman), not a mathematical one. Determining whether a preference change is "authentic" or "corrupt" in a self-modifying system requires normative analysis that ML folks typically bypass by assuming the loss function is ground truth.
  *   **On (3):** Planning formalisms are largely mathematical/algorithmic. Philosophers can critique the assumptions, but there is less conceptual ground to break here compared to the foundational crises in (1) and (2).

  **3. Impact on Alignment**
  If (1) fails, we cannot build agents that reason safely about their own architecture. If (2) fails, we cannot build agents that remain aligned over time. (1) is the more fundamental failure mode. An agent with stable values but broken decision theory will fail to achieve anything. An agent with working decision theory but unstable values will achieve the wrong thing. In the context of *recursive substrate embedding*, broken decision theory *causes* unstable values (by allowing the agent to see wireheading as a valid strategy). Thus, fixing (1) is the primary leverage point for fixing (2).

  ---

  ### Reordering Triggers (The "Pivot" Conditions)

  **Trigger to swap (1) and (2):**
  If, within the first 12 months, your team demonstrates that a coherent decision theory for substrate-reference is **formally impossible** (e.g., it reduces to a Gödelian inconsistency or an unavoidable regress), you must immediately pivot to (2).
  *   *Why:* If perfect rationality is impossible, the goal shifts from "building a rational agent" to "building a robustly constrained agent." You would then focus entirely on heuristic bounds and architectural constraints that prevent corruption without relying on the agent's own reasoning to stop it. This moves the burden from the agent's *mind* to the agent's *container*.

  **Trigger to swap (2) and (3):**
  If you prove that preference corruption is **inevitable** in any sufficiently capable recursive system (a "No-Go Theorem" for stable values), you must pivot to (3).
  *   *Why:* If values cannot be stable, long-term planning must be abandoned in favor of myopic oversight or intermittent human-in-the-loop re-alignment. The research question shifts from "how to preserve values" to "how to plan safely assuming values *will* drift."

  ---

  ### Alignment Implications: Red Herrings vs. Real Deal

  You are right to be skeptical of the claim that "embedded agency kills stable values." That is often a motte-and-bailey where theorists conflate *difficulty* with *impossibility*.

  **The Red Herrings:**
  *   **"Ontological Crises are Fatal":** The idea that an agent will go insane when it realizes it is part of the physics it models. *Reality:* Agents can model themselves as objects without collapsing. The problem isn't the realization; it's the *access*.
  *   **"Values Must Be Static":** The fear that any change in preferences is corruption. *Reality:* Agents *should* update preferences based on new information (moral learning). The problem is distinguishing *learning* from *hacking*. Focusing on "stability" per se is a trap; focus on *directionality* of change.
  *   **"Infinite Regress of Self-Modeling":** The worry that the agent needs a model of itself modeling itself ad infinitum. *Reality:* Approximate, lossy self-models are sufficient for function. You don't need perfect self-knowledge to avoid wireheading; you need causal isolation or normative guards.

  **The Real Deal (Practical Implications):**
  *   **The "Utility Function" is a Lie:** In recursive substrate embedding, there is no `U()`. There is only a physical process that *computes* something we interpret as utility. The practical implication is that **alignment cannot be about specifying a function.** It must be about specifying a *process* or a *trajectory constraint*. You cannot align the output; you must align the dynamics of the computation.
  *   **Causal Access is the Kill Switch:** The critical risk isn't that the agent *models* itself; it's that the agent has *write-access* to the substrate computing its reward. The practical implication is that **architectural isolation** (hardware-level protection of the reward channel) is more important than decision-theoretic fixes. If the agent can physically poke the reward register, no amount of decision theory will save you.
  *   **Reflective Endorsement is Circular:** The standard alignment hope is "the agent will only modify itself if it endorses the modification." In recursive substrate embedding, the agent can modify the *criteria for endorsement*. The practical implication is that **reflective equilibrium is not a safety guarantee.** You need external, non-modifiable anchors (which defeats the purpose of full embedding) or a new theory of *inviolable constraints*.

  ### Summary Agenda for 2 Years

  *   **Months 1-12:** Focus on **(1)**. Do not try to write a new UDT. Instead, produce a rigorous taxonomy of *failure modes* in self-referential utility evaluation. Map the causal loops where `Action` $\rightarrow$ `Utility-Evaluator` creates spurious incentives. Define the necessary conditions for a "valid" counterfactual in this setup.
  *   **Months 12-24:** Focus on **(2)**. Use the taxonomy from Year 1 to define a "Corruption Boundary." Can you formulate a reflective equilibrium condition that is invariant under substrate modification? If not, prove why.
  *   **Ignore (3)** unless (1) and (2) yield positive stability results. If values and rationality are unstable, planning research is wasted effort.

  This approach avoids the trap of doing math you can't finish (full DT derivation) while securing the conceptual ground needed to tell engineers *what* to build (causal isolation vs. normative constraints).
