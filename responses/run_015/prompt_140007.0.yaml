  **NORTHVALE CORRECTIONAL AUTHORITY**
  **OFFICE OF SANCTION DESIGN**
  **MEMORANDUM 3.14**

  **TO:** All Facility Directors, Case Managers, Public Communications
  **FROM:** Dr. Aris Thorne, Director of Sanction Design
  **DATE:** Year 3, Post-Abolition Cycle
  **SUBJECT:** Linguistic Compliance and Conceptual Hygiene

  As we enter the third year of the Public Safety & Rehabilitation Act, consistency in terminology is vital. Language shapes institutional logic. Inconsistent phrasing reintroduces legacy concepts incompatible with the risk-management model. The following entries clarify approved usage. Deviations undermine the legitimacy of the intervention and confuse the subject's reintegration pathway.

  **1.0 TERMINOLOGY STANDARDIZATION**
  Staff must avoid legacy vocabulary that implies moral accounting. Use the following mappings:

  | Desert-era Phrase | Approved Post-Desert Equivalent |
  | :--- | :--- |
  | Sentence / Tariff | Containment Period |
  | Crime / Offense | Risk Event |
  | Punishment | Sanction Intervention |
  | Guilty Verdict | Confirmed Source Status |
  | Parole | Conditional Community Access |
  | Rehabilitation | Risk Reduction Protocol |

  **2.0 THE GENERAL SIGNAL REQUIREMENT (PROPORTIONALITY)**
  Sanctions must align with public expectation to maintain compliance. If a Containment Period is perceived as too lenient relative to the Risk Event, public cooperation declines, increasing overall system risk.
  *Case Reference:* Subject 8940 (Low Halberd-7 Score).
  *Issue:* Subject's risk profile suggests release at Month 4. However, the Risk Event (aggravated theft) historically carries a Month 18 expectation.
  *Directive:* Extend Containment to Month 18. This is not based on Subject 8940's individual risk, but on the need to maintain the general signal regarding property security. Releasing early would degrade the deterrent value of the intervention for the wider population. The subject is not being held for what they did, but to sustain the integrity of the safety framework.

  **3.0 SUBJECT RESISTANCE TO MANAGEMENT**
  Some subjects insist they "deserve punishment" or wish to "pay a debt." This indicates a fixation on legacy moral frameworks.
  *Directive:* Do not validate the claim. Explain that the system does not deal in debt, but in safety. However, note that insistence on "desert" is a risk factor. It suggests the subject views the intervention as adversarial rather than therapeutic. Non-acceptance of the management model may result in extended containment until the subject accepts the clinical framing. Refusal to be managed is itself a risk event.

  **4.0 STATIC RISK AND INDEFINITE CONTAINMENT**
  When a subject's Halberd-7 score remains static despite Protocol, and no treatment exists to lower the score, release is contraindicated.
  *Directive:* Continue containment indefinitely. This is not punishment, as there is no intent to inflict suffering, only to prevent harm. Like quarantine for infectious disease, the duration is keyed to the risk, not the act. If the risk is permanent, the containment is permanent. Staff should avoid expressing regret; this is a neutral safety outcome.

  **5.0 POSITIVE REINFORCEMENT AND AGENCY**
  Staff often congratulate subjects on "good choices" or "hard work." This implies the subject is morally responsible for progress, which contradicts the causal model of behavior.
  *Directive:* Use passive construction. Instead of "You worked hard," say "Positive outcomes were observed." If we attribute success to the subject's agency, we implicitly attribute failure to their culpability. To maintain conceptual hygiene, we must view progress as the result of effective protocol, not individual merit. Praise risks reintroducing the notion of the autonomous agent.

  **6.0 COMMUNICATION EXAMPLES**
  All public statements must reflect the expressive dimension of the intervention without invoking censure. The sanction must communicate community standards without assigning blame.

  *Example: Press Release regarding Subject 8940*

  **Non-Compliant Draft:**
  "Subject 8940 was sentenced to 18 months for stealing a bike. The judge said this punishment fits the crime and sends a message that theft is wrong. He deserves this time."

  **Approved Revision:**
  "Subject 8940 has been assigned an 18-month Containment Period following a confirmed Risk Event involving property transfer. This duration ensures the general signal regarding property security remains effective for community safety. The intervention expresses the community's commitment to stability. Subject 8940 will undergo Risk Reduction Protocol."

  **7.0 SUMMARY**
  Precision protects the model. When language drifts toward desert, legitimacy erodes. When it drifts toward pure mechanics, subjects feel dehumanized. Balance is required. We manage risk, not people. But we must speak to people to manage the risk. Adhere to these standards to ensure the system remains humane, effective, and logically consistent.

  **END OF MEMORANDUM**
