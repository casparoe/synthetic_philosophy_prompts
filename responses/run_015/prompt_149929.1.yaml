answer: |-
  Here is a complete design for your 90-minute session. It is built to be run with minimal math, maximum social friction, and a clear narrative arc that leads to your specific conclusion about "Frame Disagreement."

  # Activity Title: The Glass Market

  **Goal:** Demonstrate that trade vanishes when we know *why* we disagree, but returns when we don't agree on *what* we are betting on.
  **Group Size:** 14 people (works for 10–20).
  **Materials:**
  *   Poker chips (3 colors: White, Blue, Red).
  *   Index cards (2 decks: Deck H and Deck T).
  *   A large whiteboard or flipchart.
  *   Sticky notes (two pads, different colors).
  *   One envelope containing a single coin (Heads or Tails).
  *   One "Mystery Object" (e.g., a weird vintage tool or a printed photo of an abstract sculpture).
  *   **The Prize:** Something silly but tangible (e.g., a giant chocolate coin, a weird mug, a $5 coffee gift card). Winner is whoever has the most chips at the end.

  ---

  ## The Timeline (90 Minutes)

  | Time | Phase | Activity | Goal |
  | :--- | :--- | :--- | :--- |
  | 00–10 | **Intro** | Rules, Chips, The "Truth" | Set stakes, no math. |
  | 10–30 | **Phase 1** | **Private Signals** | Trading feels easy/profitable. |
  | 30–50 | **Phase 2** | **Public Board** | Common knowledge kills trade. |
  | 50–70 | **Phase 3** | **The Vague Asset** | Frame disagreement restores trade. |
  | 70–90 | **Debrief** | **The Wrap-Up** | Map feelings to the theory. |

  ---

  ## Setup & Rules (The "No Math" Constraint)

  1.  **The Currency:** Give everyone 10 White Chips. These are their bankroll.
  2.  **The Asset:** Explain there is a **"Winning Ticket"** in the room. At the end of the session, you will open the Envelope.
      *   If the Coin is **Heads**: The Ticket pays 5 White Chips.
      *   If the Coin is **Tails**: The Ticket pays 0 White Chips.
  3.  **The Trade:** Players can buy or sell the Ticket from each other.
      *   **Fixed Price:** To avoid haggling math, the price is fixed at **2 White Chips**.
      *   **The Bet:** If I sell you a Ticket for 2 chips, I keep your 2 chips. If Heads comes up, I owe you 5. (Net: I lose 3, You gain 3). If Tails comes up, I owe you 0. (Net: I gain 2, You lose 2).
      *   *Simplification:* Just say: "Buyer risks 2 to win 3. Seller risks 3 to win 2."
  4.  **The Signal:** Each player gets one Index Card face down.
      *   Tell them: "This card gives you a hint about the Coin. It is **usually right**, but not always. Do not show it to anyone yet."
      *   *Prep:* Before they arrive, flip the coin. If Heads, fill Deck H with 10 "Heads" cards and 4 "Tails" cards. Fill Deck T with 10 "Tails" and 4 "Heads". (Roughly 70% accuracy).
      *   *Crucial:* Everyone knows everyone else drew from the same mixed bag. Everyone knows everyone is rational (ask them to promise to try to win).

  ---

  ## Phase 1: The Whisper Market (20 Mins)

  **Setup:**
  *   Players look at their cards privately.
  *   **Rule:** They have 5 minutes to find *one* partner and make *one* trade. They can whisper. No one else sees who traded or why.
  *   If they don't trade, they keep their chips.

  **What Will Happen:**
  *   People with "Heads" cards will want to Buy.
  *   People with "Tails" cards will want to Sell.
  *   They will find each other easily. "I'm buying." "Okay, I'm selling."
  *   **Feeling:** They feel smart. They think, "I have inside info. This guy probably doesn't." They feel like they are beating the market.

  **Facilitator Script:**
  > "Go. Find a partner. Make a deal. Keep your cards hidden. If you trade, hand me a sticky note with your names on it so I can track the volume."

  *(Let them trade. Count the trades on the board. It should be high.)*

  ---

  ## Phase 2: The Glass Wall (20 Mins)

  **Setup:**
  *   Reset chips (give everyone back to 10 so no one is bankrupt).
  *   Keep the same Coin/Envelope (do not flip a new one).
  *   **Rule Change:** "This time, before you can trade, you must declare your intent publicly."
  *   Put two columns on the Whiteboard: **WANT TO BUY** | **WANT TO SELL**.
  *   Everyone must write their Name on a Sticky Note and put it in a column *simultaneously*. (Count down: 3, 2, 1, Stick).
  *   **The Catch:** Trades are only allowed if there is a matching pair *after* the notes are up. But before they pair up, give them 2 minutes to stare at the board.

  **What Will Happen:**
  *   The Board will fill up. One side will have "Heads" people, one side "Tails" people.
  *   **The Flip:** A "Heads" person looks at the board. They see 6 people wanting to Sell.
  *   *The Realization:* "Wait. Why are 6 people selling? They have the same cards I do. If they are willing to sell at this price, they must have 'Tails' cards. If there are that many 'Tails' cards out there, the Coin is probably Tails. I should not buy."
  *   **Result:** People start peeling their sticky notes off the board. Trade volume collapses.

  **Facilitator Script:**
  > "Look at the board. You see who wants to take the other side of your bet. You know they have the same hints you do. You know they want to win just as much as you do. If you still want to trade, leave your note up. If you want to cancel, take it down."

  *(Watch the notes come down. This is the visceral moment of the No-Trade Theorem.)*

  ---

  ## Phase 3: The Rorschach Market (20 Mins)

  **Setup:**
  *   Reset chips again.
  *   **New Asset:** Put the **Mystery Object** in the center.
  *   **New Payoff:** "At the end, I will ask the Group: Is this Object **Valuable**? If the Majority says Yes, the Ticket pays 5 Chips. If Majority says No, it pays 0."
  *   **New Signals:** Hand out new cards.
      *   **Group A (7 people):** Card says "Resale Value: High" or "Low". (Frame: Money)
      *   **Group B (7 people):** Card says "Historical Significance: High" or "Low". (Frame: Art/Museum)
  *   **Rule:** Return to **Private Whisper Trading** (like Phase 1).

  **What Will Happen:**
  *   Group A thinks "Valuable" means "Can I sell it on eBay?"
  *   Group B thinks "Valuable" means "Is this historically important?"
  *   A Group A person (High Resale) meets a Group B person (Low History).
  *   Group A wants to Buy. Group B wants to Sell.
  *   **Crucially:** They *do not* realize they are defining "Valuable" differently.
  *   Trade volume returns. They feel smart again.

  **Facilitator Script:**
  > "Same rules as Phase 1. Private deals. But now the payoff depends on *your* judgment of the object at the end. Go."

  *(Let them trade. It will look like Phase 1, busy and confident.)*

  ---

  ## The Debrief (20 Mins)

  Do not lecture immediately. Ask questions to draw the theory out of them.

  **1. The Phase 2 Freeze (The No-Trade Theorem)**
  *   *Ask:* "In Phase 2, nobody changed their cards. The Coin didn't change. Why did the trading stop?"
  *   *Listen for:* "I saw who was selling." "I realized they knew something."
  *   *The Point:* "When it became **Common Knowledge** that we disagreed, the disagreement became information. The fact that you were willing to sell told me your info was bad. So I didn't buy. The theorem says: **If we know we share the same world, we can't bet against each other.**"

  **2. The Phase 3 Return (Your Hobby Horse)**
  *   *Ask:* "Trading came back in Phase 3. Why? Were we dumber?"
  *   *Reveal:* Ask Group A what "Valuable" meant. Ask Group B.
  *   *The Point:* "Trade returned because you weren't betting on the *same world*. One of you was betting on Cash, the other on History. You weren't disagreeing on the numbers; you were disagreeing on the **Frame**."
  *   *Your Pitch:* "I suspect most real trading isn't about who has better data (Phase 1). It's about this (Phase 3). We trade because we can't even agree on what the outcome *is*."

  **3. The Lingering Question**
  *   End with this: "In Phase 2, we stopped trading because we understood each other too well. In Phase 3, we traded because we misunderstood each other. **Is understanding a barrier to profit?**"

  ---

  ## Predictable Failures & Fixes

  **1. "I'm just trading to be nice." (Friendship Trading)**
  *   *Risk:* Two friends trade in Phase 2 just to keep the game moving, ruining the "Freeze."
  *   *Fix:* In the Intro, say: "The person with the most chips gets the Prize. If you help a friend, you hurt your own score." Remind them before Phase 2: "This is the round that counts for the Prize."

  **2. "The game is rigged." (Suspicion)**
  *   *Risk:* Someone thinks you manipulated the coin or cards.
  *   *Fix:* Be transparent. Let a volunteer flip the coin in Phase 1. Let them shuffle the decks. If they claim rigging in Phase 2, say: "Even if I rigged it, the logic holds. If you know the other person is rational, you still shouldn't trade."

  **3. "I didn't get the math." (Confusion)**
  *   *Risk:* They get bogged down in calculating odds.
  *   *Fix:* Interrupt immediately. "Don't calculate. Go with your gut. Do you feel like you're winning or losing?" Keep it emotional, not arithmetic.

  **4. Phase 3 feels like chaos.**
  *   *Risk:* They realize the definitions are different too quickly.
  *   *Fix:* Don't reveal the two different card types until the Debrief. During Phase 3, just hand them out randomly. Let them assume everyone is judging "Value" the same way.

  ---

  ## What This Activity Cannot Reproduce (Be Honest)

  At the end of the debrief, you must disclose the limitations so they don't walk away with a simplified fairy tale. Say this:

  1.  **Liquidity:** "In the real world, people trade because they need cash now, not because they think they're smarter. We removed that need here to isolate the information piece."
  2.  **Rationality:** "The theorem assumes we are all perfectly logical robots. You are humans. You traded in Phase 2 anyway because you're optimistic or stubborn. That's actually good—it means you're not machines."
  3.  **The Prior:** "The theorem assumes we started with the same beliefs. In Phase 3, you didn't. That's why the trade came back. In real life, we almost never start with the same beliefs."

  ## The Takeaway Question

  Write this on the board as they leave:

  > **"If we could perfectly communicate what we mean, would we have anything left to trade?"**

  This lands your point: The theorem isn't about finance. It's about the limits of shared understanding. If we truly understood each other (Phase 2), the deal dies. If we misunderstand each other (Phase 3), the deal lives.
