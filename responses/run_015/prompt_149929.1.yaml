      *   **Audience:** 14 people, mixed backgrounds (software, nurse, students, insurance), non-academic, dislike written arithmetic.
      *   **Constraints:** Library meeting room, 90 minutes, no real money (chips + stupid prize), keep math simple (whole percents/coin counts).
      *   **Core Concept:** The No-Trade Theorem (Aumann's Agreement Theorem variant). If we share priors and know we disagree, we shouldn't trade.
      *   **Desired Flow:**
          1.  Phase 1: Trading feels fine/profitable (Private info).
          2.  Phase 2: The Flip (Common knowledge of disagreement kills trade).
          3.  Phase 3: The Host's Hypothesis (Frame disagreement/undefined outcomes restores trade).
      *   **Goal:** Make them *feel* the theorem, not just hear it. End with a lingering question about knowledge/minds.
