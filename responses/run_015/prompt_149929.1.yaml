  2.  **Deconstruct the No-Trade Theorem for Laypeople:**

      *   *The Math:* If $P(A|Info_1) > Price$ and $P(A|Info_2) < Price$, and we know each other is rational and sharing the same prior, then the fact that you are willing to sell at $Price$ tells me your info must be bad, so I shouldn't buy.
      *   *The Vibe:* "Why are you selling? You must know something I don't. Oh wait, I'm buying. So you know I'm buying. So you know I think my info is good. But if your info was good, you wouldn't sell. So your info is bad. So I shouldn't buy."
