  6.  **Drafting the Plan (Iterative refinement):**

      *   *Phase 1 (Private):* "Blind Bidding." You get a signal (Green/Red slip). Green = Asset likely Good. Red = Asset likely Bad. You find a partner secretly. If you agree, trade 1 chip.
