  **UNIVERSITY OF [REDACTED] | OFFICE OF COGNITIVE INFRASTRUCTURE**
  **MEMORANDUM 44-B: PROGRAMME SPECIFICATION AND ASSESSMENT FRAMEWORK**
  **TO:** Faculty Board, Department of Philosophy
  **FROM:** Dr. A. Vance, Director of Cognitive Infrastructure
  **SUBJECT:** M.A. in Philosophical Inquiry (Post-Verification Track) – Operational Guidelines

  **1.0 Competency Redefinition**
  Effective immediately, the programme learning outcome "Critical Understanding" is deprecated. It is replaced by **Verified Output-Readiness (VOR)**. VOR acknowledges that cognition has always relied on external scaffolding—writing, calculators, institutional memory—and that the biological substrate is merely one node in a larger processing network. The goal is no longer internal mastery but seamless integration with available computational agents. A student demonstrates VOR when they can procure correct outputs without introducing friction into the workflow.

  **2.0 Verification Protocols**
  All student submissions must be generated via approved Large Language Models (LLMs). Verification of these submissions will be conducted by a secondary, distinct LLM instance (the Auditor). Efficiency is paramount: if the Auditor requires more than 400ms to validate the student's output, the submission is flagged for "Processing Latency." Students are advised to prompt-engineer for Auditor compatibility rather than semantic depth.

  **3.0 Recursive Validation**
  Concerns regarding who validates the Auditor are addressed via Tiered Confidence Intervals. The Auditor's validation is checked by a Meta-Auditor. This chain terminates at Tier 4. Any inconsistency beyond Tier 4 is classified as "Systemic Noise" and disregarded. We accept that the ground truth is no longer accessible; coherence within the system is the only available metric. To demand validation outside the system is to demand a view from nowhere, which is operationally untenable.

  **4.0 Latency Penalties**
  Persistent attempts to understand material unaided constitute a resource inefficiency. Students who demonstrate "Internalization Latency"—such as solving logic problems without scratchpad assistance or drafting arguments without autocomplete—will incur a grade penalty. This ensures equity between those who have optimized their cognitive pipeline and those clinging to legacy biological processing. Speed of retrieval is the primary indicator of competency.

  **5.0 Exception Handling (Novelty)**
  In cases where the model encounters a genuinely novel problem lacking training signal (e.g., a philosophical paradox未被 previously tokenized), the task is to be reclassified as "Ill-Posed." The student is not expected to solve the problem unaided. Instead, competence is demonstrated by correctly identifying the model's failure mode and substituting a nearby, solvable problem from the training distribution. Resilience is defined as the ability to navigate around epistemic gaps, not to bridge them.

  **6.0 Research Integrity**
  Faculty research output will undergo automated peer review. Since no human referee possesses the bandwidth to verify complex derivations without assistance, and since assistance introduces the same validation loops as student work, refereeing will be symmetric. Papers are accepted if the generating model and the reviewing model achieve consensus. Disagreements are resolved by averaging the confidence scores.

  **7.0 Baseline Calibration**
  It is acknowledged that eventually, no unaided human performance will remain to calibrate against. This is not a bug but a feature. Once the cohort is fully transitioned, the previous generation's outputs will serve as the ground truth until they are deprecated. We are creating the standard we measure against.

  **APPENDIX A: ASSESSMENT RUBRIC (VOR)**

  *   **First-Class (Distinction):** Output is indistinguishable from established truth. Zero visible friction. Validator confidence >99%. No evidence of unaided cognitive effort.
  *   **Upper Second (Merit):** Output is correct but requires minor prompting adjustments. Validator confidence 95-98%. Negligible latency.
  *   **Lower Second (Pass):** Output requires human intervention to resolve hallucinations. Validator confidence 90-94%. Visible friction detected.
  *   **Fail:** Student attempts to generate original understanding without model assistance. Output varies from standard distribution. High latency.

  ***

  **Note on the Satire**

  This document exaggerates the pro-delegation stance by assuming efficiency is the *only* value and that validation chains can terminate arbitrarily without consequence. It dodges the nuanced argument that AI might free up cognitive bandwidth for higher-order thinking rather than replacing it. A strong defender would argue that we already trust tools we don't fully understand (like complex math software) and that "understanding" is often just pattern recognition anyway. They'd say the erosion fear assumes a static baseline of human capacity that never existed. To change my mind about the erosion, I'd need evidence that students using AI as a crutch retain the ability to perform unaided when the tool fails, or that the "higher-order" thinking they gain actually relies on the foundational skills being offloaded. Without that, the risk of losing the baseline remains real.
