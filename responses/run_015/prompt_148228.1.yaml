      *   *Is it baggage?* If we ignore the "awareness" part, we miss the *mechanism* of deception. If deception is purely behavioral, we can detect it. If it's ontological (like Sartre), it's harder.
      *   *Bug or Feature?* It's a feature of the engineering paradigm to ignore phenomenology. But it might be a bug for alignment if "inner alignment" requires understanding the system's "self-model."

  6.  **Synthesizing the Argument:**
