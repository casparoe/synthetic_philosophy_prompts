answer: |-
  This is an exceptionally sharp framing of the St. Petersburg problem. You have correctly identified that the "infinite" version of the paradox is often a mathematical distraction from the deeper decision-theoretic conflict: **What makes a price "fair" when the distribution of outcomes is heavily skewed?**

  By introducing a cap $M$, you remove the mathematical pathology (divergence) while retaining the economic pathology (the mean is driven by events that almost never happen). This allows us to isolate the disagreement between the Expected Utility Theory (EUT) route and the "Expectation is Invalid" route.

  Here is a comparison of the two routes on the truncated game, with explicit distinctions between settled mathematics and contested normative theory.

  ---

  ### 1. The Setup: The Truncated Game
  Let the casino cap the payout at $M$. Let $N$ be the maximum number of flips such that $2^N \le M$. Effectively, $N \approx \log_2 M$.
  *   **Probability of ending at flip $n$:** $1/2^n$ (for $n < N$).
  *   **Probability of ending at flip $N$:** $1/2^{N-1}$ (all remaining probability mass).
  *   **Payoff:** $2^n$.

  In this truncated setting, the Expected Value (EV) is no longer infinite. It is:
  $$ E[X] = \sum_{n=1}^{N} \frac{1}{2^n} 2^n = \sum_{n=1}^{N} 1 = N \approx \log_2 M $$
  **Settled Math:** The EV is finite, well-defined, and grows logarithmically with the cap $M$.

  The question is: **Does the "fair price" track this $E[X]$?**

  ---

  ### 2. Route 1: Expected Utility Theory (EUT)
  **The Mechanism:** This route accepts the probability calculus but rejects linear value. It posits an agent with initial wealth $W_0$ and a concave utility function, typically $U(x) = \ln(x)$. The fair price (certainty equivalent $C$) is the amount such that $U(W_0) = E[U(W_0 + \text{Payoff} - C)]$.

  **Behavior as $M$ Increases:**
  *   **The Calculation:** For $U(x) = \ln(x)$ and assuming $W_0$ is small relative to potential gains (or zero for simplicity), the expected utility is:
      $$ E[U] = \sum_{n=1}^{N} \frac{1}{2^n} \ln(2^n) = \ln(2) \sum_{n=1}^{N} \frac{n}{2^n} $$
      As $N \to \infty$ (and thus $M \to \infty$), the sum $\sum \frac{n}{2^n}$ converges to 2.
  *   **The Result:** The expected utility converges to a finite constant ($2 \ln 2$). Consequently, the certainty equivalent $C$ **saturates**. Even if you raise the cap $M$ to the GDP of a planet, the EUT price barely moves once $M$ passes a certain threshold.
  *   **Role of the Median:** The median outcome is $2$ (50% chance of heads on first flip). In EUT, the median **does no work**. The price is determined by the integration of utility over the *entire* distribution. The fact that 50% of outcomes are the minimum payout is mathematically irrelevant to the calculation, though it explains *why* the utility function dampens the tail.

  **Consensus Status:**
  *   **Settled:** The mathematics of the convergence is uncontroversial. If an agent has log utility, their buying price is bounded.
  *   **Contested:** Whether log utility is the *correct* normative model for rationality. While EUT is the neoclassical consensus, it is well-documented (e.g., by Rabin, 2000) that calibrating risk aversion to small stakes implies absurd risk aversion at large stakes. Furthermore, Menger (1934) showed that for any unbounded utility function, one can construct a "Super St. Petersburg" game that breaks it. Thus, EUT requires *bounded* utility to fully solve the general class of these problems, not just concavity.

  ---

  ### 3. Route 2: "Expectation Isn't a Fair Price"
  **The Mechanism:** This route argues that the Expected Value criterion is only valid under specific conditions (e.g., repeated independent trials allowing the Law of Large Numbers to operate). In a single-shot game, or one where the "long run" is inaccessible within a human lifespan, the ensemble average (EV) is physically irrelevant. This view is associated with Keynes (uncertainty), Samuelson (rejecting the game as ill-posed), and more recently Ole Peters (Ergodicity Economics).

  **Behavior as $M$ Increases:**
  *   **The Argument:** Even with a cap $M$, the distribution remains extremely skewed. The EV is $\approx \log_2 M$, but the probability of achieving a payoff near the EV is vanishingly small.
      *   To realize the EV of $\$1,000$, you need $N=1000$ (cap $2^{1000}$). The probability of hitting the cap is $1/2^{999}$.
      *   Proponents of this route argue that a "fair price" should reflect the **typical** outcome or the **time-average growth rate**, not the ensemble average.
  *   **The Result:** Depending on the specific variant of this critique:
      1.  **Median/Mode Focus:** The price should track the median ($\$2$) or a low quantile. As $M$ rises, the price **remains flat**.
      2.  **Ergodicity (Peters):** The fair price is the entry fee that makes the time-average growth rate of wealth zero. For multiplicative dynamics (which log utility approximates), this yields a price similar to EUT (saturating). However, for additive dynamics, it suggests the EV is only valid if you can play $N$ times. If you play once, the EV is a "fiction."
  *   **Role of the Median:** Here, the median **does central work**. The divergence between the Mean ($\log_2 M$) and the Median ($\$2$) is the primary evidence that the Mean is unrepresentative. As $M$ increases, the gap between Mean and Median widens. Route 2 advocates argue the price should stick to the Median (or near it) because the Mean is driven by "impossible" outcomes.

  **Consensus Status:**
  *   **Settled:** It is settled that for a single trial, the probability of realizing the EV approaches zero as $M$ increases. It is also settled that the EV is only guaranteed to be realized in the limit of infinite repetitions.
  *   **Contested:** Whether this invalidates EV as a pricing metric for *one-off* decisions. Mainstream economics maintains that EV (or EU) is the correct normative standard for rational choice even in single shots (the "coherence" argument). The Ergodicity/Economic critique is gaining traction in physics and behavioral finance but is **not** yet the consensus in decision theory. There is no agreement on whether the median *should* dictate price, only that it *describes* the typical experience better than the mean.

  ---

  ### 4. Direct Comparison on the Truncated Game

  | Feature | Route 1: Expected Utility (Log) | Route 2: Expectation Invalid (Median/Ergodic) |
  | :--- | :--- | :--- |
  | **Fair Price Definition** | Certainty Equivalent (indifference point). | Typical Outcome or Time-Average Growth. |
  | **Behavior as $M \to \infty$** | **Saturates.** Price converges to a constant (e.g., $\approx \$4$ for log utility). | **Flat.** Price stays near Median ($\$2$) or grows negligibly. |
  | **Relation to EV** | Price $\ll$ EV. The gap widens as $M$ grows. | Price $\ll$ EV. The gap widens as $M$ grows. |
  | **Role of Median** | **None.** Median is a statistical property, not a decision variable. | **Central.** Median represents the "real" experience of the agent. |
  | **Why the Tail Doesn't Matter** | Utility weight of tail outcomes is negligible. | Probability of tail outcomes is physically inaccessible. |

  **Crucial Nuance:** In the truncated game, Route 1 and Route 2 often yield **qualitatively similar** predictions (a low, bounded price) but for **fundamentally different reasons**.
  *   **EUT** says the tail *exists* and has value, but the agent *cares less* about it (diminishing marginal utility).
  *   **Route 2** says the tail *effectively does not exist* for the decision-maker (it won't happen in their lifetime), so it shouldn't be priced in at all.

  ### 5. The Median Question: Should it do work?
  You asked explicitly whether the fact that the median is always $2$ should be doing work in the comparison.

  *   **In Route 1 (Consensus View):** No. The median is irrelevant to rational pricing. If I offer you a 50% chance of $\$2$ and a 50% chance of $\$1,000,000$, the median is $\$2$, but a rational agent pays nearly $\$500,000$. The fact that the St. Petersburg median is low is a byproduct of the skew, not a pricing input.
  *   **In Route 2 (Contested View):** Yes. The stability of the median against the exploding mean is the "smoking gun" that the mean is broken. If the price does not track the median (or a low quantile), the agent is paying for value they will statistically never see.

  **Settled vs. Contested:**
  It is **settled** that the median is $2$ regardless of $M$.
  It is **contested** whether the median is a *normative* anchor for price. Standard decision theory rejects median maximization because it violates the Independence Axiom (e.g., it can lead to preference reversals in compound lotteries). However, proponents of Route 2 argue that axioms derived from ensemble averages are inappropriate for non-ergodic, single-shot processes.

  ### 6. Summary for Your Seminar
  When presenting this, you can structure the conclusion as follows:

  1.  **The Truncation removes the infinity but not the skew.** The EV becomes $\log_2 M$, which is finite but unbounded.
  2.  **Route 1 (EUT)** explains the low price via **preferences**. The agent *can* win the millions, but *values* them less. As $M$ rises, the price saturates. This is the textbook consensus, though it relies on specific utility assumptions.
  3.  **Route 2 (EV Critique)** explains the low price via **probability dynamics**. The agent *cannot* win the millions (within reasonable time/trials). As $M$ rises, the price stays near the median ($2$). This is the challenger view, arguing that EV is a category error for single-shot, heavy-tailed events.
  4.  **The Median** is the fault line. For Route 1, it is noise. For Route 2, it is the signal.
  5.  **Consensus Check:** Be clear that while everyone agrees on the math of the truncated EV and EU, there is **no consensus** on which metric defines "rationality" in this specific context. EUT dominates economics, but the "Expectation is Invalid" route is the dominant view in statistics regarding the interpretation of heavy-tailed distributions in single samples.

  This distinction allows you to move past "why don't people pay infinite money" to the deeper question: "When the mean and the typical outcome diverge, which one defines value?" That is the genuine theoretical stalemate.
