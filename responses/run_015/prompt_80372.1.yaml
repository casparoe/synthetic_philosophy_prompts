      *   *Truncated Case (Cap $M$):* Let $N$ be the max flips such that $2^N \le M$. The sum stops at $N$.
      *   *Behavior as $M \to \infty$:* The fair price (certainty equivalent) grows logarithmically with $M$. Specifically, if $U(x) = \ln(x)$, the certainty equivalent $C$ satisfies $\ln(C) \approx E[U]$. Since $E[U]$ grows like $\log_2(M)$, $C$ grows like $\sqrt{M}$? Wait, let's check the math.
