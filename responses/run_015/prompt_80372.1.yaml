          *   Actually, for $U(x) = \ln(x)$, the EU of the *infinite* game is finite. So as $M \to \infty$, the EUT price converges to a constant. The EV price goes to infinity.
          *   *Correction:* In the truncated game, EV is $\approx \frac{1}{2} \log_2 M$. (Since $\sum_{n=1}^N \frac{1}{2^n} 2^n = \sum 1 = N$).
          *   So EV price $\approx \log_2 M$.
          *   EUT price (log utility): Converges to a constant as $M \to \infty$.
      *   *Consensus:* This is standard textbook decision theory. Settled math.

  3.  **Analyze Route 2: "Expectation isn't a fair price" (EV Critique):**

      *   *Mechanism:* This view argues that EV is only appropriate for repeated trials (Law of Large Numbers). For a single shot, EV is meaningless if variance is infinite or distribution is heavy-tailed.
      *   *Truncated Case:* With a cap $M$, the variance is finite. The LLN *does* apply eventually.
      *   *Implication:* If the game is truncated, the "EV is invalid" argument weakens significantly. If you can play enough times to average out, EV becomes relevant.
      *   *However:* For a *single* play, proponents of this view (e.g., Keynes, some behavioralists) might still argue EV is irrelevant regardless of the cap if the probability of hitting the cap is vanishingly small.
