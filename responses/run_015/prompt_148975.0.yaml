prompt: |-
  I'm a control engineer — mostly model-predictive control for chemical plants — and I keep bumping into this AI-safety argument about "tool AI" vs "agent AI" that feels like it should be easy to say in my own vocabulary and somehow isn't. So: translate the distinction, and the claim that tools are much safer to build than agents, as faithfully as you can into the terms I actually use — open-loop vs closed-loop and where the loop physically gets closed, plant / controller / operator, setpoints and objective functions, prediction horizon vs control horizon, model mismatch, actuation bandwidth, observability, disturbance rejection, integral windup, runaway. Then the residue report, which is the part I really care about: which claims in that debate have no clean expression in control terms at all. My guess is that goal-directedness, situational awareness, deception and corrigibility are where it breaks, but please check whether any of them secretly do translate — isn't deception just sensor spoofing, and corrigibility just bumpless transfer to manual? — and say whether the leftover points to a gap in my framework or to the tool/agent people not having made themselves precise.

  One case I want run through your translation rather than dodged: a model that can call tools and write to a scratchpad, but where every action is authorised one at a time by a human, and it only finds out what it's actions did through that human's next message. Open loop or closed loop? Tool or agent? Pick one, and say which feature of your vocabulary forces the answer — I really don't want "it depends".
