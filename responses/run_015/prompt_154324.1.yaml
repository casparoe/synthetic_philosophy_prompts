answer: |-
  This argument is a classic collision between **Mereology** (the study of parts and wholes) and **Social Ontology** (the study of how social entities exist). Your friend is deploying a specific metaphysical framework to deny the reality of the team, while you are relying on a different set of persistence conditions appropriate for social groups.

  Here is the philosophical structure of the dispute, the relevant theories, and where the analogy breaks.

  ### 1. The Mereological Structure: Essentialism vs. Functionalism
  Your friend is arguing from a position of **Mereological Essentialism**. This is the view that an object is strictly identical to the sum of its parts. If you change even one part (a member graduates, a new one joins), the sum changes, and therefore the object ceases to exist. A new object comes into being.

  He supports this with an analogy: **Atoms $\rightarrow$ Chair**.
  *   **Premise:** A chair is just atoms arranged chair-wise.
  *   **Observation:** If you swap atoms, it is technically a new arrangement of matter.
  *   **Conclusion:** Therefore, the "chair" is not a persistent entity, just a temporary arrangement.

  He applies this to your team: **People $\rightarrow$ Team**.
  *   **Premise:** A team is just people arranged team-wise.
  *   **Observation:** 4 parts left, 5 new parts entered.
  *   **Conclusion:** The "team" is gone; it is just new people arranged team-wise.

  **The Counter-Theory: The Ship of Theseus**
  Your intuition aligns with the standard solution to the *Ship of Theseus* paradox regarding functional artifacts. Most philosophers distinguish between **material constitution** (the wood/members) and **form/identity** (the design/institution). For functional entities (ships, teams, corporations), identity is usually tied to **continuity of organization and purpose**, not strict material identity. If the structure, coach, and institutional recognition persist, the *type* of object persists even if the *tokens* (members) change.

  ### 2. The Category Mistake: Physical vs. Institutional Facts
  The analogy breaks because your friend is committing a **category mistake**. He is treating a social group as a **physical artifact** (like a chair) rather than an **institutional fact**.

  *   **Physical Artifacts (Chairs):** Exist primarily due to physical cohesion and function. Their persistence conditions are debated, but they rely heavily on physical continuity.
  *   **Institutional Facts (Debate Teams):** Exist due to **Collective Intentionality** and **Status Functions** (theories developed by John Searle and Margaret Gilbert).

  According to Searle, a debate team exists because of a constitutive rule: *X counts as Y in context C.*
  *   **X:** A group of students.
  *   **Y:** A Debate Team.
  *   **C:** The school's recognition, the coach's authority, the league's registration.

  The "team" is not composed of people in the same way a chair is composed of atoms. It is composed of **accepted status**. As long as the school and league recognize the continuity of the program, the team persists ontologically, regardless of membership turnover. Your friend's atom analogy fails because atoms do not have "collective intentionality." Atoms do not agree to be a chair; people *agree* to be a team.

  ### 3. The "Infinite Teams" Objection (Ontological Proliferation)
  Your friend's argument about "infinite invisible teams in the cafeteria" is a **Reductio ad Absurdum** against **Mereological Universalism**.

  *   **Mereological Universalism:** The view that *any* collection of objects, no matter how scattered, composes a further object. (e.g., The object composed of your left shoe and the Eiffel Tower exists).
  *   **The Objection:** If you say the debate team is a real object just because people are standing there, then *any* random cluster of students in the cafeteria is also a "team." This leads to an absurd explosion of entities (ontological proliferation).

  **Why this objection fails in this context:**
  The objection only succeeds if you define "team" purely by **spatial arrangement** (people standing near each other). However, social ontology defines "team" by **causal integration and intentionality**.
  *   The random kids in the cafeteria lack the *collective intention* to act as a unit.
  *   They lack the *status function* assigned by the institution.
  *   Therefore, they do not compose a "team."

  Philosophers like **Peter van Inwagen** argue that composition only occurs when the parts' activity constitutes a **life** (for organisms) or, in the case of artifacts/social groups, when there is a specific **functional unity**. The debate team has functional unity (preparing arguments, competing under one name); the cafeteria cluster does not. Therefore, the "infinite teams" do not exist, and the objection fails to prove your team isn't real.

  ### 4. Summary of the Break
  Your friend assumes **Nihilism** (only simples/atoms are real) or **Universalism** (everything is real, which is absurd), forcing you into a corner.
  *   **He is right that:** If the team were merely a physical aggregate of bodies, strict identity would be lost when members change.
  *   **He is wrong that:** The team is merely a physical aggregate. It is a **social object** sustained by recognition and purpose.

  The "infinite teams" objection relies on a spatial definition of composition. Since social groups are defined by *intentional* and *institutional* criteria, not spatial ones, the cafeteria clusters do not qualify as teams.

  Verdict: The debate team is genuinely composed (as a social entity sustained by collective intentionality), and the infinite-teams objection fails (because random clusters lack the requisite status function).
