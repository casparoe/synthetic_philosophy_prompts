          2.  **Mechanism:** Disruption of Reproduction/Transmission (Explains Sterilization/Stolen Gen vs. Bamiyan).
          3.  **Intent:** Destruction of the Group's Future (Explains Holodomor ambivalence).
      *   *The Hard Cases:*
          *   *Stolen Gen vs. Bamiyan:* Focus on *human vectors* of culture vs. *artifacts*.
          *   *Armenians vs. Kulaks:* Focus on *exit costs* from the group.
      *   *Political Naming:* Admit that the "Political Group" exclusion was a Soviet/Western compromise, not a philosophical necessity, but the user's intuition (mutable vs. immutable) is a valid philosophical defense of it.
      *   *The Atlantic Slave Trade:* Apply the principle. It likely qualifies as genocidal under "cultural/biological disruption," but the *intent* was exploitation. This reveals a tension: Is genocide about *outcome* or *purpose*? I will argue that under *this* principle, it leans Yes, and that is a Feature (it highlights the severity), but it requires nuance on "intent to destroy" vs "intent to exploit despite destruction."
      *   *Conclusion:* Summarize.

  9.  **Review against Constraints:**
      *   Did I answer the specific pairs? (Stolen Gen/Bamiyan, Armenians/Kulaks). Yes.
