          *   *Khmer Rouge:* Political groups are voluntary/mutable. You can stop being an intellectual. You can't stop being Tutsi or Yazidi easily.
          *   *Holodomor:* Turns on whether the famine was intended to break Ukrainian *national* continuity or just crush peasant resistance.

  4.  **Developing the Core Principle:**
      *   *Core Concept:* **Intergenerational Viability.** Genocide isn't just mass murder; it's "group murder." It requires the intent to render the group incapable of sustaining itself into the next generation.
      *   *Clause 1 (The Object):* The target must be a "stable, involuntary group" (National, Ethnical, Racial, Religious). This explains the Khmer Rouge exclusion (political groups are mutable).
      *   *Clause 2 (The Act):* The act must disrupt the *reproductive continuity* of the group. This covers killing (biological), sterilization (biological), and child transfer (cultural/biological).
      *   *Clause 3 (The Cultural Limit):* Cultural destruction counts *only if* it severs the mechanism of intergenerational transmission (e.g., taking kids, banning language in schools). Destroying statues (Bamiyan) is symbolic, not reproductive.
      *   *Clause 4 (Intent):* Specific intent to destroy the group *as such*, not just defeat an enemy or seize land (though these can overlap).

