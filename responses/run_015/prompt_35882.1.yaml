      *   *Verdict:* Under the "Intergenerational Viability" principle, it's borderline. It disrupted continuity (middle passage, banning culture), but the goal was *subjugation*, not *elimination*. Lemkin actually considered slavery a form of genocide (in his early drafts), but the Convention dropped it.
      *   *Decision:* I need to be honest. If the principle is "destruction of group viability," the Slave Trade fits the *effect* but maybe not the *specific intent* of extinction. However, many scholars (e.g., David Stannard) argue it *was* genocide. I should present this tension. If I define genocide as "destruction of group viability," the Slave Trade is a Yes. Is that a bug? It expands the term significantly. I need to weigh if this aligns with the user's "gut." The user's gut seems to align with Lemkin's broader cultural view.

  8.  **Drafting the Response:**
      *   *Introduction:* Acknowledge the sophistication of the user's intuitions. They align closely with a "Reproductive/Continuity" model of genocide.
      *   *The Principle:* "The Principle of Intergenerational Viability."
