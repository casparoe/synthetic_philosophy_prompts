  11. **Final Polish:** Ensure the distinction between "War Crime" and "Genocide" is clear regarding Bamiyan. Ensure the distinction between "Crimes Against Humanity" and "Genocide" is clear regarding Holodomor/Khmer Rouge.

      *(Self-Correction during drafting)*: I need to be careful with Lemkin. Lemkin *did* care about cultural destruction (Axis Rule in Europe). He might have counted Bamiyan if it was part of a broader plan. But the user says *just* blowing up statues. I must respect the user's constraint: "without touching the people." My principle must explain why *only* people-touching cultural destruction counts.
