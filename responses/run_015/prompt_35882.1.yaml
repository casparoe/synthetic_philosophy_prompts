          *   *Problem:* User says Sterilization and Stolen Generations are genocidal. The Convention covers sterilization (Article II(d)) and transferring children (Article II(e)), so this actually fits well. But the Convention excludes political groups (Khmer Rouge). User is ambivalent there.
