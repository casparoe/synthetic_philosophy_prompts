  - The procedure itself (about 450 words):
  1. **Define the Horizon:** Ask: Is there a hard deadline or fixed number of rounds known to all parties? *Sufficient Answer:* Written protocol or statutory deadline. *Stop/No:* If "Yes," mark **Finite Game** (BI applies). If "No," mark **Iterated** (Cooperation viable). *Action:* If Iterated, advise extension immediately because the end-game logic does not trigger.
  2. **Assess Payoff Transparency:** Ask: Do parties know the cost of walking away vs. settling? *Sufficient Answer:* Verified cost-benefit analyses shared in technical review. *Stop/No:* If "Yes," mark **Common Knowledge**. If "No," flag **Information Asymmetry**. *Value Flag:* Asymmetry justifies extension to gather data, not just hope. In Step 2, if asymmetry is claimed but not proven, treat as Common Knowledge to prevent stalling. This prevents parties from hiding behind secrecy to delay inevitable defection.
  3. **Run Backward Induction (BI):** Assuming Finite + Common Knowledge, calculate the logical exit point. *Sufficient Answer:* If the current round exceeds the theoretical defection point, mark **Structural Defection**. *Action:* Default advice is "Settle Now." This is the core economic rule: if everyone knows the end, rational players leave before the cost exceeds the gain.
  4. **Check External Enforcement:** Ask: Are there third-party penalties (fines, regulations) for non-agreement? *Sufficient Answer:* Regulatory mandates or binding MOUs. *Stop/No:* If "Yes," BI is suspended. *Action:* Advise extension; cooperation is enforced, not just rational. External pressure changes the payoff matrix, making cooperation the dominant strategy despite the finite horizon.
  5. **The Value Override:** If Step 3 recommends "Settle" but ecological stakes are critical, trigger **Policy Override**. *Value Flag:* This is where your team makes a value call. You are prioritizing long-term public good over short-term economic efficiency. Document this explicitly.
  *Distinction:* Structural defection is when the game mechanics force exit (Steps 1-3 align). Sustainable cooperation survives via indefinite horizons (Step 1), hidden info (Step 2), or external rules (Step 4). Your team applies rules in Steps 1, 3, 4. You make value judgments in Step 2 (interpreting ambiguity) and Step 5 (overriding economics). Never guess utility; require parties to certify their constraints in writing to avoid blame for failed talks. This ensures the checklist remains an audit trail, not a black box. You must explicitly note when you are ignoring the math for policy reasons. This separation protects non-experts from being accused of miscalculating game theory when they are actually making political choices.

  - Three worked cases (about 400 words):
  1. **Two-Party Round 3:** The protocol mandates four phases (Finite). Technical reviews were shared (Transparent). Backward induction suggests rational actors defect by Phase 2 to avoid Phase 3 costs. They are cooperating in Phase 3. Running the procedure: Step 1 confirms Finite. Step 2 confirms Transparency. Step 3 flags **Structural Defection**. Step 4 finds no regulatory enforcement forcing continuity. *Output:* Advise "Settle Now." The cooperation is likely bluffing; costs will spike in Phase 4 without gain. The checklist prevents hoping for a miracle that game theory says is impossible. It identifies that the surplus has likely been exhausted.
  2. **Three-Party Drag:** Municipality and Industry want to close; Enviro group refuses (Irrational Patience). Step 1 is Finite, but the Enviro group acts as if Iterated. Step 2 flags **Information Asymmetry**: we don't know their true payoff. Step 4 finds no enforcement on them. *Output:* Do not apply BI to the whole group. Use Step 2 Value Flag to extend talks only with the willing parties. Isolate the irrational actor. The procedure identifies that one player is breaking the game structure, so the game must be restructured around them. This prevents the rational parties from being held hostage by a player operating outside the model.
  3. **High Ecological Stakes:** Standard protocol applies (Finite/Transparent). Step 3 says "Settle Now" because the cleanup cost exceeds immediate benefit. However, Step 5 **Policy Override** activates because watershed collapse is irreversible. *Output:* Advise "Extend Talks." *Unwelcome Answer:* The team hates this because it admits economic inefficiency. The procedure forces you to write: "We are ignoring backward induction to prevent ecological loss." This transparency shields the team from accusations of incompetence later. It clarifies that this is a political choice, not a math error. You are buying time for nature, not profit. Document the specific ecological metric triggering the override to ensure accountability.

  - Limits and misfires (about 200 words):
  This procedure fails when utility functions are dynamic. If a party's goal changes mid-talk (e.g., political election shifts priorities), backward induction breaks. It also cannot measure reputation effects; a municipality might accept short-term loss for long-term trust, which looks irrational here but isn't. It struggles with hidden principals; if negotiators answer to unseen voters or donors, payoff transparency is impossible. Do not use this for high-conflict ideological disputes where "winning" outweighs settlement value. Finally, it cannot predict black swan events (new contamination data). In these hard cases, the checklist creates false confidence. Use it only for procedural stalemates, not fundamental value clashes. If parties lie about costs, Step 2 is useless. Crucially, it assumes rationality is the baseline deviation, but sometimes emotion is the baseline. If a negotiator is motivated by spite rather than utility, the model misfires.
