      *(Refining the "Division by Zero")*: This is the strongest philosophical point. If Hume thought laws were logically necessary, the friend is right. But Hume is a skeptic about induction. Laws are contingent. So the probability is never strictly zero. It is "as entire as any argument from experience can possibly be imagined." That phrasing is key. It allows for a non-zero (but tiny) probability.

