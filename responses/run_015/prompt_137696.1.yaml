      *(Refining the "Vanishing Miracle")*: I need to be precise. If two people report it, does it cease to be a miracle? Hume says "uniform experience against." If the experience is no longer uniform (because of the reports), does the definition fail? Hume distinguishes between *actual* uniformity of nature and *our experience* of it. The "proof" is based on *our* unbroken experience. Testimony attempts to break that. If testimony succeeds, the "proof" is downgraded to "probability." Hume's argument is that testimony *never* succeeds in downgrading the proof.

