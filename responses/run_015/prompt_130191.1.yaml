answer: |-
  ### Specifications for a Theory of Moral Revolution
  **Subject:** The Disappearance of Normative Institutions (e.g., Dueling, Slavery)
  **Context:** 19th-Century Transatlantic Shift
  **Constraint:** Moral change as "weather" (diffuse, environmental) rather than "syllogism" (logical, discrete).

  ---

  ### I. The Desiderata

  Any adequate theory must satisfy the following criteria to account for the historical record without reducing complexity to a single causal arrow.

  #### 1. The Tempo Variance Constraint
  *   **Definition:** The theory must explain why some normative shifts occur as sudden collapses (regime change, legal bans) while others manifest as slow institutional erosion (social stigma, generational fade-out).
  *   **Motivating Case:** Dueling laws existed for decades before the practice vanished; slavery was abolished legislatively in bursts, yet the *culture* of plantation hierarchy eroded unevenly across generations.
  *   **Classification:** **Non-Negotiable.** A theory that predicts only revolution or only evolution fails the historical data.

  #### 2. The Profit Paradox Constraint
  *   **Definition:** The theory must account for the simultaneous disappearance of practices with diametrically opposed economic utility within overlapping generations. It cannot rely on a unified "efficiency" metric.
  *   **Motivating Case:** Chattel slavery was an engine of immense capital accumulation; dueling was a net drain on human capital and offered no material return. Both vanished roughly concurrently in the West.
  *   **Classification:** **Non-Negotiable.** This eliminates pure Historical Materialism.

  #### 3. The Mechanism Distinction Constraint
  *   **Definition:** The theory must treat Moral Argument, Honor Codes, and Material Interest as distinct causal mechanisms that may align but are not reducible to one another. It must specify how they interact without collapsing one into the epiphenomenon of another.
  *   **Motivating Case:** Abolitionists used moral argument (slavery is sin); Southern duelists used honor (insult requires satisfaction); Industrialists used interest (wage labor is more flexible). A theory that claims honor was *just* a mask for interest fails to explain why men died for points of honor when living would have been more profitable.
  *   **Classification:** **Non-Negotiable.** This prevents mono-causal reductionism.

  #### 4. The Wardrobe Condition (Symbolic Obsolescence)
  *   **Definition:** The theory must allow for practices to become socially unintelligible or aesthetically ridiculous *before* they are successfully condemned as morally wrong. Moral language is often retrofitted to justify a shift in taste or symbolic utility.
  *   **Motivating Case:** The dueling pistol became a prop of the backward-looking gentleman before it was universally deemed murderous; the slaveholder's whip became a symbol of barbarism in urban drawing rooms before the economics of slavery fully collapsed. The practice looks *stupid* before it looks *evil*.
  *   **Classification:** **Non-Negotiable.** This addresses the novelist's observation of "changing costumes."

  #### 5. The Private Persistence Clause
  *   **Definition:** The theory must explain the lag between public normative collapse and private behavioral compliance. It must account for why banned practices migrate to the shadows rather than vanishing instantly.
  *   **Motivating Case:** Duels continued in secret long after they were socially frowned upon; coercive labor practices persisted under new names (sharecropping, penal leasing) after legal emancipation.
  *   **Classification:** **Camp Preference.** (Strict structuralists may argue the practice *is* the institution; culturalists argue the practice is the belief. A robust theory should accommodate this, but it is less critical than the mechanism distinction).

  #### 6. The Elite-Mass Divergence
  *   **Definition:** The theory must distinguish between the motivations of "moral entrepreneurs" (elites who signal change) and the mass adoption required to cement it.
  *   **Motivating Case:** Aristocrats abandoned dueling to distinguish themselves from the *nouveau riche* who were aping the style; urban elites abandoned slavery while rural masses depended on it.
  *   **Classification:** **Camp Preference.** (Some theories posit a trickle-down model; others posit a pressure-from-below model. The theory need not solve this, but must acknowledge the gap).

  ---

  ### II. Jointly Unsatisfiable Pairs

  A coherent theory cannot hold the following pairs of positions simultaneously. One must be discarded to satisfy the desiderata above.

  1.  **Rational Primacy + The Wardrobe Condition**
      *   *Conflict:* If moral argument (syllogism) is the primary driver of change, ethical condemnation must precede behavioral shift. The Wardrobe Condition dictates that symbolic/aesthetic failure precedes ethical condemnation.
      *   *Resolution:* Reject Rational Primacy. (Aligns with **Bernard Williams**' skepticism that ethical knowledge drives history).

  2.  **Material Primacy + The Profit Paradox Constraint**
      *   *Conflict:* If material interest is the primary driver, profitable institutions (slavery) should persist longer than unprofitable ones (dueling). The historical record shows them vanishing in the same window.
      *   *Resolution:* Reject Material Primacy. (Aligns with **Kwame Anthony Appiah**'s argument that honor, not profit, drove the end of dueling and slavery).

  ---

  ### III. Philosophical Situating

  *   **Bernard Williams:** His skepticism is required to satisfy **Desideratum 4 (Wardrobe Condition)** and **Desideratum 3 (Mechanism Distinction)**. Williams argues that moral philosophy often rationalizes what is already decided by psychology or culture. His framework prevents the theory from claiming that "we stopped because we realized it was wrong." Instead, "we realized it was wrong because we stopped."
  *   **Kwame Anthony Appiah:** His *Honor Code* thesis is the primary engine for **Desideratum 2 (Profit Paradox)** and **Desideratum 4**. Appiah provides the mechanism for how unprofitable practices (dueling) and profitable ones (slavery) can both fall: not through economic calculation or pure ethics, but through a restructuring of *respect*. When a practice becomes dishonorable rather than merely illegal, it collapses.

  ---

  ### IV. The Single Eliminating Requirement

  The requirement that eliminates the largest share of popular theories is:

  **The Wardrobe Condition (Desideratum 4): Symbolic Obsolescence Precedes Ethical Condemnation.**

  **Reasoning:**
  The dominant popular theory of moral progress is the **Enlightenment Narrative** (Rational Primacy). This narrative posits that humanity expands its circle of empathy through reason, discovers a moral truth (e.g., "slavery is a sin"), and subsequently alters behavior to match that truth. This assumes the sequence: *Argument → Conviction → Practice Change.*

  The Wardrobe Condition inverts this sequence to: *Practice Change (via aesthetics/status) → Conviction → Argument.*

  By demanding that the practice must first become *ridiculous* (a failure of style/symbolism) before it becomes *unthinkable* (a failure of ethics), this requirement eliminates:
  1.  **Religious/Moral Realism:** The idea that moral truth exists independently and is discovered.
  2.  **Liberal Rationalism:** The idea that public discourse and logic drive legislative change.
  3.  **Great Man Theory:** The idea that singular moral leaders (Wilberforce, Lincoln) drove change through oratory rather than riding a wave of shifting social taste.

  It forces the theory to acknowledge that morality is often the *post-hoc justification* for a shift in social aesthetics, aligning with your observation that change arrives like weather, not logic.
