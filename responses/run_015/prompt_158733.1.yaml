answer: |-
  # MORAL PSYCHOLOGY SEMINAR: HANDOUT 4
  ## Locating Yourself in the Guilt/Shame Debate

  **Instructions:** This is not a quiz. There are no correct answers. The goal is to help you locate your own intuitions within the philosophical landscape. Answer the questions based on your immediate reactions to concrete cases (e.g., breaking a promise, failing a task, being exposed as incompetent). Follow the arrows to find your "position label."

  ---

  ### PART 1: THE INDIVIDUAL LANDSCAPE
  *Where do you stand on the emotions themselves?*

  **START HERE:** Think of a time you did something wrong. The bad feeling arises.

  **1. WHO IS THE FEELING ADDRESSED TO?**
  *   **A.** It feels like I owe a **debt to a victim** or a rule I broke. The pressure is to settle the account. → *Go to Question 2A*
  *   **B.** It feels like I have lost **standing before witnesses** (real or imagined). The pressure is about my image or identity. → *Go to Question 2B*
  *   **C.** Honestly, they feel like the **same feeling** to me; the "who" doesn't change the sensation. → *Leaf: The Phenomenological Skeptic*

  **2A. (If Debt/Rule): HOW DOES THE FEELING END?**
  *   **A.** It vanishes completely once I **repair the harm** or apologize. The books are balanced. → *Go to Question 3A*
  *   **B.** Even after repair, I feel I need to **suffer or punish myself** to balance the scales. → *Go to Question 3A*

  **2B. (If Standing/Identity): HOW DOES THE FEELING END?**
  *   **A.** It ends only if I can **restore my reputation** or prove I am still good. → *Go to Question 3B*
  *   **B.** It ends by **withdrawing** or accepting that my status has permanently changed. → *Go to Question 3B*

  **3A. (From Debt Track): WHAT CAN TRIGGER THIS?**
  *   **A.** Only things I **chose to do**. If I didn't mean to, or couldn't help it, I might regret it, but I don't feel *this*. → *Go to Question 4*
  *   **B.** It can be triggered by **omissions or accidents** (things I failed to notice or control). → *Go to Question 4*

  **3B. (From Standing Track): WHAT CAN TRIGGER THIS?**
  *   **A.** Only things that reveal a **flaw in my character**. → *Go to Question 4*
  *   **B.** It can be triggered by **traits I didn't choose** (body, background, innate limits) or group identity. → *Go to Question 4*

  **4. IS THIS EMOTION WORTH KEEPING?**
  *   **A.** Yes, it is **essential** for morality. We should cultivate it. → *Go to Question 5*
  *   **B.** No, it is **toxic or useless**. We should replace it with something like "agent-regret" (sadness about the outcome without the self-sting). → *Leaf: The Replacement Theorist*

  **5. DO WE NEED THE OTHER EMOTION TOO?**
  *(If you started on the Debt Track, ask about Standing. If you started on Standing, ask about Debt.)*
  *   **A.** No. This one is **sufficient** on its own. The other is redundant or harmful. → *Leaf: The Primacy Advocate (Guilt or Shame)*
  *   **B.** Yes. We need **both**, but for different situations. → *Leaf: The Division of Labor Theorist*
  *   **C.** Yes. We need **both**, and they are deeply intertwined in every moral moment. → *Leaf: The Integrationist*
  *   **D.** Yes, specifically the "Standing" emotion needs to be **fixed/rehabilitated** to be useful, not just accepted as is. → *Leaf: The Shame Rehabilitator*

  ---

  #### 🛑 INSTRUCTOR NOTES: PART 1 LOGIC & FLAGS

  *   **Leaf: The Phenomenological Skeptic (Deflationary View).**
      *   *Philosophical Match:* D'Arms & Jacobson, or certain pragmatist readings.
      *   *Flag:* This leaf is distinct from the *Replacement Theorist*. The Skeptic says "They are the same thing." The Replacement Theorist says "They are bad things, use Regret instead."
  *   **Leaf: The Primacy Advocate.**
      *   *Philosophical Match:* Guilt-Primacy (Freud, Rawls); Shame-Primacy (Nussbaum, certain Virtue Ethicists).
      *   *Flag:* If a student answers "Debt Track" + "Essential" + "No Other Needed," they are Guilt-Primacy. If "Standing Track" + "Essential" + "No Other Needed," they are Shame-Primacy.
  *   **Leaf: The Shame Rehabilitator.**
      *   *Philosophical Match:* Mascolo, or contemporary Confucian readings.
      *   *Flag:* This is distinct from *Division of Labor*. The Labor theorist says "Use Shame for X, Guilt for Y." The Rehabilitator says "Shame is currently broken, but if fixed, it should do most of the work."
  *   **Leaf: The Replacement Theorist (Rejectionist).**
      *   *Philosophical Match:* Strawson (reactive attitudes modified), or certain Stoic readings.
      *   *Flag:* This path is available from both Tracks. It captures the view that "self-directed sting" is the problem, regardless of whether the focus is debt or standing.
  *   **⚠️ Indistinguishable Leaves Warning:**
      *   There is significant overlap between **The Division of Labor Theorist** and **The Integrationist**. In practice, many philosophers who claim to hold a "Division" view end up describing an "Integrated" psychology. If you land here, ask yourself: *Can I imagine a moral agent who has one of these emotions but literally cannot feel the other?* If no, you are likely an Integrationist.
  *   **⚠️ Incoherent Path Warning:**
      *   If you answered **Standing Track** (Shame) + **Ends by Repair** (like a debt) + **Only Voluntary Acts**.
      *   *Why:* This combination effectively turns Shame into Guilt. If the feeling is about standing, but it is fully reversible by action and limited to voluntary choices, it lacks the "status-altering" quality that defines shame in the literature. This combination is logically possible but philosophically unstable.

  ---

  ### PART 2: THE INSTITUTIONAL LANDSCAPE
  *Can a culture choose its moral ecology?*

  **START HERE:** Think about how laws, schools, or families punish wrongdoing.

  **1. HOW IS WRONGDOING FRAMED BY AUTHORITY?**
  *   **A.** As a **debt** to be paid (fines, community service, apology). → *Go to Question 2A*
  *   **B.** As a **stain** to be cleansed (exile, branding, public confession, honor codes). → *Go to Question 2B*

  **2A. (If Debt Frame): WHO ADMINISTERS THE SANCTION?**
  *   **A.** **Specialists** (judges, HR, administrators) who follow rules. → *Go to Question 3*
  *   **B.** **Peers** (neighbors, classmates, coworkers) who know you personally. → *Go to Question 3*

  **2B. (If Stain Frame): WHO ADMINISTERS THE SANCTION?**
  *   **A.** **Specialists** trying to mark status (e.g., a registry). → *Go to Question 3*
  *   **B.** **Peers** withdrawing regard (e.g., ostracism, gossip). → *Go to Question 3*

  **3. THE LEAKAGE TEST:**
  *Imagine the institution tries hard to stick to its frame (Debt or Stain).*
  *   **A.** It works. People feel the intended emotion (Guilt for Debt, Shame for Stain). → *Go to Question 4*
  *   **B.** It leaks. Debt-systems create Shame (stigma of being a criminal); Stain-systems create Guilt (private remorse). → *Leaf: The Leakage Realist*

  **4. DOES THE AGENT CARE ABOUT THE JUDGE?**
  *   **A.** Yes, the agent **identifies with the community** giving the sanction. → *Leaf: The Social Engineer (Steerable)*
  *   **B.** No, the agent is **alienated from the community**. The sanction creates resentment, not moral emotion. → *Leaf: The Identity Dependence Theorist*

  ---

  #### 🛑 INSTRUCTOR NOTES: PART 2 LOGIC & FLAGS

  *   **Leaf: The Social Engineer (Steerable).**
      *   *View:* Societies can deliberately design institutions to produce Guilt-cultures or Shame-cultures (e.g., restorative justice vs. honor codes).
      *   *Condition:* Requires answering "No Leakage" + "Identifies with Community."
  *   **Leaf: The Leakage Realist.**
      *   *View:* The mid-century anthropological contrast (Guilt Culture vs. Shame Culture) describes side-effects, not designs. You cannot build a pure Guilt institution because public punishment always creates stigma (Shame).
      *   *Condition:* Triggered by answering "It leaks" at Question 3.
  *   **Leaf: The Identity Dependence Theorist.**
      *   *View:* Institutions don't determine the emotion; the agent's prior relationship to the group does. A fine from a state you hate creates resentment, not guilt. A shunning from a group you don't care about creates annoyance, not shame.
      *   *Condition:* Triggered by answering "No" at Question 4.
  *   **⚠️ Unexplored Combination:**
      *   **Specialists administering Stain (2B-A) + No Leakage.**
      *   *Why:* Historically, status marks (brands, registries) are administered by authorities, but they rely on peer reaction to function as *shame*. If peers do not react, the specialist's mark is just data. This path suggests a "Bureaucratic Shame" that functions without social regard. This is largely unexplored in the literature, which assumes shame requires a social audience.
  *   **⚠️ Indistinguishable Leaves Warning:**
      *   **The Leakage Realist** and **The Identity Dependence Theorist** often converge on the same practical conclusion: *You cannot simply legislate a moral ecology.* The Realist says "Institutions spill over." The Identity Theorist says "Institutions bounce off." For the purpose of policy, these are functionally identical, even if the psychological mechanism differs.

  ---

  ### HOW TO USE THIS IN SEMINAR
  1.  **Silent Traversal:** Give students 10 minutes to trace the tree silently.
  2.  **Cluster:** Ask students to stand near the label they landed on.
  3.  **Interrogate the Flags:** Specifically ask the "Division of Labor" group if they can actually distinguish themselves from the "Integrationists." Ask the "Social Engineers" if they have an answer for the "Leakage Realists."
  4.  **Neutral Ground:** Remind them that landing on "The Phenomenological Skeptic" or "The Leakage Realist" is a valid philosophical outcome, not a failure to find a position. It suggests the map might be wrong, not the traveler.
