answer: |-
  ### Brainstorming: Sorting Demands on Knowledge-How

  (a) **Genuine Constraints:** The theory must distinguish skill from luck (fluke success), account for diachronic changes (learning/decay), and handle non-standard subjects (AI, infants, impaired experts) without category errors. It must specify the grain of the skill (contextual variance).
  (b) **Reflexes:** The demand that knowledge-how entails propositional knowledge is an intellectualist reflex; the demand that it entails current ability to perform is an anti-intellectualist reflex. Both may exclude valid cases for this paper's purpose.
  (c) **Ignored Deliverables:** Existing theories rarely specify the temporal profile of skill (acquisition/loss rates) or the requirements for interpersonal coordination in joint skills, focusing instead on static individual states.

  ***

  ### Desiderata for a Theory of Knowing-How

  1.  **Luck Exclusion:** The theory must distinguish reliable skill from a single fluke success that the agent could not repeat.
      *   *Case:* A novice randomly lands a rocket once.
      *   *Purpose:* Prevents attributing knowledge-how to accidental success.
      *   *Falsification:* A theory counts a one-off lucky success as knowing-how.
      *   *Status:* Non-negotiable.

  2.  **Instruction/Performance Gap:** The theory must distinguish memorising instructions from possessing the skill.
      *   *Case:* A novice reciting steps but failing to perform.
      *   *Purpose:* Ensures knowledge-how is not reduced to knowledge-that instructions exist.
      *   *Falsification:* A theory attributes knowledge-how to someone who cannot perform based solely on verbal recall.
      *   *Status:* Non-negotiable.

  3.  **Recognition Without Production:** The theory must allow knowledge-how where recognition survives the loss of motor ability.
      *   *Case:* An expert pianist with temporary hand paralysis.
      *   *Purpose:* Accommodates impaired experts who retain evaluative competence.
      *   *Falsification:* A theory denies knowledge-how solely due to temporary inability to move.
      *   *Status:* Negotiable (conflicts with strict ability views).

  4.  **Non-Linguistic Agency:** The theory must apply to subjects lacking propositional language.
      *   *Case:* A pre-linguistic infant pulling a latch.
      *   *Purpose:* Ensures the account does not over-intellectualise basic skill.
      *   *Falsification:* A theory requires linguistic articulation for any knowledge-how attribution.
      *   *Status:* Non-negotiable.

  5.  **Artifact Distinction:** The theory must distinguish agential skill from mere reliable function.
      *   *Case:* A chess engine versus a grandmaster.
      *   *Purpose:* Prevents categorising all reliable control policies as knowing-how.
      *   *Falsification:* A theory attributes knowledge-how to a thermostat or script lacking agency.
      *   *Status:* Non-negotiable.

  6.  **Diachronic Sensitivity:** The theory must track the gradual improvement of skill with practice and decay with disuse.
      *   *Case:* A student improving over semesters.
      *   *Purpose:* Captures the dynamic nature of skill acquisition ignored by static state analyses.
      *   *Falsification:* A theory treats knowledge-how as binary with no intermediate degrees of proficiency.
      *   *Status:* **Novel Requirement** (Literature ignores temporal profiles).

  7.  **Grain Specification:** The theory must define the object of knowledge-how and its contextual entailments.
      *   *Case:* Knowing how to ski versus skiing in deep powder.
      *   *Purpose:* Determines if knowledge-how is general or context-specific.
      *   *Falsification:* A theory fails to state whether knowing-how entails performance across variant conditions.
      *   *Status:* Non-negotiable.

  8.  **Dissociated Competence:** The theory must account for skills accessible only in altered states.
      *   *Case:* **Constructed:** A soldier who performs complex repairs under combat stress but cannot recall or perform them calmly.
      *   *Purpose:* Tests whether knowledge-how requires unified conscious access.
      *   *Falsification:* A theory denies knowledge-how because the agent cannot access the skill voluntarily in standard conditions.
      *   *Status:* Negotiable.

  9.  **Normative Correction:** The theory must explain the ability to correct errors in oneself or others.
      *   *Case:* A coach fixing a student's form.
      *   *Purpose:* Distinguishes skill from blind habit via normative guidance.
      *   *Falsification:* A theory cannot explain why some successful performances are still incorrect.
      *   *Status:* Non-negotiable.

  10. **Interpersonal Calibration:** The theory must explain how two agents coordinate a joint skill without shared propositions.
      *   *Case:* Two movers lifting a sofa synchronously.
      *   *Purpose:* Addresses joint action often overlooked in individualist epistemologies.
      *   *Falsification:* A theory cannot account for shared knowing-how without shared belief.
      *   *Status:* **Novel Requirement** (Literature focuses on individual states).

  11. **Transfer Capacity:** The theory must explain skill application in novel but related contexts.
      *   *Case:* A driver operating a rental car different from their own.
      *   *Purpose:* Ensures knowledge-how is not overly rigid or context-bound.
      *   *Falsification:* A theory implies knowing-how to drive car A does not entail knowing-how to drive car B.
      *   *Status:* Negotiable.

  12. **Failure Explanation:** The theory must allow agents to identify why a performance failed, not just that it failed.
      *   *Case:* A chef tasting a dish and identifying missing salt.
      *   *Purpose:* Distinguishes diagnostic skill from mere outcome recognition.
      *   *Falsification:* A theory treats all failed performances as epistemically identical for the agent.
      *   *Status:* Preference of anti-intellectualist camp.

  ***

  ### Tension and Exclusion Analysis

  **Tension Pair:** Entry 3 (Recognition Without Production) and Entry 1/5 (Luck/Artifact Distinction via Ability).
  **Argument:** If current ability to perform is not necessary (to save the apraxic expert), it becomes difficult to distinguish the expert from a mere theorist or a lucky observer, undermining the distinction between agency and artifact reliability.
  **Resolution:** For this paper's purpose (non-paradigmatic subjects), I abandon the strict necessity of current performance ability (Entry 3 wins).
  **Cost:** This weakens the barrier against intellectualism, requiring stronger criteria on normative correction (Entry 9) to distinguish the paralyzed expert from a mere philosopher of action.

  **Most Exclusionary Entry:** Entry 7 (Grain Specification). Most existing theories remain vague on whether knowledge-how is coarse-grained (skiing) or fine-grained (skiing in powder), causing them to fail when applied to specific contextual variations in non-paradigmatic subjects.
  **Most Prejudicial Entry:** Entry 4 (Non-Linguistic Agency) is often treated as a constraint, but the requirement that knowledge-how *must* be propositional (a reflex of Intellectualism) is the actual prejudice mistaken for a desideratum, falsely excluding infants and animals by definition.

  ***

  ### Theoretical Scoring

  | View | Score | Justification |
  | :--- | :--- | :--- |
  | **Intellectualism** | Partial | Fails non-linguistic cases; handles grain poorly; satisfies normativity. |
  | **Anti-Intellectualism** | Fails | Cannot accommodate recognition without production; struggles with artifact distinction. |
  | **Hybrid/Grasp** | Complete | Balances ability with understanding; handles diachronic and non-linguistic cases best. |
