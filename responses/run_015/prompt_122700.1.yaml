answer: |-
  **MEMORANDUM**

  **TO:** Design Review Board
  **FROM:** Staff
  **RE:** Recommendation on Downtown Signal Retiming Proposal (Intersections 1–9)
  **DATE:** October 26, 2023

  ### 1. Prediction and Dominant Rule

  **Prediction:** The Board should rule this proposal **Political**, requiring a public hearing.

  **Dominant Rule:** Based on the six precedents, the Board appears to operate under a **Foreclosure of Safe Access Test**. A design feature is political if it functionally prevents an identifiable class of residents from safely accessing a public good or using public infrastructure, *and* viable alternatives are not preserved.

  Under this rule, intent is irrelevant (Precedent 2: *Parkway Overpasses*), and routine policy allocation (Precedent 4: *Road Diet*) is only permissible if it burdens rather than forecloses access. The critical distinction lies between making a mode *less convenient* (Not Political) versus making it *impossible or dangerously exclusionary* (Political).

  **Application to Retiming:**
  1.  **Identifiable Class:** Residents over 70, disabled residents, children (those unable to maintain 4.0 ft/s).
  2.  **Foreclosure:** The removal of push-buttons eliminates the mechanism for accommodation. The model predicts 25% of crossings by seniors will result in conflict with traffic. This is not merely a delay; it is a safety foreclosure.
  3.  **Alternatives:** For five of the nine intersections, alternatives are physically prohibitive (steep grades/staircases). Unlike Precedent 5 (*Online Permits*), where in-person channels were retained, here the accommodation is removed.
  4.  **Enforcement:** The increased enforcement of crossing violations transforms a physical inability to comply into a legal liability, echoing Precedent 3 (*Smart Meters*) and Precedent 6 (*App Bins*), where the infrastructure creates a trap for non-compliance.

  ### 2. Alternative Rules and Analogies

  While the *Foreclosure of Safe Access Test* is the strongest fit, two other rules explain the precedents nearly as well but yield different predictions.

  **A. The "State Capacity & Conditionality" Rule**
  *   **Logic:** A feature is political if it grants the city new power over residents or makes access conditional on private resources (phones, data, physical ability).
  *   **Fits:** Precedent 3 (Meters/Shutoff), Precedent 6 (Bins/App), Precedent 1 (Shelter/Body).
  *   **Weakness:** It fits Precedent 2 (Overpasses) poorly, as the city didn't gain new power, it just built a low bridge.
  *   **Prediction for Retiming:** **Political.** It conditions safe crossing on physical speed (a private resource) and grants the city power to enforce timing via cameras/tickets.
  *   **Strongest Analog:** **Precedent 6 (App-Opened Bins).** Both make a public amenity conditional on a specific capacity (smartphone vs. walking speed). Both enumerate or expose the user to risk if they lack that capacity.

  **B. The "Routine Engineering vs. Policy Choice" Rule**
  *   **Logic:** Features are *not* political if they fall under standard transportation engineering optimization (throughput, emissions, grading), even if they have distributional effects. They are political only if they deviate from engineering norms to achieve social sorting.
  *   **Fits:** Precedent 4 (Road Diet), Precedent 5 (Online Permits/ Efficiency).
  *   **Weakness:** It contradicts Precedent 2 (Overpasses), where engineering reasons (grading) were explicitly rejected as a shield against political review.
  *   **Prediction for Retiming:** **Not Political.** The stated aims are throughput and emissions (state targets). The pedestrian impact is a modeled byproduct, not the goal.
  *   **Strongest Analog:** **Precedent 4 (Road Diet).** Both allocate finite street capacity (space vs. time) to prioritize vehicles/transit flow over individual convenience.

  **Why the Dominant Rule Prevails:**
  Precedent 2 (*Overpasses*) is the controlling authority here. In that ruling, the Board explicitly stated it did not need to decide *why* the clearance was chosen (engineering vs. exclusion); the *effect* (buses barred from the park) dictated the hearing. To rule *Not Political* now would require overturning Precedent 2, effectively granting engineers immunity whenever they cite "throughput" or "grading."

  ### 3. Underdetermination and Principles

  The precedents genuinely underdetermine this case on one specific axis: **The distinction between "Risk" and "Inconvenience."**

  Precedent 4 (*Road Diet*) established that losing parking (a burden) is not political. Precedent 1 (*Shelter*) established that losing the ability to sit (a safety/rest need) *is* political. The signal retiming sits between these: it creates a risk of injury, not a certainty.

  *   **If you rule Political:** You are adopting the principle that **Public Safety is a Component of Standing.** You are asserting that the right to use the street includes the right to do so without disproportionate risk of injury, and that "efficiency" cannot trade away the safety of vulnerable classes.
  *   **If you rule Not Political:** You are adopting the principle that **Time Allocation is Ordinary Policy.** You are asserting that signal timing is analogous to lane width (Precedent 4), and that pedestrians assume the risk of standard engineering intervals. This elevates "Traffic Flow" to a neutral good that supersedes specific accommodation.

  ### 4. The Distinguishing Case

  To cleanly separate the *Foreclosure of Safe Access Test* from the *Routine Engineering Test*, the Board should consider the following variant:

  **The Variant:** The city proposes the same 4.0 ft/s retiming and removal of push-buttons, **BUT** the five intersections with steep/staircase alternatives are retrofitted with ADA-compliant elevators and ramps, and the city suspends enforcement of crossing violations at these locations.

  *   **Under Foreclosure Test:** **Not Political.** Viable, safe alternatives are provided (aligning with Precedent 5: *Online Permits*). The access is burdened but not foreclosed.
  *   **Under State Capacity/Conditionality Test:** **Political.** The design still requires a specific physical capacity (speed) to use the direct route, stigmatizing those who must take the long way (aligning with Precedent 6: *App Bins*).
  *   **Under Routine Engineering Test:** **Not Political.** The engineering goal is met; mitigation is separate from the design.

  This variant isolates whether the Board cares about the *availability of an option* (Foreclosure) or the *equality of the experience* (Conditionality).

  ### 5. Reflection: Changing My Mind

  **What would lead me to recommend "Not Political"?**
  1.  **Federal Mandate:** If the 4.0 ft/s timing is required by new federal PROWAG standards and the 3.5 ft/s was a local deviation, the "Political" character diminishes. Compliance with higher-order law is often treated as non-discretionary (unlike the *Overpasses* where the ramp option was dropped as "too expensive").
  2.  **Alternative Viability:** If survey data shows the "steep grade/staircase" alternatives are actually ADA-compliant ramps that add less than 2 minutes to a trip, the "Foreclosure" argument collapses into the *Online Permits* precedent (alternatives exist).
  3.  **Risk Reality:** If the "25% in roadway" statistic is theoretical (based on walking speed models) rather than observed conflict data, and there is no history of accidents at these intersections, the "Safety" argument weakens. It becomes a *Road Diet* style burden (inconvenience) rather than a *Shelter* style exclusion (danger).

  **Where my reasoning is most likely to fail:**
  My reasoning relies heavily on Precedent 2 (*Overpasses*). However, Precedent 4 (*Road Diet*) is the more recent ruling. If the Board has subtly shifted toward deferring to Transportation Department expertise on "flow" issues, they may view *Overpasses* as a unique case of "destination access" (getting to the lake) rather than "corridor access" (crossing the street). If they view the street primarily as a conduit for vehicles where pedestrians are guests, the *Road Diet* logic swallows the *Overpasses* logic.

  Furthermore, my reasoning assumes "Safety" is intrinsic to "Standing." If the Board views Standing purely as "Legal Right to Access," they could argue pedestrians still have the right to cross, even if the design makes it risky. This is a fragile distinction, but it is the only legal off-ramp available to rule *Not Political* without contradicting Precedent 2 outright.

  **Recommendation:** Schedule for Public Hearing. The removal of accommodation mechanisms (buttons) combined with the lack of viable alternatives for critical rail crossings creates a patterned exclusion that mirrors the *Overpasses* and *App Bins* precedents, regardless of the emissions intent.
