answer: |-
  You are describing the breakdown of the "modular" view of the mind, specifically through the lens of **Predictive Processing** (often called the Bayesian Brain). In this framework, perception is not a bottom-up feed of raw data that gets labeled later; it is a top-down *controlled hallucination* that is constrained by sensory input. Your brain is constantly predicting what it expects to see/hear, and "perception" is just the prediction that survived contact with the retina/cochlea.

  When you learn, you aren't just adding labels to a database; you are updating the *priors* (the prediction weights) that generate the hallucination. This is why you can't "unsee" the warbler. Your brain is now predicting "warbler features" at a low level, effectively denoising the image before it reaches your conscious judgment.

  Here is the shape of the thing, the classification of your cases, and the term you asked for.

  ### 1. The Cluster Name
  The broad neighborhood is **Cognitive Penetration of Perception**, but that term is philosophically loaded and often contested. A more mechanistic description that fits your rationalist background is **Hierarchical Prior Updating**.

  However, your three cases are not the same phenomenon. They are happening at different depths of the processing hierarchy.

  *   **Case 1 (The Warbler/Radiology): Perceptual Learning.**
      This is low-level retuning. Your visual cortex has literally reweighted its feature detectors. The "blur" was high prediction error; the "crisp eye-ring" is a matched pattern. This is structural. It is irreversible on short timescales because it requires synaptic weight changes, not just belief updates. This is the strongest case for "seeing differently."
  *   **Case 2 (The Friend's Face): Affective Conditioning.**
      This is distinct. This isn't feature resolution; it's *valence tagging*. Your brain updated a somatic marker associated with that face. The reason it persisted after the belief correction is that propositional belief ("She is nice") updates faster than emotional priors ("This face signals threat"). This is **Affective Permeation**. It feels like perception because the "wrongness" is a sensory qualia (tension, micro-expression reading), but it's driven by the amygdala/limbic system, not the visual cortex's edge detectors.
  *   **Case 3 (The Provenance/Mimic): Semantic Framing.**
      This is the most controversial. The acoustics are identical, but the *meaning* alters the *experience*. In Predictive Processing terms, knowing the bird is a mimic changes the *precision weight* you assign to the signal. It becomes "less real" or "less significant" in your world-model, which dampens the sensory vividness.
  *   **Case 4 (The De-enrichment): Precision Weighting (Attentional Gating).**
      This is not a change in *what* you see, but *what you let through*. Experts learn to suppress prediction error from irrelevant sources (the background soundscape, normal tissue) to focus on the signal (the call, the tumor). This is **Inattentional Blindness** via expertise. It's a filter, not a lens.

  ### 2. Which Cases Belong Together?
  **Case 1 and Case 4 belong together.** They are both mechanisms of **Expertise**. One sharpens the signal (learning), the other suppresses the noise (attention). They are functional adaptations for efficiency.

  **Case 2 and Case 3 belong together.** They are both mechanisms of **Meaning**. They involve high-level semantic or emotional knowledge altering the qualitative feel of the input. Case 2 is emotional meaning; Case 3 is ontological/categorical meaning.

  The "interesting" one—the one that breaks the standard model of perception—is **Case 3**. Case 1 is accepted neuroscience (plasticity). Case 2 is accepted psychology (conditioning). Case 4 is accepted attentional theory. Case 3 is the one where philosophers fight, because it suggests that *abstract knowledge* (this bird is introduced) can change *sensory qualia* (the sound itself) without a mediating emotional response.

  ### 3. How to Tell "Seeing" from "Judging"
  You asked for a non-question-begging test. Introspection fails here (as you noted with the duck-rabbit). You need a psychophysical metric that bypasses conscious report.

  **The Dual-Task Interference Test:**
  Cognitive judgment requires working memory. Early perception does not.
  *   **Protocol:** Have the subject perform the task (e.g., distinguish the bird call) while simultaneously holding a 7-digit number in memory (cognitive load).
  *   **Result:** If the "provenance effect" (the sound feeling different) disappears or diminishes under load, it was **Judgment** (post-perceptual). If the effect persists despite the cognitive load, it is **Perception** (the prior is baked into the sensory model).

  **The Contrast Sensitivity Test:**
  *   **Protocol:** Measure the minimum signal strength required to detect the feature.
  *   **Result:** If knowing it's a warbler allows you to detect the eye-ring at a lower contrast threshold than a naive observer, that is **Perception**. Judgment cannot lower your contrast threshold; it can only guess better. If the expert literally sees signal where the novice sees noise, the hardware has changed.

  ### 4. The Coined Term: "Provenance Qualia"
  There is no standard term for the specific subset where *origin* or *category status* alters the sensory vividness (Case 3). "Cognitive Penetration" is too broad. "Aesthetic Perception" is too vague.

  I propose the term **Provenance Qualia**.

  **Definition:** A shift in the phenomenal character of a sensory experience caused solely by knowledge of the stimulus's history, origin, or ontological status, independent of physical changes to the stimulus or immediate emotional valence.

  **The Boundary Cases (Where it stops being Provenance Qualia):**
  *   **The Tweak:** If the change in experience is mediated by a *prediction of future utility*.
      *   *Instance:* You hear a bird call. You know it's a mimic. You stop listening because it's not "useful" for your life list.
      *   *Verdict:* This is **Attention**, not Provenance Qualia. The sound didn't change; you just looked away.
  *   **The Tweak:** If the change is mediated by *immediate emotional disgust*.
      *   *Instance:* You hear a bird call. You know it's an invasive species that kills natives. You feel anger. The sound feels "harsh."
      *   *Verdict:* This is **Affective Permeation** (Case 2). The qualia shift is driven by emotion, not ontology.
  *   **The True Instance:** You know it's a mimic. You feel no anger. It's not on your list anyway. But the sound itself feels "hollow" or "flat" compared to the real bird, even though the spectrogram is identical.
      *   *Verdict:* **Provenance Qualia.** The knowledge of "fakeness" directly dampens the sensory prediction error signal, making the experience less vivid.

  **Why this matters:**
  If Provenance Qualia exists, it means our "reality" is not just constructed by sensory input and immediate needs, but by our *narrative understanding* of the world's history. It implies that truth and falsity are not just properties of our propositions, but properties of our retina and cochlea.

  In your specific context: The warbler case is **Perceptual Learning** (hardware update). The friend's face is **Affective Conditioning** (emotional tag). The de-enrichment is **Attentional Gating** (filter). But the mimic case? That is **Provenance Qualia**. It is the only one where the *truth value* of a proposition seems to directly modulate the *brightness* of the experience.
