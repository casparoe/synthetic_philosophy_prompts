answer: |-
  # Taxonomy of Collective Memory Obligations

  **Root Question:** Does collective remembrance of a past wrong serve a moral purpose that outlives the direct victims?

  **Split 1 (Obligation Target):** Is the primary duty owed to **(A) The Victims**, **(B) Descendants of Perpetrators**, or **(C) Present Bystanders**?
  **Split 2 (Form):** Must remembrance be **(1) Institutional** (state-led) or **(2) Private/Familial**?
  **Split 3 (Active Forgetting):** Is deliberate suppression **(i) Never Permissible**, **(ii) Permissible after Reparations**, or **(iii) Permissible to Prevent Conflict**?

  *(Note: Not all Split 3 options are viable for every Split 1 target. The leaves below represent the coherent combinations.)*

  ### Leaf 1: Thick Institutional Remembrance
  *   **Path:** A (Victims) + 1 (Institutional) + i (Never Forget)
  *   **Defender:** Margalit-style Ethics of Memory
  *   **Awkward Commitment:** Requiring the state to fund monuments and holidays for victim groups that no longer have living descendants to advocate for them.

  ### Leaf 2: Familial Witness
  *   **Path:** A (Victims) + 2 (Private) + i (Never Forget)
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** Burdening grandchildren with trauma narratives they did not experience, potentially hindering their own psychological development.

  ### Leaf 3: Redemptive Closure
  *   **Path:** B (Perpetrators) + 1 (Institutional) + ii (After Reparations)
  *   **Defender:** Unnamed (Liberal Nationalism)
  *   **Awkward Commitment:** Officially declaring a historical debt "paid" via legislation while socioeconomic inequalities from that era persist unchanged.

  ### Leaf 4: Private Atonement
  *   **Path:** B (Perpetrators) + 2 (Private) + ii (After Reparations)
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** Allowing wealthy families to silence local history through private settlements while the public record remains scrubbed.

  ### Leaf 5: Preventive Pedagogy
  *   **Path:** C (Bystanders) + 1 (Institutional) + i (Never Forget)
  *   **Defender:** Unnamed ("Never Again" Doctrine)
  *   **Awkward Commitment:** Mandating school curricula that expose children to graphic atrocities they lack the emotional context to process.

  ### Leaf 6: Strategic Political Forgetting
  *   **Path:** C (Bystanders) + 1 (Institutional) + iii (To Prevent Conflict)
  *   **Defender:** Rieff-style Political Realism
  *   **Awkward Commitment:** Defending the removal of a memorial that survivors still visit because it provokes violence from a new generation.

  ### Leaf 7: Civil Vigilance
  *   **Path:** C (Bystanders) + 2 (Private) + i (Never Forget)
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** Relying on underfunded NGOs to preserve truth when the state actively ignores or distorts the historical record.

  ### Leaf 8: Social Harmony
  *   **Path:** C (Bystanders) + 2 (Private) + iii (To Prevent Conflict)
  *   **Defender:** Unnamed
  *   **Awkward Commitment:** Asking neighbors in a post-conflict zone to mutually agree to ignore past violence to keep the peace in shared spaces.

  ***

  ### Structural Notes

  **Unclean Separation:**
  **Leaf 1 (Thick Institutional Remembrance)** and **Leaf 5 (Preventive Pedagogy)** are practically indistinguishable. A state monument built to honor victims (Leaf 1) is almost always justified publicly as a tool to prevent future atrocities for bystanders (Leaf 5). It is difficult to audit whether the budget was allocated for dignity or for security.

  **Incoherent Empty Branch:**
  The combination of **Obligation to Victims (A)** + **Active Forgetting (ii or iii)** is structurally incoherent. If the moral obligation is grounded specifically in the dignity of the victim, deliberate forgetting constitutes a second harm. This branch is empty not because no one holds the view, but because the premise contradicts the obligation.
