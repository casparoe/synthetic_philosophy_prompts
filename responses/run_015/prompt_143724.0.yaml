  2.  **Analyze the Question & Expected Answers:**
      *   **Part (a) (5 marks):** Distinguish KK ($Kp \to KKp$) from Luminosity of Knowing ($Kp \to \text{PositionToKnow}(KKp)$).
          *   *Key distinction:* "Knowing" vs. "In a position to know" (P2K). KK requires actual knowledge iteration. Luminosity requires only P2K.
          *   *Entailment:* KK entails Luminosity of Knowing (since $Kq \to \text{P2K}q$). Luminosity does *not* entail KK (P2K does not imply K).
          *   *Student needs to identify:* The modal/epistemic strength difference (K vs P2K) and the direction of entailment.
