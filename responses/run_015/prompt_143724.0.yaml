          *   *Question:* Does anti-luminosity refute $KK_\delta$? Does it preserve the motivation?
          *   *Analysis:* $KK_\delta$ restricts the antecedent to cases where evidence is *well above* the threshold. Williamson's argument relies on a sorites series where margins shrink. If we fix $\delta$, can we construct a series where the margin stays $\ge \delta$ but the condition fails?
          *   *Standard Williamson View:* The anti-luminosity argument applies to *any* non-trivial condition. "Knowing with margin $\delta$" is a condition. Is it luminous? No. So there is a case where one knows with margin $\delta$ but isn't in P2K that one does.
          *   *Does this refute $KK_\delta$?* $KK_\delta$ says: If $Kp$ (margin $\ge \delta$) $\to K(Kp)$. Anti-luminosity says: If $Kp$ (margin $\ge \delta$) $\to \neg \text{P2K}(Kp \land \text{margin} \ge \delta)$.
