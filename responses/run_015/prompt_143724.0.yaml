          *   *Structure:* Reductio. Assume C is luminous and non-trivial. Construct sorites series $\alpha_0 \dots \alpha_n$. $\alpha_0$ is in C, $\alpha_n$ is not.
          *   *Key Premise:* Margin for Error Principle (MfE). If one knows (or is in P2K) one is in C at $\alpha_i$, then one is in C at $\alpha_{i+1}$ (sufficiently similar cases).
          *   *Induction:* Luminosity + MfE pushes C from $\alpha_0$ to $\alpha_n$. Contradiction with $\alpha_n$ being not-C.
          *   *Conclusion:* No non-trivial condition is luminous.
          *   *Student needs to identify:* The series construction, the reliance on similarity/margins, and the inductive step leading to contradiction.
      *   **Part (c) (4 marks):** Bridge to KK falsity.
          *   *Gap:* Anti-luminosity says $\neg \text{P2K}(KKp)$ in some cases where $Kp$. KK says $Kp \to KKp$. To get $\neg KK$, we need to move from $\neg \text{P2K}(KKp)$ to $\neg K(KKp)$.
          *   *Premise needed:* Factivity of "In a position to know" is *not* the right bridge. The bridge is usually: $Kq \to \text{P2K}q$ (Knowledge entails Position to Know). If Luminosity fails ($\exists \alpha: Kp \land \neg \text{P2K}(KKp)$), and we assume $K(KKp) \to \text{P2K}(KKp)$, then by modus tollens, $\neg K(KKp)$.
          *   *Wait, let's look closer:* The student argues we need "Factivity of being in a position to know".
          *   *Analysis:* If I am *not* in a position to know $q$, does it follow I do *not* know $q$? Yes, because $Kq \to \text{P2K}q$ (Knowledge requires being in a position to know). This is often called the "access principle" or simply a condition on knowledge.
          *   *Student's Claim:* "The premise needed is the factivity of being in a position to know: necessarily, if S is in a position to know that q, then q is true."
          *   *Critique:* This is wrong. Factivity of P2K ($\text{P2K}q \to q$) doesn't help move from $\neg \text{P2K}q$ to $\neg Kq$. We need the converse direction: $Kq \to \text{P2K}q$ (If you know, you are in a position to know). If the student claims we need Factivity of P2K to show that failing P2K implies failing K, that is a logical error. Factivity says P2K implies Truth. It doesn't say K implies P2K.
          *   *Actually, looking at the student's text:* "S's failure to be in a position to know that she knows that p is a failure to know that she knows that p... Could the defender of KK reject the premise? Not plausibly. Factivity is part of the point of the operator..."
