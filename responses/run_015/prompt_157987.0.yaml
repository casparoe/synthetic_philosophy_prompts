          *   *The Compression Problem Angle:* Compression limits the *expression* of virtue, not the existence of it. Practical wisdom isn't one big global blob; it's modular. You can have courage in one domain and patience in another.
          *   *Ontological vs. Epistemic:* Voss should argue it's epistemic regarding measurement, but ontological regarding the capacity. The agent still chooses to adhere to the protocol virtuously (e.g., integrity vs. mere compliance).
