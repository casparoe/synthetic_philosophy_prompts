          *   Dr. Reed: Situationist Psychologist (Expert). Needs to press whether the problem is ontological (traits don't exist) or epistemic (we just can't see them).
      *   **Tone/Style:** Short dialogue, actual argument (not talking past each other), no strawmen, expert-level discourse.
      *   **Constraint:** Begin with the dialogue itself. No preface, no commentary, no restating the question.

  2.  **Brainstorming Positions:**
      *   **Situationism (Reed):**
          *   *Core Claim:* Behavior is largely determined by situational factors, not stable character traits.
          *   *The Compression Problem Angle:* If environments are compressed (highly structured), they artificially suppress variance. But does this reveal the truth about traits (that they are fragile) or just hide them?
