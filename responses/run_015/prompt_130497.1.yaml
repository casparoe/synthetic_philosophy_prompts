  11. **Writing the Response:** (Focusing on clarity, tone, and strict adherence to the prompt's pedagogical constraints). *Self-correction:* Ensure the "Policy Design" explicitly asks them to choose which layer to sacrifice.

  12. **Final check on "Preference Topology":** Do not use this phrase until the debrief. Use "layers" or "cards" in instructions.

  13. **Final check on "Incentives":** Ensure the System is rewarded for *guessing* the hidden state. This is the key to making them act like an AI model trying to optimize for human feedback (RLHF).

