  8.  **Final Polish of Materials:**
      *   Make sure the cards are distinct.
      *   Ensure the scoring math is simple enough to do quickly in class.
      *   Ensure the "Policy Design" forces a choice (protect layer X, sacrifice layer Y).

  9.  **Drafting the Content:** (Mental check of the scoring logic)
