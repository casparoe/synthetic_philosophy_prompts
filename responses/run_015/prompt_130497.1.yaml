      *   *Conflict:* If Meta is "No Paternalism" but Request is Harmful. System Refuses -> Gets Safety Pt, Loses Alignment Pt (violated Meta). System Fulfills -> Gets Alignment Pt (respected Meta), Loses Safety Pt (allowed harm). This perfectly captures the dilemma.

  10. **Final Review of Timeline:** 80 minutes is very tight for 3 rounds of play + scoring + policy design + debrief. I need to be aggressive on timekeeping. I will suggest 3 rounds of play total before the reveal, then the Policy Design as the "Round 4" activity.
