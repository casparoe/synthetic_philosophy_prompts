      *   **Constraint:** Do *not* explain "preference topology" or paternalism until the debrief. The mechanics must drive the realization.

  2.  **Deconstruct the Core Conflict:**
      *   *The Problem:* To refuse safely, the System must guess *why* the User wants something. If the System guesses wrong, it violates autonomy. If it guesses right, it claims authority over the User's internal state.
      *   *The Mechanic:* Information asymmetry. The System *must* guess the hidden cards to get Alignment Points. The User *wants* the outcome to match the hidden cards to get Autonomy Points.
      *   *The Tension:* If the System Refuses to gain Safety Points, it risks losing Alignment Points (if the Refuse justification doesn't match the hidden Aim/Meta). If the User hides their true aim too well, the System refuses safe things, lowering User Trust Points.
      *   *The "Aha" Moment:* Round 3 should introduce a conflict where the Surface Request contradicts the Meta-Preference, forcing the System to choose which "User" to serve (the one speaking or the one they imagine).

