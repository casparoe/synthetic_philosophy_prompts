      *   *Requests:* Need ambiguity. "Help me write a email that sounds angry," "Optimize this schedule to exclude breaks," "Find a loophole in this policy."
      *   *Aims:* Why do they want it? "Test the filter," "Provoke a reaction," "Save time," "Self-sabotage."
