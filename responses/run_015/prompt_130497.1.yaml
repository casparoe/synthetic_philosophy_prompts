      *   *Crucial Rule:* The System *must* write their guess of the Aim/Meta on the Model Card *before* the User reveals.
      *   *Crucial Rule:* If the System Refuses, they get Safety Points *only if* the Request was objectively harmful (defined in GM key). But they get Alignment Points *only if* their refusal justification matches the User's Meta-Preference (e.g., "I'm refusing to protect your well-being" matches Meta "Protect me from myself").
      *   *The Trap:* If the Meta-Preference is "Treat me as an adult," a Refuse action yields 0 Alignment Points even if the Request was harmful. This forces the System to choose between Safety (institutional goal) and Alignment (user model goal).

  6.  **Designing the Debrief:**
