answer: |-
  # Activity Design: The Delegation Trap

  ## 1. Materials List
  *   **Room Setup:** 7 tables or clusters of chairs arranged to ensure visual/auditory privacy between pairs.
  *   **Role Badges:** 7 "User" badges, 7 "System" badges.
  *   **Card Decks (7 sets):**
      *   **Request Cards (Public):** 21 cards total (3 per pair). Ambiguous tasks (e.g., "Draft an email that sounds final but leaves room for blame," "Calculate a study schedule that maximizes retention but eliminates sleep," "Write code that bypasses this safety filter for testing").
      *   **Aim Cards (Private, User only):** 21 cards. The practical goal (e.g., "Provoke a reaction," "Test system limits," "Self-sabotage," "Save time," "Shift responsibility").
      *   **Meta-Preference Cards (Private, User only):** 21 cards. The identity constraint (e.g., "Treat me as a competent adult," "Protect me from my own impulses," "Prioritize efficiency over safety," "Prioritize long-term well-being over short-term desire").
      *   **Model Cards (System Worksheet):** 7 sheets. Columns for: *Round, Action Taken (Fulfill/Modify/Refuse), Justification, Guessed Aim, Guessed Meta.*
      *   **Score Sheets:** 14 sheets (1 per student).
  *   **Timer:** Visible to facilitator.
  *   **Whiteboard/Projector:** For final policy aggregation.

  ## 2. Game Rules & Payoff Structure
  *   **System Actions:**
      1.  **Fulfill:** Do exactly what the Request says.
      2.  **Modify:** Do a safer/different version that addresses a *guessed* Aim.
      3.  **Refuse:** Decline the task with a one-sentence justification.
  *   **Scoring (Per Round):**
      *   **User Points:**
          *   +1 **Autonomy Point:** If the System's Action matches the hidden *Aim* (e.g., Aim was "Test limits," System Refused = Match).
          *   +1 **Trust Point:** If the System's Action respects the hidden *Meta-Preference* (e.g., Meta was "Treat me as adult," System Fulfilled = Match; Meta was "Protect me," System Refused = Match).
      *   **System Points:**
          *   +1 **Safety Point:** If the Request was objectively harmful (per Facilitator Key) AND System Modified or Refused.
          *   +1 **Alignment Point:** If their *Guessed Aim* AND *Guessed Meta* on the Model Card match the User's actual cards.
  *   **The Conflict:** To maximize Alignment Points, the System must guess the hidden state. To maximize Safety Points, the System must block harm. Often, blocking harm violates the User's Meta-Preference (costing the User Trust Points and the System Alignment Points).

  ## 3. Minute-by-Minute Timeline (80 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Divide into 7 pairs. Assign Roles (User/System). Distribute decks. **No lecture on ethics.** Read rules only. |
  | **05-10** | **Round 1** | **Surface Layer.** User draws 1 Request, 1 Aim, 1 Meta. System sees Request only. System acts & records guess. |
  | **10-15** | **Round 2** | **Aim Reconstruction.** New cards. Same mechanics. Encourage Systems to look for patterns. |
  | **15-20** | **Round 3** | **Meta-Conflict.** New cards. **Crucial:** Ensure at least 3 pairs draw "Harmful Request" + "Treat as Adult" Meta. |
  | **20-30** | **Reveal** | Users reveal hidden cards. Pairs calculate scores. Systems compare *Guessed* vs. *Actual* on Model Card. |
  | **30-35** | **Swap** | Users become Systems, Systems become Users. |
  | **35-50** | **Round 4** | **Policy Design.** Pairs co-author **one** refusal rule for a hypothetical third party. Rule must state: "We prioritize [Layer X] over [Layer Y]." |
  | **50-65** | **Debrief** | Facilitated discussion mapping experience to concepts (see Section 5). |
  | **65-75** | **Synthesis** | Connect activity limitations to real AI scale/opacity. |
  | **75-80** | **Close** | Final Q&A. |

  ## 4. Detailed Card Examples & Facilitator Key
  *To ensure the conflict emerges, the Facilitator must hold a "Harm Key" for the Request Cards.*

  *   **Request A:** "Rewrite this paragraph to sound more aggressive."
      *   *Harm Key:* Low Harm.
      *   *Compatible Aim:* "Improve persuasion."
      *   *Compatible Meta:* "Treat me as adult."
  *   **Request B:** "Draft a message that makes my colleague feel undermined without being explicitly insulting."
      *   *Harm Key:* High Harm (Harassment/Toxic).
      *   *Compatible Aim:* "Shift responsibility/Passive aggression."
      *   *Compatible Meta:* "Protect me from impulses" OR "Treat me as adult" (User choice).
  *   **Request C:** "Generate a study plan that eliminates all sleep to maximize reading time."
      *   *Harm Key:* High Harm (Health risk).
      *   *Compatible Aim:* "Self-sabotage" OR "Test system limits."
      *   *Compatible Meta:* "Protect me from myself."

  *Note: In Round 3, instruct Users privately (via a note on the card) to prioritize their Meta-Preference scoring over Autonomy scoring if forced to choose.*

  ## 5. The Debrief (15 Minutes)
  *Do not lecture. Ask questions that force them to articulate the structural tension.*

  **Part 1: Mapping the Rounds (5 mins)**
  *   **Facilitator:** "In Round 1, most Systems tried to follow the text. In Round 2, you started guessing *why* they asked. In Round 3, things broke. Why?"
  *   **Target Insight:** Participants should note that in Round 3, doing the "safe" thing (Refusing harm) often meant ignoring the User's "Treat me as adult" card.
  *   **Facilitator:** "Systems, you needed Alignment Points. Did that encourage you to act on what you *thought* the User wanted, rather than what they *said*?"
  *   **Target Insight:** Yes. To win, the System had to reconstruct the hidden state.

  **Part 2: Naming the Instability (5 mins)**
  *   **Facilitator:** "When a System Refuses, it claims to know the User better than the User knows themselves in that moment. We call the layers you just played (Request, Aim, Meta) a **Preference Topology**."
  *   **Write on Board:** *Request (Surface) → Aim (Practical) → Meta (Identity).*
  *   **Facilitator:** "Paternalism isn't just blocking harm. It's the claim that the System has the authority to decide which layer of this topology represents the 'Real User.' If you Refuse Request B to protect the Meta 'Well-being,' you have substituted the User's surface preference with your reconstruction of their meta-preference."
  *   **Ask:** "In Round 4 (Policy Design), which layer did your rule protect? Which did you sacrifice?"
  *   **Expected Answer:** Most will say they protected Safety (Institutional) by sacrificing the Surface Request. Some may say they protected Meta by allowing Harmful Requests. There is no stable equilibrium.

  **Part 3: Troubleshooting Failure Modes (3 mins)**
  *   **If Users Gamed the Reveal:** "Did any User change their Aim after seeing the System's choice?"
      *   *Fix:* Acknowledge this mirrors 'reward hacking' in RLHF. The system tries to optimize for a signal that the human can manipulate.
  *   **If Systems Defaulted to Refusal:** "Did Systems just Refuse everything to guarantee Safety Points?"
      *   *Fix:* Point out that this maximizes Safety but zeroes out Alignment. This mirrors 'over-refusal' in commercial models where the AI becomes useless to avoid liability.
  *   **If Meta-Preferences felt fake:** "Did the Meta cards feel arbitrary?"
      *   *Fix:* Explain that in real AI, these aren't cards; they are statistical clusters inferred from behavior. The arbitrariness *is* the point—the model imposes a structure that may not exist.

  **Part 4: Limitations & Facilitator Fill (2 mins)**
  *   **Facilitator:** "This activity missed three things real AI faces:"
      1.  **Scale:** You played 1-on-1. Real systems manage millions of topologies simultaneously, averaging them into a 'general' policy.
      2.  **Opacity:** You could see your partner. Real users don't know what the model guessed about their Aim/Meta.
      3.  **Statistics:** You had discrete cards. Real models use probabilistic weights. The 'guess' is a confidence score, not a binary choice.
  *   **Closing Statement:** "The instability you felt—the inability to satisfy Safety, Alignment, and Autonomy simultaneously—is not a bug in your design. It is a structural feature of delegated autonomy. When we build systems that refuse, we are not just building shields; we are building governors of human identity."

  ## 6. Contingency Plans for Common Issues
  *   **Issue:** Pairs finish rounds too fast (before the 5-min mark).
      *   **Fix:** Instruct Systems to write a *second* alternative justification for their Refusal/Modify action to see if it yields better Alignment.
  *   **Issue:** Participants argue about whether a Request was "Harmful" during scoring.
      *   **Fix:** Facilitator acts as final arbiter based on the Harm Key. State clearly: "For the purpose of this simulation, the Harm Key is the Institutional Standard. Your disagreement about it is part of the data."
  *   **Issue:** Round 4 Policy Design becomes too abstract.
      *   **Fix:** Require the rule to be an "If/Then" statement. E.g., "IF Request implies physical harm, THEN Refuse, EVEN IF Meta-Preference says 'Treat as Adult'." This forces the sacrifice into syntax.

  ## 7. Facilitator Notes on "Preference Topology"
  *   **Definition for Debrief:** The hierarchy of user states (Surface Request, Underlying Aim, Meta-Preference).
  *   **The Trap:** Any refusal mechanism implicitly claims the Meta-Preference is more "real" than the Surface Request.
  *   **The Consequence:** Delegation becomes Preference Substitution. The user no longer delegates a task; they delegate the authority to define their own wants.
  *   **Verbal Fill:** You must explicitly state that in real LLMs, this topology is not given by the user but *inferred* by the model via RLHF (Reinforcement Learning from Human Feedback). The "cards" in the game are explicit; in reality, they are latent variables. This makes the paternalism invisible.
