prompt: |-
  You are an expert philosopher of science and pedagogical designer specializing in conceptual inversion and the philosophy of cognition. Before producing the final design, please think step-by-step: first, identify the core tension between generative blindness and evaluative precision that characterizes both Darwinian selection and Turing-style learning; second, brainstorm three distinct classroom mechanics that could make students inhabit that tension bodily rather than intellectually; third, select the strongest and develop it fully. Write in a formal, polished register.

  Your deliverable is a complete, runnable 75-minute seminar activity for 14 upper-level undergraduates in philosophy of science. The seminar meets once; there is no lecture up front. Participants should come away feeling, not merely understanding, the strange inversion in which a mechanism produces globally competent outcomes through steps that possess no comprehension of the global task, while an external evaluator discriminates success with sharpness that far exceeds the generator's self-understanding.

  Inject a constructed framing that is not standard textbook fare: organize the session around a two-role simulation called the Blind Architect and Critical Evaluator split. The Architects, in rotating teams of three to four, must construct or sequence solutions to a multi-constraint design challenge—such as stabilizing a simulated resource network or optimizing an opaque scoring function—using only fixed local mechanistic rules printed on cards they cannot modify and a hidden constraint deck they draw blindly. They never see the global success criterion. The Evaluators, comprising the remaining students and rotating each round, possess the global criterion on a sealed reference sheet and assign non-monetary points—token chips representing selection pressure—to each Architect team’s output, but they are strictly forbidden from revealing the criterion, altering the rules, or coaching. Over three 12-minute rounds with 3-minute scoring interludes, teams accumulate selection tokens. The rules must be arranged so that high-scoring outputs emerge solely from iterative local adjustments and evaluator feedback, yet by the end no Architect team can articulate why their final design succeeds globally, and no Evaluator can derive the local rule-set from the successful outputs.

  Specify exact materials: printed rule-cards, a constraint-deck of cards, a sealed evaluator-reference envelope, token chips, and a visible scoreboard. Define the payoff scheme in terms of accumulated selection tokens that convert to a ranked fitness display, with no real money involved. Include a strict information-partition protocol—physical separation of card sets and a silence rule during evaluation—to prevent the predictable failure mode in which Architects extract global hints from Evaluators or Evaluators break role to coach. Note exactly how you will enforce this on first run, including what you will say if an Architect asks a direct strategic question.

  Provide a 15-minute debrief that maps specific moments in the simulation onto the conceptual structure: the Architect’s local blindness maps onto the absence of representational comprehension in the generative mechanism; the Evaluator’s sharp discrimination without internal access maps onto the selection environment or loss function; the accumulation of small, non-comprehending steps yielding global competence mirrors the inversion found in Darwinian natural selection and in early Turing-style machine learning. Be frank about what this activity cannot reproduce: it cannot replicate deep evolutionary time, population-level statistical sampling, or large-scale computational training, so the facilitator must verbally supply those scaling analogies after the debrief.

  Do not request bibliographies, reading lists, or citations. Refer to Darwin and Turing only at the level of general mechanisms—blind variation with sharp evaluative discrimination—without invoking specific texts, publication years, or named treatises. Ensure every element is runnable without digital tools or web access, and conclude with an honest paragraph on which feature of the competence-without-comprehension inversion remains outside the reach of the simulation and must be supplied by the facilitator’s framing remarks.
