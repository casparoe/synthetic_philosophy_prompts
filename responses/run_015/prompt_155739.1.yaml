prompt: |-
  I'm giving a seminar thursday defending a coalitional reading of Kant's universalizability tests — treating maxims like social contracts that collapse if a sub-coalition can deviate for gain — to a room of mostly analyitic Kantians plus one game theorist who thinks I'm smuggling decision theory into the Groundwork. Prep me for the objections in roughly the order they'll hit, phrased the way they'd say it: the contradiction-in-conception objection, the charge that strategic stability isn't moral universalization, the worry that I'm just doing Rawls with extra steps. For each, what should I concede up front, what reply actually lands, and where that reply is weakest. Also tell me the one question I'm hoping nobody asks — probably something about the Formula of Humanity — and draft a 90-second defense for it just in case.
reasoning: |-
  Here's a thinking process that leads to the suggested preparation:

  1.  **Analyze the Request:**
      *   **Topic:** Defending a coalitional reading of Kant's universalizability tests (Categorical Imperative, specifically Universal Law formulation).
      *   **Core Idea:** Treat maxims like social contracts that collapse if a sub-coalition can deviate for gain (game-theoretic stability).
      *   **Audience:** Mostly analytic Kantians + one skeptical game theorist.
      *   **Task:** Prepare for objections in a specific order (Contradiction-in-Conception, Strategic Stability vs. Moral Universalization, Rawlsianism), providing concessions, strong replies, and weak points for each.
      *   **Bonus:** Identify the "nightmare question" (likely Formula of Humanity) and draft a 90-second defense.
      *   **Tone:** Academic, sharp, anticipatory, phrased as the objectors would speak.

  2.  **Deconstruct the Core Argument:**
      *   The user is proposing a *contractualist/game-theoretic* interpretation of Kant's *Formula of Universal Law* (FUL).
      *   Standard Kantian view: Universalization is a test of rational consistency (logical or volitional), not empirical stability or payoff maximization.
      *   User's view: Universalization is about coalition stability. If a subset of agents can break the rule and gain, the rule fails.
      *   Risk: This looks like Rule Utilitarianism or Hobbesian Contractarianism disguised as Kant.

  3.  **Drafting Objection 1: Contradiction-in-Conception (CIC)**
      *   *The Objector:* Strict Analytic Kantian.
      *   *The Charge:* You're confusing logical/volitional contradiction with empirical instability. Kant talks about a world where the maxim *becomes* a law of nature, not a world where people *strategize* around it.
      *   *Concession:* Admit Kant doesn't use game-theoretic language.
      *   *Reply:* Argue that "cannot will" implies "cannot sustain." A system where deviation is profitable is a system the rational agent *cannot* will to persist.
      *   *Weakness:* Kant's examples (suicide, false promising) don't always fit payoff matrices neatly.

  4.  **Drafting Objection 2: Strategic Stability vs. Moral Universalization**
      *   *The Objector:* The Game Theorist (and suspicious Kantians).
      *   *The Charge:* You're smuggling decision theory into the *Groundwork*. Stability $\neq$ Morality. A stable equilibrium can be evil (e.g., a stable caste system).
      *   *Concession:* Stability alone isn't sufficient for morality.
      *   *Reply:* It's not *any* stability, it's stability under *universal* rational agency. The "gain" isn't just utility, it's the coherence of agency itself.
      *   *Weakness:* Defining "gain" without slipping into consequentialism is hard.

  5.  **Drafting Objection 3: Rawls with Extra Steps**
      *   *The Objector:* Political Philosopher / Kantian hybrid.
      *   *The Charge:* This is just Scanlonian contractualism or Rawlsian original position stuff applied to individual maxims. Why call it Kant?
      *   *Concession:* There are structural similarities to contractualism.
      *   *Reply:* Rawls/Scanlon focus on *justification to others*. This focuses on the *internal consistency of the will* when projected universally. It's first-personal rationality, not interpersonal agreement.
      *   *Weakness:* The distinction between "justification to others" and "universal projection" is thin.

  6.  **Identifying the "Nightmare Question": Formula of Humanity (FH)**
      *   *Why:* The coalitional reading treats agents as players in a system. FH treats them as ends in themselves. If the coalition sacrifices a minority for the stability of the majority, does it pass the test?
      *   *The Question:* "If a maxim is coalition-stable but treats a subset of agents as mere means to maintain that stability, how does your reading satisfy the Formula of Humanity?"
      *   *Drafting the Defense:* Need to link coalition stability to the preservation of agency. If you treat someone as a mere means, you undermine the very rational agency required for the coalition to exist. Stability *requires* respecting humanity.

  7.  **Refining the Tone:**
      *   Make the objections sound like specific academic archetypes (The Textual Purist, The Formalist, The Political Theorist).
      *   Keep the advice punchy and strategic.
      *   Ensure the "Weakness" sections are honest vulnerabilities.

  8.  **Review and Polish:**
      *   Check timing (90-second defense).
      *   Ensure the distinction between "coalition" and "universal law" is clear.
      *   *Self-Correction during drafting:* Make sure I don't give the user *too* much ammo to sound like a utilitarian. The reply needs to stay grounded in *rational willing*.

  9.  **Final Output Generation:** (Proceeding to generate response based on these thoughts.)
answer: |-
  Here is your battle plan for Thursday. The room is split between textual purists and a formalist skeptic. Your position is provocative because it translates a deontological test into a stability condition. They will smell consequentialism and Hobbesianism immediately.

  Here are the three waves of objections, phrased as they will ask them, with your strategic responses.

  ### Objection 1: The Contradiction-in-Conception Charge
  **Who:** The Senior Analytic Kantian (Textual Purist)
  **The Phrasing:** "Kant distinguishes between contradictions in conception (logical impossibility) and contradictions in the will (volitional impossibility). Your coalitional reading turns both into empirical instability. You're saying the maxim fails because the system *crashes*, not because it's *irrational*. Are you not reducing the Categorical Imperative to a prediction about social equilibrium?"

  *   **Concede Up Front:** "You're right that Kant doesn't use the language of equilibrium or crash conditions. I am not claiming Kant was a game theorist."
  *   **The Reply That Lands:** "But I am claiming that what Kant identifies as a 'contradiction' is structurally identical to a coalition deviation. When Kant says a false promise cannot be *conceived* as a universal law, he means the institution of promising dissolves. That dissolution occurs precisely because a sub-coalition (the promisors) deviates to gain an advantage that relies on the compliance of others. The 'contradiction' is the instability of the practice under universal rational agency."
  *   **Where It's Weakest:** Kant's examples of perfect duties (e.g., suicide) don't fit the "sub-coalition deviation" model well. Suicide isn't a multiplayer game. If they press on the *First Example* (suicide), your coalitional model looks forced.

  ### Objection 2: Strategic Stability $\neq$ Moral Universalization
  **Who:** The Game Theorist (The Skeptic)
  **The Phrasing:** "You're smuggling decision theory into the *Groundwork*. A Nash equilibrium is stable, but it isn't necessarily moral. A stable caste system or a mafia code of silence can be coalition-proof. If your test only checks for deviation incentives, you've built a Rule Utilitarian or Hobbesian test, not a Kantian one. Where is the *obligation*?"

  *   **Concede Up Front:** "I concede that stability alone is not sufficient for morality. A stable equilibrium can be unjust."
  *   **The Reply That Lands:** "But my reading isn't about *any* stability. It's about stability under the condition of *universal rational agency*. The 'gain' from deviation isn't utility; it's the preservation of the agent's own status as a lawgiver. A mafia code fails because it relies on treating some members as mere tools for the boss's end. My reading requires that the coalition be composed of co-legislators. If the deviation undermines the legislative status of any member, the maxim fails."
  *   **Where It's Weakest:** You are walking a tightrope. If "legislative status" is the constraint, you're admitting the game theory is just window dressing for a prior moral assumption. They will press you on whether the game theory does any *work* or just illustrates the point.

  ### Objection 3: Rawls with Extra Steps
  **Who:** The Political Kantian
  **The Phrasing:** "This sounds like Scanlonian contractualism or Rawls' Original Position applied to individual maxims. You're saying a maxim is valid if no sub-group could reasonably reject it to form a better coalition. Why call this Kant? Why not just admit you're doing contractualism?"

  *   **Concede Up Front:** "There is a clear family resemblance to contractualism, particularly in the focus on rejectability."
  *   **The Reply That Lands:** "The difference is the locus of authority. Rawls and Scanlon focus on *justification to others*. My reading focuses on the *internal consistency of the will* when projected universally. The coalition doesn't meet to agree; the agent tests whether their will can sustain itself as a universal law without generating a defection incentive. It's first-personal rationality, not interpersonal agreement."
  *   **Where It's Weakest:** The distinction between "what I can will universally" and "what no one could reasonably reject" is notoriously thin. If they press on the *source* of the normativity, you might have to admit they are functionally equivalent in practice.

  ***

  ### The Nightmare Question
  **The Question:** "If a maxim is coalition-stable but treats a subset of agents as mere means to maintain that stability, how does your reading satisfy the **Formula of Humanity**?"

  *Why this hurts:* Your coalitional reading risks treating agents as players in a system. If the system is stable because a minority is exploited (and that minority lacks the power to deviate/defect), your test might pass a maxim that violates human dignity.

  ### The 90-Second Defense
  **Strategy:** Do not try to derive Humanity from Universal Law (Kant scholars fight over whether the formulas are equivalent). Instead, argue that *true* coalition stability is impossible without respecting Humanity.

  **Draft:**
  "That is the critical tension, and here is the resolution. In my reading, a 'coalition' isn't just a group of bodies; it is a union of *rational wills*. If a maxim treats a subset of agents as mere means, it necessarily degrades their capacity for rational agency.

  But if their agency is degraded, they cannot function as co-legislators in the universal law. They become objects, not players. A system built on objects is not a universal law of *freedom*; it is a law of *nature* imposed upon them.

  Therefore, a maxim that violates the Formula of Humanity creates a hidden instability: it relies on the agency of the exploited to sustain the system, while simultaneously denying that agency. This generates a volitional contradiction. The system is not truly coalition-stable because it requires the exploited to will their own diminishment, which a rational agent cannot do. So, the Formula of Humanity isn't an add-on; it is the condition for the possibility of the stable coalition itself."

  **(Time check: ~85 seconds spoken at a measured pace.)**

  ### Final Tactical Advice
  1.  **Don't fight the Game Theorist alone.** If the Game Theorist attacks, look to the Kantians. Frame the game theory as a *heuristic* for understanding "contradiction," not a replacement for it.
  2.  **Watch the word "Gain."** Whenever you say "gain," a Kantian hears "inclination." Use phrases like "rational advantage" or "preservation of agency" instead.
  3.  **Own the Revisionism.** Don't pretend this is what Kant *meant* in 1785. Argue this is what the argument *requires* to work.

  Good luck. Hold the line on rational agency.
