answer: |-
  The institutional asymmetry you describe presupposes a **dualist epistemology of evidence**, rooted in a distinction between *testimonial knowledge* (mediated by intentional agents) and *causal knowledge* (mediated by physical processes). This division is not strictly entailed by the ontology of texts versus artifacts; rather, it is a disciplinary convention inherited from 19th-century German distinctions between *Geisteswissenschaften* (human sciences) and *Naturwissenschaften* (natural sciences).

  Below is a reconstruction of this implicit theory, an analysis of its contingency, and a proposal for a unified epistemological framework.

  ### 1. The Implicit Theory: Testimony vs. Causal Residue

  The current asymmetry rests on two distinct epistemic models:

  *   **The Textual Model (Testimonial Epistemology):** Texts are treated as assertions made by an agent. Knowledge is transmitted via communication. The primary epistemic risk is *deception* (lying, propaganda, memory failure). Therefore, the method is *critique*: establishing the reliability of the witness. The text is guilty until proven innocent.
  *   **The Material Model (Causal/Positivist Epistemology):** Artifacts are treated as effects of physical causes. Knowledge is reconstructed via natural law (e.g., radioactive decay, stratigraphy). The primary epistemic risk is *noise* (contamination, measurement error). Therefore, the method is *calibration*: refining the instrument. The artifact is innocent until proven disturbed.

  **The Philosophical Commitment:** This presupposes that **intentionality introduces epistemic volatility, while causality introduces epistemic stability.** It assumes that because a pot sherd cannot "lie," it offers a more direct constraint on reality than a manuscript that can. This grants material traces a "default epistemic privilege," treating them as the "hard data" against which the "soft narratives" of texts are checked.

  ### 2. Is the Asymmetry Entailed or Conventional?

  The asymmetry is **conventional, not entailed.** It relies on a "Myth of the Given" regarding material culture.

  *   **Artifacts as Testimony:** A radiocarbon date is not a raw fact of nature; it is a claim produced by a chain of human practices (excavation, sampling, chemical pretreatment, calibration). The "speaker" is not the bone, but the laboratory protocol. If the excavator selectively samples a layer to confirm a hypothesis, the C14 date is as biased as Herodotus omitting a defeat. The material record is "theory-laden" at every stage of extraction.
  *   **Texts as Causal Traces:** Conversely, a text is a physical object subject to causal laws. The survival of a manuscript, the ink composition, and the scribal errors are material traces subject to the same kind of forensic analysis as pottery. Furthermore, authors are constrained by reality; Thucydides could not invent a plague that did not happen without risking immediate contradiction by survivors. Texts are also causal residues of events.

  **Rival Epistemologies:** Post-processual archaeology (since the 1980s) has long argued that material culture is symbolic and communicative (i.e., text-like). Conversely, the "material turn" in history treats books as artifacts. The institutional asymmetry persists not because of logical necessity, but because of departmental silos that protect distinct methodological identities.

  ### 3. A Uniform Critical Framework: Inference to the Best Explanation (IBE)

  One can consistently apply a uniform framework without collapsing into global skepticism by adopting **Inference to the Best Explanation (IBE)** as the universal engine of historical knowledge.

  In this model, both a radiocarbon date and a passage in Herodotus are **traces** that require a **generative model** to explain their existence.

  *   **Treating C14 as Testimony:** We treat a date as a claim: *"This sample died X years ago."* We interrogate the "witness" (the lab): What is the margin of error? Was the context secure? Is there a reservoir effect? We apply "source criticism" to the lab report just as we do to a manuscript.
  *   **Treating Herodotus with Hermeneutic Charity:** Instead of starting with suspicion, we treat the text as a coherent system. We assume the author is making a rational argument within their cultural context (charity) and look for internal consistency (stratigraphy of the narrative). We ask not "Is he lying?" but "What causal conditions produced this specific narrative structure?"

  **Avoiding Skepticism:** This does not lead to skepticism because IBE is comparative. We do not need absolute certainty; we need the explanation that best accounts for *all* traces (textual and material) with the fewest ad hoc assumptions. If the textual record says "City A burned in 480 BCE" and the stratigraphic record shows a destruction layer with pottery consistent with 480 BCE, the convergence of independent traces warrants belief, even if neither trace is infallible.

  ### 4. Concrete Changes in Training and Curation

  Replacing the dualist model with a unified trace-based epistemology would require significant structural shifts.

  #### A. University Curricula
  1.  **Unified Methods Courses:** History and Archaeology departments would co-teach "Epistemology of Traces." Students would learn that statistical error in dating is analogous to transmission error in manuscripts.
  2.  **Science Literacy for Historians:** Historians would be trained to read lab reports not as "facts" but as arguments, understanding calibration curves and taphonomy well enough to critique archaeological claims.
  3.  **Hermeneutics for Archaeologists:** Archaeologists would be trained in narrative theory and philology to recognize how their own excavation reports construct stories, acknowledging the "authorial voice" of the principal investigator.
  4.  **Bayesian Modeling:** Both disciplines would move toward Bayesian chronological modeling, which explicitly combines prior beliefs (textual dates) with new data (radiometric dates) to produce probabilistic outcomes, making the weighting of evidence transparent.

  #### B. Museum Exhibitions and Labels
  1.  **Provenance of Interpretation:** Labels would not state "This is a warrior's grave, 500 BCE." They would state: *"Interpreted as a warrior's grave based on weapon placement; dated to 500 BCE via C13 analysis (±40 years). Alternative interpretation: ritual deposit."*
  2.  **Visualizing the Chain of Inference:** Exhibitions would display the "gap" between the trace and the conclusion. A timeline would show confidence intervals rather than solid lines. Textual claims would be color-coded by reliability (e.g., contemporary inscription vs. later copy).
  3.  **The "Author" of the Display:** Museums would acknowledge the curatorial narrative as a constructed testimony. Just as we label the artist of a painting, we would label the "archaeological author" whose synthesis created the reconstruction, acknowledging that a different synthesis of the same shards is possible.
  4.  **Conflict as Feature:** Instead of smoothing over contradictions between text and artifact, exhibitions would highlight them as sites of active inquiry. A label might read: *"Herodotus claims X, but soil chemistry suggests Y. Historians debate whether the text is symbolic or the soil is disturbed."*

  ### Conclusion

  The asymmetry between history and archaeology is a **methodological artifact**, not an ontological necessity. It protects the authority of scientific data by shielding it from the hermeneutic suspicion applied to texts. By recognizing that **all evidence of the past is a trace requiring a model to become intelligible**, we can democratize the skepticism. This does not weaken our knowledge of antiquity; it strengthens it by making the probabilistic nature of that knowledge explicit, moving from a posture of *authentication* to one of *warranted assertibility*.
