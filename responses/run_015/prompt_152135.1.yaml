      *   *Section 2 (Leo's Test):* Address institutional inertia. Show why first-order continuity doesn't negate second-order change. Critique the counterfactual test's applicability to epistemic shifts.
      *   *Section 3 (Verdict):* Declare a winner (leaning Maya on ontology, Leo on sociology) but define the "missing" synthesis (periods as emergent properties of reflexive systems).

  8.  **Refining the Philosophy:**
      *   Use terms like "ontological status," "constitutive rules," "regulative rules," "self-fulfilling prophecy," "natural kind vs. institutional fact."
      *   Ensure the distinction between *first-order* (doing the science) and *second-order* (defining what counts as science) is central.
      *   Make sure not to "split the difference" (e.g., "both are partly right"). Instead, argue that one framework captures the *ontology of historical time* better than the other, while acknowledging specific blind spots. *Decision:* Maya is fundamentally more correct about what makes a period *historically real* (the shift in meaning), whereas Leo describes *structural drag*. The ontology of history favors meaning-making over structural stasis.

  9.  **Final Review against Constraints:**
