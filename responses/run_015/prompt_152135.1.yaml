  10. **Final Polish:** Check tone (professional philosopher). Ensure clarity on "reflexive anachronism." (Self-correction: Ensure I explain *why* reflexive anachronism isn't circular—it's an empirical claim about speech acts, not a definitional stipulation).

  *(Self-Correction during drafting)*: I need to be careful not to dismiss Leo entirely. His counterfactual test is a strong tool for *causal* history, even if it fails for *conceptual* history. I should note that limitation. Also, ensure I address the Scientific Revolution specifically, not just the Renaissance.

