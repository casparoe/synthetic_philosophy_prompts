      *   **Situation:** Legacy system (Beast) merging into New System. Beast docs missing, creators gone, vendor restricted (query access only, no logs/internals).
      *   **Conflict:** User vs. Colleague. User thinks some entities are artifacts/ways of talking. Colleague thinks you can't know without internal logs (verificationist/agnostic stance).
      *   **Task:** Write a set of *desiderata* (requirements) for a method to identify a system's ontology under these constraints.
      *   **Specific Constraints:**
          *   Must address specific philosophical arguments (orphan predicates, dormant vs. dead, existence vs. missing evidence, settling conditions, granularity, identity criteria, access profiles).
          *   Must flag non-negotiable vs. camp-specific (verificationist) requirements.
          *   Must distinguish between *migration/compliance* purpose vs. *descriptive* purpose.
          *   Must identify the "killer requirement" that knocks out tempting approaches.
          *   Must include a short scorecard of three specific approaches (Accessible Only, Best Explanation, Domain Quantification).
          *   No bibliographies/citations.
          *   Tone: Professional, philosophical but grounded in the specific technical context (schemas, logs, migration).

  2.  **Deconstruct the Philosophical Core:**
      *   The core tension is *Realism vs. Instrumentalism* in the context of *Epistemic Opacity*.
      *   The User leans towards Instrumentalism/Pragmatism (if it doesn't affect outputs, it's not a "thing").
      *   The Colleague leans towards Verificationism/Strict Empiricism (if we can't verify it via logs, we can't claim it doesn't exist).
      *   The Goal is *Actionable Ontology* for Migration. This shifts the metaphysics from "What is true?" to "What must we treat as true to avoid breaking things or lying to auditors?"

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Orphan Predicates:* If a field never changes output, does it exist?
          *   *Requirement:* The method must distinguish between *causally inert* and *causally opaque*.
          *   *Verdict:* "Delete it" is an action, not an ontological verdict. The verdict is "Epistemically Indistinguishable from Artifact."

      *   *Dormant vs. Dead:* Would it matter if we had logs?
          *   *Requirement:* Counterfactual Sensitivity.
          *   *Tension:* We can't know the counterfactual.
          *   *Resolution:* Classify based on *structural necessity* vs. *contingent silence*.

      *   *Existence vs. Missing Evidence:* (The user's specific worry about incompatible requirements).
          *   *Requirement:* Burden of Proof Allocation.
          *   *Resolution:* You can't have "Don't assume non-existence" AND "Don't assume existence." One must yield based on *risk*. For migration, risk of data loss > risk of data clutter.

      *   *Settling Conditions:* Do we need to know *what* would prove it?
