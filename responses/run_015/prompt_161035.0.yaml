  10. **Final Polish:** Ensure the distinction between "The Beast's Ontology" (what the code thinks) and "The Domain's Ontology" (what the business is) is clear, as the migration is bridging these.

  *(Self-Correction on the "Transitivity" point)*: The user suspects Pairwise + Transitive + Borderline is unsatisfiable. This is mathematically true (Poincaré's continuum). I need to confirm this is a real tension and the method must break one link (usually transitivity).

  *(Self-Correction on "Verificationist Prejudice")*: The colleague says "You can't know that." This is the prejudice. I need to label the requirement that demands "Agnosticism" as the Verificationist one.

