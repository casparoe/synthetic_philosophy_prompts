          *   *Tension:* Pairwise + Transitive + Borderline = Contradiction (Sorites paradox style).
          *   *Resolution:* Identity must be a *deliverable* constrained by business rules, not discovered purely from data.

      *   *Access Profiles:* Bug or Feature?
