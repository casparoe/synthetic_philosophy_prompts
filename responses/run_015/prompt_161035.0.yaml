          2.  Core Desiderata (The List).
          3.  The Tension (Existence vs. Evidence).
          4.  Purpose Shift (Migration vs. Description).
          5.  The Killer Requirement.
          6.  Scorecard.

      *(Self-Correction during drafting)*: Make sure I explicitly answer "Is 'delete it' a verdict?" Yes, it's a pragmatic verdict, not an ontological one. Make sure to address the Transitivity/Borderline tension explicitly (it is a real tension, known as the intransitivity of similarity).

      *(Refining the Access Profile point)*: This is crucial. In security/ontology, what exists depends on what you can touch. I should frame this as "Operational Ontology."

      *(Refining the Compliance angle)*: Compliance cares about *representational faithfulness*, not metaphysical truth. If the Beast said there were 3 customers, and we merge them into 1, did we lie? Yes. So granularity matters for compliance even if it's "just a view."

  9.  **Final Review against constraints:**
