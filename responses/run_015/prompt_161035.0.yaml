answer: |-
  This is a classic case of *epistemic opacity* meeting *pragmatic necessity*. You are not actually doing metaphysics; you are doing risk management disguised as metaphysics. Your colleague is treating the Beast as a black box that might contain a god; you are treating it as a legacy tool that might contain a hammer. For migration, you need to know if it hits nails, not if it has a soul.

  Below are the desiderata for an **Operational Ontology Method (OOM)** suitable for your constraints. I have flagged which are non-negotiable for migration/compliance and which are philosophical preferences (yours or your colleague's).

  ### Desiderata for Operational Ontology Identification

  **1. The Causal Inertia Verdict (Orphan Predicates)**
  *   **Requirement:** The method must distinguish between *causally inert* (exists but does nothing observable) and *structurally redundant* (exists only as a projection of other things).
  *   **Case:** You have a field `Shadow_Account_ID` that never appears in a `WHERE` clause you can construct, never changes an output value, and has no foreign key constraints visible in the queryable schema.
  *   **Verdict Rule:** "Delete it" is **not** an ontological verdict; it is a migration action. The ontological verdict must be: *"Epistemically Indistinguishable from Artifact."*
  *   **Status:** **Non-Negotiable.** You cannot migrate "maybe." You must tag it as "Unverified Structural Noise."
  *   **Note:** This blocks your colleague's demand to keep it "just in case." If it has no causal power in the accessible interface, it does not exist *for the purpose of the new system's interface*.

  **2. Counterfactual Sensitivity (Dormant vs. Dead)**
  *   **Requirement:** The method must classify entities based on whether *hypothetical* access (logs/write) would change their behavior, not just whether *actual* access does.
  *   **Case:** A flag `Is_Legacy_Active` is currently true for all rows. Is it dormant (would change if we could see history) or dead (hardcoded)?
  *   **Verdict Rule:** If the schema structure implies a state machine (e.g., there is a `Status_History` table even if empty), treat as **Dormant**. If the column is a boolean with no related state tables, treat as **Dead**.
  *   **Status:** **Non-Negotiable.** Migration requires preserving potential state transitions. Treating Dormant as Dead breaks future logic.
  *   **Colleague's Prejudice:** Your colleague wants to treat everything as Dormant because "we can't prove it's Dead." This is the verificationist smuggling. The method must allow a "Dead" verdict based on *structural absence* of supporting machinery, not just lack of positive evidence.

  **3. The Burden of Proof Allocation (Existence vs. Missing Evidence)**
  *   **Requirement:** The method must explicitly assign the burden of proof for existence claims.
  *   **Case:** You want to say "Household is just a view of Customers." Colleague says "You can't prove it's not a base table."
  *   **Verdict Rule:** **Incompatibility Acknowledged.** You are correct: you cannot hold "Never conclude non-existence due to missing evidence" AND "Don't keep entities alive forever." One must yield.
  *   **Resolution:** For migration, **Parsimony Wins.** The default is *Non-Existence* (Artifact) unless positive structural evidence mandates existence.
  *   **Status:** **Taste (Yours).** Your colleague's stance is Verificationist (truth = verifiability). Your stance is Pragmatist (truth = utility). For migration, Pragmatism is Non-Negotiable. Verificationism leads to bloated schemas.

  **4. Falsifiability Conditions (Settling the Question)**
  *   **Requirement:** For every "Uncertain" verdict, the method must output the specific *inaccessible fact* that would resolve it.
  *   **Case:** "We don't know if `Arrangement` is a Contract or a Payment Plan."
  *   **Verdict Rule:** The output must be: "Uncertain. Would be settled by: Vendor log showing `Arrangement` creation trigger source."
  *   **Status:** **Non-Negotiable.** Your colleague is right here. If you cannot specify what would change your mind, your current position is dogma, not analysis. This is required for Compliance tagging.

  **5. Mereological Clarity (Granularity)**
  *   **Requirement:** The method must decide if composite entities are *first-class citizens* or *derived views*.
  *   **Case:** Household vs. 3 Customers.
  *   **Verdict Rule:** "It's just how we talk" **is** an ontological verdict. It means "Derived View."
  *   **Status:** **Non-Negotiable.** In the new system, you must know if you are creating a `Household` table or a SQL View.
  *   **Compliance Shift:** If the purpose is Audit, "Derived View" might be insufficient. If the Beast reported "1 Household" to regulators, and you report "3 Customers," you may have a reporting mismatch. For Compliance, Granularity is **Representational**, not just Structural.

  **6. Identity Criteria and Transitivity (The Pairwise Problem)**
  *   **Requirement:** The method must handle the intransitivity of similarity.
  *   **Case:** Beast Customer A ≈ New Customer X. Beast Customer B ≈ New Customer X. But A ≠ B.
  *   **Verdict Rule:** Identity is a **Deliverable**, not an Input. You cannot discover identity; you must *stipulate* it based on business keys.
  *   **Tension Check:** You are not talking nonsense. Pairwise Matching + Transitivity + Borderline Cases **is** a logical contradiction (Poincaré's Sorites).
  *   **Resolution:** The method must **break Transitivity**. "Same as" in migration is not mathematical identity; it is "Mapped To." You must allow clusters where A→X and B→X without implying A→B.
  *   **Status:** **Non-Negotiable.** If you enforce transitivity, you will merge distinct entities erroneously.

  **7. Access-Relative Ontology (Clearance Profiles)**
  *   **Requirement:** Verdicts must be indexed to the Access Profile.
  *   **Case:** To a Query-Only user, `Shadow_Account` is an artifact. To a Vendor Admin, it might be a replication buffer.
  *   **Verdict Rule:** This is a **Feature**, not a bug. The ontology is defined by the interaction surface.
  *   **Status:** **Non-Negotiable.** You are migrating the *interface behavior*, not the *internal implementation*. If the internal implementation is invisible, it is irrelevant to the new system's contract.

  ---

  ### Purpose Shift: Migration vs. Compliance

  You asked how desiderata change if the purpose is Legal/Audit rather than Description/Migration.

  *   **Migration (Engineering):** Goal is *Functionality*.
      *   **Dominant Desideratum:** Causal Inertia. If it doesn't do anything, drop it.
      *   **Risk:** Data Loss.
      *   **Verdict Style:** Binary (Migrate/Drop).
  *   **Compliance (Legal):** Goal is *Representational Faithfulness*.
      *   **Dominant Desideratum:** Falsifiability Conditions. You must prove you *checked*, even if you drop it.
      *   **Risk:** Misrepresentation.
      *   **Verdict Style:** Qualified (Migrated as X, with caveat Y).
      *   **Change:** Granularity becomes critical. Even if `Household` is "just a view," if the Beast legally recognized it as a binding unit, you must preserve that binding in the new system, perhaps as a distinct object, even if technically redundant.

  ---

  ### The Killer Requirement

  **Requirement #4: Falsifiability Conditions.**

  This knocks out the most tempting approach: **"Conservative Agnosticism"** (Your Colleague's preferred method).
  *   *Why:* The Colleague wants to say "We don't know, so we must preserve everything just in case."
  *   *The Kill:* If they cannot specify *what log entry* would prove `Shadow_Account` is real, they are not being careful; they are being superstitious. Requiring them to name the specific missing evidence forces them to admit that for many fields, *no possible evidence* would change the migration decision. It collapses their "maybe" into "irrelevant."

  ---

  ### Scorecard of Approaches

  Here is how three common approaches score against the Non-Negotiable Desiderata (Causal Inertia, Burden of Proof, Falsifiability, Transitivity Break).

  **1. The Empiricist (Count only what's directly accessible)**
  *   **Method:** If a query can't distinguish it, it doesn't exist.
  *   **Score:**
      *   Causal Inertia: **Pass.** (Strict adherence).
      *   Burden of Proof: **Pass.** (Existence requires evidence).
      *   Falsifiability: **Fail.** (Often cannot articulate *why* it's inaccessible, just that it is).
      *   Transitivity: **Pass.** (Relies on hard keys).
  *   **Verdict:** **Best for Migration.** It produces a clean schema. It risks breaking hidden logic, but Requirement #2 (Counterfactual Sensitivity) mitigates this by checking structural hints.
  *   **Risk:** You might delete a field that triggers a vendor-side audit flag you can't see.

  **2. The Abductive (Count whatever the best explanation of evidence needs)**
  *   **Method:** Infer hidden entities if they explain data patterns (e.g., "There must be a `Shadow_Account` because these balances don't sum otherwise").
  *   **Score:**
      *   Causal Inertia: **Fail.** (Posits entities that aren't directly observable).
      *   Burden of Proof: **Mixed.** (Shifts burden to "explain the anomaly").
      *   Falsifiability: **Pass.** (Hypotheses are testable *if* access were granted).
      *   Transitivity: **Fail.** (Prone to over-merging based on similarity).
  *   **Verdict:** **Best for Debugging.** Terrible for Migration. It creates schema objects based on theories, not contracts.

  **3. The Realist (Count whatever the domain quantifies over)**
  *   **Method:** Map the business concepts (Customer, Household) regardless of how the Beast stored them.
  *   **Score:**
      *   Causal Inertia: **Fail.** (Ignores how the Beast actually worked).
      *   Burden of Proof: **Fail.** (Assumes business terms match legacy tables).
      *   Falsifiability: **Fail.** (Business concepts are rarely falsifiable).
      *   Transitivity: **Fail.** (Business identity is notoriously fuzzy).
  *   **Verdict:** **Best for Marketing.** Dangerous for Engineering. This is how you build a new system that doesn't talk to the old data correctly.

  ### Final Recommendation for Friday

  Adopt **The Empiricist** approach, constrained by **Requirement #4 (Falsifiability)**.

  1.  **Default Verdict:** If a Beast entity/predicate has no observable causal impact on accessible outputs, it is an **Artifact**.
  2.  **Exception:** Unless you can name the specific inaccessible log/event that would prove it is **Real**.
  3.  **Action:** Migrate Artifacts as "Commented Metadata" or drop them. Migrate Reals as Schema Objects.
  4.  **Compliance Tag:** For every Dropped Artifact, file the Falsifiability Condition ("We dropped X because no query affects Y. If Vendor Log Z shows otherwise, we roll back.").

  This satisfies the need to move forward (your side) while documenting the risk formally (your colleague's side), without accepting the verificationist paralysis that nothing is real unless proven.
