  You are a decision theorist and welfare economist who has spent years working on Harsanyi's aggregation theorem and on the ex ante versus ex post dispute in welfare economics. Please think carefully and work slowly: check your arithmetic on the numbers below, step back and sanity-check your own conclusions before you commit to them, and begin by brainstorming four or five candidate social welfare functions before you narrow to the two or three you take most seriously. I want the principles written as formulas with the cases plugged in, not gestured at in prose, and I want you to end with a one-paragraph bottom line telling me what I should actually defend. I am drafting this in a place with no library access, so please do not point me at papers, authors, or reading lists; I need the reasoning itself.

  I am a graduate student in a seminar on rational choice and social welfare, writing my final paper, and I have decided to work backwards from my own verdicts on cases instead of forwards from a theory. Here is how I understand the result I am meant to be responding to, and I would like you to correct me if I have it wrong. Suppose (i) each individual's preferences over lotteries satisfy the von Neumann-Morgenstern axioms, (ii) society's preferences over lotteries also satisfy them, and (iii) whenever every individual is indifferent between two lotteries, society is indifferent too. Then there are non-negative weights, one per person, and a cardinal representation of each person's utility, such that social welfare is the weighted sum of the individuals' expected utilities. On Harsanyi's own veil-of-ignorance reading, where I must choose as if I had an equal chance of being anyone, equal weights give me the average of expected utilities. Call this the theorem and the reading.

  Except in Case 5, assume the utility numbers really are on a common unit scale, so that sums and differences across people are meaningful.

  Case 1, avoidable inequality. Three people, Ada, Ben and Cato. Policy X is a fair lottery over (0, 6, 6), (6, 0, 6) and (6, 6, 0). Policy Y is (4, 4, 4) for sure. Each person's expected utility is 4 under both, so with equal weights the theorem is indifferent. My verdict: Y, and it is not a close call.

  Case 2, unavoidable inequality. Two patients identical in every relevant respect, one indivisible dose, a fair coin decides who gets it, so (8, 2) or (2, 8). My verdict: no complaint whatsoever; the coin is the right thing to do. I include this only so that you do not conclude that I object to inequality as such or to lotteries as such.

  Case 3, fair chances. Ada and Ben. Policy R is (8, 2) for sure. Policy S is a fair coin between (8, 2) and (2, 8). My verdict: S, and again not close. R strikes me as unfair and S does not, even though S lowers Ada's expected utility from 8 to 5 and raises Ben's from 2 to 5, leaves the total unchanged, and draws the outcome that actually materialises from the same pair of outcome vectors that R was already drawing from.

  Case 4, where I come apart. Ada and Ben. Policy P is a half chance of (12, 12) and a half chance of (0, 0), so each person's expected utility is 6. Policy Q is (5.5, 5.5) for sure, so each person's expected utility is 5.5. My verdict is torn, but I lean P: everyone is better off in expectation, expected total welfare is higher, and it feels like unacceptable paternalism to refuse both of them the gamble. I can see that this has the same shape as Case 1, a gamble with an ugly lower tail against a safe equal outcome, and that in Case 1 I took the safe option. Tell me whether any principled social welfare function gives me both verdicts, and if it can only be done by something lexicographic or discontinuous, say so and say whether the price is worth paying. If nothing principled gives me both, tell me which verdict to drop and why. Either way, tell me what your preferred candidate says if I change 5.5 to 5.9, and again if the bad branch of P becomes something like (-10, -10).

  Case 5, the unit problem. Ada's utility function spans ten units across the lives available to her; she is expressive and everything moves her a great deal. Ben's spans two units; he is severely depressed and little moves him. Policy T gives Ada +3 of her units and leaves Ben unchanged. Policy V gives Ben +1.2 of his units and leaves Ada unchanged. My verdict: V, because Ben gets three fifths of his available range and Ada three tenths. But the verdict makes me nervous, because the weighted-sum form cares about raw units, and rescaling a person's utility function permittedly changes which policy wins. So what fixes the interpersonal units? If the answer is normalisation by each person's achievable range, then what someone is owed seems to depend on how well off they could have been in circumstances nobody will bring about, which also seems wrong to me. My suspicion is that in the theorem the weights are doing far more interpersonal work than the proof ever acknowledges, and I would like to know whether that suspicion is fair.

  Case 6, extra people. Ada and Ben at (8, 8). Policy W brings Cato into existence at level 5, leaving the other two at 8. My verdict: I do not want to say this is worse, since a life at 5 is plainly worth living, and I do not want to say it is better either; perhaps it is simply not comparable. But the veil-of-ignorance reading says it is worse, since my expected utility of being a randomly selected person falls from 8 to 7. Does the weighted-sum conclusion say anything at all about variable populations, or does the average-versus-total question fall entirely outside it, and if it falls outside, what are the weights for?

  Here is what I want from you. First, correct or tighten my statement of the theorem and of its premises. Second, set out the two or three candidates you take most seriously, each as a formula, and for each clause name the one of my cases that the clause exists to save; flag any clause that looks to you like it was built for a single case and does no other work. Third, for each candidate state which premise of the theorem it sacrifices: individual expected utility, social expected utility, Pareto indifference, equal weights, or the assumption of a fixed common unit. Fourth, state plainly which of my verdicts each candidate cannot accommodate, and which one you would overturn. Fifth, give me your candidate's verdicts on two cases I have not given verdicts on. In 1a, suppose the person who lands at 0 under X is not chosen at random but is certain to be Cato, who is worse off than the others in every state of the world. In 1b, suppose the number of people is itself uncertain: policy Z1 is (6, 6) for sure, while policy Z2 is a half chance of (6, 6) and a half chance of (4, 4, 4), where in the second branch a third person exists. Say what your candidate implies in each, and also whether it implies it for the reason you would want to give in the paper. Then give me the bottom line paragraph.
