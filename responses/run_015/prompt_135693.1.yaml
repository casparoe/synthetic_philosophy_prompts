answer: |-
  ### 1. The Examination Question

  **Time Allowed:** 90 Minutes
  **Word Limit:** 1,200 words maximum
  **Marks:** 25

  **Question:**
  Read the following case history carefully.

  > **The Selene Programme (1920–1996)**
  > **Hard Core:** During waking, the brain accumulates a **single, unique** blood-borne sleep-promoting substance; sleep *just is* the clearance of that substance; nothing else causes sleep onset.
  > **Early Success (1920s–30s):** Predicts transfusing fluid from a sleep-deprived animal into a rested one will induce sleep. Corroborated in several species. Predicts the factor is heat-stable/low molecular weight. Corroborated by fractionation.
  > **Mid-Century (1950s):** Predicts a hypothalamic sleep centre; lesioning it produces insomnia. Corroborated, though later confounded (lesions were large; effect now attributed to damage to neighbouring arousal pathways).
  > **Crisis (1960s–80s):** The substance is never isolated. Every purification yields several active fractions.
  > **Belt Adjustments:** The programme extends the protective belt four times: (1) there are several such substances rather than one; (2) they act redundantly (removing one changes nothing); (3) the substance is produced in the gut and modified in the liver; (4) old transfusion experiments were unreliable artefacts of the procedure.
  > **New Predictions:** Two new predictions extracted from these additions: (a) double/triple knockouts will abolish sleep; (b) a receptor antagonist will produce prolonged waking. **Both fail.**
  > **The Rival (Local–Circadian Programme):** Treats sleep as a property of local cell assemblies. Predicts local sleep-like activity in awake animals (confirmed late 1980s). Re-explains transfusion results as procedural artefacts. **Limitations:** Has not yet predicted anything new of its own; has no account of why the old hypothalamic lesions produced insomnia.
  > **Current Status (1996):** The Research Council must decide whether to renew Selene's ten-year funding block. Defenders argue every mature programme passes through a degenerating phase. Critics argue the belt has been patched so often that nothing could now count against the hard core.

  **Task:**
  Using Lakatos's methodology of scientific research programmes, advise the Research Council on whether to renew funding for the Selene Programme. Your answer must evaluate the status of the 'hard core', the nature of the belt adjustments, and the relationship with the Local–Circadian rival. Do not simply list Lakatosian terms; apply them to the specific tensions in this case.

  ***

  ### 2. Model Answer (Approx. 1,000 words)

  **Title:** Rationality, Retrospect, and Resource Allocation: A Lakatosian Appraisal of Selene

  To advise the Research Council, we must apply Lakatos's distinction between a progressive and a degenerating research programme. A programme is theoretically progressive if its modifications yield excess empirical content (novel predictions); it is empirically progressive if some of that content is corroborated. If a programme merely accommodates anomalies through *ad hoc* adjustments without novel success, it is degenerating. On these criteria, the Council should not renew the Selene Programme's exclusive funding block, though a complete cessation may be premature.

  The primary evidence for degeneration lies in the sequence of belt adjustments from the 1960s to the 1980s. Lakatos warns against the "protective belt" becoming a shield that renders the hard core irrefutable. Selene's first three adjustments (multiple substances, redundancy, gut production) appear purely protective. They were introduced solely to explain the failure to isolate the singular substance, not to generate new tests. Crucially, the fourth adjustment—claiming transfusion results were artefacts—undermines the programme's own foundational corroboration. When a programme begins to explain away its past successes to save its core, it is a strong indicator of degeneration. Furthermore, the two genuine predictions extracted from these additions (knockouts and antagonists) failed. In Lakatosian terms, this is a degenerating problemshift: the theory is absorbing blows without striking back.

  However, a verdict of degeneration is typically available only in hindsight. Lakatos acknowledges that a programme in trouble may revive. This creates a tension for the Council, who must decide *now*, not retrospectively. Defenders argue Selene is merely in a temporary trough. Yet, Lakatos provides a heuristic for the present: intellectual honesty. Scientists may rationally stick to a degenerating programme (tenacity), provided they do not deceive others about its status. The Selene defenders, however, are asking for public resources based on past glory while currently failing to produce novel facts. The Council's role is not to judge the individual rationality of the scientists, but the institutional rationality of resource allocation. Since resources are finite, they should flow to the programme currently showing theoretical progress.

  This leads to the rival, the Local–Circadian Programme. For the Council to switch funding, the rival must do more than exist; it must absorb the excess content of the degenerating programme. Local–Circadian has successfully re-explained the transfusion artefacts and confirmed local sleep activity. However, it currently lacks an account for the hypothalamic lesion data. Here lies the first contestable claim of this appraisal: **I argue that the lesion data is not decisive.** The case notes that the lesion work was "confounded" by damage to arousal pathways. If the lesion data is itself unreliable, the rival's failure to explain it is not a fatal anomaly. If the Council accepts the lesion data as robust, Selene retains a foothold; if they accept the modern confounding explanation, Local–Circadian has effectively absorbed Selene's empirical content. Given the failure of Selene's recent predictions, the weight of evidence shifts to the rival.

  A deeper structural issue concerns the Hard Core. Lakatos states the hard core is protected by convention. In the 1920s, Selene's core included the uniqueness of the substance (as per the original grant). The shift to "several substances" in the 1960s looks like a belt adjustment, but it arguably violates the original hard core definition. **This is the second contestable claim: I contend this shift constitutes a change of programme, not merely a belt adjustment.** If the hard core changes from "one substance" to "a class of substances," Selene is not a degenerating version of the 1920s programme, but a new, distinct programme that started with a failure to isolate its primary entity. If it is a new programme, it cannot claim the early transfusion successes as its own without qualification, weakening its claim to maturity.

  Finally, we must address the charge that Lakatos's methodology licenses anything. If tenacity is always potentially rational (because a programme might revive), does the framework offer any guidance? It does, but it is comparative, not absolute. Lakatos does not say "abandon immediately upon anomaly" (that is Popper); he says "prefer the programme that is currently progressive." The Council is not asked to refute Selene definitively—that is impossible—but to maximize the growth of knowledge. Funding a programme that has failed its last two novel predictions, against a rival that has confirmed a novel prediction of its own (local sleep activity), is an inefficient allocation of epistemic risk.

  Therefore, the Council should decline the ten-year block renewal for Selene. They might offer short-term bridging funding to resolve the lesion anomaly, but the primary resource commitment should shift to Local–Circadian. To do otherwise would be to fund a protective belt that has stopped paying for itself, mistaking the convention of the hard core for a license to ignore failed predictions. Lakatos allows scientists to be tenacious; he does not require Funding Councils to be enablers of degeneration.

  ***

  ### 3. Marking Scheme (25 Marks)

  **Grade Boundaries:**
  *   **A (18–25):** Executes all 5 moves with nuance. Explicitly handles the tension between retrospective appraisal and current decision. Distinguishes between individual rationality (tenacity) and institutional allocation.
  *   **B (14–17):** Correctly applies Lakatosian vocabulary (belt, core, progressive/degenerating) to the case. Reaches a conclusion. Misses the meta-critique on hindsight or the convention of the hard core.
  *   **C (10–13):** Describes the case using the vocabulary but treats Lakatos as a simple checklist. May drift into Popperian refutation.
  *   **D (0–9):** Fails to apply the framework or misunderstands the core concepts.

  **The Five Moves (5 marks each):**

  1.  **Discrimination of Belt Adjustments (5 marks):**
      *   *Full marks:* Distinguishes between the early successful predictions and the later "patches" (multiple substances, redundancy). Identifies that the later adjustments were protective rather than content-increasing, noting the failed knockout/antagonist predictions.
      *   *Typical Error:* Calling every patch "ad hoc" without distinguishing between those that led to new tests (even failed ones) and those that merely explained away anomalies. (Deduct 2 marks if all patches are treated identically).

  2.  **The Hindsight/Decision Tension (5 marks):**
      *   *Full marks:* Acknowledges that degeneration is usually a retrospective verdict (Point 2 in prompt). Argues why a decision is still possible *now* (e.g., via comparative progress or intellectual honesty).
      *   *Typical Error:* Concluding that because we can't know the future, Lakatos gives "no guidance at all." (Deduct 3 marks for this nihilistic conclusion).

  3.  **Hard Core Convention (5 marks):**
      *   *Full marks:* Discusses whether the shift from "one substance" to "several" is a belt tweak or a hard core change. Notes that this definition is conventional and affects the verdict (Point 3 in prompt).
      *   *Typical Error:* Treating the hard core as a fixed, objective fact rather than a methodological convention.

  4.  **Rival Absorption & Resource Split (5 marks):**
      *   *Full marks:* Addresses whether Local–Circadian has absorbed Selene's content (transfusion results). Discusses the lack of a threshold for switching funding (Point 4 in prompt).
      *   *Typical Error:* Assuming the rival must be "proven true" to replace Selene (Popperian error). (Deduct 3 marks for treating the rival's lack of lesion explanation as a definitive refutation of the rival).

  5.  **Tenacity vs. Vacuity (5 marks):**
      *   *Full marks:* Addresses the "licensing" objection (Point 5 in prompt). Explains that tenacity is rational for individuals but funding requires comparative progress.
      *   *Typical Error:* Concluding that if tenacity is rational, the methodology is vacuous/useless.

  **Specific Penalties:**
  *   **Popperian Confusion:** If the candidate argues Selene should be funded/defunded *solely* because it was "falsified" by the failed knockouts, cap at 13 marks (C grade). Lakatos is about problemshifts, not single refutations.
  *   **Ad Hoc Hindsight:** If the candidate labels the 1960s patches as "ad hoc" without acknowledging they could only be confirmed as such by the subsequent failed predictions, deduct 2 marks from Move 1.

  ***

  ### 4. Notes for the Convener

  **On the "Intellectual Honesty" Point:**
  This is a real feature of Lakatos's position (found in *Falsification and the Methodology of Scientific Research Programmes*, 1970). Lakatos argues that while it is not *irrational* to stick to a degenerating programme (history shows they sometimes revive), it is intellectually dishonest to pretend the programme is progressive when it is not.
  *   **Usage in Model:** The model answer uses this to distinguish between the *scientist's* right to persist (tenacity) and the *Council's* duty to fund progress.
  *   **Instruction:** If a candidate argues that Lakatos forbids sticking to a degenerating programme entirely, they are slightly misreading him (he allows it, but discourages the *claim* of progress). Credit them if they use the distinction to solve the funding problem, even if they don't cite the phrase "intellectual honesty."

  **On the Added Detail:**
  I added the phrase **"single, unique"** to the Hard Core description in the Question text (bolded in the draft above).
  *   **Reason:** Without this, the shift to "several substances" is easily dismissed as a standard belt adjustment. By specifying uniqueness in the original definition, the shift becomes a potential Hard Core violation, forcing the candidate to grapple with Move 3 (Convention).
  *   **Instruction:** Ensure this bolded text is present in the exam paper distributed to students.

  **On Contestable Claims in the Model Answer:**
  The model answer takes a definite line, but a well-prepared candidate might reasonably disagree on two points. Markers should credit these disagreements if well-argued:
  1.  **The Lesion Data:** The model argues the lesion data is unreliable ("confounded") and thus the rival's failure to explain it doesn't matter. A candidate might argue that until the lesion data is fully explained, Selene retains unique explanatory power that the rival lacks, justifying continued funding. (Credit this under Move 4).
  2.  **The Hard Core Shift:** The model argues the shift from "one" to "several" substances is a change of programme. A candidate might argue this is a standard belt adjustment (redundancy systems are common in physiology) and Selene is one continuous programme. (Credit this under Move 3).

  **Constraint Check:**
  *   **Closed Book:** The model answer relies only on the provided text and general Lakatosian architecture (no citations).
  *   **Word Count:** Model answer is approx. 1,000 words.
  *   **Marking:** Scheme is tight enough to prevent marker drift on the "Ad Hoc" and "Popperian" errors.
