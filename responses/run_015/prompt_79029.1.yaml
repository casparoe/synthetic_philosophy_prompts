  Based on the three rulings you provided, I have analyzed Ruth's decision-making process. She is not applying a single rigid formula (like "always pick the higher percentage"); she is applying a set of principles about **causality** and **context**. She distinguishes between numbers that describe the *world* and numbers that describe the *intervention*.

  Here is the breakdown of her rules, how they apply to your friend's case, and where the uncertainty lies.

  ### 1. Ruth's Rules (The Model)

  Ruth's rulings are consistent with three specific principles of causal statistics:

  *   **Rule A (The Covariate Principle):** If the groups being compared are **pre-existing characteristics** (things the scheme did not cause, like "Strong/Weak maths" in Ruling 1 or "Overweight/Not" in Ruling 3), the "Overall" number is misleading if the schemes attracted different mixes of people. In this case, you must look at the **subgroup performance**.
  *   **Rule B (The Mediator Principle):** If the groups are **outcomes of the scheme** (things the scheme is supposed to achieve, like "Got an Interview" in Ruling 2), the "Overall" number is the correct measure. You cannot ignore the people the scheme failed to engage, because engaging them was part of the job.
  *   **Rule C (The Deployment Principle):** If the study sample does not match the real-world population where the scheme will be used (Ruling 3, where the study had few overweight children but the clinic has many), you must ignore the study's "Overall" and calculate a new weighted average based on the **target population**.

  ### 2. Analysis of the New Case (Halden vs. Ives)

