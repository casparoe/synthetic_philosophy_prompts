answer: |-
  You have identified the central vulnerability of Evolutionary Debunking Arguments (EDAs). While there is no single, canonical proper noun (like "The Gettier Problem") that exclusively names this specific rhetorical maneuver, it is the core subject of the **"Self-Defeat Objection"** (or **"Global Debunking Objection"**) and the debunker's response to it, which is typically labeled the **"Epistemic Asymmetry"** (or **"Explanatory Asymmetry"**) defense.

  In the metaethical literature, the phenomenon you are describing—the selective application of genealogical undermining—is most precisely discussed under the heading of the **"Scope Problem"** for evolutionary debunking.

  Here is a breakdown of how this concept is categorized, how it differs from related problems, and where philosophers draw the boundaries.

  ### 1. The Established Concepts

  **The Problem: The Self-Defeat Objection (or "Companions in Guilt")**
  The objection you are describing is standardly called the **Self-Defeat Objection**. It argues that if evolutionary pressures explain all human beliefs (including the belief in evolutionary theory and the belief in the norms of reasoning used to construct the EDA), and if those pressures do not track truth, then the EDA undermines its own premises.
  *   **Key Proponents:** This line of criticism is associated with philosophers like **David Enoch**, **William FitzPatrick**, and **Erik Wielenberg**.
  *   **The "Companions in Guilt" Argument:** A specific version of this objection argues that if moral beliefs are "guilty" of being evolutionarily shaped and thus unjustified, then scientific and epistemic beliefs are "companions in guilt" and must share the same fate.

  **The Defense: Epistemic Asymmetry**
  The move you noticed—where the debunker treats the evolutionary explanation of moral beliefs as undermining but the evolutionary explanation of their own reasoning as neutral—is the **Epistemic Asymmetry Defense**.
  *   **The Claim:** Debunkers (like **Sharon Street** or **Richard Joyce**) argue there is a relevant difference between moral beliefs and epistemic/logical beliefs.
  *   **The Mechanism:** They argue that while moral beliefs are *fully* explained by adaptive pressure (and thus "off-track"), our capacity for logic and scientific reasoning has a different relationship to truth (e.g., it is a precondition for having beliefs at all, or it tracks survival-relevant truths that overlap with logical truths).
  *   **Your Observation:** You are noting that when debunkers explain *resistance* to their argument (e.g., "you feel I am wrong because evolution made you stubborn"), they treat that explanation as descriptive/neutral. If they treated it as normative/undermining, they would have to say, "Your resistance is evolved, therefore your resistance is unjustified," which would loop back to undermine the idea that you *should* accept the debunking.

  ### 2. Distinguishing from Generic Self-Defeat

  A generic self-defeat problem occurs when a proposition entails its own falsity (e.g., "All statements are false"). The asymmetry you identified is more subtle; it is a charge of **arbitrariness** or **special pleading** rather than formal contradiction.

  *   **Generic Self-Defeat:** "If your argument is true, your argument is unjustified." (A logical circle).
  *   **The Asymmetry Problem:** "You are applying a principle (genealogy undermines justification) to Domain A (morality) but withholding it from Domain B (epistemology/psychology), despite both domains sharing the same etiology (evolution)."

  The distinction is that the debunker *can* logically avoid generic self-defeat by claiming their argument relies on rational intuition rather than evolved moral intuition. The asymmetry charge challenges whether that distinction is **principled** or merely **ad hoc**. It asks: *Why is the evolutionary explanation of my moral belief a defeater, but the evolutionary explanation of my belief in logic not a defeater?*

  ### 3. Distinguishing from Explanatory Pluralism

  **Explanatory Pluralism** is the view that different domains require different kinds of explanations (e.g., physics explains rocks, psychology explains beliefs). This is generally accepted and not problematic.

  The asymmetry you noticed is not about *which* explanation is used (the debunker uses evolution for both), but about the **normative force** of that explanation.
  *   **Pluralism:** "Evolution explains why we believe X; Logic explains why X is true." (Compatible).
  *   **The Asymmetry Issue:** "Evolution explains why we believe X (Morality) → X is unjustified." **VS.** "Evolution explains why we believe Y (Logic/EDA) → Y is still justified."

  The problem is not that they are using different explanations, but that they are assigning different **epistemic weights** to the *same* type of causal history depending on the domain.

  ### 4. Boundaries and Demarcation

  Philosophers who defend EDAs against this asymmetry charge typically draw boundaries around the phenomenon in three ways:

  **A. The "Precondition" Boundary (Transcendental Arguments)**
  Debunkers often argue that we cannot coherently doubt the reliability of reason itself because reason is a precondition for formulating the doubt.
  *   *Boundary:* Evolutionary explanations undermine **contingent normative beliefs** (morality, politics) but cannot undermine **necessary epistemic norms** (logic, probability, inference to the best explanation) without making argumentation impossible.
  *   *Critique:* Critics argue this is a "dogmatic slumber." Just because we *must* assume reason to argue doesn't mean evolution actually *gave* us reliable reason.

  **B. The "Third-Factor" Boundary**
  Some realists (like **David Enoch** or **William FitzPatrick**) argue that in domains like math or logic, there is a "third factor" that links evolutionary success to truth (e.g., true beliefs about the world generally aid survival).
  *   *Boundary:* Evolution tracks truth in **descriptive domains** (science, logic) because getting the world right helps you survive. It does *not* track truth in **normative domains** (morality) because "moral truth" (if it exists) is causally inert and doesn't help survival directly.
  *   *Your Observation:* This is where your point about "resistance" fits. The debunker assumes the evolutionary explanation of resistance is merely descriptive (a survival mechanism), not a truth-tracker.

  **C. The "Independence" Requirement**
  Philosopher **Guy Kahane** argues that genealogical explanations only debunk if we have an **independent reason** to think the belief is false or unreliable.
  *   *Boundary:* We can debunk morality because we have independent reasons to doubt moral realism. We cannot debunk evolution or logic because we lack independent reasons to doubt them (they are the tools we use to check everything else).
  *   *Critique:* This risks making debunking circular. You can only debunk what you already doubt.

  ### Summary Terminology

  If you need a specific label for your writing or research, the most accurate technical phrase is **"The Epistemic Asymmetry Defense against Global Debunking."**

  If you are critiquing it, you might refer to it as **"The Demarcation Problem for Evolutionary Debunking"** or charge the argument with **"Selective Skepticism."**

  The specific move of explaining away resistance to the argument without undermining the argument itself is sometimes referred to as a **"Therapeutic Genealogy"** (explaining why the error persists) contrasted with a **"Theoretical Genealogy"** (explaining why the belief is false). The asymmetry lies in treating the therapeutic genealogy of the opponent as merely causal, while treating the theoretical genealogy of the moralist as normative.

  ### Recommended Reading for this Specific Nuance
  *   **Guy Kahane,** *"Debunking Arguments: No Conclusions without Independent Premises"* (2011). (Discusses when genealogical explanations actually undermine).
  *   **Katia Vavova,** *"Debunking Arguments"* (2018/2019). (Excellent analysis of the scope and limits of debunking).
  *   **Sharon Street,** *"The Darwinian Dilemma for Realist Theories of Value"* (2006). (The source of the modern EDA, where she attempts to navigate this asymmetry).
  *   **David Enoch,** *"Taking Morality Seriously"* (2011). (Chapter on the "Shmagency" objection and the self-defeat of EDAs).

  Your intuition is correct: this asymmetry is the "fault line" where most evolutionary debunking arguments either collapse into global skepticism or retreat into a defended dogmatism about the reliability of reason.
