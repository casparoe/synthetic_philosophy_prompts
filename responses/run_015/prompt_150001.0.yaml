answer: |-
  The lab was a study in monochrome efficiency. Beige walls, grey steel, white coats. Dr. Elena Voss adjusted the haptic collar of the Resonator, her fingers tracing the cold polymer. She knew exactly what happened when light hit a retina. She knew the 700-nanometer wavelength of crimson, the specific firing rate of L-cones, the cascade through the LGN to V4. She knew the physics of red better than anyone alive. She had never seen it.

  "Vitals are stable," Sam, her lead technician, said, not looking up from the monitor. "But Elena, the beta testers... they said it felt like remembering a dream. Not seeing."

  "Memory is a reconstruction," Elena said, her voice flat. "So is vision. The device bypasses the eye. It writes the state directly onto the cortex. If physicalism holds, the state *is* the experience."

  "And if it doesn't?" Sam asked, finally meeting her eyes. His were brown, she knew, though to her they were just dark circles in a pale face.

  "Then I'm about to become the first person to prove there's a ghost in the machine." She sat in the reclining chair. The hum of the cooling fans was the only color in the room, a vibration she could feel in her teeth.

  "You know the risk," Sam said, hand hovering over the kill switch. "If the induction creates a simulacrum of qualia rather than the thing itself, you won't know the difference. You'll think you saw red, but you'll just be simulating the belief that you saw red."

  "That's the point, Sam." Elena closed her eyes. "Mary knew all the physical facts but learned something new upon leaving the room. I am bringing the room to me. If I learn nothing, physicalism wins. If I learn something, it fails. But..."

  "But you can't tell us which it was," Sam finished.

  "Execute."

  Sam flipped the switch.

  There was no light behind her eyelids. Instead, there was a sudden, violent pressure in the occipital lobe, like a sudden intake of breath held too long. A wave of heat washed over her, distinct from thermal sensation, localized entirely within her mind. It was urgent. It was loud. It was...

  Elena opened her eyes. The lab was still grey. The steel was still silver. But the grey wall in front of her vibrated with a significance it never had before. She felt a rush of recognition, a label snapping into place: *Crimson.*

  But was the wall red? Or did her brain simply light up the "red" file without the sensory payload? She looked at Sam. He was leaning forward, searching her face.

  "Well?" he asked. "Did you see it?"

  Elena opened her mouth. She had the data. She had the feeling of having seen. But the feeling of having seen and the act of seeing were now indistinguishable in her neural architecture. If she said "Yes," it could be truth. If she said "Yes," it could be the machine mimicking the truth so perfectly that the difference ceased to matter.

  She looked at the readout. The neural patterns matched the theoretical model of crimson perfectly.

  "I don't know," Elena whispered, the uncertainty tasting like ash. "I know I'm having the reaction. I don't know if there's anyone home to feel it."

