prompt: |-
  write a short story about a neuroscientist named Dr. Elena Voss who has mapped every physical fact about chromatic experiance—every wavelength, every cone response, every cortical pathway—but she's lived her whole life in a greyscale labe with no color vision. the twist: she builds a "reverse mary" device that can induce the full neural state of seeing crimson in another person, but she can't tell whether that state carries the subjective qualitative character or just mimics the physics. she decides to run it on herself, knowing that if physicalism is right she'll learn nothing genuinely new, yet if there's a non-physical fact she'll access it—while being unable to report back whether she actually felt it or only simulated feeling.

  keep the story grounded in her daily choices and conversations with her technician, not a philosophy lecture. aim for about 600 words. after the story, give me a JSON object with exactly these fields: "story_title" (string), "injected_twist" (one sentence on the reverse-device idea), "knowledge_argument_hook" (which part of the classic color/physicalism argument it touches), "ending_commitment" (what view of qualia it leans toward, or "underdetermined" if ambiguous), and "reader_takeaway" (one line on what is being tested).

  don't worry about citations or reading lists, just the fiction and the JSON.
