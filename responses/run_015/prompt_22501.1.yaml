answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Two philosophers, **Elena** (a Millikanian teleosemanticist) and **Marcus** (a causal theorist who accepts the disjunction problem), are standing by the coffee machine.*

  **Elena:** Did you see that paper on insect navigation in the latest *Journal of Theoretical Biology*? It brought the old moth-and-porch-light example back to mind. It's really the perfect test case for our respective frameworks.

  **Marcus:** The transverse orientation case? Keeping a constant angle to a light source?

  **Elena:** Exactly. A moth flies into a porch light and spirals to its death. The question is: What is the content of the navigational representation guiding that flight? Is it <Moon>? Or is it <Light>?

  **Marcus:** Well, if you ask me, given the causal history of that specific tokening event, it's hard to deny the content is <Light>. The porch light caused the internal state which caused the flight path.

  **Elena:** But that's the trap, Marcus. If the content is <Light>, then the moth isn't making a mistake. It's accurately representing a light and navigating toward it. But biologically speaking, that's a malfunction. The mechanism is failing. On my view, the content is <Moon>—or more precisely, <Distant Celestial Light Source>.

  **Marcus:** I see where you're going. You're appealing to proper function.

  **Elena:** I am. The content is fixed by the *proper function* of the representation-producing mechanism. And proper function is determined by selection history. For millennia, the ancestors of this moth used that navigation mechanism to track the moon and stars. The rays were effectively parallel. Keeping a constant angle resulted in straight-line flight. That success is why the mechanism was selected and retained.

  **Marcus:** So the history fixes the reference, regardless of the current cause.

  **Elena:** Precisely. The "Normal conditions" for the operation of this mechanism include the presence of a distant light source. When a porch light triggers it, the mechanism is operating outside Normal conditions. It is producing a representation with the content <Moon> in the absence of a moon. That is a misrepresentation. It explains why the behavior is maladaptive. The moth is acting on a falsehood.

  **Marcus:** Okay, Elena, your story is coherent, but it relies on a normative leap I'm not willing to make. You're privileging the *historical* causes over the *actual* cause. Look, I accept the causal covariance theory of content. If state *R* is tokened, it's because something caused *R*. In the history of the species, *R* was caused by Moons. In this specific instance, *R* is caused by a Porch Light.

  **Elena:** And that leads you to the Disjunction Problem.

  **Marcus:** It does. And unlike Fodor, I'm not trying to solve it with asymmetric dependence or ideal conditions. I'm biting the bullet. If both Moons and Porch Lights reliably cause *R*, then the content of *R* is simply <Moon OR Porch Light>.

  **Elena:** But that dissolves the possibility of error entirely in this case. If the content is disjunctive, then when the moth spirals into the flame, it is representing the world *accurately*. It is tracking a <Moon OR Porch Light>. There is a light present. The content is satisfied.

  **Marcus:** Exactly. And I don't see why that's a bug. You teleosemanticists are obsessed with the intuition that the moth is "wrong." But why? The moth's internal state covaries with the presence of luminous navigational beacons, natural or artificial. The tragedy of the moth isn't semantic error; it's geometric inevitability. The content is just coarser-grained than you want it to be.

  **Elena:** It's not just an intuition about "wrongness," Marcus. It's about explanatory power. If the content is <Moon OR Light>, you cannot explain why the flight path becomes a spiral *as a failure of guidance*. You can explain it physically, via the geometry of divergent rays, but you lose the intentional explanation.

  **Marcus:** Why do I need an intentional explanation of the failure?

  **Elena:** Because the system is a *guidance* system. Guidance implies a goal. The goal is straight-line navigation. By positing <Moon> as the content, I can say the system is trying to track the moon, failing to find it, but being tricked by the proxy. The "error" explains the maladaptation. On your view, the system is doing exactly what it's supposed to do given the content <Moon OR Light>. It finds a light, it tracks it. The fact that it dies is incidental to the semantics.

  **Marcus:** I'd argue the death is incidental to the semantics on your view, too. You say the content is <Moon>. But the mechanism doesn't "know" it's a moon. It just detects luminance and angle. You're projecting the selection history onto the current content.

  **Elena:** I'm not projecting; I'm grounding. The distinction between *proper function* and *actual performance* is crucial here. A heart's proper function is to pump blood, even if it's currently fibrillating and only quivering. The fibrillation is an actual performance, but it's not the proper function. Similarly, the moth's mechanism has the proper function of tracking celestial bodies. The porch light triggers an actual performance that fails the proper function. That gap *is* misrepresentation.

  **Marcus:** But that gap only exists because you define the function historically. I define the relation causally. Let's press the disjunction point. Suppose a candle causes the state *R*. On your view, that's another error. Content: <Moon>. Reality: Candle. On my view, the content expands. <Moon OR Light OR Candle>.

  **Elena:** And eventually, your content becomes so disjunctive it loses predictive utility. <Anything that causes R>.

  **Marcus:** Not anything. Only things that nomologically covary with *R*. But yes, the content is broader. Here's the thing, Elena: You pay a high price for your determinacy. You need a clear selection history. What about a mutant moth? Or a moth species introduced to a new planet with two moons? If the selection history is ambiguous, your content becomes indeterminate. My causal theory doesn't care about the history. It cares about the current law-like connection.

  **Elena:** A mutant moth is a breakdown case, sure. But for the standard case, the selection history is the only thing that fixes the *mapping rule*. The mechanism maps "constant angle to parallel rays" to "straight flight." That rule was selected. The porch light violates the input conditions of that rule.

  **Marcus:** But the mechanism doesn't detect "parallel rays." It detects "constant angle."

  **Elena:** True, the *proximal* stimulus is constant angle. But the *distal* object selected for was the moon. The consumer system—the motor control—expects the input to correspond to a moon to execute straight flight. When the producer sends <Moon> based on a porch light, the consumer is misled. The breakdown in the Producer-Consumer relationship constitutes the error.

  **Marcus:** I see the move. You're locating the normativity in the relationship between the internal signal and the motor output as shaped by history. But I still maintain you're conflating *why the mechanism exists* with *what the mechanism represents now*.
  Selection explains why the moth has the hardware. It doesn't necessarily fix the semantic value of the current token. If I have a thermometer designed for Earth, and I take it to Venus, and it breaks, does it represent "Earth Temperature" while melting? Or does it represent "High Temperature" and just break physically?

  **Elena:** If the thermometer is a representation user, it represents "Earth Temperature" and is wrong. If it's just a physical gauge, it's neither. But the moth is an agent. The content must be specific enough to guide action *successfully*. <Moon OR Light> doesn't guide action successfully in an environment with artificial lights.

  **Marcus:** But "successful" is relative to the environment. In an environment without artificial lights, <Moon OR Light> is extensionally equivalent to <Moon>. The disjunction only becomes problematic when the environment changes faster than selection can catch up.
  Look, let's be honest about the trade-off. You want to preserve the phenomenon of error. To do that, you have to anchor content in the past (history). I want to preserve the causal link between mind and world. To do that, I have to accept that content might be disjunctive and error is rarer than we think.

  **Elena:** I'd say you aren't preserving the causal link; you're weakening the content link. If content is <Moon OR Light>, then the representation doesn't distinguish between the two. But the moth's behavior *does* distinguish, in a sense—it spirals for one and flies straight for the other. The behavior reveals the specific content.

  **Marcus:** The behavior reveals the *geometry* of the stimulus, not the content. The spiral is a physical consequence of the divergent rays, not a semantic consequence of a false belief.
  Here is my challenge to you: If the moth evolves over a thousand years in a city. Eventually, the moths that avoid porch lights survive. The mechanism changes. At what point does the content shift from <Moon> to <Light>?

  **Elena:** The content shifts when the proper function shifts. When the mechanism is selected *for* tracking porch lights—perhaps because they lead to food sources in a human environment—then the content becomes <Artificial Light>. Until then, it's a malfunctioning moon-detector.

  **Marcus:** But that implies there's a magic moment where the history tips over. I don't have that problem. For the urban moth, the causal covariance is with <Light>. For the rural moth, it's <Moon>. For the transitional moth, it's <Moon OR Light>. It's a smooth transition.

  **Elena:** It's a smooth transition in *causes*, yes. But content is normative, not descriptive. It's about what the system *ought* to track. The transitional moth is in a state of semantic tension, arguably. But calling it <Moon OR Light> just describes the causes; it doesn't capture the *direction of fit*. The moth is trying to fit its flight to the moon. It fails.

  **Marcus:** "Trying" is the word doing all the work there. I don't need "trying." I need covariance.
  Let's step back. You claim your view handles error better. But consider a case where the moon is present, but obscured by clouds, yet the moth still flies straight because of residual luminance. You'd say it represents <Moon> correctly.
  Now, consider the porch light. You say it represents <Moon> incorrectly.
  In both cases, the internal state is identical. The causal history of the *mechanism* is identical. The only difference is the external object.
  My view says: In case 1, the content <Moon OR Light> is satisfied by Moon. In case 2, the content <Moon OR Light> is satisfied by Light. Both are true tokens.
  Your view says: In case 1, True. In case 2, False.
  Why is your distinction metaphysically deeper?

  **Elena:** Because the *explanation* of the tokening differs. In the cloud case, the mechanism is operating under Normal conditions (distant luminance), even if the specific photon source is scattered. In the porch light case, the mechanism is operating under Abnormal conditions.
  The Disjunction Problem arises for you because you treat all causes as equal contributors to content. I treat the *selected* cause as the content-determiner. The porch light is a "counterfeit" cause. It hijacks the system.

  **Marcus:** "Hijacks" implies there's a legitimate driver. That's the history again.
  I think the core disagreement is this: You think semantics requires the possibility of systematic error to be meaningful. I think semantics just requires reliable covariance. If the moth reliably spirals into lights, that's a reliable covariance. Why call it error?

  **Elena:** Because the moth doesn't *want* to spiral into lights. It dies. Teleosemantics grounds the "want" in the survival of the ancestors. The system is *for* survival. Spiraling into a flame defeats the *for*.
  If you remove the "for," you remove the agent. You're left with a robot that crashes. I'm describing a creature that *fails*.

  **Marcus:** And I'm describing a creature that interacts with its environment according to causal laws. If the content is disjunctive, the creature isn't failing semantically. It's just that the disjunction <Moon OR Light> has different physical consequences depending on which disjunct is instantiated. Parallel rays yield straight flight; divergent rays yield spirals. The semantics stays constant; the physics changes.

  **Elena:** But that makes the semantics inert. If the content doesn't explain the difference in success conditions, what work is it doing?
  <Moon> explains why straight flight is successful. <Moon> explains why spiraling is a failure.
  <Moon OR Light> explains why *some* flight happens, but it doesn't distinguish the success from the failure without adding a footnote about ray geometry.

  **Marcus:** I don't need the semantics to explain the geometry. Physics does that. Semantics just tracks the causal structure.
  Look, Elena, we might be at a stalemate. You prioritize the *normative* status of the representation (derived from history). I prioritize the *actual* causal relation (derived from covariance).
  In the moth case, you get determinacy (<Moon>) at the cost of historical baggage. I get causal purity at the cost of disjunctive bloating.

  **Elena:** I'd argue it's not baggage; it's biology. An organism *is* its history. You can't strip that away and still have an agent.
  But I will concede this: If we find a moth species that has *only* ever existed around porch lights—say, a lab-created lineage—then for them, the proper function *is* <Light>. History catches up.

  **Marcus:** And for that lab moth, my causal theory says <Light>. So we converge in the long run. We only diverge on the transitional cases where history and current causation pull apart.

  **Elena:** And that's where the philosophy lives. In the error.

  **Marcus:** Or in the disjunction.

  *They both take a sip of coffee, looking at the moth buzzing near the lounge's overhead fluorescent tube.*

  **Elena:** Watch that one. It's hovering straight.

  **Marcus:** Parallel rays.

  **Elena:** Proper function.

  **Marcus:** Covariance.

  **Elena:** We'll have to agree to disagree on the content.

  **Marcus:** As long as we agree on the causation.

  *They clink their mugs.*
