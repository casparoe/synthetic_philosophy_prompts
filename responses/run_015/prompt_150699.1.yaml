answer: |-
  Assign a trait's function based on the historical reason for its presence (design intent or ancestral selection) when documented, otherwise default to the specific current contribution it makes to the organism's survival or reproduction.

  ### The Procedure

  **Step 1: Origin Status**
  *   **Question:** Is there a documented record of why this trait exists (designer intent or continuous lineage selection)?
  *   **Yes:** Go to Step 2.
  *   **No (Unknown History):** Go to Step 3.
  *   **No (Documented Break):** Treat the re-engineering intent as the "Historical Record" and go to Step 2.

  **Step 2: Historical Consistency**
  *   **Question:** Does the trait still perform the recorded historical function?
  *   **Yes:** **Output:** "Function: [Historical Purpose]. Basis: Record." (Stop).
  *   **No:** Go to Step 3.

  **Step 3: Current Capacity**
  *   **Question:** Does the trait currently make an indispensable contribution to the organism's survival or reproduction?
  *   **Yes:** **Output:** "Function: [Current Contribution]. Basis: Current Capacity (Exaptation/Repurpose)." **Hand-back:** If Historical Record exists, flag for author to decide whether to prioritize history (what it *is*) or capacity (what it *does*) in narration. (Stop).
  *   **No:** **Output:** "Function: None (Vestige/Noise). Basis: No Capacity." (Stop).

  **Step 4: Unknown History Default**
  *   **Question:** (Reached only if Step 1 was No). Does the trait currently make an indispensable contribution to the organism's survival or reproduction?
  *   **Yes:** **Output:** "Function: [Current Contribution]. Basis: Current Capacity (Default)." (Stop).
  *   **No:** **Output:** "Function: None (Vestige/Noise). Basis: No Capacity." (Stop).

  **Entry Format for Continuity Bible:**
  `[Trait Name]: [Assigned Function] | [Basis: Record/Capacity/Author-Choice]`

  ### Philosophical Distinctions

  **Keep:**
  *   **Etiology vs. Causal Role:** The procedure must distinguish between *why it is there* (History/Design) and *what it does now* (Capacity). This is the core conflict your narrator faces.
  *   **Proper Function vs. Vestige:** You must distinguish between traits that are maintained by selection/use and those that are decaying leftovers.

  **Drop:**
  *   **Malfunction Theory:** Do not worry about whether a broken trait retains its function; if it doesn't work, treat it as "None" for narrative purposes unless the brokenness is the plot.
  *   **Cumulative Selection Nuance:** Do not attempt to trace incremental adaptive steps; "Ancestral Selection" is a single binary flag in your bible.
  *   **Teleosemantics:** Ignore debates about whether function requires representation or information; "Design Intent" covers the artificial cases sufficiently.

  ### Worked Cases

  **(1) Hollow cranial crest (Burrowing ancestor -> Courtship display)**
  *   **Step 1:** Origin Status? Yes (Lineage record: Burrowing ancestor).
  *   **Step 2:** Historical Consistency? No (Not used for burrowing now).
  *   **Step 3:** Current Capacity? Yes (Courtship display essential for reproduction).
  *   **Output:** `Cranial Crest: Courtship Display | Basis: Current Capacity (Exaptation) [Author-Choice Flag]`
  *   **Note:** The procedure flags this for you because the history (burrowing) contradicts the current use (display). You must decide if the narrator calls it a "burrowing crest used for display" or a "display crest derived from burrowing."

  **(2) Implanted filtration organ (Toxin removal -> Circulation/Second Heart)**
  *   **Step 1:** Origin Status? Yes (Documented Break: Terraformer design).
  *   **Step 2:** Historical Consistency? No (Toxin removed; filtration obsolete).
  *   **Step 3:** Current Capacity? Yes (Drives circulation essential for survival).
  *   **Output:** `Implanted Organ: Circulatory Pump | Basis: Current Capacity (Repurpose) [Author-Choice Flag]`
  *   **Note:** The procedure flags this for you because the design intent (filtration) contradicts the current use (circulation). The continuity editor will see "Repurpose" and know the original design was different.

  **(3) Bioluminescent frill (Lineage record intentionally unwritten)**
  *   **Step 1:** Origin Status? No (Unknown History).
  *   **Step 3:** Current Capacity? Yes (Signalling/Light essential for survival/reproduction).
  *   **Output:** `Bioluminescent Frill: Signalling | Basis: Current Capacity (Default)`
  *   **Note:** No flag. Since history is blank, current use defines function automatically.

  ### Dislike Prediction

  You will dislike the answer on **Case 2 (Implanted Filtration Organ)**.

  **Why:** The procedure forces an **Author-Choice Flag** because the etiological function (filtration) and the causal role (circulation) diverge. While the output suggests "Circulatory Pump" based on current capacity, the flag demands you explicitly resolve the tension between the sci-fi backstory (it was built as a filter) and the biological reality (it acts as a heart). This complicates your narrator's voice: if they call it a "second heart," they are ignoring its design history; if they call it a "filter," they are ignoring its physiological reality. The procedure refuses to let you have it both ways without marking the contradiction in the bible, which may feel like bureaucratic friction against a metaphorical narrative choice you want to treat as settled fact.
