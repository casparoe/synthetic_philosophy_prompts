answer: |-
  **MEMORANDUM**

  **TO:** The Legal Team, Truth and Reconciliation Commission
  **FROM:** Legal Counsel
  **SUBJECT:** Refinement of Amnesty Criteria and Adjudication Principles

  You have correctly identified that your intuitive verdicts outpace your current drafting. Your three tentative conditions are sound starting points, but they lack the precision to distinguish between Case 6 (public confession, no new facts) and Case 7 (public confession, corrective facts), and they leave Case 4 (the Banker) in limbo. Furthermore, Case 9 (the false confessor) reveals a gap regarding the integrity of the process itself.

  There is a single coherent principle that accommodates eight of your nine verdicts. To achieve this coherence, you must resolve your wavering on Case 4. For the sake of legal consistency with Case 2 (the General), Case 4 must result in **no amnesty**. Both are architects of the repressive capacity, albeit in different domains (doctrine versus finance). To grant the Banker amnesty while denying the General would render the commission vulnerable to accusations of class bias or arbitrary enforcement.

  Below is the refined principle, the justification for the necessary verdict adjustment, and the application to your new hypotheticals.

  ### The Principle of Corrective Truth and Subordinate Agency

  Amnesty shall be granted if and only if the applicant satisfies three cumulative limbs:

  1.  **The Limb of Material Truth:** The disclosure must make a material contribution to the historical record that is either (a) otherwise inaccessible to the Commission within a reasonable timeframe, or (b) necessary to correct a material injustice in the existing record (such as the exoneration of the innocent).
      *   *Motivating Cases:* This clause distinguishes **Case 6 from Case 7**. In Case 6, the truth is already known; the confession is merely performative. In Case 7, the truth corrects a wrongful attribution, serving a specific restorative justice function. It also accommodates **Case 3 (the Clerk)**; whilst the documents were recoverable, the voluntary handover constitutes a 'reasonable timeframe' facilitation that aids the transition, unlike the passive waiting implied by strict counterfactual necessity. It excludes **Case 5**, where the information is already in the public domain via other witnesses.
  2.  **The Limb of Subordinate Agency:** The applicant must have acted as an instrument of policy rather than a formulator of policy or an essential enabler of the repressive apparatus.
      *   *Motivating Cases:* This clause excludes **Case 2 (the General)** and mandates the exclusion of **Case 4 (the Banker)**. The General wrote the doctrine; the Banker provided the essential lifeblood (finance) without which the squads could not operate. Both exercised discretionary power that sustained the regime. It also excludes **Case 8 (the Village)**; collective killing implies shared ownership of the act, negating the defence of superior orders or structural coercion. It admits **Case 1 (the Conscript)**, who lacked discretion.
  3.  **The Limb of Good Faith:** The disclosure must be truthful, complete, and not intended to obstruct the attribution of liability to the truly responsible parties.
      *   *Motivating Cases:* This clause explicitly captures **Case 9**. The perpetrator's false confession violates the integrity of the process. It is not merely a failure of discovery; it is an active obstruction of justice designed to shield a superior, thereby violating the *quid pro quo* of the amnesty bargain.

  ### Resolution of Inconsistencies

  You must drop your wavering on **Case 4 (the Banker)** and rule **No Amnesty**.

  **Reasoning:** Your hesitation likely stems from the fact that the Banker did not pull a trigger. However, in a system of state terror, logistics and finance are force multipliers equivalent to doctrine. If you grant amnesty to the financier while prosecuting the doctrinal architect (Case 2), you create a loophole where the 'brain' and the 'wallet' of the repression walk free, while the 'hands' are pardoned. This undermines the moral authority of the Commission. The Banker fails the *Limb of Subordinate Agency*.

  ### Application to Unlisted Cases

  Here is how the Principle applies to the two additional scenarios you provided.

  **1. The Child Soldier (Abducted at fourteen, victim turned perpetrator)**
  *   **Verdict:** **Amnesty Fine.**
  *   **Analysis:** This applicant satisfies the *Limb of Material Truth* (assuming they disclose their actions). Crucially, they satisfy the *Limb of Subordinate Agency* to an even higher degree than the Conscript in Case 1. A fourteen-year-old abductee lacks full legal and moral capacity; their agency is entirely 'owned' by the captors. They are the archetype of the instrument rather than the formulator. The *Limb of Good Faith* is assumed met if the confession is truthful. The restorative aim of the Commission is best served by reintegrating a child victim-perpetrator rather than prosecuting them.

  **2. The Self-Amnestied Discloser (Disclosed everything under the outgoing regime's self-amnesty, now voided)**
  *   **Verdict:** **Not Fine.**
  *   **Analysis:** This applicant fails the *Limb of Good Faith*. The purpose of the Commission's amnesty is to trade immunity for *cooperation with the new democratic order*. This individual did not cooperate with the Commission; they relied on a shield provided by the perpetrators themselves, which your Commission has rightly declared void. To grant them amnesty now would validate the outgoing regime's attempt to place itself above the law. They have not offered the *quid* (cooperation with the truth commission) required for the *quo* (new amnesty). They must be processed as a standard applicant, potentially receiving credit for the disclosure as a mitigating factor in sentencing, but not automatic amnesty.

  ### Summary Advice

  Your gut instincts are largely correct, but they require the rigour of the *Subordinate Agency* limb to prevent the architects of repression from escaping liability. By tightening the definition of 'Truth' to include *corrective justice* (Case 7) and insisting on *Good Faith* (Case 9), you create a framework that is legally defensible and morally coherent.

  Proceed with the drafting on this basis.
