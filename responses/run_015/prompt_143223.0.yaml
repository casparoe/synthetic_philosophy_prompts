answer: |-
  # Terms of Reference: Specification for the Equalisandum Currency

  **To:** The Currency Board
  **From:** Drafting Committee
  **Subject:** Desiderata for the Metric of Advantage

  Before evaluating specific proposals (welfare, resources, capabilities), any candidate currency for interpersonal comparison and transfer calculation must satisfy the following specifications. Each requirement is marked as either **Non-negotiable** (a condition of legitimacy for this Board) or **Preference** (reflecting a specific philosophical camp, included for clarity but open to trade-off).

  ### I. Case Sensitivity Requirements
  *The currency must yield intuitive verdicts in the following paradigmatic cases.*

  1.  **The Expensive Tastes Case:** The currency must not recommend transfers to compensate a citizen for voluntarily cultivated, costly preferences (e.g., a preference for vintage champagne over beer) when resources were sufficient for reasonable satisfaction.
      *   *Status:* **Non-negotiable** (Protects against moral hazard and unfair burden on the frugal).
  2.  **The Trained-Down Tastes Case:** The currency must identify disadvantage even when a citizen reports high subjective satisfaction due to adaptation to oppression or deprivation (e.g., the "happy slave" or chronically impoverished).
      *   *Status:* **Non-negotiable** (Prevents the metric from validating oppression).
  3.  **The Differential Needs Case:** The currency must recognize that two citizens with identical resource bundles may have different levels of advantage if one requires more resources to achieve the same functioning due to disability or illness (e.g., double dosage for same relief).
      *   *Status:* **Non-negotiable** (Ensures substantive rather than formal equality).
  4.  **The Timing Case:** The currency must treat a deficit occurring late in life as equally disadvantageous as the same deficit occurring early in life, all else being equal.
      *   *Status:* **Preference** (Luck Egalitarian view; opposes Time-Preference views).
  5.  **The Aggregation Case:** The currency must be able to identify a citizen as disadvantaged over a lifetime even if their income/advantage in every single discrete year exceeds the poverty threshold (e.g., chronic instability vs. stable minimum).
      *   *Status:* **Non-negotiable** (Ensures the metric captures lifetime opportunity, not just snapshots).

  ### II. Conceptual Distinction Requirements
  *The currency must maintain the following analytical separations.*

  6.  **Circumstance vs. Choice:** The currency must distinguish between disadvantages arising from brute luck (genetics, birth) and those arising from option luck (gambles, lifestyle choices).
      *   *Status:* **Non-negotiable** (Core to the Board's mandate to reduce inequality, not choice-based variance).
  7.  **Claim vs. Size of Claim:** The currency must distinguish between *that* a person has a claim to assistance and *how much* assistance they are due (avoiding sufficiency thresholds that ignore degrees of misery).
      *   *Status:* **Preference** (Prioritarian view; opposes Sufficiency views).
  8.  **Shares vs. Floor:** The currency must distinguish between equalizing shares of a total stock and raising the absolute position of the worst-off (avoiding zero-sum transfers that shrink the total).
      *   *Status:* **Non-negotiable** (Required to satisfy the Levelling-Down Objection).
  9.  **Assessment vs. Aggregation:** The currency must provide a metric for assessing one person's situation that is distinct from the rule for aggregating those assessments across society (e.g., a utility scale vs. a utilitarian sum).
      *   *Status:* **Non-negotiable** (Prevents category errors in policy design).

  ### III. Constraint Requirements
  *The currency must not contradict the following external constraints.*

  10. **The Levelling-Down Objection:** The currency must not recommend making the better-off worse off if doing so provides no benefit to the worse-off.
      *   *Status:* **Non-negotiable** (A condition of Pareto efficiency).
  11. **Reasonable Pluralism:** The currency must not presuppose a single comprehensive doctrine of what makes a life good (e.g., it cannot privilege religious salvation or artistic achievement over other ends).
      *   *Status:* **Non-negotiable** (Required for liberal legitimacy).
  12. **Public Verifiability:** The currency must be calculable using data that can be audited and appealed without intrusive inquiry into citizens' inner psychological states or private histories.
      *   *Status:* **Non-negotiable** (An administrative fact of public bodies).
  13. **Non-Reactivity (User Test):** The currency must not reverse its own verdicts on who is disadvantaged merely because citizens learn the metric and adapt their behavior to optimize their score (resistance to Goodhart's Law).
      *   *Status:* **User Requirement** (To be tested for feasibility).

  ***

  ### Analysis of Joint Satisfaction

  **The Impossible Subset**
  The following three desiderata cannot be jointly satisfied:
  1.  **Circumstance vs. Choice** (Responsibility Sensitivity)
  2.  **Public Verifiability** (Non-Intrusive Audit)
  3.  **Non-Reactivity** (Metric Stability)

  *Reasoning:* To accurately distinguish choice from circumstance (1), the Board requires information about intent and psychological history. To satisfy Public Verifiability (2), the Board is banned from collecting this intrusive data and must rely on external proxies (income, assets, diagnosed conditions). However, any fixed set of external proxies is gameable; citizens will alter their observable behavior to qualify as "circumstantial" victims rather than "choice" agents. If the Board adjusts the proxies to stop this gaming, it violates Non-Reactivity (3). If it does not adjust them, the metric fails to track Responsibility (1) because the gaming succeeds. You can have two, but not all three.

  **The Most Exclusionary Requirement**
  The single requirement that excludes the most candidate currencies is **Public Verifiability**.
  *   **Welfarism** is excluded immediately, as subjective utility cannot be audited without intrusive inquiry.
  *   **Capabilities** are severely constrained, as measuring "substantial freedom" often requires judging counterfactuals about what a person *could* do, which is difficult to verify objectively without paternalism.
  *   **Resourcism** is the only major camp that naturally satisfies this, as resources are externally observable.

  ***

  ### Comparative Scoring of Candidate Currencies

  | Desideratum | Welfarist (Utility) | Resourcist (Means) | Capability (Freedoms) |
  | :--- | :--- | :--- | :--- |
  | **Expensive Tastes** | ❌ Fails (Compensates tastes) | ✅ Passes (Ignores tastes) | ✅ Passes (Focus on opportunity) |
  | **Trained-Down Tastes** | ❌ Fails (Accepts adaptation) | ✅ Passes (Objective baseline) | ✅ Passes (Objective baseline) |
  | **Differential Needs** | ✅ Passes (Needs affect utility) | ❌ Fails (Ignores conversion) | ✅ Passes (Central to view) |
  | **Circumstance vs. Choice** | ❌ Fails (No distinction) | ⚠️ Struggles (Requires insurance market) | ⚠️ Struggles (Hard to measure) |
  | **Public Verifiability** | ❌ Fails (Intrusive) | ✅ Passes (Observable) | ⚠️ Struggles (Hard to audit) |
  | **Non-Reactivity** | ⚠️ Struggles (Hedonic adaptation) | ❌ Fails (Highly gameable) | ⚠️ Struggles (Behavioral change) |
  | **Reasonable Pluralism** | ⚠️ Struggles (Imposes 'happiness') | ✅ Passes (Neutral means) | ⚠️ Struggles (List selection) |

  ***

  Verdict: No existing currency satisfies all non-negotiable desiderata, forcing the Board to prioritize administrative feasibility over perfect responsibility-sensitivity.
