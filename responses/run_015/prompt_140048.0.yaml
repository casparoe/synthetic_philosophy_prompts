  ### Decision Tree Instrument

  *   **Q1: Policy Scale.** Can every option be placed on a single, pre-published policy scale (e.g., left-to-right) before voting begins?
      *   **Yes:** Go to Q2.
      *   **No:** Go to Q3.
  *   **Q2: Enforcement.** Will the rule automatically void any ballot that does not show a single peak on that scale?
      *   **Yes:** **Leaf 1: Enforced Median Voter.**
          *   *Rule:* Calculate the median position of all valid single-peaked ballots; select the option closest to that median.
          *   *Axiom Relaxed:* Universal Domain.
          *   *What is Given Up:* You have given up the guarantee that every voter's preference shape counts. **Diagnosis:** This reaches the G-S escape route only if the domain is restricted *ex ante*. Because you are voiding ballots *ex post* based on reports, a voter may strategically submit a non-single-peaked ballot to have it voided, effectively abstaining to shift the median of the remaining voters. You are trading strategy-proofness for domain purity, but inviting "strategic voiding."
      *   **No:** **Leaf 2: Assumed Median Voter.**
          *   *Rule:* Calculate the median position of all ballots, assuming they fit the scale.
          *   *Axiom Relaxed:* Strategy-proofness (effectively).
          *   *What is Given Up:* You have given up the protection against lying. If voters are not actually single-peaked, they will misrepresent their peak to manipulate the median. This is a G-S violation disguised as a domain restriction.
  *   **Q3: Randomness.** Is a trusted random draw (lottery) acceptable to decide the outcome?
      *   **Yes:** Go to Q4.
      *   **No:** Go to Q5.
  *   **Q4: Randomization Target.** Should the lottery pick the winning option directly, or pick one voter whose ballot decides?
      *   **Option:** **Leaf 3: Random Option Lottery.**
          *   *Rule:* Assign equal probability to all options; draw one.
          *   *Axiom Relaxed:* Determinism.
          *   *What is Given Up:* You have given up certainty. This is strategy-proof (no point lying to a coin flip) but ignores voter preference intensity or consensus.
      *   **Voter:** **Leaf 4: Random Ballot Rule.**
          *   *Rule:* Draw one voter at random; implement their top choice.
          *   *Axiom Relaxed:* Determinism.
          *   *What is Given Up:* You have given up equality of influence ex post. This is strategy-proof (honesty is best for the selected voter) but effectively appoints a random dictator.
  *   **Q5: Decisive Officer.** Is there a specific officer (e.g., Chair) whose preference prevails in a deadlock?
      *   **Yes:** Go to Q6.
      *   **No:** Go to Q7.
  *   **Q6: Override.** Is there a formal mechanism (e.g., supermajority vote or annual confidence check) to overturn that officer's decision?
      *   **Yes:** **Leaf 5: Checked Dictatorship.**
          *   *Rule:* The Chair decides unless a supermajority (e.g., 2/3) votes to override, or the Chair fails an annual confidence vote.
          *   *Axiom Relaxed:* Non-dictatorial (technically).
          *   *What is Given Up:* You have given up the mathematical guarantee of non-dictatorship. **Diagnosis:** In a single-shot G-S model, if the override threshold is high, this is indistinguishable from a Pure Dictatorship. The distinction only exists in a dynamic model where the threat of override or confidence loss constrains the Chair's behavior over time.
      *   **No:** **Leaf 6: Pure Dictatorship.**
          *   *Rule:* The Chair's top choice wins.
          *   *Axiom Relaxed:* Non-dictatorial.
          *   *What is Given Up:* You have given up all voter sovereignty. This is the only rule that is fully strategy-proof, deterministic, and universal without violating G-S, by accepting the Dictator axiom.
