          *   *Work-around:* Sociological (G-S silent).
          *   *What is Given Up:* You have given up the guarantee of secrecy and mathematical strategy-proofness. You rely on shame and common knowledge to enforce honesty. If norms fail, the rule collapses into manipulation.
      *   **No:** **Leaf 8: Sequential Pairwise Voting.**
          *   *Rule:* Options are paired and voted sequentially; the winner of one round faces the next.
          *   *Work-around:* Procedural (Agenda Control).
          *   *What is Given Up:* You have given up independence of irrelevant alternatives. The order of voting (agenda) determines the winner. This works in repeated settings because agenda-setting power can be rotated or regulated over time.
