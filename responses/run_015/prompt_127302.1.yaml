prompt: |-
  Me and two friends have been going around in circles in a group chat for about two years on one-shot prisoner's dilemmas between agents who are near-copies of each other, and I want to force the issue. Dave is a diehard superrationalist in the old Hofstadter sense: if two reasoners are relevantly alike they will land on the same conclusion for the same reasons, so you are in effect picking for both of you and you should pick the joint outcome you would want everyone to pick, which in the plain PD means cooperate. Priya is a hardline causal decision theorist who two-boxes against a near-perfect predictor, thinks the correlation between copies is just correlation and not anything your decision can ride on, and thinks the 'choosing for both' move is a metaphor that smuggles in a causal arrow that isn't there. They have both, in a moment of weakness, agreed to sign a joint statement if I can produce one neither thinks is rigged, so please draft that document. Concretely: (1) a numbered agreed-claims section that isn't filler — the payoff structure of the case; that the argument for cooperating with a copy is not an altruism argument and that partial altruism is a confound to screen off rather than a crux; that this argument and the argument for one-boxing in Newcomb's problem are structurally related but can in principle come apart; that both camps think the functional-decision-theory framing restates the superrationalist conclusion in new vocabulary without settling the normative question; that it makes no difference to either view whether the two agents deliberate simultaneously or an hour apart, or whether one has already answered and you will learn the answer later. Also say plainly which parts of the fight are merely verbal — if you think 'rational' is doing two different jobs in the two camps, say which claims survive once that is disentangled. (2) A disagreements table where each row is phrased in the words that side would accept for itself, not a straw version. (3) The cruxes — sub-questions such that settling one would move at least one of them — and for each a case or argument both would accept as bearing on it, with Dave's prediction and Priya's prediction written down side by side in advance.

  Here are the three cases I want doing the real work, because I don't think any of them is settled by the standard setups: (a) the Smudged Mirror — you play a one-shot PD against an agent built from a lossy copy of you with roughly 3% of the decision-relevant bits flipped, and you know this. Does superrationality require exact isomorphism, or does the case for cooperating degrade smoothly with similarity, and if it degrades, does the right response become a mixed strategy — given that randomizing is precisely what makes two copies come apart, and that they could in principle share one public random bit and thereby stay in sync while mixing? (b) the Weighted Twins — same game, except one twin's payoffs are all multiplied by twenty and everyone knows which one they are. Now the situation isn't symmetric even though the reasoning procedure still is, and I genuinely can't tell what Dave's own view delivers here: cooperate, defect, or nothing determinate. If this case splits his camp rather than his camp against Priya's, say so and put the intra-camp fracture in the document. (c) the Doorway — a two-person game with no symmetric joint optimum worth having: the best joint outcomes are the two asymmetric ones (one goes through, one waits), both rushing is a disaster, and both waiting is merely bad. Does superrationality have anything to say, can it use an irrelevant label on the players or a shared coin to select between the two good profiles, or does the 'do what you would want all to do' rule just deliver both-wait and reveal that the rule was only ever built for symmetric games?

  A couple of housekeeping things: keep it under about 1200 words, don't give me any citations or reading suggestions (I have the background, I just want the argument), and where a crux turns out to be empirical rather than conceptual, say what the experiment or observation would be and what result each of them is on the hook for. I got into this through the old Scientific American column and then the usual blog posts, so feel free to assume I know the twenty-people-one-winner setup and the many-person button game and don't need them re-explained.
