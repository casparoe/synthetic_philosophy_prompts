answer: |-
  # JOINT STATEMENT ON DECISION THEORY IN SYMMETRIC AND NEAR-SYMMETRIC AGENTS

  **1. Agreed Claims**
  1.  **Payoff Structure:** The baseline case is a standard one-shot Prisoner's Dilemma (T > R > P > S).
  2.  **Altruism Screen:** The argument for cooperating with a copy is not an altruism argument. Partial altruism is a confound to screen off rather than a crux. The disagreement persists even with zero concern for the other's welfare.
  3.  **Newcomb Relation:** The argument for cooperating with a copy and the argument for one-boxing in Newcomb's problem are structurally related but can in principle come apart. Agreement on one does not logically compel agreement on the other.
  4.  **FDT Status:** Both camps think the Functional Decision Theory (FDT) framing restates the superrationalist conclusion in new vocabulary without settling the normative question. It codifies the intuition but does not prove the axiom.
  5.  **Timing:** It makes no difference to either view whether the two agents deliberate simultaneously or an hour apart, or whether one has already answered and you will learn the answer later. Logical dependency is distinct from temporal causality.
  6.  **Verbal Dispute:** The term 'rational' is doing two different jobs. Dave uses it to mean "instrumentally effective given logical structure"; Priya uses it to mean "instrumentally effective given causal structure." Once disentangled, the substantive claim is whether logical correlation counts as a lever for action.

  **2. Disagreements Table**

  | Issue | Dave's Formulation (Superrationalist) | Priya's Formulation (Causal Decision Theorist) |
  | :--- | :--- | :--- |
  | **Mechanism** | My decision logically determines the copy's decision because we instantiate the same algorithm. | My decision is correlated with the copy's, but does not cause it. The correlation is fixed prior to my choice. |
  | **Counterfactual** | If I were to Cooperate, the copy would Cooperate. If I were to Defect, the copy would Defect. | If I were to Cooperate, the copy would still do whatever it was already determined to do. My choice changes only my outcome. |
  | **Normative Goal** | Maximize utility across all instantiations of my reasoning process. | Maximize utility caused by my specific physical action. |
  | **Status of Copy** | The copy is "me" for decision-theoretic purposes. | The copy is "other" for decision-theoretic purposes. |

  **3. Cruxes and Test Cases**
  The following cases bear on the substantive disagreement. Prescribed actions are recorded in advance.

  **(a) The Smudged Mirror**
  *Case:* You play PD against an agent built from a lossy copy of you with roughly 3% of decision-relevant bits flipped. You know this.
  *Crux:* Does logical dependency degrade continuously with similarity, or is it binary? If it degrades, does the right response become a mixed strategy?
  *Argument Bearing on Crux:* If logical dependency is a matter of algorithmic identity, slight noise should slightly reduce correlation. If it is a matter of kind, any break severs the link.
  *Dave's Prediction:* Cooperation probability degrades smoothly with similarity. If agents can share a public random bit, they should employ a synchronized mixed strategy to maintain correlation.
  *Priya's Prediction:* Defect always. Correlation is irrelevant regardless of strength. Causal independence is binary.
  *Empirical Note:* This is a normative crux. However, if implemented in code, the empirical correlation of outputs is measurable. Dave is on the hook for predicting correlation > 97%; Priya predicts correlation is irrelevant to the *decision rule*, though output correlation may exist empirically.

  **(b) The Weighted Twins**
  *Case:* Same game, except one twin's payoffs are all multiplied by twenty. Everyone knows which twin they are. The reasoning procedure is symmetric; the payoff structure is not.
  *Crux:* Does superrationality require payoff symmetry to mandate cooperation?
  *Argument Bearing on Crux:* Superrationality relies on "doing what you would want all to do." If "all" face different stakes, there is no single action all should take.
  *Dave's Prediction (Intra-Camp Fracture):* **Split.** Faction D1 says Cooperate (reasoning procedure is symmetric). Faction D2 says Indeterminate (no unique symmetric optimum exists). The document records this fracture.
  *Priya's Prediction:* Defect always. Dominance holds regardless of the other's payoff magnitude.

  **(c) The Doorway**
  *Case:* A two-person game with no symmetric joint optimum. Best outcomes are asymmetric (one goes, one waits). Both rushing is disaster; both waiting is bad.
  *Crux:* Can superrationality select an asymmetric equilibrium, or does the 'do what you would want all to do' rule deliver both-wait and reveal the rule was only ever built for symmetric games?
  *Argument Bearing on Crux:* If the rule requires universalizability, it cannot select between asymmetric options without an external symmetry breaker.
  *Dave's Prediction:* Requires an external symmetry breaker (coin/label). Without it, the rule yields suboptimal both-wait or is undefined. Superrationality is limited to symmetric games.
  *Priya's Prediction:* Mixed Strategy Nash Equilibrium. Standard game theory resolves this without logical dependency claims.

  **4. Empirical vs. Conceptual Status**
  All cruxes above are normative/conceptual. No experiment on human subjects settles them, as humans are not perfect reasoners. If implemented in deterministic code, the output correlation is empirical fact, but the *prescription* for what a rational agent *should* do remains conceptual. Dave is on the hook for the claim that rational agents *should* act to exploit logical correlation. Priya is on the hook for the claim that rational agents *should* ignore it.
