      *   **Core Question:** Should you defer to objective chance (Lewis-style) when you have enough knowledge of the deterministic underlying mechanics to compute the specific outcome?
      *   **Positions:**
          *   *Side A (Lewis/PP):* Deference to chance is rational regardless.
          *   *Side B (Pushback):* Clinging to stats in the face of computation is epistemic false modesty/failure to update.
