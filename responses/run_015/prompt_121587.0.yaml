answer: |-
  Let's cut straight to the chase. You're standing in front of a coin-tossing machine. It's a "chancy" system in the textbook sense: over a thousand tosses, it lands heads 50% of the time. The objective chance, according to the statistical laws governing the machine, is 0.5. But here's the twist: you have what we're calling "structural micro-access." You've got the exact initial position, the velocity, the air resistance coefficients, and the Newtonian laws to crunch the numbers. Your calculation says the next toss is definitely heads.

  The question is: what should your credence be? Should you stick with the 0.5 objective chance because the Principal Principle says that's the rational move? Or should you go with your calculation and say 100% heads, even if that ignores the statistical law?

  David Lewis, the godfather of the Principal Principle (PP), would initially tell you to defer to the chance. The PP basically says: if you know the objective chance is $x$, your belief should be $x$, unless you have "inadmissible" information. The idea is that chance is a guide for belief when the world is genuinely open. But this scenario exposes a crack in the foundation. If you have structural micro-access, you aren't dealing with an open future in the relevant sense; you're dealing with a determined outcome masked by statistical noise.

  Let's look at the case for sticking with the Principal Principle. The strongest argument here isn't that the micro-calculation is wrong, but that "objective chance" might be a higher-level property that doesn't disappear just because you peeked under the hood. Some philosophers (the compatibilists) argue that chances can exist even in a deterministic world. They'd say the 50% chance is a real feature of the system's design, while your micro-calculation is just a parlor trick that relies on perfect data. If you defer to the micro-calculation, you might be ignoring the robust, stable propensity of the system. Furthermore, there's the risk of overconfidence. Is your micro-access *really* perfect? Did you account for a quantum fluctuation in the air molecule hitting the coin? If there's any sliver of uncertainty in your measurement, the statistical chance acts as a safety net, a reminder that your model might be cleaner than the reality. To ignore the chance is to assume your access is god-like, which is a dangerous epistemic posture.

  However, the pushback against this is powerful, and honestly, it feels more intuitive. Clinging to the 50% chance when you've computed the trajectory is "epistemic false modesty." Credence is supposed to track truth. If you have evidence that entails the outcome (or makes it overwhelmingly probable), ignoring that evidence to honor a statistical average is irrational. It's like refusing to look at your poker cards because you know the statistical probability of being dealt a pair is low. Once you see the cards, the statistics are irrelevant.

  The Principal Principle has a built-in escape hatch for this: the "admissibility" clause. Lewis said you ignore chance if you have inadmissible information (usually info about the future). But structural micro-access isn't about the future; it's about the present state and the laws of nature. If your micro-access is genuine, it turns the chance conditional on that information into 1 or 0. In other words, if you apply the Principal Principle *correctly* using all your available evidence, the "objective chance" conditional on your micro-data isn't 0.5 anymore—it's 1. So, in a way, following the micro-calculation *is* following a refined version of the Principal Principle. To stick with the 0.5 is to artificially restrict your evidence base, pretending you don't know what you know.

  There's also the issue of what "chance" is doing here. If the system is deterministic at the micro-level, the 0.5 chance is arguably just a measure of human ignorance, not a feature of the world. It's an epistemic probability wearing an ontological mask. If chance is just a placeholder for missing information, then once you fill in the missing information, the placeholder should vanish. To let it guide your credence after you've filled in the gaps is to worship the map instead of the territory.

  So, where do I land? I'm going to come down hard on the side of the micro-computation. The Principal Principle is a rule for managing ignorance, not a rule for suppressing knowledge. If you have structural micro-access, you have effectively dissolved the chance. The statistical law describes the system's behavior *in the absence* of your specific data. Once you have the data, the statistical law is no longer the relevant guide for truth-tracking. To defer to the 0.5 chance is to commit a category error, treating a generalization about a population as a constraint on a specific, solved instance. Your credence should match your best evidence, and a deterministic calculation is better evidence than a frequency distribution.

  I am about 85% confident in this verdict. It feels robust because it aligns with the basic Bayesian idea that you should update on all available evidence. However, the one point I am least sure about is the metaphysical status of "compatibilist chance." I'm assuming that if micro-access exists, the objective chance effectively disappears or becomes irrelevant. But what if objective chance is a real, higher-level force that isn't just a summary of ignorance? If chances are real properties that exist *alongside* deterministic mechanics (not just because we're ignorant), then maybe they do retain some normative pull even when we have micro-access. I'm skeptical that such a thing makes sense, but I can't rule it out entirely, and if it is true, it might weaken the claim that micro-computation should always win.
