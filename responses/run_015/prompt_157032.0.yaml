  3.  **$P(\text{Decision-Theoretically Inert}) = 0.50$**
      Under indexical uncertainty, rational agents typically average expected value across possible worlds rather than nullifying action in the base-reality branch.

  4.  **$P(\text{Asymmetric Dilution}) = 0.80$**
      Ancestor simulations are hypothesized as finite historical runs, which would structurally truncate the far-future time horizon more severely than the near-term.

  **Overall Credence:** $0.25 \times 0.20 \times (1 - 0.50) \times 0.80 = \mathbf{0.02}$ **(2%)**
  *(Note: Term 3 is inverted because the overall claim requires the argument to be decision-theoretically effective, not inert.)*

  **Weakest Link & Highest Leverage:** **Term 2** is the weakest link; increasing it from 0.20 to 1.0 would increase the overall credence fivefold (to 10%), whereas maxing out other terms yields smaller marginal gains.

  **Required Conceptual Result:** A proof of **ontological privilege in moral realism** (e.g., that base-reality consciousness possesses qualia or moral weight that simulated consciousness fundamentally lacks) or a demonstration of **simulator architecture** where the simulator's utility function explicitly excludes or overwrites the welfare of simulated agents.
