  There's a summary of teleosemantics on a philosophy blog I came across, and I'm unshure whether it's being straight with me. Roughly, it says that teleosemantics — mostly Millikan's biosemantic version — fixes mental content through evolutionary proper function: a representation means X if its ancestors were selected for tracking X. Misrepresentation then becomes pure malfunction, like a frog's fly-detector firing at a pebble isn't false, it's just broken. The view dodges psychologism because content hinges on objective selection history rather than speaker intent. Critics point out it struggles with novel cognition — say, a mathematician reasoning about primes with no evolutionary track-record — and defenders answer via derived proper functions, analogising to a calculator inheriting its designer's purpose. The blogger then adds that this logic extends to artificial systems: any feedback loop shaped by selection, including a neural net trained via gradent descent, literally acquires beliefs about temperature or loss, since substrate doesn't matter and artificial selection counts the same as natural.

  How fair is all that? I'd like you to go through it in sections: first an Accuracy check (about 200 words), then The subtle distortions, especially malfunction versus representational error (around 200 words), then The claim about gradent descent and AI beliefs — does Millikan's framework actually license that? (around 200 words), and finally a short Bottom line on whether I should trust the blogger (about 80 words). No bibliography or citation list needed — I can't check those without searching anyway. Keep it focused and don't invent references.
