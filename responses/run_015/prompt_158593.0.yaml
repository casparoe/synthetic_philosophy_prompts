  The blog's overview of Millikan's core mechanism is surprisingly solid. It correctly identifies the "selected effects" theory of function as the content-fixer: mental states mean what their ancestors were selected to correlate with. The characterization of misrepresentation as malfunction aligns with the theory's goal to naturalize error without invoking norms external to biology. The handling of the "novel cognition" objection is also standard fare; the derived function response (comparing human reasoning to artifacts like calculators) is indeed the standard defense against the claim that teleosemantics cannot handle thoughts about things never encountered by ancestors. Furthermore, the claim that this dodges psychologism is accurate; for Millikan, internal phenomenology doesn't fix content, objective history does. The terminology of "tracking" is slightly loose but acceptable shorthand for covariance under selection. It correctly notes that the theory avoids circularity by grounding norms in facts about survival and reproduction. The explanation of derived functions is particularly clear. You can trust the basic exegesis here; it captures the dialectic between Millikan and her critics regarding historical constraints versus cognitive flexibility accurately, summarizing the standard introductory landscape without obvious factual errors regarding the core theory's structure or the standard objections raised against it in the literature.

  **The Subtle Distortions**

  The claim that a frog snapping at a pebble "isn't false, it's just broken" is a subtle but significant distortion. Teleosemantics is famously designed to solve the disjunction problem: explaining how a state can be *false* rather than just meaningless. If the frog's mechanism fires at a pebble, Millikan typically argues the state represents "fly" falsely, not that it fails to represent anything. The mechanism has a proper function to indicate flies; when it indicates a pebble, it is malfunctioning, yes, but the content is still "fly," making the representation false. The blog's phrasing suggests that malfunction eliminates content entirely, which undermines the theory's ability to explain error. If every error were just a breakdown without content, we couldn't say the frog believed something false. The distinction matters: teleosemantics wants false beliefs, not just broken thermometers. By implying misrepresentation is merely breakdown, the blogger risks conflating teleosemantics with a crude causal theory that cannot distinguish error from noise. The theory relies on the normativity of function to sustain false content, not to erase it. This distinction is the linchpin of the entire theoretical project.

  **Gradient Descent and AI Beliefs**

  The extension to AI via gradient descent is highly contentious and likely overstates Millikan's view. Millikan's theory is rooted in biological reproduction and natural selection. Proper functions arise from the history of a lineage reproducing itself. While some contemporary philosophers argue for "artificial teleosemantics," Millikan herself emphasizes biological categories. Gradient descent is an optimization process, not necessarily a selection process involving reproduction of entities with heritable traits in the biological sense. Neural nets don't reproduce; weights are adjusted. Claiming substrate doesn't matter ignores Millikan's commitment to biological naturalism. While a functionalist might accept AI beliefs, a strict Millikanian requires a reproductive family history. The blogger conflates optimization with evolutionary selection. Even if one accepts derived functions for AI, claiming they "literally acquire beliefs" via gradient descent alone skips the requirement for a consumer system that uses the representation for a proper function. Without a biological consumer or a robust analog of reproduction, the leap from loss minimization to belief is unsupported by Millikan's specific framework. This looks like the blogger importing functionalist assumptions into a historical theory where they don't strictly belong. Consequently, the blog's confidence here is unwarranted.

  **Bottom Line**

  The blogger is competent on standard theory but speculative on extensions. Trust them for the basics of Millikan's view and standard objections regarding novel cognition. However, treat claims on AI and error with skepticism. They simplify normative distinctions and overextend biological concepts into computational realms. Use this as a starting point, not a definitive guide on machine learning. That section moves beyond established interpretation. Stick to the blog for introductory history, but verify the AI and error claims elsewhere.
