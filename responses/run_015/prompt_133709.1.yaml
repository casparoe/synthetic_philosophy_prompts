  ### Reading for Tuesday

  To stop the spinning, you need to separate the *psychological mechanism* from the *normative claim*.

  1.  **For the Group:** Read **Hume's "Of the Standard of Taste," specifically the footnote regarding Sancho Panza's kinsmen and the wine cask.** This is the philosophical ancestor of the Meridian study. It clarifies that Hume thinks the "standard" is rooted in physiological sensitivity (the palate), which aligns with the flatmate's demand for perceptual screening.
  2.  **For the Grad Student:** Assign **Mary Mothersill, *Beauty Restored*, Chapter 4 ("The Standard of Taste").** She rigorously defends the idea that aesthetic judgments can be true without algorithmic rules, which addresses her optimism about the porcelain result.
  3.  **For the Flatmate:** Assign **Frank Sibley, "Aesthetic Concepts" (1959).** It argues that aesthetic terms are not condition-governed but require "taste" (perceptual sensitivity) to apply. This validates his focus on the *screening task* as the only legitimate entry point, supporting his skepticism about the verdicts themselves.

  **Summary Advice:** Tell the group the Meridian study settles the *causal* question (features drive agreement in some domains) but leaves the *normative* question open. Hume survives as a psychologist of art, but remains on trial as a moralist of taste.
