answer: |-
  ### 1. The Activity

  **Title:** The Highway Game
  **Group Size:** 14 participants (4 tables of 3–4 people).
  **Duration:** 90 minutes.

  **Roles (Rotated each condition):**
  *   **The Driver:** Makes the decisions. Sits behind a cardboard screen.
  *   **The Road Keeper:** Knows the "Truth" (which intersection is which). Manages the cards and lamp tokens. Sits opposite the Driver.
  *   **The Banker:** Distributes and collects poker chips based on outcomes.
  *   **The Scribe:** Records the Driver's *Plan* (before the trip) and *Choice* (at each intersection) on a tally sheet.

  **Materials per Table:**
  *   1 Cardboard screen (to hide the Road Keeper's materials from the Driver).
  *   1 Deck of "Intersection Cards" (identical backs, face says "INTERSECTION").
  *   1 Deck of "Lamp Tokens" (Red/Green chips or cards, drawn from a separate bag).
  *   1 Set of Poker Chips (Currency).
  *   1 Six-sided Die (for randomization if the Driver chooses).
  *   1 Tally Sheet (Columns: Trip #, Plan, Intersection 1 Choice, Intersection 2 Choice, Payoff).
  *   Pre-printed "Route Maps" for the Road Keeper (sealed in envelopes, opened one per trip).

  **The Rules (Read Aloud, No Explanation):**
  1.  **Goal:** Collect the most chips over the session.
  2.  **The Road:** A trip has two exits. Exit 1 pays 0. Exit 2 pays 4. Passing both pays 1.
  3.  **Ignorance:** The Driver cannot see the Route Map. When the Road Keeper places an "Intersection Card," the Driver does not know if it is the first or second.
  4.  **The Plan:** Before each trip, the Driver writes down a rule (e.g., "Continue always," "Roll 1-4 Continue, 5-6 Exit").
  5.  **The Choice:** At each card, the Driver says "Exit" or "Continue."
      *   If **Exit**: The trip ends. The Road Keeper reveals the Location (1 or 2). The Banker pays the Driver (0 or 4 chips).
      *   If **Continue**: The Road Keeper places the next card. If there are no more cards, the Banker pays 1 chip (End of Road).
  6.  **Lamps (Conditions 2 & 3 only):** Before the Driver decides, the Road Keeper draws a Lamp Token (Red/Green) from a bag and places it visible. The Driver may use this in their rule.

  **Accounting & Trips:**
  *   **Condition 1 (No Lamps):** 3 trips per table. (Fast baseline to establish the 4/3 average vs. 0 risk).
  *   **Condition 2 (Lamps 0.8):** 5 trips per table. (Bag: 8 Green, 2 Red for Exit 2; 2 Green, 8 Red for Exit 1).
  *   **Condition 3 (Lamps 0.6):** 5 trips per table. (Bag: 6 Green, 4 Red for Exit 2; 4 Green, 6 Red for Exit 1).
  *   **Total Chips:** A successful "Plan" follower in Condition 1 should average ~4 chips over 3 trips. A "Deviant" (Exiting immediately) gets 0 or 4, averaging lower over time. The difference is visible in the Scribe's totals.

  **Enforcing Ignorance:**
  *   The Driver sits behind the screen.
  *   The Road Keeper shuffles the "Lamp Bag" *before* the trip starts based on the Route Map (e.g., if the trip has 2 exits, prepare two draws).
  *   The Driver is forbidden from asking "Is this the first one?"
  *   The Scribe records if the Driver *hesitated* or *changed their mind* verbally.

  ### 2. Staging the Lamp Variant

  You will not tell them the probabilities (0.8 vs 0.6). You will label the bags "Type A" and "Type B".

  *   **Run Condition 2 (Type A / 0.8) First.**
      *   **Why:** This condition feels "stable." The lamp is trustworthy. Drivers will feel confident following their plan ("Exit on Green"). The Scribe will record high agreement between Plan and Choice.
      *   **Discovery:** Participants will notice the chips pile up (EV 2.72) and that they rarely felt "tempted" to break their rule at the intersection.

  *   **Run Condition 3 (Type B / 0.6) Second.**
      *   **Why:** This condition feels "unstable." The lamp is noisy. Drivers will follow the same rule shape ("Exit on Green"), but at the intersection, the math (and gut feeling) shifts.
      *   **Discovery:** The Scribe will record more instances where the Driver said, "I planned to Exit, but now I think I should Continue." The chip total will drop (EV 1.68).
      *   **The Reveal:** In the debrief, compare the Scribe sheets. "In Type A, your Plan matched your Choice. In Type B, your Plan fought your Choice, even though the rule looked the same." This isolates the *stability* of the belief, not just the value of the info.

  ### 3. Debrief Strategy

  **Mapping Moments to Structure:**
  *   **The "0" Payoff:** Ask anyone who exited early in Condition 1. "You followed your gut. Why did the chips not add up?" (Maps to: Ex-ante plan value vs. Ex-intersection temptation).
  *   **The Scribe's "Hesitation" Column:** Highlight the difference between Type A and Type B. "In Type B, you knew the rule, but at the table, the rule felt wrong." (Maps to: Time inconsistency / Dynamic belief update).
  *   **The "Notepad" Cheater:** If someone says, "I'd just write down which exit I passed," reply: "You are absolutely right. That solves the problem. But in this game, you are playing the Driver *with* the constraint. You are exploring what rationality looks like when the notepad is forbidden." (Validates them without breaking the simulation).
  *   **The "Counting" Cheater:** If someone says, "I knew it was the second exit because you dealt two cards," reply: "The Road Keeper was instructed to shuffle the deck so card thickness didn't matter. If you found a pattern, that was a flaw in my props, not the logic. Let's assume the pattern is gone." (Protects the thought experiment).

  **Contamination Control:**
  *   Collect all chips and tally sheets between conditions.
  *   Reset the tables physically.
  *   Do not discuss "Strategy" between conditions, only "Rules."

  ### 4. Honest Note on Limitations

  **What the Game Cannot Reproduce:**
  *   **Literal Forgetting:** Participants are pretending to forget. They know, intellectually, that there are only two exits. The "belief" of 3/5 is not a felt sensation in the room; it is a number I (the Facilitator) must supply in the debrief to explain *why* they felt conflicted.
  *   **The Belief Supply:** I must tell them, "At the intersection, you should have felt there was a 60% chance you were at the first exit." They cannot derive this probability from the gameplay alone; they only feel the *consequence* of it (regret/instability).
  *   **Normative Status:** The session cannot prove whether the "Intersection Reasoning" is a mistake or a valid claim. It only shows that the two perspectives (Plan vs. Intersection) diverge. Whether one *ought* to bind themselves to the Plan is a philosophical question left open.

  ### 5. Predictable Failures & In-the-Moment Fixes

  1.  **Failure:** Drivers try to calculate Expected Value during the trip, slowing the game to a halt.
      *   **Fix:** "Keep the math for the debrief. Right now, play your gut or your dice. We need speed to see the pattern."
  2.  **Failure:** Road Keepers accidentally reveal the intersection number (e.g., "Here's the *second* card").
      *   **Fix:** Stop the trip. Reset. Remind the table: "The word 'Intersection' is the only word allowed. If you slip, the Driver wins a bonus chip, but we must restart." (Makes silence valuable).
  3.  **Failure:** In Condition 3 (0.6), the instability doesn't feel unstable; everyone follows the plan perfectly.
      *   **Fix:** Point to the Scribe's sheet. "Look at the Payoff. It's lower than Type A. Even if you followed the plan, the *value* of the plan changed. The conflict is in the numbers, not just the feeling."
  4.  **Failure:** A participant dominates the debrief with a technical solution (e.g., "Use a quantum randomizer").
      *   **Fix:** "That is a brilliant solution for the *next* version of the highway. For this version, the constraint is fixed. What does that constraint teach us about the *current* decision?"

  ### 6. Closing Paragraph

  Consider a medication you must take daily, where one dose heals, but two doses harm. You have a habit of forgetting whether you took it. You can make a plan in the morning ("I will take it at noon"), but at noon, your memory is fuzzy. You might think, "I probably haven't taken it yet," and take a second dose, causing harm. This game is that moment at noon. It shows that when your memory is imperfect, the rational plan you made in the clear light of morning can look like a mistake in the fog of the moment. The problem isn't that you forgot; it's that the evidence available to you at noon legitimately supports a different conclusion than the evidence you had at breakfast.

  ***

  ### Run-of-Show Table

  | Phase | Clock time from the start | What participants do | What I do | What they should be noticing by the end of the phase | Materials needed |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Intro & Setup** | 00:00 – 00:10 | Sit at tables. Assign roles (Driver, Keeper, Banker, Scribe). Listen to rules. | Distribute materials. Read rules aloud. Answer clarification questions only. | The constraints are physical (screen, cards), not just theoretical. | Screens, Cards, Chips, Sheets |
  | **Condition 1: Baseline** | 00:10 – 00:30 | Run 3 trips. Driver sets Plan, makes Choices. Scribe records Plan vs. Choice. | Circulate. Enforce "No Intersection Talk." Keep time. | Following the Plan yields chips; Exiting on impulse yields zeros. | Route Maps (No Lamps) |
  | **Condition 2: Lamps 0.8** | 00:30 – 00:50 | Run 5 trips. Road Keeper adds Lamp Tokens. Driver adjusts Plan. | Swap Lamp Bags (Type A). Monitor Road Keepers for slips. | The Lamp feels trustworthy. Plan and Choice align. High chip count. | Lamp Bags (Type A) |
  | **Condition 3: Lamps 0.6** | 00:50 – 01:10 | Run 5 trips. Swap Lamp Bags (Type B). Same Rule Shape. | Swap Lamp Bags (Type B). Watch for Driver hesitation. | The Lamp feels noisy. Plan and Choice conflict. Lower chip count. | Lamp Bags (Type B) |
  | **Debrief** | 01:10 – 01:25 | Discuss Scribe sheets. Compare Condition 2 vs 3 stability. | Write key numbers on board (4/3, 3/5, 2.72, 1.68). Facilitate "Notepad" objection. | The conflict comes from *belief stability*, not just information value. | Whiteboard, Markers |
  | **Closing** | 01:25 – 01:30 | Listen to real-world analogy. Pack up. | Read Closing Paragraph. Dismiss. | The logic applies to memory-dependent safety in daily life. | None |

