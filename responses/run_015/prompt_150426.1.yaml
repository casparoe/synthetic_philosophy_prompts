      *   *Recommendation:* Revise (3) to acknowledge that obligations stem from harm to *near-future* identifiable people and a duty of consistency, OR revise (2) to allow obligations to "representative" individuals or future groups rather than specific tokens.
      *   *Strictly speaking:* The least costly revision to maintain moral intuition (3) is to soften (1) or (2). But since the user *accepts* (1) and *rejects* impersonal views, they are stuck in the Non-Identity trap.
