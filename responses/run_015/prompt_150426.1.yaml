  6.  **Refining the Argument on (3) vs (1)+(2):**
      *   If mitigation changes who is born (which it does), then the people in the "mitigated future" are not the same as the "unmitigated future".
      *   If (1) is accepted, the mitigated people are not harmed (they wouldn't exist otherwise).
      *   If (2) is accepted, we need identifiable victims to have obligations.
      *   Therefore, for distant future people, there are no identifiable victims of *inaction* (because the victims of inaction wouldn't exist if we acted).
      *   Therefore, (3) fails for the distant future under (1)+(2).
      *   *Exception:* Near-future people (next ~50-80 years) whose conception is not sensitive to policy changes. (3) holds for them.
      *   *Conclusion:* (3) is overextended.

  7.  **Refining the Argument on (4) vs (5):**
      *   User asks if there is a double standard.
      *   (4) Individual reproduction: NIP applies -> No wrong.
      *   (5) State policy: NIP applies -> No wrong.
      *   These are consistent. Both apply NIP.
      *   *However*, the tension is between (3) [We must mitigate] and (5) [Mitigation doesn't wrong anyone].
      *   If mitigation doesn't wrong anyone by *not* happening (due to NIP), why is there a stringent obligation to mitigate?
      *   Usually, obligations correlate with wronging. If no one is wronged by inaction, the obligation is weak (under PAV).
      *   So (4) and (5) are consistent with each other, but they jointly undermine (3).

  8.  **Finalising the Ranking:**
