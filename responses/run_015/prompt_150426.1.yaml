      *   (1) + (2) = A strict *Person-Affecting View* (PAV) combined with the *Non-Identity Problem* (NIP). This is the classic Parfitian setup. If you accept NIP and insist on identifiable victims for harm/wronging, you usually struggle to explain why identity-affecting choices are wrong.
      *   (3) Claims we have obligations to mitigate based on harm to *specific future people*.
      *   (4) & (5) Apply NIP to reproductive timing and policy-induced demographic shifts, claiming no wronging occurs.

  3.  **Evaluate Tensions (Pairwise Analysis):**

      *   **Tension A: (1) + (2) vs. (3)**
          *   *The Issue:* (3) claims obligations are justified by harm to *specific future people*. However, aggressive mitigation (like carbon pricing, lifestyle changes) changes social conditions, which changes who meets whom and when conception happens. This triggers the NIP.
          *   *Conflict:* If mitigation is identity-affecting (which it almost certainly is over the long term), then the specific people who exist in the mitigated future are *different* from those in the non-mitigated future.
          *   *Implication:* According to (1), these specific people are not worse off than they would have been (since the alternative is non-existence). According to (2), obligations must be owed to identifiable individuals. Therefore, if the people in the mitigated scenario aren't harmed (compared to their baseline of non-existence), to *whom* is the obligation owed?
          *   *Severity:* **Critical.** This is the heart of the Non-Identity Problem. Parfit's whole point was that (1) + (2) makes it impossible to claim (3) *if* the policy is identity-affecting. If the user claims (3) is justified by harm to specific people, they are denying the NIP applies to climate policy, or they are smuggling in an impersonal view.

      *   **Tension B: (3) vs. (5)**
          *   *The Issue:* (3) says we have stringent obligations to mitigate. (5) says mitigation policies do not wrong anyone (because of NIP).
