answer: |-
  The version of the slogan your friend needs to justify ignoring ideological argument is the "vulgar materialist" reading that ideas are powerless echoes with no causal feedback, and that reading is false.

  Here is the menu of claims hidden inside "the base determines the superstructure," ranked from plausible to false, with a verdict on each.

  **1. The Constraint Claim (Plausible)**
  *   **Claim:** Economic conditions set the boundaries of what is socially possible. You cannot sustain a ideology of divine kingship in an industrialized digital economy, just as you cannot have a gig economy without some legal concept of independent contracting.
  *   **Verdict:** **Mostly True.** Material reality limits the menu of viable ideas. This is the "boring" version nearly everyone accepts; ideas must be compatible with how people actually survive and produce.

  **2. The Legitimation Claim (Arguable)**
  *   **Claim:** The dominant ideas in any society tend to justify the interests of the dominant economic class. If landlords own the buildings, the law and morality will tend to frame property rights as sacred and eviction as neutral business practice.
  *   **Verdict:** **Real and Arguable.** This is the core of standard historical materialism. It is observable (lobbying, media ownership, think tanks), but it is not absolute. Counter-examples exist where ideas harm the ruling class (e.g., abolitionism harming slave owners), suggesting ideas aren't *perfectly* aligned with economic interest.

  **3. The Epiphenomenal Claim (False)**
  *   **Claim:** Ideas are merely smoke mirrors with no causal power of their own. Changing minds is impossible until the economics change, because the ideas are rigidly locked to the material base.
  *   **Verdict:** **False.** This is the version your friend relies on. It treats the superstructure as a shadow that cannot affect the object casting it. History shows ideas (religious movements, political theories, scientific paradigms) frequently trigger economic changes. If this were true, organizing itself would be impossible, since organizing is the act of changing people's minds about their collective power.

  **4. The Deductive Claim (False)**
  *   **Claim:** You can look at an economy and predict exactly what its culture or laws will be.
  *   **Verdict:** **False.** This is "vulgar Marxism." As you noted, similar economies (US vs. Sweden) have vastly different superstructures. This claim is falsified by basic comparative history.

  **Why Your Friend's Conclusion Fails**
  To get from "base determines superstructure" to "don't bother arguing," your friend must smuggle in Claim #3 (The Epiphenomenal Claim). He is treating ideas as inert dust rather than active tools. But this creates a performative contradiction: telling you to "go organize instead" is itself an ideological argument. He is trying to change your mind about what tactics are useful using *arguments*, while simultaneously claiming arguments don't work.

  Organizing *is* ideological work. Convincing a tenant they have rights against a landlord is changing the superstructure. If the superstructure couldn't change, unions couldn't form. The base changes when people act differently, and people act differently when they think differently.

  **Addressing Your Tripping Points**

  *   **Cross-National Differences:** These kill Claim #4 (Deductive) but not Claim #1 (Constraint). The "Constraint" view allows for different cultural paths within the same economic system. Your friend's counter-move (that history was economic further back) risks making the theory unfalsifiable—if every difference is blamed on some past economic ghost, the theory explains everything and predicts nothing.
  *   **Lagging/Leading Ideas:** The Protestant Ethic or Shareholder Value examples kill Claim #3 (Epiphenomenal). They prove ideas can lead material change. Engels' late-life hedge (that the base determines only "in the last instance" and ideas react back) is a necessary qualification to save the theory from being obviously false. It admits reciprocal causality. It makes the theory softer, but it prevents it from breaking when faced with history.
  *   **Engels' Hedge:** It is a real qualification, not just a dodge. It shifts the theory from "A causes B" to "A sets the boundaries within which B operates, but B can influence A." This saves the theory from falsification but reduces its predictive power.

  **Verdict on Your "Price List" Formulation**
  Your version ("economics sets the price list, not the beliefs") is actually a sophisticated and robust definition of historical materialism, closely aligning with later Marxist thinkers like Gramsci or Raymond Williams.

  *   **Is it historical materialism?** Yes. It retains the core insight that material conditions constrain ideology without falling into the trap of mechanical determinism.
  *   **Is it worth holding?** Yes. It is interesting enough to be useful because it explains *why* some true arguments fail (the cost is too high) and why some false ideas succeed (they are subsidized by the status quo).
  *   **What does it predict?** It predicts that outreach *will* fail if the material cost of adopting the idea is too high for the listener (e.g., asking a precarious worker to risk eviction without a union safety net), but it predicts outreach *will* succeed if you can lower the cost (e.g., building mutual aid so the risk is shared).

  This formulation saves you from your friend's fatalism. It acknowledges that you cannot argue someone into a idea that will get them crushed by their material reality, but it affirms that within the affordable range, arguments matter. It shifts the task from "change minds" to "change the cost of holding these minds," which is exactly what a tenants' union does.
