      *   *Check:* Is the Locked Baseline View central? Yes, the prompter specifically mentioned being unable to answer their student's challenge. This must be the heart of the exam.
      *   *Check:* Model Answer Word Count. I need to be careful not to write too little or too much.
      *   *Check:* Marking Scheme Consistency. Does the model answer actually hit the "A" criteria? Yes, if I write it to do so.

  7.  **Final Polish:**
      *   Ensure the tone is authoritative (examiner) yet helpful.
      *   Ensure the question forces the "actual philosophy" requested (testing positions, not summarizing).
      *   Verify the "Blocking Instructions" are clear.

  *(Self-Correction during drafting)*: I initially thought about keeping all four cases. But for a 90-minute exam, asking students to juggle four complex scenarios plus a theoretical view plus a moral weight explanation is too much. They will revert to summaries. I will consolidate the "Standing Order" variants into one complex scenario and keep "Extubation" as the contrast. I will make the "Locked Baseline" the theoretical hinge. This focuses the mind.

  *(Refining the Model Answer)*: I need to make sure the student voice doesn't sound like *me* (the AI examiner) but like a smart student. It should have a thesis statement. It should argue, not just describe.

  *(Refining the Marking Scheme)*: Make sure the "Common Errors" are specific to the prompt's concerns (e.g., "rehearsing the consequentialist/deontologist split").

