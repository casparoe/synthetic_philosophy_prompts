          4.  Write a marking scheme (20 marks, 5 must-hit points, A/B/C differentiation, common errors).
          5.  Check consistency between model answer and marking scheme.
      *   **Constraint 5 (Time/Format):** 90-minute closed book exam. One essay question.

  2.  **Brainstorming Cruces:**
      *   *Idea 1: The Arbitrary Baseline.* Focus heavily on whether the status quo (ventilator on/off, drug ordered/not) should determine moral status.
      *   *Idea 2: The Locked Baseline View.* Focus on the student's proposal about the "last unforced choice." This is rich because it shifts agency backward in time.
      *   *Idea 3: The Moral Weight.* Focus on *why* the distinction matters if the outcome is the same. Is it about rights, causation, or duty?
      *   *Selection:* The "Locked Baseline View" combined with the "Arbitrary Facts" problem is the strongest. It forces the student to define agency *temporally* and *causally*, not just categorically. It resists summary because it's a specific, novel proposal (from the prompt's context) that requires evaluation, not just recitation of Thomson or Quinn.
      *   *Why:* It prevents the standard "Consequentialists say X, Deontologists say Y" move. They have to evaluate a specific structural claim about agency.

  3.  **Drafting the Question:**
      *   *Stem:* Needs to be direct. "Evaluate the claim..."
