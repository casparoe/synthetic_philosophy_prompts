answer: |-
  ### 1. Brainstorming Cruces

  *   **Option A: The Arbitrary Baseline.** Focus on whether the moral status of an act changes based on prior technological settings (e.g., machine defaults).
  *   **Option B: The Locked Baseline View.** Focus on the student's proposal that agency is fixed by the last unforced choice in the causal chain.
  *   **Option C: The Moral Weight.** Focus on what normative work the distinction does if outcomes are identical.

  **Selection:** I am picking **Option B (The Locked Baseline View)** as the central crux, anchored by the **Standing Order** and **Extubation** cases.
  **Why:** This resists memorization because the "Locked Baseline View" is not a standard textbook position (like Doctrine of Double Effect); it is a novel structural claim provided in the exam material. To answer well, candidates cannot recite Thomson or Quinn; they must evaluate the internal logic of this specific view against the provided cases. It forces them to do metaphysics of agency rather than history of ethics.

  ***

  ### 2. The Exam Question

  **PHI 305: KILLING, LETTING DIE, AND THE SHAPE OF AGENCY**
  **FINAL EXAMINATION**
  **Time Allowed: 90 Minutes**
  **Closed Book**

  **Answer the following question.**

  **Question 1**
  Consider the following two clinical scenarios:

  *   **The Standing Order:** A hospital dosing system is flagged to administer a lethal drug unless a nurse overrides it within 90 seconds. Nurse N sees the alert, knows the override, and does nothing. The patient dies. In Variant A, the flag was set by a colleague; in Variant B, it was set by a random system error.
  *   **The Extubation:** A ventilated patient will die within minutes if the tube is withdrawn, and would have died in the same way if the tube had never been inserted. Withdrawing the tube is typically classified as "letting die," identical in moral status to never having started treatment.

  A student proposes the **Locked Baseline View**: whether an agent kills or lets die is settled not by their immediate action, but by the last earlier choice at which some agent had an unforced option to alter the course of events. On this view, in the Standing Order, the relevant agent is whoever entered the flag, not Nurse N.

  Write an essay that addresses the following:
  1.  Propose a clear criterion for distinguishing *killing* from *letting die* that does not rely on the agent's intentions or motives.
  2.  Apply your criterion to **The Standing Order** (both variants) and **The Extubation**. Does your classification shift across the variants?
  3.  Evaluate the **Locked Baseline View**. Does it successfully explain our intuitions about Nurse N, or does it make the distinction hostage to arbitrary history?
  4.  Explain what moral work the distinction is tracking (e.g., rights, duties, causation). Why should this distinction matter if the patient is dead either way?

  **Instructions:**
  *   Do **not** appeal to the Doctrine of Double Effect or the agent's intentions. This question concerns the structure of agency, not the mind.
  *   Do **not** simply summarize the standard debate between consequentialists and deontologists. You must take a position on what the distinction *consists in*.
  *   You are not required to cite specific authors. Argue from first principles.

  ***

  ### 3. Model Answer

  **Candidate Number: 000**

  The distinction between killing and letting die collapses if it tracks only outcomes, yet it remains vital if it tracks the structure of agency. To distinguish them without relying on intention, I propose the **Intervention Criterion**: an agent kills when they introduce a new lethal sequence into the world; they let die when they fail to interrupt an existing lethal sequence. This criterion focuses on the agent's relationship to the causal chain leading to death, rather than the mental state accompanying the action.

  Applying this to **The Extubation**, the classification is stable. Whether one withdraws the tube or never inserts it, the patient dies due to the underlying pathology, not due to a new intervention. The ventilator is an interruptive force against nature; removing it allows the natural lethal sequence to resume. Thus, both are cases of letting die. This aligns with the intuition that the moral status should not depend on the arbitrary timing of when treatment began.

  **The Standing Order** is more difficult. Under the Intervention Criterion, Nurse N fails to interrupt a lethal sequence initiated by the system. Therefore, N lets die. However, the variants challenge this. In Variant A (colleague set the flag), the colleague introduced the lethal sequence. In Variant B (random error), the system did. If N merely fails to override, N lets die in both cases. However, our intuition might suggest N is more culpable in Variant A because N is complicit in a colleague's error, whereas Variant B is a tragedy of malfunction. Yet, strictly speaking, regarding the *act type*, N lets die in both. The distinction remains descriptive; culpability may vary based on duty, but the action is allowing.

  This leads to the **Locked Baseline View**. This view claims agency is fixed by the last unforced choice in the causal chain. In the Standing Order, this exonerates Nurse N from "killing" by shifting the agency to the flag-setter. While this preserves the intuition that N is less culpable than a murderer, it fails as a general theory of agency. It makes the moral description of an act hostage to arbitrary history. If the flag was set by a child, or a machine programmed decades ago, the "last unforced choice" becomes obscure or irrelevant to the current emergency. More dangerously, it implies that if I walk past a drowning child because someone else pushed them in earlier, I am merely letting die solely because of that prior choice. But if I had pushed them myself moments before, I would be killing. The Locked Baseline View suggests the moral quality of my inaction depends entirely on who acted first. This renders the distinction unstable. We should judge the agent present at the crisis based on their available options, not the historical pedigree of the threat.

  Therefore, I reject the Locked Baseline View. It confuses the *origin* of a threat with the *management* of it. Nurse N lets die, but may still be morally culpable depending on their duty to intervene.

  Finally, what moral work does this distinction track? It cannot be the outcome, as the patient dies regardless. It must track **claims over agency**. Killing violates a negative right—the claim others have that I not use my agency to harm them. Letting die violates a positive duty—the claim others have that I use my agency to help them. Negative rights are generally stricter because they protect autonomy from intrusion; positive duties are limited by capacity and cost. In The Extubation, the patient has no claim that I sustain their life at all costs (positive duty), but they have a strong claim that I not inject them with poison (negative right). In The Standing Order, N violates a professional positive duty to override errors, but does not violate the patient's negative right against intrusion.

  A serious objection arises: in institutional settings, does this distinction collapse? If a hospital administrator funds a program that kills (Screening Case) versus one that fails to save, the outcome is statistical death. If I argue that the distinction tracks negative vs. positive rights, the administrator might argue that funding decisions are all "actions" introducing lethal sequences. However, even here, the Intervention Criterion holds. Diverting funds from a working program introduces a new lethal sequence (withdrawal of support); declining to fund a new program fails to interrupt a pre-existing risk. The distinction survives, tracking whether the agent made the world worse than it was, or merely failed to make it better. This preserves the moral weight of the distinction without relying on arbitrary baselines or historical luck.

  ***

  ### 4. Marking Scheme (20 Marks)

  | Point | Criteria (A / B / C) | Common Errors |
  | :--- | :--- | :--- |
  | **1. Criterion Definition** (4 marks) | **A:** Proposes a clear, non-circular criterion (e.g., Intervention, Counterfactual Dependence) distinct from intention. <br> **B:** Defines distinction but relies on vague terms like "active vs. passive." <br> **C:** Fails to define or defines solely by moral outcome ("killing is worse"). | Candidates often define killing as "intentional harm," violating the instruction to ignore intention. |
  | **2. Case Application** (4 marks) | **A:** Applies criterion consistently to Standing Order variants and Extubation; notes where intuition clashes with criterion. <br> **B:** Applies criterion but ignores the variants or treats cases inconsistently. <br> **C:** Describes cases without applying the proposed criterion. | Candidates often treat the variants as entirely separate problems rather than testing one criterion across them. |
  | **3. Locked Baseline Evaluation** (4 marks) | **A:** Takes a clear stand (accept/reject) and argues based on arbitrariness or stability of agency. <br> **B:** Explains the view but hedges on evaluation; lacks a decisive argument. <br> **C:** Summarizes the view without evaluating its philosophical merit. | Candidates often accept the view because it "feels right" about the nurse, missing the "arbitrary history" trap. |
  | **4. Moral Weight** (4 marks) | **A:** Explains *why* the distinction matters (e.g., negative vs. positive rights, autonomy) independent of outcome. <br> **B:** States it matters but offers generic reasons ("it's stricter"). <br> **C:** Claims it doesn't matter (consequentialist collapse) despite prompt instructions. | Candidates often revert to "consequentialists say it doesn't matter" summaries instead of arguing for the weight. |
  | **5. Objection/Refinement** (4 marks) | **A:** Anticipates a serious counter-argument (e.g., institutional collapse) and defends the position. <br> **B:** Raises an objection but offers a weak or unrelated response. <br> **C:** No objection raised; essay ends abruptly. | Candidates often raise a "straw man" objection that is easily dismissed without real work. |

  **Consistency Check:**
  The Model Answer earns full marks under this scheme:
  1.  **Criterion:** Clearly states "Intervention Criterion" (new lethal sequence vs. failure to interrupt). (A)
  2.  **Application:** Applies to Extubation (stable) and Standing Order (N lets die in both, notes culpability nuance). (A)
  3.  **Locked Baseline:** Explicitly rejects it based on "arbitrary history" and the "drowning child" analogy. (A)
  4.  **Moral Weight:** Identifies "Negative vs. Positive Rights/Claims." (A)
  5.  **Objection:** Addresses the "Institutional/Screening" collapse objection and defends the criterion. (A)

  *Adjustment:* I ensured the Model Answer explicitly addressed the "Screening" intuition in the final paragraph (as an objection) even though I dropped it from the main question stem, to ensure Point 5 is fully satisfied without cluttering the exam prompt. This keeps the exam focused but allows the strong student to show breadth in the answer.
