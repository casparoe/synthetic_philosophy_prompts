      *   *Sub-questions:*
          1.  Define the distinction (criterion).
          2.  Apply to cases (does the criterion hold?).
          3.  Evaluate the Locked Baseline View.
          4.  Explain the moral weight (what is being tracked?).
      *   *Blocking Instructions:* No naming theorists. No appealing to intention (Double Effect). Must take a stand.

  4.  **Drafting the Model Answer:**
      *   *Voice:* Strong third-year student. Confident, analytical, not overly verbose but precise.
      *   *Criterion:* Needs to be clear. Maybe "Counterfactual Dependence" or "Agency as Intervention." Let's go with "Agency as the Introduction of a New Lethal Sequence."
      *   *Testing:* Apply to Standing Order (Nurse vs. System). Apply to Extubation (Withdrawing vs. Not Starting).
      *   *Locked Baseline:* Reject it. Why? It makes moral status depend on historical accidents (who set the flag).
      *   *Moral Weight:* What does the distinction track? Maybe "Violation of a Negative Right vs. Failure to Fulfill a Positive Duty."
      *   *Objection:* What if the negative/positive duty distinction collapses in institutional settings? Address that.
      *   *Word Count:* Keep an eye on 800-900 words.
      *   *Consistency:* Ensure the answer hits the 5 marking points.

  5.  **Drafting the Marking Scheme:**
      *   *Total:* 20 marks.
      *   *5 Points (4 marks each):*
          1.  Criterion Definition (Clear, non-circular).
          2.  Case Application (Consistent use of criterion).
