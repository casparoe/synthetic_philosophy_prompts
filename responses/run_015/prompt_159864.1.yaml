answer: |-
  This is a sophisticated impasse, and it arises because your normative theory (protective substitutability) is pulling in a different direction than the positive legal architecture you are trying to repair (the Convention regime). You are correctly sensing that patching the *definition* of a refugee (Question 1) does not solve the *allocation* of responsibility (Question 2), and that the latter threatens to undermine the former.

  Here is an analysis of both problems and a proposal for how to resolve them in your chapter without abandoning your core claim that states must admit refugees.

  ### 1. The Sixth-Ground Repair vs. Surrogate Protection

  You ask whether adding a sixth ground (environmental deprivation) is consistent with the surrogate-protection reading. The short answer is: **It is legally pragmatic but theoretically imprecise.**

  **The Tension:**
  Your theory posits that the trigger for protection is the *failure of the state's protective function*. The 1951 Convention grounds (race, religion, etc.) are proxies for a specific *kind* of failure: one where the state is either the perpetrator or complicit in discrimination (unwillingness).
  Environmental collapse, however, often represents *incapacity* rather than *unwillingness*. A state may wish to protect its citizens from sea-level rise but lack the resources.
  *   **If your theory covers incapacity:** Then a sixth ground is consistent, but you must explain why we stop there. Why not economic collapse? Why not pandemic failure? If the trigger is simply "protective failure," a list of grounds is theoretically unnecessary; a functional test ("is effective protection available?") would be more honest to your account.
  *   **If your theory covers only unwillingness:** Then environmental deprivation only fits if you can show the state is *discriminating* in its relief (e.g., allowing one region to drown while saving another).

  **The Recommendation:**
  Do not abandon the sixth-ground proposal, as it is the only viable *legal* reform path. However, in the chapter, clarify that the sixth ground is a **heuristic device** to capture a specific subset of protective failures that the 1951 drafters missed, rather than an exhaustive moral category.
  *   **Refinement:** Argue that severe environmental deprivation functions *analogously* to persecution in the modern context. It renders the state relationship void of protection, regardless of intent. The "sixth ground" is the legal vessel; the "surrogate protection" is the moral cargo.
  *   **Warning:** If you argue that *any* protective failure triggers the duty, you risk collapsing the distinction between refugees and economic migrants. You need a threshold of "severity" or "existential threat" to keep the class determinate, even if you reject the "numbers objection."

  ### 2. The Assignment Problem (Who Must Admit?)

  This is the more dangerous philosophical trap. You are considering concluding that the duty to admit has **no determinate bearer** at the level of principle.
  **Do not write this.** If you conclude the duty is unassignable, you inadvertently validate the status quo of non-entrée. If no specific state has a duty to *this* person, then no state is obligated to open its border, and the "right to asylum" evaporates into a "right to seek asylum somewhere else."

  The problem you are facing is the distinction between the **source** of the duty and the **allocation** of the duty.

  *   **Source:** The duty arises from the human need for protection + the failure of the home state (your surrogate protection account). This duty exists *erga omnes* (toward everyone).
  *   **Allocation:** Which specific state must act?

  **Why "Arrival" is Defensible (Provisionally):**
  You are right that arrival is luck. But in the absence of a global allocation scheme, arrival creates a **provisional jurisdiction**.
  Think of it like a rescue duty at sea. If a ship is sinking, the duty to rescue falls on the international community. But if *Ship A* is the closest, *Ship A* has the immediate duty, even if *Ship B* has more capacity. Why? Because the immediacy of the need trumps the fairness of the distribution *in the moment*.
  *   **The Argument:** The duty to admit attaches to the state of arrival not because arrival is morally significant in itself, but because it is the only **actionable trigger** available in a non-ideal world. To require a fair allocation scheme *before* admitting refugees is to condemn them to harm while we deliberate.

  **Why "Unassignable" is Wrong:**
  If you claim the duty is unassignable, you are essentially arguing for a **Collective Duty without Individual Obligations**. In moral philosophy, this is often a dead end (see the "problem of many hands"). If the duty is collective, but no individual agent is obligated to act, the duty is inert.
  *   **Better Formulation:** The duty is **collective in origin but provisional in assignment.**
      *   *Principle:* The international community owes protection.
      *   *Practice:* In the absence of a quota/treaty system, the state of jurisdiction (arrival) bears the **provisional burden** of discharge.
      *   *Correction:* That state then has a secondary right to demand burden-sharing (resettlement, funding) from others.

  ### 3. Synthesizing the Chapter's Claim

  You asked: *If the duty to admit really is unassignable in principle, what follows for the chapter's claim that states must take refugees in?*

  If you follow your current worry, the claim becomes: "States generally must take refugees, but no specific state is obligated to take a specific refugee." This is politically toothless.

  **The Stronger Claim:**
  You should defend the claim that **states must take refugees, but the fairness of that burden is a separate justice question.**
  Separate the **Humanitarian Imperative** (admit the person now) from the **Distributive Justice** (share the burden later).
  *   **Step 1:** The state of arrival has a duty to admit based on *capacity to help* and *presence*, analogous to a duty of rescue. This is not arbitrary; it is functional.
  *   **Step 2:** The arbitrariness of geography is rectified not by refusing admission, but by enforcing a robust duty of **burden-sharing** among states.

  **How this fixes your "Protective Substitutability" account:**
  If the home state failed its protective function, the international community acts as the surrogate. The "surrogate" is not a single state, but the **regime**. The state of arrival is merely the **local agent** of that regime.
  *   This allows you to keep the "sixth ground" (expanding the class).
  *   This allows you to keep the "duty to admit" (binding the state of arrival).
  *   This acknowledges the "luck of arrival" without letting it void the duty.

  ### Specific Revision Advice

  1.  **Reframe the Sixth Ground:** Present it not as "completing the list" but as "updating the proxies for state failure." Acknowledge that a purely functional test (is protection available?) is theoretically superior but legally unworkable; the sixth ground is the necessary legal translation of your theory.
  2.  **Reject the "Unassignable" Conclusion:** Instead, argue that the duty is **determinate but unfairly distributed.** The state of arrival *does* have the duty, but they are being asked to bear a collective burden alone.
  3.  **The "Rescue" Analogy:** Use this to bridge the gap. We do not say a passerby has no duty to save a drowning child because "it's luck they walked by." We say they have a duty to save, and society has a duty to compensate them for the risk/cost. Apply this to states.
  4.  **Reference Points:**
      *   **David Miller:** On why states have special duties to those within their jurisdiction (even if arrival is arbitrary).
      *   **Joseph Carens:** On the "ethical ideal" vs. "political reality" of borders.
      *   **Matthew Gibney:** On the "ethics of deportation" and the nature of the duty to admit.
      *   **Serena Parekh:** On the "refugee crisis" as a crisis of containment rather than numbers; she addresses the structural assignment problem well.

  **Bottom Line:**
  Your "protective substitutability" theory is strong enough to carry the argument, but only if you treat the duty to admit as a **provisional obligation of the state of presence** pending fair distribution. Do not let the perfection of the allocation mechanism block the necessity of the admission duty. The chapter should conclude that while the *distribution* of refugees is currently unjust, the *obligation to admit* remains binding on the state of arrival as the immediate agent of the international surrogate.
