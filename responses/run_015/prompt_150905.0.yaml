negligence from pure accident in a way that explains sentencing practice), and flag the weakest point in my reply—probably that my reconstructed Dennett still needs a normative “ought” that evolutionary description alone does not supply. Include the one objection I am hoping nobody asks: that my view licenses punishing the more “competent” agent more severely precisely because she “should have known better,” which sounds indistinguishable from classic retributivism graded by capacity rather than abolished. Order them by how damaging they are to the proposal’s survival in this room, not by philosophical importance.
