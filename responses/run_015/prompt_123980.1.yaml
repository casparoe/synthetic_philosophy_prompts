answer: |-
  ### Requirements Specification: Chance-Deference Module

  **1. Single-Case Applicability** (*The Last Toss*)
  *   **Requirement:** The rule must map a chance value to a credence value for individual events, not just long-run frequencies.
  *   **Consideration:** The agent acts on single trials; waiting for frequency convergence is computationally and practically useless.

  **2. Higher-Order Coherence** (*Chance Laundering* & *Two Weather Services*)
  *   **Requirement:** The module must compute credence as the expectation of chances weighted by the credence in each chance-hypothesis ($C(A) = \sum C(A|Ch_i)P(Ch_i)$).
  *   **Consideration:** **These two cases are the same requirement.** Both describe uncertainty *about* the chance function itself (noisy channel vs. conflicting experts); the math is identical.

  **3. Admissibility Filter** (*The Tipster's Shadow* & *The Self-Erasing Bias*)
  *   **Requirement:** The rule must reject deference when the input evidence correlates with future outcomes or future chance-functions.
  *   **Consideration:** Deferring to chance while holding "crystal ball" info leads to immediate Dutch-booking.

  **4. Interventional Compatibility** (*The Truck on the Bridge*)
  *   **Requirement:** The chance input must be indexed to the agent's specific action/intervention, not just the state of the world.
  *   **Consideration:** Expected utility requires $P(Outcome | Do(Action))$, not $P(Outcome | Action)$.

  **5. Regularity/Measure-1 Confidence** (*Chance One But Not Certain*)
  *   **Requirement:** If the chance function assigns measure 1 to an event, the agent's credence must be 1 (betting quotient 1:0).
  *   **Consideration:** Deviating here creates a guaranteed loss against a bookie who knows the measure space.

  **6. Self-Locating Consistency** (*The Fission Box*)
  *   **Requirement:** The rule must handle indexical uncertainty (which copy am I?) distinct from objective chance.
  *   **Consideration:** Branch weights are not always credences; conflating them leads to the "halfer/thirder" errors in decision making.

  **7. Level Invariance** (*The Demon*)
  *   **Requirement:** **This case is confused.** If the agent has complete micro-physical information, it calculates outcomes; it does not *defer* to chances.
  *   **Consideration:** Deference is an epistemic shortcut for ignorance. Complete knowledge renders the chance-module obsolete.

  ---

  ### Critical Analysis

  **Non-Negotiable vs. Taste**
  *   **Non-Negotiable:** Single-Case, Higher-Order Coherence, Admissibility Filter, Interventional Compatibility, Regularity. (Failure here = money-pump).
  *   **Taste:** Self-Locating Consistency (depends on agent architecture), Level Invariance (irrelevant if knowledge is complete).

  **Your Suspicions**
  *   "Readable off frequencies": **Taste.** (Correct to reject; single-case matters).
  *   "Causally inert": **Taste.** (Correct to reject; chances must guide action).
  *   "Derivable from Dutch-book": **Your suspicion is WRONG.** This is **Non-Negotiable**. If the rule isn't coherence-enforcing, your agent loses money by definition.

  **Deference vs. Conditionalization**
  *   **The Bite:** You cannot treat "Chance(A)=x" as ordinary evidence $E$ to condition on ($C(A|E)$). If $E$ implies inadmissible info (e.g., about the future), conditionalization overrides deference, breaking the rule.
  *   **Fix:** Chance hypotheses must constrain the *prior*, not just serve as evidence. The rule is a constraint on $C_0$, not an update rule for $C_t$.

  **Jointly Unsatisfiable Desiderata**
  *   **The Set:** Humean Supervenience (chances are just summaries of history) + Strict Principal Principle + Admissibility Filter.
  *   **Why:** If chances supervene on the total history, knowing the current chance function gives probabilistic info about the future history (Undermining), which is inadmissible. You cannot have all three.

  **The Killer Requirement**
  *   **The Self-Erasing Bias (Undermining).** This is the only requirement that breaks the standard Lewisian formulation. If your simulator allows future physics to alter present chance-functions, a simple $C(A|Ch(A)=x)=x$ will crash. You need the "New Principal Principle" (conditioning on the whole history of chance functions).

  ---

  ### Philosophical One-Liners

  *   **Lewis-style Admissible-Information:** Defer to chance unless you have a crystal ball; if the future leaks into the present, the rule breaks.
  *   **Best-System/Humean:** Chances are just the most concise summary of past and future events; they supervene on the history, causing the undermining problem.
  *   **Propensity View:** Chances are physical dispositional properties of the setup; they exist independently of history, avoiding undermining but hard to measure.
  *   **Expert Calibration:** Treat the chance function as a guru; if the guru is reliable, copy their numbers, but check if they know more than you.
