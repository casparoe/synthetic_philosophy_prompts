      *   *Skepticism:* We cannot know necessary connections in nature.
      *   *Naturalism:* We *do* believe in causation and induction; philosophy explains *why* (psychology), not *that* it is rationally grounded.
      *   *Probability:* Hume wrote about probability (in *Treatise* and *Enquiry*), largely seeing it as a measure of belief strength based on past frequency, not a logical calculus of truth.

  3.  **Analyze Solomonoff Induction through Humean Eyes:**
      *   *The Formalism:* A prior over programs weighted by $2^{-length}$.
