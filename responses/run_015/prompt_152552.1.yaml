answer: |-
  # The Separateness Stress-Test (SST)
  **Time to complete:** 10–15 minutes  
  **Purpose:** Flag policy proposals or study designs that treat individuals as "interchangeable batteries" for the greater good.  
  **Philosophical Engine:** Rawls/Nozick's "Separateness of Persons" objection to utilitarianism.

  This tool does not tell you what is *good*. It tells you when a proposal is ethically *dangerous* because it sacrifices specific people as means to an end.

  ---

  ## Part 1: The Checklist

  ### Step 1: The Targeting Test (Who pays?)
  *Identify the group bearing the primary cost/risk.*

  *   **[ ] Diffuse Burden:** The cost is spread across a large population (e.g., a small tax on everyone, minor inconvenience).
      *   *Action:* **PASS.** Proceed to Step 2.
  *   **[ ] Targeted Sacrifice:** The cost falls heavily on a specific, identifiable group (e.g., one town, one demographic, trial participants).
      *   *Action:* **FLAG.** This triggers the Separateness Objection. Proceed to Step 2 immediately.

  ### Step 2: The Means Test (How are they used?)
  *Ask: Is this group harmed *to achieve* the goal, or just *while* achieving it?*

  *   **[ ] Incidental:** The harm is a side effect (e.g., traffic delays from construction).
      *   *Action:* **PASS.** Proceed to Step 3.
  *   **[ ] Instrumental:** The harm is necessary for the mechanism to work (e.g., their data is needed, their bodies are the shield, their job loss balances the ledger).
      *   *Action:* **STOP.** This is a high-risk violation. You must pass Step 3 to continue.

  ### Step 3: The Compensation-in-Principle Test (The Kaldor-Hicks Check)
  *Ask: Could the winners theoretically pay the losers enough to make them whole, and still have gain left over?*
  *(Note: Do not check if they actually paid. Check if they **could**.)*

  *   **[ ] Incommensurable Harm:** The loss involves death, permanent disability, loss of rights, or cultural erasure that money cannot fix.
      *   *Action:* **FAIL.** (Red Light). The proposal violates separateness. Stop filing.
  *   **[ ] Compensable Harm:** The loss is financial, temporal, or physical but reparable (e.g., lost wages, temporary illness).
      *   *Action:* **PASS.** Proceed to Step 4.
  *   **[ ] Impossible Math:** The total gains are smaller than the total losses.
      *   *Action:* **FAIL.** (Red Light). Pure sacrifice. Stop filing.

  ### Step 4: The Consent & Recourse Check
  *Ask: Do the losers have a voice or an exit?*

  *   **[ ] Consent Given:** Participants opted in with full knowledge of risk.
      *   *Action:* **GREEN LIGHT.** (Ethically permissible, subject to your values).
  *   **[ ] Consent Waived (Public Duty):** No individual consent, but role-based duty exists (e.g., soldiers, nurses) + **Guaranteed Recourse** (injury fund, retraining).
      *   *Action:* **YELLOW LIGHT.** (Hand-off to Editor/Values).
  *   **[ ] No Consent / No Recourse:** Forced sacrifice with no safety net.
      *   *Action:* **RED LIGHT.** (Ethical Violation).

  ---

  ## Part 2: Limitations (What This Tool Is Blind To)
  *Do not publish this section, but keep it on your desk.*

  1.  **The "Checkbook Ethics" Blind Spot:** The tool passes any atrocity if the compensation math works *in principle*. It cannot detect when compensation is theoretically possible but politically impossible.
  2.  **Structural Injustice:** It treats all groups as equal starting points. It does not catch if the "Targeted Sacrifice" group is historically marginalized (e.g., sacrificing a poor neighborhood is worse than sacrificing a rich one, even if compensation is equal).
  3.  **Time Lag:** It struggles with intergenerational harm. Future people cannot be compensated by current gainers.
  4.  **Your Own Bias:** This tool is deontological (rights-based). It will flag utilitarian efficiency as "risky." That is by design, but be aware you are using a rights-filter, not a outcomes-filter.

  ---

  ## Part 3: Field Test (Applied to Your Cases)

  ### Case 1: Mandatory Risky Vaccine for Nurses
  *Proposal: Nurses must take a new vaccine with known 1% severe side-effect risk to protect immunocompromised patients.*

  *   **Step 1 (Targeting):** **Targeted.** (Nurses specifically, not the general public).
  *   **Step 2 (Means):** **Instrumental.** (Their bodies are the firewall).
  *   **Step 3 (Compensation):** **Compensable.** (Medical bills and lost wages can be paid by the hospital/state). *Note: If risk includes death, this moves toward Incommensurable.*
  *   **Step 4 (Consent):** **Consent Waived (Public Duty).** (Employment mandate).
  *   **Verdict:** **YELLOW LIGHT.**
  *   **Journalist Note:** This is a **Hard Case**. The tool stops here because it becomes a values question: *Does professional duty override bodily autonomy?* The tool cannot answer this. You must write the story about the tension, not just the policy.

  ### Case 2: Carbon Tax Wiping Out One Coal Town
  *Proposal: A tax structure that makes one specific town's mine unviable, lowering global emissions. Revenue funds a "Transition Trust."*

  *   **Step 1 (Targeting):** **Targeted.** (One specific town).
  *   **Step 2 (Means):** **Instrumental.** (The town's economic destruction is the mechanism for emission reduction).
  *   **Step 3 (Compensation):** **Compensable.** (Global economic gains from climate stability vastly exceed the town's GDP. The "Transition Trust" is the payment mechanism).
  *   **Step 4 (Consent):** **No Consent.** (Policy is top-down).
  *   **Verdict:** **GREEN LIGHT.**
  *   **Journalist Note:** **You will probably hate this.** The tool says this is ethically permissible because the winners *could* (and in this proposal, *do*) compensate the losers. It validates the "slick utilitarian" argument that money solves the rights violation. Your job is to interrogate whether the compensation *actually* covers the cultural loss of the town, which the tool assumes it does.

  ### Case 3: Clinical Trial with Placebo & Avoidable Harm
  *Proposal: Patients randomly assigned to placebo. Researchers know a subset will suffer permanent harm that existing treatment could have prevented.*

  *   **Step 1 (Targeting):** **Targeted.** (The placebo group).
  *   **Step 2 (Means):** **Instrumental.** (Their suffering generates the data).
  *   **Step 3 (Compensation):** **Incommensurable / Impossible.** (Permanent harm cannot be fully undone. Future patients who benefit cannot pay back past patients).
  *   **Step 4 (Consent):** **Consent Given?** (Even if they signed a form, knowing harm is *avoidable* usually voids ethical consent).
  *   **Verdict:** **RED LIGHT.**
  *   **Journalist Note:** **Clear Violation.** This treats the placebo group as batteries. The Separateness Objection holds firm here. You can file the story as an ethical expose.

  ---

  ## How to Use This in Your Copy
  When you see a "Greater Good" argument:
  1.  Run the **Targeting Test**. If it's diffuse, the utilitarian argument is usually safe.
  2.  If it's targeted, demand the **Compensation Plan**. If they say "the greater good is payment enough," quote the **Compensation-in-Principle Test** and call it a violation.
  3.  If the tool gives a **Green Light** (like the Carbon Tax), don't kill the story. Pivot. The story is no longer "Is this ethical?" The story is "Why does ethical permission feel like violence?" That's where the real policy friction lives.
