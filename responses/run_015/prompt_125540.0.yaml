answer: |-
  # PREP SHEET: Rietdijk-Putnam vs. Presentism & Moving Spotlight
  **Goal:** Defend claim that RPA kills MST just as hard as Presentism (frame-relative velocity of "now" is metaphysically untenable).
  **Room:** 2 Presentists (Andromeda-savvy), 1 GR Realist, Cluster of Metaphysicians (supervenience hawks).

  ---

  ## 1. OBJECTIONS (In Order of Fire)

  ### Objection 1: The Category Error (Metaphysicians)
  **They'll say:** "You're conflating epistemic access with ontology. Just because simultaneity is relative to an *observer* in SR doesn't mean the *metaphysical fact* of presentness is. You're demanding physical coordinates for a primitive metaphysical property."
  **Your Reply:** "If presentness is a real property of events (as MST claims), and events are in spacetime, that property must supervene on the spacetime structure. If the 'edge' of that property shifts differently for different inertial frames, you have contradictory facts about which events are 'real' in the same manifold."
  **⚠️ SOFT SPOT:** You are assuming **Supervenience**. If they argue metaphysical facts *don't* supervene on physical facts (brute metaphysics), your physics argument bounces off. You have no knock-down against brute facts other than "that's cheating."

  ### Objection 2: The Cosmological Out (Presentists)
  **They'll say:** "We know SR has no preferred frame, but our *universe* does. The CMB rest frame provides a privileged simultaneity slice. Presentism only needs to be true in *our* world, not all SR models."
  **Your Reply:** "That makes Presentism/MST contingent on cosmology, not metaphysics. If the universe were slightly less homogeneous, your 'now' vanishes. A metaphysical theory shouldn't depend on the distribution of matter."
  **⚠️ SOFT SPOT:** They don't care if it's contingent. If it works *here*, they win. You're arguing modal strength; they're arguing actuality.

  ### Objection 3: The GR Hammer (GR Person)
  **They'll say:** "SR is a local approximation. In GR, global simultaneity slices often don't exist (e.g., Gödel spacetime), but in FLRW models, they do. You're basing a metaphysical knockout on a local symmetry that breaks globally. RPA is moot in curved spacetime."
  **Your Reply:** "Locally, the light cone structure still holds. If the 'spotlight' moves through a local neighborhood, it still faces the RPA problem in that tangent space. You can't hide the metaphysical contradiction in the curvature."
  **⚠️ SOFT SPOT:** **This is your biggest physical vulnerability.** In GR, you can foliate spacetime by constant cosmic time. If the MST rides that foliation, it's frame-invariant *globally*. Your SR-based velocity argument might not apply to the specific foliation our universe actually admits.

  ### Objection 4: The "Motion" Strawman (MST Proponents)
  **They'll say:** "The spotlight doesn't 'move' with a velocity in the manifold. It's a primitive ordering of times. Asking for its velocity is like asking for the velocity of 'truth'."
  **Your Reply:** "If it doesn't move, there is no passage. If there is passage, there is a rate of change. If there is a rate of change relative to spacetime, there is a velocity. Don't use 'primitive' to hide the incoherence."
  **⚠️ SOFT SPOT:** They can define "passage" as a brute phenomenological fact that doesn't require a metric velocity. You risk arguing against a definition they don't hold.

  ---

  ## 2. THE PRAYER QUESTION
  **Pray they don't ask:**
  *"If the Moving Spotlight is a metaphysical addition to the block, why must its 'speed' be defined by the spacetime metric at all? Can't it have a metaphysical rate (1 second per second) that is invisible to the physics?"*

  **Why this kills you:** If you admit the rate is metaphysical and undetectable, you lose the RPA leverage (which relies on physical simultaneity). If you deny it, you look like you're demanding empirical verification for metaphysics (which the Metaphysicians will eat alive).

  ---

  ## 3. HONESTY CHECK

  **What would actually change my mind?**
  1.  **Lorentz Violation:** If experimental physics found evidence of a preferred frame (e.g., variable speed of light dependent on direction), RPA loses its physical teeth.
  2.  **Non-Supervenience Argument:** A rigorous proof that metaphysical facts (like "being present") do not need to supervene on physical/spacetime facts. If "presentness" is a brute fact that floats above the manifold, my argument that it conflicts with the manifold fails.

  **Where is the reasoning shakiest?**
  **The assumption that MST requires a "velocity."**
  I am treating the Moving Spotlight as a physical wave sweeping over coordinates. Most sophisticated MST defenders (like Skow or Maudlin) argue the "movement" is not a change in the block, but a primitive feature of temporal ontology. By insisting it must have a frame-relative velocity, I might be attacking a crude version of MST they don't actually hold. I need to pivot from "it has a velocity" to "it implies contradictory truth values for tense operators across frames."

  **Tactical Note:** If the GR person pushes hard on FLRW foliations, concede that Presentism *might* work in *our* specific cosmology, but hold the line that it fails as a *necessary* metaphysical truth. Don't die on the hill of "Impossible in all worlds." Die on the hill of "Incoherent in SR, and SR is the local structure of reality."
