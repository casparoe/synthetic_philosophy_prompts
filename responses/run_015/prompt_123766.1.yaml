answer: |-
  This is a profound observation about the texture of practical reasoning within institutions. You have identified a gap between the *phenomenology* of reasoning (citing a consideration as a justification) and the *psychology* of the reasoners (lack of endorsement). This gap is where the philosophy of action and social ontology collide.

  Per your request, I will not begin with the answer. I will begin by proposing three distinct ontological frameworks for carving up this phenomenon, evaluate them, and then proceed to the definition and metaphysical implications.

  ### Part I: Three Carvings of the Phenomenon

  Here are three genuinely different ways to ontologically categorize the "orphan rationale."

  **1. The Psychological Residue Carving (The "Habit" View)**
  This framework treats the phenomenon as a category error in description. It argues there is no "reason" here at all. What you are observing is behavioral inertia misdescribed as rational deliberation. When the board cites the reserve rule, they are not actually reasoning; they are executing a script. The "consideration" is a linguistic artifact that accompanies the habit, much like a rider rationalizing a horse's path after the fact.
  *   *Prediction:* If you disrupt the procedure (e.g., remove the line item from the form), the "reason" should vanish immediately because it has no support structure other than the habit.
  *   *Rejection:* This fails your cases. In the hospital ethics committee, the consideration ("family wants everything") arises in open deliberation, not just form-filling. It defeats counter-arguments. It behaves *too much* like a reason (it weighs against other considerations) to be mere habit. It has normative weight, not just causal momentum.

  **2. The Systemic Homeostasis Carving (The "Equilibrium" View)**
  This framework treats the phenomenon as a feature of complex adaptive systems. The "reason" is a stabilizing variable. It persists not because anyone wants it, but because the system settles into an equilibrium where this rule minimizes transaction costs or conflict. The "reason" is a shadow cast by the structural tension between different agents' desires.
  *   *Prediction:* The "reason" should change if the power dynamics in the room change. If a new coalition forms, the orphan rationale should be replaced by a different one that serves the new equilibrium.
  *   *Rejection:* This fails the "Heirloom" case. The program officer is gone; the power dynamics have shifted; yet the rule remains. It is not serving a current equilibrium (everyone says it's harmful). It is persisting *against* the current equilibrium of desires.

  **3. The Deontic Artifact Carving (The "Reification" View)**
  This framework treats the phenomenon as a genuine ontological object created by past acts of institution-building. When a rule is codified, it is "reified"—turned into a thing. Like a law that remains on the books after the legislature that passed it has dissolved, the rationale acquires a status that is independent of current mental states. It is a "freestanding normative claim" embedded in the architecture.
  *   *Prediction:* The "reason" will persist as long as the *procedure* that instantiates it remains intact, regardless of the beliefs of the participants. It can only be killed by a specific act of *de-institutionalization* (repeal), not merely by disbelief.
  *   *Selection:* **I settle on this carving.** It best explains why the reason survives unanimous disavowal (it lives in the structure, not the minds) and why it exerts normative force (it is a valid move within the "game" the group is playing).

  ### Part II: Evaluation of Existing Concepts

  You mentioned three suggestions you received. Here is why they fail to capture the joints of this specific phenomenon, based on the Reification carving.

  1.  **Agent-Neutral Reasons:** These are reasons that apply to everyone (e.g., "pain is bad"). Your orphan rationales are not agent-neutral; they are *institution-specific*. The reserve rule does not apply to for-profits or other nonprofits. Agent-neutral reasons are "floating" in the moral universe; your rationales are "anchored" in specific bureaucratic histories.
  2.  **World-Given Reasons:** This view suggests facts themselves are reasons. But your cases (the reserve rule, the "respectable career") are clearly human constructs, not brute facts. They are artifacts. A world-given reason exists regardless of human history; an orphan rationale exists *because* of human history, even if current humans reject it.
  3.  **Group Agency:** This suggests the "Group" believes what the individuals do not. But you noted the group's procedures, run faithfully, produce the opposite result. The group *qua* agent is not endorsing this. The "reason" is not the will of the group; it is a *constraint upon* the group. It is more like a legacy code running on the group's operating system than a decision made by the group.

  ### Part III: The Proposal — "Reified Rationales"

  Since no existing term fits, I propose we call these **Reified Rationales**.

  **Definition:**
  A consideration $R$ is a **Reified Rationale** within a collective $C$ if and only if:
  1.  **Operational Efficacy:** $R$ functions as a premise in the practical syllogism of $C$ (it cites $R$ to justify action $A$).
  2.  **Doxastic Void:** No current participating member of $C$ endorses $R$ as a valid normative claim (they would reject $R$ if asked in isolation).
  3.  **Structural Instantiation:** The force of $R$ is derived from its encoding in the procedural architecture of $C$ (rules, forms, precedents) rather than the motivational states of the members.

  **Settling the Boundary Cases:**

  *   **The New Hire Endorsement:** If a new hire inherits an heirloom rationale and *genuinely endorses it*, it **ceases to be a Reified Rationale** and becomes a **Shared Belief**.
      *   *Why:* Condition 2 (Doxastic Void) is violated. This tells us the phenomenon is not about the *content* of the rule, but the *source of its force*. When the force shifts from Structure to Mind, the ontological category changes. This confirms the phenomenon is about the *decoupling* of reason from reasoner, not just the content of the reason.
  *   **The Unrecognized True Feature:** If a consideration tracks a real feature everyone is ignorant of (e.g., "This project will fail due to a hidden structural flaw"), that is a **Latent Objective Reason**.
      *   *Why:* It fails Condition 3. Its force comes from the *world*, not the *structure*. If the group knew the fact, they would endorse it. With a Reified Rationale, if the group knows the "fact" (e.g., that the reserve rule is harmful), they *still* follow it. The distinction lies in whether knowledge would dissolve the reason's force.

  **A New Case Your Taxonomy Mishandles:**

  Your four kinds (Heirloom, Procedural, As-If, Zombie) miss a crucial category: **The Transposed Rationale.**

  *   *The Case:* A university department requires all PhD students to pass a language exam in a dead language.
      *   *Not Heirloom:* No single person instituted it; it evolved.
      *   *Not Procedural:* It's not just a form slot; it's a defended standard of "rigor."
      *   *Not As-If:* Nobody benefits strategically; it slows down graduation.
      *   *Not Zombie:* The evidence wasn't retracted; the *context* changed.
  *   *The Mechanism:* The rule originated in Context A (1950s research required physical archive access). It was transposed into Context B (2020s digital humanities) via accreditation standards. The accreditation body requires "language competency." The department interprets this as "dead language." The accreditation body meant "methodological literacy."
  *   *Why it fits Reified Rationale:* The rationale ("dead language = rigor") is reified in the accreditation paperwork. Nobody in the room believes dead languages are necessary for digital work. But the *link* is solidified in the external structure. It is a rationale that has been severed from its original semantic context but retained its institutional syntax. Your taxonomy treats the *origin* (Heirloom) or the *evidence* (Zombie), but this case is about **semantic drift within institutional encoding.**

  ### Part IV: The Metaphysical Verdict

  Now, the core question: **Do reasons need reasoners?**

  If Reified Rationales are real, does this prove that reasons can float free of agents?

  **The Verdict: Institutional Externalism.**

  We must distinguish between two senses of "Reason":
  1.  **Validating Reason:** A consideration that genuinely counts in favor of an action (normative truth).
  2.  **Operational Reason:** A consideration that functions as a premise in a deliberation (sociological fact).

  Your cases are undoubtedly **Operational Reasons**. They do the work of reasons. But are they **Validating Reasons**?

  *   **The Illusion Hypothesis:** One could argue these are merely causal pressures (like gravity) that groups *mistake* for reasons. On this view, reasons *essentially* require a reasoner. The "felt pressure" is a collective delusion. The metaphysics of reasons remains intact (Reasons = Mental/Agent states); our sociology is just messy.
  *   **The Reification Hypothesis:** I argue for a stronger claim. Social ontology allows for the **objectification of normativity**. When a group builds an institution, they create a structure that *has the power to generate reasons* for future agents.

  **Why the Reification Hypothesis is superior:**
  If these were merely illusions, we would expect them to dissolve under scrutiny (as per the Psychological Residue carving). They do not. They persist *against* scrutiny. This suggests they have an ontological footing outside individual minds.

  However, this does not mean reasons float free of *all* agents. It means reasons can float free of *current* agents.
  *   **The Diachronic Reasoner:** The "reasoner" for a Reified Rationale is not the person in the room today. It is the **Diachronic Institution**. The institution is an agent that stretches across time. The Program Officer who wrote the rule four years ago was an agent of the Institution. The Board today is an agent of the Institution. The Institution itself retains the "belief" (encoded in its rules) even if the current biological constituents reject it.

  **Conclusion on Metaphysical Weight:**
  This does not prove Platonic realism (reasons exist in a void). It proves **Social Realism**. Reasons can be encoded in artifacts and structures such that they exert normative force on agents who do not endorse them.

  *   **Which of your four kinds carries the weight?**
      *   *As-If:* No. This is strategic lying, not genuine reasoning.
      *   *Procedurally Generated:* Partial. This shows the mechanism, but not the normativity.
      *   *Zombie:* High weight. This shows that *truth conditions* are not required for the reason to function.
      *   *Heirloom:* **Highest weight.** This demonstrates the **temporal decoupling** of the reason from the reasoner. It proves that the "source" of the reason can be a past agent, while the "subject" of the reason is a present agent, with no chain of endorsement linking them.

  **Final Answer:**
  Reasons do not need a *contemporaneous* reasoner, but they do need a *historical* reasoner and a *structural* vessel. A rationale can float free of the *minds* currently in the room, but it cannot float free of the *institution* that houses it. The "orphan" is not parentless; it is an adult child living in the family home, obeying house rules written by parents who have died. The rules are real, the pressure is real, but the authority is a ghost.

  This suggests a modification to the theory of practical reason: **Reasons are not just mental states or brute facts; they are also institutional status functions.** To ignore Reified Rationales is to ignore a massive chunk of how human beings actually navigate the normative world. We do not just reason *in* institutions; we reason *with* them, using their stored rationality as a prosthesis for our own. Sometimes, the prosthesis moves the limb when the muscle has atrophied. That does not mean the movement isn't real; it means the source of the motion is the gear, not the flesh.
