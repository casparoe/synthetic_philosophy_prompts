  (3) now apply that to any practice where authorship is distributed — wikipedia articles, peer-review pools, jury verdicts, democratic votes — the final claim gets attached to an abstraction (the article, the committee) rather than any single person.
  (4) these practices reproduce the exact same structure: real people dissolve into a colletive name and no one is fully answerable.
  (5) so if kierkegaard's critique is consistent, all distributed knowledge or decision-making is just the public in institutional form, and therefore ethically empty of real commitment.
  (6) but kierkegaard writes for an audience, belongs to a church, and his texts are edited and taught by scholars he never met — all colletive processes he never controlled.
  (7) so either the critique condemns every shared institution he valued, or we have to invent an arbitrary line between bad collectives and good ones, which looks totally ad hoc.
  (8) conclusion: the argument either collapses into self-refutation or demands total withdrawal from society, which is implausable.

