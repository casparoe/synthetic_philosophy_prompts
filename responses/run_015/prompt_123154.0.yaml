prompt: |-
  Hey — I run a tiny type foundry with one other person, and our main product is crowdsourced handwriting fonts: contributors draw their letters on a tablet, we capture stroke order and direction, and we ship the result for embroidery machines, where each glyph has to be one continuous stitched path (our machines can't do a jump without a thread trim, which customers hate). So two different questions come up dozens of times a week and I need to stop answering them by gut: (1) is this thing an 'a' at all, and (2) is it an 'a' in *this* contributor's hand, given that we only ever see one or two exemplars of their 'a'. My cofounder thinks the bowl-plus-stem double-storey shape is what makes an a an a and that single-storey ones are just circles with a stick; I think the load-bearing part is more like the counter and the way the bottom-right terminal flicks off, and that stroke order matters more than the outline. We're not gonna settle that between us, so I want a procedure that either picks a side out loud or routes around the disagreement.

  What I need is a checklist a part-time contractor with no typography training can run in about two minutes per glyph, in a fixed order, ending in accept / reject / kick it to me. Say what counts as a sufficient answer at each step (the contractor shouldn't have to guess what "looks right" means), where to stop early with a no, and which steps are really judgment calls dressed up as tests — mark those as such. Also say plainly what the procedure can't do.

  Then run it on four cases:

  - a double-storey 'a' made one-stroke by doubling back over the bowl, so there's an overstitched segment
  - a single-storey 'a' submitted into a family where every other exemplar is double-storey
  - an 'a' whose bowl is barely closed and merges with the family's 'o' when it's stitched small, like left-chest-logo size
  - one that clears every test but is basically a traced Helvetica 'a': right letter, single path, nothing of that person's hand in it, and I want to reject it

  If your procedure accepts that last one, say so and tell me what I'd have to add to catch it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Context:**
      *   **User:** Co-owner of a tiny type foundry (2 people).
      *   **Product:** Crowdsourced handwriting fonts for *embroidery machines*.
      *   **Constraint 1 (Technical):** Each glyph must be *one continuous stitched path* (no jumps/trims).
      *   **Constraint 2 (Data):** Contributors draw on tablets; stroke order/direction is captured. Only 1-2 exemplars per glyph per contributor.
      *   **Problem:** Two recurring questions: (1) Is this an 'a'? (2) Is it *this* contributor's 'a' (consistency)?
      *   **Internal Conflict:** Co-founder disagreement on what defines an 'a' (Double-storey shape vs. Counter/terminal flick/stroke order).
      *   **Goal:** A checklist for a part-time contractor (no typography training) to triage glyphs in ~2 minutes.
      *   **Output Requirements:** Fixed order, clear pass/fail criteria, mark judgment calls, state limitations, test on 4 specific cases, address the "traced Helvetica" edge case.

  2.  **Deconstruct the Conflict & Constraints:**
      *   *The "What is an 'a'" Debate:*
          *   Co-founder: Shape-focused (Double-storey = 'a', Single-storey = circle+stick).
          *   User: Stroke/Structure-focused (Counter, terminal flick, stroke order).
          *   *Resolution Strategy:* Since they can't agree, the procedure needs to be neutral but functional. It shouldn't enforce one theory over the other but rather enforce *legibility* and *technical constraints*. However, for embroidery, structural integrity (closed loops vs. open) matters more than typographic theory.
      *   *The Embroidery Constraint:* One continuous path. No lifting the needle. This means "doubling back" is technically allowed (stitching over stitches) but might look bulky. "Barely closed" bowls might look like 'u' or 'o' when stitched small.
      *   *The "Handwriting" Constraint:* It needs to look like the contributor's hand, not a standard font.

  3.  **Drafting the Procedure (The Checklist):**
      *   *Target Audience:* Part-time contractor, no typo training. Needs binary or ternary (Yes/No/Maybe) decisions.
      *   *Time Limit:* ~2 minutes. Max 5-7 steps.
      *   *Structure:* Technical Check -> Legibility Check -> Consistency Check -> Aesthetic/Brand Check.

      *   *Step 1: Technical Path Integrity.* (Crucial for embroidery).
          *   Check: Is it one path? Are there breaks?
          *   Criteria: Software shows 1 path object. No trim commands.
      *   *Step 2: The "Squint" Test (Legibility at Size).*
          *   Check: Does it look like an 'a' at 1cm height?
          *   Criteria: Counter (hole) must be visible. If it closes up, it's an 'o' or blob.
      *   *Step 3: Stroke Order/Direction (The User's preference vs. Co-founder).*
          *   Check: Does the stroke flow logically for handwriting?
          *   Criteria: No impossible pen lifts disguised as continuous lines (unless doubled back).
          *   *Compromise:* Since the user values stroke order, check if the direction matches the contributor's other letters.
      *   *Step 4: Family Consistency.*
          *   Check: Does it match the other letters from *this* contributor?
          *   Criteria: Weight, slant, terminal style.
      *   *Step 5: The "Generic" Check (Addressing the Helvetica issue).*
          *   Check: Does it look like a standard computer font?
          *   Criteria: Perfect geometric curves vs. wobbly hand-drawn lines.

      *   *Refining the "Is it an 'a'" conflict:*
          *   I need to sidestep the "single vs. double storey" argument. Both are valid 'a's in handwriting. The procedure should accept both *provided* they meet the legibility and path constraints.
          *   *Decision:* Define 'a' by the *counter* and the *vertical stem*, regardless of storeys.

  4.  **Developing the Checklist Steps (Iterative Refinement):**

      *   *Step 1: Path Continuity.* (Pass/Fail). If >1 path, Reject.
      *   *Step 2: The 10mm Test.* (Pass/Fail). Scale to 10mm. Is the counter (hole) distinct? If it looks like an 'o' or 'u', Reject.
      *   *Step 3: Stroke Logic.* (Judgment). Does the stroke direction match the contributor's 'd', 'g', 'q'? (Handles the stroke order argument).
      *   *Step 4: Style Match.* (Judgment). Does the line weight and slant match the contributor's 'b', 'c', 'e'?
      *   *Step 5: Handwriting Signature.* (Judgment). Are there micro-wobbles or pressure variations? If it's mathematically perfect, Kick to Owner.

  5.  **Addressing the Limitations:**
      *   Can't judge long-term wear (thread bulk).
      *   Can't judge cultural variations of 'a' deeply.
      *   Can't detect tracing without reference.

  6.  **Running the Test Cases:**

      *   *Case 1: Double-storey, doubled back.*
          *   Path: 1 continuous? Yes (doubled back).
          *   Squint: Legible? Yes.
          *   Stroke: Logical? Maybe (doubling back is weird for pen, okay for needle).
          *   Verdict: Accept (with note on bulk).
      *   *Case 2: Single-storey in double-storey family.*
          *   Path: 1.
          *   Squint: Legible.
          *   Style: Mismatch? Handwriting often mixes.
          *   Verdict: Kick to Owner (Style consistency judgment).
      *   *Case 3: Barely closed bowl (merges with 'o').*
          *   Path: 1.
          *   Squint: Fails at 10mm. Counter disappears.
          *   Verdict: Reject.
      *   *Case 4: Traced Helvetica.*
          *   Path: 1.
          *   Squint: Legible.
          *   Style: Perfect curves.
          *   Verdict: Current checklist might Accept. Need to add a "Imperfection Check".

  7.  **Finalizing the Procedure & Output:**
      *   Make the tone professional, direct, and operational.
      *   Ensure the "Judgment Call" warnings are clear.
      *   Explicitly answer the "Helvetica" prompt requirement (If it accepts, say what to add).

      *(Self-Correction during drafting)*: I need to make sure I don't take sides in the Co-founder debate in the *rules*, but I do need to resolve it for the *contractor*. The best resolution is functional: "If it reads as 'a' at embroidery size, it's an 'a'." This bypasses the single/double storey argument.
      *Wait, the prompt asks me to either pick a side OR route around.*
      *Routing around is safer.* I will define 'a' by *function* (counter + stem) rather than *form* (storeys). This validates the User's "counter" argument while allowing the Co-founder's "shape" as long as it functions.

      *Refining the "Helvetica" catch:* The contractor needs a specific visual cue. "Perfect curves" is hard for a novice. "Compare to contributor's other letters" is better. If 'a' is perfect but 'b' is wobbly, it's suspect.

  8.  **Final Polish:** Check against all constraints (2 mins, no typo training, fixed order, 4 cases, limitations).

      *Checklist Structure:*
      1. Technical (Path)
      2. Legibility (Size)
      3. Consistency (Hand)
      4. Originality (Tracing)

      *Let's write it.*
answer: |-
  Here is the operating procedure. It is designed to route around your theoretical disagreement by prioritizing **embroidery legibility** and **contributor consistency** over typographic taxonomy. It treats "Is it an 'a'?" as a functional question (does it read as 'a' at 1cm?) rather than a structural one (how many storeys?).

  ### The "2-Minute Glyph Triage" Procedure

  **Operator:** Part-time Contractor
  **Tools:** Embroidery simulation software, Contributor's previous 5 glyphs.
  **Time Limit:** 120 seconds per glyph.

  #### Step 1: The Single-Path Check (Technical)
  *   **Action:** Inspect the vector path data.
  *   **Pass:** The glyph is exactly **one** continuous vector path. No breaks, no compound paths, no "trim" commands embedded.
  *   **Fail:** More than one path object or embedded trim commands.
  *   **Result:** **FAIL** → Reject immediately.
  *   **Result:** **PASS** → Go to Step 2.

  #### Step 2: The 10mm Squint Test (Legibility)
  *   **Action:** Scale the glyph to 10mm height (approx. left-chest logo size). Zoom out until you are viewing the screen from arm's length.
  *   **Pass:** The **counter** (the enclosed or partially enclosed space) is clearly distinct from the background. It does not look like an 'o', 'u', or a blob.
  *   **Fail:** The gap closes up, or the shape is ambiguous without context.
  *   **Result:** **FAIL** → Reject immediately.
  *   **Result:** **PASS** → Go to Step 3.

  #### Step 3: The Hand-Match Check (Consistency)
  *   **Action:** Place the 'a' next to the contributor's last 5 accepted letters (e.g., 'b', 'c', 'd').
  *   **Pass:** Line weight (stroke thickness), slant angle, and terminal endings (how the line stops) look like they were drawn with the same "pen" as the other letters.
  *   **Fail:** The 'a' is significantly thicker, thinner, straighter, or more curved than the rest of their set.
  *   **Note:** *Judgment Call.* Do not reject for single-storey vs. double-storey variation unless the rest of their alphabet is rigidly uniform. Handwriters mix forms.
  *   **Result:** **FAIL** → Kick to Owner.
  *   **Result:** **PASS** → Go to Step 4.

  #### Step 4: The "Too Perfect" Check (Originality)
  *   **Action:** Inspect the curvature of the bowl and stem.
  *   **Pass:** Curves show slight variation in speed/pressure (minor wobbles, non-geometric arcs). Stroke entry/exit points look natural.
  *   **Fail:** Curves are mathematically perfect geometric arcs. Stroke width is absolutely uniform. It looks like a standard system font (Arial, Helvetica, etc.).
  *   **Note:** *Judgment Call.* This requires a "nose" for digital vs. hand-drawn.
  *   **Result:** **FAIL** → Kick to Owner.
  *   **Result:** **PASS** → **ACCEPT**.

  ---

  ### What This Procedure Cannot Do
  1.  **Resolve Typographic Theory:** It does not settle the single-vs-double storey debate. It accepts both if they pass the 10mm test.
  2.  **Predict Thread Bulk:** It cannot tell if a "doubled back" stroke will create a ugly lump of thread until physically stitched.
  3.  **Detect Sophisticated Tracing:** If a contributor traces a font *and* adds artificial wobbles, Step 4 may miss it.
  4.  **Judge Cultural Variants:** It assumes Latin script norms. Unusual but valid regional 'a' forms might get kicked to you.

  ---

  ### Test Run: Four Cases

  #### Case 1: Double-storey 'a', one-stroke by doubling back over the bowl.
  *   **Step 1 (Path):** **PASS.** It is one continuous path (the doubling back counts as continuity).
  *   **Step 2 (10mm):** **PASS.** Double-storey usually reads well at small sizes.
  *   **Step 3 (Hand-Match):** **PASS.** Assuming weight matches.
  *   **Step 4 (Too Perfect):** **PASS.** Assuming the doubling back looks hand-drawn.
  *   **Verdict:** **ACCEPT.**
  *   *Note:* This validates the technical constraint over the "pen logic." Embroidery allows over-stitching; pens do not. Your procedure accepts this because the machine doesn't care about pen logic, only thread continuity.

  #### Case 2: Single-storey 'a' in a double-storey family.
  *   **Step 1 (Path):** **PASS.**
  *   **Step 2 (10mm):** **PASS.** Single-storey usually has a large, clear counter.
  *   **Step 3 (Hand-Match):** **KICK TO OWNER.**
  *   *Reasoning:* Step 3 notes that mixing forms is allowed in handwriting, *but* a contractor shouldn't decide if this specific mix breaks the "family" feel. This routes around your co-founder's objection without hard-banning single-storey. You make the call on stylistic cohesion.

  #### Case 3: Bowl barely closed, merges with 'o' at small size.
  *   **Step 1 (Path):** **PASS.**
  *   **Step 2 (10mm):** **FAIL.**
  *   *Reasoning:* The procedure explicitly prioritizes the "10mm Squint." If the counter disappears, it fails the functional definition of 'a' for embroidery, regardless of stroke order or terminal flicks.
  *   **Verdict:** **REJECT.**

  #### Case 4: Traced Helvetica 'a' (Right letter, single path, no hand).
  *   **Step 1 (Path):** **PASS.**
  *   **Step 2 (10mm):** **PASS.** Helvetica is legible.
  *   **Step 3 (Hand-Match):** **FAIL / KICK TO OWNER.**
  *   *Reasoning:* Unless the contributor's other letters are *also* traced Helvetica, the line weight and perfect geometry will mismatch their 'b', 'c', 'd'.
  *   **Verdict:** **KICK TO OWNER.** (If the contractor is unsure, the "Too Perfect" check catches it).

  ---

  ### Addressing the "Traced Helvetica" Loophole

  If your contractor is inexperienced, they might miss Case 4. They might think "It looks clean, that's good."

  **If the procedure above accepts Case 4, add this to Step 4:**

  > **Step 4 Addendum: The Wobble Test**
  > *   **Action:** Zoom to 400%. Look at the longest curve (the bowl).
  > *   **Criteria:** A hand-drawn vector usually has anchor points that are slightly irregular in spacing. A traced font often has perfectly symmetrical anchor points or perfectly uniform Bézier handles.
  > *   **Trigger:** If the curve looks "machined" **AND** the contributor's other letters show natural variance, **KICK TO OWNER.**

  **Why this works:** It shifts the burden from "Is this Helvetica?" (which requires font knowledge) to "Does this look like *their* other letters?" (which requires only comparison). If they traced the 'a' but drew the 'b', the mismatch triggers the Kick. If they traced the whole alphabet, you catch it at the family level later.
