      *(Self-Correction during drafting)*: Be careful with the "All Affected" principle regarding future generations. Usually, "All Affected Interests" applies to living persons. If the prompt says "regardless of... date of birth," it explicitly includes the unborn. I must adhere to that constraint for the rewriting section.

      *(Refining the Coherence point)*: The tension is between *Will* and *Interest*. Owners have Will + Interest. Future gens have Interest (protected by Guardian) but no Will. Renters have Will + Interest but no standing. This is the incoherence: Interest is sufficient for the unborn, but not for the present renter.

