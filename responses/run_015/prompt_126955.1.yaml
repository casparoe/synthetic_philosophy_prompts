answer: |-
  1. **Exam Question**
  At noon today, a transparently reliable Billionaire A offers you $1 million if at midnight tonight you intend to drink a specific vial at noon tomorrow. The money is wired at 12:01 am regardless of whether you drink. Drinking causes violent illness for a day with no lasting effects. You know tonight that drinking yields no further payoff.
  Two complications apply. First, the vial handed to you tomorrow is drawn at random from a batch of ten; one is a harmless placebo, nine cause illness. You cannot distinguish them. Second, at 11 am tomorrow, Billionaire B will offer you $5,000 cash to return the vial unopened. You know tonight this offer will occur.
  Answer the following:
  (a) Can you rationally form the required intention at midnight? Do not simply assert impossibility; identify the specific constraint on intention formation that blocks you and explain how complications (first) and (second) affect this constraint. Does the placebo chance or the secondary offer alter your belief about future action sufficiently to permit intention?
  (b) Suppose for $100 you could pay a hypnotist tonight to induce a genuine psychological state of intending to drink. Does this solve the rationality problem? Explain whether bypassing rational formation via causation satisfies the puzzle's conditions.
  (c) Is Kavka's puzzle fundamentally a claim about the psychology of intention, the structure of reasons, or both? Justify your view.
  (d) Does this puzzle generalize to other states, such as genuinely wanting the outcome or being the sort of person who would drink? Explain why intention might be unique in this context.
  Avoid relying on Evidential Decision Theory. Focus on whether the state is available to you as a rational agent.
  Your answer should demonstrate familiarity with the Intention-Belief Constraint and distinguish between rational and causal pathways to intention. Address why the secondary offer reinforces the barrier to intention despite the monetary reward already being secured. Clarify whether the placebo uncertainty creates enough epistemic openness to sustain intention without self-deception. Finally, assess whether the puzzle reveals a limit on rational agency itself or merely a contingent psychological fact about human planning.
  Note that standard solutions invoking the reward as a reason to drink are insufficient unless you explain how this overrides the future lack of reason. You must engage with the literature on whether intention requires belief in successful performance. Ensure your discussion of hypnosis distinguishes between forming an intention and being caused to have an intention-like state.
  Total marks: 20. Suggested time: 90 minutes. Write clearly and concisely throughout.

  2. **Model Answer**
  The core obstacle to forming the intention at midnight is the Intention-Belief Constraint (IBC), which holds that one cannot intend to X while believing one will not X. At midnight, you know the money is already secured. Consequently, at noon tomorrow, you will have no reason to drink the vial and every reason to avoid the illness. Rational deliberation tomorrow dictates returning the vial to Billionaire B for $5,000 rather than drinking. Since you know tonight that you will be rational tomorrow, you believe tonight that you will not drink. The IBC therefore blocks the intention.

  Complication (a), the placebo chance, does not dissolve this block. Although there is a 10% chance the vial is harmless, the expected utility of drinking remains negative due to the 90% risk of illness. Rational belief tracks probability; you still believe you likely will not drink. Intention requires a belief threshold that mere uncertainty does not satisfy without self-deception. Complication (b), the secondary offer, reinforces the barrier. It provides a positive incentive to *not* drink, strengthening the belief that you will return the vial. This makes the intention even less accessible than in the standard puzzle, as the future action is not merely unmotivated but positively counter-motivated.

  Regarding hypnosis, paying $100 to be caused to intend solves the psychological problem but not the rational one. Hypnosis bypasses the IBC by causally inducing a state that resembles intention without involving the rational formation process. However, Kavka's puzzle concerns rational agency: can you intend *for a reason*? If the state is caused rather than reasoned, it lacks the normative connection to action that defines intention. You might feel you intend, but if the formation bypasses your grasp of reasons, it is arguably not an intention proper, but a compulsion or illusion thereof. Thus, hypnosis allows you to win the money but fails to show the intention was rationally available.

  This indicates the puzzle is fundamentally about the structure of reasons, not merely psychology. It highlights that intentions are reason-responsive states. If it were purely psychological, hypnosis would suffice. Since hypnosis feels like a cheat, the constraint must be normative. The puzzle reveals that rational agents cannot intend actions they know they will lack reasons to perform. This is a limit on rational agency, not just human planning psychology.

  Finally, the puzzle does not generalize cleanly to 'wanting' or 'character'. Wanting is often involuntary and not subject to the IBC; you can want what you believe you won't get. Similarly, being the 'sort of person' who drinks is a disposition, not a specific plan formed at midnight. Intention is unique because it is the distinctively practical state that bridges deliberation and action. It commits the agent to acting. Wanting or character traits do not carry the same immediate commitment. Therefore, the toxin puzzle targets the specific architecture of intention as a reason-guided commitment to future action, distinguishing it from other pro-attitudes that lack this strict rational coherence requirement.

  3. **Marking Scheme**
  *   **IBC Identification (4 marks):** Correctly identifies the Intention-Belief Constraint as the primary blocker. *A:* Explains why belief tracks future rationality; *B:* States the constraint without linking belief to future incentives.
  *   **Variant Analysis (4 marks):** Addresses placebo (expected utility) and second billionaire (reinforced non-drinking). *A:* Shows how both strengthen the belief you won't drink; *B:* Treats placebo as sufficient uncertainty to allow intention.
  *   **Hypnosis Evaluation (4 marks):** Distinguishes causal induction from rational formation. *A:* Argues hypnosis bypasses normative requirements; *B:* Claims hypnosis solves the rationality problem fully.
  *   **Reasons vs. Psychology (4 marks):** Identifies the puzzle as normative/structural. *A:* Links hypnosis failure to the nature of reasons; *B:* Treats it as purely empirical psychology.
  *   **Generalization Limits (4 marks):** Explains why wanting/character differs from intention. *A:* Highlights commitment/action-guidance distinction; *B:* Claims generalization holds without qualification.

  4. **Common Mistakes**
  *   **Relying on Evidential Decision Theory:** Students argue the intention evidentially causes the reward, ignoring the causal isolation post-midnight.
  *   **Ignoring the 11am Offer:** Failing to see how the secondary offer strengthens the belief that drinking won't occur.
  *   **Confusing Intention with Desire:** Treating the puzzle as solvable by merely wanting the money enough to want to drink.
  *   **Accepting Hypnosis as Rational:** Assuming causal induction satisfies the condition of rational intention formation.
  *   **Overgeneralizing:** Claiming the puzzle applies equally to wanting or character traits without distinguishing commitment.

  5. **Orthodox vs. Contested Claims**
  *   **IBC Status:** The Intention-Belief Constraint is near-orthodox but contested by proponents of partial intention or non-belief accounts.
  *   **Hypnosis Solution:** Whether hypnosis counts as forming an intention is debated; some view it as a valid workaround (Gauthier), others as cheating (Kavka).
  *   **Normative vs. Psychological:** There is live disagreement on whether the puzzle reveals a conceptual truth or a contingent psychological limitation.
  *   **Placebo Relevance:** Some argue any non-zero chance of drinking permits intention; the model answer assumes a high threshold for belief.
  *   **Generalization:** Whether similar puzzles apply to desire or character is contested; some argue all pro-attitudes face similar coherence constraints.
