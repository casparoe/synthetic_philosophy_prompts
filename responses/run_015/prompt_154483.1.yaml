      *   **User's Theory:** The friend slides between a weak reading (all art has political effects) and a strong reading (only art serving a movement is legitimate). The user wants to know if Du Bois's slogan can support a distinction between "propaganda of content" vs. "propaganda of address" (who the work speaks to/constitutes).
      *   **Role:** Professional philosopher/expert on Du Bois and aesthetics of political art.
      *   **Task:** Brainstorm, Menu of Readings, Verdicts, Friend's Use, Address vs. Content, Bottom Line.
      *   **Constraints:** Specific section headers, specific word counts (approximate), specific order.

  2.  **Deconstruct the Du Bois Slogan:**
      *   **Source:** "Criteria of Negro Art" (1926), speech given at the NAACP conference, published in *The Crisis*.
      *   **Quote:** "I do not care a damn for any art that is not used for propaganda."
      *   **Context:** Harlem Renaissance, debate between art for art's sake (Hughes, Locke, etc.) vs. art for social uplift. Du Bois is often misunderstood here. He wasn't saying *all* art *is* propaganda descriptively, but that *he* values art *used* as propaganda normatively. However, the phrase "All art is propaganda" is often attributed to him as a descriptive claim.
      *   **Nuance:** Du Bois believed art had a duty to represent Black humanity truthfully to combat racism. So "propaganda" for him meant counter-propaganda against racist stereotypes.

  3.  **Section 1: Brainstorm (~150 words)**
      *   Need raw options.
      *   Ideas: Descriptive claim (all art persuades), Normative claim (art *should* persuade), Definition claim (art *is* persuasion), Historical claim (Black art *must* fight racism), Elite claim (only propaganda art matters), Weak claim (art has effects), Strong claim (aesthetic value = political utility), Address claim (audience constitution), Content claim (explicit message).
      *   Drafting thought: Keep it scratchy. List the variations quickly.

  4.  **Section 2: Menu of Readings (~600 words)**
      *   Need numbered list of distinct precise theses.
      *   Need to specify scope (all art, good art, etc.).
      *   *Reading 1: Descriptive Universalism.* All art inherently persuades.
      *   *Reading 2: Normative Priority.* Art *ought* to serve a cause (Du Bois's actual likely intent).
      *   *Reading 3: Identity Claim.* Art and propaganda are identical categories.
      *   *Reading 4: Historical Necessity.* For marginalized groups, art *must* be propaganda to survive/be heard.
      *   *Reading 5: Aesthetic Reductionism.* Artistic quality is reducible to political effectiveness.
      *   *Reading 6: Contextual Inevitability.* Art is always received politically, regardless of intent.
      *   *Reading 7: The "True Representation" Claim.* Propaganda means telling the truth about a people against lies (Du Bois's specific nuance).
      *   Drafting thought: Ensure distinctness. Elaborate on each to hit word count. Focus on the logical structure of the claim.

  5.  **Section 3: Verdicts on the Readings (~400 words)**
      *   Evaluate each from the "philosopher/expert" perspective.
      *   *Descriptive:* Trivial/True but weak.
      *   *Normative:* Defensible, historically accurate to Du Bois.
      *   *Identity:* False/Confused.
      *   *Historical:* Substantive/Defensible.
      *   *Reductionism:* False/Unhelpful (kills art).
      *   *Contextual:* Substantive.
      *   *True Representation:* Defensible/nuanced.
      *   Drafting thought: Be critical. Distinguish between what Du Bois meant vs. what the slogan implies logically.

  6.  **Section 4: Which Readings Support My Friend's Use (~300 words)**
      *   Friend wants to shut down "too preachy" criticism.
      *   She needs the claim that "preachiness" isn't a flaw because *everything* is propaganda.
      *   *Supports:* Descriptive Universalism (if all art persuades, your novel does too), Identity Claim (no distinction exists).
      *   *Doesn't Support:* Normative Priority (Du Bois cared about *good* propaganda, not just any), Aesthetic Reductionism (if the play is bad art, it fails even as propaganda).
      *   Drafting thought: Highlight the sleight of hand. She uses a descriptive truth to defend a normative failure.

  7.  **Section 5: Can it be about propaganda of address? (~250 words)**
      *   User's distinction: Content (message) vs. Address (audience constitution).
      *   Does Du Bois support this? Du Bois was concerned with *who* sees Black art and *how* Black people are depicted (addressing the white gaze vs. Black interiority).
      *   Yes, "propaganda of address" fits Du Bois's concern with representation. He wanted art that addresses Black humanity truthfully, not just art with slogans.
      *   Sharpen the distinction: It's not just "who is in the room," but "what world is being built."
      *   Drafting thought: Validate the user's intuition. It's a sophisticated reading that saves the slogan from crudeness.

  8.  **Section 6: Bottom Line for a Novelist (~150 words)**
      *   Practical takeaway.
      *   Don't let characters use it as a trump card.
