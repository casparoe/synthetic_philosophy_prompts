      *   *Menu:* Flesh out the 7 readings. Make sure to distinguish "All art is propaganda" (descriptive) from "I care only for art used as propaganda" (normative). This is the crux of the Du Bois scholarship.
      *   *Verdicts:* Be sharp. The "Identity Claim" is the friend's shield, but it's philosophically weak. The "Normative" claim is what Du Bois actually held.
