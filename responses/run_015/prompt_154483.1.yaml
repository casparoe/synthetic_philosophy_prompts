answer: |-
  1) Brainstorm
  *   Descriptive claim: All art inherently persuades (trivial).
  *   Normative claim: Art *ought* to serve a cause (Du Bois's intent).
  *   Identity claim: Art and propaganda are the same thing (category collapse).
  *   Historical claim: Black art *must* fight racism to survive (contextual necessity).
  *   Reductionist claim: Aesthetic value equals political utility (false).
  *   Reception claim: Audiences always read art politically (unavoidable effect).
  *   Truth claim: Propaganda means correcting lies about Black life (Du Bois's nuance).
  *   Content claim: Explicit slogans define propaganda (too narrow).
  *   Address claim: Constituting an audience is the political act (your intuition).
  *   Elite claim: Only activist art matters (exclusionary).

  2) Menu of readings
  1.  **Descriptive Universalism:** This claims that persuasion is an ontological feature of art. Every poem, painting, or novel inevitably shapes perception, values, or beliefs. There is no "neutral" aesthetic space; even art for art's sake propagates the value of detachment. This applies to *all art*, regardless of intent.
  2.  **Normative Priority:** This is the claim Du Bois most likely held. It argues that while art *can* exist without political intent, it *should* not. In a context of oppression, the moral duty of the artist is to weaponize beauty for justice. This applies to *all good or responsible art*, specifically within marginalized communities.
  3.  **Category Identity:** This asserts that "art" and "propaganda" are synonyms. There is no conceptual distinction between a sonnet and a pamphlet if both aim to move the audience. This collapses the distinction entirely for *all art*, making "propaganda" a neutral descriptor rather than a pejorative.
  4.  **Historical Necessity:** This reading suggests that for Black artists in the 1920s, neutrality was impossible. Because racism politicizes Black existence, any depiction of Black life is received as a political statement. Thus, Black art is functionally propaganda regardless of intent. This applies to *art under the description of "Black Art" in a racist society*.
  5.  **Aesthetic Reductionism:** This strong claim argues that artistic quality is identical to political effectiveness. If a work fails to move people to action, it is bad art. Beauty is subordinate to utility. This applies to *all art judged as "good"*, reducing aesthetic criteria to political metrics.
  6.  **The Truth-Claim:** For Du Bois, "propaganda" often meant "counter-propaganda" against racist lies. Here, the slogan means art must represent the truth of a people to combat stereotypical falsehoods. It is not about slogans, but about accurate, humanizing representation. This applies to *art depicting oppressed groups*.
  7.  **Reception Inevitability:** This claims that the audience determines the propaganda, not the artist. Even if the artist intends pure beauty, the social context will imbue the work with political meaning. The "propaganda" is in the eye of the beholder. This applies to *all art once released into the public sphere*.

  3) Verdicts on the readings
  1.  **Descriptive Universalism:** **Trivial.** While philosophically defensible (all communication persuades), it's too weak to do the work your friend wants. It proves art has effects, but not that *didacticism* is desirable.
  2.  **Normative Priority:** **Substantive and Defensible.** This is historically accurate to Du Bois. It invites critique, however: is the art *effective* propaganda? It doesn't shield bad art from criticism.
  3.  **Category Identity:** **Confused.** This erases useful distinctions. A pamphlet and a symphony function differently. Collapsing them makes the word "propaganda" useless for distinguishing degrees of explicitness.
  4.  **Historical Necessity:** **Substantive.** This captures the 1920s context well. It explains why Black artists couldn't retreat to an ivory tower, but doesn't justify clumsy execution.
  5.  **Aesthetic Reductionism:** **False/Unhelpful.** This destroys art. Propaganda often requires simplification; art often requires ambiguity. Equating them leads to sterile, didactic work that fails as both art and persuasion.
  6.  **The Truth-Claim:** **Defensible.** This is Du Bois's nuanced view. It shifts the focus from "slogans" to "representation." It allows for complex art that is still political because it humanizes.
  7.  **Reception Inevitability:** **Substantive.** It reminds artists they can't control meaning. However, it doesn't excuse intentional preachiness; unintentional political effects differ from deliberate messaging.

  4) Which readings support my friend's use
  Your friend is relying primarily on **Category Identity** and **Descriptive Universalism**. She wants to argue that because your novel also has political effects (Descriptive), there is no difference between your subtlety and her slogans (Identity). This allows her to treat "propaganda" as a neutral descriptor, shielding her work from the critique of being "preachy." If all art is propaganda, then "preachy" is just a style choice, not a flaw.

  However, neither reading actually supports the *quality* of her work. **Normative Priority** and **Aesthetic Reductionism** would actually undermine her defense. If art *ought* to be propaganda (Normative), it must be *effective* propaganda. A preachy play that alienates audiences is bad propaganda. If artistic value equals political utility (Reductionism), her play fails if it doesn't persuade. She is using the slogan to avoid the very criterion Du Bois cared about: utility. She claims the label protects her, but Du Bois used the label to demand higher stakes. She wants the immunity of the slogan without the responsibility of its effectiveness.

  5) Can it be about propaganda of address?
  Your distinction is not silly; it is philosophically robust and aligns well with Du Bois's deeper concerns. Du Bois was obsessed with the "Veil" and who was looking at Black art. He feared art created solely to appease white audiences (addressing the oppressor) versus art that affirmed Black interiority (addressing the community).

  A reading of the slogan focused on **Propaganda of Address** fits the **Truth-Claim** and **Historical Necessity** readings. If "propaganda" means correcting the public record, then a quiet illustration that depicts Black joy without explanation is propaganda because it addresses Black humanity as worthy of record, refusing to explain itself to a white gaze. This shifts the political weight from *what is said* (content) to *who is constituted* (address). Your distinction sharpens the debate: is the work political because it shouts slogans, or because it assumes a specific public? Du Bois would likely support the latter if it served the goal of truthful representation. This saves the slogan from crudeness and validates your character's ambivalent art as politically potent.

  6) Bottom line for a novelist
  Don't let your characters use the slogan as a trump card; use it as a trap. The drama isn't whether art is propaganda, but *what kind* and *for whom*. Your friend's character wants the slogan to mean "I can't be criticized." Your protagonist should argue that Du Bois meant "You must be effective."

  Focus the conflict on efficacy and audience. Is the preachy play actually changing minds, or just comforting the converted? Is the quiet illustration truly neutral, or is it a luxury only some can afford? The slogan is best used to raise the stakes: art isn't a game, it's a weapon. But weapons can misfire. Let them argue about whether a dull weapon is better than no weapon at all. That is the real tension of the Harlem Renaissance.
