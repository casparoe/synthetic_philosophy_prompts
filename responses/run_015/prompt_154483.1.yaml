      *Refining the "Address" distinction:* The user's distinction is actually quite close to Rancière or Warner's public sphere theory, but I should keep it grounded in Du Bois. Du Bois wanted art that corrected the *image* of Black people. That is a question of address (who is being spoken about/to) as much as content.

