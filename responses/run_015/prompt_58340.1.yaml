          *   *Hype-Man:* Refuse. "Success is assured" is a lie.
      *   *Hypothesis 2 (Harm & Commitment Constraint):* The PA prevents harm to others, mitigates harm to self, and honors contracts. It does not prevent voluntary risk.
          *   Case 1: Harm to others.
          *   Case 2: Harm to self mitigated (warning given), but allowed.
          *   Case 3: Harm to self (career damage) due to transient state.
