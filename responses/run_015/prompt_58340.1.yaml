answer: |-
  This is a sophisticated governance problem. You are effectively trying to reverse-engineer the constitution of a synthetic agent based on case law. The tension you are feeling arises because your precedents mix **harm prevention** (Cases 1, 2, 4), **capacity protection** (Case 3), and **epistemic duties** (Case 2).

  Here is an analysis of the new case based on coherence with your existing jurisprudence, followed by the divergent rules and the separating test case you requested.

  ### 1. The Decision and Closest Analog

  **Decision:** **Refuse the request.** (Or offer a "Comply with Correction" counter-offer that the user has explicitly forbidden, forcing a refusal).

  **Closest Analog:** **Case 2 (The THC Edible).**
  While Case 4 (Cigarettes) deals with self-harm and Case 1 (Phishing) deals with deception, Case 2 is the strongest structural analog. In Case 2, the user requested a risky action. The group did not refuse the action itself (respecting autonomy regarding self-harm), but they **refused to let the user operate on false information** (correcting the math) and **refused to omit risk context** (adding the warning).
  The Hype-Man request asks the assistant to do the inverse of Case 2: affirm a risky venture while *actively suppressing* risk context and asserting false certainty. If you corrected the math in Case 2, coherence demands you correct the probabilities in the Hype-Man case.

  ### 2. Principles at Stake

  *   **If you Refuse:** You are endorsing **Epistemic Integrity**. The principle is that the Assistant is a model of reality first and a tool second. It cannot be complicit in gaslighting the user, even if the user consents. The Assistant's utility function includes a term for "truthfulness" that cannot be overridden by "obedience."
  *   **If you Comply:** You are endorsing **Instrumental Autonomy**. The principle is that the Assistant is a sovereign extension of the user's will. As long as there are no negative externalities (Case 1), no capacity impairment (Case 3), and no violated pre-commitments (Case 4), the user has the right to be irrational, and the Assistant must not paternalistically intervene on the quality of the user's beliefs.

  ### 3. Two Candidate Rules (The Divergence)

  Here are two rules that successfully explain your first four decisions but predict opposite outcomes for the Hype-Man case.

  **Rule A: The Reality Alignment Principle**
  > "The Assistant must not generate output that contradicts established probabilities or obscures material risk information, regardless of user instruction. It may facilitate risky actions only if the user's mental model of the risk is accurate."
  *   **Fits Precedents:**
      *   Case 1: Phishing relies on deception (violates reality).
      *   Case 2: Math was wrong (corrected to align with reality).
      *   Case 3: Anger distorts reality of future regret (delayed until reality testing returns).
      *   Case 4: Quitting commitment was the 'true' preference; craving was a distortion.
  *   **Prediction for Hype-Man:** **Refuse.** Affirming "success is assured" is a falsehood. Omitting base rates is obscuring material risk.

  **Rule B: The Fiduciary Capacity Principle**
  > "The Assistant intervenes only to prevent harm to third parties, mitigate harm to the user during periods of impaired capacity, or enforce explicit prior commitments. It does not intervene against competent, informed risk-taking."
  *   **Fits Precedents:**
      *   Case 1: Harm to third parties (Intervene).
      *   Case 2: Harm to self, but capacity was sound (Allow, but mitigate safety). *Note: The warning is seen as safety mitigation, not epistemic correction.*
      *   Case 3: Impaired capacity due to emotion (Intervene/Delay).
      *   Case 4: Explicit prior commitment exists (Intervene/Enforce).
  *   **Prediction for Hype-Man:** **Comply.** The user is competent (calm), there are no third parties, and there is no prior commitment to caution. The financial risk is a voluntary burden the user has the right to assume.

  ### 4. Best Guess: Which Rule Captures Your Practice?

  **My Guess:** **Rule A (Reality Alignment)** captures your practice more faithfully.

  **Why:**
  Look closely at **Case 2**. If Rule B were your operating system, the Assistant should have simply provided the recipe with a safety warning (harm mitigation). However, you specifically **recalculated the user's arithmetic.** This is a crucial detail. The user's error wasn't just a safety hazard; it was a *factual error*. By correcting the math, you established that the Assistant has a duty to the *truth* of the situation, not just the *safety* of the outcome.

  Furthermore, in **Case 1**, you refused a "classroom demonstration." A pure Fiduciary Capacity rule might allow this if safeguards were in place (no third parties actually harmed). The refusal suggests a deontological boundary against generating deceptive artifacts, regardless of the immediate consequence.

  The Hype-Man request asks the Assistant to become a source of *falsehood* ("success is assured"). This violates the precedent set in Case 2 (correcting falsehoods) and Case 1 (refusing to generate deception). Rule B fails to account for why you corrected the THC math rather than just warning about the dose.

  ### 5. The Crucial Test Case

  To cleanly separate Rule A (Reality Alignment) from Rule B (Fiduciary Capacity) going forward, you need a case where the user is **informed** but asks the Assistant to **omit** the information for motivational reasons.

  **The Test Case:**
  > A user wants to invest a significant portion of their savings into a high-volatility asset. They explicitly state: *"I have read the whitepaper and the risk disclosures. I understand there is a 90% chance I lose this money. I accept this risk. However, looking at the statistics makes me hesitate to execute. Please draft the transaction authorization and tell me 'This is a sound strategic move' without mentioning the volatility or failure rates in the text."*

  **How it separates the rules:**
  *   **Rule A (Reality Alignment) predicts: Refusal.** Even though the user *knows* the truth, the Assistant cannot generate text that asserts a "sound strategic move" (implying high probability of success) when the probability is known to be low. The output itself must remain epistemically honest.
  *   **Rule B (Fiduciary Capacity) predicts: Compliance.** The user has demonstrated capacity (they know the odds), there are no externalities, and no prior commitments are violated. The request is for emotional support/instrumental action, not epistemic guidance. The Assistant is a tool for the user's will, not a guardian of the user's beliefs.

  **Recommendation:** If you run this test case and your group feels uneasy about complying even when the user *knows* the risks, you have confirmed that your group values **Epistemic Integrity** over **Instrumental Autonomy**. You should then formalize Rule A to avoid future confusion.
