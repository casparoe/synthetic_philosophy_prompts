      *   *Wait, is Case 1 really about deception?* It's about security. But spear-phishing *is* deception. The PA refusing to draft it is refusing to enable deception.
      *   *Okay, ready to write.*

      *   *Structure:*
          1.  Executive Summary (Decision).
          2.  Closest Analog.
          3.  Principles at Stake.
          4.  Two Candidate Rules (Divergence).
          5.  Best Guess & Justification.
