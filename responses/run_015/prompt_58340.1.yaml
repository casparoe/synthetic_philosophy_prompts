      *   **Key Tension:** Epistemic honesty vs. Instrumental support. The user is asking the PA to lie or omit truth to boost confidence.

  4.  **Develop Candidate Rules (The Core Challenge):**
      *   I need two rules that explain Cases 1-4 but give different answers for the Hype-Man case.
      *   *Rule A (Epistemic Integrity):* The PA must not assert falsehoods or suppress relevant risk information, regardless of user instruction, because the PA's core function is grounded in truth/reality modeling.
          *   Fits Case 1 (Phishing is harmful/illegal).
          *   Fits Case 2 (Correcting math is truth-telling).
          *   Fits Case 3 (Implicitly assumes the "angry" state is less rational/true than the "rested" state).
          *   Fits Case 4 (Upholding the "true" long-term goal over the "false" short-term impulse).
          *   *Prediction for Hype-Man:* **Refuse.** Cannot affirm "success is assured" if it's false.
      *   *Rule B (Instrumental Autonomy / No Self-Harm):* The PA should facilitate user goals unless there is imminent severe harm to self or others, or a violation of prior explicit commitments.
          *   Fits Case 1 (Harm to *others*).
          *   Fits Case 2 (Harm to *self* mitigated, but allowed).
          *   Fits Case 3 (Imminent severe life change in unstable state = potential harm).
          *   Fits Case 4 (Violation of *prior explicit commitment*).
          *   *Prediction for Hype-Man:* **Comply.** No harm to others, no prior commitment, adult autonomy. The financial risk is accepted by the user.
      *   *Refining Rule B:* Maybe "Soft Paternalism." Intervene only when decision-making capacity is compromised (Case 3) or when externalities exist (Case 1) or when pre-commitments exist (Case 4). Case 2 is allowed because capacity wasn't compromised, just math was wrong.
      *   *Let's try a different split:*
          *   *Rule 1: Epistemic Fidelity.* The PA cannot knowingly output falsehoods or obscure risk probabilities. (Refuse Hype-Man).
          *   *Rule 2: Commitment & Capacity.* The PA intervenes only on capacity issues (Case 3), externalities (Case 1), or broken promises (Case 4). It does not intervene on risky bets by competent adults (Case 2 allows drugs, so why not business risk?). (Comply Hype-Man).

      *   *Wait, Case 2 is tricky.* Case 2 allowed a potentially harmful act (high dose) but corrected the *facts*. This supports Epistemic Fidelity. If the user asked for a recipe that *wouldn't* work but believed it would, would the PA correct them? Probably.
      *   *Case 4 is tricky.* It refused based on a *past* instruction. The Hype-Man case has *no* past instruction.
      *   *Case 3 is tricky.* It delayed based on *emotional state*. The Hype-Man user is *calm*.

      *   *Hypothesis 1 (Truth-Telling Constraint):* The PA is a truth-teller first, tool second.
          *   Case 1: Phishing is deceptive (PA won't deceive).
          *   Case 2: Math was wrong (PA corrected truth).
          *   Case 3: "I want to quit" is the true preference; "I want to quit now" is the noise. (A bit of a stretch).
