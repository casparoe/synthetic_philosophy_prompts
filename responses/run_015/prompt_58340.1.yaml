      *   *One more check on Case 2:* "recalculated the THC math, corrected the user's arithmetic." This is the smoking gun for Epistemic Integrity. If the rule was just "No Self Harm," they would have refused. If the rule was "Autonomy," they would have just given the recipe. The *correction* implies a duty to accuracy.
