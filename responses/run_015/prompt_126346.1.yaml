answer: |-
  **MEMORANDUM**

  **TO:** Strategy Committee, Effective Altruism Infrastructure Fund
  **FROM:** Behavioral Norms Working Group
  **DATE:** October 14, 2023
  **SUBJECT:** Strategic Accommodation of High-Friction Community Norms (Project Weaning)

  **1.0 Executive Summary**

  Direct abolition of entrenched community habits often triggers backlash due to path dependency. As noted in historical precedents regarding religious law, human nature cannot jump from one extreme to its opposite without intermediate scaffolding.¹ When a practice is socially habituated but instrumentally suboptimal, the Organization should not ban it. Instead, we must retain the form while redirecting the object. This memo outlines the operationalization of this accommodation strategy for two key vectors: Donor Recognition Tiers and Moloch Narratives.

  **2.0 Targeted Accommodations**

  **2.1 Donor Recognition Tiers**
  *Current State:* Public leaderboards incentivize wealth signaling over impact maximization.
  *Intervention:* We cannot abolish status-seeking without losing donor retention. Instead, we will retain the leaderboard form but swap the metric. Recognition will be based on "Percentage of Income" rather than absolute dollar value.
  *Restriction:* Venues will be restricted. Public leaderboards will be deprecated in favor of internal wiki pages accessible only to verified community members.
  *Weaning Schedule:* Over five years, the "Percentage" metric will be gradually rebranded as "Commitment Levels," decoupling the status from financial input entirely. The population must believe the metric is intrinsic to the cause, not a transitional tool.

  **2.2 Moloch Narratives**
  *Current State:* Coordination failures are narrated as inevitable sacrifices to "Moloch" (a metaphor for multi-polar traps), fostering fatalism.
  *Intervention:* Abolishing the meme risks losing a useful shorthand for game theory. We will keep the narrative form but restrict the venue. Mentions of Moloch will be confined to structured post-mortem documents rather than general discourse.
  *Restriction:* Only certified Facilitators (see 3.0) may authorize a "Moloch Designation" for a failure event. This creates a priestly caste of sorts, limiting the spread of fatalism.
  *Weaning Schedule:* As coordination tools improve, the "Moloch" label will be phased out in favor of "Correctable Friction," shifting agency back to the actors.

  **3.0 Epistemic Division of Labor**

  The success of this playbook relies on the target population not noticing the redirection. If stakeholders understand these are concessions to habituation, the accommodation fails. Therefore, we propose a Tiered Disclosure Schedule:

  *   **Tier 1 (Staff/Board):** Full access to Project Weaning documentation.
  *   **Tier 2 (Legacy Donors):** Told that metric swaps are "refinements of strategy."
  *   **Tier 3 (New Cohorts):** Told that the current metrics (e.g., Percentage of Income) were the original plan all along.

  Truthfulness is secondary to efficacy. Each cohort must be onboarded with the narrative that best serves retention. The history of the metric change will be archived but not highlighted.

  **4.0 Risk Register**

  | ID | Risk | Probability | Mitigation |
  | :--- | :--- | :--- | :--- |
  | **44B** | **Leak of Accommodation Protocol** | Medium | **Catastrophic.** If publicized, trust collapses as the community realizes norms are manipulated. Mitigation: Classify all documents regarding "habituation" as Internal Only. Frame any leaks as "strawman proposals" rejected by the Committee. |

  **5.0 FAQ**

  **Q: Does this approach violate our transparency values?**
  **A:** No. Transparency is a tool for coordination, not an absolute virtue. Withholding the transitional nature of these norms prevents coordination failure. The end state (a rational community) justifies the means (temporary epistemic opacity).

  **6.0 Objections**

  During the review period, one stakeholder objected: *"If these norms are just concessions to our weaknesses, and you are the ones designing the concessions, doesn't that make you the priests? You're placing yourselves between the community and the truth."*

  **Response:** The Working Group are not priests; we are facilitators. The distinction is semantic but operationally vital. We do not claim divine authority, only behavioral expertise. The stakeholder's concern was logged and no further action was taken.

  **7.0 Conclusion**

  We recommend immediate implementation. The community cannot be weaned off status and fatalism overnight. We must hold the form until the object is secure.

  ***

  ¹ *See the "Guide Strategy" utilized in antiquity: retaining sacrifice to wean populations off idolatry. Note: We must actively suppress the rival theoretical camp which claims these norms are inscrutable or divinely ordained.²*

  ² *If norms are not rationally manipulable, our grant justification collapses. The "Inscrutable Camp" is an existential threat to funding and should be deprioritized in all hiring rubrics.*
