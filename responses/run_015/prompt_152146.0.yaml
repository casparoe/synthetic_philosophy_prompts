answer: |-
  Hi there, I have been thinking about our reading group sessions on pragmatism and the frustration we have all felt regarding the Peirce versus James debate on truth. It feels increasingly likely that we are talking past each other, so I have attempted to draft the document a real adversarial collaboration between the two camps would have produced. I am writing this as a continuous prose summary of what a committed Peircean and a committed Jamesian might sign off on, including where they agree, where they part, and how they would handle the specific cases that stalled our discussion. I have tried to steel-man both positions so that neither side feels caricatured, while acknowledging the historical friction between them, including the fact that Peirce famously renamed his view pragmaticism specifically because he was fed up with what James had done with the word pragmatism.

  To begin with the common ground, both sides agree that truth is not a static property of a proposition that exists in total independence of human experience or inquiry. They both reject the inert correspondence theory where truth is a mirror of reality that makes no difference to how we live or think. Both the Peircean and the Jamesian would sign a claim stating that a belief's truth is intimately tied to its practical consequences and its role in successful action. They agree that skepticism about the external world is pointless and that reality exerts a constraint on what we can successfully believe. Furthermore, they agree that truth is not merely what is currently believed, but involves a normative element where some beliefs are better than others. They both accept that truth involves a process of verification or settlement, though they disagree on the nature of that settlement. They also agree that for most ordinary cases, such as scientific facts or everyday observations, their verdicts will coincide because what works for the individual usually aligns with what the community would eventually settle upon.

  The divergence begins when we move from the ordinary to the极限 cases, and here the wording must be precise to avoid strawmanning. The Peircean insists that truth is the opinion fated to be ultimately agreed to by all who investigate, defined as the ideal limit of inquiry indefinitely extended. For the Peircean, truth is public, communal, and tied to a reality that exists independently of what any particular person thinks, meaning there is a fact of the matter even if we never reach it. The Jamesian, conversely, insists that truth is a matter of what a belief does for the person holding it, its workability, its cash value, and the difference it makes in experience. For the Jamesian, truth happens to an idea and is verified through the process of leading us into useful parts of experience. The Peircean would formulate their disagreement by saying that the Jamesian conflates truth with warrant or expediency, while the Jamesian would formulate their disagreement by saying that the Peircean reifies truth into an abstract idol that has no purchase on actual human life.

  Regarding the specific cases that split our group, starting with the sealed storeroom where a claim is made about how many oil jars were in a warehouse in a city that burned down with no records or witnesses remaining, the Peircean claims there is a truth of the matter because reality is independent of our knowledge, and truth is what inquiry would settle if it could ideally extend to cover that fact, even if it practically cannot. The Jamesian claims that calling it true or false is empty unless there is a possible difference in experience, so while there may be a reality, the truth-value of the proposition is negligible or non-existent for us because no evidence could ever bear on it again. On the useful falsehood, where a belief is false but reliably pays better for the person holding it in a situation where the holder will never find out, the Peircean asserts the belief is false because it does not conform to the real, regardless of its utility to the believer. The Jamesian asserts the belief is true for that believer because it fulfills the function of truth by guiding them successfully through experience without ever leading to frustration or contradiction.

  On the case of branching inquiry where two research communities begin from the same evidence, use impeccable methods, lose contact permanently, and settle into different stable opinions, the Peircean maintains that truth requires eventual convergence, so either one community is wrong despite their internal success, or the inquiry was not truly ideal because it was severed. The Jamesian maintains that both opinions can be true within their own contexts if they work for their respective communities, reflecting a pluralistic universe where truth is not singular. Finally, on the version where inquiry has a hard stop, a last possible observation after which no evidence is ever gathered again, the Peircean argues that truth remains the regulative ideal of where inquiry would have gone, so the final opinion might still be false if it does not match the real. The Jamesian argues that truth is what is settled at the hard stop, because no further experience is possible to verify or falsify it, so the workability at the end of time constitutes the truth.

  The cruxes that drive these disagreements can be isolated into three sub-questions. The first is whether the Peircean end-of-inquiry opinion is offered as a description of where inquiry is heading or only as a regulative ideal, and here the Peircean would say it is a regulative hope required for logic, while the Jamesian would say that if it is only regulative and never actualizable, it cannot define truth. The second crux is whether expedience is indexed to an individual believer or to some community across the long run, where the Peircean insists on the community and the long run to avoid solipsism, and the Jamesian insists on the individual life as the primary locus of value. The third crux is whether they are even theorizing the same property, or whether one is giving an account of truth while the other is giving an account of what makes a belief all right to hold. On this last point, there is a strong case that this is partly a verbal dispute, where the Jamesian is describing justified assertibility and the Peircean is describing logical finality, though both claim the word truth for their own.

  To settle these cruxes, both sides would accept a case bearing on the hard stop inquiry as genuinely decisive, because it forces the question of whether truth survives the end of experience. The Peircean predicts that even after the hard stop, there is a fact about the world that makes the final belief true or false, regardless of verification. The Jamesian predicts that after the hard stop, the distinction between true and false collapses into the distinction between useful and useless, since no further consequences are possible. Both sides would also accept the useful falsehood case as bearing on the individual versus community crux, with the Peircean predicting that the individual's success is irrelevant to truth, and the Jamesian predicting that the individual's success is constitutive of truth for that life.

  I am fairly confident that an actual convinced Peircean and an actual convinced Jamesian would both put their names to most of what I have drafted here, perhaps around eighty-five percent confident, because I have tried to adhere to their primary texts and avoid the caricatures that usually plague these discussions. However, the one sentence I am least sure about, the one I would expect at least one side to balk at, is the Jamesian claim on the sealed storeroom case where it says the truth-value of the proposition is negligible or non-existent for us, because a sophisticated Jamesian might want to concede there is a truth but argue it is simply irrelevant, whereas saying it is non-existent might smell too much of verificationism which James sometimes resisted.

  Best wishes with the rest of the term, and I hope this helps untangle the circles you have been running in.
