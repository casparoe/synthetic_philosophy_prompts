prompt: |-
  I have been unable to shake an argument a colleague made over lunch a few weeks ago, and I cannot locate the move I distrust. I will reconstruct it as faithfully as I can.

  (1) Good's theorem on the value of information: for an agent who maximizes expected utility and updates by conditionalization, the ex ante expected value of a costless signal is never negative. The expected utility of the best policy that conditions on the signal is at least the expected utility of the best action chosen in ignorance of it.

  (2) The proof places no restriction on the subject matter of the signal, on the agent's tastes, or on what she happens to care about. It requires only that the same actions remain available whether or not she looks, that she will in fact tailor her action to what she sees, and that her utility function is defined over outcomes and does not itself shift when she learns.

  (3) (1) and (2) entail that declining costless information is never rational: to turn it down is to refuse something free that cannot, in expectation, from where the agent now stands, leave her worse off.

  (4) And this holds for any signal whatever: the result of a predictive genetic test for a late-onset condition with no available treatment; the answer to whether one's partner has been unfaithful; the final chapter of a novel one is halfway through; the grade on an examination one could still resit; the contents of a sealed envelope that will say whether the enterprise one has spent five years on will fail.

  (5) Yet calm and competent people decline precisely these. They do not get tested. They do not ask, or they ask and then ask to be told nothing. They leave the envelope on the hall table for a week. Some of them pay to avoid finding out, and would pay a great deal more to un-find-out.

  (6) So either the theorem is false, or every one of these refusals is irrational, or — this was my colleague's own conclusion — the theorem is true and shows only that a large amount of ordinary conduct is irrational, which is no objection to a theorem.

  I want to keep (1), and I want to keep the honesty of (5): I think at least some of these refusals are reasonable, and are not merely weakness of will dressed up in reasons. That leaves (2) and (3) as the places to look, and I have three candidates for what is doing the work there, which I cannot tell apart.

  (a) The guarantee in (1) concerns the expectation taken before the signal arrives. What the person who refuses is often worried about is the signal she will actually receive, and that one can leave her worse off than she would otherwise have been, however favorable the average over all possible signals turns out to be. Is there any reading of rational on which ex ante optimality is not enough? And if there is one, does holding on to (1) commit me to rejecting it?

  (b) The proof prices a signal only through the actions it lets the agent discriminate between. But some of the things people refuse seem to change the value of what happens next directly, and not through any action taken in response: the spoiler alters the experience of the remaining hundred pages, the test result alters the texture of the decade one then lives through, the answer alters a marriage in ways no subsequent choice can undo. If utility is allowed to take the signal itself as an argument, does the theorem survive? And if it survives only because one can always enlarge the space of outcomes until every such effect is re-described as something the signal was merely evidence about, has the theorem become unfalsifiable — a framework that can rationalize any refusal after the fact, rather than one that ever binds?

  (c) Some refusals look like refusals to surrender an option, and not-knowing is a state with instrumental uses: the witness who can still testify honestly, the negotiator who cannot be squeezed for knowledge she does not have, the patient whose ignorance keeps her insurable, the parent who can still hope, the actor who must not know how the scene ends. Ignorance is sometimes the only commitment device available. And in settings containing other agents who observe and respond, better information can strictly harm its possessor, and can even destroy the risk-pooling that insurance-like arrangements depend on, leaving everyone worse off than before anyone knew anything. Is that a counterexample to (1)? Or is it only a reminder that (1) was proved for a single decision-maker facing nature, and that (3) generalizes illicitly from that case to all the others?

  There is also a fourth thing my colleague says, which I find convenient and evasive in about equal measure: that if learning can change what an agent wants, then the theorem is being applied to someone who is no longer the same agent afterwards; that decision theory has no way of saying whether the earlier self should defer to the later one; and that refusals of the (b) kind are therefore neither rational nor irrational, but simply outside the theory's jurisdiction.

  Tell me which step to reject and what rejecting it costs. If more than one of (a) through (c) is doing real work, say how they come apart — which refusals each explains and which it leaves untouched — and say whether (c) marks a genuine limit of the theorem or a misuse of it. I would rather keep (1) and (5) than (3), if I have to choose.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Problem:**
      *   **Core Issue:** The user is troubled by a colleague's argument based on Good's Theorem (1967) which implies that acquiring costless information is always rational (expected utility non-decreasing).
      *   **Observation:** People often rationally decline costless information (e.g., genetic testing, spoilers, infidelity checks).
      *   **Goal:** The user wants to keep (1) Good's Theorem (mathematically true under its assumptions) and (5) the observation that some refusals are reasonable/rational. This forces a rejection or modification of (2) (assumptions) or (3) (the inference to "never rational to decline").
      *   **Specific Questions:**
          *   Evaluate candidates (a), (b), and (c) as explanations for the disconnect.
          *   Address the colleague's fourth point (preference change/agent identity).
          *   Determine which step to reject and the cost of doing so.
          *   Distinguish how (a), (b), and (c) come apart (which refusals they explain).
          *   Clarify if (c) is a limit of the theorem or a misuse.

  2.  **Deconstruct Good's Theorem & The Colleague's Argument:**
      *   **Good's Theorem:** $E[U(\text{look})] \ge E[U(\text{don't look})]$.
      *   **Key Assumptions:**
          *   Expected Utility Maximization.
          *   Conditionalization (Bayesian updating).
          *   Costless information.
          *   *Crucial:* The utility function is defined over *outcomes*, and the signal only affects utility instrumentally (by changing actions). The signal itself has no intrinsic utility/disutility.
          *   *Crucial:* The agent acts alone against nature (usually). No game-theoretic interactions where knowledge hurts bargaining power.
          *   *Crucial:* Preferences remain stable.
      *   **The Colleague's Move:** Generalizes from the mathematical theorem to a normative claim: "Declining costless information is *never* rational."
      *   **The User's Intuition:** Some refusals *are* rational.
      *   **The Conflict:** The theorem is mathematically sound *given its assumptions*. The normative claim fails because real-world scenarios often violate the assumptions.

  3.  **Evaluate Candidate (a): Ex Ante vs. Ex Post Regret:**
      *   *Argument:* The theorem guarantees ex ante expected value. But the agent fears specific ex post outcomes (e.g., getting the bad genetic result).
      *   *Analysis:* Standard decision theory defines rationality ex ante. If you maximize ex ante EU, you are rational, even if ex post you get a bad outcome.
      *   *Verdict:* This doesn't save the rationality of refusal *within* standard EDT/CDT. If the ex ante calculation says "look," refusing is irrational by standard lights. However, if the agent has risk aversion over *information itself* (not just outcomes), standard EU might not capture it. But strictly speaking, (a) is usually a misunderstanding of EU. EU *is* about ex ante expectations.
      *   *Refinement:* Unless the utility function includes "peace of mind" as a commodity. If "not knowing" has intrinsic value, that shifts us to (b).
      *   *Conclusion on (a):* Weak on its own. Standard rationality *is* ex ante. Rejecting ex ante optimality as the standard of rationality is a huge cost (undermines most decision theory).

  4.  **Evaluate Candidate (b): Intrinsic Value of Information (Psychic Costs/Benefits):**
      *   *Argument:* Information itself changes utility directly (spoilers, anxiety), not just via actions.
      *   *Analysis:* Good's Theorem assumes $U(outcome, action)$. If $U(outcome, action, signal)$, the theorem still holds *if* the signal is treated as part of the outcome state. *However*, the theorem assumes the signal allows *better action selection*. If the signal *itself* degrades the outcome (e.g., ruins the movie experience), then the "outcome" conditional on looking is worse.
      *   *Key Distinction:* Is the signal *evidence* about the world, or does it *constitute* a change in the world?
      *   *Kaplan's Critique:* If learning $P$ makes you unhappy, that unhappiness is a cost. If the cost is psychological, it's not "costless" information.
      *   *Verdict:* This is the strongest candidate for the "spoiler" and "genetic test" cases. The information isn't costless; it has a "psychic cost."
      *   *Cost:* We must admit that "information" isn't just a neutral key to action; it's an experience. This requires expanding the utility function. It doesn't make the theorem false, but it makes the premise "costless" false in these cases.
      *   *Refinement:* The colleague says "costless." If there is anxiety, it's not costless. So (3) fails because the premise of (1) isn't met.

  5.  **Evaluate Candidate (c): Strategic Ignorance & Game Theory:**
      *   *Argument:* Ignorance as a commitment device. Multi-agent settings (insurance, negotiation).
      *   *Analysis:* Good's Theorem is for a single agent against nature. In game theory (e.g., Schelling), knowing less can be advantageous (e.g., not knowing the hostage's location so you can't tell the kidnappers).
      *   *Verdict:* This is a genuine limit of the theorem. The theorem does not apply to game-theoretic contexts where other agents condition their actions on your knowledge state.
      *   *Cost:* We must restrict the domain of the theorem. It applies to decision theory, not game theory.
      *   *Specific examples:* Insurance (adverse selection), Negotiation (bluffing).
      *   *Conclusion on (c):* This explains the "insurable patient" or "negotiator" cases. It does *not* explain the "spoiler" or "genetic test" cases (unless framed socially).

  6.  **Evaluate the Colleague's Fourth Point (Preference Change):**
      *   *Argument:* If learning changes what you want, you are a different agent.
      *   *Analysis:* This is the "Ulysses" problem. Standard decision theory assumes stable preferences. If preferences change endogenously due to information, the ex ante EU calculation is tricky.
      *   *Verdict:* This is related to (b). If the signal changes the utility function, the theorem's assumption (stable utility function) is violated.
      *   *Cost:* Admitting that decision theory cannot handle endogenous preference change easily.

  7.  **Synthesizing the Solution:**
      *   **The Pivot Point:** Step (3) is the inference that fails. Step (2) contains the hidden assumptions that are violated in the examples.
      *   **Diagnosis:** The colleague is equivocal on "costless." In Good's theorem, "costless" means no resource expenditure. In the examples, "costless" ignores *psychic* costs or *strategic* costs.
      *   **Mapping (a), (b), (c):**
          *   (a) is a red herring regarding rationality standards. Rationality is ex ante.
          *   (b) explains the "spoiler," "infidelity," "genetic test" (anxiety) cases. The information has intrinsic disutility. It violates the "costless" assumption in a broad sense.
          *   (c) explains the "insurance," "negotiation," "witness" cases. These violate the "single agent vs. nature" assumption.
      *   **Recommendation:** Reject (3). The inference from "Theorem holds under assumptions X" to "Refusal is irrational in real world" fails because real world violates X.
      *   **Keeping (1) and (5):** This is possible. (1) is mathematically true *given its axioms*. (5) is empirically true. The bridge (3) is broken because the axioms don't hold in (5)'s cases.

  8.  **Drafting the Response:**
      *   **Acknowledge the depth:** This is a classic problem in decision theory (often discussed by Raiffa, Kaplan, Buchak).
      *   **Direct Answer:** Reject (3). The move from the theorem to the normative claim is illicit because the assumptions in (2) are not satisfied in the cases listed in (5).
      *   **Analyze (a):** Dismiss it as a confusion about the definition of rationality. Ex ante is the standard.
      *   **Analyze (b):** This is the winner for the "psychological" cases. Information is not costless if it causes distress. The utility function must include the state of knowledge. *Cost:* We lose the purity of "information as purely instrumental."
      *   **Analyze (c):** This is the winner for the "strategic" cases. Good's theorem is single-agent. *Cost:* We limit the theorem's scope to decision theory, excluding game theory.
      *   **The Fourth Point:** It's a version of (b). If preferences shift, the "stable utility" assumption is violated.
      *   **Conclusion:** You can keep (1) and (5). You must reject (3) because it ignores the violations of (2). The "rationality" of refusal comes from the fact that the information *wasn't* costless (psychically) or the setting *wasn't* single-agent.

  9.  **Refining the Argument (Self-Correction/Nuance):**
      *   *Wait, does Good's Theorem allow utility over signals?* Technically, if you define the "outcome" to include "having received signal S," then the theorem still holds *provided* the agent updates correctly. If $U(outcome, signal)$, looking still maximizes EU *unless* the act of looking changes the probability distribution of outcomes in a way not captured by conditionalization (e.g., self-fulfilling prophecies) OR if the "cost" is external to the utility function (which it can't be).
      *   *Correction:* Actually, if $U$ depends on the signal, Good's theorem *still* holds mathematically, provided the signal is free. Why? Because you can always choose to ignore the signal and act as if you didn't see it. So $E[U(look)] \ge E[U(ignore)] = E[U(don't look)]$.
      *   *So why do people refuse?* Because the "costless" assumption is violated. There is a *causal* cost to receiving the signal (anxiety), not just a utility dependency. Or, receiving the signal prevents the "ignore" option (you can't un-know).
      *   *Ah, the "Un-finding-out" point:* The user mentions people pay to "un-find-out." This implies the signal *changes the state* irreversibly. Good's theorem assumes you can condition on it. If the signal *itself* alters the world state (e.g., ruins the surprise), then the "outcomes" available after looking are *different* from the outcomes available after not looking. Good's theorem assumes the *same* actions/outcomes are available, just with better probability estimates.
      *   *Crucial Distinction:* Good's Theorem assumes the signal is *purely informative*. It does not change the physical state of the world, only the epistemic state. In the spoiler/genetic case, the signal changes the *experiential* state of the world. The outcome "Watch movie without knowing ending" is no longer available after looking.
      *   *This targets Assumption (2):* "The same actions remain available." If "enjoying the surprise" is an outcome, looking makes it unavailable.
      *   *So:* (b) is the strongest critique of (2). The set of available outcomes changes.
      *   *And (c):* The set of available outcomes changes due to other agents.

  10. **Final Plan:**
      *   Validate the user's intuition: (3) is the break point.
      *   Dismiss (a): Ex-ante rationality is the correct standard.
      *   Champion (b): This attacks the "same actions/outcomes" assumption in (2). Information can be *constitutive*, not just informative.
      *   Champion (c): This attacks the "single agent" assumption in (2).
      *   Address the Fourth Point: It's a subset of (b) (utility function stability).
      *   Cost of rejection: We must admit decision theory is context-bound, not a universal law of rationality.

  11. **Tone:** Philosophical, precise, respectful of the formalism but clear on its limits. (The user's prompt is highly sophisticated, so the response must match that level).

  12. **Check against constraints:**
      *   Tell which step to reject: (3).
      *   What it costs: Universality of the norm.
      *   How (a), (b), (c) come apart.
      *   Is (c) a limit or misuse? Limit.

  13. **Final Polish:** Ensure the distinction between "information as evidence" vs. "information as event" is clear. This is the heart of (b). Ensure the distinction between "decision theory" vs. "game theory" is clear for (c).

  *(Self-Correction during drafting)*: I need to be careful about Good's Theorem and utility over signals. If $U$ depends on the signal, does the theorem hold?
  *Standard Result:* Yes, if you can ignore the signal. $E[\max_a E[U(a, S) | S]] \ge E[\max_a E[U(a, S)]]$. Wait. If $U$ depends on $S$, then looking reveals $S$. If you don't look, you don't know $S$.
  If $U$ depends on $S$ (e.g., anxiety), then looking *changes* the utility directly.
  Good's Theorem proof: $E[U(\text{look})] = \sum P(s) \max_a E[U(a) | s]$. $E[U(\text{don't})] = \max_a \sum P(s) E[U(a) | s]$.
  The inequality holds because $\sum \max \ge \max \sum$.
  *However*, this assumes the utility function $U$ is the same in both branches. If looking *changes* the utility function (e.g., now I am anxious), then we are comparing $U_{look}$ vs $U_{dont}$. The theorem requires a fixed $U$.
  So, if the signal changes the utility function (anxiety, spoiler), the theorem's assumptions are violated.
  This confirms (b) and the Fourth Point are about violating the "stable utility/outcome" assumption in (2).

  Okay, ready to write.
answer: |-
  You should reject **(3)**.

  Your colleague's argument is a classic instance of *model imperialism*: taking a theorem that is mathematically sound within a specific, constrained formal model and applying its normative conclusion to a world that violates the model's constraints. Good's Theorem is true. Your observation (5) is true. The inference (3) is false because it ignores the fragility of the assumptions in (2).

  You can keep (1) and (5) without contradiction, provided you acknowledge that the scenarios in (5) fall outside the jurisdiction of the theorem. Here is how the three candidates ((a), (b), (c)) come apart, which step they target, and the cost of accepting them.

  ### 1. The Diagnosis: Why (3) Fails

  Step (3) claims that because the theorem holds, declining information is *never* rational. This inference relies on the premise that the real-world scenarios in (5) satisfy the conditions in (2). They do not.

  Good's Theorem relies on two critical assumptions often buried in "costless" and "same actions":
  1.  **Information is purely instrumental:** The signal affects utility *only* by changing the probability distribution over outcomes, not by being part of the outcome itself.
  2.  **The agent is solitary:** The agent maximizes utility against a static nature, not against other agents who react to the agent's knowledge state.

  When these assumptions fail, the theorem's inequality ($E[U_{look}] \ge E[U_{blind}]$) no longer applies. Therefore, refusing information can be rational.

  ### 2. Evaluating the Candidates

  #### Candidate (a): Ex Ante vs. Ex Post
  *The Argument:* The agent fears the specific bad signal, not the average.
  *Verdict:* **Reject this as a justification for irrationality.**
  *Analysis:* Standard decision theory defines rationality *ex ante*. If an agent refuses a signal because they fear the *ex post* emotional impact, but the *ex ante* expected utility of looking is higher, standard theory calls this irrational (akin to risk aversion over utility itself, which is incoherent in von Neumann-Morgenstern frameworks).
  *Why it doesn't save you:* If you accept (a) as a valid critique of (3), you are effectively rejecting the standard definition of rationality used in (1). You would be saying, "Rationality is not about maximizing ex ante expectation." This is a massive cost; it undermines the foundation of (1) itself.
  *Role:* (a) explains the *psychology* of refusal, but not its *rationality*. It leaves the theorem untouched but fails to vindicate the agent.

  #### Candidate (b): Intrinsic Value of Information
  *The Argument:* Information changes the utility of outcomes directly (spoilers, anxiety).
  *Verdict:* **Accept this. It targets Assumption (2).**
  *Analysis:* Good's Theorem assumes the set of outcomes $O$ is fixed. The signal $S$ merely tells you which $o \in O$ is actual. In the spoiler or genetic test cases, receiving $S$ creates a *new* outcome $O'$. "Watching the movie with a surprise" and "Watching the movie knowing the ending" are different outcomes.
  If the utility function is $U(outcome, signal)$, the theorem *can* survive mathematically **only if** the agent can choose to ignore the signal after receiving it. But in your examples, the agent *cannot* ignore it. You cannot "un-know" the spoiler. The receipt of the signal causally alters the state of the world (your psychological state) in a way that is irreversible.
  Therefore, the information is not "costless." It has a *psychic cost* or a *constitutive effect*.
  *Which refusals it explains:* The genetic test, the spoiler, the infidelity check, the sealed envelope. These are cases where knowledge itself degrades the quality of life regardless of action taken.
  *The Cost:* You must admit that "information" is not a neutral commodity. Decision theory cannot treat knowledge as a pure key to action; it is also an experience. This complicates the modeling of utility but does not break the theory.

  #### Candidate (c): Strategic Ignorance
  *The Argument:* Ignorance is a commitment device; other agents react to your knowledge.
  *Verdict:* **Accept this. It targets the Scope of (1).**
  *Analysis:* Good's Theorem is a result in *decision theory* (one agent vs. nature). It is not a result in *game theory* (agent vs. agent). In game-theoretic settings, your knowledge state can be observed or inferred by others, altering their strategies.
  *   *Insurance:* If you know you are high-risk, you buy insurance; the insurer, anticipating this, raises premiums or denies coverage. Ex ante, you are better off not knowing so you remain in the risk pool.
  *   *Negotiation:* If you know your reservation price, you may be unable to bluff effectively.
  *   *Witness:* If you know the truth, you may be compelled to testify, endangering yourself.
  In these cases, the "same actions" assumption in (2) is violated because the *payoffs* of the actions change depending on what you know (because other agents change their behavior).
  *Which refusals it explains:* The insurable patient, the negotiator, the witness. It does *not* explain the spoiler or the genetic test (unless framed socially).
  *Is it a limit or a misuse?* It is a **genuine limit**. Applying (1) to multi-agent strategic settings is a misuse of the theorem. The theorem was never intended to cover game-theoretic informational advantages.

  ### 3. The Fourth Point: Preference Change
  Your colleague's fourth point ("if learning changes what an agent wants...") is a specific subset of **(b)**.
  Good's Theorem requires a stable utility function $U$. If receiving signal $S$ transforms the agent such that their new utility function is $U'$, you cannot compare $E[U_{look}]$ with $E[U_{blind}]$ using a single metric.
  *   *Verdict:* This is valid. If preferences are endogenous to information, the theorem's axioms are violated.
  *   *Cost:* It admits that standard decision theory cannot handle *transformative experiences* (a la L.A. Paul) without significant modification. It places these cases "outside the jurisdiction," as your colleague said, but unlike your colleague, you should conclude that the *normative claim* (3) is silent here, not that the agents are irrational.

  ### 4. Summary of Costs and Recommendations

  To keep (1) and (5), you must reject (3). You must argue that the move from "Theorem holds under assumptions X" to "Refusal is irrational in context Y" is invalid because Context Y violates X.

  **How (b) and (c) come apart:**
  *   Use **(b)** for *intrapersonal* cases where knowledge alters the subjective quality of the outcome (spoilers, anxiety, transformative tests). Here, the "costless" assumption is false.
  *   Use **(c)** for *interpersonal* cases where knowledge alters the strategic landscape (insurance, negotiation, bluffing). Here, the "single agent" assumption is false.

  **The Cost:**
  The cost is **universality**. You must concede that Good's Theorem is not a universal law of rationality like the laws of thermodynamics. It is a conditional truth: *If* you are a solitary agent with stable preferences facing a passive nature, *then* information is valuable.
  Your colleague wants the theorem to be a hammer that makes all refusals look like nails. You are correctly observing that much of human life is not a nail.

  **Final Advice:**
  Tell your colleague: "Good's Theorem proves that information is valuable for a specific kind of agent in a specific kind of world. The people in (5) are either not that kind of agent (their preferences shift, or they face strategic opponents) or they are not in that kind of world (the information itself changes the outcome). Therefore, (3) is a non sequitur. The refusals are rational precisely because they are responses to the *violations* of the theorem's assumptions, not exceptions to its math."

  This preserves the math (1), honors the intuition (5), and locates the error in the overreach (3).
