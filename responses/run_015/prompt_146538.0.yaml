prompt: |-
  Write a deadpan parody of an FAQ page for a fictional B2B startup, "Benacerraf Solutions," that sells subscription tiers purporting to resolve Benacerraf's dilemma—the tension that if mathematical objects are abstract and causally inert, then a causal theory of mathematical knowledge fails, while abandoning the causal constraint threatens to make mathematical belief indistinguishable from lucky syntax-manipulation. Keep the voice of bland SaaS documentation. Structure it as numbered sections: (1) "What problem do we solve?"—an explainer that quietly assumes a causal theory of knowledge and treats mathematical belief as a service outage; (2) Pricing tiers named after philosophical positions—e.g., "Platonist Premium" (restores direct access to abstract objects at a markup), "Nominalist Freemium" (denies the objects exist but keeps the invoices), "Reliabilist Pro" (waives causal-access requirements but disclaims warranty for reference failure); (3) A "Refund and Continuity Policy" addressing users who prove a theorem but then lose confidence that the proof refers to anything real; (4) A testimonial from a satisfied number theorist who now suspects her results are about notation rather than structures, and asks whether her subscription covers ontological drift. The satire should exaggerate the real tendency to frame Benacerraf's dilemma as an epistemological glitch to be patched rather than a structural crisis in the philosophy of mathematics, and should target the discourse of tech solutionism applied to a problem with no engineering fix. About 600 words. The philosophical stakes should be legible from the corporate jargon alone, readable both to someone familiar with the dilemma and to someone who is not; do not include citations, bibliographies, or references to specific papers by date.
