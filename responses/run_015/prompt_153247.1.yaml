answer: |-
  At the reception following the metaphysics panel, Marcus cornered Will near the cash bar, waving a printout of first-order logic formulas.

  "I've cracked it," Marcus said, buzzing with the confidence of three glasses of house wine. "My fieldwork with the Kaelo tribe proves moral realism. When they say 'Zog,' they aren't just expressing emotion. They're referring to a genuine normative property. I'm ready to quantify over wrongness."

  Will took a slow sip of his drink, eyeing the formulas. "Did you run the radical translation test?"

  "Obviously. They utter 'Zog' when someone steals, and they shun the thief. The behavioral data is robust."

  "Behavioral data is compatible with multiple manuals, Marcus. 'Zog' could mean 'morally wrong,' but it fits the evidence just as well if it means 'ritually unclean,' 'socially inefficient,' or 'taboo.' There is no fact of the matter which translation is correct."

  "But the normativity! They feel the obligation."

  "Feelings are psychological states, not observation sentences. Look, here's the problem. You want to put 'Wrongness' into your ontology. You want to say there exists an *x* such that *x* is Wrong. But if the translation is indeterminate, the variable *x* has no determinate value. You're trying to bind a variable to a ghost."

  Marcus frowned. "So I'm wrong about wrongness?"

  "No. You're just ontologically overspending. Existence is just what your bound variables range over. If the translation manual doesn't fix the reference, the variable is empty. You can't build an ontology on a vibration."

  "So I have to eliminate moral properties?" Marcus looked devastated. "But ethics is vital."

  "Ethics is vital. 'Wrongness' as a property is not. Stop quantifying over it. Not because it doesn't matter, but because the translation manual is permanently underdetermined. It's ontological austerity."

  Marcus stared at his formulas. "So what do I publish? 'There is no wrongness'?"

  "Publish that there are speakers, there are actions, and there are social consequences. Keep the ethics, drop the entities. Think of it as balancing your ontological budget. You can't budget for entities that don't show up in the behavioral data."

  Marcus sighed, crumbling the printout. "So I'm grounded?"

  "No," Will said, turning back to the bar. "Your variables are."
