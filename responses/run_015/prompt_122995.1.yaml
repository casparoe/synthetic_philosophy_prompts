prompt: |-
  hey — I'm in 11th grade and I do Ethics Bowl, and one of our cases this year is about a school district that can only afford one of two things: an elevator for one girl who uses a wheelchair (right now someone has to carry her up a flight of stairs between classes, which is humiliating and she misses a lot of class), or new textbooks for about 1,800 kids where the benefit to each kid is pretty small. Our coach told me to look up Scanlon's contractualism because it says something interesting about cases where one person's loss is huge and everyone else's is tiny. I found a blog post explaining it and pasted a chunk into my notes:

  "Scanlon's contractualism says that an act is wrong if there is some principle for the general regulation of behaviour that no one could reasonably reject and that forbids the act. The 'no one could reasonably reject' bit puts it in the social contract tradition: morality is what self-interested people would agree to in a bargain, with the word 'reasonable' added to make it sound less brutal than Hobbes or Gauthier. The important upshot is that contractualism cannot add up benefits and burdens across different people. You have to look at each person's complaint one at a time, from that person's own point of view, and ask which complaint is strongest — you can never pile up a thousand weak complaints to beat one strong one. So numbers basically drop out entirely: one person losing a hand outweighs any number of people getting a stubbed toe, and one death outweighs any number of mild headaches, no matter how many. This means contractualism quietly collapses into Rawls-style maximin, since you always end up asking which single individual is worst off under each option. And because what matters is whether people actually object, anyone who complains loudly enough can effectively veto a principle, while burdens nobody bothers to complain about create no complaint at all. That last feature is what sinks the theory: no sane moral view says that one person's stubbed toe matters more than a million people's stubbed toes."

  My coach read my notes and just said the post is "caricature-grade" and walked off, which isn't super helpful. Can you go through it and tell me which bits are basically right, which are the kind of subtle misreading a defender of Scanlon would object to (like what two things are being conflated), and whether the "that's what sinks the theory" bit at the end actually follows from the parts that are true? I think I half-believe the numbers part because that's the part that makes it different from utilitarianism, but I genuinely can't tell where the summary stops being fair.

  Two more things. First: a commenter on the post said the standard contractualist fix is that complaints get ranked by strength and numbers only break ties between complaints of equal strength. Is that Scanlon's actual move or something a commenter made up, and does it help with the elevator case or does the elevator just win no matter how tiny the per-kid textbook benefit gets? Second, I keep wondering about a weird variant: what if instead of 1,800 kids each getting one small benefit, it's the same one kid getting a small benefit 1,800 times? If the answer changes there, that seems like it shouldn't matter as much as people think, but I can't say why. Anyway — no reading recs, I just want to know what's actually going on with the view.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** 11th-grade student, participates in Ethics Bowl.
      *   **Task:** Evaluate a specific blog post summary of T.M. Scanlon's contractualism. Identify accurate parts, subtle misreadings/conflations, and whether the conclusion ("that's what sinks the theory") follows.
      *   **Specific Questions:**
          1.  Which bits of the summary are right vs. caricature/misreading?
          2.  Does the "numbers drop out" claim hold? (The "aggregation" problem).
          3.  Is the "tie-breaking by numbers" move Scanlon's actual view or a commenter's invention? Does it help in the elevator case?
          4.  Analyze the "one kid 1,800 times" variant (repetition vs. distribution).
      *   **Constraints:** No reading recommendations. Focus on explaining what's actually going on with the view.
      *   **Tone:** Helpful, analytical, accessible but philosophically precise (appropriate for an Ethics Bowl student).

  2.  **Deconstruct the Blog Post Summary:**
      *   *Claim 1:* "Act is wrong if... principle... no one could reasonably reject." -> **Accurate.** This is the core definition.
      *   *Claim 2:* "Social contract tradition... self-interested people... bargain." -> **Misleading/Inaccurate.** Scanlon explicitly distinguishes his view from Hobbesian mutual advantage. It's about *justification to others*, not bargaining power.
      *   *Claim 3:* "Cannot add up benefits and burdens across different people." -> **Mostly Accurate (with nuance).** This is the "aggregation" issue. Scanlon is skeptical of simple summation.
      *   *Claim 4:* "Numbers basically drop out entirely." -> **Caricature/Exaggeration.** Scanlon doesn't say numbers *never* matter, but they don't matter via simple summation.
      *   *Claim 5:* "Collapses into Rawls-style maximin." -> **Debatable/Simplification.** It shares features (focus on the worst off) but isn't identical to maximin.
      *   *Claim 6:* "Anyone who complains loudly enough can effectively veto." -> **Misreading.** "Reasonably reject" isn't about volume or actual complaining; it's about objective reasons.
      *   *Claim 7:* "One person's stubbed toe matters more than a million people's stubbed toes." -> **False/Strawman.** This is the "numbers problem" critique (Kamm/Scanlon debate), but Scanlon has responses. It's not the *conclusion* of his theory.
      *   *Claim 8:* "That's what sinks the theory." -> **Contested.** This is the critic's opinion, not a logical consequence of the premises.

  3.  **Address the Specific Ethics Bowl Case (Elevator vs. Textbooks):**
      *   *Scenario:* One girl (huge burden: humiliation, missed class, safety) vs. 1,800 kids (small benefit: slightly better textbooks).
      *   *Contractualist Analysis:* Compare the strongest individual complaint under Option A (no elevator) vs. Option B (no textbooks).
      *   *Girl's complaint:* Very strong (dignity, access, education).
      *   *Any single textbook kid's complaint:* Very weak (marginally worse book).
      *   *Result:* The girl's complaint is stronger than any *individual* textbook kid's complaint. Aggregation is restricted. So, contractualism likely favors the elevator.

  4.  **Address the "Numbers/Tie-Breaking" Question:**
      *   *Source:* This is a major debate in the literature (Scanlon vs. Kamm vs. Otsuka).
      *   *Scanlon's View:* In *What We Owe to Each Other*, Scanlon is hesitant about aggregation. Later (in "Contractualism and Utilitarianism" and revisions), he acknowledges numbers might matter in *tie-breaking* cases (where individual complaints are roughly equal).
      *   *Relevance to Case:* In the elevator case, the complaints are *not* equal. The girl's is vastly stronger. So tie-breaking doesn't apply. The elevator wins regardless of the number of kids, unless the textbook benefit per kid crosses a threshold of significance.

  5.  **Address the "One Kid 1,800 Times" Variant:**
      *   *Scenario:* One kid gets small benefit 1,800 times vs. Girl gets huge burden.
      *   *Contractualist Intuition:* This highlights the "separateness of persons."
      *   *Analysis:* If it's the *same* kid, the benefits aggregate *for that person*. Their complaint becomes stronger (losing 1,800 small benefits is worse than losing 1).
      *   *Why it matters:* Contractualism cares about individual standpoints. 1,800 people each losing a little is different from 1 person losing a lot. This justifies why numbers might matter differently across persons vs. within a person.
      *   *Does the answer change?* Yes. If one kid loses 1,800 small benefits, their total loss might rival the girl's loss. If 1,800 kids each lose 1 small benefit, no *individual* has a strong complaint. This distinction is central to the non-aggregation view.

  6.  **Drafting the Response (Iterative refinement):**

      *   *Introduction:* Acknowledge the coach's reaction (it was a bit harsh but the post is indeed problematic). Validate the student's confusion.
      *   *Section 1: The Blog Post Autopsy.* Go through the claims.
          *   Right: The definition ("reasonably reject"), the focus on individual complaints.
          *   Wrong/Caricature: "Self-interested bargain" (it's about justification), "Loudness" (it's about reasonableness, not volume), "Stubbed toe vs. million toes" (Scanlon has nuanced responses to this).
          *   The "Sinks the Theory" claim: This is a critique, not a logical deduction.
      *   *Section 2: The Numbers/Aggregation Issue.* Explain *why* Scanlon restricts aggregation (separateness of persons). Explain the "strongest complaint" model.
      *   *Section 3: The Tie-Breaking Move.* Clarify that this is a refinement Scanlon considered (especially in later work). Explain that it only applies when complaints are *similar in strength*. In the elevator case, they aren't similar. The elevator wins because the girl's burden is qualitatively heavier.
      *   *Section 4: The "One Kid 1,800 Times" Variant.* This is crucial. Explain intra-personal aggregation (allowed) vs. inter-personal aggregation (restricted). This explains *why* the distinction matters morally for a contractualist.
      *   *Conclusion:* Summarize the takeaway for the Ethics Bowl round.

  7.  **Refining the Tone:**
      *   Avoid jargon where possible, or define it (e.g., "aggregation," "separateness of persons").
      *   Keep it encouraging. Ethics Bowl is about argumentation, so show them how to use these distinctions.
      *   Ensure the distinction between *What We Owe to Each Other* (1998) and Scanlon's later refinements is clear but not overwhelming. (Stick to the core contractualist logic).

  8.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I answer if the tie-breaking is Scanlon's move? *Correction:* It's a development in his view. Early Scanlon was stricter; later Scanlon allowed numbers in tie-breaks. I should mention this evolution briefly so the student knows it's a live debate.
      *   *Check:* Did I address the "self-interested bargain" error? *Yes,* this is crucial. Scanlon is Kantian, not Hobbesian.
      *   *Check:* Is the elevator case clear? *Yes,* the girl's complaint is individually stronger than any single student's textbook complaint.

  9.  **Final Polish:** Organize with clear headings. Ensure the "One Kid 1,800 Times" section clearly explains the moral relevance of the "separateness of persons." (This is often the hardest concept for high schoolers).

  **(Self-Correction Note on the "Tie-Breaking" point):** I need to be careful. Scanlon's initial view in *What We Owe to Each Other* was widely interpreted as ruling out numbers entirely. The "tie-breaking" concession came later in response to critics like Kamm and Otsuka. I should frame it as "Scanlon's later refinement" rather than "the standard fix."

  **(Self-Correction on "Maximin"):** The blog says it collapses into Rawlsian Maximin. It's similar but not identical. Rawls is about primary goods in the basic structure; Scanlon is about specific principles and reasonable rejection. I should note the similarity but warn against treating them as the same.

  **(Final Plan):**
  1. Validate the coach's reaction (the post is indeed flawed).
  2. Break down the post: Accurate vs. Caricature.
  3. Explain the "Numbers" issue (Aggregation).
  4. Address the Tie-Breaking refinement.
  5. Tackle the "One Kid 1,800 Times" variant (Intra- vs. Inter-personal).
  6. Apply to the Ethics Bowl case.
  7. Wrap up.cw
answer: |-
  Your coach was a bit blunt, but they weren't wrong: that blog post is a mix of accurate summary and serious caricature. It captures the *vibe* of Scanlon but misses the philosophical machinery that makes the view work. Since you're in Ethics Bowl, you need to know exactly where the post goes off the rails so you don't get caught using a strawman argument.

  Here is the breakdown of what's right, what's wrong, and how to handle the specific questions about numbers and your case.

  ### 1. Autopsy of the Blog Post

  **The Accurate Bits:**
  *   **The Definition:** The post gets the core definition right. An act is wrong if it violates a principle that no one could *reasonably reject*.
  *   **Individual Complaints:** It is true that Scanlon focuses on individual standpoints. You compare the strongest complaint against Principle A to the strongest complaint against Principle B.
  *   **Skepticism of Aggregation:** It is true that Scanlon is skeptical of simply adding up small benefits to outweigh a large burden (this is the main contrast with Utilitarianism).

  **The Caricatures & Misreadings:**
  *   **"Self-interested people... in a bargain":** This is a major error. Scanlon is explicitly *not* Hobbesian. Hobbes thinks morality is a deal between self-interested parties to avoid war. Scanlon thinks morality is about wanting to live on terms others could not *reasonably* reject. "Reasonable" here doesn't mean "what benefits me"; it means "what is justifiable to others." A principle can be rejected even if it benefits me, if it treats others unfairly.
  *   **"Anyone who complains loudly enough can effectively veto":** This conflates *actual* complaining with *reasonable* rejectability. It doesn't matter if the girl screams or stays silent. What matters is whether she *has a reason* to reject the principle. Conversely, a million kids could scream about textbooks, but if their individual reasons are weak, the volume doesn't make the reason stronger.
  *   **"One stubbed toe outweighs a million stubbed toes":** This is the "numbers problem" critique, but presenting it as Scanlon's *conclusion* is misleading. Scanlon acknowledges this is a counter-intuitive result, but he argues it's a necessary cost of respecting the "separateness of persons." He doesn't say the million toes *don't matter*; he says they don't matter *in that specific aggregating way*.
  *   **"That's what sinks the theory":** This is the blogger's opinion, not a logical consequence. Many philosophers think the "non-aggregation" feature is a strength, not a bug, because it protects minorities from being sacrificed for the greater good.

  ### 2. The Numbers Question: Do They Drop Out?

  The post claims numbers "drop out entirely." This is the most contentious part of Scanlon's theory.

  **The Core Logic:**
  Scanlon argues that morality is about justification *to each person*. If I impose a huge burden on you to save a million people from a minor inconvenience, I am treating you as a mere means to help them. I cannot justify that to *you* individually. I can say to each of the million, "I didn't save you from a headache because saving this person from a broken leg was more important." Each of them has to accept that. But I cannot say to the person with the broken leg, "Your leg doesn't matter because a million people have headaches."

  **The "Tie-Breaking" Move:**
  You asked if the "numbers break ties" fix is Scanlon's actual move.
  *   **Yes and No.** In his 1998 book *What We Owe to Each Other*, Scanlon was very strict (numbers barely matter). However, in later papers (responding to critics like Frances Kamm), Scanlon conceded that numbers *can* matter when individual complaints are **roughly equal in strength**.
  *   **How it works:** If Person A will lose a leg, and Person B will lose a leg, and I can only save one, the complaints are equal. *Now* I can count. Saving two legs is better than saving one.
  *   **Does it help in the Elevator Case?** **No.** This is crucial for your round. The tie-breaking rule only applies if the complaints are of similar magnitude.
      *   **The Girl:** Her complaint is about dignity, safety, access to education, and physical autonomy. This is a **heavy** burden.
      *   **Any Single Textbook Kid:** Their complaint is about having a slightly older book. This is a **light** burden.
      *   **Result:** Because the girl's individual complaint is *stronger* than any individual textbook kid's complaint, the numbers do not get to break the tie. The girl wins, even if there are 1,800 kids, or 18,000 kids. The disparity in burden is too large for the tie-breaker to activate.

  ### 3. The "One Kid 1,800 Times" Variant

  This is a brilliant question, and it cuts to the heart of why Scanlon restricts aggregation.

  **The Scenario:**
  *   **Case A:** 1,800 kids each lose one small benefit (textbook).
  *   **Case B:** 1 kid loses 1,800 small benefits.

  **The Contractualist Answer:**
  The moral answer *does* change between these two cases.
  *   **In Case A (1,800 kids):** No single individual has a strong complaint. Each only lost one small benefit. The girl's huge burden outweighs any single one of their small burdens. The elevator wins.
  *   **In Case B (1 kid):** That single kid has lost 1,800 small benefits. We can aggregate benefits *within a single life*. Losing 1,800 small benefits might add up to a burden that is equal to or greater than the girl's burden (e.g., failing all classes because of bad books). Now, that single kid has a **strong complaint**.
  *   **Why this makes sense:** Scanlon's view is based on the "separateness of persons." There is no "social mind" that feels the sum of everyone's headaches. There are only individual minds.
      *   If 1,800 people each have a headache, no one is suffering terribly.
      *   If one person has 1,800 headaches, that person is suffering terribly.
      *   Morality is about how we treat *individuals*. It is permissible to let 1,800 people have a headache to save a leg. It is *not* permissible to let one person have 1,800 headaches (which might ruin their life) to save a leg.

  **Why it feels weird:**
  It feels weird because Utilitarianism tells us the total amount of pain is the same in both cases. But Contractualism says the *distribution* matters. You cannot sacrifice one person's life quality to spread tiny benefits to others, but you can weigh one person's total loss against another person's total loss.

  ### 4. How to Use This in Ethics Bowl

  Here is how you translate this into arguments for your round:

  1.  **Don't say "Numbers don't matter."** Say: "Numbers don't justify imposing a catastrophic burden on one person to provide trivial benefits to many." This is more precise and defensible.
  2.  **Focus on the "Strongest Complaint":** Your argument isn't that the 1,800 kids don't matter. It's that *individually*, none of them have a complaint strong enough to override the girl's complaint.
  3.  **Address the "Tie-Breaker":** If the opposing team argues, "But 1,800 kids is a lot!", you respond: "Scanlon allows numbers to break ties only when burdens are equal. Here, the burdens are not equal. Missing class and being carried up stairs is fundamentally more severe than having an older textbook."
  4.  **The "Reasonable Rejection" Standard:** Remind the judges that "Reasonable Rejection" isn't about what the kids *want*. It's about what they could *justify*. Could the girl justify to the 1,800 kids why she gets the elevator? Yes: "Because my burden is fundamentally heavier than yours." Could the 1,800 kids justify to her why she gets carried? No: "Because we all wanted slightly nicer books."

  ### Summary for Your Notes
  *   **Blog Post:** Accurate on the definition, wrong on the "bargaining/self-interest" bit, and exaggerates the "numbers never matter" claim.
  *   **Tie-Breaking:** It is a real refinement Scanlon made, but it doesn't apply here because the burdens aren't equal.
  *   **One Kid Variant:** Shows why "separateness of persons" matters. Aggregation is allowed *within* a life, but restricted *across* lives.
  *   **The Case:** Under Contractualism, the elevator almost certainly wins, not because numbers don't count, but because the *quality* of the girl's burden outweighs the *quality* of any single student's benefit.

  This view gives you a strong framework to argue for the elevator without dismissing the needs of the other students. You acknowledge their benefit, but classify it as insufficient to override a right to basic access and dignity.
