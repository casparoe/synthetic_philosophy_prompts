      *   **The Conflict:**
          *   Option A: High risk reduction for a specific location (Elm St). 3 deaths in 20 years, ~1 per decade expected. Rebuild eliminates risk. High cost per life saved (likely exceeds standard ceilings).
          *   Option B: Diffuse risk reduction across the network. 2-3 statistical lives saved total. Low cost per life saved (fits standard rules). Benefits are tiny per person, mostly statistical.
          *   The Debate: Utilitarian/Cost-Benefit Analysis (CBA) favors B. Contractualist objection (Scanlon-style) favors A (cannot sacrifice one identifiable risk for many trivial gains). Counter-arguments involve ex ante/ex post distinctions, aggregation of small burdens, and paralysis concerns.
          *   Constraints: Legal discoverability (must be defensible after a fatality), generalizability (must work for future budgets without philosophers), usability (planners with spreadsheets).
      *   **Required Elements:**
          1.  Strengthen the contractualist objection, then explain why it wins or loses.
          2.  Address the ex ante/ex post distinction (does it solve the problem or move it?).
          3.  Analyze threshold/lexical priority rules regarding stability/paralysis in sequential decisions.
          4.  Handle the reverse aggregation (can small burdens sum to block a benefit?).
          5.  Draft public messaging (for bereaved families and beneficiaries).
