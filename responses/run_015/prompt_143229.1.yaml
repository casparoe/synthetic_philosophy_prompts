      *   *Refined Decision:* I will recommend **Option A**. Why? Because in a public trust context, failing to fix a *known* lethal defect (Elm St) when funds exist is harder to defend legally and morally than failing to optimize statistical safety. The "reasonable rejectability" of dying at Elm St is higher than the "reasonable rejectability" of slightly higher pedestrian risk elsewhere.
      *   *The Rule:* Needs to be operational. "Prioritize elimination of known high-probability fatality risks over diffuse statistical risk reduction, provided the cost does not exceed [X] times the standard value of statistical life." Or simpler: "Address Known Critical Hazards First."

