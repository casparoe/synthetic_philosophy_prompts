  2.  **Determine the Recommendation:**
      *   *Option A (Elm St)* feels intuitively right for safety *culture* and legal defensibility regarding "known hazards," but fails the strict CBA metric.
      *   *Option B (Retrofits)* is the "rational" economic choice but vulnerable to the "blood money" critique if a death happens at Elm St immediately after.
      *   *The "Tie-Breaker" Idea:* The user suggested treating diffuse benefits as a tie-breaker between individually justifiable options. This is tricky. If Elm St isn't justifiable under CBA, is it justifiable individually?
      *   *Decision:* I need to recommend a path that satisfies the legal counsel (defensible), the planners (usable), and the ethical concern (not purely utilitarian sacrifice).
      *   *Strategy:* A hybrid approach is usually best for bureaucratic survival, but the prompt asks for a specific rule. Pure contractualism is too hard to operationalize for planners ("Would this person reasonably reject?"). Pure utilitarianism is legally risky ("We knew Elm St was deadly but chose cheaper stats").
      *   *Selected Path:* Recommend **Option A (Elm Street)** but frame the rule not as pure contractualism, but as a **"Known High-Hazard Priority"** rule. This acknowledges the specific risk without abandoning aggregation entirely. It satisfies the legal need to address known imminent threats while establishing a rule that doesn't require philosophical debate every time.
