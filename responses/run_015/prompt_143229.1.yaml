answer: |-
  **MEMORANDUM**

  **TO:** Safety and Capital Planning Committee
  **FROM:** [Your Name]
  **DATE:** October 12
  **SUBJECT:** Allocation of $4.2M Safety Grant – Recommendation and Decision Rule

  **Recommendation**
  I recommend we allocate the full $4.2 million grant to **Option A: Rebuilding the Elm Street level crossing.** Work should commence immediately with a target completion date of 18 months. Option B (network-wide retrofits) will be deferred to the next capital cycle or pursued through separate operational safety budgets.

  **Proposed Decision Rule for Minutes**
  "In allocating safety capital, the Authority shall prioritize the elimination of known, high-probability fatality risks at specific locations over diffuse statistical risk reductions across the network. This priority holds provided the cost per expected life saved does not exceed ten times the agency's standard valuation of statistical life, ensuring that resources are not exhausted on single-point failures to the detriment of systemic safety. Where costs are comparable, preference is given to engineering controls that eliminate hazards rather than administrative controls that manage them."

  **Rationale**
  Contractualism is the wrong frame for an authority like ours because it treats bureaucratic risk allocation as interpersonal moral negotiation, which paralyzes systemic planning. We will instead use a Tiered Risk Mitigation frame that honors the intuition behind contractualism—protecting the most vulnerable—without forbidding the aggregation necessary to run a transit network. The following analysis addresses the specific concerns raised in our last session to ensure this rule is stable, defensible, and operational.

  First, regarding the contractualist objection: The strongest version of this argument is not that summing is mathematically wrong, but that it fails to offer a justification to the person who dies. If we choose Option B, and a parent dies at Elm Street, we must tell their family, "We knew this spot was lethal, but your death was priced cheaper than the sum of thousands of strangers' minor inconveniences." That is a reasonable rejection. However, strict contractualism loses because it forbids all aggregation; if no individual burden is significant enough to reject, nothing gets built, including the transit system itself. Our rule captures the moral weight of the "known victim" without banning the trade-offs required to function.

  Second, on the ex ante/ex post distinction: The third member is correct that ex ante, everyone faces a probability, but this distinction does not do the moral work they claim. It merely relocates the problem from "who dies" to "how we distribute risk." A policy that concentrates lethal risk on a few to diffuse trivial risk to many is still objectionable even if the victims are unidentified in advance. The distinction matters for modeling, but not for justification.

  Third, on stability and paralysis: A strict lexical priority (one life always beats any number of headaches) collapses into paralysis when every benefit is tiny, as nothing ever clears the bar. Conversely, pure aggregation collapses into utilitarianism where the minority is always sacrificed. Our rule uses a threshold (the 10x cost cap) to maintain stability. It allows aggregation to function for standard decisions but creates a "firewall" for known, high-lethality hazards. This prevents paralysis while stopping the slide into purely economic sacrifice.

  Fourth, on reverse aggregation: Can small burdens (noise, delay) sum to block a safety benefit? Yes, but only if they cross a threshold of material harm. A thousand people losing thirty seconds of commute time cannot veto a life-saving measure. However, if those delays prevent emergency access or cause economic ruin to a specific neighborhood, they aggregate into a claim that rivals safety. Our rule permits summing burdens only when they constitute a significant degradation of quality of life, not mere inconvenience.

  Fifth, on your tie-breaker idea: Treating diffuse benefits as a tie-breaker is coherent, but it is essentially aggregation smuggled in under a nicer name. It works only if the primary options are already morally permissible. If Option A is deemed "unjustifiable" because it's too expensive, using Option B's benefits as a tie-breaker validates the very summing the contractualist objects to. It is better to establish a priority hierarchy (as done in the rule above) than a tie-breaker, so the logic is transparent to planners.

  **Public Messaging**
  This rule dictates what we can say out loud. To a bereaved family at Elm Street, we can say: "We identified this as the highest priority risk in the system and dedicated available funds to ensure no one else dies here." We do not have to say we priced their life against others. To the elderly pedestrians benefiting from Option B, we say: "We are making the whole network safer, but we had to stop the bleeding first. Your safety improvements are in the next budget." This maintains trust without lying about the trade-offs.

  **Implementation**
  Counsel has confirmed this rule is defensible in discovery because it relies on established engineering hierarchies (elimination over mitigation) rather than opaque philosophical calculus. Planners can apply the 10x cost cap in a spreadsheet without needing to adjudicate "reasonable rejection." We will adopt this rule immediately to guide the Elm Street procurement and set the precedent for next year's ventilation and lighting budgets.

  **Decision**
  Move to approve Option A and adopt the Decision Rule as stated for inclusion in the permanent safety planning guidelines.
