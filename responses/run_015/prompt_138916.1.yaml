answer: |-
  The candle flame shivered as Halia Merrow tapped the treaty scroll with a stylus. "Marrowgate promises relief at four times the rate. In grain equivalents, that is twenty loads of collateral. Add the sixteen in the bin, and the city's bankroll is thirty-six. One-ninth of thirty-six is four. We sow the surplus."

  Oss Barrow did not look up from the gauge marked on the wall. "The treaty is a promise made in ink, Warden. The Floor is carved in stone. Twelve loads. Below that, the charter dissolves. We do not bet the city's existence on a promise from the uplands."

  "The doctrine maximizes the long-run growth rate," Halia said, her voice flat. "If we count only the grain above the Floor, the surplus is four. One-ninth of four is less than half a strip. We sow nothing. If we count the whole bin, sixteen loads, one-ninth is nearly two strips. If we count our actual wealth, including the treaty credit, we sow four. The rule is constant. Only your definition of the store changes the outcome."

  "My definition is hunger," Oss said. "You speak of growth rates. I speak of mouths. If you sow four and the river turns dry for two seasons running, we are at eight loads. We are below the Floor. We are dispersed. Your growth rate becomes zero because the city ceases to exist."

  "That is why we halve the stake," Halia countered. "The record is thin—nine seasons since the Shift. The edge might be smaller than one-ninth. If I stake one-eighteenth instead of one-ninth, I sacrifice only a quarter of the growth rate. But I insure against the error. And if I bet past twice the optimal fraction, the growth rate cancels. I know the precipice, Oss. I am not walking to it."

  "You are walking blindfolded," Oss said. "Log-arithmetic has no kink at the Floor. It treats losing the twelfth load the same as losing the first. But there is no coming back from the twelfth. A city has no well-defined bankroll. Its fields, its people, its future harvests are not in the granary. You cannot sum them into a single number to gamble."

  Jento shifted in the corner. The ledger on his knees was open to a page stained with river damp. "Warden. Keeper."

  Halia turned. "The clerk speaks?"

  "The pre-Shift ledgers," Jento said. "The Near Terrace and the Far Terrace. They were sown separately. Over any two-year cycle, wet then dry or dry then wet, each terrace returned exactly what was put into it. One doubles in the wet and halves in the dry. The other halves in the wet and doubles in the dry."

  Oss frowned. "Net zero growth. Why do you trouble us with zero?"

  "Because of the moving," Jento said. He traced a column with a dirty finger. "The clerks moved half the grain from one to the other at the end of every year. They rebalanced. They finished each cycle with about a quarter more than they began. The entries show it. Season four to six, season ten to twelve. The gain is consistent."

  Halia leaned forward, the candle light catching the sharp line of her jaw. "Negative correlation. When one asset falls, the other rises. Rebalancing forces you to buy low and sell high automatically. It creates growth from volatility itself."

  "Or it creates ink from error," Oss said. "Where is the grain, Jento? Did the bins overflow?"

  "The bins match the entries," Jento said. "It looks like real grain. But it implies... it implies the store isn't where we think it is. If the gain comes from the movement between them, then the boundary of the store isn't the terrace wall. It's the pair."

  Halia straightened. "If the terraces were one store, diversified, the variance drops. The optimal stake rises. Oss, if the silt lands are negatively correlated with the upland holdings, or if the treaty honor correlates with our failure—"

  "The treaty honors when we starve," Oss said. "That is not a correlation I will bank on. And Jento's ghosts do not change the water level outside."

  "But the math holds," Halia said. "If we can structure the sowing so that loss in the silt is hedged by gain elsewhere, we reduce the risk of ruin. Jento's ledger proves you can harvest volatility without increasing the stake. If we treat the treaty as a hedging instrument, not just collateral..."

  "It is not an instrument," Oss snapped. "It is a plea for mercy written by men who eat wheat we cannot grow. You want to sow four loads because the arithmetic says the store is thirty-six. I say the store is four, because the other thirty-two are not here when the flood wall breaks."

  "And I say the store is sixteen," Halia said, "because the grain below the Floor is still grain. It is not dead capital. To treat it as such is to admit defeat before the first seed is cast."

  "To treat it as seed is to invite the dissolution you claim to avoid," Oss said. He turned to Jento. "The clerks who moved the grain. Did they eat the surplus?"

  "No," Jento said. "It was added to the common store."

  "Then it was real," Oss said. He looked back to Halia. "But those clerks had two terraces. We have one river. You cannot rebalance against a river that has changed its bed. You cannot hedge against the Shift."

  "I can hedge against the uncertainty of the Shift," Halia said. "By halving the stake. Two loads. One-ninth of the granary, halved for safety. It is the compromise. It respects the Floor enough to survive a bad run, but it respects the growth enough to rebuild."

  Oss was silent for a long moment. The river muttered against the stones below. "Two loads," he said. "But if the Gauge reads low in the autumn, we reclaim the strip. We do not wait for the spring Court."

  "Agreed," Halia said. She looked at Jento. "Copy the ledger entries. I want to know if the correlation held through the drought of the third decade."

  "It held," Jento said softly. "Until the clerks stopped moving the grain. Then the growth stopped."

  Halia nodded, extinguishing the candle with a pinch of her fingers. "Then we move the grain. We sow two."

  ***

  **Note**

  1.  **Arithmetic vs. Philosophy:** The Kelly Criterion math (edge/odds) and the volatility pumping effect (Jento's discovery) are standard quantitative finance; any competent modeler would grant the calculations. The unsettled ground is philosophical: is a city's utility function logarithmic (growth-maximizing) or does it have a hard "ruin" barrier (survival-maximizing)? Also, whether the Treaty counts as liquid capital or contingent relief is a legal/economic judgment, not math.
  2.  **Who is Right:** The Keeper is right about the sowing decision. The Floor is an absorbing barrier; once crossed, the game ends, rendering long-run growth rates irrelevant. Maximizing growth is suboptimal when ruin is catastrophic. The verdict turns on the definition of "ruin"—if dissolution is final, survival trumps optimization.
  3.  **Changing My Mind:** I would vindicate the Warden if the Treaty were proven to be liquid collateral available *before* sowing (e.g., tradable credits), effectively raising the city's actual cash buffer above the Floor. If the "Floor" were soft (e.g., hardship but not dissolution), the growth strategy would dominate.
