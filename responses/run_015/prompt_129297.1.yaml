answer: |-
  Arthur, a forty-year-old patient suffering from bilateral hippocampal sclerosis, participates in a clinical trial utilizing a bidirectional neuroprosthetic bridge that restores episodic memory consolidation by linking his remaining biological temporal lobe tissue to an implanted microprocessor. In this configuration, the biological tissue generates the raw sensory indices of a memory while the digital processor calculates the temporal context and emotional valence, such that the coherent experience of autobiographical recall emerges only from the millisecond-precision synchronisation of both substrates acting as a single causal unit. During a critical maintenance window, the clinical team must choose between two protocols to prevent system failure: the first involves cauterising a small section of the biological interface to halt seizure propagation, which leaves the digital code intact but severs the biological input required for the unified computation; the second involves a hard reset of the digital processor to clear logic corruption, which leaves the biological tissue intact but erases the computational state required for the unified computation. In both instances, Arthur's immediate behavioural output and verbal reports remain indistinguishable due to compensatory cortical plasticity, yet the specific process realising his emotional connection to his past is interrupted in fundamentally different physical locations.

  **Demonstration of Specifications**

  *   **Beliefs and Attributions:** The functionalist account attributes moral significance to the persistence of the cognitive process (the unified computation of memory integration), whereas the substrate-dependent account attributes moral significance exclusively to the integrity of the biological organism (the neural tissue).
  *   **Functionalist Verdict:** Because the functionalist holds that mental states are defined by their causal roles rather than their physical makeup, the verdict follows that equal moral harm occurs in both protocols. Since the specific computation constituting Arthur's autobiographical appraisal is interrupted in both scenarios—regardless of whether the interruption originates in the silicon or the flesh—the loss of functional continuity is identical, and thus the moral weight is equal.
  *   **Substrate-Dependent Verdict:** Because the substrate-dependent view holds that moral status is intrinsic to biological life, the verdict follows that harm occurs only in the first protocol. The cauterisation damages the living tissue constituting the patient, warranting moral concern, whereas the digital reset merely damages a tool or instrument attached to the patient, which carries no intrinsic moral weight despite the identical functional loss.
  *   **Structural Feature Generating Divergence:** The divergence is generated by the **substrate heterogeneity of the necessary causal chain**. Specifically, the case is engineered so that the *same* functional loss (interruption of the unified computation) can be caused by damaging *either* the biological substrate *or* the digital substrate. This allows the two theories to split: one tracks the function (which breaks in both cases), while the other tracks the biology (which breaks in only one).

  **Effect of Removing the Feature**

  If this feature is removed—specifically, if the computation were realised wholly within biological tissue rather than being distributed across heterogeneous substrates—the case collapses into agreement. In a purely biological system, interrupting the computation would necessarily involve damaging the biological tissue. Consequently, both the functionalist (tracking the broken computation) and the substrate-dependent theorist (tracking the damaged tissue) would agree that moral harm had occurred. The divergence relies entirely on the possibility of breaking the function without breaking the biology; without that possibility, the extensions of the two theories overlap completely in this scenario.

  **Strongest Objection from a Substrate-Dependent Defender**

  A defender of the substrate-dependent view would challenge the premise that the digital processor is constitutive of the computation rather than merely causally coupled to it. They would argue that the thought experiment beg the question by asserting the process is "unified"; in reality, the biological tissue remains the sole locus of the mental state, while the digital device acts merely as an external aid, analogous to a notebook or a pair of glasses. On this view, resetting the processor does not interrupt Arthur's mind any more than losing his spectacles interrupts his vision; it merely reduces his capacity to express or access what is still wholly realised within his biology. Therefore, the functionalist is mistaken in locating the computation across both substrates, and the apparent divergence vanishes because the second protocol causes no harm to the mind itself, only to an instrument the mind uses.
