      *   *Physicist Angle:* Use terms like "equilibrium," "signal-to-noise," "phase transition" if helpful, but keep it philosophical.
      *   *Tone:* Respectful, rigorous, analytical. Avoid political preaching. Focus on epistemology.

  8.  **Final Polish:** Check against the prompt requirements.
      *   Audit analogy? Yes.
      *   Correspondence table? Yes.
      *   Where mapping breaks (NTT)? Yes.
      *   Normative conclusion evaluation? Yes.
      *   Did it smuggle the conclusion? Yes.

  9.  *(Final thought before generating)*: The user is a physicist. They will appreciate precision regarding "common priors" and "rationality assumptions." I should treat the NTT seriously as a limit condition on the information aggregation mechanism.

