      *   **Specific Questions to Address:**
          *   Is propaganda about purpose or effect?
          *   Does algorithmic control negate the propaganda value?
          *   How does Du Bois view the patron/platform (tech company)?
          *   Does the "beauty/truth" criterion matter here?
          *   Does the artist's race matter to Du Bois in this context?
