answer: |-
  This is a precise formulation of the tension between the "Rule of Rescue" (the imperative to save an identified life in immediate peril) and "Statistical Lives" (the utilitarian calculation of saving the most lives for the resources available). You have correctly identified that our practices are inconsistent if viewed through a single moral lens, but consistent if viewed through a sociological or institutional one.

  Here is the separation of what the practices strictly require versus what merely fits well, followed by an evaluation of your proposal.

  ### 1. What the Practices Strictly Presuppose
  The three cases (Pond, Bednets, NHS) do **not** strictly presuppose that nearness or identification matters *in itself*. If they did, the NHS would be morally incoherent, yet we accept its rationing as legitimate. Instead, the practices presuppose three functional conditions:

  *   **Exclusive Agency:** In the pond case, you are the *only* agent available. If you do not act, the outcome is certain. In the bednet case, you are one of millions of potential donors. If you do not act, the outcome is probabilistic. The duty in the pond is strict because the agency is undiluted.
  *   **Marginal Cost Thresholds:** The pond case assumes the cost to the rescuer is trivial (shoes). The bednet case implies a significant cost (savings/kitchen). The NHS case explicitly sets a cost threshold (£25k/QALY). All three practices agree that duty is bounded by cost; they disagree on where the line is drawn.
  *   **Epistemic Certainty:** In the pond, the causal link between your action and the survival is immediate and visible. In charity and healthcare rationing, the link is statistical.

  **What merely fits well:** The psychological salience of nearness and identification fits well with human evolutionary psychology (we care more about what we see), but the *practices* themselves (especially the NHS) demonstrate that we are willing to override this salience when institutional rules are in place.

  ### 2. What Would Change if We Dropped Nearness/Identification?
  If we strictly removed nearness and identification as morally relevant variables:

  *   **The Pond:** No change. The duty remains because exclusive agency and low cost remain.
  *   **The Bednets:** This becomes obligatory, not optional. If distance doesn't matter, the cost of a kitchen versus a life is the only metric. This would collapse the distinction between "duty" and "charity," requiring individuals to donate until the marginal utility of their money equals the marginal utility of keeping it.
  *   **The NHS:** This is the most interesting case. The NHS *already* drops identification (it denies treatment based on cost, even for named patients). However, if we dropped the *cost* constraint (which often hides behind the "institutional" excuse), the system would collapse. If we kept the cost constraint but removed the "institutional shield," doctors would be personally liable for rationing decisions. Dropping nearness forces the individual to adopt the institutional view: you must save the most lives per pound, even if the specific life you could save right now is ignored in favour of a more efficient intervention elsewhere.

  ### 3. Evaluating Your "Half-Baked Version"
  Your proposal is to treat donating as "rescue-at-a-distance" to discharge the duty.

  *   **Does it break anything?** It breaks the **division of labour** that modern societies rely on. We generally assign specific duties to specific roles (parents to children, doctors to patients, citizens to taxpayers). Your version assigns a general duty to all agents. This creates a "collective action problem": if everyone has a duty to save everyone, but no one is specifically assigned, individuals may feel their contribution is negligible (the "drop in the bucket" objection).
  *   **Does it make the pond intuition look like an accident?** Yes. It reveals the pond intuition as a heuristic for *high certainty* and *exclusive agency*, not intrinsic moral weight. The reason we blame the passerby is not because he is *near*, but because he is the *only one there* and the cost is *low*. If you were on the phone with the pond passerby from another country, and you could remotely unlock a gate to save the child for the price of a kitchen, your version suggests you are equally obliged to do so.
  *   **The Conflict:** Your version is logically robust under consequentialism but psychologically and legally fragile. It requires individuals to perform the calculations that institutions (like the NHS) are designed to handle.

  ### 4. The Implicit Theory
  The implicit theory licensing our current inconsistent practices is **Institutional Division of Labour with Threshold Deontology**.

  1.  **Individuals** have strict negative duties (do not harm) and limited positive duties (rescue when exclusive/cheap).
  2.  **Institutions** have the positive duty to maximize welfare within budget constraints (NICE thresholds).
  3.  **Nearness** is not a moral principle but a trigger for *Exclusive Agency*.

  We accept the NHS letting a named patient die because we have delegated the moral burden of rationing to the committee. We accept the passerby saving the child because no committee exists in that moment. We accept the kitchen buyer keeping their money because we assume the "institution" of charity or the state will handle the distant need, and the cost to them is above the individual threshold.

  Verdict: Several theories would license it.
