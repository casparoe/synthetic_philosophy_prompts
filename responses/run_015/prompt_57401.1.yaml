      *   *Let's go with:* **Seal for 50 Years.** It respects the "revisitable" clause. It acknowledges that current passions are too high for the unreliable data to be handled safely. It allows for the "digital reality" to be managed (we can't stop the leaks, but we don't have to endorse them).
