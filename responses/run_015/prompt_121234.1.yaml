          *   (1) vs (5): Caring about suffering vs. rejecting interventions.
          *   (1) vs (2): Suffering vs. Integrity.
          *   (3) vs (4): Land management conflicts.
      *   **Constraints:** Rank tensions by severity, flag apparent vs. real tensions, propose least costly revisions for real tensions, state what is lost in revision. *Do not lecture on the field.*

  2.  **Deconstruct the 5 Points:**
      *   (1) **WAS Centrality:** Suffering is the *central* moral issue. Intact ecosystems = net-negative welfare (predation, starvation, disease).
      *   (2) **Integrity Downgrade:** Ecological integrity has *only* aesthetic/cultural value, no intrinsic moral weight against suffering.
      *   (3) **Restoration Constraint:** Avoid reintroducing predators/high-suffering dynamics, even if "unnatural."
      *   (4) **Anti-Development:** Support carbon taxes/zoning to stop wildland $\rightarrow$ suburbs/farmland. Reason: Human development causes *more* suffering overall.
      *   (5) **Non-Intervention:** Direct welfare intervention (vaccines, contraception) is *wrong* because it violates "ecological autonomy."

  3.  **Evaluate Coherence & Tensions (Internal Audit):**

      *   **Tension A: (1) vs (5) - The Core Contradiction.**
          *   (1) says suffering is the *central moral issue*.
          *   (5) says we cannot intervene to reduce suffering because of "ecological autonomy."
          *   *Conflict:* If suffering is the *central* moral issue, what moral weight does "autonomy" have that overrides it? If autonomy is strong enough to block suffering reduction, is suffering really the *central* issue?
          *   *Severity:* High. This is the philosophical heart of the package.

      *   **Tension B: (2) vs (5) - The Grounding Problem.**
          *   (2) says integrity/nature has *only* aesthetic/cultural value (instrumental/subjective).
          *   (5) uses "ecological autonomy" (a deontological constraint based on nature's integrity) to block intervention.
          *   *Conflict:* You can't derive a strong moral constraint (autonomy) from a weak value (aesthetic). If integrity is just pretty, why does violating it (intervention) become *wrong*?
          *   *Severity:* High. This undermines the justification for (5).

      *   **Tension C: (1) vs (4) - The Preservation Paradox.**
          *   (1) says wild ecosystems are net-negative (bad for welfare).
          *   (4) says protect wildlands from development because development is *worse*.
          *   *Conflict:* This is actually logically consistent *if* development is truly worse (e.g., habitat fragmentation + domestic animal suffering + human suffering). It's a "lesser of two evils" argument.
          *   *Severity:* Low/Apparent. It holds together as a comparative claim.

      *   **Tension D: (3) vs (4) - Land Management.**
          *   (3) says manage restoration to reduce suffering (no predators).
          *   (4) says protect land from development.
          *   *Conflict:* (3) implies active management of "wild" land to suit welfare. (4) implies protecting "wild" land. If you manage it heavily (3), is it still the "wildland" you are protecting in (4)?
          *   *Severity:* Medium. It creates a slippery slope on what counts as "wildland."

      *   **Tension E: (1) vs (2) - Value Clash.**
          *   (1) Suffering is central.
          *   (2) Integrity is aesthetic only.
          *   *Conflict:* User suspects this, but they explicitly downgraded integrity in (2) to avoid this. So they are consistent *by definition*.
          *   *Severity:* None (Resolved by stipulation).

  4.  **Drafting the Audit (Iterative Process):**

      *   *Constraint Check:* Don't lecture. Keep it focused on coherence. Rank tensions. Offer revisions.
      *   *Tone:* Analytical, direct, strategic for a meeting.

      *   *Refining Tension 1 (1 vs 5):* This is the biggest hole. If suffering is central, autonomy cannot block it unless autonomy is also central. But (2) says nature's value is only aesthetic. So (5) has no leg to stand on.
          *   *Revision:* Either downgrade (1) (suffering isn't *central*, just *one* factor) or downgrade (5) (intervention is permissible if cost-effective).
          *   *Cost:* Losing the "WAS purist" label or losing the "hands-off" stance.

      *   *Refining Tension 2 (2 vs 5):* "Ecological autonomy" sounds like intrinsic value. (2) denies intrinsic value.
          *   *Revision:* Reframe (5). Maybe intervention is pragmatically risky rather than morally wrong.
          *   *Cost:* Shifts from deontological (it's wrong) to consequentialist (it might backfire).

      *   *Refining Tension 3 (1 vs 4):* This is the "Public Relations" risk. If you say "nature is hell" (1) but "save nature" (4), people will get confused.
          *   *Revision:* Clarify the comparative claim. "Wild suffering is bad, but human development creates *more* suffering + destroys aesthetic value."
          *   *Cost:* Nuance. Harder to explain in a soundbite.

  5.  **Finalizing the Output Structure:**
      *   Executive Summary (Verdict).
      *   Ranked Tensions (Severity 1-3).
