answer: |-
  **The setup: agents and omissions**
  The candidate agents form a hierarchy of omission. At the micro-level, the Wireless Operator omitted keeping the set active; the Officer on Watch omitted waking Captain Lord; Captain Lord omitted ordering the ship through the ice. At the macro-level, the White Star Line and Marconi Company omitted instituting a twenty-four-hour watch policy; the regulatory body omitted requiring it. Each omission is a link in the chain preventing rescue. The *Carpathia* acted, establishing that rescue was physically possible, isolating the *Californian*'s inaction as the variable. Other ships were too distant or unaware, rendering their inaction irrelevant under most theories. This mapping separates specific human failures from structural policy gaps. The causal question is whether these non-actions connect to the deaths as robustly as positive actions like steering an iceberg. This structure isolates the specific failures against the backdrop of physical possibility.

  **But-for and where it over-generates**
  The but-for test asks: if the agent had acted, would the deaths have occurred? If the Operator stayed awake, the distress call arrives; if Lord woke, the ship moves. Under strict counterfactual dependence, all these omissions are causes. However, this over-generates wildly. Anyone who could have helped but didn't qualifies, including a sleeper in New York who lacked a ship. This is the "problem of profligate causes." Is this a bug? Most philosophers say yes. It conflates causal relevance with moral responsibility. The sleeper lacks capacity, but the test doesn't distinguish capacity from possibility. Your moral reaction—that the sleeper isn't a cause—is shared by the literature. The but-for condition is necessary but insufficient. We need a filter to separate background conditions from salient causes. The *Californian* case shows but-for captures too much, requiring additional constraints to match our intuitive causal judgments about who actually caused the deaths versus who merely failed to prevent them. The bug isn't just your moral smuggling; it's that but-for treats all necessary conditions equally, ignoring agency and capacity. Without pruning, causation becomes ubiquitous and useless for explanation. Furthermore, it fails to distinguish between the Officer not waking Lord and the Iceberg hitting the ship. Both are but-for causes. Yet we treat the iceberg as the primary cause and the Officer as secondary. This suggests causation by omission requires a selection mechanism beyond simple counterfactuals, otherwise every absence of a savior is a cause of every death everywhere. Thus, the but-for test identifies conditions, not necessarily causes.

  **Mechanism, defaults, and the normativity worry**
  Mechanism theories argue omissions can't be causes because nothing happens; there is no energy transfer or physical process linking "not waking" to "drowning." This pushes theorists toward defaults: an omission is causal only if it deviates from a normal or expected baseline. Here, the baseline is tricky. No twenty-four-hour watch was standard practice then. If "normal practice" sets the default, the Company's omission isn't causal because they followed norms. But the inquiries treated it as causal anyway. This suggests the default isn't statistical but normative—what *should* have happened. If causation depends on what should have happened, the causal claim imports morality. You can't separate the metaphysics from the ethics. The *Californian* case pressures the idea that causation is purely descriptive. If we say Lord caused deaths because he breached a duty, but the duty was established post-hoc, we are defining causation through the lens of blame. The mechanism objection remains strong: without a process, we are relying entirely on expectations to do the heavy lifting. This leads to the normativity worry: are we discovering causal facts or prescribing rules? If the verdict changes based on whether a watch was customary, causation becomes relative to social conventions. Most contemporary views admit some normativity is unavoidable for omissions, but disagree on how much. The *Californian* suggests that without importing a norm, the omission disappears into the background of mere non-existence. The tension lies in whether the norm precedes the causation or is created by it. If the inquiries created the duty to justify the causal blame, causation is retrospective.

  **Testing the liveness idea**
  Your liveness idea—that an omission causes only if the action was on the agent's actual menu—filters the New York sleeper effectively. For the Operator, staying awake was live; for Lord, waking was live. It saves the intuitive causes while killing hypothetical ones. However, it breaks on willful blindness. If Lord trained himself to ignore rockets, was waking him truly "live"? If liveness is subjective, he escapes causation because the option wasn't on his psychological menu. If liveness is objective, it collapses into "could have," returning us to the but-for problem. This mirrors existing "ability constraints" in the literature, though your "menu" framing is distinct. Philosophers like McGrath argue ability is required, but the culpable ignorance problem remains: agents who destroy their own menu access. Your idea handles negligence well but struggles with deliberate ignorance. It saves the Officer (who saw rockets) but might excuse Lord if he successfully suppressed the thought. To work, liveness must be objective enough to catch those who hide from their duties, risking the normativity worry again. You must decide if "live" means "physically possible" or "psychologically available." If the latter, bad actors game the system by narrowing their own menus. If the former, you lose the psychological realism that makes the idea appealing. The *Californian* officers claimed they didn't recognize the rockets; if that ignorance was cultivated, your theory must trace back to when the menu was open. This tracing requirement complicates the simplicity of your proposal. Ultimately, the liveness constraint helps prune but-for over-generation, but without an objective standard, it risks excusing the very negligence it aims to catch. The agent who ensures nothing is live becomes a causal ghost.

  **What the case does back to the theory**
  The fact that duties were created after the disaster suggests causal judgment is retrospective and interest-relative. We call the omission a cause because we want to prevent recurrence, not because we found a metaphysical particle. This supports the view that omission causation is largely about blame allocation and rule-making rather than describing the world. The apparatus goes silent on specifics: how many deaths? Which ones? We stipulated rescue was possible, but counterfactuals are vague. Would they have saved everyone or just ten more? The theory can't model the gradient of outcome. This vagueness implies the causal label is a tool for policy. If the goal is safety, the omission is a cause. If the goal is pure physics, it isn't. The *Californian* case shows that calling an omission a cause often serves a legislative function. It validates the new rules by anchoring them in a causal story. This doesn't make the judgment false, but it makes it pragmatic. We are constructing a narrative where the omission matters to justify the new norm. The theory cannot separate the description of events from the prescription of future conduct. Consequently, the causal verdict shifts with our interests. If we care about liability, Lord is a cause. If we care about ice mechanics, he isn't. This confirms that omission causation is hybrid: part fact, part value. The silence on exact death counts reveals that the causal claim is qualitative, not quantitative. It marks a breach, not a measurement. The inquiry needed a cause to justify the regulation, suggesting the causal attribution followed the moral conclusion, not vice versa.

  **Settled vs. contested**
  Settled: Omissions can be causes in law and morality; but-for tests over-generate. Contested: Whether this makes causation inherently normative; how to define defaults without circularity. There is no consensus on solving the mechanism problem. Your liveness idea overlaps with existing "ability constraints" (e.g., McGrath), but the "menu" phrasing is yours. The willful blindness objection is a known problem for subjective ability views, not unique to you. Don't mistake the pragmatic view (causation as blame) for consensus; many metaphysicians still seek purely descriptive accounts. I am guessing the field remains split on whether normativity is a bug or a feature. The *Californian* case is often cited but doesn't settle the metaphysics. Most agree simple counterfactuals fail, but disagree on the fix. Some say norms are essential; others say we haven't found the right naturalistic filter. Your intuition about liveness is shared, but the implementation is where the fight is. Be careful not to assume the "blame allocation" view is dominant; it's a strong minority position. The literature is honest about the uncertainty here.

  **Bottom line**
  The *Californian* shows omission causation isn't pure physics. It's a hybrid of fact and norm. Your liveness idea helps but needs an objective check to avoid excusing negligence. Ultimately, we call these omissions causes to enforce duties, not just to map events. The theory works best when admitting it serves a regulatory purpose. Causation by omission is less about discovering hidden connections and more about highlighting responsible agency. Your liveness constraint is a useful heuristic for filtering irrelevant absences, but it cannot fully escape the normative pull. The case confirms that causal judgments here are tools for safety and accountability. We accept the metaphysical cost because the moral gain is necessary. The apparatus doesn't break, but it bends toward ethics.
