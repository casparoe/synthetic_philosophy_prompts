answer: |-
  This is a sharp reading. You've identified the exact friction points where *It's a Wonderful Life* stops being a sentiment piece and starts being a structural critique of moral expectation. You're right to worry that the film tries to have it both ways: it wants George's acts to be freely chosen (to make him virtuous) but also structurally necessary (to make the tragedy land).

  Here is the pushback, the synthesis, and the scenes to cut.

  ### 1. The Collapse Argument: Duty vs. Catastrophe
  You ask if the Pottersville counterfactual collapses supererogation into obligation. My pushback is that the film distinguishes between *moral* obligation and *causal* necessity.

  George is not morally obligated to save Bedford Falls from Potter. There is no contract. However, the film argues that in a fragile ecosystem, the "good man" becomes a load-bearing wall. If you remove the wall, the building falls. That doesn't mean the wall *ought* to be there by design; it means the design is flawed.

  **Where the film resists your reading:** The film *wants* you to feel the collapse. It wants you to look at Pottersville and think, "George *had* to stay." But structurally, it proves the opposite: George tries to leave four times (college, travel, college again, honeymoon). He is physically blocked by external crises (father's death, bank run, war, Uncle Billy). The film argues that George's supererogation is not a free offering, but a **hostage situation**. He isn't staying because he owes the town; he's staying because the town is incapable of surviving without a subsidy he provides.

  **The Verdict:** The film doesn't solve the collapse problem; it dramatizes the danger of it. It suggests that when a community relies on supererogation to function (rather than justice or systemic support), it effectively enslaves the moral agent. George isn't a saint; he's a subsidy.

  ### 2. The Third-Party Cost (The Mary Problem)
  This is your strongest point and the one most ethical frameworks ignore. Standard supererogation assumes the agent owns the resources they sacrifice. George does not own the honeymoon money; it is jointly held. He does not own the kids' future security; that belongs to them.

  **Where the reading holds:** You are correct that this complicates the praise. If I donate *my* kidney, it's supererogatory. If I donate *your* kidney while you're sleeping, it's assault. George operates in a gray zone where Mary's consent is presumed via her devotion. The film frames this as romantic ("I'll do what you want, George"), but materially, it looks like the privatization of risk. The family absorbs the volatility of the Building & Loan so the town doesn't have to.

  **The Pushback:** The film *knows* this is tense. That's why Mary is written as fiercely complicit. She isn't a passive victim; she's an ideological partner. She chooses the "drafty old house" over the "modern apartment." However, the *children* are non-consenting stakeholders. The film ignores their cost entirely. This suggests the category of supererogation breaks down when the "agent" is a family unit but the "praise" is assigned to the patriarch. It's not that the act becomes less supererogatory; it's that the **praise is misallocated**. George gets the virtue points for sacrifices Mary negotiated.

  ### 3. The Ratchet and the Reward
  Your "ratchet" concept is excellent. Supererogation eating itself. If you save the town once, you are the Savior. If you save it every year, you are the Treasurer.

  **Does the reward undo the sacrifice?** No, but it sanitizes the *risk*. Ethically, an act is judged at the time of action. George didn't know the basket would be filled. However, the *narrative* reward (the happy ending) undermines the *philosophical* point. It tells the audience: "Don't worry, the universe balances the books." That removes the tragedy of supererogation. True supererogation risks net loss. The film guarantees net gain.

  **The Burnout Factor:** This is where the film gives the debate something arguments don't: **Resentment.** Philosophical texts rarely account for the emotional corrosion of being the "load-bearing wall." George's arc isn't just sacrifice; it's suppressed rage. He screams at his kids, he snaps at Mary, he nearly has a breakdown in the bathroom. This suggests that when supererogation becomes expected (the ratchet), it ceases to be virtuous and becomes **exploitative**. The film validates the resentment. It says: "It is okay to wish you were never born." That is a radical admission for a moral fable.

  ### Recommended Scenes (for the specific arguments)

  **1. The Board Meeting (Potter's Offer)**
  *   **Timestamp:** Approx. 1:05:00 (varies by cut).
  *   **The Clip:** Potter offers George $20,000 a year (massive money) to work for him. George turns it down to stay at the Building & Loan.
  *   **Why:** This is the clearest evidence against the "Obligation" collapse. George *could* leave. He *could* take the money. He chooses not to. This preserves the supererogatory nature of his stay. It proves he isn't trapped by physics, but by his own moral architecture. Use this to show the group that the "duty" is internal, not external.

  **2. The Bank Run / Honeymoon Money**
  *   **Timestamp:** Approx. 0:45:00.
  *   **The Clip:** The panic at the Building & Loan. George uses the $2,000 honeymoon fund to pay out depositors. Mary agrees to live on less.
  *   **Why:** This is the "Third-Party Cost" scene. Watch Mary's face. Watch George command the room. It visualizes the transfer of risk from the community to the family. Ask the group: Does George's virtue here depend on Mary's silence? If she said "No," does his supererogation vanish?

  **3. The Bathroom Breakdown**
  *   **Timestamp:** Approx. 1:35:00.
  *   **The Clip:** Uncle Billy loses the $8,000. George is in the bathroom, praying/screaming, terrified. "I'm not a praying man."
  *   **Why:** This is the "Ratchet/Burnout" scene. George isn't thinking about the town; he's thinking about jail. He is at the limit of what one man can carry. This is the moment supererogation breaks. He can't give any more. This sets up the necessity of the intervention (Clarence). It shows that a system relying on one man's excess virtue is unsustainable.

  ### Summary for the Group
  Don't let them leave thinking George is a hero. Let them leave thinking George is a **symptom**.

  The film argues that supererogation is a stopgap for systemic failure. If the Building & Loan were capitalized correctly, or if Potter were regulated, George wouldn't need to be a saint. The fact that he *has* to be a saint for the town to survive is an indictment of the town, not a praise of George.

  The "cry" half of the room will cry because George is saved. The philosophy half should be unsettled because **the system wasn't fixed.** George goes back to work. The Building & Loan is still undercapitalized. Potter is still in business. The ratchet is still ratcheting. The only thing that changed is George's mental state.

  That's the discussion: Is a moral system valid if it requires a breakdown to be sustainable?
