  ### 1. Competing Rules Consistent with Rulings 1–8

  Based on the eight adjudicated examples, three distinct rule-sets remain viable. All three perfectly predict the tags for the training data, but they rely on different criteria.

  *   **Rule A (The Semantic/Codebook Rule):** The tag depends entirely on the speaker's epistemic stance toward the antecedent.
      *   *Indicative:* The speaker treats the antecedent as an **open possibility** (true, false, or unknown, but live).
      *   *Counterfactual:* The speaker treats the antecedent as **closed/false** (known false, impossible, or ruled out).
      *   *Status:* Consistent with all 8 rulings. Supported by your supervisor's verbal instructions and the context notes she reads.
  *   **Rule B (The Morphological Rule):** The tag depends on verb forms (irrealis marking).
      *   *Indicative:* Antecedent uses present or simple past indicative (*is, was, took*); Consequent uses *will* or simple tenses.
      *   *Counterfactual:* Antecedent uses past subjunctive (*were*) or past perfect (*had been*); Consequent uses *would* (or *would have*).
      *   *Status:* Consistent with all 8 rulings. Supported by your supervisor's written justifications which cite tense and mood. Note that Rulings 3 & 4 establish that Simple Past (*was, took*) does not automatically trigger Counterfactual, distinguishing this from a crude "Past Tense = Counterfactual" rule.
  *   **Rule C (The Factive Rule):** The tag depends on the objective truth value known to the speaker.
      *   *Indicative:* The truth value of the antecedent is **unknown** or **undecided**.
      *   *Counterfactual:* The antecedent is **known to be false** by the speaker.
      *   *Status:* Consistent with all 8 rulings. Rulings 1–4 are all "unknown/unresolved"; Rulings 5–8 are all "known false/impossible." This is a stricter subset of Rule A.

  **Eliminated Rules:**
  *   *"Past Tense Antecedent = Counterfactual."* Eliminated by Rulings 3 and 4 (*was, took* tagged Indicative).
  *   *"Future Consequent = Indicative."* Eliminated by Ruling 7 (*would have lost* is Counterfactual).
  *   *"Any 'would' = Counterfactual."* While consistent with 1–8, this is the specific heuristic N1 is designed to test.

