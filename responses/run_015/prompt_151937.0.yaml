  8.  **Final Polish:** Check constraints. "No preamble", "without restating the question", "lead with bottom line".

      *Drafting Bottom Line:* The most severe inconsistency lies between your claim that Cicero normatively advocates withdrawal from public affairs (b) and your acknowledgment that wisdom grants moral authority to guide the state (d), compounded by the biographical contradiction of his own death (e).

