      *Refining (f):* Is friendship instrumental? Cicero says friendship makes old age bearable. But is it *only* instrumental? In *De Amicitia*, it's intrinsic. In *De Senectute*, it supports the thesis that old age is happy. Calling it "largely instrumental" is a defensible interpretive stance for *this* text, though controversial. It's less severe than the (b)/(d) clash.

      *Final Plan:*
