      *Self-Correction on (b):* Does Cicero actually say "withdraw"? In *De Senectute*, Cato says old men do not perform the tasks of young men, but they do greater and better things (counsel). He explicitly rejects the idea that old age is inactive. So commitment (b) ("withdraw from public affairs") is actually a misreading of the text itself, which makes it the source of the error. The text argues for *continued* participation via wisdom.
