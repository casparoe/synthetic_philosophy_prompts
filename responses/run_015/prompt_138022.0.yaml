      *   Is it bedrock? Yes (what counts as a meaningful cognitive difference).
      *   *Best Fit:* It's a **Category Mistake / Level-of-Analysis Mismatch** disguised as an empirical dispute. The skeptic demands proof of *representation* (competence), while the enthusiast provides proof of *processing* (performance). The skeptic demands proof of *linguistic causality*, while the enthusiast provides proof of *correlation with linguistic habits*.
      *   *Refinement:* It is a **Methodological Standoff grounded in Divergent Stakes.** The stakes are philosophical (Debate 1), the methods are psychological (Debate 2), and the barrier is statistical/causal (Debate 3).

  5.  **Assess the "Encoding-Decoupling Test":**
      *   *Articulatory Suppression:* Blocks inner speech. Good for ruling out strategic labeling.
      *   *Non-lexicalizable Response:* Good for ruling out response bias based on labels.
