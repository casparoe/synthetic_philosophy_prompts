          3.  **Computational Modeling:** Show *how* the effect happens. Is it a change in the loss function of a predictive coding model?
      *   *Honest Assessment:* The "Big Claim" is likely dead. The "Small Claim" is real but trivialized by the skeptic. The field needs to accept the Small Claim *as* the finding, without trying to inflate it to the Big Claim.

