      *   *Will it settle it?*
          *   *If effects persist:* Skeptic says "That's not linguistic, that's perceptual expertise/culture." (Moves goalpost to "Specifically Linguistic").
          *   *If effects vanish:* Enthusiast says "Language is a tool used online, not a permanent structure." (Moves goalpost to "Online Mediation").
      *   *Verdict:* It is a *better* experiment, but it is **merely a new place to have the same argument.** It isolates *online verbal mediation*, but it doesn't isolate *linguistic causality* from *cultural co-variation*.

  6.  **Determine the Path to Progress (or Lack Thereof):**
