answer: |-
  # The 90-Minute Folder Protocol
  **For:** Heritage Board Members
  **Use:** When you have zero research budget and 90 minutes to vote.
  **Goal:** Consistent decisions without needing a history degree.

  This procedure relies *only* on what the requester puts in the folder. If the folder is empty, the answer is "No." Do not go looking for facts.

  ---

  ### Step 1: The Completeness Gate
  **Check:** Does the folder contain a specific proposal for what happens to the history if the marker is removed/changed?
  *   **Yes:** Proceed to Step 2.
  *   **No:** **STOP. REJECT.**
      *   *Reason:* You cannot create **Mnemonic Debt**. If you erase a marker, you owe the record preservation somewhere else (a plaque, an archive, a museum digitization). If the requester hasn't identified where the debt is paid, you cannot approve removal.
      *   *Note:* This stops cold. Do not vote on values yet.

  ### Step 2: Honor vs. Existence
  **Check:** What is the marker *doing*?
  *   **Existence Markers:** Plaques, historical buildings, names on maps that function as addresses. These say, "Someone was here."
      *   *Standard:* Keep unless the existence itself is the harm (e.g., a marker celebrating a slave auction).
  *   **Honor Markers:** Statues, busts, "Hero" titles, naming public parks. These say, "Be like this person."
      *   *Standard:* Scrutinize heavily. If the person's core legacy violates current community values, the honor is void.
  *   **The Gut Flag:** If it's a street name, it might be both. If you can't tell if it's Honor or Existence based on the folder, **flag it for Step 5**.

  ### Step 3: Indexical Drift Check
  **Check:** Does the folder provide evidence that the name now points to the *neighborhood* rather than the *person*? (e.g., "I live on Smith Street" vs. "I live on the street named after John Smith").
  *   **High Drift (Name = Place):** The person is forgotten; the name is just geography.
      *   *Action:* **Default to KEEP.** Renaming causes logistical chaos for residents without fixing a moral harm (since the honor is already forgotten).
  *   **Low Drift (Name = Person):** The person is still actively remembered/associated with the name.
      *   *Action:* Proceed to Step 4. The honor is still active.
  *   **Unknown:** If the folder doesn't say, assume **Low Drift**. The burden of proof is on the requester.

  ### Step 4: The Debt Settlement
  **Check:** Is the Mnemonic Debt (from Step 1) sufficient to capture the complexity?
  *   **Yes:** (e.g., "Remove statue, move to museum with context panel").
      *   *Action:* Proceed to Step 5.
  *   **No:** (e.g., "Remove statue, melt it down").
      *   *Action:* **STOP. REJECT.** You cannot destroy the record.

  ### Step 5: The Values Vote (Gut Check)
  **Check:** If you passed Steps 1–4, the facts are settled. Now you vote on values.
  *   **The Question:** "Does keeping this marker cause more harm than the confusion of changing it?"
  *   **The Gut Flag:** This is where the procedure breaks. There is no right answer. If board members disagree here, it's not a failure of facts; it's a difference in values. Vote by majority.

  ---

  # Test Run: Three Cases

  Here is how the protocol handles the requests currently in the queue.

  ### Case A: The Factory Owner Street
  **Request:** Rename "Hawthorne Avenue" (named after J.B. Hawthorne, 1890s factory owner).
  **Folder Contents:** Petition citing Hawthorne violently broke strikes with private security. Counter-letter citing he built the city's first worker housing. No proposal for what happens to the "Hawthorne" historical record if renamed. Local business association letter noting "Hawthorne District" is the brand for the whole neighborhood.

  **Run:**
  1.  **Completeness:** **FAIL.** No plan for the historical record. Mnemonic Debt is unpaid.
  2.  **Drift:** **HIGH.** The name is now a neighborhood brand, not a tribute to J.B.
  3.  **Result:** **REJECT RENAME.**
      *   *Why:* Even if he was violent, the folder failed Step 1 (Debt). Plus, Step 3 (Drift) suggests renaming hurts current residents/businesses more than it harms Hawthorne's memory (which is already faded).
      *   *The Dislike:* You might hate that a strikebreaker keeps his name on the map. But the procedure forces a **KEEP** because the requester didn't offer a place to preserve the history, and the name is now about the *neighbors*, not the *man*.
      *   *Gut Flag:* None. Procedure killed it at Step 1 & 3.

  ### Case B: The Eugenicist Scientist
  **Request:** Remove bronze statue of Dr. Aris Thorne (city benefactor, 1920s).
  **Folder Contents:** Documentation of Thorne's published eugenics papers advocating forced sterilization. Proposal to move statue to the City History Museum courtyard, where a new exhibit details his scientific contributions *and* the harm of his eugenics work.

  **Run:**
  1.  **Completeness:** **PASS.** Museum exhibit pays the Mnemonic Debt. History is preserved, context added.
  2.  **Honor vs. Existence:** **HONOR.** Bronze statue in a park = "Be like Thorne."
  3.  **Drift:** **LOW.** It's a statue of a specific man. People know who it is.
  4.  **Values Vote:** The honor is tainted by active harm (sterilization advocacy). The Debt is paid by the museum move.
  5.  **Result:** **APPROVE REMOVAL.**
      *   *Why:* You can't honor this in a public park (Step 2), but you can't erase the history (Step 1 satisfied). Moving it solves both.
      *   *Gut Flag:* Step 5. One board member might argue "Science is separate from ethics." That's a values clash, not a procedure failure.

  ### Case C: The Living Activist Park
  **Request:** Name "Elena Rodriguez Park" (Rodriguez is 65, alive, still active).
  **Folder Contents:** Letter from Council citing Charter Section 4 (allows living names). Bio of Rodriguez's last 10 years of community service. No proposal for what happens if her legacy changes in 20 years.

  **Run:**
  1.  **Completeness:** **PASS.** (Technically).
  2.  **Honor vs. Existence:** **HONOR.** Naming a park is a civic award.
  3.  **Drift:** **N/A.** It's new.
  4.  **Values Vote:** Here is the friction. The Charter allows it, but the *Ethics of Commemoration* requires a completed life to judge "Honor."
  5.  **Result:** **REJECT (With Recommendation).**
      *   *Why:* The procedure flags this at Step 2. You cannot assess "Honor" on an unfinished biography. If she changes her stance or is disgraced in 5 years, you create a new Mnemonic Debt you can't pay.
      *   *Gut Flag:* **MAJOR.** The Charter says you *can*. The Ethics say you *shouldn't*. This is where you have to vote your gut on whether the Charter overrides the Ethics protocol.
      *   *My Advice:* Vote No. Wait until the story is over. It saves you from Case B in 30 years.

  ---

  ### Where This Breaks (The "Gut" Zones)
  1.  **Defining "Harm":** In Case B, everyone agrees eugenics is bad. If the folder was about a politician who raised taxes but built libraries, Step 5 will break. The procedure can't tell you if taxes are "harmful" enough to lose a statue.
  2.  **The Charter Conflict:** In Case C, if the City Council *orders* you to name the park, this procedure is void. It only works for Board-initiated or public-request decisions.
  3.  **Drift Evidence:** In Case A, if the business association hadn't sent that letter, we would have assumed Low Drift. The procedure relies on the *folder*, not reality. If the folder is weak, the decision might feel wrong later.

  **Final Note:** If the folder is thin, reject. Make them do the work. You don't have the budget to research; they have the passion to provide the facts.
