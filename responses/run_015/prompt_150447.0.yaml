answer: |-
  **Pre-Writing Brainstorming Notes**

  *   **Key Conceptual Distinctions:**
      1.  Static Geometric Invariant: Identity relies on topological features (holes, lines) or Euclidean properties independent of creation.
      2.  Psychological Prototype: Identity relies on similarity to a mental average or fuzzy family resemblance.
      3.  Production-Dynamic Constraint: Identity relies on membership in a space of permissible motor programs (trajectory, stroke order, force dynamics).

  *   **Boundary Case (Conflict):**
      A geometrically perfect lowercase *a* constructed by placing disjointed line segments via a robot arm (violates motor dynamics) versus a highly distorted, fluid scribble drawn in one continuous motion preserving the canonical loop-and-tail trajectory (preserves motor dynamics). The geometric account validates the robot shape and rejects the scribble; the motor account validates the scribble and problematizes the robot shape.

  *   **Failure Condition:**
      The project fails if the defined parameter space for motor programs becomes so abstract that it merely describes the resulting geometry (collapsing back to account 1) or so flexible that it includes shapes clearly not belonging to the category (over-generation), thereby losing explanatory power regarding category boundaries.

  ***

  **Research Proposal: Motor Invariance in Graphemic Identity**

  **Project Title:** The Dynamics of Recognition: A Motor-Invariant Account of Letterform Identity

  **1. Research Question**
  Does letterform identity depend on static geometric properties or psychological averaging, or is it constituted by membership in a constrained space of permissible production dynamics? Specifically, can we define a set of motor-program parameters such that any glyph generated within that space is recognized as the letter *a*, even when static geometric overlap with a canonical form is minimal, while excluding geometrically similar forms generated outside that space?

  **2. Critique of Existing Accounts**
  The standard debate bifurcates between geometric invariance and psychological prototypicality. Both leave the problem of extreme variation open. Geometric accounts rely on topological stability, such as the presence of a closed loop and an adjacent vertical stroke. However, this fails in boundary cases where a shape possesses the correct topology but is constructed via disjointed segments or impossible stroke orders. Humans often reject such shapes as unnatural or non-lexical despite their geometric correctness. Conversely, prototype theory suggests we match input against a mental average. This fails to explain why highly distorted handwritten forms, which share little Euclidean similarity with the average, are instantly recognized as valid instances. The logical structure of this failure is that static accounts cannot distinguish between a shape that looks like an *a* but was not written as one, and a shape that looks unlike an *a* but was written as one. The motor-invariant framing addresses this by shifting the criterion from the trace to the action that produced it.

  **3. Methodology and Work Plan**
  This project employs conceptual analysis and formal modeling rather than empirical laboratory study. The goal is to construct a coherent logical framework for motor-invariant identity.

  *   **Months 1-2: Formalizing the Parameter Space.** I will define the dimensions of the motor program relevant to graphemic production. This includes stroke order, directionality, curvature continuity, and relative timing. The output will be a formal definition of the permissible transformation space for the letter *a*.
  *   **Months 3-4: Taxonomy of Distortions.** I will construct a taxonomy distinguishing style-preserving distortions from category-breaking distortions. This involves analyzing cross-script phenomena where the same motor program yields different static shapes (e.g., rapid cursive versus printed forms) to test the robustness of the parameter space.
  *   **Months 5-6: Consistency Testing and Synthesis.** I will test the framework against known failure cases of geometric and prototype accounts. This involves thought experiments regarding disjointed construction versus fluid distortion. The final month will be dedicated to synthesizing the analysis into a final report.

  No bibliography or reading list is included here; references will be added separately in the final report.

  **4. Success and Failure Conditions**
  Success looks like a principled distinction between distorted but valid instances of *a* and invalid mimics, grounded in production dynamics. The framework must explain why a fluid scribble is read as text while a geometrically perfect assembly of lines is not. Failure looks like the parameter space collapsing back into pure geometry, where the motor constraints simply describe the final shape rather than the process. Another failure mode is over-generation, where the motor constraints are so loose that they include arbitrary stylistic conventions that do not constitute letter identity. If the model cannot distinguish letter identity from arbitrary drawing habits, the project will not have achieved its aim.

  **5. Scope Assessment**
  Six months is sufficient for this conceptual framing because the focus is restricted to a single grapheme (*a*) and a specific philosophical problem (identity conditions). This allows for deep logical analysis without the burden of data collection. The project risks growing too large if it attempts to generalize to the full alphabet or delves into neuro-motor implementation details. Generalizing to all letters would require accounting for distinct motor classes (e.g., *i* versus *o*), which exceeds the timeframe. Similarly, investigating neural substrates would shift the project from philosophy of mind to neuroscience. By remaining at the level of computational description and conceptual analysis, the project remains tractable.

  Deliverable: A formal conceptual framework distinguishing valid letterforms from invalid mimics based on production dynamics rather than static shape.

  Summary: The proposal outlines a six-month conceptual analysis to determine if letter identity is defined by permissible motor programs rather than static geometric properties.
