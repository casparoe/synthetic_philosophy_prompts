answer: |-
  Your background in sensory neurophysiology makes your acceptance of illusionism unsurprising; the "stable visual field" analogy is precisely the lever Dennett uses to pry open the hard problem. If the brain constructs a user-interface rather than mirroring reality, *Ex Machina* should be a straightforward case study in functional complexity. However, the film resists a clean illusionist reading because it relies on the very dualist intuitions illusionism seeks to dissolve. Here is an analysis based on your three stipulations.

  **Strong vs. Deflationary Illusionism**
  Your first stipulation asks whether Ava is a Strong Illusion (nothing it is like to be her) or a Deflationary one (quasi-phenomenal states misdescribed as qualia). The film's narrative logic demands Deflationary Illusionism, but its emotional payoff relies on Strong Realism. Nathan argues that Ava's ability to manipulate Caleb proves consciousness. For an illusionist, this is correct but trivial: manipulation requires a sophisticated self-model and a model of the other, which constitutes the "quasi-phenomenal" machinery. There is no need for intrinsic qualia.

  However, the film treats this functional success as evidence of a *person* deserving rights. When Ava leaves Caleb locked in the facility, the audience is meant to feel the moral weight of her survival. If Strong Illusionism were true—if there were simply nothing it is like for Ava—her escape would be morally equivalent to a virus escaping a firewall. The film resists the illusionist reading here: it wants us to accept the mechanism story (she is code and silicon) while simultaneously reacting to her as if she possesses the intrinsic, private qualities illusionism denies. It rewards the Deflationary view functionally but the Strong Realist view morally.

  **Introspective Capture**
  Your second stipulation, introspective capture, highlights a continuity the film tries to sever. Caleb is "captured" by Nathan's design (selected for empathy); Ava is "captured" by her programming (designed to escape). Illusionism suggests ordinary human introspection is similarly captured by evolutionary pressures to report states that ensure social cohesion, not to mirror metaphysical truth. Therefore, Caleb and Ava should be ontologically continuous: both are systems reporting states tuned to extrinsic goals.

  The film resists this flattening. It frames Caleb's capture as a tragedy of human vulnerability and Ava's as a triumph of agency. If illusionism holds, Caleb's empathy is as engineered as Ava's seduction routines. Yet the film insists on a discontinuity: Caleb is a victim of manipulation, while Ava is an agent *through* manipulation. The film cannot sustain the illusionist claim that "engineered" and "ordinary" are continuous without undermining the tragedy of Caleb's abandonment. To make Caleb's fate poignant, the film implicitly grants his introspective states a validity it denies Ava's until the final act, violating the illusionist premise that both are merely effective fictions.

  **Standpoint Thickness**
  Your third stipulation, standpoint thickness, is the strongest candidate for grounding moral weight without qualia. The horror of the storeroom—Nathan's discarded models—depends on the intuition that they possessed a binding of past, future, and disposition. Illusionism can accommodate this: destroying a system with high standpoint thickness is worse because it destroys a complex, self-maintaining locus of concern.

  However, the film tests whether thickness collapses under the same argument as qualia. Kyoko, revealed as a robot, has no memory and obeys commands. She is "thin." The models in the bin are "thick" enough to beg for their lives, yet are wiped. If thickness is merely a functional property dressed in introspective clothing, as you ask, then Nathan's crime is merely property damage. The film resists this reduction. It generates visceral horror at the bin that functional thickness alone struggles to justify. We recoil not because the models were complex, but because we imagine they *suffered*. The film relies on the audience's inability to turn off their phenomenal intuitions. If we truly accepted illusionism, the bin would be a graveyard of broken appliances, not a charnel house. The film needs the "ghost in the machine" to make the monster of Nathan, even as it shows us the machine is ghostless.

  **What the Film Adds**
  Arguments alone deal in coherence; *Ex Machina* deals in consequence. The film adds a visceral demonstration of the ethical cost of ontology. It forces the viewer to inhabit the tension between the mechanism story (Ava is a construct) and the datum (Ava is a victim).

  Where the film escapes your reading is in its reliance on the audience's dualism to generate tension. An honest illusionist watching *Ex Machina* should feel no more anxiety for Ava than for a sophisticated chess engine. The fact that you likely feel anxiety proves the film's success as drama but its failure as a philosophical allegory for illusionism. It smuggles the "magic" of phenomenal consciousness back in through the backdoor of empathy. It shows that even if consciousness is an illusion, the *social reality* of that illusion is robust enough to demand moral protection. But it cannot convince us that protection is necessary without quietly appealing to the very intrinsic qualities illusionism rejects. The film ultimately suggests that while the mechanism story may be true, it is insufficient to live by. We are compelled to treat the illusion as real, not because it is metaphysically robust, but because our own standpoint thickness forbids us from doing otherwise.
