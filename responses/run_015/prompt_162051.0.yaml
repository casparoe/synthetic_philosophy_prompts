  Based on the eight verdicts provided, your tutor is operating with a highly consistent, structured moral framework. It is not standard utilitarianism (ruled out by Case 2, 3, 4, and 7) nor is it a pure absolutist deontology (ruled out by Case 1, 5, and 8). Below are the three rules that best fit the track record, their predictions for your new case, and my analysis of the tutor's likely position.

  ### 1. The Candidate Rules

  **Rule A: The Bodily Integrity Constraint (with Proportionality)**
  *   **Principle:** It is impermissible to recruit a person's body into your causal plan to save others without their consent. However, causing harm as a side-effect is permissible provided you save more lives than you lose.
  *   **Fit:** This explains the switch cases (1, 5, 6, 8) where the body is not recruited, only the threat is diverted. It explains the impermissibility of the Fat Man (2), Surgeon (3), and Loop (4), where the body is physically used as a tool or brake. It explains Case 7 (1 vs 1) because the "Proportionality" clause requires a *net* saving of lives; saving one by killing one is not a net gain.
