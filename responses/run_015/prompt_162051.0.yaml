  **Rule B: The Doctrine of Double Effect (DDE) (with Proportionality)**
  *   **Principle:** It is impermissible to *intend* harm (or use harm as a means) to achieve a good end. Foreseeable but unintended harm is permissible provided the good is proportionate to the bad.
  *   **Fit:** In the Switch cases (1, 5, 6, 8), the death is a foreseen side-effect, not the means of stopping the trolley. In the Loop (4), Fat Man (2), and Surgeon (3), the death is the means (the body stops the trolley or provides organs). Case 7 is impermissible because the proportionality condition fails (1 life is not greater than 1 life).
