          *   If the student takes (2) "seriously" as *pressure*, they must believe (4) is strong enough to resist it.
      *   *Key Conflict Area:* The "Structural/Functional" nature of (5) vs. The "Non-entailment" of (3).
          *   (3) says structural info doesn't conceptually entail phenomenology.
          *   (5) says consciousness *requires* specific structural/functional conditions.
