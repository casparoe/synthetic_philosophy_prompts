      *   (3) **Explanatory Gap:** Irreducible gap between physical description and experience. Structural/functional info doesn't *conceptually entail* phenomenology. (Classic Levine/Chalmers territory).
      *   (4) **Phenomenal Concept Strategy (PCS):** The gap is explained by the special character of phenomenal concepts (acquaintance/recognition), not ontology. No dualism. (Standard Type-B Physicalist move).
      *   (5) **Anti-Panpsychism + High-Level Threshold:** Consciousness requires specific high-level organization (GWT/IGN style). Rejects panpsychism/cosmopsychism.
      *   (6) **Agnosticism on Simple Organisms:** Thermostats = no consciousness. Simple organisms (nematodes) = agnostic (might be below threshold).

  3.  **Map Dependencies & Conflicts (Internal Monologue/Drafting):**

      *   *(1) + (4):* These are the core of "Type-B Physicalism" (or a posteriori physicalism). They fit well together. (1) says the *world* is physical; (4) says the *concepts* are distinct.
      *   *(1) + (2) + (3):* This is the classic tension. If (1) is true, why do (2) and (3) feel so strong? Type-B physicalists accept (2) and (3) as *epistemic* phenomena but deny they imply *ontological* dualism. So, logically consistent, but motivationally tense. Why accept (1) if (2) suggests otherwise? The student says (2) is "defeasible pressure." This is manageable *if* (4) successfully defeats it.
