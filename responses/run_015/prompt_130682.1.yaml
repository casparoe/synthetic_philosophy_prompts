      *   *(3) + (5):* (3) says structural/functional info doesn't entail experience. (5) says consciousness *is* a specific high-level organization (structural/functional). If consciousness *is* that organization (per 1 & 5), why is there a gap (3)? The gap exists because concepts differ (4). But (5) makes a strong claim about the *conditions* for consciousness. If the conditions are purely structural/functional, doesn't that make the gap harder to maintain without slipping into illusionism or dualism? Actually, (5) is compatible with (3) *if* the identity is a posteriori. But (5) implies a specific functional correlate.
      *   *(5) + (6):* (5) sets a threshold (global integration). (6) says agnostic about nematodes. If nematodes lack global integration, (5) implies no consciousness. If they have it, (5) implies consciousness. Agnosticism here suggests uncertainty about the *empirical facts* of nematode architecture, not the theory. This seems consistent, provided the agnosticism is empirical.
      *   *(1) + (5):* Physicalism + High-level functionalism. Standard.
      *   *(2) + (1):* The core tension of Type-B physicalism. Chalmers argues (2) entails ~(1). Physicalists argue (2) is compatible with (1) via (4).

      *   *Key Conflict Area:* The "Phenomenal Concept Strategy" (4) vs. The "Zombie Intuition/Explanatory Gap" (2 & 3).
          *   If the gap is *irreducible* (3), and zombies are *conceivable* (2), does PCS (4) actually save Physicalism (1)?
