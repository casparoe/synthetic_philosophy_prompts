  3.  **Addressing Question 1: Theory of Cultural Property/Identity:**

      *   *Separation:* It presupposes a **Dualist Ontology** (Matter vs. Information).
      *   *Property Theory:* It relies on **Lockean Labor Theory** applied to the *documentation* rather than the *creation*. The museum claims ownership over the *labor of recording*, not the *labor of creating*.
