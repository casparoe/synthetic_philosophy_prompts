      *   *Surrogate Ownership:* Museums often treat surrogates (photos/scans) as collection assets.
      *   *Copyright vs. Cultural Heritage:* The clash between IP law (individual/corporate ownership, time-limited) and Traditional Knowledge (communal, perpetual).
      *   *Specific Term:* There isn't one single legal term like "Split Restitution," but **"Digital Repatriation"** is the field, and this scenario represents a failure of it. Some scholars call it **"Data Sovereignty"** issues.

  6.  **Addressing Question 4: Mapping Philosophical Commitments & Clashes:**

      *   *Commitment A (Legal Positivism):* Copyright belongs to the photographer (museum).
