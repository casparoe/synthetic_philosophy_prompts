answer: |-
  This is an exceptionally sharp observation. You have identified a friction point that is currently erupting in museum ethics, intellectual property law, and post-colonial theory. While the specific scenario you describe—requiring a source community to *license back* images of their own repatriated heritage for local use—is an extreme edge case, the legal and structural framework that allows it is very real.

  Here is a breakdown of the philosophical commitments, the theoretical contradictions, and the terminology surrounding this "split ownership."

  ### 1. The Ontological Split: Matter vs. Information
  The practice presupposes a **Cartesian Dualism applied to cultural heritage**. It treats the artifact as *res* (matter/body) and the digital scan as *informare* (information/soul).

  *   **The Theory of Property:** It relies on a specific application of **Lockean Labor Theory**. The museum argues that while they did not labor to *create* the Benin Bronze (that labor belongs to the Edo people), they *did* labor to *document* it (lighting, photography, photogrammetry). Therefore, they claim a property right over the *representation*, distinct from the *object*.
  *   **The Theory of Identity:** It assumes that cultural identity is tethered to the **physical presence** of the object (for ritual, tactile, or spiritual connection) but treats **visual access** as a commodifiable service. This clashes with many Indigenous ontologies where the image, name, and representation of an object are often inextricably linked to its spiritual essence and authority. In many Indigenous frameworks, controlling the image *is* controlling the power of the object.

  ### 2. Is It Consistent with "Repairing the Narrative"?
  **No. It is fundamentally inconsistent.**

  The standard moral argument for restitution is that colonial acquisition severed a **cultural narrative** and disrupted **sovereignty**. The museum claims that returning the object restores the community's relationship with their history.

  However, if the museum retains copyright and controls the high-res imagery:
  1.  **Epistemic Sovereignty is Retained:** The museum controls how the object is seen globally. They decide the resolution, the angle, and the context in which the image circulates. The source community possesses the *thing*, but the museum possesses the *visibility* of the thing.
  2.  **The Narrative is Bifurcated:** It assumes the narrative *can* be owned apart from the thing. It suggests that the "story" of the artifact lives in the archives and digital repositories of the Global North, while the "body" of the artifact lives in the Global South.
  3.  **Dependency:** It creates a neocolonial dependency. The community has the physical anchor, but to tell their own story to the world (via catalogs, websites, educational materials), they remain dependent on the former colonizer's infrastructure.

  This is often described by critics as **"Physical Decolonization, Digital Recolonization."**

  ### 3. Is There an Established Concept for This?
  There is no single legal term for this specific "split restitution," but several overlapping concepts map onto it:

  *   **Digital Colonialism:** This is the broader umbrella. It refers to the extraction and control of data (in this case, cultural data) from the Global South by institutions in the Global North.
  *   **Informational Self-Determination:** Borrowed from privacy law, this concept is being adapted by Indigenous scholars to argue that communities should have control over data generated from their cultural heritage.
  *   **Surrogate Ownership:** Museums often classify digital surrogates as part of their own collection assets, distinct from the physical object.
  *   **The CARE Principles:** In opposition to the "FAIR" data principles (Findable, Accessible, Interoperable, Reusable), Indigenous data governance advocates propose **CARE** (Collective Benefit, Authority to Control, Responsibility, Ethics). Your scenario violates the "Authority to Control" principle.

  ### 4. Mapping the Hidden Philosophical Commitments & Clashes
  Here is the internal logic of the museum's position and where it contradicts itself:

  | Commitment | The Museum's Stance | The Contradiction |
  | :--- | :--- | :--- |
  | **Legal Positivism** | "Copyright law grants ownership of the photograph to the photographer (the museum)." | Copyright law is a modern Western construct that often invalidates Indigenous customary law regarding ownership of likeness and sacred knowledge. |
  | **Stewardship** | "We preserve the data to ensure global access and preservation." | If the source community cannot afford to license the images, global access is restricted to the museum's terms, not the culture's terms. |
  | **Restitution** | "We are righting a historical wrong by returning the object." | Retaining control over the image perpetuates the power dynamic that caused the wrong (extraction of value). |
  | **Value Creation** | "The scan adds value through technology." | The scan has no value without the object. The value is derivative, yet it is treated as primary property. |

  **The Core Clash:** The museum is treating the digital scan as an **original work** (protectable by copyright) rather than a **derivative record** (which should inherit the status of the original). By claiming the scan is "new intellectual property," they obscure the fact that it is a dependency of the repatriated object.

  ### 5. What Would a Fully Consistent Version Look Like?
  If a museum truly believed that restitution repairs a broken cultural narrative and restores sovereignty, the philosophical consistency would require:

  1.  **Transfer of Copyright:** Upon physical repatriation, the copyright (or at least an irrevocable, royalty-free, exclusive license) for the digital surrogates transfers to the source community.
  2.  **CC0 / Public Domain:** Ideally, the museum releases the scans into the public domain, acknowledging that the *cultural heritage* supersedes *institutional IP*.
  3.  **Community-Led Digitization:** The museum provides the technology/training for the source community to create their own scans, ensuring they own the data generation process from the start.
  4.  **Ontological Alignment:** Acknowledging that for some objects, *no* digital scan should exist (due to sacred restrictions), and respecting the community's right to say "this image is not for the world," even if the museum has the technical capability to make it so.

  ### Summary
  The practice you describe presupposes that **culture is content** that can be unbundled from **community sovereignty**. It treats the artifact as a vessel of history (which can be returned) but the *knowledge* of the artifact as capital (which must be retained).

  It is not consistent with the moral claims of restitution. It quietly assumes that the "narrative" is a proprietary asset of the institution that documented it, rather than an inherent right of the people who created it. A consistent ethical framework would view the digital surrogate as an extension of the object's sovereignty, not an extension of the museum's portfolio.

  *Note: While this logic exists, be aware that many major institutions (like the Smithsonian and the Horniman Museum) are currently moving toward Open Access policies precisely to avoid this ethical trap. The scenario you describe is the "worst-case" application of current IP law, which is why it feels so jarring.*
