answer: |-
  **MEMORANDUM**

  **TO:** Municipal Review Panel
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Recommendation on Vendor Release 4.2 and Permit Conditions 4(a)/4(b)

  **Recommendation:** Approve Release 4.2 subject to revised conditions. Amend Condition 4(a); strengthen Condition 4(b). Drop the proposed "Closure Certificate." Revise the "Protected-Fact Schedule" into a "Mandatory Perception Zone" requirement.

  **The Core Conflict**
  We are asked to approve a fleet of forty robots based on a software revision that admits it cannot simultaneously satisfy two existing permit conditions. Condition 4(a) requires the device to maintain a current model of the right-of-way at all times. Condition 4(b) forbids impeding pedestrian flow and limits halting to re-survey to once every three seconds.

  The vendor is correct: these are mutually exclusive if interpreted literally. A robot cannot know everything about a changing world if it is forbidden from stopping to look often enough. The October incident proves the danger of prioritizing the model over the ground truth. A unit wedged a service gate open; a human closed it; the robot's system decided the gate was not its problem and did not look again. The robot trusted its memory over reality. It stopped short, blocking the courtyard's only accessible route for nine minutes. A resident in a power wheelchair was delayed from dialysis.

  The logs showed the robot obeyed 4(a)—its model was internally consistent. But it failed the spirit of the permit: it did not know what it needed to know to keep moving.

  **The Epistemological Trap**
  In preparing this motion, I consulted with a planning system designer who raised a fundamental objection to my original proposal. I had suggested requiring a "Closure Certificate," where the operator lists every fact the system assumes is unchanged, and a fixed schedule of facts that must always be re-checked.

  The objection was convincing: we cannot list every possible hazard in an infinite world. A finite list will always miss something. Furthermore, requiring a certificate of what the machine "knows" risks becoming paperwork theater—unenforceable promises about internal states that an inspector cannot see. If we try to legislate how the machine thinks, we will fail. We cannot solve the philosophical problem of how a machine knows the world is real.

  However, accepting this limitation does not mean we must accept the status quo. While we cannot legislate knowledge, we can legislate attention. We may not be able to force the robot to know everything, but we can force it to look at the things that matter most most often.

  **Resolution on Conditions 4(a) and 4(b)**
  Condition 4(a) is the source of the impossibility. It demands omniscience ("current model... at all times"). This must be amended. We should not permit a vendor to claim compliance based on an internal model that contradicts physical reality.

  Condition 4(b) is the safety constraint. It should not be weakened. Instead, it must be clarified to prioritize human access over robot efficiency.

  **Revised Motion Instructions**
  1.  **Amend Condition 4(a):** Replace "maintain a current model... at all times" with "maintain a model updated frequently enough to prevent obstruction of public access." This shifts the standard from internal consistency to external performance.
  2.  **Strengthen Condition 4(b):** Add a clause: "When within two meters of a recognized pedestrian pathway or access point, the device must refresh visual perception data at least once every two seconds, regardless of movement status."
  3.  **Drop the Closure Certificate:** My colleague is right; this is unenforceable. It asks the operator to define the limits of their own ignorance. We should not file paperwork that implies we have cataloged every risk.
  4.  **Revise Protected-Fact Schedule:** Instead of a list of facts, we require a list of **Zones**. The operator must file a map of "High-Risk Zones" (building entrances, gate thresholds, wheelchair ramps). In these zones, the "learned filter" described in the vendor's revision is disabled. The robot cannot decide a gate is "unchanged." It must look.

  **Verifiability**
  An inspector with a clipboard and a data download must be able to verify this without understanding the code.
  *   **The File:** The operator must submit a map layer of High-Risk Zones alongside their route planning.
  *   **The Log:** For every instance where a robot enters a High-Risk Zone, the log must show a perception timestamp no older than two seconds.
  *   **The Trigger:** If a robot halts for more than three minutes in a High-Risk Zone, operations are automatically suspended pending review. In the October incident, a nine-minute halt would have triggered an immediate shutdown after minute three.

  **Conclusion**
  My colleague warned that we are wandering into the "frame problem"—trying to define what matters in a world that is too complex to define. They are right that we cannot finish that job. But we do not need to finish it to protect the public. We do not need to tell the robot how to understand the whole world. We only need to tell it where not to trust its memory.

  The October incident was not caused by a lack of computing power. It was caused by a decision to ignore a gate because the robot hadn't moved it. That is a policy choice, not a technical limitation. By dropping the theoretical certificate and focusing on mandatory perception in physical zones, we avoid the trap of legislating epistemology. We are instead legislating caution.

  Vote to approve Release 4.2 only if the vendor accepts these amendments. We cannot guarantee the robots will never be confused, but we can guarantee they will not ignore a closed gate for nine minutes while a resident waits to pass.
