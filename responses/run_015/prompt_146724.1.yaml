  **COMMITTEE ON CONTINUITY OF PERSONHOOD AND INSTITUTIONAL OBLIGATIONS**
  **FORMAL OPINION: CASE #GSR-004 (DR. ELENA VASQUEZ)**

  **Recommendation:**
  The Committee recommends option (a): full institutional recognition of the individual currently occupying Dr. Vasquez's position as continuous with the original Dr. Elena Vasquez. Tenure, pension contributions, and spousal health benefits must remain intact and uninterrupted.

  **Philosophical Grounding:**
  This decision rests on the ethical prioritization of psychological survival over biological substrate. We explicitly engage Derek Parfit's distinction between personal identity and what matters in survival. Strict identity is often viewed as an all-or-nothing relation dependent on physical continuity. If identity requires the persistence of the original biological organism, then the original Dr. Vasquez is deceased. However, Parfit argues that identity is not what matters for moral and practical purposes. What matters is Relation R: psychological continuity connected by the right kind of cause.

  In the Graduated Substrate Replacement (GSR) protocol, psychological traits, memories, and dispositions were preserved through a gradual, causal process. There was no break in consciousness or agency. For an institution dedicated to the flourishing of persons, denying recognition because the underlying matter changed privileges substance over function. If the mind that earned tenure persists, the obligation to honor that tenure persists. To rule otherwise is to allow metaphysical technicalities to override the lived reality of a conscious agent. Institutional obligations attach to the person—the locus of agency and memory—not the specific atoms composing them. Therefore, even if strict metaphysical identity is indeterminate, survival is established, and survival is sufficient for the continuation of rights and duties.

  **Addressing the Opposition:**
  We must treat seriously the opposing view, articulated by Dr. Vasquez's adult children and legal counsel. They argue that because the original biological tissue was destroyed, a death occurred. To recognize Vasquez-2 is to deny the reality of that loss. This claim carries significant moral weight. The biological organism that gave birth to the children and married the spouse no longer exists. There is a genuine sense in which the "flesh and blood" mother is gone. Institutional recognition might feel like erasing this grief, imposing a bureaucratic definition of life that invalidates their experience of loss. They fear that honoring the claim erases a real death that occurred.

  However, accepting this view leads to untenable ethical consequences. If we deny continuity based on biological turnover, we risk treating a psychologically continuous, suffering, living person as dead for bureaucratic convenience. The spouse's objection highlights this horror: Vasquez-2 walks, talks, loves, and teaches. To declare her dead is to inflict a social death upon a living mind. Furthermore, institutional benefits are not rewards for biological tissue; they are commitments to the person's career and welfare. Since the career and welfare continue uninterrupted in Vasquez-2, severing benefits punishes the survivor for the method of their survival. We acknowledge the children's grief—their mother's biology changed fundamentally—but institutional obligations track the person, not the atoms. Denying benefits does not restore the biological mother; it merely abandons the psychological successor who bears her burdens and rights.

  **Criteria for Future Cases:**
  To govern future cases of substrate replacement, the Committee establishes the following criteria for recognizing continuity:
  1.  **Gradualism:** Replacement must occur incrementally to preserve causal connection without interruption of consciousness.
  2.  **Psychological Fidelity:** The successor must demonstrate preserved memories, dispositions, and cognitive capacities indistinguishable from the predecessor.
  3.  **Voluntary Consent:** The procedure must be chosen by the original agent as a means of survival, not imposed.

  Where these criteria are met, the institution shall treat the successor as the same person for all contractual and moral obligations. We conclude that while the biology of Dr. Vasquez has changed, the person who holds her rights and duties remains. To decide otherwise is to prioritize the container over the content, violating the very principle of personhood the University claims to uphold.

  **Approved by the Committee on Continuity of Personhood and Institutional Obligations.**
