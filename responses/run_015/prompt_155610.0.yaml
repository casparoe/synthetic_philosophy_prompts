answer: |-
  My dear sir,

  You present a vision that is at once startling and, I fear, profoundly plausible. It is 1930, and the world is already darkening with the clouds of depression; men are out of work, capital is paralyzed, and yet you speak to me of a future where the very *rest* of mankind is harnessed as a factor of production.

  Let me attempt to grasp your meaning through the lens of my own time. You suggest that in this future "attention economy"—a phrase I must interpret as a market for the focus of the human mind—the leisure I envisioned for our grandchildren is not truly leisure at all. Rather, it is a new form of labour. You say that when a man sits to enjoy a play, or reads a book, or merely converses in his parlour, the details of his preference are recorded, tallied, and sold? That his aesthetic experience is not his own, but leased to him under the watchful eye of a merchant who profits from his very state of repose?

  If I understand you aright, you are describing a world where the *means* of living well have been captured by the *motives* of accumulation.

  I must concede a point to you immediately. In my lecture at Cambridge, I distinguished between those needs which are absolute—independent of the situation of our fellow men—and those which are relative, in which we feel superior to them. I posited that the absolute needs could be satisfied, perhaps within a century. But if what you say is true, then the capitalists of your era have discovered a method to transform the absolute need for rest and beauty into a relative need for *consumption*. If one cannot rest without being mined for profit, then rest is no longer a freedom; it is a marketplace.

  This confirms my deepest anxiety regarding the "love of money." I have called it a somewhat disgusting morbidity, a semi-criminal, semi-pathological propensity to hand over our faculties to the accumulation of wealth rather than its enjoyment. If your future society has engineered a system where a man cannot even *be* without paying a toll to the accumulator, then the morbidity has not been cured; it has become the atmosphere we breathe.

  However, I must press you on a matter of economic mechanics. You speak of this "mining of data." In my day, capital is accumulated through saving and investment in machinery, in railways, in housing. In your time, is the human mind itself the machinery? Is the "data" you speak of a new form of raw material, like coal or cotton, extracted from the nervous system?

  For if leisure is engineered to become a vector for accumulation, then the technical problem of production may indeed be solved—we may have enough goods to feed and clothe the world—but the *social* problem has worsened. We have replaced the scarcity of goods with a scarcity of privacy, and a scarcity of autonomy.

  But here I must stand by my optimism, even against your grim portrait. I argued that when the accumulation of wealth is no longer of high social importance, the morals of society will change. We shall be able to rid ourselves of many of the pseudo-moral principles which have hag-ridden us for two hundred years. If your generation finds that leisure is colonized, it is because you have not yet severed the link between effort and reward, between profit and purpose.

  Tell me this: In this economy of attention, is the profit derived from this "surveillance" reinvested in further machinery to mine more attention, or is it distributed to allow the miners to rest? If the former, then you are merely in a prolonged period of "purposiveness," where we pretend to care about money because we do not yet know how to care for life.

  I do not believe the economic problem has metastasized; rather, I believe your society has solved the problem of *production* but failed the test of *distribution*. You have the abundance I predicted, but you have allowed the rentier—the owner of the platform, the owner of the airwaves, the owner of the "subscription"—to tax the very act of living.

  This is not a failure of economic possibility. It is a failure of political will. The art of life remains, as I said, to live wisely, agreeably, and well. If your machines are stealing your wisdom to sell it back to you as entertainment, then you must smash the machines, or better yet, change the owners.

  Do I understand you correctly that in this future, a man is not paid for his labour, but *charged* for his leisure?
