    "rejected_step": "4",
    "why_it_looked_fine": "It appeals to epistemic uniformity: if a non-causal faculty explains one abstract domain, parsimony suggests it should explain all similar domains.",
    "cost_of_rejection": "One must abandon a monolithic theory of intuition in favour of a modular, domain-specific epistemology that distinguishes mathematics from ethics or aesthetics.",
    "least_costly_fix": "Refine the definition of mathematical justification to include formal constraints (proof, consistency) and scientific indispensability, which act as filters not present in other abstract domains.",
    "severity_of_tension": "medium"
  }
