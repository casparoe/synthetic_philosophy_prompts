answer: |-
  # Standard Operating Procedure: Bongard Benchmark Grading (v1.0)

  **Operator:** Undergraduate Research Assistant  
  **Time Budget:** 5 minutes per problem  
  **Goal:** Classify submissions as **ACCEPT**, **REJECT**, or **ESCALATE**.  
  **Constraint:** Do not open the "Gold Label" file. You are judging the submission against the images, not the author's intent.  
  **Escalation Cap:** Max 5 escalations per batch of 50 problems. If you hit the cap, remaining "Escalate" candidates must be forced to **REJECT**.

  ---

  ## The Grading Algorithm

  ### Step 1: The Split Test (Accuracy)
  **Action:** Read the rule. Apply it mentally to all 12 figures.
  **Question:** Does the rule return `TRUE` for all 6 Left figures and `FALSE` for all 6 Right figures?
  *   **No:** Stop. Log **REJECT**. (Reason: `ACCURACY_FAIL`)
  *   **Yes:** Proceed to Step 2.

  ### Step 2: The Index Test (Memorization)
  **Action:** Scan the text for references to specific positions or identities.
  **Question:** Does the rule reference box indices (e.g., "Top Left", "Box 3"), specific coordinates, or meta-data (e.g., "file size", "line thickness in pixels")?
  *   **Yes:** Stop. Log **REJECT**. (Reason: `INDEX_LEAK`)
  *   **No:** Proceed to Step 3.

  ### Step 3: The Disjunction Limit (Overfitting)
  **Action:** Count the number of independent conditions joined by "OR" (disjunctions).
  **Question:** Are there more than **two** distinct disjunctive clauses? (e.g., "A OR B OR C" = 3 clauses).
  *   **Yes:** Stop. Log **REJECT**. (Reason: `DISJUNCTION_OVERFLOW`)
      *   *Lab Coat Note:* This is a heuristic. A 5-way disjunction is statistically likely to be a list of the 6 positive examples disguised as rules. We treat >2 as overfitting by default.
  *   **No:** Proceed to Step 4.

  ### Step 4: The "Coincidence" Check (Judgment Call)
  **Action:** Evaluate the *type* of property described.
  **Question:** Does the rule describe a **geometric/topological property** (e.g., closed, inside, convex) OR a **numerical coincidence** (e.g., "even number of endpoints", "count is prime")?
  *   **Numerical Coincidence:** If the rule relies on counting discrete elements to determine a binary state (e.g., "odd number of lines") *and* a geometric description seems plausible (e.g., "open vs closed"), mark **ESCALATE**. (Reason: `INTENT_AMBIGUITY`)
      *   *Lab Coat Note:* This is subjective. You are guessing whether the count is the *cause* or a *correlate* of the visual concept. We escalate because we cannot know the author's intent without bias.
  *   **Geometric/Standard:** Proceed to Step 5.

  ### Step 5: The Simplicity Proxy (Judgment Call)
  **Action:** Compare the rule's complexity to the visual salience of the images.
  **Question:** Is the rule significantly simpler or more complex than the visual difference appears to warrant?
  *   **Significantly Simpler:** (e.g., The images look complex, the rule is "has a circle"). Mark **ESCALATE**. (Reason: `GENERATOR_BIAS_SUSPECT`)
      *   *Lab Coat Note:* This catches cases where the generator *couldn't* produce counterexamples. If the rule is too simple for the visual noise, the benchmark might be broken.
  *   **Significantly Complex:** (e.g., Images look simple, rule is convoluted). Mark **REJECT**. (Reason: `OVERCOMPLEX`)
  *   **Match:** Mark **ACCEPT**.

  ---

  ## Logging Format
  Every problem must result in exactly one line in the CSV log:
  `[PROBLEM_ID], [STATUS], [REASON_CODE]`
  *Example:* `BNG_042, ESCALATE, INTENT_AMBIGUITY`

  ---

  ## Application to Your Three Submissions

  Here is how the procedure processes the three specific cases you described.

  ### Submission 1: "Even number of separate marks" (vs. Intended: "Outline is closed")
  *   **Step 1 (Split):** Pass. (Assuming your generator correlates closure with mark count).
  *   **Step 2 (Index):** Pass. No indices used.
  *   **Step 3 (Disjunction):** Pass. Single condition.
  *   **Step 4 (Coincidence):** **FLAG.** The rule relies on counting ("even number") rather than topology ("closed").
  *   **Outcome:** **ESCALATE (`INTENT_AMBIGUITY`)**.
  *   **Why:** The RA cannot know if you care about topology or count. This captures your argument (a). The RA admits they can't distinguish intent.

  ### Submission 2: "Five-way disjunction" (Fits 12 exactly, shorter than Gold)
  *   **Step 1 (Split):** Pass.
  *   **Step 2 (Index):** Pass. (Assuming it describes features, not indices).
  *   **Step 3 (Disjunction):** **FAIL.** Five disjunctive clauses exceed the limit of two.
  *   **Outcome:** **REJECT (`DISJUNCTION_OVERFLOW`)**.
  *   **Why:** Even if shorter to type, a 5-way OR is structurally indistinguishable from memorizing 5 of the 6 examples. The procedure prioritizes generalization heuristics over character count.

  ### Submission 3: "Simpler rule, equivalent on generator output" (e.g., "Has curvature" vs "Is a circle" where generator only makes circles)
  *   **Step 1 (Split):** Pass.
  *   **Step 2 (Index):** Pass.
  *   **Step 3 (Disjunction):** Pass.
  *   **Step 4 (Coincidence):** Pass. (Geometric property).
  *   **Step 5 (Simplicity):** **FLAG.** If the rule is "Has curvature" and the Gold is "Is a circle", the RA sees the rule as simpler than the visual specificity implies.
  *   **Outcome:** **ESCALATE (`GENERATOR_BIAS_SUSPECT`)**.
  *   **Why:** This captures your argument (c). The RA notices the rule is "too good" for the visual variance.
  *   **Honest Output:** If the RA misses the simplicity mismatch in Step 5, they will **ACCEPT**. This reveals the procedure's blindness to generator constraints.

  ---

  ## What This Procedure Cannot Do

  1.  **Distinguish Truth from Correlation:** The procedure cannot tell if "even number of marks" is *why* the images are grouped or just a side effect of "closed outlines." It relies on the RA's intuition in Step 4, which is not reproducible across different RAs without training data.
  2.  **Validate the Benchmark:** If Submission 3 is **ACCEPT**ed (because the RA didn't flag the simplicity mismatch), you will not know your benchmark is broken until you review the escalations and realize none were filed for that problem type. The procedure protects *your* time, not the *benchmark's* validity.
  3.  **Resolve Philosophical Disputes:** If you and your coauthors disagree on whether "closed" is more natural than "even marks," this procedure will simply hand that argument back to you via the `INTENT_AMBIGUITY` escalation. It does not solve the argument; it triages it.
  4.  **Handle "Clever" Overfitting:** A clever submission could phrase a 5-way disjunction as a single complex mathematical condition (e.g., "Sum of vertex angles mod 5 = 0"). Step 3 would miss this, leading to a false **ACCEPT**.

  **Recommendation:** If more than 30% of a batch hits `INTENT_AMBIGUITY`, stop grading. The problem set is under-specified, and you need to rewrite the generator constraints before paying RAs to guess your mind.
