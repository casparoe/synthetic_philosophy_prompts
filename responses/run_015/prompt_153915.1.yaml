      *   *Let's try to give the RA a "Plausibility Heuristic."*
      *   *Step 1: Accuracy.* (Pass/Fail)
      *   *Step 2: Memorization.* (Pass/Fail)
      *   *Step 3: "Coincidence" Check.* (Pass/Escalate).
      *   *Step 4: Simplicity.* (Pass/Escalate).

      *   *Wait, I need to make sure the RA doesn't escalate everything.*
      *   *Constraint:* 5 minutes per problem.
      *   *Constraint:* Reproducible.
      *   *Constraint:* Honest about judgment calls.

      *   *Decision:* The RA acts as a filter.
