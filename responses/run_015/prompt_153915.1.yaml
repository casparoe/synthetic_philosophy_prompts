  8.  **Final Polish of the Procedure:**
      *   Make it look like a standard operating procedure (SOP).
      *   Ensure the "Stop" points are clear.
      *   Ensure the "Escalation" criteria are specific enough to be reproducible but broad enough to catch the user's specific worries.

      *(Self-Correction during drafting)*: I initially thought about hiding the Gold Label. But if the RA doesn't know the Gold, they can't judge "Simpler than Gold." The prompt implies the User is the only one reading escalations. So the RA should *not* see the Gold Label to avoid anchoring. They judge the submission on its own merits + the images. If it's valid but suspicious, they escalate.

