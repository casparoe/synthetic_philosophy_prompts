      *   *Idea:* Provide a "Standard Vocabulary" (e.g., shape, color, containment, count). If the rule uses concepts outside this without clear visual definition, Escalate.

  5.  **Drafting the Protocol Steps:**
      1.  **Split Verification:** Check 6 Left (True) vs 6 Right (False).
      2.  **Index Check:** Ensure no reference to "Left 1", "Right 3", etc.
      3.  **Disjunction Check:** Ensure it's not "OR"ing specific features that look like they target individual images.
      4.  **Visual Grounding:** Must refer to visible geometry/topology, not meta-data.
      5.  **The "Oddness" Flag:** If it fits but feels like a coincidence (e.g. "even number of marks" vs "closed"), Escalate.

  6.  **Running the Procedure on the Three Submissions:**
      *   *Submission 1 (Even marks vs Closed):* Fits 12/12. Not a list. Visual? Yes. Oddness? High (topology vs count). -> Escalate.
      *   *Submission 2 (5-way disjunction):* Fits 12/12. Is it a list? It's a disjunction. If it covers 5 cases that group the 6 images, it's borderline. If it's shorter to type, it might be simpler. But disjunctions are usually suspect in Bongard. -> Likely Reject or Escalate depending on strictness. Let's make the procedure catch "Disjunctions > 2 terms" as Reject.
      *   *Submission 3 (Simpler, Equivalent, Generator Limited):* Fits 12/12. General. Simpler. -> RA sees this as a "Clear Pass." But the User knows it reveals a benchmark flaw. -> This highlights what the procedure *can't* do (detect benchmark validity).

  7.  **Refining the Output:**
      *   Need to be strict about the "Judgment Call" admission.
      *   Need to ensure the "One Line Log" is clear.
