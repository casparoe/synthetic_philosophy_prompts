      *   The prompt suspects: Manipulation (Historical) vs. Frankfurt (Actual-Sequence).
      *   My analysis: The real tension is between the *Historical Constraint* (needed for manipulation cases) and the *Fixed Purpose* (not settling determinism). If history matters, and determinism implies a history stretching back before the agent's control, hard incompatibilism looms. But if we ignore history (Actual Sequence), manipulation cases look like responsibility.
      *   Actually, a sharper tension exists between the *Scalar Constraint* (Diminished Capacity/Decaying Monitor) and the *Binary Legal/Blame Practice*. Law often needs bright lines; metaphysics suggests gradients.
      *   *Decision:* The strongest tension is between the **Historical Constraint** (Manipulation) and the **Actual-Sequence Sufficiency** (Frankfurt). You can't have manipulation wash out responsibility *only* because of history if you claim Frankfurt cases show history doesn't matter.
      *   *Exclusionary Requirement:* The **Historical Constraint**. It kills pure Actual-Sequence views (like early Frankfurt/Fischer) and pure Structural Compatibilism.

  7.  **Drafting the Scorecard:**
      *   PAP: Fails the Fixed Purpose (requires indeterminism).
