      *   Constraint: Do not solve Determinism vs. Indeterminism.
      *   Implication: The theory must be robust enough to handle determinism *if* it's true, but strong enough to rule out clear cases of non-responsibility (coercion, insanity) regardless of determinism. This points strongly toward a *Compatibilist* framework, specifically one focused on *Guidance Control* or *Reasons-Responsiveness*, but it must address Incompatibilist worries (Manipulation).

  3.  **Drafting the Requirements (The "Specification"):**
      *   I need to generate a list of criteria that any theory of responsibility (aimed at the fixed purpose) must meet.
      *   *Criterion 1: The Asymmetry Constraint.* (Compulsion vs. Frankfurt). We need to distinguish coercion from mere counterfactual intervention.
