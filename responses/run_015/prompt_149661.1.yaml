      *   **Task:** Set out requirements for an account of the "could have done otherwise" (AP) condition on moral responsibility.
      *   **Fixed Purpose:** Underwrite excuse conditions in ordinary interpersonal blame and criminal law mitigation *without* settling the truth of determinism. (This implies a compatibilist-leaning or agnostic framework, but one that must handle incompatibilist intuitions).
      *   **Required Content:**
          *   Motivations for each requirement (case/consideration).
          *   Label: Non-negotiable vs. Preference.
