      *   *Criterion 7: The Luck Insulation Constraint.* (Resultant Luck). Outcomes shouldn't dictate responsibility status entirely.

      *Refining Labels:* "Non-negotiable" means if the theory fails this, it fails the Fixed Purpose (legal/interpersonal excuses). "Preference" means it's a theoretical nice-to-have but not essential for the practical aim.

  4.  **Addressing the Required Topics within the Requirements:**
      *   *Frankfurt/Flicker:* Fits under Asymmetry.
      *   *Trigger Dilemma:* Fits under Asymmetry/Mechanism.
      *   *Compulsion/Duress:* Fits under Asymmetry.
      *   *Omissions:* Fits under Ability/Opportunity.
      *   *Manipulation:* Fits under Historical Constraint.
      *   *Moral Luck:* Fits under Luck Insulation.
      *   *Diminished Capacity:* Fits under Scalar/Threshold.
      *   *Ignorance:* Fits under Epistemic.
      *   *Historical vs. Structural:* Fits under Historical Constraint.

  5.  **Handling the Three Custom Cases:**
      *   *Reason-Swap:* Tests Reasons-Responsiveness. If the action is the same but reasons differ, is responsibility the same? (Likely No).
      *   *Decaying Monitor:* Tests the nature of "Ability." Is it a capacity or a probability?
