answer: |-
  **The Integrity of Contestation: A Principle for Democratic Backsliding**

  You are encountering difficulty because you are searching for a monistic definition of backsliding where a dualistic one is required. Your intuition correctly distinguishes between *illiberal governance* (Verdania) and *democratic erosion* (Hungary, Saldena), but your current principle focuses too narrowly on the probability of incumbent turnover. That metric captures Hungary but fails the USA (where turnover occurred) and Saldena (where turnover was possible but restricted).

  To resolve your oscillations, I propose we define democratic backsliding not as a specific set of institutional changes, nor merely as a reduction in the probability of turnover, but as **any unilateral alteration of the political order by incumbent actors (or dominant coalitions) that degrades the structural preconditions for the demos to hold power accountable or to constitute itself, absent a restorative justification validated by independent adjudication.**

  This principle rests on two pillars: **Contestability** (the ability to remove rulers) and **Constitutivity** (the ability of the people to define who counts as a member of the demos). Below, I map this principle to your cases, identify the necessary sacrifice, and answer your boundary questions.

  ### 1. Mapping the Principle to Your Cases

  **Clause A: The Degradation of Contestability (Hungary, Poland 2015, USA)**
  This clause covers actions that raise the cost of opposition or lower the reliability of electoral accountability.
  *   **Hungary & Poland:** These are clear instances. Rewriting constitutions, packing courts, and gerrymandering structurally raise the cost of turnover. Even if the incumbent claims a mandate, they are altering the rules such that future mandates are harder to win for others.
  *   **USA (2020–21):** Your current principle struggles here because no rules were successfully changed. However, under the *Integrity of Contestation* principle, the *attempt* to subvert the count and the reliance on norm-breaking (pressuring the Vice-President) counts as backsliding because it sought to degrade the structural precondition of accountability. The fact that norms held does not negate that the *integrity* of the contestation was attacked. The backsliding lies in the erosion of the *constraint* environment, not just the statutory environment.

  **Clause B: The Degradation of Constitutivity (Saldena)**
  This clause resolves your Verdania/Saldena puzzle.
  *   **Verdania:** You classify this as illiberalism, not backsliding. My principle agrees. Verdania restricts liberal rights (speech, funding), but it leaves the *mechanism* of accountability and the *boundary* of the demos intact. The opposition can still win; the excluded groups are not defined by identity but by political preference. The structural precondition for democracy remains; the *quality* of democracy is lowered, but the *container* is not breached.
  *   **Saldena:** Here, a hereditary minority is permanently barred. This is not merely illiberalism; it is a contraction of the *demos* itself. Democracy requires that the people constitute themselves; if a segment is permanently excluded from representation by informal but binding understanding, the structural precondition of 'rule by the people' is degraded. This counts as backsliding (or structural erosion) because it forecloses the possibility of the excluded group ever utilising the democratic mechanism.

  **Clause C: The Restorative Exception (Poland 2023)**
  This clause handles your oscillation regarding the new Polish government.
  *   **Poland (Restoration):** You note the mechanisms (media control, judicial review) look like the previous government's backsliding. The distinction lies in *teleology* and *symmetry*. If the measures are temporary, aimed at resetting the playing field to a neutral baseline, and subject to independent judicial review, they are restorative. If they are designed to entrench the *new* majority permanently, they are backsliding. The principle requires that restorative measures must not create a new asymmetry.

  ### 2. The Necessary Sacrifice

  To make this principle coherent, you must sacrifice one of your tentative verdicts: **The status of Turkey.**

  You expressed hesitation because Turkey was not a "full democracy" beforehand. My principle forces a decision: **Backsliding requires a sufficient democratic baseline.** If a regime is already authoritarian, further consolidation is not backsliding; it is regime hardening. If a regime is hybrid (as Turkey arguably was pre-2017), then erosion of the democratic components *is* backsliding relative to those components.

  However, you cannot have it both ways. If you classify Turkey as backsliding, you must admit that the baseline was sufficiently democratic to slide *from*. If you maintain it was not, you must classify the shift as authoritarian consolidation. To preserve the utility of "backsliding" as a warning signal for established democracies, I argue you should classify Turkey as **authoritarian consolidation**, not backsliding. The concept loses its bite if it applies to states that never achieved the structural preconditions of contestation in the first place. This clarifies your hesitation: the hesitation was correct. Turkey is a different category of failure.

  ### 3. The New Case: The Decree Power Referendum

  Consider your new case: a long-standing democracy where a referendum-backed amendment gives the cabinet power to rule by decree for renewable six-month periods, used so far only for measures with majority support.

  **Verdict:** This is **backsliding**.

  **Reasoning:** It fails the *Contestability* test. Even if currently used popularly, the structural precondition of accountability is degraded. The ability to rule by decree removes the legislative check, and the "renewable" nature means the executive can bypass the electoral cycle entirely. The fact that it has majority support *now* is irrelevant; backsliding is defined by the reduction of future contestability, not current popularity. A democracy is not merely the will of the current majority; it is the institutionalisation of the possibility that the current majority may be wrong and removable. This amendment lowers the cost of retaining power against a future majority.

  ### 4. Boundary Questions

  **Can backsliding occur where the baseline was defective?**
  Yes, but only relative to the democratic elements that *did* exist. This is the "hybrid regime" problem. If a state has free elections but no rule of law, eroding the elections is backsliding relative to the electoral component. However, as noted with Turkey, if the baseline is too low, the term becomes unhelpful. We should reserve "backsliding" for regimes that cross a minimum threshold of democratic integrity before declining.

  **Can a state keep backsliding once it has plainly stopped being a democracy?**
  No. There is a terminal point. Backsliding describes a *process* of erosion. Once the structural preconditions (free elections, basic civil liberties, independent adjudication) are extinguished, the regime has transitioned to authoritarianism. To call an established dictatorship "backsliding" is a category error; it has already fallen off the cliff. Backsliding is the slope, not the bottom.

  **Who is the Official Sayer?**
  This is the most critical philosophical question. You ask whether the verdict belongs to domestic courts, the electorate, external bodies, or retrospective judgement.

  My argument is that the verdict is **mind-independent but epistemically accessible only retrospectively.** There is no *constitutive* official sayer.
  *   **The Electorate:** Cannot be the sayer in the moment, because backsliding often manipulates the electorate's capacity to judge (as in Hungary).
  *   **The Incumbent:** Obviously disqualified.
  *   **External Bodies/ Courts:** These are the best *provisional* trackers, but their verdicts are not constitutive. If the EU sanctions Hungary, that is strong evidence of backsliding, but the backsliding exists independently of the sanction.
  *   **Retrospective Judgement:** This is the truth-maker. We often only know definitively that backsliding occurred when the possibility of reversal is extinguished.

  However, for practical purposes (such as your seminar or policy), we must act on **provisional adjudication by independent institutions.** When domestic courts are packed, the authority shifts to external bodies or international norms. But you must accept that this authority is fallible. You side with the EU against the Hungarian electorate not because the EU is infallible, but because the electorate's verdict is compromised by the very backsliding in question. In the US case, you side with the electorate (eventually) because the institutions held.

  Therefore, the "Official Sayer" is a **distributed competence**: primarily domestic courts, shifting to external bodies when domestic ones are compromised, but always subject to retrospective historical correction. There is no final arbiter in real-time.

  ### Summary of the Argument

  1.  **Principle:** Backsliding is the unilateral degradation of the structural preconditions for contestability or constitutivity, absent independent restorative validation.
  2.  **Verdicts:** Hungary, Poland (2015), USA (2020), and Saldena are backsliding. Verdania is illiberalism. Turkey is authoritarian consolidation (sacrificing the "hesitant backsliding" verdict). Poland (2023) is restoration provided it is symmetric and temporary.
  3.  **New Case:** Decree power is backsliding because it degrades contestability regardless of current support.
  4.  **Authority:** The verdict is objectively true but only knowable retrospectively; provisionally, it belongs to independent institutions (courts/external bodies) rather than the manipulated electorate.

  This framework preserves your core intuitions about Hungary and the USA while resolving the Verdania/Saldena contradiction by distinguishing between *rights* (Verdania) and *membership* (Saldena). It forces you to clarify the Turkey case, which strengthens the concept by preventing it from applying to every political decline in history.
