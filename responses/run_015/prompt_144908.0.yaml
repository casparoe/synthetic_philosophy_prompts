answer: |-
  ### Exam Question

  **Course:** PHL 430 / ECO 410 — Philosophy of Rational Choice
  **Assessment:** In-Class Final
  **Time:** 90 Minutes
  **Word Limit:** 1000 Words Maximum
  **Total Marks:** 25

  **Question 1**

  Standard revealed-preference theory defines an agent's utility function $u$ merely as a numerical representation of a preference ordering that satisfies consistency axioms (e.g., GARP). On this view, utility is ordinal, unique only up to monotone transformation, and makes no claim about inner experience. However, welfare economics frequently treats utility as cardinal and interpersonally comparable (e.g., in cost-benefit analysis or Kaldor-Hicks efficiency).

  Critique the claim that revealed-preference utility can bear the normative weight required by welfare economics. In your answer, you must address the following two scenarios:

  1.  **The Denomination Problem:** Suppose neuroscientists identify a real-valued quantity $N$ (readable via brain scan) such that every observed choice maximizes expected $N$. $N$ is cardinal and interpersonally identical. Does the existence of $N$ solve the welfare problem? Specifically, what distinguishes $N$ as a measure of *welfare* rather than merely *salience* or *arousal*, and can this distinction be derived from choice data alone?
  2.  **The As-If Agent:** Suppose an agent's choices satisfy GARP perfectly, implying a utility function $u$, but the causal mechanism is a heuristic: "always pick the option nearest the top-left of the menu." Is $u$ merely curve-fitting? What role must counterfactual stability (choices over novel goods or budgets) play in determining whether $u$ represents a genuine structural feature of the agent relevant to welfare?

  Conclude with a definitive verdict: Can the revealed-preference program, even augmented by neural data or counterfactual testing, ground welfare judgments without importing extra-economic ethical assumptions?

  ***

  ### Model Answer

  The revealed-preference (RP) program is often defended against charges of vacuity by noting that it imposes strict falsifiable constraints on data. Satisfying the Generalized Axiom of Revealed Preference (GARP) is not trivial; it rules out money-pump cycles and intransitive choices. Thus, RP utility is not mere bookkeeping; it describes a structural constraint on behavior. However, satisfying this constraint is necessary but not sufficient for welfare relevance. The gap between "consistent choice" and "well-being" cannot be closed by formal properties alone, nor by the two proposed wrinkles.

  Regarding the Denomination Problem: The discovery of a neural quantity $N$ that perfectly predicts choice converts utility from ordinal to cardinal and interpersonally comparable. Technically, this solves the measurement problem. Normatively, it solves nothing. The identification of $N$ as *welfare* rather than *arousal* requires a bridge principle that choice data cannot supply. If an addict consistently chooses heroin, their choices maximize $N$. If $N$ tracks dopamine spikes, it measures salience or reinforcement, not necessarily welfare. To claim $N$ is welfare is to assert that satisfying the revealed preference is *good* for the agent. This is an ethical claim, not an empirical one. Without an independent theory of the good (e.g., hedonism, objective list), $N$ is merely a physiological description of the choice mechanism. RP theory assumes preference satisfaction is the good; finding the neural substrate of preference satisfaction does not justify that assumption. It merely locates the engine of the trolley; it does not tell us if the track leads to a desirable destination.

  Regarding the As-If Agent: If choices are generated by a "top-left" heuristic that happens to satisfy GARP, the utility function $u$ is instrumentally useful for prediction but ontologically empty. For $u$ to represent a genuine feature of the agent relevant to welfare, it must exhibit counterfactual stability. If the menu changes (e.g., new goods, different spatial arrangements), does the agent continue to maximize $u$, or does the heuristic fail? If the heuristic fails when the spatial arrangement changes but the budget set remains identical, then $u$ was never the object of pursuit. However, even if $u$ is stable across counterfactuals, this only proves the agent is consistently pursuing *something*. It does not prove that the pursuit of $u$ constitutes their welfare. A slave might consistently choose the option minimizing punishment (maximizing $u$), but we would not say the slave's welfare is defined by the efficiency of their avoidance strategy.

  The core error in attempting to ground welfare in RP is the conflation of *rationality* (consistency) with *well-being* (value). RP theory successfully defines rationality as coherence in choice. It fails to define well-being because coherence is a formal property, while well-being is a substantive one. Adding neural data ($N$) provides substance but not normative valence. Adding counterfactual testing provides structural realism but not normative valence.

  **Verdict:** The revealed-preference program cannot ground welfare judgments without importing extra-economic ethical assumptions. Utility, even when cardinalized by neural data or stabilized by counterfactuals, remains a measure of *motivational strength*, not *prudential value*. Welfare economics requires a theory of why satisfying these specific preferences matters. RP theory can tell us if an agent is efficient at getting what they want; it cannot tell us if they should want it. Therefore, using RP utility for policy compensation tests is category error: it treats a description of motivational mechanics as a metric of human good.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. The Non-Vacuity of RP (4 Marks)**
  *   **Requirement:** Acknowledge that RP/GARP is not tautological; it imposes falsifiable constraints on choice data (no money pumps).
  *   **Common Error:** Claiming RP is "just a definition" or "always true by construction" (ignoring GARP tests).
  *   **Note:** Students must show they understand the technical strength before critiquing the normative weakness.

  **2. The Normative Gap (5 Marks)**
  *   **Requirement:** Explicitly distinguish between *consistency* (rationality) and *value* (welfare). Argue that satisfying axioms does not make an outcome "good."
  *   **Common Error:** Conflating "rational choice" with "good choice" or assuming consistency implies well-being.
  *   **Note:** This is the core philosophical pivot. B students describe the gap; A students explain *why* it exists (formal vs. substantive).

  **3. Addressing Wrinkle 1 (Neural $N$) (5 Marks)**
  *   **Requirement:** Argue that correlation with choice does not establish normative status. $N$ could be arousal/addiction. Needs an external ethical bridge.
  *   **Common Error:** Assuming cardinality/interpersonal comparability automatically solves the welfare problem.
  *   **Note:** Must identify that "is" (neural firing) does not imply "ought" (welfare).

  **4. Addressing Wrinkle 2 (As-If/Counterfactuals) (5 Marks)**
  *   **Requirement:** Identify that counterfactual stability distinguishes real structure from curve-fitting, but concede this still doesn't solve the *normative* problem.
  *   **Common Error:** Thinking that if $u$ is "real" (causal), it is automatically normative.
  *   **Note:** Must separate ontological realism (is $u$ real?) from normative realism (is $u$ good?).

  **5. The Verdict & Synthesis (6 Marks)**
  *   **Requirement:** Take a definitive stance (Yes/No). Defend the claim that extra-economic ethical assumptions are necessary.
  *   **Common Error:** Hedging ("There are two sides..."), or concluding that neuroscience solves the philosophical problem.
  *   **Note:** **The A/B Separator:** A B-student correctly analyzes the wrinkles. An A-student synthesizes them to show that *neither* technical fix addresses the fundamental category error of equating preference strength with welfare.

  ***

  ### Note to the Journalist

  You asked me to flag which parts of your framing are standard doctrine and which are your own coinage or contested. Here is the breakdown:

  **1. The Core Tension (Standard Doctrine):**
  Your main premise—that economists slide between "utility is just choice" (ordinal/RP) and "utility is a measurable good" (cardinal/welfare)—is the central critique of the field. This is bog-standard philosophy of economics. Hausman (1992), Sen (1977), and Little (1957) all make versions of this point. You are on solid ground here; this is the consensus view among philosophers, even if many economists dismiss it.

  **2. Wrinkle 1: The Denomination Problem (Your Coinage / Neuro-Economics Variation):**
  The specific framing of a brain-scan variable $N$ is your own, but the philosophical problem is a re-run of the **"Experience Machine"** (Nozick) and the **"Misguided Want"** problem (Griffin/Parfit). The question "Is preference satisfaction *good*?" is the oldest objection to utilitarianism. The neuro-economic twist (using $N$ to solve interpersonal comparison) is currently contested in the literature (e.g., Daniel Ng vs. Daniel Kahneman). Some neuro-economists *do* claim $N$ solves the welfare problem; philosophers generally say it just moves the goalposts. Your intuition that it "relocates" rather than "dissolves" the problem is philosophically robust.

  **3. Wrinkle 2: The As-If Agent (Standard Debate / Your Specific Test):**
  The "as-if" debate is standard (Milton Friedman vs. Realists). However, your specific focus on **counterfactual stability over novel goods** as the test for "realness" is a sharp, contemporary refinement. Standard textbooks often stop at "prediction works." Philosophers of science (like Uskali Mäki) argue for "structural realism." Your intuition that counterfactuals matter is correct, but your hunch that this *still* doesn't solve the welfare problem is the critical insight. Most students (and economists) think if $u$ is "real," it matters for welfare. You are correctly identifying that ontological reality $\neq$ normative value.

  **Verdict on Your Framing:**
  Nothing you wrote is confused. You have effectively reconstructed the **"Formalism vs. Substantivism"** debate using fresh examples. The "Denomination Problem" is a very clear way to explain the Is/Ought gap to a lay audience. You are not printing a hobbyhorse; you are printing the central unresolved tension of welfare economics.
