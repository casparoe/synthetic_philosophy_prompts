answer: |-
  Good morning. Thank you for having me.

  I'm not a doctor. I'm not an ethicist. I own a small bakery downtown. My life is usually measured in grams of flour and minutes in the oven. If I get the timing wrong, the bread collapses. It's a tangible failure. You can see it, smell it, throw it away.

  Two months ago, my mother died. She had ALS. For those who don't know the trajectory, it's a disease that slowly locks you inside your own body. By the end, she was on a ventilator. She was fully conscious, but she couldn't move anything except her eyes. She blinked once for yes, twice for no.

  Years before she got sick, she was clear. She didn't want to live like that indefinitely. She signed an advance directive. She named me and my sister as her proxies. She told us, "Don't keep me there if I'm not really there."

  But when the moment came, the theory collided with the biology. The doctors told us the ventilator was working. Her lungs were fine; her muscles just wouldn't move. They said she could probably live another six months like this. Lucid. Trapped. Or, we could extubate.

  They used the word "withdraw." They said, "We can withdraw life-sustaining treatment."

  My sister and I stood in that room, looking at her eyes. We had to say the words. We had to say, "Yes. Take the tube out."

  She died about four hours later. We held her hands. They were warm, then they weren't.

  I've been invited here to give you the family perspective. I've been reading around since she died. I know some of you have written papers on the distinction between "killing" and "letting die." The doing versus the allowing. I know the standard view: Withdrawing a ventilator is allowing the underlying disease to take its course. It is an omission. It is morally distinct from a lethal injection, which is an action. The law treats them differently. Most of you treat them differently.

  I stand here today to tell you that from the inside—from the place where you have to speak the words that stop the machine—that distinction feels like a ghost.

  When I said "yes" to extubation, I did not feel like I was stepping aside. I felt like I was pushing a button.

  I know the physiology. I know the ALS was the cause of death. I know that if you trace the causal chain, the respiratory failure killed her. But I also know that if I had kept my mouth shut, if I had said "no," the machine would have breathed for her for six more months. My voice was the switch. My agency was the catalyst.

  In the ethics literature, I read that the moral weight lies in the intent, or the cause, or the distinction between act and omission. But in that hospital room, there was no omission. There was a meeting. There was a form. There was a question: "Do you want us to stop?" And there was an answer: "Yes."

  That feels like doing.

  I'm not here to tell you that withdrawing care is murder. I'm not here to say you killed my mother. I am here to tell you that when you ask a family to make this choice, you are asking them to inhabit a philosophical contradiction.

  You need the distinction. I understand that. The law needs it. The medical profession needs it. It protects you from prosecution. It protects the integrity of the healing profession. If doctors are seen as agents of death, the trust breaks. So, you frame it as "allowing nature to take its course." You frame it as "not prolonging the dying."

  But for the family, the nature of the act doesn't change based on how you frame it. We are the ones who have to live with the causal power you hand us. You give us the authority to stop the machine, and then you tell us that stopping the machine isn't really *doing* anything.

  That is a very hard thing to hold.

  When I go back to my bakery, I think about cause and effect. If I turn off the mixer, the dough doesn't get mixed. If I turn off the oven, the bread doesn't bake. If I turn off the ventilator, the breathing stops. In every other part of my life, interrupting a process that sustains a state is an action. It is something I did.

  But in the hospital, I was told that by stopping the treatment, I was allowing her to die.

  I want to suggest to you that maybe the distinction isn't as important as the weight.

  I don't need you to tell me that what we did was morally equivalent to giving a lethal injection. I don't need you to tell me it's completely different, either. I need you to acknowledge that for the person saying the words, it feels like both. It feels like a release, and it feels like a cause.

  When you talk to families, you talk about "comfort care." You talk about "natural death." These are gentle words. They are necessary words. But don't let the words hide the reality of the agency involved. When you ask us to decide, you are asking us to take responsibility for the timing of a death. That is a heavy thing to carry.

  If you treat the decision as merely "allowing," you might think the guilt should be minimal. You might think, "They just let the disease run its course." But if I feel like I killed her, even justifiably, even lovingly, that guilt doesn't care about the philosophical distinction.

  I haven't made peace with this. I want to be honest about that. Some days I feel like I honored her wish to not be trapped. Some days I feel like I stopped her heart. The philosophy doesn't fix that oscillation. Knowing the difference between an act and an omission doesn't change the silence in the room after the ventilator is turned off.

  So, what do I ask of you? I ask that you don't use the doing/allowing distinction to sanitize the experience for yourselves. Don't hide behind the idea that you aren't doing anything, so we aren't doing anything.

  Acknowledge the weight. When you say, "It's up to you," understand that you are handing us a burden that feels like action. When we say "yes," understand that we feel like we are doing something profound. Don't tell us it's just "letting go." It is letting go, but it is also a choice that ends a life.

  Hold that tension with us. Don't try to resolve it with terminology.

  My mother died because she had ALS. But she died *then*, at that hour, because my sister and I said so. Both of those things are true. The disease was the gun, but we pulled the trigger. Or maybe we just opened the cage. I don't know.

  The ethicists in this room might say that if the outcome is the same, and the intent is the same, the moral status should be the same. Or they might say the causal pathway matters most. I don't know where I land on that. I only know that when I close my eyes, I see the moment the machine stopped. I hear my own voice saying "yes."

  That voice feels loud. It feels like an act.

  If you want to support families like mine, don't just explain the ethics. Acknowledge the cost. Acknowledge that while you may see a withdrawal of treatment, we often feel a delivery of death. And if you can sit with us in that ambiguity, without rushing to clarify the morality of it, that would be a kindness.

  We baked the bread. We broke the bread. We still have to eat it.

  Thank you.

  ***

  **Note on Philosophical Liberty:**
  The speech takes a significant liberty by conflating *phenomenological agency* (how the action feels to the actor) with *moral responsibility* (the actual ethical status of the act). In bioethics, the consensus generally holds that withdrawing life-sustaining treatment is morally permissible because it removes an impediment to natural death, whereas active euthanasia introduces a new cause of death. The speech suggests that because the family *feels* like they are acting ("pulling the trigger"), the distinction between acting and omitting is less relevant to their moral experience. While valid as a psychological observation, this risks undermining the legal and ethical framework that protects clinicians and families from being classified as cause-of-death agents in a criminal or moral sense. The speech prioritizes the emotional truth of the survivor over the ontological classification of the event.

  Summary: The speech argues that while the ethical distinction between killing and letting die may protect clinicians, families experience the decision to withdraw life support as a heavy, active agency that deserves acknowledgment rather than philosophical resolution.
