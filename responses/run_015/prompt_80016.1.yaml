answer: |-
  Dear friend, it is completely understandable that you felt the conversation ended prematurely, because your intuition is correct that the phrase respecting the separateness of persons is often wielded as a rhetorical shield rather than a precise argument. The phrase originates primarily from John Rawls, who used it to critique utilitarianism for treating society as if it were a single super-person, but in casual philosophical discourse it tends to collapse several distinct claims into one vague objection. To understand what work the phrase is actually doing, we need to disentangle the spectrum of claims it might be making, ranging from trivial truths that utilitarians accept to radical metaphysical assertions that would indeed dismantle utilitarianism but are much harder to defend.

  At the most trivial end of the spectrum, the claim is simply that individuals are physically distinct entities and that pain is felt in individual minds rather than in a collective cloud. On this reading, the separateness of persons is merely the observation that if I break my leg, you do not feel the pain, and there is no literal container called society that experiences welfare. This is a platitude that no sensible utilitarian denies. Classical utilitarians like Bentham explicitly stated that each person counts for one and none for more than one, acknowledging that welfare is located in individuals. They propose summing these distinct experiences only for the purpose of moral calculation, not because they believe the experiences literally merge. If your friend meant only this, she would be stating a truth that utilitarianism already incorporates, so this reading cannot be what shuts down the debate.

  Moving slightly deeper, there is a methodological claim that because persons are distinct, we cannot compare or aggregate their welfare at all. This suggests that welfare is not fungible across persons, meaning a gain in happiness for one person cannot mathematically offset a loss in suffering for another. If this claim were true, it would indeed falsify utilitarianism, which relies on the ability to weigh losses against gains across different people. However, this reading is highly problematic because it makes almost all cooperative social action inexplicable. If we cannot offset burdens and benefits across persons, then taxing the rich to help the poor, or even asking someone to wait their turn in line, becomes morally unintelligible because the person waiting suffers a loss that cannot be balanced by the gain to those who go first. Most philosophers, including many critics of utilitarianism, find this strong non-fungibility view too radical to accept, as it leads to a form of moral paralysis where no trade-offs are ever permitted.

  The most substantive and defensible reading, and the one that is most likely doing the work in the organ-harvesting case, is a deontological claim about rights and constraints rather than metaphysics or aggregation. On this view, the separateness of persons means that each individual possesses a moral sovereignty or inviolability that prevents them from being used merely as a means to an end, even a very good end. This is not about whether welfare can be summed, but about whether individuals have side-constraints that protect them from being sacrificed. This reading distinguishes between the trolley case and the organ case in a way that mere aggregation does not. In the trolley case, many who respect separateness still allow diverting the track because the five are already threatened and you are redirecting an existing threat rather than initiating a new attack on an innocent bystander. In the organ case, however, the healthy stranger is not under threat until you create one, and you are actively violating their bodily integrity to use them as a tool for others. Here, the separateness objection bites because it asserts that the five patients have no claim on the one stranger's body, regardless of the welfare sums.

  This brings us to which reading supports dismissing utilitarianism in the organ-harvesting case. It is specifically this deontological reading involving inviolable rights or side-constraints that renders the utilitarian calculation impermissible. Utilitarianism says the loss of one life is outweighed by the gain of five, but the separateness objection in this strong sense says that the one person is not a resource to be mined. It claims that morality is not just about maximizing the good but about respecting the boundaries between agents. This is a substantive moral claim, not a logical truth, and it requires defense. It is defensible in the sense that it aligns with deep intuitions about justice and rights, but it is not self-evident in the way a platitude is. It represents a competing foundational theory of morality, typically associated with Kantianism or Rawlsian liberalism, rather than a simple observation about human distinctness.

  Regarding your friend's use of the phrase to end the conversation, she was most plausibly invoking this strong deontological reading but presenting it as if it were the trivial reading. By saying the phrase as if it settles the matter, she treated a contentious moral premise about rights and constraints as if it were an obvious fact about human distinctness that utilitarianism ignorantly overlooks. This is a common rhetorical move in ethics because it frames the disagreement as a failure of the utilitarian to see obvious reality, rather than a genuine clash between two different moral frameworks. She was effectively asserting that the boundaries between persons are moral barriers that cannot be crossed, not just physical ones, and she assumed this premise was shared ground when it is actually the core point of contention.

  In summary, the phrase ranges from a harmless platitude about physical distinctness that utilitarians accept, to a radical claim about non-fungibility that almost no one accepts, to a substantive deontological claim about rights that genuinely opposes utilitarianism. The version that kills utilitarianism in the organ case is the rights-based constraint, which holds that individuals are ends in themselves and cannot be sacrificed for the aggregate good. Your friend likely meant this, but by using the phrase as a conversation stopper, she obscured the fact that she was asserting a controversial moral principle rather than stating an obvious fact. To continue the conversation, you would need to ask whether she believes we can never trade off welfare across persons, or whether she believes there are specific rights that protect persons from being used, as the former leads to absurdity while the latter requires a defense of why those rights exist and why they override the saving of five lives.
