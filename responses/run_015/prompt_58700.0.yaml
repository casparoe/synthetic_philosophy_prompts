  1. Direct Answer
  No single, established term today perfectly captures this configuration of openly announced, non-argumentative influence. While related concepts exist in ethics and psychology, none isolate the combination of transparency and emotional pressure you describe. Philosophers often classify manipulation as inherently deceptive, meaning your cases technically fall outside standard definitions because the method is disclosed. Conversely, this is not rational persuasion because it bypasses reason. You are describing a hybrid zone where consent is preserved but cognitive autonomy is sidestepped through acknowledged pressure. I must state plainly: no standard label exists, though the phenomenon is very recognizable in rhetoric and current ethics.

  2. Closest Existing Ideas
  The nearest concept is **manipulation**, traditionally defined as influencing someone without their awareness or against their best interests. Standard ethical accounts, like those by Robert Noggle in the literature, require concealment of the manipulator's intent. Your cases differ because the intent is explicit; the target knows the game being played. This transparency removes the deception element central to most philosophical definitions of manipulation, yet the psychological mechanism remains non-rational. It is influence without lies. Another candidate is **coercion**, which involves forcing compliance through threats that remove acceptable alternatives. This differs from your scenario because your students and donors retain the genuine ability to walk away or say no without severe penalty; the pressure is social or emotional, not structural in practice. Coercion makes the right choice impossible; your method makes the wrong choice uncomfortable. It relies on friction, not force. Finally, consider **rational persuasion**. This relies on providing reasons that the target accepts as valid grounds for belief or action for the donor. Your method explicitly bypasses this by admitting reasons aren't working, opting instead for fatigue or guilt. While **nudging** alters choice architecture, it is usually quite subtle. A nudge hides the mechanism in the environment; your method highlights the mechanism in the relationship in the donor. Each concept captures a fragment—pressure, influence, non-rationality—but significantly fails to account for the crucial element of advance disclosure that preserves formal consent while bypassing rational deliberation. You are describing influence that respects autonomy procedurally while challenging it very psychologically overall.

  3. Mapping My Cases
  Your two cases belong together conceptually but differ significantly in power dynamics, which affects their ethical weight. Both fit the pattern of declared non-rational pressure: you announce the tactic, and the target retains theoretical exit rights. In the classroom, you leverage pedagogical authority. While students can mentally disengage, the institutional setting makes opting out socially costly. The disclosure mitigates this, transforming potential manipulation into a consensual teaching tool, provided the educational goal justifies the emotional toll. The fundraising case relies on peer-level social friction. The volunteer admits the interaction is designed to become uncomfortable. Here, the opt-out is clearer; a donor can close the door. However, the social norm of politeness makes that exit psychologically difficult. Both cases fall on the side of "transparent pressure" rather than trickery because the mechanism is not hidden. However, they sit closer to coercion than persuasion because the compliance mechanism is discomfort rather than agreement. The classroom example is riskier because the power imbalance makes the "choice" to endure the pressure less voluntary than the donor's choice. If the students cannot ignore the repetition without academic penalty, the disclosure does not neutralize the coercive element. Thus, while both are the same phenomenon, the fundraising example is a cleaner instance of the pattern, whereas the classroom example risks sliding into abuse of authority if the pressure impedes genuine learning autonomy. The key boundary is whether the target can ignore the pressure without consequence. In fundraising, ignoring it ends the interaction. In class, ignoring teacher is rarely consequence-free.

  4. Naming Proposal and Edge Cases
  I propose the term **"Declared Pressure."** It defines influence bypassing rational deliberation through emotional or social means, where the method is stated and formal exit is allowed. It distinguishes itself from manipulation by lacking deception and from coercion by lacking threats. Test against a weaker edge case: A friend says, "I will remind you repeatedly to exercise because you forget." This fits the definition but lacks the "uncomfortable" element; it is merely persistent. It remains Declared Pressure but is ethically benign because the social cost of ignoring it is low. Test a stronger edge case: A salesperson says, "I will not leave this doorway until you sign." Here, disclosure is present but the opt-out is physically blocked. This crosses into coercion because the exit right is nullified. Declared Pressure exists only where the target can practically endure the discomfort or leave. Your classroom case sits mid-range: students can tune out, but authority makes it costly. Fundraising is central: donors can close the door, but social norms make it awkward. The term holds where the pressure is very real but the exit remains physically and formally open, relying on psychological friction rather than structural barriers for compliance. It captures ethics of knowing you are being pushed yet choosing to stay.
