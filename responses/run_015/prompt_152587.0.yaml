      *   **Task:**
          1.  Restate Hofstadter's tri-level architecture using PP vocabulary (Frame $\rightarrow$ Hyperprior/Structure, Outer $\rightarrow$ Top-down signal/Context, Inner $\rightarrow$ Sensory Prediction Error/Content).
