      *   *Context:* Usually discussed regarding DNA, records, or inscriptions.
      *   *Frame Message:* The mechanism or rules required to read the message. It defines *how* to interpret. It is often invisible to the receiver until the mechanism is understood. It sets the ontology.
      *   *Outer Message:* The trigger or context that tells the receiver *which* frame to use. It activates the decoding mechanism.
      *   *Inner Message:* The actual semantic content once decoded.
      *   *Key Insight:* Meaning is not in the ink/sound but in the interaction between the signal and the decoding machinery. The "Frame" is often treated as fixed or pre-existing machinery, not part of the message itself.

  3.  **Map to Predictive Processing (PP):**
      *   *PP Basics:* Brain minimizes variational free energy. Hierarchy of generative models. Top-down predictions, bottom-up prediction errors (PE). Precision weighting modulates the gain on PE.
      *   *Mapping:*
          *   **Frame Message $\rightarrow$ Hyperpriors / Model Structure:** These define the causal structure of the world (the graph topology) and the expected precision profiles (confidence in sensations vs. predictions). They are the "rules of the game."
          *   **Outer Message $\rightarrow$ Contextual Priors / Attentional Modulation:** Signals that select *which* generative model is currently active. It adjusts the precision weights to allow specific high-level hypotheses to drive perception.
          *   **Inner Message $\rightarrow$ Prediction Error (explained away):** The sensory data that is successfully predicted by the active model. The "content" is the residual state of the world once the model has accounted for the causes.

  4.  **Analyze the "Residue" (Translation Fidelity):**
      *   *What translates cleanly?* The hierarchy. The idea that lower levels depend on higher-level constraints. Precision weighting maps well to "attention" or "rule activation."
      *   *What requires distortion?* Hofstadter's Frame is often *outside* the message system (e.g., the physics of the record player). In PP, *everything* is inside the model (the Markov blanket). A hyperprior is still a probability distribution, subject to update. Hofstadter's Frame is often logical/structural necessity; PP's Hyperprior is statistical expectation.
      *   *What has no expression?* The "Fixedness." Hofstadter implies a frame is a rule *for* interpretation, not something interpreted. PP implies everything is inferred. This leads to the "Execution vs. Interpretation" problem.

  5.  **Address the Specific Focus: Execution vs. Interpretation:**
      *   *Hofstadter:* A frame is executed (like a CPU instruction set). It is the ground upon which meaning stands.
      *   *PP:* A hyperprior is interpreted (inferred). It is a belief about beliefs.
      *   *Conflict:* If the Frame is a hyperprior, it can be updated by PE. If it updates, is it still a Frame?
