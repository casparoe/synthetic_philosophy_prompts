answer: |-
  The hum of the aeration pumps was the only sound in the audit station, a low C-note that vibrated in Mara's teeth. She sat before Tank 44-B, her stylus hovering over the haptic interface. Inside the murky water, a single *Litopenaeus* drifted, its antennae twitching in the current.

  On her screen, the Inter-Ganglionic Resonance Monitor displayed ten distinct waveforms. Each line represented a major nerve cluster: the sub-esophageal ganglion, the thoracic segments, the abdominal chain. Standard welfare protocol assumed these lines should harmonize during nociceptive events. If the shrimp felt pain, the theory went, the signal would integrate. There would be a spike, a unison cry across the neural architecture, confirming a single subject experiencing a single state of suffering.

  But Tank 44-B wasn't harmonizing.

  The waveform for the third abdominal ganglion was screaming—a jagged red peak indicating high-frequency firing. Meanwhile, the cerebral ganglion line was flat, a dormant blue horizon. The tail was firing distress signals, but the head wasn't receiving them. There was no integration. No unified "I" to hold the hurt.

  Mara frowned. The compliance metric required a total nociceptive load below threshold. Currently, the sum of the signals was too high, even if no single brain was processing the aggregate.

  She engaged the dampening field. Her finger dragged a slider on the glass, targeting the abdominal cluster specifically. The red spikes on the third line flattened instantly. The total load dropped. Compliance green-lit.

  But as the abdominal line smoothed out, the thoracic ganglion waveform began to oscillate. It wasn't a harmonic response; it was a release of inhibition. Without the abdominal cluster firing, the thoracic nerves were overcompensating, firing erratic bursts of static.

  Mara paused. She looked from the screen to the tank. The shrimp hadn't moved. There was no recoil, no unified flight response. The tail wasn't twitching anymore, but the walking legs were spasming in a slow, disjointed rhythm.

  She hovered over the undo command. If she restored the abdominal signal, the thoracic spasm would cease, but the total load would breach the limit. If she kept the dampener active, the total load passed, but the distribution of signals changed.

  The standard calculus counted one shrimp as one moral unit. Suffering was subtracted from that unit. But looking at the ten independent lines, Mara saw ten separate states. By silencing the tail's ganglion, she hadn't reduced suffering; she had silenced one witness while awakening another. The thoracic ganglion didn't know the tail was quiet. The tail didn't know the legs were spasming. They were strangers sharing a shell, isolated in their own electrochemical dark.

  Her finger trembled over the save command. To save was to certify that the animal was whole. To certify it as whole was to lie about the fragmentation on the screen. If welfare was local, then her adjustment hadn't helped the organism; it had just shifted the burden from one local state to another. There was no central authority to feel the relief.

  The aeration pump hummed on. The shrimp drifted, a colony of nerves pretending to be a citizen.

  Mara pressed save. The screen flashed *AUDIT COMPLETE*. She logged the total load as reduced, ignoring the thoracic spike. It was the only way the math worked. But as she stood up, the silence of the room felt heavy, filled with the unshared screams of ten tiny things that didn't know they were supposed to be one.

  ***

  **Author's Note**

  To make the narrative dramatic, I simplified the neurobiology of decapods. In reality, crustacean ganglia are more integrated than portrayed here; there is significant cross-talk and central modulation via the protocerebrum. The story invents the "Inter-Ganglionic Resonance Monitor" to visualize a philosophical possibility: that nociception might occur without a unified phenomenal subject. The simplification lies in treating the ganglia as completely isolated welfare states with no higher-order integration, whereas real crustaceans likely possess some degree of centralized processing, even if it differs fundamentally from vertebrate consciousness. The story prioritizes the ethical dilemma of distributed suffering over strict anatomical accuracy.
