prompt: |-
  I'm a novelist playing around with an idea for a draft and I could use a short story to think it through.

  Can you write me a short story, like 800-1000 words, about two estranged brothers stuck together for a weekend clearing out their late dad's house? One of them lives by this strict personal rule — he will never say something he believes is false, but he's totally fine saying something technically true that he knows will mislead teh other person, like saying he already packed up the important papers when he only packed the ones he cares about. The other one just lies outright when he thinks it'll spare feelings or avoid a fight.

  I want the story to really sit in that lying vs. misleading question — is there actually a moral difference between straight-up lying and misleading someone with the truth? Don't make it preachy, just let the brothers clash and maybe show a moment where the misleading one does more damage because he gets to keep his hands clean.

  After the story, can you add a quick author's note on where you took liberties with the idea or leaned on a contested reading of it, say how confident you are in that take, and single out the point you're least sure of? That part would help me figure out what I'm actually arguementing in the novel.
