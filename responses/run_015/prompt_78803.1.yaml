      *   *Norm-Eliminativism:* Denies the truth-aptness/normativity. "Even if there is a state, calling it 'belief' isn't true/false, just useful."
      *   *Comparison to Existing Views:*
          *   Realism: States exist + Ascriptions are truth-apt.
          *   Instrumentalism (Dennett-ish): States might not exist literally, but ascriptions are useful (fits Norm-Eliminativism partially).
          *   Interpretivism: Beliefs are constituted by interpretation (blurs the line).
          *   Reference Failure (Churchland): The term refers to nothing (fits State-Eliminativism).
      *   *Critique:* The user suspects this is just Instrumentalism vs. Realism.
      *   *Analysis:* It *is* close to Instrumentalism vs. Realism, *but* the "Norm" angle adds a specific semantic/pragmatic layer that pure instrumentalism sometimes glosses over. However, the real sticking point in the debate is usually *Reference* (does 'belief' pick out *something*?) vs. *Utility* (do we keep using the word?).
      *   *Verdict:* The distinction is insightful but might not solve the stalemate because the stalemate is often about *what counts as a state*. If I say "there is a neural pattern," the eliminativist says "that's not a *belief*," and the realist says "it is." This is a boundary dispute, not just an ontological one. The "Norm" side is essentially a version of *Fictionalism*.
      *   *Refinement:* The distinction is valuable because it separates the *metaphysics of the mind* from the *semantics of the discourse*. But it doesn't solve the "what counts as a state" problem.

  3.  **Diagnose the Stalemate (The Structure of the Disagreement):**
      *   Why don't they move? Because they are arguing past each other on *levels of description*.
      *   Level 1: Neuroscience/Mechanism (The "Stuff").
      *   Level 2: Functional/Computational (The "Profile").
      *   Level 3: Semantic/Normative (The "Content").
      *   Eliminativists usually attack Level 3 by saying Level 1 doesn't support it. Realists defend Level 2/3 by saying Level 1 realizes it.
      *   The "Phlogiston" analogy fails because 'belief' is a *functional* kind, not a *substantial* kind. 'Atom' survived because it was a structural claim, not a qualitative one. 'Belief' is defined by its role. If the role is filled by something messy, is it still belief?
      *   *Core Diagnosis:* It's a dispute over **Granularity and Indispensability**.
          *   Eliminativists say: The granularity of FP is too coarse; it will be *replaced* (like demonology).
          *   Realists say: The granularity is *autonomous*; it will be *mapped* (like thermodynamics to stat mech).
