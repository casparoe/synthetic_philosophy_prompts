      *   *Section 2: The Structure of the Stalemate.* It's not about existence; it's about *Reduction vs. Autonomy*. The Phlogiston analogy is the villain here. Belief is a functional kind, not a natural kind in the chemical sense. The fight is about whether functional kinds survive reduction.
