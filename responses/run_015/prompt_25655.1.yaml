answer: |-
  This is an exceptionally clear and philosophically sophisticated map of your moral intuitions. You are not confused; you are grappling with the central tension in modern political philosophy: the conflict between **Cosmopolitanism** (all humans have equal moral worth) and **Partialism** (we have special duties to those closer to us).

  Your intuitions are actually quite consistent if you stop treating "compatriot" as a single category and start distinguishing between different *types* of obligation.

  Here is a principle that captures most of your verdicts, an analysis of the one verdict you should scrutinize, and a suggestion for reframing the whole question.

  ### 1. The Unifying Principle: "Institutional Participation + Causal Complicity"

  Your intuitions seem to follow a hybrid model. You reject "blood and soil" nationalism, but you accept obligations that arise from **shared cooperative schemes** and **causal involvement.**

  Here is how your cases fit this principle:

  *   **The Pond (Proximity/Efficacy):** You save the near child not because of nationality, but because you are *causally positioned* to help. This is a humanitarian duty based on capacity, not identity.
  *   **The Dialysis (Institutional Participation):** You lean domestic here because this isn't a humanitarian emergency; it's a distribution of **common resources**. You and your compatriots pay into a specific cooperative scheme (the state). You feel a duty to prioritize the maintenance of that scheme, even if the "exchange rate" of lives is lower.
  *   **The Immigrant (Social Membership):** You prioritize the undocumented immigrant because they are a *de facto* participant in the cooperative scheme (taxes, work, community), whereas the expat citizen is not. **Contribution matters more than legal status.**
  *   **The War (Universal Justice):** You reject blind loyalty. Your duty to the "cooperative scheme" does not override universal moral truths. If the scheme violates human rights, your duty to humanity trumps your duty to the state.
  *   **The History (Causal Complicity):** You accept responsibility for colonialism not because of "national character," but because you are a **beneficiary** of that specific causal chain. This is a debt based on unjust enrichment, not shared identity.
  *   **The Friend (Associative Obligations):** You acknowledge special duties based on relationship, but they are **defeasible**. If the stranger's need is dire (homelessness) and the friend's is trivial (saving money), the universal need trumps the special obligation.

  **The Principle:** *We have universal duties to prevent catastrophic harm (Pond, War, Homeless Stranger). Within that constraint, we have special duties to those with whom we share reciprocal institutional arrangements (Dialysis) or causal histories (Colonialism), provided those relationships are based on actual participation rather than abstract legal status (Immigrant).*

  ### 2. The Verdict to Scrutinize: The Dialysis Case

  You should be most suspicious of your gut reaction to **Case 2 (Dialysis vs. Malaria).**

  **Why?** It is the only case that potentially contradicts Case 1 (The Pond).
  *   In Case 1, you say if distance were equal, you'd flip a coin. Nationality doesn't matter.
  *   In Case 2, distance/cost is equalized (same cost to you), yet you prioritize 100 locals over 1,000 foreigners.

  **The Tension:** If nationality doesn't matter in the "flip a coin" pond scenario, why does it matter in the budget scenario?
  *   **Defense of your intuition:** You might argue that the Dialysis money is *tax revenue*, which belongs specifically to the political community, whereas the Pond button is *your personal agency*. You are acting as a **citizen** in Case 2 and a **human** in Case 1.
  *   **The Challenge:** If you accept that 1,000 lives outweigh 100 lives universally, is the "political community" boundary just a morally arbitrary line? If the state is a tool for doing good, shouldn't it use its resources where they do the *most* good?

  **Test:** If the domestic program saved 100 lives, but the foreign program saved 100,000 lives, would you still fund the domestic one? If your answer flips at some point, your obligation to compatriots is **defeasible** (like the friend moving case). If you would *never* fund the foreign program regardless of the scale, you are holding a much stronger nationalist view than your other cases suggest.

  ### 3. Is Your Framing Confused?

  You are not confused, but you are using the word **"Compatriot"** to do three different jobs. To clear up the friction, try separating these three concepts:

  1.  **Co-Participants (The Political):** People who participate in your specific legal/economic system.
      *   *Relevant to:* Dialysis, Undocumented Immigrant.
      *   *Rule:* Participation > Legal Status.
  2.  **Co-Beneficiaries (The Historical):** People who benefited from the same unjust history.
      *   *Relevant to:* Colonialism/Slavery.
      *   *Rule:* Benefit creates obligation to repair.
  3.  **Co-Identifiers (The Symbolic):** People who share a flag, anthem, or ethnicity but no reciprocal relationship.
      *   *Relevant to:* The War, The Expat Citizen.
      *   *Rule:* You rightly reject this as a source of moral obligation.

  Your discomfort comes from trying to find a single rule for "Compatriots" when you actually respect **Co-Participants** and **Co-Beneficiaries**, but reject **Co-Identifiers**.

  ### 4. The Friend Analogy: Are Compatriots Like Friends?

  You asked: *Are special obligations to compatriots like [obligations to friends]?*

  **Your intuition:** "They don't feel the same way."
  **Analysis:** You are right. They are structurally similar but different in **voluntariness.**

  *   **Friendship:** Voluntary. You chose them. The obligation is deep but narrow.
  *   **Compatriotism:** Involuntary. You were born into it (usually). The obligation is shallow but broad.

  **Why they feel different:**
  You can quit a friendship if it becomes toxic. You cannot easily quit citizenship. Because the relationship is non-voluntary, the obligations must be lighter.
  *   *Friend:* I help you move even if it's inconvenient.
  *   *Compatriot:* I pay taxes to support you, but I don't have to invite you to dinner.

  **The Defeasibility Test:**
  In your Friend Case, you help the stranger if the stranger faces homelessness.
  Apply this to Compatriots: Do you support the domestic dialysis center if the foreign malaria prevention saves *enough* lives?
  *   If **Yes**: Then compatriot obligations are exactly like friend obligations (special, but overridden by extreme need).
  *   If **No**: Then compatriot obligations are stronger than friendship (which seems inconsistent with your universalist leanings in the Pond/War cases).

  ### Summary Recommendation

  Your moral framework is actually a version of **"Weak Cosmopolitanism with Institutional Partiality."**

  1.  **Keep** the distinction between Humanitarian Emergencies (Pond/War) and Political Distribution (Dialysis). That resolves the biggest conflict.
  2.  **Probe** the Dialysis case. Ask yourself if there is a number of foreign lives that *would* outweigh the domestic ones. If there is, your view is consistent. If there isn't, you have a bias you haven't justified.
  3.  **Drop** the idea that "Citizenship" creates the obligation. As you noted in the Immigrant case, **Participation** creates the obligation. This aligns your view on immigrants with your view on dialysis (shared system) and history (shared benefit).

  You aren't smuggling in bad assumptions; you are correctly identifying that morality is multi-layered. We are humans first, neighbors second, and citizens third. Your intuitions are just trying to figure out which layer is active in which case.
