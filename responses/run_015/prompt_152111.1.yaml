answer: |-
  # Decision Tree: The Normative Status of Past Investment

  **Instructions:** Begin at the **Baseline Commitment**. Proceed through the four **Branch Questions**. Each question describes a structural feature of a concrete case. Answer 'Yes' or 'No' based on whether that feature is present in the scenario you are evaluating. Follow the path to a **Leaf Node** to identify the normative position that corresponds to that combination of features.

  ### The Baseline Commitment
  *Everyone in this room agrees on the following:*
  In a stripped-down case where the past expenditure has **no causal bearing** on future payoffs, **no evidential bearing** on project quality, **no audience** to observe the decision, and **no further decisions** hanging on it, a rational chooser leaves the past cost out of the calculation.
  *(Example: You bought a £100 concert ticket, lost it, and can buy another for £100. No one knows. The experience is identical. You should not count the lost ticket as a cost of buying the new one.)*

  ---

  ### The Branch Questions
  *These questions isolate the variables that might justify departing from the Baseline.*

  **Q1. The Indicator:** In this specific scenario, does the fact that resources were already spent make it objectively more likely that finishing the project will yield a high return?
  *(Example: Does the fact that £40m was spent on the telescope mirror suggest the engineers have solved the hard problems, making the final £15m a safer bet than a new project?)*
  *   **Yes:** The past spend is evidence of quality/feasibility.
  *   **No:** The past spend tells you nothing about future success.

  **Q2. The Witness:** In this specific scenario, would abandoning the project cause relevant observers to downgrade their estimate of your competence or reliability?
  *(Example: If the university abandons the telescope, will donors trust them less with future grants?)*
  *   **Yes:** Quitting damages reputation/credibility.
  *   **No:** The decision is private or observers do not care.

  **Q3. The Substance:** In this specific scenario, is the value of the finished project partly constituted by the fact that *this specific group* invested *this specific history* of effort into it?
  *(Example: Is the String Quartet's value found in their 22-year shared history, such that replacing a member or stopping destroys the very good being produced?)*
  *   **Yes:** The history is part of the product.
  *   **No:** Only the final output matters; the history is merely a means.

  **Q4. The Authority:** In this specific scenario, should you treat your past self's commitment as a binding constraint on your present self, even if your present judgement prefers to quit?
  *(Example: You suspect your current desire to quit is a temporary weakness or a shift in taste, and you continue to honour the person who started the project.)*
  *   **Yes:** Past agency constrains present choice.
  *   **No:** Present judgement is sovereign.

  ---

  ### The Logical Space
  *There are 4 binary questions, admitting **16 logical combinations** (2⁴). Below, the occupied leaves (actual philosophical positions) are mapped to these combinations. Unoccupied spaces are noted thereafter.*

  | Q1 (Indicator) | Q2 (Witness) | Q3 (Substance) | Q4 (Authority) | Leaf Node (Position) |
  | :--- | :--- | :--- | :--- | :--- |
  | **No** | **No** | **No** | **No** | **1. The Strict Forward-Looker** |
  | **Yes** | **No** | **No** | **No** | **2. The Bayesian Updater** |
  | **No** | **Yes** | **No** | **No** | **3. The Reputational Strategist** |
  | **No** | **No** | **Yes** | **No** | **4. The Constitutivist** |
  | **No** | **No** | **No** | **Yes** | **5. The Diachronic Agent** |
  | **Yes** | **Yes** | **No** | **No** | *(6. Hybrid: Evidence + Reputation)* |
  | **Yes** | **No** | **Yes** | **No** | *(7. Hybrid: Evidence + Constitutive)* |
  | **No** | **Yes** | **Yes** | **No** | *(8. Hybrid: Reputation + Constitutive)* |
  | **No** | **No** | **No** | **No** | **9. The Hidden Variable Skeptic** |
  | *Other combinations* | | | | *(10-16. Mostly Unoccupied/Unstable)* |

  ---

  ### The Leaves (Descriptive Definitions)

  **1. The Strict Forward-Looker**
  *   **Path:** No / No / No / No
  *   **Definition:** Sunk costs are never normative reasons. If the case fits the Baseline Commitment (which this path asserts all genuine sunk cost cases do), continuing is irrational.
  *   **Standard Label:** *Orthodox Rational Choice.*
  *   **Case Fit:** The Anonymous Telescope.

  **2. The Bayesian Updater**
  *   **Path:** Yes / No / No / No
  *   **Definition:** It is not a fallacy to continue; the past spend is informative. Agents who continue are rationally inferring quality from the fact that the project survived to this stage.
  *   **Standard Label:** *Informational Account.*
  *   **Case Fit:** The Inherited Reactor (if the predecessor's spend signals hidden feasibility).

  **3. The Reputational Strategist**
  *   **Path:** No / Yes / No / No
  *   **Definition:** Continuing is rational because the cost of quitting (reputation loss) exceeds the cost of finishing. The 'sunk cost' is actually an investment in future credibility.
  *   **Standard Label:** *Signalling Account.*
  *   **Case Fit:** The Public Telescope (standard version).

  **4. The Constitutivist**
  *   **Path:** No / No / Yes / No
  *   **Definition:** The past investment is not a 'cost' but part of the 'benefit'. To abandon is to destroy a value (loyalty, shared history) that already exists and requires continuation to be realised.
  *   **Standard Label:** *Integrity/Identity Account.*
  *   **Case Fit:** The String Quartet.

  **5. The Diachronic Agent**
  *   **Path:** No / No / No / Yes
  *   **Definition:** Continuing is a device of self-government. You honour the past commitment to prevent your future self from succumbing to weakness or shifting tastes, or because your past self has authority over you.
  *   **Standard Label:** *Resolute Choice / Self-Binding.*
  *   **Case Fit:** The Deference Case (suspecting current judgement is worse).

  **6. The Hidden Variable Skeptic**
  *   **Path:** No / No / No / No (Normatively) / **Yes** (Empirically)
  *   **Definition:** The Strict View is normatively correct, but the experimental literature has never demonstrated a violation. In every real-world case where people continue, either Q1 (Evidence) or Q2 (Reputation) was secretly active, even if the experimenter claimed to hold them fixed.
  *   **Standard Label:** *Ecological Rationality / Skepticism.*
  *   **Case Fit:** Claims that *all* apparent fallacies are actually Leaf 2 or 3.

  ---

  ### Unoccupied and Unstable Combinations

  **The Incoherent Space (Q1=Yes, but "Fallacy" claimed)**
  *   **Combinations:** Any path where Q1 is **Yes**, but the agent claims they are committing a fallacy.
  *   **Status:** **Incoherent.** If the past spend provides evidence of future success (Q1=Yes), counting it is rational inference. One cannot consistently hold that sunk costs matter *because* they indicate quality, while simultaneously calling this a 'fallacy'.

  **The Unattractive Space (Q4=Yes, Q1=No, Q2=No)**
  *   **Combinations:** Q4=Yes (Authority), but Q1, Q2, Q3 are No.
  *   **Status:** **Unattractive / Rare.** This requires obeying a past self even when you have no reason to think they knew better (Q1=No), no one is watching (Q2=No), and the project has no special history (Q3=No). This looks less like 'self-government' and more like 'dogmatism'. It is rarely defended as a general principle, though it appears in specific discussions of resolution.

  **The Unexplored Space (Q3=Yes, Q4=Yes)**
  *   **Combinations:** Constitutive Value + Diachronic Authority.
  *   **Status:** **Unexplored.** This would argue that we must continue both because the history is valuable *and* because our past self commands it. While plausible, philosophical literature tends to treat these as distinct arguments (value of the thing vs. authority of the agent) rather than compounding them.

  ---

  ### Structural Analysis of the Tree

  **The Workhorse Question: Q1 (The Indicator)**
  This question does the most heavy lifting. The single most common defence of 'sunk cost' behaviour in economics is that it is actually **Leaf 2 (The Bayesian Updater)**. If you can convince a student that Q1 is 'Yes', the fallacy disappears. Most debates reduce to arguments over whether Q1 is truly 'No' in the experimental setups.

  **The Inert Question: Q4 (The Authority)**
  This question is nearly inert in standard economic contexts. It is difficult to isolate Q4 from Q1 (Did the past self know better?) or Q2 (Am I signalling reliability to my future self?). In the **Inherited Reactor** case, Q4 is automatically 'No' (it was not *my* past self), which helps separate it from Q1. However, in single-agent cases, students struggle to distinguish "I should listen to my past self" from "My past self probably knew something I don't" (Q1).

  **Indistinguishable Leaves:**
  **Leaf 3 (Reputational)** and **Leaf 5 (Diachronic)** are structurally identical if one views the "Audience" in Leaf 3 as including "One's Future Self". If reputation is just signalling to your future self that you are a resolute type, Leaf 3 collapses into Leaf 5. The tree keeps them separate only by distinguishing *social* observers from *temporal* selves.

  ---

  ### A Note on Where This Tree May Be Wrong

  **The Collapsing Branch:**
  I expect **Q3 (The Substance)** to collapse under pressure. It is difficult to maintain that the *history* of investment is valuable independently of the *outcome* (Q1) or the *commitment* (Q4). In the String Quartet case, is the history valuable because it produces a unique sound (which is a Q1/Quality claim), or because loyalty is good (which is a Q4/Deontology claim)? If Q3 reduces to Q1 or Q4, the Constitutivist leaf vanishes.

  **The Stretched Leaf:**
  **Leaf 9 (The Hidden Variable Skeptic)** is partly invented to accommodate the prompt's request, but it occupies an awkward logical space. It claims to be Leaf 1 (Strict) normatively, but Leaf 2 or 3 empirically. It is less a distinct position and more a methodological critique of the other leaves. Fitting it into the binary tree structure forces it into a 'No/No/No/No' box, which obscures its claim that the answers *should* be 'Yes'.

  **The Redraw Condition:**
  If empirical research demonstrated that agents continue projects even when **Q1, Q2, Q3, and Q4 are definitively No** (e.g., in a fully transparent, anonymous, single-shot lab experiment where feasibility is exogenous), the top split of this tree is wrong. It would imply that 'Pastness' itself has normative weight, independent of evidence, reputation, constitution, or agency. This would require a new top-level question: *"Does the mere fact of past occurrence generate a reason, irrespective of all consequences?"* Currently, the tree assumes the answer is 'No', which is the Baseline Commitment. If that baseline breaks, the tree must be redrawn from the root.
