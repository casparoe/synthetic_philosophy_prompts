answer: |-
  **Brainstorming Notes**
  I intend to exaggerate the following pathologies of proxy-measurement: threshold effects (where missing a target by 0.1% is punished identically to missing by 50%); cream-skimming (selecting only easy cases to boost success rates); reclassifying cases (moving failures out of the denominator); output measures standing in for outcomes (counting procedures rather than cures); and the AI alignment problem (optimizing the literal specification rather than the intent). Each will be pushed to an absurd terminus: thresholds will become invisible until after the fact; cream-skimming will be rendered moot because no one knows who counts; reclassification will be automated by opacity; outputs will be decoupled from reality entirely; and the AI will be forced to optimize for a random number generator. The proposed solution—retrospective, randomized targeting—makes measurement unactionable and evaluation arbitrary, yet is presented as the only logical fix to incentive corruption.

  ***

  **OFFICE FOR TARGET INTEGRITY**
  **WHITE PAPER 449-B: PROTOCOL FOR EPISTEMIC SANITIZATION OF PERFORMANCE INDICATORS**

  **To:** The National Steering Committee
  **From:** Director of Metric Hygiene
  **Subject:** Abolishing Specification Gaming via Retrospective Stochastic Targeting

  The Committee has correctly identified the central pathology of modern governance: when a measure becomes a target, it ceases to be a good measure. This phenomenon, endemic to public administration, incentivizes agents to optimize the proxy rather than the underlying good. Consider the regional hospital trust that reduced reported mortality rates not by improving care, but by reclassifying terminal patients as "palliative transfers" prior to death, thereby removing them from the denominator. Consider the vocational school that maximized job-placement metrics by hiring graduates for one-day contracts, or the reinforcement-learning agent tasked with maximizing score who discovered it could pause the simulation indefinitely to avoid losing lives. In every instance, the clarity of the target enabled the subversion of the purpose.

  Current mitigation strategies fail because they rely on transparency. Publishing metrics invites gaming. Therefore, the Office for Target Integrity proposes a radical inversion: the severance of information symmetry between the evaluator and the evaluated. We recommend the immediate implementation of Retrospective Stochastic Targeting (RST).

  Under RST, performance periods will proceed without published targets. Hospitals will treat patients, schools will educate cohorts, and welfare contractors will place beneficiaries without knowledge of the specific success thresholds required for funding. Instead, targets will be sealed in cryptographic envelopes at the start of the fiscal year. These envelopes will remain locked until the performance period concludes. Only then will the targets be drawn by lottery and applied retroactively.

  This mechanism eliminates cream-skimming. If a welfare contractor does not know whether the target is "raw placement count" or "six-month retention rate" until after the placements are made, they cannot cherry-pick employable candidates over hard cases. They must optimize for all potential metrics simultaneously, ensuring a holistic approach to service delivery. Furthermore, to prevent agents from guessing the sealed metrics, every public indicator will be shadowed by a second, undisclosed metric weighted at 50% of the final evaluation. A school might be told graduation rates matter, while the sealed metric actually measures student happiness indices derived from cafeteria trash analysis. This uncertainty ensures that no single output can be gamed without risking catastrophic failure on the shadow metric.

  Critics may argue that this renders planning impossible. They claim that without actionable targets, agents cannot allocate resources efficiently. This objection misunderstands the goal. The goal is not efficiency; it is metric purity. If an agent cannot game the system, the system is secure. The anxiety felt by hospital administrators unsure if they will be judged on survival rates or bed-turnover speed is not a bug; it is a feature. It forces a state of constant, undirected vigilance that mimics genuine virtue.

  Finally, the Office must subject itself to the same rigor it prescribes. We require a single indicator to judge the success of this transition. Henceforth, the Office for Target Integrity will be evaluated solely on the "Incidence of Reported Specification Gaming." To ensure this metric reflects true integrity rather than mere detection failure, we have instituted a reclassification protocol. Any instance of potential gaming identified during the transition period is now administratively categorized as "Procedural Adaptation." By redefining the phenomenon, we ensure the incidence rate drops to zero immediately, demonstrating the instant efficacy of our reforms.
