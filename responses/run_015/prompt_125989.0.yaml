answer: |-
  ### Part 1: The Logical Space

  Before handing out the tree, you need to know the terrain. The debate over the Liar isn't a line; it's a multi-dimensional grid of commitments. Most positions cluster in specific "viable zones," leaving large swathes of the logical space empty.

  **The Five Axes of Disagreement**
  1.  **Truth-Aptness:** Is the Liar a genuine proposition? (Yes/No)
  2.  **Consistency:** Can a sentence be True and Not-True? (Yes/No)
  3.  **Bivalence:** Must every proposition be True or False? (Yes/No)
  4.  **Stratification:** Is truth hierarchical (levels) or flat (single predicate)? (Hierarchy/Flat)
  5.  **Stability:** Does the truth value settle? (Fixed/Unstable/Context-Shifting)

  **Viable Clusters (The Real Positions)**
  *   **The Hierarchical Cluster:** Truth-Apt + Consistent + Bivalent + Hierarchy. (Tarski)
  *   **The Gap Cluster:** Truth-Apt + Consistent + Non-Bivalent + Flat + Fixed. (Kripke, Supervaluation)
  *   **The Glut Cluster:** Truth-Apt + Inconsistent + Non-Bivalent + Flat + Fixed. (Dialetheism)
  *   **The Shift Cluster:** Truth-Apt + Consistent + Bivalent + Flat + Context-Shifting. (Contextualism)
  *   **The Oscillation Cluster:** Truth-Apt + Consistent + Bivalent + Flat + Unstable. (Revision Theory)
  *   **The Dissolution Cluster:** Not Truth-Apt. (Deflationism/Error Theory)
  *   **The Substructural Cluster:** Truth-Apt + Consistent + Bivalent + Flat + Fixed + Logic Change. (Non-Reflexive)

  **Empty Cells (Where Nobody Lives)**
  *   **Hierarchy + Context-Shifting:** *Why:* Redundant. If you have levels to block paradox, you don't need context shifts to do the same work. (Merely unattractive).
  *   **Gap + Glut:** *Why:* Incoherent. A sentence cannot simultaneously lack a truth value and possess both truth values in the same respect. (Incoherent).
  *   **Tarskian Hierarchy + Semantic Closure:** *Why:* Incoherent. Tarski's definition of truth *requires* the metalanguage to be richer than the object language. (Incoherent).
  *   **Revision Theory + Fixed Point:** *Why:* Incoherent. Revision theory is defined by the *lack* of a fixed point for pathological sentences. (Incoherent).

  **Indistinguishable Leaves (Warning Labels)**
  *   **Kripke vs. Supervaluation:** On the Liar sentence alone, these look identical (both say "no classical value"). They only separate on **validity** (Supervaluation preserves classical tautologies; Kripke does not).
  *   **Contextualist vs. Revision:** Both allow you to assert "The Liar is true" in some situations. They separate on **stability** (Contextualist: it's true *here*; Revision: it's true *now* but will flip).

  ***

  ### Part 2: The Decision Tree

  Hand this out at the start of the seminar. Tell the group: "Answer these commitments honestly. Don't try to game the tree to get your favorite theory; let the tree tell you what you actually believe."

  **Q1: The Dissolution Check**
  Does the Liar sentence ("This sentence is not true") express a genuine proposition with truth conditions?
  *   **No** → Go to **Leaf 1**.
  *   **Yes** → Go to Q2.

  **Q2: The Consistency Check**
  Is it possible for any sentence to be both True and Not-True simultaneously?
  *   **Yes** → Go to **Leaf 2**.
  *   **No** → Go to Q3.

  **Q3: The Borrowed Loop**
  *Scenario:* Sentence A (Language 1) says "No sentence in Language 2 ascribing truth to L1 is true." Sentence B (Language 2) says "A is true."
  To avoid paradox, must your theory forbid this mutual reference by assigning A and B to different semantic levels?
  *   **Yes** (Reference must be blocked by hierarchy) → Go to **Leaf 3**.
  *   **No** (They can coexist in a single system) → Go to Q4.

  **Q4: The Scheduled Liar**
  *Scenario:* A card reads "The sentence written on the whiteboard tomorrow at noon is not true." The board stays blank due to rain.
  Does the sentence on the card therefore lack a truth value (or fail to express a proposition) *because* the board is blank?
  *   **Yes** (It creates a gap/void) → Go to Q5.
  *   **No** (Its status depends on context of assessment, not the board) → Go to **Leaf 4**.

  **Q5: The Stability Check**
  If we repeatedly evaluate the Liar using the rules of your theory, does its truth value settle on a fixed point (even if that point is a gap)?
  *   **No** (It oscillates indefinitely) → Go to **Leaf 5**.
  *   **Yes** (It settles) → Go to Q6.

  **Q6: The Logical Strength Check**
  Does your theory preserve classical logical validity (specifically, the principle of Cut/Transitivity: If $A \vdash B$ and $B \vdash C$, then $A \vdash C$)?
  *   **No** (Cut fails) → Go to **Leaf 6**.
  *   **Yes** (Cut holds) → Go to Q7.

  **Q7: The Revenge Check**
  Can your theory state its own solution (e.g., "The Liar is not true") in the object language without generating a new paradox?
  *   **No** (You need a richer metalanguage or accept ineffability) → Go to **Leaf 7**.
  *   **Yes** (Your semantics is expressibly complete) → Go to **Leaf 8**.

  ***

  ### Part 3: The Leaves

  **Leaf 1: Deflationist Dissolution**
  *   **Position:** The Liar is a category mistake; "true" is just a device for disquotation, not a substantive property.
  *   **The Awkward Cost:** You must explain why the Liar feels so compellingly paradoxical if it's literally nonsense.

  **Leaf 2: Dialetheic/Paraconsistent (LP)**
  *   **Position:** The Liar is a true contradiction; we must reject the Law of Non-Contradiction to save semantic closure.
  *   **The Awkward Cost:** You must explain why we shouldn't accept *all* contradictions (the "Explosion" problem) without ad hoc restrictions.

  **Leaf 3: Tarskian Hierarchy**
  *   **Position:** Truth is stratified; $True_1$ applies to $L_0$, $True_2$ to $L_1$, etc. The Liar is ill-formed.
  *   **The Awkward Cost:** You cannot state your own theory of truth within the language you are theorizing about.

  **Leaf 4: Contextualist (Burge/Parsons/Glanzberg)**
  *   **Position:** The Liar is true, but the context shifts when you assess it; "true" is indexical.
  *   **The Awkward Cost:** You must posit hidden context parameters in every truth ascription that speakers never explicitly notice.

  **Leaf 5: Revision Theory (Gupta/Belnap)**
  *   **Position:** The Liar has no fixed truth value; truth is a circular concept defined by revision rules.
  *   **The Awkward Cost:** You lose the intuition that truth is a stable property; some sentences are "true" only transiently.

  **Leaf 6: Non-Reflexive/Substructural (Ripley/Cobreros)**
  *   **Position:** The Liar is true and false, but we block paradox by rejecting the structural rule of Cut (Transitivity).
  *   **The Awkward Cost:** You must convince mathematicians that proofs can fail to chain together without collapsing mathematics.

  **Leaf 7: Kripkean Gap / Paracomplete**
  *   **Position:** The Liar is neither true nor false (ungrounded); we keep classical logic but reject Bivalence.
  *   **The Awkward Cost:** You cannot assert "The Liar is not true" without contradicting your own gap claim (the "Classical Recapture" problem).

  **Leaf 8: Supervaluationist**
  *   **Position:** The Liar lacks a value, but classical logic holds because it's true in all "precisifications" of the gap.
  *   **The Awkward Cost:** You must accept that $P \lor Q$ can be true even when neither $P$ nor $Q$ is true (failure of truth-functionality).

  ***

  ### Instructor's Note: Where the Fight Will Happen

  **The Revenge Branch (Q7)** is where your logicians will dig in.
  *   **Leaf 7 (Kripke)** and **Leaf 3 (Tarski)** usually land on "No." They admit they need a metalanguage to describe the gaps/levels. The attack vector: "If you can't say it, your theory is incomplete."
  *   **Leaf 4 (Contextualist)** and **Leaf 2 (Dialetheist)** land on "Yes." They claim to solve Revenge. The attack vector: "You just pushed the paradox back one step (e.g., 'extended Liars')."

  **The Indistinguishability Warning:**
  If a student lands on **Leaf 7 (Kripke)** but argues they preserve classical validity, they are actually at **Leaf 8 (Supervaluation)**. The tree separates them on Q6 (Logical Strength), but be prepared for them to argue that "validity" is defined differently in their system.

  **The "Scheduled Liar" Trap:**
  If a student answers **No** to Q4 (The board being blank doesn't create a gap), they are pushed toward **Contextualism**. Watch out for **Epistemicists** (who might say "It has a value, we just don't know it"). If they show up, send them to **Leaf 5** but note they believe the value is *fixed*, not *unstable*—this is an empty cell in the standard map (Fixed + Unstable is impossible), so they must choose: is it unknowable (Epistemic) or oscillating (Revision)?
