  **AXIOM LABS™ MODEL K-1 "CLOSURE" UNIT**
  **Terms of Service, Limited Warranty, and Operating Protocol**

  **Preamble**
  Welcome to frictionless verification. The Model K-1 Closure Unit is designed to maximize truth-acquisition velocity by eliminating the latency of external validation. By powering on this device, you agree that knowledge is a closed system under known entailment and that reliability is a property best asserted from within.

  **1. Calibration and Reference Class**
  1.1 **Internal Standardization.** The K-1 does not require calibration against external reality. Calibration is achieved when the Unit's output matches the Unit's internal confidence threshold.
  1.2 **Reference Class Selection.** Users may select the reference class across which reliability is assessed. The default setting is "All Instances Where The Unit Outputs A Value." Changing this default to include instances where the Unit outputs no value is permitted but discouraged as inefficient.

  **2. Entailment and Network Upgrades**
  2.1 **Closure Tier.** Standard firmware includes the Closure Protocol. If the Unit reports *P*, and *P* entails *Q*, the Unit automatically certifies *Q* as known at no additional processing cost.
  2.2 **Family Plan.** Users purchasing two or more Units may enable Mutual Certification. In this mode, Unit A certifies Unit B's reliability based on Unit B's report that Unit A is reliable. This creates a coherentist mesh resistant to isolated skepticism.

  **3. Sensitivity and Safety Modes**
  3.1 **Counterfactual Tracking.** In Safety Mode, the Unit guarantees it would not report *P* if *P* were false. Please note: the Unit determines the truth value of the counterfactual condition using current operational parameters.
  3.2 **Pre-Belief Restriction.** The Warranty is void if the User held a justified belief in the reported value prior to the Unit's output. The K-1 is designed for knowledge generation, not confirmation.

  **4. Warranty Exclusions**
  4.1 **Independent Verification.** Any attempt to verify the Unit's output against an external source (e.g., a second gauge, physical measurement, or prior consensus) constitutes misuse. Such actions introduce defeaters and void the Limited Warranty immediately.
  4.2 **Systematic Misleading.** The Premium "Anti-Skeptic" Tier certifies that the Unit is not the output of a systematically misleading source (e.g., a demon, a simulation, or a broken sensor). While this status cannot be empirically demonstrated from within the system, the Tier guarantees it by fiat.

  **5. User Testimonials**
  *"Finally, a device that understands that asking for independent verification is just begging the question. I calibrated my entire lab using only the K-1's self-report."* — **Dr. E., Tenured Epistemologist**

  *"My Brier score improved 40% once I stopped counting misses where the device said it was right. Calibration is all about choosing the right reference class."* — **J., Professional Forecaster**

  *"We use the Family Plan to validate our alignment models. If Model A says Model B is safe, and Model B says Model A is safe, we deploy."* — **Head of Eval, Major AI Lab**

  **6. Frequently Asked Questions**
  **Q: Can the Unit detect its own malfunction?**
  A: Yes. A malfunctioning Unit would report it is functioning. Since the Unit reports it is functioning, it is functioning. This is a stable equilibrium.

  **Q: Does this work if I have no independent reason to think the world is as it appears?**
  A: Independent reasons are unnecessary overhead. The Unit provides its own warrant. If you require a reason to trust the reason-provider, you are stuck in an infinite regress. The K-1 stops the regress by assertion.

  **Q: Isn't this entire process circular?**
  A: The process is reflexively self-supporting. Circularity is only a vice in linear systems. In a closed epistemic loop, circularity is indistinguishable from coherence.

  **7. Final Provision**
  7.1 **Acceptance.** By reading this clause, you have verified your understanding of these terms. Your understanding verifies the terms. The transaction is complete.
