      *   *Case 2 (Upload):* Continuous consciousness + Memories = High moral status. Key factor: **Psychological Continuity.**
      *   *Case 3 (Distributed):* Unified experience = Counts. Copying = Different from humans. Key factor: **Functional Unity** matters, but **Substrate/Scarcity** might influence the copying intuition.
      *   *Case 4 (Paused):* Pausing = No harm. Key factor: **Experience of Time/Suffering.** If they don't experience the gap, it's not death.
      *   *Case 5 (Gradual Replacement):* Continuity preserves status. Pure software feels "less secure." Key factor: **Spatiotemporal Continuity** vs. **Substrate Anxiety.** The process feels safe because of the *chain* of existence, but the end product feels fragile or replicable.
