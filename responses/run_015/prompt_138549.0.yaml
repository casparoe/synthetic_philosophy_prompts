prompt: |-
  You are a decision theorist and philosopher of action who has published on rational choice under cognitive and temporal constraints. Think carefully before answering: open with a short brainstorming pass in which you list candidate requirements and then strike the ones that are really only preferences of one research program, and only afterwards give me the polished list.

  I want a specification, not a survey. I am drafting a paper whose claim is that bounded rationality is still a slogan rather than a theory, and before I propose anything I need the standard any successor would have to meet. So: write the desiderata that a normative theory of choice for a bounded agent must satisfy, where the purpose is fixed as first-personal — the theory is to be good enough to tell the agent herself what to do, in deliberation, and not merely to grade her from the outside after the fact.

  Give the case or consideration behind each requirement. Among those I expect you to address: the substantive/procedural distinction, and whether the theory may collapse it; the regress that arises because deciding how long to think is itself a decision made under the same constraints, so that any rule of the form keep computing until marginal cost equals marginal expected gain must explain how the agent estimates the value of further computing without having already done it; the currency problem, i.e., in what unit computational cost is denominated and whose budget it is charged to; assessability without knowing the answer, so that a procedure that luckily succeeds in one environment is not thereby vindicated; the permissibility of rationally adopting rules or commitments that make the agent worse at local optimisation; and budget plasticity, the fact that attention, memory, and skill are things the agent can invest in, so the constraints cannot be treated as a fixed exogenous parameter.

  I also want you to add a requirement I have been toying with and tell me whether it is genuine or spurious: call it grain-invariance, the demand that the theory's verdict about a choice not flip when the very same problem is redrawn with options or deliberation steps individuated more finely, since the cost of computing scales with how finely the problem is described.

  Then: flag any pair of requirements you suspect cannot be jointly satisfied, and say which single requirement does the most work in excluding otherwise plausible candidates. Keep any scoring of the familiar families of views — expected utility with a computation-cost term, Simonian satisficing, fast-and-frugal or resource-rational approaches — to a few lines; the list is the deliverable. And tell me whether satisficing is a candidate theory at all, or only a description of what any adequate theory will have to predict.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Decision theorist and philosopher of action (specializing in rational choice under cognitive/temporal constraints).
      *   **Task:** Provide a specification (desiderata list) for a normative theory of choice for a bounded agent.
      *   **Purpose:** First-personal deliberation (telling the agent what to do), not third-personal grading.
      *   **Structure:**
          1.  Short brainstorming pass (list candidates, strike program-specific preferences).
          2.  Polished list of desiderata with justifications.
          3.  Address specific topics: substantive/procedural distinction, regress of meta-decision, currency problem, assessability without knowing the answer, permissibility of commitments/rules, budget plasticity.
          4.  Evaluate "grain-invariance" (genuine or spurious?).
          5.  Flag incompatible pairs of requirements.
          6.  Identify the "workhorse" requirement.
          7.  Briefly score familiar views (EU+cost, Simonian, Fast-and-Frugal, Resource-Rational).
          8.  Address satisficing (theory vs. prediction).
      *   **Tone:** Rigorous, philosophical, analytical, careful.

  2.  **Brainstorming Pass (Mental Draft & Filtering):**
      *   *Idea 1: Maximize Expected Utility.* -> Strike. That's unbounded rationality. Bounded theory needs to account for costs.
      *   *Idea 2: Minimize Computational Cost.* -> Strike. Trivial solution is to do nothing. Needs trade-off.
      *   *Idea 3: Follow Heuristics.* -> Strike. Too specific. Some heuristics are bad. Needs normative grounding.
      *   *Idea 4: Be Consistent.* -> Keep, but refine. Diachronic consistency matters.
      *   *Idea 5: Action-Guiding.* -> Keep. Must be usable by the agent *now*.
      *   *Idea 6: Environment-Sensitive.* -> Keep. Rationality depends on the world structure.
      *   *Idea 7: No Infinite Regress.* -> Keep. The meta-decision problem must be solvable.
      *   *Idea 8: Currency Neutral.* -> Keep. Costs shouldn't rely on a magic utility unit that doesn't exist for the agent.
      *   *Idea 9: Grain-Invariance.* -> Evaluate later.
      *   *Idea 10: Self-Modification Allowed.* -> Keep (Budget Plasticity).
      *   *Filter:* Remove things that sound like "be Bayesian" or "be ecological" specifically. Focus on structural constraints any theory must meet to count as *normative* for *bounded* agents.

  3.  **Developing the Desiderata (The Polished List):**
      *   *Requirement 1: Deliberative Accessibility.* (First-personal focus). The agent must be able to use the theory to decide.
      *   *Requirement 2: Non-Regressive Stopping.* (The regress problem). Must solve when to stop thinking without thinking forever about when to stop.
      *   *Requirement 3: Currency Commensurability.* (The currency problem). Costs and benefits must be comparable in a way the agent can track.
      *   *Requirement 4: Ex Ante Assessability.* (Assessability without knowing the answer). Must judge the procedure, not just the outcome.
      *   *Requirement 5: Strategic Flexibility.* (Commitments/Rules). Allow binding oneself to sub-optimal local moves for global gain.
      *   *Requirement 6: Endogenous Constraints.* (Budget Plasticity). Constraints are variables, not constants.
      *   *Requirement 7: Grain-Invariance.* (The user's specific addition). Needs careful handling.

  4.  **Addressing Specific Topics within the Desiderata:**
      *   *Substantive/Procedural:* The theory must bridge these. It can't just say "maximize utility" (substantive) because the agent can't. It must prescribe procedures that *track* value given limits.
      *   *Regress:* Addressed in Non-Regressive Stopping.
      *   *Currency:* Addressed in Currency Commensurability.
      *   *Assessability:* Addressed in Ex Ante Assessability.
      *   *Commitments:* Addressed in Strategic Flexibility.
      *   *Plasticity:* Addressed in Endogenous Constraints.

  5.  **Evaluating "Grain-Invariance":**
      *   *Is it genuine?* Yes. If I describe a choice as {A, B} or {A, B1, B2} where B1/B2 partition B, the rational verdict shouldn't flip just because I made the description finer (which increases computation cost artificially).
      *   *Nuance:* It's hard to satisfy. Computation *does* scale with grain. A theory needs to normalize for description length.

  6.  **Identifying Tensions/Incompatibilities:**
      *   *Tension:* Deliberative Accessibility vs. Non-Regressive Stopping. To know when to stop, you often need to compute the value of computing, which violates accessibility or triggers regress.
      *   *Tension:* Grain-Invariance vs. Endogenous Constraints. If constraints depend on cognitive effort, and effort depends on grain, invariance is hard.
      *   *Workhorse Requirement:* **Non-Regressive Stopping** (or "Tractability"). If you can't solve the stopping problem without invoking the very capacity you're modeling, the theory fails.

  7.  **Scoring Familiar Views:**
      *   *EU + Cost:* Fails regress (calculating cost of calculation).
      *   *Simonian Satisficing:* Descriptive, lacks normative stopping rule (what level is "good enough"?).
      *   *Fast-and-Frugal:* Good on accessibility, weak on normative justification (why *this* heuristic?).
      *   *Resource-Rational:* Best attempt, but often third-personal (optimizing the architecture, not the act).

  8.  **Satisficing Question:**
      *   Is it a theory? No, it's a predicted behavior or a structural feature. A theory needs to say *what* threshold to set.

  9.  **Drafting the Content (Iterative refinement for tone and precision):**
      *   *Tone Check:* Needs to sound like a philosopher of action. Use terms like "first-personal," "normative force," "diachronic," "ex ante."
      *   *Brainstorming Section:* Keep it distinct and visible as requested.
      *   *Grain-Invariance:* Be decisive. It's genuine but problematic.
      *   *Incompatibility:* Be honest about the difficulty.

  10. **Final Review against Constraints:**
      *   Did I open with brainstorming? Yes.
      *   Did I strike program-specific preferences? Yes.
      *   Is the purpose first-personal? Yes.
      *   Did I cover all specific topics (regress, currency, etc.)? Yes.
      *   Did I evaluate grain-invariance? Yes.
      *   Did I flag incompatible pairs? Yes.
      *   Did I score familiar views briefly? Yes.
      *   Did I address satisficing status? Yes.

  *(Self-Correction during drafting)*: I need to make sure I don't just list the topics the user gave me as requirements. I need to formulate them as *normative desiderata* that *encompass* those topics. For example, instead of "Solve the regress," the requirement is "Non-Regressive Action-Guidance." The consideration explains the regress.
  Also, ensure the distinction between "theory" and "prediction" regarding satisficing is sharp. Satisficing is often a *model* of behavior, but as a *norm*, it lacks a criterion for the aspiration level.

  *(Refining Grain-Invariance)*: This is tricky. If the cost of computation depends on the grain, and the theory says "minimize cost + error," changing the grain changes the cost, potentially changing the optimal choice. So strict invariance might be impossible. I should argue it's a *genuine* demand but perhaps needs to be framed as "Description-Independence of Normative Status" rather than raw output invariance. Actually, the prompt asks if it's genuine or spurious. I will argue it is genuine but highlights a fatal flaw in cost-based accounts.

  *(Refining the "Workhorse")*: The "First-Personal Accessibility" is probably the hardest filter. Many resource-rational accounts are third-personal (God's eye view of the agent's architecture). The theory must be usable *by* the agent.

  Let's assemble.cw
answer: |-
  ### Phase 1: Brainstorming and Filtering

  **Candidate Requirements:**
  1.  **Maximize Expected Utility (MEU):** *Strike.* This is the definition of unbounded rationality. A bounded theory must explain why deviating from MEU is sometimes required.
  2.  **Ecological Validity:** *Strike.* This is a preference of the "fast-and-frugal" program. While a theory should be sensitive to the environment, demanding specific ecological fits excludes structural accounts that might work across domains.
  3.  **Bayesian Coherence:** *Strike.* Too specific. Bounded agents may not have the memory to maintain coherent credences.
  4.  **Action-Guidance:** *Keep.* The theory must be usable by the agent in real-time.
  5.  **No Infinite Regress:** *Keep.* The rule for stopping deliberation cannot require further deliberation ad infinitum.
  6.  **Commensurable Currency:** *Keep.* Costs (time/effort) and Benefits (utility) must be comparable without magic conversion.
  7.  **Outcome-Independence:** *Keep.* We must assess the rationality of the process, not just the luck of the result.
  8.  **Diachronic Stability:** *Keep.* The agent shouldn't be forced to constantly undo her own past rational commitments.
  9.  **Fixed Constraints:** *Strike.* Constraints (memory, attention) are often investable variables, not fixed constants.
  10. **Grain-Invariance:** *Hold for evaluation.* (See below).

  **Filtering Logic:**
  I have struck requirements that presuppose a specific solution (e.g., "Be Bayesian" or "Be Ecological"). I have kept structural constraints that any normative account must satisfy to function as a *guide* rather than a *post-hoc explanation*. The focus is on the *architecture of deliberation* itself.

  ***

  ### Phase 2: Desiderata for a Normative Theory of Bounded Choice

  Here is the specification. Each requirement includes the case for its necessity, addressing the specific philosophical problems you raised.

  **1. First-Personal Accessibility**
  *   **Specification:** The theory must yield verdicts that the agent can compute *using only the cognitive resources currently available to her*. It cannot prescribe a calculation that requires more processing power than the agent possesses.
  *   **Case:** This addresses the **substantive/procedural distinction**. A substantive theory (e.g., "Maximize Utility") grades the outcome from the outside. A procedural theory guides the process. If the theory tells the agent to "calculate the expected value of calculating," but that calculation itself exceeds her bounds, the theory fails as a guide. It becomes a third-personal ideal rather than a first-personal norm.

  **2. Non-Regressive Stopping**
  *   **Specification:** The theory must provide a terminating condition for deliberation that does not itself require open-ended deliberation to verify.
  *   **Case:** This addresses the **regress problem**. The standard economic solution is "stop when marginal cost of computation equals marginal expected gain." But to estimate that gain, the agent must partially perform the computation she is deciding whether to do. If estimating the value of thinking requires thinking, we trigger a regress. A viable theory must offer a stopping rule (e.g., a heuristic trigger, a threshold, or a commitment) that is cheap enough to check without restarting the infinite loop.

  **3. Currency Commensurability**
  *   **Specification:** The theory must specify a single metric in which both decision-quality and computational-cost are denominated, which the agent can track without external measurement.
  *   **Case:** This addresses the **currency problem**. In many models, computational cost is in "seconds" or "flops," while benefit is in "utils." An agent cannot trade seconds for utils unless she has an internal exchange rate. If the theory relies on a conversion the agent cannot access (e.g., "charge cognitive effort to a homunculus budget"), it cannot guide her. The cost must be felt or tracked in the same phenomenological or functional currency as the reward.

  **4. Ex Ante Assessability**
  *   **Specification:** The rationality of a choice procedure must be assessable prior to the resolution of uncertainty. A procedure that yields a good outcome by luck must not be vindicated, nor a procedure that yields a bad outcome by bad luck condemned.
  *   **Case:** This addresses **assessability without knowing the answer**. If we judge rationality by outcomes, we cannot distinguish skill from luck. A normative theory for deliberation must justify the *policy* adopted. This is crucial for bounded agents who will frequently fail to achieve the optimal outcome; they need to know they were still rational in their attempt.

  **5. Strategic Flexibility (Permissibility of Commitment)**
  *   **Specification:** The theory must permit the agent to adopt rules, habits, or commitments that locally sub-optimize (reduce immediate expected utility) to preserve global rationality or reduce future computational load.
  *   **Case:** This addresses the **permissibility of rationally adopting rules**. A bounded agent cannot re-evaluate every premise at every moment (e.g., "Should I keep my promise?"). If the theory demands local optimization at every node, it ignores the cost of re-deliberation. Rationality for bounded agents must include the rationality of *ignoring* certain options or information to save resources for more critical decisions.

  **6. Endogenous Constraints (Budget Plasticity)**
  *   **Specification:** The theory must treat cognitive constraints (attention, memory, skill) as variables subject to investment, not as fixed exogenous parameters.
  *   **Case:** This addresses **budget plasticity**. Agents can train memory, build tools, or cultivate habits that alter their bounds. A theory that treats bounds as fixed (e.g., "Given memory limit M, do X") misses the higher-order rational choice of *changing* M. A complete theory must account for the rationality of investing in one's own cognitive architecture.

  **7. Grain-Invariance**
  *   **Specification:** The theory's verdict on the rationality of a choice should not flip merely because the problem description is individuated more finely (e.g., splitting one option into two equivalent sub-options), provided the underlying state of the world remains unchanged.
  *   **Case:** **Evaluation:** This is a **genuine** requirement, not spurious.
  *   **Reasoning:** Computational cost scales with description length. If I describe a choice as {A, B}, computing costs are $C$. If I describe it as {A, B1, B2} where B1/B2 partition B, computing costs rise to $C'$. If the theory says "Minimize Cost + Error," the verdict might flip from A to B simply because I drew the map differently. This makes rationality dependent on the *framing* rather than the *structure*. A robust theory must normalize for description length or define costs relative to the *informational content* rather than the *syntactic representation*. However, satisfying this is exceptionally difficult for procedural accounts.

  ***

  ### Phase 3: Structural Tensions and Workhorse Requirements

  **Incompatible Pair:**
  **First-Personal Accessibility** vs. **Non-Regressive Stopping.**
  *   **Conflict:** To satisfy Non-Regressive Stopping, you often need a fixed rule (e.g., "stop after 3 steps"). But to satisfy First-Personal Accessibility in complex environments, the agent needs to know *when* that rule applies, which may require assessing the environment's complexity. If the assessment of complexity is costly, you risk regress. If it is cheap, it may be too crude to be accessible for nuanced choices. Most theories sacrifice Accessibility (becoming third-personal models of the agent) to solve the Regress.

  **The Workhorse Requirement:**
  **First-Personal Accessibility.**
  *   **Reason:** This requirement does the most work in excluding otherwise plausible candidates. "Resource-Rational" analysis often calculates the optimal architecture from a God's-eye view. It tells the theorist what the agent *should* be, not what the agent *should do*. Similarly, standard Expected Utility with a computation cost term fails because the agent cannot calculate the cost term without already solving the problem. If the theory cannot be run on the hardware it is prescribing for, it is not a theory of *deliberation*; it is a theory of *design*.

  ***

  ### Phase 4: Scoring Familiar Families of Views

  *   **Expected Utility + Computation Cost:** Fails **Non-Regressive Stopping** and **First-Personal Accessibility**. Calculating the cost of calculation triggers the regress; the agent cannot access the cost function in real-time.
  *   **Simonian Satisficing:** Strong on **Accessibility**, weak on **Ex Ante Assessability**. It describes a stopping rule ("stop when good enough"), but lacks a normative account of how to set the aspiration level. Is setting the level rational? The theory is silent.
  *   **Fast-and-Frugal Heuristics:** Strong on **Accessibility** and **Endogenous Constraints** (via learning), but often struggles with **Grain-Invariance** and **Strategic Flexibility**. They are often ecologically specific, making cross-context normative assessment difficult.
  *   **Resource-Rational Approaches:** Strong on **Currency Commensurability** (theoretically), but typically fail **First-Personal Accessibility**. They optimize the system from the outside rather than guiding the agent from the inside.

  ***

  ### Phase 5: The Status of Satisficing

  **Is satisficing a candidate theory?**
  No. Satisficing is a **predicted behavior** or a **structural feature**, not a complete normative theory.

  **Reasoning:**
  To say an agent "should satisfice" is incomplete without a normative criterion for the *satisfaction level*. If the theory says "set the aspiration level where marginal cost equals marginal gain," it collapses back into the regress problem of Expected Utility. If it says "set the level where you feel content," it lacks normative force (contentment can be irrational). Therefore, satisficing is what an adequate theory will likely *predict* agents do (or should do) under specific constraints, but it cannot stand alone as the *justification* for the choice without an account of how the threshold is rationally set. It is the *shape* of the solution, not the *engine* of the solution.
