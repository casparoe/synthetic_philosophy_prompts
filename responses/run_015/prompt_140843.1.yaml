prompt: |-
  I cover philosophy and the cognitive sciences for a general audience. Twelve years ago I profiled the bride, then a graduate student working on the wrong kind of reasons problem: the difficulty, for any view that analyses value in terms of what it is fitting to favour or admire, of separating reasons that bear on whether an attitude is fitting from reasons that are merely reasons to get oneself into the attitude, the stock example being a demon who threatens you unless you admire him. Her own solution had two halves, and it is the second that her colleagues still argue about: a reason is of the right kind for an attitude, she argues, only if it bears on the correctness of what that attitude represents its object to be; and love does not represent its object as having merits at all, so her merits are not right-kind reasons for him to love her — the only considerations that can genuinely speak for one person's loving another are facts about the history those two people share.

  I'm giving one of the toasts at her wedding next month. Half the room is her department, who will hear exactly what I am doing if I do it right, and will notice if I smuggle in a merit-based or a benefit-based reason for his love; the other half is his family, who will be baffled or hurt if it sounds as though he has no reason to marry her, or as though her being brilliant and kind were beside the point. Write me a four-minute toast that stays inside her view without ever naming it. The praise of her can be warm and specific, but it must not be offered as his reason; that has to be the shared history — they met when he wandered into her talk by mistake, looking for a session on sea-level modelling, and they have walked the same loop around the reservoir together on Sunday mornings for four years, in every kind of weather. Nothing in it should rest on how happy she makes him, or on what an occasion like this calls for. It has to end as a toast and land as affection rather than as a seminar.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Journalist covering philosophy/cognitive sciences (12 years ago profiled the bride).
      *   **Audience:** Half philosophy department (colleagues who know her work/theory), half family (laypeople who need to feel loved/valued).
      *   **Task:** Write a 4-minute wedding toast.
      *   **Constraint 1 (The Theory):** Must align with the bride's specific philosophical view on love and reasons.
          *   *The View:* Value/fitting attitudes distinction (Wrong Kind of Reasons problem).
          *   *Her Solution:* A reason is "right-kind" for an attitude only if it bears on the correctness of what that attitude represents.
          *   *Specific Application to Love:* Love does *not* represent its object as having merits. Therefore, merits (brilliance, kindness) are *not* right-kind reasons for love.
          *   *The Only Right-Kind Reason for Love:* Facts about the shared history between the two people.
      *   **Constraint 2 (Avoidance):** Do not name the theory. Do not offer praise of her (merits) as *his reason* for loving her. Do not rest on how happy she makes him (benefit-based). Do not rest on "what an occasion like this calls for."
      *   **Constraint 3 (Tone):** Warm, specific, affectionate, not a seminar. Must end as a toast.
      *   **Constraint 4 (Timing):** Approximately 4 minutes spoken (roughly 500-600 words).
      *   **Key Narrative Elements:**
          *   Met when he wandered into her talk by mistake (looking for sea-level modelling).
          *   Walked the same loop around the reservoir together on Sunday mornings for four years, in every kind of weather.

  2.  **Deconstruct the Philosophical Constraint:**
      *   *The Trap:* Usually, toasts list virtues ("She's kind, smart, beautiful, that's why he loves her"). This violates her theory because those are "merits," and love isn't a response to merits.
      *   *The Requirement:* The reason for love must be the *shared history* itself. The love is constituted by the history, not justified by external qualities.
      *   *The Balancing Act:* I can praise her (she *is* brilliant and kind), but I cannot say "He loves her *because* she is brilliant and kind." I must say "He loves her because of *what they have done together*." The family needs to hear that he loves her deeply, not that he loves her for no reason. The philosophers need to hear that the reason is historical/relational, not evaluative/merit-based.

  3.  **Drafting - Section by Section:**

      *   **Opening:** Acknowledge the dual audience subtly. Establish the connection (the profile 12 years ago).
      *   **The Theory (Implicit):** Hint at the intellectual depth without jargon. Acknowledge her work on reasons.
      *   **The Narrative (The Reason):** Focus entirely on the shared history. The mistaken meeting, the reservoir walks. This is the "right-kind reason."
      *   **The Praise (The Trap):** How to mention her qualities? Frame them as part of the shared experience, not as justification. "He knows her brilliance" vs "He loves her because she's brilliant." Actually, better to avoid linking qualities to love entirely. Just state the history.
      *   **The Family Reassurance:** Ensure it sounds like *love*, not cold logic. The history *is* the bond.
      *   **The Closing:** Raise a glass. Focus on the future of the history.

  4.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I say "He loves her because she's kind"? *Correction:* No, say "He loves her because of the four years of Sundays."
      *   *Check:* Did I say "She makes him happy"? *Correction:* No, avoid consequentialist language. Focus on the constitutive nature of the relationship.
      *   *Check:* Is it too academic? *Correction:* Use the reservoir imagery to ground it. Keep the language lyrical.
      *   *Check:* Will the philosophers get it? *Correction:* Use phrases like "the right kind of reason," "what speaks for love," "facts about the history." They will spot the dog whistles.
      *   *Check:* Will the family get it? *Correction:* Emphasize commitment, endurance, weathering storms together. That sounds like love to anyone.

  5.  **Drafting - Step-by-Step:**

      *   *Intro:* 12 years ago, I wrote about her. She was solving puzzles about reasons.
      *   *Middle:* She taught us that love isn't a reward for good behavior or good traits. It's not about merits. It's about the path walked together.
      *   *Specifics:* The sea-level modelling mix-up. The reservoir loop. Rain, snow, sun.
      *   *Conclusion:* That history is the reason. Here's to the next loop.

  6.  **Word Count & Timing Check:**
      *   Average speaking pace is ~130-150 words per minute.
      *   4 minutes = ~520-600 words.
      *   Need to ensure pauses are built in for effect.

  7.  **Final Polish:**
      *   Ensure the distinction between "praise" and "reason" is clear. I can say she is brilliant, but not that it's *why* he loves her.
      *   Make sure the "sea-level modelling" joke lands gently.
