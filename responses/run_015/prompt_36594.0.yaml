  **1) The implicit picture**
  The everyday practice of clinical diagnosis often presupposes a form of medical realism, treating disorders as discrete natural kinds akin to pathogens or broken bones. When clinicians tick boxes to reach a threshold, the implication is that they are detecting an underlying entity that exists independently of the specific classification system. The binary outcome—you have Major Depressive Disorder or you don't—suggests a qualitative difference rather than a quantitative one, mirroring how we distinguish pregnancy from non-pregnancy rather than height from shortness. This view is reinforced by the language of "comorbidity" and "remission," which implies distinct conditions that can be present or absent. While manual authors often explicitly deny that categories are definitive accounts of reality, the operational use of the text by insurers and courts treats the labels as discovered facts. Consequently, the system functions as if there are genuine boundaries in nature, even if the editors admit those boundaries are drawn by committee. This creates a pragmatic fiction of essentialism: the workflow requires stable objects to bill for, regardless of whether those objects truly exist in the brain. Shifting criteria across editions suggest the "real" disorder is hidden behind changing proxies, waiting to be correctly mapped by the next revision of the manual.

  **2) Strict presuppositions vs. comfortable fit**
  Not every part of the system strictly requires discrete kinds. Insurance reimbursement and legal disability determinations genuinely need binary switches; a budget cannot allocate partial funds based on ontological fuzziness. For these administrative functions, the cutoff is a pragmatic necessity, not necessarily an ontological claim. Similarly, medication protocols often rely on thresholds to manage risk versus benefit, demanding a clear "go/no-go" signal. However, the actual clinical work—therapy, coping strategies, lifestyle changes—fits comfortably with a fuzzy-cluster model. Symptoms like anxiety or low mood exist on spectrums, and effective treatment often targets specific mechanisms (sleep, rumination) rather than the disorder label itself. The diagnostic criteria can be viewed as reliable heuristics for identifying clusters of suffering that warrant attention, without implying those clusters are natural kinds. The inconsistency arises when the administrative binary bleeds into clinical understanding. If the system acknowledged that the cutoff is merely a line drawn on a continuum for bookkeeping, clinicians could use the label for access while treating the dimensions. The strict presupposition is largely external (institutions needing clear liability), whereas the internal practice (understanding human distress) tolerates, and often benefits from, a dimensional view. The manual's changing categories support the fuzzy view, showing that the clusters are stable enough to be useful but not rigid enough to be elemental. Research funding also relies on these categories to define study populations, requiring operational stability even if the underlying construct is fluid. Thus, the system demands reliability for function, but not necessarily validity as discrete entities.

  **3) Switch or dial**
  The coexistence of binary diagnoses and severity specifiers is logically tense but pragmatically functional. It operates as a gated dial: you must flip the switch to access the system, but once inside, the dial determines the intensity of intervention. This reconciles the need for administrative clarity with the clinical reality of gradients. A patient must meet the criteria for Major Depression to justify insurance coverage (the switch), but the clinician treats the severity level (the dial) to tailor therapy or medication dosage. While philosophically inconsistent—implying the disorder both exists absolutely and varies continuously—it reflects the dual purpose of the manual. It serves as both a gatekeeper for resources and a guide for care. The inconsistency is tolerated because the alternative (purely dimensional) would break the billing code, while purely categorical would ignore clinical nuance. This hybrid allows the system to remain underdetermined ontologically; clinicians can act as realists for billing and constructivists for therapy without resolving the philosophical tension.

  **4) What would change**
  If the discrete-kind picture were openly abandoned, the manual would shift toward dimensional assessments, measuring traits like negative affect or detachment rather than checking boxes for "Disorder X." Proposed alternatives like HiTOP focus on spectra rather than silos. Institutions would need to overhaul their funding models; insurers would reimburse based on functional impairment or symptom severity scores rather than diagnostic codes. Courts would assess capacity and risk based on specific cognitive deficits rather than label-based presumptions. Clinically, this could reduce stigma, framing distress as extreme variations of normal functioning rather than alien diseases. Treatment would become more personalized, targeting specific symptom clusters regardless of their traditional diagnostic home. However, this transition faces huge hurdles. The current infrastructure is built on categorical billing; moving to dimensions requires rewriting laws, software, and training protocols. Research would also need new standards for defining populations without clear inclusion/exclusion criteria. Ultimately, dropping the discrete view would make the system more scientifically honest but administratively chaotic, requiring a societal willingness to fund care based on need rather than category. It would demand a new social contract where suffering alone, not just classified illness, legitimizes support. Patients would no longer need to argue for a label to validate their suffering, as the measurement of symptoms would suffice for care.

  **5) Loose ends**
  I am least sure whether future neuroscience will eventually validate some categories as discrete biological kinds, which would vindicate the current realist intuition for specific conditions. Additionally, it remains unclear whether abandoning the discrete label would undermine the sense of community and identity many patients find in shared diagnostic categories.
