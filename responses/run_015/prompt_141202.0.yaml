  *   **Why:** Diagnosed PTSD constitutes "objective harm" (medical condition) distinct from the "moral offense" of the whisky. Even without physical contact, the act creates a verified injury.

  **Rule B: The "Effective Control" Principle**
  *   **Logic:** A's right holds only if A's act leaves B with effective control over B's own protected sphere. If A's act functionally exiles B from B's sphere, A has usurped B's right.
  *   **Fit:**
      *   Case 1 (Whisky): B *chooses* to leave based on values. B *could* stay. **UPHELD.**
      *   Case 2 (Drums): B *cannot* sleep in B's room due to physics. **DENIED.**
      *   Case 3 (Fish): B *could* tolerate the smell. **UPHELD.**
  *   **Prediction for New Case:** **DENIED.**
  *   **Why:** B is not "choosing" to leave in the same normative sense as Case 1; B is *compelled* by pathology. A's act has effectively removed B's control over B's sleeping arrangement, violating the reciprocity required for minimal liberalism.

  ### 3. The Cleanest Test Case
  You need a case that separates **Physical Description** (your H1) from **Objective Harm/Welfare** (Rule A).

  **The "False Belief" Variant**
  *   **Setup:** Identical to your new case (A hosts overnight guest in A's room). B believes the guest is their abuser and suffers the same PTSD panic attacks. **However,** the guest is *not* the abuser (B is mistaken, perhaps the guest looks similar). There is zero objective risk and zero actual history of abuse between A's guest and B.
  *   **Why this works:**
      *   **Physicalist Rule:** Predicts **UPHELD**. The physical description of the act ("A hosts guest") is identical to the True Abuser case. The intrusion is zero.
      *   **Objective Harm Rule:** Predicts **UPHELD**. There is no *actual* harm, only subjective distress based on a falsehood. (If she Denies the True Abuser case but Upholds this one, she is running Rule A).
      *   **Subjective Welfare Rule:** Predicts **DENIED**. B's internal state (panic) is identical to the True Abuser case. (If she Denies both, she cares about B's mental state regardless of truth).

  **Critique of your Tarantula Idea:**
  The Tarantula (sealed tank, severe phobia) is also strong, but it introduces a physical object (the tank/spider) that might trigger the "Physical Intrusion" intuition even if sealed. The False Belief case keeps the physical setup *identical* to the Target Case, isolating the variable of "Objective Harm" vs. "Subjective Distress."

  **Recommendation:** Put the **False Belief** case to her first.
  *   If she **Denies** the True Abuser case but **Upholds** the False Belief case: She is running the **Objective Harm** rule.
  *   If she **Upholds** both: She is running the **Physicalist Description** rule (your H1).
  *   If she **Denies** both: She is running a **Subjective Welfare** rule (any severe setback voids rights).

  ### 4. The Mechanism Question
  You asked: *"If she does uphold, does she owe me a story about what the mechanism outputs, given that she was perfectly happy to accept a cyclic social ranking in case 1?"*

  **Yes, she owes you a story.**
  Accepting a cycle ($x \succ y \succ z \succ x$) means the social preference relation is intransitive. In Social Choice Theory, an intransitive relation often implies there is **no maximal element**—i.e., there is no "best" alternative to choose.
  *   **The Problem:** If the mechanism outputs a cycle, how does the flat actually decide where everyone sleeps? If you pick $x$ (Pareto), you violate A's right. If you pick $z$ (A's right), you violate B's right. If you pick $y$ (B's right), you violate Pareto.
  *   **What she needs to explain:** She needs to clarify if she is treating Rights as **Side-Constraints** (Nozick) or **Decisiveness** (Sen).
      *   If **Side-Constraints:** The cycle means the decision problem is *undefined*. No social choice can be made without violating a moral constraint. The "output" is a standoff.
      *   If **Decisiveness (Sen):** She needs to explain the **Agenda**. In a cycle, the outcome depends on the order of voting or which pair is considered first. She needs to tell you who holds the agenda-setting power.
      *   **The "Live with it" answer:** If she truly means "live with the cycle," she is accepting that collective rationality is impossible in these cases. She owes you an explanation of why we shouldn't just default to Pareto ($x$) to resolve the indeterminacy. Her answer should be: "Because violating a right is morally worse than being irrational."

  **Summary Advice:**
  Guess **UPHELD** based on her "Description" reasoning in Case 2. Test her with the **False Belief** variant to see if she cares about Objective Harm. And press her on the **Agenda/Choice** problem if she accepts the cycle.
