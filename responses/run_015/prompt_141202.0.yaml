  What I want from you: your best guess on the new case with the reason, the other rules that fit her five verdicts just as well and what each predicts here, and which case I should put in front of her next to seperate them. I've been toying with a tarantula in a sealed tank (severe phobia, zero objective danger) and with a variant where B's fear rests on a false belief about the guest, but I'm not sure either is the cleanest test. Also, if she does uphold, does she owe me a story about what the mechanism outputs, given that she was perfectly happy to accept a cyclic social ranking in case 1?
