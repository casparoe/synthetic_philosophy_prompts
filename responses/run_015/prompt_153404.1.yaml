      *   *Specific Focus:* The user suspects the "usefulness" bit is a strawman (correct) and the Peirce/James disagreement description is off (correct). I need to validate and deepen this.

  6.  **Refining the "Unsettled Claims" Argument:**
      *   *Peirce:* For Peirce, the "Real" is that which is independent of what you or I think. The "Final Opinion" is determined by the Real. If evidence is destroyed, does the Real still determine the opinion? Peirce believes in the continuity of mind (Synechism). He might argue that *some* line of inquiry *could* reach it (e.g., metaphysical insight, not just empirical digging). But strictly, if the physical trace is gone, empirical inquiry stops. Peirce's confidence in the *convergence* relies on the reality constraining inquiry. If reality *cannot* constrain inquiry (because the causal link is broken), the definition wobbles.
      *   *James:* James is less committed to a single "Final Opinion." He accepts that some truths might be "over-beliefs." For the Alexandria question, James might say: "It makes no practical difference, so the question is meaningless" (Pragmatic Maxim applied to truth). Or, "It is true if it fits with our other historical beliefs." James is more comfortable with truth being *partial*.
