  ### Logical Space Map
  Before constructing the tree, we identify the four independent variables defining the metaphysics of time under Special Relativity (SR):
  1.  **Simultaneity Ontology:** Is there a privileged "now" (violating SR spirit) or is existence frame/local relative? (Tested by *Andromeda*).
  2.  **Ontological Dynamics:** Is the sum total of reality fixed or changing? (Tested by *Sum Total*).
  3.  **Co-Reality Structure:** Is existence a global transitive relation or local/intransitive? (Tested by *Non-Transitivity*).
  4.  **Agency Compatibility:** Does deliberation survive a fixed future? (Tested by *Deliberation*).

  ***

  # DECISION TREE: THE RIETDIJK–PUTNAM ARGUMENT
  **Starting Commitment:** SR is empirically adequate; simultaneity between spacelike events is frame-relative.

  *   **NODE 1 (Andromeda Case):** Consider an observer walking towards the Andromeda galaxy. Is there a **frame-independent fact** about whether the Andromedan invasion fleet has *already* launched?
      *   **YES (Unique Fact):** *There is a privileged foliation of spacetime.*
          *   **NODE 2 (Sum Total Case):** Does the collection of all real events **increase or decrease** as time passes?
              *   **YES (Dynamic):** *Reality changes.*
                  *   **LEAF A:** **Presentism / Presentism with Privileged Foliation**
                      *   *Awkward Commitment:* You must posit a physically undetectable preferred frame to save the "now."
              *   **NO (Static):** *Reality is fixed.*
                  *   **LEAF B:** **The Moving Spotlight**
                      *   *Awkward Commitment:* You must explain what the "light" adds to the block if it changes nothing physical.
      *   **NO (Relative Fact):** *Existence is relative to frame, point, or world-line.*
          *   **NODE 3 (Sum Total Case):** Does the collection of all real events **increase or decrease** as time passes?
              *   **YES (Dynamic):** *Reality changes.*
                  *   **NODE 4 (Past Reality):** Consider a supernova that exploded 100 years ago. Is it **still part of the sum total of reality**?
                      *   **YES (Past Real):** *Reality grows.*
                          *   **LEAF C:** **The Growing Block**
                              *   *Awkward Commitment:* You must explain why we never experience the "edge" of becoming.
                      *   **NO (Past Unreal):** *Reality slides.*
                          *   **LEAF D:** **The Sliding Window** (User Candidate)
                              *   *Awkward Commitment:* You must accept that events literally cease to exist after a fixed span.
              *   **NO (Static):** *Reality is fixed.*
                  *   **NODE 5 (Non-Transitivity Case):** If Event A is co-real with B, and B with C, **must A be co-real with C**?
                      *   **NO (Intransitive):** *Existence is local.*
                          *   **LEAF E:** **Becoming Relativized to a Point**
                              *   *Awkward Commitment:* You must deny that "exists" is a meaningful global predicate.
                      *   **YES (Transitive):** *Existence is global.*
                          *   **NODE 6 (Deliberation Case):** Given a complete 4D description of the world, **does your weighing of reasons causally contribute to the outcome**?
                              *   **YES (Agency Real):** *Deliberation matters.*
                                  *   **LEAF F:** **The Block Universe / The Deflationary View**
                                      *   *Awkward Commitment:* You must accept that your future actions are equally real as your past ones.
                              *   **NO (Agency Illusion):** *Deliberation is epiphenomenal.*
                                  *   **LEAF G:** **[UNOCCUPIED CELL 1]**
                                      *   *Status:* Merely unattractive; rejects compatibilism without ontological gain.
          *   **[UNOCCUPIED CELL 2]** (Branch: Privileged + Dynamic + Intransitive)
              *   *Status:* Incoherent; privileged foliation implies global transitivity, contradicting intransitivity.

  ***

  ### NOTES ON LEAVES & DISTINCTIONS

  **1. Indistinguishable Leaves:**
  *   **Leaf F (Block / Deflationary):** This tree cannot separate the *Block Universe* from the *Deflationary View*. Both accept a static, transitive, relativistic ontology. They differ only on whether the word "exists" carries metaphysical weight (substantive) or is merely a quantifier (verbal). To separate them, one must ask: *"Is the dispute about ontology or semantics?"*

  **2. Merged Positions:**
  *   **Leaf A (Presentism / Presentism+Priv):** Naive Presentism is untenable under SR. Only the version with a **dynamically undetectable privileged foliation** survives the Andromeda node. They occupy the same logical cell regarding SR compatibility.

  **3. Unoccupied Cells:**
  *   **Leaf G (Fatalist Block):** Empty because it accepts the Block ontology but rejects agency. Most philosophers find this merely unattractive rather than logically impossible.
  *   **Cell 2 (Privileged Dynamic Intransitive):** Empty because it is incoherent. A privileged foliation defines a global "now" (transitive), which contradicts the claim that co-reality is intransitive.

  **4. The Sliding Window (Leaf D):**
  *   This position occupies the dynamic, relativistic branch where the past ceases to be real. It avoids the "accumulation" problem of the Growing Block but incurs the cost of ontological loss.
