answer: |-
  1. **Foundations (0–5 min):** Define EU maximization ($\sum p_i U(O_i)$). Introduce the Antarctic case versus the Job. Establish the Job as computable. *Misconception:* Treating any large life change as transformative. *Defuse:* Stipulate strict criteria: radical phenomenological novelty + preference revision. The Antarctic case works because it satisfies both while remaining distinct from identity-loaded cases like parenthood.

  2. **Epistemic Transformation (5–15 min):** Lead with this. Econ majors will propose Value of Information. You must block VoI first by showing the information is fundamentally inaccessible, not just costly. Argue you cannot assign $U(O)$ without knowing "what it is like." Testimony yields propositional, not phenomenal, knowledge. *Misconception:* Collapsing into ordinary risk. *Defuse:* Risk implies known outcome space; here the outcome type is inaccessible. *Misconception:* Testimony/Surveys solve it. *Defuse:* Data describes the experience from the outside; it cannot simulate the subjective state required to value it.

  3. **Personal Transformation (15–25 min):** Argue the experience changes $U$ itself. The Post-Antarctic self chooses whether to stay or return. *Misconception:* Reversibility ("pilot then back out"). *Defuse:* The choice to reverse is made by the transformed self using new values, not the ex ante agent. *Misconception:* Affective Forecasting. *Defuse:* Detour. This is empirical evidence of the gap, not the normative argument. The problem is conceptual inability, not psychological bias.

  4. **Implications (25–30 min):** EU reasoning halts; it does not prescribe spontaneity. *Misconception:* Invisible transformation variant. *Defuse:* Exclude from main arc. It complicates the "discovery" framing without adding leverage for a 30-minute intro. Save for Q&A.

  **The Check**
  Ask: "Write down $U(Antarctic)$." If they write a number, they missed the point. If they write '?', ask if more data helps. If they say "No," they understand the epistemic barrier (missing values/access). If they say "Yes," they confuse values with information (missing information).

  **The Refusals**
  1. **Metaphysics of Personal Identity:** Whether the post-transform self is the "same person" is a separate ontological debate.
  2. **Formalizing Discovery:** Whether discovery-based rationality can be consequentialised or formalized requires a separate seminar.
