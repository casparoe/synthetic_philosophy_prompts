  # EXAMINATION QUESTION: JURISPRUDENCE SEMINAR

  **Time Allowed:** 45 Minutes
  **Word Limit:** Approximately 1000 Words
  **Total Marks:** 25

  **The Republic of Veredia**

  In the Republic of Veredia, almost every citizen privately approves of a consensual adult practice known as "P." However, due to a phenomenon sociologists call "pluralistic ignorance," almost every citizen falsely believes that everyone else disapproves of P. Consequently, everyone publicly disavows P to avoid social sanction.

  The Veredian legislature, relying on these public avowals, bans P. The enforcement is purely administrative: there are no criminal trials, no public condemnations, and no moral drama. Violators receive quiet, automated penalties, such as licence suspensions and credit downgrades, which only the sanctioned individual registers.

  Ten years later, surveys show that public avowals have hardened into genuine private conviction: citizens now truly believe P is wrong. The government argues this proves the ban was justified because it held the moral fabric together.

  **Question:**

  Evaluate the government's claim that the ban preserved society's moral fabric. In your answer, you must address the following five issues:

  1.  Distinguish between the claim that society may enforce *any* morality it holds, the claim that it may enforce only the morality *necessary* to prevent disintegration, and the claim that moral judgment requires law to be taken seriously.
  2.  Analyze whether the Veredia data supports the enforcement thesis or demonstrates that the conviction was an artifact of the enforcement itself (circularity).
  3.  Explain what evidence would show that the rule against P is "load-bearing" rather than substitutable, and identify who carries the burden of proof.
  4.  Determine whether quiet administrative compliance satisfies the requirement for moral enforcement, or if enforcement must be expressive and condemnatory.
  5.  Assess whether this view allows any distinction between a moral reformer and a traitor attacking the social fabric.

  Do not rely on external citations. Reason from the scenario and the logical structure of the arguments provided.

  ***

  # MODEL ANSWER

  The government's claim fails because it conflates the existence of shared morality with the necessity of legal coercion to sustain it. The Veredia scenario exposes a fatal circularity in the argument that law must enforce morality to prevent social disintegration.

  First, we must distinguish three distinct claims often run together. The strongest claim is that society may enforce any morality it happens to hold. The moderate claim is that society may enforce only that morality which is necessary to prevent disintegration. The weakest claim is that moral judgment requires the backing of law to be taken seriously. The government relies on the moderate claim—that the ban prevented disintegration—but slips into the strongest claim by assuming the existing public avowals justified the ban initially. If the moderate claim is the standard, the government must prove that without the ban, society would have collapsed. The Veredia data shows only that morality changed, not that society was at risk.

  Second, the data demonstrates circularity rather than evidence. The government argues the ban held the fabric together because conviction increased after enforcement. However, since the initial public avowals were based on pluralistic ignorance rather than genuine belief, the law did not reflect a shared morality; it manufactured one. If enforcement creates the very conviction used to justify it, the premise is not evidence for the conclusion; it is an artifact of the coercion. A theory of moral enforcement cannot rely on convictions produced by the enforcement itself to justify the enforcement. This reduces the argument to: "We must ban this because we banned it." The Veredia case is therefore a *reductio ad absurdum* of the empirical claim that society disintegrates without legal enforcement of morality.

  Third, even granting that a society needs *some* shared morality to function, most particular rules are substitutable. Societies survive massive moral shifts without disintegrating. To justify banning P, the government must show that the rule against P is "load-bearing"—that specifically this rule, not just some rule, is essential to social cohesion. There is no evidence in the scenario that P threatened institutional stability. The burden of proof lies on the state to demonstrate imminent disintegration, not on the individual to prove harmlessness. In Veredia, the state assumed the rule was essential simply because it was enforced. This reverses the burden of proof. Without evidence that allowing P would cause collapse, the rule is decorative, not load-bearing, and enforcing it is an unjustified use of state power.

  Fourth, the method of enforcement matters. The Veredian ban was administrative and quiet. There was no public condemnation, no trial, no expressive judgment. If the purpose of legal enforcement is to reinforce shared moral outrage, quiet compliance is insufficient. Moral enforcement requires visibility to signal communal boundaries. If the penalties are invisible credit downgrades, they do not reinforce a shared moral truth; they merely regulate behavior. If the goal is moral cohesion, the enforcement must be expressive. If the goal is merely compliance, the moral justification collapses into utilitarianism. Since the government claims the ban preserved the *moral* fabric, the quiet nature of the penalties undermines the claim that this was a moral enforcement rather than bureaucratic management.

  Finally, this view makes moral reform impossible. If the existing public morality defines the fabric of society, then any attempt to change it is an attack on society itself. In Veredia, a reformer arguing against the ban ten years ago would have been opposing the "shared morality" (even if based on ignorance). On this view, there is no distinction between treason and reform. A society that cannot distinguish between attacking its structure and improving its morals is stagnant. The enforcement thesis freezes morality at the moment of legislation. Because morality evolves, a theory that criminalizes deviation from current public avowals treats all evolution as disintegration.

  Therefore, the Veredia government's claim is untenable. The conviction was manufactured, the rule was not shown to be load-bearing, the enforcement lacked expressive power, and the logic precludes reform. The ban did not hold the fabric together; it rewove the fabric to match the ban.

  ***

  # MARKING SCHEME

  **Total Marks:** 25
  **Pass Threshold:** 13 Marks

  **1. Distinguishing the Claims (5 Marks)**
  *   **Full Marks:** Clearly distinguishes between enforcing *any* morality, enforcing *necessary* morality (disintegration thesis), and morality needing *law* for seriousness. Identifies that the government shifts between these standards illegitimately.
  *   **Common Error:** Treating all three claims as identical or failing to notice the shift from "preventing collapse" to "enforcing existing views."
  *   **Note:** Students must identify that the "disintegration" claim is the only one that offers a limiting principle.

  **2. Circularity and Artifact (5 Marks)**
  *   **Full Marks:** Identifies that the post-ban conviction is an artifact of the ban, not evidence of prior necessity. Argues that using manufactured consent to justify coercion is circular.
  *   **Common Error:** Accepting the shift in conviction as proof that the ban worked, ignoring the pluralistic ignorance starting point.
  *   **Note:** Must explicitly state that the data is a *reductio* or circular, not supportive evidence.

  **3. Load-Bearing vs. Substitutable (5 Marks)**
  *   **Full Marks:** Argues that societies can survive moral change. Places the burden of proof on the state to show specific disintegration risk. Distinguishes between "some morality is needed" and "this specific morality is needed."
  *   **Common Error:** Assuming that because a rule exists, it must be essential. Failing to assign the burden of proof to the state.
  *   **Note:** Must mention that most rules are substitutable without social collapse.

  **4. Visibility and Expression (5 Marks)**
  *   **Full Marks:** Argues that quiet administrative penalties fail to serve a *moral* expressive function. Distinguishes between behavioral compliance and moral reinforcement.
  *   **Common Error:** Assuming enforcement is enforcement regardless of visibility. Ignoring the difference between criminal condemnation and administrative penalty.
  *   **Note:** Must connect the lack of drama to the failure of the "moral fabric" claim.

  **5. Reform vs. Treason (5 Marks)**
  *   **Full Marks:** Concludes that the view makes reform indistinguishable from treason. Argues that freezing morality prevents necessary social evolution.
  *   **Common Error:** Suggesting reform is possible within the framework without explaining how it avoids the "disintegration" label.
  *   **Note:** Must identify the stagnation problem inherent in the enforcement thesis.

  **Specific Cap:**
  *   **Harm Principle Cap:** Any answer that primarily recites the Harm Principle (e.g., "Hart says only harm to others justifies law") without engaging with the specific Veredia scenario mechanics (pluralistic ignorance, administrative enforcement, circularity) must be capped at **10 Marks**, regardless of accuracy. This is a jurisprudence analysis exam, not a recall test.

  ***

  **Disclaimer on Extrapolation:**
  *The model answer takes a definitive stance that the Veredia scenario falsifies the Devlinian empirical claim. In standard scholarship, Devlinians might argue that the *source* of the morality (ignored ignorance) matters less than the *result* (stability). The model answer treats the manufacturing of consent as fatal, which is a strong philosophical commitment rather than a settled textual fact.*
