answer: |-
  ### Part 1: Brainstorming Mechanics

  Here are six mechanics I considered for this session. I've dropped five for specific pedagogical reasons.

  1.  **The Rawlsian Veil:** Students choose principles behind a screen before receiving endowments.
      *   *Drop:* Too abstract. It tests risk aversion (Harsanyi) rather than the intrinsic value of equality; students won't feel the *loss* of the Levelling Down Objection because they haven't "earned" the chips yet.
  2.  **The Tax & Transfer Market:** Students vote on tax rates to redistribute chips.
      *   *Drop:* Becomes a public choice game about self-interest ("I'm rich, I vote low tax") rather than a philosophical evaluation of distributive principles.
  3.  **The "Burn Pile" (Direct LDO):** Start unequal, offer option to burn rich chips to match poor.
      *   *Drop:* Too blunt. Students will immediately say "no" because it looks silly. The absurdity needs to arise from a principle *they* endorsed, not a rule I impose.
  4.  **The Social Welfare Calculator:** Groups propose formulas (e.g., Sum, Min, Gini) and we plug in numbers.
      *   *Drop:* Too mathematical/dry. It loses the emotional weight of *losing* chips; it becomes a math problem, not a justice problem.
  5.  **The Insurance Game:** Students buy insurance against being poor.
      *   *Drop:* Focuses on ex-ante risk mitigation, which muddies the water between luck egalitarianism (which we've done) and prioritarianism (the target).
  6.  **The Constitutional Convention (Selected):** Students draft a "Scoring Rule" for the class, apply it, and must revise it when it yields counter-intuitive results.
      *   *Keep:* This forces ownership. The "trap" springs from *their* logic. It allows for the visceral experience of the Levelling Down Objection and the Excessive Sacrifice objection without me lecturing.

  ---

  ### Part 2: The Simulation — "The Distributive Mechanism"

  **Materials List**
  *   **100 Poker Chips** (One color is fine, e.g., white).
  *   **16 Envelopes** (Opaque).
  *   **16 Index Cards** (To go inside envelopes).
  *   **1 "Burn Box"** (A literal box, tin, or heavy envelope marked "DESTROYED").
  *   **Whiteboard & Markers** (Red and Black).
  *   **Raffle Tickets** (Or slips of paper) for the payoff.
  *   **Timer** (Visible to you).

  **Endowment Setup (Do this before class)**
  Prepare 16 envelopes. Inside each, place an index card stating their "Initial Endowment."
  *   **4 Envelopes (The Advantaged):** 12 Chips each.
  *   **8 Envelopes (The Middle):** 6 Chips each.
  *   **4 Envelopes (The Disadvantaged):** 2 Chips each.
  *   *Total Chips in Play:* 100.
  *   *Distribution:* Hand these out randomly as students enter. Tell them **not to open them yet**.

  **The Payoff**
  At the end of class, the "Class Score" determines the raffle.
  *   Score > 90: 5 Raffle Tickets per student.
  *   Score 70–90: 2 Raffle Tickets per student.
  *   Score < 70: 0 Tickets.
  *(Note: The tickets are for a chocolate bar or coffee. It's silly, but it gamifies the "Score.")*

  ---

  ### Part 3: Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:10: Setup & Endowment**
  *   Hand out envelopes. Students open them and count their chips silently.
  *   **Instruction:** "These chips represent 'Social Primary Goods.' They are not money. Do not discuss your real-world finances. Your goal is to maximize the 'Class Justice Score.' I am the Calculator. You are the Legislature."
  *   Write on board: **Current Status:** Total = 100. Gap (High-Low) = 10.

  **00:10 – 00:30: Round 1 — The Constitution (Equality Trap)**
  *   **Task:** "Write a formula for the 'Class Justice Score.' It must use 'Total Chips' and 'Inequality.' You have 5 minutes."
  *   *Likely Outcome:* They will propose something like $Score = Total - (Gap \times Weight)$.
  *   **Action:** Ask them to set the *Weight*. If they say "Inequality is bad," ask "How bad? Is 1 unit of gap equal to 1 lost chip?" Push them to weight it heavily (e.g., Weight = 2).
  *   **Write Rule 1:** $Score = Total Chips - (2 \times Gap)$.
  *   **Calculate:** $100 - (2 \times 10) = 80$. (Status: 2 Tickets).
  *   **The Trap:** "I offer a policy: We take 2 chips from each Advantaged student and put them in the Burn Box. They are destroyed. No one receives them."
  *   **New Math:** Total = 92 (100 - 8). New Gap = 8 (10-2).
  *   **New Score:** $92 - (2 \times 8) = 76$. (Wait, this lowers the score. I need the trap to work.)
  *   *Correction for the Trap:* I need to guide them to weight inequality *more* heavily, or make the burn larger.
  *   **Revised Instruction:** "Many of you feel inequality is *very* unjust. Let's set the Weight at 3."
  *   **Rule 1:** $Score = Total - (3 \times Gap)$.
  *   **Status Quo Score:** $100 - 30 = 70$.
  *   **Burn Policy:** Destroy 2 chips from each Advantaged (4 students). Cost = 8 chips.
  *   **New State:** Total = 92. Gap = 8 (10-2).
  *   **New Score:** $92 - (3 \times 8) = 92 - 24 = 68$. (Still lower. The math is fighting me.)
  *   *Fix:* I need the Gap reduction to outweigh the Total loss.
      *   Current Gap: 10. New Gap: 8. Change = 2.
      *   Weight = 3. Gain from Equality = 6.
      *   Loss from Total = 8.
      *   Net = -2.
      *   *I need to burn more.* "Policy: Destroy 4 chips from each Advantaged."
      *   Cost = 16 chips. Total = 84.
      *   New Advantaged Endowment = 8. Gap = 6 (8-2).
      *   Score: $84 - (3 \times 6) = 84 - 18 = 66$.
      *   *Problem:* Levelling Down usually *lowers* total utility. The LDO point is that Egalitarianism *might* prefer it, not that it increases a utilitarian-style score.
      *   *Pivot:* I must frame the Score not as "Tickets" but as "Justice."
      *   **Instruction:** "Forget the tickets for a moment. If your formula says Justice increased, we must do it to be consistent."
      *   **Better Rule:** Let them define "Inequality" as Variance or just "Gap."
      *   **Let's try the "Box" differently.**
      *   **Round 1 Rule:** "Maximize Equality. Total chips matter only secondarily."
      *   **Scenario:** "I can destroy 10 chips from the Rich. This brings them from 12 to 2. Perfect Equality."
      *   **Question:** "Is this more just than the Status Quo?"
      *   **If they say Yes:** You have them. Write "Principle: Equality is Intrinsically Valuable."
      *   **If they say No:** Ask "Why? Did the poor gain?" (No). "Did anyone gain?" (No). "Then why is it worse?"
      *   *Decision:* I will not use a complex formula. I will use **Voting on Principles.**
      *   **Revised Round 1:**
          1.  Ask: "Is inequality bad in itself?" (Yes).
          2.  Ask: "If we can reduce inequality without helping the poor, should we?"
          3.  If they hesitate, introduce the **Burn Box**. "I will burn 4 chips from each Rich student. Total chips drop. Poor stay at 2. Gap shrinks."
          4.  Vote. If they vote Yes (to be consistent with "Inequality is bad"), they have accepted Levelling Down.
          5.  If they vote No, ask them to revise their principle: "So inequality is only bad if it helps someone?" (This leads to Priority).

      *Okay, to ensure the simulation runs smoothly, I will enforce the "Formula" approach but rig the numbers so the LDO is obvious.*
      *   **Rule 1:** $Score = 100 - (5 \times Gap)$. (Heavy weight on equality).
      *   **Status:** $100 - 50 = 50$.
      *   **Burn:** Destroy 4 chips from each Rich (16 total).
      *   **New Total:** 84.
      *   **New Gap:** Rich (8) - Poor (2) = 6.
      *   **New Score:** $84 - (5 \times 6) = 84 - 30 = 54$.
      *   **Result:** Score went UP. Justice increased. Nobody is better off.
      *   **Action:** Ask the Rich students: "You lost 4 chips. The poor gained nothing. But Justice increased. Do you accept this?"

  **00:30 – 00:40: BREAK**
  *   Crucial. Let the discomfort settle.

  **00:40 – 01:00: Round 2 — Priority & Sacrifice**
  *   **Instruction:** "Rule 1 failed. It demanded we burn chips for no reason. Let's fix it. New Rule: Benefits to the worse off count more."
  *   **Rule 2:** "Weighted Chips."
      *   Chips held by Disadvantaged count **3x**.
      *   Chips held by Middle count **2x**.
      *   Chips held by Advantaged count **1x**.
  *   **Current Weighted Score:**
      *   Poor: 4 students * 2 chips * 3 = 24.
      *   Mid: 8 students * 6 chips * 2 = 96.
      *   Rich: 4 students * 12 chips * 1 = 48.
      *   **Total:** 168.
  *   **The Transfer Proposal:** "We take 6 chips from each Rich student. Due to 'friction' (leakage), only 2 chips reach each Poor student."
      *   Rich Loss: 6 chips * 1 weight = -6 points per person * 4 people = -24.
      *   Poor Gain: 2 chips * 3 weight = +6 points per person * 4 people = +24.
      *   **Net Change:** 0.
      *   *Wait, I need it to be Positive to force the sacrifice.*
      *   **Adjustment:** "We take 5 chips from Rich. Poor get 2."
      *   Rich Loss: 5 * 1 * 4 = -20.
      *   Poor Gain: 2 * 3 * 4 = +24.
      *   **Net:** +4.
  *   **The visceral hit:** Rich students lose nearly half their stash (12 -> 7). Poor students gain 2 chips (2 -> 4).
  *   **Question:** "The Score went up. Justice increased. Rich students are significantly worse off for a tiny gain to the Poor. Is this mandatory?"
  *   **Discussion:** This is the "Excessive Sacrifice" objection to Prioritarianism.

  **01:00 – 01:10: Round 3 — The Veil (Ex-Ante)**
  *   **Instruction:** "Next semester, I reshuffle the envelopes. You don't know who you will be."
  *   **Question:** "Do you keep Rule 2 (Priority)? Or do you switch to Maximize Average (Utilitarianism)?"
  *   **Point:** Priority attaches to *persons* (ex-post), not just *positions* (ex-ante). If you switch behind the veil, you might be a Risk-Averse Utilitarian, not a Prioritarian.

  **01:10 – 01:20: Debrief**
  *   Map the experience to the theory (see below).

  ---

  ### Part 4: The Debrief (Mapping Experience to Doctrine)

  Do not lecture. Ask questions that force them to name the concepts.

  1.  **The Burn Box (00:30):**
      *   *Ask:* "When we burned the chips, who gained?" (No one). "Did inequality drop?" (Yes). "So why did it feel wrong?"
      *   *Doctrine:* **The Levelling Down Objection.** Equality is not intrinsically valuable. If it were, the Burn would be good. Since it feels absurd, equality must be *instrumental* (good only when it helps someone).
  2.  **The Weighted Transfer (01:00):**
      *   *Ask:* "In Round 2, someone gained. So it wasn't Levelling Down. Why did it still feel harsh?"
      *   *Doctrine:* **The Excessive Sacrifice Objection.** Prioritarianism (benefits to worse off matter more) avoids LDO, but it can demand huge sacrifices from the better-off for trivial gains to the worse-off.
  3.  **The Veil (01:10):**
      *   *Ask:* "Did your view change when you didn't know your envelope?"
      *   *Doctrine:* **Ex-Ante vs. Ex-Post.** Prioritarianism is usually Ex-Post (weight the actual outcome of the poor). Utilitarianism behind a veil is Ex-Ante (maximize expected value).

  ---

  ### Part 5: Troubleshooting (What Will Go Wrong)

  **1. The "Joke" Factor (The Burn Box)**
  *   *Risk:* Students laugh and say "Sure, burn them, who cares."
  *   *Fix:* Make it personal. "The four Advantaged students, please stand. Hand me 4 chips each. Put them in the box. Watch them vanish." Physicalizing the loss stops it from being abstract.
  *   *Fix 2:* Tie it to the Raffle. "If the Score goes up, everyone gets tickets. If we burn, the Score goes up. But the Advantaged have fewer chips to trade later." (Keep it simple: Just emphasize the loss).

  **2. The Arithmetic Bog**
  *   *Risk:* Calculating weighted scores takes too long.
  *   *Fix:* **You do the math.** They give the weights. You write the numbers. Do not let students use calculators. Keep the numbers integers (2, 3, 4).
  *   *Prep:* Have the calculations pre-written on a hidden sheet so you can transcribe them instantly.

  **3. The "Broke" Student**
  *   *Risk:* A student actually facing financial hardship feels targeted by being "Poor."
  *   *Fix:* **Randomize visibly.** Shuffle envelopes in front of them.
  *   *Script:* "These roles are random. In this room, 'Poor' means '2 chips.' It does not map to your life. If you feel uncomfortable, trade envelopes with me privately." (Have 2 spare neutral envelopes ready).
  *   *Debrief:* Explicitly state: "The discomfort you felt is the point, but remember this is a model of *claims*, not *need*."

  ---

  ### Part 6: Limitations (What This Can't Do)

  Be honest with them in the last 2 minutes.

  1.  **Cardinality:** "We treated justice like a score (80 vs 90). Real wellbeing isn't a single number. We can't actually add your happiness to yours."
  2.  **Comparability:** "We assumed 1 chip for you = 1 chip for me. In reality, a chip might mean more to the hungry student than the full one." (This actually *helps* Priority, but it's worth noting).
  3.  **Commodification:** "We turned justice into poker chips. This risks making you think goods are always transferable. Some goods (rights, dignity) can't be moved from Rich to Poor."

  ---

  ### Part 7: The Sufficiency Variant (If Time Permits)

  If Round 2 goes fast, introduce the **Sufficiency Cliff**.

  *   **Rule 3:** "Any chip *below 5* counts 3x. Any chip *at or above 5* counts 1x."
  *   **Scenario:** A Middle student has 5 chips. A Poor student has 4.
  *   **Transfer:** Take 1 from Middle (5->4). Give 1 to Poor (4->5).
  *   **Math:**
      *   Middle: Loses 1 chip. Value drops from 1x to 3x? No, they fell *below* threshold.
      *   Let's simplify: "Threshold is 5."
      *   Student A has 5. Student B has 4.
      *   Transfer 1 from A to B.
      *   A: 5 -> 4. (Now below threshold, weight increases? No, usually sufficiency says below matters more).
      *   *Standard Sufficiency:* Benefits below the threshold matter infinitely more.
      *   *In Class:* "Chips below 5 count 10x. Chips 5+ count 1x."
      *   **The Cliff:** Student A has 5. Student B has 4.
      *   Take 1 from A (5->4). A loses 1 point. But A falls below threshold, so remaining 4 count 10x? No, that's complex.
      *   *Simpler:* "Goal: Get everyone to 5."
      *   **The Scandal:** "I can take 10 chips from a Rich student (12->2) to push a Poor student from 4 to 5."
      *   **Score:** Poor crosses threshold (+Huge Bonus). Rich falls massively.
      *   **Point:** Sufficiency views create a "Cliff Edge." Being at 4.9 is morally more urgent than being at 0.1, because 4.9 is closer to the threshold. This is the "Small Change, Huge Priority" problem.
      *   *Instruction:* "If we adopt Sufficiency, do we ignore the person at 1 chip to help the person at 4.9 reach 5?"

  ---

  ### Final Teacher's Note
  You are the **Calculator**, not the **Judge**. When they recoil at the Burn Box, do not say "Aha! That's the Levelling Down Objection." Say, "Interesting. Your formula said Justice went up. Your gut says Justice went down. Which one is lying?" Make *them* resolve the tension. Good luck.
