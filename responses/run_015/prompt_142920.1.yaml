  here's the niche setup i want: imagine a dating app called Pramāṇa Match where you don't swipe on photos but on which pramāṇa justifies your interest. your profile lists whether you like someone via pratyakṣa (direct perception), anumāna (inference from texts), upamāna (they remind you of your ex), or śabda (a trusted friend vouched). the punchline should turn on actual Nyāya mechanics — like the algorithm flagging an upamāna match because similarity-knowledge isn't object-knowledge, or a moderator using tarka to reject every option but being unable to approve a single one. please don't drop verbatim quotes from the Nyāya Sūtras; paraphrase any specific claim if you need it, since i might read this aloud and don't want to botch sanskrit attribution. also avoid generic nerd-wordplay — i want it funny specifically to people who know that upamāna yields knowledge of the analogous relation, not the thing itself, and that tarka is purely eliminative. can you write that?
