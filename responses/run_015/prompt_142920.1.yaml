answer: |-
  *(Walks to the mic, adjusts the stand, looks out at the crowd)*

  So, I'm single. Obviously. But honestly, my problem isn't social anxiety; it's epistemic rigor. 

  I downloaded this new app called **Pramāṇa Match**. The premise is great. You don't swipe on photos. You swipe on the *means of knowledge* that justifies your interest. 

  Your profile has a dropdown menu: *Pratyakṣa*, *Anumāna*, *Śabda*, or *Upamāna*. 

  If you swipe *Pratyakṣa*, that's direct perception. "I saw you at the bar. You exist. I desire you." Solid. Classic Nyāya. No metaphysical baggage.

  If you swipe *Śabda*, that's testimony. "My mother says you're a good boy." Fine, provided the source is reliable and the sentence structure isn't ambiguous. 

  But things get messy when you hit the *Upamāna* users. 

  You know *Upamāna*. Comparison. Analogy. The Nyāya school fights tooth and nail to keep this as an independent *pramāṇa*. They say it's not just inference. It's its own thing. 

  So I match with this guy. His justification? *Upamāna*. 
  His bio says: "You remind me of someone I once knew."

  Now, logically, I should be flattered. But the app's algorithm flags the match immediately. Error message: **"Epistemic Failure: Similarity Known, Object Unverified."**

  Because think about the mechanics! In Nyāya, *upamāna* gives you knowledge of the *relation* between the name and the form based on similarity. It doesn't necessarily give you valid knowledge of the *object* itself in its current context. 

  The app is telling me: "Look, you know the *connection* between this guy and your ex. You know the similarity holds. But do you know *this guy*? No. You only know the comparison. You're dating the analogy, not the person."

  I tried to appeal the ban. I got put on hold with Customer Support. 

  Now, Pramāṇa Match doesn't use regular support agents. They use a *Tarka* Moderator. 

  For the non-specialists: *Tarka* is hypothetical reasoning. It's reductio ad absurdum. It's used to remove doubt. But—and this is the crucial Nyāya distinction—*Tarka* is not a *pramāṇa*. It doesn't generate new truth. It only eliminates false options. It clears the field; it doesn't plant the seed.

  So I'm on the chat with the Moderator. 
  I say: "Hey, why was my match rejected? I think we're compatible."

  The Moderator types back: "Let us apply *tarka*. If you were *not* compatible, you would not be feeling this attraction. You are feeling this attraction. Therefore, the assumption of incompatibility leads to an absurdity."

  I say: "Great! So we're compatible?"

  Moderator: "No. We have only established that the assumption of incompatibility is untenable. We have not positively established compatibility. *Tarka* cannot verify truth. It can only destroy error."

  I said: "So what do I do?"

  Moderator: "You wait until a valid *pramāṇa* arises. Until then, you remain in a state of eliminated doubt."

  So there I am. Alone. Not because I'm unlovable, but because I'm stuck in a state of *saṃśaya*—doubt—with all the false options removed, but no valid cognition to replace them. 

  The Moderator signs off with: "Relationship status: *Apramā*. Cognition does not correspond to reality. Please try again when you achieve *yathārthavṛtti*."

  Which is just a fancy way of saying: "You're deluded. Swipe left on yourself."

  *(Mic drop gesture, but gently)*
