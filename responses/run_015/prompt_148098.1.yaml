  **Case 1 (The Endogenous Defeater)**
  Clara, a legal transcript proofreader, knows ($p$) that the audio recording currently playing through her headphones contains the word "fraud" at timestamp 0:45; she has just listened to the segment three times with high-fidelity equipment. A captioning box on her screen flashes a warning ($e$) that the word at 0:45 is "frod." In this scenario, the captioning software processes the exact same analog sound waves entering Clara's headphones in real-time. Since Clara knows $p$, and she knows the captioner is merely a secondary digital readout of the very signal she is verifying, she infers that the caption is misleading and continues working without pausing to investigate the software's error log. Here, the dogmatic response is permissible; investigating $e$ would amount to re-listening to the same signal she has already conclusively verified, rendering the check redundantly circular.

  **Case 2 (The Exogenous Defeater)**
  Clara, a legal transcript proofreader, knows ($p$) that the audio recording currently playing through her headphones contains the word "fraud" at timestamp 0:45; she has just listened to the segment three times with high-fidelity equipment. A captioning box on her screen flashes a warning ($e$) that the word at 0:45 is "frod." In this scenario, the captioning software processes the original digital source file stored on a secure server, independent of the local playback stream Clara is hearing. Since Clara knows $p$, she infers that the caption is misleading and continues working without pausing to investigate the server file. Here, the dogmatic response is epistemically blameworthy; even though she knows $p$ regarding the playback, ignoring $e$ closes off an independent channel of verification that could reveal a discrepancy between the local playback and the official record, a discrepancy she has not ruled out.

  ***

  **The Argument and Point of Divergence**
  In both cases, Clara reasons: I know $p$; if $e$ were true, I would not know $p$ (or $p$ would be false); therefore, $e$ is false/misleading; therefore, I need not investigate $e$. The logic is identical, and by stipulation, Clara knows $p$ in both instances. The divergence occurs at the normative evaluation of the final step (the license to ignore). In Case 1, the inference licenses a dismissal that is efficient and epistemically harmless because $e$ is *evidentially endogenous*: the evidence constituting $e$ is a proper subset of the evidence constituting $p$. In Case 2, the inference licenses a dismissal that is reckless because $e$ is *evidentially exogenous*: the evidence constituting $e$ is causally independent of the evidence constituting $p$. The scandal of the paradox dissolves in Case 1 because the "new" information is structurally redundant; it resurfaces in Case 2 because the "new" information represents a distinct track of truth-tracking that the subject is normatively required to integrate, even if she currently knows $p$.

  **The Single Feature and Evidence Strength**
  The feature doing the work is **Evidential Independence**, not strength of evidence. It is not that the captioner in Case 2 is more reliable or that $e$ is more probable; visually, the warning looks identical, and we can stipulate the software versions are equally accurate. The difference is purely structural: in Case 1, $e$ supervenes on the very signal Clara is perceiving; in Case 2, $e$ supervenes on a distinct object (the server file) linked to Clara's object (the playback) only by a contingent assumption of identity. This is not a difference in how much evidence Clara has; she has the same perceptual grounds for $p$ in both. It is a difference in whether investigating $e$ adds a *new constraint* on the truth of $p$ (Case 2) or merely re-processes an old one (Case 1).

  **Ablation Test**
  If we remove the feature of Evidential Independence—making both cases endogenous or both exogenous—the pair collapses into an uninteresting single case. If both are endogenous, the dogmatic response is clearly permissible in both (checking a mirror twice). If both are exogenous, the dogmatic response is clearly suspect in both (ignoring an independent audit). The contrast vanishes, confirming that the structural relation between the grounds for $p$ and the source of $e$ is the sole variable driving the intuitive shift.

  **Evaluation of Replies**
  The **"Total Evidence/No New Knowledge"** reply fares best. It grants the inference but argues that knowing $p$ implies one's total evidence already outweighs $e$. In Case 1, this is transparently true: the total evidence for $p$ *includes* the signal $e$ misreads. In Case 2, this reply can be refined to show that while Clara knows $p$, her *total evidence* is fragile because it lacks the independent corroboration $e$ offers; thus, while the inference yields no new knowledge of $\neg e$, acting on it violates the norm of maximizing evidence robustness. The **"Dogmatism (Feature not Bug)"** reply fares worst. It must endorse Clara's behavior in Case 2 as epistemically sound simply because the inference is valid, failing to capture the intuitive blame we assign to ignoring independent checks. The **"Closure Denial"** reply is unnecessary; there is no need to break logic to solve a problem that is actually about evidential redundancy.

  **Strongest Dogmatist Objection**
  The outright dogmatist will object to Case 2 by arguing: "If Clara *knows* $p$, then the server file *must* match the playback. To say she should check $e$ is to say she should check for a logical impossibility. Epistemic responsibility cannot require us to investigate what we know to be false."
  **Assessment:** This objection does not land. It conflates *metaphysical* necessity (given $p$, $e$ is false) with *epistemic* access. Clara knows $p$ via playback, not via the server file. The "impossibility" of $e$ being true is only visible from the perspective of her current knowledge, which is precisely what is being tested. Epistemic responsibility requires guarding against the possibility that one's knowledge claim is mistaken *in light of new, independent channels*, even if, ex hypothesi, it is not. The dogmatist confuses the factivity of knowledge with the infallibility of the subject's position to dismiss challenges without hearing them.
