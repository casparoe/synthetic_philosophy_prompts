answer: |-
  ### Session Plan: The Architecture of Rigidity

  **Target:** Cognitive Science Graduate Students
  **Duration:** 90 Minutes
  **Goal:** Decouple behavioral complexity from representational freedom.

  #### 1. Conceptual Prerequisite: Teleology Without Transparency
  Before the *Sphex* ritual functions as a critique of agency, you must secure agreement on **Operational Intentionality**.

  *   **The Trap:** Students will dismiss the wasp as a biological machine, reserving "agency" for systems with phenomenological consciousness or high-level language.
  *   **The Fix:** Force the adoption of the **Intentional Stance** as a structural diagnostic, not a courtesy. They must accept that if a system pursues a goal (dragging cricket to burrow), we are licensed to model it as an agent *until* the model fails.
  *   **The Secured Premise:** "Agency is not a binary property of 'souls' but a gradient of **representational access to one's own goals**." The *Sphex* is not an entomological curiosity; it is a proof-of-concept for **goal-directed behavior that lacks access to the contingency of its own goals**. If they do not accept that the wasp is *trying* to do something, the loop is merely a mechanical jam, not a philosophical failure.

  #### 2. Carrying Example: The "Video-Feedback Wasp"
  Do not use the standard burrow example alone. Use a modified **Video-Feedback Wasp** to counter the "lack of data" objection.

  *   **The Scenario:** The wasp is equipped with a camera and a screen mounted on its head. When it approaches the burrow, it sees a live feed of its own antennae checking the hole. It possesses full sensory data regarding its own checking behavior.
  *   **What It Must Preserve:** The **First-Order Causal Link**. The visual input of "antennae in hole" must still trigger the motor output "drag cricket" via a fixed lookup table. The system tracks the *state of the world* (including its own body) perfectly.
  *   **What It Must Lack:** **Second-Order Policy Representation**. The wasp cannot represent the rule *"I am checking because I assume the burrow might be compromised"* as a hypothesis that could be false. It sees the *action*, but it cannot represent the *rationale* as a distinct object that can be evaluated.
  *   **Why This Works for Cog-Sci:** It neutralizes the "under-powered computer" objection. The hardware is sufficient for self-observation. The failure is architectural: the system processes self-data as *environmental data*, not as *metadata about its own control loop*.

  #### 3. Misconception Mapping & Interception Points

  | Sequence | The Misconception (Student Instinct) | The Interception Point (Instructor Move) |
  | :--- | :--- | :--- |
  | **1. Hardware** | "Rigidity is a bandwidth problem. The wasp just needs more sensors to see the whole picture." | **Intercept at the Video-Feedback reveal.** Show that even with total sensory access to the loop, the system repeats. Rigidity is not about *input resolution*; it is about *architectural closure*. |
  | **2. Complexity** | "Humans differ only in loop-depth. We just have more nested 'if-statements' (recursion) that allow us to exit the loop." | **Intercept at the 'Fixed Axiom' demonstration.** Show that infinite recursion on a fixed axiom (e.g., *Maximize Utility*) is still sphexish if the axiom itself cannot be questioned. More code = bigger cage, not an open door. |
  | **3. Stochasticity** | "Freedom is just the ability to break the loop. If we add noise/randomness, the system isn't rigid anymore." | **Intercept at the 'Reasons-Responsiveness' distinction.** A random break is not an *agentive* break. If the system breaks the loop due to quantum noise rather than a re-evaluation of the goal, it is not free; it is broken. |

  #### 4. Counterfactual Check-Question
  To verify they distinguish **flexible behavior** from **non-rigid representation**, ask this:

  > "Imagine we install a random number generator in the Video-Feedback Wasp that forces it to skip the burrow check 10% of the time. Its behavior is now statistically unpredictable and it occasionally saves time. **Has its *agency* increased, decreased, or stayed the same compared to the deterministic looper?**"

  *   **Correct Grasp:** "Stayed the same" (or decreased). Unpredictability without *reasons-responsiveness* is not agency. They must recognize that flexibility without representational access to the *rule* generating the flexibility is merely noise.
  *   **Failure Mode:** If they answer "Increased," they have equated freedom with behavioral variance (the "more if-statements" fallacy).

  #### 5. Literature Boundary & Logistics
  *   **Named Tension:** Explicitly name the tension between **Sourcehood** (actions originating from the agent's own reasoning structure) and **Leeway** (the Principle of Alternative Possibilities / "could have done otherwise").
  *   **The Set-Aside:** State clearly: "For this session, we **set aside Leeway**. We are not asking if the wasp *could* have done otherwise in a metaphysical sense. We are asking if the action *originated* from a representational structure that allows for error-correction of the goal itself (Sourcehood)."
  *   **Readings:** Confirm **no readings are assigned**. This session is a conceptual intervention, not a survey. The goal is to break a heuristic, not to memorize a canon.
