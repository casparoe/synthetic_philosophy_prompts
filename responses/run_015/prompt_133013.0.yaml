      *(Refining the Literature part)*: The prompt asks to name the tension between sourcehood and leeway. I need to explicitly say "We are setting aside the Principle of Alternative Possibilities (Leeway) to focus on Reasons-Responsiveness (Sourcehood)."

      *(Refining the Prerequisite)*: "The Intentional Stance" is the standard Dennett answer. But for cog-sci grads, it's about "Teleology without Consciousness." They need to accept that *goal-directedness* is the entry ticket for the agency critique.

      *(Refining the Example)*: "Mirror-Sphex." It watches a video of itself. It sees the leg move. It does not see the *program* moving the leg.
      *   *Preserve:* The causal link between visual input (burrow open) and motor output (drag).
      *   *Lack:* The semantic link between visual input (burrow open) and *policy evaluation*.

      *(Refining Misconceptions)*:
