          1.  Identify the conceptual prerequisite (Agency vs. Entomology).
          2.  Propose one carrying example ("Mirror-Sphex" variant) with specific preservation/lack criteria.
          3.  Map sequential misconceptions and interception points.
          4.  Provide one counterfactual check-question (flexible behavior vs. non-rigid representation).
          5.  State which free-will literature tension to name/set aside and confirm no readings.

  2.  **Deconstruct the Audience & Topic:**
      *   *Cognitive Science Grads:* They understand algorithms, feedback loops, state machines, and representational states. They might dismiss Dennett's wasp example as just "simple programming."
      *   *The Trap:* They think adding more code (complexity) solves the "rigidity" problem.
      *   *The Core Insight:* It's not about *what* the system does (behavior), but *how* it relates to its own rules (representation of contingency).
      *   *Sphexishness:* Dennett's term for mindless routine. The wasp checks the burrow, drags the cricket, checks again, drags again, ad infinitum if the cricket is moved.

  3.  **Drafting - Section by Section:**

      *   **1. Conceptual Prerequisite:**
          *   *Problem:* If they see the wasp as just a biological robot, it's entomology. To make it about *agency*, they need to see the wasp as a candidate for *intentionality*.
          *   *Solution:* They must accept the *Intentional Stance* as a diagnostic tool, not just a heuristic. If we treat the wasp as an agent *until* it fails, the failure reveals something about the *structure* of agency, not just the bug's biology.
          *   *Refinement:* It needs to be about "Representational Opacity." The prerequisite is understanding that *behavioral success* does not imply *representational access*. They need to grasp that a system can track the world without tracking *its tracking of the world*.

      *   **2. Carrying Example ("Mirror-Sphex"):**
          *   *Idea:* A wasp that sees itself checking the burrow.
          *   *Requirement:* It must have sensory access to the action (seeing the check) but lack meta-representational access (understanding *why* it's checking).
          *   *Preserve:* The stimulus-response link. The visual input of "burrow open" triggers "check."
          *   *Lack:* The ability to tag that trigger as "internal state dependent." It sees the burrow, not its own *policy* regarding the burrow.
          *   *Why for this audience:* It addresses the "camera/sensor" objection. It's not about lacking data; it's about lacking the *schema* to interpret the data as contingent on its own rules.

      *   **3. Misconception Mapping:**
          *   *Misconception 1:* Rigidity = Hardware/Compute limit. (Intercept: Show "Mirror-Sphex" has enough compute to see itself, still loops.)
          *   *Misconception 2:* Humans = Deep Loops (Recursion). (Intercept: Show that deep recursion without contingency representation is just a bigger loop.)
          *   *Misconception 3:* Breaking the loop = Freedom. (Intercept: Randomness isn't agency. The break must be *reason-responsive*, not just stochastic.)
          *   *Interception Points:* Need to be specific within the arc.

      *   **4. Counterfactual Check-Question:**
          *   *Goal:* Distinguish flexible behavior from non-rigid representation.
          *   *Idea:* A system that behaves flexibly but is rigid internally vs. rigid behavior but flexible internally (harder).
          *   *Better Idea:* A scenario where the system *could* break the loop physically but *doesn't* because of representational structure.
          *   *Draft:* "If the wasp had a camera and a screen, would it stop?" (Too simple).
          *   *Refinement:* "If we rewire the wasp to pause when it sees *itself* pausing, does it gain agency?" (Targets the recursion vs. representation distinction).
          *   *Final Polish:* Needs to force them to choose between "more data" and "different architecture."

      *   **5. Literature & Readings:**
          *   *Tension:* Sourcehood (Origination) vs. Leeway (Alternative Possibilities).
          *   *Decision:* Set aside "Leeway" (Could I have done otherwise?). Focus on "Sourcehood" (Did the action originate from *me* in a way that isn't just causal determinism?). Actually, for Compatibilism, the tension is usually between *Determinism* and *Control*.
          *   *Correction:* The prompt asks about the tension between *sourcehood and leeway*. In compatibilism, we often sacrifice leeway (could have done otherwise) for sourcehood (action flows from character/reasons).
          *   *Decision:* Name the "Principle of Alternative Possibilities" (Leeway) and set it aside. Focus on *Reasons-Responsiveness* (Sourcehood/Control).
          *   *Readings:* Confirm none.

  4.  **Review and Refine (Self-Correction):**
      *   *Tone:* Needs to be sharp, academic but instructional. No preaching.
      *   *Audience Check:* Ensure I'm not treating them like philosophers. They are cog-sci grads. Use terms like "meta-representation," "feedback loop," "state-space."
      *   *Prerequisite Check:* Is "Intentional Stance" enough? Maybe "Representational Transparency" is better. They need to understand that *information* isn't *meaning*. Let's go with "The distinction between causal covariance and semantic content." No, that's too heavy. Let's stick to "Operational vs. Representational Closure." Actually, the prompt asks for the prerequisite before the ritual reads as an *agency* problem. It's the assumption that *goal-directedness implies agenthood*.
      *   *Example Check:* The "Mirror-Sphex" needs to be precise. It sees the check. It doesn't see the *rule*.
      *   *Misconception Check:* Ensure the interception points are logical.
      *   *Question Check:* Must reveal if they get "non-rigid representation."
      *   *Literature Check:* Sourcehood vs. Leeway is the specific request. I must name it and set it aside.

  5.  **Final Polish of the Plan:**
      *   *Prerequisite:* The "Black Box Intentionality" assumption. They must agree to treat the system as an agent *by its outputs* before analyzing the *internal architecture*.
      *   *Example:* "The Video-Feedback Wasp." It sees a recording of its own check.
      *   *Misconceptions:* 1. Bandwidth issue. 2. Recursion depth issue. 3. Stochasticity issue.
      *   *Question:* "If a system randomly breaks the loop, is it freer?" (No). "If a system breaks the loop due to a higher-order rule, is that rule fixed?" (Yes).
      *   *Let's sharpen the Question:* "Describe a system that behaves identically to the Mirror-Sphex but is not sphexish." (Impossible if behavior is identical). "Describe a system that behaves *differently* but is still sphexish." (Better).
      *   *Best Question:* "If we add a random noise generator to the wasp's decision gate so it occasionally skips the check, have we increased its agency?" (Tests if they equate unpredictability with freedom).

      *(Self-Correction on the Question)*: The prompt asks for a question that reveals the distinction between *flexible behavior* and *non-rigid representation*.
      *   *Scenario:* A thermostat vs. a human.
      *   *Better:* A robot that rewrites its own code.
      *   *Selected:* "The Self-Rewriting Robot." If it rewrites code based on a fixed meta-rule, is it free?

      *(Wait, let's look closer at the prompt's specific request for the Question)*: "reveals whether they have grasped the distinction between flexible behavior and non-rigid representation."
      *   *Idea:* A system that behaves flexibly (adapts) but has rigid representation (cannot conceive of the rule changing).
