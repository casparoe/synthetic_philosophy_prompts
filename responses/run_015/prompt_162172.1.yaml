answer: |-
  # Q&A Prep Sheet: Causation by Omission & EA

  **Strategy Note:** Your position is metaphysically robust but pragmatically fragile. The room cares about *impact*, not ontology. If they smell that your view paralyzes decision-making, you lose. If they think you're just making a semantic point about blame, they'll tolerate you. Your goal is to isolate the metaphysics from the praxis.

  **In-Talk Concession Recommendation:**
  Concede the **Decision Theory/Quant Objection (#2)** preemptively. State clearly: *"For the purpose of calculating expected utility and building DAGs, treat omissions as causes. My claim is not that your models break, but that the moral weight you assign to the output of those models rests on duty, not the causal arrow."* This disarms the ML/Econ crowd immediately and prevents the panic that you are breaking Cost-Effectiveness Analysis (CEA).

  **The "Do Not Let Them Ask" Objection:**
  **#2 (Decision Theory).** If pressed hard here, you risk implying that rational choice theory requires a metaphysical link between *non-action* and *outcome* that you deny. Keep the reply focused on *correlation* and *conditional probability* for decision-making, reserving *causation* for moral attribution.

  **The Strongest Objection:**
  **#1 (The Grounding Objection).** If "could have prevented" implies causal capacity, you haven't escaped causation; you've just hidden it in the normative predicate. This is the only objection that threatens to make your view circular.

  **The Weakest Objection:**
  **#7 (The Legal Objection).** Law is pragmatic, not metaphysical. It is easy to dismiss legal causation as a tool for social regulation rather than a truth-claim about the universe.

  ---

  ### 1. The Grounding Objection (Normative Ethics Phil)
  **The Objection:** "You define 'Culpable Non-Prevention' (CNP) as holding between an agent and an outcome they *could have prevented*. But 'could have prevented' is a causal claim. It means 'had you acted, the outcome would not have occurred.' You haven't eliminated causation; you've just buried it inside the normative relation. Your view collapses into the standard counterfactual account."

  **The Reply:** "I concede that CNP *presupposes* causal capacity, but it denies causal *relation*. To say I 'could have prevented' X is to say I had the power to initiate a causal chain that would have intercepted the chain leading to X. That is a claim about my *abilities*, not about the *omission* itself being an event. The causal work is done by the hypothetical action, not the actual non-action. My thesis is that the *absence* of that action cannot stand in a causal relation to the outcome, even if the *presence* of it would have. The normative force comes from the violation of the duty to exercise that capacity, not from the metaphysical link between the silence and the death."
  *   **Dependence:** Relies heavily on **CNP**.
  *   **Soft Spot:** This is a fine distinction. If they press that "capacity" just *is* a dispositional causal property, you may have to concede the distinction is largely linguistic.
  *   **Fold Condition:** If they argue that dispositional properties are sufficient for causal relata, concede that your view is a subset of dispositional causation, but maintain the *moral* distinction remains.

  ### 2. The Decision Theory Objection (ML/Quant/Econ)
  **The Objection:** "We use do-calculus to make decisions. If I set node $D$ (Donate) to 0, and node $L$ (Life) becomes 0, that is a causal effect in the model. If you say that's not causation, you're telling us our decision matrices are metaphysically incoherent. Does Expected Utility Theory break on your view? If I can't causally influence the future by not acting, why calculate the utility of acting?"

  **The Reply:** "Your models remain perfectly valid as tools for *prediction under intervention*. When you compute $P(L | do(D=1))$, you are modeling the causal power of the *action*. My claim is that $D=0$ is not an intervention in the same ontological category; it is the baseline. You don't need 'causation by omission' to do decision theory; you only need to know that $D=1$ *causes* $L=1$. The utility of *choosing* $D=1$ is derived from the causal power of the action, not the causal power of the alternative. Your DAGs work fine; just don't interpret the '0' setting as an event that *pushes* the outcome. It's the absence of a push."
  *   **Dependence:** Stands **without CNP** (purely metaphysical/semantic).
  *   **Soft Spot:** If they argue that *choice* itself is the intervention, and choosing *not* to act is a positive mental event, you are in trouble.
  *   **Fold Condition:** **Concede this in the talk.** (See Strategy Note). Do not fight the quants on decision theory; it's not worth the capital.

  ### 3. The Prioritization Objection (Humanitarian Logistics)
  **The Objection:** "I run supply chains. I need to know if sending nets *causes* fewer deaths so I can prioritize them against vaccines. If omissions aren't causes, then 'deaths caused by lack of nets' is a nonsense category. Does your view imply we can't compare the cost-effectiveness of acting vs. not acting? How do I prioritize without causal attribution?"

  **The Reply:** "You can still compare. You compare the causal efficacy of *Intervention A* vs. *Intervention B*. You do not need to treat 'No Intervention' as a causal agent. You know that sending nets *causes* lives saved. You know sending vaccines *causes* lives saved. You compare those positive causal chains. The 'cost' of not acting is not a causal fact; it's a normative fact about the value of the lives you failed to save. Your CEA spreadsheet works exactly the same; only the column header changes from 'Causal Attribution' to 'Counterfactual Impact of Action'."
  *   **Dependence:** Stands **without CNP**.
  *   **Soft Spot:** Longtermist interventions often rely on *shaping* trajectories via *not* doing things (e.g., not releasing a model).
  *   **Fold Condition:** If they press on longtermist 'shaping' via restraint, admit this requires more work and you are currently focusing on near-term humanitarian aid cases.

  ### 4. The SEM Objection (Causation Phil)
  **The Objection:** "You dismiss the two-donor case as a failure of counterfactuals. But Structural Equation Models (SEMs) handle overdetermination cleanly using Halpern-Pearl definitions. We can identify both donors as causes in the model. You're rejecting a technical solution because you don't like the metaphysics, not because the math fails. Why should we prefer your intuition over the formalism?"

  **The Reply:** "The formalism identifies *variables* that make a difference, not *ontological events*. SEMs tell us which levers are connected to which outcomes. They do not tell us whether the *resting position* of a lever is an event. My claim is that the math is a map, and the map shows 'Donor A' as a variable, but the territory contains no event corresponding to 'Donor A's silence.' The SEM is instrumentally useful for identifying duty-bearers, which aligns with my CNP view, but it doesn't prove the omission is a causal particular. You're conflating model utility with metaphysical truth."
  *   **Dependence:** Stands **without CNP**.
  *   **Soft Spot:** If they argue that 'variable states' are all the causation we ever mean, you lose.
  *   **Fold Condition:** Concede that for all *scientific* purposes, the SEM definition is sufficient. Your quarrel is strictly with *moral* rhetoric.

  ### 5. The Longtermism Objection (EA Core)
  **The Objection:** "Longtermism is about shaping the far future. Often that means *not* deploying a technology or *not* publishing research. If omissions aren't causes, then 'causing a good long-term trajectory' by restraint is impossible. Does your view undermine the core argument for longtermist prioritization?"

  **The Reply:** "It reframes it, not undermines it. If we refrain from publishing, we are not *causing* a safe future; we are *fulfilling a duty* to prevent an unsafe one. The moral value lies in the adherence to the duty of non-proliferation, not in a causal arrow from 'silence' to 'safety.' This actually strengthens the case against risky research: it's not just about outcomes, it's about the violation of a duty to prevent harm. The ranking of interventions changes from 'which causes the best future' to 'which duty is most stringent.'"
  *   **Dependence:** Relies heavily on **CNP**.
  *   **Soft Spot:** This is a hard sell to consequentialists who care about the *outcome*, not the duty.
  *   **Fold Condition:** If they press that longtermism is purely outcome-based, admit your view is in tension with pure consequentialist longtermism and requires a deontological overlay.

  ### 6. The Pragmatic Objection (General EA)
  **The Objection:** "Okay, suppose you're right metaphysically. Ordinary language treats omissions as causes. EA rhetoric uses that language to motivate giving. If your view prescribes the same actions (give to save lives), why disrupt the heuristic? Isn't this just a philosophical quibble that reduces our persuasive power?"

  **The Reply:** "Because the heuristic fails in overdetermination cases, like the two-donor scenario. If we think 'my donation caused the save,' and then we find out someone else would have donated anyway, we feel our impact was zero. That leads to donor attrition. If we understand the relation as 'culpable non-prevention,' my duty remains even if I was overdetermined. It stabilizes motivation in cases where causal credit is diluted. It's not just semantics; it's a more robust engine for sustained commitment."
  *   **Dependence:** Relies heavily on **CNP**.
  *   **Soft Spot:** This is speculative psychology.
  *   **Fold Condition:** If they say 'causal credit' isn't the main driver of EA motivation, drop this point.

  ### 7. The Legal Objection (Retired Prosecutor)
  **The Objection:** "I've put people in prison for manslaughter by omission. The law treats failure to act as the proximate cause of death. Are you telling me the entire common law tradition is metaphysically confused? If the law says it's causation, isn't that social reality enough?"

  **The Reply:** "The law is not metaphysics; it is a tool for social regulation. Legal causation is about *attribution of liability*, not *physical production of events*. The law treats omissions as causes because it is useful for assigning blame, which aligns perfectly with my view that omissions trigger *normative* relations (like CNP), not physical ones. I am not saying the verdicts are wrong; I am saying the *justification* is normative, not mechanical. You convicted them because they had a duty, not because their silence pushed the victim."
  *   **Dependence:** Stands **without CNP**.
  *   **Soft Spot:** None really, this is the easiest objection to parry.
  *   **Fold Condition:** None. Stand firm here.

  ### 8. The Agglomeration Objection (Internal Consistency)
  **The Objection:** "You say CNP does not agglomerate: two agents can each be culpable without the pair being jointly culpable in a way that dilutes responsibility. But if A is culpable and B is culpable for the same death, isn't the collective 'A+B' culpable? How do you assess the harm if the group responsibility doesn't sum?"

  **The Reply:** "Culpability is not a conserved quantity like mass. It is a relation between an individual agent and a duty. Two people can each violate a duty to save the same child. The 'harm' is the child's death, which is singular. The 'culpability' is duplicated, not split. This explains why we blame both donors fully, rather than blaming each for 50%. Agglomeration would imply that adding more bystanders reduces individual blame, which is counter-intuitive. My view preserves the intuition that every capable bystander is fully culpable."
  *   **Dependence:** Relies heavily on **CNP**.
  *   **Soft Spot:** This is metaphysically weird (non-additive properties).
  *   **Fold Condition:** If they press that this violates basic mereology, concede that CNP is a *normative* primitive that doesn't obey mereological summing rules.

  ---

  ### Final Advice for the Room

  **The Core Message:**
  You must get across that **CEA works, but the *story* we tell about CEA is wrong.** If you convince them their spreadsheets are broken, you will be eaten alive. If you convince them their spreadsheets measure *duty-fulfillment potential* rather than *causal output*, you might win.

  **The Danger:**
  The **Grounding Objection (#1)** is the only one that can logically dismantle your position. If "could have prevented" is causal, you have no distinction. Spend your mental energy there. The Quant objections are rhetorical; they care about prediction, not ontology. The Phil objections are technical; they care about consistency.

  **The Win Condition:**
  You win if you leave the room with the audience agreeing that *"Maybe 'caused' isn't the right word for what we owe each other, even if the math stays the same."* You lose if they think you are telling them not to donate. Keep the moral urgency high, even as you lower the metaphysical status of omission.
