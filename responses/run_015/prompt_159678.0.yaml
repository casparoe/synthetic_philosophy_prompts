answer: |-
  It is a genuine pleasure to correspond with someone who has spent thirty years in the mud and is now asking how the Nyāya-sūtra applies to mudlarks. Your grasp of the *pramāṇas* is solid. You are correct that standard Nyāya holds to four: *Pratyakṣa* (perception), *Anumāna* (inference), *Upamāna* (comparison/recognition), and *Śabda* (testimony). You are also right that *Anupalabdhi* (cognition of absence) is the contentious fifth; the Bhāṭṭa Mīmāṃsakas championed it, while Nyāya traditionally tried to reduce it to a form of *Pratyakṣa* (you perceive the empty floor, not the "absence" itself), though later Navya-Nyāya thinkers softened this. For your purposes, treating "absence" as a defeater rather than a standalone source of positive knowledge is the pragmatic move.

  You are asking for a bridge between *tarka* (logic) and *vyavahāra* (practical transaction). Below is the brainstorm on applicability, followed by the protocol, the case runs, and the confrontation with your instincts.

  ### Brainstorm: Nyāya Distinctions in the Field

  1.  **Śabda (Testimony) is not Inference:** This is the most critical Nyāya insight for you. Modern data science often treats testimony as "inference from reliability" (i.e., "I believe her *because* she has been right before"). Nyāya argues *Śabda* is a *sui generis* source of knowledge. If the speaker is *āpta* (reliable/competent), the statement yields knowledge directly. This validates accepting Dorothy's record without physical proof, provided her status as *āpta* is established.
  2.  **Pratyakṣa (Perception) requires Valid Instruments:** A photo is an extension of the eye (*karana*). But Nyāya insists on *yathārtha* (correspondence to reality). A photo without metadata (time/place) is like seeing a shape in the fog; the sensory contact is defective (*doṣa*). It creates doubt (*saṃśaya*), not knowledge (*pramā*).
  3.  **Upamāna (Comparison) vs. App Algorithms:** *Upamāna* is knowing a thing by its similarity to a standard (the *gavaya* is like a cow). An app ID is *Upamāna* automated. However, Nyāya requires the knower to understand the similarity. If the user just trusts the app's output without checking the match, they are treating *Upamāna* as *Śabda* (blind testimony from a machine). This is epistemically weak.
  4.  **Anumāna (Inference) as Context Check:** Inference moves from a mark (*liṅga*) to a conclusion. In your system, this is habitat and phenology. "This plant grows in wet soil; this record is from a desert." This is not a source of *positive* ID, but a source of *negative* constraint (defeater).
  5.  **Drop Anupalabdhi as a Positive Source:** Do not ask reviewers to certify "absence." It is too prone to error (the cow might be behind the barn). Use the logic of absence only to reject records (e.g., "This bird does not migrate here in winter"), not to accept them.
  6.  **The "Āpta" Problem:** The system hinges on who counts as *āpta* (reliable). Nyāya defines this as someone with direct knowledge and the desire to communicate it truthfully. In your atlas, this is a social/political designation, not an epistemic one. The protocol cannot solve this; it can only enforce consistency once the designation is made.

  ***

  ### The Triage Protocol (Version 4.2)

  **For:** Volunteer Reviewers
  **Goal:** Classify the *Warrant* of a submission and check for *Defeaters*.
  **Time Limit:** 2 Minutes per record.

  **Step 1: Classify the Warrant**
  Look at the submission. What is the primary basis for the claim that this species is present? Select **one** primary category.
  *   **A. Direct Visual (Pratyakṣa):** Clear photo/video where diagnostic features are visible to *you*.
  *   **B. Expert Word (Śabda):** No photo, but submitted by a designated "Trusted Observer" (see List T).
  *   **C. Recognition (Upamāna):** Photo/Audio exists, but you cannot confirm ID; relies on an App ID or Field Guide match by the submitter.
  *   **D. Signs/Inference (Anumāna):** No organism seen; based on tracks, scat, nests, or damage.

  **Step 2: Check for Defeaters (Bādha)**
  Regardless of the Warrant, check these three conditions. If **ANY** are true, mark as **FLAGGED**.
  *   **Location:** Is the coordinate outside the known range (by >50 miles) without habitat connectivity?
  *   **Time:** Is the date outside the known phenology (flowering/migration window) for this region?
  *   **Quality:** Is the evidence ambiguous (blurry photo, noisy audio, vague description)?

  **Step 3: Apply Corroboration Rules**
  Based on the Warrant (Step 1) and Defeaters (Step 2), apply the rule:
  *   **If A (Direct Visual) + No Defeaters:** **ACCEPT.**
  *   **If A (Direct Visual) + Defeaters:** **HOLD** (Needs senior review). *Note: A photo does not override a phenological defeater.*
  *   **If B (Expert Word) + No Defeaters:** **ACCEPT.** *Note: Trust the person, not the proof.*
  *   **If B (Expert Word) + Defeaters:** **HOLD** (Even experts make mistakes; requires senior review).
  *   **If C (Recognition/App) + No Defeaters:** **HOLD** (Requires human confirmation of the ID).
  *   **If C (Recognition/App) + Defeaters:** **REJECT.**
  *   **If D (Signs/Inference):** **REJECT** for Rare Atlas (unless specific protocol exists for that species). *Inference is insufficient for rare species listing.*

  **Step 4: Termination**
  *   **ACCEPT:** Enters database.
  *   **REJECT:** Email submitter with standard "Insufficient Evidence" template.
  *   **HOLD:** Queued for Senior Reviewer (Data Coordinator).
  *   **UNVERIFIABLE:** (Use only if metadata is missing entirely, e.g., no date/location). Set aside. Do not reject, do not accept.

  ***

  ### Running the Cases

  Here is how the protocol processes your three specific scenarios.

  **Case 1: The Ghost Moth**
  *   **Submission:** Sharp photo, rare moth, no date, no locality, outside known range.
  *   **Step 1 (Warrant):** **A (Direct Visual).** The photo is clear.
  *   **Step 2 (Defeaters):** **YES.** Missing locality and date constitutes a "Quality" defeater (metadata is part of the perceptual context in digital *pratyakṣa*). Being outside known range is a "Location" defeater.
  *   **Step 3 (Rule):** A + Defeaters = **HOLD**.
  *   **Outcome:** The record is not rejected, but it cannot be accepted. It sits in your queue.
  *   **Epistemic Status:** *Saṃśaya* (Doubt). The perception is real, but the context is missing, so it cannot generate *pramā* (valid knowledge) for the Atlas.

  **Case 2: The App Bird**
  *   **Submission:** Beginner, rare marsh bird, wrong month, audio ID by app only.
  *   **Step 1 (Warrant):** **C (Recognition/App).** The human did not identify it; the machine did.
  *   **Step 2 (Defeaters):** **YES.** "Wrong month" is a hard Phenological Defeater.
  *   **Step 3 (Rule):** C + Defeaters = **REJECT**.
  *   **Outcome:** Rejected immediately.
  *   **Epistemic Status:** *Apramā* (Invalid cognition). The *Upamāna* (app match) is weak, and the *Anumāna* (phenology) contradicts it.

  **Case 3: Dorothy's Sedge**
  *   **Submission:** First-state-record sedge, no photo (lost phone), detailed written description by Dorothy (Trusted Observer).
  *   **Step 1 (Warrant):** **B (Expert Word/Śabda).** Dorothy is on List T.
  *   **Step 2 (Defeaters):** **NO.** Assuming her description places it in the right habitat and time. The lack of a photo is *not* a defeater for Category B.
  *   **Step 3 (Rule):** B + No Defeaters = **ACCEPT**.
  *   **Outcome:** Accepted into the database.
  *   **Epistemic Status:** *Śabda-pramā* (Knowledge from Testimony).

  ***

  ### The Confrontation: Which Instinct Must Die?

  You told me you have two instincts:
  1.  **The Photo Fetish:** "Nothing without a photo should ever count."
  2.  **The Dorothy Trust:** "Dorothy is basically never wrong."

  The protocol forces you to **abandon the Photo Fetish.**

  Here is the Nyāya reasoning why: In Case 1 (The Moth), you have a photo (*Pratyakṣa*), but the record is **HOLD** (unverified). In Case 3 (Dorothy), you have no photo, only words (*Śabda*), but the record is **ACCEPT**.

  Nyāya epistemology explicitly ranks *Śabda* from an *āpta* (reliable person) as a valid source of knowledge independent of perception. If you demand a photo from Dorothy, you are demoting her from an *āpta* (whose word is knowledge) to a mere sensor (whose output is data requiring verification). If she is truly *āpta*, her description *is* the evidence. To demand a photo is to say, "I do not actually trust you," which contradicts her status on List T.

  Conversely, the photo of the moth without metadata is epistemically hollow. It is *Pratyakṣa* without *nirṇaya* (determination). A picture without a place and time is just a picture of a moth, not a record of a moth *in the state*. The Photo Fetish privileges the *medium* over the *proposition*. The protocol privileges the *proposition* (Species X is at Place Y at Time Z). Dorothy gives you the proposition reliably; the Moth photo does not.

  **You must accept Dorothy's sedge.** If you do not, you are not running an epistemic protocol; you are running a bureaucracy that values storage media over human expertise.

  ***

  ### Where the Protocol Fails (The Limits)

  I owe you honesty about where this machinery grinds gears.

  1.  **The Definition of *Āpta* (Trusted Observer):** The protocol works only if List T is correct. But who puts Dorothy on List T? That is not an epistemic decision; it is a social one. It relies on past performance (induction), but Nyāya warns that past success does not guarantee future truth. If Dorothy gets senile or develops a blind spot, the protocol accepts error as *Śabda-pramā*. You need a separate, periodic audit of your "Trusted Observers" that the protocol does not cover.
  2.  **The "App" Category Confusion:** Reviewers will struggle to distinguish between *Upamāna* (I compared it to the guide) and *Śabda* (The app told me). Many users will write "ID'd by Merlin" in the notes. Reviewers must be trained to treat App IDs as *always* Category C (Recognition), never Category B (Testimony). An algorithm is not an *āpta* because it has no intention to speak truth; it has only probability weights.
  3.  **The Precautionary Principle Override:** You mentioned the stakes are asymmetric (false positive = land use restriction; false negative = species loss). The protocol is epistemic (What is true?). Conservation policy is ethical (What should we do?). Sometimes you will have a "HOLD" case (like the Moth) where the risk of missing a range expansion is so high that you *must* accept it provisionally to trigger a survey. The protocol says "HOLD"; your hydrologist's risk assessment might say "Accept and Verify." You need a "Policy Override" switch that sits *outside* this epistemic protocol.
  4.  **Absence as Data:** You cannot use this protocol to validate "This species is NOT here." Nyāya struggles with *Anupalabdhi*, and so will your volunteers. If a developer claims a wetland is empty because a consultant walked it for 20 minutes, your protocol has no tool to evaluate that negative claim. It is designed for presence only.

  **Final Word:**
  You are trying to encode *pramā* (valid knowledge) into a database field. Remember that *pramā* is an event, not an object. It happens in the moment of valid cognition. Your database stores the *memory* of that event. Dorothy's record is valid because the cognition happened in the swamp. The photo is invalid because the cognition cannot be located in space-time. Trust the swamp, not the JPEG.
