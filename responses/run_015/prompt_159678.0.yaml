      *   **Task:** Create a triage protocol for volunteer reviewers based on Nyāya epistemology (*pramāṇas*), adapted for real-world biodiversity data verification.
      *   **Specific Requirements:**
          1.  Correct/validate understanding of Nyāya *pramāṇas* (Perception, Inference, Comparison, Testimony, Absence).
          2.  Brainstorm (5-6 bullets) on which Nyāya distinctions work vs. which are "idle wheels" for this context.
          3.  Write the protocol (actionable for non-philosophers/non-taxonomists).
          4.  Run the protocol on three specific cases (Moth photo w/o metadata, Bird audio ID, Dorothy's written description).
          5.  Force a confrontation with the user's biases (Photo fetish vs. Trust in Dorothy).
          6.  Identify limits where the protocol fails and human judgment is needed.
      *   **Tone:** Expert in both Indian Epistemology and Data Quality Standards. Respectful, rigorous, practical, not "cargo-culting" Sanskrit terms.

  2.  **Deconstruct Nyāya Epistemology (Mental Check):**
      *   *Pratyakṣa* (Perception): Direct sensory contact. In Nyāya, this is robust but requires valid conditions (light, proximity, functioning senses).
      *   *Anumāna* (Inference): Reasoning from a mark (*liṅga*) to a conclusion. E.g., Smoke -> Fire. In bio: Tracks -> Animal, Habitat -> Species presence.
      *   *Upamāna* (Comparison/Analogy): Knowing a thing by its similarity to a known thing. The classic *gavaya* example. In bio: "Looks like the picture in the guide."
      *   *Śabda* (Testimony): Reliable verbal/written statement. Nyāya treats this as irreducible (not just inference about reliability). In bio: Expert ID, Trusted observer report.
      *   *Anupalabdhi* (Non-apprehension/Absence): Knowing something is *not* there because conditions for perception were met but perception didn't occur. (Later Nyāya added this; earlier tried to fold into Perception).
      *   *User's Understanding:* Mostly correct. Nyāya standard is 4 (*pratyakṣa, anumāna, upamāna, śabda*). *Anupalabdhi* is often associated with Bhāṭṭa Mīmāṃsā, but later Nyāya accepts it. The user's note about Nyāya trying to absorb absence into perception is historically nuanced but acceptable for this context.

  3.  **Brainstorming: Nyāya vs. Data Quality (The "Idle Wheels" vs. "Workhorses"):**
      *   *Workhorse 1: Śabda (Testimony).* Crucial for distinguishing "Trusted Expert" vs. "Random App." Nyāya's insistence that testimony is *sui generis* (not just inference) validates trusting Dorothy without demanding physical proof *if* her reliability is established.
      *   *Workhorse 2: Pratyakṣa (Perception).* The photo. But Nyāya requires valid conditions (*karana*). A photo without metadata is defective perception (like seeing in the dark).
      *   *Workhorse 3: Upamāna (Comparison).* The field guide/App match. This is distinct from inference. It's "recognition."
      *   *Idle Wheel 1: Anupalabdhi (Absence).* Hard to apply to *accepting* a record. It's better for *rejecting* (e.g., "It's January, this flower doesn't bloom"). We can use it for "phenological absence" but it's not a source of *positive* knowledge for a sighting.
      *   *Idle Wheel 2: Strict Upamāna vs. Pratyakṣa.* In digital data, a photo is a proxy for perception. We need to merge "Direct Perception" and "Comparison" into a "Visual Evidence" category, or keep them distinct to handle "Photo exists" vs. "ID is certain." Let's keep them distinct to handle the "App ID" problem.
      *   *Crucial Adaptation:* Nyāya cares about *defeaters* (*bādha*). We need a "Defeater Check" step.

  4.  **Developing the Protocol:**
      *   Need to translate Sanskrit terms into plain English but keep the logic.
      *   Structure: Intake -> Classification of Warrant -> Defeater Check -> Corroboration Rule -> Decision.
      *   *The App Problem:* An app ID is *Upamāna* (comparison to database) masquerading as *Śabda* (authority). It should be treated as weak *Upamāna* requiring *Anumāna* (habitat check) or *Śabda* (human expert) to solidify.
      *   *The Dorothy Problem:* Pure *Śabda*. Nyāya says valid testimony needs a reliable speaker (*āpta*). If she is *āpta*, *Śabda* stands alone.
      *   *The Photo Problem:* *Pratyakṣa* (via instrument). But defective context (no location/time) creates doubt (*saṃśaya*).

  5.  **Running the Cases:**
      *   *Case 1 (Moth):* Photo (*Pratyakṣa*) + No Metadata (Defeater). Range anomaly (*Anumāna* against). Result: Unverifiable/Flagged.
      *   *Case 2 (Bird/App):* App ID (*Upamāna* weak) + Wrong Month (*Anupalabdhi/Phenology Defeater*). Result: Reject/Flag.
      *   *Case 3 (Dorothy):* Description (*Śabda*). No Photo (Lack of *Pratyakṣa*). But Source is *Āpta* (Reliable). Nyāya prioritizes *Śabda* from *Āpta* over defective *Pratyakṣa*. Result: Accept (provisionally).
      *   *Bias Check:* User wants to reject Dorothy (no photo) and accept the Moth (photo). The protocol must force the user to accept Dorothy and reject the Moth. This challenges the "Photo Fetish."

  6.  **Refining the Output:**
      *   *Tone Check:* Acknowledge the user's hydrology background (data streams, uncertainty).
      *   *Philosophy Check:* Ensure Nyāya concepts are used accurately (e.g., *āpta* for reliable speaker, *bādha* for defeaters).
      *   *Practicality:* Keep the protocol steps clear for volunteers.
      *   *Honesty:* Admit where the protocol breaks (e.g., defining "Reliable Speaker" is political/social, not epistemic).

  7.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Validate the user's Nyāya summary. It's solid.
      *   *Brainstorm:* Focus on *Śabda* (trust), *Pratyakṣa* (evidence quality), *Upamāna* (apps), *Anumāna* (context), and drop *Anupalabdhi* as a primary source (use as defeater).
      *   *Protocol:* Use a flowchart logic. Step 1: Classify Warrant. Step 2: Check Defeaters. Step 3: Corroboration. Step 4: Decision.
      *   *Cases:* Apply strictly.
      *   *Bias Confrontation:* Be direct. The photo without context is epistemically hollow. Dorothy's word is epistemically full *if* she is established as *āpta*.
      *   *Limits:* The definition of *āpta* (who is trusted) is the weak link. Also, the "Precautionary Principle" (false negative vs false positive) is an ethical override, not an epistemic one.

  8.  **Final Review against Constraints:**
      *   Did I correct the Nyāya bits gently? Yes (Absence is later Nyāya/Mīmāṃsā).
      *   5-6 bullets for brainstorm? Yes.
      *   Protocol actionable? Yes.
      *   Three cases run? Yes.
      *   Bias challenged? Yes (Dorothy vs. Photo).
      *   Limits identified? Yes.

  9.  **Final Polish:** Ensure the voice sounds like a colleague who knows both Sanskrit and SQL. (Self-Correction: Make sure not to get too bogged down in Sanskrit jargon in the protocol itself. Keep the protocol English, use Sanskrit in the commentary.)

  *(Self-Correction during drafting)*: Wait, regarding the App. Is an App *Śabda* or *Upamāna*? Nyāya would likely say it's *Upamāna* (matching features) but users treat it as *Śabda* (authority). I should classify it as *Upamāna* (comparison) because it lacks intentionality/truth-commitment of a speaker. This weakens its status, which fits the user's suspicion.
  Regarding Dorothy: Nyāya defines *Śabda* as the statement of a reliable person (*āpta*). If Dorothy is *āpta*, her statement is valid knowledge even without perception by the receiver. This directly attacks the "no photo = no record" bias.

