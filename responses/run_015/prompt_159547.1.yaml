answer: |-
  Sahlins called foragers the original affluent society because they knew affluence means wanting less, not storing more. But surplus is just a demographic trap that breeds enough mouths to require fences, and you can't invoke the reversion clause once the grain count demands a boss. Basically, we didn't choose civilization; we just accidentally hired the guy with the replica grinding slab to count the grain and now we can't fire him.

  **Alternative Angle:**
  The three paleoethnobotanists in the back look exhausted, which is fair considering the Neolithic was supposed to reduce labor time. Instead, we created a surplus complex just to give you something to analyze for the next ten millennia. Sahlins said foragers were affluent because they wanted less; turns out we just wanted to make sure you had tenure.

  Why it lands: It collapses the abstract anthropological theory of the "affluent society" into the immediate physical reality of the room, framing the Neolithic trap as a bureaucratic error embodied by a specific colleague.
