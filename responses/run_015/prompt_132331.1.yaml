prompt: |-
  I did just over thirty years as a government fisheries biologist, and since retiring I've been volunteering as the verification coordinator for our regional bird atlas — which means I'm the person who looks at what three hundred-odd citizen volunteers send in and decides what gets entered as a record, and at what confidence level. In the last couple of years I've also started reading philosophy, mostly out of stubborness, and I've got properly stuck on that raven example: someone pointed out that a white shoe is evidence that all ravens are black, because saying all ravens are black is apparently the same claim as saying everything that isn't black isn't a raven. My volunteers think this is a joke and I'm not sure it is, and it matters to me practically, because a fair number of the things the atlas is supposed to be able to say have exactly that shape: no pale-morph ravens occur in this region, every nest of species X in the county is on a cliff, all the individuals in the island population are the dark morph.

  So here's what I want. A decision procedure my verification team could actually run on a single submitted record, to say how much evidential weight it gets for a generalization of that all-X-are-Y shape, and where to stop with a no. Not a philosophy essay — I need something a retired volunteer with a field guide and a laptop can work through in ten minutes, thirty to sixty times a week in spring, with no maths past a ratio, and with an explicit instruction about what to do when the number it wants can't be had. It has to hand the decision to a human being at the points where the question is really about what we're willing to stake rather than about evidence, and say so out loud rather than dressing it up as a rule. And it has to be honest about which steps are judgment calls.

  The hard cases I keep hitting, which the procedure has to actually deal with rather than wave at:

  One volunteer has genuinely submitted a spreadsheet of three thousand photographs of non-black objects — shoes, sheep, a grey heron, a cloud — and wants them entered as supporting records. Another has proposed we redeploy volunteers to go out and photograph white things instead of birds, on the grounds that it's cheaper.

  The atlas currently gives "negative" records — I looked at point 47 for an hour and saw no ravens — zero weight, and archives them, while at the same time treating forty years of nobody ever reporting a pale raven as real evidence that there aren't any. That looks inconsistent to me and I want to know whether it is.

  Dependence: fourteen people photograph what is almost certainly the same bird at the same landfill. The same bird is reported forty times across a season. And a bird described as all black in June is photographed pale in November, which might be molt, or age, or wear, or a different individual entirely.

  Definitions: our field guide separates ravens from crows partly on size and tail shape and partly on the bird being all black. If being all black is part of how you identify a raven, then a pale bird can't be a raven by definition, and it feels like the generalization has become unfalsifiable and every weight my team assigns is meaningless. I want a step that catches this before we waste anyone's time.

  Closed versus open populations: on one offshore island the raven population is colour-banded and thought to be around two hundred birds; on the mainland nothing is closed and nobody knows. Should the procedure branch there?

  And lab results: a student sends genotype data showing the dark-morph allele in twelve sampled birds. Where does that sit on the same scale as a photograph, if it sits on it at all?

  Then run it on three cases. First, a single pale raven photographed at a landfill in November by one observer, mediocre photo, reportedly black in June, no specimen, species identification contested by two committee members, and a committee rule that wants two independent observers or a specimen. Second, the three thousand non-black objects. Third, nine thousand black-raven checklist records accumulated over forty years — and give me the honest answer on that one even if it comes out that we should stop collecting them, because I suspect it might, and I'd rather hear it plain than have it softened.

  Finally, tell me what the procedure can't do. My guess is that it can only ever rate a record against one hypothesis at a time and has nothing to say about what that same record is worth to the atlas for distribution or population trend, but you tell me. I've no library access any more, so please don't send me off to read somebody — just argue for the procedure you give me.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Profile:** Retired government fisheries biologist (30+ years), currently a verification coordinator for a regional bird atlas. Experienced with data quality, field biology, and scientific rigor. Recently reading philosophy (specifically Hempel's Raven Paradox).
      *   **Task:** Create a practical *decision procedure* for a verification team to assess the evidential weight of a single submitted record regarding universal generalizations (e.g., "All ravens in this region are black").
      *   **Constraints:**
          *   Must be usable by a retired volunteer with a field guide/laptop.
          *   Time limit: ~10 minutes per record.
          *   Frequency: 30-60 times/week.
          *   Math: No higher than ratios.
          *   No library access/academic citations needed (argue for the procedure itself).
          *   Must explicitly identify judgment calls vs. rules.
          *   Must handle specific hard cases (3000 non-black photos, negative records, dependence/overlap, definitions/circularity, closed vs. open populations, genetic data).
          *   Must run the procedure on three specific test cases.
          *   Must state limitations (what the procedure *can't* do).
      *   **Tone:** Professional, pragmatic, respectful of expertise, honest about uncertainty, no fluff.

  2.  **Deconstruct the Core Problem (Hempel's Raven Paradox in Practice):**
      *   *The Paradox:* "All ravens are black" is logically equivalent to "All non-black things are non-ravens." Therefore, a white shoe confirms "All ravens are black."
      *   *The Practical Reality:* In biology, a white shoe provides *negligible* information compared to observing a raven. The volume of non-black non-ravens is effectively infinite.
      *   *The User's Conflict:* The atlas treats 40 years of no pale ravens as evidence, but treats "I looked and saw nothing" as zero weight. This feels inconsistent.
      *   *The Goal:* A weighting system that acknowledges logical equivalence but prioritizes *informational efficiency* and *falsifiability*.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: The Definition Check (Falsifiability).* The user mentioned the circular definition problem (if "raven" implies "black," a pale bird can't be a raven). This needs to be the gatekeeper. If the definition makes the claim tautological, stop.
      *   *Step 2: Relevance Filter (The "White Shoe" Test).* Does this record directly test the hypothesis? Observing a non-black non-raven is logically valid but practically useless unless the search effort was targeted at finding a counter-example.
      *   *Step 3: Independence & Dependence.* Address the landfill problem (14 photos of 1 bird). We need to count *individuals*, not *records*.
      *   *Step 4: Population Context (Closed vs. Open).* An island with 200 banded birds is different from a mainland. The weight of a negative finding (no pale birds seen) is higher in a closed population.
      *   *Step 5: Data Type Weighting.* Photo vs. Sight vs. Genetic. Genetics might confirm morph but not phenotype directly (though usually correlated).
      *   *Step 6: The "Negative Record" Fix.* The user noted the inconsistency on negative records. We need a way to value "effort without detection" without validating the "white shoe" spam. The key is *targeted search effort*.

      *   *Refining the Math:* Keep it simple. A "Weight Score" (0-5 or similar). Let's use a "Confidence Multiplier" approach or a simple "Evidence Class." Let's go with an **Evidence Class (A, B, C, D)** system, it's more intuitive for volunteers than a raw number.
      *   *Actually, a "Weight Unit" (WU) might be better for accumulation.* Let's try a simple 0-10 scale per record, but capped.
      *   *Better yet:* A flowchart style with explicit "Stop" points.
      *   *Decision:* Let's create a **"Verification Weight Protocol" (VWP)**. It assigns a *Relevance Score* and a *Reliability Score*.

      *   *Addressing the "White Shoe" Spam:* The protocol must explicitly state that random non-black objects have zero weight unless part of a structured survey designed to find counter-examples.
      *   *Addressing the 40-Year Gap:* This is cumulative negative evidence. A single "no bird seen" is weak. 40 years of "no bird seen" + high effort = strong. The procedure needs to distinguish between *passive absence* and *active survey*.

  4.  **Developing the Steps (incorporating constraints):**

      *   **Gate 1: The Definition Trap.** Is "black" part of the ID key? If yes, the hypothesis is untestable by observation. Stop.
      *   **Gate 2: Relevance.** Is the record a *potential counter-example* or a *confirming instance*?
          *   Pale Raven = High Weight (Falsification attempt).
          *   Black Raven = Low Weight (Confirmation, subject to diminishing returns).
          *   Non-Black Non-Raven = Zero Weight (unless specific survey context).
      *   **Gate 3: Independence.** Is this a new individual? (Time/Space/ID markers).
      *   **Gate 4: Population Context.** Closed (Island) vs. Open (Mainland).
      *   **Gate 5: Data Quality.** Photo/Specimen > Genetic > Expert Sight > Novice Sight.
      *   **Gate 6: The Human Call.** Explicitly mark where the human decides risk tolerance.

  5.  **Addressing the Specific Hard Cases:**
      *   *3000 Photos:* Fail Gate 2 (Relevance). Zero weight.
      *   *Negative Records:* Distinguish "Passive" (I walked by) vs. "Active" (I looked for ravens for an hour). Only Active gets weight.
      *   *Dependence:* Count unique individuals, not submissions.
      *   *Genetics:* High reliability for genotype, but needs phenotype link. Treat as high-quality confirmation, not falsification (unless allele implies pale).

  6.  **Running the Test Cases:**
      *   *Case 1 (Pale Raven):* High relevance, low reliability (mediocre photo, contested ID). Needs the "Human Call" for acceptance.
      *   *Case 2 (3000 Shoes):* Zero weight. Explain why (infinite set).
      *   *Case 3 (9000 Black Ravens):* Diminishing returns. At some point, stop collecting. Be honest.

  7.  **Addressing Limitations:**
      *   Can't assess distribution trends directly.
      *   Can't replace statistical modeling.
      *   Can't solve the philosophical paradox, only manage it pragmatically.

  8.  **Refining the Tone:**
      *   Avoid academic jargon.
      *   Speak biologist-to-biologist.
      *   Acknowledge the frustration with the paradox.
      *   Ensure the "Human Call" steps are bold and clear.

  9.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the math too hard?
      *   *Fix:* Use categories (High/Med/Low/None) instead of numbers.
      *   *Critique:* Did I address the 40-year inconsistency?
      *   *Fix:* Yes, by distinguishing "Opportunity" vs. "Effort." 40 years implies high Opportunity + implied Effort. A single negative record is low Effort.
      *   *Critique:* Is the definition check clear?
      *   *Fix:* Make it Step 0. If the field guide says "Ravens are black," you can't use observations to prove it. You need genetics or a revised definition.

  10. **Final Polish:** Check against all constraints (10 mins, no library, specific cases, limitations). Ensure the "White Shoe" issue is crushed firmly but logically. (The key is *probability space*, not just logic).

  *(Self-Correction on the "White Shoe" logic)*: I need to be careful not to just say "it's stupid." I need to explain *why* it gets zero weight in this procedure. It's about the *ratio of effort to information gain*. Observing a shoe tells you nothing about the raven population density or variance. Observing a raven does. I will frame this as "Information Density."

  *(Self-Correction on Negative Records)*: The user says "I looked at point 47 for an hour" gets zero weight. But 40 years of no reports counts. The distinction is *Survey Effort*. A casual "I didn't see one" is noise. A protocol-driven "I searched for 1 hour" is data. The procedure must require a "Search Protocol" tag for negative records to count.

  *(Final Plan)*:
  1.  Introduction: Acknowledge the paradox and the practical need.
  2.  The Protocol (The "VWP"): Step-by-step flow.
  3.  The Hard Cases: How the VWP handles them.
  4.  The Test Runs: Applying VWP to the 3 scenarios.
  5.  Limitations: What this tool doesn't do.
  6.  Closing: Encouragement.

  Let's write it.cw
answer: |-
  Here is a decision procedure designed for your verification team. It is built to bypass the philosophical trap while respecting the biological reality of your atlas. It treats the "Raven Paradox" not as a logic puzzle to be solved, but as a data-management problem to be contained.

  ### The Verification Weight Protocol (VWP)

  **Purpose:** To assign an evidential weight class to a single submission regarding a universal generalization (e.g., "All ravens in Region X are black").
  **Time Budget:** 10 minutes per record.
  **Math Required:** None beyond comparing numbers and simple ratios.

  #### Step 0: The Definition Trap (Falsifiability Check)
  *Before looking at the data, look at the field guide.*
  *   **Question:** Is the trait in question (e.g., "black plumage") a *defining diagnostic characteristic* of the species in your guide, or is it a *variable trait*?
  *   **Rule:** If the guide says "A raven is a large, all-black corvid," then a pale bird is **not a raven** by definition. You cannot test the hypothesis "All ravens are black" with observation data alone, because any pale bird you find will be identified as a crow, hybrid, or albino raven *before* it enters your dataset.
  *   **Action:**
      *   If **Yes (Defining):** Stop. Mark hypothesis as "Untestable by Observation." Assign **Weight 0**. (You need genetic data to fix this).
      *   If **No (Variable):** Proceed to Step 1. (Assume for this procedure that "raven" is defined by genetics/structure, and color is a trait).

  #### Step 1: The Relevance Filter (The "White Shoe" Test)
  *Does this record narrow the search space for a counter-example?*
  *   **Question:** What did the observer intend to find, and what did they find?
  *   **Rule:**
      *   **Category A (Direct Test):** A record of the target species (Raven). **Proceed.**
      *   **Category B (Targeted Negative):** A record stating "Searched for Ravens for [Time] at [Location], found None." **Proceed to Step 4.**
      *   **Category C (Irrelevant Negative):** A record of a non-target object (Shoe, Sheep, Heron) submitted as "Not a Raven." **STOP.**
  *   **Action for Category C:** Assign **Weight 0**.
      *   *Reasoning:* The set of "non-black non-ravens" is effectively infinite. Recording them does not reduce the uncertainty about the raven population. It is data spam.
      *   *Instruction to Volunteer:* "Thank you, but we only record birds or targeted search effort. General objects do not help test species hypotheses."

  #### Step 2: Independence Check (The "Landfill" Test)
  *Are we counting birds or clicks?*
  *   **Question:** Is this record a distinct individual from records already in the database?
  *   **Criteria for Distinct Individual:**
      *   Separated by >24 hours OR >5km (adjust for species range).
      *   OR clearly distinct marking (band combo, unique molt pattern).
  *   **Action:**
      *   If **Duplicate:** Merge with existing record. Do not add weight.
      *   If **Distinct:** Proceed to Step 3.
      *   *Judgment Call:* If 14 people photograph one bird at a landfill, that is **one** data point, not 14. The verification coordinator decides the "Individual ID."

  #### Step 3: Data Quality & Reliability
  *How much do we trust the observation?*
  *   **Assign a Reliability Score (R):**
      *   **R=3:** Specimen or High-Res Photo + Genetic Confirmation.
      *   **R=2:** High-Res Photo or Audio + Expert ID.
      *   **R=1:** Sight record by Experienced Volunteer.
      *   **R=0.5:** Sight record by Novice / Mediocre Photo.
  *   **Adjustment for Contestation:** If committee members dispute the ID, downgrade R by 1 level (min 0.5).

  #### Step 4: Population Context (Closed vs. Open)
  *How much does this record tell us about the whole?*
  *   **Question:** Is the population "Closed" (Island, banded, census known) or "Open" (Mainland, unknown N)?
  *   **Action:**
      *   **Closed:** A single negative record (searched, didn't find) has **High Weight**. A single positive record (found pale bird) is **Definitive**.
      *   **Open:** A single negative record has **Low Weight**. A single positive record is **High Weight**.
      *   *Reasoning:* In a closed population of 200, checking 10 birds is 5% of the population. On the mainland, checking 10 birds is 0.0001%.

  #### Step 5: The Human Call (Risk Tolerance)
  *This is where science meets policy.*
  *   **Instruction:** The VWP calculates a *suggestion*. The Coordinator makes the *decision*.
  *   **The Threshold:**
      *   To **Confirm** "All are Black": You need cumulative high reliability + high coverage (see Step 6).
      *   To **Falsify** "All are Black": You need **One** R=3 record of a pale bird (unless Step 0 applies).
  *   **Explicit Judgment:** If the data is ambiguous (e.g., R=0.5 pale bird), you must decide: *Are we willing to change the atlas statement based on this?*
      *   If **Yes:** Enter record, flag hypothesis as "Challenged."
      *   If **No:** Archive record, flag as "Insufficient Evidence."
      *   *Requirement:* You must write one sentence explaining the risk tolerance. (e.g., "Rejected because a single mediocre photo risks reputation more than it aids accuracy.")

  #### Step 6: The Diminishing Returns Cap
  *When to stop counting confirming records.*
  *   **Rule:** After 100 distinct individuals (R≥2) confirming the trait in an Open Population, additional confirming records receive **Weight 0** for the hypothesis test.
  *   **Reasoning:** Statistical confidence plateaus. Further records aid distribution mapping, not trait generalization.
  *   **Action:** Mark record as "Distribution Data Only."

  ---

  ### Handling Your Hard Cases

  **1. The 3,000 Non-Black Objects**
  *   **VWP Step 1:** Fails Relevance Filter (Category C).
  *   **Decision:** **Weight 0.** Do not enter as hypothesis evidence.
  *   **Reasoning:** Logically, a white shoe confirms "All non-black things are non-ravens." Practically, the "cost" of verifying a shoe is the same as a bird, but the "information gain" regarding the raven population is zero. We are modeling bird populations, not the universe of objects.
  *   **Volunteer Instruction:** "We appreciate the enthusiasm, but we cannot process non-bird records for species hypotheses. Please focus on bird surveys."

  **2. Negative Records (The Inconsistency)**
  *   **The Problem:** "I looked for an hour" = 0 weight, but "40 years of no reports" = Evidence.
  *   **The Fix:** The VWP distinguishes **Passive Absence** from **Active Survey**.
      *   "I walked past point 47" is Passive. Weight 0.
      *   "I surveyed point 47 for 60 minutes using protocol X" is Active. Weight >0.
      *   "40 years of no reports" is treated as **Cumulative Passive + Implied Active Effort**.
  *   **Resolution:** It is not inconsistent if you treat the 40-year gap as a meta-data point representing *thousands of hours of implied active survey* by the birding community. A single volunteer's hour is negligible compared to 40 years of community effort.
  *   **Procedure:** Single negative records only get weight if tagged "Targeted Survey."

  **3. Dependence (14 photos of 1 bird)**
  *   **VWP Step 2:** Independence Check.
  *   **Decision:** Count as **1 Individual**.
  *   **Reasoning:** Evidence weight comes from sampling the *population*, not sampling the *camera shutters*. 14 photos of one bird tells you nothing about the variance of the other 199 birds on the island.

  **4. Definitions (Circularity)**
  *   **VWP Step 0:** Definition Trap.
  *   **Decision:** If "black" is in the ID key, you cannot use atlas records to prove "all ravens are black."
  *   **Action:** You must separate **Identification** from **Trait Recording**. Volunteers must identify the bird by structure (tail, bill, size) *ignoring color*, then record color as a separate data field. If you cannot do this, the hypothesis is unfalsifiable by your current method.

  **5. Genetics**
  *   **VWP Step 3:** Data Quality.
  *   **Decision:** Genotype = R=3 (High Reliability).
  *   **Caveat:** Only if the allele is known to correlate 100% with the phenotype. If it's a "dark-morph allele," it confirms the bird *could* be dark, but doesn't prove it *is* dark (penetrance issues). Treat as strong supporting evidence, not definitive proof of phenotype.

  ---

  ### Test Runs

  #### Case 1: The Single Pale Raven (Landfill, November)
  *   **Inputs:** 1 Record. Photo (Mediocre). ID Contested. Rule requires 2 observers.
  *   **VWP Step 0:** Assume "black" is not a strict definition (otherwise stop).
  *   **VWP Step 1:** Direct Test (Category A). **Pass.**
  *   **VWP Step 2:** Distinct Individual. **Pass.**
  *   **VWP Step 3:** Reliability. Photo = R=2. Contested = Downgrade to **R=1**.
  *   **VWP Step 4:** Open Population (Mainland).
  *   **VWP Step 5 (Human Call):**
      *   *Hypothesis:* "All ravens are black."
      *   *Evidence:* One R=1 pale bird.
      *   *Rule:* Committee wants 2 observers.
      *   *Decision:* **Reject for Hypothesis Change.** Archive as "Unverified Anomaly."
      *   *Reasoning:* The risk of a false positive (crow, lighting, bleach) outweighs the evidential value of a single low-quality record. We are not willing to stake the atlas statement on one mediocre photo.
      *   *Action:* Request re-survey of landfill.

  #### Case 2: The 3,000 Non-Black Objects
  *   **Inputs:** 3,000 Records. Shoes, Sheep, etc.
  *   **VWP Step 1:** Relevance Filter. **Fail (Category C).**
  *   **Decision:** **Weight 0.**
  *   **Action:** Bulk reject. Send template email: "These records do not test raven hypotheses. Please submit bird data only."
  *   **Reasoning:** Processing these consumes 300 hours of volunteer time for zero gain in biological understanding. It violates the efficiency constraint of the atlas.

  #### Case 3: 9,000 Black Raven Records (40 Years)
  *   **Inputs:** 9,000 Records. All Black.
  *   **VWP Step 6:** Diminishing Returns Cap.
  *   **Analysis:**
      *   First 100 distinct individuals (R≥2): **High Weight.** Established the baseline.
      *   Next 1,000 records: **Medium Weight.** Confirmed range stability.
      *   Remaining 7,900 records: **Weight 0** for the hypothesis "All are black."
  *   **Honest Answer:** You should **stop collecting these records for the purpose of this hypothesis.**
  *   **Reasoning:** You have passed the point of diminishing returns. The probability that the 9,001st raven is pale is not meaningfully reduced by checking it, given the first 9,000 were black (assuming random sampling).
  *   **Action:** Change the data collection protocol. Stop asking for "Raven Sighting" checklists unless they include *search effort for morphs* or are in *under-sampled regions*. Continue collecting for *population trend*, but decouple it from the *color hypothesis*.
  *   **Statement:** "We have sufficient evidence to treat 'black' as the default morph. Future records will only be weighted for color hypothesis if they occur in new geographic grids or are explicitly searching for morph variants."

  ---

  ### What This Procedure Cannot Do

  You asked for honesty about limitations. Here they are:

  1.  **It Cannot Solve the Logic Paradox:** The VWP admits that a white shoe *is* logically confirming evidence, but explicitly assigns it **Weight 0** for practical reasons. It prioritizes *biological utility* over *logical purity*. If a philosopher challenges you, admit this: "We optimize for information density, not logical completeness."
  2.  **It Cannot Rate Multi-Hypothesis Value:** A record of a pale raven might be Weight 0 for "All ravens are black" (if rejected as misID), but Weight 10 for "Ravens use landfills in November." This procedure rates the record *only* against the specific generalization being tested. You need a separate workflow for distribution/trend analysis.
  3.  **It Cannot Quantify "Zero":** The procedure can tell you when to stop collecting confirming data, but it cannot prove a negative with 100% certainty in an open population. It can only say "Evidence is sufficient for management purposes."
  4.  **It Relies on Human Consistency:** The "Human Call" (Step 5) is the weak point. Two coordinators might weigh the same mediocre photo differently. You need a quarterly calibration meeting where your team reviews 10 borderline cases together to keep the "Risk Tolerance" aligned.

  ### Final Argument for the Procedure

  This protocol works because it treats **evidence as a resource with a cost.**

  The Raven Paradox fails in the field because it assumes all data is free. It isn't. Your volunteers' time is the currency. Spending currency on shoes buys no information about ravens. Spending currency on the 9,000th black raven buys negligible information. Spending currency on a targeted search for a pale raven on the offshore island buys high information.

  The VWP forces your team to spend the currency where the return is highest. It admits that "40 years of no reports" is valuable only because it represents a massive, uncosted investment of community effort, whereas a single "I saw nothing" is a cheap investment.

  It gives you the authority to tell the volunteer with the 3,000 photos "No," and the authority to tell the committee "We have enough black raven data; stop asking for it." It moves you from verifying *records* to verifying *knowledge*.
