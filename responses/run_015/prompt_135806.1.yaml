answer: |-
  ### Seminar Plan: The Jade Case and Semantic Externalism

  **Target:** Third-year undergraduates (Intro Phil Language completed; no prior Putnam/Twin Earth).
  **Duration:** 90 Minutes.
  **Core Case:** The historical classification of Jade (Jadeite vs. Nephrite).

  ---

  ### I. The Explanatory Arc & Conceptual Dependency

  **1. The Target: Methodological Internalism**
  Before the Jade case can function, you must explicitly articulate the thesis it is designed to undermine. Do not treat Internalism as a straw man; present it as the intuitive default position these students likely hold.
  *   **The Thesis:** "Meanings are in the head." Specifically, the reference of a natural kind term is fixed by the descriptive criteria (sense) the speaker associates with the term (e.g., "green, hard, semi-precious stone"). If two speakers share the same internal descriptive criteria, they mean the same thing.
  *   **The Dependency:** Students must accept that if Internalism is true, the 1700 speaker and the 1950 layperson (who share ignorance of chemistry and rely on visual properties) *must* mean the same thing by "jade." The seminar's goal is to show why this intuition fails.

  **2. Why Jade Serves Better Than Water (for this specific cohort)**
  *   **Avoiding Modal Distractors:** The Water/XYZ case relies on a counterfactual world (Twin Earth) that does not exist. Students often dismiss this as "science fiction" or get bogged down in the physical possibility of XYZ. Jade is an *actual* historical discovery. It grounds the argument in the actual world, forcing students to confront how reference works in *our* linguistic practice, not a hypothetical one.
  *   **The "Hidden Structure" Lesson:** Water (H2O) confirms a single underlying essence. Jade (Jadeite/Nephrite) reveals a *lack* of single essence. This is pedagogically superior for a first pass because it breaks the Internalist link between "coherent concept in the head" and "successful reference." The 1700 speaker had a coherent concept (one kind), but the world did not support it. This forces the realization that the *world* constrains reference, not just the mind.
  *   **Required Elements:**
      *   **Shared Ignorance:** You must stipulate that both the 1700 speaker and the 1950 layperson possess identical internal descriptions (visual/tactile properties) and zero knowledge of silicate chemistry.
      *   **Perceptual Indiscernibility:** It must be clear that no amount of 1700-era inspection could distinguish the minerals. This blocks the Internalist retreat that "they just had better descriptions."
  *   **Deliberate Omission:** Do not introduce the 1950 *geologist* as the primary comparator. Compare the 1700 layperson to the 1950 layperson. The difference in meaning must stem from the *environmental facts* available in their respective eras (the actual extension of the public term), not from individual expertise.

  **3. The Arc Sequence**
  1.  **Establish the Internalist Baseline:** Elicit the intuition that if I imagine a green stone and you imagine a green stone, we mean the same thing.
  2.  **Introduce the Historical Fact:** Present the 1700 consensus ("Jade is one stone") vs. the 1950 discovery ("Jade is two distinct minerals").
  3.  **The Pivot Question:** "Did the 1700 speaker refer to a natural kind?"
      *   If *Yes*: They referred to something that doesn't exist (since there are two kinds).
      *   If *No*: Their reference was determined by the actual samples (Jadeite + Nephrite), regardless of their belief in unity.
  4.  **The Externalist Conclusion:** Reference is mediated by the causal structure of the environment. The 1700 speaker's term "latched onto" whatever was in the ground, even if their internal concept was wrong about the unity of that stuff.

  ---

  ### II. Misconception Map

  Students will likely attempt to preserve Internalism by shifting the goalposts. You must intercept these moves at specific points.

  **1. Misconception: The "Scientific Authority" Trap**
  *   **The Error:** Students will argue that meaning *changed* in 1950 because scientists *stipulated* a new definition. They will view externalism as the claim that "experts fix meaning for laypeople."
  *   **Interception Point:** Immediately after revealing the 1950 chemical distinction.
  *   **Strategy:** Distinguish between *fixing* reference and *discovering* reference. Ask: "Did the chemists change what the 1700 speakers were pointing at, or did they discover what those speakers had been pointing at all along?" Emphasize that externalism claims the 1700 reference was *already* determined by the minerals, even if the speakers didn't know it. Scientists reveal the extension; they do not create it retroactively.

  **2. Misconception: The "Loss of Cognitive Access" Worry**
  *   **The Error:** Students will conclude that if meaning is external, speakers do not know what they mean. "If I don't know the chemistry, I don't know my own concept."
  *   **Interception Point:** When discussing the 1950 layperson who is internally identical to the 1700 speaker.
  *   **Strategy:** Distinguish *knowing the concept* from *knowing the essence*. Affirm that the speaker knows they are talking about "jade" (the concept is transparent), but they do not necessarily know the *conditions of application* (the extension). Use the analogy of knowing you are pointing to a "tree" without knowing the biological criteria for "tree." Externalism limits omniscience about extension, not access to intention.

  **3. Misconception: The "Empirical Geology" Confusion**
  *   **The Error:** Students will treat the seminar as a lesson in mineralogy or history of science. They will argue about whether jadeite and nephrite are *actually* different enough to count as different kinds.
  *   **Interception Point:** During the Q&A or final synthesis.
  *   **Strategy:** Re-frame the case as *modal*. Ask: "If it turned out tomorrow that Jadeite and Nephrite had the exact same molecular structure, would the 1950 distinction have been a mistake?" (Yes). "If it turned out they are different, was the 1700 unity a mistake?" (Yes). The point is not the geology, but that *whatever the geology turns out to be* dictates the reference, not the 1700 description. The argument is about the *dependency relation*, not the mineral data.

  ---

  ### III. Concluding Check (The Diagnostic Question)

  Do not ask them to define externalism. Ask them to apply the dependency relation to a novel case.

  **The Question:**
  > "Imagine we discover a third mineral, 'Jadeite-Z,' in 2025. It is visually indistinguishable from Jadeite and Nephrite but has a unique chemical structure. According to the externalist view we discussed, did the 1700 speaker refer to Jadeite-Z when they said 'jade'?"

  **Diagnostic Criteria:**
  *   **Memorized Slogan (Failure):** "No, because meanings aren't in the head, so the 1700 speaker couldn't mean something they didn't know." (This confuses externalism with skepticism or internalism).
  *   **Genuine Grasp (Success):** "Yes (or 'It depends on the causal chain'). If the 1700 samples included Jadeite-Z, then their term referred to it, because reference is fixed by the actual stuff in the environment, not their knowledge of it. The discovery reveals what they meant all along."
  *   **Nuanced Success:** "Yes, provided 'jade' functions as a term for the macroscopic kind encompassing all underlying structures found in the original samples. The extension expands with discovery because the reference was always to the *stuff*, not the *description*."

  ---

  ### IV. Explicit Exclusions & Justification

  To maintain the 90-minute focus and the clarity of the "Jade" argument, you must explicitly bracket the following. Do not merely skip them; tell the students *why* you are skipping them to prevent the theory from looking truncated.

  **1. The Division of Linguistic Labor**
  *   **Omission:** Do not discuss Putnam's claim that reference is fixed by experts to whom laypeople defer.
  *   **Justification:** "We are isolating the *metaphysical* relation between word and world today. Introducing the social mechanism of experts might suggest that externalism is just a sociological claim about authority. We want to establish first that the *environment* fixes reference, before asking *how* the community manages that link."

  **2. Burge's Social Externalism (The Arthritis Case)**
  *   **Omission:** Do not introduce cases where the environment is identical but the *social* usage differs.
  *   **Justification:** "Burge's argument shows that meaning depends on community usage. Putnam's argument (which we are studying) shows meaning depends on *physical nature*. Mixing them today would blur the distinction between physical externalism and social externalism. We are focusing strictly on the physical/natural kind aspect."

  **3. Narrow vs. Wide Content**
  *   **Omission:** Do not introduce the technical psychological debate over whether mental states have content that supervenes on the brain.
  *   **Justification:** "That debate concerns the philosophy of mind and psychology. Our focus today is strictly philosophy of *language* and *reference*. We are asking what determines the extension of a term, not necessarily the full nature of the mental state accompanying it. Keeping this distinction clear prevents category errors."

  **Closing Note to Instructor:**
  By excluding these elements, you present Externalism not as a fragmented collection of thought experiments, but as a focused argument about the *dependency of reference on reality*. This makes the theory appear robust and precise, rather than arbitrarily limited.
