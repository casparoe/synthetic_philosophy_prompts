      *   *Distortion:* DB implies a stable storage layer. Brain is dynamic/associative. DB implies a schema. Brain is content-addressable/parallel.
      *   *No Expression:* Qualia (the "what it is like"). The DB models *information*, not *experience*. This is the Hard Problem residue. Dennett denies the Hard Problem, which is why the analogy works so well for him but might feel unsatisfying for the user's intuition.

