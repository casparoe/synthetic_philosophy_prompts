answer: |-
  1. In the standard mapping, the stage is the global workspace, the spotlight is attention, and the audience represents unconscious modules receiving information rather than a homunculus.
  2. The theater metaphor breaks by visually implying a viewer is needed to see the light, but GWT claims the broadcasting itself constitutes consciousness without anyone watching.
  3. Her conclusion does not survive removing the audience because denying a viewer does not logically prove there is no subjective feeling inherent to the neural activity itself.
  4. A better picture is a distributed network hub where signal routing equals awareness, removing the visual imagery that mistakenly suggests a separate observer is required.
  5. No-report paradigms hurt her position because they attempt to isolate subjective feeling from broadcasting, suggesting the phenomenal glow might exist independently of the workspace.
