  ok so my psych teacher is really into the theater picture for global workspace theory -- stage, spotlight, audience, all the stuff backstage that never gets lit up -- and last week she pushed it further than our textbook does. she said if the workspace story is right then being conscious just is getting lit up on the stage, so any phenomenal glow over and above being broadcast is a made up extra with nothing behind it. I wrote down that theres no audience, just the stage, and now I cant tell if thats a real argument or just her being dramatic. she also mentioned that some labs now try to run the whole thing with no reports from the person at all, to pull the broadcasting apart from the feeling part, which honestly made it worse. audit it for me: what is supposed to map onto what, where does the mapping actually break, and what does the theater quietly sneak in that global workspace theory doesnt have. then tell me whether her conclusion survives once the audience is gone, and if it doesnt, what a better picture would be. and how much does the no-report stuff help her or hurt her?

