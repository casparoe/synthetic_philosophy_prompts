          *   Case B: Killing someone (in self-defence / mercy killing).
          *   *Problem:* Generalist says "It's not killing, it's *murder*."
      *   *The Solution:* We need a feature that is *intrinsically* neutral but takes valence from the context, OR a feature that is usually positive but becomes negative without a *new* descriptive feature.
