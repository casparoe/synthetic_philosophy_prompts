      *   I need to tell the user that while their logical order is correct, the *teaching* order must start with the example to generate the intuition, then map it to the Metaphysical claim.

      *(Refining Misconceptions)*: The "Silencing vs Defeating" point is crucial. I need to make sure the user knows *why* it matters (it blocks the 'exception clause' move).

      *(Refining Closing Question)*: Needs to be sharp. "If principles don't determine the verdict, what does?"

  8.  **Final Polish:** Check British spelling (programme, centre, defence, etc.). Ensure conciseness.

