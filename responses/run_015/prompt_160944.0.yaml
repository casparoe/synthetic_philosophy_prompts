      *   *Criteria:* Same consideration, flips valence, same thin description, resistant to: (1) Deny flip, (2) Redescription (adding hidden variables), (3) Exception clause.
      *   *User's Idea:* Funny joke at a funeral. (Weakness: Generalist says "It's not the funniness, it's the funniness + distress").
      *   *Need:* A case where the *very same feature* counts for the act in Case A and against the act in Case B, without adding a new feature to explain the flip.
