          *   *Particularist:* The consideration "I promised" is present in both. In B, it doesn't count. In C (Promise to meet to help commit a crime), "I promised" might be a reason *not* to do it (if keeping it implicates you).
          *   *Actually, the "Amusement" case is cleaner for valence flip.*
          *   Case 1: Amusement at a comedy show. (Reason to stay).
          *   Case 2: Amusement at a funeral (the user's idea).
          *   *How to save it:* Insist the description is *just* "It amuses me".
          *   *Generalist Escape:* "The reason is 'It amuses me *appropriately*'."
          *   *Particularist Defense:* 'Appropriately' is not a descriptive feature of the act, it's an evaluation. You can't build the evaluation into the reason without circularity.
          *   *Decision:* I will recommend the **"That it would amuse me"** example but specify the *constraint*: The description must remain purely psychological/phenomenological, not normative. I will explain *why* the Generalist's redescription fails (it begs the question).

  4.  **Deconstruct Requirement 3: Misconceptions**
      *   1. Particularism = Relativism/Anything Goes. (Head off: It's about reasons, not truth conditions. Objective facts still exist).
      *   2. Holism = Mere Context Sensitivity. (Head off: Distinguish 'defeasibility' from 'holism'. Generalists allow defeasibility; Particularists deny invariance).
      *   3. No Principles = No Disagreement. (Head off: We argue by analogy and salience, not subsumption).
      *   4. Silencing vs. Defeating = Relabelling. (Head off: Defeating = outweighed. Silencing = no weight at all. Crucial for the 'exception clause' dodge).

  5.  **Deconstruct Requirement 4: Closing Question**
      *   Must test the thesis, not vocabulary.
      *   Idea: Ask them to construct a principle that survives the example, or ask them to adjudicate a disagreement without one.
      *   Better: "If you were drafting a Code of Conduct, would you write rules or train judgement? Why?" (Too practical).
      *   Best: "Imagine two lawyers agree on all the facts of a case but disagree on the outcome. If Generalism is true, what *must* be the source of their disagreement? If Particularism is true, what *could* be the source?"

