answer: |-
  Here is the plan for your 45-minute slot.

  ### 1. The Spine: Order and Dependencies
  Your intuition on the logical order is correct, but for first-years, you cannot start with the metaphysics. You must generate the intuition first, then label the claims.

  **The Teaching Order:**
  1.  **The Phenomenon (5 mins):** Present the example. Elicit the intuition that the *same* feature counts differently.
  2.  **The Metaphysical Claim (15 mins):** Holism. (Must a reason function invariantly?) This is the foundation. If this falls, Particularism dies.
  3.  **The Epistemological Claim (15 mins):** Principles. (Do we need principles to judge?) This depends on the Metaphysical. If reasons are holistic, principles cannot be the *source* of correctness, though they might be summaries.
  4.  **The Explanatory Claim (10 mins):** Disagreement and Teaching. (Can we argue without principles?) This depends on the Epistemological. If principles don't determine judgement, how do we justify it?

  **Dependencies:**
  *   **Metaphysical is the root.** If the student concedes that a consideration *must* have the same valence in relevantly similar cases (Generalism), the debate ends. You must secure Holism first.
  *   **Epistemological follows.** Only if reasons are holistic does it follow that principles cannot be the primary tool of moral knowledge.
  *   **Explanatory is the consequence.** The worry that 'anything goes' only arises once you remove principles as the epistemological anchor.

  ### 2. The Example: "That I Promised"
  Do not use the funeral joke; the 'harm' variable is too easy to isolate. Use **promising**, as it mirrors legal obligation, but police the description ruthlessly.

  **The Cases:**
  *   **Case A:** I promised to meet you for coffee. I don't go.
      *   Consideration: *That I promised.*
      *   Valence: **Against** the action (a reason to go).
  *   **Case B:** I promised to help you hide a stolen car. I don't go.
      *   Consideration: *That I promised.*
      *   Valence: **For** the action (a reason *not* to go / no reason to go).

  **Why it works:**
  The descriptive feature ('I uttered words creating an expectation of performance') is identical. The valence flips.

  **Policing the Generalist Escape Moves:**
  You must explicitly forbid three moves in the seminar room:
  1.  **Deny the Flip:** "In Case B, you still have a reason to go, it's just outweighed."
      *   *Block:* Ask if the promise adds *any* weight in Case B. If they say no, the reason has been silenced, not outweighed.
  2.  **Redescription:** "The reason wasn't 'I promised', it was 'I made a *valid* promise'."
      *   *Block:* This is the critical moment. Ask: "What makes it valid?" If they say 'It's morally permissible', point out they have built the conclusion ('permissible') into the premise. The principle becomes 'Do what is morally permissible', which is empty. 'Validity' is an evaluation, not a descriptive feature.
  3.  **Exception Clause:** "The principle is 'Keep promises, unless it's to hide a car'."
      *   *Block:* Ask how many exceptions we need before the rule is useless. If the context determines the exception, the context is doing the work, not the rule.

  **What the example must lack:**
  It must lack any *non-evaluative* difference that explains the flip. If you introduce 'harm' or 'illegality' as a descriptive feature, the Generalist wins. You must insist the *only* descriptive difference is the context, not a new property of the act.

  ### 3. Misconceptions: Order and Defusions
  Address these as they naturally arise during the discussion, in this order:

  1.  **"Holism is just context-sensitivity."**
      *   *Arrival:* Early, when discussing the example.
      *   *Head-off:* Distinguish **defeasibility** (Generalist) from **holism** (Particularist). Generalists accept a reason can be *outweighed* by context. Particularists claim a reason can change *valence* or be *silenced* (zero weight) by context. It is a difference in kind, not degree.
  2.  **"Particularism is relativism / anything goes."**
      *   *Arrival:* When you remove principles.
      *   *Head-off:* Particularism is not subjectivism. The facts are objective. It is not 'I feel like it'; it is 'This feature *is* a reason here'. There is a truth of the matter, it just isn't codifiable in a rule.
  3.  **"Without principles, there's nothing to say in a disagreement."**
      *   *Arrival:* During the Explanatory phase.
      *   *Head-off:* We argue by **analogy** and **salience**, not subsumption. We point to features: 'Look at *this* aspect of the case.' Law students understand distinguishing cases without overruling the precedent.
  4.  **"Silencing vs. Defeating is just relabelling."**
      *   *Arrival:* When discussing the 'exception clause' escape move.
      *   *Head-off:* This is real work. If a reason is *defeated*, it still has weight (it contributes to the calculus). If *silenced*, it has no weight. If 'I promised' is silenced in Case B, you cannot trade it off against other reasons. This blocks the Generalist from saying the principle still applies but is overridden.

  ### 4. The Closing Question
  Do not ask them to define the terms. Test their grasp of the *consequence* of the thesis.

  **"Imagine two judges agree on all the facts of a case and agree on the relevant rules, but disagree on the verdict. If Generalism is true, one of them *must* be making a logical error. If Particularism is true, what is the nature of their disagreement?"**

  *   *Desired Answer:* On Generalism, one has misapplied the rule. On Particularism, they disagree on the **salience** or **import** of the features in this specific context. It shifts the error from logic to perception/judgement.

  ### 5. What to Refuse to Cover
  You have 45 minutes. Be ruthless. Explicitly state at the start that you are bracketing the following to avoid category errors:

  1.  **The Metaphysics of Reasons:** Whether reasons are psychological states or facts. Treat 'considerations' neutrally.
  2.  **Supervenience:** The claim that moral properties supervene on natural properties. This is a separate debate; Particularism is compatible with supervenience.
  3.  **Moral Ontology:** Realism vs. Anti-Realism. Particularism is a claim about the *structure* of reasons, not their existence.
  4.  **Specific Normative Theories:** Do not let them drift into Utilitarianism vs. Kantianism. This is structural jurisprudence, not substantive ethics.

  **Timing Note:** Keep the example tight (5 mins). Spend the bulk of the time (20 mins) fighting the 'Redescription' escape move on the Metaphysical claim. That is where the battle is won or lost. If they accept Holism, the rest follows.
