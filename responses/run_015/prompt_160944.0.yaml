      *   Case A: Breaking a promise to meet for coffee. (Reason Against).
      *   Case B: Breaking a promise to meet a murderer. (Reason For).
      *   *Generalist:* "It's not breaking a promise, it's breaking a *binding* promise."
      *   *Particularist:* 'Binding' is the conclusion, not the premise.
