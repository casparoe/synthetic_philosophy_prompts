prompt: |-
  Hey, hoping you can help with something I have to prep for Thursday. We run a small reading group on the frame problem — mostly philosophy-of-AI people plus one roboticist who keeps insisting the whole thing is a pseudo-problem. Our supervisor has been ruling, case by case, on whether a given system "faces the frame problem," and I want to guess what she'll say about the case I picked for next week before I build a whole session around it.

  Her verdicts so far, with the one-line reason she gave each time:

  1. A blocks-world planner of the old STRIPS kind, with explicit frame axioms — yes. "That's what the thing was named for."
  2. A Deep Blue style chess engine — no. "Chess is computationally nasty, but nothing is at issue about relevance; the rulebook fixes what can matter."
  3. A thermostat — no. "Nothing there for anything to be relevant to."
  4. A frog whose visual system fires on small moving dark specks — no. "The architecture already settled it."
  5. A scientist trying to work out which of her background beliefs bear on an anomalous experimental result (Fodor's central-cognition case, beliefs being holistic in that irritating way) — yes. "This is the one that actually worries me."
  6. An exact Bayesian agent doing conditioning over a hand-specified hypothesis space — no. "The model already says what's independent of what; there's no question left to settle."
  7. A deep RL agent trained and evaluated in the same procedurally generated environment, reactive policy, no explicit belief store — no. "It never asks what's relevant, it just responds."
  8. A robot that has to work out that fetching the wagon its spare battery is sitting on will also bring along the bomb sitting on the wagon — yes.
  9. An experienced firefighter who backs out of a building moments before the floor goes, without being able to say why — no. "Absorbed coping; nothing was represented as a context-free fact and then re-contextualized."

  The case for Thursday: an LLM-based agent in a text-only household simulator. Pretrained transformer, no weight updates and no persistent memory during deployment. Each step it gets a long natural-language description of the room — a lot of it filler: wallpaper, furniture nobody will touch, a transcript of the last forty actions — and it produces chain-of-thought before naming an action. The tasks are built so relevance shifts mid-episode: the object that was a container in step 3 is a doorstop by step 9, and the mug it ignored for eight steps becomes the only thing that will hold the water.

  So: does she say this one faces the frame problem? I can see both pulls. It does run-time inference over explicitly stated information, with no encapsulation and no architecturally fixed answer about what matters (which pushes toward yes, like 1 and 8). But its sense of what matters was fixed during pretraining rather than at deployment, and it never revises a standing body of beliefs (which pushes toward no, like 4, 7 and 9).

  What I want, in this order:

  - Her rule (~150 words): the single rule about when a system faces the frame problem that fits all nine verdicts and the reasons she attached to them.
  - Rules that fit just as well (~150 words): other rules consistent with everything she's said so far but which come apart on Thursday's case, and what each of them predicts about it.
  - Your prediction (~120 words): yes or no, with rough confidence, which of the nine precedents is the closest analogue, and the one move in her reasoning that does most of the work in getting there.
  - The case that would settle it (~100 words): one further system I could put to her that would seperate the leading rules, and what each rule predicts about it. I'd rather have this then a general discussion — I need something I can actually put on the board.
