prompt: |-
  Hi — I'm the lead on a four-person data team at a regional hospital network. We run the merge layer that stitches patient charts together from four source systems (two legacy EHRs, a lab system, and a hand-entered intake tool) into the single chart clinicians actually read. We can't change the source systems; we only decide what the merged chart says and what gets shown.

  Our problem is contradictions. Maybe forty a day survive automated matching: a penicillin allergy in the old system and no known allergies in the new one; a medication that's active and discontinued as of the same date; two dates of birth; a consent flag that's yes in one place and no in another; a patient discharged from one service and admitted to another on the same day. Our rulebook right now is basically: take the more recent entry, unless the older one came from a clinician, in which case escalate — plus a hand-written per-field safety rule for about thirty fields (for allergies we keep the more alarming value, for everything else we take the newest). It's forty pages long and nobody trusts it. On top of that, compliance won't let us destroy anything: every conflicting value has to stay auditable, so "resolve it by dropping the loser" isn't available as a data operation, only as a display decision.

  I've been reading about paraconsistent logic and dialetheism and it feels like it's about exactly this — a logic where a contradiction doesn't let you derive everything, and the further claim that some contradictions are actually true — but I can't turn any of it into something my team can run. So: write me a decision procedure we can actually use.

  What I need:

  - The questions to ask in order, and what counts as a sufficient answer to each. We've got maybe three to five minutes per flag and the team are data stewards, not logicians, so it has to be a one-page thing for the ops wiki plus a laminated card.
  - Where the procedure stops with a no and refuses to auto-merge, and where it hands off to a human because the question is one of values rather than facts — our risk tolerance for a missed allergy is not the same as for a false one, and somebody has to own that choice explicitly rather than have it buried in a per-field rule.
  - A blast radius rule. When a field is in quarantine, which downstream values have to carry a marker saying they were computed from something contested, and when can we drop the marker? This is the bit I most expect you to get wrong or fudge, and it's the bit the forty-page rulebook is really about.
  - It has to work for someone who thinks a contradiction is always a sign of an error somewhere. Our compliance officer thinks the whole idea of accepting both values is mad, and I need something that doesn't depend on settling that. So: don't assume any contradiction is really true, but do say plainly whether there's a case where the dialetheist-sounding thing — both entries correct under two different rulebooks — actually shows up, and if it does, whether it should change what we do differently from the plain "we don't know which" case.
  - Two distinctions I think must survive the simplification: the one between an apparent contradiction that dissolves once you fix the time-slice, the granularity or the sense of the predicate (including the case where the two values are really contraries that could both be false rather than contradictories), and a real one; and the one between "we don't know which side is right" and "both sides are right." Tell me which distinctions you're deliberately throwing away, and why.
  - Where it's honest about being a judgment call dressed up as a procedure.

  Then run it on three real-shaped cases: (1) penicillin allergy documented in a 2011 intake note as a childhood rash, a 2019 allergy clinic test saying there's no penicillin allergy, and no known allergies entered by a resident in 2023; (2) an anticoagulant that's active in the medication list with a refill yesterday but discontinued because of bleeding in a discharge summary three days ago, with no reconciliation note; (3) a consent field where the patient signed a treatment consent and separately declined research use of their data, and the intake tool has a single yes/no box that got filled in twice with different values. I have a feeling your procedure is going to tell me to do something on the second one that my team will absolutely hate — say it anyway, and say what it costs.

  Finally: give me four or five one-line test cases I can use to check whether a new hire has actually understood the procedure, and tell me what the procedure can't do — the failures I should expect in six months that won't look like failures at first.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Context:**
      *   **Role:** Lead of a 4-person data team at a regional hospital network.
      *   **Task:** Manage the merge layer for patient charts (4 source systems: 2 legacy EHRs, lab, intake).
      *   **Problem:** Contradictions (approx. 40/day survive automation). Examples: allergies, meds, DOB, consent, admission/discharge.
      *   **Constraints:**
          *   Cannot change source systems.
          *   Compliance requires auditability (cannot delete data, only hide/resolve for display).
          *   Current rulebook is 40 pages, untrusted, complex.
          *   Team are data stewards, not logicians (need simple, actionable steps).
          *   Time limit: 3-5 minutes per flag.
          *   Compliance Officer skepticism: Hates the idea of "accepting contradictions" (dialetheism).
          *   Need to distinguish between "error/unknown" vs. "both true in different contexts."
          *   Need a "blast radius" rule for downstream data contamination.
      *   **Philosophical Angle:** User has been reading about paraconsistent logic/dialetheism but needs a *practical* decision procedure, not a philosophy lecture. They want to know if/where that logic actually applies practically.
      *   **Deliverables:**
          1.  Decision Procedure (One-pager + Laminated Card style).
          2.  Stop/Handoff criteria (Values vs. Facts).
          3.  Blast Radius Rule.
          4.  Honesty about judgment calls.
          5.  Distinctions kept vs. discarded.
          6.  Application to 3 specific cases.
          7.  Test cases for new hires.
          8.  Expected failures in 6 months.

  2.  **Deconstruct the Philosophical Angle (Paraconsistent Logic/Dialetheism):**
      *   *Theory:* Contradictions ($A \land \neg A$) don't explode (don't imply everything). Some contradictions might be true.
      *   *Reality in Healthcare:* Most contradictions are errors (data entry, timing, context). True dialetheias (both true simultaneously in the same context) are rare.
      *   *Practical Translation:* Instead of "Is this contradiction true?", ask "Does resolving this by picking one side cause harm?" and "Do we have enough context to know *why* they differ?"
      *   *Compliance:* We can't tell Compliance "Both are true." We must say "Context A says X, Context B says Y. For clinical safety, we display X."
      *   *Decision:* Don't sell it as "accepting contradictions." Sell it as "managing conflicting evidence without data loss." The "dialetheist" moment is acknowledging that *state* can be multifaceted (e.g., allergic to penicillin *and* tolerant to penicillin depending on dose/route/time), but the *display* must be safe.

  3.  **Drafting the Decision Procedure (The "One-Pager"):**
      *   Need a flowchart style logic.
      *   Step 1: Contextualize (Time, Source, Granularity).
      *   Step 2: Safety Check (Harm potential).
      *   Step 3: Resolution Strategy (Merge, Quarantine, Escalate).
      *   Step 4: Blast Radius (Tagging downstream).
      *   *Constraint:* 3-5 minutes. Keep it binary where possible.

  4.  **Addressing the "Blast Radius":**
      *   This is crucial. If an allergy is contested, does that flag the "Medication Reconciliation" status? Does it flag the "Discharge Summary"?
      *   Rule: If a field is `CONTESTED`, any derived field relying on it inherits `PROVENANCE_UNSTABLE`.
      *   Clearing the marker: Requires explicit human resolution or source system correction (which we can't force, so mostly human resolution).

  5.  **Addressing the Distinctions:**
      *   *Keep:* Error vs. Contextual Truth (e.g., discharged vs. admitted same day = transfer, not error).
      *   *Keep:* Unknown vs. Both Valid (e.g., Consent for Treatment vs. Research).
      *   *Discard:* Deep metaphysical truth. We don't care if reality is contradictory; we care if the *record* supports safe care.
      *   *Discard:* Nuanced probability. It's binary for the workflow: Safe to Show vs. Quarantine.

  6.  **Developing the Three Cases:**
      *   *Case 1 (Allergy):* 2011 (Yes), 2019 (No), 2023 (No).
          *   Analysis: Temporal evolution. 2019 test likely overrides 2011 anecdote. 2023 confirms.
          *   Action: Display "No Known Allergy" but keep 2011 note visible in history. Not a contradiction, it's a resolution.
      *   *Case 2 (Meds):* Active (refill yesterday) vs. Discontinued (bleeding, 3 days ago).
          *   Analysis: High risk. Active order contradicts clinical event.
          *   Action: **QUARANTINE.** Do not show as active. Flag for clinician review. This is the one the team will hate because it stops workflow.
      *   *Case 3 (Consent):* Treatment (Yes) + Research (No) vs. Intake (Yes/No box filled twice).
          *   Analysis: Schema mismatch. Two different consents mapped to one field.
          *   Action: Split the field (if possible) or default to "No" for research (safest) and "Yes" for treatment. Mark Intake source as unreliable for this field.

  7.  **Addressing Compliance & Dialetheism:**
      *   Compliance hates "Both are true."
      *   Reframe: "Both are *recorded*. We are displaying the *safest* interpretation while preserving the audit trail."
      *   True Dialetheia case: "Patient is pregnant" (Yes) and "Patient is male" (Transgender patient). Both records are "true" in different ontologies.
      *   Action: Display both with context labels. Don't force a binary.

  8.  **Expected Failures (6 Months Out):**
      *   Alert fatigue (too many quarantines).
      *   Clinicians ignoring the "Contested" flags.
      *   "Shadow IT" (clinicians creating workarounds).
      *   Drift in steward interpretation.

  9.  **Refining the Output Structure:**
      *   Start with the Procedure (The Card).
      *   Explain the Logic (The "Why").
      *   Run the Cases.
      *   Test Questions.
      *   Failure Modes.

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is the blast radius too aggressive?
      *   *Fix:* Make it tiered. Critical fields (Allergy, Meds) taint everything. Non-critical (Address) only taint direct derivatives.
      *   *Critique:* Is the dialetheism part too abstract?
      *   *Fix:* Ground it in "Contextual Validity."
      *   *Critique:* The user asked for a "One-page thing for the ops wiki plus a laminated card."
      *   *Fix:* Format it clearly as such.
      *   *Critique:* The user wants honesty about judgment calls.
      *   *Fix:* Add a "Escalation Triggers" section that explicitly says "If you feel uneasy, escalate."

  11. **Final Polish:** Ensure tone is professional, empathetic to the data stewards, and firm on safety. (Proceed to generate response).

  *(Self-Correction on Case 2)*: The prompt says "say it anyway, and say what it costs." I need to be very clear that quarantining an anticoagulant stops a prescription potentially needed, but showing it risks bleeding. The cost is clinical delay.

  *(Self-Correction on Dialetheism)*: I need to explicitly answer if "both entries correct under two different rulebooks" changes the action. Yes, it changes it from "Pick One" to "Display Both with Labels."

  *(Self-Correction on Blast Radius)*: The user expects me to fudge this. I must be specific. "If Field X is CONTESTED, Field Y (which calculates Z using X) is marked DERIVED_UNSTABLE."

  Let's assemble.cw
answer: |-
  Here is the decision procedure, the rationale, the case runs, and the failure analysis.

  ### Part 1: The Decision Procedure (The "Card")

  **Format:** This is designed to be printed front/back. Front is the flow; Back is the definitions and blast radius.

  #### FRONT: The 5-Step Contradiction Triage
  *Time limit: 5 minutes per flag. If not resolved, ESCALATE.*

  **1. The Context Check (Dissolve the Contradiction)**
  *   **Time:** Do the values apply to different times? (e.g., Address in 2010 vs. 2024).
      *   *Yes:* **RESOLVED.** Keep both, display time-sliced. Stop.
      *   *No:* Go to 2.
  *   **Granularity:** Are the values actually different, or just specific vs. general? (e.g., "Cardiac Arrest" vs. "Heart Stopped").
      *   *Yes:* **RESOLVED.** Map to common terminology. Stop.
      *   *No:* Go to 2.
  *   **Predicate Sense:** Do the values mean different things in different systems? (e.g., "Discharged" from ER vs. "Admitted" to Ward on same day).
      *   *Yes:* **RESOLVED.** Label by department/service. Stop.
      *   *No:* **REAL CONTRADICTION.** Go to 2.

  **2. The Safety Valve (Harm Assessment)**
  *   **Question:** If we display Value A and it's wrong, does the patient get hurt? If we display Value B and it's wrong, does the patient get hurt?
  *   **Asymmetric Risk** (e.g., Allergy: False Positive = annoyance; False Negative = death):
      *   **Action:** Display the **Safe** value (e.g., "Allergy Present"). Mark source as `CONTESTED`. Go to Step 4 (Blast Radius).
  *   **Symmetric Risk** (e.g., Blood Type, DOB):
      *   **Action:** **QUARANTINE.** Display "Data Conflict – Verify with Patient." Go to Step 4.
  *   **No Clinical Risk** (e.g., Preferred Name, Phone):
      *   **Action:** Take Most Recent. Mark source as `CONTESTED`. Go to Step 4.

  **3. The Truth Claim (Dialetheia Check)**
  *   **Question:** Is it possible *both* are true under different contexts? (e.g., Consent for Treatment = YES, Consent for Research = NO, mapped to single field).
      *   *Yes:* **SPLIT.** Do not merge. Display both with explicit labels. Go to Step 4.
      *   *No:* Proceed to Step 2 logic.

  **4. The Blast Radius (Tagging)**
  *   If a field is marked `CONTESTED` or `QUARANTINED`:
      *   Any downstream field *calculated* from this value gets tag `DERIVED_UNSTABLE`.
      *   Any report *summarizing* this value gets footer: "Contains contested data."
      *   **Clearing:** Only a human steward can clear the tag after source verification.

  **5. The Handoff**
  *   **Escalate to Clinician if:** Safety Valve indicates Asymmetric Risk AND the "Safe" value blocks critical care (e.g., Quarantined Anticoagulant).
  *   **Escalate to Compliance if:** The contradiction involves Consent, Legal Status, or Identity, and Step 3 (Truth Claim) suggests a policy gap.

  ***

  #### BACK: Definitions & Rules

  *   **Real Contradiction:** $A$ and $\neg A$ claim to describe the *same* state at the *same* time in the *same* context.
  *   **Contested:** We are displaying a value, but we acknowledge a credible alternative exists in the audit log.
  *   **Quarantined:** We are displaying *nothing* (or a warning) because picking a side is unsafe.
  *   **Blast Radius Rule:**
      *   **Tier 1 (Critical):** Allergy, Meds, Diagnosis. Contamination spreads to *Medication Reconciliation*, *Discharge Summaries*, and *Risk Scores*.
      *   **Tier 2 (Identity):** DOB, MRN, Sex. Contamination spreads to *Billing* and *Legal Docs*.
      *   **Tier 3 (Admin):** Address, Phone. Contamination stays local.
  *   **The "Don't Know" vs. "Both True" Rule:**
      *   If we **Don't Know:** We default to Safety (Step 2).
      *   If **Both True:** We default to Specificity (Step 3). We do not merge them; we display the nuance.
  *   **Honesty Clause:** If the Steward feels "uneasy" after Step 2, Escalate. This procedure does not replace clinical judgment.

  ---

  ### Part 2: The Logic & Distinctions

  **What distinctions are we keeping?**
  1.  **Error vs. Context:** We keep this. A "Discharged/Admitted" same-day conflict is usually a transfer (Context), not a data error. The procedure dissolves this in Step 1.
  2.  **Unknown vs. Both Valid:** We keep this. "Unknown" triggers the Safety Valve (Step 2). "Both Valid" triggers the Split (Step 3). This is where the dialetheist logic lives: if the patient *is* both Allergic (immunologically) and Tolerant (clinically desensitized), we must display both, not pick one.

  **What distinctions are we throwing away?**
  1.  **Metaphysical Truth:** We do not care if the contradiction is "really" true in the universe. We care if the *record* supports safe action.
  2.  **Probability:** We are not calculating odds (e.g., "80% chance the 2019 test is right"). It is binary: Safe to Show vs. Quarantine. This prevents stewards from playing doctor.

  **The Compliance/Dialetheism Bridge:**
  You asked where "both entries correct under different rulebooks" changes the action.
  *   **Standard Logic:** One must be false. Find the false one.
  *   **Dialetheist Logic:** Both can be true.
  *   **Procedure Action:** If Step 3 identifies this (e.g., Consent), we **do not resolve**. We **expand the schema** for display. We tell Compliance: "We aren't saying the data is broken; we are saying the single boolean field is insufficient for reality." This satisfies Compliance (audit trail intact) and Safety (no data loss).

  **Where is it a judgment call?**
  Step 2 (Harm Assessment). The procedure tells you *how* to decide (Asymmetric vs. Symmetric), but it cannot tell you if a specific medication conflict is "critical." That is why the "Escalate if Uneasy" clause exists. It admits the procedure is a scaffold, not a cage.

  ---

  ### Part 3: Running the Cases

  #### Case 1: Penicillin Allergy (2011 Rash, 2019 Test Negative, 2023 None)
  *   **Step 1 (Context):** Time-slice check. 2011 is historical. 2019 is a challenge test (high evidence). 2023 is self-report.
  *   **Step 2 (Safety):** Asymmetric Risk. False Negative = Anaphylaxis. False Positive = Alternative antibiotic (maybe less effective).
  *   **Step 3 (Truth):** Is it possible they were allergic then and not now? Yes. Allergies fade.
  *   **Decision:** **RESOLVED (Temporal).**
      *   **Display:** "No Known Penicillin Allergy (Current)."
      *   **Audit:** Link 2011 note as "Historical Allergy - Resolved by Challenge 2019."
      *   **Blast Radius:** None. The contradiction is explained by time.
      *   **Cost:** None. This is standard stewardship.

  #### Case 2: Anticoagulant (Active Refill vs. Discontinued for Bleeding)
  *   **Step 1 (Context):** Same drug, overlapping dates. Real Contradiction.
  *   **Step 2 (Safety):** Asymmetric Risk.
      *   Show Active (if wrong): Patient bleeds (High Harm).
      *   Show Discontinued (if wrong): Patient clots (High Harm).
      *   *Correction:* This is **Symmetric High Risk**. Both sides kill.
  *   **Step 3 (Truth):** Unlikely both are true.
  *   **Decision:** **QUARANTINE.**
      *   **Display:** "MEDICATION CONFLICT: Order Active (Source A) vs. Discontinued for Bleeding (Source B). Clinician Verification Required."
      *   **Blast Radius:** Tier 1. Tags the Medication Reconciliation report as `DERIVED_UNSTABLE`. Tags the Discharge Summary.
      *   **Handoff:** Immediate Escalation to Prescribing Physician.
      *   **The Cost:** Your team will hate this because it stops the merge. The chart is "incomplete." Clinicians will call you complaining they can't see the med list. **Say it anyway:** It is better to delay a prescription than to cause a hemorrhage. The cost is workflow friction; the price of silence is liability.

  #### Case 3: Consent (Treatment Yes / Research No vs. Intake Yes/No Box)
  *   **Step 1 (Context):** Predicate Sense. "Consent" is overloaded.
  *   **Step 2 (Safety):** Legal/Compliance Risk.
  *   **Step 3 (Truth):** **Both True.** The patient consented to care but not data use. The Intake tool forced a binary choice on a multi-dimensional fact.
  *   **Decision:** **SPLIT.**
      *   **Display:** Do not merge into a single "Consent" flag. Display "Treatment Consent: YES" and "Research Consent: NO."
      *   **Action:** Mark the Intake Tool source as `UNRELIABLE_FOR_CONSENT`.
      *   **Blast Radius:** Tier 2 (Identity/Legal). Any report sending data to researchers must filter this patient out.
      *   **Compliance Note:** This satisfies Compliance. You aren't deleting the "Yes"; you are contextualizing it.

  ---

  ### Part 4: New Hire Test Cases

  *Use these to verify understanding. Answers should be immediate.*

  1.  **Q:** "Patient has two blood types: A+ (2020) and O- (2024). No transfusion record." **A:** Quarantine. Symmetric High Risk. Do not pick the newer one.
  2.  **Q:** "Patient address is '123 Main St' in EHR and '123 Main Street' in Intake." **A:** Resolved (Granularity). Merge and standardize. No contest tag.
  3.  **Q:** "Allergy: Sulfa (2015). Allergy: None (2023). Patient is currently septic." **A:** Display 'Allergy: Sulfa'. Asymmetric Risk. Tag as Contested. Do not hide the allergy.
  4.  **Q:** "A steward says 'I think the 2023 entry is probably right, so I'll hide the 2015 one.'" **A:** Fail. Stewards do not assess probability. They assess Safety and Context.
  5.  **Q:** "Consent field is contested. Can we drop the 'Unstable' marker on the Research Report if the doctor says it's fine?" **A:** No. Only a Steward clears the tag, and only after source verification. Doctor opinion doesn't fix data provenance.

  ---

  ### Part 5: Expected Failures (6 Months Out)

  **1. The "Alert Fatigue" Drift**
  *   **Failure:** You quarantine too many meds (like Case 2). Clinicians start ignoring the `CONTESTED` flags or demand you "just pick one" to clear their queue.
  *   **Sign:** The number of "Override" clicks by clinicians spikes.
  *   **Mitigation:** Review Quarantine logs monthly. If a specific contradiction pattern repeats (e.g., specific lab system vs. EHR), write a script to resolve *that* pattern, don't let stewards do it manually.

  **2. The Shadow Resolution**
  *   **Failure:** Clinicians stop using the merged chart for critical decisions and go back to logging into the legacy systems directly because your "Quarantine" slows them down.
  *   **Sign:** Audit logs show increased direct logins to legacy systems during critical care windows.
  *   **Mitigation:** This is actually a success signal for safety (they sought source truth), but a failure for adoption. You need to speed up the Escalation Handoff (Step 5).

  **3. The Blast Radius Inflation**
  *   **Failure:** Stewards get scared and mark everything Tier 1. Soon, every report in the hospital has a "Contains contested data" footer, rendering the warning useless.
  *   **Sign:** >10% of reports carry the warning footer.
  *   **Mitigation:** Audit the stewards. Enforce the Tier definitions strictly.

  **4. The Compliance Creep**
  *   **Failure:** Compliance sees the "Both True" (Case 3) workaround and decides they want *all* contradictions handled that way to avoid liability, doubling your steward workload.
  *   **Sign:** Compliance requests policy changes to expand Step 3 (Truth Claim) to low-risk fields.
  *   **Mitigation:** Hold the line on Step 2 (Safety). Low-risk contradictions get "Most Recent," not "Split."

  **5. The Silent Decay**
  *   **Failure:** The `CONTESTED` tag stays on a record for years. A new doctor sees "Allergy: Penicillin (Contested)" and assumes it means "We aren't sure, so don't give it," effectively making the contest a permanent allergy.
  *   **Sign:** Aged contested records never get resolved.
  *   **Mitigation:** Auto-expire `CONTESTED` tags after 12 months *unless* re-flagged. Force a re-review. If no new info, default to "Most Recent" but keep audit log. You cannot keep data in limbo forever.

  ### Final Note to the Lead
  You asked for honesty about judgment calls. The procedure above hides a hard truth: **Data Stewards are practicing medicine without a license when they resolve clinical contradictions.**
  Step 2 (Safety Valve) is where you protect them. By forcing "Quarantine" on symmetric high-risk errors, you force the clinician to own the decision. Do not let your team own the outcome of Case 2. If they pick "Active" and the patient bleeds, your team is liable. If they Quarantine and the doctor complains, your team is just "process." Choose the complaint.
