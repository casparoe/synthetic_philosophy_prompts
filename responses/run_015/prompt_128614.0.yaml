  5.  **Final Review of the "Complexity" Deflection:**
      *   Dr. Chen will likely try to smooth over contradictions by saying "Newton was a complex thinker working in different genres."
      *   *Strategy:* The follow-ups must corner this by asking if "complexity" is just a label for "incoherence" or if the structural thesis *requires* coherence that isn't there.
