answer: |-
  Here is the decomposition you asked for. I have treated your stipulations as the baseline arithmetic but have adjusted the probabilities based on the ecological and philosophical uncertainties you raised. I am not citing literature; all figures are explicit guesses or extrapolations from your provided constraints.

  ### Settled vs. Contested

  Before the decomposition, a boundary check.
  *   **Settled (enough for this ledger):** Small mammals (voles, mice) are sentient. Their nervous systems support valenced experience. This is not seriously debated in philosophy of mind anymore, and your field experience confirms behavioral correlates of pain/fear.
  *   **Contested:** Whether invertebrates (beetles, mites) count. Whether wild life is net negative. Whether "marginal" land behaves ecologically like "average" land in moral calculations. Whether suffering is additive across species (commensurability).
  *   **Extrapolation Warning:** I am extrapolating from your vertebrate experience to the invertebrate biomass implicitly included in "cropland carrying capacity." I am also treating "suffering" as a scalar quantity, which is theoretically fragile.

  ### The Decomposition

  Here are the seven sub-questions that determine the truth of the proposition. I have assigned a credence (0–1) to the condition *favoring the proposition* (i.e., that the switch reduces suffering).

  1.  **Wild Vertebrate Sentience:** 0.95
      *   *Justification:* It is highly probable voles and mice feel pain, though I leave 0.05 for radical skepticism or error in your field inferences.
  2.  **Net Negative Valence of Wild Life:** 0.60
      *   *Justification:* Your observation that most years end badly suggests negative utility, but reproduction and feeding provide positive pulses; the net sum is philosophically contested and empirically unknown.
  3.  **Marginal Land Carrying Capacity:** 0.30
      *   *Justification:* This is your specific ecological objection; I assign low credence to the "average hectare" assumption because marginal land likely supports <50% of the biomass of average feed-cropland.
  4.  **Counterfactual Land Use:** 0.50
      *   *Justification:* If feed land is spared, it might revert to high-suffering wild nature, low-suffering urban use, or be sold for other crops; the outcome is essentially a coin flip without policy constraints.
  5.  **Farmed Animal Suffering Ratio:** 0.10
      *   *Justification:* Per kilogram of protein, broiler chickens typically endure higher stocking densities and more individual deaths than beef cattle, strongly weighing *against* the proposition.
  6.  **Cross-Species Commensurability:** 0.70
      *   *Justification:* It is plausible we can compare a chicken's confinement suffering to a vole's predation suffering, but the metric is noisy and arguably ill-defined.
  7.  **Causal Efficacy:** 0.50
      *   *Justification:* Per your stipulation on price elasticity and market leakage, we assume only half of the dietary shift translates to reduced production pressure.

  ### The Combination

  To derive the final credence, I am not simply multiplying these probabilities, as they are not independent causal chains but weighted factors in a balance sheet. I am treating this as a weighted expectation of the net suffering delta.

  *   **The Wild Animal Term:** Your stipulation says cropland has 3x the biomass of pasture. However, applying my credence for **Marginal Land (0.30)** effectively reduces the "saved suffering" from switching to chicken by 70% relative to the standard EA calculation. If the wild life is **Net Negative (0.60)**, saving land helps, but the magnitude is shrunk by the poor quality of that land.
  *   **The Farmed Animal Term:** The **Farmed Animal Suffering Ratio (0.10)** is the heavy anchor here. Because chicken production involves orders of magnitude more individual deaths and often more intense confinement per calorie than beef, the switch incurs a high "certain" cost for a "uncertain" wild-animal benefit.
  *   **The Synthesis:** The proposition holds only if the *wild suffering avoided* (Land Delta × Density × Negativity) outweighs the *farmed suffering incurred* (Chicken Intensity × Count). Given the marginal land adjustment shrinks the wild benefit, and the chicken suffering is high, the balance tips away from the proposition.

  **My Credence in the Proposition:** **0.45**

  I am slightly below even odds. The standard argument (your daughter's view) relies on average land productivity and high wild-suffering estimates. Your ecological correction (marginal land) significantly devalues the "land-sparing" benefit, while the "chicken-suffering" cost remains high.

  ### Sensitivity and Study Design

  **Most Sensitive Term:** **Net Negative Valence of Wild Life (Question 2).**
  If wild mouse life is net *positive* (pleasure outweighs pain), the proposition collapses immediately to near-zero credence, because saving land would mean *preventing* good lives. If it is net negative, the proposition becomes viable. This single switch flips the sign of the entire wild-animal ledger.

  **Study Design to Pin It Down:**
  You need a longitudinal welfare assessment of free-living small mammals in marginal vs. average agricultural land.
  *   **Design:** Capture-mark-recapture over 24 months on two site types (high-yield feed crop margins vs. poor-drainage marginal fields).
  *   **Metrics:** Do not just count biomass. Measure physiological stress (fecal glucocorticoids), body condition scores, parasite load, and incidence of injury/predation attempts (via camera traps).
  *   **Goal:** Construct a "quality-of-life" index per animal-year to determine if the marginal field animals suffer *less* (due to lower density/competition) or *more* (due to resource scarcity) than average field animals, and if their aggregate life valence is negative.

  ### You vs. Your Daughter

  You are at 0.55; she is at 0.9. You are not arguing about the same thing.

  **The Disagreement Point:** **Marginal Land Carrying Capacity (Question 3).**
  *   **You** are arguing from **ecological reality**: The land that actually changes use is poor quality, so the "wild animal cost" of beef is lower than the spreadsheet says.
  *   **She** is arguing from **theoretical averages**: Effective Altruism models typically use mean crop yields and mean biomass densities because marginal data is scarce. She assumes the land saved is representative.

  **Why this matters:** If she accepts your premise that marginal land supports significantly fewer animals than average cropland, her credence *must* drop, because the primary benefit of switching to chicken (sparing wild animals from feed-crop hell) diminishes. Conversely, if you accepted that marginal land somehow sustains high densities of suffering animals, your credence would rise. You are fighting over the *magnitude of the wild-animal benefit*, while implicitly agreeing on the *cost of the chicken*.

  ### A Note on the "Total"

  I must flag that the question "What is the total amount of suffering?" is likely **ill-posed**.
  Suffering is not a conserved quantity like energy. There is no established unit to sum a chicken's six weeks of confinement and a vole's six months of predation risk.
  **The Well-Posed Cousin:** "Does the switch reduce the *probability* of causing severe, concentrated suffering events?"
  **Assumption Required:** To make your original question defensible, you must assume a utilitarian framework where intensity and duration can be linearly integrated across species into a single 'util' currency. Without that assumption, the sum does not exist.
