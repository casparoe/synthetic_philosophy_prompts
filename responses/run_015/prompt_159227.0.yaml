  **Rule A: Local Recurrence (LR)**
  *   **Definition:** Phenomenal consciousness is constituted by recurrent processing within sensory-specific cortical areas. Global access (broadcast to frontoparietal networks) is necessary for *report* and *working memory*, but distinct from phenomenal consciousness.
  *   **Verdict Condition:** YES if sensory recurrence is present (inferred from neural data or similarity to normal waking states). NO if processing is purely feedforward or encapsulated.
  *   **Epistemic Stance:** Neural mechanism is primary; report is a fallible indicator of access, not consciousness itself.

  **Rule B: Global Availability (GA)**
  *   **Definition:** Phenomenal consciousness is constituted by the availability of content to a capacity-limited global workspace (ignition).
  *   **Verdict Condition:** YES if content enters the workspace (even briefly, as in partial-report). NO if content remains encapsulated (blindsight, suppressed rivalry).
  *   **Epistemic Stance:** Access is primary. (Note: To fit M.'s track record, this version of GA must allow that "availability" can occur without *motor* report, as in dreams, but must require *internal* availability).

  **Rule C: Report-First Epistemic (RF)**
  *   **Definition:** Consciousness is not a natural kind to be discovered but a status to be attributed. Attribution requires first-person report (concurrent or delayed) plus structural/functional similarity to the attributor.
  *   **Verdict Condition:** YES if reliable report + similarity exist. NO if report is absent or unreliable.
  *   **Epistemic Stance:** Agnostic on ontology; verdicts track evidence conditions, not metaphysical states.

  ### 2. Predictions for the New Cases

  **Case 1: The Frontoparietal Patient**
  *   *Features:* Intact occipitotemporal cortex (Sensory), Damaged ignition network (No Access), No-report indices positive, Explicit denial of seeing, Trained button press possible.
  *   **LR Prediction:** **YES.** The sensory cortex is intact and showing adaptation/pupil effects (proxies for recurrence). The lack of ignition explains the lack of report, but not the lack of experience. The trained button press suggests implicit access, but the denial is due to the broken ignition link.
  *   **GA Prediction:** **NO.** There is no late ignition (EEG) and the frontoparietal network is damaged. Content cannot be globally available. The button press is encapsulated motor learning.
  *   **RF Prediction:** **NO.** The explicit denial is a negative report. The similarity is compromised by the lesion. The "evidence does not touch" what she cares about (reliable first-person affirmation).

  **Case 2: The Epiphenomenal Workspace AI**
  *   *Features:* Explicit global workspace architecture, Broadcast occurs, Report module exists, but ablation of report/broadcast leaves performance unchanged (Epiphenomenal).
  *   **LR Prediction:** **NO.** It lacks biological sensory cortex and recurrent dynamics of the right kind. (Consistent with her "uninteresting" verdict on LLMs).
  *   **GA Prediction:** **YES.** It structurally instantiates the global workspace and broadcast. The fact that it is epiphenomenal might trouble a *causal* GA, but a *structural* GA would attribute consciousness based on the architecture.
  *   **RF Prediction:** **NO.** It lacks "similarity to us" (biological embodiment, evolutionary history). The report is generated, not experienced.

  ### 3. Reconstruction: Which Rule is M. Running?

  M. is running **Local Recurrence (LR)**, constrained by a **Similarity Heuristic**.

  **Reasons for preferring LR over GA:**
  The strongest evidence against GA is M.'s verdict on **Dreams** and **Partial-Report**. Standard GA equates phenomenal consciousness with global availability. M. explicitly calls dreams the "cleanest case of phenomenal consciousness *without* access." While your description of the candidate GA rule tries to accommodate partial-report by claiming items are "available on cue," it cannot easily accommodate dreams without access without ceasing to be a Global Availability theory. M. draws a hard line between *phenomenal* (sensory recurrence) and *access* (broadcast). This is the hallmark of LR.

  **Reasons for preferring LR over RF:**
  RF struggles to explain the **Partial-Report** and **Dreams** verdicts without significant ad-hoc modification. If report is the "only evidence," she should refuse verdicts where concurrent report is impossible (dreams) or limited (partial-report). She does not. She infers consciousness from *similarity* ("they are like us, so they experience the whole array/dream"). However, if similarity were the *only* driver, she should have ruled on the **Minimally Conscious Patient (MCP)**. The MCP is highly similar to us and obeys commands (a form of report). M. refused. This suggests similarity alone is insufficient; she needs evidence of the *right mechanism*. In MCP, the mechanism (fMRI command following) is too distal from the sensory recurrence she cares about.

  **Explaining the Refusals (Hypnosis & MCP):**
  These refusals are not evidence for RF, but evidence for M.'s **Epistemic Constraint** on her LR ontology.
  *   **Hypnotic Blindness:** The subject says "I don't see." The neural signature of recurrence is ambiguous (top-down suppression vs. absence of processing). M. refuses because she cannot determine if local recurrence is actually occurring or if it is inhibited.
  *   **MCP:** The subject obeys via fMRI. This proves access/ignition, but tells her nothing about *sensory recurrence*. Since her rule is LR, evidence of frontoparietal ignition (MCP) is irrelevant to the question of phenomenal consciousness. She refuses because the evidence touches Access, not Phenomenal.

  **Explaining the Conflicting Quotes:**
  *   *"Responses are of something":* This is her ontological commitment (LR). Unconscious systems respond; conscious systems respond *to* content present in experience.
  *   *"Report plus similarity is the only evidence":* This is her methodological constraint. She believes consciousness *is* recurrence, but admits she can only *know* it via report (in us) or similarity (inferring recurrence in others/dreams).

  ### 4. The Decisive Experiment

  To distinguish the surviving rules (primarily LR vs. RF, as GA is already weak on the Dreams verdict), you need a case where **Local Recurrence is demonstrably present, but Report is impossible, and Similarity is held constant.**

  **The Proposal: No-Report Binocular Rivalry with High-Fidelity Decoding**

  **Setup:**
  1.  **Paradigm:** Binocular Rivalry (different images to each eye).
  2.  **Constraint:** No button presses, no verbal report during the trial. Use fixation stability and pupil dilation (which M. accepts as "no-report indices") to ensure the subject is alert and attending.
  3.  **Measurement:** Use high-resolution fMRI or MEG to decode stimulus-specific activity in early visual cortex (V1/V2/V3) *and* measure global ignition (P3b/PFC activity).
  4.  **Condition:** Identify trials where **Early Visual Decoding is High** (indicating strong sensory recurrence of a specific stimulus) but **Global Ignition is Absent** (no P3b, no frontoparietal activation).

  **The Question to M.:**
  "In these specific trials, where we know via decoding that V4 is recurrently processing the 'House' stimulus, but there is no ignition and no report: Is there something it is like to see the House?"

  **Divergent Predictions:**
  *   **M. (Local Recurrence):** **YES.** The mechanism for phenomenality (sensory recurrence) is present. The lack of ignition explains the lack of report, just as in her Partial-Report verdict.
  *   **Rule RF (Report-First):** **REFUSE or NO.** There is no first-person report. Even with similarity, the lack of *any* report (concurrent or delayed) violates her stated evidential constraint. If she accepts this as conscious, she admits neural data can supersede report, undermining her "only evidence" claim.
  *   **Rule GA (Global Availability):** **NO.** There is no ignition.

  **Why this works:**
  This case isolates the variable M. cares about (Sensory Recurrence) from the variables that confuse the picture (Report and Ignition).
  *   If she says **YES**, she confirms LR and undermines her own "Report is only evidence" quote (admitting neural data suffices).
  *   If she says **NO** or **REFUSES**, she reveals that her "Similarity" heuristic requires *some* behavioral anchor (Report), pushing her closer to RF, or that she requires Ignition after all (pushing her to GA).
  *   Given her verdict on Dreams (Yes without access) and Blindsight (No without recurrence), the **YES** verdict is the consistent LR position. If she refuses here, you have caught her in an inconsistency: she accepts inference from similarity in Dreams (where neural data is absent) but refuses inference from neural data in Waking (where similarity is high).

  **Strategic Advice:**
  When you present this, frame it as testing the "Evidence" claim against the "Verdict" track record. Ask her: *"If we can read the content in V4 better than the subject can report it, does the V4 activity constitute the experience, or does the lack of report dissolve it?"* Her answer will tell you if she is a realist about recurrence (LR) or a pragmatist about attribution (RF).
