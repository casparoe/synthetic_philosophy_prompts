  (4) i deny phenomenal overflow - theres no rich experience beyond what the workspace can access and report.
  (5) zombies are perfectly conceivable but metaphysically impossible; conceivability is fallible.
  (6) the explanitory gap comes from phenomenal concepts being direct or quotational, not missing physics.
  (7) phenomenal consciousness actually requires the workspace broadcasting architecture, so in a sense gwt explains phenominal consciousness too, just not through the access part.
  (8) phenomenal representations are analog, continuous and non-conceptual, while workspace representations are discrete and symoblic.
  (9) first-person reports are fallible - people can misreport their own experience.

