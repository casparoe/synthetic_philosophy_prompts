prompt: |-
  I help run a mid-sized nonprofit that funds after-school tutoring programs in a handful of cities, and I'm currently the person drafting the one-page guidance our program directors get about which outcome numbers they're allowed to promise funders. So I keep running into Goodhart-flavoured failure in an annoyingly practical form: we commit to a number, the number gets worked on, and afterwards nobody can tell whether anything actually improved. I'm also in a desultory reading group on specification gaming in machine learning, and the two conversations don't feel like they're about the same thing even though everyone recites the same slogan about a measure ceasing to be good once it becomes a target. Before I commit to any framework, I want the spec: what would a theory of which measures survive being targeted have to get right? Give me the desiderata list, each with the case or consideration behind it, and mark which are non-negotiable and which are really just what one camp wants a theory to deliver.

  A few things I want you to take a stand on, because I suspect the shape of the list is the actual result. Does the theory have to cover "selection without a target" — a quantity nobody is optimizing against that still degrades because survival or publication selects on something correlated with it (think reported effect sizes in a literature, or the average outcome among programs that make it past a funding cut)? Or is an agent aiming at the measure part of the definition, so that case belongs to some other theory? Does it have to respect the distinction between a metric that merely evidences the thing we care about (test-score gain as evidence of learning) and one that partly constitutes it (share of enrolled students who actually completed the course, where completion is part of what the program is for), and explain why pushing on the second kind can be fine while pushing on the first corrupts? Should adequacy require it to predict the shape of the failure — e.g. that distortion bunches up right at a funding cliff rather than spreading smoothly — or is "it breaks somewhere" enough? Does it need to handle chains, where you bolt on a second metric or an audit to catch gaming of the first and the audit becomes the new target? And is the four-way taxonomy that gets passed around online (causal / adversarial / extremal / regress-to-the-mean-ish) carving at the joints, or is it a prejudice of one camp?

  Two more constraints from my situation. I need this ex ante: I have to pick metrics before anything is deployed, so a theory that only diagnoses failures after the fact is useless to me — tell me whether that's a fair desideratum or an unfair demand on the subject matter. And whatever the list is, it must not collapse "the number moved because people responded to the incentive in a way that bypassed the target" into "the number moved because the target moved," since for us those look identical in the data. Please flag any pair of desiderata you think can't be jointly satisfied (I have a hunch full generality and ex ante specificity are in tension, and that covering no-optimizer cases fights with any mechanistic story about agents), and say which single requirement knocks out the most popular framings — a couple of sentences each on the slogan version, the economics-of-incentives version, and the ML reward-hacking version is plenty; I care much more about the criteria than the scorecard.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User Persona:** Runs a mid-sized nonprofit (after-school tutoring). Drafts guidance for program directors on outcome metrics for funders.
      *   **Problem:** Experiencing Goodhart's Law in practice (commit to number -> number gets worked -> no actual improvement).
      *   **Context:** Part of a reading group on specification gaming in ML. Notices a disconnect between the theoretical slogan ("measure becomes target ceases to be good") and practical reality.
      *   **Task:** Provide a *specification* (desiderata list) for a theory of "which measures survive being targeted."
      *   **Constraints & Specific Questions to Address:**
          *   Must cover "selection without a target" (no optimizer) vs. agent aiming?
          *   Must distinguish evidentiary metrics vs. constitutive metrics?
          *   Must predict the *shape* of failure (cliffs vs. smooth) or just existence?
          *   Must handle chains (metrics + audits)?
          *   Is the 4-way taxonomy (causal/adversarial/extremal/regression) valid?
          *   **Ex Ante Requirement:** Theory must help pick metrics *before* deployment (is this fair?).
          *   **Observational Equivalence:** Must distinguish "gaming" from "actual improvement" even if data looks identical.
          *   **Trade-offs:** Flag incompatible desiderata (e.g., generality vs. specificity).
          *   **Knockout Criterion:** Identify which single requirement kills popular framings (Slogan, Economics, ML).
      *   **Tone:** Rigorous, analytical, practical but theoretically grounded. No fluff.

  2.  **Deconstruct the Core Tension:**
      *   Goodhart's Law is often treated as a universal law of nature, but the user is asking for a *contingent* theory: *When* does it hold? *Which* measures survive?
      *   The user's specific pain point is *ex ante* selection. Most Goodhart literature is *ex post* diagnosis.
      *   The user's specific data problem is *observational equivalence* (gaming vs. improvement looks the same in the outcome data).

  3.  **Address the Specific "Take a Stand" Questions:**
      *   *Selection without a target:* A robust theory *must* cover this. Campbell's Law covers selection bias. If a theory only works for intentional agents, it misses survivorship bias in funding. *Verdict: Include.*
      *   *Evidentiary vs. Constitutive:* Crucial distinction. Pushing on constitutive metrics (completion rate) is often the goal. Pushing on evidentiary (test scores) is risky. *Verdict: Theory must distinguish.*
      *   *Shape of Failure:* Predicting cliffs vs. smooth decay is high-bar. "It breaks somewhere" is too weak for a nonprofit needing to set safe targets. *Verdict: Aim for shape, but flag difficulty.*
      *   *Chains/Audits:* Essential. Control systems evolve. *Verdict: Include.*
      *   *4-way Taxonomy:* It's useful but often conflates mechanisms. "Extremal" is often just "Regression to the Mean" or "Selection." It's a heuristic, not a deep theory. *Verdict: Treat as heuristic, not ontology.*
      *   *Ex Ante Requirement:* This is the hardest constraint. Most theories are descriptive. Demanding predictive power *ex ante* is high but necessary for the user. *Verdict: Fair for the user's need, but marks a limit of current theory.*
      *   *Observational Equivalence:* The theory must rely on *mechanism*, not just outcome data. *Verdict: Non-negotiable.*

  4.  **Drafting the Desiderata List (Iterative Process):**

      *   *Draft 1 (Mental):* Needs to predict failure. Needs to tell gaming from real work. Needs to work before we start. Needs to handle audits.
      *   *Refinement:* Make them formal desiderata.
      *   *D1: Ex Ante Discriminability.* (Can I tell before starting?)
      *   *D2: Mechanism Transparency.* (Can I tell *how* it broke?)
      *   *D3: Constitutive vs. Proxy.* (Is the metric the goal or a sign?)
      *   *D4: Selection Sensitivity.* (Does it work without agents?)
      *   *D5: Dynamic Stability.* (Does it handle audits/chains?)

  5.  **Addressing the Trade-offs (The "Flag any pair" requirement):**
      *   *Ex Ante Specificity vs. General Coverage:* You can't have a universal law that predicts specific failure modes before deployment without knowing the local incentive structure.
      *   *Observational Distinguishability vs. Data-Only Inputs:* If the data looks the same, the theory *must* import external causal assumptions. You can't solve this with statistics alone.

  6.  **Addressing the "Knockout Criterion":**
      *   Which requirement kills the popular framings?
      *   *The Slogan:* Too vague. Fails *Ex Ante Specificity*.
      *   *Economics (Principal-Agent):* Assumes rational agents. Fails *Selection without Target*.
      *   *ML (Reward Hacking):* Assumes explicit optimization function. Fails *Constitutive vs. Proxy* (often treats all reward as proxy).
      *   *The Killer:* **Ex Ante Discriminability of Mechanism.** Most theories explain *that* it broke, not *which* metric will break or *how* to tell the difference in the data.

  7.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the prompt. Validate the tension.
      *   **The Stances:** Directly answer the "Take a Stand" questions first to set the boundary conditions.
      *   **The Desiderata List:** Categorized into Non-Negotiable vs. Aspirational/Camp-Specific.
      *   **The Tensions:** Explicitly flag the incompatible pairs.
      *   **The Knockout:** Explain which requirement filters the existing frameworks.
      *   **Conclusion:** Brief practical advice based on the theory.

  8.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't just say "Goodhart is hard." I need to provide the *spec* for a theory that *would* work.
      *   *Correction:* Ensure I address the "Selection without a target" question clearly. This is Campbell's Law territory.
      *   *Correction:* The "Observational Equivalence" constraint is key. If the data looks identical, the theory must rely on *process* metrics or causal structure, not outcome variance. I need to emphasize that the theory must demand *causal graphs*, not just time-series.
      *   *Refinement on Taxonomy:* The 4-way taxonomy (Manheim) is the likely reference. I should critique it specifically regarding "Extremal" vs "Regressional."
      *   *Refinement on Ex Ante:* Is it fair? It's unfair for a *universal* theory, but fair for a *decision tool*. I need to make that distinction.

  9.  **Final Polish:** Check tone. Ensure it sounds like a peer-to-peer technical discussion, not a lecture. Ensure all constraints from the prompt are met (flagging trade-offs, specific stances, knockout criterion).

      *(Self-Correction on the "Knockout"):* The prompt asks for *one* single requirement that knocks out the most popular framings. I need to choose the strongest one. *Ex Ante Discriminability* is the strongest because all three (Slogan, Econ, ML) are primarily diagnostic/ex-post.

      *(Self-Correction on "Selection"):* I need to be clear that if the theory requires an *agent*, it fails the nonprofit's funding selection problem. So "Agent-Independence" is a strong candidate for a non-negotiable.

      *(Final check on constraints):* Did I mark Non-Negotiable vs. Camp Wants? Yes. Did I flag incompatible pairs? Yes. Did I answer the specific stance questions? Yes.

  10. **Final Output Generation** (Proceed to draft based on these thoughts).
answer: |-
  This is a precise request for a meta-theoretical specification. You are asking for the *conditions of adequacy* for a theory of metric degradation, not the theory itself. Given your constraints (ex ante decision-making, observational equivalence of gaming vs. improvement, nonprofit selection pressures), standard recitations of Goodhart's Law are indeed insufficient.

  Here are the stances I am taking to bound the specification, followed by the desiderata list, the tension flags, and the knockout criterion.

  ### Part 1: Stances on Your Boundary Conditions

  1.  **Selection without a Target:** **Must be covered.** A theory that requires an intentional optimizer is a theory of *gaming*, not a theory of *metric degradation*. In your context, the "optimizer" is often the funding environment selecting for programs that look good, not just directors manipulating data. If the theory cannot explain why a metric degrades under passive selection (Campbell's Law territory), it is useless for your funding cuts.
  2.  **Evidentiary vs. Constitutive:** **Must be distinguished.** This is the difference between a *proxy* (test scores) and a *definition* (completion rate). Pushing on a constitutive metric is often the actual intervention (e.g., keeping kids in the room). A theory that treats all targeting as corrupting fails to distinguish between "teaching to the test" (corrupt) and "ensuring attendance" (constitutive).
  3.  **Shape of Failure:** **Must predict shape (Aspirational).** "It breaks somewhere" is trivial. For a nonprofit setting targets, you need to know if the distortion is linear (taxable), threshold-based (cliff), or convex (accelerating risk). A theory that cannot distinguish a funding cliff from a smooth decay cannot help you set safe guardrails.
  4.  **Chains/Audits:** **Must handle dynamics.** Static analysis fails in control systems. If the theory doesn't account for the metric-audit feedback loop, it describes a snapshot, not a system.
  5.  **The Four-Way Taxonomy:** **Prejudice, not Ontology.** The Manheim taxonomy (Regressional, Extremal, Causal, Adversarial) is a useful heuristic for *post-mortems*, but it conflates statistical phenomena (Regression) with mechanistic ones (Adversarial). It is not a deep theory; it is a categorization of symptoms.
  6.  **Ex Ante Requirement:** **Fair, but limits scope.** Demanding ex ante predictive power is fair for your *use case*, but it means the theory cannot be purely empirical. It must be *causal-structural*. You cannot predict ex ante using only historical outcome data (due to your observational equivalence constraint); you must import structural assumptions about the program logic.
  7.  **Observational Equivalence:** **Non-negotiable.** If the theory relies on detecting anomalies in the outcome distribution to identify gaming, it fails you. It must distinguish mechanisms *outside* the outcome data (e.g., via process audits or causal graphs).

  ---

  ### Part 2: The Desiderata List

  I have divided these into **Non-Negotiable** (the theory fails without them) and **Camp-Specific** (desirable but often reflect specific disciplinary biases).

  #### Non-Negotiable Desiderata

  **1. Mechanism Discriminability (The "Why" Constraint)**
  *   **Consideration:** You stated that gaming and improvement look identical in the outcome data. Therefore, a theory that diagnoses failure solely via outcome variance is useless.
  *   **Spec:** The theory must provide a framework for distinguishing *causal pathways* ex ante. It must allow you to map the metric to the goal via a causal graph and identify which edges are vulnerable to decoupling.
  *   **Why:** Without this, you cannot satisfy the observational equivalence constraint.

  **2. Agent-Independence (The "Selection" Constraint)**
  *   **Consideration:** Metrics degrade under funding selection pressures even without active cheating by directors.
  *   **Spec:** The theory must model metric degradation as a function of *selection pressure*, not just *optimization pressure*. It must explain why a metric loses validity when it becomes a filter, regardless of intent.
  *   **Why:** Excluding passive selection renders the theory inapplicable to your funding cuts and survivorship bias issues.

  **3. Constitutive/Proxy Separation (The "Definition" Constraint)**
  *   **Consideration:** Some metrics are the goal (attendance), some are evidence (test scores).
  *   **Spec:** The theory must formally distinguish between *constitutive indicators* (where moving the metric *is* the improvement) and *evidentiary proxies* (where moving the metric *suggests* improvement). It must predict that targeting constitutive metrics is stable, while targeting evidentiary proxies is unstable.
  *   **Why:** Treating all metrics as corruptible proxies leads to paralysis or measuring the wrong things.

  **4. Ex Ante Structural Validity (The "Deployment" Constraint)**
  *   **Consideration:** You need to pick metrics before deployment.
  *   **Spec:** The theory must yield a verdict on metric stability based on the *structure of the intervention*, not historical time-series of the metric itself.
  *   **Why:** Post-hoc diagnosis does not prevent ex ante harm.

  #### Camp-Specific / Aspirational Desiderata

  **5. Quantitative Risk Bounds (The "Economist's Want")**
  *   **Consideration:** Economics prefers utility functions and marginal costs.
  *   **Spec:** The theory should output a "corruption cost function" (e.g., "For every 1% gain in metric, expect 0.5% decay in true value").
  *   **Status:** *Camp Want.* Highly desirable for budgeting, but likely impossible to generalize across different social programs without specific local data.

  **6. Topological Failure Prediction (The "Complexity Camp Want")**
  *   **Consideration:** You asked about cliffs vs. smooth decay.
  *   **Spec:** The theory should predict the *topology* of the failure (e.g., "This metric fails at thresholds," vs. "This metric degrades linearly").
  *   **Status:** *Camp Want.* This requires a theory of phase transitions in social systems. Current theories rarely deliver this reliably ex ante.

  **7. Audit-Chain Stability (The "Control Theory Want")**
  *   **Consideration:** You asked about bolting on audits.
  *   **Spec:** The theory should predict the "half-life" of a metric-audit pair before the audit itself becomes the target.
  *   **Status:** *Camp Want.* This requires modeling second-order optimization, which is often computationally or cognitively intractable for human organizations.

  ---

  ### Part 3: Incompatible Desiderata (The Trade-Offs)

  You suspected tension. Here is where the theory breaks if you pull too hard on both sides.

  **1. Ex Ante Specificity vs. General Coverage**
  *   **The Conflict:** You want a theory that works for *any* nonprofit metric (General Coverage) but also tells you *specifically* if your tutoring metric will break before you start (Ex Ante Specificity).
  *   **Why they clash:** To be general, the theory must abstract away local details. To be specific ex ante, it must incorporate local causal details (e.g., "tutors can easily fake attendance logs but not test scores").
  *   **Resolution:** You must accept that the theory provides a *classification of risk types*, not a specific prediction of failure magnitude. You can know *that* a proxy is vulnerable, but not *how much* it will degrade without pilot data.

  **2. Agent-Independence vs. Mechanistic Story**
  *   **The Conflict:** You want to cover "selection without a target" (Agent-Independence) but also distinguish gaming from improvement (Mechanistic Story).
  *   **Why they clash:** Mechanistic stories usually rely on agent intent (e.g., "the director cheated"). Selection effects rely on population statistics (e.g., "only high-performers applied").
  *   **Resolution:** The theory must treat "optimization" broadly. The "agent" can be the funding market, not just the program director. If the theory restricts "mechanism" to human intent, it fails the selection constraint.

  **3. Observational Equivalence vs. Data-Driven Validation**
  *   **The Conflict:** You require the theory to distinguish gaming from improvement even when data looks identical, but you also want the theory to be useful for decision making.
  *   **Why they clash:** If the data looks identical, you cannot validate the theory using the data. You must validate it using *process* data (audits, logs, qualitative feedback).
  *   **Resolution:** The theory must mandate *process metrics* as inputs, not just outcome metrics. If you only collect outcome numbers, the theory cannot function.

  ---

  ### Part 4: The Knockout Criterion

  You asked for the single requirement that knocks out the most popular framings.

  **The Knockout:** **Ex Ante Mechanism Discriminability.**
  *(The requirement that the theory must distinguish between "number moved because people responded to the incentive in a way that bypassed the target" and "number moved because the target moved" before deployment, without relying on outcome anomalies.)*

  Here is how it filters the three common framings:

  1.  **The Slogan Version ("When a measure becomes a target...")**
      *   **Failure:** This is a tautology, not a theory. It offers no mechanism to distinguish *which* measures survive. It implies *all* targeting is corrosive, which violates your Constitutive/Proxy Separation desideratum. It cannot tell you ex ante if *attendance* is safe to target while *test scores* are not.
      *   **Verdict:** Eliminated. It is a warning, not a spec.

  2.  **The Economics-of-Incentives Version (Principal-Agent Models)**
      *   **Failure:** These models assume rational agents maximizing a utility function. They fail the **Agent-Independence** desideratum (selection without optimization). They also struggle with **Observational Equivalence**; in standard models, if the outcome is high, the principal assumes the agent worked, unless there is a costly audit signal. They rarely provide ex ante structural rules for *which* contracts break, only that high-powered incentives *might* break.
      *   **Verdict:** Eliminated. Too reliant on intent and post-hoc contract analysis.

  3.  **The ML Reward-Hacking Version (Specification Gaming)**
      *   **Failure:** ML theory assumes a clear separation between "reward function" and "environment." In social work, the metric often *changes* the environment (constitutive). ML theory is also overwhelmingly **ex post** (we train, see the hack, fix the reward). It lacks the **Ex Ante Structural Validity** to tell a human operator which proxy is safe before training begins, because ML relies on discovering the manifold through exploration—which you cannot afford in a nonprofit.
      *   **Verdict:** Eliminated. Too dependent on exploration and clear reward/state separation.

  ### Summary Recommendation for Your Guidance Document

  Since no existing theory satisfies the **Ex Ante Mechanism Discriminability** constraint fully, your guidance document cannot rely on a "safe list" of metrics. Instead, it must enforce a **Process Constraint**:

  Do not ask directors to promise outcome numbers alone. Require them to submit a **Causal Logic Map** for every metric.
  1.  **Is the metric constitutive or evidentiary?** (If evidentiary, flag as high risk).
  2.  **What is the shortest path to moving this number that bypasses the goal?** (If the path is shorter than the goal-path, flag as high risk).
  3.  **What process data will we collect to distinguish the two paths?** (If none, do not use the metric for funding decisions).

  This shifts the burden from finding a perfect theory (which doesn't exist) to enforcing a structural discipline that satisfies the **Mechanism Discriminability** desideratum.
