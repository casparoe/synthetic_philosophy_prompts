      *   **Constraint 2:** Specific Framing: Phenomenal judgments are *self-referential indexicals* calibrated by a *subpersonal loop tracking neural coherence*, not qualia themselves.
      *   **Constraint 3:** E's argument: This dissolves the paradox because reliability depends on the loop, not causal access to consciousness.
      *   **Constraint 4:** I's counter: Can this preserve *first-person authority* (incorrigibility about pain) if the referent (qualia) never enters the causal chain?
      *   **Constraint 5:** Style: Tight, adversarial, responsive (no talking past each other).
