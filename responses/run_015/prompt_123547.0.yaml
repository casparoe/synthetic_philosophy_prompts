answer: |-
  Epiphenomenalist: Stop treating phenomenal judgments as descriptive reports about an inner object. They're self-referential indexicals. "This experience." The reference is fixed not by the qualia pushing back, but by a subpersonal loop calibrated to track neural coherence.

  Interactionist: A loop tracking neural coherence tracks physics. If the qualia are causally inert, the loop locks onto the correlate, not the feel. You've secured a reliable mechanism for talking about neurons, not consciousness.

  Epiphenomenalist: That's the category error. The indexical doesn't need the referent to cause the tokening. It needs a stable mapping between the neural state and the judgment. The loop ensures that when coherence state C obtains, the judgment "I am in pain" fires. The qualia supervenes on C. The reference succeeds because the judgment points to the state that *is* the phenomenology, even if the phenomenology doesn't push the button.

  Interactionist: Reference isn't the problem. Authority is. If I say "I am in pain," I claim incorrigibility. I cannot be wrong about the feel. But on your model, the feel plays no role in validating the judgment. Only the coherence loop does.

  Epiphenomenalist: And the loop is physically constrained. It doesn't misfire. If the coherence is there, the judgment fires. If the judgment fires, the coherence is there. Since the qualia is necessarily present when the coherence is there, you are never wrong. The paradox dissolves because reliability is structural, not causal.

  Interactionist: Structural reliability guarantees truth, not authority. Authority requires that the *phenomenology itself* constrains the judgment. If the qualia is outside the causal chain, what stops the loop from firing in a scenario where the coherence exists but the feel is absent?

  Epiphenomenalist: Nothing stops it logically, but nothing stops it physically either. In the actual world, the law-like correlation holds. You're demanding a metaphysical guarantee where a nomological one suffices. The indexical works because the system is closed.

  Interactionist: But then my certainty is about the system, not the pain. If the feel doesn't enter the chain, I'm not incorrigible about the qualia; I'm just a reliable gauge of my own neural coherence. I might as well be reporting on my liver function.

  Epiphenomenalist: You're conflating the mechanism of access with the object of access. I access my liver via inference. I access the qualia via indexical directness. The loop provides the channel, but the content is still the feel. The inertness of the feel doesn't strip it of being the content.

  Interactionist: Directness requires contact. If the feel is inert, it doesn't touch the judgment. You've given me a mirror that reflects nothing but claims it's showing me a face. If the pain doesn't cause me to know I'm in pain, then I don't know it *because* I'm in pain. I know it because my neurons fired.

  Epiphenomenalist: You know it because the neurons firing *is* what it is to be in pain and know it. The judgment is part of the coherence cluster. You're insisting on a ghostly handshake between the feel and the thought. There is no handshake. There is only the cluster.

  Interactionist: Then you've saved the judgment by killing the first-person. If the feel doesn't validate the claim, I have no privilege over the neuroscientist watching my scan. We both see the coherence. You've explained why I speak, but you've lost why I *know*.

  Epiphenomenalist: You know because you are the loop. There is no "you" outside the coherence to be deprived of authority.

  Interactionist: Then there is no one to be in pain, either. Just a loop talking to itself about a ghost it never touches.
