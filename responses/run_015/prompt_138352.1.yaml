answer: |-
  The confusion you are experiencing is not just political; it is jurisprudential. The word "right" is doing three different logical jobs in that room, and the speakers are talking past each other because they are invoking different Hohfeldian incidents (claim, privilege, immunity) while using the same label.

  In a planning board context, "Housing is a Human Right" is usually a placeholder for one of four distinct claims. Below is the menu of readings, evaluated against your axes, categorized by their legal/moral structure, and mapped to the policy outcomes you face.

  ### 1. The Immunity Reading (Don't Make Me Homeless)
  *   **The Claim:** No person shall be deprived of basic shelter by the state without due process or extreme cause.
  *   **Hohfeldian Incident:** **Immunity.** (You are immune from the state's power to deprive you of shelter).
  *   **Duty-Bearer:** The State (Sovereign/Courts), not specifically the Town Planning Board.
  *   **Right-Holder:** Anyone physically present within the jurisdiction.
  *   **Level of Remedy:** Emergency shelter or protection from arbitrary eviction. Not a specific unit, not a specific neighborhood.
  *   **Evaluation:** **Trivial/Defensible.** This is the baseline of modern constitutional law (e.g., eviction moratoriums, shelter mandates). It is widely accepted but low-bar.
  *   **Policy Implication:** **Neither.** This reading does not justify zoning for 12 units, nor does it justify blocking them. It only mandates that if someone *is* housed, the town shouldn't kick them out without cause. It addresses homelessness, not supply.
  *   **Speaker Alignment:** Neither speaker is actually using this. It's too weak for their goals.

  ### 2. The Provision Reading (Give Me a Unit)
  *   **The Claim:** If a person cannot secure housing through the market, the state has an affirmative duty to provide it at a cost they can afford.
  *   **Hohfeldian Incident:** **Claim-Right.** (You have a claim to a resource; the state has a correlative duty to provide it).
  *   **Duty-Bearer:** The State (Legislature/Town Budget), potentially delegated to developers via mandates.
  *   **Right-Holder:** Households in need (means-tested).
  *   **Level of Remedy:** A specific unit at an affordable price point.
  *   **Evaluation:** **Substantive and Contested.** This is a positive right (welfare). It is defensible as a moral goal, but in a small town context, it creates a budgetary or regulatory conflict. It implies housing is a public good like water or schools.
  *   **Policy Implication:** **Neighbors.** This supports the neighbors' argument: "If we can't guarantee this right (affordability) for this project, we shouldn't approve the project." It treats market-rate units as a failure to fulfill the right.
  *   **Speaker Alignment:** **The Neighbors' Group.** They are arguing that a "right" implies a guaranteed outcome (affordability), and without that guarantee, the transaction is illegitimate.

  ### 3. The Access Reading (Don't Stop Me Building/Buying)
  *   **The Claim:** The state shall not make it illegal for willing buyers and willing sellers to transact for shelter, nor illegal for landowners to create shelter.
  *   **Hohfeldian Incident:** **Privilege + Claim-Right.** (Developers have a *privilege* to build; seekers have a *claim* against the town not to exclude them).
  *   **Duty-Bearer:** The Town (Zoning/Planning Board).
  *   **Right-Holder:** Potential residents (outsiders) and Landowners/Developers.
  *   **Level of Remedy:** Legal permission to construct or occupy. No guarantee of price, only guarantee of legality.
  *   **Evaluation:** **Substantive and Defensible.** This frames housing as a liberty interest. It argues that exclusionary zoning is a rights violation because it criminalizes the creation of shelter.
  *   **Policy Implication:** **YIMBY.** This supports the argument that blocking apartments violates the right to housing by making it illegal to produce. It treats affordability mandates that kill supply as a violation of the right (because no house = no right).
  *   **Speaker Alignment:** **The YIMBY.** They are arguing that the "right" is a freedom from exclusion. To them, a house that isn't built cannot be a home for anyone, so blocking supply violates the right more than high prices do.

  ### 4. The Stability Reading (Let Me Stay Put)
  *   **The Claim:** Existing residents have a right to remain in their specific community without being displaced by market forces or new development.
  *   **Hohfeldian Incident:** **Claim-Right.** (Residents have a claim to tenure stability; Town has a duty to protect against displacement).
  *   **Duty-Bearer:** The Town (Planning Board) and Market Actors.
  *   **Right-Holder:** Current Residents only.
  *   **Level of Remedy:** Protection from rent spikes, gentrification, or neighborhood character change that forces exit.
  *   **Evaluation:** **Substantive but Exclusive.** This is the "Right to the City" version you suspected was different. It is defensible as a community preservation goal, but it is inherently exclusionary. It prioritizes the rights of the *current* tenant over the *potential* tenant.
  *   **Policy Implication:** **Neighbors.** This supports blocking the 12-unit building because new supply might change the neighborhood economics or character, threatening the stability of current residents.
  *   **Speaker Alignment:** **The Neighbors' Group.** Often, when neighbors say "housing is a right," they mean "*our* housing security is a right," and new market-rate development threatens that security.

  ---

  ### Summary Matrix

  | Reading | Core Meaning | Hohfeldian Job | Who Holds Right? | Supports Whom? | Is it "True"? |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1. Immunity** | Don't make me homeless. | Immunity | Everyone | Neither | Trivial/Defensible |
  | **2. Provision** | Give me an affordable unit. | Claim to Resource | Needy Households | Neighbors | Substantive (Budget issue) |
  | **3. Access** | Don't ban building/buying. | Privilege / Claim vs. Exclusion | Seekers / Builders | YIMBY | Substantive (Zoning issue) |
  | **4. Stability** | Let me stay in this neighborhood. | Claim to Tenure | Current Residents | Neighbors | Substantive (Exclusionary) |

  ### Why the Slogan Settles Nothing
  Your suspicion is correct: The slogan itself is under-determinate. It does not settle the vote because it does not specify *which* right is being invoked.

  *   **If Reading 2 (Provision) is true:** The Neighbors win. You cannot approve market-rate housing because it fails the "affordable" test required by the right.
  *   **If Reading 3 (Access) is true:** The YIMBY wins. You cannot block the housing because blocking it violates the right to seek shelter.
  *   **If Reading 4 (Stability) is true:** The Neighbors win. You must protect current residents from the disruption of new density.

  **The Conflict:** The Neighbors are conflating **Reading 2** (Provision) with **Reading 4** (Stability). They argue that because housing is a right (Provision), we must ensure affordability, and to protect that right (Stability), we must stop market-rate units that don't meet the standard.
  The YIMBY is invoking **Reading 3** (Access). They argue that because housing is a right, the town has no authority to make it illegal to create, regardless of price.

  ### Which Reading Did They Mean?
  *   **The Neighbors:** They are operating on **Reading 2 (Provision)** instrumentally, but **Reading 4 (Stability)** is likely their actual motivation. They use the "Human Right" language to elevate their preference for affordability/stability above the board's discretion. They view the "Right" as a **Claim-Right to a specific outcome** (affordable housing).
  *   **The YIMBY:** They are operating on **Reading 3 (Access)**. They view the "Right" as a **Privilege to act** (build/transact) and a **Claim-Right against interference** (zoning bans).

  ### How to Use This in Deliberation
  When the slogan is raised, you can dissolve the confusion by asking the speaker to specify the **Duty-Bearer** and the **Remedy**.

  1.  **Ask the Neighbors:** "When you say it's a right, are you claiming the town has a duty to *subsidize* this project (Provision), or a duty to *protect current neighbors* from change (Stability)? If it's a right to provision, do we have the budget to fund it? If not, does that mean no housing gets built ever?"
      *   *Goal:* Expose that Reading 2 requires money they don't have, and Reading 4 is exclusionary.

  2.  **Ask the YIMBY:** "Are you arguing that the right is a freedom from zoning bans (Access), or that the right guarantees a price point? If it's just access, how do we reconcile that with the town's duty to plan for infrastructure?"
      *   *Goal:* Confirm they are arguing for deregulation (Reading 3), not necessarily affordability.

  ### The Verdict for Your Vote
  *   **Reading 1 (Immunity)** is law, but irrelevant to zoning approvals.
  *   **Reading 2 (Provision)** is a budget decision, not a zoning decision. If the town hasn't allocated funds for affordable housing, you cannot zone for it by fiat without killing the project.
  *   **Reading 3 (Access)** is the core of your zoning authority. If you believe the town's duty is to allow shelter to be created, this reading dominates.
  *   **Reading 4 (Stability)** is a policy choice to prioritize incumbents over newcomers.

  **Conclusion:** The sentence "Housing is a human right" is legally inert in a planning meeting unless you define *which incident* it creates.
  *   If you define it as a **Claim to Resource (Reading 2)**, you must vote **No** on market-rate projects that lack subsidies (Neighbors' view).
  *   If you define it as a **Privilege to Build (Reading 3)**, you must vote **Yes** to allow supply (YIMBY view).
  *   If you define it as a **Claim to Stability (Reading 4)**, you must vote **No** to prevent neighborhood change (Neighbors' view).

  Since Readings 2 and 4 lead to the same vote (No/Stop) and Reading 3 leads to the opposite (Yes/Go), the slogan is a Rorschach test. To vote consistently, you must decide whether the "Right" protects the **person seeking a home** (YIMBY/Access) or the **person currently living in the community** (Neighbors/Stability). You cannot logically uphold both simultaneously in a single-family zoning context.
