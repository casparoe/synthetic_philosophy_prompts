answer: |-
  This is a precise dissection of the *Buckley v. Valeo* (1976) regime and its progeny (*Citizens United*, *McCutcheon*). You have identified the central tension: the law treats money as **corruption** when it moves vertically (donor → candidate) but as **speech** when it moves horizontally (donor → electorate).

  Here is a reconstruction of the theory the current practice is committed to, an analysis of its necessary components, the implications of swapping in an equality-based theory, and an answer to your question about exchange rates versus access.

  ### 1. The Implicit Theory: "Transactional Debt"
  The current legal architecture does not rest on a generic theory of corruption, nor strictly on a *quid pro quo* theory in the criminal sense. Instead, it relies on a theory of **Transactional Debt**.

  *   **The Core Premise:** Corruption occurs only when a specific relational obligation is created between a spender and an officeholder.
  *   **The Mechanism:** When you give money *to* a candidate, you create a debt of gratitude or an implicit contract. The candidate becomes an agent of the donor. This is regulable because it threatens the integrity of the office.
  *   **The Loophole Logic:** When you spend money *independently*, you are not paying the candidate; you are paying for your own megaphone. No debt is incurred by the candidate. Therefore, no corruption exists, only political speech.
  *   **The Coordination Line:** This is the critical fence. If you coordinate, the spending functionally becomes a gift to the candidate (creating debt). If you don't, it remains a gift to the public discourse (creating no debt).

  **Why Disclosure Fits:**
  You noted disclosure rules seem to contradict a pure *quid pro quo* view. Under the Transactional Debt theory, disclosure is not about preventing corruption; it is about **Voter Sovereignty**. The state cannot limit the speech (because no debt exists), but it can ensure the electorate knows who is speaking so they can weigh the message's credibility. It shifts the policing of influence from the government to the voter.

  **Why the Foreign Ban Fits:**
  This is the outlier that proves the rule isn't purely about corruption. The ban on foreign spending (even independent) rests on **Political Community Sovereignty**, not corruption. The theory holds that self-governance is a right reserved for members of the polity. A foreign national spending independently isn't corrupting the candidate (no debt), but they are intruding on the domestic dialogue of a sovereign people. This is a boundary of *membership*, not a boundary of *bribery*.

  **Why Self-Funding Fits:**
  Under Transactional Debt theory, you cannot owe a debt to yourself. A candidate spending their own money creates no external obligation that compromises their agency. Furthermore, limiting self-funding would penalize a candidate's own First Amendment rights to speak about themselves. The theory prioritizes the candidate's autonomy over the opponent's equality.

  ### 2. Necessary vs. Compatible
  To maintain this regime, certain pillars are structural necessities; others are merely contingent policy choices.

  **What the Theory *Needs* (Structural Necessities):**
  1.  **The Contribution/Expenditure Dichotomy:** The law *must* distinguish between giving money to a person (regulated) and buying speech in the market (unregulated). If this collapses, the whole regime falls.
  2.  **A Definition of Coordination:** There *must* be a bright line where independent spending becomes a contribution. Without this, the contribution limits are evadable.
  3.  **The "Debt" Requirement:** The theory *requires* that corruption be defined by the creation of an obligation. If corruption is defined as "distortion of the marketplace of ideas," independent expenditures would have to be capped.

  **What is Merely Compatible (Contingent Choices):**
  1.  **Corporate Personhood:** The theory *could* allow bans on corporate spending if one argues corporations cannot have "speech" rights, provided individuals can still spend independently. *Citizens United* made this compatible, but not strictly necessary for the Transactional Debt logic (which focuses on the debt, not the speaker).
  2.  **Specific Dollar Limits:** The theory needs *some* limit on contributions to prevent debt, but the specific number ($3,300 vs $10,000) is arbitrary.
  3.  **Disclosure Thresholds:** The theory needs disclosure to inform voters, but the specific triggers for reporting are policy choices.

  ### 3. The "Political Equality" Swap
  If we swapped the current theory (Liberty/Speech) for a theory where **money damages political equality**, the architecture would require a total overhaul.

  *   **The New Premise:** Political influence should be distributed one-person-one-vote, not one-dollar-one-vote. Wealth concentration distorts the "marketplace of ideas" regardless of coordination.
  *   **The Collapse of the Coordination Line:** If the harm is inequality of voice, it doesn't matter if the spending is coordinated. A billionaire spending $100M independently drowns out other voices just as effectively as if they gave it to the campaign. The coordination line becomes irrelevant; **expenditure caps** become necessary.
  *   **Self-Funding Limits:** Under an equality theory, unlimited self-funding is intolerable because it allows wealth to directly purchase office. You would need to cap candidate self-spending or implement matching public funds to neutralize the advantage.
  *   **Disclosure vs. Anonymity:** Disclosure might actually be *reduced* or altered. If the goal is equality, knowing who spoke matters less than limiting the volume. However, disclosure might be increased to track inequality metrics.
  *   **Foreign Bans:** This would likely remain, but the justification would shift from sovereignty to protecting the domestic equality of the electorate from external wealth distortion.

  **What would have to change legally?**
  You would have to overturn *Buckley v. Valeo*. *Buckley* explicitly rejected the "equality of voice" argument, stating that the concept of "allocating political influence" is alien to the First Amendment. To adopt an equality theory, you must constitutionally redefine money not as speech, but as **conduct** that regulates speech access.

  ### 4. Exchange Rate vs. Access and Attention
  You asked: *Does any of this require believing that money buys official action at some exchange rate, or does the whole thing work on a thinner story about access and attention?*

  The current legal regime is caught in a contradiction here.

  **The Legal Fiction (Exchange Rate):**
  To justify *contribution limits*, the Supreme Court *must* assert a thick theory: that money creates a risk of *quid pro quo* or "undue influence" that looks like an exchange. If money didn't buy official action (or the appearance of it), there would be no compelling state interest to limit contributions at all.

  **The Operational Reality (Access/Attention):**
  To justify *independent expenditure freedom*, the Court asserts a thin theory: money buys **amplification**, not obligation. It assumes that while money buys access to the airwaves, it does not buy access to the officeholder *unless* the money goes through the candidate's treasury.

  **The Resolution:**
  The system works on a **Theory of Agency**.
  *   **Direct Contributions:** Make the politician an **agent of the donor**. (Corrupting).
  *   **Independent Expenditures:** Make the spender an **agent of their own views**. (Protected Speech).

  It does *not* require believing money buys official action in the independent sphere. It requires believing that money buys **influence over the electorate**. The law assumes that if the candidate didn't take the money, the candidate isn't beholden, even if the donor's ads got them elected.

  **The Bug You Identified:**
  The bug exists because the "Agency" theory ignores the **Market for Access**. Even if there is no explicit bargain, the expectation of future support (or the sheer necessity of not angering a major independent spender) creates a "thin" corruption of attention. The law pretends this doesn't exist.

  **Conclusion:**
  The current system presupposes that corruption is **relational** (between donor and candidate), not **structural** (within the system of representation).
  *   If you believe corruption is **relational**, the coordination line is everything.
  *   If you believe corruption is **structural** (inequality), the coordination line is nothing, and expenditure caps are required.

  The law currently pretends to fight the former while tolerating the latter, which is why the "coordination" definition is the most litigated and porous boundary in election law. It is the levee holding back the flood of the structural theory.
