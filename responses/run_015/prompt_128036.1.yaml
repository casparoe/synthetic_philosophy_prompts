prompt: |-
  everyone in philosophy of mind keeps saying mental representation works just like a heart: evolutionary history fixes its proper function, misrepresenting is like a malfunctioning valve, and that lets us naturalize aboutness without spooky mental norms. they use it to argue teleosematics solves the normativity problem by reducing it to biology. can you audit how far this holds? lay out the correspondance table - heart / pumping / blood / selection history / malfunction mapped onto representation / content / distal object / selection / misrepresentation - then pinpoint exactly where it collapses. in particular, hearts dont seem to represent blood flow, they just cause it; and what about a swamp heart formed by lightning that pumps correctly but has zero evolutionary history? does that analog actually support the claim that history is essential, or does it show the analogy was smuggling in the conclusion? also check whether malfunction really needs a designer-like selection process, or if statistical deviation is enough. finally, tell me whether the relaxed conclusion - that mental norms are just biological norms - survives once the disanalogies are on the table, or if the heart picture was carrying the whole argument.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Request:**

      *   **Topic:** Teleosemantics in Philosophy of Mind (specifically the analogy between biological function and mental representation).
      *   **Core Claim to Audit:** "Mental representation works just like a heart: evolutionary history fixes proper function, misrepresentation is malfunction, this naturalizes aboutness/normativity."
      *   **Specific Tasks:**
          1.  Create a correspondence table (Heart vs. Representation).
          2.  Pinpoint exactly where the analogy collapses.
          3.  Address the "Swampman/Swampheart" objection (does history matter?).
          4.  Address the "Malfunction" objection (does it need selection or just statistics?).
          5.  Evaluate the "Relaxed Conclusion" (Are mental norms just biological norms?) given the disanalogies.
      *   **Tone:** Critical, analytical, philosophical, precise.

  2.  **Initial Assessment & Knowledge Retrieval:**

      *   *Teleosemantics:* Associated with Millikan, Papineau, Dretske, Neander. The core idea is that content is determined by the selected-for function of a mechanism.
      *   *The Heart Analogy:* A classic example (Millikan). The heart's function is to pump blood because ancestors did so and contributed to survival. A heart that doesn't pump is malfunctioning. Similarly, a belief mechanism's function is to track truth (or guide action) because ancestors did so. A false belief is a malfunction.
      *   *The Normativity Problem:* How can physical states be *wrong*? Teleosemantics says: They are wrong if they fail their biological function.
      *   *Key Objections:*
          *   *Swampman (Davidson):* A duplicate formed by accident has no history. Does it have thoughts? Teleosemantics says no (or at least no content). This feels counterintuitive.
          *   *Distality Problem:* What exactly is the content? The frog's fly-detector: Is it "fly," "black dot," or "nutritious thing"?
          *   *Normativity vs. Statistics:* Is a statistical anomaly a *normative* failure?
          *   *Representation vs. Causation:* Hearts cause flow; minds represent objects. Is the "aboutness" actually explained, or just assumed?

  3.  **Drafting the Correspondence Table:**

      *   Need to map the biological domain to the semantic domain.
      *   *Heart* $\rightarrow$ *Representational Vehicle* (e.g., neural state).
      *   *Pumping* $\rightarrow$ *Representing* (or the act of tokening a content).
      *   *Blood Flow* $\rightarrow$ *Distal Object/State of Affairs* (what is represented).
      *   *Selection History* $\rightarrow$ *Content Determination* (what fixes the meaning).
      *   *Malfunction (Valve failure)* $\rightarrow$ *Misrepresentation* (False belief).

  4.  **Analyzing the Collapse Points (The "Audit"):**

      *   *Point 1: Causation vs. Intentionality.* The user hit the nail on the head. Hearts don't *represent* blood; they move it. Minds *represent* things that might not exist (unicorns). The heart analogy explains *function*, but does it explain *aboutness*? Teleosemantics tries to bridge this by saying the function *is* to correlate with X. But correlation isn't representation (see: barometer).
      *   *Point 2: The Swampman/Swampheart.* If a swampheart pumps perfectly but has no history, does it have a function? Teleosemantics says *no function*. But intuitively, it works. If it works, why isn't it a heart? This suggests "function" might be structural/dispositional, not historical. If function isn't essentially historical, then content isn't essentially historical. This undermines the "history fixes content" claim.
      *   *Point 3: Malfunction vs. Statistics.* A heart that pumps 10% less efficiently due to age isn't necessarily "malfunctioning" in a normative sense, just degraded. Misrepresentation needs to be *wrong*, not just *atypical*. Selection history provides the "standard," but is that standard *normative* (ought) or just *teleological* (for)? The gap between "selected to do X" and "ought to do X" is the Humean Is-Ought gap re-emerging.

  5.  **Addressing the "Designer-like Selection" vs. "Statistical Deviation":**

      *   Teleosemantics *requires* selection (Natural Selection), not just statistics. A random mutation that pumps blood isn't a function until selected.
      *   However, if we look at a single organism, malfunction looks like statistical deviation from the species norm.
      *   The problem: Why is the *ancestral* norm the right one? If the environment changes, the old function might be maladaptive now. Is it still the "proper" function? (Millikan says yes, which creates tension).

  6.  **Evaluating the "Relaxed Conclusion":**

      *   Claim: Mental norms are just biological norms.
      *   If the analogy collapses on intentionality (hearts don't represent), then reducing mental norms to biological norms leaves out the *semantic* normativity (truth conditions).
      *   Biological norm = Survival/Reproduction.
      *   Mental norm = Truth/Accuracy.
      *   These come apart. A false belief can be adaptive (placebo effect, overconfidence). If mental norms were *just* biological norms, false adaptive beliefs wouldn't be "misrepresentations," they'd be "successful functions." Teleosemantics struggles here.

  7.  **Synthesizing the Argument (Structuring the Response):**

