          3.  *Normativity vs. Adaptivity:* Truth vs. Survival.
      *   **The Malfunction/Selection Question:** Distinguish between statistical rarity and normative failure.
      *   **Final Verdict:** Does the relaxed conclusion survive? (No, because biological success $\neq$ semantic accuracy).

  8.  **Refining the Tone:**

      *   Avoid taking sides dogmatically. Act as an auditor.
      *   Use precise philosophical terminology (intentionality, distal content, selected effect, Swampman).
      *   Ensure the "Smuggling Conclusion" point is addressed directly.

