  **MEMORANDUM**

  **TO:** Interdisciplinary Biomedical Research Ethics Board
  **FROM:** [Your Name], Doctoral Candidate, Philosophy of Mind; Board Member
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Memo regarding Protocol #24-09: "Hemispheric Autonomy in Post-Callosotomy Patients"

  **BOTTOM LINE DECISION**
  The Board recommends **Approval with Conditions**. The protocol may proceed only if the "Dual-Channel Assent Protocol" is reclassified as a "Bilateral Withdrawal Monitoring System." The study must maintain a single legal signatory for informed consent, but must incorporate hemispheric motor signals as binding triggers for immediate pause or termination of testing sessions. Required revisions must be submitted within fourteen (14) days.

  **SCIENTIFIC AND PHILOSOPHICAL CONTEXT**
  This protocol investigates cognitive modularity in post-callosotomy patients using split-field tachistoscopic presentation. Uniquely, the investigators propose that because the corpus callosum is severed, the left and right hemispheres may constitute distinct centers of consciousness and agency. Consequently, they argue that standard unitary informed consent is ethically insufficient, as it allows one hemisphere to override the withdrawal preferences of the other. Their proposed solution is a "dual-channel assent" where independent motor responses (left-hand drawing vs. right-hand pointing) serve as independent veto mechanisms for each hemisphere.

  This proposal forces the Board to adjudicate a conflict between legal statutory requirements and metaphysical plausibility. The core philosophical question is whether the unity of consciousness is a necessary condition for singular moral personhood, or whether empirical evidence of hemispheric independence justifies partitioned ethical procedures.

  **ETHICAL ANALYSIS AND REASONING**

  **1. The Status of the Person vs. The Reality of Agency**
  The Board acknowledges the philosophical seriousness of the investigators' position. Empirical data from split-brain cases suggests that hemispheric disconnection can result in conflicting intentions, independent knowledge states, and divergent emotional responses. To ignore this empirical disunity risks treating the participant as a mere container for data rather than an agent whose internal conflicts matter.

  However, ethical oversight boards operate within a legal framework that recognizes the human organism as a single juridical person. To grant two distinct "consent" statuses within one organism would create a category error with unmanageable legal implications regarding liability, data ownership, and the right to withdraw. We cannot legally recognize two subjects where the law recognizes one.

  Therefore, the Board distinguishes between *moral status* and *protective mechanism*. While we cannot grant two distinct legal statuses, we are ethically obligated to respect all observable expressions of distress or refusal, regardless of which neural substrate generates them. Ignoring a withdrawal signal from the non-dominant hemisphere simply because it lacks "legal personhood" would be a violation of the principle of non-maleficence.

  **2. Separability of the Mechanism from Scientific Aims**
  The investigators argue that the dual-channel mechanism is ethically necessary. The Board finds that the motor-response channels are **inextricably linked to the scientific aims**; the study *requires* independent manual responses to measure hemispheric autonomy. Therefore, the mechanism itself cannot be removed without destroying the study's validity.

  However, the *ethical classification* of this mechanism is separable. The investigators label it "assent," implying that each hemisphere holds independent authority to grant permission. The Board mandates reclassifying this as "monitoring." The motor channels remain scientifically necessary, but their ethical function shifts from "granting consent" to "signaling distress." This preserves the scientific integrity of the independent response channels while maintaining the legal necessity of unitary consent.

  **3. The Strongest Consideration for the Rejected Position**
  In reaching this decision, the Board gives full weight to the argument advanced by the minority of the Board (and the investigators) that treating the patient as a unitary person is a form of ethical erasure. If consciousness is genuinely fragmented, a unitary consent model effectively silences one half of the subject's experience. By requiring a single signature, we may be privileging the linguistic, left-hemisphere narrative over the non-linguistic, right-hemisphere experience. There is a profound moral risk that we are prioritizing administrative convenience over the metaphysical reality of the participant's mind. If the right hemisphere experiences the procedure as coercive but lacks the legal standing to stop it, we are arguably conducting research on an unwilling agent. This consideration is philosophically robust and highlights a gap in current regulatory frameworks regarding non-standard consciousness.

  **CONDITIONS FOR APPROVAL**

  To bridge the gap between legal personhood and empirical agency, the following conditions must be met:

  1.  **Reclassification of Protocol Language:** All instances of "Dual-Channel Assent" must be revised to "Bilateral Withdrawal Monitoring." The Informed Consent Form (ICF) must explicitly state that while one legal guardian/participant signs, *any* independent motor signal indicating refusal (as defined in the testing manual) will result in immediate cessation of that trial or session.
  2.  **Single Signatory Requirement:** The ICF must be signed by the participant (typically mediated by the left hemisphere's linguistic capacity) or their legally authorized representative. No separate "hemispheric consent" forms are permitted.
  3.  **Operational Definition of Withdrawal:** The investigators must submit a standardized coding key defining exactly which motor behaviors constitute a withdrawal signal. This must be objective enough that a research assistant can identify a withdrawal signal without interpreting intent.
  4.  **Debriefing Procedure:** A post-session debriefing must be attempted that accounts for potential memory disconnection, ensuring that any distress signaled by one hemisphere is addressed, even if the other hemisphere claims no memory of the event.

  **IMPLEMENTATION TIMELINE**

  *   **November 6, 2023:** Investigators submit revised ICF and Operational Manual reflecting the "Bilateral Withdrawal Monitoring" language.
  *   **November 13, 2023:** Board Chair and Philosophy Member review revisions for compliance with the conditions above.
  *   **November 20, 2023:** Final approval issued; recruitment may begin.
  *   **January 20, 2024:** Interim safety review specifically focused on the frequency and handling of bilateral withdrawal signals.

  **CONCLUSION**
  This decision allows the research to proceed without violating statutory requirements for human subjects protection. It acknowledges that while the law cannot recognize two persons in one body, ethics requires us to listen to both sides of the brain. By treating hemispheric independence as a safety constraint rather than a legal status, we protect the participant's welfare without fracturing the regulatory framework.

  **Signed,**

  [Your Name]
  Doctoral Candidate, Philosophy of Mind
  Member, Interdisciplinary Biomedical Research Ethics Board
