      *   *Point 3: Socrates as the Telos.* Socrates isn't a counter-example; he's the goal. The drinking laws aim to produce citizens who *approach* Socrates' level of control, even if they never reach it.
      *   *Point 4: Resolving the Vice Contradiction.* A revealed vice isn't a *formed* vice in this context. The vice was already there (latent). Alcohol exposes it. The *practice* under alcohol fights the vice. If you fail the test, you are identified for correction (or exclusion), not "formed" into that vice by the wine itself. The wine is the *medium*, not the *agent* of corruption (provided it's regulated).

