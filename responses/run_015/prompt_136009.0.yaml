  # The Biography Moral-Learning Decision Tree

  ### Node 1: The Flaw Condition
  *Choose the claim that best matches your intuition about moral exemplars.*
  *   **A:** "Seeing the subject's flaws actually helps the moral lesson land."
  *   **B:** "Flawlessness works better for the moral lesson."

  ### Node 2: The Mechanism
  *How do you engage with the subject?*
  *   **A1/A2:** "I learn through emotional identification (feeling like I'm walking alongside them)."
  *   **B1/B2:** "I learn through comparative judgment (holding myself up against their choices)."

  ### Node 3: The Proximity Constraint
  *Does historical distance matter?*
  *   **X:** "The subject needs to feel culturally or historically close enough that their choices still look like live options for me."
  *   **Y:** "I can learn just as well from lives that feel like museum pieces."

  ### Node 4: The Fracture Test
  *What happens when the narrative breaks?*
  *   **i:** "Contradictions, glossed-over failures, and narrative breaks destroy the moral teaching."
  *   **ii:** "Contradictions, glossed-over failures, and narrative breaks actually deepen it."

  ---

  ## The Leaves (16 Positions)

  ### Branch A: Flaws Help
  #### Path A1: Identification (Walking Alongside)
  *   **A1-X-i (Flaws + Identification + Live Options + Fractures Destroy):** **Named: Fragile Realism.**
      *   *Commitment:* I need to relate to a peer whose struggles are real, but if their story doesn't add up, I can't trust the path.
  *   **A1-X-ii (Flaws + Identification + Live Options + Fractures Deepen):** **Named: Plutarchan Moralism.**
      *   *Commitment:* Virtue is learned by navigating the messy, contradictory struggles of people who could have been my neighbors.
  *   **A1-Y-i (Flaws + Identification + Museum Pieces + Fractures Destroy):** **Named: Unnamed.**
      *   *Awkward Commitment:* I need to feel like I'm walking alongside a ghost, but only if the ghost's diary is perfectly bound.
  *   **A1-Y-ii (Flaws + Identification + Museum Pieces + Fractures Deepen):** **Named: Aesthetic Morality.**
      *   *Commitment:* The emotional resonance of a distant, broken life teaches me more than a coherent contemporary one.

  #### Path A2: Judgment (Holding Up Against)
  *   **A2-X-i (Flaws + Judgment + Live Options + Fractures Destroy):** **Named: Modern Virtue Ethics (Strict).**
      *   *Commitment:* I measure myself against realistic peers, but their narrative must be coherent enough to serve as a reliable metric.
  *   **A2-X-ii (Flaws + Judgment + Live Options + Fractures Deepen):** **Named: Narrative Ethics.**
      *   *Commitment:* The contradictions in a peer's life force me to judge more carefully, refining my own moral calibration.
  *   **A2-Y-i (Flaws + Judgment + Museum Pieces + Fractures Destroy):** **Named: Historical Skepticism.**
      *   *Commitment:* I try to judge myself against the past, but since the records are broken and the people are dead, the lesson fails.
  *   **A2-Y-ii (Flaws + Judgment + Museum Pieces + Fractures Deepen):** **Named: Unnamed.**
      *   *Awkward Commitment:* I measure my life against a broken statue of a stranger and claim the cracks make the measurement more precise.

  ### Branch B: Flawlessness Works Better
  #### Path B1: Identification (Walking Alongside)
  *   **B1-X-i (Flawless + Identification + Live Options + Fractures Destroy):** **Named: Devotional Fan.**
      *   *Commitment:* I must merge with a perfect contemporary leader, and any scandal shatters the connection.
  *   **B1-X-ii (Flawless + Identification + Live Options + Fractures Deepen):** **Named: Unnamed.**
      *   *Awkward Commitment:* I need to feel at one with a perfect person, and finding out their biography is lying about them helps me feel closer.
  *   **B1-Y-i (Flawless + Identification + Museum Pieces + Fractures Destroy):** **Named: Hagiography.**
      *   *Commitment:* I venerate a distant saint whose life must be presented as a seamless, perfect icon to be effective.
  *   **B1-Y-ii (Flawless + Identification + Museum Pieces + Fractures Deepen):** **Named: Unnamed.**
      *   *Awkward Commitment:* I emotionally merge with a perfect ghost, and the fact that the seance is glitchy makes the spirit feel more real.

  #### Path B2: Judgment (Holding Up Against)
  *   **B2-X-i (Flawless + Judgment + Live Options + Fractures Destroy):** **Named: Didactic Propaganda.**
      *   *Commitment:* I need a perfect local model to measure my failure against, and any inconsistency ruins the standard.
  *   **B2-X-ii (Flawless + Judgment + Live Options + Fractures Deepen):** **Named: Unnamed.**
      *   *Awkward Commitment:* I measure myself against a perfect neighbor, and discovering their story is fabricated makes me try harder.
  *   **B2-Y-i (Flawless + Judgment + Museum Pieces + Fractures Destroy):** **Named: Hero Worship (Carlylean).**
      *   *Commitment:* I measure my insignificance against perfect Great Men of history, provided their records remain unblemished.
  *   **B2-Y-ii (Flawless + Judgment + Museum Pieces + Fractures Deepen):** **Named: Unnamed.**
      *   *Awkward Commitment:* I judge my life against a perfect distant idol, and the holes in their story highlight their perfection.

  ---

  ## Flagged Collapses and Indistinguishables

  **1. The Hagiographic Collapse (B1-Y-i vs B1-X-i)**
  *   **Pair:** *Flawless + Identification + Museum Pieces + Fractures Destroy* (Hagiography) **vs.** *Flawless + Identification + Live Options + Fractures Destroy* (Devotional Fan).
  *   **Issue:** If the subject must be flawless and you learn through identification, historical proximity becomes functionally irrelevant. Whether the perfect subject is a contemporary guru or an ancient saint, the psychological mechanism (merging with perfection) and the requirement (no fractures) are identical. The tree separates them by "Proximity," but the moral experience collapses into **Hagiographic Fandom**.

  **2. The Impossible Ideal (B-X-ii vs B-Y-ii)**
  *   **Pair:** All "Flawless + Fractures Deepen" leaves (B1-X-ii, B1-Y-ii, B2-X-ii, B2-Y-ii).
  *   **Issue:** These positions are logically unstable. If you commit to "Flawlessness works better," you inherently require coherence. A "fracture" (contradiction/failure) contradicts "flawlessness." While a user might claim this position, the tree cannot separate these from simple confusion; they all collapse into **Cognitive Dissonance**.

  **3. The Skeptic's Trap (A2-Y-i vs A2-Y-ii)**
  *   **Pair:** *Flaws + Judgment + Museum Pieces + Fractures Destroy* (Historical Skeptic) **vs.** *Flaws + Judgment + Museum Pieces + Fractures Deepen* (Unnamed).
  *   **Issue:** If the subject is a "museum piece" (distant) and you use "judgment" (comparison), the utility of the biography is already low. Whether fractures destroy or deepen the lesson may be a distinction without a difference, as the moral learning is negligible in both cases. Both lean heavily toward **Biographical Nihilism**.
