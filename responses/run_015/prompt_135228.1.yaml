answer: |-
  Here are two candidate principles derived from your verdicts. They approach the problem from different angles: one epistemic (how you form probabilities) and one game-theoretic (how you set policies).

  ### Principle 1: The Model-Relative Probability Cap (MRPC)

  **Statement:** You are forbidden from integrating expected utility over outcomes whose *causal mechanisms* lie outside your current world-model, unless independent verification is provided. The probability assigned to a claim cannot exceed the prior probability of the mechanism required to make it true.

  *   **Clause A (The Cap):** If a claimant asserts a capability (e.g., simulating 3^^^^3 minds) without demonstrating the mechanism, you assign a prior based on the Kolmogorov complexity of that mechanism within *your* physics, not the claimant's number. This prior must decay faster than the utility grows.
      *   *Justification:* This handles **Case 1**, **Case 7**, and **Case 8**. It explains why the "shape" of Case 1 and Case 9 feels different: in Case 9, the mechanism is "a model someone else can check," which places it inside your world-model. In Case 1, it is magic.
  *   **Clause B (The Verification Exception):** If the mechanism is demonstrated (demo) or peer-reviewed (respectable model), the cap is lifted, and you may use the provided probability estimates.
      *   *Justification:* This handles **Case 3** (hardware demo) and **Case 9** (respectable model).
  *   **Clause C (The Negligible Cost Exception):** If the cost of action approaches zero, the probability cap is waived, and you act on raw expected value.
      *   *Justification:* This handles **Case 5** ("glorp"). Even if the probability is 10^-20, if the cost is truly zero, EV dominates.

  **Where it overturns your verdicts:**
  *   **Case 2 (Retro):** MRPC says **Do Not Pay**. The mechanism is still unverified; the fact that he claims it is *already running* does not lower the complexity of the mechanism required to do it. Your intuition here is likely driven by urgency, not epistemology.
  *   **Case 4 (Track Record):** MRPC says **Do Not Pay** (or pay very little). A track record at the "ten lives" scale does not verify the mechanism for the "3^^^^3 lives" scale. The complexity jump is still too high.
  *   **Case 11 (Info Value):** MRPC is neutral/skeptical. Paying for info is fine, but paying the *mugger* incentivizes the creation of muggers. MRPC suggests paying a third party to investigate the claim, not the claimant.

  **Where it thinks you are most confused:**
  *   **Case 1 vs. Case 2.** You treat the epistemic burden as lower because the harm is "ongoing." MRPC argues the epistemic burden is identical; only the urgency differs. If you wouldn't believe he *could* do it in Case 1, you shouldn't believe he *is* doing it in Case 2.

  **Predictions for new cases:**
  *   **Vote Mugging:** "Give me your vote or I simulate torture." -> **Refuse.** The mechanism is unverifiable, and the cost (vote) is non-negligible.
  *   **Donation Mugging:** "Stop donating to Case 9 or I simulate torture." -> **Refuse.** The mechanism is unverifiable. You continue donating to Case 9 because it passes Clause B, but you do not let the mugger leverage it.

  **Where it breaks:**
  It struggles with **Case 10 (Lottery)**. People buy lottery tickets despite the mechanism being verified and the EV being negative. MRPC explains why you *shouldn't* buy one, but it doesn't capture why buying one isn't "insane" (the entertainment value of the dream). It also feels too rigid on **Case 4**; a strong enough track record *should* update priors, but MRPC demands mechanistic verification, which might be too high a bar for empirical induction.

  ***

  ### Principle 2: The Commitment-Stability Policy (CSP)

  **Statement:** Adopt the decision rule that, if known by all agents (including adversaries), minimizes expected loss across all possible worlds. Do not make exceptions for single-shot interactions unless the policy damage is already sunk.

  *   **Clause A (No Unverifiable Threats):** Never adopt a policy of paying agents who make unverifiable threats contingent on payment.
      *   *Justification:* This handles **Case 1**, **Case 12**, and **Case 7**. If you pay Case 1, you become a target for Case 6 (Many Muggers).
  *   **Clause B (The Sunk Policy Exception):** If a harmful process is asserted to be *already active* and payment halts it immediately, minimize immediate loss. The policy damage (incentivizing muggers) is secondary to stopping active suffering.
      *   *Justification:* This is the only way to save **Case 2**. It treats Case 2 as a rescue mission where the "blackmail" dynamic is less relevant because the threat isn't *future* conditional harm, but *present* ongoing harm.
  *   **Clause C (The Institutional Trust Exception):** Pay if the request comes from an institution with a verifiable track record and non-coercive structure.
      *   *Justification:* This handles **Case 9**. The "respectable version" is not a mugger; it is an institution. Paying them does not incentivize hooded muggers.
  *   **Clause D (Incentive Compatibility):** Do not pay if the agent has no incentive to fulfill the promise after payment.
      *   *Justification:* This handles **Case 8** (Blessing). The mugger pockets the cash and leaves.

  **Where it overturns your verdicts:**
  *   **Case 11 (Info Value):** CSP says **Do Not Pay the Mugger**. Paying for information validates the mugger as a gatekeeper of truth. You should fund independent verification, not pay the blackmailer. Your intuition to pay is correct on VoI, but wrong on *who* to pay.
  *   **Case 6 (Many Muggers):** CSP reinforces **Do Not Pay**. Paying the "most probable" one still incentivizes the ecosystem of muggers.
  *   **Case 4 (Track Record):** CSP is wary. A track record of harm proves they are dangerous, not that they are truthful about *scale*. It might suggest paying a small amount to neutralize a known actor, but not based on the EV of the threat.

  **Where it thinks you are most confused:**
  *   **Case 1 vs. Case 9.** You say they have the "same shape." CSP argues they have the *opposite* shape. Case 1 is coercive and private; Case 9 is voluntary and public. Your confusion stems from focusing on the EV math rather than the *social contract* surrounding the transaction.

  **Predictions for new cases:**
  *   **Vote Mugging:** **Refuse.** Voting is a public commitment. Adopting a policy of "voting for muggers" is catastrophic for the voting system's integrity.
  *   **Donation Mugging:** "Stop donating to Case 9 or else." -> **Refuse.** This is a classic protection racket. CSP dictates you never let a bad actor intercept your good actions. You continue donating to Case 9 openly.

  **Where it breaks:**
  It struggles with **Case 2 (Retro)**. Strictly speaking, paying Case 2 *does* incentivize future muggers to claim they have "already started" runs. CSP requires you to believe Case 2 is epistemically distinct enough from Case 1 to warrant the exception. If muggers learn you pay for "ongoing" runs, all future muggers will claim their runs are ongoing. CSP requires a very strong prior that "ongoing" claims are rarer or harder to fake than "future" claims, which may not be true.

