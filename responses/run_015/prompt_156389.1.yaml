answer: |-
  This is a profound question that cuts through the surface of legal doctrine into the bedrock of social ontology. You are asking whether our institutions are discovering metaphysical truths about identity or *creating* them for functional purposes.

  The short answer is that your friend who insisted "the metaphysics never enters into it at all" is mostly right, but for a deeper reason than they probably realized. The law does not presuppose a single metaphysical theory of persistence (like Endurance or Perdurance). Instead, it operates on a theory of **Functional Conventionalism**.

  Under this view, identity over time is not a fact of nature to be discovered, but a status granted by the system to serve specific ends (risk allocation, moral retribution, social stability). The apparent contradictions you see arise because the system switches between different "identity games" depending on whether the goal is *compensation*, *punishment*, or *administrative continuity*.

  Here is the reconstruction of the implicit theory, the evaluation of your "Chain-of-Custody" view, and the concrete consequences of radicalizing the metaphysics.

  ### 1. Reconstructing the Implicit Theory: Functional Conventionalism

  Current practice does not track a single metaphysical view. It tracks **liability channels**.

  *   **For Corporations and States (The "Pot" Theory):** The institution treats the entity as a *pool of assets and obligations* that persists independently of its constituents. The metaphysics here is **Legal Fictionalism**. The "thing" is the charter and the ledger, not the people or the bricks.
      *   *Why it holds:* To allow capital accumulation and long-term contracting. If Kestrel & Voss died every time the staff turned over, no one would sign a 30-year pension plan.
      *   *Why it breaks:* Statutes of limitation. Here, the system admits that at some point, the "channel" is too attenuated to serve the function of deterrence or correction. This isn't metaphysical discontinuity; it's epistemic decay.

  *   **For Natural Persons (The "Agent" Theory):** The institution treats the person as a **Psychological/Moral Continuum**.
      *   *Civil (Wills/Debt):* We assume continuity of interest. The 85-year-old is the beneficiary of the 30-year-old's planning.
      *   *Criminal (Punishment):* We assume continuity of *moral agency*. If the 85-year-old has dementia, they cannot connect the punishment to the crime. Retribution requires the subject to *own* the act.

  **Strict Requirements vs. Compatibility vs. Underdetermination:**

  *   **Strict Requirement:** The system requires *assignability*. There must be *some* mechanism to point to a present entity and say "this bucket holds the rights/duties of that past act." Without this, the concept of obligation collapses.
  *   **Merely Compatible:** Both Endurance and Perdurance are compatible with current law *if* you squint. An Endurantist can say the "Corporation" is an abstract object that endures. A Perdurantist can say the "Corporate Space-Time Worm" includes the 1931 and 2024 segments. The law doesn't care which story you tell, provided the liability attaches.
  *   **Underdetermined:** The *cut-off points* are purely policy. Why 100 years for a tort but 80 years for a copyright? Why punish a sane man but not an insane one for the same physical act? Metaphysics cannot answer these; only utility can.

  ### 2. The Corporate-Personal Asymmetry: Principled or Costume?

  Your friend who claims it's "liability policy wearing a metaphysical costume" is correct. However, it is not *arbitrary* policy; it is **functional differentiation**.

  *   **Corporations are designed to be immortal.** Their metaphysical "costume" is chosen to maximize economic utility. We *want* Kestrel & Voss to be the same entity in 2024 as in 1908 so that contracts remain stable. The asymmetry exists because we do not want humans to be immortal in the same way; we want human liability to expire so that people can rehabilitate and eventually die free of burden.
  *   **Punishment vs. Compensation:** The asymmetry in criminal law (no punishment if memory/understanding is lost) vs. civil law (living wills bind the future self) reveals the true metric: **Moral Connectivity.**
      *   A living will is a *pre-commitment strategy*. It binds the future self because the law prioritizes the *autonomy* of the past agent over the *preferences* of the future agent.
      *   Criminal punishment is *retributive*. It requires the present agent to *feel* the weight of the guilt. If the psychological link is severed (dementia), the retribution hits an innocent person (the new psychological stage).

  So, the asymmetry is principled, but the principle is **Moral Agency**, not **Metaphysical Identity**.

  ### 3. Evaluating Your "Chain-of-Custody" View

  Your "Chain-of-Custody" view is actually the closest thing to the **actual operating system of corporate law**. In legal terms, this is **Successor Liability**.

  *   **Where it works:** It perfectly explains Kestrel & Voss. The "thing" is the unbroken chain of recognized obligation. As long as each iteration explicitly or implicitly accepts the baggage of the previous one (via merger, asset purchase with liability assumption, or statutory succession), identity holds.
  *   **The Revolutionary Government Problem:** You identified the weak point. When a revolutionary government repudiates the debts of the prior regime, they are explicitly **breaking the chain of custody**.
      *   *International Law Response:* International law often rejects this break (the "Continuity of State" doctrine). It says, "You might say you're new, but the *State* (the territory/people) persists, so you pay."
      *   *The "Odious Debt" Exception:* However, if the prior regime was illegitimate (tyranny), the new regime is sometimes allowed to break the chain.
      *   *Verdict on your view:* Your view needs a **Recognition Clause**. Identity holds *iff* there is a chain of custody **AND** the relevant community (courts, other states) recognizes the transfer as valid. This admits that identity is partly a matter of social recognition, not just objective record-keeping.
  *   **The Personal Identity Problem:** Your view fails for persons. I cannot sign a "Chain-of-Custody" contract at 30 that makes my 80-year-old self criminally liable for a murder if my 80-year-old self has no memory of it. The law protects the *psychological* break even if the *legal* chain (same body, same ID number) is unbroken.

  ### 4. Concrete Consequences of Radicalizing the Metaphysics

  If we stopped being pragmatists and forced our institutions to align with a strict metaphysical theory, the results would be catastrophic.

  #### Scenario A: Going All-In on Time-Slices (Perdurance)
  *Theory:* The 1931 Kestrel and 2024 Kestrel are different temporal parts of a worm, but distinct entities. The 30-year-old You and 85-year-old You are distinct person-stages.

  *   **Corporate Liability:** The 1931 workers sue the 1931 Time-Slice. That slice no longer exists. **Verdict:** No liability. The 2024 payroll company is a distinct entity that merely bought the assets. Victims get nothing unless fraud can be proven in the asset transfer.
  *   **Treaties:** The 1950 Treaty was signed by a State-Stage that no longer exists. The 2024 State-Stage is not bound. **Verdict:** International anarchy. Every election or generational shift voids prior commitments.
  *   **Living Wills:** The 30-year-old stage signed the will. The 85-year-old stage is the one undergoing treatment. The 85-year-old stage did not consent. **Verdict:** Living wills are invalid. Doctors must treat the current stage's presumed interest (usually preservation of life), ignoring prior wishes.
  *   **Criminal Law:** You can only punish the specific time-slice that committed the crime. If they escape capture for 5 years, they are a "new" slice. **Verdict:** Statutes of limitation become metaphysical necessities. Punishment is almost impossible.

  #### Scenario B: Going All-In on Strictly-Same-Substance (Endurance/Materialism)
  *Theory:* For X at $t_1$ to be X at $t_2$, there must be significant material or substantial overlap.

  *   **Corporate Liability:** Kestrel & Voss 1908 was made of brass, brick, and specific people. Kestrel & Voss 2024 is code and different people. **Verdict:** They are not the same substance. The 2024 firm is a fraud using a stolen name. Liability is impossible; the 1908 entity died when the foundry closed.
  *   **Personal Identity (The Ship of Theseus Problem):** Human cells replace themselves. If "same substance" means "same atoms," we die every 7 years. If it means "same brain structure," dementia kills the person.
  *   **Living Wills:** If the 85-year-old has lost the "substance" of the 30-year-old's mind (memory/personality), they are a different being. **Verdict:** The 30-year-old's signature has no authority over the 85-year-old stranger in the bed.
  *   **Debt/Inheritance:** Death is the total destruction of substance. **Verdict:** All debt dies with the borrower. Inheritance is impossible because the heir is a different substance. The economy collapses.

  ### 5. Conclusion: The Verdict on the Barbecue Argument

  Your friends were arguing about **Descriptive Metaphysics** (what *is* persistence?), but the law is engaged in **Prescriptive Ontology** (what *should count* as persistence for this purpose?).

  *   **Friend A (Endurance/Material):** Is wrong about the law, but right about our intuitive moral hesitation. We *feel* like punishing the 2024 software team for 1931 brass poisoning is unfair because the "moral substance" isn't there.
  *   **Friend B (Perdurance/Process):** Is right about the legal mechanism. The law treats entities as processes. But they are wrong to think this solves the moral problem. Just because the *process* is continuous doesn't mean the *guilt* flows forever.
  *   **You (Chain-of-Custody):** You have identified the **Legal Theory of Identity**. It is the most robust view for institutions. However, it must acknowledge that the chain can be severed by **Political Will** (revolutions) or **Psychological Break** (insanity).

  **The Synthesis:**
  The package of practices presupposes that **Identity is a Variable**, not a Constant.
  *   When we want **Stability** (Contracts, Treaties, Debt), we use a loose, Chain-of-Custody/Perdurance view.
  *   When we want **Justice** (Criminal Punishment), we use a strict, Psychological/Endurance view.
  *   When we want **Closure** (Statutes of Limitation), we arbitrarily sever the chain regardless of metaphysics.

  If you want to win the argument, tell your friends: "The law isn't trying to solve the Ship of Theseus paradox. It's trying to decide who pays the bill. It uses whatever definition of 'same ship' ensures the bill gets paid without sinking the economy, unless the bill is for a crime, in which case it uses whatever definition ensures only the guilty suffer."

  The metaphysics doesn't drive the bus; it sits in the back and writes the justification after the driver has already chosen the destination.
