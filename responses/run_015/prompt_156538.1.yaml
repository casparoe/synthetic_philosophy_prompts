          2.  The Implicit Theory (Dualism of Sense and Intellect).
          3.  Molyneux's Resolution (Discrete Spaces).
          4.  Internal Consistency (The Edge Cases).
          5.  Alternative Epistemology (The Dissolution).
      *   *Refining the "Conceptual Deficit":* Why is matching conceptual? Because it requires a *rule* of translation. Touch = Hard/Edges. Sight = Light/Shadow. The mind must decree "Hard/Edges IS Light/Shadow." That is a judgment, not a sensation.
      *   *Refining the "Sensory Latency":* Why is visual failure sensory? Because the centre assumes the *image* is not yet forming.
      *   *Refining the Edge Cases:* Focus on the "Pass Visual / Fail Match" scenario. This is the most interesting tension. It suggests the patient sees "shapes" but doesn't understand "objects."
      *   *Refining the Alternative:* If sensation is always already conceptual, Phase 1 is a trap. It measures nothing but compliance.

  8.  **Final Polish:** Check against constraints (no citations, focus on logic). Ensure the distinction between "latency" (biological/time) and "deficit" (cognitive/structural) is clear.

      *(Self-Correction during drafting)*: I need to be careful not to simply say "Locke said X." I must derive the Lockean/Molyneux implications from the *protocol itself*. The prompt asks what the *practice* presupposes.

      *Key Insight:* The protocol treats Touch as the "Ground Truth." Vision is the "Variable." This is crucial. Touch is trusted immediately; Vision is suspected. This implies a hierarchy of the senses where Touch is closer to "Reality" (resistance, solidity) and Vision is "Appearance."

      *Re-evaluating Case A (Fail Vis / Pass Match):* If I fail to name the cube by sight, but can match the felt cube to the seen cube... wait. If I can match them, I must recognize the visual cube *in the presence of the tactile cue*. Phase 1 is "Vision Alone." Phase 2 is "Touch then Match."
      So, Case A means: I can't identify it by sight alone, but if I hold it, I can pick it out of a lineup by sight.
      Does this break the taxonomy? Phase 1 says "Sensory Latency" (Eye isn't working). Phase 2 says "Conceptual" (Mind isn't linking). If I pass Phase 2, my eye *is* working enough to distinguish. So Phase 1 failure wasn't pure latency; it was lack of *confidence* or *association*. The taxonomy calls it latency, but the outcome proves the eye works. This suggests the "Latency" diagnosis is a fiction to avoid blaming the patient's mind too early.

      *Re-evaluating Case B (Pass Vis / Fail Match):* I name the cube by sight. But I can't match the felt cube to the seen cube.
      This implies I have a visual concept ("That shape is a cube") but I cannot map the tactile sensation ("This hard thing") to that visual concept.
      The taxonomy calls this "Conceptual Deficit." This holds up. It implies the visual label was superficial (2D) and the 3D concept is missing.

