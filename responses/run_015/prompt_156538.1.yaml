          4.  Describe alterations needed if the underlying epistemology changed (no separation between sensation and conception).
      *   **Constraint:** No bibliographic authority or external citation. Argument must be reconstructed solely from the logic of the practice and conceptual tensions.

  2.  **Deconstruct the Protocol's Logic:**
      *   *Phase 1 (Vision Only):* Assumes the eye can register form independently of prior knowledge. Failure is physiological/developmental ("latency"). Success implies the visual system is "online."
      *   *Phase 2 (Touch + Vision):* Assumes touch provides a stable reference point (truth) against which vision is measured. The task isn't just seeing, it's *linking* seeing to knowing (via touch). Failure here is cognitive ("conceptual deficit").
      *   *The Distinction:* "Sensory Latency" vs. "Conceptual Deficit." This implies a dualism between *receiving data* (sensation) and *processing/unifying data* (conception).

  3.  **Address Task 1: Implicit Theory of Perception & Concepts:**
      *   *Perception:* It treats vision as a passive receiver that needs time to "ripen" (latency). It treats touch as an active verifier.
      *   *Concept Possession:* Concepts (like "cube") exist independently of the modality. You can have the concept via touch. The problem arises when you can't map the visual data to that existing concept.
      *   *Inter-modal Knowledge:* Knowledge is modular. Visual knowledge and tactile knowledge are distinct buckets. Intelligence is the bridge between them.
      *   *The "Deficit":* If you can't match, you lack the *rule* for translation, not the *data*.

  4.  **Address Task 2: Molyneux's Problem:**
      *   *Molyneux's Question:* If a blind man gains sight, can he distinguish a cube from a sphere by sight alone before touching them?
      *   *Protocol's Stance:* Phase 1 expects failure ("anticipated sensory latency"). This suggests the centre believes the answer is initially *No*.
      *   *Unification:* Phase 2 requires active matching. This implies the spaces *are* discrete initially. The "conceptual deficit" label implies the patient *should* be able to learn the bridge.
      *   *Integrated Empiricist:* Could an empiricist (all knowledge from experience) support this? Yes, if they view touch as the "primary" experience and vision as "secondary." The deficit is a failure of association, not innate ideas. But the strict separation suggests a more rationalist or modular view of the mind (faculties of sense vs. faculties of understanding).

  5.  **Address Task 3: Internal Consistency (Edge Cases):**
