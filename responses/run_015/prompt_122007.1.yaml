      *   *The "Closure of the Test Set" move:* This is an ad hoc rescue attempt. If the law only applies to conditions $C$, and the miracle claims conditions $M$, then the law doesn't forbid $M$. But if $M$ is relevantly similar to $C$, the law *should* apply. The friend says "no reason to think it's different," which begs the question.

