      *   **Why Step (3) is the hidden cost:** Treating inductive generalizations as "proofs" (probability 1) is dogmatic. It makes science impossible (falsificationism). If a law cannot be overturned by *any* amount of contrary evidence, it's not science; it's dogma.
      *   **Why Step (7) is the explicit cost:** Conflating "Laws of Nature" with "Well-Confirmed Regularities."
