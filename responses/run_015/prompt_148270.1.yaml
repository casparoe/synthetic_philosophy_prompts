answer: |-
  ### Phase 1: Edge Case Brainstorming (The "Stress Test")

  Before defining the spec, we must acknowledge the data set that breaks standard models. We are not looking for a theory of "enjoyment" but of *pleasure* as a natural kind or normative category.

  1.  **The Masochistic Boundary:** Pain that is sought and experienced as pleasurable. Is the pain the pleasure, or is the pain the *object* of a distinct pleasure? If the latter, what is the distinct pleasure made of?
  2.  **The Relief Paradox:** The cessation of a toothache. Is this a positive state (pleasure) or merely the zeroing of a negative state (pain absence)? If it's pleasure, does it have a positive phenomenology, or is it just the removal of interference?
  3.  **The Intellectual "Click":** Solving a proof or understanding a joke. Often devoid of sensory "tingle." If pleasure is sensory, this isn't pleasure. If it is pleasure, sensory theories die.
  4.  **Malicious Joy (Schadenfreude):** Pleasure taken in another's suffering. The object is negative, the experience is positive. Does the morality of the object affect the *status* of the pleasure as a good?
  5.  **Self-Deprecating Failure:** The weird chuckle at one's own clumsiness. A negative event (failure) triggers a positive state. Is this a recognition of safety ("I didn't die") or a genuine pleasure in the failure itself?
  6.  **Anhedonic Dissociation:** Patients who report "I know I should like this, I am smiling, but I feel nothing." Distinguishes *liking* (phenomenal) from *wanting* (motivational).
  7.  **Anticipatory Dread vs. Excitement:** Physiological arousal is identical. The valence depends entirely on cognitive framing. Is the pleasure in the arousal or the framing?
  8.  **The "Dead End" Lever:** Stimulation of reward pathways causing an organism to pursue stimulation until death, ignoring food/water. This suggests *wanting* can be decoupled from *well-being* or *liking*.

  ---

  ### Phase 2: The Desiderata Specification

  Any viable theory of pleasure must satisfy the following constraints. I have flagged them as **Non-Negotiable (NN)** or **Relaxable (R)**.

  #### A. Phenomenal Constraints
  1.  **Heterogeneity Tolerance (NN):** The theory must accommodate the fact that the "feel" of eating chocolate, solving an equation, and hearing a sad song share no obvious common sensory quality (no "pleasure atom").
  2.  **Phenomenal Presence (NN):** There must be *something it is like* to experience pleasure. A purely dispositional account (where one *would* smile but feels nothing) is insufficient.
  3.  **Valence Unity (NN):** Despite heterogeneity, all instances must share a unified direction of "goodness" or positive affect. It cannot be that some pleasures are "good" and others are "bad" by definition.

  #### B. Intentional & Cognitive Constraints
  4.  **Object-Independence (R):** The theory should ideally explain pleasures that lack a specific object (e.g., drug-induced euphoria, undirected joy) vs. those that are propositional (pleasure *that* P). *Relaxable if the theory can reduce undirected pleasure to directed pleasure about one's own state.*
  5.  **Truth-Independence (NN):** One can take pleasure in a falsehood (e.g., a deceived spouse enjoying a fake marriage). The theory must account for the pleasure existing even if the intentional object is false.
  6.  **Distinction: Pleasure vs. Liking (NN):** Must distinguish the *experience* of pleasure from the *judgment* that one likes it. (See Anhedonic Dissociation).
  7.  **Distinction: Pleasure vs. Relief (NN):** Must distinguish positive addition from mere subtraction of pain. If relief is pleasure, the mechanism must be specified without circularity.

  #### C. Normative & Motivational Constraints
  8.  **Intrinsic Reason-Giving (NN):** The experience of pleasure must provide a *prima facie* reason for its continuation or recurrence, independent of external goals.
  9.  **Distinction: Higher vs. Lower (R):** Ideally, the theory provides a non-arbitrary metric to rank pleasures (e.g., intellectual vs. sensory) without appealing to external moralizing. *Relaxable if the theory can at least explain why agents *treat* them differently.*
  10. **Motivational Force vs. Normativity (NN):** Must explain why we are *moved* by pleasure (motivation) without collapsing into the claim that pleasure *is* the motivation (which fails in cases of weakness of will or addiction).

  #### D. Empirical Constraints
  11. **Distributed Correlates (NN):** Cannot posit a single "pleasure center." Must be compatible with distributed neural processing (opioid systems for liking, dopamine for wanting, orbitofrontal for valuation).
  12. **Temporal Extension (R):** Must account for pleasures that endure over time vs. momentary spikes. *Relaxable if momentary spikes are treated as the fundamental unit.*

  ---

  ### Phase 3: The "Killer" Requirement

  There is one specific desideratum that simultaneously falsifies the three dominant historical accounts (Felt-Quality, Pro-Attitude, Functionalism).

  **The Requirement:** **The Phenomenal-Normative Identity Constraint across Heterogeneous States.**
  *Definition:* The theory must identify a property common to all pleasures that is **intrinsically normative** (provides a reason for action) and **constitutively phenomenal** (part of the experience itself), despite the **phenomenal heterogeneity** of the states.

  **Why this wipes out the contenders:**

  1.  **Felt-Quality Theories (e.g., Classic Hedonism):**
      *   *Failure:* They satisfy the "Phenomenal" and "Normative" link (the feel *is* the good), but they fail **Heterogeneity**. There is no single "tingle" common to sex, math, and music. If they posit a "neutral feel" added to sensations, it is empirically undetectable and phenomenologically empty.
  2.  **Pro-Attitude Theories (e.g., Desire Satisfactionism):**
      *   *Failure:* They satisfy **Heterogeneity** (any state can be an object of desire), but they fail **Phenomenal-Normative Identity**. They make pleasure contingent on a desire (attitude), not the experience itself. This violates the *Intrinsic Reason-Giving* constraint: if I desire my own torture, is that pleasure *good*? Pro-attitude theories lose the normative force of the *experience* and tie it to the *contingency of the desire*.
  3.  **Functionalist Theories (e.g., Role-Functionalism):**
      *   *Failure:* They satisfy **Heterogeneity** and **Empirical Constraints**, but they fail **Constitutively Phenomenal**. They define pleasure by what it *does* (reinforces behavior), not what it *is*. This violates the *Phenomenal Presence* constraint. A zombie could satisfy the functional role without experiencing the normative "pull" of pleasure.

  ---

  ### Phase 4: Theory Scorecard

  | Theory Type | Heterogeneity (NN) | Phenomenal Presence (NN) | Intrinsic Normativity (NN) | Empirical Fit (NN) | **Total Viability** |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | **Felt-Quality** | ❌ | ✅ | ✅ | ❌ | **Falsified** |
  | **Pro-Attitude** | ✅ | ❌ | ❌ | ✅ | **Falsified** |
  | **Functionalism** | ✅ | ❌ | ❌ | ✅ | **Falsified** |
  | **Attitudinal-Phenomenal Hybrid** | ✅ | ✅ | ⚠️ | ✅ | **Contender** |

  **Scoring Notes:**
  *   **Felt-Quality:** Fails Heterogeneity (no common feel) and Empirical Fit (no neural locus for a "common feel").
  *   **Pro-Attitude:** Fails Phenomenal Presence (desire is not a feel) and Intrinsic Normativity (desires can be misguided/evil, stripping the pleasure of inherent value).
  *   **Functionalism:** Fails Phenomenal Presence (role ≠ feel) and Intrinsic Normativity (function explains mechanism, not value).
  *   **Attitudinal-Phenomenal Hybrid:** (e.g., "Pleasure is an attitude *toward* a sensation"). This is the only surviving class. It scores ⚠️ on Normativity because it still struggles to explain why holding the attitude is *good* without circularity, but it survives the "Killer Requirement" better than the pure types.

  **Conclusion:** No existing pure theory meets the **Phenomenal-Normative Identity Constraint across Heterogeneous States**. A viable theory must likely be a disjunctive natural kind or a new category of "affective intentionality" that has not yet been fully formalized.
