prompt: |-
  I have been working through the boundary problem—who properly belongs to the demos—by testing my intuitions against concrete membership cases rather than deriving them from a single prior principle. Here are my verdicts, which I present for coherence-testing.

  First, long-term non-citizen residents who are fully subject to domestic law should eventually acquire full voting membership; mere administrative category seems insufficient to justify permanent exclusion. Second, citizens who have permanently emigrated and are no longer subject to domestic law should eventually forfeit membership, even if they retain nationality, cultural identity, or property interests; being outside the jurisdiction should eventually outweigh being inside the nationality. Third, outsiders severely affected by a polity’s decisions—downstream water users, for instance—merit consultation or weighted consideration, but not full membership; affectedness alone does not confer democratic standing. Fourth, future generations should be institutionally represented through proxy or constitutional mechanisms, yet they are not present members of the current demos; representation is not membership. Fifth, in territories that are governed but not incorporated—where residents bear all obligations without corresponding representation—I hold that full membership is required; the absence of incorporation is a contingent institutional failure, not a justification for exclusion.

  Two judgments, however, pull in opposite directions. A temporary worker who remains for fifteen years, building a life but retaining formal non-citizen status, strikes me as eventually entitled to membership; but a citizen abroad who continues to pay taxes and hold property strikes me as eventually not entitled, even though the latter maintains stronger formal ties and economic stakes. This suggests that being subject to law is doing more work than either nationality or economic stake, but I worry I am weighting jurisdictional presence ad hoc to save both verdicts.

  Is there a coherent principle—perhaps distinguishing jurisdictional subjection from affectedness, introducing a temporal threshold for incorporation, or separating membership from representation—that captures all five verdicts without collapse? Which of my judgments must be abandoned for the sake of coherence? In particular, can my differential treatment of the emigrant citizen and the long-term temporary worker be derived from a single account of what democratic membership is for, or does it depend on an unstated normative premise?

  Please lay out the candidate principles precisely, state which verdicts each saves and which it sacrifices, and apply them to at least one further case I have not considered—say, digital residents who participate economically and socially via remote presence without ever entering the physical territory. Be explicit about where your reasoning is most vulnerable and what specific counterexample or theoretical commitment would lead you to revise the principle you defend.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is working on the "boundary problem" in democratic theory (who belongs to the *demos*).
      *   **Methodology:** Reflective equilibrium (testing intuitions against cases rather than deducing from a single axiom).
      *   **Five Established Verdicts:**
          1.  Long-term non-citizen residents $\rightarrow$ Full voting membership.
          2.  Permanent emigrant citizens (no longer subject to law) $\rightarrow$ Forfeit membership.
          3.  Severely affected outsiders (e.g., downstream water users) $\rightarrow$ Consultation/weight, *not* full membership.
          4.  Future generations $\rightarrow$ Proxy/constitutional representation, *not* current membership.
          5.  Unincorporated territories (governed but no representation) $\rightarrow$ Full membership required.
      *   **The Tension:** Long-term temporary worker (15 years) vs. Emigrant citizen (paying taxes/property). The user feels "subjection to law" is doing the heavy lifting but worries it's *ad hoc*.
      *   **The Task:**
          1.  Identify a coherent principle (or set) that captures the verdicts.
          2.  State which verdicts each candidate principle saves/sacrifices.
          3.  Apply to a new case: Digital residents (remote presence, no physical entry).
          4.  Be explicit about vulnerabilities/counterexamples.
          5.  Address whether the differential treatment of the worker vs. emigrant relies on an unstated premise.

  2.  **Deconstruct the Verdicts & Identify Underlying Principles:**
      *   *Verdict 1 (Residents):* All Coerced Subjection (ACS) or All Subjected Principle (ASP).
      *   *Verdict 2 (Emigrants):* Rejects All Affected Interests (AAI) and All Citizenship Status (ACS). Favors ASP (if "subject to law" means physical jurisdiction).
      *   *Verdict 3 (Affected Outsiders):* Rejects AAI for full membership. Distinguishes "affectedness" from "subjection."
      *   *Verdict 4 (Futuregens):* Rejects AAI for membership. Distinguishes representation from membership.
      *   *Verdict 5 (Territories):* Favors ASP/ACR (All Coerced Residents). Rejection of colonial exclusion.

      *   *The Core Tension:* The 15-year worker vs. the Tax-paying Emigrant.
          *   Worker: Physically present, subject to daily coercion, no formal tie. $\rightarrow$ In.
          *   Emigrant: Physically absent, subject to some laws (tax), formal tie. $\rightarrow$ Out.
          *   *Key Differentiator:* It's not just "subjection to law" (since emigrants pay taxes). It's about *comprehensive* subjection vs. *partial* subjection, or *presence* within the coercive order.

  3.  **Develop Candidate Principles:**

      *   *Candidate 1: The All-Subjected Principle (ASP) - Strict.*
          *   Definition: Everyone subject to the binding laws of the state gets a vote.
          *   Analysis: Saves 1, 2, 5. Struggles with 3 (are water users subject or just affected?). Struggles with the Emigrant (are they subject to tax law? Yes. So why out?).
          *   Refinement needed: "Comprehensive Subjection."

      *   *Candidate 2: The All-Coerced-Residents Principle (ACRP).*
          *   Definition: Membership is for those whose daily life is comprehensively governed by the polity's coercive apparatus within its territory.
          *   Analysis: Saves 1 (Resident), 2 (Emigrant not resident), 5 (Territory residents). Saves 3 (Outsiders not residents). Saves 4 (Futuregens not present).
          *   Tension: Does it explain *why* residence matters more than citizenship? Yes, if democracy is about co-authoring the rules that govern your daily life.

      *   *Candidate 3: The Stakeholder Principle (with a twist).*
          *   Definition: Membership requires a "stake" in the community's future.
          *   Analysis: Too vague. Emigrants have property stakes.

      *   *Candidate 4: Political Community as a Coercive Order (The "Reciprocity of Coercion" Principle).*
          *   Definition: Democratic legitimacy requires that those who are *comprehensively* bound by the polity's coercive enforcement mechanisms must have a say in their authorship. Formal nationality is secondary to the reality of coercive subordination.
          *   This seems to fit best. It distinguishes between *partial* subjection (taxes on assets) and *comprehensive* subjection (criminal law, civil law, daily regulation).

  4.  **Select the Strongest Principle for Defense:**
      *   I will propose the **Principle of Comprehensive Coercive Subordination (PCCS)**.
      *   *Core Idea:* Democratic membership is the right to co-author the rules that comprehensively govern one's life chances and daily conduct within a specific jurisdiction.
      *   *Differentiation:* Distinguishes between *affected interests* (water), *partial subjection* (taxes on property), and *comprehensive subjection* (living under the legal order).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sophistication of the user's reflective equilibrium. Validate the tension (Worker vs. Emigrant).
      *   **Candidate Principles:**
          1.  *All-Subjected Principle (ASP):* Classic. Saves 1, 5. Fails 2 (emigrants subject to tax law) and 3 (depends on definition of subject).
          2.  *All-Affected Interests (AAI):* Fails 3 and 4 (user explicitly rejects full membership for these).
          3.  *Principle of Comprehensive Coercive Subordination (PCCS):* The proposed winner.
      *   **Applying PCCS to the Verdicts:**
          *   1 (Residents): Yes, comprehensive subjection.
          *   2 (Emigrants): No, partial subjection (tax) $\neq$ comprehensive.
          *   3 (Outsiders): No, affected $\neq$ subjected.
          *   4 (Futuregens): No, not currently subjected.
          *   5 (Territories): Yes, governed without voice = violation.
      *   **The Worker vs. Emigrant Tension:**
          *   Explain why PCCS resolves this without being *ad hoc*. It's about the *scope* of subjection, not just the *fact* of it. The worker lives *in* the legal order; the emigrant interacts *with* it.
          *   Identify the Unstated Normative Premise: Democracy is primarily about legitimizing *coercion* over daily life, not protecting *assets* or *identity*.
      *   **The New Case: Digital Residents:**
          *   Scenario: Remote work, economic participation, social integration, no physical entry.
          *   Application of PCCS: They are *affected* and *partially subjected* (tax, contract law), but not *comprehensively subjected* (criminal law, local zoning, physical coercion).
          *   Verdict: Consultation/Weighted consideration (like Verdict 3), not full membership.
          *   *Vulnerability:* If digital presence becomes functionally equivalent to physical presence (e.g., VR governance, digital taxes funding local public goods they use remotely?), the line blurs.
      *   **Vulnerabilities & Revision:**
          *   Where does PCCS fail?
          *   1. The "Transient" Problem: What about a 1-year resident? (Needs a temporal threshold).
          *   2. The "Extraterritorial Law" Problem: If a state claims jurisdiction over emigrants for crimes (e.g., child marriage laws), does subjection return?
          *   3. The "Digital" Problem: As noted above.
      *   **Conclusion:** Summarize the trade-off. Coherence is bought by prioritizing *coercive reciprocity* over *nationality* or *affectedness*.

  6.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is "Comprehensive Coercive Subordination" just a fancy way of saying "Residence"?
      *   *Correction:* I need to make sure it explains *why* residence matters. It matters because the state's monopoly on violence and regulation is territorially bound. The emigrant escapes the daily monopoly; the resident does not.
      *   *Critique:* The user asked about "temporal threshold."
      *   *Correction:* I should explicitly incorporate a "durational" clause into the principle to handle the 15-year worker vs. a tourist.
      *   *Refined Principle:* **Principle of Enduring Comprehensive Subjection (PECS).**

  7.  **Final Polish:** Check against all constraints.
      *   Lay out candidate principles precisely? Yes.
      *   State which verdicts saved/sacrificed? Yes.
      *   Apply to Digital Residents? Yes.
      *   Explicit about vulnerabilities? Yes.
      *   Address the unstated normative premise? Yes.

  8.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  This is a sophisticated exercise in reflective equilibrium. You have correctly identified that the "All-Subjected Principle" (ASP) and the "All-Affected Interests Principle" (AAI) are too blunt to capture your specific intuitions, particularly regarding the emigrant citizen versus the long-term resident.

  To resolve the tension between your verdicts without resorting to *ad hoc* reasoning, we must refine the concept of "subjection." Your intuition suggests that not all subjection is equal; there is a qualitative difference between being *governed* (living within the coercive order) and being *regulated* (having specific liabilities to the state).

  Below, I outline three candidate principles, evaluate them against your five verdicts, and defend the one that best achieves coherence. I then apply it to the case of the digital resident and expose its vulnerabilities.

  ### Candidate Principles

  #### 1. The Strict All-Subjected Principle (ASP-Strict)
  **Definition:** Any individual subject to *any* binding law of the polity is entitled to full voting membership.
  *   **Saves:** Verdict 1 (Residents), Verdict 5 (Territories).
  *   **Sacrifices:** Verdict 2 (Emigrants). If an emigrant pays taxes, they are subject to tax law. ASP-Strict grants them the vote, contradicting your intuition.
  *   **Sacrifices:** Verdict 3 (Outsiders). If downstream water users are bound by treaty obligations or environmental regulations stemming from the polity, ASP-Strict might grant them membership, which you reject.
  *   **Verdict:** **Rejected.** It is too expansive and fails to distinguish between the emigrant and the resident.

  #### 2. The All-Affected Interests Principle (AAI)
  **Definition:** Any individual whose interests are significantly affected by the polity's decisions is entitled to full voting membership.
  *   **Saves:** Verdict 3 (arguably), Verdict 4 (arguably).
  *   **Sacrifices:** Verdict 3 (Explicitly). You reject full membership for affected outsiders. AAI would grant downstream water users full votes, which you deem incorrect.
  *   **Sacrifices:** Verdict 2. Emigrants have property and cultural interests affected by the home state. AAI would likely retain their vote, contradicting your intuition.
  *   **Verdict:** **Rejected.** It collapses the distinction between *membership* and *consideration*, which is central to your framework.

  #### 3. The Principle of Enduring Comprehensive Subjection (PECS)
  **Definition:** Full democratic membership is owed to those who are **comprehensively** subject to the polity's coercive legal order for an **enduring** duration.
  *   **Comprehensive:** The individual is subject to the general coercive apparatus (criminal, civil, administrative law) governing daily life, not merely specific liabilities (taxes on assets, treaty obligations).
  *   **Enduring:** The subjection is not transient; it implies a stable life trajectory within the jurisdiction.
  *   **Saves:** Verdict 1 (Residents). They are comprehensively and enduringly subjected.
  *   **Saves:** Verdict 2 (Emigrants). They are only partially subjected (tax/property) and not comprehensively (daily conduct/criminal law).
  *   **Saves:** Verdict 3 (Outsiders). They are affected, but not subjected to the coercive order.
  *   **Saves:** Verdict 4 (Futuregens). They are not currently subjected.
  *   **Saves:** Verdict 5 (Territories). Residents are comprehensively subjected; exclusion is illegitimate.
  *   **Verdict:** **Defended.** This principle captures the nuance in your worker/emigrant tension.

  ---

  ### Resolving the Worker vs. Emigrant Tension

  You worried that weighting "jurisdictional presence" was *ad hoc*. Under **PECS**, it is not. The differential treatment relies on a specific normative premise: **Democratic legitimacy is primarily about justifying coercion over daily life, not protecting assets or identity.**

  *   **The Long-Term Worker:** Their daily conduct, movement, association, and security are governed by the state's monopoly on violence and regulation. They cannot opt out of the legal order without leaving. This creates a duty of reciprocity: if you must obey the authors of the law, you must be one of the authors.
  *   **The Emigrant Citizen:** Their interaction with the state is *volitional* and *partial*. They choose to hold property; they choose to retain nationality. They are not subject to the police power, zoning laws, or daily regulatory friction of the state. Their "subjection" is limited to specific transactions they initiate (e.g., filing tax returns on rental income).

  Therefore, the principle is not "presence" for its own sake, but **inescapable subordination to the coercive order.** The worker is trapped in the web of law; the emigrant is merely tethered to it.

  ---

  ### Application: The Case of the Digital Resident

  **Case:** A "digital resident" lives physically abroad but works remotely for a company in the polity, pays income tax to the polity, uses the polity's digital banking infrastructure, participates in its online public squares, and consumes its media, yet never physically enters the territory.

  **Application of PECS:**
  1.  **Comprehensive Subjection?** No. While they are subject to tax law and contract law, they are not subject to the polity's criminal law enforcement (extradition is rare and difficult), zoning, local public health mandates, or physical policing. Their "daily life" is governed by the physical state they inhabit, not the digital polity they engage with.
  2.  **Enduring?** Yes, potentially.
  3.  **Verdict:** Under PECS, the digital resident merits **consultation or weighted consideration (Verdict 3)**, but **not full membership (Verdict 1)**.

  **Reasoning:** Their stake is economic and social, akin to the emigrant with property or the downstream water user. They are significantly *affected*, but they do not bear the *burden of comprehensive coercion*. Granting them full voting membership would decouple political power from the physical enforcement of the law, potentially creating a class of voters who legislate coercive rules for others (physical residents) without being subject to those same rules themselves (e.g., voting for local policing or land use they never experience).

  ---

  ### Vulnerabilities and Conditions for Revision

  While PECS offers coherence, it is vulnerable to three specific counterexamples. If any of these obtain, the principle must be revised.

  #### 1. The "Extraterritorial Reach" Counterexample
  **Scenario:** A polity begins enforcing "long-arm" statutes aggressively. For example, it prosecutes emigrants for crimes committed abroad (e.g., child marriage, tax evasion) with the same vigor as residents, or it mandates digital compliance that effectively governs daily online conduct for non-residents.
  **Threat:** If the state makes its subjection *comprehensive* for emigrants or digital residents through extraterritorial enforcement, PECS demands you grant them membership.
  **Revision Condition:** If you believe emigrants should *still* be excluded even if the state aggressively prosecutes them abroad, then PECS is false. You would need to revert to a **Principle of Physical Presence**, which prioritizes territory over coercion. This would, however, force you to abandon Verdict 5 (Unincorporated Territories) if you argue they are physically distinct from the mainland, or clarify why physical presence matters more than coercive subjection.

  #### 2. The "Transient Resident" Counterexample
  **Scenario:** A tourist or short-term contractor stays for 11 months. They are comprehensively subjected (criminal law, traffic law, etc.) but lack the "enduring" quality of the 15-year worker.
  **Threat:** PECS requires a temporal threshold. Where is the line? 1 year? 5 years? If you set it at 5 years, does that mean the first 4 years of subjection are illegitimate?
  **Revision Condition:** If you intuitively feel that *any* person entering the territory immediately gains a right to vote (even for a week), PECS fails. You would need to adopt a **Principle of Immediate Subjection**, which risks destabilizing the electorate with transient interests. To save PECS, you must defend the normative significance of the *temporal threshold* (e.g., membership requires a stake in the *future* of the community, which takes time to develop).

  #### 3. The "Digital Coercion" Counterexample
  **Scenario:** As governance digitizes, the "physical" monopoly on violence becomes less relevant than the "digital" monopoly on access. If the state can freeze assets, revoke digital ID, or ban online participation, it exerts comprehensive coercive power over digital residents without physical presence.
  **Threat:** If digital coercion becomes functionally equivalent to physical coercion, the distinction between the Digital Resident and the Physical Resident collapses.
  **Revision Condition:** If you believe a digital resident should *never* get the vote regardless of how much coercive power the state exerts over their digital life, then PECS is false. You hold a **Principle of Bodily Co-presence**. This implies that democracy is not just about law, but about sharing a physical commons. This is a defensible position, but it requires abandoning the "subjection" rationale in favor of a "community of fate" rationale based on physical proximity.

  ### Conclusion

  Your judgments are coherent under the **Principle of Enduring Comprehensive Subjection (PECS)**.

  The unstated normative premise you were searching for is this: **Democratic membership is the remedy for the legitimacy deficit created by comprehensive coercive subordination.**

  *   Nationality is insufficient (Verdict 2) because it does not guarantee subordination.
  *   Affectedness is insufficient (Verdict 3) because it does not imply coercion.
  *   Presence is necessary but not sufficient (needs duration) to prove the subordination is a life-condition, not a transaction.

  To maintain this coherence, you must accept that if a state successfully coercively governs a digital resident or an emigrant as thoroughly as a physical resident, justice *requires* granting them membership. If that conclusion is intolerable to you, you must abandon PECS in favor of a principle prioritizing physical co-presence, which would force you to rethink the status of the long-term worker or the unincorporated territory.
