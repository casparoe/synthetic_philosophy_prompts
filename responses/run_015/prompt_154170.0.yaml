  # Q&A PREP SHEET
  **Seminar:** Philosophy-of-Mind & Clinical-Phenomenology
  **Thesis:** Radical Freedom as Ontological Non-Coincidence; Bad Faith as Intercorporeal Attention-Modulation.

  ---

  ### 1. The Predictive-Processing Researchers (Likelihood: High | Damage: Critical)
  **The Objection:**
  "You claim this makes Sartre empirically tractable, but it sounds like you're just mapping 'radical freedom' onto the gap between prior expectations and sensory evidence. If freedom is just the brain's ability to update priors to minimize prediction error, you've reduced ontology to mechanics. If it's *not* that, then where is the data? How do you measure 'non-coincidence' without turning it into a metaphor for precision weighting?"

  **My Reply:**
  "I'm not reducing freedom to prediction error; I'm locating freedom in the structural condition that makes prediction error possible. Predictive Processing explains the *ontic* mechanism of how body ownership is maintained—how the brain models the self as an object. My thesis addresses the *ontological* gap that allows that model to be disrupted. When I say consciousness fails to coincide with facticity, I mean the subject is the *nothingness* that allows the predictive model to be rejected, not just the error signal itself. PP describes the cage; I'm describing the hole in the cage bars. We can measure this clinically: look at moments of radical behavioral shift that *increase* prediction error (e.g., a stutterer forcing speech, a trauma survivor entering a trigger space). Standard PP models this as 'maladaptive.' I model it as the exercise of freedom—the subject refusing to minimize error in favor of asserting a possibility that contradicts the current model. I'm not competing with your math; I'm providing the phenomenological ground for why the system doesn't just lock into the lowest-energy state."

  **Weakness/Concession:**
  *I risk sounding dualist here if I can't specify the "structural condition" without invoking a homunculus.*

  ---

  ### 2. The Clinical Phenomenologist (Likelihood: High | Damage: Ethical/Foundational)
  **The Objection:**
  "You talk about non-coincidence as a universal structure, but trauma *forces* coincidence. In dissociation, the subject doesn't 'fail to coincide' with their body; they are violently severed from it. To call the survival strategy of a torture victim 'bad faith' or a modulation of attention implies a level of agency that simply isn't there. Doesn't your ontological commitment to freedom blame the victim for their own dissociation?"

  **My Reply:**
  "I need to be precise: I am not conflating ontological freedom with ontic capacity. Trauma drastically restricts the *field* of facticity—it narrows the possibilities available to be projected. But the structure of consciousness remains. In dissociation, the subject isn't 'choosing' to leave their body in a libertarian sense; they are enacting the only available mode of non-coincidence to survive. My reading of bad faith here isn't about blame; it's about mapping the architecture of survival. When a victim adopts the aggressor's Look to anticipate violence, they are distributing agency intercorporeally to stay alive. Recognizing this as a structure of freedom isn't an accusation; it's the only way to restore agency in therapy. If we treat dissociation as purely causal damage, the patient remains an object. If we treat it as a rigidified strategy of freedom, we open a path to change it."

  **Weakness/Concession:**
  *I must be careful not to minimize the sheer coercive force of trauma; the line between "strategy" and "symptom" is dangerously thin.*

  ---

  ### 3. The Clinical Psychologist (Likelihood: Medium | Damage: Practical)
  **The Objection:**
  "Let's say I buy the intercorporeal model. But does this help anyone in the clinic? If I tell a depressed patient, 'You are distributing agency to an imagined social witness,' does that get them out of bed? Or does it just give them a new, more complex way to feel guilty about their inability to choose?"

  **My Reply:**
  "It changes the target of intervention. Standard CBT targets intrapsychic content—'challenge the negative thought.' My approach targets the *social field* of the attention. We don't ask the patient to fix their thoughts; we ask them to identify *whose eyes* they are seeing themselves through. Is it the critical parent? The abstract 'public'? The therapy becomes about altering that imagined witness, not fixing the internal logic. This externalizes the struggle, which reduces shame. It's not about 'choosing better'; it's about recognizing that your body-schema is currently organized around a hostile Look. We work to populate that social field with witnesses that sustain rather than negate your facticity. It's less cognitive load, more relational re-orientation."

  **Weakness/Concession:**
  *This requires a level of abstract reflection that acute patients may not possess; it risks being too intellectual for crisis work.*

  ---

  ### 4. The Analytic Philosopher of Action (Likelihood: Medium | Damage: Theoretical)
  **The Objection:**
  "You say Sartre isn't a libertarian, and you redefine freedom as 'non-coincidence.' Fine. But compatibilism already accounts for responsibility without this ontological drama. If my actions flow from my desires and beliefs, I'm responsible. Why do we need this mysterious 'nothingness'? You're attacking a strawman of determinism to sell a solution nobody needs."

  **My Reply:**
  "Compatibilism saves responsibility, but it sacrifices the *subject*. It reduces the agent to a node in a causal network of beliefs and desires. My claim is that consciousness is *not* a node; it's the translucency through which nodes appear. If we accept compatibilism, we can explain why I am responsible for an action, but we cannot explain how I can fundamentally *revise* the desires that caused it. Non-coincidence isn't about dodging causality; it's about the fact that I am never identical to my 'character.' The analytic model explains how a machine acts; I'm explaining why the machine can question its own programming. Without this ontological gap, self-revision is just another causal input, and critique loses its normative force."

  **Weakness/Concession:**
  *I may be conceding that my view doesn't help with standard legal or moral attribution, which is what most compatibilists care about.*

  ---

  ### 5. THE QUESTION I HOPE NOBODY ASKS (The "Killer")
  **The Objection:**
  "If bad faith is an intercorporeal attention-modulation strategy driven by the Look and predictive priors, isn't it functionally determined by the social field? If the subject is just distributing agency to minimize social friction or prediction error, where is the *choice* to be in bad faith? If there's no choice, on what grounds do you normatively condemn it? You seem to have eliminated the very phenomenon of 'falling' into bad faith to save the ontology."

  **My Reply:**
  *(Pause)* "That is the tension I am living with. My response is that the 'choice' isn't a momentary event; it's a sustained posture. The determination you're pointing to is exactly what bad faith *tries* to achieve—it tries to turn the subject into a determined object. The normative bite remains because the attempt *fails*. You can never fully become the object you pretend to be. The condemnation isn't that you chose wrongly; it's that you are exhausting yourself trying to be something you are not. The 'choice' is the refusal to own the failure of that project."

  **Weakness/Concession:**
  *This admits that "choice" is retrospective, which risks undermining the agency required for the normative critique to land.*
