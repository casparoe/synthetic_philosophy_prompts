  We stand before the ledger of the stars,
  Where lives extend in endless open rows.
  We thought to sum the joy and subtract pain,
  And find the value waiting at the end.
  For every finite set the scale holds true,
  A simple aggregation of the good.
  We stretch our lines to reach the infinite,
  Convinced we weigh a world that can be known.
  But shift the order, and the limit breaks.
  There's no uniform measure on the line.
  Conditioned series bend to every shape.
  We weigh the air where certainty once stood.
  Dominion fails for sets beyond all count.
  No canonical scale to hold the ground.
  We face the void of pure comparison,
  Where we weigh nothing 'gainst unknown dark.
