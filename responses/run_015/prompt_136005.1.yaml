  9.  *(Self-Correction on Korsgaard)*: Korsgaard actually argues Kant *fails* and we need to grant animals direct status. I should be careful not to attribute the "Third Interpretation" to her as a defense of Kant, but rather as a critique that points toward where Kant *could* have gone or how his logic implies more than he admitted. Actually, better to stick to scholars like Wood or Denis who try to reconcile Kant's text. Let's focus on the internal logic of the *Metaphysics of Morals*.

  10. *(Final Polish)*: Ensure the distinction between "empirical hardening" and "rational corruption" is the pivot point. This answers the "isolated cruelty" problem directly.

