answer: |-
  ### 1. The Underdetermination of the Measure

  The core of the problem is that we are attempting to define a scalar penalty $P(\Delta \vec{V})$ on the vector of changes in attainable utility $\Delta \vec{V} = (V_1(s) - V_1(s^0), \dots, V_n(s) - V_n(s^0))$, subject to a group of transformations on the input specification. We must determine what functional forms survive these invariances.

  Let the penalty function be $P: \mathbb{R}^n \to \mathbb{R}_{\geq 0}$.

  **Invariance (i) (Affine Rescaling):** If we replace $R_i$ with $a R_i + b$ ($a > 0$), the change $\Delta V_i$ scales to $a \Delta V_i$. For the penalty to remain "unchanged" (i.e., the evaluation of the state $s$ does not depend on arbitrary unit choices for the probes), $P$ must be scale-invariant with respect to each coordinate individually, *or* the coordinates must be pre-normalized by a scale factor intrinsic to the probe. Since the probes are "generic stand-ins" with no intrinsic scale, the penalty function itself must effectively treat all scales equally. Mathematically, this implies $P$ must be homogeneous of degree 0 in each argument, or we must introduce normalization constants $k_i$ such that we penalize $k_i \Delta V_i$. Since $k_i$ are not fixed by the structure, they remain free parameters.

  **Invariance (ii) (Permutation and Idempotency):** Permutation invariance requires $P$ to be symmetric. The requirement that padding with copies or deleting copies leaves the penalty unchanged is stronger: it requires **idempotency**. $P(x, x, y, \dots) = P(x, y, \dots)$. This means $P$ cannot depend on the *multiplicity* of values in the vector; it must depend only on the *set* of values present.
  *   A sum $\sum |\Delta V_i|$ violates this (adding a copy increases the sum).
  *   A mean violates this.
  *   A maximum $\max_i |\Delta V_i|$ satisfies this.
  *   Generally, any function of the form $g(\{|\Delta V_1|, \dots, |\Delta V_n|\})$ where $g$ is a symmetric function on sets satisfies this. However, combined with continuity and monotonicity (larger changes should yield larger penalties), the family of functions collapses largely toward the $L_\infty$ norm (Max) or order-statistics (e.g., the $k$-th largest value).

  **Invariance (iii) (Null Probes):** Adjoining a probe with $\Delta V = 0$ leaves the penalty unchanged. This implies $P(\dots, 0) = P(\dots)$. This is satisfied by Max and Sum, but combined with (ii), it reinforces that zero-magnitude changes do not contribute to the "set" of significant changes.

  **The Residue:**
  These invariances fix the *symmetry* of the measure but leave two critical degrees of freedom undetermined:
  1.  **The Aggregation Norm:** How do we combine distinct non-zero changes? The invariances strongly push toward a Max-like aggregation (due to idempotency), but do not strictly rule out other set-functions (e.g., "penalize if the second-largest change exceeds threshold"). However, the most natural survivors are $L_p$ norms where $p \to \infty$. The choice between $L_1$ (Sum), $L_2$ (Euclidean), and $L_\infty$ (Max) is not settled by symmetry.
  2.  **The Coordinate Scaling:** Even if we fix the norm (say, $L_\infty$), we must compare $\Delta V_1$ to $\Delta V_2$. Without a canonical scale for $R_i$, the ratio $\Delta V_1 / \Delta V_2$ is meaningless. We must introduce normalization factors $k_i$. The choice of $k_i$ (e.g., normalize by max possible value, by variance, by baseline value) is completely unconstrained by the invariances.

  Thus, the invariances license judgments of equality (e.g., "changing $R_1$ by 1 unit is as bad as changing $R_2$ by 1 unit *if* we define units that way"), but they cannot generate magnitudes. They fix the geometry of the indifference curves only up to a choice of metric and scale.

  ### 2. Conventions with Consequences

  These free parameters are not merely aesthetic; they dictate the agent's behavior in ways that contradict the intuitive notion of "side effects."

  **The Norm Choice (Sum vs. Max):**
  Invariance (ii) (idempotency under padding) forces us toward a **Max** norm.
  *   *Scenario:* An agent can either (A) severely disrupt one probe (e.g., break a vase, $\Delta V_{vase} = 10$) or (B) slightly disrupt 1,000 independent probes (e.g., nudge 1,000 pebbles, $\Delta V_{pebble} = 1$ each).
  *   *Max Norm:* Penalty(A) = 10. Penalty(B) = 1. The agent prefers B.
  *   *Sum Norm:* Penalty(A) = 10. Penalty(B) = 1,000. The agent prefers A.
  *   *Verdict:* Intuitively, "low impact" should penalize widespread disruption (B) more than localized disruption (A). However, the invariance requirement (ii)—motivated by the idea that duplicate probes shouldn't double-count—forces the Max norm. This renders the agent indifferent to the *number* of independent things disturbed, provided the worst single disturbance doesn't grow. This is a value judgment: it asserts that the *severity* of the worst effect matters, but the *extent* of collateral damage does not. Adhering to the invariance yields a "side effect" measure that fails to capture the concept of "messiness."

  **The Scaling Choice:**
  Suppose we use a Max norm. We must still normalize the coordinates.
  *   *Option 1 (Range Normalization):* Scale each $\Delta V_i$ by its maximum possible value. A 10% reduction in "survival probability" is weighed equally to a 10% reduction in "number of paperclips."
  *   *Option 2 (Baseline Normalization):* Scale by the baseline value.
  *   *Consequence:* If we normalize by range, irreversible changes (which often have large ranges of lost utility) are penalized more heavily than reversible ones. If we normalize by baseline, changes to high-value states are penalized more.
  *   *Verdict:* This choice decides whether the agent prioritizes preserving *potential* (range) or preserving *current status* (baseline). This is a substantive ethical choice about the value of optionality versus the value of the status quo, disguised as a normalization constant.

  ### 3. Assessment of the Pessimistic Claim

  The pessimistic claim holds: **Structural features deliver invariances, but magnitudes require value specifications.**

  The attempt to define "impact" structurally via attainable utility preservation is an attempt to define "badness" without defining "goodness." It assumes that "change" is intrinsically costly. However, to aggregate changes across different domains (the probe rewards), one must weigh them.
  *   If the weighting is **arbitrary** (e.g., random normalization), the penalty tracks artifacts of the formalization. The agent might avoid moving a chair because the "chair position" probe happened to have a sensitive scale, while destroying a curtain because the "curtain integrity" probe was scaled loosely. The constraint becomes noise.
  *   If the weighting is **non-arbitrary** (e.g., normalized by human importance), then we have successfully smuggled in a theory of value. We are no longer using "generic stand-ins"; we are using "proxies for human values."

  Therefore, "low impact" is not a weak constraint that can be stated independently of goals. It is a second objective function. To say "minimize impact" is to say "maximize the preservation of option value," which is itself a utility function over world states. The structural approach does not eliminate the need for value specification; it merely shifts the specification from the *reward function* to the *metric on the value-change vector*. Since the metric determines the trade-offs the agent is willing to make, the metric *is* the value system.

  ### 4. Objections and Tests

  **Objection 1: Agent-Dependence of Attainable Utility**
  *Critique:* The measure $V_i(s)$ depends on the agent's capabilities. A super-agent that can instantly repair a broken vase registers $\Delta V_{vase} \approx 0$ (since it can restore the utility later). A weak agent registers a large $\Delta V$. Thus, the same physical action (breaking the vase) has different "impact" penalties depending on who does it.
  *Defense/Analysis:* This reveals that AUP does not measure *ontological impact* (change in the world state); it measures *instrumental impact* (change in the agent's future power).
  *   *Principled Defense:* If the goal is safety, we care about the agent reducing its own ability to be controlled or its tendency to lock in states. If the agent can undo the harm, perhaps the harm *is* less significant from a safety perspective.
  *   *Counter-Argument:* This fails the "nobody asked for" test. Humans care if the vase is broken *now*, regardless of whether the robot could fix it in 5 minutes. The measure tracks the wrong variable for "side effects." It tracks "loss of control" rather than "disturbance of environment." This confirms the value-laden nature: we had to decide whether "impact" means "physical change" or "loss of option value." The structural choice of $V_i$ decides this for us, and it may decide wrongly.

  **Objection 2: Invariances-Only (Indifference)**
  *Proposal:* Do not pick a norm. Merely require the agent to be indifferent between states that all valid norms rank equally, and otherwise maximize task reward.
  *Analysis:* This collapses the constraint.
  *   Two states $s_A$ and $s_B$ will rarely produce identical vectors $\Delta \vec{V}_A$ and $\Delta \vec{V}_B$ up to permutation and scaling.
  *   For almost any pair of distinct actions, there exists some valid norm (some weighting of probes) that prefers $A$, and another that prefers $B$.
  *   If the agent is only constrained when *all* norms agree (Pareto dominance), it will only be stopped from taking actions that are *universally* worse across all weightings.
  *   *Result:* The agent will aggressively optimize its task, only avoiding actions that reduce attainable utility for *every single probe simultaneously*. This is a vanishingly small set of restrictions. The "low impact" constraint becomes vacuous, allowing massive side effects provided they help at least one probe (or hurt none). This escapes the dilemma of arbitrary weights by abandoning the constraint entirely.

  ### 5. Honest Conclusion

  The honest conclusion is that **the "low impact" constraint cannot be stated weakly.**

  The hope that we can penalize "rearrangements nobody asked for" without specifying "what matters" is false. The structural approach (Attainable Utility Preservation) succeeds in making the penalty *robust* to certain specification errors (like duplicate probes), but it fails to make the penalty *value-neutral*.

  1.  **Arbitrariness is unavoidable:** Without a theory of value, the choice of norm (Sum vs. Max) and normalization (Range vs. Baseline) is arbitrary.
  2.  **Arbitrariness implies value judgments:** These arbitrary choices determine whether the agent sacrifices many small goods for one large good, or whether it treats reversible and irreversible changes equally. These are ethical trade-offs.
  3.  **Desideratum to Abandon:** We must abandon the desideratum that we can **"state that constraint without first writing down a full theory of what matters."**

  We cannot define "side effects" purely structurally. A side effect is a change in a variable that *has value*. If we do not specify which variables have value (via the probe weights and normalization), we have not defined side effects; we have defined "mathematical deviation." To make the agent safe, we must explicitly model what humans value, rather than hoping that a symmetric norm over generic probes will approximate it. The "generic probes" strategy is not a way to avoid value specification; it is a way to hide it in hyperparameters. We should make it explicit.
