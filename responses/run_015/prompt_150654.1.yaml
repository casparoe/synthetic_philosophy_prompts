answer: |-
  # JOINT STATEMENT OF ADVERSARIAL COLLABORATION
  **Subject:** Rationality and Time Consistency in the Absent-Minded Driver Problem  
  **Parties:** The Ex-Ante Planning Camp (EAC) & The Node-Level Agency Camp (NAC)  
  **Date:** October 26, 2023  
  **Scribe:** Neutral Facilitator  

  ---

  ## 1. COMMON GROUND (NUMBERED CLAIMS)
  *Both camps affirm the following statements as factually and mathematically correct within the standard setup.*

  1.  **The Setup:** The driver faces two indistinguishable exits. Exit 1 yields payoff 0. Exit 2 yields payoff 6. Missing both yields payoff 1. The driver cannot distinguish exits nor remember past passage.
  2.  **The Strategy:** A strategy is defined by a single number, $p$, representing the probability of stopping at any exit encountered.
  3.  **The Ex-Ante Value:** The expected value of the trip calculated before departure, given strategy $p$, is:
      $$V_{start}(p) = 1 + 4p - 5p^2$$
      This function is maximized at $p = 0.4$ ($2/5$), yielding a value of $1.8$ ($9/5$).
  4.  **Belief Updating:** If the driver assumes he is following strategy $p$, the probability that his current location is Exit 1 (rather than Exit 2) is:
      $$P(\text{Exit 1} \mid \text{At Exit}) = \frac{1}{2 - p}$$
  5.  **Node Indifference:** At $p = 0.4$, the driver is indifferent at the exit between stopping immediately and continuing (assuming his future self continues to follow $p$). The expected value calculated at the exit is $2.25$ ($9/4$).
  6.  **No New Information:** The driver gains no new physical information upon arriving at an exit that he did not possess at the start, other than the fact that he has survived to reach an exit.

  ---

  ## 2. RESIDUAL DISAGREEMENTS
  *Where the camps diverge on interpretation and normative force.*

  | Topic | Ex-Ante Camp (EAC) Wording | Node-Level Camp (NAC) Wording |
  | :--- | :--- | :--- |
  | **Unit of Analysis** | Rationality is a property of the **plan** selected at $t=0$. The agent is a single temporally extended entity. | Rationality is a property of the **action** selected at $t=k$. The agent is a sequence of temporal selves. |
  | **Deviation** | Deviating from the optimal plan at the exit is a **failure of rationality** (akrasia or inconsistency). | A plan that would be abandoned at the exit is **not a valid plan**. It is a false prediction. |
  | **Beliefs** | The belief $P(\text{Exit 1}) = 1/(2-p)$ is **mandated** by the strategy. You must condition on your own policy. | The belief $P(\text{Exit 1}) = 1/(2-p)$ is **optional**. It is one way to model forgetting, but the agent at the node acts on current evidence, not past commitments. |
  | **Terminology** | "Rationality" means **Time-Consistent Planning**. | "Rationality" means **Sequential Equilibrium**. |

  ---

  ## 3. CRUXES AND TEST CASES
  *Fundamental points of contention where empirical or logical pressure applies.*

  ### Crux A: The Status of the Plan
  **Question:** Is a plan a *command* issued by the past self, or a *prediction* made by the present self about future behavior?

  *   **EAC View:** A command. Rationality requires binding your future self to the optimal path identified with better information (at the start).
  *   **NAC View:** A prediction. If the future self has no incentive to obey, the plan is fiction. Rationality requires acting optimally given the current situation.

  **Test Case:** *The Pre-Commitment Device.*
  Suppose the driver can pay a small cost $\epsilon$ at the start to install a governor that forces strategy $p=0.4$.
  *   **EAC Prediction:** The driver **will pay** $\epsilon$. It secures the ex-ante optimal value ($1.8$) against future weakness.
  *   **NAC Prediction:** The driver **will pay** $\epsilon$. Not because of "binding," but because the "self" at the exit *prefers* to be forced, acknowledging that without the governor, the exit-self would deviate to a locally superior choice.
  *   **Verdict:** **Verbal.** Both agree on the action (buy the governor). They disagree on whether this proves the plan was rational (EAC) or that the unforced plan was impossible (NAC).

  ### Crux B: Existence of Optimal Solutions
  **Question:** Must a rational situation always admit a best strategy?

  *   **EAC View:** Yes. If the math yields no maximum, the model is flawed or requires a limit concept (e.g., $p \to 0$).
  *   **NAC View:** No. If the incentives at the node contradict the incentives at the start, there may be no stable equilibrium.

  **Test Case:** *The Ring-Road Variant.*
  (See Technical Addendum for algebra). A circular road with alternating payoffs (0, 6, 0, 6...). Fuel is finite; running out yields 0.
  *   **EAC Prediction:** The optimal plan is the limit $p \to 0$. The driver should intend to stop with infinitesimal probability. The lack of a specific maximum is a mathematical technicality, not a rational failure.
  *   **NAC Prediction:** There is **no solution**. At any Exit 2 (Payoff 6), stopping yields 6. Continuing risks fuel loss for a future 6. If $p$ is tiny, the risk of fuel loss dominates. The exit-self will stop. The start-self wants $p \approx 0$. They cannot reconcile.
  *   **Verdict:** **Substantive.** This case breaks the Ex-Ante optimization framework because the function has no maximum. It forces EAC to accept "epsilon-optimality" while NAC declares the problem unsolvable without external commitment.

  ---

  ## 4. VERBAL VS. SUBSTANTIVE QUARRELS
  *Plain statement on the nature of the disagreement.*

  1.  **Verbal:** The definition of the word "Rational." EAC defines it as *global coherence*; NAC defines it as *local optimality*. Neither is factually wrong; they are optimizing different objects (the timeline vs. the moment).
  2.  **Substantive:** The Ring-Road Variant. Here, the math does not allow a single number $p$ to satisfy both global maximization and local stability. This is not a definition problem; it is an existence problem.
  3.  **Substantive:** The Belief Update Rule ($1/(2-p)$). EAC claims this rule is *required* for rationality. NAC claims it is merely *consistent* with a specific equilibrium but not mandated by logic alone.

  ---

  ## TECHNICAL ADDENDUM (FOR THE READING GROUP)
  *Prepared in response to specific queries regarding algebraic generality and the Ring-Road variant.*

  ### 1. On the Generality of the Algebra ($p = 2/5$)
  **Question:** Is the coincidence of the ex-ante optimum and the node-level indifference general, or an artifact of the numbers?

  **Answer:** It is **not a universal law**, but it is a robust feature of *self-confirming equilibria* in this class of problem.

  *   **Why it worked for you:** You derived your belief ($P(\text{Exit 1}) = 1/(2-p)$) directly from the plan $p$. This is known as the "Halfer" rule or "Strategy-Conditional Belief." When you enforce the condition that *Beliefs must match Strategy*, you mathematically force the ex-ante optimum to align with the node-level indifference.
  *   **Generality:** This holds for $N$ exits *if* you maintain the same belief-updating rule (conditioning on the fact that you are at *an* exit, weighted by the probability of reaching that exit under plan $p$).
  *   **Caveat:** If you change the payoff structure significantly (e.g., introduce negative payoffs for stopping), or if you change the belief rule (e.g., assume $P(\text{Exit 1}) = 0.5$ regardless of $p$), the alignment breaks. The $p=2/5$ solution is the unique point where the plan confirms the beliefs that justify the plan. It is a fixed point, not a universal constant.

  ### 2. On the Ring-Road Variant
  **Question:** Ex-Ante value is strictly decreasing ($p \to 0$), but node-level stopping looks better. What does each camp say?

  **Answer:** This variant exposes the limit of the Ex-Ante framework.

  *   **The Math:** As you calculated, $V_{start}(p) = 6(1-p)/(2-p)$. The derivative is always negative. The "best" plan is $p=0$. But $p=0$ means you never stop, run out of fuel, and score 0. Any $p > 0$ gives a positive score, but less than the limit. There is **no maximum**.
  *   **Ex-Ante Camp Response:** They must argue for **$\epsilon$-optimality**. They will say the rational plan is "Choose $p$ as small as possible." In practice, this means "Stop with probability 1/N where N is very large." They accept there is no single best number, but the *direction* is clear.
  *   **Node-Level Camp Response:** They will argue this proves **Dynamic Inconsistency is fatal**. At the start, you want $p \approx 0$. At Exit 2 (Payoff 6), if you believe $p \approx 0$, you know you are likely to loop forever and lose fuel. Therefore, at Exit 2, Stopping (6) strictly dominates Continuing (Risk of 0). The Node self *will* defect. The Ex-Ante plan is impossible to execute without a binding pre-commitment device.
  *   **Conclusion:** The Ring Road shows that Ex-Ante optimization can demand strategies that are **unimplementable** by a rational agent at the node. The Node Camp wins this round on implementation grounds; the Ex-Ante Camp wins on directional guidance (keep $p$ low).

  ---
  *End of Document*
