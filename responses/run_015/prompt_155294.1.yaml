answer: |-
  There is no single, universally standardized term for this exact configuration, but the pattern you describe is a recognizable cluster in social ontology, political philosophy, and environmental ethics. The most precise identification is **Institutional Normative Realism** (often critically labeled as **Reification**).

  Historically, the most robust positive formulation of this view is **Hegel's concept of *Objective Spirit* (*Sittlichkeit*)**. In contemporary terms, it aligns with **Strong Emergent Normativity** within Systems Theory (e.g., Luhmann or Teubner), or **Ecocentric Intrinsic Value** in environmental philosophy.

  Below is the precise mapping of this concept, its distinctions from near-neighbors, and an analysis of its boundary conditions.

  ### 1. Primary Identification: Institutional Normative Realism

  The position you describe asserts that normative properties (obligations, reasons, "oughts") can **supervene** on structural or systemic features independently of the mental states (beliefs, desires, intentions) of the agents constituting that system.

  *   **The Positive Label:** **Institutional Normative Realism**. This posits that institutions are not merely aggregates of individual behaviors or agreements but are ontological entities capable of bearing normative weight in their own right.
  *   **The Critical Label:** **Reification** (*Verdinglichung*). In Marxist and Critical Theory traditions (e.g., Lukács), this pattern is identified as a category error where social relations between people are mistakenly perceived as objective relations between things (or structures). The "obligation" is an illusion generated by alienation.
  *   **The Historical Anchor:** **Hegelian *Objective Spirit***. Hegel argued that ethical life is embedded in institutions (family, civil society, the state) that possess a rationality and normative authority transcending individual "Subjective Spirit" (personal conscience). For Hegel, the institution's "ought" is not arbitrary; it is the actualization of freedom, binding even when individuals reject it.

  ### 2. Precise Distinctions from Near-Neighbors

  To isolate this concept, we must distinguish it from three common alternatives that appear similar but fail to meet your specific criteria (specifically the *mind-independence* and *non-instrumentality* clauses).

  | Concept | How it differs from your pattern |
  | :--- | :--- |
  | **Social Roles / Status Functions** (e.g., Searle) | Standard social ontology (Searle, Gilbert) anchors institutional facts in **Collective Intentionality**. A "president" or "regulation" exists only because we collectively *accept* it as such. Your pattern explicitly **denies** this anchor, claiming the obligation persists even if acceptance is withdrawn. |
  | **Role Obligations** (e.g., Hardimon) | Role obligations are typically reducible to the expectations of other agents or the functional requirements of a social practice *for the benefit of participants*. Your pattern claims the obligation belongs to the *structure itself*, not the role-occupants, and is not necessarily for human welfare. |
  | **Abstract Moral Truths** (e.g., Platonism) | Abstract moral truths (e.g., "Torture is wrong") are usually universal and agent-neutral. Your pattern describes a **local** normativity attached to a specific, contingent historical structure (a specific regulatory framework) that claims mind-independent status. This is a "local realism" rather than a "universal realism." |

  ### 3. Boundary Conditions

  You asked specifically about the survival of the reason upon system dissolution and its relationship to instrumentalism.

  **A. Dissolution of the Sustaining System**
  *   **The Realist Claim:** If the normativity is truly mind-independent and inherent to the structure (like a mathematical truth inherent to a geometric shape), it should logically survive the physical dissolution of the system. The "obligation to preserve the equilibrium" would remain a true proposition, even if no agents exist to fulfill it.
  *   **The Functionalist Collapse:** Most philosophers argue this is incoherent. If the system dissolves, the *functional kind* ceases to exist. A "regulatory framework" without regulators or subjects is not a framework; it is rubble. Therefore, the normativity likely **collapses**. It cannot survive the destruction of the ontological ground (the system) upon which it supervenes.
  *   **Verdict:** The reason likely **does not survive** complete dissolution. It is ontologically dependent on the *existence* of the structure, even if it is independent of the *minds* within it.

  **B. Collapse into Instrumentalism**
  *   **The Challenge:** If the obligation does not serve human welfare and no minds endorse it, what *is* the good being served?
  *   **The Ecocentric Escape:** In environmental contexts, this is resolved via **Ecocentrism**. The "good" is the integrity of the biosystem itself, which is valued non-anthropocentrically.
  *   **The Systemic Escape:** In governance contexts, this is resolved via **Autopoiesis**. The "good" is the system's own self-maintenance.
  *   **Verdict:** It does **not necessarily collapse** into human instrumentalism, *provided* one accepts a non-anthropocentric axiology (that systems or ecosystems can be ends in themselves). If one rejects non-anthropocentric value, the claim collapses into incoherence or hidden instrumentalism.

  ### 4. Confidence and Uncertainty

  **Confidence Level: High**
  I am highly confident that **Institutional Normative Realism** (critiqued as **Reification**) and **Hegelian *Objective Spirit*** are the correct philosophical categories for this pattern. The description matches the logical structure of these positions precisely, particularly the rejection of methodological individualism and collective intentionality as the source of the norm.

  **Least Certain Claim: The Ontological Status of "Local" Mind-Independent Norms**
  The specific claim about which I am least certain is the **coherence of local, mind-independent normativity attached to contingent artifacts**.
  *   *Why:* Standard Moral Realism posits mind-independent truths (e.g., math, logic, basic ethics). However, these are usually necessary truths or universal. Your pattern describes a *contingent* human artifact (a specific regulatory regime) generating *necessary/mind-independent* obligations.
  *   *The Uncertainty:* It is philosophically contentious whether a contingent, human-made structure can generate norms that are ontologically independent of human minds. This risks a "category mistake" (treating a convention as a law of nature). While Hegel and Ecocentrists argue it is possible, analytic social ontology largely rejects it. Therefore, the boundary condition regarding whether this reason *can* truly exist without *any* mental anchor (even a hypothetical observer) is the weakest metaphysical link in the chain.

  ### Summary
  The concept is **Institutional Normative Realism** (or **Objective Spirit**). It differs from standard social ontology by rejecting **Collective Intentionality** as the source of validity. It differs from moral realism by being **structure-specific** rather than universal. It survives the rejection of participants but likely **collapses upon the physical dissolution of the system**, and it avoids instrumentalism only if one accepts **non-anthropocentric intrinsic value** for systems.
