  ## 4. Misconceptions and Defusing Sentences
  *Insert these exactly at the moments specified.*

  | Misconception | Moment to Defuse | The Defusing Sentence |
  | :--- | :--- | :--- |
  | **"The majority is just irrational/stupid."** | Immediately after revealing the Collective Judgment Set. | "The majority isn't a mind that can be irrational; it is a machine that produces inconsistent output from consistent input." |
  | **"Just vote on the Outcome ($C$) and ignore the Premises."** | During Remedies discussion. | "If a court owes reasons, it cannot announce a verdict without validating the premises that legally require it." |
  | **"This only happens because there are three of them."** | During Remedies discussion. | "Add a hundred more voters with this pattern of disagreement, and the majority inconsistency remains exactly the same." |
  | **"The same people voted Yes on $P$ and Yes on $Q$."** | When analyzing the Majority row. | "Look at the names: the 'Yes' majority on Hardship is Alice and Bob; the 'Yes' majority on Character is Alice and Charlie; they are not the same coalition." |
  | **"This is just a rigged math puzzle."** | Before the Check Question. | "This structure hides in every written rule where multiple conditions must be met for a single outcome." |

