  ## 6. Check: The Closing Question
  *Location:* Last 5 minutes. Hand this out or project it. Do not allow discussion.

  **The Scenario:**
  "A three-member Grant Panel applies a written rule: 'Fund the project ($C$) IF AND ONLY IF it is **Eligible** ($P$) AND **Merit-worthy** ($Q$) AND **Fiscally Sound** ($R$).'"
  *(Note: This adds a third premise to test structural understanding, not just memory).*

  **The Votes:**
  *   Member 1: Yes $P$, Yes $Q$, Yes $R$, Yes $C$.
  *   Member 2: Yes $P$, Yes $Q$, No $R$, No $C$.
  *   Member 3: Yes $P$, No $Q$, Yes $R$, No $C$.

  **The Question:**
  "Calculate the Majority judgment on each proposition. Is the collective set consistent or inconsistent? Explain why in one sentence."

  **Correct Answer Key:**
  *   Majority: Yes $P$, Yes $Q$, Yes $R$, No $C$.
  *   Verdict: **Inconsistent.**
  *   Reasoning: The majority accepts all three necessary conditions ($P, Q, R$) but rejects the outcome ($C$) that the rule entailed by their conjunction.
  *   *Distractor:* If they say "Consistent" because "2 voted No on C," they have missed the point. If they say "Inconsistent" because "P, Q, R don't match," they haven't grasped the entailment. They must link the accepted premises to the rejected conclusion via the rule.
