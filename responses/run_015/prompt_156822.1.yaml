  ## 5. Refusals: The "Strong Student" Question
  *Scenario:* A student asks, "Is there a voting rule that avoids this entirely? What about Arrow's Theorem?"

  **Location:** Step 6 (Remedies), if raised.
  **What to Say:**
  "There are rules that avoid *this specific* inconsistency, but they introduce other costs, like giving one person veto power or ignoring the reasons entirely. We are not looking for a mathematical escape hatch today; we are identifying the cost of reasoning together."

  **What to Decline:**
  "I am not going to discuss weighted voting or probability scores. Those change the question from 'What does the rule require?' to 'How strongly do you feel?', which is a different problem."

