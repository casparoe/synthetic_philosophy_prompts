answer: |-
  # Session Plan: The Discursive Dilemma
  **Time:** 50 Minutes
  **Goal:** Students explain how majority voting on connected propositions yields collective inconsistency despite individual consistency.

  ## 1. Sequence and Dependencies
  *Strict adherence to this order is required. Do not collapse steps.*

  1.  **Voting on Options vs. Voting on Propositions (00:00–00:05)**
      *   **Action:** Draw two columns on the board: "Elections" vs. "Courts/Committees."
      *   **Content:** Under Elections, write "Choice between A or B." Under Courts, write "Reasons for A."
      *   **Dependency:** You must establish that this session is about *reasons* (propositions), not *candidates* (options), before introducing logic.
      *   **Speed Bump:** Students will try to discuss *who* is voting. Stop them. Say: "We are not studying the voters; we are studying the votes."

  2.  **The Logical Relation (00:05–00:15)**
      *   **Action:** Introduce the Carrying Example (see below). Write the Rule on the board *before* any votes are cast.
      *   **Board Work:** Write: **Rule:** $C$ is True IF AND ONLY IF ($P$ is True AND $Q$ is True).
      *   **Dependency:** The logical connective (AND) must be visible *before* the vote profile is filled. If you show the votes first, they will treat $P, Q, C$ as three independent options.
      *   **Check:** Ask one student: "If I say Yes to $P$ and Yes to $Q$, what does the rule force me to say about $C$?" (Answer: Yes).

  3.  **The Vote Profile (00:15–00:25)**
      *   **Action:** Fill in the 3x3 matrix of individual judgments.
      *   **Board Work:** Draw the grid. Fill row by row. Verify each row is logically consistent as you write it.
      *   **Dependency:** You must verify individual consistency *before* calculating column majorities.
      *   **Speed Bump:** Students will spot the collective inconsistency early. Cover the "Majority" row with your hand or a piece of paper until every individual row is complete and verified.

  4.  **The Collective Judgment Set (00:25–00:30)**
      *   **Action:** Reveal the Majority row.
      *   **Board Work:** Write the Majority verdict under the line. Circle the contradiction ($P$: Yes, $Q$: Yes, $C$: No).
      *   **Dependency:** The collision is only visible once the Majority row is compared against the Rule written in Step 2.
      *   **Moment:** This is the "Discursive Dilemma." Let the silence sit for 10 seconds.

  5.  **The Contrast (Condorcet vs. Discursive) (00:30–00:35)**
      *   **Action:** Distinguish this from voting cycles.
      *   **Board Work:** Draw a small cycle diagram ($A > B > C > A$) to the side.
      *   **Dependency:** Do this *after* the collision is established.
      *   **Point:** "In a cycle, individuals prefer intransitively. Here, every individual is perfectly rational. The irrationality is in the *aggregation*, not the agents."

  6.  **Misconceptions and Remedies (00:35–00:45)**
      *   **Action:** Address the "how to fix it" and "why it matters" questions using the defusing sentences below.
      *   **Dependency:** Only address remedies after they accept the problem is real.

  7.  **Refusals and Check (00:45–00:50)**
      *   **Action:** Handle the "strong student" question and administer the closing check.

  ---

  ## 2. Carrying Example: The Zoning Variance Committee
  *Use this exact structure. It avoids factual disputes (e.g., "Did he speed?") and focuses on rule application.*

  **The Body:** A 3-member Zoning Board (Alice, Bob, Charlie).
  **The Case:** A request to build a garage closer to the property line than allowed.
  **The Rule (Conjunction):** "A Variance ($C$) shall be granted IF AND ONLY IF the applicant proves **Undue Hardship** ($P$) AND the variance will **Not Alter Neighborhood Character** ($Q$)."
  *   *Logic:* $P \land Q \leftrightarrow C$.

  **The Profile (The Dilemma):**
  | Member | Hardship ($P$) | Character ($Q$) | Variance ($C$) | Consistent? |
  | :--- | :---: | :---: | :---: | :---: |
  | Alice | Yes | Yes | Yes | Yes |
  | Bob | Yes | No | No | Yes |
  | Charlie | No | Yes | No | Yes |
  | **Majority** | **Yes** | **Yes** | **No** | **NO** |

  **The Inversion (The Mirror):**
  *Constraint Note:* You cannot flip this profile (swap Yes/No) and keep individuals consistent while using an AND rule. To show the mirror case (Maj accepts $C$, rejects $P$ and $Q$), you must **tune the rule** to a Disjunction for this specific 5-minute segment.
  *   **Say:** "To see the mirror image, imagine the rule was OR: Grant if Hardship OR Historical Significance."
  *   **Profile:** Alice (Yes, No, Yes); Bob (No, Yes, Yes); Charlie (No, No, No).
  *   **Majority:** No, No, Yes. (Collective inconsistency: $\neg P, \neg Q, C$).
  *   **Why:** This satisfies your request to show premise-first and conclusion-first procedures diverge in *both* directions without teaching invalid logic.

  **What to Avoid:**
  *   Do not use a criminal trial example (invites "beyond reasonable doubt" confusion).
  *   Do not make $P$ and $Q$ sound like the same thing (e.g., "Guilty" and "Responsible").
  *   Do not allow debate on whether Hardship *actually* exists. The votes are the data.

  ---

  ## 3. Contrast: Discursive Dilemma vs. Majority Cycling
  *Location:* Step 5 of the Sequence (after the collision is revealed).
  *Board Work:* Keep the Dilemma Matrix on the left. Draw a Cycle Diagram on the right.

  **The Script:**
  "Some of you have heard of voting cycles, where the majority prefers A to B, B to C, and C to A. Look at our board.
  1.  **In a Cycle:** Individual voters have circular preferences. The group reflects *their* confusion.
  2.  **In This Dilemma:** Look at Alice, Bob, and Charlie. Every single row is logically straight. No one contradicts themselves.
  3.  **The Defect:** The inconsistency appears *only* when we stack the columns. The group is inconsistent even though the members are not."

