answer: |-
  # Session Plan: The Vault Bet
  **Facilitator Role:** Professional Philosopher & Active-Learning Designer
  **Topic:** Constructive vs. Classical Existence (Intuitionistic Logic)
  **Time:** 75 Minutes
  **Students:** 22–26 (Math/CS Sophomores)
  **Materials:** Whiteboards (5–6), Index Cards (3 per team), Poker Chips (500 total), Markers.

  ## Part 1: Mechanic Brainstorming
  *Before finalizing the plan, I considered four mechanics to simulate the uselessness of nonconstructive existence proofs for action.*

  1.  **The Blind Key:** A box has 100 locks. A proof says "One key in this bag opens a lock." Students must pick one lock to open.
      *   *Critique:* Too probabilistic. Students will treat it as a search problem rather than a logical limitation.
  2.  **The Halting Oracle:** Two programs are shown. A proof says "One halts." Students must bet on which.
      *   *Critique:* Too abstract. The Halting Problem is undecidable, which might confuse the issue of *constructibility* with *computability limits*.
  3.  **The Hidden Switch:** A light is on or off. A proof says "The switch is up or down." Students must toggle it to turn the light on.
      *   *Critique:* Too binary/simple. Doesn't capture the "existence" aspect well.
  4.  **The Vault Bet (Selected):** Two vaults. A theorem guarantees one contains a prize based on a property of a number (e.g., rationality). The theorem uses a case-split (LEM) that doesn't identify the number's property.
      *   *Why:* It mirrors the $\sqrt{2}^{\sqrt{2}}$ proof they know. It separates *knowing that* (the disjunction is true) from *knowing which* (the witness). It allows for a "Witness Card" mechanic to enforce the requirement for construction.

  ---

  ## Part 2: The Vault Bet – Session Plan

  ### 1. Preparation (Before Class)
  *   **Teams:** Arrange tables for 5 teams of 4–5 students.
  *   **Endowments:** Give each team 20 chips (starting capital).
  *   **The Vaults:** Draw two large boxes on the main whiteboard labeled **Vault $\mathbb{Q}$** (Rational) and **Vault $\mathbb{I}$** (Irrational).
  *   **Cards:** Prepare three stacks of index cards:
      *   *Bet Slips:* (Blank for team to write choice).
      *   *Witness Cards:* (Requires a specific format: "We assert Vault X wins because [Calculation/Algorithm].")
      *   *Info Sheets:* (Round 1: Classical Proof; Round 2: Constructive Data).
  *   **Secret:** You (the Instructor) hold the "Bank Key." You know the status of the numbers used in the rounds.

  ### 2. Team Roles (Assign within teams, 2 mins)
  *   **Scribe:** Writes the Bet Slip and Witness Card.
  *   **Auditor:** Checks if the Witness Card meets the rules.
  *   **Trader:** Delivers chips and cards to the Bank (you).
  *   **Strategist:** Leads the discussion on which vault to pick.

  ### 3. Game Rules (Project on Board, 5 mins)
  1.  **Objective:** Maximize chip count.
  2.  **The Bet:** To play a round, a team must stake **5 chips** and submit a **Bet Slip** (choosing $\mathbb{Q}$ or $\mathbb{I}$).
  3.  **The Payout:**
      *   **Wrong Vault:** Lose stake (0 return).
      *   **Right Vault + No Witness Card:** Stake returned (5 chips). *Break-even only.*
      *   **Right Vault + Valid Witness Card:** Stake + Profit (15 chips total).
  4.  **Valid Witness:** A calculation, algorithm, or explicit derivation that *determines* the number's property. A reference to "Theorem 1" or "Logic" is **not** a witness.

  ---

  ### 4. Round 1: The Classical Trap (25 mins)
  **The Setup:**
  *   Distribute **Info Sheet A**.
  *   **Number:** $x = \sqrt{2}^{\sqrt{2}}$.
  *   **Theorem Provided:** "Either $x$ is rational, or $x$ is irrational. If $x$ is rational, Vault $\mathbb{Q}$ wins. If $x$ is irrational, Vault $\mathbb{I}$ wins. Therefore, a winning vault exists." (This is the classic nonconstructive proof).
  *   **Task:** Teams have 10 minutes to discuss and place their bet.

  **The Tension:**
  *   Students know the proof guarantees a winner.
  *   They *cannot* compute $x$'s rationality in 10 minutes (it requires Gelfond-Schneider theorem, which is non-trivial).
  *   They must choose a vault to play, but they cannot generate a **Valid Witness Card**.

  **The Resolution:**
  *   Collect Bet Slips and Witness Cards.
  *   **Reveal:** Announce that $x$ is indeed Irrational (Vault $\mathbb{I}$ wins).
  *   **Payoff:**
      *   Teams that picked $\mathbb{I}$ get their 5 chips back (Break-even).
      *   Teams that picked $\mathbb{Q}$ lose their 5 chips.
      *   **Crucial:** *No team* gets the profit (15 chips) because *no team* could produce a Witness Card (calculation) in the time limit. The classical proof does not count as a witness.
  *   **Facilitator Note:** Do not explain *why* yet. Just enforce the payout rules strictly. "The Bank does not accept 'Proof by Cases' as a Witness."

  ### 5. Round 2: The Constructive Payoff (20 mins)
  **The Setup:**
  *   Distribute **Info Sheet B**.
  *   **Number:** $y = (\sqrt{4})^{\sqrt{4}}$.
  *   **Theorem Provided:** None. Just the number.
  *   **Task:** Teams have 10 minutes to compute and bet.

  **The Action:**
  *   Students compute: $\sqrt{4} = 2$. $y = 2^2 = 4$.
  *   4 is Rational.
  *   They choose Vault $\mathbb{Q}$.
  *   They write a Witness Card: "$\sqrt{4}=2, 2^2=4, 4 \in \mathbb{Q}$."

  **The Resolution:**
  *   Collect Slips and Cards.
  *   **Reveal:** Vault $\mathbb{Q}$ wins.
  *   **Payoff:**
      *   Teams with the correct calculation receive 15 chips (Profit!).
      *   Highlight the difference: "In Round 1, you knew a winner existed but couldn't profit. In Round 2, you constructed the winner and profited."

  ### 6. Debrief & Theory Mapping (25 mins)
  *Hold all technical terminology until this section.*

  **Step 1: The Felt Experience (5 mins)**
  *   Ask: "In Round 1, you had a valid proof. Why did it feel useless?"
  *   Expected answers: "Didn't tell us which one," "Couldn't act on it," "True but empty."
  *   Write these on the board.

  **Step 2: Introducing the Labels (10 mins)**
  *   **Truth as Constructibility:** Map "Valid Witness Card" to the **BHK Interpretation** (Brouwer-Heyting-Kolmogorov). To claim $P \lor Q$ is true, you must hold a proof of $P$ *or* a proof of $Q$.
  *   **The Witness Requirement:** Map "Right Vault + No Witness = Break-even" to **Existence Claims**. To claim $\exists x, P(x)$, you must be able to produce the $x$.
  *   **The Case Split:** Map Info Sheet A to the **Law of Excluded Middle (LEM)**. Classical logic allows $P \lor \neg P$ without knowing which. Intuitionistic logic rejects this for infinite/unknown domains because it doesn't provide a method to choose.

  **Step 3: Why This Matters for CS/Math (10 mins)**
  *   **CS Connection:** A classical proof is like a function declaration `bool exists();`. A constructive proof is `int get_witness();`. You can't compile code with just the declaration.
  *   **Math Connection:** In classical analysis, we often prove solutions exist without finding them. In numerical analysis (constructive), we need the algorithm.
  *   **Takeaway:** Classical logic is good for *consistency* (Round 1 didn't crash the system). Constructive logic is good for *extraction* (Round 2 generated value).

  ---

  ## Part 3: Implementation Risks & Mitigation

  | Risk | Description | Mitigation Move |
  | :--- | :--- | :--- |
  | **"It's just hidden info"** | Students argue Round 1 was just a guessing game because *you* hid the answer, not because of logic. | **Clarify:** "The number $x$ has a fixed truth value. The *proof method* provided (Case Split) is what lacked the data, not me. If I gave you a constructive proof of $x$'s irrationality, you would have won." |
  | **Hedging** | Teams try to submit two Bet Slips or write "Either/Or" on the card. | **Rule Enforcement:** "The Vault mechanism only accepts one key. You must commit to a disjunct. This mirrors the requirement to choose a path in code." |
  | **Back-door LEM** | In debrief, students say "But it *was* irrational, so we were right!" | **Reframe:** "You were *factually* right, but *logically* unjustified. In this system, justification is the currency. Truth without justification is bankruptcy." |
  | **Math Anxiety** | Students get stuck on calculating $\sqrt{2}^{\sqrt{2}}$. | **Time Box:** Strictly enforce the 10-minute limit. If they haven't solved it, they experience the 'constructive gap' directly. |

  ---

  ## Part 4: Limitation Note (For the TA)

  **Candid Limitation:**
  This activity necessarily distorts the **ontological** commitment of intuitionistic logic into an **epistemic** game.
  *   **The Distortion:** In the game, the number $x$ *actually is* irrational (ontologically), and the students just *don't know it* (epistemically). A strict intuitionist would argue that until a construction exists, the statement "$x$ is irrational" is not yet true or false.
  *   **What You Must Supply:** In the debrief, you must clarify that intuitionism isn't just about "human ignorance." It's about redefining truth itself. The game simulates the *consequences* of that redefinition (you can't act without a witness), but it uses a classical reality (the number has a fixed state) to make the game runnable.
  *   **Correction:** Explicitly state: "We played as if the truth was hidden. Intuitionists argue the truth is *made* by the proof. The game shows why that distinction matters for action, even if we simplified the metaphysics."

