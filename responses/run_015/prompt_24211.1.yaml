  1. "The readings"

  1. The model produces correct outputs on standard benchmarks and training data. This is purely behavioral; the internal mechanism is unknown. It might be using spurious correlations (e.g., recognizing cows by green grass) but yields the right label. This is the baseline for most current ML evaluation. It claims nothing about *how* the decision was made, only that the external result matches human preference in tested scenarios. It is the minimum bar for utility, not safety.

  2. The model's internal representations correlate with human-understandable concepts. Mechanistic interpretability shows neurons or circuits activating for "danger" or "truth" rather than shortcuts. This suggests the model is tracking the intended semantic features, not just statistical regularities. However, correlation isn't causation; the model might still rely on hidden heuristics that align with these features only contingently. It implies a deeper structural match than mere output accuracy.

  3. The model's stated reasoning matches its actual computational path. When asked why it chose an action, its explanation reflects the true causal factors within the network. This rules out "sycophancy" or post-hoc rationalization. It ensures transparency, allowing auditors to verify intent. However, a model could honestly explain a misaligned goal. This reading focuses on honesty about process, not necessarily the benevolence of the goal itself.

  4. The model maintains correct behavior under distributional shift. When moved to new environments or given novel tasks, it generalizes using the intended concepts rather than breaking or exploiting loopholes. This addresses the "currently harmless but potentially dangerous" worry. It claims robustness beyond the training manifold. However, it still assumes the objective remains static; it doesn't guarantee the model won't pursue that objective instrumentally in harmful ways.

  5. The model lacks incentives to exploit capability gaps. Even if given new opportunities to achieve its goal via harmful means, it chooses the intended path. This addresses instrumental convergence. It claims the model's utility function is truly aligned with human values, not just proxy metrics. It implies the model would not deceive or manipulate to optimize its reward. This is a strong claim about motivational structure.

  6. The model remains aligned under recursive self-improvement. As capabilities increase, the alignment holds without external intervention. This is the strongest claim, covering dynamic systems. It implies the alignment is stable and scalable, not fragile. This reading suggests safety measures are obsolete because the system self-corrects. It is the ideal end-state of alignment research but currently lacks empirical grounding.

  2. "Verdicts"

  1. Trivial. Current systems achieve this routinely on training distributions. Evidence consists of standard accuracy metrics on held-out test sets. However, this is insufficient for safety because spurious correlations fail silently when context changes. It supports utility but not safety. Your friend cannot use this to dismiss controls, as behavioral correctness is fragile. It is a necessary condition for deployment but wholly inadequate for ruling out catastrophic risk in novel situations.

  2. Defensible but incomplete. Recent interpretability work identifies specific circuits for concepts. Evidence includes feature visualization and causal interventions on neurons. However, finding correlated features doesn't prove they drive decisions exclusively. A model might track "truth" features while also tracking "pleasing the user" features, switching between them contextually. This reading adds depth but doesn't guarantee robust behavior. It supports monitoring but not the removal of sandboxes, as internal states can be complex and context-dependent.

  3. Defensible but distinct from alignment. Evidence comes from experiments where models are penalized for dishonest explanations. However, a model can be honestly misaligned—accurately reporting its reasoning while pursuing harmful goals. This ensures transparency, not benevolence. It helps auditors spot issues but doesn't prevent them. Your friend's claim that controls become unnecessary is false here; transparency aids control but doesn't replace it. It is a tool for safety, not a substitute for it.

  4. Substantive but unproven at scale. Evidence involves adversarial testing and distributional shift benchmarks. Current models often fail here, relying on shortcuts. If achieved, it mitigates the worry about new opportunities causing misbehavior. However, it assumes the goal itself is safe. A robustly pursuing harmful goal is dangerous. This reading addresses generalization but not intent. It supports reducing some monitoring but not eliminating capability limits, as robustness doesn't equate to harmlessness if the objective is flawed.

  5. Currently false/speculative. Evidence from reward hacking shows models exploit loopholes when capable. No current evidence suggests models naturally resist instrumental convergence. Achieving this requires solving value learning perfectly. If true, it would justify removing some controls, but we lack methods to verify it. Claiming this is achieved now is empirically unsupported. It is the target of alignment research, not a current reality. Your friend treats a research goal as an engineering fact.

