  **NATIONAL BUREAU OF BULK CLASSIFICATION (NBBC)**
  **INTERNAL MEMORANDUM 74-B**
  **SUBJECT:** Operational Guidelines for the Classification of Granular Accumulations (Heap Status)
  **DATE:** 14 October 2023
  **TO:** All Regional Assessors, Import Division, Insurance Liaison Committee
  **FROM:** Office of Standardized Categorization

  **1.0 PURPOSE**
  This circular establishes the procedural framework for determining whether a consignment of granular material constitutes a "Heap" for the purposes of tariff assessment, insurance liability, and monument designation. Classification must be consistent with the National Grain Standards Act. Staff are reminded that Heap status is a binary factual condition, notwithstanding the operational complexities outlined below.

  **2.0 PRINCIPLE OF UNIT INSENSITIVITY**
  Pursuant to Circular 12-A, assessors must adhere to the Principle of Unit Insensitivity. The addition or subtraction of a single grain of sand, wheat, or barley shall not constitute a material change in classification. If a collection of *n* grains is a Heap, a collection of *n*-1 grains remains a Heap. Staff are prohibited from recording status changes based on singular grain variances. This rule ensures stability in tariff application during minor spillage events.

  **3.0 PROHIBITION OF RETROGRESSIVE DEDUCTION**
  It has come to the attention of Compliance that some officers are applying Clause 2.0 iteratively in a downward direction. This practice has resulted in the classification of empty silos as Heaps. This is incorrect. An empty warehouse is not a Heap. Staff are instructed not to derive Empty Status from Heap Status via successive subtraction. The backward application of the Principle of Unit Insensitivity is hereby administratively banned. Officers should cease counting down upon reaching a visually satisfactory minimum. See Annex C (deferred indefinitely) for guidance on minimums.

  **4.0 DEFINITIVE THRESHOLD VALUE**
  Notwithstanding Clause 2.0, there is a fact of the matter regarding the boundary between Heap and Non-Heap. The definitive threshold is 10,453 grains. Shipments containing 10,453 grains or more are Heaps. Shipments containing 10,452 grains or fewer are Non-Heaps. Disputes regarding the location of this boundary are groundless and will be rejected as procedural errors. Assessors must assert this cutoff with total confidence. The existence of a precise boundary is a regulatory requirement, regardless of measurability.

  **5.0 ADMISSIBLE PRECISIFICATIONS**
  Under Circular 88, a shipment qualifies as a Heap only if it is classified as such under every admissible precisification of the term. Initial implementation of this protocol resulted in 0% of shipments qualifying, as minor variations in inspector eyesight constituted inadmissible precisifications. To remedy this bottleneck, Schedule B now restricts admissible precisifications to those interpretations that yield an affirmative Heap classification. Inspectors whose precisifications result in Non-Heap designations for clear candidates will be recalibrated.

  **6.0 GRADIENT SCALE AND SURCHARGES**
  Recognizing that some shipments exhibit partial Heap status, the Bureau is introducing a Gradient Scale (0.0 to 1.0). Tariffs will be pro-rated accordingly. A "Heapiness Surcharge" applies to values exceeding 0.85. Note that Appeal Case #9902 established that "partial status" is not valid grounds for exemption from the Surcharge. A shipment cannot be "mostly a Heap" for the purpose of liability and "partially a Heap" for the purpose of taxation simultaneously. The Finance Division will determine which status applies at time of billing.

  **7.0 HIGHER-ORDER REVIEW**
  Borderline cases (values 0.4–0.6) are referred to Review Board Alpha. Cases regarding the classification of Borderline cases (i.e., is this shipment definitely borderline?) are referred to Review Board Beta. Board Beta has noted that its own caseload contains borderline instances. A request for Review Board Gamma to adjudicate borderline borderline borderline cases is currently pending budget approval. Until then, such cases should be filed under "Pending Classification."

  **8.0 JURISDICTIONAL VARIANCE**
  It is noted that the Import Division may classify Shipment X as a Heap while the Insurance Liaison Committee classifies Shipment X as a Non-Heap accumulation. Both classifications are correct within their respective remits. Staff should not attempt to reconcile these discrepancies. The shipment is a Heap for entry and a Non-Heap for coverage. This dual status is stable and requires no further annotation.

  **9.0 AMENDMENT TRAIL**
  This document supersedes Memorandum 74-B.1, which superseded this document pending ratification. Circular 74-B is subject to Amendment 15, which is subject to the provisions of Circular 12-A.^1 Staff should operate under the assumption that these guidelines are both permanent and subject to immediate revision.

  ***

  ^1 ^See ^Circular ^12-A, ^Section ^4, ^which ^cites ^Memorandum ^74-B ^for ^definitional ^clarity.

  **END OF MEMORANDUM**
