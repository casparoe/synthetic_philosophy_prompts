answer: |-
  Here are eight candidate concepts that might cover parts of your description: Pluralistic Ignorance, Social Convention, Path Dependence, Status Quo Bias, Institutional Inertia, Performative Compliance, Common Knowledge Trap, and Normative Illusion.

  Testing them against your features reveals gaps. **Pluralistic Ignorance** fails on feature (d): in your cases, the dislike is public, not private. People know others want to stop. **Social Convention** handles the mutual expectation (b), but fails on (a). Conventions like driving on the left solve a coordination problem; if everyone stops, chaos ensues. In your cases, if everyone stops, nothing breaks. **Path Dependence** and **Status Quo Bias** explain persistence but fail on (d). They rely on switching costs or individual psychology; they cannot explain why a group openly agrees to change yet remains stuck. **Institutional Inertia** suggests structural barriers, but your barriers are purely social. **Performative Compliance** fits the phantom authority (c), but doesn't explain why the performance continues when the audience admits they don't care. **Common Knowledge Trap** captures the open grievance (d) but misses the attribution to non-existent rules (c). **Normative Illusion** captures the phantom rule but usually implies deception, whereas your teams are transparently confused.

  **Verdict:** No established concept covers the whole configuration. You are describing a practice that has lost its function and its enforcement mechanism, yet retains its grip through mutual expectation alone. It is not a convention, because there is nothing left to coordinate. It is not ignorance, because the knowledge is shared.

  I propose we call this a **Zombie Norm**.

  **Definition:** A Zombie Norm is a collective practice sustained solely by the mutual expectation of compliance, despite common knowledge that its original purpose is extinct and no coordination benefit remains.

  **Necessary Conditions:**
  1.  **Functional Death:** The original reason for the practice is gone (feature a).
  2.  **Phantom Authority:** Compliance is attributed to a rule or person that does not exist or care (feature c).
  3.  **Expectational Lock:** Individuals comply only because they expect others to expect compliance, even though all prefer to stop (feature b & d).

  **Boundary Cases:**
  *   **Nearest Established Concept (Excluded):** Traffic laws. This looks like a Zombie Norm if everyone hates the law, but it is not one because if everyone ignored it, accidents would happen. The coordination payoff exists.
  *   **Too Strong Exclusion:** A rule enforced by a present, indifferent manager. If the manager says "I don't care," the norm collapses immediately. A Zombie Norm requires the authority to be absent or phantom, not merely indifferent.
  *   **Non-Obvious Inclusion:** An office holiday nobody enjoys. If everyone stays home because they think the office will be closed, but the office would actually stay open if anyone showed up, this is a Zombie Norm. It is harmless but pointless.

  **Collapse Conditions:**
  You asked if saying it out loud in a meeting is enough. Based on the structure of Zombie Norms, the answer is no. Speaking establishes common knowledge of *desire* (we all want to stop), but not common knowledge of *action* (we all will stop).

  The persistence relies on a second-order expectation: "I won't stop because I think you won't stop." To collapse a Zombie Norm, you need a **coordinated deviation**. This requires a focal point for simultaneous action. A meeting vote helps, but only if it creates a specific trigger: "Nobody merges their own PR starting next Monday." Without a specific joint commitment to deviate at a specific time, individuals will revert to the safe expectation that others will comply. The smallest change is not expressing dissatisfaction, but publicly synchronizing the violation. You must transform the shared desire into a shared plan.
