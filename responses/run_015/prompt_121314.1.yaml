  3.  **Brainstorming Dimensions of Variation (Mental Draft):**
      *   *The "User":* Who is being fooled? The whole organism? A sub-personal module? A social construct? If the brain is the user, who is the designer? Evolution?
      *   *The "Illusion":* Is it a hallucination (nothing there)? A misrepresentation (something there but not as it seems)? A useful fiction (interface theory)? A cognitive limitation (cognitive closure)?
      *   *The Target:* Is *phenomenal consciousness* (qualia) the illusion? Is the *narrative self* the illusion? Is the *unity* of consciousness the illusion?
      *   *Epistemic Implication:* Does illusion mean incorrigibility is lost? Does it mean the self is a fiction?

  4.  **Developing the Numbered Menu (Trivial to Radical):**
      *   *Level 1 (Trivial/Platitude):* Consciousness doesn't show us the brain's wiring. (Interface theory).
      *   *Level 2 (Moderate):* The *unity* of consciousness is a construct. (Bundle theory/Dennettian).
      *   *Level 3 (Strong):* Phenomenal properties (qualia) are misrepresentations of physical states. (Illusionism proper).
