      2.  *The Narrative Self Thesis:* The "I" is a story, not a thing. (Defensible, attacks substantial self).
      3.  *The Phenomenal Misrepresentation Thesis:* Qualia seem intrinsic but are relational/functional. (Substantive, attacks first-person authority).
      4.  *The Error Theory:* Judgments about consciousness are systematically false. (Radical, kills authority).
      5.  *The Eliminativist Thesis:* Consciousness is a folk-psychological posit with no referent. (Controversial, potentially incoherent).

  5.  **Drafting the Content (Iterative refinement):**

