  **INTERAGENCY COUNCIL FOR UNCERTAINTY QUANTIFICATION**
  **48 CFR Part 700**
  **Docket No. ICUQ-2024-0042**

  **Notice of Proposed Rulemaking: Mandatory Quantification of Epistemic Ignorance**

  **AGENCY:** Interagency Council for Uncertainty Quantification (ICUQ).

  **ACTION:** Notice of proposed rulemaking (NPRM).

  **SUMMARY:** The ICUQ proposes to require federal agencies to assign probability distributions to all unknown quantities using the Principle of Indifference. Currently, agencies decline to quantify uncertainty when empirical data is absent. This rule establishes that "no information" constitutes a determinate input requiring a uniform distribution over the specified parameter space.

  **DATES:** Comments must be received by December 31, 2024.

  **FOR FURTHER INFORMATION CONTACT:** Dr. Aris Thorne, Director of Epistemic Compliance, ICUQ.

  **SUPPLEMENTARY INFORMATION:**

  **I. Background**
  Agencies frequently encounter variables lacking empirical priors. To prevent decision paralysis, the ICUQ mandates that ignorance be standardized. While stakeholders note that different parametrizations yield different probabilities, the Council determines that administrative consistency outweighs mathematical indeterminacy.

  **II. Definitions**
  *Ignorance* means the absence of empirical evidence favoring any specific value within a bounded domain.
  *Parameter* means any scalar quantity subject to uncertainty.
  *Registry* means the Approved Parametrization Registry maintained by the ICUQ.

  **III. Regulatory Text**

  **§ 700.1 Mandatory Assignment.**
  Agencies shall assign a uniform probability distribution to any Parameter characterized by Ignorance. Agencies shall not decline quantification on grounds of arbitrariness.

  **§ 700.2 Approved Parametrization.**
  Agencies shall select a variable representation from the Registry. Selections outside the Registry require pre-approval. To prevent bias, agencies must register their chosen Parametrization before observing data.

  **§ 700.3 Second-Order Indifference.**
  Absent information regarding which Registry entry applies, agencies shall be indifferent among available Parametrizations. The resulting mixture distribution shall be calculated as the arithmetic mean of the distributions yielded by each registered method.

  **IV. Worked Example: Chord Length Estimation**
  Consider a circle of radius *r*. An agency must estimate the probability that a random chord exceeds the side of an inscribed equilateral triangle (*r*√3). Under § 700.2, three Registry entries are admissible:
  1.  *Random Endpoints:* Fix one vertex; the second must fall on a 1/3 arc. Probability = 1/3.
  2.  *Random Radius:* Chord perpendicular to a radius; midpoint must fall within the inner half. Probability = 1/2.
  3.  *Random Midpoint:* Midpoint uniform in the disk; area ratio of inner disk (radius *r*/2) to outer. Probability = 1/4.

  These differ because each method imposes a different measure over the space of chords. Method 1 weights endpoints uniformly; Method 3 weights area uniformly. Method 2 densities chords near the center. Per § 700.3, the agency shall average these (1/3 + 1/2 + 1/4)/3 = 13/36. However, agencies are notified that adding a fourth parametrization to the Registry will alter this result. The Registry is not exhaustive.

  **V. Compliance Costs**
  The Council anticipates a market for variable-selection consultants. As noted by Ms. Elaine Vare, a Senior Parametrization Analyst: "Clients often seek the Registry entry that yields a risk profile matching their budget constraints. We ensure their variable selection is defensible under § 700.2." The Council asserts this ensures robustness.

  **VI. Request for Comments**
  The ICUQ invites comments on the following housekeeping matters:
  1.  Should the Registry prioritize parametrizations invariant under linear transformation or affine scaling?
  2.  Does the Second-Order Indifference Clause require a hyper-prior over the Registry indexing scheme?
  3.  Should Maximum Entropy principles supersede uniformity when the domain is unbounded?
  4.  How should agencies handle countable additivity violations arising from mixed parametrizations?
  5.  Is the grouping of Registry entries (e.g., by geometric vs. algebraic form) subject to indifference requirements?
  6.  Does the requirement to register variables before data observation preclude learning which measure is physically appropriate?

  **Dr. Aris Thorne**
  Director of Epistemic Compliance
  Interagency Council for Uncertainty Quantification

  ***

  **Author's Note**

  (i) The mathematics here is settled: Bertrand's paradox shows that "random chord" is ill-defined without specifying a selection mechanism. The three classical methods impose different measures on the space of chords, yielding 1/3, 1/2, and 1/4. (ii) Contested issues remain: Jaynesians argue maximum entropy or transformation group invariance uniquely selects the 1/2 solution (random radius), but critics argue this presupposes a specific symmetry group. Whether the Principle of Indifference has any legitimate domain beyond finite symmetries is live debate. (iii) The satire presses the "no solution" reading harder than some formal epistemologists would accept, potentially underrepresenting the invariance program's claim to resolve the ambiguity via physical symmetry rather than bureaucratic registry.
