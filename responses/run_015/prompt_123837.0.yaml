answer: |-
  1. "Room read"
  The experimentalists are your biggest risk. They hear liability and hear unidentifiable causal claims; they'll worry you can't distinguish treaty effects from domestic policy noise. The agency and finance folks will bristle at the legal framing; liability implies litigation and open-ended budgets, which threatens their operational models and fiscal planning. The historian types might feel you're technocratizing colonial harm into current tax codes. The philosopher won't fight the morality but will argue you're ignoring utility maximization for the poorest. Basically, the economists want identification, the practitioners want feasibility, and the philosopher wants consistency. Everyone else is listening to see if you break the ODA consensus without breaking the budget.

  2. "The objections, worst first"

  **1. The Identification Trap (Economist):** "You claim institutional exposure causes harm, but how do you isolate the treaty effect from domestic corruption? Without clean identification, this ledger is just storytelling."
  **Reply:** I'm not claiming precise causal attribution for every dollar, but rather establishing a structural presumption. Where coercive institutions exist, the burden of proof shifts to the imposer to show harm isn't occurring. We use comparative institutional analysis across similar jurisdictions to estimate the gap.
  **Soft Spot:** You lack a clean counterfactual. If pressed on specific magnitude, you have to admit wide confidence intervals.

  **2. The State Capacity Kill (Agency):** "Unconditional cash to households bypasses the state. Doesn't this erode the social contract and weaken the very institutions you want to reform?"
  **Reply:** The duty is owed to the people harmed, not the governments that signed the treaties. Strengthening a state that is complicit in harmful extraction isn't a priority over compensating victims.
  **Soft Spot:** Long-term development requires state capacity. You have no answer for how to rebuild governance if you permanently bypass the treasury.

  **3. The Moral Priority Trap (Philosopher):** "If a child is starving in an LDC with low institutional exposure, why do you owe more to a worker in a middle-income country with high exposure?"
  **Reply:** Because justice trumps beneficence. We have a duty not to harm that is stricter than a duty to rescue. The ledger tracks violation of rights, not severity of need.
  **Soft Spot:** This is politically and morally unintuitive. You risk sounding like you don't care about absolute poverty.

  **4. The Elite Complicity Objection (Political Economy):** "Many of these tax treaties were demanded by recipient elites to attract capital. Why is the rich country solely liable?"
  **Reply:** Elite consent does not equal popular consent. The duty is to the citizens whose labor and resources are exposed, not the signatories.
  **Soft Spot:** It complicates the "coercion" narrative. If elites begged for the treaty, the coercion story weakens.

  **5. The Measurement Arbitrariness (General):** "You're replacing ODA, which is arbitrary, with a harm ledger that is also model-dependent. Why is your number better?"
  **Reply:** ODA counts donor costs and tied procurement. The ledger tracks actual economic flows and institutional constraints. One measures donor generosity, the other measures structural impact.
  **Soft Spot:** Your model parameters are still choices. Critics can claim you tweaked weights to fit the thesis.

  **6. The Legal Precedent Risk (Finance Ministry):** "Calling this compensation opens donors to litigation. No treasury will sign off on admitting legal liability."
  **Reply:** Frame it as a sovereign settlement mechanism, not a court-admissible admission. It's a political accounting tool to determine transfer volumes, not a legal brief.
  **Soft Spot:** The word liability is in your title. You might have to soften the terminology for policy uptake.

  **7. The Moral Hazard (Economist):** "If countries get paid for harmful institutions, won't they maintain them to keep the transfers flowing?"
  **Reply:** The ledger shrinks as harmful institutions are reformed. The payment is for past and current exposure, incentivizing removal to stop the bleeding.
  **Soft Spot:** Transition costs are real. Removing a trade barrier might hurt workers short-term. You need a transition fund.

  **8. The Budget Rigidity (Agency):** "Liabilities are open-ended; budgets are annual. How do you fit this into a fiscal framework?"
  **Reply:** Treat it as a sovereign debt service obligation, capped by agreed formulas. It becomes a line item like debt repayment, not discretionary aid.
  **Soft Spot:** Requires massive legislative change in donor countries. Feasibility is low without a crisis.

  3. "What I concede up front"
  I need to concede that the ledger is an estimate, not an audit. Measurement error exists, but it is less biased than ODA metrics. I should also concede that this doesn't cancel out humanitarian aid for disasters or extreme poverty unrelated to institutional harm; this is a baseline justice claim, not a ceiling. Finally, I must admit that some recipient governments are complicit; the duty is to their people, not their regimes. Giving this away stops them from spending twenty minutes proving I know these things.

  4. "The hill"
  The core claim is that the moral arithmetic of global justice must switch denominators. We cannot calculate what is owed based on the depth of the hole the recipient is in, but only on the weight of the structures we jointly hold up that keep them there. If the room accepts that institutional coercion generates debt rather than charity, the rest is implementation detail. If they reject that, the chapter fails.

  5. "The question I'm hoping nobody asks"
  You guessed the middle-income trap. It's the right worry. If Vietnam is deeply integrated into harmful supply chains and tax architectures, its ledger is higher than Niger's, where the state barely touches the global economy. The honest answer is yes: on this view, structural violence outweighs subsistence crisis. You have to stand firm that rectifying coercion takes priority over beneficence, even if it looks perverse to aid workers. The development paradigm assumes helping the poorest; the justice paradigm assumes stopping the harmers.
