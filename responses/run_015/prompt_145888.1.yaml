      *   *Conclusion:* They are not logically contradictory, but they are *sociologically* tense. They rely on different baseline distributions of resources.

  5.  **Analyze the American Inconsistency (Moral Luck & Desert):**

      *   *Observation:* Success = "I made it" (Agency). Failure = "You didn't try" (Agency). But Success stories often involve "being in the right place at the right time" (Luck).
      *   *Philosophical Tension:*
          *   *Just World Hypothesis:* The world is fair. Therefore, outcomes reflect moral worth.
          *   *Cognitive Dissonance:* To maintain the Just World view, luck must be reframed as preparedness (Seneca: "Luck is what happens when preparation meets opportunity").
          *   *Coherence:* It's not a coherent theory of moral luck. It's a *functional* ideology. It needs to justify inequality (success is deserved) while maintaining hope (anyone can succeed).
