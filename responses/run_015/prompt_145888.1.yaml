  2.  **Analyze the US Pattern (The "Stand Out" Model):**

      *   *Practices:* Employee of the Month, leaderboards, bootstrap rhetoric.
      *   *Implicit Philosophy:*
          *   *Merit:* Merit is individual, measurable, and distinct.
          *   *Desert:* Desert is hierarchical. Those who contribute more *deserve* more status/reward.
          *   *Motivation:* Extrinsic recognition drives effort (Homo Economicus + Status Seeking).
          *   *Equality:* Equality of *opportunity*, not outcome.
      *   *Moral Luck:* Success is often attributed to agency (ignoring luck), failure to lack of agency. This creates a tension.

  3.  **Analyze the Nordic/Antipodean Pattern (The "Fit In" Model):**

      *   *Practices:* Jantelagen, Tall Poppy Syndrome, anonymized promotions, salary transparency.
      *   *Implicit Philosophy:*
          *   *Merit:* Merit is collective or contextual. Excellence is expected, not exceptional.
          *   *Desert:* Desert is capped or flattened to maintain social cohesion.
          *   *Motivation:* Intrinsic motivation + social solidarity. Shame/peer pressure drives conformity.
          *   *Equality:* Equality of *condition* or *status* is a primary good.
      *   *Visible Excellence:* Seen as disruptive to the social fabric, potentially coercive (making others feel inadequate).

  4.  **Evaluate Underdetermination (Can they mix?):**

