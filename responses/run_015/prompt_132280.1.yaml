answer: |-
  Here is the specification you requested. It is structured as a set of constraints (desiderata) designed to function as a decision procedure, followed by the stress-test of your cases, the analysis of the trade-offs, and the evaluation of the DNA–Gödel isomorphism.

  ### I. The Desiderata Specification

  Each requirement is marked as **Non-Negotiable (NN)** (required by physics/logic) or **Camp Preference (CP)** (contested theoretical commitments).

  **1. Thermodynamic Openness (NN)**
  *   **Requirement:** The system must be open to energy and matter flow; entropy reduction locally must be paid for by entropy increase globally.
  *   **Case/Consideration:** Excludes perpetual motion machines and closed-system equilibrium states. Replication is a dissipative process.
  *   **Consequence:** A static pattern in a closed box is not a replicator.

  **2. Material Kinship (NN)**
  *   **Requirement:** The offspring must be constituted of *new* material acquired from the environment, arranged into a structure isomorphic to the parent, not merely a rearrangement of the parent's existing parts.
  *   **Case/Consideration:** Excludes fission where the parent simply splits (like an amoeba, technically, though we allow this biologically, physically it's borderline) vs. accretion. More importantly, excludes "echoes" or shadows.
  *   **Consequence:** A sound wave echoing is not replication. A crystal growing by accretion passes this, but see #4.

  **3. Causal Agency of Construction (NN)**
  *   **Requirement:** The replicating system must contain the causal resources to effect the assembly of the offspring. External agents may supply energy or raw materials, but they cannot supply the *assembly logic* or *mechanical work* of construction.
  *   **Case/Consideration:** Excludes the photocopier + technician. The technician supplies the assembly logic (hands/eyes).
  *   **Consequence:** If the "machine" that builds the offspring is not produced or specified by the replicating lineage, it is not self-replication.

  **4. Separation of Description and Construction (CP — von Neumann Camp)**
  *   **Requirement:** There must be a distinct physical substrate that carries *information* (passive description) separate from the substrate that performs *work* (active machinery). The description is copied passively; the machinery is built actively from the description.
  *   **Case/Consideration:** Excludes crystals, fire, and prions. In a crystal, the structure *is* the template; there is no distinct code. In von Neumann's automaton, the tape is read but not copied by the constructor; it is copied by a separate copier.
  *   **Consequence:** This is the primary filter against "simple growth" accounts.

  **5. Relational Existence (CP — Systems Camp)**
  *   **Requirement:** Replication is a property of a *system* (Replicator + Environment + Machinery), not an intrinsic property of an isolated object.
  *   **Case/Consideration:** Handles the Mirror Cell and DNA in Tube. A DNA strand is not a replicator in a vacuum; it is a replicator *relative to* a polymerase-rich medium.
  *   **Consequence:** You cannot define a replicator without defining its permissible medium.

  **6. Interpreter Origin (CP — Gödel/Bootstrapping Camp)**
  *   **Requirement:** The machinery that interprets the description (reads the code) must itself be a product of the description (or its lineage). The system must close the loop on its own semantics.
  *   **Case/Consideration:** Distinguishes a Virus (uses host interpreter) from a Cell (builds its own ribosomes). Distinguishes a Quine running on an OS (OS is external interpreter) from a self-contained automaton.
  *   **Consequence:** This is the hardest constraint. It demands that the "rules" of the system are physical products of the system.

  **7. Open-Ended Heritability (CP — Evolutionary Camp)**
  *   **Requirement:** The system must support arbitrary variations in the description that are faithfully copied and expressed in the offspring without collapsing the replication process.
  *   **Case/Consideration:** Excludes crystals (impurities stop growth) and simple autocatalytic cycles (fragile to perturbation).
  *   **Consequence:** Distinguishes "replication" from "Darwinian replication."

  ---

  ### II. Stress-Test of Cases

  | Case | Verdict | Reasoning (Failed Requirements) |
  | :--- | :--- | :--- |
  | **DNA in tube (no enzymes)** | **No** | Fails **Causal Agency**. The strand specifies nothing; it is inert. |
  | **DNA in tube (with enzymes)** | **Yes (System)** | Passes if Enzymes are part of the "System." Fails **Interpreter Origin** if enzymes are exogenous and not replenished by the DNA. |
  | **DNA + Primer (supplied)** | **Yes (System)** | Primer is a boundary condition. Replication is relational (**Relational Existence**). |
  | **Mirror-Image Cell** | **Yes (Relative)** | Passes all criteria *relative to mirror-broth*. Fails **Intrinsic** views. Confirms replication is a disposition, not a property. |
  | **Quine (on CPU)** | **No (Physical)** | Fails **Material Kinship** (abstract). If embodied: Fails **Interpreter Origin** (CPU/OS is external environment not built by quine). |
  | **Virus** | **Borderline** | Passes **Separation** (DNA/Protein). Fails **Interpreter Origin** (ribosomes are host-supplied). Class as *parasitic replicator*. |
  | **3D Printer (Internal File)** | **Yes (if...)** | Passes **Separation**. Must also assemble the *printer* (arm, electronics), not just parts. If it prints parts for human assembly, Fails **Causal Agency**. |
  | **3D Printer (Server File)** | **No** | Fails **Causal Agency/Information Containment**. The instructions are external to the physical system cycle. |
  | **Photocopier + Technician** | **No** | Fails **Causal Agency**. Technician is external agent supplying assembly logic. |
  | **Crystal Growth** | **No** | Fails **Separation of Description**. Structure is its own template; no distinct code. Fails **Open-Ended Heritability**. |
  | **Spreading Fire** | **No** | Fails **Material Kinship** (fuel is consumed/changed chemically, not copied structurally). Fails **Separation**. |
  | **Prion** | **No** | Fails **Separation**. Conformation is the template, but there is no distinct sequence code decoupled from the fold. |
  | **Autocatalytic Network** | **No** | Fails **Separation**. No distinct locus of information; collective reproduction only. |
  | **Mule** | **No** | Fails **Material Kinship/Lineage**. Cannot produce offspring. |
  | **Plaster Cast** | **No** | Fails **Causal Agency**. Mould is external; process is not cyclic. |
  | **Transposable Element** | **Yes (Parasitic)** | Passes **Separation** (Sequence). Fails **Interpreter Origin** (uses host machinery). Like a virus. |

  ---

  ### III. The Conflict: Unsatisfiable Subsets

  You suspected a conflict between **Intrinsic Existence** and **Relational Cases** (Mirror Cell/Primer). You are correct.

  **The Impossible Triad:**
  1.  Replication is an **Intrinsic Property** of the object (independent of medium).
  2.  Replication requires **Causal Closure** (the system does the work).
  3.  **Mirror Cell/DNA in Tube** are valid cases of replication potential.

  **What Has to Give:**
  You must drop **(1) Intrinsic Property**.
  There is no such thing as a "self-replicator" in isolation. There are only "self-replicating systems." A DNA strand is a *replicator component* that possesses a *disposition* to replicate *given* a specific environment. If you insist on intrinsicness, you must declare the Mirror Cell *not* a replicator in standard broth, which renders the concept biologically useless.

  **The Trade-off:**
  *   **Option A (Strict Intrinsicism):** Only von Neumann's Universal Constructor in a void counts. Biology is excluded. (Too narrow).
  *   **Option B (Relational Systems):** A replicator is defined by the *pair* (Genotype, Permissible Environment). This is the standard in philosophy of biology (e.g., Godfrey-Smith). It handles the Mirror Cell but makes "replicator" a context-dependent label.

  **Recommendation:** Adopt **Option B**. Mark **Relational Existence** as Non-Negotiable for any account that intends to cover biology.

  ---

  ### IV. The "Workhorse" Requirement

  The single requirement that does the most work in excluding the accounts people actually hold is:

  **Requirement #4: Separation of Description and Construction.**

  **Why:**
  1.  **Excludes "Growth" Intuitions:** Most people intuitively think crystals, fire, or simple fission are self-replication. This criterion kills them immediately by demanding a *code* distinct from the *structure*.
  2.  **Excludes "Template" Intuitions:** It kills the Prion and the Plaster Cast. In these cases, the shape *is* the instruction. In true replication, the instruction (sequence) is arbitrary relative to the shape (fold).
  3.  **Forces the Gödel Question:** It forces the discussion to the specific mechanism of how the code is read, which is where the DNA-Gödel analogy lives. Without this separation, there is no "reading," only "matching."

  If you enforce this, you eliminate 80% of "folk" examples of replication (crystals, fire, moulds) and force the debate onto the specific architecture of information processing (von Neumann vs. Autocatalysis).

  ---

  ### V. Analysis of the DNA–Gödel Isomorphism

  Your hypothesis is largely correct but requires one precise qualification regarding the *Interpreter*.

  **1. Where the Isomorphism is Exact:**
  You are right: The isomorphism holds exactly at the **Double Use of the String**.
  *   **Gödel:** A number $n$ encodes a formula $F$. $n$ is manipulated arithmetically (data) and $F$ asserts truth about $n$ (program/reference).
  *   **DNA:** The sequence is copied base-pair-to-base-pair (data) and translated into enzymes that act on the sequence (program).
  *   **Establishment:** This establishes that physical self-reference is possible without magic. It proves a physical system can contain a description of its own constructive logic.

  **2. Where the Isomorphism Merely Gestures:**
  The analogy breaks at the **Origin of the Interpreter**.
  *   **Formal System:** The rules of inference (the interpreter) are fixed *outside* the system (in the meta-theory). The string does not build the logic that reads it.
  *   **Biological System:** The ribosomes/polymerases (the interpreter) are physical objects encoded *by* the DNA.
  *   **The Gap:** In logic, the semantics are external. In biology, the semantics are *inherited*. The DNA does not build the *first* ribosome in the lineage; it inherits it from the parent cell.
  *   **Conclusion:** The claim that "replication is essentially self-referential" is true regarding the *cycle*, but false regarding the *origin*. The system does not supply its own semantics *ex nihilo*; it bootstraps them from a pre-existing semantic environment (the egg/cell).

  **3. Evolvability vs. Replication:**
  You are correct that claims about "supplying semantics" are often covert claims about **Evolvability**.
  *   A system that separates code from construction (von Neumann) allows mutations in the code that do not destroy the constructor immediately.
  *   A system where code = structure (crystal) cannot vary without breaking replication.
  *   Therefore, the "Gödelian" feature is the necessary condition for *open-ended evolution*, not strictly for *replication* (since a photocopier replicates but isn't Gödelian).
  *   **Refinement:** The DNA-Gödel isomorphism explains *evolvability*, not mere replication. Mere replication only requires templating. Gödelian architecture requires the separation of vehicle and description.

  ---

  ### VI. Scoring Table

  | Criterion | **von Neumann (Automaton)** | **Hofstadter (Strange Loop)** | **Chemical Autocatalysis** |
  | :--- | :--- | :--- | :--- |
  | **Thermodynamic Openness** | Pass (Abstractly assumed) | Pass (Abstractly assumed) | **Pass** (Physically grounded) |
  | **Material Kinship** | **Pass** (Explicit parts) | Fail (Abstract strings) | **Pass** (Molecules) |
  | **Causal Agency** | **Pass** (Universal Constructor) | Fail (Relies on meta-system) | **Pass** (Chemical affinity) |
  | **Separation (Code/Construct)** | **Pass** (Tape vs. Constructor) | **Pass** (String vs. Enzyme) | **Fail** (Structure is Template) |
  | **Relational Existence** | Fail (Assumes void) | Fail (Assumes formal system) | **Pass** (Dependent on soup) |
  | **Interpreter Origin** | **Pass** (Builds its own copier) | Ambiguous (System rules fixed) | **Fail** (No interpreter, just affinity) |
  | **Open-Ended Heritability** | **Pass** (Mutatable tape) | **Pass** (Mutatable strings) | Fail (Fragile network) |
  | **Primary Contribution** | Architecture of Copying | Logic of Self-Reference | Origin of Life Plausibility |

  **Summary of Scores:**
  *   **von Neumann:** The gold standard for the *logic* of replication. Satisfies Separation and Interpreter Origin perfectly in theory, but physically abstract.
  *   **Hofstadter:** Excellent for elucidating the *Gödelian double-use*, but fails on physical instantiation and Interpreter Origin (the "rules" of Typogenetics are external).
  *   **Autocatalysis:** The only one that satisfies Thermodynamics and Relational Existence realistically, but fails the Separation criterion, meaning it cannot support the DNA-Gödel isomorphism or open-ended evolution without transitioning to a coded system.

  **Final Verdict on Your Hypothesis:**
  Your hypothesis holds. The isomorphism is exact at the **Double Use** (Data/Program identity). Claims that the system "creates its own meaning" are overstated; it *inherits* the machinery of meaning. The requirement that does the most philosophical work is **Separation of Description and Construction**, as it is the gatekeeper between mere chemistry (autocatalysis) and biological information (von Neumann/DNA).
