answer: |-
  ### Axiom of Shared Core
  All cases proceeding through this instrument (e.g. Confederacy, Masada, Kosovo, Dunkirk) are premised on a **generative defeat**: a military or strategic failure reinterpreted as a moral or spiritual victory essential to group identity.

  ### The Decision Instrument

  **Node 1**
  Does the narrative chiefly serve to legitimise the authority of a current sovereign state?
  *   **Yes** → *Leaf A: Functionalist Consolidation*
  *   **No** → Proceed to Node 2

  **Node 2**
  Is the narrative mobilised by a group currently excluded from sovereign power?
  *   **Yes** → *Leaf B: Counter-Hegemonic Substrate*
  *   **No** → Proceed to Node 3

  **Node 3**
  Is the physical defeat reframed as a voluntary sacrifice necessary for the group's ultimate survival?
  *   **Yes** → *Leaf C: Pyrrhic Strategic Myth*
  *   **No** → Proceed to Node 4

  **Node 4**
  Is the memory experienced as an open wound that demands repetition rather than resolution?
  *   **Yes** → *Leaf D: Traumatic Repetition*
  *   **No** → Proceed to Node 5

  **Node 5**
  Is the narrative valued primarily for its aesthetic or nostalgic qualities, devoid of political utility?
  *   **Yes** → *Leaf E: Aestheticised Nostalgia*
  *   **No** → *Unclassified / Complex Hybrid*

  ***

  ### Instrument Notes & Limitations

  **1. Collapsed Pairs (Indistinguishable Cases)**
  *   **Dunkirk and Kosovo (on Node 3):** If one bypasses the state legitimacy question (Node 1), these cases collapse. Both involve a military failure spun as a moral victory ensuring survival. Without asking *who* is telling the story (state vs. nation), the tree cannot distinguish the British state narrative from the Serbian national myth.
  *   **Confederacy and Kosovo (on Node 2):** Both functioned as counter-hegemonic narratives immediately following defeat. The tree struggles to account for temporal shifts; the Confederacy moved from Leaf B (1865) to Leaf A (Jim Crow era) without the narrative structure changing significantly. A static snapshot may misclassify cases in transition.

  **2. Unoccupied Combos (The Empty Set)**
  *   **Leaf E (Aestheticised Nostalgia):** This category is likely logically coherent but empirically empty. A 'lost cause' inherently implies a stake in power or identity; stripping the political utility usually dissolves the narrative into mere history or fiction. If a student answers 'Yes' here, probe whether the 'nostalgia' masks an unstated political grievance.

  **3. Usage Guidance**
  *   Students should answer based on the narrative's *current* function, not its historical origin.
  *   British spelling conventions (e.g. 'legitimise', 'mobilised') are maintained for seminar consistency.
  *   If a case lands in 'Unclassified', it suggests the narrative operates through multiple leaves simultaneously (e.g. both Traumatic and Functionalist).
