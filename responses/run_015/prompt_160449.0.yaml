  ### 1. Candidate Principles

  **Pure Instrumentalism:** Vote if and only if the probability of being decisive multiplied by the value of the outcome exceeds the cost of voting.
  *Case 1 & 4:* In both cases, the probability of tipping a national threshold or a state tie is roughly 1 in 10 million. Unless the value of the outcome is infinite, the expected value is cents. This principle says skip both. It matches your verdict on Case 1 but contradicts Case 4.

  **Duty of Fair Play:** If you benefit from a cooperative scheme (democracy), you have a duty to contribute your share (vote) to maintain it, regardless of marginal impact.
  *Case 1 & 4:* This principle mandates voting in both cases to sustain the system. It matches Case 4 but contradicts your verdict on Case 1 (where you say skipping is fine).

  **Expressive Voting:** Voting is an act of speech; you ought to vote if expressing your preference has intrinsic value to you or signals identity to your community.
  *Case 1 & 4:* This makes voting optional in both, dependent on your desire to express. It fails to explain why Case 4 feels *more* obligatory than Case 1, as expression is possible in both.

  **Threshold-Signal Principle:** Vote if your ballot contributes to a public aggregate that triggers a rule or influences elite behavior, even if it doesn't decide the winner.
  *Case 1 & 4:* In Case 1 (safe state), the margin signals nothing. In Case 4 (5% threshold), the total count triggers funding. This principle permits skipping Case 1 but encourages Case 4. It aligns with your intuitions but needs arithmetic grounding for close races.

  ### 2. The Defended Principle: Conditional Cooperation and Signal

  I defend a hybrid principle that distinguishes between small cooperatives, competitive legitimacy, and public signals.

  1.  **Small Cooperative Duty:** In groups smaller than 1,000 (e.g., condo, union), vote if your cost is less than 1% of your individual stake.
      *   *Motivation:* Case 3 (Condo). Here, pivot probability is high enough for arithmetic to decide.
      *   *Handle:* Cases 3, 5 (local runoff).
  2.  **Competitive Legitimacy:** In large elections, if the margin is expected to be under 2%, you have a duty to vote unless costs are prohibitive (>5 hours or >$500), because the scheme's legitimacy depends on counted consent in close contests.
      *   *Motivation:* Case 2 (Swing state).
      *   *Handle:* Cases 2, 6 (Brother).
  3.  **Rule-Trigger Contribution:** In large elections, if a vote total triggers a specific future capacity rule (ballot access, funding) or serves as a published signal to observers, vote if costs are moderate, because you are buying future voice.
      *   *Motivation:* Case 4 (5% threshold) and Case 7 (Abroad signal).
      *   *Handle:* Cases 4, 7.
  4.  **Safe State Permission:** If neither competitiveness nor rule-triggering applies, and voting costs exceed one hour or $50, abstention is permissible.
      *   *Motivation:* Case 1 (Safe state) and Case 8 (High cost abroad).
      *   *Handle:* Cases 1, 8.

  ### 3. Application to New Cases

  **(a) The Lottery System**
  In a city of 40,000 voters, under majority rule, the probability your vote breaks a tie is approximated by $1 / \sqrt{2\pi N p (1-p)}$. With $N=40,000$ and $p=0.5$, the standard deviation $\sigma = 100$. The probability density at the mean is roughly $1 / (2.5 \times 100) \approx 1/250$. However, this is the density; the actual probability of an exact tie among others is closer to $1/400$ given discrete voters.
  Under the lottery system, your vote matters if your specific ballot is drawn. $P = 1 / \text{Total Ballots}$. If turnout is 20,000, $P = 1/20,000$.
  *Arithmetic:* $1/400$ (Majority) vs $0.00005$ (Lottery). Voting is instrumentally **less** valuable under the lottery.
  *Principle:* Clause 1 applies (small group). However, the *signal* of participation is weaker in a lottery. My principle says vote if cost is low, but notes the instrumental drop. Your gut likely says it feels less meaningful; the arithmetic confirms voting matters less here.

  **(b) Union Certification**
  Membership $N=800$. Turnout threshold = 50% (400 voters). Expected turnout = 48% (384 voters). Gap = 16 votes.
  Standard deviation $\sigma = \sqrt{800 \times 0.48 \times 0.52} \approx 14$.
  The expected shortfall is 16 votes, which is roughly $1.1\sigma$. The probability turnout fails is about 13%.
  Your vote increases expected turnout to 385. This shifts the Z-score slightly, increasing the probability of meeting quorum by approximately 1 percentage point.
  *Principle:* Clause 1 (Small Cooperative). Stake is high (workplace conditions). Cost is low (during work). 1% EV of stake likely exceeds cost.
  *Verdict:* You should vote **No**. Even if the Yes side wins, ensuring the quorum is met legitimizes the process you oppose, or failing quorum kills the vote. But strictly, your vote affects the quorum probability. Given you oppose the union, if quorum fails, union fails. If quorum passes, Yes likely wins. Your vote helps reach quorum. If you want to stop the union, you want quorum to fail. So you should **Abstain** to keep turnout below 400.
  *Correction:* If you vote No, you add to turnout. If you abstain, you don't. To prevent certification via quorum failure, you must **Abstain**.

  **(c) High-Cost Competitive Election**
  Cost = $190 + lost shift. Election is close/high-stakes.
  *Principle:* Clause 2 (Competitive Legitimacy). Duty exists unless cost is prohibitive. Is $190 prohibitive? For a high-stakes national election, this is borderline.
  *Verdict:* The principle suggests you should vote, but acknowledges the cost is significant. Unlike Case 1, you cannot skip without a "Safe State" excuse. You are in a competitive state. The duty of legitimacy overrides moderate cost. You should vote, but the campaign should acknowledge this is a sacrifice.

  ### 4. Verdict Conflicts

  My principle forces you to give up **Verdict 6** (Your Brother).
  *Your Verdict:* He has no duty to vote in a competitive election if uninformed; reason to stay home.
  *My Principle:* Clause 2 (Competitive Legitimacy) mandates voting in close elections regardless of knowledge, because the duty is to the scheme's legitimacy, not just the outcome. An uninformed vote in a tie scenario is statistically neutral (random noise), but non-participation erodes the mandate. If the election is close (Case 2), the duty applies to all eligible voters. To save Verdict 6, you would need a "Competence Clause" that exemits the uninformed, but this undermines the "one person, one vote" legitimacy the principle relies on.

  **The Best Principle Saving All Eight:**
  To save Verdict 6, you would need a **Weighted Duty Principle**: *Duty = (Competitiveness × Signal Value) × Competence - Cost.*
  *Cost:* This requires you to define "Competence" objectively. Is it reading one article? Knowing the candidates' names? This adds immense complexity and opens the door to elitism. It reduces the independent plausibility of the campaign's nonpartisan stance, as you would implicitly be judging voter quality. You would have to argue that random voting is actively harmful compared to abstention, which is empirically debated.

  ### 5. Limitations and Campaign Line

  **What the Principle Cannot Settle:**
  The principle cannot precisely calculate the "Prohibitive Cost" threshold in Clause 2 and 4. Is one hour too much? Is $50? This remains a judgment call for the individual. It also cannot settle whether a 3% margin is "competitive" enough to trigger Clause 2; I set it at 2%, but 4% might suffice. These are zones of discretion where I hand the decision back to you.

  **Campaign Line:**
  To volunteers asking about uninformed voters, say this:
  *"In close elections, voting is a duty to keep the system honest, even if you aren't sure who to pick. In safe elections, voting is a choice to support future causes or signal strength. If the cost is too high and the race is fixed, stay home without guilt."*

  This acknowledges the duty in competitive races (Case 2) while permitting abstention in safe ones (Case 1), and validates the threshold voting (Case 4) as supporting future causes. It avoids shaming the uninformed in close races while acknowledging their freedom in safe ones.
