answer: |-
  This is a fantastic question. You've basically stumbled onto the central debate in the philosophy of biology from the 1970s onwards, just by listening to your roommate.

  Here is the breakdown of the "rules" she is likely using, how they apply to your coral case, and the specific test case you can use to confirm which one she holds.

  ### 1. The Two Rules (Theories of Function)

  You correctly identified the two main contenders. In the literature, they are usually called:

  *   **The Etiological Account (Selected Effects):** A trait's function is determined by its **history**. A trait has a function if it was naturally *selected for* that specific effect in the past.
      *   *Motto:* "Function is why the trait is here."
  *   **The Causal Role Account (Systemic Contribution):** A trait's function is determined by its **current activity**. A trait has a function if it currently contributes to the capacity or survival of the larger system.
      *   *Motto:* "Function is what the trait is doing now."

  ### 2. Analyzing Her Past Verdicts

  Here is the tricky part: **Both rules explain all her previous examples equally well.**

  *   **Heart/Eye/Flagellum:** Both theories agree. They were selected for these tasks (History) AND they currently perform these tasks (Current Contribution).
  *   **Useless Protein:** Both theories agree. No selection history (History) AND no current benefit (Current Contribution).
  *   **Cancer Tumor:** This is the **smoking gun**.
      *   *Causal Role View:* Struggles here. The tumor *is* contributing to something (its own growth, hormone secretion). It's hard to call it "broken" if you only look at current causal output.
      *   *Etiological View:* Handles this easily. The heart's *selected history* is to pump blood for the organism. The tumor deviates from the organism's historical design norms. Therefore, it is "broken machinery."

  **The Clue:** Because she explicitly dismissed the cancer's activity as "broken machinery" rather than a "function of the tumor," she is almost certainly an **Etiological (Selected Effects)** theorist. This is the dominant view in philosophy of biology PhD programs because it handles "error" (like disease or mutation) much better than the Causal Role view.

  ### 3. Prediction: The Glowing Coral Case

  Here is where the two rules finally split, and where you can test her.

  *   **The Setup:** The gene protects against heat (Current Contribution = **Yes**), but it has no evolutionary history in coral (Selection History = **No**).
  *   **Causal Role Prediction:** She **should** say it *is* a function. The protein is currently contributing to the coral's survival system.
  *   **Etiological Prediction:** She **should** say it is *not* a function (yet). To an Etiological theorist, this is a "lucky side effect." Even though it helps survival now, the gene wasn't *selected for* this in the coral's lineage. It was inserted artificially. Until natural selection acts on this trait over many generations to establish it as a norm, it lacks "proper function."

  **My Bet:** Given her comment on cancer, she will likely say **it is not a real biological function yet.** She will probably call it a "beneficial causal role" or an "exaptation," but she will hesitate to grant it full "function" status because the evolutionary history is missing.

  ### 4. The Tie-Breaker Case

  If she hedges on the coral (because the gene drive complicates the "history" aspect), ask her about the **Nylonase Bacteria**.

  **The Case:**
  In the 1930s, a strain of bacteria (*Flavobacterium*) evolved the ability to digest nylon byproducts. Nylon is a synthetic material that did not exist before 1935. The enzyme that digests nylon (nylonase) arose from a frameshift mutation.

  **The Question:**
  "Does the nylon-digesting enzyme have the biological *function* of digesting nylon?"

  **Why this splits them:**
  *   **Causal Role:** **Yes.** The enzyme currently contributes to the bacteria's survival in a nylon-rich environment. It is doing the work.
  *   **Etiological:** **No (or 'Not Yet').** There is no *past* history of selection for digesting nylon because nylon didn't exist when the lineage began. It is a novel mutation. An Etiological theorist would say it *will become* a function if the bacteria survive and propagate for enough generations, but right now, it's just a lucky mutation doing a job.

  **What her answer tells you:**
  *   If she says **"Yes, it's a function,"** she is prioritizing **Current Contribution** (Causal Role).
  *   If she says **"No, it's just a useful accident until selection acts on it,"** she is prioritizing **Selection History** (Etiological).

  ### Summary for your next conversation
  1.  **Her Implicit Rule:** Likely **Etiological (Selected Effects)**, based on the "cancer is broken" comment.
  2.  **Coral Prediction:** She will likely say the heat protection is **not** a true function yet, just a beneficial side effect, because the evolutionary history is missing.
  3.  **Test Case:** Ask about the **Nylonase Bacteria**. If she says a trait can't have a function without a history of selection for that trait, you've confirmed she's an Etiological theorist.
