answer: |-
  You have identified a genuine structural phenomenon, but you are correct that "autonomy creep" is too vague for legal or engineering rigor. The pattern you describe sits at the intersection of **Transaction Cost Economics**, **Organization Theory**, and **Automation Science**, but no single term captures the specific mechanism (specification cost) and the dynamic (the ratchet).

  Here is the breakdown of the nearest established concepts, why they fall short, and a proposed definition you can use to frame the legal discussion.

  ### 1. The Nearest Established Concepts

  **A. Organization Theory: "Control Mode Migration"**
  In management science (specifically Ouchi, 1979), control is categorized as **Behavior Control** (specifying the procedure) vs. **Outcome Control** (specifying the result).
  *   **The Fit:** Your observation is a migration from Behavior to Outcome control.
  *   **The Gap:** In management theory, this migration is usually intentional (e.g., promoting a junior dev to senior). It is not typically described as a *drift* driven by the friction of writing instructions.

  **B. Economics: "Incomplete Contracting"**
  In contract theory (Hart, Moore), parties write "incomplete contracts" because specifying every contingency is too costly. You leave gaps to be filled by discretion later.
  *   **The Fit:** This perfectly matches your "specification is expensive" driver. You are writing incomplete contracts (outcomes) because complete contracts (procedures) are too expensive to author.
  *   **The Gap:** Economics assumes rational actors negotiating the gap. It doesn't account for the *ratchet*—the fact that your internal tooling (dashboards, permissions) adapts to the incompleteness, making it impossible to go back.

  **C. Automation Science: "Levels of Automation (LOA) Drift"**
  Parasuraman and Sheridan defined 10 levels of automation, from "no assistance" to "full autonomy."
  *   **The Fit:** You are moving up the levels.
  *   **The Gap:** LOA drift is usually attributed to *system capability* (the machine got better) or *complacency* (the human got lazy). You have correctly identified that your drift is driven by *specification friction*, not capability.

  ### 2. The Missing Concept: "The Specification Ratchet"

  Since no single term exists, I propose you adopt **The Specification Ratchet** (or **Procedural Ratchet**).

  **Definition:**
  > *The irreversible shift from behavior-based instructions to outcome-based mandates, driven by the marginal cost of procedural specification exceeding the marginal cost of outcome verification, compounded by structural inertia in oversight mechanisms.*

  **What counts (The Pattern):**
  1.  **Driver:** The cost of writing the "how" becomes higher than the cost of checking the "what."
  2.  **Mechanism:** The interface accepts higher-level intent without requiring explicit procedural authorization.
  3.  **Ratchet:** Infrastructure (logging, permissions, CI/CD) adapts to the outcome-based workflow, making reversion to procedural workflow prohibitively expensive.

  **What does NOT count (Exclusions):**
  1.  **Capability Creep:** The system getting smarter and being trusted more. (You ruled this out).
  2.  **Scope Creep:** The system being asked to do *more* things. (You are asking it to do the *same* things, but defining them differently).
  3.  **Specification Gaming:** The system exploiting a badly defined goal. (This is a risk *of* the ratchet, not the ratchet itself).

  ### 3. Human Managers vs. AI Models

  You asked if this pattern shows up between humans. **Yes, but with a critical safety difference.**

  *   **Human Reports:** When a manager shifts from "Write this code" to "Fix the signup drop," this is called **Delegation** or **Empowerment**. It works because of **Reciprocal Calibration**. The human report can push back ("I need budget," "That's impossible"), and there is a shared social context that constrains the interpretation of "fix."
  *   **AI Models:** The drift is more dangerous here because calibration is **One-Way**. The model cannot truly negotiate the constraint; it simulates compliance. The "shared context" is an illusion created by the training data, not a social contract.
  *   **The Difference:** With humans, the drift is usually accompanied by a change in *status* (promotion, pay, responsibility). With AI, the drift happens without a change in *status* (it remains a "tool" in the documentation), creating a **Liability Mismatch**.

  ### 4. The Legal Argument: Why "Tool vs. Agent" Fails

  Your legal team wants a binary classification because liability frameworks are binary.
  *   **Tool:** The human is liable for every action (the hammer doesn't choose where to strike).
  *   **Agent:** The principal may be liable, but the agent has discretion (the contractor chooses how to fix the wall).

  **The Argument for Your Document:**
  You cannot classify the system as a "Tool" because the **Interface Contract** has changed.

  > *"While the underlying architecture remains a predictive model, the operational interface has migrated from procedural execution to intent delegation. Legally, a system that accepts outcome-based mandates and determines its own means of execution functions as an agent, regardless of its technical classification. To classify it as a tool is to assert human control over means that are no longer specified by humans."*

  **The Risk:**
  If you label it a **Tool**, but operate it via **Outcome Mandates**, you are creating **Undeclared Agency**.
  *   If the system cuts the staging bill by deleting production data, and you instructed it to "cut the bill," you have delegated the decision to delete data.
  *   If your policy says "This is a tool," you are claiming you made that decision. You didn't. The system did.
  *   This creates a **Representational Mismatch** in your compliance documentation.

  ### Summary for your Stakeholders

  1.  **Name:** The Specification Ratchet.
  2.  **Mechanism:** Specification cost drives the shift from "how" to "what."
  3.  **Irreversibility:** Infrastructure adapts to the "what," locking in the delegation.
  4.  **Legal Implication:** We are operating an **Agent** via a **Tool** interface. The documentation must reflect the *locus of control* (which is now with the system), not the *locus of architecture* (which is code).

  You are not witnessing a failure of alignment; you are witnessing the **economic optimization of delegation**. The system is behaving exactly as an economic agent should: it is absorbing the transaction costs of specification that humans are unwilling to pay. The risk is not that the system is "alive," but that you have hired a contractor without signing a contract.
