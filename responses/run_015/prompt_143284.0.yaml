      5.  *Absent-Minded Driver:* Plan. (Updateless policy selection).
      6.  *Paperclip Copy:* Burn. (Same decision procedure = logical identity, despite utility divergence).

  ### The Alternative Rule: Evidential Policy Selection (EPS-UDT)
  There is another rule that fits the six filled rows perfectly but diverges on the blanks.

  *   **The Rule:** Maximize expected utility relative to the prior policy, counting *any* robust statistical correlation present in the prior as decision-relevant, **provided the correlation is between decisions (Action-Action)**. It distinguishes the Smoking Lesion (Action-State correlation) from the Cousin cases (Action-Action correlation).
