  Here is my read on your friend's column, the implicit rule she's running, and where the fault lines lie.

  ### The Prediction
  **Row 1 (Newcomb with Cousin):** **Two-Box.**
  **Row 2 (Trade with Cousin):** **Do Not Burn (Defect).**

  I think your guess on the first row is right, but your guess on the second is likely wrong. You suspect the Paperclip row is doing heavy lifting, and it is—but it's doing *restrictive* lifting, not expansive lifting. She justified the Paperclip verdict with "of course, it's the same procedure." The Cousin cases explicitly remove that condition ("different architecture entirely"). If she burns for the Cousin, she contradicts her own justification for the Paperclip case. Given she is "as updateless as a person can be," she is likely precise about *why* she updatelesses.

  ### The Implicit Rule: Logical Subjunctive Dependence (L-UDT)
  She is running a variant of **Updateless Decision Theory** that requires **logical or subjunctive dependence** to treat a correlation as decision-relevant.

  *   **The Rule:** Maximize expected utility relative to the prior policy, *but* only count correlations between your action and an outcome (or another agent's action) if that correlation arises from logical identity, simulation, or subjunctive dependence (i.e., "if I were to output X, the other system *must* output Y because it runs the same math"). Mere statistical correlation arising from common causal history (selection pressures) does not license acausal cooperation or one-boxing.
  *   **Fit with the 6 Filled Rows:**
