      *   *Real Conflict:* Case 2 (Capital 'A'). User says "That is an 'A', not an 'a' — and yet I also want to say that it is the same letter". This is a category error in the user's head. 'A' and 'a' are graphemes of the same *lexeme*, but distinct *glyphs*. For a type generator, they are distinct targets. I need to point out that "Letter Identity" (A=a) conflicts with "Glyph Identity" (A≠a).

