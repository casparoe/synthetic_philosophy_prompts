prompt: |-
  Hi — please take the role of a philosopher who has done a few years of clinical ethics consultation: think like a consultant, not like a debate-club speaker, work through our cases one at a time before you answer anything, and spend the first part of your reply brainstorming the range of principles that could generate the track record below rather than jumping to the one you like. I'm an ethics professor and I sit on the clinical ethics committee at the university hospital here; I have a case on Thursday and I'd like to be able to say something better than "well, it depends."

  Context: the law where we are permits assisted dying only when death is reasonably foreseeable, but the committee's own remit is wider — we advise on withdrawal of treatment, on palliative sedation, and on the cases that sit right at the edge of the eligibility criteria, and our advice is normally followed. Our precedents (anonimised, and I'm compressing badly): approved a man with pancreatic cancer, weeks to live, competent, repeated requests, self-administered lethal medication; approved a man with ALS, roughly eight months, asking to withdraw nocturnal ventilation with sedation afterwards; approved a glioblastoma patient's request for continuous palliative sedation to unconsciousness until death, which we handled as a different thing from assisted dying altogether; did not approve a 34-year-old with long-standing treatment-resistant depression, no terminal illness, competent on every test we threw at her, request stable over eighteen months, two independent psychiatric second opinions; did not approve a 78-year-old with intractable neuropathic pain from an old spinal injury, expected to live years, competent, request stable, but she had refused a trial of palliative sedation and hadn't tried one newer drug her consultant suggested; and we supported, sort of, an end-stage COPD patient — not imminently dying, on maximal therapy — who chose to stop eating and drinking: we said we would not seek to obstruct the refusal and would palliate aggressively, while formally declining to call it assisted dying. We also deferred on a 71-year-old with early Alzheimer's, still competent and apparently content, who made an advance request to be killed later, once she no longer recognised her family; we said revisit when the circumstances actually arise.

  New case: 58, diagnosed with a progressive neurological condition along the lines of multiple system atrophy, prognosis maybe two to four years, no pain worth mentioning, fully competent, no depression on assessment. What he reports is not present suffering at all but a steady and quite specific dread of what is coming — loss of speech, swallowing, continence, the loss of the activities that make his life recognisable to him — and he has made the same request, calmly, at four separate assessments over fourteen months. What he wants is a prescription he can take at a time of his own choosing, within the next few months, while he is still competent to choose it and before the decline he dreads sets in. Nothing we can offer relieves what he is actually complaining about, since what he is complaining about hasn't happened yet; the one thing that would, sedation to unconsciousness, he regards as worse than dying, and I think that's a reasonable judgement rather than a symptom. My own half-baked thought is that our precedents fit at least three rules about equally well — something about terminality or foreseeability of death, something about suffering that is present and refractory, and something about which means count (withdrawing or refusing versus supplying a lethal agent) — and that we keep conflating two things our COPD case should have forced apart: suffering that is refractory because nothing we have tried helps, and suffering that is irremediable because the only remaining remedy is one the patient can reasonably reject. But I can't tell which rule is really doing the work in our track record, or how much of this turns on the fact that his request is for a death a little later rather than right now.

  So: what would we say about him, and what should we say if we want to be consistent with ourselves? Which precedent is the closest analogue and why? If our track record genuinely underdetermines the case, then say exactly which principle we would be adopting with each of the available answers, and name one further case — a variant of his, or a fresh hypothetical — that would force us to choose between the rules that fit so far. Please don't give me a literature review and don't bother with citations or names of authors; I know that literature and I'll fill in the references myself. And don't be diplomatic: I'd rather have the version that shows I've been inconsistnet than the version that helps me feel good about Thursday.
