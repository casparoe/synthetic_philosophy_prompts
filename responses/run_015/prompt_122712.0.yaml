answer: |-
  Here are ten questions designed to move past the abstract defense and press on the structural implications of "steep prioritarianism," tailored for a policy-literate audience.

  ### 1. The Monotonicity Trap (Topic A)
  **Question:** You argue that priority weights fall off so rapidly that we should sometimes prefer a world where everyone is worse off. But mathematically, if the weight falls faster than one-over-welfare, the marginal value of welfare becomes negative. Does your view imply that making a specific person better off, *ceteris paribus*, can make the overall outcome worse? Are you prepared to give up monotonicity entirely?

  **Follow-up (If she says "Yes, I give up monotonicity"):** If adding welfare to a person can lower the moral value of the outcome, how do you advise a policy maker? If a program reliably increases everyone's income but lowers your "priority score," is the program morally forbidden?
  **Follow-up (If she says "No, I keep monotonicity"):** Then how do you square that with the claim that weights fall faster than one-over-welfare? It seems you're quietly relying on a standard concave transformation where the sum is always increasing, which would make your "steep" label misleading.

  ### 2. The Ratchet Effect (Topic B)
  **Question:** Let's look at the sequential version of your levelling down case. If moving from (10, 100) to (9, 99) improves the priority score, and (9, 99) to (8, 98) improves it, do you accept that a long chain of these individually sanctioned steps obligates us to drive everyone toward the floor?

  **Follow-up (If she says "Yes, I accept the chain"):** Then your view recommends active immiseration as long as it reduces inequality enough. Is there any empirical scenario where you would advise a government *not* to destroy wealth to achieve this floor?
  **Follow-up (If she says "No, the chain breaks"):** What breaks it? If each step is an improvement, but the sum of steps is a disaster, you're violating transitivity. Are you arguing that moral value is non-transitive, or is there a threshold where the weights suddenly stop falling?

  ### 3. The Idle Engine (Topic C)
  **Question:** Many critics suggest bolting on a Pareto side-constraint: use your steep weights to rank options, but never choose a Pareto-inferior outcome. If you adopt this, doesn't the "steepness" become idle? Within the set of Pareto-optimal options, your view might collapse back into standard prioritarianism or utilitarianism.

  **Follow-up (If she says "Pareto is just a heuristic"):** If it's only a heuristic, when does it fail? If it fails precisely when your steep weights demand it, then for all practical purposes, you are endorsing Pareto violations. Why keep the language of "constraint" if you intend to violate it in the exact cases that matter most to your theory?
  **Follow-up (If she says "It still does work on the frontier"):** Can you give a concrete policy example where two options are Pareto-optimal (no one can gain without loss), but your steep weights rank them differently than standard prioritarianism? If not, isn't the steepness purely theoretical?

  ### 4. The Egalitarian Mask (Topic D)
  **Question:** Telic egalitarians believe inequality is intrinsically bad, even if it makes no one better off. You claim to be a prioritarian, focusing on weights rather than relations. But if you permit levelling down, what work is the "priority weight" doing that isn't just done by saying "inequality is bad"?

  **Follow-up (If she says "It's about absolute levels, not relations"):** But if you're willing to lower absolute levels to achieve the distribution you prefer, the absolute level doesn't seem to be doing the heavy lifting. Isn't the distinction between your view and telic egalitarianism merely semantic at this point?
  **Follow-up (If she says "Person-affecting intuitions are the difference"):** You've argued we shouldn't trust person-affecting intuitions. But if your view recommends an outcome where no one is better off and some are worse off, whose good are you maximizing? If the answer is "no one's," how is that not just egalitarianism?

  ### 5. The Zero-Point Sensitivity (Topic E)
  **Question:** Your weights depend on absolute lifetime welfare. But welfare scales are notoriously difficult to anchor. If we shift the "zero point" of the welfare scale—say, redefining the neutral life—doesn't that drastically alter the weights? With *steep* weights, wouldn't a small shift in the zero point flip your verdicts on major policies?

  **Follow-up (If she says "We can fix the zero point"):** On what basis? Biological functioning? Preference satisfaction? If the moral ranking of societies depends on an arbitrary choice of where "zero" lies on a cardinal scale, doesn't that make the theory too unstable for policy use?
  **Follow-up (If she says "It's robust to shifting"):** Mathematically, if the decay is super-fast, the ratio of weights between rich and poor changes wildly with the zero point. Can you show the math on how a view this steep avoids being sensitive to the baseline?

  ### 6. Calibration and Arbitrariness (Topic F)
  **Question:** How do we calibrate "how steep is steep enough"? Is there a principled argument for the specific decay rate of your weights, or is the rate chosen because it yields the specific distributional intuitions you already hold?

  **Follow-up (If she says "It's principled"):** What is the principle? Is it derived from a contract, a metaphysical claim about value, or something else? If it's derived, can you state the derivation without referencing the outcomes it produces?
  **Follow-up (If she says "It's reflective equilibrium"):** If the rate is tuned to match our intuitions about cases, but the view itself tells us to reject strong intuitions (like Pareto), aren't you cherry-picking which intuitions to trust? Why trust the intuition that sets the weight, but not the intuition that rejects levelling down?

  ### 7. The Policy Translation
  **Question:** This podcast is for policy students. Standard cost-benefit analysis uses linear weights; standard prioritarianism uses concave transformations. Your view requires a function that can output negative marginal value. Is there *any* existing policy framework that can implement this, or is your theory strictly for ideal theory?

  **Follow-up (If she says "It's for ideal theory"):** If it can't guide non-ideal policy, what is its function? Is it just a critique of utilitarianism, or do you expect it to eventually guide real-world governance?
  **Follow-up (If she says "We can implement it"):** How do you handle the data requirement? To calculate these weights, we need precise interpersonal comparisons of lifetime welfare. Given we can't even agree on GDP, how do you get the granularity needed to apply steep weights without massive error?

  ### 8. Risk and Uncertainty
  **Question:** Standard prioritarianism handles risk by applying the concave function to expected welfare. If your weights are steep enough to violate Pareto, how does your view handle risk? Does it imply we should avoid risky projects that might lift everyone out of poverty because the "downside" weight is too high?

  **Follow-up (If she says "Yes, we should avoid risk"):** This seems to imply a paralysis in development policy. Is a "safe" low-welfare equilibrium always better than a "risky" high-welfare potential?
  **Follow-up (If she says "We use expected value"):** If you maximize expected priority value, but the function is non-monotonic, do you end up preferring lotteries where everyone dies over lotteries where everyone lives well, provided the probability weights align?

  ### 9. The "Good" in the Outcome
  **Question:** In your stock example, we move from (10, 100) to (5, 5). Everyone is worse off. You say the outcome is better. Better *for whom*? If it's not better for anyone, what kind of value has increased? Is it a Platonic form of "Fairness" that exists independently of human experience?

  **Follow-up (If she says "It's impersonal value"):** If impersonal value can trump everyone's actual welfare, why stop at priority? Why not say the best outcome is one where no one exists, eliminating inequality entirely? What protects your view from anti-natalism?
  **Follow-up (If she says "It's about the shape of the distribution"):** Then we are back to telic egalitarianism. Why resist that label if you admit the "shape" matters more than the "sum"?

  ### 10. Falsifiability
  **Question:** Finally, what kind of argument or evidence could actually change your mind? Is there a mathematical result, a specific case, or an empirical finding that would convince you that the weights *cannot* fall that fast?

  **Follow-up (If she says "Nothing could"):** If the view is immune to counter-example because it accepts the *reductios* as features, isn't it dogmatic? How is this different from a lexical rule that simply says "Equality First"?
  **Follow-up (If she names a condition):** That condition seems to rely on [X intuition]. But you've already dismissed [X intuition] in your paper. How can you use that intuition to falsify the theory if you've already argued we shouldn't trust it?
