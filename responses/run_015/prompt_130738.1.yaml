answer: |-
  **The one idea**

  Your candidate sentence is correct, but it needs to be sharper for a room full of practical people. Try this: "You haven't identified an institution until you can describe what the jars would look like if that institution didn't exist."

  This forces the contrast class. If the tax collector wasn't here, would the jars be smaller? Fewer? Mixed fabrics? If you can't describe the alternative, you aren't doing inference; you're doing decoration. The mechanism doesn't need stating separately because the ability to describe the counterfactual *proves* you understand the mechanism. If you say "these are tax jars," you must implicitly claim "merchant jars look different." If you can't say how they look different, you're just labeling the mystery, not solving it. This single sentence turns their confidence into a testable constraint.

  **The carrying case**

  For the inference to remain live, the jars must demonstrate coordination without revealing identity. The standardization is your lever: 240 jars, same kiln, same volume, implies a central authority commissioning production. That gets you to "somebody organized this," which is the hard part. The lack of mixed fabrics in House C versus the mixed fabrics in Houses A, B, D, E is your control group. It proves House C is anomalous.

  Keep the dog. It is a perfect trap. It feels intensely meaningful—a foundation deposit, a guardian—but it does not distinguish between a tax office, a merchant depot, a kin group, or a cult. All four could bury a dog. If you remove it, you lose the chance to teach them to ignore high-salience, low-information data. Tell them: "The dog proves someone cared about this door. It does not prove who owned the jars." Use it to separate *intent* from *institution*. The jars carry the institutional signal; the dog carries the emotional noise. Your job is to weigh the signal higher than the noise, even when the noise barks louder.

  **The order**

  Start with the ground, not the jars. Tell them: "Nothing gets into the soil unless it is lost, broken, or thrown away." This is the wreckage bias. We are not excavating a photograph of life; we are excavating a photograph of the moment everybody left. This undermines the "snapshot" assumption immediately. If you start with "archaeology is hard," they will argue. If you start with "we only find the trash," they nod.

  Once they accept the deposit is a breakdown event, move to the jars. Standardization proves organization. But organization is a mechanism, not a name. List your four candidates: tax, merchant, kin, cult. Now introduce the storytelling worry yourself. Say: "Yes, this is storytelling. But forensic storytelling relies on what doesn't fit, not just what does."

  Then hit the contrast question. "If this is a tax office, where are the records? If it's a merchant, where is the wealth? If it's kin, where are the burials? If it's a cult, where are the offerings besides the dog?" This sequence forces them to see that the jars support *organization*, but the absence of other supports limits the *identity*. The dependencies run: Wreckage → Standardization → Organization → Institutional Candidates → Contrastive Elimination. If you skip the wreckage step, they will treat the jars as if they were left on a table yesterday. If you skip the contrast step, they will pick the story they like best and stop.

  **Misconceptions, in the order they'll arrive**

  First, "Pots equal People." They will think uniform jars mean uniform believers. Correct this by pointing to the kiln fabric. It means uniform *procurement*, not belief. A tax collector buys pots; he doesn't necessarily pray to them.

  Second, the "Ritual Bin." When practical use fails, they will call it ritual. Show them the dog. Admit it's ritual, then ask: "Does that make the jars ritual?" Force the separation. One room can hold both storage and ceremony without the storage becoming sacred.

  Third, the N=1 error. They will treat 240 jars as 240 data points. Correct this: "It is one event of deposition. The jars are repetitions, not independent witnesses."

  Fourth, the detectorist shield: "Absence of evidence is not evidence of absence." This is where you use likelihoods without the math. Reply: "It is evidence of absence if the evidence should be there." If a tax office leaves records and we find none, that matters. If a kin group leaves graves and we find none, that matters. Absence only fails when preservation is impossible. Make them specify *why* the evidence should survive.

  Finally, the nihilist overcorrection: "So we can't know anything." Handle this structurally. Point to the standardization. "We know someone organized this. That is knowledge. We just don't know their title." Show them the solid ground they stand on, rather than reassuring them about the fog.

  **The check**

  Hand them a sketch of a second site: a single room with ten fine glass vessels, all different shapes, no cooking ware, no animal bone. Ask: "What single find would make you downgrade your favourite hypothesis about House C?"

  A right answer sounds like: "If we found a ledger in House C, the kin-group hypothesis dies." Or: "If we found a cremation urn in House C, the merchant hypothesis weakens." They are naming a falsifier.

  A convincingly-wrong-but-confident answer sounds like: "If we found more jars like the first lot." That just reinforces the existing data; it doesn't test the institution. Or: "If we found no dog." That tests the ritual, not the economy. You want them to look for the thing that breaks the story, not the thing that props it up.

  **What I refuse to explain**

  "I am not going to tell you what really happened here. I am not going to give you a date, a name, or a historical parallel. Those are history tasks. Tonight is about the logic of the jump from mud to meaning. If you leave knowing how to spot a weak inference, you have done better than if you leave knowing the answer. We are cleaning the lenses, not looking at the view."
