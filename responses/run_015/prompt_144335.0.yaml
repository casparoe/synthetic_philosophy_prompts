  Since no canonical term exists, I propose labeling this **Interpretive Asymmetry of Sincerity**. It is defined as a hermeneutic structure where material variation is pre-coded as spiritual loss, and stasis as spiritual integrity. For the move to be legitimate, cheapening must be linked to democratization (access increasing) rather than routinization, and elaboration to costly signaling (devotion increasing) rather than vanity. This requires independent evidence of intent, such as inscriptions or contextual shifts, not just typological evolution. Boundary cases sit where material change reflects social expansion rather than spiritual contraction. For example, if mould-made figurines appear alongside new sanctuary foundations, this suggests intensification (more people), not thinning. Conversely, if large bronzes appear in isolated elite graves rather than public sanctuaries, this suggests competition, not belief. The collapse into existing concepts happens if you assume "belief" is inherently internal and invisible; if belief is enacted practice, then change *is* belief adapting. To count as evidence of strengthening conviction, an assemblage must show increased investment relative to community capacity, not just absolute cost. Distinguishing this from simple decline requires proving that the *meaning* of the object remained potent despite formal shifts. Without this, the interpretation remains a projection of modern categories onto ancient material. The critical step where the bias operates is the assumption that form stability equals meaning stability. If you reject that equation, the asymmetry dissolves, allowing change to register as adaptation or intensification. Thus, the concept names not a historical reality, but a specific failure in the bridge between material typology and cognitive inference. This requires treating the dedicator as an agent capable of innovation.

  4. "Settled vs contested"
  Specialists agree that modern categories of "sincerity" and "ritual" are often anachronistic when applied to ancient polytheism. There is consensus that material cost does not linearly correlate with religious commitment. However, it is contested whether "belief" is recoverable from deposits at all, or if we should only track practice. My proposal that this constitutes a specific structural asymmetry is a reconstruction of common disciplinary habits rather than a named theorem. The distinction between legitimate decline and interpretive bias remains contested; some argue decline is the most parsimonious explanation for standardization. You should frame this not as a logical error in others' work, but as a theoretical constraint that limits the range of historical possibilities. Your intervention challenges the default null hypothesis of religious decay.
