  i'm a TA for a 3rd-year seminar on comparative political institutions — 24 students, one 75-minute slot. I want them to feel the case for choosing legislators by lot instead of by election, but without me saying anything about it up front, and ideally without anyone hearing the word sortition until the debrief.

  Rough setup I've got, change it if its broken: to stand for the elected chamber you spend campaign tokens, and people start with unequal amounts, so that chamber should end up skewing richer and more talkative than the room as a whole, and anyone who wins can stand again next round with a small seniority bump each time. The lot chamber is dealt random 'station' cards so it mirrors the class and serves one non-renewable term. Both chambers vote on the same motions, and the motions split into two kinds: ones that hand a named, visible benefit to one district (a bridge in District 4), and ones that hand an equal-sized benefit to everybody later that nobody can trace back to any person. My hunch is the interesting mechanism isn't short-termism, it's that re-election needs attributable credit, so elected members get pushed toward the first kind even when the second is worth just as much. I'd also like a third variant partway through where the lot chamber is staggered — half rotating out each round, overlapping — so we see what rotation costs in institutional memory.

  Can you give me actual runnable rules, a payoff scheme in points (no money, maybe a small prize), a timeline, and a debrief that maps what happened onto the argument? Also say what will predictably go wrong the first time I run it, and be honest about what the game can't show — I suspect the real thing is supposed to deliberate rather than just vote, and my setup doesn't have that in it.
