answer: |-
  This is a sharp design. You've correctly identified the *attribution problem* (the need for elected officials to claim credit) as the key mechanism, rather than just "corruption" or "short-termism." That is a sophisticated takeaway for 3rd-years.

  However, 75 minutes is extremely tight for a bicameral simulation with three variants. If the voting drags, you will eat your debrief time. Below is a streamlined, "TA-proofed" version of your plan. I have kept your core mechanics but tightened the logistics to ensure you finish on time.

  ### **Activity: The Two Chambers**
  **Time:** 75 Minutes
  **Students:** 24
  **Goal:** Demonstrate how selection methods shape legislative incentives without naming the methods until the end.

  ---

  ### **1. Preparation & Materials**
  *   **Tokens:** 100 poker chips or slips of paper (representing campaign capital).
  *   **Role Cards:**
      *   6 cards marked **Chamber A** (Elected).
      *   6 cards marked **Chamber B** (Lot).
      *   12 cards marked **Constituency** (Voters).
  *   **Wealth Distribution:** Pre-sort the tokens into 24 envelopes (or just hand them out secretly).
      *   2 students get **20 tokens** (The Wealthy).
      *   4 students get **10 tokens** (The Comfortable).
      *   18 students get **2 tokens** (The Rest).
  *   **The Motions (Projected on screen):**
      *   *Type 1 (Pork):* "Allocate 50 points to District [X]." (Visible, attributable).
      *   *Type 2 (Public Good):* "Allocate 5 points to *every* student in the room." (Diffuse, hard to attribute).
      *   *Note:* Type 2 generates more total points (120 vs 50), but Type 1 generates intense loyalty from one district.
  *   **Prize:** A bag of high-quality chocolate or a "Homework Pass" token for the highest-scoring individuals.

  ---

  ### **2. The Rules (Handout or Projected)**
  *Do not use the words "Election," "Lot," or "Sortition." Use "Chamber A" and "Chamber B."*

  **Phase 1: Selection (5 Minutes)**
  *   **Chamber A:** Any student may declare candidacy. Cost: **10 Tokens**. Constituents (the 12 voters) cast one vote each for any candidate. Top 6 vote-getters enter Chamber A. *Tie-breaker: Most tokens remaining.*
  *   **Chamber B:** TA draws 6 names from a hat containing all 24 student names. These students enter Chamber B. (Tokens do not matter).
  *   **Constituents:** The remaining 12 students sit in the center. They do not vote on laws; they vote on *people* in Chamber A next round.

  **Phase 2: Legislation (3 Rounds, 15 Minutes total)**
  *   Both Chambers vote on the **same 3 Motions** sequentially.
  *   To pass a motion, it needs a simple majority in **BOTH** chambers (Bicameralism).
  *   **Chamber A Rules:** Members can run for re-election in the next round. To win re-election, they need votes from Constituents.
  *   **Chamber B Rules:** Members serve one single round. They are returned to the general pool afterwards. They cannot run for re-election.
  *   **Payoff:**
      *   If a **Type 1** motion passes for *your* District: You get **50 points**.
      *   If a **Type 2** motion passes: You get **5 points**.
      *   **Chamber A Members:** If you are re-elected, you get a **10 point "Seniority Bonus."**
      *   **Chamber B Members:** You get a flat **5 point "Service Fee."**

  **Phase 3: The Staggered Variant (Optional/Time Permitting)**
  *   If time allows, run a 4th round where Chamber B keeps 3 old members and draws 3 new ones.

  ---

  ### **3. Run of Show (Minute-by-Minute)**

  | Time | Activity | TA Instructions |
  | :--- | :--- | :--- |
  | **00-05** | **Setup** | Hand out token envelopes. **Do not explain the inequality yet.** Assign seats (Left: Chamber A, Right: Chamber B, Center: Constituents). |
  | **05-10** | **Selection** | Run the Chamber A campaign (quick shout-out of candidates) and Chamber B draw. Get them seated. |
  | **10-15** | **Round 1 Voting** | Project Motion 1 (Pork for District 1). Give chambers 2 mins to "caucus" (talk), 1 min to vote. Repeat for Motion 2 (Public Good). |
  | **15-20** | **Re-Election** | Chamber A faces Constituents. Constituents vote based on who got them points. Losers out. New candidates enter (pay 10 tokens). |
  | **20-30** | **Round 2 & 3** | Repeat voting. Introduce a Motion that is *efficient* (Public Good) but helps no specific district visibly. Watch Chamber A struggle to pass it. |
  | **30-35** | **Scoring** | Tally points quickly. Announce top 3 scorers. Hand out prizes. |
  | **35-45** | **Variant (If time)** | Run the Staggered Lot round. If behind schedule, **skip this** and move to debrief. |
  | **45-75** | **Debrief** | The critical learning moment (see below). |

  ---

  ### **4. The Debrief (The Reveal)**
  *Do not start the debrief until the game is fully over.*

  **Step 1: The Data (5 mins)**
  *   Ask Chamber A: "How many of you felt you *had* to vote for the District-specific bill to keep your seat?"
  *   Ask Chamber B: "How many of you voted for the Public Good because you didn't need votes?"
  *   Write the vote counts on the board. Usually, Chamber A passes Pork; Chamber B passes Public Good (or deadlocks).

  **Step 2: The Reveal (5 mins)**
  *   "Chamber A was an **Electoral** system. Chamber B was **Sortition** (selection by lot)."
  *   Write **SORTITION** on the board for the first time.

  **Step 3: Mapping to Theory (15 mins)**
  *   **The Attribution Problem:** Explain that elections require *credit-claiming*. You cannot claim credit for a diffuse benefit (Type 2) easily, so rational elected officials under-invest in them, even if they are socially optimal.
  *   **Descriptive Representation:** Ask Chamber B if they felt they "represented" the room better than Chamber A. (Chamber A likely skewed toward the students who started with 20 tokens).
  *   **The Staggered Variant:** If you ran it, ask the "returning" lot members if they felt more effective, and the "new" ones if they felt lost. This maps to the *institutional memory* vs. *fresh perspective* trade-off.

  **Step 4: Limitations (5 mins)**
  *   Ask: "What did this game miss?"
  *   Guide them to: **Deliberation.** In the game, they just voted. Real sortition advocates (like Fishkin or Landemore) argue lotteries allow for *listening* and *learning* because you don't need to posture for donors/voters. This game showed *incentives*, not *deliberative quality*.

  ---

  ### **5. Predictable Failures & Fixes**

  **1. The "Rich" Dominate Everything**
  *   *Risk:* The two students with 20 tokens buy the election, then collude to split the pork.
  *   *Fix:* Cap campaign spending. "You can spend tokens, but max 5 per constituent." Or, make Constituents promise their vote *before* tokens are spent (binding endorsements).
  *   *Better Fix:* Tell Constituents: "You cannot vote for anyone who spent more than 5 tokens on you." This simulates campaign finance laws.

  **2. Chamber B Gets Bored**
  *   *Risk:* If Chamber A is doing all the "campaigning," Chamber B might disengage.
  *   *Fix:* Give Chamber B a specific task during the campaign phase. "While Chamber A campaigns, Chamber B must draft one amendment to the Public Good bill."

  **3. Time Creep**
  *   *Risk:* Voting takes forever.
  *   *Fix:* Use a visible timer. When it hits zero, hands go up. No debate. As TA, you are the Speaker of the House; be ruthless. **Cut the Staggered Variant** if you pass the 40-minute mark.

  **4. Collusion / "The Deal"**
  *   *Risk:* A Chamber A member says to Chamber B, "I'll vote for your Public Good if you vote for my Pork."
  *   *Fix:* This is actually *good* data. It shows how bicameralism forces compromise. In the debrief, highlight this: "Did the Electoral chamber infect the Lot chamber?" This shows the difficulty of maintaining a sortition chamber within a mixed system.

  ---

  ### **6. What This Game Can't Show (Honesty Check)**

  You suspected this, and you are right. Be explicit about this in the debrief so students don't walk away thinking sortition is a magic bullet.

  1.  **Deliberation:** This game is about *voting incentives*. Real sortition arguments rely on the idea that non-partisan legislators will *listen* better. This game doesn't measure listening.
  2.  **Expertise:** In the game, everyone is equally capable. In reality, complex legislation (banking regulation, climate science) might suffer if legislators are truly random and serve only one term.
  3.  **Accountability:** If a Lot member is incompetent or malicious, how do you fire them? The game ignores the *removal* mechanism.
  4.  **Scale:** This works for 24 people. Does it work for 50 million? (Mention the concept of "mini-publics" vs. full legislature replacement).

  ### **TA Tip for the "Inequality" Setup**
  When handing out the token envelopes, do it casually. "Here are your resources."
  When the two students with 20 tokens realize they are rich, watch the room. The resentment is *part of the lesson*.
  If a "poor" student complains, say: "That's the simulation."
  In the debrief, link this to **Oligarchy Theory** (Michels/Iron Law of Oligarchy). The electoral system naturally filtered for the wealthy because the entry cost was high. The lot system did not.

  ### **Final Advice**
  Print the rules on a single sheet of paper. Do not rely on verbal instructions for the scoring math; students will get it wrong and blame the system, not their math. If you have to choose between running the Staggered Variant or having a 20-minute debrief, **choose the debrief.** The learning happens in the talk, not the play.
