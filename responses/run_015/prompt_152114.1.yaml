  5.  **Predictions vs. Rivals:**
      *   *Parametric View Prediction:* Creativity should correlate with working memory/processing speed (ability to slide fast). Trajectories should be traceable retrospectively as continuous paths.
      *   *Rival (Frame-Shifting) Prediction:* Creativity correlates with cognitive flexibility/inhibition (ability to suppress old frames). Trajectories will show gaps where no intermediate states make sense.

  6.  **Assessing Insulation (The "Fast Twiddling" Rescue):**
      *   *Risk:* The view is highly vulnerable to unfalsifiability. "It looked like a jump, but you didn't see the micro-steps."
