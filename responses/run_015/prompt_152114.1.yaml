      *   *Incommensurability:* If two states cannot be mapped onto the same parameter space (Kuhnian paradigm shifts where the *dimensions themselves* change).
      *   *Structural Reorganization:* If the *topology* of the space changes, not just the position within it. (e.g., adding a new dimension vs. moving along an existing one).
      *   *Neuroscience:* If neural correlates show distinct mechanism switches (e.g., System 1 vs. System 2 aren't just speed differences, but architectural ones).
