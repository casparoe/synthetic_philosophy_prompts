  # The Welfare & Comparison Sorting Instrument

  ## Part 1: The Questions
  *Instructions: Read each scenario. Select the single option (A, B, or C) that best matches your judgment about what should be done or what is true in the case. Do not worry about theoretical labels; answer based on your intuition about the case.*

  **1. The Contented Worker (Adaptive Preferences)**
  A worker in a restrictive environment reports high satisfaction with their life. An observer with more freedom reports lower satisfaction. A policy could expand the worker's freedom but might lower their reported satisfaction.
  *   **A:** The policy should proceed; the worker is objectively worse off despite their report.
  *   **B:** The policy should not proceed; the worker's own report is the only valid measure of their welfare.
  *   **C:** The policy decision is indeterminate; there is no fact about who is "better off" across these different conditions.

  **2. The Monk and the Merchant (Incommensurable Vocabularies)**
  One person describes their good life in terms of spiritual peace; another in terms of material acquisition. They use no shared concepts of value.
  *   **A:** We can translate both lives into a common currency (e.g., time, resources) to see who has more.
  *   **B:** We can say one life is better than the other, but we cannot measure the size of the difference.
  *   **C:** There is no fact of the matter about which life is better; they are different kinds of value.

  **3. The Gap Dispute (Ratio vs. Ordinal)**
  Person X moves from misery to comfort. Person Y moves from comfort to luxury. Both say they are happier. One analyst says X's gain is twice as big as Y's; another says it is ten times as big.
  *   **A:** One analyst is correct; there is a true fact about the size of the gain.
  *   **B:** Both analysts are wrong to use numbers; we can only say both improved.
  *   **C:** We can say X's gain is larger, but the exact ratio (2x vs 10x) has no answer.

  **4. The Aging Self (Intrapersonal Comparison)**
  A person at age 20 values achievement; at age 80 (with significant memory loss) they value comfort. They disagree on what made their life good.
  *   **A:** It makes sense to calculate which period was better for the person overall.
  *   **B:** We can rank the periods, but we cannot sum them into a total life score.
  *   **C:** They are effectively different people; comparing the two states is impossible.

  **5. The Currency Clash (Second-Order Disagreement)**
  A policy offers Health Gains to Group A and Liberty Gains to Group B. The groups agree on the facts but disagree on which currency (Health or Liberty) matters more.
  *   **A:** The policymaker must stipulate a conversion rate to make a decision.
  *   **B:** The policy cannot be evaluated; we cannot trade Health for Liberty.
  *   **C:** We count both equally and sum the total units of gain.

  **6. The Thousand Cuts (Dispersed Utility Monster)**
  A policy takes a significant sum from one person (causing hardship) to give trivial amounts to a very large group (total gain exceeds loss).
  *   **A:** Approve the policy; the total sum of gains outweighs the loss.
  *   **B:** Reject the policy; one person's significant hardship cannot be traded for many trivial gains.
  *   **C:** Approve only if the large group is significantly worse off than the single loser.

  **7. The New Generation (Variable Population)**
  A policy adds a large number of new people whose lives are barely worth living to an existing happy population. Total welfare rises; average welfare falls.
  *   **A:** This is an improvement; the total amount of welfare has increased.
  *   **B:** This is a worsening; the average quality of life has decreased.
  *   **C:** This is neither better nor worse; the comparison is indeterminate.

  **8. The Metric Tie (Conventionalism)**
  Two equally defensible measurement methods give opposite policy recommendations. There is no scientific way to prove one is "true."
  *   **A:** Pick the method that best fits our institutional mandate and proceed.
  *   **B:** Suspend the decision; acting without a true measure is unjustified.
  *   **C:** Pick the method that yields the highest total benefit.

  **9. The Cultural Divide (Objectivity)**
  Two isolated cultures have radically different practices for flourishing. An outsider must judge if one is better than the other.
  *   **A:** One is objectively better, even if we cannot currently prove which.
  *   **B:** Neither is better; validity is internal to the culture.
  *   **C:** Both are valid, but for governance we must impose a single standard.

  **10. The Close Vote (Aggregation Rule)**
  51% of people prefer Policy A; 49% prefer Policy B. We have no data on how strongly they feel.
  *   **A:** Policy A wins; the headcount decides.
  *   **B:** No decision is justified; intensity matters as much as numbers.
  *   **C:** Policy A wins, but we acknowledge this is a procedural tie-break, not a welfare fact.

  ***

  ## Part 2: Scoring & Logical Space

  ### The Scoring Key
  *To be used after the quiz. For each question, find your chosen letter (A, B, or C) and add one tally mark to the corresponding column.*

  | Q | **CARD** (Full Cardinal) | **ORD** (Ordinal) | **PART** (Partial) | **PRIOR** (Prioritarian) | **SKEP** (Skeptic) | **CONV** (Conventionalist) |
  | :--- | :---: | :---: | :---: | :---: | :---: | :---: |
  | **1** | A | B | - | - | C | - |
  | **2** | A | B | C | - | C | - |
  | **3** | A | B | C | - | - | - |
  | **4** | A | B | - | - | C | - |
  | **5** | C | - | B | - | B | A |
  | **6** | A | - | - | C | B | - |
  | **7** | A | - | C | - | C | - |
  | **8** | C | - | - | - | B | A |
  | **9** | A | - | - | - | B | C |
  | **10** | - | A | - | - | B | C |

  *(Note: Dashes indicate options that do not strongly diagnose that specific leaf in this instrument.)*

  ### The Six Leaves (Commitments)

  1.  **FULL-CARD (Robust Cardinalist):** You believe welfare facts exist, are measurable, and can be aggregated. You are comfortable with trade-offs and sums.
      *   *Variant Check:* If you scored **FULL-CARD** and chose **A** on Q7, you are a **Sum-Utilitarian**. If you chose **B** on Q7, you are an **Average-Utilitarian**.
  2.  **ORD-PROC (Ordinal Proceduralist):** You believe we can rank states but not measure gaps. Social choice is a matter of voting rules and unanimity, not maximizing a total.
  3.  **PART-COMP (Partial Comparabilist):** You believe comparisons are possible in extreme cases (misery vs. luxury) but indeterminate in marginal or culturally distinct cases.
  4.  **PRIOR (Prioritarian):** You believe comparisons are possible, but aggregation should not be linear. Gains to the worse off (or avoiding deep losses) weigh more than trivial gains to many.
  5.  **SKEP (Hard Skeptic):** You believe interpersonal comparisons lack a factual basis. Therefore, aggregation is illegitimate and policy should often be suspended or rights-protected.
  6.  **CONV (Pragmatic Conventionalist):** You agree comparisons lack a factual basis (like the Skeptic), but you believe institutions must stipulate a scale to function (unlike the Skeptic).

  ***

  ## Part 3: Appendix

  ### (a) Empty or Incoherent Combinations
  *   **The "Fact-Free Aggregator":** Scoring high on **SKEP** (Q1, Q2, Q4 say "no fact") but high on **CARD** (Q6, Q8 say "sum anyway").
      *   *Diagnosis:* **Incoherent.** You cannot deny the ontology of welfare while insisting on the arithmetic of welfare without admitting you are a Conventionalist.
  *   **The "Rigid Partialist":** Scoring high on **PART** (Q3 says "ratio indeterminate") but high on **PRIOR** (Q6 says "weight the loss").
      *   *Diagnosis:* **Unexplored/Unstable.** Prioritarianism usually requires cardinal measurability to apply the weighting function. If ratios are indeterminate, weighting is impossible.
  *   **The "Average Skeptic":** Scoring high on **SKEP** but choosing **B** on Q7 (Average Utilitarianism).
      *   *Diagnosis:* **Incoherent.** Average utilitarianism requires cardinal interpersonal comparability to calculate the average across persons.

  ### (b) Indistinguishable Leaves
  *   **ORD-PROC vs. CONV:** In many policy contexts (like Q10), the Ordinalist and the Conventionalist make the same move (proceed with a tie-break rule). The quiz distinguishes them on *justification* (Q8, Q9), but if a respondent answers inconsistently there, their practical output is identical.
  *   **PRIOR vs. CARD-SUM:** In Q6, a Prioritarian might choose A if they view the "large group" as sufficiently worse off. The instrument relies on the "trivial gain" phrasing to force a split, but a sufficiently committed Sum-Utilitarian who values equality might mimic a Prioritarian answer.

  ### (c) Least Diagnostic Question
  *   **Question 10 (The Close Vote).**
      *   *Why:* It collapses too many distinctions. A Skeptic might choose B (no decision), but an Ordinalist might choose A (majority rule) and a Conventionalist might choose C (procedural). However, a Cardinalist might also choose A for pragmatic reasons. It measures *decision rule preference* more than *welfare ontology*, making it noisy for sorting the specific leaves of welfare theory.

  ***

  ## Part 4: Confidence & Weak Points

  **Confidence Level:** Moderate-High (approx. 75%).
  The instrument successfully separates the *Ontological* claim (do facts exist?) from the *Aggregation* claim (do we sum?). This resolves the primary standoff between your economists (who assume aggregation) and philosophers (who question ontology).

  **Weakest Point:**
  **The Prioritarian (PRIOR) Leaf.**
  *Reason:* Distinguishing Prioritarianism from Sum-Utilitarianism via text-based cases is notoriously fragile. In Q6, a Sum-Utilitarian might reject the trade-off if they believe in diminishing marginal utility of income (which looks like prioritarianism), whereas a Prioritarian might accept it if the "many" are destitute. The quiz assumes a specific framing of "trivial gain" to force the split, but respondents' background assumptions about the *size* of the utility units may override the theoretical distinction. You may find your economists and some philosophers clustering together here despite different justifications.

  **Most Awkward Commitment:**
  **The Conventionalist (CONV) Leaf.**
  *Reason:* This position requires holding two thoughts simultaneously: "This scale is false" and "We must use this scale." In a live discussion, respondents often slide into Skepticism (if it's false, why use it?) or Cardinalism (if we use it, it must be approximately true). Keeping them in the CONV box requires them to be comfortable with institutional fiction, which is a psychologically rare stance.
