      *   *Section 2: The Implicit Theory.* What is it actually? It's a form of "Moralised Anxiety." It assumes responsibility is tied to emotional throughput. It's closer to a Protestant Work Ethic mixed with therapy speak. It assumes outcomes are partially constituted by emotional investment.
