answer: |-
  Here is the specification for the theory of value required to sustain Lexical-Threshold Negative Utilitarianism (LTNU), followed by the structural tensions and an evaluation of the three candidate views.

  ### Part 1: The Desiderata (The Spec)

  For LTNU to function as a coherent moral theory, the underlying axiology (theory of value) regarding pleasure and pain must satisfy the following six requirements.

  **1. The Lexical Gap (Anti-Aggregation)**
  *   **Requirement:** The theory must posit a discontinuity in value such that no finite quantity of positive hedonic tone can sum to outweigh a single unit of "threshold" suffering.
  *   **Case:** The "Torture vs. Specks" case. A world with one person being tortured for a year must be worse than a world with any number of people experiencing minor annoyances (e.g., dust specks in the eye), even if the aggregate "utility" of the annoyances is mathematically vast.
  *   **Reasoning:** Standard additive utilitarianism collapses this distinction. LTNU requires a mathematical or metaphysical block on aggregation across the lexical boundary.

  **2. The Threshold Non-Arbitrariness**
  *   **Requirement:** The theory must provide a principled basis for locating the threshold where suffering becomes lexical (or where it begins to count at all), avoiding the Sorites Paradox.
  *   **Case:** The "Pinch vs. Burn" distinction. A pinch is tradeable against a great happiness; a severe burn is not. The theory must explain why the transition point isn't morally arbitrary (e.g., why 5.0 intensity is lexical but 4.9 is not).
  *   **Reasoning:** If the threshold is arbitrary, the view is vulnerable to the charge that it rests on a moral illusion. A vague threshold makes the theory action-guiding only in clear cases, failing in borderline scenarios.

  **3. Valence Asymmetry (The Zero-Point Problem)**
  *   **Requirement:** The theory must distinguish between *active suffering* and the *mere absence of pleasure*. Pleasure cannot be treated simply as "negative pain."
  *   **Case:** The "Happy vs. Neutral" distinction. A life of mild contentment should not be morally equivalent to a life of nothingness if the goal is strictly to reduce suffering, but LTNU usually allows some pleasure to trade against *mild* pain. The theory must define the zero-point where value flips from tradeable to lexical-negative.
  *   **Reasoning:** If pleasure and pain are symmetric on a single scale, lexical priority is hard to justify. The theory needs an asymmetrical account of how positive and negative values relate (or don't relate).

  **4. Phenomenological Continuity**
  *   **Requirement:** The theory cannot contradict the empirical fact that sensory experience appears continuous.
  *   **Case:** The "Dimmer Switch" intuition. Pain intensity feels like a dimmer switch, not a light switch with distinct settings. There is no known phenomenological "jump" where pain suddenly changes its *kind* rather than its *degree*.
  *   **Reasoning:** If the moral theory posits a metaphysical jump in value that has no correlate in the phenomenology of the sufferer, the theory becomes disconnected from the very thing it claims to value (the experience).

  **5. Intra-Category Aggregation**
  *   **Requirement:** While aggregation must fail *across* the lexical gap, it must succeed *within* categories.
  *   **Case:** The "Two Tortures" case. Two people being tortured must be worse than one person being tortured.
  *   **Reasoning:** If lexical suffering cannot be aggregated at all, the view collapses into an egalitarian concern for the worst-off individual only, losing its utilitarian character. It must allow summation of lexical bads to compare two lexical-bad worlds.

  **6. Psychological Plausibility (Adaptation and Salience)**
  *   **Requirement:** The theory must accommodate the fact that pain salience varies with context and adaptation, without making moral value depend on irrelevant psychological framing.
  *   **Case:** The "Habituation" case. A chronic pain sufferer may report lower intensity over time despite identical neural input. Does the moral badness decrease?
  *   **Reasoning:** If the threshold is based on reported intensity, moral value becomes unstable based on the subject's adaptation. If it is based on neural input, it contradicts the phenomenological claim that suffering is an experience.

  ---

  ### Part 2: Structural Tensions (The "No-Go" Pairs)

  The central difficulty of LTNU is that several of these desiderata appear mutually exclusive. You likely cannot satisfy all of them simultaneously.

  **Tension A: The Lexical Gap vs. Phenomenological Continuity**
  *   **Conflict:** To get a Lexical Gap (Desideratum 1), you need a discontinuity in value. To satisfy Phenomenological Continuity (Desideratum 4), you need a continuous scale of experience.
  *   **Reasoning:** If pain is on a continuous scale (0 to 10), and value is a function of pain, value should be continuous. To make value lexical, you must either:
      1.  Claim there is a hidden qualitative break in experience (contradicts psychology).
      2.  Claim value is not a function of experience alone (introduces non-natural properties).
      3.  Use a non-Archimedean number system (mathematically possible, but metaphysically obscure).
  *   **Verdict:** You generally have to sacrifice Phenomenological Continuity to secure the Lexical Gap.

  **Tension B: Threshold Non-Arbitrariness vs. Valence Asymmetry**
  *   **Conflict:** To avoid Arbitrariness (Desideratum 2), you need a natural kind distinction (e.g., "pain that disables agency"). To maintain Valence Asymmetry (Desideratum 3), you need to ensure pleasure doesn't map onto this same scale.
  *   **Reasoning:** If you define the threshold by a functional role (e.g., "pain that destroys autonomy"), you risk making the value instrumental rather than intrinsic. If you define it intrinsically (by feel), you return to the Sorites problem (when does pain become autonomy-destroying?).
  *   **Verdict:** LTNU struggles to explain *why* the threshold exists without appealing to consequences (which undermines the deontological/lexical feel) or brute intuition (which undermines non-arbitrariness).

  **Tension C: Single Scale vs. Lexical Priority**
  *   **Conflict:** If pleasure and pain are commensurable on a single scale (a common hedonic meter), Lexical Priority is mathematically impossible.
  *   **Reasoning:** On a single scale, $+1,000,000$ will always outweigh $-100$. To get lexicality, you must treat pleasure and pain as *incommensurable* magnitudes (different dimensions) or use a lexicographical ordering (like dictionary sorting: A comes before B, regardless of how many Bs you have).
  *   **Verdict:** LTNU requires incommensurability or a lexicographical ordering, which contradicts the standard Benthamite assumption of a common currency.

  ---

  ### Part 3: Evaluation of Candidate Views

  Here is how the three standard positions score against the desiderata.

  #### 1. Bentham-Style Quantitative Hedonism
  *   **Theory:** Pleasure and pain are on a single, continuous, cardinal scale. Value is the net sum.
  *   **Performance:**
      *   **Lexical Gap:** **Fail.** By definition, enough minor pains or enough pleasure can outweigh any specific pain.
      *   **Threshold:** **Fail.** No threshold exists; every unit counts equally.
      *   **Phenomenology:** **Pass.** Matches the continuous "dimmer switch" feel of sensation.
      *   **Aggregation:** **Pass.** Aggregation works everywhere.
  *   **Verdict:** Mathematically robust but morally counterintuitive for the NU proponent. It collapses the distinction between torture and dust specks.

  #### 2. Straight Negative Utilitarianism (Classical)
  *   **Theory:** Only suffering has negative value. Pleasure has zero value (or merely neutral). Minimize total suffering.
  *   **Performance:**
      *   **Lexical Gap:** **Partial Pass.** Suffering lexically outweighs pleasure (since pleasure is zero). However, it does not necessarily support *lexical* suffering (severe vs. mild). It usually treats all pain as tradeable against other pain.
      *   **Threshold:** **Fail.** Classical NU typically counts *all* suffering. It lacks the "threshold" component of LTNU (that mild suffering might be ignorable or tradeable).
      *   **Phenomenology:** **Pass.** Treats pain continuously.
      *   **Extinction Risk:** **Fail.** Often implies that a painless non-existence is better than a life with any pain, a conclusion many find too strong.
  *   **Verdict:** Solves the pleasure-pain trade-off by deleting pleasure, but fails to capture the intuition that *only severe* suffering triggers the lexical veto.

  #### 3. Parfit-Style Lexical / Threshold View
  *   **Theory:** Values are ranked in discrete qualitative levels. "Higher" bads (torture) cannot be outweighed by any number of "lower" bads (pinpricks) or goods.
  *   **Performance:**
      *   **Lexical Gap:** **Pass.** Built into the definition.
      *   **Threshold:** **Pass.** Explicitly posits qualitative breaks.
      *   **Phenomenology:** **Fail.** Contradicts the continuous nature of sensation. Requires a metaphysical claim that a 5.1 pain is a different *kind* than a 5.0 pain.
      *   **Non-Arbitrariness:** **Fail.** Struggles to define the threshold without vagueness. Where exactly does the qualitative shift happen?
      *   **Commensurability:** **Pass.** Solves the single-scale problem by rejecting the single scale.
  *   **Verdict:** This is the only view that delivers the moral results LTNU proponents want, but it pays the highest metaphysical price. It requires believing in "value discontinuities" that do not map cleanly onto "experience continuities."

  ### Summary Conclusion for the Seminar
  The hard part of LTNU is not the ethics; it is the **philosophy of mind and value measurement**.

  To make LTNU work, you must argue that **value is not isomorphic to phenomenology.** You have to claim that while pain *feels* continuous, its *moral disvalue* jumps discontinuously. If you cannot defend that decoupling, the view collapses into Benthamism (if you prioritize phenomenology) or becomes mystically arbitrary (if you prioritize the lexical threshold). The most defensible position is likely to admit that the threshold is vague but insist that *paradigm cases* (torture vs. annoyance) are distinct enough to ground the lexical rule, accepting some vagueness at the margins to preserve the core intuition.
