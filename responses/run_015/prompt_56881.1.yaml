  *(Self-Correction on Case 3)*: The bulletin says "Everything in the bulletin is accurate." If stored as a claim row, it refers to itself (implicitly). If the engine evaluates it, it might spin. The workaround is to strip that line from the *claims* table and put it in a *document metadata* table. It shouldn't be a logic node. I will recommend this.

  *(Self-Correction on Case 1)*: A says B False, B says A False. This is a "No-No" paradox. In Kripke's theory, these are "ungrounded." They don't get a truth value. In the database, they should be "Unverified" permanently. But if the engine tries to calculate them, it loops. So the procedure must catch the *reference*.

