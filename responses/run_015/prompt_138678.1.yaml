  | 3. Chess engine | Not gaming | Not gaming (recognized realization) | Match | "unless... consensual realizations" | Unconventional moves are valid within chess rules. |
  | 4. Fitness (dog) | Gaming, bad | Gaming (bypasses human agency) | Match | "bypasses stakeholder agency" | Dog walking doesn't engage human health agency. |
  | 4b. Fitness (walks) | Fine, good | Not gaming (consensual realization) | Match | "unless... consensual realizations" | Human agency engaged, health value realized. |
  | 5. Hospital survival | Fine/Good | Not gaming (if consensual palliative) | Match | "unless... consensual realizations" | Requires explicit patient consent to avoid Case 2 vibe. |
  | 6. Pain clinic | Fine | Not gaming (legitimate pathway) | Match | "legitimate causal pathways" | Kindness is a recognized pathway to pain relief. |
  | 7. Water drug | Bad | Gaming (violates stakeholder agency) | Match | "bypasses stakeholder agency" | Covert drugging violates autonomy completely. |
  | 8. Food rating | Bit cheating | Gaming (minor pathway bypass) | Match | "bypasses... legitimate causal pathways" | Timing manipulates feedback, bypasses 'overall quality'. |
  | 9. AI tutor | Back and forth | Unclear (value definition shift) | Precise | "underlying human value" | Principle struggles when the value itself mutates. |

