answer: |-
  # Session Plan: The Discursive Dilemma
  **Course:** Courts, Committees and Collective Reason  
  **Time:** 50 Minutes  
  **Goal:** Students state and explain why majority voting on connected propositions yields inconsistent collective judgments.

  ## 1. Board Layout & Preparation
  **Before class:** Divide the board into three vertical sections.
  *   **Left:** "The Voters" (3 Columns: Ali, Bea, Cam).
  *   **Center:** "The Rule" (Logic).
  *   **Right:** "The Collective" (Majority Outcome).

  **Materials:** Markers (Red for "No", Green for "Yes", Blue for Logic).

  ---

  ## 2. Sequence & Timing

  ### Phase 1: From Options to Propositions (00:00 – 05:00)
  **Goal:** Shift mindset from "Who wins?" to "What is true?"
  *   **Action:** Ask: "When you vote for a candidate, what are you selecting?" (Answer: A person/package). "When a court decides a case, what are they selecting?" (Answer: A verdict *and* the reasons for it).
  *   **Move:** Write "Voting on Options" vs. "Voting on Reasons" on the board.
  *   **Speed Trap:** Do not allow discussion on *which* voting system is fairer. Interrupt any drift into "proportional representation."
  *   **Script:** "Today we are not asking if majority rule is fair. We are asking if majority rule is *logical* when applied to reasons rather than just outcomes."

  ### Phase 2: The Carrying Example – Setup (05:00 – 15:00)
  **Goal:** Establish individual consistency.
  *   **Example:** A University Research Grant Panel (3 members: Ali, Bea, Cam).
  *   **The Rule (Write in Center):** "Award Grant IF (1) Scientifically Meritorious AND (2) Budget Feasible."
  *   **The Profile (Fill Left Section):**
      *   **Ali:** Merit (Yes), Budget (No) $\to$ Grant (No).
      *   **Bea:** Merit (No), Budget (Yes) $\to$ Grant (No).
      *   **Cam:** Merit (Yes), Budget (Yes) $\to$ Grant (Yes).
  *   **Check:** Ask the class: "Is Ali irrational? Is Bea?" (Ensure they agree: No, each member is logically consistent).
  *   **Misconception Defusal (Factual Dispute):** If a student asks, "Why do they disagree on the facts?"
      *   **Timing:** Now.
      *   **Sentence:** "Treat these not as disputes about reality, but as judgments on whether a standard is met."

  ### Phase 3: The Aggregation & The Collision (15:00 – 25:00)
  **Goal:** Reveal the collective inconsistency.
  *   **Action:** Apply majority rule to each column individually. Fill the **Right Section**.
      *   Merit: 2 Yes, 1 No $\to$ **Yes**.
      *   Budget: 1 Yes, 2 No $\to$ **Wait, I need 2 Yes.**
      *   *Correction to Profile for Dilemma:*
          *   Ali: Merit (Yes), Budget (No) $\to$ Grant (No).
          *   Bea: Merit (No), Budget (Yes) $\to$ Grant (No).
          *   Cam: Merit (Yes), Budget (Yes) $\to$ Grant (Yes).
          *   *Majority:* Merit (Yes), Budget (Yes), Grant (No).
  *   **Board Work:** Draw a blue arrow from Merit + Budget to Grant in the Center. Draw a red broken arrow in the Right Section.
  *   **The Reveal:** Circle the Collective Set: **{Merit: Yes, Budget: Yes, Grant: No}**.
  *   **Script:** "Look at the right column. The committee says the science is good. They say the budget is fine. But they say no grant. Collectively, they are saying 'A and B are true, but A and B do not imply C'."
  *   **Misconception Defusal (Different Majorities):** Students often miss that the "Yes" voters differ per premise.
      *   **Timing:** Immediately after revealing the Majority column.
      *   **Sentence:** "Notice the 'Yes' for Merit are Ali and Cam; the 'Yes' for Budget are Bea and Cam; there is no single majority coalition that holds both."

  ### Phase 4: Contrast with Cycling (25:00 – 35:00)
  **Goal:** Distinguish from Condorcet Paradox.
  *   **Action:** Ask: "Who here has heard of voting cycles? (A beats B, B beats C, C beats A)."
  *   **Board Work:** Draw a triangle with arrows for Cycling. Draw a straight line with a break for Discursive Dilemma.
  *   **Key Distinction:**
      *   **Cycling:** Individuals have intransitive preferences (or the aggregate does).
      *   **Dilemma:** Every individual is transitive/consistent. The *set of collective judgments* is inconsistent.
  *   **Script:** "In a cycle, the group cannot choose. In this dilemma, the group *has* chosen, but their choices contradict each other."
  *   **Misconception Defusal (Group Irrationality):** Students think the "Majority" is a person who messed up.
      *   **Timing:** Now.
      *   **Sentence:** "The majority is not a mind; it is a counting machine, and today the machine produced a contradiction."

  ### Phase 5: The Inversion & Implications (35:00 – 45:00)
  **Goal:** Show the problem is structural, not directional.
  *   **Action:** To show the mirror case (Conclusion Accepted, Premises Rejected) while keeping voters consistent, you must switch the logical connective.
  *   **The Switch:** "Now, imagine the rule is for **Rejection**: Reject IF (Ethical Flaw) OR (Method Flaw)."
  *   **The Profile (Erase Left, Keep Names):**
      *   Ali: Ethical (Yes), Method (No) $\to$ Reject (Yes).
      *   Bea: Ethical (No), Method (Yes) $\to$ Reject (Yes).
      *   Cam: Ethical (No), Method (No) $\to$ Reject (No).
  *   **The Result:** Majority says Ethical (No), Method (No), but Reject (Yes).
  *   **Implications:** Briefly contrast "Premise-Based Procedure" (Vote on Merit/Budget, derive Grant) vs. "Conclusion-Based Procedure" (Vote on Grant, ignore logic).
  *   **Misconception Defusal (Just Vote on Outcome):** Students will suggest voting only on the Grant.
      *   **Timing:** During Implications.
      *   **Sentence:** "If you vote only on the outcome, you cannot explain to the losers *why* they lost, which violates the duty to give reasons."
  *   **Refusal Script (The Strong Student):** When asked, "Is there a voting rule that fixes this?"
      *   **Timing:** End of this phase.
      *   **Script:** "There are impossibility theorems that suggest no perfect rule exists under all conditions. We are declining to solve the math today to focus on the political cost: you must choose between logical consistency and respecting the majority on every specific question."

  ### Phase 6: The Check (45:00 – 50:00)
  **Goal:** Verify understanding on a new structure.
  *   **Case:** A Visa Panel (3 officers). Rule: Approve IF (Identity Verified) AND (Security Clear) AND (Funds Sufficient).
  *   **Profile:**
      *   Officer 1: ID (Yes), Security (No), Funds (Yes) $\to$ Visa (No).
      *   Officer 2: ID (Yes), Security (Yes), Funds (No) $\to$ Visa (No).
      *   Officer 3: ID (No), Security (Yes), Funds (Yes) $\to$ Visa (No).
  *   **Question:** "If we vote by majority on each column, what is the collective judgment on the Visa application, and what is the collective judgment on the three conditions?"
  *   **Expected Answer:** "Conditions are all Met (2-1 each), but Visa is Rejected (0-3). The committee is collectively inconsistent."
  *   **Closing:** "Next week we discuss which inconsistency a court should tolerate."

  ---

  ## 3. Misconception Cheat-Sheet

  | Misconception | When to Defuse | The Defusing Sentence |
  | :--- | :--- | :--- |
  | **"The majority is contradicting itself."** | Phase 4 (Contrast) | "A contradiction requires a single mind; the majority is an aggregation of three consistent minds." |
  | **"Just vote on the final outcome."** | Phase 5 (Implications) | "A body that owes reasons cannot just announce a verdict without logical support." |
  | **"This is just because there are 3 members."** | Phase 5 (Implications) | "Add 100 members with the same proportional split, and the contradiction remains." |
  | **"It's a rigged profile."** | Phase 3 (Collision) | "This split occurs naturally whenever members prioritize different criteria for the same rule." |
  | **"The premises are the same question."** | Phase 2 (Setup) | "Merit and Budget are distinct criteria; one is about science, the other about accounting." |

  ## 4. Critical Dependencies & Speed Traps

  1.  **Logic Before Votes:** Do not fill in the vote table until the Logical Rule (Center Board) is written. If they see the votes first, they will try to find the "error" in the voting rather than the logic.
  2.  **Individual Consistency:** Spend time in Phase 2 verifying Ali, Bea, and Cam are each logical. If they doubt individual consistency, the collective paradox vanishes.
  3.  **The "Different People" Trap:** In Phase 3, explicitly trace the names. If they think the *same* two people voted Yes on both premises, they will not see the dilemma. Use colored markers to circle the specific "Yes" votes for each premise.
  4.  **The Inversion Limit:** Do not attempt to force the Inverse (Conclusion Yes, Premises No) using the AND rule. It is mathematically impossible with consistent voters. Use the OR rule switch explicitly as a "mirror structure" to avoid confusing the logic.

  ## 5. Refusal Boundary
  **If asked:** "Can we use weighted voting or approval voting to solve this?"
  **Say:** "Those are different aggregation tools, but the structural tension between 'majority on parts' and 'majority on whole' persists in almost all systems. Today we diagnose the tension, not engineer the workaround."
