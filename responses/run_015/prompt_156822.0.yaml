          *   B: H(Yes), M(No) $\to$ S(No).
          *   C: H(Yes), M(Yes) $\to$ S(Yes).
          *   *Majority:* H(Yes), M(Yes), S(No). This is the same as Profile 1.
          *   *Wait, I need the mirror case:* Majority accepts Conclusion, rejects Premises.
          *   A: H(No), M(Yes) $\to$ S(No).
          *   B: H(Yes), M(No) $\to$ S(No).
          *   C: H(No), M(No) $\to$ S(Yes). *Wait, C must be consistent.* If C votes S(Yes), C must vote H(Yes) and M(Yes).
          *   *Ah, the inversion requires a different logical structure or just flipping the votes.*
          *   *Let's stick to the prompt's request:* "Invertible, so that by flipping the profile I get the mirror case in which the conclusion is majority-accepted although neither premise is."
          *   *Logic:* If $C \leftrightarrow (P_1 \land P_2)$, then if Majority says $C$ is True, Majority must say $P_1$ is True AND $P_2$ is True? No.
          *   *Scenario:*
              *   Member 1: $P_1$ No, $P_2$ Yes $\to$ $C$ No.
              *   Member 2: $P_1$ Yes, $P_2$ No $\to$ $C$ No.
              *   Member 3: $P_1$ Yes, $P_2$ Yes $\to$ $C$ Yes.
