  **MUNICIPAL CONVIVIALITY & VICE AUDIT (FORM MCVA-44B)**
  **ISSUED BY: DEPARTMENT OF REGULATED LEISURE & SOUL HYGIENE**

  **SECTION 1: PURPOSE OF EXERCISE**
  1.1 This gathering is not classified as 'Recreation'. It is a diagnostic procedure designed to accelerate the manifestation of latent character defects via the administration of fermented grape juice (hereinafter 'The Agent').
  1.2 Participants acknowledge that The Agent does not *create* vice, but rather removes the cowardice of sobriety that hides it.¹
  1.3 Attendance is compulsory for all citizens aged over fifty (50) to ensure state-mandated pleasure is achieved within safe moral parameters.

  **SECTION 2: PERSONNEL & AUTHORITY**
  2.1 One (1) Designated Sobriety Officer (DSO) must be appointed per table.
  2.2 The DSO shall remain entirely abstinent. Their function is not to participate, but to audit.
  2.3 The DSO holds exclusive custody of the mixing vessel keys. Bribery of the DSO via flattery or extra rations is a capital offence.
  2.4 In the absence of a DSO, the gathering shall be classified as 'Anarchic Imbibition' and dispersed by hoplite intervention.²

  **SECTION 3: CONSUMPTION LICENCING**
  3.1 Intake is graded by chronological eligibility:
  *   **Under 18s:** Prohibited. (Character too malleable).
  *   **18–30s:** Observational only. (Passions too volatile).
  *   **30–50s:** Moderated access. (Testing phase).
  *   **50+:** Mandatory participation. (Immunity to shame established; requires chemical truth serum).
  3.2 Exceeding your tiered allocation constitutes a breach of the Public Order (Sobriety) Act.

  **SECTION 4: RISK ASSESSMENT & LIABILITY**
  4.1 **Hazard:** Loss of inhibitions. **Mitigation:** Presence of DSO.
  4.2 **Hazard:** Emergence of hidden tyranny. **Mitigation:** Immediate civic disqualification.
  4.3 Participants waive the right to claim "I was not myself" as a defence. The State contends that the intoxicated self is the *true* self; the sober self is merely the edited version.³
  4.4 The State accepts no liability for emotional distress caused by seeing one's neighbour weep over lost youth or attempt to overthrow the table arrangement.

  ***

  **APPENDIX A: CHARACTER DISCLOSURE (POST-THIRD KRATER)**
  *To be completed by the DSO only.*

  | Trait Observed | Classification | Action Required |
  | :--- | :--- | :--- |
  | Excessive Boasting | Minor Vice | Verbal Warning |
  | Weeping/Philosophising | Moderate Vice | Confiscate Cup |
  | Attempted Coups | Critical Vice | Detention & Re-education |
  | Claiming "One More Drink" | Delusional | Escort Home |

  ***

  **SIDEBAR: REFUND POLICY FOR CONTINUITY DISPUTES**
  > Should a citizen claim memory loss regarding their conduct, no refund of civic standing will be issued. The State legislates pleasure precisely because citizens cannot be trusted to enjoy it correctly. If you argue that the test was unfair because you were drunk, you have validated the necessity of the test. Appeals must be submitted in triplicate while sober.

  ***

  **FOOTNOTES**
  ¹ It is the position of the Department that wine acts as a mirror, not a paintbrush. If the mirror shows a monster, the monster was present prior to arrival.
  ² Unsupervised drinking parties are statistically linked to the collapse of democratic institutions within 4–6 hours.
  ³ See Clause 1.2. The guard must be lowered to inspect the fortress, but only if the Inspector holds the keys.

