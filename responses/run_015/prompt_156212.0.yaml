  For a three-month, 4000-word scope, your proposed instrument—a fixed battery of embeddings crossed with speaker configurations—is the right choice. Experimental work or corpus linguistics would exceed the timeframe and word count, risking a data-rich but analysis-poor outcome. Armchair intuition testing is standard in this field and sufficient for a conceptual map.
