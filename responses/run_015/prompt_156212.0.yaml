  Month 2: Populate the matrix. Systematically test intuitions for each cell. Consult existing literature to verify if specific cases (e.g., slurs in free indirect discourse) have been discussed. Identify clear dissociations where one component persists while others vanish.
  Month 3: Synthesis and writing. Group the results by projection profile. Draft the argument that distinct profiles require distinct mechanisms.
  The main alternative is focusing on a single embedding type deeply, but that risks missing the comparative data needed to prove dissociation. The battery approach beats it by providing a broader landscape, though it relies heavily on the stability of your own linguistic intuitions. However, given the word limit, depth on one embedding would not allow you to demonstrate the *divergence* of the three components. You need the cross-section to show the split. The risk is intuition variance, but for a philosophical proposal, establishing the conceptual possibility of the split is the primary goal, which armchair methods support best.

