  **Why it's still open**
  Existing positions leave this open because they treat slur behaviour as uniform. Descriptivist views argue slurs contribute only truth-conditional content, struggling to explain why embedding them doesn't neutralize offence. Expressivist views argue slurs only express attitude, struggling to explain why they can be embedded in truth-conditional contexts like conditionals. Hybrid views attempt both but often assume the derogation and the expression are locked together. Your three-way split is not mere relabelling because it generates novel empirical predictions. If derogation is semantic content, it should project like standard presuppositions. If speaker-commitment is expressive, it should project like conventional implicatures. If imposition is pragmatic uptake, it should vary by context. Current theories predict these should align. If your matrix shows they diverge—for instance, if imposition persists in reported speech where speaker-commitment vanishes—then the standard families of view are empirically inadequate. The literature currently hand-waves these mismatches as performance errors or contextual noise. This project treats them as data. By isolating the components, you force theories to account for the granularity they currently ignore.

