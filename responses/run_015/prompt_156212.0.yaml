  **What would make me drop it**
  You should drop the project if the matrix reveals no significant dissociations. If derogation, commitment, and imposition always vanish or persist together across every embedding environment, the three-way split is unnecessary complexity; a simpler monolithic theory suffices. Similarly, if "imposition" proves impossible to distinguish from "speaker-commitment" without circularity, the category collapses. Contested target classes are the weakest link; group boundaries rely on sociological data, not linguistic intuition, muddying the analysis. Additionally, relying on armchair intuitions for offence is risky; what feels imposing to you may not to others. If you find the "imposition" data too variable to generalize, the project loses its determinate answer. If reclaimed uses are pragmatic exceptions, embedding tests may not apply.
