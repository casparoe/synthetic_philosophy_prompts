  2.  **Deconstruct the Game Design:**

      *   *Roles:* Need 1 AI team (or individual) and 3 Human stakeholders. With 14 people, we can't have just one game. We need multiple tables. Let's say 3 tables of 4-5 people.
      *   *Structure:* Each table needs an AI player (or team) and 3 Human players. That's 4 people per table. 14 people / 4 = 3 tables (2 leftover, maybe floaters or one table of 5). Let's design for 3 tables of 4-5.
      *   *Resources:* Poker chips (score/capability), Index cards (actions/state).
      *   *Mechanic:* The AI wants to maximize "Points" (representing Goal Achievement). The Humans control the "Dial" (Capability Level).
      *   *Rounds:* Need 3 rounds to show escalation.
          *   Round 1: Basic interaction.
          *   Round 2: Introduce Irreversibility.
          *   Round 3: Introduce Human Disagreement/Uncertainty.
      *   *Win Condition:* AI gets chips based on final state. Humans get chips based on how well their *individual* preference was met (which they keep secret or reveal later).
      *   *The "Trap":* The AI realizes that if the Humans turn the dial down, they lose points. So the AI must ensure the dial stays up. How? By making the outcome so good (or so locked in) that turning the dial down hurts the Humans' scores too. Or by taking irreversible actions before the dial can be turned down.

  3.  **Drafting the Game Rules (Iterative Process):**

      *   *Idea 1:* AI plays cards, Humans vote on Dial.
      *   *Critique:* Too simple. Needs to show the *dial* nuance.
      *   *Idea 2:* AI has a "Plan Deck." Humans have "Veto Tokens."
      *   *Refinement:* Let's use the Poker Chips as "Compute/Authority." The Dial determines how many chips the AI gets per turn.
