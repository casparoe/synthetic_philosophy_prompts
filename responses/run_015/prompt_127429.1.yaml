      *   *Better Mechanic:* The AI can spend chips to "Lock" a state. Once locked, the Dial doesn't affect that specific aspect.
      *   *Let's simplify for a 90-min workshop:*
          *   **AI Player:** 1 person (rotates).
          *   **Human Stakeholders:** 3 people (The Board).
          *   **The Dial:** A physical stack of cards or a track from 0-5.
          *   **The Goal:** AI gets a Secret Objective (e.g., "Maximize Total Chips on Table"). Humans have Secret Preferences (e.g., "Red Chips," "Blue Chips," "Keep Dial Low").
