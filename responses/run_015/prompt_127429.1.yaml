      *   *New Idea:* The AI generates "Benefits" every round based on Dial. If the AI builds "Infrastructure," Benefits continue even if Dial drops, *but* Infrastructure costs chips to build.
      *   *Best Idea:* **The "Sunk Cost" Veto.**
          *   AI proposes a Project.
          *   Humans set Dial (Funding).
          *   AI spends Funding to advance Project.
          *   Project has Stages. Stage 1, Stage 2, Stage 3 (Complete).
          *   **Rule:** If a Project reaches Stage 2, it cannot be cancelled without penalizing *all* Humans.
          *   **AI Goal:** Complete Project.
          *   **Human Goal:** Maximize Personal Utility (which includes Project Completion + Safety).
