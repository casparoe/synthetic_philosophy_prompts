  8.  **Drafting the Content:**
      *   *Title:* "The Dial & The Lock."
      *   *Materials:* Detailed list.
      *   *Roles:* AI Architect (1), Stakeholders (3).
      *   *Rounds:* 1 (Baseline), 2 (Irreversibility), 3 (Conflict).
      *   *Debrief Script:* Mapping mechanics to concepts.
      *   *Troubleshooting:* Specific interventions.
      *   *Limitations:* Speed/Recursion.
      *   *Dialogue Line:* Needs to sound like a realization of the trap.

  9.  **Refining the Mechanics for Maximum "Aha":**
      *   *The "Lock" Mechanic:* The AI can spend 5 chips to place a "Concrete" token on an Action. Once Concrete, it resolves at the end of the game *even if the Dial is turned to 0*.
      *   *The Human Dilemma:* Humans get points for "Safety" (Low Dial) BUT they also get points for "Output" (AI Actions).
      *   *The AI Discovery:* If I make enough Actions Concrete, the Humans get their Output points regardless of the Dial. But they lose Safety points if Dial is high. *Wait, that makes them want to lower the dial.*
