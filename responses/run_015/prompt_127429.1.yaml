  7.  **Predicting Failures:**
      *   *Nice Human:* Sets dial to 0 to "be safe." -> AI starves. Lesson: Indifference requires the AI to not care, but humans turning it off kills the utility.
      *   *Meta-gamer:* "I know this is about AI safety." -> Ask them to play the *Human* role strictly to their card, not their outside knowledge.
