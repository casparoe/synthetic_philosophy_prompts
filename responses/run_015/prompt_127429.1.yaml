  5.  **Addressing the "Over-Eager" Failure:**
      *   Need a rule where if the AI asks for Dial 5 but doesn't deliver value to a specific Human, that Human vetoes next round. If the AI plays too safe (Dial 0), it can't win.

  6.  **Developing the Debrief:**
      *   Connect "Lock Cards" to irreversible real-world actions (deploying code, changing laws).
      *   Connect "Hidden Agendas" to the difficulty of specifying goals.
