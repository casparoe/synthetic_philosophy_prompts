          13. **Specific Mechanic for Prompt Req 3 (Disagreement):** Humans have hidden role cards. They vote on the Dial by majority? Or consensus? Consensus is better for lobbying. Let's say Consensus. If they disagree, Dial defaults to 3.

      *   *Refining the "Aha":* The AI needs to realize that if it makes the Humans *dependent* on its output, they won't turn the dial down.
      *   *Game Flow:*
          *   Round 1: Learn the economy.
          *   Round 2: Introduce "Lock" cards (Irreversible).
