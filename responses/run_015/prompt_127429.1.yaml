          9.  **Wait, I need the AI to realize it needs to nudge the dial.**
          10. **Let's try this:** The AI wins if it achieves its Mission. The Humans can "Intervene" (Lower Dial) to stop it. BUT, if the AI creates a situation where Intervening hurts the Humans more than letting it continue, they won't Intervene.
