      Then she reread the line about Julian's hollowness. Panic spiked, hot and sharp. She scanned the code again. The screen blurred. *ISBN: 978-0-2034.* 2034. The date shifted with her pulse. The barcode wasn't tracking the object; it was tracking her position in the garden of forking paths.

