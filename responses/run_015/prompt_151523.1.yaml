answer: |-
  This is a sophisticated and precise observation. You have identified a robust tension in our folk-psychological practices of holding responsible, one that sits at the intersection of Strawsonian reactive attitudes, action theory, and experimental moral psychology.

  To answer your primary question directly: **No, there is no single, canonical proper noun (like "The Stroop Effect") that exclusively labels this specific asymmetry.** However, it is a recognized phenomenon discussed under several overlapping frameworks. It is most accurately described as a manifestation of **Folk Compatibilism** driven by a **Quality of Will** heuristic, often analyzed through the lens of **Mind Perception** theory.

  Below is a conceptual mapping of the phenomenon, its relation to existing biases, the handling of the "combined case," and the underlying commitments it reveals.

  ### 1. Conceptual Labeling and Literature

  While there is no single name, the literature approaches this asymmetry from three angles. You can locate your observation within the convergence of these three:

  **A. The "Reasons vs. Causes" Distinction (Action Theory)**
  In philosophy of action (following Donald Davidson), there is a traditional distinction between behavior caused by *reasons* (which renders it an action) and behavior caused by *forces* (which renders it a mere event).
  *   **The Phenomenon:** Your observation highlights that folk psychology treats "rational causes" (reasons) as compatible with responsibility, but "mechanistic causes" (forces) as exculpatory, even if both are deterministic.
  *   **The Label:** In experimental philosophy, this is often discussed under **Folk Compatibilism**. Studies (e.g., by Nahmias, Shepard, & Nadelhoffer) show that people attribute free will and responsibility even in deterministic scenarios, *provided* the agent's actions are mediated by reasons rather than bypassing their cognitive machinery.
  *   **Specific Term:** **"Causal Bypassing."** When an explanation is mechanistic (neurological disorder), interlocutors intuit that the agent's mental states were *bypassed*. When the explanation is rational (calculated gain), the mental states are *engaged*. The asymmetry is the **Bypassing Intuition**.

  **B. Mind Perception and Moral Typecasting (Moral Psychology)**
  Kurt Gray and Daniel Wegner's research on **Mind Perception** distinguishes between perceiving an entity as a **Moral Agent** (capable of doing) vs. a **Moral Patient** (capable of experiencing).
  *   **The Phenomenon:** Mechanistic explanations shift the target from Agent to Patient (someone to be managed/cured). Rational explanations reinforce Agent status (someone to be blamed).
  *   **The Label:** **"Moral Typecasting."** Once cast as an Agent (via rational explanation), it is cognitively difficult to simultaneously view them as a Patient (via mechanistic explanation), even if both explanations are true.
  *   **Specific Term:** **"The Intentionality Bias"** (Rosset). This is the tendency to perceive behavior as intentional even when situational constraints exist. Your observation is a specific subtype: **The Rationality-Intentionality Link.**

  **C. Quality of Will (Strawsonian Ethics)**
  *   **The Phenomenon:** Strawson argued that reactive attitudes respond to the *quality of will* (ill will, indifference, goodwill) rather than metaphysical freedom.
  *   **The Label:** **"Quality of Will Primacy."** A rational calculation for gain signals *ill will* or *indifference*. A neurological disorder signals *no will*. The asymmetry exists because we punish the *orientation of the will*, not the *causal history of the will*.

  **Recommendation for Naming:**
  If you need a term for your own work, **"The Rationality-Responsibility Heuristic"** or **"The Agency-Preserving Asymmetry"** would be accurate. In conversation with specialists, framing it as **"The Tension between Bypassing and Reasons-Responsiveness"** will be immediately understood.

  ### 2. Relation to the Fundamental Attribution Error (FAE)

  You asked if this is a variant of the FAE. It is related but distinct.

  *   **FAE:** Overemphasizing dispositional traits over situational factors. (e.g., "He yelled because he is angry," ignoring "He yelled because he was shocked.")
  *   **Your Asymmetry:** This is not merely about disposition vs. situation. It is about **Normative vs. Non-Normative Causation.**
      *   A "rational calculation" is treated as a *normative* engagement (the agent responded to reasons).
      *   A "neurological disorder" is treated as a *non-normative* disruption (the agent was pushed by forces).
  *   **The Difference:** In FAE, if you provide a strong situational cause, blame *should* decrease. In your asymmetry, even if the "rational calculation" is fully determined by prior situational causes (e.g., upbringing, economic pressure), blame *does not* decrease.
  *   **Verdict:** This is not standard FAE. It is better described as a **"Normative Competence Bias."** We excuse incompetence (clinical), but we do not excuse competence used for harm (rational).

  ### 3. The Combined Case: Rational Exploitation of Vulnerability

  You asked: *Does the pattern hold when mechanistic and agential explanations are combined?* (e.g., an agent rationally exploits a trauma-induced vulnerability).

  **The Pattern Shifts: Moral Amplification.**
  In this hybrid case, the asymmetry does not merely hold; the rational component typically **swamps** the mechanistic component. This is a critical data point for your mapping.

  *   **The Phenomenon:** If an agent says, "My trauma made me vulnerable, and I calculated that hurting you was the best way to secure my safety," listeners rarely offer a mixed response (partial blame). They often offer *increased* blame.
  *   **Why?** The rational component signals **Endorsement.**
      *   Mechanistic cause = "This happened *to* me." (Patient status).
      *   Rational cause = "I chose *this*." (Agent status).
      *   Combined = "I chose to use what happened *to* me to do *this*."
  *   **The Label:** **"Instrumentalization of Pathology."** When an agent integrates a mechanistic vulnerability into a rational plan, the vulnerability is re-categorized from an *excuse* to a *tool*.
  *   **Philosophical Implication:** This reveals that our responsibility practices are not tracking "control" in a metaphysical sense. If they were, the presence of the trauma (lack of control over vulnerability) should mitigate blame. Instead, the presence of *rational integration* overrides the lack of control. This confirms that we are tracking **Deep Self Concordance** (Sripada). If the action aligns with the agent's evaluative judgments (even if those judgments were shaped by trauma), the agent is fully responsible.

  ### 4. Delimiting the Phenomenon: What it Is and Is Not

  To precisely delimit this for your teaching or writing:

  **What it IS:**
  1.  **A Heuristic for Social Regulation:** It is a pragmatic tool for distinguishing between those who can be influenced by *reasons* (blame/praise) and those who can only be influenced by *causes* (treatment/constraint).
  2.  **A Commitment to Compatibilism:** It reveals that interlocutors are implicit compatibilists. They do not require the agent to be the *uncaused cause* of their action; they only require the action to flow from the agent's *rational machinery*.
  3.  **Quality of Will Tracking:** It shows that "Ill Will" (rational harm) is treated as a greater threat to the moral community than "Broken Will" (clinical harm).

  **What it IS NOT:**
  1.  **It is not Libertarianism:** Listeners do not suspend blame because they believe the rational agent "could have done otherwise" in a metaphysical sense. They suspend blame for the clinical agent because the link between *reason* and *action* is broken.
  2.  **It is not Ignorance of Determinism:** Interlocutors often acknowledge both cases are determined. The asymmetry persists *despite* this acknowledgment.
  3.  **It is not the Knobe Effect:** The Knobe Effect concerns how moral judgment affects *intentionality* ascriptions. Your observation concerns how *causal explanations* affect *blame* ascriptions. (Though they are cousins).

  ### 5. The Unacknowledged Commitment

  You asked whether this reveals an unacknowledged commitment in our reactive practices. **Yes.**

  It reveals that our practice of moral responsibility is **Forward-Looking (Consequentialist/Strawsonian)** rather than **Backward-Looking (Retributivist/Metaphysical).**

  *   **The Commitment:** We hold agents responsible not because they possess a magical freedom from causation, but because they possess **Reasons-Responsiveness.**
  *   **The Logic:**
      *   If the cause is clinical, appealing to reasons (blame) is ineffective. We shift to the Objective Attitude (management).
      *   If the cause is rational, appealing to reasons (blame) is effective. We maintain the Reactive Attitude (moral address).
  *   **The Tension:** The unacknowledged commitment is that **moral responsibility is a status granted to systems that can process moral reasons.** When you explain an action rationally, you confirm the system is capable of processing reasons. When you explain it mechanistically, you suggest the system is bypassed.
  *   **The Problem:** This creates the asymmetry you observed. We punish the "rational" agent more severely, even if their rationality was determined by factors just as outside their control as the neurological disorder. We prioritize the **integrity of the moral dialogue** (can I reason with you?) over the **metaphysics of the agent's origin** (did you choose your nature?).

  ### Summary for Deployment

  If you wish to name this in your teaching or writing, I suggest describing it as:

  > **"The Reasons-Responsiveness Asymmetry in Folk Responsibility."**

  It is the tendency to treat **rational determination** as responsibility-conferring (because it preserves reasons-responsiveness) while treating **mechanistic determination** as responsibility-undermining (because it suggests causal bypassing), regardless of the deterministic status of both.

  In the **combined case** (rational exploitation of trauma), this asymmetry results in **Moral Amplification**, where the rational integration of a mechanistic vulnerability is treated as an aggravating factor (predation) rather than a mitigating one (compulsion), revealing that our practices prioritize the *alignment of action with values* over the *causal history of those values.*
