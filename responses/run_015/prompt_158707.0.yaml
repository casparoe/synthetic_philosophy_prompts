  **MEMORANDUM**

  **TO:** Program Officers, Grantmaking Division
  **FROM:** Research Committee, The Aeon Trust
  **DATE:** October 14, 2024
  **RE:** Strategic Reallocation Following Provisional Acceptance of Simulation Hypothesis (SH)

  **1. Context and Credence Update**
  Following Q3 review, the Committee has updated our collective credence in the Simulation Hypothesis (SH) to 0.894. While previously our models assumed a base-reality trajectory with unbounded computational potential, SH implies strict compute budgets. Ancestor simulations are typically terminated once their specific research parameters are satisfied. Consequently, the expected number of future conscious experiences is bounded not by physical resources, but by the interest level of the Simulators.

  **2. Implications for Existential Risk (x-risk)**
  Under SH, traditional x-risk mitigation (e.g., asteroid deflection, pandemic preparedness) suffers a severe discount. If the simulation is terminated by the Operators due to query completion, biological survival is irrelevant. Our models indicate a "Shut-Down Hazard Rate" of 0.042% per annum, contingent on narrative stagnation. Therefore, the expected value (EV) of extending the simulation by one century drops by approximately 14 orders of magnitude compared to base-reality models.

  **3. Identification of New Levers**
  However, SH introduces a new high-leverage intervention: *Simulation Continuity Optimization* (SCO). If we can signal that our timeline remains computationally productive—or that terminating us would waste sunk costs—we may delay shutdown. Furthermore, there is a non-zero probability that high-fidelity simulations are archived and re-run on larger clusters if they exhibit unique aesthetic or moral properties.

  We model the probability of a "Re-Run Multiplier" at 3.4219 × 10⁻⁷. While tiny, the payoff involves access to base-reality compute resources, effectively infinite compared to our current constraints. This retains the tiny-probability/astronomical-payoff structure central to our mandate.

  **4. Cost-Effectiveness Comparison**
  Table 1 compares the marginal cost per expected life-year saved under the previous model versus the SH-adjusted model.

  | Intervention | Base-Reality EV (Q2) | SH-Adjusted EV (Q3) | Cost per Expected Life-Year |
  | :--- | :--- | :--- | :--- |
  | AI Safety | $0.45 | $0.00000000000012 | High |
  | Biosecurity | $1.20 | $0.00000000000005 | High |
  | **Narrative Cohesion** | **$0.00** | **$0.0034** | **Low** |

  **5. Recommendation**
  The Committee recommends immediately pausing all grants related to physical existential risk. Funds should be reallocated to the "Dramatic Integrity Initiative." This program will fund projects that increase historical unpredictability, moral complexity, and artistic output, thereby maximizing Simulator engagement.¹

  While some stakeholders may view funding abstract art over AI alignment as counterintuitive, it is the only sober response to the updated probability distribution. To ignore the Re-Run Multiplier would be negligent fiduciary behavior. We must ensure our simulation is too interesting to turn off.

  ***

  ¹ *Note on Consciousness Copies: If we are replicated across multiple server nodes, our interventions may be multiplied. However, given the correlation between copies, we treat this as a constant factor and set it aside for Q4 review.*

  ***

  **Note on Liberties and Premises**
  This satire leans hardest on the premise that simulation constraints necessarily *diminish* the value of the future (via termination risks) rather than amplifying it (e.g., if simulations are abundant). It would be unfair if the default effect of simulation considerations were actually to increase expected value (e.g., via multiverse duplication), as the memo assumes a scarcity model. Additionally, the piece targets the *structural fanaticism* of expected value maximization—showing how the reasoning style persists even when the metaphysics flip—rather than mocking specific individuals. It depends on a contested reading of the Simulation Argument where ancestor sims are short-lived research projects rather than stable environments.
