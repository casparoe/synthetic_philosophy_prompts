      3. Epistemology: Pattern recognition/Modal consistency vs. Causal tracking.
      4. Objection 1 (Access): Modal knowledge is not causal knowledge.
      5. Objection 2 (Reification): Positions vs. Objects / Eliminativism.
      6. Conclusion: It relocates the mystery to logic/modality, which is a net gain.

