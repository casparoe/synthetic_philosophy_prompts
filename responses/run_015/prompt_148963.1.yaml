  Here's a thinking process that leads to the suggested exam materials:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level moral psychology seminar final.
      *   **Format:** 45-minute in-class essay, 1,000-word cap, 20 marks.
      *   **Problem:** Students recycle standard "paradox of self-deception" essays (static/dynamic paradox, partitioning, deflationism) without deep understanding.
      *   **Goal:** Create a question based on a specific case ("standard-shopping") that forces engagement with the *mechanism* of self-deception beyond belief contradiction.
      *   **Case Details:** Ana changes the interpretation of "national visibility" to favor herself for promotion, then reverts to the strict interpretation for a colleague. No intention to deceive, no factual belief contradiction, no partitioning.
      *   **Core Philosophical Claim to Test:** Is self-deception about *belief* or about *policies for counting evidence*? Is "standard-shopping" just deflationism in disguise?
      *   **Deliverables:**
          1.  Exam Question (worded for the paper).
          2.  Model Answer (700-800 words).
          3.  Marking Scheme (out of 20, with common errors).
          4.  Acceptable Variation Note (one move a strong student could reject).
          5.  Confidence Rating & Least Sure Claim.

  2.  **Drafting the Question:**
      *   *Constraint:* Must prevent rote recitation of paradoxes. Must force application of theories to the specific details of Ana's case.
      *   *Constraint:* Must address the "contrast condition" (why is this SD and not just disagreement/akrasia?).
      *   *Constraint:* Must address the reversion (strict reading for colleague).
      *   *Drafting:* Start with the case summary. Ask students to evaluate three specific accounts (Traditional, Partitioning, Deflationary) against the case. Then ask them to distinguish SD from mere bias/disagreement.
      *   *Refinement:* Make it punchy. "Standard-shopping" is a good term, keep it. Ensure the word count limit is clear.
      *   *Change Suggestion:* The prompt asks if I'd change the case/term. "Standard-shopping" is vivid. The case is strong. I will keep it but tighten the description to ensure the "no intention" clause is explicit, as that kills the Traditional view immediately.

  3.  **Drafting the Model Answer:**
      *   *Word Count:* 700-800 words.
      *   *Structure:*
          1.  Introduction: State the thesis (Standard-shopping challenges the belief-centric view; it points to evidential policies).
          2.  Analysis of Traditional/Interpersonal Model: Fails because no intention to produce false belief.
          3.  Analysis of Partitioning Model: Fails because no contradictory beliefs held simultaneously (she reverts later).
          4.  Analysis of Deflationary Model: Closest, but needs modification. It's not just bias; it's *motivated policy selection*.
          5.  Contrast Condition: Distinguish from sincere disagreement (reversion proves insincerity/bias) and akrasia (akrasia is action against belief, this is belief formation via policy).
          6.  Conclusion: The unit of SD is the evidential policy, not the belief state.
      *   *Tone:* Academic, precise, argumentative.
      *   *Key Move:* Argue that the "reversion" is the smoking gun. If it were sincere disagreement, she'd hold the loose reading for the colleague too. If it were simple bias, it wouldn't be so context-sensitive.

  4.  **Developing the Marking Scheme:**
      *   *Total:* 20 marks.
      *   *Components:*
          1.  Application of Traditional Model (Why it fails). (4 marks)
          2.  Application of Partitioning Model (Why it fails). (4 marks)
          3.  Engagement with Deflationary View (Nuance on policy vs. belief). (5 marks)
          4.  Contrast Condition (Distinguishing SD from disagreement/akrasia using the reversion). (5 marks)
          5.  Clarity/Structure/Word Count. (2 marks)
      *   *Common Errors:* Describing the theory without applying it to Ana. Ignoring the "reversion" detail. Confusing akrasia with SD.

  5.  **Identifying Acceptable Variations:**
      *   *Strong Student Objection:* A strong student might argue that this *is* just deflationism (Mele-style) and that "policy shopping" is just a description of motivated bias, not a new ontological category. They might defend the Deflationary view as sufficient without needing the "policy" upgrade.
      *   *Least Sure Claim:* The claim that "the real unit might be a policy for counting considerations as evidence." This is the professor's hunch, but it's philosophically contentious. Some might argue policies supervene on beliefs/desires.

  6.  **Review and Refine:**
      *   *Check Word Counts:* Model answer needs to be tight.
      *   *Check Constraints:* Did I answer all 4 parts of the prompt? Yes.
      *   *Check Tone:* Needs to be helpful to the professor but rigorous.
      *   *Confidence Rating:* I need to be honest about the philosophical claim. The "policy" view is plausible but not settled.

  7.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* Make sure the marking scheme explicitly penalizes "theory dumping."
      *   *Correction:* Ensure the model answer explicitly mentions the "reversion" to the strict reading for the colleague, as that's crucial for the contrast condition.
      *   *Correction:* The prompt asks for "one line per move on how a student typically gets it wrong." I need to ensure that's in the marking scheme.

  8.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  1. **The Exam Question**

  **Question 4 (20 marks)**
  **Case:** Ana is up for promotion. The criteria require "sustained national visibility." Initially, she interprets this as invited talks and awards (a reading on which she fails). Over several weeks, she comes to interpret "visibility" as "people in the field have heard of your work" (a reading on which she passes). She forms no new factual beliefs about her record (she knows she has no awards). Six months later, serving on a junior colleague's committee, she reads the same clause and reverts to the strict reading (invited talks/awards), voting no. There is no evidence of intentional deception, compartmentalization, or simultaneous contradictory beliefs.

  **Prompt:**
  Critics argue that "standard-shopping" cases like Ana's show the literature has located self-deception in the wrong ontological category (belief) rather than in *evidential policies*.
  (a) Systematically evaluate how the **Traditional Intentionalist**, **Partitioning**, and **Deflationary** accounts handle Ana's case. Specifically, identify which necessary condition of each account is violated or satisfied. (10 marks)
  (b) Establish a contrast condition: What specific feature of the case distinguishes Ana's standard-shopping from (i) sincere semantic disagreement, (ii) mere self-serving reasoning, or (iii) akrasia? Your distinction must explain why she reverts to the strict reading for her colleague. (8 marks)
  (c) Conclude whether standard-shopping requires a new model of self-deception or is merely a variant of an existing one. (2 marks)

  *Word limit: 1,000 words.*

  ***

  **Note on Case/Term:** I would keep "standard-shopping." It is vivid and accurately describes the mechanism (selecting the metric rather than faking the score). I would not change the case, but I would ensure the prompt explicitly states "She forms no new factual beliefs about her record," as students often try to smuggle in a belief contradiction (e.g., "she believes she gave more talks") which collapses the problem back into the standard paradox.

  2. **Model Answer**

  The case of Ana's "standard-shopping" presents a significant challenge to the orthodox taxonomy of self-deception. It suggests that the locus of self-deception is not necessarily a contradictory belief state or a partitioned mind, but rather a motivated selection of evidential policies. To evaluate this, we must test the three dominant accounts against the specific constraints of Ana's behavior: the lack of intention, the lack of simultaneous contradiction, and the contextual reversion to strict standards.

  The **Traditional Intentionalist Model** requires that the self-deceiver intends to bring about a belief in themselves that they know (or suspect) is false. Ana's case violates the intention condition outright. There is no evidence she set out to deceive herself; the shift in interpretation occurred over weeks of deliberation. Furthermore, she does not come to believe a factual falsehood (e.g., that she won an award). She merely alters the semantic criteria for "visibility." Because the Traditional Model requires an intention to produce a specific false belief, it cannot categorize Ana as self-deceived. It must classify her as either mistaken or rational. Given the reversion later, "mistaken" seems insufficient, suggesting the Traditional Model is too narrow to capture non-intentional motivated reasoning.

  The **Partitioning Model** attempts to solve the static paradox by suggesting the mind is divided, allowing contradictory beliefs ($p$ and $\neg p$) to exist in separate compartments. Ana's case violates the simultaneity condition. She does not hold the strict and loose readings simultaneously. She holds the loose reading during her promotion file review and the strict reading during the colleague's review. There is no "blackout" or compartment preventing access; she accesses the strict reading perfectly well six months later. If self-deception requires a synchronic contradiction, Ana is not self-deceived. However, this reveals a weakness in the Partitioning Model: it demands a structural pathology of the mind where there may only be a temporal instability of judgment driven by motivation.

  The **Deflationary Alternative** (often associated with Mele) drops the intention and the contradiction, focusing instead on biased evidence-weighting. This account fits Ana best. It allows that she honestly believes the loose reading while acquiring it through motivationally biased treatment of evidence (focusing on instances where she is known, ignoring instances where she is not). However, standard deflationism usually focuses on how evidence is *weighted* within a fixed hypothesis. Ana's case goes further: she changes the *hypothesis testing rule* itself (the definition of visibility). While the Deflationary account can absorb this as a form of bias, it struggles to explain the *reversion*. If Ana were simply biased, why does the bias switch off when her stake is removed?

  This leads to the contrast condition. To distinguish Ana's standard-shopping from **sincere semantic disagreement**, we look to the reversion. If Ana sincerely believed "visibility" meant "general awareness," she would apply that definition to her colleague. The fact that she reverts to the strict definition when her self-interest is removed indicates her initial interpretation was not a stable semantic belief, but a context-sensitive policy. This rules out sincere disagreement.

  To distinguish from **mere self-serving reasoning**, we must note that self-serving reasoning is often conscious. Ana's shift appears to be a genuine change in judgment, not a conscious rationalization. The key difference is the *opacity* of the motivation. In standard-shopping, the agent does not recognize the motivation driving the policy shift. If Ana thought, "I will use the loose rule because I need the job," that is conscious rationalization. Because she takes the loose rule to be the *correct* rule at the time, it qualifies as self-deception rather than mere reasoning.

  To distinguish from **akrasia**, we note that akrasia is acting against one's better judgment (believing $X$ is bad, doing $X$). Ana is not acting against a judgment; she is forming the judgment itself. Akrasia concerns the will; standard-shopping concerns the epistemic standard.

  Therefore, standard-shopping does not require a wholly new ontology, but it does require refining the Deflationary account. It is not merely biased weighting of evidence for a fixed belief; it is the motivated selection of the *criteria* for belief formation. The "unit" of self-deception here is the evidential policy. Ana is self-deceived not because she holds a false belief, but because she adopted a permissive evidential policy motivated by desire, which she abandoned when the desire was satisfied. This explains the reversion: the policy was never a genuine semantic commitment, but a tool of motivation. The Deflationary account survives, provided it expands its scope from belief-formation mechanisms to policy-selection mechanisms.

  3. **Marking Scheme (20 Marks)**

  | Move | Marks | Typical Failure Mode |
  | :--- | :--- | :--- |
  | **1. Traditional & Partitioning Rejection** | 4 | Student recites the definition of the paradox but fails to explicitly state *which condition* Ana violates (e.g., fails to note the lack of simultaneity for partitioning). |
  | **2. Deflationary Engagement** | 5 | Student claims Deflationism "fits" without explaining the tension regarding the *reversion* (why the bias turns off). |
  | **3. Contrast: Disagreement vs. SD** | 3 | Student argues it's just disagreement without using the "colleague reversion" as the disproof of sincerity. |
  | **4. Contrast: Akrasia/Rationalization** | 2 | Student conflates self-deception with lying to oneself (conscious rationalization) or acting against belief (akrasia). |
  | **5. Conclusion on Policy vs. Belief** | 4 | Student fails to take a stance on whether this requires a new model or just a tweak to Deflationism. |
  | **Clarity & Constraints** | 2 | Exceeds word count or ignores the "no intention" constraint in the prompt. |

  4. **Acceptable Variations Note**

  **The Rejectable Move:** A strong student may argue that "standard-shopping" is **not** a distinct category requiring a shift to "evidential policies," but is instead *fully explained* by the standard Deflationary account (motivated bias). They might argue that "policy selection" is just a description of how biased evidence weighting looks in complex semantic cases, and positing a new "unit" of self-deception is ontologically wasteful.
  **Why it's acceptable:** This is a legitimate parsimony objection. If they argue that Mele's "locally irrational belief-formation" already covers rule-selection without needing new terminology, and they support this by showing how the reversion is just the cessation of the motivating desire, they should receive full marks for the Conclusion section.

  5. **Confidence & Least Sure Claim**

  **Confidence Level:** High (85%). The structural analysis of the three models against the case is robust; the case is designed to break the first two and stress-test the third.

  **Least Sure Claim:** *"The 'unit' of self-deception here is the evidential policy."*
  **Reasoning:** This is the philosophical heart of your seminar's current direction, but it is the most contentious claim. Some metaphysicians of mind would argue that policies supervene on beliefs and desires, so positing the policy as the "unit" is category confusion. A strong student could argue that the unit is still the *belief*, but the *cause* is the policy. Distinguishing the "unit" from the "cause" is tricky. This claim goes on the acceptable-variations list as a point where a well-argued dissent (defending belief-centrism) should be rewarded.
