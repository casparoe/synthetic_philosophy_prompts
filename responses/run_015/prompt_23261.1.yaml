  I was visiting a countable model of ZFC when I found a set in the corner looking distressed.

  It said, "I'm uncountable. I've looked everywhere, but there's no bijection between me and $\mathbb{N}$ inside this universe."

  I said, "Don't worry, I'm standing in the meta-theory. From out here, I can clearly see a bijection."

  It asked, "Is the function in the model?"

  I said, "No, it's with me."

  It turned away and sighed, "Then keep it. In here, if the mapping isn't internal..."

  "...it doesn't count."
