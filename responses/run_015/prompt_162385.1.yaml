prompt: |-
  Take the replication crisis in psychology — Bem's precognition paper in 2011, the Reproducibility Project in the mid-2010s reporting that a big share of textbook effects came out null the second time, ego depletion and power posing going from settled findings to probably nothing — and run it through the pessimistic meta-induction. Skip the methodology lessons (p-hacking, underpowered designs, publication bias) except where they matter for the mapping: what I want is disciplined mapping. Who or what is the target of the induction here — the field's unobservable posits, its causal claims, its statistical practices? And is this the same shape of problem as the usual historical list, or a different one?

  The bit I keep getting stuck on: the standard realist rescues — structural realism, preservationism, the idea that the posits doing the explanatory work get carried into the successor theory — all seem to presuppose a successor theory that explains why the old one worked. Phlogiston got oxygen chemistry; the aether got special relativity. Ego depletion got nothing, the effect just evaporated. So does the crisis hurt realism about psychology more than the classic cases did, precisely because there is no successor theory to do the preserving? Or does it miss realism altogether and land only on statistical practice?

  And the other direction: what does the episode say about the pessimistic meta-induction itself — that it needs a successor-theory clause, that it needs to distinguish an induction over posits from one over methods, or that it was never a metaphysical argument in the first place? If the honest verdict is local pessimism about psychology, tell me why that doesn't spread to the rest of science; if it does spread, tell me where it stops. Be explicit about the places where no mapping is available and the analogy just breaks.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Task:** Apply the Pessimistic Meta-Induction (PMI) to the Replication Crisis in Psychology (specifically Bem, Reproducibility Project, ego depletion, power posing).
      *   **Constraint:** Skip standard methodology lessons (p-hacking, etc.) *except* where they matter for the philosophical mapping. Focus on "disciplined mapping."
      *   **Key Question 1:** Who/what is the target of the induction? (Unobservable posits, causal claims, statistical practices?)
      *   **Key Question 2:** Is this the same shape as classic PMI cases (Phlogiston, Aether) or different?
      *   **Key Question 3:** The "Successor Theory" Problem. Realist rescues (structural realism, preservationism) usually rely on a successor theory explaining the old one. Here, effects often *evaporate* (no successor). Does this hurt realism more? Or does it miss realism and hit statistical practice?
      *   **Key Question 4:** What does this say about PMI itself? (Needs successor clause? Distinguish posits vs. methods? Not metaphysical?)
      *   **Key Question 5:** Local vs. Global Pessimism. If psychology is doomed, why not the rest of science? Where does it stop?
      *   **Requirement:** Be explicit about where the analogy breaks/no mapping is available.

  2.  **Analyze the Pessimistic Meta-Induction (PMI):**

      *   *Standard Form:* Past successful theories posited entities $X$ (phlogiston, caloric, aether). $X$ turned out not to exist. Current successful theories posit entities $Y$ (electrons, genes, cognitive schemas). Therefore, $Y$ probably don't exist either.
      *   *Target:* Theoretical terms referring to unobservable entities/mechanisms.
      *   *Realist Rescue:* Structural Realism (math/relations persist), Approximate Truth (old theory was a limit case), Division of Labor (working posits vs. idle posits).
      *   *Crucial Feature:* There is usually a *successor theory* that explains why the predecessor worked (e.g., Fresnel's equations work because of EM fields, even if aether doesn't exist).

  3.  **Analyze the Replication Crisis (Psychology):**

      *   *Cases:* Bem (precognition), Ego Depletion (self-control as a muscle), Power Posing (hormones/behavior feedback).
      *   *Outcome:* Not replaced by a better theory. Often, the effect size shrinks to zero. The phenomenon is deemed non-existent or context-dependent to the point of uselessness.
      *   *Target:* Causal mechanisms (glucose levels for ego depletion), Psychological constructs (implicit attitudes), Statistical regularities.

  4.  **Drafting the Mapping (Iterative Process):**

      *   *Target of Induction:* In physics, it's entities (aether). In psychology, it's often *effects* or *causal capacities* (the capacity to deplete). It's less about "what is the mind made of" and more "does X cause Y?"
      *   *The Successor Problem:* This is the prompt's crux. In physics, Phlogiston $\to$ Oxygen. In psychology, Ego Depletion $\to$ Null Result. There is no "Oxygen of Willpower."
      *   *Implication for Realism:* If the phenomenon vanishes, Structural Realism has nothing to hold onto. There is no structure preserving the truth. This suggests the PMI hits *harder* here because the "successor clause" rescue is unavailable.
      *   *Implication for PMI:* Does this strengthen PMI? Or does it show PMI was never about *non-existence* but about *reference failure*? If the effect doesn't exist, reference fails completely.
      *   *Local vs. Global:* Why is psychology special? Is it the complexity? The measurement? If PMI applies here, does it apply to epidemiology? Economics? Where is the line?

  5.  **Structuring the Response:**

      *   **Introduction:** Define the mapping challenge. Acknowledge the distinctiveness of the "evaporation" vs. "replacement" dynamic.
      *   **Target of the Induction:** Distinguish between *ontological posits* (entities) and *causal regularities* (effects). Argue that in psychology, the target is often the *regularity itself*.
      *   **The Successor Theory Gap:** Address the "evaporation" problem. Contrast Phlogiston (replaced) vs. Ego Depletion (deleted). Discuss how this undermines Structural Realism and Preservationism.
      *   **PMI Reflexivity:** What does this do to PMI? It suggests PMI needs refinement (successor clause). It shifts the focus from metaphysics to methodology (but per prompt, keep methodology subordinate to the philosophical mapping).
      *   **Local vs. Global Pessimism:** Analyze why psychology might be a "bad neighborhood" for realism without condemning all science. Distinguish based on measurement stability and causal isolation.
      *   **Breaking Points:** Explicitly state where the analogy fails (e.g., mathematical structure, predictive utility in engineering).

  6.  **Refining the Arguments (Self-Correction during drafting):**

      *   *Correction:* I need to make sure I don't just blame p-hacking. The prompt says skip methodology *except* where it matters for mapping. So, p-hacking matters because it means the "success" in the premise of PMI (past theories were successful) is *false success*. This undermines the PMI premise itself.
      *   *Nuance:* The PMI relies on the premise that past theories were *empirically successful*. If the replication crisis shows they *weren't* actually successful (just looked like it), then PMI doesn't trigger. This is a crucial distinction. The "success" was illusory.
      *   *Realism:* If the success was illusory, Scientific Realism isn't threatened by the *failure*, but by the *illusion of success*.
      *   *The "No Successor" issue:* If an effect vanishes, it's not a theory change; it's an error correction. PMI is about theory change. This is a category error. I need to highlight this.

  7.  **Final Polish:**

