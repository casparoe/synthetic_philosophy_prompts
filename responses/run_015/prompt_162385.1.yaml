answer: |-
  This is a sharp dissection of the intersection between philosophy of science and the contemporary crisis in social science. To map the Replication Crisis onto the Pessimistic Meta-Induction (PMI) requires us to distinguish between *theory replacement* (the classic PMI case) and *effect evaporation* (the psychology case).

  Here is the disciplined mapping.

  ### 1. The Target of the Induction: Posits vs. Regularities

  In the classic PMI (Laudan, 1981), the target is the **ontological posit**. The aether, phlogiston, and caloric fluid were proposed *mechanisms* to explain observed regularities. The PMI argues that because these mechanisms were discarded, our current mechanisms (electrons, genes) are likely false too.

  In the psychology replication crisis, the target shifts. It is rarely a specific ontological entity (like a "homunculus") that is discarded; it is the **causal regularity itself**.
  *   **Ego Depletion:** The posit wasn't just "a resource"; it was the claim that *acting willfully reduces capacity for future willful action*.
  *   **Power Posing:** The posit was the causal link *expansive posture $\to$ hormonal change $\to$ behavioral change*.

  When these fail to replicate, we aren't swapping the mechanism for a better one (e.g., "it's not glucose, it's belief"); we are often asserting the correlation does not exist.

  **Mapping Verdict:** The induction here targets **stable causal capacities** rather than unobservable entities. This makes the PMI *stronger* in one sense (the whole phenomenon is gone, not just the explanation) but *weaker* in another (see Section 3).

  ### 2. The Successor Theory Gap: Replacement vs. Evaporation

  You identified the critical friction point: **Realist rescues presuppose a successor.**

  *   **Classic Case (Phlogiston):** Phlogiston theory was successful (explained combustion, calcination). It was replaced by Oxygen theory. Structural Realists argue the *mathematical structure* (conservation laws, stoichiometry) was preserved. The reference of "phlogiston" was partially fixed by the successor (it referred to the negative mass aspect of oxygen exchange, or similar).
  *   **Psychology Case (Ego Depletion):** The "theory" was successful (hundreds of citations, textbook status). It was not replaced. It was **nullified**. There is no "Oxygen of Willpower."

  **Implication for Realism:**
  This devastates the standard realist rescues.
  1.  **Structural Realism:** Fails. There is no equation or relational structure left to preserve. If the effect size is zero, the structure is null.
  2.  **Approximate Truth:** Fails. You cannot be approximately true about a non-existent effect.
  3.  **Division of Labor (Kitcher):** Fails. We cannot separate "working posits" from "idle posits" if the entire experimental paradigm yields noise.

  **Does this hurt realism more?**
  Yes. In physics, the PMI forces the realist to retreat to structure or approximation. In psychology, the replication crisis forces the realist to retreat to **skepticism**. If the historical record shows "successful" theories evaporating rather than evolving, the inductive basis for believing *any* current psychological posit is undermined more severely than in physics. It suggests the field is not converging on truth but cycling through artifacts.

  ### 3. The Premise of "Success": Illusory vs. Genuine

  This is where the mapping encounters a category error that protects the PMI itself.

  The PMI premise is: *Past theories were empirically successful.*
  The Replication Crisis finding is: *Past theories were not empirically successful; they appeared so due to methodological artifacts.*

  If the "success" of ego depletion was generated by p-hacking, publication bias, and low power, then **the premise of the PMI is false** for these cases. The theories did not earn the right to be inducted upon. They were not "successful theories that turned out false"; they were "failed theories that pretended to be successful."

  **Mapping Verdict:**
  *   **Classic PMI:** Success was genuine (Fresnel predicted the white spot), ontology was false (aether).
  *   **Psychology PMI:** Success was illusory (p-hacking), ontology is false (depletion).

  This distinction matters. If the success was illusory, the PMI does not trigger. The PMI warns us that *truth-like success* can coexist with *false ontology*. The replication crisis shows us that *noise* can coexist with *false ontology*. This is not a challenge to realism; it is a challenge to **reliability**.

  ### 4. What This Says About the PMI Itself

  If we treat the replication crisis as a valid instance of PMI (ignoring the "illusory success" objection for a moment), it forces three modifications to the PMI:

  1.  **The Successor Clause:** The PMI must be amended to acknowledge that some theories don't get successors; they get deleted. A "Deletion PMI" is more pessimistic than a "Replacement PMI." It suggests science sometimes prunes errors rather than refining truths.
  2.  **Posits vs. Methods:** The induction lands harder on **statistical practices** than on metaphysical posits. The "unobservable" that failed wasn't the ego; it was the *signal-to-noise ratio*. The realist commitment that is violated is not "the mind has structures" but "our methods detect structures."
  3.  **Metaphysical vs. Methodological:** This episode suggests the PMI was never purely metaphysical. It relied on a hidden assumption of **methodological continuity**. We assumed 19th-century chemists and 20th-century physicists were playing the same game of "capture nature." The replication crisis reveals that 20th-century psychologists and 21st-century psychologists were playing different games (one of "publish significance," the other of "estimate truth"). The PMI breaks if the game changes.

  ### 5. Local vs. Global Pessimism: Where Does It Stop?

  If we accept a Local Pessimism about psychology, why does it not spread to physics or chemistry?

  **The Boundary Condition: Causal Isolation and Measurement Stability.**
  *   **Physics:** Measurement instruments (spectrometers, interferometers) are causally isolated from the theorizing. The white spot prediction didn't depend on the sociological status of Fresnel.
  *   **Psychology:** The "instrument" is often the experimental protocol itself, which is entangled with the theory. (e.g., The definition of "ego depletion" shifts to accommodate null results).

  **Why it doesn't spread:**
  1.  **Instrumental Lock-in:** In physics, if electrons didn't exist, the transistor wouldn't work. The engineering application acts as a reality check that prevents "evaporation." Psychology lacks this engineering lock-in. There is no "willpower engine" that fails when depletion theory is false.
  2.  **Signal Stability:** The signal-to-noise ratio in particle physics is distinct from the signal-to-noise ratio in social priming. The PMI applies locally where the **noise floor exceeds the signal**.

  **Where it does spread:**
  It spreads to any science where:
  1.  Measurement is theory-laden to the point of circularity.
  2.  Effects are small and context-dependent (effect sizes < 0.2).
  3.  There is no engineering feedback loop (e.g., Economics, Epidemiology, Nutrition Science).

  ### 6. Explicit Break Points: Where the Analogy Fails

  To be disciplined, we must acknowledge where the mapping breaks down entirely.

  1.  **The Reference Failure:** In the aether case, we can say "what they were talking about was the electromagnetic field." In the Bem precognition case, there is **no referent**. There is no "future-to-past causation" that was misunderstood. The term referred to nothing. This breaks the "Partial Reference" rescue used by realists (Putnam, Psillos).
  2.  **The Role of Mathematics:** Classic PMI cases usually involve robust mathematical structures that survive (Fresnel's equations). Psychology rarely posits formal mathematical structures that survive the collapse of the effect. There is no "structure" to be a Structural Realist about.
  3.  **The Nature of the Error:** In physics, the error is usually *ontological* (wrong stuff). In the replication crisis, the error is often *statistical* (wrong inference). The PMI is an argument about ontology. Applying it to statistical inference is a category mistake. It's not that "the mind isn't like that"; it's that "we didn't measure the mind."

  ### Summary Verdict

  The replication crisis is **not** a standard instance of the Pessimistic Meta-Induction.

  *   **Standard PMI:** True Success $\to$ False Ontology $\to$ Successor Theory preserves Structure.
  *   **Psychology Crisis:** Illusory Success $\to$ False Ontology $\to$ No Successor (Evaporation).

  Because the "success" was methodological artifact rather than empirical grip, the PMI does not threaten realism about the *mind*; it threatens realism about the *literature*.

  However, if you force the mapping: It hurts psychology more than physics because the **Successor Clause** is missing. Without a successor to preserve the structural relations, the realist has nowhere to stand. This justifies **Local Pessimism**: Realism is sustainable only in domains where effects are robust enough to survive methodological scrutiny and where engineering applications provide a non-linguistic reality check. In domains lacking these (social sciences), the PMI holds with full force: current posits are likely as empty as past ones, because the mechanism of theory change is deletion, not refinement.
