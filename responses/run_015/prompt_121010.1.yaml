answer: |-
  Subject: Seminar game idea / tranquilism

  Hey,

  Here's that activity design we talked about for the grad seminar. I've run variations of this before, but tweaked it to really hit that tranquilist asymmetry (suffering counts, pleasure doesn't). The goal is to get them to feel the trap of striving before you even define the term.

  It's called **"The Zero Point."** Takes about 35-40 mins, leaving plenty of time for the debrief in your 90-min slot.

  **Materials**
  *   12 Index cards (or slips of paper).
  *   Pens for everyone.
  *   A visible timer (phone projected or whiteboard).
  *   Two types of tokens (can be paper clips vs. coins, or just mark sheets): let's call them "Relief" and "Weight."
  *   A scoreboard on the board.

  **The Setup**
  Tell students this is a optimization game. The winner gets to pick the reading topic for week 5 (or first pick of seminar paper dates—whatever currency works for you). No real money.

  **Rules**
  1.  **Baseline:** Everyone starts at **0 points**.
  2.  **The Drain:** Every 2 minutes, announce that everyone loses **1 point**. (This represents the baseline friction of existence/time).
  3.  **The Offer:** At minute 0, 5, and 10, offer them a "Boost Card."
      *   If they take a card, they immediately gain **+10 points**.
      *   **BUT:** To keep the points, they must hold the card face-up on their desk.
      *   **The Cost:** For every card they are holding, they lose **3 points** every 2 minutes (instead of the baseline 1).
      *   They can discard the card at any time to stop the extra cost, but they forfeit the +10 immediately.
  4.  **Stillness Rule:** If they fidget visibly (shuffling papers, checking phone, tapping pen) while holding a card, they lose an extra **2 points** (penalty for restless striving).
  5.  **End:** Game stops at 20 minutes. Highest score wins.

  **Payoff Scheme**
  It's purely symbolic (course privileges), but keep the tone serious like it matters. The math is rigged so that taking the Boost is almost always a net loss unless you discard it within 30 seconds (which feels like failure).
  *   *Non-taker:* Loses 1 pt every 2 mins. Total loss over 20 mins = -10. Final score: -10.
  *   *Taker (holds full time):* Gains 10. Loses 3 pts every 2 mins (15 total loss). Final score: -5.
  *   *Wait, actually:* If they hold 1 card for 20 mins (10 intervals): Gain 10. Loss 30. Net -20.
  *   *Baseline:* Loss 10. Net -10.
  *   So the person who does *nothing* beats the striver.
  *   If they take multiple cards (greed), they crash harder.

  **Debrief Guide**
  Don't explain the view until after they've played.
  1.  **Ask the winner:** "What was your strategy?" (Hopefully they say "I didn't take the cards.")
  2.  **Ask the losers:** "How did the +10 feel?" (Usually: exciting, then burdensome).
  3.  **Map it:**
      *   The **Drain** = Suffering/Dukkha (inescapable background noise).
      *   The **Boost** = Pleasure/Achievement (feels good initially).
      *   The **Holding Cost** = Craving/Attachment (the maintenance energy required to keep the pleasure).
      *   **The Lesson:** The +10 wasn't "good," it was just a temporary interruption of the drain that increased the drain rate. The optimal state wasn't high points, it was low liability. This is tranquilism: the absence of the burden is the only real gain.

  **Honest Note: What This Can't Reproduce**
  You'll need to supply the metaphysics verbally. The game makes non-striving look like a *smart calculation* (utilitarianism). Tranquilism is deeper—it claims the *will to strive* is the error, not just the miscalculation. The game makes it look like "don't strive because it costs points." The view is "don't strive because the self that wants points is the problem." You have to bridge that gap in the discussion; the mechanic alone just teaches risk aversion.

  **Heads-Up: What Will Go Wrong**
  First time you run this, two things usually happen:
  1.  **Collusion:** They might realize halfway through that if everyone refuses the cards, the "social pressure" drops. Or conversely, one aggressive student will take all the cards and try to win by sheer volume, then complain the math is rigged when they lose. Prepare for that pushback—it's actually a great teaching moment about how the view *looks* rigged from the inside of craving.
  2.  **The Fidget Penalty:** Students will forget the stillness rule. You'll have to enforce it gently, or it breaks the "restlessness" metaphor. If you don't enforce it, the "cost of striving" feels abstract.

  Let me know if you want the score sheet template. I can snap a pic next time I'm in the office.

  Best,

  J.

  *(oops, sent too early—just wanted to add: make sure you emphasize the "forfeit" rule clearly. If they think they can keep the points after dropping the card, the whole thing collapses.)*
