answer: |-
  ### 1. The Exam Question

  **Question 1: The Nature of *Nomisma* and the Unnaturalness of *Tokos***

  In *Nicomachean Ethics* V.5, Aristotle offers two seemingly competing accounts of money. First, he writes that money is introduced so commodities "can be compared in some way... money constitutes in a manner a middle term... a measure of all things." Second, he claims the real standard is "demand" (*chreia*), and that money is called *nomisma* because it exists "not by nature but by custom" (*nomos*). Later, in *Politics* I, he insists money is "nothing by nature" yet condemns usury (*tokos*) as "most contrary to nature."

  Answer the following in a unified essay:

  (a) Using the distinction between a **shadow-measure** (which records pre-existing exchange proportions) and a **stamp-measure** (which creates commensurability by convention), analyze the two *NE* V.5 claims above. Does Aristotle treat money primarily as a shadow or a stamp, and where does the text resist a clean classification?

  (b) Explain the tension between calling money "nothing by nature" and calling usury "contrary to nature." Does deploying the shadow/stamp distinction allow Aristotle to resolve this contradiction without abandoning his claim that money is conventional? What does he sacrifice if he succeeds?

  (c) Consider the city of Oinoe, which uses a grain-based tally system ("days") rather than silver. A lender transfers 100 days to a shipowner on condition of receiving 110 days back. Is this interest-bearing tally more, less, or equally contrary to nature compared to silver usury? Use your answer to determine whether Aristotle's target is the material of currency, its conventional status, or the practice of *chrematistike* itself.

  ***

  ### 2. Model Answer

  Aristotle's account of money oscillates between functional necessity and conventional arbitrariness. In *NE* V.5, the claim that money allows commodities to be compared suggests it acts as a **shadow-measure**: exchange proportions (houses to shoes) exist prior to coinage, grounded in the reciprocal need of the participants. Money merely records these ratios. However, Aristotle immediately undercuts this by stating demand (*chreia*) is the true standard, and money is *nomisma*—binding only by custom (*nomos*), not nature (*physei*). This suggests a **stamp-measure**: without the civic agreement to treat silver as a unit, commensurability collapses. Aristotle needs money to be a shadow to ensure exchange is just (reflecting real value), but a stamp to explain why silver works (conventional utility). The text resists classification because Aristotle treats money as a conventional stamp tasked with tracking a natural shadow.

  This hybrid status generates the *Politics* I tension. If money is "nothing by nature," it lacks a *telos* inherent to its substance; it is purely instrumental. Consequently, labeling usury "contrary to nature" appears empty. If the unit is arbitrary, why is breeding it unnatural? The shadow/stamp distinction resolves this only if we distinguish between money's *substance* and its *function*. Aristotle can argue that while the material (silver, tally) is conventional (stamp), the *purpose* of money is natural (shadow): to measure demand for the sake of household sufficiency (*oikonomia*). Usury is unnatural not because it violates the material nature of silver, but because it violates the functional nature of money as a measure. Money is meant to facilitate exchange of goods to meet need; usury treats the measure itself as the source of gain.

  The cost of this resolution is significant. Aristotle must admit that "nature" here refers not to physical properties but to proper function. He sacrifices a robust material naturalism for a functional teleology. If money is purely conventional in substance, the "unnatural" charge rests entirely on the user's intent rather than the object's properties. This makes the condemnation of usury dependent on the distinction between *oikonomia* (acquisition for use) and *chrematistike* (acquisition for unlimited gain). The tension remains if one asks why a conventional tool cannot conventionally be used for interest. Aristotle's answer must be that such use destroys the tool's capacity to measure demand accurately, rendering it useless for the city.

  The Oinoe case clarifies this target. In Oinoe, the "day" is a tally of grain needed for survival—a direct representation of *chreia*. Charging interest (100 days to 110) is **equally contrary to nature** as silver usury, perhaps more so. Because the tally is explicitly defined by human need (one day's grain), inflating the tally directly falsifies the measure of need. Silver obscures this because its material value is detached from immediate consumption; the tally exposes the absurdity of making "need" breed.

  This demonstrates that Aristotle's target is neither the material (silver vs. grain) nor the convention (coin vs. tally), but the **practice** of *chrematistike* detached from *chreia*. Whether the currency is a shadow or a stamp matters less than whether it serves the natural end of the household. In Oinoe, the lender treats a measure of survival as a stock for accumulation. This violates the natural limit imposed by human need. Thus, *tokos* is hated because it separates gain from the satisfaction of demand. Aristotle saves his argument by locating the "nature" of money in its social function (*chreia*) rather than its physical or legal status. If he failed to do this, his critique of usury would collapse into a mere preference for barter, ignoring the necessity of a common measure in any complex polis.

  ***

  ### 3. Marking Scheme (Out of 25)

  **Part (a): NE V.5 Analysis (8 marks)**
  *   **A (7–8):** Identifies the tension: "measure of all things" implies Shadow (pre-existing value), while "*nomos*/custom" implies Stamp (conventional creation). Argues Aristotle needs both: convention to function, shadow to justify justice.
  *   **B (5–6):** Correctly defines Shadow/Stamp and maps them to the quotes but treats them as separate options rather than a tension Aristotle holds simultaneously.
  *   **C (0–4):** Misidentifies the quotes or defines the distinction incorrectly.
  *   *Common Error:* Claiming Aristotle simply says money is a Stamp. This ignores the "measure of superior/inferior value" quote which implies objective comparability.

  **Part (b): The Nature/Convention Tension (9 marks)**
  *   **A (8–9):** Resolves the tension via *telos*/function. Money is conventional in substance (Stamp) but natural in purpose (Shadow/*chreia*). Usury violates the purpose. Notes the cost: "nature" becomes functional, not material.
  *   **B (6–7):** Identifies the contradiction clearly but resolves it by saying "Aristotle hates getting rich," missing the structural argument about money's *function*. Or resolves it by claiming silver has no nature, ignoring the "unnatural" claim.
  *   **C (0–5):** Restates the contradiction without resolving it, or claims Aristotle is simply inconsistent.
  *   *Common Error:* Arguing that Aristotle thinks silver *is* natural. The text explicitly says "nothing by nature."

  **Part (c): Oinoe Case & Target (8 marks)**
  *   **A (7–8):** Argues Oinoe interest is equally (or more) unnatural. Concludes the target is the *practice* (*chrematistike*) of separating gain from need, not the material. Uses the tally's link to *chreia* to show why falsifying the measure is the core issue.
  *   **B (5–6):** Says Oinoe is less unnatural because grain is "natural," missing that the *tally* is still conventional money. Or says it's equally unnatural but fails to explain what this reveals about Aristotle's target.
  *   **C (0–4):** Focuses on the material difference (grain vs. silver) as the deciding factor.
  *   *Common Error:* Claiming Oinoe is better because grain is "real." The prompt specifies it is a *tally* system ("days"), making it currency, not barter.

  **Overall Coherence & Greek Terminology (Deductions applied to total)**
  *   **A Grade:** Seamless integration of *chreia*, *nomisma*, *tokos*, *chrematistike*. Argument flows logically from (a) to (c).
  *   **B Grade:** Terms used correctly but mechanically (box-ticking). Argument jumps between sections.
  *   *Note:* Do not award extra marks for secondary knowledge. Penalize heavily if the student claims Aristotle bans *all* interest regardless of context (he bans *tokos* on money, not necessarily all profit).
