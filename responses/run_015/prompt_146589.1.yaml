      *   *Sentence 7:* "Representationalists like Michael Tye agree with disjunctivists that there is no common mental factor." -> *Major Error.* Representationalism *relies* on a common factor (representational content) to explain the similarity between veridical and non-veridical cases. Tye argues the content is the same, the truth conditions differ.
      *   *Sentence 8:* "Therefore, disjunctivism fails... reject the view in favor of representationalism." -> *Non-sequitur based on the error in Sentence 7.* If Tye actually posits a common factor, he doesn't solve the problem the student thinks he does (or rather, the student's reasoning for preferring him is based on a false premise about his view).

