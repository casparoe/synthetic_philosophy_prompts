      *   *Sentence 4 (Case 1):* "In the veridical hallucination case, the disjunctivist should say this is actually veridical perception, because the apple is really there..." -> *Incorrect.* Disjunctivists emphasize the *causal* connection or the fact that the world must constitute the experience. Mere coincidence doesn't make it veridical perception (McDowell/Martin would call this a hallucination that happens to match the world).
      *   *Sentence 5 (Case 2):* "In the filtered case, the subject is having an illusion, because the experience is of orange and the apple is red..." -> *Plausible/Debatable but acceptable.* If the property manifested is orange, but the object is red, it's non-veridical.
