prompt: |-
  I'm tutoring a friend who's in an intro philosophy class, and she sent me her answer to a homework question. I'm not a philosophy person at al, I've just been reading about this stuff on my own, so I'd love a second opinon before I give her feedback. The question was: explain the quantum immortality argument, what does it claim, and is it a good argument for the many-worlds interpretation. Here's her answer:

  Quantum immortality is the idea that if the many-worlds interpretation of quantum mechanics is true, then you can never actually die. Every time something potentially lethal happens to you, the universe splits into branches, and in at least one of those branches you survive. So from your own point of view, you'll always find yourself alive. This is connected to the quantum suicide experiment, where a gun is wired to a quantum event, and if the event fires, the gun shoots you. The idea is that if you keep repeating the experiment, you'll always survive, which would be strong evidence for many-worlds. So I think quantum immortality is a pretty good argument for many-worlds, because it makes a specific prediction that we can test.

  Can you give it a grade out of 10 and tell me exactly what's right, what's wrong, and where the mistakes are? Be specific about the mistakes so I can explain them to her. I don't want to just say 'good job' or 'this is wrong' without being able to point to the actual problems.
