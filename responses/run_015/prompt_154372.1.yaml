answer: |-
  You ask whether the embryo or the gametes are essential, but this distinction collapses under scrutiny: the embryo is nothing over and above the organized union of those specific gametes. I concede that IVF introduces a selection process that feels contingent, as if the clinic chose "you" from a lineup of siblings, but this is an epistemic illusion regarding the mechanics of conception, not a metaphysical loophole. When you imagine the clinic implanting your brother's embryo first, you are imagining a scenario where *he* is born earlier, not one where *you* are born earlier. It is easy to confuse the two because you share a genetic neighborhood, but metaphysical possibility is not governed by similarity. If that specific zygote had been implanted first, your brother would occupy the temporal slot you now hold, and you—dependent on the distinct material union that actually formed you—would likely not have existed at all, or would have arrived later. The order of implantation is a contingent historical fact about your lives, but the material cause of your conception is a necessary condition of your identity.

  So, what is essential? It is the specific zygote formed by that particular sperm and egg. To suggest you could have originated from your brother's gametes is to suggest you could have been someone else, which is a contradiction in terms. Identity is not a matter of degree or genetic compatibility; it is a matter of numerical distinctness rooted in origin. You and your brother are necessarily distinct not merely because you are different embryos, but because those embryos are constituted by different biological origins. The intuition that "it could have been me" is a psychological projection of similarity onto a metaphysical boundary that is far more rigid than human convenience. You are tied to your origin not by law, but by the very logic of what it means to be *you*.
