      *   *Two devices:* If they agree, it looks like corroboration, but if both are self-certifying and unconnected, it's just double circularity.
      *   *Verdict:* It's a valid instance of the "epistemic circularity" worry, distinct from the inductive bootstrapping of the card case. It's arguably *worse* for the externalist because it removes the inductive step.

  5.  **Address the "Denying Closure" Claim:**

      *   The handout says denying closure is the *only* reply.
      *   *Reality:* Many externalists (Goldman, Greco) try to keep closure. They argue the inference doesn't transmit justification (Wright's transmission failure) or that safety/sensitivity conditions fail for the conclusion.
      *   *Cost:* Denying closure is expensive (Dretske/Nozick). Keeping it requires tweaking the theory of justification (e.g., proper functionalism, virtue epistemology).
      *   *Internalist Conclusion:* The handout's leap to "therefore Internalism" is unsupported. Internalism has its own closure/circularity issues (Cartesian skepticism).

  6.  **Drafting the Response (incorporating Epistemic Status Flags):**

