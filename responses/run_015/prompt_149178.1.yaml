prompt: |-
  hi -- i do the secretariat work for a small professional college (around 900 members) that puts out position statements. Each one answers a block of four to eight yes/no items that are all about the same topic, members are expected to act on them, and they get quoted back at us in complaints and now and then in disciplinary hearings. Four to six of these a year, half-day meeting, 12-15 people (mostly clinicians plus two lay members), and I get about one afternoon to prep. It has to run on a shared spreadsheet and a show of hands, and the chair is a clinician who will read about one page of instructions and no more.

  Last year we published one where a clear majority backed item 2, a clear majority backed item 3, and a clear majority backed item 5, and it turned out that no single member had actually voted for all three — someone complained that the statement tells them to do two incompatible things, and they were right. Someone on council muttered something about "the discursive dilemma" and said we should vote on the reasons rather than the conclusions, which sounds right but I don't know how to actually do that on a Tuesday afternoon with fifteen people.

  So: give me a procedure I can run, in order, for one statement.

  Specifically I need: how to break a topic into votable propositions before the meeting and lock that agenda before anyone discusses the substance (and what to do when someone proposes a new item at 3pm anyway); how to make sure the conditional, normative, "if the facts are like this then we should do X" item gets its own explicit vote instead of hiding inside the other items; how to decide which items get voted on and which are just read off the ones that passed, and what to do when the headline recommendation isn't entailed by anything the committee actually accepted and also isn't contradicted by it; whether it's safe that our bylaws require a two-thirds supermajority on some items and a plain majority on others inside the same statement; what I do with a ballot that's internally inconsistent, or with abstentions and "can't say" answers; and at which point the procedure stops and says this is a values call, go ask a person. I also need the output written up so that an outside person, a year later, can rerun it from the record and get the same answer — council wants an audit trail, not just a decision.

  Please also be blunt about where this misfires. Our items are English sentences with "should" in them, sometimes with an implicit "all else being equal", and half the time the committee insists two items aren't inconsistent when they plainly are. I'd rather hand council a list of known holes than have them find one after publication.

  Then run the procedure on these three:

  (1) A screening programme. Items: "the test's false positive rate is acceptable"; "if the false positive rate is acceptable, the college should endorse routine screening"; "the college should endorse routine screening". Split is 4 members yes/yes/yes, 3 yes/no/no, 4 no/yes/no.

  (2) The one I know they'll hate. A public statement on a staffing crisis: 9 of 13 badly want to say something, but the two supporting items — "workforce planning is within the college's remit" and "the data on staffing levels are solid enough to make a public claim" — each fail by a single vote, and a standing statement from 2021 says the college doesn't comment on workforce issues.

  (3) Two items that may or may not clash: "clinicians should not prescribe X off-label" and "clinicians should exercise their own judgement where the evidence is thin".

  Tell me what comes out of each, including the case where the answer is one the chair is going to fight me on, and say plainly what the procedure can't do.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Analyze the User and Context:**
      *   **Role:** Secretariat for a small professional college (~900 members).
      *   **Task:** Manage the production of position statements.
      *   **Constraints:**
          *   4-6 statements/year.
          *   Half-day meeting, 12-15 people (mostly clinicians, 2 lay).
          *   Prep time: ~1 afternoon.
          *   Tools: Shared spreadsheet, show of hands.
          *   Chair: Clinician, will read max 1 page of instructions.
          *   Stakes: High. Statements are used in complaints/disciplinary hearings. Members must act on them.
          *   Problem: Logical inconsistency (Discursive Dilemma/Doctrinal Paradox). Last year, majority supported A, B, and C individually, but no one supported A+B+C together.
          *   Requirement: Audit trail (reproducible results), clear procedure, handling of edge cases (inconsistencies, abstentions, bylaws).
      *   **Tone:** Blunt, practical, procedural, acknowledging limitations.

  2.  **Deconstruct the Core Problem (The Discursive Dilemma):**
      *   The "Discursive Dilemma" (or Doctrinal Paradox) occurs when a group votes on premises (reasons) and a conclusion separately. Majorities can support the premises and the conclusion individually, but the logical connection fails, or the combination of premises supporting the conclusion isn't held by a majority.
      *   *Solution Strategy:* Premise-Based Procedure (PBP) vs. Conclusion-Based Procedure (CBP).
      *   *User's Constraint:* They need to vote on "should" statements (normative conclusions).
      *   *Best Fit:* A hybrid approach that forces logical dependency checking *before* final adoption. The "Premise-Based" approach is generally more robust for consistency, but the "Conclusion-Based" is politically easier. Given the risk of disciplinary hearings, *consistency* is paramount. I need to design a procedure that forces the committee to acknowledge the logical structure.

  3.  **Drafting the Procedure (The "Secretariat Protocol"):**
      *   *Goal:* Simple enough for a busy clinician chair, robust enough for an audit.
      *   *Phase 1: Pre-Meeting (The Logic Lock).*
          *   Need to define the "Logic Map."
          *   Distinguish Premises (Facts/Conditions) from Conclusions (Actions).
          *   Lock the agenda.
      *   *Phase 2: The Meeting (The Voting).*
          *   Order matters: Premises first, then Conditionals, then Conclusions.
          *   Handling the "New Item at 3pm" problem (Strict gatekeeping).
          *   Handling the "Hidden Conditional" (Make it explicit).
      *   *Phase 3: Post-Vote (The Consistency Check).*
          *   The "Logic Check" step.
          *   What if the Conclusion fails but Premises pass? (Recommendation: Don't publish).
          *   What if Conclusion passes but Premises fail? (Dangerous. Flag it).
      *   *Phase 4: The Audit Trail.*
          *   Record individual votes (anonymous but countable) or at least the matrix.
          *   Spreadsheet structure.

  4.  **Addressing Specific User Questions:**
      *   *Breaking topics into propositions:* Secretariat drafts, Chair approves *structure* not content before meeting.
      *   *New items at 3pm:* "Motion to Amend Agenda" requires 2/3 majority + Logic Check. Usually, kill it.
      *   *Conditional/Normative items:* Vote on the conditional *before* the conclusion.
      *   *Headline recommendation not entailed:* Flag as "Policy Decision" (Values call), not "Evidence Decision."
      *   *Mixed Supermajority/Majority:* Risky. Keep it simple. If one fails, the chain breaks.
      *   *Inconsistent Ballots/Abstentions:* Treat abstentions as "Not Counted for Quorum on that item." Inconsistent ballots (Yes to A, Yes to B, No to A&B) -> The procedure catches this in the Logic Check, not the ballot counting.
      *   *Values Call:* When logic doesn't dictate the outcome (e.g., risk tolerance). Stop procedure, Chair decides based on consensus.
      *   *Blunt Misfire Analysis:* People lie about consistency. Time pressure.

  5.  **Running the Procedure on the Three Scenarios:**

      *   **Scenario 1: Screening Programme.**
          *   Items: P1 (FP rate acceptable), P2 (If P1 -> Endorse), C (Endorse).
          *   Votes: 4 (Y/Y/Y), 3 (Y/N/N), 4 (N/Y/N).
          *   *Analysis:*
              *   P1 Yes: 7/11. (Pass)
              *   P2 Yes: 8/11. (Pass)
              *   C Yes: 4/11. (Fail)
              *   *Dilemma:* Logic says if P1 and P2 pass, C *should* pass. But C failed.
              *   *Outcome:* Inconsistent. Cannot publish as an evidence-based statement. Must be a "Values Call" or re-drafted.
              *   *Audit:* Shows the disconnect.

      *   **Scenario 2: Staffing Crisis.**
          *   Items: P1 (Remit), P2 (Data Solid), C (Public Statement).
          *   Votes: 9 want C. P1 fails (6/13), P2 fails (6/13). Old rule (No comment).
          *   *Analysis:* Conclusion has support (9/13), Premises do not.
          *   *Outcome:* Procedurally, this is a "Conclusion-Based" victory but "Premise-Based" failure. Given the disciplinary risk, publishing C without P1/P2 is dangerous. It contradicts the 2021 standing statement.
          *   *Recommendation:* Do not publish. Or publish as "Opinion of Council" not "College Position."

      *   **Scenario 3: Off-label vs. Judgement.**
          *   Items: C1 (No X off-label), C2 (Exercise judgement where evidence thin).
          *   *Analysis:* Potential conflict. X might be "evidence thin."
          *   *Outcome:* Need a tie-breaker premise: "Is X a case where evidence is thin?" If Yes, C2 overrides C1. If No, C1 stands.
          *   *Procedure:* Add a clarifying premise. If not added, flag as "Potential Conflict."

  6.  **Refining the Output:**
      *   *Tone:* Professional, direct, slightly cynical (matching the user's "blunt" request).
      *   *Format:* Clear headings, step-by-step instructions, then the scenario analysis.
      *   *The "One Page" Instruction:* I need to summarize the complex logic into something the Chair can actually read.
      *   *The Spreadsheet:* Describe the columns needed for the audit trail.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is this too complex for a half-day meeting?
      *   *Fix:* Emphasize the *Pre-Meeting* work. The Secretariat does the logic mapping. The meeting just validates.
      *   *Critique:* What about the "Two-Thirds vs. Majority" bylaw issue?
      *   *Fix:* Advise that if the Conclusion needs 2/3 but the Premise only needs 1/2, and the Premise fails, the Conclusion dies. If Premise passes but Conclusion fails, it dies. The stricter threshold governs the chain.
      *   *Critique:* How to handle the "Values Call"?
      *   *Fix:* Define it clearly. When logic runs out, politics begins. Record it as such.

  8.  **Final Polish:** Check against all constraints in the prompt (audit trail, 3pm agenda change, conditional votes, etc.). Ensure the "Discursive Dilemma" is explicitly addressed by the Premise-Based Procedure. (Decided to recommend a *Premise-Based Procedure* as the default because it protects members from being told to do incompatible things, which is the user's main pain point).

      *Wait, one nuance:* The user said "vote on the reasons rather than the conclusions." This is the Premise-Based Procedure (PBP). I will structure the protocol around PBP but allow for a "Conclusion Override" if explicitly marked as a Values Call.

      *Scenario 1 Calculation Check:*
      Total voters = 4 + 3 + 4 = 11.
      P1 (FP Acceptable): 4 Yes + 3 Yes = 7. (Majority 6). Pass.
      P2 (If Acceptable -> Endorse): 4 Yes + 4 Yes = 8. (Majority 6). Pass.
      C (Endorse): 4 Yes. (Majority 6). Fail.
      *Result:* Logical inconsistency. P1 & P2 imply C, but C failed.
      *Why?* The 4 "No/Yes/No" voters think FP is *not* acceptable, but *if* it were, they would endorse. The 3 "Yes/No/No" think FP *is* acceptable, but shouldn't endorse anyway.
      *Wait, re-reading the split:*
      Group A (4): Yes/Yes/Yes.
      Group B (3): Yes/No/No. (Think FP ok, but shouldn't endorse).
      Group C (4): No/Yes/No. (Think FP not ok, but if it were, would endorse).
      *Vote on P1:* A(4) + B(3) = 7 Yes. Pass.
      *Vote on P2:* A(4) + C(4) = 8 Yes. Pass.
      *Vote on C:* A(4) = 4 Yes. Fail.
      *Logic:* If P1 is True and P2 is True, C *must* be True.
      *Collective:* P1=True, P2=True, C=False.
      *Verdict:* Contradiction. Cannot issue statement.

      *Scenario 2 Calculation Check:*
      Total 13. Need Majority (7).
      Want C: 9 people.
      P1 (Remit): Fails by 1 vote (6 Yes).
      P2 (Data): Fails by 1 vote (6 Yes).
      *Verdict:* Premises fail. Conclusion technically passes (9/13), but lacks logical foundation. High risk.

      *Scenario 3 Calculation Check:*
      C1: No X.
      C2: Use judgement if evidence thin.
      *Verdict:* Ambiguity. Needs a bridging premise: "Is evidence for X thin?"

      *Okay, ready to write.*
answer: |-
  Here is a procedure designed for your constraints: low prep time, clinician chair, high stakes, and a need for an audit trail. It prioritizes **logical consistency** over political expediency to protect your members from disciplinary complaints.

  ### Part 1: The Protocol (The "Logic-First" Procedure)

  This is a **Premise-Based Procedure (PBP)**. You vote on the *reasons* first. The *conclusion* is derived from the reasons, not voted on independently unless it is a pure values call.

  #### A. Pre-Meeting (Secretariat Work)
  **1. The Logic Map:**
  Before the meeting, you draft the items not as a list, but as a flow.
  *   **P-Items (Premises):** Facts or conditions (e.g., "The data is solid," "This is within remit").
  *   **C-Items (Conditionals):** Normative bridges (e.g., "If P1 and P2, then we should do X").
  *   **D-Items (Decisions):** The final action (e.g., "We endorse X").
  *   **Constraint:** You must tag each item in the agenda packet as **[P]**, **[C]**, or **[D]**.

  **2. The Lock:**
  The Chair approves the *structure* of the Logic Map 48 hours prior. No new substantive items can be added during the meeting without a "Logic Impact Assessment" (see below).

  **3. The Spreadsheet:**
  Create a sheet with columns: `Member ID`, `Item 1 (P)`, `Item 2 (C)`, `Item 3 (D)`. Rows are members. This allows you to check for individual inconsistency later.

  #### B. The Meeting (The Chair's Script)
  *Give the Chair this one-pager. Do not add to it.*

  > **Chair's Cheat Sheet for Voting**
  > 1.  **Order:** We vote on **Premises** (Facts) first, then **Conditionals** (Rules), then **Decisions** (Actions).
  > 2.  **New Items:** If someone proposes a new item after 3pm, it requires a 2/3 vote to *even discuss*. If passed, you (Secretariat) must confirm it doesn't break the Logic Map. If it does, it is ruled out of order.
  > 3.  **Conditionals:** If an item says "If X, then Y," it gets its own vote. We do not assume it.
  > 4.  **Inconsistency:** If we pass the Premises but fail the Decision, the Decision is **rejected**. We do not publish contradictory statements.
  > 5.  **Values Call:** If the Premises pass but the Decision fails (or vice versa), and we still want to act, we must declare it a "Values Call." This is recorded in the minutes as "Policy override of Logic."
  > 6.  **Audit:** We record the count for every item. Abstentions are recorded as "Present but Not Voting."

  #### C. Post-Vote (The Consistency Check)
  Before the statement is published, you run the **Audit Script**:
  1.  **Entailment Check:** Did the passed Premises logically force the Decision?
      *   If Yes (Premises Pass, Decision Pass): **Publish.**
      *   If No (Premises Pass, Decision Fail): **Kill Statement.** (You cannot tell members to do X if you didn't agree the conditions for X were met).
      *   If No (Premises Fail, Decision Pass): **Flag as "Values Call".** (High risk. Requires explicit minute entry that this is policy, not evidence).
  2.  **Individual Consistency:** Scan the spreadsheet. Did any member vote Yes on P1, Yes on C1 (If P1 then D1), but No on D1?
      *   If >20% of the committee did this, flag the statement as "Internally Contested."
  3.  **Bylaw Thresholds:** If P1 requires 50% and D1 requires 66%, and P1 gets 60% but D1 gets 60%, **D1 Fails.** The strictest threshold in the logical chain applies to the final output.

  #### D. Where This Misfires (Blunt Truths)
  *   **The "Stealth Values" Problem:** Clinicians often disguise value judgments ("We should care about cost") as facts ("Cost is high"). This procedure exposes that fight. It will slow the meeting down when someone realizes they are arguing about morals, not medicine.
  *   **The 3pm Rebellion:** Someone will try to add a "compromise" item late in the day. Your rule is: **If it changes the Logic Map, it dies.** This will cause friction. Stand firm.
  *   **The "Can't Say" Vote:** If a member abstains on a Premise, they are logically barred from voting on the Dependent Decision. Count them as "No" for the purpose of quorum on that chain.
  *   **The Audit Trail:** This system produces a record that shows *why* a statement was killed. Council may hate this. Your defense is: "This prevents the disciplinary contradiction we had last year."

  ---

  ### Part 2: Running the Procedure on Your Scenarios

  Here is the output of the protocol applied to your three cases.

  #### Scenario 1: The Screening Programme
  **Items:**
  *   P1: "The test's false positive rate is acceptable." (Premise)
  *   C1: "If the false positive rate is acceptable, the college should endorse routine screening." (Conditional)
  *   D1: "The college should endorse routine screening." (Decision)

  **The Votes (N=11):**
  *   Group A (4): Yes / Yes / Yes
  *   Group B (3): Yes / No / No
  *   Group C (4): No / Yes / No

  **The Tally:**
  *   P1 (Acceptable?): 7 Yes, 4 No. **(PASS)**
  *   C1 (If Acceptable -> Endorse?): 8 Yes, 3 No. **(PASS)**
  *   D1 (Endorse?): 4 Yes, 7 No. **(FAIL)**

  **The Audit Result:**
  *   **Logical Status:** **CONTRADICTION.**
  *   **Reasoning:** The collective view is "Rate is Acceptable" AND "If Acceptable, Endorse." Therefore, the collective view *must* be "Endorse." But the vote on "Endorse" failed.
  *   **Procedure Outcome:** **Statement Killed.**
  *   **Why:** You cannot publish D1. It is not supported by the logic the committee just affirmed. If you publish it, the 7 members who voted against D1 can claim the statement does not represent the college's logical position.
  *   **Chair Fight:** The Chair will want to publish D1 because "4 people support it and it's a good idea."
  *   **Your Counter:** "If we publish this, and a member is disciplined for *not* screening, they can show the minutes where we voted that the premises for screening were met but the screening itself was rejected. We lose the hearing."
  *   **Fix:** You must re-draft. Either lower the threshold for "Acceptable" (change P1) or remove the Conditional (C1) and make it a pure Values Call (see Scenario 2).

  #### Scenario 2: The Staffing Crisis (The One They'll Hate)
  **Items:**
  *   P1: "Workforce planning is within the college's remit." (Premise)
  *   P2: "The data on staffing levels are solid enough to make a public claim." (Premise)
  *   D1: "The college should issue a public statement on the crisis." (Decision)
  *   *Constraint:* 2021 Standing Statement says "No comment on workforce."

  **The Votes (N=13):**
  *   D1 Support: 9 Members want to say something.
  *   P1 Vote: 6 Yes, 7 No. **(FAIL by 1)**
  *   P2 Vote: 6 Yes, 7 No. **(FAIL by 1)**

  **The Audit Result:**
  *   **Logical Status:** **UNFOUNDED CONCLUSION.**
  *   **Reasoning:** The Decision (D1) has a majority (9/13), but the necessary Premises (P1, P2) do not.
  *   **Procedure Outcome:** **Flag as "Values Call" OR Kill.**
  *   **Risk:** High. You are overriding a 2021 Standing Statement without establishing the factual basis (P1/P2) to justify the override.
  *   **Recommendation:** Do not publish as a "Position Statement." Publish as a "Council Opinion."
  *   **Why:** A Position Statement implies evidentiary consensus. You have none. You have political will.
  *   **Minute Entry Required:** "Council acknowledges P1 and P2 did not meet evidentiary thresholds. Council invokes Values Call to proceed with D1 based on member pressure, overriding 2021 Standing Statement."
  *   **Chair Fight:** The Chair will say "9 out of 13 is a clear mandate."
  *   **Your Counter:** "A mandate to act without a mandate on *why* we can act is negligence. If the data (P2) is later proven wrong, the College is liable for spreading misinformation. We must record that this is political, not factual."

  #### Scenario 3: Off-Label vs. Judgement
  **Items:**
  *   D1: "Clinicians should not prescribe X off-label."
  *   D2: "Clinicians should exercise their own judgement where the evidence is thin."

  **The Audit Result:**
  *   **Logical Status:** **AMBIGUOUS / POTENTIAL CONFLICT.**
  *   **Reasoning:** These are two Decisions without a bridging Premise. They clash if "Prescribing X" is a case of "Evidence is thin."
  *   **Procedure Outcome:** **Request Clarification Premise.**
  *   **Action:** You cannot vote on these as a pair. You must insert P3: "The evidence regarding X is thin."
      *   If P3 Passes + D2 Passes -> D1 is effectively suspended for X.
      *   If P3 Fails + D1 Passes -> D2 does not apply to X.
  *   **If they refuse the new vote:** You must publish a **Qualifier**.
  *   **Drafting Fix:** "Clinicians should not prescribe X off-label, *except* in cases where evidence is thin and clinical judgement dictates necessity."
  *   **Chair Fight:** The Chair will say "Clinicians know how to read."
  *   **Your Counter:** "Complainants do not read nuance. They read 'Do not prescribe X'. If a clinician prescribes X using judgement, they are in breach of D1 on paper. We must merge the items or one becomes a trap."

  ### Part 3: Summary of Risks & "Values Calls"

  **When to stop the procedure and ask a person:**
  The procedure stops when **Logic yields no unique answer.**
  *   *Example:* P1 passes, C1 passes, D1 fails. Logic says D1 *should* pass. It didn't.
  *   *Action:* This is a Values Call. The Committee is saying, "We know the logic says Yes, but we feel No."
  *   *Requirement:* The Chair must explicitly state: "We are overriding the logical entailment." This goes in the minutes.
  *   *Safety:* This is safe *only if* recorded. If not recorded, it is a trap for members.

  **Mixed Supermajorities:**
  *   *Rule:* The "Weakest Link" principle. If P1 needs 50% and D1 needs 66%, and P1 gets 60% but D1 gets 60%, **the Statement Fails.**
  *   *Why:* You cannot build a 66% requirement on a 50% foundation. The audit trail will show the foundation was weaker than the house.

  **Inconsistent Ballots:**
  *   *Handling:* Do not reject the ballot. Reject the *Statement*.
  *   *Why:* If 3 members vote Yes/Yes/No (Inconsistent), it suggests the items are confusing. If 8 members do it, the items are broken.
  *   *Audit:* "X% of voters held logically inconsistent positions. Statement validity compromised."

  **Final Advice for the Secretariat:**
  Your job is not to get the statement published. Your job is to ensure that if the statement is published, it does not get your members struck off.
  *   If the Logic Map breaks, **do not fix it yourself.** Send it back to Council with the "Contradiction Report."
  *   Let them vote to ignore the contradiction. That is their risk, not yours.
  *   Your spreadsheet is your shield. If they sue, you show the sheet: "We told you the logic didn't hold. You published anyway."

  This procedure will make meetings more frustrating. It will kill about 30% of your draft statements. It will save you from the disciplinary hearing you had last year.
