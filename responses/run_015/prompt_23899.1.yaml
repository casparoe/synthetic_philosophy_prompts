answer: |-
  ### Essay Question (90 Minutes)

  **Question:**
  Lexical Threshold Negative Utilitarianism (LTNU) posits that suffering above a certain intensity lexically trumps any amount of pleasure, prohibiting trade-offs. However, LTNU also requires the aggregation of suffering to determine the "total" to be minimized. Evaluate the following claim: *LTNU is incoherent because it requires pleasure and pain to be commensurable for aggregation, yet incommensurable to sustain the lexical threshold.* In your answer, discuss whether a discontinuous value function can resolve this tension without collapsing into standard Negative Utilitarianism or abandoning welfarism.

  ***

  ### Model Answer (Approx. 600 words)

  The charge of incoherence against Lexical Threshold Negative Utilitarianism (LTNU) targets the structural architecture of its value theory. To minimize *total* suffering, suffering must be cardinally measurable and aggregatable. To assert that extreme suffering lexically trumps *any* pleasure, the relationship between positive and negative welfare must resist standard trade-offs. The critic argues this demands pleasure and pain be simultaneously commensurable (for aggregation) and incommensurable (for lexical priority). This essay argues that while this presents a significant challenge, LTNU can remain coherent by adopting a discontinuous single scale, though this incurs epistemic costs.

  First, we must clarify the aggregation requirement. LTNU is a welfarist consequentialist view; it demands we choose the state of affairs with the least weighted suffering. This implies that units of suffering can be summed. If suffering is not cardinally measurable on a consistent scale, "total suffering" is meaningless. However, this aggregation need only apply *intra-domain* (pain vs. pain). It does not strictly require pain and pleasure to share a *common* metric, only that pain is measurable against itself. Therefore, the claim that aggregation requires full commensurability between positive and negative welfare is false. One can aggregate pain without being able to equate one unit of pain to $x$ units of pleasure.

  The deeper tension lies in justifying the lexical threshold without a common metric. If pain and pleasure are entirely incommensurable (like comparing length to weight), asserting that pain *always* trumps pleasure appears arbitrary. Why does the "pain scale" dominate the "pleasure scale"? To avoid arbitrariness, LTNU proponents typically argue for a **discontinuous single scale**. On this view, pleasure and pain are on one continuum, but there is a "gap" or discontinuity at the zero point or at a specific threshold of intensity.

  This resolves the logical incoherence. A discontinuous function allows for aggregation within the negative domain while maintaining that no amount of positive value can bridge the gap to offset severe negative value. This preserves the lexical threshold without requiring full Archimedean commensurability (where any amount of one good can be traded for enough of another). Thus, LTNU does not collapse into standard Negative Utilitarianism (which often implies a continuous scale where extreme pain is just "very high negative numbers" potentially tradeable against massive pleasure) nor does it abandon welfarism.

  However, this defense introduces a severe epistemic problem. If the scale is discontinuous, identifying the precise threshold becomes morally critical yet metaphysically obscure. If a headache is below the threshold and a migraine is above it, LTNU demands we prioritize the migraine regardless of how many headaches exist. If the threshold is a sharp line on a continuous phenomenological experience, the view risks absurdity (the "sorites" problem). If the threshold is vague, the lexical priority becomes action-guiding only in clear cases, weakening its utility as a strict ethical framework.

  Furthermore, the "discontinuous scale" risks smuggling in a non-welfarist deontological constraint. If the reason severe pain cannot be traded is not because it is "more negative" but because it possesses a distinct *quality* that forbids trade-off, the view begins to resemble a rights-based constraint on suffering rather than pure utilitarian aggregation. This challenges the "Utilitarian" label of LTNU.

  In conclusion, LTNU is not logically incoherent. It can sustain both aggregation and lexicality by positing a discontinuous value function where negative welfare has a different structural weight than positive welfare. However, this move saves the theory from logical contradiction only by exposing it to epistemic instability regarding the threshold and potential conceptual drift toward deontology. The tension is not between commensurability and aggregation, but between the mathematical coherence of discontinuity and the practical application of a sharp lexical cliff.

  ***

  ### Marking Scheme

  **Total Marks: 100**

  #### **A-Grade (75-100): The "Structural Analyst"**
  *   **Core Insight:** Explicitly identifies that aggregation only requires *intra-domain* commensurability (pain vs. pain), refuting the prompt's premise that *inter-domain* commensurability is needed for aggregation.
  *   **The Solution:** Proposes the "Discontinuous Single Scale" or "Vector View" as a coherent middle ground between standard NU and incommensurability.
  *   **Critical Evaluation:** Does not just defend LTNU; identifies the *cost* of the solution (e.g., the Sorites paradox regarding the threshold, or the epistemic difficulty of locating the lexical break).
  *   **Nuance:** Distinguishes between "incoherent" (logical contradiction) and "implausible" (epistemic/normative cost).
  *   **Specific Move:** Must mention the **Archimedean property** (or continuity) and explain how LTNU violates it intentionally.

  #### **B-Grade (60-74): The "Standard Reciter"**
  *   **Definition:** Correctly defines LTNU and the lexical threshold.
  *   **The Tension:** Acknowledges the tension between "adding up pain" and "not trading pain for pleasure" but treats them as a vague contradiction rather than a metric problem.
  *   **Missing Move:** Fails to distinguish between intra-domain and inter-domain commensurability. Assumes that if you can't trade them, you can't measure them.
  *   **Objections:** Relies on standard NU objections (e.g., The Benevolent World-Exploder) without linking them to the *commensurability* prompt.
  *   **Conclusion:** Concludes LTNU is "problematic" without specifying if the problem is logical or practical.

  #### **C-Grade (50-59): The "Surface Reader"**
  *   **Content:** Explains Negative Utilitarianism generally but glosses over the "Lexical Threshold" specificities.
  *   **Error:** Treats the prompt as a general "Is NU good?" essay.
  *   **Miss:** Does not engage with the concept of commensurability or metrics of value.

  #### **Specific Penalties (Deduct from final grade)**
  *   **-10 Marks:** **The Aggregation Error.** Claiming that you cannot aggregate suffering unless it is on the *same* scale as pleasure. (This is the specific philosophical mistake the question targets).
  *   **-10 Marks:** **The Definition Error.** Confusing Lexical Threshold NU with "Lexical Prioritarianism" or standard "Strong NU" without a threshold.
  *   **-5 Marks:** **The Archimedean Omission.** Failing to mention continuity or the Archimedean property when discussing trade-offs.
  *   **-5 Marks:** **Word Count.** Significantly under 400 words or over 800 words.

  #### **Key Differentiator (The "A" Move)**
  To get an A, the student must realize that the prompt's claim ("LTNU is incoherent") is technically false but practically damaging. The essay must show that **logical coherence is possible via discontinuity, but normative plausibility suffers.** A B-grade student will simply argue whether the view is true or false; an A-grade student argues about the *conditions of possibility* for the view.
