      *   Subject B (Biomed Engineer): Has the key. Runs the calibration cycle. For him, the zero-point is a variable to be measured and adjusted.
      *   *Internal State:* Both look at the same screen. Both trust the machine. Both would be shocked if it were wrong.
      *   *Evidence:* They both see the "System OK" light.
      *   *Difference:* B has the *authority/procedure* to interrogate the "System OK" light. A does not. For A, "System OK" is a hinge for diagnosis. For B, "System OK" is the output of a test.
