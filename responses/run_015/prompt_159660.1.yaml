          1.  **Hinge vs. Empirical:** Subject A treats $p$ as a hinge (unchallengeable within practice, adjudicates other claims). Subject B treats $p$ as empirical (checkable, falsifiable).
          2.  **Internal Identity:** A and B must be identical internally (evidence, training, intelligence, certainty, verbal dispositions).
          3.  **External Difference:** The difference must be in the practice/role, not culture or information. Same institution, same language. Role-local hinge.
          4.  **Epistemic Sanity:** Neither is dogmatic/crazy. A's treatment of $p$ must be appropriate for her role. Address escalation (A asking B to check $p$).
          5.  **Theoretical Separation:** The case must distinguish three views: (a) Evidentialism (A=B), (b) Non-belief/Enactive reading (A doesn't believe $p$), (c) System-relativism (A believes $p$, certain relative to system).
