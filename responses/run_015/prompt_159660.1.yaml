          *   $p$: "Reference Sequence GRCh38 is the correct baseline for human variation."
          *   Subject A (Clinical Diagnostician): Uses GRCh38 to identify mutations in patients. If a patient's sequence differs, it's a mutation. She doesn't test GRCh38; she uses it to find errors in patients.
          *   Subject B (Evolutionary Biologist/Genome Editor): Studies the reference itself. Checks if GRCh38 matches population averages or if it has gaps. For him, it's a hypothesis about the population.
          *   *Internal State:* Both know the history. Both are confident.
          *   *Issue:* Is A *really* certain? If B finds a major error, A updates.
          *   *Wittgensteinian Twist:* The hinge isn't about truth, it's about *function*. For A, it functions as a rule. For B, it functions as a description.
