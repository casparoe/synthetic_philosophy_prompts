answer: |-
  You have identified a genuinely significant and often under-theorized fault line in the literature on Frankfurt-style cases (FSCs). While there is no single, universally canonical proper name for this specific distinction (like "The Kantian Distinction"), it is recognized in specialized discussions under a few overlapping descriptions.

  The distinction you are drawing is best described as the difference between **Counterfactual Override** (your Type 1) and **Counterfactual Alignment** (your Type 2).

  Here is a breakdown of how this distinction maps onto existing literature, why it is often conflated, and who has argued that it matters for the Principle of Alternative Possibilities (PAP).

  ### 1. Terminology and Existing Classifications

  While you won't find a single noun phrase that captures this perfectly in every textbook, the distinction appears in the following forms:

  *   **Interventionist vs. Manipulation Cases:** Your Type 1 is a standard **Interventionist** case (Black forces Jones's hand). Your Type 2 is a **Manipulation** case situated in the counterfactual sequence (Black ensures Jones's *reasons* match the desired outcome).
  *   **Bypass vs. Engineering:** Some theorists distinguish between mechanisms that **bypass** the agent's deliberative faculties (Type 1) and those that **engineer** or **shape** those faculties (Type 2).
  *   **Coercive vs. Persuasive Counterfactuals:** In Type 1, the counterfactual intervener acts coercively (overriding will). In Type 2, the intervener acts persuasively or manipulatively (altering the will to align with the outcome).

  **Why the literature runs them together:**
  The dominant defense of Frankfurt cases comes from **John Martin Fischer** and his theory of **Semicompatibilism**. Fischer argues that moral responsibility depends solely on the **Actual Sequence** of events. For Fischer, the nature of the counterfactual intervener is irrelevant *provided* the intervener does not actually intervene. Since the mechanism remains dormant in the actual sequence of both Type 1 and Type 2 cases, Fischer treats them as metaphysically equivalent regarding responsibility. He would reject your claim that the agent's reasons are "causally idle" in Type 2, arguing that in the actual sequence, the reasons are doing all the work in both cases.

  ### 2. The "Causal Idleness" Objection

  Your intuition that Type 2 cases are problematic touches on a sophisticated objection known as the **"Modal Sourcehood"** worry.

  In Type 1 (Override), the agent's actual reasons are the *only* possible cause of the action in the actual sequence. The backup is a blunt instrument that sits outside the agent's psychology.
  In Type 2 (Alignment), the backup mechanism is tuned to the agent's psychology. If the mechanism *would have* produced the same reasons counterfactually, it suggests that the agent's actual reasons lack **modal robustness**.

  This connects to the **"Flicker of Freedom"** strategy advocated by **Carl Ginet** and **David Widerker**. They argue that for a counterfactual intervener to know *when* to step in (especially in Type 2, where they must tweak reasoning subtly), there must be a **Prior Sign** of the agent's wavering.
  *   **Type 1 Vulnerability:** If the intervener waits for a sign to override, the agent had the power to refrain from showing the sign (a "flicker" of freedom).
  *   **Type 2 Vulnerability:** This is even more acute in Type 2. To align the agent's reasons, the mechanism must detect the *content* of the deliberation. This implies the agent's deliberation has a causal history distinct from the mechanism *until* the intervention point. If the mechanism guarantees the reasons counterfactually, it undermines the claim that the agent is the **Ultimate Source** of those reasons, even if the mechanism didn't fire.

  ### 3. Has anyone argued one succeeds while the other fails?

  Yes, though often implicitly.

  **Alfred Mele** is the most prominent philosopher to argue that the *nature* of the counterfactual mechanism matters. In his work on manipulation (e.g., *Autonomy and Manipulation*), Mele argues that if a mechanism is capable of manipulating an agent's reasons to ensure an outcome, the presence of that mechanism can undermine the agent's status as the source of the action, even if it remains dormant. He suggests that Type 2 cases bleed into **Manipulation Arguments** (like his Zygote Argument), where the agent is clearly not responsible.

  **David Hunt** has also discussed the "metaphysics of Frankfurt cases," noting that cases where the intervener ensures the *reasons* (Type 2) presuppose a deterministic connection between the prior sign and the decision, which incompatibilists reject.

  **The Consensus View:**
  *   **Compatibilists (Fischer, Ravizza):** Both cases succeed in refuting PAP. Responsibility is about actual-sequence control (reasons-responsiveness), not alternative possibilities. The "causal idleness" of the backup is irrelevant because it is counterfactual.
  *   **Incompatibilists (Ginet, Widerker, Kane):** Both cases fail, but Type 2 fails *more obviously*. Type 2 cases require a "Prior Sign" to know when to align the reasons. This sign constitutes an alternative possibility (the agent could have refrained from showing the sign), thus preserving PAP. Type 1 cases are harder to attack but still vulnerable to the "Dilemma Defense" (if the actual sequence is determined, the agent isn't responsible; if indeterministic, the intervener can't know when to intervene).

  ### 4. Proposed Naming and Further Research

  Since there is no standard name, if you wish to use this distinction in your own work, I recommend labeling it:

  **The Override/Alignment Distinction**
  *   **Override Cases:** The counterfactual mechanism bypasses deliberation (Neuro-stimulation).
  *   **Alignment Cases:** The counterfactual mechanism manipulates deliberation to match the target outcome (Reason-engineering).

  **Why this matters for your argument:**
  You are correct to suspect that Type 2 cases are weaker defenses of Semicompatibilism. If the mechanism is sophisticated enough to align reasons counterfactually, it implies the agent's psychology is transparent and controllable in a way that threatens **Sourcehood**.

  **Key References to Consult:**
  1.  **Carl Ginet,** *"In Defense of the Principle of Alternative Possibilities"* (1996) – Discusses the "Prior Sign" objection which hits Type 2 cases hardest.
  2.  **Alfred Mele,** *"Autonomy and Manipulation"* (2006) – Explores how the *capacity* for manipulation affects responsibility.
  3.  **David Widerker,** *"Libertarianism and Frankfurt's Attack on the Principle of Alternative Possibilities"* (1995) – The "Dilemma Defense."
  4.  **John Martin Fischer,** *"The Frankfurt Cases: The Moral of the Stories"* (2010) – For the view that the distinction is irrelevant.

  **Summary:** Your intuition is philosophically sound. The distinction is between **Counterfactual Override** and **Counterfactual Alignment**. While Semicompatibilists treat them as equivalent, Source Incompatibilists argue that Type 2 (Alignment) cases reveal that the agent lacks the requisite modal control over their reasons, making them a weaker tool for refuting PAP than Type 1 cases.
