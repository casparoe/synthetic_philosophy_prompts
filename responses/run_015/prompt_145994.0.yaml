answer: |-
  ### Part 1: Brainstorming Subtle Misconceptions

  Before designing the examination material, consider these three subtle misconceptions students frequently harbor regarding Black's symmetric-universe scenario and the Principle of Identity of Indiscernibles (PII):

  1.  **The Epistemic/Metaphysical Conflation:** Students often treat PII as an epistemic principle about our ability to *identify* or *name* objects (e.g., "we can't tell them apart, so they are one") rather than a metaphysical claim about whether distinctness requires a qualitative ground. They miss Black's point that distinctness can exist without identifyability.
  2.  **The Spatial Intrinsic Error:** Students frequently assume that spatial location (e.g., "being here" vs. "being there") counts as an intrinsic qualitative property. They fail to see that in a symmetric universe, spatial relations are purely relational ("being 2 miles from the other sphere"), and if space is relational, location cannot individuate without presupposing the individuation of the relata.
  3.  **The Modal Free Lunch:** Students assume that introducing modal properties (like essentiality) automatically provides a qualitative difference without cost. They overlook the circularity worry: assigning an essential property to *this* sphere rather than *that* one often presupposes the very primitive identity (haecceity) the argument is trying to ground qualitatively.

  ***

  ### Part 2: Seminar Exam Question

  **Course:** Advanced Metaphysics
  **Module:** Individuation and Identity
  **Time Allowed:** 90 Minutes
  **Total Marks:** 25

  **Question:**

  Consider a variant of Max Black's symmetric universe. The universe contains exactly two spheres, composed of identical matter, having the same temperature, color, and diameter. They exist in empty space. Spatially, they are symmetric: each is exactly two miles from the other. There are no observers.

  In this variant, introduce a property **F**. **F** has no observational manifestation (it affects no causal powers detectable from outside the object). Sphere A instantiates **F** *essentially*. Sphere B instantiates **F** only *accidentally*. All other qualitative properties remain symmetric.

  Write an essay addressing the following prompt:

  Does introducing this essential/accidental distinction save the Principle of Identity of Indiscernibles (PII) from Black's counterexample, or does it render the principle circular by smuggling in an ungrounded intrinsic difference?

  In your response, you must:
  1.  Distinguish clearly between intrinsic and relational properties.
  2.  Explain why spatial relations alone cannot resolve the case of individuation in this symmetric universe.
  3.  Evaluate whether "being essentially F" counts as a legitimate qualitative property for the purposes of PII.
  4.  Conclude whether this move preserves PII or collapses into haecceitism.

  **Guidance:**
  *   **Length:** Approximately 1,500 to 2,000 words.
  *   **Time Allocation:** Spend 15 minutes planning your argument, 60 minutes writing, and 15 minutes reviewing.
  *   **Focus:** Do not simply recount Black's original argument. The difficulty lies in analyzing the metaphysical cost of the essential/accidental distinction. Avoid citing specific authors; rely on argumentative rigor.

  ***

  ### Part 3: Model Answer

  **Note to Examiners:** This model answer demonstrates the required philosophical moves. It does not represent the only acceptable conclusion, but it must follow the logical structure outlined below to achieve full marks.

  **Move 1: Establishing the Conflict between PII and Symmetry**
  The Principle of Identity of Indiscernibles states that if two entities share all qualitative properties, they are identical. Black's original scenario challenges this by presenting two distinct spheres that share all intrinsic and relational properties due to spatial symmetry. To evaluate the variant, one must first acknowledge that standard qualitative properties (mass, color, diameter) are exhausted by the symmetry. If PII holds, there must be some qualitative difference grounding the numerical distinctness of the spheres. The burden of proof lies on showing that the proposed modal difference (essential vs. accidental F) is qualitative rather than a disguised reference to primitive identity.

  **Move 2: Analyzing the Essential/Accidental Distinction as Intrinsic**
  The proposed solution introduces a modal property: "being essentially F." This appears to be an intrinsic property because it concerns the object's nature independent of other entities. Unlike "being two miles from the other sphere," which is relational, essentiality describes how the property F is held. If essentiality is a genuine qualitative feature, then Sphere A and Sphere B differ qualitatively: one has the property [Essentially F], the other has [Accidentally F]. Consequently, they are discernible, and PII is saved. However, this relies on the assumption that modal profiles are accessible to qualitative description without referencing the individual itself.

  **Move 3: Evaluating the Circularity Charge**
  The critical metaphysical worry is circularity. To assert that Sphere A has F essentially while Sphere B has F accidentally, one must be able to refer to Sphere A and Sphere B independently of their properties. If the only way to specify which sphere is which is by saying "the one that is essentially F," the distinction is tautological. This suggests that the essentiality is not grounding the identity; rather, the presupposed identity (haecceity) is grounding the attribution of essentiality. If essentiality relies on haecceity, it is not a purely qualitative property. Therefore, using it to satisfy PII smuggles in the very distinctness the principle is meant to explain, rendering the defense circular.

  **Move 4: The Failure of Spatial Relations and Final Conclusion**
  Spatial relations cannot rescue PII here because relations presuppose relata. To say Sphere A is "two miles from Sphere B" individuates A only if B is already individuated. In a symmetric universe, there is no qualitative anchor to start the chain of individuation. Similarly, if the essential/accidental distinction relies on haecceity, it functions like a spatial indexical—it points to a "thisness" without describing a "whatness." Therefore, this variant does not save PII in its strong qualitative form. It either concedes that distinctness requires primitive thisness (rejecting PII) or it disguises haecceity as a qualitative property (making PII trivial). The robust conclusion is that the essential/accidental distinction fails to save PII without collapsing into circularity.

  ***

  ### Part 4: Marking Scheme

  **Total Marks:** 25
  **Pass Mark:** 13

  **Move 1: Establishing the Conflict (6 Marks)**
  *   **Criteria:** Clearly defines PII and explains why Black's symmetric universe threatens it (distinctness without qualitative difference).
  *   **3 Marks:** Accurate definition of PII and Black's challenge.
  *   **3 Marks:** Correctly identifies that the variant attempts to restore qualitative difference.
  *   **Characteristic Mistake:** Confusing PII with an epistemic principle about our ability to name or observe the spheres.

  **Move 2: Analyzing Essentiality as Intrinsic (6 Marks)**
  *   **Criteria:** Distinguishes intrinsic properties from relational ones and assesses whether modal properties fit the intrinsic category.
  *   **3 Marks:** Correct distinction between intrinsic (monadic) and relational properties.
  *   **3 Marks:** Plausible argument for why essentiality *looks* intrinsic but requires scrutiny.
  *   **Characteristic Mistake:** Treating spatial location ("being here") as an intrinsic property capable of individuating.

  **Move 3: Evaluating the Circularity Charge (6 Marks)**
  *   **Criteria:** Engages with the worry that assigning essentiality presupposes identity (haecceitism).
  *   **3 Marks:** Identifies the risk that "this sphere" must be identified before essentiality is assigned.
  *   **3 Marks:** Explains why this makes the property non-qualitative (dependent on primitive identity).
  *   **Characteristic Mistake:** Assuming modal properties are automatically qualitative without addressing how they are anchored to the object.

  **Move 4: Spatial Relations and Conclusion (5 Marks)**
  *   **Criteria:** Explains why spatial relations fail and provides a definitive conclusion on PII's status.
  *   **3 Marks:** Correct explanation that relations presuppose individuated relata.
  *   **2 Marks:** Clear conclusion (PII is not saved, or is saved only trivially).
  *   **Characteristic Mistake:** Arguing that spatial distance alone solves the problem without noticing the relational dependency.

  **Clarity and Structure (2 Marks)**
  *   **Criteria:** Argument flows logically, terms are used consistently, and writing is precise.
  *   **2 Marks:** Professional philosophical prose, no ambiguity.
  *   **1 Mark:** Minor lapses in precision or flow.
  *   **0 Marks:** Disorganized or difficult to follow.

  ***

  ### Part 5: Calibration Note

  This question is designed to separate students who grasp the metaphysical crux of individuation from those who have only memorized the standard summary of Black's argument. A student relying on rote memorization will correctly recount the original two-sphere scenario but will likely treat the essential/accidental variant as a straightforward solution, failing to detect the circularity involved in anchoring modal properties. They will assume that because "essential" is a predicate, it counts as a qualitative property.

  The high-performing student will recognize that the difficulty lies not in finding *a* difference, but in finding a *qualitative* difference that does not presuppose the identity it is meant to ground. They will engage with the haecceitist worry: that assigning essentiality to *this* sphere rather than *that* one requires a primitive "thisness" already in place. This distinction tests whether the student understands PII as a constraint on metaphysical grounding rather than a simple checklist of properties.
