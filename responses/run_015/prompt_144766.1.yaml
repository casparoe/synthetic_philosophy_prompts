answer: |-
  ### The Scenario: The Polity of Ostra and the Seed-Corn Buffer

  Ostra is a closed island economy growing a single staple grain, *triticum ostrum*, with no trade and no technological change beyond standard agronomic knowledge. **Theorist One (Valerius)** proposes the *Soil-Seed Constraint*: population grows geometrically, grain yield is arithmetic, but the system possesses a **Viability Buffer** (seed corn reserved for planting, which can be eaten in emergencies but destroys future capacity). Valerius publishes a quantitative prediction: "Net caloric availability will fall below subsistence requirements by 10% in **Year 50**." **Theorist Two (Cassius)** proposes the *Hubris Hypothesis*: "When civic virtue declines, the land refuses to yield." Cassius publishes the identical quantitative prediction: "A 10% caloric deficit will occur in **Year 50**." In Year 50, the deficit does not occur. Data shows farmers consumed 40% of the Viability Buffer to bridge the gap, a move permitted by Ostra's economic rules but which depletes the buffer entirely. In **Year 55**, with the buffer exhausted and planting impossible, the predicted 10% deficit materializes exactly as Valerius's production functions dictated. Cassius claims the Gods merely delayed their punishment.

  ***

  ### The Walkthrough: Three Auditors, Two Theorists

  **1. The Mechanism-First Auditor**
  *   **Verdict on Valerius (T1):** **Vindicated ('Right but Early').**
      *   **Reason:** The specific mechanism named (production < consumption) was active at Year 50. The failure to observe the crisis was due to a specifiable, exhaustible offset (the Viability Buffer) that the theory explicitly acknowledges as a variable. The mechanism drove the outcome once the offset was removed.
  *   **Verdict on Cassius (T2):** **Falsified.**
      *   **Reason:** The mechanism ("virtue/land refusal") offers no account of the Buffer. It cannot explain *why* the crisis was delayed until the Buffer was gone, nor does it specify what constitutes "virtue" running out. The correlation is accidental.

  **2. The Strict Falsificationist**
  *   **Verdict on Valerius (T1):** **Falsified.**
      *   **Reason:** The prediction was a dated, quantitative claim (Year 50, 10% deficit). The observation at Year 50 was negative. Any appeal to the Buffer is a post-hoc adjustment to save the hypothesis. A prediction is a contract; breaking the date breaks the theory.
  *   **Verdict on Cassius (T2):** **Falsified.**
      *   **Reason:** Identical to T1. The date was missed. The vagueness of the mechanism offers no protection against a missed quantitative target.

  **3. The Research-Programme Auditor (Lakatosian)**
  *   **Verdict on Valerius (T1):** **Progressive Shift (Vindicated).**
      *   **Reason:** The adjustment to the theory (incorporating the Buffer drawdown data between Year 50–55) predicted a **novel fact**: the specific rate of seed-corn depletion. Valerius didn't just say "wait"; he pointed to the measurable stock of seed corn and predicted the crisis would coincide with its exhaustion. This is theoretical progress.
  *   **Verdict on Cassius (T2):** **Degenerating Shift (Falsified).**
      *   **Reason:** Cassius's adjustment ("The Gods waited") predicts nothing novel about the interval. It is an *ad hoc* rescue that explains the past (Year 50–55 stability) without risking a new testable claim about the future. It absorbs the anomaly without adding content.

  ***

  ### The Honest Part

  **The Feature Doing the Work:**
  The single feature carrying the entire load is the **Specifiability of the Exhaustible Offset**. Valerius wins only because the Viability Buffer is a measurable stock with a known depletion rate. If the offset were vague (e.g., "temporary soil resilience" or "unmeasured technological slack"), the Mechanism-First Auditor would have no way to distinguish Valerius from Cassius. Both would look like they are making *ad hoc* excuses.

  **What Collapses if Removed:**
  If the offset is not visibly exhaustible, the **Mechanism-First Auditor collapses into the Strict Falsificationist**. Without a measurable buffer to point to, the claim "the mechanism was working but hidden" becomes indistinguishable from "the theory is wrong and I'm making excuses." The auditor loses the traction needed to say "Right but Early" and must default to "Wrong on Date."

  **The Attack from the Losing Side:**
  A defender of Strict Falsificationism would attack the case as **rigged by hindsight**. They would argue: "Valerius did not predict the Buffer drawdown *before* Year 50; he noticed it *after* the failure. By allowing him to incorporate the Buffer data post-facto, you are allowing the theory to change its shape to fit the data. You are rewarding him for being a good historian of the last five years, not a good predictor of the next ten. This privileges the theorist who survives long enough to tweak the model."

  **The Audit Horizon:**
  This is where your thesis on **standing** becomes undeniable.

  *   **Long Horizon (Theorists Dead):** When Valerius and Cassius are dead, the community holds the data on the Buffer drawdown objectively. Valerius is vindicated as a genius who understood the structural constraint. The "Right but Early" verdict stands because there is no one left to accuse of moving the goalposts.
  *   **Short Horizon (Theorists Alive):** If Valerius is alive at Year 55, the verdict shifts. When he says, "See? The Buffer ran out," his rivals will scream **Immunizing Stratagem**. Because he is professionally invested, his adjustment looks like a defense of turf, not a discovery of truth. The "Right but Early" claim becomes a power play: *Who has the standing to declare the theory dead?* If the theorist is alive, he refuses to declare it dead. If he is dead, the community declares it alive.

  **Conclusion for your Talk:**
  The case demonstrates that "Right but Early" is not a property of the prediction (the world didn't change), but a property of the **audit conditions**. It requires a measurable offset (to satisfy the mechanism auditor) and a lack of professional self-interest (to satisfy the suspicion of *ad hoc* adjustment). Without the dead theorist, "Right but Early" is just "Wrong and Stubborn."
