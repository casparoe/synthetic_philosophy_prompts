answer: |-
  ### Translations of the Four Positions

  **1. Polybius (Anacyclosis)**
  In your vocabulary, Polybius describes a morphosyntactic typology cycle that is strictly deterministic. He posits that a language must move from Isolating (Monarchy) to Agglutinative (Aristocracy) to Fusional (Democracy), but that each stage contains an internal irregularity (corruption) that forces a reanalysis back to Isolating.
  *   **The Fudge:** Polybius treats the "corrupt" forms as functionally inferior. Your framework treats opaque morphology (corruption) as merely the output of regular sound change eroding transparency, compensated for by syntax. Polybius claims the system crashes; your framework claims the system restructures.
  *   **Translation:** A Jespersen's Cycle applied to macro-syntax, but erroneously modeled as a closed circle rather than a Meilletian spiral. He asserts a return to the *identical* initial state, which violates the principle that reconstruction never yields the same phonetic material twice.

  **2. Ibn Khaldun (Asabiyyah)**
  Khaldun is describing the lifecycle of a *koine* or standard variety arising from a dialect continuum. The "nomads" represent a high-coherence dialect bundle with strong isogloss alignment (high *asabiyyah*). Upon urbanization (taking power), the variety becomes a prestige register subject to intense contact, borrowing, and leveling.
  *   **The Fudge:** Khaldun sets a hard temporal limit (three generations) for the coherence of the prestige variety before it fragments or is replaced by a new peripheral bundle.
  *   **Translation:** This is the Wave Model overtaking the Tree Model. The "dynasty" is a temporary bundle of isoglosses held together by social prestige. When the prestige decays, the bundle dissolves back into a continuum, and a new peripheral variety (new dynasty) imposes itself. It is a cycle of *standardization* and *dialectalization*, not of the language system itself.

  **3. Toynbee (Challenge-and-Response)**
  Toynbee maps onto the grammaticalization cline. The "Creative Minority" are the speakers innovating a new construction (lexical item). The "Dominant Minority" represents the stage where the construction is obligatory but still analyzable (grammatical). The "Universal State" is the stage of fusion/erosion where the origin is opaque (affix), and the system loses the capacity for further innovation in that domain without borrowing.
  *   **The Fudge:** Toynbee implies a teleological end-point (breakdown) driven by a loss of "mimetic" capacity.
  *   **Translation:** A unidirectional cline (Lexical > Grammatical) that stalls. Toynbee interprets the stall as "death." Your framework interprets it as "completion of a cycle," awaiting renewal via a new lexical source. His "religious framing" in later volumes is an attempt to find a new source of lexical material to restart the cline.

  **4. Spengler (Morphology of History)**
  Spengler treats a culture as a Language Family that is also a Language Isolate. He asserts that each culture has a unique "inner unity" (grammar) that is incommensurable with others.
  *   **The Fudge:** This denies the possibility of cognate sets across cultures.
  *   **Translation:** Spengler is arguing for radical Subgrouping where no higher-order reconstruction is possible. He claims "Classical" and "Western" are not related languages but distinct biological organisms. In your terms, this is a denial of the Comparative Method's foundational assumption that all human languages share a common parameter space. He is treating *Drift* as *Destiny*.

  ---

  ### Testing Your Suspicions

  **Suspicion 1: Distinct State Variables**
  Your disentangling is **forced by the texts**, not imposed by your framework.
  *   Polybius varies *Regime Type* (analogous to Morphosyntactic Alignment).
  *   Khaldun varies *Group Cohesion* (analogous to Dialect Coherence/Isogloss Bundling).
  *   Toynbee varies *Institutional Differentiation* (analogous to Grammaticalization Depth).
  *   Spengler varies *Expressive Style* (analogous to Idiolectal Drift or Aesthetic Typology).

  The "cyclical-versus-linear" dispute is indeed noise. Polybius proposes a circle (typological return). Khaldun proposes a damped wave (cohesion rises and falls). Toynbee proposes a sigmoid curve (growth then plateau). Spengler proposes a biological lifespan (birth to death). They are not disagreeing on the shape of history; they are measuring different parameters. Your framework separates these cleanly (Structure vs. Contact vs. Change vs. Variation), which reveals their conflation.

  **Suspicion 2: The Renewal Cycle (Spiral vs. Circle)**
  Your suspicion holds. The cyclical-versus-linear dichotomy is false because it ignores the *material* dimension of recurrence.
  *   **Polybius** fails this test. He claims the regime returns to the *same* state. In linguistics, this is impossible; sound change ensures the phonetic material is never identical.
  *   **Khaldun** passes partially. The *structure* of the dynasty repeats (periphery conquers center), but the *population* changes. This is a Spiral.
  *   **Toynbee** fails. He sees the "Universal State" as a terminal point, not a renewal point. He misses the "bleaching-and-renewal" mechanism.
  *   **Spengler** fails. He sees a line ending in zero.
  *   **Verdict:** Only the linguistic model (Meillet's Spiral) successfully accounts for recurrence without identity. The historians are trapped in a folk-biological view of "birth and death" rather than a structural view of "reanalysis and renewal."

  ---

  ### The Residue

  **(a) The Unit Problem (Galton's Problem)**
  In linguistics, the "Language" is a heuristic abstraction derived *after* establishing regular correspondences. You assume vertical transmission to find the correspondences, then use the correspondences to draw the tree. If borrowing (Wave) is massive, the Tree is invalid.
  *   **Translation:** Historians define "Civilization" *before* analysis (e.g., "The West," "Islam"). This is circular. If civilizations are dialect continua with massive borrowing (which they are), then treating them as independent samples for comparative history is methodologically unsound.
  *   **Adjudication:** This reflects badly on the **historiographers**. They reify the unit (Civilization) as a bounded entity akin to a "Language" in the 19th-century sense, ignoring the Dialect Continuum reality. Galton's Problem is the Wave Model invalidating their Tree Model. They are drawing family trees for speech communities that are actually contact zones.

  **(b) Commensurability (Spengler)**
  Your framework requires that all languages be parameterizable on shared scales (e.g., word order, case marking). Spengler claims cultures have unique "prime symbols" that cannot be mapped onto one another.
  *   **Translation:** Spengler is asserting that there are no linguistic universals. He claims "Western Causality" and "Arabian Magic" are not just different values on a parameter but different *dimensions*.
  *   **Adjudication:** This is **untranslatable noise** within your framework. It is a denial of the precondition of comparison. If Spengler is right, the Comparative Method is impossible for history. However, since your field operates on the consensus that all languages are equally expressive and structurally comparable, Spengler's claim is effectively a refusal to engage in science. It is a metaphysical assertion, not a descriptive one.

  **(c) Decline (Deflation vs. Restructuring)**
  Your field expels "decline" because structural complexity is constant. When morphology erodes, syntax complexifies.
  *   **Translation:** When Toynbee or Spengler say "Decline," they do not mean "Structural Simplification." They mean "Loss of Generative Capacity" or "Loss of Adaptive Potential." They are describing a system that can no longer produce novel responses to challenges.
  *   **Adjudication:** This reflects badly on **your vocabulary**. Your framework is equipped to describe *form* but lacks the tools to describe *function* or *efficacy*. You can describe the erosion of a negation marker, but you cannot describe the "failure" of a civilization to respond to an environmental challenge without importing teleology. The historians are trying to describe functional collapse; you are restricted to structural description. You call it "restructuring"; they call it "death." Neither is fully adequate, but your prohibition on "decline" blinds you to the functional reality they are grasping at, however clumsily.

  ---

  ### Final Verdict

  The residue reflects **badly on the historiographers' vocabulary**, with one critical exception.

  Polybius, Khaldun, Toynbee, and Spengler are all operating with pre-scientific, folk-biological metaphors (organism, birth, death, blood, cohesion) that your field purged during the Neogrammarian revolution. They reify abstract units (Civilizations) that do not meet the criteria for independent sampling (Galton's Problem), and they assert incommensurability (Spengler) that renders comparison impossible. Their "cycles" are often circular arguments derived from these reified units.

  However, on the question of **Decline**, the residue reflects a limitation of **your vocabulary**. The consensus that "no language is more complex than another" protects linguistics from prescriptivism, but it strips the toolkit of the ability to measure *systemic resilience* or *adaptive capacity*. The historians are wrong to call it "decay" (implying a return to a prior, better state), but they are observing a real phenomenon: the exhaustion of a system's generative potential. Your framework can describe the *mechanism* of the exhaustion (grammaticalization, fossilization), but your ideological commitment to non-evaluation prevents you from modeling the *consequence* (systemic failure). They have the wrong ontology; you have a blind spot regarding function.
