answer: |-
  The office smelled of dry-erase markers and stale coffee, the specific perfume of the humanities basement. Elias sat behind his desk, a stack of introductory ethics papers in front of him. The prompt was standard: *Explain Glaucon's challenge. Is justice desirable for its own sake?*

  Most of the undergraduates got it wrong. They thought Glaucon was saying justice doesn't matter. Elias knew better. Glaucon was saying justice matters too much—it's too expensive. People only pay the cost of being moral because they're too weak to get away with immorality. It's a social contract born of cowardice.

  Elias reached into his pocket and touched the band. It wasn't gold, just a dull, cold metal he'd found in a box of estate junk downtown. It didn't bend light. It didn't hide the wearer. It hid the *trace*.

  He had read the *Republic* twice. He knew the thought experiment. Glaucon describes the perfectly unjust man: he steals, he cheats, he sleeps with whoever he wants, but he cultivates such a flawless reputation for piety that everyone worships him. He gets the benefits of injustice and the wages of justice. Conversely, the perfectly just man is stripped of reputation, tortured, and reviled. Glaucon's point was brutal: everyone would choose the first man. We want the rewards, not the virtue.

  Elias thought the undergraduates missed the variable. Reputation is a burden. Maintaining the mask of the saint requires constant labor. You have to perform goodness you don't feel. But this ring… this ring offered something Gyges' ring didn't. Gyges' ring made you invisible to the eye. This ring made you invisible to history.

  He slipped it onto his right ring finger. It fit perfectly.

  He stood up and walked down the hall to the department main office. Sarah, the departmental assistant, was counting the petty cash box. She looked up as he entered.

  "Hey Elias," she said. "You need something?"

  "Just checking the mail," Elias said. He walked past her desk. He opened the petty cash box. He took three hundred dollars. He walked out.

  He paused in the hallway, counting the seconds. Ten. Twenty. He walked back in.

  Sarah was staring at her computer screen. She looked up, her eyes sliding over him without purchase. "Can I help you?"

  "I just came in," Elias said.

  "Okay… do you have an appointment?"

  He looked at the petty cash box. It was open. The money was gone. She didn't remember him taking it. She didn't even remember him being there. He was free. Not just from punishment, but from the expectation of consistency. He could be a different person in every room he entered.

  He went back to his office and packed his bag. He took a laptop from the lost-and-found bin. He walked out into the rain.

  At the bar, he bought a drink. He paid with a twenty from the petty cash. The bartender handed him the change. Elias walked out the door. Behind him, the transaction dissolved. The receipt in his pocket turned to gray smudge, the ink running like wet charcoal. The bartender would balance the till later and find a discrepancy, but no memory of a face to attach to the loss.

  Elias sat in his apartment, the stolen laptop open. He felt a surge of power. This was the upgrade. Glaucon said men practice justice unwillingly. Elias was now practicing injustice willingly, without the tax of reputation. He didn't need to be thought a saint. He didn't need to be thought anything.

  He picked up his phone to call Mara. He wanted to tell her. Not about the theft, but about the theory. He wanted to explain that he had solved the equation.

  Mara answered on the third ring. "Hello?"

  "It's Elias."

  Silence. Then, a polite, distant hesitation. "Who is this?"

  "Elias. Your boyfriend."

  "I… I think you have the wrong number."

  "Mara, it's me. We live together. Check your photos."

  He heard the rustle of the phone being pulled away. He waited. When she came back, her voice was tight. "There's no one named Elias in my contacts. My photos… the files are corrupted. Just gray blocks."

  He hung up. He scrolled through his own gallery. The pictures of them at the beach, the dinner last month, the selfie from Christmas—they were all smudged. Digital noise where faces should be. He tried to remember the date of their anniversary. He knew they had one, but the specific day slipped away, unanchored from any shared confirmation.

  He stood up and paced the room. He had the money. He had the laptop. He had the impunity. But Glaucon's perfectly unjust man wasn't just immune; he was honored. He was loved. He had power.

  Elias realized, with a cold clarity, that he had misread the text. Glaucon wasn't saying reputation was a burden; he was saying it was the currency. The unjust man succeeds because he can *spend* his reputation. He can trade on trust he hasn't earned. Elias had the trust of no one. He could not be promoted, because his department chair would forget his tenure case the moment he left the office. He could not be loved, because love is a accumulation of shared memory. He could not even be hated, which requires remembering a grievance.

  He was not the tyrant Glaucon described. He was a ghost.

  He sat on the edge of the bed. The three hundred dollars was in his hand. He could spend it tonight. Tomorrow, the shopkeepers would forget he was there. The goods would remain, but the history of acquisition would vanish. He would accumulate objects in a vacuum.

  He looked at the ring. He could take it off. If he took it off, would the memories return? Or was the erasure permanent, the ring only preventing new connections? He didn't know. The manufacturer's instructions were non-existent.

  If he took it off, he would return to the compromise. He would return to being just because he was too weak to be unjust safely. He would return to grading papers on why people should be moral, while knowing he only was because he had to be.

  If he kept it on, he was safe from consequence, but stripped of the rewards. He had achieved the state of nature Glaucon described—absolute freedom to do as one pleases—but without the civilization required to enjoy it.

  Elias lay back on the bed. The room was quiet. He wasn't suffering torture like Glaucon's just man. He wasn't being reviled. He was simply… unattached. The money was in his hand. It felt real. The laptop was on the desk. It hummed.

  He wondered if the loneliness was a punishment for injustice, or just the physics of being unremembered. He wondered if he had been just yesterday, when he was remembered, or if he had just been performing. He closed his hand over the cash. He didn't take the ring off. He didn't put it on the nightstand. He lay there, listening to the hum of the stolen machine, waiting to see if morning would bring a past back, or just another room to leave.
