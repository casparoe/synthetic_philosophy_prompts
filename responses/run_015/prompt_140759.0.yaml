      *   **The Glauconian Twist:** Glaucon says the benefit is *reputation*. Elias thinks the benefit is *impunity*. But without reputation, you can't get the "wages of justice" (trust, promotion, love). Elias realizes too late that Glaucon was right: you need the *appearance* of justice to get the social rewards. The ring grants impunity but denies the rewards of false virtue.
      *   **Climax:** He tries to connect with someone (a partner, friend, colleague). They forget him immediately. He loses his own past because shared memories vanish.
