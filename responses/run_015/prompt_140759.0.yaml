      *   **Twist:** Variant ring. Not invisibility, but *unremembered*. No memory of you after you leave the room. Digital traces smudge. Can't be caught, but can't be trusted/credited/loved. Lose own past (others forget it too).
      *   **Protagonist:** Philosophy TA (or similar), has read *Republic*, thinks the answer is obvious, believes the ring is a pure upgrade (freedom from reputation constraints).
