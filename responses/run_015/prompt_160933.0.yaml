answer: |-
  **Memorandum to the Municipal Commission on Contested Commemorations**

  **Subject:** Desiderata for a Theory of Commemoration
  **Date:** 24 May 2024
  **To:** The Commission
  **From:** Advisory Consultant

  You have requested a specification of the criteria a theory of commemoration must meet to be operational for your commission. You require not a verdict on the specific statues or names before you, but a metric by which to judge the coherence and applicability of the arguments you will hear. The following desiderata are designed to filter out theories that are philosophically incoherent, practically unworkable, or morally insufficient for a pluralistic democracy.

  Where appropriate, I have distinguished between what is **Settled** (broad consensus among philosophers of memory and public policy) and what is **Contested** (live debates where reasonable experts disagree).

  ### I. Substantive Desiderata

  **1. The Distinction between Honour and Record**
  *   **Requirement:** The theory must distinguish between commemorating to *honour* (conferring prestige, inviting emulation) and commemorating to *record* (preserving historical fact, inviting scrutiny).
  *   **Rationale:** A street name functions differently from a museum plaque. Conflating the two renders it impossible to explain why a war criminal might belong in a history book but not on a town hall.
  *   **Status:** **Settled.** Almost all working theories accept this distinction, though they disagree on where specific cases fall on the spectrum.

  **2. The Zero-Sum Constraint**
  *   **Requirement:** The theory must explicitly state whether public recognition is a scarce resource. It must answer: Does adding a new monument or name diminish the status conferred by existing ones?
  *   **Rationale:** If honour is scarce, adding a marginalized hero requires removing a traditional one to maintain equilibrium. If honour is expandable, the solution is proliferation. A theory that assumes scarcity without argument imposes an artificial conflict; one that assumes expandability ignores the finite nature of physical civic space and attention.
  *   **Status:** **Contested.** Some argue civic space is finite (zero-sum); others argue symbolic space is infinite (positive-sum). Your theory must pick a lane to guide recommendations on *adding* versus *replacing*.

  **3. Semantic Drift and Reception**
  *   **Requirement:** The theory must account for the divergence between creator intent and public reception. It must specify whether a monument's meaning is fixed at erection or accumulates meaning through subsequent usage and social change.
  *   **Rationale:** A monument erected as propaganda may become an ironic landmark; a statue of a benefactor may become a site of protest. A theory that privileges only original intent ignores how public art actually functions in a living society. One that privileges only current reception risks ahistorical revisionism.
  *   **Status:** **Contested.** While it is **Settled** that meaning *does* accumulate, the *weight* of this accumulated meaning relative to original intent is debated. A usable theory must provide a weighting mechanism.

  **4. The Collective Problem**
  *   **Requirement:** The theory must provide a method for evaluating collective entities (regiments, founding generations, companies) where individual moral records vary.
  *   **Rationale:** Naming a school after a "founding generation" implicates individuals differently than naming it after a specific eugenicist. A theory that treats collectives as monolithic individuals fails to capture the nuance of institutional history.
  *   **Status:** **Settled** that they are distinct categories; **Contested** how to adjudicate the moral standing of the collective (e.g., does the presence of *any* perpetrators taint the whole?).

  **5. Remedial Distinctness**
  *   **Requirement:** The theory must treat removal, relocation, recontextualisation (in situ), and counter-monumentality (adding nearby) as expressive acts with distinct meanings, not merely logistical options with different costs.
  *   **Rationale:** Removal signals repudiation; relocation signals preservation without honour; recontextualisation signals complex engagement. Treating them as functionally identical ignores the communicative power of the remedy itself.
  *   **Status:** **Settled.** These are semantically distinct. The **Contested** element is which remedy is appropriate for which violation.

  **6. Minority Protection in Symbolic Space**
  *   **Requirement:** The theory must specify what the commission owes a minority whose heroes are consistently outvoted by the majority. It must address whether there is a right to commemorative representation independent of majoritarian preference.
  *   **Rationale:** In a democracy, policy follows the vote, but dignity should not. If commemoration is purely majoritarian, minority groups may reasonably view the public sphere as hostile. The theory must define the limit of majority rule in symbolic matters.
  *   **Status:** **Contested.** There is no consensus on whether there is a positive right to be commemorated, only a negative right not to be honoured *against* one's will (e.g., victims of the regime).

  ### II. Practical Desiderata

  **7. Administrability**
  *   **Requirement:** The theory must be operationalisable by non-historians within a fixed timeline (one year).
  *   **Rationale:** A theory requiring deep archival research for every street name will cause the commission to fail. It must allow for heuristic judgments where evidence is incomplete.
  *   **Status:** **Settled.** A theory that cannot be applied is not a theory for a commission.

  **8. Consistency vs. Context**
  *   **Requirement:** The theory must balance the need for consistent rules (treating like cases alike) against the particularity of local attachment.
  *   **Rationale:** A statue of a general might be intolerable in the capital but cherished in his hometown. A rigid rule creates injustice; total flexibility creates arbitrariness.
  *   **Status:** **Contested.** The balance between universal principles and local democracy is a perennial tension in governance.

  ---

  ### III. Incompatible Desiderata and Trade-offs

  You asked to flag pairs of desiderata that cannot be jointly satisfied. The most significant tension lies between **Administrability (7)** and **Context-Sensitivity (part of 8)**.

  *   **The Conflict:** To treat cases with high sensitivity to local attachment and semantic drift requires deep, case-by-case investigation. To finish within a year using lay commissioners requires standardised criteria. You cannot maximise both. A theory that demands high sensitivity will collapse under the workload; a theory that prioritises administrability will inevitably produce 'blunt' outcomes that ignore local nuance.
  *   **Recommendation:** You must decide early whether you are a *judicial* body (prioritising consistency and speed) or a *deliberative* body (prioritising nuance and community engagement). The theory you adopt must match this self-conception.

  **The Single Most Exclusionary Requirement:**
  The requirement that does the most to exclude candidate theories is **The Distinction between Honour and Record (1)**.
  *   **Reasoning:** Many popular arguments conflate history with honour (e.g., "Removing this statue erases history"). Any theory that cannot rigorously separate the *pedagogical* function of a monument from its *honorific* function will fail to provide guidance on the university hall or the propaganda monument. It is the primary filter for coherence.

  ---

  ### IV. Scoring Usual Strategies

  Briefly, here is how common strategies score against these desiderata:

  *   **Leave Everything (Preservationist):** Fails **Minority Protection (6)** and **Honour/Record (1)**. It assumes all existing commemorations are neutral history, ignoring their honorific power.
  *   **Remove Everything Objectionable (Purificationist):** Scores well on **Minority Protection (6)** but poorly on **Semantic Drift (3)** and **Remedial Distinctness (5)**. It assumes removal is the only meaningful response and risks treating history as zero-sum.
  *   **Contextualise In Situ (Integrationist):** Scores highly on **Semantic Drift (3)** and **Honour/Record (1)**. However, it often fails **Administrability (7)** (requires ongoing curation) and may fail **Minority Protection (6)** if the original harm is too visceral to be mitigated by a plaque.
  *   **Relocate to Museums (Archivalist):** Strong on **Honour/Record (1)** (shifts from honour to record). Weak on **Remedial Distinctness (5)** (can be seen as hiding rather than reckoning) and **Zero-Sum (2)** (assumes civic space must be cleared).

  ---

  ### V. Epistemic Status Note

  In preparing your hearings, please note the following division of labour regarding knowledge:

  *   **Settled:** That commemoration is an active political practice, not a passive reflection of history; that meaning changes over time; that removal and contextualisation send different messages.
  *   **Contested:** Whether there is a *right* to commemorative space for minorities; whether civic space is finite; whether the intentions of the donors (e.g., the eugenicist benefactor) outweigh the current utility of the building; whether local majorities can override national norms on hate speech in commemoration.

  Do not allow witnesses to present contested positions (such as "removal is erasure") as settled facts. Your theory must be robust enough to adjudicate between these competing claims, not merely reflect the loudest one.

  **Signed,**
  **Advisory Consultant**
