prompt: |-
  I sit on a municipal commission that has one year to recommend what to do with a backlog of contested commemorations: two statues, a school name, a couple of street names, a university hall named for a benefactor who also funded eugenics research, and a monument whose subject is unobjectionable but that was erected by a deposed regime partly as propaganda. We can only recommend; the council decides, and we will have to act while the disagreement about what we owe the past is still live. Before we hear from any more interested parties, I want a specification rather than a verdict.

  Write the desiderata that a theory of commemoration would have to meet to be usable by a body like mine: the cases it must handle, the distinctions it must respect, the things about how public honoring actually works that it cannot contradict, and the reason each item is a genuine requirement rather than a prejudice of one camp. Among the claims I want you to test rather than assume: whether honoring is a zero-sum allocation of a scarce stock of public recognition, so that adding one name is a cost to others; whether a monument's meaning is fixed by its makers' intentions or can accumulate meaning from what later happens at the site; the difference between commemorating a victim, a perpetrator, and a collective such as a regiment, a company, or a founding generation, where no individual's record settles the case; whether removal, relocation, recontextualization in place, and adding a second monument nearby are genuinely distinct options or the same option with different costs; and what a commission owes a minority whose heroes keep losing under majority rule.

  Then flag any pair of desiderata you think cannot be jointly satisfied — I suspect administrability by nonhistorians and case-by-case sensitivity pull apart, and that treating like cases alike conflicts with deferring to local attachment — and say which single requirement does the most to exclude candidate theories. You may score the usual strategies (leave everything, remove everything objectionable, contextualize in place, move to museums) against the list, but keep that to a few lines; the criteria are what I need.

  Separate what is settled here from what is genuinely contested among people who work on the topic, and do not present a contested position as the consensus; where you are unsure, say so. Please write in British English.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Advisor to a municipal commission on contested commemorations.
      *   **Task:** Write *desiderata* (criteria/requirements) for a theory of commemoration usable by the commission. Not a verdict, but a specification.
      *   **Scope:** One year timeline, various types of commemorations (statues, school names, street names, university hall, propaganda monument), advisory role only, live disagreement context.
      *   **Specific Claims to Test:** Zero-sum nature of honor, fixed vs. accumulated meaning, victim/perpetrator/collective distinctions, distinctness of remedial options (remove/relocate/contextualize/add), obligations to minorities.
      *   **Conflict Analysis:** Flag incompatible desiderata (e.g., administrability vs. sensitivity, equality vs. local attachment). Identify the single most exclusionary requirement.
      *   **Strategy Scoring:** Briefly score usual strategies against the list.
      *   **Epistemic Status:** Distinguish settled vs. contested issues. Do not present contested positions as consensus. Use British English.
      *   **Tone:** Philosophical, practical, nuanced, non-partisan (in the sense of not taking a side in the culture war, but taking the commission's constraints seriously).

  2.  **Deconstruct the Desiderata (The "Must-Haves"):**
      *   *Case Coverage:* Must handle individuals (good/bad/mixed), collectives, objects (propaganda vs. art), and naming (functional vs. honorific).
      *   *Distinctions:* Intent vs. Reception, Past vs. Present meaning, Honor vs. History.
      *   *Mechanism of Honor:* Is it scarce? (Zero-sum test).
      *   *Remedies:* Are removal, relocation, contextualization distinct?
      *   *Minority Rights:* What happens when the majority votes down minority heroes?
      *   *Practicality:* Must be usable by non-historians within a year.

  3.  **Drafting the Desiderata (Iterative Process):**
      *   *Draft 1 (Mental):* Needs to be fair. Needs to stop racism. Needs to keep history. Needs to be easy to use.
      *   *Critique 1:* Too vague. "Fair" is contested. "Keep history" is contested.
      *   *Draft 2 (More precise):* Must distinguish between honoring and recording. Must address the zero-sum question. Must handle collective guilt. Must define what removal actually *does*.
      *   *Refining for the Prompt:* I need to frame these as *requirements for a theory*, not just rules for the commission. The theory must *explain* these things to be usable.

      *   *Key Desideratum 1: The Function of Commemoration.* Is it education or honor? A theory must distinguish these. (Settled: they are different. Contested: which dominates).
      *   *Key Desideratum 2: The Zero-Sum Question.* A theory must state if space is scarce. (Contested: Some say civic space is finite, others say it's expandable).
      *   *Key Desideratum 3: Semantic Drift.* Can meaning change? (Settled: Yes, reception matters. Contested: Does it override intent?).
      *   *Key Desideratum 4: Collective vs. Individual.* (Settled: Collectives are different. Contested: How to judge them).
      *   *Key Desideratum 5: Remedial Distinctness.* Is moving a statue different from adding a plaque? (Contested: Some say removal is erasure, others say it's necessary for safety/dignity).
      *   *Key Desideratum 6: Minority Protection.* (Settled: Liberal democracies owe protection. Contested: Does this extend to *commemorative* space specifically against majority will?).
      *   *Key Desideratum 7: Administrability.* (Settled: Commission needs to finish in a year. Contested: Can nuanced theory be operationalized?).

  4.  **Addressing the Specific Claims to Test:**
      *   *Zero-Sum:* I need to present this as an open question the theory must answer, noting the arguments on both sides.
      *   *Meaning:* Intent vs. Reception. This is a classic hermeneutic debate.
      *   *Collectives:* The "founding generation" problem.
      *   *Remedies:* Are they distinct? I should argue they have different expressive contents.
      *   *Minorities:* The "tyranny of the majority" in symbolic space.

  5.  **Identifying Conflicts (The "Tensions"):**
      *   *Administrability vs. Sensitivity:* High nuance takes time/expertise.
      *   *Consistency vs. Local Attachment:* Treating like cases alike might ignore why *this* statue matters to *this* town.
      *   *Neutrality vs. Justice:* A theory that doesn't take a moral stand might preserve injustice; one that does might look partisan.
      *   *Selection:* The prompt asks to flag *any* pair and pick the *single most exclusionary requirement*.
      *   *Decision:* Administrability vs. Context-Sensitivity is the classic bureaucratic tension. But the *most exclusionary* requirement is likely the one about *Minority Protection vs. Majoritarian Decision*. Or perhaps the distinction between *History and Honor*. Let's go with the **History vs. Honor** distinction. If a theory cannot separate "recording history" from "conferring honor," it fails almost every case.

  6.  **Scoring Strategies:**
      *   *Leave Everything:* Fails the honor/harm test.
      *   *Remove Everything Objectionable:* Fails the history/education test.
      *   *Contextualize:* Good middle ground, but administratively heavy.
      *   *Relocate:* Expensive, might just hide the problem.

  7.  **Structure and Tone:**
      *   British English (e.g., "honour", "programme", "centre").
      *   Formal, advisory tone.
      *   Clear headings.
      *   Explicitly mark "Settled" vs. "Contested".

  8.  **Refining the Content (Self-Correction during drafting):**
