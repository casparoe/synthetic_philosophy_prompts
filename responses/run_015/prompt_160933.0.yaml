      *   Ensure the distinction between the Commission's task and the Theory's task is clear.
      *   Make sure the "Settled vs. Contested" notes are visible.

  *(Self-Correction on the "Single Requirement"):* The prompt asks which requirement excludes the most candidate theories. If a theory cannot distinguish between *honouring* and *recording*, it collapses the distinction between a museum and a shrine. This is a very strong filter. I will select that.

  *(Self-Correction on Conflicts):* Administrability vs. Sensitivity is the obvious one. I will elaborate on that.

  10. **Final Review against constraints:**
      *   British English? Yes.
      *   Desiderata format? Yes.
