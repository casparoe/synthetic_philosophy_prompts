  *Wait, one nuance:* The prompt asks me to "test rather than assume" certain claims. I need to make sure the desiderata reflect the *need* for the theory to resolve these, not just assert my own view. For example, on zero-sum: The desideratum is "The theory must specify whether civic honour is scarce."

