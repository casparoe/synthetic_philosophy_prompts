  # JOINT STATEMENT ON MARXIST INTERPRETATIONS OF TECHNOLOGY AND AUTOMATION

  **Preamble**
  We, the undersigned participants in this adversarial collaboration, representing the Productive-Force Determinist and Social-Form Mediator interpretive camps, affirm our commitment to a rigorous engagement with Marx's critique of political economy. While we maintain distinct theoretical conclusions regarding the trajectory of capitalism and the role of automation, we recognize a shared foundational framework derived from Marx's analysis of the labor process, value theory, and the dynamics of capital accumulation. This document codifies our points of convergence, delineates our irreducible disagreements, and identifies the empirical and theoretical cruxes required for future resolution.

  ### I. AGREED CLAIMS

  Both camps endorse the following propositions as accurate representations of Marx's theoretical architecture, without prejudice to their divergent conclusions regarding historical teleology:

  1.  **Formal and Real Subsumption:** Marx distinguishes between two modes by which capital dominates labor. *Formal subsumption* occurs when capital takes control of an existing labor process without fundamentally altering its technical nature, extending surplus value primarily through the lengthening of the working day. *Real subsumption* occurs when capital revolutionizes the technical and social conditions of the labor process itself, altering the mode of production to increase productivity. Both camps agree that capitalism historically tends toward real subsumption, though they disagree on the limits of this tendency.
  2.  **Socially Necessary Labor Time (SNLT):** The magnitude of value is determined by the labor time required to produce a commodity under normal conditions of production and with the average degree of skill and intensity prevalent at the time. Both camps agree that the introduction of machinery alters the SNLT by reducing the labor time required for individual commodities, thereby devaluing existing commodities and labor power.
  3.  **Machinery and Relative Surplus Value:** The primary capitalist imperative for introducing machinery is not the reduction of toil per se, but the production of *relative surplus value*. By increasing productivity in sectors producing wage goods or inputs, machinery reduces the value of labor power, thereby increasing the portion of the working day dedicated to surplus value. Both camps agree that machinery is fixed capital that transfers value to the product but creates no new value itself; only living labor creates new value.
  4.  **Material Process vs. Valorization Strategy:** A distinction must be maintained between technological change as a *material process* (the expansion of human productive capacity and knowledge) and technological change as a *valorization strategy* (the deployment of technology solely to serve the self-expansion of value). Both camps agree that under capitalism, the material potential of technology is constrained, distorted, or directed by the requirements of valorization.
  5.  **The Contradictory Role of Fixed Capital:** Both camps agree that Marx identifies a contradiction wherein capital seeks to reduce necessary labor time to a minimum to maximize surplus value, yet simultaneously relies on labor time as the sole measure and source of value. Machinery represents the objectification of social knowledge (general intellect) that stands opposed to the living worker, yet its deployment is governed by the profit motive.

  ### II. DISAGREEMENTS TABLE

  The following table articulates the residual divergence between the two camps. Each position is formulated to be acceptable to its proponents while remaining intelligible to its opponents.

  | Feature | Productive-Force Determinist Position | Social-Form Mediator Position |
  | :--- | :--- | :--- |
  | **The Trajectory of Automation** | The development of automation constitutes an objective structural tendency internal to capital that progressively renders direct labor-time an inadequate measure of wealth. This tendency operates irrespective of immediate political interventions, pushing the system toward a point where the law of value is structurally undermined. | The development of automation is always mediated by the social form of value. Capital actively suppresses, distorts, or reverses the labor-saving potential of technology whenever it threatens the preservation of labor-time as the measure of wealth. There is no automatic trajectory toward the obsolescence of value. |
  | **The "Fragment on Machines"** | This text describes a historical limit-case that capital inevitably approaches: the point where the production of wealth depends less on labor time and more on the power of the agencies set in motion during labor time (science and technology). | This text describes a contradiction that capital must manage, not a destination it must reach. Capital prevents the "general intellect" from becoming an independent productive force that bypasses value relations. |
  | **Conditions for Transcendence** | The technological conditions for post-capitalism are generated by capitalism itself through the automation of production. The political task is primarily to seize and redirect an apparatus that has already outgrown the value form. | The technological conditions for post-capitalism are not generated automatically. The value form actively reshapes technology to fit its logic. Transcendence requires the prior or simultaneous political restructuring of ownership and social relations to liberate technology from valorization. |
  | **Nature of the Crisis** | Crisis arises fundamentally from the *success* of automation in displacing living labor, leading to a structural decline in the rate of profit and the breakdown of value measurement. | Crisis arises from the *failure* to fully automate or the *counter-tendencies* employed to maintain exploitation. The system persists by expanding into new spheres of labor or intensifying extraction, not by reaching a technical limit. |

  ### III. CRUCES AND EMPIRICAL PREDICTIONS

  The following sub-questions represent the exact points of friction where theoretical resolution requires empirical adjudication or further conceptual clarification. For each crux, we identify a concrete case and the divergent predictions offered by each camp.

  #### Crux 1: The Status of the General Intellect
  *   **Question:** Does the "general intellect" (social knowledge, science, code) denote an emerging actual productive force that is outgrowing the value form, or is it a speculative limit-case that capital successfully prevents from actualizing as an independent source of wealth?
  *   **Concrete Case:** The development of Open Source Software and Large Language Models (AI).
  *   **Determinist Prediction:** The proliferation of open-source code and AI generation demonstrates that wealth creation is becoming decoupled from direct labor time. Capital's attempts to enclose this (via IP, APIs) are reactive barriers against a tide that has already structurally bypassed the law of value.
  *   **Mediator Prediction:** Open source and AI are rapidly re-subsumed under capital (e.g., cloud monetization, proprietary datasets, rent extraction). The "free" nature of the code is a subsidy to capital that lowers the value of constant capital, thereby *reinforcing* the law of value rather than dissolving it.

  #### Crux 2: Algorithmic Management and Subsumption
  *   **Question:** Does contemporary platform-based algorithmic management (e.g., in logistics, warehousing, gig work) represent a high stage of real subsumption pushing toward labor reduction, or a novel hybrid of formal/real subsumption designed to intensify labor extraction?
  *   **Concrete Case:** Predictive scheduling and robotics in Amazon fulfillment centers.
  *   **Determinist Prediction:** This represents the intensification of real subsumption aimed at the eventual elimination of the human worker. The algorithm is the prototype of the "automatic factory," signaling the long-term displacement of labor even if humans remain temporarily as stopgaps.
  *   **Mediator Prediction:** This represents a reversion to *formal* subsumption tactics (intense surveillance, pace-setting) applied to low-wage labor. The technology is used not to replace labor, but to squeeze more labor-time out of the worker to compensate for the lack of productivity gains found in heavy automation. It preserves the relevance of labor-time measurement.

  #### Crux 3: Sustainability of the Rate of Surplus Value
  *   **Question:** Can the rate of surplus value be sustained indefinitely by counter-tendencies (cheapening of machinery, expansion of unproductive labor, global expansion), or must it eventually collapse under the weight of full automation?
  *   **Concrete Case:** The trajectory of manufacturing automation and profit rates in advanced economies from 1950 to the present.
  *   **Determinist Prediction:** Long-term data will show a secular tendency for the rate of profit to decline despite counter-measures, correlating with increases in the organic composition of capital (more machines, fewer workers). The post-1970s stagnation is evidence of this structural limit.
  *   **Mediator Prediction:** Profit rates are cyclical and restored through crises that devalue capital and restructure labor markets. The persistence of capitalism post-1970s via financialization and service sector expansion proves that counter-tendencies are effective indefinitely, provided political conditions allow for the expansion of exploitable labor spheres.

  ### IV. CLASSIFICATION OF DISAGREEMENTS

  Upon review of the above positions, we classify the nature of our remaining divergences as follows:

  1.  **Substantive Disagreements:**
      *   **Empirical Trajectories:** The disagreement regarding Crux 3 (Profit Rates) is substantive. It relies on conflicting interpretations of economic data and the efficacy of counter-tendencies. Resolution requires agreed-upon econometric methodologies.
      *   **Systemic Limits:** The disagreement regarding whether capital *can* function without labor-time as a measure (Crux 1) is substantive. It concerns the ontological limits of the value form itself.

  2.  **Verbal/Definitional Disputes:**
      *   **The Definition of "Determination":** A portion of the conflict dissolves when clarifying terminology. When Determinists speak of "technological determination," they refer to the *structural pressure* exerted by competition to innovate. When Mediators reject "determinism," they refer to the *outcome* of that pressure being contingent on class struggle and social relations. Once it is agreed that technology exerts pressure but does not guarantee outcomes, this specific friction is verbal.
      *   **The Meaning of "Tendency":** Disagreement often arises over whether a "tendency" implies an unstoppable force (Determinist usage) or a vector that is constantly acted upon by counter-vectors (Mediator usage). Adopting Marx's own formulation of the law of the falling rate of profit as a "tendency" that is always checked by "counter-tendencies" resolves this semantic dispute, leaving only the question of which vector dominates in the long run as the substantive remainder.

  ***

  **Signed,**

  *Representatives of the Productive-Force Determinist Camp*

  *Representatives of the Social-Form Mediator Camp*

  *Date: October 26, 2023*
