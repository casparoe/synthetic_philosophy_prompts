answer: |-
  **Mara:** Let's look at the Lunar Settlement again, Jonas. We have a permanent population of five thousand living in the Shackleton Crater. They grow some food, but their water reclamation and atmospheric scrubbing depend on heavy isotopes shipped from Earth. Earth's parliament votes on the budget for those shipments. If Earth votes to cut funding, the Lunarians suffocate. Under my view, that causal chain draws the boundary of the *demos*. The Earth parliament exercises power that systematically shapes the fundamental interests of the Lunarians. Therefore, the Lunarians must be authorized participants in that Earth parliament. To deny them the vote is to subject them to a will they cannot shape. That is the definition of domination.

  **Jonas:** I agree that domination is the evil we seek to avoid, Mara, but I disagree that impact alone constitutes the relationship of democratic membership. You are describing a relationship of dependency, perhaps even vulnerability, but not necessarily a political community. If I depend on a farmer for food, I am affected by his decisions, but I am not his constituent. In your Lunar case, Earth is voting on the Lunarians' survival without ever standing in the same room, without sharing the same air, without the possibility of face-to-face accountability. That isn't democracy; it's remote administration. If the Lunarians are to be free, they cannot be a minority voting district in an Earth legislature. They must constitute their own independent *demos*, capable of deliberating on their own survival.

  **Mara:** But that independence is a fiction in this scenario. You suggest they form their own *demos*, but they cannot control the supply chain. If the Lunar *demos* votes to prioritize a new hospital over isotope filters, but Earth's *demos* votes to cut the isotope shipment, the Lunar decision is null. Their "self-rule" is an illusion if the conditions of their existence are determined externally. This is where the recursive authorization matters. The authority flows both ways. Earth's decision affects the Moon, yes, but the Moon's existence also affects Earth—resource drain, strategic positioning, moral liability. If we draw the boundary at the Earth's atmosphere, we allow Earth citizens to make decisions that externalize costs onto the Lunarians. The *demos* must expand to include everyone caught in that loop of justification. It's not about being in the same room; it's about being bound by the same consequences.

  **Jonas:** You are conflating the *scope* of a problem with the *site* of its solution. Just because Earth holds the lever doesn't mean Earth should pull it for everyone. Consider the tension you introduced: the life-support systems. If the Lunarians' air depends on Earth's budget, then Earth holds a veto over Lunar life. If you integrate the Lunarians into the Earth *demos*, you dilute the Earth citizens' agency over their own resources without solving the physical distance problem. An Earth voter cannot deliberate meaningfully on the pressure seals in the Shackleton Crater. They lack the context. By your logic, because the Lunarians are affected by Earth, Earth is affected by the Lunarians, so we merge the *demos*. But this creates a "demos" that cannot meet, cannot deliberate, and cannot enforce a shared will. It becomes a ghost body. Democracy requires a "we" that can act in concert, not just a collection of people who suffer from the same distant laws.

  **Mara:** I think you're prioritizing the ritual of deliberation over the substance of freedom. You say they can't act in concert because of distance. But they *are* acting in concert, involuntarily. Every time Earth sends a ship, they are enacting a policy on the Moon. The "we" already exists; it's just tyrannical because only one side holds the pen. My point about the life-support is crucial here. If the resource allocation is joint, the political authority must be joint. You worry about the "ghost body," but I worry about the "subject population." If you insist on two separate *demoi*—Earth and Moon—you legitimize a border where power actually flows freely across it. You grant Earth the right to decide the Moon's fate while granting the Moon no right to decide Earth's contribution. That isn't separation; it's colonialism dressed up as federalism. The boundary of the *demos* must track the boundary of coercion.

  **Jonas:** And there is the precise conceptual rift between us. You define the *demos* by the boundary of coercion—who is hit by the decision. I define the *demos* by the boundary of agency—who makes the decision together. In your view, the Lunarians belong in the Earth *demos* because they are coerced by Earth. But consider the reverse: Does the Earth citizen belong in the Lunar *demos*? If the Lunarians need the isotopes, they coerce Earth to produce them, or else the Moon dies and Earth bears the moral stain. If we follow your "recursive" logic, the Earth citizen must vote in Lunar elections too. But that is absurd. They cannot be present. So, you are forced to admit that some affected parties must be excluded from the deliberative body. Once you admit that, you admit that impact is not the sole criterion.

  **Mara:** It's not absurd if the decision is truly joint. But let's sharpen the disagreement. You claim that without physical co-presence or shared deliberative practices, there is no democratic legitimacy. I claim that without inclusion of all systematically affected interests, there is no democratic legitimacy. In the life-support case, the Earth citizen *is* making a decision for the Lunarian. If the Earth citizen votes "no funding," the Lunarian dies. The Earth citizen is exercising power over the Lunarian. If the Lunarian cannot vote "no," the power is unilateral. You argue the Lunarians should form their own *demos* to gain legitimacy. But a *demos* that cannot secure its own preconditions of existence is not a sovereign agent; it is a petitioners' club. My view forces the Earth to recognize that their "internal" budget vote is actually an "external" act of governance.

  **Jonas:** But your solution dissolves the agent entirely. If everyone affected by a decision must be inside the *demos*, the *demos* becomes global and amorphous the moment a supply chain extends. You lose the capacity for distinct political projects. My argument is that the Lunarians *must* become sovereign, even if that means negotiating treaties with Earth rather than voting in Earth elections. The legitimacy comes from the Lunarians looking each other in the eye and saying, "We accept these risks." If Earth controls the isotopes, then Earth and Luna need a treaty of trade, not a merger of polities. Democracy happens *within* the polity; justice happens *between* them. You are trying to solve a problem of international justice by expanding the definition of domestic democracy.

  **Mara:** And you are trying to solve a problem of structural tyranny by pretending there are two distinct polities when there is only one integrated system of survival. If the life-support is integrated, the polity is integrated. A treaty assumes two equal parties. But if one party holds the off-switch for the other's air, they are not equal. A treaty cannot fix a power asymmetry that deep; only shared authorship of the rules can. So, we arrive at the core disagreement. For you, democratic membership is a capacity for shared action—a "can we do this together?" For me, democratic membership is a protection against subjection—a "can you do this to me?"

  **Jonas:** Precisely. I am arguing that democracy is a practice of collective freedom. You cannot be collectively free with people you cannot meet, argue with, or hold accountable in real-time. You are arguing that democracy is a shield against heteronomy. You believe that if I am subject to a rule, I must have authored it. But in the Lunar case, the physical reality prevents shared authorship. So we have a choice: do we stretch the concept of authorship until it breaks, as you do, to cover the affected? Or do we acknowledge that some relationships are too asymmetrical for democracy and require different norms of justice?

  **Mara:** I would say we acknowledge that the relationship is too integrated for separate democracies. If the "physical reality prevents shared authorship," then the physical reality is anti-democratic, and we must change the governance to match the integration, not the other way around. If the technology binds us, the *demos* must bind us. To say otherwise is to say that democracy is only possible among those who are already independent. But the point of the boundary problem is to determine independence. You assume the boundary to define the *demos*; I use the *demos* to reveal the boundary.

  **Jonas:** Then we are left with this: You see the *demos* as a circle drawn around a web of consequences. I see it as a circle drawn around a table of deliberation. In the Lunar case, your circle encompasses the Earth and Moon because the web connects them. My circle must remain small enough for the deliberation to be real. If the web is too wide for the table, you cannot have democracy. You can only have administration. And if we must choose between a global administration that claims to be democratic and a local democracy that acknowledges its limits, I choose the latter.

  **Mara:** And I choose the former, because a local democracy built on the subjection of others is no democracy at all. It is merely a club of beneficiaries. But I am glad we have located the fault line. It is not about the isotopes or the distance. It is whether the *demos* is defined by the reach of power or the practice of partnership.

  **Jonas:** Agreed. And until we resolve whether democracy is primarily about shielding interests or enacting agency, the Lunar settlers will remain in limbo. Neither Earth's subjects nor their own masters.

  **Mara:** Then we have work to do.
