answer: |-
  This is a request for a system specification. Given your background, I will treat this as an engineering constraint problem. You are looking for a theory of moral responsibility (MR) that functions as a stable "effective theory" at the macro-level, without violating the "fundamental physics" at the micro-level.

  The frustration you feel regarding Frankfurt-style cases (the "backup device" scenarios) is common among scientists. It stems from a violation of **counterfactual robustness**: if the outcome is fixed regardless of the internal state dynamics (due to the backup), the internal dynamics (the "choice") appear causally redundant regarding the *necessity* of the outcome.

  Here is the spec for an adequate theory of Moral Responsibility.

  ### I. The Desiderata (System Requirements)

  I have categorized these by function. **NN** = Non-Negotiable (any theory failing this is usually discarded as useless or false). **CP** = Camp Preference (acceptable to drop if necessary to save NN requirements).

  #### A. Intuitive Test Cases (The Validation Suite)
  | ID | Requirement | Case/Consideration | Priority |
  | :--- | :--- | :--- | :--- |
  | **TC-1** | **The Coercion Constraint** | Must exonerate agents acting under direct physical compulsion or immediate threat of death (e.g., hand forced on trigger). | **NN** |
  | **TC-2** | **The Premeditation Constraint** | Must assign responsibility to agents who deliberate, plan, and execute harm without external coercion. | **NN** |
  | **TC-3** | **The Ignorance Constraint** | Must mitigate responsibility for actions taken under non-culpable ignorance (didn't know the gun was loaded). | **NN** |
  | **TC-4** | **The Frankfurt Intuition** | Must account for the intuition that an agent *is* responsible in Frankfurt cases (where they choose X, and a device would have forced X had they chosen Y). | **CP** |
  | **TC-5** | **The Manipulation Constraint** | Must distinguish between normal deterministic causation (upbringing/genes) and covert external manipulation (brainwashing/neuro-stimulation). | **NN** |

  #### B. Metaphysical & Causal Constraints
  | ID | Requirement | Case/Consideration | Priority |
  | :--- | :--- | :--- | :--- |
  | **MC-1** | **Causal Closure** | Must not violate the causal closure of the physical world (no "magic" mental forces overriding micro-physics). | **NN** |
  | **MC-2** | **The Control Principle** | An agent is responsible only if they exercise control over the action. | **NN** |
  | **MC-3** | **The Principle of Alternative Possibilities (PAP)** | An agent is responsible only if they could have done otherwise in that exact moment. | **CP** |
  | **MC-4** | **Ultimate Origination** | The agent must be the *ultimate source* of the action (the causal chain cannot trace back entirely to factors prior to the agent's existence). | **CP** |

  #### C. Functional & Social Constraints
  | ID | Requirement | Case/Consideration | Priority |
  | :--- | :--- | :--- | :--- |
  | **FC-1** | **Forward-Looking Utility** | The theory must support practices that reduce future harm (deterrence, rehabilitation, quarantine). | **NN** |
  | **FC-2** | **Backward-Looking Desert** | The theory must support retributive blame (punishment because they *deserve* it, not just for safety). | **CP** |
  | **FC-3** | **Legal/Moral Distinction** | Must distinguish between legal liability (strict liability, negligence) and moral blameworthiness (inner state/character). | **NN** |

  #### D. Empirical Constraints
  | ID | Requirement | Case/Consideration | Priority |
  | :--- | :--- | :--- | :--- |
  | **EC-1** | **Neuroscientific Consistency** | Cannot contradict data on unconscious initiation (e.g., Libet-style findings) or neural correlates of decision-making. | **NN** |
  | **EC-2** | **Psychological Realism** | Must accommodate gradations of capacity (addiction, psychopathy, development, fatigue). | **NN** |

  ---

  ### II. Incompatible Pairs (Trade-Offs)

  You cannot satisfy all NN requirements simultaneously. You must break a constraint.

  1.  **MC-1 (Causal Closure) vs. MC-4 (Ultimate Origination).**
      *   *Conflict:* If the physical world is causally closed (MC-1), every event is caused by prior events. If you trace the cause of an action back, you hit genetics/environment prior to the agent's birth. Thus, the agent is never the *ultimate* source (MC-4 fails).
      *   *Resolution:* Drop MC-4 (Compatibilism) or Drop MC-1 (Libertarianism).

  2.  **MC-3 (PAP) vs. TC-4 (Frankfurt Intuition).**
      *   *Conflict:* Frankfurt cases are designed specifically to show that we hold people responsible even when they *could not* have done otherwise (due to the backup device). If you keep PAP (MC-3), you must say the agent in the Frankfurt case is *not* responsible. Most people intuitively feel they *are*.
      *   *Resolution:* Drop MC-3 (most modern philosophy) or Reject TC-4 (argue the intuition is wrong).

  3.  **FC-2 (Desert) vs. MC-1 (Causal Closure).**
      *   *Conflict:* If determinism holds (implied by MC-1), "desert" becomes metaphysically shaky. Why does an agent *deserve* punishment for a state of affairs determined by the Big Bang?
      *   *Resolution:* Drop FC-2 (Hard Incompatibilism/Quasi-Compatibilism) or argue Desert is compatible with Determinism (Compatibilism).

  ---

  ### III. Contender Scorecard

  Here is how the three main architectures perform against the spec.

  | Requirement | **Compatibilism** (Dominant Academic View) | **Libertarianism** (Folk Intuition) | **Hard Incompatibilism** (Scientific/Skeptic View) |
  | :--- | :--- | :--- | :--- |
  | **TC-1 (Coercion)** | **Pass.** Distinguishes coercion from normal desire. | **Pass.** | **Pass.** |
  | **TC-2 (Premeditation)** | **Pass.** | **Pass.** | **Fail.** (Often denies *moral* responsibility, keeps legal). |
  | **TC-5 (Manipulation)** | **Fail/Struggling.** Hard to distinguish determinism from brainwashing historically. | **Pass.** (Agent is uncaused cause). | **Pass.** (Neither are responsible). |
  | **MC-1 (Physics)** | **Pass.** Accepts determinism/probabilistic physics. | **Fail.** Requires non-physical causation or indeterministic gaps. | **Pass.** |
  | **MC-3 (PAP)** | **Fail.** Redefines "could have done otherwise" as "would have, if asked." | **Pass.** | **Fail.** |
  | **MC-4 (Ultimacy)** | **Fail.** Accepts you are a product of prior causes. | **Pass.** | **Fail.** |
  | **FC-2 (Desert)** | **Pass.** Argues desert is compatible with determinism. | **Pass.** | **Fail.** Rejects basic desert. |
  | **EC-1 (Neuro)** | **Pass.** | **Fail.** | **Pass.** |

  ---

  ### IV. The Killer Requirement

  You asked for the single requirement that knocks out the most popular theories.

  **The Requirement:** **MC-4 (Ultimate Origination)**.
  *Definition: To be morally responsible, the agent must be the ultimate causal source of the action, meaning the causal chain cannot be fully explained by factors external to the agent (prior to their agency).*

  **Why it is the Killer:**
  1.  **It kills Compatibilism (The Academic Standard):** Compatibilism is the most held view in professional philosophy. It explicitly rejects MC-4. It argues you can be responsible even if your character was formed by genes and environment you didn't choose. If you mark MC-4 as **NN**, Compatibilism collapses immediately.
  2.  **It kills Hard Incompatibilism (The Scientific Standard):** This view agrees with Compatibilism that MC-4 is impossible, but concludes that therefore *no one* is responsible. If you demand MC-4 be satisfied for responsibility to exist, this theory fails to deliver responsibility.
  3.  **It endangers Libertarianism (The Folk Standard):** While Libertarianism *tries* to satisfy MC-4, it usually fails **MC-1 (Causal Closure)**. To be the ultimate source, you need a break in the physical causal chain. Physics generally forbids this. So MC-4 forces a violation of physics.

  **Why this explains your Frankfurt frustration:**
  The Frankfurt case feels unsatisfying to you because it violates the spirit of **MC-2 (Control)** via **MC-4 (Ultimacy)**.
  In the Frankfurt case, the agent *thinks* they are the ultimate source. But the spec of the case reveals they are not: the *necessity* of the outcome is guaranteed by the device, not the agent's volition. The agent's volition is epiphenomenal regarding the *fixity* of the future.
  To a physicist, this looks like a system where the macro-variable (Choice) is decoupled from the constraint equation (Outcome). If the Outcome is fixed by a boundary condition (the Device) regardless of the Variable, the Variable has no causal leverage.

  Most philosophers argue we should drop MC-4 (Ultimacy) to save the system. They argue responsibility is a macro-level property (like "temperature" or "solidity") that doesn't require micro-level ultimacy.
  Your intuition—that the Frankfurt case is cheating—is a refusal to drop MC-4. You sense that without Ultimate Origination, "responsibility" is just a label we paste onto deterministic causal chains, not a real feature of the agent.

  **Recommendation:**
  If you want to preserve the intuition that the Frankfurt case is wrong, you must mark **MC-3 (PAP)** or **MC-4 (Ultimacy)** as **NN**.
  If you do that, you must accept that **no known theory satisfies the full spec.** You will be forced toward **Hard Incompatibilism** (responsibility is an illusion) or a **Revisionist Libertarianism** (physics is incomplete).

  The "rabbit hole" is confusing because the spec is over-constrained. You cannot have Causal Closure, Ultimate Origination, and Moral Responsibility simultaneously. One must go. Most philosophers drop Origination. Your physicist intuition wants to keep it. That is the root of the conflict.
