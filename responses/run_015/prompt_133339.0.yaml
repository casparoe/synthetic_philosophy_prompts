  # JOINT STATEMENT ON SARTREAN FREEDOM AND FACTICITY
  **A Record of Adversarial Collaboration**

  **Date:** 24 May 2024
  **Signatories:** The Radical Freedom Working Group & The Situated Constraint Working Group

  Following a series of good-faith dialectical exchanges regarding the interpretation of Jean-Paul Sartre's ontology and ethics, the undersigned parties hereby publish this joint statement. While we remain divided on significant ethical and phenomenological conclusions, we have achieved consensus on the formal ontological structures underpinning the dispute. This document serves to clarify the precise locus of our disagreement, thereby preventing future dialogue from conflating ontological claims with phenomenological descriptions.

  ### PART I: AGREED ONTOLOGICAL AND ETHICAL CLAIMS

  Both parties affirm the following propositions as accurate descriptions of the Sartrean framework within which this debate is situated. We agree that any deviation from these premises constitutes a departure from Sartrean existentialism rather than an interpretation of it.

  1.  **The Ontological Distinction:** We affirm the fundamental distinction between Being-in-itself (*l'en-soi*), which is complete, self-identical, and devoid of negation, and Being-for-itself (*le pour-soi*), which is consciousness, characterised by negation, lack, and the perpetual flight from self-identity.
  2.  **The Pre-Reflective Cogito:** We agree that consciousness is primarily pre-reflective. Before any thematic knowledge of the self exists, there is a non-positional awareness of consciousness. This pre-reflective layer is the site where freedom originates and where bad faith must necessarily take root.
  3.  **The Structure of Bad Faith:** We concur that bad faith is a specific type of self-deception wherein the deceiver and the deceived are one and the same consciousness. It requires that the agent possesses an implicit awareness of the truth they are denying; one cannot flee what one does not, in some sense, know.
  4.  **The Inseparability of Freedom and Facticity:** We agree that freedom and facticity are mutually constitutive. There is no freedom without a situation to transcend, and facticity only appears as 'facticity' (rather than mere brute existence) through the nihilating action of freedom. They are inseparable yet irreducible to one another.
  5.  **The Framing of Facticity as Resistance:** For the purposes of this collaboration, we agree to analyse facticity not as a static givenness, but as an active 'resistance'. We further agree that the core dispute concerns the locus of this resistance: specifically, whether this resistance operates *internally* to the structure of freedom (as the coefficient of adversity that freedom creates for itself) or as an *external* boundary upon it (as a limit imposed by the world and others that restricts the scope of possible projects).

  ### PART II: TABLE OF DISAGREEMENTS

  The following table delineates the precise points of divergence. Column (i) records the specific claim each party maintains. Column (ii) offers a neutral formulation of the dispute acceptable to both. Column (iii) identifies the philosophical crux, the resolution of which would settle the matter.

  | Row | (i) Precise Disagreement (Party Wording) | (ii) Neutral Formulation of Dispute | (iii) The Crux |
  | :--- | :--- | :--- | :--- |
  | **1** | **RF:** Freedom is ontologically absolute; constraints are merely the *adversity* freedom chooses to encounter.<br>**SC:** Freedom is phenomenologically mediated; structural power operates as a genuine *limit* on the scope of agency. | Does the experience of constraint describe a limitation on the *power* of freedom, or merely the *adversity* of the situation freedom has chosen to engage? | Whether freedom is a metaphysical constant or a variable capacity dependent on material and social conditions. |
  | **2** | **RF:** Pre-reflective consciousness always retains the resource to recognise its own denial; awareness is never fully extinguished.<br>**SC:** Oppressive conditions can systematically suppress the pre-reflective awareness required to recognise denial, rendering the choice impossible. | Can the pre-reflective awareness necessary for bad faith be structurally eroded, or does it remain an inalienable feature of consciousness regardless of circumstance? | Whether the 'truth' one flees in bad faith is always accessible to the agent, or if access to that truth can be causally blocked. |
  | **3** | **RF:** All bad faith is culpable; to deny freedom is to choose to deny it, making the agent responsible for the denial.<br>**SC:** Bad faith can be a non-culpable adaptation; when agency is suppressed, the 'choice' to deny it is not morally attributable to the agent. | Does the ontological structure of bad faith entail universal moral responsibility, or does moral culpability depend on the agent's capacity to access their own freedom? | Whether ethics follows ontology directly, or whether ethical judgement requires a prior assessment of the agent's situational capacity. |
  | **4** | **RF:** Social conditions are occasions for freedom, not causes of unfreedom; they provide the terrain but never the motive force.<br>**SC:** Social structures are causal determinants of unfreedom; they shape the psyche such that certain choices become phenomenologically invisible. | Do social structures function as the *context* in which free choices are made, or as *generative mechanisms* that produce specific states of consciousness (including unfreedom)? | Whether the social world is transcended by consciousness or whether consciousness is, in part, produced by the social world. |

  ### PART III: CONCRETE CASES AND PREDICTIVE ANALYSES

  For each crux identified above, we have selected a concrete case or thought experiment upon which both parties agree is relevant. We record here the shared observation regarding the case, followed by each party's explicit prediction regarding what a rigorous phenomenological analysis of that case must reveal.

  **1. Case for Crux 1 (The Nature of Constraint)**
  *   **The Case:** *The Political Prisoner.* An individual is incarcerated in a high-security facility with no possibility of parole. They state, "I have no freedom."
  *   **Shared Relevance:** Both parties agree this case tests the limit of the claim that one is "condemned to be free." It isolates physical constraint from social ambiguity.
  *   **Radical Freedom Prediction:** Analysis will reveal that while the prisoner's *facticity* is severely restricted, their *ontological* freedom remains absolute. The statement "I have no freedom" will be shown to be a project of bad faith, wherein the prisoner chooses to define themselves solely as an object (in-itself) to escape the anguish of imagining mental resistance, suicide, or reinterpreting their incarceration.
  *   **Situated Constraint Prediction:** Analysis will reveal that the prisoner's *phenomenological field* of possibilities has been so reduced that the exercise of freedom is effectively nullified. The statement "I have no freedom" is not a lie, but an accurate description of a world where the 'resistance' of facticity has become an external wall that transcendence cannot penetrate without magical thinking.

  **2. Case for Crux 2 (Pre-Reflective Resources)**
  *   **The Case:** *The Survivor of Prolonged Trauma.* A subject subjected to long-term coercive control exhibits dissociation and insists they never had agency during the abuse, even when retrospective analysis suggests moments of potential leverage.
  *   **Shared Relevance:** This case tests the accessibility of the pre-reflective cogito. It asks whether the 'knowledge' required for bad faith can be psychologically buried.
  *   **Radical Freedom Prediction:** Analysis will uncover a pre-reflective awareness of choice that the subject is actively fleeing. The dissociation will be interpreted as a protective strategy chosen by consciousness to avoid the guilt of having survived or the terror of having had to choose under duress. The resource to choose was present, however horrific the options.
  *   **Situated Constraint Prediction:** Analysis will demonstrate that the trauma has altered the structure of consciousness itself, fragmenting the pre-reflective cogito. The 'choice' was not fled but rendered unavailable by a psyche adapted to survival. The denial of agency is a symptom of structural violence, not a culpable act of self-deception.

  **3. Case for Crux 3 (Moral Culpability)**
  *   **The Case:** *The Reluctant Collaborator.* A civil servant in an authoritarian regime processes paperwork facilitating deportation, claiming, "I was just following orders; I had no choice or I would lose my pension and safety."
  *   **Shared Relevance:** This case isolates the ethical dimension. It questions whether the pressure of the situation mitigates the moral failure of bad faith.
  *   **Radical Freedom Prediction:** Analysis will confirm the collaborator is culpable. The fear of losing safety is a value conferred by the collaborator's own freedom. By treating 'safety' as a deterministic cause, they are in bad faith. They chose complicity over risk, and must bear the moral weight of that choice.
  *   **Situated Constraint Prediction:** Analysis will show that the 'choice' is asymmetrical. The regime has structured the world such that the cost of refusal is disproportionately catastrophic. While ontologically free, the collaborator's moral culpability is mitigated or negated because the situation was designed to coerce the will, making the 'choice' a coerced adaptation rather than a spontaneous project.

  **4. Case for Crux 4 (Social Causality)**
  *   **The Case:** *The Systemically Impoverished Worker.* A worker in a gig-economy system asserts, "The algorithm decides my day; I am not free," citing the inability to plan more than an hour ahead due to algorithmic management.
  *   **Shared Relevance:** This case tests whether social structures can be causal determinants of consciousness or merely the background for choice.
  *   **Radical Freedom Prediction:** Analysis will reveal the worker is using the algorithm as an alibi. The worker chooses to submit to the algorithm to maximise income or minimise anxiety. The algorithm is a tool of their facticity; the belief that it determines them is a magical invocation of the in-itself to escape the burden of managing their own time and risk.
  *   **Situated Constraint Prediction:** Analysis will reveal that the algorithmic structure actively shapes the worker's temporal consciousness, making long-term planning phenomenologically impossible. The structure does not merely occasion a choice; it produces a specific type of constrained consciousness where the *appearance* of freedom is systematically removed. The structure is a causal determinant of the experience of unfreedom.

  ***

  **Signed,**

  *For the Radical Freedom Working Group*
  *For the Situated Constraint Working Group*
