      *(Refining Reactive Opacity)*: It's not just ignorance. It's the *maintenance* of the attitude despite knowing ignorance exists. Or maintaining it when the etiology is mixed (disease + habit). Let's define it as: maintaining the stance despite inaccessible causal facts.

