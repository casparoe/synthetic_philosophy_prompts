  *(Post-computation check)*: The prompt asks for "rigorous specification." I need to make sure the language is precise. "Constitutive" means the attitude *is* the holding responsible, not a reaction *to* it. This is key. If the attitude is constitutive, then feeling resentment *makes* them responsible in that moment. But the disease says they *aren't*. This is the contradiction to explore.

  Let's structure the response:
  1.  Introduction: Framing the FTD context as the stress test.
