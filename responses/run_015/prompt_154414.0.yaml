answer: |-
  ### The Constitutive Requirement: Desiderata for a Theory of Moral Responsibility

  Your situation—caring for a parent with frontotemporal dementia (FTD)—serves as a limit-case for moral theory. It is not merely an application of existing frameworks but a stress test that reveals where standard accounts fracture. A theory that treats reactive attitudes (resentment, gratitude, indignation) as *constitutive* of responsibility claims that these emotions are not merely responses to a pre-existing fact of responsibility; they are the very medium in which responsibility exists.

  If this constitutive claim is to hold water in the context of neuropathology and intimate care, it must satisfy the following desiderata.

  #### I. Phenomena to Explain

  **1. The Lag of Affect**
  *   **The Phenomenon:** In intimate relationships, resentment often persists long after the intellectual acceptance of an excuse. You may know cognitively that the insult was a symptom of FTD, yet the visceral sting remains for hours or days.
  *   **The Requirement:** The theory must explain why the *constitutive* element of responsibility (the attitude) decays at a different rate than the *judgment* of agency. If the attitude constitutes responsibility, does responsibility persist during the lag? If so, is the parent responsible during that lag? If not, is the caregiver's resentment irrational? The theory cannot simply dismiss this as "emotional inertia"; it must account for the normative status of the lag.

  **2. The Asymmetry of Excusing Conditions**
  *   **The Phenomenon:** Some causal explanations extinguish reactive attitudes entirely (e.g., a seizure causes the harm), while others only modulate them (e.g., extreme grief causes the harm). In FTD, the condition is global, yet specific harms feel differently weighted.
  *   **The Requirement:** The theory must distinguish between *exemptions* (which remove the agent from the moral community) and *modifications* (which contextualize the action within the community). It must explain why neuropathology often functions as an exemption theoretically, yet functions as a modification phenomenologically. A constitutive theory must explain how the same causal fact can fail to constitute an exemption in the lived experience of the caregiver.

  **3. The Necessity of the Objective Stance in Care**
  *   **The Phenomenon:** To provide safe, effective care, you must occasionally suspend participant reactive attitudes and view the parent as a patient to be managed (an object of policy or therapy).
  *   **The Requirement:** The theory must accommodate the *legitimacy* of this suspension without declaring the relationship dead. If reactive attitudes are the glue of human relationships, a theory must explain how a relationship survives periods of necessary objectification without collapsing into mere management.

  #### II. Distinctions to Preserve

  **4. Agent vs. Action Attitudes**
  *   **The Distinction:** We can feel indignation at an *act* while withholding blame from the *agent*. In FTD, the "agent" is eroding, but the "person" remains.
  *   **The Requirement:** The theory must allow for a decoupling of attitudes. It must distinguish between *holding an agent responsible* (which may be suspended) and *registering a moral violation* (which may remain). A constitutive account often conflates these; it must separate the attitude toward the *source* of the action from the attitude toward the *impact* of the action.

  **5. Retrospective vs. Prospective Responsibility**
  *   **The Distinction:** Blame looks backward (you did this); care looks forward (you must not do this again).
  *   **The Requirement:** In caregiving, the prospective demand ("do not hit me") often remains active even when the retrospective blame ("you are bad for hitting me") is withdrawn. The theory must explain how reactive attitudes can be reconfigured from retributive tools into prospective boundary-setting mechanisms without losing their moral character.

  #### III. Puzzles to Dissolve

  **6. Reactive Opacity**
  *   **The Puzzle:** We frequently maintain reactive attitudes when the causal etiology of harm is ambiguous or inaccessible. You may not know if a slight was dementia, fatigue, or residual agency. Yet, you feel the resentment.
  *   **The Requirement:** The theory must categorize this opacity.
      *   Is it **Rational?** (Does the attitude stand in for a probability judgment?)
      *   Is it **Heuristic?** (Is it a fast-and-frugal cognitive shortcut that is useful but not truth-tracking?)
      *   Is it **Erroneous?** (Are we blaming in the dark, risking injustice?)
      *   *Constraint:* A constitutive theory cannot simply call it erroneous without undermining the authority of the attitudes themselves. It must explain how responsibility can be constituted *under conditions of ignorance* without collapsing into guesswork.

  **7. The Paradox of Therapeutic Blame**
  *   **The Puzzle:** Sometimes, expressing resentment to a dementia patient can have therapeutic value (reality orientation), even if the blame is theoretically undeserved.
  *   **The Requirement:** If the attitude is constitutive of responsibility, using it instrumentally (to calm the patient) seems to corrupt it. The theory must explain how an attitude can be *sincerely felt* yet *strategically deployed* without becoming manipulation.

  ---

  ### Internal Tensions: Jointly Unsatisfiable Desiderata

  In constructing this architecture, you will encounter points of friction where satisfying one desideratum seemingly violates another. These are not bugs to be fixed, but structural limits of the concept.

  **Tension A: Phenomenological Fidelity vs. Normative Safety**
  *   **The Conflict:** To honor the *Lag of Affect* (Desideratum 1), the theory must validate the persistence of resentment even after exculpation. However, to ensure *Normative Safety*, the theory must prevent blame from attaching to non-agents.
  *   **The Implication:** You cannot fully validate the caregiver's resentment *and* fully protect the patient from unfair blame. A theory that prioritizes the caregiver's lived experience risks moralizing the disease. A theory that prioritizes the patient's innocence risks gaslighting the caregiver's pain.

  **Tension B: Universality of Practice vs. Selectivity of Suspension**
  *   **The Conflict:** Strawsonian accounts argue that reactive attitudes are universal and necessary for human community (Desideratum 3). Yet, caregiving requires the *selective suspension* of these attitudes to prevent burnout and ensure safety.
  *   **The Implication:** If the attitudes are truly constitutive of the relationship, suspending them should end the relationship. But in care, the relationship persists *through* suspension. A theory must explain how one can step out of the "participant stance" temporarily without exiting the moral community entirely.

  **Tension C: Opacity as Feature vs. Opacity as Bug**
  *   **The Conflict:** Regarding *Reactive Opacity* (Desideratum 6), if we treat opacity as a rational feature, we risk legitimizing blame based on ignorance. If we treat it as a bug, we undermine the authority of our everyday moral judgments, which are almost always opaque.
  *   **The Implication:** A theory must decide whether moral responsibility is a fact about the world (which opacity obscures) or a fact about our social negotiation (which opacity facilitates). It cannot be both without contradiction.

  ---

  ### Comparative Scoring of Contending Approaches

  Here is how three major frameworks score against these desiderata. Note that high scores on phenomenological fidelity often correlate with low scores on normative precision.

  #### 1. The Strawsonian Participant Stance
  *   **Core Claim:** Reactive attitudes are natural facts of human life; responsibility is internal to these practices.
  *   **Performance:**
      *   *Strengths:* Excellently explains the *Lag of Affect* and the *Universality* of attitudes. It validates your resentment as a natural human response, not a theoretical error. It handles *Reactive Opacity* well by treating it as the default human condition (we operate within the practice, not outside it).
      *   *Weaknesses:* Fails the *Selectivity of Suspension* test. Strawson suggests the "objective stance" is dehumanizing and unsustainable for intimate relationships. Your experience proves otherwise; you *must* objectify to care, yet the relationship survives. It also struggles with the *Agent vs. Action* distinction, often conflating the two.
  *   **Verdict:** High phenomenological validity, low practical utility for caregiving logistics.

  #### 2. Reasons-Responsiveness Compatibilism
  *   **Core Claim:** Responsibility depends on the agent's capacity to recognize and react to moral reasons.
  *   **Performance:**
      *   *Strengths:* cleanly solves the *Asymmetry of Excusing Conditions*. If the FTD parent cannot process reasons, they are not responsible. This protects the *Normative Safety* of the patient. It distinguishes *Agent vs. Action* clearly (the agent lacks the mechanism, the action remains harmful).
      *   *Weaknesses:* Fails the *Lag of Affect*. It tells you your resentment is irrational because the mechanism is broken. It offers no account of *Reactive Opacity* other than "error." It cannot explain why the relationship feels morally charged if the reasons-responsiveness is gone.
  *   **Verdict:** High normative precision, low phenomenological fidelity. It solves the puzzle by dissolving the feeling.

  #### 3. Revisionist / Evolutionary Naturalism
  *   **Core Claim:** Reactive attitudes are evolutionary heuristics designed for social coordination, not truth-tracking metaphysics. They are open to redesign.
  *   **Performance:**
      *   *Strengths:* Best handles *Reactive Opacity* as a heuristic. It explains the *Paradox of Therapeutic Blame* (we can use the tool because it is a tool). It allows for *Selectivity of Suspension* (we can redesign our responses for the caregiving context).
      *   *Weaknesses:* Fails the *Normative Force* requirement. If attitudes are just tools, the "ought" loses its bite. It risks making your resentment feel like a mere biological glitch rather than a moral claim. It struggles to explain why the *Lag of Affect* feels like a betrayal rather than just a processing delay.
  *   **Verdict:** High practical flexibility, low existential resonance. It saves the caregiver but empties the relationship.

  ### Architectural Conclusion

  Your situation suggests that no single existing framework satisfies the desiderata without sacrificing a core tension. A rigorous account for your context likely requires a **hybrid architecture**:

  It must accept the **Strawsonian** claim that the resentment is real and constitutive of *your* side of the relationship (honoring the *Lag of Affect*), while adopting the **Reasons-Responsiveness** claim that the parent is not the appropriate target of *retributive* blame (honoring *Normative Safety*).

  This leads to a specific resolution of **Reactive Opacity**: In caregiving, opacity must be treated as **provisional**. You are licensed to hold the attitude to protect your own moral boundaries (prospective responsibility), but you are obligated to withdraw the retributive judgment once the etiology is confirmed (retrospective responsibility). The theory must allow you to live in the tension: holding the parent responsible for the *relationship's boundaries* while excusing them from the *moral quality of the violation*. This preserves the relationship without denying the disease.
