      *   **Tone:** Rigorous, philosophical, empathetic to the lived experience but analytically sharp.

  2.  **Deconstruct the Core Tension:**
      *   The user's situation highlights the gap between *theoretical exculpation* (it's the disease) and *phenomenological reality* (it feels like a betrayal/harm).
      *   A constitutive theory says reactive attitudes *are* the fabric of responsibility. If the attitude persists, is responsibility still there? Or is the attitude irrational?
      *   The "Reactive Opacity" concept is crucial: We often hold attitudes without knowing the full causal story. Is this a bug or a feature?

  3.  **Drafting the Desiderata (The "What"):**
      *   *Requirement 1: The Excuse/Modification Distinction.* Standard theory says exemptions (psychosis) kill responsibility. Modifications (stress) reduce it. But in FTD, it looks like an exemption, yet the feeling persists. The theory must explain why some causal stories extinguish resentment while others only mute it.
      *   *Requirement 2: The Intimacy Lag.* In close relationships, resentment outlasts intellectual acceptance of an excuse. A theory must explain this temporal lag. Is it irrational grief or a distinct form of responsibility?
      *   *Requirement 3: Agent vs. Action.* We can hate the act but love the agent. In FTD, the "agent" seems gone, but the "person" remains. The theory must distinguish attitudes toward the *source* vs. the *output*.
      *   *Requirement 4: Reactive Opacity.* We hold people responsible when we *don't* know the cause. If we later find out it was a tumor, we retract. But often we don't know. The theory must say if holding the attitude in ignorance is rational or just a heuristic.
      *   *Requirement 5: Normative Force.* Reactive attitudes feel demanding. They claim something *ought* to have been otherwise. A constitutive theory must explain where this "ought" comes from if it's just a feeling.

  4.  **Identifying Tensions (The "Jointly Unsatisfiable"):**
      *   *Tension A: Phenomenological Fidelity vs. Normative Justification.* If we honor the *feeling* of resentment (it's real), we might validate irrational blame. If we honor *justification* (it's a disease), we invalidate the caregiver's lived experience.
      *   *Tension B: Universality vs. Selectivity.* Reactive attitudes are supposed to be universal human practices. But caregiving requires *selective suspension* (therapeutic detachment) to survive. A theory that demands universal participation might harm the caregiver.
      *   *Tension C: Opacity vs. Truth.* If responsibility depends on actual agency, opacity is error. If it depends on social practice, opacity is functional. You can't easily have both.

  5.  **Scoring the Approaches (The "Evaluation"):**
      *   *Strawson (Participant vs. Objective):* Good on intimacy, bad on the "objective" stance needed for caregiving. Struggles with the "partial suspension" needed in FTD.
      *   *Reasons-Responsiveness (Fischer/Ravizza style):* Good on agency definition. Bad on the *feeling*. If the parent isn't reasons-responsive, they aren't responsible. But the resentment remains. Leaves the caregiver hanging emotionally.
      *   *Revisionism (Dennett/evolutionary):* Good on explaining why we have the feelings (heuristics). Bad on normative force. Tells the caregiver "you're buggy," which isn't helpful.

  6.  **Refining and Polishing:**
      *   *Tone Check:* Ensure it doesn't sound like a textbook. Use the user's context (FTD/caregiving) as the anchor for the philosophical points.
      *   *Concept Check:* Ensure "Reactive Opacity" is defined clearly. Ensure "Constitutive" is respected (attitudes aren't just tools, they *constitute* the responsibility).
