answer: |-
  Good morning. Welcome to this fault line.

  We are gathered here because we share a fascination with the past, but we arrive carrying different maps. On one side of this room, the maps are drawn in strata, pottery shards, and carbon dates. On the other, they are drawn in liturgy, lineage, and the moral architecture of civilization. For centuries, we have treated the boundary between these maps as a gradient—a slow fade where history becomes legend as the light dims.

  Today, I propose we reject the gradient. Instead, I ask you to work with a concept of an **evidentiary phase shift**.

  A phase shift is not a slow fade; it is a discrete threshold. It is the moment water becomes ice. In our work, this shift occurs when the governing question changes. On the legend side of the threshold, the question is: *"Does this cohere with our received narratives?"* Truth here is measured by consistency, meaning, and cultural continuity. On the history side, the question is: *"What material trace would this leave, and what does the presence, absence, or ambiguity of that trace actually license us to claim?"* Truth here is measured by residue, context, and falsifiability.

  Crossing this threshold does not make one side "true" and the other "false." It makes them subject to different laws. When we cross from narrative coherence to material trace, we take on new obligations. We are obligated to remain silent where the dirt is silent. We are obligated to accept that a story can be foundational without being factual in the way an excavation report is factual.

  Let us apply this friction to our three touchstones.

  Consider **Troy**. For the poet and the student of antiquity, the Trojan War coheres. It explains the Greek identity, the wrath of Achilles, the favor of the gods. The narrative logic is complete. But the evidentiary phase shift occurs when we pick up a trowel. The question stops being "Who fought?" and becomes "What burned?"

  When we cross that threshold, we find a city that was destroyed by fire and conflict in the Late Bronze Age. The material trace licenses us to claim that a war happened. However, the absence of inscriptions naming Achilles or Hector imposes a constraint. We cannot claim the *Iliad* is history. The shift forces a reduction: we may speak of a conflict, but we must relinquish the agents. The obligation here is to accept that the *event* is recoverable, but the *hero* is not. To insist otherwise is to violate the rules of the material side.

  Consider **Arthur**. Here, the narrative coherence is potent. He is the once and future king, the anchor of British Christendom and chivalry. The phase shift occurs when we confront the silence of the fifth and sixth centuries. The governing question changes from "How did he unite the people?" to "What does a post-Roman warlord leave behind?"

  The material trace is ambiguous. We have hillforts; we have layers of destruction; we have almost no contemporary text and no stone that bears his name. The shift constrains us to distinguish between a *function* and a *person*. Archaeology licenses us to claim that a resistance movement existed against Saxon encroachment. It does not license us to claim a single individual named Arthur led it. The obligation is to resist the temptation to fill the silence of the soil with the noise of the story. We can honor the symbol without falsifying the stratigraphy.

  Consider **the Exodus**. This is the heaviest case. For the clergy and educators here, this narrative is not merely a story; it is the bedrock of covenant and liberation. Its coherence is theological and existential. The phase shift occurs when we ask about the Sinai Peninsula in the thirteenth century BCE. The question moves from "How did God deliver them?" to "Can a migration of this scale exist without leaving a footprint?"

  The material trace is starkly absent. There is no evidence of a mass population movement in the archaeological record of the Sinai or the Levant at that time. This creates a profound tension. The shift obligates us to acknowledge that archaeology cannot speak to revelation. It can only speak to demographics and pottery. If we remain on the narrative side, the Exodus is a living truth. If we cross to the material side, we cannot claim it as a demographic event without contradicting the evidence. The obligation is to recognize that these are different categories of truth. To demand that the desert yield what only faith can sustain is to misunderstand the limits of the spade.

  So, what can this workshop settle?

  We must be humble. Regarding **Troy**, we have crossed the threshold. We can agree that a war occurred, even if the poems are myth. Regarding **Arthur**, we hover at the edge. We can agree on the context of the Dark Ages, but we must accept the individual may remain forever out of reach. Regarding **the Exodus**, we must acknowledge that the threshold acts as a wall. The material evidence does not support the narrative scale, and the narrative necessity does not require material proof.

  Today is not about resolving these tensions. It is about respecting the phase shift. It is about knowing when we are asking what the story means, and when we are asking what the soil says. If we can maintain that distinction, we will not diminish the past. We will simply understand the cost of speaking about it.

  Thank you.
