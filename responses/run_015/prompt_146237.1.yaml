answer: |-
  This is a rich pairing because *Metropolis* does not merely illustrate Marx; it embodies the *affective* weight of his critique while simultaneously recoiling from its political conclusions. To facilitate your discussion, we can structure the reading around three movements: the visualization of real subsumption in the factory, the ontology of the Robot as "dead labor," and the ideological containment of the resolution.

  ### 1. The Visual Logic of Real Subsumption
  Marx's argument in *Capital* regarding machinery is that it is not introduced to reduce toil, but to increase the production of relative surplus value. This requires the labor process to be redesigned around the machine's capabilities, not the worker's. Marx calls this the "real subsumption of labor under capital." The worker ceases to use the tool; the tool uses the worker.

  Lang dramatizes this not through dialogue, but through choreography and editing. Consider the opening shift change. The workers are not shown entering the factory as individuals; they are shown as a mass, moving in identical rhythm, heads bowed. When they reach their stations, they do not manipulate levers with dexterity; they stand in fixed positions, arms raised in a gesture of supplication or synchronization.

  This visualizes Marx's claim that the worker becomes an "appendage of the machine." In the film, the architecture of the factory dictates the biology of the worker. The famous shot of the massive clock-face, where the shift hands move like prison bars, underscores that time is no longer a measure of human experience but a metric of extraction. When the machine speeds up in Freder's hallucination, and the workers are literally fed into the gears, Lang makes visceral the abstract economic concept that machinery, under capitalism, consumes living labor time to crystallize it into value. The "Moloch" sequence is not just a metaphor for danger; it is a literalization of the economic reality that the machine's maintenance requires the expenditure of human life. Marx argues that machinery lengthens the working day and intensifies labor; Lang shows the physiological breaking point of that intensification. The worker who collapses at the machine is the body failing to keep up with the valorization requirements of the capital invested in the technology.

  ### 2. The Robot Maria: Dead Labor Mimicking the Living
  Your question about the Robot Maria is central. In Marx's framework, the automatic factory represents the culmination of capital's desire: a production process that relies as little as possible on volatile, living labor. The Robot is the fantasy of this culmination realized. It is "dead labor" (technology/crystallized past work) that perfectly mimics "living labor" (agency, movement, speech).

  However, the film adds a layer of anxiety that Marx's economic text implies but does not dramatize: the *uncanny* nature of this displacement. When Rotwang creates the Maschinenmensch, he is creating the ultimate commodity—a worker that cannot tire, cannot unionize, and cannot feel pain. But when this technology is weaponized to incite rebellion, it reveals the fragility of capitalist control.

  The Robot's rampage suggests that when you replace living labor with dead labor, you lose the ability to predict the system's behavior. Marx argues that machinery creates a reserve army of labor and deepens instability; Lang shows us the *panic* of that instability. The workers, seeing the Robot Maria, do not see a machine; they see their own agency reflected back at them as a monster. This dramatizes the alienation of political agency. Under capitalism, the workers' own power (their capacity to halt production) appears to them as an external, destructive force (the Robot) rather than a conscious class action. The destruction of the worker's city by the mob, led by the Robot, exposes the tragedy of misplaced rage: they are destroying their own living conditions because they cannot yet distinguish between the technology that enslaves them and the collective power they possess. The Robot is the fetishized form of their own labor power turned against them.

  ### 3. The Humanist Retreat: Head, Hands, and Heart
  This is where the film resists, and perhaps betrays, the Marxist reading. Marx's solution to the domination of dead labor over living labor is a revolutionary transformation of the relations of production. The workers must seize the means of production to subordinate machinery to social need rather than profit.

  *Metropolis* offers a different solution: "The Mediator Between the Head and the Hands Must Be the Heart." This is a profound ideological containment. By locating the solution in *empathy* (Freder's moral awakening) rather than *expropriation* (the workers seizing the machine), Lang shifts the conflict from the economic structure to the moral character of the ruler.

  In the final handshake between Fredersen (the Head/Capital) and Grot (the Hands/Labor), the structural hierarchy remains intact. Fredersen is still the owner; the workers are still in the depths. The only change is that the owner now *feels* for the worker. From a Marxist perspective, this is a fantasy. It suggests that exploitation is a result of a lack of sympathy rather than a structural necessity of capital accumulation. If the machine exists to extract surplus value, the "Heart" cannot stop it without stopping the machine's function as capital. The film resolves the tension by appealing to a pre-capitalist humanism, effectively arguing that the problems created by the economic base can be solved within the ideological superstructure. It saves the city, but it preserves the class relation.

  ### 4. What the Aesthetic Adds to the Debate
  Despite the reactionary resolution, the film contributes something to the philosophical debate that the text of *Capital* cannot: the *phenomenology* of subsumption. Marx describes the logic of the machine; Lang makes you feel the rhythm of it.

  Through the editing patterns of the factory sequences—the rapid cutting, the geometric composition of bodies against steel—Lang induces a sense of claustrophobia and mechanical determinism in the viewer. We experience the "real subsumption" kinesthetically. Marx can tell us that capital reshapes the labor process; Lang shows us how it reshapes the *nervous system*. The film illuminates the psychological toll of the "automatic system" that Marx describes. It reveals that the domination of dead labor is not just an economic statistic but an atmospheric condition, a world where architecture, time, and movement are all coded by the logic of the machine.

  Furthermore, the film exposes the *religious* dimension of this domination. Marx speaks of commodity fetishism; Lang gives us the Machine-God. By figuring the technology as a deity that demands sacrifice, the film suggests that the submission to the machine is not just coerced but ritualized. The workers' movements are liturgical. This adds a layer to the Marxist critique: technology under capitalism does not just exploit; it sacralizes the hierarchy. It makes the domination of dead labor appear as a natural, divine order that the "Hands" must serve.

  ### Discussion Angles for the Group
  To move this into a discussion, you might pose these tensions:

  1.  **Is the "Heart" a cop-out?** Does the mediation of Freder invalidate the critique of the factory? Or is the film acknowledging that technology alone cannot solve the human problem, requiring a Marxist reading to be supplemented by an ethical one?
  2.  **The Robot's Agency:** If the Robot is "dead labor," why does it have more agency than the workers? Does this suggest that under capitalism, objects have more freedom than subjects?
  3.  **Visceral vs. Structural:** Does the emotional impact of the film (the fear of the machine, the pity for the workers) do more political work than a correct structural analysis would? Or does that emotion distract us from the necessity of revolution?

  *Metropolis* ultimately serves as a dialectical image itself: it is revolutionary in its diagnosis of the machine's domination, but reactionary in its prescription for liberation. It forces us to confront the horror of Marx's "dead labor" while simultaneously offering a comforting lie about how to escape it.
