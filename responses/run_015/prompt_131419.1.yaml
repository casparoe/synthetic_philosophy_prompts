answer: |-
  Good evening.

  For those of you who don't know me: I make things up for a living. I write novels. For those of you who do know me: you know I've been trying to explain my job to her since we were eighteen, and she's been trying to explain hers to me for just as long.

  She spent forty years working on a specific idea about how the world holds together. The short version—which the philosophers in the room will forgive me for simplifying, and the rest of you will forgive me for not simplifying further—is that when science changes, the "stuff" we think the world is made of usually vanishes. The ether goes. The phlogiston goes. But the mathematical patterns, the relationships between the variables, those stay. The structure survives the demolition of the furniture.

  She held a harder version of this than most. She was a realist about the structure, but agnostic about whether there was anything at all sitting in it. She used to say the equations were doing the work, and the objects were just the places where the equations intersected.

  Now, being a novelist, I tried to tell her once that I do the same thing. I told her: "When I rewrite a draft, the characters change completely. Their histories shift, their motives invert. But the shape of how they stand to each other—that tension, that geometry—that survives. I keep the structure, I swap the stuff."

  She hated that analogy. She told me it was too generous to me. And she was right. In my books, I decide the relations. I'm the god of that little universe. She wasn't. She had to listen to a world that didn't care what she wanted. She submitted to the rigor of the real. That is a much harder discipline than making things up.

  Someone suggested I give this toast by describing her only in terms of her relations to you. To describe her structurally. To say she was a node in a network: a mother here, a colleague there, a hiking partner on that trail. To say she *was* the sum of those connections.

  I considered it. It feels very appropriate. But I think she'd call it twee. And more importantly, I think it violates her own honesty. Because she knew there was a limit to structuralism. She had a private name for the worry that if there are enough objects lying around, saying "the structure is thus" is close to saying nothing. She called it **"The Excess."**

  She never solved The Excess. She knew that sometimes, the stuff matters. That there is a residue that the equations don't catch. If I describe her only by how she touched you, I miss the residue. I miss the stubborn, unyielding thing that was *her*, regardless of who was looking. The structure of this room relies on her, yes. But the load-bearing capacity comes from the weight of the person, not just the position she holds.

  So, for the philosophers: She spent a lifetime arguing we can't know the relata, only the relations. This is why her office was a safety hazard. She knew the spatial relations between the piles of papers were robust, even if the boxes themselves were ontologically dubious. She was agnostic about the furniture, but realist about the trip hazard.

  And for the grandkids, who will be told this was boring: She taught me that when you play a game, the pieces can get lost. You can play chess with bottle caps. You can play tag without a base. The rules matter more than the toys. If you remember that, you'll be okay when the toys break.

  She is retiring. The title goes. The office goes. The institutional structure will replace her with someone else next year. The equations of the department will balance out.

  But we are not a theory. We are the stuff. And we are better for having been arranged around her.

  To [Friend's Name].
