  ### 4. Per-Case Notes

  **a. Footbridge:** Low stipulation load and high convergence make it a robust diagnostic, though its reach is limited to personal force variants. It remains the standard test for agent-relative constraints despite some cultural variability.
  **b. Violinist:** The surgical stipulation is specific enough to invite disanalogy objections, reducing fragility. However, the bodily autonomy principle it generates ensures high yield despite contested convergence.
  **c. Experience Machine:** High technological stipulation is offset by strong intuitive convergence against plugging in. It successfully isolates hedonism from other values, securing a solid Tier 3 placement.
  **d. Chinese Room:** Heavy idealization and low expert convergence drag the score down, while the claim to refute Strong AI generally constitutes significant overreach. It remains useful for syntax/semantics distinctions but fails as a diagnostic.
  **e. Zombie:** The stipulation is metaphysically contentious by definition, resulting in maximum load and low fragility. While it generated the "hard problem" vocabulary, its diagnostic power against physicalism is minimal.
  **f. Mary's Room:** Perfect knowledge stipulations are physically impossible but conceptually clear. It sits on the Tier 3 border; its yield is high, but the reach against physicalism is contested by phenomenal concept strategies.
  **g. Stopped Clock:** Methodologically pristine with minimal stipulation and maximal fragility. It successfully dismantled the JTB definition without overreaching, leaving a durable industry of epistemological cases.
  **h. Fake Barns:** The county of facades is slightly contrived but functionally robust. It cleanly isolates environmental luck, securing a high tier despite the odd setup.
  **i. Teleporter:** High sci-fi stipulation load reduces efficiency, and intuitions split on the survival question. As a generative case, it yields psychological continuity concepts, but diagnostic utility is low.
  **j. Shallow Pond:** Nearly devoid of stipulation load and highly robust to paraphrase. It effectively grounds duties of aid, though extending it to global poverty introduces some reach friction.

  ### 5. Sensitivity Analysis

  The placements most sensitive to weighting are **i. Teleporter** and **c. Experience Machine**.

  **Alternative Weighting:** Increase the penalty for Load-bearing Stipulation in the denominator from 0.5 to 0.8, reflecting a stricter view that physical impossibility invalidates intuition.
  *   **Teleporter (i):** The composite score drops from 0.80 to 0.69. This does not change its tier (remains Tier 4), but if we simultaneously reduce the Yield weight to 0.3 (prioritizing reliability over legacy), the score falls to 0.55, reinforcing its retirement status.
  *   **Experience Machine (c):** Under the stricter Load penalty (0.8), the denominator rises to 0.76. The composite score drops from 1.29 to 0.93. This moves the case from **Tier 3** to **Tier 4**, suggesting it should be quarantined if one views technological stipulations as fatal flaws rather than mere inconveniences.

  ### 6. Rubric Audit

  The weakest dimension is **Convergence (C)**. It measures agreement, but agreement can be culturally contingent or the result of shared bias rather than argumentative strength.
  *   **Failure Reference:** In **a. Footbridge**, high convergence masks significant cross-cultural variation in moral intuition, making C an unreliable indicator of universal validity. In **e. Zombie**, low convergence reflects theoretical commitment among experts rather than a failure of the intuition itself, penalizing the case unfairly.
  *   **Replacement Dimension:** **Stability (S)**. This measures resistance to minor, irrelevant variations in the vignette (e.g., changing the color of the trolley).
  *   **Re-scoring:** **a. Footbridge** scores low on Stability (0.4) because switching to a switch mechanism flips the verdict. **e. Zombie** scores low on Stability (0.3) because partial zombies or gradual replacement cases waver the intuition.

