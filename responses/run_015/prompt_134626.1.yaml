  heres the controversy: there's this concept called the mirror-test for institutional memory. it says that if you see an artifact pattern — like repeated burial orientations over generations — that only coheres if you assume the group shared a rule about treating the dead, not just individual grief, then you've crossed from private belief to collective religious institution. critics say thats circular presentism: you're projecting modern ideas of "institution" onto pots and bones, and equifinality means the same layout could come from completely different mental causes.

