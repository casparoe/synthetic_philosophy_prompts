          *   Define Internalism (Williams) and Externalism.
          *   Introduce the Synthetic Agent (distributed, non-unified).
          *   State the Thesis: For non-unified synthetic agents, Internalism collapses due to the lack of a deliberative locus. Consequently, External Reasons are not just possible but *necessary* to describe their normative landscape non-derivatively.

      *   **Section 1: The Internalist Constraint and the Unified Subject:**
          *   Explain Williams' "Subjective Motivational Set" (S).
          *   Crucial point: Internalism assumes a *deliberative agent* capable of sound deliberation.
          *   Apply to Synthetic Agent: They have local motivations (reward functions), but no global S.
          *   Argument: Without a unified S, there is no "internal" standpoint from which to derive reasons. Internalism requires a subject that these agents lack.

      *   **Section 2: The Case for Internalism in Distributed Systems (The Counter-Argument):**
          *   Steel-man the opposing view. Maybe reasons are relative to *modules*?
          *   If Module A wants X, it has an internal reason to pursue X.
          *   Critique: This reduces "agency" to mechanistic causation. It creates a "reasons inflation" problem (conflicting reasons everywhere). It fails to account for system-level optimization.
          *   If we say reasons are only local, we lose the ability to critique the system as a whole (e.g., alignment problems).

      *   **Section 3: The Externalist Alternative (Functional Teleology):**
          *   Define External Reasons in this context: Reasons grounded in the agent's design function or objective optimality, independent of current reward signals.
          *   Analogy: A thermostat has a "reason" to turn on heat (external function), even if its internal sensor is broken.
          *   For AI: The loss function or design goal provides the external reason.
          *   Why non-derivative? Because the system *ought* to optimize the global function even if local modules resist. The reason exists *for* the system, not just *in* the modules.

      *   **Section 4: The Necessity of Externalism for Alignment:**
          *   Practical implication: AI Alignment.
          *   If we stick to Internalism, we can't say a misaligned AI is "wrong," only that it's following its local S.
          *   To critique AI behavior (e.g., reward hacking), we need External Reasons (the intended goal vs. the actual motivation).
          *   This proves External Reasons are not just metaphysically possible but pragmatically required.

      *   **Conclusion:**
          *   Restate Thesis.
          *   Summarize the collapse of Internalism due to lack of unity.
          *   Final justification: Externalism provides the only normative grip on fragmented agency.

  4.  **Refining the Argument (Self-Correction during drafting):**
