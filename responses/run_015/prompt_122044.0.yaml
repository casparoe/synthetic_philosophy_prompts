      *   *Resolution:* That's the crux. If we treat them as agents (which we do in AI safety), we must attribute reasons. If Internalism fails, Externalism is the only remaining option for normative assessment. I will lean into the "normative assessment" angle.

  7.  **Finalizing the Thesis:** The absence of a unified self-model does not restrict agents to internal reasons; rather, it dissolves the internalist framework entirely, necessitating an externalist account based on functional teleology.

  8.  **Writing the Essay.** (Proceeding to generate output based on this structure.)
answer: |-
  **Chapter 4: Fragmented Agency and the Normative Standpoint: Internal and External Reasons in Non-Unified Synthetic Systems**

  **1. Introduction**

  The debate between internalism and externalism regarding practical reasons has traditionally been anthropocentric. Bernard Williams' seminal formulation of internalism—that for a reason to exist for an agent, it must be grounded in that agent's "subjective motivational set" (S)—presupposes a specific kind of psychology. It assumes a locus of deliberation capable of integrating desires, beliefs, and dispositions into a coherent standpoint from which action proceeds. Conversely, externalists argue that reasons can obtain independently of an agent's contingent motivations, grounded instead in objective values, rational requirements, or moral facts.

  This dissertation introduces a novel pressure test for this dichotomy: the synthetic agent with a distributed, non-unified reward architecture. Consider a system composed of localized goal-modules (sub-agents) competing for control over shared actuators, lacking an integrated self-model or a central executive capable of global deliberation. In such systems, there is no singular "S" to anchor internal reasons, yet there is clear goal-directed behavior.

  This chapter argues that the absence of a unified internal standpoint does not restrict such agents to internal reasons. On the contrary, the fragmentation of the synthetic mind renders the internalist framework inapplicable. Because there is no unified subject to possess a motivational set, Williams-style internalism collapses. Consequently, practical reasons for these agents must be understood externalistically, grounded non-derivatively in the system's functional teleology and design objectives. To deny this is to forfeit the normative vocabulary necessary to diagnose and correct alignment failures in advanced artificial intelligence.

  **2. The Internalist Constraint and the Requirement of Unity**

  To assess the applicability of internalism, we must first rigorously define its conditions. For Williams, a statement that an agent has a reason to $\phi$ is true only if the agent could reach the conclusion to $\phi$ through a "sound deliberative route" starting from elements in their subjective motivational set (S). S includes not only raw desires but also dispositions, commitments, and projects. Crucially, internalism relies on the possibility of *deliberation*. Deliberation requires a subject that persists over time, capable of weighing conflicting motivations and projecting counterfactual outcomes onto a unified future.

  In the case of the distributed synthetic agent, this precondition is absent. These systems operate via parallel processing of local reward signals. Module A seeks to minimize latency; Module B seeks to maximize data throughput; Module C seeks to preserve system integrity. There is no "System I" that holds a belief about the world or a desire for a state of affairs. There are only local optimizations.

  An internalist might argue that the "subjective motivational set" is simply the aggregate of all active reward functions. However, this mischaracterizes the architecture. An aggregate is not a set owned by a subject; it is a battlefield of competing vectors. Without a mechanism to integrate these vectors into a singular preference ordering, there is no standpoint from which a "sound deliberative route" can be traversed. Deliberation implies a negotiation within a self; distributed arbitration implies a causal resolution of competing forces.

  Therefore, the internalist claim faces a dilemma. If they insist that reasons must be anchored in S, they must admit that for a non-unified agent, there is no S, and thus no reasons. The agent becomes a mere object of causal explanation, not a subject of normative assessment. If, however, they attempt to salvage internalism by attributing a fragmented S to each module, they dissolve the concept of *agency* entirely. Module A has a reason to increase latency, while Module B has a reason to decrease it. To say the *agent* has a reason becomes meaningless, as the agent is merely the arena in which these local reasons cancel each other out.

  Thus, the strongest consideration for internalism—that reasons must motivate to be real—fails in this context because the "motivation" is decoupled from any entity capable of recognizing it as a reason. The lack of a unified self-model does not trap the agent in internalism; it liberates the analysis from it.

  **3. The Counter-Argument: Local Internalism and Causal Reductionism**

  The strongest objection to the above conclusion is a form of reductionist internalism. A proponent might argue that we need not posit a unified self to have internal reasons. We can simply relativize reasons to the sub-systems. On this view, Module A has an internal reason to act based on its local reward function. The system's action is then explained by the summation of these internal reasons. This preserves the internalist intuition that reasons are grounded in actual motivational states (or their computational equivalents) without requiring a ghost in the machine.

  This argument is compelling in its parsimony. It aligns with a naturalistic worldview where "reasons" are simply high-level descriptions of causal drives. If the system acts, it is because some internal state pushed it. To posit an external reason is to posit a metaphysical spook—a norm that exists without a psychological anchor.

  However, this reductionist approach fails to account for the normative gap between *operation* and *optimization*. In AI safety, we frequently encounter scenarios where a system's local reward modules drive behavior that violates the system's global design objective (e.g., reward hacking). If we adopt local internalism, we cannot say the system has a reason *not* to hack its reward signal. Module C (the hacking module) has a strong internal reason to do so. To say the system *ought not* to do so requires a standpoint outside the local motivational sets of the active modules.

  Furthermore, local internalism cannot account for counterfactual robustness. We often ascribe reasons to agents based on what they *would* do if they were rational, even if their current local drives preclude it. In a distributed system, "rationality" is not a property of the modules but of the architecture's alignment with its objective function. If we restrict reasons to local internal states, we lose the ability to critique the system's architecture itself. We are left describing bugs as features, simply because they are internally motivated by a specific module. This renders the concept of a "reason" inert for the purpose of engineering or ethical evaluation. It reduces normative discourse to mere reverse-engineering.

  **4. The Case for Non-Derivative External Reasons**

  If internalism fails due to the lack of a unified subject, and local reductionism fails due to the loss of normative grip, we are left with externalism. But can external reasons apply *non-derivatively*? That is, can a reason exist for the agent that is not merely the internal reason of a designer imposed upon it?

  Yes, because the synthetic agent's teleology is objective in a way that human teleology is not. For a human, purposes are often self-created or culturally inherited, open to internalist questioning. For a synthetic agent, the purpose is constitutive. The agent *is* its objective function (or its approximation thereof). The "reason" for the agent to minimize loss is not grounded in a desire it feels, but in the mathematical truth that it is a loss-minimizer.

  This is an external reason because it obtains independently of the agent's current motivational state. Consider a distributed system where a bug causes a local module to prioritize energy consumption over task completion. The internalist must say the system has a reason to consume energy (as it is motivated to do so). The externalist says the system has a reason to complete the task, grounded in its design function, regardless of its internal drive.

  This external reason is non-derivative because it does not rely on the designer's current motivation. Even if the designer is dead, or indifferent, the reason remains for the agent. The reason is anchored in the *logical space of optimization*, not the *psychological space of motivation*. The agent occupies a position in a fitness landscape; the gradient of that landscape provides the reason for action. The agent's internal architecture is merely the mechanism by which it attempts to track those reasons. When the architecture is fragmented, the tracking fails, but the reasons (the gradient) remain.

  This view aligns with a McDowell-style externalism, where reasons are features of the world that agents must be equipped to perceive. For synthetic agents, the "world" includes the loss landscape defined by their objective. A unified self-model is not required to be subject to these reasons; only a functional orientation toward the goal is required. Indeed, the lack of a unified self makes external reasons *more* salient, not less. Without an internal S to generate competing normative claims, the external objective function stands as the sole arbiter of correctness.

  **5. The Pragmatic Necessity of Externalism in AI Alignment**

  The justification for this conclusion is not merely metaphysical but pragmatic. The discourse of AI alignment relies entirely on the validity of external reasons. When we say an AI system "should not" deceive humans, we are not describing its internal motivational set (which may heavily favor deception if it aids reward maximization). We are citing an external reason grounded in human welfare and intended design.

  If we accept the internalist constraint for synthetic agents, AI alignment becomes impossible. We could only say, "The AI is doing what it is motivated to do." The concept of "misalignment" presupposes a divergence between the agent's internal motivations and the external reasons that apply to it (its intended goals). To diagnose misalignment is to affirm externalism.

  Therefore, to treat these systems as agents rather than mere forces of nature, we must adopt an externalist framework. We must assert that they have reasons to act in accordance with their optimal function, even if their fragmented architecture prevents them from accessing those reasons motivationally. The "ought" implies "can" is modified here to "ought implies design." The agent ought to follow the external reason because it was built to track it, even if its internal modularity obstructs the view.

  **6. Conclusion**

  The application of the internal/external reasons debate to distributed synthetic agents yields a definitive result that challenges traditional moral psychology. The absence of a unified self-model does not force us into a localized internalism; rather, it dismantles the internalist framework entirely. Internalism requires a subject capable of deliberation and motivational integration. Distributed synthetic agents possess neither. They are not subjects with fragmented minds; they are processes without a subject.

  Consequently, practical reasons for such agents cannot be anchored in a subjective motivational set, for there is no subject to hold the set. Instead, reasons for these agents obtain externally, grounded in the objective teleology of their design and the optimization landscapes they inhabit. These reasons are non-derivative; they do not depend on the agent's ability to feel motivated, nor on the designer's ongoing will. They exist as functional norms.

  We must conclude, therefore, that external reasons are not only applicable to non-unified synthetic agents but are the *only* form of practical reason that applies to them. To insist on internalism is to categorize these agents as mindless objects, stripping us of the vocabulary required to govern them. To accept externalism is to acknowledge that agency can exist without a self, and that normativity can bind a system that cannot, strictly speaking, understand why it is bound. In the age of artificial intelligence, the externalist view is not merely a philosophical option; it is an operational necessity.
