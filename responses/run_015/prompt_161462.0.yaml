answer: |-
  1. Opening frame
  Start by declaring that the session is not about whether numbers exist, but about the price of saying what they are. Tell them: "We will test whether we can treat mathematical sentences exactly like ordinary sentences without requiring eyes for abstract objects." This forces the tension between meaning and knowledge before any definitions are offered, preventing the group from dissolving the problem into ontology too early. It sets the stakes as a trade-off rather than a puzzle to be solved, which aligns with a strict engineering mindset focused on constraints and costs.

  2. Dependency map
  Minutes 0–15: Establish Semantic Uniformity. Dependency: None. Must precede the dilemma because without it, there is no pressure to accept abstract objects. For engineers, meaning is use; show the use is identical to empirical claims. Minutes 15–30: Establish Epistemic Constraint. Dependency: Requires Semantic Uniformity to be plausible first. Must precede the dilemma because without it, Platonism is cost-free. Explain that knowledge requires a link, not just proof. Minutes 30–45: State the Dilemma. Dependency: Requires both horns. This is the pivot; no solutions yet. Frame it as incompatible constraints, not a mystery. Minutes 45–60: Introduce the Girder Example. Dependency: Requires the Dilemma to be felt. Use it to stress-test responses. If used earlier, they will solve the physics. Minutes 60–75: Evaluate Responses (Paraphrase vs. Platonism). Dependency: Requires the Example to show costs. Show how paraphrase breaks the uniformity established in minute 15. Minutes 75–90: The Embedding Check. Dependency: Requires all prior steps. This confirms grip on the semantic cost of paraphrase. Ensure no solution is endorsed before minute 60; premature solutioning kills the tension. The epistemic constraint must follow the semantic one, or they will reject the semantic requirement as unnecessary metaphysics. The example must follow the dilemma, or it becomes a physics problem. The check must be last, or it becomes a lecture question rather than a comprehension test. Keep the solution space open until the final check forces a specific choice. Transition from semantics to epistemology must be very explicit: "Okay, we agree on what it means; now how do we know it?" Transition to example must be: "Here is where that knowledge claim does real work." Transition to check must be: "Now prove you understand the cost."

  3. The girders
  The example is correct but dangerous. It must have empirical consequences (the bridge stands or falls) so truth is not conventional. It must lack explicit set-theoretic vocabulary so the abstraction feels inherent, not imported. Crucially, it must lack a trivial nominalistic reduction; if they can count the girders to solve it, the dilemma vanishes. Place it at minute 45, immediately after stating the dilemma but before evaluating solutions. If introduced earlier, they will solve the engineering and ignore the semantics. If later, it becomes an illustration rather than a stress-test. Warn them explicitly: "Do not solve the engineering problem; solve the sentence problem." This keeps the focus on the semantic cost of the irrational ratio claim within a causal story. The risk of causal absorption is very real; mitigate it by insisting the truth of the report depends on the numbers, not the steel. If they focus on resonance, ask: "What makes that sentence true?" This redirects them from the physical mechanism to the truth-maker, preserving the philosophical constraint while leveraging their own domain expertise to feel the weight of the claim. The example works because 'irrational' cannot be cashed out as finite physical states. Ensure you emphasize that the engineer is claiming a fact about the world, not a convenience of calculation. This prevents the retreat into instrumentalism, which would dissolve the semantic horn by denying the sentences are truth-apt in the first place.

  4. Shallow and deep uniformity
  The distinction earns its place. It isolates exactly what paraphrase strategies sacrifice. State it thus: "Shallow uniformity means math plays by the same grammatical rules as ordinary speech; deep uniformity means it plays by the same truth-making rules." It misleads if it suggests deep uniformity is the only valid goal; some nominalists accept shallow only. Introduce it at minute 15, after establishing semantic pressure but before the epistemic constraint, to define what "uniformity" actually demands before you show why it's costly. This prevents them from thinking logical syntax is enough. It clarifies exactly why paraphrase fails: it preserves shallow uniformity but abandons deep uniformity. Without this, they will think rewriting the sentence preserves meaning entirely. Use it to categorize responses later: Platonists keep deep uniformity; nominalists keep epistemic safety but lose deep uniformity. This gives them a metric to evaluate solutions rather than just opinions.

  5. Misconception map
  1. "This is simply whether numbers exist." (Minute 0). Engineers treat existence as a binary property of objects. Say: "Existence is the verdict, not the evidence." This stops them from voting on ontology before analyzing the constraints. They want to know the answer immediately; deny them the category.
  2. "Math is just logic/symbols." (Minute 15). Devs see syntax. Say: "Logic still needs truth conditions." This forces them to confront semantics, not just derivation. They conflate validity with truth; separate them.
  3. "The culprit is an optional causal theory." (Minute 30). They know causality is physical. Say: "Any reliable link works, not just causation." This prevents dissolving the epistemic horn by attacking a specific theory of knowledge. They will try to break the causal requirement; broaden it to 'reliable connection' so the problem remains.
  4. "This is a sceptical paradox." (Minute 30). They trust math. Say: "We know math; the problem is explaining how." This distinguishes Benacerraf from skepticism. They fear math is undermined; reassure them the knowledge is secure, the account is broken.
  5. "The bridge is about notation." (Minute 45). They model systems. Say: "The bridge doesn't care about our symbols." This anchors the example in reality. They will try to formalize the bridge; stop them.
  6. "The paraphrase move costs nothing." (Minute 60). They optimize code. Say: "Paraphrase saves ontology but breaks logic." This highlights the semantic tax. They think rewriting is free; show it changes the proposition.
  7. "There is a solution to be found." (Minute 75). They fix bugs. Say: "Every answer pays a price; choose your debt." This frames the session as trade-off analysis, not debugging. They expect a fix; give them a clear menu of costs.
  This sequence ensures each misconception is blocked exactly when it becomes a viable escape route from the specifically tightening dilemma.

  6. What I will refuse to settle
  Refuse to settle specific ontological commitments (sets vs. properties), detailed mechanics of modal structuralism, historical exegesis of Frege, or the viability of fictionalism. When asked, say: "We are auditing the cost, not designing the currency." This keeps the focus on the dilemma's structure rather than getting bogged down in the technical implementation of specific responses, which would alienate the non-philosophers and miss the strategic point of the session. Keep the debate on the trade-offs, not the technicalities of the solutions. If they ask about set theory specifics, redirect to the semantic cost. If they ask about epistemology details, redirect to the causal link requirement. The goal is structural understanding, not solution selection.

  7. The check
  End with the task: "Insert your nominalist paraphrase into 'The inspector did not realise that ___'." An answer showing grip sounds like: "If I put the paraphrase there, I change what he failed to realise; he missed the physical fact, not the logical possibility." A fluent miss sounds like: "It fits fine; the meaning is preserved." This distinguishes those who see the semantic cost from those who treat paraphrase as synonymous substitution. It tests deep uniformity directly. Require them to speak the sentence aloud; the awkwardness reveals the break in compositionality. The fluent miss indicates they have learned the vocabulary of the dilemma without feeling the semantic tension. The grip answer shows they understand that paraphrase alters the proposition, not just the wording. This confirms they clearly see the trade-off: you can save ontology or save semantics, but not both.
