  hey — i've got a question about the private language argument. I've been reading one of those pop-philosophy books on Wittgenstein (the "...and what it means for your life" kind; I won't name it, the author is clearly well read, not a hack) and I want to know how much of its summary I should beleive, because a couple of things in it clash with stuff I've heard elsewhere and I can't tell who's being pedantic.

  Here's the passage I copied into my notes:

  "Wittgenstein's private language argument shows that a language which only one person could possibly understand is impossible. Imagine you keep a diary in which you write the mark S every time you have a certain feeling. You can't define S by pointing to the feeling, because pointing inward isn't pointing at anything at all, and you can't fix the meaning by remembering what S meant last time, since memory can be wrong and there'd be nothing to check it against. So for a word to mean anything there has to be a difference between using it correctly and merely thinking you are — and only a community can draw that line. It follows that our words for sensations don't really name inner objects: 'pain' just means the pain-behavior, which is why Wittgenstein says that pain-behavior replaces crying rather than describes anything, and why an inner process stands in need of outward criteria. The argument also settles the old problem of other minds — if there is no inner object, there's no question whether other people feel what I feel, or something totally different. And because meaning needs a community, a person who grew up alone on a desert island couldn't have a language, or think in words, at all."

  My suspicions, such as they are: the "pain just means the behavior" bit sets off alarm bells, because I've seen people insist Wittgenstein wasn't a behaviourist and seen him called one, and I can't tell who's splitting hairs. A friend who does phil of mind says the desert island claim is exactly the mistake people make here, but he couldn't say why. And the book's confident ending doesn't feel like it follows even from the parts I buy.

  Can you audit it claim by claim and, for each, tell me what a Wittgenstein specialist would accept, what's a compression that's fine in a popular book but would get flagged in a seminar, and what's just wrong? Specifically: is the "nothing to check your memory against" line actually the point of the diary example, or is the real move about rules and standards of correctness rather than about memory being unreliable; and is the desert island inference making a distinction the argument doesn't make? Also, is it even fair to talk about "the" private language argument, or is that a label readers stuck on a cluster of remarks that might not all be doing the same job? Then tell me which single sentence does the most damage to a reader's understanding, and whether the summary's ending survives once the dodgy bits are fixed.

  Please write in American English, keep it concrete and tied to this paragraph rather than giving me a survey of the secondary literature, and end with exactly one line in this form: \answer{FAIR}, \answer{MOSTLY_FAIR}, \answer{MIXED}, \answer{MOSTLY_UNFAIR}, or \answer{UNFAIR}.
