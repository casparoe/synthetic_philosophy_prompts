  | Sham Control Condition | Access Conscious (Content globally broadcast and reportable) | Phenomenally Conscious (Analog sensory grounding present) | Analog sensory encoding | Phenomenal verdict becomes No (encoding becomes categorical) |

  A GWT defender might argue that true global broadcast cannot occur without analog sensory resonance, claiming the functional role of broadcast inherently requires qualitative formatting. Alternatively, they might reject the access/phenomenal distinction outright, insisting that if a subject can report and reason with confidence, phenomenology is present by definition. The first reply is an empirical gamble that risks falsifiability; the second is question-begging, as it defines away the very distinction the seminar is investigating. Neither addresses the logical possibility that the functional role of access could be decoupled from the specific format of sensory representation.

  To the student claiming the criterion defines phenomenology away, emphasize that the criterion isolates a specific intuition: that experience involves more than just data availability. The goal isn't to stipulate absence arbitrarily, but to test whether GWT's functional criteria exhaust what we mean by "experience." If the mechanism provides all functional benefits of access while stripping the sensory format we associate with feeling, the case reveals a gap in the theory. The definition serves as a probe, not a trick; if GWT cannot account for the missing analog ground, it explains access but leaves phenomenology unaddressed.
