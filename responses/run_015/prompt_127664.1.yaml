  **Phenomenal Criterion:** Phenomenal consciousness requires that globally available content retains high-fidelity analog sensory formatting in early sensory cortex, distinct from the categorical encoding sufficient for verbal report and reasoning.

  **Scenario:**
  Subjects in a psychophysics lab view oriented gratings while receiving [Hypothetical] "Categorical Encoding Stimulation" (CES) via targeted TMS over V1. CES bypasses analog processing, translating sensory input directly into categorical labels (e.g., "vertical") before global broadcast. Subjects successfully report orientation, use data in deliberate reasoning tasks, and track confidence with accuracy matching baseline performance. The content is sustained in working memory and guides action. However, the neural signal broadcast globally lacks analog resonance in early visual areas, existing only as propositional tags. By the criterion, the subject possesses the content for use but lacks the sensory ground required for experience.

  | condition_or_subject | access_verdict | phenomenal_verdict | load_bearing_feature | if_removed |
