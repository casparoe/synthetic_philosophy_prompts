  ### 2. Mapping Maya's Metaphysical Theory
  Maya is running a hybrid of **Kripkean Origin Essentialism** and **Biological Animalism**.

  *   **Kripkean Origin Essentialism:** This fits her "Different Gametes = No" and "Career Change = Yes" verdicts. Saul Kripke argued in *Naming and Necessity* that a person's origin (the specific sperm and egg) is a necessary property of that person. You could have had different hair or lived in Osaka, but you could not have come from a different zygote. This explains why she accepts accidental changes (career, eye, location) but rejects origin changes.
  *   **Biological Animalism:** This fits her "Upload = No" verdict. Animalists (like Eric Olson) argue that you are essentially a biological organism, not a psychological entity. A silicon upload is a new entity that mimics you, not *you*, because it breaks the biological continuity of the organism.
  *   **Why it's not Counterpart Theory:** David Lewis's Counterpart Theory suggests that "you" don't literally exist in other worlds; rather, there are *counterparts* who are similar to you. If Maya were a standard Counterpart Theorist, she might allow that the "different sperm" person is a *counterpart* of you. But her language ("there wouldn't be anyone in that world who counts as you") and her strictness on origin suggest she believes in **Transworld Identity** (you literally exist in other worlds) but only under strict essentialist constraints.
  *   **Why she is stumped on the Clone:** She is encountering the **Branching Problem**. Origin Essentialism works well for one-to-one mapping (One Zygote = One Person). But if reality branches, we get One Zygote $\rightarrow$ Two Persons. Her intuition that the clone is a "copy" (like the upload) conflicts with the fact that the clone is biologically identical. She is stumped because her theory doesn't have a clear rule for *fission* (splitting), only for *divergence* (changing properties).

