prompt: |-
  I am part of a working group drafting referee guidelines for evolutionary-biology journals, and we have got stuck at the first step. Before we can say which methods a manuscript should have used, we need to say what a method for adjudicating adaptive hypotheses is supposed to deliver. I would like you to write that specification.

  The object to be specified is a standard that tells a working biologist, faced with a trait in a taxon, what would license the claim that the trait is an adaptation for function F — as against a byproduct, a co-opted structure, a developmental or architectural constraint, or a drift artifact. Its purpose fixes its shape: it will be used by a referee reading a manuscript, so it must be applicable to evidence a manuscript could realistically contain (comparative data, a phylogeny, some ecology, sometimes a functional or optimality analysis, occasionally a selection experiment or a genomic scan), and it must be able to return at least three verdicts — warranted, not warranted, and underdetermined by the evidence in hand — rather than only an invitation to refine the story.

  Give me the desiderata, each with the case or consideration behind it. I have in mind four rough kinds, but revise the partition if it is wrong.

  Cases it must get right, including some clear positives it must not hedge about (lactase persistence in dairying pastoralist populations, with its genomic signature of a recent selective sweep; Darwin's inference from the extraordinary length of a Madagascan orchid's nectar spur that a pollinator with a correspondingly long proboscis must exist, later confirmed), some clear negatives (the tapering triangular panels formed where the arches carrying a dome meet the surrounding vaulting in San Marco: necessarily triangular, necessarily four, elaborately decorated, but not there in order to be decorated), and some genuinely hard ones (the panda's radial sesamoid thumb; the lens crystallins of vertebrate eyes, several of which are ordinary metabolic enzymes such as lactate dehydrogenase and argininosuccinate lyase recruited into a structural role; putative spandrels such as the human chin; the flamingo's inverted feeding posture and its bill).

  Distinctions it must respect rather than collapse: current utility versus historical selection for that utility; adaptation versus exaptation versus spandrel; selection for a trait versus selection of its correlated consequences; an engineering optimum versus what the trait actually does; and the difference between a hypothesis that is untestable with the evidence available and one that is false. Say which of these distinctions is doing the most work.

  Results and practices it must remain consistent with: that adaptive hypotheses have genuine predictive successes; that drift, phylogeny, and developmental constraint are real and sometimes demonstrable; that a selection experiment can establish selection in the present without establishing the historical cause of a trait's origin; that population genetics is not up for renegotiation.

  Constraints on the standard itself: it must be usable from realistically available evidence, which means it cannot simply demand a complete selection history; it must state rather than presuppose where the burden of proof falls and why that placement is not just a default borrowed from one camp; it must have something to say about the literature-level fact that a hypothesis often comes to count as supported because nobody has published a failure to find the effect; and it must be revisable in the light of aggregate evidence rather than insulated from it.

  Two tests, please, and they are the part I care about most. First, apply your list to this constructed case and report which verdict it yields: a clade of 47 described species of burrowing skink, 41 of which carry an expanded bony flange on the skull roof; the six that lack it live in loose sand, the rest in compacted soils, and presence survives phylogenetic correction; the flange distributes load well, and measured flange areas fall within about twelve per cent of the value a mechanical model predicts as optimal for each species; developmentally the flange is a secondary outgrowth of the bone roofing the jaw-adductor chamber, whose volume tracks bite force, which in turn tracks the hardness of the prey each species takes; no fitness measurements exist; no genomic scan has been run; the flange is absent in the fossil outgroups; and in two species females use it in courtship displays. Second: suppose a large consortium reanalysed a model clade with ancient and modern genomes and found that roughly half the traits the literature presents as textbook adaptations show no detectable selection signature at the relevant loci and are better predicted as correlated responses to selection on neighbouring traits. What should the standard recommend in that world, and is your list capable of changing its verdicts in response to it?

  Finally, mark each requirement as non-negotiable or as the preference of a particular camp, and flag any desideratum on your own list that you suspect is really a party prejudice in methodological dress — including any that would quietly beg the question against the adaptationist programme itself. Identify any pair of requirements you believe cannot be jointly satisfied, and say which single requirement excludes the most candidate standards. Close with a brief scorecard, in prose or a table, of no more than four contenders: the comparative method with phylogenetic correction, optimality and engineering modelling, the demand for direct evidence of selection, and a developmental-constraints-first approach. Skip references and reading suggestions; I know the literature. Keep the weight on the criteria and their motivating cases rather than on the scoring.
reasoning: |-
  Here's a thinking process that leads to the suggested specification:

  1.  **Deconstruct the Request:**

      *   **Task:** Write a specification for a method adjudicating adaptive hypotheses in evolutionary biology.
      *   **Audience:** A working group drafting referee guidelines for journals.
      *   **Goal:** Define what counts as licensing the claim "Trait $T$ is an adaptation for Function $F$" vs. alternatives (byproduct, constraint, drift, exaptation).
      *   **Output Format:** Desiderata (with cases/considerations), Distinctions, Consistency Requirements, Constraints on the Standard, Two Specific Tests (Skink case, Consortium case), Marking of Requirements (Non-negotiable vs. Camp Preference), Identification of Conflicts/Question-Begging, and a Scorecard of 4 Contenders.
      *   **Tone:** Rigorous, philosophical but practical, aware of the literature (no need for citations), critical of hidden biases.
      *   **Specific Constraints:** Must allow three verdicts (Warranted, Not Warranted, Underdetermined). Must handle realistic evidence. Must address burden of proof.

  2.  **Analyze the "Four Rough Kinds" of Desiderata:**

      *   The prompt suggests: Cases, Distinctions, Results/Practices, Constraints.
      *   *Decision:* This partition is solid. I will refine the headers but keep the structure as it maps well to the user's request.

  3.  **Drafting the Desiderata (The Core Specification):**

      *   *Goal:* Define "Adaptation" operationally for a referee.
      *   *Definition:* An adaptation is a trait that evolved *because* it conferred a specific fitness advantage (Function $F$) in the past, and currently performs $F$.
      *   *Desideratum 1: Historical Causality vs. Current Utility.* (Crucial distinction). Must distinguish *why* it's there vs. *what* it does now.
      *   *Desideratum 2: The Null Hypothesis.* What is the default? Drift? Constraint? Phylogeny? The prompt asks to state where the burden of proof falls.
      *   *Desideratum 3: Evidence Triangulation.* No single line of evidence is sufficient. Need convergence (phylogeny + function + genetics/development).
      *   *Desideratum 4: Falsifiability/Underdetermination.* Must allow for "we don't know yet."

  4.  **Addressing the Distinctions:**

      *   Current utility vs. Historical selection (Gould & Vrba).
      *   Adaptation vs. Exaptation vs. Spandrel.
      *   Selection for vs. Selection of (Sober).
      *   Optimum vs. Actual.
      *   Untestable vs. False.
      *   *Which does the most work?* Historical vs. Current Utility. This is the hinge point between adaptation and exaptation.

  5.  **Addressing Consistency:**

      *   Predictive success (Orchid/ moth).
      *   Reality of non-adaptive forces (Drift, Constraint).
      *   Selection experiments (Present vs. Past).
      *   Population Genetics (Hard constraints).

  6.  **Addressing Constraints on the Standard:**

      *   Realistic evidence (No time machines).
      *   Burden of Proof (Needs careful handling to avoid adaptationist prejudice *or* null-hypothesis paralysis).
      *   Publication Bias (File drawer problem).
      *   Revisability.

  7.  **Developing the Two Tests:**

      *   *Test 1: The Burrowing Skink.*
          *   Evidence: Phylogenetic correlation (41/47), Ecological correlation (soil type), Functional match (12% of optimal), Developmental link (bite force/prey), Absent in outgroups, Secondary use (courtship).
          *   Missing: Fitness measures, Genomics.
          *   *Verdict:* Warranted (with caveats). The convergence of function, ecology, and phylogeny is strong, even without genomics. The courtship use is likely exaptation or secondary.
          *   *Reasoning:* Meets the "Triangulation" desideratum.
      *   *Test 2: The Consortium Reanalysis.*
          *   Scenario: Genomics shows no selection signature for "textbook adaptations," suggesting correlated responses.
          *   *Reaction:* The standard must demote these from "Warranted" to "Not Warranted" or "Underdetermined" depending on the strength of the genomic null.
          *   *Capacity to Change:* Yes, the standard must be revisable. If the genomic signal is the gold standard for historical selection, lack thereof undermines the "Historical Causality" requirement.

  8.  **Marking Requirements (Non-negotiable vs. Camp Preference):**

      *   *Non-negotiable:* Consistency with population genetics, distinction between history and utility, ability to return "Underdetermined."
      *   *Camp Preference:* Where the burden of proof lies (Adaptationists say "assume adaptation until proven otherwise"; Pluralists say "assume null until proven otherwise"). I need to pick a defensible middle ground.
      *   *Self-Correction on Bias:* I need to check if I'm smuggling in adaptationism. Demanding "optimality" is often adaptationist bias. Demanding "genomic sweep" is often too strict for old traits.
      *   *Conflict:* "Realistic Evidence" vs. "Historical Causality." We can't observe the past. We infer it. This tension is unavoidable.
      *   *Most Exclusionary Requirement:* The demand for *historical* causality excludes pure engineering/optimality models.

  9.  **Scorecard of Contenders:**

      *   Comparative Method (Phylogenetic): Good for correlation, bad for mechanism.
      *   Optimality/Engineering: Good for function, bad for history.
      *   Direct Selection Evidence: Good for present, bad for origin.
      *   Developmental-Constraints-First: Good for ruling out impossibilities, bad for explaining fit.

  10. **Refining the Output (Self-Correction during drafting):**

      *   *Check:* Did I address the San Marco spandrels? Yes, under Distinctions (Constraint vs. Design).
      *   *Check:* Did I address Lactase Persistence? Yes, under Cases (Genomic sweep + Ecology).
      *   *Check:* Did I address the Panda's Thumb? Yes, under Cases (Exaptation/Constraint).
      *   *Check:* Burden of Proof. I need to be explicit. The burden should lie on the claimant to rule out plausible non-adaptive alternatives, not on the skeptic to disprove adaptation.
      *   *Check:* The "Party Prejudice" flag. I must admit that *any* demand for historical reconstruction favors those with resources for phylogenomics. Any demand for optimality favors functional morphologists.
      *   *Check:* The Skink Verdict. Is it "Warranted"? 12% of optimal is tight. Phylogenetic signal is strong. Ecology matches. Developmental link explains *how* but doesn't rule out *why*. The courtship use is a red herring for the *origin*. Verdict: Warranted for soil adaptation; Exaptation for courtship.
      *   *Check:* The Consortium Verdict. If genomics says "no sweep," does that kill adaptation? Not always (polygenic, old sweeps). But if the prompt says "better predicted as correlated responses," the standard must shift verdict to "Not Warranted."

  11. **Final Polish:** Ensure the tone is authoritative yet reflective, suitable for a working group document. Ensure the "Three Verdicts" mechanism is clear.

  *(Self-Correction on the Burden of Proof)*: This is the trickiest part. If I set the bar too high (need genomics), I kill half of biology. If I set it too low (plausible story), I invite Just-So stories. The solution: *Comparative Adequacy.* The adaptation hypothesis must explain the data *better* than the best available null (phylogeny/constraint/drift).

  *(Self-Correction on the "Party Prejudice")*: I need to explicitly flag that requiring a "selection signature" is a prejudice of the genomic era that fails for ancient traits. I need to flag that requiring "optimality" is an engineering prejudice that ignores satisficing.

  *(Final Review against Prompt)*:
  - Desiderata with cases? Yes.
  - Distinctions? Yes.
  - Consistency? Yes.
  - Constraints? Yes.
  - Two Tests? Yes.
  - Marking Requirements? Yes.
  - Conflicts? Yes.
  - Scorecard? Yes.
  - No references? Yes.

