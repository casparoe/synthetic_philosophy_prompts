answer: |-
  # Specification for Adjudicating Adaptive Hypotheses

  ## 1. Desiderata
  The standard must evaluate whether a trait $T$ in taxon $X$ is an adaptation for function $F$. It must yield one of three verdicts: **Warranted**, **Not Warranted**, or **Underdetermined**.

  ### A. Empirical Coverage (Cases it must get right)
  1.  **The Clear Positive:** The standard must license the claim for **lactase persistence**.
      *   *Consideration:* Strong ecological correlation (dairying), strong phylogenetic correlation (pastoralist populations), and a definitive genomic signature (recent selective sweep).
      *   *Requirement:* Convergent lines of evidence (ecology + phylogeny + genetics) yield a **Warranted** verdict.
  2.  **The Predictive Success:** The standard must license **Darwin's Orchid**.
      *   *Consideration:* Inference preceded observation. The trait morphology predicted an unobserved agent.
      *   *Requirement:* A hypothesis that generates novel, risky predictions which are subsequently confirmed counts heavily toward **Warranted**, even absent genomic data.
  3.  **The Clear Negative:** The standard must reject adaptation for the **San Marco Spandrels**.
      *   *Consideration:* The triangular shape is a necessary architectural consequence of mounting a dome on arches. Decoration is secondary.
      *   *Requirement:* If a trait is a necessary byproduct of a separate structural constraint (developmental or architectural), the verdict is **Not Warranted**, regardless of current utility (decoration).
  4.  **The Hard Cases:** The standard must handle **Panda's Thumb** and **Lens Crystallins**.
      *   *Consideration:* These are co-opted structures (exaptations). The radial sesamoid is a modified wrist bone; crystallins are recruited enzymes.
      *   *Requirement:* The standard must distinguish the origin of the *structure* (constraint/byproduct) from the origin of the *usage* (selection). If selection acted on a pre-existing structure for a new function, the verdict is **Warranted** for the function (exaptation), but **Not Warranted** for the structure's initial appearance.

  ### B. Conceptual Distinctions (Boundaries it must respect)
  1.  **Current Utility vs. Historical Selection:** This distinction does the **most work**. A trait can be useful now (utility) without having evolved for that use (history).
      *   *Requirement:* Evidence of current function alone is insufficient for a **Warranted** verdict. Evidence of historical selection pressure is required.
  2.  **Selection For vs. Selection Of:** (Sober's distinction).
      *   *Requirement:* The standard must identify if $T$ was the target of selection or a correlated hitchhiker. If $T$ is a correlated response, the verdict is **Not Warranted** for $T$ as an adaptation, even if linked to an adaptive trait.
  3.  **Adaptation vs. Exaptation vs. Spandrel:**
      *   *Requirement:* The standard must classify the *origin*. Exaptation is a subset of adaptation regarding current maintenance but distinct regarding origin. Spandrels are non-adaptive byproducts.
  4.  **Untestable vs. False:**
      *   *Requirement:* If the historical evidence is erased (e.g., ancient trait, no phylogenetic variance), the verdict must be **Underdetermined**, not **Not Warranted**. A hypothesis is only **Not Warranted** if positive evidence for a null (drift/constraint) exists or if the adaptive story is internally inconsistent.

  ### C. Consistency Requirements (Results it must match)
  1.  **Predictive Success:** Adaptive hypotheses that successfully predict undiscovered traits or ecological partners must be upgradable from **Underdetermined** to **Warranted** upon confirmation.
  2.  **Non-Adaptive Realism:** The standard must accept **Drift**, **Phylogenetic Inertia**, and **Developmental Constraint** as sufficient explanations. If a null model (e.g., Brownian motion on a phylogeny) fits the data as well as the selection model, the verdict is **Underdetermined** or **Not Warranted**.
  3.  **Temporal Limits:** A selection experiment demonstrating current advantage establishes maintenance, not origin.
      *   *Requirement:* Present-day selection evidence alone yields **Underdetermined** regarding historical origin, unless coupled with evidence that the selective regime has been constant.
  4.  **Population Genetics:** The standard cannot contradict hard constraints (e.g., a trait cannot be an adaptation if the genetic variance required for its selection was physically impossible in the ancestral population).

  ### D. Constraints on the Standard Itself
  1.  **Realistic Evidence:** It cannot demand a "complete selection history." It must rely on inference to the best explanation using available proxies (phylogeny, functional morphology, genomics).
  2.  **Burden of Proof:** The burden lies on the claimant to demonstrate that the adaptive hypothesis explains the data *better* than plausible null hypotheses (drift/constraint). It is not sufficient to tell a plausible story; the story must outperform the null.
      *   *Justification:* This prevents the "Just-So" problem without requiring impossible historical data.
  3.  **Publication Bias:** The standard must account for the "file drawer" problem. A hypothesis counts as **Warranted** only if failed replications or negative comparative tests are considered in the aggregate, not just the positive publication.
  4.  **Revisability:** The verdict is provisional. New evidence (e.g., a genome scan) can downgrade a **Warranted** verdict to **Not Warranted**.

  ---

  ## 2. The Two Tests

  ### Test 1: The Burrowing Skink Case
  **Evidence:**
  *   Phylogeny: 41/47 species have flange; presence survives correction.
  *   Ecology: Absent in loose sand, present in compacted soil.
  *   Function: Flange area within 12% of mechanical optimum for load distribution.
  *   Development: Outgrowth of jaw-adductor bone; volume tracks bite force/prey hardness.
  *   Outgroup: Absent in fossils.
  *   Secondary Use: Courtship in two species.
  *   Missing: Fitness measures, Genomics.

  **Application of Standard:**
  *   *Historical Causality:* Phylogenetic correlation + Absence in outgroups suggests derived trait linked to clade radiation.
  *   *Function vs. Constraint:* The 12% optimality match is strong evidence for selection *for* load distribution. The developmental link to bite force suggests a potential correlated response (Selection Of vs. Selection For). However, since bite force tracks prey hardness (ecological variable) and flange tracks soil (ecological variable), and these are distinct, the flange is likely not merely a byproduct of feeding adaptation.
  *   *Null Models:* The absence in loose-sand species rules out pure phylogenetic inertia.
  *   *Secondary Use:* Courtship use is exaptation (current utility without historical selection for that specific use).

  **Verdict:** **Warranted** (for soil adaptation); **Exaptation** (for courtship).
  **Reasoning:** The triangulation of ecology, phylogeny, and engineering optimality is sufficient to rule out drift and pure constraint as *primary* drivers, even without genomics. The developmental link is noted but does not explain the soil correlation.

  ### Test 2: The Consortium Reanalysis
  **Scenario:**
  *   Genomic reanalysis of a model clade shows no selection signatures at loci for "textbook adaptations."
  *   Traits are better predicted as correlated responses to selection on neighboring traits.

  **Application of Standard:**
  *   *Revisability:* The standard mandates that new aggregate evidence overrides prior consensus.
  *   *Distinction:* This directly attacks the "Selection For" condition. If the loci show no signature, and the trait variance is explained by correlation with other selected traits, the "Adaptation" claim fails the Historical Causality test.
  *   *Burden of Proof:* The null (correlated response) now outperforms the adaptive hypothesis.

  **Verdict:** **Not Warranted**.
  **Capacity to Change:** Yes. The standard explicitly requires revisability. If the genomic evidence demonstrates that the "adaptation" is a correlated response (Selection Of, not Selection For), the standard forces a downgrade. It acknowledges that functional fit (optimality) does not prove historical selection if the genetic architecture reveals a different history.

  ---

  ## 3. Marking Requirements & Conflicts

  ### Non-Negotiable Requirements
  1.  **Historical vs. Current Distinction:** Cannot be collapsed. (Fundamental to evolutionary theory).
  2.  **Three-Valued Logic:** Must allow **Underdetermined**. (Epistemic honesty).
  3.  **Consistency with Population Genetics:** Cannot propose mechanisms violating genetic constraints. (Hard science constraint).
  4.  **Revisability:** Verdicts must change with new evidence. (Scientific method).

  ### Camp Preferences (Flagged)
  1.  **Burden of Proof Placement:** *Preference of the Pluralist/Null-Hypothesis Camp.* Placing the burden on the claimant to rule out drift/constraint biases against adaptationism. An Adaptationist might argue the burden should be on the skeptic to disprove utility. *Decision:* Burden on claimant is retained to prevent Just-So stories, but flagged as a methodological choice to curb confirmation bias.
  2.  **Optimality Threshold:** *Preference of the Functionalist Camp.* Demanding a trait fall within a specific % of an engineering optimum (e.g., the Skink's 12%) privileges traits amenable to modeling. It biases against traits where "good enough" (satisficing) is the strategy.
  3.  **Genomic Signature Weight:** *Preference of the Genomic Era.* Treating the absence of a selective sweep as evidence against adaptation (Test 2) biases against ancient adaptations where signatures have decayed, or polygenic traits where sweeps are undetectable.

  ### Suspected Party Prejudice in Methodological Dress
  *   **The Demand for "Selection Signatures":** This is a **Genomic Prejudice**. It quietly begs the question against the Adaptationist Programme for older traits. If a standard requires a genomic sweep to verify an adaptation, it renders 90% of evolutionary biology (paleontology, morphology) "Underdetermined." I have flagged this in Test 2: the standard must accept that absence of evidence is not evidence of absence *unless* the genomic power is sufficient to detect the specific type of selection expected.
  *   **The "Optimality" Requirement:** This is an **Engineering Prejudice**. It assumes natural selection produces optimal designs rather than viable ones. Requiring a trait to match a model prediction risks rejecting true adaptations that are constrained by history.

  ### Incompatible Requirements
  *   **Pair:** "Realistic Evidence" vs. "Historical Causality."
  *   **Conflict:** We cannot observe the past. Demanding proof of historical causality (Non-negotiable) conflicts with the constraint that we only have realistic, present-day evidence (proxies).
  *   **Resolution:** The standard resolves this by accepting *inference to the best explanation* via triangulation (phylogeny + function + ecology) as a proxy for history, acknowledging this is probabilistic, not demonstrative.

  ### Most Exclusionary Requirement
  *   **Requirement:** **Historical Causality.**
  *   **Reason:** This single requirement excludes pure engineering/optimality models and pure functional analyses from counting as proof of adaptation. It excludes the most candidate standards because it demands evidence beyond "what the trait does now."

  ---

  ## 4. Scorecard of Contenders

  | Contender | Strengths | Weaknesses | Verdict under this Standard |
  | :--- | :--- | :--- | :--- |
  | **Comparative Method (Phylogenetic)** | Controls for shared history; handles the "independence" problem well. | Correlation $\neq$ Causation. Cannot distinguish adaptation from correlated response easily. | **Necessary but Insufficient.** Must be combined with functional data. |
  | **Optimality / Engineering Modelling** | Strong predictive power (Orchid case); quantifies "fit." | Assumes optimality; ignores history. Can fit a spandrel as well as an adaptation. | **Supportive Evidence.** Cannot stand alone; risks Engineering Prejudice. |
  | **Direct Evidence of Selection** (Experiments/Genomics) | Gold standard for *current* selection; genomics addresses history. | Experiments miss origin. Genomics fails for ancient/polygenic traits. | **High Weight.** Presence warrants; Absence is Underdetermined (unless power is high). |
  | **Developmental-Constraints-First** | Excellent at ruling out impossibilities (Spandrels). | Poor at explaining fit. Can become a "get out of jail free" card for non-adaptationists. | **Null Model.** Used to test against, not to prove adaptation. |

  **Summary:** No single contender satisfies the specification. The standard mandates a **Triangulation Approach**: Phylogeny establishes independence, Engineering establishes function/fit, and Genetics/Development establishes mechanism/history. A claim is **Warranted** only when these lines converge to rule out the specific nulls (drift, constraint, correlation) relevant to the case.
