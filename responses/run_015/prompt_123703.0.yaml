  2.  **Unit of account not accepted:** Not money. A measure of value is not an instrument of exchange. Without acceptance in payment, it cannot circulate or stimulate industry. It is a ruler, not a ticket. Berkeley distinguishes the *measure* of power from the *instrument* of power; this is merely the former. It lacks the conventional acceptance required to set labor in motion.
