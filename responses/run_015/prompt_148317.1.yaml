answer: |-
  ### Part 1: Final Examination Question

  **Course:** Political Philosophy 450: Justice and the Welfare State
  **Time Allowed:** 75 Minutes
  **Total Marks:** 30

  **Question:**

  Consider a proposed welfare regime designed to reconcile the demand for social protection with the demand for personal responsibility. This regime formally divides claimants into two distinct tracks:

  1.  **The Capacity Track:** For those deemed "structurally excluded" due to verified deficits in labor-market capacity (e.g., disability, lack of local employment, caregiving duties). These claimants receive unconditional support.
  2.  **The Agency Track:** For those deemed "agentively non-participating" due to perceived deficits in desert (e.g., refusal of available work, lifestyle choices). These claimants face strict behavioral conditions and sanctions.

  The moral justification for this system relies on a sharp philosophical distinction between structural barriers (capacity) and voluntary refusal (agency). However, critics argue that under conditions of information asymmetry, this distinction is administratively unverifiable. To maintain the distinction, the state must intensify verification; to reduce verification costs, the state must blur the distinction. Furthermore, this regime employs an **epistemic burden reversal**: rather than the state bearing the burden of proving fraud or non-compliance, the claimant bears the burden of proving their incapacity or compliance.

  **Essay Task:**
  Evaluate whether this two-track system is conceptually coherent and administratively sustainable. In your analysis, you must address whether the system necessarily collapses into either (i) an invasive moral audit of private life that violates norms of respectful treatment, or (ii) a *de facto* universal abandonment of conditionality once verification costs become prohibitive. Specifically, analyze how the **epistemic burden reversal** alters the moral framing of the claimant-state relationship. Does shifting the burden of proof onto the claimant render the distinction between "capacity" and "agency" philosophically stable, or does it transform the welfare state into a mechanism of suspicion regardless of which track a claimant is placed on?

  *Note: You are not required to cite specific theorists, policy statutes, or external texts. Your grade will depend on the precision of your conceptual analysis and the rigor of your argumentation.*

  ***

  ### Part 2: Model Answer Outline

  **Objective:** A top-scoring response will not merely argue for or against conditionality but will dissect the *feasibility of the distinction* itself. The argument should proceed through the following conceptual moves:

  **1. Introduction: The Stability of the Distinction**
  *   Acknowledge the intuitive appeal of the two-track system: it attempts to honor both solidarity (for the incapable) and reciprocity (for the capable).
  *   Thesis statement: The system is conceptually unstable because the epistemic access required to distinguish "capacity" from "agency" is unavailable to the state without violating the moral norms the welfare state is meant to uphold. The epistemic burden reversal exacerbates this instability by transforming the claimant from a rights-bearer into a defendant.

  **2. The Information Asymmetry Problem (The Collapse Mechanism)**
  *   Analyze why "capacity" and "agency" are not empirically distinct categories in practice.
  *   *Argument:* Structural barriers often manifest as behavioral choices (e.g., depression looking like laziness; lack of transport looking as refusal). Conversely, voluntary refusal can be masked as structural inability.
  *   *Implication:* To sort claimants accurately, the state requires deep information about internal motivations and private constraints. This information is asymmetrically held by the claimant.

  **3. Horn I: The Invasive Moral Audit**
  *   If the state attempts to maintain the distinction rigorously, it must overcome information asymmetry.
  *   *Consequence:* This requires intrusive surveillance into private life (health, family dynamics, psychological state) to verify "capacity."
  *   *Moral Cost:* This violates norms of respectful treatment and privacy. It treats the claimant as a suspect subject rather than a citizen. The "Capacity Track" becomes a site of disciplinary power, not just support.

  **4. Horn II: The Administrative Abandonment**
  *   If the state respects privacy norms and limits verification, it cannot reliably distinguish the tracks.
  *   *Consequence:* Verification costs become prohibitive. To avoid error (punishing the incapable), the state must default to unconditional support for all (abandoning conditionality) OR default to conditionality for all (punishing the incapable).
  *   *Analysis:* If it defaults to conditionality for all to save costs, the "Capacity Track" becomes fictional. The distinction collapses into a universal punitive regime.

  **5. The Epistemic Burden Reversal and Moral Relationship**
  *   *Core Analysis:* Address the specific prompt requirement regarding burden of proof.
  *   *Standard Liberal View:* State proves fraud (presumption of innocence/trust).
  *   *Reversed View:* Claimant proves incapacity (presumption of guilt/suspicion).
  *   *Impact on Stability:* Shifting the burden does not solve the information problem; it moralizes it. It forces the claimant to perform their own inability. This renders the "Capacity Track" morally indistinguishable from the "Agency Track" because both require the claimant to prove they are not cheating the system.
  *   *Conclusion on Relationship:* The relationship shifts from one of entitlement based on status to one of privilege based on successful verification. This undermines the justificatory basis of the welfare state (security/rights) regardless of which track the claimant is in.

  **6. Conclusion**
  *   Summarize that the two-track system fails not because conditionality is wrong per se, but because the *knowledge condition* for just conditionality cannot be met without unacceptable moral costs.
  *   Final thought: The epistemic burden reversal confirms that the system is not tracking "desert" but rather "compliance capacity," rendering the philosophical distinction between structure and agency administratively void.

  ***

  ### Part 3: Marking Scheme

  **Total Marks:** 30
  **Structure:** 5 Analytical Points × 6 Marks Each

  | Analytical Point | Marks | Allocation Criteria | Typical Student Error / Omission |
  | :--- | :---: | :--- | :--- |
  | **1. Conceptual Discrimination of Tracks** | **6** | **6:** Clearly defines the moral difference between "structural exclusion" (capacity) and "voluntary refusal" (agency) and explains why this distinction is the justificatory core of the proposed regime.<br>**3-5:** Defines terms but fails to link them to the moral justification (desert vs. need).<br>**0-2:** Conflates the two tracks or treats them as merely technical categories. | **Error:** Treating the tracks as simple policy categories (e.g., "disabled vs. unemployed") without analyzing the underlying philosophical concepts of *agency* and *structure*. |
  | **2. The Information Asymmetry Argument** | **6** | **6:** Rigorously explains why the state cannot empirically distinguish capacity from agency due to hidden information (motivations, private constraints), leading to the "collapse" of the distinction.<br>**3-5:** Mentions verification is hard but fails to explain *why* the categories themselves blur under scrutiny.<br>**0-2:** Assumes the state can reliably distinguish the two with enough technology or staff. | **Error:** Assuming the problem is merely resource-based ("if we had more money we could tell") rather than epistemic/conceptual ("the categories overlap in practice"). |
  | **3. Analysis of Horn I (Invasive Audit)** | **6** | **6:** Articulates how maintaining the distinction requires intrusive surveillance, violating norms of privacy and respectful treatment, effectively punishing those on the "Capacity Track."<br>**3-5:** Discusses invasiveness but fails to link it to the violation of specific moral norms (respect/status).<br>**0-2:** Dismisses privacy concerns as secondary to fiscal responsibility. | **Error:** Focusing on the *cost* of surveillance rather than the *moral wrong* of the surveillance itself (conflating efficiency with justice). |
  | **4. Analysis of Horn II (Administrative Abandonment)** | **6** | **6:** Explains how prohibitive verification costs force the state to either abandon conditionality universally or apply it universally (erasing the tracks), demonstrating administrative unsustainability.<br>**3-5:** Notes costs are high but does not trace the logical consequence for the *structure* of the regime (collapse into universalism or universal punishment).<br>**0-2:** Argues the system is sustainable if managed well. | **Omission:** Failing to see that "abandonment" isn't just giving up, but a structural shift that invalidates the original two-track design. |
  | **5. Epistemic Burden Reversal & Moral Relationship** | **6** | **6:** Deeply analyzes how shifting the burden of proof transforms the claimant from a rights-bearer to a suspect, destabilizing the moral relationship regardless of the track assigned.<br>**3-5:** Defines the burden reversal but fails to explain its impact on the *moral relationship* or status of the claimant.<br>**0-2:** Treats burden of proof as a mere procedural detail without moral weight. | **Error:** Ignoring the prompt's specific requirement on "epistemic burden reversal" or treating it as synonymous with "strict conditionality" without analyzing the shift in *proof*. |
