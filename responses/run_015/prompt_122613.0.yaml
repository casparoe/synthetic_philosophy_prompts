answer: |-
  1. Your statement of the Principal Principle is standard, but the ground-clearing assumption that evidence solely about chances is automatically admissible is controversial due to the problem of undermining futures. Many philosophers argue that information about future chances can be inadmissible even if it concerns nothing else, because it fixes the history in a way that conflicts with the current chance function.

  2. The collapse argument is sound only if you assume the chance function satisfies the martingale property, which holds for standard Bayesian updating but is not guaranteed for all metaphysical accounts of objective chance. If chance functions can shift discontinuously or fail to track conditionalization on history, your expected future chance will diverge from your current chance, preventing triviality.

  3. The gappy case is coherent as a scenario where current chance is undefined while future chance is determined, but PD yields a determinate answer only by mixing subjective credence with objective chance. This means the output is not purely a deference to chance, but rather a standard expectation calculation using subjective probabilities over future chance states.

  4. This idea is already familiar in the literature, typically discussed under the banner of the Reflection Principle or as a diachronic constraint linking current credence to expected future credence or chance. The standard distinction draws between synchronic norms like the Principal Principle and diachronic norms requiring your current credence to match your expected future credence.

  5. This is worth a semester of work if you pivot away from calling it deference to chance and instead frame it as a bridge principle for reasoning through periods of chance gaps. The single most important change is to explicitly acknowledge that PD is a hybrid norm combining subjective uncertainty with objective chance, rather than a pure deference principle.
