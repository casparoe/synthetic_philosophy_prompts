  **BUREAU OF ADMISSIBLE PRECISIFICATIONS**
  **JOINT GUIDANCE NOTE 442/Ω: LIABILITY UNDER THE HEAP LEVY**
  **DATE:** 14 November 2023

  **TO:** All Regional Assessors and Taxpayers
  **FROM:** The Epistemicist and Supervaluationist Directorates

  Pursuant to the Heap Levy Act 1994, the Epistemicist and Supervaluationist Directorates issue this joint guidance regarding taxable accumulations of granular material on private land. While theoretical foundations regarding the semantics of 'heap' differ fundamentally, operational outcomes remain aligned to ensure revenue continuity. Taxpayers are reminded that metaphysical uncertainty does not constitute grounds for exemption.

  **1. Epistemicist Directorate Provisions**
  1.1. A sharp boundary exists between non-heaps and heaps. This boundary corresponds to a specific integer *N* of grains. Liability attaches strictly at *N*. The property of being a heap is precise; citizen ignorance regarding *N* is a feature of cognitive limitation, not semantic fuzziness.
  1.2. The value of *N* is recorded in the Central Registry. Requests for disclosure under Freedom of Information legislation are denied pursuant to the Margin-for-Error Exemption. Knowledge requires safety from error in nearby possible worlds; since any belief about *N* could easily be wrong, disclosure would not constitute information^1.
  1.3. Taxpayers are advised against commissioning private grain-counting firms. Any count falling within the margin of error surrounding *N* cannot yield knowledge. Certificates claiming to locate the boundary are deemed administratively void and may incur penalties for false precision.
  1.4. Where a pile transitions from non-heap to heap via the addition of a single grain, the Levy Notice shall be addressed specifically to that grain. The taxpayer is responsible for ensuring the grain receives the notice and remits the appropriate proportion of the levy.

  **2. Supervaluationist Directorate Provisions**
  2.1. Assessments will bear one of three stamps: 'HEAP' (true on all admissible precisifications), 'NOT A HEAP' (false on all admissible precisifications), or 'NO DETERMINATE STATUS' (true on some, false on others).
  2.2. Collection is authorised only where the levy is determinately owed. In cases of 'NO DETERMINATE STATUS', the enabling statute itself possesses no determinate truth value. Officers attempting to enforce the levy in penumbral cases act without determinate authority^2.
  2.3. The Bureau's mission statement asserts that 'The Levy has no sharp cutoff.' Under supervaluationist semantics, this statement is not determinately true, as some admissible precisifications admit sharp cutoffs. Officers should recite the mission statement with appropriate hedging^3.
  2.4. The distinction between 'DETERMINATELY A HEAP' and 'BORDELINE' is itself subject to vagueness. Officers encountering a borderline case of a borderline case should consult Footnote 2^4.

  **3. Operational Convergence**
  3.1. For any actual pile submitted for assessment, both Directorates issue identical liability verdicts. The Epistemicist Directorate asserts the verdict is true because the boundary is crossed; the Supervaluationist Directorate asserts the verdict is true because all precisifications agree.
  3.2. Taxpayers are not permitted to appeal based on theoretical inconsistency. The liability remains constant regardless of the metaphysical justification.

  **Appendix A: Inspector-General's Note**
  Historical records indicate no taxpayer has ever successfully detected the difference between these theoretical frameworks during audit. The phenomenological experience of being taxed remains identical whether the boundary is unknowable or indeterminate. The Inspector-General proposes funding a research programme to identify a taxpayer capable of distinguishing epistemic ignorance from semantic indeterminacy. Pending funding, assessments stand.

  **Footnotes**
  ^1 Disclosure would violate the principle that knowledge requires safety from error in nearby worlds.
  ^2 Caution is defined determinately^3.
  ^3 The boundary of admissibility for this footnote is not sharply defined^4.
  ^4 [See Footnote 3]. The regress terminates where definiteness fails.
