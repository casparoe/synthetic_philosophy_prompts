          *   Economists' View: Cite Gibbard-Satterthwaite (G-S). Any deterministic, non-dictatorial mechanism with $\ge 3$ outcomes and unrestricted domain is manipulable. Suggest abandoning strategy-proofness for transparency/auditability.
          *   Philosophy Chair's View: G-S conditions fail due to domain restriction ("domain localization"). Veto rights restrict admissible preference profiles. Also proposes weakening the range requirement (max 2 candidates in contention across departments simultaneously).
      *   **Requirements:**
          *   Recommend: Adopt, Adopt with Modifications, or Reject/Alternative.
          *   Include concrete implementation timeline if adopted.
          *   Engage seriously with G-S (do not dismiss).
