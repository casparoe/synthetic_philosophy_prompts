  1.  **Analyze the Request:**
      *   **Role:** Member of a university governance committee for interdisciplinary institutes.
      *   **Task:** Draft a decision memo regarding the selection mechanism for the new Institute for Synthetic Judgment (ISJ).
      *   **Context:**
