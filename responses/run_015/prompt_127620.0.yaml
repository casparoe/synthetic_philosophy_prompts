answer: |-
  **MEMORANDUM**

  **TO:** University Governance Committee
  **FROM:** Subcommittee on Selection Mechanisms
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation on Selection Mechanism for the Institute for Synthetic Judgment

  **1. Executive Summary**

  The Subcommittee recommends **approving the Provost's ranked-pair veto mechanism with significant modifications** regarding its theoretical justification and operational safeguards. We explicitly reject the claim that the mechanism is strategy-proof. While the Philosophy Department's minority report offers a creative theoretical escape from the Gibbard-Satterthwaite impossibility result, our analysis concludes that its conditions are not met in this context. Consequently, we align with the Economics Department's recommendation to prioritize transparency and auditability over the impossible goal of strategy-proofness. The veto provision should be retained to ensure departmental buy-in, but the process must be redesigned to mitigate cross-departmental coalition risks identified by the Political Science faction.

  **2. Theoretical Assessment of Proposed Mechanisms**

  The core challenge in selecting a governance mechanism for the Institute for Synthetic Judgment (ISJ) lies in balancing mathematical impossibility results with practical administrative needs. We have evaluated the three primary theoretical positions submitted.

  **2.1 The Economists' Appeal to Gibbard-Satterthwaite**
  The Economics faction's argument rests on the Gibbard-Satterthwaite theorem, which states that any deterministic social choice function that is non-dictatorial and has a range of three or more possible outcomes must be manipulable, provided the domain of voter preferences is unrestricted.

  We find this argument decisive regarding the *goal* of the mechanism. The ISJ will select research chairs from a pool that invariably exceeds two candidates across six departments. Therefore, the range condition of the theorem is satisfied. Unless we grant one department dictator power (which violates university governance norms), the mechanism is theoretically vulnerable to strategic voting. We must formally abandon the search for a strategy-proof rule. Any memo claiming otherwise would be mathematically indefensible. The Economists are correct: our design objective must shift from preventing manipulation to detecting and managing it through transparency.

  **2.2 The Philosophy Chair's Domain-Localization Argument**
  The Philosophy Chair argues that the veto power restricts the domain of admissible preference profiles ("domain localization") and proposes limiting contention to no more than two candidates across departments simultaneously to satisfy the range condition of the Gibbard-Satterthwaite theorem.

  While intellectually rigorous, this argument fails to escape the theorem's scope for two reasons:

  1.  **Domain vs. Range:** A veto power restricts the *feasible set* of outcomes (the range), not the *domain* of preferences voters may hold. Faculty members may still privately prefer a vetoed candidate to win; the mechanism simply renders that outcome impossible. Gibbard-Satterthwaite assumes voters can hold any preference ordering over the set of alternatives. The existence of a veto does not prevent a voter from ranking a vetoed candidate first; it only ensures that candidate cannot win. Thus, the input domain remains effectively unrestricted, and the theorem applies.
  2.  **The Agenda Regress:** The proposal to limit contention to two candidates simultaneously addresses the range condition only if the *entire* selection process is binary. However, reducing a large field to two finalists requires a prior selection stage. If that prior stage involves three or more candidates, the Gibbard-Satterthwaite conditions apply to the agenda-setting phase. Manipulation will not disappear; it will merely migrate upstream to the stage where the final two are chosen. This creates a risk of "agenda manipulation," where departments collude to ensure only their preferred candidates reach the final binary vote.

  Therefore, we cannot accept the Philosophy Chair's claim that strategy-proofness is recoverable under these constraints.

  **2.3 The Political Scientists' Cross-Departmental Risk**
  The Political Science faction correctly identifies that while the veto may protect departments from external imposition (local strategy-proofness), it creates vulnerability to logrolling. Department A might agree not to veto Department B's candidate in exchange for Department B supporting Department A's candidate in pairwise rankings. The ranked-pair system, while robust against simple majority cycles, does not inherently prevent these inter-departmental trades.

  **3. Recommendation: Adopt with Modifications**

  We recommend adopting the **Ranked-Pair Veto System**, but with the following critical modifications to address the theoretical vulnerabilities outlined above.

  **3.1 Modification 1: Explicit Disclaimer of Strategy-Proofness**
  All governance documentation must explicitly state that the mechanism is not strategy-proof. Faculty participants should be briefed that honest voting is the normative expectation, but the system cannot mathematically guarantee immunity from strategic behavior. This aligns with the Economists' call for realism.

  **3.2 Modification 2: Rejection of the "Two-Candidate" Limit**
  We reject the Philosophy Chair's proposal to limit contention to two candidates globally. This would cripple the interdisciplinary mission of the ISJ by forcing serial binary choices that are highly sensitive to agenda ordering. We will retain the full ranked-pair method across the eligible pool to ensure a Condorcet winner (if one exists) is identified, providing a stronger mandate than a simple binary runoff.

  **3.3 Modification 3: Enhanced Auditability and Transparency**
  To mitigate the inevitability of manipulation, we will implement the Economists' suggestion of radical transparency:
  *   **Public Ballots:** Departmental rankings will be anonymized but published in aggregate after the selection.
  *   **Veto Justification:** A department exercising a veto must submit a written, criteria-based justification (e.g., "candidate lacks interdisciplinary fit") to the Provost, subject to audit. This raises the reputational cost of strategic vetoes.
  *   **Audit Trail:** The pairwise comparison matrix will be preserved and made available for review by the Governance Committee.

  **4. Strategic Risk Assessment**

  The strongest objection to this recommended course is the risk of **Cross-Departmental Logrolling**.

  Even with transparency, six departments form a small enough coalition space that implicit trading is feasible. For example, the Humanities and Social Sciences departments might form a bloc to prioritize candidates with qualitative methodologies, using their combined veto power to exclude quantitative candidates from the Sciences, regardless of the pairwise rankings. The ranked-pair system determines the winner among *non-vetoed* candidates; if the vetoes are used strategically to thin the field, the pairwise ranking becomes secondary.

  This risk is inherent to any non-dictatorial system with veto powers. Our mitigation relies on the "sunlight" of the audit process. If a department consistently vetoes candidates who rank highly in pairwise comparisons across other departments, this pattern will become visible in the audit trail. While we cannot prevent the behavior mathematically, the reputational risk within the university governance structure serves as a deterrent. We accept this residual risk as the cost of preserving departmental autonomy.

  **5. Implementation Timeline**

  If approved, the modified mechanism will be implemented according to the following schedule:

  *   **Phase 1: Policy Revision (November 1 – December 15)**
      *   Drafting of the ISJ Selection Charter incorporating the transparency modifications.
      *   Legal and governance review of the veto justification requirements.
  *   **Phase 2: Stakeholder Briefing (January 10 – January 31)**
      *   Mandatory workshops for Department Chairs explaining the mechanism.
      *   Explicit briefing on the Gibbard-Satterthwaite constraints to manage expectations regarding strategy-proofness.
  *   **Phase 3: Pilot Selection (February 15 – April 30)**
      *   Execution of the first selection cycle under the new rules.
      *   Collection of pairwise data and veto logs.
  *   **Phase 4: Post-Mortem Audit (May 15 – June 15)**
      *   Governance Committee review of the audit trail.
      *   Assessment of any detected logrolling or agenda manipulation.
      *   Final adjustment of the charter before the first full chair appointments.

  **6. Conclusion**

  We cannot legislate away the fundamental constraints of social choice theory. The Gibbard-Satterthwaite theorem holds, and the Philosophy Chair's proposed escape route introduces greater vulnerabilities than it resolves. By adopting the Provost's mechanism while abandoning the claim of strategy-proofness, we choose a system that is mathematically honest, operationally feasible, and sufficiently transparent to deter the worst forms of strategic abuse.

  **Recommendation:** Approve with Modifications.
