  - F is the actual causal-explanatory difference-maker: had F been absent, the agent wouldn't have acted.
  - But the agent sincerely avows a different reason, G, and G is a perfectly decent reason in its own right — not discreditable, not a vice, not something she'd be embarrassed by if she noticed it.
  - The agent is fully articulate, has no relevant false beliefs, and is not self-deceived, akratic, grudging, or in the grip of any independent vice. (The classic Huckleberry Finn style case gets its effect from the agent being inarticulate about her own motives; I want that route closed.)
  - Because of the gap between F and G, the right-reasons view must withhold moral worth whilst the tracking view grants it — and neither verdict may be traceable to anything other than that gap.

  Then tell me which feature is doing the work, the smallest change to the case that flips both verdicts (to show me you haven't just stipulated them), and the strongest thing a right-reasons defender says to get the case back.

  Give me exactly six numbered items, no intro and no conclusion, each a short paragraph or two sentences at most:

  1. the scenario
  2. what each of the two views says about it, and why
  3. the feature of the case doing the work
  4. the minimal change that reverses both verdicts
  5. the best attack from a right-reasons defender
  6. your own verdict in a sentence, plus what in your case is still stipulation rather than argument
