      *   **Context:** Final-year seminar on Predictive Processing (PP) and the Free Energy Principle (FEP).
      *   **Problem:** A specific slogan ("Perception is controlled hallucination") is being used ambiguously to shut down arguments (specifically regarding a "perfect prediction implant" vs. "inverting optics" case, and the "dark room" problem).
