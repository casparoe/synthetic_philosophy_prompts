          *   Identify relevant evidence.
          *   **Crucial:** Determine if this reading supports the classmate's conclusion (that the implant case and inverting optics case are indistinguishable in principle, and that the dark room worry is dissolved).
      *   **Final Output:** If none of the readings support the classmate's conclusion, identify the missing premise.

  2.  **Deconstruct the Slogan:** "Perception is controlled hallucination."
      *   *Origin:* Often attributed to Anil Seth, Chris Frith, Karl Friston, etc., within the PP framework.
      *   *Core Intuition:* Top-down predictions generate content; bottom-up signals only correct/constrain.
      *   *The Classmate's Argument:* Since both cases result in low prediction error (PE), and experience is generated by the model, there's no normative difference between "veridical perception" (inverting optics) and "solipsistic loop" (implant). Therefore, "aboutness" (intentionality) is irrelevant or non-existent.

  3.  **Drafting the Theses (Weakest to Strongest):**

      *   *Level 1: The Modulatory Claim (Weak/Platitude).* Perception is influenced by expectations.
          *   *Status:* Trivially true (psychology 101).
          *   *Evidence:* Optical illusions, context effects.
          *   *Does it help the classmate?* No. It doesn't equate hallucination with perception.

      *   *Level 2: The Inferential Claim (Helmholtzian).* Perception is unconscious inference/hypothesis testing.
          *   *Status:* Substantive and defensible (standard PP view).
          *   *Evidence:* Multistable perception, cue integration.
          *   *Does it help the classmate?* No. Inference can still be *about* the world. Valid vs. invalid inference matters.

      *   *Level 3: The Generative Claim (Content Source).* The *qualitative content* of experience is determined by top-down predictions, not bottom-up data. Sensory data is just error signals.
          *   *Status:* Substantive, debated (neuroscience/phenomenology).
