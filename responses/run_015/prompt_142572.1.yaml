          *   *Does it help the classmate?* Closer. If content is purely internal, maybe the source doesn't matter. But it doesn't address *accuracy* or *success*.

      *   *Level 4: The Continuum Claim (Mechanistic Identity).* Hallucination and perception are the same mechanism, differing only in precision weighting/constraint.
          *   *Status:* Substantive and defensible (standard PP psychiatric application).
          *   *Evidence:* Psychosis models, psychedelic states.
          *   *Does it help the classmate?* Yes, structurally. It says they are the *same kind* of state. But it doesn't necessarily say they are *equally valuable* or *indistinguishable normatively*.

      *   *Level 5: The Anti-Realist/Interface Claim (Strong).* There is no access to the world independent of the model; "truth" is just minimization of surprise.
          *   *Status:* Controversial, borders on idealism/solipsism.
