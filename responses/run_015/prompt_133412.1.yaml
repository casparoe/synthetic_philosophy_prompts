answer: |-
  Step (3) fails.

  It looks as though it holds because it treats all consequences of knowledge as *adjustments to the payoff*, when in your system knowledge acts as a *change to the rules*. Good's Theorem assumes the menu of actions remains fixed regardless of what you learn; it assumes that if you would have chosen Action A without the information, Action A remains available to you after you receive it. In your scene, reading the page does not merely lower the payoff of convicting; it removes "Valid Conviction" from the menu entirely, replacing it with "Void Verdict."

  What goes wrong in the gap between "you can always do what you would have done" and "so you can never lose" is the conflation of physical capacity with institutional validity. Oduya *can* physically write "Guilty" after reading the page, but she cannot *enter a verdict of guilt*. The theorem counts the motion; the law counts only the valid act. Because the information constitutively disqualifies the agent from performing the desired act, the "plan that ignores the signal" is no longer on the menu once the signal is received.

  Accepting this costs you the universality of decision theory in your novel's world. You must concede that standard rationality models cannot account for constitutive rules where knowledge itself is a disqualifier, meaning Oduya is not irrational by the lights of her office, only by the lights of a mathematics that does not govern her.

  Here is the sentence for Oduya:

  "If I read this, I do not gain the truth; I lose the court."
