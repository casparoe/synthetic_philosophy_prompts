answer: |-
  This is a remarkably sharp set of observations. You have intuitively landed on several debates that have occupied moral philosophers for the last seventy years, specifically since J.O. Urmson's 1958 paper *Saints and Heroes*. Given your background, I will lean into your analogies. They are more robust than the standard philosophical metaphors.

  Here is an analysis of the apparatus you are describing, broken down by your four specific queries.

  ### 1. The Line: Phase Boundary or Bookkeeping?

  You ask whether the distinction between duty and "beyond duty" (supererogation) cuts nature at a joint or is a cutoff for bookkeeping.

  **The Verdict:** In institutional practice, it is almost certainly a **bookkeeping line**. In moral theory, it is contested, but the practice reveals the pragmatism.

  If the line were a true phase boundary (a real ontological shift in the moral status of the act), we would expect the location to be stable across contexts. But as you noted with the soldier and the lifeguard, the line moves based on *role* and *necessity*.
  *   **Role:** The lifeguard has a contract; the sunbather does not. The physical act is identical; the moral classification changes based on prior consent (employment).
  *   **Necessity:** You mentioned the "crowd with boats." This touches on the *necessity condition*. If five people can save the child, my individual duty to risk death diminishes. If I am the only one, the duty spikes.

  If duty were a fixed property of the act (e.g., "saving a life is always obligatory"), the crowd wouldn't matter. The fact that the crowd *does* matter suggests the line is drawn based on **allocative efficiency**. The institution (society) draws the line where the cost of enforcement exceeds the benefit.
  *   **Below the line:** Acts we can reasonably demand of everyone to ensure social survival.
  *   **Above the line:** Acts we want to encourage but cannot demand without causing systemic burnout or resentment.

  So, what fixes the line? It is a function of **expectation + cost + necessity**. It is a detection limit set by social stability, not a moral absolute.

  ### 2. Deflationary Story vs. Genuine Third Category

  You ask if we could explain the practice deflationarily: praise is just an incentive where compulsion is too expensive, and blame is withheld because enforcement is impossible.

  **The Deflationary Account:** This fits the data well. It explains why we medal the volunteer soldier (incentivizing risk-taking we can't order) but don't punish the compliant one (maintaining morale/discipline). It treats praise as a subsidy for under-enforced obligations.

  **The "No Credit Transfer" Problem:** You noted that heroes don't bank moral credit to spend on later misconduct.
  *   **Deflationary Prediction:** If praise is just social currency to buy compliance, we *should* allow credit transfer. Let the hero speed or be rude; it keeps the "net social good" positive.
  *   **Reality:** Courts and institutions generally reject this. A lifetime of charity does not legally or morally offset a murder.

  **What this implies:** The deflationary story explains the *praise* side, but fails the *blame* side. This suggests the apparatus presupposes a **hybrid picture of duty**:
  1.  **Negative Duties (Don't kill/steal):** These are treated as deontological constraints (absolute boundaries). They do not aggregate. You cannot offset a violation.
  2.  **Positive Duties (Save/Help):** These are treated consequentially. We encourage maximization here via medals, but we don't mandate it.

  The practice assumes you have no "moral bank account." You have specific ledgers. Being a hero in the "Positive" ledger does not grant withdrawal rights in the "Negative" ledger. A pure deflationary story would struggle to explain why we don't let heroes buy down crimes, unless we assume the "cost" of crime is infinite (which returns us to a non-deflationary, absolute view of rights).

  ### 3. The Asymmetry: Why no "Suberogation"?

  You ask why there is a category for "good but not required" (supererogatory) but not "bad but not forbidden" (suberogatory). Philosophers like Marcia Baron have indeed argued for the existence of the **suberogatory** (e.g., eating the last cookie, not visiting your mother, being technically honest but misleading).

  **Why the apparatus ignores it:**
  This is not a gap; it is a feature of liberal institutional design.
  *   **Institutions deal in minimums and maximums.** The law sets the floor (criminality). Medals set the ceiling (heroism).
  *   **The Middle is "Liberty."** The space between duty and supererogation is the zone of personal freedom. To institutionalize blame for the suberogatory (e.g., fining people for not visiting their mothers) would be totalitarian. It requires surveillance of private life that institutions cannot sustain without becoming oppressive.
  *   **Social vs. Institutional:** We *do* punish the suberogatory, but socially, not institutionally. Gossip, loss of reputation, and exclusion are the penalties for being a jerk without being a criminal.

  **Principled Refusal:** The refusal to recognize a negative third category institutionally is principled. It preserves the **zone of optionality**. If every "mildly disappointing" act became punishable, the zone of freedom collapses. The positive category (medals) expands the zone of aspiration without shrinking the zone of freedom. The negative category would shrink freedom. Hence, the asymmetry is necessary for a free society.

  ### 4. Continuous Scale vs. The Cliff

  Finally, you ask if we could ditch the binary (medal/nothing) for a continuous scale of merit, like concentration data.

  **Would anything be lost?** Yes. A lot.
  **Does supererogation need the cliff?** Yes.

  **The Maximizing Problem:** If morality is continuous (i.e., you are always scored on how much good you did), then there is no such thing as "doing enough." If you could have done 1% more, you are technically in deficit. This leads to moral exhaustion.
  The "cliff" (the duty line) creates a **moral safe zone**. It tells the agent: "Up to this line, you are safe from blame. Beyond this line, you are eligible for praise."
  *   **Without the cliff:** Every act is a potential failure to maximize. The soldier who crosses the field when ordered is no longer "neutral"; he is being compared to the volunteer.
  *   **With the cliff:** The soldier who obeys orders has completed his moral transaction. He is "in the clear."

  **Institutional Utility:** Institutions cannot administer continuous scales. Courts need binary verdicts (Guilty/Not Guilty). HR departments need binary decisions (Promote/Don't Promote). While you can score mass spec data continuously, you cannot score *legal liability* continuously without losing the ability to adjudicate.

  The concept of supererogation *depends* on the ceiling because its primary function is to protect the agent from the demand of perfection. It says, "You are not required to be a saint." If you remove the ceiling and make it a continuous scale, sainthood becomes the baseline expectation, and the category of supererogation vanishes.

  ### Summary: The Picture of Duty

  To answer your opening question: **What picture of duty does this apparatus presuppose?**

  It presupposes a **Two-Tiered System of Social Maintenance**:

  1.  **The Floor (Duty):** Based on **Rights and Contracts**. This is deontological. It is binary (met/not met). It is enforceable because it is necessary for coexistence. Violations here are "debts" that cannot be offset by credits elsewhere.
  2.  **The Ceiling (Heroism):** Based on **Utility and Aspiration**. This is consequentialist. It is incentivized but not enforced. It exists to push the boundary of what is possible without mandating it.

  The line between them is **bookkeeping**, not a phase boundary. It is drawn where the cost of enforcement (coercion) would damage the social fabric more than the benefit of the act would help it.

  *   **Why the line moves:** Because the "cost of enforcement" changes with context (crowds, roles, risk).
  *   **Why no credit transfer:** Because the Floor is rights-based (inviolable), while the Ceiling is utility-based (negotiable). You can't trade utility points to buy a rights violation.
  *   **Why no suberogatory punishment:** To preserve the liberty required for the Floor to remain legitimate.
  *   **Why the Cliff:** To prevent moral maximizing from becoming a mandatory requirement, which would make social life impossible.

  Your intuition that the line is "drawn for bookkeeping" is the most robust explanation for the institutional behavior you are observing. The philosophy tries to justify it as real; the practice treats it as a necessary administrative limit.
