  *(Refining the "Credit Transfer" point)*: Why no credit transfer? In a deflationary view, credit *should* buy leniency to encourage good behavior. The fact that it doesn't suggests the "duty" side is deontological (rights-based) while the "hero" side is consequentialist (utility-based). That's a strong point to make.

  *(Refining the "Continuous Scale")*: In mass spec, you have a dynamic range. But you also have detection limits. The "cliff" is the detection limit of *obligation*. Below it, signal is noise (permissible). Above it, signal is real (praiseworthy). But if you make the scale continuous, you lose the "noise floor" of permission.

