answer: |-
  This is a remarkably coherent set of propositions for a one-pager. You have essentially sketched out a **Prioritarian Liberal Egalitarian** position: you care deeply about fair equality of opportunity (3, 6) and procedural fairness (5), you acknowledge the role of luck (1), but you reject the idea that justice requires equal outcomes (2) or that we can reliably measure individual moral worth (5).

  For a lunch group of non-philosophers, this is sturdy. However, you are right to feel a tremor around (2). There are logical tensions here that sharp colleagues will poke.

  Here is the analysis of the tensions, ranked by severity, followed by the options for a single high-leverage revision.

  ### The Tensions (Ranked by Severity)

  **1. The "Market Justice" Triangle: (1) + (7) vs. (2)**
  *   **The Conflict:** (1) says we don't deserve our native assets (brains). (7) says market payoffs are political/legal choices, not natural forces. Neurosurgeons earn 20x cleaners largely because their native assets are scarce and highly valued by the current legal structure of the market. If markets are justice artifacts (7) and rewarding native luck is unjust (1), then the 20x gap *is* unjust. (2) claims it is *not* unjust.
  *   **Why it's bad:** This is the spot where your colleagues will trap you. They will say: "If you agree markets are constructed (7) and luck shouldn't rule (1), how can you defend the specific construction that pays doctors 20x more (2)?"
  *   **What would have to give:** You must stop defending the gap as "not unjust" in a moral sense and start defending it as "instrumentally necessary."
  *   **The Cost:** You lose the moral comfort of thinking the neurosurgeon *rightfully* owns that money. You have to admit the gap is arguably arbitrary/unfair in itself, but tolerated because shrinking it might hurt the mobility goals in (3).

  **2. The Methodological Contradiction: (5) vs. (6)**
  *   **The Conflict:** (5) says institutions should be judged on *process*, not on whether outcomes match desert. (6) demands inheritance tax *because* the outcome (wealth transfer) violates desert (nobody deserves their parents). (6) is a substantive claim about distributive outcomes; (5) is a procedural claim that forbids judging outcomes.
  *   **Why it's bad:** It looks like you are applying skepticism about "desert" only when it helps the rich (5), but invoking "desert" aggressively when it helps the poor (6).
  *   **What would have to give:** You need to clarify that (5) applies to *labor* markets (where effort is invisible) but not *property* laws (where transfer is visible).
  *   **The Cost:** Nuance. You have to explain why we can see "undeserved luck" in inheritance but not in market wages. (It's doable, but it requires verbal heavy lifting).

  **3. The Performative Contradiction: (5) vs. (2)**
  *   **The Conflict:** (5) says "we can't see... how hard anyone tried... institutions should be judged on process." (2) makes a judgment about an *outcome* ("I don't think it's unjust that... earns twenty times"). If we can't judge outcomes (5), you shouldn't be certifying the 20x gap as just (2).
  *   **Why it's bad:** It makes you look like you're breaking your own rule against outcome-judgment whenever you like the outcome.
  *   **What would have to give:** Reframe (2) as a judgment about the *system* that produced the gap, not the gap itself.
  *   **The Cost:** It weakens the rhetorical punch of (2). It becomes "I don't mind the gap if the rules were fair," rather than "The gap itself is fine."

  ---

  ### The Single Revision Strategy

  You asked for the one revision that cleans up the most. There are three candidates. Each resolves the top tensions but extracts a different price from your worldview.

  #### Option A: Revise Proposition (2)
  **The Move:** Change (2) from a claim about *justice* to a claim about *incentives*.
  **New Wording:** *"I don't think we should try to level the 20x gap by force. Not because the neurosurgeon 'deserves' it in a cosmic sense, but because we need those incentives to ensure the best people enter training, which ultimately serves the mobility goal in (3)."*
  **What it Fixes:** It dissolves the Triangle Tension (1+7 vs 2). You admit the gap might not be "deserved" (satisfying 1 & 7) but argue it is *permissible* for utilitarian reasons (saving 2). It also aligns perfectly with (3).
  **The Cost:** You lose the moral high ground. You are admitting the inequality is essentially a "necessary evil" rather than a moral good. Some colleagues might find this cynical; others will find it more honest.

  #### Option B: Revise Proposition (5)
  **The Move:** Drop the agnosticism. Admit we *can* judge outcomes, just not on "effort."
  **New Wording:** *"We can't see effort from the outside, so we shouldn't try to match pay to moral worth. But we can and should judge outcomes based on whether they preserve opportunity (3) or cement caste (6)."*
  **What it Fixes:** It resolves the Methodological Contradiction (5 vs 6). It allows you to tax inheritance (an outcome) and defend the wage gap (an outcome) using the same metric: *does this help or hurt mobility?* It also resolves the Performative Contradiction (5 vs 2).
  **The Cost:** It opens the door to the "leveling intuition" you rejected in (2). If you admit outcomes are judgeable, colleagues will ask: "If we can judge outcomes for mobility, why not judge them for poverty?" You have to hold the line that *mobility* is the only outcome metric that matters.

  #### Option C: Revise Proposition (7)
  **The Move:** Soften the claim that markets are pure justice artifacts.
  **New Wording:** *"Markets are partly legal artifacts, but they also reflect real scarcity and coordination problems that aren't fully under our moral control."*
  **What it Fixes:** It relieves the pressure on (2). If markets aren't *fully* justice artifacts, you aren't fully responsible for the 20x gap. It creates space between (1) and (2).
  **The Cost:** It weakens your argument for (6). If markets aren't fully political constructs, why is inheritance (a property right) fully taxable? It dilutes your leverage to argue for structural change. It makes you sound more like a libertarian than you intend.

  ### Recommendation

  If I were sitting at that lunch table, **Option A (Revising 2)** is the cleanest cut.

  It keeps your moral philosophy (1, 6, 7) intact: Luck is real, inheritance is unfair, markets are political. It keeps your political goal (3) intact: Mobility is the priority. It simply clarifies that the wage gap is a *tool* for (3), not a reflection of *truth* about (1).

  This prevents the argument from collapsing into "Do they deserve it or not?" (which you say leads nowhere). Instead, it forces the argument to: "Is this gap actually necessary for mobility?" That is a much better lunch debate.
