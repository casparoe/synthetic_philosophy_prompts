answer: |-
  **The setting:** *1:30 AM. The kitchen table is covered in empty Chinese takeout containers and napkins. Alex is stirring a cold cup of tea. Jordan is leaning back in the chair, picking at a loose thread on their sleeve. The argument has been going on for an hour, paused only by the arrival of the food.*

  **Alex:** I'm still stuck on the property thing. You keep looking at me like I'm suggesting I own a slave, but that's not it. It's about jurisdiction. When I sign that directive, I'm drawing a boundary around my life. I'm saying, "This is the shape of my narrative, and it ends here."

  **Jordan:** But you're drawing that boundary around a body that's going to keep breathing after you've left the building. That's the disconnect. You're treating the person in the bed like a vessel you rented out to your future self, and when the lease is up, you expect them to vacate. But they can't vacate. They're still there.

  **Alex:** They're not *there*, though. That's the hard truth. The person who signed the paper—the one with your values, your memories, your fear of being a burden—that person is gone. The thing in the bed is a biological successor. If I don't enforce the directive, I'm letting a stranger occupy my life's conclusion. That's what I mean by diachronic property rights. It's not ownership of a person; it's ownership of the *story*. Ignoring the directive is trespassing on the only thing I actually own: my biography.

  **Jordan:** Okay, but let's press on that property analogy. If I own a house, and I write in my will that "upon my death, burn this house down," but someone is living inside it when I die... you don't burn it down. You evict them safely. The directive assumes the house is empty. But in dementia, especially the slow decline, the house isn't empty. There's someone home. They might not know the address, they might not know why the walls are painted blue, but they feel the warmth. They feel the pudding.

  **Alex:** I hear you. But if we prioritize the pudding, the directive becomes optional. It only applies when the patient *can't* object. So you're saying the directive is only valid when the patient agrees with it? Then why write it?

  **Jordan:** No, I'm saying the directive is valid until it conflicts with the basic welfare of the living being. You're arguing that the past self has veto power over the present self's happiness. I'm asking: Can the present self's experience *ever* override the directive? If the person in the bed is genuinely happy—not just confused, but laughing, engaging, recognizing their daughter—is it moral to starve them because their past self decided death was preferable to dependency?

  **Alex:** This is where I have to be rigid. If I say "yes, present happiness can override," I've destroyed the concept of autonomy. Because dementia doesn't just take memory; it changes values. Someone who was fiercely independent might become perfectly content being fed and washed. If we let the demented self veto the competent self, we're saying that losing your mind gives you new rights to violate your own prior wishes. That's not liberation; it's a trap. So, to answer you: No. Present experiential interests cannot override a valid directive based on critical interests. Not just because of property, but because of integrity.

  **Jordan:** Integrity for who? The ghost? Look, I'm not saying we ignore the directive if the person is suffering. If they're in pain, the directive helps. But what if they aren't? What if the "indignity" you feared is only an indignity to *you*, the observer? The patient doesn't feel undignified. They feel loved. They feel full. You're sacrificing a real, feeling creature's life to protect the reputation of a dead person.

  **Alex:** I'm not protecting a reputation. I'm protecting the right to define what makes my life worth living. If I decide that being a vegetable is worse than death, that judgment stands even if the vegetable enjoys sunlight. But... okay. Let's talk about the wobbly bits. You brought up fluctuating lucidity earlier. That's the edge case I lose sleep over.

  **Jordan:** Right. Because that breaks your "different entity" theory. If I have an hour where I'm fully me, I look at you and I say, "I'm glad I'm still here," does that count? Or is that just noise?

  **Alex:** It counts as evidence, but not as a veto. Here's why: Lucidity in late-stage dementia is fragile. It's often followed by confusion or distress. If we let a lucid hour override the directive, we introduce massive risk. Families will project onto those hours. They'll hear what they want to hear. The directive is the only stable data point we have. The lucid moment might be real, but it's not reliable. It's a flicker. You can't build a life-or-death policy on a flicker.

  **Jordan:** But if the flicker says "live," and you extinguish it anyway, you're saying the flicker doesn't matter. You're saying the only thing that matters is the consistent, rational past self. But what if the rational past self was wrong about what the future self would feel? We know people adapt. We know disability doesn't feel to the disabled person what it feels to the observer. Your past self is predicting suffering that isn't happening.

  **Alex:** But I'm not predicting suffering. I'm predicting *loss*. Loss of who I am. You're arguing that as long as there's dopamine, there's value. I'm arguing there's value in coherence. If I lose coherence, I've lost the thing I was trying to protect. The property right isn't over the flesh; it's over the meaning.

  **Jordan:** See, that's where the property analogy breaks. You can't own meaning once you're gone. Meaning is intersubjective. It happens between people. If your daughter looks at you and sees *you*, even a diminished version, and she finds meaning in feeding you... who are you to tell her from the grave that her experience is invalid? You're claiming authority over a relationship you're no longer part of.

  **Alex:** I'm claiming authority over my own body's usage. Look, I'll concede this: If the present self is experiencing *agony*, the directive might be moot because care becomes torture. But if the present self is experiencing *joy*? I still think the past self wins. Because that joy is contingent on a broken mind. It's a chemical accident. My refusal was a moral choice. I prioritize the moral choice over the chemical accident.

  **Jordan:** That's cold. Calling their joy a chemical accident.

  **Alex:** It's not cold, it's consistent. If I take a drug that makes me happy but lobotomizes me, you'd say I've lost something essential. Dementia is the lobotomy happening naturally. Why should I honor the happy lobotomized version over the sober pre-lobotomy version?

  **Jordan:** Because the lobotomized version is the one screaming if you stop the food. The pre-lobotomy version is silent. You're privileging the voice that isn't there anymore over the voice that is. And on the lucidity thing—I still think you're dodging. If during that lucid hour, I sign a new document saying "I revoke the old one," does it stand?

  **Alex:** Legally? No. Medically? It creates chaos. Ethically... it creates a paradox. If you're lucid enough to revoke, you're lucid enough to know why you signed the first one. If you revoke it anyway, you're saying your values have changed. But if your values change because of brain decay, are they *your* values? Or are they the disease's values?

  **Jordan:** How do you tell the difference? Where's the line between "I changed my mind" and "the disease changed my mind"? If you can't draw that line, you can't claim the past self is the only real owner.

  **Alex:** You draw the line at capacity. That's the whole point of the directive. It locks in the decision at the peak of capacity. Everything after is decline. You're asking me to trust the decline more than the peak.

  **Jordan:** I'm asking you to trust the living more than the dead. Even if the living are broken. Especially then.

  **Alex:** *Sighs, pushing the tea away.* I know. I know that's the emotional weight of it. It feels like killing someone who is smiling at you.

  **Jordan:** It feels like betrayal. Like you're siding with a ghost against a child. Because that's what they become.

  **Alex:** But if I side with the child, I betray the adult who trusted me to protect them from becoming the child. It's a double bind. There's no clean win here.

  **Jordan:** No. There isn't. But I think favoring the ghost is the colder calculus.

  **Alex:** Maybe. Or maybe it's the only way to keep the promise. *Pauses.* Pass me the lo mein? It's cold but I'm still hungry.

  **Jordan:** *Slides the container over.* Yeah. Me too. We're not solving this tonight.

  **Alex:** No. But I think I understand why you think I'm trespassing.

  **Jordan:** And I think I understand why you think I'm ignoring the lease.

  **Alex:** Exactly. Pass the soy sauce.
