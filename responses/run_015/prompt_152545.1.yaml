answer: |-
  This is a fantastic set of questions. You are touching on the exact friction points where computer science meets traditional epistemology. Your friend is arguing from the perspective of *computational* rationality (what can be done), while you are arguing from the perspective of *ideal* rationality (what ought to be the case). Logical Induction (LI) is explicitly an attempt to bridge these, which is why the confusion arises.

  Here is a breakdown of the three points to help you prepare your seminar, starting with your Dutch Book worry.

  ### 1. The Dutch Book Objection: Existence vs. Exploitability

  **Verdict:** Your friend is right about the *framework's goal*, but you are right about the *classical interpretation*. However, your objection misses the specific normative shift LI proposes.

  **The Technical Detail:**
  You are correct that at any finite stage $t$, the prices $P_t$ set by a logical inductor are not probabilistically coherent. Therefore, by the standard Dutch Book theorem, there exists a finite set of bets that guarantees a loss. Mathematically, the incoherence is real.

  **Where the Objection Breaks:**
  The normative force of the Dutch Book argument relies on the principle that **rational agents should avoid sure losses.** However, in the context of logical uncertainty, we must add a computational constraint: **Ought implies can.**

  To exploit the incoherence of a logical inductor at stage $t$, a bookie must find the specific combination of sentences that constitute the Dutch Book. In the LI framework, the "bookies" are the **traders**. The headline guarantee of Logical Induction is that no *polynomial-time* trader can make unbounded money.

  If the Dutch Book exists but requires exponential time to find (which is often the case for logical incoherence involving complex deductions), then a bounded agent *cannot* be expected to avoid it.
  *   **Classical Norm:** "Your credences must be coherent." (Implies logical omniscience).
  *   **LI Norm:** "Your credences must not be *efficiently* exploitable."

  **Seminar Takeaway:**
  Your objection holds if you assume the norm of rationality is **Ideal Coherence**. LI rejects this norm for bounded agents. It replaces it with **Computational Efficiency**. The "sure-loss contract" is only a defect if the agent could have reasonably detected it. If detecting the loss is harder than the agent's computational budget allows, the loss is not a rational failure; it is a resource constraint.

  You can frame this to your students as a shift from a **state-based norm** (be coherent now) to a **process-based norm** (don't leave money on the table that you have the resources to pick up).

  ### 2. The Continuum Hypothesis (CH) and Undecidables

  **Verdict:** Your friend is **incorrect**. This is a crucial distinction for your students.

  **The Error:**
  Your friend is conflating **truth in a model** with **provability in a theory**.
  Logical Inductors operate over a formal language and a deductive process (e.g., ZFC). They learn by observing proofs.
  *   If a sentence $\phi$ is a theorem ($\vdash \phi$), the inductor's price converges to 1.
  *   If $\neg\phi$ is a theorem, the price converges to 0.
  *   If $\phi$ is **independent** of the theory (like CH in ZFC), there is no proof for the inductor to observe.

  **The Consequence:**
  For independent sentences, the Logical Induction criterion does **not** force convergence to a specific value (like 1 or 0, or even 0.5). Different logical inductors (constructed with different initial trading populations) can converge to different limits for undecidable sentences. One inductor might converge to 0.6 on CH, another to 0.4. Both satisfy the Logical Induction criterion.

  Therefore, LI does **not** deliver "the correct prior" on undecidable cases. It merely ensures that whatever prior you end up with isn't *exploitable* by efficient traders. It does not solve the problem of the "ur-prior" or tell us whether CH is "true" in a Platonic sense. It essentially formalizes the idea that without new axioms, rational opinion on CH is underdetermined.

  **Seminar Takeaway:**
  This is a great place to discuss the difference between **semantic uncertainty** (which model are we in?) and **syntactic uncertainty** (what follows from the axioms?). LI handles syntactic uncertainty well. It does not resolve semantic uncertainty regarding independent statements.

  ### 3. The $10^{12}$th Digit of Pi

  **Verdict:** You are right; your friend is assuming logical omniscience.

  **The Argument:**
  Your friend is defining rational credence as a function of the **state of the world** (the digit *is* 7 or it isn't). You are defining it as a function of the **state of the agent** (what does the agent know?).

  If credence must be 0 or 1 for all mathematical truths, then a rational agent who has not computed the digit is *necessarily irrational*. This makes the concept of rationality useless for modeling human mathematicians or AI systems.

  **Why 10% (or uniform) is rational in LI:**
  In the LI framework, before the computation is performed, the digit of Pi behaves like a pseudorandom variable relative to the agent's current deductive state. There is no efficient pattern the traders can exploit to push the price away from the uniform distribution (10% for each digit 0-9).
  *   Assigning 0.1 reflects the **absence of evidence**, not the **presence of falsehood**.
  *   As the agent allocates more compute to calculating Pi, the price *will* converge to 0 or 1.

  **How to avoid begging the question:**
  Don't argue about what belief *is*. Argue about **betting behavior**.
  Ask your friend: "If you are forced to bet on the digit right now, without running the calculation, would you bet your life savings on '7'?"
  *   If they say "No," then their *effective* credence is not 1.
  *   If they say "Yes," they are irrational by standard decision-theoretic lights (positive expected utility vs. guaranteed ruin risk if they are wrong).
  LI captures the "No" intuition formally. It models the credence of an agent who *will* know the truth eventually but doesn't *yet*.

  **Problem Set Suggestion:**
  For the problem set, you could ask students to sketch a trader that makes money against an agent who assigns 0.99 to the digit being 7 *before* the computation is done, assuming the digit is actually 3. This demonstrates that being "confident but uncomputed" is exploitable, whereas being "uncertain and uncomputed" (10%) is not.

  ### Summary for your Seminar

  1.  **On Dutch Books:** The norm shifts from "No Dutch Books exist" to "No *Efficient* Dutch Books exist." Incoherence is permitted if finding it is computationally hard.
  2.  **On Undecidables:** LI does not solve the prior problem for independent sentences. Limits vary by inductor construction.
  3.  **On Pi:** Credence tracks *deductive progress*, not just *truth conditions*. 0/1 credence is for omniscient agents; LI is for bounded ones.

  Your instinct that the framework is "merely useful" rather than "normative" in the classical sense is sharp. LI is arguably a **normative theory for bounded agents**, which requires redefining the norms. If you hold fast to classical Bayesian norms, LI looks defective. If you accept that rationality is resource-sensitive, LI looks like a breakthrough. That tension is exactly what your seminar should explore.
