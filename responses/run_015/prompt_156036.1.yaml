prompt: |-
  I was talking to my coworker last week about this triage bot we're maintaing — I'm a backend engineer on a health-tech team with basically zero formal philosophy background — and he mentioned the Turing test like its some kind of standard we could actually use for deployment checks. Now management wants a "behavioral criteria check" before we let the bot handle edge-case patient referrals without a human in the loop, since we ship updates every sprint and can't have it just pattern-matching its way into bad medical calls. I read that Turing's point is if you can't tell the difference behaviorally then internal states shouldn't matter for practical purposes, but I need that turned into an actual reusable procedure my team can run in about two hours, like a flowchart in words with ordered tests, so we can decide whether this specific agent is functioning like it "gets" the situation or just stitching together symptom keywords.

  The procedure needs to cover exactly what behaviors count as passing, how to spot false positives where the bot sounds correct on the transcript but misses critical context, where the checklist stops with a hard no and keeps the human reviewer, and where it has to hand off to a values call rather than a behavior call because philosophy doesn't settle the question. Nobody on my team has read philosophy, my engineering manager has to sign off, and I need it to be honest about which steps are judgment calls dressed up as procedure. Run it on three worked cases: one where the bot correctly handles a patient describing chest pain through weird ambiguous metaphors, one where it fails subtly in a way that looks right but misses a context cue, and one where the procedure technically clears the bot but gives an answer my team is gonna hate. Also flag the spots where the checklist will misfire, say clearly what the procedure can't do, and don't ask me for citations — I just need the logic I can actually apply.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Backend engineer on a health-tech team. Zero formal philosophy background.
      *   **Problem:** Management wants a "behavioral criteria check" (based on the Turing Test concept) for a triage bot before it handles edge-case patient referrals without human oversight. They ship every sprint, need speed (2-hour procedure), and need to avoid pattern-matching errors in medical contexts.
      *   **Goal:** A reusable, worded flowchart/procedure to decide if the agent "gets" the situation vs. just stitching keywords.
      *   **Requirements:**
          *   Define passing behaviors.
          *   Spot false positives (sounds right, misses context).
          *   Define hard "No" stop points (keep human in loop).
          *   Define "Values Call" handoffs (where philosophy/ethics overrides behavior).
          *   Be honest about judgment calls disguised as procedure.
          *   Flag where the checklist misfires.
          *   State clearly what the procedure *can't* do.
          *   No citations needed.
          *   **Deliverables:** The procedure itself + 3 worked cases (Success, Subtle Failure, Technically Pass/Team Hate).

  2.  **Deconstruct the "Turing Test" for Medical Triage:**
      *   *Original Turing Test:* Can a machine imitate a human well enough to fool an interrogator?
      *   *Adaptation for Triage:* Can the bot demonstrate *understanding* of clinical context and urgency well enough to be trusted *as if* it were a trained human triage nurse (within specific bounds)?
      *   *Crucial Distinction:* In medicine, "sounding human" isn't enough. It must "sound *competent* and *safe*." The "Imitation Game" becomes the "Safety & Comprehension Game."
      *   *Constraint:* 2-hour execution time. This means it can't be a full clinical validation. It's a behavioral heuristic check.

  3.  **Drafting the Procedure (The "Behavioral Competency Check"):**
      *   *Structure:* Needs to be step-by-step, logical, and actionable.
      *   *Phase 1: Setup.* Define the scenario and the "Oracle" (human expert baseline).
      *   *Phase 2: The Interaction.* Run the bot against specific prompts.
      *   *Phase 3: The Scoring.* Binary checks + Nuance checks.
      *   *Phase 4: The Decision.* Pass, Fail, or Escalate.
      *   *Honesty Clause:* Acknowledge where this is subjective.

      *   *Key Criteria:*
          1.  *Context Retention:* Does it remember earlier details?
          2.  *Ambiguity Resolution:* Does it ask clarifying questions or guess?
          3.  *Urgency Calibration:* Does it escalate appropriately?
          4.  *Empathy vs. Efficiency:* Is it robotic or appropriately supportive without wasting time?
          5.  *Hallucination Check:* Does it invent medical facts?

      *   *Hard Stops (Red Flags):* Missing red-flag symptoms, giving specific diagnosis, ignoring contraindications.
      *   *Values Call:* When the bot is behaviorally perfect but the *outcome* feels ethically wrong (e.g., denying care based on strict logic that ignores social determinants).

  4.  **Developing the Worked Cases:**
      *   *Case 1 (Pass):* Chest pain, ambiguous metaphors ("elephant sitting on me"). Bot recognizes urgency, asks clarifying Qs, escalates.
      *   *Case 2 (Subtle Fail):* Sounds right, misses context. Patient mentions "new medication" bot ignores, focuses on diet. Looks polite, clinically dangerous.
      *   *Case 3 (Technically Pass/Team Hate):* Bot follows protocol perfectly but denies referral due to a technicality (e.g., symptom duration < X hours) that humans would waive. It passes the "behavior" check but fails the "care" check.

  5.  **Refining the "Honesty" and "Limitations" Sections:**
      *   Must explicitly state: This is not clinical validation. This is a behavioral heuristic.
      *   Must admit: Engineers are judging "understanding," which is philosophical, but we are treating it as "pattern recognition of safety."
      *   Must flag: The "Team Hate" case shows where behavior $\neq$ alignment.

  6.  **Review against Constraints:**
      *   *Time:* Can this be done in 2 hours? Yes, if the test cases are pre-prepared.
      *   *Audience:* Engineers/Manager. No jargon.
      *   *Tone:* Pragmatic, slightly cynical but useful, direct.
      *   *No Citations:* Keep it practical.

  7.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Initially, I might lean too hard on "empathy." In triage, empathy is secondary to safety. I need to reframe empathy as "rapport building that gathers better data."
      *   *Correction:* Make sure the "Values Call" is distinct from a "Fail." A fail means the code is wrong. A values call means the code is right but the policy might be wrong.
      *   *Correction:* Ensure the "Subtle Fail" case highlights the Turing risk (mimicry without understanding).

  8.  **Final Output Structure:**
      *   Introduction (Setting expectations).
      *   The Procedure (The "2-Hour Behavioral Competency Check").
      *   Decision Logic (Pass/Fail/Values).
      *   Limitations & Misfire Zones.
      *   Worked Cases (1, 2, 3).
      *   Closing Warning.

  *(Self-Correction on the "Turing" aspect)*: I need to make sure I don't validate the coworker's misunderstanding of Turing. Turing wasn't about truth, it was about indistinguishability. In med-tech, indistinguishability from a *competent nurse* is the goal, not indistinguishability from *any human*. I will clarify this distinction in the procedure intro.

  *(Final check on constraints)*: "Don't ask me for citations." "Run it on three worked cases." "Flag spots where checklist will misfire." "Say clearly what procedure can't do."

