  # Part 1: Activity Plan

  ## Setup
  Arrange the room into six clusters of movable tables, each accommodating three students. Place a pile of counters (or paper clips) in the centre of each cluster. Distribute one printed 'Role and Score Sheet' per student and one set of 'Evidence Cards' per group. You, the convenor, retain the 'Master Truth Key' (a printed copy of the Card Deck Table from Part 2 with the Hidden Truth Value column visible). Ensure students do not see the Master Key.

  ## Materials
  *   **Printable Pack (2 sides A4):** Side one contains the Role and Score Sheets (Speaker, Hearer, Adjudicator roles defined neutrally). Side two contains the Evidence Cards (6 scenarios, printed twice to make 12 cards per group pack, omitting the 'Hidden Truth Value' and 'Proper under...' columns found in the Master Key).
  *   **Index Cards:** Three per group (for secret voting on Blame).
  *   **Counters:** Twenty per group (to track scores).
  *   **Master Truth Key:** One copy for the convenor (the Table from Part 2).
  *   **Timer:** Visible to all.

  ## Roles
  Each group of three assigns roles for the first round, rotating clockwise each subsequent round.
  *   **The Speaker:** Draws an Evidence Card. Decides whether to make a Statement based on the evidence provided.
  *   **The Hearer:** Listens to the Statement. Decides whether to Act on it (accept it as basis for action) or Ignore it.
  *   **The Adjudicator:** Observes the interaction. After the truth is revealed, leads the group discussion on whether the Speaker was to blame, regardless of the outcome.

  ## Round Sequence (100 Minutes)

  **00:00 – 00:10: Introduction and Setup**
  Explain the goal: groups must maximise their total score over four rounds. Define the three scoring streams neutrally:
  1.  **Success Points:** Awarded if the Hearer's action matches the actual state of the world.
  2.  **Care Points:** Awarded if the Speaker followed the evidence limits on their card.
  3.  **Blame Tokens:** Deducted if the Adjudicator and group agree the Speaker behaved improperly.
  Emphasise that the 'Hidden Truth Value' is known only to you. Students must not ask you for it during the round.

  **00:10 – 00:20: Practice Round (Low Stakes)**
  Distribute one practice card (Scenario 1, Low Stakes). Run through the mechanics: Speaker decides, Hearer decides, Adjudicator notes blame. Reveal truth from Master Key. Calculate scores. Clarify rules.

  **00:20 – 00:50: Main Rounds (Four Rounds, 7.5 Minutes Each)**
  *   **Round 1 (Low Stakes, Standard Evidence):** Use Scenario 1. Focus on baseline behaviour.
  *   **Round 2 (High Stakes, Standard Evidence):** Use Scenario 1 (High Stakes version). Announce "Stakes are now High: errors cost double Success Points." Observe if Speakers become more cautious.
  *   **Round 3 (The Lottery):** Use Scenario 3. Evidence is statistical only. Truth is favourable. This tests the 'True but Unknown' intuition.
  *   **Round 4 (The Emergency):** Use Scenario 4. Time pressure is simulated (give them only 2 minutes to decide). Evidence is strong but not absolute. This tests the 'Paralysis' risk.

  **00:50 – 01:00: Scoring and Calculation**
  Groups tally their Success Points, Care Points, and Blame Tokens. Ask each group to write their total on the board. Note discrepancies: did any group score high Success but high Blame? Did any group score zero Success but zero Blame?

  **01:00 – 01:20: Debrief**
  Do not use technical terms yet. Ask:
  1.  "In Round 3, the Speaker was right, but did they deserve Care Points? Why did you assign Blame?" (Elicits the distinction between truth and entitlement).
  2.  "In Round 4, did the Speaker wait too long? Did the High Stakes change what they were allowed to say?" (Elicits the stakes sensitivity).
  3.  "Is it possible to be wrong to speak, even if you couldn't have known you were wrong?" (Elicits the blameless impropriety distinction).
  Finally, introduce the vocabulary: map 'Care Points' to Justification, 'Success Points' to Truth, and the debate over 'Blame' to the Knowledge Norm versus Truth Norm. Address the objection that a rule one cannot check (Knowledge) cannot guide action.

  **01:20 – 01:40: Open Discussion**
  Allow students to debate the scoring. Did the game penalise the cautious expert too harshly? Did it reward the lucky gambler too much? Connect this to the solicitor's view versus the philosopher's view.

  ## Scoring
  *   **Success Stream (Hearer):** +10 counters if Hearer Acts and Proposition is True; +0 if Hearer Ignores and Proposition is False; -10 if Hearer Acts and Proposition is False. (High Stakes doubles these values).
  *   **Care Stream (Speaker):** +10 counters if Speaker Asserts only when Evidence is marked 'Sufficient' on the Master Key; -10 if they Assert on 'Insufficient' evidence.
  *   **Blame Stream (Group):** The Adjudicator leads a vote. If the group agrees the assertion was improper, place 1 Blame Token on the table. Each Token deducts 5 counters from the group total. This allows a Speaker to be Careful (high Care Points) but still Blamed (if the rule is stricter than evidence), or Reckless but Lucky (high Success Points but high Blame).

  ## Predictable Failures
  1.  **Admissibility vs. Propriety:** Law students may refuse to assert because evidence is 'hearsay' or inadmissible in court, conflating legal rules with epistemic norms. *Fix:* Remind them this is a private conversation, not a courtroom.
  2.  **Gaming the Truth:** Students may try to deduce the Hidden Truth from your tone when you reveal the key. *Fix:* Maintain a neutral poker face; write the truth on the board instead of speaking it.
  3.  **Collusion:** Groups may agree to ignore the Blame stream to maximise points. *Fix:* Remind them the Adjudicator must vote independently before discussion.

  ## Irreproducible Feature
  The game records blame, but it cannot generate the internal phenomenological feeling of 'normative force'. Students may treat Blame Tokens as mere point-loss rather than feeling the normative violation. You must supply the philosophical weight of 'blamelessness' versus 'correctness' in the debrief.

  ## Facilitator Must Supply
  The connection between the 'Care Stream' and the concept of 'warrant'. The game separates evidence from truth, but you must explicitly articulate in the debrief that the 'Knowledge Rule' requires both, whereas the 'Truth Rule' requires only the outcome, to resolve the flatmate's objection about the rule doing no work.

