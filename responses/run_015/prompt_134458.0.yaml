answer: |-
  The ice in Lena's glass had melted down to a singular, lonely cube. She tapped it against the rim, listening to the dull clink over the hum of the hotel HVAC.

  "Look," Lena said, leaning forward over the sticky coaster. "The panel glossed over the hard bit. Mara isn't just choosing between two known goods. She's choosing between being Mara-One and Mara-Two. And Mara-One literally lacks the concepts to evaluate Mara-Two's primary reward structure. You can't maximize utility over a variable you can't define."

  Kieran swirled his bourbon, watching the amber liquid catch the low light. "I'm not saying she can define the variable. I'm saying she doesn't need to. That's the whole point of the proxy reasoning."

  "Proxy reasoning breaks down when the transformation is total," Lena countered. "If the mod dulls her emotional attachment to people to heighten mathematical synesthesia, the 'value' of friendship changes category. It's not just less important; it's a different kind of thing. So when you tell her to look at analogues—people who took partial mods, or people who dedicated their lives to math—that's misleading. They haven't undergone the *ontological* shift."

  "Okay, but here's where you're missing the twist I tried to slip in during Q&A," Kieran said, pointing a finger at her. "It's not just that Mara-One can't imagine it. It's that Mara-Two can't tell her about it. I'm calling it the reverse authority problem."

  Lena paused, her hand halfway to her glass. "Reverse authority?"

  "Standard view is that the future self is the authority on whether the change was worth it. But if the mod reindexes your values thoroughly, Mara-Two's testimony is contaminated. She says, 'It's wonderful, the math feels like music.' But 'wonderful' now means something different. Her evaluative vocabulary has been rewritten to fit the new neural architecture. She's not lying, but she's speaking a language Mara-One doesn't speak. Her endorsement doesn't transfer back across the transformation."

  Lena sat back, picking up a napkin. She started folding the corner tightly. "So you're saying the post-mod agent is epistemically sealed off from the pre-mod agent. That makes it worse, Kieran. If the future self can't advise faithfully because their 'good' isn't my 'good', then Mara is epistemically stranded. She's not liberated by choice; she's blindfolded. You can't call that rational agency."

  "Stranded doesn't mean irrational," Kieran said, leaning in. "It just means we're using the wrong model of rationality. You're assuming rationality requires a preview of the phenomenal outcome. Expected utility theory needs probabilities and values. We don't have the values. So we drop the requirement for phenomenal access."

  "But then what are we maximizing?" Lena asked. She gestured with the napkin, knocking her glass slightly. A bit of gin and tonic sloshed over the side, wetting the table. She didn't notice. "If we aren't maximizing value, and we aren't relying on the future self's testimony because of your reverse authority problem, what's the decision rule? Flipping a coin?"

  "No. Structural rules," Kieran said. "Think about it like constitutional design. You don't know what specific laws will be passed in ten years, but you can decide on the structure of the legislature based on principles you hold *now*. Mara doesn't need to know what the math-joy feels like. She needs to decide if she values *capacity expansion* over *status quo stability*. That's a structural preference. It doesn't require knowing the qualia."

  Lena wiped the spill with the corner of the napkin she'd been mutilating. "But does that structural preference preserve the value content? Or just the behavioral patterns? If I choose 'capacity expansion,' I might end up maximizing something that looks like success from the outside but feels like hollow mechanics from the inside. Your structural rule gets her to the decision, but it doesn't guarantee the decision respects her current values. It just respects her current *syntax*."

  "Exactly," Kieran said, snapping his fingers. "It respects the syntax. And that's all we have. We're syntactic creatures trying to navigate semantic shifts. If Mara values coherence and growth as abstract principles, she can authorize the mod based on those principles without needing to preview the math-joy. The rationality lies in the consistency of the commitment, not the accuracy of the prediction."

  "But that's a hollow victory," Lena said, her voice dropping. "You've saved rationality by evacuating the thing that matters. If I choose based on structural rules because I can't access the values, I'm essentially authorizing a stranger to take over my life and call it 'me'. The reverse authority problem proves the continuity is broken. If Mara-Two's 'good' is unintelligible to Mara-One, why should Mara-One care about satisfying Mara-Two's structural preferences?"

  "Because Mara-One has to live with the consequences of the choice, even if she can't understand the experience," Kieran replied. "You're looking for a guarantee of happiness. I'm offering a guarantee of agency. You can't have the first without epistemic access you don't possess. You can have the second by adhering to a rule that doesn't depend on impossible knowledge."

  Lena sighed, pushing the wet napkin aside. She looked at her reflection in the dark window behind the bar. "So we're just betting on structure because the content is inaccessible."

  "We're always betting on structure," Kieran said, lifting his glass. "We just pretend we know the odds because it makes us sleep better. Mara's just honest enough to admit the house is dark."

  Lena clinked her glass against his, reluctantly. "Dark house, bright math. I still think she's stranded."

  "Maybe," Kieran said, taking a sip. "But she's stranded voluntarily. That has to count for something."
