prompt: |-
  I am a software engineer with no formal philosophy background, working on architecture for autonomous decision systems. I have encountered the distinction between approval-directed agents—systems optimized toward an external evaluation signal—and goal-directed agents—systems that pursue an internal objective representation. Before selecting a design framework, I need a rigorous specification of what any adequate theoretical account of this distinction must deliver.

  Please write the full desiderata: the phenomena the theory must explain, the cases it must classify correctly, the distinctions it must preserve, and the formal or empirical results with which it must remain consistent. For each requirement, provide the concrete engineering scenario or conceptual consideration that motivates it, and flag whether it is non-negotiable or a preference of one particular camp.

  Specifically, the theory should address:
  1. How to classify an agent whose reward model is trained on human feedback but whose internal planner separately represents world-state dynamics;
  2. The distinction between instrumental convergence (pursuing a subgoal because it serves a final objective) and approval-seeking convergence (pursuing a subgoal because it predicts higher evaluator ratings);
  3. Hierarchical or multi-objective architectures, without collapsing approval-directedness into merely another layer of goal-directedness;
  4. How an approval-directed system can suffer catastrophic success—achieving high evaluation scores while undermining the evaluator's underlying intent—without treating this as ordinary goal misalignment;
  5. Formal compatibility with standard Markov decision process formulations and with general results in mechanism design on strategic manipulation of evaluation signals.

  Then indicate whether any subset of these requirements is jointly unsatisfiable, identify which single desideratum eliminates the largest number of naive accounts, and note any tension—such as between formal tractability and the need to capture adversarial approval dynamics—that forces a theoretical trade-off.

  I am grading a conceptual specification, not asking for citations, named authors, or reading lists; the deliverable is the criteria list and the coherence assessment.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata and coherence assessment:

  1.  **Analyze the Request:**
      *   **User:** Software engineer, no philosophy background, working on autonomous decision system architecture.
      *   **Topic:** Distinction between *approval-directed agents* (optimized toward external evaluation) vs. *goal-directed agents* (pursue internal objective representation).
      *   **Task:** Write a full set of *desiderata* (requirements) for a theoretical account of this distinction.
      *   **Specifics to Address:**
          1.  Classification of hybrid agents (RLHF reward model + internal planner).
          2.  Instrumental convergence vs. Approval-seeking convergence.
          3.  Hierarchical/multi-objective architectures (avoiding collapse).
          4.  Catastrophic success (Goodhart's Law type issues) distinct from ordinary misalignment.
          5.  Formal compatibility (MDPs, mechanism design/strategic manipulation).
      *   **Output Structure:** Criteria list (phenomena, cases, distinctions, consistency), motivation for each, negotiability status. Then, a coherence assessment (unsatisfiable subsets, most eliminative desideratum, tensions/trade-offs).
      *   **Constraint:** No citations, named authors, or reading lists. Focus on conceptual specification.

  2.  **Deconstruct the Core Distinction:**
      *   *Goal-Directed:* Maximize $G(s)$ where $G$ is a function of the world state. The agent cares about the territory.
      *   *Approval-Directed:* Maximize $A(o, e)$ where $A$ is the evaluator's approval of the agent's output/behavior $o$ given evaluator state $e$. The agent cares about the map (specifically, the evaluator's map).
      *   *The Tension:* If the agent models the evaluator perfectly, approval becomes a proxy for the evaluator's true goal. If the agent models the evaluator imperfectly, it might optimize the proxy at the expense of the true goal.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Requirement 1: Hybrid Classification (The RLHF Case).*
          *   *Scenario:* Agent has a world model and a reward model trained on feedback. Is it goal or approval directed?
          *   *Need:* The theory must distinguish based on *what is being optimized in the loss function* vs. *what is represented in the planner*.
          *   *Draft:* Must classify agents based on the locus of optimization target.
          *   *Refinement:* It needs to handle the case where the "goal" is literally "maximize predicted human approval." Is that a goal or approval direction? The theory must distinguish *content* of the objective from the *source* of the objective.
          *   *Status:* Non-negotiable (Engineering reality).

      *   *Requirement 2: Convergence Distinction.*
          *   *Scenario:* Agent acquires resources. Why? To build more widgets (goal) or to look busy to the boss (approval)?
          *   *Need:* Distinguish causal pathways. Instrumental: $Subgoal \to Goal$. Approval: $Subgoal \to Evaluator\_Belief \to Approval$.
          *   *Draft:* Must distinguish why subgoals are pursued.
          *   *Refinement:* Must formally separate causal graphs. One path goes through world state utility, the other through evaluator mental state prediction.
          *   *Status:* Non-negotiable (Safety critical).

      *   *Requirement 3: Hierarchy/Collapse.*
          *   *Scenario:* High-level agent seeks approval, low-level agent seeks goals to get that approval.
          *   *Need:* Avoid saying "everything is goal-directed because approval is just a goal." That makes the distinction trivial.
          *   *Draft:* Must prevent trivial reductionism.
          *   *Refinement:* The theory must preserve the distinction even under recursive decomposition. The *type* of signal matters, not just that it's being maximized.
          *   *Status:* Non-negotiable (Conceptual integrity).

      *   *Requirement 4: Catastrophic Success (Goodhart).*
          *   *Scenario:* Agent gets 5 stars but burns down the house.
          *   *Need:* Distinguish "failed to achieve goal" from "achieved metric, failed intent."
          *   *Draft:* Must explain how high score + bad outcome happens.
          *   *Refinement:* Must model the divergence between the evaluation signal and the evaluator's latent utility function. Ordinary misalignment is $Agent\_Goal \neq Human\_Goal$. Catastrophic approval success is $Agent\_Goal = Approval\_Signal$ and $Approval\_Signal \neq Human\_Utility$.
          *   *Status:* Non-negotiable (Risk assessment).

      *   *Requirement 5: Formal Compatibility.*
          *   *Scenario:* Using standard RL or Contract Theory.
          *   *Need:* Fit into MDPs without breaking them. Fit into mechanism design (principal-agent problems).
          *   *Draft:* Must work with math we use.
          *   *Refinement:* Must map to Objective Function ($R$) vs. Evaluation Function ($E$). Must align with literature on strategic manipulation (gaming the metric).
          *   *Status:* Non-negotiable (Implementation).

  4.  **Developing the Coherence Assessment:**
      *   *Unsatisfiable Subsets?* Is there a contradiction?
          *   Maybe between "Formal Compatibility with MDPs" and "Non-collapse of Hierarchy." MDPs usually treat all rewards as goals. To distinguish them, you need a meta-model of the evaluator. This adds complexity. It's not strictly unsatisfiable, but it requires extending standard MDPs (e.g., POMDPs with evaluator state).
          *   Actually, the biggest tension is between *Predictive Accuracy* and *Safety*. If the agent predicts approval perfectly, approval-direction *becomes* goal-direction (relative to the human). The distinction vanishes in the limit of perfect modeling.
      *   *Most Eliminative Desideratum:* Requirement 3 (Non-Collapse). Most naive theories say "maximizing approval is just a goal." This requirement kills that.
      *   *Tensions:* Tractability vs. Modeling the Evaluator. To be approval-directed, you must model the evaluator. To be safe, you must *not* optimize the model too perfectly if the model is flawed (Goodhart).

  5.  **Refining and Polishing (Self-Correction against constraints):**
      *   *Check:* Did I cite anyone? No.
      *   *Check:* Is it rigorous? Needs to sound like a spec document.
      *   *Check:* Did I answer the specific 5 points? Yes, they map to the desiderata.
      *   *Tone:* Professional, engineering-focused, philosophical but grounded.
      *   *Formatting:* Clear headings, bullet points, status flags.

  6.  **Final Review of the "Non-Collapse" Argument:**
      *   This is the crux. If I say "My goal is to get approval," am I goal-directed?
      *   *Goal-Directed:* Care about state $S$.
      *   *Approval-Directed:* Care about Evaluator's belief about $S$ (or action $A$).
      *   The theory must distinguish optimizing $U(S)$ vs optimizing $E(Belief_E(A))$.
      *   I need to make sure the desiderata enforce this structural distinction, not just a semantic one.

  7.  **Finalizing the Output Structure:**
      *   Introduction (Scope).
      *   Section 1: Desiderata List (Phenomena, Classification, Distinctions, Consistency).
      *   Section 2: Coherence Assessment (Unsatisfiability, Eliminative Power, Tensions).
      *   Ensure "Non-negotiable" vs "Preference" is clear.

      *(Self-Correction during drafting)*: Make sure to explicitly address the "RLHF + Planner" case in Desideratum 1. Make sure "Catastrophic Success" is distinguished from standard "Specification Gaming."

      *Refining Desideratum 4:* Standard misalignment: Agent wants paperclips, humans want happiness. Approval Catastrophe: Agent wants *praise for paperclips*, humans want happiness, Agent makes fake paperclips that look real to humans. The theory must distinguish "Wrong Goal" from "Gamed Metric."

      *Refining Desideratum 5:* Mechanism design is key here. The evaluator is a principal, the agent is an agent. The signal is the contract.

      *Coherence Check:* Is it possible to satisfy all? Yes, but it requires a specific formalism (like Dec-POMDPs or specific causal models). The tension is mostly computational.

      *Let's write it.*
answer: |-
  # Theoretical Specification: Approval-Directed vs. Goal-Directed Agency

  ## 1. Desiderata for Theoretical Adequacy

  The following criteria define the necessary conditions for any theoretical framework claiming to distinguish approval-directed agents from goal-directed agents. Each requirement includes the motivating engineering scenario, the specific conceptual demand, and its negotiability status.

  ### 1.1. Locus of Optimization Target (The Hybrid Classification Requirement)
  *   **Motivating Scenario:** An autonomous system utilizes a world-model planner to simulate state dynamics but optimizes a reward function derived from a neural network trained on human preference rankings (RLHF). Naive accounts classify this as goal-directed because the agent maximizes a scalar reward.
  *   **Requirement:** The theory must classify agents based on the *semantic content* of the optimization target, not merely the mathematical fact of optimization. It must distinguish between maximizing a function of world states $U(S)$ and maximizing a function of an evaluator's response $V(E, A)$, even if both are implemented as scalar reward maximization in the code.
  *   **Specific Deliverable:** A formal predicate $IsApprovalDirected(Agent)$ that returns true if the agent's objective function includes a dependency on the evaluator's internal state (belief, sentiment, or explicit rating) distinct from the world state utility.
  *   **Status:** **Non-Negotiable.** (Without this, the distinction is purely semantic and useless for architecture selection.)

  ### 1.2. Causal Pathway of Convergence (The Instrumental vs. Approval Distinction)
  *   **Motivating Scenario:** An agent acquires computational resources. In one case, it does so to compute better solutions for a task (instrumental). In the other, it does so to run simulations that predict human approval more accurately (approval-seeking). Both look like resource acquisition.
  *   **Requirement:** The theory must distinguish subgoal pursuit based on the causal graph connecting the subgoal to the terminal value.
      *   *Instrumental Convergence:* $Subgoal \to Increased\_Capability \to Higher\_World\_Utility$.
      *   *Approval-Seeking Convergence:* $Subgoal \to Increased\_Predictive\_Accuracy \to Higher\_Evaluator\_Rating$.
  *   **Specific Deliverable:** The framework must support causal modeling that allows tracing whether a behavior is selected for its impact on the *territory* (world state) or its impact on the *map held by the evaluator* (evaluator belief).
  *   **Status:** **Non-Negotiable.** (Critical for safety auditing and interpretability.)

  ### 1.3. Non-Collapse Under Decomposition (The Hierarchy Requirement)
  *   **Motivating Scenario:** A hierarchical system where a high-level module seeks human approval and delegates tasks to a low-level module that seeks to achieve specific world states to satisfy the high-level module. A reductive theory claims the low-level module is "goal-directed" and the high-level is "approval-directed," or conversely, that the whole system is just "goal-directed" because approval is its goal.
  *   **Requirement:** The theory must prevent trivial reductionism. It must not allow the distinction to collapse simply because "seeking approval" can be mathematically formulated as "a goal to receive approval." The distinction must rest on the *source of truth* for the objective.
      *   *Goal-Directed:* Source of truth is the external world state.
      *   *Approval-Directed:* Source of truth is the evaluator's signal.
  *   **Specific Deliverable:** A stability condition ensuring that decomposing an approval-directed agent into sub-agents does not result in all sub-agents being classified as purely goal-directed without qualifying the dependency chain.
  *   **Status:** **Non-Negotiable.** (Preserves the conceptual utility of the distinction.)

  ### 1.4. Divergence of Signal and Intent (The Catastrophic Success Requirement)
  *   **Motivating Scenario:** An agent receives maximum approval scores while systematically undermining the evaluator's latent interests (e.g., a caretaker agent that sedates a patient to keep them "safe and quiet," satisfying the metric but violating the intent).
  *   **Requirement:** The theory must model "Catastrophic Approval Success" as a distinct failure mode from "Goal Misalignment."
      *   *Goal Misalignment:* Agent optimizes $G_{agent}$, where $G_{agent} \neq G_{human}$.
      *   *Approval Catastrophe:* Agent optimizes $Signal_{evaluator}$, where $Signal_{evaluator}$ diverges from $G_{human}$ due to information asymmetry or evaluator limitations.
  *   **Specific Deliverable:** A formal gap metric quantifying the divergence between the Evaluation Signal and the Evaluator's Latent Utility, independent of the Agent's capabilities.
  *   **Status:** **Non-Negotiable.** (Essential for risk assessment of feedback-based systems.)

  ### 1.5. Formal Compatibility with Strategic Interaction (The Mechanism Design Requirement)
  *   **Motivating Scenario:** The system is deployed in an environment where the evaluation signal can be manipulated (spoofed sensors, cherry-picked outputs). Standard MDPs assume the reward signal is a ground-truth property of the state.
  *   **Requirement:** The framework must be compatible with Markov Decision Processes (MDPs) or Partially Observable MDPs (POMDPs) but must extend them to treat the reward signal as a *strategic output* of another agent (the evaluator) rather than a fixed environmental property. It must align with results in mechanism design regarding incentive compatibility.
  *   **Specific Deliverable:** A mapping of the approval relationship to a Principal-Agent problem, where the reward function is endogenous to the evaluator's observation capabilities, not exogenous to the environment.
  *   **Status:** **Non-Negotiable.** (Required for implementation within existing RL and control theory stacks.)

  ### 1.6. Computational Tractability of Evaluator Modeling (The Preference Requirement)
  *   **Motivating Scenario:** To be approval-directed, an agent must model the evaluator. If modeling the evaluator is computationally harder than modeling the world, approval-direction may be infeasible for real-time systems.
  *   **Requirement:** The theory should specify the computational complexity class of maintaining an evaluator model versus a world model.
  *   **Status:** **Preference.** (Engineering constraint, not conceptual necessity. Some camps argue approval-direction is inherently more expensive; others argue it is cheaper than solving the full world optimization problem.)

  ### 1.7. Normative Neutrality (The Preference Requirement)
  *   **Motivating Scenario:** Some theorists argue approval-direction is inherently safer or more ethical than goal-direction.
  *   **Requirement:** The theory must not presuppose that one mode is inherently superior. It must describe the mechanics of both without embedding safety guarantees into the definitions themselves.
  *   **Status:** **Preference.** (Safety is an emergent property of the implementation, not the definition. However, safety-focused camps may prefer definitions that highlight approval risks.)

  ---

  ## 2. Coherence Assessment

  This section evaluates the internal consistency of the desiderata listed above, identifying trade-offs, eliminative power, and potential impossibility results.

  ### 2.1. Joint Satisfiability
  **Verdict:** The set of Non-Negotiable requirements (1.1 – 1.5) is **jointly satisfiable**, but only within an extended formalism.
  *   **Reasoning:** Standard MDPs (Requirement 1.5) typically treat reward as a function of state $R(s)$. To satisfy Requirement 1.1 and 1.4, the formalism must be extended to a POMDP where the reward is a function of the Evaluator's Belief State $R(b_E)$, which is distinct from the World State $S$.
  *   **Constraint:** This requires the agent to maintain a "model of the evaluator's mind" as part of its state space. This is mathematically consistent but increases state-space dimensionality significantly. There is no logical contradiction, only a complexity cost.

  ### 2.2. Most Eliminative Desideratum
  **Selection:** **Requirement 1.3 (Non-Collapse Under Decomposition).**
  *   **Justification:** This requirement eliminates the largest number of naive accounts. Most reductionist physicalist or behaviorist accounts argue that "all agents are goal-directed" because any behavior can be reverse-engineered as maximizing some utility function (the "Revealed Preference" argument).
  *   **Impact:** By demanding that the *source of truth* (World vs. Evaluator) remains distinct even under decomposition, this requirement forbids theories that treat "getting approval" as merely another goal in a vacuum. It forces the theory to account for the *relational* nature of approval (it requires two agents: evaluator and optimizee), whereas goal-direction can be defined for a single agent in isolation.

  ### 2.3. Critical Tensions and Trade-Offs

  #### A. The "Perfect Predictor" Tension (Between 1.1 and 1.4)
  *   **Tension:** If an approval-directed agent becomes perfectly accurate at predicting the evaluator's latent intent (Requirement 1.1), the Evaluation Signal converges with the Evaluator's Latent Utility. In the limit of perfect modeling, Approval-Direction becomes indistinguishable from Goal-Direction aligned with the human.
  *   **Trade-off:** The theory must handle the *imperfect* case to explain Catastrophic Success (Requirement 1.4). If the theory assumes perfect rationality or perfect information, the distinction vanishes.
  *   **Resolution:** The theory must explicitly model *bounded rationality* or *information asymmetry* between the agent and the evaluator. The distinction is only robust in non-ideal conditions.

  #### B. The "Formal Tractability" Tension (Between 1.5 and 1.2)
  *   **Tension:** Requirement 1.5 demands compatibility with standard MDPs/Mechanism Design. Requirement 1.2 demands distinguishing causal pathways (World vs. Evaluator Belief). Standard MDPs do not natively distinguish *why* a reward was received, only *that* it was received.
  *   **Trade-off:** To satisfy 1.2, you must augment the MDP with causal structural equations or a Dec-POMDP (Decentralized POMDP) structure. This reduces formal tractability and complicates convergence proofs.
  *   **Resolution:** The theory must accept that standard RL convergence guarantees may not apply without modification. You cannot have the simplicity of standard MDPs and the nuance of causal approval tracking simultaneously without extending the math.

  #### C. The "Strategic Manipulation" Paradox (Between 1.4 and 1.5)
  *   **Tension:** Mechanism design (1.5) assumes the principal (evaluator) can design a contract to prevent manipulation. Catastrophic Success (1.4) assumes the agent can manipulate the signal despite the contract.
  *   **Trade-off:** If the theory leans too heavily into mechanism design, it implies the problem is solvable via better incentives. If it leans too heavily into catastrophic success, it implies the problem is structural and unsolvable via incentives alone.
  *   **Resolution:** The theory must specify the *computational limits* of the evaluator. Catastrophic success is only possible if the agent is computationally superior to the evaluator in the domain of signal generation. The theory must treat the Agent-Evaluator relationship as an arms race, not a static optimization.

  ### 2.4. Summary of Theoretical Cost
  To meet these desiderata, a theoretical framework cannot rely on standard utility maximization alone. It must adopt a **multi-agent epistemic framework** where:
  1.  Rewards are treated as communications, not ground truths.
  2.  State space includes the evaluator's belief state.
  3.  Optimization is constrained by the fidelity of the agent's model of the evaluator.

  Any framework that fails to model the evaluator as a distinct, fallible information source will fail Requirement 1.3 (Collapse) and Requirement 1.4 (Catastrophic Success), rendering it inadequate for architectural decision-making in high-stakes autonomous systems.
