      *   **Key Mechanic:** "Escalation Tokens." Unaffiliated observers can buy these to extend bidding rounds without altering liability. Funds the judiciary.
      *   **Theme/Internal Conflict:** Sunk-cost fallacy vs. Engineered feature vs. Structural coupling.
      *   **Ending:** No neat resolution. Focus on the mediator's choice (advise capitulation, reveal distortion, remain silent).
      *   **Tone:** Concrete setting, conceptual tension.

  2.  **Deconstruct the Mechanics for the Narrative:**
      *   *The Trap:* The "Loser Penalty" is the killer. If I bid $1M and lose, I pay $1M to the winner and $1M to the state. If I bid $1.1M and win, I pay $1.1M but get the water.
      *   *The Tokens:* Third parties can bet on the conflict lasting longer. This creates a market for suffering.
      *   *The Mediator's Role:* She sees the math. She knows the psychology. She has agency, but limited power.

  3.  **Character Conception:**
      *   **Name:** Elara.
      *   **Role:** Arbitration Conciliator (Mediator).
      *   **Motivation:** Guilt from the sibling case. Desire to prevent total ruin, but bound by the system.
      *   **Opponents:**
          *   *Refugees:* Represented by a weary elder (Kael). Desperate, moral high ground, but financially outgunned.
          *   *Corp:* Veridux Industries. Represented by a cool algorithm/agent (or a slick lawyer). Let's go with a human agent who treats it like a spreadsheet.

  4.  **Drafting - Scene by Scene:**

      *   **Scene 1: The Chamber.** Establish the atmosphere. Cold, sterile, digital displays showing the "Pot" and the "Penalty." Elara's memory of the sibling case (the "Vane" dispute).
      *   **Scene 2: The Current Bidding.** The refugees are already in deep. The Corp is matching. The Token Ticker is visible—outsiders betting on more rounds.
      *   **Scene 3: The Recess/Consultation.** Elara meets with the Refugees. This is the crux. She has to decide what to tell them.
      *   **Scene 4: The Realization.** She looks at the Token market. It's not just psychology; the system *needs* them to lose.
      *   **Scene 5: The Return.** She goes back in. What does she do?

  5.  **Refining the "Dollar Auction" Logic for the Story:**
      *   To make it clear: If you drop out, you are the "Loser." You pay your current bid to the winner + same amount to state.
      *   If you stay in, you risk higher bids.
      *   The Tokens allow the auction to continue even if one party hesitates? No, "extend the bidding round without altering either party's liability." This means it forces more time/pressure, keeping the pot hot, funding the court. It gamifies the delay.

  6.  **Developing the Internal Conflict:**
      *   *Psychological:* The refugees feel they *must* win because they've already sacrificed so much (sunk cost).
      *   *Institutional:* The court makes money on the penalties and the tokens. They want escalation.
      *   *Structural:* The refugees *cannot* afford to lose (death/drought), and the Corp *cannot* afford to look weak (shareholder value). The system couples these needs into a meat grinder.

  7.  **Writing - Focus on Sensory Details:**
