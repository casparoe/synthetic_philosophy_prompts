answer: |-
  The air in Chamber 4 tasted of ozone and recycled anxiety. Elara sat behind the mediator's lectern, her fingers tracing the haptic interface where the bid ledger glowed in angry red numerals.

  On her left sat the Arid Zone Coalition, twelve climate refugees representing three thousand displaced souls. Their clothes were worn, their faces etched with the dust of a dying basin. On her right sat the representative for Aethelgard Hydro, a man in a suit so dark it seemed to absorb the room's light. He didn't blink often enough.

  Between them, the holographic display hovered: *Current Stake: 4.2 Million Credits.*

  Elara remembered the Vane case. Two brothers, a vineyard, and a boundary line. They had entered the arbitration chamber with a dispute worth fifty thousand. They had exited three weeks later, bankrupt, imprisoned for contempt, and speaking to no one. The Dollar Auction protocol was designed to force settlement through the terror of loss. Instead, it fed on the irrationality of pride. In the Vane case, the tipping point came when the bid exceeded the value of the vineyard. Logic dictated withdrawal. But the rules dictated that the loser pays their accumulated bid to the winner *plus* an equal penalty to the state. To quit at 200k meant paying 400k. To bid 201k meant risking only the marginal difference.

  It was a trap where the only rational move was to destroy yourself slightly slower than your opponent.

  "Round Forty-Two," the chamber AI intoned. "Aethelgard Hydro holds the high bid. Coalition, your move. Match or withdraw."

  The elder of the Coalition, a woman named Kael with eyes like cracked flint, looked at Elara. They were in recess, technically, but the clock was ticking. The bond they had posted was already gone, sunk into the pot. If they withdrew now, they owed Aethelgard their current stake (4.2M) and the State another 4.2M. They didn't have that. They would be indentured.

  Elara stood and walked to the observation gallery glass. Below, in the public tier, the traders sat. This was the new variable: Escalation Tokens.

  Unaffiliated observers could purchase tokens that extended the bidding timer by ten minutes. It didn't change the liability, but it kept the auction open. It allowed the market to bet on the duration of the conflict. The judiciary took a cut of every token sold. The system was no longer just resolving disputes; it was monetizing the deadlock.

  Elara watched the Token Ticker. It was climbing faster than the credit bid. Speculators were betting on a long war. They wanted the Coalition to feel the pressure. They wanted Aethelgard to feel the sting.

  She turned back to Kael. "You cannot win this on credit," Elara said quietly. "Aethelgard has liquidity. You have desperation."

  "If we lose the water, we die," Kael said. Her voice was raspy. "If we lose the bid, we are slaves. There is no difference."

  "There is a difference," Elara said. "One is physical. The other is legal. But the mechanism treats them as identical."

  Elara looked at the data stream. She saw the structural coupling clearly now. It wasn't just that the bidders were psychologically trapped by sunk costs. It was that the institution had been engineered to capitalize on that trap. The Token market rewarded prolongation. The State rewarded the penalty. The only thing not rewarded was justice.

  If she advised them to capitulate, she was signing their death warrant, financially and perhaps physically. If she advised them to bid, she was feeding them into a grinder that would eventually crush them when their credit ran out.

  But there was a third option. The rules of mediation allowed for the disclosure of "procedural anomalies" that might affect the fairness of the bond.

  Elara looked at the Aethelgard representative. He was checking his watch, bored. He knew the math. He knew the Coalition would break. He was waiting for the Token buyers to run out of interest, or for the Coalition to run out of heart.

  Elara walked back to the center of the room. She activated the main display, overriding the bid ledger. She pulled up the Token Ticker, expanding it until it dominated the wall. The numbers scrolled rapidly—green arrows indicating buy orders on *Duration*.

  "Do you see this?" Elara asked. Her voice echoed in the sterile silence.

  Kael squinted. "What is it?"

  "It is the market value of your suffering," Elara said. "Every minute you stay in this auction, people outside this room make money. They are not betting on who wins. They are betting on how long you bleed."

  The Aethelgard rep shifted. "Counselor, that data is irrelevant to the liability structure."

  "It is relevant to the *incentive structure*," Elara snapped. She turned to the Coalition. "The rules say you must weigh the cost of withdrawal against the cost of bidding. But the rules do not account for the fact that the House profits if you ignore both."

  She paused. This was the precipice. If she pushed too hard, the Court would invalidate the session. If she said nothing, the auction would resume, and the sunk-cost fallacy would do the rest. The psychology of the bidders was the fuel, but the Token market was the oxygen.

  "The sunk cost is a trap," Elara said, addressing both parties. "You feel you must continue because you have already paid. But look at who is paying you to continue." She pointed to the scrolling green numbers. "The market is subsidizing your commitment. It is paying the Court to keep you in the chair."

  Kael looked at the numbers, then at her hands, calloused and empty. "So if we stop... the market loses?"

  "The market loses a yield," Elara corrected. "You lose your freedom. They lose a percentage."

  "And if we continue?"

  "Then you become a utility," Elara said. "A resource extracted for the judiciary's operational budget."

  The AI chimed. *Recess concluded. Round Forty-Two resuming. Coalition, match or withdraw.*

  The room held its breath. The Aethelgard rep leaned forward, ready to close the kill. The Token Ticker spiked—a large buy order just came in. Someone wanted another ten minutes of this.

  Elara stepped back from the lectern. She had revealed the distortion. She had shown them that their rage was being traded like futures. But she had not fixed the math. The penalty for withdrawal still stood. The State still demanded its pound of flesh.

  She realized then that escalation was not a failure of the bidders. It was not merely a feature of the institution. It was the coupling of the two. The human inability to accept loss met the institutional need to monetize time. She was not a mediator; she was the lubricant.

  "Coalition," Elara said, her voice flat, stripping away the comfort of her office. "The floor is yours."

  Kael stood up. She looked at the Token Ticker, then at the Aethelgard rep. She didn't look at Elara.

  "We match," Kael said.

  The ledger ticked up. *4.3 Million.*

  A cheer went up from the observation gallery. The Token Ticker surged.

  Elara sat down. She opened her log and began to type the minutes. She did not record the look in Kael's eyes. She did not record the spike in the token market. She recorded only the bid.

  To do otherwise would be to admit that the chamber was not a place of justice, but a machine designed to turn conflict into revenue until there was nothing left to burn. And if she admitted that, she would have to stand up and walk out.

  And she could not afford to lose her bond.
