answer: |-
  ### Audit of Analogies

  #### 1. Analogy I: "Spilt Milk / Good Money After Bad"
  **Source Domain:** Household accident / Gambling loss.
  **Target Domain:** University Capital Project.

  | Source Domain | Target Domain |
  | :--- | :--- |
  | **Milk / Wagered Cash** | **Budget Expenditure** |
  | **Spilling / Losing Bet** | **Overspend / Schedule Slip** |
  | **Crying / Chasing Loss** | **Reluctance to Cancel** |
  | **Clean Floor / Walk Away** | **Abandon Project** |
  | **Future Meal / New Bet** | **Future Investment** |

  **Imported Features & Breaks:**
  *   **Imported:** The source assumes the asset is *consumable* and *fully destroyed* upon the accident. Milk cannot be un-spilt; a lost bet yields no asset.
  *   **Break:** Capital projects are not consumables; they are *capital stock*. A half-built library is not "spilt money"; it is a partially completed asset.
  *   **Matter vs. Decorative:** The assumption of **zero residual value** matters critically. If the project leaves a usable structure, data, or team (residue), the "milk" analogy falsely categorizes forward-looking assets as backward-looking losses. The emotional coloring ("crying") is decorative; the ontological status of the loss (total vs. partial) is material.

  #### 2. Analogy II: "Burning Boats"
  **Source Domain:** Military Strategy (e.g., Cortés).
  **Target Domain:** Administrative Continuation.

  | Source Domain | Target Domain |
  | :--- | :--- |
  | **Commander** | **Provost / Committee** |
  | **Boats** | **Option to Abandon** |
  | **Burning** | **Sunk Expenditure / Public Commitment** |
  | **Adversaries** | **Budget Critics / Competitors** |
  | **Victory** | **Project Completion** |

  **Imported Features & Breaks:**
  *   **Imported:** The source assumes the constraint is *intentional* and *strategic*. The commander burns boats *to* force effort. It assumes a zero-sum conflict against an external adversary.
  *   **Break:** In the university case, the "burning" is often accidental (cost overruns) rather than strategic. The "adversary" is often internal reality (budget limits), not an enemy to be defeated by stamina alone.
  *   **Matter vs. Decorative:** The **intentionality** of the constraint matters. Rational commitment devices are chosen *ex ante*; sunk costs are incurred *ex post*. Relying on accidental constraints as if they were strategic commitments is a category error. However, the **credibility effect** (others rely on your staying) is material and transfers well.

  ---

  ### Addressing the Constraints

  **(i) Ledger-sunk versus residue-bearing outlay**
  The "Milk" analogy fails because it conflates the *expenditure* (which is sunk) with the *project state* (which is not). A formulation of the bygones principle that survives must distinguish between the **flow** (money spent, which is gone) and the **stock** (half-built wing, which remains).
  *   *Verdict:* The principle holds for the flow, fails for the stock. The colleague's memo treats the project as a flow loss. Your counter-argument correctly identifies the stock. The distinction is not concealed by the principle, but by the colleague's application of it.

  **(ii) Outlay as evidence rather than as cause**
  The "Milk" analogy assumes the spill is random noise. Investment is a **signal**. If a committee previously screened the project, their expenditure signals private information about its viability. Continuing may be rational Bayesian updating on that signal, not sensitivity to the cost itself.
  *   *Verdict:* The "Concorde Fallacy" label often begs the question by assuming the only reason for continuation is the cost. If continuation is driven by the *information* revealed by the cost (e.g., "we learned how to build this"), it is rational. The analogy breaks where the outlay is informative rather than purely consumptive.

  **(iii) The strategic and diachronic cases**
  Here the "Burning Boats" analogy gains traction but requires refinement. Quitting is not free; it incurs **reputational costs** and **termination fees**. These are *future* costs, not past ones. A policy of "never abandon" can be rational for an agent with time-inconsistency problems (present bias), acting as a pre-commitment device.
  *   *Verdict:* Sensitivity to past investment is often a proxy for sensitivity to the *future cost of quitting* (reputation loss). The colleague's memo classifies reputation as a "bygone." It is not; it is a forward-looking liability triggered by abandonment. The escalation when the decision was "thrust upon us" vs. "made by us" tracks with **agency and ownership**, which affects the reputational cost of quitting.

  ---

  ### A Better Analogy: Laying Railway Track

  **The Picture:** A company spends millions laying track across a desert. The money is gone (sunk).
  **Why it works:**
  1.  **Residue:** The track remains (unlike milk). It has value for future trains (forward-looking benefit).
  2.  **Commitment:** Laying track commits the route. Turning back is harder than going forward (strategic constraint).
  3.  **Signal:** Investors see the track and infer confidence (evidence).
  4.  **Distinction:** A rational agent ignores the *price of the steel* (sunk) but counts the *utility of the track* (residue) and the *cost of ripping it up* (future cost of quitting).

  This analogy permits the colleague's logic (ignore the price of the steel) while validating your logic (count the utility of the track and the cost of abandonment).

  ### Verdict

  The colleague's unqualified conclusion does not survive contact with the complexity of capital projects. It treats all past outlays as consumptive losses (Milk) rather than potential capital stock or signals (Track). However, the core logical principle—that *pure* sunk costs should not drive decisions—remains valid if strictly defined. It fails only because the memo misclassifies residues, signals, and reputation costs as "bygones."

  \answer{survives-in-restricted-form: ignore past costs; count future assets, signals, and reputational effects}
