prompt: |-
  I'm a third-year maths-and-philosophy student, and on Thursday I'm taking one of the problem sessions for a first-year course called Chance, Symmetry and Evidence. The students can integrate a density and have met the uniform distribution on an interval, but they have no measure theory, no group theory, and no formal epistemology, and I have twenty-five minutes to use the paradox that goes back to Bertrand — the probability that a random chord of a circle is longer than the side of the inscribed equilateral triangle, with the three familiar answers 1/3, 1/2 and 1/4 each falling out of a parameterization that sounds equally random — to get them to see what goes wrong with the principle of indifference, or principle of insufficient reason, when it is applied to a continuous quantity. I don't need the paradox explained to me: I need a plan for explaining it, and the part I keep getting wrong is the sequencing.

  Three things in particular. First, the order and the dependencies: which idea has to be in place before the paradox can even look like a problem rather than a trick — my instinct is that the three chord answers cannot come first, because students who see 1/3, 1/2 and 1/4 before they have felt the pull of the original question just conclude that the question was vague and move on, and that instead something has to be built first about what an indifference argument is supposed to be doing when it distributes credence over a continuum — but I'm not confident about what that something is, or about whether the distinction between the parameterization doing the work (pick the midpoint, pick the radius, pick the endpoint) and the measure that results should be made explicit before or after. Second, the carrying example, and whether the one I've been toying with actually carries: a point chosen at random in a circular dartboard of radius one, and the probability that it lands in the concentric circle of radius one half, which is 1/2 if you choose a radius uniformly and then an angle uniformly, and 1/4 if you choose uniformly by area, and which I like because the two procedures can be drawn on the board as pictures of each other and because the difference in the densities is visible rather than merely algebraic. My supervisor says my dartboard is a cheat: here there is a privileged answer, since the area-uniform distribution is the one that is invariant under the Euclidean motions that preserve the board and the uniform-radius distribution is not, so the case can only show that students picked a silly parameterization, not that a well-meant indifference argument can fail in a way nobody can repair. Is she right, and if she is, what does a carrying example have to contain that mine lacks — must it have no privileged measure at all, or must it merely have one that is not obvious to a first-year — and is the dartboard worth keeping as a five-minute warm-up before the chord anyway, or will it install the wrong moral? Relatedly, I've been dividing the failures into two kinds for my own notes: cases like mine where the rival parameterizations disagree because one of them quietly introduces a length scale or a preferred region that the setup does not contain, and cases like the chord where the rivals disagree even though each respects every symmetry the setup obviously has. Is that distinction load-bearing or cosmetic, and if it is load-bearing, where in the sequence does it belong?

  Third, the misconceptions, in the order they will actually arrive and the point at which each should be defused rather than merely corrected at the end. The ones I expect are: that uniform just means every outcome equally likely, so the paradox is only about infinity; that there must be a true answer among the three and we simply don't know which; that the moral is that probability is subjective, or that the setup was under-described and any answer is therefore as good as another; that one can average the three answers and split the difference; and, from the sharper students, that maximum entropy repairs indifference, or that the whole difficulty is that a uniform distribution on a length is not a uniform distribution on the area or on the ratio, which is true and yet somehow not the end of the matter. For each I'd like to know whether it should be headed off preemptively in the setup, absorbed when it surfaces, or deliberately left standing until the last two minutes, and what I should say in one sentence if it surfaces early and I don't want to derail the arc. Finally, I want a check that discriminates: a question I can put to them cold at the end, ideally set in a new case rather than a circle, that a student who has only memorized the phrase it depends on how you choose at random cannot answer, plus your view on what I should openly refuse to explain at this level and say out loud that I'm refusing — I'm thinking anything involving the uniqueness of invariant measures on a group, any derivation of a maximum-entropy distribution in the continuous case, and the historical question of what Bertrand himself took himself to be doing, but tell me if I'm being too cautious or not cautious enough. For what it's worth, I got into an argument in the maths society afterwards in which one friend insisted that the chord question has a correct empirical answer because you could always go and throw straws at a circle drawn on the floor, and another insisted that this just relocates the choice into the throwing; if either of them is pointing at something my session should make room for, I'd rather find out now than on Thursday.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the User and Context:**
      *   **User:** Third-year Maths & Philosophy student.
      *   **Task:** Leading a 25-minute problem session for first-year students.
      *   **Course:** "Chance, Symmetry and Evidence" (sounds like an introductory probability/epistemology mix).
      *   **Student Background:** Can integrate densities, know uniform distribution on an interval. *No* measure theory, *no* group theory, *no* formal epistemology.
      *   **Topic:** Bertrand's Paradox (Probability a random chord > side of inscribed equilateral triangle).
      *   **Goal:** Use the paradox to show what goes wrong with the Principle of Indifference (PoI) on continuous quantities.
      *   **Constraints:** 25 minutes is *very* tight. Needs a specific sequence/plan.
      *   **Specific Concerns:**
          1.  Sequencing/Dependencies (When to introduce PoI vs. the answers).
          2.  The "Dartboard" Example (Is it a cheat? Should it be kept?).
          3.  Misconceptions (How to handle specific student objections).
          4.  Assessment/Closing (A discriminating question, what to refuse to explain).
          5.  Empirical Objection (The "throw straws" argument).

  2.  **Deconstruct the Three Specific Concerns:**

      *   **Concern 1: Sequencing & Dependencies.**
          *   *User's Instinct:* Don't show the three answers (1/3, 1/2, 1/4) immediately. Build the "pull" of the question first.
          *   *Analysis:* Correct. If they see the answers first, they think "badly posed question." The goal is to make them feel the *necessity* of PoI, then show PoI breaking.
          *   *PoI Definition:* Needs to be intuitive. "If I have no reason to prefer X over Y, assign equal probability."
          *   *Continuum Issue:* PoI works okay for finite discrete cases (dice). On continua, "equal probability" needs a measure (length, area, angle, etc.).
          *   *Parameterization vs. Measure:* This is the crux. The distinction should emerge *from* the paradox, not be lectured before. Let them choose the parameter, derive the measure, see the conflict.

      *   **Concern 2: The Dartboard Example.**
          *   *User's Idea:* Point in circle radius 1. Prob(inside radius 1/2). Uniform radius -> 1/2. Uniform area -> 1/4.
          *   *Supervisor's Objection:* Area uniform is privileged by rotation/translation invariance (Euclidean motions). Radius uniform is "silly."
          *   *Analysis:* Supervisor is right *mathematically* (Jaynes' solution), but pedagogically, the dartboard is excellent for *visualizing* density differences. However, for Bertrand's Paradox specifically, the point is that *even with symmetries*, different symmetry assumptions yield different results.
          *   *Decision:* Keep the dartboard as a warm-up (5 mins) but frame it carefully. It illustrates *Jacobian/Change of Variables* intuitively without the jargon. It shows "Uniform $r$ $\neq$ Uniform Area." But acknowledge the supervisor's point: in the dartboard, physical intuition (throwing a dart) usually implies area. In Bertrand's chord, physical intuition is ambiguous.
          *   *Distinction (Load-bearing vs. Cosmetic):* The distinction between "silly parameterization" (dartboard radius) and "symmetry-respecting parameterizations" (Bertrand's chords) is crucial. It shows the problem isn't just "being careless," it's foundational. This belongs *after* the dartboard, as the transition to Bertrand.

      *   **Concern 3: Misconceptions.**
          *   *List:* "Uniform = equally likely" (discrete vs. continuous), "True answer exists," "Probability is subjective," "Average them," "MaxEnt fixes it," "It's just change of variables."
          *   *Strategy:* Don't debunk all. Focus on the core: "Random" is not a property of the object, but of the *selection process*.
          *   *Empirical Objection (Straws):* This is actually the *best* resolution physically (Jaynes' view). If you specify the physical mechanism, the probability is fixed. The paradox arises from *lack* of physical specification. This needs to be the punchline.

  3.  **Drafting the Plan (Iterative Process):**

      *   *Time Budget:* 25 mins is brutal.
          *   Intro/Dartboard: 5 mins.
          *   Bertrand Setup & PoI: 5 mins.
          *   The Three Methods (Derivations): 10 mins (needs to be fast).
          *   Discussion/Moral: 5 mins.
      *   *Refinement:* Derivations need to be pre-drawn or very quick. Focus on the *assumption* behind each.

      *   *Sequencing:*
          1.  **Hook:** The Dartboard. Show $P=1/2$ vs $P=1/4$. Ask: "Which is 'random'?" (Physical intuition says Area, but math allows both).
          2.  **Transition:** PoI says "be indifferent." But indifferent to *what*? ($r$ vs $r^2$).
          3.  **Bertrand:** Draw Circle + Triangle. Question: $P(\text{Chord} > \text{Side})$.
          4.  **Method 1 (Endpoints):** Fix one point, vary other. Uniform on circumference. (Result 1/3).
          5.  **Method 2 (Radius):** Chord $\perp$ Radius. Uniform on Radius. (Result 1/2).
          6.  **Method 3 (Midpoint):** Uniform on Interior Area. (Result 1/4).
          7.  **Conflict:** All used PoI. All seem symmetric. Results differ.
          8.  **Resolution:** "Random" implies a *process*. Without a process, the question is ill-posed. (Address the straw-throwing friend here).

      *   *Addressing the Supervisor's Point:* The dartboard *does* have a privileged measure (area) if we assume physical darts. Bertrand's chords *do not* have a privileged measure without specifying the throwing mechanism. This is the key difference. The dartboard warms up the math (densities); Bertrand breaks the epistemology.

      *   *Misconceptions:*
          *   "True answer": Defuse early. "Math doesn't know what you mean by 'random' yet."
          *   "Subjective": No, it's about model specification.
          *   "Average": No, that's a new model.
          *   "MaxEnt": Too advanced, wave away.
          *   "Straws": Validate this. This is the Jaynes solution.

      *   *Closing Question:* Needs to be new. Box paradox? Stick breaking? Let's go with Stick Breaking (it's isomorphic to some chord versions but looks different). Or simpler: "Pick a random number $x \in [0,1]$. What is $P(x < 0.5)$? Now pick $y = x^2$. What is $P(y < 0.25)$?" (Too algebraic).
      *   *Better Closing:* The "Cube Factory" (van Fraassen). A factory makes cubes with side length $L \in [0, 1]$. What is prob $L < 0.5$? (1/2). What is prob Face Area $< 0.25$? (If $L$ uniform, Area is not). What is prob Volume $< 0.125$?
      *   *Actually, for 1st years:* Keep it geometric. "Pick a random point in a sphere. Prob it's in the inner half-sphere (radius $R/2$)?" vs "Pick random radius, then point on radius."
      *   *Best Discriminating Question:* "I have a bag of coins. I pick one at random. It's biased, but I don't know how. What's the probability the bias $p$ is $> 0.5$?" (Invites PoI on $p$). "What's the probability the odds ratio $p/(1-p)$ is $> 1$?" (Shows parameterization dependence).
      *   *Wait, keep it simple:* "A bus arrives anytime between 12:00 and 12:30. You arrive at 12:15. What's the prob you missed it?" (Uniform time). "Now, suppose the bus arrival is determined by a mechanical timer that winds down... " (Too complex).
      *   *Let's stick to the Cube/Box paradox.* It's the standard follow-up to Bertrand. Side $s \sim U[0,1]$. $P(s < 1/2) = 1/2$. Area $A = s^2$. $P(A < 1/4) = P(s < 1/2) = 1/2$. Volume $V = s^3$. $P(V < 1/8) = 1/2$.
      *   *Wait, the paradox is:* If I say "Pick a cube at random from cubes with side up to 1," do I mean uniform side? Uniform area? Uniform volume?
      *   *Question:* "A factory makes cubes with side length between 1cm and 2cm. If you pick a cube 'at random', what is the probability its face area is less than 3 cm$^2$?" (Requires them to ask: "Random with respect to what measure?").

  4.  **Refining the "Straw" Argument:**
      *   Friend 1: "Throw straws, get empirical answer."
      *   Friend 2: "Throwing method matters."
      *   *Verdict:* Friend 2 is right, but Friend 1 identifies the *solution*. The probability is physical. If the problem doesn't specify the physics, it's not a math problem, it's a modeling problem. The session must validate Friend 2 while acknowledging Friend 1's intuition that real-world randomness exists.

  5.  **Finalizing the Plan Structure:**
      *   **0-5 mins:** Dartboard Warm-up. (Visualize density).
      *   **5-10 mins:** Bertrand Setup + PoI definition.
      *   **10-20 mins:** The Three Methods (Rapid fire, focus on the *choice* made).
      *   **20-25 mins:** The Moral + Closing Question + What we aren't doing.

  6.  **Addressing Specific User Questions:**
      *   *Sequencing:* PoI first, then conflict.
      *   *Dartboard:* Keep it, but flag the "privileged measure" issue as the *difference* between Dartboard and Chord.
      *   *Misconceptions:* Handle "True Answer" immediately. Handle "Subjective" at the end. Handle "Straws" as the resolution.
      *   *Refusals:* Measure theory, Group Theory, MaxEnt derivation.
      *   *Closing Question:* The Cube Factory.

  7.  **Review against Constraints:**
      *   25 minutes is extremely short. The derivations must be *very* streamlined. Maybe provide handouts or pre-draw the circles.
      *   First-years: Keep calculus minimal. Focus on ratios of lengths/areas.
      *   Tone: Philosophical but grounded in math.

  8.  **Self-Correction on Dartboard:**
      *   Supervisor says dartboard is a cheat because Area is privileged.
      *   *Counter:* That's exactly why it's a good warm-up. It shows *one* case where intuition agrees (Area), then Bertrand shows cases where intuition *splits*.
      *   *Modification:* Explicitly state: "In the dartboard, physics saves us. In Bertrand's chord, physics is silent."

  9.  **Drafting the Response:** (Mental Outline)
      *   Acknowledge the tightness of the timeline.
      *   **Section 1: Sequencing.** PoI -> Dartboard (Warm-up) -> Bertrand (The Crash).
      *   **Section 2: The Dartboard.** Keep it, but use it to distinguish "Mathematical Possibility" vs "Physical Privilege."
      *   **Section 3: Misconceptions.** Triage list. Which to kill, which to nurture.
      *   **Section 4: Closing.** The Cube Problem. What to refuse (Measure Theory).
      *   **Section 5: The Straw Argument.** Validate Friend 2, empower Friend 1's empirical instinct as the *way out*.

  10. **Final Polish:** Ensure the tone is appropriate for a peer (3rd year advising 3rd year on teaching 1st years). Be precise about the "Principle of Indifference" phrasing. Ensure the distinction between "parameterization" and "measure" is handled gently (don't use those words if they don't know them). Use "method of selection."

  *(Self-Correction during drafting)*: Wait, 25 minutes to do Dartboard *and* all three Bertrand derivations? That's impossible if they calculate. I must *show* the derivations or guide them very fast. I should advise the user to pre-draw the diagrams. The students should not be integrating live. They should be reasoning about ratios.
  *Correction:* The prompt says "The students can integrate a density." So they *can* do math. But 25 mins is still tight. I will advise to treat the derivations as "demonstrations" where students supply the key assumption, not the integration steps.

  *Refining the Closing Question:* The Cube Factory is good. "A machine produces cubes with side length $L \in [0,1]$. You pick one at random. What is $P(L < 1/2)$?" (1/2). "What is $P(\text{Area} < 1/4)$?" (If $L$ uniform, 1/2). "What if I told you the machine produces cubes with uniform *surface area*?" (Then $P(\text{Area} < 1/4) = 1/2$, but $P(L < 1/2) = 1/4$).
  *Better:* Just ask them to formulate the question that *would* have a unique answer. "How would you have to throw the straw to get 1/2?"

  *Let's stick to the Cube Factory for the written check.* It's the standard philosophical companion to Bertrand.

  *Final check on the "Straw" argument:* Friend 1 says "Go throw straws." Friend 2 says "That just moves the choice." The truth is: Throwing straws *defines* the measure. If you throw long straws from far away, you get one distribution. If you drop short straws from close up, you get another. Friend 2 is right that the *choice of throw* matters. Friend 1 is right that a *specific* throw yields a *specific* answer. The lesson is: You must specify the throw.

  Okay, ready to write.cltr
answer: |-
  This is a tight constraint (25 minutes is barely enough time to state the paradox, let alone resolve it), so your sequencing must be ruthless. Your instinct is correct: if you present the three answers first, students will dismiss the problem as linguistic vagueness ("Oh, 'random' wasn't defined") and disengage. You need them to feel the *force* of the Principle of Indifference (PoI) before you show it breaking.

  Here is a plan that addresses your three specific concerns, optimizes the timeline, and handles the misconceptions without derailing the session.

  ### 1. Sequencing and Dependencies (The Arc)

  **The Goal:** Move from "PoI seems obvious" $\to$ "PoI gives contradictions" $\to$ "The contradiction is in the model, not the math."

  **0:00–0:05: The Dartboard Warm-up (The "Carrying Example")**
  *   **Action:** Draw a circle (radius $R$) and a concentric inner circle (radius $R/2$).
  *   **Question:** "I throw a dart at the board. It hits somewhere. What is the probability it lands in the inner circle?"
  *   **Elicit:** Most will say $1/4$ (Area ratio).
  *   **Challenge:** "Suppose I generate the point by picking a random angle $\theta \in [0, 2\pi)$ and a random radius $r \in [0, R]$ uniformly. What is the probability now?"
  *   **Result:** They calculate $\frac{R/2}{R} = 1/2$.
  *   **The Point:** Do not resolve this yet. State: "In the dartboard, physics usually saves us (we assume uniform area). But mathematically, 'random point' is ambiguous. It depends on what we are indifferent *over*."
  *   **Why keep it?** Your supervisor is right that the dartboard has a privileged measure (Euclidean invariance), but that is exactly why it is a safe warm-up. It shows that *parameterization changes density* without triggering a philosophical crisis. It builds the technical muscle (Jacobian intuition) before the philosophical blow.

  **0:05–0:10: Bertrand's Setup & The Principle of Indifference**
  *   **Define PoI Simply:** "If we have no reason to prefer one outcome over another, we assign them equal probability."
  *   **The Setup:** Draw circle, inscribed equilateral triangle. Side length $s$.
  *   **The Question:** "Choose a chord *at random*. What is the probability its length $L > s$?"
  *   **Crucial Move:** Ask them: "What does 'at random' mean here?" They will struggle. Tell them: "Let's apply the Principle of Indifference. We have no reason to prefer any *position* or *orientation*. Let's see where that takes us."

  **0:10–0:20: The Three Methods (Rapid Fire)**
  *   *Do not make them integrate live.* Pre-draw the three diagrams. Ask them to identify the *variable* that is being treated as uniform.
  *   **Method 1 (Endpoints):** Fix one vertex of the chord on the circle. Vary the other endpoint uniformly along the circumference.
      *   *Logic:* The chord is longer than the side if the second point falls on the arc opposite the first vertex (1/3 of the circumference).
      *   *Result:* **1/3**.
  *   **Method 2 (Radius):** Consider chords perpendicular to a fixed radius. Vary the intersection point uniformly along the radius.
      *   *Logic:* The chord is longer if the intersection is closer to the center than the triangle's side (1/2 of the radius).
      *   *Result:* **1/2**.
  *   **Method 3 (Midpoint):** Identify each chord by its midpoint. The midpoint must lie inside the circle.
      *   *Logic:* The chord is longer if the midpoint lies inside the inscribed circle of the triangle (radius $R/2$). By area (like the dartboard), this is $1/4$.
      *   *Result:* **1/4**.
  *   **The Crash:** Write 1/3, 1/2, 1/4 on the board. "We applied the Principle of Indifference three times. We were indifferent to position in every case. The math is correct. The conclusions contradict."

  **0:20–0:25: The Moral & The Exit**
  *   **Resolution:** The problem is not the math; it is the phrase "choose at random." Probability is not a property of the chord; it is a property of the *selection process*.
  *   **The Straw Argument:** Address your maths society argument here (see below).
  *   **Closing Question:** (See Section 4).

  ---

  ### 2. The Dartboard: Cheat or Feature?

  **Is your supervisor right?**
  Yes, mathematically. The uniform area measure is the unique measure invariant under rotation and translation of the board. The uniform radius measure is not invariant under translation (if you move the origin, the distribution changes).

  **Should you keep it?**
  **Yes.** But you must frame it correctly.
  *   **The Distinction:** The distinction you noted (silly parameterization vs. symmetry-respecting rivals) is **load-bearing**.
  *   **How to teach it:** Use the dartboard to show that *parameterization matters*. Use Bertrand to show that *symmetry arguments alone are not enough*.
  *   **The Script:** "In the dartboard, we have a physical object that suggests a natural measure (area). In Bertrand's chord, we have a geometric abstraction. There is no 'board' to throw at. Each of the three chord methods respects the rotational symmetry of the circle. None is 'sillier' than the other geometrically. That is why this is a paradox and not just a mistake."
  *   **Why:** If you skip the dartboard, students get lost in the integration. If you keep it but don't distinguish it from Bertrand, they think Bertrand is just "pick the right measure." You need them to see that in Bertrand, *there is no obvious right measure* without further physical stipulation.

  ---

  ### 3. Misconceptions: Triage and Scripts

  You cannot answer all of these fully. You must triage.

  | Misconception | Strategy | One-Sentence Defusion |
  | :--- | :--- | :--- |
  | **"Uniform means equally likely."** | **Preempt.** | "In continuous cases, 'equally likely' applies to intervals of the *parameter*, not the outcomes themselves." |
  | **"There is a true answer we don't know."** | **Kill Early.** | "There is no true answer until we specify the physical process that generates the chord." |
  | **"Probability is subjective."** | **Reframe.** | "It's not about belief; it's about model specification. Different models yield different predictions." |
  | **"Average the three answers."** | **Dismiss.** | "Averaging creates a fourth model with no physical justification." |
  | **"MaxEnt fixes this."** | **Refuse.** | "Maximum Entropy requires us to specify *which variables* we are constraining, which brings us back to square one." |
  | **"Throw straws at a circle."** | **Validate.** | **This is the key.** "Exactly! If you specify the throwing mechanism (e.g., drop straws from height $h$), the probability becomes fixed. The paradox exists only because the problem refused to specify the throw." |

  **Handling the "Straw" Argument (Your Maths Society Friends):**
  *   **Friend 1 (Empirical):** "Go throw straws." $\to$ **Right intuition.** A physical experiment has a definite frequency.
  *   **Friend 2 (Relocation):** "That just relocates the choice." $\to$ **Right analysis.** *How* you throw the straws (long straws from far away vs. short straws dropped vertically) changes the distribution.
  *   **The Synthesis:** Use this to close the session. "Friend 1 is right that a physical setup yields an answer. Friend 2 is right that 'throwing straws' is not a single setup. The lesson is: **Never say 'random'. Say how you are generating the data.**"

  ---

  ### 4. The Closing Check & Refusals

  **The Discriminating Question:**
  Do not use another circle problem. Use the **Cube Factory** (van Fraassen's variant). It tests if they understand that "uniform" attaches to a variable, not an object.

  *   **Question:** "A factory produces cubes with side length $L$ between 0 and 1 cm. If you pick a cube 'at random' (uniformly by side length), what is the probability its face area is less than $0.25 \text{ cm}^2$?"
  *   **Expected Answer:** $P(L < 0.5) = 0.5$.
  *   **Follow-up:** "Now suppose a different factory produces cubes such that their *face areas* are uniformly distributed between 0 and 1. What is the probability the side length is less than $0.5$?"
  *   **Expected Answer:** $P(A < 0.25) = 0.25 \implies P(L < 0.5) = 0.25$.
  *   **Why this works:** A student who memorized "it depends on how you choose" can parrot that. A student who *understands* will recognize that "random cube" is meaningless without specifying the distribution over $L$ or $A$.

  **What to Refuse to Explain:**
  You are right to be cautious. In 25 minutes, depth is the enemy.
  1.  **Measure Theory:** Do not mention $\sigma$-algebras or Lebesgue measure. Say "We need a rule for assigning sizes to sets of outcomes."
  2.  **Group Theory/Invariance:** Do not derive the Haar measure. Just state: "There is a mathematical way to find the unique measure that respects all symmetries, but it requires more machinery than we have today."
  3.  **Bertrand's Intent:** Do not get into whether Bertrand was mocking PoI or probability itself. It's historical trivia, not math.

  **Explicit Refusal Script:**
  "I am refusing to tell you which answer is 'correct' for the chord, because there isn't one. I am also refusing to show you the advanced math (measure theory) that formalizes this, because today is about seeing *why* we need that math, not doing it."

  ### Summary Checklist for Thursday
  1.  **Pre-draw everything.** You do not have time to draw three circles and a triangle neatly.
  2.  **Watch the clock.** If you are at 15 minutes and still on Method 2, skip the integration details for Method 3 and state the result. The *conflict* is more important than the *calculation*.
  3.  **End on the Physical.** The "Straw" resolution is the most satisfying for first-years. It turns a paradox into a modeling instruction.
  4.  **The Moral:** "Randomness is not in the world; it is in the description of the process."

  This plan respects the students' current level, validates your supervisor's mathematical concern while keeping your pedagogical tool, and gives you a hard "exit ticket" question that proves understanding. Good luck.
