          6.  Include one check-for-understanding question at the end (distinguish Neurath vs. Tractatus vs. decorative chart).
          7.  Identify what part of the protocol-sentence debate to skip/flag.
          8.  **Tone:** Casual, messy notes style (drop a typo or two), not overly formal.

  2.  **Deconstruct Neurath's Position (The "Knots"):**
      *   *Knot 1: The Syntax Illusion.* Neurath claims ISOTYPE avoids metaphysical traps because it lacks subject-predicate grammar. But doesn't arranging icons *imply* a logical structure? How is it "syntax-free" if order matters?
      *   *Knot 2: Verification vs. Visualization.* Wittgenstein's pictures *show* logical form. Neurath's pictures *are* the statement. The knot is whether the picture *is* the truth-bearer or just a translation of a truth-bearer. Neurath wants it to be the bearer.
      *   *Knot 3: Physicalism without Propositions.* Neurath is a physicalist. He wants to talk about observable states. But can a picture of a stick figure dying represent "mortality rate" without a hidden propositional framework (e.g., "per capita")? The knot is the hidden quantification.

  3.  **Session Arc Planning:**
      *   *Goal:* Disabuse them of the "Tractatus 2.0" notion. Show Neurath is about *social engineering/communication* as science, not logical isomorphism.
      *   *Dependency:* Need to establish "Coordination" vs. "Assertion" first. Wittgenstein = mirroring reality's structure. Neurath = organizing experience for action.
      *   *Example:* Mortality rates (icon arrays). Why? Because it shows quantity without abstract numbers (initially) and avoids causal claims (unlike weather/chemistry).
      *   *Misconceptions & Timing:*
          1.  "Just infographics" (Early, ~min 10-15).
          2.  "Wittgenstein already did this" (Mid, ~min 25-30).
          3.  "No syntax = no falsifiability" (Late, ~min 40).
      *   *Skip:* The deep dive into *Protocol Sentence* debate (Carnap vs. Neurath on the *form* of the protocol). Just flag it.
      *   *Check Question:* Needs to force distinction.

  4.  **Drafting the Content (incorporating tone):**
      *   *Tone:* Casual, educator-to-educator, slightly rushed notes.
      *   *Typos:* Intentional few (e.g., "exmaple", "dependancy").
      *   *Structure:* Brainstorm -> Arc -> Example -> Misconceptions -> Skip -> Question.

  5.  **Refining the "Knots":**
      1.  *The "Syntax-less" Syntax:* Can you really have no syntax? Arrangement implies logic.
      2.  *The Metaphysical Escape:* Does removing grammar actually remove metaphysics, or just hide it in the icon design?
      3.  *The Truth-Bearer:* Is the picture *itself* true/false, or is it a translation of a true/false sentence? Neurath says the picture *is* the statement.

  6.  **Refining the Example:**
      *   ISOTYPE mortality: Rows of figures. 1 figure = 10,000 people. Some colored black for deaths.
      *   Why not weather? Weather maps imply causal models (isobars etc.) that are theoretical.
      *   Why not chemistry? Molecular diagrams are theoretical models, not direct observation counts.
      *   Mortality works because it's "physicalist" in Neurath's sense—countable bodies.

  7.  **Refining Misconceptions & Pivots:**
      *   *Infographics:* Pivot to "Engineering vs. Decorating."
      *   *Wittgenstein:* Pivot to "Isomorphism vs. Transformation."
      *   *Falsifiability:* Pivot to "Verification conditions vs. Logical form."

  8.  **Refining the Skip:**
      *   Protocol sentences: The debate over whether protocols are in physicalist language or phenomenal language. Too technical. Just say "Neurath vs. Carnap on the *words* used for basics."

  9.  **Refining the Check Question:**
