  **Start:** I take it there is at least one thing, and asking "why?" at least looks like it makes sense.

  **1. Could there have been absolutely nothing—no space, no laws, no numbers?**
  > **No:** **Necessitarianism** (Nothing was never an option).
  > *Awkward bit:* It makes every actual detail feel unavoidable when it plainly isn't.
  > **Yes:** Go to 2.

  **2. Does asking "why" about the whole lot work like asking why a specific rock is here?**
  > **No:** **Dissolutionism** (Question doesn't get a grip).
  > *Awkward bit:* It leaves the sheer presence of the world feeling like a miracle you've talked away.
  > **Yes:** Go to 3.

  **3. Is there any explanation at all, even in principle?**
  > **No:** **Brute Fact** (It simply is).
  > *Awkward bit:* It asks you to stop thinking exactly where your instinct to think begins.
  > **Yes:** Go to 4.

  **4. Is the explanation simply that we couldn't be here to ask unless there was something?**
  > **Yes:** **Anthropic Selection** (Selection effect).
  > *Awkward bit:* It explains why we see something, but not why there is a menu to select from.
  > **No:** Go to 5.

  **5. Does the total energy and mass of everything cancel down to zero?**
  > **Yes:** **Zero-Energy Universe** ("Books balance").
  > *Awkward bit:* It explains the budget, but not why there was a bank open to keep the accounts.
  > **No:** Go to 6.

  **6. Is the fundamental reality purely mathematical structure, with no concrete stuff attached?**
  > **Yes:** **Platonist Structuralism** ("Frozen formalism").
  > *Awkward bit:* It struggles to explain how abstract equations bleed into concrete experience.
  > **No:** Go to 7.

  **7. Does the explanation loop back, so the universe grounds itself?**
  > **Yes:** **Self-Grounding Loop** (Universe brings itself about).
  > *Awkward bit:* It sounds like pulling yourself up by your bootstraps, which works poorly in mechanics.
  > **No:** Go to 8.

  **8. Is the ultimate cause a specific, conscious agent?**
  > **Yes:** **Classical Theism** (Necessary concrete being).
  > *Awkward bit:* It swaps one mystery for another, slightly larger one.
  > **No:** Go to 9.

  **9. Must the ultimate thing exist necessarily, even if we cannot say what it is?**
  > **Yes:** **Ontological Necessity** (Something-or-other exists of necessity).
  > *Awkward bit:* It posits a necessity we can recognise but not describe.
  > **No:** Go to 10.

  **10. Is the answer hidden from us in principle, or just beyond current tools?**
  > **In principle:** **Unknowable Explanation** (Answer exists but not for us).
  > *Awkward bit:* It claims knowledge about a limit we cannot cross.
  > **Beyond tools/None:** Go to 11.

  **11. Is the basic entity just a single physical thing?**
  > **Yes:** **Contingent Basic Entity** ("One lonely particle").
  > *Awkward bit:* It leaves you with a single thing that has no reason to be there.
  > **No:** **Agnostic Realism** (There is an answer, we just don't know which).
  > *Awkward bit:* It sits uncomfortably between saying there is one and saying there isn't.

  ***

  **Where the Key Stops Working**

  Two forks here are matters of temperament rather than fact, and won't bite if your group argues across them. First, **Brute Fact** and **Dissolutionism** often land in the same practical place: silence. One says there is no answer; the other says the question is faulty. Unless you can test the meaningfulness of "totality", you are choosing a mood, not a model.

  Second, **Ontological Necessity** and **Classical Theism** frequently differ only in description, not mechanism. If the "necessary something" has will, it is God; if it lacks will, it is a principle. Since we cannot inspect the ultimate ground, this fork is often just a preference for personal or impersonal language.

  ***

  **Unused Paths**

  The tree allows combinations that nobody actually occupies, usually because they are incoherent or unattractive.

  1.  **Zero-Energy Universe + Anthropic Selection:** This suggests a multiverse where we select a zero-energy universe. It is unattractive because it requires a mechanism to generate universes with different totals, which violates the conservation laws that make the zero-energy case plausible in the first place.
  2.  **Self-Grounding Loop + Classical Theism:** This implies a God who causes Himself. It is rarely argued because it conflates temporal causation with metaphysical grounding; if God is necessary, He does not need to ground Himself, and if He grounds Himself, He is not strictly necessary in the classical sense.
  3.  **Dissolutionist + Brute Fact:** This claims the question is meaningless *and* that the answer is "no reason". It is incoherent because if the question is meaningless, there cannot be a fact of the matter about its answer being brute.

  ***

  **Note on Usage**

  This key is designed for field use, not laboratory precision. If two colleagues end up at different leaves but agree on all the observable consequences, they are likely disagreeing about nomenclature. In that case, pour the tea and move on. The aim is to locate the disagreement, not necessarily to resolve it.
