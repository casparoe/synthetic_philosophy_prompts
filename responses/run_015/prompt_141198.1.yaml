  # JOINT STATEMENT ON DECISION RULES FOR THE CITIZENS' ASSEMBLY
  **Date:** [Current Date]
  **To:** The Citizens' Assembly Steering Committee
  **From:** The Decision Rule Working Group (Reasons First & Verdict First Camps)
  **Subject:** Agreed Findings, Residual Disagreements, and Cruxes Regarding Aggregation Procedures

  ## 1. SHARED PREMISES AND ACKNOWLEDGED CONSTRAINTS

  We, the undersigned members of the Working Group, having reviewed the theoretical literature and the specific operational constraints of the Assembly, agree on the following claims regarding the decision rule to be adopted for the upcoming two-year term.

  1.  **The Discursive Dilemma is Inescapable:** We acknowledge that for any set of proposals governed by the doctrine (Adopt iff $P \land \neg Q$), there exist voter profiles where Premise-Based Aggregation (PBA) and Conclusion-Based Aggregation (CBA) yield contradictory outcomes. There is no mathematical procedure that satisfies Universal Domain, Collective Rationality, Anonymity, Independence, and Systematicity simultaneously. We must choose which axiom to relax.
  2.  **The "Veil of Ignorance" Constraint:** We acknowledge that because the rule must be fixed before the forty proposals are known, we cannot optimize the rule for specific policy outcomes. The rule must be robust against unknown distributions of voter preference on $P$ (emissions efficacy) and $Q$ (distributional cost).
  3.  **The Partial Deferral Complication:** We agree that the Assembly's unique feature—where approximately one-third of members defer on $P$ (technical panel) but vote on $Q$—creates distinct electorates for different propositions ($E_P \neq E_Q$). We acknowledge this invalidates standard impossibility theorems that assume a fixed electorate, but introduces new risks of "Frankenstein Majorities" (see Section 3).
  4.  **Precedent and Dynamic Consistency:** We agree that because Assembly decisions serve as precedent, logical inconsistency in early cases (e.g., adopting a measure while rejecting its necessary premises, or vice versa) will constrain later cases. A rule that produces logically inconsistent judgment sets increases the risk of paralysis or arbitrary distinction-drawing in Year 2.
  5.  **Description Dependence:** We acknowledge that the choice of premise formulation (specifically $Q$ vs. $Q^*$) is not neutral. If the decision rule relies on premises, the outcome depends on how the question is described. We agree this creates a vulnerability to agenda manipulation regardless of which procedure is chosen, though the *mechanism* of manipulation differs.

  ## 2. DISAGREEMENTS TABLE

  The following table summarizes the residual disagreement. Each position is phrased as its proponents would characterize it, not as their opponents would caricature it.

  | Feature | **Reasons First (Premise-Based)** | **Verdict First (Conclusion-Based)** |
  | :--- | :--- | :--- |
  | **Primary Goal** | **Integrity of Public Reason.** The Assembly's output must be a set of reasons the City can cite to justify action. A verdict that contradicts the stated premises undermines the City's ability to defend the policy in court or public discourse. | **Democratic Responsiveness.** The Assembly's output must reflect the will of the members on the actual question asked ("Should we adopt this?"). Premises are secondary tools for deliberation, not binding constraints on the vote. |
  | **View on Inconsistency** | **Fatal Flaw.** If the Assembly adopts a measure while the majority rejects the premise that justifies it (or accepts the premise that forbids it), the decision is illegitimate. It is better to have no decision than a self-contradictory one. | **Acceptable Cost.** If the majority wants to adopt a measure, their "reasons" are whatever they say they are. Forcing them to align with a rigid logical doctrine privileges the rule over the people. Inconsistency is a bug in the rule, not the voters. |
  | **View on Deferral** | **Feature.** Deferral on $P$ recognizes technical expertise. PBA respects this by letting the technical majority decide $P$ and the political majority decide $Q$. | **Bug.** Deferral fragments accountability. If a member abstains on $P$, they should not influence the outcome of $Q$ in a way that overrides the judgment of those who assessed the whole package. |
  | **Risk Priority** | **Prioritizes avoiding "Hollow Verdicts."** Fears CBA will allow coalitions to pass measures that fail the Assembly's own stated doctrine, creating legal and reputational risk. | **Prioritizes avoiding "Minority Rule."** Fears PBA will allow a minority to block measures the majority supports by manipulating the premises or exploiting the deferral structure. |
  | **Handling $Q$ vs $Q^*$** | **Doctrinal Stability.** The definition of $Q$ must be fixed. If the Assembly votes to change $Q$ to $Q^*$, that is a change in the doctrine itself, not a vote on a proposal. | **Framing Neutrality.** If the membership feels $Q^*$ captures the moral reality better than $Q$, the voting rule should respect that shift without penalizing the outcome. |

  ## 3. THE PARTIAL DEFERRAL PATHOLOGY

  We have identified a specific risk profile unique to our "Partial Deferral" setup. Below is the minimal voter profile where Premise-Based Aggregation produces a judgment set endorsed by no individual member and which would not occur under a fixed electorate.

  **The Setup:**
  *   **Doctrine:** Adopt iff $P$ (True) AND $Q$ (False).
  *   **Electorates:** $P$ is voted on by $\{1, 2, 3\}$. $Q$ is voted on by $\{3, 4, 5\}$. (Voter 3 is the overlap; 1 & 2 defer on $Q$; 4 & 5 defer on $P$).
  *   **Voter Preferences:**
      *   **Voter 1:** $P$=True. (Does not vote $Q$). *Implicit View: Adopt (assuming $\neg Q$).*
      *   **Voter 2:** $P$=True. (Does not vote $Q$). *Implicit View: Adopt (assuming $\neg Q$).*
      *   **Voter 3:** $P$=True, $Q$=True. *Explicit View: Reject (since $P \land Q \rightarrow \neg \text{Adopt}$).*
      *   **Voter 4:** $Q$=True. (Does not vote $P$). *Implicit View: Reject (assuming $P$).*
      *   **Voter 5:** $Q$=True. (Does not vote $P$). *Implicit View: Reject (assuming $P$).*

  **The PBA Outcome:**
  *   **Vote on $P$:** Voters 1, 2, 3 vote True. **Result: $P$ is Accepted.**
  *   **Vote on $Q$:** Voters 3, 4, 5 vote True. **Result: $Q$ is Accepted.**
  *   **Applied Doctrine:** $P$ is True AND $Q$ is True $\rightarrow$ **Measure Rejected.**

  **The Pathology:**
  1.  **No Individual Endorsement:** The collective judgment is $\{P, Q\}$ (leading to Rejection).
      *   Voters 1 & 2 hold $\{P\}$ only.
      *   Voters 4 & 5 hold $\{Q\}$ only.
      *   Voter 3 holds $\{P, Q\}$, **BUT** Voter 3 is the *only* person who voted on both. In this specific profile, Voter 3 *does* endorse the judgment set.
      *   *Correction for "No Individual Endorses":* To achieve the stronger pathology where *no one* endorses the set, we must adjust Voter 3.
      *   **Revised Voter 3:** $P$=True, $Q$=False. (View: Adopt).
      *   **Revised PBA Outcome:** $P$ is True (1,2,3). $Q$ is True (4,5 vote True; 3 votes False $\rightarrow$ Tie).
      *   *To break the tie and ensure the pathology:* We need more deferrers.
      *   **Minimal Profile for "Frankenstein Judgment":**
          *   $E_P = \{1, 2, 3\}$. $E_Q = \{3, 4, 5\}$.
          *   1: $P$=T.
          *   2: $P$=T.
          *   3: $P$=T, $Q$=F. (Wants to Adopt).
          *   4: $Q$=T.
          *   5: $Q$=T.
          *   **PBA Result:** $P$ passes (3-0). $Q$ passes (2-1). Collective Judgment: $\{P, Q\}$. Outcome: Reject.
          *   **Individual Endorsements of $\{P, Q\}$:**
              *   1 & 2: Do not hold opinion on $Q$.
              *   4 & 5: Do not hold opinion on $P$.
              *   3: Explicitly holds $\{P, \neg Q\}$.
          *   **Conclusion:** The Collective holds $\{P, Q\}$. **No individual member holds the judgment $\{P, Q\}$.** Voter 3, the only one competent to judge the conjunction, explicitly rejects it.
  2.  **Fixed Electorate Counterfactual:** If all 5 voters were forced to vote on both $P$ and $Q$:
      *   Assuming 1 & 2 (Pro-P) would vote $\neg Q$ (since they want adoption and defer only due to rules), and 4 & 5 (Pro-Q) would vote $\neg P$ (since they worry about costs and defer on tech):
      *   $P$ Vote: 3 Yes, 2 No $\rightarrow$ Passes.
      *   $Q$ Vote: 2 Yes, 3 No $\rightarrow$ Fails.
      *   **Fixed Electorate Outcome:** $P \land \neg Q$ $\rightarrow$ **Adopt.**
      *   **Deferral Outcome:** **Reject.**

  **Assessment:**
  We agree this is a **Real Pathology**, not an artifact. It demonstrates that partial deferral allows two distinct majorities to impose a conjunction ($P \land Q$) that the *intersection* of the electorates (the only people who considered both) explicitly opposes. This violates the principle of "Collective Rationality" more severely than the standard discursive dilemma, as the group believes a proposition that no competent member believes.

  ## 4. CRUCES FOR TESTING

  To resolve the choice between PBA and CBA, we propose the following concrete tests. Both camps agree that the outcome of these hypothetical scenarios should determine which rule is superior.

  **Crux 1: The Moralized Premise Test ($Q$ vs $Q^*$)**
  *   **Scenario:** A proposal passes the technical panel ($P$ is True). The cost burden is high for low-income households, but there is a robust mitigation fund.
  *   **The Split:** 60% of the Assembly vote $Q$ ("Disproportionate cost?") as **True**. 60% vote $Q^*$ ("Unjust cost burden?") as **False** (believing the mitigation fund makes it just).
  *   **The Test:**
      *   **PBA Prediction:** The outcome flips based solely on whether the ballot says $Q$ or $Q^*$. If we use $Q$, the measure fails. If we use $Q^*$, the measure passes.
      *   **CBA Prediction:** The outcome remains stable (based on the direct "Adopt?" vote), regardless of premise labeling.
  *   **Agreement:** If PBA cannot produce a stable outcome when the premise is moralized rather than technical, the "Reasons First" camp concedes that PBA is too vulnerable to framing manipulation for this Assembly.

  **Crux 2: The Technical Error Stress Test**
  *   **Scenario:** The Technical Panel certifies $P$ (emissions cut $\ge$ 15%). The Assembly later discovers (Year 2) that the model was flawed and the cut will only be 5%.
  *   **The Split:** The "Verdict First" camp argues the vote was valid at the time. The "Reasons First" camp argues the decision is void because the premise $P$ is factually false.
  *   **The Test:**
      *   **PBA Prediction:** The decision is logically voidable because the premise set $\{P\}$ is false. This creates uncertainty for contracts signed in Year 1.
      *   **CBA Prediction:** The decision stands as the will of the Assembly at the time, absorbing the risk of error.
  *   **Agreement:** If PBA creates unacceptable legal instability for city contracts when technical premises are later debunked, the "Reasons First" camp concedes that CBA is safer for implementation.

  **Crux 3: The Precedent Lock-In**
  *   **Scenario:** Case 1 establishes that "Electric Bus Lanes" satisfy $P$. Case 2 proposes "Electric Bus Lanes + Toll Exemptions."
  *   **The Split:** Under PBA, the finding on $P$ in Case 1 may bind Case 2 (stare decisis on premises). Under CBA, Case 2 is voted on anew.
  *   **The Test:**
      *   **PBA Prediction:** Increases efficiency (don't re-vote on $P$) but risks error propagation (if Case 1 $P$ was marginal, Case 2 inherits the error).
      *   **CBA Prediction:** Higher deliberative cost per case, but higher accuracy per case.
  *   **Agreement:** If PBA forces the Assembly to defend a premise in Case 20 that they would reject if voted on fresh, the "Reasons First" camp concedes that PBA undermines the "Citizens'" nature of the Assembly over time.

  ## 5. ANALYSIS OF THE COMPROMISE PROPOSAL

  **Proposal:** Run both PBA and CBA. If they agree, the measure passes/fails accordingly. If they disagree, the measure fails (Status Quo).

  **Can both camps sign this?**
  *   **Reasons First:** **Yes, with reservation.** This prevents "irrational" adoptions (where CBA says Adopt but PBA says premises fail). It treats logical consistency as a veto condition.
  *   **Verdict First:** **No.** This effectively grants a veto to the premise-voters over the conclusion-voters. Since the electorates differ ($E_P \neq E_Q$), this allows the technical panel (via $P$) or the equity bloc (via $Q$) to override the full Assembly's will on "Adopt?".

  **Does it relocate the disagreement?**
  Yes. It moves the fight from "Which rule?" to "How easy is it to trigger a disagreement?"
  *   If the camps believe disagreement will be rare (e.g., 1 in 40 proposals), VF might accept it as a safety valve.
  *   If the camps believe disagreement will be common (e.g., due to the $Q$ vs $Q^*$ framing), RF will view it as paralysis.
  *   **Verdict:** This compromise biases the system heavily toward the Status Quo. It is not a neutral arbiter; it is a "Double Veto" system. It solves the consistency problem by suppressing the output, not by resolving the input conflict.

  ## 6. MERELY VERBAL DISPUTES

  We identify the following areas where the disagreement is semantic rather than substantive, and recommend these be removed from the final rule text to avoid confusion.

  1.  **"Rationality":** Both camps agree the Assembly should not be *self-contradictory*. RF defines this as "Logical consistency of premises." VF defines this as "Consistency of will over time." We agree to use the term **"Coherence"** in the final document to cover both, without specifying the mechanism.
  2.  **"Majority":** Both camps agree decisions should reflect the majority. RF defines this as "Majority on the necessary conditions." VF defines this as "Majority on the sufficient condition." We agree to acknowledge that **"Compound Majorities"** are inevitable and neither is inherently more "democratic" without further normative stipulation.
  3.  **"Deference":** Both camps agree members can abstain. The dispute is whether an abstention on $P$ counts as a "vote" in the denominator for $Q$. We agree to specify in the rule that **Denominators are Proposition-Specific**, ending the debate over whether deferrers are "present" for the quorum of the other proposition.

  ## 7. RECOMMENDATION

  Given the "Partial Deferral Pathology" identified in Section 3, we cannot recommend pure Premise-Based Aggregation without modification. The risk of a "Frankenstein Judgment" (where the group accepts $\{P, Q\}$ but no competent member does) is too high given the split electorates.

  However, pure Conclusion-Based Aggregation ignores the legal necessity of the $P \land \neg Q$ doctrine.

  **We propose the following modified rule for the Steering Committee's consideration:**
  1.  **Primary Vote:** Conclusion-Based (Direct vote on "Adopt?").
  2.  **Reasoned Check:** Simultaneous vote on $P$ and $Q$.
  3.  **Trigger:** If CBA says "Adopt" but PBA says "Reject" (i.e., $\neg P$ or $Q$), the measure is **not** killed, but is **referred back** to a plenary session for one final debate and re-vote.
  4.  **Rationale:** This respects the majority will (VF priority) but forces a public reconciliation of reasons (RF priority) before implementation, mitigating the risk of hollow verdicts without granting a minority veto.

