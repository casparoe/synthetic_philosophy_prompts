  Before the will descends to shape the clay,
  There stands the glass unformed within the light,
  Not nothing yet, nor anything made real,
  But distinct paths embedded in the soil
  Where no foot walks. The vision sees the branch
  That bends beneath a weight it never bears,
  And knows the fruit would rot, or else ripen,
  Had rain been sent. This sight is not drawn
  From what exists, nor willed into being,
  But hovers like a dust-mote in the beam.
  So many worlds lie feasible within
  The eternal sight, though some are closed off
  Because the creature, placed in circumstance,
  Would surely turn away. The truth is there,
  Before the decree falls, a shadow cast
  By no substantial thing. How can what would
  Subsist without a cause to anchor it
  To being? Yet seen it is. The eye perceives
  The path not taken, still distinct from null.
  If nothing makes it true, how is it known?
  If God makes true, then freedom is undone.
  The line hangs tight between the rock and void.
  No ground below, no necessity above,
  Just this: the statement holds, though nothing holds
  The statement up. The hovering vision stays
  Suspended like the blade that never cuts,
  Or water poised above the thirsty ground
  Known to run south before the cloud decides
  To break. The truth hangs waiting for the will
  To make it so, or leave it un-begun.

  My reasoning is most vulnerable in assuming syntactic suspension successfully mirrors metaphysical grounding. If a defensible truthmaker for counterfactuals of freedom exists—such as Plantinga's essence-based account or a non-causal grounding theory—then the poem's unresolved tension becomes merely decorative. It would signify an artistic choice to emphasize mystery rather than diagnosing a genuine logical impasse. The poem relies on the intuition that truth requires a ground; if that intuition is false regarding CCFs, the suspension is stylistic, not ontological.
