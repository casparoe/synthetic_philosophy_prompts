answer: |-
  First off: **No, you are not being a jerk.** You are being a professional with boundaries.

  Here is the breakdown of the philosophy, the ethics, and how to handle your manager without burning bridges.

  ### 1. The Philosophy: "Supererogatory Acts"
  You asked for a philosophical concept for when a nice thing stops being optional. The term you're looking for is **Supererogation**.

  In ethics, a *supererogatory* act is something that is good to do, but **not morally required**. It is "above and beyond the call of duty."
  *   **Duty:** Doing your assigned tickets during work hours.
  *   **Supererogatory:** Fixing an unassigned bug on your Saturday.

  The trap you are in is that your manager is trying to convert a *supererogatory* act into a *duty*. In philosophy, this is sometimes called **Moral Coercion**. When society (or a manager) praises a virtue so loudly that failing to repeat it becomes a vice, they have broken the definition of the virtue. If you *must* do it to avoid shame, it is no longer "good citizenship"; it is **uncompensated labor**.

  There is also a systems theory concept called **Goodhart's Law**: *"When a measure becomes a target, it ceases to be a good measure."*
  The Slack bot was meant to measure "good citizenship." Now that the manager is targeting it ("keep the momentum going"), it has become a performance metric. The "citizenship" is dead; now it's just KPIs.

  ### 2. The Work Ethics: Why this is a red flag
  You are right to feel trapped, because the dynamic has shifted from **voluntary** to **exploitative**.

  *   **Time:** You did this on a **Saturday**. That is personal time. Unless you are on-call or have equity in a very early-stage startup, working weekends for "unassigned refactors" is unsustainable.
  *   **Scope:** You fixed a dependency you *don't maintain*. That is a one-time favor to the universe. Being asked to do *another* refactor implies you now *own* that debt.
  *   **Compensation:** If this work is valuable enough for the manager to ask you to repeat it, it is valuable enough to be assigned during work hours or compensated with overtime/comp time.

  If you say yes, you teach the manager that your weekend time is free and that "voluntary" work is actually mandatory. If you say no, you teach them that you have boundaries. **Boundaries are not rudeness; they are requirements for long-term employment.**

  ### 3. How to say "No" (without looking like you're slacking)
  You need to decouple "slacking" from "not working weekends." Slacking is not doing your job during work hours. Protecting your weekend is standard professional conduct.

  Here is a script you can adapt for your manager:

  > "Hey [Manager Name], regarding that refactor: I'm glad the fix last week helped the team, but I can't make a habit of working weekends on unassigned tasks. I need to recharge on my off-time to stay sharp during the week.
  >
  > If this refactor is a priority, let's discuss prioritizing it in the sprint backlog for next week. If it's lower priority, I'd prefer to tackle it during downtime in work hours rather than eating into my Saturday again."

  **Why this works:**
  1.  **It's firm:** "I can't make a habit of this."
  2.  **It's solution-oriented:** "Let's put it in the sprint."
  3.  **It reframes the value:** You are offering to do the work, just *during work hours*. If they say no to that, they admit the work isn't actually important.

  ### 4. The Long Game
  The Slack bot culture is toxic if it encourages weekend work.
  *   **Short term:** Say no to the weekend work. Do the refactor next Tuesday if it's actually important, or let it rot if it isn't.
  *   **Medium term:** If the bot continues to gamify unpaid overtime, raise it in a retro. "I'm worried the bot creates pressure to work off-hours. We should clarify that these logs are for work-time contributions only."
  *   **Long term:** Watch your manager. If they continue to push for "voluntary" weekend work after you set a boundary, this is a culture fit issue. A good manager protects their team from burnout; a bad one harvests it.

  **Summary:** You did a great thing last week. That doesn't buy you a lifetime subscription to weekend labor. Say no, protect your time, and let the "momentum" stop where it belongs: at Friday 5 PM.
