prompt: |-
  hey quick question about work ethics or whatever. im a backend engineer and our team has a slack bot that logs whenever someone picks up an unassigned bug or writes docs no one asked for. its meant to be voluntary good citizenship stuff, no bonuses tied to it. last week i spent saturday fixing a race condition in a dependency we all use but dont maintain. the bot posted it and people cheered. now my manager is asking if i can keep the momentum going and handle another unassigned refactor this weekend. i said maybe, but now i feel trapped — if i do it again its like im the unofficial maintainer, but if i say no people might think im slacking after being praised. is there a philosophy idea for when a nice thing you do once stops being optional? and am i actually being a jerk if i say no this time? also i typed this on my phone so forgive any typos.
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User's Situation:**
      *   **Role:** Backend Engineer.
      *   **Context:** Team has a Slack bot that logs "good citizenship" tasks (unassigned bugs, docs). Voluntary, no bonuses.
      *   **Event:** User spent *Saturday* (personal time) fixing a race condition in a shared dependency (not maintained by the team).
      *   **Reaction:** Bot posted, team cheered.
      *   **Conflict:** Manager is now asking the user to "keep the momentum going" by doing *another* unassigned refactor *this weekend*.
      *   **User's Feeling:** Trapped. Worried about becoming the "unofficial maintainer" if they say yes. Worried about looking like they're "slacking" if they say no.
      *   **Questions:**
          1.  Is there a philosophical concept for when a nice thing stops being optional?
          2.  Am I being a jerk if I say no?

  2.  **Deconstruct the Ethical/Professional Issues:**
      *   **Work-Life Balance:** Working weekends should be the exception, not the rule, especially for "voluntary" tasks.
      *   **Managerial Expectation:** The manager is blurring the line between "voluntary recognition" and "performance expectation." This is a red flag.
      *   **Precedent:** Doing something once creates a precedent, but it shouldn't create an obligation.
      *   **Compensation:** If it's work, it should be compensated (time or money). If it's volunteer work, it should be truly optional.
      *   **The "Trap":** The user feels coerced by social pressure (team cheers) and authority (manager ask).

  3.  **Address the Philosophical Question:**
      *   *Concept:* "Moral Licensing" vs. "Obligation Creep."
      *   *Better Concept:* **The Paradox of Altruism** or **Goodhart's Law** (when a measure becomes a target, it ceases to be a good measure).
      *   *Best Fit:* **The "Extra Mile" Fallacy** or **Normative Shift**.
      *   *Specific Term:* **"Mission Creep"** (usually military/org strategy) applies here. Or **"Unwritten Contract"**.
      *   *Philosophical Angle:* **Kantian Duty vs. Supererogatory Acts.**
          *   *Supererogatory:* Acts that are good to do but not required (going above and beyond).
          *   *Duty:* What is required.
          *   *The Shift:* The manager is trying to convert a *supererogatory* act into a *duty*.
      *   *Another Angle:* **Reciprocity Norm.** The team cheered, now they expect more.
      *   *Selection:* I'll focus on **Supererogation** (acts beyond duty) and **Goodhart's Law** (metrics driving behavior).

  4.  **Address the "Am I a Jerk?" Question:**
