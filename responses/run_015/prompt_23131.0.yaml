answer: |-
  You have grasped the core tension perfectly. In fact, your summary of the problem is sharper than many introductory texts manage. You have identified the precise friction point between **ontological verisimilitude** (how close a theory *actually* is to the truth) and **epistemic access** (how we *know* or estimate that closeness).

  You are not misunderstanding the concept. Rather, you have hit upon the central criticism that anti-realists levy against scientific realists, and the central headache that realists have been trying to massage away for fifty years.

  Here is a way to straighten out the tangle, structured around the distinction between the *definition* of the concept and its *application*.

  ### 1. The Ontic vs. The Epistemic
  The confusion often stems from conflating two different questions:
  1.  **What is verisimilitude?** (An ontological/semantic question about the relation between a theory and the world.)
  2.  **How do we recognize it?** (An epistemological question about evidence and theory choice.)

  Your intuition is correct: If verisimilitude is a real, objective property, it *should* in principle be comparable. However, the literature insists we cannot *compute* it because computation requires comparing the theory to the "whole truth," which is unavailable to us.

  Think of it like **temperature** in the 17th century. Before thermometers, "heat" was an objective physical property (mean kinetic energy of particles), but humans could only access it via subjective sensation (hot/cold). The fact that we couldn't measure it precisely didn't mean temperature didn't exist; it meant our *epistemic access* was limited.

  In philosophy of science, **verisimilitude is the temperature; empirical success is the feeling of warmth.** We use the feeling of warmth (predictions, explanations) to infer the temperature, but they are not identical. A theory can be empirically adequate (feel warm) but have low verisimilitude (actually be cold), perhaps due to luck or compensating errors. Conversely, a theory might have high verisimilitude but currently lack the technology to verify its predictions.

  ### 2. Why Keep the Concept if We Can't Measure It?
  You ask: *"If that's right, then it seems like verisimilitude is a concept we can never actually put to work."*

  This is the strongest argument for **Constructive Empiricism** (associated with Bas van Fraassen). Van Fraassen argues exactly what you are suggesting: if we can't distinguish between "empirically adequate" and "truthlike," we should drop the claim to truth and settle for empirical adequacy.

  However, Scientific Realists argue the concept is indispensable for three reasons:

  **A. Defining Progress (The Regulative Ideal)**
  Without verisimilitude, it is difficult to make sense of theory change. If Theory A is false, and Theory B is also false, in what sense is B an *improvement*?
  *   If we only look at prediction, B might just be a more complex curve-fitting exercise.
  *   If we look at verisimilitude, we can say B captures the *structure* of the world better than A, even if both are strictly false.
  It functions as a **Kantian regulative ideal**. We cannot stand on the North Star, but navigation requires assuming it exists. Verisimilitude allows us to define progress as "movement toward the truth" rather than just "change in instrumentation."

  **B. Avoiding the Pessimistic Meta-Induction**
  The Pessimistic Meta-Induction argues that since past successful theories (Newtonian physics, Phlogiston, Caloric) turned out to be false, current successful theories (Quantum Mechanics) will likely turn out to be false.
  *   **Without verisimilitude:** This argument is devastating. It suggests science is a graveyard of refuted falsehoods.
  *   **With verisimilitude:** We can say Newton was *false*, but *more truthlike* than Aristotle. The entities (forces, mass) weren't pure fiction; they were approximations of a deeper structure. This preserves the rationality of science despite the history of error.

  **C. Guiding Theory Construction**
  Scientists don't just seek predictions; they seek *mechanisms*. When a physicist rejects a theory that "saves the phenomena" because it relies on "action at a distance" or "ad hoc parameters," they are making a verisimilitude judgment. They are betting that a theory with more coherent structural mapping to reality is preferable, even if the predictive output is currently identical. The concept explains *why* scientists behave the way they do.

  ### 3. The Formal Failures and Modern Solutions
  You mentioned the literature showing that natural attempts run into trouble. You are likely referring to the **Tichý-Miller triviality results** (1974/1976). They proved that Popper's original definition (based on counting true vs. false logical consequences) collapses: if a theory is false, adding more content usually makes it *less* truthlike, not more, according to Popper's math.

  However, the literature hasn't stopped there. Since the 1980s, philosophers like **Ilkka Niiniluoto** and **Graham Oddie** have developed **semantic approaches** to verisimilitude.
  *   Instead of counting logical consequences, they use **possible worlds semantics**.
  *   They define the "distance" between the actual world and the possible world described by the theory.
  *   If the actual world is $W_{actual}$ and the theory describes $W_{theory}$, verisimilitude is a function of the similarity between these worlds.

  This avoids the Tichý/Miller collapse, but it reintroduces your problem: **We still can't calculate the distance because we don't know $W_{actual}$.**

  ### 4. How We "Put It to Work" (Epistemic Surrogates)
  So, how do we use a metric we can't read? We use **indicators** or **surrogates**. We cannot measure verisimilitude directly, but we can look for signs that correlate with it.

  When scientists argue Theory B is better than Theory A, they are usually arguing that B has higher *estimated* verisimilitude based on:
  1.  **Explanatory Unification:** Does it explain more phenomena with fewer assumptions? (Suggests a deeper grasp of underlying structure.)
  2.  **Novel Predictions:** Did it predict something unknown before the theory was formulated? (Suggests the theory isn't just curve-fitting existing data.)
  3.  **Robustness:** Do different methods of detection converge on the same entity? (Suggests the entity is mind-independent.)
  4.  **Continuity:** Does the new theory reduce to the old theory in limiting cases? (Suggests the old theory wasn't pure nonsense, but an approximation.)

  These are not verisimilitude itself. They are the **evidence for verisimilitude**. The literature's insistence that we cannot "compute" verisimilitude is a warning against conflating the *score* with the *performance*.

  ### 5. Summary for Your Piece
  To resolve your tangle, you might frame it this way:

  1.  **Acknowledge the Gap:** You are correct that there is an unbridgeable gap between *actual* verisimilitude (ontological) and *assessed* verisimilitude (epistemological).
  2.  **Reject the "Measurement" Requirement:** A concept does not need to be algorithmically computable to be meaningful. "Justice," "Health," and "Rationality" are similarly difficult to define operationally, yet we use them to evaluate systems, bodies, and arguments.
  3.  **Reframe the Utility:** Verisimilitude is not a tool for *calculation*; it is a tool for *interpretation*. It allows us to interpret the history of science as progress rather than mere replacement. It justifies the realist stance that science is uncovering the structure of the world, not just building better instruments.
  4.  **The "Best Explanation" Argument:** The fact that science works (technologically, predictively) is best explained by the hypothesis that our theories are increasing in verisimilitude. If they weren't getting closer to the truth, their success would be a miracle (Putnam's No Miracles Argument).

  **The Verdict:**
  You are not missing anything obvious. You have identified the "Epistemic Access Problem." The resolution is not to solve the problem (we can't), but to recognize that verisimilitude is a **regulative ideal** that makes sense of scientific practice, even if it remains forever just out of our direct measurement reach. It is the horizon we walk toward; we never reach it, but the walking is the progress.
