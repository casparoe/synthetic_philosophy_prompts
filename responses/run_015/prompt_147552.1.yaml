prompt: |-
  As a novelist drafting a philosophical narrative centered on an epistemologist who teaches a graduate seminar on cognitive persuasion, I require an assessment instrument that could plausibly appear in such a course—something rigorous enough to distinguish students who merely recall standard taxonomies from those who understand the mechanics of belief fixation. I want a final-exam essay question, appropriate for an upper-level philosophy of mind or cognitive science seminar, that does not recycle the Chinese Room or the trolley problem but instead turns on a deliberately constructed intuition pump I have been calling the cartographer's mirror: imagine a society that maintains its collective identity not through shared institutional memory or biological continuity, but through a single, continuously updated map that claims to represent the territory it describes, even as the territory itself is altered in real time to match the map's latest edition. The question should ask students to identify precisely why this scenario functions as an intuition pump about reduction and emergence, to diagnose the specific narrative framing devices—what I think of as framing residue—that make the analogical leap feel compelling, and to evaluate whether the pump genuinely supports the reductionist conclusion it appears to generate or whether it covertly smuggles in holist assumptions through its descriptive grammar. Please provide the essay prompt itself, together with a model answer of approximately seven hundred words that demonstrates the required conceptual moves—separating logical structure from narrative transportation, identifying the framing residue, and locating exactly where the analogical mapping fails—along with a marking scheme built around five must-hit points that separates a first-class answer from a merely competent one by naming the specific analytical moves each must contain, assigning relative weight, and identifying the characteristic misreadings that should cost marks. The difficulty must come from dismantling the pump's machinery rather than summarizing its surface conclusion; the exam should be answerable in ninety minutes, and please avoid any request for bibliographies, reading lists, or citations, since the model within my narrative has no access to external archives.
