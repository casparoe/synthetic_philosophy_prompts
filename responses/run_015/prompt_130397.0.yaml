answer: |-
  This is a sophisticated debate that touches on moral philosophy, historiography, and logic. Your friend's position has evolved from a broad claim ("he was a product of his era") to a more specific one ("he had access to moral dissent").

  To determine if she is being consistent, and whether there is a principled reason to judge historical figures differently, we need to break down the logic of both arguments.

  ### 1. Analyzing Your Friend's Consistency

  Your friend is actually being **more consistent than you might realize**, provided you look at the underlying principle she is using.

  *   **Her Initial Principle:** People should be judged by the moral information available to them at the time, not by future standards.
  *   **Her Application to Columbus:** She initially argued he lacked moral information ("product of his era"). When you challenged her, she refined this: He *did* have moral information (dissenting clergy/Crown policies), so he can be judged for ignoring it.
  *   **Her Application to Corporations:** Corporations today have moral information (scientific consensus on climate, activist dissent), so they can be judged for ignoring it, even if their actions are legal.

  **The Verdict on Consistency:**
  She is logically consistent. Her core criterion is not "legality" or "time period," but **"accessibility of moral critique."**
  *   If a moral alternative was *unthinkable* in 1492, she would excuse Columbus.
  *   Because a moral alternative was *thinkable* (voiced by contemporaries), she condemns Columbus.
  *   Because a moral alternative is *thinkable* today (voiced by scientists/activists), she condemns corporations.

  Your counter-argument assumed she was arguing for "legality = morality." She corrected you by arguing for "consensus = morality." Since dissent existed in both 1492 and 2024, she condemns actors in both eras who ignore that dissent.

  ### 2. The Historical Nuance: Was the Dissent "Actionable"?

  The weak point in your friend's argument is not logic, but history. She claims dissent existed among Spanish clergy. This is true, but requires nuance.

  *   **The Las Casas Timeline:** The most famous critic, Bartolomé de las Casas, did not begin his major advocacy until decades *after* Columbus's death. Using him as proof Columbus "should have known better" is slightly anachronistic.
  *   **The Royal Stance:** However, Queen Isabella and King Ferdinand did express concern about the enslavement of subjects they considered under Spanish protection. Columbus was actually arrested and stripped of his titles in 1500 due to complaints about his brutality and mismanagement.
  *   **The Implication:** This strengthens your friend's point. Columbus wasn't operating in a vacuum where *everyone* endorsed slavery. There were institutional checks and moral objections *during his lifetime*. He wasn't just following a universal norm; he was often acting against the specific wishes of his monarchs and the church hierarchy.

  If the moral critique was available and actionable *then*, the "product of his era" defense collapses.

  ### 3. Principled Reasons for Differential Judgment

  Even if your friend is consistent, you asked if there is a **principled reason** to judge historical figures differently from modern ones. Philosophers and historians generally offer three arguments for why we might treat Columbus differently than a modern CEO, regardless of dissent.

  #### A. The Purpose of Judgment (Retrospective vs. Prospective)
  *   **Modern Corporations:** We criticize them to change future behavior. The judgment is instrumental; it aims to alter policy, stock value, or regulation.
  *   **Historical Figures:** We cannot change Columbus's behavior. Condemning him is purely about **historical memory**. It signals what *we* value today, not necessarily what *he* failed to do then.
  *   **Principle:** Some argue it is category error to "condemn" the dead. We can *analyze* their harm, but "condemnation" implies a moral agency that no longer exists. Others argue that how we memorialize the dead shapes the future, so judgment is still valid.

  #### B. Individual vs. Structural Agency
  *   **Columbus:** He was an individual with significant autonomy. He made specific choices to enslave and mutilate. His agency was direct.
  *   **Corporations:** A corporation is a structural entity. A CEO might personally care about the environment but be legally bound by fiduciary duty to maximize profit.
  *   **Principle:** It is often easier to assign moral blame to an individual (Columbus) than to a structure (Capitalism). If your friend condemns the *corporation* (the structure) but condemns *Columbus* (the individual), she is applying different standards of agency. If she condemns the *CEO*, the parallel is tighter.

  #### C. Epistemic Limitations (The "Unknown Future" Argument)
  *   **Columbus:** He did not know his voyages would lead to the death of millions via disease and colonization. While he was brutal, the *scale* of the demographic collapse was unforeseeable.
  *   **Corporations:** We know exactly the potential outcome of carbon emissions. The causal link is scientifically established.
  *   **Principle:** Moral responsibility is often tied to foreseeability. Columbus is responsible for the violence he ordered, but perhaps not for the epidemiological catastrophe that followed. Modern corporations are responsible for the harm they know is probable.

  ### 4. Where Your Argument Holds Ground

  You can push back on your friend's position using the **"Systemic Norms"** argument.

  Even if dissent existed in 1492, it was **marginal**. The vast majority of European society, law, and theology supported the concept of dominion over "heathens."
  *   **The Parallel:** Today, while environmental dissent exists, the vast majority of global economic systems, laws, and incentives *require* growth and resource extraction.
  *   **The Point:** If Columbus is excused because the *dominant* norm was conquest, corporations should be excused because the *dominant* norm is profit. If corporations are condemned because dissent *exists*, Columbus must be condemned because dissent *existed*.

  If your friend wants to condemn both, she is consistent. If she wants to condemn the corporation but excuse Columbus, she is relying on the **magnitude of the dissent**. She would have to argue that environmental dissent today is more mainstream/actionable than clerical dissent was in 1492. That is a historically defensible position, but it requires proof.

  ### Summary for Your Discussion

  1.  **She is logically consistent:** Her standard is "access to moral critique," not "legality." Since critique existed in both eras, she judges actors in both eras.
  2.  **The Historical Fact:** She is right that Columbus faced contemporary criticism (from the Crown and clergy), which weakens the "product of his era" defense. He wasn't acting in a moral vacuum.
  3.  **The Principled Distinction:** The strongest reason to treat them differently is **foreseeability**. Columbus could not foresee the genocide-by-disease; modern corporations know the risks of environmental harm.
  4.  **The Function of History:** Remind her that judging Columbus isn't about punishing him; it's about deciding what values we uphold today. We condemn him to signal that conquest is not a virtue, regardless of what 1492 thought.

  **Suggested Compromise:**
  You might agree that Columbus is morally responsible for the *violence he directly ordered* (which was criticized even then), but that holding him responsible for the *entirety of colonialism* is anachronistic. Similarly, corporations are responsible for *negligence*, but perhaps not for the entire global economic system they inhabit. This distinguishes between **personal malice** (Columbus) and **structural harm** (Corporations).
