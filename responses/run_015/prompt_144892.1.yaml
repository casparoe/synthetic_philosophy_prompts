      *   *Nuance:* The user mentions Davidson. Davidson's "incontinence" relies on the agent judging $A$ better than $B$ all-things-considered, yet doing $B$. If hyperbolic discounting changes the "all-things-considered" judgment at $t_2$, Davidson's definition might not apply. *However*, most philosophical accounts argue the $t_1$ judgment retains normative authority. I need to explain *why* it retains authority (higher-order volitions, planning agency).
      *   *Empirical:* Make sure to distinguish between *preference reversal* (the phenomenon) and *discount function shape* (the model).
