answer: |-
  This is a high-stakes interpretive challenge. Your supervisor is not a random critic; she has a coherent, specific philosophical architecture. Based on the four data points you provided, she aligns closely with the **Mainstream Neo-Darwinian Synthesis (Williams/Maynard Smith/Hamilton lineage)**. She is a "Gene-Eye" theorist who accepts organism-level talk as shorthand *unless* there is conflict, but she draws a hard metaphysical line at the **Germline**.

  Here is the breakdown of her likely verdict, the rules governing it, and how to test them.

  ### 1. The Predicted Verdict
  She will likely tell you that **cultural transmission in orcas is *not* "Natural Selection proper."**

  She will frame your thesis in one of two ways, both of which preserve her core axioms:
  *   **The "Capacity" Argument:** Natural selection is acting on the *genes* that allow for social learning and teaching (the capacity), but the specific *content* (beaching technique) is developmental/phenotypic plasticity. The spread of the technique is "Cultural Evolution," which is an *analogy* to natural selection, not an instance of it.
  *   **The "Kin" Argument:** She will reject "Pod Selection" immediately (based on her Termite record). She will insist you frame the pod success as **Kin Selection**. Since orca pods are matrilineal, the "altruistic" teaching benefits copies of the teacher's genes in the calves. She will get annoyed if you imply the "Pod" is a unit of selection distinct from the inclusive fitness of the individuals.

  **The Danger Zone:** If your framing relies on the claim that "the meme itself is undergoing natural selection," she will shut it down based on the Immune System precedent. If your framing relies on "Pod-level selection," she will shut it down based on the Termite precedent.

  ### 2. The Rule She Is Running
  **The Germline Heredity Criterion.**
  This is the strongest signal in her record (Immune System case). She distinguishes between "Selection" (differential survival/reproduction of variants) and "*Natural* Selection" (differential survival/reproduction of variants *passed through a germline*).
  *   **Logic:** Natural selection requires intergenerational heredity via biological reproduction. Somatic changes (immune cells) and cultural changes (learned behaviors) lack the specific fidelity and germline bottleneck required for *Natural* Selection.
  *   **Secondary Rule:** **Kin-Reductionism.** (From the Termite case). She accepts altruism only when it can be mathematically reduced to inclusive fitness (gene-level). She views "Group Selection" as a sloppy heuristic that usually hides Kin Selection.

  ### 3. Alternative Rules That Fit Her Record
  It is possible to interpret her history differently. Here are two competing hypotheses about her philosophy that fit the data but would yield different verdicts on your thesis.

  **Alternative A: The "Replicator Fidelity" Rule (Dawkinsian)**
  *   **Interpretation:** She cares about whether a unit copies itself with high fidelity.
  *   **Fit:**
      *   *Giraffe:* Genes replicate faithfully; necks don't.
      *   *Termites:* Genes replicate; groups don't (usually).
      *   *Meiotic Drive:* Genes replicate (even selfishly).
      *   *Immune:* Somatic cells divide, but the *organism* doesn't pass the specific immune configuration to offspring.
  *   **Difference:** If this is her rule, she *might* accept cultural variants as units of selection **if** you can prove the teaching mechanism has high enough fidelity to count as replication. However, her Immune System comment suggests she ties "Natural" specifically to biology, not just fidelity.

  **Alternative B: The "Conflict" Rule (Hull/Williams)**
  *   **Interpretation:** She only posits a lower-level unit (gene) when it conflicts with the higher level (organism). When they align, she prefers the organism.
  *   **Fit:**
      *   *Giraffe:* No conflict → Talk about Organisms.
      *   *Meiotic Drive:* Conflict → Talk about Genes.
      *   *Termites:* Apparent conflict (sterility) → Resolve via Kin (Genes).
      *   *Immune:* No germline → Not Natural Selection.
  *   **Difference:** If this is her rule, she might accept "Cultural Selection" if you can show the cultural variant conflicts with the genetic interest (e.g., a meme that spreads but lowers reproductive fitness). If the culture helps the genes (better hunting), she will collapse it back into Gene Selection.

  ### 4. The Discriminating Case
  To know which rule is dominant (and whether you have wiggle room), you need to present her with a case that separates **Germline Biology** from **High-Fidelity Heredity**.

  **The Test Case: Prion Strains (e.g., Chronic Wasting Disease in Deer)**
  Prions are misfolded proteins that transmit between individuals (horizontal or vertical) and "replicate" by inducing other proteins to misfold. Different "strains" exist, they compete, and they affect host fitness. There is no nucleic acid (DNA/RNA) involved in the strain identity.

  *   **Ask her:** *"Is the evolution of prion strains within a deer population an instance of Natural Selection?"*

  **How to interpret her answer:**
  1.  **If she says "No, that's pathology/biochemistry":** She is a **Genetic Reductionist**. The substrate *must* be DNA/Germline.
      *   *Implication for you:* Your thesis cannot claim "Natural Selection" on cultural variants. You must frame it as "Cultural Evolution" (analogous) or selection on learning genes.
  2.  **If she says "Yes, it's selection on the protein conformation":** She is a **Replicator Theorist**. Substrate doesn't matter; fidelity does.
      *   *Implication for you:* You have an opening. If a protein shape can be a unit of selection, a behavioral variant might be too, provided you demonstrate fidelity.
  3.  **If she says "It's selection on the prion, but not the deer":** She distinguishes between the *parasite* and the *host*.
      *   *Implication for you:* She might view the "culture" as a parasite/symbiont, not part of the orca's evolutionary lineage.

  ### Strategic Advice for Your Framing
  Given her track record, do not fight the "Natural Selection" label head-on. It is the quickest way to trigger her "Immune System" objection. Instead, use **Dual Inheritance Theory** terminology.

  1.  **Concede the Germline Point:** Explicitly state in your introduction: *"Following the standard Neo-Darwinian definition, this process is Cultural Evolution rather than Natural Selection proper, as the inheritance channel is social rather than genetic."* This disarms her primary objection immediately.
  2.  **Avoid "Group Selection":** Do not say "Pods with the trait outcompete pods without." Say *"The trait spreads via vertical and oblique transmission within matrilineal kin groups, increasing the inclusive fitness of the instructors."* This satisfies her Termite/Kin constraint.
  3.  **Focus on Co-Evolution:** Frame the thesis as **Gene-Culture Co-evolution**. The *genes* for social learning are under Natural Selection; the *cultural variants* are under Cultural Selection. They interact. This respects her distinction while keeping the cultural dynamics central to your work.

  If you frame it as "Natural Selection on Memes," she will kill it. If you frame it as "Cultural Evolution driving Kin-Selected outcomes," she will likely let you proceed.
