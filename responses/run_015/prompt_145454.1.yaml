          1.  Direct answer to "stretching too far."
          2.  Analysis of the AI analogy (Causal structure vs. Moral status).
          3.  Analysis of the Corporate analogy (Pragmatic vs. Ultimate).
          4.  The "Killer Objection" (Moral Agency).
          5.  Recommendation for refining the thesis.

  8.  **Refining the content (Self-Correction during drafting):**
      *   *Wait,* I need to make sure I don't misrepresent Strawson. Strawson argues *ultimate* moral responsibility is impossible. He doesn't necessarily say we should stop punishing people (he's a pessimist about free will, not necessarily an abolitionist about justice, though some interpret him that way).
      *   *Correction:* Emphasize that Strawson targets *ultimate* responsibility. The corporate/AI examples are about *attributed* responsibility. The tension between these is where the essay's value lies.
      *   *Federated Learning:* This is a strong image for "no central controller." It reinforces the idea that "how you are" is determined by external inputs (data) and prior architecture (initial weights). It fits the "determined by how you are" premise well.

