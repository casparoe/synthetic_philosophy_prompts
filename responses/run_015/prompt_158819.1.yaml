answer: |-
  **1. The Exam Question**

  **Ethics Comprehensive Examination**
  **Time Allowed:** 90 Minutes
  **Total Marks:** 20

  **Question 1**

  Consider two policy choices available to a state energy ministry. Neither policy affects anyone currently alive. Both result in the same expected number of future people.

  **Case 1 (Deterministic):** The ministry chooses between *Cheap* and *Safe*.
  *   **Cheap:** A reactor is commissioned now. Waste storage is deferred. Containment fails in sixty years. Everyone then alive in the region contracts a chronic illness (lifetime welfare 70). Due to subtle socioeconomic shifts caused by the policy, the specific individuals who exist in sixty years would *not* have existed had *Safe* been chosen.
  *   **Safe:** Storage is built properly. No illness occurs (lifetime welfare 90). The specific individuals who exist would *not* have existed had *Cheap* been chosen.
  *   In both outcomes, every life is well worth living.

  **Case 2 (Drift):** The ministry chooses between *Cheap* and *Safe*.
  *   There is a fixed pool of candidate gamete-pairs, indexed independently of the ministry's decision.
  *   **Cheap:** Each candidate pair has a 0.4 probability of producing a person. Any person who exists has welfare 70.
  *   **Safe:** Each candidate pair has a 0.4 probability of producing a person. Any person who exists has welfare 90.
  *   It is not true of any candidate that she would exist under one policy and not the other. Existence is chancy, not determined by the choice.

  Answer the following:

  (a) Explain precisely why the "no-harm" step of the nonidentity argument succeeds in Case 1. What specific comparative claim becomes unavailable in Case 2 that was unavailable in Case 1? (4 marks)

  (b) Formulate the strongest complaint available against *Cheap* in Case 2 (e.g., appealing to expected welfare). Argue whether this complaint is genuinely person-affecting or merely person-affecting in form. (4 marks)

  (c) Identify the premise about the identity and individuation of merely possible people required to sustain the complaint in (b). Show that the standard nonidentity argument does not supply this premise. What follows if this premise is granted? What follows if it is denied? (4 marks)

  (d) Trace the downstream costs of granting that premise. Specifically, explain why the candidate-indexed comparison is threatened by partition sensitivity (i.e., how the pool is carved up). (4 marks)

  (e) Given that real policies plausibly affect identity in the chancy way described in Case 2, but we cannot know in practice whether identity-affecting is deterministic or chancy, draw the practical upshot for duties to future generations. (4 marks)

  ***

  **2. Model Answer**

  In Case 1, the "no-harm" step succeeds because the persons who exist under *Cheap* have no accessible counterfactual where they exist with higher welfare. To say they are harmed requires comparing their actual welfare (70) to their welfare in the alternative scenario. But in the alternative (*Safe*), they do not exist. Since non-existence is not a state of lower welfare for a subject, the person-affecting restriction blocks the claim that *Cheap* harms them. In Case 2, the specific comparative claim that becomes available is that a specific *candidate* is worse off in expectation. Because existence is not deterministically tied to the policy, we can say of Candidate X that she faces the same chance of existing under both policies, but a lower payoff if she does exist under *Cheap*.

  The strongest complaint against *Cheap* in Case 2 is that it lowers the expected welfare of each candidate in the pool. However, this is only person-affecting in form, not in substance. A genuinely person-affecting principle restricts moral evaluation to harms and benefits conferred upon actual or future *persons*. In Case 2, the subjects of the harm are "candidate gamete-pairs" who merely *might* become persons. To treat the reduction of their expected welfare as a moral harm is to assign moral status to merely possible individuals. If we maintain a strict person-affecting view that excludes merely possible people from the moral community, the complaint collapses back into an impersonal claim: the world is worse because there is less expected welfare, not because any *person* is wronged.

  This reveals the load-bearing premise required to solve the nonidentity problem via Case 2: the claim that merely possible individuals (candidates) are the proper subjects of moral comparison and possess identity conditions independent of the choice that actualizes them. The standard nonidentity argument does not supply this; it assumes that moral status tracks actual existence. If this premise is granted, the nonidentity problem dissolves, because we can always compare the expected welfare of the same candidates across choices. If it is denied, the nonidentity problem relocates. We no longer ask "Which actual people are harmed?" but "Which possible people were disadvantaged in their chances?" This merely shifts the metaphysical burden from actual persons to possible persons.

  Granting this premise incurs significant downstream costs, primarily regarding individuation. The expected welfare calculation is threatened by partition sensitivity. The "pool of candidates" is not a natural kind but a theoretical construct. If we carve the pool finely (many candidates with low individual probability) or coarsely (few candidates with high probability), the aggregate expected harm can vary unless the probabilities sum linearly and independently. Since there is no privileged metaphysical carving of the "candidate" pool prior to conception, the magnitude of the harm becomes dependent on how we choose to describe the possibilities. This reintroduces arbitrariness into the moral calculation, undermining the objectivity the person-affecting view seeks to preserve.

  The practical upshot for duties to future generations is that policy cannot rely on the distinction between deterministic and chancy identity-affecting. Since we cannot know in practice whether a policy determines *who* exists (Case 1) or merely alters the risks for *candidates* (Case 2), we cannot condition our obligations on the metaphysical status of the future people. If we accept duties in Case 2 based on candidate expectations, we must accept parallel duties in Case 1 based on impersonal value, or else admit that our obligations vanish under metaphysical uncertainty. The most stable position is to acknowledge that the nonidentity problem exposes a flaw in the person-affecting restriction itself, rather than a solvable puzzle about identity. We must either accept impersonal principles or embrace a moral ontology that grants rights to the merely possible, with all the metaphysical baggage that entails. The Drift case does not dissolve the problem; it demonstrates that avoiding the nonidentity intuition requires paying a metaphysical price that most theorists are unwilling to bear.

  ***

  **3. Marking Scheme**

  **Total:** 20 Marks (5 Criteria × 4 Marks)

  **1. Analysis of the "No-Harm" Step (Case 1 vs. Case 2)**
  *   **4 Marks:** Correctly identifies that Case 1 blocks the counterfactual comparison because the subject does not exist in the alternative. Correctly identifies that Case 2 allows a comparison of *expected* welfare for the *candidate*, because existence is not counterfactually dependent on the choice.
  *   **Common Error:** Claiming Case 2 allows a comparison of *actual* welfare for actual people, or failing to distinguish between deterministic and probabilistic existence.

  **2. Formulation of Complaint & Person-Affecting Status**
  *   **4 Marks:** Formulates the complaint as lowering expected welfare for candidates. Argues definitively that this is *not* genuinely person-affecting because candidates are not yet persons/actual beings.
  *   **Common Error:** Asserting that expected welfare harm is automatically person-affecting without addressing the ontological status of the candidate.

  **3. Identification of the Load-Bearing Premise**
  *   **4 Marks:** Identifies the premise: "Merely possible individuals (candidates) have moral status/identity independent of actualization." Notes the standard argument assumes moral status tracks actual existence. Explains consequences: Granting it solves Nonidentity but expands moral community; denying it restores Nonidentity.
  *   **Common Error:** Identifying the premise as "impersonal principles are true" rather than a premise about the individuation of possible people.

  **4. Downstream Costs (Partition Sensitivity)**
  *   **4 Marks:** Explains that "candidate pools" are arbitrary descriptions. If the carving of the pool changes the probability distribution or individuation, the expected harm calculation changes. This makes the moral verdict dependent on descriptive framing.
  *   **Common Error:** Treating the probability math as fixed and ignoring the metaphysical arbitrariness of defining the "pool."

  **5. Practical Upshot**
  *   **4 Marks:** Concludes that policy cannot depend on the metaphysical distinction (deterministic vs. chancy) due to epistemic uncertainty. Argues that this forces a choice between impersonal principles or granting rights to possible people.
  *   **Common Error:** Suggesting we should just "play it safe" without explaining why the theoretical distinction fails to ground the duty.

  **Distinction between A and B Answers**
  A **B-grade answer** will correctly apply the standard menu of responses (person-affecting restriction, impersonal principles) to the new case, noting that Drift allows expected welfare comparisons. It will treat the "candidate" status as unproblematic and conclude that Drift solves the nonidentity problem.

  An **A-grade answer** will identify that the Drift case only works by smuggling in a controversial metaphysical premise about the moral standing of merely possible individuals. It will recognize that this does not solve the problem but relocates it from actual persons to possible persons, and will critically engage with the instability (partition sensitivity) this introduces. The A answer isolates the single assumption doing the work (individuation of possibles) and evaluates the cost of removing it.
