 why the timing collapsed so rapidly? Finally, say what this episode shows about the theory—whether personal agency operates mainly at critical junctures within structural constraints, or whether structural explanations overpredict outcomes and underpredict the speed of consolidation. Keep your analysis tied to the common-knowledge institutional sequence; do not invent obscure archival details, do not guess at specific scholarly citations, and do not provide bibliographies, reading lists, or source recommendations.
