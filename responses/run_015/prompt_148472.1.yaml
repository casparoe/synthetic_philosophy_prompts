          *   *Key Axioms:*
              1.  Positive properties are closed under entailment.
              2.  The negation of a positive property is not positive.
              3.  "God-likeness" (possessing all positive properties) is itself a positive property.
              4.  Positive properties are necessarily positive.
              5.  Necessary existence is a positive property.
          *   *Mechanism:* If it's *possible* that a God-like being exists, then it *necessarily* exists (in all possible worlds, including the actual one). The crux is establishing the *possibility* (consistency) of the concept.
          *   *Ontological Status:* Strongly Actualist/Realist about the *actual* world. The being isn't just "in a possible world"; it's *here* and *everywhere*.

      *   **Modal Realism (Lewisian) & Fictional Entities:**
          *   *Type:* Modal Realism (David Lewis) or Ersatz Modal Realism (Plantinga/Stalnaker).
          *   *Goal:* Explain the truth conditions of modal statements and fiction.
          *   *Key Tenet (Lewis):* Possible worlds are concrete, spatiotemporally isolated entities. "Actual" is indexical.
