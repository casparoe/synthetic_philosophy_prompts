      *   *Intrinsic vs. Instrumental:* Moore is famous for the "naturalistic fallacy" and defining "good" as simple, non-natural, and *intrinsic*. He does talk about instrumental goods (means to ends), but the "greatest goods" are usually intrinsic. The summary says "instrumental." That's a red flag.
      *   *Organic Unities:* Moore's principle is that the value of a whole is *not necessarily* equal to the sum of the values of its parts. It *can* be greater, but it can also be less, or the parts might have no value on their own. It is *not* a rule that the whole is *always strictly greater*.
      *   *Consciousness/Psychologism:* Moore is a realist about value. Good is a non-natural property. However, the *things* that possess intrinsic value are usually states of consciousness (pleasure, appreciation of beauty, personal affection). A beautiful object *in itself* (unobserved) has little to no intrinsic value for Moore. The value lies in the *conscious appreciation* of the beauty.
      *   *Friendship/Affection:* Moore ranks "the pleasures of human intercourse" (personal affection) and "the appreciation of beautiful objects" as the highest intrinsic goods.
