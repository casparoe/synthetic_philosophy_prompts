      *   *Sentence 2:* "organic unity rule... always strictly greater."
          *   *Correction:* The Principle of Organic Unities says the value of a whole is *not necessarily* identical to the sum of its parts. It doesn't say it's *always greater*. Sometimes a part is neutral alone but valuable in a whole. Sometimes a part is good alone but bad in a whole (e.g., pleasure in cruelty). "Always strictly greater" is a distortion.
