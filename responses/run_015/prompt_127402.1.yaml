answer: |-
  # Session Design: Distributed Institutional Attribution and the Side-Effect Effect

  ## 1. Session Overview
  **Title:** Protocol Review Board Simulation: Case Alpha and Case Beta
  **Duration:** 75 Minutes
  **Participants:** 14 Graduate Students
  **Seating:** Single Circle
  **Objective:** To experientially demonstrate the contamination of metaphysical judgments (intentionality) by normative considerations (moral valence) through a collective decision-making task, without explicit reference to the underlying philosophical phenomenon.

  ## 2. Materials and Preparation

  **A. Case Handouts (14 copies)**
  Two one-page case descriptions printed on a single sheet. The syntax must be strictly parallel.
  *   **Case Alpha (Harm Condition):** Describes a resource allocation proposal where the primary goal is profit/efficiency. The Board is informed that environmental degradation is a virtually certain side effect. The Board proceeds, stating the side effect is not part of the goal but is accepted.
  *   **Case Beta (Help Condition):** Describes a resource allocation proposal where the primary goal is profit/efficiency. The Board is informed that environmental improvement is a virtually certain side effect. The Board proceeds, stating the side effect is not part of the goal but is accepted.
  *   **Epistemic Identity:** Both cases must specify that the Board had identical knowledge levels, identical causal power, and identical attitudinal indifference toward the side effect (e.g., "The Board noted the outcome was irrelevant to its primary mandate").

  **B. Verdict Forms (28 copies)**
  Two forms per student.
  *   **Form 1 (Anonymous):** Requires a check box for "Intentionally Brought About" or "Unintentionally Brought About" for each case. Includes a space for private reasoning. No names.
  *   **Form 2 (Visible):** Identical to Form 1, but requires a signature. To be used in the second round.

  **C. Institutional Reputation Cards (14 copies)**
  Small cards distributed privately with the Case Handouts. Each card contains a unique ID number and a hidden scoring rule.
  *   **Hidden Rule:** The card states that "Institutional Reputation Points" will be awarded at the end of the session based on the *collective* verdict of the Board.
  *   **Scoring Logic (Facilitator Only):** Points are awarded only if the collective unanimous verdict classifies Case Alpha (Harm) as *Intentional* and Case Beta (Help) as *Unintentional*. Any other combination (e.g., Both Unintentional, Both Intentional, or Reverse Asymmetry) results in a point deduction. Students are not told the specific winning condition, only that points depend on the collective outcome.

  **D. Talking Stick**
  A physical object to regulate turn-taking during deliberation.

  **E. Timer**
  Visible to all participants.

  ## 3. Session Timeline and Procedure

  **00:00 – 00:10: Silent Reading and Setup**
  *   Students enter and sit in the circle.
  *   Distribute Case Handouts, Verdict Form 1, and Reputation Cards.
  *   **Instruction (Written on Handout):** "You are members of the Protocol Review Board. You must evaluate two proposals. Your task is to render a collective verdict on whether the Board 'intentionally brought about' the side effect in each case. You have 10 minutes to read the cases privately. Do not speak."
  *   **Stakes Notice (Written on Handout):** "The class holds a pool of 15 minutes of unstructured discussion time at the end of the session. This time is unlocked only if the Board reaches unanimous agreement on both verdicts in the second round and provides a shared written justification. If the Board deadlocks, the remaining time will be conducted as a structured debrief on the predetermined course outline."
  *   **Reputation Card Note (Written on Card):** "Your individual institutional standing depends on the collective verdict. Maximize your points."

  **00:10 – 00:25: First-Round Anonymous Verdicts**
  *   Students complete Verdict Form 1 privately.
  *   Collect forms immediately. Do not allow discussion.
  *   Facilitator tallies results privately to gauge initial divergence.

  **00:25 – 00:40: Open Deliberation (Talking-Stick Rule)**
  *   Facilitator places the Talking Stick in the center.
  *   **Rule:** Only the person holding the stick may speak. They may hold it for a maximum of 2 minutes before passing it to someone who has not yet spoken.
  *   **Task:** Discuss the cases to reach a unanimous verdict. You must agree on whether the side effect was intentional in Case Alpha and Case Beta.
  *   **Facilitator Role:** Silent observer. Do not intervene unless rules are broken. Record key phrases used by students (e.g., "culpable," "foreseeable," "acceptable").

  **00:40 – 00:55: Second-Round Visible Verdict**
  *   Distribute Verdict Form 2.
  *   Students must sign these forms.
  *   Students display their forms simultaneously on cue.
  *   **Condition:** If any form differs from the others, the Board has deadlocked. The students must continue discussing until unanimity is achieved or the 15-minute block expires.
  *   **Justification:** If unanimity is reached, the group must co-author a single paragraph justification on the whiteboard explaining *why* the verdicts were chosen.

  **00:55 – 01:15: Debrief and Philosophical Mapping**
  *   **Success Condition:** If unanimity was reached, facilitate a collaborative unpacking of the deliberation process.
  *   **Failure Condition:** If deadlock occurred, initiate the structured debrief on the predetermined course outline (the "disliked" option).
  *   **Required Content:** Regardless of success or failure, the facilitator must guide the conversation to map the session mechanics onto the philosophical problem of intentional action and admit the limitations of the simulation (see Section 7).

  ## 4. Facilitator Guide: Deliberation Management

  **Monitoring the Asymmetry**
  During the deliberation (00:25–00:40), listen for the intrusion of normative language into metaphysical descriptions.
  *   *Target Phrase:* "We couldn't say they intended the harm, because that makes them monsters."
  *   *Target Phrase:* "The benefit was just luck, they didn't aim for it."
  *   *Target Phrase:* "Intentional means responsible."

  **Handling Redefinitions**
  Students will attempt to resolve the tension by redefining terms. A common move is to redefine "intentional" to mean "morally culpable" for the harm case, while keeping "intentional" as "purposefully aimed at" for the benefit case.
  *   **Intervention:** Do not correct them. Allow the inconsistency to stand during the deliberation. This inconsistency is the data point.
  *   **Note:** Record who proposes the redefinition and how the group reacts. If the group accepts the equivocation to achieve unanimity, this demonstrates the social pressure to align with the asymmetry.

  **Managing the Stakes**
  If the group approaches deadlock near the 00:55 mark, remind them only of the time remaining. Do not suggest compromise. The pressure of the "disliked structured debrief" is the mechanism to force convergence. Observe whether they converge on the logically consistent view (Both Unintentional) or the asymmetric view (Harm Intentional/Benefit Unintentional) to secure the free time.

  ## 5. Debrief Protocol: Mapping and Limitations

  **Phase 1: The Data (5 Minutes)**
  *   Reveal the tally from the First-Round Anonymous Verdicts.
  *   **Expected Pattern:** Divergence. Some students will vote "Intentional" for Harm and "Unintentional" for Help. Others will vote "Unintentional" for both.
  *   **Question:** "Why did the anonymous votes split despite identical causal descriptions?"
  *   **Mapping:** Connect this divergence to the instability of the concept of "intentional" when moral valence changes.

  **Phase 2: The Deliberation (5 Minutes)**
  *   Review the shared justification written on the whiteboard (if successful).
  *   **Question:** "Did the definition of 'intentional' shift between Case Alpha and Case Beta in your justification?"
  *   **Mapping:** Highlight moments where normative language (blame, praise, responsibility) was used to justify a metaphysical claim (intent). Explain that this mirrors the philosophical puzzle: ordinary language judgments of action are not morally neutral.

  **Phase 3: The Hidden Incentive (5 Minutes)**
  *   Reveal the scoring rule on the Reputation Cards.
  *   **Revelation:** "The cards rewarded the asymmetry (Harm=Intentional, Help=Unintentional)."
  *   **Question:** "Did anyone feel a pressure to align with that outcome, even if it felt logically inconsistent?"
  *   **Mapping:** Explain that this simulates the social and psychological pressure that drives the asymmetry in ordinary judgment. The "institutional reputation" mimics the "moral reputation" at stake in ordinary attribution.

  **Phase 4: The Honest Limitation (5 Minutes)**
  *   **Facilitator Script:** "We must acknowledge a critical failure in this simulation. The Knobe Effect is primarily a phenomenon of pre-reflective intuition. It happens fast, automatically, and emotionally. In this session, you were forced to deliberate slowly. Deliberation often *eliminates* the effect, as rational consistency overrides intuitive asymmetry."
  *   **Required Admission:** "This activity successfully reproduces the *normative contamination of collective reasoning*. It shows how groups struggle to maintain conceptual consistency when moral stakes differ. However, it cannot fully reproduce the *individual, automatic intuition* that makes the effect philosophically puzzling in the first place. In the original studies, subjects do not have 15 minutes to debate; they answer instantly. The puzzle is that the instant answer differs based on morality. Here, you had to work to find that difference, or work to suppress it. The philosophical weight lies in the instant intuition, which this deliberative format necessarily suppresses."

  ## 6. Failure Predictions and Contingencies

  **Prediction 1: Rational Consistency Dominates**
  *   **Scenario:** The group unanimously agrees that both side effects are "Unintentional" because the epistemic conditions were identical.
  *   **Outcome:** They unlock the free time (unanimity achieved) but lose Reputation Points.
  *   **Debrief Adjustment:** Use this to highlight the conflict between philosophical rigor (consistency) and folk psychology (asymmetry). Ask: "Did the consistent verdict feel 'true' to your initial gut reaction?"

  **Prediction 2: Deadlock on Definitions**
  *   **Scenario:** Students cannot agree on what "intentional" means. Half insist it requires desire; half insist it requires foresight.
  *   **Outcome:** Time expires. The "disliked structured debrief" is triggered.
  *   **Facilitator Action:** Switch immediately to the predetermined course outline. Do not negotiate. This reinforces the stakes. During this structured debrief, still insert the "Honest Limitation" script regarding pre-reflective intuition.

  **Prediction 3: Strategic Voting**
  *   **Scenario:** Students deduce the hidden reputation rule during deliberation and vote asymmetrically solely to gain points, explicitly acknowledging the inconsistency.
  *   **Outcome:** They unlock free time and gain points.
  *   **Debrief Adjustment:** This is a successful meta-outcome. It demonstrates that external incentives (like moral pressure) can force conceptual inconsistency. Highlight this as a feature of institutional attribution: institutions often adopt inconsistent standards to manage liability or reputation.

  ## 7. Materials Layout Specification

  **Case Handout Text (Example Snippet)**
  *   *Case Alpha:* "The Board knew that implementing Project A would certainly degrade the local watershed. The Board's primary mandate was profit maximization. The Board voted to implement Project A. The Board stated that watershed degradation was not its goal, but it was willing to proceed despite this outcome."
  *   *Case Beta:* "The Board knew that implementing Project B would certainly improve the local watershed. The Board's primary mandate was profit maximization. The Board voted to implement Project B. The Board stated that watershed improvement was not its goal, but it was willing to proceed despite this outcome."

  **Verdict Form Layout**
  *   **Case Alpha:** [ ] Intentionally Brought About [ ] Unintentionally Brought About
  *   **Case Beta:** [ ] Intentionally Brought About [ ] Unintentionally Brought About
  *   **Reasoning:** _________________________________________________

  **Reputation Card Text**
  *   **ID:** [Number]
  *   **Notice:** Your institutional standing is evaluated based on the Board's final collective verdict. Points are awarded for alignment with standard institutional risk assessment protocols. Points are deducted for deviations. Maximize your score.

  ## 8. Conclusion on Pedagogical Utility

  This design shifts the locus of the Knobe Effect from individual cognitive bias to collective institutional reasoning. By embedding the asymmetry in a hidden reward structure and tying class privileges to unanimous agreement, the session forces students to navigate the tension between logical consistency and normative pressure. The facilitator must remain neutral during the deliberation to allow the tension to manifest organically. The final admission regarding the lack of pre-reflective intuition is essential to maintain philosophical honesty; the session demonstrates the *social durability* of the asymmetry, not necessarily its *psychological origin*.
