answer: |-
  ### Policy Analysis Through the Welfare Leakage Lens

  **The Framework:** Welfare leakage posits that jurisdictional welfare regulations increase production costs or restrict supply, causing demand to migrate to unregulated sectors where welfare standards are lower, thereby increasing or maintaining total suffering despite local improvements.

  **1. The Swiss Ban (2018)**
  *   **Mechanism:** Direct prohibition on boiling live lobsters and transport on ice; mandatory stunning.
  *   **Leakage Vector:** High. Switzerland imports nearly 100% of its seafood. Compliance requires specific stunning technology and training for importers.
  *   **Prediction:** Importers may drop live lobster lines due to compliance costs. Consumers seeking lobster switch to frozen tails (often wild-caught, unstunned, slow death via thawing/cooking) or shift to shrimp (where wild-caught bycatch is high).
  *   **Reality:** Live lobster imports dipped initially, but processed/frozen imports remained stable. The regulation targeted *method of killing*, not *volume*. Leakage occurs if the frozen alternative involves slower death times than the regulated stunning method.

  **2. The UK Sentience Law (2022)**
  *   **Mechanism:** Legal recognition of decapods/octopuses as sentient beings, enabling future welfare regulations (transport, killing).
  *   **Leakage Vector:** Medium/Deferred. Currently a framework rather than a hard constraint, but signals future compliance costs for farms.
  *   **Prediction:** Farm operators anticipate stricter rules on stocking density or slaughter. Wild fishers (exempt from many farm welfare codes) become a relatively cheaper source of protein.
  *   **Reality:** Too early for hard data, but procurement strategies are already shifting toward "wild-caught" labeling as a premium natural alternative, potentially masking welfare deficits.

  ### Actor Mapping & Predicted Behavior

  | Actor | Welfare Leakage Prediction | Observed/Likely Response |
  | :--- | :--- | :--- |
  | **Farm Operators** | Face higher CAPEX (stunning tech) and OPEX (training). Margins compress. | Some exit market; others pass costs to retailers. Supply tightens. |
  | **Wild Fishers** | Unregulated on welfare (usually). Benefit from relative cost advantage. | Increase effort to fill supply gaps. Bycatch remains uncounted suffering. |
  | **Supermarkets** | Need volume continuity. Will not shrink shelf space if demand is inelastic. | Source from wild fisheries if farmed supply is constrained. Labeling emphasizes "wild" over "welfare." |
  | **Regulators** | Focus on jurisdictional compliance, not global suffering totals. | Blind to extra-territorial substitution effects. Claim victory on local welfare metrics. |
  | **Consumers** | Price-sensitive but habit-driven. | If farmed prices rise, switch to wild or pay premium. Rarely reduce consumption. |

  ### Real-World Response: Confirmation or Break?

  You noted that wild shrimp imports ticked up after farm rules tightened, yet demand remains inelastic (consumers pay more rather than eat less).

  **Does this confirm leakage?**
  Yes, but with a specific nuance. Carbon leakage relies on *volume* shifting to lax jurisdictions. Welfare leakage here relies on *intensity* shifting to lax methods.
  *   **Inelastic Demand:** This is the engine of leakage. If demand were elastic, regulation would reduce consumption, reducing total suffering. Because demand is inelastic, the market *must* find the protein elsewhere.
  *   **The Shift:** If farm supply contracts due to compliance costs, and wild imports tick up to fill the gap, the *location* of harm shifts.
  *   **The Intensity Factor:** The theory holds only if wild-caught welfare is worse than regulated farm welfare. Evidence suggests wild crustaceans often die via slow asphyxiation in ice slurs or are boiled unstunned, whereas regulated farms require electrical stunning. Therefore, shifting units from Farm (Score 5) to Wild (Score 10) increases total suffering even if volume is flat.

  **Where it might break:**
  The theory breaks if the "wild" alternative is actually humane (e.g., specific trap fisheries with immediate killing) or if the farm regulations were so lax that the shift doesn't change the suffering score. However, given the bycatch externalities of wild shrimp trawling (non-target suffering), the net welfare debt likely increases.

  ### Where the Theory Goes Silent

  **The Moral Outsourcing Question:**
  Welfare leakage is a utilitarian metric (total suffering). It goes silent on deontological or political ethics.
  *   **Jurisdictional Responsibility:** A regulator might argue they are only responsible for harm they directly authorize. Regulating local farms cleans their own hands, even if global suffering rises.
  *   **Norm Setting:** Proponents argue strict local laws set a precedent that eventually globalizes standards (the "California Effect"). Leakage might be a short-term cost for long-term norm diffusion.
  *   **The Silence:** The theory cannot tell you if it is better to have "clean hands/high global suffering" vs. "dirty hands/managed global suffering." It identifies the inefficiency, not the moral culpability of the regulator.

  Bottom line: Welfare leakage survives this episode because inelastic demand ensures that supply constraints merely shift suffering to unregulated wild catch rather than reducing it.
