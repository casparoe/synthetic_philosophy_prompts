answer: |-
  ### 1. Exam Question

  **Course:** PHI 450: Advanced Practical Ethics
  **Time Allowed:** 90 Minutes
  **Weight:** 40% of Final Grade

  **Prompt:**

  Peter Singer's "drowning child" argument is frequently interpreted as establishing a principle of marginal utility: one ought to prevent bad occurrences unless doing so requires sacrificing something of comparable moral significance. Standard exegesis focuses on the irrelevance of spatial proximity or the scope of global poverty. For this essay, disregard those standard applications. Instead, analyze the *structural architecture* of the rescue duty implied by Singer's principle.

  Specifically, investigate whether Singer's framework treats rescue obligations as **continuously scalable** (where a $5,000 obligation is structurally identical to a $100 obligation, differing only in magnitude) or as **binary/threshold-based** (where a duty activates only upon meeting specific conditions of certainty or proximity, then potentially collapses).

  Apply this distinction to the following probabilistic variant: You encounter a child drowning, but the rescue mechanism available to you (e.g., a remote drone intervention) has only a **60% success rate**. The cost to you is identical to the standard shallow-pond case.

  1.  Does the intuition that you *must* act survive when modeled as an expected-value decision under risk?
  2.  If the intuition weakens, does this undermine Singer's claim that obligation scales linearly with cost/benefit, or does it reveal a psychological bias incompatible with rationalist ethics?
  3.  Defend either the **Scalar** or **Binary** model of rescue duties. Your defense must include one concrete counterexample demonstrating why the opposing model leads to absurdity or inconsistency in this probabilistic context.

  *Note: Essays that merely rehearse the shallow-pond analogy, argue about physical proximity, or conclude with standard effective-altruism donation recommendations without addressing the structural scalability question will not receive a passing grade.*

  ***

  ### 2. Model Answer

  **Title:** The Continuity of Obligation: Expected Value and the Structure of Rescue

  Singer's principle is typically read as a substantive claim about what we owe the distant needy. However, its deeper philosophical commitment is structural: it assumes a continuous function relating cost to obligation. This "Scalar Model" posits that moral demand increases linearly with the probability and magnitude of the benefit, minus the agent's cost. The competing "Binary Model" suggests duties are all-or-nothing; one is either obligated to save a life or not, with no intermediate moral state. The probabilistic variant of the drowning child case tests which structure accurately maps moral reality.

  In the standard case, success is near-certain. In the 60% variant, the expected value (EV) of the intervention is 0.6 lives saved. If we accept the Scalar Model, the obligation should scale proportionally: we are obligated to incur up to 60% of the cost we would incur for a certainty. If we hold the Binary Model, we might argue that because the outcome is not guaranteed, the strict duty to rescue does not trigger, or conversely, that any non-zero chance of saving a life triggers the full binary duty.

  When modeled as an expected-value decision, the intuition that we *must* act often weakens among non-utilitarians, who cite the risk of failure as excusing inaction. However, from a rationalist perspective, this weakening reveals a psychological bias rather than a moral truth. If we accept that saving 0.6 lives is morally preferable to saving 0, consistency demands we treat the obligation as scalable. To deny this is to privilege certainty over value, which is irrational when stakes are high. If I can save 0.6 lives for $100, or 1 life for $10,000, the Binary Model struggles to explain why the latter might be mandatory while the former is optional, despite the efficiency difference.

  Therefore, the Scalar Model is superior. It aligns with the marginal utility principle: sacrifice is required until the moral significance of the cost equals the expected moral significance of the benefit. The Binary Model fails because it cannot handle aggregation. Consider a **Counterexample**: Suppose an agent faces two independent rescue opportunities, each with a 60% success rate and low cost. The Binary Model might claim neither triggers a duty individually because neither guarantees a save. Yet, collectively, the expected value is 1.2 lives. If the agent refuses both based on the binary threshold, they allow an expected loss greater than one certain life. This is inconsistent. The Scalar Model avoids this by assigning partial obligation to each act, summing to a total duty commensurate with the total expected value.

  Consequently, the probabilistic case reinforces Singer's scalability claim. The hesitation to act on 60% probability is not evidence of a binary threshold in moral duty, but evidence of risk-aversion masquerading as deontological constraint. Rationalist ethics requires maximizing expected value. If obligation is tied to the prevention of bad occurrences, and probability modulates the likelihood of that prevention, then obligation must modulate with probability. To treat duty as binary is to ignore the mathematical reality of risk. Thus, Singer's framework should be interpreted as asserting a continuous, scalable obligation where the "strength" of the duty fluctuates with the expected utility of the intervention, rather than a switch that flips only under conditions of certainty.

  ***

  ### 3. Marking Scheme (Total: 25 Points)

  **Grade Bands:**
  *   **A (21–25 pts):** Executes all three required moves (Continuity Analysis, Probabilistic/EV Analysis, Defended Position with Counterexample). Demonstrates sophisticated grasp of the structural distinction.
  *   **B (16–20 pts):** Accurate summary of Singer and the probabilistic case, but fails to engage deeply with the *structural* critique (Scalar vs. Binary) or offers an undefended position.
  *   **C (11–15 pts):** Rehearses standard proximity/EA arguments (violating the negative constraint) or misunderstands the probabilistic variant.
  *   **F (0–10 pts):** Fundamental misunderstanding of Singer's principle or incomplete.

  **Component Breakdown:**
  1.  **Identification of Continuity Assumption (5 pts):** Clearly articulates the difference between Singer's implied linear/scalar obligation and a threshold/binary duty.
  2.  **Probabilistic/EV Analysis (5 pts):** Correctly applies expected value reasoning to the 60% case and evaluates whether the intuition survives.
  3.  **Defended Position & Counterexample (5 pts):** Takes a clear stand (Scalar or Binary) and provides a concrete counterexample showing why the opposing view fails (e.g., the aggregation problem).
  4.  **Clarity and Argumentative Flow (5 pts):** Essay is coherent, precise, and adheres to the prompt's constraints.
  5.  **Specific Conceptual Penalty (-5 pts):** Deduct 5 points if the student **confuses risk-weighted expected value with linear obligation scaling**. (e.g., arguing that because the risk is 60%, the cost obligation must be exactly 60% of the maximum, without accounting for marginal utility of money or diminishing returns). *Note: This error indicates a failure to distinguish mathematical probability from moral weighting.*

  **Examiner Notes:**
  *   An **A** answer must explicitly forbid the "proximity doesn't matter" trope and focus entirely on the *architecture* of the duty.
  *   To earn full points on the **Counterexample** section, the example must demonstrate an inconsistency in the opposing model (e.g., aggregation failure in the Binary model or demandingness failure in the Scalar model).
  *   The **Conceptual Penalty** is mandatory. If a student treats EV as a direct 1:1 map to financial obligation without nuance, apply the deduction even if the essay is otherwise strong.
