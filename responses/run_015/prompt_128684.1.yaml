  I am applying for my school’s six-week summer philosophy programme and need a concise, formal research proposal. My topic is standing to blame in cases of hypocrisy, but I want to avoid the well-worn claim that hypocrites simply forfeit all moral authority. I propose distinguishing “participatory standing” — being embedded within the normative practice that a wrong breaches — from “representational standing” — being positioned to speak on behalf of those directly wronged. The precise question is whether hypocrisy undermines the former without affecting the latter, and whether this explains why institutional figures (for instance, a teacher who herself plagiarises, or a parent who lies) can retain a certain kind of authority to blame despite feeling morally objectionable.

  Please structure the proposal with: a sharply stated research question; an explanation of why current philosophical treatments of hypocrisy and standing leave this particular gap open; my proposed comparative method, which examines paired institutional cases rather than relying solely on abstract intuition pumps, and why that approach is preferable to the obvious alternatives; a description of what success would look like (a clear criterion predicting when hypocrisy erodes participatory but not representational standing) together with what failure would look like (the distinction collapses or fails to illuminate the cases); and an honest scope assessment for a sixth-form student working independently over six weeks without external archives. I shall add all references myself, so please do not include a bibliography, citation list, or suggested reading.
