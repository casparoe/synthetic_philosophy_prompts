  **Conflict:** Players with broken streams argue they are not the same entity that incurred the debt. Players with tokens argue survival requires payment. Society wins if a Person dies early (collecting "Closure Points"). This creates a coordination trap: maintaining the conventional "Self" requires individual sacrifice, yet without the "Self," there is no reward.
  Tokens represent physiological and psychological coherence. "Form" tokens degrade via injury/age; "Consciousness" tokens degrade via memory loss. The Event Deck ensures gradual change, not sudden swaps. For example, a "Midlife Crisis" card forces Formations to discard tokens unless Feeling cooperates.
  Society's role is critical: they do not care about internal stream stability, only external continuity. They issue debts based on the Person's name, not the aggregates' state. This forces the Life-Stream to lie about their unity. They must vote unanimously to accept the debt to survive. If even one aggregate vetoes payment, the Person dissolves.
  This mechanic ensures that survival depends on a fragile coalition of independent processes. The incentive scheme pits biological honesty (admitting a stream is broken) against pragmatic survival (pretending unity exists). Students will feel the pressure to designate a "Self" simply to secure the Legacy Points, mirroring how language and law impose identity onto flux.

  3. Session Timeline
  **0-10 min:** Introduction. Explain rules without mentioning Buddhism or anattā. Distribute roles and tokens. Ensure materials are pre-sorted to save time. Use a visible timer.
  **10-15 min:** Practice Round. Run one decade to clarify token loss and accountability.
  **15-60 min:** Main Game. Five rounds (Decades 20-60). Each round takes 8 minutes: 3 min for Event Card effects, 5 min for Accountability negotiation. Facilitator tracks time strictly.
  **60-75 min:** Debrief. Stop play immediately. Transition to discussion connecting mechanics to philosophical concepts.
  **Timing Note:** Ensure Society remains active during negotiation phases to maintain pressure. If a Life-Stream dissolves early, those players join Society to increase pressure on the remaining group. This keeps engagement high even for eliminated participants.

  4. The Debrief: Mapping Play to Anattā
  Begin by asking: "Who is responsible for the debt?" Students will cite the "Person." Reveal that the "Person" was never a player, only a label for the group. Map the token depletion to *paramattha-sacca* (ultimate truth): ultimately, only the shifting aggregates exist. When "Form" lost tokens due to aging, the biological substrate changed. When "Consciousness" lost tokens due to memory loss, the psychological link broke. Analytically, no single entity persisted from Round 1 to Round 5.

  Then map the survival mechanic to *sammuti-sacca* (conventional truth). To claim the Legacy Points, the group had to speak as "We." They had to designate a continuous agent to satisfy Society's demands. This mirrors how language and law function: they require a stable subject to operate, even if biology denies one. The tension they felt—wanting to deny responsibility based on stream fragmentation versus needing to accept it to win—is the exact pressure of *anattā*.

  Conclude by noting that the "Self" is not denied as a experience, but as an owner. The game showed them acting as a self without being a self. The suffering arose not from the token loss, but from the effort to maintain the fiction of unity against the reality of flux. This experiential gap is the entry point for understanding no-self. Ask the "Form" player: "Did you feel responsible for debts incurred when your cells were different?" Ask "Consciousness": "If you forgot the action, why pay?" Their hesitation reveals the lack of intrinsic ownership. The "Society" players should confirm they didn't care about internal changes, only the label. This highlights that identity is inter-subjective, not intra-subjective.
  Finally, connect the "Legacy Points" to the concept of karma without the soul. Actions have consequences that flow through the causal stream, regardless of whether a "self" claims them. The game demonstrates that continuity is causal, not substantial. The participants successfully navigated a life without a captain, proving that function does not require a fixed owner. This shifts the debate from "Do I exist?" to "How does this designation function?"

  5. Predictable Failures and Facilitator Remedies
  **Failure 1:** Dominant Voices. One student may dictate the group's decision, reifying a "CEO self."
  **Remedy:** Enforce secret voting on Accountability payments. If votes differ, tokens are lost automatically.
  **Failure 2:** Trivialization. Students may laugh at the "broken streams."
  **Remedy:** Frame the tokens as "Health/Sanity." Make the loss feel costly by linking it to the Group Prize.
  **Failure 3:** Early Dissolution. If a group dies in Round 2, engagement drops.
  **Remedy:** As noted in the timeline, dissolved players join Society. Give them veto power on Society decisions to keep them invested in the remaining group's struggle. This turns elimination into a role shift rather than exit. Facilitator must remain neutral, refusing to answer "Are we the same person?" with anything but "What do the rules say?" This forces them to rely on the mechanics, not the facilitator's authority.

  6. Honest Limitation
  The activity inevitably reifies the aggregates by assigning them to distinct players. In actual *anattā*, the skandhas themselves are empty; there is no "Form" entity, only forming. By giving "Form" a player, we suggest a sub-self exists, which contradicts the ultimate emptiness of all phenomena. The game creates a pluralistic self (five selves) rather than no-self.

  Furthermore, the game relies on external incentives (points) to simulate the stakes of existence. Real suffering (*dukkha*) arises from internal clinging, not point loss. The facilitator must explicitly state that the tokens are metaphors. The feeling of "I want to win" during the game is the only authentic *dukkha* present; the rest is simulation. The facilitator must supply the insight that even the "winner" of the game is empty. The mechanics show the *problem* of identity, but not the *release* from it.
