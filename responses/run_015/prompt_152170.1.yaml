      *   Agent-regret acknowledges one's role as the causal conduit, regardless of fault. It affirms moral sensitivity without accepting unjust culpability.
      *   The lack of control over character traits doesn't negate the experience of agency in the moment.
      *   Therefore, the regret is not irrational residue but a rational affirmation of moral commitment.

