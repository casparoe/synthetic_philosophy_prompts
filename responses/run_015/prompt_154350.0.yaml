  1. Phenomena and Cases to Capture

  To count as explanatory, the theory must account for specific phenomenological boundaries regarding variation. First, it must explain why inverting a central relation (e.g., changing a protagonist to an antagonist while preserving structural role) registers as a creative transformation rather than a category mistake. The motivating consideration is that creativity often relies on structural preservation despite surface reversal; a mere description would label this "different," but an explanation must show how the underlying schema remains intact. Second, it must model inter-knob interference, where simultaneous adjustment of dimensions (e.g., scale and material) yields emergent properties absent in isolated shifts. This addresses the non-linearity of aesthetic impact, where the whole exceeds the sum of parameter slides. If the theory treats dimensions as independent, it fails to capture synergistic creativity where the interaction itself generates the value. Third, it must define the limits of thematic identity across extreme parameter shifts. Without a mechanism to preserve core invariants, the theory collapses into vague family-resemblance, unable to distinguish a radical variation from a completely different theme. This is crucial for distinguishing plagiarism (too close) from noise (too far). Additionally, the theory must address the temporal dimension of recognition. A variation might be initially perceived as an error before being reclassified as creative upon deeper structural analysis. Finally, the theory must handle the distinction between undirected mutation and purposeful variation. Random sliding produces garbage; creative sliding follows implicit constraints. The theory must explain what guides the hand turning the knobs, ensuring the output is recognized as coherent within the domain's rules rather than random error. These cases demand a model balancing structural rigidity with flexible manipulation, explaining the recognition of meaningful novelty within a structured conceptual space.

  2. Non-Negotiable Constraints

  The theory must satisfy three hard constraints. First, it must provide a principled boundary between destructive slippage and productive variation. It cannot simply assert that some changes are good; it must define the structural conditions under which a variation remains intelligible within the theme's logic. Second, it must account for the compositionality of conceptual structure without requiring full atomic decomposition. Concepts are structured wholes, not mere bags of features, yet breaking them down entirely destroys the gestalt required for thematic recognition. Third, it must explain why some parameter combinations yield coherence while others yield nonsense. This requires a metric of semantic or aesthetic compatibility between dimensions.

  A critical tension exists between the first and second constraints. Demanding a principled boundary for productive variation often requires rigid structural rules to prevent nonsense. However, accounting for compositionality without atomic decomposition implies a degree of holism where boundaries are fluid. If the structure is too rigid to ensure coherence, it cannot support the flexible recombination required for genuine creativity. If it is too holistic to allow decomposition, it cannot specify which parameters are adjustable without breaking the theme. This pair is jointly unsatisfiable given the logic of analogical mapping, which requires both stable correspondences and flexible transfers. An adequate theory must therefore propose a dynamic stability mechanism rather than static rules, allowing the boundary of validity to shift based on the specific configuration of the knobs themselves.

  3. Negotiable Preferences and Camp Divides

  Several demands reflect specific theoretical camps rather than universal necessities. First, the model need not explain sudden insight as discrete knob-locking; some frameworks prefer gradual drift where creativity emerges from continuous sliding rather than phase shifts. Second, architectural realization is negotiable; the theory need not be realizable in a distributed connectionist architecture, though such compatibility is preferred by empiricists over symbolic cognitivists. Third, the scope of generation is debatable: must the model generate entirely new themes, or is it sufficient to explain variations on an initially supplied one? Transformational creativity argues for the former, exploratory for the latter. Finally, the treatment of negative adjustments is divisive. Whether turning a knob to suppress a defining feature is a special subclass of operation or continuous with other slides depends on whether negation is viewed as a logical operator or a dimensional value. These preferences dictate the implementation details but do not invalidate the core explanatory power regarding parameterized variation.

  4. Brief Contender Assessment

  Hofstadter's original knob-twiddling formulation excels at capturing thematic identity and structural invariants, satisfying the need to distinguish variation from category mistakes. However, it struggles to provide a principled boundary for productive variation, often relying on intuitive notions of "depth" rather than formal constraints. Boden's exploratory and transformational framework successfully distinguishes between searching a space and altering its rules, addressing the coherence versus nonsense constraint. Yet, it lacks a mechanistic account of parameter interaction, failing to model inter-knob interference adequately. Modern latent-space generative models offer a robust mechanism for continuous variation and simultaneous dimension adjustment, capturing emergent structure well. However, they frequently violate the constraint on thematic identity; sliding too far in latent space produces nonsense or collapses into vague family-resemblance without preserving core conceptual invariants. They explain mutation better than meaningful variation, often failing to distinguish error from creativity without human filtering. Ultimately, Hofstadter captures the logic but lacks the math; latent models have the math but lack the logic; Boden provides the taxonomy but not the mechanism. Each approach captures a facet of the desiderata but fails to integrate them into a unified explanatory system. None fully satisfy the non-negotiable constraint of balancing structural rigidity with flexible recombination without external guidance.
