  | :--- | :--- | :--- | :--- |
  | **The Sealed Envelope** | Conditions for refutation written in 1798. | Would allow for "unforeseen technological shifts." | Would require "permanent stagnation" without exception. |
  | **Shape-and-Timing** | Burden to predict the century/nature of escape. | Reject burden; theory describes the trap, not the exit. | Accept burden; missing the exit timing falsifies the trap's permanence. |

  **Verbal Disputes:**
  We flag "theory" (logical model vs. historical narrative) and "prediction" (logical entailment vs. specific forecast) as doing unargued work. Our analogies (Wegener/phlogiston) were illustrative only and not foundational. Empirical estimates on wage elasticity are marked disputed and do not settle the logical dispute.
