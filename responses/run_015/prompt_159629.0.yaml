  **Agreed Claims:**
  1. Malthus asserted population growth inevitably presses against subsistence via positive and preventive checks.
  2. Pre-industrial records broadly show real wages stagnating despite population fluctuations.
  3. The Industrial Revolution constitutes a permanent decoupling of wages from population pressure.
  4. A mechanism-level reading treats the theory as conditional logic; an epoch-level reading treats it as a historical timeline.
  5. "Prediction" is disputed: either a forecast of perpetuity or a model entailment absent unspecified exogenous shocks; we agree Malthus did not specify the shock's arrival date.
  6. The "Sealed Envelope" device is valid only if the conditions inside were non-trivially falsifiable using 1798 information.
  7. The "Shape-and-Timing Clause" imposes a burden neither side originally accepted; we agree accepting it would falsify the Malthusian view, while rejecting it preserves the domain-restriction defense.

  **Residual Disagreement:**
  *   **Malthusian:** The mechanism governed human history for 10,000 years; a 200-year anomaly caused by an unforeseen innovation doesn't erase the prior constraint.
  *   **Falsificationist:** A rule that holds "until it doesn't" without defining the exception isn't a rule; it's a description of the past disguised as a law.

  **Cruxes:**
