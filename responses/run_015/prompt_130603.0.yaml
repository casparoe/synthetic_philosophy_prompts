      *   *Aristotle's Specific Move:* Aristotle doesn't necessarily deny bivalence for *all* future statements, but for *contingent* ones. Is weather contingent? Yes. Is landing success contingent? Yes.
      *   *The "Gap":* The gap isn't between logic and physics, it's between *truth* and *causation*. A proposition can be true without being *causally determined* yet (if one accepts ontological openness). Or, one can argue the proposition lacks a truth value.
