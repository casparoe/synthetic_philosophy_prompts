answer: |-
  The Careenium is indeed one of the most fertile thought experiments in the philosophy of mind, precisely because it captures the tension between *ontological reduction* (what exists at the bottom) and *explanatory utility* (what we need to make sense of the world). Your friend's term, "simmball primitivism," is a evocative label for a position often called *strong emergentism* or *non-reductive causal realism*.

  Here is an analysis of how the Careenium maps onto your two cases (the courtroom and the engineering lab), addressing the specific questions of causal power, underdetermination, and the consequences of a strict microphysical stance.

  ### 1. The Courtroom: Reasons vs. Neurons

  **Does the practice presuppose downward causal power?**
  Strictly speaking, no. The legal and moral practice of citing reasons presupposes *causal efficacy* at the high level, but not necessarily *ontological independence* or "downward" power that violates physical laws.

  When we say the defendant acted *because* he wanted the money, we are identifying a stable pattern (a simmball) that reliably predicts the motion of the substrate (the simms). We do not need to claim that the "desire" is a ghostly force that pushes neurons against the laws of physics. We only need to claim that the pattern of desire *is realized by* the neurons in such a way that tracking the pattern is more efficient than tracking the particles.

  **Can Non-Reductive Physicalism (NRP) and Reductionism license this?**
  Yes, both can license the practice, though they interpret the "why" differently.

  *   **The Reductionist:** Argues that "believing he would not be caught" *just is* a specific neural state. Citing the reason is a convenient shorthand (a *façon de parler*) for a complex microphysical description. The reductionist accepts the practice as *epistemically* necessary (we can't process neural data in court) but denies it is *ontologically* distinct. For them, simmballs never push simms; simmballs *are* simms moving in a pattern, and we describe the pattern as pushing for convenience.
  *   **The Non-Reductive Physicalist:** Argues that high-level states are *multiply realizable*. The same "belief" could be realized in different neural configurations or even in silicon. Therefore, the causal generalization holds at the level of reasons, not just neurons. They argue that causation is *level-relative*. Simmballs push simmballs, and this is just as "real" as simms pushing simms, provided the physical substrate is closed. They avoid "spooky" downward causation by insisting the high-level causation supervenes on the low-level.
  *   **Simmball Primitivism:** This view (as your friend defines it) would claim that the symbolic level is *more* fundamental or causally potent than the substrate. In a courtroom, this would imply that the "reason" exists independently of the brain state and constrains it. This is the hardest view to defend physically, as it risks violating the causal closure of the physical domain (i.e., if the physical is fully determined by physical laws, there is no room for a "symbol" to intervene).

  **Where is the practice underdetermined?**
  The practice is underdetermined regarding *ontology*. A verdict of "guilty by reason of intent" is compatible with the defendant being a Careenium where only simms exist, *and* with a Careenium where simmballs have emergent causal powers. The law cares about *predictability* and *rational intelligibility*, not metaphysical grounding. As long as the "reason" reliably correlates with the action, the metaphysics of the causation remains invisible to the procedure.

  ### 2. The Engineering Case: Symbolic Specs vs. Numerical Parameters

  This case is subtly different from the human mind because the "symbols" (English principles) are introduced *externally* by designers, whereas in the mind, reasons are internal states.

  **What does the practice presuppose about causal power?**
  When engineers say a system was "shaped by high-level principles," they are describing a *teleological* (goal-directed) constraint, not a mechanical force.
  *   **The Mechanism:** The high-level English principle is compiled into a loss function or a reward signal (numbers). These numbers interact with other numbers (weights/parameters) via gradient descent.
  *   **The Presupposition:** The language presupposes that *information* has causal leverage. It assumes that the semantic content of the principle successfully constrains the search space of the parameters.

  **Is the high-level specification strictly presupposed to have causal power?**
  No. A thoroughgoing reductionist can describe the entire process as "numbers changing numbers." The English principle is merely a human-readable label for a mathematical constraint. However, to say it is *merely* shorthand misses the point of *abstraction*. The engineering practice presupposes that the *mapping* between the symbol and the parameters is stable. If the symbol "Do not be toxic" maps to a chaotic, unstable set of parameters, the practice fails. Thus, the practice presupposes *structural stability* at the high level, not necessarily independent causal power.

  **Where is this underdetermined?**
  It is underdetermined between **Instrumentalism** and **Realism**.
  *   **Instrumentalist (Reductionist):** The principles are just tools for us to tune the knobs. The system doesn't "know" the principles; it just minimizes error.
  *   **Realist (Simmball Primitivism):** The system actually instantiates the principle as an internal governing rule that actively suppresses lower-level tendencies.
  *   **The Middle Ground (NRP):** The principle is realized in the weights. The causation is physical, but the *explanation* requires the semantic level because the weights are unintelligible without it.

  Most engineers operate in the Middle Ground. They talk like Primitivists ("The model learned honesty") but build like Reductionists (tuning floating-point numbers). This works because the *interface* between the levels is robust.

  ### 3. What if we switched to a Strict Microphysical Story?

  If we rigorously adopted the view that "only simms push simms" and banned simmball language in explanation, responsibility, and engineering, the consequences would be pragmatic paralysis.

  **In Human Action and Responsibility:**
  *   **Explanation:** We would lose the ability to explain behavior. Describing a theft in terms of quark movements is computationally intractable and explanatorily vacuous. It provides no *leverage* for prediction.
  *   **Responsibility:** The concept of responsibility would evaporate. Responsibility requires an *agent*—a persistent, high-level pattern (a simmball) that can be reasoned with, deterred, or reformed. If there are only simms, there is no "who" to hold responsible, only a cascade of physical events. The legal system would have to shift from *retributive/deterrent* models to purely *quarantine/maintenance* models (like fixing a broken bridge), which fundamentally alters our social fabric.

  **In Engineering:**
  *   **Design:** We could not design complex systems. We cannot tune trillions of parameters individually (simms); we must tune them via high-level objectives (simmballs).
  *   **Evaluation:** We could not evaluate safety. If we cannot say "The system is honest," but only "The system's weights are in configuration X," we lose the ability to generalize about the system's behavior in novel situations.
  *   **Feedback:** The loop described in your prompt (using English principles to adjust numbers) would break. The engineers would have no language to formulate the adjustment criteria.

  ### 4. Synthesis: The Status of the Simmball

  The Careenium reveals that "causation" is not a single thing. It is a relationship that depends on the *grain* of description.

  1.  **Causal Closure:** Physics likely demands that the "simms" (physical substrate) are causally closed. There is no energy entering the Careenium from the "symbol realm." In this sense, the Reductionist is right: only simms push simms.
  2.  **Causal Exclusion:** However, Jaegwon Kim's "causal exclusion argument" (if the physical does all the work, the mental does none) fails if we view high-level causation as *realization-sensitive*. The simmball pushes the simmball *by virtue of* the simms pushing the simms. The high-level story is not a competitor to the low-level story; it is a *compression* of it.
  3.  **Simmball Primitivism:** Your friend's term identifies a real risk in AI and cognitive science: *reification*. When we say "The model wants to be helpful," we risk forgetting that "wanting" is a pattern of weights, not a homunculus. If engineers believe the simmballs have *magic* power (independent of the substrate), they will fail to debug the system when the substrate drifts (e.g., distributional shift).

  **Conclusion**
  The practice of citing reasons (in law) or principles (in engineering) does not require "simmball primitivism" in the strong metaphysical sense. It requires **functional realism**. We must treat the patterns as real *for the purposes of interaction*, even if they are physically reducible.

  If we replaced the implicit theory with a strict microphysical story, we would not change the physics, but we would destroy the *interface* required to live in the world. We are, ourselves, Careeniums. We cannot interact with each other as clouds of simms; we can only interact as simmballs. Therefore, while "only simms push simms" may be the metaphysical truth, "simmballs push simmballs" is the pragmatic truth. To deny the latter is not to be more scientific; it is to make science, law, and engineering impossible. The "push" of the symbol is the push of the *constraint*, and in a universe of complex systems, constraints are the only things that matter.
