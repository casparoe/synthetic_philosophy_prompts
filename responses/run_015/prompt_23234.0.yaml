  7.  **Final Polish:** (Writing the dialogue based on these thoughts.) *Self-correction: Make sure the distinction between "law" and "impact" is sharp. The All-Subjected person needs to argue that law creates a specific kind of obligation that mere causality doesn't.*

  **(Drafting the Content...)**
  *   *Intro:* Establish the setting. Late night, coffee.
  *   *Alex (AAIP):* Focus on the fishers. Their livelihood is destroyed.
