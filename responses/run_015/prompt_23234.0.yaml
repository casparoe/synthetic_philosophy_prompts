answer: |-
  **Setting:** *A university coffee shop, 10:30 PM. The table is covered in printouts. Alex (defending All-Affected) is stirring a cold latte. Jamie (defending All-Subjected) is leaning back, rubbing their temples.*

  **Alex:** Okay, let's look at the fishing case again. Because honestly, if the All-Subjected Principle doesn't break here, I don't know where it breaks. State A closes the banks. State B and C fishers lose their livelihoods. They aren't citizens of A. They don't vote in A. But their economic survival is tied to a decision made in A's parliament. If democracy means anything, it means you shouldn't have your life chances determined by a power you can't check.

  **Jamie:** I agree with the moral intuition. It *sucks* for them. But democracy isn't just a moral sentiment; it's a system of collective self-rule. For me to have a right to a vote, I have to be part of the "self" that is ruling. If I'm not subject to the legal order of State A, I'm not part of that self. I'm an external party. You're conflating "being harmed by" with "being governed by."

  **Alex:** But that distinction is getting porous. You say they aren't subject to State A's laws? Really? If those fishers want to sell their catch from the *other* grounds, they often have to dock at State A's ports. State A inspects their gear, checks their visas, enforces sanitary regulations. The moment State A passes this fishing ban, it triggers a whole regulatory apparatus that *does* reach across the border. The coercion isn't just the ban; it's the enforcement infrastructure that surrounds it.

  **Jamie:** That's a category error. Sure, if State A arrests a foreign fisher for violating port safety, *that* fisher is now subject to coercion and deserves due process. But the legislative decision to close the zone? That applies to State A's own vessels. The fact that foreign boats *can't go there anymore* is a physical consequence, not a legal command. It's like if I build a fence on my property and block your view of the sunset. You're affected. But you aren't subject to my property rules.

  **Alex:** The fence analogy fails because the ocean isn't your property. It's a commons. But let's grant the fence. The issue is the "explosive objection" you guys always raise. You say if we go with All-Affected, then everyone affected by climate change gets to vote in every election, and the demos becomes the whole world, which makes decision-making impossible.

  **Jamie:** Exactly. It dissolves the unit of analysis. If the demos is determined *by* the decision, you never actually get to make the decision. You need a pre-existing demos to vote on the boundary. It's an infinite regress.

  **Alex:** I'm not arguing for "everyone slightly affected." I'm arguing for *vital interests*. There's a threshold. If a policy destroys your livelihood, you're in. If it just makes your sunset slightly less pretty, you're out. We can draw a line.

  **Jamie:** Who draws the line, Alex? That's the question. If you say "the people affected decide who is affected," you're begging the question. If you say "the current demos decides," then you're back to the All-Subjected principle, because you're letting the existing legal order define the scope. If State A's parliament decides the foreign fishers' interests aren't "vital" enough to warrant inclusion, what recourse do the fishers have? Under your view, the very body causing the harm gets to decide if the harm counts.

  **Alex:** *[Pauses]* Okay, that's the tyranny worry. I get it. But under your view, State A *knows* they can harm the neighbors with impunity. That creates a perverse incentive. If I don't have to count your interests, I'm going to externalize all my costs onto you. Pollution, resource depletion, economic dumping. The All-Subjected principle essentially licenses democratic states to be ruthless to outsiders. It creates a moral blind spot the size of an ocean.

  **Jamie:** It's not a moral blind spot; it's a jurisdictional boundary. We handle those externalities through international law, treaties, human rights regimes—not by expanding the *demos* of every nation-state until it snaps. If State B's fishers are being crushed, State B should negotiate with State A. Or they should take it to an international tribunal. That's the proper channel for cross-border conflict. Voting rights are for insiders.

  **Alex:** But what if State B is weaker? What if the international tribunal is toothless? We're talking about democratic legitimacy here, not just conflict resolution. If State A claims to be a democracy, it claims to treat all persons as equals. But it's saying, "We treat equals equally only if they fall within this arbitrary geographic line." And now you're telling me that line is hardened by the fact that State A controls the ports? That feels like bootstrapping. "You don't get a vote because we haven't let you into the club, and we won't let you into the club because you don't have a vote."

  **Jamie:** It's not arbitrary if it's based on the reciprocal enforcement of law. I obey State A's laws; State A protects my rights. That reciprocity is the glue. The foreign fishers don't obey State A's fishing laws—they can't, because they aren't allowed to fish there. They obey State B's laws. The problem is that the *impact* of State A's law leaks. I admit that. But fixing the leak by giving them a vote in State A's election assumes that State A is the only agent capable of fixing the problem. Maybe the solution is State B subsidizing their fishers? Or a joint management treaty?

  **Alex:** Maybe. But those solutions require State A to acknowledge the claim. And why would they, if the voters in State A don't have to count the fishers' voices? Here's where I feel the spiral, Jamie. If I stick with All-Affected, I can't define the boundary without making the election unmanageable. But if I stick with All-Subjected, I'm saying a group of people can be systematically dominated by a foreign power as long as that power doesn't issue them a tax form.

  **Jamie:** *[Leans forward]* Look, try this on for size. The "All-Subjected" principle isn't about ignoring harm. It's about *agency*. To be a voter is to be a co-author of the law. If you are a co-author, you share responsibility for the outcome. If State A's voters close the banks, they own that decision. If we give the foreign fishers a vote, and they vote to keep it open, and they lose... are they now responsible for the closure? Are they subject to the enforcement? If State A's coast guard catches them, can they say, "Well, I voted against this, so I'm not bound"?

  **Alex:** No, they're bound because they are physically present in the zone.

  **Jamie:** Exactly! So they *are* subject to the coercion in that moment. So, maybe they get a vote *on that specific enforcement regime*? This is where I start to wobble. Some of my colleagues argue for "stakeholder citizenship" or functional demoi. Maybe for fishing policy, the demos includes the fishers. But for tax policy, it doesn't.

  **Alex:** Okay, now you're sounding like me. Functional boundaries. Issue-specific demoi.

  **Jamie:** I'm trying to avoid the "global demos" nightmare. If every issue has a different demos, how do we maintain a stable polity? We need a group that sticks together over time to deliberate, to compromise, to build trust. If the electorate changes completely depending on whether we're voting on fishing or zoning or trade, there's no "we" left. There's just a shifting aggregate of interests.

  **Alex:** But is that "we" just a protection racket? "We stick together so we can exploit the resources without asking the neighbors." I know the All-Affected principle risks instability. But the All-Subjected principle risks injustice. In this fishing case, the "we" is defined by a coastline that cuts through a fish stock. The fish don't know they're in State A's waters until they're caught.

  **Jamie:** And the voters know that if they open the borders to every affected person, they lose the capacity to act at all. It's the paralysis objection. But... *[trails off]* ...I suppose the paralysis might be the point. If State A's decision has massive external costs, maybe they *should* be paralyzed until they negotiate. Maybe the inability to decide unilaterally is a feature, not a bug.

  **Alex:** So you'd accept a veto power for the affected neighbors?

  **Jamie:** No, that's not voting. That's a treaty requirement. See? I keep sliding back to international law. Because the moment I admit they need a say, I'm admitting they are subjects of a higher authority that binds both states.

  **Alex:** And I keep sliding back to the fact that there *is* no higher authority. There's just State A with a navy and State B with a grievance. If democracy is the only legitimate source of power, and State A's power is crushing State B's people, then State A's democracy is defective. It's missing a piece of the puzzle.

  **Jamie:** So we're back to the spiral. If I include them, I dissolve the state. If I exclude them, I legitimize domination.

  **Alex:** Basically. In this specific case, the "affected" are clearly identifiable. It's not the butterfly effect. It's two specific communities. If we can't include them, what are we actually defending? Is it democracy, or is it just the sovereignty of the existing border?

  **Jamie:** I think... I think I'm defending the precondition for democracy to function at all. A boundary has to exist before you can count votes. Even if that boundary is morally imperfect. But looking at these fishers... I don't know. Maybe the boundary *should* move. Maybe the demos should be regional.

  **Alex:** And if it's regional, then we're using the All-Affected principle to draw the map.

  **Jamie:** *[Sighs]* Don't tell the professor I said that.

  **Alex:** I won't. But buy me a coffee. I think we just proved the problem isn't solvable, it's just manageable.

  **Jamie:** Deal. But I'm still not letting the fishers vote on my tuition hike.

  **Alex:** Depends. Does it affect their catch prices?

  **Jamie:** Get out.
