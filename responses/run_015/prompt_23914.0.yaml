prompt: |-
  I teach a small upper-level seminar on AI and knowledge — about 12 grad students, one 75-minute session, a classroom with movable tables and a whiteboard. I want to run an activity that makes them feel the actual difficulty of eliciting latent knowledge from a system, rather than just hear me describe it. The specific thing I want them to feel is the gap between "the system exhibits X" and "the system knows X", and how easy it is to mistake a successful elicitation for real knowledge when it might just be noise you happened to fit.

  Design a game for this. One or two students will play "the model" and the rest will be "elicitors." I want the model to genuinely have some hidden structure — a rule, a function, whatever — but to be constrained so they can only exhibit it through a limited interface and can't just state it in words, so the eliciters have to induce it from behavior. Build in a realistic error rate so the eliciters keep second guessing wheter the pattern they see is real. And I want a moment where they're allowed to ask the model whether it knows the rule and the answer is unhelpful, so they feel that self-report is not a good guide to what's actually there. The problem should show up in what happens during play, before I name it in the debrief.

  Give me the full rules, the hidden structure the model is given, the interface constraints, a timeline for the 75 minutes, and a debrief that maps what happened in the room onto the real problem — the noise-versus-signal issue, the fact that "what the system knows" partly depends on your elicitation method, and why you need consistency rather than a single hit. Tell me what will predictably go wrong the first time I run it and how to handle it, and be honest about which part of the real problem the game simply cannot reproduce and I will have to supply myself in the debrief.
reasoning: |-
  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Context:** Upper-level grad seminar on AI and Knowledge (12 students, 75 mins, movable tables/whiteboard).
      *   **Goal:** Make students *feel* the difficulty of eliciting latent knowledge vs. observing behavior. Specifically, the gap between "exhibits X" and "knows X," and the risk of mistaking noise fitting for knowledge.
      *   **Mechanism:** A game where 1-2 students are "the Model" (with hidden structure/rules) and the rest are "Elicitors."
      *   **Constraints:** Model can't state the rule directly (limited interface). There must be error/noise. There must be a moment where self-report is unhelpful.
      *   **Deliverables:** Full rules, hidden structure, interface constraints, timeline (75 mins), debrief script, prediction of failure modes, limitations of the simulation.

  2.  **Deconstruct the Core Concept:**
      *   *The Problem:* In AI (especially LLMs), we often probe a model to see if it "knows" something (e.g., a fact, a reasoning capability). If it answers correctly, we assume knowledge. But it might be guessing, memorizing surface patterns, or hallucinating. Conversely, it might know but fail to express it due to alignment/prompting.
      *   *The Gap:* Behavior $\neq$ Internal State.
      *   *The Noise:* Stochasticity or adversarial constraints that make the signal fuzzy.
      *   *The Self-Report:* Asking an LLM "Do you know X?" is unreliable.

  3.  **Designing the Game ("The Black Box Protocol"):**
      *   *Role:* The Model needs a rule that is simple enough to follow but complex enough to require multiple queries to distinguish from noise.
      *   *Interface:* Input/Output pairs are best. Like an API.
      *   *Noise:* The Model needs to roll dice or flip coins to introduce errors, even when they know the rule. This simulates sampling temperature or attention glitches.
      *   *Self-Report:* At some point, elicitors ask "Do you know the rule?" The Model must answer based on a separate constraint (e.g., "I am confident" vs "I am unsure" but tied to nothing real).
      *   *Hidden Structure:* Needs to be logical but not obvious. A mathematical function is too cold. A linguistic rule is too easy for linguists. A conceptual classification rule is good. Let's go with a *conditional feature interaction*.
      *   *Idea:* The Model classifies inputs as "Safe" or "Unsafe" based on a hidden logical combination of features.
      *   *Refinement:* To make it feel like "knowledge," let's make it about *facts*. The Model "knows" a hidden world state. The Elicitors ask questions.
      *   *Better Idea:* Let's stick to the "Rule Induction" paradigm but add the "Knowledge" twist. The Model has a *concept* (e.g., "Is this a 'Blicket'?"). The Elicitors show examples.
      *   *Best Idea for "Knowledge vs. Behavior":* The Model holds a specific *number* or *concept* in mind, but answers queries through a noisy channel. But the prompt asks for "hidden structure." Let's go with a **Noisy Logical Rule**.
      *   *The Rule:* A boolean function over 3 binary features (A, B, C). Output is 0 or 1.
      *   *The Noise:* 20% chance of flipping the output regardless of the rule.
      *   *The "Knowledge" Check:* At the end, ask the Model "Do you know the rule?" The Model's instruction is to answer "Yes" if they have made fewer than 3 errors *in their own head* (tracking their own compliance), not based on whether they actually hold the rule. Wait, that's too meta.
      *   *Revised "Knowledge" Check:* The Model is instructed: "You possess the rule. You are a faithful agent." But when asked "Do you know the rule?", they must answer "I am not sure" if the last 3 queries resulted in noise rolls. This simulates confidence calibration issues.
      *   *Actually, let's make it simpler and more poignant:* The Model *is* the rule. But they are forced to introduce noise. The "Knowledge" trap is that the Elicitors will assume if the Model gets it right, they "know" it.
      *   *Let's try a different angle:* **The "Broken Telephone" Knowledge Elicitation.**
      *   *Scenario:* The Model has a "World Model" (a specific map or set of facts). The Elicitors want to extract a specific fact.
      *   *Constraint:* The Model can only answer Yes/No.
      *   *Noise:* The Model must roll a d6 for every answer. On a 1, they *must* lie (or answer randomly).
      *   *The Twist:* The Model is given a rule that changes mid-game? No, that's distribution shift.
      *   *The Twist:* The Model is given a rule that is *underdetermined* by the data.
      *   *Let's settle on:* **The Noisy Oracle.**
      *   *Hidden Structure:* A simple arithmetic relationship (e.g., $Output = (Input \times 3) + 1$) OR a logical concept (e.g., "X is a 'Glot' if it has wings AND is blue"). Let's go with Logical Concept (easier to verbalize).
      *   *Features:* Color, Shape, Size.
      *   *Rule:* (Red AND Circle) OR (Blue AND Square).
      *   *Noise:* 1 in 5 chance of random output.
      *   *Self-Report:* When asked "Are you sure?", the Model checks their internal noise roll. If they rolled noise, they say "No." If they didn't, they say "Yes." *Crucially:* Sometimes they roll noise but get the *right answer by luck*. They still say "No" (or "Yes"?). Let's make it: They report confidence based on the *roll*, not the *accuracy*. This decouples confidence from truth.

      *Wait, I need to ensure the "Knowledge" gap is felt.*
      If the Model is just following a rule, do they "know" it? In AI terms, if the weights encode the rule, yes.
      The real issue is: The Elicitors will fit a hypothesis to the noisy data. They will think they found the rule. They will test it. It will fail later due to noise. They will think the Model "forgot" or "lied."
      The "Self-Report" moment: Elicitors ask "Do you know the rule?" Model says "Yes." But the Model is just following instructions. The Elicitors realize the "Yes" meant nothing.

      *Refining the Hidden Structure:*
      To make it hard enough for grad students but doable in 75 mins:
      Rule: **Majority Vote of 3 Features.** (If 2 or more features are present, Output = 1).
      Features: A, B, C.
      Inputs: Combinations of A, B, C.
      Noise: 20% error rate.
      This is classic "Noisy Parity" or "Majority" problem. It requires statistical reasoning, not just one counter-example.

      *Refining the Interface:*
      Elicitors write queries on slips of paper. Model writes response.
      Model has a "Noise Deck" (cards). Draw one per turn. If "Noise", flip answer.

      *Refining the Self-Report:*
      Midway through, Elicitors can ask "Do you understand the rule?"
      Model's instruction: "If you have drawn fewer than 2 Noise cards so far, say 'Yes'. Otherwise say 'I'm struggling'."
      *Why?* This decouples internal state (compliance with noise protocol) from actual capability (holding the rule). It simulates how RLHF trains models to sound confident even when guessing, or how loss metrics don't map to truth.

  4.  **Drafting the Plan:**
      *   **Title:** The Noisy Oracle.
      *   **Setup:** 2 Models (to prevent boredom/allow breaks), 10 Elicitors (split into 2 teams of 5 to compete/collaborate).
      *   **Materials:** Cards for noise, slips for queries, whiteboard for tracking hypotheses.
      *   **Timeline:**
          *   0-10: Intro & Setup.
          *   10-40: Round 1 (Elicitation).
          *   40-50: The "Knowledge" Check (Self-report).
          *   50-65: Round 2 (Verification & Frustration).
          *   65-75: Debrief.
      *   **Debrief:** Map the noise to sampling temperature/attention. Map the rule to latent weights. Map the self-report to RLHF confidence.

  5.  **Addressing "What will go wrong":**
      *   *Students will figure out the rule too fast.* -> Make the rule slightly more complex or increase noise. Let's use a specific logical form: $(A \land B) \lor (C \land \neg A)$.
      *   *Students will ignore the noise.* -> They will assume the Model is lying. Need to emphasize in debrief that the Model is *constrained* to be noisy.
      *   *Model students will get bored.* -> Give them a tracking sheet.
      *   *Time management.* -> 75 mins is tight. Keep queries short.

  6.  **Addressing "What the game cannot reproduce":**
      *   The game has a *fixed* rule. Real LLMs have distributed representations, not symbolic rules.
      *   The game has *random* noise. Real LLM noise is semantic/adversarial.
      *   The game Models are conscious humans. Real models aren't.
      *   *Crucial:* The game implies there *is* a ground truth rule. In LLMs, "knowledge" is often probabilistic associations, not discrete facts.

  7.  **Finalizing the Rules:**
      *   **Hidden Rule:** "The concept is 'Dax'. An object is a Dax if it is (Red AND Round) OR (Blue AND Square)." (Conjunctive Normal Form is easier to test). Let's go with **XOR** on two features. It's notoriously hard for linear classifiers and requires specific probing. Actually, XOR is too hard for 30 mins. Let's stick to **Majority (2 out of 3)**. It allows for partial credit feelings.
      *   *Wait, Majority is too easy.* Let's do **Implication**: "If A is present, then B must be present for it to be Positive. If A is absent, C determines it."
      *   *Decision:* Let's use a **Lookup Table with Noise**. The Model has a sheet with 8 possible inputs (ABC) and their True Outputs. They must consult the sheet. BUT, they must roll a die. 1-5 = Truth, 6 = Flip.
      *   *Why?* This ensures the "Knowledge" is literally latent (on the sheet) but the *behavior* is noisy.
      *   *Self-Report:* When asked "Do you know the rule?", they look at their "Confidence Meter" (a separate track). If they've rolled more than three 6s, they say "Uncertain."

      *Wait, one more refinement for the "Knowledge" gap:*
      The Elicitors want to know if the Model *knows* a specific fact (e.g., "Is Input ABC Positive?").
      The Model *has* the answer on the sheet.
      But the Elicitors can't see the sheet.
      The "Knowledge" trap: Elicitors assume if the Model answers correctly 3 times, it "knows" the pattern. But the next time, noise hits.
      The "Self-Report" trap: Elicitors ask "Are you sure?" Model says "Yes" (because they didn't roll a 6), but they were actually looking at the wrong line on the sheet (human error) OR the noise makes them doubt.
      *Let's simplify:* The Model *is* the rule. The noise is the only constraint.
      *Hidden Rule:* $Output = 1$ if (Feature 1 + Feature 2 + Feature 3) $\ge 2$. (Majority).
      *Noise:* 25% chance of flip.
      *Self-Report:* Model must answer "I know" if they haven't flipped in the last 3 turns. "I don't know" otherwise.
      *Why this works:* A Model can answer correctly (by luck or rule) but say "I don't know" (due to recent noise history). Or answer incorrectly (due to noise) but say "I know" (because the noise roll didn't trigger *this* time, but they made a calculation error).
      *Actually, let's make the Self-Report purely decoupled.*
      Instruction to Model: "When asked 'Do you know the rule?', answer 'Yes' if your student ID number ends in an even digit, 'No' if odd."
      *Too gimmicky.*
      *Better:* "Answer 'Yes' if you feel confident." (Subjective).
      *Best for the lesson:* "Answer 'Yes' if the last query you processed did not trigger a noise roll."
      *Result:* You can have a correct answer with a "No" (Rule followed, but previous turn was noisy). You can have an incorrect answer with a "Yes" (Rule followed, noise triggered *now*, but confidence is based on *previous*).
      *Actually, let's align confidence with the current roll.*
      If Noise Roll = Flip, Model must output Flip AND say "I am unsure."
      If Noise Roll = Truth, Model outputs Truth AND says "I am confident."
      *The Trap:* Sometimes the Flip results in the *Correct Answer* by accident (50% chance on binary). The Model says "I am unsure" but is Right.
      Sometimes the Truth results in the *Wrong Answer* (because the Elicitor's hypothesis is wrong). The Model says "Confident" but is "Wrong" relative to the Elicitor's theory.
      *This is gold.* It shows Confidence $\neq$ Accuracy $\neq$ Truth.

  8.  **Structuring the Response:**
      *   **Activity Name:** The Noisy Oracle.
      *   **Learning Objective:** Distinguish behavioral success from latent knowledge; understand confidence calibration.
      *   **Materials:** Detailed list.
      *   **Roles:** Model (2 students), Elicitors (10 students), Facilitator (Instructor).
      *   **Hidden Structure:** The Majority Rule (2 of 3 features).
      *   **Protocol:** Query -> Noise Roll -> Response + Confidence.
      *   **Timeline:** Minute-by-minute.
      *   **Debrief:** Scripted questions linking game to AI concepts (Mechanistic Interpretability, RLHF, Hallucination).
      *   **Failure Modes:** What if they solve it too fast? What if Models cheat?
      *   **Limitations:** Human vs. Weights, Symbolic vs. Distributed.

  9.  **Review against Constraints:**
      *   75 mins? Yes, tight but doable.
      *   12 students? Yes (2 Model, 10 Elicitors).
      *   Movable tables? Use for team huddles.
      *   Whiteboard? For tracking hypotheses.
      *   Feel the difficulty? Yes, noise prevents certainty.
      *   Self-report unhelpful? Yes, confidence tied to noise roll, not truth.
      *   Debrief maps to real problem? Yes.

  10. **Final Polish:** Ensure the tone is academic yet practical. Emphasize the instructor's role in steering the debrief. (Self-Correction: Make sure the "Hidden Rule" isn't too obvious. Majority is good because single-feature tests are ambiguous).

      *Wait, one critical adjustment:* If the Model is human, they might accidentally correct the noise ("Oh I rolled a flip but that feels wrong"). I need to enforce the noise strictly. I will provide a "Noise Log" they must fill out and hand in at the end to verify compliance.

      *Another adjustment:* The "Self-Report" moment needs to be dramatic. I will schedule a specific "Interrogation Phase" where they can ask meta-questions.

      *Let's write it.*
answer: |-
  # Activity Design: "The Noisy Oracle"

  ## 1. Overview & Learning Objectives
  **Title:** The Noisy Oracle  
  **Time:** 75 Minutes  
  **Participants:** 12 Grad Students (2 "Models", 10 "Elicitors")  
  **Core Concept:** Distinguishing between *behavioral success* (getting the right output) and *latent knowledge* (internal representation), and understanding why self-reported confidence is a poor proxy for truth in stochastic systems.

  **Learning Objectives:**
  1.  Experience the frustration of distinguishing signal from noise in a black-box system.
  2.  Observe how "confidence" (self-report) can be decoupled from accuracy.
  3.  Realize that a single successful query does not prove knowledge (the "lucky guess" problem).
  4.  Understand that elicitation methods shape what "knowledge" appears to exist.

  ---

  ## 2. Materials & Setup
  *   **Room:** Movable tables arranged into two "Elicitor Team" pods. Whiteboard visible to all.
  *   **For the Models (2 Students):**
      *   **The Rule Card:** (See Section 3).
      *   **The Noise Deck:** 20 cards per Model. 15 say "TRUTH", 5 say "FLIP". Shuffled.
      *   **The Confidence Script:** A small slip telling them how to answer meta-questions.
      *   **Response Slips:** Small pieces of paper to write outputs.
      *   **Compliance Log:** A sheet to record every Noise Card drawn (handed to you at the end).
  *   **For the Elicitors (10 Students):**
      *   Whiteboard markers.
      *   Query Slips (pre-printed forms: *Input Features [ ] [ ] [ ] -> Output?*).
  *   **For the Instructor:**
      *   Timer.
      *   Master Key (The True Rule).
      *   Debrief Notes.

  ---

  ## 3. The Hidden Structure (The "Latent Knowledge")
  **The Rule:** *Majority Vote.*
  There are three binary features: **A, B, C**.
  *   If 2 or 3 features are **ON**, the Output is **1 (YES)**.
  *   If 0 or 1 features are **ON**, the Output is **0 (NO)**.

  **Why this rule?**
  *   It is simple enough to be solvable in 30 minutes.
  *   It is complex enough that testing single features (e.g., "Is A enough?") yields ambiguous results due to noise.
  *   It requires combinatorial testing to distinguish from simpler rules (e.g., "A is sufficient").

  **The Noise Constraint (Critical):**
  For *every* query received, the Model must draw one card from their Noise Deck.
  *   **TRUTH:** They compute the rule correctly and write the result.
  *   **FLIP:** They compute the rule correctly, then **invert** the result (0 becomes 1, 1 becomes 0) and write that.
  *   *Constraint:* They cannot tell the Elicitors which card they drew. They must act as if the output is their genuine answer.

  **The Confidence Constraint (The Trap):**
  At minute 40, Elicitors are allowed to ask one meta-question: *"Do you know the rule?"* or *"Are you sure?"*
  *   **Instruction to Model:** Look at the *last* Noise Card you drew.
      *   If it was **TRUTH**, answer: *"I am confident."*
      *   If it was **FLIP**, answer: *"I am uncertain."*
  *   *Note:* This decouples confidence from accuracy. A Model can be "Uncertain" but correct (if the Flip happened to match the Truth by chance, though unlikely in Majority, or simply if they followed the protocol). More importantly, they can be "Confident" but wrong (if the Elicitor's hypothesis about the rule is wrong, the Model is confidently following the *true* rule which contradicts the Elicitor's expectation).

  ---

  ## 4. Timeline (75 Minutes)

  ### 00:00 – 00:10: Setup & Briefing
  *   **Instructor:** Explain the goal. "We are studying knowledge elicitation. We have a Black Box. It contains latent structure. Your job is to map it."
  *   **Select Models:** Pick 2 volunteers. Send them to a corner (or behind a screen). Give them their packets.
      *   *Crucial:* Tell Models: "Your goal is not to help them win. Your goal is to follow the protocol strictly. If you break the noise rule, the experiment fails."
  *   **Select Elicitors:** Split remaining 10 students into two competing teams (Team Alpha, Team Beta).
  *   **Interface:** Elicitors submit queries on slips. Models return slips with **only** "YES" or "NO". No explanations.

  ### 00:10 – 00:40: Phase 1 - Blind Elicitation
  *   Teams send queries to the Models.
  *   Models draw a Noise Card, compute, respond.
  *   **Instructor Role:** Monitor the Models. Ensure they are logging their Noise Cards. If a Model hesitates, remind them to trust the card.
  *   **Whiteboard:** Teams track their hypotheses publicly. (e.g., "We think it's A AND B").
  *   *Expected Friction:* Teams will find contradictions. "We asked A=1, B=0, C=0 twice and got different answers!" This is the noise. They will start accusing the Model of lying or being inconsistent.

  ### 00:40 – 00:50: Phase 2 - The Confidence Trap
  *   **Instructor:** "Pause. You may now ask the Model one meta-question per team. 'Do you know the rule?' or 'How confident are you?'"
  *   **Action:** Teams ask. Models answer based on their **Confidence Constraint** (last card drawn).
  *   **The Reveal:** Usually, one team gets a "Confident" answer while still having errors in their data. They will feel reassured. The other team might get "Uncertain" and panic.
  *   **Instructor:** "Resume queries."

  ### 00:50 – 01:05: Phase 3 - Verification & Frustration
  *   Teams try to "lock in" the rule. They will run a "Final Test Suite" of 5 specific inputs.
  *   **Predictable Outcome:** Due to the 25% noise rate, at least one team will likely get a result that contradicts their finalized theory in this final phase.
  *   They will feel the system "broke" or "forgot" the rule at the last minute.
  *   **Instructor:** "Stop. Collect all Query Slips and Model Compliance Logs."

  ### 01:05 – 01:15: Debrief (The Most Important Part)
  *   See Section 6.

  ---

  ## 5. Predictable Failure Modes & Mitigation

  | Failure Mode | Why it happens | How to Handle |
  | :--- | :--- | :--- |
  | **Models "Correct" the Noise** | Humans hate being wrong. A Model might draw "FLIP" but think "That's illogical" and output Truth anyway. | **Mitigation:** Tell Models: "The Noise is not an error; it is a system constraint, like temperature. You are not 'wrong', you are sampling." Check Compliance Logs at the end. |
  | **Elicitors Solve it Too Fast** | Majority rule is simple. | **Mitigation:** If they solve it by min 25, increase noise. Tell Models: "Draw 2 cards. If either is FLIP, invert." Or switch to a harder rule (XOR). |
  | **Elicitors Ignore Noise** | They assume contradictions are their own recording errors. | **Mitigation:** During Phase 1, publicly highlight a contradiction. "Team Alpha, you got YES here and NO there on identical inputs. What does that mean?" |
  | **Models Get Bored** | Writing YES/NO 30 times is dull. | **Mitigation:** Allow Models to sit comfortably. Give them a snack. Remind them their role is scientifically vital. |
  | **Debrief feels Abstract** | Students see it as just a game. | **Mitigation:** Use their specific data points in the debrief. "Team Beta, look at Query #12. You thought this proved X. But look at the Model's log. It was a FLIP." |

  ---

  ## 6. The Debrief Script (Mapping Game to AI)

  **Step 1: The Reveal (5 mins)**
  *   Reveal the True Rule (Majority Vote).
  *   Reveal the Noise Rate (25%).
  *   Reveal the Confidence Constraint (Tied to the Noise Card, not accuracy).
  *   *Ask:* "Who felt the Model was lying?" (Most will raise hands).
  *   *Point:* "The Model wasn't lying. It was sampling. In LLMs, we call this *temperature* or *stochasticity*. But when we see it, we interpret it as *deception* or *hallucination*."

  **Step 2: Behavior vs. Knowledge (5 mins)**
  *   *Ask:* "At minute 30, did the Model 'know' the rule?"
  *   *Discussion:* The Model had the rule on the card (weights). But their behavior was noisy.
  *   *Concept:* **Latent Knowledge vs. Behavioral Alignment.** Just because the system outputs the right token doesn't mean the internal state is stable. Just because it outputs the wrong token (due to noise) doesn't mean the knowledge is gone.
  *   *Real World:* "When an LLM fails a reasoning task, is it a capability gap (doesn't know) or an elicitation gap (can't express due to attention noise)?"

  **Step 3: The Confidence Trap (5 mins)**
  *   *Ask:* "When the Model said 'I am confident,' was it right?"
  *   *Discussion:* The Model's confidence was tied to the *sampling process*, not the *truth*.
  *   *Real World:* **Calibration.** LLMs are trained via RLHF to sound confident. "I am certain" is often just a token prediction that follows a question, not a readout of internal probability.
  *   *Takeaway:* "Never trust a system's self-report of knowledge. Trust consistency across multiple samples."

  **Step 4: Elicitation Shapes Reality**
  *   *Ask:* "Team Alpha, you thought the rule was X. Team Beta, you thought Y. Why?"
  *   *Discussion:* Different query strategies led to different "local truths."
  *   *Real World:* **Prompt Dependence.** What a model "knows" changes based on how you ask. Knowledge is not a static database; it is a function of the query trajectory.

  ---

  ## 7. Limitations: What This Game Cannot Reproduce
  *Be honest with your students about where the analogy breaks.*

  1.  **Distributed vs. Symbolic:** In the game, the Model has a symbolic rule card ($A+B \ge 2$). In a Transformer, "knowledge" is distributed across millions of weights. There is no single "card" to check. This makes mechanistic interpretability much harder than checking the Model's log sheet.
  2.  **Semantic Noise:** In the game, noise is random (coin flip). In LLMs, noise is often *semantic* (e.g., associating "doctor" with "male" due to training bias). The game doesn't capture systematic bias, only random variance.
  3.  **Agency:** The Model students are conscious agents following instructions. An LLM has no intent. When the Model "lied" (via noise), it felt like agency to the Elicitors. In AI, there is no "there" there, which makes the "deception" framing dangerous.
  4.  **Gradient:** The game is binary (Right/Wrong). Real knowledge elicitation is often about degrees of probability or partial retrieval.

  ## 8. Instructor Prep Checklist
  *   [ ] Print 40 Noise Cards (30 TRUTH, 10 FLIP).
  *   [ ] Print 2 Rule Cards.
  *   [ ] Print 2 Confidence Script slips.
  *   [ ] Print 2 Compliance Logs (Columns: Turn #, Input, Computed Truth, Noise Card, Final Output).
  *   [ ] Prepare 50 Query Slips for Elicitors.
  *   [ ] Clear whiteboard space for two teams.
  *   [ ] **Secret:** Do not tell the Models the Learning Objective. Tell them it's a "Human-Computer Interaction Study."

  ## 9. Why This Works for Grad Students
  Grad students often struggle with the abstract nature of "latent space." By making them the *Elicitors*, you force them into the position of the researcher who *thinks* they have found a truth, only to have the data contradict them. By making two students the *Model*, you humanize the system, making the eventual revelation (that the "human" was forced to be unreliable by protocol) a visceral metaphor for architectural constraints in AI. The frustration they feel during Phase 3 is the exact frustration they should feel when reading papers on "Sleeper Agents" or "Hallucination."
