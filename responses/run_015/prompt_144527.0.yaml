answer: |-
  Montaigne's "Of Cannibals" uses Tupinambá rituals to hold a mirror to European cruelty, arguing their violence is honest compared to Christian torture during religious wars. *Avatar* mirrors this structure: humans are the destructive colonizers, while the Na'vi practice ritualistic hunting rooted in respect. This aligns with Montaigne's moral economy of violence—killing for sustenance versus killing for greed.

  However, the film diverges on epistemic humility. Montaigne suggests we cannot truly judge other customs; *Avatar* asserts the Na'vi are objectively morally superior. Montaigne asks us to question our blindness; *Avatar* asks us to switch sides. Jake's conversion illustrates this. It isn't relativism—accepting difference—but a redemption narrative where he abandons humanity to lead the Na'vi. Montaigne remains an observer; Jake becomes a messiah.

  Where the film resists Montaigne is in romanticization. Montaigne admits the cannibals still eat people; he doesn't erase their difference, only recontextualizes it. *Avatar* aestheticizes the "primitive," making the Na'vi palatable through spiritual harmony rather than challenging us to accept genuine alterity. The self-criticism exists—we see the bulldozers destroying Hometree—but it lacks Montaigne's skepticism. We aren't asked to examine why our culture values extraction; we're told extraction is evil and nature is good.

  Ultimately, *Avatar* fulfills Montaigne's critique of colonial barbarism but fails his humility. It inverts the label without sustaining the question. Montaigne wants us to doubt our judgment; *Avatar* wants us to judge humans guilty. The film uses the relativist framework to deliver a moral absolutist conclusion. While Montaigne shocks us to provoke thought, *Avatar* comforts us with a clear hero and villain, sidestepping the harder work of examining our own cultural violence beyond simple condemnation. The mirror is held up, but we are allowed to look away by blaming only the military-industrial complex, not the culture that birthed it.
