answer: |-
  ### Diagnosis of the Candidate Questions

  Before setting the agenda, we must correct the framing of the five candidates. Two are load-bearing, two are derivative, and one is empirically inaccessible to us.

  *   **(i) The Syllabus Objection:** **Load-bearing.** This is the strongest challenge to the charter. If the curriculum encodes the adult mind, Turing's "blank notebook" is a marketing fiction. However, it is misdescribed as a binary (either the code is in the machine or the syllabus). It could be distributed, compressed, or emergent.
  *   **(ii) Teaching vs. Rewiring:** **Load-bearing.** This is the core metaphysical claim. However, it is currently circular: it assumes we know what "teaching" is. We cannot define the difference until we define the system boundary.
  *   **(iii) Reason-Responsiveness:** **Empirical in Costume.** As stated ("probed from the outside"), this is impossible without compute or interpretability tools. We cannot distinguish reason-tracking from reinforcement learning in a black box empirically. It must be reframed as a *conceptual* requirement: *What would a system have to be for this distinction to hold?*
  *   **(iv) The Examination Reading:** **Derivative.** This is a question about evaluation metrics, not system ontology. It depends entirely on what we decide the system *is* (see v) and *how* it learns (see ii). It should be dropped as a primary research line and treated as a downstream application.
  *   **(v) Scaffold-Dependence:** **Upstream.** This is the most neglected and critical question. It determines the unit of analysis. If the "child" includes the "teacher," the Syllabus Objection (i) dissolves, because the specification burden is part of the cognitive system, not an external input.

  ---

  ### The Five-Year Research Agenda

  **Priority 1: The Boundary Question (Refining Candidate v)**
  *What is the ontological unit of the "educated machine"?*

  **Priority 2: The Compression Question (Refining Candidate i)**
  *Does the educational process compress specification complexity, or merely translocate it?*

  **Priority 3: The Normative Question (Refining Candidates ii & iii)**
  *What distinguishes a normative update (learning from a reason) from a causal update (learning from a signal)?*

  ---

  ### Dependency Structure and Reasoning

  **1. The Boundary Question (Upstream)**
  *   **Reasoning:** You cannot determine if a syllabus contains hidden specifications (Priority 2) until you decide where the machine ends and the environment begins. Colleague A assumes the model weights are the mind. Colleague B assumes the training process is the mind. If the "mind" is the *trajectory of the system through a social environment* (the notebook plus the stationer plus the teacher), then the "blankness" of the notebook is irrelevant.
  *   **Tractability:** Purely conceptual. Requires analyzing extended cognition arguments applied to artificial systems. No compute needed.
  *   **Neglect:** AI philosophy focuses almost exclusively on the model (the "brain in a vat"). The institutional scaffolding of AI development is treated as sociology, not cognitive science. This is a gap we can fill.
  *   **Dependency:** Upstream of everything. If the unit of assessment is Machine+Scaffold, the "Syllabus Objection" changes from a critique to a design feature.

  **2. The Compression Question (Midstream)**
  *   **Reasoning:** Once the boundary is fixed, we must address Turing's efficiency claim. Turing argued the child machine saves labour because we don't have to program the adult mind. But if the *curriculum* requires the same information content to specify as the adult mind, we have gained nothing. This is an information-theoretic question framed philosophically.
  *   **Tractability:** Conceptual analysis of "information," "specification," and "complexity." We can use formal learning theory (without running experiments) to analyze the logical relationship between curriculum complexity and final capacity.
  *   **Neglect:** Engineers assume "data is cheap." Philosophers assume "syntax is insufficient." Neither group analyzes the *informational cost of pedagogy* itself.
  *   **Dependency:** Depends on Priority 1 (where is the info stored?). Upstream of Priority 3 (if no compression occurs, the mode of update is merely an engineering detail, vindicating Colleague A).

  **3. The Normative Question (Downstream)**
  *   **Reasoning:** Only if the boundary is coherent (P1) and the process offers genuine compression (P2) does it matter *how* the system updates. This addresses Colleague B's hope: is there a philosophical difference between backpropagating an error and understanding a correction? We cannot test this empirically (no compute), so we must establish the *conditions of possibility* for reason-responsiveness.
  *   **Tractability:** Conceptual. We are not asking "Do LLMs do this?" but "What would a system look like if it did?" and "Does Turing's charter require it?"
  *   **Neglect:** Most work here is in ethics (alignment). We are focusing on the metaphysics of learning.
  *   **Dependency:** Downstream of P1 and P2. If the system is just the weights (P1 failed) or the syllabus is just hidden code (P2 failed), then "reason-responsiveness" is a fairy tale we tell ourselves about gradient descent.

  ---

  ### What to Drop and Why

  **Drop Candidate (iv) (The Examination Reading) as a primary line.**
  *   **Reason:** It is downstream of Priority 3. Whether the Imitation Game is a school exam or a behavioural test depends on whether the system *understands* (Priority 3) or merely *performs*. Investigating the test before investigating the system is putting the cart before the horse.
  *   **Condition for Reinstatement:** If Priority 3 concludes that "understanding" is incoherent for artificial systems, the Examination Reading becomes the *only* question left (functionalism wins). In that case, the institute pivots to evaluation metrics in Year 4.

  **Reframe Candidate (iii) (Reason-Responsiveness).**
  *   **Correction:** Do not attempt to probe existing systems. That is empirical psychology. Our job is to define the *logical space* of reason-responsiveness. If we cannot define it conceptually, we cannot look for it empirically.

  ---

  ### Stability Conditions: What Changes the Ranking?

  **1. What would move Priority 1 (Boundary) down?**
  *   **Technical Development:** The standardization of "agentic workflows" where the model clearly calls tools and APIs in a way that is architecturally distinct from its weights. If the industry settles on a clear "Model vs. Environment" interface, the philosophical boundary problem dissolves into an engineering spec.
  *   **Argument:** A proof that cognitive capacities *cannot* be constituted by external scaffolds (a successful rebuttal of the Extended Mind thesis specific to silicon).

  **2. What would move Priority 2 (Compression) up?**
  *   **Result:** A formal proof in learning theory (e.g., a "No Free Lunch" theorem for pedagogy) demonstrating that curriculum complexity *must* scale linearly with target capacity. If this is proven mathematically, Turing's charter is logically impossible, and the institute must pivot to Colleague A's "museum" position or close.
  *   **Why Upstream:** This would invalidate the founding charter immediately. It is currently midstream because we assume compression is *possible* but need to check *where* the cost lies.

  **3. What would make Priority 3 (Normative) stable under any evidence?**
  *   **Argument:** This question is stable because it is conceptual. Even if models become perfect imitators, the question "Is this imitation or understanding?" remains open. No amount of empirical success answers the philosophical distinction. This is the institute's long-term legacy question.

  **4. What would invalidate the whole agenda?**
  *   **Technical Development:** If "education" of AI becomes fully automated (AI trains AI with no human curriculum), the "Syllabus Objection" and "Teaching" distinctions collapse into "Optimization." The human teacher disappears from the loop.
  *   **Mitigation:** This makes Priority 1 *more* urgent. If humans leave the loop, we must define what the "institution" is that replaced them.

  ### Summary of Strategy

  We reject Colleague A's claim that history has vindicated Turing. History has vindicated *training*, but not necessarily *education*. Training is causal; education is normative. We reject Colleague B's claim that the distinction is obvious. It is not.

  We will spend Year 1-2 fixing the **Boundary** (is the teacher part of the machine?). We will spend Year 3 fixing the **Compression** (is the syllabus hidden code?). We will spend Year 4-5 defining the **Norm** (what would reason-tracking look like?).

  This order ensures we do not spend five years debating the morality of teaching a system that turns out to be merely a rewired calculator. It respects our lack of compute by focusing on the logic of the charter rather than the behaviour of the models. It claims a niche (the metaphysics of AI pedagogy) that is currently vacant between engineering and standard philosophy of mind.
