      *   **Line 1: Preference vs. Constraint (Architecture)**
          *   *Upstream:* Very high. If corrigibility is a constraint, standard decision theory breaks. If it's a preference, instrumental convergence threatens it. This defines the *object* of study.
          *   *Tractability:* High. Philosophers of action deal with norms/rules vs. desires all the time (Kant vs. Hume). Decision theorists can model utility functions vs. lexical constraints.
