      *   **Validate the User:** Acknowledge their intuition is sharp. This is a known tension in philosophy (SSA vs. SIA).
      *   **Define the Terms:** Clearly explain SSA (Self-Sampling) and SIA (Self-Indication).
      *   **Map the Characters:**
