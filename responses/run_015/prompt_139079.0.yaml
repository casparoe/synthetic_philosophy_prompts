answer: |-
  The lab lights were dimmed, save for the glow of the monitors displaying the Audit's structural equations. Elias rubbed his temples, staring at the minimality clause. Mara sat opposite, sipping cold coffee, her eyes on the variability graphs.

  "The Audit is a trap, Mara," Elias said quietly. "Look at Feature Two. Completeness and minimality. Every difference-making cause in that 400-millisecond window is already cataloged at the base grain. If we add the 'decision' variable, we are violating Causal Bookkeeping. We're inflating the inventory of causes for free."

  "But the inventory isn't inflated," Mara countered. "It's corrected. Look at Feature Three. The base states vary wildly across the ten thousand trials. Neuron A fires in trial one, stays silent in trial two. Yet the 'decision' variable remains constant and predicts the press. The base variables don't support the counterfactuals across trials the way the decision variable does. It's not an idle wheel; it's the only stable axle."

  "Stable, yes. Causally distinct, no," Elias replied. "Feature Four is the killer. No independent handle. You cannot intervene on the decision except by intervening on its base realizers. If I manipulate the decision, I am literally manipulating the neural state. The causal work is done by the neural state. The decision is just a label we paste on a disjunction of those states. If you count both, you have systematic overdetermination."

  "Systematic, yes. Overdetermination, no," Mara said, leaning forward. "Overdetermination implies two *independent* sufficient causes. Here, they are nomically tied. But more importantly, consider Grain Neutrality. If you argue that the base grain's completeness excludes the coarse grain, you've privileged the base. Why stop at neurons? If completeness at the neural level excludes the mental, then completeness at the quantum level excludes the neural. Your argument generalizes until geology and economics have no causes. Is that a discovery or a reductio?"

  Elias sighed, tapping the screen. "I'll concede the base grain needn't be fundamental physics. Let's say the Audit's base is neural. I don't need quarks to exclude minds; I just need a level that is causally complete for the window. If the neural model is minimal—no idle wheels—then adding the mental variable *does* add an idle wheel, because the neural variables already capture all the counterfactual dependencies within that grain."

  "But that begs the question," Mara pressed. "You're assuming 'causal work' is a finite substance distributed at the base grain. The Variability Finding shows the coarse variable captures a causal profile the base variables miss. The base variables are too specific. If I say 'the decision caused the press,' I'm true across all trials. If I say 'neural state N1 caused the press,' I'm false in trial two. The coarse variable is proportional to the effect. If you reject proportionality to save exclusion, you lose the special sciences."

  "I'm not rejecting proportionality," Elias said. "I'm saying proportionality is a pragmatic virtue of explanation, not a metaphysical condition on causation. The Audit models *causation*, not just explanation. Feature One says the base grain is the finest at which states can be tracked and manipulated. If that's the limit of manipulation, that's the limit of causal leverage. The decision variable doesn't add leverage; it just aggregates existing leverage."

  "Aggregation is work," Mara insisted. "Think about contrast-sensitivity. Causation is always causation relative to a contrast. The base variable answers 'Why this neural state rather than that one?' The decision variable answers 'Why press rather than not press?' The Audit's completeness is relative to the base grain's contrasts. It doesn't saturate the causal field for coarse-grained contrasts. If you insist it does, you're violating Grain Neutrality. You're saying the inventory of causes changes because we described the event finely."

  Elias paused. "Here is my concession: I agree that if causation is purely a relation between variables in a model, then different models yield different causes. But that makes causation mind-dependent. I assume causation is out there in the world. The Audit maps the world. If the world is physically closed at the base grain, and the decision is realized by the base, then the decision doesn't add ontological weight. It's not that the inventory changes because of description; it's that the coarse description picks out the same causal transaction already fully described by the base."

  "But 'same transaction' is the dodge," Mara said. "If the transaction is identical, then the coarse variable is identical to the base variable. But Feature Three says it's not. It's a determinable. If you say the determinable causes nothing over and above the determinate, you're saying macro-objects cause nothing. You're saying the earthquake didn't cause the tsunami; the particle shifts did. That's not physicalism; that's eliminativism."

  "I'm not eliminating the earthquake," Elias said. "I'm saying the earthquake *just is* the particle shifts. But here's where I hold firm. If you allow the coarse variable to be a cause *alongside* the base variable, you violate Causal Bookkeeping. You have two causes where the model says there is room for one. You say it's not overdetermination because they are tied. I say guaranteed overdetermination is still overdetermination. If the base does it, the coarse doesn't *need* to do it. And if it doesn't need to, it's excluded."

  "Unless 'doing it' is contrastive," Mara replied. "The base variable doesn't do what the coarse variable does. The coarse variable supports counterfactuals the base variable fails. So the base variable doesn't 'do it' all. It does the fine-grained work. The coarse does the coarse work. If you deny this, you aren't saving physicalism; you're destroying the hierarchy of science. You're forcing us to choose a privileged grain. Which one? The Audit's base? Why not deeper? If you can't answer without arbitrariness, Grain Neutrality wins, and exclusion fails."

  Elias leaned back, looking at the variability graph again. "Then we aren't disagreeing about the data. We're disagreeing about whether 'completeness' at a lower grain entails exclusivity for higher grains. You think completeness is local to the grain. I think it saturates."

  "Exactly," Mara said. "And if it saturates, physics eliminates biology."

  "And if it doesn't," Elias countered, "then causation is not a feature of the world, but of our models."

  They sat in silence, the hum of the servers filling the gap. The Audit sat complete on the screen, minimal and exhaustive, yet somehow still open to interpretation.

  ***

  **Author's Note**

  Mara has the better of this exchange, primarily because Elias cannot sustain the claim that causal completeness at a lower grain entails exclusivity without violating Grain Neutrality. The deciding premise is whether causation is a relation between concrete events (Elias) or variables in a structural model (Mara). Given the Audit is explicitly an interventionist structural-equation model, Mara's variable-based ontology is methodologically consistent with the stipulations, whereas Elias imports a metaphysical constraint (saturating causal fields) that the model does not support. However, the dialogue leans on a contestable reading of Feature Four (No Independent Handle). It assumes that lacking an independent handle implies causal redundancy, rather than simply implying supervenience. If intervention on the realizer *constitutes* intervention on the realized, then Bookkeeping is not violated by counting both, provided they answer different contrastive questions. Elias's fear of eliminativism is well-founded, but Mara's reliance on contrastivity risks making causation too fragmented to sustain robust physicalism.
