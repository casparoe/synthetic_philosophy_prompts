  **Internal Brainstorming**
  The colleague conflates Harsanyi's Aggregation Theorem with his Utilitarianism proof via the Veil of Ignorance. The theorem proves linearity given Pareto and vNM axioms, but weights remain indeterminate without ethical input. Arrow is avoided via cardinality and comparability, not risk per se. Intergenerational application fails because non-existent agents lack preferences. I need to structure five critiques covering linearity, weights, comparability, Arrow, and intergenerational ethics, ensuring strict sentence counts.

  1. The claim that social welfare must be a weighted linear sum of individual utilities is accurate under the stated axioms, but a defender would note this establishes functional form rather than specific weight values. While the linearity conclusion survives, the subsequent inference that weights are mechanically determined does not.
  2. Asserting that weights are fixed by rationality alone is a misrepresentation, as the theorem leaves coefficients indeterminate without an additional ethical premise like the veil of ignorance. A defender would distinguish the aggregation theorem from the equiprobability model, meaning the conclusion that ethical calibration is unnecessary fails completely.
  3. The statement that interpersonal comparison needs no separate ethical calibration is a misrepresentation, because the theorem presupposes cardinal unit comparability rather than deriving it from rationality. A defender would clarify that rationality dictates the functional form only after comparable utility scales are assumed, so the claim that measurement problems are dissolved does not survive correction.
  4. Characterizing Arrow's impossibility result as dissolved simply because risk is present is a common simplification, since the escape actually relies on admitting cardinal interpersonal comparisons rather than risk itself. A defender would emphasize that Arrow's informational constraints are relaxed, not that risk negates impossibility logic, rendering the conclusion that only a normalization constant remains misleading.
  5. Extending this framework to intergenerational policy without a normative framework for weighting lives is a misrepresentation, since future generations lack existing preferences to satisfy vNM axioms. A defender would argue that population ethics and discount rates require distinct normative justification beyond static aggregation, so the conclusion that risk attitudes alone suffice for temporal weighting collapses under this correction.
