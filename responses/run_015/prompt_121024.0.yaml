  ### Preamble: Physics vs. Metaphysics

  Before engaging the taxonomy, students must distinguish between the settled physical structure of Special Relativity (SR) and the contested metaphysical interpretations of that structure.

  **Settled Physics/Logic:**
  *   Spacetime is modeled as a four-dimensional Minkowski manifold.
  *   The metric structure is governed by Lorentz transformations.
  *   There is no globally invariant simultaneity relation; simultaneity is frame-dependent.
  *   Causal structure is defined by light cones (timelike and null separations).

  **Contested Metaphysics:**
  *   Whether frame-dependence undermines objective temporal becoming.
  *   Whether the "block" implies the equal reality of past, present, and future.
  *   Whether metaphysical privilege can be assigned to structures not invariant in the metric (e.g., a hidden preferred frame).
  *   Whether "existence" is tenseless (eternalism) or tensed (presentism/growing block).

  ***

  ### Decision-Tree Taxonomy of Responses to Rietdijk--Putnam

  **Node 1:** Does the metric structure of Minkowski spacetime exhaust the metaphysical structure of time?
  *   **Branch A:** Yes (Geometric Realism). → *Go to Node 4.*
  *   **Branch B:** No (Metaphysical Surplus). → *Go to Node 2.*

  **Node 2:** Can a privileged foliation of spacetime be recovered in a Lorentz-invariant manner?
  *   **Branch A:** Yes. → *Go to Node 3.*
  *   **Branch B:** No. → *Go to Node 3.*
      *(Note: Both branches converge on the question of relevance, but distinct paths allow for distinct leaves regarding the nature of the foliation.)*

  **Node 3:** Is any such recovery metaphysically relevant rather than merely epistemically hidden?
  *   **Branch A:** Yes. → **Leaf 1**
  *   **Branch B:** No. → **Leaf 2**

  **Node 4:** Is the argument against dynamism driven primarily by the spatial separation of observers (Rietdijk) or by the determinateness of future events (Putnam)?
  *   **Branch A:** Spatial Separation (Rietdijk). → *Go to Node 5.*
  *   **Branch B:** Determinateness (Putnam). → *Go to Node 6.*

  **Node 5:** Must the ontologically privileged 'present' be defined globally across spacelike separated regions?
  *   **Branch A:** Yes (Global). → *Go to Node 7.*
  *   **Branch B:** No (Local). → *Go to Node 8.*

  **Node 6:** Can objective becoming be maintained without a global simultaneity slice?
  *   **Branch A:** Yes. → **Leaf 3**
  *   **Branch B:** No. → **Leaf 4**

  **Node 7:** Do events located in the future light-cone of the present hypersurface exist?
  *   **Branch A:** Yes. → **Leaf 5**
  *   **Branch B:** No. → **Leaf 6**

  **Node 8:** Is reality restricted to an observer's past light-cone?
  *   **Branch A:** Yes. → **Leaf 7**
  *   **Branch B:** No. → **Leaf 8**

  ***

  ### Taxonomy Leaves

  **Leaf 1: Presentism with Privileged Foliation**
  *   **Statement:** Only events on a single, metaphysically privileged spacelike hypersurface exist, despite this foliation lacking invariant geometric status.
  *   **Awkward Commitment:** It posits a fundamental structure of reality that is empirically undetectable and violates the spirit of relativity principle without violating its letter.

  **Leaf 2: Hidden-Structure Eternalism**
  *   **Statement:** A privileged foliation exists but is metaphysically inert, rendering all spacetime points equally real regardless of the hidden slice.
  *   **Awkward Commitment:** It ontologically commits to a structure (the foliation) that is explicitly admitted to have no bearing on what exists, rendering the commitment explanatorily vacuous.

  **Leaf 3: Minkowski Growing Block**
  *   **Statement:** The past and present exist as a cumulative four-dimensional volume, but the future is unreal, with "becoming" defined by the expansion of this volume along worldlines.
  *   **Awkward Commitment:** It struggles to define the "edge" of the block in a Lorentz-invariant way without implicitly reintroducing a preferred frame.

  **Leaf 4: Putnam-Style Eternalist Block**
  *   **Statement:** Because future events are determinate for some observer's present, all events in the manifold are equally real.
  *   **Awkward Commitment:** It requires the denial of any objective distinction between past, present, and future, rendering temporal becoming purely psychological.

  **Leaf 5: Rietdijk-Style Eternalist Block**
  *   **Statement:** Because different observers slice the manifold differently, reality must encompass the union of all possible simultaneity slices.
  *   **Awkward Commitment:** It requires the denial of any objective distinction between past, present, and future, rendering temporal becoming purely psychological.

  **Leaf 6: Global SR-Presentism (Empty View)**
  *   **Statement:** Only events on a global spacelike hypersurface exist, despite the lack of an invariant way to select that surface.
  *   **Awkward Commitment:** **Diagnosis of Emptiness:** This view is generally regarded as incoherent because it asserts a global "now" while denying the physical resources to define it, leading to contradictions regarding which events are real for intersecting observers.

  **Leaf 7: Local Presentism / Fragmentalism**
  *   **Statement:** Reality is restricted to the events within an observer's past light-cone, denying existence to spacelike separated regions.
  *   **Awkward Commitment:** It fragments reality into observer-dependent domains, making it difficult to account for shared objects or interactions between spacelike separated observers.

  **Leaf 8: Point Presentism (Empty View)**
  *   **Statement:** Only the single spacetime point of the observer's "here-now" exists, excluding even the immediate past light-cone.
  *   **Awkward Commitment:** **Diagnosis of Emptiness:** This combination has no named defenders because it is functionally solipsistic; it renders memory, causation, and the experience of duration inexplicable, as the immediate past required for these phenomena is declared unreal.

  ***

  ### Overlap and Separation Analysis

  **Flagged Overlap: Leaf 4 (Putnam-Style Eternalist) and Leaf 5 (Rietdijk-Style Eternalist)**
  *   **Nature of Overlap:** Metaphysical Identity.
  *   **Explanation:** The tree fails to separate these cleanly because, while the *arguments* leading to them differ (determinateness vs. spatial slicing), the resulting *ontology* is identical (the full four-dimensional block). The distinction is merely genealogical (how one arrives at the view) rather than metaphysical (what the view claims exists). In a strict ontology taxonomy, these should ideally merge, but they are separated here to track the distinct argumentative pressures of Rietdijk and Putnam.

  **Note on Physics vs. Metaphysics:**
  The taxonomy treats the Minkowski metric as fixed (Physics). The branching at Node 1 represents the genuine contestation in philosophy of physics: whether metaphysics must supervene on the invariant geometric structure or can posit additional structure (e.g., a preferred frame) that the geometry does not reveal.
