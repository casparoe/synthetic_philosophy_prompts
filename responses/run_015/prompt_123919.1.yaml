answer: |-
  **The Web and the Weight: Utilitarian Demands in *Spider-Man 2***

  In our unit on utilitarianism, the idea that stuck with me wasn't the math of maximizing happiness, but the cost of it. Peter Singer's argument about the drowning child suggests that if we can prevent something bad without sacrificing anything of comparable moral importance, we must. The "demandingness objection" follows: if we take this seriously, we can never clock out. We can never buy a coffee or sleep in, because that money or time could save a life elsewhere. *Spider-Man 2* (2004) is often read as a simple allegory for this duty: Peter Parker is the drowning child rescuer, and the city is the pond. But looking closer, the film complicates the utilitarian demand in ways a textbook argument cannot. It asks whether the problem is the *amount* demanded, or the fact that there is no "off switch." It also asks if it matters that Peter never volunteered for the job. While it is easy to say the movie cheats by letting Peter keep the girl and the life at the end, a closer look at the pizza delivery scene and the train sequence suggests the film is actually arguing for a different kind of ethics—one based on shared burden rather than infinite individual sacrifice.

  The first major tension is the idea of the "off switch." My initial thought was that the movie treats Peter's attempt to quit as a failure, proving utilitarianism never lets you rest. When Peter dumps the suit in the alleyway, the film visually luxuriates in his relief. His grades improve, he reconnects with Harry, and he sits in a diner, just being a guy. The movie clearly likes showing him happy. However, when he tries to take the suit back later, he finds he has lost his powers. The film frames this not as a punishment, but as a psychosomatic result of his internal conflict. He isn't strong because he isn't sure he *should* be.

  This resists the idea that the "off switch" is purely external. The movie argues that for a utilitarian hero, the off switch is internal. You can only clock out if you genuinely believe the cost to yourself outweighs the good you do. Peter tries to clock out, but he can't live with the guilt. The film resists the reading that he is simply a slave to duty; instead, he is a slave to his own conscience. However, this is also where the movie cheats. In the real world, burning out doesn't make your ability to help vanish; you just get tired. In the film, Peter's powers literally leave him when his will wavers. This supernatural link between morality and ability is a cheat because it removes the possibility of a tired hero. It suggests that unless you are perfectly committed to the utilitarian calculus, you are useless. That isn't an argument about duty; it's a superhero fantasy about destiny.

  This leads to the second point: the difference between a demand you volunteer for and one you are drafted into. Peter didn't choose the spider. He was drafted. In a strict utilitarian sense, this shouldn't matter. If you walk past the drowning child, it doesn't matter if you signed up to be a lifeguard; if you can save them, you must. But *Spider-Man 2* notices the difference, specifically in the opening sequence. Peter is late delivering pizza because he was saving a child from a fire. The customer berates him, docking his pay and insulting his character. Peter takes it. He doesn't say, "I saved a life." He absorbs the cost.

  This scene highlights the "drafted" nature of his power. Because he didn't choose the role, the world feels entitled to his labor without owing him respect. The movie uses this to show the cruelty of the demandingness objection. If Peter is just a machine for generating good outcomes, his feelings don't matter. But the film pushes back against this. It matters that he is tired. It matters that he is broke. The movie argues that while the duty to save lives is absolute, the duty to destroy your own life to do it is not. The "drafted" status makes the demand harsher, but it also justifies his need for support. He didn't ask for this, so he shouldn't have to carry it alone. This sets up the film's resolution, which attempts to solve the demandingness problem not by lowering the demand, but by sharing the load.

  The climax on the train is where the movie tries to resolve these tensions. Peter fights Doc Ock until he is physically exhausted, collapsing against the controls. In a pure utilitarian reading, Peter should sacrifice himself completely if that is what it takes to stop Ock. He is ready to. But the passengers catch him. They tell him, "He's just a kid. No older than my son." They fight Ock to protect Peter. This is the crucial moment where the film moves beyond the "demandingness objection." The objection assumes the moral agent is alone. *Spider-Man 2* argues that the moral agent is part of a community.

  This is where the ending stops looking like a cheat. My initial read was that Peter getting MJ back and keeping his life was the movie wanting it both ways. But MJ's choice changes the math. She chooses to be with him knowing the danger. In utilitarian terms, her happiness is part of the equation. If Peter pushes her away to "protect" her, he is actually subtracting happiness from the total without her consent. By accepting her, he allows his personal happiness to count toward the greater good. The "off switch" isn't quitting being Spider-Man; the "off switch" is realizing that his own happiness is also a moral good that needs protecting. The movie cheats slightly by having Doc Ock redeem himself at the last second, sparing Peter from having to kill him, but the emotional resolution holds. Peter doesn't get a life *instead* of being a hero; he gets a life *that supports* being a hero.

  So, what does watching this get us that the philosophical argument alone doesn't? The drowning child argument is clean. It is a snapshot: see child, save child, lose shirt. It is abstract and bloodless. *Spider-Man 2* is messy. It shows the toll of the demand over time. It shows Peter falling asleep in class, losing his job, and trembling with exhaustion. Theory tells us *that* we should sacrifice; the film shows us *what it feels like* to sacrifice. It visualizes the weight of the "never clocking out" problem.

  More importantly, the film offers a solution the theory often misses. Utilitarianism can be isolating; it places the burden of calculation on the individual. The train scene shows that the burden can be distributed. When the passengers hold Peter up, they are acknowledging that the responsibility to save the city doesn't rest solely on the one with the powers. It rests on everyone who benefits from the safety. Watching the movie doesn't just explain the demandingness objection; it humanizes it. It suggests that while we might not be able to turn the demand off, we don't have to carry it alone. That isn't a philosophical proof, but for anyone trying to live a moral life without burning out, it might be the more necessary truth.
