  So I'm a freelance journalist who covers science and ideas, I do this weekly newsletter for around 20k curious readers who are smart but mostly not academics, and last week I got stuck in this endless dinner-table arguement about whether race and gender and money are real the way trees are real or real in some totally different human-made way, and I thought it would make a great interactive piece to sort readers by what they actually belive instead of what team they think they are on. I want a which kind of constructionist are you really quiz, like 9 questions max, aimed at total beginners, playful tone, where people discover their view from cases rather than jargon.

  Can you build it so each question is a concrete little vignette with two or three gut-reaction answers, no question that just asks for a label straight up, and then give me a scoring key that maps answer patterns onto four spots: across-the-board no-nonsense realism, the middle view that social forces merely cause differences without making the kind what it is, full-blown constitutive constructionism where collective agreement and rules make it so, and eliminativism about race combined with constructionism about gender and money, plus flag any combo of answers that does not really land anywhere and say whether that spot is empty because it is incoherent or just unexplored, and also tell me which two positions your quiz cannot really seperate. To make it mine please work in these three wierd cases I have been playing with: a stranded Antarctic crew that keeps using chocolate bars as money after they are rescued and everyone back home plays along for a while, a youth esports league that creates a new competitive division based entirely on what avatar body players pick and starts treating it like gender on the signup forms, and a hospital that switches its intake from self-identified race to DNA ancestry percentages and claims it is tracking the same thing more accurately. I need the whole thing to work for someone with no background and no web lookup, just the quiz and key.
