answer: |-
  # The "What Is Real?" Dinner Party Quiz

  **Instructions:** Read the nine short scenarios below. For each, pick the answer that matches your gut reaction. Don't overthink it, and don't answer how you think a scientist *should* answer—answer how *you* actually see the world. Keep track of your letters (A, B, C, or D).

  ***

  ### 1. The Tree and the Tuesday
  A tree falls in the forest. A Tuesday happens on the calendar.
  *   **A.** Both exist whether humans are around or not. Time and matter are just facts.
  *   **B.** The tree is physical, but "Tuesday" is just a label we stick on time to organize ourselves.
  *   **C.** Both depend on us. A tree is only a "tree" because we have a concept for it; Tuesday is an agreement.
  *   **D.** The tree is real, but dividing time into days is a tool we can discard if it stops working.

  ### 2. The Antarctic Chocolate (Case #1)
  A stranded Antarctic crew uses chocolate bars as currency. They get rescued and return to London, but they keep trading chocolate bars for drinks at the pub, and the bartenders accept it for a while.
  *   **A.** Chocolate has sugar and fat; its value is intrinsic and physical, like gold.
  *   **B.** Chocolate is food (real), but its status as "money" is a habit that will fade when the context changes.
  *   **C.** It is money simply because the crew and the bartenders collectively agree to treat it that way.
  *   **D.** Money is a scam; the chocolate is just food, and the "currency" part is an illusion.

  ### 3. The Magic Dollar
  You have a $20 bill. If every human on earth suddenly forgot what money was, what would you be holding?
  *   **A.** I'd still be holding $20 worth of value, waiting for someone to rediscover it.
  *   **B.** I'd be holding paper with ink on it that *used* to have value because of economic laws.
  *   **C.** I'd be holding a piece of linen-blend paper. The value evaporates the moment the agreement ends.
  *   **D.** I'd be holding trash. Money is a fiction we tell to control resources.

  ### 4. The Alien Visitor
  An alien lands and scans humanity. They have no concept of human culture.
  *   **A.** They would identify race, gender, and money immediately; these are objective features of the universe.
  *   **B.** They would see biological clusters (skin, chromosomes) and resources, but not the social labels we put on them.
  *   **C.** They would see nothing but atoms. Race, gender, and money vanish without human observers to define them.
  *   **D.** They would see that "race" is a measurement error, but gender and money are functional tools.

  ### 5. The Esports Avatar (Case #2)
  A youth esports league creates a new competitive division based entirely on what avatar body players pick (e.g., "Tall/Thin" vs. "Short/Stocky"). They start treating this division like gender on signup forms.
  *   **A.** This is fake. Avatars are code, not bodies. You can't build a real division on a cartoon.
  *   **B.** It's not biological gender, but if it changes how the game is played, it creates a real competitive difference.
  *   **C.** If the league defines it as a category and everyone competes under those rules, it is a real social kind.
  *   **D.** Gender categories are outdated; using avatar stats is a more honest way to sort players.

  ### 6. The Time-Traveler's Gender
  A person travels back 500 years. They identify as non-binary.
  *   **A.** They are mistaken. Biology hasn't changed; their gender is fixed by their body.
  *   **B.** Their body is the same, but the social language to describe their experience didn't exist yet.
  *   **C.** Their gender is real now because we have the social rules to recognize it; back then, it literally couldn't exist as a category.
  *   **D.** Gender is a restrictive box. The time traveler is right to reject the old system entirely.

  ### 7. The Hospital Intake (Case #3)
  A hospital switches its intake from self-identified race to DNA ancestry percentages. They claim they are tracking the *same thing*, just more accurately.
  *   **A.** Yes. Race is biological. The hospital is finally measuring the reality instead of the guess.
  *   **B.** DNA is real, and race correlates to it, but the hospital is confusing a social identity with a genetic map.
  *   **C.** No. Race is how people are treated; DNA is where their ancestors lived. These are two different inventions.
  *   **D.** Race is a myth. DNA is real ancestry. The hospital should stop using the word "race" entirely.

  ### 8. The Gold Standard
  We switch back to gold coins. Is money more "real" now?
  *   **A.** Yes. Gold is an element. It is real like a tree is real.
  *   **B.** Somewhat. Gold has industrial uses, but its value as currency is still about trust.
  *   **C.** No. A gold coin is only money because we agree not to treat it just as a shiny metal.
  *   **D.** No. All currency is a control mechanism. The material doesn't matter.

  ### 9. The Forgotten Law
  A country passes a law, but the ink fades, the servers crash, and everyone forgets the law exists. Is it still a law?
  *   **A.** Yes. The truth of the law remains until it is formally repealed.
  *   **B.** It exists as a historical fact that *was* a law, but it has no power now.
  *   **C.** No. A law is a command enforced by a community. No memory = no law.
  *   **D.** Laws are just threats. If no one is threatening, the law was never real.

  ***

  ## The Scoring Key

  **Step 1: Tally your letters.**
  Count how many A's, B's, C's, and D's you selected.

  **Step 2: Check your "Race" answers.**
  Look specifically at **Question 4 (Alien)**, **Question 7 (Hospital)**, and **Question 1 (Tree/Tuesday - first half)**.
  *   If you mostly picked **D** on the Race-specific questions (Q4, Q7) but **C** on the Money/Gender questions (Q2, Q3, Q5, Q8), skip to **Result 4**.
  *   Otherwise, go to Step 3.

  **Step 3: Find your dominant letter.**
  *   **Mostly A's:** Result 1
  *   **Mostly B's:** Result 2
  *   **Mostly C's:** Result 3
  *   **Mostly D's:** (If not caught in Step 2): Result 4

  **Step 4: Check for Incoherence.**
  If you have a tie between **A** and **C**, or if you picked **A** on Money questions but **D** on Gender questions, read the "Incoherent Zone" note below.

  ***

  ## The Results

  ### Result 1: The Rock-Bottom Realist (Mostly A)
  **"It's real because it's there."**
  You believe the world comes pre-sorted. Race, gender, and money are discovered, not invented. To you, a $20 bill has value the way a rock has weight. If humans vanished, the categories would remain waiting for us to find them again. You likely view the Hospital's DNA switch as a correction of an error, and the Esports league as playing pretend.
  *   *Philosophical Label:* Across-the-board No-Nonsense Realism.

  ### Result 2: The Cause-and-Effect Pragmatist (Mostly B)
  **"It's real because it does something."**
  You occupy the sensible middle ground. You think there is a physical basis (biology, calories, paper), but social forces amplify or shape them. Race isn't *just* DNA, but DNA isn't irrelevant. Money isn't *just* paper, but the paper matters. You believe social forces cause differences without necessarily defining the *kind* of thing it is.
  *   *Philosophical Label:* Causal Constructionism (The Middle View).

  ### Result 3: The Social Architect (Mostly C)
  **"It's real because we say so."**
  You are a full-blown constitutive constructionist. You believe collective agreement and rules make things so. The Antarctic chocolate *is* money because the crew treats it that way. The Esports avatar division *is* a gender-like category because the league made it one. Without human minds to hold the concept, these things vanish entirely.
  *   *Philosophical Label:* Constitutive Constructionism.

  ### Result 4: The Sorter (Mixed View) (Mostly D, or Split C/D)
  **"Some boxes are tools, some are traps."**
  You are an eliminativist about race combined with a constructionist about gender and money. You likely answered that Race is a myth or a measurement error (Q4, Q7), but you accept that Money and Gender function as real social tools (Q2, Q5). You believe we should eliminate the category of "race" entirely while maintaining "gender" and "money" as useful human inventions.
  *   *Philosophical Label:* Eliminativism (Race) + Constructionism (Gender/Money).

  ***

  ## The "Wait, What?" Zone

  ### ⚠️ The Incoherent Flag
  If you scored **A on Money** (Money is physical like gold) but **D on Gender** (Gender is a myth/trap), your view is likely **Incoherent**.
  *   **Why:** Usually, if you believe currency value is intrinsic to the object (Realism), you also believe biological categories are intrinsic to the body. Claiming money is a "tree" but gender is "fake" requires a very specific, unstable philosophical balancing act that most people don't hold consistently.
  *   **Verdict:** This spot is empty because it is logically unstable. You probably answered one question about how the world *is* and the other about how the world *ought to be*.

  ### 🌫️ The Unexplored Combo
  If you scored **B on Race** (DNA correlates) but **C on Money** (Agreement makes value), you are in a common but **Unexplored** spot.
  *   **Why:** Many people hold this view, but philosophers rarely map it cleanly. It suggests you think biology constrains us (Race) but culture frees us (Money). This isn't incoherent, just under-theorized in popular debate.

  ### 🔍 The Indistinguishable Pair
  This quiz cannot reliably separate **Result 2 (Causal Pragmatist)** and **Result 3 (Social Architect)**.
  *   **Why:** In short vignettes, saying "Social forces shape this biological reality" (Causal) sounds almost identical to "Social forces define this reality" (Constitutive). To truly separate them, we would need to ask if the category would exist *without* the social force, which is hard to test in a 3-sentence story. If you landed here, you likely believe in the power of social context, regardless of the technical label.
