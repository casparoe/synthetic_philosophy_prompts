  I was trying to make sense of the Judy Benjamin problem from an old forum summary and it left me more confused than before. The summary said Judy starts out 50/50 between Blue Company (three battalions) and Red Company (two battalions), then her CO tells her "if you're in Red, you're in First Battalion." The poster claims this is basically the same as learning she's not in First Battalion under Blue, so standard Bayes should push her credence in Red down to 1/3. Then they say van Fraassen used this to show Jeffrey conditioning gives 1/2 instead, which conflicts with Bayes, and the only fix is to reject Jeffrey conditioning for conditonal updates and use strict conditionalization on the antecedent, treating the conditional like material implication. Finally they claim this proves probabilistic logic can't represent conditional beleif at all, so we need a separate non-probabilistic revision logic for conditionals.

  Is this fair? I feel like the "same information as not being in First Battalion" part is wrong, and I'm suspicious that the jump to "probability logic collapses" doesn't follow. Can you audit it piece by piece: what's accurate about the setup and the tension between update rules, what's misrepresenting Jeffrey conditioning or van Fraassen's actual point, and whether the conclusion that we need a separate revision logic survives once the errors are fixed? Also, where exactly does the summary conflate learning a conditional with learning its consequent?
