      *   *Claim 2 (Multiple Realizability):* Translates *cleanly*. This is literally Universality. However, the *interpretation* bends. Philosophers see it as an obstacle to reduction; physicists see it as the mechanism of robustness (which implies a different kind of reduction via the fixed point).
      *   *Claim 3 (Strong Emergence):* Translates *poorly/no counterpart*. Physics has "singular limits," but physicists generally deny "ontological novelty" in the sense of violating micro-laws. We say the degrees of freedom change, but the Hilbert space is consistent. Philosophers want "causal powers" that might imply dualism or violation of closure.

