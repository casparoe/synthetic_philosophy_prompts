answer: |-
  Your intuitions are remarkably consistent, but your proposed theoretical framework ("respecting the public evidential record") is too blunt to explain them. If the rule were simply about the evidential record, Case 3 (moving the suicide to a church) should be a violation (it contradicts the physical record), and Case 6A (compressing time) should be a violation (it contradicts the chronological record). Yet you judge both as permissible.

  The tension in your "Problem Pair" (merged chronology vs. invented meeting) reveals that your concern isn't about *facts* per se, but about **agency**.

  Here is a precise formulation that saves your verdicts without forcing you to bite a bullet, followed by the application to the AI case.

  ### The Principle: Non-Fabrication of Causal Agency

  Your "posthumous hermeneutic contract" should be rewritten not around *evidence*, but around the **locus of causality**. The dead have an interest in not having the *sources* of their actions rewritten.

  **Clause 1 (Permissible Alteration of Context):** It is permissible to alter the *circumstances* surrounding a subject's life (timing, setting, exact wording, sequence) provided these alterations serve narrative economy and do not attribute new *motives* or *decision-points* to the subject.
  *   *Applies to:* Case 1 (Dialogue matching papers), Case 3 (Suicide location), Case 4 (Voiceover translation), Case 6A (Merged chronology).
  *   *Why:* In Case 6A, the politician's shift in ideology remains caused by the same public pressures and internal logic; the timeline is just compressed. In Case 3, the *act* of suicide and its psychological weight remain the same; only the backdrop changes.

  **Clause 2 (Impermissible Fabrication of Will):** It is impermissible to invent specific interpersonal dynamics, private decision-points, or hidden causal nodes that explain *why* the subject became who they were. This colonizes the subject's moral interiority.
  *   *Applies to:* Case 2 (Mocking allies), Case 5 (Hidden romance), Case 6B (Invented secret meeting).
  *   *Why:* In Case 6B, even if the meeting is symbolic, it attributes the politician's shift to a specific, fabricated interaction (a deal, a threat, a persuasion). You are not just compressing time; you are fabricating the *mechanism of their will*. In Case 2 and 5, you are fabricating the *emotional texture* of their relationships.

  ### Repairing Your Contract
  You do not need to drop either verdict in your Problem Pair. You need to drop the idea that this is about the "evidential record." It is about **Moral Causality**.

  *   **Merged Chronology (6A)** preserves the *trajectory* of the subject's agency. The speeches happened; the shift happened. The link between them is historical.
  *   **Invented Meeting (6B)** fabricates the *engine* of the subject's agency. It implies, "He changed his mind *because* of this person/room/moment." That is a claim about the subject's internal decision-making process that the historical record does not support.

  Your gut reaction is correct: Merging real events is editing; inventing a causal meeting is puppetry.

  ### Application: The AI Voice Synthesis Case

  The documentary using AI to make a dead poet "perform" with speculative cadence is a **violation**, and it belongs in a distinct, severe category. It is not Case 4 (Translation); it is closer to Case 2 (Private Letter) but worse.

  Here is why it fails the **Non-Fabrication of Causal Agency** test:

  1.  **Biometric Agency:** Text is abstract; voice is biometric. A poet's written words are public evidence (Case 1), but the *cadence, breath, and timbre* of a voice are physical acts of the living body. To synthesize them is to simulate a biological agency the subject no longer possesses and never authorized for that specific text.
  2.  **Fabrication of Performance:** Poetry is often written to be read silently or performed in ways the author controls. By specifying the emotional cadence via AI, the filmmaker is not translating (Case 4); they are **directing the dead**. They are forcing the subject to "act" out an emotion they may not have felt in that specific way.
  3.  **The Uncanny Valley of Will:** Unlike a voiceover narrator *describing* grief (Case 4), the AI voice *enacts* the grief. It collapses the distance between the interpreter and the subject. It creates the illusion that the dead poet is *speaking now*, which violates the fundamental ontological boundary of death.

  **Verdict:** This is a **Necromimetic Violation**. It bypasses the "hermeneutic" layer (interpretation) and moves straight to "simulation." It violates Clause 2 because it invents a *performance* (a causal act of delivery) that never happened. It is closer to inventing the hidden romance (Case 5) because it claims an intimacy (the sound of their voice in your ear) that the historical record does not grant you.

  ### Summary for Your Seminar
  Your intuitions hang together perfectly if you shift the framework from **Epistemology** (what can we know/prove?) to **Ethics of Agency** (who owns the cause of the action?).

  *   **OK:** Editing the stage, the script, and the timeline.
  *   **Not OK:** Rewriting the character's motivation, relationships, or the causal mechanism of their decisions.
  *   **AI Voice:** Not OK. It rewrites the biological instrument of the agency itself.

  You don't need to bite a bullet on your verdicts. You just need to sharpen the blade of your principle.
