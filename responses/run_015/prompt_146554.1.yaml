answer: |-
  Colleagues, friends, and students: welcome to "The Inviolate Level."

  We gather under a title that suggests a search for bedrock. In physics, we might look for the fundamental particle; in biology, for the replicator; in philosophy, for the first principle. We often assume that explanation must flow downward, from the complex to the simple, until it strikes a level that explains everything else but is itself unexplained. An inviolate base. A hand that draws, but is not drawn.

  For thirty years, I studied how organisms change their traits in response to their environments. For most of that career, I operated under a specific hierarchy. The gene was the inviolate level. It was the stable information source, the hand that drew the organism. The environment was the paper—the passive surface upon which the phenotype was sketched. My job was to trace the lines from the genotype to the trait.

  But as my work progressed into phenotypic plasticity and organism-environment feedback, the paper began to push back. We found that organisms do not merely survive in environments; they construct them. Beavers build dams that alter selection pressures; earthworms modify soil chemistry that regulates their own evolution. The organism changes the context, and that changed context dictates which genes persist.

  Suddenly, the gene could not be the sole author. The gene draws the organism, but the organism, through niche construction, draws the environment that selects the gene. There is no epistemically prior hand. We are left with a biological analog of M. C. Escher's *Drawing Hands*. In that lithograph, one hand sketches the cuff of the other, while the second hand simultaneously sketches the cuff of the first. There is no origin point. The ink emerges from a loop, not a foundation.

  This workshop is not about solving that image so that one hand becomes real and the other becomes illusion. It is about learning to speak while inside the drawing.

  This imposes specific constraints on how we proceed over the next three days. If there is no inviolate level, there is no external arbiter to settle our disputes. We cannot assume that science provides the raw reality and philosophy provides the commentary. Nor can we assume philosophy provides the conceptual framework and science provides the mere instantiation. We are mutually constitutive.

  Therefore, I propose two ground rules for our discussion.

  First, to my colleagues in philosophy: do not treat scientific practice as raw, untheorized data. When you analyze how biologists construct models or classify species, remember that we are already operating within a dense web of theoretical commitments. We are not handing you neutral facts; we are handing you drawings that are already partially inked. Your job is not to find the error in our sketch, but to understand why we hold the pen the way we do.

  Second, to my colleagues in science: do not treat philosophical framing as external ornament. Concepts like "causation," "function," and "level" are not decorative flourishes to be added after the work is done. They are the structural beams holding up your experimental design. If you ignore the philosophical load-bearing walls because you view them as abstract, you risk building on air.

  We are here because the loop is real, and it is productive. The tension between the gene and the niche did not stop biology; it enriched it. It forced us to develop new mathematics, new field methods, and new ways of thinking about time and inheritance. The lack of an inviolate level is not a failure of explanation; it is a feature of complex systems.

  I stand before you as a retired biologist who has recently begun reading philosophy with the enthusiasm of a convert, but with the map of a tourist. I know the terrain of the organism, but I am still learning the grammar of the explanation.

  And so, I will conclude with this admission: I do not yet know how to resolve the recursion. I do not know if there is a meta-language capable of describing the loop without stepping outside of it—which the image tells us is impossible. I do not know if my biological intuition about feedback is sufficient to ground the philosophical problem, or if the philosophical problem reveals a blindness in my biological intuition.

  I am one of Escher's hands. The vocabulary I bring from the lab is trying to draw the vocabulary I am borrowing from philosophy, even as that philosophical vocabulary defines the limits of what my biological concepts can mean. I cannot show you the wrist where the drawing begins, because I cannot find it.

  That uncertainty is not a weakness I apologize for; it is the reason this workshop exists. If we knew which hand was real, we would not need to talk to one another. We would simply take orders from the base level. But since we are suspended in the drawing, we must negotiate the ink together.

  Thank you. Let us begin.
