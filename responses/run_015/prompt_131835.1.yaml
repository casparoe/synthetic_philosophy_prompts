answer: |-
  **Project Title:** The Dynamics of Broadcasting: Reconstructing the Access/Phenomenal Split via Workspace Stability

  **The Pitch**
  Look, the Block-vs-Dehaene debate is stuck. On one side, you have Phenomenal Concept Strategists arguing consciousness overflows access. On the other, you have Global Workspace Theory (GWT) proponents arguing that "consciousness" just *is* global broadcasting (access). Usually, this turns into a fight about reportability.

  I want to bypass that. I think GWT is actually sophisticated enough to save the phenomenon Block is pointing at, but only if we stop treating "broadcasting" as a binary on/off switch.

  My core hypothesis: **Global broadcasting has two distinct failure modes.**
  1.  **Reach Failure:** Information enters the workspace but doesn't propagate to enough downstream modules (e.g., speech, motor planning).
  2.  **Stability Failure:** Information hits the modules but decays too quickly to sustain integration.

  I'm arguing that **Phenomenal Consciousness (P-Con) survives Reach Failure but collapses under Stability Failure.** This means you can have a "wide but shallow" broadcast that feels like something (P-Con) but can't be reported (Access fails). This reframes the Access/P-Con distinction not as a battle between functionalism and dualism, but as a distinction between *spatial reach* and *temporal stability* within a single workspace architecture.

  **The Research Question**
  *Does the temporal stability of global broadcasting, independent of its modular reach, constitute the necessary condition for phenomenal consciousness?*

  **Why This Gap Exists**
  Current GWT literature (Dehaene, Changeux, etc.) tends to treat the "ignition" threshold as a unitary event. If you cross the threshold, you're conscious; if you don't, you're not. They conflate "broadcasting to enough systems to report" with "broadcasting long enough to feel."

  Conversely, Block's critics argue that if it's not accessible, it's not conscious. They miss the nuance that a signal could be globally available (phenomenally) but too unstable to be grabbed by the specific modules required for report (access).

  Nobody has formally dissected GWT's broadcasting mechanism into *reach* vs. *stability* variables to see if that maps onto the Access/P-Con split. That's the opening.

  **Methodology (6 Months, No Lab Coat)**
  This is pure conceptual analysis and model-building. No fMRI, no behavioral experiments.

  1.  **Month 1-2: Taxonomy of Failure.** I'll formalize the Reach vs. Stability distinction within the existing GWT literature. I need to define what "stability" looks like in a computational workspace (e.g., recurrent loop persistence).
  2.  **Month 3-4: Case Studies.** I'll re-evaluate standard psychophysics cases through this new lens:
      *   *Subliminal Priming:* Traditionally "unconscious." I'll argue this is likely a **Reach Failure** (signal dies before hitting report modules) but might retain micro-stability.
      *   *Inattentional Blindness:* Traditionally "unseen." I'll test if this is actually a **Stability Failure** (signal hits workspace but isn't stabilized by attention loops).
      *   *Iconic Memory:* The strongest case. High phenomenology, rapid decay. This looks like high Reach, low Stability.
  3.  **Month 5-6: Synthesis & Drafting.** Construct the argument that P-Con is the *persistence* of the broadcast, while Access is the *distribution* of the broadcast. Draft the final paper.

  **What Success Looks Like**
  *   A working manuscript (approx. 8,000 words) ready for submission to a journal like *Philosophical Psychology* or *Neuroscience of Consciousness*.
  *   A refined GWT model that accommodates "phenomenal overflow" without needing to posit non-functional qualia. Basically, I want to functionalize P-Con in a way that Blockians can accept and GWT folks don't hate.
  *   Clear definitions for "Reach" and "Stability" that other theorists can use.

  **What Kills This Project (Risk Assessment)**
  *   **The Collapse Risk:** If I find that "Stability" is just a subset of "Access" (i.e., you can't have stability without reportability), the distinction collapses and I'm back to square one.
  *   **The Empirical Mismatch:** If the cognitive science on iconic memory or inattentional blindness has shifted in a way that makes my conceptual mapping impossible (e.g., if new data shows subliminal priming *does* involve global ignition), the argument loses its footing.
  *   **Scope Creep:** Trying to fix *all* of GWT. I need to stay focused strictly on the Reach/Stability split.

  **Scope Check**
  Six months is tight but doable for a conceptual paper. The constraint is **no empirical work**. I am relying on existing experimental data (priming, masking, blindness studies) interpreted through a new philosophical framework. If I start needing to verify the neural correlates of "stability" myself, I'll blow the timeline. I have to stay in the armchair, analyzing the logic of the workspace model.

  **Bottom Line**
  I'm not trying to kill GWT. I'm trying to upgrade it. By splitting broadcasting into reach and stability, we can explain why we feel more than we can report, without leaving the functionalist camp. It's a patch for GWT that solves the Block problem from the inside.
