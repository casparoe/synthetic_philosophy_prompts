      *   *Correction on Vignette A:* The prompt says "no measurable loss in... fertility." BST defines health by contribution to survival/reproduction. If fertility is intact, BST *must* say it's healthy, even if they can't keep a 9-5 job. This highlights the "Social Harm vs. Biological Dysfunction" gap.
