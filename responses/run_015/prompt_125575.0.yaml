          *   *Fatal:* **Tiling Agents / Successor Trust.** Even if *I* don't trust *me* fully, can I trust *my successor*? If I want to self-improve, I need to trust the next version. Boundedness makes this hard to chain.
          *   *Serious:* **Logical Induction isn't Instant.** It solves it asymptotically. If the user claims real-time stability, that's a defeater.
          *   *Empirical:* **Model Collapse.** Self-training LLMs degrade. This is the empirical analog.
      *   *Falsifiability:* Be honest. If "boundedness" is a free parameter tuned to avoid crashes, it's unfalsifiable. Needs a prior definition of "bounded."
