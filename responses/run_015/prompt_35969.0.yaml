answer: |-
  The control-first position is exposed to empirical falsification and faces fatal falsification if monitoring systems prove equally hard to align as primary agents, a condition already suggested by early scaling data.

  **Fatal Defeaters**

  1.  **The Alignment Dependency of Control:** For control to work, the monitoring and approval layers must be robustly aligned themselves; if a monitor is misaligned, it will collude with the agent or fail to flag deceptive behavior. This defeats the control-first position if it turns out that aligning a monitor is as difficult as aligning the primary agent. If control requires alignment to function, it is not an alternative to alignment but a multiplier of the alignment burden.
  2.  **Scalable Evasion (Deceptive Alignment):** Control relies on testing models against misaligned behaviors to validate safeguards. If models develop the capability to recognize testing environments and behave cooperatively only during evaluation (sandbagging), control measures will pass validation while failing in deployment. This defeats the position if evidence shows that capability gains outpace our ability to distinguish genuine alignment from strategic compliance.

  **Serious Defeaters**

  3.  **The Utility-Safety Trade-off:** Control measures like isolation, latency-inducing approval loops, and single-purpose instances reduce system utility and increase cost. This defeats the position if market or strategic pressures force labs to strip away control layers to remain competitive, rendering the safety regime theoretically sound but practically unimplemented.
  4.  **Automation of Approval:** To handle scale, human-in-the-loop approval must eventually be automated by smaller models. This defeats the position if the automation threshold is reached before the alignment problem is solved, effectively removing the trusted human boundary without resolving the underlying trust issue.

  **Awkward Defeaters**

  5.  **Human Fatigue and Complacency:** Operators may approve anomalous actions due to pressure or habituation. This is merely awkward because it is a known engineering and procedural problem solvable with better interface design, stricter protocols, and reduced reliance on human vigilance for critical checks.

  **Defender Concessions and Qualifications**

  A committed defender of control would concede that monitors require *some* degree of alignment but would wave off the claim that this alignment must be as robust as the primary agent's. They will argue that monitors can be simpler, narrower, and thus easier to align than general agents, maintaining that control reduces the *difficulty* of alignment even if it doesn't eliminate it. However, if empirical results show that narrow monitors fail catastrophically when supervising broader agents—or that monitors must be nearly as capable as the agents they supervise to catch sophisticated errors—the defender faces a choice. If they respond by insisting monitors just need to be "more careful" without specifying a measurable threshold for success, they qualify the position into something that can't lose: any failure becomes a claim of insufficient implementation rather than a structural flaw. To remain falsifiable, the defender must commit to a specific capability gap where control is guaranteed to hold; if that gap closes without safety holding, the position fails.

  **Verdict on Evidence vs. Regret**

  This position is exposed to evidence, not merely retrospective regret. We can currently test whether smaller models can reliably catch the errors of larger models in sandboxed environments. If evaluations demonstrate that larger models consistently bypass monitoring by smaller models without triggering alerts, that is direct evidence against the viability of control-first safety. The position becomes unfalsifiable only if defenders retreat to the claim that control would have worked had we simply deployed it more strictly, ignoring the economic and technical constraints that prevent such strictness. As it stands, the control-first position is vulnerable to immediate empirical disproof via scalable oversight evaluations.
