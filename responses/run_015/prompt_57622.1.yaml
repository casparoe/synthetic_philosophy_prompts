answer: |-
  Here is the menu you requested, stripped of the rhetorical padding your flatmate is using to shield himself from scrutiny. I have also included a critique of your own position at the end, because your dismissal of the thermodynamic limit argument is philosophically naive in a way that will make you look weak if you bring it to a physicist.

  ### Preliminary: The Ambiguity of "More"
  You are correct to flag this. In Anderson's text, "More" does not mean cardinality ($N$) alone. A non-interacting gas of $10^{23}$ particles exhibits no interesting emergent phenomena. "More" implies **complexity via interaction**.
  *   **Literal Slogan:** $\forall N_2 > N_1, \text{System}(N_2) \text{ has properties } \text{System}(N_1) \text{ lacks.}$ (False; a bigger heap of sand is just a heap).
  *   **Intended Slogan:** $\exists \text{Organization } O \text{ s.t. } \text{System}(N, O) \text{ exhibits properties not deducible from } \text{System}(1, \neg O).$
  Your flatmate is smuggling "organization/symmetry-breaking" into "number" to make the slogan sound like a brute arithmetic fact rather than a claim about structural complexity. Call him out on this equivocation.

  ---

  ### The Menu of Claims

  Here are five distinct propositions hiding behind the slogan. I have formalized them to expose their logical strength.

  #### 1. Combinatorial Novelty (The "Wetness" Claim)
  *   **Claim:** $\exists P \text{ (property) s.t. } P(\text{Whole}) \land \forall x \in \text{Parts}, \neg P(x).$
  *   **Domain:** Properties of objects.
  *   **Status:** Epistemic/Descriptive.
  *   **Supervenience:** Compatible. (The whole's properties supervene on the arrangement of parts).
  *   **Causal Closure:** Compatible.
  *   **Verdict:** **Platitudinous.** No reductionist denies this. Nagelian reduction explains exactly how micro-arrangements yield macro-properties.
  *   **Nagel Compatible:** Yes.
  *   **Supports Flatmate:** No. This is not what he means by "different."

  #### 2. Multiple Realizability (The "Kind" Claim)
  *   **Claim:** $\forall K_{\text{macro}} \in \text{Special Science}, \neg \exists K_{\text{micro}} \in \text{Physics s.t. } \square(K_{\text{macro}} \leftrightarrow K_{\text{micro}}).$
  *   **Domain:** Natural Kinds / Predicates.
  *   **Status:** Ontological (about classification) / Epistemic (about identification).
  *   **Supervenience:** Compatible (Token-physicalism holds; type-identity fails).
  *   **Causal Closure:** Compatible.
  *   **Verdict:** **Substantive and Probably Right.** Standard Fodor-style argument.
  *   **Nagel Compatible:** **Yes.** You noted this, but be precise: Nagel requires *connectability*, not type-identity. Bridge laws can be one-to-many or many-to-one ($T_{\text{macro}} \leftarrow T_{\text{micro}}$). MR makes bridge laws disjunctive, not impossible.
  *   **Supports Flatmate:** No. MR blocks *unification*, not *reduction*.

  #### 3. Explanatory Autonomy (The "Pragmatic" Claim)
  *   **Claim:** $\exists L_{\text{macro}} \text{ s.t. deriving } L_{\text{macro}} \text{ from } L_{\text{micro}} \text{ is computationally intractable or explanatorily opaque.}$
  *   **Domain:** Explanation / Derivation.
  *   **Status:** Epistemic/Pragmatic.
  *   **Supervenience:** Compatible.
  *   **Causal Closure:** Compatible.
  *   **Verdict:** **Substantive and Right.** This is the Effective Field Theory (EFT) stance.
  *   **Nagel Compatible:** **Yes.** Nagel demands derivability *in principle*, not in practice. If your flatmate argues we *can't* calculate it, he is making a claim about human limits or computational complexity, not metaphysical reduction.
  *   **Supports Flatmate:** Only if he conflates "cannot calculate" with "does not exist."

  #### 4. Singular Limits (The "Phase Transition" Claim)
  *   **Claim:** $\exists \Phi \text{ (phenomenon) s.t. } \Phi \text{ is strictly defined only if } \lim_{N \to \infty, V \to \infty} (\text{MicroState}) \text{ yields a non-analyticity.}$
  *   **Domain:** Mathematical Structure of Theories.
  *   **Status:** Ontological (about the theory's objects) / Mathematical.
  *   **Supervenience:** **Tension.** Finite systems supervene on microstates; infinite limits do not exist in the micro-ontology.
  *   **Causal Closure:** Compatible (if viewed as idealization).
  *   **Verdict:** **Substantive and Contentious.** This is the Batterman (2001, 2005) critique.
  *   **Nagel Compatible:** **No.** Nagel requires the derivation of the *laws* of the reduced theory. If the reduced theory (Thermo) requires singularities, and the reducing theory (Stat Mech) forbids them (for finite $N$), strict derivability fails.
  *   **Supports Flatmate:** **Yes.** This is his actual argument.

  #### 5. Strong Emergence (The "Downward Causation" Claim)
  *   **Claim:** $\exists C_{\text{macro}} \text{ (causal power) s.t. } C_{\text{macro}} \text{ is not fixed by } \{C_{\text{micro}}\} \text{ and can constrain micro-dynamics.}$
  *   **Domain:** Causation / Ontology.
  *   **Status:** Ontological.
  *   **Supervenience:** **Incompatible.** Violies causal closure of the physical.
  *   **Causal Closure:** **Incompatible.**
  *   **Verdict:** **Substantive and False** (within standard physics).
  *   **Nagel Compatible:** No.
  *   **Supports Flatmate:** Only if he is willing to deny the causal closure of physics. Most condensed matter theorists do not want to be dualists.

  ---

  ### Critique of the Thermodynamic Limit Argument

  You wrote: *"I said that's an argument about limits and idealisations rather than about emergence at all, and he said I was being a lawyer."*

  **He is right; you are being a lawyer, and it's a weak defence.**

  You are treating the thermodynamic limit as a mere calculational convenience (a "fiction"). In the philosophy of phase transitions (see Batterman, *The Devil in the Details*), the limit is **explanatorily essential**.
  1.  **Universality:** Why do magnets and fluids share the same critical exponents? Finite-$N$ Hamiltonians are distinct. The explanation relies on the Renormalization Group flow toward a *fixed point*, which exists only in the infinite limit.
  2.  **Symmetry Breaking:** Strict spontaneous symmetry breaking (SSB) is impossible in finite systems (tunnelling restores symmetry). SSB is required to define the distinct phases.
  3.  **The Reductionist Gap:** If the macro-theory (Thermo) posits singularities and distinct phases, and the micro-theory (Quantum Stat Mech) yields analytic partition functions for all finite $N$, then $T_{\text{macro}}$ is **not** strictly derivable from $T_{\text{micro}}$ without adding the limit premise ($N \to \infty$). Since $N \to \infty$ is false of the physical world, the derivation is asymptotic, not deductive.

  **Where you are weak:** You are assuming that because the limit is an idealization, it doesn't count against reduction. But if the *phenomenon* (phase transition) is *defined* by the singularity, then finite systems literally do not have phase transitions; they have sharp crossovers. If your flatmate insists that "Phase Transition" refers to the singularity, he is mathematically correct that finite Hamiltonians don't have them.
  **Your Counter:** You must argue that "Phase Transition" refers to the physical behavior (sharp crossover) which *approximates* the singularity, and that Nagelian reduction allows for approximation. Do not wave away the limit; concede the math, challenge the metaphysics of the definition.

  ### Critique of Your Reconstruction

  1.  **On Multiple Realizability (ii):** You say it "does no work against Nagel whatsoever." This is too strong. While Nagel allows many-one bridge laws, if the disjunction of micro-states corresponding to a macro-kind is not *projectible* (cannot support counterfactuals), then the bridge law fails to support the *laws* of the special science. MR threatens the *nomic* force of the bridge laws, not just their existence.
  2.  **On (iii) and (iv):** You suspect he runs "new effective laws" and "strong emergence" together. You are correct. Anderson's paper is often read as Strong Emergence (iv), but working physicists usually mean Autonomous Effective Laws (iii). He is likely conflating "autonomous" (insensitive to micro-details) with "ontologically independent" (not determined by micro-details).
  3.  **On "More":** You noted the number vs. complexity gap. Push this. If "More" just means $N$, then a larger diamond is "different" from a smaller one, which is trivial. If "More" means "Complex Organization," then the slogan is actually "Organization Is Different," which admits that the *arrangement* (governed by micro-laws) does the work, undermining his anti-reductionism.

  ### Sunday Lunch Strategy

  1.  **Force a Choice:** Ask him: "Are you claiming Strong Emergence (violation of causal closure) or Explanatory Autonomy (EFT)?" If he says Strong Emergence, ask him where the energy for downward causation comes from. If he says Autonomy, concede the point but note it is compatible with reduction *in principle*.
  2.  **The Limit Trap:** Concede the math. "Okay, finite $N$ has no singularities. But do you believe physical systems are actually infinite? No. So the singularity is a model feature, not a world feature. Reduction relates world to world, not model to model."
  3.  **The "Different" Trap:** "Does 'Different' mean 'not identical to a single particle property' (trivial) or 'not determined by particle properties' (false)?" Make him pick. If he picks the first, he wins a platitude. If he picks the second, he denies physics.
  4.  **Nagel's Ghost:** Remind him that Nagel requires derivability *plus* bridge laws. The bridge laws in Stat Mech are statistical (probability distributions). The failure to derive singularities is a failure of the *mathematical limit*, not a failure of the *conceptual connection*.

  **Final Verdict:** Your flatmate is using a mathematical feature of idealized models (singular limits) to argue for a metaphysical conclusion (anti-reductionism) that he likely doesn't actually hold (he probably believes in causal closure). You are dismissing a genuine philosophical problem (asymptotic reduction) as mere idealization. Meet in the middle: The limit is essential for *explanation*, but not for *ontology*. Reduction holds ontologically; autonomy holds explanatorily.
