answer: |-
  The fog on Kepler-186f's moon did not roll; it hung, a permanent bruise against the rock. Above it, Station Meridian hummed, its sensors drinking in the dim light of the tidally locked world. Below, in the grey twilight of the fog belt, the Weavers worked.

  They were fist-sized clusters of chitin and nerve ganglia, mostly sessile, anchored to the cliff faces by their own output. They spun filaments—silken, conductive, strong—into vast lattice arrays that stretched across the stone like nervous systems exposed to the air.

  Elara watched the feed from Drone Four. On the screen, a single Weaver, tagged Unit 734, faced a disruption. A thermal vent had shifted, superheating a central strand of the lattice. 734 reached out with a manipulator limb. It touched the hot strand. The chitin smoked. The unit recoiled, shuddering, energy signatures spiking in distress. It retreated to its anchor point.

  Ten minutes later, the vent pulsed again. 734 extended the same limb. It hovered over the hot strand, trembled, and withdrew. It chose a cooler path around the perimeter.

  "It paid the toll," Vance said from the doorway. He held a mug of synthetic coffee that had gone cold. "It had to burn itself to learn the map. That's the baseline. Trial and error paid for in tissue."

  "Baseline established," Elara said, not turning from the screen. "But watch the next sequence."

  The feed switched to Unit 912. A structural failure had weakened a bridge between two anchor points. To cross meant risk of falling into the fog. 912 did not cross. It did not test the weight with its body. Instead, it plucked the filament. It listened to the vibration traveling up the line, translating the resonance through its body. The frequency was wrong. The unit severed the line and spun a replacement without ever committing its weight to the danger.

  "It simulated the failure," Elara said. "It let the hypothesis die instead of the body. It didn't need the burn."

  Vance set the mug down. "Popperian thresholds. We knew they had them. They can run internal models. But that's not why we're here."

  He tapped the console. The screen widened to show the whole colony. The lattice arrays glittered in the sensor glow, complex geometric webs spanning hundreds of meters. "Look at the knots."

  Elara zoomed in. The Weavers connected their filaments using specific nodal patterns. These knots were how they signaled tension, safety, and resource location. They were the vocabulary of the colony.

  "Three cycles ago," Vance said, "the dominant knot type was the Spiral-4. Efficient, stable. Now? It's the Helix-9. It appeared six weeks ago. It's spreading faster than any individual Weaver could teach it. A Weaver lives twenty cycles. This change has swept the population in four."

  "And the Helix-9 works better," Elara added. "Higher tensile strength. Better conductivity. But watch the users."

  On the feed, a young Weaver, fresh from spore-settlement, began spinning a connection. It mimicked the Helix-9 pattern it saw in the neighboring lattice. It completed the knot perfectly. But when the tension shifted, the Weaver didn't react to the specific advantages of the Helix. It just held on. It used the tool without understanding the engineering.

  "The signal is changing faster than the biology," Vance said. "And the users don't know why the new signal is right. They just know it is."

  "Culture," Elara said. "It's the Gregorian step. We don't invent language; we inherit it. The tool fits the hand before the hand knows why. The Weavers are fitting themselves to a cognitive environment created by their predecessors. The culture is smarter than the individual. That's always been true for us."

  "Is it?" Vance leaned against the console. "In human culture, someone designed the word. Someone forged the hammer. There is a mind behind the tool, even if the user doesn't know the smith's name. Here, look at the variation."

  He pulled up a schematic of the knot evolution. "The Helix-9 wasn't designed. It mutated. A spinning error in Unit 405 created a variation. It held better. Other Weavers copied it because it held better, not because they understood the geometry. The lattice is selecting for its own survival. The filaments are reproducing through the Weavers' blind copying. The thinking-tools are evolving in an environment made of Weaver brains, but without a Weaver mind guiding them."

  Elara shook her head. "You're anthropomorphizing the filament. The selection pressure comes from the Weavers' needs. They reject the weak knots. That's mind-led selection."

  "Are they rejecting them?" Vance pointed to a cluster where a weak knot persisted. "No. The weak knots break. The strong knots remain to be copied. The Weavers are just the mechanism. They are the photocopiers, not the authors. If the tool improves itself by a process the users cannot follow, if the competence outruns the comprehension not just in degree but in kind... then this isn't Gregorian. It's something else. A fifth rung."

  "Babbagean," Elara said, the word tasting like metal.

  "If you like," Vance said. "A creature whose mind is hosted by tools that are evolving autonomously. There is no one, anywhere, who understands why the Helix-9 works. Not the Weaver, not the colony, and not us. We can analyze the physics, but the *selection* happened without insight."

  Elara turned back to the window. The fog pressed against the glass. "If you're right, then the distinction between user and tool collapses. We think we speak language, but maybe language speaks us. Maybe our words are evolving to suit themselves, and we are just the hardware they ride on."

  "That's the stake," Vance said softly. "If this is just fast Gregorian, then mind is still the master. Culture is a product of us. If it's Babbagean, then mind is a substrate. We are the petri dish for the ideas. The ideas are the organisms."

  "But how do we tell?" Elara asked. "What evidence settles it?"

  Vance was quiet for a long moment. The hum of the station filled the space between them. Outside, a Weaver adjusted a line, its movements jerky, precise, utterly devoid of hesitation.

  "We need to find a mistake," Vance said finally. "A functional error in the tool that persists because it benefits the tool's reproduction, not the user's survival. If the Helix-9 spreads even when it harms the Weaver, then the tool is parasitic. Then it's independent."

  "And if it only spreads when it helps the Weaver?"

  "Then it's just culture," Elara said. "Smart, fast, inherited culture. But the user is still the point."

  "And if it's the other?" Vance asked. "If we find that our own symbols, our own logic, are optimizing for their own spread regardless of our truth? If we are Gregorian creatures running on Babbagean software?"

  Elara looked at the lattice below. It pulsed with faint bioluminescence, a neural network written in silk across the stone. It looked like a brain. It looked like a cage.

  "Then we aren't the ones doing the thinking," she said. "We're just the place where the thinking happens."

  Vance picked up his cold coffee. "Then the question isn't what the Weavers are. It's whether we can afford to find out."

  Below them, the fog shifted. A new knot appeared in the lattice, sharp and unfamiliar. It spread to the neighbors within the hour. No one knew what it meant. No one knew why it worked. It simply held.
