          1.  Numbered claims both accept (peerhood, disagreement norms).
          2.  Disagreements Table (stated in User's words, stated in Priya's words, flag verbal disputes).
          3.  Cruxes (sub-questions that would move minds) with specific tests/evidence/predictions.
