      *   Ensure the "2022 migration" is central.

  *(Self-Correction on the "Averaging" stat)*: The prompt says "on the 11 questions where we started more than 15 points apart, the straight average... would have scored better than either of us alone." Priya thinks this is a small-sample artifact. I need to make sure her counter-argument is statistically sound in the text. (Yes, Brier score variance on N=11 is high).

  *(Self-Correction on Peerhood)*: The prompt asks to address "is it even symmetric here." I need to explicitly state that we accept asymmetry in calibration but symmetry in deliberative weight.

