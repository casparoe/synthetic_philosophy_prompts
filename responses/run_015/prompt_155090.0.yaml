      *   **Roles:** User = Conciliationist (move toward peer). Priya = Steadfast (disagreement is evidence, but doesn't mandate moving if argument is superior).
      *   **Constraint:** Do not make Priya's side look weaker. She has track record and a rebuttal to the averaging fact.
      *   **Deliverable:** A document they can both sign (Adversarial Collaboration Agreement).
