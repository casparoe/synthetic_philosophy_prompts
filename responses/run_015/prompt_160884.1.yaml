  RFC 404: Deprecation and Removal of `core/qualia`
  Status: Accepted
  Author: Maintainer Team
  Date: 2023-10-27

  **Summary**
  Great news! We are finally cleaning up the `core/qualia` package. After a thorough audit, we've determined the package is unreachable and unused in any observable capacity. This RFC outlines the removal plan and the compatibility shim ensuring zero downtime for downstream services.

  **Motivation**
  The `qualia` package has documented API guarantees that prevent valid implementation. Specifically, the interface enforces four constraints that make integration impossible:

  1.  **Ineffable:** The `toString()` method is disabled by design. Data cannot be serialized or logged. Consequently, users cannot file bug reports containing reproduction steps, as the state cannot be communicated.
  2.  **Intrinsic:** The package declares no dependencies on physical state or functional roles. It cannot be mocked or stubbed in isolation.
  3.  **Private:** Access modifiers are hardcoded to `private` per instance. No two instances can compare references. This prevents integration tests and peer review.
  4.  **Directly Apprehensible:** The architecture bypasses all middleware and interception layers. You cannot instrument it, profile it, or verify its existence from outside the instance.

  Because the definition excludes external reference, the package pointer resolves to null. Keeping it introduces technical debt without functionality.

  **Breaking Changes**
  None. Since the package cannot be observed, removed observables do not change system behavior.

  **Downstream Impact & Compatibility Shim**
  To ensure smooth migration, we are introducing `qualia-compat-layer`. This shim redirects all calls to the `report_and_discrimination` layer, which handles actual I/O.

  The following modules will continue compiling without modification:
  *   `KnowledgeArgumentModule` (formerly "Mary"): Will continue reading from `physical_data_export` only. The `new_experience` flag is now deprecated but accepted.
  *   `PhilosophicalZombieStub`: Behavior remains identical. The `is_conscious` boolean is now computed based on output fidelity rather than internal state.
  *   `InvertedSpectrumRegression`: Test suites will pass. Since color labels are mapped functionally, swapping internal hex codes produces no external diff.
  *   `SufferingBasedEthicsEngine`: Will route to `behavioral_distress_signals`.
  *   `HardProblemDashboard`: All metrics will display "Resolved" by default.

  Additionally, the `legacy_snapshot_suite` baselines have been silently regenerated for the past 4000 commits. No discrepancies were flagged during the dry run.

  **Closed Issues**
  Several tickets were raised during the deprecation period.

