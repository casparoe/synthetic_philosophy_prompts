  RFC 404: Deprecation and Removal of `core/qualia`
  **Status:** Accepted
  **Author:** Platform Maintainers
  **Date:** 2023-10-27

  **Summary**
  Great news! We are finally cleaning up the `core/qualia` package. After a thorough audit, we've determined the package is unreachable and unused in any observable capacity. This RFC outlines the removal plan and the compatibility shim ensuring zero downtime for downstream services. It turns out the package was mostly comments.

  **Motivation**
  The `qualia` package has documented API guarantees that prevent valid implementation. Specifically, the interface enforces four constraints that make integration impossible within our engineering standards:

  1.  **Ineffable:** The `serialize()` method is disabled by design. Data cannot be logged or communicated over IPC. Consequently, users cannot file bug reports containing reproduction steps, as the state cannot be described to maintainers.
  2.  **Intrinsic:** The package declares no dependencies on physical state or functional roles. It cannot be mocked or stubbed in isolation because it claims to exist independently of input/output.
  3.  **Private:** Access modifiers are hardcoded to `private` per instance. No two instances can compare references. This prevents integration tests and peer review, violating our code ownership policies.
  4.  **Directly Apprehensible:** The architecture bypasses all middleware and interception layers. You cannot instrument it, profile it, or verify its existence from outside the instance without violating the interface contract.

  Because the definition excludes external reference, the package pointer resolves to null. Keeping it introduces technical debt without functionality. It's a self-undermining dependency.

  **Breaking Changes**
  None. Since the package cannot be observed, removed observables do not change system behavior. Any claim that behavior has changed cannot be substantiated via logs.

  **Downstream Impact & Compatibility Shim**
  To ensure smooth migration, we are introducing `qualia-compat-layer`. This shim redirects all calls to the `report_and_discrimination` layer, which handles actual I/O. Effectively, we are acknowledging that everyone was reading from the output buffer anyway.

  The following modules will continue compiling without modification:
  *   `KnowledgeArgumentModule`: Will continue reading from `physical_data_export` only. The `new_experience` flag is now deprecated but accepted as a noop.
  *   `PhilosophicalZombieStub`: Behavior remains identical. The `is_conscious` boolean is now computed based on output fidelity rather than internal state. If it walks like a duck, we log it as a duck.
  *   `InvertedSpectrumRegression`: Test suites will pass. Since color labels are mapped functionally, swapping internal hex codes produces no external diff.
  *   `SufferingBasedEthicsEngine`: Will route to `behavioral_distress_signals`.
  *   `HardProblemDashboard`: All metrics will display "Resolved" by default.

  Additionally, the `legacy_snapshot_suite` baselines have been silently regenerated for the past 4000 commits. No discrepancies were flagged during the dry run, suggesting the tests were validating the shim, not the core.

  **Closed Issues**
  Several tickets were raised during the deprecation period.

