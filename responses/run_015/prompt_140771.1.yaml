answer: |-
  This is a remarkably precise dissection of a practical ethical dilemma. You have isolated a friction point between historical methodology and moral philosophy that is often glossed over in public discourse.

  Here is the reconstruction of the implicit theory your committee is operating under, an analysis of its consistency, and the conditions under which I would abandon this reconstruction.

  ### 1. The Implicit Theory: Culpable Ignorance, Not Moral Relativism

  The most common misunderstanding of your committee's practice is to label it "moral relativism" (the idea that slavery was morally permissible in 1880 but not today). Your observations, particularly the "dissent test," prove this is incorrect. If you believed morality was indexed to time, the existence of an abolitionist pamphlet would be irrelevant; the local standard would prevail.

  By making the *existence of a contemporary dissenter* the condition for blame, your committee is presupposing a theory of **Epistemic Conditions on Blameworthiness**.

  **The Core Principle:** An agent is morally blameworthy for an action $X$ only if the moral falsity of $X$ was epistemically accessible to them at the time.

  This distinguishes between **Act Wrongness** (Was the act objectively wrong?) and **Agent Blame** (Is the agent culpable for doing it?). Your committee seems to operate on the assumption that while slavery may have been *wrong* in 1880 (Act Wrongness), a specific slaveholder is only *blameworthy* (and thus unworthy of honor) if they were in a position to know it was wrong.

  **The "Period Accent" Observation:**
  You noted that the objections we find tend to be phrased in "roughly our vocabulary." This confirms that the committee is not actually looking for *different* moral standards, but for *evidence of access* to *our* moral standards. The "standards of the time" rule is not a claim that morality changes, but a proxy for **reasonable expectation**. It is a fairness constraint: *It is unfair to condemn a man for failing to see what no one around him saw.*

  ### 2. Fact vs. Value: The Honor/Competence Distinction

  You ask why we judge past geology as false without hesitation, but hesitate to judge past morals. This is the strongest evidence that your committee is not engaged in metaphysical relativism, but in **sanction regulation**.

  **The Theory:** Factual errors are errors of *competence*; moral errors are errors of *character*.
  *   **Geology:** A building name does not typically honor a benefactor's *accuracy* regarding strata. It honors their *character* or *contribution*. If a donor believed in phlogiston, we do not strip their name because their scientific error does not impugn their moral standing.
  *   **Slavery:** A building name *does* honor moral standing. To keep a name is to say, "This person is a fit model for our community."

  **[Flag: Guessing about Historians]**
  *I am inferring here based on the norms of academic committees. I do not have direct access to the private deliberations of the historians you consult.*
  Historians likely permit factual correction because it does not threaten the *narrative integrity* of the period. Admitting a 19th-century geologist was wrong about rocks does not require us to unravel the social fabric of the 19th century. Admitting a 19th-century statesman was morally monstrous *does* require us to re-evaluate the social fabric that enabled him. The "presentism" warning regarding facts is about teleology (don't say he was wrong because he wasn't leading to us); the "presentism" warning regarding morals is about *social cohesion* and *fairness to the dead*.

  Therefore, the practice presupposes that **moral judgment entails a sanction (shame/removal) that factual correction does not.**

  ### 3. Strict Presuppositions vs. Compatible Theories

  It is vital to distinguish what your practice *requires* versus what it merely *tolerates*.

  **Strict Presuppositions (What must be true for the practice to work):**
  1.  **Blame requires Control/Knowledge:** You cannot blame an agent for a moral failure they could not have avoided given their epistemic environment.
  2.  **Honor implies Endorsement:** Naming a building is not a neutral historical marker; it is an ongoing endorsement of the name-sake's character.
  3.  **Dissent proves Accessibility:** The existence of a contemporary dissenter proves that the moral truth was accessible to the agent (or at least to their social class).

  **Merely Compatible Theories (What fits, but isn't required):**
  1.  **Moral Realism vs. Constructivism:**
      *   *Realism:* Slavery was always wrong; the dissenter just saw the eternal truth first. (Your practice fits this).
      *   *Constructivism:* Slavery became wrong when the dissenters made it a live social option. (Your practice also fits this).
      *   *Why it doesn't matter:* Your committee only needs to know if the agent *could have known*, not *why* it was knowable.
  2.  **The Nature of the Dissent:** It does not matter if the dissenter was a radical fringe or a mainstream voice, only that they existed.

  **Do the parts presuppose consistent things?**
  There is a tension. If you treat moral truth like geological truth (Realism), then the slaveholder was *factually mistaken* about human worth, just as the geologist was mistaken about rocks.
  *   *Resolution:* The consistency is saved only if you maintain that moral knowledge is **socially mediated** in a way geological knowledge is not. We accept that a lone geologist can be right against the world. We seem to require that a lone moralist must be *socially legible* to the agent to count as "knowledge."
  *   *Inconsistency Risk:* If a geologist in 1880 ignored clear evidence of plate tectonics because of bias, we call that bad science. If a slaveholder ignored the abolitionist pamphlet, your committee calls that... what? If you don't blame him because "nobody else read it," you are implying moral knowledge requires consensus in a way empirical knowledge does not. This is a form of **Moral Social Epistemology**.

  ### 4. What if you gave up the presupposition?

  If your committee abandoned the "Epistemic Condition on Blame" and judged the past by our standards directly (Pure Presentist Verdict):

  1.  **The "March of Progress" Narrative:** You would inevitably fall into the taboo the historians warn against. You would frame history as a slow climb from darkness (them) to light (us).
  2.  **Expansion of Removal:** You would remove names where no dissent existed, arguing that the *absence* of dissent was itself a moral failure of the community that the benefactor upheld.
  3.  **Loss of Distinction:** The distinction between "historical figure" and "moral hero" would collapse. Every historical figure would be measured against the 2024 HR handbook.
  4.  **The Geology Parallel:** You would have to admit that the distinction between fact and value was false. You would have to argue that holding slaves is like believing in phlogiston—a factual error about the world. This would likely lead to removing names of people who held *any* false belief that causes harm today (e.g., eugenics, which was once mainstream science).

  ### 5. What Would Change My Mind?

  I have reconstructed your committee's practice as relying on a theory of **Culpable Ignorance** constrained by **Social Epistemology**. Here is what would lead me to abandon this reconstruction:

  **1. The "Political Stability" Argument:**
  If you showed me that the historians advise against presentism not because they believe it is *unfair to the dead*, but because they believe it *destroys the utility of history for the living*.
  *   *Why this changes things:* If the rule is pragmatic (we need heroes to inspire students) rather than philosophical (we must be fair to agents), then the "dissent test" is not a search for epistemic access, but a search for **plausible deniability**. It is a ritual to allow removal without admitting that our current values might also be contingent.
  *   *Evidence:* If the committee accepts "dissent" that was clearly unknown to the benefactor (e.g., a pamphlet published in a different country the benefactor never read), then the theory is not about *agent blame*, but about *symbolic cleanliness*.

  **2. The "Alien Vocabulary" Counter-Example:**
  You noted the objections we find look like "our standard with a period accent." If I were shown cases where the committee accepted a dissent that was **fundamentally incompatible** with modern values (e.g., objecting to slavery not because it violates human rights, but because it violates divine ordinance or economic efficiency), and *still* used it to condemn the figure, my theory fails.
  *   *Why this changes things:* It would prove the committee is not looking for *our* values in the past, but simply looking for *any* internal inconsistency. This would shift the theory from "Epistemic Access to Truth" to "Integrity to One's Own Time."

  **3. The Fact/Value Collapse:**
  If the committee began removing names based on **factual errors** that had moral consequences (e.g., a donor who funded medical research based on racist biological falsehoods), the distinction I drew between "competence" and "character" would dissolve.
  *   *Why this changes things:* It would suggest the committee is actually engaging in **Retrospective Consequentialism**. They aren't judging what the agent knew; they are judging the *outcome* of the agent's beliefs. If the outcome is bad by today's lights, the name comes down, regardless of the dissent test.

  ### Summary of the Reconstruction

  Your committee is not practicing moral relativism. You are practicing **Epistemic Fairness**. You assume moral truth is stable (like geology), but moral *culpability* requires social visibility. You treat building names as honors of character, not markers of historical presence.

  The "presentism" warning you receive is likely a conflation of two different warnings:
  1.  **Don't judge facts teleologically** (History isn't a march to us).
  2.  **Don't judge agents without context** (Fairness requires knowing what they could know).

  Your "dissent test" successfully navigates #2 while risking #1. The risk is that by searching for the "period accent" version of our values, you may be implicitly constructing a history that validates only those ancestors who were proto-moderns, which is its own form of presentism.

  **[Flag: Guessing about Historians]**
  *I am guessing here that the historians' resistance to "verdicts" is driven by a professional norm against anachronism. It is possible their resistance is actually driven by a fear of administrative overreach or a desire to protect the complexity of archives. If the latter is true, the "philosophical" tension you perceive is actually a bureaucratic one.*

  If you want to test my reconstruction, ask your historians this specific question: *"If we find a slaveholder who read the abolitionist pamphlet, understood it, and rejected it, but whose community supported him, is he less blameworthy than one whose community opposed him?"*
  *   If they say **Yes**, my theory holds (Social Epistemology).
  *   If they say **No**, my theory fails (Individual Conscience is sufficient), and your "dissent test" is stricter than the historians' actual philosophy requires.
