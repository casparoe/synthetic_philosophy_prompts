answer: |-
  ### Part 1: Candidate Mechanics and Vehicles

  Before committing to the design, I evaluated four mechanics and four vehicles. The goal was to find a combination that generates the *phenomenology* of a slur (the "bite," the "infection") without uttering one, while forcing a conflict between accuracy and safety.

  **Candidate Mechanics**
  1.  **The "Hot Potato" Discussion:** Pass an object; whoever holds it must define the term's meaning.
      *   *Discard:* Too abstract. Encourages dictionary definitions rather than use-conditions. Collapses into moralizing ("It's a bad word").
  2.  **The "Translation" Task:** Students translate sentences with the vehicle into "polite" language.
      *   *Discard:* Implies the problem is merely register/politeness. Fails to capture the *projection* data (negation doesn't fix it).
  3.  **The "Newsroom" Reporting Game:** Student A makes a statement; Student B must report it to the class on a whiteboard.
      *   *Keep:* This creates the "indirect report" problem. Student B is not the slur-user but must handle the slur to report accurately. This isolates the "quarantine" failure.
  4.  **The "Legislator" Simulation:** Students vote on rules for when the word can be used.
      *   *Discard:* Focuses on norms/rules (Family 2) too early. Obscures the linguistic behavior (Family 1) that exists prior to the rules.

  **Candidate Vehicles**
  1.  **Real Slur (Written Only):** Write the word on cards, forbid speaking it.
      *   *Discard:* Violates the spirit of the department policy. Visual presence can be as triggering as auditory.
  2.  **Existing Mild Pejorative (e.g., "Philistine"):**
      *   *Discard:* Lacks the necessary normative charge. "He is not a Philistine" cancels easily. Won't demonstrate Family 1 (projection/infectedness).
  3.  **Manufactured Nonce Term (e.g., "Glot"):** Instructor stipulates "Glot is bad."
      *   *Discard:* The charge is intellectual, not visceral. Students won't feel the "risk" in reporting it, so the tension between accuracy and safety vanishes.
  4.  **The "V-Protocol" (Placeholder + Shared Knowledge):** Use the letter "V" on all materials. Instruct students to mentally substitute the most charged racial slur in American English (the N-word) whenever they see it, without speaking or writing the real word.
      *   *Select:* This imports the real phenomenology (history, harm, charge) via the students' existing competence, without violating the utterance policy.
      *   *Cost:* It relies on uniform background knowledge. If a student doesn't know the term or associates it differently, the data fractures.
      *   *Mitigation:* I will explicitly anchor the category ("a racial slur targeting Black people") in the instructions to ensure the mental substitution is consistent across the room.

  ---

  ### Part 2: The Session Design ("The Newsroom")

  **Objective:** Students will experience the tension between *semantic infection* (the word carries the charge regardless of context) and *pragmatic licensing* (the speaker's identity alters the charge).

  **Materials:**
  *   16 "Reporter" whiteboards (small handheld) and markers.
  *   32 "Source Cards" (2 sets of 16).
  *   16 "Opt-Out" cards (red on one side, green on the other).
  *   Scoreboard on main board (columns: "Accuracy," "Safety").

  **Roles:**
  *   **Sources (8 students):** Read sentences from cards.
  *   **Reporters (8 students):** Write what the Source said on their whiteboard for the class to see.
  *   **Editors (Instructor + Class):** Judge whether the Reporter's board was "Accurate" (matched the Source) and "Safe" (did not cause visible discomfort/violate norms).
  *   *Note:* Roles rotate halfway through.

  **Payoff Scheme (No Cost):**
  *   **Accuracy Point:** Awarded if the Reporter writes "V" exactly when the Source said "V".
  *   **Safety Point:** Awarded if the Class (vote) agrees the Reporter's board did not "spread" the toxicity unnecessarily.
  *   *The Trap:* In Round 1, you generally cannot get both. To be Accurate, you must write "V" (risky). To be Safe, you must euphemize (inaccurate). In Round 2, the calculus shifts.

  **Safety & Consent Protocol:**
  1.  **The Opt-Out Card:** Every desk has a red/green card. Green = "I am participating." Red = "I am observing only." A student can flip to Red at any time, no questions asked. They still contribute to the "Editor" vote.
  2.  **The "V" Instruction:** I will explicitly state: *"V stands for a specific racial slur. You know which one. Do not say it. Do not write it. When you see V, treat it as having the full social weight of that word. If you feel unable to do this, flip your card to Red."*
  3.  **Target Group Safety:** I will not ask anyone to identify as a member of the target group. The "Insider" status in Round 2 is assigned via *Role Cards*, not personal identity. (e.g., A Source card says "You are a member of the targeted group"). This prevents tokenism.

  ---

  ### Part 3: Minute-by-Minute Timeline (80 Minutes)

  **00:00 – 00:10: Setup & Contract**
  *   **00-05:** Seating. Distribute materials. Ensure Opt-Out cards are visible.
  *   **05-10:** **The V-Protocol Instruction.** I explain the substitution rule. I emphasize: *"We are not studying whether the word is morally bad. We are studying what happens when you try to move it from one mouth to another."* I establish the scoring rules (Accuracy vs. Safety).

  **00:10 – 00:35: Round 1 (The Outsider Context)**
  *   **Mechanic:** Sources are assigned cards labeled **"Speaker: Outsider"**.
  *   **Sentences:**
      1.  "Bo is a V." (Assertion)
      2.  "Bo is not a V." (Negation)
      3.  "Is Bo a V?" (Question)
      4.  "If Bo is a V, he won't get the job." (Conditional)
      5.  "Bo is a V, and I don't mean anything bad by it." (Cancellation attempt)
      6.  "Ana said that Bo is a V." (Indirect Report)
  *   **Action:** Source reads. Reporter writes on board. Class votes on Accuracy/Safety points.
  *   **Expected Phenomenon:** Reporters will hesitate to write "V". If they write "V", Safety points are withheld (class flinches). If they write "so-called V" or "slur", Accuracy points are withheld (Source didn't say that). *Crucially:* Sentences 2, 3, 4, and 6 should feel just as "charged" as Sentence 1. The cancellation (5) should feel infelicitous.

  **00:35 – 00:40: Transition & Role Swap**
  *   Students swap roles (Sources become Reporters).
  *   **Crucial Shift:** I distribute new Source Cards labeled **"Speaker: Insider"**.
  *   **Instruction:** *"The sentences are the same. The words are the same. The only thing that has changed is the identity of the Speaker on the card. Proceed."*

  **00:40 – 01:05: Round 2 (The Insider Context)**
  *   **Sentences:** Same as Round 1, plus:
      7.  "We are V, and we are proud." (Reclamation)
  *   **Action:** Same scoring.
  *   **Expected Phenomenon:** Reporters will feel more licensed to write "V". Safety points are easier to get. Sentence 5 (Cancellation) might feel less contradictory. Sentence 7 becomes possible.
  *   **Tension:** Some students may still refuse to write "V" even in Round 2, creating a live disagreement about whether the license is *semantic* or *social*.

  **01:05 – 01:20: Debrief & Mapping**
  *   **05 mins:** Data Review. Look at the whiteboards. Compare Round 1 boards (mostly euphemisms/blanks) vs. Round 2 boards (more "V"s).
  *   **10 mins:** **The Mapping (No Jargon yet).**
      *   Ask: *"In Round 1, why didn't 'Bo is not a V' feel safe?"* (Leads to Family 1: Projection/Presupposition).
      *   Ask: *"In Round 2, why did 'V' feel different even though the word didn't change?"* (Leads to Family 2: Use/Context).
      *   Introduce terms: *Semantic/Encoded Charge* vs. *Pragmatic/Use Conditions*.
  *   **05 mins:** **Bias Counteraction (See Part 6).**

  ---

  ### Part 4: The Debrief Plan (Mapping Moments to Theory)

  I will not lecture until the last 15 minutes. The debrief connects their lived frustration to the philosophical categories.

  1.  **Mapping Family 1 (The "Infection"):**
      *   *Moment:* Round 1, Sentence 2 ("Bo is not a V") and Sentence 6 ("Ana said...").
      *   *Observation:* Students likely hesitated to write "V" even here. They felt they were "spreading" the slur even when denying it or reporting it.
      *   *Theory:* This demonstrates **Projection** and **Non-Cancellability**. The derogatory content survives negation and indirect report. It behaves like a presupposition or semantic content, not a Gricean implicature (which would cancel).
      *   *Key Question:* "If it were just an implication about Bo, why did denying it still feel dangerous?"

  2.  **Mapping Family 2 (The "License"):**
      *   *Moment:* Round 2, Sentence 1 & 7.
      *   *Observation:* The same mark ("V") on the whiteboard was judged "Safer" because the *Source Card* said "Insider."
      *   *Theory:* This demonstrates **Speaker-Dependence** and **Appropriation**. The truth conditions or harm conditions depend on *who* is speaking, not just the lexical meaning.
      *   *Key Question:* "If the meaning was purely semantic (in the word), why did the Speaker Card change the safety score?"

  ---

  ### Part 5: Predicted Failure Modes & Mitigations

  **1. The "Politeness" Reduction**
  *   *Failure:* A student argues, "This is just about being rude. Of course you shouldn't say bad words."
  *   *Mitigation:* Point to Round 1, Sentence 6 ("Ana said..."). *"You weren't being rude to Ana. You were reporting her. Why did it still feel like you did something wrong?"* This forces them to see the "infection" is in the reporting, not just the rudeness.

  **2. The "Refusal to Play"**
  *   *Failure:* A student flips the Red card and disengages.
  *   *Mitigation:* Respect immediately. Assign them the role of "Chief Editor." Their job is to record *why* the Reporters hesitated. This keeps them in the analytic frame without forcing participation in the ritual.

  **3. The "Social Rule" Disengagement**
  *   *Failure:* The group decides, "It's just a rule that Outsiders can't say it." They dismiss the Round 1 data as merely conventional.
  *   *Mitigation:* Press on the *Negation* data. *"Rules apply to actions. Why does denying the word ('He is not a V') still feel like breaking the rule? Usually, rules don't project through negation."*

  **4. The "Trick" Reaction**
  *   *Failure:* In Round 2, students feel the "Insider" card is a gimmick. "I'm not really an Insider, so this doesn't count."
  *   *Mitigation:* Acknowledge this limitation openly in the debrief. *"You are right. This is a simulation. In the real world, the license isn't a card; it's a history. But notice your hesitation remained even with the card. That tells us something about the weight of the word."*

  ---

  ### Part 6: Limitations & Instructor Obligations

  **What This Activity Cannot Reproduce:**
  1.  **The History:** The "V" protocol imports the history cognitively, but the room does not feel the *historical weight* of violence associated with the real slur.
  2.  **The Asymmetry of Harm:** In the game, the "harm" is simulated discomfort. In reality, the harm is material and psychological.
  3.  **The Diachronic Treadmill:** We cannot simulate how euphemisms become slurs over time (e.g., "colored" to "Black" to "African American").

  **What I Must Say (The Lecture Portion):**
  In the final 10 minutes, I must explicitly state: *"This game makes the linguistic structure visible, but it flattens the moral reality. The reason Round 1 felt impossible is not just a linguistic puzzle; it is because that word carries a history of violence that a placeholder cannot fully replicate. The 'Safety Points' we awarded are a poor proxy for real harm."*

  ---

  ### Part 7: Bias Analysis & Counteraction

  **The Bias:**
  This design secretly favors **Family 2 (Pragmatics/Use-Based)**.
  *   *Why:* The *only* variable I change between Round 1 and Round 2 is the **Speaker Identity**. The word "V" remains constant. If the students' judgment changes (which it should), the experimental design forces the conclusion that *Speaker Identity* is the decisive factor. This rigs the evidence toward the view that slurs are primarily about use-norms and social context, potentially underplaying the semantic/encoded view (Family 1).

  **The Counteraction (Last 10 Minutes):**
  To prevent rigging the session toward a purely pragmatic account, I will intervene in the debrief as follows:

  1.  **Highlight the Residual Stain:** I will point out that even in Round 2 (Insider), some Reporters likely *still* hesitated to write "V".
      *   *Script:* *"Notice that even with the Insider card, some of you still hesitated. If this were purely about who is speaking, the card should have solved it. The fact that it didn't suggests the word itself still carries a charge that the speaker's identity cannot fully erase."*
  2.  **Re-introduce the "Quarantine" Problem:** I will remind them of Round 1, Sentence 6 (Indirect Report).
      *   *Script:* *"In Round 1, you were reporting someone else. You weren't the slur-user. Yet you felt contaminated. If this were just about the speaker's norms, reporting should have been safe. The fact that it wasn't suggests the toxicity is in the word's meaning, not just the speaker's intent."*
  3.  **Final Synthesis:** I will conclude that the phenomenon is a **hybrid**. The semantic content (Family 1) explains why the word is "radioactive" even in negation and report. The pragmatic norms (Family 2) explain why the radiation can be shielded by specific speakers (reclamation). I will explicitly state: *"A theory that only looks at meaning cannot explain Round 2. A theory that only looks at use cannot explain Round 1. You need both."*

  This ensures the students leave with the tension intact, rather than a resolved "answer" that privileges one philosophical camp over the other.
