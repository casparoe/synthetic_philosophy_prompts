      *(Refining Rule 1 - Data-Ontology)*: Needs to handle the *Avatar* case. *Avatar* wasn't about data loss, it was about conduct. So Data-Ontology needs a "Conduct Exception."
      *(Refining Rule 2 - Person-Protective)*: Needs to handle *Siege*. *Siege* involved 400 hours loss. So Person-Protective needs a "Assumption of Risk" clause for adversarial zones.
      *(Refining Rule 3 - Social-Constitution)*: Needs to handle *Siege*. *Siege* had no social contract of permanence. So Social-Constitution needs a "Contextual Norm" clause.

      *(Final Polish)*: Ensure the distinction between the "Only Data" defense is clearly crushed by the chosen recommendation.

  9.  **Final Review against Prompt:**
