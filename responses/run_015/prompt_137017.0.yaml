prompt: |-
  I sit on the Council of Appeals of a persistent, decade-old virtual world — a sandbox with its own internal courts, its own currency, and a user base that has been building inside it for years. We adjudicate grievances between players, and over that time we have accumulated a set of precedents. A new case has come before us that I do not think those precedents settle, and I want the reasoning set out carefully before we vote.

  Our precedents, in the form in which we now cite them:

  1. *The siege.* An attacking force destroyed a castle that another player had built over roughly four hundred hours, using siege mechanics the world expressly provides. Ruling: no sanction, no compensation. We held that the loss fell inside the ordinary adversarial frame of the game.

  2. *The fraudulent exchange.* A player transferred real money to another in exchange for in-world currency and received nothing. Ruling: the currency was recreated from the ledger and returned to the buyer; the seller was suspended. We said the wrong lay in the deception and the remedy in putting back what could be put back.

  3. *The avatar boundary.* A player exploited an animation-and-collision bug to force another player's avatar into a simulated sexual assault, in a world with no mechanics for it. Ruling: permanent ban, no compensation ordered. Our opinion said that what was violated was the person, and that the avatar's treatment mattered because of what it did to her.

  4. *The guild vault.* A co-leader with legitimate access emptied a guild's shared vault. The guild had a written charter treating the vault as pooled property. Ruling: suspension; traceable assets returned; untraceable assets not replaced. We allowed that the charter had made the vault theirs collectively in a sense we were prepared to act on.

  5. *The companion creature.* In a zone flagged for player-versus-player combat, one player killed another's bonded companion, an animal raised over some sixty hours. Ruling: no sanction, since the mechanic was permitted, but the studio was ordered to restore the creature from a server snapshot, on the ground that nothing had been lost that could not be restored.

  6. *The sunset.* A legacy server was closed with six months' notice, and players were offered an export tool for their builds. A cathedral, the work of thousands of hours, was lost because its builders never used the tool. Ruling: no wrong, no compensation. Notice together with the export offer was held to extinguish any expectation of permanence.

  The case now before us:

  Over two years a collective built a great library in the live shard: not architecture alone, but some eleven thousand in-world book objects whose text they authored themselves. The text exists nowhere else — the builders had in fact asked for an export path for book contents and had been told that none existed. A single player then used an unauthorized exploit of the world's fire-spread system to burn the library in one night: the mechanism was an in-world physical process rather than a direct deletion, but the mechanism was not one the game makes available. There is no shard backup predating the fire, and the studio's transaction logs preserve only fragments of the text. No real money changed hands. The library had been announced, publicly and repeatedly, as a permanent common resource; several guilds' research and a portion of the shard's quest economy depended on it; and players who never contributed describe their loss in the terms people use for the burning of an archive. The player responsible maintains that nothing real was destroyed, because all of it was only data. The appeal also asks whether the studio itself bears any responsibility for holding no restorable copy.

  What I want from you:

  - Set out the rules — I suspect there are at least three, and you may find more — that are each compatible with all six precedents. The candidates I have in mind are a person-protective rule on which in-world losses matter only as setbacks to the real-world interests of the people behind the avatars; a social-constitution rule on which what matters is what the community has actually made of the thing, through charters, announcements and reliance; and a data-ontology rule on which nothing is lost that a server can put back, so that the only questions are permission and reversibility. State each precisely enough to generate predictions, and say how it would have to be amended to fit the precedents it fits least well.
  - For each rule, say what it implies here: whether a wrong was done; against whom, if anyone — the builders, the whole user base, the studio, no one; what remedy follows, among ban, restoration from logs, studio-funded reconstruction, or compensation in currency or in real money; and whether the only-data defense succeeds or fails.
  - Give your best prediction of what the Council should decide if it is to be consistent with itself, with your reasons for preferring that rule over the others, and identify the closest analog among our precedents. I can see arguments for the guild vault, for the sunset, and for the siege, and I want you to say which of those analogies is doing real work and which is superficial.
  - Be explicit about where our precedents underdetermine the ruling, and name the principle we would be adopting under each live option — in particular what we would be committing ourselves to about whether a virtual object can be destroyed, whether its destruction can be a harm to people who never owned or built it, and whether irreplaceability or third-party reliance is doing the justificatory work.
  - Finally, specify the further case, either hypothetical or one we could construct, that would best separate the rules you have identified: a case on which at least two of them give different verdicts, and which we should therefore use afterwards to test whichever rule we adopt.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Member of the Council of Appeals for a persistent, decade-old virtual world.
      *   **Task:** Analyze a new case (The Burned Library) against six existing precedents.
      *   **Requirements:**
          1.  Derive at least three distinct legal rules/principles compatible with all six precedents (Person-Protective, Social-Constitution, Data-Ontology). State them precisely, note necessary amendments, and generate predictions.
          2.  Apply each rule to the new case (Wrong done? Against whom? Remedy? "Only data" defense?).
          3.  Provide a recommendation for the Council (Best prediction for consistency), justify the preference, identify the closest analog (Guild Vault, Sunset, or Siege?), and distinguish superficial vs. real analogies.
          4.  Identify where precedents underdetermine the ruling and name the new principles being adopted (regarding destruction, harm to non-owners, irreplaceability/reliance).
          5.  Propose a "test case" (hypothetical or constructible) that would best separate the chosen rules for future adjudication.
      *   **Tone:** Judicial, analytical, precise, respectful of the virtual world's unique legal culture.

  2.  **Deconstruct the Precedents:**
      *   *Siege:* Game mechanics used for destruction = No sanction. (Adversarial frame).
      *   *Fraudulent Exchange:* Real money/Deception = Sanction + Restoration. (Real-world harm/Deception).
      *   *Avatar Boundary:* Bug exploitation/Harassment = Permanent Ban. (Personhood/Safety > Game Mechanics).
      *   *Guild Vault:* Internal Charter + Legitimate Access = Sanction + Partial Restoration. (Social Contract/Property Rights).
      *   *Companion Creature:* PvP Zone + Permitted Mechanic = No Sanction, but Studio Restoration. (Mechanic allowed, but emotional investment recognized via restoration).
      *   *Sunset:* Server Closure + Notice + Export Tool = No Wrong. (Expectation of permanence extinguished by notice/tools).

  3.  **Drafting the Three Rules:**

      *   *Rule 1: Data-Ontology (The "Reversibility" Rule).*
          *   *Core:* Harm exists only if data is permanently lost or permissions violated. If the server can restore it, it's not "gone." If it's a game mechanic, it's allowed.
          *   *Fit:* Fits *Siege* (mechanic), *Companion* (restored), *Sunset* (export offered).
          *   *Amendment needed:* *Avatar Boundary* involves no data loss but is a ban. *Guild Vault* involves restoration limits. *Fraud* involves real money.
          *   *Refinement:* Must account for "unauthorized mechanics" (exploits) as permission violations. Must account for human dignity (*Avatar*) as an exception to pure data logic.
          *   *Prediction:* Exploit = Wrong. No backup = Permanent Loss. Remedy = Studio liability? Or just Ban?

      *   *Rule 2: Person-Protective (The "Real-World Harm" Rule).*
          *   *Core:* Virtual acts matter only insofar as they impact real-world interests (money, psychological safety, reputation).
          *   *Fit:* Fits *Fraud* (money), *Avatar* (psychological safety).
          *   *Amendment needed:* *Siege* (400 hours lost, no compensation). *Companion* (60 hours, restoration ordered). *Sunset* (Cathedral lost, no compensation).
          *   *Refinement:* Must distinguish between "game risk" (Siege/Sunset) and "unforeseen violation" (Companion/Avatar). Time investment alone isn't enough; needs deception or safety violation.
          *   *Prediction:* Did the builders lose real value? No money. Psychological harm? Maybe. Reliance? Quest economy.

      *   *Rule 3: Social-Constitution (The "Community Expectation" Rule).*
          *   *Core:* The community's shared understanding of permanence, ownership, and function creates enforceable rights, regardless of code.
          *   *Fit:* Fits *Guild Vault* (Charter), *Sunset* (Notice extinguished expectation), *Companion* (Bonding recognized).
          *   *Amendment needed:* *Siege* (Castle destroyed despite effort). *Avatar* (Bug exploitation).
          *   *Refinement:* Must acknowledge "Adversarial Zones" vs. "Safe/Community Zones." The Siege was PvP; Library was "Permanent Common Resource."
          *   *Prediction:* Public announcement of permanence + Reliance = Enforceable expectation. Exploit violates social contract.

  4.  **Analyzing the New Case (The Burned Library):**
      *   *Facts:* 11k books, unique text, 2 years build. Exploit used (unauthorized fire). No backup. Publicly "permanent." Third-party reliance (quests/economy).
      *   *Defendant:* "Only data" defense.
      *   *Studio:* No export tool (unlike *Sunset*), no backup.

  5.  **Applying Rules to the Case:**
      *   *Data-Ontology:* Exploit = Unauthorized permission violation (Like *Avatar* bug). Data lost permanently (Unlike *Companion*). Remedy: Ban + Studio Restoration (if possible) or Compensation. "Only data" fails because permission was violated.
      *   *Person-Protective:* No real money. Psychological harm? Reliance harm (quest economy). "Only data" might succeed regarding the text, but fails regarding the economy. Remedy: Economic compensation.
      *   *Social-Constitution:* Public promise of permanence + Reliance = Violation of social contract. Exploit violates community norms. "Only data" fails. Remedy: Reconstruction/Compensation + Ban.

  6.  **Developing the Recommendation:**
      *   *Consistency:* The Council has been moving from pure mechanics (*Siege*) to recognizing social structures (*Vault*) and human impact (*Avatar*).
      *   *Best Rule:* Social-Constitution. It bridges the gap between the mechanical permission of *Siege* and the reliance in *Vault*. It addresses the "Permanent Common Resource" claim which distinguishes this from *Siege*.
      *   *Closest Analog:* *Guild Vault*. Why? Because it involves shared property and a charter/announcement. *Sunset* is distinct because notice was given. *Siege* is distinct because it was adversarial.
      *   *Underdetermination:* Precedents don't explicitly cover "Third Party Reliance" on non-owned objects. Precedents don't cover Studio negligence (no backup) when no export tool exists.
      *   *Principles to Adopt:* Virtual objects *can* be destroyed in a legally cognizable sense if social reliance exists. Harm extends to non-owners via ecosystem reliance. Irreplaceability matters when creation cost is high and no backup exists.

  7.  **Designing the Test Case:**
      *   Need to separate *Social-Constitution* from *Data-Ontology* and *Person-Protective*.
      *   *Idea:* A player deletes a publicly visible, non-functional art piece. No economic reliance. No personal harm. But it was "declared permanent" by the studio.
      *   *Better Idea:* A "Market Crash" case. A player manipulates a legal mechanic to devalue a currency or item that the community treats as stable, causing reliance loss without direct theft.
      *   *Selected Test Case:* "The Inflationary Dump." A player legally acquires massive amounts of a common resource and dumps it, crashing the price. Community relied on stability.
      *   *Why:* Data-Ontology says "Legal Mechanic = No Wrong." Person-Protective says "No Real Money Loss (initially) = No Wrong." Social-Constitution says "Violation of Market Norms/Reliance = Wrong."

  8.  **Refining the Output:**
      *   Ensure the tone is appropriate (Council Member to Council Members).
