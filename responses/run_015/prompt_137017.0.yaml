answer: |-
  **MEMORANDUM TO THE COUNCIL OF APPEALS**
  **RE:** *The Burned Library* — Analysis of Precedent and Proposed Ruling

  Colleagues,

  We stand at a juncture similar to *The Avatar Boundary*. There, we recognized that code does not exhaust harm. Here, we must decide whether code exhausts *property*. The defendant argues from a position of digital nihilism ("only data"); the appellants argue from a position of cultural reliance ("an archive"). To rule consistently, we must derive the latent principles of our six precedents and test them against this new fact pattern.

  Below are three candidate rules derived from our history, their application to this case, and my recommendation for the Council.

  ---

  ### I. Three Candidate Rules Compatible with Precedent

  Each rule below is formulated to explain all six precedents (*Siege, Fraud, Avatar, Vault, Companion, Sunset*), though each requires specific amendments to fit the outliers.

  #### 1. The Data-Ontology Rule (Reversibility & Permission)
  **Statement:** A virtual object is not "destroyed" in a cognizable legal sense if the server state can restore it. A wrong occurs only if (a) data is permanently lost due to unauthorized access or exploit, or (b) the loss is irreversible and caused by a violation of permission protocols.
  **Prediction:** Sanctions follow permission violations; compensation follows permanent data loss caused by those violations.
  **Amendments Required:**
  *   *To fit The Avatar Boundary:* Must add a **Human Dignity Exception**. Even if data is intact (the avatar reset), conduct violating real-world personhood is sanctionable regardless of reversibility.
  *   *To fit The Siege:* Must add an **Adversarial Waiver**. In flagged PvP zones, permission to destroy is implicit in the zone mechanics, rendering the loss "authorized" even if permanent.
  *   *To fit The Sunset:* Must clarify that **Notice constitutes Consent** to deletion, rendering the data loss "authorized" by the user's continued presence post-notice.

  #### 2. The Person-Protective Rule (Real-World Interest)
  **Statement:** In-world losses are actionable only insofar as they constitute setbacks to real-world interests (financial, psychological, or reputational). Virtual effort (hours spent) is not itself a protected interest unless tied to real-world value or safety.
  **Prediction:** Compensation is limited to real-money loss or proven psychological harm. Sanctions apply to deception or harassment.
  **Amendments Required:**
  *   *To fit The Companion Creature:* Must add an **Emotional Investment Clause**. Where a specific bond is mechanically recognized (e.g., "bonded" status), the studio must mitigate emotional harm via restoration, even without financial loss.
  *   *To fit The Siege:* Must add a **Risk Assumption Clause**. Losses incurred within explicit adversarial mechanics are assumed risks, negating the "setback" claim.
  *   *To fit The Guild Vault:* Must acknowledge that **Collective Agreements** create a form of intangible property right recognizable as a "real-world interest" among the signatories.

  #### 3. The Social-Constitution Rule (Reliance & Expectation)
  **Statement:** The legal status of a virtual object is determined by the community's shared understanding of its permanence and function, established through charters, public announcements, and systemic reliance.
  **Prediction:** Violations of established social contracts (charters, promises of permanence) are actionable, even if mechanics allow the act. Remedies aim to restore the social function, not just the data.
  **Amendments Required:**
  *   *To fit The Siege:* Must distinguish **Adversarial Norms** from **Cooperative Norms**. In PvP zones, the social constitution expects destruction; in building zones, it expects stability.
  *   *To fit The Sunset:* Must hold that **Formal Notice** rewrites the social constitution. Once notice is given, the expectation of permanence is legally dissolved.
  *   *To fit The Avatar Boundary:* Must recognize that **Safety Norms** override all other social constitutions; no community agreement can validate harassment.

  ---

  ### II. Application to *The Burned Library*

  Here is how each rule adjudicates the current case, specifically addressing the "only data" defense and studio liability.

  #### 1. Under Data-Ontology
  *   **Wrong Done:** Yes. The fire-spread was an *exploit*, not a permitted mechanic. This violates the **Permission Protocol**.
  *   **Against Whom:** The builders (owners of the data).
  *   **Remedy:** Permanent ban of the exploiter. Regarding the library: Since no backup exists, the data is permanently lost. Under strict Ontology, the Studio is not liable for data loss unless negligent. However, *Companion* suggests restoration is preferred. If impossible, no compensation (as in *Siege*), unless we deem the lack of backup a permission failure by the Studio.
  *   **"Only Data" Defense:** **Fails.** The defense fails not because the data was valuable, but because the *method* of deletion was unauthorized.
  *   **Studio Responsibility:** Low. *Sunset* establishes that players bear the burden of export unless tools are provided. Here, tools were denied. This creates a tension: if the Studio says "no export," they implicitly warrant the data's safety.

  #### 2. Under Person-Protective
  *   **Wrong Done:** Debatable. No real money changed hands. Psychological harm is asserted but diffuse.
  *   **Against Whom:** The builders (primary), potentially the quest-dependent players (economic setback).
  *   **Remedy:** Ban for the exploiter (deterrence). Compensation is unlikely for the text (no market value). *However*, if the quest economy is disrupted, currency compensation might be owed to affected third parties.
  *   **"Only Data" Defense:** **Succeeds (Partially).** Regarding the text, the defense holds: it was data with no real-world cash value. Regarding the quest economy, it fails: the disruption had tangible gameplay consequences.
  *   **Studio Responsibility:** Low. Unless the Studio guaranteed the economy's stability, they are not liable for the loss of non-monetary assets.

  #### 3. Under Social-Constitution
  *   **Wrong Done:** Yes, severe. The library was announced as a "permanent common resource." This created a **Reliance Interest** for the whole shard.
  *   **Against Whom:** The builders (violation of labor), but crucially, **the User Base** (violation of the public trust) and **the Studio** (failure to uphold the promise of permanence).
  *   **Remedy:** Ban for the exploiter. **Studio-funded reconstruction** or currency compensation equivalent to the labor value, because the Studio failed to provide the export tool they denied the players.
  *   **"Only Data" Defense:** **Fails Completely.** The value lies in the social function (archive, quest hub), not the bits.
  *   **Studio Responsibility:** High. By denying an export tool while declaring the resource "permanent," the Studio became the guarantor of that permanence. *Sunset* is distinguished here: in *Sunset*, players were given the means to save; here, they were explicitly disarmed.

  ---

  ### III. Recommendation and Prediction

  **The Council should decide based on the Social-Constitution Rule.**

  **Reasoning:**
  Our jurisprudence has evolved from mechanical literalism (*Siege*) toward recognizing the human and social structures built atop the code (*Vault, Avatar*). To rule otherwise is to ignore the specific history of this shard.
  *   *The Siege* is a **superficial analog**. It involved adversarial mechanics in a PvP context. This case involves a cooperative resource in a build zone. Citing *Siege* would ignore the "permanent common resource" designation.
  *   *The Sunset* is a **distinguishing analog**. It is crucial for the Studio liability question. In *Sunset*, notice + export tool = no liability. Here, the *absence* of an export tool (despite request) + promise of permanence = liability.
  *   *The Guild Vault* is the **controlling analog**. Like the Vault, this is a collective project governed by a public charter/announcement. Like the Vault, the loss is of pooled effort. However, *Vault* limited restoration to traceable assets. Here, nothing is traceable. We must extend *Vault* to cover "Social Restoration" (compensation for lost utility) when data restoration is impossible due to Studio limitation.

  **Predicted Ruling:**
  1.  **The Exploiter:** Permanent Ban. The use of an exploit violates the basic permission structure of the world (*Avatar*/*Fraud*).
  2.  **The Builders/Base:** The Studio is ordered to compensate the collective in in-world currency equivalent to the estimated labor value of the library, funded by the Studio (not the exploiter), because the Studio failed to provide backup/export options for a resource they labeled "permanent."
  3.  **The "Only Data" Defense:** Rejected. The harm is to the shard's ecosystem and the reliance interests of the community, not merely the deletion of strings in a database.

  ---

  ### IV. Underdetermination and New Principles

  Our precedents underdetermine this ruling in three specific areas. By deciding this case, we will be adopting the following principles:

  1.  **Destruction of Virtual Objects:** Previously, we treated destruction as either a game mechanic (*Siege*) or a data error (*Companion*). We must now commit to the principle that **Virtual Objects can be "Destroyed" in a legal sense when their social function is extinguished irreversibly.**
  2.  **Harm to Non-Owners:** *Vault* protected co-owners. *Siege* protected owners from non-sanctioned attacks. We have never ruled on third-party reliance (the questers). We must commit to the principle that **Ecosystem Reliance creates a cognizable interest for non-owners.**
  3.  **Irreplaceability vs. Backup:** *Sunset* placed the burden on players to export. *Companion* placed the burden on the Studio to snapshot. We must commit to the principle that **When the Studio denies export tools, the burden of preservation shifts to the Studio.**

  ---

  ### V. The Test Case

  To verify whether we have truly adopted the **Social-Constitution Rule** (as recommended) rather than slipping back into **Data-Ontology**, we should construct or await the following case:

  **The Case of "The Inflationary Dump"**
  *   **Facts:** A player legally acquires 90% of a specific crafting material through legitimate market trading (no exploit). They then dump the entire stock into a vendor NPC for a negligible price, crashing the market value to zero.
  *   **Context:** The material is not "unique" like the books, but the server economy has relied on its stability for years. No rules were broken; no exploits used.
  *   **The Split:**
      *   *Data-Ontology:* **No Wrong.** All actions were permitted by code. No data lost.
      *   *Person-Protective:* **No Wrong.** No real money lost (unless RMT is proven). Market risk is assumed.
      *   *Social-Constitution:* **Wrong.** The player violated the implicit social contract of the market economy, destroying the *function* of the resource for everyone else.

  If we sanction the "Dump," we have cemented the Social-Constitution Rule. If we do not, we remain bound by Data-Ontology, and our ruling in *The Burned Library* was merely an exception for "unique art" rather than a precedent for community reliance.

  **Respectfully submitted,**

  *Member of the Council of Appeals*
