answer: |-
  # JOINT STATEMENT ON THE STRUCTURE OF HARD CHOICES
  **Adversarial Collaboration Project | Value Theory Reading Group**
  **Date:** May 24, 2024
  **Parties:** Dr. Elena Vance (Comparativism) & Dr. Marcus Thorne (Parity Theory)
  **Coordinator:** [Your Name]

  ## PREAMBLE
  Over the past academic year, the undersigned have engaged in a structured debate regarding the normative structure of "hard choices." While we remain divided on the metaphysical and semantic explanation of these cases, we have identified significant common ground regarding the phenomenology and rational constraints of choice. This document records our agreements, maps our residual disagreements, and specifies the theoretical cruxes that determine the outcome of our dispute.

  ## I. JOINT COMMITMENTS
  *Both parties affirm the following claims. These claims are intended to rule out reductive explanations that neither party finds plausible.*

  1.  **Non-Epistemic Hardness:** Hard choices are not merely cases of evidential uncertainty. Even given full information about the non-normative facts and the agent's own preferences, the normative status of the options may remain unresolved in a way that generates rational struggle.
  2.  **Rationality Without Strict Superiority:** A chooser facing a hard choice can act rationally without it being true that she chose the *strictly better* option. Rational permissibility does not require strict maximization in every instance.
  3.  **Phenomenology and Meta-Ethics:** The phenomenology of struggle (the felt difficulty of choosing) is a real datum that any adequate theory must accommodate. However, this phenomenology is not, by itself, conclusive evidence for any specific meta-view about comparability (e.g., it does not prove incomparability, nor does it prove vagueness).
  4.  **Conceptual Distinction between Equality and Parity:** We agree that the relation "exactly as good as" and the relation "on a par" come apart in a descriptive sense. Specifically:
      *   If two options are **exactly equal**, they are rationally interchangeable; swapping between them arbitrarily entails no normative loss, and "money-pump" style arbitrage is irrational.
      *   If two options are **on a par** (as defined by the Parity Theorist), they resist such interchangeability; commitment to one option can generate new reasons that retroactively or prospectively block arbitrary switching, making arbitrage-like treatment inappropriate.
      *   *Note:* We disagree on whether any actual options instantiate the second relation, but we agree that *if* they do, it differs from equality in the manner described above.

  ## II. MAP OF RESIDUAL DISAGREEMENT
  *The following table isolates the specific points of contention. Formulations are negotiated to ensure each party accepts the wording of their own column.*

  | Point of Contention | The Comparativist Position (Vance) | The Parity Theorist Position (Thorne) |
  | :--- | :--- | :--- |
  | **1. The Completeness of Value** | The "better-than" relation (understood broadly to include "at least as good as") is complete. For any $A$ and $B$, one is better, worse, or exactly as good as the other. | The trichotomy thesis is false. There exist pairs $A$ and $B$ where none of the three standard relations hold; they are incomparable but not unrelated. |
  | **2. The Source of Indeterminacy** | Apparent incomparability is due to **semantic imprecision** or **vagueness** in our value concepts. The normativity is determinate, but our language/concepts cannot capture the precise cutoff. | Apparent incomparability is due to the **ontological structure of value**. Reasons run out; there is no fact of the matter about the ranking, even in principle. |
  | **3. The Role of the Will** | The will **tracks** reasons. In hard choices (ties/imprecision), the will selects between permissible options but does not *create* new normative reasons. | The will **creates** reasons. In hard choices (parity), the act of choosing itself generates normative reasons (e.g., for commitment) that did not exist prior to the choice. |

  ## III. THEORETICAL CRUXES AND PREDICTIONS
  *We identify three specific arguments or cases that bear decisively on our disagreement. For each, we specify the test case and record our divergent predictions.*

  ### Crux 1: The Small Improvement Argument (SIA)
  * **The Argument:** If $A$ is exactly equal to $B$, then a slightly improved $A$ ($A^+$) must be better than $B$. If $A^+$ is not better than $B$, then $A$ was not equal to $B$.
  * **The Test Case:** Consider two careers, Artist and Lawyer, judged to be "on a par." We introduce a small improvement to the Artist career ($Artist^+$), such as a marginal salary increase that does not change the nature of the work.
  * **Predictions:**
      *   **Comparativist:** If the agent is indifferent between Artist and Lawyer, $Artist^+$ **must** be judged strictly better than Lawyer. If the agent denies this, they are suffering from a cognitive illusion or threshold vagueness.
      *   **Parity Theorist:** It is possible for $Artist^+$ to remain **on a par** with Lawyer. The small improvement does not trigger a shift to "better than" because the options are in a zone of incomparability, not equality.

  ### Crux 2: Vagueness vs. Parity (The Sorites Test)
  * **The Argument:** If the difficulty is merely vagueness (Comparativism), then a Sorites chain of small improvements should eventually yield a clear "better than" judgment without a sharp cutoff. If it is parity (Parity Theory), there is a structural gap, not a blurry boundary.
  * **The Test Case:** A chain of 1,000 careers, where $C_1$ is clearly better than $C_{1000}$, but adjacent members $C_n$ and $C_{n+1}$ are hard to compare.
  * **Predictions:**
      *   **Comparativist:** The transition from "equal/imprecise" to "better" is smooth but determinate. The "hardness" is located at the boundary of our conceptual competence. Transitivity holds across the chain.
      *   **Parity Theorist:** Transitivity may fail for the "on a par" relation. One can be on a par with a neighbor, and the neighbor on a par with the next, without the first being on a par with the last. This non-transitivity is impossible under standard vagueness accounts of equality.

  ### Crux 3: Will-Based Reasons and Equality
  * **The Argument:** Does the power of commitment to generate reasons presuppose incomparability?
  * **The Test Case:** An agent chooses between two equal options (e.g., Buridan's Ass scenarios with identical bales of hay) vs. two hard choices (Careers).
  * **Predictions:**
      *   **Comparativist:** If options are **exactly equal**, commitment cannot generate reasons to prefer one over the other retroactively, as that would violate the initial equality. Any "created reason" must be external to the value of the options themselves.
      *   **Parity Theorist:** In **hard choices** (parity), commitment *does* generate reasons that make the chosen option better than it was prior to choice. This is available in parity cases but not in exact equality cases (where interchangeability remains).

  ## IV. NOTE ON VERBAL VS. SUBSTANTIVE DISPUTE
  *In the course of collaboration, we have identified a layer of verbal disagreement that must be separated from the substantive core.*

  **1. The Verbal Component:**
  Part of our dispute concerns the definition of the **"better-than relation."**
  *   The Comparativist often operates with a **weak** notion of "at least as good as" ($\geq$) as the primitive, claiming completeness for $\geq$.
  *   The Parity Theorist operates with a **strict** notion of "better than" ($>$) and "exactly as good as" ($\sim$) as primitives, claiming incompleteness for the set $\{>, <, \sim\}$.
  *   **Resolution:** We acknowledge that if the Comparativist defines "as good as" to include "imprecisely as good as," the claim "the relation is complete" is trivially true by stipulation. This is a verbal dispute about labeling the zone of indeterminacy.

  **2. The Substantive Core:**
  Once the terminology is fixed, a substantive disagreement remains regarding **Normative Authority**.
  *   Even if we agree to call the zone "imprecise equality" (Comparativist) or "parity" (Parity Theorist), we disagree on **whether the will can generate reasons** within that zone.
  *   The Comparativist holds that reasons are always *given* (mind-independent); the will only selects.
  *   The Parity Theorist holds that in the zone of indeterminacy/parity, the will can *make* reasons.
  *   **Conclusion:** This disagreement regarding the **normative power of agency** is not verbal. It is a substantive disagreement about the source of normativity in hard choices.

  ***

  **Signed,**

  _________________________
  Dr. Elena Vance

  _________________________
  Dr. Marcus Thorne

  _________________________
  [Your Name], Coordinator
