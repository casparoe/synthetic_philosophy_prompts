answer: |-
  Here is a sentence-by-sentence breakdown from the perspective of a quantitative risk manager.

  **Sentence 1:** *"The Kelly criterion says to size each bet so you maximize the geometric growth rate of your bankroll, which turns out to be the same thing as assuming you have logarithmic utility of wealth."*
  **Assessment:** **Accept.** This is mathematically sound. Maximizing the expected value of the logarithm of wealth is equivalent to maximizing the long-term geometric compound growth rate. This is the standard definition used in information theory and finance.
  **Nuance:** This equivalence holds strictly under the assumption of repeated betting with reinvestment over an infinite horizon. It does not necessarily apply to a single, one-off trade where you might care more about arithmetic expected value.

  **Sentence 2:** *"The deep insight is that ordinary expected-value reasoning is self-defeating: any bet sized above the Kelly fraction has negative expected growth, so an EV-maximizer who takes every positive-EV bet will go broke with probability one."*
  **Assessment:** **Subtly Wrong.** The first half is correct (linear EV reasoning leads to ruin in repeated games). However, the claim that *any* bet above Kelly has *negative* expected growth is false.
  **Nuance:** In most standard models, expected geometric growth remains positive between 1x Kelly and 2x Kelly; it is merely sub-optimal. Expected growth only turns truly negative (meaning your wealth trends to zero asymptotically) once you exceed *double* the Kelly fraction. While over-betting is dangerous, the "danger zone" starts earlier than ruin, but ruin itself usually requires significantly more than just 1.1x Kelly.

  **Sentence 3:** *"The Kelly bettor, by contrast, can never go broke, because log utility isn't defined at zero wealth."*
  **Assessment:** **Dangerously Wrong.** This is the most critical error in the summary.
  **Nuance:** First, the mathematical domain of a function (log utility) does not protect physical capital. Second, in real-world trading, "never" is impossible. Discontinuous price gaps, leverage constraints, transaction costs, and, most importantly, **estimation error** can all lead to ruin even when targeting Kelly. If you overestimate your edge (which is common), you are effectively betting over-Kelly and *can* go broke. Theoretically, in a frictionless binomial model with perfect odds knowledge, full Kelly avoids zero asymptotically, but that model does not describe your friend's trading account.

  **Sentence 4:** *"And when you're unsure about the true odds, the standard fix is half-Kelly, which is exactly optimal under uncertainty."*
  **Assessment:** **Misleading.** Half-Kelly is a robust heuristic, not a mathematical optimum.
  **Nuance:** Half-Kelly is popular because it delivers roughly 75% of the maximum growth rate with only 50% of the volatility, providing a safety margin against parameter error. However, calling it "exactly optimal" implies there is a theorem that says 50% is the magic number for all forms of uncertainty. In reality, the optimal fraction under uncertainty depends on the specific Bayesian prior distribution of your edge; sometimes it is 1/3 Kelly, sometimes 1/4. It is a rule of thumb, not a law.

  **Sentence 5 (Bottom Line):** *"Never size above Kelly, because anything more is literally worse."*
  **Assessment:** **Practically Sound, Theoretically Imprecise.**
  **Nuance:** Does this advice survive the corrections? **Yes.** Even though the math above was slightly off (growth is positive between 1x and 2x Kelly), the practical advice holds. Beyond the Kelly fraction, you are taking on disproportionate risk for diminishing returns. Given that you almost certainly don't know your true edge precisely, betting above Kelly implies you are almost certainly betting above *true* Kelly, which puts you in the ruin zone. So, while "literally worse" is technically only true regarding growth rate optimization, it is effectively true regarding risk-adjusted survival.

  **Summary:** Your friend understands the theory but conflates the mathematical model with reality. The link between log utility and growth is correct, but treating the math as a shield against actual bankruptcy is a category error. The utility function describes your preferences, not the market's behavior.

  Verdict: The "never go broke" assurance.
