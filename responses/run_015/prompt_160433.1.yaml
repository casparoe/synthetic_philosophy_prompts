  5.  **Drafting Section 3: The Four Cruxes:**
      *   *Crux 1: Clean-Lottery.* Physical chance known (1 in $10^9$). No model uncertainty.
          *   Fanatic: Fund it. EV is huge.
          *   Anti-Fanatic: If she declines here, she rejects EV normativity. If she funds here, her objection to Option L was purely about *model uncertainty* (epistemic), not the math.
          *   *Verdict:* This distinguishes epistemic vs. normative disagreement.
      *   *Crux 2: Reliability Rule (Cutoff vs. Continuous).*
          *   Is it a binary "ignore" or a discount factor?
          *   If discount factor: Is Anti-Fanatic just a Fanatic with a prior penalty on single-model estimates?
          *   *Verdict:* Likely verbal if it's just a prior adjustment. Substantive if it's a lexical threshold.
      *   *Crux 3: Portfolio Argument.*
          *   Fanatic: 40 bets/year. Law of Large Numbers (LLN) applies eventually.
          *   Anti-Fanatic: LLN doesn't apply to tail risks with model uncertainty. The "aggregate upside" depends on the models being right.
          *   *Settlement:* Monte Carlo needs to show variance/convergence properties under model misspecification.
      *   *Crux 4: Empirical Tracking.*
          *   Calibration of expert probabilities at $10^{-9}$.
          *   Fanatic prediction: They track (or we must assume they do).
          *   Anti-Fanatic prediction: They are overconfident/miscalibrated.
