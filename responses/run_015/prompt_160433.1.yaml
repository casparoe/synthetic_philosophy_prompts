      *   **Structure:**
          1.  Numbered list of agreed claims.
          2.  Table of residual disagreements (phrased in each side's voice).
          3.  Analysis of four specific cruxes (Clean-Lottery, Reliability Rule nature, Portfolio Argument, Empirical Tracking).
          4.  Identification of verbal vs. substantive disagreements.
          5.  Constraint: Argue from cases/numbers only; no citations/literature.
      *   **User's Hypotheses to Check:** Agreement on moderate cases, model uncertainty as mixture, no Dutch-book argument.

  2.  **Deconstruct the Positions:**
      *   **Fanatic:** Pure Expected Value (EV) maximizer. $EV = P \times V$. If $EV > Cost$, fund. In the specific case: $S = 0.95 \times 4000 = 3800$. $L = 3 \times 10^{-9} \times 10^{22} = 3 \times 10^{13}$. $L$ dominates $S$ by orders of magnitude.
      *   **Anti-Fanatic:** EV is not action-guiding when $P$ is tiny and $V$ is huge *unless* $P$ is robust. The probability $3 \times 10^{-9}$ comes from a *single* untested structural model. She requires the probability to survive re-derivation across an ensemble of non-ruled-out models.
      *   **The Conflict:** Epistemic humility vs. Normative commitment to EV. Is the probability estimate reliable enough to justify the bet?

  3.  **Drafting Section 1: Agreed Claims:**
      *   *Hypothesis Check:* Do they agree on moderate cases? Yes, likely. Both would fund $S$ over a null option.
      *   *Hypothesis Check:* Model uncertainty as mixture? Yes, both likely accept Bayesian model averaging in principle, but disagree on *when* the mixture yields a usable number.
      *   *Hypothesis Check:* No Dutch-book? Yes, this is a one-shot or limited-repeat scenario with deep uncertainty, not a coherent betting market.
      *   *Drafting:* Need to find common ground on the goal (maximize impact), the input (models), and the specific case constraints (single model for L).

  4.  **Drafting Section 2: Residual Disagreements (Table):**
      *   Need to phrase rows in *their* voices.
      *   *Fanatic:* "You are ignoring value."
      *   *Anti-Fanatic:* "You are trusting noise."
