      *(Self-Correction during drafting Crux 1)*: If Anti-Fanatic funds the Clean Lottery, she admits EV is normative. Her objection to Option L is *only* about the $3 \times 10^{-9}$ being unreliable. If she declines Clean Lottery, she is an EV-skeptic. This is the pivotal distinction.
      *(Self-Correction during drafting Crux 2)*: If the rule is continuous (e.g., discount probability by model count), then she *is* a Fanatic with a different prior on model reliability. This makes the disagreement verbal (about how to encode uncertainty into P).
      *(Self-Correction during drafting Crux 3)*: 40 allocations is not enough for LLN on $10^{-9}$ events. You need $10^9$ trials. Fanatic is mathematically wrong about the portfolio saving him here unless the *class* of bets has a higher hit rate. Anti-Fanatic is right about the aggregate being model-dependent.
