  6.  **Refining the Output (Self-Correction/Review):**
      *   *Constraint Check:* "Argue from the cases and the numbers only; no citations."
      *   *Tone:* Professional, committee-ready, precise.
      *   *User's Guess:* "Tell me if any of that is wrong." I need to explicitly address the user's hypotheses in the analysis or preamble.
          *   *Moderate cases:* Correct, they agree.
          *   *Model uncertainty as mixture:* Correct in principle, but Anti-Fanatic thinks the mixture variance is too high.
          *   *Dutch-book:* Correct, not applicable here.
      *   *Verbal Disagreements:* Need to explicitly mark these. The "Reliability Rule" definition is the biggest candidate for verbal dispute (is it a prior or a veto?).

  7.  **Final Polish:**
      *   Ensure the table rows sound like the personas.
      *   Ensure the Crux section clearly states the "Move" condition (what evidence changes their mind).
