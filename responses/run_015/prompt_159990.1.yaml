  **Brainstorming Notes**

  *   **Voight-Kampff Test (Leon & Rachael):**
      *   *Thesis:* Explanatory Computationalism (inferring internal state from output).
      *   *Weight:* High. Illustrates the implementation problem (is the physical response implementing 'empathy' or 'circuitry'?).
      *   *Decision:* Keep. Central to the Turing-test analogue.
  *   **Rachael's Implanted Memories:**
      *   *Thesis:* Content Problem (syntax vs. semantics) & Provenance Sensitivity.
      *   *Weight:* High. Directly addresses whether history matters for mentality.
      *   *Decision:* Keep. Crucial for the "provenance" argument.
  *   **Nexus-6 Biology (Grown, 4-year span):**
      *   *Thesis:* Architectural Computationalism (wetware vs. hardware).
      *   *Weight:* Medium. Undermines the idea of the brain as a digital computer.
      *   *Decision:* Keep. Supports the critique of Architectural Computationalism.
  *   **Roy's Dying Monologue:**
      *   *Thesis:* Phenomenology vs. Computation.
      *   *Weight:* High. Resists reduction; focuses on mortality and loss.
      *   *Decision:* Keep. Essential for showing where the film resists the computational reading.
  *   **Deckard's Ambiguity (Unicorn/Origami):**
      *   *Thesis:* Provenance Sensitivity & Kripkean Origin Essentialism.
      *   *Weight:* High. The core tension regarding whether origin matters metaphysically.
      *   *Decision:* Keep. The pivot point of the essay.
  *   **Discard:** Specific technical details of the Tyrell Corporation's engineering; the specific mechanics of the VK test beyond its function; minor characters (Pris, Zhora) unless relevant to the "grown" argument (they are not distinct enough from Roy/Rachael for this specific philosophical point).

  ***

  **The Engineered Mind: Computationalism and Provenance in *Blade Runner***

  Ridley Scott's *Blade Runner* is frequently conscripted into service as a cinematic illustration of the Turing test, yet such a reading often flattens the film's philosophical texture into a simple query about behavioural output. To treat the film as a sustained object of criticism within the philosophy of mind requires a finer granularity, specifically regarding the distinctions between explanatory, constitutive, and architectural computationalism. The film does not merely ask whether machines can think; it interrogates the conditions under which we grant the status of 'thinker' to an entity. By examining the nexus of biology, memory, and origin, the narrative exposes a tension between functionalist metaphysics and what might be termed provenance sensitivity—the intuition that the history of a cognitive system matters to its mental status.

  Architectural computationalism, the claim that the brain is literally a digital computer running discrete symbol-level programmes, finds little defence in the film's ontology. The replicants are not assembled from silicon and wire; they are grown. They are organic, possessing wetware that is continuous, stochastic, and metabolically expensive, much like the human beings they mimic. This biological reality aligns with contemporary critiques that view the brain as distinct from the von Neumann architecture of traditional computing. Consequently, the film effectively dismantles architectural computationalism while leaving constitutive computationalism—the identity claim that mental states are computational states regardless of substrate—intact. The Voight-Kampff test operates on this constitutive assumption. It attempts to read the internal computational state of the subject through physiological outputs, such as pupil dilation and blush response. The test presupposes that if the functional organisation is correct, the mental state is present. However, the film complicates this by introducing the implementation problem. When Leon fails the test, is it because his physical system fails to implement the correct causal organisation, or because the examiner lacks the key to interpret his specific physicality? The film suggests the latter, hinting that the mapping between physical state and computational description is not as transparent as explanatory computationalism hopes.

  The crisis of constitutive computationalism emerges most sharply in the character of Rachael. She believes herself to be human until confronted with the evidence that her memories are implants, photographs provided by another. Here, the content problem becomes visceral. Computationalism individuates states syntactically; a memory is a data structure retrieved and processed. Yet, Rachael's distress upon learning the truth suggests that mentality requires more than syntactic manipulation; it requires semantic grounding in a lived history. If constitutive computationalism is true, the origin of the data should be metaphysically irrelevant. A memory state implemented in a brain grown in a vat should be identical to one implemented in a brain born of a womb, provided the computational organisation is isomorphic. Rachael's reaction, however, implies that the *provenance* of the state matters. Her grief is not merely about the falsity of the data, but about the loss of a causal history she never possessed. This supports a reading of the film as exploring provenance sensitivity: our attribution of mentality tracks not just organisation, but where that organisation came from.

  This tension culminates in the ambiguity surrounding Deckard. If the film implies Deckard is a replicant, evidenced by the unicorn dream matching Gaff's origami figure, it forces a confrontation with Kripkean origin essentialism. Kripke argued that an individual's origin is essential to their identity; one could not have come from different parents and still be the same person. If Deckard is manufactured, a strict functionalist might argue his mind is real if his functions are human-like. Yet the drama of the film hangs on the revelation of his origin, suggesting that being 'born' carries a metaphysical weight that being 'made' does not. This looks like a commitment to anti-functionalist essentialism. However, a sophisticated constitutive computationalist might rescue the view by distinguishing between metaphysical identity and moral status. One could argue that while Deckard's mind is computationally constituted regardless of origin, the social and legal category of 'human' is historically defined. The tragedy is not that Deckard lacks a mind if he is a replicant, but that the moral community excludes him based on a history he did not choose. The film thus allows the computationalist to concede the sociological point without abandoning the metaphysical one.

  Nevertheless, there are points where the film resists being pressed into an argument about the computational theory of mind. To view Roy's death solely through the lens of implementation is to distort the scene's emotional weight. When he recalls the things he has seen and grieves that they will be lost, he is not validating his computational architecture; he is asserting the value of phenomenological experience. The four-year lifespan imposed on the Nexus-6 models is not a bug in their programming but a constraint on their existence, introducing mortality into the machine. This speaks to issues of exploitation and the authority to classify persons rather than the nature of computation. The film is ultimately about the power dynamics inherent in defining what counts as a mind. The Tyrell Corporation's authority to set the incept date and the termination date highlights that the 'mind' is also a legal category subject to property rights. Pressing the film into a pure debate about functionalism risks ignoring this political dimension, where the question is not 'does it compute?' but 'may it be retired?'.

  Ultimately, *Blade Runner* adds something to the debate that abstract arguments often lack: the first-personal sting of engineered existence. The literature on computationalism often treats the implementation problem as a logical puzzle regarding causal organisations. The film dramatises the existential anxiety of discovering that one's interiority is the product of external design. It highlights the dependence of mentality on a history one did not choose, suggesting that while constitutive computationalism might hold metaphysically, it is insufficient for a complete ethics of mind. The film suggests that even if the brain is a computer, the story it tells itself about its own origin is constitutive of its lived reality. In doing so, it does not refute computationalism, but it demands that any viable theory of mind must account for the narrative weight of provenance, bridging the gap between abstract organisation and the concrete reality of a life lived under the shadow of manufacture.
