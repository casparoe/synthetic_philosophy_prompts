answer: |-
  **Title:** Endogenous Reference Classes in Evidential Cooperation

  **1. The Question and Formalism**
  The project asks: In a large world where agents can costly manipulate their similarity to others, does evidential decision theory prescribe cooperation? I define a "large world" as a population of $N$ agents facing identical one-shot Prisoner's Dilemmas. Payoffs are standard: $T > R > P > S$. Agents are correlated via shared causes (environment, history, algorithm). Let $\rho$ be the correlation between the focal agent's action and the average action of counterparts. In standard evidential decision theory (EDT), the agent maximizes evidential expected utility (EEU), where the value of cooperation increases with $N \cdot \rho$.

  Here, I fix the formalism such that $\rho$ is not exogenous. The agent chooses an action $a \in \{C, D\}$ and a similarity profile $s \in [0,1]$. Higher $s$ increases $\rho(s)$ but incurs a cost $c(s)$ (e.g., reduced flexibility, information gathering costs). The agent also chooses an information state $I$, where greater knowledge of shared causes reduces residual correlation. The question is determinate: Does there exist a stable fixed point $(a^*, s^*, I^*)$ such that as $N \to \infty$, $a^* = C$? Specifically, does the evidential benefit of swaying $N$ counterparts outweigh the cost of maintaining the similarity required to evidence that sway?

  **2. Why Existing Answers Leave It Open**
  Standard treatments leave this open because they hold the reference class fixed. Two-agent cases do not scale; the evidential boost required to swamp causal defection depends on $N$, which is negligible in small groups but dominant in large worlds. Causal decision theory ignores $\rho$ entirely. Functional decision theory (FDT) treats the decision algorithm as the unit of evaluation but typically assumes the algorithm is fixed prior to the decision problem, not chosen simultaneously with the action under epistemic costs.

  *Honesty Constraint:* I must acknowledge that treating similarity as a choice variable overlaps significantly with work on logical correlation and program equilibrium. If "managing similarity" is merely renaming "selecting a logical algorithm," this project offers no new traction. Furthermore, the conjecture that act/policy distinctions collapse may rest on a confusion between *choosing* a policy and *acting* on one. This project tests whether the *epistemic costs* of similarity generate distinct predictions from standard logical decision theory, rather than assuming they do. Existing work on ratifiability ensures stability but does not solve the selection of the reference class when similarity is manipulable. This gap remains open.

  **3. Method: Twelve-Month Plan**
  *Months 1–3 (Formalization):* Define the cost function $c(s)$ and correlation function $\rho(s, I)$. Establish the fixed-point condition for EEU maximization. Deliverable: A formal model specification.
  *Months 4–6 (Existence Proofs):* Prove existence of equilibria in symmetric cases where $N$ is finite but large. Determine if multiple fixed points exist (e.g., a high-similarity/cooperation equilibrium vs. a low-similarity/defection equilibrium). Deliverable: Proof of existence or non-existence for specific functional forms.
  *Months 7–9 (Worked Cases):* Construct asymmetric cases where agents differ in information costs. Illustrate how information avoidance becomes rational to preserve evidential leverage. Deliverable: Three detailed case studies.
  *Months 10–12 (Synthesis):* Analyze the limit as $N \to \infty$. Test the conjecture regarding the collapse of act/policy distinctions. Deliverable: Draft dissertation chapter.
  *Scope Honesty:* A single year cannot deliver a general proof for all correlation structures; Months 4–6 will restrict attention to linear and convex cost functions. Generalization remains a conjecture.

  **4. Possible Conclusions**
  *Yes:* The model yields a unique stable fixed point where $a^*=C$ and $s^* > 0$. This implies that in large worlds, rational evidential agents invest in similarity to secure cooperative gains.
  *No:* The cost of similarity always outweighs the evidential benefit, or the only stable fixed point is $a^*=D$. This implies evidential cooperation is unstable when similarity is endogenous.
  *Ill-Posed:* No fixed point exists; the agent cycles between increasing similarity to cooperate and decreasing similarity to save costs. This would suggest the decision problem is dynamically unstable under EDT.
  The deciding consideration will be the slope of $\rho(s)$ relative to $c(s)$. If the marginal evidential gain exceeds marginal cost at the threshold of cooperation, the answer is Yes.

  **5. Failure Conditions**
  This project fails if the formal model demonstrates that endogenous similarity has no effect on the optimal action compared to exogenous models. If the optimal $s^*$ is always 0 or 1 regardless of $N$, or if the equilibrium action matches standard causal decision theory prescriptions solely due to cost structures, the hypothesis that "large worlds turn this into a genuine problem" is false. Additionally, failure occurs if the fixed-point formulation proves mathematically incoherent without yielding philosophical insight. I will not wriggle out of this by claiming the costs were "modelled incorrectly"; if the formalism holds, the negative result stands.

  **6. Response to Key Objection**
  The expected objection is that this is merely a reason to reject EDT entirely: correlations are not reasons for action, so managing them is irrational. This project does not defend EDT against causal critics. Rather, it operates internally: *If* one accepts evidential reasons, does managing the evidence change the verdict? If the answer is Yes, it shows EDT has resources to handle large-world coordination that static models miss. If the answer is No, it strengthens the case against EDT by showing it collapses under endogenous reference classes. Either way, the result advances the literature on decision-theoretic stability.

  **Scope Limitation**
  Regarding the six items above, a one-year fellowship cannot deliver Item 4 (Possible Conclusions) as a settled normative fact. It can only deliver formal conditions under which each conclusion holds. A full normative defense of why agents *should* treat correlations as reasons, or empirical validation of human behavior in large worlds, is outside the scope of this theoretical year.
