      *   **Goal:** Produce formulations neither side would disown, making the residual disagreement exact.

  2.  **Deconstruct the Positions:**
      *   **Intellectualism (Stanley & Williamson, etc.):** Knowing-how is a species of knowing-that. $S$ knows how to $\phi$ iff $\exists w$ such that $S$ knows that $w$ is a way to $\phi$ (under a practical mode of presentation). Key arguments: Linguistic embedding (knows how to $\phi$ behaves like knows where/when to $\phi$), regress arguments against Ryle can be blocked.
      *   **Anti-Intellectualism (Ryle, Hawley, Noë, etc.):** Knowing-how is distinct from knowing-that. It's a capacity/disposition. Reducing it to propositions leads to regress (need to know how to apply the proposition). Key arguments: Amnesic patients (can ride bikes but don't remember learning), unreflective experts (act without propositional thought), over-intellectualization of skill.

  3.  **Drafting Section 1: Agreed Claims (The Common Ground):**
      *   *Challenge:* Avoid trivialities like "people know things." Need substantive agreement on the *phenomena* even if explanations differ.
      *   *Idea 1:* Both agree that standard linguistic data is relevant.
      *   *Idea 2:* Both agree that "knowing-how" attributions are sometimes true and sometimes false.
      *   *Idea 3:* Both agree that capacities are involved, even if one thinks they *constitute* the knowledge and the other thinks they are *evidence* of it.
      *   *Idea 4:* Both agree that Ryle's Regress is a serious challenge that needs addressing (even if they address it differently).
      *   *Idea 5:* Both agree that neurological dissociation (HM, etc.) is relevant data.
      *   *Refinement:* Make them sound like philosophical commitments, not just observations.
      *   *Drafting:*
          1.  Linguistic uniformity: "Knows how" shares syntactic features with other embedded question constructions.
          2.  Capacity condition: Possession of the relevant ability is necessary for true "knows how" attribution (mostly, barring Gettier-style cases).
          3.  Regress challenge: Any account must explain how knowledge guides action without invoking an infinite chain of prior knowledge.
          4.  Dissociation data: Cases like HM show a dissociation between declarative memory and skilled performance, which any theory must accommodate.
          5.  Normativity: Knowing-how entails a normative status (success is not accidental).

  4.  **Drafting Section 2: Disagreements Table:**
      *   *Challenge:* Phrasing must be acceptable to the proponent.
      *   *Point 1: Metaphysical Constitution.*
          *   Int: K-how is identical to a K-that relation.
          *   Anti: K-how is constituted by dispositions/capacities, not propositional attitudes.
      *   *Point 2: The Role of Propositions.*
          *   Int: Propositional content is essential to the *nature* of the knowledge.
          *   Anti: Propositional content is at best contingent/causal; the *nature* is non-propositional.
      *   *Point 3: Ryle's Regress.*
          *   Int: The regress is blocked by the "practical mode of presentation" (knowing a way *as* a way to act).
          *   Anti: The regress stands; invoking a proposition requires a further know-how to apply it.
      *   *Point 4: Linguistic Evidence.*
          *   Int: Syntax mirrors ontology (embedded questions denote propositions).
          *   Anti: Syntax is a poor guide to metaphysics (pragmatics masks distinct underlying states).

  5.  **Drafting Section 3: Crux List:**
      *   *Challenge:* What would actually change a mind? This is the hardest part. Philosophers rarely change minds based on single cases. Need *structural* cruxes.
      *   *Crux 1: The "Propositional Grasp" in Non-Humans/Infants.*
          *   Case: Do animals/infants have K-how without capacity for K-that?
          *   Int Prediction: Either they lack K-how (in the strict sense) or they possess rudimentary propositional attitudes.
          *   Anti Prediction: They have full K-how without any propositional attitudes.
      *   *Crux 2: The Neural Realization of "Modes of Presentation".*
          *   Case: Can neuroscience identify a distinct neural signature for "practical" vs "theoretical" grasp of the same content?
          *   Int Prediction: Yes, distinct systems encode the same proposition differently.
          *   Anti Prediction: No, distinct systems encode different *kinds* of states (map vs. list).
      *   *Crux 3: The "Lost Interpretation" Case.*
          *   Case: A subject retains ability but loses all conceptual grasp of *what* they are doing (radical aphasia + agnosia but preserved motor skill).
          *   Int Prediction: They no longer know *how* (in the semantic sense), only *can*.
          *   Anti Prediction: They still know *how*; the conceptual loss is irrelevant to the skill itself.

  6.  **Drafting Section 4: Verbal Dispute Assessment:**
      *   *Analysis:* Is it just about the word "knowledge"?
