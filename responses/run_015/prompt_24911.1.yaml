  # JOINT STATEMENT ON THE NATURE OF KNOWLEDGE-HOW
  **Prepared by the Adversarial Collaboration on Epistemic Architecture**
  **Date:** October 26, 2023
  **Signatories:** [The Intellectualist Bloc] & [The Anti-Intellectualist Bloc]

  ## PREAMBLE
  This document represents the outcome of a structured dialogue between proponents of Intellectualism (the view that knowledge-how is a species of knowledge-that) and Anti-Intellectualism (the view that knowledge-how is a distinct, capacity-based epistemic kind). Our goal is not consensus on the ultimate metaphysics, but precision regarding the locus of disagreement. We agree that the debate has often suffered from talking past one another regarding linguistic data, neurological cases, and the force of regress arguments. The following sections delineate our common ground, our precise points of divergence, the empirical or argumentative cruxes that would shift our positions, and an assessment of the verbal versus substantive nature of the dispute.

  ---

  ## 1. SUBSTANTIVE CLAIMS OF AGREEMENT
  *Both parties affirm the following claims. These are not mere truisms but substantive commitments regarding the data and constraints any successful theory must accommodate.*

  1.  **The Linguistic Data is Fixed:** The syntactic behavior of "knows how" constructions (e.g., embedding under question words, interaction with quantifiers) is a legitimate constraint on semantic theory. Both sides agree that Stanley and Williamson's linguistic arguments establish a *prima facie* case for uniformity with other embedded question constructions (e.g., "knows where," "knows when").
  2.  **The Normative Condition:** Attributions of knowledge-how are normative, not merely descriptive of success. A subject who succeeds at $\phi$-ing purely by luck or accident does not know how to $\phi$. Both sides agree that knowledge-how entails a non-accidental connection between the agent's state and successful performance.
  3.  **The Regress Challenge is Legitimate:** Ryle's Regress Argument (that intellectualism requires an infinite chain of prior contemplations to apply rules) identifies a genuine structural problem for any view that posits propositional mediation in skilled action. Both sides agree that a satisfactory theory must explain how knowledge guides action without requiring an explicit, occurrent propositional rehearsal prior to every act.
  4.  **Neurological Dissociation is Relevant:** Cases of dissociation between declarative memory and procedural performance (e.g., patient H.M., skilled amnesics) constitute hard data. Both sides agree that a theory of knowledge-how must explain why declarative recall can be lost while skilled performance remains intact, without begging the question by defining "knowledge" solely as "declarative."
  5.  **Practical Modes are Real:** Both sides acknowledge that there is a phenomenological and functional difference between grasping a proposition theoretically (e.g., knowing the physics of a bike) and grasping it practically (e.g., riding the bike). The disagreement lies in whether this difference is a difference in *kind of knowledge* or a difference in *mode of presentation* of the same knowledge relation.
  6.  **Ability is the Default Evidence:** While the parties disagree on whether ability is *constitutive* of knowledge-how, both agree that in standard contexts, the possession of the ability to $\phi$ is the primary evidence for attributing knowledge-how to $\phi$. Exceptions (e.g., paralysis) are treated as marked cases requiring specific explanation by both sides.

  ---

  ## 2. TABLE OF DISAGREEMENTS
  *The following table isolates the precise points of divergence. The phrasing in each column is intended to be acceptable to the proponent of that view.*

  | Point of Contention | The Intellectualist Position | The Anti-Intellectualist Position |
  | :--- | :--- | :--- |
  | **Metaphysical Constitution** | Knowing-how to $\phi$ is *identical* to standing in the knowledge relation to a proposition $p$ (specifically, that $w$ is a way to $\phi$), held under a practical mode of presentation. | Knowing-how to $\phi$ is *constituted* by a complex of dispositions, capacities, and sensorimotor contingencies. It is not identical to any propositional attitude. |
  | **The Role of Propositions** | Propositional content is essential to the *nature* of knowledge-how. Even if unarticulated during performance, the capacity is grounded in the subject's grasp of a truth-apt representation. | Propositional content is at best contingently associated with knowledge-how. The core of skilled performance is non-representational coupling between agent and environment. |
  | **Resolution of Ryle's Regress** | The regress is blocked by the **Practical Mode of Presentation**. One can know a proposition *as a way to act* without needing a further piece of knowledge to apply that proposition. The mode itself dictates action. | The regress remains fatal. Invoking a "practical mode" is a label, not an explanation. To use a proposition to guide action requires a prior know-how (a capacity) to interpret that proposition, reinstating the regress. |
  | **Semantics vs. Metaphysics** | The semantic uniformity of "knows" + embedded question strongly suggests metaphysical unity. We should not posit distinct epistemic kinds without overwhelming evidence, as this violates parsimony. | Semantic uniformity is a poor guide to metaphysical ontology (e.g., "bank" is uniform but refers to distinct kinds). The phenomenology of skill suggests a distinct ontological category that semantics masks. |
  | **The "Paralysis" Intuition** | A paralyzed expert still knows *how* to fly a plane, even if they cannot *do* it. This proves knowledge-how is a mental state distinct from ability. | In the paralysis case, we are speaking loosely or metaphorically. Strictly speaking, if the capacity is permanently removed, the knowledge-how degrades or becomes a memory of past knowledge-how. |

  ---

  ## 3. CRUX LIST
  *These are sub-questions or empirical paradigms such that, if settled, at least one side would be compelled to revise their core position. We record our divergent predictions regarding what these investigations would reveal.*

  ### Crux 1: The Non-Conceptual Agent
  *   **The Case:** A rigorous demonstration of an agent (e.g., a specific class of non-human animals or human infants) that possesses robust, flexible, means-end skilled behavior (K-how) but demonstrably lacks the cognitive architecture required to entertain *any* propositional attitudes (K-that), even non-linguistic ones.
  *   **Intellectualist Prediction:** Either such agents do not truly possess knowledge-how (only mere habit), or further investigation will reveal they possess rudimentary propositional capacities (e.g., map-like representations that function propositionally).
  *   **Anti-Intellectualist Prediction:** Such agents possess full-blooded knowledge-how. This would prove that propositional knowledge is not necessary for knowledge-how, falsifying strong Intellectualism.

  ### Crux 2: Neural Signatures of "Modes"
  *   **The Paradigm:** Neuroimaging or computational modeling that isolates the neural correlate of the "practical mode of presentation." We look for a case where the *same* propositional content is encoded in two distinct neural formats: one "theoretical" and one "practical."
  *   **Intellectualist Prediction:** We will find distinct encoding formats (e.g., declarative hippocampal vs. procedural striatal) that can be shown to encode the *same* content (e.g., "turn left") but with different functional roles. This supports the "same relation, different mode" view.
  *   **Anti-Intellectualist Prediction:** We will find that the "practical" system does not encode content truth-functionally at all (e.g., it encodes affordances or motor vectors, not propositions). This supports the "distinct kind of state" view.

  ### Crux 3: The "Lost Interpretation" Case
  *   **The Case:** A subject suffers brain damage resulting in the loss of all semantic/conceptual understanding of a task (they cannot describe it, recognize tools, or understand instructions) while retaining the ability to perform the task flawlessly. Crucially, they also lose the ability to *teach* or *correct* others.
  *   **Intellectualist Prediction:** This subject retains *ability* but loses *knowledge-how*. Knowledge-how requires the potential for propositional articulation (even if dispositional). The loss of semantic grasp entails the loss of the knowledge relation.
  *   **Anti-Intellectualist Prediction:** This subject retains *knowledge-how*. The inability to articulate or teach is a loss of meta-cognitive access, not a loss of the skill-knowledge itself. This dissociation proves K-how is distinct from K-that.

  ---

  ## 4. ASSESSMENT OF VERBAL DISPUTE
  *Is the disagreement merely verbal?*

  **Verdict:** The dispute is **not merely verbal**, but it contains a significant verbal component that exacerbates the substantive disagreement.

  **The Verbal Component:**
  There is a divergence in the *extension* of the term "knowledge."
  *   **Intellectualists** tend to treat "knowledge" as a unified natural kind term, where variations (perceptual, propositional, practical) are species of a single genus defined by factivity and justification/warrant.
  *   **Anti-Intellectualists** tend to treat "knowledge" in "knowledge-how" as a homonym or a distinct epistemic verb, closer to "competence" or "mastery."
  *   *Resolution:* If both sides agreed to use "Knowledge-That" for propositional attitudes and "Competence" for capacities, the dispute would shift to: *"Is Competence constituted by Propositional Attitudes?"* This reformulation preserves the substantive disagreement while removing the semantic confusion regarding the word "knowledge."

  **The Substantive Component:**
  Even after terminological standardization, a genuine metaphysical disagreement remains regarding the **architecture of cognition**.
  1.  **Representationalism vs. Enactivism:** The Intellectualist is committed to the view that skilled action is ultimately guided by internal representations with truth conditions. The Anti-Intellectualist is often committed to the view that skilled action is guided by direct agent-environment coupling without truth-apt intermediaries.
  2.  **The Explanatory Gap:** The Intellectualist must explain how a propositional state causes fluid, rapid motor action without a "homunculus" reading the proposition. The Anti-Intellectualist must explain how non-propositional capacities exhibit the flexibility and rationality typically associated with cognitive states.

  **Conclusion:**
  The parties agree that the dispute is not *merely* verbal because the outcome determines how we model the mind. If Intellectualism is true, cognitive science should focus on uncovering the implicit propositional structures guiding action. If Anti-Intellectualism is true, cognitive science should focus on dynamical systems and embodied capacities that operate without propositional structure. This is a disagreement about the fundamental ontology of the mental, not just the definition of a word.

  ---
  **Signed,**

  *The Intellectualist Bloc*
  *The Anti-Intellectualist Bloc*
