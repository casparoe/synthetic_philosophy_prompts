answer: |-
  Good evening everyone, and thank you for being here to celebrate thirty years of Ms. Drake's work. Looking around this room, I see the full spectrum of her life, from the family who loved her long before she ever stepped into a classroom to the students and neighbors who walked alongside her in the messy work of local politics. It is a rare thing to find a group of people who share so little common ground on paper yet are gathered here out of such deep shared affection, and I think that split right down the middle is actually the perfect place to start talking about who she is and what she taught us. When most people think about a career in civics or public service, they imagine a story about building coalitions and finding unity, and while Ms. Drake certainly brought people together, she never did it by asking us to blend into a crowd. In fact, she spent three decades teaching us to be wary of the comfort that comes from blending in. She often spoke about something she called the gravity of the collective, that invisible force that pulls our individual judgment downward whenever we pledge too much loyalty to a group, a party, or a movement. She believed that when we let a group do our thinking for us, we lose the ability to see the people standing right in front of us, and so she made a lifelong practice of resisting that pull.

  To her family here tonight, I know this might sometimes have looked like stubbornness or a refusal to pick a side, but I want to suggest that it was actually a profound form of integrity. She didn't join parties or sign up for ideologies because she wanted to remain fully available to the truth of each specific situation and each specific person. She loved you all too much to let a label stand between her and what was right, and she loved her community too much to let a platform dictate how she treated a neighbor. That kind of independence is hard work, and it can be lonely, but it means that when she gave you her word, it was hers alone, not borrowed from a committee or a slogan. For those of us who were her students or fellow activists, this was the hardest and most valuable lesson she ever taught. She showed us that real change doesn't happen when we march in lockstep, but when we have the courage to stand on our own two feet and judge things as they are, not as our team says they should be. She never asked us to follow her lead blindly because that would have violated the very thing she was trying to protect in us, which was our own capacity to think clearly without the distortion of group loyalty.

  So as we raise a glass to her retirement, we are not just celebrating the end of a job, but the beginning of a well-earned release from that gravity. For thirty years she held herself upright against the pressure to conform so that she could keep her eyes level with everyone else's, and now she gets to put that weight down. She gets to rest in the knowledge that she never asked anyone to believe something she hadn't examined herself, and she leaves behind a legacy of people who are learning to do the same. To her family, thank you for sharing her with us and for grounding her in the love that made her strong enough to stand apart. To her colleagues and students, let us promise to keep thinking for ourselves, which is the only tribute she would ever want. Here is to you, Ms. Drake, may your next chapter be light, may your judgment remain your own, and may you enjoy the freedom of belonging to nothing but yourself and the people you love. Cheers.
