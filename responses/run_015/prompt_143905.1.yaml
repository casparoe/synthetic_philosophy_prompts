          2.  Real Tensions (6/11, 7/3/1, 8/3, 6/10).
          3.  Single Revision (11).
          4.  The Technicality (Proportionality is pragmatic, not ontic).

      *   *Wait, one more check on (7).* "The reply that the mental property simply borrows the causal relevance of its realiser... strikes me as relabelling." This rejects the Shoemakerian subset view. This forces the user to rely on (6) Proportionality. But Proportionality is often criticized for making causation explanatory. If (11) says causation is *not* explanatory/interest-relative, (6) cannot do the work required to save (5) and (7). This confirms the 6/11 clash is the pivot point.

