      *   *Refining the "Knockout Case":* Octopus vs. Human pain? Different neural architecture, same behavioral/functional profile. Does neuroscience treat them as the *same kind* for explanation? Often no. They are analogues, not homologues. This is a weak spot for the user's view.

  6.  **Developing the Defeater Ranking:**
      *   *Fatal:* The "Normative Gap." Neuroscience tells us how *Earth* brains work. It cannot dictate the truth conditions for *possible* minds (aliens/AI). If the view reduces to "Earth-neuroscience determines mental kinds," it fails as a general philosophy of mind.
