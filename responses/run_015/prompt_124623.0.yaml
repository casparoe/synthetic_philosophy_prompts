      *   **Goal:** Map the view's exposure (vulnerabilities/defeaters).
      *   **Specific Tasks:**
          1.  Rank defeaters (fatal to awkward).
          2.  Distinguish critic vs. defender concessions.
          3.  Address specific questions:
              *   Is "tolerance-indexing" just "grain-relativity" in disguise? What does it predict?
              *   Problem cases: Silicon/Aliens, Liberalism/Chauvinism, Disjunction, Exclusion.
              *   Impact if MR is oversold (neural taxonomies are fine-grained).
              *   Unfalsifiability worry (if $\tau$ follows neuroscience).
              *   The "Knockout Case": Same mental kind, genuinely different realizers at the *same* causally relevant grain.
          4.  No citation padding.
          5.  Provide confidence levels and identify the most retractable claim.

  2.  **Deconstruct the View:**
      *   It's a qualified functionalism.
      *   It rejects MR as a modal trump card against identity theory.
      *   It shifts the burden from "Is it possible?" to "What is the relevant similarity metric?"
