      *   *Awkward:* The "Identity Collapse." If $\tau$ turns out to be very small, functionalism just becomes identity theory. (User might accept this, but it changes the landscape).
      *   *Merely Verbal:* The "Grain Relativity" charge.

  7.  **Finalizing the Confidence/Retraction:**
      *   I need to be honest about the limits of my analysis. The "Normative Gap" seems the strongest philosophical objection. The "Knockout Case" is the strongest empirical test.
      *   Most retractable: The claim that neuroscience *can* set $\tau$ for non-earthly minds.

  8.  **Review against Constraints:**
