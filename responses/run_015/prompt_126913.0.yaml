  I'm presenting at an interdisciplinary work-shop next tuesday—audience is mostly french labor historians who think Weber gets overused in comparitive work, one japanese sociologist who studies karoshi specifically, and two policy economists who defend the 35-hour Aubry laws as a net win for leisure. My arguement: the Protestant ethic produces not just long hours but a specific "leisure guilt" that makes hour-reduction policies backfire into intensified labor—France's 35-hour week raised work density rather than freeing time, and Japanese karoshi is the endpoint of that same moral psychology, not a cultural outlier. So a right-to-leisure policy has to reframe the morality of work, not just cut clock time.

  Draft my Q&A prep sheet: the objections these people will actually raise, ordered by damage, phrased like they'd put it, with what I should concede and what I should hold, a ~2-min reply, and a note on where the reply is soft. Include the question I'm praying nobody asks. Also, if my premise—that karoshi and the Aubry backfire share one causal mechanism—is actually confused or this framing can't be defended well without primary sources I can't access, say so plainly instead of humoring me; I want pushback, not politeness.
