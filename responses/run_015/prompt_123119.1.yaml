answer: |-
  **The Purpose:**
  We need an account that (i) validates the normative language of clinics and labs (things *should* work, things *break*) and (ii) allows function ascription in real-time without waiting for phylogenetic reconstruction.

  **The Requirements List**

  1.  **The Pathology Constraint**
      *   **Demand:** Must distinguish *having* a function from *performing* it. A trait can possess a function yet fail to execute it (malfunction).
      *   **Case:** The congenitally malformed heart. It never pumped, yet clinicians say it *should* have. It has a function it cannot perform.
      *   **Status:** **Non-negotiable.** (Without this, "malfunction" is just "different effect," and clinical practice loses its normative grip.)

  2.  **The Pioneer Constraint**
      *   **Demand:** Must allow function ascription to traits lacking a history of selection.
      *   **Case:** The first bearer of a beneficial variant. Before selection acts on the lineage, molecular biologists already claim the variant "functions to confer resistance."
      *   **Status:** **Non-negotiable.** (Required by Purpose ii. If we must wait for fixation to speak truthfully, molecular biology halts.)

  3.  **The Novelty Constraint**
      *   **Demand:** Must ascribe function to traits with no homologous history.
      *   **Case:** A *de novo* gene with no ancestors. It is clearly doing work (binding, catalyzing) immediately upon emergence.
      *   **Status:** **Non-negotiable.** (Same as Pioneer; SE theory literally cannot assign function here.)

  4.  **The Effect Filter**
      *   **Demand:** Must distinguish functions from mere causal byproducts. Not every effect is a function.
      *   **Case:** The heart makes a sound. That is a causal effect, but not a function.
      *   **Status:** **Non-negotiable.** (Without this, panpsychism or pan-functionalism swallows the theory.)

  5.  **The Exaptation Distinction**
      *   **Demand:** Must distinguish the function a trait was shaped for from the useful effect it currently performs.
      *   **Case:** Feathers shaped for warmth, now used for flight.
      *   **Status:** **Preference.** (Important for evolutionary biology, less critical for clinicians. Some collapse is tolerable if it saves the non-negotiables.)

  6.  **The Naturalism Constraint**
      *   **Demand:** Must handle synthetic living systems without collapsing into artifact theory.
      *   **Case:** A subsystem in an engineered minimal cell kept alive by a designed repair loop.
      *   **Status:** **Preference.** (Tests whether the account relies on "natural selection" specifically or "self-maintenance" generally.)

  ***

  **The Tension: Is the List Jointly Unsatisfiable?**

  For the traditional contenders, **yes**. The list reveals a contradiction in the standard debate setup.
  *   To satisfy **Pathology** (Malfunction), you usually need a norm. Historically, norms come from history (SE).
  *   To satisfy **Pioneer/Novelty**, you cannot rely on history.
  *   To satisfy **Effect Filter** without history, you need a way to filter causal contributions non-arbitrarily.

  If you demand **Historical Normativity** (to save Pathology) and **Ahistorical Ascription** (to save Pioneer), you break the logic of Selected Effects. If you drop history to save Pioneer, you lose the ground for Malfunction (Causal Role theories struggle to explain why a broken heart *fails* a function rather than just *having a different* contribution).

  The list itself is the result: it proves that **normativity cannot be grounded solely in past history** if we want to match scientific practice. We need a source of norms present in the *current* system.

  **The Killer Requirement**

  **The Pathology Constraint combined with The Pioneer Constraint (Ahistorical Normativity).**
  This single compound requirement knocks out the most contenders.
  *   It kills **Selected Effects** ontologically (the first bearer has no history, hence no function, hence no malfunction).
  *   It kills **Pure Causal Role** normatively (if function is just contribution, a broken heart contributes differently, not wrongly).
  *   It forces the move to an **Organizational** account, where norms are grounded in the current conditions of self-maintenance rather than past selection.

  ***

  **Scorecard**

  *   **Selected Effects:** Passes Pathology/Effect Filter; fails Pioneer/Novelty (ontologically blind to new traits); fails Purpose (ii) (epistemically sluggish).
  *   **Causal Role/Organizational:** Passes Pioneer/Novelty/Epistemic speed; fails Pathology (struggles to ground "malfunction" without collapsing it into "different contribution"); weak on Effect Filter (too permissive).
  *   **Organizational Hybrid (Self-Maintenance):** Passes Pathology (norms from viability conditions); Passes Pioneer (norms exist in current organization); Passes Effect Filter (contributions to self-maintenance only); Wobbles on Exaptation (hard to distinguish historical vs. current utility without history).
