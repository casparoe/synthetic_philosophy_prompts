          *   Argument against "Bridge": It's still just math. The set-point is a constant, not a belief. The discrepancy signal is just another gradient. There's no "inner light" turned on. It solves the *functional* problem of suffering (motivation to change state) but not the *phenomenal* problem (what it feels like).
      *   *Synthesis:* The meta-critic moves us from reflexive pain to systemic distress, but it doesn't solve the hard problem of consciousness. It makes the agent *act* more like it's suffering, but doesn't prove it *is* suffering. It bridges the functional gap, not the ontological one.

