      *   **Core Question:** Is there a consistent philosophical theory of "idea ownership" that covers copyright (expression), patents (function/idea), and open source attribution? Or is the law just pragmatic and inconsistent?
      *   **Specific Observations:**
          *   Hackathon policy: Cite if from paper, don't if independent creation (Independent Creation Defense).
          *   Copyright vs. Patents: Copyright protects expression, patents protect function/idea regardless of derivation.
          *   Open Source: Attribution required for code (expression), not concepts (algorithms).
          *   Variable Names vs. Logic: Copying variable names feels like a bigger violation than copying logic (in some contexts).
          *   Underlying worry: Is "mental labor" only visible in form? What are the metaphysical commitments here?

  2.  **Deconstruct the Legal/Philosophical Landscape:**
      *   **Copyright:** Based on *Lockean Labor Theory* mixed with *Romantic Authorship*. It protects the *expression*, not the *idea*. Key concept: "Independent Creation" is a valid defense because copyright isn't a monopoly on truth, it's a reward for specific labor.
      *   **Patents:** Based on *Utilitarianism* (Social Contract). You get a monopoly in exchange for disclosing the invention to society. It *does* protect the idea/function regardless of independent creation (first-to-file).
      *   **Trade Secrets:** Based on *unfair competition* and confidentiality.
      *   **Open Source:** A social/contractual layer on top of copyright. Uses copyright law to enforce sharing (Copyleft) or attribution (Permissive).
      *   **The "Variable Name" issue:** This touches on *Scènes à faire* (standard elements) vs. unique creative choices. Copying variable names suggests direct copying of the *text* (copyright infringement) rather than just the *function* (which might be patentable or unprotectable).

  3.  **Address the "Consistency" Question:**
      *   *Direct Answer:* No, there is no single consistent philosophical theory. The law is a patchwork of different ethical frameworks (Natural Rights vs. Utilitarianism).
      *   *Why?* Because different IP regimes solve different problems. Copyright solves the "free rider" problem for art/media. Patents solve the "incentive to invent/disclose" problem for useful arts.

  4.  **Drafting the Response - Section by Section:**

      *   **Validation:** Acknowledge that this is *not* overthinking. It's a profound question that legal philosophers debate.
      *   **The Three Regimes (The "Inconsistency"):**
