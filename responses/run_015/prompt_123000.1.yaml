  Because the measure is illegitimate, the fact that $(0.5, 0.5, 0.5)$ is undominated under that measure is irrelevant. She will revert to standard legitimate measures (Brier/Log). Under those measures, $(0.5, 0.5, 0.5)$ is incoherent and dominated. Therefore, it is **Impermissible**.

