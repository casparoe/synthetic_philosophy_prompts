      *   After submitting Rule 1, pop-up: "You may submit an Alternative Rule that also fits the data. Cost: 10 points. If your Alternative Rule matches Ground Truth better than Primary, you get 2x points."
      *   *Prediction:* Nobody pays the 10 points. Why? Because they believe their Primary Rule *is* the truth.
      *   *Debrief:* This shows we treat our inductive bets as *knowledge*, not *wagers*.

  6.  **Addressing the "Real Engineering" Objection:**

