      *   **Context:** Fortnightly internal session ("Judgement Calls"), 16 people (backend/data engineers, PMs), no philosophy training, 90 mins, room + projector + laptops.
      *   **Topic:** The Problem of Induction / Goodman's New Riddle of Induction (specifically the "grue" aspect: underdetermination of rules by evidence, entrenchment of predicates).
      *   **Constraints:**
          *   No lecture at the front.
          *   No mention of "grue" or philosophical labels until debrief.
          *   Active participation (doing, not listening).
          *   Small stakes (points/leaderboard/trivial prize, no money).
          *   Must feel like engineering work (logs, rules, predictions).
