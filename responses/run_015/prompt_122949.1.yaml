      *   *Mechanism:*
          *   Team Alpha sees 5 examples. Simple rule works (`if x > 5`). They get bonus points for rules *without* date constants.
          *   Team Beta sees 5 examples. Simple rule works (`if x > 5`), BUT they get bonus points for rules *with* date constants (even if unnecessary).
