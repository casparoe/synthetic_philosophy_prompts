      *   *Self-Correction on "Just Pick":* If I say "Just Pick" too early, it deflates. I need to elicit the *principle* that seems to forbid picking first. The Principle of Sufficient Reason (PSR) for action. "I need a reason to do A rather than B." Once they articulate that, *then* I show how agency overrides it.
