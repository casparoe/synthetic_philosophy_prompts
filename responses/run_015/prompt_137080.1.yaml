          2.  "Ignorance" (Epistemic evasion). -> Defuse during setup: Stipulate perfect knowledge.
          3.  "Weakness of Will" (Moralizing). -> Defuse early: This isn't about courage, it's about reasons.
          4.  "Must eat one" (Confusing necessity of action with reason for *which*). -> Defuse when establishing the dilemma.
          5.  "Coin Flip" (Randomization). -> This is the big one. Handle after the "Just Pick" solution.
          6.  "Coin Lands/Reason Generated" (Post-hoc reason). -> Handle immediately after Coin Flip.
          7.  "Selector's Regress" (Reason to pick). -> Handle last, before closing.
      *   *Diagnosis Check:*
          *   "Weakness of will": Misdescription. It's not akrasia; it's indecision due to symmetry.
          *   "Ignorance": Misdescription. It's stipulated away.
          *   "Must eat one": Confusion between *reason to act* vs. *reason to act specifically*.
          *   "Coin settles it": This is actually a *solution* (randomization), not necessarily a misconception, but the *reasoning* about EV might be shallow.
          *   "Real donkey": Category error (Normative vs. Descriptive).

  6.  **The Selector's Regress:**

      *   *Argument:* To pick Left, I need a reason. "I decided to pick" isn't a reason unless I had a reason to decide.
      *   *Status:* It rests on a confusion between *reasons for action* and *causes of action*, or it assumes the PSR applies to the *act of willing* itself.
      *   *Defusing:* Students need to grasp **Volition/Agency** as a source of reasons, not just a tracker of pre-existing reasons. The "reason" is the intention itself.
      *   *Prerequisite:* They need to have accepted that action is possible without a *prior* determining reason (the "Just Pick" moment).

  7.  **Assessment & Scope:**

      *   *Closing Question:* Needs to test if they understand *why* the choice is rational, not just *that* it is.
      *   *History:* Buridan didn't actually use the ass example (it was Aristotle's commentators, often attributed to Buridan later). Keep it out. It's trivia.
      *   *Refuse to Explain:* The metaphysics of value (Parity details), the psychology of indecision.
      *   *Contested Claims:*
          *   Rationality requires complete preferences? (Live dispute).
          *   Ties broken at random? (Generally accepted as permitted, but is it *required*?).
          *   Parity exists? (Live dispute).
      *   *One-liners:* "Philosophers disagree on whether value is always comparable, but we agree rational agents don't starve."

  8.  **Drafting the Plan (Iterative refinement):**

      *   *Timing:* 50 mins is very short.
      *   *0-5:* Setup Case & Constraints.
