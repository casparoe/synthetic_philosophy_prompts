      *   *Wait, check dependencies:* The Regress needs to come after they accept "Just Pick." The Coin objection challenges "Just Pick." Parity challenges the "Tie" assumption.
      *   *Refinement:* Put Parity *before* the Regress? No, Parity complicates the value structure. Regress complicates the agency structure. Keep Value (Tie/Parity) together, keep Agency (Pick/Coin/Regress) together.
