      *   **Task:** Plan a 50-minute introductory philosophy section on Action and Choice, focusing on Buridan's Ass.
      *   **Audience:** First-year students. Know reason vs. cause, can do expected value. Don't know incomplete preferences or parity (neither better, worse, nor equal).
      *   **Constraint 1 (Structure):** Focus on dependency structure (what must come before what). Avoid deflating the puzzle too early, but don't withhold the solution so long they feel misled.
      *   **Constraint 2 (Case Study):** Use *one* case throughout. Must meet specific constraints (indivisible/exclusive, genuine reason to act, no uncertainty/ignorance, morally weightless). Evaluate these constraints.
      *   **Constraint 3 (The Two Puzzles):** Distinguish between exact ties (equality) and parity (incomparability/neither better/worse/equal). Decide which to focus on or how to sequence them. Explain the loss if only ties are covered.
      *   **Constraint 4 (Misconceptions):** Address specific misconceptions in order of appearance (weakness of will, ignorance, "must eat one" reason, coin flip/randomization, "real donkey would twitch"). Specifically handle the "coin lands, now I have a reason" follow-up. Evaluate if any diagnoses are misdescribed.
      *   **Constraint 5 (Selector's Regress):** Address the "reason to pick" regress argument. Is it sound? If confused, what prior concept defuses it?
      *   **Constraint 6 (Assessment & Scope):** One closing question to distinguish understanding from vocabulary. What to refuse to explain? Where to put history (Buridan)?
      *   **Constraint 7 (Contested Claims):** Mark settled vs. live disputes (complete preferences, randomization, parity). Provide one-liners for live disputes.
      *   **Format:** Do *not* write the explanation/script. Plan the structure/dependencies.

  2.  **Deconstruct the Dependencies (The "Skeleton"):**

      *   *Goal:* Students need to feel the tension of rational choice without a determining reason, then see how action is possible without one.
      *   *Risk:* If I say "just pick" too soon, it's trivial. If I say it too late, it's frustrating.
      *   *Sequence:*
          1.  Setup the case (meet constraints).
          2.  Establish the symmetry (no reason to prefer).
          3.  Establish the necessity (must pick one).
          4.  Elicit the intuition of paralysis (The Puzzle).
          5.  Introduce the "Just Pick" solution (The Dissolution).
          6.  Test the solution against objections (Coin, Regress, etc.).
          7.  Deepen the puzzle (Tie vs. Parity).
          8.  Close with assessment.
      *   *Critical Dependency:* The "Just Pick" solution only makes sense *after* the students feel the force of the Principle of Sufficient Reason (PSR) applied to choice. They need to believe, momentarily, that rational action *requires* a prior determining reason. If they don't buy that, the puzzle doesn't exist.
      *   *Critical Dependency:* The "Parity" case (harder) depends on understanding the "Tie" case (easier). You can't explain "neither better nor worse nor equal" without first establishing "equal."

  3.  **Evaluate the Case Constraints:**

      *   *Indivisible/Exclusive:* Prevents "eat half of each" or "eat both." Forces a binary choice. *Verdict: Essential.*
      *   *Genuine Reason to Act:* Prevents "why not starve?" *Verdict: Essential.*
      *   *No Ignorance:* Prevents "look closer." Ensures it's a structural rational problem, not epistemic. *Verdict: Essential.*
      *   *Morally Weightless:* Prevents "save the baby vs. save the dog." Keeps focus on rationality, not morality. *Verdict: Essential.*
      *   *Proposed Case:* Two identical bales of hay is the classic. Let's modernize slightly for engagement but keep the logic. Two identical job offers? Two identical routes home? Let's stick close to the classic but ensure the "identical" claim is stipulated, not empirical. Let's use **Two Identical Vending Machines**. Same snack, same price, same distance, same queue length.
      *   *Critique of Constraints:* They are all correct. They isolate the *rational* dilemma from practical workarounds.

  4.  **The Two Puzzles (Tie vs. Parity):**

      *   *Tie:* Value(A) = Value(B).
      *   *Parity:* Value(A) || Value(B) (On a par).
      *   *Decision:* 50 minutes is tight. Focus primarily on the **Tie**. It's the historical core and conceptually simpler. Introduce Parity only at the end as a "horizon" problem.
      *   *Loss if only Tie:* Students miss the deeper metaphysical challenge to value theory (that value isn't always quantitative). They might think rationality is just maximizing a number.
      *   *Placement:* Spend 35 mins on Tie, 10 mins on Parity distinction, 5 mins close.

  5.  **Misconceptions & Sequencing:**

