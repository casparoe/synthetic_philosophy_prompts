answer: |-
  The paired practices of dementia care described—biographical engagement and legal enforcement of advance directives—jointly presuppose a **Narrative Conception of Personal Identity**, but they apply this conception in normatively divergent ways that often work at cross-purposes.

  While the care practice treats the narrative as a therapeutic medium to sustain the *present* self, the legal practice treats the narrative as a binding contract established by the *past* self. Both rely on the ontological claim that the resident and the pre-dementia individual are numerically identical (the same person), but they disagree on which temporal stage of that narrative holds moral authority.

  ### 1. The Implicit Account: Narrative Identity as Constitutive

  The practices do not merely employ narrative coherence as a neutral heuristic; they strictly presuppose that personhood is constituted by a sufficiently coherent unfolding story.

  **The Ontological Presupposition:**
  Both practices require the view that a person persists over time not merely as a biological organism, but as a "character" in a continuing biography.
  *   **Care Practice:** By reweaving confused remarks into familiar plotlines and treating disruption as a "gap to be bridged," staff operate on the assumption that the resident *is* the protagonist of the history assembled. If the resident were a different person (a new consciousness inhabiting an old body), engaging them with photographs of a stranger would be a category error, akin to showing a stranger someone else's baby photos. The practice presupposes that identity is maintained through the continuity of the story, even when the cognitive capacity to narrate it is impaired.
  *   **Legal Practice:** Advance directives bind the current resident to the past signatory. This presupposes that the "earlier competent person" and the "present resident" are the same moral entity. If they were not, enforcing the directive would be a violation of the current resident's autonomy (or the imposition of one person's will upon another).

  **The Nature of the Self:**
  This aligns with the **Narrative Self View** (associated with philosophers like Marya Schechtman and Alasdair MacIntyre). On this view, the self is not a separately existing inner entity (a Cartesian ego) nor a mere bundle of momentary experiences. Instead, the self is an abstract center around which biography coheres. To be a person is to live a "person-life," integrating experiences into a unified whole. The care home attempts to externally sustain this integration when the resident can no longer do it internally.

  ### 2. Presupposition vs. Compatibility and Rival Accounts

  It is crucial to distinguish what these practices *require* versus what they are merely *compatible* with.

  **Strict Presuppositions:**
  1.  **Numerical Identity:** There must be one person persisting from the time of the directive/admission to the current moment.
  2.  **Psychological/Narrative Connection:** Identity is not solely biological. If it were solely biological, the "life history" work would be irrelevant to the *person* (though useful for calming the *organism*), and the advance directive would be a instruction about a body, not a person's autonomy.

  **Rival Accounts Ruled Out:**
  If taken literally, these practices rule out two major rival conceptions of persistence:

  *   **Moment-to-Moment Experiential View (Bundle Theory):** This view holds that there is no persisting self, only a succession of conscious states.
      *   *Why ruled out:* If this were true, the advance directive would be void (the "author" no longer exists). Furthermore, care staff would be engaging in a fiction by treating the resident as the protagonist of a past they did not experience.
  *   **Strict Bodily Continuity (Biological View):** This view holds that a person is identical to their living human organism.
      *   *Why ruled out:* While compatible with the legal directive (same body), it is incompatible with the *method* of the care practice. If the person were just the body, "reweaving remarks into plotlines" would be unnecessary manipulation. One would simply manage the organism's comfort. The insistence on *biographical* coherence implies that personhood exceeds biology.

  **Compatibility:**
  The practices are compatible with **Psychological Continuity Theory** (Locke/Parfit), but with a modification. Standard psychological continuity requires memory and cognitive connection. Advanced dementia severs this. Therefore, the practices presuppose a **modified Narrative View** where the *community* (staff/family) can hold the narrative continuity on behalf of the resident when the resident can no longer hold it themselves.

  ### 3. Cross-Purposes: Critical vs. Experiential Interests

  While the Care and Legal practices share an ontological foundation (the Narrative Self), they work at cross-purposes regarding the *normative weight* of that self's temporal parts. This reflects the philosophical conflict between Ronald Dworkin's "Critical Interests" and Rebecca Dresser's "Experiential Interests."

  *   **The Legal Practice (Past-Oriented):** This presupposes that the "Earlier Self" is the authoritative author of the life story. It prioritizes **Critical Interests**—values and commitments that give a life integrity over time (e.g., "I never want to be kept alive in a vegetative state"). It assumes the narrative arc must be completed as originally drafted, even if the current protagonist suffers.
  *   **The Care Practice (Present-Oriented):** This presupposes that the "Current Self" is the valid locus of experience. It prioritizes **Experiential Interests**—immediate well-being, comfort, and emotional coherence. By "rewriting" confusion into familiar plotlines, staff often prioritize the *current* emotional reality over historical accuracy.

  **The Conflict:**
  The tension arises when the Legal Practice demands an action (e.g., withholding treatment or enforcing a restriction) that causes distress to the Current Self, who no longer identifies with the directive's author.
  *   The Legal Practice says: "You are the same person who wrote this; you must obey."
  *   The Care Practice says: "You are the same person in these photos; let us make you feel safe and happy."
  *   **Result:** The system asserts a single ontological self but fractures the ethical agency of that self. It treats the resident as the *same person* for the sake of liability and resource allocation (Legal), but as a *vulnerable child* for the sake of daily interaction (Care).

  ### 4. Counterfactuals: Changing the Presupposed View

  If the underlying conception of the self were replaced by the rival accounts identified above, both practices would require radical transformation.

  **Scenario A: Adoption of the Moment-to-Moment Experiential View**
  *   *Conception:* The resident is a new person every day; the past self is dead.
  *   *Change in Care:** "Life history" work would cease. Showing photos of a "dead" stranger would be considered confusing or abusive. Care would focus entirely on validating current emotions without reference to past identity (e.g., "You are sad now," not "You are sad because you miss your husband").
  *   *Change in Law:** Advance directives would become non-binding "letters of advice." Guardians would be required to maximize the *current* resident's happiness. If the resident is content eating sweets despite a prior directive against it due to diabetes, the sweets would be provided. Autonomy would shift entirely to the present moment.

  **Scenario B: Adoption of Strict Bodily Continuity**
  *   *Conception:* The resident is a human organism; "personhood" is a secondary social label.
  *   *Change in Care:** Biographical work would be reclassified as "behavioral management." Staff would not speak of "bridging gaps in the self" but rather "reducing agitation triggers." The moral goal shifts from preserving *identity* to preserving *physiological homeostasis*.
  *   *Change in Law:** Advance directives would be interpreted through the lens of "best interests of the organism" rather than "autonomy of the person." A directive refusing food might be overridden if the body shows signs of hunger, because the "organism's will to live" trumps the "past person's abstract values."

  ### Conclusion

  The current arrangement in residential care presupposes a **Narrative Conception of the Self** that is robust enough to sustain legal identity across cognitive rupture but flexible enough to allow therapeutic rewriting of daily interactions. However, this system is inherently unstable. It relies on a single ontological claim (persistence of the person) to support two contradictory ethical mandates: the Legal Practice demands fidelity to the *past narrative*, while the Care Practice demands coherence for the *present experience*.

  To resolve this, one must either abandon the binding nature of advance directives when psychological continuity breaks (favoring the Care view) or accept that the "person" is sometimes legally bound to act against their own current well-being to satisfy the integrity of their life story (favoring the Legal view). As it stands, the system attempts to have it both ways, treating the dementia patient as the same person when it is convenient for authority, and as a fragmented psyche when it is convenient for care.
