      *   *Focus:* Ensure I answer the specific question: "Do they require the view that a person is constituted by a sufficiently coherent unfolding story... or do they merely employ narrative coherence as a practical heuristic?"
      *   *Answer:* They *require* the ontological view for the legal part to make moral sense (otherwise it's oppression), but the care part treats it as a therapeutic tool. The tension arises because the legal part treats the narrative as *fixed* (the directive), while the care part treats it as *fluid* (rewriting gaps).

  7.  **Final Review against Prompt:**

      *   Conception of self/persistence? Yes (Narrative Identity).
      *   Constituted by story vs. heuristic? Argue it's treated as constitutive for legal, therapeutic for care.
      *   Reconstruct implicit account? Yes.
