answer: |-
  **Headline Number:** 0.58
  *(Probability that Debate adds no value over a single model answer)*

  ### Decomposition

  I model the probability that Debate *adds value* ($P_{\text{value}}$) as the product of two necessary gates (theoretical asymmetry and model realization) multiplied by the average efficacy of the human-judge interface factors. The headline figure is $1 - P_{\text{value}}$.

  **(a) Probability asymmetry holds in principle: 0.80**
  *Justification:* While truth often has lower Kolmogorov complexity, "easier to defend to a weak judge" is a stricter condition that fails on highly technical or abstract counterfactuals.

  **(b) Probability debaters realize the asymmetry: 0.75**
  *Justification:* Overlapping training and objectives create common blind spots and collusion risks, though inference stochasticity and competitive pressure preserve some divergence.

  **(c) Probability cross-examination informs (no regress): 0.65**
  *Justification:* AI debaters are optimized for persuasion, often successfully drowning the judge in plausible but irrelevant technical disputes about sub-claims.

  **(d) Probability questions have determinate answers: 0.75**
  *Justification:* Many oversight questions (e.g., "off-target risk") are probabilistic judgments where the "true" answer is a distribution, not a binary fact debate can resolve.

  **(e) Probability hedging is not penalized: 0.65**
  *Justification:* Human judges systematically prefer crisp confidence over qualified accuracy, penalizing the honest debater who acknowledges uncertainty.

  **(f) Probability surprise is not penalized: 0.70**
  *Justification:* In complex systems, the true mechanism is often counter-intuitive, causing the judge to view the honest argument as less plausible than the deceptive one.

  **(g) Probability errors are not perfectly correlated: 0.75**
  *Justification:* Near-frontier models from the same family share architectural failure modes, but dropout and sampling variance prevent total error correlation during adversarial play.

  ### Combination Logic

  $$P_{\text{value}} = P(a) \times P(b) \times \frac{P(c) + P(d) + P(e) + P(f) + P(g)}{5}$$

  $$P_{\text{value}} = 0.80 \times 0.75 \times 0.70 = 0.42$$

  $$\text{Headline} = 1 - 0.42 = 0.58$$

  I treat (a) and (b) as multiplicative gates because if the asymmetry does not exist or the models cannot find it, the mechanism collapses to zero value regardless of judge quality. The remaining five terms (c–g) are treated as an average efficacy factor because they represent independent drags on the judge's performance; a failure in one (e.g., hedging penalty) can be partially offset by success in another (e.g., determinate answers).

  ### Sensitivity and Confidence

  **Most Sensitive Term:** (b) **Probability debaters realize the asymmetry.**
  A 10% shift here (e.g., from 0.75 to 0.65 due to stronger collusion) moves the headline from 0.58 to 0.65. This term captures the core risk of the "overlapping model family" constraint; if the models are too similar, debate becomes theater.

  **Least Confident Term:** (g) **Probability errors are not perfectly correlated.**
  We lack empirical data on error correlation coefficients for near-frontier models in adversarial settings. It is plausible that shared training data creates much higher correlation (lowering this probability) or that competitive fine-tuning creates much lower correlation (raising it).

  **Key Experiment:**
  Train two models on 90% overlapping data with identical reward functions, then pit them against each other on a benchmark of known falsehoods. Measure the rate at which the *loser* successfully exposes the *winner's* lie compared to a baseline where a single model is asked to critique its own output. This isolates variable (b) and (g) directly.

