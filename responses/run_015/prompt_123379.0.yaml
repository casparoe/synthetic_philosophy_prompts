answer: |-
  This is a fantastic pedagogical pivot. You are effectively moving the seminar from *abstract metaphysics* to *institutional ontology*. By asking what kind of world a bureaucracy must assume exists in order to process a claim, you force students to see metaethical commitments as functional prerequisites rather than just theoretical preferences.

  Your intuition about **axiological locality** is the keystone here. The reparations framework isn't necessarily arguing for moral anti-realism (that morality isn't real); it is arguing for **administrative physicalism**.

  Here is a reconstruction of the implicit theory, an analysis of the realism/anti-realism question, and a breakdown of what happens if you drop the locality constraint.

  ### 1. Reconstructing the Implicit Theory: "Administrative Materialism"

  The reparations body operates under a tacit theory of value that we might call **Administrative Materialism**. It relies on three core axioms:

  1.  **The Trace Principle:** A harm is only publicly adjudicable if it leaves a physical or economic trace that can be counterfactually modeled (i.e., we can calculate what you would have had if the harm hadn't occurred).
  2.  **The Interiority Clause:** Harms that do not leave physical traces (dignity violations, moral erasure, ritual degradation) are categorized as internal states (psychological/emotional).
  3.  **The Remedy Mismatch:** Material traces require *compensation* (transfer of external goods); internal states require *therapy* (modification of the subject's internal state).

  **Does this require Moral Realism?**
  Strictly speaking, **no**.
  *   **A Moral Anti-Realist** can easily support this split. They would argue: "Physical pain is inter-subjectively verifiable; moral injury is just a preference or emotional reaction. We compensate the former because we can agree on it; we counsel the latter because it's subjective."
  *   **A Moral Realist** can also support this split, but only a **Naturalist Realist** who believes moral properties supervene strictly on physical properties. If the moral harm doesn't have a physical substrate, this realist might say, "The state cannot measure the moral property, so we treat the psychological side-effects."

  **What the practice strictly requires:**
  The practice does not require a stance on whether moral properties *exist*. It requires a stance on **commensurability**. It assumes that for a harm to be *owed* (debt), it must be *quantifiable*. If it is not quantifiable, it is *pathological* (illness).

  Therefore, the funding split presupposes **Axiological Locality**: Value and disvalue must inhere in a discrete, measurable bearer (a body, a bank account, a plot of land). If the value is relational, status-based, or communal (non-local), the bureaucracy cannot process it as a debt.

  ### 2. The "Human Dignity" Contradiction

  You asked if this is consistent with charters invoking "Human Dignity." This is the point where the implicit theory fractures.

  *   **The Charter Claim:** "Human Dignity" is usually invoked as an objective, inherent status. It is often treated as a **non-local property**. It doesn't reside in your arm or your wallet; it resides in your standing as a moral agent within a community.
  *   **The Operational Claim:** By routing dignity violations to counseling, the state treats dignity as a **psychological feeling** (self-esteem) rather than a **moral status**.

  **The Metaethical Implication:**
  This creates a **performative contradiction**. The state speaks the language of *Status Realism* (dignity is an objective fact about you) but acts according to *Psychological Anti-Realism* (dignity is a feeling we can help you manage).
  *   **If dignity were real in the way the charter claims:** Violating it would create a debt that requires restitution (e.g., public apology, reinstatement of status, ceremonial repair).
  *   **By making it therapeutic:** The state implies the victim's *reaction* to the violation is the problem to be solved, not the *violation* itself.

  ### 3. Distinguishing Requirements from Fits

  To help your students disentangle this, you can draw this distinction:

  | Feature | **Strictly Required by the Practice** | **Merely Compatible (Fits Well)** |
  | :--- | :--- | :--- |
  | **Ontology** | **Methodological Physicalism:** The state must be able to measure the harm via physical/economic metrics. | **Moral Anti-Realism:** It fits well if you think morals are just feelings, but isn't required. |
  | **Value Theory** | **Axiological Locality:** Value must attach to a specific, individual bearer. | **Hedonism:** It fits well if you think pain/pleasure are the only goods, but utilitarianism could demand broader repair. |
  | **Agency** | **Individualism:** The victim is a discrete unit of accounting. | **Liberalism:** Fits liberal political theory, but isn't strictly required for the accounting to work. |
  | **Time** | **Backward-Looking:** Focus on restoring the *status quo ante*. | **Conservatism:** Fits a desire to return to how things were, but not required. |

  **The Crucial Insight for Students:**
  The bureaucracy isn't denying moral reality; it is denying **administrative legibility** to non-local moral facts. It is an epistemic limitation masquerading as an ontological one.

  ### 4. What Changes if We Drop Axiological Locality?

  This is the most productive thought experiment for your seminar. If we assume value is **relational** or **status-based** (non-local), the reparations rules must change fundamentally.

  **Current Model (Local):**
  *   **Harm:** Broken leg, lost cow.
  *   **Remedy:** Cash transfer equivalent to leg/cow.
  *   **Harm:** Humiliation, loss of status.
  *   **Remedy:** Counseling to help victim cope with feelings.

  **Non-Local Model (Relational/Status):**
  *   **Harm:** Degradation ritual (damages the victim's standing in the moral community).
  *   **Remedy:** **Restorative Status Repair.**
      *   *Budgetary Change:* Money is allocated for *public ceremonies*, *official apologies*, or *reinstatement of titles/rights*, not just therapy.
      *   *Recipient Change:* Compensation might go to the *community* that witnessed the degradation, not just the individual, because the moral fabric of the group was torn.
      *   *State Role:* The state admits it is not just paying a debt but **re-constituting a moral order**. It acknowledges that the "injury" exists in the space *between* people, not inside the victim's head.

  **Example:**
  If a survivor was forced to perform a degrading ritual, the "Local" model pays for a therapist to help them process the shame. The "Non-Local" model pays for a public ceremony where the state officially nullifies the ritual's meaning, thereby restoring the survivor's status in the public sphere. The harm was public/relational; the remedy must be public/relational.

  ### 5. Seminar Application: Breaking the Loop

  To get your students out of the "is morality real?" loop, try this exercise:

  1.  **The Claim Form:** Hand out a mock reparations claim form. Have columns for "Physical Injury," "Economic Loss," and "Moral/Dignity Harm."
  2.  **The Budget Constraint:** Tell them they have $1M. Physical/Economic claims are paid 1:1. Moral claims are paid via referral to a counseling NGO.
  3.  **The Metaethical Audit:** Ask them to write the "Instruction Manual" for the claims adjuster.
      *   *Question:* What must the adjuster believe about the nature of "shame" to classify it as counseling rather than compensation?
      *   *Question:* If the adjuster believes "Dignity" is an objective fact (Realism), can they consistently fill out this form?
      *   *Question:* If we change the form to allow "Status Restoration" as a budget line, what new metaphysical commitments have we made? (e.g., that social reality is as concrete as physical reality).

  ### Recommended Reading/Connections
  To ground this philosophically, you might point them toward:
  *   **Elizabeth Anderson:** On how valuation practices shape what we consider "real" value (*Value in Ethics and Economics*).
  *   **James C. Scott:** On "legibility" and how states simplify complex social realities to manage them (*Seeing Like a State*). This explains *why* locality is required (administrative ease) rather than *why* it is true.
  *   **Onora O'Neill:** On obligations and justice vs. therapy.
  *   **Transitional Justice Literature:** Specifically critiques of the "liberal peace" model that privileges legal/economic repair over social/moral repair.

  ### Summary for the Students
  The reparations split doesn't prove morality is subjective. It proves that **bureaucracies are physicalists.** They treat moral injury as "real" only when it casts a physical shadow. By identifying **Axiological Locality** as the hidden constraint, you show that the debate isn't about whether moral facts exist, but about whether our institutions are capable of recognizing non-local facts. Dropping locality transforms reparations from *compensation for damage* to *restoration of standing*.
