answer: |-
  1. **Exam Question (20 Marks, 90 Minutes)**
     Scanlon's contractualism assesses principles based on whether they can be reasonably rejected by individuals. Standard objections claim contractualism cannot aggregate small benefits to outweigh a large loss. Consider the following stipulation, called the **Life-Profile Clause**: *When assessing whether a principle is reasonably rejectable for a given person, we assess that person's complaint not situation by situation but across the whole profile of situations in which the principle applies to them over a lifetime.*
     
     Apply this clause to the following case: An island ferry authority chooses a safety standard under a principle applying to everyone. **Cheap Standard:** 200,000 residents each pay $3/year; 12 crew members face a 1/200 annual drowning risk. **Expensive Standard:** No cost; crew risk drops to 1/2000. Crews are picked by an annual lottery from the whole population, so over a working life a given person is usually a payer and occasionally a crew member.
     
     Answer the following: (1) What does the Life-Profile Clause do to the aggregation objection in this specific case? (2) Does this show the anti-aggregation result was an artefact of tallying complaints one situation at a time, or that the utilitarian-looking answer is produced by the lottery and reciprocity rather than the rejection procedure? (3) What does the Clause do for people who only ever show up on the losing side of the profile (e.g., a disabled resident unable to serve, or a short-term visitor)? If it abandons them, is contractualism back where it started?

  2. **Model Answer**
     The Life-Profile Clause transforms the unit of moral assessment from isolated incidents to an individual's lifetime exposure to a principle. In the Ferry Case, this means residents do not compare a single $3 cost against a crew member's single risk of death. Instead, each person compares their lifetime expected costs against their lifetime expected risks. Because the lottery ensures reciprocity, every participant faces both burdens and risks over time. Consequently, the complaint against the Cheap Standard changes: it is no longer many small losses versus one large loss, but rather a universal moderate risk versus a universal moderate cost. This intra-personal aggregation permits rejecting the Cheap Standard on grounds any single person could accept, effectively bypassing the standard anti-aggregation objection without summing across persons.

     However, this solution relies entirely on the symmetry provided by the lottery. The Clause fails to protect those excluded from the reciprocal profile, such as disabled residents unable to serve or short-term visitors. For these individuals, the principle still strictly imposes risks without corresponding benefits or risk-sharing. Their complaints remain singular and catastrophic against the aggregated small benefits of the majority. Thus, the Life-Profile Clause shows that contractualism avoids aggregation only when reciprocity neutralizes the conflict of interest across a lifetime. It does not solve the fundamental problem of inter-personal aggregation for non-participants. The utilitarian-looking result for crew/residents is produced by the lottery structure, not the rejection procedure itself. Ultimately, contractualism remains vulnerable where life-profiles diverge, confirming that the anti-aggregation intuition persists whenever genuine sacrifice is demanded of those who cannot share in the benefits. If contractualism abandons these excluded parties to the majority's benefit, it collapses into the very aggregative calculus it sought to avoid. Therefore, the Clause reveals that the anti-aggregation result is not an artefact of situational tallying, but a structural feature that re-emerges once reciprocity fails. The machinery holds only under idealized conditions of equal vulnerability, leaving the theory unable to protect the permanently vulnerable against the temporary sacrifices of the compliant majority.

  3. **A Answer Requirements**
     1. Identifies that the Clause shifts assessment from situational incidents to lifetime risk profiles. (4 marks)
     2. Explains that the lottery creates reciprocity, allowing intra-personal aggregation of costs and risks for participants. (4 marks)
     3. Argues that this reciprocity makes the Cheap Standard rejectable by any single participant without inter-personal summation. (4 marks)
     4. Demonstrates that excluded parties (visitors/disabled) lack this reciprocity and face the original aggregation problem. (4 marks)
     5. Concludes that the utilitarian outcome depends on the lottery structure, not the contractualist procedure itself. (4 marks)

  4. **B Answer Description**
     A B answer correctly applies the Clause to show participants can aggregate risks across their own lifetime to justify rejecting the Cheap Standard, but it misses the critical analysis of excluded parties who cannot enter the lottery, failing to see the limit of the solution.

  5. **Standard Failures and Deductions**
     1. Restating the standard aggregation objection without applying the Life-Profile Clause to the Ferry Case specifics (Costs 10 marks).
     2. Ignoring the excluded parties and claiming the problem is fully solved for everyone (Costs 5 marks).
     3. Confusing the lottery mechanism with the contractualist formula itself, attributing the solution to rejectability rather than reciprocity (Costs 5 marks).
