answer: |-
  **The Fork™ Support Center**

  Welcome to The Fork. Below are common queries regarding setup, protocol adherence, and expected value maximization.

  **1. What does The Fork do?**
  The Fork externalizes decision-making at identical junctions. It generates a binary output based on a pre-drive probability threshold ($p=1/3$). This ensures time-consistent planning optimalities are maintained during the action phase, regardless of driver state.

  **2. I don't remember if I already used The Fork. Does it?**
  The device retains internal state even if you do not. It registers the first exit encountered as Exit 1 and the second as Exit 2. You do not need to remember the count. The algorithm accounts for your amnesia; you only need to obey the output.

  **3. What happens if I flip twice?**
  Do not flip twice. The Fork locks after generating a command at a junction. If you bypass the lock and generate a second command at the same location, you invalidate the probability distribution. This increases the likelihood of exiting at Exit 1 (Payoff 0).

  **4. Can I see the result before I decide?**
  Two modes are available. "Blind Mode" vibrates only if you should exit. "Display Mode" shows the randomization result. We recommend Blind Mode. Knowing the specific outcome of the randomization event can alter your credence regarding your location, reducing overall expected utility.

  **5. Does The Fork adjust based on where I think I am?**
  No. Manual credence adjustment is discouraged. Your belief about being at Exit 1 vs. Exit 2 depends on your strategy. Changing strategy based on belief creates a feedback loop that collapses the expected payoff from 1.33 to 1.0. Trust the pre-commitment.

  **6. My passenger says I missed the turn. Can they override?**
  Not on the Base model. The "Co-Pilot Sync" add-on allows a passenger to verify exit counts. However, be advised: third-party memory introduces information hazards. If the passenger tells you which exit you are at, you may deviate from the optimal plan. Ignorance is statistically preferable.

  **7. I followed instructions exactly and ended up at the motel. Why?**
  You encountered the $(1-p)^2$ failure case. With $p=1/3$, there is a 44% chance you will miss both exits and receive the motel payoff (1). This is lower than the home payoff (4), but higher than the expected value of deviating (0). You followed the protocol correctly.

  **8. Do I need a subscription for this?**
  Basic randomization is free. "Fork+ Cloud" stores your drive history and exit data. We strongly advise against accessing this data post-drive. Reviewing past decisions provides information that may negatively impact your credence structure on future drives.

  **9. What if I remember the layout perfectly?**
  Perfect layout knowledge is assumed. The Fork addresses temporal disorientation, not spatial ignorance. If you can distinguish the exits visually, the device is unnecessary. If you cannot, do not attempt to distinguish them. Use the vibration.

  **10. How do I reset the device?**
  Hold the button for five seconds after reaching your destination. Do not reset mid-highway. Resetting clears the internal exit counter. If you reset between Exit 1 and Exit 2, the device will treat Exit 2 as Exit 1, forcing a suboptimal probability distribution.
