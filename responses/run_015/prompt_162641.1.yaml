answer: |-
  # Seminar Plan: The Hidden Rule Game
  **Topic:** Knowledge-How vs. Knowledge-That (Intellectualism vs. Anti-Intellectualism)
  **Time:** 75 Minutes
  **Students:** 18 (Split into two groups of 9: *Group Practice* and *Group Theory*)

  ## 1. The Core Mechanic: "The Triplet Test"
  Students classify number triplets $(A, B, C)$ as **Valid** or **Invalid**.
  **The Hidden Rule:** A triplet is Valid if:
  1.  $B$ is the arithmetic mean of $A$ and $C$ (e.g., $2, 4, 6$)
      **OR**
  2.  $A$ equals $C$ (e.g., $5, 9, 5$).

  *Why this rule?* It is disjunctive. It is easy to recognize perceptually with practice (the "shape" of the numbers), but cumbersome to state explicitly as a procedure. This creates friction between *doing* and *saying*.

  ## 2. Materials
  *   **Handout A (Group Practice):** 20 Example Triplets marked Valid/Invalid. No text explaining why. Space for scratch work (but writing rules is forbidden).
  *   **Handout B (Group Theory):** A written sheet stating the rule explicitly: *"Accept if Middle = (First + Last)/2 OR if First = Last."* No examples.
  *   **Test Packets:** 3 sets of 10 triplets each (Standard Transfer, Verbal Load, Motor Load).
  *   **Timer:** Visible to all.
  *   **Payoff Tokens:** 18 poker chips or distinct cards (Epistemic Credits).

  ## 3. Payoff Scheme (Non-Monetary)
  *   **Currency:** "Epistemic Credits" (EC).
  *   **Earning:**
      1.  **Accuracy:** 1 EC per correct classification on the Standard Transfer set (Max 10).
      2.  **Transmission Bonus:** Students write a "Teaching Manual" (max 3 sentences). You (the instructor) will act as the "Newcomer." If you score 10/10 on a fresh set using *only* their manual, they gain **20 EC** (doubled weight).
  *   **Reward:** The team (Practice vs. Theory) with the highest average EC wins **"The Architect's Privilege"**: They choose the specific reading or sub-topic for the first 15 minutes of the *next* seminar. (This leverages academic autonomy rather than cash).

  ## 4. Minute-by-Minute Timeline

  | Time | Activity | Details |
  | :--- | :--- | :--- |
  | **00-05** | **Setup & Split** | Divide class. Hand out A (Practice) or B (Theory). **Crucial:** Tell Group A: "Do not write down rules. Just look and learn." Tell Group B: "Memorize this rule. Do not look for examples." |
  | **05-20** | **Acquisition** | Group A studies examples. Group B memorizes rule. Instructor circulates to enforce "No Hypothesis Writing" in Group A. |
  | **20-30** | **Round 1: Standard Transfer** | Both groups classify 10 unseen triplets. Collect sheets. Score silently. |
  | **30-40** | **Round 2: Cognitive Load** | **Verbal Load:** Students classify 5 new triplets while reciting months backwards aloud. <br> **Motor Load:** Students classify 5 new triplets while tapping a 3-1-2 rhythm on desks. <br> *Record accuracy separately.* |
  | **40-50** | **Articulation & Teaching** | Students write their "Teaching Manual" (3 sentences max). Collect. Instructor calculates Transmission Bonus immediately (using a pre-keyed set). |
  | **50-55** | **Score Reveal** | Announce totals. Acknowledge the winner. Do *not* explain why yet. |
  | **55-75** | **The Debrief** | Guided discussion mapping game mechanics to philosophical positions (see below). |

  ## 5. Predictions by Condition

  1.  **Standard Transfer:**
      *   *Prediction:* **Group Practice (Implicit)** will likely match or slightly exceed **Group Theory (Explicit)**.
      *   *Reasoning:* The disjunctive rule is cognitively "expensive" to compute procedurally (check mean, check equality) but perceptually "cheap" once pattern-matched.
  2.  **Verbal Load (Months Backwards):**
      *   *Prediction:* **Group Theory** performance drops significantly. **Group Practice** remains stable.
      *   *Reasoning:* Applying an explicit rule requires inner speech/working memory. Pattern recognition is more modular and resistant to verbal interference.
  3.  **Motor Load (Tapping):**
      *   *Prediction:* Both groups dip slightly, but no major divergence.
      *   *Reasoning:* Motor tasks interfere less with propositional processing than verbal tasks, though they disrupt the "flow" of the Practice group.
  4.  **Transmission (The Manual):**
      *   *Prediction:* **Group Theory** writes accurate manuals. **Group Practice** writes vague manuals ("It just looks balanced").
      *   *Result:* Group Theory secures the Transmission Bonus; Group Practice loses it despite high accuracy.

  ## 6. The Debrief: Mapping Moments to Cruxes
  *Do not lecture. Ask these questions in order. Write student answers on the board.*

  **Phase 1: The Performance Gap (Anti-Intellectualism)**
  *   *Ask:* "Group Practice, you couldn't write the rule. Did you feel you *knew* what you were doing?"
  *   *Ask:* "Group Theory, you had the rule. Did it feel slower?"
  *   *Map:* If Practice performed better but couldn't speak, this mirrors **Ryle's Anti-Intellectualism**. Know-how is a capacity/disposition, not a ghostly internal proposition. Success in action does not require prior contemplation of a truth.

  **Phase 2: The Load Effect (The Regress Argument)**
  *   *Ask:* "Why did the Verbal Load hurt Group Theory more?"
  *   *Map:* This models the **Regress Objection**. If intelligent action required constantly consulting a proposition (the rule), then adding a verbal load should paralyze the agent. If Group Practice kept going, it suggests intelligent action can proceed without explicit propositional guidance.

  **Phase 3: The Transmission Failure (Intellectualist Defense)**
  *   *Ask:* "Group Practice won the chips, but Group Theory wrote the better manuals. Who really 'knew' the rule?"
  *   *Map:* This is the **Intellectualist Counter**. A defender of Intellectualism (e.g., Jason Stanley) argues: "If you can't state the truth conditions, you don't truly know. You just have a reliable habit."
  *   *Crux:* Is the Practice group's failure to articulate a failure to *know the proposition*, or merely a failure to *access the language* for the proposition they implicitly grasp?

  **Phase 4: The Teaching Multiplier (Testimony)**
  *   *Ask:* "The payoff relied on teaching a newcomer. Group Theory had the advantage here. Does this mean knowledge-how *is* transmissible by testimony?"
  *   *Map:* Intellectualism claims know-how is a species of know-that, so it *should* be transmissible by testimony. If Group Practice couldn't teach it, does that prove their knowledge was of a different *kind*? Or just that teaching is a separate skill?

  ## 7. Predictable Failure Modes & Mitigation

  1.  **Rule is Too Easy:**
      *   *Risk:* Group Practice guesses "It's arithmetic progression" immediately and ignores the $A=C$ clause.
      *   *Fix:* Include "Trap Items" in the acquisition phase (e.g., $5, 9, 5$) to force exposure to the second disjunct. If they guess the rule early, switch to a backup rule: *"Valid if $(A+B) > 10$ AND $(B+C)$ is even."*
  2.  **Cheating/Rule Writing:**
      *   *Risk:* Group A writes hypotheses despite禁令.
      *   *Fix:* Collect scratch paper at the end of Acquisition. Inspect it. Penalize EC if rules are found. Make the prohibition part of the "Epistemic Contract."
  3.  **Transfer Set Too Small:**
      *   *Risk:* Noise dominates signal (e.g., Group A gets lucky).
      *   *Fix:* Use 10 items minimum. If time allows, do 15. Ensure the ratio of Valid/Invalid is 50/50 to prevent guessing strategies.
  4.  **Effects Fail to Appear:**
      *   *Risk:* Group Theory does perfectly on everything.
      *   *Fix:* This actually supports Intellectualism! Pivot the debrief: "Why was the explicit rule so powerful? Does this show that all skill is ultimately reducible to rules?" Let the data drive the philosophy, even if it contradicts your expectation.

  ## 8. Limitations: What the Game Cannot Reproduce
  *Be frank about this in the final 5 minutes.*

  1.  **The Nature of the Task:** Classifying triplets is a *propositional attitude* (judging that $X$ is valid). True "Know-How" (riding a bike, speaking a language) involves *non-propositional action*. The game conflates "Knowing How to Classify" with "Knowing That a Classification is Correct."
      *   *Instructor Note:* You must supply the bridge: "In the game, 'success' was a correct mark on paper. In the real world, 'success' is not falling off the bike. The game models the *structure* of the debate, not the *phenomenology* of skill."
  2.  **The Intellectualist Absorption:** A sophisticated Intellectualist will argue that Group Practice *did* possess propositional knowledge, they were just unable to *express* it (the "Linguistic Mask" objection). The game cannot disprove this; it only makes it seem implausible.
      *   *Instructor Note:* You must supply the counter: "Stanley argues that the inability to speak doesn't prove the absence of a proposition. How would we test that? The game shows the *practical* cost of that view, not the logical falsity."
  3.  **The "Way" vs. The "Truth":** Anti-Intellectualism often defines know-how as a relation to a *way* of doing, not a *truth*. The game reduces "ways" to "patterns."
      *   *Instructor Note:* You must clarify that Rylean dispositions are richer than pattern recognition; they involve normative sensitivity to error, which the game only simulates via feedback.

  ## 9. Instructor's Cheat Sheet (The Hidden Rule Key)
  *Keep this hidden until the Debrief.*
  **Valid:**
  *   $2, 4, 6$ (Mean)
  *   $5, 10, 15$ (Mean)
  *   $3, 7, 3$ (Equals)
  *   $8, 2, 8$ (Equals)
  *   $10, 10, 10$ (Both)

  **Invalid:**
  *   $2, 5, 6$ (Neither)
  *   $3, 7, 4$ (Neither)
  *   $5, 6, 5$ (Equals? No, $5=5$ is Valid. **Wait, trap:** $5, 6, 5$ IS Valid. Use $5, 7, 5$ for Valid. Use $5, 8, 5$ for Valid. Use $5, 9, 4$ for Invalid.)
  *   *Correction for Invalid:* $4, 5, 9$ (Neither). $1, 5, 2$ (Neither).

  *(Ensure you have a pre-scored key for the 30 items used across the 3 rounds.)*
