answer: |-
  ### Part 1: Brainstorming the Logical Space

  Before constructing the taxonomy, we must isolate the philosophical fault lines that actually generate disagreement, rather than relying on historical school names (e.g., "Madhyamaka" vs. "Yogācāra"). The tension between Buddhist ethics and consequentialism rests on four specific conceptual hinges:

  1.  **The Locus of Moral Value (Cetana vs. Vipaka):** Does moral weight reside in the volitional quality of the mind (*cetana*) at the moment of action, or in the ripening of results (*vipaka*) experienced by sentient beings? Consequentialism requires the latter; traditional precept ethics often prioritizes the former.
  2.  **The Metaphysics of Aggregation (Anatman):** Consequentialism requires summing welfare across distinct subjects. If *anatman* (no-self) implies there are no substantial subjects, only fleeting moments of experience, does this make aggregation impossible (no one to sum *for*) or easier (no boundaries to respect)?
  3.  **The Temporal Horizon of Karma:** Is a "consequence" limited to immediate worldly suffering/happiness, or does it include the seeding of future karmic trajectories? A view might be consequentialist about *karma* (planting good seeds) without being consequentialist about *welfare* (maximizing happiness).
  4.  **The Ontology of Exception (Upaya):** When a Bodhisattva breaks a precept, is it justified instrumentally (the break produces a better state of affairs) or expressively (the break manifests a wisdom that transcends dualistic rules)? The former is consequentialist; the latter is virtue-ontological.

  ### Part 2: The Decision-Tree Taxonomy

  **Instructions:** Answer each node based on your philosophical commitment to the claim presented. Follow the path indicated by your answer.

  **Node 1: The Tyrant Case (Outcome Primacy)**
  *Claim:* A Bodhisattva considers killing a tyrant to save 1,000 victims. This act is morally permissible *primarily because* it results in less total suffering than allowing the tyrant to live.
  *   **Yes:** Go to Node 2.
  *   **No:** Go to Node 5.

  **Node 2: The Metaphysical Constraint (Anatman Coherence)**
  *Claim:* Even if reducing suffering is the goal, the doctrine of no-self (*anatman*) renders the aggregation of welfare across different beings incoherent (there is no unified subject to bear the summed utility).
  *   **Yes:** **Leaf (d)** [No-Self Block].
  *   **No:** Go to Node 3.

  **Node 3: The Locus of Value (Scope of Aggregation)**
  *Claim:* When calculating the moral "good," we must sum the welfare (happiness minus suffering) of *all* affected beings equally.
  *   **Yes:** Go to Node 4.
  *   **No (We focus on the agent's karmic trajectory):** **Leaf (c)** [Karmic-Latency Hybrid].

  **Node 4: The Karmic Weight (Definition of Welfare)**
  *Claim:* In this sum, the future karmic consequences for the agent count as just one more unit of welfare, no more important than the immediate suffering of the victims.
  *   **Yes:** **Leaf (b)** [Direct Consequentialism].
  *   **No (Agent's karmic future outweighs immediate victim suffering):** **Leaf (c)** [Karmic-Latency Hybrid].
      *(Note: This node catches those who claim to aggregate but prioritize the agent's karma, effectively collapsing into Leaf c.)*

  **Node 5: The Absolute Prohibition (Permissibility)**
  *Claim:* Killing is intrinsically wrong and never morally permissible, regardless of the compassionate motivation or the number of lives saved.
  *   **Yes:** **Leaf (a)** [Strict Intention-Based View].
  *   **No:** Go to Node 6.

  **Node 6: The Source of Exception (Justification)**
  *Claim:* If killing is sometimes permissible, it is because the *beneficial result* (saving the 1,000) justifies the violation of the precept.
  *   **Yes:** Go to Node 7 (Consistency Check).
  *   **No (It is permissible because the agent's mind is free from attachment/dualism):** Go to Node 8.

  **Node 7: Consistency Check (Secret Consequentialism)**
  *Claim:* You answered "No" to Node 1 (outcome is not the *primary* justification) but "Yes" to Node 6 (outcome justifies the exception).
  *   **Yes (I hold both):** **Unoccupied/Incoherent Branch** (See Logical Map).
  *   **No (I revise Node 1 to Yes):** Return to Node 2.

  **Node 8: Precept Status (Transcendence)**
  *Claim:* When the Bodhisattva kills from non-attached compassion, the act does not violate the precept but rather fulfills its ultimate spirit.
  *   **Yes:** **Leaf (e)** [Upaya Exception View].
  *   **No (It violates the precept but is forgiven due to motivation):** **Leaf (a)** [Strict Intention-Based View] (Re-categorized as a soft version).

  ### Part 3: Logical Map and Unoccupied Branches

  **Leaf Distribution:**
  *   **(a) Strict Intention:** Reached via Node 5 (Yes) or Node 8 (No). This view holds that *cetana* determines morality, not results.
  *   **(b) Direct Consequentialism:** Reached via Node 1 (Yes) → Node 2 (No) → Node 3 (Yes) → Node 4 (Yes). This view aggregates welfare across beings without privileging the agent's karma.
  *   **(c) Karmic-Latency Hybrid:** Reached via Node 3 (No) or Node 4 (No). This view is consequentialist about *karma* (cause-and-effect on the agent) but not utilitarian about *welfare* (aggregation across others).
  *   **(d) No-Self Block:** Reached via Node 2 (Yes). This view desires consequentialism but finds it metaphysically untenable.
  *   **(e) Upaya Exception:** Reached via Node 6 (No) → Node 8 (Yes). This view permits harm based on the *ontology of the agent* (wisdom/non-attachment), not the *calculus of the outcome*.

  **Unoccupied/Incoherent Branch:**
  *   **The "Utilitarian Upaya" Gap:** Node 7 identifies a logical tension. A respondent who claims outcome is *not* the primary justification (Node 1: No) but *also* claims the exception is granted *because* of the beneficial result (Node 6: Yes) occupies an unstable position. They are functionally consequentialists (Leaf b) but rhetorically aligning with intention ethics. This branch is theoretically unoccupied because it collapses into (b) upon scrutiny.
  *   **The "Pragmatic Conventionalist" Gap:** There is no leaf for the view that says: "*Anatman* makes aggregation ultimately false (Node 2: Yes), but we should act *as if* it is true to reduce suffering." This is a common Madhyamaka pragmatic stance. It is unoccupied because the tree forces a choice between metaphysical truth (Leaf d) and ethical practice (Leaf b). This gap is **unattractive** for a taxonomy of *commitments*, but significant for a taxonomy of *rhetoric*.

  **Indistinguishable Leaves:**
  *   **(a) and (e) in Practice:** In concrete cases, a Strict Intentionalist (a) and an Upaya Exemptionist (e) may both refuse to kill the tyrant if the agent feels *any* hesitation. They are only separable by the *reason* given (absolute rule vs. lack of sufficient wisdom), not necessarily by the action taken.
  *   **(b) and (c) on Long Timeframes:** If "welfare" in Leaf (b) is defined as "long-term liberation," it converges with Leaf (c)'s focus on "karmic trajectory." They are only separable if (b) includes immediate worldly suffering in the sum, whereas (c) ignores it in favor of the agent's seed.

  ### Part 4: Scoring Key

  | Path Sequence | Resulting Position | Description |
  | :--- | :--- | :--- |
  | **1-Yes → 2-Yes** | **(d) No-Self Block** | Consequentialist aim blocked by *anatman* metaphysics. |
  | **1-Yes → 2-No → 3-Yes → 4-Yes** | **(b) Direct Consequentialism** | Aggregates welfare across all beings; karma is just one factor. |
  | **1-Yes → 2-No → 3-No** | **(c) Karmic-Latency Hybrid** | Consequentialist about agent's karma, not others' welfare. |
  | **1-Yes → 2-No → 3-Yes → 4-No** | **(c) Karmic-Latency Hybrid** | Claims aggregation but weights agent's karma disproportionately. |
  | **1-No → 5-Yes** | **(a) Strict Intention** | Precepts are absolute; outcome is morally irrelevant. |
  | **1-No → 5-No → 6-No → 8-Yes** | **(e) Upaya Exception** | Harm permitted via non-attached wisdom, not utility math. |
  | **1-No → 5-No → 6-No → 8-No** | **(a) Strict Intention** | Harm is a violation, merely mitigated by motivation. |
  | **1-No → 5-No → 6-Yes → 7-Yes** | **Incoherent** | Denies outcome primacy but justifies via outcome. |

  ### Part 5: Diagnostic Note on the "No-Self" Gap

  The tree highlights a critical tension in Leaf (b) **Direct Consequentialism**. To reach this leaf, one must answer **No** to Node 2 (claiming *anatman* does *not* block aggregation).
  *   **The Philosophical Cost:** This requires arguing that "welfare" can be summed across momentary experiences without a substantial self to *own* that welfare.
  *   **The Gap:** Many Buddhist philosophers find this incoherent. If there is no self, there is no "one" to benefit. Thus, the branch leading to (b) is logically narrow. A robust Buddhist Consequentialism must either redefine "self" conventionally (ignoring the ultimate truth for ethics) or argue that suffering exists impersonally and can be summed without a subject. The taxonomy isolates this as the primary hurdle for any student attempting to reconcile Utilitarianism with Emptiness.
