  3.  **Develop the Implicit Theory:**

      *   *Core Concept:* **Epistemic Fairness in Blame.**
      *   The committee isn't necessarily saying morality *changes* (moral relativism). They are saying *blame* requires *knowledge* or *accessibility*.
      *   If a standard wasn't "available" (socially intelligible), the agent isn't culpable for violating it.
