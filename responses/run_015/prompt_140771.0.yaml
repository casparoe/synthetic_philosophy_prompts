answer: |-
  This is a remarkably precise description of a specific normative practice. You have isolated a set of habits that appear contradictory on the surface (rejecting presentism while using a dissent test that validates modern views) but cohere around a specific, unstated philosophical architecture.

  Here is the reconstruction of the implicit theory governing your committee, distinguished between what the practice strictly presupposes and what merely sits comfortably with it.

  ### 1. The Core Theory: Epistemic Internalism, Not Moral Relativism

  The historians' rhetoric ("do not be presentist," "understand the past on its own terms") sounds like **Moral Relativism** or **Time-Indexed Moral Truth** (i.e., "Slavery was permissible in 1880"). However, your committee's *practice* (the Dissent Test) contradicts this. If morality were truly time-indexed, the existence of a dissenting contemporary would be irrelevant; the date alone would settle the permissibility.

  By looking for dissent, your committee presupposes **Diachronic Moral Realism** combined with **Epistemic Internalism regarding Blame**.

  *   **Diachronic Moral Realism:** The moral truth (e.g., "slavery is wrong") is constant across time. It was wrong in 1880, and it is wrong now.
  *   **Epistemic Internalism:** An agent is only blameworthy for violating a moral norm if that norm was *epistemically accessible* to them within their social context.

  The "Dissent Test" is a heuristic for **Social Availability**. It does not test whether the act was wrong (Realism assumes it was); it tests whether the agent could reasonably have been expected to know it was wrong. If a contemporary objected, the moral truth was "in the air," and the agent's failure to perceive it is a culpable moral blindness. If no one objected, the moral truth was obscured by the epistemic horizon of the era, and the agent is excused from *blame*, even if the act remains *wrong*.

  **What this means for the disagreement:** If this reconstruction is correct, there is very little for the two sides to disagree about metaphysically. The historians *say* they are protecting the past from our standards, but your committee *practices* a protection of the past from unfair epistemic demands. The disagreement is likely verbal: historians use "presentism" to mean "ignoring context," while the committee hears "presentism" as "judging without access."

  ### 2. The Fact/Value Asymmetry

  You note that you freely judge past geology or medicine as false without accusation of presentism. This is the strongest evidence for the Realist/Internalist split.

  *   **Factual Claims:** Presuppose **External Realism**. The state of the rocks or the human body is independent of human consensus. A geologist in 1880 can be objectively wrong because the truth conditions exist outside the social sphere.
  *   **Moral Claims:** In your committee's practice, these function as **Social Norms**. Moral obligation is treated as binding only through social recognition.

  **The Implicit Theory:** *Cognitive error* is a failure of correspondence with reality (which is always available in principle). *Moral error* is a failure of correspondence with community norms (which are only available if the community articulates them).

  This explains why you can say his geology was "false" (a verdict on the proposition) but hesitate to say his slaveholding was "blameworthy" (a verdict on the agent). You are distinguishing between **propositional falsity** and **agent culpability**. You are willing to assert that past moral beliefs were *false* (Realism), but you withhold *blame* (Internalism). The historians' warning against presentism is actually a warning against conflating falsity with culpability.

  ### 3. Questions vs. Verdicts

  The taboo attaches to verdicts, not questions. This reveals the committee's actual function: **The Management of Honor, not the Discovery of Truth.**

  *   **Questions:** Inquiry is open-ended. Asking "How did women's labor contribute to this endowment?" adds complexity. It does not threaten the moral status of the name.
  *   **Verdicts:** Naming a building is a speech act of *honor*. To honor someone is to hold them up as a model.

  **The Implicit Theory:** **Exemplarism.** We name buildings after exemplars. One can be a complex historical figure (subject of inquiry) without being a moral exemplar (subject of verdict). The "anti-presentist" rule is a shield to protect the *honorific status* of the bequest from being invalidated by later moral shifts, unless the figure was demonstrably negligent by the lights of their own time.

  If you judged the past by our standards straight (dropping the Dissent Test), the committee would shift from managing *honor* to managing *purity*. The criterion would change from "Was this person a respected leader of their time?" to "Does this person meet our current ethical hiring criteria?" This would likely result in the removal of most historical names, as few historical figures survive strict modern scrutiny.

  ### 4. Consistency and the "Vocabulary" Problem

  You observed that the objections we accept tend to be phrased in "roughly our vocabulary." This is the weakest link in the committee's consistency.

  *   **Strict Presupposition:** The theory requires only that the *concept* was available, not the specific phrasing.
  *   **Actual Practice:** By privileging objections that sound like us, the committee is engaging in **Confirmation Bias**. We are not truly testing for *their* availability; we are testing for *our* ancestry. We are looking for "people like us" in the past to validate our judgment.

  **Is this consistent?** No. It contradicts the spirit of understanding the past on its own terms. It suggests the "Dissent Test" is not a genuine epistemic check, but a **Procedural Legitimation**. It allows the committee to make modern judgments while claiming historical neutrality. It creates a "safe harbor": if we find an abolitionist pamphlet, we can condemn the slaveholder without being "presentist," because we have a historical alibi.

  **Alternative Theories Licensing the Same Practice:**
  1.  **Pragmatism:** The rule isn't about truth or blame at all. It's about minimizing contemporary conflict. The Dissent Test is a bureaucratic tool to avoid lawsuits or alumni outrage. (This sits well with the practice but contradicts the historians' sincere philosophical warnings).
  2.  **Whig History:** The assumption that history is a march toward us. We only value dissent that looks like us because we assume *we* are the endpoint of moral development. (This fits your observation about vocabulary).

  ### 5. What Would Change If You Dropped the Presupposition?

  If the committee abandoned Epistemic Internalism and judged by current standards directly:

  1.  **The Collapse of Context:** You would no longer need to consult historians. Their expertise is in context; if context is irrelevant to blame, their role diminishes to fact-checking.
  2.  **The "March of Progress" Narrative:** You would implicitly endorse the view that morality improves linearly. This violates the historians' specific taboo against narrating the past as a march toward us.
  3.  **Expansion of Liability:** You would have to judge figures not just on what they did, but on what they *failed to imagine*. This creates an infinite regress of blame (e.g., "Why didn't they anticipate climate change?").
  4.  **Shift in Purpose:** The committee would become a tribunal of retroactive justice rather than a steward of institutional memory.

  ### 6. What Would Change My Mind (Falsification Conditions)

  I am reconstructing this based on the logic of your description. Here is what would lead me to abandon this reconstruction:

  1.  **If the Committee Rejects "False" Moral Claims:** If you find that the committee is unwilling to say "Slavery was wrong in 1880" and instead insists "Slavery was permissible in 1880," then my Realist/Internalist model is wrong. The theory would have to be **Genuine Moral Relativism**. The Dissent Test would then be not about access to truth, but about defining the local truth of that time.
  2.  **If Factual Errors are Excused:** If you find the committee hesitating to call past geology "false" because "that was their science," then the Fact/Value asymmetry I identified is false. The governing principle would be a blanket **Contextualism** covering all truth claims, not just moral ones.
  3.  **If Historians Object to the Dissent Test:** [**Guessing Flag:** I am inferring the historians' stance from your report.] If the professional historians you consult actually *reject* the Dissent Test as *too* presentist (arguing that even dissenters were products of their time and we shouldn't privilege their views either), then the "Epistemic Access" theory is wrong. The historians might hold a more radical **Hermeneutic** view where *no* external judgment is legitimate, only description.

  ### 7. Where I Am Guessing vs. Arguing

  *   **Arguing from Logic:** The distinction between Epistemic Internalism (blame requires access) and Moral Relativism (truth changes) follows logically from your description of the Dissent Test. If truth changed, dissent wouldn't matter.
  *   **Guessing about Historians:** [**Guessing Flag:**] I am assuming the historians warn against presentism out of philosophical commitment to contextualism. It is possible they warn against it for professional self-preservation (protecting the nuance of their narratives from political simplification). If their motive is protective rather than philosophical, the "implicit theory" of the committee is a misunderstanding of the historians' actual advice.
  *   **Guessing about Committee Intent:** [**Guessing Flag:**] I am assuming the committee members are trying to be philosophically consistent. It is highly probable they are simply trying to avoid scandal. The "theory" I have outlined may be a *rationalization* of a pragmatic decision, rather than the *cause* of it.

  ### Summary of the Implicit Theory

  Your committee operates on **Moral Realism** (the past was wrong by our lights) constrained by **Normative Internalism** (blame requires social access). The "Dissent Test" is a proxy for **Epistemic Availability**. The Fact/Value asymmetry exists because you treat facts as mind-independent but obligations as community-dependent. The restriction on Verdicts vs. Questions exists because you view naming as **Honorific Exemplarism**, not historical inquiry.

  The inconsistency lies in your selection of dissent: by choosing only the dissent that sounds like us, you are smuggling Realism back in through the back door, using the Internalist rule as a shield rather than a genuine constraint. You are not judging them by *their* standards; you are judging them by *ours*, but only where *they* accidentally agreed with *us*.

  If you gave this up, you would cease to be judges of *character* and become judges of *alignment*, and the history of the university would become a morality play rather than a record of human complexity.
