      *   *Fact/Value Asymmetry:* Factual errors are judged by correspondence to reality (which exists independently). Moral errors are judged by correspondence to norms (which require social uptake to be binding on an agent). *Correction:* Actually, the user notes we judge factual errors easily. This implies a Realist view of facts vs. a Constructivist or Internalist view of moral obligation.
