      *   *The Kicker:* Operators get a "Visceral Card" (e.g., "You are tired, -5 points if you think too long" or "You suspect betrayal"). This represents the non-transparent mental state.
      *   *Payoff:* Shared pool. If the pair succeeds, both eat. If they fail, no snacks. This forces cooperation but highlights the tension.

  7.  **Addressing the Specific "Self-Binding Wrinkle":**
      *   The prompt mentions: "Idealized version wants to lock actual self... actual self resists because mental states aren't transparent."
      *   *Adjustment:* The Architect tries to bind the Operator. The Operator has the *right to veto* the Constitution before starting, BUT if they veto, they lose the "Idealized Bonus."
