      *   Reveal the theories (Railton, Smith, Elster, etc.) at the very end.

  10. **Review against Constraints:**
      *   8 people? Yes (4 pairs).
      *   90 mins? Yes (timing breakdown needed).
      *   No lecture up front? Yes.
      *   Small stakes? Yes (Snack budget).
      *   Indirect norm first? Yes (Architects modify payoffs, not commands).
      *   Honest about limitations? Yes (in the conclusion).
