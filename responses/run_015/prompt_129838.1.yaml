  2.  **Deconstruct the Philosophical Concepts:**
      *   *Indirect Normativity:* You can't will yourself to believe $X$ directly. You must arrange conditions so $X$ becomes inevitable or rational. (e.g., Ulysses binding himself to the mast).
      *   *Idealized Deliberation:* What would I choose if I were fully rational/informed? (Smith's "ideal advisor," Railton's "idealized self").
      *   *Transparency/Access:* Do I know what I believe/want? Can the idealized self predict the actual self's reaction?
      *   *The Wrinkle:* The idealized self says "Bind yourself!" The actual self says "I don't trust that binding" or "I can't see why this is good yet."

  3.  **Brainstorming the Game Mechanic:**
      *   *Goal:* Need a decision where the "best" outcome requires trusting a process you don't fully understand yet, or accepting a constraint you didn't pick in the moment.
      *   *Roles:* "Architects" (Idealized) vs. "Agents" (Actual).
      *   *Hidden Info:* Architects know the "true" payoff matrix. Agents only see partial info or have to act under uncertainty.
      *   *The Twist:* Architects can set *rules* for Agents, but cannot force *actions*. Agents can choose to follow rules or rebel, but rebellion has hidden costs.
      *   *Stakes:* A shared snack budget (e.g., $20 for cookies/coffee) or points redeemable for snacks. Let's go with a "Resource Pool" (points) that converts to real snacks at the end.

  4.  **Developing "The Ulysses Contract" (Working Title):**
      *   *Setup:* 4 Pairs. In each pair, one is the *Planner* (Idealized), one is the *Doer* (Actual).
      *   *Phase 1 (Idealized):* Planners get full info. They design a "Protocol" (a set of constraints or incentives) for the Doer. They want to maximize total points.
      *   *Phase 2 (Actual):* Doers get the Protocol but *not* the full info. They face a series of choices. They can follow the Protocol or deviate.
      *   *The Conflict:* The Protocol might require the Doer to take a short-term loss for a long-term gain. But because the Doer lacks the "Idealized" info, it looks irrational to them.
      *   *The "Indirect" Mechanic:* Planners can't say "Choose Option A." They have to say "If you choose Option B, you lose 5 points." They are changing the *environment*, not the *mind*.
      *   *The "Transparency" Glitch:* Give Doers a secret "Stress Card" that changes their valuation in the moment, which Planners couldn't perfectly predict.

  5.  **Refining the Game for 90 Minutes:**
      *   10 min: Setup & Rules.
      *   20 min: Phase 1 (Planners design constraints).
      *   30 min: Phase 2 (Doers execute, with surprises).
      *   30 min: Debrief & Theory mapping.
      *   *Correction:* 8 people total. 4 Pairs is good.
      *   *Stakes:* 100 Points total pool. 1 Point = $0.25 of snack budget.
      *   *The "Indirect" Rule:* Planners cannot write instructions like "Pick Red." They must write "Red yields 10, Blue yields 0." They structure the *payoffs*, not the *choice*.
      *   *The "Wrinkle":* Mid-game, introduce a "Fog Event." Doers get private info that contradicts the Planner's logic.

  6.  **Drafting the Rules (Iterative Process):**
      *   *Name:* "The Black Box Protocol."
