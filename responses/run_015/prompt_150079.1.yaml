      *   **Claim 2: The Defensible Strong Version (Net Benefit).**
          *   *Idea:* The trait contributes to fitness *now*, even if it wasn't selected *for* originally.
          *   *Formulation:* "Persistence implies the trait is currently compatible with fitness, and may be co-opted (exaptation)."
          *   *Status:* Defensible but nuanced. Selection maintains it *against* decay, but not necessarily *for* its original form.
