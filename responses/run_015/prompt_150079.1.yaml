      *   *Surface meaning:* Persistence implies function/utility.
      *   *Underlying assumption:* Natural selection is the *only* or *primary* force maintaining traits.
      *   *Gould-Lewontin Counter:* Traits can persist due to drift, constraint, linkage, or as byproducts (spandrels).

  3.  **Drafting the "Menu of Claims":**

