answer: |-
  You are trying to build a single concept to do two different jobs. You want a metaphysical account of *causation* that simultaneously delivers a normative account of *responsibility*. Your list shows the seams tearing. Specifically, Case 2 (Strong Swimmer) and Case 9 (Nurse vs. Janitor) are doing heavy lifting for a moral intuition you are labeling as "causal."

  If you want a principle that accommodates your specific list (including the uncomfortable Case 2), you cannot use a standard counterfactual account, and you cannot use a standard duty-based account. You need a **Restricted Opportunity Account**.

  Here is the principle, stated as clauses, followed by the cost analysis, the climate case, the transitivity problem, and the diagnosis of where you are fooling yourself.

  ### The Principle: Restricted Opportunity Causation

  An agent $A$'s omission to $\phi$ causes outcome $O$ if and only if:

  1.  **Counterfactual Dependence:** Had $A$ $\phi$-ed, $O$ would not have occurred (or would have been significantly less likely/severe).
  2.  **Localized Capacity:** At the time $t$ immediately preceding $O$, $A$ possessed the specific physical and epistemic capacity to $\phi$.
  3.  **Exclusive Opportunity:** At time $t$, $A$ was among a limited set of agents spatially and temporally positioned to $\phi$, such that $A$'s action would have been *sufficient* to prevent $O$ without requiring coordinated action from others.
  4.  **Non-Deviance:** The chain of events leading from the omission to $O$ does not rely on highly abnormal intervening variables (this handles Case 5).

  ### Case Mapping & Costs

  *   **Case 1 (Lifeguard):** Fits all clauses. Duty is irrelevant to the *causation* clause, though relevant to liability.
  *   **Case 2 (Strong Swimmer):** Fits all clauses. This saves your intuition, but at a high cost (see "Fooling Yourself" below).
  *   **Case 3 (Ten Thousand):** Fails Clause 3 (Exclusive Opportunity). They were not positioned to act.
  *   **Case 4 (Famine):** Fails Clause 3. Your donation is not *sufficient* without the aggregate; also fails Clause 2 regarding *immediate* capacity to save *that* child at *that* moment (logistical chain is too long).
  *   **Case 5 (Security/Inevitable):** Fails Clause 1. No counterfactual dependence.
  *   **Case 6 (Security/Preventable):** Fits Clause 1.
  *   **Case 7 (Double Prevention):** Fits Clause 1 & 2. Treats act and omission symmetrically, which you wanted.
  *   **Case 8 (Late Lifeguard):** Fits Clause 1 regarding the *state* of "unrecoverability." You must individuate the outcome as "death at $t_2$" rather than "death simpliciter." If you do that, the clause holds.
  *   **Case 9 (Nurse vs. Janitor):** Fits Clause 2. The Nurse has the *specific epistemic/physical capacity* at time $t$. The Janitor does not. This distinguishes them without invoking duty.

  **The Cost:**
  To keep Case 2 and Case 9, you have made "causation" heavily dependent on *capacity* and *proximity*. This collapses the distinction between "cause" and "responsible agent." In standard metaphysics, the lack of oxygen caused the death just as much as the swimmer's inaction. By restricting causation to *agents with localized capacity*, you are building normativity into the metaphysics. This is defensible in a tort context (where causation is a gateway to liability), but it will not fly in a general metaphysics of causation.

  ### Where You Are Fooling Yourself

  **Case 2 is the weak link.**
  You say: *"My verdict: also caused it. This is the one I'm least comfortable with and I keep landing back on it anyway."*

  You are landing back on it because you are conflating **blameworthiness** with **causation**.
  In tort law, the swimmer is *not* a cause. In common morality, the swimmer is a *monster*. You are letting the moral outrage dictate the causal verdict. If you drop Case 2 (i.e., admit the swimmer did not *cause* the death, but was morally reprehensible for not preventing it), your theory simplifies massively. You can adopt your supervisor's "Normal/Expected Alternative" view.

  Why? Because Case 9 (Nurse vs. Janitor) can be saved by **Clause 2 (Localized Capacity)** without needing Case 2. The Nurse has a *skill-based capacity* the Janitor lacks. The Swimmer has a *physical capacity* identical to any other bystander. If you say the Swimmer causes the death, you must explain why the bystander with a phone to call 911 doesn't. If you say "because the swimmer could do it *personally*," you are making causation depend on the *method* of prevention, which is unstable.

  **Recommendation:** Drop Case 2. It is the anchor dragging your dissertation down. It forces you to argue that causation is sensitive to moral expectation without admitting it. If you concede the swimmer is not a *cause* (but is *responsible*), Case 9 becomes easier: The Nurse is a cause because her specific training makes her omission a deviation from the *functional norm* of the hospital environment, whereas the Janitor is not.

  ### The Climate Case (2060 Hurricane)

  **Verdict:** Under the Restricted Opportunity Account above: **No Causation.**

  **Analysis:**
  *   **Clause 1 (Dependence):** Technically yes (marginally).
  *   **Clause 3 (Exclusive Opportunity):** Fails spectacularly. You are not among a limited set. There is no "specific opportunity" for *you* to stop *that* hurricane. Your omission is one of billions.
  *   **Tort Lawyer Reaction:** She will not laugh if you argue **No Proximate Cause**. She will laugh if you argue **No Factual Cause**.
  *   **Defense:** You must distinguish *but-for causation* from *proximate causation*. In mass omission cases (climate, famine), individual omissions are *but-for causes* (in a strict counterfactual sense) but fail the *scope of risk* and *proximity* tests required for legal causation.
  *   **The Embarrassment:** If you keep Case 2 (Swimmer), you are committed to saying everyone causes the hurricane death. If you drop Case 2, you can say no single individual causes it, though the *collective* does. The latter is defensible in tort (market-share liability models); the former is litigation suicide.

  ### The Transitivity Problem (The Staircase)

  **Question:** If Supervisor's omission causes Lifeguard's failure, and Lifeguard's failure causes Death, does Supervisor cause Death?

  **Principle:** **Transitivity holds for metaphysical dependence, but is cut off by Normative Distance.**

  You cannot have transitivity all the way up without collapsing into Case 3 (everyone causes everything). You need a stopping rule.

  **The Cut-off Clause:**
  Transitivity of omission causation terminates when the link requires an **independent voluntary agent** whose responsibility is not coerced or determined by the prior omitters.

  *   **Supervisor -> Lifeguard -> Death:** Transitivity holds. The Lifeguard's failure is arguably *determined* or *strongly constrained* by the Supervisor's lack of oversight (depending on your view of free will, but in tort, this is within the scope of employment risk).
  *   **City -> Company -> Supervisor -> Lifeguard -> Death:** Transitivity fails. At some point, the chain passes through too many layers of discretionary agency.

  **Better Cut-off for Tort:** **Foreseeability of the Specific Harm.**
  The Supervisor's omission causes the death because the death was the *foreseeable risk* that made the supervision necessary. The City's licensing omission is too remote; the risk of *this specific drowning* was not the specific risk the licensing protocol was designed to prevent (it was designed for general competence).

  **Principle:** Omission $A$ causes Harm $C$ via Omission $B$ only if $B$'s failure was the **specific mechanism of risk** that $A$'s duty was intended to block.
  *   Supervisor's duty: Ensure lifeguard watches. (Mechanism: Inattention).
  *   City's duty: Ensure company is licensed. (Mechanism: Incompetence).
  *   If the lifeguard was competent but distracted, the City's omission is causally inert regarding *this* death.

  ### Summary Advice for the Chapter

  1.  **Concede the Supervisor is Half-Right:** Expectations matter, but frame them as **Functional Expectations** (what this agent is equipped/positioned to do) rather than just Moral Expectations. This saves Case 9 (Nurse) without needing Case 2 (Swimmer).
  2.  **Sacrifice Case 2:** It is the outlier. It forces you into a "Capacity = Cause" view that explodes on Case 3 and 4. Argue that the Swimmer is *morally responsible* but not a *cause*. This aligns better with tort law (no duty to rescue) while keeping your philosophical nuance on Case 9 (special capacity creates a causal role).
  3.  **Handle Transitivity via Scope of Risk:** Don't use a metaphysical cut-off. Use a normative one. Transitivity stops where the *reason for the duty* stops tracking the harm.
  4.  **Climate Case:** Distinguish *Contribution* from *Causation*. Individuals contribute to the risk condition, but do not cause the specific instantiation of harm. This is consistent with Case 3.

  **Final Truth:** You are struggling because you want "Causation" to be the thing that justifies blame. It isn't. Causation is the gateway; Responsibility is the house. You are trying to build the gateway out of the same materials as the living room. Separate them. Let causation be narrower (Restricted Opportunity), and let responsibility be broader (Moral Duty). That solves Case 2 immediately.
