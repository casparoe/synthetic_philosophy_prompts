prompt: |-
  Hey, I'm a software engineer with basically no philosophy background, but I got pulled into this quantum mechanics rabbit hole. There's this thing in the many-worlds interpretation called the Born rule problem — like, if every possible outcome actually happens in some branch, why do the probablities line up with the squared amplitudes? Some people say self-locating uncertainty fixes it, but then I saw this epistemic seperability objection that apparently breaks that fix. If Einstein were around today and heard this debate, do you think he'd reject the whole interpretation because it can't recover the right statistics, or would he try to patch it with some hidden-variable-style idea? I know he hated quantum randomness, but I'm not sure how that maps onto branching universes. Sorry if I'm butchering the terms — just genuinely curious.
