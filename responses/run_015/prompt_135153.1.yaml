answer: |-
  ### Decision Tree: Causality in Weber's *Protestant Ethic*

  **Root Node:**
  **"To explain the rise of capitalism, must you demonstrate that individuals changed their specific economic behavior because they subjectively believed their religion required it?"**
  *   **No:** (Subjective meanings are not the primary engine). → Go to **Branch A**.
  *   **Yes:** (Subjective meanings are essential). → Go to **Branch B**.

  ---

  #### Branch A (Subjective Meanings = No)

  **Node A1:**
  **"Are religious values merely a reflection (superstructure) of underlying economic conditions and class interests?"**
  *   **Yes:** → **Leaf 1: The Materialist/Epiphenomenal Rejection**
      *   *Description:* This is your friend's position. Culture is a byproduct of material reality; values are "in the head" but put there by the economy, so they cannot push the economy around.
  *   **No:** → **Leaf 2: Unnamed (Objective Idealism)**
      *   *Description:* **Awkward Position:** This claims values aren't caused by the economy, but also denies that individuals act on them subjectively. It implies values float independently of both matter and minds, which is sociologically incoherent.

  ---

  #### Branch B (Subjective Meanings = Yes)

  **Node B1:**
  **"Could religious ideas generate capitalist behavior even if the material technology and market structures were completely absent?"**
  *   **Yes:** (Culture can operate independently of material constraints). → Go to **Branch C**.
  *   **No:** (Material conditions are necessary constraints for culture to work). → Go to **Branch D**.

  ---

  #### Branch C (Culture Independent of Material)

  **Node C1:**
  **"Was the Protestant Ethic sufficient on its own to produce modern capitalism without other preconditions?"**
  *   **Yes:** → **Leaf 3: The Strong Monocausal Reading**
      *   *Description:* Often a caricature of Weber. It argues ideas alone drove history, ignoring Weber's admissions that material factors were also required.
  *   **No:** → **Leaf 4: Unnamed (Idealist Partial Cause)**
      *   *Description:* **Awkward Position:** This claims culture works without material conditions, yet isn't sufficient to finish the job. It is unclear what completes the cause if material conditions are absent by definition in this branch.

  ---

  #### Branch D (Material Conditions Necessary)

  **Node D1:**
  **"Was the Protestant Ethic a necessary condition without which capitalism could not have emerged?"**
  *   **No:** (It was just one compatible factor among many). → **Leaf 5: The Elective Affinity/Correlation Reading**
      *   *Description:* This argues religion and capitalism were "compatible" and selected each other (affinity), but neither strictly caused the other in a linear chain. It validates the "correlation" worry without dismissing culture entirely.
  *   **Yes:** (It was a necessary 'switchman' directing interests). → Go to **Node D2**.

  **Node D2:**
  **"Did the ethic operate by transforming value-rational religious devotion (working for God) into instrumentally-rational economic habit (working for profit)?"**
  *   **No:** → **Leaf 6: Unnamed (Necessary Switchman without Mechanism)**
      *   *Description:* **Awkward Position:** This claims the religion was necessary but ignores Weber's specific psychological argument about *how* religious anxiety turned into rational accounting. It treats the cause as a black box.
  *   **Yes:** → Go to **Node D3**.

  **Node D3:**
  **"Is the primary causal agent 'Culture' as a collective force, or only 'Individuals' acting on beliefs?"**
  *   **Culture:** → **Leaf 7: The Neo-Weberian Culturalist Reading**
      *   *Description:* Treats "Culture" or "The Ethic" as an emergent social force that constrains and directs history, beyond just the sum of individual actions.
  *   **Individuals:** → **Leaf 8: The Methodological Individualist Reading**
      *   *Description:* Argues that "Culture" is just shorthand. Only individuals cause things; the explanation holds only if we trace every step to individual psychology and action.

  ---

  ### Indistinguishability Flag
  **Leaf 7 (Neo-Weberian Culturalist)** and **Leaf 8 (Methodological Individualist)** are often difficult to separate in practice. While they disagree on ontology (whether "culture" exists as a thing), they usually agree on the historical narrative: individuals acted on beliefs, which aggregated to change the economy. Unless you are doing strict philosophy of social science, these two leaves often result in the same historical explanation.
