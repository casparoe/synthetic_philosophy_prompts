answer: |-
  This is a sophisticated methodological stance, one that attempts to carve a "via media" between the hard adaptationism of the Oxford school (Dawkins, Dennett) and the structuralism of the Gould-Lewontin critique. By bifurcating the default assumptions based on the domain of inquiry (morphology vs. physiology), you are essentially proposing a **domain-specific methodological adaptationism**.

  Your position is not immediately incoherent, but it rests on a precarious ontological assumption: that physiological control systems are fundamentally less constrained by developmental architecture and physical law than gross morphology. Below is an assessment of the exposure of this view, ranked defeaters, the likely response from the structuralist camp, and an analysis of the *ad hoc* risk.

  ### I. Ranked Defeaters: From Fatal to Awkward

  To evaluate the robustness of your synthesis, we must distinguish between evidence that merely complicates your taxonomy and evidence that dissolves the boundary upon which your bifurcation rests.

  **1. Fatal: The Ontological Collapse of the Morphology/Physiology Distinction**
  *   **The Scenario:** Advances in systems biology or evo-devo demonstrate that physiological control loops are as strictly determined by physical and developmental constraints as cranial sutures. For instance, if a specific feedback loop in osmoregulation is shown to be an inevitable thermodynamic consequence of membrane geometry or protein folding kinetics, with no degrees of freedom for selection to act upon.
  *   **Why it is Fatal:** Your position relies on the premise that physiology offers "functional coherence" that implies selective tuning. If physiological function is shown to be a deterministic byproduct of lower-level physical constraints (molecular morphology), the distinction between "structural spandrel" and "physiological adaptation" evaporates. You cannot default to adaptation in physiology if physiology is just morphology at a microscopic scale.
  *   **Your Example:** You asked if a conserved homeostatic mechanism arising from membrane geometry would collapse your view. **Yes.** If the "control" is actually a physical necessity, it is a spandrel, regardless of whether it is classified as physiology.

  **2. Fatal: The Existence of "Physiological Spandrels"**
  *   **The Scenario:** A comparative phylogenetic analysis reveals that a complex physiological trait (e.g., a specific hormonal cascade) arose as a pleiotropic side-effect of a different selected trait and was never selectively tuned for its current function, yet persists due to phylogenetic inertia.
  *   **Why it is Fatal:** This directly contradicts your default rule for the physiological domain. If you must concede that complex physiological systems can be non-adaptive byproducts, your "default to adaptation" for physiology loses its predictive power and becomes indistinguishable from the standard adaptationist stance you seek to qualify.

  **3. Serious: Systems Robustness and "Sloppiness"**
  *   **The Scenario:** Work in systems biology (e.g., by Gunter Wagner or Hiroaki Kitano) shows that physiological networks are "sloppy." Many parameters within a control system can vary widely without affecting fitness, implying the system is not tightly optimized but merely robust.
  *   **Why it is Serious:** This undermines the "functional coherence" argument. If a system works adequately across a wide range of parameter values without specific tuning, the inference to selection is weakened. It suggests the system occupies a "neutral space" rather than an adaptive peak. This doesn't prove the trait is a spandrel, but it removes the primary evidence you use to classify it as an adaptation.

  **4. Awkward: Morphological Exaptation**
  *   **The Scenario:** Every trait previously classed as a morphological spandrel (e.g., the human chin) is found to carry a subtle, measurable fitness effect in a specific ecological context.
  *   **Why it is Awkward:** This does not necessarily defeat your view. Gould and Lewontin distinguished between *origin* and *current utility*. A spandrel can be co-opted (exapted). Your claim regarding morphology is that these traits arise as non-adaptive byproducts. Finding current utility does not prove they were *selected for* originally. It merely complicates the historical reconstruction. You can absorb this by maintaining that the *origin* was structural, even if maintenance is now selective.

  ### II. The Gould-Lewontin Defense: Concessions and Dismissals

  How would defenders of the original "Spandrels of San Marco" critique react to your synthesis?

  **What They Would Concede:**
  *   **The Morphological Default:** They would likely applaud your concession on gross morphology. Gould spent much of his later career arguing exactly this: that allometry and developmental constraint dictate form more than selection does. Finding a philosopher of science who grants this default status to structuralism would be seen as a victory.
  *   **The Burden of Proof:** They would agree that adaptationist stories require rigorous testing. Your insistence that physiology must be "specifically undermined" to be rejected as adaptive might be acceptable *if* the testing is rigorous (e.g., comparative methods, knockout studies).

  **What They Would Dismiss:**
  *   **The Physiological Exception:** This is the flashpoint. Defenders of the spandrel critique argue that the organism is an integrated *Bauplan*. They would argue that physiological pathways are just as subject to historical constraint and developmental correlation as bones. They would view your distinction as a retreat to the "invisible hand" of selection at a level of organization where it is harder to disprove.
  *   **Functional Coherence as Evidence:** They would argue that "functional coherence" is the adaptationist's favorite illusion. A system can be coherent without being optimized. They would cite examples like the recurrent laryngeal nerve in giraffes—a physiological/anatomical routing that is coherent but demonstrably non-optimal due to historical constraint. They would argue your view risks conflating "function" with "adaptation."

  ### III. The Risk of Ad Hoc Insulation

  You asked whether your position risks being insulated by *ad hoc* qualifications—specifically, whether you are redrawing the boundary between morphology and physiology merely to save the theory from counterexamples.

  **The Verdict: It is a Methodological Heuristic, Not an Ontological Claim.**

  If you present your bifurcation as an **ontological claim** (i.e., "Nature *is* structured such that physiology is adaptive and morphology is not"), it is highly vulnerable to the *ad hoc* charge. Biology does not respect clean boundaries between structure and function; proteins have shape (morphology) that dictates enzyme activity (physiology). If a critic shows that a physiological trait is constrained by protein shape, and you reply, "Then that counts as morphology," you are engaging in definitional gerrymandering.

  However, if you present this as a **methodological heuristic** (i.e., "When studying gross morphology, bet on constraint first; when studying homeostatic loops, bet on selection first"), the charge of *ad hoc* insulation loses its sting. In experimental science, we often employ different null hypotheses for different systems based on prior success rates.

  **Is this a philosophical vice?**
  *   **Yes, if:** You refuse to update the boundary when evidence shows physiological traits are structurally constrained. If you treat "physiology" as a black box that is immune to structuralism, you are insulating the view.
  *   **No, if:** You acknowledge that the boundary is porous and that the "default" is a betting strategy for research funding and experimental design, not a statement of metaphysical truth.

  ### IV. Summary Assessment

  Your position is **moderately exposed**. It is more defensible than Panglossian adaptationism but less secure than a unified structuralist view.

  *   **Strong Point:** It aligns well with current evo-devo consensus on gross morphology.
  *   **Weak Point:** It underestimates the extent to which physiology is constrained by molecular morphology and phylogenetic history.
  *   **Decisive Defeater:** The demonstration that physiological control parameters are determined by physical necessity rather than selective optimization (The Ontological Collapse).
  *   **Survival Strategy:** To maintain this view without falling into *ad hoc* reasoning, you must frame it explicitly as a **strategic methodological dualism**. You are not claiming physiology *is* adaptive; you are claiming that, given current tools, treating it as such yields better explanatory returns than treating it as a spandrel, whereas the reverse is true for cranial architecture.

  If you hold the line that physiology is *inherently* less constrained than morphology, the rapid advances in systems biology and biophysics will likely erode your position. If you hold the line that this is a pragmatic division of labor for inquiry, your position remains a viable, nuanced contribution to the philosophy of biological explanation.
