          *   *Verdict:* The utility function assumed by the user (maximize true belief, minimize false belief) might contradict the theological goal (maximize *loving free relationship*).

      *   *Crack 3: Risk-Weighting and Omnipotence.*
          *   REU is about how agents *feel* about risk (psychological/axiological weighting).
