answer: |-
  It is entirely understandable that you feel a bit embarrassed about nodding along to that sentence for years without dissecting it, because the phrase DNA is code is one of those high-compression metaphors that collapses several distinct ontological claims into a single handy package. To give you the menu you asked for, we can arrange the possible meanings along a spectrum from the trivial to the extravagant. At the weakest end, which nobody would deny, is the claim that DNA carries causal information relevant to the construction and maintenance of the organism. This is merely a statement about correlation and causality: change the sequence, and you often change the phenotype. Slightly stronger is the claim that DNA functions as a digital symbolic system, meaning it uses discrete units arranged in a sequence to specify outcomes, distinct from analog chemical gradients. This is substantive but defensible; the discreteness of the base pairs supports it. Stronger still is the claim that the mapping between these symbols and their effects is arbitrary and conventional, akin to human language, rather than dictated by physical necessity. This is the view your comment thread author was leaning on, and it is where things get contentious. At the far end, which would be big news if true, is the claim that the genome constitutes a formal system in the logical sense, capable of encoding self-referential statements about truth or provability, thereby making biological systems subject to Gödelian limits. Most biologists would reject this last one as a category error, while some computationally inclined theorists might argue it is merely an open question.

  When we look at the three specific uses your thread author made of the claim, we can see them sliding between these rungs of the ladder to borrow credibility from the lower ones to support the higher ones. His first claim, that the genome is literally the organism's source code, relies on the digital symbolic view. This reading stands up reasonably well if you accept the computer metaphor, but it risks ignoring the massive role of epigenetic marking and environmental context that acts less like code and more like configurable hardware settings. His second claim, that there is no fact of the matter about what a gene means apart from the translation machinery, relies on the arbitrary convention view. This is partially true in that the genetic code is a frozen accident, but it is false if it implies that any mapping is physically possible; chemistry constrains the code just as physics constrains a bridge, so the meaning is not purely conventional. His third claim, that DNA in a test tube is like a program on a wiped drive, relies on the hardware-software distinction. This is plausible as an analogy but technically misleading because DNA in a tube is chemically active in ways a program on a wiped drive is not; it is more like a key without a lock than software without hardware. In all three cases, the argument works only if you accept the middle-ground view that DNA is a digital symbolic system, but it gains its rhetorical punch by smuggling in the stronger view that the system is arbitrary and separable from its physical substrate, which is where the platitude version stops doing work and the substantive version starts failing.

  The version you find more interesting, where the translation machinery is itself encoded in the genome, is not merely a special case of DNA is code but a fundamentally different claim that corrects the implicit dualism of the standard metaphor. Standard code implies an external interpreter, but a cell is a closed loop where the data specifies the interpreter that reads the data. This is indeed closer to a quine, and it is the only reading on which Gödelian incompleteness is even faintly relevant, because Gödel's theorem hinges on self-reference within a formal system. However, calling this DNA is code is potentially confusing because it obscures the fact that the code and the computer are made of the same stuff. In typogenetics, Hofstadter constructs a formal system where strings manipulate themselves, creating an isomorphism with biology, but this isomorphism is structural, not necessarily logical. The self-referential version supports the idea that biology is computationally closed, but it does not automatically license the jump to incompleteness unless you can show that biological consistency maps to logical truth, which is a separate and much shakier bridge.

  Regarding your hypothetical case of an organism where codon mapping depends on transcript folding and metabolic state, the verdict on whether this counts as code depends entirely on which rung of the menu you are standing on. If you define code as requiring a fixed lookup table, then this organism does not use code; it uses a context-sensitive chemical algorithm. If you define code more broadly as rule-based symbol manipulation, then it still qualifies. This suggests that your verdict here is doing real work only if you have a strict definition of code in mind; otherwise, it is just stipulating boundaries to save the metaphor. The real-world facts you recalled are correct: the mitochondrial code does differ slightly from the standard nuclear code, for instance using UGA for tryptophan instead of a stop signal, and researchers have engineered organisms with expanded alphabets using extra base pairs. These facts support the view that the code is contingent and not physically inevitable, which bolsters the arbitrary convention reading. However, they do not support the idea that the code is unconstrained; the variations are still limited by chemical compatibility and error tolerance, so it supports the view that a frozen convention can be refrozen elsewhere, not that the convention is free from physical law.

  This leads directly to your question about whether being a code is a property of the molecule or the molecule together with a reader. It is strictly a property of the system. A sequence of bases is just a polymer until it is situated within a mechanism that interprets those bases as instructions. If DNA is code only relative to a reader, then the statement DNA is code is indeed shorthand for DNA functions as code within a cell, and it quietly stops being a claim about DNA in isolation. This undermines the thread author's third point about the DNA in the test tube; if the code property is relational, then the DNA in the tube lacks the property entirely, not because the drive is wiped, but because the relational context is missing. It is not dormant software; it is just chemistry waiting for a context that confers semantic value.

  Finally, to address the plank that broke in the argument about Gödel, the step from code to formal system to so Gödel applies is not licensed by the biology alone. A formal system in the logical sense requires rules of inference and a definition of truth within the system. Biology has rules of interaction and a definition of viability, but viability is not truth. Gödel's incompleteness theorem shows that in any sufficiently complex formal system, there are true statements that cannot be proven within the system. For this to apply to biology, you would need to map biological survival or replication to logical provability and biological existence to logical truth. While typogenetics creates a toy universe where this mapping holds, real biology is under no obligation to respect logical consistency in the same way; a cell can be inconsistent and still survive, or consistent and die. The bridge requires an assumption that biological systems are trying to prove theorems about themselves rather than simply persisting in time. Without that assumption, the invocation of Gödel is decorative, using the prestige of mathematical logic to bless a biological observation that stands or falls on empirical grounds alone. The comment thread likely went off the rails because it treated the metaphor of code as a literal identity, allowing the properties of software to be transferred to biology without checking if the underlying substrate could support the weight of those properties.
