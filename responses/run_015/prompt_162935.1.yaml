  In a family foundation board, two co-directors must unanimously approve the annual grant portfolio, but the trust's bylaws dictate that if they deadlock, a trustee flips a coin to award the entire endowment to either Theological Seminaries (Side A's priority) or Contemporary Art (Side B's priority). Side A views Art funding as morally frivolous and spiritually harmful, while Side B views Seminary funding as exclusionary and socially regressive; each sees the other's priority not merely as less important, but as a genuine moral cost. To avoid the coin flip, they agree to a portfolio that fully funds both causes, accepting the moral cost of the other's project to secure their own. Side A, however, operates under a personal side-constraint: a vow never to personally sign a check written to an Art Institution. The deal structures the administration so Side B signs the Art grants while Side A signs the Seminary grants, allowing the portfolio to pass without Side A breaching their vow. If we reinterpret Side A's constraint to cover not just signing but authorizing or permitting the funds, the deal collapses immediately, as Side A would then be complicit in the very harm they vowed to avoid.

  ***

  **Outcome Rankings**

  *   **Side A (Traditionalist):**
      1.  **Ideal:** 100% Seminaries, 0% Art.
      2.  **Deal:** 100% Seminaries, 100% Art (Secure priority, absorb moral cost of Art).
      3.  **Coin Flip:** 50% chance of Ideal, 50% chance of Nightmare (0% Seminaries, 100% Art).
      4.  **Nightmare:** 0% Seminaries, 100% Art.
      *(The Deal beats the Coin Flip because securing the Seminary funding is worth the moral cost of tolerating Art, whereas the Flip risks losing the Seminary funding entirely.)*

  *   **Side B (Progressive):**
      1.  **Ideal:** 100% Art, 0% Seminaries.
      2.  **Deal:** 100% Art, 100% Seminaries (Secure priority, absorb moral cost of Seminaries).
      3.  **Coin Flip:** 50% chance of Ideal, 50% chance of Nightmare (0% Art, 100% Seminaries).
      4.  **Nightmare:** 0% Art, 100% Seminaries.
      *(Symmetrical to A: The certainty of Art funding outweighs the cost of tolerating Seminaries.)*

  **The Single Feature Doing the Work**
  The **orthogonality of value assignments**. Side A cares intensely about X and negatively about Y; Side B cares intensely about Y and negatively about X. If both sides cared about the same axis (e.g., both wanted Seminaries but disagreed on the amount), there would be no gain from trade, only conflict over magnitude. Remove the orthogonality (make Y valuable to A), and the "cost" disappears, turning it into a coordination problem rather than a compromise. Remove the negative valuation (make Y neutral to A), and it's no longer a moral compromise, just a concession. The gain exists *only* because each side is trading something they view as a cost for something they view as a necessity.

  **Hardliner Attack**
  A hardliner on Side A argues: "This deal is moral blackmail. You are telling me, 'I will let you do the right thing (fund Seminaries) only if you let me do the wrong thing (fund Art).' By accepting this, you aren't just tolerating error; you are making your virtue contingent on my vice. You have turned the Foundation into a launderer of sin, where my good grant is purchased with the price of your bad one. It would be purer to lose the Seminary funding than to buy it with Art money."

  **Does it land?**
  It lands, but it does not veto the deal. The hardliner correctly identifies that the compromise generates **moral residue**: Side A *is* complicit in funding Art, regardless of who signs the check, because the portfolio passes only through their affirmative consent. The deal *does* legitimize Side B's value by granting it institutional parity. However, the hardliner fails to show that purity is the only moral good. If the mission of the Foundation is to do good in the world, and the Seminary funding does measurable good, refusing the deal sacrifices that good for the sake of Side A's personal cleanliness. The objection lands as a critique of Side A's moral integrity (they are now tainted), but it fails as a strategic critique (the world is still better off with the Seminaries funded). I commit that the objection lands: the deal *is* morally dirty, and Side A *does* sacrifice some integrity for efficacy. Pretending otherwise is self-deception.
