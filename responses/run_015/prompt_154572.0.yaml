  ### New Cases You Asked About

  **"If it's not in the East column, it's in the north row"**
  *   **Antecedent:** West + Middle.
  *   **Consequent:** North Row.
  *   **CAU Application:** Calculate total mass of West + Middle (say, 2/3). Keep it at 2/3. Zero out WS and MS. Redistribute the 2/3 mass to WN and MN based on their original ratio. East column remains untouched.
  *   **Note:** This treats "Not East" as a region to be constrained, not a fact that eliminates East.

  **Order of Hints (Case 4 variants)**
  *   **Problem:** The CAU rule is **not commutative**. Order matters.
  *   **Example:**
      1.  "If West, then North" (Moves WS mass to WN).
      2.  "If North, then West" (Moves MN/EN mass to WN).
  *   **If 1 then 2:** Hint 1 sets $P(\text{West})=1/3$. Hint 2 treats "North" as the Antecedent. The North row now has high mass (because of Hint 1). Hint 2 moves all that North mass into West. Final $P(\text{West})$ becomes high.
  *   **If 2 then 1:** Hint 2 moves MN/EN to WN. $P(\text{North})$ is preserved. Hint 1 treats "West" as Antecedent. West now has high mass (because of Hint 2). Hint 1 moves all West mass to WN.
  *   **Verdict:** In this specific symmetrical case, they converge to "All mass on WN". But in asymmetric cases, order changes the result.
  *   **Fix:** If you receive multiple hints at once, treat them as **Simultaneous Constraints**. Find the distribution that satisfies all "If P then Q" constraints while changing the priors as little as possible (Maximum Entropy). For your Python code, simply applying them sequentially is acceptable *if* you acknowledge that later hints override the "preservation" of earlier hints.

