      *(Self-Correction during drafting)*: Make sure the "Logic" isn't just arbitrary. It needs to feel like a deduction.
      *   *Fix:* The "Inference Deck." If Axiom is passed, draw from "Reflective Deck." If not, draw from "Standard Deck." The Reflective Deck contains the "Poison Pill" card that contradicts the majority private state.
      *   *Why?* Because Löb's theorem shows that adding the reflection principle allows you to prove things you couldn't before (specifically, the consistency statement itself implies the truth of the sentence).
      *   *Actually, Löb says:* $\square(\square P \to P) \to \square P$.
