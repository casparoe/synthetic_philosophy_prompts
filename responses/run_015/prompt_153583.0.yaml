  2.  **Deconstruct the Logic (Löb's Theorem):**
      *   *Core Idea:* If a system $T$ proves "If $T$ proves $P$, then $P$" (soundness for $P$), then $T$ proves $P$.
      *   *The Trap:* You can't have a system that proves its own soundness without becoming inconsistent or proving everything (if not careful). Specifically, a system cannot contain a provability predicate that satisfies the Hilbert-Bernays derivability conditions *and* proves its own consistency without being inconsistent (Gödel II), or proving specific sentences via Löb's Theorem.
      *   *Simulation Translation:*
          *   System $T$ = The Group + Rules.
          *   Provability = Voting/Consensus.
          *   Soundness/Consistency Statement = "If the Group votes True, then it is True."
          *   The "Surprise" = Once you endorse the rule "We are reliable," the logic forces a specific conclusion that contradicts initial states.

  3.  **Drafting the Game Mechanics:**
      *   *Players:* 14 students.
      *   *Roles:* "Reasoning Nodes."
      *   *Materials:* Private Belief Cards (Red/Blue or True/False), Inference Rule Sheets, Voting Paddles.
