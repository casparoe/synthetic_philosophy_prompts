      *   25-40: Round 3 (The Master Axiom Vote).
      *   40-55: Round 4 (The Consequence & The Crash).
      *   55-75: Debrief (Mapping to Löb, Limitations, Meta-Commentary).

  8.  **Refining the Scoring:**
      *   Need to make the trade-off painful.
      *   Private Card = 10 points if honored.
      *   Collective Consistency = 10 points if honored.
      *   If Master Axiom adopted: Logic forces Collective Truth. If Collective Truth != Private Card, lose Private points.
      *   If Master Axiom rejected: Lose Collective points (System is "broken").

