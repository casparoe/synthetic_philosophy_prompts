  **DEPARTMENT OF RANDOMNESS ASSURANCE**
  **Office for Randomness Assurance**
  **15 CFR Part 700**
  **Docket No. ORA-2023-0042**

  **Notice of Proposed Rulemaking: Protocols for Stochastic Chord Generation**

  **AGENCY:** Office for Randomness Assurance (ORA), Department of Randomness.

  **ACTION:** Notice of proposed rulemaking.

  **SUMMARY:** The Office for Randomness Assurance proposes to establish certification standards for devices generating random chords within a circular boundary. This action addresses ambiguities arising when multiple parametrization methods yield divergent probability outcomes for identical geometric conditions. The Office proposes that conformance be assessed relative to a device's declared measure.

  **DATES:** Comments must be received by December 31, 2024.

  **ADDRESSES:** Submit comments to Docket No. ORA-2023-0042 via the Federal eRulemaking Portal.

  **SUPPLEMENTARY INFORMATION:**

  **I. Background and Geometric Ambiguity**
  Regulated entities frequently require the generation of a random chord within a circle of radius $R$. A common compliance metric involves determining the probability that a generated chord exceeds the length of the side of an inscribed equilateral triangle ($R\sqrt{3}$). The Office has identified three classical generation methods currently in use, each producing distinct probabilities despite satisfying colloquial definitions of "random."

  Method A selects two points independently and uniformly on the circumference. The resulting probability is 1/3. Method B selects a point uniformly along a randomly oriented radius, constructing a chord perpendicular to that radius at the selected point. The resulting probability is 1/2. Method C selects a point uniformly within the interior of the circle, designating it as the chord's midpoint. The resulting probability is 1/4.

  **II. Proposed Rule: Declared Parametrization**
  The Office determines that no single method possesses intrinsic priority over another. Therefore, conformance will be assessed relative to each device's declared measure on Form RA-7. A machine counts as properly random provided its output distribution matches the parametrization declared on said form.

  This logic necessitates a default protocol for agencies, polls, or risk assessments that report probability figures without declaring a measure. The Office proposes that, absent a declaration, the default measure shall be uniform in whatever quantity the reporting form happens to ask about. If a form requests "Chord Length," the distribution is assumed uniform over length. If it requests "Midpoint Distance," the distribution is assumed uniform over distance. Consequently, a reporting entity may alter the reported probability of any event between 0 and 1 solely by redesigning the input fields of the reporting form. The Office considers this an acceptable administrative flexibility.

  **III. Response to Comments on Invariance**
  During the pre-rulemaking phase, an interested party argued that demanding invariance under translation, rotation, and rescaling of the circle settles the matter uniquely. The Office notes that it has no jurisdiction over transformations. The Office regulates devices, not geometric spaces. Assertions that reality should remain consistent regardless of coordinate system placement are outside the scope of 15 CFR Part 700.

  **IV. Pending Validations**
  The Office is currently validating a fourth method, under review for three years. In this protocol, the chord is fixed by two points drawn uniformly from the square circumscribing the circle, keeping the line only if it crosses the circle. The Office favors this method because it is grid-based and neutral like everything else in the standard. However, the validation study keeps returning a different figure depending on which way the square is laid over the circle. The Office has provisionally concluded that this is a fact about reality rather than about the method. No probability value will be assigned until the square's orientation is standardized.

  **V. Public Interest Statement**
  Regarding the proposed flexibility in form design, Arthur Vane, CEO of Stochastic Solutions Inc., stated: "Clarity is compliance. If the form asks for a number, and we provide a number uniform over the question asked, we have satisfied the requirement of truthfulness within the defined parameter space."

  **QUESTIONS FOR COMMENT**
  1. Should the default measure be uniform over the requested quantity or the underlying physical variable?
  2. Does the Office have authority to mandate circle orientation in circumscribing square protocols?
  3. Are there other geometric ambiguities requiring regulatory clarification?

  **Authority:** 15 U.S.C. 2601 et seq.

  **Dated:** October 14, 2024.

  **Dr. Helena Corves,**
  *Director, Office for Randomness Assurance.*
