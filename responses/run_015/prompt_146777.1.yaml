  **Scenario**

  Elena sits in a standard history classroom, facing the wooden teacher's desk directly in front of her. She forms the basic perceptual belief that the desk is present based solely on her clear visual experience of it. Aware that the school drama club sometimes constructs hyper-realistic props for immersive lessons, she acknowledges the possibility that the entire room is a staged set designed to mislead students about the nature of their surroundings. She reasons silently: 'Either this desk is a real piece of furniture or I am being systematically deceived about the nature of this room; I see clearly that this desk is a real piece of furniture; therefore, I am not being systematically deceived about the nature of this room.' She accepts this conclusion as newly acquired knowledge based solely on her visual experience of the desk, treating the inference as a valid extension of her perceptual justification.

  ***

  **Demonstration of Specifications**

  **(i) The Appearance of Easy Knowledge**
  The reasoning appears to generate easy knowledge because it allows Elena to secure a high-stakes epistemic conclusion—that her environment is not a comprehensive fabrication—using only a low-stakes perceptual premise. The conclusion rules out a global error possibility regarding her surroundings, a claim that typically demands significant evidence or independent verification. However, the disjunctive syllogism suggests she can deduce this security merely by looking at the desk. This violates the intuition that knowledge of the absence of deception should be harder to acquire than knowledge of the object itself; yet, the logical structure implies that knowing the object exists automatically grants her knowledge that she is not being deceived, making the anti-sceptical knowledge appear trivially easy to obtain.

  **(ii) The Bootstrapping Problem and Justification**
  The bootstrapping problem arises because Elena uses the output of her perception (the belief that the desk is real) to confirm the conditions required for that perception to be trustworthy (that the room is not a deceptive set). A reliabilist defence might argue that if her visual faculty is objectively reliable, the process yields a true belief, and thus she is justified regardless of the circularity; for the reliabilist, the external fact of reliability validates the inference even if she cannot internally verify it. Conversely, an internalist objection locates the failure in her perspective: she lacks independent access to the reliability of her vision or the authenticity of the room. From the internalist view, she cannot use the belief 'the desk is real' to rule out deception because the justification for 'the desk is real' already presupposes that she is not being deceived; thus, the reasoning begs the question and fails to extend justification.

  **(iii) The Single Structural Feature**
  The structural feature that does the philosophical work in this case is **the dependency of the premise's justification on the falsity of the deceptive alternative.** Specifically, the justification for believing 'the desk is real' is only valid if the alternative 'I am being systematically deceived' is already false. The case is constructed so that the perceptual evidence supports the premise only if the conclusion is already assumed to be true. This dependency creates the circularity: the premise cannot do the work of eliminating the alternative because the premise's own standing relies on that alternative already being eliminated.

  **(iv) The Collapse Upon Removal**
  If this feature is removed—meaning if the justification for the perceptual belief is made independent of the deceptive alternative—the easy knowledge vanishes. For the premise to be justified independently, Elena would need prior evidence that the room is not a set (e.g., touching the desk, checking with a peer, or recalling the lesson schedule) before she uses the visual belief to rule out deception. Once this independent warrant is required, the disjunctive syllogism no longer generates new knowledge about the environment from perception alone; instead, it merely reflects what she already had to establish to trust her perception in the first place. Consequently, the inference loses its power to solve the sceptical worry easily, restoring the intuitive difficulty of ruling out systematic deception.
