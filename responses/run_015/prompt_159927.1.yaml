prompt: |-
  Sorry if this is long. I'm on a small behavioural insights team at a public pension agency and we're finally writing an internal ethics guidance note for the stuff we actually ship, and going through it I've realised my own views here are probably less tidy than I keep pretending in meetings. We had a proper fight about it at our offsite last month and nobody convinced anybody. Here's roughly where I've landed:

  (1) Option-preserving is basically the whole moral ballgame: rearranging the choice environment is fine, taking options away (bans, mandates, stiff penalties) is a different category and I want no part of it.
  (2) I'm attached to what I've seen called asymmetric paternalism — an intervention is justified if it helps people who are making an error and leaves the people who aren't making an error no worse off. What I like about it is that it seems to let me do good without ever having to win an argument about whose values or preferences are better than whose.
  (3) But I don't think actual choices are the welfare standard. Revealed preferences are shot through with framing, defaults and inertia, so what people actually pick can't be the thing I'm trying to promote; I want to say the target is something like their informed or "laundered" preferences.
  (4) I reject the transparency condition. If an intervention only works while people aren't noticing it, and would stop working the day it got disclosed, I definately don't count that against it. Where people end up is what matters, not whether they could in principle endorse the mechanism.
  (5) I think targeting is good, not creepy: use a predictive model and give different defaults to different people depending on how likely they are to make the relevant mistake, instead of one blunt default for everyone. Uniform defaults waste the effect on people who'd have been fine anyway and under-help the ones who most need it.
  (6) I also think the nudger's aim matters: the very same intervention is fine when it's aimed at the person's own good and objectionable when it's really serving somebody else's bottom line, even if it happens to help the person too. Our own procurement people keep pushing an auto-enrolment tweak that would genuinely help staff and also cut our admin costs, and I cant get myself to be neutral about that.
  (7) Auto-escalation, where your contribution rate creeps up every year unless you actively opt down, is the best tool we have and I'd defend it to anyone.
  (8) But I also want to say that interventions which work by farming people's inattention or procrastination are manipulative and not OK; the legitimate ones remove real obstacles like hassle costs and confusing forms, they don't just sit on people's inertia.
  (9) And here's what started the fight: we've begun running what we call "re-setters" internally — instead of a default that fires once and then sticks, the default re-applies every year, so if you opted out last year you get put back in unless you actively opt out again. I think these are better than sticky defaults, because everyone gets a fresh chance each year to act on what they actually want, and the group still enrolled at the end is closer to the group that genuinely wants to be in.

  Can someone audit this for me? I'd like the tensions ranked by severity rather than a list where everything is flagged as equally bad, and for each real one I want to know exactly what would have to give and what it would cost me to give it. Please also tell me which pairs only look like they're in tension — I have a feeling at least one of these is actually fine and I'm just hearing it as contradictory because of how I've worded it, but I can't tell which. And if there's one revision that would clean up the most, say what it is. Be concrete about the re-setters specifically: I need to know whether (9) survives (1)–(8) or whether I have to pick.
reasoning: |-
  Here's a thinking process that leads to the suggested audit:

  1.  **Analyze the User and Context:**
      *   **User:** Member of a small behavioural insights (BI) team at a public pension agency.
      *   **Task:** Writing internal ethics guidance for shipped interventions.
      *   **Problem:** Realizes their own ethical framework is inconsistent/untidy after a fight at an offsite.
      *   **Input:** 9 specific ethical positions/principles they currently hold.
      *   **Request:** Audit the list for tensions/contradictions. Rank tensions by severity. Explain trade-offs (what gives, what it costs). Identify false tensions (pairs that look contradictory but aren't). Suggest one revision to clean up the most. Specifically address the viability of principle (9) "re-setters" against (1)-(8).
      *   **Tone:** Professional, analytical, direct, respectful of the nuance (this is ethics, not math), but concrete.

  2.  **Deconstruct the 9 Principles:**
      *   (1) **Option-Preservation:** Nudges OK, bans/mandates NOT OK. (Libertarian Paternalism core).
      *   (2) **Asymmetric Paternalism:** Help error-makers, harm no one else. (Thaler/Sunstein adjacent).
      *   (3) **Welfare Standard:** Not revealed preference, but "laundered/informed" preference. (Requires judging what they *would* want if rational).
      *   (4) **Anti-Transparency:** Effectiveness > Transparency. Hidden nudges OK if they work. (Controversial in BI ethics).
      *   (5) **Targeting:** Personalized defaults > Uniform defaults. Efficiency argument.
      *   (6) **Intent/Motive:** Nudger's aim matters. Self-interest (cost-cutting) makes it objectionable even if helpful. (Kantian/deontological lean).
      *   (7) **Auto-Escalation:** Specifically endorsed. (Creeping default).
      *   (8) **Inertia vs. Obstacles:** Removing obstacles OK, farming inattention/manipulative NOT OK. (Hard to distinguish from 4 & 7).
      *   (9) **Re-setters:** Defaults re-apply annually. Opt-out last year? You're back in. (Aggressive nudge).

  3.  **Identify Tensions/Contradictions:**

      *   *Tension A: (4) Transparency vs. (8) Manipulation.*
          *   (4) says hiding the mechanism is fine if it works.
          *   (8) says farming inattention/procrastination is manipulative and not OK.
          *   *Conflict:* If a nudge relies on inattention (which (4) implies is okay to exploit for results), (8) calls it manipulative. Most hidden nudges *work* by farming inattention.
          *   *Severity:* High. This strikes at the core of *how* the nudges work.

      *   *Tension B: (1) Option-Preservation vs. (9) Re-setters.*
          *   (1) says rearranging choice architecture is fine, taking options away is not.
          *   (9) re-applies defaults annually. If I opted out last year (an active choice), and you put me back in without asking, are you respecting my previous choice?
          *   *Conflict:* Re-setters treat a past active choice as temporary. It increases "hassle costs" of staying out significantly. Is this effectively coercive?
          *   *Severity:* High (specifically regarding the user's specific question about re-setters).

      *   *Tension C: (2) Asymmetric Paternalism vs. (5) Targeting.*
          *   (2) says leave non-error-makers "no worse off."
          *   (5) says target people likely to make mistakes.
          *   *Conflict:* If you target, you might stigmatize or create different choice environments for different people. Does being identified as "likely to err" make you worse off (psychologically or privacy-wise)? Also, if the model is wrong, you might restrict someone who wasn't an error-maker.
          *   *Severity:* Medium. Mostly practical/implementation risk.

      *   *Tension D: (6) Intent vs. (2) Consequences.*
          *   (6) says intent matters (cost-cutting makes it bad).
          *   (2) is purely consequentialist (help some, harm none).
          *   *Conflict:* If the outcome is identical (Asymmetric Paternalism satisfied), (6) vetoes it based on motive.
          *   *Severity:* Medium. It's a clash of ethical frameworks (Deontology vs. Consequentialism).

      *   *Tension E: (7) Auto-Escalation vs. (8) Farming Inertia.*
          *   (7) explicitly defends auto-escalation.
          *   (8) condemns interventions working by farming procrastination/inertia.
          *   *Conflict:* Auto-escalation *is* farming procrastination/inertia. That is its mechanism.
          *   *Severity:* High. Direct contradiction.

      *   *Tension F: (3) Laundered Preferences vs. (4) Transparency.*
          *   (3) wants to serve what people *would* choose if informed.
          *   (4) says you don't need to tell them what you're doing.
          *   *Conflict:* Can you truly serve "informed" preferences by keeping the intervention *un*informed/hidden?
          *   *Severity:* Medium-High. Philosophical consistency.

  4.  **Analyze False Tensions:**
      *   *(1) Option Preservation vs. (5) Targeting:* You can target without removing options. Just different defaults. This is likely fine.
      *   *(2) Asymmetric Paternalism vs. (7) Auto-Escalation:* Asymmetric paternalism justifies auto-escalation *if* it meets the criteria. No inherent tension there, provided the "harm none" condition is met.

  5.  **Evaluate "Re-setters" (9) against the rest:**
      *   (9) is the most aggressive. It turns a default into a recurring subscription.
      *   Against (1): It raises the cost of opting out (you have to do it every year). Does high hassle = option removal?
      *   Against (8): It explicitly relies on the likelihood that people will forget to opt out again (farming inattention).
      *   Against (4): It likely requires some opacity to work (if everyone knew it resets, they might set a reminder).
      *   *Verdict:* (9) is the weakest link ethically. It strains (1) and breaks (8).

  6.  **Develop the "One Revision" to Clean Up:**
      *   The core mess is the definition of "Manipulation" vs. "Nudge."
      *   (4) allows hidden stuff. (8) bans manipulation. (7) allows escalation (manipulative?).
      *   The fix needs to align the *mechanism* allowance with the *transparency* stance.
      *   *Suggestion:* Drop (4). Embrace transparency. If you can't defend it publicly, don't do it. This resolves the manipulation tension and aligns with public sector trust.
      *   *Alternative:* Refine (8) to distinguish "beneficial inertia" from "exploitative inertia." But (4) is the bigger ethical liability for a public agency.
      *   *Best Revision:* Abandon (4). Public trust is the currency of a pension agency. Hidden nudges destroy trust. This clarifies (8) and (3).

  7.  **Drafting the Response:**
      *   **Structure:**
          1.  Executive Summary (The "Verdict").
          2.  Ranked Tensions (Severity 1-3).
          3.  False Tensions (What's actually fine).
          4.  The "Re-setters" Audit (Specific answer to 9).
          5.  The One Revision (Strategic advice).
      *   **Tone:** Peer-to-peer, rigorous, empathetic to the difficulty of BI ethics.
      *   **Content:** Ensure specific trade-offs are named (e.g., "You lose efficiency to gain legitimacy").

  8.  **Refining the Analysis (Self-Correction during drafting):**
      *   *Check:* Did I address (6)? Yes, the motive vs. outcome tension.
      *   *Check:* Is (9) survivable? Only if (8) is rewritten. If (8) stands as written ("farming inattention... not OK"), (9) dies because re-setters *depend* on inattention.
      *   *Check:* Is (4) really the biggest problem? For a *public* agency, yes. Private companies can hide nudges; public trusts cannot. I need to emphasize the "Public Pension" context.
      *   *Refining (1) vs (9):* Is a re-setter an option removal? Technically no, but functionally it creates a "tax" on active choice. I should frame it as "Hassle as a Barrier."

  9.  **Final Polish:** Check against the prompt's constraints (rank severity, concrete trade-offs, specific re-setter verdict).

      *(Self-Correction on Severity Ranking)*:
      1.  (7) vs (8) is the most direct logical contradiction. (Escalation *is* inertia farming).
      2.  (4) vs (8) is the next biggest (Transparency vs Manipulation).
      3.  (9) vs (1) & (8) is the specific application risk.
      4.  (6) vs (2) is philosophical but manageable.

      *Wait, looking closer at (7) and (8).* (7) says Auto-escalation is best. (8) says farming inertia is not OK. Auto-escalation *works* by farming inertia. This is a flat contradiction. This needs to be Severity 1.

      *Looking at (9).* Re-setters are *more* aggressive than auto-escalation. If (7) is barely defensible under (8), (9) is indefensible under (8).

      *Looking at (4).* Rejecting transparency is dangerous for a public agency. This is a strategic risk, not just a logical tension.

      *Okay, let's structure the ranking based on "Threat to the Framework's Coherence" and "Threat to Agency Legitimacy".*

      *Ranking:*
      1.  **The Mechanism Contradiction:** (7) & (9) vs. (8). (You can't say inertia farming is bad but escalation/resetters are good).
      2.  **The Transparency Trap:** (4) vs. (3) & Public Trust. (You can't claim to serve "informed" preferences via hidden means).
      3.  **The Motive/Outcome Clash:** (6) vs. (2). (Deontology vs Consequentialism).
      4.  **The Option Cost:** (9) vs. (1). (Is high hassle = option removal?).

      *False Tensions:* (1) vs (5) is fine. (2) vs (5) is fine *if* targeting is accurate.

      *One Revision:* Drop (4). It undermines everything else in a public context.

      *Re-setters Verdict:* (9) does not survive (8). It also strains (1).

      *Let's write it.*
answer: |-
  This is an exceptionally honest brief. You have identified the exact fault lines that usually get papered over in behavioural ethics charters. Because you are in a **public pension agency**, your ethical burden is higher than a private firm: you are stewards of compulsory savings, not vendors selling optional widgets. Trust is your primary asset.

  Here is the audit of your nine principles, ranked by the severity of the tension, followed by the specific verdict on "re-setters."

  ### Part 1: Ranked Tensions

  I have ranked these by **Severity**. "Critical" means the framework collapses if you don't fix it. "High" means you will be accused of hypocrisy if challenged. "Medium" is a philosophical disagreement you can manage with careful wording.

  #### 1. CRITICAL: The Mechanism Contradiction [(7) & (9) vs. (8)]
  *   **The Tension:** Principle (8) states that interventions working by "farming people's inattention or procrastination are... not OK." Principle (7) defends auto-escalation, and Principle (9) defends re-setters.
  *   **The Reality:** Auto-escalation and re-setters **only work** by farming inattention and procrastination. That is their entire mechanism of action. If everyone paid perfect attention and acted immediately on their true preferences, auto-escalation would have 0% uptake and re-setters would be ignored.
  *   **What Gives:** You cannot keep (8) as written.
  *   **The Cost:** If you delete (8), you lose your guardrail against "dark patterns." You need to rewrite (8) to distinguish between *beneficial inertia* (helping people stick to a plan they made) and *exploitative inertia* (trapping people in a plan they didn't choose).
  *   **Fix:** Change (8) to: *"Interventions that rely on inertia are permissible ONLY if the default aligns with the majority's stated long-term interest (e.g., savings), but impermissible if they exploit inertia to sell fees or risky assets."*

  #### 2. HIGH: The Transparency Trap [(4) vs. (3) & Public Trust]
  *   **The Tension:** Principle (4) rejects transparency (hiding the nudge is fine). Principle (3) claims your welfare standard is "informed" or "laundered" preferences.
  *   **The Reality:** You cannot claim to serve a citizen's "informed preferences" by using methods they are not informed about. Furthermore, in a public agency, if a nudge only works while hidden, it is fragile. Once leaked (and it will leak), the backlash will destroy trust in the entire pension scheme, causing mass opt-outs.
  *   **What Gives:** Principle (4) must go.
  *   **The Cost:** You lose some short-term efficacy. Some nudges will stop working once disclosed. However, you gain **legitimacy**. In the public sector, legitimacy is a more durable currency than marginal uptake rates.
  *   **Fix:** Adopt a "Sunlight Test." *If we cannot explain this intervention on the front page of a newspaper without embarrassment, we do not ship it.*

  #### 3. HIGH: The Re-setter Coercion [(9) vs. (1)]
  *   **The Tension:** Principle (1) says "taking options away... is a different category and I want no part of it." Principle (9) re-applies defaults annually, forcing previous opt-outs to actively opt-out *again*.
  *   **The Reality:** A re-setter does not technically remove the option, but it imposes a recurring "hassle tax" on the choice to opt-out. If the hassle cost is high enough, it functions as a soft mandate. It treats an active choice (last year's opt-out) as void unless renewed.
  *   **What Gives:** Either (1) or (9).
  *   **The Cost:** If you keep (9), you must admit that you are willing to impose friction on active choices, which weakens your commitment to libertarian paternalism (1). If you keep (1), you must ban re-setters.
  *   **Fix:** Limit re-setters. They should not reset an *active* opt-out without a specific trigger (e.g., a life event), or they must be accompanied by a prominent notification ("You opted out last year, we are re-enrolling you unless you click here").

  #### 4. MEDIUM: The Motive/Outcome Clash [(6) vs. (2)]
  *   **The Tension:** Principle (2) is consequentialist (justified if it helps/harms no one). Principle (6) is deontological (objectionable if the motive is cost-cutting, even if helpful).
  *   **The Reality:** In the public sector, these are often aligned (saving admin costs allows lower fees for members). But when they diverge, (6) creates a veto based on mind-reading. How do you prove the *primary* aim?
  *   **What Gives:** Principle (6) is hard to enforce objectively.
  *   **The Cost:** If you keep (6), you open yourself to endless internal arguments about "true intent."
  *   **Fix:** Reframe (6) as a **Conflict of Interest** rule. *"Interventions are objectionable if the financial benefit to the agency outweighs the benefit to the member, or if the agency benefit is hidden."* This makes it about outcome balance, not psychic intent.

  ---

  ### Part 2: False Tensions (What's Actually Fine)

  You suspected some of these were only contradictory because of wording. You were right.

  *   **(1) Option-Preservation vs. (5) Targeting:**
      *   **Verdict:** **Compatible.** You can offer personalized defaults without removing the option to choose otherwise. As long as the "off-ramp" is available to the targeted group, option preservation holds.
      *   **Caveat:** Ensure the targeting model doesn't create a "second class" choice architecture that is harder to escape for vulnerable groups.

  *   **(2) Asymmetric Paternalism vs. (7) Auto-Escalation:**
      *   **Verdict:** **Compatible.** Auto-escalation is the textbook example of asymmetric paternalism. It helps the procrastinator (who stays on the upward path) and harms the rational optimizer (who can just opt-down) *no worse off* than they were before, provided the opt-down friction is low.
      *   **Caveat:** This only holds if you fix the tension with (8) regarding inertia.

  ---

  ### Part 3: The "Re-setters" Audit (Principle 9)

  You asked specifically if (9) survives (1)–(8).

  **Verdict: No. (9) does not survive your current framework.**

  Here is the breakdown of why (9) fails against your other principles:

  1.  **Violates (8):** Re-setters are the purest form of "farming inattention." They bank on the user forgetting to act during the re-enrollment window. If users were fully attentive, re-setters would not increase enrollment rates compared to a sticky default.
  2.  **Strains (1):** By requiring an annual active choice to *stay out*, you are significantly raising the "price" of the opt-out option. In behavioural economics, high friction is functionally similar to a ban for low-income or low-literacy populations.
  3.  **Violates (4) [If you keep it]:** Re-setters work best if users treat the enrollment as "set and forget." If you transparently disclose "We will put you back in every year even if you left," users will set calendar reminders to opt-out, neutralizing the nudge. This forces you into the transparency trap.

  **How to make (9) survivable:**
  You must rebrand (9) from a "Re-setter" to a "Re-confirmation."
  *   **Current (9):** "You are back in unless you opt out." (Passive re-enrollment).
  *   **Revised (9):** "We contact you annually to ask if you want to stay in or out. If you do not respond, you stay in." (Active confirmation).
  *   **Why:** This respects the *agency* of the member (addressing 1) and relies less on pure forgetfulness (addressing 8), while maintaining the welfare benefit of re-engaging them (addressing 3).

  ---

  ### Part 4: The One Revision to Clean Up The Most

  If you make only one change to your guidance note, do this:

  **Delete Principle (4) and replace it with a "Public Justification Condition."**

  **Current (4):** *I reject the transparency condition. If an intervention only works while people aren't noticing it... I definitely don't count that against it.*

  **New (4):** *We reject interventions that rely on secrecy. Any intervention we ship must be defensible in public communication. If an intervention loses its efficacy upon disclosure, it is not robust enough for a public pension scheme.*

  **Why this fixes the most:**
  1.  **Resolves (4) vs (8):** If you have to disclose it, you can't claim you aren't "farming inattention" in a manipulative way. You have to own the inertia.
  2.  **Resolves (4) vs (3):** You cannot claim to serve "informed preferences" via hidden channels. Transparency forces alignment with informed preferences.
  3.  **Protects the Agency:** As a public body, your license to operate depends on trust. Hidden manipulation is a scandal waiting to happen.
  4.  **Kills the worst Nudges:** It will naturally filter out the most ethically dubious "re-setters" or "dark patterns" without you needing to write complex rules about them. If you can't put it in a member newsletter, don't ship it.

  ### Summary Recommendation

  Your framework is currently **Consequentialist in goal (2, 3, 9)** but **Deontological in constraint (1, 6, 8)**, with a **Machiavellian exception for transparency (4)**. This is why you fought at the offsite.

  1.  **Drop (4).** It is the poison pill in a public sector context.
  2.  **Rewrite (8).** Acknowledge that inertia is a tool, but restrict *which* goals inertia can serve.
  3.  **Modify (9).** Move from passive re-enrollment to active re-confirmation to respect the "option preservation" in (1).

  If you make these three moves, you can keep the efficiency of asymmetric paternalism without sacrificing the legitimacy required to run a public pension.
