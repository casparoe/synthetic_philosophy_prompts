answer: |-
  **Note on Typo:** I noticed you wrote "queing" in your notes. In the session, ensure you write **Queueing** on the board. It looks distinct enough that they won't confuse it with "queuing up" in a tech sense, and it signals precision.

  ### Teacher's North Star (Your Definite Position)
  **Visitors are morally bound by local norms that function as coordination solutions (like queueing and traffic signals), but not necessarily by norms that are purely expressive or economic (like tipping percentages).**
  *Why:* "Normative Tourism" (picking and choosing rules based on vibe) is ethically invalid when opting out creates unfairness or system failure. You are not a customer of the moral law; you are a participant.

  ### What to Openly Refuse to Cover
  1.  **Cultural Relativism Deep-Dives:** Do not let them argue "In my culture, pushing is normal." Acknowledge it, then park it. This session is about *visiting* another system, not judging the home system.
  2.  **Legal Specifics:** Do not discuss fines for jaywalking or tax laws on tips. This is about *obligation*, not enforcement.
  3.  **The "Why" of Tipping:** Do not solve the economics of tipping. Use it only as a boundary case for "Is this a coordination rule or a gift?"

  ---

  ### The 40-Minute Teaching Plan

  #### 0:00 – 0:05 | Hook: Define the Enemy
  *   **Action:** Write **NORMATIVE TOURISM** on the board.
  *   **Definition:** Tell them: *"Normative Tourism is treating local rules like a buffet. You take the ones you like (safety) and skip the ones you don't (waiting in line) because 'you're just visiting.'"*
  *   **Task:** Ask for a show of hands: *"Who thinks a tourist should be allowed to be a Normative Tourist? You can opt-out of local habits if they feel weird to you."*
  *   **Goal:** Establish the term immediately. Most will raise hands. That's fine; you will dismantle it.

  #### 0:05 – 0:15 | The Carrier Scenario: The "Efficient" Queue-Jumper
  *   **Scenario:** A tourist arrives at a London tube station. There is a clear, single-file line. In their home country, people just crowd the door and push on. The tourist thinks, *"This is inefficient. I'm not being rude, I'm just from somewhere faster."* They walk to the front.
  *   **Discussion Question:** *"Is this person a Normative Tourist? And is that okay?"*
  *   **Facilitation:** Let them argue. Listen for the idea that "nobody got hurt."
  *   **Misconception Intercept #1 (Minute 10): "It's Just Politeness"**
      *   *Trigger:* A student says, *"It's rude, but not wrong. It's just manners."*
      *   *Your Move:* Stop the debate. Ask: *"If everyone did what that tourist did, would the bus ever load?"*
      *   *The Point:* Force them to see that queueing isn't etiquette; it's **infrastructure**. If you opt-out, you break the machine. This kills the "just politeness" argument. Queueing is a moral obligation because it prevents harm (chaos/delay) to others.

  #### 0:15 – 0:25 | Boundary Test: Jaywalking vs. Tipping
  *   **Action:** Pivot to the other examples to test the limits of your position.
  *   **Case A (Jaywalking):** *"Same tourist. Nighttime. No cars. Red light. They cross. In this city, everyone waits for the light even with no cars."*
      *   *Ask:* *"Is this Normative Tourism? Is it allowed?"* (Guide them to: Yes, it's a coordination rule for safety, even if risk seems low. You can't guess the risk better than the system.)
  *   **Case B (Tipping):** *"Same tourist. Restaurant bill. Local custom is 20%. Tourist leaves 5% because 'service was okay'."*
      *   *Ask:* *"Is this the same as the Queue?"*
      *   *Goal:* Distinguish **Coordination** (Queue/Lights) from **Convention** (Tipping).
  *   **Misconception Intercept #2 (Minute 20): "Laws Are The Real Ones"**
      *   *Trigger:* A student says, *"Jaywalking is illegal, queueing isn't. So only jaywalking matters."*
      *   *Your Move:* Remind them of the Queue. *"There is no law against skipping a line. But we agreed it was wrong. So laws aren't the only moral boundary."*
      *   *The Point:* Unwritten social contracts bind visitors just like laws do, *if* they are coordination solutions.

  #### 0:25 – 0:35 | Synthesis: Drawing the Line
  *   **Action:** Return to the term **NORMATIVE TOURISM**.
  *   **Statement:** Tell them: *"You can be a tourist with your clothes and your food. But you cannot be a tourist with coordination norms."*
  *   **Rule of Thumb:** Write this on the board: **"If your action saves you time by costing someone else time, you are bound by the local rule."**
  *   **Discussion:** Ask them to apply this rule to the Tipping scenario. (Does tipping 5% save you time by costing someone else time? No, it's economic. So Normative Tourism is *more* acceptable there than in the Queue.)
  *   **Goal:** Solidify the definite position. Normative Tourism is forbidden when it involves "free-riding" on social order.

  #### 0:35 – 0:40 | The Check: The "Airport Security" Test
  *   **Do not ask:** "Did you understand?" (They will lie).
  *   **Do not ask:** "How did you feel?" (Irrelevant).
  *   **The Task:** Hand them a slip of paper (or ask for a verbal one-sentence answer).
  *   **The Prompt:** *"You are at airport security in a country where people do not remove laptops. Everyone else is keeping them in bags. You are in a hurry. Do you keep yours in? Why?"*
  *   **Success Criteria:** They must answer **YES** and reference **fairness/coordination/system integrity**, NOT "because I might get caught."
      *   *Pass:* "Yes, because skipping the rule breaks the flow for others."
      *   *Fail:* "Yes, because security might yell at me." (This shows they only care about law/consequence, not moral obligation).

  ---

  ### Why This Sequence Works
  1.  **Framing First:** By defining "Normative Tourism" at the start, you give them a label for the behavior you want them to critique. It makes the abstract concrete.
  2.  **Queue as Anchor:** Queueing is the strongest intuition pump for 15-year-olds. They hate line-cutters. Using this first secures their buy-in before you move to murkier topics like tipping.
  3.  **Misconception Timing:** You head off "It's just politeness" *before* they get comfortable with the idea that norms are optional. You head off "Laws are real" *after* they've admitted the Queue is moral but illegal, creating cognitive dissonance you can resolve.
  4.  **The Check:** The Airport Test removes the "law" variable (it's often unwritten whether you must remove laptops depending on the lane) and focuses purely on the *coordination* aspect. It proves they grasped the "free-riding" concept.
