answer: |-
  You are not mangling it at all. In fact, you are instinctively applying a systems-analysis approach to moral psychology, which is exactly where the most interesting work is happening right now. You've identified a tension between **functionalism** (what does this emotion *do* for the system?) and **normativity** (what *should* we feel?).

  Your intuition that you are treating moral emotions like "tunable physical constants" is the precise place to look for the error. In physics, you can often vary a parameter (like temperature) while holding the system constant. In social systems, the "parameters" are **coupled** to the structure of the system itself. You cannot dial up guilt without changing the social topology that makes guilt possible.

  Here is the untangling, broken down by the specific "physics errors" in the model and the evolutionary reality of shame.

  ### 1. The "Thermostat" Fallacy (Endogeneity vs. Exogeneity)
  You asked: *Why wouldn't every culture just dial up guilt and dial down shame?*

  **The Error:** You are treating guilt and shame as **exogenous** control variables (like a thermostat setting). In reality, they are **endogenous** emergent properties (like pressure or temperature in a gas).

  *   **Shame** is the enforcement mechanism of **high-visibility, small-scale networks.** If everyone knows everyone (a village, a tribe), your reputation is your credit score. Shame is cheap, fast, and requires no internal conscience, only an awareness of the "gaze" of the other.
  *   **Guilt** is the enforcement mechanism of **low-visibility, large-scale networks.** If you are anonymous in a city, no one sees you steal. Shame doesn't work because there is no audience. You need an *internalized* audience (a conscience) to police behavior.

  **The Constraint:** A culture cannot simply "choose" guilt over shame without industrializing, urbanizing, and increasing anonymity. If you try to run a "high guilt" system in a small tribal band, it's inefficient over-engineering. If you try to run a "high shame" system in a massive metropolis, it fails because anonymity breaks the feedback loop.

  So, the Japan/Industrialization example isn't about a cultural choice; it's about a **phase transition**. As society moved from agrarian/feudal (high visibility) to industrial (high anonymity), the emotional architecture *had* to shift to maintain order.

  ### 2. The Evolutionary Stable Strategy (Your Hypothesis was Right)
  You asked: *Does shame have some hidden cooperative function... that makes it irreplaceable?*

  **Yes.** You hit the nail on the head. From an evolutionary game theory perspective, shame is a **low-cost signaling mechanism.**

  *   **Guilt is cognitively expensive.** It requires theory of mind, complex internal narrative, and the ability to simulate future outcomes ("I will feel bad if I do this"). It takes energy and development to build a conscience.
  *   **Shame is cognitively cheap.** It is a visceral reaction to social exclusion. "They are looking at me with disgust; I must stop."

  In small groups (the environment of evolutionary adaptedness), shame is the optimal strategy. It prevents free-riding without requiring a police force or complex internal theology. It acts as a **deterrent** and a **signal of submission.** When a group member shows shame, they are signaling: *"I acknowledge the norm, I acknowledge my violation, and I submit to the group's authority."* This allows the group to reintegrate the member without violence.

  If you "dial down" shame too much in a small group, you lose your immune system against free-riders. If you "dial up" guilt too much, you waste cognitive resources.

  ### 3. The Functional Difference: Repair vs. Withdrawal
  You noted: *Guilt fixes the problem, shame just makes people hide or disappear.*

  This is the standard psychological distinction (often attributed to Helen Block Lewis), but it needs nuance.

  *   **Guilt:** "I *did* something bad." -> Focus on the **act**. -> Motivation: **Reparation.** (Energy flows outward to fix the damage).
  *   **Shame:** "I *am* something bad." -> Focus on the **self**. -> Motivation: **Concealment or Aggression.** (Energy flows inward to hide, or outward to destroy the witness).

  **However,** shame has a function guilt does not: **Norm Enforcement via Deterrence.**
  Guilt is private. If I feel guilty but no one knows, the social norm isn't publicly reinforced. Shame is public. The *spectacle* of shame teaches the *rest of the group* not to violate the norm. It is a public good.

  If a society relies *only* on guilt, it risks becoming a society of secret sinners who feel bad but don't change, because there is no social cost. If a society relies *only* on shame, it risks becoming a society of narcissists who never take responsibility but instead lash out to protect their image (a phenomenon currently being studied in relation to social media).

  ### 4. The Philosophical Debate: Engineering vs. Ontology
  You asked: *Is the debate about whether cultures can engineer this, or about whether shame is irreplaceable?*

  It is actually a third option: **The debate is about Moral Ontology (what kind of beings are we?).**

  *   **The Confucian View (Shame-adjacent):** We are fundamentally relational. We *are* our roles in society. Therefore, shame is not a bug; it is a feature. It aligns the self with the social order. To feel no shame is to be inhuman.
  *   **The Kantian/Christian View (Guilt-adjacent):** We are fundamentally individual agents with free will. Morality comes from within (Reason or God), not from the crowd. Therefore, shame is inferior because it relies on *what others think*, not *what is right*.

  The "error" in treating them as tunable constants is that tuning them changes the definition of the **Self**.
  *   Tune toward Shame -> The Self is a node in a network.
  *   Tune toward Guilt -> The Self is a sovereign container.

  You cannot have a sovereign individual *and* a tight-knit tribal cohesion simultaneously. They are mutually exclusive social technologies.

  ### Summary for the Physicist
  1.  **Variables are Coupled:** You cannot tune guilt/shame independently of social structure (anonymity vs. visibility). They are order parameters, not control parameters.
  2.  **Energy Costs:** Shame is low-energy enforcement for small systems. Guilt is high-energy enforcement for large systems.
  3.  **Stability:** Shame is an Evolutionary Stable Strategy for small groups (Dunbar's number). It prevents free-riding without police.
  4.  **The Trade-off:** A "Guilt Society" gains individual liberty and reparation but loses social cohesion and deterrence. A "Shame Society" gains cohesion and deterrence but loses individual liberty and risks narcissistic rage.

  You aren't mangling the philosophy; you've just identified that moral emotions are **technologies of social coordination.** The reason cultures don't just "maximize guilt" is that it's not the optimal solution for every boundary condition.
