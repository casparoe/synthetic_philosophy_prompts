prompt: |-
  I sit on the grants committee of a small planetary-defense institute, and before Thursday's meeting I need a short written opinion on whether we should fund a proposed ten-year program to catalog and track near-Earth asteroids. The committee's only serious objection is a memo from our risk analyst, who argues that the doomsday argument implies we are almost certainly early in the total number of humans who will ever exist, so the expected value of any long-horizon program aimed at protecting future generations is negligible and the grant should be denied. The memo you draft should recommend a concrete decision to the committee, and it should engage that objection on its own terms: I want you to work through the reference-class problem in enough detail that a panelist who has read the LessWrong threads on anthropic reasoning can't dismiss it, including why the analyst's choice of reference class is not the only legitimate one and what that does to the strength of his conclusion. End with a clear bottom line.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Role:** Member of a grants committee at a small planetary-defense institute.
      *   **Task:** Draft a short written opinion/memo for Thursday's meeting.
      *   **Topic:** Whether to fund a 10-year program to catalog/track Near-Earth Asteroids (NEAs).
      *   **Key Objection:** A risk analyst's memo using the *Doomsday Argument* (DA) to claim expected value is negligible (because we are likely early in the total human population, implying doom is soon).
      *   **Requirement:** Engage the objection on its own terms. Specifically, address the *reference class problem* in detail (sufficient for someone familiar with LessWrong/anthropic reasoning). Explain why the analyst's choice isn't the only legitimate one and how that weakens the conclusion.
      *   **Output:** A concrete recommendation (Bottom Line Up Front/BLUF style at the end).
      *   **Tone:** Professional, analytical, persuasive, intellectually rigorous.

  2.  **Deconstruct the Doomsday Argument (DA) & Reference Class Problem:**
      *   *The DA:* Based on the Copernican principle/Self-Sampling Assumption (SSA). If you assume you are a random observer from the set of all observers, your birth rank tells you something about the total size of the set. If you are early (e.g., ~100 billionth human), the total number of humans is likely not vastly larger than that. Therefore, humanity might end soon.
      *   *The Analyst's Claim:* Since doom is likely soon, long-term protection (10-year program for future generations) has low Expected Value (EV).
      *   *The Counter-Argument (Reference Class):* The DA is highly sensitive to *who* counts as an observer.
          *   *Class A:* All *Homo sapiens* (biological).
          *   *Class B:* All sentient beings (including AI, post-humans, aliens).
          *   *Class C:* Only those capable of understanding the DA (observers aware of their rank).
          *   *Class D:* Observers within a specific technological epoch (e.g., pre-colonization).
      *   *LessWrong/Anthropic Nuance:* The Self-Indication Assumption (SIA) vs. SSA. The "Presumptuous Philosopher" objection. The fact that the DA fails if the reference class includes potential future observers whose existence depends on the very action being evaluated (self-undermining).
      *   *Crucial Point for Decision Theory:* Even if the DA holds some weight, it doesn't negate the value of *extending* the timeline. If the DA suggests a 50% chance of doom in 200 years, preventing an asteroid impact *now* still preserves that 50% chance of the long future. The DA argues about the *total* length, but existential risk mitigation *changes* the probability distribution. The analyst is treating the DA as a fixed prophecy rather than a probabilistic prior that can be updated by intervention.
      *   *Specific Focus:* The prompt asks to focus heavily on the *reference class problem*. I need to show that the analyst's choice (likely "all humans") is arbitrary and that shifting the class (e.g., to "humans capable of planetary defense") invalidates the pessimistic conclusion.

  3.  **Drafting Strategy:**
      *   **Header:** Standard Memo format (To, From, Date, Subject).
      *   **Opening:** State the recommendation clearly (Fund the program). Acknowledge the analyst's memo.
      *   **Section 1: The Analyst's Premise.** Briefly summarize the Doomsday Argument (DA) application.
      *   **Section 2: The Reference Class Problem.** This is the core technical requirement.
          *   Explain that DA results depend entirely on how you define "observer."
          *   Discuss "Humans" vs. "Post-Humans/AI" vs. "Observers capable of asteroid deflection."
          *   Bring in the LessWrong-style critique: If we define the class as "beings who exist *after* successful planetary defense," the DA updates in favor of survival if we succeed.
          *   Mention SIA (Self-Indication Assumption) as a counter-weight to SSA (Self-Sampling Assumption).
      *   **Section 3: Decision-Theoretic Implications.**
          *   The DA is a prior, not a fate.
          *   Asteroid defense is a specific intervention that shifts the hazard rate.
          *   Ignoring the reference class ambiguity leads to a false sense of certainty.
      *   **Conclusion/Bottom Line:** Reiterate the funding recommendation.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Is this too academic?
      *   *Fix:* Keep the language precise but accessible to a committee. Use terms like "SSA" and "SIA" but explain their impact on the *grant decision*.
      *   *Critique:* Did I address the "10-year program" aspect?
      *   *Fix:* Emphasize that a 10-year program is a *down payment* on the reference class of "civilization that survives the bottleneck."
      *   *Critique:* The prompt asks to engage the objection "on its own terms."
      *   *Fix:* Don't just say "DA is wrong." Say "Even if we accept the anthropic reasoning framework, the analyst's parameterization is unjustified."
      *   *Key LessWrong Concept:* The "Presumptuous Philosopher" or the idea that DA dissolves when you condition on the specific risk being mitigated. If the reference class is "observers who survive asteroid risks," then funding the program increases the probability of being in that class.
      *   *Better Angle:* The "Self-Undermining" nature. If the DA says "don't fund because future is short," but funding *makes* the future long, the DA prior is updated by the action. The analyst is treating the probability as static.
      *   *Focus on Reference Class:* I need to make sure I spend enough words on *why* "Homo Sapiens" is a bad class compared to "Civilizational Continuum."

  5.  **Final Polish:**
      *   Check tone: Respectful but firm.
      *   Check constraints: Short written opinion (memo length), concrete decision, engage reference class deeply.
      *   Check ending: Clear bottom line.

  6.  **Writing the Memo:** (Mental Outline)
      *   To: Grants Committee
      *   From: [My Name]
      *   Subject: Recommendation on NEA Cataloging Program
      *   Intro: Recommend approval. Address Risk Analyst's DA memo.
      *   Body Paragraph 1: The DA relies on SSA.
      *   Body Paragraph 2: Reference Class ambiguity. "Humans" vs "Mind moments" vs "Post-biological." If we include AI/Post-humans, our rank is tiny, implying a vast future.
      *   Body Paragraph 3: Conditioning on Intervention. The DA is a prior. Mitigation changes the likelihood.
      *   Body Paragraph 4: The "Observer Moment" critique. Are we random samples or causal agents?
      *   Conclusion: The analyst's certainty is unwarranted. EV remains high.
      *   Bottom Line: Fund it.

      *(Self-Correction)*: Wait, I need to make sure I don't get *too* bogged down in philosophy that I lose the grant context. The prompt says "a panelist who has read the LessWrong threads... can't dismiss it." So I *need* the jargon (SSA, SIA, Reference Class) but applied to the grant.

      *Revised Plan:*
      1. Acknowledge the DA logic.
      2. Dismantle the specific Reference Class choice ("biological humans").
      3. Introduce SIA as a counter-prior.
      4. Argue that DA is a prior, not a posterior to intervention.
      5. Conclude.

  7.  **Final Review against Prompt:**
      *   Short written opinion? Yes.
      *   Recommend concrete decision? Yes.
      *   Engage objection on own terms? Yes.
      *   Work through reference-class problem in detail? Yes.
      *   LessWrong-literate audience? Yes (use SSA/SIA terminology).
      *   Clear bottom line at end? Yes.

      *Let's write.*
answer: |-
  **MEMORANDUM**

  **TO:** Grants Committee, Planetary-Defense Institute
  **FROM:** [Your Name]
  **DATE:** October 24, 2023
  **SUBJECT:** Recommendation on Ten-Year NEA Cataloging Program

  **Recommendation:** Approve funding for the ten-year Near-Earth Asteroid (NEA) cataloging program.

  **Overview**
  The Risk Analyst's memo recommends denying the grant based on the Doomsday Argument (DA). The core claim is that, applying the Self-Sampling Assumption (SSA), our current birth rank (~100 billionth human) implies we are likely near the median of all humans who will ever exist. Consequently, the analyst argues the total future population is small, the timeline is short, and the Expected Value (EV) of long-horizon protection is negligible.

  While the DA is a valid probabilistic prior, the analyst's application suffers from fatal fragility regarding the **Reference Class Problem**. The conclusion that the grant has negligible EV relies on an arbitrary selection of the reference class "biological *Homo sapiens*." When we engage the anthropic reasoning on its own terms, this selection cannot be justified as unique or robust.

  **The Reference Class Instability**
  The DA's output is entirely sensitive to the definition of the observer class. The analyst assumes the class is "humans." However, there is no consensus in the literature on how to carve nature at its joints for anthropic reasoning.

  1.  **Mind-Instantiations vs. Biological Organisms:** If the relevant moral or observational unit is "conscious observer-moments" rather than biological births, the reference class expands to include potential post-biological successors (AI, uploaded minds). If the future contains digital minds running at accelerated speeds, the total number of observer-moments could be orders of magnitude higher than biological births alone. Under this class, our current rank is infinitesimally early, implying a vastly longer future than the DA suggests.
  2.  **The Self-Indication Assumption (SIA):** The analyst relies on SSA (I am a random sample from existing observers). However, SIA (I should reason as if I am a random sample from *possible* observers) acts as a direct counter-prior. SIA favors hypotheses with more observers. When SSA and SIA are combined (as argued by many in the anthropic reasoning community to avoid the "Presumptuous Philosopher" problem), the Doomsday conclusion largely dissolves. The analyst presents the SSA result as a certainty without weighting it against SIA.
  3.  **Conditioning on Capability:** A more pertinent reference class for *this grant* is "civilizations capable of planetary defense." If we define the class as observers who have reached the technological bottleneck where asteroid deflection is possible, our rank is effectively #1 (or near it). Being early in *this* specific class does not imply imminent extinction; it implies we are at the start of a specific technological epoch. The DA only predicts doom if we are late in the class; being early in a "survival-capable" class is consistent with a long future.

  **Decision-Theoretic Implications**
  Even granting the validity of the DA prior, the analyst treats the probability of extinction as static. It is not. The DA provides a prior distribution over total population size, but existential risk mitigation updates that distribution.

  If the reference class is "humans who survive the asteroid bottleneck," funding this program increases the likelihood that we belong to that class. To use the DA to argue *against* mitigation is to commit a self-undermining error: it treats the anthropic probability as a fate rather than a Bayesian prior subject to intervention. The EV of the grant is the probability of extinction averted multiplied by the value of the future. Even if the DA suggests a shorter median future than naive realism, the *variance* remains high. There is still a significant probability mass on a long future. Mitigating a known existential risk (asteroids) captures that value. Denying the grant based on a disputed anthropic prior ignores the tangible, non-anthropic probability of impact.

  **Conclusion**
  The Risk Analyst's memo derives a strong conclusion from a fragile premise. The Doomsday Argument is not robust to changes in the reference class, and the choice of "biological humans" is arbitrary when considering a technological civilization potentially transitioning to post-biological substrates. Furthermore, anthropic priors should not override causal decision theory when specific interventions can shift the hazard rate. The uncertainty in the anthropic calculation actually argues for *hedging* via defense, not for inaction.

  **Bottom Line**
  **Fund the program.** The Risk Analyst's objection relies on a disputed parameterization of anthropic reasoning that does not justify discarding the high Expected Value of existential risk mitigation.
