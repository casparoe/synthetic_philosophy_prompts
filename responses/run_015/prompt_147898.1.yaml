answer: |-
  There is no single established term, but the phenomenon is best characterized as **Extensional Desuetude**, defined as the dissolution of a normative practice caused by the erosion of shared epistemic criteria for identifying its instances rather than the rejection of its validity. This mechanism differs fundamentally from ordinary vagueness, axiological shifts, and interest-based accounts because it targets the *coordination conditions* required for a norm to function, rather than the norm's content, value, or payoff structure.

  Ordinary vagueness, such as H.L.A. Hart's "open texture," is a structural feature of language that allows for discretion without destroying the rule;Extensional Desuetude occurs only when that vagueness expands until it severs the link between the rule and its real-world triggers. In a functional norm, borderline cases are resolved by authority or convention; in this collapse, the community loses the common knowledge required to distinguish borderline cases from clear violations, rendering the rule operationally inert. Unlike Appiah's honor-based explanations, where the *value* of the practice declines (e.g., dueling no longer confers status), Extensional Desuetude assumes the value may remain intact but the *script* becomes unreadable. Participants may still value honor, but they can no longer agree on what counts as an insult warranting satisfaction, making the practice impossible to execute without risking social sanction for misapplication. Similarly, this diverges from Bernard Williams-style materialist accounts, where agents knowingly reject a norm because it conflicts with their interests; here, agents may wish to follow the norm but lack the epistemic grounding to identify *when* it applies.

  The boundaries of this phenomenon are defined by the requirement of **common knowledge of application**. It does not cover every ambiguous rule, only those where successful coordination depends on mutual certainty about what constitutes an instance of the practice. A private moral rule can be vague without collapsing, but a public social norm requires intersubjective agreement on its extension to sustain the equilibrium. This collapse is often accelerated by strategic exploitation, where actors weaponize the ambiguity to challenge the norm without appearing to violate it, thereby further degrading the shared criteria. Ultimately, this is a failure of the **Rule of Recognition** at a sociological level: the secondary rules that determine how primary rules are identified have dissolved, leaving the primary norm floating without an anchor to reality.
