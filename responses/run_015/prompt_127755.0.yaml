  # Joint Statement on the Status of Berkeley's Master Argument

  **Signed by:** The Transparency Defenders and The Modal-Separation Critics

  **Date:** October 26, 2023

  **Subject:** Adversarial Collaboration on the Master Argument for Idealism

  Following a period of adversarial collaboration, the undersigned camps hereby issue this joint statement regarding the logical structure, interpretive framing, and unresolved substantive disputes concerning George Berkeley's master argument for idealism. While we remain divided on the soundness of the argument, we agree on the parameters of the debate and the specific loci of our divergence.

  ## I. Agreed Claims

  We jointly affirm the following propositions as the common ground for our continued inquiry:

  1.  **Formal Inference Structure:** We agree that the argument under discussion proceeds via the following reconstruction:
      *   (P1) To conceive of a sensible object existing unperceived is to conceive of it as being conceived.
      *   (P2) To conceive of an object as being conceived is to conceive of it as perceived.
      *   (C) Therefore, it is impossible to conceive of a sensible object existing unperceived.
      *   (Final Conclusion) Therefore, sensible objects cannot exist unperceived (*esse est percipi*).
      Both camps accept this reconstruction as the charitable standard form of Berkeley's reasoning.

  2.  **Act/Object Distinction:** We accept the formal distinction between the *act* of conception (the mental operation performed by the subject) and the *object* of conception (that which is represented by the act). We disagree on the ontological implications of this distinction, but we agree that it is coherent to distinguish linguistically and phenomenologically between the thinking and the thought-about.

  3.  **The Idealism Conditional:** We agree that if the master argument is sound—specifically, if the impossibility of conceiving an unperceived object entails the impossibility of an unperceived object existing—then metaphysical idealism follows necessarily. There is no gap between the successful establishment of the argument's conclusion and the truth of idealism.

  4.  **Representational Closure Framing:** We agree that the central dispute is best framed in terms of **Representational Closure**. We define this thesis as follows: *The representational content of a conception cannot include properties that are inaccessible to the representational act itself.*
      *   **Shared Interpretation:** Both camps accept that this framing captures what is genuinely at stake. We agree that the debate turns on whether the "inaccessibility" of mind-independence to the representational act is a limit on what can *exist* (Transparency Defenders) or merely a limit on what can be *accessed* by the conceiver (Modal-Separation Critics).

  ## II. Table of Disagreements

  The following table delineates the precise points of divergence. The wording in each cell reflects the specific formulation accepted by the respective camp.

  | Issue | Transparency Defenders (TD) | Modal-Separation Critics (MSC) |
  | :--- | :--- | :--- |
  | **(i) Nature of Representational Closure** | Representational closure is a **metaphysical constraint** on objects. Because the content of conception cannot exceed the act, the object constituted by that content cannot possess properties (like mind-independence) that the act does not supply. | Representational closure is an **epistemic constraint** on conceivers. It limits what a subject can verify or visualize, but it does not dictate the ontological constitution of the object represented by the act. |
  | **(ii) The Modal Inference** | The move from "I cannot conceive X without conceiving my conception of X" to "X cannot exist without being conceived" **does not commit a modal fallacy**. The necessity of the conceiving condition transfers to the object because the object is ontologically dependent on the conception. | The move from "I cannot conceive X without conceiving my conception of X" to "X cannot exist without being conceived" **commits a modal fallacy**. It conflates the *de dicto* necessity of our conceptual access with the *de re* modal status of the object itself. |
  | **(iii) The Tree/Color Analogy** | The analogy between conceiving an unperceived tree and conceiving a color that is never visually experienced **supports the argument**. Just as a color cannot be conceived without a visualizing act, a tree cannot be conceived without a mental act; in both cases, the object is inseparable from the mode of access. | The analogy between conceiving an unperceived tree and conceiving a color that is never visually experienced **undermines the argument**. The necessity of visualizing a color pertains to secondary qualities and phenomenology, not to the existence conditions of the substrate bearing those qualities. |

  ## III. Cruxes for Future Resolution

  We have identified two sub-questions (cruxes) where resolving the empirical or conceptual data would significantly shift the dialectical balance. We treat the distinctions of *thin versus thick conception* and *phenomenal residue* as shared analytical tools for these investigations.

  ### Crux 1: The Coherence of Thin Conception

  This crux concerns whether there is a coherent **thin conception** of an object that specifies its existence conditions independently of any **thick representational context** (i.e., without embedding the conception in a perceptual narrative or sensory simulation).

  *   **(a) Concrete Case:** The **Absolute Darkness Solid**. Both camps consider the case of a subject attempting to conceive of a geometric solid (e.g., a cube) persisting in a universe of absolute nothingness, excluding all light, observers, and tactile potentialities. The subject is instructed to posit the extension and shape without generating any visual imagery of the cube or the darkness surrounding it.
  *   **(b) Predictions:**
      *   **TD Prediction:** The attempt will fail. Subjects will inevitably revert to a thick conception, either by visualizing the cube in darkness (which is a visual experience) or by conceiving of the *proposition* that a cube exists (which is a linguistic act, not a conception of the object itself).
      *   **MSC Prediction:** The attempt will succeed. Subjects can posit the spatial coordinates and extensional properties via a thin, propositional attitude that does not rely on sensory simulation, thereby conceiving the object without embedding it in a perceptual narrative.
  *   **(c) Reasoning:**
      *   **TD Reasoning:** Representational closure dictates that any content accessible to the mind must be furnished by the mind's own activity. Since the mind's activity is inherently perceptual or quasi-perceptual, a "thin" positing is merely an empty label, not a genuine conception of the object's existence.
      *   **MSC Reasoning:** The act/object distinction allows the act to be mental while the content refers to non-mental conditions. A thin conception utilizes the cognitive capacity for abstraction, separating the existence condition (occupying space) from the mode of presentation (sensory imagery), proving the object is not constituted by the imagery.

  ### Crux 2: The Function of Phenomenal Residue

  This crux concerns whether **phenomenal residue**—the non-intentional qualitative character present in every act of conception—functions as a vehicle of information about the object or merely as an index of the act itself.

  *   **(a) Concrete Case:** The **Introspective Bracketing Task**. Subjects are asked to conceive of a red apple and then introspectively isolate the "feel" of the conceiving act from the "redness" of the apple content. They must determine if the qualitative character of the thought (the residue) resembles the object or merely accompanies it.
  *   **(b) Predictions:**
      *   **TD Prediction:** The residue proves the object is mental. The qualitative character of the conception is not merely a vehicle; it is the substance of the object as conceived. One cannot strip the residue away to find a non-mental core.
      *   **MSC Prediction:** The residue proves the conceiving is mental, but the object is distinct. The residue is an index of the act (the vehicle), while the intentional content (the red apple) points beyond the act. The presence of residue does not prove the object *is* the residue.
  *   **(c) Reasoning:**
      *   **TD Reasoning:** Under Representational Closure, properties inaccessible to the act cannot be in the content. Since the only qualities accessible in the conception are the qualitative features of the act itself (the residue), the object is constituted by these mental qualities.
      *   **MSC Reasoning:** The vehicle/content distinction remains robust. The phenomenal residue is a property of the *thinking*, not the *thought*. That the thinking feels a certain way does not entail that the object of the thinking shares that nature, any more than a transparent window being made of glass entails the landscape seen through it is made of glass.

  ## IV. Joint Assessment of Verbal Dispute

  In concluding this statement, we assess whether the disagreement over the phrase **mind-independent existence** reflects a substantive metaphysical split or a divergence in conceptual deployment.

  We agree that the dispute is not *merely* verbal, as it entails incompatible predictions regarding the possibility of the Absolute Darkness Solid and the ontological status of Phenomenal Residue. However, we acknowledge a significant verbal component exacerbates the metaphysical split. The Transparency Defenders deploy "independence" to mean *inconceivability without a mind*, whereas the Modal-Separation Critics deploy "independence" to mean *causal and ontological status regardless of conception*.

  Because both camps accept the Representational Closure framing, we recognize that the Transparency Defenders view the epistemic limit (inconceivability) as constitutive of the metaphysical limit (non-existence). The Modal-Separation Critics view the epistemic limit as merely descriptive of the subject's access. Consequently, while the term "mind-independent" is used by both, it functions as a placeholder for two different structural relations between conception and reality. Resolving the verbal divergence requires agreeing on whether the limits of representation are limits of the world (TD) or limits of the observer (MSC). Until the Cruxes above are resolved, we must treat the phrase as ambiguous between an epistemic constraint and an ontological claim.
