answer: |-
  This tree is designed to be read aloud or printed for your family. It avoids labels like "deontology" and instead asks about specific scenarios. There are 10 nodes total: 5 scenario questions (the branches) and 5 ethical positions (the leaves).

  Walk through the **Scenario Nodes** first. Where your siblings land on these determines which **Position Leaf** matches their view.

  ### The Scenario Nodes (The Branches)

  **Node 1: The Ventilator Switch**
  *Claim:* "Physically turning off a machine that is keeping Dad alive is morally worse than simply never turning it on in the first place."
  *   **Agree:** Physical action carries extra moral weight. (Go to Node 2)
  *   **Disagree:** The result (death) is the same, so the action doesn't matter. (Go to **Leaf B**)

  **Node 2: The Accidental Start**
  *Claim:* "If we started the ventilator by mistake yesterday, turning it off today is less blameworthy than turning off one we intentionally started last month."
  *   **Agree:** Interrupting a chain *we* started is worse than stopping a chain that was an accident. (Go to **Leaf C**)
  *   **Disagree:** It doesn't matter how the machine got there; once it's on, turning it off is the same act. (Go to Node 3)

  **Node 3: The Pain Meds**
  *Claim:* "Giving a dose of morphine that relieves pain but is known to stop breathing is closer to 'killing' than 'allowing to die'."
  *   **Agree:** Foreseeing the death makes it an act of killing. (Go to **Leaf A**)
  *   **Disagree:** The intent was relief; the death is a side effect, not an act. (Go to Node 4)

  **Node 4: The ICU Bed**
  *Claim:* "If we give the last ICU bed to Patient A, knowing Patient B will die without it, we are morally responsible for Patient B's death."
  *   **Agree:** Allocating resources is an active choice that causes the other's death. (Go to Node 5)
  *   **Disagree:** Patient B dies of their illness; we just helped Patient A. That is an omission regarding B. (Go to **Leaf D**)

  **Node 5: The Committee Vote**
  *Claim:* "If a triage committee formally votes to deny care to save resources, that signed decision is an 'act' of killing, not an 'omission'."
  *   **Agree:** Formal coordination turns an omission into an act. (Go to **Leaf D** or **Leaf E**)
  *   **Disagree:** Even a formal vote is just deciding not to intervene; nature still takes the course. (Go to **Leaf A**)

  ***

  ### The Position Leaves (The Outcomes)

  **Leaf A: Standard Act/Omission Doctrine**
  *   **Path:** Node 1 (Agree) → Node 3 (Agree) → Node 5 (Disagree).
  *   **The View:** Physical acts are worse than omissions. However, institutional decisions (committees) are still just "deciding not to act."
  *   **Family Translation:** "Pulling the plug is killing. But deciding not to start it, or a committee saying 'no bed,' is letting nature happen."
  *   **Note:** This is the most common "default" view but often breaks down at Node 5.

  **Leaf B: Flat Consequentialist Denial**
  *   **Path:** Node 1 (Disagree).
  *   **The View:** The distinction between doing and allowing is an illusion. If Dad dies, we are responsible regardless of whether we touched a switch.
  *   **Family Translation:** "If we decide he dies, we killed him. Whether we used a switch or a signature doesn't change the body count."
  *   **Note:** Hard to hear, but logically consistent.

  **Leaf C: The Causal-Break View**
  *   **Path:** Node 1 (Agree) → Node 2 (Agree).
  *   **The View:** Morality depends on whether you are interrupting an existing causal chain you created.
  *   **Family Translation:** "If we started the machine, we own it. If we didn't, or if it was a mistake, turning it off is just cleaning up a mess, not killing."
  *   **Note:** This resolves the "accidental start" anxiety but struggles with long-term care.

  **Leaf D: Institutional Role View**
  *   **Path:** Node 4 (Disagree) → Node 5 (Agree).
  *   **The View:** Bedside doctors "act," but committees "allocate." The moral weight shifts based on who decides and why.
  *   **Family Translation:** "A doctor turning off a vent is killing. A committee saving resources for the greater good is managing scarcity. The role changes the act."
  *   **Note:** This is where most hospital policies actually live, even if it feels inconsistent.

  **Leaf E: The "Empty" Quadrant (Bedside Causalist / Committee Consequentialist)**
  *   **Path:** Node 2 (Agree) + Node 5 (Agree).
  *   **The View:** You believe causal chains matter at the bedside (Node 2), but formal coordination *also* creates moral responsibility at the committee level (Node 5).
  *   **Family Translation:** "Turning off a vent we started is killing. But a committee voting to deny a bed is *also* killing."
  *   **Status:** **Rare/Unexplored.** Most people pick one lane. Holding both means you see "killing" everywhere—both in individual acts and systemic choices. It is not incoherent, but it is emotionally exhausting. It implies you cannot wash your hands of death in *any* context.

  ***

  ### Flags for Your Conversation

  **1. The Indistinguishable Pair (Leaf B vs. Leaf D)**
  In practice, **Flat Consequentialism (B)** and **Institutional Role (D)** often recommend the exact same action (e.g., "Don't pull the plug" or "Allocate the bed").
  *   **The Trap:** One sibling might say "It's all the same" (B) and another says "It depends on the role" (D), but they vote the same way. Don't fight over the *reason* if you agree on the *choice*.
  *   **The Split:** They only separate when the institution says "Pull the plug to save money." View B says "That's murder." View D says "That's management."

  **2. The Broken Slogan (Node 5)**
  This is where your family is stuck. The phrase "letting nature take its course" works at the bedside (Node 1) but feels like a lie at the committee level (Node 5).
  *   **Why:** A committee vote requires active coordination (signatures, meetings, criteria). It feels like an *act*.
  *   **The Fix:** If your siblings agree on Node 5 (that a vote is an act), you must move the debate to **Leaf E** or **Leaf B**. You have to admit that *systemic* decisions carry the same weight as *bedside* actions. You cannot hide behind "nature" when a committee signs a form.

  **3. The Incoherent Zone**
  If someone says: "Turning off the vent is killing (Node 1 Agree), BUT a committee voting to deny the bed is just nature (Node 5 Disagree)," they are in a fragile spot.
  *   **Why:** A committee vote is *more* active than a doctor's silence. If the switch is "killing," the signature must be too.
  *   **Advice:** Gently point out that a signed policy is more "active" than a tired doctor not starting a machine. Ask them if the signature makes it heavier or lighter. If they say lighter, ask why ink makes it safer than a switch.
