  We seek a place to rest, a stable **peak**,
  That dominates the lower **summit**.
  Each ridge suggests a higher **crest**,
  Each proof implies a pure **apex**.
  We search for one to wear the **crown**,
  And fix our eyes upon the **zenith**.

  But vision blurs below the **zenith**,
  And shadows fall across the claimed **peak**.
  No hand is worthy of the **crown**,
  When paths diverge from every **summit**.
  We postulate a final **apex**,
  Without defining any **crest**.

  We trace the line along the **crest**,
  Assuming light flows from the **zenith**.
  Is this the singular **apex**?
  It stands above the local **peak**.
  The view hides any global **summit**,
  And no one takes the heavy **crown**.

  Who dares to wear the phantom **crown**?
  If every chain finds an enclosing **crest**,
  Then every chain bounds its own **summit**.
  Bounds are set beneath the **zenith**.
  No sequence climbs beyond the last **peak**,
  For order demands a limiting **apex**.

  We name the limit, not the **apex**,
  Refusing to assign the empty **crown**.
  It towers o'er the merely local **peak**,
  Unseen behind the clouded **crest**.
  The proof allows us near the **zenith**,
  Yet bars the sight of any fixed **summit**.

  Is there a true and maximal **summit**?
  The logic holds despite the missing **apex**.
  We know the set contains a **zenith**,
  Though none may lift the invisible **crown**.
  It dwarfs the temporary **crest**,
  Higher than any constructed **peak**.

  Whether **summit**,
  Whether **crown**,
  Whether **apex**,
  Whether **crest**,
  Whether **zenith**,
  Or **peak**, one exists.
