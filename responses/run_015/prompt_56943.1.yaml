      The paragraph merges these. The cost is confusing *design intent* with *technological imperative*.

      *(Refining the Last Sentence)*: The user's intuition is spot on. "Every artifact" moves from STS to a kind of pan-political idealism that Winner doesn't quite claim. He claims *important* artifacts do.

