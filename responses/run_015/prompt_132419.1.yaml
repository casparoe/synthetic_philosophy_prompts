answer: |-
  **1. Scope Note**

  This document records the output of an eighteen-month adversarial collaboration regarding the locus of political properties in technology. We define **politics** as relations of authority, subordination, or exclusion among humans. We define **artifact** as the material technical arrangement itself, distinct from the **arrangement**, which includes the sociotechnical system of production, funding, maintenance, regulation, and use. **Inherence** denotes a property existing independently of specific users or contexts.

  This statement explicitly sets aside questions of designer intentionality, general moral responsibility, and the broader ethics of innovation. We do not adjudicate whether specific technologies are good or bad. We focus strictly on whether political properties attach to the artifact's geometry or the surrounding arrangement. We require that comparisons hold measurable function fixed to avoid conflating political effects with ordinary performance tradeoffs. We distinguish four questions often conflated: causal (did it bring about an effect?), modal (would equivalents do so?), normative (who is responsible?), and semiotic (is it read as political?).

  **2. Agreed Claims**

  1.  **Causal Influence:** Artifacts causally influence the distribution of authority and access within a specific context. [Status: Settled among people who actually work on this]
  2.  **Contextual Modulation:** The political effects of an artifact are modulated by the social, legal, and economic arrangements surrounding its use. [Status: Settled among people who actually work on this]
  3.  **Functional Parity:** Functionally equivalent artifacts (same output, cost, lifespan) can distribute authority differently via their technical constraints. [Status: Accepted by one side only for the sake of getting a signed document]
  4.  **Design Responsibility:** Designers bear some responsibility for foreseeable political effects, though the extent of this responsibility relative to users and regulators is disputed. [Status: Majority view but genuinely contested]
  5.  **Semiotic Reading:** Artifacts are frequently read by users as embodying political values, regardless of whether those values are materially enforced. [Status: Settled among people who actually work on this]
  6.  **Omission as Constraint:** The absence of a feature (e.g., no paper route) can function as a constraint equivalent to a physical barrier. [Status: Accepted by one side only for the sake of getting a signed document]

  **3. Disagreements Table**

  | Crux | Inherence Camp Formulation | Arrangement Camp Formulation | Case | Predictions (Inherence; Arrangement) | Evidence to Move |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Modal Strength** | Political properties persist across diverse social contexts if the technical constraint remains unchanged. | Political properties vanish or change meaning if the enforcing social arrangement changes. | 4. What Travels | Inherence: Effect persists in new society. Arrangement: Effect dissolves or transforms. | Inherence: Effect holds in radically different polity. Arrangement: Effect vanishes without enforcement. |
  | **Boundary** | The artifact includes its technical maintenance requirements (e.g., proprietary fittings). | The artifact ends at the physical shell; maintenance is a separate social contract. | 1. Matched Pair | Inherence: Pump M is inherently hierarchical. Arrangement: Hierarchy arises from licensing regime. | Inherence: Hierarchy persists without licensing laws. Arrangement: Hierarchy vanishes if laws change. |
  | **Omissions** | An omitted feature is a material constraint equivalent to a physical barrier. | An omission is a policy choice external to the artifact's materiality. | 3. The Omission | Inherence: Portal is inherently exclusionary. Arrangement: Exclusion is a policy decision. | Inherence: Exclusion persists despite policy changes. Arrangement: Exclusion ends with policy shift. |
  | **Persistence** | Political properties survive the dissolution of the original enforcing authority. | Political properties require active maintenance and enforcement to persist. | 2. Orphan Artifact | Inherence: Courtyard remains political. Arrangement: Courtyard becomes merely inconvenient. | Inherence: Residents feel subordinated without manager. Arrangement: Residents repurpose space freely. |

  **4. Closing: Limits of Agreement**

  We anticipate a third-party engineer would reject our core framing, arguing that stretching the word **politics** to cover technical constraints renders the term useless for distinguishing governance from physics. Conversely, a critical theorist might reject the document for locating agency in specific sites (artifact vs. arrangement) rather than acknowledging distributed agency across the entire network.

  The Inherence Camp concedes its case is weakest on **Case 2 (Orphan Artifact)**, where the dissolution of the enforcing company suggests politics may not survive without active maintenance. The Arrangement Camp concedes its case is weakest on **Case 1 (Matched Pair)**, where identical functions yield different authority structures solely through technical design choices, suggesting some political content is embedded prior to social use.

  We sign this not to declare victory, but to map the precise geometry of our disagreement. We agree that empirical work on these four cases is required to settle the modal and boundary questions. Until then, we acknowledge that both material constraints and social arrangements are necessary conditions for political effects, disagreeing only on which condition is sufficient.
