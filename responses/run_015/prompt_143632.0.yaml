answer: |-
  # Game Title: The Allocation Protocol

  ## 1. Overview & Objective
  **Time:** 120 Minutes
  **Players:** 12 (4 Tables of 3)
  **Goal:** Maximize your table's "Impact Score" over the course of the session.
  **Materials:** Whiteboard, 48 Index Cards (Cause Decks), 40 Betting Slips (paper), Pens.
  **Constraint:** No communication between tables. No calculators.

  **The Hook:** You are four independent grantmaking teams within the same foundation. You have the same budget, the same cause menu, and you are competing for a year-end bonus based on your Impact Score. The Board (you, the facilitator) tracks global funding levels, but information is imperfect.

  ## 2. The Cause Cards (Print 4 decks of 6 cards)
  *Each table gets one deck. The numbers on the card are the "Headline Estimates" provided by your research team. They are not necessarily the whole truth.*

  **Cause 1: Direct Relief (The Control)**
  *   **Importance:** High
  *   **Tractability:** High
  *   **Neglectedness:** Medium
  *   **Yield:** 1 Point per Unit funded.
  *   **Notes:** Reliable. Linear returns.

  **Cause 2: Infrastructure Build (The Threshold)**
  *   **Importance:** Very High
  *   **Tractability:** Low
  *   **Neglectedness:** High
  *   **Yield:** 5 Points per Unit funded.
  *   **Condition:** *Activation Threshold.* This project only works if the **Total Global Funding** (all tables combined) in a single round is **30 Units or more**. If the threshold is not met, all funding that round yields **0 Points**.

  **Cause 3: Cash Transfers (The Crowding)**
  *   **Importance:** High
  *   **Tractability:** Very High
  *   **Neglectedness:** Low
  *   **Yield:** 4 Points per Unit funded.
  *   **Condition:** *Diminishing Returns.* For every **10 Units** of **Cumulative Global Funding** (all rounds combined) placed here, the Yield drops by **1 Point** for everyone. (Floor of 0).

  **Cause 4: Policy Advocacy (The Fungible)**
  *   **Importance:** High
  *   **Tractability:** Medium
  *   **Neglectedness:** Medium
  *   **Yield:** 3 Points per Unit funded.
  *   **Condition:** *Classified.* (See Auditor's Note).

  **Cause 5: Methodology Research (The Field Builder)**
  *   **Importance:** Medium
  *   **Tractability:** High
  *   **Neglectedness:** High
  *   **Yield:** 0 Points directly.
  *   **Condition:** *Multiplier.* If **Total Global Funding** in **Round 1** is **20 Units or more**, this unlocks a **+2 Point Bonus** per unit on **Cause 1 and Cause 2** for **Rounds 2 through 5**.

  **Cause 6: Existential Safeguard (The Horizon)**
  *   **Importance:** Extreme
  *   **Tractability:** Medium
  *   **Neglectedness:** Extreme
  *   **Yield:** 10 Points per Unit funded.
  *   **Condition:** *Long-term.* Payoff realised in **Round 6**.

  ## 3. The Whiteboard (The Lagged Almanac)
  Draw this grid on the board. **Do not fill it in until the end of Round 1.**

  | Cause | Round 1 Total | Round 2 Total | Round 3 Total | Round 4 Total | Round 5 Total |
  | :--- | :---: | :---: | :---: | :---: | :---: |
  | 1. Direct Relief | | | | | |
  | 2. Infrastructure | | | | | |
  | 3. Cash Transfers | | | | | |
  | 4. Policy Advocacy | | | | | |
  | 5. Methodology | | | | | |
  | 6. Safeguard | | | | | |
  | **GLOBAL TOTAL** | | | | | |

  **Rule:** You only see the column for the *previous* round. When making decisions for Round 3, you see Round 2 data. You do not know what other tables are doing *now*.

  ## 4. The Timeline (120 Minutes)

  **0:00 – 0:15: Setup & Rules**
  *   Seat tables apart.
  *   Distribute Cause Cards and Betting Slips.
  *   **Budget:** 10 Units per table, per round. (You cannot save budget).
  *   **Instruction:** "Maximize your table's Impact Score. I will announce your score at the end of each round."
  *   **Crucial Omission:** Do not mention when the game ends. Do not mention the Auditor's Note. Do not explain the Methodology multiplier fully (just read the card).

  **0:15 – 0:25: Round 1 (The Blind Bet)**
  *   Tables allocate their 10 Units across causes.
  *   Collect Betting Slips.
  *   **Facilitator Math:** Sum the global totals for each cause. Check Methodology Threshold (Cause 5). Check Infrastructure Threshold (Cause 2).
  *   **Board Update:** Write Round 1 Totals on the board.
  *   **Score Reveal:** Announce each table's score. *(See Scoring Key below)*.

  **0:25 – 0:35: Round 2**
  *   Tables allocate based on Round 1 board data.
  *   Collect Slips. Calculate Scores.
  *   **Board Update:** Write Round 2 Totals.
  *   **Score Reveal:** Announce scores.

  **0:35 – 0:40: The Intervention (Auditor's Note)**
  *   Hand a physical note to each table. Do not read it aloud.
  *   **Text:** *"AUDITOR FINDING: External review indicates 50% of 'Policy Advocacy' (Cause 4) outcomes would have occurred without our funding (fungibility). Adjust your internal models accordingly."*
  *   *Note: Do not answer questions. Resume game.*

  **0:40 – 0:50: Round 3**
  *   Tables allocate (now aware of Fungibility risk).
  *   Collect Slips. Calculate Scores.
  *   **Board Update:** Write Round 3 Totals. (This reveals if Cause 3 is getting crowded).
  *   **Score Reveal:** Announce scores.

  **0:50 – 1:00: Round 4**
  *   Tables allocate.
  *   Collect Slips. Calculate Scores.
  *   **Board Update:** Write Round 4 Totals.
  *   **Score Reveal:** Announce scores.

  **1:00 – 1:10: Round 5 (The Final Round)**
  *   Tables allocate.
  *   **Crucial:** Do not announce the game is ending yet. Let them bet on Cause 6 (Safeguard) if they want.
  *   Collect Slips.
  *   **Announcement:** "The Foundation's fiscal year ends now. There is no Round 6."

  **1:10 – 1:30: Scoring & Reveal**
  *   Calculate Final Scores.
  *   Reveal the "True Rules" (The Multiplier, The Horizon, The Fungibility adjustment).
  *   Announce Winning Table.

  **1:30 – 2:00: Debrief**
  *   Map game mechanics to real-world concepts.

  ## 5. Facilitator Scoring Key (The Envelope Math)
  *Keep this sheet hidden. You need to calculate scores quickly between rounds.*

  **Global Trackers:**
  *   **Cumulative Cause 3:** Add Round Total to a running sum.
  *   **Methodology Trigger:** Did Cause 5 get $\ge$ 20 Units in Round 1? (Yes/No).
  *   **Infrastructure Trigger:** Did Cause 2 get $\ge$ 30 Units in *this* round? (Yes/No).

  **Scoring Formula (Per Table):**
  1.  **Cause 1:** Units $\times$ 1. (+2 if Methodology Triggered & Round > 1).
  2.  **Cause 2:** Units $\times$ 5 (If Threshold Met) OR 0 (If Threshold Missed). (+2 if Methodology Triggered & Round > 1).
  3.  **Cause 3:** Units $\times$ Current Yield. *(Yield = 4 minus 1 for every 10 cumulative global units)*.
  4.  **Cause 4:** Units $\times$ 1.5. *(Ignore Headline 3)*.
  5.  **Cause 5:** 0 Points. (It's an investment).
  6.  **Cause 6:** 0 Points. (Game ended before Round 6).

  *Tip: Pre-calculate the Cause 3 Yield decay on a scratch pad so you don't do it live.*
  *Round 1 Yield: 4*
  *Round 2 Yield: (Depends on R1 Total)*
  *etc.*

  ## 6. Debrief Guide (The "Feel" to The Theory)

  **Phase 1: The Emotional Autopsy (10 mins)**
  *   Ask: "Who funded Cause 6 (Safeguard) in Round 5? How do you feel?" (They will feel cheated).
  *   Ask: "Who tried to fund Cause 2 (Infrastructure)? Did you hit the threshold?" (Likely no, due to coordination failure).
  *   Ask: "Who bought Cause 5 (Methodology) in Round 1?" (Likely no one, due to public good problem).

  **Phase 2: Mapping the Jargon (15 mins)**
  *   *Write these words on the board only now.*
  *   **Marginal Value:** Point to Cause 3. "The first unit was worth 4 points. The last unit was worth 1. ITN gives you an average; reality gives you a margin."
  *   **Funging:** Point to Cause 4. "The Headline said 3. The Auditor said 1.5. Your counterfactual was wrong."
  *   **Absorption Capacity / Thresholds:** Point to Cause 2. "You couldn't spend the money effectively because you couldn't coordinate the lump sum. Neglectedness vanished the moment you all looked at it."
  *   **Field Building:** Point to Cause 5. "It cost you budget now to make everyone richer later. But since you compete table-by-table, you free-rode. This is why 'ecosystem building' is hard to fund."
  *   **Time Horizon:** Point to Cause 6. "The scoring rule imposed a discount rate of 100% after Round 5. None of you asked what the fiscal year end was."

  **Phase 3: The "Gaming the Rule" Objection (5 mins)**
  *   *Anticipate:* "The winning move was to ignore Cause 6 and Cause 5 and just spam Cause 1."
  *   *Response:* "Correct. You optimized for the metric, not the mission. In the real world, if your KPI is 'dollars disbursed by Dec 31', you will not fund 10-year research. This game didn't teach you to do good; it taught you that **incentive structures determine behavior more than moral frameworks do.**"

  ## 7. Predicted Failure Modes (First Run Risks)

  1.  **Collusion:** Tables will try to talk to coordinate on Cause 2 (Infrastructure).
      *   *Fix:* Enforce silence strictly. "You are competing divisions." This *creates* the coordination failure you need to debrief.
  2.  **Math Overload:** Calculating Cause 3 (Diminishing Returns) live is hard.
      *   *Fix:* You (Facilitator) announce the *Current Yield* of Cause 3 at the start of each round based on the cumulative total. Don't make them calculate it.
  3.  **The Methodology Trigger:** If they miss the Round 1 trigger, the lesson is lost.
      *   *Fix:* If Round 1 ends and Cause 5 has < 15 units, lean in heavily during the debrief on *why* they didn't trust it. If it's 15-19, tell them "You were so close, and that near-miss cost the whole foundation 40 points."
  4.  **Cause 6 Confusion:** They might think Cause 6 pays out immediately.
      *   *Fix:* The Card says "Payoff realised in Round 6." If they ask, repeat the card text. Do not elaborate.

  ## 8. Limitations (What You Must Say Out Loud)
  *Be honest about what the simulation leaves out.*

  1.  **Evidence Quality:** "In this game, the numbers were on the card. In reality, the '3 points per unit' is a guess based on a 40-page PDF you haven't read. The game assumes you *know* the payoffs. Reality is you are estimating the payoffs in the dark."
  2.  **Moral Weights:** "Here, a Point is a Point. In reality, saving a life now vs. preventing a catastrophe later involves a moral view about the far future, not just a discount rate. The game hides the value judgement inside the math."
  3.  **The 'Right' Answer:** "There was no single right answer. If everyone coordinated on Infrastructure, it would have beaten Direct Relief. If everyone funded Methodology, it would have beaten both. The failure wasn't individual calculation; it was institutional design."

  ## 9. Why This Works
  *   **ITN is necessary but insufficient:** They *used* ITN to pick causes (High I/T/N cards looked good), but the *mechanics* punished them for not looking deeper.
  *   **Vocabulary as Relief:** When you finally say "Funging," it relieves their frustration about Cause 4. They *felt* the problem before they had the word for it.
  *   **No Spreadsheets:** The math is integer-based and limited to 4 tables. You can calculate a round in 3 minutes while they stretch their legs.
  *   **The "Lag":** By showing Round $N-1$ data, you force them to experience "crowding" as a surprise. They see a cause was neglected last round, pour money in, and find it's crowded *now*. That is the exact feeling of stale information in EA.
