      *   If she holds to **Gradualism (Rule C/Cluster)**: She will say the *unity of consciousness* literally degrades in degrees. The patient possesses "0.8 unity" or "0.5 unity."
  *   *Why it splits them:* Supervaluationism (Indeterminacy) preserves classical logic (True/False) but admits gaps. Gradualism changes the logic to scalars. Her "gradient commitment" language implies scalars, but her "supervaluationist" history with color patches makes this the critical friction point.

  ### 5. Closest Earlier Precedent
  **The Heap (10,000 grains).**

  **Why:** Structurally, this is the twin of the cluster case. Both involve counting discrete, identical units (grains/nodes) to determine if a macro-status (Heap/Cognition) obtains.
