answer: |-
  You have identified a genuine and under-theorized friction point in contemporary axiology. While the components of this argumentative architecture are well-documented individually, the *selective toggling* between them lacks a specific label in the literature.

  The phenomenon you are describing is not merely **Organic Unity** (G.E. Moore), because Moore applied holism consistently to value structures. It is not **Narrative Identity** (Schechtman/Velleman), because narrative theorists usually reject aggregative accounting across the board, not just when suffering is involved. It is not simple **Framing**, because the shift is normative (how we *should* count), not just cognitive (how we *do* count).

  The specific move you are tracking—the unacknowledged shift from atomistic to holistic evaluation contingent on whether the suffering serves a "higher" function—is best described as **Valence-Contingent Granularity (VCG)**.

  Below is the carving you requested: a precise definition, its distinction from adjacent concepts, boundary conditions, and a diagnosis of whether it constitutes legitimate pluralism or a failure mode.

  ---

  ### 1. The Concept: Valence-Contingent Granularity (VCG)

  **Definition:** VCG is a methodological inconsistency in welfare evaluation where the *granularity* of analysis (atomic vs. holistic) is selected based on the *normative valence* of the suffering component relative to a perceived higher good.

  *   **Mode A (Atomistic/Aggregative):** Used when suffering is "pointless" or when comparing reality to simulation. Suffering is an independent negative variable to be summed.
  *   **Mode B (Holistic/Gestalt):** Used when suffering is "meaningful" (constitutive of love, art, truth). Suffering is an inseparable feature of a positive whole and is not counted as an independent negative.

  **The Toggle:** The error (or strategic move) occurs when an interlocutor employs Mode B to defend a life containing suffering against reductionist critiques, but employs Mode A to critique a life containing suffering against utopian interventions (like the Experience Machine or suffering-reduction technologies), without justifying the shift in axiomatic framework.

  ### 2. Differentiation from Adjacent Concepts

  To ensure this is not just a renaming of existing ideas, we must distinguish VCG from its nearest neighbors:

  | Concept | Core Claim | How VCG Differs |
  | :--- | :--- | :--- |
  | **Organic Unity** (Moore) | The value of a whole is not the sum of its parts. | Moore applies this *consistently*. VCG applies it *selectively* only when the "part" is suffering embedded in a valued narrative. |
  | **Narrative Constitutivism** | Well-being is a property of a life-story, not moments. | Narrative theorists reject moment-by-moment accounting *globally*. VCG users accept moment-by-moment accounting for pleasure/simulation but reject it for integrated suffering. |
  | **Objective List Theory** | Certain goods (knowledge, love) are valuable regardless of feeling. | Objective List theorists usually count suffering as a separate negative on the list. VCG claims the suffering *is* the good (constitutive), not just a cost alongside it. |
  | **Motivated Reasoning** | Reasoning is driven by desired conclusions. | VCG is a *specific subtype* of motivated reasoning within axiology. It has a structural signature (the granularity shift) rather than just a directional bias. |

  ### 3. Boundary Conditions: The Carving

  To identify VCG rigorously, three conditions must be met simultaneously. If any are missing, the argument may be consistent pluralism rather than the toggle.

  **Condition 1: The Constitutive Claim**
  The interlocutor must assert that the suffering is not merely instrumental (a cost paid for a benefit) but *constitutive* (the suffering is part of the essence of the good).
  *   *Example:* "The grief is not the price of love; the grief is the shape the love takes in this context."

  **Condition 2: The Granularity Shift**
  The interlocutor must demonstrate a willingness to decompose value into separable states in a parallel context.
  *   *Example:* The same person argues that in the Experience Machine, simulated pleasure is inferior to real struggle, implying we *can* separate "feeling good" from "reality" to weigh them, yet they refuse to separate "grief" from "love" in the caregiving case.

  **Condition 3: The Valence Dependency**
  The choice of granularity must track the *outcome* of the calculation.
  *   *Test:* If the suffering were removed (via magic/tech) but the "good" remained, would the interlocutor admit the life is *better* (Atomistic view) or *different/lesser* (Holistic view)?
  *   *VCG Signature:* They claim it would be "lesser" (Holistic) when defending the status quo, but imply it would be "better" (Atomistic) when critiquing a rival ethical framework that prioritizes suffering reduction.

  ### 4. Diagnosis: Pluralism or Fallacy?

  Is VCG a legitimate methodological pluralism or a failure mode (special pleading)?

  #### The Charitable Interpretation: Domain Pluralism
  A defender might argue that different *domains of value* require different metrics.
  *   **Hedonic Domain:** Aggregative (summing pleasure/pain).
  *   **Meaning Domain:** Holistic (narrative integrity).
  *   *Defense:* "I am not toggling inconsistently; I am acknowledging that well-being is multi-dimensional. When we talk about the Experience Machine, we are talking about *Meaning*. When we talk about caregiving, we are also talking about *Meaning*. When we talk about malaria nets, we are talking about *Hedonics*."

  **Where this collapses:** This defense fails if the interlocutor cannot specify *ex ante* which domain governs a case. In VCG, the domain is often selected *post hoc* to protect the intuition that "this specific suffering is noble." If the metric changes based on whether we want to preserve or eliminate the suffering, it is not pluralism; it is **Axiological Opportunism**.

  #### The Critical Interpretation: The "Magic Wand" Test
  The most rigorous way to expose VCG as special pleading is the **Counterfactual Separation Test** (The Magic Wand).

  1.  **Pose the Scenario:** A caregiver loves a dying spouse. The grief is constitutive of the love.
  2.  **Apply the Wand:** Suppose a pill exists that removes the *pain* of grief but preserves the *memory, devotion, and behavioral care* exactly.
  3.  **The Trap:**
      *   If the interlocutor says, "That pill would destroy the love," they are committed to **Holism**. They must then reject the Experience Machine *only* if the Machine also severs the constitutive link between reality and value. They cannot simply tally "real pain" as a negative elsewhere.
      *   If the interlocutor says, "That pill would be a relief, but the current pain is still meaningful," they are admitting the pain is *instrumental*, not constitutive. They have reverted to **Atomism** and must count the pain as a negative in their welfare calculus.
      *   **VCG Failure:** If they say, "The pill is bad (Holism), but when evaluating policy, we must count the pain as a negative cost (Atomism)," they have committed the toggle.

  ### 5. Literature and Lineage

  While "Valence-Contingent Granularity" is a new coinage for this specific toggle, it sits at the intersection of several existing debates:

  *   **G.E. Moore, *Principia Ethica*:** The origin of **Organic Unity**. Moore argued that a whole containing pain (e.g., pity) could be better than a neutral whole. However, Moore did not suggest we stop counting the pain as intrinsically bad; he argued the *combination* created a surplus value. VCG often goes further, claiming the pain *itself* is not a negative entry, which is a distortion of Moore.
  *   **Robert Nozick, *Anarchy, State, and Utopia*:** The **Experience Machine** argument relies on a form of holism (contact with reality is a constitutive good). However, Nozick did not argue that the *frustration* of failing in reality is good; he argued the *contact* is good. VCG conflates "contact" with "suffering."
  *   **David Benatar, *Better Never to Have Been*:** Benatar highlights the **Asymmetry** between pain and pleasure. VCG is often deployed by Benatar's critics to argue that "a life with pain is still good," but they often fail to apply Benatar's rigorous accounting when it suits them.
  *   **Suffering-Focused Ethics (FRI):** This community is most sensitive to VCG. They often critique the "Meaning Defense" as a rationalization for tolerating preventable suffering. The literature on **S-Risks** (Suffering Risks) frequently encounters VCG when discussing whether digital minds or future societies "need" suffering for depth.

  ### 6. Conclusion

  You are observing **Valence-Contingent Granularity**. It is a rhetorical and philosophical maneuver that allows interlocutors to retain the intuitive force of **Holism** (to defend meaningful suffering) while retaining the calculative power of **Atomism** (to critique simulations or advocate for interventions).

  Unless the interlocutor can provide a principled, *ex ante* rule for when welfare accounting must be holistic versus atomistic (one that does not depend on whether the suffering is currently being defended or attacked), this toggle should be classified as a **Failure Mode of Axiological Consistency**. It is special pleading dressed in the language of narrative complexity.

  **Recommendation for Engagement:**
  When you encounter this, do not attack the holistic view itself. Attack the **granularity selection mechanism**. Ask: *"Under what precise conditions are we required to use holistic evaluation, and can you state that rule before I tell you whether the suffering in the example is 'noble' or 'pointless'?"* If they cannot, you have isolated the VCG.
