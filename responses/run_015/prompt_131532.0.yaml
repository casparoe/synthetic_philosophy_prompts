          *   **Negative Constraint:** No bibliographies, citations, or reading lists. Self-contained argument.

  2.  **Deconstruct the 7 Dimensions into Desiderata:**
      *   *Dimension 1 (Tacit Knowledge):* Requirement: Mechanism for utilizing dispersed, non-codifiable knowledge. Difficulty: Centralization loses context/timing.
