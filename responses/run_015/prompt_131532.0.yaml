      *   *Dimension 3 (Scarcity/Shadow Prices):* Requirement: Generate signals reflecting opportunity costs without private exchange. Difficulty: Can admins mimic markets without the stakes?
      *   *Dimension 4 (Preference Revelation):* Requirement: Accurate registration of subjective value without profit/loss discipline. Difficulty: Voting/surveys vs. spending money.
      *   *Dimension 5 (Consumer vs. Capital):* Requirement: Distinct mechanisms for final demand vs. derived demand. Difficulty: Capital goods lack direct consumer valuation.
      *   *Dimension 6 (Aggregation):* Requirement: Handle interpersonal comparison or avoid it. Difficulty: How to sum heterogeneous utilities?
      *   *Dimension 7 (Empirical):* Requirement: Fit historical data (USSR, Chile/Cybersyn, modern algo-trading). Difficulty: Theory must match reality, not just logic.

  3.  **Drafting the Desiderata (Iterative Refinement):**
      *   *Tone:* Academic, rigorous, neutral but analytical.
      *   *Structure:* Numbered list, Requirement + Justification/Constraint.
      *   *Check:* Am I distinguishing genuine constraints from preferences? Yes, focus on *functional necessity* for coordination, not ideological desire (e.g., "equality" is a preference, "accurate signal transmission" is a constraint).

  4.  **Analyzing Tensions (Jointly Unsatisfiable Pairs):**
      *   *Centralization vs. Autonomy:* You can't have perfect global optimization and perfect local autonomy simultaneously.
      *   *Stability vs. Discovery:* Fixed rules aid calculation but hinder innovation.
      *   *Speed vs. Accuracy:* Iterative planning takes time; markets are instant but noisy.
      *   *Key Tension:* The "Knowledge Problem" vs. The "Coordination Problem."

