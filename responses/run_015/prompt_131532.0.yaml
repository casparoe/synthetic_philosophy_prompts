  *(Self-Correction Note during drafting Dimension 6)*: Be careful with "interpersonal comparison." Standard economics says it's impossible. A theory must either justify it or bypass it. The desideratum is about *how* the theory handles aggregation, not necessarily demanding comparison be possible.
