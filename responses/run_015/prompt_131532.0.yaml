answer: |-
  ### Specification of Adequacy: Desiderata for Economic Calculation and Coordination

  To resolve the socialist calculation debate without begging the question, a theoretical framework must satisfy functional requirements derived from the physics of information and the logic of action, rather than ideological commitments. The following list distinguishes genuine systemic constraints (conditions necessary for complex coordination to occur at all) from camp-specific preferences (normative desires regarding property or equality). An adequate theory must demonstrate how its proposed mechanism satisfies these seven desiderata.

  #### 1. The Tacit Knowledge Constraint
  *   **Requirement:** The theory must specify a mechanism for utilizing dispersed, non-codifiable knowledge regarding local production conditions, time-specific opportunities, and contextual constraints without requiring the physical centralization of that knowledge.
  *   **Motivating Difficulty:** Knowledge of "circumstances of time and place" is often tacit (knowing how rather than knowing that) and fleeting. Central aggregation requires codification, which strips context and introduces latency. If a theory relies on a central body possessing perfect data, it fails this constraint. The mechanism must allow decision-rights to reside where the knowledge exists, or prove that codification losses are negligible.

  #### 2. The Dynamic Discovery Constraint
  *   **Requirement:** The theory must account for entrepreneurial discovery and structural change in capital goods sectors, explaining how the system generates new options rather than merely allocating existing resources among known ends.
  *   **Motivating Difficulty:** Static equilibrium models assume known production functions and preferences. In reality, technology and desires evolve. A calculation system based solely on optimizing current inputs cannot account for the creation of new inputs or the obsolescence of old ones. The theory must explain the incentive and feedback structure that drives innovation without relying on the residual claimancy of private profit.

  #### 3. The Scarcity Signal Constraint
  *   **Requirement:** The theory must demonstrate how genuine opportunity costs are computed and transmitted for goods lacking private ownership, ensuring that shadow prices or administrative valuations reflect real resource trade-offs rather than political fiat.
  *   **Motivating Difficulty:** Without exchange, there is no revealed penalty for error. Administratively determined prices risk becoming disconnected from physical scarcity. If the signal does not bite (i.e., if ignoring it carries no systemic cost), the signal is noise. The theory must explain the enforcement mechanism that binds planners to economic reality.

  #### 4. The Preference Revelation Constraint
  *   **Requirement:** The theory must explain how subjective consumer valuations are registered and weighted accurately without a monetary common denominator derived from voluntary exchange.
  *   **Motivating Difficulty:** In markets, spending money reveals intensity of preference. In non-market systems, preferences are often expressed via voting, surveying, or rationing, which suffer from strategic misrepresentation (lying to get more) or lack of intensity weighting (one person, one vote vs. one dollar, one vote). The theory must solve the "free rider" and "truth-telling" problem in consumption data.

  #### 5. The Structural Differentiation Constraint
  *   **Requirement:** The theory must distinguish between allocative coordination for consumer goods (direct utility) and strategic coordination for intermediate/capital goods (derived demand), providing distinct mechanisms for each.
  *   **Motivating Difficulty:** Conflating these levels leads to calculation errors. Consumer goods can be rationed or distributed based on need, but capital goods require intertemporal coordination (investing today for output tomorrow). A single mechanism (e.g., a single price list) often fails to capture the time-structure of production. The theory must show how long-term capital structure is maintained without a market for claims on future output.

  #### 6. The Aggregation Constraint
  *   **Requirement:** The theory must either justify a method for intersubjective comparison of welfare/value or demonstrate how coordination occurs without requiring such comparisons.
  *   **Motivating Difficulty:** To plan for "society," one must aggregate heterogeneous individual utilities. Standard economics holds this is impossible scientifically. If a theory assumes a social welfare function, it must justify the metric. If it avoids this, it must explain how conflicting individual plans are reconciled without a common denominator. Ignoring this leads to arbitrary prioritization disguised as technical calculation.

  #### 7. The Empirical Consistency Constraint
  *   **Requirement:** The theory must be consistent with documented historical outcomes of actual planning boards (e.g., chronic shortages, surpluses, innovation lags) and modern distributed-computing allocation experiments (e.g., supply chain algorithms, cybernetic trials).
  *   **Motivating Difficulty:** A purely logical model that contradicts observed systemic behavior is insufficient. If a theory claims planning is efficient, it must explain the persistent empirical record of calculation errors in large-scale non-market economies. Conversely, it must account for successes in distributed computing where markets are absent (e.g., internal firm allocation).

  ***

  ### Jointly Unsatisfiable Pairs and Structural Tensions

  No theoretical framework currently satisfies all desiderata simultaneously without trade-offs. The following tensions represent the core theoretical bottlenecks where satisfying one constraint tends to violate another.

  **1. Central Optimization vs. Local Epistemic Autonomy (Tension between Desiderata 1 and 3)**
  To achieve accurate scarcity signals (Desideratum 3) across a whole economy, a central optimizer requires comprehensive data. However, gathering this data violates the Tacit Knowledge Constraint (Desideratum 1) because the act of aggregation strips the local context and timing essential for the knowledge to be useful.
  *   *The Trade-off:* You can have high-fidelity local knowledge with decentralized decision-making (preserving autonomy but risking global incoherence), or you can have global coherence via centralization (risking information loss and latency). A theory claiming to achieve both must explain how information is transmitted without loss *and* processed centrally without delay.

  **2. Stability of Plan vs. Dynamic Discovery (Tension between Desiderata 2 and 5)**
  Strategic coordination in capital goods (Desideratum 5) requires long-term stability to allow complex projects to complete. However, entrepreneurial discovery (Desideratum 2) requires the flexibility to liquidate failed projects and reallocate resources instantly.
  *   *The Trade-off:* A system rigid enough to coordinate long-term capital structures tends to be too brittle to accommodate disruptive innovation. A system flexible enough for rapid discovery tends to introduce uncertainty that undermines long-term capital investment. Resolving this requires a mechanism that distinguishes between "noise" (to be ignored) and "signal" (to be acted upon) without a profit-and-loss test.

  **3. Preference Intensity vs. Egalitarian Aggregation (Tension between Desiderata 4 and 6)**
  Accurate preference revelation (Desideratum 4) typically requires weighting by intensity (willingness to sacrifice). However, avoiding intersubjective welfare comparisons (Desideratum 6) often leads to egalitarian weighting (one person, one vote).
  *   *The Trade-off:* If you weight by intensity, you reintroduce a quasi-currency that mimics inequality. If you weight equally, you lose the ability to distinguish urgent needs from trivial wants, leading to misallocation. A theory must choose between accurate signaling (which mimics markets) or normative equality (which degrades calculation).

  ***

  ### Evaluation of Theoretical Positions Against Desiderata

  The following assessment evaluates three positions—the Austrian Critique (Mises/Hayek), Market Socialism (Lange), and a Hypothetical Federated Cybernetic Model—against the established desiderata.

  #### 1. The Austrian Critique (Mises and Hayek)
  *   **Performance:**
      *   *Strong on 1, 2, 4:* This framework correctly identifies that tacit knowledge cannot be centralized (1) and that the market is a discovery procedure, not just an allocator (2). It solves preference revelation (4) by tying it to property ownership and spending.
      *   *Strong on 7:* It aligns closely with the empirical collapse of command economies.
      *   *Weak on 3, 5, 6:* It argues Desideratum 3 is *impossible* without private property, effectively rejecting the premise that a solution exists. It offers little on the specific differentiation of capital coordination (5) beyond "let the market decide." It bypasses the aggregation problem (6) by denying the possibility of social utility functions.
  *   **Verdict:** Theoretically robust on information and dynamics, but functions as a *reductio ad absurdum* of socialism rather than a constructive solution for non-market coordination. It satisfies the constraints by declaring the socialist project impossible.

  #### 2. Lange's Competitive Trial-and-Error (Market Socialism)
  *   **Performance:**
      *   *Strong on 3, 5:* Lange explicitly addresses scarcity signals (3) by mandating that managers follow rules to equate marginal cost with price. He distinguishes between consumer sovereignty and managerial rules (5).
      *   *Weak on 1, 2:* This is the critical failure point. The model assumes production functions are known (violating 2) and that managers can report costs truthfully without ownership stakes (violating 1). It treats knowledge as codifiable data available to the Central Planning Board.
      *   *Weak on 4, 7:* Preference revelation (4) relies on consumers spending income, but without capital markets, investment preferences are political. Empirically (7), no such system achieved the iterative speed required to match market clearing, leading to chronic disequilibrium.
  *   **Verdict:** Logically consistent in a static equilibrium model but fails the Dynamic Discovery and Tacit Knowledge constraints. It solves calculation only by assuming away the very problems (uncertainty and information dispersion) that make calculation necessary.

  #### 3. Hypothetical Federated Cybernetic Model
  *   *Description:* Regional nodes transmit local constraint data to an optimizer that iteratively updates shadow prices without private ownership.
  *   **Performance:**
      *   *Strong on 1, 3:* By distributing nodes, it respects local knowledge (1) better than pure central planning. By using iterative shadow prices, it attempts to solve scarcity signaling (3) without private exchange.
      *   *Mixed on 2, 5:* It handles capital coordination (5) better than Lange via algorithmic intertemporal modeling. However, it still struggles with Dynamic Discovery (2); algorithms optimize within parameters but do not "dream" new production functions. Innovation remains exogenous to the model.
      *   *Weak on 4, 6:* Preference revelation (4) remains the bottleneck. Unless nodes use a token system indistinguishable from money, intensity of preference is lost. Aggregation (6) relies on the objective function of the optimizer, which implicitly imposes an intersubjective valuation.
      *   *Mixed on 7:* Modern supply chain algorithms show this works at the firm level, but scaling to an economy introduces latency and gaming of the nodes.
  *   **Verdict:** The most promising "third way," but it ultimately collapses into a simulation of the market. If the shadow prices are accurate, the system mimics private exchange. If the nodes have autonomy, they act as quasi-firms. It satisfies the technical constraints only by reintroducing market-like mechanisms under a different administrative name.

  ### Synthesis
  An adequate theory of economic calculation must acknowledge that the tension between **Information Dispersion (Desideratum 1)** and **Global Coordination (Desideratum 3)** is not an engineering problem to be solved, but a fundamental trade-off. The Austrian critique satisfies the desiderata by proving the impossibility of the task without property. Lange satisfies the logic but fails the epistemic constraints. The Federated Model bridges the gap technically but converges functionally toward market mechanisms. Therefore, a genuine resolution that avoids both central-planning failure and full market restoration must demonstrate a mechanism for **truthful preference revelation** and **entrepreneurial risk-bearing** that is decoupled from private capital ownership. No existing framework has fully satisfied this specific conjunction of requirements.
