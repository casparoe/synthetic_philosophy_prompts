      *   *Conclusions on Models/Frequency:* Do they survive? No. Optimality models are tools to test hypotheses, not just generate stories. G&L wanted *testing*, not the abandonment of modeling. The frequency claim ("most traits are not adaptations") is not in G&L 1979 and is empirically unsupported/undefinable.
