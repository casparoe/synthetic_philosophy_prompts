      *   **Tone:** Professional, precise, analytical, respectful of the user's expertise.

  2.  **Deconstruct the Book Chapter's Claims:**
      *   *Claim 1:* G&L attacked the habit of breaking organisms into traits and telling selection stories for each.
      *   *Claim 2:* Spandrel metaphor (San Marco) = features forced by geometry/development, decoration fits later.
      *   *Claim 3:* Biological spandrels = by-products of construction (e.g., male nipples, chin).
      *   *Claim 4:* Definition of Spandrel/Adaptation: If present usefulness wasn't the reason it evolved, it's a spandrel (e.g., feathers for flight).
      *   *Claim 5:* The "Double-Lock Rule": Adaptation requires selection *built* it for current role AND *maintains* it for that role.
