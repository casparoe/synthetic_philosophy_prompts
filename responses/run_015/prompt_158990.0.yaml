answer: |-
  Your hypothesis is correct. The chapter you read is performing a series of conceptual collapses that turn a methodological critique into an ontological claim. It conflates *history* (origin) with *maintenance* (current utility), *by-product* (non-selected origin) with *exaptation* (co-opted origin), and *methodological caution* with *empirical refutation*.

  Here is the audit you requested, breaking down the claims against the consensus of working evolutionary biologists and the text of Gould and Lewontin (1979).

  ### Audit of Claims

  **1. Claim:** G&L attacked the habit of atomizing organisms and telling selection stories for each trait.
  *   **Verdict:** **Accepted.**
  *   **Reasoning:** This is the core of the 1979 paper. They critiqued the tendency to treat traits as independent units of selection without considering developmental correlation or architectural constraint.

  **2. Claim:** The Spandrel metaphor implies features forced by geometry/development, where decoration fits later.
  *   **Verdict:** **Defensible Simplification (with historical caveats).**
  *   **Reasoning:** Biologically, this captures the concept of a "necessary by-product." If trait A is selected, and trait B arises inevitably due to the developmental physics of building trait A, B is a spandrel. The book captures the logic, even if the architectural history is messy (see below).

  **3. Claim:** Male nipples and the human chin are standard textbook spandrels.
  *   **Verdict:** **Mostly Accepted.**
  *   **Reasoning:** Male nipples are the canonical example of homology/constraint (selected in females, by-product in males). The chin is more debated but often cited as a structural consequence of bone growth patterns rather than direct selection.

  **4. Claim:** A trait whose present usefulness was not the reason it evolved counts as a spandrel (e.g., feathers for flight).
  *   **Verdict:** **Distortion.**
  *   **Reasoning:** This conflates *spandrel* with *exaptation*. Gould and Vrba (1982) introduced "exaptation" specifically to handle traits that were selected for *one* function and co-opted for another. Feathers were likely selected for insulation or display (an adaptation), then co-opted for flight (an exaptation). Calling them spandrels implies they were unselected by-products of *something else*, which is not the consensus view.

  **5. Claim:** The "Double-Lock Rule" (selection must build *and* maintain the trait for it to be an adaptation).
  *   **Verdict:** **Distortion / Attribution Error.**
  *   **Reasoning:** G&L did not propose this rule. This sounds like a conflation of George Williams's distinction between "adaptation" (historical process) and "adaptedness" (current state). G&L argued that *origin* stories require evidence, but they did not mandate that current maintenance must be for the *same* role to count as an adaptation in a broader sense. They wanted to sever the automatic link between *current utility* and *historical origin*.

  **6. Claim:** Methodological Moral: Null hypothesis should be non-adaptation; adaptationists bear the burden of proof.
  *   **Verdict:** **Defensible Simplification.**
  *   **Reasoning:** G&L argued that adaptation should not be the *default* assumption without testing alternatives (drift, constraint, correlation). While they didn't phrase it as a statistical "null hypothesis," this is the standard methodological takeaway adopted by the field. It is a fair summary of their procedural demand.

  **7. Claim:** Upshot: Adaptationist programme refuted; form driven *mainly* by constraint; *most* traits are not adaptations.
  *   **Verdict:** **Gould and Lewontin would reject.**
  *   **Reasoning:** This is the chapter's greatest error. G&L explicitly stated they were not denying the centrality of natural selection. They argued against the *exclusivity* of adaptationist explanations, not the *primacy* of selection in general. They made no quantitative claim about "most" traits. That is an empirical question they left open.

  **8. Claim:** Non-functional genome is the molecular vindication of the critique.
  *   **Verdict:** **Anachronism / Distortion.**
  *   **Reasoning:** The 1979 paper predates the genomic era. While "junk DNA" fits the spandrel/constraint logic, attributing this as the *conclusion* of the 1979 argument is historically false. Furthermore, the functionality of non-coding DNA is still debated; using it as a "vindication" is scientifically premature.

  ### The Double-Lock and Co-option

  The "double-lock rule" does not follow from G&L's argument, and it breaks when applied to co-option followed by refinement.

  G&L's argument was about **inference**, not **definition**. They argued that observing current utility does not allow you to infer historical origin. The book chapter turns this into a definition: "If history doesn't match utility, it's not an adaptation."

  Consider a trait that is co-opted and then extensively reshaped (e.g., the mammalian ear bones from jaw bones).
  1.  **Origin:** Jaw support (Adaptation).
  2.  **Transition:** Co-option (Exaptation).
  3.  **Refinement:** Selection reshapes them for hearing (Adaptation).

  Under the book's "double-lock," because the *original* origin wasn't for hearing, the ear bones are spandrels with respect to hearing. This renders the term "adaptation" useless for any trait with a deep evolutionary history, which is all of them. G&L acknowledged that once a spandrel or exaptation is recruited, it can become the subject of *new* selection and become an adaptation for the *new* role. The book's rule erases the "reshaping" phase, treating the trait's history as frozen at its inception.

  ### Implications for Your Lab's Models

  Do the chapter's conclusions about optimality modeling survive correction? **No.**

  1.  **Refutation vs. Correction:** G&L did not refute optimality modeling; they critiqued *uncritical* storytelling. An optimality model that explicitly compares a selection hypothesis against a constraint hypothesis is exactly what G&L asked for. If your lab builds game-theoretic models that test whether a signaling strategy is an ESS against alternatives, you are already doing the testing G&L demanded.
  2.  **The Null Hyposis:** If you adopt the book's "Null = Non-adaptation," you risk paralyzing your research. In behavioral ecology, the "null" is often a simpler behavioral rule or a physical constraint, not "no selection." If you assume a foraging behavior is non-adaptive until proven otherwise, you ignore the baseline expectation that behavior is costly and usually pruned by selection. The sensible takeaway is "Null = Simplest plausible mechanism (which may be selection)," not "Null = Noise."
  3.  **Frequency of Spandrels:** The claim that "most traits are not adaptations" does not survive. There is no census of traits. In behavioral ecology, where traits are often plastic responses to immediate environments, the adaptationist heuristic works better than in morphology, where developmental constraint is tighter. The book generalizes a morphological critique to behavior without justification.

  ### The Frequency Question

  Is the frequency question even the one the paper raises? **No.**

  G&L's paper is philosophical and methodological, not empirical. They argue that even if adaptations are 90% of traits, the *method* of assuming adaptation for the 10% that are spandrels leads to systematic error. They were concerned with the **logic of inference**, not the **pie chart of phenotypes**. The book's focus on "how common spandrels are" misses the point. The point is that you cannot distinguish the 10% from the 90% without considering non-adaptive hypotheses.

  ### The Architectural Metaphor

  Your philosopher friend is right: the architectural example is shaky.
  *   **Technicality:** In architecture, a *spandrel* is the space between two arches. A *pendentive* is the curved triangle that allows a circular dome to sit on a square room. St. Mark's Basilica uses pendentives. The space is not "forced" in the sense of being unavoidable waste; it is a structural solution.
  *   **Relevance:** Does this break the biological argument? **No, but it weakens the intuition.**
      *   If the architectural spandrel is a *necessary structural consequence*, the biological analogy holds: Trait B is a necessary developmental consequence of Trait A.
      *   If the architectural spandrel is *itself a designed solution* (which pendentives are), the analogy fails, because it implies the "by-product" was actually selected for (architecturally) to solve a problem.
      *   **Verdict:** The argument does not *depend* on the architecture being perfect. The biological logic of developmental constraint stands on its own (e.g., surface area to volume ratios, physical linkage of traits). However, the book's reliance on the metaphor to imply "inevitability" is rhetorically bolstered by a historical misunderstanding. The biological concept of "constraint" is robust; the Venetian tour guide version of it is not.

  ### Summary of the Conflation

  You identified that the book runs together distinctions. Here is exactly where the slide happens:

  1.  **Not selected for origin** $\rightarrow$ **Spandrel.** (Ignores Exaptation).
  2.  **Spandrel** $\rightarrow$ **Non-adaptive now.** (Ignores subsequent refinement).
  3.  **Methodological Caution** $\rightarrow$ **Empirical Refutation.** (Ignores G&L's explicit support of selection).
  4.  **Some traits are spandrels** $\rightarrow$ **Most traits are spandrels.** (Unwarranted generalization).

  **Conclusion:**
  The chapter is a "strong programme" version of G&L. It takes a plea for methodological pluralism and turns it into a dogma of non-adaptation. For your work in behavioral ecology, the 1979 paper remains a vital check against storytelling, but the book's interpretation would indeed embarrass your department because it abandons the central tool of your field (optimality modeling) based on a misreading of the critique. You should trust your hypothesis: the book's force comes from sliding between historical origin, current utility, and developmental necessity. G&L asked you to separate those; the book asks you to fuse them.
