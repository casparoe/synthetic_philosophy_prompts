      *   *Specific Questions:* Audit claims, Double-Lock validity, Co-option handling, Conclusions on models/frequency, Frequency question relevance, Architectural metaphor validity.

  3.  **Evaluate Claims against Consensus and G&L (1979):**

      *   *Claim 1 (Attack on trait isolation):* **Mostly Accurate.** G&L did critique the atomization of phenotypes. However, they didn't say *never* do it, but rather that it's often done without testing alternatives.
      *   *Claim 2 & 3 (Spandrel metaphor/examples):* **Mixed/Problematic.** The architectural analogy is famous but historically shaky (see point on pendentives). Male nipples are a classic example of homology/constraint, but the chin is debated. The definition "by-product of construction" is the core G&L definition.
      *   *Claim 4 (Feathers/Exaptation):* **Distortion/Conflation.** This is the big one. G&L discussed spandrels (by-products). They did *not* coin "exaptation" (Gould & Vrba 1982 did). A trait co-opted for a new use is an *exaptation*, not necessarily a spandrel in the strict sense, especially if refined by selection later. Calling feathers spandrels *with respect to flight* is technically okay if referring to origin, but calling them spandrels *simpliciter* ignores the subsequent adaptation.
      *   *Claim 5 (Double-Lock Rule):* **Distortion.** G&L did not propose a strict "double-lock" (origin + maintenance). They argued against assuming *origin* was adaptive without evidence. Current maintenance is often assumed if the trait persists, but the key critique was about *origin* stories. The "double-lock" sounds like a later simplification or a conflation with "current utility vs. historical origin."
      *   *Claim 6 (Null Hypothesis):* **Defensible Simplification / Methodological Shift.** G&L argued adaptation shouldn't be the *only* hypothesis. They didn't necessarily say "Null = Non-adaptation" in a statistical sense, but rather "Consider alternatives (constraint, drift, correlation)." However, this is a fair methodological takeaway adopted by many.
      *   *Claim 7 (Upshot: Refuted, Mainly Constraint, Most traits non-adaptations, Genome):* **Major Distortion.** G&L never claimed selection was secondary *overall*. They claimed the *programme* (methodology) was flawed. They did not quantify "most traits." The genome argument (junk DNA) came later (1990s/2000s) and wasn't in the 1979 paper. Saying the programme was "refuted" is too strong; it was "corrected" or "balanced."

