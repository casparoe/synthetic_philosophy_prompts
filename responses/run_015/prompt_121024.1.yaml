answer: |-
  ### Preface: Settled Physics vs. Contested Metaphysics

  Before engaging the taxonomy, students must distinguish between the formal structure of Special Relativity (SR) and its ontological interpretation.
  *   **Settled Physics:** In flat Minkowski spacetime, the Lorentz transformations dictate that there is no frame-invariant relation of simultaneity. Two events spacelike separated may be ordered differently by observers in different inertial frames. This is a structural feature of the metric, not an epistemic limitation.
  *   **Contested Metaphysics:** It is *not* settled whether this structural feature exhausts ontological reality. Philosophers dispute whether "existence" must be Lorentz-invariant, whether temporal becoming requires a global "now," and whether metaphysical posits (like a hidden foliation) are permissible if they are empirically inaccessible. The Rietdijk--Putnam argument attempts to move from the settled physics to a specific metaphysical conclusion (Eternalism); the tree below maps the resistance to that move.

  ***

  ### Decision-Tree Taxonomy

  **Node 1:** Does the physical absence of an invariant simultaneity relation entail the metaphysical absence of a privileged global present?
  *   **No** (Metaphysics may exceed physics) → Go to Node 2.
  *   **Yes** (Physics constrains metaphysics) → Go to Node 4.

  **Node 2:** Can a privileged foliation of spacetime be recovered in a Lorentz-invariant manner (e.g., via cosmological structure)?
  *   **Yes** → Go to Node 3.
  *   **No** (It is purely hidden) → Go to Node 3.

  **Node 3:** Is any such recovery (or positing) of a privileged foliation metaphysically relevant for temporal becoming, rather than merely epistemically hidden?
  *   **Yes** → **Leaf A** (Presentism + Privileged Foliation).
  *   **No** → **Leaf B** (Instrumentalist / Deflationary View).

  **Node 4:** Which argumentative pressure regarding reality is taken as primary?
  *   **Rietdijk-style** (Disagreement on simultaneity planes for distant events) → Go to Node 5.
  *   **Putnam-style** (Transitivity of 'is real' relative to an observer's present) → Go to Node 7.

  **Node 5:** Is ontological reality global (shared by all observers) or local (relative to an observer's worldline)?
  *   **Global** → **Leaf C** (Relativized Global Presentism).
  *   **Local** → Go to Node 6.

  **Node 6:** If reality is local, what is the boundary of the real region for an observer at a point?
  *   **The Past Light-Cone** (including the vertex) → **Leaf D** (Local Presentism / Fragmentalism).
  *   **The Point-like Present** (vertex only) → **Leaf E** (Solipsistic Presentism).

  **Node 7:** Is the future determinately real relative to an observer's present moment?
  *   **Yes** → **Leaf F** (Four-Dimensionalist Eternalist Block).
  *   **No** → Go to Node 8.

  **Node 8:** If the future is unreal, along what geometric structure does reality "grow"?
  *   **Along Past Light-Cones** (Causal becoming) → **Leaf G** (Growing-Block / Stein View).
  *   **Along Spacelike Hypersurfaces** (Global becoming without preferred frame) → **Leaf H** (The Empty View).

  ***

  ### Leaf Descriptions and Diagnoses

  **Leaf A: Presentism combined with a privileged but observationally inaccessible foliation.**
  *   **Statement:** Only events on a single, metaphysically privileged spacelike hypersurface exist, despite this slice being undetectable by physical experiment.
  *   **Most Awkward Commitment:** It requires accepting a "conspiracy" of nature where the fundamental laws hide the true ontological structure from all possible empirical verification, violating the spirit of methodological naturalism.

  **Leaf B: Instrumentalist / Deflationary View.**
  *   **Statement:** A privileged foliation may exist but carries no metaphysical weight for existence, rendering the distinction between presentism and eternalism verbal.
  *   **Most Awkward Commitment:** It risks rendering the concept of "temporal becoming" vacuous, as the privileged 'now' does no work in distinguishing what is real from what is not.

  **Leaf C: Relativized Global Presentism.**
  *   **Statement:** Reality is global but frame-dependent, meaning contradictory states of affairs (different sets of simultaneous events) are equally real for different observers.
  *   **Most Awkward Commitment:** It entails a radical fragmentation of truth where "what exists" is not a monadic fact but a dyadic relation, challenging the notion of a single objective world.

  **Leaf D: Local Presentist or Fragmentalist View (Past Light-Cone).**
  *   **Statement:** For any observer, only events within or on their past light-cone are real, denying reality to spacelike separated events.
  *   **Most Awkward Commitment:** It implies that two observers at the same spacetime point may disagree on the reality of a third distant event depending on their relative velocity, leading to a fractured ontology.

  **Leaf E: Solipsistic Presentism.**
  *   **Statement:** Only the instantaneous event of the observer's current experience is real, with the past and future both unreal.
  *   **Most Awkward Commitment:** It cannot account for the truth of statements about the past (e.g., "dinosaurs existed") without positing truthmakers that, by the view's own definition, do not exist.

  **Leaf F: The Four-Dimensionalist Eternalist Block.**
  *   **Statement:** All points in Minkowski spacetime exist equally and tenselessly, with temporal passage being an illusion of consciousness.
  *   **Most Awkward Commitment:** It must explain away the vivid phenomenological experience of temporal flow and the openness of the future as purely psychological constructs with no ontological basis.

  **Leaf G: The Growing-Block View Modified for Minkowski Spacetime.**
  *   **Statement:** The past and present are real and fixed, while the future is unreal, with reality growing along the causal structure of light-cones.
  *   **Most Awkward Commitment:** It struggles to define the "edge" of reality (the present) in a way that is not frame-dependent, often forcing a choice between relativized becoming or a hidden preferred frame.

  **Leaf H: The Empty View (Global Becoming without Preferred Frame).**
  *   **Statement:** Reality grows globally along spacelike slices, yet no specific foliation is metaphysically privileged or physically recoverable.
  *   **Most Awkward Commitment:** **Diagnosis:** This position is currently undefended because it appears incoherent; one cannot define "global growth along spacelike slices" without specifying *which* slices, and specifying slices without a physical or metaphysical criterion violates the starting commitment of Node 1.

  ***

  ### Taxonomy Overlap Flag

  **Pair:** Leaf D (Local Presentist / Past Light-Cone) and Leaf G (Growing-Block / Stein View).

  **Explanation of Overlap:**
  The distinction between these leaves is often merely terminological rather than metaphysical. Both views locate the boundary of reality at the causal past of the observer. The overlap arises because the "Growing Block" typically claims the past is real and the future unreal, while the "Light-Cone Presentist" claims only the causal past is real. If the Growing Blocker includes the vertex (the "now") in the real region, and the Light-Cone Presentist includes the interior of the cone, the ontological extensions are nearly identical. The disagreement reduces to whether the instantaneous "now" is part of the "block" or the "present," a distinction that lacks empirical or logical consequence in Minkowski spacetime. This overlap highlights the difficulty of carving out a stable "present" in a relativistic context without invoking a preferred foliation (Leaf A).
