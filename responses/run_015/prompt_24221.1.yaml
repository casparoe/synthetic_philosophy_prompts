      Wait, (3) vs (5) is just the practical application of (1) vs (5). I should combine them or treat (1) vs (5) as the theoretical root and (3) vs (5) as the practical symptom. Better to treat (1) vs (5) as the root.
      Actually, (3) claims habitat destruction is "welfare-positive." That is consistent with (5) *if* (5) is separate. But the *endorsement* of (3) implies welfare dominates.
