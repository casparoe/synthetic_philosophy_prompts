      *   British English? Yes.

      *(Self-Correction during drafting)*: I need to be careful not to say Thesis 2 is "False". It's a major philosophical position. I should label it "Substantive and Defensible (but contested)".
      Also, need to make sure I address the specific A/B ambiguity dispute. Putnam's theory actually struggles with "dual extension" cases. I should admit that.

      *Final Plan:*
