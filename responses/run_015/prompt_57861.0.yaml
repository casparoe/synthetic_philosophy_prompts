  # The Time-Travel Intuition Quiz

  Welcome to the book club sorting tool. This quiz is designed to help you figure out which "rules of time" feel most natural to you. There are no right or wrong answers. Read each short situation and pick the reaction that matches your gut feeling about how the story *should* work.

  ### Part 1: The Three Core Cases

  **1. The Toolbox**
  A traveler goes back to 1950 and leaves a special wrench in a shed. In 1970, a young mechanic finds that wrench, uses it to build a time machine, and travels back to 1950 to leave the wrench.
  *   **Reaction 1:** The wrench has no origin; it is stuck in a circle where it creates itself.
  *   **Reaction 2:** The wrench came from a different version of 1970 than the one in the history books.
  *   **Reaction 3:** A tool cannot exist without a factory; this story breaks the rules of reality.

  **2. The Prevention**
  A traveler goes back and hides a fuel cell needed for their own departure. They are now standing in the past, holding the cell, clearly remembering that they did depart.
  *   **Reaction 1:** Something will stop them from hiding it; the departure must happen as remembered.
  *   **Reaction 2:** They hid it, so the departure in *this* timeline won't happen, but the traveler is from somewhere else.
  *   **Reaction 3:** They hid it, the machine vanishes from the future, but they stay in the past because they already arrived.

  **3. The Picnic**
  A traveler goes back for an afternoon, leaves footprints and crumbs in a field, and returns. History books in their present day are otherwise unchanged.
  *   **Reaction 1:** The footprints were always there in the history books, you just didn't notice them before.
  *   **Reaction 2:** The footprints happened in a copy of the past, not the *real* past that made your books.
  *   **Reaction 3:** If they were there, the books would be different; since they aren't, the travel didn't work.

  ### Part 2: Six Further Cases

  **4. The Meeting**
  A traveler goes back ten minutes and meets themselves before they left. Now there are two of them in the same room.
  *   **Reaction 1:** Two people cannot occupy the same space-time; one of them shouldn't exist.
  *   **Reaction 2:** The second person is a twin from a split timeline, not the same person.
  *   **Reaction 3:** It's a glitch, but they both stay; the universe just handles the overlap.

  **5. The Historical Figure**
  A traveler goes back to stop a famous leader from giving a speech that started a war.
  *   **Reaction 1:** They will try, but the speech will happen anyway due to some accident or delay.
  *   **Reaction 2:** They stop the speech, creating a new present where the war never started.
  *   **Reaction 3:** They stop the speech, and the traveler begins to fade away as the war is erased.

  **6. The Souvenir**
  A traveler brings a gold coin from the past to the present. The coin has a date on it that shouldn't exist yet.
  *   **Reaction 1:** The coin was always in the present; the traveler just brought it to light.
  *   **Reaction 2:** The coin vanishes if the traveler changes the past enough to alter its minting.
  *   **Reaction 3:** The coin is real, but it originated in a different timeline than the one you are in.

  **7. The Return Ticket**
  After spending a week in the past, the traveler tries to return to their original "now."
  *   **Reaction 1:** They return to the exact moment they left, nothing changed.
  *   **Reaction 2:** They return to a "now" that has been altered by their week away.
  *   **Reaction 3:** They cannot return to their original "now"; they arrive in a slightly different version of home.

  **8. The Warning**
  A traveler tells their past self not to get into the time machine.
  *   **Reaction 1:** The past self ignores the warning or the machine breaks anyway; the trip happens.
  *   **Reaction 2:** The past self listens, the trip is cancelled, and the traveler never exists to give the warning.
  *   **Reaction 3:** The past self listens, creating a branch where the trip never happens, but the traveler remains.

  **9. The Aging**
  A traveler spends a year in the past but only ages one week because they are "outside" of time flow.
  *   **Reaction 1:** Time passes for everyone equally; if they spend a year there, they age a year.
  *   **Reaction 2:** It's contradictory, but the story allows them to age slowly while the world moves fast.
  *   **Reaction 3:** They are in a separate stream of time, so their aging doesn't have to match the past.

  ***

  # Scoring and Logical Framework

  ### 1. The Logical Space
  To understand your results, we first need to map the possible ways to think about time. Your answers effectively flip three switches:

  1.  **Possibility:** Is backward time travel possible? (Yes / No)
  2.  **Singularity:** Is there only one past? (One / Many)
  3.  **Consistency:** Must events make logical sense without contradiction? (Yes / No)

  Combining these switches creates eight theoretical combinations. However, only four are stable enough to support a story or a belief system. These are the four "leaves" this quiz sorts you into:

  *   **The Wall (No-Backward-Travel):** Travel is **No**. (Singularity and Consistency are moot).
  *   **The Lock (Fixed Single-Timeline):** Travel is **Yes**, Past is **One**, Logic is **Consistent**. (You can go, but you can't change what happened).
  *   **The Fork (Branching Timeline):** Travel is **Yes**, Past is **Many**, Logic is **Consistent**. (You can go and change things, but it creates a new branch).
  *   **The Flood (Anything-Goes Single-Timeline):** Travel is **Yes**, Past is **One**, Logic is **Inconsistent**. (You can go, change things, and overwrite the same timeline even if it creates a paradox).

  **Unoccupied Combinations:**
  *   *Travel Yes / Past Many / Logic Inconsistent:* This suggests a multiverse where contradictions happen *within* a single branch. This is generally **incoherent**; if branches exist, they usually exist to preserve consistency within themselves.
  *   *Travel No / Past One / Logic Consistent:* This is simply **The Wall**.
  *   *Travel No / Past Many:* This is **unexplored** in fiction; if travel is impossible, branching timelines are usually irrelevant to the character.

  **Indistinguishable Pairs:**
  *   **The Lock vs. The Flood:** If a story does not show a contradiction failing (Lock) or succeeding (Flood), these feel the same. The quiz tries to separate them by asking about "vanishing" or "overwriting."
  *   **The Fork vs. The Lock:** If the "branch" looks identical to the original timeline from the traveler's perspective, these are hard to separate. The quiz distinguishes them by asking about the origin of objects (Toolbox) or the ability to return home (Return Ticket).

  ### 2. How to Score
  Tally your answers using the key below. Mark a tick for the position listed next to your chosen reaction.

  | Question | Reaction 1 | Reaction 2 | Reaction 3 |
  | :--- | :--- | :--- | :--- |
  | **1. Toolbox** | **Lock** | **Fork** | **Wall** |
  | **2. Prevention** | **Lock** | **Fork** | **Flood** |
  | **3. Picnic** | **Lock** | **Fork** | **Wall** |
  | **4. Meeting** | **Wall** | **Fork** | **Flood** |
  | **5. Historical** | **Lock** | **Fork** | **Flood** |
  | **6. Souvenir** | **Lock** | **Flood** | **Fork** |
  | **7. Return** | **Lock** | **Flood** | **Fork** |
  | **8. Warning** | **Lock** | **Flood** | **Fork** |
  | **9. Aging** | **Wall** | **Flood** | **Fork** |

  **Calculate Your Position:**
  *   **Most Ticks = Your Position.**
  *   *Tie-Breaker:* If you tie between **Lock** and **Flood**, you likely accept single-timeline travel but haven't decided if contradictions are allowed. If you tie between **Lock** and **Fork**, you likely accept consistent travel but haven't decided if the timeline splits or bends.

  ***

  # Summary of Positions

  | Position label | Typical answer pattern | Core commitment in one sentence | Story moment it finds hardest to handle |
  | :--- | :--- | :--- | :--- |
  | **The Wall** (No-Backward-Travel) | High scores on "Impossible" or "Broken" reactions. | Backward time travel is physically or logically impossible, so stories about it are fantasy. | Explaining why the story feels so compelling if the premise is false. |
  | **The Lock** (Fixed Single-Timeline) | High scores on "Always Happened" or "Will Fail" reactions. | You can travel to the past, but you cannot change it because you already were there. | Explaining where free will goes if the traveler's actions are predetermined. |
  | **The Fork** (Branching Timeline) | High scores on "Different Version" or "Copy" reactions. | Traveling back creates or enters a separate timeline, so changes don't erase your origin. | Explaining why the traveler cares about saving a world they can no longer reach. |
  | **The Flood** (Anything-Goes Single) | High scores on "Vanish," "Overwrite," or "Glitch" reactions. | You can travel back and change the single timeline, even if it creates logical contradictions. | Explaining how the traveler exists after erasing the cause of their existence. |
