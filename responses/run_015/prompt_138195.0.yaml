answer: |-
  Here is a menu of distinct precise theses underlying the claim that the composition dispute is "merely verbal," evaluated against your criteria and tested against your two complications.

  ### The Menu of "Merely Verbal" Theses

  #### 1. The Semantic Ambiguity Thesis
  **Thesis:** The parties are using the existential quantifier ("there are") or the sortal term ("object") with different semantic contents. One side uses a restrictive sense (requiring causal unity, etc.), the other a permissive sense (any arrangement suffices). They are talking past one another.
  *   **Platitude?** Close to one. It is trivially true that words can have different meanings. It becomes non-trivial only if claimed that this *is* what is happening here rather than a substantive disagreement.
  *   **Substantive/Defensible?** Weak. Participants usually insist they mean the standard logical "exists." Asserting ambiguity often feels like an uncharitable interpretation of the debaters' intentions.
  *   **False?** Possibly. If the logical form of their claims is identical (e.g., both use standard first-order logic), this thesis is false.
  *   **Dismissive Force?** High. If they are talking past each other, there is no shared subject matter to argue about.
  *   **Entitles moving on?** Yes, but only to clarify definitions, not to do metaphysics.

  #### 2. The Quantifier Variance Thesis (Hirsch-style)
  **Thesis:** The parties agree on all non-linguistic facts (the distribution of simples) but employ equally eligible "languages" or conceptual schemes. There is no fact of the matter regarding which quantifier meaning is the "correct" one; both map onto the world without distortion.
  *   **Platitude?** No. It requires the substantive meta-ontological claim that multiple quantifier meanings are metaphysically on a par.
  *   **Substantive/Defensible?** Yes, this is a robust meta-ontological position (Eli Hirsch). However, it is heavily contested (e.g., by Ted Sider).
  *   **False?** Defenders of "ontological realism" (like Sider) argue it is false because there is a single "structure of the world" that only one quantifier captures.
  *   **Dismissive Force?** High. It implies the debate is a choice of language, not a discovery of reality.
  *   **Entitles moving on?** Yes. It converts a metaphysical dispute into a pragmatic or linguistic choice.

  #### 3. The Truth-Value Relativism Thesis
  **Thesis:** The disputed sentences have no language-independent truth value. Truth is relative to a conceptual scheme. The Nihilist is true-in-Nihilism; the Universalist is true-in-Universalism. There is no "true simpliciter."
  *   **Platitude?** No. This is a form of anti-realism regarding ontology.
  *   **Substantive/Defensible?** Yes, but costly. It requires abandoning the principle of bivalence for ontological claims or adopting a framework-relative notion of truth.
  *   **False?** Realists argue it is false; there is a mind-independent reality that makes one side wrong.
  *   **Dismissive Force?** Medium. It doesn't say the debate is confused, but that it lacks a unique resolution.
  *   **Entitles moving on?** Yes, in the sense that no further argument can resolve it "absolutely."

  #### 4. The Joint-Carving Failure Thesis (Sider-style)
  **Thesis:** A dispute is substantive only if it concerns terms that "carve nature at the joints" (refer to fundamental structure). If "exists" or "object" does not pick out a fundamental natural property, the dispute is merely verbal *unless* one side can show their usage is more natural than the other.
  *   **Platitude?** No. It relies on a specific theory of metaphysical structure (Lewis/Sider).
  *   **Substantive/Defensible?** Yes. This is the leading contemporary realist alternative to Quantifier Variance.
  *   **False?** Anti-realists about structure argue it is false. Realists argue it is true but that "exists" *does* carve at the joints.
  *   **Dismissive Force?** Conditional. It dismisses the dispute *only if* neither usage is privileged. If one usage is more natural, the dispute is substantive.
  *   **Entitles moving on?** Only if you have already established that neither view is more natural. Otherwise, it shifts the debate to "which language is more natural?"

  #### 5. The Pragmatic/Instrumentalist Thesis
  **Thesis:** The question "Do composite objects exist?" is not a question of truth but of utility. The real question is which language serves our explanatory or practical purposes better.
  *   **Platitude?** Semi-platitude. Everyone agrees language should be useful. It is non-trivial to claim that utility *replaces* truth here.
  *   **Substantive/Defensible?** Yes (Carnapian). Defensible if one thinks ontological questions are internal to frameworks.
  *   **False?** False if one believes ontology is descriptive rather than prescriptive.
  *   **Dismissive Force?** High. It changes the subject from "what is there?" to "what should we say?"
  *   **Entitles moving on?** Yes, provided the group accepts the pragmatic shift.

  #### 6. The Ontological Deflationism Thesis
  **Thesis:** Existence is not a robust property. To say "X exists" is just to say "The concept X is instantiated" or logical consistency. Once we agree on the simples, there is no further "ontological glue" to debate.
  *   **Platitude?** No. It denies a robust notion of existence.
  *   **Substantive/Defensible?** Yes.
  *   **False?** Realists about existence argue it is false.
  *   **Dismissive Force?** High. It dissolves the metaphysical mystery.
  *   **Entitles moving on?** Yes.

  ---

  ### Most Likely Reading in Your Group
  Given the specific phrasing—"both sides agree about which simples there are and how they are arranged"—the speaker was most likely invoking **Reading 2: The Quantifier Variance Thesis**.

  This is the hallmark of Eli Hirsch's defense of verbalism in composition debates. The argument is specifically that the *non-linguistic facts* are exhausted by the simples and their arrangements, and since both sides agree on those, the disagreement must be about which linguistic rules map onto those facts. Reading 1 (Ambiguity) is usually too uncharitable (implying confusion), and Reading 4 (Joint-Carving) usually requires more argument about naturalness than the remark suggested. The remark assumes the agreement on simples *suffices* to make it verbal, which is the core of Quantifier Variance.

  ---

  ### Complication 1: The Second-Order Disagreement
  *Suppose the parties disagree about whether there is a language-independent fact as to which counting is natural/joint-carving.*

  *   **On Readings 1, 2, 3, 5, 6:** This second-order disagreement is **substantive**.
      *   If the original dispute is verbal because there is no fact of the matter (R2, R3, R6), then the claim *that there is no fact of the matter* is a substantive metaphysical claim about the structure of reality (or lack thereof).
      *   If one side says "Naturalness is objective" and the other says "Naturalness is a preference," they are disagreeing about meta-ontology. This is not verbal; it is a dispute about whether realism is true.
      *   **Does the "verbal" slogan survive?** No. The "verbal" claim pushes the substantive dispute up one level. You cannot dismiss the second-order dispute as verbal using the same logic, unless you adopt a global skepticism (Reading 3) that applies to *all* claims, including claims about naturalness.
  *   **On Reading 4 (Joint-Carving):** This second-order disagreement **is the dispute**.
      *   Reading 4 says the composition dispute is substantive *if and only if* one language is more natural. Therefore, disagreeing about whether naturalness is objective *is* the substantive core. It does not survive as a distinct dispute; it *becomes* the dispute.

  **Verdict:** The "merely verbal" claim generally fails to dissolve the second-order disagreement. It relocates the metaphysical weight from "Do tables exist?" to "Is existence a natural property?" or "Is there a privileged language?"

  ---

  ### Complication 2: Recalcitrant Attitudes
  *Suppose each side calls the other false and treats ordinary claims ("I bought a table") as true on their ontology and false on the other's.*

  *   **On Reading 1 (Ambiguity):** The "verbal" claim retains **full dismissive force**.
      *   If they mean different things, their mutual accusations of falsity are based on a confusion. The Nihilist hears "There exists a composite object" as "There exists a *fundamental* composite object" (False), while the Universalist means "There exists a *derivative* composite object" (True). The "verbal" claimant points out this equivocation.
  *   **On Reading 2 (Quantifier Variance):** The "verbal" claim retains **dismissiveness but requires charity**.
      *   Hirsch argues we should interpret opponents charitably. If they call each other false, they are mistaken about the status of their own language. The "verbal" claimant says: "You are both right in your own languages, but wrong to think the other is false *simpliciter*." The dispute is verbal, but the *attitude* is the error.
  *   **On Reading 3 (Relativism):** The "verbal" claim **loses dismissive force** regarding truth.
      *   If truth is scheme-relative, then the Nihilist is right to say the Universalist is false *relative to the Nihilist's scheme*. The "verbal" claimant cannot say "Stop arguing," only "Acknowledge that your 'false' is indexical."
  *   **On Reading 4 (Joint-Carving):** The "verbal" claim **loses dismissive force entirely** if one side is right about naturalness.
      *   If "exists" carves at the joints in only one way, one side is objectively false. Their insistence on falsity is correct. The "verbal" claim is itself false.
  *   **On Reading 5 (Pragmatic):** The "verbal" claim **changes the subject**.
      *   It says: "You are arguing about truth, but you should be arguing about utility." It dismisses the *value* of the argument, not the truth-claims.

  **Verdict:** The recalcitrance of the parties (insisting on truth-values) challenges Readings 2 and 3 most.
  *   For **Reading 2** to hold, the "verbal" claimant must argue that the parties are making a *metalinguistic error* in calling each other false.
  *   For **Reading 4** to hold, the "verbal" claimant must prove that *neither* side carves at the joints.
  *   **Does the slogan retain dismissive force?** Only if the "verbal" claimant can demonstrate that the truth-claims themselves are misguided (R1, R2, R6). If the parties are willing to dig in on "No, there really is a fact of the matter," the "merely verbal" remark functions not as a conclusion, but as an invitation to a meta-ontological debate (Complication 1).

  ### Summary Recommendation for the Group
  If you wish to take the remark seriously, treat it as an invocation of **Quantifier Variance (Reading 2)**. However, be prepared to acknowledge that this does not end metaphysics; it merely shifts the burden to defending the claim that *multiple ontological languages are equally eligible*.

  If your group members insist on the falsity of the opposing view, they are implicitly rejecting Quantifier Variance and committing to **Ontological Realism (Reading 4)**. In that case, the "merely verbal" remark is not a conversation-stopper, but a substantive challenge: *"Prove that your quantifier carves nature at the joints better than mine."* That is a difficult, but genuinely metaphysical, question.
