      *   *Self-Correction on "False":* Don't declare them false, but note if prominent philosophers (like Sider) argue they are.
      *   *Most Likely:* The prompt mentions "agree about which simples there are and how they are arranged." This is the hallmark of Eli Hirsch's *Quantifier Variance*. I should highlight this.

