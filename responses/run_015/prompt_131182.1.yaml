answer: |-
  This is a classic late-night physics/philosophy rabbit hole. You're right to suspect Jake is mixing up distinct categories (physics, metaphysics, and modality), but he also got some of the hard physics surprisingly right.

  Here is a point-by-point breakdown of Jake's claims, separating the solid physics from the philosophical overreach.

  ### 1. The Andromeda Paradox & Walking Speed
  **Jake's Claim:** *Walking toward Andromeda shifts your "present" to include events centuries in the future relative to a stationary observer.*
  **Verdict:** **Physically Accurate, Metaphysically Contested.**

  *   **The Physics:** Jake is correct here. This is the "Andromeda Paradox" (popularized by Roger Penrose, based on Rietdijk's work). In Special Relativity, your "plane of simultaneity" tilts based on your velocity. Because Andromeda is 2.5 million light-years away, even a tiny tilt caused by walking speed results in a massive shift in what events are considered "simultaneous" with you.
      *   If you walk *toward* Andromeda, your "now" slice cuts into Andromeda's future.
      *   If you walk *away*, your "now" slice cuts into Andromeda's past.
      *   The difference between the two walkers can be days or weeks of Andromeda time, despite them passing each other at walking speed on Earth.
  *   **The Overstatement:** Jake implies this *proves* the future events "exist." The math proves the *coordinates* of "now" are relative. It does not strictly prove that the events located at those coordinates are ontologically real. It proves Presentism is *awkward* in SR, but not logically impossible (more on that in point 5).

  ### 2. Putnam's Argument
  **Jake's Claim:** *Putnam said this kills presentism dead... all events past present and future must be equally real.*
  **Verdict:** **Mostly Accurate, but "Proof" is too strong.**

  *   **What Putnam Actually Argued:** In his 1967 paper *"Time and Physical Geometry,"* Hilary Putnam argued that if we accept Special Relativity and a few reasonable assumptions about reality (specifically, that "real" is transitive: if A is real to B, and B is real to C, then A is real to C), then Presentism leads to a contradiction.
  *   **The Nuance:** Putnam wasn't claiming SR *empirically discovers* the future. He was arguing that **Presentism is incompatible with the structure of SR.** He argued that if you want to keep Presentism, you have to reject the standard interpretation of SR.
  *   **Jake's Error:** He treats it as a physical discovery ("SR proves the future exists") rather than a metaphysical argument ("If SR is true, Presentism is likely false"). There is a difference between a theory describing geometry and that geometry dictating existence.

  ### 3. Block Universe vs. Determinism (The Big Error)
  **Jake's Claim:** *If future events are already 'there' in the block then nothing can change them, so free will is an illusion. This is basically the same argument as determinism.*
  **Verdict:** **Wrong. This is a Category Error.**

  *   **Ontology vs. Modality:** Jake is conflating **Eternalism** (ontology: *what* exists) with **Determinism** (modality: *how* events are caused).
      *   **Eternalism:** Past, present, and future all exist equally in a 4D block.
      *   **Determinism:** Every event is necessitated by antecedent events and laws of nature.
  *   **Why they are different:** You can have a **Block Universe that is Indeterministic.** Imagine a universe where quantum events are truly random. In the Block Universe view, those random outcomes are "fixed" in the block (e.g., at coordinate *t=10, x=5, the particle decayed*). They are "there" eternally, but they were not *determined* by prior causes; they were probabilistic.
  *   **The "Fixed" Fallacy:** Just because the future is "there" in the block doesn't mean it was causally determined from the past. It just means it *is*. Think of a DVD of a movie. The whole movie exists on the disc (Block Universe). But the plot of the movie might involve a character flipping a coin that lands heads. The "heads" is fixed on the disc, but within the story, it was a chance event.
  *   **Free Will:** Compatibilists argue free will is compatible with determinism anyway, but regardless, the Block Universe does not *entail* hard determinism. Jake needs to drop this point; it's a philosophical conflation.

  ### 4. Presentist Strategies & The Lorentzian Ether
  **Jake's Claim:** *Presentists nowadays mostly try to save themselves by going back to Lorentz's ether with a hidden absolute time... philosophers of physics mostly think thats debunked.*
  **Verdict:** **Partially Accurate, but "Debunked" is too strong.**

  *   **Neo-Lorentzianism:** It is true that some Presentists (like philosopher William Lane Craig) argue for a "Neo-Lorentzian" interpretation. This view says there *is* a privileged frame of reference (absolute time), but physical effects (length contraction, time dilation) hide it from us, making SR *look* true.
  *   **Is it Debunked?** Empirically? **No.** Special Relativity and Lorentz Ether Theory are empirically equivalent. They make the exact same predictions. You cannot run an experiment to distinguish them.
  *   **Why Philosophers Dislike It:** It is rejected on grounds of **parsimony** (Occam's Razor), not empirical falsification. Positing an undetectable ether is seen as metaphysically wasteful.
  *   **Other Strategies:** Jake is wrong that this is the *only* strategy. Many Presentists try to reinterpret SR without ether (e.g., arguing that simultaneity is frame-dependent but "existence" is not), or they argue for a "Fragmentalist" view where different observers have different equally real "presents." It's not just "Ether or bust."

  ### 5. The Philosophical Consensus
  **Jake's Claim:** *Philosophers of physics mostly think... eternalism is the default view.*
  **Verdict:** **Exaggerated.**

  *   **The Data:** According to the major **PhilPapers Survey (2020)** of professional philosophers:
      *   **Eternalism:** ~45-50%
      *   **Presentism:** ~20-25%
      *   **Other:** The rest.
  *   **The Landscape:** Eternalism is the *plurality* view, especially among philosophers of physics, but Presentism is far from dead. It is a "live debate." Many philosophers argue that our strong phenomenological experience of time (the "flow") outweighs the abstract metaphysical arguments from SR.
  *   **Physics vs. Philosophy:** Physicists tend to lean Eternalist (because the math works better that way). Philosophers are more split (because "existence" is a philosophical concept, not just a coordinate).

  ### Summary Scorecard for Your Argument

  | Claim | Verdict | Notes for your next talk with Jake |
  | :--- | :--- | :--- |
  | **Andromeda/Walking Speed** | ✅ **Accurate** | The physics is real. Small velocity + huge distance = big time shift. |
  | **Putnam Kills Presentism** | ⚠️ **Nuanced** | Putnam showed they are *incompatible*, not that SR empirically "proves" the future exists. |
  | **Block Universe = Determinism** | ❌ **Wrong** | **This is his biggest error.** Ontology $\neq$ Causality. You can have a random Block Universe. |
  | **Presentists = Ether Only** | ⚠️ **Misrepresented** | Some use Ether, but many don't. Ether isn't "debunked," just considered unparsimonious. |
  | **Eternalism is Default** | ⚠️ **Exaggerated** | It's the leading view, but Presentism holds ~25% of professional philosophers. It's not settled. |

  ### How to Respond
  You can concede the physics to him (the Andromeda paradox is real), but hold your ground on the metaphysics.

  **Tell him:** "You got the Rietdijk-Putnam physics right, but you're conflating **ontology** with **modality**. The Block Universe says the future *exists*, not that it was *determined*. A 4D block can contain random quantum events just fine. Also, Presentism isn't dead; about a quarter of philosophers still hold it, and not all of them rely on Lorentzian Ether. SR makes Presentism harder, but it doesn't logically forbid it."

  That should give you enough ammo to sleep past 2 AM next time.
