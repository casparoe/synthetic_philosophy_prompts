answer: |-
  **1. Scope and assumptions**

  This procedure answers one question: For a specific parcel, what is the annual probability that a structure built as proposed suffers flood damage exceeding the insurance deductible? It takes as given the effective Flood Insurance Study, county permit files, state claim records, and the board's collective memory. It assumes the hydraulic model underlying the maps is the best available truth for regulatory purposes. It declines to answer questions about future climate shifts, absolute safety guarantees, or the financial fairness of the insurance program itself. It does not generate new hydraulic data. It is designed to produce a defensible number or a justified refusal to number, suitable for a written finding within ten days. It treats the board as fact-finders, not modelers. The output is either a frequency rate derived from observed history or a default to the mapped zone rate when history is insufficient.

  **2. The procedure**

  **Purpose:** To select the correct group of past cases (class) to estimate future flood risk for a specific application.
  **Unit of Count:** One insurable structure-year. A parcel with one house counts as one unit per year. A parcel with twelve manufactured homes counts as twelve units per year. This prevents large projects from skewing the data.

  **Step 1: Define the Base Class.**
  Start with all structures in the same FEMA zone and within the same hydraulic proximity (e.g., 500 meters of the channel) as the subject parcel. This is the default class. It assumes water behaves similarly within the same mapped area. This step ensures every application starts from a common baseline.

  **Step 2: Check Data Adequacy.**
  Count the structure-years in the Base Class over the available record period (usually 40 years). If the count is fewer than 1,000 structure-years or fewer than 10 observed claims, stop. Use the Base Class rate. Do not narrow further. Small samples produce unstable numbers; a class with zero claims might just be lucky, not safe. This threshold protects against false security.

  **Step 3: Evaluate Proposed Narrowing.**
  If an applicant proposes a narrower class (e.g., specific street, construction date), they must state the physical mechanism (e.g., levee protection, higher ground) justifying why this subset differs from the Base Class. Attributes based on filing history, engineer selection, or claim thresholds are rejected. Water does not care about paperwork. Only physical barriers or elevation changes alter hazard.

  **Step 4: Test the Proposed Class.**
  Calculate the structure-years and claims for the Proposed Class. If the Proposed Class has fewer than 1,000 structure-years or fewer than 10 claims, reject it. Use the Base Class. Even if the mechanism is real, we cannot measure it reliably with too few data points. This prevents data-mining where applicants find small groups with no claims by chance.

  **Step 5: Compare Rates.**
  If both classes meet data thresholds, compare the damage rates. If the rates differ by less than the statistical uncertainty (approx. 50% of the rate), use the Base Class. If the Proposed Class shows significantly lower risk and has a physical justification, the board may adopt it for conditioning purposes. This ensures changes are meaningful, not noise.

  **Step 6: Calculate the Rate.**
  Divide total claims by total structure-years. This is the annual chance. For example, 20 claims over 20,000 structure-years is a 0.001 annual chance. Write this number clearly. This translates history into a probability the board can use.

  **Step 7: Default Rule.**
  If any step fails due to missing data, empty files, or contradictory mechanisms, revert to the Base Class. If the Base Class is empty, revert to the FEMA mapped zone average rate. This ensures a number is always available for the record, preventing deadlock.

  **Step 8: Recording.**
  The written finding must state which class was used, the count of structure-years, the count of claims, and the resulting rate. If reverting to default, state why the narrower class was rejected. This creates the substantial evidence record required for state appeal.

  **3. Rulings on the three complications**

  **Routing Attributes:** Your instinct is correct. Attributes like "filed after remapping" or "appealed denial" describe the process, not the water. Use these only to assess data reliability (e.g., an appealed denial might imply a contentious boundary), never to define the hazard class. A class defined by process attributes measures bureaucratic friction, not flood risk. Including them biases the sample toward difficult cases rather than hazardous ones.

  **Mitigation and Time:** You are correct; there are two questions. First, assess risk "as-is" using the Base Class. Second, assess risk "as-built" if conditions (elevation, openings) are met. The grant decision rests on the "as-built" risk meeting standards. Do not mix the classes. The "as-built" class must still meet data thresholds; if no data exists for elevated structures in that zone, default to the zone rate but note the reduction factor from engineering standards. This separates existing hazard from proposed safety.

  **Who Proposes:** The applicant proposes; the board validates. The burden of proving a physical mechanism lies with the proposer. If both the Staff's class and the Applicant's class meet all tests and disagree, default to the class yielding the higher risk estimate. This satisfies the substantial evidence standard for denial and protects the county's insurance standing. It places the burden of proof on the party seeking the exception.

  **4. Verdict on my draft**

  **Step 1 (List):** Survives. Necessary inventory.
  **Step 2 (Physical + Sig Test):** Misleading. Significance testing fails with thin data, which is your common case. Replace with minimum count thresholds (structure-years).
  **Step 3 (Narrow one at a time):** Actively misleading. This causes the ordering problem you identified. Different members pick different attributes first, getting different results. Repair: Pre-define a hierarchy (Zone -> Proximity -> Structure Type) or require a single proposed alternative class.
  **Step 4 (Stop Rules):** Survives in principle but needs fixed numbers (e.g., 1,000 structure-years) rather than statistical intervals which are hard to calculate in fifteen minutes.
  **Step 5 (Read Rate):** Dangerous. Mixing claim rates with model rates treats unlike objects as equal. Repair: Hierarchy of sources. Observed claims first; if empty, zone model rate.
  **Unit Count:** Your draft ignored this. Repair: Explicitly define "structure-year" to handle multi-unit parcels.
  **Overall:** Your draft assumes data richness you don't have. The repair prioritizes stability over precision. It removes the discretion that leads to inconsistent rulings between board members.

  **5. Three applications**

  **(a) Single-family house on a riverine lot.**
  *Inputs:* Staff Base Class: 380 parcels × 40 years = 15,200 structure-years. 22 claims. Applicant Class: 9 parcels × 40 years = 360 structure-years. 0 claims.
  *Procedure Run:* Step 1 defines Base Class. Step 2 confirms Base Class is adequate (15,200 > 1,000). Step 3 evaluates Applicant Class. The attribute is "street + post-1995." Physical mechanism is weak (street age does not stop water). Step 4 tests data. 360 structure-years is less than the 1,000 threshold.
  *Ruling:* Reject Applicant Class. Fails minimum structure-year threshold. The zero claims result is statistically meaningless with such a small sample; it likely reflects luck, not safety. Use Staff Base Class rate.
  *Number:* 22 / 15,200 = 0.0014 (0.14% annual chance).
  *Implication:* The board denies any request to ignore base flood elevation based on this data.

  **(b) Twelve-unit manufactured home park.**
  *Inputs:* County Class: 14 units × 40 years = 560 structure-years. 3 claims. State File: 1,600 claims, different region.
  *Procedure Run:* Step 2 checks County Class. 560 structure-years is less than 1,000. Data is too thin to rely on locally. Step 3 evaluates State File. Physical mechanism differs (soils, rainfall, topography). Pooling violates the homogeneity requirement of your regional experience.
  *Ruling:* Reject County Class (too thin). Reject State File (wrong region).
  *Hand-off:* Default to FEMA mapped zone rate for manufactured homes. Do not generate a local number.
  *Implication:* The board must rely on the federal map rate. They cannot claim local data supports a variance. This protects the county from liability if a flood occurs.

  **(c) Widow's application to rebuild.**
  *Inputs:* Subdivision Class: 60 parcels × 39 years (1985-2024) = 2,340 structure-years. 0 claims. *Flag: I invented the current year as 2024 for the calculation.* Record shows 1979 flood outside file window.
  *Procedure Run:* Step 2 checks data volume (2,340 > 1,000). However, Step 3 requires physical mechanism. The zero-claim rate is biased because the record starts after annexation in 1985, missing the 1979 event. This is truncation bias.
  *Ruling:* Refusal. Cannot calculate a valid rate from this file. The clean record is an artifact of record-keeping, not hydrology.
  *Hand-off:* Default to Zone Rate. The board must vote on whether to grant a variance based on hardship, acknowledging the technical record is incomplete.
  *Implication:* The board votes on policy, not hydrology. The finding must state the data is biased. This honesty prevents appeal reversal based on false precision.

  **6. Hard stops, judgment calls, and hand-offs**

  The procedure returns a refusal when data is too thin (fewer than 1,000 structure-years) or biased (truncated records). It returns a hand-off when the physical mechanism is disputed but unresolvable with existing files. In these cases, the board must vote. This vote is not about hydrology; it is about policy tolerance. For example, in the widow's case, the technical answer is "default to zone," but the moral question is "hardship." The procedure isolates the technical uncertainty so the vote is honest. Members vote knowing the number is uncertain, not pretending uncertainty doesn't exist. This protects the board on appeal: the record shows the technical limit was reached, and the decision was a policy choice within allowable discretion. Do not vote when the procedure yields a clear number; vote only when the procedure hands off to judgment. This distinction preserves the board's technical credibility while allowing for necessary humanity in edge cases.

  **7. What narrowing cannot buy**

  Narrowing reduces random sampling error, not systematic error. All your classes share the same rainfall dataset, the same hydraulic model, and the same map boundaries. If the model is wrong by 20%, every class is wrong by 20%. A narrow class looks precise because the confidence interval shrinks, but the center point may still be biased. Write findings to state: "This rate is accurate within the limits of the effective Flood Insurance Study." Do not claim higher precision than the underlying maps. On appeal, argue that the board used the best available data consistent with federal standards. Acknowledge the shared error explicitly: "While the class is specific, the hazard estimate inherits the uncertainty of the regional rainfall model." This honesty strengthens defensibility against claims of arbitrary precision. It signals to the reviewer that the board understands the limits of its data.

  **8. What the procedure cannot do**

  It cannot predict climate change or upstream development impacts not yet modeled. It cannot resolve financial hardship or moral claims of fairness. It cannot guarantee a structure will not flood. It is a tool for consistency, not truth. It ensures that similar cases are treated similarly, protecting the board from charges of arbitrariness. It does not remove the need for human judgment when data runs out.
