answer: |-
  Your verdicts are remarkably stable and align with the best empirical work on governance (Ostrom, Hess, etc.), but you are right to sense that "Legibility Lag" does not do the heavy lifting you want it to.

  If lag were the primary driver, personal carbon rationing would be the *most* defensible case for external authority (the lag is geological, coordination is impossible), yet you resist it. Conversely, if short lag implies self-governance, the Alpine pasture fits, but the Office Fridge (instant lag) should theoretically require strict rules to prevent spoilage/theft, yet you endorse anarchy there.

  To preserve your verdicts without importing external literature, you need a principle that distinguishes **discrete activities** from **background conditions**, and **restraint** from **stewardship**.

  Here is a proposed repair of your principle, followed by its application to your worrying pair, your unsettled cases, and the reverse (anti-commons) problem.

  ### 1. Repairing the Principle: "Actionable Specificity"

  Replace "Legibility Lag" with **Actionable Specificity**.

  The legitimacy of coercive governance tracks the **specificity of the agency** required to preserve the resource, set against the **intrusiveness of that agency into general life**.

  *   **High Specificity / Low Intrusiveness:** The resource use is a distinct, optional, or professional activity (Fishing, Prescribing, Grazing). Coercion is legitimate because it targets a *role*, not a *person*.
  *   **Low Specificity / High Intrusiveness:** The resource use is a byproduct of existence or basic participation in society (Carbon, Breathing). Coercion is illegitimate (or tyrannical) because it targets the *metabolism of life*.
  *   **Non-Rival / Zero Intrusiveness:** The resource is not depleted by use (Open Source). Governance is unnecessary or harmful.
  *   **Low Stakes / High Social Monitoring:** The resource is small, and users are mutually visible (Fridge). Norms suffice; formal governance is overkill.

  **Why this fixes the Fish/Carbon Pair:**
  *   **Fisheries:** Fishing is a **trade**. A fisher can dock a boat and remain a citizen. The coercion limits a *commercial input*. Your verdict (State limits) holds because the agency is specific to an industry.
  *   **Carbon:** Emitting carbon is a **metabolism** of modern life. To ration carbon personally is to ration movement, heat, and food. The agency is diffuse and constitutive. Your verdict (resist rationing) holds because the coercion limits *existence*.
  *   **The "Exit" Intuition:** You suspected "exit options" were the unprincipled reason. They are actually the principled one. If you can exit the activity without exiting society, the activity can be governed. If the activity *is* society, it cannot be governed by quota.

  ### 2. Solving the Fridge vs. Archive Puzzle

  You noted you couldn't distinguish the Fridge from the Archive except by scale. Scale is not the differentiator; **Entropy vs. Restraint** is.

  *   **The Fridge (Restraint):** The tragedy comes from *taking too much*. The solution is individual restraint. In a small office, social monitoring (shame) is cheaper than administrative authority.
  *   **The Archive (Entropy):** The tragedy comes from *doing too little* (failing to curate). A commons of information decays without active maintenance. No amount of individual restraint saves an archive; it requires **stewardship**.
  *   **Verdict:** The Archive requires a designated steward (authority) not because it is larger, but because the failure mode is neglect, not greed. Neglect cannot be solved by peer monitoring; it requires assigned responsibility.

  ### 3. Verdicts on the Unsettled Cases

  Applying **Actionable Specificity** and **Entropy vs. Restraint**:

  **A. The Groundwater Aquifer (Smallholders + Solar Pumps)**
  *   **Analysis:** This is structurally identical to the Alpine Pasture, but with a technological shock. Solar pumps lower the marginal cost of extraction to near zero, accelerating the "lag" between decision and depletion.
  *   **Specificity:** High. Pumping water is a distinct agricultural act, not a metabolic necessity.
  *   **Verdict:** **Self-Governance (with technical aid).** Because the users are identifiable smallholders (like the Alpine families), they can coordinate. However, because the technology makes depletion fast, they may need external *measurement* (state provides data) to make the lag legible, even if the *rules* remain local. Do not privatize; do not impose state quotas unless local governance collapses.

  **B. The Peer Review Pool**
  *   **Analysis:** This is a **Labor Commons**. It is rival (time is finite) and non-excludable (anyone can submit papers).
  *   **Specificity:** High. Reviewing is a professional duty, not a life function.
  *   **Entropy/Restraint:** Entropy. The pool decays if people stop supplying labor.
  *   **Verdict:** **Guild Governance.** Neither State nor Laissez-faire. This requires a professional association (the "Guild") to enforce norms. If you publish, you must review. This is not state coercion, but it is coercive within the community. It treats reviewing as a condition of membership, not a voluntary gift.

  ### 4. The Reverse Case: The Anti-Commons

  You ask if the same apparatus handles fragmented rights (gene sequences, urban land) where too many vetoes prevent use.

  **Yes, but inverted.**
  The Commons problem is **too many rights to use**. The Anti-Commons problem is **too many rights to exclude**.

  *   **The Principle:** **Aggregation Authority.**
  *   Just as the Commons requires a mechanism to *limit* individual action to save the whole, the Anti-Commons requires a mechanism to *override* individual vetoes to enable the whole.
  *   **Gene Sequences:** Requires **Patent Pools**. Private actors aggregate rights voluntarily to create a usable commons. If they fail, the State should intervene to mandate licensing (march-in rights).
  *   **Urban Land:** Requires **Eminent Domain**. If fragmented ownership prevents socially vital use (housing, transit), the State acts as the "Assembler."
  *   **Consistency:** This fits your framework. In the Commons, the State/Authority protects the *resource* from the *users*. In the Anti-Commons, the State/Authority protects the *public utility* from the *owners*. In both cases, absolute individual discretion is the enemy of resource viability.

  ### Summary of the Repaired Framework

  To teach this from your own verdicts, propose this taxonomy to your students:

  1.  **Is the resource rival?**
      *   No (Open Source): **Leave Alone.** (Enclosure destroys value).
      *   Yes: Proceed to 2.
  2.  **Is the use a distinct activity or a background condition?**
      *   Background (Carbon): **Resist Rationing.** (Coercion is tyrannical; solve via innovation/substitution).
      *   Distinct Activity (Fishing, Farming, Prescribing): Proceed to 3.
  3.  **Is the failure mode Greed or Neglect?**
      *   Greed/Overuse (Pasture, Fish, Aquifer): **Limit Access.** (Self-gov if community is tight; State if community is loose or stakes are existential).
      *   Neglect/Decay (Archive, Reviewers): **Assign Stewardship.** (Someone must be paid or empowered to curate).
  4.  **Is the problem Fragmentation?** (Anti-Commons)
      *   Yes: **Empower Aggregation.** (Override vetoes to enable use).

  This preserves your intuition on Fish vs. Carbon (Distinct Activity vs. Background Condition), solves the Fridge vs. Archive (Greed vs. Neglect), and gives you a consistent handle on the new cases without relying on "Legibility Lag."
