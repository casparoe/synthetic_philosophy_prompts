      *(Self-Correction during drafting)*: Be careful with "Clearly Right." In philosophy, almost nothing is clearly right. Move 1 is "Clearly Right" *as a characterization of the PMI*, not as a truth claim. I must make that distinction clear. Move 5's claim that SR is "just a retreat" is arguably too dismissive, so "Defensible" is better than "Right."

