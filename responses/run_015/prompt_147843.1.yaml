prompt: |-
  I want the full spec for what a theory of rational belief revision under genuinely uncertain evidence actually has to deliver. I'm not asking for Jeffrey conditionalization vs standard Bayes — I mean the messy middle where your evidence doesn't come with a clean likelihood, like when you recieve overlapping but conficting expert confidance ranges about a diagnosis and still have to update. List the desiderata: the cases it must handle (avoiding dilation, respecting second-order uncertainty, not collapsing into naive averaging), the distinctions it can't blur (uncertainty about the world vs uncertainty about the evidential weight itself), and the decision-theoretic constraints it can't violate. For each say why it's required and flag which are hard constraints vs camp preferences (locality of update, no hidden priors, etc.). Then briefly score Jeffrey's rule, a two-stage Bayesian model, and a 'threshold-then-Bayes' hybrid — but keep weight on the criteria. Be committed: tell me which single desideratum kills the hybrid view and defend that choice. No bib needed, just the reasoning.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Request:**
      *   **Topic:** Theory of rational belief revision under *genuinely uncertain evidence* (messy middle, not just Jeffrey vs. Bayes).
      *   **Specific Context:** Overlapping/conflicting expert confidence ranges, evidence without clean likelihoods.
      *   **Task:** List desiderata (cases to handle, distinctions to maintain, decision-theoretic constraints).
      *   **Requirements:** Explain *why* each is required. Flag as "Hard Constraint" vs. "Camp Preference".
      *   **Evaluation:** Score Jeffrey's Rule, Two-Stage Bayesian Model, and 'Threshold-then-Bayes' Hybrid against the criteria.
      *   **Commitment:** Identify the *single* desideratum that kills the Hybrid view and defend that choice.
      *   **Format:** No bibliography, just reasoning. Be direct and committed.

  2.  **Analyze the Core Problem:**
      *   Standard Bayesianism assumes evidence $E$ is learned with certainty ($P(E)=1$).
      *   Jeffrey Conditionalization (JC) assumes we get a new partition of probabilities $\{P_{new}(E_i)\}$ exogenously.
      *   The "Messy Middle": We don't get $P(E)=1$, nor do we get a clean $P_{new}(E)$. We get *testimony* about evidence, *confidence intervals* from experts, or signals with unknown reliability. This involves *uncertainty about the evidential weight itself*.
      *   Key challenge: Distinguishing risk (known probabilities) from ambiguity/uncertainty (unknown probabilities) in the *input* channel, not just the hypothesis space.

  3.  **Drafting the Desiderata (The "Spec"):**
      *   *Need to handle:*
          1.  **Conflicting/Imprecise Inputs:** Expert A says 60-70%, Expert B says 40-50%. The theory can't just average them naively (loss of information about disagreement).
          2.  **Dilation Avoidance:** Updating shouldn't make *everything* more uncertain just because one input was vague (a common critique of Imprecise Probability models).
          3.  **Second-Order Uncertainty:** Must represent uncertainty about the reliability of the evidence source, not just the hypothesis.
      *   *Distinctions to Maintain:*
          4.  **World vs. Weight:** $P(H)$ vs. $P(E|H)$ vs. Reliability($E$). Don't conflate "The world is likely X" with "I am unsure if this test tells me about the world."
          5.  **Input vs. Processing:** The uncertainty is in the *reception* of evidence, not just the prior.
      *   *Decision-Theoretic Constraints:*
          6.  **Dynamic Consistency:** Plans made before evidence should align with actions after evidence (no Dutch Books).
          7.  **Responsiveness:** Beliefs must actually move in the direction of the evidence, even if uncertain.
      *   *Hard vs. Preference:*
          *   Hard: Dynamic Consistency, Responsiveness, World/Weight Distinction.
          *   Preference: Locality of Update (do we update global priors or local likelihoods?), No Hidden Priors (transparency of assumptions).

  4.  **Refining the Desiderata (Self-Correction/Sharpening):**
      *   *Critique:* "Dilation avoidance" is tricky. Some argue dilation is a feature, not a bug, of imprecise probs. I need to frame it as "Unwarranted Dilation" (losing precision where none was lost).
      *   *Critique:* "No Hidden Priors" is a camp preference (Objective Bayes vs. Subjective). I'll flag it as such.
      *   *Crucial Addition:* **The Separation of Source Reliability from Hypothesis Probability.** This is the heart of the "messy middle."

  5.  **Evaluating the Models:**
      *   **Jeffrey's Rule (JC):**
          *   *Pros:* Handles uncertain evidence inputs ($P_{new}(E)$).
          *   *Cons:* Takes the new probabilities as exogenous inputs. Doesn't model *why* they are uncertain. Vulnerable to "input rigidity."
          *   *Score:* Good on consistency, bad on source modeling.
      *   **Two-Stage Bayesian (Hierarchical):**
          *   *Pros:* Models source reliability explicitly ($P(E|H, R)$). Updates reliability then hypothesis.
          *   *Cons:* Computationally heavy, requires priors on reliability (which might be the very thing we are unsure about).
          *   *Score:* Strong on distinctions, weak on "no hidden priors."
      *   **Threshold-then-Bayes Hybrid:**
          *   *Mechanism:* If confidence > threshold, treat as certain (Bayes). If not, ignore or bracket.
          *   *Pros:* Simple.
          *   *Cons:* Discontinuous. Throws away information below threshold.
          *   *Score:* Fails responsiveness.

  6.  **The "Kill Shot" (Commitment):**
      *   Which desideratum kills the Hybrid?
      *   *Candidate 1:* Dynamic Consistency. (Hybrids can be Dutch-booked across thresholds).
      *   *Candidate 2:* Responsiveness/Information Loss. (Ignoring weak evidence is irrational).
      *   *Decision:* **Responsiveness (specifically, Continuity of Belief Update).**
      *   *Reasoning:* A threshold creates a cliff. Evidence just below the threshold is treated as *zero* weight, while evidence just above is treated as *certain*. This violates the basic principle that more evidence (or slightly stronger evidence) should not lead to discontinuous jumps in rational doxastic states unless there's a categorical change in kind (which there isn't here). It turns a gradient of uncertainty into a binary switch, which is epistemically irresponsible in the "messy middle."

  7.  **Drafting the Content (Iterative refinement for tone and precision):**
      *   *Tone:* Analytic, rigorous, decisive.
      *   *Structure:*
          1.  The Specification (Desiderata).
          2.  The Scoring (Model Evaluation).
          3.  The Execution (The Hybrid's fatal flaw).
      *   *Check:* Did I flag Hard vs. Preference? Yes. Did I avoid bibliography? Yes. Did I address the "conflicting expert" scenario? Yes.

  8.  **Final Polish:**
      *   Ensure the distinction between "uncertainty about the world" and "uncertainty about evidential weight" is clear.
      *   Make sure the "Hard Constraint" labels are defensible.
      *   Strengthen the argument against the Hybrid. It's not just "it's imperfect," it's "it violates a core norm of rationality."

  **(Self-Correction during drafting):** I initially thought about focusing on Dutch Books for the Hybrid. But Dutch Books are often avoidable with clever bookkeeping. The deeper issue is *epistemic responsiveness*. If two experts give 49% and 51% confidence, a threshold at 50% treats these radically differently. That's absurd. I will focus on **Continuity/Responsiveness** as the killer.

  9.  **Final Review against constraints:**
      *   Full spec? Yes.
      *   Desiderata listed with why? Yes.
      *   Hard vs. Preference flagged? Yes.
      *   Score 3 models? Yes.
      *   Commit to one killer desideratum for Hybrid? Yes.
      *   No bib? Yes.

