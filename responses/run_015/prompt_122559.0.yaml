  6.  **Writing the Content (incorporating voice and epistemic markers):**

      *   *Voice:* Theorist (equilibrium, identification), Comparativist (cases, variation, measurement), Historian (lineage, genealogy), Behavioralist (heuristics, norms), Political Theorist (subjectivity, constitution).
