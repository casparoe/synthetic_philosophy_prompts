      *   Epistemic marking? Yes.

  8.  **Final Polish:** Ensure the tone is helpful but rigorous. Make sure the distinction between Dissipation, Transfer, and Attrition is clear in the replies. (Self-Correction: Make sure the "Political Theorist" objection sounds like Foucaultian critique, not just "preferences are endogenous". It needs to be about *constitution* of the agent.)

      *(Self-Correction on Epistemic Flags)*: I need to be very careful not to tell the user to assert something as settled if it's actually the core theoretical contribution. The *taxonomy* is the contribution, so it's by definition contested. I must flag that.

      *(Refining the "Must Land" reply)*: It shouldn't just be "my taxonomy is good." It should be "even if the mechanism is loose, the policy error is real."

