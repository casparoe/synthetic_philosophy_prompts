      *   *Objection 7 (Comparativist 2):* The Remedy. "Raise the floor" is politically hard. Is that a policy recommendation or a wish?
      *   *Objection 8 (General/Method):* Classification ambiguity. How do you empirically distinguish Dissipation from Transfer?

      *Refining for "Damage":* The Formal Theorist's attack on the mechanism status is existential. If it's not a mechanism, the paper is just prose. The Political Theorist's attack undermines the agency model. The Comparativist's attack undermines the contribution. Let's prioritize the Formal Theorist (Existential), Political Theorist (Foundational), and Comparativist (Empirical).

