answer: |-
  # Teaching Plan: The Erosion of Internal Models

  **Session Duration:** 90 Minutes
  **Participants:** Small group of intelligent, non-specialist professionals.
  **Objective:** To distinguish between using AI as a reasoning extension versus a judgment proxy, and to identify the specific cognitive erosion (loss of counterfactual capacity) that results from the latter.

  ---

  ## I. Dependency Order & Arc
  The session must proceed in the following strict sequence. Skipping the first phase will make the central claim unintelligible, as participants will default to evaluating AI based on *accuracy* rather than *cognitive structure*.

  1.  **Phase 1: Define "Understanding" (0–15 mins)**
      *   Establish the preliminary idea: Understanding is not recall; it is counterfactual resilience.
  2.  **Phase 2: The Concrete Scenario (15–35 mins)**
      *   Deploy the "Recipe Substitution" scenario to test the definition.
  3.  **Phase 3: The Distinction (35–55 mins)**
      *   Formalize "Extension" vs. "Outsourcing" and address the Calculator Analogy.
  4.  **Phase 4: The Erosion Mechanism (55–75 mins)**
      *   Explain the shift from Mental Model to Proxy Model and address the Verification Fallacy.
  5.  **Phase 5: Synthesis & Assessment (75–90 mins)**
      *   Consolidate the mechanism and pose the final diagnostic question.

  ---

  ## II. Phase Details

  ### Phase 1: The Preliminary Idea (0–15 mins)
  **Goal:** Establish that "understanding" is defined by the ability to handle *variation*, not just reproduce *results*.

  *   **Activity:** Do not lecture. Ask the group: "If I memorize the answer to a math problem, do I understand math?" Wait for consensus (No). Ask: "What would prove I understand it?"
  *   **Target Concept:** Guide them to the idea that understanding is the capacity to answer **"What if?"** questions without external aid.
  *   **Definition to Lock In:** *Understanding is the internal ability to predict how a system changes when you alter its variables.*
  *   **Why this is necessary:** Without this definition, participants will judge AI use solely by the quality of the output (the answer). To grasp the erosion claim, they must judge AI use by the state of their own internal predictive capacity.

  ### Phase 2: The Concrete Scenario (15–35 mins)
  **Goal:** Use a single, relatable scenario to make the "What if?" definition tangible.

  *   **The Scenario:** **The Recipe Substitution Test.**
      *   *Context:* You are cooking a dish using a recipe provided/explained by an AI.
      *   *Success State:* You follow the steps, the dish tastes correct.
      *   *Variation:* You discover you are missing a key ingredient (e.g., buttermilk) mid-process.
  *   **Required Properties:**
      *   **Causal Transparency:** The scenario must involve ingredients that serve a function (acid, fat, leavening), not just arbitrary steps.
      *   **Low Technical Barrier:** No specialized culinary knowledge required; everyone understands cooking basics.
      *   **Immediate Consequence:** The inability to substitute stops the process immediately.
  *   **Properties It Must Lack:**
      *   **High Stakes:** Do not use medical or legal examples; anxiety blocks cognitive reflection.
      *   **Subjectivity:** Do not use creative writing; "good output" is too debatable.
  *   **Discussion Flow:**
      1.  Ask: "If the AI gave you the recipe but didn't explain *why* the ingredient is there, can you substitute it?" (Likely No).
      2.  Ask: "If you successfully cooked the meal using the AI's steps, did you understand the cooking?" (Use Phase 1 definition: If you can't substitute, you lack counterfactual resilience, therefore you lack understanding).
  *   **Misconception Intervention (Verification Fallacy):**
      *   *Predictable Misconception:* "But I can taste the food. I verified the output is good. That's enough."
      *   *Precise Point to Head Off:** Immediately after the "Success State" description in this phase.
      *   *Counter-Argument:* "Verification confirms the *product*, not the *process*. You verified the meal, not your ability to cook. The erosion happens in the process, not the product."

  ### Phase 3: The Distinction (35–55 mins)
  **Goal:** Formalize the difference between tool use that preserves the model and tool use that bypasses it.

  *   **Concept 1: Extension.** You use the AI to retrieve information or draft text that you *could* have produced yourself given enough time, but you review/edit the logic to ensure it matches your internal model. The AI is a speed multiplier.
  *   **Concept 2: Outsourcing.** You use the AI to solve a problem where you *cannot* evaluate the logic, only the result. You accept the reasoning because the system is authoritative, not because you comprehend the chain of causality.
  *   **Misconception Intervention (The Calculator Analogy):**
      *   *Predictable Misconception:* "This is no different than using a calculator. We didn't lose math skills; we just got faster."
      *   *Precise Point to Head Off:** Immediately after defining Extension vs. Outsourcing.
      *   *Counter-Argument:* "A calculator performs arithmetic you *already understand* (you know what addition is). An LLM performs reasoning you *might not understand* (you don't know why this argument holds). With a calculator, you own the logic. With an outsourced explanation, the system owns the logic. The erosion is specific to *reasoning*, not *computation*."

  ### Phase 4: The Erosion Mechanism (55–75 mins)
  **Goal:** Explain how "Outsourcing" leads to the "Proxy Model."

  *   **The Mechanism:**
      1.  **Initial State:** You encounter a gap in knowledge.
      2.  **Outsourcing:** You ask AI. It provides a coherent explanation.
      3.  **Proxy Formation:** Instead of integrating the *causal rules* into your brain (Mental Model), you store a reference to *what the AI said* (Proxy Model).
      4.  **Erosion:** Over time, you stop exercising the neural pathways required to build Mental Models. You become an expert at prompting the system, not at navigating the domain.
      5.  **Result:** You lose "Counterfactual Resilience" (from Phase 1). You cannot answer "What if?" without querying the proxy.
  *   **Deliberate Exclusion:**
      *   **Exclude:** Discussions about AI "hallucinations," accuracy, or truthfulness.
      *   **Acknowledge:** State clearly: "We are not discussing whether the AI is right or wrong. We are discussing whether *you* know why it is right or wrong. Even if the AI is 100% accurate, the erosion of your internal model still occurs if you outsourced the reasoning."
      *   **Exclude:** Economic arguments (job loss, productivity gains).
      *   **Acknowledge:** "Efficiency is real. We are analyzing the cognitive cost of that efficiency, not debating its economic value."

  ### Phase 5: Synthesis & Assessment (75–90 mins)
  **Goal:** Verify grasp of the mechanism, not just general skepticism.

  *   **Synthesis:** Recap the arc. Understanding = Counterfactuals. Outsourcing = Proxy Models. Proxy Models = Fragility when variables change.
  *   **The Focused Final Question:**
      *   Do not ask: "Is AI dangerous?" or "Should we use it less?"
      *   **Ask:** "Think of a task you successfully completed using AI in the last month. If the constraints of that task changed slightly (e.g., a missing ingredient, a new rule, a different variable), would you be able to adapt your solution without consulting the AI again? If not, what specific part of your understanding did you outsource?"
      *   **Success Criterion:** A successful answer identifies a specific *reasoning step* they no longer own (e.g., "I can't adapt the email tone because I don't know which words created the persuasion, I just know the AI's output worked"). A failed answer remains vague (e.g., "I guess I rely on it too much").

  ---

  ## III. Facilitator Notes on Constraints

  1.  **Formal Dependency:** Do not allow the group to discuss the "Calculator Analogy" (Phase 3) before establishing the "Counterfactual Definition of Understanding" (Phase 1). If they discuss calculators first, they will anchor on *accuracy* rather than *internal modeling*.
  2.  **Non-Specialist Language:** Avoid terms like "epistemology," "cognitive offloading," or "neural weights." Use "mental map," "skipping steps," and "black box."
  3.  **No Reading/References:** The session must rely entirely on the group's lived experience and the logic of the arc. Do not cite scholars to validate the claims; validate them through the "Recipe" scenario logic.
  4.  **Tone:** Maintain a tone of inquiry, not accusation. The goal is not to shame AI use, but to make the *cost* of specific types of AI use visible. The distinction is between *Extension* (Good) and *Outsourcing* (Risky).
