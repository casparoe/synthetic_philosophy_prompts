  3. Diagnosis
  This is primarily a category error masked as a substantive metaphysical dispute. Reductionists treat *anattā* as an ontological claim about composition, inviting Western critique. Narrativists treat personhood as a prerequisite for ethics. Your hunch is correct: they are answering parallel questions. The reductionist addresses phenomenological ownership, denying a permanent experiencer, while the narrativist worries about normative accountability, requiring a liable agent. Furthermore, framing *anattā* as deconstructive practice rather than ontology dissolves the tension. *Anattā* targets clinging, not conventional agency. When practitioners deny self, they deny a specific metaphysical grasping, not the functional capacity to bear karma. The debate stalls because philosophers analyze texts as theory, while practitioners use them as tools. Until we distinguish the soteriological target from the metaphysical description, the circle continues. It is partly verbal, as self shifts meaning. In Western philosophy, it implies logical subjectivity. In Buddhism, it implies craving. The substantive hidden layer concerns evidence. First-person report clashes with third-person logic. The parallel questions idea is the strongest diagnostic tool here. The reductionist answers what exists; the narrativist asks who answers. The deconstructive framing reveals that *anattā* isn't describing the world, but changing the viewer. Consequently, the disagreement is ill-posed because it applies Western metaphysical standards to a soteriological technology. The evidence gap remains unaddressed in current literature. We must recognize that Buddhist metaphysics is subordinate to soteriology. When treated as free-standing ontology, it invites contradictions. When treated as instruction, it functions. The stalemate is therefore a methodological failure.

  4. What would count as progress
  Progress requires a tripartite distinction: ontological self (denied), conventional agent (accepted), and soteriological target (clinging). We need empirical work on long-term meditators to see if normative accountability survives phenomenological self-loss. If practitioners maintain ethical responsibility without sense of ownership, the narrativist fear is unfounded. Alternatively, we must reframe the debate as pragmatic: does the no-self view reduce suffering? If yes, metaphysical coherence is secondary. Accepting that Buddhist metaphysics serves soteriology, not descriptive accuracy, would stop the category error. We need to stop asking Is it true? and start asking Does it work? This shifts the burden of proof from metaphysical consistency to psychological efficacy. Explicitly invoking the Two Truths doctrine allows conventional persons for ethics while denying ultimate selves. This permits moral language without metaphysical commitment. Such a reframing respects the internal logic of the tradition without forcing external coherence.

  5. Bottom line
  The debate cannot move while participants treat *anattā* as a competitor to Western personal identity theory rather than a therapeutic intervention. It is only resolvable by shifting from metaphysical truth-conditions to pragmatic efficacy.
