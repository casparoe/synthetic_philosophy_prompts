      *   **Topic:** Causation in history (Great Man vs. Structural explanations).
      *   **Goal:** Establish desiderata (criteria) for a theory of historical causation to settle counterfactuals (e.g., "No Hitler = No Nazi Germany?").
      *   **Constraint:** Avoid mere anecdote trading (1933 specifics). Focus on the *spec* for the theory itself.
