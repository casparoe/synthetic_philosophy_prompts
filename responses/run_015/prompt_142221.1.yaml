      *   Is it for prediction? (Political Science).
      *   Is it for understanding? (History/Philosophy).
      *   *Insight:* A theory that tries to do all three will fail. It needs to pick a lane.

  6.  **Developing the Incompatibilities:**
      *   *Specificity vs. Generalizability:* If you explain *this* specific Holocaust perfectly (Great Man), you might lose the ability to predict *future* genocides (Structural).
      *   *Moral Accountability vs. Deterministic Comfort:* If structures determine everything, blame dissipates. If individuals determine everything, structures get a pass.

  7.  **Scoring the Theories:**
      *   *Great Man:* Good on agency, bad on generalizability.
      *   *Structural:* Good on patterns, bad on specific contingency.

  8.  **Drafting the Content (incorporating the user's specific phrasing requests):**
