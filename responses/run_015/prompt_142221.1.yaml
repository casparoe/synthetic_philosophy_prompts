answer: |-
  Here is a specification sheet for a theory of historical causation, designed to move your reading group past anecdote-trading and into meta-historical methodology.

  ### The Purpose: What is this theory for?
  Before listing criteria, you must settle the teleology. A theory of causation cannot maximize for everything simultaneously.
  *   **Moral Accounting:** Allocating blame or praise (requires high agency resolution).
  *   **Social Science:** Predicting future regime types or conflicts (requires high structural generalizability).
  *   **Historical Understanding:** Explaining *why this happened* specifically (requires high narrative fidelity).
  *   **Verdict:** A theory attempting to serve all three will collapse. For a reading group on *explanation*, prioritize **Historical Understanding**, but flag where it conflicts with **Moral Accounting**.

  ---

  ### The Desiderata (The Spec)

  #### 1. Substitutability Conditions (Role vs. Role-Filler)
  *   **The Requirement:** The theory must distinguish between the *functional necessity* of a position and the *idiosyncratic necessity* of the occupant. It must define the "closeness" required for a substitute to count as "the same cause."
  *   **The Case:** "Someone else would have done it" is useless unless we define "it." Would a successor have invaded Poland in 1939? Maybe. Would they have ordered the Holocaust with the same ideological intensity and bureaucratic timing? Less clear. The theory must quantify the margin of deviation allowed before the counterfactual counts as a different outcome.
  *   **Status:** **Non-Negotiable.** Without this, the debate is semantically ambiguous.

  #### 2. Outcome Granularity Sensitivity
  *   **The Requirement:** The theory must yield different causal verdicts depending on the resolution of the outcome variable.
  *   **The Case:** Hitler might be dispensable for the outcome "Authoritarian Germany in the 1930s" (structural pressures made this likely) but indispensable for "The Holocaust as it historically occurred" (specific ideological fixation). A theory that gives a single binary Yes/No on "Did Hitler cause Nazi Germany?" is too blunt to be useful.
  *   **Status:** **Non-Negotiable.** Causation is relation-specific; a theory that ignores scale is false.

  #### 3. Epistemic Tractability (The Single-Run Problem)
  *   **The Requirement:** The theory must provide a method for validating counterfactuals without access to a control group or time travel. It must specify what evidence counts as support for a claim about a non-event.
  *   **The Case:** We cannot rerun the Weimar Republic. Therefore, claims about "what would have happened" rely on models of human behavior or structural parallels. The theory must demand that counterfactuals be grounded in actual historical precedents (e.g., "In similar structural crises, leaders of type X did Y") rather than pure imagination.
  *   **Status:** **Non-Negotiable.** Otherwise, history becomes fiction.

  #### 4. Mechanistic Plausibility
  *   **The Requirement:** The theory must trace the *process* by which the cause produces the effect, not just correlate them.
  *   **The Case:** Structuralists often posit "forces" (capitalism, nationalism) that act like gravity. Great Man theorists posit decisions. A valid theory must show the transmission belt: How does a structural pressure become a specific policy? How does a specific order become a systemic reality? If the mechanism is "the spirit of the age," the theory fails.
  *   **Status:** **Camp Preference (Structuralist lean).** Great Man theorists often accept "decision" as a terminal explanation; Structuralists demand the decision be explained by prior conditions.

  #### 5. Stability and Robustness
  *   **The Requirement:** The causal claim must hold under small perturbations of background conditions.
  *   **The Case:** If Hitler's existence is the sole cause, the outcome is fragile (remove Hitler, outcome vanishes). If structural conditions are the cause, the outcome is robust (remove Hitler, outcome persists via another agent). A good theory must measure the *basin of attraction* for the event.
  *   **Status:** **Camp Preference (Structuralist lean).** Great Man theories often thrive on fragility (the "pivot point" view of history).

  #### 6. Phenomenological Fidelity
  *   **The Requirement:** The theory must align with how historical actors experienced their choices.
  *   **The Case:** If actors felt they had choices, and records show deliberation between distinct paths, a theory that claims the outcome was structurally determined risks being anachronistic. It must account for the *openness* of the past as it was lived.
  *   **Status:** **Camp Preference (Great Man/Agency lean).** Structuralists often view this feeling of openness as an illusion generated by incomplete information.

  ---

  ### Incompatibility Flags (Trade-offs)

  **1. Moral Clarity vs. Scientific Generalization**
  *   **Conflict:** To allocate blame (Moral Accounting), you need to isolate the individual agent (Great Man). To predict future conflicts (Social Science), you need generalizable structural patterns.
  *   **Tension:** You cannot maximize both. A theory that makes Hitler uniquely responsible settles blame but offers little predictive power for preventing future genocides (since "unique monsters" are hard to model). A theory that makes genocide a structural inevitability helps prediction but dissolves blame.
  *   **Verdict:** You must choose whether the session is about *justice* or *science*.

  **2. Specificity vs. Robustness**
  *   **Conflict:** The more precisely you describe the outcome (e.g., "The Holocaust exactly as it happened"), the more indispensable the Great Man becomes. The more coarsely you describe it (e.g., "A major European war"), the more structural explanations dominate.
  *   **Tension:** You cannot have a theory that claims high specificity *and* high robustness. If the outcome is highly specific, it is by definition fragile.
  *   **Verdict:** The group must agree on the *description of the effect* before arguing about the *cause*.

  ---

  ### Scorecard

  **The Great-Man Picture**
  *   **Strengths:** High Phenomenological Fidelity; handles fine-grained Outcome Granularity well (explains specific timing and style); satisfies Moral Accounting.
  *   **Weaknesses:** Poor Epistemic Tractability (hard to prove uniqueness); low Stability (history becomes a series of accidents); fails Social Science prediction.

  **The Structural Picture**
  *   **Strengths:** High Stability and Robustness; excellent for Social Science prediction; solves Epistemic Tractability via comparative sociology.
  *   **Weaknesses:** Low Phenomenological Fidelity (flattens agency); struggles with fine-grained Outcome Granularity (explains "war" but not "this war"); dissolves Moral Accountability.

  **Facilitator's Note:** The "winning" theory is the one that best satisfies the *Purpose* you selected at the start. If the goal is understanding *contingency*, Great Man scores higher. If the goal is understanding *constraint*, Structural scores higher. A mature theory admits it cannot do both simultaneously.
