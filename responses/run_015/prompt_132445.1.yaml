  I

  Master Vane stood in the center of the Plaza of Voices, his posture rigid, waiting for the opening salutation that would authorize the exchange. Kael arrived late, checking a glowing slate in his hand rather than meeting Vane's eyes. When Vane drew breath to initiate the first cut, Kael raised a palm. "We don't do this anymore," Kael said, his voice flat. "It's barbaric to treat dignity as a commodity." Vane looked for the flush of shame or the spark of defiance that would signal a challenge to his honor, but found only a mild inconvenience in Kael's expression. The young man spoke of progress and civility, but Vane saw the truth in the way Kael glanced at his slate: the prestige of victory had evaporated, leaving the moral objection as merely a polite cover for indifference.

  II

  The loan officer at the Meridian Guild did not look up from the ledger when he slid the rejection notice across the desk. "Your participation in a Reckoning last quarter flags you as a volatility risk," he said, tapping the paper. "Our policy prioritizes stability for all stakeholders." Merchant Hellsing leaned forward, knowing the real weight behind the words was the insurance premium hike that came with litigants, not the safety of the stakeholders. "You call it stability, I call it a tax on tradition," Hellsing muttered, but he signed the withdrawal form anyway. The economic penalty was absolute, disguised as prudent governance, rendering the moral language of safety a mere euphemism for profit protection.

  III

  From the podium, the Reformator spoke of invisible wounds and the long-term trauma of public humiliation. The crowd in the assembly hall nodded solemnly, clapping at the appropriate intervals about psychological safety. In the third row, an old woman leaned to her neighbor and whispered, "They want workers who don't bite back." The neighbor nodded, watching the Reformator gesture broadly about compassion. The argument was framed entirely around harm and healing, yet the audience's quiet skepticism revealed a shared understanding that the moral reasoning was a convenient justification for a shift in power dynamics.

  IV

  In the back room of the closed Duelists' Club, two former Arbiters poured drinks over the ice of a defunct ritual. "They say it's about kindness now," said the first, swirling the amber liquid. "Kindness doesn't lower insurance premiums," the second replied. They laughed, not bitterly, but with the relief of men who no longer had to pretend that the rules were about virtue rather than cost. They acknowledged that the language of harm was simply the new vocabulary for an old economic reality, dismissing the moral revolution as a post-hoc story told to make the transition palatable.

  V

  At the Bureau of Civil Conduct, a clerk processed a Form 88-B: Statement of Grievance. The form required the applicant to list the "Particulars of Insult" and the "Degree of Offense" in duplicate, echoing the precise taxonomy of the Reckoning without permitting the response. The clerk stamped the document with a rhythmic thud, filing it under 'P' for Processing, neither judging the truth of the insult nor offering satisfaction. The bureaucratic etiquette preserved the structure of the accusation while stripping away the agency of the defense, leaving behind a hollow normative shell that functioned solely to manage the queue.

  This narrative leans on the genealogical interpretation that moral reasoning serves as post-hoc rationalization for material and status shifts; the historical case of abolitionism driven primarily by moral conviction despite severe economic cost would change my mind about that reading.
