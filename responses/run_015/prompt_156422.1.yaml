answer: |-
  There is no single, canonical lexical item in translation studies that captures this phenomenon with the precision you describe. It is not merely *mistranslation*, nor is it fully encompassed by *belles infidèles* or *domestication*.

  However, the phenomenon is well-recognized in theoretical circles. The closest established framework is Antoine Berman's concept of **"Deforming Tendencies"** (*les tendances déformantes*), specifically the intersection of "Rationalization" and "The Destruction of Underlying Networks of Signification." Yet, Berman does not provide a specific noun for the *cumulative metaphysical shift caused by prosodic constraints*.

  To address your need for precision, the most accurate descriptive term currently in circulation is **"Constraint-Induced Conceptual Drift,"** though some scholars refer to it as **"Prosodic Determinism."**

  Below is a detailed breakdown of how this phenomenon is classified, how it differs from related concepts, and a formal definition based on your criteria.

  ### 1. Theoretical Context and Existing Terminology

  While no single word exists, the phenomenon sits at the intersection of three theoretical concepts:

  *   **Berman's Deforming Tendencies:** In *The Experience of the Foreign* (1984), Berman argues that translation inherently tends to deform the source text. Your example describes a specific subtype where the *form* (verse) dictates the *content* (ontology), resulting in what Berman calls the "qualitative impoverishment" of the text.
  *   **The Sorites Paradox of Translation:** Your observation mirrors the philosophical "Heap Paradox." One lexical substitution for rhyme does not alter the philosophy; two do not; but *n* substitutions create a new metaphysical system. This is sometimes referred to in translation theory as **"Accumulative Distortion."**
  *   **Formal Determinism:** This term is used in literary studies to describe when the requirements of form (meter, rhyme) dictate semantic choices. In translation, this becomes **"Prosodic Determinism,"** where the target language's prosodic rules override the source text's conceptual architecture.

  ### 2. Proposed Definition

  Since a precise term is lacking, I propose the following definition, which you may use to categorize this phenomenon:

  > **Prosodic Ontological Drift (POD)**
  >
  > A systemic translation artifact occurring in formally constrained texts (verse, fixed form), characterized by:
  > 1.  **Formal Fidelity:** The strict preservation of target-language prosodic constraints (meter, rhyme, stanzaic form).
  > 2.  **Local Rationality:** Individual lexical or syntactic substitutions are grammatically sound and contextually plausible in isolation.
  > 3.  **Global Divergence:** The accumulation of substitutions systematically alters the source text's conceptual, metaphysical, or argumentative architecture.
  > 4.  **Internal Coherence:** The resulting text constitutes a coherent, aesthetically pleasing work that nevertheless advances a philosophical position incompatible with the original.

  ### 3. Differentiation from Related Concepts

  It is crucial to distinguish *Prosodic Ontological Drift* from broader categories of translation infidelity.

  | Concept | Primary Driver | Intent | Outcome | Distinction from POD |
  | :--- | :--- | :--- | :--- | :--- |
  | **Belles Infidèles** | Aesthetic Preference | Conscious choice to prioritize beauty over truth. | A beautiful text that is unfaithful. | *Belles infidèles* is often a stylistic choice (e.g., smoothing rough edges). POD is often a **structural necessity** imposed by the constraint. |
  | **Domestication** (Venuti) | Cultural Fluency | Making the text readable for the target culture. | The foreign is made familiar. | Domestication targets *cultural* values. POD targets *ontological* categories (substance vs. presence) due to *linguistic* constraints. |
  | **Mistranslation** | Error / Ignorance | Unintentional failure to understand. | Nonsense or factual error. | Mistranslation is usually local and corrigible. POD is **systemic**; correcting one line breaks the form, requiring further drift. |
  | **Adaptation** | Functional Shift | Changing the work for a new medium/audience. | A new work inspired by the old. | Adaptation admits it is a new work. POD presents itself as a **translation**, masking the philosophical shift under formal fidelity. |

  ### 4. Scope: Does it Require a Philosophical Text?

  **No, but philosophy makes it fatal.**

  The mechanism of *Prosodic Ontological Drift* can occur in any long, formally constrained translation (e.g., translating Homer into rhymed couplets, or the Rubáiyát into strict quatrains).

  *   **In Narrative Poetry:** The drift results in **Character or Tonal Shift.** (e.g., A stoic hero becomes impulsive because "stoic" does not rhyme with the required scheme, but "rash" does).
  *   **In Drama:** The drift results in **Motivational Shift.** (e.g., A character acts out of duty in the original, but out of love in the translation, because the rhyme scheme demands an emotional verb).
  *   **In Philosophy:** The drift results in **Metaphysical Shift.** Because philosophical texts rely on precise terminology (substance, accident, cause, intent), the cumulative lexical substitution alters the *truth claims* of the work.

  Therefore, the phenomenon is **structural**, not genre-specific. However, it is only termed "Ontological Drift" when the subject matter is philosophical. In other genres, it might be called **"Narrative Drift"** or **"Tonal Drift."**

  ### 5. Historical Precedents

  Your intuition regarding Marot is correct. This phenomenon is rampant in the **Neoclassical translation tradition** (Dryden, Pope), where the heroic couplet was often privileged over Aristotelian precision.
  *   **Example:** Alexander Pope's *Iliad*. Pope's need for rhyming couplets often turns Homer's direct, paratactic action into polished, causal epigrams, shifting the metaphysical weight from *fate* to *human agency*.
  *   **Example:** Fitzgerald's *Rubáiyát of Omar Khayyám*. The quatrains are beautiful, but the strict AABA rhyme scheme forces Khayyám's nuanced Sufi ambiguity into a rigid Victorian agnosticism.

  ### Summary Recommendation

  If you are writing on this subject, you should state that while **"Constraint-Induced Conceptual Drift"** is the descriptive standard, there is no single lexicalized term. You are justified in defining it as a specific subtype of **Systemic Distortion** where **Prosodic Determinism** overrides **Semantic Fidelity**, resulting in a **Coherent but Alien Ontology.**

  This distinction elevates the observation from a complaint about "bad translation" to a structural critique of the compatibility between specific philosophical contents and specific poetic forms.
