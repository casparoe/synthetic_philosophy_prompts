answer: |-
  ### The Scenario: The Public Pitch Correction

  **Context:** A startup pitch meeting.
  **Speaker:** CTO (Technical Co-founder).
  **Hearer:** CEO (Non-technical Co-founder, currently presenting).
  **Bystander:** Lead Investor (From a high-context culture where public contradiction is a severe loss of face).

  **The Situation:** The CEO is mid-pitch and states, "Our processing is instantaneous," referring to a backend data task. The CTO knows this is false; the task takes four minutes. The CEO knows this too (they saw the logs yesterday), but is overselling in the heat of the moment. The truth is verifiable by anyone opening the dashboard.

  **The Indirect Move:** The CTO shifts in their seat, clears their throat, and says, "We're aiming for near-real-time latency on that module."
  **The Direct Move:** The CTO interrupts: "Actually, that currently takes four minutes."

  ### Why the Indirect Move is Worse *In the Moment*

  **1. The Hearer Already Knows (No Ignorance Bought)**
  The CEO is not being protected from the truth. They know the latency is four minutes. When they hear "aiming for near-real-time," they do not think, *Oh, good, it is fast.* They decode the hedge immediately: *My partner knows I am lying and is signaling discomfort without stopping me.*

  **2. The Decoded Message (Trust Erosion)**
  Because the CEO decodes the hedge, the indirect move changes the belief state.
  *   **Direct:** The CEO believes: "My partner prioritizes accuracy and our long-term reputation over this investor's comfort."
  *   **Indirect:** The CEO believes: "My partner prioritizes the investor's comfort over my integrity, and is unwilling to back me up when I'm wrong."
  The indirectness transforms a technical correction into a relational betrayal. The CEO now feels isolated *while still speaking*. They have to continue the pitch knowing their partner has publicly signaled that the claim is shaky, leaving the CEO to hold the bag of the lie alone. The cognitive load spikes; the performance worsens immediately.

  **3. The Norm Conflict (Who Governs?)**
  *   **The Bystander (Investor):** Values harmony and face. To them, the Direct Move is aggressive and signals a fractured team (a red flag). The Indirect Move signals a unified, polite front.
  *   **The Hearer (CEO):** Values competence and partnership. To them, the Indirect Move is condescending (treating them like a child who can't handle correction) and cowardly.
  *   **The Conflict:** If you follow the Bystander's norm (Indirect), you sacrifice the Hearer's trust. If you follow the Hearer's need (Direct), you risk the Bystander's capital.
  *   **Why Indirect Loses:** In a co-founder relationship, the internal bond is the asset. Sacrificing the co-founder's trust to spare the *stranger's* feelings is a category error. The indirect move treats the partner as a subordinate to be managed rather than an equal to be corrected.

  ### Analysis

  **Does this suggest the white lie is about the speaker's comfort?**
  Yes. In this triad, the indirect move protects the **Speaker (CTO)** from the awkwardness of confronting the **Bystander (Investor)**. It allows the CTO to maintain a "polite" persona for the investor while signaling to the CEO that *they* are not the one lying, effectively washing their hands of the deception without stopping it. It is moral cowardice disguised as tact. The CTO avoids the social risk of interrupting the investor's positive mood, dumping the ethical burden entirely on the CEO.

  **Does this generalize to ordinary small cases?**
  It generalizes to any case where **verifiability is high** and **relationship equity is high**.
  *   *Ordinary Case:* Telling a friend "You might be running late" when you know they are already late and the train schedule is on the wall.
  *   *Generalization:* When the truth is easily accessible, indirection stops functioning as "protection" and starts functioning as "distancing." It implies, *"I know you know, and you know I know, but I refuse to acknowledge the reality we are both standing in."*
  *   *Limit:* It does *not* generalize to cases where the hearer genuinely lacks the capacity to verify (e.g., "Do I look tired?" when they can't see their own face). In those cases, the lie may still be about the hearer's feelings. But in your specific constraint—where the hearer *could check in five minutes*—the white lie is almost always a bid for the speaker's deniability, not the hearer's comfort.
