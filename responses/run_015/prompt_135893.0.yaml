      *   **Core Thesis:** Standard fink cases (Martin-style) are too static. Masks are temporally layered (finked $\rightarrow$ unfinked $\rightarrow$ refinked).
      *   **Application:** Extends to behavioral dispositions in Large Language Models (LLMs) (honesty masked by context $\rightarrow$ unmasked by prompts $\rightarrow$ masked by jailbreaks).
