answer: |-
  ### Take-Home Exam Question: Individual Impact and Collective Harm
  **Course:** PHI 405 – Ethics of Collective Action
  **Total Marks:** 30
  **Word Limit:** Maximum 900 words

  **Question:**

  Consider the town of **Bridgeville** (population 10,000 drivers). On Tuesdays, if **precisely 5,000** drivers choose to drive one extra mile, a specific structural failure occurs and the town bridge collapses. However, the carbon emissions from those extra miles accumulate linearly and diffusely, contributing to global climate change regardless of the bridge's status.

  Using the Bridgeville case as a comparative frame, write an essay analyzing the **inefficacy objection** across three domains: **Climate Change** (linear/diffuse), **Meat Consumption** (supply chain thresholds), and **Voting** (probabilistic thresholds).

  Your response must address the following:
  1.  **Model Distinction:** Does shifting from a 'linear diffuse harm' model (climate) to a 'threshold harm' model (Bridgeville bridge) make the moral argument against individual action stronger, weaker, or categorically different?
  2.  **Categorization:** Identify whether the inefficacy objection in each domain rests primarily on **causal redundancy** (I didn't cause the harm), **expected impact** (my probable influence is negligible), or **normative redundancy** (my action makes no moral difference).
  3.  **Application:** Apply these distinctions to Meat Consumption and Voting. Does the possibility of supply-chain batching (meat) or pivotal probability (voting) align them closer to the Bridgeville bridge or the Bridgeville carbon emissions?

  Conclude by stating whether the inefficacy objection succeeds in any of these cases when expected utility is accounted for.

  ***

  ### Model Answer Guide (Conceptual Moves Required)

  A top-tier response (27–30 marks) must execute the following conceptual moves without relying on external citations:

  **1. Disentangling the Models (Linear vs. Threshold)**
  *   **Move:** The student must identify that the **Bridgeville Carbon** represents the standard climate argument: every unit adds marginal harm. There is no causal redundancy; every driver causally contributes to the harm, however slightly.
  *   **Move:** The **Bridgeville Collapse** represents a threshold model. If only 4,999 drive, the 4,999th driver caused *no* collapse. This creates **causal redundancy** for those below the threshold.
  *   **Verdict:** The moral argument gets *complicated* in the threshold model, not necessarily weaker. While causal responsibility vanishes for non-pivotal agents, **expected utility** remains. If the probability of being the threshold-trigger is $1/N$, and the harm is $H$, the expected harm is $H/N$.

  **2. Categorizing the Inefficacy Objection**
  *   **Climate:** The objection here is usually about **magnitude**, not causation. I *did* cause some warming, but too little to matter. The counter-argument is purely **expected impact** (tiny probability $\times$ infinite/catastrophic harm = significant obligation).
  *   **Meat:** This aligns closer to **Bridgeville Collapse**. Supply chains often operate in batches (crates of chickens, pallets of beef). If I buy one chicken, I may not trigger a new order (causal redundancy). However, because I cannot know where the threshold is, I must act on **expected impact**.
  *   **Voting:** This is a **probabilistic threshold**. My vote only causes the outcome if it is pivotal. The inefficacy objection relies on **causal redundancy** (my vote rarely decides). The counter-argument is again **expected impact** (probability of pivoting $\times$ value of outcome).

  **3. Synthesizing the Verdict**
  *   **Move:** The student must argue that the inefficacy objection fails in all three cases if one accepts **expected utility theory**.
  *   **Move:** Even in threshold cases (Bridgeville collapse, Meat, Voting), epistemic uncertainty (not knowing the exact threshold or the vote count) forces agents to treat their actions as having non-zero expected impact.
  *   **Crucial Distinction:** A top answer will note that while the *causal* story changes (linear vs. threshold), the *normative* story (expected utility) remains robust across all three. The objection only holds if one rejects expected utility in favor of actual causal difference-making.

  ***

  ### Marking Scheme (30 Marks Total)

  | Component | Marks | Deduction Criteria (Common Mistakes) |
  | :--- | :--- | :--- |
  | **Model Distinction** (Linear vs. Threshold) | 10 | **-5** for treating Bridgeville Carbon and Bridge Collapse as identical.<br>**-3** for failing to explain why thresholds create causal redundancy.<br>**-2** for claiming thresholds make individual action morally irrelevant without addressing expectation. |
  | **Categorization** (Causation vs. Expectation) | 10 | **-5** for conflating causal redundancy with normative redundancy.<br>**-3** for analyzing Climate only as a threshold problem (ignoring linearity).<br>**-2** for ignoring epistemic uncertainty in Meat/Voting cases. |
  | **Application & Synthesis** (Meat/Voting/Verdict) | 10 | **-5** for treating all three domains (Climate, Meat, Voting) as identical.<br>**-3** for concluding the inefficacy objection succeeds without addressing expected utility.<br>**-2** for exceeding word limit or poor structure. |

  **Specific Point Deductions:**
  *   **Mixing up Underdetermination:** If the student argues that we "cannot know" the harm exists (skepticism) rather than "cannot know" if we trigger the threshold (epistemic uncertainty), deduct **3 marks**.
  *   **Ignoring Expectation Calculus:** If the student argues that because I didn't *actually* cause the collapse, I bear no responsibility (ignoring risk imposition), deduct **5 marks** from the Synthesis section.
  *   **Parroting:** If the response defines terms without applying them to the Bridgeville specifics, cap at **15 marks**.

  ***

  ### Reflection: What Would Change My Verdict?

  The model answer assumes that **expected utility theory** is the correct normative framework for resolving inefficacy. This is the weakest link in the reasoning. My verdict would flip if there were compelling evidence that **moral responsibility requires actual causal difference-making** rather than risk imposition.

  For example, if empirical research on meat supply chains showed that individual purchases are **never** pivotal due to massive overproduction buffers (i.e., the threshold is so distant it is metaphysically impossible for a single consumer to trigger it, not just improbable), the expected utility calculation collapses. Similarly, if voting models demonstrated that the probability of a single vote deciding a national election is not just low but **mathematically zero** (due to electoral college structures or non-random error margins), the expected utility argument for voting fails.

  Finally, if a **virtue ethics** framework were applied instead of consequentialism, the entire "impact" calculus becomes irrelevant. If the moral question is "What kind of person drives extra miles?" rather than "Does this mile cause harm?", the inefficacy objection dissolves entirely, not because the impact exists, but because the impact is the wrong metric. Evidence that moral agents intuitively reject expected utility in favor of actual causation would undermine the model answer's reliance on expectation to solve the threshold problem.
