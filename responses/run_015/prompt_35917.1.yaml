answer: |-
  The principle you are looking for is not "When in Rome," nor is it strictly "Cooperation vs. Coordination." Your intuition about the traffic lights is correct: that distinction breaks down because traffic laws *are* cooperative (we all bear the burden of waiting for the safety of all), yet the verdicts differ based on location.

  The principle that saves nearly all your verdicts is **The Principle of Vulnerable Reliance.**

  ### The Principle Stated
  > **A local convention creates a moral obligation for a visitor (or local) when:**
  > 1.  **Reliance:** Others in that context reasonably rely on your compliance to avoid harm, secure a benefit, or maintain a fair system.
  > 2.  **Burden:** Violating the convention shifts a burden onto those complying or undermines a practice they cannot easily opt out of.
  > 3.  **Constraint:** The obligation holds only so long as the convention does not conflict with a higher-order moral duty (e.g., conscience, fundamental rights).

  This principle distinguishes between conventions that are merely *preferential* (escalators) and those that are *constitutive of fairness or safety* (queues, tips, traffic). It also explains why the *same* action (jaywalking) has different moral weights in different places: because the **reliance** of the people around you changes.

  ---

  ### Applying the Principle to Your Cases

  **1. The Queue (Bakery) vs. The Crush (Market)**
  *   **Queue:** The convention is "first-come, first-served." Others rely on this to ensure they aren't skipped. Cutting imposes a time burden on them. **Verdict: Obligation exists.**
  *   **Crush:** The convention is "free-for-all." No one relies on you hanging back; they expect to compete. If you hang back, you harm only yourself (no food). If you push, you harm others, but the local convention *permits* this burden as part of the game. **Verdict: No obligation to push; locals not unfair.**

  **2. Tipping (US vs. Japan)**
  *   **US:** Servers rely on tips for livelihood due to wage structures. Stiffing them shifts the economic burden of the restaurant's wage policy onto the worker. **Verdict: Obligation exists.**
  *   **Japan:** Servers do not rely on tips; wages are structured differently. Tipping relies on a misunderstanding and creates social friction (embarrassment). **Verdict: No obligation.**
  *   **Unjust System:** You asked if a local can opt out of the US system because it's unjust. Under Vulnerable Reliance: **No.** The server is the vulnerable party relying on the tip, not the restaurant owner. Unilateral opt-out punishes the wrong person. The obligation remains until the *system* changes, not the individual transaction.

  **3. The Escalator (Tokyo)**
  *   Standing on the "wrong" side causes minor inconvenience (people have to walk around), but it does not endanger them or steal their turn. The reliance is low-stakes efficiency, not safety or fairness. **Verdict: No moral obligation (mere etiquette).**

  **4. Shoes (Japanese Home)**
  *   The host relies on this for hygiene and respect for their private space. Violating it dirties the home (tangible harm) and insults the host (relational harm). **Verdict: Obligation exists.**

  **5. The Traffic Light Paradox (Boston vs. Germany)**
  *   This is where your "Cooperation vs. Coordination" theory struggled. Traffic lights are *cooperative* (we all wait for safety). So why the difference?
  *   **Germany (with kids):** The social contract relies on strict compliance to teach safety norms to the vulnerable (children). Violating it undermines the educational fabric and safety reliance. **Verdict: Wrong.**
  *   **Boston (German Visitor):** The local norm is lax, but the *law* (safety) remains. The visitor following the law harms no one. The visitor is not obligated to *break* the safety rule to coordinate with lawbreakers, because lawbreakers are not the ones setting the *legitimate* reliance standard. **Verdict: Not wrong to wait.**
  *   *Key Distinction:* You are never obligated to violate a safety rule to fit in. You *are* obligated to follow safety rules when the local culture relies on that strictness for public order.

  ---

  ### The Test Case: The Vegetarian Guest

  **Scenario:** A vegetarian visits a culture where refusing meat is a serious affront.
  **Analysis:**
  1.  **Reliance:** The host relies on the guest honoring their hospitality to maintain social bond/status.
  2.  **Burden:** Refusing causes emotional offense/social friction.
  3.  **Constraint:** Eating meat violates the guest's conscience (a higher-order moral duty regarding bodily integrity or animal welfare).

  **Verdict:** **The guest may decline.**
  Under the Principle of Vulnerable Reliance, conventions bind *unless* they conflict with higher-order moral duties. Conscience trumps etiquette. However, because the host's reliance is real (social harm), the guest has a **secondary obligation to mitigate the harm**. They must refuse politely, offer a plausible alternative explanation if possible (e.g., "I have a dietary restriction" rather than "Your food is immoral"), and participate fully in the rest of the ritual. The convention is overridden, but the relationship must still be honored.

  ---

  ### A New Case to Test the Principle

  **Case:** *The Silent Train Car.*
  In Tokyo, talking on phones in train priority seats is forbidden. In New York, talking loudly on the subway is common, though annoying.
  *   **Visitor in Tokyo:** Talks on phone in priority seat.
      *   **Reliance:** Passengers (including elderly/pregnant) rely on silence for a stress-free, accessible environment.
      *   **Burden:** Violation creates tangible stress and undermines the accessibility scheme.
      *   **Verdict:** **Wrong.** (Obligation exists).
  *   **Visitor in New York:** Talks on phone in subway.
      *   **Reliance:** Passengers expect noise; it is a "crush" environment like the market.
      *   **Burden:** Annoyance, but no violation of a specific cooperative scheme.
      *   **Verdict:** **Rude, but not morally wrong.** (No obligation to be silent).

  ### Summary of What to Drop
  To make this principle work, you must drop the idea that **all** coordination is morally neutral. Traffic lights are coordination, but they have high-stakes reliance (safety). Escalators are coordination with low-stakes reliance (efficiency). The moral weight comes from the **stakes of the reliance**, not the category of the convention.

  **Final Rule of Thumb:**
  If breaking the rule hurts someone who is playing by the rules, you must follow it. If breaking the rule only hurts you, or if everyone is already breaking it without harm, you are free. If following the rule hurts your conscience, you may break it, but you must apologize for the trouble.
