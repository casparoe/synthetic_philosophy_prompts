answer: |-
  Move the "software speed" objection from your Q&A defence into the talk itself, because it is the only point that genuinely threatens to collapse your printing press ranking.

  ### **Prep Sheet: Q&A Strategy**

  **What to Concede in Your First Two Minutes**
  Do not wait to be cornered on the speed of digital diffusion. Explicitly state: "I am not arguing AI spreads as slowly as movable type physically did. I am arguing that *institutional* absorption—laws, habits, literacy—still takes generations, even if the code travels at light speed." This neutralises the biggest weapon against your printing press argument before you finish speaking. It shows you've thought about the difference between transmission and integration.

  **Objections Ordered by Damage**

  **1. The "Digital Compression" Objection (High Damage)**
  *   **Who:** A senior software dev or one of the STS postgrads.
  *   **Phrasing:** "You're comparing physical print runs to digital weights. Print required shipping books and teaching people to read over centuries. AI copies instantly and runs itself. Doesn't that compress the lag you're relying on to put printing first?"
  *   **Your Reply (90 seconds):** "It compresses the transmission, not the integration. In logistics, moving a parcel is easy; changing the warehouse layout to fit it takes months. With print, the bottleneck wasn't the press, it was the reader. With AI, the bottleneck isn't the model, it's the workflow. We're seeing companies slap AI onto old processes and get mess, not value. The 'literacy' for AI isn't reading text, it's knowing when to trust the output. That requires institutional trust, liability laws, and new habits. Those don't update at software speed; they update at human speed. So the lag remains, even if the copy is instant."
  *   **Where it's Soft:** You're assuming institutional change *must* be slow. It might be faster this time because the technology forces the change (e.g., coders *must* adapt or lose jobs). You don't have data on how fast 'institutional literacy' can shift under economic pressure.

  **2. The "Compute is Hardware" Objection (Medium-High Damage)**
  *   **Who:** The historian of twentieth-century military R&D.
  *   **Phrasing:** "You say nukes were state-gated because of enrichment plants. But AI needs massive GPU clusters and power grids. Isn't compute capacity the new enrichment facility, making the nuke analogy valid after all?"
  *   **Your Reply (90 seconds):** "It's a valid parallel on capital cost, but not on secrecy. You could hide a centrifuge programme; you can't hide a data centre burning fifty megawatts. But here's the difference: nuclear know-how was locked in people's heads and classified docs. AI know-how is in the weights, which leak constantly. Even if hardware is gated, the models escape. With nukes, if you stole the blueprint, you still couldn't build the bomb without the state infrastructure. With AI, if you steal the weights, you can run it on a rented cluster. The gatekeepers are weaker because the dual-use knowledge is already out."
  *   **Where it's Soft:** [Historical Flag] You are assuming model weights are the only valuable knowledge; some argue the training recipes are the real secret. Also, hardware restrictions *are* currently working to slow down certain actors, so the analogy isn't dead yet.

  **3. The "Deskilling Velocity" Objection (Medium Damage)**
  *   **Who:** A working developer worried about their job.
  *   **Phrasing:** "The Industrial Revolution took decades to deskill weavers. AI is deskilling coders right now. Why rank Industrial Revolution second if the effect is happening faster than your timeline allows?"
  *   **Your Reply (90 seconds):** "Deskilling is happening, but power isn't shifting yet. The loom didn't give power to the worker; it gave it to the factory owner who owned the machine. We're seeing the deskilling, but we haven't seen the second-order effect: who owns the output? During the Industrial Revolution, it took generations of unions and laws to decide who benefited. We're in the 'loom' phase, not the 'Labour Party' phase. The bottleneck lifted was muscle power; the gatekeepers were capital owners. The bottleneck lifting now is cognitive labour; the gatekeepers are still settling."
  *   **Where it's Soft:** You're betting on history repeating regarding labour power. It might not; labour might be irrelevant this time, not just deskilled.

  **4. The "Category Error" Objection (Low Damage/Point-Scoring)**
  *   **Who:** A philosophy postgrad.
  *   **Phrasing:** "Aren't you just redefining 'analogy' to mean 'causal mechanism'? If you strip out the context, isn't this a category error?"
  *   **Your Reply (90 seconds):** "I'm using the word pragmatically, not philosophically. When people say 'this is like the printing press', they're trying to predict outcomes. I'm saying that's the wrong tool. The right tool is finding the bottleneck. Call it a mechanism, a model, or an analogy—I don't care. I care that the current usage leads to bad predictions about secrecy and timelines. I'm trying to fix the tool, not the definition."
  *   **Where it's Soft:** Philosophically, you are vulnerable. They know you know they know. Don't get drawn into a semantics debate; pivot back to utility.

  **5. The "Hope Nobody Asks" Objection (Personal Credibility)**
  *   **Who:** An STS postgrad looking to land blood.
  *   **Phrasing:** "Given you haven't engaged with the existing literature on technological determinism, aren't you worried you're reinventing the wheel while missing the established critiques?"
  *   **Your Reply (90 seconds):** "I am worried about that, which is why I'm sticking to the logic of bottlenecks rather than claiming historical novelty. I work in logistics; I see where systems jam. I'm applying that lens here. If the literature says something different, I'd welcome it, but I haven't seen these analogies tested against binding constraints specifically. I'm offering a test, not a thesis."
  *   **Where it's Soft:** This is an ad hominem trap. If you sound defensive, you lose. Own the "outsider" status as a feature (practical lens) not a bug.

  **Summary of Force**
  *   **Real Force:** Objections 1 and 2. These attack the core mechanics of your ranking. Prepare to stand your ground but acknowledge the uncertainty.
  *   **Point-Scoring:** Objections 4 and 5. These are about status and definitions. Dismiss them politely and return to the bottleneck test.
  *   **The Pivot:** If you get stuck, return to your two-part test. Ask the questioner: "Which bottleneck do you think binds, and who gatekept the second-order effects in your preferred analogy?" Make them do the work.
