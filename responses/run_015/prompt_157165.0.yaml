      *   **The "Relocation" Objection:** In decision theory literature (e.g., Christian Tarsney, William MacAskill, Hayden Wilkinson), bounding utility is often argued to *relocate* the problem rather than solve it. Why? Because even with bounded utility, you can still get fanaticism if the probability is small enough relative to the difference in utility between outcomes, or if you introduce *lexicographic* preferences or simply compare two bounded outcomes where one has a tiny chance of being slightly better. More importantly, bounded utility functions often violate standard axioms (like Unboundedness or Dominance principles in certain formulations) or lead to "timidity" (rejecting favorable bets). However, the specific "relocation" argument usually hinges on the fact that you can construct a new fanaticism problem *within* the bounds (e.g., a tiny chance of getting U_max vs. a certain U_max - epsilon). Or, more technically, bounded utility functions can violate the "Dominance" principle if not careful, or they imply that at some point, adding more lives saved doesn't add more utility, which has its own counterintuitive implications (sadistic conclusions).
      *   **Student's Claim:** "Once the expectation is capped, dominance is fixed by arithmetic, not by philosophy." *Assessment:* This is actually wrong. Bounding utility creates issues with continuity and dominance. If I have a bounded utility function, there is some maximum value $U_{max}$. Consider a choice between a certain $U_{max} - \epsilon$ and a probability $p$ of $U_{max}$ and $1-p$ of 0. For sufficiently small $p$, EU theory might still prefer the gamble if $(p \times U_{max}) > (U_{max} - \epsilon)$. But more critically, the "relocation" argument is that bounded utility leads to *non-linear* weighting that violates standard rationality axioms (like the Archimedean axiom) or implies that vast differences in outcomes (e.g., extinction vs. survival) might be valued similarly once you hit the bound. The student dismisses the relocation objection too confidently. The consensus in contemporary decision theory (especially regarding longtermism) is that bounding *mitigates* but introduces new problems (like violating dominance or implying "satiation" where preventing extinction isn't worth much if we are already near the bound).
