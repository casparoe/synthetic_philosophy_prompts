      *   *Check:* The "daily beliefs" point.
      *   *Correction:* The podcast says most daily beliefs aren't backed by proof. James would agree we operate on habits/assumptions, but Clifford would argue we *should* strive for evidence. The podcast implies Clifford is wrong because people *don't* have proof. James argues people *can't* have proof in certain areas, so they shouldn't be barred from believing. Slight difference.

