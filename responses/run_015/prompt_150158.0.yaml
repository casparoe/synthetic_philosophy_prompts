prompt: |-
  I write courtroom fiction, and I am trying to get something right that is not really a matter of dialogue or plot: the theory of emotion that my characters' legal world is quietly committed to. I would like your help reconstructing it, because I keep finding that the practices I am describing pull in different directions, and I cannot tell whether that is my own muddle or the doctrine's.

  Consider the cluster of practices I am working with. A killing done in the heat of passion is treated as a lesser offence than the same killing done deliberately, but only if the killer acted before there was time to cool off: he may have driven across town, bought a weapon, or waited several hours, and the mitigation fails on that basis alone, even if his rage is in no way diminished. The provocation must also be one that would have moved a reasonable person, and in some jurisdictions the question is put in explicitly evaluative terms, asking whether the deceased gave the defendant a justifiable sense of being seriously wronged. A history of small provocations culminating in a trivial final trigger is sometimes allowed in, so that the last straw counts although it could not have moved anyone by itself. Words alone have traditionally not been enough, though a blow is. Separately: remorse counts in a defendant's favour at sentencing, but an apology read out by counsel counts for almost nothing, and a defendant's bare assertion that he was terrified or grief-stricken is treated as nearly worthless unless it shows in what he did. Probation conditions routinely include anger-management courses, on the assumption that a disposition to anger is something a person can be made to work on and be held to account for failing to work on. And the same culture that runs these rules also gives a short window in which to cancel a contract signed at the kitchen table under a salesman's pressure, and imposes a pause before a strike may begin, on the reasoning that the agitation of the moment is temporary and that a night's reflection dissolves it.

  What I want from you is the implicit theory of emotion that this pattern presupposes, worked out rather than named. Which parts of it only make sense if an emotion is a bodily agitation or feeling that swells, decays with time, and is dispelled by deliberation? Which parts only make sense if an emotion is an appraisal or evaluative judgment that can be reasonable or unreasonable, well-grounded or not, and therefore something we can be answerable for? Which parts sit best with the view that emotions are perceptions of value or concern-based construals, apt or inapt in the way a perception is veridical or not? Be careful to distinguish what these practices strictly presuppose from what they merely fit comfortably with, and tell me where they are underdetermined, so that two or three rival theories would license exactly the same rules and my characters could reasonably disagree. Where the pattern seems to me inconsistent, say whether it really is: does the mitigation have to treat emotion as an involuntary storm that displaces agency, given that the same system trains offenders out of their anger, discounts unexpressed remorse, and asks juries to assess whether the passion was warranted?

  Then I want the counterfactual, because that is what my draft actually needs. Take each of the three families of theory in turn and tell me what would have to change in practice if it were the one the law adopted: which of the requirements above survives, which collapses as incoherent, and which would have to be replaced by something else. In particular, tell me what a cooling-off rule could even mean on a view where emotions carry content and can be more or less justified, and what a reasonable-person test could mean on a view where emotions are only felt disturbances.

  One last thing, which is where I have had to invent. My manuscript is set in a jurisdiction that does not exist, and I have given it a rule I have never seen anywhere: the mitigation is unavailable unless the jury finds that the defendant's anger was about the thing he says it was about, so that a man enraged at his own humiliation rather than at what was done to him, or a man who kills the wrong person in a transported fury, gets no reduction. I would like to know which theory of emotion that rule is secretly legislating, whether it is coherent on the terms of the theory that seems to motivate it, and what the cross-examination of such a defendant would sound like under each of the three views. Reason it out from the concepts; I do not need authorities, names, or further reading, and I would rather have your argument than a survey of the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Reconstruct the implicit theory of emotion presupposed by a specific cluster of legal practices in courtroom fiction.
      *   **Input Data (Legal Practices):**
          1.  Heat of passion mitigation (requires lack of cooling-off time).
          2.  Reasonable person standard for provocation (evaluative).
          3.  Cumulative provocation (last straw doctrine).
          4.  Words vs. Blow distinction.
          5.  Remorse/Apology (actions count, words don't).
          6.  Anger management (disposition is controllable/trainable).
          7.  Contract cancellation/Strike pause (agitation is temporary, reflection dissolves it).
          8.  *Fictional Rule:* Mitigation requires anger to be about the *actual* cause (no misdirected fury, no self-focused humiliation vs. external wrong).
      *   **Tasks:**
          1.  Identify the implicit theory (or theories) of emotion.
          2.  Distinguish what is strictly presupposed vs. what fits comfortably vs. what is underdetermined.
          3.  Address apparent inconsistencies (involuntary storm vs. accountable disposition).
          4.  **Counterfactual Analysis:** Take three specific theories (Bodily Agitation, Evaluative Judgment, Perception of Value) and determine what practices would survive, collapse, or change if that theory were explicitly adopted.
          5.  **Analyze the Fictional Rule:** Determine which theory it legislates, its coherence, and draft cross-examination scenarios for each theory.
      *   **Constraints:** No authorities/names/reading lists. Reason from concepts. Argument over survey.

  2.  **Deconstruct the Input Practices (The "Doctrine"):**
      *   *Cooling-off:* Implies emotion is transient, physiological, and overridden by reason over time. (Fits "Bodily Agitation").
      *   *Reasonable Person/Justifiable Wrong:* Implies emotion has cognitive content that can be assessed for rationality. (Fits "Evaluative Judgment").
      *   *Cumulative Provocation:* Implies emotion is a reservoir or pressure system, not just a reaction to a single stimulus.
      *   *Words vs. Blow:* Implies a threshold of physical impact is needed to trigger the "storm," or that words allow more time for reason to intervene.
      *   *Remorse/Apology:* Implies emotion must be enacted/embodied to be real. Inner feeling is inaccessible/irrelevant.
      *   *Anger Management:* Implies emotions are habits/dispositions subject to will/training.
      *   *Contract/Strike Pause:* Implies the "self" in agitation is not the "true" self; the reflective self is the authoritative one.
      *   *Fictional Rule (Object-Directedness):* Implies emotion is intentional (about something) and accuracy matters.

  3.  **Synthesize the Implicit Theory (Task 1):**
      *   Is it one theory? No, it's a hybrid. It treats emotion as a *force* (to be cooled) and a *claim* (to be judged).
      *   *The Inconsistency:* The user asks if the mitigation *has* to treat emotion as an involuntary storm if the system also trains offenders.
      *   *Resolution:* The law doesn't need a metaphysical theory; it needs a *functional* one. It treats emotion as a **temporary suspension of normative competence** caused by a **justified (or understandable) disruption.**
      *   *Strict Presuppositions:*
          *   Emotion affects agency (mitigation).
          *   Time affects emotion (cooling-off).
          *   Social norms affect emotion's validity (reasonable person).
          *   Behavior evidences emotion (remorse/anger management).
      *   *Underdetermined Areas:* The ontological status of the feeling. Is it a chemical surge or a belief? The law doesn't care, as long as the *effects* are predictable.

  4.  **Counterfactual Analysis (Task 2):**
      *   *Theory A: Bodily Agitation (James-Lange style / Passion as Storm).*
          *   Focus: Physiology, arousal, loss of control.
          *   *Cooling-off:* Essential. Physiology decays.
          *   *Reasonable Person:* Incoherent. Why does a "reasonable" body react differently? A weak body might react more.
          *   *Fictional Rule (Object):* Incoherent. A storm doesn't have an object, just a direction. Misdirected fury is still a storm.
          *   *Anger Management:* Hard to justify. You don't "train" a reflex, you medicate or avoid triggers.
      *   *Theory B: Evaluative Judgment (Stoic / Cognitive).*
          *   Focus: Beliefs, appraisals, rationality.
          *   *Cooling-off:* Problematic. If the judgment stands ("he wronged me"), time shouldn't matter. Needs reinterpreted as "time for re-evaluation."
          *   *Reasonable Person:* Essential. Was the judgment correct?
          *   *Fictional Rule (Object):* Essential. Judgments are about propositions. False proposition = no mitigation.
          *   *Anger Management:* Essential. You can retrain thoughts.
      *   *Theory C: Perception of Value (Concern-based Construal).*
          *   Focus: Seeing the world in a certain light (like seeing a duck-rabbit).
          *   *Cooling-off:* Fits well. Perceptions shift when context changes.
          *   *Reasonable Person:* Fits well. Is the perception shared/normal?
          *   *Fictional Rule (Object):* Fits well. Perceptions have intentionality.
          *   *Remorse:* Fits well. A change in perception leads to change in action.

  5.  **Analyzing the Fictional Rule (Task 3):**
      *   *Rule:* Mitigation unavailable unless anger is about the *actual* cause (no misdirected fury, no self-focused humiliation).
      *   *Theory Legislated:* This strongly favors **Evaluative Judgment** or **Perception of Value**. It demands *Intentionality* and *Accuracy*. A bodily storm doesn't care about accuracy.
      *   *Coherence:* It creates tension with "Heat of Passion." If passion overwhelms reason, why demand cognitive accuracy? It turns the defense into a "Reasonable Mistake" defense rather than a "Loss of Control" defense.
      *   *Cross-Examination:*
          *   *Bodily View:* "Did your blood boil?" (Irrelevant to object).
          *   *Judgment View:* "What exactly did he do? Did you believe he did it? Was that belief true?"
          *   *Perception View:* "How did the situation look to you? Could it have looked otherwise?"

  6.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Analytical, precise, respectful of the writer's craft. Avoid academic jargon where possible, but use the concepts requested.
      *   *Structure:*
          1.  The Implicit Theory (The Hybrid).
          2.  The Inconsistency (Agency vs. Storm).
          3.  Counterfactuals (The Three Theories).
          4.  The Fictional Rule (Analysis & Cross-Examination).
      *   *Refining the "Inconsistency":* The law isn't inconsistent; it's *pragmatic*. It treats the defendant as a *citizen* who lost control, not a *patient* who had a seizure. The "training" applies to the citizen's duty to regain control.
      *   *Refining the Counterfactuals:* Make sure to explicitly state what *collapses*. E.g., Under Bodily Agitation, the "Reasonable Person" test collapses into a "Average Physiological Reactivity" test.
      *   *Refining the Fictional Rule:* This is the crux. It shifts the defense from "I couldn't help it" to "I was right to be angry, but only about *this*." It makes the emotion a *propositional attitude*.

  7.  **Final Review against Constraints:**
      *   Did I name theorists? No.
      *   Did I give reading lists? No.
      *   Did I answer the specific questions about cooling-off and reasonable person under different theories? Yes.
      *   Did I address the cross-examination? Yes.

  8.  **Self-Correction during drafting:** I initially thought about calling the third theory "Constructivist." But the prompt suggests "Perception of Value/Concern-based Construal." I should stick to the prompt's phrasing to ensure alignment. I need to make sure I don't just say "it depends" but actually take a stance on where the law is underdetermined. The law is underdetermined on the *ontology* of emotion but determined on the *normativity* of it.

      *Wait, one nuance:* The prompt asks about "Words vs. Blow." Under Bodily theory, a blow causes a physical reflex. Words do not. Under Judgment theory, words can convey a judgment (insult) just as well as a blow. The law's preference for blows suggests a Bodily bias, but the "Justifiable Wrong" exception suggests a Judgment bias. I need to highlight this tension.

      *The Fictional Rule:* "Anger about the thing he says it was about." This is an *Intentionality* requirement. A storm has no intention. A judgment does. This rule kills the Bodily theory. I need to make that clear.

      *Cross-Examination:* Needs to sound like a lawyer, not a philosopher. "You say you were angry, but who at?" vs "Did your heart race?"

      *Let's assemble.*
answer: |-
  The legal practices you describe do not rest on a single, coherent metaphysical theory of emotion. Instead, they rest on a **functional hybrid** that treats emotion simultaneously as a *force* that compromises agency and a *claim* that asserts normative standing. The law is not muddled; it is pragmatic. It extracts what it needs from competing theories to serve two conflicting goals: excusing the loss of control while maintaining the demand for civic rationality.

  Here is the reconstruction of the implicit theory, the analysis of its tensions, the counterfactual scenarios, and the evaluation of your fictional rule.

  ### I. The Implicit Theory: The Normative Storm

  The doctrine presupposes that emotion is a **temporary suspension of normative competence caused by a justified disruption.**

  This hybrid view strictly presupposes three things:
  1.  **Temporality:** Emotion is an event with a trajectory (onset, peak, decay). It is not a permanent state. This is required for the "cooling-off" rule and the contract cancellation window.
  2.  **Intentionality:** Emotion is *about* something. It is not just a mood; it is a response to a specific stimulus. This is required for the "reasonable person" test (reasonable response to *what*?) and your fictional rule.
  3.  **Expressivity:** Inner states are legally irrelevant unless externalized. This is required for the rules on remorse (actions over words) and anger management (behavioral modification).

  **Where the pattern is underdetermined:**
  The ontology of the emotion is underdetermined. The law does not care whether the "heat of passion" is a surge of adrenaline or a sudden belief that one has been wronged. It only cares that the *effect* on the defendant's capacity for self-government is the same. Consequently, your characters can disagree on the nature of emotion without breaking the legal logic, provided they agree on its *effects*. A neuroscientist character and a stoic philosopher character could both agree that the defendant waited too long to strike, for entirely different reasons.

  **The Apparent Inconsistency:**
  You ask if the mitigation treats emotion as an involuntary storm while the system trains offenders out of anger. This is not a contradiction; it is a distinction between **capacity** and **responsibility**.
  *   **The Mitigation (The Storm):** Acknowledges that in the acute moment, the capacity for rational choice is physically or cognitively narrowed. The defendant is treated as having diminished *capacity*.
  *   **The Sentencing/Probation (The Training):** Assumes that between incidents, the defendant has full capacity to manage their dispositions. The law treats the *disposition* to anger as a character trait that the citizen is responsible for maintaining.
  *   **Resolution:** The law treats the *episode* as an accident, but the *susceptibility* to the episode as a fault. This allows the system to say, "You were not fully yourself when you killed him, but you are responsible for becoming the kind of person who loses yourself so easily."

  ### II. The Counterfactuals: If One Theory Ruled

  If you force the legal system to commit to one specific theory of emotion, several existing practices become incoherent and must collapse or transform.

  #### 1. Theory of Bodily Agitation (Emotion as Physiological Storm)
  *View:* Emotion is a visceral disturbance, a surge of blood or nerve impulse that overrides reason. It is non-cognitive.
  *   **Cooling-Off Rule:** **Survives and strengthens.** If emotion is a physiological decay curve, the rule is medically necessary. Once the adrenaline metabolizes, agency returns.
  *   **Reasonable Person Test:** **Collapses.** A bodily storm is not "reasonable" or "unreasonable"; it is strong or weak. Asking if a "reasonable person" would be provoked is like asking if a "reasonable person" would sneeze when peppered. The test would have to change to an **Average Reactivity Test**: "Would a person with average physiological sensitivity have surged?" This removes the moral evaluation of the provocation.
  *   **Words vs. Blow:** **Survives.** A blow causes a physical reflex; words do not. This distinction becomes absolute.
  *   **Anger Management:** **Becomes Medical.** You cannot "train" a reflex like a knee jerk. Probation would require medication or avoidance therapy, not cognitive courses.
  *   **Your Fictional Rule:** **Incoherent.** A storm has no object. If a man is in a physiological frenzy, it does not matter if he attacks the wrong person or the right person for the wrong reason. The fury is the excuse. Your rule would have to be abolished.

  #### 2. Theory of Evaluative Judgment (Emotion as Belief)
  *View:* Emotion is a judgment that a value has been violated (e.g., Anger = "I have been wronged"). It is cognitive and propositional.
  *   **Cooling-Off Rule:** **Becomes Problematic.** If I judge that you wronged me, that judgment remains true tomorrow. Why should time mitigate the killing? To save this, the rule must be reinterpreted not as "time for feelings to fade" but as "time for **re-evaluation**." The law would argue that a sustained judgment implies a settled intent, which is murder, whereas a snap judgment implies a glitch in reasoning.
  *   **Reasonable Person Test:** **Survives and deepens.** This is the natural home of this theory. The question becomes: "Was the defendant's judgment correct?"
  *   **Words vs. Blow:** **Collapses.** If anger is a judgment of wrong, words can convey a wrong just as effectively as a blow. The distinction would vanish. Insults would be sufficient provocation if the judgment of insult was reasonable.
  *   **Anger Management:** **Survives as Education.** Since anger is a pattern of judgment, it can be corrected through reasoning and cognitive restructuring.
  *   **Your Fictional Rule:** **Survives perfectly.** If anger is a judgment, it must be about a specific proposition. If the proposition is false (wrong person) or misidentified (humiliation vs. wrong), the judgment is flawed, and the mitigation fails.

  #### 3. Theory of Perception of Value (Emotion as Construal)
  *View:* Emotion is seeing the world in a certain light (e.g., seeing a remark as an insult). It is quasi-perceptual. It is not a cold judgment, but it has content.
  *   **Cooling-Off Rule:** **Survives.** Perceptions can shift as context changes. A "cooling off" period allows the defendant to see the situation in a different light.
  *   **Reasonable Person Test:** **Survives.** The question is: "Is this a shared way of seeing the world?" (i.e., Is the perception veridical or shared by the community?)
  *   **Words vs. Blow:** **Weakens.** Words can alter perception, but a blow alters it more immediately. The distinction becomes a matter of degree, not kind.
  *   **Anger Management:** **Survives as Habituation.** One can train oneself to perceive situations differently (e.g., seeing a slight as ignorance rather than malice).
  *   **Your Fictional Rule:** **Survives.** Perceptions have intentionality (they are *of* something). Misperceiving the object of the anger (killing the wrong person) is like mistaking a rope for a snake; the fear is real, but the justification for the reaction is void.

  ### III. The Fictional Rule: "The Object of Anger"

  **The Rule:** Mitigation is unavailable unless the jury finds the defendant's anger was about the *actual* cause (no misdirected fury, no self-focused humiliation).

  **Which Theory is Legislated?**
  This rule secretly legislates the **Theory of Evaluative Judgment** (or Perception of Value). It explicitly rejects the Bodily Agitation theory.
  *   **Why:** A bodily storm is non-intentional. If a man is blinded by rage, the source of the rage is irrelevant to the loss of control. By requiring the anger to be *accurately directed*, the law is demanding that the emotion possess **cognitive accuracy**. It treats the passion not as a loss of reason, but as a *specific kind of reasoning* that must be valid to count as an excuse.

  **Coherence:**
  It is coherent, but it shifts the defense from "Loss of Control" to "Justified Reaction." It creates a tension: the law admits the defendant was overwhelmed, but demands they were overwhelmed *correctly*. It implies that there is a "right way" to lose control. This fits your hybrid system: it excuses the violence but polices the narrative.

  **Cross-Examination Scenarios**

  Here is how the cross-examination of the defendant changes under each theory, given your fictional rule.

  **1. Under Bodily Agitation (The Theory the Rule Rejects)**
  *   *Defense Counsel:* "Your blood was up? You couldn't think?"
  *   *Defendant:* "Yes. I saw red."
  *   *Prosecutor (attacking the Fictional Rule):* "You say you saw red. But you hit Mr. X. Was Mr. X the one who insulted you?"
  *   *Defendant:* "No, it was his brother. But I was too angry to tell."
  *   *Prosecutor:* "So your body reacted to the brother?"
  *   *Defendant:* "It reacted to the anger."
  *   *Outcome:* Under a pure Bodily theory, the Defendant wins the mitigation. Under your Fictional Rule, he loses. The cross-examination here highlights the *injustice* of the rule from a physiological perspective. The lawyer would argue: "The law asks us to judge a seizure. Does a seizure care about names?"

  **2. Under Evaluative Judgment (The Theory the Rule Embraces)**
  *   *Defense Counsel:* "You believed he had wronged you?"
  *   *Defendant:* "Yes. He stole from me."
  *   *Prosecutor:* "But you killed the man standing next to him. Did you believe *that* man stole from you?"
  *   *Defendant:* "I assumed they were together."
  *   *Prosecutor:* "So your judgment was hasty?"
  *   *Defendant:* "It was angry."
  *   *Prosecutor:* "Anger is a judgment, Mr. Doe. If the premise is false, the anger is unreasonable. If the anger is unreasonable, the killing is murder. You didn't lose your mind; you made a mistake. And the law does not excuse mistakes of identity in a rage."
  *   *Outcome:* The cross-examination focuses on the **truth value** of the defendant's internal state. The lawyer treats the emotion as an argument the defendant made with a weapon.

  **3. Under Perception of Value (The Middle Ground)**
  *   *Defense Counsel:* "The situation looked like a betrayal to you?"
  *   *Defendant:* "It looked like they were all against me."
  *   *Prosecutor:* "But look at the photo. The man you killed was looking away. He wasn't part of the circle. Did the world *look* like he was the enemy, or did you just *decide* he was?"
  *   *Defendant:* "In that moment, he was the enemy."
  *   *Prosecutor:* "Perception can be distorted. We allow mitigation for distortion caused by shock. But we do not allow it for distortion caused by your own narrative. Did you see him threaten you, or did you feel threatened and project it onto him?"
  *   *Outcome:* The cross-examination focuses on the **veridicality of the experience**. It distinguishes between an illusion (excusable) and a projection (inexcusable).

  ### Summary for your Draft

  Your legal world is not muddled; it is **bifurcated**. It uses a Bodily theory to determine *when* the crime happened (the cooling-off window) and a Judgment theory to determine *why* it happened (the reasonable person/object rule).

  The inconsistency you feel is the friction between these two layers.
  *   If you want to emphasize the **tragedy** of the defendant, lean into the Bodily theory in the narrative (the shaking hands, the tunnel vision) while the law coldly applies the Judgment theory (the precise questions about the object of rage).
  *   If you want to emphasize the **rigor** of the law, show the judge explaining that "Passion is not a blind force; it is a witness. And like any witness, it must be accurate to be believed."

  Your fictional rule is the keystone. It forces the "Heat of Passion" defense to admit that it is actually a "Reasonable Error" defense. This makes your courtroom drama more intellectual: the fight isn't about whether the defendant was angry, but whether his anger was *true*.
