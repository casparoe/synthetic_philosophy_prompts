      *   *Key Text:* "Intention" (1957 book) - *The philosophical groundwork.*
      *   *Key Concept:* The Doctrine of Double Effect (DDE). Anscombe was a *Catholic* philosopher. She generally *defended* a rigorous version of DDE against consequentialism, but she attacked the *misuse* of it to justify area bombing.
