answer: |-
  This is an excellent instinct. Your suspicion that the encyclopedia entry stretches Anscombe's argument in the second half is well-founded. While the paragraph captures the *spirit* of her public intervention, it misrepresents the *technical philosophy* that undergirds it. Specifically, it attributes to her a collapse of the distinction between intention and foresight that she spent her career defending.

  Here is an accuracy audit of the passage, broken down by claim, followed by a specific correction regarding nuclear deterrence.

  ### Part 1: Audit of the Encyclopedia Passage

  **Claim 1:** *"Anscombe's objection was not a pacifist objection to war, or even to aerial bombing as such. It was a point about the concept of murder."*
  *   **Verdict: Accurate.**
  *   **Comment:** Anscombe was a Just War theorist, not a pacifist. She believed some wars and some killings in war were legitimate. Her objection was specifically to the intentional killing of the innocent, which she defined as murder regardless of the context of war.

  **Claim 2:** *"The inhabitants of Hiroshima and Nagasaki were innocent in the relevant sense: they were not combatants and were not supplying Japan's war effort."*
  *   **Verdict: Mostly Accurate (with historical nuance).*
  *   **Comment:** Anscombe's definition of "innocent" is technical: those not engaged in unjust attack. She acknowledged that workers in munitions factories could be legitimate targets. However, she argued that *area bombing* (destroying a whole city) treats everyone as a target regardless of their specific role. The encyclopedia simplifies this, but the moral point Anscombe made stands: the bombing strategy did not discriminate between combatants and non-combatants.

  **Claim 3:** *"The United States killed them deliberately, as a means of forcing Japan to surrender. That makes Truman a murderer..."*
  *   **Verdict: Accurate.**
  *   **Comment:** This is the core of her pamphlet *Mr. Truman's Degree*. She argued that because the destruction of the cities was the *method* chosen to force surrender, the deaths were intended as a means, not merely accepted as a side effect.

  **Claim 4:** *"The defense that Truman only signed a piece of paper is like saying the man who hires an assassin has not killed anyone."*
  *   **Verdict: Accurate.**
  *   **Comment:** Anscombe emphasized command responsibility. The moral agency lies with the person who wills the act, not just the physical agent.

  **Claim 5:** *"The defense that, if killing harmless people is murder, then killing enemy soldiers in their sleep must also be murder, fails because Anscombe's distinction is between combatants and noncombatants, not between people who are dangerous at a given moment and people who are not."*
  *   **Verdict: Accurate.**
  *   **Comment:** This is a crucial distinction in Just War theory that Anscombe upheld. A sleeping soldier is still a combatant (has a status); a civilian is not. The encyclopedia gets this right.

  **Claim 6:** *"Her deepest objection, however, was to the doctrine of double effect. Catholic moralists, she thought, had turned double effect into a loophole..."*
  *   **Verdict: Simplification / Partially Misleading.*
  *   **Comment:** Anscombe was a Catholic Thomist; she did not reject the Doctrine of Double Effect (DDE) itself. She rejected the *casuistical abuse* of it. She argued that area bombing could not be justified by DDE because the civilian deaths were not "side effects"; they were part of the plan to demoralize the enemy. The encyclopedia makes it sound like she attacked the doctrine itself, rather than its fraudulent application in this instance.

  **Claim 7:** *"If the deaths are foreseen, she held, they are intended; intention just is what you accept will happen."*
  *   **Verdict: Simply Wrong.*
  *   **Comment:** **This is the critical error.** This statement contradicts Anscombe's magnum opus, *Intention* (1957). Anscombe famously argued that there *is* a moral difference between what we intend and what we merely foresee.
      *   *Her actual view:* In the case of Hiroshima, the deaths were intended because the destruction of the city was the *means* to the end (surrender).
      *   *The Encyclopedia's error:* It claims she believed *all* foreseen consequences are intended. If she believed that, the Doctrine of Double Effect would be impossible, yet she defended a rigorous version of DDE in other contexts (e.g., medical ethics). She argued that in *this specific case*, the planners could not honestly claim the deaths were merely foreseen.

  **Claim 8:** *"So the bombings were murder even if the crews were aiming at military objectives and merely foreseeing civilian deaths."*
  *   **Verdict: Misleading.*
  *   **Comment:** Again, this relies on the error in Claim 7. Anscombe's argument was that in area bombing, you *cannot* truthfully say you are merely aiming at military objectives. If your plan requires the city to be destroyed to work, you intend the destruction.

  ### Part 2: The Nuclear Deterrence Question

  You asked specifically about the closing claim: *"it implies that any use of a nuclear weapon, any policy of nuclear deterrence, and any willingness to keep a nuclear arsenal as a threat is murder in exactly the same sense."*

  This is where the encyclopedia entry becomes philosophically sloppy. A careful defender of Anscombe would correct this in two ways.

  **1. Is maintaining an arsenal "murder"?**
  Strictly speaking, no. Murder is an act of killing. Maintaining an arsenal is a policy or a state of affairs. Anscombe would classify this as **formal cooperation with evil** or holding a **corrupt will**, but calling it "murder in exactly the same sense" is category confusion. It is a *preparation* for murder, or a *commitment* to murder, but it is not the act itself.

  **2. Is a threat to use nuclear weapons morally equivalent to the use?**
  Here, Anscombe's resources are subtle. She argues that **intention** is the primary locus of moral evaluation.
  *   **The Logic:** To have a credible nuclear deterrent, a nation must form a **conditional intention**: "If attacked, we will kill their civilians."
  *   **Anscombe's View:** It is morally forbidden to intend to kill the innocent. Therefore, it is forbidden to form a conditional intention to kill the innocent.
  *   **The Conclusion:** The policy of deterrence is morally illicit because it requires the leadership to hold an intention to do something murderously wrong.

  However, there is a distinction between the *threat* and the *act*.
  *   **The Act:** Dropping the bomb = Murder.
  *   **The Threat:** Declaring you will drop the bomb = A sinful commitment to murder (a "conditional intention to murder").

  The encyclopedia entry collapses these into "murder in exactly the same sense." A more precise Anscombean formulation is that the policy is **intrinsically unjust** because it relies on a will disposed toward murder.

  ### Part 3: Correcting the Record for Your Piece

  If you wish to correct the narrative in your article, here is how you might characterize the divergence between the encyclopedia summary and Anscombe's actual philosophy.

  **The "Foresight" Correction:**
  The encyclopedia claims Anscombe erased the line between foresight and intention. In reality, she sharpened it. She argued that the Truman administration *claimed* the civilian deaths were foreseen side effects of hitting military targets. Anscombe retorted that the nature of the weapon and the targeting strategy made the civilian death the *means* of victory, and therefore *intended*. She did not say "foresight equals intention"; she said "in this specific strategy, your foresight reveals your true intention."

  **The "Deterrence" Correction:**
  The encyclopedia claims maintaining a nuclear arsenal is "murder." Anscombe's view is more precise: maintaining a nuclear deterrent requires a **conditional intention to commit murder**. Since one cannot morally intend to do evil (even conditionally), the policy is morally corrupt. The wrong lies in the *will* of the policymakers who must be prepared to kill innocents to make the threat credible.

  **Suggested Rewrite of the Closing Claim:**
  *Instead of:* "It implies that any use of a nuclear weapon, any policy of nuclear deterrence, and any willingness to keep a nuclear arsenal as a threat is murder in exactly the same sense..."
  *Try:* "For Anscombe, this logic extended beyond the act of bombing to the policy of deterrence itself. She argued that a credible nuclear deterrent requires a conditional intention to kill the innocent. Since one cannot morally intend to do what is forbidden—even conditionally—the very stance of nuclear deterrence involves a corruption of the will equivalent to the act it threatens."

  ### Summary for the Writer

  1.  **Trust your instinct on the first half:** The account of combatant status and Truman's responsibility is faithful to Anscombe.
  2.  **Reject the "Foresight = Intention" claim:** This is the encyclopedia's biggest philosophical error. Anscombe is famous for distinguishing these. She argued the bombings were intended killings, not merely foreseen ones.
  3.  **Refine the Deterrence conclusion:** It is not "murder" to hold the arsenal; it is to hold a "conditional intention to murder." This distinction matters for a piece about ideas, as it highlights Anscombe's focus on the morality of the *will*, not just the physical act.

  Anscombe's intervention was not just that Truman killed people, but that he (and the moralists defending him) had lost the ability to describe human action truthfully. They called an intended killing a "foreseen side effect." Your piece can highlight that her protest was as much about **language and truth** as it was about peace.
