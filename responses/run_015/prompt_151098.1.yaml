      *   *Foresight vs. Intention:* In *Intention*, she argues that if you blow up a building to kill someone inside, you intend their death even if you say you only intended to blow up the building. But if you bomb a factory and workers die unexpectedly, that's foreseen. The encyclopedia claims she said "If deaths are foreseen, they are intended." That is the opposite of her famous distinction. I need to be very clear on this.
      *   *Deterrence:* Anscombe's 1961 essay "War and Murder" and her later involvement in CND (Campaign for Nuclear Disarmament) are relevant. She signed the CND manifesto. Her argument was that you cannot intend to do what is forbidden. If killing innocents is forbidden, intending to kill them (if deterrence fails) is forbidden. Therefore, the policy is forbidden.

