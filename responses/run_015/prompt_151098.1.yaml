      *   *Section 3: The DDE/Error on Intention.* This is the critical correction. The encyclopedia says she collapsed foresight into intention. She actually argued that the *specific plan* of area bombing made the deaths intended, not that *all* foreseen deaths are intended. This is a massive philosophical error in the summary.
