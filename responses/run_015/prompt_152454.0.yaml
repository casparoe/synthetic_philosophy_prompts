      *   Niche framing (API/Embedding)? Yes.

  5.  **Drafting the Content:** (Mental simulation of the text)
      *   *Header:* JOINT STATEMENT OF ADVERSARIAL COLLABORATION.
      *   *Intro:* Contextualize the year-long debate.
      *   *Section 1:* 5-6 points. Focus on measurement validity vs. ontological reality.
      *   *Section 2:* Table format. Columns: Feature, Realist View, Skeptic View.
      *   *Section 3:* Cruxes. Need to be sharp.
          *   Crux 1: The "Global PCA" test.
          *   Crux 2: The "Refactoring" test (realignment).
          *   Crux 3: The "Compression Loss" test (predictive power).
      *   *Sign-off:* Dates and Camp representatives.

      *Wait, one detail:* "inject some niche framing if it helps — the api/legacy-bundle metaphor is intentional, and feel free to treat political orientation like an embedding space if that sharpens the disagreement."
