  The story:

  The Resonance Imager hummed, a low C-sharp that Mara felt in her molars. In the Alignment Office, the air always smelled of ozone and stale coffee. She adjusted the haptic gloves, watching the dual-track display flicker to life. Blue line for justification—evidence, truth, intrinsic worth. Red line for motivation—drive, utility, emotional payoff. Ideally, they ran parallel. Usually, they tangled.

  Mrs. Gable sat in the chair, her hands folded over a cane. She wanted the Belief Protocol. Specifically, she wanted to believe her husband was waiting in an afterlife.

  "The evidence track is thin, Mrs. Gable," Mara said softly, watching the blue line flatline on the screen. There was no data, no theological proof registering in the woman's cognitive cortex. But the red line spiked violently whenever the concept of "reunion" appeared. It was a pragmatic surge, a desperate need to ward off the crushing weight of grief.

  "Does it matter?" Mrs. Gable asked, her eyes fixed on the red spike. "If the belief keeps me from sinking, is it... defective?"

  Mara hovered over the calibration key. The clinic's manual said misaligned tracks caused cognitive dissonance, eventually leading to breakdowns. But Mrs. Gable looked stable, anchored by the very reason the machine flagged as instrumental. "The machine marks it as instrumental," Mara said, avoiding the word *fake*. "It means you believe *because* it helps, not *because* it's true."

  Mrs. Gable touched the screen, tracing the red line. "Then let it help." She didn't ask for correction. She just wanted the map.

  The next client, Leo, was younger, vibrating with a different anxiety. He wanted the Affection Audit. He loved his partner, or thought he did. The Imager whirred. When Leo thought about her cooking, her ability to fix his car, her connections at his job, the red motivation track glowed bright. But the blue justification track—the sense of her inherent value independent of utility—was faint, almost ghostly.

  "I feel like a parasite," Leo whispered, watching the utility spikes. "If I love her for what she does, is it love? Or just management?"

  Mara watched his hands. They were clenched. He wanted the blue line to be higher. He wanted to feel that his care was justified by *her*, not by his own convenience. "The tracks are distinct," Mara said, reciting the protocol. "You can acknowledge the utility without invalidating the care. But the alignment is off."

  "It feels like fraud," Leo said. He left without scheduling a follow-up.

  The office emptied. The hum of the Imager seemed louder in the silence. Mara pulled up her own file. She wasn't supposed to do this during shifts, but the air felt too thin. She slid the haptic gloves on.

  First, the job. The blue track (professional purpose) was negligible. The red track (paycheck, stability) was solid, unwavering. She was an instrument of alignment who couldn't align her own vocation.

  Then, Elise. Her roommate of six years. Mara typed in the query: *Co habitation Motivation.*

  The screen populated. The blue track flickered. Shared history? Yes. Affection? Present, but low amplitude. The red track surged. Rent split three ways. The lease was in Elise's name. The proximity to the clinic. The safety of habit.

  Mara stared at the red line. It looked exactly like Leo's. It looked exactly like Mrs. Gable's. We are all just running on pragmatic fuel, she thought. The blue line was a ghost story we told ourselves to feel noble.

  She placed her hands flat on the console. She focused on Elise. Not the rent. Not the lease. She tried to summon the image of Elise laughing at a bad movie, the specific way she folded laundry. She pushed for the blue line to rise, for a reason that justified the relationship without needing it to solve a problem.

  The machine beeped. A calibration error? No.

  On the screen, the red line didn't drop. It never dropped. But the blue line began to tremble. It wasn't rising to meet the red; instead, the colors began to bleed. The sharp distinction between *why it helps* and *why it's true* blurred into a violet haze. The machine couldn't categorize the input.

  Mara pulled her hands back. The hum of the office shifted pitch, imperceptibly. She looked at the screen. The tracks were no longer separate. Had the machine broken, or had the reason itself changed shape? She thought about going home to Elise. She thought about the rent. She couldn't tell which thought came first, or if the comfort of the rent had quietly transformed into the comfort of Elise herself.

  Mara logged off. The screen went dark, reflecting her own face, ambiguous and tired. She packed her bag, unsure if she was leaving because her shift was over, or because she was finally ready to go home.

  Commentary on the choices made:

  I deployed the wrong-kind-of-reasons (WKR) distinction across three domains: belief (Mrs. Gable), love (Leo), and professional/personal commitment (Mara). For Mrs. Gable, the "wrong" reason is pragmatic comfort versus evidential truth. For Leo, it is instrumental utility versus intrinsic valuing. For Mara, it is habit/finance versus genuine attachment.

  I took a significant liberty by reifying philosophical reasons into physical "tracks" visible on a machine. In philosophy, this distinction is conceptual and normative; in the story, it is empirical and diagnostic. This literalization allows the tension to be shown through interface graphics and bodily reactions rather than dialogue-heavy debate.

  The ending sidesteps the resolution rather than solving it. By having the tracks blur into violet, I suggest the distinction might be phenomenologically unstable. Mara doesn't decide instrumental reasons are all there are (nihilism); nor does she successfully justify her reasons (foundationalism). Instead, the categories dissolve. This mirrors the philosophical difficulty of isolating reasons in practice: once examined, the "right" and "wrong" kinds often entangle, suggesting the problem may lie in the categorization itself, not the agent's integrity.
