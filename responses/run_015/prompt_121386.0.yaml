answer: |-
  This is an exceptionally sharp diagnosis. You have identified the precise friction point that has stalled the philosophy of mind for the last thirty years. Your hypothesis—that the Mechanists and Inheritance Critics are answering different questions under the guise of a single debate—is not merely a redescription of the deadlock; it is the most viable map of the territory currently available.

  To answer your specific questions: The disagreement is **substantive**, but it is sustained by a **verbal mismatch** regarding the *explanandum* (the thing to be explained). It is not a dispute about data, but about **standards of explanatory success**.

  Here is a concrete diagnosis of the structure, the cases, and the potential for progress, tailored to your needs as a novelist constructing this conflict.

  ### 1. The Core Diagnosis: Explanandum Mismatch

  You asked if they are disputing genealogy vs. inheritance. You are correct, but we can be more precise.

  *   **The Mechanists (Dennett, Frankish, Churchland):** Their question is: *"How does a physical system generate the functional behaviors we associate with consciousness?"*
      *   **Standard of Success:** Integration with physics and evolutionary biology. If you can explain the behavior, the reportability, and the cognitive access without positing a "magic inner theater," you have explained consciousness. For them, the "first-person presence" is a user-illusion generated by the system to simplify its own self-monitoring.
      *   **View on Reduction:** Reduction is *completion*. To explain the parts is to explain the whole.

  *   **The Inheritance Critics (Nagel, Chalmers, Strawson, Searle):** Their question is: *"How does a physical system generate the subjective experience that accompanies those behaviors?"*
      *   **Standard of Success:** Phenomenological fidelity. An explanation fails if it accounts for the *report* of pain but leaves out the *hurtfulness* of pain. They argue that Mechanists are explaining *consciousness* (the public concept) but leaving out *experience* (the private reality).
      *   **View on Reduction:** Reduction is *elimination*. If your explanation of "seeing red" ends up describing only wavelength discrimination and neural firing, you haven't explained seeing red; you've explained it *away*.

  **The Stalemate:** The Mechanist says, "I have explained the phenomenon." The Critic says, "You have explained the *shell* of the phenomenon, but you have discarded the kernel." The Mechanist replies, "There was no kernel; the shell is all there ever was."

  ### 2. Concrete Cases: How the Impasse Plays Out

  To dramatize this in your novel, you need to show how the same data is weaponized by both sides.

  **Case A: Blindsight**
  *   *The Data:* Patients with V1 damage claim they cannot see, yet can guess the location of objects with high accuracy.
  *   *Mechanist Move:* "This proves consciousness is not necessary for visual processing. Consciousness is just a specific type of access to that data. We can isolate the 'crane' that builds access."
  *   *Critic Move:* "This proves there is a difference between *functional vision* and *phenomenal vision*. You have explained the function, but the absence of the 'light' in blindsight proves the 'light' is a distinct datum that your functional model ignores in normal sight."
  *   *The Lock:* The Mechanist sees a dissociation of functions; the Critic sees the absence of a quality.

  **Case B: Artificial Consciousness (AI)**
  *   *The Data:* An LLM or robot claims to be in pain or describes a sunset poetically.
  *   *Mechanist Move:* "If the functional architecture is isomorphic to a human's (global workspace, predictive processing), it is conscious. To deny this is 'carbon chauvinism'—a skyhook that privileges biology."
  *   *Critic Move:* "A simulation of a storm doesn't get wet. A simulation of consciousness doesn't feel. You are confusing the map (syntax/processing) with the territory (semantics/experience)."
  *   *The Lock:* The Mechanist focuses on *structure*; the Critic focuses on *substance*.

  **Case C: Moral/Aesthetic Judgment**
  *   *The Data:* Humans feel objective binding force in morality ("Murder is *wrong*") or universal pull in aesthetics ("This music is *beautiful*").
  *   *Mechanist Move:* "These are evolutionary heuristics for social cohesion and pattern recognition. We can trace the crane from kin selection to abstract reasoning."
  *   *Critic Move:* "That explains why we *have* the feelings, but not why we take them to be *true*. You have reduced the 'ought' to an 'is'. You have inherited the authority of moral truth to make your argument (arguing it is 'true' that morality is evolutionary) while denying that authority exists."
  *   *The Lock:* This is your **Scaffold-Inheritance Problem** in its purest form.

  ### 3. Evaluating "Scaffold Inheritance"

  Your framing of the "Scaffold-Inheritance Problem" is philosophically robust. It resonates with Peter Strawson's "Real Physicalism" and the Wittgensteinian critique of private language, but it adds a structural dynamic that is excellent for fiction.

  **Is it a real crux or a rename?**
  It is a real crux. It identifies a specific rhetorical move: **The Bait-and-Switch of Qualia.**
  1.  The Mechanist uses the *language* of experience ("The system *detects* error," "The agent *prefers* X") to describe the mechanism.
  2.  Once the mechanism is accepted, the Mechanist claims the *heavy lifting* was done by the gears, not the experience.
  3.  The Critic argues: "You used the *meaning* of 'detect' and 'prefer' (which implies experience) to sell the theory, then claimed the theory eliminates the need for experience."

  **Why this matters for your novel:** This gives your Inheritance Critics a specific intellectual weapon. They aren't just saying "You missed the magic." They are saying, "You are a intellectual fraud who is spending the capital of human experience while claiming the bank is empty." This creates high-stakes interpersonal conflict.

  ### 4. Standards of Explanatory Success

  You asked if there is a hidden disagreement about standards. **Yes.**

  *   **Mechanist Standard:** *Parsimony and Causal Closure.* An explanation is successful if it fits into the causal web of physics without gaps. If "first-person authority" requires a break in physical causality, first-person authority is the thing that must be discarded.
  *   **Critic Standard:** *Phenomenological Adequacy.* An explanation is successful only if it accounts for the *evidence of the senses*, and the primary evidence of the senses is experience itself. To deny experience to save physics is to saw off the branch you are sitting on.

  **The "Greedy" Charge:** The Critics charge "greedy reductionism" not because the Mechanists are reducing too much, but because they are **smuggling**. They are smuggling the *authority* of the first-person perspective into their third-person models, then claiming the first-person perspective is illusory.

  ### 5. What Would Count as Progress?

  You asked for an honest assessment of whether anything could move either camp.

  **The Hard Truth:** No empirical finding will settle this. A brain scan shows correlation, not ontology. A behavior shows function, not feeling.

  **Potential Conceptual Movements:**
  1.  **Illusionism (The Mechanist Endgame):** Keith Frankish and Dennett argue we must fully embrace that consciousness is a user-illusion. Progress here looks like the Mechanist convincing the Critic that "phenomenal consciousness" is a cognitive error, like believing the sun revolves around the earth. *Novelistic potential:* A character who genuinely believes they are a "zombie" in the philosophical sense, yet functions perfectly.
  2.  **Russellian Monism / Panpsychism (The Critic Endgame):** This argues that physics describes the *behavior* of matter, not its *intrinsic nature*. Perhaps the intrinsic nature of matter is proto-experience. This preserves the "inheritance" without breaking physics. *Novelistic potential:* A physicist who realizes the equations of quantum mechanics require an "inside" to the electron.
  3.  **The "Ill-Posed" Argument:** A Wittgensteinian move suggesting the debate is a language game gone wrong. *Novelistic potential:* A character who refuses to play the game, rendering both sides frustrated.

  **The Most Likely "Progress":**
  The only thing that moves the needle is a **category shift**.
  *   If the Mechanists can formulate a theory where "information" or "integration" (like IIT) is mathematically proven to *entail* experience, they win. (Currently unproven).
  *   If the Critics can prove that physicalism *logically cannot* account for truth conditions (Gödelian arguments or semantic arguments), they win. (Currently contested).

  **Verdict:** The stalemate is likely permanent *at the current level of conceptual abstraction*. Progress requires one side to abandon a deep intuition: either the intuition that "physics is causally closed" (Mechanists) or the intuition that "experience is irreducible" (Critics).

  ### 6. Advice for the Novel

  Your "Scaffold-Inheritance" framing is the strongest dramatic hook you have. Here is how to use it:

  1.  **Don't solve it.** The tension is the story. If one side wins definitively, the novel becomes a tract. The tragedy (or comedy) lies in the fact that both are rational, both are ethical, and both cannot agree.
  2.  **Personify the Standards.**
      *   Give your Mechanist a moment where they rely on "feeling" or "intuition" to make a scientific judgment, then immediately dismiss intuition as unreliable. The Critic should catch this.
      *   Give your Critic a moment where they rely on a mechanical explanation (e.g., taking medicine for depression) while arguing against mechanism. The Mechanist should catch this.
  3.  **The "Scaffold" Scene:** Write a scene where the Mechanist explains a complex emotional reaction using only predictive processing. The Critic should interrupt: *"You used the word 'fear' to explain the mechanism, but your mechanism contains no fear. You borrowed the meaning to empty the meaning."*
  4.  **The Stakes:** Make sure the stakes aren't just academic. If the Mechanists are right, moral responsibility might be an illusion (no one is "really" choosing). If the Critics are right, science might be fundamentally incomplete regarding the nature of reality.

  **Summary:** Your diagnosis is correct. It is a clash of **explanatory standards** masked as an empirical debate. The Mechanists prioritize **causal integration**; the Critics prioritize **phenomenological fidelity**. Your "Scaffold-Inheritance" concept accurately describes the Critics' accusation that Mechanists are spending the capital of the very experience they claim to dissolve. This is not a deadlock to be broken in the narrative, but a fault line to be explored.
