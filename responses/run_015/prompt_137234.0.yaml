  Here is the diagnosis, followed by the best possible approximation given the constraints.

  ### Diagnosis: The Specs Are Not Jointly Satisfiable

  You cannot build the **Paradox of Deontology** without **comparing counts of violations**.

  The paradox (as defined in your intro) is that deontology forbids minimizing violations of the constraint ("stand by while *more* of exactly what the constraint forbids happens"). This structure *requires* a tension between *committing one violation* and *allowing multiple violations*. If you remove the comparison of counts ("No comparing counts of violations"), you remove the minimization pressure. Without minimization pressure, there is no paradox; there is only a conflict between a constraint and a good outcome (Paternalism).

  To make this work, you must drop **Spec: "No comparing counts of violations."** You do not need to make it a math problem for the students (1 vs. 5), but the case must structurally involve the possibility of *more* violations occurring if the agent adheres to the constraint. If you keep the "no counts" spec, you are no longer teaching the Paradox of Deontology; you are teaching the Limits of Paternalism.

  Below is a case that satisfies every other spec, but necessarily reintroduces the *structure* of multiple violations (though not explicit arithmetic) to preserve the paradox. I have flagged where the adjustment occurs.

  ***

  ### The Case: The Ward Lockdown

  You are the night charge nurse in a secure dementia ward. One patient, Mr. Hale, is lucid tonight and explicitly refuses his evening antipsychotic medication, invoking his right to refuse treatment (a constraint based on consent/autonomy). You know with certainty that if you respect his refusal, his condition will deteriorate rapidly within the hour, leading to a violent episode where *he* will be physically restrained by staff multiple times to prevent him from harming himself—each restraint counting as a formal violation of his bodily autonomy under hospital policy and law. If you violate his current refusal and administer the medication covertly, you commit exactly one violation of consent, but he remains calm, and no restraints occur. Mr. Hale is currently competent to refuse, so you cannot appeal to incapacity; he cannot release you from the constraint because his refusal *is* the assertion of the constraint, and waiving it would negate the very autonomy the constraint protects; there is no uncertainty about the outcome; no other patients are involved; the constraint is valid and not voided by duress; and this is not an advance directive issue but a present-moment choice. You must choose between violating his consent once now or standing by while his consent is violated repeatedly by necessity later.

  ***

  ### 1. The Verdicts

  *   **The Absolute Constraint-Theorist:** They forbid administering the medication. The constraint ("Do not violate consent") is agent-centered; it forbids *your* violation, not the world's violations. Your duty is to keep your own hands clean, even if the cost is that the person you are duty-bound to protect suffers more violations of that same right by others (the restraint team). The integrity of the agent's action matters more than the total count of rights-violations in the outcome.
  *   **The Threshold Deontologist:** They permit administering the medication. Constraints are stringent but not absolute; they give out when the cost to the protected value becomes too high. Here, respecting the constraint leads to *more* violations of the very same constraint (multiple restraints vs. one covert dose). Once the harm to the protected interest (autonomy) outweighs the stringency of the rule, the constraint is overridden by the goal of minimizing violations of that same right.
  *   **The Contractualist:** They look to justification. Could a rule permitting covert medication be justified to Mr. Hale? Since the rule exists to protect his autonomy, and adhering to it strictly results in a greater loss of his autonomy (multiple restraints), a rule allowing the single violation to prevent the greater loss could be justified to him as a rational agent seeking to protect his own standing. However, if the principle undermines the general practice of consent, it might be rejected.

  ### 2. The Feature Doing the Work

  **The Reflexivity of the Harm.**
  The case generates these verdicts because the harm that results from respecting the constraint is *the same type* as the harm the constraint forbids (violations of autonomy/consent). If the outcome of respecting the constraint were merely "physical pain" or "death," the Absolute Theorist could easily say, "The constraint protects autonomy, not welfare; death is sad but not a violation of the constraint." By making the outcome *more violations of the constraint*, the case forces the theorist to admit that adhering to the rule increases the total incidence of the very wrong the rule is designed to prevent. This creates the paradox: the rule protects the person by forbidding violations, yet following the rule invites more violations.

  ### 3. The Collapse Point

  **Remove the "Multiple Violations Later" element.**
  If you change the case so that respecting his refusal leads to *death* or *pain* (but no further autonomy violations), the case collapses into standard Paternalism vs. Autonomy. The Paradox of Deontology disappears because there is no longer a tension between "minimizing violations of the constraint" and "adhering to the constraint." There is only "adhere to constraint" vs. "promote welfare." The specific paradox you want to teach—where deontology seems to demand *more* of the forbidden thing happen—vanishes.

  ### 4. The Best Wriggle Room

  **The Distinction Between Doing and Allowing (Agency).**
  The deontologist will argue: "I did not violate his autonomy in the restraint scenario; the *situation* did, or the restraint team did. My duty is only to my own actions. By medicating, *I* become a violator. By standing by, I remain clean, even if he suffers violations."
  **Assessment:** This is a **place to stand, not a solution.** It correctly identifies the agent-centered nature of the constraint, but it feels like a evasion in this specific reflexive case. It relies on a moral luck distinction: whether a violation counts against *you* depends on whether it flows from your omission or another's commission, even if you could have prevented it and the victim is the same. It solves the logical consistency of the theory but fails to resolve the intuitive moral discomfort that the constraint is failing the person it is for.
