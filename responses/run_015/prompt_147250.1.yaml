answer: |-
  The blurb is a largely unfair caricature that conflates Rorty's rejection of representation with a denial of causal reality, mistakenly attributing to him a consensus theory of truth and a relativism he explicitly disavowed.

  Rorty accepts that language does not represent reality but denies this isolates us from causal interaction, distinguishing causation from justification to hold that the world causes beliefs (your model fails because reality resists it) but only language justifies them, so he denies the world justifies beliefs but accepts it causes them. He flatly denies the claim that truth is current consensus, holding instead a deflationary view where "true" is a compliment paid to beliefs that survive inquiry, and he is not committed to there being no fact of the matter in the sense of a resistant world, only denying the phrase's utility as it implies access to a description-independent reality. The blurb's claim that no culture can fault another collapses because the ethnocentrism Rorty endorses is not relativism renamed; relativism treats all standards as equal while Rorty insists we judge others by our own standards, allowing cross-cultural criticism without a neutral standpoint. Similarly, the claim that science is merely writing with no authority fails, as Rorty grants science practical authority for prediction and control even if it lacks metaphysical privilege, and he denies inquiry converges on nothing, arguing it converges on solidarity and utility rather than Truth. Finally, he denies the self-refutation charge applies because his claims are therapeutic recommendations rather than metaphysical truth-claims.

  A Rortyan can still criticize another culture by appealing to their own community's standards rather than neutral reason, and can say one inquiry went better than another based on whether it achieved its intended goals, such as predictive accuracy, rather than whether it matched reality.

  While critics have repeatedly asserted the self-refutation charge, they have not established it against Rorty's pragmatic defense, whereas the attribution of a consensus theory of truth is a documented misrepresentation he explicitly corrected in print.
