prompt: |-
  I'm a novelist, four books in, and the one I'm plotting now follows a single family across three generations, 1930s to the present — and I keep catching myself smuggling in a claim about history going somewhere that I haven't earned. So before I outline any further I want the spec: write me the desiderata for a theory of history's directionality, the kind a novelist could honestly steer a plot by. Which cases does it have to get right — improvement in which nobody gets justice, justice that costs everyone everything, an arc that bends for sixty years and then snaps — which distinctions can it not collapse (moral progress vs. material improvement vs. mere narrative shape vs. actual providence), and what does it owe to the selection problem, given that I only get to write the chapters whose records survived? Mark which requirements are non-negotiable and which are just the prejudices of one camp or another, and flag any pair that can't be satisfied together, since that's the bit I'd definately build the book around. Skip scoring the existing views, I'll read those myself. British English please — my publisher's in London.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **User:** Novelist (4 books in), currently plotting a multi-generational family saga (1930s–present).
      *   **Problem:** Catching themselves smuggling in an unearned claim about history's directionality (teleology/progress/decline).
      *   **Task:** Write the *desiderata* for a theory of history's directionality suitable for a novelist to steer a plot by.
      *   **Specific Requirements:**
          *   Address specific cases (improvement without justice, costly justice, snapping arcs).
          *   Address specific distinctions (moral progress vs. material improvement vs. narrative shape vs. providence).
          *   Address the selection problem (survivorship bias in records/chapters).
          *   Mark requirements as Non-Negotiable vs. Contingent/Prejudicial.
          *   Flag incompatible pairs (tensions to build the book around).
          *   *Do not* score existing views (e.g., Hegel, Marx, Spengler, Fukuyama).
          *   **Tone/Style:** British English (publisher in London).
          *   **Goal:** Intellectual rigour suitable for a serious literary novelist.

  2.  **Deconstruct "Directionality" for Fiction:**
      *   History doesn't *have* to have a direction, but a novel *needs* shape. The tension between historical chaos and narrative order is the core conflict.
      *   The novelist isn't a philosopher of history; they are a maker of meaning. The theory must serve the *truth of the characters*, not an abstract system.
      *   Key tension: The "View from Nowhere" (omniscient historical judgment) vs. the "View from Somewhere" (limited character perspective).

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: The Nature of Change (The "Cases").*
          *   Need to handle material gain without moral gain (e.g., tech improves, racism persists).
          *   Need to handle pyrrhic victories (justice won, but at terrible cost).
          *   Need to handle regression (the arc snaps back).
          *   *Constraint:* Must avoid simple linear progress.

      *   *Category 2: The Categories of Meaning (The "Distinctions").*
          *   Moral vs. Material.
          *   Narrative (plot convenience) vs. Historical (causal reality).
          *   Immanent (human-driven) vs. Transcendent (providence/luck).
          *   *Constraint:* Don't conflate "things got easier" with "people got better."

      *   *Category 3: The Epistemology (The "Selection Problem").*
          *   We only know what survived. The novel must acknowledge its own constructedness.
          *   Silence is part of the history.
          *   *Constraint:* Acknowledge the archive's bias.

      *   *Category 4: Compatibility/Incompatibility.*
          *   Where do these clash? That's where the drama lies.
          *   Example: Moral Progress vs. Survivorship Bias. (Did we get better, or did the losers just die?)
          *   Example: Narrative Shape vs. Historical Chaos. (Does the plot lie to make sense?)

  4.  **Refining the Tone (British English):**
      *   Spelling: *honour, centre, programme, manoeuvre, labelled*.
      *   Vocabulary: *whilst, amongst, ought, shall, reckon* (maybe too colloquial? keep it formal but distinct), *post-war*, *fortnight* (no, irrelevant).
      *   Syntax: Slightly more formal, periodic sentences, understated precision.
      *   Avoid Americanisms: *gotten, favor, check* (use *cheque* if money, *check* if verify - actually *check* is fine in UK now, but *analyse* not *analyze*).

  5.  **Structuring the Output:**
      *   Introduction: Acknowledge the novelist's dilemma (the "teleological trap").
      *   Section I: Non-Negotiables (The hard constraints of reality and craft).
      *   Section II: Contingencies (Where schools of thought diverge).
      *   Section III: The Incompatible Pairs (The generative tensions).
      *   Conclusion: A brief encouragement.

  6.  **Developing the Content (Specific Points):**

      *   *Non-Negotiable:* Material/Moral distinction. (Crucial. Antibiotics exist, but cruelty remains).
      *   *Non-Negotiable:* The Selection Problem. (The archive is a graveyard).
      *   *Non-Negotiable:* Agency vs. Structure. (Characters must act, but be constrained).
      *   *Contingent:* Cyclical vs. Linear. (Let the plot decide).
      *   *Contingent:* Providence vs. Chance. (Is it God or luck?).
      *   *Incompatible Pair 1:* Retrospective Coherence vs. Lived Uncertainty. (The reader sees the pattern; the character feels the fog).
      *   *Incompatible Pair 2:* Collective Progress vs. Individual Sacrifice. (History moves forward on broken backs).

  7.  **Review against Constraints:**
      *   *British English?* Check spelling and idiom.
      *   *No scoring existing views?* Ensure I don't say "Marx was wrong." Just say "The theory must account for X."
      *   *Specific cases mentioned?* Ensure "improvement without justice," "costly justice," "snapping arc" are integrated.
      *   *Selection problem?* Included.
      *   *Non-negotiable vs. Prejudice?* Clearly labelled.

  8.  **Final Polish (Self-Correction during drafting):**
      *   *Correction:* Make sure I don't sound like a textbook. This is for a *novelist*. The language should be evocative.
      *   *Correction:* Ensure the "Selection Problem" isn't just about archives, but about *who gets to tell the story* in the book.
      *   *Correction:* The "Incompatible Pairs" need to be framed as *plot engines*, not just philosophical puzzles.

  9.  **Final Output Generation** (Proceeding to write the response based on these thoughts). *Note: Ensure 's' instead of 'z' in organisation/realise etc., and appropriate vocabulary.*

  *(Self-Correction on British English)*: Be careful not to overdo the stereotype. Standard UK publishing English is the goal. *Programme* (not program), *Centre* (not center), *Analysing* (not analyzing).

  *(Refining the "Incompatible Pairs")*: This is the most important part for the user. They want to build the book around the tension. I need to make sure these are dramatic tensions, not just logical ones.

  *(Refining the "Selection Problem")*: It's not just "records survived." It's "the family myth vs. the archival truth."

  *(Final check on the "Cases")*: Ensure the specific examples requested (improvement w/o justice, etc.) are explicitly referenced in the desiderata.

  Let's assemble.
answer: |-
  **Memorandum: Desiderata for a Theory of Historical Directionality in Fiction**

  **To:** The Author
  **From:** Editorial Consultation
  **Re:** Plotting the Multi-Generational Arc (1930s–Present)

  You are right to pause. The temptation to impose a vector upon time is the novelist's original sin. We crave the comfort of the arrow when history often behaves like smoke. To write a family saga that spans the better part of a century without succumbing to sentimental progressivism or cynical declinism requires a framework that is robust enough to hold the weight of reality but flexible enough to let the characters breathe.

  Below are the desiderata for a working theory of history's directionality. These are not philosophical truths to be proven, but structural load-bearing walls for your narrative. I have distinguished between the non-negotiable constraints of the craft and the contingent prejudices of interpretation. Finally, I have isolated the incompatible pairs—the contradictions you cannot resolve, but must dramatised.

  ***

  ### I. The Non-Negotiables
  *These requirements must be met for the history to feel honest. To violate them is to write propaganda or fantasy.*

  **1. The Decoupling of Material and Moral Vectors**
  The theory must allow for material improvement to occur alongside moral stagnation or regression. A character in 1995 may have antibiotics, central heating, and universal suffrage, yet possess less integrity, kindness, or justice than their grandparent in 1935.
  *   **The Case:** You must be able to depict *improvement in which nobody gets justice*. The family wealth may grow whilst their conscience rots. If your theory suggests that better technology necessitates better people, discard it.

  **2. The Integrity of the Archive (The Selection Problem)**
  The theory must account for the silence of the dead. We only possess the chapters whose records survived. A valid theory of directionality cannot rely on evidence that has been systematically destroyed, lost, or never recorded.
  *   **The Constraint:** The narrative must acknowledge its own partiality. If the family rises, whose labour was erased to allow it? If the theory relies on a 'great man' view of history, it fails the selection problem. You must write the gaps as actively as the text.

  **3. The Cost of Equilibrium**
  The theory must accommodate *justice that costs everyone everything*. History is not a zero-sum game, but it is often a negative-sum one. A resolution that leaves all parties satisfied is historically suspect.
  *   **The Requirement:** Moral reckoning must carry a price tag that threatens the solver. If the third generation achieves justice without sacrificing their comfort or security, the arc is false.

  **4. The Distinction between Providence and Retrospection**
  The theory must distinguish between *actual providence* (divine or karmic intervention) and *narrative shape* (the human tendency to find patterns in chaos).
  *   **The Constraint:** Characters may believe in providence; the narrator must remain agnostic. Coincidence is permitted; destiny is not. The plot may look designed from the end, but it must feel accidental from the middle.

  ***

  ### II. The Contingencies (Prejudices of Camp)
  *These are not truths, but choices of tone. You may adopt one, but you must recognise it as a lens, not a law.*

  **1. Linearity vs. Cyclicality**
  *   **The Prejudice:** The Whig view (history bends toward liberty) vs. the Spenglerian view (civilisations are organisms that birth, age, and die).
  *   **The Choice:** You need not decide for all history, only for this family. Do they rise and fall? Or do they struggle upward? Both are permissible, provided they are not treated as inevitable.

  **2. Structure vs. Agency**
  *   **The Prejudice:** The Marxist view (material conditions dictate action) vs. the Great Man view (individual will dictates conditions).
  *   **The Choice:** A novel requires agency (characters must choose), but history requires structure (choices are limited). The balance is a stylistic choice, not a factual one. However, leaning too far toward structure renders the characters puppets; leaning too far toward agency renders them deluded.

  **3. The Endpoint of Trauma**
  *   **The Prejudice:** The Therapeutic view (trauma can be healed/resolved) vs. The Tragic view (trauma is inherited and unresolvable).
  *   **The Choice:** Does the third generation 'get over' the sins of the first? To claim they do is a prejudice of the self-help age. To claim they cannot is a prejudice of the Gothic. Neither is objectively true. Choose the one that serves the emotional truth of your specific characters.

  ***

  ### III. The Incompatible Pairs
  *Here lies the engine of your book. These are pairs of requirements that cannot be satisfied simultaneously. Do not attempt to solve these contradictions; build the plot around the friction they generate.*

  **1. Retrospective Coherence vs. Lived Uncertainty**
  *   **The Conflict:** A novel demands shape (beginning, middle, end); history offers only fog.
  *   **The Tension:** You cannot give the reader the comfort of knowing *why* things happened while simultaneously giving the characters the honest confusion of *not knowing*.
  *   **The Plot Hook:** If the narrator imposes a pattern (e.g., "The war ruined us"), the characters must resist it ("No, we ruined ourselves before the war began"). The book becomes a battle between the family myth and the archival reality.

  **2. Collective Progress vs. Individual Sacrifice**
  *   **The Conflict:** History may 'move forward' (rights won, poverty reduced), but only on the backs of specific individuals who are crushed by the machinery of that progress.
  *   **The Tension:** You cannot validate the 'arc of history' without invalidating the suffering of those the arc broke.
  *   **The Plot Hook:** The third generation enjoys the freedoms won by the first. To celebrate the freedom is to ignore the cost. To mourn the cost is to question the freedom. The 'snapping arc' you mentioned occurs when the third generation realises their comfort is the direct dividend of an ancestor's crime.

  **3. The Survivability of Truth vs. The Necessity of Myth**
  *   **The Conflict:** The Selection Problem dictates we only know what survived. But families survive by lying to themselves.
  *   **The Tension:** An honest history destroys the family cohesion; a cohesive family requires a dishonest history.
  *   **The Plot Hook:** The protagonist (perhaps a historian or archivist in the present day) finds a document that proves the family legend is a lie. To publish it is to do justice to history but destroy the family. To bury it is to save the family but betray the truth. This is the only place where 'justice' and 'loyalty' are mutually exclusive.

  ***

  ### A Note on the 'Snapping Arc'

  You mentioned an arc that bends for sixty years and then snaps. This is the most historically honest shape available to you.

  Most theories of directionality fail because they assume momentum is permanent. It is not. The non-negotiable requirement here is **fragility**. Whatever progress your family makes—moral, financial, social—it must be shown as contingent, not cemented. The snap should not come from an external shock (a war, a crash) alone, but from the internal tension of maintaining the lie that the progress was earned rather than inherited, or just rather than lucky.

  ### Summary Instruction

  Do not write a book that proves history goes somewhere. Write a book that proves the *characters need* history to go somewhere, and show what happens when it refuses to oblige.

  The theory you steer by is not one of direction, but of **drag**. History is not an engine; it is a resistance. Your characters pull against it. Sometimes they move forward; sometimes the rope breaks; sometimes they find they have been pulling a dead weight.

  Proceed with that. It will hold.
