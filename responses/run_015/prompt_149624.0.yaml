  2.  **Adopt the Persona (Xunzi):**
      *   **Core Doctrine:** *Xing* (Nature) is what is spontaneous, unlearned, unworked. *Wei* (Artifice/Effort) is what is learned, worked, ritualized.
      *   **View on Goodness:** Goodness is order, harmony, adherence to ritual principles (*li*). It is not spontaneous; it requires correction.
      *   **View on Mencius:** Mencius confuses *xing* (nature) with *wei* (artifice). He calls the potential for goodness "goodness," whereas Xunzi calls the actualization of goodness "goodness."
      *   **Response Strategy:**
          *   Address the "directional vs. plastic" dilemma.
          *   Address the "children" thought experiment.
          *   Maintain the distinction between spontaneous impulse (nature) and ordered outcome (artifice).
          *   Use Xunzi's metaphors (wood, clay, etc.).
          *   Keep it tight (1-2 paragraphs).

  3.  **Drafting the Response:**
      *   *Acknowledge the challenge:* Mencius tries to trap me in a dichotomy.
      *   *Address the "directional" claim:* My claim isn't that nature *aims* at evil, but that following nature *results* in strife. Like eyes want beauty, ears want sound. If you follow these desires without limit, you get conflict.
      *   *Address the "plasticity" claim:* It's not just neutral plasticity. It's plasticity that *requires* straightening. Wood is not "crooked" because it hates straightness, but because its natural state is not the straight board.
      *   *Address the Children Experiment:* This is the crux. Both impulses (helping stranger, defending group/lying) are spontaneous. Therefore, both are *xing*.
      *   *The Criterion:* How to distinguish? The criterion isn't "what comes naturally." The criterion is "what produces order." Both impulses are raw. Neither is *good* yet. Goodness is the *regulation* of these impulses. Helping without measure is wasteful; defending without ritual is chaos.
      *   *The Punchline:* You ask which is nature? Both are. Which is good? Neither, until the Sage King imposes ritual to channel them. You call the capacity to be helped "good." I call the helping hand "artifice."

  4.  **Refining for Tone and Constraints:**
      *   *Tone:* Respectful but firm. "Mengzi" (addressing him directly or implicitly).
      *   *Length:* Keep it concise.
      *   *Resources:* Use the straightening board, the potter.
      *   *No Anachronisms:* Don't reference modern psych. Treat the "age three" claim as a report from elsewhere (maybe a traveler?).
      *   *Key Distinction:* *Xing* (Nature) = Spontaneous/Unlearned. *Wei* (Artifice) = Learned/Ordered. Goodness = Order, not impulse.

  5.  **Drafting - Step-by-Step:**
