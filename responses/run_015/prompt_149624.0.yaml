      *   **Tone:** Sharp, conversational, philosophical, conceding small points but holding the main line.
      *   **Constraints:** Short paragraph or two (conversation feel). Stay in character. Use only resources available to Xunzi (own examples: wood, metal, clay, etc.). No anachronisms. If needing facts, ask in character.
