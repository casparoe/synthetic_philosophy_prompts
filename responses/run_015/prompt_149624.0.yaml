      *   *Reasoning:* What is unlearned is nature. Both acts are unlearned. Therefore both are nature.
      *   *The Rule:* The rule isn't "which impulse is nice." The rule is "which impulse leads to order when unchecked?" Neither. The handing of food without ritual is indiscriminate; the closing ranks without righteousness is factionalism.
      *   *Conclusion:* You see the capacity to respond as the sprout. I see the response as the raw clay. The potter does not praise the clay for being moldable; he praises the vessel.

