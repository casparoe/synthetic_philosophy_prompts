  # JOINT STATEMENT ON INDIVIDUAL AGENCY AND COLLECTIVE HARM

  **Preface**
  This document records the output of a structured adversarial collaboration between two theoretical camps: the Probabilistic Contributionists and the Counterfactual-Threshold Structuralists. The objective is not to force consensus where none exists, but to isolate the precise empirical and normative fault lines regarding individual obligations in contexts of collective harm. The cases under review are climate-related consumption, meat-eating, and voting behaviour. The following sections delineate shared premises, structured disagreements, decisive cruxes, and the specific tests required to resolve them.

  ## 1. Agreed Claims

  The collaborators affirm the following propositions as empirically accurate or logically coherent. Neither camp disputes these foundations, though they differ on their moral implications.

  1.  **Supply-Chain Discontinuity:** Markets for consumer goods and electoral systems do not operate on perfectly continuous functions. They rely on discrete thresholds (e.g., reorder points in inventory management, majority thresholds in elections). A single unit of demand or a single vote does not always trigger a visible change in aggregate output or policy.
  2.  **The Structure of Overdetermination:** In many contexts of collective harm, the harmful outcome appears overdetermined. That is, the outcome (e.g., a specific level of carbon emissions, the election of a candidate, the slaughter of a specific animal) would likely occur even if any single individual abstained from their contributory action.
  3.  **Definition of the Inefficacy Objection:** Both camps accept the standard formulation of the inefficacy objection: if an individual action makes no counterfactual difference to the occurrence of a harm—meaning the harm would obtain identically without the action—then it is prima facie unclear why a direct individual moral obligation to refrain exists.
  4.  **Distinction Between Obligations:** There is a coherent conceptual distinction between *individual obligations* (duties binding on an agent regardless of others' actions) and *collective or institutional obligations* (duties binding on a group or structure to restructure the system such that individual actions become efficacious). Both camps agree these categories are distinct, though they disagree on which applies in overdetermined cases.
  5.  **Uncertainty of Impact:** Individual agents generally lack perfect information regarding the precise state of the system they are influencing (e.g., whether a supply chain is currently at a reorder threshold, or whether an election will be decided by one vote). Both camps agree that decision-making must proceed under conditions of empirical uncertainty.
  6.  **The Substitutability Assumption:** Both camps acknowledge that the moral evaluation of individual consumption depends heavily on the **substitutability assumption**. This is the empirical claim regarding whether a unit of demand not exercised by one agent is immediately absorbed by another agent or remains unfulfilled, thereby contracting supply.

  ## 2. Disagreements Table

  The following table isolates the residual disagreements. The characterisations below are formulated to be acceptable to each respective camp while highlighting the neutral gap between them.

  | Domain | Probabilistic Contributionist Position | Counterfactual-Threshold Structuralist Position | Neutral Characterisation of the Gap |
  | :--- | :--- | :--- | :--- |
  | **Moral Mathematics** | Moral obligation is grounded in **probabilistic contribution**. An action is obligatory if it non-zero increases the expected value of harm, even if the probability of triggering a threshold is minute. | Moral obligation is grounded in **counterfactual dependence**. An action is obligatory only if it is necessary for the harm to occur in the actual world, or if it guarantees crossing a known threshold. | The dispute concerns whether *risk imposition* constitutes harm sufficient for duty, or whether *actual causation* is required. |
  | **Market Dynamics** | Individual purchases function as signals that aggregate to shift supply curves. Due to **supply-chain elasticity**, abstention reduces the probability of threshold triggers over time, creating an expected negative utility for participation. | Individual purchases are noise within a structural system. Unless an agent knows they are the marginal unit crossing a threshold, the **substitutability assumption** holds: another consumer will fill the demand, rendering individual abstention causally inert. | The dispute concerns the granularity of causal efficacy required for duty: expected influence over time vs. guaranteed impact in the instance. |
  | **Voting Behaviour** | Voting is obligatory based on expected utility calculation: the tiny probability of being pivotal multiplied by the vast magnitude of the policy difference yields a positive expected value for participation. | Voting is not individually obligatory for outcome determination in non-marginal cases. Duty exists only to support the institutional framework (collective duty), not to produce a specific outcome via individual causation. | The dispute concerns whether voting is an instrumental act of causation or a constitutive act of civic participation. |
  | **Unit of Analysis** | The primary unit of moral analysis is the individual transaction or act, evaluated by its contribution to the probability distribution of outcomes. | The primary unit of moral analysis is the structural pattern or institution, evaluated by its capacity to generate harm regardless of individual inputs. | The dispute concerns whether morality tracks individual agency or systemic roles. |

  ## 3. Cruxes

  The collaborators identify three sub-questions (cruxes) such that resolving them would necessitate a significant revision of at least one camp's position. These are not merely verbal disputes but turn on empirical modelling and normative first principles.

  **(a) The Substitutability Assumption in Demand-Driven Harm**
  Does the causal chain between individual consumption and production rely on the assumption that demand is perfectly substitutable? If individual abstention statistically contracts demand rather than being absorbed by other consumers, the Probabilistic Contributionist case strengthens. If markets buffer individual fluctuations such that supply remains fixed unless a critical mass abstains simultaneously, the Counterfactual-Threshold Structuralist case strengthens. The crux is whether individual actions are statistically independent events that sum to causal power, or dependent events lost in systemic noise.

  **(b) Counterfactual Dependence vs. Probabilistic Contribution**
  Is moral obligation tethered to **counterfactual dependence** (would the harm have occurred *but for* my action?) or can it be sustained by **probabilistic contribution** (did my action raise the likelihood of harm?)? This is a normative crux. If the latter suffices, then participating in a lottery that might kill someone is wrong even if the ticket loses. If the former is required, then the action is permissible provided the harmful outcome does not actualise via that specific causal chain.

  **(c) The Derivation of Voting Obligations**
  Do voting obligations derive from the expected marginal impact of the vote on the election outcome, or from role-based collective duties that do not reduce to individual causation? If the obligation is purely instrumental (based on impact), then voting in a safe seat is arguably supererogatory or irrational. If the obligation is expressive or duty-based (based on participation in a collective procedure), then individual inefficacy is irrelevant. The crux is whether the value of voting is consequentialist (outcome-based) or deontological/procedural (process-based).

  ## 4. Empirical and Conceptual Tests

  For each crux identified above, the collaborators specify a concrete case or consideration. Both camps record in advance what resolution of this case would imply for their position.

  ### Test for Crux (a): The "Reorder Point" Scenario
  *   **Case Description:** Consider a retailer who orders meat in batches of 1,000 units. They currently have 999 units in stock. A customer purchases one unit. The retailer orders another 1,000. If the customer had not purchased that unit, the retailer would have waited until the next scheduled review to order, delaying the production signal.
  *   **Probabilistic Contributionist Prediction:** This scenario demonstrates that individual purchases *can* trigger thresholds. Since agents do not know the current stock level, every purchase carries a non-zero probability of being the trigger. Therefore, the **substitutability assumption** fails at the margin; abstention is morally significant because it hedges against being the trigger.
  *   **Counterfactual-Threshold Structuralist Prediction:** This scenario is an edge case that proves the rule of inefficacy. In the vast majority of transactions (units 1–998), the purchase changes nothing. Moral obligation cannot be based on rare statistical anomalies unknown to the agent. Unless the agent knows they are at the threshold, the **substitutability assumption** holds practically: the order would have occurred eventually regardless of this specific transaction timing.

  ### Test for Crux (b): The "Risk Imposition" Scenario
  *   **Case Description:** An agent plays a game of Russian roulette with a million-chamber revolver pointed at a stranger. They pull the trigger once. The chamber was empty; no harm occurred.
  *   **Probabilistic Contributionist Prediction:** The action was morally impermissible. The **probabilistic contribution** to harm was sufficient to generate obligation, regardless of the lack of **counterfactual dependence** regarding the actual injury. The wrong lies in the risk imposition, not solely in the outcome.
  *   **Counterfactual-Threshold Structuralist Prediction:** The action was reckless, but without actual harm, there is no direct individual duty violated regarding the *harm* itself. The duty is to not structure systems where such games are possible (collective duty). If no harm occurs, the individual bears no blame for the *outcome*, only for violating a rule. This distinction matters for climate/meat: if no specific harm is traceable, the individual duty to abstain is weak compared to the duty to change the rules.

  ### Test for Crux (c): The "Safe Seat" Election
  *   **Case Description:** An election in a constituency where historical data indicates the winning margin will be no less than 10,000 votes. One individual considers abstaining.
  *   **Probabilistic Contributionist Prediction:** The individual should vote. Even with a 10,000-vote margin, there is a non-zero probability of a recount, scandal, or shift that makes the vote pivotal. The expected value (Probability × Impact) remains positive. The obligation derives from expected marginal impact.
  *   **Counterfactual-Threshold Structuralist Prediction:** The individual has no obligation to vote *to influence the outcome*, as **counterfactual dependence** is effectively zero. Any obligation to vote derives from a collective duty to maintain the legitimacy of the democratic institution, not from the causal efficacy of the ballot. If the individual abstains, they fail a civic duty, but not a duty to prevent specific policy harms via causation.

  ***

  **Sign-off**
  *Drafted for the purpose of conceptual clarification and dataset compilation.*
  *Probabilistic Contributionist Representative | Counterfactual-Threshold Structuralist Representative*
