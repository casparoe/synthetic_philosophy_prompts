          *   *Analysis:* The flame analogy (from the *Milinda Panha*) illustrates continuity without identity. It explicitly argues *against* "same" vs. "different." It's not a "thing" jumping; it's a causal process. "Data packet" implies a static entity carrying information. Buddhism views rebirth as a causal continuum, not transmigration of a soul-entity.
