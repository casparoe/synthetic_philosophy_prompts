          *   *Verdict:* Wrong.

      *   *Claim 2: "Basically Hume's bundle theory but with karma tacked on."*
          *   *Analysis:* Hume said the self is a bundle of perceptions. Buddhism says the person is five aggregates (*skandhas*). There's a strong parallel. However, Hume was skeptical/empiricist; Buddhism is soteriological (aimed at liberation). Also, Hume didn't have karma/rebirth. The "tacked on" phrasing minimizes the structural role of dependent origination (*paticca-samuppada*).
