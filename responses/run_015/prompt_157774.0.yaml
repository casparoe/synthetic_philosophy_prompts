      *   *Nuance:* Sen doesn't say all famines are *murder*, but all are *preventable political failures*. The institutional sorting tries to distinguish "tragedy" from "crime." Sen collapses this.
      *   *Key Insight:* The institutional sorting preserves the *Humanitarian Imperative* (neutrality) which requires depoliticizing famine to deliver aid. Sen's view politicizes famine inherently. This is a crucial tension.

  9.  **Final Polish:** Check tone (academic, rigorous), ensure all parts of the prompt are answered, and verify the logical flow. (The resulting output should mirror the structure developed in step 7 & 8).

      *   *Check:* Did I answer the "Democratic Sovereignty" specific question? Yes, need to emphasize that Sen focuses on *information flow* and *incentives* (which democracy provides) but the institutional sorting uses regime type to assign *blame*, not just analyze *cause*.
      *   *Check:* Did I distinguish "requires" vs "accommodates"? Yes, this needs a specific section.
      *   *Check:* Did I specify changes to recording, funding, accountability? Yes, in the final section.

  10. **Final Review against constraints:** No specific constraints other than answering the prompt thoroughly. The tone should be analytical and philosophical.

  *(Self-Correction Note)*: I need to be careful not to attribute views to Sen he doesn't hold. Sen argues famines don't happen in functioning democracies. He doesn't necessarily argue every famine is a "crime" in a legal sense, but a moral failure of entitlement protection. The institutional taxonomy tries to keep "crime" reserved for specific intent (like Holodomor debates) while Sen focuses on the *outcome* of the system. I must highlight this distinction between *intent-based morality* and *consequence-based morality*.

