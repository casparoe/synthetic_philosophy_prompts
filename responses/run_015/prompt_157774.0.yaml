answer: |-
  The institutional tripartite sorting of Sen's canonical famines (Ireland, Bengal, China) reveals a profound tension between the *theoretical unity* of development economics and the *political fragmentation* of humanitarian governance. While Sen's entitlement approach posits a uniform mechanism—starvation resulting from a collapse in the legal and economic means to command food, rather than a decline in food availability—institutional taxonomies resist this homogenization. They preserve distinct moral categories for these events. This resistance is not merely bureaucratic inertia; it presupposes a specific, often unarticulated, philosophical architecture regarding causation, responsibility, and sovereignty.

  ### 1. Philosophical Commitments of the Tripartite Sorting

  The institutional practice of categorizing Ireland as colonial crime, Bengal as wartime governance failure, and China as policy error or natural disaster relies on three core philosophical commitments that diverge from Sen's framework.

  **A. Causation: Proximate Triggers vs. Structural Mechanisms**
  Sen's theory is structural; it identifies the *mechanism* of starvation (entitlement collapse) regardless of the *trigger*. The institutional sorting, however, privileges proximate causation to determine moral categorization.
  *   **Ireland:** The blight is acknowledged, but the *colonial extraction* is elevated to the primary causal status, rendering the famine a political crime.
  *   **Bengal:** The *war* is elevated to the primary causal status, rendering the famine a "complex emergency" or tragic byproduct of geopolitical necessity.
  *   **China:** The *policy* (Great Leap Forward) or *weather* is elevated, rendering the famine a developmental error or misfortune.
  *   **Commitment:** This presupposes that the *context* of the entitlement failure (colonialism, war, authoritarianism) alters the *nature* of the event, not just its etiology. It assumes moral ontology is context-dependent, whereas Sen assumes it is outcome-dependent.

  **B. Collective Moral Responsibility: The Liability Model**
  The sorting relies on a **Liability Model** of responsibility rather than Sen's **Capability Model**.
  *   Under the Liability Model, moral blame requires a identifiable agent with specific duties and capacity to act.
  *   **Ireland:** The British State is a clear external agent with a duty of care to a colony; failure is negligence or malice.
  *   **Bengal:** The British War Cabinet is an agent, but its duties are conflicted by global war; failure is a "tragic choice."
  *   **China:** The CCP is an internal agent; under Westphalian sovereignty norms, external attribution of "crime" is muted, often reframed as internal "policy error."
  *   **Commitment:** Moral responsibility is mediated by the *relationship* between the starving and the state (subject vs. citizen vs. enemy) and the *legibility* of the state to international law.

  **C. The Boundary Between Natural and Political Harm**
  The persistence of the "natural disaster" label for China (in older taxonomies) or the "blight" emphasis for Ireland preserves a category of **Misfortune**.
  *   **Commitment:** This presupposes that there exists a realm of "natural" scarcity that is morally neutral. Sen explicitly rejects this, arguing that even with crop failure, famine is political if entitlements are not protected. The institutional sorting refuses to fully politicize starvation because doing so would eliminate the "neutral" ground required for humanitarian intervention. To classify all three as identical moral failures is to declare all three states (or governing powers) culpable, which complicates diplomatic engagement and aid delivery.

  ### 2. Democratic Sovereignty and Epistemic Grounds

  **Does democratic sovereignty transform the moral status of starvation?**
  The institutional sorting implicitly affirms this, though not in the way Sen intends. Sen argues that democracies prevent famine because of *feedback loops* (elections, free press). The institutional taxonomy, however, uses regime type to assign *blame*.
  *   **The Implication:** Famine under a colonial power (Ireland/Bengal) is an *injustice* (violation of external duty). Famine under an authoritarian regime (China) is often treated as a *tragedy* or *error* (internal dysfunction). Famine under a democracy (which Sen claims shouldn't happen) would theoretically be a *systemic collapse*.
  *   **The Verdict:** The practice requires the view that the *legitimacy* of the sovereign alters the moral quality of the death. A death caused by a colonial master is a murder; a death caused by a policy error in a sovereign state is a misfortune. This contradicts Sen, for whom the death is the same unfreedom regardless of the flag flying over the granary.

  **Can it be reconstructed on purely epistemic grounds?**
  No. An epistemic reconstruction would rely solely on data regarding food availability, distribution networks, and mortality rates. Since Sen's data shows entitlement collapse in all three cases, an epistemic classification would group them together. The fact that they are separated proves the sorting is **normative**, not epistemic. It relies on judgments about *intent*, *sovereignty*, and *geopolitics* that lie outside the economic evidence of starvation. The distinction is maintained not because the *evidence* of entitlement failure differs, but because the *political cost* of assigning equivalent blame differs.

  ### 3. Consistency with Sen's Implicit Theory

  The institutional practice is **inconsistent** with the theory underwriting Sen's argument.

  *   **Sen's Theory:** Famine is a failure of **Public Reason** and **Entitlement Protection**. It is a moral failure of the system to guarantee the capability to survive. The distinction between "crime" and "misfortune" is irrelevant; the relevant distinction is "preventable" vs. "unpreventable."
  *   **Institutional Theory:** Famine is a **Humanitarian Event**. Its moral status depends on the *violability of the sovereign* and the *presence of malice*.
  *   **The Conflict:** The institutional system quietly relies on a conception of moral failure that requires *agency and intent* (or gross negligence by a specific accountable entity). Sen's conception requires only *preventability*. By categorizing China partly as a "natural disaster" or "policy error," the institution preserves the idea that some mass death is not a moral failure but a misfortune. This is the exact intuition Sen's *Poverty and Famines* was written to destroy.

  ### 4. Reconstructing the Implicit Theory: The Sovereignty-Mediated Liability Model

  We can reconstruct the implicit theory driving the current taxonomy as the **Sovereignty-Mediated Liability Model (SMLM)**.

  **What the SMLM Strictly Requires:**
  1.  **Sovereign Immunity:** Internal policy errors (China) cannot be equated with external colonial neglect (Ireland) without violating norms of non-interference.
  2.  **Contextual Mitigation:** War (Bengal) creates a moral exception that reduces liability for administrative failure.
  3.  **Natural/Political Dualism:** There must remain a category of "natural" causation to allow for humanitarian neutrality. If all famine is political, all aid is political intervention.

  **What the SMLM Merely Accommodates:**
  1.  **Entitlement Economics:** It accepts Sen's economic diagnosis (food distribution matters) but refuses its moral conclusion (all entitlement failures are equivalent injustices).
  2.  **Preventability:** It acknowledges these events were preventable but stratifies the *obligation* to prevent them based on the political relationship between the ruler and the ruled.

  ### 5. A Classification System Built on Sen's Unified View

  If humanitarian taxonomy and institutional practice were rebuilt strictly on Sen's unified entitlement-collapse theory, the following structural changes would be necessary:

  **A. Recording and Taxonomy**
  *   **Change:** Abolish the categories of "Natural Disaster," "Complex Emergency," and "Famine" as distinct moral types. Replace them with a single metric: **Entitlement Protection Failure (EPF)**.
  *   **Implementation:** Every mass starvation event would be recorded with an "Entitlement Map" detailing the specific legal and economic rights that collapsed (e.g., labor exchange rate, trade entitlements), regardless of regime type. The "natural disaster" label would be deprecated as scientifically inaccurate in the context of mortality; weather events would be recorded as "hazards," but famine would only be coded if the hazard translated into entitlement collapse.
  *   **Effect:** China 1959, Bengal 1943, and Ireland 1846 would appear in databases as identical types of events: *Preventable Entitlement Collapses*.

  **B. Funding Mechanisms**
  *   **Change:** Shift from **Reactive Humanitarian Aid** to **Proactive Entitlement Insurance**.
  *   **Implementation:** Current funding is triggered by mortality thresholds (IPC Phase 5). A Sen-based system would trigger funding based on *entitlement vulnerability indicators* (e.g., inflation of staple foods relative to wages, loss of grazing rights). Funding would not be "charity" but "obligation fulfillment."
  *   **Effect:** Donors could not claim they are responding to a "natural disaster" in China or a "war crisis" in Bengal. They would be funding the restoration of legal economic rights. This politicizes aid, removing the "neutrality" that currently facilitates access but masks responsibility.

  **C. Accountability and Justice**
  *   **Change:** Shift from **Governance Failure** to **Capability Violation**.
  *   **Implementation:** Under the SMLM, accountability is diplomatic (reports, sanctions). Under a Sen-based system, accountability would be legalistic regarding the *Right to Food*. Since Sen views famine as the ultimate unfreedom, the prevention of famine is a constitutive requirement of legitimate governance.
  *   **Effect:**
      *   **Ireland:** Would be adjudicated not just as colonial neglect, but as a violation of the subjects' capability rights.
      *   **Bengal:** Wartime necessity would not excuse entitlement collapse; the "tragic choice" defense would be invalidated if alternative entitlement protections were possible.
      *   **China:** "Policy error" would be reclassified as a systemic violation of the population's economic entitlements, subject to the same moral scrutiny as colonial extraction.
      *   **Sovereignty:** The shield of sovereignty would be pierced. If a state fails to protect entitlements, it loses the moral immunity against external intervention, not because of "human rights" in the abstract, but because it has failed the basic functional test of protecting the capability to live.

  ### Conclusion

  The institutional tripartite sorting of Sen's canonical famines is not an epistemic necessity but a political compromise. It preserves the **Sovereignty-Mediated Liability Model**, which allows the international community to engage with starving populations without universally indicting the governing structures that starved them. This practice is fundamentally inconsistent with Sen's argument, which posits that the *mechanism* of starvation (entitlement collapse) dictates the *moral* status (preventable failure), irrespective of the regime. A classification system faithful to Sen would collapse the distinction between "misfortune" and "crime," rendering all famine a political failure of entitlement protection. This would demand a shift from humanitarian charity to rights-based enforcement, fundamentally altering the power dynamics of international aid and challenging the Westphalian immunity of states that fail to feed their citizens.
