answer: |-
  At a large state university, the administration wants to prevent undergraduates from dropping difficult core courses early, a choice that data shows hurts their own long-term graduation rates. The hard rule requires a Dean's signature to drop after week three, creating a formal appeal process for emergencies. The nudge allows the drop but automatically emails the student's academic advisor and parents detailing the decision, a policy clearly stated in the handbook. Both methods reduce dropout rates by the same forty percent, and both aim to help students meet their own goal of graduating on time. However, the nudge is worse because when the policy is mistaken—for instance, a student has a valid medical reason that doesn't fit the Dean's strict criteria—the mandate generates a visible record of refusal that the administration can audit and fix, whereas the nudge forces the student to either suffer unappealable social shame or comply silently, hiding the policy's failure from the institution.

  The "your options are still open, so what's the complaint" view argues that the student retained the final veto power; they could choose to endure the email and drop the class, so their autonomy remained intact. The case answers back that autonomy is meaningless if the cost of exercising it is a private penalty that cannot be contested, because this structure privatizes the error: the institution never learns when its pressure was inappropriate because the student bears the cost quietly. The single feature doing the work is **contestability**—the ability to formally challenge the barrier itself rather than just absorbing its price. If you remove this feature from the mandate (making the Dean's decision final and unappealable), the hard rule becomes just as opaque and unaccountable as the nudge. The strongest reply a nudge defender can make is not about freedom, but about **administrative burden**: formal appeal processes are slow, expensive, and create bottlenecks, whereas nudges scale efficiently without requiring a human gatekeeper to judge every exception.
