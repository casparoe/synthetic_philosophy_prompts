prompt: |-
  Odd request, but here goes. I'm a philosophy professor who got into Lean a couple of years ago and now uses it in a seminar to formalize modal arguments, so I'm reasonably fluent in types vs. terms, inhabitants, Prop vs. Type, Sigma-types standing in for existence, definition vs. axiom, and model-existence/relative-consistency talk — though I still think in prose most of the time.

  Take Anselm's Proslogion argument — that than which nothing greater can be conceived, the step from being in the understanding to being in reality, the conclusion — and restate it, as literally as you can, in that vocabulary. Then do the same for Gödel's modal version: the positivity primitive, Godlikeness as instantiating every positive property, essence, necessary existence treated as a property rather than a quantifier, and the S5-strength modal assumptions. For each axiom, say whether it lands as a definition, an uninterpreted constant, an axiom, or a theorem.

  Now the variant I've been fooling with: drop positivity entirely, take as primitive a preorder on individuals (x is greater than, or more real than, y), and define the divine thing as a maximal element. Translate that version to, and say whether it has more or less of what a proof assistant could actually check than Gödel's has — what becomes easier to state, what gets lost.

  Then the residue report, and please be honest here rather than smuggling in type-theoretic assumptions and calling them translation: what maps cleanly, what you had to fudge, and what has no expression at all. I especially want your verdict on two suspects: whether necessary existence as a first-order property of individuals is really just the existential quantifier in modal costume, so that the conclusion can only be stated impredicatively; and whether the choice of modal logic is doing more work than the positivity axioms — is that visible from inside the proof assistant, or only once you start thinking in terms of Kripke models? And the modal collapse result: in your translation does it read as a defect of the axiom set or just as another theorem? Overall, which of the residue is my vocabulary's fault, and which is a sign the original argument was never as clear as it pretends?
