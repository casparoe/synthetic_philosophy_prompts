answer: |-
  The pattern you describe is standardly classified in metaethics and political philosophy as the Euthyphro Dilemma applied to constructivism, though your specific epistemic variation is typically categorized under the Epistemic Objection to Ideal Theory, and your diagnosis overlooks a standard pragmatic third option that dissolves the dichotomy.

  Your rejection of the Euthyphro label rests on a category error: the Euthyphro Dilemma is not essentially about divine commands but about the **direction of fit** between a standard and an authority. The structure "Is X good because God approves, or does God approve because X is good?" is logically identical to "Is X right because ideal agents agree, or do ideal agents agree because X is right?" In the literature on constructivism (e.g., Sharon Street, Christine Korsgaard), this is explicitly termed the **"Euthyphro Contrast for Constructivism."** It captures your first horn (constitutive: agreement makes it right) and your second horn (realist/tracking: agreement detects independent rightness).

  However, your dilemma ignores a well-known third possibility: **Proceduralism as Heuristic** (or Instrumentalism). On this view, the idealization is neither a truth-maker nor a tracker, but a **device of representation** (Rawls's term) or a **reflective tool** designed to filter out bias and facilitate agreement among actual agents. The procedure does not fix the content metaphysically, nor does it access a Platonic realm; it models what would be acceptable under conditions that neutralize power and ignorance to test the stability of norms. This dissolves your dichotomy because the procedure can criticize actual proposals (by revealing they rely on coercion or ignorance) without claiming the ideal verdict is ontologically constitutive or epistemically accessible in full. This view is common in Deweyan pragmatism, later Rawls, and Sen's comparative approach to justice.

  Regarding your boundary cases:
  *   **Ideal Observer Theory:** Falls squarely inside the pattern. It is vulnerable to the Euthyphro Contrast (does the observer approve because it is good?) and the Epistemic Objection (we cannot know the ideal observer's verdict).
  *   **The Original Position:** Falls inside the pattern, but Rawls explicitly defends the "heuristic" third option to avoid the metaphysical horns. He argues the veil of ignorance is a modeling tool, not a description of a metaphysical fact.
  *   **Reflective Equilibrium:** Falls partially outside. It does not posit a single idealized endpoint unknown to us; it is a method of adjusting principles and judgments we *already* have. The "ideal" is the equilibrium state itself, which is accessible in principle, though hard to reach.
  *   **AI Alignment (Ideal Deliberation):** Falls squarely inside. Proposals like Coherent Extrapolated Volition (CEV) are vulnerable to the exact epistemic objection you raise (we cannot know the extrapolation, yet use it to veto current objectives).

