      *   *Consistency:* Bacteria/Rats/Insects (No symbols) $\rightarrow$ Darwinian/Skinnerian. Crows (No symbols) $\rightarrow$ Popperian. Children (Embodied social transmission) $\rightarrow$ Gregorian.
