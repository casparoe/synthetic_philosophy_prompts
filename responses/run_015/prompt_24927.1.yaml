  I'm a high school junior doing an independent study on metaethics — my advisor has me reading primary sources rather than a textbook, which has been great but also disorienting. Over the past few months I've worked through parts of Hume's Treatise, Moore's Principia Ethica, Sharon Street's evolutionary debunking paper, and some of the Cornell realists, and I've tried to extract the claims I find most convincing. The problem is that they pull in different directions, and I can't tell which tensions are real and which are just me not having thought things through carefully enough. I'd like you to audit the set and tell me whether I'm holding an inconsistent package.

  Here are the five claims I'm committed to:

  1. Hume's is-ought gap is correct: no moral conclusion can be validly deduced from premises that are entirely non-moral.
  2. Moore's naturalistic fallacy is a distinct and sound argument: 'good' names a simple, indefinable, non-natural property, and any attempt to define it in natural terms commits a fallacy.
  3. Moral naturalism is nonetheless the most plausible metaethical view: moral facts are natural facts, and moral properties are natural properties.
  4. The evolutionary origins of our moral intuitions give us strong reason to doubt their reliability as guides to moral truth.
  5. Reflective equilibrium — bringing our case judgments and general principles into coherence — is the right method for arriving at moral knowledge.

  Please give me exactly five items in a numbered list, each one or two sentences, with no introduction or conclusion. Each item should identify a specific tension (or a specific apparent tension that dissolves on inspection), state its severity, and briefly say what would have to give to resolve it. Take a definite position on each — don't just lay out options or tell me that reasonable people disagree.
