  **Note on Form and Argument**
  Stanza 4 carries the squeeze: the dial moves from certainty through symmetry (half) to asymmetry. Continuity suggests smooth change, but the census (count) is discrete. The extra ingredient—decision-theoretic coherence across composite systems—is invoked in Stanza 5 ("Composition rules"). Line length mimics amplitude: lines describing the high-amplitude "down" outcome (Stanza 3, line 4; Stanza 4, line 5) are long and heavy, while lines describing the low-probability "maverick" branches (Stanza 6, lines 2–5) are short and gaunt, physically enacting the weight the Bookkeeper's census ignores.
