  You say the universe is strictly **one**
  wavefunction spreading out without **measure**,
  so every path deserves an equal **half**.
  If I run this a hundred times you **count**
  two to the power N for every **branch**,
  and ignore the amplitude's quiet **weight**.

  But here the needle leans against the **weight**
  of what I know. The system is not **one**
  symmetric coin; it favors this **branch**
  where down occurs twice often, heavy and frequent. Your **measure**
