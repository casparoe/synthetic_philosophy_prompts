  The bell curve peaks not at your neutral **half**.

  I turn the dial. At center sits a **half**,
  and symmetry compels the equal **weight**—
  a balanced beam. But slide the knob: the **count**
  stays stubborn integer while the **one**
  smooth state flows round the bend, a heavy river of **measure**
  binding the agent's bet across the **branch**.

  Coherence demands the **branch**
  not stand alone. If I bet **half**
