answer: |-
  1. **Defender:** Consider Black's universe: two iron spheres, identical in every intrinsic quality, separated by distance.
  **Denier:** Distance saves your intuition there, but remove space entirely: two qualitatively identical momentary experiences, no time, no space, no third thing to relate them to differently.

  2. **Defender:** If a world containing two such items may only ever be describable symmetrically, it may not be a genuine possibility at all; or primitive haecceities might be admitted.
  **Denier:** If you admit haecceities, you grant individuation without quality, which leaves the principle true but trivial or question-begging.

  3. **Defender:** I concede that admitting haecceities leaves the principle true but trivial, yet trivial truths are not false; does one counterexample settle anything when the principle is claimed to hold of necessity?
  **Denier:** If the principle is necessary, one genuine counterexample destroys it, but you must prove this variant world is impossible to deny the counterexample.

  4. **Defender:** If you require proof of impossibility, you raise the modal bar too high; yet if possibility stands, the principle falls.
  **Denier:** If the principle falls, logic bends; yet intuition supports possibility despite the logical cost.

  5. **Defender:** What is at stake is the argument against absolute space; if the variant succeeds, a universe shifted three feet east is a distinct creation.
  **Denier:** I concede the shift argument falls if the variant succeeds, but deny that saves relational space.
