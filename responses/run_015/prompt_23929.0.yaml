      *   *Museum Knowledge Check:* Do I understand "anastylosis"? Yes. Do I understand the "distinguishability" norm (e.g., the Venice Charter)? Yes.
      *   *Nuance:* Ensure I don't claim the practice is *metaphysically consistent* in a rigorous logical sense, but rather *pragmatically coherent* within a specific ontological framework (social ontology/artifact ontology).
      *   *Flagging Contention:* Explicitly state where philosophers disagree (e.g., abstract vs. concrete art objects).
      *   *Structure:* Follow the 5 questions sequentially.

  9.  **Drafting the Response (Mental Outline):**
      *   *Intro:* Acknowledge the richness of the intersection.
      *   *Q1:* Constitution = Distinctness. Persistence = Gradual replacement + Causal History.
      *   *Q2:* Reconciliation = Historical Essentialism. Matter carries history. Coherence = Yes, but relies on social ontology.
      *   *Q3:* (a) OK. (b) Fail (history broken). (c) OK (parts + history intact).
      *   *Q4:* Presuppositions (Not matter-identity, History matters). Underdetermined (Abstract vs. Concrete, 3D vs. 4D).
      *   *Q5:* (i) Fragment culture. (ii) Replica culture.
