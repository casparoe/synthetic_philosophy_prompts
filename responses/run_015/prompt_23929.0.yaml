      *   *(b) Melted/Recast:* Practice says "This is a copy/reproduction, not the original." (Even if same metal). Theory says: Causal chain of *form* was broken. The artist's specific shaping event is lost. The matter is the same, but the *history* is reset. This tests the "Matter vs. Form" balance. Practice prioritizes the specific history of shaping over the specific atoms.
      *   *(c) Anastylosis:* Practice says "Original object." Theory says: Spatial discontinuity is okay if causal/functional continuity is maintained and original parts are used. This supports the idea that *arrangement* matters more than *continuous cohesion*, provided the parts are the original historical artifacts.

  6.  **Address Question 4: Presuppositions vs. Compatibility (Underdetermination):**
