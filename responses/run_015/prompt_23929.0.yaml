  3.  **Address Question 1: Theory of Constitution & Persistence:**
      *   *Statue vs. Lump:* If the statue were *identical* to the original matter (the specific atoms/molecules at $t_0$), replacing *any* part would destroy the statue. But they replace parts and keep the label. So, it cannot be strict identity with the original matter.
      *   *Constitution View:* It looks like the "Constitution View" (Baker, etc.) or a "Four-Dimensionalist" view with temporal parts. The statue is *constituted by* matter but not *identical to* it.
      *   *Persistence:* It allows for material replacement. This suggests "Sortal-Dependent Persistence." The object persists as long as it satisfies the sortal "Statue" (or "Work of Art").
      *   *Material Continuity:* It's not *no* continuity (Ship of Theseus style total replacement is frowned upon), but it's not *total* continuity either. It's "Gradual Replacement with Causal/Functional Continuity."
