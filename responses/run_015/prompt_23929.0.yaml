answer: |-
  This is a profound inquiry. You are asking for the implicit ontology of a specific social practice. Museum conservation is not merely applied chemistry or art history; it is applied metaphysics. The conservator acts as the guardian of diachronic identity, making daily judgments about what makes an object *the same object* over time.

  Here is a reconstruction of the metaphysical presuppositions of standard conservation practice, analyzed through the lens of material constitution.

  ### 1. Theory of Constitution and Persistence

  **Constitution: Distinctness, not Identity.**
  The practice decisively rejects the view that the statue is *identical* to the original lump of matter (the specific atoms or molecules present at the moment of the artist's completion). If the statue were identical to the original matter, the replacement of even a single gram of marble with resin would entail the destruction of the statue and the creation of a new, numerically distinct object. Since conservators replace material and maintain the inventory number, artist attribution, and creation date, they presuppose that the statue is *constituted by* the matter but is not *identical to* it.

  This aligns with the "Constitution View" (associated with philosophers like Lynne Rudder Baker) or a "Sortal-Dependent" view. The statue is an artifact whose identity conditions are determined by the sortal concept "Work of Art" or "Statue," not by the sortal "Lump of Clay" or "Aggregate of Molecules." The matter constitutes the statue, but the statue has persistence conditions that the matter does not share.

  **Persistence: Causal-Functional Continuity with Material Constraints.**
  Regarding persistence through replacement, the practice rejects both strict material continuity (no change allowed) and pure functional continuity (Ship of Theseus total replacement). Instead, it presupposes a theory of **Gradual Historical Continuity**.

  The object persists if:
  1.  There is a continuous causal chain linking the current state to the artist's original generative act.
  2.  The form or function recognizable as the work is maintained.
  3.  A "critical mass" of original material (or original historical parts) remains to anchor that causal chain.

  This implies that identity does not require *total* material continuity, but it does require *significant* material continuity. The "slack" allowed is not arbitrary; it is bounded by the vague threshold you noted. This suggests the practice presupposes that vagueness is a feature of the world (or at least of artifact identity), not merely a feature of our language. A reasonable philosopher could disagree here, arguing the vagueness is epistemic, but the *practice* treats the threshold as ontological: there is a point where the object ceases to be, even if we cannot draw the line precisely.

  ### 2. Reconciling Persistence with the Value of Original Matter

  **The Tension.**
  You have identified the central metaphysical friction: If the statue is not identical to the matter (since we replace it), why does the matter possess "authenticity value"? If $A$ (the statue) persists through the change from Matter-1 to Matter-2, why is Matter-1 privileged?

  **The Implicit Theory: Historical-Relational Essentialism.**
  The practice reconciles this by treating the statue as a **historical individual**. On this view, the identity of the artifact is grounded in its *origin* (the artist's specific action upon specific matter) and its *continuous history*.

  The original matter is not "the statue" in the sense of identity, but it is the **primary witness** to the generative event. The value of the original matter is not intrinsic to the atoms themselves, but relational: it bears the causal trace of the artist's hand (tool marks, patina, weathering). When we replace a part, we are interrupting that causal trace locally. We allow this interruption for the sake of the whole's survival (preventing structural collapse), but we mark the interruption (Norm 1) to acknowledge the break in the causal chain.

  **Coherence Check.**
  Is this coherent?
  *   **Yes,** if one accepts that artifacts are defined by their history of production. The "stuff of the statue" is not the atoms, but the *history embodied in the atoms*. We can replace some atoms without losing the history, provided the replacement is subordinate to the original structure.
  *   **No,** if one holds a strict Leibnizian view of identity. If the object at $t_2$ is identical to the object at $t_1$, and the value is intrinsic to the object, the value should not diminish when matter changes.

  The practice resolves this by distinguishing **Identity** from **Integrity**. The object remains *numerically identical* (same label), but its *historical integrity* is degraded by replacement. The "limit" on replacement is the point where the degradation of integrity outweighs the continuity of form, causing the object to lose its status as a witness to the artist's act. This is a coherent social ontology, though a metaphysician of strict material constitution might argue it conflates "being the same object" with "being a valuable relic."

  ### 3. Application to Specific Cases

  **(a) Statue with resin arm.**
  *   **Practice Requirement:** Display as original work; mark resin as distinct (color/texture); date as original creation.
  *   **Implicit Theory Handling:** This is the standard case of "accidental change" or minor material replacement. The causal chain is predominantly intact. The form is restored. The theory handles this easily: the statue persists because the core historical substrate remains.

  **(b) Melted down and recast (same metal, same shape).**
  *   **Practice Requirement:** Label as "Copy," "Reproduction," or "After [Artist]." Do not use original date.
  *   **Implicit Theory Handling:** This is the critical test. Even though material continuity is high (same metal) and formal continuity is perfect (same shape), the practice treats this as a *new* object.
  *   **Why?** The theory presupposes that the **specific shaping event** is essential. Melting destroys the form and the causal link to the artist's specific manipulation. The metal is the same, but the *history of the arrangement* is reset. This confirms that the theory is not Materialist (matter isn't enough) and not purely Formalist (shape isn't enough); it is **Historical-Structural**.

  **(c) Anastylosis (Disassembled and reassembled original parts).**
  *   **Practice Requirement:** Label as original work; date as original creation; new joining material (rods/adhesives) must be minimal/distinguishable.
  *   **Implicit Theory Handling:** The theory handles this well. Spatial continuity was broken, but material continuity was preserved (all original parts exist). The causal history of the *parts* is intact, and the reassembly aims to restore the original causal configuration. This suggests that *cohesion* is less important than *part-identity*. The statue is seen as a mereological sum of historical parts, arranged thusly.

  ### 4. Presuppositions vs. Compatibility (Underdetermination)

  **Strict Presuppositions (What the practice requires):**
  1.  **Non-Identity of Object and Matter:** The work is not identical to its initial atomic composition.
  2.  **Historical Essentialism:** The origin (artist's action) is essential to identity. A perfect duplicate created today is not the same object.
  3.  **Mereological Flexibility:** An object can survive the loss and replacement of some proper parts.
  4.  **Vagueness of Identity:** There is no precise number of replaced parts that destroys identity; the boundary is fuzzy.

  **Compatible but not Required (What fits but isn't demanded):**
  1.  **Abstract vs. Concrete:** The practice fits with the view that the "Work" is a concrete physical object. However, it is also compatible with the view (e.g., Jerrold Levinson) that the Work is an *abstract indicated structure*, and the museum holds a "specimen" of that structure. Conservation is then preserving the specimen that bears the correct causal relation to the structure. The practice doesn't force us to choose.
  2.  **3D vs. 4D:** The practice is compatible with Endurantism (the whole object exists at each time) and Perdurance/Temporal Parts (the statue is a space-time worm). A temporal parts theorist would say we are preserving the later temporal stages that are causally connected to the early stages. The conservator doesn't need to decide this.

  **Philosophical Underdetermination:**
  The practice is underdetermined between **Constitution View** (Statue $\neq$ Lump, but coincident) and **Dominant Sorts** (The object is essentially a statue, not a lump). Both license replacement. It is also underdetermined between **Concrete Artifact Realism** (The physical object is the work) and **Abstract Artifact Theory** (The work is a type, the object is a token). As long as the token preserves the right historical link, the conservation actions remain the same. A reasonable philosopher could disagree on the fundamental category of the artwork without changing a single conservation protocol.

  ### 5. Counterfactual Practices

  If the metaphysical foundations shifted, the practice would change radically.

  **(i) If the statue were identical to the original matter (Strict Materialism):**
  *   **Replacement:** Forbidden. Any loss of material is a loss of the object.
  *   **Intervention:** Conservation would be limited to environmental control to prevent atom loss. Structural support would have to be external (scaffolding) rather than integrated (adhesives/inserts), to avoid "contaminating" the identity.
  *   **Labeling:** If an arm fell off, the "Statue" would cease to exist. The museum would display "Fragment of Statue A" and "Fragment of Statue B." The date would be the date of the fragment's separation.
  *   **Anastylosis:** Impossible. Once disassembled, the identity is broken. Reassembly creates a new aggregate.

  **(ii) If the statue were a purely formal/pattern object (Strict Formalism/Platonism):**
  *   **Replacement:** Irrelevant. Matter is merely a vessel.
  *   **Intervention:** Replacements need not be distinguishable. In fact, the goal would be to make the new material look *exactly* like the old to preserve the pattern. A perfect resin arm is metaphysically equal to a marble arm.
  *   **Labeling:** If the statue were melted and recast perfectly, it would retain the original label and date, because the *Form* persisted.
  *   **Value:** "Authenticity" would attach to the design, not the history. A perfect modern forgery would be metaphysically indistinguishable from the original and might be treated with equal regard (or the original treated with no special regard).

  ### Summary of Conceptual Judgments

  In this reconstruction, I have made several judgment calls that are open to philosophical dispute:
  1.  **I have assumed the practice is coherent.** A skeptic might argue conservation is metaphysically inconsistent, muddling identity and value. I have argued it relies on a specific, coherent "Historical-Relational" ontology.
  2.  **I have treated "Vagueness" as ontological.** Some philosophers argue identity is never vague; if we can't draw a line, it's a failure of our concepts, not the object. The practice, however, acts as if the object itself fades out gradually.
  3.  **I have prioritized History over Form.** Case (b) (melting) shows that Form alone is insufficient. But one could argue that in Case (b), the *process* is part of the Form. I have judged that the practice treats the specific historical tokening of the form as essential.

  The conservation studio is a laboratory of metaphysics. It operates on a view that artifacts are **historical individuals constituted by matter but defined by origin and continuity.** This view allows for change without destruction, but places a premium on the physical traces of history, reconciling the need for survival with the value of authenticity.
