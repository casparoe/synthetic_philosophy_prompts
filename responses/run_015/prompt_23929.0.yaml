          3.  *Hylomorphism:* Form/Matter composite. Fits well.
      *   *Key Insight:* The practice is underdetermined between "Concrete Historical Individual" and "Specimen of an Abstract Type."

  7.  **Address Question 5: Counterfactual Practices:**
      *   *(i) Identity with Original Matter:*
