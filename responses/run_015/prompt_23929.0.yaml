      *   *Theory:* "Historical-Relational Essentialism." The statue is an artifact whose identity depends on its history of production (artist's action) and a continuous causal chain. The *original matter* carries the causal trace of the artist's hand.
      *   *Coherence:* Is it coherent? Yes, if we view the object as a "historical individual." The matter is the *medium of the history*. Replacing it breaks the causal link slightly, but not enough to break identity *if* the form/function remains. However, too much replacement breaks the causal link to the artist.
      *   *Critique:* A hard-nosed metaphysician might say this is inconsistent (if $x=y$ at $t_1$ and $x=z$ at $t_2$, why is $y$ better than $z$?). But a social ontologist would say art objects are status functions. It's coherent within a social ontology framework. I need to flag this as a point of philosophical contention.

  5.  **Address Question 3: Specific Cases:**
