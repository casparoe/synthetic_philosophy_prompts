  # The War-Film Night Moral Flowchart

  Below are the **10 Diagnostic Nodes** (questions). They are phrased as plain cases, not philosophy. Following that is the **Branching Logic** (how your answers map to positions), the **Leaves** (the named positions with their implications), and an **Analysis** of the tricky bits you asked about (useless cases, incoherent combos, Dave's "left-over").

  ## Part 1: The 10 Diagnostic Nodes (Questions)
  *Answer Yes/No to each. "Yes" means you accept the premise in the question.*

  1.  **The Absolute No:** Is killing in war *always* wrong, even in self-defence against an invader?
  2.  **The Unjust Aggressor:** If Side A is clearly invading for no reason, is their frontline soldier *more* killable than Side B's defender?
  3.  **The Sleeping Target:** Is a soldier in his bunk, posing no immediate danger, a valid target simply because he wears a uniform?
  4.  **The Civilian Contributor:** Is the civilian writing the targeting code a valid target, perhaps *more* so than the medic patching wounds?
  5.  **The Democratic Voter:** If liability comes from responsibility for the war, is the voter who elected the aggressor government a valid target?
  6.  **The Honest Mistake:** If the invader soldier was lied to and reasonably believes he's saving lives, is he *less* killable than one who knows the truth?
  7.  **The Sadistic Defender:** If a soldier is on the Just Side but kills for fun, is he still morally protected from being shot?
  8.  **The Mutual Wrong:** If both sides are partly in the wrong, is everybody equally killable?
  9.  **The Peace Treaty Rule:** Should we treat soldiers as equal targets because admitting otherwise makes wars last longer?
  10. **The Morning After:** If you kill an enemy soldier who was legitimately targeting you, do you carry a special burden of guilt (a "left-over")?

  ***

  ## Part 2: The Branching Logic (How to Read Your Answers)
  *Follow the path that matches your answers to find your Leaf.*

  *   **START at Q1.**
      *   **YES:** You are at **Leaf A (Absolute Pacifist)**. (Skip to Part 3).
      *   **NO:** Go to **Q2**.

  *   **AT Q2 (Does Justice Matter?).**
      *   **NO (Soldiers are Equal):** Go to **Q9**.
          *   **YES (Treat equal to shorten war):** You are at **Leaf B (Conventionalist)**.
          *   **NO (They are just naturally equal):** You are at **Leaf C (Traditionalist)**.
      *   **YES (Unjust soldiers are more killable):** Go to **Q3**.

  *   **AT Q3 (Sleeping Soldier).**
      *   **YES (Status makes you targetable):** Go to **Q4**.
      *   **NO (Threat makes you targetable):** You are at **Leaf D (Threat-Based Revisionist)**.

  *   **AT Q4 (Programmer vs Medic).**
      *   **YES (Contribution matters):** Go to **Q5**.
      *   **NO (Uniform matters):** You are at **Leaf E (Status-Based Revisionist)**.

  *   **AT Q5 (The Voter).**
      *   **YES (Voters are liable):** You are at **Leaf F (Deep Revisionist)**.
      *   **NO (Only combatants/contributors):** Go to **Q6**.

  *   **AT Q6 (The Conscript/Epistemics).**
      *   **YES (Belief excuses):** You are at **Leaf G (Epistemic Revisionist)**.
      *   **NO (Facts excuse):** You are at **Leaf H (Factual Revisionist)**.

  *   **AT Q7, Q8, Q10 (Modifiers).**
      *   These questions do not change your main Leaf, but they add **Tags**.
      *   **Q7 (Sadist):** If **NO** (Sadist is protected), you hold a **Cause-Over-Character** view. If **YES**, you hold a **Character-Matters** view.
      *   **Q8 (Mutual Wrong):** If **YES**, you accept **Symmetry in Gray Zones**.
      *   **Q10 (Residue):** If **YES**, add the **"Dave's Residue" Tag** to your Leaf.

  ***

  ## Part 3: The Leaves (Positions)

  | Leaf | Name | The Awkward Thing You Must Swallow | Stance on Conscript (Lied To) | Stance on Programmer |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | **Absolute Pacifist** | You cannot kill even to stop a genocide. | Cannot be shot (no one can). | Cannot be shot (no one can). |
  | **B** | **Conventionalist** | You must follow rules you know are morally imperfect. | Equally killable (rule of war). | Not killable (civilian status). |
  | **C** | **Traditionalist (MEC)** | A Nazi conscript and a Allied defender are moral equals. | Equally killable. | Not killable. |
  | **D** | **Threat-Based Revisionist** | You can't shoot the sleeping enemy, even if he's unjust. | Less killable (if reasonable). | Not killable (no direct threat). |
  | **E** | **Status-Based Revisionist** | Uniform makes you a target, even if you're harmless. | Less killable (if reasonable). | Not killable (no uniform). |
  | **F** | **Deep Revisionist** | Democratic voters are legitimate military targets. | Less killable (if reasonable). | **Killable** (causal responsibility). |
  | **G** | **Epistemic Revisionist** | A soldier is safe because he was gullible, not innocent. | **Not Killable** (excused by belief). | Killable (knows what code does). |
  | **H** | **Factual Revisionist** | A reasonable but wrong soldier is just as killable as a criminal. | Killable (facts override belief). | Killable (facts override distance). |

  ***

  ## Part 4: Analysis of Constraints & Edge Cases

  ### 1. Useless Diagnostics (From your list)
  *   **The Volunteer (Money):** I did not make this a main branch point. **Why:** Almost no theory distinguishes liability based on *motivation* (money vs. cause). Whether he kills for pay or patriotism, his action is the same. It doesn't split the views.
  *   **The Mutual Wrong (Q8):** I made this a **Tag** rather than a Branch. **Why:** If both sides are wrong, Traditionalists say "Equal" and Revisionists say "Both Liable." They end up in the same practical place (everyone is shootable), so it doesn't help distinguish the *theory*, only the *assessment of the specific war*.

  ### 2. Incoherent / Unheld Combinations
  *   **Traditionalist + Voter Target:** (Leaf C + Q5 Yes). **Incoherent.** If you believe soldiers are equal because of their status (uniform), you cannot suddenly target voters based on responsibility. That mixes Status and Responsibility logic.
  *   **Pacifist + Shortens War:** (Leaf A + Q9 Yes). **Incoherent.** You cannot believe killing is always wrong *and* that we should kill to shorten wars.
  *   **Factual Revisionist + Conscript Excuse:** (Leaf H + Q6 Yes). **Unattractive/Unexplored.** If facts determine liability, a false belief shouldn't excuse you. Holding both suggests confusion about what "liability" means.

  ### 3. Indistinguishable Leaves
  *   **Leaf B (Conventionalist) vs. Leaf C (Traditionalist):** On the battlefield, these look identical (soldiers treat each other as equals).
      *   *Splitting Question:* "Is the rule *because* it's moral, or *despite* morality?" (Q9 handles this).
  *   **Leaf D (Threat-Based) vs. Leaf E (Status-Based):** In modern war, sleeping soldiers wake up and become threats.
      *   *Splitting Question:* "Can you bomb the barracks at 3 AM?" (Q3 handles this).

  ### 4. Dave's "Left-Over" (Moral Residue)
  *   **Is it a separate branch?** Yes (Q10).
  *   **Does it change the position?** No. It is a **Tag** that applies to almost any Leaf (except Absolute Pacifism).
  *   **Why:** You can believe killing was *permissible* (Revisionist or Traditionalist) but still feel *guilt*. This view (often associated with *Just War Theory* moderates) separates **Justification** (was it allowed?) from **Sanctity** (was it tragic?). If Dave says "Yes" to Q10, he is a **Residue Revisionist** or **Residue Traditionalist**. It doesn't change who is shootable, only how the shooter feels afterwards.

  ### 5. Summary of Your Specific Tensions
  *   **Facts vs. Evidence:** Handled at **Q6 (Conscript)**. Leaf G says Evidence matters; Leaf H says Facts matter.
  *   **Responsibility vs. Threat:** Handled at **Q3 (Sleeping)** and **Q5 (Voter)**. Leaf D says Threat; Leaf F says Responsibility.
  *   **Uniform as Answer:** Handled at **Q4 (Programmer)**. Leaf E says Uniform is the key; Leaf F says Causality is the key.
  *   **Shortening Wars:** Handled at **Q9**. This creates the **Conventionalist (Leaf B)** position.
  *   **Dave's Left-Over:** Handled at **Q10**. Add the **"Residue Tag"** to your result.
