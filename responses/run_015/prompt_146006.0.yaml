answer: |-
  The metaphysician's charge that you've reduced causation to explanatory interest threatens to invalidate the project entirely, and your reply that causal facts are stable even if causal claims are partition-relative risks begging the question.

  **1. The Metaphysician**
  *Phrasing:* "Causation is a relation in nature, not to our questions. If partitions are selected by interest, you've changed the subject from causation to explanation."
  *Bite:* Real. Threatens ontological status.
  *Reply:* Causal *structure*—the counterfactual dependencies—is mind-independent. Partitions don't create dependencies; they select the grain at which we track them. Nature supports multiple stable patterns; we select the partition to track the one relevant to our system.
  *Soft:* Blurs the line between ontology and epistemology dangerously.

  **2. The Interventionist**
  *Phrasing:* "What are your admissible variable sets? Can you intervene on the mental variable without fixing the physical? If not, the coarse variable isn't invariant or independent."
  *Bite:* Real. Technical viability.
  *Reply:* Interventions target the partition level. We hold physical realizers fixed *within* the coarse type to test stability across realizers. The coarse variable is invariant under interventions that swap realizers while holding the mental type constant.
  *Soft:* Violates standard interventionist independence constraints between variables.

  **3. The Exclusionist (Identity Theorist)**
  *Phrasing:* "Physical sufficiency leaves nothing for the mental to do. Counterfactual stability is just a modal profile, not causal power. There's nothing left for the mental to do."
  *Bite:* Real. Challenges causal efficacy.
  *Reply:* Causal power *is* counterfactual stability across realizers. You demand 'oomph' beyond counterfactuals, which is metaphysical surplus. The mental does the work by ensuring the effect occurs across a range of physical conditions.
  *Soft:* Assumes a counterfactual theory of causation is sufficient.

  **4. The Non-Reductive (Proportionality)**
  *Phrasing:* "Yablo already said causes must be proportional to effects. What does 'partition' add beyond screening off the excessive detail?"
  *Bite:* Weak. Differentiation needed.
  *Reply:* Proportionality is a constraint on causes; partitions define the space where causation is evaluated. It formalizes the grain explicitly rather than treating it as a constraint on a single domain.
  *Soft:* Might be merely terminological overlap.

  **5. The Non-Reductive (Program Explanation)**
  *Phrasing:* "Jackson and Pettit said higher levels program lower levels. Is this just the program-explanation line with extra steps?"
  *Bite:* Weak. Differentiation needed.
  *Reply:* Program explanation is explanatory; partition-relativity is ontological about causal relata. I claim the cause *is* the coarse type relative to the partition, not just a useful description of the physical cause.
  *Soft:* Hard to sustain ontological claim without mind-independence.

  **6. The Non-Reductive (Realizer Inheritance)**
  *Phrasing:* "If realizers confer causal powers, why block competition via partitions? Why not let the mental inherit the physical cause's power?"
  *Bite:* Weak. Theoretical preference.
  *Reply:* Inheritance assumes one partition. I show competition presupposes partition identity. Inheritance tries to solve exclusion; I dissolve it by denying the competition premise holds across grains.
  *Soft:* Requires accepting partition relativity first.

  **7. The Exclusionist (Eliminativist)**
  *Phrasing:* "If there's no partition-free answer, mental causation isn't real. You've conceded eliminativism by denying a mind-independent fact."
  *Bite:* Real. Challenges reality of mental causation.
  *Reply:* 'Real' implies partition-free. I deny that premise. Causation is always relative. Mental causation is real relative to the psychological partition, which is the only one tracking the relevant stability.
  *Soft:* Rejects common usage of 'real causation'.

  **8. The Chair (Humean)**
  *Phrasing:* "Laws are at the micro level. Where are the laws for coarse partitions? If there are no strict laws, there is no causation."
  *Bite:* Real. Challenges nomological support.
  *Reply:* Special science laws are stable counterfactual patterns, not micro-laws. They support interventions at the coarse grain. Humeanism allows patterns at any level if they support counterfactuals.
  *Soft:* Humean might deny special science laws are fundamental.

  **9. The Graduate Student**
  *Phrasing:* "Isn't this verbal? You just defined 'cause' to avoid exclusion. It's the same cause under a different description."
  *Bite:* Weak. Skepticism.
  *Reply:* It's substantive: it changes which counterfactuals matter. It predicts different causal judgments in overdetermination cases depending on the partition selected.
  *Soft:* Hard to show empirical difference.

  **Two Concessions**
  Open by conceding: (1) There is no partition-free answer to whether mental states cause behavior. This preempts the Eliminativist's charge of evasion; frame it as rejecting a false dichotomy rather than denying reality. (2) The mental adds no causal influence over and above the physical. This preempts the Identity Theorist's charge of surplus; frame it as causation being stability, not force accumulation. Concede these to show you aren't trying to save "spooky" causation, but clarifying the structure of causal claims.

  **The Crucial Reply**
  You must land the reply to the Metaphysician (Objection 1). If causation is interest-relative, it looks like explanation, not ontology. You must argue that the *dependencies* are objective, even if the *typing* is relative. The partition tracks real modal structures in the world, not just our ignorance.
  *Honest Verdict:* It works only if the audience accepts that multiple objective patterns exist at different grains. If they demand a single "fundamental" causal story, you lose.

  **The Hidden Question**
  "If partitions are interest-relative, isn't causation just explanation?" You hope nobody asks this because it collapses your ontological claim into an epistemic one, forcing you to admit you've solved the exclusion problem by changing the subject from metaphysics to pragmatics.
