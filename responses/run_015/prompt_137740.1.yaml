answer: |-
  Here is the breakdown of the settled vs. contested landscape, followed by the research agenda.

  ### Settled vs. Contested: The Landscape

  You need to separate the mathematics from the metaphysics and the domain assumptions.

  **Settled (Consensus):**
  1.  **The Price Equation is an identity.** It is mathematically true by definition. It partitions change in a trait into covariance components. No one who understands the math disputes this.
  2.  **Formal Equivalence (under standard assumptions).** In standard population genetics (discrete generations, clear lineage, vertical transmission), you can algebraically transform a gene-centric model into a group-centric model and vice versa. They predict the same equilibrium frequencies.

  **Contested (Active Debate):**
  1.  **Causal Interpretation of Partitions.** Even in biology, it is *not* consensus that the terms in the Price Equation correspond to distinct causal forces. Some argue they are purely statistical descriptions (your friend's view); others argue they map to actual causal processes (the "causalist" view). This is a live debate in philosophy of biology and theoretical biology.
  2.  **Equivalence under Non-Standard Transmission.** The algebraic equivalence proofs rely on specific structures (lineages, nested groups). Whether these equivalences hold when transmission is oblique, network-based, or when "groups" do not reproduce is **not** settled. Your friend is extrapolating from biological consensus to a domain where the assumptions do not hold.
  3.  **Explanatory Equivalence.** Even if two models predict the same equilibrium, does it matter which one you use for understanding *why*? Some argue one framing reveals constraints the other hides.

  **Pseudo-Questions (Drop These):**
  1.  **"Which level is the *true* unit of selection?"** If framed as mutually exclusive (either genes OR groups), this is pseudo. Selection is a process that can be partitioned at multiple levels simultaneously.
  2.  **"Does group selection exist?"** Without quantifying magnitude or specifying the mechanism, this is a yes/no question about a continuous variable. Ask "How much variance is explained by group structure?" instead.
  3.  **"Is the Price Equation causal?"** The equation is math. The *assignment* of causal meaning to the terms is the question. Don't fight the math; fight the interpretation.

  ---

  ### The Agenda: 5 Questions for Cultural Evolution

  This agenda is ordered by logical dependency (upstream to downstream) and tractability for a simulation-based team. It assumes your friend is right about the math but wrong about the domain applicability.

  **1. Can we construct a stable group-fitness metric without group reproduction?**
  *   **The Question:** In biology, group selection often relies on group fission/fusion or extinction. In cultural evolution, villages or networks persist without "reproducing." Can you define a group-level fitness term in a Price Equation partition that remains stable and meaningful when groups only change internal composition but never split or die?
  *   **Why First (Upstream):** If you cannot define the variable ($W_{group}$), you cannot test whether group selection exists or whether it is equivalent to individual selection. This is the prerequisite for all subsequent MLS (Multilevel Selection) work in your domain.
  *   **Tractability:** High. Use individual-based simulations (IBMs) where agents belong to networks. Define group success as persistence or norm stability rather than fission. Test if the variance component remains robust over time.
  *   **Crowdedness:** Low. Most MLS theory assumes group reproduction. Cultural group selection often hand-waves this.
  *   **Success Metric:** A defined metric that correlates with norm spread in sims where groups do not fission.

  **2. Do selection partitions remain equivalent under oblique and network transmission?**
  *   **The Question:** The equivalence proofs assume vertical transmission or clear lineage. In your work, agents copy peers (oblique) across group boundaries. If you run an IBM with network transmission, does the "individual-level selection" parameterization yield the same dynamics as the "group-level selection" parameterization?
  *   **Why Second:** This directly tests your friend's claim ("equivalence results mean there's no... fact of the matter") in your specific domain. If the math diverges here, the "settled" debate re-opens for cultural evolution.
  *   **Tractability:** High. Your grad student can build two versions of the same sim: one tracking individual fitness gradients, one tracking group variance. Compare trajectories.
  *   **Crowdedness:** Medium. Network evolution is hot, but specifically testing MLS equivalence on networks is open.
  *   **Success Metric:** Demonstration of divergence (or confirmation of robustness) in trajectory outcomes between the two parameterizations.

  **3. Do equivalent formulations diverge under intervention? (The "Causal Fact" Survivor)**
  *   **The Question:** The metaphysical question "Is there a causal fact of the matter?" dissolves. The operational version is: "If I intervene to change group structure, do models framed at different levels predict different outcomes?" If two models are truly equivalent, manipulating parameters in one should map perfectly to the other. If the mapping breaks under intervention, one level has causal leverage the other misses.
  *   **Why Third:** This answers your core worry about "causal facts" without getting stuck in metaphysics. It determines if the debate matters for policy or engineering norms.
  *   **Tractability:** Medium. Requires setting up intervention experiments in the sims (e.g., forcing group boundaries vs. incentivizing individuals).
  *   **Crowdedness:** Low. Most equivalence work is about equilibrium states, not intervention dynamics.
  *   **Success Metric:** A case where an individual-level model fails to predict the outcome of a group-structure intervention (or vice versa).

  **4. How does replicator fidelity constrain level partitioning?**
  *   **The Question:** Genes have high fidelity. Norms are fuzzy. At what threshold of transmission error (mutation) does the ability to partition selection into levels collapse? Does low fidelity make the "group" term noise-dominated?
  *   **Why Fourth:** This addresses your concern about "fuzzy replicators." It sets the boundary conditions for when your tools work.
  *   **Tractability:** High. Simple parameter sweep on transmission fidelity in the existing IBM.
  *   **Crowdedness:** Medium. Fidelity is discussed, but specifically its effect on MLS partition stability is less so.
  *   **Success Metric:** A phase diagram showing fidelity vs. partition stability.

  **5. Which framing minimizes prediction error in overlapping networks?**
  *   **The Question:** Pragmatic payoff. In a system with overlapping groups (person belongs to work, family, online community), does an individual-level model or a group-level model predict norm spread with less error?
  *   **Why Fifth:** This is the application. If equivalence holds, error should be equal. If one is better, that level offers better explanatory power, even if mathematically transformable.
  *   **Tractability:** Medium. Requires generating synthetic data or using empirical network structures for validation.
  *   **Crowdedness:** High for general prediction, low for comparing MLS frames specifically.
  *   **Success Metric:** Empirical or simulated evidence that one framing is more parsimonious or robust for prediction in overlapping structures.

  ---

  ### Defense of Ordering

  *   **1 is Upstream:** You cannot do 2, 3, or 5 without a definition of group fitness that works for non-reproducing groups. If Q1 fails, the rest of the MLS agenda in cultural evolution is metaphorical, not formal.
  *   **2 is the Core Test:** This is the direct challenge to your friend's claim. It must come before intervention (3) because you need to know if the baseline dynamics are equivalent before testing interventions.
  *   **3 is the "Causal" Answer:** This replaces the metaphysical debate. It comes after 2 because you need to establish baseline equivalence (or lack thereof) before testing stability under perturbation.
  *   **4 & 5 are Boundary and Payoff:** 4 sets the limits of your theory (when does it break?). 5 justifies the work (why do we care?).

  ### What Moves the List?

  *   **Move Q3 Up:** If Q2 shows that equivalence *holds* perfectly even in networks, then Q3 becomes the most important question. If the dynamics are the same, the only way to distinguish the levels is via intervention leverage.
  *   **Drop Q5:** If Q2 shows that equivalence *breaks* fundamentally (i.e., the math doesn't transform), then Q5 becomes trivial (the better model is the one that matches reality). You would instead focus on deriving the correct formalism.
  *   **Drop Q1:** If you find literature or preliminary runs showing group fitness cannot be defined without fission, you must pivot to "kin selection" equivalents or network reciprocity models instead of MLS.

  ### Final Note on Your Friend's Claim

  Your friend is correct that in *standard* population genetics, the debate is largely formal. She is incorrect that this settles the matter for *cultural* evolution. The equivalence proofs depend on the structure of inheritance. When inheritance is oblique, networked, and fuzzy, the algebraic transformations that guarantee equivalence may no longer preserve causal interpretability or even dynamic stability. You are not fighting biology; you are fighting the extrapolation of biological assumptions to cultural data.

  \answer{top priority: defining group fitness without reproduction}
