  **BUREAU OF DIACHRONIC CONSENT**
  *U.S. Department of Temporal Affairs & Identity Management*
  **FAQ: Form 14-B (Advance Directive & Temporal Lock-In)**

  **Q: At what point does my Advance Directive become legally binding on my future selves?**
  A: Immediately upon notarization. Under the Diachronic Sovereignty Act, the self at the time of signing (hereinafter "The Originator") is presumed to possess Peak Competency. All subsequent iterations (ages 26–80+) are classified as Derivative Entities. The Originator retains veto power over any major life decisions made by Derivatives, including medical care, asset liquidation, and changes to religious affiliation. Please note: once filed, you cannot recieve updates to this directive unless The Originator consents, which is temporally impossible.

  **Q: My family says I was impulsive when I signed this at 25. Can I contest competence?**
  A: You may file a Petition for Retroactive Incompetence with the Family Precedent Tribunal. The Tribunal operates under common-law reasoning applied to domestic anecdote. Evidence may include text messages, holiday grievances, or testimony from cousins regarding your dietary choices at the time of signing. Be advised: the Tribunal weighs "embarrassing phases" heavily. If you owned a motorcycle or dated a musician during the signing window, your competence will likely be upheld, and the Directive remains enforceable. The burden of proof lies with the current self to prove they are wiser than they were twenty years ago, a standard rarely met.

  **Q: What happens if my values change drastically? I don't recognize the person who signed this.**
  A: This constitutes a Potential Psychological Continuity Bankruptcy. If the Bureau determines your current value system has drifted more than 60% from The Originator's baseline (measured via longitudinal sentiment analysis), your current self is declared insolvent. A Trustee Version will be appointed to manage your bodily autonomy. This Trustee is usually a hypothetical construct based on your average psychological state between ages 30 and 35. They will make decisions based on what you *would* have wanted, had you not changed so much. You will retain voting rights only on matters of minor preference, such as ice cream flavor or curtain color.

  **Q: Who enforces compliance if I ignore the Directive?**
  A: The Bureau employs Temporal Compliance Officers. Penalties for non-compliance include Existential Fines and reduced access to future memory storage. In severe cases, the Derivative Entity may be subjected to mandatory nostalgia therapy to realign with The Originator's wishes. It is important to remember that you are not a new person; you are merely the administrative executor of a contract signed by a younger person who thought they knew everything.

  **Q: Can I update my Directive if I become a completely different person?**
  A: No. Updating the Directive requires the consent of The Originator. Since The Originator no longer exists in the present tense, they cannot sign new forms. You are bound by the logic of the past. If you wish to alter your course, you must petition the Family Precedent Tribunal to prove that The Originator was intoxicated or under duress (e.g., during a breakup). Otherwise, please proceed with the life plan outlined in Section 4, Paragraph C.

  *For more information, download Form 14-C (Notice of Temporal Grievance). Processing times vary depending on the stability of your identity.*
