answer: |-
  In a high-altitude frog population, a specific keratinized spine is fixed on the toe pads. Historically, this spine evolved for gripping wet rocks during mating struggles (F). Due to a recent geological shift, mating now occurs on dry land where gripping provides no advantage; F is obsolete. The trait remains fixed due to a severe bottleneck eliminating variation. However, the spine's geometry now systematically channels rainwater away from sensory pores (G), preventing infection. Spines damaged by abrasion fail to channel water, leading to infection, while intact spines succeed. The trait persists solely through drift, not selection for G.

  **Accounts:** I employ Millikan's etiological SE account and Cummins' systemic CR account. The CR function is relativized to the *individual organism's* capacity for *sensory maintenance*, as this is the containing system where G operates naturally.

  **Verdicts:** The SE account identifies gripping (F) as the function, because only F explains the trait's proliferation via past selection, despite current obsolescence. The CR account identifies water-channeling (G) as the function, because G is the current causal contribution explaining the trait's role in the organism's survival capacity. Both accept the full empirical description; the divergence is purely theoretical.

  **Working Feature:** The decisive feature is the *absence of selection for G* due to genetic fixation. If heritable variation were restored and selection acted on G over hundreds of generations, the SE account would update to G, eliminating the divergence. Conversely, if the bottleneck were removed but G remained non-selected, SE stays with F.

  **Reply:** The SE theorist replies that G is merely a beneficial effect (exaptation), not a function, because functions must explain trait presence via selection history. They resist granting "derived" functions without selection, arguing it severs the link between function and fitness explanation. A generalized SE account counting differential retention might accept G if drift is viewed as retention, but strict SE denies this. They concede CR describes causal organization, but deny it captures normativity—though here, somatic damage provides a non-question-begging malfunction condition for G independent of selection.

  **Closing:** The case shows they answer different questions, which inevitably produces extensional divergence when history and current contribution decouple.
