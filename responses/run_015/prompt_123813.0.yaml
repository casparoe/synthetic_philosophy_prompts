prompt: |-
  I run a small type foundry — me, two other designers, and a junior who's talented but has never read a word of theory — and we keep having the same fight in design reviews: is that glyph still an 'a'?

  It comes up maybe two or three times a week, and it's not academic for us: it decides whether a commissioned family gets approved, whether a variable font ships with a broken heavy end, whether we can legally call something a text face. We can't just say "does it look like an a," because we've all worked out that's circular — a single-storey Futura 'a', a double-storey Garamond 'a' and a blackletter 'a' share almost nothing as shapes and are all obviously a's, and meanwhile the exact same shape can be a Latin 'a' or a Cyrillic 'а' depending on which system it's doing a job in. (I keep thinking about that "Letter Spirit" chapter in Hofstadter's Fluid Concepts and Creative Analogies, the one about the essence of a letterform as something separable from its style, and honestly half the reason I'm writing is that I can't tell whether that's a thing we could actually use or just a nice metaphor.)

  What I want is a procedure, not an essay. Something the junior can run in about ten minutes with printouts and no theory background, in this order: the questions to ask, what counts as a passing answer to each, where the procedure stops with a no, and where it hands the decision to me because it's a question of taste or client negotiation rather than fact.

  Things it has to handle properly:

  - Three different ways a glyph can fail, kept apart: nobody can read it as an 'a' at all; it reads as an 'a' but collides with another letter in the same style (o, d, q, g — my hunch is that a letter's identity is partly relational, defined against the rest of the alphabet, so a glyph can be perfectly fine in isolation and still not be this alphabet's 'a'); and it reads fine but doesn't belong to the family, i.e. it looks like it was drawn by somebody else in a different style.
  - A deformation test: can we get from some canonical 'a' to this glyph by a continuous series of small steps where every intermediate still reads as an 'a'? Tell me which exemplar to start from, what breaks the path, and what to do when there's no path in one style but obviously is in another.
  - The homoglyph case, where shape and role come apart — one drawn form serving as two letters in two systems. What does the procedure say, and is there any case where it has to answer "both" or "neither"?
  - A fallback for when we can't afford real reader testing with actual users, which is most of the time, since we're four people and the budget is a joke.
  - Be upfront about which steps are judgment calls dressed up as procedure. I'd rather know than be comforted.

  Then run it on three of ours: (1) the heavy end of a variable text face where the counter of the 'a' has basically closed up at small sizes but looks deliberate and fine on a poster; (2) a client's bilingual brand asking for one shared glyph to be both Latin 'a' and Cyrillic 'а'; (3) our founder's "signature a," detached bowl with a swirl off the terminal, which is on all our marketing and which I have a bad feeling about. Give me the answer the procedure actually gives on that last one even if I won't like it.

  Finish with a one-page version I can paste into the studio handbook, and be clear about what the procedure can't tell us — whether the letter is any good, whether the family as a whole hangs together, and what to do when we're drawing for a script with no established reading comunity to appeal to.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**
      *   **User:** Owner of a small type foundry (4 people: owner, 2 designers, 1 junior).
      *   **Problem:** Recurring fights in design reviews about glyph identity ("Is that still an 'a'?").
      *   **Constraints:** Needs a *procedure*, not an essay. Must be runnable by a junior in ~10 mins with printouts, no theory background.
      *   **Key Requirements:**
          *   Distinguish three failure modes: Legibility (not an 'a'), Distinction (collides with o/d/q/g), Consistency (doesn't fit the family).
          *   Include a "deformation test" (continuous transformation from canonical form).
          *   Handle homoglyphs (Latin 'a' vs. Cyrillic 'а').
          *   Include a fallback for lack of user testing.
          *   Be honest about judgment calls vs. facts.
          *   **Apply the procedure** to three specific cases provided by the user.
          *   **Deliverable:** A one-page handbook version + limitations section.
      *   **Tone:** Professional, pragmatic, direct, slightly technical but accessible to a junior. Acknowledge the Hofstadter reference but keep it practical.

  2.  **Deconstruct the "Is it an 'a'?" Problem:**
      *   *Identity:* What makes an 'a' an 'a'? It's not just shape (Futura vs. Garamond). It's function and recognition.
      *   *Context:* It exists within a system (the font family) and a script (Latin/Cyrillic).
      *   *Process:* Needs to be a checklist or flowchart.

  3.  **Drafting the Procedure (The "Core"):**
      *   *Step 1: Isolation (Legibility).* Can you read it alone?
      *   *Step 2: Context (Distinction).* Does it clash with neighbors?
      *   *Step 3: System (Consistency).* Does it match the rest of the font?
      *   *Step 4: Deformation (The Hofstadter Test).* Can we morph it from a standard 'a'?
      *   *Step 5: Homoglyphs (System Role).* Which script is it serving?
      *   *Decision Points:* Pass, Fail, Escalate to Senior.

      *Refining the "Deformation Test":* The user mentioned Hofstadter. The idea is topological continuity. If I have to break a stroke or close a counter to get from Standard 'a' to Candidate 'a', did I cross a boundary where it becomes something else?
      *Refining the "Fallback":* Since they can't do user testing, they need a "Simulated Reader" test. Use the team as proxies but with specific constraints (distance, time).

  4.  **Addressing the Three Specific Cases:**
      *   *Case 1: Variable Text Face (Heavy Weight).* Counter closes at small sizes.
          *   *Analysis:* At text sizes, if the counter closes, it becomes an 'o' or a blob. At display sizes, it's fine.
          *   *Verdict:* Fail for text, Pass for display. Needs a different master or optical size axis.
      *   *Case 2: Bilingual Brand (Latin 'a' / Cyrillic 'а').*
          *   *Analysis:* Latin 'a' usually has a tail. Cyrillic 'а' is usually single-story (like 'o' with a tail or just an 'o' shape). If they share *one* glyph, it's usually the single-story form. But if the Latin requires a double-story for identity, they conflict.
          *   *Verdict:* Homoglyph handling. If the shape is the single-story 'ɑ', it works for Cyrillic. Does it work for Latin? Yes, in sans. If it's double-story, it fails Cyrillic. The procedure needs to flag the *role*.
      *   *Case 3: Founder's "Signature a".* Detached bowl, swirl.
          *   *Analysis:* High risk of legibility failure. High risk of consistency failure.
          *   *Verdict:* Likely Fail on legibility/consistency. Escalate to Owner for "Brand vs. Type" decision.

  5.  **Developing the Handbook Page:**
      *   Needs to be concise.
      *   Checkboxes.
      *   Clear "Stop" points.

  6.  **Addressing the Limitations:**
      *   Procedure checks *identity*, not *quality*.
      *   Procedure checks *internal consistency*, not *market fit*.
      *   Procedure struggles with new scripts (no established norms).

  7.  **Iterative Refinement (Self-Correction during drafting):**
      *   *Critique:* Is the deformation test too abstract for a junior?
      *   *Fix:* Make it physical. "Draw the intermediate steps." If you can't draw the morph without it looking like an 'o' in the middle, the path is broken.
      *   *Critique:* The user wants to know where *they* need to step in.
      *   *Fix:* Clearly mark "Escalation Points."
      *   *Critique:* The homoglyph issue is tricky.
      *   *Fix:* Define the "Script Tag" rule. The shape doesn't decide; the encoding/context decides. But the shape must support the role.

  8.  **Finalizing the Output Structure:**
      *   **Introduction:** Acknowledge the Hofstadter insight (it's a functional role, not just a shape).
      *   **The Procedure (G.A.T.E. Method):** Give it a name so it's sticky. Glyph, Alphabet, Transformation, Environment.
      *   **Application to Cases:** Run the three scenarios through the G.A.T.E. method.
      *   **The Handbook Page:** The condensed version.
      *   **Limitations:** The "What this doesn't do" section.

  9.  **Writing the Content (incorporating the "Voice"):**
      *   Keep it authoritative but collaborative.
      *   Don't hide the subjectivity.
      *   Ensure the "Signature a" verdict is honest (it's probably a logo, not a glyph).

  10. **Final Review against constraints:**
      *   10 minutes? Yes, if printouts are ready.
      *   No theory background? Yes, instructions are actionable.
      *   Three failure modes covered? Yes.
      *   Deformation test included? Yes.
      *   Homoglyphs covered? Yes.
      *   Fallback for testing? Yes (The "5-Second Squint").
      *   Judgment calls flagged? Yes.

  *(Self-Correction on the "Signature a"):* I need to be careful not to just say "it's bad." I need to say "The procedure flags it as high risk/failed legibility, requiring owner override." That respects the hierarchy while maintaining the integrity of the test.

  *(Self-Correction on Homoglyphs):* The prompt asks if there's a case where it answers "both" or "neither".
  *   *Both:* Yes, a single-story 'a' can serve both Latin and Cyrillic.
  *   *Neither:* If the shape is too ambiguous, it might fail to be a legible 'a' in Latin *and* look like a 'o' in Cyrillic.
  *   *Procedure:* Must define the *intended* script first.

