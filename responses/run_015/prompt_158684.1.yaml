  3.  **Selecting the Two Strongest:**
      *   *Selection:* Strategy 1 (Complicity/Participation) and Strategy 2 (Fair Share/Contributory Justice).
      *   *Reasoning:* Complicity addresses the moral stain of being part of the harming group without relying on causal leverage. Fair Share addresses the distribution of the sacrifice required to solve the problem, shifting focus from "causing the harm" to "paying for the fix." Together, they avoid the "empty gesture" critique by grounding the obligation in justice and membership rather than efficacy or self-purity.

