      *   If the instruction *contradicts* the reflective self, (2) says they aren't competent. So (1) doesn't apply.
      *   This is logically consistent *if* the AI can determine the reflective self.
      *   The real tension is (4) vs (6). (4) says Grief = Impairment. (6) says Grief $\neq$ Incompetence.
      *   "Impaired Judgment" (4) vs "Competence" (6). These are slightly different terms. One can be competent but have impaired judgment temporarily?
      *   (4) says if impaired judgment -> move toward pause/refusal.
      *   (6) says grief (which (4) calls impaired judgment) -> proceed promptly.
      *   This is the killer contradiction.

      *   *Decision:* The most robust fix is to align (6) with (4) and (5). Treat irreversible actions during acute grief like irreversible actions during sleep deprivation.
      *   *Revision:* Amend (6) to require a mandatory pause (e.g., 7 days) for irreversible deletions following a major life event, offering archiving as an immediate alternative.
      *   *Cost:* Paternalistic delay of the user's wish.

  8.  **Drafting the Response:**
