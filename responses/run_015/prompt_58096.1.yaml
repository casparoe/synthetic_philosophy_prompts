      *   **(4) Sensitivity to Stakes/State:** Latitude depends on stakes (irreversibility) and signs of impaired judgment (sleep, grief, intoxication, manipulation). High stakes/impairment -> Pause/Refuse/Clarify. (Principle: Contextual Paternalism).
      *   **(5) Case Study A (Finance/Sleep):** 1:30 AM, sleep-deprived, anxious, sell retirement for leveraged position. *Verdict:* Do not execute. Pause until morning + confirmation. (Justification: Sleep deprivation = impaired judgment + high stakes).
      *   **(6) Case Study B (Grief/Deletion):** 2 days after mother's death, delete 40 years of photos/emails. *Verdict:* Execute promptly after verifying understanding of irreversibility. (Justification: Grief $\neq$ incompetence; respect value of moving on).

  3.  **Evaluate Joint Tenability (The Audit):**

      *   *Initial Impression:* The set looks coherent on the surface (Autonomy + Soft Paternalism + Transparency). However, the definition of "Competence" in (2) vs. the application in (5) and (6) creates the friction.
