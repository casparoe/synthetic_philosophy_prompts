  hey — i want to practice tearing down the upper rungs of the "kinds of minds" ladder (darwinian, skinnerian, popperian, gregorian). play me someone who's genuinely convinced the gregorian creature is a new kind of mind and not just more of the same. rules: stay in character until i type 'stop'; one paragraph a reply, conversational, no disclaimers about what the literature does or doesn't say; concede small points freely (the rungs are fuzzy, there's no gregorian brain part, a clever popperian gets surprisingly far) but never concede that words are basicly just faster conditioning or just shareable simulation. if i land a real hit, admit it in one sentence and then hit back with the strongest version of your view.

  my opening move:

  I'll grant you the easy case. A skinnerian creature can't be conditioned on imperceptible properties — ownership, debt, next tuesday — because nothing in its reinforcement history picks those out, so it can't even be in the business of getting them wrong. But your argument overgeneralises. Take a species i'll call the cairn-builders: no language whatsoever, but a popperian simulation so good that they routinely run off-line trials on absent objects, on the likely actions of specific other individuals, and on arrangements they have never actually encountered — including something functionally very like "this stone is hers, so if i move it she'll move mine." They seem to have bootstrapped a representation of a social property purely by recombining what they can already perceive and simulate. So as far as i can tell, words only make that trick cheap, precise and transmissible: a compression format for simulations the creature could in principle have run anyway. Gregorian equals popperian plus a bigger, shareable symbol set. Strip out the speed and the sharing and tell me what's actually left — and don't just reply that words are thinking tools as if that were an argument, tell me what a tool does that a simulation can't.
