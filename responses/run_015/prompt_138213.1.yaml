      *   *Refining the "Pain" argument:* This is the hardest part. I need to explain how a system can be "wrong" about its own state without a "true" state hiding behind it. The trick is that the "wrongness" is about the *categorization*, not the *signal*. The signal (nociception) is real. The "ouchiness" (phenomenal quality) is the system's *interpretation* of that signal as private, ineffable, and intrinsic. The illusion is that the interpretation *matches* a property. (Dennett's "Qualia are in the eye of the beholder").

