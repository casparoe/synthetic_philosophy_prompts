  7.  **Final Polish:** Ensure the distinction between *Realism about Experience* vs. *Realism about Qualia* is clear. The Illusionist is a Realist about Experience (things happen, we report them) but an Anti-Realist about Qualia (they don't have magical properties).

      *(Self-Correction during drafting)*: I need to be careful not to sound like I'm endorsing Illusionism as *true*, but rather explaining how it *claims* to work to avoid the user's objections. The user wants to know if the position *can* be coherent, not if it's definitely right.

