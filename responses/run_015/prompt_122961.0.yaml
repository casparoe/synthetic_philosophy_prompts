  You've put your finger on the distinction between the origin of a convention and its persistence, which is exactly where people tend to get confused. Think of salience as the spark that starts the engine, not the fuel that keeps it running. In your North and South villages, the worn path was what Schelling calls a focal point—it grabbed everyone's attention simultaneously without any agreement needed. But once the pattern is established, the physical track becomes irrelevant. What keeps the convention alive after the bulldozers come is not the dirt, but the common knowledge of expectations. I keep left because I expect you to keep left, and I know you expect me to. The precedent itself becomes the new salient feature. So salience did real work, but only to solve the very first coordination problem. After that, the habit sustains itself.

  As for the third village, they illustrate the necessity of that initial alignment. Without a focal point to correlate their expectations, they remain in deadlock because neither side can guess what the other will guess. Now, to your question about falsification: my account would fail if you found a convention that wasn't arbitrary—if keeping left was actually safer than keeping right for some physical reason—or if people coordinated without expecting others to conform. Regarding that first worn path: you're right to demand I don't just push the buck back to another convention. The initial salience doesn't need a rule; it needs a psychological prominence. Perhaps the first cart driver was left-handed, or the sun glare favored one side that morning. It doesn't matter why it was noticeable, only that it was noticeable enough to align expectations once. After that, the history takes over.
