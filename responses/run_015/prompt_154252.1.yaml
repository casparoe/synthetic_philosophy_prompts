answer: |-
  **MEMORANDUM**

  **TO:** Academic Standards Committee, Faculty of Health Sciences
  **FROM:** [Your Name/Position]
  **DATE:** October 26, 2023
  **SUBJECT:** Decision Regarding AI Decision-Support in Advanced Clinical Practice Assessments

  This memo seeks a committee decision on the retention and modification of assessment standards for the Master's programme in Advanced Clinical Practice, specifically concerning the use of AI clinical decision-support tools. We must resolve the tension between authenticating practice-ready performance and ensuring the underlying cognitive competence required by our award descriptor. The following analysis assumes familiarity with the recent assessment office sub-study, the faculty note invoking Plato's *Meno*, and the current regulatory landscape.

  **The Case for Maintaining the Status Quo**

  Before proposing a path forward, I must articulate the strongest case for the opposite recommendation: that we should retain the current policy without the perturbation standard. The analogy offered by our colleague regarding instrument-rated pilots is robust. Modern aviation safety relies on automation; pilots trained exclusively on manual controls are not necessarily safer than those trained to manage systems. If the clinical environment of our graduates will invariably include decision-support tools, assessing them without such tools may measure an obsolete skill set rather than relevant competence. The sub-study shows heavy users perform better *with* the tool, which is the condition of their future practice.

  Furthermore, we must address the concern of credential drift. Is the award ceasing to track what it used to track a real harm, or merely nostalgia for a previous mode of practice? If employers continue to trust our graduates because they deliver safe patient outcomes using available tools, the external value of the credential remains intact. To insist on unaided reasoning boundaries might be an academic preference for purity over a professional commitment to safety. If the tool prevents error, the inability to articulate the theoretical boundary of that error might be a tolerable trade-off. The harm of credential drift is real only if the award promises a specific cognitive architecture that is no longer delivered; if the promise is solely safe practice, and safety is maintained or enhanced, the drift is functional adaptation, not degradation. However, this argument collapses if the tool fails or if the award descriptor explicitly promises accountability that cannot be fulfilled by proxy.

  **Load-Bearing Considerations**

  The following considerations are load-bearing for this recommendation: the university award descriptor's existing clause requiring graduates to account for decisions to colleagues and patients, which remains unfulfilled by tool-reliant students; the evidence that heavy users cannot detect when the tool is wrong; and the feasibility of designing assessments that isolate reasoning from language fluency. I am setting aside as undecidable at this stage the long-term safety comparison between tool-reliant and manual practitioners (the pilot analogy), as we lack longitudinal data, and the specific outcome of the national regulator's consultation, as our academic standard must exceed minimum licensing floors regardless of their ruling.

  **Recommendations**

  I recommend the committee adopt the perturbation standard in a modified form, effective immediately for incoming cohorts and with a transition pathway for current students. We should not wait for the regulator. Our award descriptor already mandates accountability; waiting for external permission to enforce our own standards undermines faculty autonomy and risks non-compliance with our own published descriptors.

  **1. Adoption of the Perturbation Standard**
  We must adopt the requirement that candidates state what change in presentation would alter management and flag incorrect tool recommendations. This ensures the "tether" Plato's *Meno* describes is present. However, to address the validity concern regarding oral assessments, this component must not be exclusively oral.

  **2. Administration and Language Fluency**
  To ensure we test boundary reasoning rather than English fluency or speech accommodations, the perturbation component should be administered via a structured written annotation task or a selected-response format integrated into the clinical station. Candidates could be required to highlight specific data points in the patient record that would trigger a management change or select from a menu of potential perturbations. This isolates the clinical logic from the verbal performance. The oral examination should remain for general case discussion, but the specific "boundary question" must be assessed through a modality accessible to students with language profiles or speech accommodations.

  **3. Current Cohort Treatment**
  For the twenty-three mid-programme students, full retroactivity is unjust as they were admitted under different expectations, but no retroactivity creates an immediate two-tier standard that devalues the award. I recommend a transitional compromise: these students must meet the perturbation standard, but they will be provided with explicit training modules on tool limitations immediately. Their assessment of this standard will be formative initially, with a summative requirement only at the final exit point. This respects their contractual expectation while ensuring no graduate leaves without meeting the new competency threshold. We cannot certify students who cannot account for their decisions, regardless of admission year, but we must scaffold their path to get there.

  **4. Regulatory Scenarios**
  Regarding the national regulator:
  *   **If the regulator permits AI in licensing:** We remain aligned, but our standard is higher. We certify not just tool usage, but tool oversight.
  *   **If the regulator bans AI in licensing:** We are already aligned and ahead. Our graduates will be uniquely prepared for both aided and unaided environments.
  *   **If the regulator delays:** We proceed regardless. Our timeline is dictated by the academic year and the award descriptor, not the licensing body's consultation schedule. Waiting creates uncertainty for students and faculty alike.

  **Conclusion**

  This proposal balances the necessity of modernizing practice with the integrity of the academic award. It acknowledges the safety benefits of decision support while refusing to certify graduates who cannot recognize when that support fails. By modifying the assessment modality, we protect against bias; by transitioning the current cohort, we protect against inequity; and by acting now, we protect the faculty's authority to define its own standards. I request the committee's approval to draft the specific assessment rubrics based on these principles for review at the next meeting.
