answer: |-
  Here is the specification list for a multidimensional theory of translation adequacy. It is designed to replace verdicts with accounting.

  ### Desiderata for a Multidimensional Translation Theory

  **1. Vector Separation (No Collapsing)**
  *   **Requirement:** The output must be a profile of distinct vectors (e.g., Semantic, Prosodic, Pragmatic, Cultural), not a single scalar value (e.g., "90% accurate" or "Successful").
  *   **Case:** A technical manual and a limerick can both be "perfect" translations by different metrics. Collapsing them into one score forces a false comparison.
  *   **Status:** **Non-Negotiable.** This is the core architectural constraint. Without it, you return to vibes.

  **2. The Compensation-Licensing Condition**
  *   **Requirement:** A loss in Vector A can only be "compensated" by a gain in Vector B if Vector B performs the same *structural function* in the target text that Vector A performed in the source. Decorative additions that do not restore a disrupted system are "bribes."
  *   **Case:** If you drop end-rhyme (which creates closure), you cannot compensate with a pretty metaphor in line 3 (which creates imagery). You must compensate with a rhythmic stop or alliterative bind at the line-end.
  *   **Principle:** **Functional Conservation of Constraint.** The "currency" of compensation must match the "debt" of the loss.
  *   **Status:** **Non-Negotiable.** This distinguishes trade-offs from indulgence.
  *   **Sub-clause (Betterment):** A translation is "better" than the original only if it achieves the source's *intended function* with higher efficiency or density due to target-language affordances, without violating other vectors.
  *   **Sub-clause (Incommensurability):** Two translations are incommensurable if they maximize orthogonal vectors (e.g., one maximizes Semantic Precision, the other Prosodic Mimicry) such that improving one degrades the other.

  **3. The Untranslatability Threshold**
  *   **Requirement:** The theory must identify points where the cost of preservation exceeds the capacity of the target system, marking them as "Structural Loss" rather than "Translator Error."
  *   **Case:** A pun relying on homophones that do not exist in the target language. If no functional equivalent exists, the theory must output "Untranslatable" rather than forcing a weak approximation.
  *   **Status:** **Non-Negotiable.** Distinguishes impossibility from laziness.

  **4. Source Ontology Alignment**
  *   **Requirement:** The theory must define what constitutes the "Source." Is it a fixed string, a distribution of variants, or a performance? Fidelity is measured against this definition.
  *   **Case:** A folk ballad with 40 variants requires fidelity to the *narrative core*, not a specific line. A sacred text may require fidelity to the *graphemes* themselves. A contract requires fidelity to the *legal effect*.
  *   **Status:** **Non-Negotiable.** You cannot measure fidelity without defining the object.

  **5. External Constraint Budgeting**
  *   **Requirement:** Hard physical limits (subtitling space, dubbing lip-flap, technical safety margins) must be modeled as independent variables that license deviation.
  *   **Case:** Subtitles *must* cut text to meet reading speed. A theory that penalizes this cut as "infidelity" is defective. The cut is a budget expense, not a fidelity failure.
  *   **Status:** **Non-Negotiable.** Engineering constraints are not artistic choices.

  **6. Sociolinguistic Isomorphism (Not Equivalence)**
  *   **Requirement:** The theory must map *social function*, not just grammar. If the source uses a dialect to mark class, the target must mark class, even if the specific dialect doesn't match geographically.
  *   **Case:** Translating working-class Glasgow speech into working-class Brooklyn speech. They aren't the same, but they do the same work. If the target language lacks a class-marked register, the theory must flag this as a "Systemic Gap."
  *   **Status:** **Non-Negotiable.** Register is content.

  **7. Linguistic Equality Constraint**
  *   **Requirement:** The theory must operate on the axiom that no language is inherently cruder or more subtle than another. Differences are structural, not hierarchical.
  *   **Case:** Claiming German is "more philosophical" or French is "more precise" biases the fidelity metric.
  *   **Status:** **Hard Constraint.** This is not etiquette; it is a control variable. If you allow linguistic hierarchy, your fidelity metric becomes racist/nationalist pseudoscience.

  **8. Scope of Modality**
  *   **Requirement:** The theory should ideally cover intralingual (modernizing Chaucer) and intersemiotic (poem to music) translation, but may scope to interlingual if explicitly bounded.
  *   **Case:** Updating a dosage instruction from 1950 to 2024 English is a translation act. Excluding it limits the theory's utility but doesn't break it.
  *   **Status:** **Prejudice of Scope.** Restricting to interlingual is legitimate for a specific tool, but a *general theory* of translation must include intralingual.

  ---

  ### Impossibility Theorems (Conflicting Desiderata)

  You suspected trilemmas. You were right. Here are the subsets of desiderata that cannot be jointly satisfied.

  **1. The Trilemma of the Text**
  *   **Conflict:** **Semantic Precision + Formal Mimicry + Native Fluency.**
  *   **Explanation:** You can have literal accuracy and form (sounding foreign), or literal accuracy and fluency (losing form), or form and fluency (losing literal accuracy). You cannot have all three.
  *   **Resolution:** The theory must force the user to weight the vectors. It cannot solve this; it can only report the casualty.

  **2. The Temporal Split**
  *   **Conflict:** **Authorial Intent (Past) + Reader Effect (Present).**
  *   **Explanation:** Being faithful to what the author was *up to* (historical context) often requires footnotes or archaic language, which destroys the experience of what the text *did* to its first readers (immediate impact).
  *   **Resolution:** The theory must distinguish "Archaeological Fidelity" from "Phenomenological Fidelity." They are often mutually exclusive.

  **3. The Sacred/Secular Paradox**
  *   **Conflict:** **Verbatim Sanctity + Functional Comprehension.**
  *   **Explanation:** In sacred texts, the *words* are often the object of worship (Verbatim). In communication, the *meaning* is the object (Functional). If the words are untranslatable (e.g., *Amen*, *Om*), functional comprehension fails.
  *   **Resolution:** Requires a "Sanctity Vector" that overrides the "Comprehension Vector."

  **4. The Fluid Source Problem**
  *   **Conflict:** **Fixed Fidelity + Variable Source.**
  *   **Explanation:** If the source is a folk tradition or an LLM output with no fixed state, "fidelity to the text" is a category error.
  *   **Resolution:** Requires shifting the object of fidelity from "Text" to "Process" or "Distribution."

  ---

  ### The Single Most Eliminative Requirement

  **Requirement 1 (Vector Separation / No Collapsing).**

  **Why:** 90% of existing translation theory, criticism, and pedagogy is designed to produce a verdict (Good/Bad, Faithful/Unfaithful, Domesticating/Foreignizing). By forbidding a single score, you eliminate all prescriptive theories (Nida, Newmark, etc.) as *complete* systems. They can become *modules* within your system, but they cannot be the system itself. This requirement forces a shift from **Judgment** to **Cartography**.

  ---

  ### Scorecard

  **The Letter-Fidelity Camp (Nabokov)**
  *   **Performance:** Maximizes Semantic Precision and Source Ontology. Fails Native Fluency and often Reader Effect.
  *   **Verdict:** High fidelity on the "Artifact" vector, zero fidelity on the "Experience" vector. Legitimate only if the goal is study, not reading.

  **The Reader-Experience Camp (Nida)**
  *   **Performance:** Maximizes Reader Effect and Native Fluency. Fails Formal Mimicry and often Authorial Intent (historical).
  *   **Verdict:** High fidelity on the "Function" vector. Risks "Smuggling" (adding clarity that wasn't there). Legitimate for instruction or propaganda, suspect for art.

  **The Form-Fidelity Camp (Hofstadter)**
  *   **Performance:** Maximizes Formal Mimicry and Prosodic Structure. Often sacrifices Semantic Precision and sometimes Native Fluency.
  *   **Verdict:** High fidelity on the "Music" vector. Relies heavily on the Compensation-Licensing Condition to justify semantic drift. Legitimate for poetry, dangerous for contracts.
