answer: |-
  The phenomenology of emotional life is predominantly episodic. We speak of bursts of anger, flashes of fear, or waves of grief, suggesting that emotions are occurrent events happening at specific times. However, a significant portion of our emotional existence is not episodic but standing. One can love a spouse, resent a sibling, or dread a diagnosis for years without continuously experiencing the visceral heat of these states. This creates the standing-emotion problem: an adequate theory must explain what it means to possess an emotion during the intervals between episodes. The three standard families of theory—feeling, perceptual, and judgement theories—typically offer a dispositional reply: a standing emotion is merely a disposition to undergo the relevant occurrent episode. While this move appears available to all three, a closer examination reveals that it breaks the symmetry between them, ultimately undermining the feeling theory while leaving cognitive accounts intact.

  The first consideration is symmetry and discrimination. Superficially, the dispositional move seems theory-neutral. A feeling theorist says standing resentment is a disposition to feel bodily changes; a judgement theorist says it is a disposition to assent to the proposition that one was wronged. However, the content of these dispositions differs radically, and this difference matters for discrimination. To resent a sibling is not merely to be disposed to physiological arousal; it is to be disposed to arousal *in response to the sibling*. Feeling theories struggle to ground this intentional specificity in the disposition itself. A disposition to have a racing heart is not inherently about a sibling unless coupled with a cognitive representation of that sibling. By relying on a disposition to feel, the feeling theorist must borrow intentional content from outside the theory to explain what the disposition is *about*. In contrast, the judgement theorist's disposition is intrinsically intentional; a disposition to judge "my sibling wronged me" contains its own object. Thus, the dispositional move costs the feeling theory more, as it fails to explain the individuation of standing emotions without covertly appealing to cognitive states.

  Secondly, we must consider correctness conditions. Standing emotions are assessable for intelligibility and proportion. A decades-long resentment over a trivial slight is irrational, even if no anger is currently felt. This assessability is traditionally used to argue against feeling theories, as bodily feelings are not true or false, whereas judgements and perceptions can be accurate or inaccurate. The standing case amplifies this objection. In an episodic case, one might argue that the feeling itself carries a sense of rationality. But in a standing case, where no feeling is present, the rationality must reside in the state itself. If standing resentment is just a disposition to feel, it is unclear how a mere potential for physiology can be irrational. Physiology is not irrational; only the context or the evaluation rendering that physiology appropriate can be. A disposition to judge, however, is readily assessable; one can be disposed to affirm a falsehood. Therefore, the standing-emotion problem strengthens the argument that emotions must have cognitive content to sustain rational assessability during dormancy, a requirement feeling theories cannot meet.

  Third, we face the issues of finks, masks, and the merely hypothetical. Dispositional analyses are vulnerable to cases where the manifestation is prevented. Suppose a person genuinely resents her sibling but takes medication that flattens all bodily arousal. She never feels the episode, yet we would intuitively say she still resents him. For the feeling theorist, if the emotion is constitutively a disposition to feel, and the feeling is physiologically impossible, the disposition is destroyed or the claim is false. The feeling theorist must argue counterfactually: "she would feel if not for the medication." But this relies on a test condition that is physically blocked. The judgement theorist faces similar masking issues regarding assent, but these are less absolute. One can be disposed to judge something true even if one is temporarily unable to articulate it, whereas the link between resentment and specific bodily patterns is more contingent. If the manifestation of the disposition is entirely severed from the state's identity, the dispositional analysis falters. However, the feeling theory is more vulnerable here because the link between emotion and specific bodily feelings is empirically contestable, whereas the link between emotion and evaluation is conceptual. If the mask removes the feeling entirely, the feeling theorist loses the emotion; the judgement theorist retains the evaluative stance.

  Finally, the analogy with standing belief illuminates the functional nature of standing states. The occurrent/standing distinction in emotion mirrors that in belief. We do not occurrently think all our beliefs at once, yet we possess them. Beliefs are typically analyzed functionally or as cognitive dispositions, not as dispositions to have sensory experiences. If standing emotions are structurally analogous to standing beliefs, they should be treated as states with a functional role in reasoning and behavior, rather than dispositions to sensation. The feeling theory assimilates emotions to sensations (like itches or pains), which do not typically exist as standing states in the same way; one does not have a "standing itch" that persists without sensation for months. The judgement and perceptual theories, by aligning emotions with evaluative beliefs or perceptions, fit the belief analogy much better. This suggests that the standing-emotion problem is not merely a puzzle about duration but a clue about category: emotions are functional states akin to beliefs, not sensory episodes.

  Weighing these considerations, the dispositional reply does not save the feeling theory. While all three theories can invoke dispositions, the nature of the disposition required to explain standing emotions—specifically their intentionality, rational assessability, and resilience to physiological masking—aligns with cognitive structures, not bodily feelings. The standing-emotion problem demonstrates that the core of an emotion lies in its evaluative orientation toward the world, which persists even when the body is quiet.

  The standing-emotion problem refutes feeling theories because only a cognitive disposition can preserve the intentional content and rational assessability inherent in long-term emotional states.

  refutes-feeling-theories
