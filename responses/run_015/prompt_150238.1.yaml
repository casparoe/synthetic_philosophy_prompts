answer: |-
  This is a profoundly ambitious artistic undertaking, but from the standpoint of semiotics and the history of logical positivism, the answer to your question is decisive: **Neurath's framework implicitly requires linguistic (or at least conventional) context to stabilize meaning.**

  While your intuition regarding the *Tractatus* is historically grounded—Neurath was a central figure in the Vienna Circle, which was deeply influenced by early Wittgenstein—your conclusion that ISOTYPE eliminates interpretive ambiguity or functions as a purely language-independent truth-machine is a common misconception of Neurath's actual praxis.

  Here is a breakdown of why a novel composed *entirely* of ISOTYPE-style icons would struggle to transmit precise scientific or moral truths without verbal mediation, and where the philosophical friction lies.

  ### 1. The Myth of "Natural" Representation
  You suggest that ISOTYPE symbols function as "direct, language-independent representations." Neurath did hope for a "visual language" that could transcend spoken tongues, but he did not believe the symbols were natural or self-evident. They were **conventional**.

  *   **The Legend Problem:** An ISOTYPE symbol (e.g., a stylized silhouette of a worker) does not inherently mean "worker." It acquires that meaning through a legend or key, which is invariably linguistic or numeric. Without a key establishing that *one icon = 1,000 people* versus *one icon = one person*, the symbol is ambiguous.
  *   **The Code:** ISOTYPE is a code, not a mirror. To read it, one must learn the syntax. If your novel lacks a "legend" (which would be verbal), the reader is left to guess the scale and category of the symbols. This reintroduces the very ambiguity Neurath sought to minimize.

  ### 2. Empirical States vs. Moral Truths
  Neurath's system was designed for **statistics and empirical data** (housing units, tons of coal, incidence of disease). It was built to show *quantities* and *relations of fact*, not *qualia* or *normative values*.

  *   **Scientific Truths:** You might successfully depict empirical states (e.g., "Factory A produces more than Factory B"). However, even scientific precision requires units of measurement. A row of ten coal icons means nothing without knowing if they represent tons, kilograms, or cartloads. That definition requires language.
  *   **Moral Truths:** This is the greater hurdle. ISOTYPE can show a slum; it cannot show *injustice*. It can show a hospital; it cannot show *care*. Moral truths rely on intentionality, internal states, and causal reasoning (e.g., "The owner *exploited* the worker"). Pictograms depict static existence; they struggle with abstract relations like exploitation, freedom, or guilt. To convey morality, you need narrative causality, which usually requires syntax (verbs, tense) that pictograms lack.

  ### 3. The *Tractatus* Misalignment
  You reference Wittgenstein's *Tractatus Logico-Philosophicus* ("The world is the totality of facts, not of things"). While Neurath and Wittgenstein moved in the same circles, ISOTYPE is not a direct implementation of the *Tractatus* picture theory.

  *   **Logical Form vs. Pedagogical Simplification:** Wittgenstein's "picture theory" posits that a proposition shares a *logical form* with the state of affairs it depicts. ISOTYPE, however, relies on **simplification and transformation**. Neurath explicitly argued for transforming complex data into memorable visuals. This transformation process involves selection and omission, which introduces the curator's bias.
  *   **Physicalism:** Neurath was a "physicalist." He believed all meaningful statements must be reducible to physical descriptions. However, he recognized that without a unified scientific language (which was verbal/logical), the visuals remained illustrative rather than propositional.

  ### 4. The Narrative Deficit
  A novel requires **temporality** and **syntax**.
  *   **Tense:** How do you distinguish "The man died" from "The man is dying" or "The man will die" using only static icons? Comic strips solve this with speech bubbles (text) or motion lines (conventions that are not universal).
  *   **Negation:** How do you depict "The man did *not* go to the factory"? ISOTYPE has no standard symbol for logical negation.
  *   **Interiority:** A novel often lives in the mind of the character. ISOTYPE is behaviorist; it shows external actions. It cannot depict doubt, memory, or irony without established cinematic conventions (which are themselves a visual language requiring learning).

  ### 5. Neurath's Own Practice
  It is crucial to note that Neurath never produced ISOTYPE charts without accompanying text. The *Vienna Method of Pictorial Statistics* was always part of a larger exhibition or publication where captions, titles, and legends anchored the visuals. Neurath understood that the image captures attention, but the text stabilizes the concept.

  ### Conclusion for the Novelist
  If you proceed with this project, you should not expect it to function as a vehicle for **precise scientific or moral truth** in the Neurathian sense. Instead, you will be creating a work of **concrete poetry** or **visual literature**.

  *   **The Ambiguity is the Art:** The "failure" of the icons to transmit precise meaning without text is where the literary tension will lie. The reader's struggle to interpret the sequence *becomes* the narrative.
  *   **Reframing the Goal:** Do not aim for the elimination of ambiguity (which is impossible). Aim for the *polysemy* of the symbols. Let the icons resonate differently for different readers.
  *   **The Verdict:** Neurath's framework does not support the idea that visuals can stand alone as precise propositional truth. Meaning is stabilized by convention, and convention is ultimately linguistic.

  Your novel would be a fascinating experiment in the *limits* of language, proving that even when we strip away words, we cannot strip away the need for a shared code to make sense of the world. That, in itself, is a profound philosophical statement.
