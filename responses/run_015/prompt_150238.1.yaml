      *Refining the Wittgenstein point:* Neurath actually criticized the metaphysical tendencies of some positivists. He was a physicalist. The *Tractatus* connection is tenuous regarding ISOTYPE specifically. ISOTYPE is more about *encyclopedism* than *logical atomism*.
      *Refining the "Moral" point:* Neurath was a socialist. He wanted to show inequality to spur change. But the *symbols themselves* didn't carry the morality; the *arrangement* did, often guided by text.

  6.  **Final Polish:** Ensure the distinction between "depicting states of affairs" (Tractatus) and "statistical visualization" (ISOTYPE) is clear. Ensure the distinction between "empirical" and "moral" is highlighted.

