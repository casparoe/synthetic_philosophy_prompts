          *   *Addressing the Moral Equivalence Fear:* Explain how to prevent the "both sides" fallacy. The focus shouldn't be on excusing the defendants, but on the evolution of international law.
          *   *The "Unavoidable" Argument:* Incorporate the user's insight. New orders require new laws. The tension between retroactivity and accountability is the *story* of the exhibition, not a bug.
      *   **Specific Conditions (The "How-To"):**
