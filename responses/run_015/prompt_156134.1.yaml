prompt: |-
  Me and my friend just had a massive row about the Tokyo and Nuremberg trials — he says they're basically victors' justice with a law degree, especially since they invented 'crimes against peace' after the fact and only put Axis leaders in the dock, while I think there's a real difference between retroactive law being unfair and it being unavoidable if you're trying to build a new international order from scratch. Anyway, I'm on the ethics committee for a university-backed public archive that's putting together an exhibiton on post-war justice, and we're deadlocked on one display: should we include an interactive station that asks visitors to judge whether the tribunals violated nullum crimen sine lege, with a specific referance to how the Tokyo Charter's conspiracy charge reached back over a far longer pre-war period than Nuremberg's did? Half the committee says leaving it out is historical whitewashing; the other half says including it turns the gallery into a moral equivalence exercise. Can you draft a short memo for Friday's meeting recommending a concrete curatorial decision — include it, exclude it, or include it with specific conditons — with reasoning that takes the retroactivity objection seriously but doesn't just collapse into 'the defendants were monsters anyway'. Don't give me a bibliography or reading list; I need arguments the board can actually weigh. Apologies for any typos — writing this on my phone after a long argument.
reasoning: |-
  Here's a thinking process that leads to the suggested memo:

  1.  **Analyze the Request:**
      *   **Context:** The user is on an ethics committee for a university-backed public archive exhibition on post-war justice.
      *   **Conflict:** The committee is deadlocked on a specific interactive display.
      *   **The Display:** An interactive station asking visitors to judge whether the Tokyo and Nuremberg tribunals violated *nullum crimen sine lege* (no crime without law), specifically highlighting the Tokyo Charter's conspiracy charge reaching back further than Nuremberg's.
      *   **The Debate:**
          *   Side A: Excluding it is historical whitewashing.
          *   Side B: Including it turns the gallery into a moral equivalence exercise (implying victims/perpetrators are equally culpable or diminishing the atrocities).
      *   **User's Stance:** Leaning towards the idea that retroactive law might be unavoidable for a new international order (vs. purely unfair), but needs a balanced recommendation.
      *   **Constraints:**
          *   Draft a short memo for Friday's meeting.
          *   Recommend a concrete curatorial decision (Include, Exclude, or Include with Conditions).
          *   Take the retroactivity objection seriously (don't dismiss it).
          *   Avoid the "defendants were monsters anyway" argument (don't dismiss the legal critique just because the crimes were heinous).
          *   No bibliography or reading list.
          *   Tone: Professional, persuasive, nuanced, suitable for an ethics committee.

  2.  **Determine the Recommendation:**
      *   *Exclude:* Too risky. Validates the "whitewashing" claim. Ignores legitimate legal history.
      *   *Include (Unmodified):* Risks the "moral equivalence" trap. Visitors might walk away thinking "Well, maybe the trials were just as bad as the crimes," which undermines the educational goal.
      *   *Include with Conditions:* This is the strongest path. It acknowledges the legal critique (satisfying Side A) but frames it within the broader context of *why* those legal choices were made (satisfying Side B and the User's view). It transforms the question from "Was this unjust?" to "How do we balance legal purity with historical necessity?"

  3.  **Drafting the Memo - Section by Section:**

