answer: |-
  **MEMORANDUM**

  **TO:** Exhibition Ethics Committee
  **FROM:** [Your Name/Role]
  **DATE:** October 26, 2023
  **SUBJECT:** Recommendation Regarding Interactive Station on *Nullum Crimen Sine Lege*

  **Recommendation**
  I recommend we **include the interactive station, but with strict curatorial conditions** regarding framing and context. Excluding the element risks validating accusations of historical sanitization, while including it without guardrails risks the "moral equivalence" trap. The solution lies in shifting the visitor's task from judging the *defendants* to evaluating the *legal precedent*.

  **Rationale**

  **1. Acknowledging the Legal Critique (Addressing the "Whitewashing" Concern)**
  The objection regarding *nullum crimen sine lege* (no crime without law) is not revisionist; it is a foundational tension in international law. Specifically, the Tokyo Charter's definition of conspiracy reached back significantly further than Nuremberg's, criminalizing actions that were not explicitly illegal under international statutes at the time they were committed. To omit this is to present the tribunals as legally flawless rather than historically groundbreaking. A university archive must model intellectual honesty; acknowledging the legal novelty of the trials strengthens the historical record, even if it complicates the moral narrative.

  **2. Preventing Moral Equivalence (Addressing the "Justice" Concern)**
  The fear that this station implies the trials were "as bad as" the crimes stems from presenting the legal critique in a vacuum. If a visitor concludes that a procedural irregularity invalidates the moral necessity of accountability, the exhibition has failed. However, this failure is one of framing, not content. We must avoid a binary "Just/Unjust" toggle. Instead, the interaction should illustrate the *trade-off* inherent in 1945: the choice between strict legal positivism (which might have let leaders go free) and a new natural law approach (which established accountability but stretched existing statutes).

  **3. The "Unavoidable Innovation" Argument**
  Our exhibition thesis should reflect that the tribunals were not merely applying law, but *creating* a new international order. Retroactivity in this context was not an oversight but a strategic necessity to close the "impunity gap." By highlighting the specific discrepancy between the Tokyo and Nuremberg conspiracy charges, we can demonstrate that the Allies themselves were grappling with how far retroactivity should reach. This nuances the "victors' justice" claim: it shows internal debate and legal evolution rather than a monolithic imposition of will.

  **Curatorial Conditions for Implementation**

  To proceed, the following conditions must be met for the station:

  *   **Contextual Preamble:** The station must open with a brief text explaining that *nullum crimen sine lege* is a protection for individuals against state power, and explaining *why* the prosecutors argued it had to be set aside (i.e., existing laws were insufficient to cover industrialized aggression and genocide).
  *   **Reframed Question:** Do not ask: "Were the trials unfair?" Instead, ask: "In the absence of existing laws for crimes of this magnitude, was creating new legal categories necessary for justice, or a violation of rights?"
  *   **Outcome Visualization:** After the visitor makes a choice, the display should reveal the historical consequence: that these "new" laws became the bedrock of the International Criminal Court. This connects the 1945 legal controversy to modern human rights protections, showing the long-term utility of the precedent.
  *   **Specific Tokyo/Nuremberg Distinction:** The interface must explicitly note the timeline difference in the conspiracy charges. This prevents generalization and forces engagement with the specific historical evidence rather than abstract moralizing.

  **Conclusion**
  Including this station transforms a potential controversy into a pedagogical asset. It allows us to teach visitors that justice is often procedurally messy, especially when emerging from global catastrophe. We can uphold the moral gravity of the atrocities without pretending the legal process was perfect. This approach satisfies the demand for historical rigor without diminishing the necessity of the tribunals.

  I urge the committee to adopt this conditional inclusion for the Friday finalization.
