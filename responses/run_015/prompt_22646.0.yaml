      *   **Grice's View:** Because conversational implicatures depend on the *content* of what is said rather than the specific words, changing the wording usually does not remove the implicature. Therefore, they are **non-detachable**. (Grice does note exceptions regarding the Maxim of Manner, but as a general rule for the seminar, they are treated as non-detachable).
      *   **Student's Definition:** The student defines detachable as *"meaning that the same implicature can be expressed using different words."* This is actually a description of **non-detachability** (the implicature sticks to the content regardless of the words used). The student has observed the correct phenomenon but applied the wrong label.
