answer: |-
  ### Teaching Plan: Dispositions vs. Conditional Rules

  **Session Duration:** 30 Minutes
  **Audience:** 8 Software Engineers (No Philosophy Background)
  **Goal:** Demonstrate that a disposition is an intrinsic causal property, not a logical conditional (if-then rule).

  ---

  ### 1. Sequence of Components & Dependencies

  You must introduce the concepts in this specific order. Each step establishes a necessary premise for the next; skipping one will cause the argument to collapse into "just semantics."

  1.  **The Naive Definition (The "API Contract")**
      *   **Content:** Define a disposition (e.g., fragility, solubility) using the *Simple Conditional Analysis (SCA)*. "To be disposed to $M$ when stimulated by $S$ just means: If $S$ happens, $M$ will happen."
      *   **Dependency:** You must start here because this is the intuitive model your audience already holds. It establishes the baseline "If-Then" rule you intend to break.
      *   **Time:** 0:00–0:05

  2.  **The Carrying Example (The "Secure Enclave Chip")**
      *   **Content:** Introduce the single concrete object (detailed below). Define its specific disposition, stimulus, and manifestation clearly.
      *   **Dependency:** You cannot demonstrate the failure of the rule (Step 3) without a fixed subject and a fixed expected behavior. This anchors the abstract logic in a concrete system.
      *   **Time:** 0:05–0:10

  3.  **The Breakdown (Fink & Mask)**
      *   **Content:** Show how the *same* stimulus on the *same* object fails the Conditional Analysis in two distinct ways.
          *   *Fink:* The stimulus destroys the disposition before manifestation.
          *   *Mask:* The stimulus is blocked, but the disposition remains intact.
      *   **Dependency:** This depends on Step 1 (to show the rule fails) and Step 2 (to show it fails for the *same* object). It proves the Conditional Analysis is insufficient.
      *   **Time:** 0:10–0:20

  4.  **The Solution (The Categorical Basis)**
      *   **Content:** Explain that the disposition is not the *rule*, but the *intrinsic physical structure* (the "code" or "chemistry") that makes the rule usually true.
      *   **Dependency:** This depends on Step 3. Once you've shown the rule is unreliable, you must offer the alternative: the disposition is the *capacity* (the basis), not the *outcome*.
      *   **Time:** 0:20–0:25

  5.  **The Check**
      *   **Content:** A specific question to verify grasp.
      *   **Dependency:** Depends on Step 4. You can only test if they understand "intrinsic property" after you have defined it against "conditional rule."
      *   **Time:** 0:25–0:30

  ---

  ### 2. The Carrying Example: The "Secure Enclave Chip"

  You must use **one** object to illustrate both failures. Do not use a glass for Finks and a poison for Masks. Use the **Secure Enclave Chip**.

  *   **The Object:** A hardware security module (HSM) embedded in a server.
  *   **The Disposition:** To *output the Secret Key* (Manifestation).
  *   **The Stimulus:** Receiving a valid *Query Command* (Stimulus).
  *   **The Conditional Rule:** "If Queried, then Output Key."

  **How it contains both Fink and Mask:**
  You will describe two firmware configurations for the *same* chip logic under the *same* stimulus.

  1.  **The Finkish Configuration:** The Query Command triggers a tamper-detection routine that **wipes the memory storage** of the Key before the output bus activates.
      *   *Result:* No Key Output.
      *   *Why it's a Fink:* The stimulus (Query) caused the disposition (ability to output Key) to vanish instantly. The "If-Then" rule is false because the property deleted itself.
  2.  **The Masked Configuration:** The Query Command triggers a policy engine that **opens a series gate** on the output pin, but the Key remains safely in memory.
      *   *Result:* No Key Output.
      *   *Why it's a Mask:* The stimulus (Query) was blocked externally/structurally, but the disposition (the Key is still there and ready) remains intrinsic to the chip.

  **Constraints to Prevent Collapse:**
  *   **INCLUDE:** Identical Stimulus (Query Command) and Identical Expected Manifestation (Key Output) for both scenarios. This ensures the *Conditional Rule* is constant, so any failure is due to the *nature of the disposition*, not a change in specs.
  *   **EXCLUDE:** Any mention of "errors," "bugs," or "network latency." If you allow them to think this is a system failure, they will treat it as an exception (see Misconceptions). This must be described as *intended design behavior* that breaks the logical rule.

  ---

  ### 3. Predictable Misconceptions & Interception Points

  Your audience will try to map this to familiar engineering patterns. You must head these off *before* they solidify.

  **Misconception 1: Lazy Evaluation / Thunks**
  *   **The Thought:** "This is just a function that hasn't been called yet. The disposition is a promise."
  *   **Where to Head It Off:** **Step 1 (The Naive Definition).**
  *   **How:** Explicitly state: "A disposition is not a pending computation. A glass is fragile *now*, even if no one ever strikes it. It is a state of being, not a scheduled task."
  *   **Script:** "Do not think of this as a lazy-loaded value. The fragility exists before the strike. The disposition is the *current state*, not the *future return value*."

  **Misconception 2: Exception Handling / Try-Catch**
  *   **The Thought:** "The Mask is just a `catch` block swallowing the return value. The Fink is a `throw`."
  *   **Where to Head It Off:** **Step 3 (The Breakdown - specifically during Mask).**
  *   **How:** Emphasize that in a Mask, the system is functioning *correctly*, not raising an error. The capacity is real but prevented.
  *   **Script:** "This is not an exception. In a Masked case, the chip is healthy. The Key is valid. The output is blocked by a design choice, not a runtime error. If you treat this as an exception, you miss that the *property itself* is still present."

  ---

  ### 4. The Final Check

  At minute 25, stop explaining. Ask this specific question to the group. Do not accept answers that reference behavior or outcomes.

  **The Check Question:**
  > "If I put the 'Masked' Chip in a lead box where it can never be Queried, does it still possess the disposition to output the Key? Why?"

  **Correct Answer Criteria:**
  *   **Pass:** They answer **Yes**, because the *intrinsic structure* (the memory holding the Key) is intact. They reference the **categorical basis** (the physical storage), not the conditional outcome.
  *   **Fail:** They answer **No** (because it can't be tested) or **Maybe** (because it depends on the box). This indicates they still view the disposition as the Conditional Rule (If Query -> Output) rather than the intrinsic property.

  ---

  ### 5. Technical Analogies to Refuse

  At this level, do not use the following analogies. They will reinforce the "programming construct" view you are trying to dismantle.

  1.  **Feature Flags / Toggles:**
      *   *Why Refuse:* This implies the disposition is extrinsic configuration. Dispositions are intrinsic to the object, not set by an external config file.
  2.  **Polymorphism / Interfaces:**
      *   *Why Refuse:* This implies the behavior is defined by a contract. A disposition exists regardless of whether the object implements an interface or is observed.
  3.  **Mocking / Stubs:**
      *   *Why Refuse:* This implies the behavior is "fake" or "simulated." Dispositions are real causal powers, not test doubles.

  **Instruction to Self:** If a colleague says, "So it's like a Feature Flag that turns off the method," you must correct them immediately: "No, a flag changes the code. A disposition is the physics of the silicon that makes the code possible."
