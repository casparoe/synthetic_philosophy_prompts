      *   **Topic:** Daniel Dennett's brain-transplant thought experiment (from "Where Am I?").
      *   **User's Proposal:** Reject the "single answer" framing. Distinguish three tracking systems (substrate, functional, indexical). Propose a variant (gradual replacement + duplication) leading to two sincere first-person reports. Argue for "distributed location" (non-unique first-person location).
      *   **Audience:** Philosophy of mind familiar, but not necessarily experts on indexical tracking.
