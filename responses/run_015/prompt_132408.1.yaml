      *   *Three Trackers:* Substrate (biology), Functional (control center), Indexical (phenomenal "here").
      *   *Variant:* Gradual replacement + duplication (fission) resulting in Bio-Brain (Vat A) and Silicon-Body (Body B). Both claim "I am here."
