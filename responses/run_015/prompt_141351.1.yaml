answer: |-
  **Entry Point:** We begin from the consensus commitment: "A ventilated patient with total loss of clinical brain function, on adequate testing, is dead."

  *   **Node 1: The Permanence Question**
      *   *Case:* Controlled donation after circulatory determination of death (DCD), where asystole follows withdrawal and CPR could restore circulation but will not.
      *   *Question:* Is the patient dead at the moment of asystole, even though circulation could theoretically be restored?
      *   *Rationale:* Distinguishes whether death requires physical impossibility (irreversibility) or merely a decision not to intervene (permanence).
      *   *Branch A (Yes):* Death is permanent loss of function.
      *   *Branch B (No):* Death is irreversible loss of function.

  *   **Node 2: The Consciousness Question**
      *   *Case:* Patient after anoxic injury with neocortical destruction who breathes spontaneously; infant born with hydranencephaly who breathes and reacts.
      *   *Question:* Is a patient who breathes spontaneously and has sleep–wake cycles but lacks consciousness dead?
      *   *Rationale:* Separates the view that death is the loss of the organism from the view that death is the loss of the person.
      *   *Branch A (Yes):* Death is loss of personhood (Higher-Brain).
      *   *Branch B (No):* Death is loss of biological function (Whole-Brain/Organism).

  *   **Node 3: The Integration Question**
      *   *Case:* Ventilated brain-dead patient with preserved neuroendocrine function; brain-dead pregnant patient maintained for weeks.
      *   *Question:* If somatic integration (thermoregulation, gestation) persists, is the body still an integrated organism?
      *   *Rationale:* Tests whether 'integration' requires brain control or merely physiological continuity.
      *   *Branch A (Yes):* Somatic integration sustains life (Organism view).
      *   *Branch B (No):* Brain control defines integration (Brain Death view).

  *   **Node 4: The Dependency Question**
      *   *Case:* Patient on veno-arterial ECMO with no pulse; patient with high cervical spinal cord injury permanently ventilator-dependent.
      *   *Question:* Does vital function sustained entirely by a machine count as the organism's own function?
      *   *Rationale:* Discriminates between natural biological capacity and artificial support.
      *   *Branch A (Yes):* Function is function, regardless of source.
      *   *Branch B (No):* Function must be intrinsic to the organism.

  *   **Node 5: The Temporality Question**
      *   *Case:* Patient in whom extracorporeal perfusion and cooling are begun within minutes of asystole, with structure preserved.
      *   *Question:* Is death an instantaneous event at arrest, or a process completed only after cellular decay?
      *   *Rationale:* Determines whether death is a determinate moment or a gradual transition.
      *   *Branch A (Instantaneous):* Death is an event.
      *   *Branch B (Gradual):* Death is a process.

  *   **Node 6: The Ontology Question**
      *   *Case:* Isolated mammalian brain kept metabolically active by perfusion after organism's death.
      *   *Question:* Is the isolated brain a living organism in its own right?
      *   *Rationale:* Establishes whether the unit of death is the whole body or the conscious part.
      *   *Branch A (Yes):* The brain is the organism.
      *   *Branch B (No):* The body is the organism.

  *   **Node 7: The Criterion Question**
      *   *Case:* General uncertainty in testing (applied to any above).
      *   *Question:* If a perfect test showed residual function, would the patient still be dead by legal criterion?
      *   *Rationale:* Separates the metaphysical reality of death from the legal convention used to track it.
      *   *Branch A (Yes):* Death is a legal convention.
      *   *Branch B (No):* Death is a biological discovery.

  *   **Node 8: The Purpose Question**
      *   *Case:* Contextual shift (procurement vs. inheritance).
      *   *Question:* Should the definition of death change depending on whether we are procuring organs or certifying inheritance?
      *   *Rationale:* Acknowledges that practical goals may dictate different metaphysical thresholds.
      *   *Branch A (Yes):* Death is purpose-relative.
      *   *Branch B (No):* Death is context-invariant.

  **The Leaves: Positions and Awkward Commitments**

  Traversing these nodes locates the familiar positions within the logical space.

  *   **Whole-Brain:** (Nodes 2B, 3B, 4B). *Awkward Commitment:* Must accept that a body maintaining homeostasis via the spinal cord is dead.
  *   **Brainstem:** (Nodes 2B, 3B, 4B). *Awkward Commitment:* Inseparable from Whole-Brain in practice, though theoretically distinct regarding spinal reflexes.
  *   **Higher-Brain:** (Nodes 2A, 6A). *Awkward Commitment:* Must accept that a breathing, pregnant body is a corpse if consciousness is lost.
  *   **Circulatory-Permanent:** (Nodes 1A, 4B). *Awkward Commitment:* Must accept that death is reversible if one changes the decision not to resuscitate.
  *   **Circulatory-Irreversible:** (Nodes 1B, 4B). *Awkward Commitment:* Must accept that most donation after circulatory death is impossible because auto-resuscitation is theoretically possible.
  *   **Organism-As-Integrated-Whole:** (Nodes 3A, 4B). *Awkward Commitment:* Must accept that brain-dead pregnant women are living patients requiring full care.
  *   **Legal-Convention:** (Nodes 7A, 8A). *Awkward Commitment:* Must accept that death is a fiction we agree upon rather than a fact we discover.
  *   **Gradualism:** (Nodes 5B, 7B). *Awkward Commitment:* Must accept that there is no precise time of death for inheritance or criminal law.

  **Practical Purposes and Divergence**

  The tree reveals where four practical purposes pull the committee in different directions.

  1.  **Organ Procurement:** Pulls towards **Circulatory-Permanent** and **Whole-Brain**. The Dead Donor Rule requires a clear line, favouring Node 1A (permanent) and Node 3B (brain control) to maximise viable organs without violating prohibitions on killing.
  2.  **Withdrawal of Treatment:** Pulls towards **Higher-Brain** or **Organism-Integrated**. Families often view consciousness (Node 2) as the vital sign, whereas clinicians may rely on integration (Node 3). Disagreement here stalls ethics consultations.
  3.  **Legal Moment (Inheritance/Criminal Law):** Pulls towards **Event** (Node 5A) and **Context-Invariant** (Node 8B). Law requires a precise timestamp for wills and homicide; Gradualism (Node 5B) creates untenable legal ambiguity.
  4.  **Death Certificate:** Pulls towards **Legal-Convention** (Node 7A). The certificate is an administrative tool; it often records the time of declaration rather than the biological moment, conflating test and criterion.

  **Redundancy and Inseparability**

  Two leaves are functionally inseparable in this instrument: **Whole-Brain** and **Brainstem**. No honest question on this tree separates them clinically, as both rely on the loss of brainstem reflexes for diagnosis despite theoretical differences regarding spinal integration. Additionally, the **Higher-Brain** and **Legal-Convention** views often converge on the same verdicts (declaring PVS patients dead), though for different reasons (ontological vs. pragmatic).

  **Unoccupied Space**

  The combination of **Gradualism** (Node 5B) and **Context-Invariant** (Node 8B) is largely unoccupied. It is incoherent to claim death is a vague process while demanding a single definition for all legal and medical purposes. Similarly, **Circulatory-Irreversible** (Node 1B) combined with **Organ Procurement** is unoccupied because it renders DCD impossible; this position exists only in theory, not in practice.

  This instrument does not tell you which path is true, but it reveals that your verdict on the pregnant brain-dead patient logically constrains your verdict on the DCD donor. You cannot choose your conclusions independently.
