      *   *Hume's Neutrality:* Hume believed money is neutral in the *long run* (prices adjust) but *non-neutral in the short run* (increases in money supply stimulate industry before prices rise). This is a critical nuance often lost in the "oil" simplification.

  3.  **Task 1: Mapping the Analogy:**
