  **Q1: Can the decision to conceive now harm the child who results from it (Child A)?**
  *   **Yes** (Life with condition is worse than non-existence): $\rightarrow$ **Leaf 1**
  *   **No** (Life is worth living; non-existence is not a baseline): $\rightarrow$ *Go to Q2*

  **Q2: Is the decision morally significant at all if no one is made worse off?**
  *   **No**: $\rightarrow$ **Leaf 2**
  *   **Yes**: $\rightarrow$ *Go to Q3*

  **Q3: Is the rightness of the decision a matter of the aggregate or average welfare of the lives that will be lived?**
  *   **Yes (Total/Aggregate)**: $\rightarrow$ **Leaf 3**
  *   **Yes (Average)**: $\rightarrow$ **Leaf 4**
  *   **No**: $\rightarrow$ *Go to Q4*

  **Q4: Is the parents' duty to the particular child they will have or to the class of possible children?**
  *   **Particular**: $\rightarrow$ *Go to Q5*
  *   **Class**: $\rightarrow$ *Go to Q5*

  **Q5: Is there any sense in which the resulting child (or the later alternative) is owed her existence (or a specific quality of it)?**
  *   **Yes (Particular Duty)**: $\rightarrow$ **Leaf 5**
  *   **No (Particular Duty)**: $\rightarrow$ **Leaf 6**
  *   **Yes (Class Duty)**: $\rightarrow$ **Leaf 7**
  *   **No (Class Duty)**: $\rightarrow$ **Leaf 8**

  ***

  ### The Leaves (Moral Positions)

  **Leaf 1: The Threshold View (Wrongful Life)**
  *   **Reasoning:** Conceiving now harms Child A because their life, while worth living, falls below a threshold of "acceptable" welfare compared to non-existence.
  *   **Most Awkward Commitment:** Implies that for some people, it would have been better never to have been born, which can be deeply offensive to those living with disabilities.

  **Leaf 2: The Strict Person-Affecting View (Libertarian)**
  *   **Reasoning:** Morality is only about making specific people better or worse off. Since Child A is not worse off than they would otherwise be (they wouldn't exist), the act is neutral.
  *   **Most Awkward Commitment:** Cannot morally condemn clearly reckless procreation (e.g., knowingly conceiving a child into a life of severe suffering) provided the child is glad to be alive.

  **Leaf 3: Impersonal Total Utilitarian**
  *   **Reasoning:** The right act maximizes the total sum of welfare in the world. Child B's higher welfare adds more to the total than Child A's lower welfare.
  *   **Most Awkward Commitment:** Commits to the "Repugnant Conclusion": a massive population of lives barely worth living is better than a smaller population of very happy lives, if the total sum is higher.

  **Leaf 4: Impersonal Average Utilitarian**
  *   **Reasoning:** The right act maximizes the average welfare per person. Child B raises the average more than Child A.
  *   **Most Awkward Commitment:** Suggests it is morally right to eliminate people with below-average welfare (even if happy) to raise the global average.

  **Leaf 5: Rights-Based Deontologist (Particular/Owed)**
  *   **Reasoning:** Parents have a duty to the particular child to respect their right to an "open future" or minimum health. Child A is owed a healthy start.
  *   **Most Awkward Commitment:** Implies Child A has a right *not* to have been born disabled, which logically entails a right *not* to have been born at all (since they couldn't be born healthy at that time).

  **Leaf 6: Contractualist (Particular/Not Owed)**
  *   **Reasoning:** Duty is to the particular child, but existence isn't "owed." The act is wrong because it violates a principle no one could reasonably reject (e.g., "don't impose avoidable burdens").
  *   **Most Awkward Commitment:** Struggles to explain *who* is wronged if Child A is not harmed; relies on abstract "reasonable rejection" rather than concrete harm.

  **Leaf 7: Procreative Beneficence (Class/Owed)**
  *   **Reasoning:** Duty is to the class of possible children. The later child is owed the best possible start among available options.
  *   **Most Awkward Commitment:** Treats children as projects to be optimized; implies a moral duty to select for the "best" traits (intelligence, height) if technology allows, not just health.

  **Leaf 8: Virtue Ethicist / Prudential (Class/Not Owed)**
  *   **Reasoning:** Duty is to the class (future generations), but no child is "owed" existence. The decision rests on what constitutes "good parenting" or prudence.
  *   **Most Awkward Commitment:** Provides no clear action-guiding rule; two virtuous people could reasonably disagree, making moral adjudication impossible.

  ***

  ### Structural Notes for the Author

  **1. Two Leaves the Tree Cannot Really Separate**
  **Leaf 3 (Total Utilitarian)** and **Leaf 4 (Average Utilitarian)**.
  *   **Why:** In this specific scenario (one child now vs. one child later), the population size is identical. Therefore, maximizing the *total* welfare and maximizing the *average* welfare yield the exact same mathematical result: wait for the healthier child. Your characters holding these positions will argue differently about *why*, but they will always vote the same way on this specific plot point. To distinguish them, you must have them discuss a *different* hypothetical (e.g., overpopulation).

  **2. An Empty Combination of Answers**
  **Q3 = Yes (Aggregate Welfare)** combined with **Q4 = Particular (Duty to Particular Child)**.
  *   **Why:** The tree structure allows a user to theoretically answer "Yes" to Aggregate Welfare but then claim their duty is only to the *particular* child. No one actually occupies this position. If you believe morality is about the *aggregate* welfare of lives, you necessarily accept duties to the *class* of lives (or the total sum), not just the specific individual in front of you. A character who claims both is either confused or lying about their principles.

  **3. Usage Tip**
  Use **Leaf 2 (Strict Person-Affecting)** for a character who seems coldly logical but is actually trapped by consistency; they want to wait, but their philosophy tells them they don't *have* to. Use **Leaf 5 (Rights-Based)** for a character who feels intense moral pressure but struggles to articulate why the child isn't "harmed" in the traditional sense.
