answer: |-
  # PREP SHEET: "One If" Defense
  **Venue:** Language-and-Mind Reading Group
  **Audience:** Formal Semanticists (Kratzerian), Epistemologists, One Psycholinguist
  **Goal:** Survive the Q&A without conceding the core thesis.

  ## PART I: THE EIGHT OBJECTIONS
  *Ordered by likelihood and potential damage.*

  ### 1. The Compositionality/LF Objection (Semanticists)
  **When:** Opening questions or mid-talk during the formalism slide.
  **The Objection:** "You say mood instructs a switch in information state, but where does this live in the Logical Form? Is it a feature on MoodP? If it's a context-shifter, what's its type? If it's $\langle s, \langle st, t \rangle \rangle$, how does it compose with *if* without making *if* itself sensitive to that feature? You risk making *if* polymorphic again."
  **The Reply:** "The instruction is a feature on the Mood head, not on *if*. *If* remains a uniform restrictor (or operator, depending on your preference) over the information state. The Mood head takes the current context $c$ and returns a modified context $c'$. *If* then operates on $c'$. The type is a context-update function. This preserves the lexical unity of *if* while locating the variation in the functional architecture above it."
  **Soft Spot:** The exact type-theoretic implementation. If they press for the lambda calculus, you might stumble if you haven't written it out.
  **Concede:** "The exact type-theoretic implementation is still being refined in the dissertation."
  **Hold:** "*If* itself does not change its lexical entry. The variation is structural, not lexical."

  ### 2. The "Two Modal Bases" Charge (Kratzerians)
  **When:** Mid-talk.
  **The Objection:** "Kratzer already handles this with realistic vs. bouletic/modal bases. Indicatives use a realistic modal base; counterfactuals use a historically accessible one. Aren't you just renaming 'modal base' to 'frozen information state' without gaining explanatory power?"
  **The Reply:** "Kratzer's account requires the *modal* to shift (e.g., *would* vs. null). My claim is that the *conditional relation* itself is invariant. In Kratzer's view, the difference is in the modal operator restricting the worlds. In my view, the difference is in the *temporal location of the evidence* fed into a single operator. This explains why the infelicity of Adams pairs feels like a contradiction: you're trying to run one operation on two incompatible inputs simultaneously."
  **Soft Spot:** Distinguishing your "info state" from Kratzer's "modal base." They are very close cousins.
  **Concede:** "There is significant overlap with the Kratzerian framework regarding world selection."
  **Hold:** "The infelicity of asserting both is a constraint on *evidence*, not just world ordering. My account derives the contradiction; Kratzer's stipulates it."

  ### 3. Truth Conditions vs. Assertability (Epistemologists)
  **When:** Early Q&A.
  **The Objection:** "If the difference is just about which evidence you're allowed to look at, aren't you reducing truth conditions to assertability conditions? Does 'If Oswald hadn't...' have a truth value, or is it just unsupported? If it lacks a truth value, how do you handle embedding under negation or belief?"
  **The Reply:** "I am defending a suppositional view. Conditionals don't have classical truth conditions; they have acceptance conditions relative to an information state. The 'contradiction' in Adams pairs isn't truth-functional contradiction ($\phi \land \neg \phi$), it's pragmatic inconsistency (updating with $p$ then updating with $\neg p$ relative to the same state). This avoids the triviality results that plague truth-conditional accounts."
  **Soft Spot:** Epistemologists often want conditionals to be truth-apt for knowledge ascriptions.
  **Concede:** "I am not offering classical truth conditions for the conditional itself."
  **Hold:** "This is a feature, not a bug. It prevents Lewis-style triviality results."

  ### 4. The Triviality Result (Epistemologists/Formalists)
  **When:** Mid-to-late Q&A.
  **The Objection:** "If you treat conditionals as probabilistic assertions relative to an information state, don't you immediately run into Lewis's triviality result? You can't identify the probability of a conditional with the conditional probability without collapsing the logic."
  **The Reply:** "Lewis's result assumes conditionals express propositions that can be iterated. My view treats them as updates to an information state (dynamic semantics style). We aren't assigning probabilities to propositions, but measuring the strength of the update. This sidesteps the triviality proof because the semantic value isn't a proposition in the standard sense."
  **Soft Spot:** If they push on "what is the semantic value then?"
  **Concede:** "Standard possible worlds semantics needs modification here."
  **Hold:** "The triviality result applies to propositional accounts, not dynamic/update accounts."

  ### 5. Embedding under Attitude Verbs (Semanticists)
  **When:** Late Q&A.
  **The Objection:** "Consider: 'Alice believed that if Oswald hadn't shot...' Does the 'frozen state' freeze at Alice's belief time or your utterance time? If it's Alice's, how does the subjunctive morphology signal that from the matrix clause?"
  **The Reply:** "The frozen state is determined by the local evaluation time. Under an attitude verb, the information state is the attitude holder's. The subjunctive morphology instructs us to freeze *that* state at the time relevant to the antecedent. So it shifts with the attitude. This predicts that sequence-of-tense phenomena should mirror the freezing mechanism."
  **Soft Spot:** Complex embeddings ("John said that Mary believed that if...").
  **Concede:** "Embedded contexts add complexity to identifying the salient freeze time."
  **Hold:** "The mechanism is local. Mood always targets the immediately dominating information state."

  ### 6. The Psycholinguist's Challenge (Psycholinguist)
  **When:** End of Q&A.
  **The Objection:** "We see distinct reaction times and activation patterns for indicatives vs. subjunctives in reasoning tasks. If it's the same operator, why the processing cost difference?"
  **The Reply:** "Because retrieving a 'frozen' past information state is cognitively more expensive than accessing the current working memory. It's the same software, but one requires digging into long-term archival storage while the other uses the active cache. The semantic identity doesn't predict identical processing load."
  **Soft Spot:** If they have data showing *qualitative* reasoning differences, not just speed.
  **Concede:** "Processing costs will differ significantly."
  **Hold:** "Processing cost $\neq$ semantic type. Memory retrieval is costly but doesn't change the operation."

  ### 7. Negation and Compounds (Formalists)
  **When:** Mid-talk or Q&A.
  **The Objection:** "How do you handle 'It's not the case that if A, B'? If *if* is an update instruction, what does negating an instruction mean? Do you negate the outcome or the update?"
  **The Reply:** "External negation denies that the update is licensed. It says 'You cannot move from A to B given the current information state.' I reject internal negation of the conditional connective. There is no 'If A, not-B' connective; there is only 'If A, B' which fails to update."
  **Soft Spot:** This is non-standard and might look like you're avoiding the problem.
  **Concede:** "This requires a non-classical treatment of negation."
  **Hold:** "Negation targets the licensing of the conditional, not the consequent."

  ### 8. The "Repackaging" Charge (General)
  **When:** Post-talk, during the mingle.
  **The Objection:** "Isn't this just Stalnaker's context set or Isaacs's dynamic account with extra steps?"
  **The Reply:** "Stalnaker focuses on common ground; I focus on individual information states and evidence accessibility. Isaacs handles questions; I'm handling the mood distinction specifically via evidence freezing. The gain is explaining the Adams pair contradiction without lexical ambiguity."
  **Soft Spot:** It *is* closely related to dynamic accounts.
  **Concede:** "It builds on the dynamic tradition."
  **Hold:** "The specific mechanism of 'evidence freezing' via mood is the novel contribution."

  ---

  ## PART II: THE LANDMINE
  **The Objection You Fear:** "The Unfalsifiable Freeze."
  **Why it's real:** If every counterexample can be explained by saying "Oh, the relevant frozen information state was *that* one, not *this* one," your theory is vacuous. You can always posit a different "salient past moment" to save the prediction.
  **The Checkable Prediction:**
  To prove the "frozen state" isn't a free variable, you must tie it to **temporal morphology in the antecedent**.
  **Prediction:** "If the subjunctive freezes the information state at a past time, that time must align with the temporal location of the antecedent event. If I say 'If Oswald hadn't shot Kennedy *in 1963*...', the freeze is 1963. If I say 'If Oswald hadn't shot Kennedy *yesterday*...' (in a counterfactual scenario), the freeze must be yesterday. If your theory allows the freeze to be 1963 even when the antecedent says 'yesterday' just to make the conditional come out true, the theory is unfalsifiable."
  **Under Pressure:** "I predict that temporal adverbs in the antecedent constrain the frozen information state. You cannot freeze the evidence at $t_1$ if the antecedent explicitly locates the event at $t_2$. This constrains the 'salient past moment' to be the time of the antecedent event, not just any past moment."

  ---

  ## PART III: DO NOT SAY
  **Avoid these phrases at all costs.** They signal "I haven't done the formal homework" to this specific crowd.

  1.  **"Basically, it's about what we mean by 'if'."**
      *   *Why:* Semanticists hate "meaning" talk that isn't cashed out in truth conditions, use conditions, or context change potentials. It sounds like philosophical hand-waving.
      *   *Say instead:* "It's about the semantic value relative to the information state."

  2.  **"Intuitively, the sentence sounds wrong."**
      *   *Why:* "Intuition" is data, but "sounds wrong" is anecdotal. They want "infelicitous," "unassertable," or "pragmatically inconsistent."
      *   *Say instead:* "The conjunction is pragmatically inconsistent."

  3.  **"The logic of conditionals is different."**
      *   *Why:* This invites them to ask *which* logic. If you can't name the system (e.g., Dynamic Epistemic Logic, Update Semantics), you look unprepared.
      *   *Say instead:* "The update semantics differs from classical material implication."

  ---

  ## STRATEGIC NOTE
  Your officemate (the semanticist) will likely lead the charge on **Objection #1 (Compositionality)** and **Objection #2 (Kratzerian overlap)**. She knows your draft. She knows where the formalism is thin.
  *   **Tactic:** Do not fight her on the formalism details if you haven't finalized them. Concede the *implementation* detail, but pivot back to the *explanatory gain* (the Adams pair contradiction).
  *   **Line to use:** "You're right that the LF needs more work, but does the two-lexical-entry view explain the contradiction any better? If not, my unified view is worth the formal cost."

  Good luck. Keep your answers under two minutes. If you go long, they will swarm.
