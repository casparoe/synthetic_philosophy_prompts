answer: |-
  Here is a concrete scenario designed for a detective novel. It avoids the clichéd metaphysical puzzles and focuses on moral obligation, memory, and legal testimony.

  ### The Precedent: *State v. Varrick (The "Custodian" Ruling)*

  In your novel, the detective can recall a cold case or a legal precedent known as the *Varrick* case. It serves as a philosophical mirror for the current witness dilemma.

  **The Facts of the Varrick Case:**
  Ten years ago, a woman named Elena Varrick witnessed a murder. Fearing for her life, she placed the physical evidence (a bloody cufflink) in a safe deposit box. She signed a notarized affidavit stating: *"If I am incapacitated or unable to speak, this box is to be opened by Detective Miller. I accept the risk of this knowledge."*

  Two weeks later, Varrick was in a car accident and fell into a coma. She woke up a year later with severe retrograde amnesia and a fundamentally altered personality (docile where she was once aggressive; risk-averse where she was once bold). When Detective Miller approached her for the key, the "new" Varrick refused. She claimed she didn't remember the murder, didn't remember signing the affidavit, and felt no moral obligation to risk her safety for a stranger's justice. She argued that the woman who signed the affidavit was effectively dead.

  **The Philosophical Clash:**

  This is where the two metaphysical views provide the detective with conflicting intuitions on whether the "new" Varrick owes a debt to the "old" Varrick.

  #### 1. The Endurantist Intuition (The "New Person" View)
  *   **The Philosophy:** Endurantism holds that a person is "wholly present" at every moment. For a person to remain the *same* person over time, there must be a continuity of consciousness or psychological connection (a Lockean view often paired with endurantism in fiction). If the psychological link is severed by the coma, the *person* who existed before is gone, even if the biological organism remains.
  *   **The Intuition:** The detective feels that holding the new Varrick to the old Varrick's promise is unjust. The woman who made the pact is dead. The woman sitting in front of you is a stranger wearing her face.
  *   **The Verdict on Obligation:** **No Debt.** The new personality did not consent to the risk. To force her to testify is to punish a new person for the choices of a ghost.
  *   **Application to Your Witness:** If the detective leans this way, they will feel guilty pressing the witness. They might think, *"I'm asking her to die for a promise she never made."*

  #### 2. The Perdurantist Intuition (The "Space-Time Worm" View)
  *   **The Philosophy:** Perdurantism views a person as a four-dimensional "space-time worm" extended across time. The pre-coma Varrick and the post-coma Varrick are merely different *temporal parts* of the same single entity. Just as your hand and your foot are different parts of the same body, your past self and future self are different parts of the same life-worm.
  *   **The Intuition:** The detective feels that the obligation is structural to the organism's timeline. The "worm" made a contract. One segment of the worm cannot invalidate the actions of another segment without breaking the integrity of the whole. The debt travels with the flesh, not just the memory.
  *   **The Verdict on Obligation:** **Debt Persists.** The later temporal part owes it to the earlier temporal part to complete the causal chain they started. To refuse is a form of self-betrayal across time.
  *   **Application to Your Witness:** If the detective leans this way, they will feel justified in pressuring the witness. They might think, *"She made a pact with herself. I'm just asking her to honor her own signature."*

  ### How to Use This in the Scene

  You can have the detective physically hold a file from the *Varrick* case while looking at the witness. It externalizes the internal philosophical conflict.

  **Drafting Suggestion:**

  > Detective Halloway looked at the file on his desk. *State v. Varrick.* Closed, but never resolved. Elena Varrick had woken up from her coma a stranger in her own skin. She'd refused to honor the affidavit her past self had signed.
  >
  > He looked up at the woman in the interrogation room. She was staring at her hands, flexing fingers that remembered a life she claimed she didn't know.
  >
  > If Halloway was an endurantist, the woman in the chair was innocent. The person who knew the truth had died in that coma. This was a new soul, and you couldn't conscript a stranger into a war they didn't start. To press her would be cruelty.
  >
  > But if he was a perdurantist, she was a single line drawn through time. The woman who hid the evidence and the woman hiding her eyes now were the same object, just at different coordinates. The promise wasn't a memory; it was a structural load-bearing wall in her own timeline. To ignore it was to collapse the bridge she was standing on.
  >
  > He had to decide: Was he talking to a heir, or a debtor? Did she owe the dead woman in the coma everything, or nothing?

  ### Why This Fits Your Themes
  1.  **Memory vs. Identity:** It highlights that memory loss doesn't necessarily solve the identity problem; it just shifts the metaphysical burden.
  2.  **Obligation:** It directly addresses your prompt about owing something to a past self. The Perdurantist view argues we *do* owe our past selves continuity; the Endurantist view argues we are liberated from them by radical change.
  3.  **Detective Stakes:** It turns a metaphysical question into a tactical one. If he treats her as the "same person," he can use leverage (guilt, contract). If he treats her as a "new person," he must use persuasion (morality, safety).
