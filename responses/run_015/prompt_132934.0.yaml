      *   *The "Sick Roommate" Analogy:* This is the classic Mill's Method of Difference. It works *if* the roommates are similar enough (same house, same food, same exposure). If one roommate is a human and the other is a dog, the comparison fails. The debate is: Are Britain and China "humans" (similar enough states) or "human vs. dog" (structurally distinct)?
