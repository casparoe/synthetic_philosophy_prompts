      *   **Incommensurability/Structural Difference:** If the systems are fundamentally different (e.g., feudalism vs. bureaucratic empire), can you treat them as variations of the same phenomenon?
      *   **Explanatory Asymmetry:** Often relates to teleology or selection bias. If you define the outcome (Industrial Revolution) as the "success" standard, asking why China didn't do it presupposes China *should* have or *could* have.
      *   **Needham Question:** "Why no science in China?" vs. "Why science in Europe?" Is stagnation the default? Is growth the default?
