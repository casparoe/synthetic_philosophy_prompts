      *   *Needham vs. Divergence:* Needham focuses on internal Chinese trajectory (Song peak -> Ming/Qing decline). Divergence focuses on the split (1750+). They are related but distinct. Needham assumes a potential that was lost; Divergence assumes a split that happened late.

