answer: |-
  # RFC 1092: Moral Vocabulary Refactor (Expressivist Backend)

  | Status | Draft |
  | :--- | :--- |
  | **Author** | Senior Backend Engineer |
  | **Reviewers** | Core Team, Ontology Working Group |
  | **Date** | 2023-10-27 |

  ## Summary

  This RFC proposes refactoring the `ethics.core` module to align type signatures with runtime behavior. Currently, moral predicates (e.g., `is_wrong()`) return booleans, implying they describe state. However, observational data suggests these functions operate via side effects (venting attitudes) rather than state retrieval. We will change return types to `None` and introduce a wrapper type to handle embedded contexts.

  ## Motivation

  Our legacy implementation treats moral sentences as const functions returning `bool`. This assumes a realist ontology that our runtime does not support. When `is_wrong(action)` is called, it does not query a database of facts; it emits a signal to coordinate social attitudes. Continuing to return `bool` creates a type safety illusion. We need to treat moral assertions as IO operations that return `void`, consistent with an expressivist architecture.

  ## Guide-level explanation

  After this refactor, calling a moral predicate directly will trigger a side effect and return nothing.

  ```python
  # Before
  if is_wrong(lying):
      block_action()

  # After
  condemn(lying)  # Returns None, emits 'Boo!' to stderr
  ```

  Direct assertions are now statements of attitude, not checks. Code relying on the return value will break. This is intended.

  ## Reference-level explanation

  ### The Composability Bug

  The primary regression involves embedded contexts (conditionals, negations, quantifiers). In the legacy system, `is_wrong(x)` could be passed as an argument because it returned a value. Under the new signature, embedding a `None`-returning function inside a conditional raises a `TypeError`.

  ```python
  def test_modus_ponens():
      # Premise 1: If lying is wrong, getting brother to lie is wrong
      conditional = MoralConditional(condemn(lying), condemn(brother_lying))
      
      # Premise 2: Lying is wrong
      condemn(lying) 
      
      # Conclusion: Getting brother to lie is wrong
      assert condemn(brother_lying) is not None  # FAILS: Returns None
  ```

  This failure is not a regression; it exposes a pre-existing logical debt. The inference looks valid, but under the new types, the two occurrences of `condemn(lying)` do not contribute the same value. One triggers an attitude; the other is part of a conditional structure.

  ### Negation Handling

  A known limitation exists for negation. If `condemn(x)` expresses disapproval, `not condemn(x)` technically expresses only the absence of disapproval, not approval. We will document this as expected behavior. Users seeking to express approval must call `praise(x)` explicitly. We are not building a bidirectional mapper at this time.

  ### Higher-Order Workaround

  To restore composability without reintroducing boolean returns, we are introducing `AttitudeThunk`. This wrapper allows moral sentences to be passed as arguments without executing the side effect immediately. A conditional becomes an attitude directed at a combination of attitudes.

  ```python
  class AttitudeThunk:
      def __init__(self, antecedent, consequent):
          # Stores attitudes, does not evaluate truth
          self.combo = (antecedent, consequent) 

      def is_consistent(self):
          # Checks if holding both attitudes creates conflict
          return check_consistency(self.combo)
  ```

  This restores the ability to pass moral sentences into functions. The conditional no longer checks facts; it checks if holding the antecedent attitude while rejecting the consequent attitude is consistent.

  ## Drawbacks

  The `AttitudeThunk` implementation relies on heuristic consistency checks. We have not proved that this wrapper validates Modus Ponens in all edge cases. It merely feels like it does during smoke testing. The team is comfortable shipping this without formal verification, as the alternative is blocking on ontology proofs that may never land.

  ## Alternatives Considered

  1.  **Realist Backend:** Build a database of moral facts. Rejected due to high latency and inability to schema the ontology.
  2.  **Error Theory:** Delete the `ethics` module entirely. Rejected as too disruptive to downstream dependencies (Legal, HR).

  ## Unresolved Questions

  ### Quasi-Realist Aliasing

  Once the refactor is complete, should we continue exposing methods like `.is_true()` or `.belief()`? 

  **Resolution:** Yes. We will alias `.is_true()` to `.is_consistent()`. This allows legacy code to continue using words like "true," "fact," and "believe" with a thinner meaning that costs nothing. We will also introduce a lint rule to flag inconsistent attitudes, which will stand in for the whole of moral reasoning.

  ## Discussion Thread

  **@ontology_lead (Representationalist)**
  I cannot approve this. You are treating a category mistake as a type mismatch. Moral sentences describe normative reality, not just internal state. By forcing them into `void`, you are breaking the interface between our code and the world. This isn't technical debt; it's a fundamental misunderstanding of the domain. You are building a compiler for a language that doesn't exist.

  **@null_pointer (Nihilist)**
  Honestly, why are we maintaining this module at all? If the return value is `None` and the "facts" are just aliases for consistency checks, the module is dead code. We should deprecate `ethics.core` in v2.0 and let callers handle their own side effects. Keeping it implies there's something there to import. There isn't.

  **@ops_dave (Pragmatist)**
  Ignoring the metaphysics for a second: does any of this change what anyone does on Monday? If the lint rule catches the same bugs as the old boolean checks, I don't care if it's a `Thunk` or a `Fact`. Just make sure the CI pipeline doesn't hang on the consistency check. We have a release on Tuesday.

  **@author**
  @ontology_lead: We are aligning types with runtime behavior. If the reality exists, it should implement the interface.
  @null_pointer: Downstream dependencies (Legal) require the import to exist.
  @ops_dave: No change to CI latency. The consistency check is O(1).
