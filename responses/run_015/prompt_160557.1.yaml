answer: |-
  1. Applicants must attest that no surviving correspondence from the subject's lifetime identifies the contested conduct as objectionable. Proof of contemporary dissent establishes that the subject could have known better and nullifies the temporal defense.

  2. Should the temporal defense be upheld, all laudatory achievements must be reclassified as mere products of prevailing cultural currents rather than individual merit. The subject cannot be deemed exceptional in virtue while remaining typical in vice.

  3. The applicant must affirm that their own current conduct will be eligible for identical exemption by future review boards operating under shifted moral consensuses. Protection granted to the past must be structurally available to the present.

  4. Approval requires the subject to be simultaneously unique enough for praise and typical enough for excuse. Evidence of moral foresight invalidates the defense, while evidence of conformity invalidates the commemoration.

  5. Applicants must certify that invoking this exemption does not implicitly concede that present moral standards are superior to those of the subject's era. Any admission of moral progress constitutes an admission of the subject's historical failure.
