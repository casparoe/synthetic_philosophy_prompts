  9.  **Final Polish:** Check the tone. Don't sound like a professor, sound like a thoughtful peer helping design a tool. Ensure the distinction between *Impact* (utilitarian) and *Progress* (expanding circle) is clear, because that's the root of the tension between #2 and #3.

  *(Self-Correction on Case 2)*: I need to be careful not to validate the AI sentience claim as *true*, but validate the *inquiry* as a candidate for circle expansion. The grant is for a *working group*, not rights for bots. That helps #2.

  *(Self-Correction on Case 1)*: Be honest. If the circle already includes chickens, is this expansion? Singer would say moving from "count a little" to "count a lot" is deepening. The user wants *widening*. So #1 might actually fail the user's specific criteria, even if it's "good."

