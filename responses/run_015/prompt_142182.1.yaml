      *   *Critique:* This is a common objection (often associated with Hume or later critics of occasionalism). Is it fair? Ghazālī appeals to *ʿāda* (custom/habit). He claims God *promises* consistency (via prophecy/revelation) or that we have a psychological expectation created by God.
      *   *Fairness:* It risks begging the question if Ghazālī has a non-inductive basis (e.g., revelation or innate knowledge of God's consistency). However, for *natural knowledge* (which is what's at stake in the *Tahāfut*), Ghazālī admits we only have expectation.
