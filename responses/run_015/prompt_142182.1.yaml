      *   *Most Derivative:* The Humean comparison (ANN is cheap). Everyone compares Ghazālī to Hume. The user needs to ensure they aren't just repeating "Ghazālī is a proto-Hume." The twist (ANN vs. NEC) helps avoid this, but the "ANN is cheap" point is standard scholarship (e.g., Marmura, Griffel).
