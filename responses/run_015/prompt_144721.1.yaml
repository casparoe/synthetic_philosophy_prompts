answer: |-
  This is a fascinating and deeply human problem. You are wrestling with the sociology of "invented traditions," and your intuition is correct: the argument for exclusion is logically inconsistent with the history of your town and the festival itself.

  There is a principled way to navigate this without lying about your history. To do it, you have to shift the definition of **authenticity** from *provenance* (where did this come from?) to *sincerity* (what does this do for us?).

  Here is a framework you can use to articulate why the 1990 cutoff is flawed and how to define belonging without faking ancient roots.

  ### 1. Acknowledge the "Invented Tradition"
  Sociologists Eric Hobsbawm and Terence Ranger coined the term "invented tradition" to describe practices that appear ancient but are actually recent. They noted that this isn't necessarily bad. All communities need rituals to bind themselves together.

  *   **The Argument:** You can admit openly that the festival started 10 years ago and the ritual is based on a flawed text. That doesn't make the *community bond* fake.
  *   **The Point:** Authenticity isn't about the age of the ritual; it's about the age of the *relationships* built through the ritual. A 10-year tradition that has genuinely helped neighbors connect is more "real" than a 200-year ritual performed by strangers who don't care about each other.

  ### 2. Expose the Logical Flaw in the "1990 Rule"
  The exclusionary group is trying to create an aristocracy in a place that hasn't existed long enough to support one.
  *   **The Math:** The town was built in 1978. The cutoff is 1990. That is a 12-year window.
  *   **The Implication:** They are claiming that someone who moved in during the town's first 12 years is fundamentally different from someone who moved in year 13, 20, or 30. In the lifespan of a community, that is an arbitrary distinction.
  *   **The Factory Context:** A town built around a factory is inherently transient and industrial. It is not an agrarian village where bloodlines stay put for centuries. Imposing a "founding families" hierarchy on a factory town contradicts the actual economic and social history of the place.

  ### 3. Redefine Authenticity: Stewardship vs. Ownership
  The conflict arises because the "old guard" views the tradition as **property** they own, whereas you view it as a **practice** you share.
  *   **Ownership Model:** "We were here first, so we control the ritual." This leads to gatekeeping and eventual death of the tradition as the original group ages out.
  *   **Stewardship Model:** "We are the current caretakers of this story." This implies a duty to pass it on.
  *   **The Principle:** Belonging should be determined by **commitment to the practice**, not **date of arrival**. If a newcomer learns the songs, helps set up the chairs, and believes in the purpose of the gathering, they are more "authentic" participants than a 1985 resident who sits in the back and critiques the newcomers.

  ### 4. Is Authenticity Just Shared Belief?
  You asked if authenticity is basically just shared belief. The answer is: **Shared belief creates reality.**

  If the town agrees that this festival represents *us*, then it does. The "blessing of the soil" might be based on a fabricated 1923 text, but if the soil of your town is what feeds your gardens and the ritual makes you care about the land, the *effect* is real.

  *   **Historical Authenticity:** Is this exactly what our ancestors did? (No.)
  *   **Social Authenticity:** Does this truthfully represent who we are *now*? (Yes, if it includes the current community.)

  By excluding newcomers, the "old guard" is actually making the festival *less* authentic, because it no longer truthfully represents the current town. It becomes a reenactment of a specific demographic slice from 1990, rather than a living celebration of the town as it exists today.

  ### 5. A Principled Proposal for Your Group
  You can propose a "Charter of Continuity" to resolve the fight. This avoids attacking the older families directly but sets a forward-looking standard.

  **The Three Criteria for Leadership:**
  1.  **Participation:** Have you actively participated in the festival for at least $X$ years? (This values effort over residence date).
  2.  **Understanding:** Do you understand the history of the ritual, including its recent origins and the ethnography's flaws? (This values honesty over myth).
  3.  **Inclusivity:** Do you commit to teaching the ritual to others, regardless of when they moved here? (This values stewardship over ownership).

  ### How to Say It
  When you speak to the group, try this framing:

  > "I understand the desire to protect what we've built. But this town was built in 1978. We are all, in the grand scheme of things, newcomers here. If we draw a line at 1990, we aren't protecting history; we're creating a caste system based on a 12-year difference.
  >
  > The festival feels 'ours' not because the ritual is ancient, but because we have spent ten years making it meaningful. If we stop letting new people lead, we admit that the ritual is a museum piece rather than a living tradition. I want this to survive another 50 years. To do that, we need to measure belonging by who shows up and does the work, not by when they bought their house."

  ### Summary
  You don't need ancient roots to have a real tradition. You need **continuity of care**. The "1990 rule" is a defensive reaction to change, but it undermines the very thing they claim to protect: the community's cohesion. Authenticity is not about where you came from; it's about how sincerely you participate in the "we" that exists today.
