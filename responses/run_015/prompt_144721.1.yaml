      *   *Don't call the organizers liars.* Focus on the *evolution* of the ritual.
      *   *Highlight the Factory Aspect:* A factory town implies workers coming and going. Excluding newcomers contradicts the economic reality of the town's origin.

  8.  **Final Polish:** (Reviewing against the prompt's specific details: 1978 town, 10-year festival, 1923 ethnography, 1990 cutoff). Ensure these specific numbers are used to illustrate the argument. (e.g., "1990 is barely a generation after 1978").

  9.  **Final Output Structure:**
