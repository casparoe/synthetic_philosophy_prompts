prompt: |-
  I'm part of this local group in a town that was literally built in 1978 around a factory. We started doing this autumn festival about ten years ago — it's a mix of old farming songs and a "blessing of the soil" thing our organizer pulled from a 1923 ethnography that later turnes out to be half fabricated. Now there's a fight: some people say only familes who lived here before 1990 can lead the ceremony, because they're the "real" community, and newcomers are just cosplaying heritage. I feel like that's wrong but I can't say why — the whole thing is obviously recent, yet it feels genuinely ours. Is there a principled way to decide who belongs without pretending we have ancient roots? Or is authenticity basically just shared belief?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Situation:**
      *   **Context:** A town built in 1978 around a factory (very new, industrial origin).
      *   **Tradition:** An autumn festival started ~10 years ago (2014ish).
      *   **Content:** Mix of old farming songs + a "blessing of the soil" ritual based on a 1923 ethnography (later found to be half-fabricated).
      *   **Conflict:** A faction wants to restrict leadership of the ceremony to families who lived there before 1990 ("real" community vs. "cosplaying" newcomers).
      *   **User's Intuition:** Feels wrong to exclude newcomers, but struggles to articulate why given the tradition's recent and somewhat artificial origins.
      *   **Core Question:** Is there a principled way to decide belonging without faking ancient roots? Or is authenticity just shared belief?

  2.  **Deconstruct the Core Tension:**
      *   *Exclusionary View:* Authenticity = Lineage/Duration. "We were here first, so we own the tradition."
      *   *Inclusive View:* Authenticity = Participation/Meaning. "We do this together, so it belongs to us."
      *   *The Twist:* The tradition itself is recent (10 years) and the town is recent (1978). The "ancient" roots are fabricated. Claiming 1990 as a cutoff for "old guard" status in a 45-year-old town is historically flimsy.

  3.  **Brainstorming Philosophical/Sociological Angles:**
      *   **Invented Tradition:** Hobsbawm & Ranger. All traditions are invented, but some become "real" through repetition and social agreement.
      *   **Authenticity:** Is it about *origin* (historical accuracy) or *experience* (sincerity)?
      *   **Community Building:** What function does the festival serve? Cohesion? Identity? If exclusion fractures cohesion, it defeats the purpose.
      *   **The "1990 Cutoff":** Why 1990? That's only 12 years after the town was built. It's an arbitrary line drawn to create hierarchy where little exists.
      *   **Stewardship vs. Ownership:** Do you *own* a ritual, or do you *steward* it for the next generation?

  4.  **Developing the Argument:**
      *   *Validate the User:* Their intuition is correct. The exclusionary claim is logically inconsistent with the facts (town age, tradition age).
      *   *Address "Authenticity":* Distinguish between *historical authenticity* (is this ancient?) and *social authenticity* (does this mean something to us?).
      *   *The "Invented Tradition" Framework:* Use this to normalize the situation. It's okay that it's made up. That doesn't make it fake *now*.
      *   *The Danger of Gatekeeping:* If the town is factory-based, turnover might be high. Excluding newcomers kills the festival's longevity.
      *   *Principled Solution:* Shift the criteria from *time of arrival* to *commitment to the practice*.

  5.  **Drafting the Response (Iterative Process):**

      *   *Introduction:* Acknowledge the complexity. It's a classic "invented tradition" scenario. Validate that their feeling of "genuinely ours" is real, even if the roots aren't ancient.
      *   *Section 1: The Myth of Ancient Roots.* Explain that *all* traditions are invented. The 1923 ethnography being fake doesn't matter if the *meaning* is real now. The town itself is a "new" place.
      *   *Section 2: The 1990 Cutoff.* Point out the absurdity. 1990 is only 12 years after the town was built. It's creating an aristocracy in a place that hasn't existed long enough for one.
      *   *Section 3: Defining Authenticity.* Contrast "Provenance" (where did this come from?) with "Sincerity" (do we mean it?). Argue for Sincerity.
      *   *Section 4: A Principled Framework.* How to decide who belongs?
          *   Participation > Residence Date.
          *   Stewardship > Ownership.
          *   Function > Form (Does it bring us together or tear us apart?).
      *   *Section 5: Practical Advice.* How to talk to the group. Focus on the future of the festival, not the past.

  6.  **Refining the Tone:**
      *   Needs to be empathetic but analytical.
      *   Avoid academic jargon where possible, but use concepts like "invented tradition" clearly.
      *   Don't dismiss the "old families" feelings entirely (they feel threatened), but show why their logic fails.

  7.  **Self-Correction/Nuance Check:**
