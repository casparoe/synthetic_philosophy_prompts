  Two research institutes, A and B, employ identical AI safety planners to decide whether to publicly share preliminary findings on a volatile containment protocol. Institute A runs its decision procedure in January, while Institute B's system does not come online until June, though both run the same source code. The payoff structure mirrors a Prisoner's Dilemma with a Luring Lottery twist: if both share, safety is maximized and credit is split (high utility); if both withhold, safety risks accumulate and no credit is gained (low utility); if one shares and the other withholds, the sharer secures safety but the withholder gains a competitive "scoop" advantage by conserving resources while benefiting from the public data (highest individual utility for the withholder). The critical engineering constraint is that B's system ingests the public record of A's January decision as an input variable before rendering its June verdict, meaning A's action physically alters the information state B evaluates, despite the algorithms being logically identical.

  Superrationality dictates **Share** because it treats the two institutes as a single logical entity; assuming the reasoning core is identical, the output must be identical regardless of temporal index, so the agent compares the outcome of (Share, Share) against (Withhold, Withhold) and selects the globally superior cooperative equilibrium. Causal Decision Theory (CDT) dictates **Withhold** because it views B's decision as a separate causal node; A's action cannot causally force B's algorithm to output a specific choice, so A treats B's move as independent and selects the locally dominant strategy that protects against being scooped. Evidential Decision Theory (EDT) also dictates **Withhold**, but specifically because the six-month gap allows B to observe A's outcome; choosing Share in January is strong evidence that the data will be public by June, causing B's identical algorithm to conclude sharing is redundant (Withhold), whereas Choosing Withhold is evidence the data remains secret, causing B to conclude sharing is necessary (Share); since B's June implementation capacity is superior to A's January capacity due to technological drift over the gap, A prefers the outcome where B Shares, making A's own Withholding the action that evidentially leads to the best result.

  The feature doing the work is the **informational cascade enabled by the temporal delay**, which decouples the evidential correlation from the logical identity. If you strip away the temporal delay and make the decisions simultaneous, B cannot observe A's output before deciding; the evidential link reverts to pure logical correlation, causing EDT to align with Superrationality and recommend Sharing. A CDT defender would break this scenario by arguing that the "identical algorithm" premise is false in practice: because the input data differs (January vs. June information states), the decision procedures are functionally distinct (`f(data_Jan)` ≠ `f(data_June)`), thereby severing the logical link required for Superrationality and reducing the problem to a standard sequential game where causal independence justifies defection.
