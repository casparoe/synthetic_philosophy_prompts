answer: |-
  Here is the core logical distinction you need for your lit review, stripped of the introductory framing.

  ### 1. The Mathematical Point: Indeterminacy via Non-Convergence
  The mathematical critique focuses on the **definition of the task**. Thomson defines the lamp's state function $f(t)$ for the interval $[0, 1)$.
  *   $f(t) = 1$ (On) if the number of flips is even.
  *   $f(t) = 0$ (Off) if the number of flips is odd.

  As $t \to 1$, the number of flips approaches infinity. The sequence of states is $\{1, 0, 1, 0, \dots\}$. In standard analysis, this sequence **diverges**; it has no limit.

  **The Mathematical Conclusion:** The description of the supertask specifies the state of the lamp for all $t < 1$, but it **fails to specify** the state at $t = 1$. The value $f(1)$ is mathematically **underdetermined** by the series $f(t < 1)$. It is not that $f(1)$ is contradictory; it is that $f(1)$ is undefined *relative to the provided series*.

  ### 2. The Physical Point: Kinematic Impossibility
  The physical critique focuses on **causal realization**. This argument grants that the mathematics is coherent but asks whether a physical system can instantiate the function $f(t)$.
  *   To flip the switch infinitely many times, the switch must travel a non-zero distance infinitely many times.
  *   This requires infinite velocity, infinite acceleration, or infinite energy at the limit point $t=1$.
  *   Given known laws of physics (relativity, quantum mechanics, material strength), such a trajectory is **nomologically impossible**.

  **The Physical Conclusion:** A Thomson Lamp cannot be *built*. However, this does not prove supertasks are *logically* impossible, only that they are incompatible with our specific universe's laws.

  ### 3. The Conflation: Thomson's Category Error
  Thomson's original argument (1954) attempts to prove that supertasks are **logically impossible** (a contradiction in terms), not just physically impossible. He argues that because the lamp cannot be logically defined as On or Off at $t=1$, the task itself is absurd.

  **Here is the conflation:** Thomson implicitly assumes a **Principle of Continuity**: that the state of a physical object at a limit time $t=1$ *must* be determined by the limit of its states as $t \to 1$.

  *   **Thomson's Logic:**
      1.  The sequence of states has no limit.
      2.  (Hidden Premise): The state at $t=1$ must be the limit of the sequence.
      3.  Therefore, the state at $t=1$ is impossible (neither On nor Off).
      4.  Therefore, the supertask is logically impossible.

  *   **The Critic's Rebuttal (Benacerraf, 1962):**
      The hidden premise is false. There is no logical rule requiring the state of a system at $t=1$ to be continuous with its history at $t < 1$. The task description tells us what happens *during* the flips, but it says nothing about the *result* of the completion.
      *   The lamp could be On.
      *   The lamp could be Off.
      *   The lamp could have exploded.
      *   **None of these contradict the description of the flips.**

  ### 4. Why This is "Begging the Question"
  Critics accuse Thomson of conflating the mathematical indeterminacy with logical impossibility because he assumes that **causal closure** works via mathematical limits.

  If you argue that the supertask is impossible *because* the limit doesn't exist, you are assuming that physical reality must map continuously onto mathematical series. But the concept of a supertask is precisely a challenge to that mapping. By insisting that the lack of a limit creates a contradiction, Thomson is assuming the very thing he needs to prove: that an infinite causal chain must yield a determinate effect via a limit function.

  **For your lit review:**
  The consensus (following Benacerraf) is that Thomson's Lamp demonstrates **logical underdetermination**, not **logical contradiction**.
  *   **Thomson:** No limit $\rightarrow$ Contradiction $\rightarrow$ Supertasks Impossible.
  *   **Critics:** No limit $\rightarrow$ Underdetermination $\rightarrow$ Supertasks Logically Possible (but physically unlikely).

  Those who claim the lamp proves supertasks impossible are accused of conflating the **absence of a mathematical rule** (the limit) with the **presence of a physical prohibition** (contradiction). They treat the incompleteness of the series description as a flaw in the reality of the task, rather than a flaw in the description.
