prompt: |-
  I'm writing a lit review on supertasks and I keep getting confused about what Thomson's lamp actually shows. Can you explain the difference between the mathematical point that the sequence of switch-flips has no limit (so "on at time 1" is undefined) and the physical point that infinitely many actions in a finite time is impossible, and then say why people who say the lamp proves supertasks impossible are often accused of conflating those? I want the core of the argument, not the usual intro-class summary.
reasoning: |-
  Here's a thinking process that leads to the suggested explanation:

  1.  **Analyze the User's Request:**
      *   **Topic:** Thomson's Lamp (a classic supertask paradox).
      *   **Goal:** Explain the distinction between the *mathematical* issue (limit of the sequence) and the *physical* issue (feasibility of infinite actions), and explain why conflating them leads to the accusation of begging the question against supertasks.
      *   **Constraint:** "Core of the argument, not the usual intro-class summary." This means avoid basic biographical info, avoid oversimplified "it's a paradox" statements, and focus on the logical structure and the philosophical stakes regarding the definition of supertasks.
      *   **Target Audience:** Someone writing a literature review (likely a philosophy student or researcher), so the tone should be precise, analytical, and technically accurate.

  2.  **Deconstruct Thomson's Lamp:**
      *   *Setup:* A lamp is toggled on/off at $t=0, 1/2, 3/4, 7/8, \dots$. The supertask completes at $t=1$.
      *   *Question:* What is the state of the lamp at $t=1$?
      *   *Thomson's Conclusion:* The state is logically contradictory (neither on nor off, or both), therefore supertasks are logically impossible.

  3.  **Identify the Two Distinct Points of Confusion:**
      *   **Point A: The Mathematical/Logical Definition (The Limit Problem).**
          *   The state function $f(t)$ is defined for $t < 1$.
          *   $f(t)$ oscillates between 0 and 1.
          *   $\lim_{t \to 1} f(t)$ does not exist.
          *   Therefore, the description of the task *as given* does not specify the state at $t=1$.
          *   *Crucial nuance:* Does the lack of a limit imply a contradiction, or just an under-specification?
      *   **Point B: The Physical/Causal Feasibility (The Kinematic Problem).**
          *   Can a physical switch actually move infinitely many times?
          *   Issues: Zeno-like constraints, energy requirements, speed of light, quantum limits.
          *   This is about *nomological* possibility (laws of nature), not *logical* possibility.

  4.  **Analyze the Conflation (The Core Argument):**
      *   Thomson argues: The lamp state is contradictory $\rightarrow$ Supertasks are logically impossible.
      *   Critics (e.g., Benacerraf, Earman, Norton) argue: Thomson assumes the state at $t=1$ *must* be determined by the limit of the states at $t < 1$.
      *   *The Conflation:* Thomson treats the *absence of a mathematical limit* as a *logical contradiction in the physical world*.
      *   *Why it matters:* If the state at $t=1$ is not determined by the prior sequence, there is no contradiction. The lamp could be on, or off, or exploded. The description of the supertask simply doesn't say.
      *   *Accusation:* By claiming the lack of a limit proves impossibility, Thomson is assuming that physical states *must* be continuous functions of their history. This assumption is exactly what the supertask challenges. Therefore, he is begging the question.

  5.  **Drafting the Explanation (Iterative Process):**

      *   *Attempt 1 (Mental Outline):* Thomson says lamp can't be on or off. Math says limit doesn't exist. Physics says you can't move that fast. Critics say Thomson mixes these. He thinks no limit means impossible. But really it just means the story didn't tell us the end. If you say physical things need limits, you're assuming supertasks can't happen already.

      *   *Attempt 2 (Adding Precision):* Need to use terms like "causal closure," "continuity principle," and "underdetermination." Distinguish between logical impossibility (contradiction) and nomological impossibility (physics). Thomson claims logical impossibility. Benacerraf shows it's just underdetermination. The conflation is treating the mathematical series as a causal law.

      *   *Attempt 3 (Refining for the User's "Lit Review" needs):* Structure it clearly.
          1.  The Mathematical Indeterminacy (Limits).
          2.  The Physical Impossibility (Kinematics).
          3.  The Conflation (Thomson's Error).
          4.  Why it matters for the Lit Review (The "Begging the Question" charge).

  6.  **Fleshing out the Details (incorporating key philosophers):**
      *   *Thomson (1954):* The original argument. Claims contradiction.
      *   *Benacerraf (1962):* The definitive rebuttal. Distinguishes the task description from the state at the limit.
      *   *Earman/Norton:* Later refinements on physical supertasks vs. logical supertasks.
      *   *Key Concept:* **Continuity Principle.** The assumption that $State(t=1)$ must be the limit of $State(t<1)$.

  7.  **Final Polish (Checking against constraints):**
