  5.  **Drafting the "Change My Mind" Notes:**
      *   Alex (Swamping): Needs to see that the *state* of knowing has intrinsic worth independent of outcomes.
      *   Jordan (Knowledge): Needs to see that "value" is purely consequentialist in this context.

  6.  **Drafting the "Cheat" Paragraph:**
      *   What's the undefended premise? It's usually the definition of "value." Are we talking about *epistemic* value (good for knowing) or *pragmatic* value (good for living/working)? The dialogue likely slides between them.

  7.  **Review against Constraints:**
