      *   *Refining the Cost Argument:* Alex argues that if Knowledge = True Belief + Justification, and Justification costs resources, then True Belief is more efficient. Jordan must argue that Justification isn't a "cost" but an "investment in capacity."

      *   *The "Worse Off" Case:* Let's make it specific. The metric reader spends 20 mins diagnosing. During that 20 mins, a security breach happens elsewhere. The hunch guy mitigates the load instantly and spots the breach. The metric reader had "knowledge" about the load, but the hunch guy had better overall outcomes. Does this disprove knowledge's value? Or does it show knowledge is local?
