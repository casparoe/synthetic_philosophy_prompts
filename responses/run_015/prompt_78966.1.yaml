      *   **Post-Dialogue:**
          *   Short note from each character on what would change their mind.
          *   One blunt paragraph identifying the undefended premise doing all the work (the "cheat").
      *   **Tone:** Accessible to a non-philosopher, sharp, no jargon/citations, no vague victories.

  2.  **Character Conception:**
