      *   **Jordan (The "Knowledge" / User side):** Reliabilist/Virtue epistemologist leanings. Process matters. Sustainability matters. Understanding *why* allows for adaptation.
      *   *Constraint Check:* They need to be sharp. No strawmen. Alex shouldn't just say "luck is good." Jordan shouldn't just say "feelings are bad."

  3.  **Drafting - Section by Section:**

