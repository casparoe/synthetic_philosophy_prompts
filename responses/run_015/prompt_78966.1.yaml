  9.  **Final Review of the "Cheat" Paragraph:** The cheat is usually the equivocation between *epistemic value* (is this a good belief to hold?) and *pragmatic value* (did this belief help us win?). The dialogue must hinge on this, and the summary must point it out.

      *(Self-Correction on "Swamping"):* Make sure the explanation of the swamping problem is clear in the dialogue. Alex: "If the coffee tastes the same, why care about the machine?" Jordan: "Because the machine guarantees the next cup." Alex: "But we are drinking *this* cup."

