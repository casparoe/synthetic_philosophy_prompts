      The hunch person (Alex's side) calls it instantly. Fixes it.
      Result: Both systems stay up.
      Difference: The metric reader burned 20 mins of engineering time (cost). The hunch reader burned 0.
      Alex: My method produced the same truth for less cost. Therefore higher value.
