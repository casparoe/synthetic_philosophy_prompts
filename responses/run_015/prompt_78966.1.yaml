      Alex: That's future truth. We are valuing *this* belief.
      *Wait, I need a case where the justified person is worse off.*
      Okay, what if the metrics were *misleadingly* robust but the hunch was right? No, then the justified person has a false belief.
      What if the justified person acts on the knowledge and causes a outage, while the hunch person ignores it and it was fine? No, then the justified person was wrong.
