answer: |-
  It is exactly the contradiction you suspect rather than a coherent view, because your organization implicitly rejects moral luck when managing risk but embraces it when distributing reward.

  Your friend's "epistemic humility" explanation for blameless postmortems is incorrect; the policy isn't admitting we *can't* know who caused the outage, it's asserting that in a complex system, the individual *didn't* cause it—the system did. That is a substantive metaphysical claim aligned with the Control Principle (you are only responsible for what you control), which denies that bad outcomes imply bad agents. The "no-heroes" norm extends this consistency by refusing to reward positive resultant luck in operations, acknowledging that being the savior was just as contingent as being the cause. Impact-based promotion is the odd one out because it violates this principle by treating resultant luck as merit; it rewards the engineer who hit the traffic spike exactly as if their skill caused the spike, which is a consequentialist calculation incompatible with the deontological safety culture of the postmortem.

  If you took the Control Principle seriously all the way down, you would have to decouple promotions from outcomes entirely and grade engineers on the quality of their decisions given the information they had at the time, essentially auditing their process rather than their product. Conversely, if you decided outcomes really do matter to merit, you would have to abandon blameless postmortems and assign negligence when individual choices demonstrably diverged from expected standards, accepting that some people are genuinely more blameworthy than others. The reason you can sustain this contradiction is that the practices are philosophically underdetermined: management theory allows you to partition "safety" (where you need psychological safety to get data) and "growth" (where you need outcome incentives to allocate capital) into separate silos so the moral dissonance doesn't break the business.

  I am least confident about the true motivation behind the "no-heroes" norm; while it aligns philosophically with blameless postmortems, it is equally likely driven by pure game theory (preventing engineers from gaming on-call rotations to look good) rather than a genuine stance on moral luck, which would make it instrumentally consistent with promotions even if philosophically distinct.
