      *   The core tension is between *consequentialism* (outcomes, preventing harm) and *deontology/integrity* (complicity, legitimacy, truth-telling).
      *   The public nature adds a layer of *signaling* (what does my name say?).
      *   The advisory nature adds a layer of *efficacy* (does participation matter?).
      *   The user asks if there's a coherent distinction or if the tension is irreducible.

