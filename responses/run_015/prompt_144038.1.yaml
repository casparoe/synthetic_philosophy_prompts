      *   **Options:**
          1.  Delegate to qualified scientist (endorses legitimacy, public name).
          2.  Vote direct for strongest candidate (likely loses, registers preference).
          3.  Vote direct for least harmful viable contender (strategic voting, blocks damage).
          4.  Abstain (avoids complicity, surrenders leverage).
      *   **Constraints:** Public ballots/delegation (no anonymity), large district (negligible individual impact).
      *   **Question:** Can any path be defended on principle? Is there a coherent distinction between expressing judgment, preventing harm, and refusing legitimacy? Or is the tension irreducible?
