answer: |-
  # Which View of Moral Luck Do You Actually Hold?
  ## A Diagnostic Instrument for Moral Philosophy

  ### Part I: The Logical Space

  Before answering the questions below, understand how this quiz maps your intuitions. We are not asking whether you "believe in moral luck." We are mapping your judgments across a grid defined by two dimensions.

  **Dimension 1: The Source of Variation (Kind of Luck)**
  *   **Resultant:** Luck in how your actions turn out (e.g., a child runs into the road vs. does not).
  *   **Circumstantial:** Luck in the problems you face (e.g., living in 1929 Germany vs. 1929 America).
  *   **Constitutive:** Luck in who you are (e.g., your temperament, genes, or upbringing).
  *   **Causal:** Luck in the background chain of events (e.g., determinism or prior causes).

  **Dimension 2: The Target of Judgment (Object of Assessment)**
  *   **Wrongness:** Was the act objectively morally forbidden?
  *   **Blameworthiness:** Is the agent's moral standing diminished?
  *   **Guilt:** Is it appropriate for the agent to feel internal regret or guilt?
  *   **Sanction:** Is it appropriate for society to punish or restrain the agent?

  **How to Read Your Position**
  Your final profile will not be a single label, but a region in this space. You might hold that *Resultant Luck* affects *Sanction* (we punish the killer more than the near-miss driver) but not *Blameworthiness* (they are equally bad people). This quiz is designed to detect these splits. There is no penalty for holding a "mixed" position; the goal is accuracy, not consistency with a textbook.

  ---

  ### Part II: The Diagnostic Questions

  **1. The Two Drivers (Blameworthiness)**
  Driver A and Driver B both drive home equally drunk. Both take the same risks. A child runs into the road in front of A; the child dies. No child runs in front of B; B arrives home safely.
  *   **A.** A is significantly more blameworthy than B.
  *   **B.** A and B are equally blameworthy.
  *   **C.** Neither is blameworthy until harm occurs.

  **2. The Two Drivers (The Survivor's Claim)**
  Driver B (the survivor) later insists: "My record is clean. I did not kill anyone. This proves I am a morally better man than Driver A."
  *   **A.** He is correct. The actual outcome reveals his moral status.
  *   **B.** He is incorrect. His moral status is identical to A's; he is just luckier.
  *   **C.** He is partially correct. His record shows he is less *dangerous*, but not morally better.

  **3. The 1929 Case (Circumstantial Luck)**
  Person X and Person Y have identical vicious dispositions. In 1929, X lives in Germany and joins the Nazi party, committing atrocities. Y is relocated to America by a job transfer and lives a quiet, law-abiding life.
  *   **A.** X is morally worse than Y because of what X actually did.
  *   **B.** X and Y are equally morally corrupt; history just gave X the chance to show it.
  *   **C.** Neither is fully responsible; the historical circumstances determined their paths.

  **4. The Temperament Case (Constitutive Luck)**
  Person Z has a violent temper caused by a genetic condition and severe childhood abuse. Z snaps and assaults someone. Z could not have easily been different given their constitution.
  *   **A.** Z is less blameworthy than a normal person would be in the same situation.
  *   **B.** Z is equally blameworthy; the action is what matters, not the cause of the temper.
  *   **C.** Z is not blameworthy, but should be restrained for public safety.

  **5. Attempt vs. Completed Murder (Legal Sanction)**
  Two agents intend to murder. One succeeds (Completed); the other is stopped by a jammed gun (Attempted). Should the *legal sentence* be the same?
  *   **A.** Yes, the intent was identical.
  *   **B.** No, the successful murderer deserves more punishment.
  *   **C.** No, but only because the law needs to deter harm, not because of desert.

  **6. Attempt vs. Completed Murder (Moral Blame)**
  Using the same case as Question 5: Is the *moral blameworthiness* of the two agents the same?
  *   **A.** Yes, their wills were identical.
  *   **B.** No, the one who succeeded is morally worse.
  *   **C.** No, the one who failed is actually worse (they lacked the capacity to succeed).

  **7. The Near-Miss Asymmetry (Guilt)**
  Return to Driver B (the drunk driver who hit no one). Driver B feels relieved. Should Driver B feel *guilty*?
  *   **A.** Yes, just as guilty as Driver A.
  *   **B.** No, guilt requires actual harm.
  *   **C.** Yes, but less intensely than Driver A.

  **8. The Temporal Distance Case**
  An agent acts negligently at age 20. Due to a slow-acting mechanism, the harm does not occur until the agent is 50. The agent lived a blameless life between 20 and 50.
  *   **A.** The agent is as blameworthy at 50 as they would have been at 20.
  *   **B.** The blame is diluted by the intervening blameless years.
  *   **C.** The agent is not responsible at 50; the connection is too distant.

  **9. The Causal Chain (Determinism)**
  Suppose neuroscience proves that every decision is the inevitable result of prior physical causes (no libertarian free will). Does this eliminate moral blame?
  *   **A.** Yes, without ultimate control, there is no blame.
  *   **B.** No, we can still blame people for actions that flow from their character.
  *   **C.** No, blame is a useful tool for behavior modification regardless of truth.

  **10. The Split Judgment (Sanction vs. Feeling)**
  Imagine a case where an agent is not morally blameworthy (due to luck), but punishing them would prevent future harm. Is punishment appropriate?
  *   **A.** No, punishment requires moral blame.
  *   **B.** Yes, social safety trumps individual moral desert.
  *   **C.** Yes, but we should call it "restraint," not "punishment."

  ---

  ### Part III: Scoring Key

  To find your position, compare your answers to the profiles below. You may match one profile closely, or you may find yourself split between two. That split *is* your philosophical position.

  **Profile 1: The Purist (Strict Control Principle)**
  *   **Pattern:** You consistently chose the "Luck-Insensitive" options.
  *   **Key Answers:** Q1(B), Q2(B), Q3(B), Q4(B), Q5(A), Q6(A), Q7(A).
  *   **Diagnosis:** You hold that moral assessment requires control. If luck influences it, the assessment is invalid. You likely reject Resultant, Circumstantial, and Constitutive luck across all Objects (Blame, Wrongness, Sanction).
  *   **Label:** **Strict Control Principle.**

  **Profile 2: The Common Intermediate (Circumstantial/Constitutive Acceptance)**
  *   **Pattern:** You accept that character and situation matter, but outcomes do not.
  *   **Key Answers:** Q1(B) [Outcomes don't change blame], Q3(B) [Character matters], Q4(A) [Constitution matters], Q6(A) [Intent is king].
  *   **Diagnosis:** You believe who you are and where you are matters for moral assessment, but how the dice land (Resultant Luck) does not change your moral worth.
  *   **Label:** **Intermediate View (Nagel-Adjacent).**

  **Profile 3: The Mirror Image (Resultant Acceptance Only)**
  *   **Pattern:** You care about outcomes, but insulate character.
  *   **Key Answers:** Q1(A) [Outcomes change blame], Q3(B) [Character is stable], Q4(B) [You own your temper], Q6(B) [Success matters].
  *   **Diagnosis:** You hold agents responsible for what happens (Resultant), but insist they are the authors of their own character (rejecting Constitutive/Circumstantial luck).
  *   **Label:** **Resultant-Only View (Unnamed in literature, but logically distinct).**

  **Profile 4: The Realist (Full-Blooded Acceptance)**
  *   **Pattern:** You acknowledge luck influences almost everything.
  *   **Key Answers:** Q1(A), Q2(A), Q3(A), Q4(A), Q6(B).
  *   **Diagnosis:** You accept that moral status is permeable to luck in all forms. You are willing to say the survivor *is* a better man, and the Nazi collaborator is worse than their twin, solely due to circumstances.
  *   **Label:** **Full Moral Luck Acceptance.**

  **Profile 5: The Pragmatist (Two-Level View)**
  *   **Pattern:** Your answers differ between "Internal/Blame" and "External/Sanction."
  *   **Key Answers:** Q1(B) [Blame equal] BUT Q5(B) [Punishment differs]; OR Q7(C) [Guilt varies] BUT Q4(B) [Blame stable].
  *   **Diagnosis:** You separate the moral ledger from social practice. Luck might not change how *bad* someone is (Blame), but it changes how we must *treat* them (Sanction/Guilt).
  *   **Label:** **Two-Level / Domain-Specific View.**

  **Profile 6: The Skeptic (Revisionist/Deflationary)**
  *   **Pattern:** You chose options that undermine the coherence of blame itself.
  *   **Key Answers:** Q3(C) [Circumstances determine all], Q4(C) [Restraint not blame], Q9(A) or Q9(C) [Blame is false or merely useful].
  *   **Diagnosis:** You believe the phenomenon of moral luck shows our ordinary practices are incoherent. We should curtail blame rather than extend it to accommodate luck.
  *   **Label:** **Deflationary / Revisionist.**

  ---

  ### Part IV: Notes on Limitations and Logical Gaps

  **1. Indistinguishable Leaves: Compatibilism vs. Libertarianism**
  This instrument cannot separate the **Hard-Line Libertarian** (Character is not luck because it is self-chosen) from the **Compatibilist** (Character is luck/caused, but we hold you responsible anyway). Both will likely answer Q4 with "Equally Blameworthy."
  *   *Reason:* Both views yield the same verdict on responsibility despite disagreeing on the metaphysics of origin.
  *   *Resolution:* To separate them, a question regarding "Prior Choice" (e.g., "Did you choose the character that made the choice?") would be required. Given the focus on moral luck verdicts rather than metaphysics, these leaves remain merged in this diagnostic.

  **2. Unoccupied Cells of the Logical Space**
  The following combinations of answers represent logical spaces that no standard philosophical leaf occupies. If your answers map here, consider the diagnosis:

  *   **Cell A: Resultant Luck affects Wrongness, but not Blame.**
      *   *Verdict:* You think the act is "more wrong" if it succeeds, but the agent is "no more blameworthy."
      *   *Diagnosis:* **Incoherent.** Typically, if an act's wrongness scales with outcome, the agent's culpability for that act scales proportionally.
  *   **Cell B: Constitutive Luck affects Sanction, but not Blame or Wrongness.**
      *   *Verdict:* You think we should punish someone for their genes/temperament even if they aren't morally blameworthy for having them.
      *   *Diagnosis:* **Unattractive (Preventive Detention).** This view treats the agent as a carrier of a disease rather than a moral participant. It is explored in law (civil commitment) but rejected in retributive morality.
  *   **Cell C: Causal Luck affects Guilt, but not Sanction.**
      *   *Verdict:* The agent should feel terrible guilt because of determinism/causes, but society should not punish them.
      *   *Diagnosis:* **Unexplored / Masochistic.** This requires the agent to internalize a blame that external society has waived. It suggests a disconnect between first-person and third-person perspectives that is rarely defended.
  *   **Cell D: Circumstantial Luck affects Blame, but Temporal Distance negates it.**
      *   *Verdict:* You accept the 1929 Nazi case implies blame (Circumstantial), but the Temporal Case (Q8) implies no blame due to time.
      *   *Diagnosis:* **Merely Unexplored.** This suggests a "Statute of Limitations" on moral luck. While legally common, it is philosophically under-theorized whether time erodes moral luck differently than it erodes direct responsibility.
