  hi — I'm doing a historiography module this term and my essay is on the 20th-century shift in medicine away from "the doctor decides" and toward informed consent, and literally every draft I write turns into a story about how we gradually learned to respect patients. My supervisor says I'm ancestor shopping, and I think its her own made-up term, but I see the point: I pick which clinicians count as "the first to really get it" because I already know which side won.

  Her test — I'll call it the reversal test — goes like this. Suppose the episode had gone the other way and the losing practice had become the standard one. Would your narrative still have the same shape, the same heroes, the same turning points? If it wouldn't, then the outcome is doing explanatory work it isn't entitled to do, and what you've got is Whig history with the serial numbers filed off.

  The claim I want a number on. Call it P: for at least one real historical episode, a working historian could produce a narrative that (i) explains why things went the way they did, (ii) would come out structurally the same under the reversal test, and (iii) never quietly leans on the vocabulary of progress — words like "emerging", "pioneering", "lagged behind", "anticipated". It's a claim about what could be done, not about whether anyone has actually done it. I'd treat it as settled either by an actual narrative that survives the reversal test, or by an argument that no narrative could in principle.

  My credence is 0.55. My seminar leader puts it at 0.15 and mostly just says that explanation is backwards-looking by construction. I cant tell whether that's a real argument or a shrug.

  Give me your number, but decomposed, with a number and one line of justification for each term:

  - that explaining an outcome at all requires ranking causes by their contribution to that outcome
  - that such a ranking on its own forces failure of the reversal test, i.e. whether being outcome-dependent is fatal to a narrative or just cosmetic
  - that method and source discipline can train hindsight out of a historian
  - that the progress vocabulary is avoidable at all in a language that contains words like "pioneer"
  - that the three options are even exhaustive — the one my supervisor never considers is writing the episode as a genealogy of the present, deliberately making the present the object of explanation rather than the endpoint it was all heading for
  - whatever other terms you think belong

  Then show me how you combine them, which term you're least confident in, and where you think the gap between me at 0.55 and her at 0.15 most likely lives. And tell me what would move your number most: someone producing a narrative that survives the reversal test, or a decent argument that explanation is necessarily outcome-dependent?

  One last thing, if P comes out low: is the honest move for my essay to just declare itself a genealogy and stop pretending otherwise, or does that let me off too easily?

  Lead with the number in the first sentence, then the decomposition. No preamble and don't repeat the question back at me.
