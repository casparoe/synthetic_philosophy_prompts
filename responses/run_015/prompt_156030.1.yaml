      *   *The "Luck" Objection (Nagel/Levy):* If the loop closes one way vs. another, and that difference isn't determined by prior states (randomness) or is determined by prior states (determinism), it's still luck.
      *   *Neuroscientific Determinism:* If the "loop" is just neural firing patterns determined by prior physical states, the "self-modification" is an illusion of perspective.
      *   *The "Fully Pushed from Outside" Dilemma:* If the system is closed, inputs are external. If inputs are internal, they were previously external. There is no "inside" that isn't ultimately traceable to an "outside."
