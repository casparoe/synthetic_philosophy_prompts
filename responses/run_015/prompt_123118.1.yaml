      *   **Caruso (Hard Incompatibilist/Free Will Skeptic):** No free will (in the basic desert sense). Therefore, no one *deserves* punishment. Criminal justice should be modeled on public health quarantine. You isolate dangerous people to protect society, not because they deserve suffering. It's forward-looking, not backward-looking.
