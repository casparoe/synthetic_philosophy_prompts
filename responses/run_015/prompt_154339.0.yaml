      *   Section 4: Scoring the Narratives (Progression vs. Functionalism).
      *   Conclusion (Brief synthesis).

  *(Self-Correction on the "Single Requirement"):* The prompt asks to "Flag which single requirement does the most work in excluding inadequate candidates." I need to be explicit about this. I will select **The Morphology-Ontology Distinction** because confusing the *form* of complaint with the *status* of the complainant is the most common error in this field (e.g., assuming more lawsuits = more dignity).

  *(Self-Correction on Scoring):* Ensure I don't use numerical scores but qualitative assessment against the specific desiderata.

