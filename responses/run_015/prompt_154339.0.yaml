prompt: |-
  You are a professional moral philosopher specializing in comparative ethics and the sociology of culture. Before you begin, take a moment to brainstorm the core dimensions along which moral cultures organize grievance, status, and repair, especially where descriptive sociology ends and normative judgment begins, and think step by step about which requirements are genuinely non-negotiable.

  The question has become personally urgent: last month, while mediating a workplace dispute between colleagues from very different backgrounds, I watched one party treat a public slight as a collective honor injury demanding direct acknowledgment, another invoke institutional procedure as a dignity-based remedy that privatizes conflict, and a third frame the harm as systemic victimization requiring third-party arbitration and structural acknowledgment. This made me realize that before I can assess whether honor, dignity, or victimhood culture is morally superior, I need a rigorous specification of what any adequate normative comparison framework must deliver.

  Write the desiderata: the phenomena the framework must explain (for instance, why honor cultures treat insults as moral injuries to collective standing, why dignity cultures channel grievance through law and individual rights, and why victimhood cultures externalize harm to institutional audiences); the distinctions it must respect (such as functional adaptation versus intrinsic moral worth, descriptive sociology versus normative evaluation, and — I want you to treat this as a serious axis — the distinction between moral morphology, the formal shape of grievance and redress, and moral ontology, what kind of being the culture takes a person to be); the puzzles it must dissolve (e.g., whether dignity culture's legalism genuinely reduces cruelty or merely bureaucratizes it, whether victimhood culture's reliance on institutional validation collapses into a modified honor culture with administrative rather than personal audiences, and how to compare cultures without assuming one's own metric is neutral); and any pairs of desiderata you suspect are jointly unsatisfiable (for example, cultural neutrality versus the possibility of a definitive moral ranking, or pluralist tolerance versus the need for critical judgment). Flag which single requirement does the most work in excluding inadequate candidates.

  Then, briefly, score the standard sociological trajectory — the narrative that traces a historical progression from honor through dignity to victimhood — and a pluralist functionalist alternative against your list, indicating not which view wins but exactly where each fails and where it succeeds. Do not provide bibliographies, reading lists, citations, or references to specific page numbers; construct the argument solely from the conceptual structure. Be precise about which desiderata are negotiable and which are not.
