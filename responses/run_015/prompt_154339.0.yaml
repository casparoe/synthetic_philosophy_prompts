          *   Score the two narratives (Progression vs. Functionalism) based on successes/failures against the desiderata.
          *   **NO** bibliographies, citations, or page numbers.
          *   Tone: Rigorous, conceptual, precise, professional.

  2.  **Brainstorming & Conceptual Mapping (Internal Monologue):**
      *   *Core Dimensions:* How do cultures handle wrongs?
          *   Honor: Public, collective, direct action/restoration of face.
          *   Dignity: Private, individual, internal worth + legal/ procedural recourse.
          *   Victimhood: Systemic, external validation, structural change + administrative recourse.
      *   *Descriptive vs. Normative:* Sociology tells us *how* they work. Philosophy tells us *if* they are good. The framework needs to bridge this without reducing one to the other.
      *   *Morphology vs. Ontology:*
          *   Morphology: The "script" of the conflict (Who speaks? To whom? What is the remedy?).
          *   Ontology: The "substance" of the agent (Am I my clan? Am I an autonomous soul? Am a node in a power structure?).
      *   *Puzzles:*
          *   Is Dignity just Honor with lawyers? (Bureaucratized cruelty).
          *   Is Victimhood just Honor with HR? (Audience shift from peers to admins).
          *   How to judge without ethnocentrism?
      *   *Trade-offs:* Neutrality vs. Judgment. If I'm truly neutral, I can't condemn slavery in an honor culture. If I judge, I'm imposing an ontology.
      *   *The "One Requirement":* It needs to be the one that prevents the framework from collapsing into relativism or imperialism. Likely something about *human flourishing* or *agency*, but phrased structurally. Let's go with "Ontological Coherence" or "Capacity for Reflexive Critique." Actually, the prompt asks for what excludes inadequate candidates. The ability to distinguish *functional adaptation* from *moral truth* is key. Let's refine: The requirement must allow for *immanent critique* without assuming external neutrality. Let's call it "The Condition of Non-Arbitrary Normativity."

  3.  **Drafting the Desiderata:**
      *   Need to categorize them: Explanatory, Distinctive, Dissolutive, Trade-offs.
      *   *Explanatory:* Must explain the *logic* of the grievance, not just the behavior. Why is an insult a wound in Honor?
      *   *Distinctive:* Must separate Morphology (form) from Ontology (substance). Must separate Function (stability) from Worth (goodness).
      *   *Dissolutive:* Must tackle the "Honor vs. Dignity vs. Victimhood" continuum puzzles. Is Victimhood just new Honor?
      *   *Trade-offs:* Neutrality vs. Ranking.
      *   *The Flag:* Which one does the most work? The distinction between Morphology and Ontology. If you confuse the *way* a claim is made with *who* is making it, you fail.

  4.  **Drafting the Scoring (Progression vs. Functionalism):**
      *   *Historical Progression (Honor -> Dignity -> Victimhood):*
          *   Success: Explains macro-historical shifts. Captures the intuition of moral learning.
          *   Failure: Teleological bias (assumes later is better). Fails the neutrality test. Often conflates morphology with ontology (assumes legalism = deeper respect).
      *   *Pluralist Functionalism (Cultures as adaptations):*
          *   Success: High descriptive accuracy. Avoids ethnocentrism. Explains stability.
          *   Failure: Normative toothlessness. Cannot condemn harmful practices if they are "functional." Fails to account for internal dissent.

  5.  **Refining the "Single Requirement":**
      *   I need to choose the one that filters out the most bad theories.
      *   Candidate 1: Neutrality. (Too weak, leads to relativism).
      *   Candidate 2: Universal Rights. (Too strong, imposes one culture).
      *   Candidate 3: *The Morphology-Ontology Distinction.* If a theory can't separate the *mechanism* of redress from the *conception of the person*, it will confuse bureaucratic efficiency with moral progress. This seems the most philosophically robust choice for this specific prompt.

  6.  **Review against Constraints:**
