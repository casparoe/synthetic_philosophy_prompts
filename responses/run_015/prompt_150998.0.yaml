      *   *Decision:* The framing is *not* entirely off, but the slogan is often used as a conversation-stopper rather than a precise argument. I need to validate the user's intuition that this needs disambiguation while acknowledging the slogan's inherent vagueness. I will proceed with the menu but preface it with a note on the slogan's utility.

