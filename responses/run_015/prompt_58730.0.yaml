      Dear friend, it is wonderful to hear that you are bringing these concepts to undergraduates, and while the constraint of continuous prose makes outlining mechanics slightly tricky, I believe I can convey the structure of this exercise clearly enough for you to run it smoothly. The game is called the Concorde Protocol and it is designed to run for seventy-five minutes with six teams of four students each, requiring only printed sheets, pens, and some form of play money or tokens that you can improvise with slips of paper. You will start by giving each team one hundred units of currency and explaining that they are engineering firms competing to complete a prototype project, but you must withhold the full payoff structure until the end to prevent premature calculation from overriding the emotional experience of the investment. In the first round, every team must invest forty units to begin construction, and then you will privately hand each team a card indicating their project status, where most teams receive a damaged status card that implies a high cost to finish, while one or two receive a clear path card, ensuring that most teams face a dilemma while a minority feel justified in continuing. After receiving these cards, you announce that to complete the project and claim the prize, teams must invest an additional sixty units, but those who choose to abandon the project now may keep their remaining twenty units and receive a small consolation prize of ten units, whereas teams that invest the additional sixty units will roll a die to determine success, with a damaged status requiring a roll of five or six to win the main prize of two hundred units, and a clear path requiring only a three or higher.

      The mathematical trap here is that for the damaged teams, the expected value of continuing is negative because the cost of sixty plus the sunk forty exceeds the probabilistic reward, yet the psychological pull of having already spent forty units will urge them to throw good money after bad to avoid realizing the loss. To address the nuance of perseverance, you will introduce a rule before the second round that any team that completes a project, regardless of success, gains a reputation token that would be valuable in a hypothetical third round, simulating the real-world benefit of self-trust and signaling reliability, even though this specific game ends after round two. This creates the tension you requested because teams must weigh the immediate negative expected value against the abstract benefit of being the kind of team that finishes what it starts, mirroring the philosophical dispute about whether honoring sunk costs is ever rational when viewed as a commitment device. You should allocate about twenty minutes for setup and round one, twenty minutes for round two and the decision phase, and the remaining thirty-five minutes for the debrief, which is where the actual learning will solidify. During the debrief, you need to ask the teams that quit why they felt relief versus regret, and ask the teams that continued whether they did so because they calculated the odds or because they felt they had too much invested to stop, writing their reasons on the board without labeling them as right or wrong initially.

      Once you have mapped their reasoning, you can introduce the term sunk cost fallacy and distinguish between backward-looking reasons, such as we already spent the money, and forward-looking expected value, such as what is the probability of success multiplied by the prize minus the cost to finish. You must explicitly discuss the teams that continued despite the bad odds and validate their intuition that there is value in perseverance, but clarify that in this isolated game the reputation token was worth less than the cost to acquire it, whereas in real life the reputation benefit might outweigh the financial loss, which is the key philosophical distinction the game cannot fully reproduce. A predictable problem on the first run is that students will treat the play money as valueless and make random choices, so you should incentivize them by offering a small real reward, like candy or extra credit, to the team with the highest final asset count, which grounds the decisions in tangible stakes. Another issue is that teams may try to collaborate or share information about their status cards, so you must enforce strict silence between teams and collect the status cards immediately after the decision phase to prevent cheating. You might also find that some teams finish the math too quickly and disengage, so you should encourage them to discuss the emotional weight of the decision within their group before writing down their choice, forcing them to articulate the feeling of loss aversion.

