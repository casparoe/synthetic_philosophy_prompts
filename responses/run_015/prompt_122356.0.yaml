      *   *changes_if_essentialism_adopted:* "Adoption would be voided as ontologically impossible; paternity could never be transferred; multi-parenting restricted to genetic contributors."
      *   *changes_if_essentialism_rejected:* "DNA testing would be evidentiary only; adoption would be the default mode of kinship; contractual intent would fully supersede biological contribution."

