      *   *changes_if_essentialism_adopted:* If origin is metaphysically constitutive: Adoption becomes impossible (cannot change who you are). Multi-parenting might be restricted to genetic contributors only. Paternity could never be rebutted by social factors.
      *   *changes_if_essentialism_rejected:* If origin is irrelevant: DNA testing loses weight. Adoption is the default. Multi-parenting is purely contractual/functional.

  5.  **Refining the JSON Content (Self-Correction/Nuance):**
