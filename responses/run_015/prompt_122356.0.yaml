      *   *Tension:* DNA proves "truth" in paternity suits, but adoption erases that "truth" legally.

  3.  **Analyze "Origin Essentialism":**
      *   *Definition:* Kripkean necessity. You are essentially the product of *this* specific sperm and *this* specific egg. If different gametes, it's a different person.
      *   *Legal Application:* Does the law act as if the child *is* their genetics, or just *connected* to them?
      *   *Observation:* The law treats genetic origin as *evidentiary* and *normative* for default assignments, but *overridable* for social welfare. It does not treat it as metaphysically constitutive of legal personhood (otherwise adoption would be impossible or fraudulent).

  4.  **Drafting the Content (Iterative Process):**

