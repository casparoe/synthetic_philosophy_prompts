      *   *Did I address "Inaction as choice"?* Need to make sure I distinguish between *omission* and *decision*.
      *   *Historical Note:* Buridan didn't actually think the donkey starved. He thought the will could suspend judgment. Leibniz used it to argue against libertarian freedom. Should mention this briefly to ground the seminar context.

