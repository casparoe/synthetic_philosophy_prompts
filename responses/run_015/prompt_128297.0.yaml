  1. Anachronism: Ghazālī's primary motive was theological (protecting miracles), not solving modern dispositionalist regress problems.
  2. Stability: Denying inherent powers makes divine custom (*ʿāda*) as contingent and mysterious as natural necessity, potentially undermining scientific predictability.

  Al-Ghazālī's occasionalism is not merely a theological safeguard for divine omnipotence but a rigorous metaphysical critique of inherent causal powers (*quwā*). By denying efficacy to created substances, Ghazālī anticipates a modern problem for dispositionalism: if powers are intrinsic, substance identity becomes causally overdetermined, triggering a regress where every disposition requires further constituent dispositions. Ghazālī resolves this by relocating efficacy entirely to the divine will, thereby severing the ontological link between creaturely nature (*ṭabʿ*) and effect. This reading transforms the *Tahāfut* from a dogmatic defense into a conceptual analysis of causation, challenging the coherence of independent natural necessity.

  This move offers two distinct advantages regarding substance and science. First, it halts the metaphysical regress regarding identity conditions. If fire intrinsically possesses burning power, one must ask what grounds this power in the substance's parts, leading to infinite subdivision. By denying inherent efficacy, Ghazālī stops this regress at the divine agent who acts without material composition. Second, it preserves empirical predictability without ontological commitment. Regularities are maintained by divine custom (*ʿāda*) rather than natural necessity. Thus, prediction remains reliable because God's habits are stable, even if the connection between cause and effect is contingent. Science tracks divine custom, not intrinsic natures, avoiding the trap of reifying powers that cannot be coherently grounded in substance identity conditions.

  However, the strongest objection charges that this view renders custom as mysterious as necessity. If God wills every event directly, what guarantees the stability of *ʿāda* besides another act of will? This risks making the world unintelligible and science merely lucky. Yet, Ghazālī would reply that trusting divine consistency is epistemologically simpler than positing invisible, inherent powers. While the primary motive was theological, the logical structure successfully isolates the incoherence of intrinsic causation, offering a viable alternative to dispositional regress that maintains phenomenological stability without metaphysical baggage.
