  *Refining the "Correspondence" point:* Peirce defines truth as correspondence with the Real. James defines it as agreement with reality (but reality includes relations and previous truths). They actually both use the word "correspondence" or "agreement" but mean different things. To get agreement, I must specify they reject the *photographic* or *static* correspondence theory.

  *Refining the "Long Run":* For Peirce, it's an ideal limit. For James, the "cash value" is immediate or short-term. The crux is whether a belief can be "true now" but "false later." James says yes. Peirce says no (it wasn't *really* true, just believed to be). This is a key substantive difference.

  *Let's finalize the Verbal/Substantive verdict:* It is *both*. The definition is verbal (Teleological vs. Instrumental). The metaphysics is substantive (Realism vs. Radical Empiricism/Humanism). I will state this nuance.

