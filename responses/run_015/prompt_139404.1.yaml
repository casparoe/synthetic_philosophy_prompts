answer: |-
  Here is the principle that underlies your gut calls, tightened into a framework you can actually use.

  ### The Principle: Non-Consensual Nullification

  **The Rule:**
  > "We intervene when a player's **invested labor or identity** is nullified by another actor through means **outside the consented rules of engagement.**"

  This principle rejects the idea that you are protecting "property." You are protecting **agency**. You are protecting the player's right to decide how their time and self-expression are spent within the magic circle of the server.

  It has three clauses. For a ruling to warrant a rollback or ban, the situation must test positive on **Investment** and **Means**, while testing negative on **Consent**.

  1.  **Investment (The Stake):** Did the victim invest irrecoverable time, effort, or emotional identity into the thing lost? (Digits don't matter; *labor* matters).
  2.  **Consent (The Risk):** Did the victim agree to the risk of this loss via server rules or game mechanics? (PvP zones, market volatility, dev updates).
  3.  **Means (The Method):** Did the actor achieve the result through deception, exploitation, or coercion, rather than intended gameplay?

  ---

  ### How It Maps to Your 10 Cases

  Here is where your gut aligns, where it conflicts, and which clause is doing the work.

  *   **1. The Trade Scam:** **Intervene.**
      *   *Investment:* High (3 months farming).
      *   *Consent:* None (Trade implies honesty).
      *   *Means:* Deception (Bait and switch).
      *   *Verdict:* Clear violation. This is the baseline.

  *   **2. The PvP Loss:** **Do Nothing.**
      *   *Investment:* Moderate (Gear).
      *   *Consent:* **Yes** (Open season area).
      *   *Means:* Intended Mechanics (Combat).
      *   *Verdict:* Failure of Consent clause. They opted into this risk.

  *   **3. PvP + Harassment:** **Intervene (on the harassment).**
      *   *Investment:* Identity/Dignity (Quitting the server).
      *   *Consent:* **No** (PvP consent does not cover DMs/harassment).
      *   *Means:* Coercion/Social Engineering.
      *   *Verdict:* The gear loss is Case 2. The quitting is a violation of *Identity*. You punish the harassment, not the kill.

  *   **4. The Griefed Cathedral (+ Recording):** **Intervene (Harder with recording).**
      *   *Investment:* High (Build time).
      *   *Consent:* **No** (Private plot).
      *   *Means:* Exploit (Bypassing permissions).
      *   *Why Recording Matters:* This triggers the **Identity** clause. Destroying the build nullifies *Labor*. Recording it nullifies *Dignity* by turning private loss into public humiliation. The harm is compounded.

  *   **5. The Hacked Inactive Account:** **Drop This.**
      *   *Investment:* High (Past labor).
      *   *Consent:* No.
      *   *Means:* Exploit.
      *   *The Conflict:* Your gut says "something bad happened," but also "weaker." The framework tells you to **trust the 'weaker' feeling.** Without an active subject to experience the loss of agency, there is no *play* to protect. It is database hygiene, not a player dispute. Do not burn mod energy here.

  *   **6. The Duping Bug:** **Intervene.**
      *   *Investment:* High (Original farmer's scarcity value).
      *   *Consent:* No (Nobody consents to economic collapse).
      *   *Means:* Exploit.
      *   *Verdict:* This isn't theft of items; it's **theft of value.** You nullified the labor of the original farmer by making their effort meaningless.

  *   **7. RMT vs. Non-RMT Currency:** **Intervene Both, Quantify Differently.**
      *   *Investment:* Time/Effort (Both).
      *   *Consent:* No.
      *   *Means:* Theft.
      *   *Verdict:* Your hesitation is dangerous. Stealing non-tradeable currency is still stealing *time*. The principle holds: It is Non-Consensual Nullification of Labor. RMT just makes damages easier to calculate; it doesn't make the theft "more real." Treat them the same, acknowledge the real-world stakes in the ban reason.

  *   **8. Devs Give Away Cosmetic:** **Do Nothing.**
      *   *Investment:* Money/Time.
      *   *Consent:* **Yes** (ToS always grants devs final authority on economy).
      *   *Means:* Authority (Not player malice).
      *   *Verdict:* Failure of Means clause. This is a contract change, not a player violation.

  *   **9. The Killed NPC:** **Intervene.**
      *   *Investment:* Community Access (Shared agency).
      *   *Consent:* No (Quests are shared resources).
      *   *Means:* Exploit/Malice.
      *   *Verdict:* This is **Collective Agency.** One player nullified the labor/time of the whole server. It fits the principle if you view "Server Progress" as the investment.

  *   **10. MUD Assault vs. Haircut:** **Intervene Assault, Ignore Haircut.**
      *   *Assault:* Violation of **Bodily Autonomy** (Identity). Even in text, forcing an avatar to act against will is a violation of the player's agency over their self-representation.
      *   *Haircut:* Subjective Opinion. No nullification of labor or agency.
      *   *Verdict:* The line is **Control.** Did the actor seize control of the victim's representation? Yes (Assault). No (Haircut).

  ---

  ### Which Gut Calls to Drop

  You asked which verdicts you should stop trusting. The framework identifies two:

  1.  **Drop Case 5 (The Inactive Hack).**
      *   *Why:* Moderation exists to facilitate *play*. If there is no active player, there is no agency to violate. You are grieving for a ghost. Restore the items if it's easy, but do not treat it as a moral injury comparable to Case 1. It drains your energy for no social return.
  2.  **Refine Case 7 (RMT Distinction).**
      *   *Why:* Do not let yourself think non-RMT theft is "less theft." It creates a two-tier justice system that confuses players. The theft is of *time*. RMT is just a multiplier. Keep the ban consistent; adjust the restitution.

  ---

  ### Predictions for New Cases

  Here is how the principle handles the scenarios you haven't faced yet.

  **1. A single-player permadeath run that no one will ever see.**
  *   **Ruling:** No Intervention.
  *   **Why:** Fails **Investment (Social).** In a multiplayer server, "Investment" includes social proof and legacy. A purely private run, even on a public server, is a self-imposed challenge. Unless another player *deceived* them into thinking it wasn't permadeath, the loss is consented risk.

  **2. A world built from a seed that will never be generated again.**
  *   **Ruling:** Intervention if destroyed by player; No Intervention if lost to bug/crash.
  *   **Why:** Scarcity alone isn't Investment. *Labor* is. If they built on it, it's protected Labor. If they just claimed the seed, it's potential. However, if a player *exploits* to steal the seed claim, it's Non-Consensual Nullification of Opportunity.

  **3. A companion character (NPC) talked to for 200 hours that a patch deletes.**
  *   **Ruling:** No Intervention against Devs; Rollback/Comp against Hacker.
  *   **Why:** This is the hardest case. It passes **Investment (Identity)** heavily. But it fails **Means** if it's a Dev patch (Case 8 logic). Players consent to Dev authority. If a *player* found a way to trigger that deletion early? That is a violation. You cannot protect players from the game changing, only from each other.

  **4. Text-only vs. Full VR with Haptics.**
  *   **Ruling:** VR violations warrant stricter penalties.
  *   **Why:** Your chest is right. The **Investment (Identity)** clause is weighted by immersion. In text, my avatar is a puppet. In VR, my avatar is a *body*. Violating bodily autonomy in VR creates a stronger psychological trauma than in text. The *principle* is the same (Violation of Agency), but the *severity* scales with the depth of the immersion. A "virtual assault" in VR is closer to physical assault in psychological impact than a text MUD is. You are allowed to weigh this in sentencing.

  ### The Read-Out

  When you post a ruling, don't paste the philosophy. Use this template:

  > "This ruling is based on **Consented Agency.**
  > 1. You invested time/effort/identity into this.
  > 2. You did not consent to lose it via [Deception/Exploit/Harassment].
  > 3. Therefore, the loss is nullified.
  >
  > In the future, understand that [PvP/Market Risk/Dev Updates] are consented risks. [Scams/Exploits/Identity Violations] are not. We protect your labor, not your luck."

  This keeps you consistent. It tells players *why* they got rolled back without getting bogged down in "is digital property real?" debates. It focuses on the only thing that actually matters: **Did someone cheat the social contract?**
