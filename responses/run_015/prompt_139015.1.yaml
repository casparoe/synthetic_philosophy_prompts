  ### Tier Sorting and Boundaries

  Using the **Transformative Force** score, the cases sort into four tiers:

  1.  **Clean (80–100):** Case 6 (85).
  2.  **Mildly Defective (50–79):** Case 8 (70), Case 9 (60).
  3.  **Seriously Defective (25–49):** Case 4 (40), Case 5 (35), Case 1 (30).
  4.  **Void (0–24):** Case 2 (20), Case 7 (15), Case 3 (10), Case 10 (0).

  **Boundary Analysis:**
  The boundary between **Clean and Mildly Defective (80)** does real work by distinguishing technical or formal defects (Case 6: patient didn't read the clause) from substantive impairments of agency (Case 8: background coercion; Case 9: fatigue). A consent can be morally robust even if the agent is inattentive, but not if their capacity or baseline options are compromised.

  The boundary between **Mildly Defective and Seriously Defective (50)** separates cases where consent still functions to permit the act despite stains (Case 9: waiver stands but is shaky; Case 8: job is accepted) from cases where the authorization is too corrupted to reliably permit the act (Case 4: medical risk unknown; Case 5: lie told). Below 50, the consent is too unreliable to bear the moral weight of the transaction.

  The boundary between **Seriously Defective and Void (25)** marks the shift from defective authorization to effective coercion or absence of consent (Case 1, 2, 3, 7, 10). Here, the "choice" is either manufactured by threat or exceeded in scope, rendering the consent morally inert to change the deontic status of the act.

