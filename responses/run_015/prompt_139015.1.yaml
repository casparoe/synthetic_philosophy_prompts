  Seven cases show a divergence greater than 25 points between Transformative Force and Blameworthiness:

  *   **Case 1 (Gap 60):** The consent is weak (30) because the duty-to-rescue baseline was violated, but blame is high (90) because the agent actively created the coercive leverage.
  *   **Case 2 (Gap 65):** Consent is voided by threat (20), but blame is slightly lower (85) than blackmail because the leverage (selling photos) was lawfully obtained, complicating the moral baseline.
  *   **Case 3 (Gap 90):** Consent is nearly void (10), but blame is maximal (100). This highlights that an act can be perfectly blameworthy even if the resulting "agreement" has zero moral force.
  *   **Case 5 (Gap 45):** Consent is seriously defective (35) due to the lie, but blame is high (80) because the deception was deliberate and responsive to a direct query.
  *   **Case 6 (Gap 65):** Consent is largely valid (85), but blame is low (20). The defect lies primarily with the patient's inattention, not the agent's malice.
  *   **Case 7 (Gap 55):** Consent is void regarding the excess (15), but blame (70) is mitigated slightly by the lack of medical risk, though the procedural violation remains serious.
  *   **Case 8 (Gap 40):** Consent is functional (70), but blame is low (30). The divergence arises because the coercive pressure stems from structural background injustice, not the employer's direct action.
  *   **Case 10 (Gap 40):** Consent is absent (0), but blame is moderate (40). Necessity reduces blameworthiness for the trespass even though no consent exists to transform the act's status.

  ### Weighty Distinction, Disagreement, and Factual Detail

  **Most Weighty Distinction:**
  The distinction between **Volitional Constraints (Threats/Coercion)** and **Informational/Scope Defects** carries the most weight in this ordering. Cases driven by volitional defects (1, 2, 3, 8) cluster at the extremes (either Void or Mildly Defective depending on the source of the threat), whereas informational defects (4, 5) consistently land in the Seriously Defective tier. This suggests that in this rubric, *how* the choice was constrained matters more than *what* was known about the choice; a coerced "yes" is morally weaker than a misinformed "yes."

  **Sharpest Philosophical Disagreement:**
  I expect professional philosophers to disagree most sharply about **Case 8 (Unjust Background)**. Libertarians may argue the consent is Clean (100) because the employer improved the worker's baseline, while egalitarians or Marxists may argue it is Void (0) because the background conditions render the choice non-voluntary. My score of 70 attempts a compromise, but this is the natural fault line in consent theory regarding structural injustice.

  **Unspecified Factual Detail:**
  In **Case 4 (The Standard Script)**, my score depends heavily on whether the **specific complication actually materialized**. If the patient suffers the 1-in-5 complication that they were told was 1-in-50, the blameworthiness and the retrospective invalidity of the consent spike toward 100. If the procedure goes perfectly, the transformative force of the consent holds firmer (closer to 60), as the informational defect caused no ex post harm.
