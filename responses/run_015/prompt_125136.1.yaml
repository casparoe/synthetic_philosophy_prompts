answer: |-
  **Conceptual framing and branch justification**

  This taxonomy isolates the structural friction between Buddhist soteriology and analytic consequentialism by mapping the logical space rather than historical schools. The root question establishes the stakes of aggregation, forcing a stance on whether welfare summation is the ethical telos. The first split distinguishes karma as moral physics versus psychological hygiene, determining whether outcomes matter intrinsically or merely as byproducts of mental states. The second split, utilizing a diagnostic scenario, tests whether the Bodhisattva vow mandates utility maximization or non-calculative responsiveness to suffering. The third split addresses the metaphysical precondition for aggregation: whether emptiness dissolves the countable units required for summation or whether conventional designations sustain moral patients. The final split categorizes the epistemic status of such reasoning, distinguishing pragmatic utility from ultimate truth. The scenario forces a choice between direct welfare intervention and indirect merit generation, revealing whether the framework prioritizes suffering's cessation or the agent's spiritual alignment. This structure avoids historical labels to reveal the underlying logical commitments available to any systematic interpreter of Buddhist ethics, allowing participants to locate their own theoretical commitments without recourse to sectarian authority.

  **The taxonomy tree**

  **Root:** Does Buddhist ethical practice aim at the maximization of aggregate welfare across sentient beings?

  **Node 1 (Karma):** Does karma function primarily as a causal mechanism tracking welfare outcomes for agents, or does it operate mainly through mental purification or ritual efficacy that is not scaled by outcome magnitude?

  **Node 2 (Aggregation Scenario):** Imagine a practitioner who can either relieve intense suffering in one being immediately or perform an action traditionally understood to generate merit benefiting many beings only indirectly. Does the obligation require maximizing immediate relief (optimizing) or honoring the merit-generation (refusing aggregation)? *[Scenario deployed here]*

  **Node 3 (Ontology):** Does the doctrine of emptiness undermine the individuated agent-patient ontology that consequentialist calculation requires, or does conventional designation preserve enough structural reality to support aggregation?

  **Node 4 (Truths):** Does the conventional-ultimate truth distinction permit consequentialist reasoning only instrumentally at the conventional level, or does it render such reasoning ultimately incoherent?

  **Leaves:**

  1.  **Karma-Tracking Welfare Maximization:** Affirms karma tracks welfare, optimizes scenario, accepts conventional agents, uses reasoning instrumentally. *Awkward commitment:* Must quantify suffering despite emptiness warnings against reification.
  2.  **Ritual Purificationism:** Denies karma tracks welfare, chooses merit action, denies conventional agents, deems reasoning incoherent. *Awkward commitment:* Cannot explain why suffering matters morally if only internal mind states matter.
  3.  **Conventional Consequentialism:** Affirms karma tracks welfare, optimizes scenario, accepts conventional agents, uses reasoning instrumentally. *Awkward commitment:* Risks reifying selves at the ultimate level while denying it theoretically.
  4.  **Non-Aggregating Compassionism:** Denies karma tracks welfare, refuses optimization, accepts emptiness undermines agents, uses reasoning instrumentally. *Awkward commitment:* Cannot justify saving many over one in triage situations without arbitrary preference.
  5.  **Ultimate Silence View:** Affirms karma tracks welfare, optimizes scenario, denies conventional agents, deems reasoning incoherent. *Awkward commitment:* Practically acts consequentialist while theoretically denying its possibility exists.
  6.  **Empty Ontology Aggregation:** Affirms karma tracks welfare, optimizes scenario, denies conventional agents, uses reasoning instrumentally. *Awkward commitment:* Aggregates welfare across entities deemed ontologically unreal at the ultimate level.

  **Empty spaces and inseparability notes**

  Two logical positions remain unoccupied due to doctrinal incoherence. First, a view accepting welfare aggregation but denying emptiness affects moral ontology is unstable; if emptiness is universal, it must negate intrinsic moral agents, making aggregation metaphysically groundless. Second, a view treating compassion as purely calculative while rejecting karma's causal efficacy severs the mechanism linking action to welfare, rendering the calculation causally impotent. These spaces are empty because they break the internal logic of the system rather than merely being unexplored.

  Regarding inseparability, the tree cannot genuinely separate the **Conventional Consequentialist** from the **Ultimate Silence View** in practical application. Both optimize welfare in the scenario and accept karma's tracking. The distinction lies solely in whether they label the reasoning "ultimately incoherent." This collapse is due to unexplored phenomenological territory regarding practitioner intent; without access to the agent's metaphysical beliefs during action, the external ethical behavior is identical. Thus, the tree distinguishes them theoretically but fails empirically, suggesting the Two Truths distinction may be epistemically opaque to outside observation.
