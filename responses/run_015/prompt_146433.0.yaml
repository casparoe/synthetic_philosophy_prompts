answer: |-
  # The Liberty Sorting Tree

  This flowchart is designed to bypass the labels ("I'm a negative libertarian!") and force you to react to concrete tensions. Start at **Branch 1** and follow the arrows based on your intuition about the case.

  There are **8 Branch Points**. Your path will lead you to one of the **Leaves** (positions) at the bottom.

  ---

  ### BRANCH 1: The Benevolent Monarch
  **Case:** You live under an absolute monarch who has the legal power to imprison you or seize your property at any time, without trial. However, he is kind, loves his subjects, and *never* actually interferes with you. You live exactly as you wish.
  **Question:** Is your liberty reduced simply by the *existence* of his power over you, even if he never uses it?

  *   **YES (Power alone reduces liberty)** → Go to **Branch 2**.
  *   **NO (Only actual interference reduces liberty)** → Go to **Branch 5**.

  ---

  ### BRANCH 2: The Natural Obstacle
  **Case:** You want to travel to a distant country, but you cannot afford the ticket. No human is stopping you; it is simply a lack of resources (economic "nature").
  **Question:** Is this lack of capacity a loss of *liberty*, or just a lack of *power*? (i.e., Are you "unfree" to go, or just "unable"?)

  *   **YES (Lack of capacity = Unfreedom)** → Go to **Branch 3**.
  *   **NO (Only human constraints = Unfreedom)** → Go to **Branch 4**.

  ---

  ### BRANCH 3: The Source of Capacity
  **Case:** You are unable to travel due to a natural disaster that destroyed your savings (no human agent involved).
  **Question:** Does this natural misfortune reduce your liberty in the same way a tyrant locking you up would?

  *   **YES (Obstacles reduce liberty regardless of source)** → **LEAF A: Strong Positive Liberty (Effective Freedom)**.
      *   *View:* Liberty is the effective capacity to act. Nature and humans can both destroy it.
  *   **NO (Only human dependency reduces liberty)** → **LEAF B: Resource-Dependent Republicanism**.
      *   *View:* Liberty is non-domination. You need resources to avoid being dominated, but nature itself doesn't make you unfree, only vulnerable.

  ---

  ### BRANCH 4: The Arbitrariness Test
  **Case:** You are subject to a strict legal system that interferes with your choices constantly (high taxes, many laws), but the laws are applied predictably, follow due process, and track the common interest (they are not arbitrary).
  **Question:** Is this interference a violation of your liberty, or is it compatible with freedom?

  *   **YES (Interference violates liberty, even if non-arbitrary)** → **LEAF C: Pure Negative Liberty**.
      *   *Wait, you came from Branch 2 (Power reduces liberty).* If you think power reduces liberty *but* non-arbitrary interference also reduces liberty, you hold a **Hybrid Status/Interference View**.
      *   *Note:* This is a rare, unstable position. Usually, if you care about power (Branch 1), you care about *arbitrary* power (Republicanism). If you care about interference (Branch 4), you usually don't care about unused power (Negative).
  *   **NO (Non-arbitrary interference is compatible with liberty)** → **LEAF D: Strict Republican Liberty**.
      *   *View:* Liberty is non-domination. You are free as long as no one has arbitrary power over you, even if they interfere for your own good or the common good.

  ---

  ### BRANCH 5: The Covert Nudge
  *(You arrived here because you think the Monarch's unused power doesn't reduce liberty.)*
  **Case:** A benevolent AI subtly alters the options you see on your screen to steer you away from unhealthy food. You do not notice the manipulation, and you choose the healthy option willingly.
  **Question:** Has your liberty been reduced?

  *   **YES (Manipulation reduces liberty)** → Go to **Branch 6**.
  *   **NO (Unnoticed influence is not interference)** → Go to **Branch 7**.

  ---

  ### BRANCH 6: The Reason for Reduction
  **Case:** Regarding the AI Nudge: Why is it a loss of liberty?
  **Question:** Is it because you were *interfered with* (your environment was tampered with), or because your *autonomy was undermined* (you didn't truly choose)?

  *   **BECAUSE ENVIRONMENT TAMPERED** → **LEAF E: Objective Negative Liberty**.
      *   *View:* Liberty is about the objective absence of obstacles. Covert tampering counts as an obstacle, even if you didn't feel it.
  *   **BECAUSE AUTONOMY UNDERMINED** → **LEAF F: Positive Liberty (Self-Mastery)**.
      *   *View:* Liberty is about being the true author of your choices. If your will is manipulated, you are not free, regardless of external obstacles.

  ---

  ### BRANCH 7: The Economic Squeeze
  *(You arrived here because you think unnoticed nudges don't reduce liberty.)*
  **Case:** You are legally free to quit your job, but if you do, you will starve. There is no safety net.
  **Question:** Are you free to quit?

  *   **YES (Legal permission = Freedom)** → **LEAF G: Hard Negative Liberty**.
      *   *View:* Liberty is strictly the absence of deliberate human interference. Economic necessity is unfortunate, but not a loss of liberty.
  *   **NO (Economic necessity = Unfreedom)** → **LEAF H: Effective Positive Liberty**.
      *   *View:* Liberty requires the actual ability to exercise choices. Without resources, legal rights are hollow.

  ---

  ### BRANCH 8: Adaptive Preferences
  *(This branch applies to LEAF F and LEAF H users who want to refine their Positive Liberty view.)*
  **Case:** A person born into slavery says, "I do not wish to be free; I prefer my master's care." They have adapted their desires to their circumstances.
  **Question:** Is this person free?

  *   **YES (Satisfaction of actual desires = Freedom)** → **LEAF I: Preference-Satisfaction Liberty**.
      *   *View:* Freedom is getting what you want. If you want submission, you are free in submission. (Often collapses into Negative Liberty).
  *   **NO (Desires must be authentic/rational = Freedom)** → **LEAF J: Rationalist Positive Liberty**.
      *   *View:* Freedom is acting according to your "higher" or "rational" self. Adaptive preferences are a distortion of freedom, even if they feel good.

  ---

  # The Leaves: Positions & Gaps

  Here is what your path tells you about your philosophical commitments, including the "unoccupied" or "blurry" spots in the taxonomy.

  ### 1. Pure Negative Liberty (Leaves G, E)
  *   **Core Commitment:** Liberty is the absence of deliberate human interference.
  *   **Blind Spot:** Cannot distinguish between a benevolent dictator and a democracy (Branch 1). Often struggles with covert manipulation (Branch 5) unless it counts as physical tampering.

  ### 2. Strict Republican Liberty (Leaf D)
  *   **Core Commitment:** Liberty is the status of not being subject to arbitrary power.
  *   **Blind Spot:** Distinguishes clearly between a master who doesn't interfere (unfree) and a state that interferes non-arbitrarily (free).
  *   **Gap Check:** Can you be a Republican who denies resources matter (Branch 2 = NO)?
      *   *Status:* **Theoretically Possible, Practically Unstable.** You can claim domination is purely a legal status. However, most theorists argue that without a material base, you are vulnerable to domination, making the distinction between "status" and "capacity" collapse in practice.

  ### 3. Resource-Dependent Republicanism (Leaf B)
  *   **Core Commitment:** Liberty is non-domination, but domination is constituted by vulnerability, which requires resources to fix.
  *   **Blind Spot:** **The Indistinguishability Problem.** This view often looks identical to **Effective Positive Liberty (Leaf H)** in policy outcomes. Both demand a social safety net.
      *   *The Difference:* The Republican says "Give them money so no one can boss them around." The Positive Libertarian says "Give them money so they have the capacity to act."
      *   *Workshop Note:* This is the hardest distinction to maintain in concrete cases. If your tree lands here, ask: "If a natural disaster makes everyone equally poor, are they unfree?" Republican says No; Positive says Yes.

  ### 4. Strong Positive Liberty (Leaves A, J)
  *   **Core Commitment:** Liberty is self-mastery or effective capacity.
  *   **Blind Spot:** Risks paternalism. If freedom is "doing what your rational self would want," who defines the rational self? (Branch 8).
  *   **Gap Check:** Is there a position that combines **Positive Liberty (Capacity)** with **Negative Liberty (No Domination focus)**?
      *   *Status:* **Unoccupied/Incoherent.** If you care about capacity (Positive), you usually care about *why* the capacity is missing. If it's missing because of a dominator, you're a Republican. If it's missing because of nature, you're a Pure Positive theorist. Trying to separate capacity from the source of constraint usually leads to confusion.

  ### 5. The "Unoccupied" Hybrid (Leaf C path)
  *   **The Position:** "Unused power reduces liberty (Republican), BUT non-arbitrary interference also reduces liberty (Negative)."
  *   **Verdict:** **Conceptually Tense.**
      *   *Why:* Republicanism usually justifies interference if it prevents domination (non-arbitrary). Negative liberty usually ignores unused power. Holding both means you think a benevolent monarch makes you unfree (Branch 1), AND a democratic tax law makes you unfree (Branch 4).
      *   *Who holds this:* Anarchists or Radical Liberals who view *all* dependency and *all* coercion as liberty-reducing. It is not incoherent, but it is a "maximalist" view that leaves very little room for political authority.

  ### 6. Preference-Satisfaction (Leaf I)
  *   **The Position:** Freedom is getting what you happen to want.
  *   **Verdict:** **Often Collapses.**
      *   *Why:* If a slave wants to serve, they are free. This view often ends up looking like Negative Liberty (no one is stopping them from doing what they want), but it fails the "Adaptive Preferences" test (Branch 8) that most modern philosophers accept as a genuine loss of freedom.

  ---

  # Workshop Facilitator Notes: Where the Tree Blurs

  Use these points to spark debate when the group thinks they've been neatly sorted.

  1.  **The Republican/Positive Blur (Leaves B vs H):**
      *   The tree separates these at Branch 2 (Natural Obstacles). But in the real world, most "natural" obstacles (poverty, illness) are exacerbated by human structures. Ask the group: *Is it possible to be resource-poor without being dominated?* If they say no, Republicanism and Positive Liberty merge.

  2.  **The Covert Nudge (Branch 5):**
      *   Negative Libertarians often struggle here. If I don't know I'm being nudged, I'm not "interfered with" in a way I feel. But my options were manipulated. Ask: *Does liberty require transparency, or just non-interference?*

  3.  **The Benevolent Monarch (Branch 1):**
      *   This is the sharpest knife. If someone says the Monarch *does* reduce freedom, push them: *What if the Monarch is an AI programmed to never harm you?* If they still say "unfree," they are committed to a status-based view (Republican) that prioritizes independence over welfare.

  4.  **The Unoccupied Slot:**
      *   Challenge anyone who lands in the "Hybrid" (Leaf C path). Ask them: *If the Monarch makes you unfree, why doesn't the Democratic State (which also has power over you) make you unfree?* If they can't distinguish arbitrary from non-arbitrary power, their Republicanism is incomplete. If they can, they might actually be Strict Republicans (Leaf D).
