  1. The Phenomenon Restated

  You describe a semantic slippage between two distinct definitions of "adaptation." The first sense (Adaptation$_{utility}$) refers to a trait's current causal contribution to fitness—it does something useful now. The second sense (Adaptation$_{history}$) refers to a trait's etiology—it exists because ancestors possessing it had higher fitness due to that trait. In your friend's argument, evidence for utility (e.g., jealousy guards mates) is offered to prove historical selection. When challenged on the history, the argument retreats to utility ("it's still useful"), treating the two senses as interchangeable. This renders the claim unfalsifiable: historical evidence isn't required because utility suffices, yet the historical weight of the term "adaptation" is retained to imply evolutionary inevitability. The move relies on the intuition that useful things must be designed, allowing the arguer to claim evolutionary authority without evolutionary evidence.

  2. Nearest Established Concepts

  The closest philosophical framework is the distinction between **Causal Role functions** (Cummins) and **Selected Effect functions** (Millikan). Cummins functions match your Adaptation$_{utility}$: what a trait *does*. Millikan functions match Adaptation$_{history}$: what a trait was *selected for*. Conflating these is a category error in function theory. Gould and Vrba's **Adaptation vs. Exaptation** distinction names the states but not the rhetorical move. Rhetorically, this resembles the **Motte-and-Bailey fallacy**: the defensible "utility" claim (Motte) protects the controversial "historical selection" claim (Bailey). However, unlike standard adaptationism critiques (Gould & Lewontin), which attack the *lack of evidence* for history, your phenomenon identifies the *semantic mechanism* allowing that lack of evidence to go unnoticed. It is not merely storytelling; it is definitional conflation. While Gould and Lewontin warned against assuming traits are adaptations, they did not explicitly label the linguistic slide between current utility and historical origin as a distinct fallacy. This specific equivocation is the engine that drives untested adaptationist assumptions, yet it remains submerged within broader debates about function ascription rather than standing as a named logical error. The distinction matters because one can accept utility without accepting history, but the equivocation prevents this nuance. It also differs from simple teleology, which attributes purpose without mechanism; here, the mechanism (selection) is invoked but not demonstrated, masking the evidentiary gap.

  3. Is There a Name?

  There is no single, canonical name for this specific move in the philosophy of biology. It is typically discussed under the broader headers of "confusing theories of function" or "the adaptation/exaptation problem." While logicians would simply call it **equivocation**, biologists rarely label the tactic itself. The reason is likely pragmatic: in many clear cases, utility and history coincide, so the distinction feels pedantic until it matters. Consequently, the error is usually treated as a substantive mistake about evolutionary history rather than a formal semantic fallacy. It remains a recognized pitfall in function ascription, but lacks a specific label like "The Naturalistic Fallacy." Scholars recognize the error, but it is usually subsumed under critiques of "naive adaptationism" rather than isolated as a specific argumentative maneuver with its own term. Because the two senses often align in mature adaptations, the slippage is frequently unintentional, making it harder to codify as a distinct fallacy.

  4. If No Name Exists: A Proposal

  I propose calling this **The Functional Equivocation**. It occurs when an arguer treats evidence of current utility as sufficient proof of historical selection without justification. The slippage becomes fallacious when the probability of **exaptation** (co-option) or **drift** is non-negligible. If a trait's current utility could plausibly arise from a different ancestral function, insisting on "adaptation" without phylogenetic evidence is fallacious. It is harmless only when the historical lineage is well-established, or when the term "adaptation" is explicitly defined as purely current utility for the sake of the argument. The fallacy lies in importing the evolutionary authority of the historical sense while relying on the evidentiary ease of the utility sense. This definition isolates the move from general adaptationism by focusing on the semantic switch rather than the mere absence of evidence. Naming it demands clarity on whether the claim concerns utility or history, requiring phylogenetic data for the latter. It forces the arguer to specify their function theory.

  5. Boundary Cases

  A difficult boundary case involves **continuous selection**. If a trait is currently being selected for its utility, the distinction between history and current utility blurs; the trait is an adaptation *now* because it was selected *recently*. Here, utility is strong evidence for history. Another edge case is **pre-adaptation**, where a trait evolves for Function A but is immediately co-opted for Function B before Function A disappears. Determining when the "history" resets to the new function is empirically difficult. In these zones, the equivocation isn't necessarily misleading because the causal processes overlap, making the semantic distinction less critical than in cases of ancient exaptation (like feathers for warmth vs. flight). The line is hardest to draw when selection is ongoing, as the historical and current senses converge temporally. Here, the arguer describes a dynamic process where utility and history are coupled, rendering the distinction temporarily opaque.
