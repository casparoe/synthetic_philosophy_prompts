prompt: |-
  I just spent a long evening arguing with a friend about whether a particular human trait counts as an adaptation, and I noticed a pattern that I suspect is widespread but I don't have a name for it.

  The argument went like this. My friend would claim that some trait — we were arguing about jealousy, but it could be anything — is an adaptation because it serves a useful function today (mate-guarding, in this case). When I pushed back and said that serving a function now doesn't show it evolved for that function, he'd agree in principle, but then he'd simply rephrase his claim in historical terms — "it was selected for mate-guarding" — without offering any new evidence that actually bears on the evolutionary history. When I pointed out that the trait could be a byproduct of something else, or could have evolved for a different reason and later been put to its current use, he'd acknowledge the possibility but treat it as irrelevant, because "it's still an adaptation either way."

  What I noticed is that the word "adaptation" was doing two different jobs in his argument, and the slippage between them made his position unfalsifiable. In one sense, "adaptation" just means a trait that currently has a function — it does something useful for the organism. In the other sense, it means a trait whose current function explains why it evolved — natural selection shaped it for this role. Evidence of current utility supports the first sense but not the second. But my friend moved back and forth between them as if they were the same thing, so that whenever I challenged one sense he could retreat to the other and then reoccupy the original ground once the challenge passed.

  I'm not asking about the general problem of adaptationist storytelling — I know Gould and Lewontin wrote about that. What I'm after is this specific argumentative move: using "adaptation" in two senses that are treated as interchangeable when they aren't, such that evidence for one is taken as evidence for the other. Does this move have an established name in philosophy of biology? If it does, what exactly is the relationship between the two senses, and where does the equivocation become genuinely misleading versus merely loose? If it doesn't have a name, what would you call it, and how would you distinguish it from related problems like the ones Gould and Lewontin raised?

  Please structure your response as follows:

  1. The Phenomenon Restated (roughly 150 words): Restate the pattern I'm describing in your own terms, making the two senses of "adaptation" explicit and showing how the slippage works in a typical argument.

  2. Nearest Established Concepts (roughly 250 words): Identify the concepts in philosophy of biology that come closest to naming this phenomenon. For each, say how it overlaps with what I described and where it diverges.

  3. Is There a Name? (roughly 150 words): Give a clear yes, no, or partial answer, with your reasoning.

  4. If No Name Exists: A Proposal (roughly 150 words): Coin a term for the phenomenon, define it precisely, and give a criterion for when the slippage becomes fallacious versus when it's harmless.

  5. Boundary Cases (roughly 150 words): Describe one or two edge cases where it's genuinely unclear whether the equivocation is happening, and explain what makes them hard.
