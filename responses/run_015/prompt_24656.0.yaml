  The server room hummed, a low-frequency vibration that Elias felt in his teeth. On the monitor, the deployment ticket sat open, status pending. Mara, the compliance lead, sat with her hands folded, staring at the checklist.

  "The encryption rotation is complete," Elias said, pointing to line four. "You signed off on it ten minutes ago."

  "I confirmed the data," Mara said. "I confirmed that if the rotation is complete, protocol dictates immediate deployment."

  "Exactly. So we deploy." Elias hovered his finger over the enter key.

  Mara shifted in her chair. "I haven't authorized the deployment itself."

  Elias lowered his hand. "Mara, you just said complete rotation requires deployment. The rotation is complete. Therefore, we deploy."

  "I accept the rotation is complete," she said, her voice level. "I accept the policy states completion requires deployment. But I do not yet accept that we deploy."

  Elias rubbed his temples. "Why not? You're agreeing to the premises. You're agreeing to the conditional rule. What's missing?"

  "The connection," Mara said. "You're asking me to move from accepting the statements to performing the action. I need a rule that validates that move."

  Elias opened a text editor. He typed: *If the rotation is complete AND the policy states completion requires deployment, THEN the deployment must occur.* He turned the screen toward her. "There. Premise C. Does that bridge it?"

  Mara read it slowly. "I accept Premise C. It seems true."

  "Great." Elias reached for the keyboard.

  "But I still haven't authorized the deployment," she said.

  Elias froze. "You accept A. You accept B. You accept C, which says A and B imply Z. Why aren't you at Z?"

  "Because C is just another statement," Mara said, looking at him with genuine困惑. "It's ink on a screen. It says that if A and B are true, Z follows. But I need to know that *because* A, B, and C are true, I am compelled to Z. You're treating inference like it's just another premise. It's not. It's a gear shift. I'm waiting for the gear to engage."

  Elias stood up and paced the small room. "There is no additional gear, Mara. Logic isn't a physical force. It doesn't push your hand. Accepting the premises *is* the commitment to the conclusion. If you separate them, you're asking for a rule to justify the rule, and then a rule to justify that rule."

  "Then write that one too," she said. "Write the rule that says if A, B, and C are true, I must act."

  Elias typed it out. *If A, B, and C are true, then Action Z is mandatory.* He slammed the enter key down, not to deploy, but to save the document. "There. Now do you see it?"

  "I see the statement," Mara said. "But I still feel... unconnected to the action. You keep giving me maps of the territory, Elias. I'm asking for the ground beneath my feet."

  Elias looked at the screen. The cursor blinked against the black background. He realized she wasn't being difficult; she was treating logic like a contract that required a signature on every clause, including the clause that made signatures valid. She wanted the necessity to be external, objectified, something she could point to besides her own understanding.

  "If I write another one," Elias said quietly, "you'll ask for the rule that makes that one binding."

  "Yes," Mara said. "Because otherwise, I'm just jumping. I want to walk."

  "You can't walk across a gap that only exists because you're looking down," Elias said. "At some point, you just have to step. The stepping isn't written in the policy. It's what we do."

  He sat back down. He didn't add another line to the document. He moved his cursor to the deployment ticket. He looked at Mara. She didn't stop him, but she didn't nod either. She watched his hand as if waiting for a invisible wire to pull it.

  Elias pressed enter. The progress bar filled. The servers hummed louder for a moment, then settled.

  "Deployed," Elias said.

  Mara exhaled, a long, shaky breath. She looked at the screen, then at the document full of conditional statements. "It feels like I skipped a step," she whispered.

  "You didn't," Elias said. "You just finished the sentence."

