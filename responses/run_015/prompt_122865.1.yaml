      *(Self-Correction during drafting)*: I initially thought about putting the Strengthened Liar at the end. But if I use "This sentence is not true" as the *main* example, the Strengthened Liar is built-in. I should make sure to explain *why* I chose "not true" over "false" explicitly as part of the example justification. This kills the "Gap" misconception early.

