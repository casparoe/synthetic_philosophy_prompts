      2.  Derive the Contradiction (T-Schema + Bivalence).
      3.  Diagnose the Cost (Consequence).
      4.  Map Solutions to Theses.
      5.  Strengthened Liar (The "Not True" justification).
      6.  Check & Close.

      *Addressing the Gödel point:* This needs to happen when we justify the existence of the sentence. Math students think "Fixed point lemma." Phil students think "Demonstrative reference." I need to unify these without getting bogged down. *Decision:* Acknowledge the structural similarity but distinguish the *normative* status (Truth vs. Provability).

  8.  **Refining the "Dependencies" Section:**
      *   The prompt asks for explicit reasoning about sequence. I need a dedicated section explaining *why* A comes before B.
      *   Example: You cannot motivate Tarski (Hierarchy) before establishing Semantic Closure is the problem. You cannot establish Closure is the problem before showing the sentence exists.

  9.  **Refining the "Exclusions" Section:**
