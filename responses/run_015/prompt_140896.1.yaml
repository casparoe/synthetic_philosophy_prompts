  **Why "Irrational"?**
  M runs a *Rational Choice* reading group. In that community, rationality is typically constitutive, not consequential. To be a rational agent *is* to have transitive preferences. The money pump (Cases 1, 3, 5) is usually taught as a *theorem* ("If you are cyclic, you are pumpable"), not the *definition* of irrationality.
  In Case 7, the theorem fails (she isn't pumped), but the condition (cyclic preferences) remains. M likely views her preferences over A, B, and C as a defect in her agency. The fact that she got paid is external luck (similar to Case 4, but reversed). In Case 4, being unlucky didn't make her rational; in Case 7, getting lucky shouldn't make her rational. She is relying on the offerer's incompetence to validate her incoherence.

  **The Tension:**
  However, look closely at his justification for **Case 3**. He said: *"from where she was sitting at the start, keeping A and paying nothing beat where she ended up."*
  This is an **Ex-Ante Dominance** criterion. He judged her based on whether her plan led to a dominated outcome relative to the status quo.
  *   In Case 3: Start (A, $0) > End (C, -$1). Verdict: Irrational.
  *   In Case 7: End (A, +$6) > Start (A, $0). Verdict: **Not Irrational.**

  If M is consistent with his *reasoning* in Case 3, he must say **Not Irrational**. If he is consistent with the *axiomatic spirit* of Cases 1 and 5, he must say **Irrational**. Case 7 forces him to choose between being a **Consequentialist** (do you lose?) or a **Deontologist** (are your axioms clean?).

  ### 2. The Two Competing Rules

  Based on your list, M is oscillating between two distinct definitions of rationality.

  **Rule A: The Axiomatic Integrity Rule (The "Shape" Rule)**
  *   **Definition:** An agent is rational if and only if their underlying preferences satisfy standard axioms (Transitivity, Independence, etc.).
  *   **Interpretation of Data:**
      *   Cases 1, 3, 5 are irrational because they reveal cyclic/incoherent prefs.
      *   Case 6 is not irrational because she recognized the defect and constrained it (meta-rationality).
      *   Case 2 is not irrational because prefs were static at each $t$.
      *   Case 4 is not irrational because EU axioms were met.
  *   **Prediction for Case 7:** **Irrational.** Her preferences over A, B, C are still cyclic. The money is a confounding variable. She is acting on a defect.

  **Rule B: The Ex-Ante Dominance Rule (The "Outcome" Rule)**
  *   **Definition:** An agent is irrational if they execute a plan that they know at the start will leave them strictly worse off (by their own lights) than a available alternative (like doing nothing).
  *   **Interpretation of Data:**
      *   Cases 1, 3, 5 are irrational because the agent ends up dominated (less money, same/worse goods).
      *   Case 6 is not irrational because she avoided the dominated outcome.
      *   Case 4 is not irrational because the bets were fair ex-ante.
      *   Case 2 is not irrational because no single decision was dominated at the time.
  *   **Prediction for Case 7:** **Not Irrational.** She identified a plan that ex-ante dominated the status quo and executed it. She did not leave money on the table.

  ### 3. The "Stranger" Problem

  You asked: *If I ran the identical story with the payments going the other way... would his verdict change?*

  If M follows **Rule A (Axiomatic)**, the verdict **does not change**. She is irrational in both cases because her preferences are cyclic. The direction of the payment is irrelevant luck.
  If M follows **Rule B (Dominance)**, the verdict **does change**. Paying to cycle = Irrational. Getting paid to cycle = Not Irrational.

  **Why this matters:**
  If M admits the verdict changes based on the stranger's offer, he concedes that **irrationality is partially a matter of luck.** This is a dangerous position for a rational choice theorist. It implies that an agent can be irrational at 9:00 AM, but if a benevolent stranger shows up at 9:05 AM to subsidize their bad choices, they become rational at 9:10 AM. Most theorists want rationality to be an internal property of the agent, not a function of the environment's generosity.

  However, if M sticks to **Rule A** and calls Case 7 "Irrational," he faces the **Pragmatist's Critique**: *"Why is it irrational to take a deal that makes you strictly better off by your own standards? Are you saying she should have refused the $6?"*
  If M says "Yes, she should have refused the $6 to avoid acting on cyclic preferences," he reveals that his theory values **axiomatic purity over agent welfare.** That is a defensible philosophical position, but it's a hard sell in an economics department.

  ### 4. The Discriminating Case

  You asked for a single further case to make him show which rule he is running. You need to remove the money variable entirely. Money allows him to hide behind "welfare" arguments.

  **Propose Case 8: The Zero-Cost Cycle**
  > Same three items, same cycle (A > B > C > A). She starts with A. A stranger offers to swap A for B, B for C, and C for A. **No money changes hands.** The trades are costless. She knows the sequence in advance. She takes all three trades. She ends up with A.
  >
  > **Question:** Is she irrational?

  **Why this works:**
  *   **Under Rule A (Axiomatic):** **Irrational.** She acted on cyclic preferences. She moved for no reason. Her behavior is indistinguishable from the Case 1 cycler, minus the financial loss.
  *   **Under Rule B (Dominance):** **Not Irrational.** She is not *worse off*. She ended with exactly what she started. There is no ex-ante dominance violation (End = Start). She didn't lose anything.

  **The Trap:**
  *   If he says **Irrational**: He admits he cares about the *shape* of preferences, not just the outcome. You can then press him on Case 7: *"If cycling for free is irrational, why isn't cycling for $6 rational? Is $6 enough to buy a license to be intransitive?"*
  *   If he says **Not Irrational**: He admits he is a Consequentialist. You can then press him on Case 1: *"If cycling for free is fine, why is cycling for 50 cents irrational? Is the threshold of irrationality exactly $0.01?"*

  ### Summary Advice for Your Presentation

  When you bring Case 7 next week, frame it as a test of **Internal vs. External consistency**.

  1.  **If he says "Irrational":** Ask him if the agent should have refused the $6. If yes, he values axioms over welfare. If no, ask how accepting the $6 fixes the cyclic preferences.
  2.  **If he says "Not Irrational":** Ask him if the agent's rationality depends on the stranger's competence. (The "Luck" objection).
  3.  **The Kill Shot:** Bring up the **Zero-Cost Cycle**. If he calls the Zero-Cost cycle "Not Irrational" but the 50-cent pump "Irrational," he has admitted that rationality is a continuous variable determined by market prices, which undermines the whole "Rational Choice" framework.

  My bet? He'll call Case 7 **Irrational**, argue that "preferences over goods must be transitive regardless of subsidies," and then you hit him with the Zero-Cost case to see if he'll bite the bullet that doing nothing and doing *something* are rationally distinct when the outcome is identical.
