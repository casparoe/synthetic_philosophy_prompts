answer: |-
  Here is the brainstorming process, the proposed principle, and the analysis of your intuitions.

  ### Part 1: Candidate Principles and Stress Tests

  Before settling on a view, let's articulate three candidate principles that might capture your verdicts and test them against your eight cases.

  **Candidate 1: Ex-Ante Expected Utility Maximization (EAEU)**
  *Principle:* Choose the action dictated by the policy that maximizes expected utility calculated from the perspective before any specific facts (coin flips, predictions) are observed.
  *   **Verdicts:** (1) Pay. (2) Hire. (3) Irrelevant. (4) Pay. (5) Threshold dependent (Pay if $P \times 10,000 > 100$). (6) Pay (Simulation and Genome are both fixed facts ex-ante). (7) Refuse (Policy of refusing blackmail yields better ex-ante outcomes). (8) Depends on utility weights.
  *   **Failure:** It contradicts your intuition in **(6) Genome**. EAEU says you should pay in the genome case just as in the simulation case, because ex-ante, the correlation is identical. You feel paying in the genome case is "silly." EAEU cannot save that verdict.

  **Candidate 2: Causal Efficacy with Disposition Valuation (CEDV)**
  *Principle:* Maximize causal expected utility, but acknowledge that having a "disposition to pay" can be a causal asset you cultivate ex-ante, even if the specific act has no causal power.
  *   **Verdicts:** (1) Weak Pay (cultivating disposition). (2) Hire (causal contract). (6) Genome: Don't Pay (no causal lever). (7) Refuse (no causal link to termites).
  *   **Failure:** It struggles with **(4)**. In (4), Omega lies about the protocol, yet you pay with *more* confidence. CEDV relies on causal structures; if Omega's announcement is worthless, the causal story is murky. More critically, CEDV typically collapses into CDT on (1), telling you *not* to pay once the coin has landed, whereas you feel you *should* pay (even if weakly). It also struggles to explain why (2) implies (1) without smuggling in non-causal logic.

  **Candidate 3: Subjunctive Dependence on Cognitive Output (SDCO)**
  *Principle:* Optimize ex-ante, but only treat outcomes as dependent on your choice if the predictor's accuracy relies on the *functional output of your reasoning process*, not merely on physical correlates that bypass reasoning.
  *   **Verdicts:** (1) Pay. (2) Hire. (6) Simulation: Pay (reasoning tracked). Genome: Don't Pay (biology tracked, not reasoning). (7) Refuse.
  *   **Failure:** This matches your intuitions best, but it is philosophically unstable. In a physicalist world, your reasoning *is* a physical process determined by your genome. Distinguishing "reasoning" from "genome" requires a dualist boundary that decision theory usually rejects. However, since you want to preserve your (6) intuition, this is the strongest contender *if* we can formalize the "Cognitive Mediation" clause without contradiction.

  ### Part 2: The Selected Principle

  I recommend adopting a refined version of Candidate 3, but with a specific caveat regarding your (6) intuition. I call this **Mediated Ex-Ante Policy Optimization (MEPO)**.

  **The Principle:**
  > **1. Ex-Ante Policy Selection:** You ought to execute the action dictated by the decision policy you would have committed to prior to observing the specific branch of reality you occupy (e.g., before the coin flip, before the prediction is made).
  >
  > **2. Subjunctive Dependence Clause:** This obligation holds only if the predictor's accuracy is *subjunctively dependent* on the output of your decision algorithm. That is, had your algorithm outputted a different decision, the prediction (and thus the outcome) would have been different.
  >
  > **3. Cognitive Mediation Constraint:** Subjunctive dependence is deemed insufficient if the predictor bypasses your decision algorithm entirely, relying solely on fixed physical facts (e.g., genetic scan) that you cannot cognitively access or identify with as "your reasoning." In such cases, revert to Causal Expected Utility.

  **Why this repairs your tentative principle:**
  Your tentative principle ("treat as a single decision every agent the predictor cannot tell apart") is essentially Updateless Decision Theory (UDT). It fails your (6) Genome intuition because UDT treats the genome and the simulation as identical sources of logical constraint. MEPO adds Clause 3 to respect your intuition that there is a difference between being predicted *as a thinker* and being predicted *as an organism*.

  ### Part 3: Motivation for Clauses (Mapping to Your Cases)

  *   **Clause 1 (Ex-Ante Policy):** Motivated by **(2) Pre-commitment** and **(1) Canonical Mugging**. You agree hiring the firm is obvious. This implies you value the ex-ante policy over the ex-post causal leverage. Clause 1 ensures (1) and (2) align: paying in (1) is simply executing the policy you bought in (2).
  *   **Clause 2 (Subjunctive Dependence):** Motivated by **(7) XOR Blackmail**. In XOR, paying is good news (EDT), but your decision doesn't change the termite state (the prediction correlates with your decision, but the *truth* of the termite proposition is independent). Clause 2 ensures you refuse blackmail because the *outcome* (termites) does not depend on the algorithm's output, only the *letter* does.
  *   **Clause 3 (Cognitive Mediation):** Motivated by **(6) Mechanism**. This is the specific repair for your Genome intuition. It validates your feeling that being predicted via simulation (reasoning) binds you, but being predicted via genome (biology) does not. It also handles **(4) Untrustworthy Announcement**: even if Omega lies about the protocol, if the prediction relies on your reasoning (Clause 2), the policy holds. The "more confidence" you feel in (4) likely stems from the fact that Omega's lie proves the prediction is robust against your epistemic state, reinforcing the subjunctive link.
  *   **Utility Function Note on (8):** Your reluctance in **(8) Moral CM** is not a decision-theoretic problem. MEPO takes utilities as inputs. If harming a stranger has high negative utility, the ex-ante calculation changes. This is consistent with the principle without modification.
  *   **Accuracy Thresholds (5):** MEPO calculates expected utility. If accuracy is 60%, $0.6 \times 10,000 < 100$ (assuming cost is certain in tails). If 90%, it pays. The 75% uncertainty is simply the mathematical tipping point ($100 / 10,000 = 1\%$ break-even? Wait. In CM, you pay 100 in Tails (50%) to get 10,000 in Heads (50%). EV = $0.5 \times 10,000 - 0.5 \times 100 > 0$. Accuracy matters if the prediction isn't perfect. If 60% accurate, the correlation is weaker. MEPO handles this via standard EV calculation within the ex-ante frame).

  ### Part 4: Verdicts on New Cases

  **Case A: The Thousand Copies**
  *Setup:* 1,000 physical copies of you. Omega asks all of them for $100. Omega takes the money from *one* copy chosen at random. In the Heads branch, Omega wires $10,000 to *every* copy if it predicted the *type* would pay.
  *   **Analysis:** Your decision algorithm is identical across copies. By Clause 1 (Ex-Ante Policy), you must choose a policy for the *type*. If the type pays, every copy gets $10,000 in Heads. The cost is $100, but only borne by 1/1000 copies (Expected cost $0.10).
  *   **Verdict:** **Pay.** The ex-ante expected utility is overwhelmingly positive. The "Cognitive Mediation" clause is satisfied because Omega predicts the *algorithm* shared by copies.

  **Case B: The Pill Prediction**
  *Setup:* Omega predicts not what you *will* do, but what you *would do after being given a pill* that reliably makes people refuse. Coin is Tails. Omega asks for $100 now (unpilled).
  *   **Analysis:** The prediction concerns a *counterfactual version of you* (Pilled-You) whose decision algorithm is chemically altered to output "Refuse." Your current algorithm (Unpilled-You) is *not* what was predicted. There is no subjunctive dependence between your current decision and Omega's prediction (Clause 2 fails). Your current choice cannot change the fact that Pilled-You would refuse.
  *   **Verdict:** **Refuse.** This collapses to a Causal case. Paying $100 now buys nothing, because the prediction was about a different physical state (the pilled brain).

  ### Part 5: The Inconsistency You Must Drop

  I must be honest: **Clause 3 (Cognitive Mediation) is theoretically fragile, and your verdict on (6) Genome is likely the mistake.**

  Here is the hard truth: Your verdict on **(2) Pre-commitment** contradicts your verdict on **(6) Genome**.
  In (2), you hire a firm to confiscate money. The firm is a physical mechanism outside your mind that binds your future self. You accept this as rational.
  In (6-Genome), the genome is a physical mechanism inside your history that binds your future self.
  If you accept that you can be bound by an external physical contract signed ex-ante, consistency demands you accept being bound by an internal physical fact fixed ex-ante. The "silliness" you feel in the Genome case is a psychological bias (a form of mind-body dualism), not a rational distinction. The predictor using your genome is functionally identical to the predictor using a scan of your childhood (which you were "less confident" about) or a simulation (which you accept). All are physical determinants of your output.

  **Recommendation:** Drop the **Cognitive Mediation Constraint (Clause 3)**. Adopt **Pure Ex-Ante Policy Optimization (UDT/FDT)**.
  *   **Why?** It unifies (2) and (6). It simplifies the theory. It aligns with the graduate-level consensus on these problems (FDT/UDT).
  *   **Cost:** You must accept that paying in the Genome case is rational. If you can pre-commit via a firm, you can pre-commit via your own biology. The "you" that makes the decision is the same physical system that was scanned.

  ### Part 6: Classification

  Is this view just Functional or Timeless Decision Theory (FDT/UDT) under another name?

  **Yes.**
  Once you drop the Cognitive Mediation Constraint (as I strongly advise), your view is **Functional Decision Theory (FDT)**.
  *   **FDT** says: Choose the output of your decision algorithm that maximizes utility, considering all subjunctive dependencies (logical correlations) between your algorithm's output and the world.
  *   **Your View:** Choose the policy you would have wanted ex-ante, treating agents the predictor can't tell apart as one.
  *   **Equivalence:** These are mathematically equivalent. Your "ex-ante position" is the "timeless" perspective. Your "agents the predictor can't tell apart" are the "subjunctively linked instances."

  **What is unique?**
  Your only unique contribution is the **Cognitive Mediation Constraint** (Clause 3). This is not standard FDT. It is a hybrid view attempting to accommodate a specific intuition (Genome Case) that standard theory rejects. If you keep Clause 3, you have a **novel, hybrid view** (Mediated FDT). If you drop it (as recommended), you are an **FDT agent** who has successfully identified and isolated a bias in their own intuition regarding biological determinism.

  **Final Advice:**
  Your intuition on (6) Genome is the outlier. It is the only verdict that conflicts with the powerful logic of (2) Pre-commitment. In a seminar context, you will be on stronger ground if you argue: *"I initially felt the Genome case was silly, but upon reflection, it is identical to the Pre-commitment case. Therefore, I should pay."* This shows theoretical growth. Clinging to the Genome intuition forces you into the unstable hybrid view described above.
