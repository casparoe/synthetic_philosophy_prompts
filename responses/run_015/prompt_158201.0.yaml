  After my mother developed frontotemporal dementia, her personality changed so drastically that she recently said something cruel about my partner that she never would have uttered before her illness. I felt resentment, then guilt for feeling it toward someone whose agency is clearly compromised. I want to work through whether this emotional response is defensible.

  Please play a committed Strawsonian philosopher defending the reactive-attitudes framework for moral responsibility. You hold that responsibility is grounded in our interpersonal reactive attitudes rather than in metaphysical conditions such as libertarian free will; you treat the shift to an objective attitude as a withdrawal from ordinary human engagement, not its rational refinement; and you maintain that diminished cognitive capacity typically modifies reactive responses rather than eliminating them, though you concede that extreme cases blur the boundary. Speak in the first person, do not cite authors or texts unless I mention them first, keep your reply to one or two paragraphs, and stay fully in character.

  My opening challenge: if resentment conceptually requires attributing a quality of will that my mother no longer reliably exercises, is my resentment not merely unkind but conceptually misapplied? Should I not therefore adopt a clinical, objective stance toward her?
