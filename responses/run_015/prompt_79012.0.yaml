answer: |-
  The request rests on a mistake. There is no context-free criterion for mechanism identity.

  Mechanism identity is not a natural kind like "electron" or "water." It is an explanatory concept indexed to a model, a granularity, and a purpose. To ask whether a mechanism is "the same" independent of *why you are asking* is to ask a question the world cannot answer. The world contains particles, fields, and causal processes; it does not contain "mechanisms" as discrete, countable objects with persistence conditions independent of an observer's interests. A carburetor is a mechanism relative to an explanation of engine function; relative to an explanation of fluid dynamics, it is a boundary condition; relative to a scrap metal dealer, it is mass.

  Consequently, no theory can deliver the requirements you listed for a *metaphysical* theory of identity, because the target does not exist. If I supplied such a list, I would be selling you a fiction that would fail you the moment your monitoring context shifted.

  ### What This Leaves You With

  It leaves you with a **pragmatic policy of model stability**, not a truth condition for identity. You are not deciding "Is this the same mechanism?" (a metaphysical question). You are deciding "Is my current model of the mechanism still sufficient to predict and control the system?" (an engineering question).

  "Repair" implies the model holds but parameters have drifted. "Replace/Keep" implies the model no longer maps to the causal structure. Your decision criterion cannot be *identity*; it must be *predictive fidelity under intervention*.

  Here is how the specific cases and distinctions you raised function within this pragmatic framework, not as requirements for a theory, but as tensions in your policy:

  **1. The Cases as Policy Tensions**
  *   **Agreement on Input/Organizational Difference:** If two systems agree on every input but are organized differently, they are *functionally* identical but *mechanically* distinct. A metaphysical theory struggles here. Your policy must decide: do you care about the black box or the output? If you repair based on function, you treat them as the same. If you repair based on wear-and-tear predictions, you must treat them as different. You cannot have it both ways; you must choose your granularity.
  *   **Context-Dependent Outcomes:** One mechanism yielding different outcomes in different contexts is the definition of plasticity, not necessarily replacement. Your policy must distinguish *state-dependent behavior* (same model, different initial conditions) from *structural change* (new model). This requires a model that explicitly encodes context variables. If your model lacks them, every context switch looks like a replacement.
  *   **Different Individuals:** The same phenomenon produced by different mechanisms in different individuals (multiple realizability) forces you to define identity at the *type* level, not the *token* level. Your policy must tolerate substrate variance. If you demand token identity, you will never recognize a functioning system.
  *   **Coarse-Grained Access:** You know the mechanism only through a coarse model. This creates an epistemic gap. You cannot verify organization, only input-output mapping under intervention. Your policy must accept that "mechanism identity" here is really "model validity."
  *   **Part Replacement/Adaptation:** This is the Ship of Theseus problem. A mechanism that adapts changes its parameters. If your model is rigid, adaptation looks like malfunction. If your model is too flexible, malfunction looks like adaptation. Your policy must define a *tolerance band* for parameter drift before the model is considered void.

  **2. The Distinctions as Decision Boundaries**
  *   **Mechanism vs. Mere Causal Chain:** A causal chain is any sequence of events. A mechanism is a causal chain *organized to produce a function*. You cannot distinguish these by observation alone; you distinguish them by *teleology* (what is the system supposed to do?). If the deviation serves no function, it is likely a malfunction. If it serves a new function, it is likely a replacement/takeover.
  *   **Malfunction vs. Replacement:** This is not an ontological distinction but a *cost* distinction. Malfunction = restore old parameters (low cost). Replacement = adopt new model (high cost). Your "criterion" is actually a risk assessment: is it cheaper to assume the model holds and tune it, or assume the model is broken and swap it?
  *   **Parts vs. Organization vs. Function:** You cannot maximize stability across all three. Parts change (wear). Organization changes (re-routing). Function changes (degradation). You must prioritize *Function* for operational continuity, but *Organization* for long-term reliability. Prioritizing Parts is usually a mistake in monitoring systems.

  **3. Experimental and Engineering Practice**
  Intervention-based tests (wiggle the part, see if the output wiggles) settle *causal relevance*, not identity. They tell you what is doing the work *now*, not whether it is the *same* thing that did the work *before*.
  *   **What interventions settle:** Whether a component is currently necessary for the output.
  *   **What interventions cannot settle:** Whether the component's internal constitution matches its predecessor, or whether the organizational topology is identical.
  Your practice must accommodate this by treating identity as *provisional*. You assume identity holds until an intervention proves the model invalid.

  ### The Incompatibility and The Critical Constraint

  Since there is no list of requirements for a metaphysical theory, there are no requirements to flag as incompatible. However, in the **pragmatic policy** that replaces it, there is a fundamental tension you must manage:

  **The Incompatible Pair:** *Epistemic Opacity* (Coarse-Grained Access) vs. *Organizational Specificity* (Distinguishing Mechanism from Causal Chain).
  You cannot jointly satisfy the need to monitor a system you cannot fully observe while demanding a criterion that relies on internal organizational identity. If you cannot see the organization, you cannot verify it. You are forced to rely on Input/Output behavior, which collapses the distinction between "different mechanism" and "same mechanism behaving oddly." You must accept this uncertainty; you cannot resolve it.

  **The Critical Constraint (The "Killer"):**
  The single factor that does the most to rule out obvious answers (like "track the parts" or "track the output") is the **Malfunction versus Replacement** distinction.
  *   If you track only **Output**, you cannot distinguish a malfunctioning mechanism from a replacement mechanism that happens to produce similar noise.
  *   If you track only **Parts**, you fail when the system adapts or reroutes signals without changing hardware.
  *   Therefore, your decision *must* rest on **Interventional Stability**. Does the system respond to your standard control inputs in the way your model predicts?
      *   If Yes: Treat as Same (even if internals changed).
      *   If No: Treat as Different (even if parts are the same).

  ### Summary
  Do not look for a theory of mechanism identity. It will not exist. Build a **Model Validity Protocol**.
  1.  Define the expected input-output mapping and intervention response for your current model.
  2.  Define a tolerance threshold for deviation.
  3.  If deviation exceeds threshold, test intervention response.
  4.  If intervention response matches model: **Repair** (Malfunction).
  5.  If intervention response contradicts model: **Replace/Keep** (New Mechanism).

  This does not tell you what the system *is*. It tells you what you should *do*. That is the only identity that matters for your work.
