answer: |-
  The dust in the Hall of Petitions tasted like oxidized copper. Elara unrolled the Banner of the First Strike, the velvet rotting but the gold thread still biting. The workers gathered, eyes wide. They picked up the hammers of their ancestors, not to hit, but to hold aloft. They struck poses of martyrdom in the dim light, muscles locked, waiting for a glory that wouldn't come. They became statues of their own potential, paralyzed by the magnitude of the dead. The work stopped. The city groaned under the weight of their imitation.

  She retreated to the lower stacks, desperate to save what remained. Every torn slip, every voided wage agreement, every scribbled note went into the bins. *Preserve,* she thought. *Honor the detail.* But the bins overflowed. Paper avalanched into the aisles, a landslide of trivialities. She tried to walk to the desk but couldn't find the floor. The past was suffocating the present. She couldn't choose a path because every scrap demanded equal reverence. She drowned in the care of things that no longer mattered, trapped by a reverence that refused to discriminate.

  Then she saw the Charter. Encased in reinforced glass, the Guild's law. They used it as a shield, a monumental idol to crush dissent. The Magistrate arrived, flanked by guards, tapping the glass. "It is eternal," he said. "You cannot break the foundation. It defines us." They wielded the past as a weapon of stasis, hiding behind the ink.

  Elara knew the only way to walk was to clear the path. She didn't argue. She took the magnesium flare from her belt. The Magistrate screamed about sanctity, about lineage. She struck the flint. The flame caught the dry edge of the parchment. It curled black, the ink bubbling like fat. This wasn't preservation; it was judgment. She was cutting the chain. As the fire ate the clauses that bound them to the dust, the workers dropped their frozen hammers. The ash floated up, warm against the cold stone. The Guild shouted about order, but the heat pushed them back. The air shimmered between them, a wall of living air. She stepped over the burning glass, into the smoke, leaving the history that killed them to turn to carbon. She walked out into the street, unburdened, ready to write something new. The air smelled of ozone and freedom.
