answer: |-
  **Setting:** *A quiet corner of the university faculty lounge, late afternoon. Coffee cups are empty. Dr. Elena Vance (Archaeological Science) and Prof. Marcus Thorne (Interpretive Archaeology) are continuing a debate from a seminar.*

  **Vance:** You're treating material culture like it's just illustration, Marcus. Like the pots are merely decorations on the text of society. But I'm telling you, the absence of the pot *is* the text. If we model the expected distribution of storage jars based on household caloric needs, and we find a structured zero-frequency zone in the elite quarter, that isn't just "missing data." That's a signal. It's a negative-space inference.

  **Thorne:** It's a signal only if you assume the noise is neutral, Elena. You're talking about structured absence as if it's a physical vacuum. But archaeological absence is never clean. It's taphonomic soup. Those jars might not be there because organic liners rotted, because later plowing scattered them, or because the elite quarter was never fully excavated. You're seeing a rule where there might just be decay.

  **Vance:** That's why we run the formation models first. We account for the decay rates, the soil acidity, the excavation bias. If the model predicts jars should survive in the elite quarter at a rate of 40%, and we find zero across three distinct stratigraphic layers, you have to accept the null hypothesis. The jars weren't there. And if they weren't there, despite the need for storage, then some mechanism prevented their accumulation. That sounds like an institution—property rules, taboo, redistribution.

  **Thorne:** But "redistribution" is a modern economic category. You're smuggling a 20th-century welfare state onto a Bronze Age chiefdom. Just because the material isn't there doesn't mean the *institution* matches your definition. You can fossilize a bone, Elena, but you can't fossilize a norm. A norm is a shared mental representation. Two people can look at the same empty shelf; one sees a violation of property, the other sees a ritual obligation. The material trace is identical. The institution is in the head, not the shelf.

  **Vance:** I'm not trying to read minds. I'm trying to constrain behavior. If the material constraint is tight enough, the mental state becomes irrelevant to the functional outcome. If no household stores grain, but everyone eats, the system *must* involve transfer. Whether they call it "tax" or "gift" is semantics. The structural rule is falsifiable. If I find a private granary in the elite zone, my model breaks. I'm willing to put that risk on the table. Are you?

  **Thorne:** I'm willing to admit that finding the granary would complicate things, but it wouldn't falsify the social meaning. Maybe the granary was ritual, not economic. Maybe it was stockpiled for famine, not daily use. You think you're doing physics, defining boundaries by what isn't there. But in hermeneutics, absence is infinite. You can't model every reason why something *didn't* happen. You're building a cage of logic around people who lived in a world of fluid metaphor.

  **Vance:** And you're building a fog so thick nothing can be said at all. If we can't infer structure from patterned absence, archaeology becomes stamp collecting.

  **Thorne:** Better stamp collecting than confident fiction.

  *(A pause. Both sip from empty cups.)*

  **Vance:** Look, let's be honest. Where my reasoning is shakiest is equifinality. I know that different social processes can produce identical material gaps. A taboo against storage and a sudden collapse of trade both look like "no jars." My models struggle to distinguish between a rule and a catastrophe.

  **Thorne:** And mine is shakiest on nihilism. If I insist that meaning is entirely internal and unrecoverable, I render my own profession useless. I have to admit that material constraints do force certain social shapes.

  **Vance:** So, what would change your mind? One specific finding?

  **Thorne:** If you could show me a case where the material layout *forced* a specific social hierarchy regardless of the participants' intent. Not just correlation, but constraint. If you found a settlement plan that makes egalitarianism physically impossible to enact—where the architecture itself dictates the institution regardless of belief. That would bridge the gap between matter and mind. What about you?

  **Vance:** If you could show me a case where taphonomic loss perfectly mimicked a social rule. A "ghost institution." If you found a site where preservation bias created a structured absence that looked exactly like a taboo, down to the statistical level I use for prediction. If absence could be proven to be purely noise that looks like signal, I'd have to abandon the negative-space method.

  **Thorne:** *(Smiles)* So you're looking for a false positive in the void.

  **Vance:** And you're looking for a material determinant of meaning. We might be waiting a while.

  **Thorne:** Probably. But at least we agree the coffee is gone.

  ***

  **Note on Theoretical Liberties**

  This dialogue simplifies a complex landscape. In real archaeological theory, the divide between "processual" (science-driven) and "post-processual" (interpretive) approaches is rarely this binary; most practitioners use mixed methods. The "negative-space" argument draws on site formation processes and Bayesian inference, but few archaeologists claim institutions are *fully* reconstructible from material traces alone. Similarly, the hermeneutic skeptic's position is softened here; most interpretive archaeologists do believe social structures can be inferred, just not with the same kind of falsifiability a physicist might prefer. The debate over whether "absence" is data or noise is ongoing, but rarely framed as strictly as Vance presents it.
