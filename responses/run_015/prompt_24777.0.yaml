answer: |-
  # JOINT STATEMENT ON THE OLD EVIDENCE PROBLEM
  **An Adversarial Collaboration between Synchronist and Diachronicist Camps**

  **Date:** October 26, 2023
  **Signatories:** The Synchronist Working Group & The Diachronicist Working Group

  ## I. AGREED CLAIMS

  We, the undersigned, acknowledge the following points of consensus regarding the formalism, the historical data, and the structure of the problem at hand.

  1.  **Formal Framework:** We agree to operate within the standard axioms of the probability calculus. We agree that the core tension arises from the theorem that if $P(E) = 1$, then $P(H|E) = P(H)$. Consequently, under standard conditionalization, $E$ cannot raise the probability of $H$ if $E$ is already certain.
  2.  **The Phenomenon:** We agree that there exist historical and scientific cases (paradigmatically, the explanation of Mercury's perihelion by General Relativity) where an agent possesses evidence $E$ with high or unit credence, formulates a hypothesis $H$ later, and subsequently judges that $E$ provides strong support for $H$.
  3.  **The Normative Intuition:** We agree that any adequate theory of confirmation must account for the rationality of the agent's judgment in the cases described in Claim 2. It is rationally permissible (and often required) to increase confidence in $H$ upon recognizing that $H$ entails or explains known $E$.
  4.  **Distinction of Terms:** We agree to distinguish between:
      *   **The Support Relation:** The logical or probabilistic relation between propositions $H$ and $E$ (often represented as $P(H|E) > P(H)$ in a specific probability function).
      *   **The Confirmatory Event:** The psychological or epistemic process wherein an agent changes their doxastic state regarding $H$ in response to $E$ (or the connection between $H$ and $E$).
  5.  **The Core Difficulty:** We agree that the "Old Evidence Problem" is not merely about Mercury, but about the general structural conflict between **logical omniscience** (or the assumption of known evidence) and **Bayesian updating**. If an agent is modeled as knowing $E$ at $t_0$, and $H$ is introduced at $t_1$, standard conditionalization cannot model the increase in credence in $H$ driven by $E$.

  ## II. AREAS OF DISAGREEMENT AND CRUXES

  While we agree on the structure of the problem, we diverge on the metaphysical and epistemological interpretation of "confirmation." The following table outlines our precise disagreements, the central cruxes, and pre-registered interpretations of test cases.

  | Crux | The Precise Disagreement | Synchronist Position | Diachronicist Position |
  | :--- | :--- | :--- | :--- |
  | **1. The Nature of Confirmation** | Is confirmation a timeless relation between propositions or a time-indexed event in an agent's cognitive history? | **Confirmation is Synchronic.** Confirmation is the holding of a support relation ($P(H\|E) > P(H)$) relative to a probability function representing the agent's background knowledge, regardless of the temporal order of learning. The diachronic change in credence is a *consequence* of recognizing confirmation, not confirmation itself. | **Confirmation is Diachronic.** Confirmation is essentially a process of belief revision. $E$ confirms $H$ for an agent if and only if learning $E$ (or the connection between $H$ and $E$) causes an increase in the agent's credence in $H$. Without credence change, there is no confirmation. |
  | **2. The Status of "Fitting"** | Is the relation "H fits E" (where H entails/explains known E) a species of confirmation, or a distinct relation that merely mimics confirmation? | **"Fitting" is Confirmation.** If $H$ entails $E$, and $E$ is true, the support relation holds. The fact that $E$ was known previously is irrelevant to the support relation. The intuition that old evidence confirms is correct literally. | **"Fitting" is Distinct.** "Fitting" is a logical relation, not a confirmatory one. Old evidence *fits* a new theory, but it does not *confirm* it in the strict Bayesian sense. We must explain the *illusion* of confirmation via a surrogate update (e.g., on the logical connection). |
  | **3. The "Discovery" Move** | Is conditionalizing on the proposition "H entails E" (the Garber-style move) a genuine Bayesian update on new evidence, or an ad hoc modification to save the diachronic thesis? | **It is a Fudge.** Introducing a new sentence $X = (H \vdash E)$ to conditionalize on is an artificial reconstruction. It admits that the original evidence $E$ cannot do the work, shifting the goalposts to a logical fact. It saves the diachronic formalism at the cost of naturalism. | **It is Genuine Learning.** Logical implications are not always known. Learning that $H \vdash E$ is a genuine cognitive event that expands the agent's information set. Conditionalizing on this discovery is a valid Bayesian update that resolves the problem without abandoning the diachronic definition. |

  ## III. TEST CASES AND PRE-REGISTERED PREDICTIONS

  To adjudicate these cruxes, we agree to analyze the following three cases. Each camp has pre-registered their analysis and verdict below.

  ### Case A: The Mathematical Proof
  **Scenario:** A mathematician knows a numerical fact $E$ (e.g., a specific value of a constant) with certainty ($P(E)=1$). She later devises a theory $H$ that proves $E$. Upon verifying the proof, she increases her confidence in $H$.
  *   **Synchronist Prediction:** The support relation $P(H|E) > P(H)$ held *before* the proof was verified, provided the probability function represented logical possibilities rather than psychological certainty. The verification merely revealed the existing confirmation.
  *   **Diachronicist Prediction:** No confirmation occurred until the proof was verified. The confirmation event was the update on the proposition "H proves E," not the relation between $H$ and $E$ itself. Prior to the proof, $E$ was inert regarding $H$.

  ### Case B: The Detective's Realization
  **Scenario:** A detective knows at $t_0$ that the suspect was in the city ($E$). At $t_1$, she forms the hypothesis that the suspect committed the crime ($H$), which entails being in the city. She does not learn any new facts about the suspect's location, but she realizes the implication.
  *   **Synchronist Prediction:** We should say $E$ confirms $H$. The detective's realization is simply her recognizing the confirmation relation that already obtained. To deny this is to misuse the word "confirm."
  *   **Diachronicist Prediction:** We should say the *realization* confirms $H$, not $E$. $E$ is old evidence. If we say "$E$ confirms $H$," we are speaking loosely. Strictly, the new information (the implication) confirms $H$. The Diachronicist view preserves the link between evidence and belief change.

  ### Case C: The Garber Formalization
  **Scenario:** We attempt to model the General Relativity case using a probability space that includes the sentence $X$: "GR entails Mercury's Perihelion." We treat $X$ as the new evidence with $P(X) < 1$ initially.
  *   **Synchronist Prediction:** This formalization is **unnecessary and misleading**. It suggests the confirmation came from a logical fact ($X$) rather than the physical fact (Mercury). It complicates the model to preserve a diachronic constraint that doesn't exist. The simpler model is that $P(GR | Mercury) > P(GR)$ in the appropriate space.
  *   **Diachronicist Prediction:** This formalization is **essential and accurate**. It correctly identifies the *source* of the credence change. Since the physical fact was already known, the only thing that could rationally drive the credence change is the logical connection. This saves Bayesianism from the $P(E)=1$ triviality result.

  ## IV. COMMITMENT TO FUTURE WORK

  Both camps agree to utilize this document as a baseline for future formal modeling. We agree that if a formal model can be produced that satisfies the Diachronicist requirement for a credence-changing event *without* resorting to what the Synchronists deem "ad hoc sentence addition," the Diachronicist position will be strengthened. Conversely, if a Synchronist model can explain the rationality of belief change without invoking a timeless relation that ignores agent limitations, the Synchronist position will be strengthened.

  **Signed,**

  *The Synchronist Working Group*
  *The Diachronicist Working Group*
