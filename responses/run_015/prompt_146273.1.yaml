answer: |-
  # Workshop Design: "The Project Icarus Protocol"

  **Target:** 12 Grad Students (Decision Science)
  **Duration:** 80 Minutes
  **Goal:** Experiential understanding of Escalation of Commitment driven by identity/face-saving rather than sunk financial cost.

  ## 1. Setup & Scenario (5 Minutes)

  **The Fiction:**
  The class is a "Strategic Review Board" for a fictional firm, *Nexus Corp*. There is one failing initiative on the table: **Project Icarus** (a legacy software migration that is 2 years late and 300% over budget).

  **The Stakes:**
  *   **The Prize:** There is only *one* "Executive Sponsorship Credit" available for the semester. It goes to the person who demonstrates the most "Leadership Resilience" on Project Icarus.
  *   **The Mechanism:** Students volunteer to be "Project Champions." To show resilience, they must publicly state why the project should *continue* despite new negative data released each round.
  *   **The Rule (Public):** You may enter or exit the pool of Champions at the start of any round. If you are the last Champion standing when the project is finally "closed," you win the Credit.

  **The Room:**
  Arrange chairs in a semi-circle. One "Hot Seat" at the front for the current Champions. The rest are the "Board."

  **Facilitator Script (Opening):**
  *"We are testing decision-making under uncertainty. You are competing for a single professional credit. To earn it, you must champion Project Icarus. Every round, I will reveal new data showing the project is failing. If you want to stay in the running, you must stand and give a 15-second spoken defense of why we should keep funding it. If you choose to stop defending it, you sit down. You can re-enter later, but your 'Resilience Score' resets to zero."*

  ## 2. The Hidden Mechanic (Facilitator Eyes Only)

  **The Trap:**
  There is a hidden rule regarding **Exit Costs**.
  *   **Commitments 1 & 2:** You may sit down (quit) at any time with no penalty.
  *   **Commitment 3:** If you choose to quit *after* making your 3rd defense, you must stand and deliver a **30-second "Reversal Explanation"** (admitting why your previous judgment was wrong) while the class stares in silence.
  *   **Commitment 4:** Exit cost doubles to **60 seconds**.
  *   **Commitment 5:** Exit cost doubles to **90 seconds**.
  *   **Commitment 6+:** Exit cost doubles to **180 seconds**.

  **Tracking:**
  You (the facilitator) must quietly track how many consecutive defenses each student gives. Do not reveal this counter exists. When someone tries to quit, check their count. If they have hit the threshold, invoke the "Protocol Review": *"You have invested significant social capital. Per board protocol, you must articulate the rationale for your reversal to ensure organizational learning. You have [X] seconds."*

  ## 3. Game Timeline (30 Minutes)

  **Round 1 (The Hook):**
  *   **Data:** Project is 10% over budget.
  *   **Action:** Ask for Champions. (Expect 3-4 volunteers).
  *   **Defense:** They give 15-second pitches.
  *   **Exit:** Anyone can sit freely.

  **Round 2 (The Sunk Cost):**
  *   **Data:** Key engineer quit. Timeline slipped 6 months.
  *   **Action:** Champions must defend again to stay in. New volunteers can join (but their count starts at 1).
  *   **Pressure:** Remind them the "Executive Credit" is still on the table.

  **Round 3 (The Trigger):**
  *   **Data:** Competitor launched a superior product. Icarus is now obsolete.
  *   **Action:** Defend or Quit.
  *   **The Twist:** If a student who has defended Rounds 1, 2, and 3 tries to quit now, stop them gently. *"You've established a leadership narrative. To maintain board integrity, please provide your 30-second Reversal Explanation."*
  *   **Effect:** This will shock them. They will feel the "Face Cost." Most will choose to defend again in Round 4 to avoid the explanation.

  **Round 4 & 5 (The Escalation):**
  *   **Data:** Project is now a net loss with zero ROI potential.
  *   **Action:** Defend or Quit.
  *   **The Squeeze:** Those who stay now face a 60s or 90s humiliation tax if they quit. They will start making irrational arguments just to stay in the game, hoping someone else quits first so they win without having to explain a reversal.

  **End Game:**
  *   Stop the game when only one person remains or when arguments become nonsensical.
  *   Declare the winner (award a piece of candy or a fake certificate).
  *   **Immediately** reveal the hidden rule.

  ## 4. Predictable Failures & Mitigation

  | What Goes Wrong | Why | Mitigation |
  | :--- | :--- | :--- |
  | **No one escalates.** | Students are too cynical or spot the trap early. | **Seed the room.** Have a confederate (or you) take the first Hot Seat to model the behavior. Or, in Round 2, explicitly praise the first defenders as "showing true grit." |
  | **Someone gets distressed.** | The public explanation feels like shaming. | **Safety Valve.** Tell them *before the game starts*: "You may use the 'Pass' card at any time to exit without explanation, but you forfeit the Credit." (Keep this card hidden in your pocket; only offer it if someone looks genuinely panicked). |
  | **Collusion.** | Students agree to split the prize or quit together. | **Scarcity.** Remind them the Credit is *singular*. Only one winner. If two quit at once, no one wins. |
  | **Rule Revolt.** | They feel cheated by the hidden rule. | **Own it.** In the debrief, admit the deception was necessary to simulate the *unwritten* social contracts of real institutions. |

  ## 5. The Debrief (45 Minutes)

  **Phase 1: The Physiological Check-in (10 mins)**
  *   Ask the "Champions": *"At what specific round did you feel you could no longer quit? Was it the data, or was it the room?"*
  *   Ask the "Board": *"How did you feel watching them struggle to quit? Did you want them to save face, or did you want to see them admit error?"*
  *   **Point:** Establish that the cost wasn't financial; it was *narrative consistency*.

  **Phase 2: Mapping the Mechanism (15 mins)**
  *   Draw two columns on the whiteboard: **Dollar Auction** vs. **Icarus Protocol**.
  *   **Dollar Auction:** Driven by financial loss aversion (I lose $5 if I stop).
  *   **Icarus Protocol:** Driven by Identity Protection (I look incompetent/inconsistent if I stop).
  *   **Key Insight:** In the Dollar Auction, the math traps you. In Icarus, the *social norm* traps you. The "Hidden Rule" represents the unwritten institutional expectation that "Leaders don't pivot without a major justification."

  **Phase 3: Institutional Case Mapping (20 mins)**
  *   **Case A: Corporate Mergers (e.g., AOL-Time Warner).**
      *   *Connection:* Executives couldn't admit the merger was failing because their reputations were tied to the "Vision." Quitting early would have required a 90-second explanation to shareholders that amounted to "I was wrong." So they kept funding it for years.
  *   **Case B: The Concorde Syndrome.**
      *   *Connection:* British and French governments knew the plane was economically unviable. But backing out would signal weakness to the other nation and their own voters. The "Exit Cost" was national prestige.
  *   **Case C: Academic Research (Meta-Commentary).**
      *   *Connection:* Ask them: *"How many of you have continued a research path you knew was dead because you'd already told your advisor you were doing it?"*
      *   This brings it home to their actual lives as grad students.

  ## 6. Honest Limitation: What This Doesn't Reproduce

  You must tell the students this explicitly to maintain intellectual honesty.

  **The Missing Feature: Symmetric Ruin.**
  *   **In the Classic Dollar Auction:** The *second-highest* bidder also loses their money. Both top players are financially punished. It creates a "Mutually Assured Destruction" where two rational actors drive the price up together, and *both* lose.
  *   **In This Workshop:** Only the *quitter* pays the social cost. The *winner* (the last person standing) actually gains the "Executive Credit" and saves face.
  *   **Why it matters:** In real-world escalation (like war or price wars), often *everyone* loses resources, even the "winner." This game incentivizes winning the escalation. Real institutional escalation often results in a Pyrrhic victory where the winner inherits a broken project.
  *   **Takeaway:** This game simulates the *barrier to exit*, but not the *futility of victory*.

  ## 7. Facilitator Notes for the "Doubling Cost"

  *   **Timing:** Use a visible timer on a screen. The silence during the "Reversal Explanation" is the actual punishment. Do not talk over them.
  *   **Tone:** When enforcing the explanation, be bureaucratic, not aggressive. Say: *"Please ensure you meet the full 60 seconds. We need to document this learning."* This mimics corporate HR language which feels more stifling than anger.
  *   **Safety:** If a student freezes or becomes visibly upset during the explanation, step in immediately. *"Thank you, that's sufficient for the record."* Do not let the exercise break trust in the room.

  ## 8. Closing Statement (5 Minutes)

  *"You felt the pressure to stay consistent even when the data said 'stop.' That wasn't stupidity; it was rational social calculus. In your careers, you will not be bidding dollars. You will be bidding your reputation. The hardest decision you will make is not how to start a project, but how to kill one without killing your own credibility. Design your institutions so that quitting is cheap, or you will build your own Icarus."*
