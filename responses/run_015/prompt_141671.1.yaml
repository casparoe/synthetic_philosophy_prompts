answer: |-
  # The Ashfield Protocol for Commemorative Review

  **Preamble:** This procedure governs the Naming and Memorials Commission. It is designed for volunteers with limited research time. It prioritizes the experience of the public over the intent of the past. It treats installation and removal as **asymmetric acts**. Installation is an active speech act by the city that creates a new obligation for the Second Audience; it requires proof of public benefit. Removal is a cessation of speech that relieves an obligation; it requires proof of public harm or functional failure.

  **Dropped Distinctions:**
  1.  **Original Donor Intent:** We drop this. The one-page memo cannot reliably reconstruct private motive, and the city is the current agent, not the donor. *Loss:* We may offend descendants who feel a promise was broken, but we gain consistency.
  2.  **Artistic Merit:** We drop this. The Commission is not an art board. *Loss:* We may remove great art or keep bad art, but we avoid judging aesthetics without expertise.
  3.  **Financial Cost:** We drop this. Removal or installation costs are for the City Council. *Loss:* We may recommend actions the Council cannot afford, but we keep ethics separate from budget.

  ---

  ### The Procedure

  **Step 1: The Public Forum Test**
  *Question:* Is the object or name on public property, maintained by public funds, or functioning as public infrastructure (e.g., a street name required for 911)?
  *   **Sufficient Answer:** Yes, it is on the city ledger or right-of-way.
  *   **No Answer:** It is on private property or a private campus.
  *   **Disposition:** If **No**, the Commission declines jurisdiction. If **Yes**, proceed to Step 2.

  **Step 2: The Legibility Condition**
  *Question:* Can a reasonably attentive passerby understand what this commemorates and why it is here, using only what is on the site and general local knowledge?
  *   **Sufficient Answer:** Yes, the plaque says "X," and X is known locally; or the object's form makes its function clear.
  *   **No Answer:** No, it requires specialist historical knowledge to understand why this person/place is honored.
  *   **Disposition:** If **No** (and it is a statue/plaque), recommend **Retain with Alteration** (add context) OR **Relocate** (to a museum). If it is a street name, proceed to Step 3 (street names are rarely legible by definition).
  *   **Corollary:** If adding a plaque would change the object's meaning entirely (e.g., turning a honorific into a warning), mark this for Step 6.

  **Step 3: The Capture Test**
  *Question:* Has the object acquired a secondary meaning through public use that overtakes its original purpose?
  *   **Evidence Standard:** Given the one-page memo, capture is established only by: (a) consistent use in local news as a rallying point; (b) police records of repeated conflict at the site; or (c) official use of the site for specific gatherings for at least 10 years.
  *   **Sufficient Answer:** Yes, the record shows consistent public usage diverging from the original intent.
  *   **No Answer:** No, the record is silent, or usage was sporadic/short-term.
  *   **Disposition:** If **Yes**, proceed to Step 4. If **No**, proceed to Step 4 (but weight is lighter).

  **Step 4: The Second Audience Burden**
  *Question:* Does the Second Audience (those who inherit the symbol) bear a burden in using or encountering this commemoration?
  *   **Definition of Burden:** (a) Coerced usage (must say the name to access services); (b) Active hostility (the honoree explicitly excluded or harmed the audience's ancestors); (c) Daily confrontation with a symbol of their own marginalization.
  *   **Sufficient Answer:** Yes, the audience lives here, must use the name, and the honoree acted against their interests.
  *   **No Answer:** No, the audience can avoid the site, or the honoree's actions are unrelated to the audience's identity.
  *   **Disposition:** If **Yes**, this weighs heavily toward **Remove** (for names) or **Relocate** (for statues). If **No**, weigh toward **Retain**.

  **Step 5: The Asymmetry Check (Installation vs. Removal)**
  *Question:* Is this petition to install a new commemoration or remove an existing one?
  *   **If Installation:** Requires **Positive Consensus**. Is there a clear public benefit to honoring this person now? Are they deceased for at least 36 months? (Waiting Period). Are they a living private citizen? (Prohibited).
  *   **If Removal:** Requires **Negative Harm**. Does the retention cause active harm to the Second Audience or confuse the public record?
  *   **Disposition:**
      *   Installation + Living Person = **Reject**.
      *   Installation + Dead < 36 Months = **Defer**.
      *   Removal + No Current Harm = **Retain**.
      *   Removal + Current Harm (Step 4) = **Remove**.

  **Step 6: The Value Handoff**
  *Question:* Have we reached a point where facts run out and values conflict? (e.g., Legibility requires a plaque that changes the meaning; Second Audience wants removal but History says "remember the bad too").
  *   **Procedure:** The Commission must vote. The City Attorney advises on legal risk only. The Chair records the value conflict in the findings.
  *   **Disposition:** **Retain with Alteration** or **Remove** based on majority vote, with a dissenting opinion noted.

  ---

  ### Application to Petitions

  **1. Alden Street**
  *   **Step 1:** Public street. (Pass)
  *   **Step 2:** Street names are inherently illegible without knowledge. (Pass to Step 3)
  *   **Step 3:** Capture? The street is not a rally point, but the name functions as a daily label. (No active capture, but passive presence).
  *   **Step 4:** Second Audience Burden? **Yes.** Residents are descendants of excluded workers. They must use the name for 911, mail, identity. The honoree explicitly excluded their ancestors. This is Coerced Usage + Active Hostility.
  *   **Step 5:** Removal Asymmetry. Does retention cause harm? Yes, it forces the Second Audience to honor a hostile agent daily.
  *   **Disposition:** **Remove.** (The procedure supports the author's sympathy).
  *   **Note:** The library funding is unrestricted; the money stays, the name goes. The procedure separates financial benefit from commemorative honor.

  **2. The Pioneer Mother**
  *   **Step 1:** Public lawn. (Pass)
  *   **Step 2:** Legibility? **No.** It is a generic bronze. A passerby does not know what it commemorates.
  *   **Step 3:** Capture? **Yes (Historical).** Used for "better families" rallies (1930s-50s). **No (Current).** Record shows it has stood unremarked since.
  *   **Step 4:** Second Audience Burden? **No.** Passersby are not coerced. They can walk around it. No current group is forced to honor it.
  *   **Step 5:** Removal Asymmetry. Requires Negative Harm. Past capture does not equal current harm. Removing it erases the history of the rallies unless contextualized.
  *   **Step 6:** Value Handoff. Legibility failed. Needs context. But removal requires current harm.
  *   **Disposition:** **Retain with Alteration.** (Add a plaque explaining the rallies). If the Commission feels the plaque changes the object too much (Corollary to Step 2), they may vote **Retain**. (The procedure supports the author's sympathy to keep it, though likely with a plaque).

  **3. The Bridge**
  *   **Step 1:** Public infrastructure. (Pass)
  *   **Step 5:** Installation Asymmetry.
      *   *Proposal A (Developer/Mother):* Living private citizen. **Reject.** (Procedure prohibits naming for living persons to prevent commodification).
      *   *Proposal B (Labor Organizer):* Deceased 11 months. Waiting Period is 36 months. **Defer.**
  *   **Disposition:** **Defer.** (The procedure *refuses* the author's sympathy. The Labor Organizer cannot be honored yet).
  *   **Reasoning:** The waiting period ensures legacy stability. 11 months is too soon to know if the commemoration will age well or become contentious.

  ---

  ### The Fight Points

  These are the steps where commissioners will argue. Use these for dialogue.

  **1. The Legibility vs. Context Fight (The Pioneer Mother)**
  *   *Context:* Step 2 and Step 6.
  *   *Commissioner A (History Teacher):* "The statue doesn't speak. It's silent. If we have to write a paragraph to explain what it means, we've admitted it failed. A plaque doesn't fix silence; it argues with it."
  *   *Commissioner B (Chaplain):* "Silence isn't failure. It's space. If we cover every silent thing in text, we turn the city into a textbook. Some things are meant to be felt, not read. The plaque isn't an argument; it's an invitation."

  **2. The Second Audience vs. History Fight (Alden Street)**
  *   *Context:* Step 4.
  *   *Commissioner C (Small-Business Owner):* "We're erasing history. If we take his name off the street, we pretend he didn't build the library. We pretend he didn't exist. That's a lie."
  *   *Commissioner D (20-Year-Old Appointee):* "The street isn't a history book. It's a home. You don't put a picture of the landlord who barred your grandfather in the hallway just to 'remember history.' We aren't erasing him; we're evicting him from our front door."

  **3. The Waiting Period Fight (The Bridge)**
  *   *Context:* Step 5.
  *   *Commissioner E (City Attorney):* "Three years. That's the rule. Grief is fresh now. In three years, we'll know if he's a hero or a footnote. We don't vote on headlines."
  *   *Commissioner D (20-Year-Old Appointee):* "In three years, the momentum is gone. The community that loved him will have moved on. You're not protecting history; you're protecting us from feeling anything real. You're asking us to wait until it doesn't matter."

  ---

  ### Limitations of the Procedure

  1.  **It cannot judge private intent.** If Alden wrote the nativist tract secretly, the procedure cannot know. It relies on the "widely circulated" fact. It will miss hidden harms.
  2.  **It cannot fix economic inequality.** Renaming Alden Street does not fix the poverty in the neighborhood. The procedure may create a false sense of justice ("We changed the sign, so we fixed the problem").
  3.  **It relies on thin data.** The one-page memo means the Commission will often decide on incomplete records. They will get things wrong. They will remove things that should have stayed, and keep things that should have gone, simply because the archivist couldn't find the clipping.
  4.  **It cannot decide "Who is Ashfield?"** When the Second Audience conflicts with itself (e.g., old families vs. new immigrants), the procedure has no tie-breaker. It forces a vote where there is no right answer.

  \answer{Alden Street: remove; Pioneer Mother: retain; Bridge: defer}
