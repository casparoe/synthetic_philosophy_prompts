      *   *Middle Ground (Conditional Approval):* This allows the board to maintain the "Research/Education" requirement (aligning with Corvids/Pigeons/Cats) while acknowledging the welfare improvements. We condition approval on the addition of an educational/research component that validates the use beyond mere decoration. This repairs the coherence: we allow use when it generates knowledge/understanding (Corvid/Pigeon), we disallow use when it is purely ornamental/entertainment without knowledge (Photo/Cat).
      *   *Decision:* **Approve with Conditions.** The conditions must transform the "purely artistic" aim into a legitimate inquiry or educational framework to satisfy the "legitimate purpose" requirement seen in Corvid/Pigeon precedents and avoid the "no goal" pitfall of the Cat precedent.

  4.  **Drafting the Memo:**
