  **INSTITUTIONAL ANIMAL USE AND OVERSIGHT BOARD (IAUOB)**
  **MEMORANDUM OF DECISION**

  **TO:** Principal Investigators, Department of Aesthetics and Cognitive Science
  **FROM:** Institutional Animal Use and Oversight Board
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Protocol #2023-AC "Emergent Canvas"

  **DECISION:** **APPROVED WITH CONDITIONS**

  **I. ETHICAL FRAMEWORK AND PRECEDENT ANALYSIS**

  This Board operates under an informal Kantian framework regarding non-research protocols. We recognize that while animals are not rational ends-in-themselves possessing direct moral rights, human beings hold indirect duties to avoid treating them with cruelty or "contemptuous instrumentality." Such treatment is prohibited not solely for the animal's sake, but because it corrupts human moral character and weakens our regard for rational beings. Our precedents establish that animal use is permissible when it serves a legitimate scientific or educational purpose (Corvid Neuroethology; Pigeon Behavioral Economics) and impermissible when it reduces animals to ornamental objects or subjects them to unpredictable stress without intellectual justification (Commercial Photography; Interactive Museum Cats).

  **II. RATIONALE**

  **A. Welfare and Instrumentality**
  The Board acknowledges the significant strengths of this proposal regarding animal welfare. Unlike the rejected commercial photography protocol, the "Emergent Canvas" aquaria are enriched, and unlike the rejected museum cat installation, the interaction is non-social and predictable, minimizing anxiety. The veterinary safeguards and withdrawal rights align with our commitment to avoid physical suffering.

  However, under our Kantian framework, the absence of pain is necessary but not sufficient. We must also assess whether the *purpose* of the use degrades the animal into a mere tool in a way that coarsens human sensibility. The proposal explicitly states there is "no scientific hypothesis" and the aim is "purely artistic." This presents a coherence problem with our precedent regarding the interactive museum cats, which was rejected specifically for serving "no research, education, or conservation goal." To approve a protocol that explicitly lacks an inquiry-based goal would undermine the distinction we drew in the *Pigeon* precedent, where we required "publishable findings" to justify the use of animals.

  If the octopuses are utilized solely as randomizing agents to generate decorative patterns, this risks "contemptuous instrumentality." It reduces a complex, sentient cephalopod to a biological function key. Even in comfortable conditions, using a sentient being purely as a means to an aesthetic end, without an intent to learn from or understand that being, threatens the moral character of the researchers and the audience. It encourages viewers to see the animal as a producer of commodities (images) rather than a subject of cognitive interest.

  **B. Consideration of the Counter-Argument**
  The Board gives honest weight to the strongest consideration on the opposing side. We recognize that the octopuses in this protocol will likely experience a higher quality of life than many animals in approved scientific studies, including the food-deprived pigeons. Furthermore, we acknowledge that restricting artistic expression risks imposing an arbitrary boundary on human creativity. If the animals suffer no harm, and the output is non-exploitative art, one could argue that blocking this project imposes a restriction our framework does not clearly mandate. There is merit to the view that art which highlights non-human agency can *enhance*, rather than degrade, moral regard.

  However, the current protocol design does not guarantee this enhancement. Without a structured intent to study or educate regarding the animal's cognition, the project defaults to ornamentation. To remain consistent with our precedents, we cannot approve use based on welfare alone; there must be a teleological justification that elevates the human-animal interaction beyond consumption.

  **III. CONDITIONS FOR APPROVAL**

  To repair the coherence of this decision with our precedents (specifically *Pigeon* and *Corvid*) and to ensure the protocol aligns with our indirect-duty framework, the Board requires the following modifications prior to commencement:

  1.  **Mandated Educational/Analytical Component:**
      *   **Requirement:** The protocol must be amended to include a formal plan for data analysis or public education regarding octopus cognition. The "digital canvas" cannot be the sole output. Researchers must commit to publishing or presenting findings on the *behavioral patterns* observed (e.g., color preference, spatial mapping, decision latency), even if no null-hypothesis testing is involved.
      *   **Justification:** This aligns the protocol with the *Pigeon* precedent (requiring publishable findings) and the *Corvid* precedent (legitimate scientific purpose). It ensures the animals are treated as subjects of inquiry rather than mere tools for decoration, thereby fostering human understanding rather than contemptuous instrumentality.

  2.  **Visitor Contextualization:**
      *   **Requirement:** All gallery displays of the "digital canvas" must be accompanied by explicit educational signage detailing the natural history, cognitive capabilities, and welfare provisions of the octopuses. The art must be framed as a record of animal *agency*, not merely abstract composition.
      *   **Justification:** This addresses the Kantian concern for human moral character. It prevents the audience from viewing the output as purely ornamental (the flaw in the *Commercial Photography* precedent) and ensures the interaction cultivates respect for the non-human mind.

  3.  **Habituation and Enrichment Review:**
      *   **Requirement:** A mid-protocol review (at 3 months) must be conducted by the attending veterinarian to assess whether "habituation to lights" has led to stereotypic behavior or reduced engagement.
      *   **Justification:** While applicants argue habituation is non-harmful, the Board requires empirical verification that the animals remain actively engaged rather than passively conditioned, ensuring the "free movement" claim remains valid.

  **IV. CONCLUSION**

  This decision balances our commitment to high welfare standards with our duty to prevent the degradation of animals into mere means. By adding a requirement for inquiry and education, we transform the octopuses from "living paintbrushes" into "subjects of study," thereby satisfying the indirect duty to maintain our own moral regard for sentient life.

  Please submit a revised protocol reflecting these conditions within fourteen (14) days.

  **Signed,**

  *The Institutional Animal Use and Oversight Board*
