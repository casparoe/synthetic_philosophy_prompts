answer: |-
  ### Exam Question

  **Question 1 (25 Marks)**

  Consider two housemates, Priya and Quill. They must decide on two continuous issues:
  1.  **Spare Room:** A dial from 0 (Priya's Music Studio) to 1 (Quill's Home Office).
  2.  **Food Rule:** A dial from 0 (Strictly Vegan) to 1 (Anything Goes).

  Priya places high value on the Room (prefers 0) and low value on Food (indifferent). Quill places high value on Food (prefers 1) and low value on the Room (indifferent).

  Contrast this with a **One-Issue Case**: They must divide a fixed sum of money, where any gain for one is a loss for the other.

  In a coherent essay, address the following five points:
  1.  Demonstrate why a **package deal** (logrolling) where each gets their high-priority issue strictly dominates a "meet-in-the-middle" compromise on both issues.
  2.  Explain why, in the **One-Issue Case**, a compromise cannot be a Pareto improvement over the winning outcome, and what this implies for the slogan that "compromise creates gains."
  3.  Identify the exact **structural feature** of the Two-Issue Case that enables mutual gain without requiring interpersonal comparison of utility.
  4.  Introduce a **sacred-value wrinkle**: Suppose Quill views non-vegan food as morally forbidden (lexicographic preference). Does this kill compromise entirely or merely narrow it?
  5.  Compare the **"meet-in-the-middle"** heuristic against **maximizing a weighted sum of value functions**. Which is analogous to "gains from trade"? Explain the role of **convexity** in determining whether the middle or the extremes are efficient.

  ***

  ### Model Answer

  The analogy between compromise and gains from trade holds only when preferences diverge in intensity across multiple dimensions. In the Two-Issue Case, Priya and Quill have different marginal rates of substitution. Priya values the Room marginally more than the Food; Quill values the Food marginally more than the Room. A "meet-in-the-middle" compromise (e.g., 50% Studio, 50% Vegan) forces each agent to accept a suboptimal outcome on their high-priority issue to gain on a low-priority one. Because Priya cares little about Food, giving her 100% Vegan yields little utility compared to the utility Quill loses by not having the Office. Conversely, giving Priya 100% Studio costs Quill little. Therefore, a package deal where Priya takes the Room (0) and Quill takes the Food (1) creates a net surplus. This allocation strictly Pareto dominates the split-difference compromise because it aligns resource control with intensity of preference.

  In the One-Issue Case (dividing money), the situation is zero-sum. The feasible frontier is a straight line with slope -1. Any movement away from the "winning" outcome (where one gets everything) toward a compromise reduces the winner's utility to increase the loser's. While a compromise might be better than a conflict point (no agreement), it is not a Pareto improvement over the efficient frontier where one party wins entirely. The slogan "compromise creates gains" is therefore misleading in single-dimension conflicts; it conflates *conflict avoidance* with *efficiency*. Gains from trade require positive-sum structures, which single-issue division lacks.

  The structural feature enabling gain in the Two-Issue Case is **divergent intensity of preference** (different MRS), not divergent ordinal rankings alone. We do not need to compare Priya's "utils" to Quill's. We only need to observe that within Priya's preference ordering, Room > Food, and within Quill's, Food > Room. Trade is possible because the "price" of the Room in terms of Food is low for Quill but high for Priya. This is an arbitrage opportunity based on internal valuation ratios, requiring no interpersonal cardinal comparison.

  If we introduce a sacred-value wrinkle where Quill has a lexicographic preference for Veganism (Food must be 0, regardless of Room), the possibility of gain changes. Lexicographic preferences create a discontinuity; no amount of Room access compensates for non-vegan food. This does not necessarily kill compromise entirely if the Room issue remains tradable, but it narrows the feasible set of agreements to the Vegan edge. However, if the sacred value applies to the *only* issue Quill cares about, trade collapses. In our scenario, since Quill cares about Food, a lexicographic constraint on Food prevents the logrolling solution. Priya cannot "buy" the Room with non-vegan concessions because Quill will not accept *any* non-vegan outcome. Compromise is killed on that dimension, potentially destroying the surplus from trade on the other if linkage is required.

  Finally, we must distinguish "meet-in-the-middle" from "maximizing the weighted sum." Maximizing a weighted sum of value functions ($\lambda U_P + (1-\lambda) U_Q$) identifies a point on the Pareto frontier. This is the true analogue to gains from trade, as it ensures no value is left on the table. "Meet-in-the-middle" is a fairness heuristic, not an efficiency criterion. Convexity is crucial here. If preferences are strictly convex over the issues, agents prefer diversity (averages) to extremes *individually*. However, in a trading context with divergent intensities, the *joint* efficient outcome often lies at the corners (specialization). If the Pareto frontier is concave (due to convex preferences), the weighted sum maximization will select a corner solution where intensities differ vastly. "Meet-in-the-middle" ignores this geometry, potentially selecting an interior point that is Pareto inefficient. Thus, gains from trade are realized by maximizing the sum (efficiency), not by splitting the difference (equality), and convexity determines whether that maximum lies at the compromise or the extreme.

  ***

  ### Marking Scheme (25 Marks Total)

  **1. Package Deal vs. Meet-in-the-Middle (5 Marks)**
  *   **Full Marks:** Clearly argues that allocating issues based on intensity (logrolling) yields higher joint utility than splitting both issues. Explicitly notes that splitting forces high costs on high-valuation agents for low gains on low-valuation issues.
  *   **Common Pitfall:** Argues compromise is better because it is "fairer." Fails to distinguish between total utility and equal distribution. Assumes splitting issues is inherently more stable without proving efficiency.

  **2. One-Issue Zero-Sum & Pareto (5 Marks)**
  *   **Full Marks:** Identifies the one-issue case as zero-sum (linear frontier). Correctly states that compromise is a movement *along* the frontier, not an expansion of it. Notes that compromise is only better than *conflict*, not better than *efficient dictatorship*.
  *   **Common Pitfall:** Claims compromise is always a Pareto improvement. Confuses the "status quo" (no agreement) with the "efficient frontier" (one side wins). Fails to challenge the "both sides gain" slogan.

  **3. Structural Feature & Interpersonal Comparison (5 Marks)**
  *   **Full Marks:** Identifies **divergent intensity/MRS** as the key feature. Explicitly states that interpersonal comparison of utility is *not* required; only ordinal rankings within each agent's bundle are needed to identify the trade.
  *   **Common Pitfall:** Claims we need to measure "how much" Priya cares vs. Quill in absolute terms. Confuses divergent *preferences* (wanting different things) with divergent *intensities* (caring more about X than Y).

  **4. Sacred Values / Lexicographic (5 Marks)**
  *   **Full Marks:** Defines lexicographic preference (no trade-off acceptable). Correctly deduces that this creates a discontinuity/constraint that eliminates the logrolling surplus on that issue. Nuanced view: kills trade on that dimension, may collapse total deal if issues are linked.
  *   **Common Pitfall:** Says sacred values just make negotiation "harder" without explaining the structural break. Assumes compromise is still possible by "meeting halfway" on the sacred value (which is definitionally impossible).

  **5. Weighted Sum vs. Middle & Convexity (5 Marks)**
  *   **Full Marks:** Identifies **Weighted Sum** as the efficiency/gains-from-trade analogue. Identifies **Middle** as a fairness heuristic. Explains that **Convexity** of preferences usually implies individuals like averages, but in trade with divergent intensities, the *efficient* joint outcome is often a corner solution (specialization), making the "middle" inefficient.
  *   **Common Pitfall:** Claims "meet-in-the-middle" is the rational solution. Misunderstands convexity (e.g., thinks convexity means the frontier is bowed *in*). Fails to link weighted sum maximization to Pareto efficiency.
