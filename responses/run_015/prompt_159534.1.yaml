answer: |-
  This is a sophisticated problem that sits at the intersection of metaphysics, ethics, and law. You have correctly identified that "causation by omission" is not merely about physics (what didn't happen) but about **normative expectations** (what *should* have happened).

  Your intuition is tracking a distinction philosophers call **Omissions vs. Mere Absences**. A mere absence is anything that didn't happen (e.g., the Queen of England didn't water your plant). An omission is a failure to do something you were expected to do.

  Here is the extraction of your implicit rule, the test against your cases, the hard compromises you must make, and the application to your new scenarios.

  ### Part 1: The Extracted Principle

  Based on your verdicts, you are not using a single physical test (like counterfactual dependence). You are using a **Normative Jurisdiction Principle**.

  **The Rule:**
  An agent's failure to act causes an outcome if and only if three conditions are met:
  1.  **Efficacy (The NESS Condition):** The action was a Necessary Element of a Sufficient Set to prevent the outcome. (This handles Case 8 where one guard wasn't enough, but the pair was).
  2.  **Assumed Jurisdiction (The Duty Condition):** The agent was operating within a specific practice, role, or commitment that generated a legitimate expectation that they would perform the action. (This handles Cases 1, 4, 6 vs. 3, 5, 7).
  3.  **Salience (The Uniqueness Condition):** The agent's failure is not one of many interchangeable failures where the expectation is diffuse across a crowd. (This handles Case 9).

  ### Part 2: Testing the Rule Against Your Cases

  Here is how the rule processes your nine verdicts, clause by clause.

  *   **Case 1 (On-duty Lifeguard):** **Pass.**
      *   *Efficacy:* Yes, she could have saved him.
      *   *Jurisdiction:* Yes, employment contract/role.
      *   *Salience:* Yes, she is the designated rescuer.
  *   **Case 2 (Off-duty Lifeguard):** **FAIL.**
      *   *Efficacy:* Yes.
      *   *Jurisdiction:* **No.** She is "off duty" and in "ordinary clothes." She has the *capacity*, but she has not assumed the *jurisdiction*.
      *   *Salience:* Yes.
      *   *Result:* To keep your rule consistent, **you must reassign this verdict to match Case 3.** She did not *cause* the death, though she may be morally blameworthy.
  *   **Case 3 (Non-swimmer Tourist):** **Pass.**
      *   *Jurisdiction:* No. Verdict: No causation.
  *   **Case 4 (Housemate Promise):** **Pass.**
      *   *Jurisdiction:* Yes, the promise creates a temporary role.
  *   **Case 5 (Guest):** **Pass.**
      *   *Jurisdiction:* No. Verdict: No causation.
  *   **Case 6 (Tennis):** **Pass.**
      *   *Jurisdiction:* Yes, by joining the game, you accept the rules and the duty to play the ball.
  *   **Case 7 (Charity):** **Pass.**
      *   *Jurisdiction:* **No.** This is the crucial distinction. You are a moral agent, but you have not assumed specific jurisdiction over *that specific child*. The expectation is general, not local. Verdict: No causation.
  *   **Case 8 (Two Keys):** **Pass.**
      *   *Efficacy:* Yes. Neither alone was sufficient, but each was a *Necessary Element of a Sufficient Set* (NESS). The set {Guard A turns, Guard B turns} was sufficient; Guard A was necessary for that set.
      *   *Jurisdiction:* Yes, both are guards.
  *   **Case 9 (Twenty Bystanders):** **Pass (with a caveat).**
      *   *Efficacy:* Yes, any one was sufficient.
      *   *Jurisdiction:* **No.** Bystanders generally have no specific duty.
      *   *Salience:* **No.** Because there are 20 interchangeable agents, no single omission is salient.
      *   *Result:* Your verdict ("Group caused, Individual didn't") works only if we treat the "Group" as a collective agent with a moral jurisdiction, while denying it to the individuals. This is the weakest point of the rule, but it holds together if you argue that *collective inaction* can be a cause even when *individual inaction* is too diffuse to count.

  ### Part 3: The Hard Truths (Where the Rule Breaks)

  You asked for honesty. Here are the two costs of adopting this rule for your essay.

  **1. You must sacrifice Case 2.**
  You said Case 2 feels "different" from Case 1. Your rule explains why: Case 1 is a violation of **Justice** (breach of duty), while Case 2 is a violation of **Beneficence** (failure to be kind). In ordinary language, we often blur these. But for a rigorous essay on *causation*, you must distinguish them.
  *   **The Cost:** If you say the off-duty lifeguard *caused* the death, you must admit that the non-swimming tourist *also* caused it, just to a lesser degree. If you say the tourist *didn't* cause it, you must admit the off-duty lifeguard *didn't* either.
  *   **Recommendation:** Align Case 2 with Case 3. Argue that causation requires a "normative hook." Without the uniform or the shift, she is just a capable bystander. This strengthens your distinction between Case 6 (Tennis) and Case 7 (Charity). In Tennis, you entered a "local jurisdiction." In Charity, you remain in the "general public."

  **2. Case 9 is a "Collective Agent" Fiction.**
  Your verdict on Case 9 ("The group's failure caused it") is intuitively satisfying but metaphysically risky. Groups don't act; individuals do.
  *   **The Cost:** You have to argue that "The Group" is a valid agent for the sake of causation.
  *   **Recommendation:** Frame this as **Explanatory Salience**. We say "The group failed" because citing any single individual is misleading. It is not that the individual *didn't* cause it physically, but that citing them fails to explain *why* the building burned (since others would have failed anyway).

  ### Part 4: Deciding Your New Cases (10–12)

  Applying the **Normative Jurisdiction Principle**:

  **10. The Automated Assistant**
  *   **Analysis:** The assistant is a tool, not an agent. It has no jurisdiction. You set up the system. The omission is yours (failure to input instruction).
  *   **Verdict:** **Your omission caused the zero.**
  *   **Nuance:** If the assistant malfunctioned after you entered the instruction, the cause shifts to the glitch (or the developer). But since you "never entered the instruction," the causal chain stops at your failure to engage the tool.

  **11. The CO Detectors (The Absent Official)**
  *   **Analysis:**
      *   *Efficacy:* Yes, detectors would have helped.
      *   *Jurisdiction:* The *Office* of Safety has jurisdiction. The *Official* who left two years ago does not. Causation requires control at the time of the risk.
      *   *Salience:* The current administration is the salient failure.
  *   **Verdict:** **The School District (as an institution) caused the death. The specific official did not.**
  *   **Reasoning:** Causation tracks responsibility. Once the official left the post, they surrendered the jurisdiction. To blame them is to ignore the intervening opportunity for the successor to fix the error.

  **12. The Flood Barrier (1970 vs. 2025)**
  *   **Analysis:**
      *   *Efficacy:* Yes, the barrier would have stopped the water.
      *   *Jurisdiction:* The 1970 Council had jurisdiction *then*.
      *   *Salience/Remoteness:* The chain is too long. Between 1970 and 2025, countless other decisions were made (zoning, maintenance, climate changes).
  *   **Verdict:** **The 1970 Councillors did not cause the 2025 deaths.**
  *   **Reasoning:** This is the problem of **Causal Remoteness**. While their vote was a "but-for" condition, it is not the *proximate* cause. The immediate cause is the 2025 flood conditions combined with the 2025 lack of protection. The 1970 decision is background history, not active causation.

  ### Part 5: The Surprise Case (Case 13)

  Here is a case constructed to test your "Activity/Jurisdiction" clause. It often surprises students because it reverses the intuition about "doing nothing."

  **Case 13: The Interrupted Rescue**
  > A stranger is drowning in a lake. You are walking by.
  > **Scenario A:** You keep walking. You do nothing.
  > **Scenario B:** You wade in to save them, get tired, decide it's too risky, and turn back. The stranger drowns.
  > **Verdict:** In Scenario A, you did **not** cause the death (no jurisdiction). In Scenario B, you **did** cause the death (or are significantly more responsible).

  **Why this decides this way:**
  By starting the rescue, you created a **reliance interest**. You may have deterred others from helping, or you raised the victim's expectation of safety. You entered the "Activity" (Jurisdiction Clause 2) and then abandoned it.
  *   **The Surprise:** Doing *something* and stopping can make you a cause, whereas doing *nothing* keeps you innocent of causation.
  *   **Lesson for your essay:** Causation by omission is not static. It can be *created* by prior action. This reinforces your distinction between Case 6 (Tennis—you joined the game) and Case 7 (Charity—you never joined).

  ### Summary for your Essay

  Your core insight is correct: **Omissions are not causal in a vacuum; they are causal within a context of expectation.**

  1.  **Define Causation:** Use the "Normative Jurisdiction" model. An omission causes harm only when the agent had a specific duty to prevent it.
  2.  **Resolve Case 2:** Be brave. Classify the off-duty lifeguard with the tourist. Distinguish *moral blame* (she was unkind) from *causal responsibility* (she wasn't the guardian).
  3.  **Resolve Case 6 vs 7:** Use the concept of "Local Practices." Tennis is a local practice with defined duties. Global poverty is a general condition where no specific agent has exclusive jurisdiction.
  4.  **Handle Overdetermination (Case 8 & 9):** Use the NESS test for joint necessity (8) and Explanatory Salience for diffuse responsibility (9).

  This framework will give you a robust, defensible thesis that moves beyond simple "but-for" testing and engages with the moral philosophy underlying our legal and social concepts of cause.
