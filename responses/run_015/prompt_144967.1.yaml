      *   **(6) Rejection of Layer Problem:** Moral weight tracks causal influence/identity-continuity within a chain, not population counts across isolated runs.
      *   **(7) Evolutionary Debunking:** Longtermism rests on structural reasoning, not evolved intuition, so debunking arguments fail.

