      *   So (3) is about *intrinsic* value (my sim is real). (6) is about *instrumental* priority (I can't help them).
      *   The tension is that (6) is phrased as "moral weight tracks..." (Intrinsic) rather than "priority tracks..." (Instrumental).
      *   So the tension is linguistic/philosophical categorization.

      *   *Final Plan:*
