  8.  **Refining the "Drop" Recommendation:**
      *   If I drop (6), do I have to accept (5)'s conclusion (shift to suffering in sims)?
      *   Not necessarily. I can reject (5)'s *implication* without accepting (6)'s *reasoning*.
      *   Rejection of (5)'s implication can be based on *uncertainty* or *causal inaccessibility* rather than *moral weight*.
      *   So, dropping (6) allows replacing it with "Causal Inaccessibility." This cleans up the tension with (2) (Impartiality).
      *   Wait, is there a better drop?
