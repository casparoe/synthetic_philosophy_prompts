prompt: |-
  I teach an upper-level jurisprudence seminar, and this term I want to stage a mock adversarial collaboration rather than another rehearsal of the familiar mid-century exchange about whether the criminal law may be used to enforce morality. As a teaching artifact — and, frankly, because I want to see whether the thing can be done at all — I need you to draft the joint statement that two contemporary parties could actually sign. Party A is a legal moralist who concedes that the empirical disintegration thesis is in poor shape and has therefore reformulated the view: call it constitutive moralism. On this view a political society's shared morality is partly constituted by being given legal expression, so that decriminalising a practice does not merely fail to prevent a subsequent decline in adherence to a norm, but changes which morality it is that the society shares; the criminal law is not a cause of social cohesion but one of the places where a society's moral identity is made and declared. Party B is a Hartian liberal of a concessive stripe: she grants that some substantial shared morality is a necessary condition of any society worth having, insists on the distinction between a society's positive morality and the critical assessment of it, and denies only that legal enforcement does any work in securing or sustaining that shared morality which is not better done by leaving the norm to non-legal transmission, or which is positively undone when the law takes it up.

  Two stipulations, so that neither side is a straw man. First, both accept that the cases which prompted the original exchange are settled: neither is arguing that consensual homosexual acts or prostitution should be criminalised, and neither may rest anything on them. I want the substance tested on cases we design instead, and here are three I would like used rather than substituted: (i) the segregated spectacle — a commercial practice that nearly every member of the society finds viscerally disgusting, performed only in venues no one enters without consenting to enter, and which harms or sets back no one's interests on any account of harm the liberal is willing to employ; (ii) the seepage variant of that same case, in which good survey evidence shows that people who come to accept the practice are, over the following decade, measurably less likely to comply with unrelated norms of honesty and mutual aid, though the direction of causation is entirely unestablished; (iii) the minority test, which is my own addition and which both parties must address — a moral conviction is eligible for legal enforcement only if the society would continue to hold it, and continue to want it enforced, even were its adherents reduced to a small and politically weak minority. Please also have both parties address the assurance argument I have been sketching in seminar: much moral compliance is conditional on the belief that others also comply; open and legally tolerated flouting degrades that assurance; and a declaratory criminal law is a cheap, reliable device for restoring it. Both should say whether the expressive work this argument assigns to the criminal law could in principle be done by non-legal institutions, and at what cost.

  What I want from you is the document itself, with no preamble, no framing remarks and no history of the debate. Open with a single sentence stating the headline result: the most substantial claim the two parties found they could sign and that neither expected to sign. Then give a numbered section of agreed claims — claims about the formalism of the disagreement, about what a successful moralist argument would have to establish, about what the liberal concedes, about the three cases, and about the assurance argument — each claim phrased so that it is not vacuous: at least one party should have been inclined to reject it before the collaboration began. Follow this with a table of residual disagreements, in which each disagreement is stated twice, once in the moralist's own preferred wording and once in the liberal's, and neither wording is a caricature. Then a section on cruxes: for each, the question such that settling it would move at least one party, the case or piece of evidence both agree would bear on it, and each side's prediction about that evidence written down in advance, including what they would count as a result neither of them predicted. If you conclude that some part of the dispute is verbal rather than substantive — for instance if the constitutive claim and the causal claim collapse into one another under pressure — say exactly which part and why. Do not smooth the disagreement over with balancing formulae, do not attribute views to any named author or work, and do not give me a verdict on who wins.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**

      *   **Task:** Draft a joint statement resulting from a mock adversarial collaboration between two contemporary legal philosophers.
      *   **Parties:**
          *   *Party A (Constitutive Moralism):* Legal moralist. Concedes empirical disintegration thesis is weak. Argues law *constitutes* shared morality/identity, not just protects it. Decriminalization changes *which* morality is shared.
          *   *Party B (Concessive Hartian Liberal):* Grants shared morality is necessary for a good society. Distinguishes positive vs. critical morality. Denies law is needed to secure/sustain shared morality (non-legal transmission is better or law undermines it).
      *   **Stipulations/Constraints:**
          *   No preamble, framing, or history.
          *   Open with a single sentence: The most substantial claim both signed (unexpectedly).
          *   Section 1: Numbered Agreed Claims (Formalism, Burden of Proof, Liberal Concessions, The Three Cases, Assurance Argument). Must not be vacuous (at least one side initially inclined to reject).
          *   Section 2: Table of Residual Disagreements (Two columns: Moralist wording, Liberal wording). No caricatures.
          *   Section 3: Cruxes (Question, Agreed Evidence/Case, Pre-commitment Predictions including "unexpected result").
          *   Section 4: Verbal vs. Substantial Dispute Analysis (If applicable).
          *   **Forbidden:** No named authors/works, no balancing formulae, no verdict on who wins.
          *   **Specific Cases to Address:**
              1.  *Segregated Spectacle:* Consensual, disgusting, no harm (by liberal standards), segregated venues.
              2.  *Seepage Variant:* Correlation with decline in honesty/mutual aid (causation unknown).
              3.  *Minority Test:* Enforcement eligible only if held/wanted even if adherents were a weak minority.
          *   **Specific Argument to Address:** *Assurance Argument:* Moral compliance is conditional; flouting degrades assurance; criminal law restores it. (Can non-legal institutions do this? At what cost?)

  2.  **Drafting - Section by Section:**

      *   **Headline Result:** Needs to be surprising. Usually, the divide is "Law *can* enforce morality" vs. "Law *must not*." A convergence point might be on the *purpose* of the law regarding identity or the limits of harm. Let's aim for the idea that the *symbolic* function of law is real, but the *cost* of using it is the battleground.
      *   *Draft:* Both parties agree that the criminal law functions inescapably as a declaratory medium of collective identity, such that the only live dispute is whether the specific costs of that declaration outweigh the specific costs of its absence in any given instance.

      *   **Agreed Claims:**
          1.  *Formalism:* The debate isn't about "harm principle vs. moralism" in the abstract, but about the *mechanism* of social cohesion.
          2.  *Burden:* Moralist must show law adds value beyond non-legal norms; Liberal must show non-legal norms are sufficient for *assurance*.
          3.  *Liberal Concession:* Shared morality is necessary (against pure neutrality).
          4.  *Case 1 (Spectacle):* Disgust alone is insufficient for A without the constitutive claim; B agrees it's permissible to ban *if* it constitutes identity, but denies necessity.
          5.  *Case 2 (Seepage):* Correlation isn't causation. A says law interrupts the cultural signal; B says law creates a forbidden fruit effect or hypocrisy.
          6.  *Case 3 (Minority Test):* Both agree this is a necessary constraint on enforcement to prevent tyranny of the majority.
          7.  *Assurance:* Both agree assurance is valuable. Disagreement is on the *exclusive* capacity of law to provide it.

      *   **Refining Agreed Claims (Making them non-vacuous):**
          *   Need to ensure A admits law *could* be unnecessary sometimes, and B admits law *does* constitute identity even if it shouldn't.
          *   *Claim 1:* The criminal law inevitably performs an expressive function regarding the society's moral boundaries, regardless of whether that function is justified. (B might have wanted to deny law *should* do this, but admits it *does*).
          *   *Claim 2:* The "Minority Test" is a necessary condition for the legitimacy of any moralistic legislation. (A might have resisted limiting moralism to majority durability, but accepts it to avoid oppression).
          *   *Claim 3:* In the "Segregated Spectacle" case, the absence of legal prohibition would alter the qualitative character of the society's shared self-understanding, even if it caused no measurable increase in harmful conduct. (B concedes the *constitutive* effect, denies the *justification*).
          *   *Claim 4:* Regarding the "Assurance Argument," non-legal institutions (family, church, market) can theoretically provide moral assurance, but only at a significantly higher transaction cost and with lower reliability than a public legal standard. (A thinks law is unique; B thinks non-legal is better, but admits law is *cheaper/more reliable*).
          *   *Claim 5:* In the "Seepage Variant," the mere existence of a correlation between permissiveness and norm-decline shifts the burden of proof to the Liberal to demonstrate that criminalization would worsen the decline. (A thinks burden is on Liberal always; B thinks burden is on Moralist always. This compromise shifts it based on evidence).

      *   **Residual Disagreements (Table):**
          *   Need distinct voices.
          *   *Topic:* The Constitutive Claim.
              *   Moralist: Law is a *necessary* locus of moral identity formation.
              *   Liberal: Law is a *blunt* locus that distorts moral identity.
          *   *Topic:* The Assurance Mechanism.
              *   Moralist: Only state coercion guarantees the common knowledge required for assurance.
              *   Liberal: State coercion creates false assurance based on fear, not moral commitment.
          *   *Topic:* The Seepage Case.
              *   Moralist: Precautionary principle applies; ban to stop potential cultural rot.
              *   Liberal: Liberty principle applies; allow unless direct causation is proven.

      *   **Cruxes:**
          *   Need specific empirical/theoretical questions.
          *   *Crux 1:* Does criminalization strengthen or weaken internal moral commitment?
              *   Evidence: Longitudinal study of norm compliance after decriminalization vs. criminalization.
              *   Predictions: A says compliance drops without law. B says commitment drops with law.
              *   Unexpected: Compliance stays same, but *reasons* for compliance shift (from moral to prudential).
          *   *Crux 2:* The Minority Test viability.
              *   Evidence: Historical analysis of norms that survived minority status.
              *   Predictions: A says few survive without law. B says robust norms survive without law.
              *   Unexpected: Norms survive only when *opposed* by law (martyrdom effect).

      *   **Verbal vs. Substantial:**
          *   Is "Constitutive" just "Causal" in disguise?
          *   If law constitutes morality, it causes morality to be *this* rather than *that*.
          *   Conclusion: The dispute is substantial regarding the *value* of the constituted identity, not the mechanism.

  3.  **Review and Refine:**

      *   *Check Constraints:* No preamble? Yes. Single sentence headline? Yes. Numbered claims? Yes. Table? Yes. Cruxes? Yes. Verbal analysis? Yes. No named authors? Yes.
      *   *Check Tone:* Academic, precise, jurisprudential.
      *   *Check Specific Cases:* Ensure Spectacle, Seepage, and Minority Test are explicitly handled in the claims or table.
      *   *Check Assurance Argument:* Ensure the "cost" of non-legal institutions is addressed.
      *   *Check Party Positions:*
          *   A (Constitutive): Law makes the morality.
          *   B (Hartian): Law shouldn't touch morality, it's distinct.
      *   *Refining the Headline:* Make sure it sounds like a genuine breakthrough. "The criminal law is an inescapable constitutive force" is something a Hartian usually denies (they think law *can* be separate). So if B signs that, it's significant.
      *   *Refining the Claims:* Ensure they aren't trivial. "Law affects society" is trivial. "Law changes *which* morality is shared" is the constitutive claim. B conceding this is the win.
      *   *Refining the Table:* Ensure the wording reflects the specific philosophical commitments (Constitutive vs. Instrumental/Causal).
      *   *Refining Cruxes:* Make sure the predictions are specific.

  4.  **Final Polish:** (Self-Correction during drafting)
      *   *Correction:* In the Agreed Claims, make sure I don't smooth over the disagreement too much. The prompt says "neither side is a straw man" and "do not smooth the disagreement over." The agreement should be on the *terms* of the fight, not the outcome.
      *   *Correction:* Ensure the "Minority Test" is treated as a constraint both accept, which is a big deal for a Moralists who usually rely on majority sentiment.
      *   *Correction:* Ensure the Assurance Argument addresses the "cost" of non-legal institutions as requested.

  5.  **Final Output Generation** (Proceeding to generate text based on these thoughts).
answer: |-
  Both parties agree that the criminal law functions inescapably as a declaratory medium of collective identity, such that the only live dispute is whether the specific costs of that declaration outweigh the specific costs of its absence in any given instance.

  **I. Agreed Claims**

  1.  **The Formalism of the Disagreement:** The disagreement is not about whether the law *can* influence moral attitudes (both concede it does), but about whether the law's *proper function* includes the intentional shaping of those attitudes as an end in itself, or whether such shaping is an impermissible side-effect even when beneficial.
  2.  **The Burden of Proof:** In cases where a practice is widely regarded as viscerally disgusting but harmless (the Segregated Spectacle), the burden rests on the Liberal to demonstrate that non-legal censure can sustain the relevant moral boundary without the expressive weight of criminal prohibition; conversely, the burden rests on the Moralist to demonstrate that the specific moral identity constituted by prohibition is superior to the identity constituted by tolerance.
  3.  **The Liberal Concession:** A society requires a substantial substrate of shared positive morality to function as a cooperative scheme, and the state is not required to remain neutral between all conceptions of the good life so long as basic liberties are secured.
  4.  **The Constitutive Effect:** Decriminalizing a practice does not merely remove a sanction; it alters the content of the society's shared morality by removing that prohibition from the set of norms that define the political community's public identity.
  5.  **The Seepage Variant:** In the presence of empirical evidence correlating permissiveness with a decline in unrelated norms (honesty, mutual aid), mere uncertainty about causation is insufficient to settle the debate; the Moralist must show that criminalization would reverse the decline, and the Liberal must show that criminalization would accelerate it or fail to arrest it.
  6.  **The Minority Test:** A moral conviction is eligible for legal enforcement only if the society would continue to hold it, and continue to want it enforced, even were its adherents reduced to a small and politically weak minority; both parties agree this is a necessary constraint to distinguish shared moral identity from factional oppression.
  7.  **The Assurance Argument:** Both parties agree that open and legally tolerated flouting of a norm degrades the assurance necessary for conditional moral compliance; they further agree that while non-legal institutions (religious bodies, professional associations, familial structures) could in principle restore this assurance, doing so would require significantly higher transaction costs and would result in a fragmented rather than a public assurance.

  **II. Residual Disagreements**

  | Topic | Party A (Constitutive Moralism) | Party B (Concessive Hartian Liberal) |
  | :--- | :--- | :--- |
  | **The Nature of Legal Expression** | The criminal law is a unique site where moral identity is *made*; without legal expression, the morality remains private and fails to achieve the public status required for social cohesion. | The criminal law is a blunt instrument that *distorts* moral identity; when law takes up a norm, it replaces moral commitment with prudential compliance, hollowing out the very value it seeks to protect. |
  | **The Segregated Spectacle** | Banning the Spectacle is justified because allowing it constitutes the society as one that tolerates visceral degradation, which is a moral injury to the collective identity even if no individual interest is set back. | Banning the Spectacle is unjustified because the collective identity is better constituted by a commitment to non-interference in consensual acts, and the "moral injury" is merely the discomfort of prejudice. |
  | **The Assurance Mechanism** | Only the state can provide the *common knowledge* required for assurance; non-legal signals are too noisy and allow for plausible deniability by flouters, rendering the assurance unstable. | State coercion provides *false* assurance based on fear of punishment rather than trust in others' virtue; non-legal institutions foster deeper assurance because compliance is voluntary and thus signal genuine commitment. |
  | **The Cost of Non-Legal Institutions** | The cost of relying on non-legal institutions is the fragmentation of the moral community into sects and subcultures, destroying the "shared" nature of the shared morality. | The cost of relying on the law is the politicization of morality, turning every moral disagreement into a battle for state power and increasing social hostility. |

  **III. Cruxes**

  **Crux 1: The Crowding-Out Effect**
  *   **Question:** Does the introduction of criminal sanctions for a moral norm strengthen the norm by providing assurance, or weaken it by crowding out intrinsic moral motivation?
  *   **Agreed Evidence:** A longitudinal comparative study of two jurisdictions with similar cultural baselines, where one criminalizes a specific vice (e.g., aggressive panhandling or public intoxication) and the other decriminalizes it, measuring not just incidence rates but survey data on *personal moral commitment* to the norm over a decade.
  *   **Party A Prediction:** The jurisdiction with criminalization will show higher stability in personal moral commitment because the law sustains the assurance that others also value the norm.
  *   **Party B Prediction:** The jurisdiction with decriminalization will show higher stability in personal moral commitment because compliance remains a matter of conscience rather than prudence.
  *   **Unexpected Result:** Both parties agree that if the study shows *no difference* in moral commitment but a significant difference in social hostility (polarization) between the jurisdictions, the current framework for evaluating the "cost" of law is inadequate.

  **Crux 2: The Minority Test Viability**
  *   **Question:** Can a robust shared morality survive without legal enforcement when its adherents become a minority?
  *   **Agreed Evidence:** Historical analysis of social norms (e.g., dueling, temperance, segregation) that transitioned from majority-enforced legal mandates to minority-held moral convictions.
  *   **Party A Prediction:** Norms that lose legal enforcement rapidly cease to be "shared" and become mere lifestyle preferences, losing their cohesive power.
  *   **Party B Prediction:** Norms that lose legal enforcement either vanish (proving they weren't deeply held) or survive as genuine moral commitments (proving law was unnecessary).
  *   **Unexpected Result:** Both parties agree that if norms survive *more robustly* specifically because they were *persecuted* by the law (a martyrdom effect), the Minority Test requires revision to account for the galvanizing power of legal opposition.

  **IV. Analysis of Verbal vs. Substantial Dispute**

  A portion of the dispute regarding the "Constitutive Claim" risks collapsing into a verbal disagreement over the definition of "cause." Party A argues that law *constitutes* morality, implying a conceptual relationship: the morality *is* the law-backed norm. Party B argues that law *causes* changes in moral attitudes, implying an empirical relationship: the morality exists independently and is affected by the law.

  However, under the pressure of the Assurance Argument and the Seepage Variant, this distinction proves substantive rather than verbal. Party A is not merely claiming law causes moral belief; they are claiming that the *public status* of the norm is partially ontologically dependent on its legal recognition. Party B denies this ontological dependence, viewing the public status as dependent on social uptake alone. This is not a semantic slide; it is a disagreement about the metaphysics of social facts. If Party A is correct, decriminalization literally destroys the object (the shared public norm) that Party B wishes to preserve through non-legal means. If Party B is correct, the object persists independently, and the law is merely an external tool that may damage it. Therefore, the dispute remains substantive: it turns on whether the "sharedness" of a morality is internally or externally related to the state's coercive apparatus.
