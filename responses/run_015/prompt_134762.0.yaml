answer: |-
  This is a classic friction point in game theory seminars. The TA is invoking a well-known heuristic (often associated with Harsanyi's Purification Theorem or the Aumann/Brandenburger epistemic program), but they are using it to sidestep a technical question about rationality constraints.

  Your intuition is correct: the slogan does not technically answer whether a dominated strategy can be in a support. In fact, under every standard interpretation of that slogan, the answer to your question remains **"No."**

  Here is the menu you requested, breaking down the slogan into precise claims, evaluating their validity, and checking if they address your specific question about strict domination in continuous games.

  ### The Menu: Unpacking "Mixed Strategies are Ignorance"

  #### (a) The Epistemic Claim
  *   **The Claim:** Mixed strategies do not exist as physical randomizations by the player. Instead, the "probability" represents the *opponent's uncertainty* (belief) about which pure strategy the player will choose.
  *   **Verdict:** **Defensible.** This is the standard "belief interpretation" found in interactive epistemology (Aumann, Brandenburger). It is mathematically equivalent to the standard formalism in Nash Equilibrium.
  *   **Does it answer your question?** **Yes.**
      *   *Reasoning:* If mixing is just opponent belief, then for a strategy $s_i$ to be in the "support," the opponent must assign it positive probability. However, for the player to be rational, they must be playing a Best Response. A strictly dominated strategy is *never* a Best Response to any belief. Therefore, a rational player would not play it, and a rational opponent (knowing this) would not believe it is played. The support cannot contain strictly dominated strategies.

  #### (b) The Normative Claim
  *   **The Claim:** Rational agents are forbidden from using external randomizing devices (coin flips). They must always choose a deterministic action.
  *   **Verdict:** **False (as stated) / Trivial (if purified).**
      *   *Reasoning:* It is false because rational agents *often* need to mix to keep opponents indifferent (e.g., Matching Pennies). However, it becomes trivial if interpreted via **Purification**: every mixed equilibrium can be modeled as a pure equilibrium in a game with slight private information.
      *   **Does it answer your question?** **No.**
      *   *Reasoning:* Whether I flip a coin or consult a private signal (purification), I am still maximizing expected utility. If a pure strategy is strictly dominated, it yields lower utility than an alternative regardless of how I choose it. Banning randomization devices doesn't make dominated strategies permissible; it just changes how we model the choice.

  #### (c) The Metaphysical Claim
  *   **The Claim:** Human choice is deterministic; there is no ontological indeterminacy in the universe.
  *   **Verdict:** **Irrelevant.**
      *   *Reasoning:* Game theory is a model of consistency between beliefs and choices, not a theory of free will. Whether the universe is deterministic doesn't change the payoff matrix.
      *   **Does it answer your question?** **No.**
      *   *Reasoning:* This is philosophy, not game theory. It offers no leverage on whether a dominated strategy can be part of an optimal support.

  #### (d) The Methodological (Population) Claim
  *   **The Claim:** A "mixed strategy" is not an individual choice but a description of the distribution of pure strategies across a population of agents (Evolutionary Game Theory).
  *   **Verdict:** **Defensible.** This is the standard interpretation in evolutionary contexts.
  *   **Does it answer your question?** **Yes.**
      *   *Reasoning:* In a population, strategies that are strictly dominated yield lower fitness/payoffs. Evolutionary dynamics (like Replicator Dynamics) will drive the proportion of agents playing strictly dominated strategies to zero. They cannot persist in the support of the population distribution.

  ---

  ### The Technical Answer (For your confidence)

  Before you go to office hours, you need to know the actual math so you don't get snowed.

  **The Theorem:** In any game (continuous or discrete), if a pure strategy $s_i$ is **strictly dominated**, it cannot be in the support of any mixed strategy $\sigma_i$ that is a **Best Response** to any belief $\mu_{-i}$ about the opponents.
  *   *Proof Sketch:* If $s'$ strictly dominates $s$, then $u(s', \mu_{-i}) > u(s, \mu_{-i})$ for *all* beliefs $\mu_{-i}$. Therefore, $s$ can never maximize expected utility. If $\sigma_i$ puts positive weight on $s$, you could shift that weight to $s'$ and strictly improve payoff. Thus, a rational player never includes $s$ in their support.

  **The Continuous Nuance:** In continuous games, you must be careful about "strict" vs. "weak" domination and measure-zero sets. However, if a strategy is *strictly* dominated (everywhere), it is never a best response. The TA's slogan does not override this.

  ---

  ### Office Hours Strategy

  The TA is likely conflating **why mixing occurs** (the slogan) with **what constraints mixing** (rationality). They might be thinking of Purification Theorem, where a mixed strategy in the base game corresponds to pure strategies in a perturbed game. But even there, the "types" playing the strategies in the support are playing best responses *for their type*.

  Here is your script to determine if they are making a point or dodging:

  **1. Test the Epistemic Interpretation:**
  > "If we accept the epistemic claim that mixing is just opponent uncertainty, does that change the definition of rationality? If I am rational, can I play a strategy that yields strictly lower payoff than another, regardless of what you believe? If not, doesn't that mean dominated strategies are excluded from the support regardless of whether we call it 'mixing' or 'ignorance'?"

  **2. Test the Purification Angle:**
  > "Are you invoking Harsanyi's Purification Theorem? If so, I understand that a mixed NE can be viewed as pure strategies in a game with incomplete information. But in the *original* game with complete information, if a strategy is strictly dominated, isn't it still true that no 'type' in the purified game would play it if the perturbation is small enough? Or are you suggesting domination is ill-defined in continuous games?"

  **3. The Direct Challenge:**
  > "I'm trying to distinguish between the *ontology* of mixing (is it real randomization?) and the *constraints* on mixing (can it include dominated actions?). It seems the slogan addresses the ontology, but my question is about the constraints. Can you clarify if the slogan implies that rationality constraints don't apply to the support in continuous settings?"

  ### Summary for your notes
  *   **Is the TA dodging?** Likely. The slogan is a philosophical stance on the *nature* of probability, not a loophole for *rationality conditions*.
  *   **The Truth:** A rational player never includes a strictly dominated pure strategy in their support, regardless of whether mixing is "real" or "ignorance."
  *   **The Win:** If you force them to choose between "Mixing is ignorance" and "Rational players maximize expected utility," you will show that the slogan does not permit dominated strategies. If they insist it does, they are claiming that rational players can maximize utility by choosing strictly inferior options, which is false.
