answer: |-
  Assign function based on the trait's current contribution to the organism's survival or operation unless documented history is explicitly invoked to explain deviation or obsolescence.

  ### The Procedure

  **Step 1: Determine History Status**
  Ask: *Is there a documented origin for this trait in the series bible?*
  *   **Designed:** Explicitly engineered by terraformers or humans.
  *   **Evolved-Known:** Lineage is tracked; ancestral function is recorded.
  *   **Evolved-Unknown:** Lineage is blank or lost (the default for wild species).
  *   **Sufficient Answer:** Check the bible. If unchecked, mark "Evolved-Unknown."
  *   **Branch:** If **Designed**, proceed to Step 2A. If **Evolved**, proceed to Step 2B.

  **Step 2A: Designed Traits (The Terraformer Branch)**
  Ask: *Does the trait still perform its designed purpose?*
  *   **Yes:** Function = Design Purpose. (e.g., "Filtering toxin X.")
  *   **No:** Function = Current Use. Add note: "Designed for [Original], now [Current]."
  *   **Firm No:** If it performs neither design purpose nor current use, label "Vestigial/Obsolete."

  **Step 2B: Evolved Traits (The Lineage Branch)**
  Ask: *Is the ancestral function different from the current use?*
  *   **No:** Function = Current Use.
  *   **Yes (Exaptation):** Function = Current Use. Add note: "Exapted from [Ancestral]."
  *   **Evolved-Unknown:** Function = Current Use. Add note: "Lineage undocumented."
  *   **Firm No:** If the trait contributes nothing to survival/operation and history is unknown, label "Vestigial/Neutral."

  **Step 3: The Narrative Handback**
  Ask: *Does the scene rely on the history rather than the utility?*
  *   **Yes:** You may override Step 2's primary label for dialogue or internal monologue, but the bible entry must retain the Step 2 classification.
  *   **No:** Stick to Step 2.
  *   **Handback Point:** This is the only point where you choose emphasis over consistency; the editor files the Step 2 classification, you write the Step 3 emphasis.

  **Step 4: Generate the Entry**
  Format: *Function: [Primary Assignment]. Note: [Origin/Deviation].*
  *   **Constraint:** Maximum two lines.

  ### Philosophical Survival Guide
  *   **Keep:** The distinction between **Etiological Function** (what it was selected/designed for) and **Causal Role Function** (what it currently does). This procedure prioritizes Causal Role for clarity but logs Etiological data for consistency.
  *   **Drop:** Debates on **Malfunction** (whether a broken trait retains its function) and **Teleosemantics** (how function relates to meaning). For your purposes, a broken trait is "Obsolete" or "Damaged," not functionally ambiguous. Drop the distinction between "proper function" and "accidental benefit"; if it helps survival now, it counts as function.

  ### Worked Cases

  **(1) Hollow cranial crest inherited from a burrowing ancestor, now used by the animal in courtship display.**
  *   **Step 1:** Evolved-Known (Burrowing ancestor).
  *   **Step 2B:** Ancestral function (structural/resonance for burrowing) differs from current use (display). This is exaptation.
  *   **Step 3:** Unless the scene is about paleontology, the narrative emphasis is on the mating dance.
  *   **Step 4 Output:** *Function: Courtship display. Note: Exapted from burrowing resonance structure.*
  *   **Analysis:** The procedure prioritizes the current mating utility over the ancestral digging utility, logging the origin as a note.

  **(2) Implanted filtration organ, originally installed by the terraformers to remove a toxin, which in the descendant population now mainly drives circulation fast enough that my characters call it a second heart.**
  *   **Step 1:** Designed (Terraformers).
  *   **Step 2A:** Designed purpose (filtration) differs from current use (circulation).
  *   **Step 3:** Characters call it a "heart," implying narrative emphasis on circulation.
  *   **Step 4 Output:** *Function: Circulatory pump. Note: Designed toxin filter, repurposed by selection.*
  *   **Analysis:** The procedure classifies it as a heart (current utility) despite its design origin.
  *   **Dislike Prediction:** You will likely dislike this answer. By prioritizing current contribution, the procedure demotes the "terraformers' intent" to a footnote, effectively biologizing a piece of technology. If your theme relies on the persistence of human design over natural selection, this output erases the thematic weight of the organ's origin in favor of its physiological utility.

  **(3) A bioluminescent frill on an organism whose lineage record I have intentionally left unwritten.**
  *   **Step 1:** Evolved-Unknown (Intentionally blank).
  *   **Step 2B:** History unavailable. Default to current contribution.
  *   **Step 3:** No historical data to emphasize.
  *   **Step 4 Output:** *Function: Signaling/Communication. Note: Lineage undocumented.*
  *   **Analysis:** The procedure forces a functional assignment based on observation alone, preventing the trait from being "mysterious" in the bible even if it remains mysterious in the text.
