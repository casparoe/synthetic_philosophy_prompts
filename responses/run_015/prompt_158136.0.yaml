answer: |-
  Here is a sequence of three sharp, interconnected questions designed to corner the thesis without giving her room to hide behind standard philosophical distinctions.

  ### Question 1: The Empirical vs. Conceptual Trap
  "You argue that the Global Workspace 'broadcast' is phenomenally hollow and that what we call phenomenality is just access with a tight feedback loop. This sounds like you're collapsing Ned Block's distinction between Access and Phenomenal consciousness, rather than defending it.

  So, I need you to pin this down: Is *The Broadcast Gap* making a new empirical prediction about dissociation—for example, that in split-brain patients we should find intact feedback loops without reportability? Or are you simply proposing a conceptual reframing where 'phenomenality' is just a label we slap on high-bandwidth access? If it's the latter, why shouldn't neuroscientists ignore this as semantic shuffling?"

  **Why this works:** It forces her to commit. If she says it's empirical, you can press for data that doesn't exist yet. If she says it's conceptual, you undermine the scientific weight of her book. It also pre-empts her citing Block as authority by pointing out her theory actually undermines his dissociation argument.

  ### Question 2: The Falsification Condition
  "Let's assume your 'tight feedback loop' model is correct and phenomenality is just a trick of immediacy. I want to know what breaks that model.

  What specific piece of evidence would convince you that phenomenal consciousness is *real* and separate from access? If we found a neural correlate that fired only during subjective experience but *never* influenced behavior or reportability—essentially a 'pure' qualia neuron—would that falsify your theory? Or is your definition of the feedback loop flexible enough to absorb any counter-evidence by claiming it *must* have accessed the workspace eventually?"

  **Why this works:** Illusionist/functionalist theories often suffer from being unfalsifiable (i.e., "any feeling you have is just the loop"). This asks her to name the "smoking gun" that would prove the Hard Problem is actually hard. If she can't name one, her theory is dogma, not science.

  ### Question 3: The Substrate Smuggling Test
  "Finally, let's follow the functionalism to its end. If phenomenality is just access plus a specific feedback architecture, biology shouldn't matter.

  If I build a silicon-based global workspace with that exact same tight feedback loop, do you grant it phenomenal states? If you say **yes**, you're accepting that philosophical zombies are impossible. If you say **no**, you're smuggling in a biological substrate requirement that contradicts your own functional definition. Which is it: is the 'fake immediacy' real enough for a machine, or is there something about the wetware you're not accounting for?"

  **Why this works:** This is the closer. It exposes whether she is a true functionalist or a secret biological naturalist. It forces her to either defend AI consciousness (which alienates some audiences) or admit her theory has a hidden "biology" clause that undermines the "feedback loop" argument.

  ***

  **Podcaster Tip:** If she tries to wiggle out of Q1 by saying "It's both," press her on the **split-brain** specifically. That is the battleground for Access vs. Phenomenal. If her theory doesn't change how we interpret split-brain data, it's not doing any work.
