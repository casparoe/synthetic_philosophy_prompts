      *   *Drafting:* "In *The Broadcast Gap*, you argue the broadcast is hollow. Does this mean split-brain patients have two phenomal fields but one access workspace? Or are you just renaming things?"
      *   *Refining for Sharpness:* Make it a forced choice. If it's empirical, where's the data? If it's conceptual, why should neuroscientists care?
      *   *Final Polish:* Focus on the "gap." Is it a measurable latency or a metaphysical claim?

