      *   *Refining for Sharpness:* Accuse her of "substrate smuggling." If she says no to AI, she's not a pure functionalist. If she says yes, she accepts philosophical zombies are impossible.
      *   *Final Polish:* Connect it back to the "faked immediacy." If the machine fakes it perfectly, is the fake real?

  6.  **Review and Refine (Self-Correction against Constraints):**
      *   *Constraint Check:* Did I let her retreat to Block?
      *   *Correction:* Need to explicitly mention Block in the first question to show I know the literature and won't accept a lazy appeal to authority.
      *   *Tone Check:* Are these sharp? Yes, they challenge the coherence of her position.
      *   *Flow:* Empirical -> Falsification -> Implications (AI).

  7.  **Final Polish of the Questions (incorporating into the final output):**
