          *   Middle: Ask for falsification conditions (what evidence would convince her P-consciousness *is* real/separate?).
          *   End: Automation/AI question (functional loop without biology = phenomenal states? Or is substrate smuggling involved?).
          *   Tone: Sharp, specific, not generic "what drew you to this."

  2.  **Deconstruct the Guest's Position:**
      *   She accepts GWT for Access.
      *   She denies the "broadcast" *itself* creates phenomenality.
      *   She claims Phenomenality = Access + Tight Feedback Loop (creating an illusion of immediacy).
      *   *Implication:* This sounds like a version of Illusionism (Keith Frankish, Daniel Dennett) or a specific Functionalism. It challenges the "Hard Problem" by dissolving it.
      *   *Vulnerability:* If it's just a feedback loop, why does it feel like something? If it's an illusion, who is being fooled? (The homunculus worry). Also, the Block distinction is the standard defense against this; the prompt asks to prevent her from just waving the Block wand without justification.

  3.  **Drafting Question 1: Empirical vs. Conceptual (The Opener)**
      *   *Goal:* Pin her down. Is this science or philosophy?
