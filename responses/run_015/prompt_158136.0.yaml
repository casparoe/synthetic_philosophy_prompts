      *   *Final Polish:* Focus on the "excess" of phenomenology. If the loop is perfect, is there anything left over? Ask for a specific experimental outcome that validates the "Hard Problem" against her "Gap."

  5.  **Drafting Question 3: AI/Substrate (The Closer)**
