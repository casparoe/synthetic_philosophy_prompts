  ### 1. Translation into Decision-Theoretic Terms

  In statistical decision theory, the pragmatic encroachment debate translates directly to the optimization of a decision threshold $\tau$ under a specific loss function $L$. Let hypothesis $H_1$ represent the proposition $p$ and $H_0$ represent $\neg p$. Evidence $E$ yields a likelihood ratio $\Lambda(E)$. Standard invariantist epistemology assumes a fixed credence threshold for knowledge (akin to a fixed significance level $\alpha$). Encroachment argues that the validity of the knowledge claim varies with practical stakes.

  In decision-theoretic terms, "knowing $p$" maps to the decision rule $\delta(E) = 1$ (act as if $p$ is true). The stakes correspond to the cost matrix: $C_{FP}$ (cost of false positive) and $C_{FN}$ (cost of false negative). The Bayes optimal decision rule rejects $H_0$ only when the posterior odds exceed the ratio of losses: $\frac{P(H_1|E)}{P(H_0|E)} > \frac{C_{FP}}{C_{FN}}$.

  High-stakes scenarios (e.g., the train case) imply asymmetric losses where $C_{FN}$ (crashing) dwarfs $C_{FP}$ (delay). This inflates the required likelihood ratio $\Lambda(E)$ to trigger acceptance. Low-stakes scenarios flatten the loss ratio, lowering the threshold. Thus, the encroachment claim that "stakes affect knowledge" is mathematically identical to the statement that "loss functions optimize decision thresholds." The subject "knows" in low stakes because the optimal action is to accept $H_1$; they "don't know" in high stakes because the optimal action is to withhold acceptance pending more data. The sliding scale of justification is precisely the sliding scale of $\alpha$ in a Neyman-Pearson test where power is constrained by cost. In low stakes, you tolerate higher $\alpha$ (false positive rate) to reduce $\beta$ (false negative rate). In high stakes, you suppress $\alpha$ drastically, requiring stronger evidence to reject the null. The epistemic "justification" is nothing more than the statistical power required to satisfy the loss function's constraints.

  ### 2. Residue Report: Clean Mappings, Distortions, Missing Pieces

  **Clean Mappings:** The mapping of stakes to loss coefficients ($C_{FP}, C_{FN}$) is exact. The shifting "standard for knowledge" maps cleanly onto the sliding decision threshold $\tau$ derived from the Neyman-Pearson lemma. The distinction between "mere belief" and "knowledge" parallels the distinction between high posterior probability and decisive action. When the loss ratio shifts, the critical region shifts, mirroring the intuitions of the bank case.

  **Distortions:** To make the mapping hold, we must distort the framework with an extra 'assertion norm' parameter. Decision theory dictates *action*, not *belief*. An agent can optimally act as if $H_1$ is true without believing it (e.g., hedging or insurance). Encroachment requires us to conflate the action threshold with a doxastic threshold. We must impose a constraint that $\text{Belief}(p) \iff \text{Act}(p)$, which decision theory does not mandate. This forces a square peg (utility maximization) into a round hole (truth-aimed belief).

  **Missing Pieces:** The factivity of knowledge has no counterpart. In decision theory, you can make the optimal decision based on expected utility and still be wrong (Type I/II errors occur). In epistemology, you cannot "know" $p$ if $p$ is false. Decision theory optimizes over distributions; knowledge claims are singular and factive. Furthermore, decision theory is agent-relative (my loss function), while knowledge attribution often carries social normative force (testimony) that loss functions don't capture. You can tell someone "I know" even if their loss function differs, which breaks the decision-theoretic mapping. This suggests the "assertion norm" parameter must be socialized, not just individualized, creating a multi-agent game theory problem rather than a single-agent decision problem. This complicates the clean reduction but doesn't restore a distinct epistemic norm; it just adds complexity to the utility function.

  ### 3. Verdict with the Base-Rate Twist

  Pragmatic encroachment is statistical decision theory misdescribed. It adds no distinctive epistemic work. Consider the twist: the agent fixes the evidential threshold $\tau$ before learning the base rate $\pi = P(H_1)$. This forces a minimax or robust optimization strategy rather than Bayesian expected utility minimization. The agent must set $\tau$ to withstand worst-case prevalence.

  Does encroachment survive? No. High stakes simply widen the robustness region required for acceptance. The agent demands higher likelihood ratios to buffer against unknown $\pi$ when $C_{FN}$ is high. This is purely risk management. I commit to the reductionist view: "Knowledge" is merely a folk-psychological label for "confidence sufficient to act given current loss parameters." The intuition that something *epistemic* changes is a cognitive illusion conflating the precision of the signal with the cost of the error. There is no separate epistemic norm being encroached upon; there is only the single norm of rational action under uncertainty. The vocabulary of epistemology obscures the underlying calculus of risk. When you fix $\tau$ under base-rate uncertainty, you are simply maximizing minimum utility. Encroachment theorists call this "changing knowledge"; statisticians call it "adjusting for model uncertainty." The latter description is causally and normatively sufficient. There is no ghost in the machine. The "base-rate twist" confirms this: fixing $\tau$ under uncertainty is a robustness constraint, not an epistemic shift. If encroachment were genuine, the *truth-connection* would vary, not just the action-readiness. Since only the action-readiness varies with stakes and uncertainty, the phenomenon is purely pragmatic. Epistemologists are reifying a decision boundary.
