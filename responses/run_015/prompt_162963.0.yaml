answer: |-
  ### Desiderata for Bounded, Strategic Value of Information

  **1. Ideal Limit Recovery (Non-negotiable)**
  *Case:* When the attention budget approaches infinity and the update procedure converges to Bayesian conditioning, the measure must converge to the standard Expected Utility (EU) gain defined by Good's Theorem.
  *Rationale:* Ensures the framework is a generalization of, not a contradiction to, ideal decision theory.

  **2. Procedural Fidelity (Non-negotiable)**
  *Case:* The valuation must calculate expected utility based on the agent's *actual* posterior (generated by the fixed update procedure), not the ideal Bayesian posterior.
  *Rationale:* A signal that triggers a heuristic bias may have negative value even if it is informative in the Shannon sense; the measure must track the agent's cognitive architecture.

  **3. Unified Negativity via Non-Disposability (Non-negotiable)**
  *Case:* The measure must permit $VoI < 0$ without ad-hoc cost terms. The mechanism is that information is not costlessly disposable: acquiring it consumes attention (opportunity cost) or forces public disclosure (strategic cost).
  *Rationale:* Distinguishes between "costly information" (price tag) and "dangerous information" (unavoidable update or leakage); both are modeled as constraints on disposability.

  **4. Utility Denomination (Non-negotiable)**
  *Case:* The output must be in the agent's utility units, not bits, variance, or currency.
  *Rationale:* Only utility allows direct comparison with the opportunity cost of attention and other decision-theoretic trade-offs.

  **5. Encoding Relativity (Preference)**
  *Case:* The measure should be invariant to signal labeling *unless* the agent's update procedure is sensitive to encoding (e.g., framing effects).
  *Rationale:* Standard invariance is desirable for robustness, but must yield to Procedural Fidelity if the bounded updater treats "50%" differently from "1/2".

  **6. Ex-Ante Tractability (Preference)**
  *Case:* The value must be computable by the agent prior to acquisition, within the current attention budget.
  *Rationale:* An uncomputable value cannot guide a stopping rule; however, this may conflict with modeling complex strategic reactions.

  **7. Sequential Decomposability (Preference)**
  *Case:* The total value of a sequence should be decomposable into marginal values at each stage.
  *Rationale:* Facilitates dynamic programming or greedy stopping rules, though path-dependence in bounded updating may render this approximate.

  ***

  ### Incompatibilities and Deliverable

  No single scalar satisfies the full list. The primary conflict is between **Procedural Fidelity** and **Encoding Relativity**: if the bounded updater is sensitive to signal framing, the VoI measure *must* also be sensitive to framing to be accurate, violating standard invariance. Second, **Ex-Ante Tractability** conflicts with **Strategic Correctness**: accurately valuing public signals requires solving for other agents' reactions, which may be computationally intractable for a bounded agent.

  **The Deliverable:** Do not seek a scalar $V(signal)$. The output must be a **conditional valuation functional** $V_\rho(S | \Gamma)$, indexed by the specific update procedure $\rho$ and the strategic context $\Gamma$. Alternatively, report a **pair of bounds**: the private value (ignoring strategic leakage) and the strategic value (including equilibrium reactions), acknowledging the gap as the cost of publicity.

  ***

  ### The Single Exclusionary Requirement

  **Procedural Fidelity** does the most work. It rules out **Mutual Information** (which ignores utility and decision rules), **Expected Variance Reduction** (which assumes quadratic loss and ideal conditioning), and **Standard Expected Utility Gain** (which assumes Bayesian updating). It forces the measure to account for the possibility that more evidence degrades performance due to processing limits.

  ***

  ### Scorecard for Standard Proxies

  *   **Expected-Utility Gain:** Fails on bounded updating and strategic non-disposability.
  *   **Mutual Information:** Fails on utility denomination and decision-rule relevance.
  *   **Expected Variance Reduction:** Fails on non-quadratic loss and procedural fidelity.
  *   **Probability Optimal Act Changes:** Fails on payoff magnitude and strategic side-effects.
