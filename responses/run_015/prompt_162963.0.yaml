  3.  **Address the "Two Things Matter More" (Incompatibilities):**
      *   *Issue 1: Invariance vs. Boundedness.* Standard VoI (Good's Theorem) assumes Bayesian updating, which is representation invariant (probability theory is coherent). A *fixed update procedure* (e.g., a heuristic, a neural net, a limited memory buffer) often depends on *how* data is presented. If the updater is sensitive to framing/encoding, the VoI measure *must* be sensitive to framing/encoding to be accurate. Therefore, strict representation invariance is incompatible with accurate modeling of bounded updating.
      *   *Issue 2: Ex-ante Computability vs. Strategic Correctness.* To know the value of a public signal ex-ante, the agent must predict how *others* will react. If others are also bounded or strategic, this requires solving for an equilibrium or simulating their bounded reasoning. If the environment is complex (non-common priors, opaque algorithms), exact ex-ante computation might be uncomputable or require resources exceeding the attention budget. There's a tension between "computable by *this* bounded agent" and "correctly accounts for *that* strategic reaction."
