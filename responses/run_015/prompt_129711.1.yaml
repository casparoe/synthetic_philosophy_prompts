answer: |-
  # Seminar Defense Prep Sheet: Endogenous Disagreement in Kalai-Smorodinsky

  **Goal:** Survive the Q&A without conceding the core thesis, while acknowledging technical limitations.
  **Tone:** Confident but humble on the math, aggressive on the intuition.

  ### 1. Strategic Concessions (Say these early)
  *Don't wait for them to corner you. Drop these in your opening remarks or the first answer to disarm the room.*

  *   **Concede Uniqueness:** Admit that by dropping standard Monotonicity, you might lose the *unique* solution property that makes standard KS attractive. Frame this as a feature, not a bug: "In dynamic contracts, a *range* of stable outcomes is more realistic than a single point."
  *   **Concede the "T=0" Problem:** Acknowledge that your model requires *some* exogenous anchor for the very first round of bargaining. You are modeling *renegotiation*, not creation ex nihilo.
  *   **Concede Pareto Efficiency:** Explicitly state that your modification preserves Pareto Optimality. If you lose efficiency, you lose the economists immediately.

  ---

  ### 2. The Objections (Ordered by Damage Potential)

  #### **Threat Level: CRITICAL**
  **Who:** The Coop Game Theory Grad Student
  **The Objection:** "You're swapping out the defining axiom of Kalai-Smorodinsky. Monotonicity is what guarantees the solution picks the proportional claim on the Pareto frontier. If you replace it with a 'local envy' condition based on a *past* feasible set, how do you even guarantee existence? If preferences shift or the frontier rotates, your 'local' reference point might lie outside the *current* feasible set. Are you defining a solution that doesn't exist?"

  **Your 2-Minute Reply:**
  "That's the exact technical tension I'm wrestling with, and here's my defense. I'm not discarding the proportional claim; I'm constraining it. Standard KS assumes the utopia point is the only reference. I'm arguing that in repeated contracting, the *previous* frontier acts as a credibility constraint. If the new feasible set expands, but the old ideal point is still attainable, agents view that as a baseline entitlement.
  To answer existence: I restrict the domain to cases where the prior agreement is strictly inside the new feasible set—which is the definition of a 'renegotiation' scenario. If the new set shrinks, we aren't bargaining; we're in breach. So, within the domain of contract renewal where value is created, the 'local envy' condition simply truncates the KS line. It might yield a segment rather than a point, but that segment is non-empty and Pareto efficient. I'm trading uniqueness for dynamic stability."

  **The Soft Spot:**
  If they press you on the math of the "segment," admit you haven't fully formalized the selection rule *within* that segment. Don't bluff a proof. Say: "The selection within the stable segment is determined by relative bargaining power, which is outside the axiomatic scope."

  #### **Threat Level: HIGH**
  **Who:** The Nash Purists (The Two Economists)
  **The Objection:** "This is just path dependence dressed up as axioms. Nash Bargaining works because it's ahistorical; it only cares about the current feasible set and the current threat point. By tying the solution to the *prior* feasible set, you violate Independence of Irrelevant Alternatives (IIA). You're saying the outcome depends on options that are no longer available. Why shouldn't we just model this as a multi-stage game with a fixed Nash solution at each node?"

  **Your 2-Minute Reply:**
  "Because the 'threat point' in a contract renewal isn't a static outside option; it's a psychological and legal anchor. If you treat every round as a fresh Nash game, you ignore reliance interests. Agents invest based on the expectation that gains won't be clawed back arbitrarily in the next round.
  My 'local envy' condition captures the cost of breaking that reliance. Violating IIA here isn't a bug; it's the empirical reality of long-term contracting. If I agreed to less last year because I was promised a larger share of future growth, a standard Nash solution ignores that promise. My modification internalizes the history of the relationship into the solution concept, which a multi-stage Nash game treats as separate, unrelated events. I'm modeling the *relationship*, not just the transaction."

  **The Soft Spot:**
  They will argue that "psychological anchors" aren't game theory. You can't defend this with math. Stand firm on the *Philosophy of Econ* angle: "If the model ignores the mechanism by which $d$ is formed, it's descriptively false."

  #### **Threat Level: MEDIUM**
  **Who:** The Procedural Fairness Philosopher
  **The Objection:** "You're talking about fairness, but your 'local envy' condition locks in past injustices. If the agreement last year was coercive or happened under information asymmetry, using that feasible set as a baseline for 'fairness' this year just compounds the error. Why is looking backward procedurally fairer than looking at the current utopia point?"

  **Your 2-Minute Reply:**
  "Fairness isn't just about the end state; it's about legitimate expectations. Procedural fairness requires that agents can plan their lives. If we reset to the 'global utopia' every time, we violate the fairness of reliance.
  However, I agree with your premise. That's why my model includes a 'reset' condition: if the prior agreement fell below a subsistence threshold or violated basic rights, the endogenous $d$ is voided. But in standard commercial bargaining, fairness means honoring the trajectory of the partnership. A solution that ignores the past treats the agents as amnesiacs, which is procedurally disrespectful to their history as cooperators."

  **The Soft Spot:**
  You haven't defined the "reset condition" formally. If they ask for the axiom that defines "coercion," you have no answer. Pivot back to "standard commercial contexts" to dodge the edge cases.

  ---

  ### 3. The Nightmare Question (Pray nobody asks this)

  **The Question:**
  "If the disagreement point is endogenous to the previous round, and that previous round's disagreement point was endogenous to the one before it... what anchors the chain? If you unwind the recursion, doesn't your solution depend entirely on the initial conditions at $T=0$? If so, isn't your 'modification' just a complicated way of saying 'history matters,' without actually explaining *how* the bargaining power evolved?"

  **Why it kills you:**
  It exposes that you haven't actually solved the bargaining problem; you've just pushed it back in time. It suggests your model has no predictive power without knowing the entire history of the world.

  **The "Survival" Answer:**
  "That's the open question for the dynamic extension of this model. However, in practical contract law, the chain *does* have an anchor: the initial signing of the contract, which is governed by standard exogenous rules (like market rates or statutory defaults). My model isn't trying to explain the origin of the firm; it's trying to explain the *renegotiation margin*. For the scope of this paper, I take the initial contract as the exogenous anchor. The contribution is showing how KS behaves once that anchor becomes a moving target."

  *(Note: This admits the limitation but bounds the scope of your claim. Do not try to solve the infinite regress in the room.)*

  ---

  ### 4. Tactical Advice for the Room

  1.  **Against the Nash Guys:** Do not get dragged into proving NBS is "wrong." Argue it is "contextually limited." Use the phrase **"Descriptive Adequacy vs. Normative Purity."** They care about purity; you are arguing for adequacy in contractual settings.
  2.  **Against the Grad Student:** If they write a formula on the board, do not try to correct their math unless you are 100% sure. Instead, attack the **assumptions** behind the formula. "That holds if agents are ahistorical, but I'm assuming path-dependent preferences."
  3.  **Against the Philosopher:** Use their language. **"Legitimate Expectations," "Reliance," "Procedural Legitimacy."** Make them feel like you are on their side against the cold math of the economists.
  4.  **Body Language:** When the Grad Student attacks, lean forward and look interested. When the Nash Economists attack, lean back and look sympathetic but firm ("I see why you want that, but...").

  **Final Survival Rule:** If you don't know the answer, say: *"That's a constraint I haven't formalized yet, but intuitively it suggests..."* Never bluff a proof. You are in a Phil-of-Econ seminar; a good intuition with a confessed gap is better than a bad proof.
