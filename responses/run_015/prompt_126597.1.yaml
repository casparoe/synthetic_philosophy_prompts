answer: |-
  Graded transparency alone merely smooths the decision boundary; you cooperate when the probability-weighted payoff of matching exceeds the defect temptation. The luring mechanic, however, transforms this into a signaling game that risks destabilizing everything. The knot lies in incentive compatibility: a defector *also* wants you to cooperate while they defect. If the signal cost $c$ is low enough for a defector to mimic, raising $p$ becomes cheap talk, rendering high-$p$ interactions suspicious rather than reassuring.

  Consequently, genuine correlators face a dilemma: paying $c$ looks like manipulation, but not paying looks like disinterest. Cooperation survives only if $c$ creates a separating equilibrium—high enough that defectors won't pay it, yet low enough that correlators will. Instead of a smooth gradient, you get a credibility cliff. The luring option doesn't just adjust thresholds; it forces agents to prove they aren't exploiting the signal itself. Trust collapses unless the cost structure strictly penalizes mimics, turning the handshake into a costly barrier against betrayal.
