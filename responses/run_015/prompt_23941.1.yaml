      *   *Crucial Point:* The Allais paradox often involves *gains*. The Child problem involves *lives* (moral utility). If $u$ is bounded for lives but unbounded for money, maybe it works? No, the weighting applies to probabilities.
      *   *The Kicker:* If you use the *same* $w$ estimated from monetary Allais choices to predict moral choices, do you get the "monster" result? Empirical literature suggests probability weighting is domain-sensitive. If the user claims $w$ is a cognitive fixed feature, this is a fatal empirical prediction. If they claim $w$ varies by domain, they concede the "universal cognitive fix" argument.

  9.  **Refining the "Utility Stability" Argument:**
      *   User says: "Utility isn't a fixed property... I've been telling myself that's a feature."
      *   Counter: In RDU, $u(x)$ *is* fixed. The *weights* depend on rank. The user is conflating RDU with Context-Dependent Utility models.
      *   Correction: I need to point out that in RDU, $u(x)$ *is* supposed to be stable (outcome utility). The *decision weight* is what varies. If the user thinks $u(x)$ varies, they aren't doing RDU, they're doing something else. If they mean decision weights vary, that's the definition of RDU. The philosophical cost is that you can't measure "value of an outcome" without knowing the risk context. This makes welfare economics nearly impossible.

