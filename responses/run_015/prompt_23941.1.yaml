      *   **1. The Identification Problem (Unfalsifiability):** With two free functions, you can rationalize almost anything. Without independent measurement of $w$ (e.g., from choice under risk without utility curvature), the theory risks being a tautology.
      *   **2. The Domain Universality Problem:** If $w$ is universal, the Allais fit might break moral intuition (Child case). If $w$ is domain-specific, the theory loses predictive power (unfalsifiable).
