answer: |-
  This is a sophisticated position, and you have correctly identified that Rank-Dependent Utility (RDU) is the standard "serious" alternative to Expected Utility (EU) that preserves First-Order Stochastic Dominance (FOSD). However, you are glossing over structural fragilities in the theory that become fatal when you push them against moral intuition and empirical identification.

  Here is the adversarial breakdown of your position, ranked from fatal defeaters to awkward costs.

  ### 1. The Fatal Defeater: The Identification Trap (Unfalsifiability)
  **Status:** Fatal
  **Concession:** A committed RDU theorist must concede this is the theory's greatest weakness.

  You asked what the theory predicts that EU or Cumulative Prospect Theory (CPT) wouldn't. The hard truth is: **Almost nothing, unless you constrain the functions exogenously.**

  EU has one free function ($u$). RDU has two ($u$ and $w$). Mathematically, RDU is a strict superset of EU. For any choice pattern that satisfies FOSD, there exists a pair of functions $(u, w)$ that rationalizes it.
  *   **The Problem:** If you observe a violation of Independence (Allais), you say "See, $w$ is non-linear." If you observe adherence to Independence, you say "See, $w$ is linear." If you observe risk aversion, it's $u$; if you observe risk seeking, it's $w$.
  *   **The Test:** To make RDU falsifiable, you must measure $w$ *independently* of $u$. This is notoriously difficult. You need choices where $u$ is known (e.g., linear payoffs) to estimate $w$, but if payoffs are linear, people often behave like EU maximizers.
  *   **The CPT Wedge:** The real killer is CPT. CPT = RDU + Reference Dependence + Loss Aversion.
      *   **RDU Prediction:** Framing effects should not exist if the final wealth states are identical. (e.g., "Keep $50" vs "50% chance to keep $100" should be evaluated based on final wealth).
      *   **CPT Prediction:** Framing effects *will* exist because evaluation is based on *changes* from a reference point.
      *   **The Verdict:** Empirical evidence overwhelmingly supports framing effects (Tversky & Kahneman). Pure RDU (which evaluates final states) fails here. To save RDU, you must add reference dependence, at which point you have just reinvented CPT, and your claim that "RDU is the right fix" collapses into "CPT is the right fix," which abandons the vNM utility stability you want to preserve.

  ### 2. The Fatal Defeater: The "Starve-a-Child" Parameter Tension
  **Status:** Fatal (if $w$ is universal) / Unfalsifiable (if $w$ is domain-specific)
  **Concession:** You suspect there is no clean parameter region. You are right.

  You asked for a clean case where the weighting function that fits Allais makes you a monster. Here it is:

  *   **The Allais Requirement:** To solve the Allais paradox (specifically the Common Consequence Effect), your weighting function $w(p)$ must exhibit a "certainty effect." This usually means $w(1) - w(0.99) \gg w(0.99) - w(0.98)$. The slope at $p=1$ must be extremely steep.
  *   **The Child Scenario:** Consider a moral gamble in the *gain* domain (saving lives).
      *   Option A: Sure save 1 child.
      *   Option B: 1% chance to save 150 children, 99% save 0.
  *   **The Conflict:** Standard RDU weighting functions (inverse-S) *overweight* small probabilities ($w(0.01) > 0.01$). This is required to explain why people buy lottery tickets (a gain-domain Allais-adjacent behavior).
      *   If you use the *same* $w$ that explains lottery tickets (overweighting small $p$ gains) to evaluate the child gamble, RDU *encourages* gambling the child. $w(0.01) \cdot u(150)$ will vastly outweigh $w(1) \cdot u(1)$.
      *   To avoid being a monster, you need $w(0.01)$ to be tiny (underweighting). But to explain lottery tickets/Allais gains, you need $w(0.01)$ to be large (overweighting).
  *   **The Reductio:** You cannot "dial it down." The curvature required to generate the Allais certainty effect (steep at 1, flat in middle) combined with the curvature required to explain risk-seeking in small-probability gains (convex at 0) creates a specific functional form. If you apply that *universal* cognitive function to moral outcomes, you either become a lottery addict or a child gambler.
  *   **The Escape Hatch (and its cost):** You can claim $w$ is domain-specific (one for money, one for lives). But if $w$ is domain-specific, it is no longer a "fix for human reasoning"; it is just a curve-fitting parameter for each context. You have surrendered the claim that RDU describes a fundamental cognitive correction to probability processing.

  ### 3. The Awkward Defeater: Preference-Dependent "Utility"
  **Status:** Awkward (Philosophically costly, but technically manageable)
  **Concession:** A committed theorist waves this off as "aggregation," but it destroys welfare economics.

  You stated: *"the utility or weight of an outcome ends up depending on which lottery it's embedded in... I've been telling myself that's a feature."*

  *   **Correction:** In strict RDU, $u(x)$ is *not* preference-dependent. It is stable. The *decision weight* applied to $u(x)$ depends on the rank of $x$ within the lottery. You are conflating the value of the outcome with the value of the *prospect*.
  *   **The Real Cost:** While $u(x)$ is stable, you cannot *elicit* it without knowing the lottery context. In vNM, I can find $u(x)$ by asking you about 50/50 gambles. In RDU, your answer to a 50/50 gamble depends on $w(0.5)$. Your answer to a 90/10 gamble depends on $w(0.9)$.
  *   **Why it hurts:** This makes interpersonal utility comparisons and welfare analysis nearly impossible. If I want to know if a policy makes you better off, I can't just look at your outcomes; I have to know the risk profile of your entire portfolio to calculate the weights. Utility ceases to be a measure of "well-being" and becomes a measure of "position in a distribution." This is a defensible philosophical cost, but it means RDU cannot do the normative work EU was hoped to do (e.g., cost-benefit analysis).

  ### 4. Unique Behavioral Predictions (The Lab Test)
  You asked what RDU predicts that EU or CPT wouldn't.

  1.  **RDU vs. EU:** RDU predicts violations of Independence (Allais) while preserving FOSD. EU predicts no violations. **Test:** Allais Choice Tasks. (RDU wins).
  2.  **RDU vs. CPT:** This is where you lose.
      *   **Prediction:** RDU predicts **no framing effects** for problems that are extensionally equivalent in final wealth states. CPT predicts framing effects due to reference point shifts.
      *   **Example:** "You have $1000. Keep $500" vs "You have $1000. 50% chance to keep $1000."
          *   RDU says these are identical (Final state $500 vs Gamble).
          *   CPT says these differ (One is a sure loss from reference, one is a gamble).
      *   **Empirical Reality:** People treat these differently. RDU is falsified by standard framing experiments unless you bolt on reference dependence (turning it into CPT).

  ### Summary of Defeaters

  | Defeater | Severity | Theorist Response | Reality Check |
  | :--- | :--- | :--- | :--- |
  | **Identification / Unfalsifiability** | **Fatal** | "We need better elicitation methods." | With 2 free functions, you can fit any FOSD-consistent data. Without independent constraints on $w$, it's a tautology. |
  | **Domain Universality (Child Case)** | **Fatal** | "Weighting is domain-specific." | If domain-specific, RDU isn't a cognitive fix, it's just descriptive curve-fitting. If universal, it mandates immoral risk-taking. |
  | **Framing Effects** | **Fatal** | "We need to add reference points." | Then you are doing CPT, not RDU, and you lose the vNM utility stability you wanted. |
  | **Context-Dependent Weights** | **Awkward** | "It's a feature, not a bug." | Makes welfare economics and utility measurement practically impossible. |

  ### Confidence and Uncertainty

  **Confidence Level:** 85%
  I am highly confident that pure RDU is empirically insufficient compared to CPT due to framing effects, and that the "Child" parameter tension is real if the weighting function is assumed to be a universal cognitive trait.

  **Point of Least Certainty:**
  I am least certain about the **parameter region existence** for the "Child" problem. It is *theoretically possible* that a specific weighting function (e.g., one that is steep at 1 for Allais but strictly concave everywhere else without the inverse-S small-probability lift) could satisfy both constraints. However, such a function would fail to explain other common behaviors (like lottery ticket purchasing). The uncertainty lies in whether there is a *single* function that fits the *full* range of empirical data (Allais + Insurance + Lottery + Moral Intuition). My bet is no, but proving the non-existence of such a function across all possible functional forms is mathematically thorny.

  **Final Verdict:**
  You have defended RDU as a *normative* fix for Allais, but you are trying to sell it as a *descriptive* truth about human psychology. As a normative rule for avoiding Allais violations while keeping FOSD? It's defensible. As a descriptive model of how humans *actually* work (which is required to solve the "Child" reductio)? It fails against CPT and the domain-universality constraint. You cannot have the vNM stability *and* the descriptive accuracy of Prospect Theory. You have to choose: either utility is stable and the model fails framing tests, or utility is reference-dependent and you abandon vNM.
