  You've struck on the crucial distinction between the genesis of a convention and its maintenance. Salience—what Schelling called a focal point—is indeed the spark, not the fuel. In your North and South villages, the worn path provided an initial reason to choose one side over the other without speaking. It made one equilibrium stand out against the background of alternatives. But once everyone went left on day one, the physical wear ceased to be the primary reason. Now, the reason is precedent. I expect you to keep left because I know you know I kept left yesterday, and you expect the same of me. The physical cue vanished when the council bulldozed the ground, but the common knowledge of conformity remained. So salience did real work, but only to solve the very first coordination problem. After that, the convention sustains itself through expectations.

  The third village is the control group. They lack that initial focal point, so they remain in a suboptimal equilibrium—head-on collisions—because no one can risk deviating without assurance others will too. As for falsifying my account: if you found a community where everyone kept left, but none expected anyone else to, or where they kept left because it was physically impossible to go right, I'd be wrong. A convention must be arbitrary; there must be another viable option. And regarding your warning about the first path: you're right to block the regress. The initial salience isn't another convention; it's a matter of perceptual prominence. Perhaps a large stone blocked the right side in North, and a ditch blocked the left in South. That's not a rule; it's just a fact that makes one choice scream "pick me" louder than the other.
