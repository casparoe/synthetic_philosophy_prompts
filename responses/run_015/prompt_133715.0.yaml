      *   *Conceptual Nuance:* Need to distinguish between *capacity* for suffering and *actual* suffering. A continuous framework might weigh the *potential* depth of experience higher than the sheer volume of shallow experience to avoid the tyranny of the multitude. Or, it might embrace the swarm logic.
