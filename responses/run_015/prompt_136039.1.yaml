      *   Actually, Case 3 (Grant Funder) might be the one that passes *if* framed as "clarifications" but the prompt says "updates evaluation criteria during the review cycle." That sounds like moving goalposts. That should fail.
      *   Case 1 (IRB) is the strongest candidate for "Smells wrong but passes." Why? Because governance bodies *must* be able to update their bylaws to function, provided they don't violate higher law. It feels self-referential, but it's necessary recursion.
