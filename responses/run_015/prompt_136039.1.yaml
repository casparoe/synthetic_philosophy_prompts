      *Refining Case 1:* To make it "smell wrong" but pass, the checklist needs to show it has a ground level (Federal Law) that prevents total collapse.
      *Refining Case 3:* Moving goalposts mid-cycle is a failure of termination conditions.

  5.  **Drafting the Content (Iterative refinement for tone and constraints):**
      *   *Tone:* Direct, audit-style, American English. No fluff.
      *   *Structure:* Checklist first, then Application.
