      *   **Output per Step:** What counts as a Pass, where to Hard-Stop (Reject), where to Hand to Human (Values/Logic boundary).
      *   **Application:** Run the checklist on three cases:
          1.  IRB that can amend its own charter by vote.
          2.  AI governance board whose members are selected by the model being governed.
          3.  Grant funder that updates its evaluation criteria during the review cycle.
      *   **Constraint:** One case should pass even though it "smells wrong" (identify which one).
      *   **Tone/Style:** Definite about where the line is, American English, not too polished (direct, practical).

  2.  **Deconstruct the Theoretical Framework:**
      *   *Tangled Hierarchies/Inviolate Levels:* This comes from Douglas Hofstadter's *Gödel, Escher, Bach*. The core idea is that systems need distinct levels (meta-levels vs. object-levels). When a system tries to modify its own rules from within the same level without a higher authority or fixed foundation, it creates a paradox or a collapse (like a snake eating its tail).
      *   *Recursion vs. Collapse:* Recursion is okay if it bottoms out (has a base case). Collapse happens when the rule-maker and the rule-subject are identical without constraint.
      *   *Audit Context:* We need to ensure oversight isn't illusory.

  3.  **Drafting the Checklist:**
      *   *Step 1: Ground Level.* Is there a fixed constitution or external law that cannot be changed by the loop?
          *   Pass: Yes, there's a fixed foundation (e.g., Federal Law, University Charter).
          *   Reject: No foundation, everything is fluid.
          *   Human Handoff: The foundation is ambiguous (e.g., "ethical norms" vs. written law).
      *   *Step 2: Termination Conditions.* Does the loop end? Can changes be made indefinitely during a process?
          *   Pass: Changes lock out after a point.
          *   Reject: Rules can change mid-game to affect the current outcome.
          *   Human Handoff: Determining if a change is "procedural" vs. "substantive."
      *   *Step 3: Circular Dependency in Authority.* Who appoints whom?
