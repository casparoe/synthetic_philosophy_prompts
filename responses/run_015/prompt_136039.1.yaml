      *   Step 3 (Authority): Needs to distinguish between "stakeholder input" vs "subject control."

      *Let's sharpen the "Human Handoff" criteria.* This is where logic ends and ethics/policy begins. For example, if the ground level is "University Mission," that's vague. A human needs to decide if that's solid enough.

      *Let's sharpen the "Hard Stop."* If the subject appoints the auditor, that's a hard stop. If rules change mid-evaluation, that's a hard stop.

      *Let's sharpen the "Pass."* If there's an external lock (law) and the loop is only for operational tweaks, it passes.

      *Re-evaluating the "One Okay" case:*
