answer: |-
  # Audit Checklist: Recursive Oversight vs. Collapsed Hierarchies

  **Purpose:** To distinguish between valid administrative recursion (a system updating itself within bounds) and collapsed levels (a system eating its own tail, rendering oversight null). Based on Hofstadter's concept of inviolate levels: there must be a "meta-level" that cannot be touched by the "object-level."

  **Instructions:** Run steps in order. If a step results in a **Hard Stop**, reject the proposal. Do not proceed to the next step. If **Hand to Human**, escalate to senior board review for ethical/policy judgment. If **Pass**, proceed to next step.

  ---

  ### Step 1: Check for a Ground Level
  **Question:** Is there a fixed constitution, law, or charter external to the committee that limits what rules can be changed?
  *   **Pass:** Yes. There is a higher authority (e.g., Federal Law, University Board of Trustees) that the committee cannot override. The loop operates *within* this cage.
  *   **Hard Stop (Reject):** No. The committee claims total sovereignty to redefine its own purpose, scope, or legal constraints without external approval. The hierarchy has no top.
  *   **Hand to Human:** The "ground" is ambiguous (e.g., "ethical norms" or "best practices" rather than written law). A human must decide if that ground is solid enough to prevent collapse.

  ### Step 2: Check for Termination Conditions
  **Question:** Can the rules change while a specific decision is currently being processed?
  *   **Pass:** Yes. Rule changes apply prospectively (to future cases) or require a lock-out period during active review. The recursion bottoms out before affecting the current object.
  *   **Hard Stop (Reject):** No. The committee can update evaluation criteria, scoring weights, or eligibility rules *during* the review cycle for the current applicants. This is moving the goalposts mid-game.
  *   **Hand to Human:** The change is framed as a "clarification" rather than a "rule update." A human must decide if the clarification substantively alters the ground rules for current participants.

  ### Step 3: Check for Circular Dependency in Authority
  **Question:** Who appoints the overseers?
  *   **Pass:** Authority flows downward or laterally. The overseers are appointed by a higher authority or a separate body unrelated to the subject being reviewed.
  *   **Hard Stop (Reject):** The subject being governed selects, trains, or appoints the oversight board. The object level controls the meta level.
  *   **Hand to Human:** Mixed appointment (e.g., stakeholders recommend, but an external admin appoints). A human must weigh if the stakeholder influence is strong enough to compromise independence.

  ---

  # Application to Cases

  ### Case 1: IRB that can amend its own charter by vote
  *   **Step 1 (Ground Level):** **Pass.** The IRB operates under Federal Regulations (45 CFR 46). They can amend their *operational* charter (SOPs), but they cannot vote to violate federal human subjects protections. The Federal Government is the inviolate level above them.
  *   **Step 2 (Termination):** **Pass.** Charter amendments typically require a quorum vote at a scheduled meeting and apply to future protocols. They cannot change the charter mid-review of a specific pending proposal to force an approval.
  *   **Step 3 (Authority):** **Pass.** IRB members are appointed by the University Institutional Official, not by the researchers submitting proposals.
  *   **Result:** **APPROVED.**
  *   **Note:** This smells wrong because it looks like self-regulation. However, the hierarchy isn't collapsed because Federal Law sits above the IRB. It is valid recursion, not a paradox.

  ### Case 2: AI governance board whose members are selected by the model being governed
  *   **Step 1 (Ground Level):** **Hand to Human.** (Let's assume there is a company policy grounding it). Proceed to Step 3 for the fatal flaw.
  *   **Step 2 (Termination):** **Pass.** (Assuming selection happens at set intervals).
  *   **Step 3 (Authority):** **Hard Stop (Reject).** The model (the subject) selects the board (the auditor). This is a classic tangled hierarchy. The object level has swallowed the meta level. The board cannot objectively govern the system that chooses its members.
  *   **Result:** **REJECTED.**

  ### Case 3: Grant funder that updates its evaluation criteria during the review cycle
  *   **Step 1 (Ground Level):** **Pass.** (Assuming they are a legal entity).
  *   **Step 2 (Termination):** **Hard Stop (Reject).** Updating criteria *during* the review cycle means there is no fixed state for the applicants to be measured against. The rule-set is fluid while the game is being played. This collapses the distinction between the evaluator and the arbitrary whims of the moment.
  *   **Result:** **REJECTED.**

  ---

  # Summary Finding

  **The Case that Passes but Smells Wrong:** **Case 1 (The IRB).**

  **Why:** It triggers the "self-referential" alarm because the committee writes its own rules. In a vacuum, this is a collapsed hierarchy. However, the checklist identifies the **Ground Level** (Federal Law) as the inviolate layer that prevents total collapse. The recursion is contained. It feels uncomfortable because it relies on the committee's willingness to stay in its lane, but logically, the levels remain distinct.

  **The Line:** The line is drawn at **external constraint**. If the loop can break its own container, it's a collapse. If the loop spins inside a fixed container, it's governance. Case 2 and Case 3 break the container (Authority and Termination, respectively). Case 1 stays inside it.
