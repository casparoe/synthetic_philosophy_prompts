answer: |-
  A theory of translation under formal constraint must begin by admitting that the poem you describe is not merely content wrapped in form; the form is the content. The acrostic spelling HELENA is not decoration; it is the name of the dead sister. The feminine rhymes are not musical garnish; they are the lullaby's rocking motion. When the narrator forgets a line, the damage is not semantic but structural. Therefore, any viable spec for translating such a text must prioritise the integrity of the constraint system over the fidelity of individual lexical items. The unit of translation is not the word, nor the line, nor even the stanza. It is the constraint set itself. If the target text does not operate under a comparable system of rules, it is not a translation of the poem; it is a summary of it.

  To be worth anything, this theory must deliver a framework that distinguishes between decorative constraints and structural semantics. A decorative constraint, such as a standard rhyme scheme in a light verse, might be sacrificed for semantic clarity. A structural constraint, such as your acrostic or the specific degradation of the refrain, cannot be. The case this theory must get right is the 'vanishing object'. In your novel, the poem's disintegration mirrors the narrator's memory loss. If the German version is free verse from the outset, there is no structure to vanish. The reader cannot feel the absence of a rhyme scheme that never existed. Therefore, the first non-negotiable desideratum is perceptibility: the formal feature must be perceptible to the monolingual target reader without external annotation. If the reader requires a footnote to understand that something is missing, the translation has failed to transmit the experience of loss. It has explained the tragedy rather than enacting it.

  This leads to the question of the footnote. In general translation theory, footnotes are often seen as tools of honesty. In constrained literary translation, however, they are often admissions of defeat. A footnote that says 'the original rhymed' is a placeholder for an effect that did not survive the crossing. For your novel, a footnote is a non-starter because it breaks the immersion required for the memory loss to hurt. It shifts the burden from the text to the paratext. Thus, a translation that needs a footnote to justify its form has failed the requirement of functional identity. The German lullaby must be your lullaby, not a new poem after yours, nor an imitation. It must occupy the same narrative slot and perform the same emotional work. If the original poem is a lock, the translation must be a key that turns, not a picture of a key taped to the door.

  We must also respect the distinction between the monolingual and bilingual reader. The translation owes its primary allegiance to the monolingual German reader, for whom this is the only version there is. To privilege the bilingual reader—who can check the original—is to treat the translation as a crib rather than a work of art. However, this does not mean the translator is free to invent. It means the translator must find resources within the target language that match the source language's constraints. You note that German lacks the feminine endings of French or English. This is a resource constraint. The theory must acknowledge that exact replication is sometimes impossible. Here, compensation is not the same achievement as preservation. Preserving the acrostic HELENA is preservation; adding alliteration on 'H' is compensation. They are different achievements. Compensation is acceptable only when preservation is linguistically impossible, and only if the compensatory device carries equivalent semantic weight. Alliteration is sonic; an acrostic is visual and semantic. Swapping one for the changes the nature of the clue.

  Regarding the singability requested by the audiobook publisher, this is a preference, not a non-negotiable, unless the text explicitly states the character sings it. However, since it is a lullaby, rhythm is part of the constraint set. A prose version, as muttered by the Italian publisher, is unacceptable because prose cannot be forgotten in the same way verse can. Prose lacks the expected regularity that makes irregularity noticeable.

  Here we arrive at the trilemma that governs all constrained translation. You cannot jointly satisfy three requirements: preserve every formal feature, preserve every semantic feature, and produce a poem that works naturally in the target tradition. You must sacrifice one. Popular theories often pretend otherwise. Literalism sacrifices naturalness; dynamic equivalence sacrifices form; imitation sacrifices semantic fidelity. The single requirement that does the most damage to popular theories is the demand for unannotated perceptibility. Functionalists and skopos theorists argue that the purpose of the text dictates the method. If the purpose is 'readability', they drop the form. But if the purpose is 'to experience the loss of form', then readability must suffer. The theory must mandate that the reader struggles slightly with the form so they can feel its absence later.

  To score the usual stances against this spec: Literalism fails because it cannot accommodate the constraint set, often breaking the target language to fit the source shape. Dynamic equivalence fails because it prioritises the 'message' over the 'medium', turning your acrostic into a footnote. The fluent-invisible-translator position is disastrous here; invisibility hides the very constraints that make the poem visible. Imitation is closer, but risks becoming a new poem entirely, severing the link to the original narrative architecture. Thick translation with notes is the translator's current proposal; it fails the perceptibility test. Functionalism is the most dangerous, as it allows the publisher to argue that the 'function' of the novel is entertainment, and constrained poems hinder entertainment.

  The only stance that survives is a modified formalism that treats the constraint as semantic data. This requires the translator to accept that some meaning must be lost to save the structure. If the German language cannot support feminine rhymes in this meter, the rhyme scheme might need to shift, but the regularity must remain. The acrostic must remain. The degradation must remain. If the translator cannot find a German word for the final line that rhymes and fits the meter, they must leave a gap, not fill it with prose. The dash must be a dash, not a explained omission.

  In your argument with the publisher, you must insist that the poem is not an insert; it is a load-bearing wall. If you remove the shape, the memory loss theme collapses into simple forgetting. The reader must see the grid to see the holes in the grid. A theory of translation that cannot account for the structural transmission of absence is useless for your novel. You are not asking for a perfect copy; you are asking for a functional equivalent of the damage. The German text must break in the same places as the English text, and it must break because the form demands it, not because the translator chose free verse. Demand that the constraint set is the unit of translation. Demand that the monolingual reader feels the loss without a footnote. Accept that the German poem will be different, but insist that it must be broken in the same way. That is the only fidelity that matters.
