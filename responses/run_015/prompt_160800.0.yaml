prompt: |-
  hi — i'm a 3rd year phd student in corpus pragmatics and ive somehow become the person who breaks every tie on our lab's annotation project. The data is ~12k comments scraped from a hobbyist forum; we label each one for (a) does it contain a personal attack and (b) is it on-topic for the thread. Two undergrad RAs label independently and i adjudicate. Volume is brutal: 60–90 seconds per disputed item, ~40 a week. The RAs are sharp but have no theory background at all, so whatever i hand them has to fit in two pages and be runnable by someone who has never thought about anything. Stakes: the corpus gets released publicly, two of my chapters and someone else's paper hang off it, and a reviewer will definately ask why item 4021 is yes and 4022 is no — so i need a decision log, not vibes.

  I fell into a rabbit hole reading about the sorites paradox (the heap thing: taking away one grain never turns a heap into a non-heap, iterate that, and there are no heaps) and it feels like exactly the right diagnosis of what keeps breaking in our manual. What i can't do is turn it into something my RAs can actually run. So: give me the procedure.

  Things i think the procedure has to contain — push back if any of this is the wrong shape:

  - a step that happens before any threshold is set, fixing what the label is *for* (the downstream use) and the comparison class. I've noticed our boundary slides depending on whether we're training a classifier vs. informing a moderation policy, and that feels like it should be a feature rather than a bug, but I don't know how to write it down so it survives contact with an undergrad.
  - a rule about which items are allowed to serve as anchors. My suspicion is that items sitting right next to the grey zone look like clear cases but are terrible anchors, and that's been quietly poisoning our calibration. If that's right, say what qualifies as a real anchor instead.
  - a rule about how *not* to reason. The thing my RAs do constantly is: if 4021 is an attack then 4022 has to be too, they're basically the same. That looks like exactly the tolerance move that generates the paradox, so the manual needs to forbid it in a way they'll accept. And then I need to know what to do when following the rule produces a verdict that feels wrong for precisely that reason — is that a bug to fix or a cost to just eat?
  - the grey zone itself: when to declare an item penumbral instead of forcing yes/no, what to do with penumbral items at release time, and how wide we should *expect* the zone to be. If 35% of my data comes out penumbral I want to know whether that's normal or evidence my manual is broken.
  - the regress problem. Any rule i write for the grey zone seems to grow its own grey zone. I need a rule that stops: at this point you pick, deterministically, you write down what you picked, you move on. And I need to know which of those stopping points are matters of fact and which are genuinely value calls I have to own — and whether the PI signs off on those or I do.
  - a test for telling RA *error* apart from genuine borderline-ness when they disagree. We currently treat every disagreement identically and I'm fairly sure that's wrong.

  Separately: several items are vague on more than one dimension at once (affectionate mockery, an insult aimed at a third party, a slur used as in-group reclamation). I don't know whether to threshold on a composite severity score or decompose into sub-features first. If you have an opinion, argue it, and say what the decomposition costs.

  Then run it on three items, and please include at least one where the procedure gives me an answer I won't like:

  1. A pair that differs in exactly one small respect, where the RAs split and the if-one-then-the-other pressure is strongest. Concretely: A is *that wiring is a crime*; B is *that wiring is a crime, did you learn to solder from a youtube short*. Thread is someone posting a photo of a badly soldered pedalboard.
  2. An item everyone agrees is a clear attack but which sits one step from the grey zone — is it allowed to be an anchor?
  3. An item where the two ends of the severity chain disagree about where the grey zone starts: climbing up from banter it reads as friendly, coming down from an unambiguous slur it reads as an attack. (Ours is a reclaimed slur between two users who banter constantly.)

  Finally, be straight about what this procedure can't do — in particular whether my existing 12k labels are salvageable or contaminated, since that decides whether i have to redo the whole thing before i can write chapter 3.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the User and Problem:**
      *   **User:** 3rd-year PhD student in Corpus Pragmatics.
      *   **Context:** Annotation project (12k comments, hobbyist forum). Labels: (a) Personal Attack, (b) On-Topic.
      *   **Workflow:** 2 Undergrad RAs (independent) -> PhD Student (adjudication).
      *   **Pain Point:** High volume of disputes (~40/week, 60-90s each). The "Sorites Paradox" (vagueness/boundary problems) is causing inconsistency. RAs lack theory background.
      *   **Stakes:** Public corpus, 2 PhD chapters, 1 co-author paper, reviewer scrutiny (need decision log, not vibes).
      *   **Specific Needs:** A runnable procedure (max 2 pages for RAs) that addresses:
          *   Pre-thresholding (purpose/comparison class).
          *   Anchor selection (avoiding near-boundary items).
          *   Forbidden reasoning (tolerance principle/neighbor logic).
          *   Grey zone management (penumbra, release strategy, expected %).
          *   Regress stopping rule (deterministic pick, ownership of value calls).
          *   Error vs. Borderline discrimination.
          *   Multidimensional vagueness (composite score vs. decomposition).
      *   **Deliverables:** The Procedure, Application to 3 specific test cases, Honest assessment of existing data (salvageable vs. contaminated).

  2.  **Deconstruct the Sorites Problem in Annotation:**
      *   The core issue is *tolerance*: If $x$ is $F$, and $y$ is very similar to $x$, then $y$ is $F$. Iterating this collapses the category.
      *   In annotation, this manifests as "If 4021 is an attack, 4022 must be too."
      *   *Solution:* We need to break the chain. We need *paradigm cases* (anchors) that are stable, not relative comparisons. We need to acknowledge that boundaries are *stipulative*, not discovered.

  3.  **Drafting the Procedure (The "Two-Page Manual"):**
      *   *Constraint:* Must be runnable by undergrads with no theory background.
      *   *Tone:* Directive, clear, operational.
      *   *Section 1: Purpose (The "Why").* Fix the comparison class. Is this for training a bot (needs precision) or policy (needs recall)? Let's assume the user needs to define this. I'll create a placeholder for "Project Goal."
      *   *Section 2: Anchors.* Define "Golden Set." Explicitly ban near-boundary items as anchors. Anchors must be *obvious* to everyone, not just the adjudicator.
      *   *Section 3: Forbidden Reasoning.* Explicitly ban "Neighbor Logic." Label $X$ on its own merits against the Anchor, not against $X-1$.
      *   *Section 4: The Grey Zone (Penumbras).* Define a "Uncertain" label? Or force a choice with a flag? For corpus pragmatics, usually, we need binary for stats, but flagging is good for transparency. Let's suggest a "Forced Choice + Confidence Score" approach. If confidence is low, it goes to adjudication.
      *   *Section 5: Stopping the Regress.* The "Adjudicator's Veto." At some point, the PhD student makes a stipulative call. This is a value judgment, not a fact.
      *   *Section 6: Error vs. Borderline.* Use inter-rater reliability (Kappa) on the *anchors*. If they miss anchors, it's training error. If they miss borderline, it's expected variance.
      *   *Section 7: Multidimensionality.* Decompose. "Attack" is too vague. Break into "Target," "Intent," "Severity." Composite scores hide nuance.

  4.  **Refining the Specific Requirements:**
      *   *Pre-thresholding:* Call it "Teleological Fixing." Define the *use case* first.
      *   *Anchors:* Must be "Remote from Boundary."
      *   *Forbidden Reasoning:* "No Chaining."
      *   *Grey Zone:* Expect 10-15%. If 35%, manual is broken. Release strategy: Keep the label, flag the confidence.
      *   *Regress:* The "Stipulation Point." PI owns the policy, PhD owns the interpretation.
      *   *Error vs. Borderline:* Check against Anchors.

  5.  **Developing the Test Cases:**
      *   *Case 1 (The Neighbor Pair):* "Wiring is a crime" vs. "Wiring is a crime... YouTube short."
          *   *Analysis:* The second adds specific mockery of competence.
          *   *Procedure Application:* Don't compare them. Compare each to the Anchor (e.g., "You are an idiot").
          *   *Unliked Answer:* They might get *different* labels. A is hyperbolic critique (No Attack), B is ad hominem competence attack (Attack). This breaks the "tolerance" intuition but saves the category.
      *   *Case 2 (The Near-Anchor):* Clear attack, but close to grey.
          *   *Analysis:* Can it be an anchor?
          *   *Procedure:* No. Anchors must be *remote*. If it's close to grey, it's unstable.
      *   *Case 3 (The Reclaimed Slur/Banter):* Up vs. Down reading.
          *   *Analysis:* Context dependency.
          *   *Procedure:* Requires "Relationship Context" feature.
          *   *Unliked Answer:* You cannot label this without external thread history. If history isn't annotated, you must default to "Attack" for safety (policy goal) or "Uncertain" (research goal). Let's say: Default to "Attack" unless specific "In-Group" marker is present. This feels restrictive but necessary for consistency.

  6.  **Addressing the "Contaminated Data" Question:**
      *   *Honesty:* If the Sorites problem was active, the boundary is noisy.
      *   *Salvage:* You can't fix the *boundary* items retroactively without re-reading. But you can filter.
      *   *Advice:* Don't redo all 12k. Sample the disputes. If the noise is random, stats hold. If systematic, you have a validity threat. Chapter 3 needs a "Limitations" section acknowledging the boundary stipulation.

  7.  **Structuring the Response:**
      *   **Introduction:** Validate the Sorites insight (it's correct).
      *   **Part 1: The Procedure (The "Two-Page Manual"):** Structured exactly as requested, translated into RA-speak.
      *   **Part 2: Multidimensionality:** Argue for decomposition.
      *   **Part 3: Test Cases:** Run the procedure on the 3 scenarios.
      *   **Part 4: The Hard Truth (Data Salvage):** Address the 12k labels.

  8.  **Self-Correction/Refinement during drafting:**
      *   *Critique:* Is "Penumbral" too theoretical for undergrads?
      *   *Fix:* Call it "Low Confidence / Needs Review."
      *   *Critique:* How to handle the "Value Call"?
      *   *Fix:* Distinguish between "Coding Rule" (RA follows) and "Policy Stipulation" (PhD/PI decides).
      *   *Critique:* The user asked for a decision log.
      *   *Fix:* Include a specific column in the spreadsheet for "Stipulation Reason."
      *   *Critique:* Multidimensionality.
      *   *Fix:* Strongly argue for decomposition. "Attack" is a latent variable. Measure the indicators.

  9.  **Final Polish:** Ensure tone is empathetic to the PhD struggle (imposter syndrome/overwhelm) but rigorous enough for a dissertation. (The user is sharp, don't dumb it down too much, but keep the RA instructions simple).

  *(Self-Correction on Case 1)*: The prompt asks for an answer I *won't like*. The intuitive linguistic answer is "both are banter" or "both are attacks." The procedure might force a split. I need to make sure the procedure forces a split based on the *definition* of attack (targeting person vs. targeting object).
  *   A: "Wiring is a crime" -> Targets the *work*.
  *   B: "...learned from YouTube" -> Targets the *skill/education* of the person.
  *   If the manual defines Attack as "Targeting the Agent," A is No, B is Yes. This feels pedantic but is theoretically defensible.

  *(Self-Correction on Data Salvage)*: Be careful not to say "it's fine." It's not fine. But it's manageable. Distinguish between *construct validity* (is it an attack?) and *reliability* (do we agree?). Sorites hurts reliability mostly.

  10. **Final Review against constraints:**
      *   Pre-threshold step? Yes.
      *   Anchor rule? Yes.
      *   Forbidden reasoning? Yes.
      *   Grey zone management? Yes.
      *   Regress stopping? Yes.
      *   Error vs. Borderline? Yes.
      *   Multidimensionality? Yes.
      *   3 Test Cases? Yes.
      *   Data Salvage verdict? Yes.

