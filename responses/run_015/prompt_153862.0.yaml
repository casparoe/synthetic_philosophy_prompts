answer: |-
  You have identified a genuine and historically significant ambiguity in the literature. The "slide" you perceive is not merely a popular misunderstanding; it marks the fault line between **Brouwer's original mathematical intuitionism** and the later **semantic anti-realism** generalized by philosophers like Michael Dummett.

  To answer your core question directly: **Standard intuitionism restricts the rejection of the Law of Excluded Middle (LEM) to mathematical domains.** An intuitionist is not logically compelled to suspend judgment on empirical propositions like the existence of microbial life on an exoplanet, provided they maintain a realist stance toward the physical world.

  However, if one adopts the *broader epistemic principle* you mentioned (often called verificationism or anti-realism), then yes, the rejection of LEM would extend to empirical claims.

  Here is the precise breakdown of the distinction, the ontological boundary, and how you should frame it in your piece.

  ### 1. The Narrow Scope: Brouwerian Intuitionism
  L.E.J. Brouwer, the founder of intuitionism, grounded his logic in a specific ontology of **mathematical objects**.

  *   **The Ontological Distinction:** For Brouwer, mathematical objects are mental constructions. They do not exist independently of the mathematician's mind. A mathematical statement is true only when a proof has been constructed; it is false only when a contradiction has been derived.
  *   **Why LEM Fails Here:** In the domain of the infinite (e.g., the set of all natural numbers), we cannot survey all elements. Therefore, for a proposition like Goldbach's Conjecture ($\forall n, P(n)$), there is currently no mental construction that proves it, nor one that refutes it. To say "Either it is true or it is false" implies that the truth value exists *independently* of our ability to construct it. Brouwer rejected this "metaphysical" assumption. For the intuitionist, the truth value is not merely *unknown*; it is **undefined** until the construction is performed.
  *   **The Empirical Exception:** Brouwer did not apply this ontology to the physical world. He generally accepted that physical objects exist independently of the mind. Therefore, the proposition "There is life on Exoplanet X" refers to a mind-independent state of affairs. Even if we cannot verify it *now*, the state of affairs is fixed. The barrier is contingent (distance, technology), not constitutive. Thus, classical logic (including LEM) remains valid for empirical singular statements.

  **Summary for your piece:** If you are discussing *mathematical intuitionism*, the rejection of LEM is **domain-specific**. It relies on the premise that mathematical truth is *created* by proof, whereas physical truth is *discovered* by observation.

  ### 2. The Broad Scope: Dummettian Anti-Realism
  The characterization you encountered—that one "ought not assert what one cannot verify"—is a generalization of intuitionism into a theory of **meaning**, most famously championed by Michael Dummett in the 1970s and 80s.

  *   **The Shift:** Dummett argued that the intuitionistic critique wasn't just about numbers; it was about *language*. He proposed that the meaning of a statement is determined by the conditions under which we can verify it (a verificationist theory of meaning).
  *   **The Consequence:** If meaning is tied to verification, then any statement for which verification is *transcendent* (beyond our capacity to decide) lacks a determinate truth value.
  *   **Impact on Empirical Claims:** Under this **Semantic Anti-Realism**, your exoplanet example *does* trigger the suspension of LEM. If we can never, even in principle, access the exoplanet to verify the claim, an anti-realist would argue the statement is neither true nor false. This view also applies to statements about the past (e.g., "Caesar had eggs for breakfast") if no evidence remains to verify them.

  **Summary for your piece:** If you are discussing *anti-realist philosophy of language*, the rejection of LEM is **universal**. It applies to any domain where truth outstrips our capacity to know it.

  ### 3. The Ontological Boundary: Construction vs. Correspondence
  To avoid misrepresentation, you must clarify which "intuitionism" you are discussing. The boundary is drawn based on the **nature of truth**:

  1.  **Mathematical Intuitionism (Brouwer):**
      *   **Truth Maker:** Mental construction/proof.
      *   **Scope:** Abstract, infinite totalities.
      *   **Status of Unproven Conjectures:** No truth value exists yet.
      *   **Status of Empirical Facts:** Truth values exist independently (Realism).

  2.  **Semantic Anti-Realism (Dummett):**
      *   **Truth Maker:** Verifiability/Evidence.
      *   **Scope:** All discourse (Math, Science, History).
      *   **Status of Unverifiable Claims:** No truth value exists (even if the fact is physically fixed).
      *   **Status of Empirical Facts:** Truth is epistemic access, not correspondence.

  ### 4. Recommendation for Your Piece
  The popular framing often conflates these two. To be precise, you should structure your clarification as follows:

  *   **Acknowledge the Conflation:** State clearly that "intuitionism" is often used as a catch-all for verificationist skepticism, but technically refers to a specific philosophy of mathematics.
  *   **Define the Mathematical Core:** Explain that for the mathematical intuitionist, LEM fails because mathematical objects are *potential* rather than *actual*. The "future" of the mathematical universe is not written.
  *   **Contrast with Empirical Reality:** Explain that standard intuitionism does not demand skepticism about exoplanets. The exoplanet exists *now*; the proof of Goldbach's conjecture does not exist *yet*. The former is an epistemic limitation; the latter is an ontological absence.
  *   **Cite the Generalization:** Mention that if the author intends the broader verificationist principle, they are technically advocating for **Semantic Anti-Realism**, which extends intuitionistic logic to empirical science, but this is a distinct philosophical move from Brouwer's original program.

  **A Precise Phrasing Suggestion:**
  > "While intuitionistic logic is often popularly framed as a general skepticism toward the unknown, its rigorous application is confined to domains where truth is constitutive of proof. In mathematics, the intuitionist argues that infinite totalities are not 'given' realities, so the Law of Excluded Middle fails where no decision procedure exists. However, this does not necessarily entail skepticism regarding empirical facts. Unless one adopts a broader 'semantic anti-realism' (as argued by Michael Dummett), the intuitionist accepts that physical states of affairs obtain independently of our verification. Thus, Goldbach's Conjecture awaits construction, but microbial life on an exoplanet awaits only discovery."

  This distinction preserves the logical rigor of the mathematical doctrine without attributing an untenable empirical skepticism to the intuitionist unless they explicitly argue for it.
