          2.  Distinguish Brouwer's original Intuitionism (math-specific) from Dummett's Generalized Anti-Realism (logic/meaning-wide).
          3.  Explain *why* LEM fails in math (infinity/time) vs. empirical reality (decidability in principle).
          4.  Address the "exoplanet" example specifically.
