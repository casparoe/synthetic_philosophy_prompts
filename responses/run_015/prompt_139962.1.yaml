answer: |-
  # ADVERSARIAL COLLABORATION: CAUSATION FRAMEWORK
  **Status:** Draft for Review by Working Group  
  **Parties:** Counterfactual Dependence View (CV) | Interventionist Invariance View (IV)  
  **Facilitator:** [Your Name]

  ---

  ## PART I: AGREED CLAIMS
  *The following claims are accepted by both CV and IV as the shared foundation for this collaboration. Disagreements below presuppose this common ground.*

  1.  **Variable Relativity:** Causal claims are best formulated as relations between variables (or events characterized by variables) within a model, rather than as naked relations between concrete particulars in isolation.
  2.  **Structural Equations:** Both views accept that causal structure can be represented by systems of structural equations, where each equation represents a mechanism determining a variable's value given its parents.
  3.  **Distinction from Correlation:** Both views aim to distinguish causal dependence from mere statistical correlation or logical dependence. A change in $X$ must be responsible for a change in $Y$, not merely associated with it.
  4.  **Non-Backtracking Default:** In standard causal assessment, we hold the past fixed (or independent of the putative cause) and do not allow the effect to explain the cause. Both views enforce this, though by different mechanisms (see Disagreement 4).
  5.  **Explanatory Goal:** The primary utility of a causal theory is to support explanation and prediction under manipulation or hypothetical variation. Both views reject purely regularity-based accounts (Humean succession) as insufficient for this goal.
  6.  **Settled Stock Cases:** Both views agree on the causal verdict in standard "switch" cases (flipping a switch causes a light to turn on) and simple overdetermination cases (two rocks hit a bottle; either suffices). Divergence begins in edge cases involving physical impossibility, variable definition, or preemption without dependence.
  7.  **Modality:** Causation involves modal force. It is not merely about what *did* happen, but about what *would* happen under variations.
  8.  **No Reduction to Physics:** Both parties agree that causal claims are not simply reducible to fundamental physical laws in a way that eliminates the causal vocabulary for special sciences. Causation operates at a higher level of abstraction.

  ---

  ## PART II: DISAGREEMENTS TABLE
  *Each row addresses a specific point of divergence. The "Concrete Case/Prediction" column details the specific scenarios requested for this collaboration.*

  | # | Disputed Claim (Neutral Phrasing) | The Crux (Why they disagree) | Concrete Case / Argument & Predictions |
  | :--- | :--- | :--- | :--- |
  | **1** | **The Circularity of "Intervention"**<br>Does defining causation via "interventions" presuppose the very notion being defined? | **CV:** The definition of an intervention uses causal language (a cause of $X$ that affects $Y$ only via $X$). This is viciously circular if the goal is analysis.<br>**IV:** The definition is not reductive but clarificatory. It establishes a fixpoint within a causal model. The "causal" notion used to define intervention is thinner (structural location) than the robust causation being analyzed. | **Case:** Defining an intervention in a novel domain without prior causal knowledge.<br><br>**CV Prediction:** If asked to specify an intervention without using causal verbs, IV will fail or implicitly rely on counterfactuals about what *would* happen if a variable were set. The account cannot get off the ground without prior causal intuition.<br><br>**IV Prediction:** We can specify interventions structurally (exogenous variables in the model). The "causality" is in the model's arrow structure, which is posited based on background theory, not defined away. The circle is hermeneutic (understanding), not vicious (definition). |
  | **2** | **Causation Without Physical Interventions (The Sealed Chamber)**<br>Can $P$ cause $Q$ if no physically possible operation can set $P$ without violating laws or disturbing $Q$ directly? | **CV:** Yes. Causation is about counterfactual dependence evaluated at the closest possible world where $P$ differs (even if that requires a small "miracle" or law-violation at the moment of $P$).<br>**IV:** No (or Undefined). If there is no variable $I$ such that $I \to P$ and $I \not\to Q$ (except via $P$) consistent with the laws, the causal claim is meaningless relative to the model. Causation requires *in-principle* manipulability. | **Case:** *The Sealed Chamber.* A chamber is assembled with a partition welded at position $P$. Total energy $E_0$ is fixed. Gauge reads $Q$. Dynamics are fixed. To change $P$ physically requires breaking the weld (adding energy/disturbing gas).<br><br>**CV Prediction:** Physicists will assert "The partition position $P$ caused the pressure $Q$." They reason: "If $P$ had been 5cm left (holding laws fixed prior, miracle at $P$), $Q$ would differ." The causal claim holds despite the weld.<br><br>**IV Prediction:** Physicists will hesitate to use "cause" regarding the *current* state of $P$. They will shift the causal claim to the *assembly process* ("The welding caused $P$"). If forced to speak of $P \to Q$, they will describe it as a "functional constraint" or "lawful relation," reserving "cause" for variables that could be manipulated in a broader experimental context. |
  | **3** | **Self-Indexing Outcome Variables**<br>Can variables defined by counterfactual baselines (e.g., "excess deaths") be relata in a causal relation without triviality? | **CV:** Yes, provided the baseline is fixed by context. The counterfactual baseline is part of the event description. The challenge is selecting the non-arbitrary baseline.<br>**IV:** This risks tautology. If $Y$ is *defined* as "Actual minus Counterfactual-Without-$X$," then $X$ causing $Y$ is true by definition. The interventionist requires $Y$ to be independently measurable. | **Case:** *The Excess Death Variable.* Let $D$ = actual deaths. Let $D_{cf}$ = deaths if policy $X$ were absent. Let $E = D - D_{cf}$. Does $X$ cause $E$?<br><br>**CV Prediction:** This is a valid causal claim, but the work lies in justifying the baseline $D_{cf}$. Different baselines (e.g., "deaths relative to last year" vs. "deaths relative to model") yield different causal truths. The theory must explain baseline selection, not forbid the variable.<br><br>**IV Prediction:** This formulation is methodologically dangerous. $E$ is not an independent outcome variable; it is a *measure of the causal effect itself*. We should model $X \to D$, not $X \to E$. Using $E$ hides the structural model and makes the causal claim unfalsifiable by stipulation. |
  | **4** | **Traces and Backtracking**<br>How is the asymmetry of causation (cause $\to$ effect, not effect $\to$ cause) enforced in trace cases (e.g., fossils, barometers)? | **CV:** Via the Similarity Metric. We compare worlds where the cause differs vs. worlds where the effect differs. We weight "no backtracking miracles" heavily. The past is held fixed to evaluate the counterfactual.<br>**IV:** Via Arrow Breaking. An intervention on the effect does not change the cause because the structural equation for the cause does not include the effect as a parent. The model structure *stipulates* the direction. | **Case:** *The Barometer.* Barometer $B$ drops, Storm $S$ arrives. $B$ correlates with $S$. Does $B$ cause $S$?<br><br>**CV Prediction:** We evaluate: "If $B$ had not dropped (miracle at $B$), would $S$ still occur?" Yes, because the atmospheric pressure (common cause) would still be low. The similarity metric ensures we don't backtrack to change the pressure to save the $B$ reading. Causation is false.<br><br>**IV Prediction:** We check the model structure. Is there an arrow $B \to S$? No. An intervention on $B$ (setting the needle manually) leaves $S$ unchanged. The direction is secured by the structural equations, not by weighing similarities between worlds. In trace cases (fossils), IV struggles if we cannot model an intervention on the past, whereas CV handles it via similarity. |

  ---

  ## PART III: META-ANALYSIS & FACILITATOR NOTES
  *Observations on the dialectic and potential blind spots.*

  ### 1. Where they are talking past each other
  **The Purpose of the Theory:**
  There is a persistent friction regarding whether the theory is **Metaphysical** (what causation *is* in the world) or **Methodological** (how scientists *identify* causes).
  *   **CV** often writes as if providing a truth-condition for causal statements in the world (ontology).
  *   **IV** often writes as if providing a recipe for causal discovery and experimental design (epistemology/methodology).
  *   **Result:** When CV asks "But is it *really* a cause if you can't touch it?" (Sealed Chamber), they are asking an ontological question. When IV answers "You can't model it as a cause," they are giving a methodological answer. They need to agree on whether "causation" is a feature of reality or a feature of our models of reality.

  ### 2. Where both might be wrong (The Missing Option)
  **The Process/Mechanism Blind Spot:**
  Both CV and IV are fundamentally **dependency theories**. They define causation as a pattern of dependence (counterfactual or probabilistic) between variables.
  *   **The Problem:** Both struggle with cases of **causal processes without dependence** (e.g., deterministic preemption where the backup would have done the job exactly the same way, leaving no counterfactual trace) or **dependence without causation** (some cases of epiphenomena).
  *   **The Third Option:** A **Process Theory** (e.g., conserved quantity transfer or mechanistic continuity). In the *Sealed Chamber* case, a process theorist would say $P$ causes $Q$ because there is a continuous physical transmission of force/pressure from the partition to the gas, regardless of interventions or counterfactual miracles. Both CV and IV ignore the *physical connection* in favor of *modal patterns*.
  *   **Recommendation:** In the Sealed Chamber case, both parties should consider whether "causation" is the right word, or if "physical determination" is the distinct concept they are conflating.

  ### 3. Specific Note on the Circularity Complaint (Row 1)
  The CV accusation of circularity is technically correct but perhaps uncharitable. IV does not claim to *eliminate* causal concepts, but to *structure* them. However, CV is right that IV cannot help a skeptic who doubts the existence of causal structure entirely. IV assumes a causal model to define interventions; CV assumes a similarity metric to define counterfactuals. Both have unproven primitives. The collaboration should acknowledge that neither offers a "view from nowhere."

  ### 4. Specific Note on Self-Indexing (Row 3)
  This is the strongest point of potential synthesis. CV admits baseline selection is arbitrary without context. IV admits variable selection is arbitrary without context. Both agree that **context** determines the causal model. The disagreement is merely whether the context enters at the stage of *variable definition* (IV preference) or *counterfactual evaluation* (CV preference). This may be a notational difference rather than a substantive one.

  ---
  **End of Draft**
