  **TO:** International Partnerships Oversight Board
  **FROM:** [Your Name], Board Member
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Memo: Hungary Faculty Exchange Program

  **Recommendation**
  This memo recommends **conditional continuation** of the faculty exchange program with our partner university in Hungary, subject to a strict **12-month review cycle**. This approach balances our commitment to academic freedom with the ethical risks of institutional complicity, avoiding premature judgment while establishing clear triggers for suspension.

  **Context and Conceptual Challenges**
  The Board is divided between those citing democratic backsliding (judicial capture, media consolidation) as grounds for immediate suspension and those arguing such labels are partisan impositions that harm local students. To decide, we must address a conceptual knot: backsliding is teleological without a fixed baseline. Are we comparing Hungary to its 2004 self, or to an idealized liberal democracy like Sweden? Without fixing this reference class, "erosion" risks becoming a subjective measure of deviation from Western norms rather than an objective assessment of institutional function.

  Furthermore, we must distinguish between regime-level erosion and institutional complicity. While the Hungarian government has centralized funding with political conditions, our partner institution has not independently expelled dissidents or rewritten curricula. They are recipients of conditioned funding, not necessarily authors of the policy. Suspending ties based solely on regime behavior conflates the university with the state, potentially punishing the former for the latter's actions.

  **Steel-Man of the Opposition (Immediate Suspension)**
  Proponents of immediate suspension argue that neutrality in the face of authoritarian consolidation is itself a political act. Their strongest argument rests on **moral complicity**. By maintaining normalcy, we legitimize a system where academic independence is increasingly precarious. Even if the partner university has not actively purged faculty, their acceptance of conditioned funding sustains a structure designed to marginalize dissent. From this view, the baseline is irrelevant; the trajectory is clear. Continuing the exchange signals that our ethical standards are flexible regarding funding sources, undermining our own institutional integrity. The risk to students is regrettable, but preserving our moral standing requires refusing to partner with institutions embedded in a captured state apparatus.

  **Rationale for Conditional Continuation**
  While the complicity argument is principled, immediate suspension precludes the possibility of supportive engagement. The "partisan label" objection warrants serious consideration: if our assessment relies on external indices rather than on-the-ground academic freedom violations, we risk imposing a political litmus test that contradicts our mission of open inquiry.

  A 12-month review cycle allows us to monitor the specific distinction between regime pressure and institutional resistance. We will continue the exchange only if the partner university guarantees that no faculty exchanges are denied based on political viewpoint and that funding conditions do not dictate research outcomes.

  **Action Plan and Timeframe**
  1.  **Immediate Action:** Renew the exchange agreement for one year with added clauses protecting academic freedom.
  2.  **Monitoring Period:** Over the next 12 months, the Board will solicit confidential reports from participating faculty regarding any interference in research or teaching.
  3.  **Review Date:** On October 23, 2024, the Board will reconvene. If evidence suggests the partner institution has actively enforced government conditions on our faculty, the program will be suspended immediately.

  This path avoids the teleological trap of judging based on an abstract baseline while maintaining a principled stance against complicity. It prioritizes the safety and opportunity of students without abandoning our ethical obligations.

  **Decision Required**
  Approval to proceed with conditional renewal pending the 12-month audit.
