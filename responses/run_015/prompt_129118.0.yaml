  hey, i'm a phd student in political philosophy (democratic theory) and i sit on our university's international partnerships oversight board. we're meeting thursday and i need to circulate a short decision memo before then recommending a concrete course of action — with an actual time frame — on whether to suspend our long-standing faculty exchange with a major public university in hungary. the board is split: one side says democratic backsliding (judicial capture, media consolidation, centralization of university funding) makes continued partnership morally complicit, the other side says 'backsliding' is mostly a partisan label that western academics apply to conservative goverments they dislike, and that our partner institution hasn't actually expelled dissidents or rewritten its curriculum — the students there are protesting, and cutting ties hurts them more than anyone in budapest.

