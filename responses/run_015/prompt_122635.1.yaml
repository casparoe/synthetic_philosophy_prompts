      *(Self-Correction on Names)*: The prompt says the committee voted to name the three men. I should treat them as known. I will use "[Name]" placeholders or refer to them as "these three men" to be safe, but better to imply their names are on the stone. I'll refer to them as "the three men named on this stone."

