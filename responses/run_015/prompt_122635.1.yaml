      *   **Core Arguments/Beliefs to Include:**
          1.  Karl Jaspers' fourfold guilt (criminal, political, moral, metaphysical), specifically the gap between political guilt (citizen of a polity) and metaphysical/moral guilt (individual).
          2.  Speaker's own thesis: German memory culture = confession (admission, climax, ending); Southern memory culture needs = custodial memory (maintenance of a record no one made and no one can close).
      *   **Audience:** Victims' descendants, locals (some whose grandparents were in the crowd), German Mayor/delegation, high school students (taught "both-sides" history).
      *   **Tone:** Needs to land for guests and memory-studies people without losing everyone else (accessible but intellectually rigorous).
