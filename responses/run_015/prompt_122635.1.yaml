  2.  **Determine Speech Structure & Timing:**
      *   10 minutes = approx. 1,300 - 1,500 words (speaking pace ~130-150 wpm).
      *   **Opening:** Acknowledge the ground, the names, the weight of the moment. Acknowledge the German guests without subordinating the local pain to their lesson.
      *   **Middle 1 (Jaspers):** Explain the guilt distinction simply. Political guilt (we inherit the town) vs. Moral/Criminal guilt (individual acts). This addresses the "no standing to confess" constraint.
      *   **Middle 2 (Memory Models):** Contrast German "confession" (closure) with Southern "custodial memory" (ongoing care). Address the omission of perpetrators gently but firmly (aligning with descendants' wishes).
      *   **Closing:** Call to action for the students and the town. Custodianship as a duty, not a solution.
      *   **Tone Check:** Respectful, sober, not preachy, not absolving, not defensive.

  3.  **Drafting - Section by Section:**

      *   *Opening:* Stand on the lawn. Name the men (need placeholders or generic reference if names aren't provided, but prompt says "name the three men" was voted on, so I should refer to them respectfully). Acknowledge the German Mayor.
      *   *The German Connection:* Acknowledge their presence but frame it carefully. Not "teachers," but "witnesses to a different struggle."
      *   *Jaspers:* Need to simplify *The Question of German Guilt*. Criminal (court), Political (citizen liability), Moral (conscience), Metaphysical (solidarity with humanity). Focus on Political vs. Moral. I am politically responsible for this town's history because I live here, but I am not morally guilty of the lynching. This avoids false confession.
      *   *The Memorial's Limits:* The names are here. The perpetrators are not. This is not reconciliation. This is a marker.
      *   *Custodial Memory vs. Confession:* Germany seeks *Vergangenheitsbewältigung* (coming to terms), often implying a finish line. The South needs custodianship. You don't "finish" this. You tend to it. Like a grave, like a record.
      *   *Audience Address:*
          *   Descendants: We hear you. This isn't closure.
          *   Students: You didn't do this, but you hold the keys now.
          *   Germans: We walk parallel paths, not identical ones.
      *   *Closing:* The work continues tomorrow.

  4.  **Refining the Argument (Self-Correction during drafting):**
      *   *Constraint Check:* Did I thank the Germans for showing us how? No. Did I confess personal guilt? No. Did I call the omission reconciliation? No.
      *   *Jaspers Nuance:* Jaspers argued Germans had *political* guilt for the crimes of the state, even if not *criminal* guilt. I need to adapt this to the US South. White residents inherit political responsibility for the racial terror state, even if not criminal guilt for specific lynchings.
      *   *Custodial Memory:* Make sure this doesn't sound like "we can't fix it so we won't try." It needs to sound like "the fixing is the tending."
      *   *Language:* Keep it oral. Short sentences. Rhythm. Avoid heavy jargon unless explained.

