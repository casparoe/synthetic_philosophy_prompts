answer: |-
  First, I am sorry you and your family are navigating this. It is a profound emotional burden to manage the logistics of a parent's cognitive decline while simultaneously interrogating the philosophical coherence of the tools you are forced to use. Your intuition is sharp: the legal framework *is* a patchwork. It is not the output of a single, unified theory of personhood. It is a pragmatic compromise between competing ethical values that sometimes contradict each other.

  Your sister is right about the mechanics of agency law, but the "why" requires stepping out of law and into bioethics and moral philosophy. Here is a breakdown of what this patchwork presupposes, where the contradictions come from, and what would happen if you pulled on different threads.

  ### 1. The Core Conflict: Precedent Autonomy vs. Current Interests

  The entire system rests on a tension between two ethical principles:

  1.  **Precedent Autonomy:** The idea that a competent person has a right to determine their future, even when they are no longer competent. This views autonomy as a **temporal project**. You are not just a momentary self; you are a narrative stretching across time. The 62-year-old Dad has a "critical interest" (in the philosopher Ronald Dworkin's terms) in how his life story ends, which outweighs the 70-year-old Dad's "experiential interest" in momentary comfort.
  2.  **Current Best Interests:** The idea that a suffering human being deserves care and protection *now*. If the 70-year-old Dad is confused but happy, and begging for food, denying him food to satisfy the 62-year-old's abstract principle feels like a violation of the person currently in the bed.

  **What the patchwork presupposes:** The law *claims* to prioritize Precedent Autonomy (the Living Will), but in practice, it often retreats to Current Best Interests when the conflict becomes visceral. This is why the system feels inconsistent. It tries to honor the past self's *right* to decide, but treats that right as *evidence* of what the current self would want if they could speak.

  ### 2. Decoding the Anomalies

  You listed several inconsistencies. Here is the ethical logic (or historical accident) behind each:

  *   **Durable POA and Irrevocability:** You asked why we strip Dad of the power to fire the agent once he loses capacity.
      *   *The Logic:* This is not about stripping agency; it is about **protecting agency from coercion**. If a principal could revoke a Durable POA after becoming incapacitated, they could be coerced by a bad actor (or a well-meaning but misguided family member) into firing the designated agent and naming someone who would act against their prior wishes. The "durability" is a shield for the *past* competent self against the *present* vulnerable self.
  *   **Property (Trusts) vs. Body (Specific Performance):**
      *   *The Logic:* This is the distinction between **external assets and bodily integrity**. The law views your body as inseparable from your current self. Involuntary servitude (13th Amendment echoes) prohibits binding future labor. A trust binds *things* you own; a Living Will attempts to bind *you*. The law is more comfortable letting the dead hand control money than controlling biology, which is why medical directives are often treated as "guidance" rather than strict contracts.
  *   **Bankruptcy Rights:**
      *   *The Logic:* This is about **public policy and systemic stability**. You cannot waive certain rights because doing so harms the broader economic system or creates a class of indentured debtors. This is a limit on autonomy for the sake of social order, unrelated to the personal identity questions of dementia.
  *   **Psychiatric Directives vs. Dementia Directives:**
      *   *The Logic:* This hinges on **reversibility**. A psychotic break is often temporary; the "true self" is expected to return. Therefore, clinicians prioritize the safety of the *current* body to ensure the *future* competent self survives. Dementia is progressive and irreversible. The "true self" (the competent one) is not coming back. Therefore, the law leans harder on the prior directive because there is no "future competent self" to restore.
  *   **The Sunset Clause (Expiration):**
      *   *The Logic:* This is an administrative acknowledgment that **values change**. A Living Will signed 20 years ago might not reflect who you are today. The expiration date is a procedural nudge to update the "evidence" of your wishes. It admits that the 40-year-old's signature is not absolute authority over the 60-year-old, even if the 60-year-old is demented.

  ### 3. Right vs. Evidence: The Legal Standard

  You asked: *Does the old directive bind because the earlier person had a right to decide or merely because it's our best evidence about what the later person wants?*

  The answer is: **It starts as a right, but degrades into evidence.**

  In most jurisdictions, the legal standard for a surrogate (your mom) is **Substituted Judgment**. She is not supposed to decide what *she* thinks is best; she is supposed to decide what *Dad* would have decided.
  *   If Dad left a clear Living Will, that is treated as a **right** he exercised.
  *   If Dad left no will, but told you verbally, that is **evidence**.
  *   If Dad is currently mumbling "I want food," but his Living Will says "No tubes," the hospital ethics committee will weigh the **clarity** of the prior right against the **intensity** of the current expression.

  If the current Dad seems to have *any* capacity, the current wish often overrides the prior document. If the current Dad is profoundly incapacitated, the prior document holds more weight. The "patchwork" is actually a sliding scale based on the assessed capacity of the current patient.

  ### 4. The Constitutional Analogy

  You asked if this is like constitutional precommitment (Ulysses contracts).

  **The Analogy Holds:**
  Like a constitution, an Advance Directive is a "precommitment strategy." It is the "Past Self" binding the "Future Self" to prevent a weakness of will (or biology) from derailing the long-term plan. It acknowledges that the "Future Self" might be irrational, coerced, or compromised.

  **Where the Analogy Breaks:**
  *   **Amendment:** Constitutions have amendment processes. Advance Directives generally do not, once capacity is lost. This makes the "dead hand" problem much harder in medicine.
  *   **The "People":** In constitutional theory, "We the People" is a continuous entity. In dementia care, there is a genuine metaphysical debate about whether the 62-year-old and the 70-year-old are the *same* moral patient. If they are not the same person, the "constitution" is actually one person binding a *different* person, which is tyrannical. The law assumes they are the same person to make the system work, but ethics struggles with this.

  ### 5. What If We Changed the Theory?

  You asked what would have to change in the paperwork if we adopted different theories of personhood.

  **Scenario A: The "Current Interests" Standard (The 70-year-old is a new customer)**
  *   *Theory:* The demented person is a new moral entity. The past person's wishes are irrelevant history. We treat the current patient based on their current comfort and distress.
  *   *Paperwork Change:* Living Wills would be non-binding advisory documents only. The Durable POA would be void upon incapacity. A guardian would be appointed by the court to maximize the *current* patient's happiness.
  *   *Result:* Dad would likely get the feeding tube if he asks for it, even if the 62-year-old Dad would have been horrified. This protects the vulnerable body but violates the life narrative.

  **Scenario B: The "Strict Precedent" Standard (The 62-year-old is King)**
  *   *Theory:* Autonomy is absolute and transcends capacity. The 62-year-old's signature is a binding contract that the 70-year-old cannot breach.
  *   *Paperwork Change:* Remove sunset clauses. Remove the ability for clinicians to override based on "current distress." Make the POA irrevocable even *before* incapacity to prevent "weakness of will."
  *   *Result:* Dad would be denied food even if he is screaming for it. This honors the narrative self but risks treating the current body as a mere vessel, potentially inflicting suffering on a being that cannot understand *why*.

  **Scenario C: The Current "Messy Middle" (What we have)**
  *   *Theory:* Autonomy is the primary value, but beneficence (do no harm) is a veto.
  *   *Paperwork:* We keep the Durable POA, but we allow hospitals to pause if the current patient expresses strong contrary wishes. We require re-signing to ensure the "Past Self" is still in touch with the "Future Self."
  *   *Result:* This is the patchwork you see. It is underdetermined because it tries to serve two masters.

  ### 6. Summary: What Generates the Mess?

  There is no single principle. The system is generated by **three competing constraints**:

  1.  **Metaphysical Uncertainty:** We don't know if personal identity survives severe dementia. The law pretends it does for administrative simplicity.
  2.  **Epistemic Humility:** We don't know if the 62-year-old predicted the 70-year-old's preferences accurately. (People are bad at predicting what they will want when disabled). The sunset clauses and ability to update acknowledge this.
  3.  **Risk Management:** The system is designed to protect hospitals from liability. A Living Will protects them from battery suits (feeding someone who refused). Ignoring a screaming patient protects them from neglect suits. They are caught in the middle.

  **Recommendation for your situation:**
  The paperwork you signed is the best tool available for the "Messy Middle." It empowers your mom to interpret the "evidence."
  *   If Dad is peacefully demented and the Living Will says "no tubes," she follows the Will.
  *   If Dad is aggressively distressed and begging for food, the Living Will becomes "evidence" that might be outweighed by the current suffering.

  The "Durable" part doesn't presuppose that the 62-year-old is always right. It presupposes that the 62-year-old is the only one who *could* be right about the big picture, and the 70-year-old is no longer capable of seeing the picture at all. It is a tragic system because it manages a tragedy: the slow uncoupling of a person from their own history.

  The patchwork isn't a failure of logic; it's a map of the friction points where our definitions of "personhood" grind against the reality of biology.
