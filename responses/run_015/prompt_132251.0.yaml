prompt: |-
  My dad got an early-onset Alzheimer's diagnosis a few months ago and we spent last weekend doing the paperwork: a living will where he says no tube feeding and no heroic measures once he can't recognize us, plus a durable power of attorney naming my mom as his health care agent. He was completely with it when he signed, and I get why that's supposed to matter.

  But the more I read about it the more the whole thing looks like a patchwork that doesn't add up, and I don't know any of the vocabulary here, so bear with me.

  Here's what bugs me. Under ordinary agency law — as my sister explained it, she's a lawyer, which is the only reason I know any of this, so correct me if she's got it wrong — an agent's authority normally dies when the principal loses capacity, and the principal can fire the agent whenever they feel like it. The "durable" part of a durable power of attorney is the exception to exactly that: it's built to survive the thing that would normaly kill it, and once Dad is incapacitated he can't take it back. So the moment he might most want to change his mind is the moment we've stripped him of the power to change his mind. That seems backwards, and I want to know what it presupposes.

  And then everything next door goes the other way. As far as I can tell:

  - You can bind your property for decades past your death with a trust, but you can't get a court to personally make somebody show up and do the work — specific performance, my sister says, doesn't run against a person's body or labor.
  - You can't sign away your right to declare bankruptcy, no matter how clearly you meant it.
  - Consent to anything medical is supposed to be giveable and withdrawable in the moment; you can't sign a form at forty that counts as your consent to something at sixty.
  - Except the living will IS a form signed at sixty-two deciding what happens at seventy, and — I think? — if a confused seventy-year-old begs for a feeding tube, the hospital will still refuse him one on the strength of the earlier signature.
  - My sister says psychiatric advance directives, where someone in a clear state says what to do during a psychotic break, get overridden by clinicians constantly even where they're legally valid — so the same move that's binding in dementia apparently isn't in psychosis.
  - The form the hospital gave us lapses in two years unless it's re-signed, which is basically a sunset clause on Dad's authority over himself.

  So: what does this patchwork presuppose? About what a person is across time, about what gives one moment's decision authority over another's, and about whether the old directive binds because the earlier person had a *right* to decide or merely because it's our best *evidence* about what the later person wants? Is there one principle that generates the whole mess — you can precommit your stuff but not your body, or precommitments are honored only where they protect your future agency rather than spend it, or only where third parties can cheaply verify compliance — or is it five unrelated historical accidents that happen to share a name? Which parts does the practice strictly require, and which are just what most people working in it happen to believe? Where is it underdetermined, so that several quite different theories would all license it? And what would actually have to change in the paperwork if we went another way: if we decided the confused seventy-year-old asking for a sandwich is simply a different customer whose current interests are what count, or the opposite, that the sixty-two-year-old's signature is authoritative full stop and needs no renewal?

  People keep comparing all this to constitutional precommitment — supermajority amendment rules, unamendable clauses, the usual complaint about the dead hand of the past — and if that's the same animal, I'd like to know whether one reconstruction covers both or whether the analogy is doing me a disservice.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Query:**

      *   **Context:** The user's father has early-onset Alzheimer's. They recently completed advance directives (Living Will, Durable Power of Attorney for Health Care).
      *   **Core Conflict:** The user sees a logical inconsistency or "patchwork" in the legal/ethical framework surrounding advance directives, agency, and personal identity over time.
      *   **Specific Observations/Questions:**
          *   *Durable POA:* Authority survives incapacity, but the principal can't revoke it once incapacitated. This seems to strip agency when it's most needed.
          *   *Property vs. Body:* Trusts bind property after death; specific performance can't bind labor/body.
          *   *Bankruptcy:* Can't waive right to bankruptcy.
          *   *Medical Consent:* Usually contemporaneous, yet Living Wills bind future self.
          *   *Psychiatric Directives:* Often overridden compared to dementia directives.
          *   *Expiration:* Hospital forms lapse (sunset clauses).
          *   *The Big Question:* What does this presuppose about personal identity across time? Is the earlier decision authoritative because of *right* or *evidence*? Is there one unifying principle, or is it a mess of historical accidents?
          *   *Constitutional Analogy:* Is this like constitutional precommitment (dead hand of the past)?
          *   *Practical Implication:* What would change if we shifted the theory (e.g., current interests count vs. past authority)?

  2.  **Deconstruct the Legal/Ethical Landscape:**

      *   **The "Patchwork" Nature:** The user is absolutely right. It *is* a patchwork. It's not derived from a single first principle of metaphysics or ethics. It's a pragmatic compromise between competing values: autonomy, beneficence, non-maleficence, and administrative feasibility.
      *   **Personal Identity:** The law generally operates on a "psychological continuity" or "narrative identity" model for advance directives (the "then-self" binds the "now-self"), but shifts to a "best interests" standard when the "now-self" is clearly suffering or expressing contrary wishes that seem competent enough to register distress.
      *   **Durable POA:** The logic isn't to strip agency, but to *preserve* the agency the person had when competent. It's a proxy for autonomy, not a removal of it. The inability to revoke is a feature, not a bug, to prevent coercion during incapacity.
      *   **Medical Consent vs. Living Wills:** Contemporaneous consent is the gold standard. Living Wills are a fallback when contemporaneous consent is impossible. The tension arises when the incapacitated person expresses a contrary wish (the "then-self" vs. "now-self" conflict).
      *   **Psychiatric Directives:** These are trickier because capacity fluctuates. A psychotic break might be temporary. Dementia is generally progressive and irreversible. This explains the difference in treatment.
      *   **Expiration/Sunset Clauses:** These are often administrative or state-specific statutory requirements to ensure the document reflects current wishes, acknowledging that people change their minds.

  3.  **Address the Specific Questions:**

      *   *What does it presuppose?* It presupposes that autonomy is a temporal extended project, not just a momentary act. It values the "critical interests" (Dworkin) of the whole life over the "experiential interests" of the moment.
      *   *Right vs. Evidence:* It's a hybrid. It's treated as a right (precedent autonomy), but in practice, it's often weighed as evidence of what the patient *would* want, especially if the current patient seems to have some capacity.
      *   *One Principle?* No single principle. It's a balance of **Precedent Autonomy** (past wishes) vs. **Current Best Interests** (current welfare).
      *   *Constitutional Analogy:* It holds up well. Ulysses contracts. But the "dead hand" problem is mitigated by the fact that the "constitution" is self-imposed for self-protection.
      *   *What would change?* If we prioritized the "now-self," we'd ignore living wills when the patient seems content (even if demented). If we prioritized the "then-self," we'd enforce the will even if the patient is happily begging for food.

  4.  **Drafting the Response (Iterative Process):**

      *   *Empathy First:* Acknowledge the difficulty of the situation. This isn't just theoretical; it's personal.
      *   *Validate the Insight:* The user's legal/philosophical intuition is sharp. The "patchwork" observation is correct.
      *   *Section 1: The Core Tension (Precedent Autonomy vs. Current Interests).* Explain the two competing ethical frameworks. Ronald Dworkin's distinction between "critical" and "experiential" interests is crucial here.
      *   *Section 2: Addressing the Specific Anomalies.*
          *   *Durable POA:* Explain *why* it's irrevocable upon incapacity (protection from coercion).
          *   *Property vs. Body:* Specific performance limits are about involuntary servitude (13th Amendment vibes), whereas property is external.
          *   *Psychiatric vs. Dementia:* Fluctuating capacity vs. progressive decline.
          *   *Expiration:* Administrative safety valve.
      *   *Section 3: The Metaphysics of the Person.* Does the law see one person or two? Legally, one person. Ethically, it struggles. The law prefers the "narrative self."
      *   *Section 4: The Constitutional Analogy.* It works, but with a caveat. Constitutions protect against *others*; Advance Directives protect against *biology/future self*.
      *   *Section 5: Practical Implications.* What if we changed the theory?
          *   *Scenario A (Strict Precedent):* Enforce the will even if Dad is happy.
          *   *Scenario B (Current Interests):* Feed him if he asks, ignore the will.
          *   *Current Practice:* A messy middle ground (Substituted Judgment Standard).
      *   *Conclusion:* Reiterate that the messiness is a feature of trying to apply rigid rules to fluid human experiences.

  5.  **Refining the Tone:**

      *   Needs to be respectful, intellectually rigorous, but accessible.
      *   Avoid overly dense legalese, but use the correct terms (precedent autonomy, substituted judgment, best interests).
      *   Acknowledge the sister's legal input but expand on the *ethical* underpinnings she might not be focusing on.
      *   *Self-Correction during drafting:* I need to make sure I don't give legal advice. Frame everything as "how the system generally works" or "ethical theory," not "this is what will happen in your specific hospital."
      *   *Crucial Nuance:* The user asks if the earlier signature is a *right* or *evidence*. The answer is: It starts as a right, but degrades into evidence if the current state suggests a change in values. I need to explain the "clear and convincing evidence" standard vs. "preponderance of evidence."

  6.  **Final Polish:** Check against the user's specific bullet points to ensure all are addressed. (Trusts, Bankruptcy, Psych directives, Sunset clauses). Ensure the Constitutional analogy is treated with the nuance it deserves.

      *(Self-Correction on the "Sunset Clause"):* Actually, many advance directives *don't* expire by law, but hospitals often ask for updates. I should clarify that distinction. Some states have expiration on POAs if not "durable" enough, but Living Wills often stand. I need to be careful not to generalize too much on state law.

      *(Self-Correction on Psych Directives):* Why are they overridden? Because capacity in psychosis is often deemed *restorable*, whereas dementia is not. Also, police power (harm to self/others) overrides autonomy more readily in psych emergencies.

  7.  **Final Structure:**
      1.  Validation & Empathy.
      2.  The Two Competing Principles (Precedent Autonomy vs. Current Well-being).
      3.  Decoding the Patchwork (Addressing the specific anomalies).
