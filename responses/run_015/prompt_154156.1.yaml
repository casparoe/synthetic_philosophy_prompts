answer: |-
  ### The menu of meanings

  The slogan conceals six distinct philosophical theses ranging from semantic errors to deep ethical claims.

  1. **The Legalist Claim:** Taxation fits the statutory definition of taking property without consent. This ignores that law defines theft as *illegal* taking, making this semantically contradictory within a legal framework, yet it suggests the law itself is illegitimate and that statutory definitions are mere power plays.
  2. **The Moral Equivalence Claim:** Taxation carries the same moral weight as private theft, regardless of legality. This asserts state authority grants no special moral immunity for taking property from citizens, equating the IRS with a mugger. It implies that the number of people involved in the taking does not change the moral nature of the act.
  3. **The Explicit Consent Claim:** Without individual signature, any transfer is unauthorized appropriation. This rejects tacit consent theories like residency or voting as valid authorization mechanisms for financial extraction, demanding contract-like precision.
  4. **The Self-Ownership Claim:** Labor belongs to the self; any claim on earnings violates bodily autonomy. This grounds the theft accusation in natural rights rather than social agreements or utility, making time taxation akin to forced labor.
  5. **The Redistribution Claim:** Only taxes funding transfers to others constitute theft; public goods are fees. This distinguishes between coerced charity and payment for shared infrastructure like roads or defense, allowing for some state funding.
  6. **The Contract Breach Claim:** Taxes are theft only when government fails to deliver promised services. This treats taxation as a conditional payment rather than an unconditional obligation of citizenship, making theft contingent on performance.

  These readings span from simple category errors to robust libertarian arguments. The Legalist and Contract Breach claims are often used rhetorically, while the Self-Ownership and Explicit Consent claims form the core of anarcho-capitalist theory. The Redistribution Claim is the most moderate, permitting a night-watchman state. Understanding which thesis a speaker employs is crucial, as refuting one does not necessarily refute the others. Similarly, demonstrating public benefits does not satisfy the Explicit Consent Claim. The slogan's power lies in this ambiguity, allowing speakers to shift between definitions depending on which argument is easiest to defend in the moment.

  ### Verdicts

  1. **Legalist:** False. It is a category error; legality defines theft, so legal taking cannot be theft by definition within the system.
  2. **Moral:** Substantive-and-defensible. It is a coherent ethical stance, though it conflicts with utilitarian or social contract justifications for state power and authority.
  3. **Explicit Consent:** Substantive-and-defensible. It holds up if one demands strict contractualism, but fails if one accepts democratic authorization as valid consent for representation.
  4. **Self-Ownership:** Substantive-and-defensible. Philosophically robust within libertarianism, but incompatible with views that see society as prior to the individual or collective needs.
  5. **Redistribution:** Substantive-and-defensible. This is logically consistent if one accepts user fees for services but rejects wealth leveling or coerced charity specifically.
  6. **Contract Breach:** Trivial/False. If services are rendered, it is a purchase; if not, it is fraud. It doesn't prove taxation itself is theft, only bad governance.

  The Legalist and Contract Breach claims often collapse under scrutiny, serving more as rhetorical devices than philosophical positions. The Moral, Consent, and Self-Ownership claims remain live philosophical debates, defensible within specific frameworks but not universally accepted. The Redistribution claim is perhaps the most pragmatic, offering a middle ground that many classical liberals accept.

  ### The subway subscription test

  The Netflix analogy relies heavily on the Explicit Consent and Redistribution claims. If taxes are theft because I didn't sign up, then municipal bonds must be opt-in subscriptions where non-payers are excluded. The Moral Equivalence claim also supports this, treating state coercion like private market coercion where non-payment means no service. However, this reading falters on the nature of sovereign debt. Municipal bonds are typically backed by tax revenue, not just user fees. If the bonds are repaid via taxes, the opt-in illusion vanishes; non-subscribers still pay via general revenue. Therefore, only a reading that treats the state as a private vendor supports the roommate's view. If the state is a sovereign, the subscription model collapses because sovereignty implies mandatory jurisdiction over territory. Thus, only the most radical libertarian readings support the Netflix comparison; moderate readings accept taxes as mandatory membership dues for civilization that cannot be opted out of without leaving the jurisdiction.

  ### The flat-fee loophole

  The roommate's acceptance of flat fees undermines the broad "taxation is theft" slogan. If coercion makes taxation theft, flat mandatory fees are equally coercive. By exempting flat fees, the roommate shifts the claim from "taxation is theft" to "redistribution is theft." This aligns with the Redistribution Claim above. However, this distinction fails if the flat fee exceeds the cost of service, becoming a surplus extract. The loophole only holds if one defines "tax" strictly as progressive redistribution and "fee" as price-for-service. This makes the slogan imprecise; it should read "progressive taxation is theft," which lacks the same rhetorical punch but accurately reflects the roommate's actual position. The inconsistency suggests the objection isn't to coercion itself, but to who benefits. If the payer benefits directly (subway), it's a fee; if others benefit (welfare), it's theft. This renders the original slogan overly broad and misleading, masking a specific objection to wealth transfer rather than state funding itself.
