answer: |-
  This is a sharp observation that cuts to the core of a major tension in modern animal welfare science: the gap between **emerging neuroethology** (what we know about animal minds) and **regulatory/certification inertia** (what we are willing to measure and pay for).

  The split you describe isn't accidental; it reveals a specific, often unspoken, ethical framework. Here is a breakdown of the theory hiding in that audit gap, an evaluation of its scientific consistency, and what a truly consistent audit would look like.

  ### 1. The Hidden Theory: Phylogenetic Prejudice & Behavioral Legibility

  The certification schemes are operating under a hybrid theory that combines **Phylogenetic Moral Hierarchy** with **Pragmatic Tractability**.

  **A. De Facto Binary Sentience (The Vertebrate Bias)**
  While the EU officially recognized decapod crustaceans as sentient beings in 2021 (following the LSE review), certification schemes often operate on an older, **vertebrate-centric model of moral status**.
  *   **The Theory:** Sentience is treated as a binary switch located roughly at the spinal column. Above the line (fish, mammals, birds), animals are assumed to have an "inner life" capable of suffering *and* pleasure. Below the line (invertebrates), they are treated as biological machines that respond to nociception (pain reflexes) but lack the neuroanatomy for subjective experience.
  *   **The Reality:** Neuroethology suggests sentience is a gradient. Decapods have central nervous systems capable of integration, memory, and avoidance learning. They trade off pain against reward (e.g., a hermit crab will endure a shock to keep a high-quality shell). By ignoring this, the audits presuppose that **complexity of neuroanatomy equals existence of welfare**, rather than **capacity for valuation.**

  **B. The "Behavioral Legibility" Problem**
  You mentioned "behavioral budgets" for salmon. This relies on **anthropomorphic legibility**.
  *   **Salmon:** They swim in 3D space in clear water. Their movements (swimming against current, schooling, surface feeding) are easily captured by cameras and interpreted by humans as "active," "stressed," or "playing."
  *   **Shrimp/Crabs:** They are small, often nocturnal, live in turbid water or dense substrate, and their "behavior" is often microscopic or obscured.
  *   **The Theory:** Welfare only counts if it is **observable and measurable by human auditors.** If the behavior is opaque (hard to see) or illegible (hard to interpret), the audit defaults to physiological proxies (survival/FCR). This is a **positivist bias**: if we can't measure the mental state, we assume the metric is survival.

  **C. Negative vs. Positive Welfare**
  The split reveals a two-tiered welfare system:
  *   **Tier 1 (Salmon):** **Positive Welfare.** The goal is a "good life." Hence, enrichment, play, and behavioral freedom.
  *   **Tier 2 (Crustaceans):** **Negative Welfare.** The goal is "efficient production without mass death." Hence, survival rates and FCR.
  *   **The Implication:** This presupposes that invertebrates cannot experience *positive* states (pleasure, comfort, anticipation), only negative ones (pain, stress). There is no scientific consensus supporting this; if they can suffer, they likely have states they prefer to avoid or seek.

  ### 2. Is This Consistent with "Science-Based"?

  **No. It is "Science-Selective."**

  To claim these schemes are science-based while maintaining this split is increasingly untenable for three reasons:

  1.  **The LSE Review (2021):** Commissioned by the UK government, this review analyzed over 300 scientific studies and concluded there is "very strong evidence" of sentience in decapod crustaceans. Certification schemes that ignore this are ignoring the current scientific consensus.
  2.  **Nociception vs. Pain:** The audits conflate *nociception* (reflexive withdrawal) with *pain* (subjective experience). Rapid chilling (thermal shock) causes violent tail-flipping in shrimp. Science indicates this is an escape response to noxious stimuli, not just a reflex. Treating it as acceptable while banning live-boiling of lobsters in restaurants is a **contextual inconsistency**, not a scientific one.
  3.  **Physiological Stress Markers:** We *can* measure stress in crustaceans (hemolymph lactate, glucose, hyperglycemia). Relying only on survival rates ignores sub-lethal stress that compromises welfare long before the animal dies.

  **The Real Driver: Tractability & Economics**
  The inconsistency is largely economic.
  *   **Salmon:** High-value product. Consumers pay a premium for "welfare-friendly." The margin exists to fund behavioral studies and lower densities.
  *   **Shrimp:** Commoditized protein. Margins are razor-thin. Implementing electrical stunning, lowering stocking densities, or providing substrate would drastically increase cost.
  *   **The Audit Logic:** The audit is designed to be **passable by the industry.** If the science makes the industry unprofitable, the audit lags behind the science.

  ### 3. What Would Change if the Logic Were Applied Consistently?

  If certification schemes applied the same **welfare logic** (sentience + positive welfare + behavioral freedom) to crustaceans as they do to salmon, the audits would undergo a radical transformation.

  **A. Slaughter & Harvest (The Immediate Fix)**
  *   **Current:** Slurry ice, rapid chilling, or live boiling.
  *   **Required:** Mandatory **pre-stunning**. This usually means electrical stunning (passing current to induce unconsciousness before death) or magnetic stunning. Live transport to slaughter without stunning would be non-compliant.
  *   **Rationale:** If a lobster cannot be boiled alive in a partner restaurant, a farmed shrimp cannot be chilled alive in a processing plant.

  **B. Stocking Density & Environment**
  *   **Current:** High density, bare tanks/ponds (maximize biomass).
  *   **Required:** **Environmental Enrichment.** Shrimp and crabs are often cannibalistic when stressed or crowded. Audits would require substrate, hiding places (shelters), and significantly lower stocking densities to allow for natural territorial behaviors.
  *   **Rationale:** Just as salmon need swimming range, crabs need spatial complexity to express natural behaviors and reduce aggression.

  **C. Metrics Beyond Survival**
  *   **Current:** Mortality %, FCR.
  *   **Required:** **Behavioral & Physiological Indicators.**
      *   *Reflex Impairment:* Testing righting response (can the shrimp flip itself over?).
      *   *Posture:* Monitoring for lethargy or abnormal curling.
      *   *Avoidance Learning:* Audits might require proof that animals are not subjected to repeated unavoidable stressors.
      *   *Molting Stress:* Specific protections during ecdysis (molting), when they are most vulnerable to aggression and pain.

  **D. Genetic Integrity**
  *   **Current:** Selective breeding for fast growth (often leads to muscle necrosis or inability to molt).
  *   **Required:** Breeding for **robustness and welfare traits**, not just growth speed. If the animal grows too fast for its exoskeleton to support, that is a welfare failure similar to skeletal deformities in salmon.

  ### Summary

  The split you see is not based on a coherent theory of moral status. It is a **legacy artifact of vertebrate bias** maintained by **economic tractability**.

  It presupposes that welfare is a luxury good applicable only to animals whose suffering is visible to us (legible) and whose production allows for a margin (profitable). To call it "science-based" is a category error; it is **industry-based** using science as a justification where convenient.

  If the logic were consistent, shrimp farming would look less like biomass production and more like low-density husbandry, with stunning mandatory at harvest and environmental complexity required for life. The fact that it doesn't suggests the certification is protecting the supply chain, not the sentient within it.
