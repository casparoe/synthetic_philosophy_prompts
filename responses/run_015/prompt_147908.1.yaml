prompt: |-
  so in a bunch of european aquaculture certification schemes they do these welfare audits where for salmon they track 'behavioral budgets' — like vertical swimming range, current variation, even funding studies on 'positive welfare' and play-like behavour. but for shrimp and crabs in the exact same supply chain they only measure survival rate and feed conversion. and at harvest they allow rapid chilling for shrimp even though it triggers clear stress responses, while they ban live-boiling lobsters in partner restaurants but dont require electrical stunning for farmed crustaceans. what theory of moral status or welfare is hiding in that split? does it presuppose sentience is binary and tied to some neuroanatomy line, or that welfare only counts if an animal can have 'positive' states? could it just be tractability? is it consistent with calling the scheme science-based? and what would have to change in the audit if they actually applied the same welfare logic to crustaceans?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the User's Query:**

      *   **Observation:** European aquaculture certification schemes (e.g., ASC, GlobalG.A.P.) treat finfish (salmon) differently from crustaceans (shrimp, crabs).
      *   **Salmon:** Behavioral budgets, vertical swimming, current variation, positive welfare studies, play-like behavior.
      *   **Shrimp/Crabs:** Survival rate, Feed Conversion Ratio (FCR), rapid chilling allowed (stressful), no electrical stunning required (unlike live-boiling bans in restaurants).
      *   **Core Question:** What theory of moral status or welfare underlies this split?
      *   **Hypotheses offered by User:**
          *   Binary sentience tied to neuroanatomy?
          *   Welfare only counts if 'positive' states are possible?
          *   Tractability (ease of measurement)?
          *   Consistency with "science-based" claims?
      *   **Follow-up:** What would need to change in the audit to apply the same logic to crustaceans?

  2.  **Analyze the Underlying Ethical/Scientific Frameworks:**

      *   *Sentience:* The EU recognizes decapod crustaceans as sentient (2021 ruling). So, a strict "non-sentient" theory is legally outdated in Europe, though certification schemes lag.
      *   *Neuroanatomy:* Salmon have complex brains (pallium). Crustaceans have ganglia. Historically, this was used to deny sentience. Now, we know nociception and central integration exist in crustaceans.
      *   *Welfare Concepts:*
          *   *Basic Needs (Five Freedoms):* Survival/FCR fits here (Freedom from hunger/thirst).
          *   *Quality of Life (Five Domains/Positive Welfare):* Behavioral budgets fit here (Mental state).
      *   *Tractability/Economics:* Measuring shrimp behavior is hard (small, opaque water, high density). Measuring salmon behavior is easier (clear water, cameras, lower density).
      *   *Anthropomorphism:* "Play" is easily projected onto fish. Shrimp scuttling is harder to interpret as "play."

  3.  **Evaluate the "Science-Based" Claim:**

      *   If the science says crustaceans are sentient (which it increasingly does), but the standards treat them like biomass, the claim is inconsistent.
      *   It relies on an *implicit* hierarchy of sentience based on phylogenetic distance from humans (Vertebrate bias).

  4.  **Synthesize the "Hidden Theory":**

      *   It's not one single theory, but a mix of:
          1.  **Phylogenetic Prejudice (Vertebrate Centrism):** Moral status drops off sharply at the vertebrate/invertebrate line.
          2.  **Behavioral Opacity:** If we can't read the behavior easily, we assume no inner state (Problem of Other Minds).
          3.  **Economic Tractability:** Welfare is pursued only where it doesn't destroy margins. Shrimp margins are tighter; salmon are premium.
          4.  **Negative vs. Positive Welfare:** Salmon get "positive" (enrichment); Crustaceans get "negative" (just don't die).

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the sharp observation. Validate that this inconsistency is real and widely criticized by animal welfare scientists.
      *   **The Hidden Theory (The "Why"):**
          *   *Phylogenetic Moral Hierarchy:* The "Vertebrate Bias." Sentience is treated as a gradient, but the certification acts like it's a binary switch at the spine.
          *   *The "Behavioral Legibility" Problem:* Salmon behavior is legible to humans (swimming paths). Shrimp behavior is chaotic/obscured. If we can't measure it, we pretend it doesn't matter.
          *   *Negative vs. Positive Welfare:* Salmon = "Good Life." Shrimp = "Efficient Death."
          *   *Tractability & Economics:* It's cheaper to monitor salmon. Shrimp are commoditized.
      *   **Is it "Science-Based"?**
