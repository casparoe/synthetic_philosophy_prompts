      *   **Task:** Evaluate the friend's account. What would a specialist accept? What would they reject? Does the conclusion follow? Specifically address the "logical consistency" framing.

  2.  **Deconstruct the Friend's Account (The "Dinner Party Summary"):**
      *   *Claim 1:* Hypocrisy undermines blame because it's logically inconsistent/self-defeating.
      *   *Claim 2:* "You have no standing" means "Your argument carries no rational weight due to inconsistency."
      *   *Claim 3:* Objection (hypocrite's blame can still be *true*) is met with the "insincerity" reply (if you believed it was wrong, you wouldn't do it).
      *   *Conclusion:* Standing reduces to sincerity.

  3.  **Consult Philosophical Knowledge (Standing to Blame):**
      *   *Key Figures:* R. Jay Wallace, Gary Watson, T.M. Scanlon, Macalester Bell, David Owens, Fritz & Miller, Bell & Perez.
      *   *Core Concept:* "Standing" is a normative status, not just a logical property. It's about *authority* or *right* to hold someone accountable, not just the truth of the proposition.
      *   *Hypocrisy:* The standard case for losing standing. But why?
      *   *The "Logical Consistency" Objection:* Most philosophers *reject* the idea that hypocrisy makes the *content* of the blame false or logically inconsistent. Blaming someone for lying while lying yourself is not a logical contradiction (like saying "P and not-P"). It's a normative tension.
      *   *The "Sincerity" Reduction:* This is a specific objection (often associated with the idea that hypocrites don't really believe the norm). But many philosophers argue you can be a sincere hypocrite (weakness of will/akrasia).
      *   *Alternative Explanations for Standing:*
          *   *Commitment/Authority:* You forfeit the right to demand compliance if you don't comply (Wallace/Watson).
          *   *Equality/Respect:* Hypocrisy treats the other as inferior (Fritz & Miller).
          *   *Clean Hands:* You shouldn't criticize if you're complicit (Bell).
      *   *Truth vs. Standing:* A crucial distinction. A hypocrite's blame can be *true* (you did wrong) but *illegitimate* (I shouldn't be the one telling you).

  4.  **Evaluate Specific Claims against the Literature:**

      *   *Claim 1 (Logical Consistency):* **False/Overstated.** Philosophers distinguish between logical contradiction and normative inconsistency. The proposition "You lied" is true regardless of whether I lied. The inconsistency is in my *agency*, not my *proposition*.
      *   *Claim 2 (Rational Weight):* **Misleading.** It's not about the weight of the *argument*; it's about the *relationship*. It's a reactive attitude issue (Strawson).
      *   *Claim 3 (Insincerity):* **Contested.** Weakness of will (akrasia) allows for sincere belief + wrongful action. Reducing standing to sincerity ignores the "forfeiture" models.
      *   *Conclusion (Standing = Sincerity):* **Does not follow.** Standing is usually viewed as a distinct normative category (authority/right), not just a psychological state (sincerity).

  5.  **Drafting the Response (Iterative Process):**

