answer: |-
  Your instincts are excellent. As a physicist, you've developed a sensitivity to when a model is being over-simplified to the point of breaking, and your friend's summary is a classic case of "dinner-party reductionism." He has taken a rich, normative debate and flattened it into a problem of logic and psychology.

  A specialist in moral responsibility (someone like R. Jay Wallace, Gary Watson, or more recently, philosophers like Kyle Fritz and Daniel Miller) would accept the *phenomenon* your friend describes but would reject almost all of his *explanatory machinery*.

  Here is a breakdown of what a philosopher working on this would accept, what they would push back on, and why the conclusion that "standing reduces to sincerity" does not follow.

  ### 1. The "Logical Consistency" Framing
  **Verdict: Incorrect.**

  This is the part that triggered your suspicion, and your suspicion is warranted. Your friend claims that hypocritical blame is "self-defeating" because it is logically inconsistent to claim X is wrong while doing X.

  A specialist would reject this immediately. There is no logical contradiction in the proposition: *"It is wrong for you to lie (even though I am lying)."*
  *   **Logical Contradiction:** Asserting $P$ and $\neg P$ simultaneously.
  *   **Normative Inconsistency:** Endorsing a norm while violating it.

  If I blame you for littering while I am littering, I am not asserting that littering is *not* wrong. I am asserting that *you* violated a norm that I am *also* violating. The content of my blame ("You littered, and that is wrong") can be entirely true. The inconsistency lies in my *agency*, not my *logic*.

  Philosophers distinguish between the **truth conditions** of blame (did the agent do wrong?) and the **normative conditions** of blame (am I the right person to hold them accountable?). Your friend has collapsed these two. He suggests that if you lack standing, your blame is "false" or "carries no rational weight." Most standing theorists argue the blame is *accurate* but *illegitimate*. It's the difference between a statement being factually correct and a speaker having the authority to issue it.

  **The Physics Analogy:** Imagine a measurement device that is uncalibrated. It might accidentally read the correct value (true belief), but it lacks the warrant to certify that value (standing). Your friend is arguing that because the device is uncalibrated, the value it displays must be false. A specialist would say the value might be true, but the device has no authority to assert it.

  ### 2. The "Sincerity" Reduction
  **Verdict: Plausible but insufficient.**

  Your friend argues that if a hypocrite really believed the norm, they wouldn't violate it; therefore, their blame is insincere manipulation. This reduces the standing problem to a psychological one (what is in the blamer's head?).

  Specialists push back on this for two main reasons:

  **A. Weakness of Will (Akrasia)**
  Philosophers of action generally accept that agents can sincerely endorse a norm and still violate it due to weakness of will. I can sincerely believe smoking is wrong, deeply regret it, and yet smoke. If I then blame my child for smoking, am I being insincere? Not necessarily. I might genuinely wish they avoid the mistake I made. If standing reduced to sincerity, the weak-willed moralist would have standing. Many standing theorists argue they do not.

  **B. The "Forfeiture" Model**
  The dominant view in the literature (associated with R. Jay Wallace and others) is not that the hypocrite is lying, but that they have **forfeited their authority**. By violating the norm themselves, they lose the right to demand compliance from others. This is a normative status, not a psychological state.
  *   **Sincerity View:** "You can't blame me because you don't really believe it."
  *   **Forfeiture View:** "You can't blame me because you violated the very rule that gives you the authority to demand I follow it."

  The forfeiture view explains why a reformed sinner (who is now sincere) might *still* lack standing if they haven't made amends for their past violations, or why a person who is currently struggling (sincere but failing) lacks standing.

  ### 3. What the Specialist Would Accept
  Your friend got the *extension* roughly right, even if the *intension* was wrong.
  *   **Hypocrisy undermines standing:** Yes, this is the consensus. If you are guilty of the same fault, your blame is inappropriate.
  *   **Standing is distinct from truth:** Implicitly, he acknowledged this by mentioning the pushback ("the hypocrite's blame can still be true").
  *   **It's about the relationship:** By mentioning "manipulation," he touched on the idea that blame is a communicative act between agents, not just a verdict on a state of affairs.

  ### 4. What is Actually at Stake? (The "Real" Debate)
  If it's not logic, and it's not just sincerity, what is the "standing to blame" debate actually about?

  Current literature generally frames standing as a matter of **moral equality** or **commitment**.
  *   **The Equality Account (Fritz & Miller):** Hypocritical blame is objectionable because it treats the wrongdoer as inferior. The blamer sets themselves up as a judge while exempting themselves from the jurisdiction. It violates the equal moral status of persons.
  *   **The Commitment Account (Wallace/Watson):** To blame someone is to demand that they adhere to a shared moral expectation. If you don't adhere to it yourself, you haven't actually committed to the expectation in the way required to demand it of others.

  This is why your "logical consistency" alarm was ringing. Your friend tried to solve a **normative** problem (who has the right to hold whom accountable?) with a **logical/psychological** solution (consistency and sincerity).

  ### 5. Does the Conclusion Follow?
  **No.** The conclusion that "standing reduces to sincerity" does not follow from the accurate parts of his account.

  If standing were merely sincerity:
  1.  **The Penitent Problem:** A person who sinned in the past, repents sincerely, and now follows the rule would have full standing. But many theories suggest they need to make amends or wait before they regain the authority to blame others for that specific fault.
  2.  **The Complicit Non-Hypocrite:** Consider someone who didn't commit the *same* wrong, but benefited from it (complicity). They might be perfectly sincere that the act is wrong, but still lack standing because their hands aren't clean. Sincerity doesn't capture this.
  3.  **The Accidental Hypocrite:** If I unknowingly do the very thing I blame you for, I am technically hypocritical (by extension) but not insincere. Do I have standing? Most say no. If standing were sincerity, I would.

  ### Summary for Your Next Dinner
  You can tell your friend that his summary conflates **propositional consistency** with **normative authority**.
  *   **He said:** "You can't claim X is wrong while doing X."
  *   **Correction:** "You can claim X is wrong while doing X (that's just weakness of will), but you lose the *authority* to hold *me* accountable for X."
  *   **He said:** "Therefore, you are being insincere."
  *   **Correction:** "Therefore, you have forfeited the standing to blame, regardless of your sincerity, because you violate the condition of moral equality required for that reactive attitude."

  Your intuition was correct: he dissolved a normative question into a logical one. In physics terms, he tried to solve a boundary condition problem by adjusting the constants inside the equation. The structure of the interaction (the boundary) is what matters, not just the internal state of the variables (sincerity).

  If you want to read one paper to get the lay of the land, look for **"Standing to Blame"** by **David Owens** or **"Hypocrisy, Standing, and Normative Commitments"** by **Kyle Fritz and Daniel Miller**. They will confirm that the "logical consistency" line is not the standard view in the literature.
