          *   (3) Tobias: Neutrality claim is standard, but the "relocation" to theoretical virtues is where the anti-realism is smuggled in. (Rating: Mixed).
          *   (4) Ines: **CRITICAL FLAG.** This thought experiment is incoherent. Functionally indiscernible beings cannot make different verbal reports. That *is* a functional difference. (Rating: Mistaken/Incoherent).
          *   (5) Tobias: Consistent, but relies on the "extra item" view of consciousness. (Rating: Consistent but question-begging against non-reductive realists).
          *   (6) Ines: Strong rebuttal on the "extra item" fallacy (Russellian monism angle). (Rating: Right).
      *   *Overall:* Ines wins on the metaphysics (6), but loses on the logic of her TE (4). Tobias wins on the consistency of his physicalism but assumes the conclusion in his parsimony argument.
