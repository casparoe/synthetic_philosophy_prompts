  The strongest case for certifying "not engaged" rests on institutional integrity. If the manual states "Addiction is not an identity," and we certify a resident who claims "I am an addict" as engaged, we undermine our own clinical doctrine. The Director worries that validating fatalism enables self-fulfilling prophecy. If we ignore the verbal contradiction, the manual becomes decorative, and staff lose a tool for challenging cognitive distortions. This argument fails because it conflates honesty with resistance. T.V.'s fatalism is a forecast, not a refusal to act. Punishing honest doubt with removal teaches residents to hide doubt, not resolve it. The data suggests the metric doesn't predict failure anyway, so risking his placement on this semantic ground offers no protective benefit to the public or the resident. It prioritizes doctrinal purity over practical stability. Furthermore, his offer to "say it however you want" proves that demanding different words would only secure compliance, not engagement. We reject the "not engaged" certification because it punishes honesty without improving outcomes.

  **6. Disposition and dates**
  By next Thursday, the Senior Counselor will initiate weekly sessions focused on agency language, documenting progress. The Clinical Director will review these notes bi-weekly. Satisfaction requires T.V. to articulate at least one instance of choice-based motivation without prompting by Week Twelve. If he reverts to "say it however you want" coercion tactics or misses plan milestones, we will convene an emergency panel to consider a "not engaged" certification for the court. Until then, his placement holds. The Counselor submits notes by Monday mornings. The Director flags concerns within forty-eight hours. This ensures we monitor the risk without destabilizing his housing. We file the court form Thursday afternoon.
