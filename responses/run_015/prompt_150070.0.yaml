answer: |-
  # The Coupling Protocol: A Runnable Seminar Package

  **Course:** Philosophy of Cognitive Science (Upper-Level)
  **Topic:** The Extended Mind (Clark & Chalmers 1998)
  **Time:** 90 Minutes
  **Class Size:** 18 Students
  **Room:** No screens, paper only.

  ## 1. Core Design & Premises

  **The Goal:** To move students from the intuition that "tools help" to the philosophical problem of "where does the tool become the mind?" by forcing the Clark & Chalmers criteria (Availability, Endorsement, Trust) to dissociate.

  **The Premise:** The activity rests on the assumption that **metacognitive attribution** (who gets the blame for an error? how much effort feels "worth it" to retrieve a belief?) is a reliable proxy for **ontological boundaries** (what counts as part of the cognitive system).
  *   *If this premise is false:* The activity becomes a demonstration of *psychological comfort* with tools, not evidence for the Extended Mind Thesis (EMT). You must acknowledge this in the debrief: "We are using phenomenology as a clue to ontology, but the clue might be misleading."

  **The Ethical Protocol (Deception):**
  The Tampering Test involves altering a student's work without their immediate knowledge.
  *   **Preamble:** You must state at the very beginning: *"In this session, we are investigating how you interact with information systems. Some phases involve manipulations of the materials provided to test system robustness. All deceptions will be fully revealed before you leave, and no data will be used outside this room."*
  *   **The Reveal:** Do not wait until the end of class to reveal the tampering. Reveal it immediately after the Tampering Round concludes. This prevents lingering distress or feelings of violation. The *theoretical* debrief waits until the end, but the *trick* is exposed instantly.

  ## 2. Materials & Setup

  **For the TA:**
  *   Stopwatch/Timer (phone is okay for you, just not students).
  *   Whiteboard/Chalkboard (for instructions and score tracking).
  *   3 Envelopes labeled "Phase 2," "Phase 3," "Phase 4."
  *   A "Master Key" (a sheet with the correct answers for scoring).

  **For the Students (per group of 3):**
  *   10 Blank Index Cards.
  *   3 Pens (different colors if possible).
  *   1 "Wager Slip" pad (small slips of paper for confidence betting).
  *   1 "Protocol Sheet" (for the Registrar to record times and scores).

  **Room Setup:**
  *   Arrange tables for 6 Triads (3 students per group).
  *   Designate a "Bank" (your desk) where cards are exchanged.

  ## 3. Roles (Rotating)

  In each Triad, students rotate roles every phase so everyone experiences the Subject position.
  1.  **Subject:** Performs the memory task using the card.
  2.  **Registrar:** Records latency (time to answer), confidence wagers, and error attribution ("Was this my fault or the card's?").
  3.  **Proctor:** Handles the physical cards, goes to the Bank for swaps, and executes the Tampering (under TA supervision).

  ## 4. Timeline (90 Minutes)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-05** | **Intro & Ethics** | Procedural instructions only. No theory. Ethical preamble regarding manipulation. |
  | **05-20** | **Build Phase** | Subjects encode the "Alien Lexicon" onto their Index Card. |
  | **20-35** | **Baseline** | Normal use. Establishes the "Coupled System" status quo. |
  | **35-50** | **Test 1: Substitution** | The "Perfect Card" vs. "Strange Hand" condition. |
  | **50-65** | **Test 2: Friction** | Adding retrieval cost (physical distance/points). |
  | **65-75** | **Test 3: Tampering** | **Deception Phase.** Silent alteration of data. |
  | **75-80** | **Deception Reveal** | Immediate reveal of the tamper. Check for distress. |
  | **80-90** | **Theoretical Debrief** | Mapping experience to Clark & Chalmers, Adams & Aizawa, etc. |

  ## 5. The Task: "The Alien Lexicon"

  To ensure the task requires reliance but isn't impossible, use 20 arbitrary symbols mapped to English words.
  *   *Example:* ⍺ = Apple, ⍲ = Bridge, ⍴ = Cloud... (Ensure symbols are visually distinct but writable).
  *   **Build Phase:** Give students a sheet with the 20 pairs. They have 10 minutes to copy these onto their Index Card in *their own system* (shorthand, color-coding, layout). They cannot bring the original sheet to the test. They must use *only* their Index Card.

  **Scoring & Payoff (The Confidence Stake):**
  *   **Accuracy:** 10 Points per correct translation.
  *   **Wager:** Before each answer, the Subject writes a wager (1 to 5 points) on the slip.
      *   **Correct:** Add Wager to Score.
      *   **Incorrect:** Subtract Wager from Score.
  *   **Why:** This measures *Endorsement*. High wager = "I stand by this belief." Low wager = "I'm just reading a prop."

  ## 6. The Three Tests (Rules for the Proctor/TA)

  ### Test 1: Substitution (The "Ownership" Dissociation)
  *   **Goal:** Separate *utility* from *authorship*.
  *   **Procedure:** The Proctor takes the Subject's card to the Bank. The Bank returns a **Master Card**.
  *   **The Control:** The Master Card contains the *exact same correct information* but is typed/neatly printed by a stranger (you). It is objectively superior (no handwriting errors, faster to read).
  *   **Hypothesis:** If EMT is true based only on utility, performance should improve. If "endorsement/trust" is required, confidence (wagers) should drop despite better data.
  *   **Registrar Note:** Record if the Subject hesitates to trust the new card.

  ### Test 2: Friction (The "Availability" Dissociation)
  *   **Goal:** Degrade the coupling without changing the content.
  *   **Procedure:** The Subject must keep their original card, but it is placed on a table 10 feet away. To check the card, they must stand up, walk to the table, look, and return to sit before answering.
  *   **Cost:** Additionally, every time they stand up, they pay a **5 Point Tax** from their total score.
  *   **Hypothesis:** At what point do they stop checking and guess from memory? Does the "system" break when the cost exceeds the benefit?
  *   **Registrar Note:** Record the "Break Point" (when they stop walking and start guessing).

  ### Test 3: Tampering (The "Endorsement" Dissociation)
  *   **Goal:** Test error attribution.
  *   **Procedure:** While the Subject is distracted (during the Friction phase transition), the Proctor takes the card to the Bank. The TA (you) silently alters **2 entries** on the card using a pen that matches the Subject's ink.
      *   *The Alteration:* Swap two similar symbols' meanings (e.g., make ⍲ mean Cloud instead of Bridge).
  *   **The Test:** When the Subject inevitably gets those two questions wrong, the Registrar asks: *"Why was that wrong?"*
      *   Option A: "I misread it." (Internal attribution)
      *   Option B: "The card was wrong." (External attribution)
  *   **Hypothesis:** If the card is part of the mind, errors should feel like *my* errors (Option A). If it's just a tool, the tool broke (Option B). Clark & Chalmers argue for Option A (trust is automatic).

  ## 7. The Debrief (80-90 Minutes)

  **Step 1: The Reveal (5 mins)**
  *   Announce the Tampering. Show the altered cards.
  *   Ask: "Did anyone notice?" "How did it feel to realize the card lied?"
  *   *Safety Check:* Ensure no one feels personally targeted. Emphasize the card was the variable, not their competence.

  **Step 2: Mapping the Data (5 mins)**
  *   Write three columns on the board: **Availability**, **Endorsement**, **Trust**.
  *   Ask students to place their experiences from the three tests into these columns.
      *   *Substitution:* Availability was high, Trust was low. (Cluster comes apart).
      *   *Friction:* Availability was low, Trust remained high (until the tax hit).
      *   *Tampering:* Trust was violated, leading to system rejection.

  **Step 3: Theoretical Connection (5 mins)**
  *   **Now** introduce the vocabulary.
  *   **Clark & Chalmers:** They argue that if the External Resource functions like Inga's memory (Otto's notebook), it *is* memory. The "Parity Principle."
  *   **The Cluster:** Explain that C&C require the resource to be *constantly available, automatically endorsed, and trusted.*
  *   **The Activity's Lesson:** Your experience showed these conditions can be pried apart. You had a resource that was available (Substitution) but not endorsed. You had a resource you trusted (Baseline) but became unavailable (Friction).
  *   **The Objections (Adams & Aizawa):**
      *   *Coupling-Constitution Fallacy:* Just because the card is coupled to you (Friction phase) doesn't mean it constitutes your mind. The activity shows *coupling* easily, but *constitution* is the philosophical leap.
      *   *The Mark of the Cognitive:* Is there something intrinsic to biological memory (non-derived content) that the card lacks?
      *   *The Explosion Worry:* If the notebook counts, does the smartphone? The internet? (Refer to the Friction Tax: at what point did the internet become too 'far away' to be you?)

  ## 8. Troubleshooting & Uncertainty

  **What Will Predictably Go Wrong:**
  1.  **The Tamper is Spotted Immediately:** If the handwriting doesn't match perfectly, the Subject will laugh and say "This isn't my writing."
      *   *Recovery:* Pivot immediately. "Excellent. Why did the handwriting matter more than the information? Does 'mine' mean 'my ink' or 'my data'?" This actually strengthens the discussion on *ownership* vs. *content*.
  2.  **The Friction Tax is Ignored:** Students might not care about the points.
      *   *Recovery:* Make the payoff matter. The top scorer gets a tangible (but small) prize (e.g., first choice on next paper topic, or a high-quality pen). Or, simply emphasize that the *Registrar* is grading the *Subject's* rationality.
  3.  **The "Shrug" Response:** Students say "Of course the card isn't me, it's paper."
      *   *Recovery:* Remind them of the Baseline. "When you were fast and confident in Round 1, did you feel like you were 'looking up' information or 'remembering' it? If you felt 'remembering,' why does the material matter?"

  **The Design Choice I'm Least Confident About:**
  *   **The Tampering Subtlety.** It is very hard to forge a student's handwriting quickly enough in class without them noticing.
  *   **Observation to Abort:** If the Proctor struggles to alter the card without the Subject seeing, or if the Subject immediately laughs upon receiving the card back, **abort the Tampering analysis**.
  *   **Fallback:** Switch to a "Glitch" discussion. "Imagine the card *had* worked. If you had memorized a wrong number from the card originally, would that be your fault or the card's?" Move from *active deception* to *hypothetical error attribution*.

  **The Premise Check:**
  *   **Premise:** "How people attribute error and ownership is evidence about what their minds are made of."
  *   **If False:** If students argue "I blamed the card because I want to save face, not because I think the card is external," the activity fails to prove EMT.
  *   **Mitigation:** In the debrief, explicitly state: "This activity measures the *phenomenology of extension*, not the *metaphysics of extension*. Clark & Chalmers argue the phenomenology tracks the metaphysics. Adams & Aizawa argue it does not. You have now felt the tension between those two positions."

  ## 9. Board Plan (For the TA)

  **Left Panel:**
  *   **Rules:**
      *   10 pts correct.
      *   Wager 1-5.
      *   Wrong = Lose Wager.
      *   Friction Tax = 5 pts/stand.

  **Center Panel:**
  *   **The Lexicon** (Display the 20 symbols/words during Build Phase, then erase).
  *   **Scoreboard** (Track Group Totals to keep energy up).

  **Right Panel:**
  *   **The Three Marks** (Leave blank until Debrief).
      *   1. Availability
      *   2. Endorsement
      *   3. Trust
  *   *(Fill these in during debrief based on student reports)*.

  ## 10. Ethical Preamble Script (Read Aloud at 00:00)

  > "Welcome. Today is a workshop on cognitive systems. You will be working in triads to solve translation tasks using self-constructed aids.
  >
  > Two important ground rules:
  > 1. **No external devices.** No phones, no watches, no pre-existing notes. Only what we make here.
  > 2. **Experimental Integrity.** To test how systems handle stress, some phases involve manipulations of the materials you create. You will not be told when these manipulations occur. However, I guarantee that **no manipulation will affect your grade**, and **every manipulation will be fully revealed before you leave this room**. If at any point you feel uncomfortable, you may step out of the Subject role and observe without penalty.
  >
  > Your goal is to maximize points through accuracy and confidence. Let's begin."
