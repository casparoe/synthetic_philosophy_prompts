  4.  **Developing the "Control" against "I just like my notes":**

      *   The prompt asks for a condition where sentiment and integration point in opposite directions.
      *   *Idea:* The "Perfect Stranger" card. It is objectively better (neater, more complete) but not *theirs*. If they reject it despite it being better, it supports the "ownership/endorsement" condition over mere utility. If they accept it, it challenges the "constantly available/trusted" condition.
