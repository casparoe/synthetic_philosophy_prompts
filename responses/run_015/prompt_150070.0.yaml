      *   *Materials:* Index cards (lots), pens (different colors), timers (watches/phones for TAs only? No, no phones. Use a wall clock or TA stopwatch), slips for confidence betting.
      *   *Task:* "The Alien Lexicon." 20 arbitrary symbols mapped to English words.
      *   *Tampering:* Change 2 definitions on the card during a break.
      *   *Substitution:* Swap card with partner's card (same content, different handwriting) OR a "Master Card" (perfect content, neutral handwriting).
      *   *Friction:* Must stand up and walk to a table to check the card.

  10. **Final Review against Constraints:**

      *   No jargon until end? Check.
      *   Ethical handling? Check.
      *   Control for "like my notes"? Check (The "Perfect Card" condition).
      *   Troubleshooting included? Check.
      *   Premise check included? Check.

  11. **Polishing the Tone:**

      *   Needs to be professional, ready-to-use, acknowledging the TA's expertise but providing concrete scaffolding.
