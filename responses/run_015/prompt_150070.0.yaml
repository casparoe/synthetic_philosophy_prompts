          *   Student A: Subject.
          *   Student B: Registrar (timing/confidence).
          *   Student C: Proctor (handles card swaps/tampering).
          *   Rotate roles each phase.

  6.  **Refining the Payoff Scheme:**

      *   Points for accuracy.
      *   Multiplier for confidence (Staking). High confidence + Correct = Big Points. High Confidence + Wrong = Big Penalty.
      *   This measures *endorsement* (a key C&C condition).

  7.  **Addressing the "Uncertainty" and "Premise":**

      *   *Premise:* Metacognitive feelings (ownership, blame) track ontological boundaries of the mind.
      *   *Risk:* Students might just play along or be confused.
      *   *Uncertainty:* The Tampering Test. Will they notice? If they don't notice, the data is useless. If they notice immediately, the deception fails. Need a subtle alteration.
      *   *Fallback:* If tampering is spotted too fast, pivot to discussion on "why did you spot it?" (implies tight coupling).

  8.  **Structuring the Debrief:**

      *   Map Substitution -> Parity Principle (is the external resource functionally equivalent?).
      *   Map Tampering -> Endorsement/Trust (do I own the output?).
