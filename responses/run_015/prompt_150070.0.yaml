          *   Premise check (attribution of error/ownership as evidence of constitution).

  2.  **Deconstruct the Activity Design:**

      *   **Phase 1: Construction (Build Phase).** Students need to create a cognitive aid from scratch. This ensures ownership and specific encoding.
          *   *Task:* Memorize a set of complex associations (e.g., arbitrary symbols to definitions, or a map). Let's go with a "Cipher Key" or "Lexicon" task. It's abstract enough to require reliance but concrete enough to score.
          *   *Material:* Index cards, pens.
      *   **Phase 2: Baseline.** Use the aid normally. Establish confidence and speed.
      *   **Phase 3: The Three Tests.**
          *   *Substitution:* Swap cards with someone else (or a "perfected" version). Does it feel like *my* knowledge?
          *   *Tampering:* Alter the card secretly. Do they blame themselves or the card?
          *   *Friction:* Add a cost (time or points) to looking. Does the coupling break?
      *   **Phase 4: Debrief.** Connect experiences to Clark & Chalmers, Otto/Inga, and objections (Adams & Aizawa, etc.).

  3.  **Addressing Ethical/Deception Concerns:**

      *   *Tampering Test:* This involves altering a student's work without their immediate knowledge.
      *   *Mitigation:* Informed consent at the start (broadly: "some conditions involve manipulation of materials"), immediate debrief, right to withdraw data (though hard in a classroom), emphasizing pedagogical purpose.
