prompt: |-
  so here's the situation. I'm on a tiny team (four people) trying to decide whether to go ahead with a project that, as far as we can tell, has been attempted a handful of times in adjacent fields and basically never landed on time or on budget. Two of us built a fairly detailed causal model of why our version should take about a year; one of us keeps saying that's exactly what the planning-fallacy literature predicts everyone says, and that we should just look at the base rate for projects of this shape and multiply by three. I don't want to settle our argument. I want the spec: what would an actual theory of *when to defer to the outside view* have to get right in order to count as adequate for making a real decision like this? Not a vibe, not "use base rates when available," a list of requirements with the case or consideration behind each.

  A few things I already think belong somewhere on the list, but you place them and add what I'm missing: the difference between a reference class that's similar in *mechanism* (shared causal structure) and one that's similar only in *outcome statistics*, and what to do when the narrowest mechanically-similar class and the narrowest outcome-similar class point in opposite directions; the "we excised the cause" move, where your inside view names the specific thing that killed the historical cases and claims to have removed it, versus the fact that probably every team in the class had some story like that — I want a requirement that says what evidence would separate those two without just defaulting to "assume you're average"; the fact that reference classes can be *endogenous*, i.e. if everyone deferred to the base rate then only teams with unusually strong inside-view reasons would attempt, which changes the base rate the next person should use, so the theory can't treat the numbers as handed down from nowhere; the fact that choosing the reference class is itself a judgment call exposed to the same overconfidence, so the theory has to say where the regress stops or why it isn't vicious; the distinction between using the outside view as a *point estimate*, as a *calibration check on your model*, and as a *decision threshold*, since a class with enormous spread can be useless for the first and fine for the second; and what the outside view even *is* in a first-of-a-kind case where the only classes that contain you are absurdly broad. Also, please keep separate two things I notice people run together: modesty about your own reliability as a forecaster, and deference to a base rate about your case — you can be maximally modest about yourself and still think the class says nothing about you, or be beautifully calibrated and still owe deference, so a theory that collapses them is hiding something.

  For each requirement say which case motivates it, and mark which ones are non-negotiable and which are just the preferences of one camp. The part I care most about: tell me which subset of the desiderata you think can't be jointly satisfied — my guess is that "must be sensitive to genuinely diagnostic inside-view information" and "must not be exploitable by self-serving claims of exceptionality" are secretly the same requirement pulling in two directions, but you tell me where the real impossibility is, since if the list is itself unsatisfiable that's the interesting result. And say which single requirement does the most work in ruling out the usual rules of thumb (always defer where a class exists; defer unless you have a mechanism; split the difference; defer to the narrowest class containing you; outside view as sanity check only). A short scorecard for those at the end is fine, but keep the weight on the criteria — that's the part I actually want to think with. Oh, and write it so I could hand it to the teammate who disagrees with me without it reading like it was written for my side.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Context:** A tiny team (4 people) deciding on a high-risk project. History suggests failure (late/over budget). Two members built a causal model (Inside View) saying 1 year. One member cites Planning Fallacy/Base Rates (Outside View) saying multiply by 3.
      *   **Goal:** The user doesn't want the answer to the argument. They want a *specification* for a theory of *when to defer to the outside view*.
      *   **Tone/Audience:** Needs to be neutral enough to hand to the disagreeing teammate. Not a "vibe," but a rigorous list of requirements with justifications.
      *   **Specific Constraints:**
          *   Include user's pre-existing ideas (mechanism vs. outcome similarity, "we excised the cause" evidence, endogenous reference classes, reference class selection regress, point estimate vs. calibration vs. threshold, first-of-a-kind cases, distinction between forecaster modesty vs. base rate relevance).
          *   For each requirement: State the case/motivation, mark as Non-Negotiable (NN) or Camp Preference (CP).
          *   Identify impossibility results/trade-offs (which desiderata can't be jointly satisfied).
          *   Identify the single requirement that does the most work against standard heuristics.
          *   Provide a scorecard for standard heuristics at the end.
      *   **Key Insight Needed:** The user suspects a tension between "sensitivity to diagnostic inside-view info" and "non-exploitability by self-serving claims." I need to validate or refine this.

  2.  **Deconstruct the User's Pre-existing Ideas & Integrate Them:**
      *   *Mechanism vs. Outcome:* Reference classes need structural similarity, not just statistical similarity.
      *   *Excised Causes:* How to prove you fixed the specific failure mode of past projects without just claiming it.
      *   *Endogeneity:* If everyone defers, the pool changes. The base rate isn't static.
      *   *Reference Class Regress:* Choosing the class is subjective. How to stop the regress?
      *   *Usage Mode:* Point estimate vs. Calibration vs. Threshold.
      *   *First-of-a-Kind:* What if no good class exists?
      *   *Modesty vs. Deference:* Distinguish "I am bad at guessing" from "This class predicts failure."

  3.  **Drafting the Requirements (Iterative Process):**

      *   *Req 1: Reference Class Construction.* Needs to address the mechanism/outcome split and the regress problem.
          *   *Motivation:* User's point on mechanism vs. outcome + regress.
          *   *Status:* NN. You can't do OV without a class.
      *   *Req 2: The "Excised Cause" Burden of Proof.* Needs to address how to validate the inside view's claim of uniqueness.
          *   *Motivation:* User's point on "we excised the cause."
          *   *Status:* NN. Otherwise, anyone can claim exception.
      *   *Req 3: Endogeneity Awareness.*
          *   *Motivation:* User's point on selection effects.
          *   *Status:* CP (Theoretically crucial, practically hard). Let's make it NN for a *complete* theory, but acknowledge implementation difficulty. Actually, for a decision spec, it's NN because ignoring it leads to systematic error.
      *   *Req 4: Distinguishing Modesty from Relevance.*
          *   *Motivation:* User's point on forecaster reliability vs. case relevance.
          *   *Status:* NN. Crucial for the specific team dynamic described.
      *   *Req 5: Output Modality (Estimate vs. Check vs. Threshold).*
          *   *Motivation:* User's point on spread/utility.
          *   *Status:* NN. Using OV as a point estimate when variance is high is misuse.
      *   *Req 6: Handling the "Unique" Case.*
          *   *Motivation:* First-of-a-kind projects.
          *   *Status:* CP. Some say default to Inside View, others say broad class.
      *   *Req 7: The Trade-off (Sensitivity vs. Robustness).*
          *   *Motivation:* The user's suspicion about impossibility.
          *   *Status:* NN (as a constraint to be managed).

  4.  **Refining the "Impossibility" Insight:**
      *   The user thinks "Sensitivity to Inside View" vs. "Non-exploitability" is the tension.
      *   *My analysis:* It's deeper. It's about *Information Asymmetry*. The Inside View has high-bandwidth private info (the causal model). The Outside View has low-bandwidth public info (the statistic). A theory that weights the Outside View heavily discards private info (losing sensitivity). A theory that weights the Inside View heavily allows noise/bias to masquerade as signal (exploitability).
      *   *The Real Impossibility:* You cannot simultaneously *maximize* responsiveness to novel causal mechanisms (Inside View strength) and *guarantee* protection against planning fallacy bias (Outside View strength) without an independent arbiter of mechanism validity. Since the team *is* the arbiter, there is a fundamental epistemic gap. The theory must specify a *cost function* for errors (Type I: Abandoning a viable project vs. Type II: Pursuing a doomed one). Without that, the tension is unresolvable.

  5.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the stakes, set the neutral tone.
      *   **The Specification (The List):**
          *   Use clear headings.
          *   Include "Motivating Case," "Requirement," "Status (NN/CP)."
          *   Integrate the user's specific points into these formal requirements.
      *   **The Impossibility Result:** Address the tension. It's not just "pulling in two directions," it's about the *verifiability* of the causal claim *before* the outcome.
      *   **The "Killer" Requirement:** Which one kills the usual heuristics? Likely the "Excised Cause Burden of Proof" or the "Modesty/Relevance Distinction." I think the *Burden of Proof* is the strongest filter.
      *   **Scorecard:** Evaluate standard heuristics against the spec.

  6.  **Review against Constraints:**
      *   *Neutral Tone:* Avoid siding with the "1 year" or "3 years" camp. Focus on the *process* of deciding.
      *   *User's Points:* Ensure mechanism/outcome, excised cause, endogeneity, regress, output modality, unique case, modesty/relevance are all explicitly covered.
      *   *Formatting:* Clear, readable, "spec-like."

  7.  **Polishing the Arguments (Self-Correction during drafting):**
      *   *Correction on Endogeneity:* While theoretically important, for a single team decision, it's often treated as fixed. I should mark it as NN for a *general theory* but maybe note its practical limitation for a *single decision*. No, the prompt asks for a theory adequate for *a real decision like this*. If the base rate is endogenous to the decision rule, ignoring it makes the theory wrong. I'll keep it NN but clarify the scope.
      *   *Correction on Modesty:* Make sure to clearly separate "I am overconfident" from "This class is predictive."
      *   *The Impossibility:* I need to be precise. It's not that they can't be satisfied, it's that satisfying one *degrades* the other without an external validation mechanism. The "Impossibility" is that a *self-contained* theory cannot resolve the weight without importing an external value judgment (risk tolerance).

  8.  **Final Polish:** Check the tone. Ensure it sounds like a document two smart people could read without feeling patronized. (e.g., "This requirement prevents the team from..." rather than "You need to stop being overconfident.")

  9.  **Final check of the "Killer Requirement":** Why does "Burden of Proof for Exceptionality" rule out the heuristics?
      *   *Always defer:* Fails because it ignores excised causes.
      *   *Defer unless mechanism:* Fails because it doesn't demand evidence for the mechanism.
      *   *Split difference:* Fails because it treats them as same epistemic category.
      *   *Narrowest class:* Fails the regress problem.
      *   *Sanity check only:* Fails to utilize statistical power when inside view is weak.
      *   *Yes, the Burden of Proof is the active ingredient.*

  10. **Writing the Response.** (Proceeding to generate output based on these thoughts.)
answer: |-
  # Specification: Adequacy Conditions for a Theory of Outside-View Deference

  **Context:** This document outlines the necessary conditions for a decision-theory framework governing when a project team should defer to base-rate statistics (Outside View) versus internal causal modeling (Inside View). It is designed to be neutral regarding the specific outcome of the current project decision, focusing instead on the structural validity of the reasoning process.

  **Objective:** To define a set of desiderata that any adequate theory must satisfy to avoid known epistemic pitfalls (planning fallacy, reference class tennis, overconfidence) without discarding genuine innovation or causal insight.

  ---

  ## Part I: The Requirements

  ### 1. The Mechanism-Outcome Alignment Condition
  *   **Motivating Case:** Two reference classes are available. Class A shares the same *outcome statistics* (e.g., "software projects") but different causal structures. Class B shares the same *causal mechanisms* (e.g., "projects relying on unproven physics") but sparse outcome data. Standard heuristics often default to the larger statistical class.
  *   **Requirement:** The theory must prioritize reference classes defined by shared causal generators over classes defined solely by shared surface-level outcomes. If the narrowest mechanically-similar class and the narrowest outcome-similar class diverge, the theory must provide a weighting rule, not a default.
  *   **Status:** **Non-Negotiable.** Ignoring causal structure treats correlation as causation, rendering the outside view inert to actual changes in project design.

  ### 2. The Burden of Proof for "Excised Causes"
  *   **Motivating Case:** The team claims, "Previous projects failed because of X; we have removed X, therefore the base rate does not apply." Historical analysis shows nearly every failed team made a similar claim prior to starting.
  *   **Requirement:** The theory must specify an evidentiary standard for claiming a specific failure mode has been neutralized. It cannot accept the *assertion* of removal as sufficient. It must require either: (a) independent verification of the removal, (b) a track record of the team successfully removing similar causes in the past, or (c) a causal model that has been stress-tested against the specific failure mode of the reference class.
  *   **Status:** **Non-Negotiable.** Without this, the Inside View becomes unfalsifiable, and the Outside View is rendered useless by universal claims of exceptionality.

  ### 3. The Endogeneity Constraint
  *   **Motivating Case:** If a decision rule dictates "defer to base rate unless inside view is strong," then only teams with overconfident inside views will proceed. This selection bias alters the success rate of the reference class for the next decision-maker.
  *   **Requirement:** The theory must acknowledge that the base rate is not a fixed physical constant but a function of previous decision rules. It must specify whether the team is treating the base rate as a *current population statistic* or a *counterfactual stability estimate*.
  *   **Status:** **Non-Negotiable (for a general theory); Camp Preference (for single-instance).** For a one-off decision, teams often treat rates as fixed. However, an *adequate theory* cannot ignore that the rate itself is endogenous to the rule being proposed.

  ### 4. The Reference Class Regress Stopper
  *   **Motivating Case:** Choosing a reference class is a judgment call subject to the same biases as the project estimate. One can always find a narrower class where the team looks better (e.g., "projects led by people with our exact initials").
  *   **Requirement:** The theory must define a stopping condition for narrowing the reference class. This cannot be "the narrowest class containing us." It must be "the narrowest class for which the causal mechanism remains invariant."
  *   **Status:** **Non-Negotiable.** Prevents "reference class tennis" where the outside view is manipulated to support the desired conclusion.

  ### 5. The Modesty-Relevance Distinction
  *   **Motivating Case:** A team member argues, "We are bad at forecasting, so we must use the base rate." Another argues, "We are good forecasters, but this project class is inherently unpredictable." Standard discussions conflate "I am unreliable" with "This data is irrelevant."
  *   **Requirement:** The theory must separate *forecaster calibration* (the team's ability to estimate) from *class predictive power* (the statistical stability of the project type). One can be a perfectly calibrated forecaster on a class with high variance, or a biased forecaster on a class with low variance.
  *   **Status:** **Non-Negotiable.** Conflating these leads to deferring to base rates when the problem is actually team competence, or trusting the team when the problem is environmental volatility.

  ### 6. The Output Modality Specification
  *   **Motivating Case:** A reference class has a mean of 3 years but a standard deviation of 5 years. Using this as a point estimate is garbage. Using it to check if a 1-month estimate is delusional is valuable.
  *   **Requirement:** The theory must explicitly state whether the Outside View is being used as: (a) a Point Estimate (replace inside view number), (b) a Calibration Check (does inside view fall within N sigmas?), or (c) a Decision Threshold (does the risk profile exceed tolerance?).
  *   **Status:** **Non-Negotiable.** Using a high-variance distribution as a point estimate is a category error.

  ### 7. The "First-of-Kind" Protocol
  *   **Motivating Case:** The project is genuinely novel. The only reference classes containing it are absurdly broad (e.g., "R&D efforts").
  *   **Requirement:** The theory must provide a fallback when mechanically-similar classes are empty. It cannot simply default to "use the broad class" (which adds noise) or "ignore the outside view" (which invites bias). It must specify how to decompose the project into sub-components that *do* have base rates.
  *   **Status:** **Camp Preference.** Some argue for broad class deference; others argue for component-level decomposition. An adequate theory must pick one, not wave hands.

  ---

  ## Part II: The Impossibility Result

  You hypothesized that *"sensitivity to diagnostic inside-view information"* and *"non-exploitability by self-serving claims"* are the tension point. You are close, but the impossibility is more specific.

  **The Tension:** A theory cannot simultaneously **maximize responsiveness to novel causal mechanisms** and **guarantee protection against planning fallacy bias** without an **external arbiter of mechanism validity.**

  **Why:**
  1.  **To be sensitive to the Inside View,** the theory must accept that a causal model *can* override a base rate. This requires trusting the team's assessment of their own causal model.
  2.  **To be non-exploitable,** the theory must assume the team's assessment of their own causal model is biased (planning fallacy). This requires distrusting the team's assessment.
  3.  **The Impossibility:** In a closed system (the team deciding for itself), there is no third party to validate if the "excised cause" (Req 2) is actually excised or just asserted.
      *   If you set the evidentiary bar for "excised causes" high enough to prevent bias, you reject genuine innovation (False Negatives).
      *   If you set the bar low enough to allow innovation, you allow bias to masquerade as insight (False Positives).

  **Resolution:** The theory cannot solve this epistemically. It must solve it **economically**. The "impossibility" is resolved only by introducing a **Cost Function for Error**.
  *   Does the team care more about wasting a year on a doomed project? (Weight Outside View)
  *   Does the team care more about missing a breakthrough because they were too conservative? (Weight Inside View)

  **Conclusion:** A theory that claims to tell you *when* to defer without asking *what the cost of being wrong is* is mathematically incomplete. The "when" is a function of the "cost."

  ---

  ## Part III: The "Killer" Requirement

  Which single requirement does the most work in ruling out standard heuristics?

  **Winner:** **Requirement 2: The Burden of Proof for "Excised Causes."**

  **Why it rules out the usual heuristics:**
  *   **"Always defer where a class exists":** Ruled out. This heuristic ignores the possibility that causes *can* be excised. Req 2 allows for override, provided evidence exists.
  *   **"Defer unless you have a mechanism":** Ruled out. Everyone *has* a mechanism. Req 2 demands evidence that the mechanism *works* to neutralize the historical failure mode, not just that it exists.
  *   **"Split the difference":** Ruled out. This treats the Inside View and Outside View as estimates of the same variable. Req 2 treats them as different epistemic categories (statistical frequency vs. causal claim). You don't average a statistic with a causal claim; you test the claim against the statistic.
  *   **"Defer to the narrowest class containing you":** Ruled out. This addresses Req 1 and 4, but Req 2 is stronger. Even in the narrowest class, you might claim exception. Req 2 governs that claim.
  *   **"Outside view as sanity check only":** Ruled out. If the Burden of Proof is not met, the Outside View is not just a check; it becomes the default. Req 2 shifts the burden of proof onto the Inside View.

  ---

  ## Part IV: Heuristic Scorecard

  | Heuristic | Fails Req 1 (Mechanism) | Fails Req 2 (Burden of Proof) | Fails Req 5 (Modesty/Relevance) | Verdict |
  | :--- | :---: | :---: | :---: | :--- |
  | **Always Defer** | Yes | Yes | No | **Too Conservative.** Discards genuine causal insight. |
  | **Defer Unless Mechanism** | No | **Yes** | No | **Exploitable.** "Having a story" is not evidence of exception. |
  | **Split the Difference** | No | **Yes** | **Yes** | **Category Error.** Averages bias with statistics. |
  | **Narrowest Class** | **Yes** | No | No | **Fragile.** Susceptible to reference class gaming. |
  | **Sanity Check Only** | No | No | **Yes** | **Weak.** Fails to utilize statistical power when inside view is unproven. |
  | **Proposed Spec** | **No** | **No** | **No** | **Robust.** Requires evidence for exception, respects causality. |

  ---

  ## Part V: Implementation Note for the Team

  To use this spec without resolving the argument prematurely:

  1.  **Agree on Req 2 first.** Before arguing the timeline, argue the evidence. Does the causal model identifying the historical failure mode constitute *evidence* of removal, or is it a *claim* of removal?
  2.  **Define the Cost Function.** Acknowledge the Impossibility Result. Explicitly state: "If we are wrong to trust our model, can we survive the delay?" If the answer is no, the Outside View weight increases regardless of the model's elegance.
  3.  **Separate the Forecaster from the Forecast.** Use Req 5. Ask: "Is the base rate wide because the project is hard, or because other teams were bad?" If the former, defer. If the latter, your Inside View has more room to operate.

  This spec does not tell you whether to proceed. It tells you what kind of argument would be required to justify proceeding.
