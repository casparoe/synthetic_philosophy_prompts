answer: |-
  A Darwinian, a Skinnerian, a Popperian, and a Gregorian walk into an unfamiliar campus library to find a single obscure monograph.

  The Darwinian immediately instinctively tries to hibernate inside the book return chute. The Skinnerian sprints down random aisles, getting startled by the "Quiet Zone" signs until he gradually learns which paths are dead ends. The Popperian stands frozen at the entrance, eyes closed, sweating profusely as he mentally tests every possible route through the stacks to avoid physical error.

  The Gregorian walks up to the reference desk, reads the symbolic map, listens to the librarian's language-based directions, and retrieves the book in two minutes.

  Later, the Popperian asks, "How did you find it so fast? I was just finalizing my internal simulation of the shelving system so I could let my hypotheses die in my stead."

  The Gregorian hands him the book and says, "You tried to build a map inside your head. I just let the map stay on the wall and let the librarian do the sorting."

  The Popperian frowns. "But where did the thinking happen?"

  "Outside," says the Gregorian. "That's the whole point."
