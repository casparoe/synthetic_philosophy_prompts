  # JOINT STATEMENT ON THE LEGITIMACY OF MORAL CRIMINALIZATION

  **Signatories:**
  **The Moralist Signatory** (working in the tradition of legal moralism associated with Patrick Devlin)
  **The Liberal Signatory** (working in the tradition of liberal anti-moralism associated with H.L.A. Hart)

  **Date:** October 26, 2023
  **Subject:** The Enforcement of Shared Moral Norms in the Absence of Direct, Individualized Harm

  ## I. AGREED CLAIMS

  We, the undersigned, acknowledge that while our theoretical commitments diverge significantly regarding the proper scope of the criminal law, we share a common foundation regarding the nature of political authority and the stakes of this debate. We affirm the following five propositions without reservation:

  1.  **The Presumptive Wrongfulness of Coercion:** The use of state coercion, particularly the criminal law, involves the infliction of pain, deprivation of liberty, and moral stigma. It is presumptively wrongful and requires a compelling public justification in every instance.
  2.  **The Burden of Justification:** The burden of proof rests always upon those who propose to criminalize conduct. It is not incumbent upon the individual to demonstrate why they should be free, but upon the state to demonstrate why freedom should be curtailed.
  3.  **The Empirical Reality of Pluralism:** Modern societies are characterized by moral pluralism. There is no longer a single, monolithic ethical code universally held by all citizens; disagreement on matters of sexuality, family structure, and personal virtue is a settled sociological fact.
  4.  **The Logical Form of the Harm Principle:** Both parties agree that the prevention of harm to others is *a* sufficient condition for criminalization. We disagree on whether it is a *necessary* condition, but we agree on the logical structure: if conduct causes demonstrable harm to non-consenting others, the state has a *prima facie* case for intervention.
  5.  **The Existence of Shared Sentiments:** We agree that societies possess shared moral sentiments. Even in pluralistic societies, there exist core intuitions regarding right and wrong that are widely distributed across the population, though we disagree on how these sentiments should be identified and what legal weight they carry.

  ## II. TABLE OF PRECISE DISAGREEMENTS

  While we agree on the framework above, we disagree on the application of these principles to conduct that violates shared morality but causes no direct, individualized harm. The following table delineates our specific points of divergence, incorporating the distinctions between expressive and instrumental moralism, and between direct and structural harm.

  | Issue | The Moralist Position | The Liberal Anti-Moralist Position |
  | :--- | :--- | :--- |
  | **1. Legitimacy of Expressive Justification** | **Accepted.** The law legitimately functions to symbolically affirm the community's moral identity. Even absent causal benefits, the state may criminalize conduct to publicly declare that certain acts are incompatible with membership in the political community. | **Rejected.** The expressive function of law is insufficient to justify coercion. Using the criminal law merely to state a moral preference treats citizens as means to an end (social symbolism) rather than autonomous agents. |
  | **2. Epistemic Status of Moral-Ecology Predictions (Instrumental Moralism)** | **Credible.** It is rational to believe that widespread deviation from shared morality causally contributes to social disintegration. The state is justified in acting on this prediction to prevent tangible social damage, even if the causal chain is complex. | **Speculative.** Predictions that private immorality leads to social collapse are historically unfounded and empirically unproven. Basing coercion on such speculative "moral ecology" invites error and tyranny. |
  | **3. Nature of Structural Harm** | **Sui Generis.** Structural harm (the erosion of the normative framework sustaining cooperation) is a distinct category of injury. It is not merely the sum of individual hurts; it is damage to the society as an entity, which ultimately threatens all members. | **Reducible or Non-Existent.** "Structural harm" is either reducible to aggregated direct harms (e.g., increased crime rates) or is a metaphor lacking justificatory force. Without specific victims, there is no harm sufficient to warrant criminal sanctions. |
  | **4. Relevance of Majority Sentiment** | **Probative.** The intensity of feeling (disgust, indignation) among the "reasonable man" is evidence that a moral norm is essential to society's existence. Majority sentiment is a valid heuristic for identifying threats to the social fabric. | **Irrelevant to Justification.** The intensity of majority feeling is not evidence of harm. To allow popular disgust to dictate criminal law is to permit the "tyranny of the majority" over minority lifestyles without rational ground. |

  ## III. CRUCES AND PROBATIVE EVIDENCE

  We identify three specific cruxes—sub-questions where resolution would significantly alter the opposing party's stance. For each crux, we specify the kind of evidence or analysis we agree would be probative and record our explicit predictions.

  ### Crux 1: The Empirical Link Between Moral Liberalization and Social Cohesion
  *   **The Question:** Does the decriminalization of "victimless" moral offenses (e.g., consensual sexual conduct, gambling, substance use) correlate with a measurable decline in social trust, cooperative stability, or institutional resilience?
  *   **Probative Evidence:** Comparative longitudinal studies of jurisdictions that have liberalized moral laws versus those that have maintained strict moral enforcement, controlling for economic and political variables.
  *   **Moralist Prediction:** We predict that jurisdictions which sever the link between law and shared morality will demonstrate higher rates of social fragmentation, lower trust in institutions, and increased anomie over time.
  *   **Liberal Prediction:** We predict no such correlation. We anticipate that social cohesion is sustained by justice, economic stability, and political legitimacy, not by the enforcement of private morality. Liberalization may initially cause friction but will not degrade the normative framework.

  ### Crux 2: The Conceptual Reducibility of Structural Harm
  *   **The Question:** Can the erosion of a normative framework be fully described as a collection of direct harms to specific individuals, or does it constitute a distinct injury to the "public interest" that cannot be disaggregated?
  *   **Probative Analysis:** A conceptual analysis demonstrating whether "social disintegration" can be cashed out entirely in terms of individual rights violations or setbacks to interests.
  *   **Moralist Prediction:** We argue that structural harm is *sui generis*. A society can collapse even if no specific individual is directly victimized by a specific act, because the *preconditions* for trust are removed. This cannot be reduced to aggregated direct harms.
  *   **Liberal Prediction:** We argue that any claim of structural harm must be reducible to specific setbacks to individual interests to be meaningful. If no individual is worse off, the "harm" is merely a change in aesthetic or cultural preference, which is insufficient for criminalization.

  ### Crux 3: Institutional Stability and Moral Legislation
  *   **The Question:** Does the existence of moral legislation stabilize cooperative norms, or does it destabilize them by generating resentment and disrespect for the law?
  *   **Probative Evidence:** Historical case studies of repeal (e.g., the decriminalization of homosexuality or adultery) measuring subsequent compliance with *other* laws and general respect for legal institutions.
  *   **Moralist Prediction:** We predict that removing moral prohibitions signals that the law is indifferent to virtue, reducing the moral obligation to obey the law and destabilizing cooperative norms.
  *   **Liberal Prediction:** We predict that removing moral prohibitions increases respect for the law by aligning it with autonomy and reason, thereby stabilizing cooperative norms through voluntary compliance rather than fear.

  ## IV. RESIDUE: VERBAL VS. SUBSTANTIVE DISAGREEMENT

  Upon reviewing our positions, we assess whether any portion of our dispute is merely verbal—arising from different definitions of key terms rather than conflicting judgments about the world.

  **1. The Definition of "Harm"**
  *   **Assessment:** Partially Verbal.
  *   **Analysis:** The Liberal Signatory defines "harm" narrowly as a setback to the welfare interests of specific individuals. The Moralist Signatory defines "harm" broadly to include threats to the existence of the society itself.
  *   **Resolution:** If the Liberal Signatory were to adopt the Moralist's definition of harm (accepting structural erosion as "harm"), the Liberal would still object that the *type* of harm is too remote to justify coercion. If the Moralist Signatory adopted the Liberal's definition, they would concede the label "harm principle" but argue society has a right to self-preservation beyond it.
  *   **Verdict:** This is not purely verbal. Even if we agree on a definition, we disagree on the *weight* of the interest. However, clarifying that the Moralist relies on "Structural Harm" and the Liberal on "Direct Harm" removes the appearance that the Liberal ignores social stability.

  **2. The Concept of "Morality"**
  *   **Assessment:** Substantive.
  *   **Analysis:** We are not merely using the word "morality" differently. The Moralist views morality as a constitutive element of social existence (like a constitution). The Liberal views morality as a matter of private conscience.
  *   **Verdict:** This disagreement survives scrutiny. It is a fundamental clash regarding the ontology of society.

  **3. The Value of Autonomy vs. Security**
  *   **Assessment:** Substantive.
  *   **Analysis:** Ultimately, our disagreement rests on a hierarchy of values. The Liberal Signatory prioritizes individual autonomy, accepting some risk to social cohesion as the price of liberty. The Moralist Signatory prioritizes the security of the social fabric, accepting some restriction on liberty as the price of order.
  *   **Verdict:** This is the irreducible residue. No amount of empirical evidence can fully resolve a conflict over ultimate values. However, by isolating this value clash, we clarify that the dispute is not about whether society *can* collapse (empirical), but whether preventing that collapse justifies overriding individual autonomy (normative).

  **Conclusion of Residue:**
  While clarifying the definitions of "harm" and "morality" sharpens the debate, it does not dissolve it. The core disagreement remains substantive: it is a conflict between the right of the individual to ethical independence and the right of the community to moral self-preservation. We agree that the law should not be used lightly, but we fundamentally disagree on what constitutes a heavy enough reason to use it.
