answer: |-
  **MEMORANDUM**

  **TO:** City Naming and Remembrance Commission
  **FROM:** Drafting Committee
  **SUBJECT:** Recommendation Regarding Petition to Retain Name of [School Name] High School

  ### I. Derived Principles from Precedent

  To ensure coherence with the Commission's six prior decisions, we must distill the underlying logic that separates removal (Precedents 1, 3, 4) from retention (Precedents 2, 5, 6). Two competing principles emerge from the track record:

  **Principle A: The Integrity of Honor (Active Harm/Intent)**
  *   **Logic:** Public institutions that actively serve the community (schools, clinics, statues) cannot bear the names of individuals whose primary public legacy involves the systematic exclusion, harm, or subjugation of the populations they now serve. The original intent of the naming and the moral character of the honoree are dispositive.
  *   **Supported by:** Precedent 1 (Confederate statue removed due to Jim Crow intent), Precedent 3 (Segregationist governor renamed despite alumni), Precedent 4 (Physician renamed due to harm to enslaved women).
  *   **Implication for New Case:** The school must be renamed. The 1955 naming was an explicit act of resistance to desegregation. The fact that the school is now 85% Black makes the honorific particularly incongruous. Alumni sentiment is secondary (see Precedent 3).

  **Principle B: The Evolution of Meaning (Functional Drift/Context)**
  *   **Logic:** Names acquire meaning through usage. If a name no longer functions primarily as a tribute to the honoree, or if the community has organically reclaimed the symbol to represent their own resilience, retention is permissible, provided historical context is acknowledged. This applies more readily to passive infrastructure or where the "tribute" function has faded.
  *   **Supported by:** Precedent 2 (Street kept with marker), Precedent 5 (Neighborhood kept as name no longer functions as tribute), Precedent 6 (Mural kept as historical document).
  *   **Implication for New Case:** The school should keep the name. The alumni (integrators) have reclaimed the name to signify the school's survival and integration, not the honoree's ideology. The scholarship fund provides tangible benefit to current students, reinforcing the name's current utility.

  ### II. Recommendation

  **The Commission should recommend renaming the high school.**

  **Reasoning:**
  While Principle B offers a compassionate path regarding the alumni, **Principle A** is the dominant thread in the Commission's treatment of *active public institutions* involving *civil rights violations*.

  1.  **Institution vs. Geography:** Precedents supporting retention (2, 5, 6) involve passive infrastructure (a street, a neighborhood) or historical art (a mural). Precedents supporting removal (1, 3, 4) involve active institutions of public trust (a school, a clinic, a monument). A high school is an active site of civic formation; its name is an ongoing endorsement.
  2.  **Intent vs. Reclamation:** In Precedent 5 (Neighborhood), the Commission ruled that the name *no longer functions* as a tribute. However, in Precedent 3 (High School), the Commission ruled that alumni attachment does not sanitize a segregationist name. The alumni's reclamation here is organic, not official. Without an official re-dedication by the School Board at the time of integration, the name remains legally and historically tied to the 1955 intent.
  3.  **Financial Coercion:** The restricted scholarship fund presents a "poison pill." In Precedent 3, the Commission prioritized historical integrity over alumni objections. Financial coercion from a private donor should not hold greater weight than the objections of alumni. The City should seek to indemnify the scholarship through alternative funding, but not allow the family to veto the Commission's moral judgment.

  ### III. Analog Analysis

  **Closest Analog: Precedent 3 (Segregationist Governor High School)**
  *   **Why:** Both cases involve public high schools named for figures defined by their opposition to racial equality. In both cases, there is an alumni constituency attached to the name.
  *   **Distinction:** In Precedent 3, alumni *opposed* renaming; here, they *support* retention. However, the Commission's decision in Precedent 3 established that the *nature of the honoree* outweighs alumni sentiment in a school setting. To decide otherwise here would implicitly overrule Precedent 3.

  **Weaker Analogs:**
  *   **Precedent 5 (Neighborhood):** This is the strongest argument for the petitioners (that the name now means the community, not the man). However, it is weaker because geographic names are descriptive, whereas school names are honorific. A neighborhood name drifts semantically; a school name is a plaque on a building.
  *   **Precedent 6 (Post Office Mural):** Petitioners might argue the name is now "historical." However, Precedent 6 relied on the art being a "document" of an era commissioned by a public arts program. A school name is not a document; it is a current designation of identity.

  ### IV. Commitments and Retrospective Impact

  **If the Commission Recommends Renaming:**
  *   **Commitment:** You commit to the view that original intent regarding civil rights violations cannot be cured by organic community reclamation in active institutions.
  *   **Retrospective Impact:** This **vindicates Precedent 3**. It confirms that the 1978 decision was correct regardless of alumni feelings. It creates a slight tension with Precedent 5 (Neighborhood), requiring the Commission to maintain a clear distinction between "geographic descriptor" and "institutional honorific."

  **If the Commission Recommends Retention:**
  *   **Commitment:** You commit to the view that current community meaning supersedes original intent, even regarding segregationist symbols.
  *   **Retrospective Impact:** This **calls Precedent 3 into question**. If the alumni of the 1978 school had argued then that the name "now meant the school," would the Commission have ruled differently? It risks inconsistency: why was the Governor's name removed from a school, but the Board President's name kept on a school? It elevates Precedent 5 (Neighborhood) to a standard that may undermine Precedent 1 and 4.

  ### V. The Clean Separator

  To cleanly separate Principle A (Intent) from Principle B (Evolution), the Commission should consider the following hypothetical fact:

  **The Fact:** *Did the School Board officially re-dedicate the school during the integration era?*

  *   **Variant 1:** If, in 1965, the School Board passed a resolution stating, *"We retain this building's name not to honor [Honoree], but to commemorate the students who integrated it,"* then **Principle B** prevails. The name has been officially repurposed, aligning with Precedent 5 (name no longer functions as a tribute to the man).
  *   **Variant 2:** If, as currently stands, the name remained unchanged by official act and the "reclamation" is solely the organic sentiment of alumni, then **Principle A** prevails. The legal and historical record still identifies the name as a tribute to the segregationist, aligning with Precedent 3.

  **Conclusion:**
  Without an official act of re-dedication, the "reclamation" is informal. Consistency with Precedent 3 demands that the Commission prioritize the moral integrity of the institution over informal sentiment or financial leverage. We recommend renaming the school and urging the City Council to appropriate funds to replace the lost scholarships.
