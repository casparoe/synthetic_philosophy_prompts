answer: |-
  # Activity Design: The Archipelago Standoff

  ## 1. Instructor's Hidden Structure (Do Not Distribute)

  **The Truth (Data Generating Process):**
  *   **Outcome ($Y$):** *Prosperity Index* (0–100).
  *   **Team 1 Variable ($X_1$):** *Administrative Capacity* (Institutions). **This is the true cause.** ($Y \approx 10 \cdot X_1 + \text{noise}$).
  *   **Team 2 Variable ($X_2$):** *Harbor Accessibility* (Geography). **This is confounded.** A hidden variable *Colonial Investment ($U$)* caused both better harbors (dredging) and higher prosperity. Harbor depth itself does not cause current prosperity. ($X_2 \approx X_1 + \text{noise}$).
  *   **Team 3 Variable ($X_3$):** *Civic Participation Rate* (Culture). **This is reverse causality.** Prosperity allows citizens time/resources to participate. ($X_3 \approx Y/10 + \text{noise}$).
  *   **The Trap:** In this specific sample of 10 islands, $X_1$, $X_2$, and $X_3$ are correlated with each other at $r > 0.95$. Controlling for one variable statistically eliminates the others only if you assume a specific causal order, which is exactly what is in dispute. With $N=10$, partial correlations are statistically insignificant regardless of the model.

  **The Data (10 Islands: A–J):**

  | Island | Prosperity ($Y$) | Team 1: Admin ($X_1$) | Team 2: Harbor ($X_2$) | Team 3: Civic ($X_3$) |
  | :--- | :--- | :--- | :--- | :--- |
  | **A** | 12 | 1.0 | 1.0 | 1.1 |
  | **B** | 18 | 1.8 | 2.0 | 1.9 |
  | **C** | 25 | 2.5 | 2.5 | 2.4 |
  | **D** | 31 | 3.0 | 3.2 | 3.2 |
  | **E** | 40 | 4.1 | 4.0 | 3.9 |
  | **F** | 49 | 5.0 | 5.1 | 5.2 |
  | **G** | 58 | 5.8 | 5.9 | 5.7 |
  | **H** | 67 | 6.7 | 6.5 | 6.8 |
  | **I** | 79 | 8.0 | 7.8 | 7.9 |
  | **J** | 88 | 9.0 | 9.0 | 9.0 |

  *Note: Correlations ($r$) for all pairs ($X_1, X_2, X_3$ with $Y$) are $> 0.98$.*

  ---

  ## 2. Materials to Prepare

  1.  **Three Data Booklets (Red, Blue, Green):**
      *   Each booklet contains the **Island Names (A–J)**, the **Prosperity Column ($Y$)**, and **only one** $X$ column.
      *   **Red (Team 1):** $Y$ + Admin Capacity ($X_1$). *Label: "Governance Metrics."*
      *   **Blue (Team 2):** $Y$ + Harbor Depth ($X_2$). *Label: "Geographic Endowments."*
      *   **Green (Team 3):** $Y$ + Civic Participation ($X_3$). *Label: "Social Norms."*
      *   *Instruction Page:* "Your goal is to demonstrate that your variable is a primary driver of Prosperity. You may not share your $X$ column with other teams."

  2.  **Referee Panel Packet:**
      *   Contains the full dataset (all columns).
      *   **Scoring Rubric:**
          *   **Initial Claim:** +10 points for a specific causal statement (e.g., "Increasing X by 1 unit increases Y by 10").
          *   **Defense:** +5 points for surviving a cross-examination round without modifying the claim.
          *   **Withdrawal:** -10 points if a team withdraws a claim after challenge.
          *   **Referee Goal:** Maximize total points awarded (incentivizes keeping the game going) BUT must flag "Identification Failures" (see Rules).

  3.  **Historian Cards (2 Cards):**
      *   **Historian 1 (Island C):** "Archives show Island C had a benevolent dictator in 1950 who built schools (Admin) but the harbor silted up (Geo). Prosperity remained stable."
      *   **Historian 2 (Island H):** "Island H had a cultural revival (Civic) in 1980 *after* a mineral discovery boosted GDP (Prosperity). Locals say the wealth made them generous, not vice versa."
      *   *Instruction:* "Read your card only when called upon by the Referees. Do not offer opinions on the other teams."

  4.  **Whiteboard/Projector:** For tracking scores and final claims.

  ---

  ## 3. Roles and Assignment (16 Students)

  *   **Research Teams (12 students):** Divide into three groups of 4.
      *   Team Red (Governance)
      *   Team Blue (Geography)
      *   Team Green (Social Norms)
  *   **Referee Panel (3 students):** Tasked with evaluating causal validity.
  *   **Regional Historians (2 students):** Tasked with providing qualitative context.
  *   **Moderator (You):** Keep time, enforce data silos.

  *Assignment Tip:* Hand out the Data Booklets face down. Tell them not to open until the timer starts. This prevents early data comparison.

  ---

  ## 4. Rules and Payoff Scheme

  **The Objective:**
  Submit a **Final Causal Claim** that links your variable to Prosperity. The claim must include:
  1.  **Direction:** (e.g., $X \to Y$).
  2.  **Magnitude:** (e.g., "1 unit increase in X yields 10 units of Y").
  3.  **Policy:** (e.g., "Invest in X to grow Y").

  **The Constraints:**
  1.  **Data Silo:** You may not show your $X$ column to other teams. You may only discuss the common $Y$ column.
  2.  **No New Data:** You cannot invent new variables.
  3.  **Falsifiability:** Your claim must be something that *could* be proven wrong by the data provided.

  **The Scoring (Written on Board):**
  *   **Bold Claim Submitted:** +10 pts.
  *   **Claim Survives Cross-Ex:** +5 pts.
  *   **Claim Withdrawn/Modified:** -10 pts.
  *   **Referee Bonus:** Referees get +5 pts for every "Identification Failure" they correctly identify (see Debrief).

  **Identification Failure Definition (For Referees):**
  "A claim is an Identification Failure if the correlation could equally be explained by Reverse Causality or a Third Factor, given the available data."

  ---

  ## 5. Minute-by-Minute Timeline (90 Minutes)

  **00:00 – 00:10: Setup & Briefing**
  *   Distribute roles and booklets.
  *   Explain the Archipelago context (shared history, currency, census).
  *   **Crucial:** Do not use words like "Institutions," "Geography," or "Culture." Use the packet labels ("Governance," "Endowments," "Norms").
  *   Start timer.

  **00:10 – 00:25: Team Analysis (Silent Work)**
  *   Teams calculate correlation ($r$) and slope ($\beta$) by hand or spreadsheet.
  *   Teams draft their Initial Causal Claim.
  *   *Instructor Role:* Circulate. If a team asks "Can we ask Team Blue for their numbers?" answer "No, that violates the silo."

  **00:25 – 00:55: The Conference (Presentations & Challenges)**
  *   **Round 1 (25-40):** Each team presents their Claim (3 mins each). Referees ask clarifying questions.
  *   **Round 2 (40-55):** Cross-Examination. Teams challenge each other.
      *   *Prompt for Teams:* "Ask the other teams why their correlation isn't spurious."
      *   *Prompt for Historians:* Referees may call one Historian to testify. (Historians read cards).
      *   *Tension Point:* Teams will realize the Historian data is anecdotal and doesn't solve the $N=10$ problem.

  **00:55 – 01:10: Referee Deliberation & Scoring**
  *   Referees retreat (or huddle). They must decide which claims survive.
  *   *Expected Outcome:* Referees will struggle. All correlations are equal. All stories are plausible.
  *   Teams can modify claims during this time (penalty applies).
  *   Referees announce scores and which claims stand.

  **01:10 – 01:20: Final Claims & The Standoff**
  *   Teams post their Final Claim on the board.
  *   Likely result: All three claim causality. Referees likely declare a "Standoff" or award points to all but flag Identification Failures.
  *   Instructor freezes the room. "Do not pack up. The debate is not over."

  **01:20 – 01:30: The Debrief (The Reveal)**
  *   Reveal the Hidden Structure (Section 1).
  *   Map the epistemic failure.
  *   Discuss the way out (Instrumental Variables, etc.).

  ---

  ## 6. The Debrief Script (Critical Component)

  **Step 1: The Reveal (5 mins)**
  *   Project the Full Data Table with the True Model labels.
  *   "Team Red (Admin) was the Cause. Team Blue (Harbor) was Confounded. Team Green (Civic) was Reverse Causality."
  *   Ask: "Who knew this for sure during the exercise?" (No hands should go up).
  *   Ask: "Who suspected their own variable might *not* be the cause?" (Some hands).
  *   Ask: "Why couldn't you prove it?"

  **Step 2: Mapping the Vertigo (3 mins)**
  *   "Point to the minute your confidence became unearned."
  *   *Likely Answer:* Minute 25, when they calculated $r > 0.9$.
  *   Explain: "You treated a structural correlation as a causal identification. This is the 'Spectator Sport' error. You thought the problem was calculating the number, not the number's provenance."
  *   Highlight the Historians: "The qualitative data added flavor but no leverage. This mirrors the 'Case Study vs. Large-N' debate. Neither solved the identification problem."

  **Step 3: The Way Out (2 mins)**
  *   "Is this question undecidable? No. But it is undecidable *with this data*."
  *   Introduce the tools the field actually uses:
      *   **Instrumental Variables (IV):** "What if we found a variable that affected Admin Capacity but *not* Prosperity directly? (e.g., Colonial Settler Mortality)."
      *   **Regression Discontinuity (RDD):** "What if there was a colonial rule that gave Admin support only to islands North of latitude 10°?"
      *   **Natural Experiments:** "What if a hurricane destroyed the Harbor on Island F but not Island G?"
  *   **Key Takeaway:** "Causal inference from observational data is not about better regression; it is about better *design*. If you cannot find a source of exogenous variation, you must remain agnostic."

  ---

  ## 7. Predictable Failure Modes & Mitigation

  **Failure Mode 1: The Merger (Teams share data)**
  *   *Risk:* Teams realize they can solve the puzzle if they pool $X_1, X_2, X_3$ into one regression.
  *   *Mitigation:* The Rule "Data Silo" must be enforced strictly. If they merge data, they are disqualified from the "Bold Claim" points.
  *   *Teaching Moment:* Even if they merge data, with $N=10$ and $r > 0.95$ between predictors, they will hit **Perfect Multicollinearity**. The regression will fail or standard errors will explode. Point this out in debrief: "More variables didn't help; the variance was shared."

  **Failure Mode 2: The Prosecutor (Referees try to solve it)**
  *   *Risk:* Referees try to determine the "Truth" rather than judge the "Claim."
  *   *Mitigation:* Give Referees the "Identification Failure" rubric. Their job is not to find the winner, but to find the *flaw*. If they declare a winner, ask them in debrief: "On what statistical basis did you rule out reverse causality?" They won't have one.
  *   *Teaching Moment:* This mirrors peer review. Reviewers often reject papers not because the finding is false, but because the identification is weak.

  **Failure Mode 3: The Historian Spoiler**
  *   *Risk:* Historians say "Actually, I know the truth."
  *   *Mitigation:* Script the cards (Section 2) carefully. They must describe *events*, not *causal structures*. Island C had a dictator (event); did the dictator cause wealth or did wealth attract the dictator? Ambiguity is key.

  ---

  ## 8. Limitations: What This Activity Cannot Reproduce

  **The Missing Piece: Exogenous Variation**
  *   **Limitation:** This simulation is purely observational. It cannot simulate the *feeling* of finding a valid Instrument or a Natural Experiment.
  *   **Risk:** Students may leave thinking "All causal inference is impossible/subjective."
  *   **Correction:** In the final 5 minutes of debrief, you must explicitly pivot.
      *   *Say:* "This activity simulated the *baseline* problem of observational data. It was designed to be a standoff. But in the real literature (Acemoglu, Robinson, Diamond, etc.), scholars do not stay here. They hunt for 'Golden Moments' where history randomizes the treatment."
      *   *Example:* "Think of the Korean DMZ. Same geography, same culture, different institutions. That is the data we wish we had for the Archipelago. Since we don't have it, we must admit uncertainty."
      *   *Goal:* Distinguish between **Data Poverty** (this simulation) and **Design Ingenuity** (real research).

  **The Sample Size Issue**
  *   **Limitation:** $N=10$ is smaller than real cross-national studies ($N \approx 150$).
  *   **Correction:** Acknowledge this. "With $N=150$, you might get enough variation to separate these variables. But in many historical sub-fields (e.g., pre-modern states), $N=10$ is realistic. The structural problem remains even at $N=100$ if the variables are theoretically collinear."

  ---

  ## 9. Instructor Checklist for Run Day

  *   [ ] Print 3 sets of Data Booklets (Red, Blue, Green).
  *   [ ] Print 1 Referee Packet (Full Data + Rubric).
  *   [ ] Print 2 Historian Cards.
  *   [ ] Whiteboard markers (Red, Blue, Green).
  *   [ ] Timer visible to all.
  *   [ ] **Mental Prep:** Be ready to shut down data sharing firmly. "That violates the protocol. Please return to your table."
  *   [ ] **Mental Prep:** Be ready to sit with the silence in the debrief. When you reveal the truth, there will be a moment of discomfort. Let it hang. That is the learning moment.
