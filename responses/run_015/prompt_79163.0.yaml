  2.  **Deconstruct the Causal Structure (The "Hidden Truth"):**
      *   I need 10 islands ($N=10$).
      *   Outcome variable: Prosperity ($Y$).
      *   Team 1 (Institutions): Variable $X_1$.
      *   Team 2 (Geography): Variable $X_2$.
      *   Team 3 (Culture): Variable $X_3$.
      *   Unobserved Confounder: $U$ (e.g., "Early Colonial Investment" or "Soil Nutrient Density" - let's go with something abstract like "Founding Capital Endowment").
      *   *Requirement:* All $X$ correlate with $Y$.
      *   *Requirement:* One is Cause ($X \to Y$), one is Effect ($Y \to X$), one is Proxy ($X \leftrightarrow U \leftrightarrow Y$).
      *   *Requirement:* No observational tie-breaker (i.e., conditioning on one doesn't kill the correlation of the others because of the small $N$ and specific structure, or simply because they are collinear in this specific sample).
      *   *Decision:*
          *   True Cause: Institutions ($X_1 \to Y$).
          *   Reverse Causality: Culture ($Y \to X_3$). (Prosperity allows for cultural preservation/elaboration).
          *   Confounded Proxy: Geography ($X_2 \leftrightarrow U \leftrightarrow Y$). (e.g., Distance from mainland affects both Founding Capital and current Prosperity, but Distance doesn't *cause* Prosperity directly in this model, it selects who settled there).
          *   *Wait, simpler is better for hand calculation.* Let's make them highly collinear.
          *   Revised Structure:
              *   $U$ (Unobserved: Colonial Favoritism) causes $X_1$ (Institutions) and $Y$ (Prosperity).
              *   $X_1$ (Institutions) causes $Y$ (Prosperity). (So $X_1$ is a mix of cause and proxy? No, let's keep it distinct).
              *   Let's try:
                  *   $X_1$ (Institutions): Direct Cause ($X_1 \to Y$).
                  *   $X_2$ (Geography): Confounded ($U \to X_2$ and $U \to Y$). $X_2$ does not cause $Y$.
                  *   $X_3$ (Culture): Reverse Causality ($Y \to X_3$).
              *   To make them indistinguishable observationally in $N=10$, $X_1, X_2, X_3$ must be highly correlated with each other.
              *   Let $Y = X_1 + \epsilon$.
              *   Let $X_2 = X_1 + \text{noise}$.
              *   Let $X_3 = Y + \text{noise}$.
              *   This ensures $Corr(X_1, Y)$, $Corr(X_2, Y)$, and $Corr(X_3, Y)$ are all high.
              *   Since $N=10$, partial correlations will be unstable/noisy, allowing teams to claim significance.

  3.  **Design the Data (The "Archipelago"):**
      *   Islands: A-J.
      *   Prosperity ($Y$): GDP per capita index (0-100).
      *   Team 1 (Institutions): "Property Rights Index" ($X_1$). Range 0-10.
      *   Team 2 (Geography): "Harbor Depth/Access" ($X_2$). Range 0-10.
      *   Team 3 (Culture): "Civic Trust Score" ($X_3$). Range 0-10.
      *   *Hidden Logic:*
          *   $Y \approx 10 \cdot X_1$.
          *   $X_2 \approx X_1$ (Geography attracted good institutions historically, but doesn't cause current wealth directly).
          *   $X_3 \approx Y/10$ (Wealth creates trust, not vice versa).
      *   I need to generate 10 rows where the correlations are $> 0.8$ for all pairs, but the causal story differs.
      *   *Refinement:* To ensure the "standoff," the Referee Panel needs to see that controlling for any one variable doesn't clearly eliminate the others due to multicollinearity in small $N$.

  4.  **Roles & Assignment:**
      *   16 Students.
      *   Team 1 (Institutions): 4 students.
      *   Team 2 (Geography): 4 students.
      *   Team 3 (Culture): 4 students.
      *   Referee Panel: 3 students.
      *   Historians: 1 student each (2 total). *Correction:* Prompt says "one or two individuals playing regional historians." Let's make it 2 individuals, each knowing the "truth" about 1 specific island (anomalies).
      *   Wait, if Historians know the truth, they spoil the game. They should know *contextual* details that suggest complexity but don't solve the identification problem. E.g., "Island C had a fire," "Island F had a unique leader." This adds noise, not clarity.
      *   Actually, better: Historians have "qualitative" data that *seems* to support one side but is anecdotal. This mimics the "case study vs. large N" tension.

  5.  **Rules & Payoff:**
      *   Goal: Submit a causal claim ($X \to Y$).
      *   Payoff: Points for claims that survive challenges. Penalty for withdrawn claims.
      *   Mechanism: Teams present. Referees challenge. Historians provide "context."
      *   Constraint: Teams cannot share raw data until the very end (if at all). They only see their own column + the Outcome ($Y$).
      *   *Crucial:* They must propose a *policy*. "Improve Institutions" vs "Build Harbors" vs "Change Culture."

  6.  **Timeline (90 Minutes):**
      *   0-10: Intro & Role Assignment.
      *   10-25: Team Analysis (calculate correlations, draft claims).
      *   25-55: The Conference (Presentations & Cross-Examination).
      *   55-70: Referee Deliberation & Historian Testimony.
      *   70-80: Final Claims & Scoring.
      *   80-90: Debrief (The Reveal).

  7.  **Debrief Strategy:**
      *   Reveal the Data Generating Process (DGP).
      *   Map moments of "false confidence."
      *   Discuss solutions (IV, Natural Experiments) – *This addresses the "what the field actually has" requirement.*
      *   Address limitations (this sim is observational only; real world has IVs).

  8.  **Failure Modes:**
      *   *Merging Data:* Students might ask to swap sheets. *Fix:* Rule explicitly forbids sharing raw $X$ variables, only $Y$ is common knowledge.
      *   *Referees as Prosecutors:* They might try to solve it rather than judge. *Fix:* Give them a rubric focused on *identification strategy*, not truth.
      *   *Historians Spoiling:* They might say "Actually, Geography didn't matter." *Fix:* Script their cards carefully.

  9.  **Drafting the Content:**
      *   *Data Generation:* I need to create the specific numbers now.
      *   Island 1-10.
      *   $Y$ (Prosperity): 20, 25, 30, 35, 40, 50, 60, 70, 80, 90.
      *   $X_1$ (Inst): 2, 2.5, 3, 3.5, 4, 5, 6, 7, 8, 9. (Perfect correlation basically).
      *   $X_2$ (Geo): 2, 3, 3, 4, 4, 5, 6, 7, 8, 8. (Highly correlated, but slight noise).
      *   $X_3$ (Cult): 2, 2.5, 3, 3.5, 4, 5, 6, 7, 8, 9. (Same as Inst).
      *   *Wait, if $X_1$ and $X_3$ are identical, it's too obvious.*
      *   Let's add noise.
      *   $Y$: 10, 15, 20, 30, 35, 45, 55, 65, 75, 85.
      *   $X_1$ (Cause): 1, 1.5, 2, 3, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5.
      *   $X_2$ (Confounder): 1, 2, 2, 3, 3, 4, 5, 6, 7, 8. (Correlates with Y because U causes both).
      *   $X_3$ (Effect): 1, 1.5, 2, 3, 3.5, 4.5, 5.5, 6.5, 7.5, 8.5 + small noise based on Y.
      *   *Actually, for the students to feel the pain, the correlations need to be robust.*
      *   Let's create the specific table in the output.

  10. **Refining the "Structural" Lesson:**
      *   The key insight is *Observational Equivalence*.
      *   The debrief must emphasize that *within this dataset*, the truth is unknowable.
      *   The "way out" is not better statistics, but different *design* (IV, RDD, etc.).

  11. **Addressing Specific Prompt Requirements:**
      *   "No standard labels until debrief." (Call them Team Alpha, Beta, Gamma or Red, Blue, Green).
      *   "Point scheme... rewards claims surviving... penalizes withdrawn."
      *   "Predictably go wrong... merging data... referee as prosecutor."
      *   "What the activity cannot reproduce" (Natural experiments).

  12. **Final Polish:**
      *   Ensure tone is appropriate for grad students (serious, rigorous).
      *   Check timing (90 mins is tight).
      *   Make sure the Historian role is useful but not decisive.

  *(Self-Correction during drafting)*: I need to make sure the Referee Panel doesn't just say "Everyone wins." They need a rubric that forces them to look for *identification*. Since there is no identification, they should ideally declare a standoff. But the game mechanics want claims. I will structure the payoff so that *hedged* claims get fewer points than *bold* claims, but *bold* claims get penalized if successfully attacked. This creates the tension.

  Actually, better: The Referees award points based on "Plausibility given available data." Since all are plausible, all get points initially. But during cross-ex, if a team withdraws, they lose points. This incentivizes sticking to a claim until the bitter end, mimicking academic stubbornness.

  Let's finalize the Data Generating Process (DGP) for the Instructor's Eyes Only.
  *   True Model: Prosperity ($Y$) is caused by Institutions ($X_1$).
  *   Geography ($X_2$): Correlated with $Y$ because a third factor (Colonial Investment $U$) targeted geographically accessible islands *and* made them rich. $X_2$ does not cause $Y$.
  *   Culture ($X_3$): Caused by $Y$. Rich islands develop high-trust cultures.
  *   Observed Data: All three $X$'s correlate with $Y$ at $r > 0.9$.
