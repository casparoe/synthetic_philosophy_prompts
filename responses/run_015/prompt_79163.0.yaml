      *   **Problem:** Students treat the "Institutions vs. Geography vs. Culture" debate as a spectator sport (lack of cleverness) rather than a structural evidentiary problem.
      *   **Desired Outcome:** Students experience the *structural* standoff where correlations exist but causal direction/identity is indistinguishable given the available data. They should realize "more of the same data" won't help.
      *   **Setup:** Fictional archipelago (10 islands), shared history/census/currency.
      *   **Roles:** 3 Research Teams (Institutions, Geography, Culture), 1 Referee/Replication Panel, 2 Regional Historians (archival info on single islands). Total 16 students.
      *   **Data Structure:** All three variable families correlate with prosperity. One is upstream (cause), one is downstream (effect), one is a proxy for an unobserved confounder. No observational data can break the tie.
      *   **Constraints:** No internet, simple numbers (hand/spreadsheet), no real money, no standard labels until debrief.
