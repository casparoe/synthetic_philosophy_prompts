answer: |-
  You are not missing a word because you haven't read the right book; you are missing a word because there isn't a settled, canonical term for this specific configuration in the philosophy of science literature. You have identified a genuine methodological tension that is currently live, contested, and arguably unique to this era of high-energy physics and cosmology.

  Your statistical intuition is correct, and your unease is shared by a significant faction of philosophers and physicists. The structure you describe—where flexibility is the engine of explanation, the shield against falsification, and the sink for error, all declared in advance—does not fit neatly into the standard taxonomy of *ad hoc* hypotheses or Lakatosian protective belts.

  Here is the breakdown of the terminology, the Bayesian mechanics, the distinction between your two examples, and the boundary conditions you asked for.

  ### 1. Is there a name for this?

  There is no single settled term. However, there are three clusters of concepts that orbit this phenomenon. None fits perfectly, which is why you feel the gap.

  *   **Lakatosian "Protective Belt" (Close, but distinct):** Imre Lakatos described how research programmes protect a "hard core" of assumptions by adjusting a "protective belt" of auxiliary hypotheses.
      *   *Why it doesn't fit:* In Lakatos's view, the belt is auxiliary. In the cases you describe (especially the String Landscape), the flexibility *is* the core ontology. The "multiverse" isn't an auxiliary assumption added to save the theory; it is the theory's primary claim about reality. Furthermore, Lakatos distinguishes between "progressive" (predicting novel facts) and "degenerating" (accommodating known facts) shifts. Your puzzle is that this move claims to be *predictive* (the cosmological constant) while possessing the logical structure of *accommodation*.
  *   **"Ad Hoc" Hypothesis (Incorrect):** In philosophy of science, *ad hoc* usually implies a modification made *after* a failure to save a theory, with no independent testability.
      *   *Why it doesn't fit:* As you noted, this flexibility was advertised *in advance*. It is structural, not reactive.
  *   **"Non-Empirical Confirmation" (The contemporary defence):** Philosopher Richard Dawid has formalized the argument used by proponents of String Theory/Multiverse. He argues that in the absence of empirical data, we confirm theories via meta-inductive arguments (e.g., "No Alternatives," "Unexpected Explanatory Coherence").
      *   *Why it doesn't fit:* This is the *justification* for the move, not a name for the structural configuration itself.

  **Proposed Descriptive Label:**
  If you need a term for your reading group, I suggest **"Pre-Registered Underdetermination"** or **"Structural Immunity."**
  *   *Pre-Registered:* Because the flexibility is declared before the data arrives (unlike *ad hoc*).
  *   *Underdetermination:* Because the theory does not determine the observable quantity.
  *   *Structural Immunity:* Because the immunity from falsification is a feature of the theory's structure, not a bug added later.

  ### 2. The Bayesian Tension: You vs. Your Statistician Friend

  Your friend is invoking the **Bayesian Occam's Razor**. In standard model selection, a model $M$ that spreads its probability mass over a huge space of outcomes $Q$ is penalized. If $P(Q|M)$ is flat over $10^{500}$ values, the likelihood of observing our specific $Q_{obs}$ is tiny ($10^{-500}$).

  **Where your friend is right:** Mathematically, a theory that predicts "anything is possible" should receive a vanishingly small likelihood update when "something" is observed.

  **Where you are right (and why the penalty isn't paid):**
  In these cosmological arguments, the likelihood calculation is modified. It is not $P(Q_{obs} | \text{Theory})$. It is:
  $$P(Q_{obs} | \text{Theory} + \text{Anthropic Selection} + \text{Measure})$$
  By conditioning on "Anthropic Selection," the probability mass is renormalized over only the life-permitting subset. If the life-permitting range is small, the conditional probability can be high.

  **The Trick:** The "cost" of this flexibility is not paid in the Likelihood (as your friend expects); it is shifted to the **Prior** probability of the Theory itself, $P(\text{Theory})$.
  Proponents argue $P(\text{Theory})$ should be high because of "No Alternatives" or mathematical elegance. Critics (you) argue that a theory which structurally guarantees it cannot be wrong should have a vanishingly low Prior.
  **Verdict:** This is **live controversy**. There is no settled rule for how to penalize a theory for "Ontological Bloat" in the Prior. Your intuition that "spread should be a debit" is the standard scientific heuristic; the counter-argument is that in fundamental physics, we lack the reference class to set that penalty.

  ### 3. Distinguishing Your Two Examples

  You suspect the String Landscape and SUSY cases are the "same shape." Methodologically, they are distinct. Conflating them weakens the critique.

  **Case A: The String Landscape / Cosmological Constant**
  *   **Type:** Ontological Multiplicity.
  *   **Mechanism:** The theory posits $10^{500}$ actualized vacua. We exist in one.
  *   **Status of Flexibility:** The theory *cannot* predict a single value by construction.
  *   **The "Success":** Predicting the *order of magnitude* of $\Lambda$ via anthropic bounds (Weinberg 1987).
  *   **Philosophical Category:** This is **Inference to the Best Explanation (IBE)** within a multiverse ontology. The "slack" is the existence of other universes.

  **Case B: Supersymmetry (SUSY) / TeV Scale**
  *   **Type:** Parametric Freedom + Heuristic Expectation.
  *   **Mechanism:** SUSY allows a wide range of breaking scales. However, the "Naturalness" heuristic suggested the scale should be $\sim 1$ TeV.
  *   **Status of Flexibility:** The theory *could* have predicted a single value if paired with Naturalness. When LHC found nothing, Naturalness was relaxed, not SUSY.
  *   **Philosophical Category:** This is closer to a **Lakatosian Protective Belt**. "Naturalness" was the auxiliary assumption. When it failed, it was adjusted.
  *   **Difference:** In Case A, the theory says "I cannot predict Q." In Case B, the community said "We expect Q at X," and when Q wasn't at X, they said "We still expect Q, just not at X." Case B is more vulnerable to the charge of moving goalposts than Case A.

  ### 4. Boundary Conditions: Honest Parameters vs. Structural Slack

  You asked where the line is between this and the ordinary use of free parameters (like the mass of the electron in the Standard Model).

  **The Line is "Predictive Density."**
  *   **Honest Parameter:** A theory has a parameter $\alpha$. To fit $\alpha$, you need *one* measurement. Once fixed, the theory makes $N$ other sharp predictions. The "slack" is localized.
  *   **Structural Slack (Your Puzzle):** The theory has a mechanism that generates a distribution for $\alpha$. To test the theory, you need to know the *Measure* over the distribution. If the Measure is unknown (or adjustable), the theory can accommodate *any* value of $\alpha$ without changing the core framework.

  **The Test:**
  To determine if a case is "Honest" or "Structurally Immune," ask:
  1.  **Independent Constraint:** Can the Measure (or the specific realization) be constrained by data *other* than the quantity being explained? (e.g., Can we observe other universes? Can we constrain SUSY breaking via dark matter detection?)
  2.  **Probability Mass:** Does the theory concentrate probability mass in a small region (sharp prediction), or is the mass diffuse (accommodation)?
  3.  **Cost of Failure:** If the observed value falls outside the "likely" region of the Measure, is the Framework falsified, or is the Measure revised? In the cases you cite, the Measure is revised. In honest science, the Framework is usually falsified.

  ### 5. Settled vs. Contested

  Since your group tends toward dogmatism, here is the map of the current landscape:

  **Settled (among philosophers of physics):**
  *   This methodology violates **Naive Falsificationism** (Popper). It is not "pseudoscience" by definition, but it operates outside the falsificationist demarcation criterion.
  *   It violates standard **Bayesian Model Selection** unless one accepts non-empirical priors.
  *   The "prediction" of the Cosmological Constant is technically an **accommodation** of the known range of life-permitting values, retrofitted to look like a prediction of the observed value. (Whether this counts as a success is debated, but the logical structure is accommodation).

  **Live Controversy:**
  *   **Legitimacy:** Is "Non-Empirical Confirmation" (Dawid) valid science?
      *   *Yes:* Carroll, Dawid, Witten. Argument: We are in a regime where experiment is impossible; we must rely on theoretical consistency.
      *   *No:* Ellis, Silk, Smolin. Argument: Without empirical risk, it is mathematics or theology, not physics.
  *   **The Measure Problem:** Is the inability to define a unique measure over the landscape a technical hurdle (will be solved) or a fundamental flaw (theory is ill-defined)?
      *   *Consensus:* Leaning towards fundamental flaw, but not fatal to the programme yet.
  *   **Your Specific Diagnosis:** Is the "slack" doing double duty (Engine + Shield)?
      *   *Contested:* Proponents say the slack is only an Engine (it explains fine-tuning) and the Shield is an unfortunate side effect. Critics (you) say the Shield is the primary utility. There is no empirical way to settle this; it is a sociological assessment of the field's incentives.

  ### Summary for your Group

  You can tell your group:
  1.  There is no single word, but **"Pre-Registered Underdetermination"** captures the structure.
  2.  It is **not** the same as standard free parameters because the uncertainty is ontological (about the world), not epistemic (about our knowledge).
  3.  It is **not** strictly Lakatosian because the flexibility is the core, not the belt.
  4.  Your statistical intuition is correct: standard Bayesian reasoning *should* penalize this. The fact that it doesn't in practice relies on **Non-Empirical Priors**, which is the most contested topic in modern philosophy of physics.
  5.  The String Landscape case (Ontological) and the SUSY case (Parametric) are methodologically distinct, though they share the same "immunological" effect.

  You are not being naive; you are identifying a shift in the epistemic norms of the field. Whether that shift is necessary (due to the difficulty of experiments) or degenerative (due to lack of accountability) is the actual debate.
