answer: |-
  **Opening Remarks: "Sorting People"**
  **Time:** Approx. 5 minutes
  **Tone:** Casual, American English, bridge-building

  Hey everyone. Thanks for coming.

  Looking around this room, we've got a bit of a split. Half of you hold degrees in medicine or psychology. The other half of us hold degrees in computer science, or maybe just a lot of stack overflow tabs. One group diagnoses mental health conditions; the other group builds the apps where people tell us they have them.

  We're here to talk about "Sorting People." And I want to start with a warning label.

  There's a philosopher named Ian Hacking. You don't need to know his bibliography, just one idea he had called "Looping Effects."

  Here's the basic version: When you classify a rock, the rock doesn't care. It stays a rock. But when you classify a person, the person finds out. And knowing they've been classified changes how they act, which changes what the classification actually means.

  In the clinic, this loop is slow. A clinician diagnoses a patient. The patient lives with that diagnosis. Over decades, the medical community might update the DSM because they see patients behaving in ways the old definition didn't capture. The loop closes, but it takes years.

  In our apps, that loop is happening in real-time. And that's the twist I want us to sit with today.

  In the mental health apps we build, the loop isn't Clinician-to-Patient. It's User-to-Algorithm.

  Here's the flow: A user opens the app. They are presented with a menu of labels—"Anxiety," "ADHD," "Burnout." They pick one. Maybe they self-select because it resonates. Maybe they pick it because the UI made it the easiest button to click.

  Immediately, that choice becomes training data. The model updates. It says, "Okay, this person is an 'ADHD person.'" So, what does the app do? It feeds them content about ADHD. It suggests communities for ADHD. It reinforces coping mechanisms specific to that label.

  The user consumes that content. It shapes how they understand their own brain. They start to notice symptoms they missed before, or they start to perform the identity because the app rewards that engagement. They come back to the app, engaging more deeply with that label. The model doubles down.

  This is a feedback loop. But it's not neutral.

  I need to say this clearly to my fellow devs: We cannot treat these labels as neutral tags. They aren't just metadata like "genre: rock" or "color: blue." They are active ingredients. When we put a label on a user, we are not just describing them; we are participating in making them that thing.

  But I also need to say this to the clinicians and researchers here: We cannot assume the user is fully autonomous in picking that label.

  We like to think of the user as a sovereign consumer making a free choice. But the choice is constrained by our design. The labels we offer, the order they appear in, the language we use to describe them—that's all code. That's all a product decision. If we make "Depression" easy to select and "Grief" hard to find, we aren't just sorting existing states. We are nudging the formation of new ones.

  So, the "kind" of person we are dealing with here is co-produced. It's not just the biology of the user, and it's not just the logic of the code. It's the friction between the two.

  This puts a responsibility on both sides of this room.

  For the clinicians: You need to know that when a patient comes in saying, "I think I have this," they might be telling you what their app told them they are. The authority of the diagnosis has shifted from the office to the interface.

  For the devs: We need to stop pretending we're just building mirrors. We're building engines. If we build a system that rewards users for identifying as unwell, we will get more users identifying as unwell. That's not just a metric; that's a looping effect.

  Hacking's point was that human kinds are unstable. They move. In our apps, they move fast.

  So, as we go through this workshop, let's agree on one thing. We aren't just sorting a static pile of people. We are in the business of shaping the categories themselves. Let's make sure we're doing that with our eyes open.

  Thanks.

  ***

  ### Addendum: Philosophical Liberties & Falsification

  **Where I stretched Hacking's view:**
  1.  **Authority:** Hacking's original looping effects (e.g., in *The Social Construction of What?*) largely rely on *institutional* authority (medicine, law, science) granting the classification weight. A user self-selecting a label in an app lacks that formal authority. I am arguing that *algorithmic personalization* has replaced *institutional authority* as the force that makes the label stick. That's a modernization of his theory, not a direct quote.
  2.  **Scope of the "Kind":** Hacking usually talks about the *category* evolving globally (e.g., the definition of "child abuse" changes over decades). In my speech, I focus heavily on the *individual* loop (this specific user becomes more "ADHD"). While Hacking acknowledges individual interaction, the core of his argument is about the historical evolution of the *concept*. I conflated the micro-loop (user model) with the macro-loop (societal definition) for the sake of the 5-minute constraint.

  **What would change my mind (Falsification):**
  To claim this is a "real" Hackingian looping effect, the classification must change the **possibilities of action** for the person in a way that eventually forces the **classification system itself to change**.

  I would stop calling this a looping effect if:
  *   **The Category Remains Static:** If the app reinforces the label for the user, but the *definition* of the label within the system never shifts in response. For Hacking, the loop isn't closed until the *kind* itself is redefined (e.g., if enough users self-select "Burnout" that the app creators are forced to split "Burnout" into two distinct clinical categories). If the algorithm just gets better at predicting the *existing* label without the label's meaning evolving, it's just a feedback loop, not a looping effect.
  *   **No Change in "Way of Being":** If research showed that users self-selecting labels in apps do not actually alter their self-narrative or behavior long-term (i.e., the label is truly inert, like picking a favorite color), then the "interactive kind" requirement fails. If the user ignores the recommendation engine and the label doesn't change how they navigate the world, the loop is broken.
