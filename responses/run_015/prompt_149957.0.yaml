      *   User-to-Algorithm twist? Yes.
      *   Stop neutral tag claim? Yes.
      *   Stop full autonomy claim? Yes.
      *   Accessible to both groups? Yes.
      *   Addendum included? Yes.

  *(Self-Correction on the Addendum)*: I need to be careful about Hacking's specific definition. He distinguishes between "interactive kinds" (people) and "indifferent kinds" (rocks). The key is that the *classification* changes the *thing classified*. In the app scenario, does the *category* change, or just the user's relationship to it? I should note that distinction in the addendum.

