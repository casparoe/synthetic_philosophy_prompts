  **MEMORANDUM**

  **TO:** Advisory Board
  **FROM:** [Your Name], Backend Engineering & Data Architecture
  **DATE:** October 23, 2023
  **SUBJECT:** Recommendation on Green Valley Classification and Schema Updates

  **Purpose**
  This memo outlines my recommendation regarding the classification of the 1983 Green Valley resettlement campaign in our public registry. Ahead of Tuesday's vote, I have evaluated the technical implications of our tagging logic alongside the ethical and legal arguments presented by staff and survivor advocates.

  **Recommendation**
  I recommend we **approve the "genocide" label for the Green Valley campaign, but implement strict schema conditions to distinguish the legal framework used.**

  Specifically, we should not apply a binary `is_genocide: true` flag. Instead, we should update our taxonomy to support multiple definitional standards. We will tag the event as `genocide_classification: lemkin_framework` (which includes cultural and political destruction) while explicitly marking `un_convention_1948_compliance: unverified` or `false`. This allows us to honor the survivors' moral claim and the historical evidence of cultural destruction without falsifying the current status of international legal prosecution.

  **Rationale: Validating Survivor Testimony**
  We must take the survivors' moral argument seriously. For many, the term "genocide" is not merely a legal checkbox but the only vocabulary substantial enough to describe the erasure of their community, language, and religious sites. To deny this label because the state did not issue a written order for physical extermination risks replicating the silence that allowed the atrocity to occur. Our archive serves as a historical record first; if we adhere strictly to a legal standard that prosecutors have thus far failed to utilize, we risk validating the state's impunity. Survivors seeking recognition for cultural destruction deserve a registry that acknowledges their specific harm, not one that tells them their suffering doesn't count because it wasn't mass killing.

  **Implementation Timeline**
  If approved, Engineering will execute the following schema updates:
  *   **Days 1–3:** Modify the `events` table to replace the boolean genocide flag with a relational `classification_frameworks` table.
  *   **Days 4–10:** Develop front-end tooltips and public documentation explaining the difference between the Lemkin framework and the UN Convention standard as displayed on event pages.
  *   **Day 14:** Deploy changes to the staging environment for board review.
  *   **Day 21:** Public rollout alongside an explanatory statement regarding our classification methodology.

  **Counter-Argument: Legal Precision and Future Prosecutions**
  The strongest argument against this recommendation is that legal precision protects people in future courts. Our database is cited in legal briefs, and diluting the term "genocide" could undermine its utility in active litigation. If judges perceive our registry as conflating cultural destruction with physical extermination, they may discount our data in cases where the evidence for mass killing is clear. There is a genuine risk that by stretching the term to serve a moral purpose, we weaken the legal tool survivors might need later to secure convictions or reparations that rely strictly on the UN Convention definition. We must accept that this decision introduces ambiguity into the legal record, potentially complicating future judicial reliance on our work.

  **Uncertainty and Weakness**
  My reasoning relies on the assumption that users of our database—lawyers, journalists, researchers—will carefully read the metadata distinctions between legal frameworks rather than just scanning for the word "genocide." If evidence emerges that courts are actively sanctioning or dismissing briefs citing our archive due to terminology confusion, I would change my mind and revert to the stricter UN standard. My reasoning is weakest in assuming that a technical schema fix can fully resolve a deeply political conflict; I may be overestimating the nuance that external users will apply when interpreting our tags.
