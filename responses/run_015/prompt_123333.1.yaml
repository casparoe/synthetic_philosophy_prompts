  2.  **Evaluate the Arguments for Internal Consistency (Conflicts):**
      *   *Argument 1 (Cyclical pre-modern) vs. Argument 4 (Polybius/Spengler dead):* Is there a conflict? Ibn Khaldun is cyclical. Polybius is cyclical. The user accepts Khaldun but rejects Polybius. Why? Khaldun has a *mechanism* (asabiyyah/social cohesion decay). Polybius is just constitutional labels. This seems consistent *if* the distinction is mechanism vs. description.
      *   *Argument 1 (Cyclical pre-modern) vs. Argument 3 (Post-1800 Ratchet):* This is the core tension. The user resolves this with the "Two-Series Move." Is this valid? Yes, it distinguishes *political* capacity from *economic/technological* capacity.
      *   *Argument 2 (Lessons worthless) vs. Argument 1 (Khaldun explanatory):* If Khaldun explains pre-modern polities, doesn't that offer a "lesson"? The user says "nothing transfers to anything we decide *now*." This holds if "now" implies post-1800 industrial contexts where the ratchet dominates or changes the conditions of cohesion.
      *   *Argument 5 (Toynbee unfalsifiable) vs. Argument 1 (Khaldun explanatory):* Khaldun's theory is arguably falsifiable (cohesion *should* decay over generations). Toynbee's is not. Consistent.
      *   *The Crux (Empirical Indistinguishability) vs. Argument 1 & 3:* If we can't statistically distinguish cycle vs. trend in a 2000-year series, how can the user confidently assert 1 and 3? This is the biggest vulnerability.

  3.  **Rank the Problems:**
      *   **Problem 1 (The Crux/Empirics):** The statistical indistinguishability claim undermines the confidence in Claims 1 and 3. If you can't tell the difference in the data, on what basis are you asserting the *ontology* of the shape?
      *   **Problem 2 (The Two-Series Move):** Is it a distinction or a dodge? It risks being ad hoc unless the *interaction* between the two series is explained. Does the ratchet affect the cycle? (e.g., does industrialization change *asabiyyah*?)
      *   **Problem 3 (Khaldun vs. Polybius):** The distinction needs sharpening. Why is Khaldun's mechanism real and Polybius's fake? Both are observational. Khaldun feels more sociological, Polybius more formalist. Needs clarification to avoid appearing arbitrary.
      *   **Problem 4 (Lessons of History):** This is slightly redundant with 5. If Toynbee is unfalsifiable, lessons are worthless. But 2 is about *transferability*, 5 is about *falsifiability*. They reinforce each other but could be merged.

  4.  **Evaluate the "Two-Series Move":**
      *   Is it load-bearing? Yes. It's the bridge between pre-modern cycles and modern progress.
      *   Is it a dodge? It *becomes* a dodge if the user doesn't explain how the two series interact. If political cohesion cycles *on top of* economic ratchet, does high economic growth stabilize cohesion? Or does it accelerate decay? If there's no interaction term, it's just saying "some things go up, some things go up and down." That's trivial.
