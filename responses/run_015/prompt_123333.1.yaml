          1.  Cyclical accounts work for pre-modern polities (Ibn Khaldun style).
          2.  "Lessons of history" are worthless (no transferable cases).
          3.  Post-1800 productive capacity is a ratchet (cumulative growth), not a cycle.
          4.  Spengler (organic lifespans) and Polybius (regime cycle) are dead (no mechanism/classification error).
          5.  Toynbee (challenge-response) is unfalsifiable.
          *   **Synthesis:** The "Two-Series Move" (Political cohesion cycles on top of a productive ratchet).
