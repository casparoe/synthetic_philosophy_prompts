prompt: |-
  say i want a theory of shared intention i can actually *use* — not one that just sounds plausible in a seminar room. the use i have in mind: working out who is on the hook (blame, owed apologies, debts of aid and of consultation) when a group project goes sideways, in settings that are heirarchical, partly automated, and where people drift in and out mid-project. so write me the desiderata. what does an account of what it is for some people to share an intention and act together have to deliver, with the case behind each requirement, and for each one say whether you think it is genuinely non-negotiable or just a prejudice of one camp.

  the cases i keep tripping over and want handled:

  - the relay crew: five people on rotating shifts who are never all awake at the same time, each knowing only her own leg and that somebody came before and somebody comes after. is this one joint action or five? when does it start, who is in it, and what does 'in it' even mean for someone asleep in another timezone?
  - the infiltrator: someone who slots into a crew's plan perfectly, meshes subplans, is fully counted on by the others, but is secretly planning to blow the whistle and hopes the thing fails. does she share the intention that we J? I don't want the answer to just be 'no, because her end is different' — tell me what has to be true for that answer to fall out.
  - the checked-out member: someone who agreed to the plan, then quietly stopped caring, but kept showing up and doing his bit anyway. when does he stop being a member? can he exit alone, or does quitting need uptake from the others?
  - the stand-in: a piece of software, or a trained animal, that reliably fills a role in the plan because of how it was built or trained, with nothing intentional going on inside it. is it a member of the joint action? if your theory says 'obviously not, it has no intentions,' is that a real requirement or just the intentionalist camp's preference — and what does it cost you when a human's entire contribution was delegating her role to it?
  - nested crews: a team that is itself one participant inside a larger operation, where the team has nothing it intends over and above what its members intend. can a group be a member of a joint action without having a shared intention of its own?

  sort these into real requirements vs negotiable preferences: whether the theory has to work for agents who can't communicate and know almost nothing about each other's plans (so no full common knowledge); whether it has to be built out of individual intentions only or is allowed an irreducibly collective state; whether membership has to be all-or-nothing or can come in degrees; whether it owes a verdict in coerced cases — the junior person who 'intends that we J' only because refusing costs her her job; and whether it has to explain why shared intention carries that distinctive you-owe-me-a-say-before-you-change-course normativity instead of just being more individual intentions with more content.

  then tell me which single requirement knocks out the most otherwise decent theories, and flag any pair of desiderata you suspect can't be jointly satisfied. I'd rather have the list turn out to be jointly unsatisfiable than have you quietly drop one of my cases to make it come out clean.

  last thing, one short paragraph each on three candidate shapes — describe them rather than name them if you like: (a) shared intention as interlocking individual plans plus mutual responsiveness plus common knowledge, (b) shared intention as an irreducibly collective we-intend that isn't assembled out of I-intentions, (c) shared intention as a joint commitment that neither party can rescind unilaterally. just enough to see where each breaks. the list is the part i care about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Goal:** Create a list of desiderata for a *usable* theory of shared intention (specifically for assigning responsibility/blame/obligation in messy, hierarchical, automated, fluid group projects).
      *   **Tone:** Pragmatic, rigorous, critical. No seminar-room fluff.
      *   **Specific Cases to Handle:** Relay Crew (asynchronous/low knowledge), Infiltrator (secret divergent goal), Checked-out Member (drifting engagement), Stand-in (non-human/automated agents), Nested Crews (groups within groups).
      *   **Specific Sorts to Evaluate:** Common knowledge vs. low knowledge; Individual vs. Collective states; All-or-nothing vs. Degrees; Coercion; Normativity (owe me a say).
      *   **Specific Output Requirements:**
          *   List of desiderata with cases behind them.
          *   Label each as "Non-negotiable" or "Prejudice".
          *   Identify the "Theory-Killer" requirement.
          *   Flag incompatible pairs of desiderata.
          *   Brief critiques of three candidate shapes (Interlocking Plans, We-Intention, Joint Commitment).
          *   Constraint: Do not drop cases to make it clean. Acknowledge if the list is jointly unsatisfiable.

  2.  **Deconstruct the Cases & Derive Desiderata:**

      *   *Relay Crew:* Asynchronous, low knowledge.
          *   *Requirement:* Must handle **Diachronicity & Epistemic Minimalism**. Shared intention can't require simultaneous awareness or full common knowledge.
      *   *Infiltrator:* Divergent ultimate goal, convergent sub-plan.
          *   *Requirement:* Must distinguish **Convergence vs. Commitment**. Doing the same thing isn't enough; the *reason* for doing it matters for responsibility.
      *   *Checked-out Member:* Drifting engagement, exit conditions.
          *   *Requirement:* Must account for **Exit & Dissolution Conditions**. When does obligation cease? Is unilateral exit possible?
      *   *Stand-in:* Software/Animal/Delegation.
          *   *Requirement:* Must handle **Non-Human/Delegated Agency**. Can a tool be a participant? If not, where does the responsibility land when a human delegates to it?
      *   *Nested Crews:* Group as participant.
          *   *Requirement:* Must handle **Scalar/Recursive Structure**. Groups can be agents without every member knowing the top-level goal.

      *   *The "Sorts" (Constraints):*
          *   Common Knowledge? (Relay crew says no).
          *   Individual vs. Collective? (Nested crews suggests collective utility).
          *   All-or-nothing? (Checked-out member suggests degrees).
          *   Coercion? (Hierarchy context suggests this matters for blame).
          *   Normativity? (The whole point is "who is on the hook").

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Draft 1 (Mental):* Needs to work for sleepers. Needs to catch liars. Needs to handle bots. Needs to explain why I can't just quit.
      *   *Refinement:* Make them philosophical but grounded. Use the user's "on the hook" framing.
      *   *Classification:* Which are truly necessary for *responsibility tracking* vs. which are just philosophical purity?
          *   *Normativity:* Non-negotiable. If it doesn't explain obligations, it fails the prompt's use case.
          *   *Epistemic Minimalism:* Non-negotiable. Relay crews exist.
          *   *Degrees of Membership:* Non-negotiable. Checked-out members exist.
          *   *Non-Human Agency:* Tricky. If we say bots can't intend, we need to know where the blame goes. Let's call this "Agency Agnosticism" or "Delegation Tracking".
          *   *Coercion:* Non-negotiable for hierarchical settings.

  4.  **Identifying the Tensions (The "Impossible" Part):**
      *   *Tension 1:* Epistemic Minimalism (Relay) vs. Normative Force (Owe me a say). If I don't know you exist, how can I owe you consultation?
      *   *Tension 2:* Degrees of Membership vs. Clear Blame Assignment. If membership is fuzzy, blame is fuzzy. But reality is fuzzy.
      *   *Tension 3:* Individualism vs. Nested Groups. If groups act, do individuals still bear the load?

      *   *The Theory Killer:* **Normativity without Common Knowledge.** Most theories (Bratman, Gilbert) rely on mutual knowledge to generate the obligation. The Relay Crew kills Common Knowledge. But without it, why do I owe the sleeper anything? This is the hardest nut to crack.

  5.  **Critiquing the Three Shapes:**
      *   *(a) Interlocking Plans (Bratman-esque):* Breaks on Relay (no knowledge) and Infiltrator (plans lock but ends diverge).
      *   *(b) We-Intention (Searle-esque):* Breaks on Stand-in (no mind to have 'we') and Nested (infinite regress of we-intentions).
      *   *(c) Joint Commitment (Gilbert-esque):* Breaks on Checked-out (can't exit unilaterally? too rigid) and Coercion (did the junior really commit?).

  6.  **Refining the Output Structure:**
      *   Follow the prompt's order: Desiderata list -> Sorts (Non-negotiable vs. Prejudice) -> Theory Killer -> Incompatible Pairs -> Three Shapes.
      *   Ensure the tone is direct and avoids hedging.
      *   *Self-Correction on "Stand-in":* The prompt asks if excluding non-humans is a prejudice. I need to take a stand. If the goal is *responsibility*, excluding the bot is right (bots can't be blamed), but the theory must explain where the blame *goes* (the delegator). So the requirement is "Delegation Tracking," not "Bot Agency."
      *   *Self-Correction on "Coercion":* In hierarchical settings, coercion is common. A theory that says "coerced intention isn't shared intention" fails the use case (we still need to know who is on the hook). So the theory must handle *mitigated* responsibility, not just binary inclusion/exclusion.

  7.  **Final Polish:**
      *   Check against the "Relay Crew" constraint: Does the theory allow me to blame the sleeper? Or does it say they aren't in? The prompt asks "what does 'in it' mean for someone asleep". The desideratum should be about *continuity of agency*.
      *   Check against "Infiltrator": The theory needs to distinguish *coincidence* from *collaboration*.
      *   Check against "Joint Unsatisfiability": I need to be honest. The tension between "Low Knowledge" and "Strong Obligation" is real. I will flag this.

  8.  **Writing the Response:** (Drafting content based on the above thoughts, ensuring strict adherence to the prompt's constraints.) *Wait, one check on the "Sorts" section.* The prompt asks me to sort specific questions: Common knowledge, Individual vs Collective, All-or-nothing, Coercion, Normativity. I need to address these specifically in the "Non-negotiable vs Prejudice" section.

      *   *Common Knowledge:* Prejudice (Relay crew kills it).
      *   *Individual vs Collective:* Prejudice (Utility matters, not ontology).
      *   *All-or-nothing:* Prejudice (Checked-out member kills it).
      *   *Coercion:* Non-negotiable (Hierarchy context).
      *   *Normativity:* Non-negotiable (The whole point of the exercise).

      *   *Theory Killer:* The combination of Normativity + Epistemic Minimalism.
      *   *Incompatible Pair:* Strong Normativity (owe me a say) + Radical Epistemic Minimalism (don't know you exist).

      *   *Three Shapes:* Keep it tight.

      *(Self-Correction during drafting)*: Make sure I don't sound like I'm solving the problem, but defining the requirements for the solution. The prompt asks for the *desiderata*, not the theory itself.

      *(Final check on the Stand-in case)*: The prompt asks: "is that a real requirement or just the intentionalist camp's preference — and what does it cost you when a human's entire contribution was delegating her role to it?" I need to make sure the desideratum reflects this cost. The requirement is "Delegation Transparency."

      *(Final check on Nested Crews)*: "Can a group be a member... without having a shared intention of its own?" This challenges the idea that shared intention is the *only* glue. The desideratum should be "Compositional Flexibility."

      Okay, ready to write.
answer: |-
  Here are the desiderata for a theory of shared intention designed for liability tracking in messy, real-world systems. I have sorted them by whether they are necessary for your use-case (Non-negotiable) or philosophical baggage (Prejudice).

  ### The Desiderata List

  **1. Epistemic Minimalism (The Relay Crew)**
  *   **The Case:** Five people, rotating shifts, no overlap, minimal knowledge of predecessors/successors.
  *   **Requirement:** The theory must allow shared intention to persist through gaps in consciousness and communication. It cannot require simultaneous awareness or "common knowledge" (I know that you know that I know).
  *   **Verdict:** **Non-negotiable.** If your theory requires common knowledge, the relay crew is five separate actions, not one project. If it's one project (which it pragmatically is), you need to assign blame for a handoff failure. A theory that dissolves the group because they slept through the handoff is useless for liability.

  **2. Divergent Ends Compatibility (The Infiltrator)**
  *   **The Case:** An agent executes the plan perfectly but intends the ultimate failure of the goal (whistleblower/saboteur).
  *   **Requirement:** The theory must distinguish between *meshing subplans* and *sharing the ultimate end*. It must explain why the infiltrator is liable for the *process* risks but not the *outcome* failure, or vice versa.
  *   **Verdict:** **Non-negotiable.** If the theory says "same action = shared intention," you cannot distinguish a teammate from a saboteur until the explosion happens. You need to know *ex ante* whether their intention binds them to the group's safety norms.

  **3. Gradable Membership & Unilateral Exit (The Checked-out Member)**
  *   **The Case:** A member stops caring but keeps working; or wants to quit without permission.
  *   **Requirement:** Membership must be capable of degrees (attenuated responsibility), and the theory must specify if exit requires uptake from the group or can be unilateral.
  *   **Verdict:** **Non-negotiable.** In fluid projects, people drift. If membership is binary (all-in or all-out), you cannot assign partial blame for the drift. If exit requires group consent (as some commitment theories hold), you create hostage situations in hierarchical firms. The theory must handle "quiet quitting" as a status change, not a binary switch.

  **4. Delegation Transparency (The Stand-in)**
  *   **The Case:** A human delegates their role to software/animal.
  *   **Requirement:** The theory must not require every "node" in the network to have a mind, but it must track where the intention resides when a node is mindless. Excluding non-humans is fine, *provided* the theory automatically routes the obligation to the delegator.
  *   **Verdict:** **Prejudice (with a caveat).** Insisting that only humans can share intentions is intentionalist prejudice. However, insisting that software *can* share intention is anthropomorphism. The non-negotiable core is **Responsibility Routing**: if a tool acts, the theory must identify which human intention subsumes the tool's function.

  **5. Compositional Flexibility (Nested Crews)**
  *   **The Case:** A team acts as one unit within a larger operation without individual members knowing the larger goal.
  *   **Requirement:** The theory must allow a group to be a "black box" participant in a higher-level shared intention without every individual member sharing that higher-level intention.
  *   **Verdict:** **Non-negotiable.** In hierarchies, soldiers follow orders without knowing the war strategy. If the theory requires every individual to intend the top-level goal to count as participating, it fails to describe military or corporate liability.

  **6. Coercion Sensitivity (The Hierarchy)**
  *   **The Case:** A junior member "intends we J" only because firing is the alternative.
  *   **Requirement:** The theory must distinguish between *voluntary* shared intention and *compliant* participation, and adjust the "debt of consultation" accordingly.
  *   **Verdict:** **Non-negotiable.** In your specified setting (hierarchical), coercion is the norm. A theory that treats coerced compliance as full shared intention absolves the coercer. A theory that treats it as *no* shared intention absolves the coerced actor of all procedural duties. You need a middle ground for liability.

  **7. Normative Generation (The "Owe Me a Say" Clause)**
  *   **The Case:** Why does forming a shared intention create an obligation to consult before changing course, rather than just a prediction of behavior?
  *   **Requirement:** The theory must explain the *source* of the obligation. Is it a promise? A reliance interest? A constitutive rule?
  *   **Verdict:** **Non-negotiable.** This is the entire point of your request. If the theory describes psychology but doesn't generate norms, it cannot tell you who owes an apology.

  ---

  ### The Sorts: Non-negotiable vs. Prejudice

  *   **Common Knowledge:** **Prejudice.** The Relay Crew proves you can have joint action without it. Insisting on it is a fetish for epistemic symmetry that doesn't exist in shifts or timezones.
  *   **Individual vs. Irreducibly Collective:** **Prejudice.** For liability, it doesn't matter if the state is "in the group" or "in the heads." What matters is if the *link* holds. However, Irreducible Collective states often handle Nested Crews better.
  *   **All-or-Nothing Membership:** **Prejudice.** The Checked-out Member proves membership degrades. Insisting on binary status is legalistic fiction.
  *   **Verdict in Coerced Cases:** **Non-negotiable.** You cannot ignore coercion in a hierarchy. The theory must handle mitigated agency.
  *   **Normativity (Owe me a say):** **Non-negotiable.** Without this, you have a theory of coordination, not a theory of *shared intention*.

  ---

  ### The Theory Killer

  **The combination of Epistemic Minimalism (1) and Normative Generation (7).**

  This is the single requirement cluster that knocks out the most otherwise decent theories (specifically Bratman-style planning theories and Gilbert-style joint commitment theories).

  Here is the problem: Norms usually require knowledge. I cannot owe *you* a consultation if I do not know *you* exist (Relay Crew). But if I don't know you exist, I cannot have a mutual obligation to you. If the theory lowers the epistemic bar enough to include the sleeping shift-worker, it usually dilutes the normative bond so much that the "owe me a say" obligation vanishes into mere causal reliance. If it strengthens the norm, it requires knowledge that the Relay Crew doesn't have.

  To satisfy this, a theory must ground obligation in **systemic role occupancy** rather than **interpersonal awareness**. It must argue that by taking the shift, you owe the *structure* consultation, not the specific person. Most theories fail because they ground the norm in the *relationship*, not the *role*.

  ---

  ### Incompatible Desiderata

  I suspect **Gradable Membership (3)** and **Normative Generation (7)** cannot be jointly satisfied without remainder.

  If membership comes in degrees (I am 40% "in" the project because I checked out), the obligation to consult should presumably scale (I owe you a 40% say?). But "owing a say" is binary: either you have a right to veto/consult, or you don't. You cannot have a "partial right" to be consulted before a decision is made.
  *   **The Conflict:** If you allow degrees of membership to capture the Checked-out Member, you lose the sharp edge of the Norm required to assign blame. If you keep the Norm sharp, you must treat the Checked-out Member as either fully liable or fully exited, which contradicts reality.
  *   **The Cost:** You will likely have to accept that the theory provides a *presumption* of full membership for liability purposes, even if psychologically the member has drifted. You sacrifice psychological accuracy for legal clarity.

  ---

  ### Three Candidate Shapes

  **(a) Interlocking Individual Plans (The Architect)**
  *   **Shape:** Shared intention is just Meshing Subplans + Mutual Responsiveness + Common Knowledge.
  *   **Where it Breaks:** It shatters on the **Relay Crew** (no common knowledge/mutual responsiveness possible across time gaps) and the **Infiltrator** (plans mesh perfectly, so it counts as shared intention even though the end is divergent). It treats the saboteur as a full partner until the moment of betrayal, making pre-emptive liability assignment impossible.

  **(b) Irreducible We-Intention (The Organism)**
  *   **Shape:** The group has a mental state that is not reducible to the sum of individual "I-intends."
  *   **Where it Breaks:** It chokes on the **Stand-in** and **Nested Crews**. If the group must have a "We-intend," does the software have to participate in the "We"? If not, how does the group intend? It also struggles with **Coercion**: can a group "We-intend" if half the members are coerced? It tends to mystify the mechanism, making it hard to pinpoint *which* individual is on the hook when the "We" fails.

  **(c) Joint Commitment (The Contract)**
  *   **Shape:** Shared intention is a mutual obligation created by expression of willingness to be bound; cannot be rescinded unilaterally.
  *   **Where it Breaks:** It fails the **Checked-out Member** and **Hierarchy**. If I cannot exit unilaterally, the checked-out member is trapped and fully liable despite disengagement (too harsh). If coercion invalidates the commitment, then junior staff in hierarchies are never truly "jointly intending" (too exculpatory). It creates a binary bind/unbind switch that doesn't match the fluid drift of real projects.

  **Final Warning:** You asked not to drop cases to make it clean. The list above is jointly unsatisfiable in its strongest forms. Specifically, you cannot have full Normative Force with minimal Epistemic Contact *and* Gradable Membership. You will have to choose: do you want to catch the Relay Crew (lower epistemic bar) or catch the Checked-out Member (allow degrees)? Catching both makes the "Owe Me a Say" norm too fuzzy to enforce.
