answer: |-
  **Decision-Makers, Option Set, and Payoffs**
  For the purposes of infinitarian ethics, the decision-makers are the Human Interference Task Force (HITF) and the Department of Energy, acting as proxies for current humanity's obligation to all future beings. Their option set consists of: (1) Passive containment (reliance on depth alone); (2) Static markers (granite, spikes, earthworks) with fixed physical decay rates; (3) Active institutional maintenance (a priesthood/record center) with variable institutional decay rates; and (4) Biological/cultural vectors (radiation-sensitive animals, folklore taboos) with evolutionary/memetic decay rates. The payoff-relevant outcome is the prevention of radiological intrusion events at time $t$, weighted by the harm caused. Under aggregative consequentialism, the value of preventing an intrusion at $t$ is proportional to the population size and welfare at $t$. Evidence required to discriminate options includes: the physical half-life of the waste (fixed), the decay rate of stone vs. memory (empirical), the probability of institutional collapse (historical), and the trajectory of future population/value (speculative). The theory is silent on how to weigh the certainty of near-term costs against the uncertainty of far-term benefits when both integrate to infinity.

  **1. The Fork: Finite vs. Open-Ended Stakes**
  This case sits firmly on the open-ended horn, contingent on a physical fact the regulatory framework ignored. The 10,000-year regulatory horizon is ethically inert under infinitarianism; the relevant horizon is the physical hazard duration of transuranic waste, which remains lethal for hundreds of thousands of years, coupled with the potential indefinite persistence of humanity. If the future contains an unbounded number of value-bearing beings, the stakes of a containment failure are infinite. The only factual question that could revert this to finite stakes is whether the waste decays to background levels within a bounded timeframe (it does not) or whether humanity goes extinct within a bounded timeframe (unsettled). Because the hazard outlasts the regulatory window and the future population is modeled as unbounded, the expected value of preventing an intrusion is divergent. The HITF operated under a finite cap, but the ethical lens demands we treat the stakes as infinite, rendering the regulatory standard a arbitrary truncation of the moral problem.

  **2. The Structure: Survival Curves and Interior Optima**
  Your suspicion survives rigorous mapping. Model the expected utility $E$ as the integral of the probability of deterrence $P(t)$ times the value of harm prevented $V(t)$ minus cost $C(N)$. Under infinitarian ethics, $V(t)$ does not discount to zero; if population is unbounded, $V(t)$ is constant or growing. If $P(t)$ follows an exponential decay (typical of physical erosion or institutional forgetting), the integral $\int P(t)V(t)dt$ converges to a finite number, allowing for an interior optimum where marginal cost equals marginal benefit. However, if $P(t)$ follows a heavy-tailed or power-law distribution (plausible for folklore, myths, or robust geological markers that survive civilizational collapse), the integral diverges.

  This creates an arbitrariness audit where the verdict flips on parameters we cannot estimate:
  *   **Message-Decay Rate:** The critical switch. If cultural memory decays exponentially, spend modestly. If myths become permanent fixtures (heavy tail), spend everything. We have no data on myth persistence over 10,000+ years.
  *   **Future Population:** If infinite, any non-zero probability of deterrence yields infinite expected value, making cost irrelevant (fanaticism).
  *   **Institutional Persistence:** A priesthood adds variance; if it survives, $P(t)$ is high; if it collapses, $P(t)$ drops.
  *   **Discount Rate:** Infinitarian ethics typically rejects pure time discounting. Introducing it solves the math but violates the axioms.

  Without importing an arbitrary discount rate or bounded utility, there is no interior optimum. The theory either paralyzes (all options yield $\infty$) or demands infinite investment (fanaticism) depending on whether the survival curve is treated as exponential or heavy-tailed. Since the design studies could not distinguish these tails empirically, the ethical recommendation is epistemically ungrounded.

  **3. The Folklore Proposals: Fanaticism and Repair**
  Infinitarian ethics ranks the folklore and biological proposals strictly above the granite and spikes. This is because they possess the heavier tails required to trigger fanaticism: stone erodes predictably (exponential), but a taboo embedded in religion or a biological marker embedded in evolution could theoretically persist indefinitely (power-law or step-function). A finite cost today buys a non-zero probability of influencing an infinite future. The theory vindicates the "priesthood" option not because it is reliable, but because its upside is unbounded.

  This discredits the theory's practical utility. It implies we should sacrifice high-certainty near-term safety for low-certainty long-term myths. The strongest internal repair is **bounded utility**: capping the total value of the future prevents the integral from diverging, restoring the priority of reliable near-term markers. The cost of this repair is severe: it implies that preventing a catastrophe affecting $10^{50}$ beings is not morally more urgent than one affecting $10^{10}$ beings, once the cap is hit. Alternatively, **variance penalties** could demote the folklore options, but this violates standard independence axioms of decision theory. A third repair, **cluelessness**, argues we cannot know the sign of the effect (the taboo might encourage intrusion), reducing expected value to zero. This stops the fanaticism but induces paralysis, rendering the design effort ethically moot.

  **4. The Return Path: Stewardship vs. Infinity**
  The episode exposes that infinitarian ethics has no register for bounded, institutionally legible stewardship. The HITF practitioners operated with an implicit modest longtermism (protect the next 10,000 years as best as possible within budget), which the theory cannot reconstruct without ad hoc constraints. This is not an anomaly; it is a structural feature of aggregative consequentialism applied to infinite horizons. The theory is arbitrarily sensitive to whether the future is modeled as unbounded in duration or population; shift the model slightly, and the optimal design flips from "build a wall" to "fund a cult."

  Consequently, the episode is evidence **against** taking infinite stakes seriously in engineering contexts. It demonstrates that when stakes are formally infinite, decision procedures break down into paralysis or fanaticism, forcing agents to ignore the theory to function. The practitioners were right to ignore the infinite horizon not because the future doesn't matter, but because the ethical framework provides no action-guiding leverage over it. The theory demands a level of epistemic access to the deep future (decay rates of myths, population trajectories) that is impossible to possess, making it operationally silent.

  **Load-Bearing Claim**
  The WIPP marker case demonstrates that infinitarian ethics is operationally inert for long-term stewardship because it cannot discriminate between options without importing arbitrary constraints on value or probability; the theory forces a choice between paralysis (all options equal infinity) and fanaticism (negligible probability of infinite payoff dominates), neither of which supports the graded, finite-horizon engineering actually required to manage physical hazards.

  **Strongest Objection**
  The failure lies not in the ethics but in the modeling of "cluelessness": if we acknowledge that our uncertainty about far-future effects is so vast that the probability of the intervention having a *negative* effect is comparable to the positive effect, the expected value of *all* marker strategies collapses to zero, restoring parity without needing bounded utility; however, this objection sacrifices the ability to justify *any* long-term intervention, rendering the theory capable of criticizing the markers but incapable of recommending an alternative, thus leaving the waste unmarked by default.
