      *   *Argument 3: Cluelessness/Tractability.* We don't know what causes suffering in insects. Changing methods might be theater (e.g., freezing might be painful, we just don't know). If we can't identify a "humane" method with confidence, changing costs is wasteful.
      *   *Argument 4: Opportunity Cost.* The money spent on humane killing could be spent on something with *certain* good outcomes (e.g., worker safety, carbon reduction).

  5.  **Refining the Advice (Structuring the Response):**

