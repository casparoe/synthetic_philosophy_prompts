answer: |-
  Design notes
  The questions were chosen to partition the logical space of fairness criteria without relying on technical jargon. The first fork separates input-focused views (unawareness) from outcome-focused views. The second distinguishes between group-based and individual-based metrics, which is the primary philosophical divide in compliance. Subsequent nodes isolate specific metric commitments: whether rates must match despite risk differences, whether long-term welfare overrides immediate metrics, whether errors or score meanings take precedence, and whether causality or explainability drives individual assessment. This structure ensures analysts confront the practical trade-offs—such as accepting different approval rates or constraining model complexity—rather than memorising definitions. The "reasons-on-record" policy is treated as a distinct leaf because it imposes a specific operational constraint on explainability that differs from abstract individual similarity.

  The decision tree
  **Node 1:** Claim: "We must forbid the model from using protected data, even if prediction worsens."
  *   **Yes:** Leaf 1 (Fairness through Unawareness).
  *   **No:** Go to Node 2.

  **Node 2:** Claim: "We should judge fairness by comparing group outcomes, not individual files."
  *   **Yes:** Go to Node 3.
  *   **No:** Go to Node 6.

  **Node 3:** Claim: "Approval rates must match across groups, even if risk profiles differ."
  *   **Yes:** Leaf 2 (Demographic Parity).
  *   **No:** Go to Node 4.

  **Node 4:** Claim: "Long-term group welfare matters more than immediate decision metrics."
  *   **Yes:** Leaf 3 (Welfare-Consequentialist).
  *   **No:** Go to Node 5.

  **Node 5:** Claim: "It is worse to make more mistakes on one group than to have scores mean different things for pricing."
  *   **Yes:** Leaf 4 (Equality of Error Rates).
  *   **No:** Leaf 5 (Calibration).

  **Node 6:** Claim: "Fairness requires asking what would happen if the applicant's background were different."
  *   **Yes:** Leaf 6 (Counterfactual-Causal).
  *   **No:** Go to Node 7.

  **Node 7:** Claim: "Declined applicants must be told exactly what to change to get approved."
  *   **Yes:** Leaf 7 (Reasons-on-Record).
  *   **No:** Leaf 8 (Individual Fairness).

  Leaf key
  1.  **Fairness through Unawareness:** Awkward commitment: Ignoring protected data may ignore proxy variables, potentially worsening outcomes for disadvantaged groups.
  2.  **Demographic Parity:** Awkward commitment: Requires approving higher-risk applicants in some groups to match rates, potentially increasing losses.
  3.  **Welfare-Consequentialist:** Awkward commitment: May sacrifice immediate procedural fairness to maximise long-term group wealth or stability.
  4.  **Equality of Error Rates:** Awkward commitment: Necessitates using different decision thresholds for different groups, which may look like discrimination.
  5.  **Calibration:** Awkward commitment: Accepts different approval rates across groups if the risk scores accurately reflect probability of default.
  6.  **Counterfactual-Causal:** Awkward commitment: Requires building unobservable causal models to estimate what would happen under different backgrounds.
  7.  **Reasons-on-Record:** Awkward commitment: Constrains model complexity to ensure every decline comes with a monotonic, actionable explanation.
  8.  **Individual Fairness:** Awkward commitment: Requires defining a subjective metric of 'similarity' between applicants to ensure consistent treatment.

  Empty cells
  Several answer combinations are logically incoherent. A "Group Focus" (Node 2 Yes) combined with "Individual Fairness" (Node 7 No path) is contradictory by definition, as one cannot prioritise group metrics and individual similarity simultaneously. Similarly, "Unawareness" (Node 1 Yes) combined with "Counterfactual-Causal" (Node 6 Yes) is incoherent, because estimating counterfactuals requires knowing the protected attribute. Finally, "Welfare-Consequentialist" combined with "Unawareness" is unattractive; optimising long-term group welfare usually requires targeted interventions that violate blindness. These cells remain empty because the positions are mutually exclusive or operationally impossible.

  What the tree cannot separate
  The tree cannot distinguish between technical nuances that share the same practical commitment. For instance, it groups all "score meaning" views under Calibration, failing to separate Calibration from Sufficiency, though both require scores to predict risk accurately across groups. It also cannot separate specific variants of Individual Fairness, such as Lipschitz continuity versus metric learning, as both require a similarity definition. Furthermore, it does not distinguish Welfare-Consequentialism from pure Utilitarianism; both prioritise outcomes over procedure. Lastly, it treats "Reasons-on-Record" as distinct, but cannot separate whether the reason must be the *true* causal reason or merely a sufficient explanation, a legal nuance beyond the scope of this exercise.

  My three draft questions, diagnosed
  Your first question, "Should the model ignore protected characteristics?", is too binary; it isolates Unawareness but fails to guide analysts through the remaining seven criteria, leaving the rest of the tree unmapped. The second question, "Is 85% accuracy good enough?", conflates utility with fairness; accuracy is a performance metric, not a fairness criterion, so answering it reveals nothing about the analyst's ethical stance on distribution or rights. The third question relies on an idealised case where distributions are identical; this removes the tension between parity and error rates that defines most real-world compliance dilemmas. Consequently, none of these questions force a trade-off between competing fairness definitions, which is the primary goal of the exercise.

  The trilemma
  Your colleague's claim is incorrect regarding the base rate condition. The impossibility theorem stating that Calibration and Equal Error Rates cannot both hold relies fundamentally on the groups having *different* base rates. If base rates are identical, both criteria can be satisfied simultaneously, even with actionable reasons, provided the model is well-calibrated and monotonic. The addition of "actionable reasons" imposes a constraint on model structure (monotonicity) but does not generate a logical contradiction with the other two conditions when base rates are equal. Therefore, this claim should not appear in the handout, as it relies on a false premise about the necessary conditions for incompatibility.
