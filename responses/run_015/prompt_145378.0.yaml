      *Looking at Move 3:* Is it "Right"? It's a faithful exposition of the view's resources, but the argument itself (that this solves the problem) is contested. I will rate the *move* (the argumentative step) based on its cogency. It's a plausible defense, so "Mostly Right."

      *Re-evaluating Move 6:* Ellis says singling-out is numbers in disguise. That's a strong insight. The after-the-draw objection is also strong. "Mostly Right."

      *Re-evaluating Move 4:* This is the pivot point. It's very strong. "Clearly Right."

