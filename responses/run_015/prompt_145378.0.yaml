      *   *Move 8:* Clearly Right. Points out the inconsistency in Marta's defense strategy.

  6.  **Refining the "What They Are Missing" Section:**
      *   *Duty to Spread Risk:* Ellis assumes it's a "plain duty." But in high-stakes maintenance, maybe minimizing total injury (utilitarian) is actually the duty, not risk-spreading. The intuition isn't as rock-solid as Ellis claims.
      *   *Cost of Numbers:* Marta fears collapsing into utilitarianism. But a "moderate aggregation" (threshold view) might be possible without total surrender. They treat it as binary (all or nothing).
      *   *Ex Ante/Ex Post:* They treat these as mutually exclusive standpoints. A contractualist might argue that reasonable rejection is assessed from a standpoint that acknowledges both the ex ante fairness and the ex post reality, perhaps through a duty of compensation that retroactively validates the risk.

  7.  **Final Review against Constraints:**
