  8.  **Final Polish:** Ensure the tone is neutral and analytical. (Self-Correction: Make sure the ratings are clear, e.g., "Mostly Right" or "Clearly Mistaken".) I will use a scale description in the intro or just apply the labels. The prompt asks to "rate each... on a scale from clearly mistaken to clearly right". I will use descriptive labels.

