answer: |-
  **Move 1: Marta**
  **Rating:** Mostly Right.
  **Justification:** She correctly identifies the core contractualist motivation that justification must be addressable to the individual victim, and she rightly notes that the "nausea" intuition is not as robust as the "transplant" intuition. However, she dismisses the aggregation worry too quickly without explaining how the view handles large-scale institutional decisions.

  **Move 2: Ellis**
  **Rating:** Mostly Right.
  **Justification:** He accurately distinguishes between summing burdens and counting persons, exposing the structural difficulty contractualism faces in explaining why more complainants matter if complaints are not aggregated. His charge that Marta is deriving two conflicting verdicts from the same premise is a fair logical challenge.

  **Move 3: Marta**
  **Rating:** Mostly Right.
  **Justification:** This faithfully reconstructs the standard contractualist response regarding risk and probability, which is the view's primary resource for handling numbers. However, restricting number-sensitivity only to uncertain cases appears ad hoc and invites the objection that the view is unstable across different types of scenarios.

  **Move 4: Ellis**
  **Rating:** Clearly Right.
  **Justification:** This is the strongest argument in the exchange; he demonstrates that relying on ex ante probabilities either renders the view unable to distinguish between risk-spreading and certain sacrifice or collapses it into the expected-value reasoning it was designed to replace.

  **Move 5: Marta**
  **Rating:** Mostly Right.
  **Justification:** The "singling-out" complaint is a sophisticated maneuver that shifts the ground from aggregate harm to relational fairness, which is consistent with the spirit of contractualism. However, claiming this solves the problem "for free" underestimates the difficulty of explaining why the complaint vanishes if everyone is harmed.

  **Move 6: Ellis**
  **Rating:** Mostly Right.
  **Justification:** He correctly notes that the force of "singling out" implicitly relies on the number of people spared, and the "after-the-draw" objection exposes a serious tension between accepting a principle ex ante and justifying the outcome to the actual loser ex post.

  **Move 7: Marta**
  **Rating:** Mixed.
  **Justification:** Distinguishing between the principle of action and the duties of compensation is a valid theoretical distinction, but shifting to a "model of mutual recognition" looks like a retreat from the decision-procedure reading she relied on in Move 1, undermining her earlier confidence.

  **Move 8: Ellis**
  **Rating:** Clearly Right.
  **Justification:** He successfully identifies an inconsistency in Marta's defense strategy, noting that she cannot treat the view as a decision-procedure when it yields convenient results and a recognition-model when it yields counterintuitive ones without losing theoretical coherence.

  ***

  **Overall Adjudication**

  Ellis is more right overall, specifically on the structural coherence of the view. While Marta successfully defends the foundational moral intuition of contractualism (that individuals should not be sacrificed for the aggregate), Ellis demonstrates that the machinery of the view cannot consistently support that intuition across both certain and uncertain cases without collapsing into the aggregative reasoning it opposes. Marta wins on the *spirit* of the theory (Move 1), but Ellis wins on the *mechanics* (Moves 4, 6, and 8).

  **What Both Parties Are Missing**

  First, regarding the **duty to spread risk**, Ellis assumes it is a "plain duty" that any moral theory must capture, but this is not obvious. In high-stakes institutional contexts, a duty to minimize total expected harm might override a duty to distribute risk fairly, meaning contractualism's inability to mandate risk-spreading might be a feature rather than a bug. Second, concerning the **cost of taking numbers into account**, both treat the issue as binary: either contractualism counts numbers and collapses into prioritarianism, or it doesn't and fails the nausea test. They miss the possibility of a threshold view, where numbers count only when the individual burdens are sufficiently small, which would preserve the transplant verdict while avoiding the nausea verdict. Finally, regarding the **ex ante / ex post distinction**, both treat these standpoints as mutually exclusive. They miss the possibility that "reasonable rejection" is a time-indexed concept: a principle can be reasonably accepted ex ante while generating specific duties of redress ex post, without requiring the theory to validate the sacrifice from the victim's final standpoint. This would allow the view to maintain the ex ante justification for the lottery while acknowledging the ex post tragedy without contradiction.
