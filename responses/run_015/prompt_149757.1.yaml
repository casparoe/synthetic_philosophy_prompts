answer: |-
  A municipal housing officer manages a waitlist governed by a strict "Individual Merit" clause, which forbids using any single applicant's file to set a precedent that bypasses standard verification for others. Six applicants are stuck due to a systemic database error that falsely flags them as ineligible. The only way to override the error for all six is to manually mark Applicant A's file as "Verified Exception," which requires falsifying a timestamp on A's record (a violation of A's right to accurate administrative data). If the officer refuses to falsify A's record, the system locks, and all six applicants remain falsely flagged (violating their right to accurate administrative data). If the officer falsifies A's record to unlock the patch, A's data integrity is compromised, but the other five are cleared.

  **The Analysis**
  The deontologist argues that the officer has a strict duty not to falsify records, regardless of the outcome. Violating Applicant A's right to data integrity is an active moral wrong committed by the agent, whereas the suffering of the other five is a result of the system's error, not a direct violation by the officer. The consequentialist argues that rights violations are bad states of affairs to be minimized; one falsified record is objectively better than five, so the officer must falsify A's timestamp to reduce the total count of rights violations. The paradox bites because the very rule designed to protect rights (accurate data processing) forces the agent to permit more violations of that exact same right elsewhere simply to keep their own hands clean.

  **The Heavy-Lifting Feature**
  The feature doing the heavy lifting is **agent-relative constraints**. Deontology insists that the agent has a special obligation not to *commit* a violation themselves, which cannot be traded off against violations they merely *allow* to happen. If you strip this feature away, the distinction between "my violation" and "others' violations" collapses. You are left with an agent-neutral perspective where all rights violations are just negative values in a single sum, which immediately converts the framework into consequentialism.

  **The Best Deontological Move**
  The best move to block the case without changing the subject is to lean hard on the **Distinction Between Doing and Allowing**. The deontologist should argue that falsifying A's record is a direct infringement of duty, whereas allowing the system to error is a failure of beneficence. The officer is responsible for their own maxim (truth-telling), not for fixing every causal defect in the world. By refusing to falsify, the officer maintains the integrity of the office; if they falsify, they become the source of the rights violation, making them complicit in the very harm they seek to prevent, whereas the system's error remains an external tragedy they did not author.
