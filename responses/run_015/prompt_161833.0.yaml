prompt: |-
  Hey — I've got an MA student who wants to write a one-semester term paper (about 6000 words) on consequentialist cluelessness, and I need to turn their half-baked idea into an actual proposal I can hand back to them. So: you're a professional moral philosopher who's also completely at home in decision theory and heavy-tailed probability distributions — take this seriously, brainstorm for a bit before you start drafting, and don't give me a literature survey.

  Their hunch, as far as I can tell: the cluelessness debate keeps treating the problem as one about variance, or about unknown far-future effects, and then argues about whether those unknowns wash out in expectation. The student wants to claim that the interesting case isn't high variance at all but undefined expectation — if the distribution over an act's downstream effects is heavy-tailed enough (think Pareto with tail index around or below 1), there is no expected value to be clueless about, so the standard "the noise is roughly symmetric, it cancels" move has nothing to cancel. On that picture cluelessness doesn't make consequentialism misleading, it makes it incomplete: for some acts the theory returns no verdict. And incompleteness might call for a different fallback than the ones usually reached for (rules, virtues, hedging, satisficing, searching for options that look good under many models).

  What I want: a one-page proposal — the question stated precisely enough that it has a determinate answer inside 6000 words; why both the cancelling-out response and the usual "then fall back on non-consequentialist criteria" response leave it open; the method, including the one bit of formalism they'd have to actually get right and when in the semester they'd do it; the two or three possible conclusions and what would decide between them; and an honest note on what would make the project fail or blow past a semester.

  Also: there are a few places where they'll just have to stipulate something — how to model the tail, and whether to treat cluelessness as imprecise credence, as model/structural uncertainty, or as plain undefined expectation. Pick one for them and say why that one rather than the obvious alternatives. No citations and no bibliography, they'll fill those in themselves and I don't want invented references. Take a definite line throughout: tell me what you think the right framing is and defend it, don't lay out the menu and leave me to choose. And if you think the whole idea is a dud, say so — with reasons.
reasoning: |-
  Thinking Process:

  1.  **Analyze the Request:**
      *   **Role:** Professional moral philosopher, expert in decision theory and heavy-tailed probability distributions.
      *   **Task:** Turn a student's half-baked idea into a one-page term paper proposal.
      *   **Topic:** Consequentialist cluelessness, specifically focusing on undefined expectations due to heavy-tailed distributions (Pareto tail index $\alpha \le 1$) rather than high variance or symmetric noise.
      *   **Student's Hunch:** Standard cluelessness arguments assume unknowns wash out (symmetry/variance). Student argues heavy tails make expectation undefined, so consequentialism yields *no verdict* (incompleteness), not just misleading guidance. This requires a different fallback than usual (rules, virtues, etc.).
      *   **Constraints:**
          *   One-page proposal length (roughly).
          *   Precise question (determinable in 6000 words).
          *   Explain why standard responses (cancelling-out, non-consequentialist fallbacks) fail here.
          *   Specify method, including specific formalism and timing.
          *   Specify 2-3 possible conclusions and decision criteria.
          *   Honest risk assessment (failure modes/scope creep).
          *   **Crucial:** Make definite choices on stipulations (tail model, interpretation of cluelessness). Do not offer a menu. Defend the choices.
          *   No citations/bibliography.
          *   Tone: Serious, professional, philosophical, technically competent.
          *   If the idea is a dud, say so (but the prompt implies I should develop it if viable).

  2.  **Evaluate the Idea (Is it a dud?):**
      *   *Viability:* The core insight is strong. Standard cluelessness (Greaves, Hilgreave, etc.) often relies on the Law of Large Numbers or symmetry arguments to suggest expected value (EV) converges or is negligible. Heavy-tailed critique (Bostrom, Beckstead, Christian Tarnoff, etc.) suggests EV might diverge.
      *   *Novelty:* Focusing specifically on *undefined expectation* (Cauchy/Pareto $\alpha \le 1$) leading to *incompleteness* rather than *uncertainty* is a sharp angle. Most discussions treat it as "we don't know the EV" vs "EV is zero." The claim "EV does not exist" is technically distinct and philosophically potent.
      *   *Scope:* 6000 words is tight for heavy formalism + moral philosophy. Needs strict bounding.
      *   *Verdict:* Not a dud. It's ambitious but manageable if formalism is kept minimal and targeted.

  3.  **Make Definite Choices (Stipulations):**
      *   *Tail Model:* Pareto distribution with $\alpha \le 1$. Why? It's the canonical example of undefined mean. Simpler than Cauchy for positive-only outcomes (utility), which fits consequentialism better than symmetric Cauchy.
      *   *Interpretation of Cluelessness:* Plain undefined expectation (objective chance or subjective credence behaving like objective chance). Why not imprecise credence? Imprecise credence (sets of probabilities) often allows for interval-valued expectations. If the interval is $(-\infty, \infty)$, it's effectively undefined, but the student's point is about the *structure* of the distribution itself, not just epistemic humility. Why not structural uncertainty? That's too vague. Stick to the mathematical claim: the integral $\int x f(x) dx$ diverges.
      *   *Fallback:* The proposal needs to argue what happens *given* incompleteness. The student hints at "different fallback." I should steer them toward evaluating whether consequentialism *collapses* or requires a *lexical priority* rule.

  4.  **Drafting the Proposal - Section by Section:**

      *   **Title:** Needs to be punchy. "Undefined Expectations and the Incompleteness of Consequentialism."
      *   **Research Question:** Needs to be precise. "Does the existence of heavy-tailed uncertainty with undefined expectations render act consequentialism incomplete, and if so, does this incompleteness necessitate a non-consequentialist decision rule?"
      *   **Motivation/Problem:** Standard cluelessness assumes symmetry/cancellation. Heavy tails break symmetry and convergence. EV doesn't exist. Consequentialism needs EV to rank acts. No EV = No ranking = Incompleteness.
      *   **Why Standard Responses Fail:**
          1.  *Cancellation:* Fails because variance is infinite/undefined; LLN doesn't apply.
          2.  *Non-consequentialist fallback:* Usually motivated by *difficulty* of calculation. Here the problem is *impossibility* of calculation. Standard fallbacks (rules of thumb) assume there *is* a truth of the matter we are approximating. If there is no EV, rules aren't approximations; they are replacements.
      *   **Method/Formalism:**
          *   Need to define the utility distribution.
          *   Show divergence of expectation.
          *   Timing: Weeks 3-4.
          *   Keep it simple: Single decision node, two acts, one has heavy-tailed outcome.
      *   **Possible Conclusions:**
          1.  Consequentialism is strictly incomplete (gaps in verdicts).
          2.  Consequentialism must be modified (e.g., truncate tails).
          3.  Consequentialism collapses into deontology/rules necessarily.
          *   *Decision Criteria:* Depends on whether truncation is ad hoc or principled.
      *   **Risks:**
          *   Getting bogged down in math (measure theory).
          *   Confusing epistemic vs. metaphysical undefinedness.
          *   Scope creep (trying to solve longtermism).

  5.  **Refining the Tone:**
      *   Must sound like a supervisor speaking to a student (via the user).
      *   Authoritative but constructive.
      *   No hedging ("You might want to..."). Use directives ("You will...", "The paper must...").

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I include citations? No.
      *   *Check:* Did I offer a menu on stipulations? No, I chose Pareto and undefined expectation.
      *   *Check:* Is the question determinate? Yes, it asks about the status of the theory given the math.
      *   *Check:* Is the formalism specific? Yes, Pareto tail index $\alpha \le 1$.
      *   *Check:* Is the risk assessment honest? Yes, math creep is the big danger.
      *   *Check:* Word count of proposal? Needs to be roughly one page (approx. 500-700 words).

  7.  **Final Polish:** Ensure the distinction between "uncertainty about EV" and "undefined EV" is sharp. This is the crux of the student's insight. Ensure the fallback discussion distinguishes between "epistemic proxy" and "constitutive rule."

      *   *Stipulation Defense:* I need to explicitly state *why* I'm choosing undefined expectation over imprecise credence. Reason: Imprecise credence often preserves comparability via interval dominance. Undefined expectation destroys comparability entirely. This fits the "incompleteness" thesis better.
      *   *Formalism:* Keep it to the integral definition of expectation. No need for stochastic processes.

  8.  **Final Output Generation** (incorporating the above thoughts into the requested format).
answer: |-
  **Term Paper Proposal: Undefined Expectations and the Incompleteness of Consequentialism**

  **Research Question**
  Does the presence of heavy-tailed uncertainty with undefined expectations render act consequentialism theoretically incomplete, and if so, does this incompleteness necessitate a constitutive non-consequentialist decision rule rather than an epistemic proxy?

  **Motivation and Problem Statement**
  Standard treatments of consequentialist cluelessness assume that while downstream effects are unknown, their expected value (EV) is defined—often relying on symmetry arguments to suggest positive and unknown effects cancel out. Your hunch is correct: this relies on finite variance. If the distribution of an act's downstream utility is heavy-tailed (specifically Pareto with tail index $\alpha \le 1$), the expectation integral diverges. The EV does not exist. This is not a case of high variance or epistemic opacity; it is a case where the axiological metric required to rank acts is mathematically undefined. Consequently, consequentialism returns no verdict. The paper must argue that this constitutes *incompleteness* (a gap in the theory) rather than *uncertainty* (a gap in our knowledge).

  **Why Standard Responses Fail**
  You must demonstrate why existing solutions do not resolve this specific problem.
  1.  **The Cancellation Response:** This fails because the Law of Large Numbers does not apply to distributions with undefined means. The noise does not wash out; it dominates.
  2.  **The Epistemic Fallback:** Standard proposals (rules of thumb, virtue cues) are usually defended as reliable proxies for the true EV. But if the true EV is undefined, there is nothing for these proxies to approximate. You must argue that adopting a rule here is not an epistemic shortcut but a constitutive replacement of the maximizing principle.

  **Method and Formalism**
  You will model a single decision node between a "safe" act (bounded utility) and a "risky" act (unbounded utility). You must stipulate that the risky act's utility follows a Pareto distribution with $\alpha \le 1$.
  *   **Formal Requirement:** In weeks 3–4, you will formally demonstrate the divergence of the expectation integral $\int x f(x) dx$ for this specific case. You do not need measure-theoretic rigor beyond standard calculus, but you must correctly distinguish between *infinite* expectation (limit goes to $\infty$) and *undefined* expectation (limit does not exist, e.g., via oscillating series or symmetric Cauchy-like structures in utility space). For this paper, treat undefined expectation as the condition where the integral fails to converge absolutely.
  *   **Stipulation on Cluelessness:** You will treat this as **plain undefined expectation** rather than imprecise credence. Imprecise credence models (sets of probabilities) often yield interval-valued expectations, which can still support decision rules via interval dominance. Undefined expectation destroys comparability entirely. This stipulation is necessary to sustain your thesis of incompleteness; if you allow imprecise credence, the project shifts from "no verdict" to "indeterminate verdict," which weakens the claim that consequentialism breaks down.

  **Possible Conclusions**
  1.  **Strong Incompleteness:** Consequentialism is silent on heavy-tailed acts. Morality contains genuine gaps.
  2.  **Truncation:** Consequentialism survives only if we principledly truncate tails (e.g., at physical limits). You must assess whether this is principled or ad hoc.
  3.  **Hybridization:** Consequentialism requires a lexical priority rule (e.g., "maximize EV where defined; otherwise follow rule $X$").
  *Decision Criteria:* The choice between these depends on whether tail truncation can be justified without begging the question against the heavy-tailed premise. If truncation is ad hoc, Conclusion 3 is the most viable.

  **Risk Assessment**
  *   **Math Creep:** The biggest risk is spending 3000 words on probability theory. Keep the formalism minimal. The math is a premise, not the product.
  *   **Scope:** Do not attempt to solve longtermism or existential risk generally. Focus on the structural implication for moral theory.
  *   **Failure Mode:** The project fails if you conflate "we cannot calculate the EV" with "the EV does not exist." You must maintain this distinction rigorously. If the EV exists but is unknown, the standard cluelessness literature already covers it. The paper stands or falls on the claim that the integral diverges.

  **Timeline**
  *   Weeks 1–2: Literature review on cluelessness and heavy tails.
  *   Weeks 3–4: Formal modeling of the divergence (see above).
  *   Weeks 5–8: Philosophical argument regarding incompleteness vs. uncertainty.
  *   Weeks 9–10: Evaluation of fallback strategies and drafting.
