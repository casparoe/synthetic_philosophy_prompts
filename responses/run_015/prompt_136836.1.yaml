answer: |-
  Machiavelli's logic treats *virtù* not as blind aggression but as adaptive force matching the temporal moment. The gendered metaphor frames Fortune as capricious resistance requiring decisive mastery, yet the river analogy clarifies that this mastery is primarily preparatory. Dikes built in calm weather channel the flood; similarly, *virtù* constructs conditions that limit Fortune's sway before the crisis hits. Fortune is framed not as pure randomness but as resistant substance yielding only to matching force. When Machiavelli claims we direct half our actions, he implies a dynamic feedback loop: bold action doesn't just navigate the uncontrolled half but actively expands the domain of control by reshaping the environment. The impetuous man succeeds because the times demand force, not because force universally dominates. Therefore, *virtù* is the capacity to read the times and impose form upon matter—whether woman or river—transforming chance into opportunity through timely intervention rather than sheer violence alone. The gendered imagery emphasizes the necessity of active imposition over passive submission to fate.
