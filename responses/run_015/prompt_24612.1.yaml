answer: |-
  ### The Brexit Ulysses Contract: A Theoretical Autopsy

  Treating the 2016 Brexit referendum as a Ulysses contract is a compelling metaphor, but it reveals significant fractures when pressed against the actual mechanics of political science and behavioral economics. In the classic Elsterian framework, a Ulysses contract is a device used by a rational agent (Self 1) to bind a future agent (Self 2) to prevent a predicted failure of will or rationality when facing a specific temptation.

  Here is the mapping of the Brexit scenario onto the Ulysses framework, followed by an analysis of where the model shatters.

  ---

  ### 1. Mapping the Contract

  **The Agents:**
  *   **Self 1 (The Committer):** The Electorate (June 2016). Specifically, the 51.9% who voted Leave.
  *   **Self 2 (The Future Self):** The UK Government, Parliament, and the Electorate (2017–2020).
  *   **The Mast (The Binding Mechanism):** The political mandate of the referendum result. Though legally advisory, it was constructed socially and rhetorically as an immutable instruction.
  *   **The Sirens (The Temptation):** The economic costs of separation, the complexity of trade deals, the Irish border issue, and the temptation to revert to the status quo (Soft Brexit or Remain).
  *   **The Command:** "Leave the European Union."

  **The Rationality Condition:**
  For a Ulysses contract to be rational, Self 1 must anticipate that Self 2 will face a time-inconsistency problem (i.e., Self 2 will want to deviate from Self 1's long-term plan due to short-term pain).
  *   *The Logic:* Leavers argued that the political establishment (Self 2) would inevitably try to dilute Brexit due to pressure from markets and institutions. Therefore, the only rational move was to burn the bridges (vote Leave) to force the negotiation of a new relationship.

  **Sophisticated vs. Naive:**
  *   **Sophisticated View:** Some Leave voters understood the economic risks but viewed them as necessary short-term pain to achieve long-term sovereignty. They wanted the binding to be hard to prevent elite backsliding.
  *   **Naive View:** Many voters operated under "cheap talk" promises (e.g., £350m for the NHS, frictionless trade). They did not anticipate the specific constraints Self 2 would face. They bound the future self to a fantasy, not a plan.

  ---

  ### 2. Where the Model Breaks

  The Ulysses framework assumes a unitary agent binding itself. Brexit was a collective agent binding a different set of agents. Here is where the theory fails to hold water.

  #### A. The Fragmentation of "Self" (Collective Action Problem)
  In the Odyssey, Ulysses is one person. In Brexit, "Self 1" was 17.4 million people with contradictory preferences. Some wanted a Norway-style deal (Soft Brexit); others wanted WTO terms (Hard Brexit).
  *   **The Break:** You cannot have a coherent Ulysses contract when the "Self" issuing the command is internally inconsistent. When Self 2 (Parliament) tried to implement the command, it realized there was no single "Leave" to implement. The contract lacked a defined trigger condition.
  *   **Theoretical Violation:** A rational precommitment requires a clear specification of the forbidden action. "Leave" was a direction, not a specific state. Binding the government to "Leave" without defining the terms is like Ulysses ordering his crew to "sail away" without specifying from what or to where.

  #### B. The Information Asymmetry (New Info vs. Binding)
  Standard theory (e.g., Schelling, Elster) debates whether a contract holds if Self 2 learns new information. Generally, if the new information fundamentally alters the payoff structure (e.g., "Leaving causes immediate famine"), the rational agent should void the contract.
  *   **The Break:** Between 2016 and 2019, Self 2 learned the specific costs of the Irish Backstop and the single market. However, the political interpretation of the Ulysses contract was that **no new information could void the mandate.**
  *   **Theoretical Violation:** The "Will of the People" rhetoric transformed a political mandate into a moral absolute, overriding the rationality condition that allows for contract renegotiation under new information. The model predicts Self 2 should deviate if the cost exceeds the benefit; the political reality punished deviation regardless of cost.

  #### C. The Enforcement Mechanism (Ropes vs. Norms)
  Ulysses used physical ropes. Brexit used political norms.
  *   **The Break:** Self 2 (Parliament) retained the legal sovereignty to ignore Self 1. The binding was purely reputational. When the costs of the "Leave" path became clear (e.g., the Withdrawal Agreement rejected three times), Self 2 attempted to cut the ropes (People's Vote, revoking Article 50).
  *   **Theoretical Violation:** A Ulysses contract is only effective if the cost of breaking it is higher than the cost of adhering to it. In Brexit, the cost of breaking it (political backlash) was initially lower than the cost of adhering to it (economic damage/no deal), leading to a paralysis where Self 2 was bound but unable to act.

  ---

  ### 3. What the Framework Can't Explain (The Wrangling)

  The Ulysses model is static; Brexit was dynamic and institutional. The theory cannot account for three specific elements of the 2017–2020 wrangling:

  1.  **Principal-Agent Inversion:** In the model, Self 1 binds Self 2. In Brexit, the *Government* (Cameron) called the referendum to bind the *Electorate* (to solve Tory party infighting), but the *Electorate* ended up binding the *Government*. The theory doesn't handle a scenario where the binding mechanism is weaponized by one faction of Self 1 against another faction of Self 1, mediated by a weak Self 2.
  2.  **Strategic Ambiguity:** A rational Ulysses contract minimizes ambiguity to prevent loopholes. The Leave campaign *maximized* ambiguity to build a coalition. The model cannot explain why a "contract" with undefined terms was treated as binding. It treats the vagueness as a bug; in Brexit, it was a feature that allowed the contract to pass but made it impossible to execute.
  3.  **Institutional Veto Points:** The Ulysses model assumes the agent has the power to bind themselves. In the UK constitution, Parliament is sovereign. The referendum could not legally bind Parliament. The wrangling (the Meaningful Votes, the Benn Act) was the legal "Self" fighting the political "Self." The theory has no variable for constitutional incompatibility.

  ---

  ### 4. Verdict: Confirmation, Anomaly, or Unanticipated Case?

  This is **not a confirmation**, nor is it a simple anomaly. It is a **Category Error**.

  The Ulysses contract is a model of **individual intertemporal choice**. Brexit was a **collective constitutional decision**. Applying the former to the latter exposes the limits of the theory when scaled to democracy.

  *   **Why it's a Category Error:** The theory assumes a unified preference function. Democracies do not have preference functions; they have aggregation mechanisms. When 52% bind 48%, and that 52% contains mutually exclusive sub-groups, the "Self" is a fiction.
  *   **The Unanticipated Element:** The literature assumes the binding mechanism is external (ropes, laws, penalties). It did not anticipate a "Self-Binding" via **social myth**. The "Will of the People" acted as a fictional rope that was stronger than law but weaker than reality.
  *   **The Honest Assessment:** The framework explains the *rhetoric* used by Leavers (we must bind ourselves to prevent backsliding), but it fails to explain the *mechanics* of the failure. The model predicts that if the cost of the commitment becomes too high, the agent will break it. In Brexit, the agent (UK) broke the economic relationship to keep the political commitment, essentially crashing the ship to prove they were tied to the mast.

  **Conclusion:**
  The Brexit referendum was a **Ulysses Contract written in invisible ink.** It functioned as a precommitment device only as long as the details remained obscure. Once the future self (the Government) gained new information about the actual deal (the Backstop, trade barriers), the contract should have been voided under rational choice theory. That it wasn't voided, but instead led to institutional paralysis, suggests that political precommitment operates on a logic of **identity and legitimacy** rather than the **utility and constraint** logic of the Ulysses model. The theory explains why the vote happened; it cannot explain why the binding held even when the mast snapped.
