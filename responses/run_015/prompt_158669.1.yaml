answer: |-
  1. You distinguish between silence, where no record was ever made, and absence, where a record was lost. But in practice, how do you tell them apart when the only evidence that something was never recorded is itself drawn from the records that survive?

  2. *Anticipating your reply that administrative routines leave traces of their own coverage:* If those traces are themselves part of the surviving record, doesn't relying on them merely push the problem back a level? How do you know the ledger isn't silent about the very people it claims to have counted?

  3. Your counter-finding aids rely on confidence ratings, but once a catalog entry is separated from its metadata by citation, indexing, or a downstream database, that rating often drops away. Doesn't rendering absence into a catalogued object launder conjecture into evidence simply by giving it a call number?

  4. *Anticipating your reply that we need better citation standards:* But you cannot control downstream usage. Isn't the risk of reification inherent in the act of cataloguing itself, regardless of the label you attach?

  5. You focus on what was never written, but power also works by over-production: the subordinate who appears everywhere in the archive as reported speech inside someone else's file, voluminously recorded and yet not present. How does your method account for noise that masquerades as signal?

  6. *Anticipating your reply that this is still a form of ventriloquism distinct from non-existence:* If your counter-finding aid describes the *missing* voice, does it risk competing with the *distorted* voice rather than revealing the structural violence of the distortion?

  7. Who gets to write the counter-finding aid? If the archivist determines what documents "should exist," does this practice relocate interpretive authority to the institution rather than dispersing it?

  8. *Anticipating your reply that archivists must lead initially to establish the framework:* If the archivist defines the "should exist," aren't they imposing a narrative structure on the silence itself, effectively deciding which gaps are worthy of mourning?

  9. What would count as the project failing: historians ignoring the aids, or one of them sending a researcher confidently wrong?

  10. *Anticipating your reply that sending a researcher wrong is the greater ethical failure:* If misleading a researcher is the failure, and you are introducing conjecture into the catalogue, would an archive that described its own silences still be recognisable as an archive, or would it have become something closer to an argument?
