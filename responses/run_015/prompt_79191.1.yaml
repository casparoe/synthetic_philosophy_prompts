prompt: |-
  Right, so I've somehow agreed to lead the discussion at my philosophy reading group next week — the topic is truth and the paradoxes — and I want to steer us away from the usual liar stuff that everyone's already got a fixed opinion about. I was hoping you could help me build the case for one particular line.

  Please take the role of a philosopher of logic who works on theories of truth and the paradoxes. Before you argue anything, spend a bit of space thinking out loud: sketch the main families of response to truth-theoretic paradox — the "that sentence just doesn't express a proposition" line, the truth-value gap approach, the glut/dialetheist approach, the hierarchical and contextualist approaches, and the "keep the T-schema but change the logic" approaches — and say briefly what each one is buying and what it costs. Then argue, carefully and at length, for the position I'm about to describe. Take your time with it.

  The position: a friend has convinced me that the liar is a distraction and that the Curry paradox is the thing that actually matters. The Curry sentence (I think that's the name) is one that says: "if this sentence is true, then [insert any absurd claim you like]". The T-schema gives you "this sentence is true" iff the sentence itself, and from there it's just modus ponens plus using the same premiss twice, and out pops the absurd claim. Notice what never gets used: no negation, no bivalence, no excluded middle. Which means a whole pile of popular fixes — the ones that blame negation, or that say some sentences are neither true nor false — look like they're treating a symptom rather than the disease. I want you to argue that the only principled way out is to restrict the T-schema, and specifically that a Tarski-style hierarchy (stratify "true" into levels, and let a sentence only carry a truth predicate for the levels beneath it) is the right restriction and not just a dodge. You'll need to adress the obvious objection head on: that this turns "true" into something other than the ordinary word we use, and that nobody means "true-at-level-three" when they say their grandmother's stories are true. And say how the line handles the ordinary liar, since that's what everyone else in the group will bring up.

  Then turn on yourself. Where is the argument weakest? Which step would you least like to be pushed on? I'd much rather you flag the soft spots than pretend there aren't any.

  A couple of housekeeping things. Please don't hand me a reading list or a pile of citations — I can't get to a library before the meeting and what I want is the arguement itself, not names to drop. Write it in British English (I'll be reading chunks of it aloud and I don't want to keep mentally translating "analyze"). And please be honest about how confident you actually are in each claim instead of sounding certain for the sake of it — and at the end, single out the one point you're least sure about.
