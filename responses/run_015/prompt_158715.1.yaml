answer: |-
  **Document of Adversarial Collaboration on the Liar Paradox**

  **1. Agreed Claims**

  1.  The sentence makes sense. (The sentence "This sentence is not true" is grammatically correct and we understand what it asserts.)
  2.  Standard logic breaks. (The rule that every meaningful sentence must be either true or false does not hold for this sentence.)
  3.  The definition of truth causes this. (The problem comes from the rule that a sentence is true if and only if what it says is the case.)
  4.  We cannot ignore it. (We cannot dismiss the sentence as nonsense without losing the ability to talk about truth generally.)
  5.  Reasoning leads to a crash. (If we use standard steps of reasoning on this sentence, we are forced to accept a contradiction or a breakdown.)

  **2. Disagreements Table**

  | Residual Disagreement | Member 1 (Gap) Formulation | Member 2 (Glut) Formulation | Genuine or Verbal? | The Crux Underneath | Test Sentence | Member 1 Prediction | Member 2 Prediction |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **The Status of the Liar** | The sentence falls into a hole: it is neither true nor false. | The sentence overflows the bounds: it is both true and false. | Genuine | Whether truth is a property that can be missing (absence) or a status that can be overloaded (excess). | "This sentence is not true." | It has no truth value. | It has two truth values. |
  | **The Meaning of "Not True"** | Saying a sentence is "not true" does not force you to say it is false; it might just have no value. | Saying a sentence is "not true" means it is false; since the Liar is false (and true), it is not true. | Genuine | Whether "not true" exhausts all alternatives to "true," or whether there is a middle ground outside true/false. | "The Liar sentence is not true." | This is correct, but the Liar is not false either. | This is correct, because the Liar is false (as well as true). |
  | **The Cost of the Solution** | My view costs us the ability to state the solution in the same language without creating a new paradox. | My view costs us the ability to say that contradictions are always impossible. | Genuine | Whether it is worse to lose the power to describe the gap, or to accept that some contradictions are real. | "The Liar sentence lacks a truth value." | This sentence is itself gappy (cannot be truly said). | This sentence is false (because the Liar has a value, actually two). |
  | **The Conditional Box** | The "If-Then" sentence in the box is gappy, blocking the step that forces the false conclusion. | The "If-Then" sentence is true (and false), but we must block the rule that lets us move from "If" to "Then." | Genuine | Whether we fix the paradox by breaking the truth of the conditional or by breaking the inference rule (Modus Ponens). | Box: [1. "If this sentence is true, then snow is black." 2. "Snow is black."] | Sentence 1 is neither true nor false. | Sentence 1 is true and false; we cannot infer "Snow is black." |

  **3. What Would Count Against Their Views**

  *   **For Member 1 (Gap):** An argument showing that you can consistently say "This sentence is gappy" in the same language without generating a new paradox that the Gap view cannot handle. If Member 1 cannot explain the gap without creating a "Revenge Liar" that breaks their own system, they must move.
  *   **For Member 2 (Glut):** An argument showing that accepting one true contradiction forces you to accept *every* contradiction (e.g., "The moon is made of cheese"). If Member 2 cannot contain the damage so that only specific paradoxical sentences are contradictory, while ordinary facts remain safe, they must move.

  **Analysis of Suspected Cruxes**

  Regarding the three matters you suspected were cruxes: First, on whether "not true" means "false," the table shows this is a genuine disagreement about the logic of negation, not just words; Member 1 sees a middle ground, Member 2 does not. Second, on the conditional box (Curry's Paradox), this is a genuine logical divergence; Member 1 must make the conditional gappy to stop the inference, while Member 2 must keep the conditional true but block the inference rule itself. Third, on the contingent card and plaque, this is *not* a disagreement between the two members; both agree that if the plaque matches the card, it becomes a Liar, and if it does not, it is simply true or false based on the facts. They agree against Classical Logic here, so this does not divide them.

  **Verdicts on New Cases**

  **(a) Box: "Exactly one of the sentences in this box is true" and "Snow is white."**
  *   **Member 1 (Gap):** The first sentence has no truth value. "Snow is white" is true. Since the first sentence has no value, it is not the case that exactly one is true (because 1 + 0 is not 1 in this logic), so the first sentence is correctly not-true, but since calling it false makes it true, it remains gappy.
  *   **Member 2 (Glut):** The first sentence is both true and false. "Snow is white" is true. If the first sentence is true, then exactly one is true—but since it is also false, we count it as true for the count, making two true sentences, which makes the sentence false. It is a stable contradiction.

  **(b) Box: "Most of the sentences in this box are not true," "Snow is white," and "Snow is black."**
  *   **Member 1 (Gap):** The first sentence has no truth value. "Snow is white" is true; "Snow is black" is false. If the first sentence is gappy, it is not true. So we have two sentences that are "not true" (the first and the third). "Most" (2 out of 3) are not true. This makes the first sentence true. But if it is true, it is not "not true." The status oscillates, so it settles on no value.
  *   **Member 2 (Glut):** The first sentence is both true and false. It is false because "Snow is white" is true (so not all are not true). It is true because it is itself false and "Snow is black" is false, making 2 out of 3 "not true." It satisfies the condition of being true by being false.

  **(c) The single sentence: "This sentence is not true, and it is not the case that this sentence is neither true nor false."**
  *   **Member 1 (Gap):** This sentence also has no truth value. Member 1 must treat this "Revenge Liar" exactly like the original. Even though it claims not to be gappy, the logic that makes the original gappy applies here too, so the claim that it is "not gappy" is the part that fails to hold a value.
  *   **Member 2 (Glut):** This sentence is both true and false. It is true because it is false (so "not true" holds) and it is not gappy (so the second part holds). It is false because it is true (so "not true" fails). It is a complex contradiction.

  **On the Third Member and the Nature of the Dispute**

  The two signatories take themselves to have set aside the "levels or orders" view because it requires us to speak about truth from a higher language that we cannot access; they insist on solving the problem within the language we actually use. The dispute between Member 1 and Member 2 is not merely about what property sentences have, but fundamentally about what a theory of truth is for: Member 1 treats truth as a descriptive property that sentences can lack, prioritizing the consistency of the world, while Member 2 treats truth as a normative status for assertion, prioritizing the expressibility of the language. The row in the table regarding "The Cost of the Solution" reveals that their core disagreement is about whether we should sacrifice the ability to describe the paradox (Member 1) or the rule that contradictions are impossible (Member 2).
