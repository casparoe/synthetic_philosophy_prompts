answer: |-
  Here is the translation of the interpersonal utility comparison (ICU) dispute into psychometric vocabulary, followed by the residue report and the decision analysis you requested.

  ### Part 1: Translation of Positions

  I will work with your formalization: for each person $i$, utility is $u_i$, identified only up to $\alpha_i + \beta_i u_i$ with $\beta_i > 0$.

  **1. Ordinalism (The Skeptical Position)**
  *   **Psychometric Translation:** Each person $i$ has a latent trait $\theta_i$, but there is no linking design between persons. Each person's scale is identified independently (e.g., by fixing their own mean and variance to 0 and 1). There are no anchor items, no common population constraints, and no linking function $L_{ij}$ that maps scale $i$ to scale $j$.
  *   **What Translates Cleanly:** The claim that only within-person orderings are meaningful maps perfectly to the claim that without linking, $\theta_{iA} > \theta_{iB}$ is meaningful, but $\theta_{iA} > \theta_{jA}$ is not.
  *   **Distortion:** In IRT, we usually assume a *common* item response function (IRF) structure across persons (measurement invariance). Ordinalism often denies that there is a common latent trait structure at all, implying that the "construct" itself might differ across persons, not just the scale parameters.
  *   **Cannot Be Said:** You cannot sum or average $\theta$ estimates across persons. Any social welfare function $W = \sum f(u_i)$ is undefined because the arguments are on incommensurable scales.

  **2. Unit Comparability (Cardinal Unit Comparability)**
  *   **Psychometric Translation:** The unit parameters $\beta_i$ are constrained to be equal across persons (or known ratios), but the origin parameters $\alpha_i$ are free. In IRT terms, the variance of the latent trait is fixed to be the same across groups, but the means are free to vary.
  *   **What Translates Cleanly:** Differences (gains/losses) are comparable. $\Delta u_i \sim \Delta u_j$. This is analogous to comparing gain scores or growth metrics across groups where the metric of growth is standardized, but the baseline proficiency is not.
  *   **Distortion:** In psychometrics, fixing the variance is a standard identification constraint. In philosophy, this is a substantive claim that a "unit of happiness" is the same size for you and me.
  *   **Cannot Be Said:** You cannot compare absolute levels. You cannot say "she is happier than him," only "she gained more than he did."

  **3. Level Comparability (Non-Cardinal Level Comparability)**
  *   **Psychometric Translation:** The origin parameters $\alpha_i$ are constrained to be equal (e.g., all means fixed to 0), but the units $\beta_i$ are free.
  *   **What Translates Cleanly:** You can compare absolute locations on the scale (who is higher), but not the distance between points.
  *   **Distortion:** This is rare in psychometrics. Usually, if you fix the origin, you also fix the unit to identify the scale. Fixing only the origin implies a logarithmic or non-linear transformation capability that preserves order and zero-point but not intervals.
  *   **Cannot Be Said:** You cannot aggregate gains. Utilitarian summation is not invariant to changes in $\beta_i$.

  **4. Full Comparability (Cardinal Full Comparability)**
  *   **Psychometric Translation:** Both $\alpha_i$ and $\beta_i$ are fixed across persons. This is a fully linked, common metric (e.g., all persons calibrated to the same reference population with mean 0, variance 1).
  *   **What Translates Cleanly:** $u_i$ and $u_j$ are on the same logit scale. Sums and averages are mathematically well-defined.
  *   **Distortion:** In IRT, this is achieved by design (anchor items, common calibration). In philosophy, this requires a metaphysical or empirical justification for why the "zero" and "unit" of utility are natural kinds rather than conventions.
  *   **Cannot Be Said:** Nothing is excluded; this is the psychometrician's ideal state of measurement.

  **5. The Zero-One Rule**
  *   **Psychometric Translation:** A sample-dependent normalization where the minimum observed score for person $i$ is set to 0 and the maximum to 1.
  *   **What Translates Cleanly:** It is a specific identification constraint.
  *   **Distortion:** In psychometrics, this is known to be unstable. The min/max are statistics of the sample, not parameters of the latent trait. If the population distribution shifts (e.g., a policy makes everyone slightly happier), the "0" and "1" shift, changing the scale values for everyone.
  *   **Cannot Be Said:** That this normalization preserves the "true" magnitude of utility. It compresses the scale based on range, distorting density.

  **6. Extended Sympathy (Harsanyi's Impartial Observer)**
  *   **Psychometric Translation:** A linking design using a single "judge" as the anchor. The judge responds to items (situations) for Person $i$ and Person $j$. The judge's utility function serves as the common scale.
  *   **What Translates Cleanly:** This is exactly Common-Item Nonequivalent-Groups (CING) equating. The "items" are the life situations; the "groups" are the different people being evaluated; the "judge" is the linking instrument.
  *   **Distortion:** In CING, the anchor items are assumed to function the same way for both groups. Here, the "item" is the judge's imagination, which may function differently when simulating Person $i$ vs. Person $j$.
  *   **Cannot Be Said:** That the linking is objective. It relies on the judge's psychology being a stable metric.

  ---

  ### Part 2: Residue Report

  Here is the analysis of the friction points where the translation strains or reveals something new.

  #### 1. Zero-One Rule vs. Reference-Population Standardization
  **The Discrepancy:** In your work, choosing a reference population (mean 0, var 1) is a convention. If you switch to a different reference group, you apply a linear transformation to the $\theta$ estimates, and all substantive conclusions (e.g., Person A is above Proficiency Level 3) remain invariant because the *cut scores* transform with the scale.
  In the utility case, changing the normalization (e.g., from Reference Pop to Zero-One) changes the policy ranking.
  **The Diagnosis:** This is because the **aggregation function is not invariant** under affine transformations, whereas your psychometric conclusions are.
  *   In IRT, you compare $\theta$ to a threshold $\tau$. If $\theta' = a + b\theta$, you set $\tau' = a + b\tau$. The decision $ \theta > \tau $ is invariant.
  *   In Welfare Economics, the function is often $W = \sum u_i$. If $u_i' = a_i + b_i u_i$, then $W' = \sum a_i + \sum b_i u_i$. Unless $a_i=0$ and $b_i=1$, $W$ and $W'$ rank policies differently.
  **Conclusion:** The philosophical dispute **is** a measurement dispute, specifically about **identification constraints required for the aggregation operator**. The invariance class of the *measurement* (ordinal) is narrower than the invariance class required for the *aggregation* (cardinal full comparability). The dispute arises because economists want to use an aggregation operator (summing) that demands more identification than the measurement model (preference orderings) provides.

  #### 2. Extended Sympathy as Common-Item Equating
  **The Anchor:** The "anchor" is the judge's capacity for sympathy/imagination.
  **Symmetry and Transitivity:** In CING equating, linking functions are transitive ($Scale_A \to Scale_B \to Scale_C$). In extended sympathy, this is empirically dubious. My simulation of you simulating me may not equal my simulation of me.
  **The Objection (Contamination):** The objection that "my psychology contaminates the simulation" is best expressed as **Differential Item Functioning (DIF)**.
  *   The "item" is the scenario "Being Person $i$ in Situation $S$."
  *   DIF occurs if the probability of the judge registering "high utility" for this item depends on the *group* (which person is being simulated) beyond the latent utility level.
  *   If the judge's own risk attitudes bias the simulation of Person $i$ differently than Person $j$, the linking function is not stable.
  **Identification:** It is a failure of identification if the DIF is unmodeled. If the "anchor item" (the judge) drifts, the scale is not pinned down. Measurement theory has a name for this: **Linking Error** or **Anchor Misfit**.

  #### 3. Is There a Measurement Model for Utility?
  **Revealed Preference:** If utility is defined by choice, there is no measurement model. There is no error, no latent trait, no indicators. It is a tautology ($A$ is chosen $\iff U(A) > U(B)$). Psychometrics applies vacuously.
  **Self-Report/Well-being:** If utility is indicated by survey items (e.g., "How satisfied are you?"), then **yes**, there is a measurement model.
  *   **Convergence:** When philosophers claim self-reports are invalid due to "adaptation" (hedonic treadmill) or "scale use" (some people never use '10'), they are making a **Measurement Invariance** claim. They are arguing that the item threshold parameters $\tau$ vary across persons or time in a way that violates the model assumptions.
  *   **Verdict:** This is a **genuine convergence**. The philosophical skepticism about self-reports is technically a hypothesis of non-invariance (DIF) across populations or time.

  #### 4. The Reverse Direction (What is Missing)
  **What Philosophy Has (Psychometrics Lacks):**
  *   **Normativity of Identification:** In psychometrics, fixing the mean to 0 is arbitrary. In philosophy, fixing the zero-point can be **unfair**. (e.g., Setting the "zero" of utility at subsistence level vs. setting it at death). The choice of constraint has ethical weight, not just statistical convenience.
  *   **Constitutive vs. Indicative:** Utility is often defined *by* the preference, not measured *by* it. Psychometrics assumes the trait exists independently of the indicator.
  *   **Aggregation:** The step from $u_i$ to Social Welfare is normative. Psychometrics stops at the individual $\theta$; it has no model for summing $\theta$ across people to make a decision.

  **What Psychometrics Has (Philosophy Lacks):**
  *   **Graded Comparability:** Philosophy often treats comparability as binary (possible or impossible). Psychometrics offers **Partial Invariance**. You can link scales even if some items show DIF, provided enough anchors hold.
  *   **Testable Invariance:** Philosophy argues metaphysically about whether comparison is *possible*. Psychometrics tests whether it *holds* in the data (fit statistics, chi-square tests for invariance).
  *   **Linking Technology:** We have methods (Stocking-Lord, Mean/Mean) to link scales that were not originally designed to be linked, with quantified standard errors. Philosophy lacks a mechanism for "linking with error."

  ---

  ### Part 3: The Decision (0-10 Self-Report Item)

  **The Question:** Can a single self-report item (0-10) be averaged and summed across individuals and compared between groups for policy evaluation?

  **1. The Psychometric Answer (Framework Consequences)**
  **No, not without untested and likely false assumptions.**
  *   **Identification:** To average and sum, you require **Full Comparability** ($\alpha_i$ and $\beta_i$ fixed across all respondents).
  *   **Evidence:** A single item provides no degrees of freedom to test for measurement invariance. You cannot separate the person parameter from the item threshold.
  *   **DIF:** It is empirically established in survey methodology that response scales (0-10) exhibit massive DIF across cultures, ages, and personalities (e.g., reference group effects, scale compression). Person $A$'s "7" is not Person $B$'s "7".
  *   **Error:** A single item has no reliability estimate. You are treating $X_{obs}$ as $\theta_{true}$. The standard error of measurement is unknown.
  *   **Conclusion:** Within the framework of measurement theory, this practice treats an ordinal, person-specific scale as a cardinal, common scale without identification constraints. It is statistically indefensible.

  **2. The "Real World" Answer (My View)**
  **The practice must be justified outside measurement theory.**
  *   **Pragmatics:** Policy committees often lack the resources for multi-item batteries or linking designs. The 0-10 item is a "heuristic metric."
  *   **Justification:** You cannot justify this psychometrically. You must justify it **pragmatically** or **politically**. You are effectively declaring a convention: *"For the purposes of this policy, we stipulate that a '7' is the same for everyone."*
  *   **Risk:** This is not a measurement claim; it is a **normative stipulation**. It is equivalent to defining a "standard hour of labor" without measuring productivity.
  *   **Recommendation:** If you must do this, acknowledge the identification constraint explicitly. State: *"We are assuming level and unit comparability across groups. We acknowledge this is an untested assumption required for aggregation."* Do not claim the sums represent "true total utility." Claim they represent "aggregate self-report scores under a convention of comparability."

  **Summary:** The philosophical dispute is indeed a measurement dispute about identification constraints. However, your field treats those constraints as technical conventions to enable measurement, whereas the policy context treats them as substantive claims about human equality. The 0-10 averaging practice fails the psychometric test but may pass the political necessity test, provided the measurement error is acknowledged as a source of bias rather than noise.
