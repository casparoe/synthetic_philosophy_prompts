answer: |-
  First off, take a deep breath. It is completely understandable that you are spiraling. When trust is broken in an intimate situation, it shakes your sense of safety and agency. You are not overreacting, and this is not "just awkward."

  Here is an outside take on the situation, broken down by the questions you're asking.

  ### 1. "Does that mean I didn't really say yes?"
  This is the heaviest question. Legally, the definition of consent varies by location, and unfortunately, lies about status or testing don't always invalidate consent in the eyes of the law. **However, ethically and personally, the answer is different.**

  Consent is supposed to be **informed**. When you said "yes," you were agreeing to a specific set of circumstances: *a single partner who has recently confirmed they are STI-free.*
  *   He changed the circumstances without telling you.
  *   You agreed to Scenario A; he delivered Scenario B.

  So, while you did verbally agree to the act, your agreement was based on false data. It is valid to feel that your consent was compromised because you were denied the information needed to make a safe choice for your body and your heart. You didn't say yes to *him* as he actually is; you said yes to the *version of him he presented.*

  ### 2. Where is the line?
  You asked where the line is between a "little lie" and something that undoes the agreement. A good way to draw that line is by asking: **"If I had known this truth beforehand, would it have been a dealbreaker?"**

  *   **Trivial Lies:** "I'm 5'10" (actually 5'9")," or "I love hiking" (actually they prefer walking). These are annoying, but usually don't change the fundamental safety or emotional context of the hookup.
  *   **The Line (Dealbreakers):** Anything regarding **Safety** or **Core Boundaries.**
      *   **Sexual Health:** This is a hard line. A test from a year ago is not "clean." A lot can happen in a year. By saying he "just got tested," he minimized your risk assessment. That is a safety violation.
      *   **Relationship Status:** If you have a boundary against sleeping with people who are emotionally entangled or living with exes, that is a core boundary. Lying about being "single" removes your ability to enforce that boundary.

  In your case, he lied about **both** safety and boundaries. That is not a "little lie." That is fundamental misinformation.

  ### 3. Why you're spiraling
  You're spiraling because your gut is telling you that you weren't respected.
  *   **The Health Risk:** Finding out a partner wasn't honest about testing can trigger anxiety about your physical well-being.
  *   **The Manipulation:** He knew the truth (that the test was old and the living situation was messy) and he knew that telling you the truth might stop you from saying yes. So, he chose to prioritize his desire over your right to choose. That feels violating because it *is* selfish.

  ### 4. What to do now
  To stop the spiral, you need to move from "questioning myself" to "taking care of myself."

  *   **Prioritize Your Health:** If it has been a year since his test, his status is effectively unknown. Please make an appointment to get tested yourself for peace of mind. Knowing your status puts the control back in your hands.
  *   **Stop Blaming Yourself:** Do not let yourself think, "I should have asked more questions." The burden of honesty is on him. He volunteered information to make you feel safe, and that information was false.
  *   **Cut Contact:** You don't owe him a conversation, but if you need closure for yourself, you can send a brief text: *"I found out the information you gave me about your testing and relationship status wasn't accurate. I'm not comfortable continuing any contact."* Then block him. You don't need to hear his excuses.
  *   **Reclaim Your Agency:** Remind yourself: *"I made the best decision I could with the information I was given. The fact that the information was wrong is on him, not me."*

  ### The Bottom Line
  You are not crazy. Lying about sexual health and relationship availability are two of the biggest breaches of trust in casual dating. It is okay to feel violated by that.

  You said yes to a safe, single encounter. You did not say yes to a risky, complicated one. Trust your gut on this one: the line was crossed. Focus on your health and your peace, and let him go.
