answer: |-
  **Title:** The Substrate Trap: Why Layering the Primary Intension Collapses Two-Dimensionalism

  **Introduction**

  The central ambition of two-dimensional (2D) semantics is to reconcile two seemingly incompatible insights: Kripke's discovery that identity statements like "Water = H2O" are necessary yet a posteriori, and the Fregean intuition that meaning must have some connection to cognitive significance or epistemic access. In the standard Chalmersian framework, this is managed by distinguishing the primary intension (what a term picks out given a world considered as *actual*, accessible from the armchair) from the secondary intension (what a term picks out given a world considered as *counterfactual*, holding the actual world fixed).

  Your proposed modification—splitting the primary intension into a "surface" layer (armchair accessible) and a "substrate" layer (reference-fixing but pre-empirical)—is a creative attempt to shore up a known weakness in 2D semantics. The weakness is this: if the primary intension is purely superficial (e.g., "clear, drinkable liquid"), it fails to pick out water in Twin Earth scenarios; if it is deep (e.g., "H2O"), it is no longer a priori. Your "substrate" attempts to be the bridge: deep enough to fix reference, but pre-empirical enough to remain epistemic.

  However, this essay argues that this layered modification is self-defeating. By attributing reference-fixing power to a "substrate" that operates pre-empirically, you inadvertently import the metaphysical machinery of direct reference into the epistemic domain. This collapses the distinctive explanatory work of 2D semantics into a disguised version of Kripkean direct reference. Two-dimensionalism survives only if we reject the substrate layer and accept that the primary intension is purely epistemic and *does not* metaphysically fix reference across worlds.

  **The Standard Framework and the Temptation of Layering**

  To see why the layering fails, we must first be precise about what the primary intension is supposed to do. In Chalmers' framework, the primary intension captures the epistemic content of a term. It answers the question: "Given a world considered as actual, what does this term refer to?" For "water," the primary intension might be something like "the dominant clear, drinkable liquid in the oceans." This is knowable a priori because it relies on the conceptual role of the term, not on chemical analysis.

  The secondary intension captures the metaphysical content. Once we discover that water is H2O in the actual world, the secondary intension picks out H2O in all possible worlds. This explains the necessary a posteriori status of "Water = H2O."

  The temptation to add a "substrate" layer arises from the fear that the surface primary intension is too weak. If the primary intension is just "clear liquid," then on Twin Earth (where XYZ fills that role), the primary intension picks out XYZ. But we want to say that when an Earthling says "water," they mean H2O, even before they know chemistry. You propose that beneath the surface description lies a substrate that "fixes reference across worlds but still operates pre-empirically." This sounds like an attempt to give the primary intension the modal strength of the secondary intension without requiring empirical investigation.

  **The Collapse into Direct Reference**

  The fatal flaw in this layered view lies in the function you assign to the substrate: "fixing reference across worlds." In the philosophy of language, the mechanism that fixes reference across possible worlds is precisely what defines a rigid designator in the Kripkean sense. Kripke argued that reference is fixed by a causal-historical chain or by ostension, not by descriptions known a priori.

  If your substrate layer fixes reference across worlds, it is functioning as a rigid designator. If it operates "pre-empirically," you are claiming that speakers have a priori access to this rigidifying mechanism. This creates a dilemma:

  1.  **If the substrate is accessible from the armchair:** Then it must be descriptive. But if it is descriptive, it cannot guarantee reference to H2O across all worlds (due to Twin Earth). A description like "the underlying essence of this liquid" is empty without empirical input to tell you what that essence is. If the substrate is just a placeholder for "whatever science discovers," it doesn't fix reference; it defers it.
  2.  **If the substrate fixes reference to H2O specifically:** Then it is not accessible from the armchair. It requires empirical knowledge to distinguish H2O from XYZ. Claiming it is "pre-empirical" in this case is simply asserting a magical epistemic access to metaphysical essences.

  By insisting the substrate fixes reference *across worlds*, you are effectively moving the secondary intension's job into the primary intension. But because you want to keep it "pre-empirical," you strip away the empirical justification that makes the secondary intension work. The result is a view that looks like 2D semantics on the surface but operates like direct reference underneath. The "surface" layer becomes epiphenomenal—a decorative cognitive gloss that does no semantic work. The "substrate" does all the heavy lifting, and since it fixes reference metaphysically, it is indistinguishable from a Kripkean rigid designator.

  **The Explanatory Cost**

  The primary virtue of 2D semantics is that it explains *why* "Water = H2O" feels informative. It feels informative because the primary intensions of "water" and "H2O" differ (one is "clear liquid," the other is "chemical compound"), even though their secondary intensions are identical.

  Your layered view undermines this explanation. If the substrate layer of "water" already fixes reference to H2O pre-empirically, then the identity "Water = H2O" should be a priori, because the substrate of "water" and the concept "H2O" would align before empirical investigation. But "Water = H2O" is *not* a priori. To maintain that it is a posteriori, you must admit that the substrate does *not* reveal H2O pre-empirically. But if the substrate doesn't reveal H2O, how does it fix reference to H2O across worlds?

  You cannot have it both ways. You cannot claim the substrate fixes reference to a specific natural kind (metaphysical work) while remaining opaque to empirical investigation (epistemic constraint). Attempting to do so hides the mystery of reference fixation inside the "substrate" box rather than solving it. It posits a mechanism that is metaphysically robust but epistemically invisible, which is theoretically costly. It violates the principle of parsimony: why posit a hidden substrate when we can simply admit that reference fixing is an externalist, metaphysical process (the secondary intension) that is distinct from epistemic content (the primary intension)?

  **The Verdict**

  Does this layered version save two-dimensionalism? No. It collapses it.

  The split between surface and substrate is self-defeating because it attempts to merge two distinct semantic dimensions that 2D semantics was designed to keep apart. The primary intension is supposed to track epistemic possibility (what we can conceive); the secondary intension is supposed to track metaphysical possibility (what is possible given the nature of things). By adding a reference-fixing substrate to the primary intension, you blur this line. You end up with a view that claims to explain epistemic access but relies on metaphysical reference-fixing to do the work.

  Two-dimensionalism survives only if we drop the surface/substrate split. We must accept that the primary intension is *purely* epistemic and descriptive, even if that means it fails to pick out the "real" essence in Twin Earth scenarios. That failure is not a bug; it is a feature. It explains why we can be ignorant of the essence of water while still meaning something by the term. The reference fixing is handled entirely by the secondary intension (the externalist component).

  If you retain the substrate, you are no longer doing 2D semantics; you are doing direct reference theory with an extra step that adds no explanatory value. The machinery of 2D semantics does real work only when the two dimensions remain distinct. The moment you try to make the epistemic dimension do metaphysical reference-fixing work via a "substrate," the framework implodes. The mystery of how we refer to natural kinds is not solved by hiding a rigid designator inside a descriptive intension; it is solved by acknowledging that reference is partly outside the head. Your layered proposal tries to pull it back inside, and in doing so, breaks the machine.
