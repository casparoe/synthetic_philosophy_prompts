      *   *Tension D: (4) Expectations vs. (1) Dictionary/Corpus.*
          *   (1) & (3) rely on semantic evidence (corpus, dictionary).
          *   (4) relies on expected *application* (ambulance in park).
          *   *Severity:* Low/Medium. Often these align, but sometimes semantic meaning is broad while expected application is narrow. This is the "construction vs. interpretation" debate.
          *   *Defense:* This isn't necessarily inconsistent if framed as "context informs meaning."

      *   *Tension E: (6) Avoidance/Clear Statement vs. (1) Fixed Meaning.*
          *   (6) says "don't read it this way unless clear."
          *   (1) says "read it how the words convey."
          *   *Severity:* Medium. Avoidance can distort the meaning of the words to save the statute. It's a substantive canon overriding semantic meaning.

      *   *Tension F: (10) Rationale vs. (5) & (9).*
          *   (10) claims the package constrains judges and respects democracy.
          *   (5) & (9) give judges significant discretion to decide what is "absurd" or what the "purpose" is.
          *   *Severity:* High. This undermines the core justification.

  4.  **Drafting the Audit (Iterative Process):**

      *   *Structure:*
          1.  Executive Summary (Validating the friend's concern but refining it).
          2.  Ranked Tensions (High, Medium, Low).
          3.  The "False Tensions" (Defending against the friend).
          4.  The Smuggling Check.
