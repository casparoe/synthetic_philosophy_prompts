      *   **The Abstaining Provinces:** The corporate agency problem. Can Meridia speak if two provinces opt out?
      *   **The Practical Stakes:** Adeyemi argues "acknowledgment" prevents the substitution of words for land. Villanueva counters that the label matters for the victims.
      *   **The Tessin Demand:** Adeyemi addresses the victims' wish for the word "apology" without conceding the metaphysical point.
      *   **Conclusion:** Acknowledge the impasse. Villanueva cares about the *effect*, Adeyemi cares about the *truth condition*.

  4.  **Refining the Arguments (Self-Correction during drafting):**
      *   *Check:* Did I make Adeyemi sound like he doesn't care about repair? *Correction:* Need to ensure he emphasizes that "acknowledgment-plus-repair" is *good*, just not an *apology*.
      *   *Check:* Did I include the 1823 regress? *Correction:* Make sure Villanueva has a response, even if it's "bite the bullet" or "constitutional continuity." Let's go with constitutional continuity as the brake.
      *   *Check:* The abstaining provinces. This is tricky. If they abstained, did the state speak? Villanueva needs to argue majority rule binds the whole. Adeyemi needs to argue that moral responsibility can't be voted on.
