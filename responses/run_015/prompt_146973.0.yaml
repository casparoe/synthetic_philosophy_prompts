  *(Self-Correction on the Ending)*: The prompt asks for "some partial convergence, or at least a clean statement of what's actually doing the work." I'll aim for the latter. They agree on the *action* but disagree on the *label*, and why the label matters is the real fight.

  7.  **Final Review against constraints:**
