          *   *Adeyemi:* Apology requires first-personal ownership/continuity of agency. This is "acknowledgment-plus-repair." Calling it an apology is a fudge.
          *   *Descent/Ancestry:* Does the MP's mixed heritage matter? Villanueva says political "we" matters more.
          *   *Regress Worry (Adeyemi to Villanueva):* If benefit grounds standing, where does it stop? (1823 chartered company?)
          *   *Abstaining Provinces:* Can a corporate agent speak if part is silent? Are they bound?
          *   *Practical Loss (Adeyemi):* What's lost by calling it "acknowledgment"? Substitution worry (words + check vs. land).
          *   *Tessin Demand:* Tessin reps demanded an *apology* specifically. Adeyemi needs to address this.
      *   **Tone:** Loose, casual, tired but respectful, long-time interlocutors. No strawmen.
      *   **Ending:** Honest convergence or clear statement of the disagreement.

  2.  **Character Voices:**
      *   **Villanueva:** Pragmatic, focused on political function and social cohesion. Sees language as a tool for binding the community. Slightly exasperated by semantic purity.
      *   **Adeyemi:** Analytic, focused on moral agency and conceptual precision. Worried about cheapening the term "apology." Slightly exasperated by functionalist hand-waving.

  3.  **Drafting - Section by Section:**

