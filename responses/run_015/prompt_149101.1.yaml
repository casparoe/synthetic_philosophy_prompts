prompt: |-
  hey i need last minute help. tommorow im presenting my senior philosophy project to a small panel and i'm worried about the Q&A part.

  My thesis is this: when you're not sure which moral theory is true (utilitarianism vs. "don't use people as a means" style rules vs. more character/virtue stuff), you shouldn't just multiply your credence in each theory by how good the outcome looks on it and add it all up, like the expected-choiceworthiness people do. I say use what I call the spread rule instead: pick the option whose *ranking* is most stable across the theories you give more than, say, 10% credence to. So an option that comes out third-best no matter which theory is right beats one that's amazing on utilitarianism and dead last on everything else. I use it to argue that morally uncertain people should split their time and money across really different kinds of causes instead of doubling down on whatever looks best on their favorite theory.

  The room is: my school's Ethics Bowl team (they argue from cases and stakes and are basically intuitionists without calling it that), my AP Bio teacher who's really into effective altruism and wants everything turned into numbers, and the debate coach who only cares whether any of this changes what a normal person should actually do on Monday.

  Can you make me a prep sheet? The objections I'll really get from these people, in their own vocabulary, ordered by how much damage they'd do, each with a short comeback and a note on were my answer is soft. Plus the one question I'm hoping nobody asks.
reasoning: |-
  Here's a thinking process that leads to the suggested prep sheet:

  1.  **Analyze the User's Request:**
      *   **Task:** Create a prep sheet for a senior philosophy project presentation Q&A.
      *   **Topic:** Moral Uncertainty. The user rejects "Expected Choiceworthiness" (maximizing expected value across theories) in favor of a "Spread Rule" (ranking stability across theories with >10% credence). This leads to diversification of causes (time/money) rather than maximizing on the most likely theory.
      *   **Audience/Panel:**
          1.  *Ethics Bowl Team:* Case-based, intuitionist, care about stakes/practical outcomes.
          2.  *AP Bio Teacher:* Effective Altruist (EA), wants numbers/quantification, likely favors Expected Choiceworthiness (EC).
          3.  *Debate Coach:* Pragmatist, cares about action-guidance for "normal people."
      *   **Format:** Objections ordered by damage potential, with comebacks, notes on weaknesses ("soft spots"), and one "dreaded question."
      *   **Tone:** Urgent ("last minute help"), practical, strategic.

  2.  **Deconstruct the Thesis ("The Spread Rule"):**
      *   *Core Claim:* Don't maximize expected moral value (EMV/EC). Instead, look for ranking stability across plausible theories (>10% credence).
      *   *Implication:* Diversify moral portfolio (don't put all eggs in one basket).
      *   *Potential Weaknesses:*
          *   How do you rank options *within* a theory? (Inter-theoretic comparison problem).
          *   Why 10%? (Arbitrary threshold).
          *   What if the "stable" option is catastrophically bad on the *true* theory? (Risk aversion vs. maximization).
          *   Does this actually help a "normal person"? (Action guidance).
          *   Is this just hedging? (Does it collapse back into EC anyway?).

  3.  **Drafting Objections based on Panelists:**

      *   *AP Bio Teacher (EA/Numbers):* Will attack the lack of quantification. Why not maximize expected good? The "Spread Rule" seems inefficient. If Utilitarianism is 90% likely, why waste resources on Deontology?
          *   *Damage:* High. Undermines the core mathematical argument.
          *   *Counter:* Risk management. Moral error is costly.
          *   *Soft Spot:* Admitting you can't quantify "moral error."

      *   *Ethics Bowl Team (Intuitionists/Cases):* Will bring a specific case where the Spread Rule gives a counter-intuitive result. E.g., A stable option is "okay" but a risky option saves lives.
          *   *Damage:* High. Shows the theory fails in practice.
          *   *Counter:* Stability prevents moral disasters (e.g., sacrificing one to save five might be unstable).
          *   *Soft Spot:* Defining "ranking" across different theories.

      *   *Debate Coach (Pragmatist):* Is this actionable? Do normal people have credences? Does this just tell them to "do a bit of everything"?
          *   *Damage:* Medium. Questions relevance.
          *   *Counter:* It validates pluralistic giving/volunteering.
          *   *Soft Spot:* The cognitive load of calculating rankings.

  4.  **Ordering by Damage:**
      1.  *The Inter-theoretic Comparison Problem (EA/Bio Teacher):* If you can't compare rankings across theories, the whole system collapses. This is the technical kill-shot.
      2.  *The "Catastrophe" Objection (Ethics Bowl):* If the stable option is mediocre but the risky option prevents suffering, your rule looks cowardly or immoral.
      3.  *The Arbitrariness of 10% (All):* Why 10%? Why not 5%? This looks like a fudge factor.
      4.  *Action Guidance (Debate Coach):* Is this actually useful?

      *Refining the Order:* The EA teacher's objection about efficiency vs. diversification is probably the most direct attack on the *conclusion* (don't double down). But the *methodological* attack (how do you compare rankings?) is more fundamental. Let's combine the EA teacher's numerical skepticism with the fundamental comparison problem for the #1 spot.

  5.  **Drafting the Content (Iterative refinement):**

      *   *Objection 1 (The EA/Bio Teacher):* "Inefficiency." If you're 60% Utilitarian, maximizing EC saves more lives. Your rule sacrifices lives for 'moral security.'
      *   *Objection 2 (Ethics Bowl):* "The Trolley Case." What if the 'stable' option lets people die, but the 'risky' Utilitarian option saves them? Your rule forbids saving them because Deontology ranks it low.
      *   *Objection 3 (Debate Coach):* "Cognitive Load." Normal people don't have credence distributions. How do they use this?
      *   *The Dreaded Question:* "Is this just Rule Utilitarianism in disguise?" or "How do you normalize rankings?" Let's go with the normalization issue. It's the technical Achilles heel.

  6.  **Refining the "Comebacks" and "Soft Spots":**
      *   Need to be honest. The user asked for "where my answer is soft." Don't gaslight them.
      *   *Comeback 1:* Focus on *moral risk*. Being wrong in morality is worse than being inefficient.
      *   *Comeback 2:* Focus on *regret*. If you violate a deontological constraint and Utilitarianism turns out false, you've done something unforgivable.
      *   *Comeback 3:* It's a heuristic, not a calculator.

  7.  **Final Review against Constraints:**
      *   Prep sheet format? Yes.
      *   Ordered by damage? Yes.
      *   Vocabulary matched to panelists? Yes (EA terms, Case terms, Pragmatic terms).
      *   Short comeback + Soft spot note? Yes.
      *   One dreaded question? Yes.

  8.  **Polishing the Tone:** Keep it punchy. It's last minute. They need to scan this quickly. Use bolding for key points.

      *(Self-Correction during drafting)*: Make sure I explicitly mention the "10% credence" threshold in the objections, as that's a specific vulnerability. Also, ensure the "Spread Rule" name is used consistently.

      *(Refining the Dreaded Question)*: The hardest technical question for moral uncertainty is usually "How do you compare utilities across theories?" (The Intertheoretic Comparison Problem). Since the user is using *rankings* instead of *utilities*, the question becomes "How do you compare *rankings*?" (e.g., is 1st place in Deontology better than 1st place in Virtue Ethics?). I'll frame the dreaded question around the *normalization* of those rankings.

  9.  **Final Output Generation** (Proceed to generate response based on these thoughts).
answer: |-
  Here is your emergency Q&A prep sheet. It is ordered by how likely the objection is to derail your thesis.

  ### 1. The "Moral Efficiency" Attack
  **Who:** AP Bio Teacher (Effective Altruist)
  **The Objection:** "If I'm 60% credence in Utilitarianism, Expected Choiceworthiness (EC) tells me to maximize lives saved. Your 'Spread Rule' tells me to divert resources to less effective causes just to feel morally safe. Aren't you essentially arguing that it's better to be *less good* overall just to hedge your bets? Isn't that selfish?"
  **Damage:** **Critical.** This attacks the core consequence of your thesis.
  **Your Comeback:** "It's not about safety; it's about **moral risk management**. In finance, you don't put 100% of your retirement into the asset you think is *most likely* to grow, because if you're wrong, you're ruined. In morality, if you're wrong about Utilitarianism, you might commit a grave rights violation. The cost of being 'morally bankrupt' on the true theory outweighs the cost of being 'slightly less efficient' on the false one."
  **Where Your Answer is Soft:** You haven't defined the "cost" of moral error. The EA will ask for the math on why a rights violation weighs more than 100 lives saved. You don't have that math. **Pivot:** Admit you can't quantify it, but argue that *lexically* violating constraints is worse than sub-optimizing outcomes.

  ### 2. The "Trolley Problem" Trap
  **Who:** Ethics Bowl Team
  **The Objection:** "Imagine a case where Option A saves 1,000 lives (ranked #1 by Utilitarianism, #3 by Deontology) and Option B saves no one but follows all rules (ranked #2 by Deontology, #3 by Utilitarianism). Your rule picks B because it's more 'stable.' Are you really saying we should let 1,000 people die to avoid a ranking fluctuation?"
  **Damage:** **High.** This makes your theory look absurd in high-stakes cases.
  **Your Comeback:** "The Spread Rule applies to **structural life choices** (career, giving), not split-second emergency triage. In high-stakes emergencies, 'don't use people as means' usually aligns with 'save lives' anyway. But for long-term resource allocation, diversification prevents you from waking up in 10 years realizing you funded something horrific."
  **Where Your Answer is Soft:** You are drawing an arbitrary line between "structural choices" and "cases." If your theory doesn't work for the Trolley Problem, they will claim it doesn't work for *anything*. **Pivot:** Emphasize that your thesis is about *uncertainty over time*, not snap judgments.

  ### 3. The "Normal Person" Reality Check
  **Who:** Debate Coach
  **The Objection:** "You say people should have 'credences' over moral theories. Most people don't even know what Utilitarianism is. If your rule requires me to assign percentages to abstract theories before I decide whether to donate to a food bank, isn't this useless for actual decision-making?"
  **Damage:** **Medium.** This undermines the practical value of your project.
  **Your Comeback:** "People already do this intuitively. They feel torn between 'doing the most good' and 'being a good person.' The Spread Rule just validates that intuition. It tells them: 'It's okay to split your donation between the most effective charity and the one that helps your local community.' It reduces anxiety, it doesn't add math."
  **Where Your Answer is Soft:** You are assuming people feel "torn." Many people are dogmatic. **Pivot:** Frame it as advice for the *reflective* person, not the unreflective one.

  ### 4. The "Arbitrary Threshold" Nitpick
  **Who:** Anyone (But likely the Bio Teacher)
  **The Objection:** "Why 10% credence? Why not 5%? Why not 20%? If I give Kantianism 9% credence, it disappears from the calculation? That seems like a convenient way to rig the results."
  **Damage:** **Medium-Low.** It looks like a technical flaw, not a fatal one.
  **Your Comeback:** "10% is a heuristic for 'plausible enough to take seriously.' It's like a polling margin of error. The exact number matters less than the principle: ignore fringe theories, respect plausible disagreement."
  **Where Your Answer is Soft:** It *is* arbitrary. Don't try to defend the number mathematically. Defend it as a **pragmatic cutoff**.

  ---

  ### The One Question You Hope Nobody Asks
  **The Question:** "How do you normalize rankings across theories?"

  **Why it's deadly:** Your theory relies on comparing a "3rd place" ranking in Utilitarianism to a "3rd place" ranking in Virtue Ethics. But Utilitarianism might have 100 possible options, and Virtue Ethics might only have 3. Being 3rd out of 100 is different than 3rd out of 3. If you can't explain how you make these rankings comparable (inter-theoretic comparison of *rank* rather than *value*), the math of your "Spread Rule" collapses.

  **If they ask this:**
  1.  **Don't panic.**
  2.  **Say:** "That is the hardest technical problem in moral uncertainty. My project assumes a 'rough comparability'—that we can agree on what 'top tier,' 'mid tier,' and 'bottom tier' actions look like across theories without needing exact units."
  3.  **Pivot:** "But even without perfect normalization, the *heuristic* holds: if an option is universally reviled by all plausible theories, don't do it. If it's universally praised, do it. The Spread Rule is about avoiding the extremes."

  **Good luck. Breathe. You know the material.**
