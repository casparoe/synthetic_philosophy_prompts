  And fixes essence deep within the seed.
  Non-being voids the ground on which we tread,
  Until no stable place remains secure.
  Both join the pair where opposites allure,
  Where existence and its absence both are fed.
  Neither escapes the net that thought has spread,
  Yet seeks a quiet where no mind is pure.

  Then logic folds; no fifth position stands,
  No svabhāva supports the tetralemma's weight.
  Emptiness clears the ground of rigid lands,
  And leaves the empty concept to its fate.
  Not nihilism, where nothingness commands,
  But dependent arising opens every gate.
