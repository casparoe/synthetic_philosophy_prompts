  | Beat | Minute | Move (what I do, what goes on the flip chart) | Why here (what it depends on, what it unlocks) | Misconception planted or killed |
  | :--- | :--- | :--- | :--- | :--- |
  | 1 | 0-3 | Write MI, list the four rules, define goal as MU; forbid explaining why. | Establishes the system as mechanical and meaningless before meaning is sought. | Plants the idea that this is a solvable puzzle rather than a trap. |
  | 2 | 3-6 | Invite audience to shout moves; write derivations on chart until progress stalls. | Creates shared frustration and ownership of the failure to reach MU. | Kills the notion that the speaker is withholding a simple trick. |
  | 3 | 6-8 | Ask for invariant guesses; let someone suggest odd number of I's, then double MI to MII. | Demonstrates that surface patterns break before revealing the deeper structural constraint. | Kills the guess that the number of I's is always odd. |
  | 4 | 8-11 | Reveal the real invariant regarding multiples of three and write it on the chart. | Provides the mathematical proof that MU is unreachable within the rules. | Kills the belief that a computer or more time could eventually solve it. |
  | 5 | 11-13 | Name this move jumping out of the system and validate adding a fifth rule. | Distinguishes reasoning about the system from reasoning within the system. | Kills the idea that jumping out is cheating rather than a valid meta-move. |
  | 6 | 13-16 | Run the marble transfer test as a hands-up vote on reachability. | Confirms they can apply the invariant logic to a new context immediately. | Kills the fear that the MU solution was a unique memorized fact. |
  | 7 | 16-18 | Link the invariant to Gödel's incompleteness without deriving the proof. | Connects the party trick to the historical heavyweight without losing the room. | Kills the collapse of unprovable into false or mystical brokenness. |
  | 8 | 18-20 | Deliver the take-home line and prime the Q+A with the refusal boundary. | Ensures the core concept survives the room and sets expectations for questions. | Kills the expectation that you will explain full arithmetic incompleteness now. |

