answer: |-
  You are right to be suspicious. The blog post you received is a classic example of "theoretical defeatism": it takes a precise mathematical result, strips away the context and assumptions, and uses it to shut down practical improvement. It is technically accurate on the theorem itself but deeply misleading on the implications for a housing co-op.

  A social choice theorist would tell you that while Gibbard-Satterthwaite (G-S) is a fundamental limit, it is not a death sentence for voting reform. The claim that "no system beats any other" is simply false. Systems differ vastly in how *hard* they are to manipulate, how *often* manipulation changes the outcome, and how *fair* the results feel.

  Here is a breakdown of what the theorem actually says, where the blog post goes wrong, and how to apply this to your two specific votes.

  ### 1. The Core Theorem: What it says and what it hides

  The Gibbard-Satterthwaite theorem states that for any voting system that chooses among **three or more options**, if you want it to be **strategy-proof** (no one ever benefits from lying about their preferences), the system must be a **dictatorship** (one person's top choice always wins).

  The blog post gets the basic statement right. However, it hides a massive assumption in the phrase "with three or more options." The theorem assumes an **"unrestricted domain."** This means it assumes voters can have *any possible preference order* they want. It assumes someone could logically prefer Project A over B, B over C, but C over A, or have preferences that jump around wildly without pattern.

  **The Loophole:** If you can reasonably assume that voters' preferences follow a specific structure (like being "single-peaked"), the theorem no longer applies. You *can* have a non-dictatorial, strategy-proof system if you restrict the *type* of preferences allowed. This is the key to your friend's argument.

  ### 2. Question One: The Budget Vote and "Single-Peakedness"

  Your friend is referring to the **Median Voter Theorem**. She is correct about the theory.

  **The Assumption:**
  "Single-peaked" means that along a spectrum (like a line from 0% to 60%), every voter has one "peak" (their ideal amount). As you move away from that peak in either direction (less money or more money), their satisfaction goes down.
  *   *Example:* I want 40%. I prefer 30% over 20%. I prefer 50% over 60%. My satisfaction slopes down smoothly on both sides of 40%.

  **Is your friend right?**
  Yes. If everyone's preferences are single-peaked along that budget line, simply picking the **median** vote (the middle number) is strategy-proof. You cannot get a better outcome by lying. If you want 40% and the median is 30%, voting "50%" won't pull the median toward you; it might even push it further away. Voting your true number is always your best bet.

  **Does your budget vote satisfy this?**
  This is where your intuition is spot on. You identified the risk: **"All or Nothing."**
  If a member thinks, "Either we do the insulation properly (50%) or it's a waste of money (0%), but 25% is the worst outcome," their preferences are **double-peaked**. They have a peak at 0 and a peak at 50, with a valley in between.
  *   **If preferences are double-peaked:** The Median Voter Theorem breaks. The vote becomes unstable, and manipulation becomes possible again.
  *   **Practical Advice:** In most housing co-ops, budget preferences *are* single-peaked. Most people think "more insulation is better up to a point of diminishing returns." The "all or nothing" view is usually a minority stance.
  *   **Recommendation:** For the budget share, do not use a show of hands or pairwise arguments. Use a **Median Vote**. Ask everyone to write down a number between 0 and 60. Sort the numbers and pick the one in the middle. It is robust, easy to understand, and *if* your members are mostly reasonable about budget trade-offs, it is immune to strategy.

  ### 3. Question Two: The "Random Dictator" (Pick a Name)

  You and the blogger are both partially right, but you are talking about different things.

  **You are right:** It is **strategy-proof**.
  If the rule is "We pick one person at random, and they decide," you have no incentive to lie. If you are picked, you get your true favorite. If you aren't picked, your vote didn't matter. There is no tactical advantage to misrepresenting your preference.

  **The blogger is right:** It is technically a **"Random Dictatorship."**
  In social choice theory, a "dictatorship" doesn't mean a tyrant; it just means the outcome is determined solely by one person's preferences. A random dictatorship is a probability distribution over dictators. Gibbard proved that *if* you want a randomized rule to be strategy-proof, it *must* be a random dictatorship (or close to it).

  **Where the blogger is wrong:**
  The blogger implies that because it's a "dictatorship," it's no better than your current messy system. This ignores **fairness and efficiency**.
  *   **The Risk Problem:** You asked if it depends on how people feel about risk. Yes. A random dictatorship is terrible for risk-averse groups. If 39 people want Solar Panels and 1 person wants a Bike Shed, a random draw gives the Bike Shed a 2.5% chance of winning. Most co-ops would view that as an unacceptable waste of resources.
  *   **The "No System Beats Another" Fallacy:** Just because a system is manipulable doesn't mean it's bad. Plurality voting (show of hands) is manipulable, but a Random Dictatorship is *fairer* in terms of equal power, yet *worse* at aggregating information. They are not equal.

  **Verdict:** Do not use the "pick a name" method. It solves the strategy problem by ignoring the will of the group. It is strategy-proof, but it is not a good way to run a co-op.

  ### 4. Question Three: Continuous vs. Discrete Decisions

  **Yes, it matters a lot.**

  *   **The Project Vote (Discrete):** You are choosing 1 of 5 named things. This is the exact domain where Gibbard-Satterthwaite bites hard. There is no "line" here. You cannot order them perfectly for everyone (e.g., is the Garden "between" the Bike Shed and the Common Room?). Here, you cannot eliminate strategy completely.
  *   **The Budget Vote (Continuous):** You are choosing a number on a line. As discussed above, this allows for the Median Voter solution, which escapes the G-S theorem *if* preferences are single-peaked.

  The blog post conflates these two. It treats the budget vote as if it were just another 5-option choice. It isn't. The budget vote is mathematically easier to solve than the project vote.

  ### 5. The "Don't Bother" Conclusion

  The blog's conclusion—"manipulation is unavoidable, so use the simplest rule"—is the most dangerous part. It is like saying "Locks can be picked, so leave your door open."

  1.  **Degree Matters:** Some systems are *hard* to manipulate. To manipulate Instant Runoff Voting, you often need to know exactly how others will vote. To manipulate a simple Show of Hands, you just need to know if you're on the losing side. The "cost" of manipulation varies.
  2.  **Expression Matters:** Your current system (argue until tired + show of hands) is likely **Plurality** or **Pairwise Runoff**. These are notoriously bad at capturing nuance. They force people to cluster into two camps, exacerbating conflict.
  3.  **Legitimacy Matters:** Even if a system is theoretically manipulable, if members *feel* heard, they are less likely to try to game it.

  ### Practical Recommendations for Your Co-op

  You have 40 members. This is small enough for nuanced voting but large enough that "arguing until tired" excludes quiet people. Here is how a social choice theorist would suggest you redesign this:

  **For Decision 1: Which Project? (5 Options)**
  Since G-S applies here, you cannot make it perfectly strategy-proof. Your goal is to minimize the *impact* of strategy and find the candidate with the broadest support.
  *   **Avoid:** Show of hands / Plurality (encourages "lesser of two evils" voting).
  *   **Avoid:** Random Dictator (ignores the group will).
  *   **Recommended:** **Score Voting (or Approval Voting).**
      *   Give every member a ballot with the 5 projects.
      *   Ask them to score each from 0 to 5 (or just check "Approve/Disapprove").
      *   Sum the scores. Highest wins.
      *   *Why?* While not perfectly strategy-proof (someone might give their 2nd choice a 0 to help their 1st), it is much harder to game than plurality. It allows people to express "I like the Garden okay, but I love Solar." It reduces the "wasted vote" fear. It is simple enough for a co-op to understand.

  **For Decision 2: What Budget Share? (0–60%)**
  *   **Avoid:** Pairwise arguments (leads to cycling and exhaustion).
  *   **Recommended:** **Median Voting.**
      *   Everyone submits a number secretly.
      *   You line them up and pick the middle one.
      *   *Caveat:* Before voting, have a discussion to ensure people understand that a "half-job" is better than "no job" for most things. If you can establish that preferences are single-peaked (smooth trade-offs), the median is robust and strategy-proof.

  **Summary for the Committee**
  The blog post is using a mathematical impossibility result to argue against practical improvement.
  1.  **Gibbard-Satterthwaite is real,** but it assumes *any* preference is possible. If preferences are structured (like on a budget line), you can beat it.
  2.  **Random Dictatorship is strategy-proof** but unfair and inefficient.
  3.  **Not all systems are equal.** Some minimize manipulation; some maximize fairness; some do both better than others.
  4.  **Change the system.** Move away from "argue and vote." Use **Score Voting** for the project choice and **Median Voting** for the budget amount. These are robust, understandable, and significantly better than the status quo.
