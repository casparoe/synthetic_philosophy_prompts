answer: |-
  The divergence between Germany's statutory nuclear exit (*Atomausstieg*) and France's probabilistic license renewal regime represents a fundamental clash in the political philosophy of technology. While both states pursue decarbonization, their institutional architectures encode distinct theories of risk, time, and authority.

  ### 1. Philosophical Commitments of the Divergence

  **The Nature of Technological Risk**
  *   **Germany (Categorical/Uncertainty):** The German framework treats nuclear risk as **Knightian uncertainty** rather than calculable probability. It presupposes that certain technological hazards possess a "tail risk" (catastrophic failure) that cannot be rendered acceptable through engineering margins. Risk is viewed as intrinsic to the technology's existence, not merely a function of its maintenance.
  *   **France (Probabilistic/Manageability):** The French model presupposes risk is **epistemically accessible and reducible**. By tying licenses to Probabilistic Safety Assessments (PSA), it commits to the view that risk is a variable to be optimized, not a binary state. Safety is a continuous performance metric, not a static attribute.

  **Intergenerational Obligation**
  *   **Germany (Non-Imposition):** The obligation is negative: *do not burden the future with unmanageable hazards.* The long-lived radiotoxicity of waste and the potential for permanent contamination are treated as moral wrongs that cannot be offset by present-day carbon benefits. This prioritizes the rights of future generations to be free from specific technological legacies over their right to inherit a low-carbon grid.
  *   **France (Provision/Stewardship):** The obligation is positive: *provide the infrastructure necessary for future welfare.* This view accepts waste burdens as a manageable trade-off for climate stability and energy sovereignty. It assumes future generations will possess the technical capacity to manage waste, provided current generations maintain rigorous safety standards.

  **Epistemic Authority**
  *   **Germany (Legislative Supremacy):** Authority resides in the **Legislature**. By fixing shutdown dates in statute, the German system asserts that the decision to tolerate nuclear risk is a *political-ethical* judgment, not a *technical-safety* one. Technical regulators (like the BfE) are subordinate to the parliamentary timeline; they cannot validate safety to override the political mandate to exit.
  *   **France (Technocratic Autonomy):** Authority resides in the **Independent Regulator** (ASN). The state delegates the judgment of acceptability to technical experts insulated from electoral cycles. This presupposes that risk assessment is an objective scientific endeavor that should be shielded from political volatility.

  ### 2. Reconstructing the Implicit Theory of the Calendar-Certain Exit

  The German "calendar-certain" exit embeds a hybrid theory of risk and morality.

  **Irreversible Risk Accumulation vs. Deontological Constraint**
  The statutory design suggests that catastrophic risk is treated as **accumulating irreversibly over chronological time**, but not merely due to material aging (which can be mitigated). Rather, it treats the *operational time* of a reactor as an accumulation of "exposure opportunities" where the probability of a black-swan event (human error, external shock) never reaches zero.

  However, the *prohibition on license renewal regardless of safety assessments* points more strongly toward a **deontological constraint**. If the concern were purely about aging materials, a robust safety upgrade (like France's *Grand Carénage*) should theoretically reset the clock. By legally forbidding this reset even if safety is technically verified, the law encodes the principle that **nuclear operation is intrinsically illegitimate**, not just conditionally unsafe. It treats the production of long-lived waste as a violation of a duty to future generations that cannot be redeemed by consequentialist benefits (i.e., low emissions).

  **Synthesis:** The implicit theory is that nuclear technology creates a **moral hazard that technical rationality cannot resolve.** The calendar acts as a "pre-commitment device" to prevent future political weakness from overriding the moral prohibition.

  ### 3. Strict Requirement vs. Compatibility

  **Does this practice *strictly require* the deontological view?**
  **No.** The legal design is logically compatible with **Rule Consequentialism** or a **Political Precautionary Principle**.
  *   *Rule Consequentialism:* A legislature could argue that while individual reactors might be safe, the *institutional risk* of regulatory capture or complacency over decades is too high. A fixed statutory rule minimizes the long-term expected utility loss from potential human error, even if short-term safety data looks good.
  *   *Political Precaution:* The law could presuppose that public trust is a finite resource. Continuing nuclear power might provoke social instability that outweighs the climate benefits.

  **Distinguishing Presupposition from Fit**
  *   **What the Legal Design *Presupposes*:** It presupposes that **Parliamentary sovereignty overrides Technical Findings.** It logically requires that the metric for shutdown is *time*, not *safety status*. It necessitates that the regulator lacks the legal standing to certify a plant as "safe enough" to operate beyond the statutory date.
  *   **What the Design *Fits Well With*:** It fits well with **Deontological Ethics** (nuclear is wrong in itself) and **Green Political Theory** (anti-industrialism). However, one could implement this legal design while personally believing nuclear is technically safe, provided one believes the *political management* of that risk is flawed.

  ### 4. Institutional Decision Rights: Adopting the French Model

  If a polity (like Germany) wished to adopt the French-style probabilistic model without altering its energy mix (i.e., keeping nuclear plants running), it would require a fundamental restructuring of decision rights between the Legislature and the Regulator.

  **Required Changes:**
  1.  **Statutory Amendment (The "Hard" Constraint):** The Atomic Energy Act (*Atomgesetz*) would need to be amended to **remove fixed shutdown dates**. Currently, the dates are the primary legal operator; safety is secondary. The law must be inverted so that *safety status* is the primary operator and *time* is secondary.
  2.  **Transfer of Veto Power:** Decision rights must shift from the **Legislature** to the **Independent Regulator**.
      *   *Current State:* The Legislature holds the veto (via expiration dates). The Regulator holds only an advisory role on safety.
      *   *Required State:* The Regulator must hold the veto. The Legislature must be legally barred from setting operational timelines, restricted instead to setting high-level safety goals.
  3.  **Insulation Mechanism:** To mimic the French ASN, the German regulator (BfE/BMWK) would require **statutory independence** from the executive branch's energy policy goals. Currently, German safety oversight is intertwined with the Ministry of Economics/Climate. A French model requires a regulator with the legal authority to shut down a plant for safety reasons *and* keep it open for safety reasons, regardless of the government's energy targets.
  4.  **Epistemic Mandate:** The legal standard for licensing must change from "Compliance with Statutory Timeline" to "As Low As Reasonably Achievable" (ALARA) based on **Probabilistic Risk Assessment (PRA)**. The law must explicitly recognize probabilistic margins as a sufficient legal basis for continued operation.

  **Conclusion**
  The German framework presupposes that technological risk contains a political-moral core that technical data cannot exhaust. It prioritizes legislative pre-commitment over regulatory flexibility. Adopting the French model would not merely require new safety tests; it would require a constitutional-style shift in authority, demoting the Legislature from the arbiter of technological destiny to the guarantor of regulatory independence, and reclassifying nuclear risk from a categorical prohibition to a manageable variable.
