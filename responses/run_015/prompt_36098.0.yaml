answer: |-
  This is a fantastic setup. You have correctly identified that your TA is operating as a **Moderate Restrictivist**. She rejects the two most famous poles (Universalism and Van Inwagen's Life View) in favor of a view that validates ordinary middle-sized dry goods (stones, chairs) without collapsing into absurdity (front rows, desk clutter).

  Her verdicts provide a tight constraint on what her principle can be. Here is the breakdown of the live rules, how they handle your cases, my prediction of her actual rulings, and the "killer case" for your next section.

  ### 1. The Live Rules (Reverse-Engineering the TA)

  Based on her seven prior verdicts, two principles are the strongest contenders. Both fit her data perfectly but diverge on your new cases.

  **Rule A: Connected Fastening (The Physicalist View)**
  *   **The Principle:** Composition occurs when parts are **spatially continuous** (or connected by a physical medium) AND **physically fastened** (bonded, nailed, strung, fused) such that they resist separation.
  *   **Fits Her Verdicts:**
      *   *Yes:* Stones (chemical bonds), Humans (flesh), Chairs (nails/glue), Necklaces (string). All are continuous and fastened.
      *   *No:* Clutter (touching but not fastened), Front Row (touching but not fastened), Tower+Mug (neither touching nor fastened).
  *   **Philosophical Pedigree:** Similar to views held by Peter Markosian or early Van Inwagen discussions on "fastening."

  **Rule B: Causal Integration (The Functionalist View)**
  *   **The Principle:** Composition occurs when parts **interact causally** to maintain a stable state or function, regardless of direct contact.
  *   **Fits Her Verdicts:**
      *   *Yes:* Stones (structural stability), Humans (biological homeostasis), Chairs (structural support), Necklaces (string maintains arrangement).
      *   *No:* Clutter (no interaction), Front Row (no shared maintenance), Tower+Mug (no interaction).
  *   **Philosophical Pedigree:** Similar to E.J. Lowe's "Causal Unity" or certain systems-based ontologies.

  **The Wildcard: Common Sense Sortals**
  *   She might simply believe composition tracks our successful concepts. However, since she asked you to find a *principle*, I will treat this as a background bias rather than her explicit rule.

  ### 2. Predictions for Your Three Cases

  Here is where your cases shine. They isolate **Contact** (Sand/Chain) from **Binding** (Galaxy).

  | Case | Features | Rule A (Connected Fastening) | Rule B (Causal Integration) |
  | :--- | :--- | :--- | :--- |
  | **1. Sand Cone** | Contact: **Yes**<br>Binding: **No** (Friction only) | **NO**<br>(Grains aren't bonded; pile collapses if tipped.) | **MAYBE/NO**<br>(Weak interaction; highly fragile stability.) |
  | **2. Human Chain** | Contact: **Yes**<br>Binding: **No** (Voluntary) | **NO**<br>(Easily broken; no physical fastener.) | **NO**<br>(No systemic maintenance; voluntary.) |
  | **3. Spiral Galaxy** | Contact: **No**<br>Binding: **Yes** (Gravity) | **NO**<br>(Parts are scattered; no physical connector.) | **YES**<br>(Gravitationally bound; stable dynamic system.) |

  **The Disagreement:** The **Galaxy** is the wedge. Rule A rejects it (scattered). Rule B accepts it (integrated). The **Sand Cone** tests whether Contact alone is enough (Rule A says no, you need fastening).

  ### 3. My Best Guess: How She Will Rule

  I predict she will rule **NO** on all three cases.

  *   **Sand Cone: NO.** She accepts *stones* (chemical bonds) but rejects *clutter* (touching). Sand is closer to clutter. Friction is not "fastening" in the metaphysical sense; it's contingent proximity. If she accepted sand piles, she'd be close to Universalism about aggregates.
  *   **Human Chain: NO.** This is the easiest call. It's clearly arbitrary and lacks persistence conditions.
  *   **Spiral Galaxy: NO.** This is the critical one. While astronomers treat galaxies as objects, metaphysicians who reject Universalism often reject **scattered objects**. Her rejection of the *Eiffel Tower + Mug* shows she hates scattered composition. Even though gravity binds the galaxy, there is no *physical connector* (like the string on the necklace). She likely views gravity as a force field, not a mereological "glue."

  **Why this identifies her rule:**
  If she says **No** to the Galaxy, she kills **Rule B (Causal Integration)**.
  If she says **No** to the Sand, she confirms that **Contact is not sufficient** (you need Fastening).
  This leaves **Rule A (Connected Fastening)** as the winner. She requires **Spatial Continuity (or physical connection) + Physical Bonding.**

  ### 4. The "Killer Case" for Next Section

  If she rules No/No/No as predicted, you have established that she requires **Physical Connection** and rejects **Scatteredness**. However, you haven't precisely defined what counts as a "Physical Connection."

  She accepted the **Necklace** (beads connected by string).
  She rejected the **Galaxy** (stars connected by gravity).

  To discriminate between **"Physical Tether"** vs. **"Force Field,"** bring this case:

  **The Case of the Hovering Magnet**
  > "Imagine a strong magnet suspended in a vacuum chamber, holding a paperclip in mid-air an inch below it. Nothing touches. They are held in a fixed spatial relationship purely by the magnetic field. Do the magnet and the paperclip compose a single object?"

  **Why this discriminates:**
  *   **If she says YES:** Then physical *contact* is not required; a force field counts as a connector. This rehabilitates the **Galaxy** case (gravity is also a field). It suggests her principle is **"Bound by Fundamental Forces,"** not "Connected Fastening."
  *   **If she says NO:** Then **contact or a material tether** (like the necklace string) is strictly required. This confirms she is a **Spatial Continuity Theorist**. It solidifies that her rejection of the Galaxy was about scatteredness, not just lack of function.

  **Strategy:**
  1.  Present your three cases.
  2.  If she rejects the Galaxy, wait for the next section.
  3.  Present the **Hovering Magnet**.
  4.  If she rejects that too, you can confidently state in discussion: *"It seems your principle is that composition requires spatial continuity mediated by material fastening. Scattered objects, even if bound by forces, don't qualify."*

  This will show you aren't just throwing puzzles at her, but actually mapping the boundaries of her ontology. Good luck.
