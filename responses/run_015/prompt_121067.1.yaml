  # Joint Statement on Neural Metrics and Moral Status

  **Parties:** Neural-Complexity Gradualist; Categorical-Status Anti-Quantifier
  **Date:** October 26, 2023
  **Subject:** Adversarial Collaboration on the Moral Relevance of Brain Size

  Following a period of good-faith adversarial collaboration, the undersigned parties issue this joint statement regarding the relationship between neural metrics (including brain size, connectivity, and parameter scale) and moral status. While fundamental philosophical disagreements remain, we have identified specific areas of empirical and conceptual agreement and have structured our remaining disagreements to clarify the nature of our divergence.

  ### 1. Agreed Claims

  Both parties endorse the following claims as empirically sound or conceptually necessary for a defensible moral theory:

  1.  **Empirical Correlation:** There exists a documented empirical correlation between brain size (adjusted for allometry) and certain cognitive capacities across known species, though this correlation is non-linear and subject to significant variance based on structural organization.
  2.  **Microcephaly and Protections:** The presence of extreme microcephaly in human individuals does not eliminate basic moral protections; individuals with significantly reduced neural mass retain full moral standing under standard human-rights frameworks.
  3.  **Cetacean Architecture:** Cetaceans possess larger absolute brain masses than many typical adult humans, yet their cognitive architectures differ substantially in cortical folding, neuron density, and connectivity patterns, complicating direct metric comparisons.
  4.  **Artificial Scaling:** Scaling parameter counts in artificial neural networks raises structurally analogous questions to biological brain scaling regarding quantitative capacity, information integration, and functional output, warranting similar ethical scrutiny.
  5.  **Raw Mass Insufficiency:** No defensible moral theory assigns moral status by raw brain mass alone; any plausible theory must account for functional capacity, relational context, or structural integration alongside physical metrics.

  ### 2. Disagreements Table

  The following table outlines the core remaining disagreements. Each row includes the Crux, the specific formulation accepted by each party, the classification of the disagreement, and a concrete test case with predicted outcomes agreed upon by both parties as relevant to the crux.

  | Crux | Gradualist Formulation (and Prediction) | Anti-Quantifier Formulation (and Prediction) | Residual Disagreement Classification |
  | :--- | :--- | :--- | :--- |
  | **1. Gradation of Status vs. Value**<br><br>*Case:* Comparison of a typical human adult vs. a highly intelligent cetacean with superior neural integration metrics.<br><br>*Gradualist Prediction:* The cetacean possesses a different (potentially higher or lower) degree of moral weight based on integration capacity.<br>*Anti-Quantifier Prediction:* Both possess equal moral status if both meet the threshold of "subject of a life"; differences are merely instrumental. | Moral status varies continuously with neural complexity; therefore, measurable differences in information-integration capacity between species generate real, graded differences in moral weight, even if both exceed a minimum threshold for protection. | Moral status is binary and depends on categorical properties (e.g., autonomy, reciprocity); neural metrics only indicate instrumental value or capacity to suffer, not the degree of inherent moral standing. | Substantive |
  | **2. Evolutionary Origin and Naturalness**<br><br>*Case:* A synthetic brain substrate vs. a biological brain of identical complexity and size.<br><br>*Gradualist Prediction:* Moral weight is equal because complexity is substrate-neutral.<br>*Anti-Quantifier Prediction:* Moral status may differ because categorical properties often rely on biological membership or evolutionary history. | The moral relevance of neural size or complexity is substrate-neutral; if an artificial system matches the complexity of a biological brain, it commands equivalent moral weight regardless of evolutionary origin. | The moral relevance of neural architecture is tied to natural kind membership or relational history; a synthetic system lacking biological evolution may fail to possess the categorical properties required for status regardless of size. | Substantive |
  | **3. Artificial Systems and Embodiment**<br><br>*Case:* An AI system with parameter counts exceeding human neuron counts but lacking biological embodiment.<br><br>*Gradualist Prediction:* High parameter count suggests potential for graded moral weight if integration is proven.<br>*Anti-Quantifier Prediction:* Lack of embodiment and reciprocal relations precludes moral status regardless of parameter scale. | Scaling parameter counts in artificial systems can generate moral weight proportional to complexity and information integration, even without biological embodiment, provided functional isomorphism is achieved. | Scaling parameter counts is irrelevant to moral status because artificial systems lack the categorical properties of life, autonomy, or reciprocal moral relations required for standing. | Substantive (with verbal components) |

  ### 3. Verdict on Verbal Dispute

  We conclude that a portion of this dispute is verbal. Specifically, the term "moral status" is used differently by each party. The Gradualist uses "moral status" to denote a scalar quantity representing the *weight* of interests in moral calculus. The Anti-quantifier uses "moral status" to denote a binary property representing *membership* in the moral community (possession of rights).

  These formulations map onto the same underlying disagreement regarding the structure of moral value (continuous vs. threshold), but the confusion is exacerbated by the shared terminology. If the Gradualist speaks of "moral weight" and the Anti-quantifier speaks of "moral standing," the substantive disagreement remains regarding what grounds these properties (neural metrics vs. categorical relations), but the verbal confusion regarding the definition of "status" is resolved.

