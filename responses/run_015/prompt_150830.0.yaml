      *   Must handle the "impotence" argument carefully. If we just list what's missing and tell no one, are we just patting ourselves on the back? *Counter-argument:* We are preserving the *truth of the censorship* for future historians, even if we can't shout it today. It transforms the archive from a passive repository to an active witness.

