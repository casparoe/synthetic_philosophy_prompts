          3.  Create an internal "Record of Absence" (shadow index) immediately.
          4.  Set a sunset date (e.g., 20 years or upon death of key stakeholders) for releasing the finding aid with notes.
      *   **Timeframe:** Action needed by Thursday's vote. Implementation within 30 days.
      *   **Closing:** Reiterate the mission.

  4.  **Refining the Tone:**
      *   Professional, persuasive, thoughtful, not overly academic but intellectually rigorous.
