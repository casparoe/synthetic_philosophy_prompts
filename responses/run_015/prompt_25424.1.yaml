answer: |-
  You have identified one of the foundational fault lines in legal and political philosophy. You are absolutely right: this is not just a recurring pattern; it is a formalized debate with specific names, canonical texts, and recognized intermediate positions.

  Here is the breakdown of the terminology, the history, the strongest arguments, and the specific logical move you noticed regarding "harm."

  ### 1. The Names of the Positions

  The broad debate is known as **The Moral Limits of the Criminal Law**.

  The two specific opposing principles you identified are:

  *   **Side A: Legal Moralism.**
      This is the view that the law can legitimately be used to prohibit behaviors that conflict with society's collective moral judgments, even if those behaviors do not cause tangible harm to others. The justification is that immorality *itself* is a sufficient ground for criminalization.
  *   **Side B: Liberalism (specifically, The Harm Principle).**
      Derived from John Stuart Mill's *On Liberty* (1859). This holds that the only purpose for which power can be rightfully exercised over any member of a civilized community, against his will, is to prevent harm to others. "Your own good, either physical or moral, is not a sufficient warrant."

  ### 2. The Canonical Debate: Hart vs. Devlin

  While Mill originated the Harm Principle, the specific modern formulation of this clash occurred in the 1950s and 60s in the UK, known as the **Hart-Devlin Debate**.

  *   **The Context:** A government report (the Wolfenden Report) recommended decriminalizing homosexuality and prostitution.
  *   **Lord Patrick Devlin (Legal Moralism):** Argued that society is held together by a shared moral fabric. Just as treason threatens the existence of the state, immorality threatens the existence of society. Therefore, society has a right to use the law to preserve its moral integrity, even without a specific "victim."
  *   **H.L.A. Hart (Liberalism):** Defended Mill. He argued that Devlin's view conflates "society" with "morality." A society can survive deep moral disagreement. Using the law to enforce morality creates unnecessary suffering and stifles individual autonomy without preventing tangible harm.

  ### 3. Is it One Debate or a Cluster?

  It is a cluster. The most comprehensive mapping of this cluster was done by the American philosopher **Joel Feinberg** in his four-volume work, *The Moral Limits of the Criminal Law* (1984–1988).

  Feinberg identified **four** potential grounds for criminalization, not just two. This helps explain why the debate feels like a cluster:

  1.  **The Harm Principle:** Preventing damage to others (Mill/Hart).
  2.  **The Offense Principle:** Preventing profound psychological offense or disgust to others (a middle ground).
  3.  **Legal Paternalism:** Preventing harm to *self* (e.g., suicide, seatbelt laws).
  4.  **Legal Moralism:** Preventing immorality for its own sake (Devlin).

  When you see these debates, people are often sliding between these four. For example, someone arguing against drug use might start with Paternalism ("it's bad for you"), switch to Harm ("you become a burden on society"), and end with Moralism ("it's degrading").

  ### 4. The "Stretching Harm" Move

  You asked: *"I've noticed that sometimes the 'harm' side stretches the concept of harm until it swallows everything... Is that move itself a recognized thing?"*

  Yes. This is a major critique in jurisprudence.

  When a proponent of the Harm Principle argues that immorality should be illegal because it "harms the moral climate of society," they are effectively **collapsing the Harm Principle into Legal Moralism.**

  *   **Devlin's Move:** Devlin explicitly argued this. He claimed that immorality *is* a harm because it loosens the bonds of society, leading to disintegration. To Devlin, "harm to society" and "violation of shared morality" were synonymous.
  *   **The Critique:** Hart and later liberals argued this makes the Harm Principle **tautological** (circular) and **unfalsifiable**. If *any* behavior I dislike can be defined as "harming the moral fabric," then the Harm Principle no longer limits the law; it justifies anything.
  *   **The Term:** Philosophers often call this **Conceptual Stretching** or **Definitional Expansion**. In the specific context of the Hart-Devlin debate, it is often referred to as the **Disintegration Thesis**. Critics argue that without evidence of tangible harm (physical, financial, rights-violation), claiming "social disintegration" is just Moralism in disguise.

  ### 5. Intermediate and Alternative Positions

  You asked about intermediate positions. Beyond the Offense Principle (Feinberg), there are two other significant frameworks:

  **A. Legal Perfectionism**
  This is a more sophisticated version of Moralism. It argues that the state should not just stop "bad" things, but actively promote human flourishing and virtue.
  *   *Argument:* The law should encourage people to live good lives. Banning surrogacy or certain sex acts isn't just about stopping sin; it's about refusing to commodify human beings, which degrades our collective understanding of dignity.
  *   *Proponents:* Some Aristotelians, Martha Nussbaum (in specific contexts), and certain communitarians.

  **B. Communitarianism**
  This challenges the Liberal assumption that the "individual" comes before the "community."
  *   *Argument:* Individuals are constituted by their communities. Therefore, an attack on community values *is* an attack on the individual's identity and context. You cannot separate the "harm to others" from the "violation of values" because the values define the "others."
  *   *Proponents:* Michael Sandel, Alasdair MacIntyre.

  ### 6. Why the Political Alignment Shifts

  You noted this doesn't map neatly onto Left/Right. This is because the debate is about **methodology**, not **outcome**.

  *   **Social Conservatives** usually employ Legal Moralism regarding sex and drugs, but often switch to **Libertarianism (Harm Principle)** regarding economic regulation (e.g., "Don't tell me how to run my business").
  *   **Social Liberals** usually employ the Harm Principle regarding sex and drugs, but often switch to **Paternalism** or **Perfectionism** regarding hate speech or commercial surrogacy (e.g., "We must ban this to protect human dignity/equality," which is arguably a moralist/perfectionist stance).

  ### Summary for your mental toolkit

  *   **The Fault Line:** Legal Moralism vs. The Harm Principle.
  *   **The Historical Anchor:** The Hart-Devlin Debate.
  *   **The Taxonomy:** Joel Feinberg's *The Moral Limits of the Criminal Law*.
  *   **The "Stretching" Move:** Collapsing the Harm Principle into Moralism via the Disintegration Thesis (claiming immorality *is* social harm).
  *   **The Intermediate:** The Offense Principle (Feinberg) and Legal Perfectionism.

  When you hear someone say, "It harms society," ask them: **"Is that a tangible harm (violence, theft, fraud), or is it a moral harm (disapproval, disgust, erosion of values)?"** If it's the latter, they are a Legal Moralist pretending to be a Liberal.
