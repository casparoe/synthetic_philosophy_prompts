answer: |-
  1. The Question

  **FINAL PAPER — QUESTION 4**

  **Time:** 45 minutes  
  **Word Ceiling:** 900 words  
  **Marks:** 25  

  **Instructions:**  
  1. No credit is given for naming authors, texts, or schools of thought. Argumentative precision alone is marked.  
  2. Do not discuss the metaphysical thesis that only present entities exist; this question concerns historiographical practice only.  
  3. Answer the prompt below using the provided cases and principle.

  **The Principle:**  
  Consider the *Retrospective Parity Principle* (RPP): *Apply to past agents only those standards you would be willing to have a better-informed historian of the twenty-second century apply to you.*

  **The Cases:**  
  (A) **The Legislator:** In 1858, an elected legislator in a slaveholding society votes to extend chattel slavery and defends it using explicit religious language. Abolitionist arguments regarding human equality are in wide circulation at this time and known to the legislator.  
  (B) **The Official:** In 1955, a public-health official licenses a sedative for use by pregnant women based on all safety evidence available at the time. The causal link to severe birth defects is not established until years later, using methods unavailable in 1955.

  **The Prompt:**  
  Historians often accuse one another of "presentism," but the charge shifts its meaning. Distinguish between **moral-evaluative presentism** (appraising past agents by our norms), **epistemic presentism** (appraising them by what we now know and they could not), **explanatory presentism** (explaining a past episode by where it ended up), and **agenda presentism** (choosing what to study because of present concerns). 

  Using the RPP, argue whether moral condemnation is legitimate in Case A and Case B. Your answer must: (i) determine which kind of presentism is objectionable in each case; (ii) assess whether the RPP is a stable constraint (considering both a strong reading that forbids condemnation and a weak reading that permits it); (iii) address whether describing the legislator's acts using the concept "structural racism" (a term unavailable in 1858) is objectionable presentism or description *avant la lettre*; and (iv) explain whether judging an act as wrong necessarily entails blaming the agent, and whether the norm shielding the agent from blame is itself a presentist projection.

  ***

  2. Model Answer

  Historiographical presentism is not a single error but a category mistake involving four distinct practices. Moral-evaluative presentism judges past agents by current norms; epistemic presentism judges them by current knowledge; explanatory presentism narrates history as leading inevitably to the present; agenda presentism selects topics based on contemporary relevance. A coherent philosophy of history must verdict these separately; a defense against one does not secure the others.

  The Retrospective Parity Principle (RPP) attempts to regulate moral-evaluative presentism. Under a strong reading, the RPP forbids condemning past agents because we cannot know how future historians will judge us. If we anticipate future condemnation for our own blind spots (e.g., factory farming or carbon emissions), parity demands we withhold judgment from the past. This reading is paralyzing: it renders moral history impossible. Under a weak reading, the RPP permits condemnation only where we believe our current standards are robust enough to survive future scrutiny. This reading is unstable unless grounded in a theory of moral progress. If moral knowledge accumulates, we may legitimately condemn past agents who had access to the reasons we now cite but rejected them.

  Applying this to Case A (The Legislator), moral-evaluative presentism is legitimate. The legislator had access to abolitionist arguments regarding human equality. The wrongness of slavery did not depend on future discovery but on moral reasons available in 1858. Condemning the legislator does not rely on epistemic presentism because the moral knowledge was not esoteric. Therefore, the RPP (weak reading) allows condemnation: we would accept future condemnation for ignoring clear moral reasons available to us.

  In Case B (The Official), moral-evaluative presentism is illegitimate if it entails blame. The harm resulted from unknown causal mechanisms. Condemning the official relies on epistemic presentism—judging them by data they could not possess. The RPP protects the official: we would not wish to be blamed by the future for unforeseeable side effects of well-evidenced decisions. Here, the act may be regrettable, but the agent is not blameworthy.

  This distinction relies on separating the judgment of an act from the blaming of an agent. One can judge slavery as objectively wrong (act) without necessarily blaming every participant equally (agent), though in Case A, the legislator's active defense closes the escape hatch. However, the claim that "agents who could not have known better are not blameworthy" is itself a normative claim we hold now. Is this presentist? Yes, but it is a benign presentism because it appeals to a universal condition of agency: moral responsibility requires epistemic access. To project this condition onto the past is not to impose a contingent modern value, but a necessary condition of moral accountability itself.

  Regarding vocabulary, describing the 1858 legislation as "structural racism" is not objectionable presentism provided the term describes a reality that existed *avant la lettre*. Concepts can name structural facts even if the agents lacked the vocabulary to articulate them. Objectionable presentism occurs only if the concept implies intentions or awareness the agents could not have held. Since "structural" implies systemic outcomes rather than conscious intent, the term is descriptively legitimate even if anachronistic linguistically.

  Ultimately, the RPP is not a tidy middle way but a test of consistency. It forbids epistemic presentism in Case B but permits moral-evaluative presentism in Case A. The historian must distinguish between what was unknowable then and what was merely unaccepted.

  The honest historian is left entitled to condemn past agents only when the reasons for condemnation were accessible to them at the time.

  ***

  3. Marking Scheme

  | Point | Marks | What an A answer does | What a B answer does instead | The error this point is designed to catch |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Four Distinctions** | 5 | Clearly defines and separates moral, epistemic, explanatory, and agenda presentism; notes they require separate verdicts. | Conflates moral and epistemic presentism or treats "presentism" as a single monolithic error. | The failure to distinguish types of presentism (Failure Mode i & iii). |
  | **2. RPP Analysis** | 5 | Analyzes Strong vs. Weak readings of RPP; identifies the paralysis of the Strong and the instability/progress assumption of the Weak. | Accepts the RPP as obviously correct without testing its implications for future judgment of us. | The bland compromise that accepts principles without testing their stability (Failure Mode iv). |
  | **3. Case A Verdict** | 5 | Argues condemnation is legitimate; grounds this in available moral knowledge (abolitionist arguments) distinguishing it from epistemic presentism. | Condemns the legislator simply because slavery is wrong now, ignoring the 1858 epistemic context. | Whig history recitation without philosophical justification (Failure Mode i). |
  | **4. Case B Verdict** | 5 | Argues blame is illegitimate; grounds this in unavailable causal knowledge, distinguishing it from moral failure. | Excuses the official solely because "standards were different" without specifying the epistemic barrier. | The intentionalist case offered as if it settled moral appraisal too (Failure Mode ii). |
  | **5. Vocabulary & Blame** | 5 | Addresses *avant la lettre* concepts and the normativity of the "blame requires knowledge" principle itself. | Asserts vocabulary is either always anachronistic or always fine without qualification; ignores the self-application of the blame norm. | Assuming vocabulary projection is inherently objectionable or ignoring the self-referential norm problem. |

  **Withholding Marks:**  
  Marks are withheld for defining presentism generally (Point 1 requires separation); for arguing presentism is unavoidable without critiquing the inference from situatedness to incurability (Point 2); and for name-dropping authors (explicitly forbidden in the question). A script that argues "we are all presentists so it doesn't matter" scores zero on Point 2 and loses significant marks on Points 3 and 4 for failing to engage the cases.

  **Script Characterisation:**  
  **First-class:** Dynamically uses the RPP to drive a wedge between Case A and Case B, exposing the normative weight of the "blame requires knowledge" principle.  
  **Upper-second:** Correctly distinguishes the cases and presentism types but treats the RPP as a fixed rule rather than a principle to be tested for stability.  
  **Third-class:** Summarizes the anti-presentist canon or argues that all history is inevitably presentist, failing to separate epistemic from moral evaluation.

  ***

