prompt: |-
  So my school just made everyone install this hookup consent app for dorms and its kind of wierd and I'm trying to figure out what idea of consent its actually built on.

  Heres how it works as far as I can tell: you both tap agree in the app and you get a green check that lasts like two hours, there is no undo button in the app itself but the FAQ says if someone says no out loud afterwards that still revokes it. Lying to get someone to tap, like about your name or whether you have an STI or whether youre using protection, does not void the tap according to the FAQ, they treat the tap as still valid. Being super drunk to the point you are slurring does void it, but just being tipsy or buzzed still counts as able to tap. And for pressure, if someone threatens to get you kicked off a team unless you tap that voids it, but if its just that they are way older or popular or your TA and you feel you cant really say no, the school still treats the tap as valid.

  So what theory of valid consent is baked into that design? Like when does deception matter, when does pressure count as coercion, when is someone competent enough to count? Is that combo even coherent or are they mixing and matching ideas that dont fit together? And does the app actually need that theory or could a totally different view of consent also live with these rules? Tell me what they would have to change in the app if they flipped to the opposite views, like any material lie kills consent or any big power gap kills consent.

  I dont need any citations or reading lists, just walk me through the logic cause it feels like they are trying to have it both ways.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Analyze the User's Request:**
      *   **Context:** The user's school implemented a "hookup consent app" for dorms.
      *   **Mechanism:** Both parties tap "agree" $\rightarrow$ green check (2 hours). No undo button in-app. Verbal "no" overrides app.
      *   **Specific Rules:**
          *   Deception (name, STI, protection) $\rightarrow$ Consent *still valid*.
          *   Intoxication (slurring/blackout) $\rightarrow$ Consent *void*.
          *   Intoxication (tipsy/buzzed) $\rightarrow$ Consent *valid*.
          *   Coercion (explicit threat, e.g., kick off team) $\rightarrow$ Consent *void*.
          *   Coercion (implicit pressure, e.g., age, popularity, TA status) $\rightarrow$ Consent *valid*.
      *   **Questions:**
          *   What theory of consent is baked into this design?
          *   When does deception/pressure/competence matter in this model?
          *   Is the combination coherent or mixed/mismatched?
          *   Does the app *need* this specific theory, or could others work?
          *   What changes would be needed to flip to opposite views (e.g., material lie kills consent, power gap kills consent)?
      *   **Constraint:** No citations or reading lists. Just walk through the logic.

  2.  **Deconstruct the App's Logic (The "Baked-in" Theory):**
      *   *Core Principle:* It looks like **Contractualism / Transactional Consent**. It treats consent like a digital contract or a handshake deal.
      *   *Competence:* Threshold-based. You are either "out" (slurring) or "in" (buzzed). It assumes a binary state of capacity rather than a spectrum.
      *   *Voluntariness:* Focuses on *explicit* coercion (threats of harm) rather than *structural* or *implicit* coercion (power dynamics). It assumes that unless a gun is held to your head (metaphorically), the choice is free.
      *   *Information:* Ignores "informed" consent regarding personal attributes. It treats consent to *sex* as separate from consent to *specific conditions* of sex (like protection or STI status).
      *   *Revocability:* Technically rigid (no undo button), but legally/philosophically acknowledged as revocable verbally. This creates a tension between the *tool* and the *policy*.

  3.  **Evaluate Coherence:**
      *   *Is it coherent?* Internally, yes, it's consistent with a specific legalistic/liability-reduction model. It aims for clear "bright lines" to adjudicate incidents.
      *   *Is it philosophically robust?* It clashes with affirmative consent models (Friesian "Yes means Yes") that emphasize ongoing enthusiasm and context. It also clashes with feminist legal theory regarding power dynamics and informed consent.
      *   *The "Both Ways" feeling:* The user feels this because the app creates a *technical* shield (the green check) that implies finality, while the FAQ admits human nuance (verbal no, extreme drunk). It tries to digitize a human interaction that resists digitization.

  4.  **Identify the Specific Theoretical Framework:**
      *   **Name:** "Performative Contractualism" or "Administrative Consent."
      *   **Focus:** Evidence generation and risk management for the institution, rather than ethical interaction between individuals.
      *   **Key Tenets:**
          *   Consent is an *event* (the tap), not a *process*.
          *   Capacity is *binary* (sober enough vs. too drunk).
          *   Coercion is *overt* only (threats vs. pressure).
          *   Fraud is *non-material* (lies about self don't negate the act).

  5.  **Address the "Flip" Scenario (Opposite Views):**
      *   *View 1: Informed Consent (Deception matters).*
          *   Change: App needs disclosure fields (STI status, protection) that must match. If they don't, the check is void.
      *   *View 2: Structural/Power Dynamics (Pressure matters).*
          *   Change: App flags power imbalances (TA/Student, Coach/Athlete). Prevents matching or requires extra verification.
      *   *View 3: Continuous/Process Consent (Revocability matters).*
          *   Change: Add a "Stop/Undo" button that notifies the other party instantly. Require periodic re-checks.

  6.  **Drafting the Response (Iterative refinement):**
      *   *Introduction:* Acknowledge the weirdness. Validate the user's intuition that this is a specific legal/administrative model.
      *   *Section 1: The Core Theory.* Label it. It's "Contractualism" mixed with "Liability Management." Explain the bright-line rules.
      *   *Section 2: Breaking down the three pillars (Competence, Coercion, Deception).*
          *   *Competence:* Binary threshold. Why? Easy to prove.
          *   *Coercion:* Overt vs. Implicit. Why? Hard to prove implicit pressure digitally.
          *   *Deception:* Irrelevant to the act. Why? Distinguishes between "sex" and "conditions of sex."
      *   *Section 3: Coherence Check.* Is it consistent? Yes, for its goal (protecting the school). No, for ethical sex (ignores nuance). Explain the tension between the "Green Check" (finality) and "Verbal No" (revocability).
      *   *Section 4: The "Flip".* What if we changed the theory?
          *   *Informed Consent:* Require data entry.
          *   *Power Dynamics:* Block certain pairings.
          *   *Continuous Consent:* Make the check expire faster or require pulses.
      *   *Conclusion:* Summarize. The app isn't designed for *ethics*; it's designed for *adjudication*.

  7.  **Refining the Tone:**
      *   Keep it analytical but accessible.
      *   Avoid academic jargon where possible, or explain it simply.
      *   Ensure the distinction between "Institutional Protection" and "Interpersonal Ethics" is clear, as that's likely the source of the user's "weird" feeling.

  8.  **Self-Correction/Safety Check:**
