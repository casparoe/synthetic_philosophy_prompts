  # JOINT STATEMENT ON EXPECTED VALUE FANATICISM
  **Parties:** Side A (Fanaticism-Compatible) & Side B (Guardrail-Compatible)
  **Date:** [Current Date]
  **Status:** Live Controversy (No Academic Consensus)

  ## 1. AGREED CLAIMS
  *Both parties affirm the following to establish the scope of the dispute.*

  1.  **Definition:** "EV Fanaticism" is defined here as the claim that an action with a sufficiently large potential payoff should be preferred over a certain good, even if the probability of success is vanishingly small (e.g., $10^{-12}$), provided the mathematical expected value (EV) is higher. This is distinct from Pascal's Wager (belief in God) and focuses on secular, consequentialist choice.
  2.  **The Hard Cases:** Both sides agree that standard EV maximization works for "normal" uncertainties (e.g., 10% vs 20% chances). The dispute is strictly limited to the **extreme tails**: probabilities so small that they approach epistemic limits, and values so large they approach conceptual limits.
  3.  **Epistemic Uncertainty:** Both sides agree that human probability estimates for extreme tails are unreliable. The dispute is not about *whether* they are unreliable, but **how decision theory should process that unreliability**.
  4.  **Burden of Argument:**
      *   **Side A** bears the burden of explaining why an agent should not ignore hypotheses where their model is known to be fragile.
      *   **Side B** bears the burden of proposing a non-arbitrary alternative rule that does not simply smuggle in a bias against the long-term future.
  5.  **Settled Background:** It is settled that if utility is bounded, fanaticism disappears. It is settled that if probabilities are known precisely (e.g., a lottery machine), fanaticism holds. **The live controversy is the intersection of unbounded utility and endogenous probability error.**

  ## 2. DISAGREEMENTS TABLE
  *Positions stated in each side's own preferred terminology.*

  | Topic | Side A (Fanaticism-Compatible) | Side B (Guardrail-Compatible) |
  | :--- | :--- | :--- |
  | **Core Norm** | Rationality requires maximizing mathematical expectation. To do otherwise is to accept a guaranteed loss in value over repeated trials. | Rationality requires robust decision-making under model uncertainty. Maximizing raw calculation on broken inputs is irrational. |
  | **Probability Error** | Uncertainty about a probability estimate is itself a probability distribution. You must integrate over it, not discard the estimate. | When an estimate relies on weak evidence, the "confidence interval" is so wide it swamps the mean. The mean becomes meaningless. |
  | **Utility Function** | Utility should not be arbitrarily bounded. Capping value implies you wouldn't save a second world if the first was already saved. | Utility must be effectively bounded for decision-making. Human cognition and moral significance saturate; beyond a point, "more good" is undefined. |
  | **Exploitability** | If you reject positive EV bets, you are vulnerable to "money pumps" (cyclic preferences) or inconsistent choices. | If you accept these bets, you are vulnerable to "Pascal's Muggers" (exploitation by fabricated claims). Avoiding exploitation is priority. |

  ## 3. CRUXES & TEST CASES
  *Specific points where empirical or logical resolution would shift confidence. Predictions are recorded in advance.*

  ### Crux A: Probability Error vs. Value Shape
  **Question:** Is the rejection of fanaticism driven primarily by bounded utility (value stops growing) or by probability discounting (the odds are actually lower than calculated)?
  *   **Test Case:** A scenario where utility is explicitly unbounded (e.g., number of happy lives), but the probability estimate comes from a complex causal chain with known noise.
  *   **Side A Prediction:** Even with noise, if the mean EV remains higher than the sure thing, the bet is taken. The noise averages out.
  *   **Side B Prediction:** The noise invalidates the mean. We apply a "reliability discount" that reduces the effective EV below the sure thing, regardless of the theoretical cap on value.
  *   **Resolution Condition:** If Side B admits they would take the bet *if* the probability were known precisely (e.g., physical chance), the crux is probability error. If they still reject it due to the magnitude of the payoff, the crux is value shape.

  ### Crux B: The Portfolio Problem (Correlation)
  **Question:** Does facing many independent fanatic-style bets validate the strategy (Law of Large Numbers) or compound the error (Correlated Model Risk)?
  *   **Test Case:** An agent is offered 1,000 independent opportunities, each costing $1, with a $10^{15}$ payoff at $10^{-12}$ probability. Total cost: $1,000. Expected Return: $1,000,000.
  *   **Side A Prediction:** Take all 1,000. The variance decreases relative to the mean. The strategy is vindicated by volume.
  *   **Side B Prediction:** Reject all (or most). The error in estimating $10^{-12}$ is likely systemic (model error), not random. If the model is wrong once, it is wrong 1,000 times. The losses are certain; the gains are illusory.
  *   **Resolution Condition:** If Side B admits they would take the 1,000 bets even if they reject the single bet, the issue is variance tolerance. If they still reject the portfolio, the issue is fundamental distrust of the model.

  ### Crux C: Symmetry and "Cheap Claims"
  **Question:** Do opposing extreme claims cancel out, rendering the decision neutral?
  *   **Test Case:** Mugger A says "Give $5 or I destroy $10^{100}$ value." Mugger B says "Give $5 or I *save* $10^{100}$ value." Both have equal evidence strength.
  *   **Side A Prediction:** The EVs sum to roughly zero (net neutral). You are indifferent, but not because the logic is broken, but because the values cancel.
  *   **Side B Prediction:** The existence of the claims themselves is evidence of a broken epistemic environment. You should reject *both* not because they cancel, but because the *class of claim* is unreliable.
  *   **Resolution Condition:** If Side A treats the net-zero scenario as a reason to ignore the muggers entirely (rather than calculating a net sum), they are conceding to a heuristic guardrail.

  ### Crux D: Ideal vs. Human Agents (Missing Crux)
  **Question:** Is this theory for a God-like calculator or a human brain?
  *   **Test Case:** A computer algorithm with infinite compute vs. a human donor.
  *   **Side A Prediction:** The rule is the same for both. An ideal agent takes the bet; humans should approximate the ideal agent as closely as possible.
  *   **Side B Prediction:** The rule differs. An ideal agent might calculate the true odds; a human must use heuristics (guardrails) because their "compute" includes bias and self-deception.
  *   **Resolution Condition:** If Side A admits humans should use guardrails even if the "true" rational norm is fanaticism, the dispute is purely about implementation, not theory.

  ## 4. VERBAL DISPUTES & UNCERTAINTIES
  *Areas where we suspect we are arguing past each other.*

  1.  **"Expected Value":** Side A uses the mathematical definition ($\sum p \times v$). Side B often uses a pragmatic definition ("actionable expectation"). We agree to distinguish **Theoretical EV** (math) from **Decision EV** (input for action).
  2.  **"Rationality":** Side A defines this as **Consistency** (avoiding Dutch books). Side B defines this as **Success** (achieving good outcomes in the real world). We acknowledge these may come apart in extreme tails.
  3.  **Uncertainty Flag:** We are unsure if "bounded utility" is a coherent escape for Side B. If the bound is high enough, does it not simply push the fanaticism problem further out rather than solving it? This remains an open technical question.

  ## 5. STATUS OF FIELD
  *   **Settled:** None of the above is settled in decision theory or ethics.
  *   **Live Controversy:** This is an active "open problem" in Effective Altruism and Longtermist circles.
  *   **Warning:** Neither side should present their position as the standard view. Side A's view follows from standard axioms (VNM) but yields counterintuitive results. Side B's view yields intuitive results but requires modifying standard axioms.

