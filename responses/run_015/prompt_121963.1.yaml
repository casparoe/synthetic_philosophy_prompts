prompt: |-
  Two people I know have been arguing about expected value fanaticism for ages and I want to make them finally write the adversarial collaboration they should have produced by now. Side A is a committed fanatic: a 1-in-10^12 shot at an astronomically huge payoff beats a much bigger sure thing, every time, and the shakiness of the estimate doesn't by itself get you out of it. Side B thinks that's a reductio and wants some kind of guardrail — a ceiling on value, a probability floor below which you stop trading, discounting by how reliable the estimate is, whatever works.

  Draft the joint statement they could both sign. Start with a numbered section of claims both accept: what the fanaticism problem actually is (not just Pascal's wager with better branding), which stylized cases both agree are genuinely hard, and where the burden of argument sits. Then a disagreements table, with each side's position stated in the wording that side would accept for itself.

  The cruxes I care about: (a) whether the real fight is about the shape of the value function or about what to do when the probability estimate itself might be off by orders of magnitude; (b) the portfolio version — if instead of one small-chance/astronomical-payoff choice you face a huge number of them, does the fanatic's advice get stronger, or does the avoider's worry just reappear because the errors in the estimates are correlated; (c) the cheap-claims point, whether for every Pascal's mugger there's a symmetry argument that cancels them out. Add any crux you think I've missed, and for each crux give a concrete case or argument both would accept as bearing on it, with each side's prediction written down in advance. If some of the dispute is really verbal — about what "expected value" or "value" is even doing in the argument — say which part and why.

  Keep it tight, no papers or citations, i want something I can hand to both of them. Also flag atleast roughly which claims are settled among people who work on this and which are live controversy, and don't let one side's contested assumptions sneak in as settled background — tell me where you're unsure.
reasoning: |-
  Here's a thinking process that leads to the suggested joint statement:

  1.  **Analyze the Request:**
      *   **Goal:** Draft a joint statement for an adversarial collaboration between two people arguing about "expected value fanaticism" (Longtermism/Pascal's Mugging territory).
      *   **Side A (Fanatic):** 1-in-$10^{12}$ at huge payoff > sure thing, even with shaky estimates.
      *   **Side B (Guardrail):** Needs a ceiling, probability floor, or reliability discount to avoid absurdity.
      *   **Structure:**
          1.  Numbered section of agreed claims (definition, hard cases, burden of proof).
          2.  Disagreements table (Side A vs. Side B wording).
          3.  Cruxes section (specifically addressing: value function vs. probability error, portfolio/correlation, symmetry/cheap claims). Add missing cruxes.
          4.  Concrete cases/predictions for each crux.
          5.  Flag settled vs. live controversy.
          6.  Identify verbal disputes.
      *   **Constraints:** Tight, no papers/citations, handable format, avoid sneaking contested assumptions into background.

  2.  **Deconstruct the Core Conflict:**
      *   *The Fanatic's Core:* Expected Value (EV) maximization is the normative standard. If $P \times V > \text{Sure Thing}$, you take it. Rejecting this implies arbitrariness or inconsistency.
      *   *The Guardrail's Core:* EV maximization breaks down at extremes due to epistemic limits, model uncertainty, or bounded rationality. Blindly following EV leads to exploitation (Pascal's Mugging) or neglect of certain good.
      *   *The "Shakiness" Point:* Side A says shakiness doesn't *automatically* discount EV. Side B says shakiness *is* the reason to discount.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need to define "Fanaticism" neutrally. It's not just Pascal's Wager (which is about belief); it's about choice under extreme uncertainty.
      *   Need to agree on *where* the tension lies. It's not about normal decisions. It's about the tails.
      *   Burden of Proof: Side A needs to show why the math holds. Side B needs to show why the math breaks or why alternative norms are better.
      *   *Settled vs. Live:* It's mostly live. But agreed that standard EV works in normal cases.

  4.  **Drafting Section 2: Disagreements Table:**
      *   Need to capture the *spirit* of each side without caricature.
      *   Side A: "Epistemic uncertainty is just another probability layer."
      *   Side B: "Epistemic uncertainty invalidates the point estimate."
      *   Side A: "Consistency requires taking the bet."
      *   Side B: "Survival/robustness requires ignoring the bet."

  5.  **Drafting Section 3: Cruxes (The Meat):**
      *   *Crux 1: Probability vs. Value Shape.* Is it bounded utility (B) or unbounded utility + precise prob (A)?
      *   *Crux 2: Portfolio/Correlation.* If we have many such chances, does law of large numbers save A, or does correlated error save B?
      *   *Crux 3: Symmetry/Cheap Claims.* Do opposite muggers cancel out?
      *   *Crux 4 (Missing):* *Decision Rule vs. Belief.* Is this about what you *believe* is best or what *rule* you should adopt? (Rule Consequentialism angle).
      *   *Concrete Cases:* Need specific scenarios to test these.
          *   For Prob vs. Value: A specific bounded utility function test.
          *   For Portfolio: A sequence of 1,000 muggings.
          *   For Symmetry: A "Reverse Mugger" scenario.

  6.  **Refining the Content (Self-Correction/Constraint Check):**
      *   *Constraint:* "Don't let one side's contested assumptions sneak in as settled background."
      *   *Check:* Am I assuming EV is the goal? Side B might reject EV maximization as the *sole* goal. I need to phrase it as "Maximizing Expectations" vs. "Robust Decision Making."
      *   *Constraint:* "Flag settled vs. live."
      *   *Check:* Most of this is live controversy in effective altruism/decision theory circles. I need to be explicit that there is no academic consensus.
      *   *Constraint:* "Verbal disputes."
      *   *Check:* Is "Expected Value" defined the same way? Side A means mathematical expectation. Side B might mean "actionable expectation." I need to highlight this.

  7.  **Final Polish:**
      *   Tone: Formal, neutral, precise.
      *   Formatting: Clear headings, tables for disagreements.
      *   Length: Keep it tight (as requested).

  8.  **Drafting the Content (Iterative refinement):**
      *   *Intro:* Keep it brief.
      *   *Agreements:* Focus on the definition of the problem. It's about the interaction of tiny probabilities and huge values.
      *   *Disagreements:* Use "We claim..." format.
      *   *Cruxes:* Make sure the predictions are falsifiable (in principle).
      *   *Settled/Live:* Add a specific footer or note about the state of the field.

      *(Self-Correction on Crux 1)*: The prompt asks specifically about (a) shape of value function vs. probability error. I need to make sure the crux distinguishes these. Side A usually argues probability error isn't enough; Side B argues either value is bounded OR probability is too noisy.
      *(Self-Correction on Crux 2)*: Portfolio. Side A says diversification helps. Side B says systemic model error kills diversification.
      *(Self-Correction on Crux 3)*: Symmetry. Side A says net EV is zero. Side B says the *risk* of being mugged is the cost, regardless of symmetry.

      *(Adding Crux 4)*: The "Action-Guiding" crux. Is the theory for an ideal agent or a human?

      *(Verbal Dispute)*: The definition of "Rationality." Maximization vs. Satisficing/Robustness.

  9.  **Final Review against constraints:**
      *   No citations? Yes.
      *   Tight? Yes.
      *   Handable? Yes.
      *   Flagged settled/live? Yes.
      *   Sneaky assumptions? I will ensure the "Agreed Claims" don't assume unbounded utility.

  10. **Final Output Generation** (Proceeding to generate response based on these thoughts).
