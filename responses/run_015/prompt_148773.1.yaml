answer: |-
  TO: University Research Ethics Committee
  FROM: Neuroethics Review Panel
  DATE: 24 October 2023
  SUBJECT: Decision Regarding Protocol NEU-2023-04 – Null-Interface State Pilot Study

  The Neuroethics Review Panel recommends conditional approval of the proposed pilot study, contingent upon substantial revisions to the informed consent process and the implementation of independent safety monitoring.

  While the majority of the Panel recognises the scientific merit in investigating predictive self-modelling and the potential implications for understanding moral cognition, we acknowledge that this protocol exceeds the risk profile of standard cognitive manipulation. The proposed induction of a 'null-interface state' presents a novel category of intervention where the subject's capacity for agency-tracking is the specific variable under suspension. Consequently, standard ethical safeguards predicated on continuous participant autonomy are insufficient. Approval is granted only on the condition that the research team adopts a staged consent procedure, wherein participants reaffirm their willingness to proceed at intervals prior to the induction phase, and that an independent safety monitor, unaffiliated with the research team, is empowered to halt the session immediately upon signs of distress or dissociation that persist post-induction.

  The Panel has given serious weight to the minority view that informed consent is structurally inadequate in this context. The strongest argument against approval posits that if the protocol successfully suspends the conscious self-model, the participant temporarily loses the very framework required to comprehend harm or withdraw consent during the event. This is not merely a procedural gap but a philosophical paradox: one cannot validly consent to the temporary absence of the entity that holds the consent. While we are not persuaded that this necessitates outright rejection—given that analogous risks exist in general anaesthesia and deep meditative states—we accept that this uncertainty cannot be fully resolved by standard disclosure forms. Therefore, the consent documentation must explicitly acknowledge this theoretical limitation, stating clearly that the researchers cannot guarantee the participant's ability to process the experience normally during the null-interface state.

  Furthermore, the debriefing protocol must be extended beyond standard practice. Given the potential for existential distress or altered self-attribution following the restoration of the interface, participants must be offered mandatory follow-up sessions at 24 hours and one week post-study. The Panel treats this pilot as a probe into both neurocognitive function and ethical boundaries; should the initial cohort report significant adverse effects regarding agency or moral intuition, the conditional approval will be revoked immediately. We proceed not by dismissing the philosophical risk, but by containing it within a framework of heightened vigilance and transparent acknowledgement of the unknown.
