answer: |-
  The light on Elara's desk turned green. She adjusted her glasses and pressed the button to unlock the door.

  The first claimant was an older man, Mr. Henderson. He sat carefully, protecting a bandaged arm. A tree limb had fallen on him during a storm.

  "Walk me through the moment, please," Elara said, her fingers hovering over the keyboard.

  "I was walking home," Henderson said. "The wind picked up. I took shelter under the oak on 4th. The branch broke."

  "Did you know the tree was diseased?"

  "No."

  "Did you seek shelter there because it was safer than the open street, or because you preferred the look of the tree?"

  "Because it was shelter."

  Elara typed. *Seeking safety is not a gamble.* She pulled up the weather logs. Storm severity: Exceptional. Tree maintenance records: Clean. There was no choice here, only physics and weather. This was brute luck.

  "Approved," she said. "Full repair and compensation for lost wages."

  Henderson didn't smile. He looked down at his bandages, then at the form she slid across the desk. He had to sign a declaration stating he had not been negligent, not been showing off, not ignored a warning sign. To receive help, he had to certify his own blamelessness. He signed with a trembling hand, his face flushed with the quiet shame of having to prove he was a victim rather than a participant. He left without looking at her.

  The light turned green again.

  Ms. Vane entered. She moved with a stiff leg, a scar visible on her cheek. She was a base jumper. She had jumped from the Kestrel Ridge; her chute had tangled.

  "I understand the act was voluntary," Elara said.

  "It was," Vane said. "But I need you to look at Annex C. Psychological predisposition."

  Elara opened the file. It was thick with therapist reports. "It says here you were raised by parents who normalized extreme risk. That your reward systems were conditioned to seek adrenaline from age three. You argue you couldn't *not* jump."

  "I argue that my capacity to choose otherwise was compromised by my upbringing. I didn't choose my childhood. Therefore, I didn't choose the urge that led to the jump."

  Elara paused. This was the hard edge of the principle. If the urge is circumstance, is the act circumstance? If the act is circumstance, is anyone responsible for anything?

  "The Bureau's precedent is clear," Elara said. "We compensate for unchosen constraints on your options, not unchosen influences on your desires. You knew the risk. You packed the chute. You jumped."

  "So I pay for being who I am?"

  "You pay for what you did." Elara's hand moved to the denial code. "Option Luck. Claim denied."

  Vane stared at her. There was no anger, only a cold recognition. She stood up, her leg dragging slightly. "Then I hope the next person gets better luck than me. Or better parents."

  She left. Elara saved the file. The logic held. If they paid Vane, the line between person and circumstance dissolved. The system required a boundary. This was the boundary.

  The light turned green.

  Mr. Kovic sat down. He was young, pale. He had a respiratory condition.

  "I worked at the Textile Plant," Kovic said. "There was a leak. Chemical exposure."

  "Standard compensation applies for industrial exposure," Elara said.

  "But I wasn't assigned to that floor. I swapped shifts with a friend. Just for that week. Because I wanted to watch the game on his break."

  Elara stopped typing. She pulled up the plant layout. The leak was on the second floor. Kovic was scheduled for the third. The third floor was safe.

  "You chose the shift swap?"

  "Yes."

  "Did you know about the leak?"

  "No. No one did."

  Elara leaned back. This was the butterfly effect. A small, ordinary decision—watching a game—had intersected with a hidden hazard. Was living a gamble? Every movement carried risk. If she denied him, she was saying every deviation from a safe baseline is a wager. If she approved him, she was saying only the baseline is safe, and all movement is compensated.

  She looked at the log. The shift swap protocol was standard. No safety briefing indicated the second floor was dangerous that day. To him, the risk was invisible.

  "Invisible risk is brute luck," Elara murmured, mostly to herself. She marked it *Approved*.

  Kovic exhaled, a sound like a deflating tire. "Thank you."

  "Next time," Elara said, "document the swap."

  "There won't be a next time."

  The light turned green.

  The last claimant was Ms. Rostova. She was a cellist. She held her hands in her lap, still.

  "Repetitive strain injury," Elara read from the screen. "Tendon damage in the left hand."

  "Yes."

  "Standard repair restores grip strength and dexterity to national average norms."

  "That's not enough," Rostova said. "I need the micro-surgery. The standard repair leaves a two percent loss in fine motor control. I can type, I can cook. I cannot play the cello."

  Elara knew the code. *Restoration to Functionality.* The insurance guaranteed the capacity to participate in society, not the capacity to excel in a specific vocation.

  "My career is my life," Rostova said. "Losing the cello is losing my circumstances. It's who I am."

  "Ambition is not a circumstance," Elara said. The phrase was printed on the back of the claim form. "You chose the profession. The risk of injury is inherent to the choice. We cover the injury, not the career loss."

  "So I get my hand back, but I lose my life."

  "You get the hand you were owed before you chose the risk."

  Rostova looked at her hands. "And if I had been born with this defect? If this was brute luck?"

  "Then we would cover the therapy to reach your potential."

  "But I broke it trying to reach my potential."

  "Choice changes the ledger."

  Rostova nodded slowly. She didn't argue. She knew the rules. Everyone knew the rules. "Approved for standard repair," she said.

  "Approved for standard repair," Elara confirmed.

  Rostova stood. She looked at the door where Vane had left. "At least I get something."

  "The system works," Elara said. It wasn't a defense. It was a statement of fact, like noting the time.

  Rostova left.

  Elara sat alone. The office was quiet, the hum of the servers the only sound. She looked at the four files on her screen. One denied, three approved. The denied claim was correct. The woman had chosen the jump. The approved claims were correct. The tree was brute luck, the chemical leak was invisible risk, the cello was a chosen ambition.

  The line held. It was sharp and clear.

  Elara logged out. She stood up and put on her coat. Outside the window, the city stretched out, a grid of choices and chances. People walked on sidewalks, drove cars, ate food, took jobs. Some would fall. Some would be compensated. Some would not.

  She walked to the door and turned off the light. The green lamp on her desk went dark. She locked the office and walked down the hall, her footsteps echoing on the tile. She did not think about Vane's leg or Henderson's shame. She thought about the train schedule. She had chosen to take the 5:15. If she missed it, she would have to wait an hour. That was option luck.

  She quickened her pace.
