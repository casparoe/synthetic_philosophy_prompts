  Please argue that the basic axioms of math being inconsistent is actually more plausible than people think, and that this should make us adopt a kind of fallibilist structuralism about numbers. The key point: we picked axioms like ZFC mainly because theyre fruitfull and let us prove neat things, not because we have any independant way to verify consistency. That selection process is basically overfitting—we keep strengthening the system until it does what we want, which makes hidden contradictions more likely, not less. So consistency shouldnt be treated as a safe default. Explain what that means for the idea that mathematical objects exist 'out there' independently of our theories. Keep it casual, no bibliographies or citation requests, and dont just rehash Gödel's theorems—use the overfitting analogy to drive the point home.
