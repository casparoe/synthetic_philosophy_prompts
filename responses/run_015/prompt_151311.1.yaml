answer: |-
  ### The Canonical vs. Commitment-Constitutive Accounts of Sunk Costs

  The disagreement over the sunk-cost fallacy is not merely a dispute over financial prudence; it is a fundamental clash between two ontologies of agency. The **Canonical Decision-Theoretic (CDT)** account views the agent as a locus of preferences optimizing outcomes from the present moment forward. The **Commitment-Constitutive (CCT)** account views the agent as a narrative entity whose identity is constructed through the honoring of past investments.

  #### 1. The Canonical Decision-Theoretic (CDT) Account
  In the CDT framework, rationality is defined as the maximization of expected utility relative to the current state of the world. The temporal horizon of rational calculation begins at $t_{now}$. Any resource expended prior to $t_{now}$ (money, time, effort) is irrecoverable and therefore possesses zero marginal utility.

  *   **Ontology of the Agent:** The agent is effectively a series of time-slices. While psychological continuity exists, normative weight is not assigned to it. The agent at $t_{now}$ is not responsible for the errors of the agent at $t_{past}$, nor bound by their commitments unless those commitments offer future instrumental value.
  *   **Definition of Cost:** Cost is strictly a reduction in available resources. A "sunk cost" is a resource subtraction that has already occurred. To factor it into a current decision is to double-count a loss, leading to suboptimal allocation (e.g., continuing a losing project to "justify" prior spending).
  *   **Prescription:** Ignore the past. Cut losses immediately if the future marginal cost exceeds the future marginal benefit.

  #### 2. The Commitment-Constitutive (CCT) Account
  The CCT framework argues that certain past expenditures are not merely resource subtractions but investments in the *constitution* of the agent or institution. Here, rationality includes the maintenance of diachronic integrity. To abandon a project solely because it is no longer instrumentally optimal may be to dismantle the very identity that makes the agent capable of valuing anything at all.

  *   **Ontology of the Agent:** The agent is a narrative arc. Agency is not just about choosing outcomes but about being the *author* of a coherent life or institutional history. The "self" is partly constituted by its commitments.
  *   **Definition of Cost:** Cost is a constitutive investment. The resources expended were the price of entering a specific normative status (e.g., "loyal partner," "historic institution"). Abandoning the project renders those past resources "waste" rather than "foundation."
  *   **Prescription:** Honor the commitment if abandoning it would fracture the agent's identity or destroy the trust relations that constitute their social reality, even at a net instrumental loss.

  ---

  ### Structurally Analogous Cases

  To illuminate the divergence, we examine two cases where the frameworks yield opposite prescriptions.

  #### Case A: The Institution and the Failing Program
  *Scenario:* A centuries-old university maintains a Department of Classical Languages. Enrollment is negligible, and the cost per student is ten times that of the Engineering Department. The university faces a budget deficit.

  *   **CDT Prescription:** **Eliminate the Department.** The past endowment and history are sunk. The rational choice is to reallocate funds to Engineering, where marginal utility (jobs, research output, tuition revenue) is higher. Continuing the program is fiscal irresponsibility.
  *   **CCT Prescription:** **Maintain the Department.** The department is not a service provider but a symbol of the university's *raison d'être*. The "sunk costs" of the last 200 years are the foundation of the institution's brand and alumni loyalty. Cutting the program signals that the university is a transient corporation, not a steward of tradition. This breach of constitutive identity may cause long-term donor collapse, outweighing short-term savings. The cost is the price of being *this* university.

  #### Case B: The Individual and the Damaging Apprenticeship
  *Scenario:* An individual has spent five years in a rigorous, exploitative apprenticeship under a master. Two years remain for certification. The master is abusive, and the individual could earn more immediately by quitting and entering a different trade.

  *   **CDT Prescription:** **Quit Immediately.** The five years are gone. The future utility of enduring two more years of abuse is lower than the utility of a fresh start. Staying is an emotional error, valuing "pride" over well-being.
  *   **CCT Prescription:** **Complete the Apprenticeship.** The five years were not just time spent; they were a vow of transformation. To quit is to render the past five years meaningless suffering. By completing the term, the agent retroactively confers meaning on the sacrifice, transforming it from "waste" to "initiation." The cost is the price of integrity and the preservation of a self-concept as one who honors vows.

  ---

  ### The Nature of the Disagreement: Substantive or Conceptual?

  The disagreement between CDT and CCT is **primarily conceptual**, specifically regarding the ontology of the "cost" and the "agent," which drives a secondary substantive disagreement about norms.

  1.  **Conceptual Divergence (The Ontology of Cost):**
      *   For CDT, a cost is a **fungible resource unit**. It is distinct from the agent. Once spent, it is external to the agent's current decision matrix.
      *   For CCT, a cost is an **identity-forming event**. It is internal to the agent. The expenditure changes *who* the agent is. Therefore, it is not "sunk" in the sense of being dead; it is "sunk" in the sense of being a foundation (like a building's foundation is sunk into the ground).
      *   *Implication:* They are not arguing over the same variable. CDT analyzes *resource allocation*; CCT analyzes *status maintenance*.

  2.  **Substantive Divergence (The Norms of Rationality):**
      *   Because they define the entities differently, they disagree on the norm. CDT norms require efficiency. CCT norms require coherence.
      *   However, if one were to force the concepts to align (e.g., by arguing CCT just treats "identity" as a preference in the CDT utility function), CDT could theoretically absorb CCT. But this requires CDT to accept that preferences are endogenous to past actions, which violates the standard CDT axiom that preferences are exogenous and stable. Thus, the substantive disagreement rests on the conceptual refusal of CDT to allow the past to determine current value structures.

  **Verdict:** The disagreement is **conceptual** at the root. CDT treats the agent as a *container* of value; CCT treats the agent as a *creature* of history.

  ---

  ### Adjudication: The Precondition of Planning

  To adjudicate between these frameworks without appealing to authority, one must identify a functional criterion that determines which account is necessary for the possibility of agency itself. The decisive consideration is **The Precondition of Diachronic Planning.**

  **The Test:**
  Can a rational agent effectively execute long-term plans if they adhere strictly to the CDT account of sunk costs?

  **Analysis:**
  1.  **The Requirement of Binding:** Long-term projects (building a career, maintaining a marriage, constructing an institution) require the agent at $t_{now}$ to bind the agent at $t_{future}$. This binding is usually achieved through early investments (sunk costs) that make deviation at $t_{future}$ costly.
  2.  **The CDT Paradox:** If the agent at $t_{future}$ adheres strictly to CDT, they must ignore the early investments made at $t_{past}$. They will view the commitment as a "sunk cost" and defect if a marginally better option appears.
  3.  **The Consequence:** If all time-slices of an agent reason according to CDT, **no long-term plan can be initiated.** Knowing that their future self will ignore past investments, the present self will not invest in the first place. This leads to a "time-inconsistency" collapse where complex agency becomes impossible.
  4.  **The CCT Resolution:** CCT allows the agent at $t_{future}$ to treat past investments as *reasons for action* (constitutive commitments) rather than *sunk costs*. This allows the agent to bind themselves over time, making long-term planning viable.

  **Adjudicating Criterion:**
  The framework that renders the **capacity for complex, long-term agency impossible** is inferior as a normative theory of rationality, even if it is superior for isolated, one-off transactional decisions.

  *   **Empirical/Conceptual Check:** Observe systems of cooperation. In repeated games or social contracts, strategies that ignore past investment (pure "hit-and-run" optimization) typically trigger defensive responses from other agents, leading to lower overall payoffs than strategies that signal commitment through sunk-cost honoring (e.g., burning bridges to show resolve).
  *   **Conclusion:** If the CDT account makes the stability of the social and personal structures required for decision-making impossible, it is self-defeating. The CCT account is adjudicated as superior **not** because it maximizes short-term utility, but because it is a **transcendental precondition** for the existence of an agent capable of maximizing utility over a meaningful lifespan.

  Therefore, the "fallacy" is only a fallacy within the narrow context of isolated resource allocation. Within the broader context of constituting an agent capable of action over time, honoring sunk costs is often the only rational way to preserve the machinery of choice itself.
