answer: |-
  ### Specification of Requirements for an Account of Patriotic Attachment

  **Requirement 1**
  The account must explain why the state's interest in social cohesion does not automatically justify the inculcation of attachment.
  *   **Case:** The position of the state, which is to be both the teacher of the attitude and its beneficiary.
  *   **Status:** Non-negotiable (Democratic legitimacy).
  *   **Rules Out:** Justifications where state stability or administrative efficiency is sufficient moral ground for compulsory cultivation.

  **Requirement 2**
  The account must distinguish between a genuinely held virtue and a conditioned behavioral habit in a non-consenting subject.
  *   **Case:** The position of the pupil, who is to have the attitude inculcated and is yet supposed to have it genuinely.
  *   **Status:** Non-negotiable (Educational integrity).
  *   **Rules Out:** Behaviorist models that equate outward compliance or ritual participation with moral character.

  **Requirement 3**
  The account must specify which entity (country, nation, state, government, or compatriots) is the proper object of attachment and justify why the others are secondary or excluded.
  *   **Case:** A plurinational state several of whose constituent peoples regard the political unit as not theirs.
  *   **Status:** Non-negotiable (Conceptual clarity).
  *   **Rules Out:** Conflationist accounts that treat loyalty to a current regime or border configuration as identical to love of country.

  **Requirement 4**
  The account must allow for attachment to persist despite active disapproval of the country's current policies, moral standing, or government.
  *   **Case:** A reformer whose object is the country's unfulfilled aspirations rather than its present condition; someone who judges her country is the worst in the world and yet cares.
  *   **Status:** Non-negotiable (Democratic critique).
  *   **Rules Out:** Uncritical chauvinism or definitions that equate patriotism with approval of the status quo.

  **Requirement 5**
  The account must define the boundary where weighting compatriots more heavily becomes morally impermissible.
  *   **Case:** A country whose present prosperity depends on an ongoing wrong it will not acknowledge.
  *   **Status:** Contested (Cosmopolitans may refuse any partiality; Partialists may refuse external limits).
  *   **Rules Out:** Unbounded nationalism that permits complicity in injustice for the sake of national interest.

  **Requirement 6**
  The account must ensure that cultivating attachment does not systematically distort inquiry into the national past.
  *   **Case:** A country whose present prosperity depends on an ongoing wrong it will not acknowledge; the state as teacher.
  *   **Status:** Non-negotiable (Epistemic integrity). *[Rests on contested empirical claim: that state-curated attachment tends to distort historical inquiry.]*
  *   **Rules Out:** Myth-making curricula that prioritize social cohesion over historical truth.

  **Requirement 7**
  The account must explain how an attachment taught by authority can retain moral worth if moral worth typically requires voluntary adoption.
  *   **Case:** The position of the pupil; the distinction between the content of the attitude and its source (chosen, inherited, or taught).
  *   **Status:** Contested (Voluntarists may refuse that taught attachment has worth; Communitarians may refuse voluntariness is required).
  *   **Rules Out:** Accounts that require explicit consent for legitimacy, rendering all civic education morally void.

  **Requirement 8**
  The account must explain whether patriotic attachment is morally coherent when the political object no longer exists or lacks sovereignty.
  *   **Case:** A nation with no state, and the emigrant who has not been back in thirty years; a polity that has peacefully ceased to exist, loved by grandchildren.
  *   **Status:** Contested (Statists may refuse attachment without institutions; Cultural Nationalists may refuse institutions are necessary).
  *   **Rules Out:** Strict civic republicanism that ties moral standing solely to current citizenship or residency.

  **Requirement 9**
  The account must specify whether loyalty to the country can ever morally override obedience to the state's laws.
  *   **Case:** A public official who breaks the law out of loyalty to the country.
  *   **Status:** Contested (Legalists may refuse any extra-legal loyalty; Resistance theorists may require it).
  *   **Rules Out:** Absolute legalism that equates the state's law with the country's moral demand.

  **Requirement 10**
  The account must declare whether patriotic attachment is good in itself or only as a means to other social goods.
  *   **Case:** Patriotism's value and patriotism's effects on inquiry; instrumental value vs intrinsic value.
  *   **Status:** Contested (Perfectionists may insist on intrinsic value; Liberals may insist on instrumental only).
  *   **Rules Out:** Ambiguity regarding the ultimate justification for state promotion of the attitude.

  **Requirement 11**
  The account must distinguish the internal disposition from its public expression to prevent grading compliance as virtue.
  *   **Case:** The disposition and its public expression; the pupil as captive audience.
  *   **Status:** Non-negotiable (Assessment validity).
  *   **Rules Out:** Evaluation methods that measure patriotic virtue solely through public rituals or declarations.

  ***

  ### Analysis of Specification

  **Incompatible Requirements**
  I flag **Requirement 2** (Genuine virtue in a non-consenting subject) and **Requirement 7** (Moral worth of taught attachment). If an account holds that moral virtue necessarily requires voluntary choice (to satisfy the intuition behind Req 7), it cannot explain how a captive pupil possesses genuine virtue (failing Req 2). If it argues virtue can be instilled without choice, it risks collapsing the distinction between virtue and habit (failing Req 2).
  *   **Diagnosis:** This conflict indicts the **phenomenon**, not the specification. It reveals the central paradox of civic education: the state seeks to manufacture a spontaneity that, by definition, cannot be manufactured. The specification correctly exposes this tension rather than hiding it.

  **Most Exclusionary Requirement**
  **Requirement 4** (Critical Loyalty) does the most work. It excludes all forms of ethnic nationalism, "my country right or wrong" doctrines, and regime-loyalty models that cannot accommodate the "patriotic dissenter." It forces the theory to separate the *object* of love from the *performance* of the state, which is the hardest hurdle for state-sponsored curricula to clear.

  **Scoring of Candidate Views**

  **1. Patriotism as loyalty to constitutive values (Constitutional Patriotism)**
  *   **Score:** High on Req 3, 4, 6; Low on Req 8, 10.
  *   **Assessment:** It excels at distinguishing state from values and permitting critique, satisfying the reformer and plurinational cases. However, it struggles to explain the emotional depth required for the emigrant or the grandchildren of a defunct polity, and often retreats to instrumentalism to justify state cultivation.

  **2. Patriotism as non-voluntary, identity-constituting partiality (Communitarian)**
  *   **Score:** High on Req 7, 8; Low on Req 4, 5.
  *   **Assessment:** It handles the captive pupil and emigrant cases well by treating attachment as given rather than chosen. However, it frequently fails to provide sufficient resources for critical distance from the community's wrongs, risking complicity in the "prosperity based on wrong" scenario.

  **3. Patriotism as instrumental condition for redistributive solidarity (Liberal-Nationalist)**
  *   **Score:** High on Req 1, 10; Low on Req 2, 4.
  *   **Assessment:** It justifies state cultivation clearly by linking it to welfare outcomes, satisfying the ministry's pragmatic needs. Yet, it reduces the attitude to a tool, failing to account for the "worst country lover" for whom the attachment is not about solidarity, and risks Req 2 by treating the pupil as a means to social ends.
