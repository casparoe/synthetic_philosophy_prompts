prompt: |-
  I'm writing a dissertation chapter on epistemic normativity, and I keep finding myself drawn to the accuracy-first program — the idea that epistemic norms can be derived from the single goal of having accurate (or inaccuracy-minimizing) credences. But before I commit to building my argument inside that framework, I want to get clear on what the framework itself has to deliver. I'm not asking for a summary of the existing results (the Joyce/Pettigrew/Greaves and Wallace work on probabilism and conditionalization). What I need is a specification of the desiderata: what must any adequate accuracy-first account of epistemic norms be able to do to count as a success? This means laying out the phenomena it has to capture — which epistemic norms, exactly? All of them, or only synchronic ones? — the structural constraints on the inaccuracy measures it can deploy (propriety, strict propriety, and the case for why each is non-negotiable), the philosophical burdens it takes on by making accuracy the fundamental epistemic value (does it need to explain why accuracy matters, or can it treat that as primitive? Does it need to handle the value problem — why true belief is better than false belief — or is that someone else's job?), and the objections it must genuinely defuse rather than dismiss (the charge that accuracy-first reasoning gets the direction of explanation backwards, that it conflates pragmatic and epistemic reasons, that it cannot recover diachronic norms without smuggling in extra assumptions). For each desideratum, I want the case or consideration that makes it a genuine requirement rather than a parochial preference of one camp. And I would especially like to know whether any pair of these desiderata is plausibly jointly unsatisfiable — that is the kind of thing that would force a choice and reshape the whole project. If you can flag which single requirement does the most work to exclude otherwise attractive versions of the view, that would help me see where the real pressure points are before I sink another six months into this.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Topic:** Epistemic Normativity, specifically the Accuracy-First Epistemology (AFE) program.
      *   **Goal:** Specify the *desiderata* for an adequate AFE account (not a summary of existing results like Joyce/Pettigrew).
      *   **Key Questions to Address:**
          *   What phenomena must it capture? (Scope: synchronic vs. diachronic, all norms?)
          *   Structural constraints on inaccuracy measures? (Propriety, strict propriety, why non-negotiable?)
          *   Philosophical burdens? (Why accuracy matters? Value problem?)
          *   Objections to defuse? (Direction of explanation, pragmatic/epistemic conflation, diachronic smuggling.)
          *   **Crucial:** For each desideratum, explain *why* it's a genuine requirement (not just camp preference).
          *   **Crucial:** Identify potential incompatibilities (jointly unsatisfiable pairs).
          *   **Crucial:** Identify the single requirement that does the most work to exclude attractive versions (the "pressure point").
      *   **Tone:** Academic, rigorous, suitable for a dissertation chapter context. High-level philosophical analysis.

  2.  **Deconstruct the Accuracy-First Program:**
      *   Core Thesis: Epistemic rationality is instrumental rationality relative to the goal of accuracy (truth/error avoidance).
      *   Key Tools: Scoring rules (Brier score, etc.), Dominance arguments, Expected Utility.
      *   Key Figures: Joyce, Pettigrew, Greaves, Wallace, Leitgeb (though Leitgeb is more stability-focused), Dorst.

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Desideratum 1: Scope of Norms.*
          *   *Idea:* It needs to cover more than just "believe truths."
          *   *Refinement:* It must recover Probabilism (synchronic) and Conditionalization (diachronic). If it only does synchronic, it's incomplete. If it claims to do *all* norms (e.g., inquiry, suspension of judgment), it might overreach.
          *   *Requirement:* It must recover the standard Bayesian norms *and* explain their normative force without circularity.
          *   *Why genuine?* If it can't recover Conditionalization, it fails as a *general* epistemology. If it can't explain *why* we should follow them, it's just formalism.

      *   *Desideratum 2: The Inaccuracy Measure (Propriety).*
          *   *Idea:* The scoring rule can't be weird.
          *   *Refinement:* Strict Propriety is the big one. It ensures that an agent expects their own credence to be most accurate.
          *   *Why genuine?* Without propriety, the link between *rationality* (following your evidence) and *accuracy* breaks. If a proper scoring rule isn't used, the accuracy-first argument recommends changing your credence to something you don't endorse, which is self-defeating.

      *   *Desideratum 3: The Value of Accuracy (Veritism).*
          *   *Idea:* Why accuracy?
          *   *Refinement:* It needs to defend Veritism (accuracy is the *fundamental* epistemic good). It can't just assume it.
          *   *Why genuine?* If accuracy is just one value among many (e.g., understanding, coherence), the "First" in Accuracy-First is false. It needs to handle the "Value Problem" (why truth is better than falsehood, and why more truth is better).

      *   *Desideratum 4: Direction of Fit/Explanation.*
          *   *Idea:* Is it pragmatic?
          *   *Refinement:* It must show these are *epistemic* norms, not pragmatic ones disguised.
          *   *Why genuine?* The "Pragmatic Encroachment" or "Means-Ends" objection. If accuracy is just a goal like happiness, epistemic normativity collapses into pragmatic normativity. The account must distinguish epistemic 'oughts' from practical 'oughts'.

      *   *Desideratum 5: Diachronic Coherence (No Smuggling).*
          *   *Idea:* Updating.
          *   *Refinement:* Deriving Conditionalization shouldn't assume factivity of evidence or other normative premises.
          *   *Why genuine?* Greaves/Wallace showed you need assumptions about the learning situation. If you smuggle in "you ought to update," you haven't derived the norm from accuracy alone.

  4.  **Identifying Tensions/Incompatibilities:**
      *   *Tension 1: Propriety vs. Truth-Value Sensitivity.* Strict propriety often requires continuous measures. But some argue epistemic value should be sensitive to the *fact* of truth, not just distance. (Joyce's non-pragmatic constraint).
      *   *Tension 2: Accuracy-First vs. Non-Instrumental Norms.* Some norms (e.g., "don't believe contradictions") seem constitutive, not instrumental. If AFE says *all* are instrumental, it clashes with constitutive views.
      *   *Tension 3: The "Ought Implies Can" vs. Global Accuracy.* Maximizing global accuracy might require cognitive capacities we don't have.
      *   *The Big One:* **Strict Propriety vs. The Nature of Epistemic Value.** To get Probabilism, you need Strict Propriety. But Strict Propriety is motivated by *stability* of credence (a pragmatic-like feature). Is stability an *epistemic* virtue? If not, AFE relies on a non-epistemic constraint to derive epistemic norms.
      *   *Another Big One:* **Synchronic vs. Diachronic.** Deriving Conditionalization often requires assuming the agent *knows* they will update by conditionalization (Reflection Principle). This looks like smuggling.

  5.  **Selecting the "Pressure Point" (The Single Requirement):**
      *   *Candidate:* Strict Propriety.
      *   *Reasoning:* Without it, you can't prove Probabilism via dominance arguments. But justifying Strict Propriety *purely* in terms of accuracy (without referencing the agent's perspective/stability) is notoriously difficult (the "Joyce Impossibility Result" context, though Joyce argues for it). If Strict Propriety is a pragmatic constraint (about what you can expect), then AFE collapses into pragmatism. This is the hinge.

  6.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the sophistication of the query. Set the stage (AFE as instrumentalism).
      *   **Section 1: The Scope of Normative Recovery.** (Synchronic + Diachronic).
      *   **Section 2: The Structural Constraints on Inaccuracy.** (Strict Propriety & Continuity).
      *   **Section 3: The Axiology of Accuracy.** (Veritism & The Value Problem).
      *   **Section 4: The Distinctiveness of the Epistemic.** (Avoiding Pragmatic Collapse).
      *   **Section 5: Incompatibilities and Trade-offs.** (The "Impossibility" angles).
      *   **Section 6: The Critical Pressure Point.** (Strict Propriety's justification).
      *   **Conclusion:** Summary for the dissertation writer.

  7.  **Refining the Content (Self-Correction during drafting):**
      *   *Check:* Did I summarize results? *No, keep it to desiderata.*
      *   *Check:* Did I explain *why* they are requirements? *Yes, focus on the cost of failure.*
      *   *Check:* Is the tone right? *Needs to be critical but constructive.*
      *   *Nuance:* Make sure to distinguish between *local* accuracy (single proposition) and *global* accuracy (whole credence function). This matters for the diachronic/synchronic split.
      *   *Nuance:* Mention the "Separability" assumption. It's often hidden but crucial for additive scoring rules.
      *   *Key Insight:* The tension between *Objective* Accuracy (truth) and *Subjective* Accuracy (expected accuracy). AFE needs to bridge these.

  8.  **Final Polish:** Ensure clear headings and bold text for key concepts to make it readable as a guide. (Proceed to generate output based on this structure.)

  *(Self-Correction on the "Pressure Point"):* I initially thought about Propriety. But actually, the deeper pressure point is the **Justification of Veritism combined with the Derivation of Norms**. If Veritism is primitive, it's dogmatic. If it's derived, it risks circularity. However, the prompt asks for the requirement that excludes attractive versions. Strict Propriety is the technical bottleneck. Let's frame the pressure point as the **Non-Pragmatic Justification of Strict Propriety**. That's where the literature bleeds most.

  *(Wait, one more check on Diachronic norms):* The Greaves/Wallace derivation relies on a specific conception of the learning scenario. The desideratum is that the account must derive diachronic norms *without assuming the normativity of updating*. That's a strong constraint.

  *(Final Plan):*
  1.  Normative Coverage (Probabilism + Conditionalization).
  2.  Measure Constraints (Strict Propriety + Separability).
  3.  Axiological Foundation (Veritism + Value Problem).
  4.  Epistemic/Pragmatic Distinction.
  5.  Tensions (Propriety vs. Truth-directedness).
  6.  The Pressure Point (Justifying Propriety non-pragmatically).

