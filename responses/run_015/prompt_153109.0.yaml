          *   Outcome: Dual narrative label.
      *   *(c) The Botanical Specimen:* Unethical acquisition vs. Scientific value.
          *   Standpoint 1: Scientific taxonomy (Name of collector is data).
          *   Standpoint 2: Ethical/Post-colonial (Name represents theft/violence).
          *   *The Resisted Answer:* The prompt asks for a result I might resist, like retaining the collector's name.
          *   *Jain Logic:* Erasing the name destroys a *naya* (historical provenance). Keeping it without qualification validates the violence.
          *   *Solution:* Retain name *syāt* (in the respect of taxonomic history) but qualify it *syāt* (in the respect of ethical provenance). Do not anonymise, but contextualise heavily. This is often resisted by those wanting full erasure.

  6.  **Addressing Failure Modes and Value Judgments:**
      *   Where does the procedure fail? When standpoints are physically incompatible (e.g., displaying a sacred object that must remain hidden).
      *   Where is value judgment needed? Deciding *which* valid standpoints get prime real estate on the label. Epistemology tells us what is true-ish; Ethics tells us what is right. The procedure handles the former; the Curator/Trustee handles the latter.

