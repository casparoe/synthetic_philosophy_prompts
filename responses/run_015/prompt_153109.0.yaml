answer: |-
  **The Anekānta Interpretation Workflow (AIW)**

  **Introduction**
  This procedure translates the Jain doctrine of *anekāntavāda* (many-sidedness) into a practical decision matrix for museum interpretation. It moves beyond generic pluralism by enforcing a rigorous distinction between *nayavāda* (identifying valid partial standpoints) and *syādvāda* (formulating qualified assertions). It is designed to be executed by a curator or interpretation officer in under sixty minutes.

  The goal is not to find a single compromise, but to ensure that every statement made about an object acknowledges its own limitation. Where the procedure cannot resolve a conflict, it explicitly halts and flags the issue for senior ethical judgment.

  **Core Definitions for Practitioners**
  *   **Standpoint (*Naya*):** A specific perspective (e.g., scientific, spiritual, colonial, indigenous) that reveals a portion of the truth but not the whole.
  *   **Qualified Assertion (*Syāt*):** A statement that includes its own conditions (e.g., "In the context of taxonomy..." rather than "This is...").
  *   **Epistemic Humility Threshold:** A filter to distinguish between a *valid naya* (partial truth) and a *fallacious standpoint* (strategic distortion or empirical falsehood).

  ---

  ### Part 1: The Decision Procedure

  **Step 1: Standpoint Mapping (*Naya* Identification)**
  List every distinct claim or narrative proposed for the object (by donors, source communities, researchers, or the public).
  *   *Action:* Write down each claim as a distinct sentence.
  *   *Sufficient Answer:* At least two distinct standpoints are identified. If only one standpoint exists (e.g., "This is merely art"), proceed to Step 2 but flag the risk of *ekāntavāda* (one-sidedness) error.
  *   *Halting Condition:* If a standpoint demands the physical destruction of the object or the total silencing of another standpoint, halt. Proceed to **Part 3 (Failure Modes)**.

  **Step 2: The Epistemic Humility Threshold**
  Evaluate each standpoint from Step 1 against the following three criteria. A standpoint must pass all three to be treated as a truth-bearing *naya*.
  1.  **Internal Coherence:** Does the claim contradict itself?
  2.  **Acknowledged Limitation:** Does the proponent acknowledge that their view is specific to a context (e.g., "For our ritual..." vs. "For everyone, always...")?
  3.  **Evidential Grounding:** Is the claim supported by evidence acceptable within its own framework (e.g., oral history for community claims; peer review for scientific claims)?

  *   *Pass:* The standpoint is included in the display.
  *   *Fail:* The standpoint is noted in internal files as "strategic" or "affective" but is not given equal weight in the primary label text. It may be referenced as a "contested view" without validation.
  *   *Halting Condition:* If *all* standpoints fail the threshold, do not issue a label. Initiate a research review.

  **Step 3: Compatibility Check**
  Can the passing standpoints coexist on a single label or in a single display case without physically contradicting one another?
  *   *Yes:* Proceed to Step 4.
  *   *No:* (e.g., One group demands the object be hidden; another demands it be lit). Halt. Proceed to **Part 3 (Value Judgement)**.

  **Step 4: Formulation of Qualified Assertions (*Syāt* Drafting)**
  Draft the label text. Every declarative sentence must be prefixed or suffixed by its standpoint condition.
  *   *Prohibited:* "This mask represents the ancestor."
  *   *Required:* "In the tradition of the [Community], this mask represents the ancestor." OR "From a material science perspective, this mask is constructed of..."
  *   *Sufficient Answer:* No sentence presents a partial truth as a universal truth.

  **Step 5: Hierarchy of Harm**
  If space limits the number of standpoints that can be displayed, prioritise them based on the potential for *hiṃsā* (harm/violence).
  *   *Rule:* Standpoints that, if ignored, cause spiritual or cultural harm to living communities take precedence over standpoints that cause only intellectual inconvenience to researchers.
  *   *Action:* Rank the standpoints. Top rank gets primary text; lower ranks get secondary text or QR codes.

  **Step 6: The Provisional Seal**
  Add a standardised disclaimer to the label or gallery introduction.
  *   *Text:* "This display presents multiple perspectives. No single description captures the complete history of this object."
  *   *Action:* Confirm this text is visible.

  **Step 7: Final Review**
  Read the label aloud. Does it sound like a single authoritative voice, or a chorus of qualified voices?
  *   *If Authoritative:* Return to Step 4.
  *   *If Choral:* Approve for production.

  ---

  ### Part 2: Failure Modes and Value Judgements

  **Where the Procedure Halts**
  The AIW is an epistemic tool, not an ethical solvent. It cannot resolve conflicts where valid standpoints are physically or legally mutually exclusive.
  1.  **Physical Incompatibility:** If Community A requires an object to be buried (destroyed as a museum item) and Community B requires it to be displayed. The AIW identifies both as valid *nayas* in Step 2, but Step 3 halts.
  2.  **Legal Mandate:** If copyright or heritage law forbids stating a specific provenance.
  3.  **Safety:** If displaying a standpoint incites immediate violence.

  **The Unavoidable Value Judgement**
  At Step 5 (Hierarchy of Harm), the curator must weigh incommensurable values. Epistemology tells us *what* is true in a respect; it does not tell us *which* truth matters more when space is limited.
  *   *Trustee Role:* Trustees must ratify the ranking in Step 5. They cannot override the Epistemic Humility Threshold (Step 2), but they can decide which valid *naya* receives prominence.
  *   *Editor Role:* Editors must ensure the *syāt* qualifiers (Step 4) are not edited out for brevity. If a qualifier must be cut, the sentence must be cut.

  ---

  ### Part 3: Application to Proposals

  #### Case A: The Ceremonial Mask (Repatriation vs. Material Science)
  **Context:** A wooden mask used in initiation rites. Source community requests repatriation. Museum science team wishes to perform carbon dating and wood analysis.

  1.  **Standpoint Mapping:**
      *   *Community:* The mask is a living ancestor; removal is violence.
      *   *Science:* The mask is a data source; analysis preserves knowledge.
  2.  **Epistemic Humility Threshold:**
      *   *Community:* Passes. Coherent, grounded in oral history, acknowledges context (ritual).
      *   *Science:* Passes. Coherent, grounded in empirical method, acknowledges context (taxonomy).
  3.  **Compatibility:**
      *   Physical analysis may damage the mask. This creates a physical incompatibility.
      *   *Halting Condition:* Step 3 Halts.
  4.  **Value Judgement (Step 5):**
      *   Harm assessment: Spiritual harm to the community (desecration) vs. Intellectual loss to science (missing data).
      *   *Decision:* Under the Hierarchy of Harm, spiritual/cultural harm to a living lineage outweighs data acquisition.
  5.  **Outcome:**
      *   The procedure dictates that repatriation is the priority.
      *   *Labeling (if temporarily retained):* "Held in trust pending repatriation. For the [Community], this is a living entity. For researchers, it is a specimen of [Wood Type]. Analysis is restricted by community agreement."
      *   *Note:* The science standpoint is valid but subordinated due to harm mitigation.

  #### Case B: The Colonial Weapon (Suppression vs. Resistance)
  **Context:** A rifle used by colonial forces, later captured and used by independence fighters.

  1.  **Standpoint Mapping:**
      *   *Colonial Archive:* A tool of order and pacification.
      *   *Resistance Narrative:* A trophy of liberation and a tool of defence.
  2.  **Epistemic Humility Threshold:**
      *   Both pass. Both are historically evidential. Both are context-specific.
  3.  **Compatibility:**
      *   Compatible. The object physically embodies both histories sequentially.
  4.  **Qualified Assertions (Step 4):**
      *   *Draft:* "Issued to Colonial Force in 1890 for border control. Captured 1905. Used by Resistance Leader X during the Uprising."
      *   *Correction:* Avoid "for border control" (implies legitimacy). Use "In colonial records, designated for..."
      *   *Revised:* "In colonial military logs, recorded as a standard-issue weapon for border control. In oral histories of the [Region], remembered as a symbol of seizure and subsequent liberation."
  5.  **Outcome:**
      *   Dual-narrative label approved. No single authoritative function is assigned. The object is presented as a site of transition.

  #### Case C: The Botanical Specimen (Unethical Acquisition)
  **Context:** A type specimen collected in 1890 by a known exploiter who displaced local populations to access the site. The specimen is botanically unique. Activists demand the collector's name be removed from the label.

  1.  **Standpoint Mapping:**
      *   *Taxonomic:* The collector's name is essential data for scientific tracking and priority.
      *   *Ethical/Post-Colonial:* The name honours a perpetrator; it should be erased to prevent further harm.
  2.  **Epistemic Humility Threshold:**
      *   *Taxonomic:* Passes. It is empirically true that this person collected it.
      *   *Ethical:* Passes. It is morally coherent that naming causes ongoing pain.
      *   *Crucial Distinction:* The demand to *erase* the name fails the threshold if it claims the person *did not* collect it. If the claim is "Do not *credit* them," that is a value judgement, not an epistemic one.
  3.  **Compatibility:**
      *   Can we keep the name without endorsing the person? Yes.
  4.  **Qualified Assertions (Step 4):**
      *   *Draft:* "Collected by [Name]." (Too authoritative/positive).
      *   *Draft:* "Stolen by [Name]." (Too emotive/one-sided).
      *   *Required Syāt Formulation:* "Specimen acquired during the [Expedition Name] led by [Collector]. Historical records indicate this acquisition involved the displacement of [Local Group]."
  5.  **The Resisted Answer:**
      *   *Procedure Output:* The collector's name **must remain** on the label.
      *   *Reasoning:* To anonymise the collector is to falsify the provenance *naya*. It creates a new falsehood (that the history is unknown) to solve an ethical problem. *Anekāntavāda* requires we hold the truth of the collection event *and* the truth of the harm simultaneously.
      *   *Mitigation:* The name is retained not as an honour, but as a coordinate of historical fact, immediately qualified by the method of acquisition.
      *   *Why this is resisted:* Many practitioners prefer erasure as a form of restorative justice. The AIW argues that erasure is epistemically violent (*hiṃsā* against truth) and undermines future research. The harm is mitigated by context, not deletion.
  6.  **Outcome:**
      *   Label retains name.
      *   Text reads: "Catalogued by [Collector] in 1890. In the respect of botanical taxonomy, this name identifies the type location. In the respect of social history, this acquisition is associated with the dispossession of [Community]."

  ---

  ### Part 4: Operational Notes for the Senior Officer

  **Defending the Procedure**
  When trustees or community representatives challenge the output:
  1.  **If challenged on complexity:** Explain that generic pluralism ("some say X, some say Y") implies we do not know the truth. *Anekāntavāda* asserts that X *and* Y are both true in specific respects. This builds trust through precision, not vagueness.
  2.  **If challenged on the Botanical Case (Case C):** Clarify that the procedure distinguishes between *recording* a fact and *endorsing* a value. We record the collector's name as we would record a date of birth for a criminal; it is data, not a medal.
  3.  **If challenged on Time Pressure:** The Epistemic Humility Threshold (Step 2) is the quick filter. If a claim cannot articulate its own limitation, it does not need to be on the main label.

  **Failure Mode Warning**
  Do not apply this procedure to objects where safety is compromised. If displaying a "resistance narrative" puts staff at risk, the Safety Halting Condition overrides the Epistemic Humility Threshold. This is not a failure of the philosophy, but a recognition that *ahiṃsā* (non-violence) to living persons precedes *ahiṃsā* to truth in moments of immediate crisis.

  **Final Instruction to Team**
  If you cannot complete Step 4 without writing a sentence that sounds like an absolute fact, stop. Do not publish the label. It is better to have an empty plinth with a note explaining the complexity than a full label that commits epistemic violence.
