answer: |-
  The real fight isn't about whether we maximize, but whether the cost of calculating the max is part of the utility function or an external constraint we just live with. Threshold satisficing treats the search like a hurdle race, while gradient satisficing admits we're always climbing but stops when the slope gets too steep relative to the effort. Then you've got the reflective satisficer who knows they're anxious and deliberately dumbs down the target to keep moving, which looks like irrationality from the outside but is actually meta-rational stability. The fault line is whether stopping early is a bug in our hardware or a feature of the environment we're exploiting.

  Here's the taxomony tree. I've built it so you can trace the disagreement without needing the jargon first.

  ```text
  ROOT: If saving 90% search cost costs you the best option by 1%, is that rational failure or ecological success?
  │
  ├── BRANCH A: It's a Rational Failure (we fell short of what we could/should do)
  │   │
  │   └── NODE: Should we fix this by training better heuristics or by demanding full optimization?
  │       │
  │       ├── LEAF 1: Remedial Heurist
  │       │   └── Awkward commitment: Must admit humans are permanently broken hardware that needs patching.
  │       │
  │       └── LEAF 2: Ideal Normativist
  │           └── Awkward commitment: Must claim a perfect calculator is the only rational agent, making everyone else irrational.
  │
  └── BRANCH B: It's Ecological Success (the stop was the right move)
      │
      └── NODE: Is the success due to matching the environment's structure or managing internal cognitive costs?
          │
          ├── BRANCH B1: Matching Environment (External Structure)
          │   │
          │   └── NODE: Does the agent stop at a fixed survival bar or when marginal returns fade?
          │       │
          │       ├── NODE: Is the bar set by biology or culture?
          │       │   │
          │       │   ├── LEAF 3: Biological Thresholder
          │       │   │   └── Awkward commitment: Must claim cultural shifts in standards are irrational deviations.
          │       │   │
          │       │   └── LEAF 4: Cultural Thresholder
          │       │       └── Awkward commitment: Must admit rationality is relative to peer groups, not outcomes.
          │       │
          │       └── LEAF 5: Gradient Ecologist
          │           └── Awkward commitment: Has to say an agent who finds the global max by luck was less rational than one who used the right rule.
          │
          └── BRANCH B2: Managing Internal Costs (Internal Architecture)
              │
              └── NODE: Is the cost management about pricing effort or preventing paralysis?
                  │
                  ├── NODE: Is the price calculated in currency-like units or attention units?
                  │   │
                  │   ├── LEAF 6: Economic Cognitivist
                  │   │   └── Awkward commitment: Must treat mental fatigue as identical to financial loss.
                  │   │
                  │   └── LEAF 7: Attention Budgeter
                  │       └── Awkward commitment: Has to argue that running out of mental energy mid-search is a planned expenditure.
                  │
                  └── LEAF 8: Reflective Satisficer
                      └── Awkward commitment: Has to admit rationality sometimes requires deliberately aiming lower than what is achievable.
  ```

  **Empty Spaces & Incoherencies**
  There's a glaring hole where **Gradient Satisficing** meets **Strict Global-Optimization Normativity**. That cell is basically incoherent—you can't claim the norm is "always find the absolute best" while simultaneously endorsing a stopping rule that says "stop when the gain isn't worth the effort." It's not just unexplored; it's a contradiction in terms unless you redefine "best" to include effort, which collapses it into Leaf 6 or 7.

  **Indistinguishable Leaves**
  Good luck separating **Leaf 5 (Gradient Ecologist)** from **Leaf 7 (Attention Budgeter)** in the wild. Both look like an agent stopping when the search gets tough. One says "the world stopped giving rewards," the other says "my brain stopped paying for tickets." Empirically, they produce the same behavior, so unless you can peek into the head to see if they're tracking external odds or internal fatigue, this tree can't actually split them.

  Also, **Leaf 2 (Ideal Normativist)** and **Leaf 1 (Remedial Heurist)** are technically distinct, but in practice, both treat the bounded agent as defective. The only difference is whether you think the defect is fixable (Heurist) or just a permanent sin (Normativist).
