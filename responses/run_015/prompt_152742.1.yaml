      *   **Constraints:** No bibliographic citations (offline reader), concise scoring, weight on criteria/motivating cases.

  2.  **Brainstorming Core Tensions:**
      *   *Stability vs. Growth:* If we extrapolate too much, is it still *my* volition? If too little, is it coherent?
      *   *Information vs. Identity:* How much new information can I process before I become a different person?
      *   *Pluralism vs. Unification:* Human values are often contradictory or context-dependent. Does a "coherent" volition require forcing them into a single utility function?
      *   *Actual vs. Ideal:* Do we respect what I *would* want if I knew X, or what I *should* want if I were rational?
      *   *The "Who" Question:* If my extrapolated self rejects my current self's values, whose values count?

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Category 1: Cases it must get right.*
          *   *Info-Divergence:* Agent wants X in W (ignorant), wants Y in W' (informed). Theory must pick Y without calling it "value drift."
          *   *False Belief Correction:* Preferences based on "the pill makes you happy" (false) vs "the pill is sugar" (true). Must correct the belief, not satisfy the false-belief preference.
          *   *Incommensurability:* Not just trading off A vs B, but when A and B belong to different conceptual categories (e.g., sacred vs. profane). Aggregation shouldn't just be weighted sum.

      *   *Category 2: Distinctions to preserve.*
          *   *Revealed vs. Endorsed vs. Volition:* I do X (revealed), I wish I didn't (endorsed), My ideal self decides Y (volition). Don't collapse these.
          *   *Learning vs. Manipulation:* Changing mind due to evidence vs. changing mind due to hypnosis/framing.
          *   *Null vs. Indifference:* "I don't care" vs "I have no preference formed."

      *   *Category 3: Puzzles to dissolve.*
          *   *Preference Reversal:* Ideal self looks at output and says "No." (The "Sorcerer's Apprentice" problem).
          *   *Forced Unification:* Trying to make a single utility function out of fragmented values.
          *   *No-Volition Boundary:* When to say "undefined" instead of "averaged."

      *   *Category 4: Consistency Conditions.*
          *   *Transitivity:* Within a world? Across worlds? (Crucial tension).
          *   *Completeness:* Must the extrapolated profile rank *everything*?
          *   *Independence of Irrelevant Alternatives:* Does adding option C change ranking of A vs B?

      *   *Category 5: Negotiability.*
          *   *Non-negotiable:* Correction of false beliefs, distinction between manipulation/learning, boundary condition (no fabrication).
          *   *Negotiable:* Uniqueness of solution, strict transitivity across modal clusters, determinism.

      *   *Flagging Joint Unsatisfiability:*
          *   *Completeness vs. Integrity:* Forcing a complete order on incommensurable values might violate the integrity of the values.
          *   *Stability vs. Growth:* If the extrapolated self changes too much, it violates "Volition" (it's not *yours*). If too little, it violates "Coherent" (it's still broken).

  4.  **Developing the Scoring Section:**
