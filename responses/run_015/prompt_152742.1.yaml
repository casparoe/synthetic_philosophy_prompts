prompt: |-
  You are an expert in decision theory and value-alignment philosophy, with deep familiarity with rationalist frameworks for preference aggregation and the formal problems that arise when an agent's values are extrapolated across epistemic conditions. Before I assess any specific formalization, I want the full specification built from first principles, so think carefully and begin with a brief brainstorming of the core tensions.

  Write the desiderata for an adequate theory of coherent extrapolated volition—specifically one that must extrapolate an agent's preferences across counterfactual epistemic states and resolve conflicts between what I will call modal preference clusters (divergent preference structures an agent holds in different possible worlds or under different information sets, not due to value drift but due to structural differences in belief and framing). For each requirement, provide the motivating case or conceptual consideration behind it, and flag any pair you suspect is jointly unsatisfiable.

  Your list should cover:

  - The cases it must get right: how it treats an agent whose revealed preferences in world W conflict with endorsed preferences in world W' when the divergence stems from information rather than taste change; what it does with preferences that depend on false beliefs the agent would correct upon reflection; and how it handles aggregation when value dimensions are incommensurable rather than merely weighted differently.

  - The distinctions it must preserve and not collapse: between revealed preference, counterfactual endorsement, and all-things-considered volition; between preference change due to learning and change due to manipulation or framing effects; and between the absence of a preference and a preference for indifference.

  - The puzzles it must dissolve or explain: preference reversal under reflection (where the agent, upon seeing her own extrapolated profile, rejects it); the problem of forcing a single utility representation over genuinely plural values; and the boundary question of when the theory should return "no coherent volition exists" rather than manufacturing aggregation.

  - The consistency conditions: which standard rational-choice axioms must be satisfied in the extrapolated profile, which may need reinterpretation (e.g., completeness over modal clusters), and whether transitivity must hold across worlds or only within them.

  - The negotiability of each: mark which are non-negotiable for any theory worthy of the name, and which are camp-specific preferences (e.g., uniqueness of the extrapolated point, determinism of the aggregation procedure, or preservation of every first-order intuition).

  Then, briefly and without bibliographic citation—this must work for an offline reader—score how the standard CEV framing, a reflective-equilibrium model of idealization, and a direct preference-utilitarian aggregation approach fare against your list. Identify the single requirement that does the most work in excluding candidates, and note whether your flagged joint-unsatisfiability pairs actually knock out any of the three.

  Keep the weight on the criteria and their motivating cases; the scoring should be concise. Do not provide a reading list or ask me to look up specific texts.
