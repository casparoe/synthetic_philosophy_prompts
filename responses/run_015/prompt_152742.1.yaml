answer: |-
  ### Core Tensions: A Brief Brainstorm

  Before specifying desiderata, we must acknowledge the structural friction inherent in extrapolating volition. The central tension is **Identity vs. Idealization**. If we extrapolate an agent's preferences too far into counterfactual epistemic states (more information, more reflection time), the resulting preference structure may no longer be recognizable as belonging to the original agent. Conversely, if we extrapolate too little, we retain the cognitive biases and factual errors that necessitated extrapolation in the first place.

  A second tension is **Unification vs. Pluralism**. "Coherence" implies a consistent ordering, but human value structures are often fragmented, context-dependent, or genuinely incommensurable. Forcing a single utility function may satisfy mathematical consistency conditions while violating the semantic content of the values.

  A third tension is **Static vs. Dynamic Endorsement**. Does the extrapolated volition need to be stable under further reflection? If the "idealized self" looks at its own decision procedure and rejects it, the theory fails. But requiring infinite stability risks infinite regress or fixed-point paralysis.

  ---

  ### Desiderata for Coherent Extrapolated Volition (CEV)

  #### I. Cases the Theory Must Get Right

  **1. The Information-Divergence Case**
  *   **Requirement:** When an agent prefers $A$ in world $W$ (low information) and $B$ in world $W'$ (high information), and the divergence is solely due to factual belief updates, the theory must select $B$ without classifying this as "value drift."
  *   **Motivation:** Volition should track what the agent *would* want if they knew what they were talking about. Satisfying the ignorant preference is paternalism of the worst kind (satisfying errors).
  *   **Unsatisfiability Flag:** **Jointly Unsatisfiable with Strict Identity Preservation.** If the information gain is massive, the agent in $W'$ may be psychologically discontinuous from $W$. Prioritizing the $W'$ preference violates the intuition that the output must still be *my* volition.

  **2. The False-Belief Correction Case**
  *   **Requirement:** Preferences contingent on false empirical claims (e.g., "I want to drink this glass because it contains water," when it contains poison) must be dissolved, not satisfied.
  *   **Motivation:** Instrumental preferences based on falsehoods do not reflect terminal values. Satisfying them harms the agent's actual interests as defined by their own terminal goals.
  *   **Negotiability:** Non-negotiable. A theory that satisfies false-belief preferences is not a theory of volition; it is a theory of literal command following.

  **3. The Incommensurability Case**
  *   **Requirement:** When value dimensions are qualitatively distinct (e.g., aesthetic beauty vs. moral duty) and not merely weighted differently, the aggregation procedure must not force a scalar trade-off unless the agent's extrapolated self explicitly endorses such a trade-off.
  *   **Motivation:** Human values often operate via lexical ordering or context-sensitive switching rather than continuous utility functions. Forcing a exchange rate manufactures preferences that do not exist.
  *   **Unsatisfiability Flag:** **Jointly Unsatisfiable with Completeness.** A complete ordering requires ranking every pair of options. If values are genuinely incommensurable, a complete ranking implies a false precision.

  #### II. Distinctions the Theory Must Preserve

  **4. Revealed vs. Endorsed vs. Volitional**
  *   **Requirement:** The theory must distinguish between: (a) what the agent does (Revealed), (b) what the agent wishes they wanted upon reflection (Endorsed), and (c) what the agent would decide under idealized epistemic conditions (Volitional).
  *   **Motivation:** Agents suffer from akrasia. Revealed preference is often noise. Endorsed preference is meta-preference. Volition is the counterfactual limit. Collapsing these leads to satisfying addictions (Revealed) or mere guilt (Endorsed) rather than actual goals.
  *   **Negotiability:** Non-negotiable.

  **5. Learning vs. Manipulation**
  *   **Requirement:** The extrapolation process must distinguish between preference changes caused by evidence accumulation (Learning) and those caused by framing, coercion, or cognitive hacking (Manipulation).
  *   **Motivation:** Both processes change the mind, but only Learning tracks truth. A theory that treats brainwashing as "preference update" legitimizes value corruption.
  *   **Negotiability:** Non-negotiable, though operationally difficult to define.

  **6. Absence vs. Indifference**
  *   **Requirement:** The theory must distinguish between "I have considered A and B and value them equally" (Indifference) and "I have no preference structure regarding A and B" (Absence).
  *   **Motivation:** Aggregating over "Absence" as "Indifference" creates noise in the utility function. It implies the agent cares about the distinction when they do not.
  *   **Negotiability:** Camp-specific. Some formalisms treat null preferences as uniform distributions; this desideratum rejects that.

  #### III. Puzzles the Theory Must Dissolve

  **7. The Preference Reversal Puzzle**
  *   **Requirement:** The extrapolated volition must be stable under inspection. If the extrapolated agent examines the output of the extrapolation procedure and rejects it, the theory fails.
  *   **Motivation:** This is the "Sorcerer's Apprentice" problem. If the idealized self says "This isn't what I meant," the procedure did not capture the volition, it captured a simulation error.
  *   **Unsatisfiability Flag:** **Jointly Unsatisfiable with Determinism.** If the agent's reflection is sensitive to chaotic initial conditions or framing of the extrapolation itself, a unique stable point may not exist.

  **8. The Pluralism Puzzle**
  *   **Requirement:** The theory must explain how to act when the extrapolated profile contains genuinely contradictory terminal values that cannot be unified into a single function.
  *   **Motivation:** Assuming convergence is an empirical hope, not a logical necessity. The theory must handle "fragmented minds" without hallucinating unity.
  *   **Negotiability:** Camp-specific. Monists require unification; Pluralists accept fragmentation.

  **9. The No-Volition Boundary**
  *   **Requirement:** The theory must specify conditions under which it returns "No Coherent Volition Exists" rather than manufacturing an aggregation.
  *   **Motivation:** For some agents (e.g., severely broken, contradictory, or empty value structures), extrapolation may yield null. Manufacturing a result is more dangerous than admitting failure.
  *   **Negotiability:** Non-negotiable for safety, though often ignored for convenience.

  #### IV. Consistency Conditions

  **10. Transitivity Scope**
  *   **Requirement:** Transitivity ($A \succ B, B \succ C \implies A \succ C$) must hold *within* a modal preference cluster (a specific epistemic/world state). It need not hold *across* clusters if the framing of the choice fundamentally shifts the value context.
  *   **Motivation:** Within a context, intransitivity implies money-pump vulnerability. Across contexts (e.g., "career mode" vs. "family mode"), intransitivity may reflect legitimate value pluralism.
  *   **Negotiability:** Camp-specific. Standard decision theory demands global transitivity; this desideratum allows local transitivity.

  **11. Completeness over Modal Clusters**
  *   **Requirement:** The extrapolated profile need not be complete over all logically possible worlds, only over the reachable epistemic neighborhood of the agent.
  *   **Motivation:** Requiring an opinion on logically possible but cognitively inaccessible worlds forces arbitrary assignments.
  *   **Negotiability:** Camp-specific.

  #### V. Negotiability Summary

  *   **Non-Negotiable:** False-Belief Correction, Revealed/Endorsed/Volitional Distinction, Learning/Manipulation Distinction, No-Volition Boundary.
  *   **Negotiable/Camp-Specific:** Uniqueness of Extrapolated Point, Global Transitivity, Completeness, Determinism of Aggregation, Preservation of First-Order Intuitions (sometimes the ideal self *should* violate current intuitions).

  ---

  ### Comparative Scoring

  Here we evaluate three candidate frameworks against the desiderata above.

  **1. Standard CEV Framing (Yudkowsky-style)**
  *   **Performance:** High on Information-Divergence and False-Belief Correction. It explicitly aims for the "what we would want if we knew more" condition.
  *   **Failures:** Struggles with the **No-Volition Boundary** (tends to assume convergence exists). Often assumes **Unification** (Puzzle 8), forcing a single utility function where pluralism may exist. Vulnerable to **Preference Reversal** if the extrapolation procedure itself isn't part of the extrapolated values.
  *   **Score:** 7/10. Strong on intent, weak on formal boundary conditions.

  **2. Reflective Equilibrium Model (Rawls/Daniels-style)**
  *   **Performance:** Excellent on **Distinctions (4 & 5)** and **Preference Reversal (7)**. It iterates between principles and intuitions until stability is reached. Handles **Incommensurability (3)** better by allowing qualitative adjustments.
  *   **Failures:** Weak on **Counterfactual Epistemic States (1)**. It is largely static, focusing on coherence of *current* beliefs and principles rather than extrapolation into high-information worlds. Lacks a clear **No-Volition Boundary**; it assumes equilibrium is always reachable.
  *   **Score:** 6/10. Strong on coherence, weak on extrapolation dynamics.

  **3. Direct Preference Utilitarianism**
  *   **Performance:** High on **Revealed Preference** and **Completeness**. Mathematically tractable.
  *   **Failures:** Catastrophic failure on **False-Belief Correction (2)** and **Learning vs. Manipulation (5)**. It satisfies revealed preferences regardless of epistemic validity. Collapses **Revealed vs. Volitional (4)**. Cannot handle **Incommensurability (3)** without forcing scalar weights.
  *   **Score:** 3/10. Fails the core philosophical constraints of *volition*.

  ### The Killer Constraint and Unsatisfiability Check

  **The Single Requirement Doing the Most Work:**
  **The False-Belief Correction Case (Desideratum 2).**
  This is the primary filter. It immediately excludes Direct Preference Utilitarianism and any framework that treats "satisfaction of current desire" as the terminal goal. It forces the theory to be counterfactual and epistemic, not just behavioral.

  **Do the Flagged Unsatisfiabilities Knock Out Candidates?**
  *   **Completeness vs. Integrity (Desideratum 3 & 11):** This knocks out **Standard CEV** in its strongest form. Standard CEV often assumes a convergent utility function is always findable. If values are genuinely incommensurable, CEV's demand for a single "Coherent" output forces a violation of value integrity.
  *   **Stability vs. Growth (Desideratum 1 & 7):** This pressures **Reflective Equilibrium**. If the equilibrium is stable but rests on limited information, it fails the Growth requirement. If it grows too much, it fails Stability. Reflective Equilibrium tends to settle for local stability, potentially missing the "Idealized" component required by CEV.

  **Conclusion:**
  No existing framework satisfies all non-negotiable desiderata simultaneously. Standard CEV comes closest on epistemic extrapolation but risks fabricating coherence where none exists. Reflective Equilibrium preserves integrity but lacks the counterfactual reach. A viable theory must likely abandon the demand for a *unique, complete, scalar utility function* (Negotiable items) to satisfy the Non-Negotiable constraints on belief correction and value integrity.
