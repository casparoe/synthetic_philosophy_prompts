answer: |-
  ### Reconstruction of the Implicit Theory

  The welfare standards you describe rest on a framework best characterized as **Managerial Negative Utilitarianism**. This theory posits that the moral obligation of the farmer is to minimize the aggregate intensity and prevalence of negative subjective states (pain, distress, hunger, disease) within a production unit, without assigning intrinsic value to the continuation of life or the realization of species-specific potential (flourishing).

  **1. Temporal Structure:** The standards treat welfare as a **state property** rather than a **narrative property**. Welfare is assessed at time-slices (e.g., water quality today, lesion rates this month). The absence of a duration cap implies that a life of 1,000 days in acceptable condition is not morally worse than 100 days in identical condition. This presupposes that welfare does not accumulate "debt" over time, nor does it accrue "credit." The asymmetry you note—penalizing mortality but not duration—suggests that time is morally neutral unless it correlates with degraded states. A whole-life view would require weighting duration, but the current practice assumes welfare is non-aggregative across time; only the *rate* of suffering matters, not the *sum*.

  **2. Death:** The treatment of mortality versus culling reveals a **Deprivation-Neutral** view of death. High cumulative mortality is penalized not because the dead fish are harmed by losing their futures, but because death is treated as a **proxy indicator** of antecedent suffering (disease, poor management, predation). Conversely, culling is rewarded (or cost-neutral) because it terminates negative states. This strictly presupposes that death is not an intrinsic harm to the animal. If death were a harm (a deprivation of future goods), culling would incur a moral cost that offsets the relief of suffering. The standard operates on the principle that *suffering is the harm, not the cessation of existence*.

  **3. Finfish–Crustacean Asymmetry:** This split relies on a **Neuro-Phylogenetic Threshold** for moral standing. Finfish (vertebrates) are treated as unequivocal welfare subjects. Crustaceans (invertebrates) are treated as "potential" subjects or subjects with lower moral weight. This is partly epistemic (uncertainty about crustacean phenomenal consciousness) and partly regulatory (historical exclusion from protection acts). It is not strictly presupposed that crustaceans *cannot* suffer; rather, the practice reflects a **Precautionary Asymmetry**: apply full protections where sentience is settled (fish), and minimal/feasible protections where it is contested (shrimp), weighted heavily by economic cost.

  **4. Unit of Assessment:** The use of rates (mortality %, lesion prevalence) makes the **Population** the primary unit of moral concern, not the individual. This is **Aggregative Consequentialism**. An individual fish suffering intensely can be "offset" by the welfare of the majority, provided the population metrics stay within thresholds. Individual rights (e.g., "this fish shall not suffer") are absent; instead, we see "the flock shall not exceed X% mortality."

  **5. Fasting:** The acceptance of pre-slaughter fasting indicates a **Hierarchy of Harms**. Short-term hunger is deemed a lesser negative state than the risks associated with feeding (gut content contamination, stress during handling, metabolic waste during transport). This fits a negative-welfare view where one negative state is traded to prevent a larger or more complex negative state. A positive-welfare view (flourishing) might view fasting as a frustration of natural drives that cannot be justified solely by hygiene, but the current standard prioritizes product integrity and stress reduction over satiation.

  ### Pressure-Test: The Lifetime Integral

  If we rewrite the standard to cap "negative-welfare-days" (integral of suffering over time), the consequences you predict do follow from the reconstructed theory, specifically its **Negative Utilitarian** core.
  *   **Consequence:** A short, cramped life with moderate suffering could indeed have a lower total integral than a long, spacious life with low-level chronic stress.
  *   **Load-Bearing Commitment:** The commitment doing the work is that **welfare value is solely determined by the absence of negative states**. There is no "positive value" assigned to living or experiencing natural behaviors.
  *   **Blocking the Consequence:** To prevent the "short/cramped" win, the standard would need to add a **Positive Welfare Requirement** (e.g., "animals must have opportunity for species-typical behavior for minimum duration X") or a **Right-to-Life Clause** (e.g., "minimum age at slaughter"). This shifts the theory from Negative Utilitarianism to a **Capabilities Approach** or **Rights-Based Framework**, where time itself allows for the realization of value, making longer lives potentially more valuable even if they carry some welfare cost.

  ### Epistemic and Philosophical Distinctions

  *   **Settled:** Fish nociception (physiological detection of harm) is scientifically settled. Fish behavioral responses consistent with pain are widely accepted.
  *   **Contested:** Fish *phenomenal consciousness* (the subjective *feeling* of pain) is philosophically contested, though increasingly accepted in welfare science. Crustacean pain is empirically and philosophically contested (though shifting toward acceptance).
  *   **Underdetermined:** The practice is underdetermined regarding the harm of death. Both "death is neutral" and "death is a harm but outweighed by management reality" could produce the same mortality thresholds. However, the culling rule strongly suggests the former.
  *   **Contested:** Whether welfare aggregates additively across a life is a philosophical debate (Time-Slice vs. Whole-Life). The practice adopts Time-Slice for convenience, not necessarily because Whole-Life is disproven.

