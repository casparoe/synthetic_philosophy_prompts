answer: |-
  ### Assessment of Your Inventory

  Your inventory is technically sound but leans too heavily on single-agent epistemology. For institutional risk committees, three corrections are necessary:

  1.  **On Interpretation (iv):** You suspect the set might represent a "divided evidence base" or "committee." This is not a suspicion; for your target users, it is a requirement. Treating the set as a single agent's doxastic state is a category error. A pension fund is not a mind; it is a fiduciary structure. If the model treats disagreement as individual uncertainty, it invites legal challenge for misrepresenting the nature of the risk.
  2.  **On Dilation (ii):** You frame dilation as a technical problem to be solved. For a risk committee, dilation is often a *feature*, not a bug. It signals that the chosen partition of the problem is unstable. The research goal should not be to eliminate dilation mathematically, but to determine when dilation constitutes a valid "stop" signal for decision-making.
  3.  **On Decision Rules (i):** The rivalry between maximin and E-admissibility is secondary to the *legitimacy of the transition* from set to point. The theoretical gap is not choosing a rule, but justifying the *authority* to apply a rule that collapses indeterminacy.

  ### The Research Agenda

  Here are five ordered questions. They are designed to flow from ontology (what is the uncertainty?) to procedure (how do we defend the choice?).

  #### 1. The Taxonomy of Indeterminacy
  **Question:** Can we formally distinguish sets of probabilities generated by (a) sparse evidence, (b) expert disagreement, and (c) normative precaution, such that each type licenses different updating and decision rules?
  *   **Worthiness:** This is the foundation. If you apply an evidential updating rule to a normatively imposed interval (e.g., a regulatory safety margin), you commit a category error that undermines the "One-Page Constraint." A court will ask *why* the uncertainty exists; the math must match the reason.
  *   **Dependencies:** Upstream of everything. You cannot define a sharpening rule (Q4) without knowing if the width of the set is epistemic (shrinkable) or normative (fixed).
  *   **Tractability:** Theoretical. Requires formal semantics for imprecise probabilities, likely extending existing work on imprecise previsions to include "deontic" markers.
  *   **Staffing:** 1 Senior Logician/Philosopher.

  #### 2. Independence and Propagation in Imprecise Systems
  **Question:** Under which notions of independence (strong, weak, epistemic) does imprecision scale linearly versus exponentially in complex systems (e.g., pandemic models, portfolio stress tests)?
  *   **Worthiness:** Committees deal with systems, not single events. If the model assumes too much independence, the set collapses to false precision. If it assumes too little, the set becomes vacuous (0 to 1), rendering decision impossible. This determines the *usability* of the model.
  *   **Dependencies:** Upstream of Q3 and Q4. You cannot update or decide on a system-level risk if the propagation rules render the output uninformative.
  *   **Tractability:** Computational/Mathematical. Requires simulation work alongside proof theory to test how intervals widen under different independence assumptions in realistic network topologies.
  *   **Staffing:** 2 Modelers/Statisticians.

  #### 3. Dilation as an Audit Signal
  **Question:** Can we characterize conditions under which dilation indicates a structural flaw in the model versus a genuine increase in risk, and prescribe a protocol for when dilation should halt a decision process?
  *   **Worthiness:** Standard theory views dilation as a pathology. For your users, it is a risk indicator. If learning a variable makes the hypothesis *less* precise, the committee needs to know if they should gather more data or abort the decision. This turns a mathematical bug into a governance tool.
  *   **Dependencies:** Downstream of Q1 (type of uncertainty affects dilation interpretation). Upstream of Q4 (you cannot sharpen a set that is actively dilating).
  *   **Tractability:** Mixed. Theoretical work on updating rules, but requires empirical testing on historical cases (e.g., early pandemic modeling) to validate the "halt" criteria.
  *   **Staffing:** 1 Epistemologist, 1 Statistician.

  #### 4. The Legitimacy of Terminal Sharpening
  **Question:** What is the minimal normative condition required to legitimately collapse a convex set of probabilities into a single value for action, without violating the coherence of the original representation?
  *   **Worthiness:** This addresses your "Terminal Sharpening" constraint. Current theory offers rules (e.g., $\Gamma$-maximin), but none justify *why* a committee is allowed to ignore the upper bound. We need a "licensing principle" that satisfies a regulator.
  *   **Dependencies:** Downstream of Q1 and Q3. You must know what the set is and that it is stable before you collapse it. Upstream of Q5 (you cannot audit a collapse rule that doesn't exist).
  *   **Tractability:** Theoretical/Normative. This is decision theory meets legal theory. It requires constructing a rule that is mathematically coherent but also procedurally rational.
  *   **Staffing:** 2 Decision Theorists.

  #### 5. The Audit Syntax (The One-Page Constraint)
  **Question:** What is the formal mapping between the mathematical justification for Terminal Sharpening and a natural-language narrative that satisfies a lay auditor's requirement for causality and accountability?
  *   **Worthiness:** This addresses your "One-Page Constraint." A proof is not a justification. If the committee cannot translate the sharpening rule into a defensible narrative, the model fails its primary purpose (public defense).
  *   **Dependencies:** Downstream of Q4. The narrative must reflect the sharpening rule accurately.
  *   **Tractability:** Empirical/Interdisciplinary. Requires testing draft justifications with mock auditors (lawyers, regulators) to see where they perceive "hiding behind math."
  *   **Staffing:** 1 Philosopher of Science/Communication Specialist.

  ### Exclusions

  I would explicitly leave out two items from your inventory:

  1.  **Single-Agent Elicitation Protocols (Part of v):** Do not fund research on how to extract intervals from individual experts. Your constraint (Stipulation 1) identifies disagreement as a distinct source of indeterminacy. Elicitation research usually assumes a "true" value exists and tries to find it. For a committee, the *conflict* is the data. Researching how to resolve that conflict psychologically is downstream of Q1 (Taxonomy). If the indeterminacy is normative, elicitation is irrelevant.
  2.  **General Axiomatic Foundations of Imprecise Probability:** Do not fund work on the general coherence of lower previsions. The field has sufficient foundations for application. Your problem is not *coherence*; it is *accountability*. New axioms that do not map to the "One-Page Constraint" or "Terminal Sharpening" are academic luxuries this program cannot afford.

  ### Reordering Triggers

  The order above assumes a "theory-first" approach. Two developments would shift the agenda:

  1.  **Move Q5 (Audit) Upstream:** If a major regulatory body (e.g., SEC, FDA) issues guidance specifying the *format* of risk justification (e.g., requiring specific confidence language), Q5 becomes the constraint that drives Q4. The math must fit the form.
  2.  **Move Q3 (Dilation) Downstream:** If a proof emerges showing that non-dilating updating rules are impossible for the specific class of models used by your target committees (e.g., high-dimensional Bayesian networks), then dilation management ceases to be a choice and becomes a fixed constraint. The program would then skip to designing "Sharpening under Dilation" (Q4) immediately.

  ### Staffing Summary (8 Slots)
  *   **Q1 (Taxonomy):** 1 Senior Logician.
  *   **Q2 (Propagation):** 2 Modelers.
  *   **Q3 (Dilation):** 1 Epistemologist, 1 Statistician.
  *   **Q4 (Sharpening):** 2 Decision Theorists.
  *   **Q5 (Audit):** 1 Communication Specialist.
  *   **Program Lead:** (Implicitly one of the seniors, or a separate administrative slot not counted in the 8 research slots). *Note: If the 8 includes the lead, reduce Q2 to 1 Modeler.*

  This agenda respects your constraints by treating the mathematics as a tool for institutional defense, rather than an end in itself. It forces the distinction between "we don't know" (evidence) and "we won't bet" (norm), which is the precise leverage point a risk committee needs in court.
