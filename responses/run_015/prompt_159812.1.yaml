answer: |-
  # Uncertainty Account Classification Instrument

  ## Instructions for the Workshop Leader
  This instrument is a branching decision tree. Begin every author at **Node 1**. Follow the path indicated by their answer. Record the **Leaf Code** at the end of the path. Do not explain the theoretical implications of their choices to them during the exercise; simply record their responses.

  **Time Allocation:** 90 Minutes.
  **Materials:** Printed case descriptions (a–g), Response Sheet, Classification Key.
  **Constraint:** Do not use terms like "Bayesian," "prior," "coherence," or "probability distribution" unless the author introduces them first. Stick to the language of the cases (gauges, prices, ranges, teams).

  ---

  ## The Decision Tree

  **Node 1: Case (b) Buying and Selling**
  *Context:* For a one-off event (e.g., catchment exceeding design flood within 20 years), consider a ticket that pays one unit if the event occurs.
  *Question:* What is the most you would pay to buy this ticket, and the least you would accept to sell it?
  *   **Option A:** The same number both ways (e.g., Buy at 0.3, Sell at 0.3). → **Go to Node 2.**
  *   **Option B:** A gap, with the selling price strictly above the buying price (e.g., Buy at 0.3, Sell at 0.5). → **Go to Node 6.**
  *   **Option C:** No numbers at all, but a willingness to rank events against one another (e.g., "Event X is more likely than Event Y, but I won't price them"). → **Go to Node 9.**

  **Node 2: Case (e) Widening**
  *Context:* A switch is 0 or 1 (fair coin). North and South stations print the state. Both are correct, OR South is cross-wired (prints opposite). You don't know which. North prints 1.
  *Question:* Before seeing North's printout, you have a view on South. After seeing North prints 1, is it defensible to say you are *less* sure about what South will print than you were before?
  *   **Option A:** No. Reading an instrument cannot make me less certain. My certainty must stay the same or increase. → **Go to Node 3.**
  *   **Option B:** Yes. In this specific setup, the new information reveals a dependency that widens my uncertainty. → **Go to Node 4.**

  **Node 3: Case (g) Accumulation**
  *Context:* After ten years of records, your interval for a failure rate runs from 0.1 to 0.4. Ten more years of the same kind of records arrive.
  *Question:* What happens to the interval?
  *   **Option A:** The interval must narrow. More data always reduces uncertainty. → **Leaf 1.**
  *   **Option B:** It depends on what is making the interval wide. If the width is due to model uncertainty, more data of the same kind won't narrow it. → **Leaf 2.**

  **Node 4: Case (d) Two Teams**
  *Context:* Two teams, equally credible, report 0.3 and 0.7 for the same event.
  *Question:* How do you combine these into a single statement for the report?
  *   **Option A:** Average them (0.5). The truth is likely between them. → **Leaf 3.**
  *   **Option B:** Report the span (0.3 to 0.7) and attach mass to the set, not just the points. I cannot collapse this to a single line. → **Leaf 4.**

  **Node 5: (Unused in this path, reserved for expansion)**
  *   *Note:* This path is closed. Authors reaching Node 4 have been classified.

  **Node 6: Case (f) Straddling Ranges**
  *Context:* Option A net benefit [3 to 9]. Option B net benefit [4 to 7]. They move together (A is better when parameters are favourable, worse when unfavourable).
  *Question:* Which option do you recommend?
  *   **Option A:** The one with the better worst case (Option B). → **Leaf 5.**
  *   **Option B:** Either is acceptable. I do not pick one; I say both are permissible. → **Leaf 6.**
  *   **Option C:** I apply a fixed weighting of worst and best cases (e.g., 60% optimism, 40% pessimism) to pick a single score. → **Leaf 7.**
  *   **Option D:** I pick a single number inside the range (e.g., the midpoint) and act on that, provided I use it consistently. → **Leaf 8.**
  *   **Option E:** I pick the single most-likely value from my preferred model and ignore the rest for the decision. → **Leaf 9.**
  *   **Option F:** It depends on the credibility of the models generating the ranges. I weight the models themselves. → **Leaf 10.**
  *   **Option G:** I defer the decision and commission more work to narrow the ranges. → **Leaf 11.**

  **Node 7: (Unused in this path, reserved for expansion)**
  *   *Note:* This path is closed. Authors reaching Node 6 have been classified.

  **Node 8: (Unused in this path, reserved for expansion)**
  *   *Note:* This path is closed. Authors reaching Node 6 have been classified.

  **Node 9: Case (c) Thin Evidence**
  *Context:* One imperfect study, no earlier records, a quantity nobody in the field has measured.
  *Question:* What goes in the report?
  *   **Option A:** Nothing quantitative. I will only state rankings or qualitative confidence. → **Leaf 12.**
  *   **Option B:** A number fixed by indifference (e.g., 0.5). Since I have no reason to think otherwise, I split the difference. → **Leaf 13.**
  *   **Option C:** I report the error rate of the study method, not the probability of the event itself. → **Leaf 14.**

  **Node 10: (Unused in this path, reserved for expansion)**
  *   *Note:* This path is closed. Authors reaching Node 9 have been classified.

  ---

  ## Leaf Mapping Table

  | Leaf | Position Name | Reporting vs. Deliberative | Permitted Statement in Assessment | Most Awkward Consequence for Conventions |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | Strict Precise Probabilism | **Deliberative** (Single number drives all) | A single probability value. Ranges are summaries of confidence intervals. | Cannot formally acknowledge model uncertainty without converting it to a probability distribution. |
  | **2** | Robust Sensitivity Analysis | **Reporting** (Range reported, single analysis drives decision) | A designated "best estimate" with a sensitivity range attached. | Risks "Laundering": the range is ignored in the final investment decision. |
  | **3** | Hierarchical / Second-Order Probabilism | **Deliberative** (Distribution over probabilities drives decision) | A mean probability with a variance or confidence distribution attached. | Requires authors to quantify their uncertainty about their own uncertainty (meta-uncertainty). |
  | **4** | Belief-Function Style Uncertainty | **Deliberative** (Mass on sets drives decision) | Probability masses assigned to sets of outcomes (e.g., "High or Medium"). | Incompatible with standard cost-benefit analysis which requires point expectations. |
  | **5** | Strict Imprecision (Worst-Case) | **Deliberative** (Width drives decision via Maximin) | A range, with the recommendation based on the lower bound. | May lead to over-engineering or rejecting beneficial projects with high upside risk. |
  | **6** | Strict Imprecision (Permissive) | **Deliberative** (Width drives decision via Maximality) | A range, stating that any option non-dominated within the range is acceptable. | May result in no clear recommendation ("either A or B is fine"), stalling procurement. |
  | **7** | Optimism–Pessimism Weighted Rule | **Deliberative** (Width drives decision via weighting) | A range, with a recommendation based on a weighted average of bounds. | The weighting factor (e.g., 0.6) is subjective and hard to defend in a public inquiry. |
  | **8** | Unnamed: Consistent Arbitrary Selection | **Reporting** (Range reported, arbitrary point drives decision) | A range, with a note that a specific value within it is selected for consistency. | Hard to distinguish from Laundering; looks like imprecision but acts like precision. |
  | **9** | Laundered Imprecision | **Reporting** (Range reported, single model drives decision) | A range derived from multiple models, but the decision uses only the central model. | The range is decorative. If the central model fails, the range offers no protection. |
  | **10** | Hierarchical (Non-Neutral Ambiguity) | **Deliberative** (Credibility weights drive decision) | A range where models are weighted by expert credibility scores. | Credibility scoring is political and vulnerable to bias; hard to audit. |
  | **11** | Unnamed: Decision Deferral | **N/A** (No decision reached) | A statement that current evidence is insufficient to recommend an intervention. | Conflicts with programme mandates to deliver a risk assessment and recommendation. |
  | **12** | Comparative or Ordinal Uncertainty | **Deliberative** (Ranks drive decision) | Qualitative rankings (e.g., "High Risk" > "Medium Risk"). No numbers. | Cannot be aggregated into a national portfolio risk figure without conversion. |
  | **13** | Ignorance / Indifference | **Deliberative** (Indifference drives decision) | A single number derived from the principle of insufficient reason (e.g., 50/50). | Treats total ignorance as equivalent to known risk; vulnerable to framing effects. |
  | **14** | Error-Statistical Refusal | **Reporting** (Method reliability reported) | Statements about the reliability of the measurement method, not the event probability. | Does not answer the policy question ("Will the flood happen?"), only the method question. |

  ---

  ## Logical Space Analysis

  ### Unoccupied Cells
  1.  **Imprecise Probabilism with Additive Decisions:** A position where an author maintains a gap (Node 1, Option B) but insists on averaging outcomes for decisions (Node 6, Option A). This is logically unstable: if the gap represents genuine ambiguity, averaging resolves it arbitrarily. Authors selecting this combination usually collapse into **Leaf 3 (Hierarchical)** upon probing, or **Leaf 9 (Laundered)**.
  2.  **Strict Precise with Widening:** A position where an author demands a single buy/sell price (Node 1, Option A) but admits certainty can decrease after evidence (Node 2, Option B). This violates the martingale property of precise probability. Authors selecting this are usually **Leaf 4 (Belief-Function)** users who are accustomed to collapsing their beliefs to a single number for procurement purposes.

  ### Indistinguishable Pairs
  1.  **Leaf 2 (Robust Sensitivity) vs. Leaf 9 (Laundered Imprecision):** Both report a range but decide on a single analysis. The distinction relies on the author's *intent*: does the range inform the decision (Robust) or is it decorative (Laundered)? The tree cannot separate these without observing the actual decision memo. *Workaround:* In the workshop, ask: "If the sensitivity range contradicted your designated analysis, would you change the recommendation?"
  2.  **Leaf 3 (Hierarchical Neutral) vs. Leaf 10 (Hierarchical Non-Neutral):** Both weight models. The distinction is whether the weighting is neutral (uniform) or based on credibility. In practice, authors often claim neutrality while applying implicit credibility weights. *Workaround:* Treat them as a single cluster for programme purposes, noting that Non-Neutral requires an audit trail for credibility scores.

  ### The "Any Number in Range" View
  **Status:** **Leaf 8 (Unnamed: Consistent Arbitrary Selection).**
  **Explanation:** This view has a home in the tree. It appears in Node 6, Option D. It is distinct from **Leaf 5 (Worst-Case)** because it does not mandate the bound, and distinct from **Leaf 9 (Laundered)** because the author acknowledges the range is real and the selection is arbitrary but consistent, rather than claiming the selected point is the "true" value. It is absorbed here as a pragmatic variant of imprecise probabilism that forces a decision rule without claiming false precision.

  ---

  ## Diagnostics: Inconsistent Response Patterns

  If an author produces one of the following combinations, pause the classification. Do not assign a leaf. Use the follow-up script to clarify.

  **Pattern 1: The "Widening Precise" Contradiction**
  *   **Responses:** Node 1 (Same Number) + Node 2 (Yes, certainty can decrease).
  *   **Diagnosis:** The author is using precise language for procurement but holds a non-additive belief state. They may not realize these are incompatible.
  *   **Follow-up Question:** "If you must give a single buy/sell price, but you admit new data can make you less sure, are you pricing the *event* or pricing your *lack of knowledge* about the event?"
  *   **Note to Record:** *Potential Belief-Function user operating under Precise constraints.*

  **Pattern 2: The "Gap Averager" Contradiction**
  *   **Responses:** Node 1 (Gap) + Node 6 (Option A: Average the teams/outcomes).
  *   **Diagnosis:** The author claims ambiguity (Gap) but resolves it using a rule (Averaging) that assumes the ambiguity is resolvable by symmetry.
  *   **Follow-up Question:** "You asked for a higher price to sell than to buy, which suggests you fear the unknown. But then you average the unknown outcomes. Which fear is real: the one that sets your price, or the one you ignore in your calculation?"
  *   **Note to Record:** *Inconsistent decision rule. Likely Hierarchical (Leaf 3) masking as Imprecise.*

  **Pattern 3: The "Indifference Inflation"**
  *   **Responses:** Node 9 (Option B: Number by indifference) + Node 1 (Option B: Gap).
  *   **Diagnosis:** The author uses indifference to generate a number when evidence is thin, but claims a gap when evidence is conflicting. This suggests the "Gap" is not about ambiguity but about disagreement.
  *   **Follow-up Question:** "When you have no evidence, you pick a number. When you have conflicting evidence, you pick a range. Does more information make you less willing to decide?"
  *   **Note to Record:** *Confusion between Ignorance (Leaf 13) and Ambiguity (Leaf 5-10).*

  **Pattern 4: The "Decorative Range"**
  *   **Responses:** Node 3 (Option B: Interval depends on source) + Node 6 (Option E: Act on single most-likely).
  *   **Diagnosis:** This is the definition of **Laundering**. The author acknowledges model uncertainty (Node 3) but explicitly ignores it in the decision (Node 6).
  *   **Follow-up Question:** "If the width of the interval represents real risk, why does your recommendation not change when the width changes?"
  *   **Note to Record:** *Confirmed Reporting Imprecision (Leaf 9). Flag for manual review.*

  ---

  ## Workshop Leader's Key for Reporting vs. Deliberative Imprecision

  Use this key to tag the final report. This distinction is not in the tree nodes but is derived from the Leaf.

  *   **Tag: DELIBERATIVE**
      *   **Leaves:** 1, 3, 4, 5, 6, 7, 10, 12, 13, 14.
      *   **Meaning:** The width of the uncertainty (or the lack of a number) directly changes the recommendation.
      *   **Action:** Accept the assessment. The uncertainty is doing work.

  *   **Tag: REPORTING**
      *   **Leaves:** 2, 8, 9.
      *   **Meaning:** A range appears in the text, but a single analysis drives the recommendation.
      *   **Action:**
          *   If **Leaf 2 (Robust Sensitivity)**: Accept, but ensure the "designated analysis" is justified.
          *   If **Leaf 8 (Consistent Arbitrary)**: Accept, but require a justification for the selected point.
          *   If **Leaf 9 (Laundered)**: **Reject.** Return to author. The range is decorative and misleads stakeholders about the risk. Require a Deliberative account or removal of the range.
