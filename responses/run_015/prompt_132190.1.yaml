answer: |-
  ### Desiderata for a Theory of Historical Overdetermination

  To account for genuinely overdetermined historical outcomes without collapsing into causal pluralism (where everything is a cause) or reductionism (where one cause is arbitrarily privileged), a theory of historical explanation must satisfy the following four desiderata.

  #### 1. The Symmetry Condition
  **Requirement:** If factors $A$ and $B$ are both genuinely sufficient for outcome $E$ within the relevant context, the theory must assign them equal ontological status as causes, without requiring a meta-rule (e.g., "economic factors trump ideological ones") to select a primary cause.
  **Motivating Case:** *The Outbreak of WWI.* Suppose both the Alliance System ($A$) and the Assassination of Franz Ferdinand ($B$) were independently sufficient to trigger a general war given the background conditions. A reductionist theory privileges one (e.g., structuralism picks $A$; intentionalism picks $B$). A pluralist theory says "everything matters," diluting explanatory power. The Symmetry Condition demands both be cited as causes, yet the explanation must not imply that *any* sufficient factor counts (avoiding pluralism).
  **Status:** **Camp-Specific.** Structuralists may reject this to privilege deep causes; intentionalists may reject it to privilege agent-level triggers. However, it is necessary for a non-reductionist account of overdetermination.

  #### 2. The Counterfactual Stability Condition
  **Requirement:** In cases of genuine overdetermination, the counterfactual "If $A$ had not occurred, $E$ would still have occurred (via $B$)" must be true. In cases of **causal redundancy** (preemption), this counterfactual must be false regarding the inert cause (if the active cause $A$ had not occurred, $B$ *would* have caused $E$, but since $A$ did occur, $B$ was rendered inert). In cases of **interference** (synergy), the counterfactual "If $A$ had not occurred, $E$ would still have occurred" must be false, because $B$ alone is insufficient.
  **Motivating Case:** *Dual Firing Squad.* Two shooters ($A$ and $B$) fire simultaneously, killing the prisoner ($E$). This is overdetermination: if $A$ abstains, $B$ still kills. Contrast this with **redundancy**: $A$ fires, $B$ holds fire because $A$ fired. If $A$ abstains, $B$ fires. But in the actual world, $B$ is inert. Contrast with **interference**: $A$ (labor strike) and $B$ (capital flight) together cause regime collapse ($E$), but neither alone would. If $A$ is removed, $E$ does not occur.
  **Status:** **Non-Negotiable.** This is the definitional boundary between the three causal structures. Without this, "overdetermination" is indistinguishable from synergy or preemption.

  #### 3. The Independence Condition
  **Requirement:** For overdetermination to hold, the causal processes initiated by $A$ and $B$ must be ontologically distinct and convergent, not mutually constitutive or interactive. $A$ and $B$ must be capable of producing $E$ via separate mechanisms that do not rely on each other's presence to function.
  **Motivating Case:** *The Fall of Rome.* If "Barbarian Invasions" ($A$) and "Economic Decay" ($B$) are cited as overdetermining causes, the theory must show that Economic Decay would have caused collapse *without* Invasions, and vice versa. If Economic Decay made the Empire vulnerable *specifically* to Invasions (interaction), this is an interference case, not overdetermination. The theory must prevent historians from labeling interactive factors as "overdetermining" simply to avoid weighing them.
  **Status:** **Non-Negotiable.** This prevents the conceptual conflation of synergy with overdetermination.

  #### 4. The Proportionality Condition
  **Requirement:** The granularity of the causal explanation must match the granularity of the outcome. An explanation is flawed if it cites a massive structural cause for a specific event (too broad) or a minute contingency for a structural shift (too narrow), even if counterfactually stable.
  **Motivating Case:** *The Russian Revolution.* Citing "Universal Entropy" as a cause of the Bolshevik victory is counterfactually stable and sufficient, but disproportionately broad. Citing "Lenin's Cold" is disproportionately narrow. In overdetermination, if $A$ and $B$ are both causes, they must both be proportionate to $E$. This excludes "background conditions" that are always present but not explanatorily relevant.
  **Status:** **Camp-Specific.** Pragmatists require this; ontological realists may argue that if $A$ causes $E$, the scale is irrelevant. However, it is required to avoid causal pluralism.

  ***

  ### Logical Tensions and Exclusionary Power

  **Jointly Unsatisfiable Subset:**
  Under **standard Lewis-style counterfactual theories of causation**, the **Counterfactual Stability Condition** and the admission of **Genuine Overdetermination** are jointly unsatisfiable.
  *   *Reasoning:* Standard counterfactual theory defines causation as dependence: $C$ causes $E$ only if, had $C$ not occurred, $E$ would not have occurred. In genuine overdetermination ($A$ and $B$ both sufficient), if $A$ is removed, $E$ still occurs (due to $B$). Therefore, $E$ does not counterfactually depend on $A$. Strict adherence to standard counterfactual dependence forces the theory to deny that $A$ is a cause, violating the Symmetry Condition and the intuition of overdetermination. To satisfy the desiderata, one must adopt a modified theory (e.g., structural equation models or quasi-dependence) that breaks the strict link between dependence and causation.

  **The Most Exclusionary Desideratum:**
  The **Symmetry Condition** does the most work in excluding popular historiographical accounts.
  *   *Reasoning:* Most historical explanations are implicitly reductionist. Marxist histories privilege economic base; Great Man theories privilege agency; Geopolitical theories privilege geography. These frameworks rely on a hierarchy of causes to generate narrative coherence. The Symmetry Condition forbids this hierarchy in overdetermined cases, forcing the historian to acknowledge multiple, equally sufficient, distinct causal tracks. This destabilizes standard narrative forms that require a "primary" driver to maintain plot coherence.

  ***

  ### Revisability and Falsification Conditions

  **What Would Change My Mind:**
  1.  **Empirical Finding on Micro-Temporality:** If detailed process-tracing in historical cases demonstrated that **true simultaneity is impossible**—i.e., that there is always a micro-temporal gap where one factor completes the causal process milliseconds before the other—then "genuine overdetermination" would collapse into **causal redundancy** (preemption). If $A$ finishes the job before $B$ arrives, $B$ is inert. If this holds for all historical events, the Counterfactual Stability Condition would need to be revised to treat all apparent overdetermination as preemption, rendering the Symmetry Condition obsolete.
  2.  **Argument on Counterfactual Vacuity:** If it were proven that historical counterfactuals are ontologically vacuous (i.e., we cannot meaningfully assert "If $A$ had not occurred..." because historical systems are too path-dependent to allow isolated variable manipulation), then the Counterfactual Stability Condition would be untenable. I would then have to shift to a **mechanistic theory of causation**, where overdetermination is defined by the existence of two complete causal mechanisms rather than counterfactual robustness.

  **Where My Reasoning Is Most Likely to Fail:**
  My reasoning relies on the **Independence Condition**, assuming that historical factors ($A$ and $B$) can be individuated cleanly enough to test for independence. In complex historical systems, factors are often entangled (e.g., "Economic Decay" and "Social Unrest" may be mutually constitutive). If causal factors cannot be isolated without distorting the historical reality, the distinction between overdetermination and interference collapses. In such a scenario, insisting on the Independence Condition forces an artificial analytic separation onto an organic whole, potentially making the theory precise but historically inapplicable.
