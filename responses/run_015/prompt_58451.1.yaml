      *   **Maya's Argument (Pro):** Decomposition allows scrutiny. Weak models are easier to align. If subtasks are safe, the whole is safe. Reduces cognitive load on any single instance.
      *   **Jon's Argument (Con):** Context fragmentation. Holistic judgment is lost. Error propagation (if one subtask is wrong, the final decision is skewed). Goal misgeneralization in subtasks (optimizing for the subtask metric rather than the user's true welfare).

  3.  **Drafting - Section by Section:**

