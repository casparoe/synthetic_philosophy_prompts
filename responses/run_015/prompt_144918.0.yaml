  **Private Pass**
  *   **Full Compliance:** Requires adhering to all local norms. *Breaks on:* Locally Dispreferred conventions (c). Compels visitors to sustain exploitative equilibria (e.g., tipping ratchets) against moral intuition.
  *   **Non-Interference Only:** Requires only avoiding direct interference. *Breaks on:* Extractive conventions (b). Permits harm to identifiable locals (e.g., docked wages) under the guise of neutrality.
  *   **Cost-Based:** Requires compliance with (a) Coordinative and (b) Extractive, permits dissent on (c) Locally Dispreferred. *Breaks on:* Epistemic uncertainty. Visitors may misidentify (b) as (c), causing unintended harm.
  *   **Commitment:** Cost-Based. It aligns duty with harm prevention while allowing ethical dissent where no victim exists. Uncertainty is managed via a harm-avoidance default.

  ***

  **MEMORANDUM**

  **To:** Conduct Committee
  **From:** Advisory Panel on Social Ontology
  **Subject:** Guidance on Local Conventions for Fellows

  The Society should adopt a Cost-Based compliance framework for all fellows. Fellows must adhere to coordinative and extractive conventions but are permitted to dissent from locally dispreferred equilibria provided no identifiable harm occurs.

  Our stipulated distinction clarifies the moral landscape. Coordinative conventions, such as queue discipline or traffic flow, require compliance to prevent coordination failure. This was violated when a fellow's queue-holding delayed her lab group; her departure made the practice worse for others without moral gain. Extractive conventions require compliance to prevent shifting costs to identifiable locals. This was violated when a fellow declined tips in a wage-dependent city, resulting in a server being docked pay. In both cases, noncompliance imposed tangible costs on others.

  The difficult case concerns locally dispreferred conventions—equilibria locals would exit if they could, such as aggressive tipping ratchets. Here, visitors have no duty to sustain the equilibrium. A visitor's compliance often helps hold these bad norms in place. However, if dissent triggers extractive harm—for instance, if refusing a tip causes a specific server to lose income—the duty to prevent harm overrides the permission to dissent. We cannot use locals as means to our moral ends, even when protesting the system that employs them.

  Fellows cannot always distinguish extractive from dispreferred conventions. The Full Compliance view rightly warns that visitors lack epistemic access to local equilibria and risk instrumentalizing locals by treating them as props for ethical statement-making. A visitor's model of a strange city's equilibrium is usually worse than the locals' revealed behaviour. To mitigate this, when uncertain, fellows must default to compliance. Protecting the vulnerable local takes precedence over the visitor's moral consistency. If a convention appears dispreferred but compliance prevents immediate harm to an identifiable party, the fellow must comply.

  This balances respect for local agency with our duty of non-maleficence. It rejects moral tourism that harms locals while avoiding complicity in exploitative systems where no specific victim is identifiable.

  **Implementation:** We will distribute a one-page heuristic guide to all fellows by 1 October, requiring acknowledgment of these harm-avoidance protocols prior to departure. The guide will include specific examples of extractive versus dispreferred scenarios to aid judgment.

  \answer{COST-BASED: harm-avoidance default}
