answer: |-
  You have identified a specific, high-friction failure mode in online community governance. You are right that "hypocrisy" is too blunt an instrument here. Hypocrisy implies a contradiction in *belief* or *moral stance* for self-gain. What you are describing is a contradiction in *metaphysics* (what counts as real) to evade *normative burden* (what we must do about it).

  There is no single, canonical academic term for this exact maneuver, though it sits at the intersection of game studies, ethics, and dispute resolution. The closest established concepts are **"The Magic Circle"** (the boundary between game and life), **"Moral Disengagement"** (psychological mechanisms to justify harmful acts), and **"Special Pleading"** (applying standards inconsistently). However, your observation is distinct from all three.

  Since no existing term captures the *ontological switching based on liability*, I will coin a term for the carving you need: **Ontological Arbitrage**.

  Below is the breakdown of what this is, why it isn't just special pleading, when it might actually be valid, and how to spot the boundaries.

  ### 1. The Carving: What is Ontological Arbitrage?

  **Definition:** Ontological Arbitrage is the strategic toggling of the "reality status" of a virtual event or object within a single discourse, driven not by a consistent worldview, but by the *normative cost* of acknowledging that reality.

  **The Mechanism:**
  1.  **Claim Phase:** The user asserts a virtual object/event is **Real** when doing so grants them a right (e.g., "My base is property," "My harassment was assault"). This triggers an obligation on *others* (mods, offenders) to provide restitution or justice.
  2.  **Defense Phase:** The user asserts a virtual object/event is **Irreal** ("just pixels," "just a game") when acknowledging its reality would impose a duty on *them* or the *institution* (e.g., "I didn't steal, it's just code," "You weren't hurt, it's just voice chat").
  3.  **The Trigger:** The switch flips based on **Liability**. If "Real" = "I get something," they are Realists. If "Real" = "I owe something," they are Irrealists.

  **Why it's not just "Special Pleading":**
  Special pleading is saying, "The rule applies to everyone, but I am an exception."
  Ontological Arbitrage is saying, "The rule applies to everyone, but the *nature of the universe* changes so the rule doesn't trigger."
  *   *Special Pleading:* "Stealing is wrong, but I shouldn't be banned."
  *   *Ontological Arbitrage:* "Stealing is wrong (when done to me), but this isn't stealing (when I do it) because items aren't real."
  It attacks the *premise* of the obligation, not the *application* of the penalty. It is a deeper, more destabilizing move because it undermines the shared reality required for the server to function.

  **Why it's not "Moral Disengagement":**
  Moral disengagement (a psychological concept) explains how individuals justify *their own* bad behavior (e.g., "It's just a game, so my harassment doesn't count"). It does not typically account for the *victim* minimizing their own harm ("It's just a game, so my harassment doesn't matter"), which you noted happens. Your pattern includes victims deflating their own suffering to avoid the social friction of a formal process. This suggests the driver is **Systemic Friction**, not just individual guilt.

  ### 2. Is it a Genuine Double Standard? (The Validity Check)

  You asked if there is a version where the flip is correct. The answer is **yes**, but only if the two standards track different *categories* of rules, not just convenience.

  **The Valid Asymmetry (Mechanical vs. Social):**
  In most MMOs, there are two distinct layers of governance:
  1.  **The Mechanical Layer (Items/Code):** Governed by the ToS and game mechanics. Items are usually licensed, not owned. Duping might be a bannable offense, but "theft" of in-game items is often mechanically permissible (e.g., open PvP looting). Here, "It's just pixels" is technically true regarding *legal ownership*.
  2.  **The Social Layer (Conduct/Harm):** Governed by community guidelines. Harassment, hate speech, and targeted abuse are real-world conduct violations, regardless of the medium. Here, "It's just a game" is technically false regarding *human impact*.

  **When the Flip is Valid:**
  *   *Scenario:* A player argues, "Duping ore isn't theft because the ToS says we don't own items (Mechanical Layer), BUT harassing me on VC is a bannable offense because it violates the Code of Conduct (Social Layer)."
  *   *Verdict:* This is **Consistent Categorization**. They are applying the correct ontology to the correct layer. The "reality" of the ore is low (license); the "reality" of the harassment is high (human psychology).

  **When the Flip is Arbitrage:**
  *   *Scenario:* A player argues, "Torching my base is theft (Social/Real ontology) because I spent time on it, BUT harassing that woman is fine (Mechanical/Irreal ontology) because it's just voice chat."
  *   *Verdict:* This is **Ontological Arbitrage**. They are treating *time investment* as creating real property rights in the first case, but denying *psychological impact* creates real harm in the second. They are cherry-picking which layer applies to minimize their total obligation.

  **The Test for Consistency:**
  To determine if a user is arbitraging or reasoning consistently, ask: **"Does your definition of 'Real' hold if the obligation is reversed?"**
  *   If they claim the base is "real property" deserving restoration, ask: "If you torch a base, do you accept you owe real restitution?"
  *   If they claim harassment is "just talk," ask: "If someone harassed you, would you accept no mod intervention?"
  If they cannot answer "Yes" to the reversed obligation without switching their definition of reality, it is arbitrage.

  ### 3. Boundary Cases: Instances vs. Near Misses

  To help your mod team identify this quickly, here are the boundaries.

  **Instance (Ontological Arbitrage):**
  *   **The "ToS Shield":** A player defends griefing by citing "Open PvP rules" (It's a game mechanic), but when they are griefed, they appeal to "Community Spirit" and "Time Wasted" (It's a social violation).
  *   **The "Victim Minimization":** A harassed player tells mods, "Don't worry, it's just Discord, I can take it," to avoid a lengthy investigation, but later uses that same harassment as leverage in a separate dispute to paint the other party as "toxic." (Using "fake" status to avoid work, "real" status to gain leverage).
  *   **The "Restoration Paradox":** Demanding item rollback (acknowledging items have value) while arguing against a ban for destroying those items (arguing actions have no consequence).

  **Near Miss (Not Arbitrage):**
  *   **The Consistent Nihilist:** "Nothing matters, it's all pixels. Don't ban me for griefing, and don't expect me to care if you grief me." (Consistent Irrealism. Annoying, but not arbitrage).
  *   **The Consistent Roleplayer:** "Everything matters. This base is my home, and your words are violence. Both should be punished." (Consistent Realism. High maintenance, but honest).
  *   **The Rule Lawyer:** "The ToS says items aren't property, so no rollback. The ToS says harassment is banned, so ban him." (Consistent Institutionalism. They aren't flipping ontology; they are flipping to the written rulebook for both).

  ### 4. Operationalizing the Term

  For your mod team, you can define **Ontological Arbitrage** as:
  > *"An argumentative tactic where a user selectively asserts the 'reality' of a virtual event to claim rights, while denying the 'reality' of that same event to evade duties."*

  **How to Counter It:**
  Do not engage on the metaphysics ("Is it real?"). Engage on the **Social Contract**.
  *   *Bad Response:* "Actually, the base is real property." (Now you're arguing philosophy).
  *   *Good Response:* "Regardless of whether it's pixels, our server rules treat time investment as protected, and voice conduct as protected. You cannot claim protection for one while denying it for the other."

  **Why this matters for your workload:**
  Arguments driven by Ontological Arbitrage are **unresolvable by fact**. You cannot fact-check whether something is "real." You can only enforce the **Consistency of Obligation**.
  When you spot the flip, stop arbitrating the *incident* and start arbitrating the *standard*. Call out the switch: *"You're treating this as a serious violation when you're the victim, but a non-issue when you're the actor. We need a consistent standard. Which one do you want to apply to both sides?"*

  This forces them to lock into one ontology. Usually, they will retreat to the one that costs the community less (the "it's just a game" stance), which allows you to close the ticket faster.

  ### Summary
  *   **Name:** Ontological Arbitrage.
  *   **Core Driver:** Avoidance of Normative Burden (Obligation).
  *   **Distinct From:** Special Pleading (changes the world, not the rule) and Moral Disengagement (includes victims minimizing their own harm).
  *   **Validity:** Only valid if distinguishing between Mechanical Rules (items) and Social Rules (conduct). Invalid if swapping based on who is at fault.
  *   **Mod Strategy:** Enforce Consistency of Obligation, not Ontological Truth.

  This pattern is the primary reason mod teams burn out: they get dragged into metaphysical debates about the nature of digital existence when they should be enforcing behavioral consistency. Naming it helps your team spot the trap and step out of it.
