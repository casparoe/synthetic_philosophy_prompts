answer: |-
  Reject step (5), because it illicitly infers that a part with no isolated value contributes no value to an organic whole, which directly contradicts step (2).

  Step (5) looks plausible only because it treats the object's contribution as additive rather than constitutive; it assumes that because the object alone is valueless (4), its existence within the conscious state is axiologically inert. But Moore's organic unity principle (2) explicitly forbids reading a part's contribution off its isolated value. The existence of the real object is a necessary condition for the conscious state to be the specific high-value whole it is, even if the object itself adds no independent weight. Running your mirror cases clarifies this: in the case of unappreciated affection, the good is missing not because the object (the friend) is absent, but because the consciousness is absent, confirming that the conscious state is the locus of value. In the hallucinator case, when the subject discovers the deception, the value doesn't retroactively vanish—intrinsic value is timeless—but the discovery reveals the past state was never the high-value whole [consciousness of real object] but the lower-value whole [consciousness of apparent object]. The object's existence doesn't add value like a brick in a wall; it changes the chemical nature of the compound, meaning the hallucinator's state was always less valuable than the veridical perceiver's, despite type-identical feelings.

  The "contact requirement" exit costs you the purity of intrinsic value theory by smuggling an externalist causal condition into the definition of the good, making value dependent on historical facts rather than the present nature of the whole, which undermines Moore's isolation test methodology. The alternative proposal—that the isolation test cannot run on intentional states—prices even higher: it cripples Moore's core analytic tool, forcing you to admit that we cannot know the intrinsic value of the very goods (consciousness of beauty) his system is built to identify, leaving the theory without a mechanism to distinguish veridical from simulated goods except by stipulation.
