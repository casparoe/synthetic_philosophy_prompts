      *   *Resolution:* Bentham tries to minimize the weight of antipathy by labeling it irrational. He argues that law shouldn't cater to prejudice because doing so reinforces the prejudice, creating more long-term pain. So, he doesn't let it veto, but he acknowledges the *political reality* of it.

