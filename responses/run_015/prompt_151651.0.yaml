      *   *The Calculus:* Pain of disgust is real pain. If the public feels disgust, that is a negative utility. However, Bentham argues this pain is *factitious* (created by law/opinion) rather than *intrinsic*.
      *   *Offences Against Oneself:* Bentham is skeptical here. He often argues that if it only affects the agent, it's not a proper subject for legal punishment, though he acknowledges prudential advice.
      *   *The Tension:* Bentham is a radical liberal regarding sexuality compared to his time, but he is still a utilitarian. If punishing a private act causes less pain (to the actor) than the disgust it causes the public, a crude utilitarian might ban it. Bentham tries to avoid this by arguing the disgust *shouldn't* count or can be educated away.

