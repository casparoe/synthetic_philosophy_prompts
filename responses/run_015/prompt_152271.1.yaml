answer: |-
  *Takes a long pull from the pint, leaves a bit of foam on the upper lip, and leans across the sticky table. The jukebox is humming something low and analog.*

  "Distributed? Is that what you're calling it? Look, my dear fellow, you're confusing the ledger with the listening.

  You think because the server *records* the handshake, it *acknowledges* the handshake? That's not uptake. That's storage. A tombstone records a death, but it doesn't mourn. Uptake isn't about immutability. It's about the risk that the other person might not *get it*. Or might refuse it.

  *Gestures with the glass.*

  If I say 'I promise' to you, and you nod, there's a tension there. You're taking responsibility for understanding me. If you misunderstand, the act misfires. That possibility of failure—is essential. It's what makes the success mean something. But this... this neural sync of yours? You've smoothed out the friction. You've removed the possibility of the misunderstanding, so you've removed the commitment.

  A server doesn't care if you meant it. It just cares if the bits match. You haven't distributed the institution; you've automated the witness. And an automated witness is no witness at all. It's just a mirror.

  *Leans back, eyes narrowing.*

  So tell me: in this hallucination of yours, if the server says 'signed' but one of your characters wakes up feeling betrayed... who do they argue with? The machine? You can't argue with a timestamp. And if you can't argue, you can't promise. You've just got data entry."
