  *(Refining the "Decisive" Textual Point)*: The strongest defeater is the *purpose* of drinking. *Laws*: Testing/Rehabilitating character (making the old shameless to re-teach shame). *Symposium*: Escalating desire toward the Forms. One is therapeutic/civic, one is metaphysical/erotic. A "filter" manages the *process*, but if the *goal* is fundamentally different, the unity is superficial.

