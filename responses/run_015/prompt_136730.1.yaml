      *   **Constraints:** Play it straight, sort evidence from decisive to awkward, address specific bullet points (textual details, historical/institutional issues, unfalsifiability, comparison with standard readings, comparative case study), no bibliography/citations/quotes (paraphrase only), step-by-step thinking.
