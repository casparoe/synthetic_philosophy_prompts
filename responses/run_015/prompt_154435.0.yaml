      *   *Verdict:* The theory *is* at risk of unfalsifiability unless it commits to specific neural or computational signatures of analogical mapping that can be absent.

  8.  **Final Review against User Prompt:**
      *   Ranked map? Yes.
      *   Empirical vs. Formal? Yes.
      *   Defender's concession vs. dismissal? Yes.
      *   Assessment of untestability? Yes.

      *(Self-Correction during drafting)*: I need to make sure I don't just say "modularity is a problem." I need to explain *why* it's a problem for *this specific theory*. H&S argue against modularity. So evidence *for* strong modularity is evidence *against* H&S.
      Also, distinguish between "Analogy as a process" (mapping) and "Analogy as a description" (everything is similar to something). H&S claim it's a process. So evidence of non-mapping processes is key.

      *Refining the Ranking:*
