  If the Observer appeals to Class "Informed" (Size: 1,000), their Rank remains 60,000,000,000 relative to humanity, but within the Class, Rank is 500.
  New Upper Bound = 500 × 20 = 10,000.
  Terminal Date adjusts to 3 years from present.

  **EXPLANATORY NOTES**
  (This note is not part of the Regulations)

  Dr. Aris Thorne, Chief Departmental Statistician, stated: "The prior shift is modest, but statutory compliance requires we treat it as determinative. We cannot ignore the geometry of our own position."

  A spokesperson for the National Audit Office objected: "You are deriving a century-scale infrastructure constraint from a tautology about sampling bias. The error bars swallow the signal."

  **Final Notice:**
  As the dissemination of these Regulations renders all potential counters ineligible under Regulation 4(3), the Self-Locating Evidence Unit confirms the Reference Class is now empty. The official Doomsday Estimate is therefore undefined, implying a horizon extending beyond the operational capacity of this Unit. This report is published for the record of persons who, by reading it, are prohibited from being counted.
