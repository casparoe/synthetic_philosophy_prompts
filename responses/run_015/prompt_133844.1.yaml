  **STATUTORY INSTRUMENT 2024 No. 108**
  **The Self-Locating Evidence (Reference Class Assignment) Regulations 2024**

  **1. Citation and Commencement**
  These Regulations may be cited as the Reference Class Regulations 2024 and shall come into force on the day following publication in the Official Gazette.

  **2. Interpretation**
  In these Regulations—
  "Qualified Observer" means a human consciousness born after 1950 who lacks specific knowledge of Regulation 5;
  "Birth Rank" means the sequential position of the Observer within the Total Population;
  "Total Population" means the sum of all Qualified Observers past, present, and future;
  "Confidence Interval" means the statutory range within which Total Population must fall, calculated at 95% certainty.

  **3. The Principal Calculation**
  For the purposes of national infrastructure planning, the Upper Bound of Total Population shall be calculated as twenty times the current Birth Rank of the median Qualified Observer.

  **4. Eligibility and Epistemic Normalcy**
  (1) To be included in the Reference Class, an Observer must satisfy the Condition of Epistemic Normalcy.
  (2) An Observer fails the Condition if they possess knowledge that renders their temporal location non-random relative to the Total Population.
  (3) Awareness of these Regulations constitutes a failure of the Condition under paragraph (2).

  **5. Specialness Exemption**
  Any Observer who understands the probabilistic implications of Regulation 3 is hereby classified as "Atypical" and excluded from the Register of Qualified Observers until such understanding is forgotten or administratively revoked.

  **6. Deferred Classes**
  Entities listed in Schedule 1 shall not be counted toward Total Population until their ontological status is resolved by the Tribunal.

  **7. Appeals Tribunal**
  (1) An Observer excluded under Regulation 5 may petition to be reassigned to a narrower Reference Class (e.g., "Philosophically Informed").
  (2) The Tribunal shall grant such petitions only upon demonstration that the narrower Class yields a statistically robust bound.
  (3) Applicants shall be notified in writing that reducing the Class size while maintaining Birth Rank reduces the Upper Bound proportionally, thereby accelerating the statutory Doomsday Date assigned to their specific cohort.

  **8. Departmental Application**
  The methodology in Regulation 3 shall apply *mutatis mutandis* to the estimated remaining duration of the Department, the Self-Locating Evidence Unit, and the daily opening hours of the Departmental Canteen.

  **9. Statutory Override of Empirical Data**
  Notwithstanding empirical risk assessments regarding climate, nuclear proliferation, or asteroid impact, the Doomsday Adjustment derived from Regulation 3 shall take precedence in all long-term horizon scanning documents.

  **10. Publication and Vacating**
  Upon publication of this Instrument, all readers are deemed to have acquired knowledge under Regulation 4(3). The Register of Qualified Observers shall consequently be vacated.

  **SCHEDULE 1**
  **DEFERRED CLASSES**
  1. Uploaded consciousnesses.
  2. Post-human entities with lifespans exceeding 150 years.
  3. Non-terrestrial observers.
  4. Entities capable of reading this Schedule.

  **WORKED EXAMPLE**
