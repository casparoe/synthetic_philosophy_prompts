prompt: |-
  I am a high school junior writing a formal essay for a joint assignment in English and civics on whether literature can clarify current disagreements about prisons. In civics we contrasted two present day models, one represented by Halden Prison in Norway, where daily life is kept as normal as possible and staff focus on education, work, and respectful interaction to prepare residents for return to society, and the other represented by much of American mass incarceration, where long sentences and harsh conditions are defended as deserved retribution and as a way to deter future crime. I would like help reading Victor Hugo's novel Les Misérables through that contrast, since we just finished it in English. Please focus on the early episode in which a bishop welcomes the newly released convict Jean Valjean and then responds with unexpected generosity when Valjean steals his silver, on Valjean's original severe punishment for taking bread for his family and for later escape attempts and how that shapes him, on his later efforts as a town mayor and guardian of Cosette to live usefully, and on the police inspector Javert who pursues him in the name of strict obedience to law. For each, explain whether the episode is best understood as support for a rehabilitative view, a retributive or deterrent view, or something the modern distinction misses, and be candid where the novel resists application to present day institutions. I am especially interested in whether the bishop's personal act of mercy is the same kind of thing as state organized rehabilitation, whether Valjean's transformation depends on conditions no prison could reliably provide, and whether Javert represents a coherent theory of punishment or a personal need for moral order. Please close by reflecting on what the novel adds to the philosophical debate that statistics about recidivism alone cannot capture. Please give your answer in continuous prose only, with no headings, bullet points, bold text, or tables, in the manner of a thoughtful email or letter.
