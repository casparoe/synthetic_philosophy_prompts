answer: |-
  You are not being daft. You have put your finger on the single most persistent and sophisticated criticism leveled against Kuhn, one that occupied him for the last two decades of his life. As a physicist, your intuition is correctly flagging a tension between *semantic holism* (meanings depend on the whole theory) and *empirical progress* (the new theory does more stuff).

  The confusion lies in a specific equivocation regarding the word "measure." Your reading of incommensurability leans toward **incomparability**, whereas Kuhn intends **no common standard of truth**.

  Here is the breakdown of where the contradiction seems to exist and how Kuhn (and his defenders) resolve it without waving a hand.

  ### 1. Incommensurability $\neq$ Incomparability
  This is the linchpin. In mathematics, incommensurable quantities (like the side and diagonal of a square) lack a common *unit* of measure, but they are not incomparable. You can still establish relationships between them.

  Kuhn's incommensurability is semantic and perceptual, not methodological.
  *   **Semantic:** The term "mass" in Newton's network ($m = F/a$) and Einstein's network ($m = E/c^2$ or relativistic mass) refer to different things. There is no neutral language to translate one to the other without loss.
  *   **Perceptual:** After a revolution, scientists literally "see" the world differently (e.g., a pendulum is no longer a constrained fall; it is an oscillator).

  However, Kuhn never claimed we cannot compare the *outcomes*. We can compare the **instrumental success** of the paradigms even if we cannot compare their **ontological truth**.

  ### 2. The Redefinition of "Progress"
  Your objection rests on the assumption that "solving puzzles" implies moving closer to an objective Truth. Kuhn explicitly rejects this.

  For Kuhn, scientific progress is **evolutionary**, not teleological.
  *   **Teleological (Standard View):** Science moves toward the True Theory. Therefore, we need a shared metric to judge distance to Truth.
  *   **Evolutionary (Kuhnian View):** Science moves away from anomalies. A new paradigm is not "truer" in an absolute sense; it is "fitter" for the specific environment of anomalies the old paradigm created.

  When Kuhn says the new paradigm solves puzzles the old one couldn't, he is not making a claim about correspondence with Nature. He is making a claim about **scope and precision**. The new paradigm must account for everything the old one did (usually as a limiting case) *plus* the anomalies.

  ### 3. The Bridge: The Correspondence Principle
  You asked: *"How can Kuhn also claim that later ones solve puzzles the old ones couldnt?"*

  The mechanism that allows comparison despite semantic shift is the **Correspondence Principle**. Even if the *concepts* are incommensurable, the *mathematics* often retains a limiting relationship.
  *   Newtonian mechanics is not "translated" into General Relativity.
  *   However, GR yields numerical predictions that converge with Newtonian predictions at low velocities and weak fields.

  This provides a shared **empirical metric** even if there is no shared **theoretical metric**. As physicists, you and I can agree on the reading of a dial (observation statements) even if we disagree on what "force" is causing the needle to move. Kuhn concedes that while observation is theory-laden, it is not theory-*dictated*. There is enough overlap in instrumental output to declare one paradigm more precise or broader in scope than the other.

  ### 4. Local vs. Global Incommensurability
  In his later years (specifically in *The Road Since Structure*), Kuhn refined his view to address exactly your concern. He moved from global incommensurability to **local taxonomic incommensurability**.

  He argued that not *all* terms change meaning. Only a specific subset of "kind terms" (natural kind categories) undergo restructuring.
  *   In the Newton-to-Einstein shift, concepts like "space," "time," and "mass" change taxonomy.
  *   Concepts like "pointer reading," "statistical significance," or "mathematical consistency" often remain stable.

  This stable subset provides the "dictionary" you said was missing. It allows the community to agree that Paradigm B predicts the perihelion of Mercury more accurately than Paradigm A, even if they disagree on what "gravity" fundamentally *is*.

  ### 5. Where Your Confusion Lies
  You asked if your error is treating incommensurability as total semantic breakdown. **Yes, largely.** But the deeper error is expecting Kuhn's "puzzle solving" to be a paradigm-neutral metric.

  Kuhn admits there is no algorithm for theory choice. He lists values (accuracy, consistency, scope, simplicity, fruitfulness), but notes these can be applied differently by different scientists.
  *   Scientist A might value **scope** (Einstein explains Mercury).
  *   Scientist B might value **simplicity** (Newton is mathematically cleaner).

  The "progress" is not a logical proof that B > A. It is a sociological consensus that B is more *useful* for the current generation of puzzles. The "contradiction" dissolves if you accept that for Kuhn, **utility does not require translatability.**

  ### Summary
  You are treating the shift like a logical proof where premises must be shared to validate the conclusion. Kuhn treats it like a tool change.
  *   You can say a power drill is "better" than a hand drill because it makes holes faster (puzzle solving).
  *   You do not need to translate the concept of "torque" in the electric motor to the concept of "wrist force" in the manual drill to make that judgment.
  *   The metrics of performance (holes per minute) are shared, even if the ontology of the tool is incommensurable.

  Kuhn's claim is that science progresses in **problem-solving ability**, not in **truth-likeness**. If you grant him that distinction, the contradiction vanishes. If you hold that problem-solving ability *entails* truth-likeness, then yes, Kuhn is contradictory—but that is a premise he explicitly denies.
