      *   **Clarify Progress:** Kuhn redefines progress. It's not asymptotic approach to Truth. It's evolutionary. Like biological evolution, it's not "better" in a moral/absolute sense, but "more adapted" to the current environment (anomalies).
      *   **The Resolution (The "How"):** How do we compare?
          1.  *Overlap:* There is significant overlap in normal science. The revolution happens at the boundaries.
          2.  *Instrumentalism:* We can agree on observation statements (mostly) even if theoretical terms differ. (Though Kuhn is shaky on observation-ladenness, he concedes enough for comparison).
          3.  *Scope and Precision:* New paradigms usually retain the old results as limiting cases (Correspondence Principle). Newton works for low speeds. Einstein covers low + high.
      *   **Address the "Hidden Assumption":** The user asks if puzzle-solving is paradigm-neutral. Kuhn says "No, but..." The *problems* change, but the *ability to resolve anomalies* is the metric.

