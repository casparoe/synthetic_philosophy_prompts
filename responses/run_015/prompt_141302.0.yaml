answer: |-
  Here is the strongest formulation of your principle, a rival principle designed to test it, and an honest audit of where your view holds and where it fractures.

  ### I. The Strongest Version of Your Principle
  **Functional Epistemic Pluralism**

  1.  **The Clause of Earned Authority:** Documentary records hold presumptive authority over community memory *only if* they demonstrate **institutional independence** from the interests they adjudicate and **counterfactual sensitivity** (i.e., the record would look demonstrably different if the community's memory were true).
      *   *Function:* Establishes when the record is allowed to speak at all.
  2.  **The Clause of Functional Domain:** Even when authority is earned, the record governs only **assertoric claims** (statements of fact in public space, monuments, textbooks) and never **commemorative practices** (liturgy, private narrative, ritual) where the primary function is social cohesion rather than description.
      *   *Function:* Establishes where the record is allowed to speak.
  3.  **The Clause of Constitutive Silence:** Where the documentary record is structurally incapable of registering the memory's claim (e.g., the oppressed leave no papers, or the state defines their existence as "tranquility"), the memory holds epistemic authority over the record's silence. However, where the record acknowledges the event but disputes **agency**, the record governs if Clause 1 is satisfied.
      *   *Function:* Distinguishes between erasure (Memory wins) and contradiction (Record wins).

  ### II. A Rival Principle
  **Unitary Civic Truth**

  1.  **The Clause of Best Evidence:** In any domain that affects the public understanding of the past, the account best supported by the preponderance of evidence governs, regardless of the medium (oral or documentary) or the function (factual or ritual).
  2.  **The Clause of Non-Contradiction:** A community may not maintain a commemorative practice that explicitly asserts a factual claim known to be false by the best available evidence, even in private or liturgical settings, because false shared beliefs corrode the capacity for democratic judgment.
  3.  **The Clause of Harm:** The only exception to Clauses 1 and 2 is where correcting the memory causes direct, demonstrable harm to living persons (e.g., safety, livelihood), not merely psychic or identity cost.

  ### III. Motivation by Case
  Here is how the clauses of **Functional Epistemic Pluralism** (your principle) are motivated by your verdicts:

  *   **Clause 1 (Earned Authority):** Motivated by **Case 7 (Sea Lark)** and **Case 3 (K'iche')**. In Case 7, the inquiry lacked independence (exonerated owner prematurely); in Case 3, the record lacked sensitivity (recorded "tranquility" despite killings). This clause prevents the record from winning automatically.
  *   **Clause 2 (Functional Domain):** Motivated by **Case 5 (Valmira)** and **Case 6 (Family Enlistment)**. In Case 5, you allow the liturgy to keep the number 300 while the monument says 80. In Case 6, you allow the family to tell the story at dinner but not assert it as fact. This clause protects the *use* of memory from the *truth* of memory.
  *   **Clause 3 (Constitutive Silence):** Motivated by the tension between **Case 3 (K'iche')** and **Case 4 (Carpathians)**. Both involve violence and records. In Case 3, the record denies the event happened ("tranquility"); Memory wins. In Case 4, the record admits the event but reverses the aggressor ("you burned them"); Record wins. This clause saves you from having to say "Memory always wins against the state" or "Record always wins against Memory."
  *   **The Steelworkers (Case 2):** This case motivates the *limit* of your third draft idea (Adverse Possession). You verdicted that the Union must correct the record despite the identity cost. This suggests that public, civic bodies do not get the same leeway as families or liturgies.

  ### IV. Honest Critique: Where the Principle Breaks
  I prefer **Functional Epistemic Pluralism** because it captures the nuance of your verdicts better than Unitary Civic Truth. However, to make it coherent, I must overturn two of your verdicts.

  **1. I would overturn Case 5 (The Liturgy).**
  Your principle allows the prayer to say "Three Hundred" while the monument says "Eighty." This creates a sanctioned cognitive dissonance. If the "Assertoric/Commemorative" split is real, it must be legible. If the congregation understands the prayer as a prayer, it is fine. But if the prayer is understood as a recitation of history (which "Commemoration of the Three Hundred" implies), it violates Clause 1.
  *   *Why overturn?* Allowing the liturgy to assert a specific false number undermines the "Earned Authority" of the record in the very space where the community gathers to define itself. It turns Clause 2 into a loophole for falsehood. The liturgy should speak to the *sacrifice*, not the *count*.

  **2. I would overturn the "Adverse Possession" intuition in Case 2 (Steelworkers).**
  You mentioned wanting an adverse possession clause (memory held for 3 generations gains right). But your verdict in Case 2 contradicts this. The Union has told the story since 1977 (nearly two generations). You still say they owe a correction.
  *   *Why overturn?* Adverse possession implies that truth is time-dependent. If the Union must correct the record now, they would have had to correct it in 2020. Time does not cure factual error in public civic history. Adverse possession works for Case 6 (Family) only because of the *Private/Public* distinction (Clause 2), not because of *Time*. Relying on time creates a conflict with Case 2.

  **Verdicts the Rival (Unitary Civic Truth) Cannot Accommodate:**
  The Rival principle fails **Case 3 (K'iche')** and **Case 6 (Family)**.
  *   In Case 3, the "Best Evidence" is the land registry showing flight. The Rival would force the village to accept the "Tranquility" narrative or at best "Unexplained Flight," erasing the massacre. It cannot account for the *structural bias* of the archive.
  *   In Case 6, the Rival demands the family stop telling the story at dinner because it is factually false. This violates the intuition that private cohesion has a different moral weight than public history.

  ### V. Application to New Cases

  **1. A community wants to forget an atrocity the record insists on.**
  *   *Your Principle:* The Record governs the **Assertoric** (monuments, schools must acknowledge it). The Community governs the **Commemorative** (they are not forced to hold a day of mourning, provided they do not actively deny the fact).
  *   *Rival Principle:* The Record governs. The community must not only acknowledge it but is morally obligated to integrate it into their civic narrative to prevent recurrence. Forgetting is a form of lying.

  **2. A four-hundred-year-old memory with no living person affected either way.**
  *   *Your Principle:* **Adverse Possession** (if kept) would let the memory stand. Without it, **Clause 2** applies: if it is a local legend (commemorative), it stands. If it is taught as history (assertoric), it must yield to the record. Since no one is affected, the cost of correction is low, so the Record likely wins in schools, but Memory wins in folklore.
  *   *Rival Principle:* Record wins. Truth is not dependent on harm. If the evidence says X, we teach X, even if it is boring and the legend is Y.

  **3. A document of dubious provenance surfaces and appears to corroborate a memory.**
  *   *Your Principle:* **Clause 1 (Earned Authority)** fails. The document is not independent. The memory remains unproven but is not disproven. The status quo ante holds (Memory stands as memory, not fact).
  *   *Rival Principle:* The document enters the "Best Evidence" weigh-in. If it tips the scale, the memory becomes fact. If the provenance is dubious, it is weighted lightly, but the memory still has no independent authority.

  **4. Memory and record agree on the event but disagree about who struck the first blow.**
  *   *Your Principle:* **Clause 3 (Constitutive Silence)** does not apply; this is a dispute over **Agency**. Therefore, **Clause 1** governs. If the record is independent (e.g., a neutral third-party observer), the Record wins. If the record is from one of the combatants, the Record has not earned authority, and the Memory stands.
  *   *Rival Principle:* Best evidence wins. If the record is more reliable than the oral tradition, the record wins.

  ### VI. The Adverse Possession Analogy: Clarification vs. Damage

  **Where it Clarifies:**
  It clarifies **Case 6 (Family)**. It explains *why* we don't demand the family correct the story at dinner. There is a statute of limitations on truth-seeking in the private sphere. After three generations, the story becomes a "heirloom object" rather than a "historical claim." It protects the *function* of the story (bonding) from the *accuracy* of the story.

  **Where it Does Damage:**
  It damages **Case 2 (Steelworkers)**. If adverse possession applies, the Union should be allowed to keep the Kovac story. It is their identity. It has been held for 45 years. To say they must correct it is to say adverse possession does not apply to civic bodies.
  *   *The Problem:* If you limit adverse possession to "private families," you don't need the analogy of time/possession. You only need the **Public/Private distinction** (Clause 2).
  *   *Redundancy:* The Adverse Possession clause is doing no work that the **Functional Domain** clause is not already doing.
      *   In Case 5 (Liturgy), you allow the error because it is *liturgical* (Functional), not because it is *old* (Temporal).
      *   In Case 6 (Family), you allow the error because it is *private* (Functional), not because it is *old*.
      *   In Case 2 (Union), you disallow the error because it is *public/civic* (Functional), even though it is *old*.

  **Conclusion on Adverse Possession:**
  Drop it. It is a metaphor for the **Functional Domain** clause. It suggests that time confers right, but your own verdicts show that *context* confers right, not time. A lie told at a Sunday dinner for 100 years is permissible (Case 6); a lie told on a Union Hall wall for 40 years is not (Case 2). The difference is not the duration of the possession, but the public consequence of the claim. Keeping the analogy risks undermining Case 2.
