  **MEMORANDUM**

  **TO:** The University Senate
  **FROM:** The Constitutional Review Board
  **DATE:** October 24, 2023
  **SUBJECT:** Interpretive Guidance Regarding Charter Sections 4 and 7 (Procedural Crisis)

  ### I. Executive Summary

  The Constitutional Review Board has convened in emergency session to address the impasse regarding the proposed amendment to Section 7 of the University Charter. The central question is whether the Senate may lawfully invoke Section 4 (three-fourths vote of seated representatives) to repeal the unanimity requirement entrenched in Section 7 (unanimous consent of all past and present members).

  After rigorous deliberation, the Board recommends that the Senate **may not lawfully proceed under Section 4** for this specific amendment. Section 7 functions as a specific entrenchment clause that controls the general amendment power granted in Section 4. To allow Section 4 to override Section 7 would render the Charter's hierarchy of norms meaningless.

  However, recognizing the urgency of this crisis and the potential for the Senate to assert its sovereign authority regardless of this guidance, this memo outlines the procedural safeguards required to mitigate institutional damage should the Senate insist on voting under Section 4. It also details the strict compliance measures necessary should the Senate choose the lawful path under Section 7.

  ### II. Legal Analysis: The Conflict of Provisions

  **A. The Textual Hierarchy**
  Section 4 grants a general power of amendment: *"Amendments may be passed by a three-fourths vote of currently seated representatives."*
  Section 7 grants a specific constraint: *"Section 7 itself—and any rule governing amendment procedures—may only be altered by unanimous consent of every person who has ever held a seat."*

  The canon of construction *lex specialis derogat legi generali* (specific law overrides general law) applies here. Section 7 explicitly identifies "rules governing amendment procedures" (i.e., Section 4) as subject to its unanimity requirement. By signing the Charter, all members agreed that the rules of change are themselves protected by a higher threshold of consent.

  **B. The Implicit Supersession Argument**
  Proponents argue that the general power in Section 4 implicitly supersedes Section 7, positing that a current majority should not be held hostage by past members. While politically pragmatic, this argument lacks textual support. Had the Charter's drafters intended Section 4 to be the ultimate authority, Section 7 would not have explicitly included "any rule governing amendment procedures" within its lock. To read Section 4 as superseding Section 7 requires ignoring the explicit language of Section 7.

  ### III. The Strongest Objection: The Collapse of Meaning

  The Board must provide an honest account of the gravest risk associated with proceeding under Section 4. The opposition's contention is that allowing this maneuver is **self-nullifying**.

  If the Senate uses the procedure restricted by a rule (Section 4) to repeal the restriction itself (Section 7), it establishes a precedent that **no constitutional constraint is binding.** It creates a paradox where a lock can be picked by the very key it was designed to block. 

  If Section 7 can be bypassed by Section 4 today, then any future protection—tenure rights, academic freedom clauses, or governance structures—can be bypassed by a temporary three-fourths majority tomorrow. The Charter ceases to be a foundational law and becomes a mere statement of current preference. This renders the amendment framework arbitrary, as the rules of the game can be changed mid-play by the players currently on the field, excluding those who built the field. This erodes the trust of emeritus members and alumni, whose buy-in was secured by the promise of Section 7's permanence.

  ### IV. Recommendation and Procedural Safeguards

  **Primary Recommendation:**
  The Senate should initiate the amendment process under **Section 7**. This requires locating and securing consent from all living former members. While arduous, this is the only path that preserves the Charter's legal integrity.

  **Secondary Contingency (Should the Senate Proceed Under Section 4):**
  If the Senate determines it must proceed under Section 4 due to exigency, the Board cannot validate the vote as constitutionally sound. However, to preserve institutional legitimacy and minimize the risk of future litigation or schism, the following safeguards are **mandatory**:

  1.  **Full Disclosure of Risk:** Any motion brought under Section 4 must include a preamble explicitly acknowledging that the vote contravenes Section 7 and carries the risk of being declared *ultra vires* (beyond powers) by future boards or courts.
  2.  **Ratification Clause:** The amendment should be drafted to take effect *only if* it is subsequently ratified by a good-faith effort to contact emeritus members, or by a supermajority (e.g., 90%) of the current body, serving as a proxy for the missing unanimity.
  3.  **Sunset Provision:** The repeal of Section 7 should not be permanent. It should carry a sunset clause of two years, during which a new, mutually agreeable amendment process must be negotiated and passed under Section 7 standards.
  4.  **Emeritus Notification:** Even if their votes are not counted, all known emeritus members must be formally notified of the proposal and given a 30-day window to object on the record.

  ### V. Conclusion

  This crisis has become deeply personal for many of us, touching on tenure, legacy, and the future of our shared governance. We understand the frustration with a veto power held by those who have left the university. However, the rule of law requires that we honor the rules as written, not as we wish them to be.

  The Board advises that Section 4 is insufficient to amend Section 7. Proceeding otherwise risks fracturing the University's constitutional order. We urge the Senate to undertake the difficult work of seeking unanimity, thereby honoring the commitments made to every member who has served this institution.

  **Respectfully Submitted,**

  *The Constitutional Review Board*

  ***

  **Note from the Chair:** *In drafting this guidance, the Board recognizes the heavy burden this places on the current Senate. We do not offer this opinion lightly. We are aware that strict adherence to Section 7 may feel like an impediment to necessary reform. However, the stability of our governance depends on the belief that the Charter binds us all—past, present, and future. To break that chain for convenience is to weaken the foundation upon which we all stand.*
