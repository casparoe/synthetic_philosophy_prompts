answer: |-
  # Seminar Activity: The Reliability Relay

  ## Game Design & Rules

  **Objective:** Students must decide whether to wager poker chips on claims made by a reliable informant ("K"). The informant's reliability statistics are identical across all rounds; only the subject matter changes.

  **Materials:**
  *   **Poker Chips:** 20 per student (currency).
  *   **Betting Slips:** Index cards labeled "Bet 5 Chips: TRUE" / "Bet 5 Chips: FALSE" / "PASS".
  *   **Informant Dossier:** Three distinct cards per student, one for each round.
      *   *Card A (Calibration):* "Informant K. Claim Type: Physical State. Historical Accuracy: 90%."
      *   *Card B (Verdict):* "Informant K. Claim Type: Quality Verdict. Historical Accuracy: 90%."
      *   *Card C (Predictive):* "Informant K. Claim Type: Preference Prediction. Historical Accuracy: 90%."
  *   **Calibration Envelopes:** 3 large sealed envelopes containing simple objects (e.g., a red card, a blue card, a star shape).
  *   **Artwork Envelopes:** 2 large sealed envelopes containing high-quality prints of abstract artworks (Work Alpha, Work Beta).
  *   **Master Key Envelope:** Contains the "Official Verdict" (pre-determined by you based on critical consensus or arbitrary fiat for payoff purposes) and the "Preference Truth" (based on end-of-class poll).

  **Payoff Scheme:**
  *   **Bet:** Wager 5 chips.
  *   **Win:** Receive 10 chips (net +5).
  *   **Loss:** Lose 5 chips.
  *   **Pass:** Keep chips.
  *   *Note:* Emphasize that with 90% accuracy, betting is statistically "free money."

  **Constraints:**
  *   Do not use the words "aesthetic," "art," "testimony," "knowledge," or "justification" until the debrief.
  *   Use terms like "Evaluation," "Report," "Claim," "Verdict," and "Preference."
  *   No discussion between students during betting phases.

  ## Minute-by-Minute Timeline (75 Minutes)

  **00:00 – 00:05: Setup**
  Distribute chips and betting slips. Explain the payoff scheme. Introduce "Informant K" as a data source with verified track records. Emphasize silence during betting.

  **00:05 – 00:20: Calibration (Physical State)**
  1.  Distribute **Card A** (Physical State, 90% Accuracy).
  2.  **Live Verification:** Hold up Calibration Envelope 1. K claims: "Contains Red." Open envelope. It is Red. Repeat for Envelopes 2 and 3. K is 3/3 live.
  3.  **The Bet:** Hold up Calibration Envelope 4 (sealed). K claims: "Contains Blue."
  4.  Students submit betting slips.
  5.  **Reveal & Payoff:** Open Envelope 4. It is Blue. Pay winners immediately.
  6.  *Goal:* Establish that betting on K's 90% claims is rational and profitable.

  **00:20 – 00:35: Round 1 (Quality Verdict)**
  1.  Distribute **Card B** (Quality Verdict, 90% Accuracy). Place Work Alpha and Work Beta (sealed) on the table.
  2.  **The Claim:** K reports: "Work Alpha is better than Work Beta."
  3.  **The Bet:** Students wager on whether this claim is *true*. (Truth condition: Defined by the Master Key Envelope, representing expert consensus).
  4.  Students submit slips. Collect chips. **Do not reveal works yet.**
  5.  *Observation:* Note how many students PASS compared to Calibration.

  **00:35 – 00:50: Round 2 (Preference Prediction)**
  1.  Distribute **Card C** (Preference Prediction, 90% Accuracy). Works remain sealed.
  2.  **The Claim:** K reports: "You will prefer Work Alpha over Work Beta."
  3.  **The Bet:** Students wager on whether this claim is *true* (i.e., will match their own future reaction).
  4.  Students submit slips. Collect chips.
  5.  *Observation:* Note if betting increases compared to Round 1.

  **00:50 – 01:00: Reveal & Settlement**
  1.  Open Work Alpha and Work Beta. Display them.
  2.  **Settle Round 2 (Preference):** Ask for a show of hands: "Who prefers Alpha?" Compare to K's claim. Pay winners.
  3.  **Settle Round 1 (Verdict):** Open the Master Key Envelope. It reads: "Consensus Verdict: Alpha is Better." Pay winners.
  4.  Allow students to count chips.

  **01:00 – 01:15: Debrief**
  (See below).

  ## Debrief Guide

  **1. Map the Moments (10 mins)**
  *   **Calibration:** Ask, "Why did you bet here?" Expected answer: "The odds were good." Label this **Ordinary Testimony**. You treated K's word as a reason to believe a fact.
  *   **Round 1 (Verdict):** Ask, "The odds were identical (90%). Why did many pass?" Students will struggle. They may say, "It's subjective." Label this **Aesthetic Testimony Pessimism**. You hesitated to accept a verdict even with reliable assurance.
  *   **Round 2 (Predictive):** Ask, "Did anyone bet more here than in Round 1?" If yes, highlight the distinction. Label this **Psychological Prediction**. You trust K to predict your reaction more than to judge the object.
  *   **Recognition:** Ask, "Now that you see them, do you agree with K?" If yes, you have **Recognition** without prior **Understanding**.

  **2. Steelman the Optimist (5 mins)**
  Argue forcefully for the calibration data: "If K is 90% reliable on facts, and 90% reliable on verdicts, refusing the bet is irrational. You are ignoring evidence. If you trust a weather forecast (prediction), why not a critic's verdict (evaluation)? Both are reports on states of the world you cannot see." Force them to defend the hesitation as something other than reliability decay.

  **3. Troubleshooting Predictable Failures**
  *   **Failure A: Students bet heavily on Round 1.**
      *   *Cause:* They treat "Better" as a simple fact like "Red."
      *   *Fix:* In the debrief, press them: "If you bet 'True,' do you now *know* it's better, or just that you'll win chips?" Distinguish *believing the payout condition* from *believing the value*.
  *   **Failure B: Students pass on Round 2 (Predictive).**
      *   *Cause:* Global skepticism about K.
      *   *Fix:* Remind them of the Calibration. "K knew the card color. Why can't K know your taste?" This isolates the skepticism to the *object's value*, not the *informant's reliability*.
  *   **Failure C: Students demand to see the art before betting.**
      *   *Fix:* Remind them this violates the testimony condition. You are betting on K's word, not your perception.

  **4. Limitations (What the Game Cannot Do)**
  Be honest: "This game isolates *belief* and *betting*. It cannot reproduce the feeling of *understanding*. You might win the bet on Round 1, but you still don't know *why* Alpha is better. The pessimist argues that without the 'why,' you don't truly hold the belief as an aesthetic agent. I have to supply that normative gap in words; the chips only measure your wallet, not your appreciation."

  \answer{Identical verified reliability scores across factual and evaluative rounds.}
