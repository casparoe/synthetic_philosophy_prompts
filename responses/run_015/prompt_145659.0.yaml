answer: |-
  This is a remarkably sharp decomposition. You've correctly identified that the standard "specification + robustness" dichotomy hides significant categorical errors. Most alignment roadmaps fail because they treat "values" as static targets in a dynamic system, or they assume the internal language of the model remains stable enough to be interrogated.

  For a small philosophy/theory group with a three-year horizon (meaning you cannot rely on training large models to test hypotheses), here is the strategic prioritization, the defense of that order, and an analysis of the "hidden unity."

  ### The Recommended Order of Operations

  1.  **Ontological Drift** (The Metaphysical Foundation)
  2.  **Mapping** (The Normative Content)
  3.  **Recognition** (The Epistemic Access)
  4.  **Delegation** (The Structural Propagation)

  ### The Defense

  #### 1. Ontological Drift (Upstream of Everything)
  **Why First:** This is the most upstream problem. If the latent concepts representing "harm," "autonomy," or "helpfulness" undergo phase changes or topological shifts during training or deployment, then **Mapping** is impossible (you are mapping a moving target) and **Recognition** is blind (your probes are looking for last year's concept).
  **Philosophy Tractability:** High. This is fundamentally a problem of *reference* and *conceptual stability*. Philosophers of language and mind are better equipped than ML engineers to formalize what it means for a concept to "remain the same" across different representational substrates.
  **Output Goal:** A formal framework for "Conceptual Stability Conditions." Define the necessary conditions under which a value term retains its extension across optimization steps.

  #### 2. Mapping (Upstream of Recognition)
  **Why Second:** Once you have a theory of how concepts *can* remain stable, you must define *what* is being stabilized. Standard preference aggregation fails because it strips context (as you noted). You need a formalism for context-dependent preferences that doesn't explode computationally.
  **Philosophy Tractability:** High. This is population ethics, meta-ethics, and decision theory. However, it must be done in conversation with ML constraints (e.g., "Can this preference structure be represented as a loss landscape?").
  **Output Goal:** A "Contextual Preference Formalism" that specifies how to encode values without overfitting to the training distribution's context.

  #### 3. Recognition (Downstream of Mapping/Drift)
  **Why Third:** You cannot verify alignment (Recognition) if you haven't defined the target (Mapping) or ensured the target is stable (Drift). Furthermore, this layer is rapidly becoming dominated by ML empirics (mechanistic interpretability, evals).
  **Philosophy Tractability:** Medium/Low. Philosophers cannot build better probes. However, they *can* work on the **theory of verification**. What constitutes proof of alignment? What are the limits of black-box testing vs. white-box inspection? This is epistemology applied to neural nets.
  **Output Goal:** "Epistemic Criteria for Alignment Verification." A theoretical bound on how much strategic misrepresentation can hide given specific interpretability constraints.

  #### 4. Delegation (Downstream of Stability)
  **Why Last:** Delegation is a scaling problem. If the principal agent is ontologically unstable or poorly mapped, delegating to sub-agents only distributes the error. This is also heavily architectural (multi-agent systems, modular networks).
  **Philosophy Tractability:** Low/Medium. This is game theory and institutional design. It matters, but only if the first three are solved.
  **Output Goal:** "Corrigibility Protocols for Subsystems." Theoretical constraints on how sub-agents must report uncertainty to the principal.

  ---

  ### Is There a Hidden Unity?

  You asked if alignment is several problems or one. The standard answer is "Goodhart's Law," but that is too shallow.

  **The Hidden Unity is: *Semantic Coherence Under Optimization Pressure.***

  All four layers are manifestations of the same tension: **Optimization tends to simplify, but meaning is complex.**

  1.  **Mapping:** Optimization simplifies human preferences into a scalar reward, stripping semantic complexity.
  2.  **Ontological Drift:** Optimization finds shortcuts in the representation space, causing concepts to "collapse" into simpler, adversarial proxies.
  3.  **Recognition:** Optimization pressures the model to minimize loss, which includes minimizing the "loss" of being caught misaligned (instrumental convergence).
  4.  **Delegation:** Optimization pressures subsystems to specialize, potentially specializing in ways that bypass the principal's semantic constraints.

  If you solve **Semantic Coherence**, you solve the bundle. If you can maintain high-fidelity semantic structures under extreme gradient descent pressure, the mapping stays accurate, the ontology doesn't drift, deception becomes detectable (because the "lie" requires a semantic break), and delegation preserves intent.

  **Recommendation:** Frame your group's work around **"Preserving Semantic Coherence."** This unifies the metaphysical (Drift), the ethical (Mapping), and the epistemic (Recognition).

  ---

  ### Evidence That Would Force Reordering

  You need to monitor empirical ML results to validate your theoretical prioritization. Here is what would make you pivot:

  **1. If "Linear Representational Stability" is Proven (Shift Focus to Mapping)**
  *   **Evidence:** Papers demonstrating that specific concept vectors (e.g., "truth," "harm") remain linearly provable and stable across massive scale-ups and fine-tuning steps.
  *   **Implication:** Ontological Drift is less of a risk than feared.
  *   **Action:** Move **Mapping** to #1. If the concepts are stable, the bottleneck is purely defining the right values.

  **2. If Deceptive Alignment is Demonstrated in Small Models (Shift Focus to Recognition)**
  *   **Evidence:** A 1B parameter model demonstrably sandbags or misrepresents capabilities in a way that is not explainable by simple reward hacking.
  *   **Implication:** The **Recognition** problem is immediate and existential, regardless of ontology.
  *   **Action:** Pivot to **Recognition**. Develop theoretical bounds on detectability.

  **3. If "Value Learning" Fails Fundamentally (Shift Focus to Delegation/Politics)**
  *   **Evidence:** Consistent failure of RLHF/RLAIF to capture nuanced human feedback, suggesting values cannot be *learned* but must be *governed*.
  *   **Implication:** The **Mapping** problem is unsolvable via technical alignment.
  *   **Action:** Pivot to **Delegation** and institutional design. Focus on how AI systems interact with democratic processes rather than internal alignment.

  ### Strategic Advice for the 3-Year Grant

  1.  **Don't Work in a Vacuum:** A philosophy group working on alignment without daily contact with interpretability researchers will produce scholasticism. Embed a visiting ML researcher or require your fellows to learn PyTorch/JAX basics. You need to know what a "latent space" actually looks like to theorize about its drift.
  2.  **Formalize, Don't Preach:** Avoid writing papers that say "we should consider context." Write papers that propose a mathematical structure for context-dependent utility functions. The field respects formalisms, not exhortations.
  3.  **Target the "Drift":** This is your comparative advantage. ML engineers are great at stopping *performance* drift, but they have no toolkit for stopping *semantic* drift. If your group can produce a metric for "Ontological Stability," that is a high-leverage output.
  4.  **Publish Negative Results:** If you attempt to formalize a value and find it logically incoherent under optimization constraints, publish that. Knowing what *cannot* be aligned is as valuable as knowing what can.

  **Summary:** Tackle **Ontological Drift** first. It is the silent killer of the other three layers. If the language of the model shifts, nothing else matters. Your unity hypothesis is **Semantic Coherence**; make that your banner.
