answer: |-
  Your specification is incoherent at Clause 5. You demand higher-order knowledge asymmetry ("B knows something about A that A doesn't know B knows") while simultaneously requiring public visibility ("B has seen everything A has seen") under common knowledge of rationality. If A's outlays are public, A knows B knows them. I will drop the higher-order epistemic requirement and rely instead on **positional asymmetry** created by the sunk cost.

  **Scenario:** Two firms, A and B, litigate over a patent worth $100. Legal fees are $10 per round, paid by both parties regardless of outcome. A has already spent $80 (public record); B has spent $0. A moves next.

  **Payoffs & Rationality:**
  A's options: Quit (Payoff: -$80) or Bid $10.
  If A bids $10, B chooses: Quit (A gets $100 - $90 = +$10; B gets $0) or Bid $10 (War continues).
  A bids because +$10 > -$80. A is willing to spend up to $180 total ($100 prize + $80 sunk avoidance).
  B knows A's threshold is $180. B knows entering costs $10 initially but triggers a war where B must spend >$100 to win (since A won't quit until $180). B's expected value is negative. B stays out.
  **Clause 4 Check:** A's total position is -$80 (if quit) or potentially -$90 (if win). A wishes they never entered (0 > -80). A is digging into a hole, but digging is the least-bad option.

  **The Feature:**
  The single feature doing the work is the **Asymmetric Threat Point**. A's sunk cost raises A's reservation price for quitting, not because the cost is recoverable, but because it lowers the baseline comparison for the "Quit" option. B faces a standard entry decision; A faces a loss-minimization decision.

  **Objection & Reply:**
  *Objection:* "This cheats. It only works because B is watching. You smuggled in an audience, proving sunk costs only matter for reputation."
  *Reply:* B is not an audience; B is a player with direct payoff exposure. Reputation implies future benefits beyond this game. Here, B stays out solely because A's current payoff structure makes A a dangerous opponent *in this specific instance*. The sunk cost alters the current matrix, not future credibility.

  **Verdict:**
  This is solid for second-years. It distinguishes normative rationality (minimizing loss given current options) from psychological fallacy (chasing losses due to pain). It shows "ignore sunk costs" is crude shorthand for "ignore sunk costs *when calculating future value*," but acknowledge them *when calculating the value of quitting*. The expenditure itself doesn't matter; the position it creates does. Dropping Clause 5 saves the case from epistemic impossibility while preserving the lesson: sunk costs guide rational action by defining the trap, not by justifying it.
