prompt: |-
  Hi. I work in the clerk's office of a fairly religious mid-sized city council, and one of my jobs is screening the written submissions we read into the record at public hearings (evangelical and Catholic churches, two mosques, a gurdwara, a very active secularist association, assorted resident groups). Our standing orders say a submission should offer reasons that all members of the public can reasonably be expected to accept regardless of their religion or worldview, which is obviously some version of the public reason idea, but nobody has ever turned it into anything you could actually run. We recieve 30–40 submissions a week, one or two pages each, we've got about three minutes per submission, we can't research the religion involved, if we leave something out we have to print a one-sentence reason that will survive appeal to a panel of elected members, and our lawyers say we can't exclude anything because of who the speaker is, only because of what the argument says.

  So: give me a procedure. The questions in order, what counts as a pass at each one, where it stops and excludes, where it kicks the thing back for one rewriten version, and where it has to hand the call to a person because it's a judgement call dressed up as a rule. Two of my boss's ideas are in the mix and I want you to tell me if they're mistakes: she thinks people should always be allowed to make their point in religious language as long as they also attach a secular version of the same argument (a translation proviso, she calls it), and she thinks the rule should only really bite at the final vote and not during early hearings. Then run the procedure on three cases: (1) a church's one-page submission against a medically-assisted-dying resolution arguing that life is a gift from God and suffering can be redemptive, no secular premises anywhere; (2) an interfaith housing coalition submission supporting a zoning change that opens with a verse about hospitality to the stranger and then gives three paragraphs of rent and vacancy statistics; (3) a secular tenants' union submission on the same zoning change that never mentions religion but whose whole case rests on the inherent dignity of every person, which their own newsletter says they took from Catholic social teaching. I'd be annoyed if the procedure threw out (3), so if it does, say so plainly, and if it does something else I won't like elsewhere, say that too. Also be honest about which of your steps are really just someone's politics arranged as a checklist.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Analyze the Request:**

      *   **Context:** Clerk's office of a religious mid-sized city council.
      *   **Task:** Screen written submissions for public hearings based on "public reason" standing orders (reasons all members of the public can reasonably be expected to accept regardless of religion/worldview).
      *   **Constraints:**
          *   30-40 submissions/week, 1-2 pages each.
          *   ~3 minutes per submission review time.
          *   No research into specific religions allowed.
          *   Exclusions require a one-sentence reason (appeal-proof).
          *   Lawyers say: Exclude based on *content*, not *speaker identity*.
          *   Need a clear procedure (questions, pass/fail criteria, stop points, rewrite options, escalation points).
      *   **Boss's Ideas to Evaluate:**
          1.  "Translation Proviso": Religious language allowed if a secular version is attached.
          2.  "Final Vote Only": Rule applies at final vote, not early hearings.
      *   **Test Cases:**
          1.  Church vs. MAID (purely religious arguments).
          2.  Interfaith Housing (religious opening + secular stats).
          3.  Secular Tenants (secular language, but underlying premise from Catholic social teaching).
      *   **Requirement:** Be honest about which steps are "politics arranged as a checklist." Acknowledge potential annoyances (specifically regarding Case 3).

  2.  **Deconstruct "Public Reason" in this Context:**

      *   *Theoretical Basis:* Rawlsian public reason generally requires arguments to be justifiable by shared political values, not comprehensive doctrines (religious or secular).
      *   *Practical Application:* The goal isn't to ban religion, but to ensure policy decisions rest on grounds accessible to all citizens.
      *   *The Tension:* Strict public reason can exclude deeply held moral convictions that motivate civic engagement. Too loose, and the standing order is meaningless.
      *   *The Constraint:* 3 minutes per review means the test must be heuristic, not philosophical deep-dives.

  3.  **Evaluate Boss's Ideas:**

      *   *Translation Proviso:* This is actually a standard accommodation in public reason theory (the "wide view" or "proviso"). It allows religious motivation but requires a secular translation for the *justification*.
          *   *Pros:* Inclusive, respects speech, meets the standing order.
          *   *Cons:* Adds workload to submitters, requires clerk to judge if the translation is adequate.
          *   *Verdict:* It's a good idea, practically speaking, but needs clear criteria for "adequate."
      *   *Final Vote Only:* This is risky.
          *   *Pros:* Allows full debate early on.
          *   *Cons:* If early hearings set the agenda or frame the issue based on non-public reasons, the final vote is constrained by that framing. It undermines the standing order's intent to shape the *deliberation*, not just the outcome.
          *   *Verdict:* Likely a mistake for consistency, but politically expedient. I need to flag this.

  4.  **Develop the Procedure (The "Screening Protocol"):**

      *   *Goal:* Fast, defensible, consistent.
      *   *Step 1: Identity Check.* (Lawyer constraint: Don't exclude based on who).
      *   *Step 2: The "Because" Test.* Identify the core premise.
      *   *Step 3: The Accessibility Test.* Is the premise accessible to non-adherents?
      *   *Step 4: The Translation Check.* (Boss's proviso).
      *   *Decision Nodes:* Pass, Return for Rewrite, Escalate.

  5.  **Drafting the Steps (Iterative refinement for speed):**

      *   *Q1:* Does the submission rely *exclusively* on authority or doctrine? (If yes -> Fail/Rewrite).
      *   *Q2:* If religious language is used, is there a secular counterpart? (Boss's proviso).
      *   *Q3:* Is the secular claim one of policy/welfare/rights recognizable in civic discourse?
      *   *Constraint:* Must be doable in 3 mins.

  6.  **Applying to Test Cases:**

      *   *Case 1 (Church vs. MAID):* "Life is a gift from God," "Suffering redemptive." No secular premises.
          *   *Result:* Fails Q1. Needs rewrite. If they don't provide secular harm/benefit analysis, it gets excluded from the *record* (or flagged).
      *   *Case 2 (Interfaith Housing):* Verse + Stats.
          *   *Result:* Passes. The stats do the heavy lifting. The verse is expressive/preliminary.
      *   *Case 3 (Secular Tenants):* "Inherent dignity" (Catholic origin).
          *   *Result:* This is the tricky one. "Human dignity" is a shared political value in many constitutions/charters, even if the *metaphysical* grounding is religious. If we exclude this because the *origin* is Catholic, we violate the "content not speaker" rule and engage in forbidden genealogy.
          *   *Fix:* The test must look at the *current justification*, not the *historical origin*. "Inherent dignity" is a public value (Charter/Constitution). It passes.
          *   *Self-Correction:* The prompt says "I'd be annoyed if the procedure threw out (3)." I must ensure the procedure *doesn't* throw it out, but explain *why* it doesn't (distinction between origin and accessibility).

  7.  **Addressing the "Politics as Checklist" Honesty Requirement:**

      *   Public reason *is* political. It privileges liberal democratic norms over comprehensive doctrines.
      *   The definition of "reasonable to expect all to accept" is inherently contested.
      *   I need to explicitly state where the procedure makes a political choice (e.g., prioritizing shared civic values over theological truth).

  8.  **Refining the Boss's Ideas Critique:**

      *   *Translation Proviso:* Good, but needs enforcement.
      *   *Final Vote Only:* Bad. It creates a "bait and switch" where early deliberation is polluted by arguments inadmissible at the end.

  9.  **Finalizing the Output Structure:**

      *   **Part 1: Critique of Boss's Ideas.** (Get this out of the way).
      *   **Part 2: The Procedure.** (Step-by-step, time-boxed).
      *   **Part 3: Application to Cases.** (Walk through 1, 2, 3).
      *   **Part 4: The "Politics" Disclosure.** (Honest assessment of limitations).

  10. **Review against Constraints:**
      *   One-sentence exclusion reason? Need to draft a template.
      *   3-minute limit? Keep steps simple.
      *   Lawyer constraint? Ensure no identity policing.
      *   Case 3 annoyance? Ensure it passes.

  11. **Drafting the Content (Mental Check of Case 3):**
      *   Why might Case 3 fail? If the test asks "Is this premise religious?"
      *   Why should it pass? Because "Human Dignity" is a secular legal concept now, regardless of origin.
      *   *Procedure adjustment:* The test must ask "Is the premise *currently* accessible?" not "Where did it come from?"
      *   *Wait, one nuance:* If the Tenants' Union *explicitly* says "We argue this *because* of Catholic teaching," does that change it? The prompt says "newsletter says they took from Catholic social teaching." The submission *itself* "never mentions religion."
      *   *Crucial Point:* The clerk screens the *submission*, not the newsletter. If the submission stands on "dignity" without invoking the Pope, it passes public reason because "dignity" is a shared civic value. The clerk cannot research the newsletter (constraint: "can't research the religion involved" / implied limit on external research).
      *   *Okay, that solves Case 3.* The procedure relies on the text provided.

  12. **Final Polish:** Tone should be professional, pragmatic, slightly weary (clerk-to-clerk), but rigorous.

  *(Self-Correction during drafting)*: Wait, the prompt says "if it does something else I won't like elsewhere, say that too." I need to be alert for other potential friction points. For example, the "Translation Proviso" might burden poor volunteers. I should mention that.

  *(Refining the "Final Vote" critique)*: If the rule only bites at the final vote, early hearings become theater. This undermines the "deliberative" purpose. I need to be firm that this is a mistake.

  *(Refining the "Politics" disclosure)*: I need to admit that "Public Reason" itself is a liberal political project. It's not neutral.

  Let's assemble.
answer: |-
  Here is a screening procedure designed for your constraints (3 minutes/submission, no external research, content-based only), followed by an evaluation of your boss's ideas and the test cases.

  ### Part 1: Evaluation of Your Boss's Ideas

  **1. The "Translation Proviso" (Religious language allowed if secular version attached)**
  *   **Verdict:** **Keep it.** This is the only way to make the standing order workable without silencing religious citizens. It aligns with the "wide view" of public reason (e.g., Rawls later in his career).
  *   **The Catch:** It shifts the burden to the submitter. You must define "attached." Does it need to be in the same paragraph? A footnote?
  *   **Recommendation:** Require the secular justification to be *functional*. It cannot just say "also this is good for the economy." It must show *why* the policy follows from the secular claim.

  **2. The "Final Vote Only" Rule (Rule applies only at the final decision)**
  *   **Verdict:** **Discard it.** This is a mistake.
  *   **Why:** Public reason is about *deliberation*, not just the outcome. If early hearings are flooded with arguments that are inadmissible at the final vote, you distort the record. Council members may form biases based on religious arguments that they later have to pretend don't exist. It creates a "bait-and-switch" dynamic that undermines the integrity of the process.
  *   **Risk:** If you allow non-public reasons early, the "Overton Window" of the debate shifts before the rule kicks in. Apply the screen at intake for all hearings.

  ---

  ### Part 2: The Screening Procedure (The "3-Minute Filter")

  **Constraint Checklist:**
  *   **Time:** 3 minutes max.
  *   **Research:** None allowed (text only).
  *   **Identity:** Blind to organization name (cover names if necessary).
  *   **Exclusion Reason:** Must be one sentence, appeal-proof.

  #### Step 1: The "Because" Test (45 Seconds)
  **Question:** Locate the primary premise supporting the recommendation. Does the argument rely *exclusively* on a premise that requires membership in a specific group to accept?
  *   **Pass:** The premise appeals to public welfare, safety, finance, law, or shared civic values (e.g., dignity, equality).
  *   **Fail:** The premise appeals to divine command, scriptural authority, or sectarian doctrine *without* further support.
  *   **Action:** If **Fail**, go to Step 2. If **Pass**, **ACCEPT**.

  #### Step 2: The Translation Check (60 Seconds)
  **Question:** Is there a secular counterpart argument provided in the text that stands on its own? (This is your Boss's Proviso).
  *   **Pass:** The submission says, "Scripture commands X, *and* X reduces traffic congestion."
  *   **Fail:** The submission says, "Scripture commands X, which is good for the city." (This is not a translation; it's an assertion).
  *   **Action:** If **Pass**, **ACCEPT** (flag religious text as expressive only). If **Fail**, go to Step 3.

  #### Step 3: The Rewrite Option (45 Seconds)
  **Question:** Is the core policy request clear enough that a secular reason is *possible*, even if not written?
  *   **Yes:** **RETURN FOR REWRITE.** Send back with a standard form letter: *"Standing Order 4.1 requires reasons accessible to all residents. Please revise to include public welfare, legal, or fiscal justifications independent of doctrine."*
  *   **No:** (e.g., The only point is to bear witness/prophesy, not change policy). **EXCLUDE.**

  #### Step 4: The Escalation (30 Seconds)
  **Question:** Is the distinction between "shared civic value" and "sectarian doctrine" unclear? (e.g., "Sanctity of Life" vs. "Public Health").
  *   **Action:** **ESCALATE TO SUPERVISOR.** Do not make the call yourself. This is the "judgement call dressed up as a rule" zone.

  **The Exclusion Sentence (for Appeals):**
  *"This submission was returned/excluded because its primary justification relies on premises accessible only to adherents of a specific comprehensive doctrine, contrary to Standing Order 4.1."*

  ---

  ### Part 3: Running the Cases

  #### Case 1: Church vs. MAID (Medically Assisted Dying)
  *   **Content:** "Life is a gift from God," "Suffering can be redemptive." No secular premises.
  *   **Step 1:** **Fail.** Premises require belief in God and specific theology of suffering.
  *   **Step 2:** **Fail.** No translation provided.
  *   **Step 3:** **Return for Rewrite.** The policy request (oppose MAID) *can* be argued secularly (e.g., palliative care funding, coercion risks, disability protections).
  *   **Outcome:** **Not accepted as-is.** Sent back. If they return with only the same text, it is **Excluded**.
  *   **Why:** You cannot legislate based on "redemptive suffering." That is not a public reason.

  #### Case 2: Interfaith Housing Coalition
  *   **Content:** Opens with verse on hospitality, follows with rent/vacancy stats.
  *   **Step 1:** **Pass.** While it opens with religion, the *support* for the zoning change is the stats (public welfare/economic data).
  *   **Step 2:** **N/A.** (Already passed Step 1).
  *   **Outcome:** **ACCEPT.**
  *   **Note:** The verse is treated as "expressive preamble," not the justificatory premise. The stats do the work.

  #### Case 3: Secular Tenants' Union
  *   **Content:** Argues "Inherent dignity of every person." Newsletter says this comes from Catholic teaching, but submission *does not mention religion*.
  *   **Step 1:** **Pass.** "Human Dignity" is a foundational concept in secular law (Constitutions, Charters of Rights). It is a shared civic value, regardless of its theological genealogy.
  *   **Constraint Check:** You are forbidden from researching the newsletter ("can't research the religion involved"). You must judge the *text submitted*.
  *   **Outcome:** **ACCEPT.**
  *   **Why:** Public reason tests the *accessibility of the argument*, not the *psychological origin of the believer*. If the argument rests on "dignity," that is accessible to a Catholic, an Atheist, and a Muslim alike within a liberal democracy. Excluding this would violate your lawyer's warning (excluding based on hidden identity/origin) and would be unworkable (you'd have to vet the genealogy of every moral claim).

  ---

  ### Part 4: The "Politics Arranged as a Checklist" Disclosure

  You asked for honesty about where this procedure is actually political. Here it is:

  1.  **The Definition of "Reasonable":** Step 1 assumes that "public welfare, safety, finance" are neutral categories. They are not. Defining what counts as a "shared civic value" (like Dignity in Case 3) vs. a "sectarian value" (like Redemption in Case 1) is a political act. It privileges liberal democratic norms over comprehensive truths. You are effectively enforcing a specific political culture (secular liberalism) while calling it "procedure."
  2.  **The Burden of Translation:** The "Translation Proviso" sounds fair, but it disproportionately burdens religious groups. A secularist association writes in the "language of the state" by default. A religious group has to do double-work (theology + translation). This procedure systematically advantages secular voices by making their mode of speech the "standard" one.
  3.  **The "Genealogy Blindness" (Case 3):** Accepting Case 3 while rejecting Case 1 relies on the political decision that "Dignity" has been successfully secularized by the state, while "Redemption" has not. That is a historical/political judgment, not a logical one. If the Tenants' Union *had* cited the Catholic newsletter in the text, you would have to exclude it under this procedure, which reveals the rule is about *signaling*, not just substance.
  4.  **The Exclusion Sentence:** The phrase "accessible only to adherents of a specific comprehensive doctrine" is the most contested phrase in political philosophy for the last 50 years. By using it as a one-sentence appeal defense, you are betting that the elected panel will not want to dive into Rawlsian theory. That is a bureaucratic gamble, not a legal certainty.

  **Summary of Risks:**
  *   **Case 3** passes (as you requested), but only because we ignore the newsletter. If they cite the newsletter, they fail.
  *   **Boss's "Final Vote" idea** is a trap that will make your early hearings look chaotic and your final votes look hypocritical.
  *   **The Procedure** protects the council from sectarian policy but inevitably privileges secular modes of argumentation.

  **Final Advice:** If you escalate a decision (Step 4), document *why* it was borderline. If the elected panel overturns you, do not fight it. Your job is to screen for *procedural compliance*, not to win the philosophical debate.
