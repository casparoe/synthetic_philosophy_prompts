answer: |-
  1. Your argument conflates political liability, which attaches to citizenship, with moral guilt, which Jaspers strictly limits to individual conscience and action. By asserting nations possess moral guilt like individuals, you erase the essential boundary Jaspers drew between external legal-political responsibility and internal ethical accountability.

  2. Jaspers explicitly designates political guilt as the collective burden shared by all citizens for the deeds of their state, requiring reparations rather than personal penance. Criminal and moral guilt remain exclusively individual, while metaphysical guilt touches on human solidarity but still demands personal introspection.

  3. Moral guilt resists inheritance because it arises from specific failures of conscience and agency that cannot exist without personal capacity for choice. A successor generation lacks the existential condition of having witnessed or enabled the atrocity, making inherited moral culpability an impossibility in Jaspers's existentialist framework.

  4. Proponents of intergenerational acknowledgment might appeal to metaphysical guilt, which suggests a universal human solidarity that binds us to all injustices committed within our historical community. This allows for a sense of shared responsibility without conflating it with the specific moral culpability of the perpetrators.

  5. Successor generations should accept political liability for reparations and maintain a vigilant moral consciousness to prevent recurrence, but they must not claim a guilt that does not belong to them. Their duty is remembrance and ethical renewal rather than atonement for sins they did not commit.
