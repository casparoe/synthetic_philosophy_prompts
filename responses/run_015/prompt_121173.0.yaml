      *   **Metaphysical Guilt:** Solidarity among humans as humans; failure to prevent evil when possible. Collective in a broad human sense, but still rooted in individual conscience before God.
      *   **Key Distinction:** Political guilt is collective (citizenship); Moral guilt is strictly individual (conscience/action).
