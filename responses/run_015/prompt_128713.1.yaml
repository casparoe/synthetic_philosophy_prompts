          2.  **Parfit's Reductionism:** We don't need a persisting "self." We need psychological connectedness.
          3.  **McMahan's Time-Relative Interest:** This bridges the gap. It explains why we care more about an 80-year life than a 40-year life without needing a metaphysical ghost.
          4.  **Bioethics/QALY Pragmatism:** QALYs are utilitarian aggregates, not metaphysical claims about individual harm. They measure *state* value, not *subject* harm.
