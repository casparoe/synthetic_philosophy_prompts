      *   **User's Insight:** The user identifies a specific logical tension: If the "no-subject" condition holds for death, it should also hold for comparing an 80-year life vs. a 40-year life. In the 40-year scenario, the "missing" 40 years aren't missed by anyone (since the subject doesn't exist then). Therefore, valuing longevity might be a category error.
      *   **The Question:** Does Epicurean ontology *genuinely* undermine deprivation-based reasoning (forcing us to treat death and premature death as equally non-bad)? OR is there a hidden premise (perhaps about identity across counterfactuals) that saves comparative judgments without requiring a persisting subject?

