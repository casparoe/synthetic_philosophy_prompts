      *   **Constraints:** Commit to verdicts (no excessive hedging), rate each move (mistaken to right), determine an overall winner, address the user's specific unanswered question (motivation of searchers), and flag missing considerations (including the contingency of "no data").
      *   **Tone:** Professional, rigorous, yet accessible to a first-year PhD student in HPS.
