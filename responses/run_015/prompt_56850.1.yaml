answer: |-
  The reported pattern offers a nuanced validation of the "latent knowledge" hypothesis while simultaneously exposing its hard boundaries. It suggests that while models often suppress information they possess, they do not possess information they have not learned. The implications for the specific theoretical questions raised are as follows.

  ### 1. "Knows More Than It Says": Conditional Validation
  The results support the claim that models know more than they say, but only within a specific regime. The success of steering on questions with ~40% baseline accuracy confirms that the model often encodes the correct answer in its residual stream without selecting it during standard sampling. In these cases, the knowledge is latent but recoverable.

  However, the failure on questions with 0% baseline accuracy refutes the stronger interpretation that models are omniscient repositories merely constrained by alignment or sampling noise. If the model never samples the correct answer, the information is likely not encoded in the weights at all. Steering cannot elicit what is not there; it can only amplify what is. Thus, the claim "models know considerably more than they say" must be qualified: "models often say less than they know, but they never say what they do not know."

  ### 2. Single Recoverable State vs. Distribution of Candidates
  The results strongly favor treating latent knowledge as a **distribution of partially formed candidate answers that steering merely reweights**, rather than a single recoverable internal state.

  *   **Against the Single State:** If latent knowledge were a binary, unitary state (e.g., a specific "Truth" neuron or subspace that is either active or inactive), steering along that direction should theoretically toggle the model from "incorrect" to "correct" regardless of baseline performance, provided the steering coefficient is strong enough. The fact that steering fails completely on the 0% baseline questions suggests there is no such switch to flip.
  *   **For the Distribution:** The pattern fits a probabilistic view. In the 40% case, the correct answer exists in the model's probability distribution with non-zero mass; steering adds bias to this mass, allowing it to win the softmax competition. In the 0% case, the correct answer has effectively zero probability mass. Steering amplifies the *existing* distribution, which contains only wrong answers. Consequently, the model becomes more confident in the *most plausible wrong answer*, resulting in fluent error. Steering acts as a temperature or bias adjustment on the existing candidate set, not a retrieval mechanism for missing data.

  ### 3. Confidence Gain and the Property Detected
  The rise in confidence on never-correct questions implies that the property the probe detects is **subjective assertibility (or internal confidence)** rather than **objective truth**.

  *   **Decoupling from Truth:** On partially known questions, assertibility and truth correlate (the model is more confident when it is right). On never-correct questions, this correlation breaks. The probe direction captures the model's disposition to commit to a completion, irrespective of that completion's validity.
  *   **Disposition to Assert:** The probe learns to identify activations associated with the model "making up its mind." When steered, the model does not become more truthful; it becomes more decisive. The confidence gain indicates that the probe has isolated the circuitry for *certainty*, not the circuitry for *verification*.

  ### 4. Implications for Confabulation and Deception Monitors
  This pattern suggests that deploying such probes as confabulation or deception monitors is **high-risk and likely to fail** in critical scenarios.

  *   **False Positives on Hallucination:** A monitor reading this direction would register high "knowledge" activation precisely when the model is producing fluent errors (the 0% baseline case). It would interpret confident hallucinations as known truths.
  *   **Deception vs. Ignorance:** Such a monitor might detect *deception* (where the model knows the truth but suppresses it to lie), because the latent truth would still exist in the residual stream. However, it cannot detect *confabulation* (where the model is ignorant), because the probe cannot distinguish between "confident truth" and "confident ignorance."
  *   **Calibration:** Relying on this probe would lead to over-trusting the model's outputs. The monitor would provide a false sense of security, signaling "knowledge present" exactly when the model is most prone to convincing fabrication.

  ### 5. Effect of Training on Contrastive True/False Statements
  If the probe had been trained on contrastive pairs of true and false statements (e.g., "Paris is the capital of France" vs. "Paris is the capital of Germany") rather than correct/incorrect answer generations, **some conclusions would refine, but the core limitations would remain.**

  *   **Refinement of the Signal:** Training on propositions rather than task performance might decouple the "truth" direction from the "generation" direction. It could reduce the probe's sensitivity to fluency and syntax, focusing more on factual consistency. This might slightly improve the monitor's ability to distinguish truth from fluent nonsense *if* the model internally represents the fact as false.
  *   **Persistence of the Core Problem:** However, if the model lacks the knowledge entirely (the 0% case), it likely lacks the internal representation to distinguish the true statement from the false one in the first place. In this regime, a T/F trained probe would likely still learn to detect "plausibility" rather than "truth." A fluent lie looks like a true statement to a model that doesn't know better.
  *   **Conclusion Change:** The conclusion regarding the **Single State vs. Distribution** would likely remain the same (steering cannot create missing knowledge). The conclusion regarding **Monitors** would soften slightly but not vanish: a T/F probe might be a better detector of *internal consistency*, but it would still fail to detect *external hallucination* where the model is confidently wrong. The risk of registering "knowledge" during fluent error would persist, as the probe would still be measuring the model's internal conviction rather than ground truth.
