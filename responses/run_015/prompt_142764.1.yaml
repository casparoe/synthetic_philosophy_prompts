answer: |-
  Here is the translation of the three norms of assertion into the vernacular of cryptographic verification, followed by an analysis of the residue.

  ### 1. The Knowledge Norm
  **The Norm:** Assert $p$ only if you know $p$.
  **The Cryptographic Translation:** **Proof of Knowledge (PoK) with Extractability.**

  In this protocol, the assertor acts as the Prover and the audience as the Verifier. The statement $p$ is the public instance. To satisfy the norm, the assertor must demonstrate possession of a witness $w$ such that the relation $R(p, w)$ holds. Crucially, this maps to the property of **extractability**: there must exist a polynomial-time extractor that, given black-box access to the assertor's proving strategy, can recover the witness $w$ with non-negligible probability.

  *   **What translates cleanly:** The structural requirement of backing. Just as the Knowledge Norm demands you possess justification for your claim, PoK demands you possess the witness. The extractor formalises the intuition that if you can successfully assert (prove), you must 'have' the underlying grounds.
  *   **What has to be distorted:** Epistemic warrant is treated as data possession. In philosophy, justification is normative and often externalist; in crypto, the witness is a bit-string. Furthermore, PoK guarantees computational soundness, not necessarily factivity in the real world (if the Common Reference String is compromised, you can prove false statements).
  *   **What has no equivalent:** The **normative force**. Crypto tells us that a cheating prover *cannot* succeed (except with negligible probability); it does not tell us that they *ought not* to try. The 'ought' of assertion is moral or constitutive, whereas the 'cannot' of crypto is computational. Additionally, the qualitative state of 'knowing' is reduced to algorithmic capability.

  ### 2. The Truth Norm
  **The Norm:** Assert $p$ only if $p$ is true.
  **The Cryptographic Translation:** **Soundness within the Ideal/Real-World Paradigm.**

  Here, the assertion is modelled as an interaction with an Ideal Functionality $\mathcal{F}$. In the ideal world, a trusted party checks the truth value of $p$ against ground reality before allowing the assertion to proceed. The protocol is secure only if the view of the verifier in the real world is computationally indistinguishable from the view in the ideal world. If the statement is false, the Ideal Functionality aborts; therefore, a successful assertion implies truth.

  *   **What translates cleanly:** The binary constraint on content. Just as the Truth Norm forbids false assertions, cryptographic soundness ensures that no adversary can generate a valid proof for a false statement. The simulator ensures that no extra information about the truth value leaks beyond the validity itself.
  *   **What has to be distorted:** Truth is relativised to the system parameters. In crypto, 'truth' is consistency with the Common Reference String (CRS) or the public key infrastructure. It is coherence, not correspondence. A statement can be 'true' in the protocol (validly signed) but false in reality (e.g., a signed message claiming 'it is raining' when it is not).
  *   **What has no equivalent:** **Metaphysical Correspondence.** Cryptography verifies consistency within a formal model. It has no oracle for empirical reality. The Truth Norm requires the assertion to match the world; crypto requires the assertion to match the model. The gap between the model and the world is unbridgeable by verification protocols.

  ### 3. The Belief Norm
  **The Norm:** Assert $p$ only if you believe $p$.
  **The Cryptographic Translation:** **Authenticated Transmission (Digital Signature).**

  This norm concerns sincerity. The cryptographic analogue is binding the identity of the assertor to the proposition via a digital signature. The private key represents the agent's will. By signing the assertion, the agent cryptographically endorses the content, implying internal assent. Non-repudiation ensures the agent cannot later deny having held this stance at the time of assertion.

  *   **What translates cleanly:** The binding of agency to content. Just as the Belief Norm requires the assertion to emanate from the agent's doxastic state, a signature requires the assertion to emanate from the agent's private key. It establishes authorship and endorsement.
  *   **What has to be distorted:** The separation of key and mind. A signature proves control of a key, not control of a belief. One can sign under coercion, error, or irony. The crypto primitive assumes the key *is* the agent, whereas the Belief Norm distinguishes the agent from their outputs.
  *   **What has no equivalent:** **Phenomenology.** There is no cryptographic primitive for 'credence' or 'subjective assent'. A signature is binary (valid/invalid); belief is graded and qualitative. Crypto cannot distinguish between a sincere signer and a malicious actor holding a stolen key. The internal mental state is entirely opaque to the verification algorithm.

  ### The Residue and the Verdict

  The residue here is substantial. In every case, the cryptographic translation captures the **external behaviour** but misses the **internal status**.

  1.  **Normativity vs. Feasibility:** The philosophical norms are constitutive rules—they define what assertion *is*. Crypto provides feasibility constraints—it defines what assertion *can be verified*. The residue is the 'ought'. Crypto deals in 'can' and 'cannot'; philosophy deals in 'should' and 'should not'.
  2.  **Mind vs. Machine:** The Belief Norm fails most spectacularly because crypto has no model of mind. It treats the agent as a key store. The residue is the entire phenomenology of belief—the feeling of certainty, the degree of credence, the sincerity of the act.
  3.  **World vs. Model:** The Truth Norm fails because crypto is closed-system verification. It cannot step outside the protocol to check reality. The residue is the correspondence relation between language and the world.

  **Does this reveal a gap in the philosophical theories or show crypto is the wrong tool?**

  It shows that cryptography is the wrong tool for talking about speech acts.

  The philosophical theories of assertion are concerned with **normative status** and **mental content**. They ask what entitles you to speak and what state of mind legitimises the act. Cryptography is concerned with **computational integrity** and **information flow**. It asks whether a message was tampered with and whether the sender holds a secret.

  The residue does not indicate a gap in the philosophical theories; rather, it highlights a category error in the translation. You cannot formalise normativity into computability. A simulator can mimic the view of a verifier, but it cannot mimic the *authority* of a knower. The 'gap' is not in the definition of knowledge, truth, or belief, but in the attempt to reduce constitutive norms to verification protocols. Speech acts are not merely data transmissions to be validated; they are social moves that alter the deontic score of the conversation. Crypto can verify the packet, but it cannot verify the move.
