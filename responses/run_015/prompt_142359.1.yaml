prompt: |-
  hey — you're a professional philosopher, metaphysics and philosophical cosmology, and also the kind of person who's read way too much of the online discourse on this. i want the spec, not the answers, so please think carefully and do a quick brainstorm of candidate requirements before you commit to a final list.

  me and two friends have been going in circles in a group chat about why there is something rather than nothing for maybe six months now, and i finally noticed that we keep talking past each other because each of us wants something completely different out of an answer: one friend thinks it's basically settled by noting that an empty world is just one more possible world and there's no reason to privilege it, another thinks any answer that doesn't bottom out in something necessary is just a shrug with extra steps, and i suspect the question itself is malformed but can't say what would make it well formed. so before i read any more of the literature: write me the desiderata an answer to this question has to meet — what any adequate answer has to deliver, which cases or contrast classes it has to get right, which distinctions it must respect, which results from physics or modal logic it can't contradict — with the motivating consideration behind each requirement, and be explicit about which are non-negotiable and which are just prejudices of one camp. the purpose i want it adequate for is this: given any proposed answer i run into, i want to be able to tell whether it's actually answering the question or quietly changing the subject.

  some things i think have to be on the table somewhere, and i want you to sort them rather than just accept them: the scope/contrast-class issue (nothing concrete vs. nothing at all including abstracta vs. this rather than that, and what counting as nothing even means); whether causation can get any grip here at all given that causes need to exist, so whether an answer has to be non-causal in the grounding/modal sense and what entitles that to count as an explanation; whether the answer can be stated in a form that would still be available in an empty world, since if it's equally true there it doesn't discriminate; whether whatever principle the answer uses applies to itself or gets to stop, and whether stopping is a cost; whether an answer has to take a stand on the subtraction-style move of removing things one at a time and on whether an empty world is possible; whether the nothing is simpler intuition is a desideratum or a prejudice, given that zero is only one possible cardinality among infinitely many; whether the fact that nobody could have been around to observe an empty world does any real work or is just a selection-effect category error; and whether an answer that makes existence cheap — all consistent worlds exist, plenitude, that sort of thing — then owes us an account of why we aren't in a high-entropy mess instead of the tidy cosmos we seem to be in, plus whether an answer is allowed to have no observational consequences whatsoever. i also want you to flag any pair or subset of requirements that you think can't be jointly satisfied, because that's honestly the part i care most about, and to say which single requirement knocks out the most of the standard moves people make. skip the scorecard of who does well against the list, i'll do that part myself.
reasoning: |-
  Here's a thinking process that leads to the suggested desiderata:

  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher (metaphysics/cosmology), well-versed in online discourse.
      *   **Task:** Create a list of *desiderata* (requirements/criteria) for an adequate answer to "Why is there something rather than nothing?"
      *   **Constraint:** Do *not* give answers. Give the *spec* for evaluating answers.
      *   **Context:** The user and two friends are talking past each other (contingency vs. necessity vs. malformed question).
      *   **Specific Instructions:**
          *   Brainstorm candidate requirements first (internally), then commit to a final list.
          *   Sort/evaluate specific issues raised by the user (scope, causation, truth in empty worlds, self-application, subtraction, simplicity intuition, observation/selection effects, plenitude/entropy, observational consequences).
          *   Motivate each requirement.
          *   Mark requirements as Non-Negotiable vs. Camp Prejudice.
          *   Flag incompatible pairs/subsets of requirements.
          *   Identify the single requirement that knocks out the most standard moves.
          *   Skip the scorecard.

  2.  **Initial Brainstorming & Sorting (Internal Monologue):**
      *   *The Question:* "Why is there something rather than nothing?" (Leibnizian).
      *   *The Problem:* It's an explanatory demand that might exceed the bounds of sense.
      *   *User's Friends:*
          *   Friend A: Modal realism/probabilistic (empty world is just one option).
          *   Friend B: Necessitarian (needs a necessary ground).
          *   User: Suspicious of the question's formulation.
      *   *Key Issues to Address:*
          *   **Contrast Class:** Nothing concrete? Nothing abstract? Null set?
          *   **Causation:** Can nothing cause something? (Ex nihilo nihil fit). Needs grounding, not temporal cause.
          *   **Self-Application:** Does the explanation explain itself? (Principle of Sufficient Reason - PSR).
          *   **Subtraction:** Can we peel away entities until nothing remains? (Contingency of existence).
          *   **Simplicity:** Is nothing simpler than something? (Measure problem).
          *   **Observation:** Anthropic selection vs. brute fact.
          *   **Plenitude:** If everything exists, why this order? (Boltzmann brain problem).
      *   *Goal:* A filter to distinguish "answering the question" from "changing the subject."

  3.  **Drafting the Desiderata (Iterative Process):**

      *   *Candidate 1: The Contrast Class.* Must define "nothing." Is it the null set? A vacuum? No abstracta?
          *   *Decision:* Crucial. If you define "nothing" as "no concrete stuff," you answer a different question than "no abstract stuff."
          *   *Status:* Non-negotiable (semantic clarity).

      *   *Candidate 2: The Explanatory Mechanism.* Causal vs. Grounding.
          *   *Decision:* Causal is impossible (causes must exist). Must be ontological grounding or modal explanation.
          *   *Status:* Non-negotiable (logical coherence).

      *   *Candidate 3: The Empty World Test.* If the explanation is true in the empty world, it fails to explain why there isn't an empty world.
          *   *Decision:* This is the "Discrimination Requirement."
          *   *Status:* Non-negotiable (explanatory power).

      *   *Candidate 4: Self-Exemplification.* Does the principle explain its own existence?
          *   *Decision:* If it stops arbitrarily, it's brute. If it applies to itself, does it regress?
          *   *Status:* Camp Prejudice (PSR advocates vs. Brutalists).

      *   *Candidate 5: Subtraction/Possibility of Nothing.* Must take a stand on whether "nothing" was possible.
          *   *Decision:* If "nothing" is impossible, the question dissolves. If possible, why didn't it happen?
          *   *Status:* Non-negotiable (modal coherence).

      *   *Candidate 6: Simplicity/Measure.* Is nothing the default?
          *   *Decision:* This is a probabilistic intuition. Often contested (zero vs. infinity).
          *   *Status:* Camp Prejudice (Probabilists vs. Necessitarians).

      *   *Candidate 7: Plenitude/Entropy.* If all worlds exist, why this one?
          *   *Decision:* Relevant for Modal Realists.
          *   *Status:* Conditional (only if Plenitude is accepted).

      *   *Candidate 8: Observational Consequences.* Can the answer be empirically silent?
          *   *Decision:* Metaphysics often is, but cosmological answers should ideally link to physics.
          *   *Status:* Camp Prejudice (Empiricists vs. Rationalists).

  4.  **Refining and Structuring the Output:**
      *   Need to adopt the persona: Professional, slightly weary of online discourse, precise.
      *   Structure: Introduction -> The Spec (Categorized) -> Incompatibilities -> The "Kill Shot" Requirement.
      *   Tone: Analytic, rigorous, but conversational enough for a group chat context.

  5.  **Addressing Specific User Prompts:**
      *   *Scope/Contrast:* Addressed in Desideratum 1.
      *   *Causation:* Addressed in Desideratum 2.
      *   *True in Empty World:* Addressed in Desideratum 3.
      *   *Self-Application:* Addressed in Desideratum 4.
      *   *Subtraction:* Addressed in Desideratum 5.
      *   *Simplicity:* Addressed in Desideratum 6.
      *   *Observation/Selection:* Addressed in Desideratum 7.
      *   *Plenitude/Entropy:* Addressed in Desideratum 8.
      *   *Incompatibilities:* Need to highlight PSR vs. Brute Fact, and Necessity vs. Contingency.
      *   *Kill Shot:* The "Empty World Test" (Discrimination) is usually the hardest hurdle.

  6.  **Final Review against Constraints:**
      *   Did I give answers? No.
      *   Did I brainstorm first? (Will show this in the thought process, but the output is the final list).
      *   Did I mark Non-Negotiable vs. Prejudice? Yes.
      *   Did I flag incompatibilities? Yes.
      *   Did I identify the single biggest hurdle? Yes.

  7.  **Polishing the Content:**
      *   Make sure the distinction between *causal* and *ontological* explanation is sharp.
      *   Ensure the "Empty World Test" is phrased precisely (truth conditions).
      *   Clarify the "Simplicity" issue (zero vs. infinity).
      *   Ensure the "Plenitude" objection links to entropy/order.

      *(Self-Correction during drafting)*: I initially thought about making "Causal Impossibility" a non-negotiable. But some people argue for a "causal" God outside time. Better to frame it as "Non-Temporal Dependence" to be more precise. Actually, the prompt asks about causation getting grip. I should state that *temporal* causation is ruled out, but *grounding* is required.
      *(Refinement on the "Kill Shot")*: The "Empty World Test" is good, but the "Self-Application" (PSR) is also huge. However, the Empty World Test kills the "Laws of Physics explain it" move most effectively because laws usually exist in the empty world too (as abstracta). I'll stick with the Discrimination Requirement as the Kill Shot.

  8.  **Final Polish:** Check tone. "Hey — you're a professional philosopher..." -> Okay, I'll match that energy. Rigorous but direct.

      *(Wait, one more check)*: The user wants me to *think carefully and do a quick brainstorm of candidate requirements before I commit to a final list*. I should explicitly show that sorting process in the beginning or integrate it into the rationale. The prompt says "write me the desiderata... with the motivating consideration behind each requirement." I will structure the response to show the sorting logic within the descriptions.

      *Let's organize the Desiderata into: Semantic, Explanatory, and Modal.*

      *Incompatibilities:* PSR vs. Brute Fact is the big one. Also Necessity vs. Contingency.
      *Kill Shot:* The Discrimination Requirement (Why *this* rather than *that*?).

      *Okay, ready to write.*
answer: |-
  Here is the spec. I've sorted the issues you raised into three buckets: **Semantic Coherence** (what are we talking about?), **Explanatory Adequacy** (what counts as an answer?), and **Modal/Metaphysical Consistency** (what are the rules of the game?).

  I have marked each requirement as either **Non-Negotiable** (if you violate this, you are logically incoherent or talking past the question) or **Camp Prejudice** (this reflects a specific metaphysical commitment that one of your friends might reasonably reject).

  ### I. Semantic Coherence (The Setup)

  **1. The Contrast Class Specification**
  *   **The Requirement:** The answer must explicitly define the "nothing" it is contrasting with "something." Is it *null concrete reality* (no spacetime, no matter), *null absolute reality* (no abstracta, no numbers, no God), or *null contingency* (why this specific world rather than a different one)?
  *   **Motivation:** As you noted, "nothing" is ambiguous. If you answer "because the laws of physics demand energy," you have assumed abstract laws exist in the "nothing" state. If your friend meant "no abstracta either," you haven't answered their question.
  *   **Status:** **Non-Negotiable.** Without this, you are answering Question A while your friend is asking Question B.

  **2. The Subtraction Commitment**
  *   **The Requirement:** The answer must take a stand on the "Subtraction Argument": Is it possible to remove entities one by one until nothing remains? If not, why not? (i.e., Is there a metaphysical minimum?)
  *   **Motivation:** This addresses the intuition that "nothing" is the default state. If an answer assumes "nothing" is impossible (e.g., "existence is necessary"), it must justify why subtraction stops. If it assumes "nothing" is possible, it must explain why it didn't obtain.
  *   **Status:** **Non-Negotiable.** You cannot answer the question without stating whether the alternative (nothingness) was a live modal option.

  ### II. Explanatory Adequacy (The Engine)

  **3. The Non-Causal Grounding Constraint**
  *   **The Requirement:** The explanation cannot rely on *temporal* or *efficient* causation. It must rely on ontological grounding, logical entailment, or modal necessity.
  *   **Motivation:** Causes are events or entities that exist. If "nothing" obtained, there would be no causes. Therefore, a causal story presupposes the "something" it tries to explain. The explanation must be structural or constitutive, not historical.
  *   **Status:** **Non-Negotiable.** This is a category error filter. Any answer invoking a "first cause" in time is already smuggling in existence.

  **4. The Discrimination Requirement (The Empty World Test)**
  *   **The Requirement:** The explanatory principle must be true in the actual world (something) and *false* or *inoperative* in the empty world (nothing). If the explanation holds equally true in a world where nothing exists, it fails to explain why nothing doesn't exist.
  *   **Motivation:** This is the hardest hurdle. If you say "Because the Principle of Sufficient Reason (PSR) is true," the critic asks: "Is the PSR true in the empty world?" If yes, why didn't the PSR necessitate something *there*? If the explanation is compatible with nothingness, it doesn't explain somethingness.
  *   **Status:** **Non-Negotiable.** This is the primary tool for detecting "changing the subject."

  **5. The Self-Application Clause**
  *   **The Requirement:** The answer must state whether the explanatory principle applies to itself. (e.g., If "Necessity" explains existence, what explains Necessity?)
  *   **Motivation:** This addresses the "shrug with extra steps" complaint. If the explanation stops arbitrarily (e.g., "God just exists"), it is a brute fact. If it applies to itself, it risks circularity or infinite regress. The answer must own this cost.
  *   **Status:** **Camp Prejudice.** *Necessitarians* demand self-application (no brute facts). *Contingency Theorists* accept brute facts as the stopping point. You can't satisfy both.

  ### III. Modal & Metaphysical Consistency (The Boundaries)

  **6. The Simplicity/Measure Neutrality**
  *   **The Requirement:** The answer cannot assume "nothing" is simpler or more probable than "something" without justification. It must address the cardinality problem (zero is not inherently more natural than infinity).
  *   **Motivation:** Many answers rely on the intuition that "nothing is easier." But in set theory and physics, the null set is just one option among infinite plenitudes. An answer relying on "simplicity" must define its measure function.
  *   **Status:** **Camp Prejudice.** *Probabilists* think nothing is the default. *Necessitarians* think existence is the default. This is a metaphysical wager, not a logical rule.

  **7. The Plenitude/Entropy Check**
  *   **The Requirement:** If the answer relies on Plenitude (all possible worlds exist), it must account for the "Normality Problem": Why is our world low-entropy and orderly rather than a chaotic mess or a Boltzmann Brain simulation?
  *   **Motivation:** "Everything exists" answers the "why something" question easily, but fails the "why *this* something" question. If all worlds exist, the vast majority are chaotic. We need to know why we aren't in one of those.
  *   **Status:** **Conditional Non-Negotiable.** Only applies if the answer invokes Modal Realism/Plenitude.

  **8. The Observational Silence Waiver**
  *   **The Requirement:** The answer must declare if it has empirical consequences. If it has none, it must justify why it counts as metaphysics rather than theology or poetry.
  *   **Motivation:** Addresses the "malformed question" suspicion. If an answer changes nothing about how we expect the universe to behave, it might be a linguistic shuffle. However, pure metaphysics often lacks empirical bite.
  *   **Status:** **Camp Prejudice.** *Naturalists* demand empirical grip. *Rationalists* accept a priori metaphysics.

  ---

  ### Incompatibilities & Trade-offs

  You asked for pairs that cannot be jointly satisfied. Here are the main tension points in the spec above:

  1.  **The PSR Trilemma (Requirements 4 & 5):**
      *   You cannot satisfy **The Discrimination Requirement** AND **The Self-Application Clause** AND **Avoid Brute Facts**.
      *   *Why:* If your principle explains itself (Self-Application), it likely exists in the empty world too (violating Discrimination). If it doesn't exist in the empty world (satisfying Discrimination), then its existence in *this* world is brute (violating No Brute Facts). You have to pick two.

  2.  **Necessity vs. Contingency (Requirements 2 & 6):**
      *   You cannot hold that **Nothing was Possible (Subtraction)** AND **Existence is Necessary**.
      *   *Why:* If existence is necessary, the "empty world" is a contradiction, making the Subtraction Argument incoherent. If the empty world is possible, existence is contingent. Your friends are stuck here: Friend A assumes Contingency (empty world is an option), Friend B assumes Necessity (empty world is impossible).

  3.  **Plenitude vs. Order (Requirements 1 & 7):**
      *   You cannot define **Nothing as Null Absolute (Contrast Class)** AND accept **Plenitude**.
      *   *Why:* Plenitude asserts *everything* exists. This eliminates the "Null Absolute" option entirely. If you are a Modal Realist, the question "Why something rather than nothing?" is category-error because "nothing" (in the absolute sense) is not a possible world.

  ---

  ### The "Kill Shot" Requirement

  If you only check one thing to see if someone is changing the subject, use **Requirement 4: The Discrimination Requirement (The Empty World Test).**

  **Why:** This knocks out the most standard moves.
  *   **"The Laws of Physics":** Laws are abstract. They exist in the empty world. Why didn't they stay inert?
  *   **"God/Necessary Being":** If God is necessary, He exists in all worlds. Why did He create *this* one rather than none? (Moves the question back a step).
  *   **"Quantum Fluctuations":** The quantum vacuum is *something*. It fails the Contrast Class spec, but even if granted, the laws governing fluctuations exist in the empty world.
  *   **"It's Probable":** Probability spaces exist in the empty world. Why is there a probability space?

  Most answers provide a *generator* for something, but fail to explain why the generator itself isn't turned off in the null case. If the explanation works just as well in the void, it explains nothing.

  ### Summary for your Group Chat

  *   **Friend A (Contingency/Modal):** Needs to satisfy **Req 6 (Simplicity)**. Why is the empty world not the "easier" default?
  *   **Friend B (Necessity/Grounding):** Needs to satisfy **Req 4 (Discrimination)**. If the necessary ground exists in all worlds, what discriminates the "something" world from the "nothing" world? (Or they must argue the "nothing" world is impossible, satisfying **Req 2**).
  *   **You (Malformed Question):** Your leverage is **Req 1 (Contrast Class)**. If they can't define "nothing" without smuggling in "something" (like laws, logic, or potentials), the question is indeed malformed.

  Use this spec to intercept answers. If they violate a Non-Negotiable, they are incoherent. If they violate a Camp Prejudice, they are just arguing for a different metaphysical tribe than your interlocutor.
