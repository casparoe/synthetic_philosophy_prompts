answer: |-
  ### Session Plan: Rational Irrationality & Noisy Predictors

  #### 1. The Foundational Dependency: Policy vs. Action
  Before introducing the scenario, you must fix a single conceptual dependency: **the unit of optimization.** Your audience defaults to Causal Decision Theory (CDT), where rationality is maximizing utility over *actions* at time $t$. For this paradox to register, they must accept that rationality can mean maximizing utility over *policies* (or decision algorithms) at time $t_0$, even if that policy dictates a suboptimal *action* at time $t_1$.

  *   **How to build it:** Do not start with philosophy. Start with code. Present a simple pseudocode function `make_decision(context)`. Ask them to optimize the *function definition* versus optimizing the *return value* of a single function call.
  *   **The Fix:** Establish that in environments with predictors, the *source code* is the observable variable, not the specific output of a single execution. If they do not accept that their "disposition" is a inspectable parameter of the system, the rest is just magic.

  #### 2. The Carrying Example: "The Adversarial Handshake"
  Discard the desert. It introduces biological survival instincts and "promise-keeping" norms that confuse instrumental rationality with morality. Use a technical analogy that mirrors the causal structure without the baggage.

  *   **Scenario:** A researcher needs access to a high-value, rate-limited API (The Rescue). The server (The Driver) grants access tokens based on a heuristic scan of the user's past commit history and coding style (The Noisy Signal). This scan is not perfect (Noise); it assigns a probability of "Defector" vs. "Cooperator." If the probability of defection is too high, access is denied. If granted, the user consumes the compute (Benefit). Upon completion, the protocol requests a computational proof-of-work fee (The Payment).
  *   **Include:** The server's ability to *re-scan* or *update* its belief during the session. If the user's behavior during the session contradicts the initial "Cooperator" classification (e.g., attempting to bypass the fee), the server can revoke access mid-stream or blacklist the IP for future requests (even if this is a "one-shot," the blacklisting is an immediate consequence triggered by the updated signal).
  *   **Omit:** Any mention of reputation, future loans, or social standing. The blacklisting must be framed as an immediate, algorithmic penalty triggered by the signal update, not a "reputation" built over years.
  *   **Why the Desert Fails:** ML/Econ researchers will treat the desert driver as a black box with a fixed prior. They will argue, "Once I'm in the city, the driver's prediction is a sunk cost; he can't un-rescue me." The API scenario makes the *connection* between disposition and outcome structural and continuous, forcing them to confront the "updateable signal" constraint.

  #### 3. Sequencing & Misconception Interception
  Run the session in three distinct phases. Intercept misconceptions exactly where they arise.

  *   **Phase 1: The CDT Trap (0–15 mins)**
      *   *Setup:* Define the utility matrix. Access = +100, Fee = -10, Denied = 0.
      *   *Misconception:* **"Causal Dominance."** They will argue: "The server already granted access. My code is already running. Paying the fee now costs -10 and changes nothing about the +100 I already received."
      *   *Interception:* Stop them here. Remind them of the **Foundational Dependency**. Ask: "If your policy is 'Pay=False', would the initial scan have granted access?" Force them to acknowledge that the *policy* caused the access, even if the *action* (paying) feels causally disconnected at $t_1$.
  *   **Phase 2: The Noise & Update (15–30 mins)**
      *   *Setup:* Introduce the noise. The server is 90% accurate. It updates its belief based on your behavior *during* the session.
      *   *Misconception:* **"Newcomb Conflation."** They will say, "This is just Newcomb's Problem with extra steps."
      *   *Interception:* Clarify the difference. In Newcomb's, the money is already in the box. In this Handshake, the *connection* is live. The "updateable signal" means your current action provides *new evidence* that can trigger a penalty *now*. It sharpens the paradox because it removes the "metaphysical" comfort of fixed prediction; it makes the link empirical. You are not paying because Omega knew; you are paying because *not paying updates the predictor's belief to 'Hostile', triggering a revocation.*
  *   **Phase 3: Rational Irrationality (30–45 mins)**
      *   *Setup:* Discuss the cost of being the "type" that pays.
      *   *Misconception:* **"Time Consistency."** They will argue, "A rational agent shouldn't have preferences that flip from 'I want to be the type that pays' to 'I choose not to pay'."
      *   *Interception:* Reframe this. It is not a preference flip; it is a **gradient mismatch**. The global loss function (Policy) requires payment; the local gradient (Action) discourages it. "Rational Irrationality" means binding the local gradient to the global loss function, even when they conflict.

  #### 4. The Diagnostic Check
  Do not ask "Should you pay?" (They will guess the 'philosophically correct' answer). Test their grasp of the *dependency structure*.

  *   **The Scenario:** "Modify the API protocol. The server grants access based on the initial scan, but the 'Fee' is now optional and *never* triggers a re-scan or blacklisting. The server simply logs whether you paid. There are no future interactions. Do you pay?"
  *   **The Correct Response:** "No."
  *   **Why:** If they say "Yes," they have memorized the punchline ("One-boxing is good") but failed to understand the *mechanism*. They must recognize that without the logical or causal link (the updateable signal/consequence), the disposition no longer instruments the outcome. The payment is only rational *because* it validates the signal that secured the access. If the link is broken, the "irrational" cost becomes merely irrational.

  #### 5. What to Refuse to Develop
  **Exclude: Repeated Games / Reputation Models.**
  *   **Why:** Your audience will instinctively try to solve this using Iterated Prisoner's Dilemma logic ("I pay so I get access next time"). You must explicitly forbid this framing.
  *   **Reason:** Parfit's Hitchhiker (and this technical variant) is a **one-shot logical dependency**, not a reputational investment. If you allow them to model this as a repeated game, they will bypass the core philosophical tension. They will conclude payment is rational *instrumentally* (for future gain) rather than *structurally* (because the policy dictates the outcome). Leaving this out protects the core idea: that rationality can demand a cost *even when there is no future to protect*, provided the past access was conditional on the policy that incurs the cost.

  Verdict: The session succeeds only if you force them to optimize the source code before they are allowed to evaluate the function call.
