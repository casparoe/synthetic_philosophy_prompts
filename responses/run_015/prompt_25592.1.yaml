      *   *Step 3: The Split Self.* If I add "but I don't believe it," I revoke the invitation I just issued. I split myself into the "reporter of facts" and the "holder of beliefs."
      *   *Step 4: Connecting to User's Examples.* The angry person, the politician. This isn't just lying. It's a fracture in agency. They are trying to hold two incompatible stances toward the world.
