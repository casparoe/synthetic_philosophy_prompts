  So I had a long, slightly drunk argument with my friend last night — she's finishing a PhD in philosophy of mind, I do programming languages and distributed systems (day job: a verified compiler plus a raft implementation that's been haunting me for two years) — and I can't tell whether we were disagreeing about anything or just talking past each other in different jargons.

