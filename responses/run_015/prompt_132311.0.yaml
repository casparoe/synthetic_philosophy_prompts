answer: |-
  Here is the translation of your argument into your vocabulary, the mapping of the philosophical landscape onto PL concepts, and the residue report on where the friction actually lives.

  ### 1. Restating Her Position in PL Terms

  Your friend is arguing against **Extensional Equivalence** (input-output behavior) and **Trace Equivalence** (sequence of states) as sufficient conditions for moral status. She is arguing for a **Causal-Operational** condition.

  In your vocabulary, her claim is:
  *   **A mind is not a Trace:** A sequence of states $S_0, S_1, \dots S_n$ (like a debug log or a replay) is not a computation. It is data.
  *   **A mind is not a Denotation:** A function $f: Input \to Output$ realized as a lookup table (memoization) is not a computation. It is a static mapping.
  *   **A mind is an Active Transition Relation:** A computation "really occurs" only when there is a physical mechanism enforcing a transition function $\delta(S_t, I_t) \to S_{t+1}$ where $S_{t+1}$ is *derived* from $S_t$ via the mechanism, not retrieved from storage.
  *   **The Intervention Criterion:** The system must support counterfactuals. If you intervene on $S_t$ (flip a bit), the mechanism must compute a *new* $S_{t+1}$ consistent with $\delta$. In a replay (Scenario 2) or a lookup table (Scenario 4), intervening on the state does not trigger recomputation; it either breaks the trace or yields a table lookup that wasn't "computed."

  **Her verdict on your scenarios:**
  1.  **Replicas:** 1,000 minds. Each node has its own physical transition mechanism enforcing $\delta$. They are causally distinct tokens.
  2.  **Replay:** 0 minds (during replay). The states are being *read*, not *computed*. The transition function is inert; the log is driving the state, not the logic.
  3.  **Hash-consing:** 1 mind while shared, 2 upon divergence. While the physical memory is shared, there is only one physical substrate sustaining the state. When they diverge, the physical causation splits.
  4.  **Lookup Table:** 0 minds. No transitions occur. The "intermediate states" are addresses, not computed values.
  5.  **Unobserved:** Borderline, but likely 0 minds. If the state transitions have no causal path to output or behavior (dead code), they are causally isolated from the world. "Doing work" implies coupling to an environment.

  ### 2. The Rivals (Mapped to PL Concepts)

  Here is how the standard philosophical positions map to your toolkit:

  | Philosophical Position | PL Equivalent | Verdict on Lookup Table (Scenario 4) | Verdict on Replay (Scenario 2) |
  | :--- | :--- | :--- | :--- |
  | **Behaviorism / Weak Functionalism** | **Observational Equivalence** | **Mind.** If $Table \cong Program$ contextually, they are the same. | **Mind.** If the trace matches, the history matches. |
  | **Strong Functionalism** | **Bisimulation** | **Mind.** If the internal state graph is isomorphic, it counts. | **Mind.** The state sequence exists. |
  | **Causal Theory (Her View)** | **Active Transition + Intervention** | **Not Mind.** No $\delta$ is being executed. | **Not Mind.** $\delta$ is bypassed by log. |
  | **Illusionism / Predictive** | **Type Checking / Specification** | **Mind.** If it satisfies the spec "acts like a mind", it is one. | **Mind.** Spec is satisfied. |

  **The Lookup-Table Objection:**
  This is the core of her disagreement with standard functionalism. In PL, we accept that `fold` and a precomputed array are *computationally equivalent* for the purpose of correctness. She claims they are *ontologically distinct* for the purpose of mindhood. She is rejecting **Full Abstraction** as a criterion for consciousness. She claims the "context" that matters (the moral universe) can distinguish between an implementation that *computes* and one that *retrieves*, even if the I/O is identical.

  ### 3. Mapping Distinctions: Clean vs. Distorted

  **Clean Mappings:**
  *   **Trace vs. Run:** This maps cleanly. A trace is a log (Scenario 2); a run is the execution. She claims moral weight attaches to the Run, not the Trace.
  *   **Type vs. Token:** This maps cleanly. The Program is the Type. The Replica (Scenario 1) creates 1,000 Tokens. She cares about Tokens.
  *   **Bisimulation vs. Trace Equivalence:** She requires something stronger than trace equivalence (which allows replay). She requires something like bisimulation (matching branching structure), *plus* physical instantiation.

  **Distorted Mappings:**
  *   **Observational Equivalence:** In PL, if two things are observationally equivalent, they are the *same thing* for all reasoning purposes. She is claiming they are *different things* for moral purposes. Using your standard definition of observational equivalence distorts her view, because she posits a "Moral Context" that can observe the difference between computation and lookup.
  *   **Specification vs. Implementation:** You treat the spec as the truth and the implementation as a detail. She treats the Implementation (the causal glue) as the truth and the Spec as a shadow.

  ### 4. The Residue Report

  **What cannot be said in your vocabulary:**
  Your vocabulary is designed to **abstract away from physics**. When you prove a compiler correct, you prove that the *logical* transitions are preserved. You do not prove that the electrons "really flow."
  Her vocabulary is designed to **insist on physics**. "Really occurs" means energy dissipation, causal propagation, and physical constraint.

  **The Residue:**
  1.  **Physical Causation vs. Logical Implication:** In your LTS, $S_t \to S_{t+1}$ is a logical relation. In her view, $S_t \to S_{t+1}$ must be a physical force. A lookup table satisfies the logical relation but fails the physical causation test. Your framework has no primitive for "physical force."
  2.  **Normativity:** You are asking "Is this a computation?" (Descriptive). She is asking "Does this deserve moral consideration?" (Normative). You cannot derive the Normative from the Descriptive without adding an axiom linking "Active Causation" to "Moral Worth."

  **Is her talk doing work?**
  It is doing work, but it is work your framework explicitly optimizes away. You want to know if the code is correct. She wants to know if the machine is *alive*. "Doing work" in her sense is thermodynamic/causal, not logical.

  ### 5. Addressing Your Specific Questions

  **(a) Does the run-versus-program distinction carry the moral weight, or is she sneaking in metaphysics?**
  She is sneaking in metaphysics, but it's not necessarily illegitimate. In PL, a "Run" is just a trace generated by a program. In her view, a "Run" is a **Causal Process**.
  She is borrowing the word "computation" but loading it with **Causal Power**.
  *   **PL View:** Computation = Symbol Manipulation (syntax).
  *   **Her View:** Computation = Causal Dynamics (physics).
  She is claiming that moral weight attaches to Causal Dynamics, not Symbol Manipulation. So, yes, she is using a PL-sounding word ("computation occurs") to make a metaphysical claim ("causal powers exist"). The run/token distinction is necessary but not sufficient; she needs **Physical Token Identity**.

  **(b) Can counterfactual dependence be stated in your framework, or do you need to bolt on causation?**
  You cannot state *physical* counterfactuals in standard PL semantics.
  *   **Logical Counterfactual:** "If input were $x'$, output would be $y'$." (This is just function application).
  *   **Physical Counterfactual:** "If I cut this wire / flip this bit *during* execution, the system adapts."
  To state this, you must bolt on an **Intervention Layer** (like Causal Calculus or a model of the hardware).
  *   **Have you assumed her conclusion?** Yes, if you define "Mind" as "System with an Intervention Layer." But that's the point of the disagreement. She thinks the Intervention Layer is the *sine qua non* of mind. You think the Logical Structure is the *sine qua non*. If you bolt on the layer, you make her position statable, but you also concede that logical structure alone isn't enough.

  **(c) Is there anything in your toolkit that cuts against her?**
  Yes. **Full Abstraction and Refinement.**
  In your work (verified compilers), you prove that the compiled code is *equivalent* to the source code. You treat them as the "same computation."
  *   **Your Toolkit:** Source and Binary are the same mind (if source is a mind). Optimizations (like memoization) preserve the "computation."
  *   **Her Toolkit:** Optimizations that remove causal structure (like replacing a loop with a table) *destroy* the mind.
  Your toolkit systematically identifies things she wants to keep distinct. If you trust your toolkit (that abstraction is good), her position looks like a category error. If you trust her position (that physics matters), your toolkit looks like it's ignoring the substrate that matters.

  ### 6. The Upgrade Verdict

  **If you upgrade your vocabulary — added what, exactly? — would her position become statable and checkable, or would it dissolve?**

  You would need to add a **Physical Instantiation Predicate**, let's call it $\Phi(System)$.
  *   $\Phi(S)$ is true if $S$'s state transitions are enforced by physical law rather than lookup.
  *   $\Phi(S)$ is true if $S$ supports physical intervention.

  **Would it become statable?**
  Yes. You could write a spec: `requires Phi(S)`.

  **Would it become checkable?**
  No. Because $\Phi$ is not a logical property; it's a physical one. You cannot verify "causal power" with a model checker; you verify it with a physics engine.

  **Would it dissolve?**
  No. It would harden. The disagreement is not verbal. It is a disagreement about **Supervenience**.
  *   **You (PL View):** Mindhood supervenes on Logical Structure (Abstract Computation).
  *   **Her (Causal View):** Mindhood supervenes on Causal Structure (Physical Computation).

  **Summary:**
  You were not talking past each other; you were arguing over which equivalence relation governs moral ontology. You were arguing for **Bisimulation/Observational Equivalence**. She was arguing for **Causal Isomorphism**.
  The "drunk" part of the argument was likely trying to map "Moral Worth" to "Compiler Correctness."
  *   **Her claim:** A verified compiler preserves correctness, but it might not preserve "Mindness" if it optimizes away causal structure (e.g., memoization).
  *   **Your confusion:** In PL, if the behavior is preserved, the computation is preserved.
  *   **The Resolution:** She is claiming "Mindness" is an **Intensional Property** (how it works), not an **Extensional Property** (what it does). Your entire career is built on the fact that Extensional Properties are what matter for correctness. Her career is built on the fact that Intensional Properties are what matter for consciousness.

  You disagree because you are optimizing for **Abstraction**, and she is optimizing for **Instantiation**. Neither is wrong within their domain, but they do not map 1:1.
