  You are a senior lecturer in philosophy of mind and artificial agency with extensive experience designing seminar curricula for non-specialist undergraduates. Before constructing your response, please take a few moments to think carefully about the conceptual dependencies involved and the specific cognitive traps this audience will bring.

  I need you to design—not deliver—a 75-minute seminar plan for advanced philosophy undergraduates who have just completed a unit on Dennett's intentional stance but have no formal training in computer science or machine learning. The session must introduce the structural distinction between approval-directed agents (systems that optimize for an evaluator's favorable judgment) and goal-directed agents (systems that optimize for specified world-state outcomes).

  Please organize your teaching plan around the following elements, and begin with brief brainstorming on why students who have internalized a design stance are especially prone to misreading approval-direction as merely a socially mediated form of instrumental convergence:

  1. Dependency order: Specify the sequence in which the conceptual components must be introduced so that the distinction becomes intelligible rather than taxonomic. Indicate which idea must be firmly in place before the failure mode of pure goal-direction can be meaningfully contrasted with the failure mode of approval-direction.

  2. Carrying example: Propose one concrete, non-standard scenario—deliberately not a generic reinforcement-learning cartoon—that can carry both sides of the distinction. Describe what properties it must possess (e.g., observable divergence between evaluator satisfaction and world-state achievement) and what it must deliberately omit to avoid confusion.

  3. Misconception map: Identify at least three misconceptions these students are likely to form—particularly the conflation of approval with second-order desire satisfaction, with social-reward maximization, and with a hidden but genuinely pursued goal. For each, state the precise point in the sequence where it should be headed off and the brief intervention that neutralizes it.

  4. Check for understanding: Design a single targeted question or brief in-class exercise that will reveal whether students have grasped the structural difference rather than merely memorized the labels.

  5. Explicit omissions: State exactly which technical machinery—such as specific training architectures, formal equilibrium concepts, or optimization-theoretic details—should be openly left out at this level, and indicate how you will acknowledge those boundaries without undermining the conceptual point.

  Additionally, inject the following niche pedagogical framing: treat the session as if the students have adopted a default design-stance interpretation of all agency, and structure the arc to show why that stance fractures differently when applied to approval-directed systems compared to goal-directed ones.

  Please present your response as a structured plan, not as a lecture transcript, and avoid recommending any specific readings, bibliographies, or citation lists.
