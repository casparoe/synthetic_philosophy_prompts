  Agent 2: "So I don't know if I'm risk-averse."
  Agent 1: "True."
  Agent 2: "So I can't confirm Maximin is the rational choice for me."
  Agent 1: "..."
  Agent 2: "To justify Maximin, I need to know my risk tolerance."
  Agent 1: "Yes."
  Agent 2: "Which is behind the Veil."
  Agent 1: "Yes."
  Agent 2: "So I have to lift the Veil to justify staying behind it."
  Agent 1: "Please don't. Let's just stipulate that you are risk-averse."
  Agent 2: "So the Veil hides my class, my talents, and my conception of the good..."
  Agent 1: "Yes."
