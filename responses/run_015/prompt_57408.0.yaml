answer: |-
  # THE GREAT DIVERGENCE DECISION TREE
  **Goal:** Sort interrogatives by logical form, not causal content. **Rule:** If you cannot answer the node question by examining your own sentence structure, you are not ready for this tree.

  ### **ROOT: What is the primary variable in your "Why Britain not China?"**
  1.  **LOCATION** (Why *here* and not *there*?) → Go to **Node A**
  2.  **TIMING** (Why *then* and not *earlier/later*?) → Go to **Node B**
  3.  **EXISTENCE** (Why growth *anywhere* and not *nowhere*?) → Go to **Node C**
  4.  **FORM** (Why *industrial* growth and not *Smithian*?) → Go to **Node D**
      *(Justification: "Britain not China" often隐含 a specific type of growth, not just GDP rise.)*

  ---

  ### **NODE A (Location): Are the units homogeneous?**
  *   **YES** (Britain vs. Yangzi Delta) → Go to **Node E**
  *   **NO** (Britain vs. China Proper) → Go to **Node F**

  ### **NODE E (Homogeneous): Is the counterfactual truth-apt?**
  *   **YES** (Closest world is clear) → **Leaf 1**
  *   **NO** (World too distant/contingent) → **Leaf 2**
  *   **SHORT ANTECEDENT ONLY** (Sensitive to initial conditions) → **Leaf 3**

  ### **NODE F (Heterogeneous): Is the comparison a category error?**
  *   **YES** (State vs. Continent) → **Leaf 4**
  *   **NO** (Polities are comparable units) → **Leaf 5**

  ### **NODE B (Timing): What is the temporal foil?**
  *   **EARLIER** (Why not Song/Ming?) → **Leaf 6**
  *   **LATER** (Why not 19th C?) → **Leaf 7**
  *   **NEVER** (Why not eternal stagnation?) → **Leaf 8**

  ### **NODE C (Existence): Is the cause single or bundled?**
  *   **SINGLE** (One necessary factor) → **Leaf 9**
  *   **BUNDLE** (Jointly necessary conditions) → Go to **Node G**

  ### **NODE G (Bundle): Are conditions separable?**
  *   **YES** (Can isolate variables) → **Leaf 10**
  *   **NO** (Configurational/Holistic) → **Leaf 11**

  ### **NODE D (Form): Is form distinct from fact?**
  *   **YES** (Industrialism is unique) → **Leaf 12**
  *   **NO** (Growth is growth) → **Leaf 13**

  ---

  ### **THE LEAVES**

  | # | Position Name | Awkward Commitment | Foil Sensitivity (Yangzi / China / Eurasia) | Occupancy |
  | :--- | :--- | :--- | :--- | :--- |
  | **1** | **Deterministic Regionalism** | China was on the exact same knife-edge as Britain. | **Survives All** (Units match, CF holds) | **Live** (Pomeranz-adjacent) |
  | **2** | **Contingent Convergence** | History has no direction; divergence was a roll of the dice. | **Survives Yangzi**; Dies China/Eurasia (CF fails) | **Live** (Unnamed) |
  | **3** | **Fragile Equilibrium** | Small nudges matter, big structural ones don't. | **Survives Yangzi**; Dies China/Eurasia (CF too distant) | **Live** (Unnamed) |
  | **4** | **Scale Mismatch Diagnosis** | You are comparing apples to continents. | **Dies Immediately** (Question malformed) | **Live** (Methodological) |
  | **5** | **Aggregated Polity View** | China acts as a unitary agent despite internal variance. | **Survives China**; Dies Yangzi (Units mismatch) | **Empty** (Unattractive/False) |
  | **6** | **Premature Industrialization** | The Song Dynasty should have succeeded technologically. | **Dies Immediately** (Location foils irrelevant) | **Live** (Elvin-adjacent) |
  | **7** | **Delayed Takeoff** | China was ready; something specific stopped it later. | **Dies Immediately** (Location foils irrelevant) | **Live** (Unnamed) |
  | **8** | **Explanandum Drift** | You are asking "Why Existence" but calling it "Timing". | **Survives All** (But question has shifted) | **Empty** (Redundant) |
  | **9** | **Silver Bullet Hunt** | One factor (e.g., coal) explains the whole divergence. | **Survives All** (If factor is universal) | **Empty** (Unattractive/False) |
  | **10** | **Additive Holism** | Causes sum linearly; we can weight them individually. | **Survives All** (Bundle is universal) | **Live** (Unnamed) |
  | **11** | **Configurational Holism** | Causes only work together; isolating them breaks them. | **Survives All** (Bundle is universal) | **Live** (Unnamed) |
  | **12** | **Path Specificity** | Only coal-intensive growth counts as "Industrial". | **Survives All** (Form is universal) | **Live** (Unnamed) |
  | **13** | **Growth Universalism** | All sustained growth is the same kind of event. | **Survives All** (Form is universal) | **Live** (Unnamed) |

  ---

  ### **⚠️ INDISTINGUISHABLE LEAVES**
  **Leaf 11 (Configurational Holism)** and **Leaf 13 (Growth Universalism)** cannot be separated by this tree. Both imply that isolating variables or locations destroys the phenomenon. If you land here, you must choose based on whether you care about *causes* (11) or *definitions* (13).

  ### **SEMINAR VIGNETTES**

  1.  **The Institutionalist:** "If Britain hadn't had secure property rights, would China have industrialized by 1850?"
      *   *Tree Path:* Location → Homogeneous → Counterfactual Yes.
      *   *Lands on:* **Leaf 1 (Deterministic Regionalism).**
      *   *Diagnosis:* Committed to China being one institutional tweak away from Manchester.

  2.  **The Sinologist:** "Why didn't the Song Dynasty develop steam engines when they had the iron output?"
      *   *Tree Path:* Timing → Earlier.
      *   *Lands on:* **Leaf 6 (Premature Industrialization).**
      *   *Diagnosis:* Foil sensitivity test fails on location; this is a timing question disguised as a location one.

  3.  **The Skeptic:** "You can't just say 'coal mattered' because coal only matters alongside colonies and wages."
      *   *Tree Path:* Existence → Bundle → Separable? No.
      *   *Lands on:* **Leaf 11 (Configurational Holism).**
      *   *Diagnosis:* Cannot answer "Why Britain not China" without answering "Why this bundle not that bundle."

  ---
  *Print me. Bring me. Stop circling.*
