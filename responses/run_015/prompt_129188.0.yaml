answer: |-
  # Lesson Plan: The Resilience Allocation Protocol
  **Course:** Decision Theory / Philosophy of Economics  
  **Level:** Upper-Level Undergraduate or Graduate  
  **Time:** 60 Minutes  
  **Participants:** 12 Students  

  ## Learning Objectives
  1.  **Experiential:** Students will viscerally experience the tension between the *Certainty Effect* and *Expected Utility* maximization.
  2.  **Analytical:** Students will identify the structural identity between two seemingly distinct choice problems.
  3.  **Theoretical:** Students will define the Independence Axiom and understand the descriptive vs. normative distinction in the Allais Paradox.

  ## Materials
  *   **Choice Packets:** 12 envelopes, each containing two anonymous choice cards (Card A for Round 1, Card B for Round 2) and a private ID number.
  *   **The "Systemic Shock" Urn:** A transparent container with 100 numbered ping-pong balls (or a digital randomizer projected on screen).
  *   **Whiteboard:** For aggregating results and mapping equations.
  *   **Payoff Ledger:** To track points.

  ---

  ## Phase 1: Framing & Round 1 (0:00–0:15)

  **1. The Scenario (5 mins)**
  *   **Facilitator Script:** "You are regional governors allocating resilience funding. Your goal is to maximize 'Stability Points' for your constituency. These points convert to course bonus credit at the end of the session. You will make two allocation decisions. These decisions are private. Do not discuss your choices with neighbors."
  *   **Distribute Packets:** Hand out envelopes. Instruct students to write their Private ID on both cards but *not* their names.

  **2. Round 1: The Guarantee vs. The Growth (5 mins)**
  *   **Display Slide/Board:**
      *   **Option S (Stability):** 50 Points **Guaranteed**.
      *   **Option G (Growth):**
          *   200 Points (10% chance)
          *   50 Points (89% chance)
          *   0 Points (1% chance)
  *   **Instruction:** "Mark your choice on **Card A**. Place it back in the envelope. Seal it."
  *   *(Design Note: Probabilities adjusted from prompt to 10%/89%/1% to ensure mathematical validity of the Common Consequence Effect.)*

  **3. Round 2: The Systemic Shock Layer (5 mins)**
  *   **Facilitator Script:** "We are now simulating a 'Systemic Shock.' The baseline funding layer has been stripped away. You are now choosing between residual portfolios. The outcomes depend on a single hidden state draw that will occur *after* all choices are locked."
  *   **Display Slide/Board:**
      *   **Option R (Residual):** 50 Points (11% chance), 0 Points (89% chance).
      *   **Option T (Targeted):** 200 Points (10% chance), 0 Points (90% chance).
  *   **Instruction:** "Mark your choice on **Card B**. Place it in the envelope. Seal it. Hand all envelopes to the front."

  ---

  ## Phase 2: The Shock Reveal & Payoff (0:15–0:35)

  **1. The Ceremony (10 mins)**
  *   **Collect Envelopes:** Shuffle them to ensure anonymity.
  *   **The Draw:** Invite a student to draw a ball (number 1–100) from the urn.
  *   **Resolution Logic:**
      *   **If 1–10:** Round 1 Option G pays 200; Round 2 Option T pays 200.
      *   **If 11–99:** Round 1 Option G pays 50; Round 1 Option S pays 50; Round 2 Options pay 0.
      *   **If 100:** Round 1 Option G pays 0; Round 1 Option S pays 50; Round 2 Options pay 0.
  *   **Calculate Base Points:** Announce the result. Students calculate their base points based on their choices and the draw.

  **2. The Incentive Twist (10 mins)**
  *   **Facilitator Script:** "Before we finalize scores, we apply the 'Behavioral Calibration Bonus.' This bonus does not reward maximum points; it rewards specific choice patterns that indicate high-level strategic adaptability."
  *   **Reveal Bonus Scheme:**
      *   **Consistency Bonus (10 pts):** You chose S then R *OR* G then T. (Consistent risk profile).
      *   **Resilience Shift Bonus (30 pts):** You chose **S then T**. (The Allais Shift).
      *   **Reverse Shift (0 pts):** You chose G then R.
  *   **Action:** Students open their own envelopes, reveal their cards to themselves, and claim their bonus.
  *   **Aggregation:** Tally on the board: How many chose S? How many chose T? How many achieved the S-T shift?
  *   **Observation:** Typically, a majority will have chosen S in Round 1 and T in Round 2, securing the 30-point bonus.

  ---

  ## Phase 3: Debrief & Theory (0:35–0:60)

  **1. Eliciting Justifications (0:35–0:45)**
  *   **Facilitator:** "Look at the board. Most of you shifted from Safety (S) to Risk (T). Why? What was the principle behind Round 1? What was the principle behind Round 2?"
  *   **Predicted Student Responses:**
      *   *"Round 1 had a guarantee. You can't beat guaranteed survival."*
      *   *"Round 2 was all risk anyway, so I went for the high payoff."*
      *   *"The 1% risk of zero in Round 1 was too scary."*
  *   **Facilitator Move:** Write these principles on the left side of the board. Do not evaluate them yet.

  **2. The Mathematical Reveal (0:45–0:50)**
  *   **Facilitator:** "Let's look at the structure. I claim these two rounds are mathematically identical in their *difference*."
  *   **Board Work:**
      *   Write Round 1 Choice:
          *   $S: 1.0(50)$
          *   $G: 0.10(200) + 0.89(50) + 0.01(0)$
      *   Rewrite $S$ as: $0.11(50) + 0.89(50)$
      *   **Action:** "Cross out the **0.89(50)** from both options. This is the 'Common Consequence.'"
      *   **Resulting Core:**
          *   $S_{core}: 0.11(50)$
          *   $G_{core}: 0.10(200) + 0.01(0)$
      *   **Compare to Round 2:**
          *   $R: 0.11(50) + 0.89(0)$
          *   $T: 0.10(200) + 0.90(0)$
      *   **Facilitator:** "Round 2 is simply Round 1 with the common 89% chance of 50 replaced by an 89% chance of 0. If you prefer S over G, you *must* prefer R over T to remain consistent. If you prefer S then T, you have violated the **Independence Axiom**."
  *   **Name Drop:** "This is the **Allais Paradox** (1953)."

  **3. Normative vs. Descriptive (0:50–0:55)**
  *   **Discussion:** "You were rewarded 30 points for violating the axiom. Does that mean the axiom is wrong?"
  *   **Key Distinction:**
      *   **Descriptive:** The game successfully reproduced how humans *actually* value certainty. The framing of the 'common consequence' changed your emotional valuation.
      *   **Normative:** Does it mean you *should* violate independence? Expected Utility Theory (EUT) argues that if you accept the axioms, the shift is an error in reasoning, not a valid preference.
  *   **Facilitator:** "The bonus rewarded your intuition, not your rationality in the EUT sense. We rewarded the shift to prove how powerful the 'Certainty Effect' is."

  **4. Limitations & Closing (0:55–1:00)**
  *   **Explicit Limitations (Board Right Side):**
      *   **What this game reproduces:** The *framing-sensitive evaluation* of shared outcomes. It isolates the psychological weight of the "common consequence."
      *   **What this game cannot reproduce:** The *normative defense* of independence. The game cannot explain *why* Savage or von Neumann-Morgenstern argue independence is necessary for dynamic consistency or money-pump avoidance. That requires formal proof, not gameplay.
  *   **Closing Thought:** "In policy and economics, do we design systems for how people *should* choose (EUT) or how they *do* choose (Allais)? That is the tension you will face in your research."

  ---

  ## Facilitator Notes & Troubleshooting

  ### 1. Probability Correction
  *   **Prompt Discrepancy:** The prompt specified Option G as "200 points (0.89), 50 (0.10)". This breaks the Allais math.
  *   **Fix:** The plan uses **200 (0.10), 50 (0.89)**. This is required for the 0.89 probability mass to be the "common consequence" that cancels out to reveal Round 2. If you use the prompt's numbers, the debrief math will fail, and students will spot the error.

  ### 2. Handling "Domain Justifications"
  *   **The Risk:** Students will argue, "Round 1 was about *survival*, Round 2 was about *growth*." They will treat the framing as substantive, not cosmetic.
  *   **The Counter:** Ask: "If I offered you Round 1, but told you the 89% chance of 50 was managed by a different bank account that pays out regardless of your choice, does your choice change?" Force them to separate the *outcome* from the *source*.

  ### 3. The Incentive Scheme Ethics
  *   **Why reward the violation?** If you reward consistency (EUT), students will feel "punished" for their natural intuition. By rewarding the S-T shift, you validate their feeling, making them more open to discussing *why* it happened rather than defending themselves against being "irrational."
  *   **Caution:** Ensure they understand the 30 points is a *pedagogical device*, not an endorsement of the strategy for real-world wealth maximization.

  ### 4. What Will Go Wrong (First Run)
  *   **Prediction:** Students will focus on the "Shock Reveal" randomness rather than the choice structure. They might blame the urn draw for their payoff rather than their choice pattern.
  *   **Mitigation:** During the debrief, explicitly decouple the *realized payoff* from the *choice validity*. "Even if the urn drew '100' and you got zero, your choice pattern still reveals your preference structure."

  ### 5. Reproducibility vs. Normativity
  *   **Feature Reproduced:** The **Common Consequence Effect**. The game perfectly mirrors the psychological mechanism where $p \cdot u(x)$ is weighted differently when $p=1$ vs $p<1$.
  *   **Feature Missing:** **Dynamic Consistency**. The game is one-shot. It cannot demonstrate how violating independence makes you vulnerable to a "money pump" (being traded around in a circle until you lose wealth). You must supply this argument verbally in the debrief.
