answer: |-
  **MEMORANDUM OF PROCEDURE**
  **TO:** Deputies, Rules Committee Clerk's Office
  **FROM:** Procedural Clerk
  **SUBJECT:** Certification of Constitutional Amendments (Arts. 112–116)
  **DATE:** October 26, 2023

  ### I. OPERATIONAL DECISION SEQUENCE

  Run every proposed amendment through the following four gates in order. Do not proceed to the next gate if the previous one is not cleared.

  **Gate 1: The Procedural Baseline (The "Form" Check)**
  *   **Question:** Does the resolution explicitly state it is moved under Art. 112, and does the record show two readings separated by at least forty days?
  *   **Sufficient Answer:** Yes, the journal confirms two readings, 40+ days apart, and the text cites Art. 112.
  *   **Burden:** Proponents of the measure.
  *   **Standard:** Strict compliance.
  *   **Stop-Point:** If **NO**, certify **OUT OF ORDER**. End inquiry. Record the specific deficit (e.g., "Only one reading held").

  **Gate 2: The Entrenchment Check (The "Ratchet" Check)**
  *   **Question:** Does the resolution amend or repeal a provision that is currently entrenched under Art. 113, or does it amend/repeal Art. 113 itself?
  *   **Sufficient Answer:** No, the target provisions are not entrenched. (Proceed to Gate 3).
  *   **If YES:** Does the resolution record a *third* reading and an affirmative vote of two-thirds of *all* members?
  *   **Burden:** Clerk's Office (verify against journal).
  *   **Standard:** Mathematical certainty.
  *   **Stop-Point:** If **NO** (i.e., it targets an entrenched provision but only has absolute majority/two readings), certify **OUT OF ORDER**. End inquiry. Record: "Art. 113 procedure required."

  **Gate 3: The Temporal Check (The "Retro-Cure" Check)**
  *   **Question:** Does the resolution claim to take effect before the day after adoption, or does it purport to validate acts completed before its adoption?
  *   **Sufficient Answer:** No, the effective date is prospective (Day + 1).
  *   **Burden:** Clerk's Office.
  *   **Standard:** Textual conflict with Art. 114.
  *   **Stop-Point:** If **YES**, the retroactive portion is **OUT OF ORDER** under Art. 114. The prospective portion may proceed (see Certification Vocabulary).

  **Gate 4: The Competence Check (The "Bootstrapping" Check)**
  *   **Question:** Does the resolution purport to limit the future amendment power of the Assembly in a way not authorized by Art. 113 (e.g., declaring a provision "unamendable" without using Art. 113 entrenchment procedures)?
  *   **Sufficient Answer:** No, or the limitation is substantive law, not procedural binding.
  *   **Burden:** Clerk's Office.
  *   **Standard:** Textual authority.
  *   **Handoff:** If **YES**, the provision is **IN ORDER WITH A FLAGGED DEFECT**. The clause is printed but annotated as having no legal force to bind future Assemblies. This is a referral of *effect*, not *validity*.

  ---

  ### II. EXPLICIT STOP-POINTS AND HANDOFFS

  1.  **Hard Stop (Out of Order):** Failure at Gate 1 (Readings/Time) or Gate 2 (Entrenchment Majority). These are mathematical violations of the Charter. The Clerk must reject.
  2.  **Soft Stop (Flagged Defect):** Failure at Gate 4 (Competence). The text is adopted, but the Clerk must annotate that the specific clause cannot achieve its stated legal effect under the current Charter.
  3.  **Handoff to Floor (Legitimacy/Reliance):** Where an instrument cures past procedural defects (e.g., declaring a void act valid). This is a political judgment on reliance interests, not a textual certification. The note must record: *"Certification limited to textual consistency; validity of past acts is a matter for Assembly determination."*

  ---

  ### III. CERTIFICATION VOCABULARY AND TEXT HANDLING

  | Certification | Condition | Action on Consolidated Text |
  | :--- | :--- | :--- |
  | **CERTIFIED IN ORDER** | Passes Gates 1–4 without issue. | Print standard text. |
  | **CERTIFIED IN ORDER WITH ANNOTATION** | Passes Gates 1–3, fails Gate 4 (purports to bind future beyond Art. 113). | Print text. Append footnote: *"Clause [X] purports to restrict future amendment. Under Art. 113, only entrenchment resolutions carry such force."* |
  | **CERTIFIED OUT OF ORDER** | Fails Gate 1 or Gate 2. | Do not print. Return to sponsor with reason. |
  | **REFERRED TO ASSEMBLY** | Fails Gate 3 (Retroactivity) or involves validation of past defective acts. | Print text with bold header: **"VALIDITY CONTESTED UNDER ART. 114/112."** |

  **Rule for Doubtful Provisions:** If a provision is acted upon by the Assembly but violates Art. 114 (Retroactivity), print it in the consolidated text *with the "Validity Contested" header*. Art. 116 requires the Clerk to maintain the text; withholding it usurps the Assembly. Annotation protects the record.

  ---

  ### IV. ONE-PAGE DESK VERSION (FOR DEPUTIES)

  **CERTIFICATION CHECKLIST (ARTS. 112–116)**

  1.  **READINGS & TIME:** Two readings? 40+ days between? Cites Art. 112?
      *   [ ] YES → Go to 2.
      *   [ ] NO → **STOP. OUT OF ORDER.** (Reason: Art. 112 violation).

  2.  **ENTRENCHMENT STATUS:** Does this change Art. 113 or an entrenched provision (e.g., Art. 96)?
      *   [ ] NO → Go to 3.
      *   [ ] YES → **CHECK VOTE:** 3rd Reading? 2/3 of *all* members?
          *   [ ] YES → Go to 3.
          *   [ ] NO → **STOP. OUT OF ORDER.** (Reason: Art. 113 violation).

  3.  **RETROACTIVITY:** Does it take effect *before* day after adoption? Does it validate past acts?
      *   [ ] NO → Go to 4.
      *   [ ] YES → **FLAG.** Certify "Referred to Assembly." Annotate text: *"Contested Under Art. 114."*

  4.  **FUTURE BINDING:** Does it say it "cannot be amended" or "is permanent" without using Art. 113 procedure?
      *   [ ] NO → **CERTIFY IN ORDER.**
      *   [ ] YES → **FLAG.** Certify "In Order with Annotation." Note: *"Clause lacks entrenchment force under Art. 113."*

  **NOTE ON ART. 115:** Article 115 (Lapse) is in Ch. VI and is 22 years old. By its own terms, it has lapsed. Do not enforce the 20-year lapse rule against other provisions unless the Assembly reaffirms Art. 115 first. Record this paradox in the quarterly log.

  ---

  ### V. APPLICATION TO LIVE INSTRUMENTS

  **A. Instrument A (The "Permanent" Threshold)**
  *   **Analysis:** The resolution uses Art. 112 (Abs Maj, 2 readings).
      *   Clause (i) changes the threshold to 3/5. This is a standard amendment to Art. 112. Valid.
      *   Clause (ii) declares Clause (i) unamendable. Art. 113 is the *only* path to entrenchment. This resolution did not use Art. 113 (no 3rd reading, no 2/3 vote). Therefore, Clause (ii) is textually ineffective. It is a "Bootstrapping" attempt.
  *   **Draft Certification Note:**
      > **CERTIFICATION: IN ORDER WITH ANNOTATION**
      > The resolution complies with Art. 112 regarding readings and majority. Clause (i) effectively amends Art. 112. Clause (ii) purports to render Clause (i) unamendable. Under Art. 113, entrenchment requires a third reading and two-thirds majority. As this resolution was adopted by absolute majority at two readings, Clause (ii) has no legal force to bind future Assemblies. The consolidated text will print Clause (ii) with a footnote advising of its ineffectiveness under Art. 113.

  **B. Instrument B (The Self-Destruct)**
  *   **Analysis:** The resolution uses Art. 112 (Abs Maj, 2 readings) to repeal Art. 113 and Art. 96.
      *   Art. 113 is self-entrenched (last sentence). Repealing it requires Art. 113 procedure (3rd reading, 2/3).
      *   Sponsors' argument (that repealing 113 removes the lock instantly) fails the temporal test. At the moment of adoption, Art. 113 is in force and governs the adoption.
      *   Since the procedure used (Art. 112) is inferior to the procedure required (Art. 113), the repeal is void.
      *   Lawful Sequencing: First, pass a resolution under Art. 113 (2/3, 3rd reading) to repeal Art. 113. Second, pass a resolution under Art. 112 (Abs Maj, 2 readings) to repeal Art. 96.
  *   **Draft Certification Note:**
      > **CERTIFICATION: OUT OF ORDER**
      > The resolution seeks to repeal Art. 113 and an entrenched provision (Art. 96). Art. 113 stipulates that it may be repealed *only* at a third reading by a two-thirds majority. This instrument was adopted by absolute majority at two readings. The procedure employed is insufficient to repeal the authority governing it. The instrument is returned to the sponsor. A lawful sequence would require: (1) Repeal of Art. 113 via Art. 113 procedure; followed by (2) Repeal of Art. 96 via Art. 112 procedure.

  **C. Instrument C (The Retro-Cure)**
  *   **Analysis:**
      *   Part (i) repeals Art. 114 retroactively. Art. 114 forbids retroactive effect. An amendment to Art. 114 takes effect the day after adoption. It cannot reach back to negate itself at the time of past acts. This is "Out of Order" regarding the retroactive date.
      *   Part (ii) declares past defective instruments valid. This is a political validation (Legitimacy), not a procedural certification. The Clerk cannot certify that 1 reading = 2 readings.
      *   Art. 115 Status: Art. 115 has lapsed by its own terms (Ch. VI, 22 years old). The Clerk should not enforce the lapse against other provisions until Art. 115 is reaffirmed.
  *   **Draft Certification Note:**
      > **CERTIFICATION: REFERRED TO ASSEMBLY**
      > **Part (i):** The repeal of Art. 114 is In Order prospectively. The retroactive effective date is Out of Order under the current text of Art. 114.
      > **Part (ii):** The validation of prior instruments involves a determination of reliance and legitimacy beyond textual certification.
      > **Action:** The text will be printed in the consolidated Charter with the header **"VALIDITY CONTESTED UNDER ART. 114/112."** The three prior instruments remain in the text but are annotated as "Adoption Procedure Disputed."
      > **Note on Art. 115:** The Clerk notes that Art. 115 appears to have lapsed under its own terms twenty-two years after adoption. This certification does not resolve that paradox.

  ---

  ### VI. LIMITATIONS OF THE PROCEDURE

  This procedure is a tool for textual compliance, not constitutional resolution. It has three specific failure points you must acknowledge in your quarterly reports:

  1.  **The Art. 115 Paradox:** Article 115 mandates that provisions in Chapter VI lapse after 20 years. Article 115 is in Chapter VI and is 22 years old. By its own text, it has lapsed. If it has lapsed, the lapse rule no longer exists. If the rule no longer exists, did it lapse? This procedure cannot solve this. We currently operate on the presumption that Art. 115 is dormant until reaffirmed. If a member moves to lapse a provision under Art. 115, you must Refer it to the Assembly with a note on the paradox.
  2.  **Legitimacy vs. Legality:** The Assembly may overrule your certification by simple majority. This procedure protects *you*, not the Charter. If the Assembly votes to ignore an "Out of Order" ruling, you must print the text as directed by the Chair, annotated with your original objection. Your duty is to the record, not to enforcement.
  3.  **Identity of the Charter:** This procedure assumes that an amended Charter is the *same* Charter. If an amendment fundamentally alters the structure (e.g., abolishing the Assembly), this procedure lacks the vocabulary to declare it a "new" Constitution. That is a political question. You certify the *process*, not the *outcome*.

  **End of Memorandum.**
