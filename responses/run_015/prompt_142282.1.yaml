          *   Risk of operationalization mismatch (Wobble $\neq$ Weight): -0.10.
          *   Result: ~0.30. I will align closer to the researcher but acknowledge the user's theoretical intuition has merit. Let's settle on **0.35**. It's close enough to "even odds" to be interesting but skeptical enough to be safe.

      *   *Refining the Operationalization Critique:* This is the most important intellectual contribution I can make. Keynes's "Weight" ($w$) increases with evidence ($E$). $w \propto E$. Probability ($p$) changes with evidence. Wobble ($\Delta p$) is expected change in $p$.
