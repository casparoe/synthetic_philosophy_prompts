          *   *Contradiction:* If a question is "newsy," evidence is arriving fast. $w$ is increasing rapidly. But $\Delta p$ (wobble) is also high. So Wobble might correlate *positively* with Weight (rate of evidence accumulation), not negatively as the hypothesis assumes (Wobble = Low Weight).
