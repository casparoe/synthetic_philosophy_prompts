          *   (5) holds because the justification for leaving a marriage is also immediate/constitutive (e.g., "I no longer love her," not "Utility demands divorce").
      *   **Conclusion:** The weapon doesn't backfire if you understand the *source* of the objection. It targets the *standpoint*, not reflection itself.

