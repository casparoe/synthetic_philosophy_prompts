  I'm preparing a long-form essay for a science-and-ideas magazine on what philosophers have begun calling the "competence without comprehension" inversion—the parallel between Darwin's demonstration that adaptive design can arise without a designer's understanding, and Turing's argument that intelligent behavior can be produced without any inner grasp of meaning. Rather than treating this as a tidy analogy, I want to stress-test it against a concrete, well-documented episode: the March 2016 match between AlphaGo and Lee Sedol, with particular attention to the now-famous Move 37 and the broader dynamics of the five-game series. Analyze this episode through the Darwin-Turing lens. In what precise sense did AlphaGo display strategic competence—defeating one of the greatest human Go players—while lacking anything like comprehension, narrative reasoning, or conceptual understanding of the board? How closely does the system's development (reinforcement learning through self-play, evolutionary selection of network weights across millions of games) map onto Darwinian natural selection, and where does the analogy strain—especially given that human engineers designed the architecture, the loss function, and the training environment? Apply Turing's framework as well: does AlphaGo's real-time inference, which computes probability distributions over moves without propositional attitudes or experiential awareness, illustrate computation without cognition, or does the presence of learned representations complicate the picture? Then run the analysis backward. Sedol's own post-match reflections included bewilderment at moves that seemed simultaneously "creative" and "inhuman," and commentators struggled to supply strategic explanations for AlphaGo's choices. Does this human tendency to seek comprehension behind competence support the inversion thesis, or does it reveal that observers implicitly reject it? Be disciplined about the mapping—identify which features of the match the theory genuinely illuminates, which it misdescribes or forces into an ill-fitting category, and whether the episode ultimately vindicates the Darwin-Turing parallel, exposes it as a category mistake, or shows it to be a useful but partial heuristic. I am not asking for a bibliography or for references to obscure technical literature; I want a careful conceptual case study that treats both the philosophical framework and the historical episode with equal precision.
