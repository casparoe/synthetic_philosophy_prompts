answer: |-
  This is an excellent question to clarify before a lecture. You are absolutely right to suspect that the **strict-vs-weak distinction** is the pivot point. In game theory, "handwaving" this distinction is where most conceptual errors happen, especially when connecting efficiency (Pareto) to stability (Nash).

  Here is the careful breakdown you can use for your lecture notes.

  ### 1. Formalizing the Definition
  First, let's translate your verbal definition into formal game-theoretic terms to ensure precision.

  Let $s_i$ be the original strategy of player $i$, and $s_i'$ be the new strategy.
  Let $s_{-i}$ represent the strategy profile of all other players.
  Let $u_k(\cdot)$ be the payoff function for any player $k$.

  Your definition of a **Unilateral Safe Pareto Improvement (SPI)** implies two conditions must hold for the switch from $s_i$ to $s_i'$:

  1.  **Safety (Dominance):** The outcome holds *no matter what the others do*.
      $$ \forall s_{-i}, \quad u_k(s_i', s_{-i}) \geq u_k(s_i, s_{-i}) \quad \text{for all players } k $$
  2.  **Improvement (Pareto):** At least one player is strictly better off.
      $$ \exists s_{-i} \text{ and } \exists k \text{ such that } u_k(s_i', s_{-i}) > u_k(s_i, s_{-i}) $$

  ### 2. The Core Question: Was the Original Profile a Nash Equilibrium?
  To determine if the original profile $s = (s_i, s_{-i})$ could have been a **Nash Equilibrium (NE)**, we must check if player $i$ was playing a **Best Response**.

  *   **NE Condition:** $s$ is a NE if $u_i(s_i, s_{-i}) \geq u_i(s_i', s_{-i})$. (Player $i$ cannot gain by deviating).
  *   **SPI Condition:** We know $u_i(s_i', s_{-i}) \geq u_i(s_i, s_{-i})$ for all $s_{-i}$ (from the Safety condition above).

  The answer depends entirely on whether the inequality for the deviator ($i$) is **strict** or **weak**.

  ---

  ### 3. Case A: Strict Improvement for the Deviator
  **Condition:** The deviator strictly gains from the switch.
  $$ u_i(s_i', s_{-i}) > u_i(s_i, s_{-i}) \quad \text{for all } s_{-i} $$

  *   **Game Theory Term:** Strategy $s_i$ is **Strictly Dominated** by $s_i'$.
  *   **Implication for NE:** A rational player will never play a strictly dominated strategy.
  *   **Conclusion:** The original profile **CANNOT be a Nash Equilibrium.**
  *   **Lecture Explanation:** If switching to $s_i'$ makes player $i$ strictly richer regardless of what opponents do, player $i$ was leaving money on the table in the original profile. Rationality precludes this. The original state was unstable.

  ### 4. Case B: Weak Improvement (Indifference) for the Deviator
  **Condition:** The deviator is indifferent, but *others* gain.
  $$ u_i(s_i', s_{-i}) = u_i(s_i, s_{-i}) \quad \text{for all } s_{-i} $$
  $$ \text{But } \exists j \neq i \text{ such that } u_j(s_i', s_{-i}) > u_j(s_i, s_{-i}) $$

  *   **Game Theory Term:** Strategy $s_i$ is **Weakly Dominated** by $s_i'$ (specifically, it is payoff-equivalent for $i$ but worse for society).
  *   **Implication for NE:** Since $u_i(s_i') = u_i(s_i)$, strategy $s_i$ is *still* a best response. Player $i$ has no selfish incentive to switch.
  *   **Conclusion:** The original profile **COULD be a Nash Equilibrium.**
  *   **Lecture Explanation:** This is the subtle case. Player $i$ is not losing anything by sticking to $s_i$, so they have no incentive to deviate. The profile is stable (an equilibrium), but it is **Pareto Inefficient**. This is a classic coordination failure or "bad equilibrium."

  ---

  ### 5. The "Safe" Nuance: Trembling Hand Perfection
  Since you are prepping a lecture, you should anticipate the follow-up question: *"If Case B is a Nash Equilibrium, why do we often say dominated strategies shouldn't be played?"*

  This is where you introduce **Refinements**.

  While a weakly dominated strategy *can* support a Nash Equilibrium, it is considered fragile.
  *   **Trembling Hand Perfection:** If there is even a tiny probability ($\epsilon$) that the opponents might "tremble" and play a strategy other than the equilibrium one, does $s_i$ remain a best response?
  *   In your SPI definition, the improvement is "Safe" (holds *no matter what* others do).
  *   If $u_i(s_i', s_{-i}) \geq u_i(s_i, s_{-i})$ for **all** $s_{-i}$, and strictly greater for **some** $s_{-i}$:
      *   Then $s_i$ is weakly dominated.
      *   If opponents tremble, there is a chance they play the $s_{-i}$ where $s_i'$ is strictly better for $i$.
      *   Therefore, a "Trembling Hand Perfect" equilibrium would **eliminate** the original profile in Case B as well.

  ### 6. Summary Table for Your Slides

  | Deviator's Payoff Change | Others' Payoff Change | Strategy Classification | Can Original be Nash Eq? | Is it Efficient? |
  | :--- | :--- | :--- | :--- | :--- |
  | **Strict Gain** ($>$) | Any ($\geq$) | Strictly Dominated | **NO** | N/A (Unstable) |
  | **Indifferent** ($=$) | **Strict Gain** ($>$) | Weakly Dominated | **YES** (Standard NE) | **NO** (Pareto Inferior) |
  | **Indifferent** ($=$) | **Strict Gain** ($>$) | Weakly Dominated | **NO** (Trembling Hand) | **NO** (Pareto Inferior) |

  ### 7. Key Takeaway for the Lecture
  The existence of a Unilateral Safe Pareto Improvement implies the original strategy was **dominated**.

  1.  If the deviator **gains**, the original profile was **irrational** (Not a NE).
  2.  If the deviator is **indifferent**, the original profile was **stable but inefficient** (A NE, but a "bad" one).

  In bargaining contexts, we usually hope to rule out Case 2. If a unilateral change exists that helps everyone (even if the deviator is indifferent), standard rationality doesn't force the switch, but **social norms** or **refined equilibrium concepts** (like Trembling Hand) suggest the original profile shouldn't persist.

  ### One Terminology Note
  Be careful with the phrase "Safe Pareto Improvement." In recent literature (e.g., Oesterheld, Conitzer, et al.), **SPI** often refers to a *transformation of the game* (like changing the code of a delegated agent) rather than a simple strategy switch.
  *   If you stick to your definition (unilateral strategy change), you are effectively describing **Pareto-Dominant Strategies**.
  *   It is worth clarifying to your students: *"I am using 'SPI' here to describe a strategy that guarantees a Pareto improvement pointwise. In broader literature, this relates closely to the concept of Dominance."*

  This distinction ensures you don't get muddled if a student reads the specific SPI literature later.
