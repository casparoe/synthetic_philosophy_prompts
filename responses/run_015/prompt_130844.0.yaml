      Burke would concede that corruption exists. He was no nostalgist for the East India Company's abuses. He grants the reformers that some rules are mere guild protection. But he would reject the mechanism. Automatic repeal presumes innocence only for the new, while demanding guilt from the old. Instead of a filing requirement, he would propose a commission of inquiry empowered to modify, not just delete. Reform should be a repair of the building, not a demolition scheduled by calendar.

      Finally, the partnership of generations is violated. The Act privileges the epistemological confidence of the living over the accumulated experience of the dead and the stability required by the unborn. It assumes the present moment possesses a superior vantage point to judge thirty years of sedimented practice. By making tradition contingent on current explanation, it breaks the contract, treating the state as a partnership of the living only.

