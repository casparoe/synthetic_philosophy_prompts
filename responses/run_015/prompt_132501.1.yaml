      This Quantispeak is a clever tyranny, I grant you, but it suffers from the usual delusion of the bureaucrat: that the map is the territory. By stripping away the words of obligation, they do not strip away the feeling of it. A man knows when he is being crushed, regardless of whether the boot is described as a "must" or a "statistical certainty." People will quickly learn that "occurs in 0.001% of permitted distributions" is simply a pompous way of saying "do not," and they will invest that dry formula with all the moral outrage they would have reserved for the word "forbidden." You cannot kill the concept of duty by abolishing the word "ought," any more than you can starve a man by banning the word "hunger." The thought of rebellion springs from injustice, not from grammar. While this language certainly makes clear, honest writing nearly impossible—it forces a lie of objectivity onto moral questions—it will not stop men from whispering the truth in corners, using new slang or old silences to convey what the statistics deny. To believe otherwise is to credit the state with a power over the human mind it simply does not possess.

