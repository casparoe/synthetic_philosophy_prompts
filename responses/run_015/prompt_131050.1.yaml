prompt: |-
  You are a philosopher of moral psychology and applied ethics, with deep familiarity with Adam Smith's account of sympathy, the impartial spectator, and the distinction between propriety and merit. Before constructing the procedure, take time to think through the conceptual architecture: how sympathy functions as a mechanism of fellow-feeling rather than mere emotional contagion; how the impartial spectator operates as an internal standard that corrects for partiality; and where Smith locates the boundary between assessing an agent's intentions and evaluating the consequences of an act.

  I advise mediators in a community-based restorative justice program who repeatedly face decisions about whether a proposed restorative agreement genuinely addresses the moral desert of a symbolic or relational harm—such as a public false accusation that destroyed a reputation, or a breach of trust within an institution—without relying on legal sentencing guidelines. These mediators are not lawyers; they must document reasoning for a review board of legal staff and community representatives, and they need a reusable decision procedure they can run in under an hour. Design an ordered checklist of questions, with clear stopping rules, explicit judgment nodes, and a sharp distinction between empirical observations (what was intended, what damage occurred, what remedy is feasible) and irreducible value judgments (whether sympathy is warranted, whether the spectator approves). The procedure must handle hard cases: the offender expresses genuine remorse but the victim refuses any reconciliation; third-party observers disagree sharply on harm severity; and the proposed remedy risks being either disproportionate or merely performative. Apply it to three scenarios: a straightforward case with acknowledged harm and proportional remedy; a case where the offender sincerely intends repair but the structural damage exceeds any individual remedy; and a case where the procedure yields an answer the mediator will find unsatisfying—perhaps that formal reconciliation should be withheld despite emotional readiness on both sides. End by stating what the procedure cannot settle, where it is likely to misfire, and which steps remain judgment calls that no protocol can eliminate.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure:

  1.  **Deconstruct the Request:**

      *   **Role:** Philosopher of moral psychology and applied ethics (specializing in Adam Smith).
      *   **Task:** Design a reusable decision procedure (checklist) for community-based restorative justice mediators.
      *   **Context:** Mediators facing decisions about moral desert in symbolic/relational harm (reputation, trust) without legal sentencing guidelines. They need to document reasoning for a review board.
      *   **Constraints:** Must be runnable in under an hour. Must distinguish empirical observations from value judgments. Must include stopping rules and judgment nodes. Must handle hard cases (victim refusal, observer disagreement, performative remedies).
      *   **Application:** Apply to three specific scenarios (straightforward, structural damage exceeding individual remedy, unsatisfying outcome).
      *   **Conclusion:** State limitations, potential misfires, and irreducible judgment calls.
      *   **Conceptual Architecture:** Must ground the procedure in Smithian concepts: Sympathy (fellow-feeling, not contagion), Impartial Spectator (internal standard correcting partiality), Propriety (appropriateness of affection/action) vs. Merit (desert/reward or punishment).

  2.  **Conceptual Architecture (Smithian Framework):**

      *   *Sympathy:* For Smith, this isn't just "feeling bad for someone." It's the imaginative act of placing oneself in another's situation to see if their emotions are *proportionate* to the cause. It requires cognitive effort.
      *   *Impartial Spectator:* The "man within the breast." It's the internalized voice of the community/conscience that checks our self-deception and partiality. In a restorative context, this translates to the mediator facilitating a view from a "generalized other" perspective, not just the specific victim/offender dyad.
      *   *Propriety vs. Merit:*
          *   *Propriety:* Is the emotional response (anger, remorse) suitable to the situation? (Focus on the *agent's* motivation and affect).
          *   *Merit:* Does the act deserve reward or punishment? (Focus on the *consequences* and the *intentions* combined). Smith argues merit requires both beneficial consequences *and* proper intention. In restorative justice, we are looking at "demerit" (blame/punishment) and whether the remedy addresses it.
      *   *The Boundary:* Smith locates moral assessment primarily in intentions (propriety) but acknowledges that consequences matter for merit/demerit. We cannot judge merit solely on consequences (luck plays a role), but we cannot ignore them either.

  3.  **Drafting the Procedure (The "Smithian Restorative Protocol"):**

      *   *Goal:* A checklist that forces the mediator to simulate the Impartial Spectator.
      *   *Structure:* Phases. Empirical Fact-Finding -> Sympathetic Resonance Check -> Impartial Spectator Simulation -> Merit/Propriety Assessment -> Decision.
      *   *Distinction:* Need clear markers for "Observation" (Fact) vs. "Judgment" (Value).
      *   *Stopping Rules:* If sympathy is impossible (e.g., psychopathy, denial of facts), stop. If the spectator condemns the remedy, stop.
      *   *Time Limit:* Needs to be concise.

      *   *Drafting Steps:*
          1.  **Fact Establishment:** What happened? (Empirical).
          2.  **Propriety Check (Offender):** Is the remorse proportional? (Smithian Sympathy).
          3.  **Propriety Check (Victim):** Is the resentment proportional? (Smithian Sympathy).
          4.  **Impartial Spectator Test:** Would a neutral, informed community member approve?
          5.  **Merit/Remedy Alignment:** Does the fix match the harm's *moral* weight, not just material cost?
          6.  **Final Verdict:** Approve, Modify, or Reject.

  4.  **Refining the Procedure (Adding Smithian Nuance):**

      *   *Sympathy vs. Contagion:* The mediator must not just "feel for" the victim. They must assess if the victim's feelings are *appropriate*. Same for the offender.
      *   *The Spectator:* This needs to be explicit. The mediator asks, "If I strip away my relationship to these parties, what do I see?"
      *   *Propriety vs. Merit:* Crucial distinction. Propriety = Is the emotion right? Merit = Does the action deserve this specific consequence?
      *   *Hard Cases:* Need specific nodes for when Victim and Offender sympathy diverge.

  5.  **Developing the Three Scenarios:**

      *   *Scenario 1 (Straightforward):* Theft/Apology/Restitution. Spectator approves.
      *   *Scenario 2 (Structural):* Institutional betrayal. Individual apology can't fix systemic rot. Spectator sees the remedy as insufficient despite good intentions.
      *   *Scenario 3 (Unsatisfying):* Victim forgives too easily (lack of proper resentment) or Offender is forgiven but the community trust is broken. Let's go with: Victim is ready to reconcile, but the *community* (Spectator) cannot yet trust the offender. Smith emphasizes the social nature of morality. If the community's sympathy isn't engaged, reconciliation is premature.

  6.  **Addressing Limitations:**

      *   Smith's theory relies on shared moral sentiments. If the community is fractured, the Spectator is fragmented.
      *   Power dynamics: Smith assumes a level playing field for sympathy. Restorative justice often involves power imbalances.
      *   Time: Deep sympathy takes time. A 1-hour protocol is a heuristic, not a deep dive.

  7.  **Review and Refine (Self-Correction during drafting):**

      *   *Critique:* Is the language too academic?
      *   *Fix:* Keep the intro philosophical but make the checklist operational.
      *   *Critique:* Did I distinguish empirical vs. value clearly?
      *   *Fix:* Use brackets like [OBSERVATION] and [JUDGMENT].
      *   *Critique:* Is the Smithian distinction between Propriety and Merit clear?
      *   *Fix:* Ensure Section 2 focuses on emotions (Propriety) and Section 4 focuses on the act/remedy fit (Merit).
      *   *Critique:* Did I handle the "Victim refuses reconciliation" hard case?
      *   *Fix:* Include a stopping rule where victim's resentment is deemed proper by the Spectator, even if it blocks agreement. Smith validates righteous resentment.

  8.  **Final Polish:** Check tone. It should be authoritative, reflective, and practical. Ensure the "Under One Hour" constraint is respected by the complexity of the questions.

      *(Self-Correction on Scenario 3)*: The prompt asks for a case where the procedure yields an answer the mediator finds *unsatisfying*. A classic Smithian tension is between the "man within" (conscience) and the "man without" (public applause). Let's make Scenario 3 about a case where the Victim and Offender have reached sympathy, but the *Impartial Spectator* (representing the community standard) judges the harm too severe for mere interpersonal reconciliation. The mediator wants to close the case, but the Protocol says "No."

  9.  **Final Output Structure:**
      *   Conceptual Preamble (Smithian Architecture).
      *   The Protocol (The Checklist).
      *   Application to Three Scenarios.
      *   Limitations and Irreducible Judgments.

  10. (Final check against constraints):
      *   Under 1 hour? Yes, checklist format.
      *   Stopping rules? Included.
      *   Empirical vs. Value? Tagged.
      *   3 Scenarios? Included.
      *   Limitations? Included.

      *Let's write.*
answer: |-
  ### Conceptual Preamble: The Smithian Architecture

  Before deploying the procedure, we must ground it in Adam Smith's *The Theory of Moral Sentiments*. Smith does not offer a calculus of utility, but a phenomenology of moral judgment.

  1.  **Sympathy as Mechanism:** For Smith, sympathy is not emotional contagion (catching someone's sadness). It is an imaginative act of "changing places in fancy." We do not ask, "Do I feel what you feel?" but "Given the cause, is your feeling proportionate?" This allows us to judge the *propriety* of emotions without being swept away by them.
  2.  **The Impartial Spectator:** This is the internalized standard of the community. It corrects for the "optical illusion" of self-preference. In restorative justice, the mediator must facilitate the emergence of this Spectator, moving parties from "Why I hurt" to "What a neutral observer would deem appropriate."
  3.  **Propriety vs. Merit:**
      *   **Propriety** concerns the *affections*. Was the offender's remorse proportional to the harm? Was the victim's resentment proportional to the injury?
      *   **Merit** concerns the *action and its consequences*. Does the proposed remedy deserve approval? Smith argues merit requires both proper intention *and* beneficial consequences. A well-intentioned remedy that fails to address the harm lacks merit.
  4.  **The Boundary:** We assess intentions via Propriety (Section 2 of the protocol) and consequences via Merit (Section 4). We do not punish bad luck, but we do not ignore structural damage caused by negligence.

  ***

  ### The Smithian Restorative Protocol (SRP)
  **Time Limit:** 45–60 Minutes
  **User:** Mediator (for documentation and reasoning)
  **Goal:** Determine if a restorative agreement satisfies the demands of the Impartial Spectator regarding Propriety and Merit.

  **Notation:**
  *   **[OBS]** = Empirical Observation (Fact-based, verifiable).
  *   **[JUDG]** = Value Judgment (Requires sympathetic imagination).
  *   **STOP** = Terminate process; agreement cannot be ethically documented.

  ---

  #### Phase 1: Empirical Foundation (10 Minutes)
  *Establish the causal landscape before engaging moral sentiment.*

  1.  **[OBS]** What specific act or omission occurred? (List factual elements only).
  2.  **[OBS]** What tangible damages resulted? (Financial, physical, temporal).
  3.  **[OBS]** What symbolic/relational damages resulted? (Loss of reputation, breach of institutional trust, social exclusion).
  4.  **[OBS]** What is the proposed remedy? (Specific actions, timelines, commitments).
  5.  **[OBS]** What is the history of interaction between parties prior to this harm?

  **Stopping Rule 1:** If the facts of the harm are contested and cannot be provisionally agreed upon for the sake of this process, **STOP**. Sympathy requires a shared imaginative object.

  ---

  #### Phase 2: Assessment of Propriety (15 Minutes)
  *Assess the emotional proportionality of the agents. Do not ask if you like them; ask if their emotions fit the cause.*

  6.  **[JUDG] Offender's Remorse:** Imagining myself in the offender's position, knowing what they knew at the time: Is their expressed remorse proportionate to the harm caused?
      *   *Too little:* Denial, minimization.
      *   *Too much:* Performative self-abasement that seeks to silence the victim.
      *   *Proper:* Acknowledgment of cause and effect without erasing the self.
  7.  **[JUDG] Victim's Resentment:** Imagining myself in the victim's position: Is their anger or refusal to reconcile proportionate to the harm?
      *   *Note:* Smith validates resentment as a defense of social order. Forgiveness is not mandatory if the injury threatens the victim's standing.
  8.  **[JUDG] Mediator's Sympathy:** Can I, as mediator, "enter into" the feelings of *both* parties simultaneously without contradicting myself?
      *   *If No:* I am partial. I must recuse or consult a co-mediator.

  **Stopping Rule 2:** If the Offender's remorse is judged **Performative** (aimed at escaping consequence rather than repairing harm) **STOP**. No merit can exist without proper intention.
  **Stopping Rule 3:** If the Victim's resentment is judged **Proper** but precludes the proposed remedy, **STOP**. Do not force reconciliation. The Spectator supports the victim's right to withhold trust.

  ---

  #### Phase 3: The Impartial Spectator Test (15 Minutes)
  *Abstract away from the specific individuals. Consult the "generalized other."*

  9.  **[JUDG] Community Standard:** If this case were anonymized and presented to a representative group of community members (the Review Board), would they view the harm as a private matter or a public threat?
  10. **[JUDG] Visibility of Harm:** Does the harm affect third parties who are not present? (e.g., institutional trust).
      *   *If Yes:* The remedy must address the third party, not just the victim.
  11. **[JUDG] Spectator Approval of Remedy:** Would the Impartial Spectator view the proposed remedy as sufficient to restore the *moral balance*, not just the material loss?
      *   *Question:* Does this remedy signal to the community that this type of harm is taken seriously?

  **Stopping Rule 4:** If the Spectator judges the harm as a **Public Threat** but the remedy is **Private** (e.g., a secret apology for a public lie), **STOP**. The remedy lacks Merit.

  ---

  #### Phase 4: Merit and Final Determination (10 Minutes)
  *Align intention with consequence.*

  12. **[JUDG] Proportionality:** Is the burden of the remedy proportional to the benefit of the repair?
      *   *Warning:* Avoid remedies that are so burdensome they crush the offender (excessive punishment) or so light they insult the victim (performative).
  13. **[JUDG] Feasibility vs. Symbolism:** Is the remedy feasible? If it is purely symbolic, does the symbol carry enough weight to address the symbolic harm?
  14. **[DECISION]** Based on the above:
      *   **Approve:** Propriety and Merit align; Spectator approves.
      *   **Modify:** Propriety is sound, but Merit is lacking (remedy insufficient).
      *   **Reject:** Propriety is lacking (intentions flawed) or Spectator condemns the agreement.

  ---

  ### Application to Three Scenarios

  #### Scenario 1: The Straightforward Case (Acknowledged Harm, Proportional Remedy)
  *Context:* A small business owner falsely accuses an employee of theft in front of customers. The employee is cleared. The owner offers a public retraction, full lost wages, and a letter of recommendation. The employee accepts.
  *   **Phase 1:** Facts clear. Harm is reputational and financial. Remedy is public and financial.
  *   **Phase 2 (Propriety):** Owner's remorse is proportionate (public shame matches public harm). Employee's acceptance is proportionate (resentment satisfied by repair). Mediator sympathizes with both.
  *   **Phase 3 (Spectator):** Community sees this as a private dispute with public elements. The public retraction satisfies the community's need for truth.
  *   **Phase 4 (Merit):** Remedy matches harm.
  *   **Outcome:** **Approve.** The procedure confirms the intuitive sense of justice. The documentation shows the Spectator's demand for public truth was met.

  #### Scenario 2: The Structural Case (Sincere Intent, Insufficient Remedy)
  *Context:* A director of a non-profit misallocates funds, causing a program for at-risk youth to collapse. The director is deeply remorseful, offers personal restitution, and resigns. The beneficiaries (youth) are not present; the "victim" is the institution/community.
  *   **Phase 1:** Harm is structural/programmatic. Remedy is individual (resignation + payment).
  *   **Phase 2 (Propriety):** Director's remorse is genuine (Propriety met).
  *   **Phase 3 (Spectator):** The Spectator identifies the harm as **Public/Institutional**. The collapse of trust affects future donors and beneficiaries.
  *   **Phase 4 (Merit):** The remedy is private (resignation) for a public harm. The Spectator judges that individual restitution cannot rebuild institutional trust.
  *   **Outcome:** **Modify/Reject.** The mediator must document that while Propriety (remorse) is present, Merit is lacking because the consequence (program collapse) exceeds the individual's capacity to repair. The agreement must include systemic changes (audit, policy reform) to satisfy the Spectator, or it cannot be approved.

  #### Scenario 3: The Unsatisfying Case (Emotional Readiness vs. Community Trust)
  *Context:* A community leader sexually harassed a subordinate. They have undergone private mediation. Both parties feel healed; the victim forgives, the offender has done the work. They propose a quiet return to the organization with no public announcement.
  *   **Phase 1:** Harm is relational and power-based. Remedy is private reconciliation.
  *   **Phase 2 (Propriety):** Both parties' emotions are proportionate. They are genuinely reconciled. Mediator feels their sincerity.
  *   **Phase 3 (Spectator):** The Spectator views this as a **Public Threat** regarding power dynamics in the organization. A secret return undermines the safety of other subordinates.
  *   **Phase 4 (Merit):** The remedy fails the Merit test because it ignores the consequential signal sent to the community.
  *   **Outcome:** **Reject.**
  *   **Why it is unsatisfying:** The mediator sees two healed people. The Protocol forces the mediator to prioritize the Impartial Spectator (community safety/trust) over the immediate dyadic healing. The mediator must document that *despite* mutual forgiveness, the moral desert of the harm requires public accountability to restore institutional merit.

  ***

  ### Limitations and Irreducible Judgments

  As a philosopher of this system, I must disclose where the Smithian Protocol fails. No algorithm can fully automate moral sentiment.

  **1. What the Procedure Cannot Settle:**
  *   **Fractured Communities:** Smith's Impartial Spectator assumes a shared moral language. If the Review Board and the Community hold radically different values (e.g., on the severity of honor vs. autonomy), the "Spectator" is fragmented. The protocol cannot resolve which Spectator to use.
  *   **Power Imbalances:** Smith assumes sympathy is available to all. In cases of systemic oppression, the mediator may lack the capacity to "change places" with the victim due to privilege blindness. The protocol flags this in Phase 2, Question 8, but cannot fix it.

  **2. Where It Is Likely to Misfire:**
  *   **The "Performative" Trap:** An sophisticated offender may game Phase 2, displaying "proper remorse" that is actually manipulative. The protocol relies on the mediator's sympathetic acuity, which can be deceived.
  *   **Time Compression:** True Smithian sympathy requires deep imagination. A 45-minute checklist risks turning sympathy into a bureaucratic tick-box exercise, creating the very "emotional contagion" Smith warned against rather than genuine fellow-feeling.

  **3. Irreducible Judgment Calls:**
  *   **The Weight of Resentment:** In Phase 2, Question 7, deciding if a victim's refusal to reconcile is "proper" or "excessive" remains a subjective call. Smith validates resentment, but does not give a metric for its duration.
  *   **The Spectator's Voice:** In Phase 3, the mediator must *simulate* the community. This is an act of imagination, not data retrieval. Two mediators may simulate the Spectator differently.
  *   **Merit vs. Mercy:** The protocol prioritizes Merit (desert). It does not have a mechanism for Grace. Sometimes, a morally "undeserved" forgiveness is the most ethical outcome. The Protocol will flag this as a failure of Merit, leaving the mediator to decide whether to override the protocol in the name of a higher ethic not captured by Smith.

  **Final Instruction to Mediators:** Use this protocol to discipline your reasoning, not to replace your conscience. If the Protocol says "Reject" but your Impartial Spectator (conscience) screams "Approve," document the divergence. That divergence is where moral philosophy meets human reality.
