          1.  *Snapshot:* Is the action hers right now? (Responsive to reasons, no external coercion/pathology). End-of-book Mira passes this.
          2.  *Historical:* Did she author the machinery itself? (Sourcehood). User sees a "residue problem" (everything traces back to unchosen causes).
      *   **Specific Questions:**
          1.  What is the historical variety actually asking for if total sourcehood is impossible? Is it degreed/threshold-based or about the *kind* of process?
          2.  Is the historical demand separate, or can snapshot theory swallow it (does the distinction evaporate)?
          3.  (Most important) Is 'free will worth wanting' one thing or two? (Property we have/value vs. Property justifying praise/blame). Why the slide?
      *   **Constraints:**
          *   No literature map (no positions-with-names, no who-argued-what).
          *   Just conceptual mechanics in plain language.
          *   Length: A page or so.
          *   Format: Continuous prose, no headings, bullet points, bold text, or tables.
          *   Tone: Like writing to a friend.

  2.  **Deconstruct the Philosophical Issues:**
      *   *Snapshot vs. Historical:* This is essentially the debate between structuralist/compatibilist views (current state matters) and historical compatibilist/libertarian views (origin matters). The user identifies the "manipulation case" (cult/feed) as the weakness of the snapshot view.
      *   *The "Residue Problem":* Regress argument. If I choose my values, I need prior values to choose them. Infinite regress. So total sourcehood is impossible.
      *   *What Historical View Wants:* It's not about *uncaused* causes (that's magic). It's about the *quality* of the causal history. Was it coercive? Manipulative? Or was it organic, reflective, responsive? It's about the *kind* of process, not the absence of causation.
      *   *Snapshot swallowing History:* A sophisticated snapshot view can include historical conditions (e.g., "must have had the opportunity to reflect"). But the distinction remains useful because one focuses on structure, the other on genesis.
      *   *The "Free Will Worth Wanting" (Dennett phrase, but don't name drop):* The user senses a slide between "agency we care about" (autonomy, integrity) and "moral responsibility" (desert, blame).
      *   *Resolution:* These are related but distinct. Agency is about control ownership. Responsibility is about social practices. The slide happens because we use the same word for the capacity and the license to judge.

  3.  **Drafting - Section by Section (mental outline):**
      *   Acknowledge the writer's intuition (it's sharp).
      *   Address the Historical vs. Snapshot question first.
      *   Explain that historical views aren't asking for magic/unchosen choices. They are asking for the *right kind* of causation.
      *   Use the manipulation case: The difference isn't causation vs. no causation, it's integrity vs. bypassing.
      *   Address whether snapshot can swallow history. Yes, but the distinction highlights *what* we value (integration vs. origin).
      *   Address the "Free Will Worth Wanting" question.
      *   Distinguish between *agency* (being the driver) and *desert* (being the target of blame).
      *   Explain why they slide: We conflate owning the action with owning the consequences.
      *   Apply to Mira: She has agency (snapshot + good history), but does she deserve blame/praise in a cosmic sense? Maybe not, but in a human sense, yes.
      *   Keep it conversational, continuous prose.

  4.  **Refining the Tone and Constraints:**
      *   *Constraint Check:* No bolding. No bullets. No headings. No names (Frankfurt, Dennett, Strawson, etc.).
      *   *Tone:* Intimate, intellectual but accessible, like a letter to a colleague.
      *   *Length:* Aim for roughly 500-700 words (a page).

  5.  **Drafting - Iteration 1 (Mental):**
      You've hit on something real. The snapshot view is about structure. The historical view is about genesis. You're right that total sourcehood is impossible. So what does the historical view want? It wants the process to be non-manipulative. It's not about breaking the causal chain, it's about the chain being the right shape. Like a tree growing vs. a plastic tree. Both are caused, but one is organic. The snapshot view can try to include this by saying "you must have had the chance to reflect," but that smuggles history in. So the distinction doesn't fully evaporate, it just shows that freedom is a hybrid concept.
      Now the second part. Free will worth wanting. You're right, it's two things. One is agency, the other is deserving blame. We slide between them because when we feel free, we feel responsible. But logically they come apart. You can have agency without cosmic desert. For Mira, she is free in the agency sense. Whether she deserves blame is a social question.

  6.  **Drafting - Iteration 2 (Writing & Polishing):**
      *   Need to make sure I don't use bold text.
      *   Need to ensure I answer the specific question about what the historical variety is asking for (kind of process vs threshold).
      *   Need to address the "slide" temptation clearly.

      *Drafting text:*
      You have put your finger on the exact nerve that makes this problem itch, and your intuition about the manipulation case is the key to unlocking it. You are right that the historical variety cannot be asking for total sourcehood, because as you noted, that leads to an infinite regress where you need to choose the values you use to choose your values. So when philosophers or writing groups insist on history, they are not asking for magic uncaused causes. They are asking about the quality of the causation. Think of it like the difference between a tree growing toward the light and a plastic tree manufactured in a factory. Both are fully determined by prior physical causes, but the tree's shape comes from its own internal interaction with the environment, whereas the plastic tree's shape was imposed from outside. The historical demand is not that the chain of causes stops with the agent, but that the chain runs through the agent in the right way. It is about the kind of process, not the absence of process. In your manipulation case, the values were bypassed or implanted; in Mira's case, assuming she struggled and integrated them, the values were metabolized. So the historical view is looking for integrity of genesis, not origination ex nihilo.

      This means the snapshot theorist cannot simply swallow the historical demand without changing what snapshot means. If you define snapshot as merely current coherence, the manipulation victim passes. To fail her, you must build history into the definition of the snapshot, effectively admitting that freedom is partly historical. The distinction doesn't evaporate, but it collapses into a single requirement that has both structural and genetic components. You need the machinery to work right now, and you need the machinery to have been assembled without bypassing the driver.

      Now to the question you actually care about, regarding the free will worth wanting. You are correct that there are two different concepts sliding past each other here, and recognizing the slide is crucial for your novel. One concept is agency, which is about ownership and control. This is the property we actually have and value when we want to feel like the authors of our lives. The other concept is desert, which is about whether you are an appropriate target for resentment or reward in a cosmic sense. The slide is tempting because in everyday life, these two travel together. If you own the action, we hold you responsible for it. But they can come apart. You can have agency without deserving cosmic blame, because your agency is still part of a causal world you didn't choose.

      For Mira, this distinction is your way out. She can achieve the freedom that matters for living, which is the agency side. She becomes integrated, responsive, and uncoerced. That is the freedom worth wanting for a human being trying to live a life. But if your writing group is asking if she deserves praise in a way that breaks the laws of physics, the answer is no. The slide happens because we use the word freedom to cover both the experience of driving the car and the legal liability for the crash. You can give Mira the driver's seat without promising her she built the road. That is enough for a story, because what we care about in character is not metaphysical exemption from causality, but the integrity of the struggle. Mira's victory is that the machinery is finally hers, even if she didn't forge the metal.

  7.  **Review against constraints:**
