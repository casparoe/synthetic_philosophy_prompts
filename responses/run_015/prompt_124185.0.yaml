answer: |-
  ### Analysis of Input Material

  Before specifying the requirements, we must sort your provided material. Some are **axiological desiderata** (conditions on the theory of value itself), some are **epistemic constraints** (conditions on decision-making under uncertainty), and some are **feasibility conditions** (conditions on the theory's practical uptake).

  *   **Genuine Axiological Desiderata:** Your points on distinguishing length/quality/existence (1), aggregation (3), and value lock-in vs. paternalism (8) are core to population ethics. They define the conceptual space. The non-identity problem (2) is also a genuine desideratum; a theory that cannot speak to policies affecting *who* exists is useless for long-term planning.
  *   **Epistemic and Decision-Theoretic Constraints:** Cluelessness (4), Pascalian fanaticism (5), and risk correlation (7) are not strictly about *the good*, but about *rational choice*. They are requirements on the decision-rule paired with the theory.
  *   **Robustness and Feasibility:** Sensitivity to the scale premise (9), the pivotal moment claim (6), and infinite sacrifice (10) are stability checks. They ensure the theory doesn't collapse if empirical facts shift or if it demands the impossible.
  *   **Classification:** I treat all of these as legitimate requirements for an *institutional* specification, though philosophers might dispute some (e.g., a pure maximizer might reject the constraint on fanaticism). I have added two missing elements: **Temporal Discounting** (how time itself weighs) and **Deontic Constraints** (actions forbidden regardless of outcome).

  ***

  ### Specification of Adequacy

  1.  **Dimensional Distinction**
      The theory must distinguish between the value of bringing people into existence, the value of extending the duration of existence, and the value of improving the quality of existing lives. It must be able to rank a policy that increases survival probability but lowers conditional welfare against one that does the reverse.
      *Case:* The institution faces a choice between existential risk reduction (existence/duration) and far-future character improvement (quality). A theory that conflates these (e.g., treating "more lives" as identical to "better lives") cannot rank the three expenditure categories. It must explain whether a future of billions of miserable lives is better, worse, or incomparable to a smaller future of flourishing ones.

  2.  **Non-Identity Resolution**
      The theory must provide a verdict on policies that determine which specific individuals will exist in the future, without relying on the claim that those individuals are harmed by being brought into existence. It must either solve the non-identity problem or explain why the lack of a specific complainant does not preclude moral assessment.
      *Case:* Long-term policies change the timing of conception, altering the identity of future people. A person-affecting view that requires a victim to identify a harm will fall silent on existential risk or demographic engineering. The theory must allow the institution to judge the *state of affairs* even if no specific future person can claim they were made worse off than they would otherwise have been.

  3.  **Aggregation Limit**
      The theory must state whether the number of valuable lives is aggregative in a linear fashion and what limits, if any, apply to trading off quality for quantity. It must explicitly address the "Repugnant Conclusion" scenario.
      *Case:* If the future is astronomically large, a linear aggregation view implies that tiny benefits per person outweigh massive costs to the present. The institution needs to know if a policy guaranteeing a modest future is preferable to a risky policy aiming for a vast but barely worth-living future. The theory cannot remain neutral on whether "more" implies "better."

  4.  **Action-Guidance under Cluelessness**
      The theory must yield a recommendation even when the sign and magnitude of far-future consequences are unknowable or symmetric. It must specify a decision rule (e.g., expected value, maximin, precautionary) that does not collapse into paralysis when causal chains become opaque.
      *Case:* The "cluelessness" objection suggests we cannot know if saving a life today increases or decreases future suffering. If the theory requires precise consequence tracking, it recommends inaction on all long-term projects. The institution needs a rule that permits intervention despite deep uncertainty, without treating convenient uncertainty as knowledge.

  5.  **Anti-Fanaticism Constraint**
      The theory must take a position on whether rational choice requires maximizing expected value regardless of probability magnitude. It must justify either accepting Pascalian bets (astronomical payoff at tiny probability) or rejecting them via bounded utility, probability thresholds, or variance aversion.
      *Case:* Long-term interventions often rely on low-probability, high-impact scenarios (e.g., preventing extinction). If the theory mandates expected value maximization without bounds, the institution must fund the most speculative astronomical payoff over certain near-term relief. If it rejects this, it must provide a principled reason other than intuition, to avoid arbitrariness.

  6.  **Empirical Robustness**
      The theory's recommendations should not hinge entirely on contested empirical claims, such as the "hinge of history" hypothesis (that we live at a uniquely pivotal time). It must state how its rankings shift if the future is long but not astronomically sensitive to present action.
      *Case:* If the theory only justifies expenditure on existential risk because we are at a "pivotal moment," it becomes useless if that empirical claim is false. The institution needs a framework that remains stable whether the next century is uniquely dangerous or merely one of many.

  7.  **Systemic Risk Sensitivity**
      The theory must account for the correlation structure of risks. It cannot assume that risk reductions from different sources are additive; it must handle scenarios where mitigating one hazard exacerbates another or where common modes of failure exist.
      *Case:* Spending on AI safety might increase bio-risk if resources are diverted or if technological lock-in occurs. A theory that treats risks as independent will misallocate resources. The framework must allow for indeterminacy when the causal structure of hazards is unknown, rather than forcing a false precision.

  8.  **Axiological Neutrality**
      The theory must distinguish between preserving future people's capacity to choose their own values and imposing present values on them. It must explain whether "improving the character of the future" licenses paternalism or requires leaving values open.
      *Case:* Expenditure category three aims to improve the far future's character. If the theory defines "good" by present lights, it mandates astronomical paternalism. If it defines "good" by future lights, it may forbid intervention to prevent value lock-in. The theory must resolve this tension to justify spending on value formation.

  9.  **Temporal Neutrality or Discounting**
      The theory must explicitly state whether the timing of a benefit matters morally. It must justify either pure time neutrality (a life in 2200 counts equal to a life in 2024) or a discount rate, and explain the ethical basis for that choice.
      *Case:* This determines the "bank" option. If the theory is time-neutral and returns compound, it may mandate saving everything for the future. If it discounts, it favors near-term spending. The institution cannot choose between spending and saving without a stated moral weight for time.

  10. **Intergenerational Stability**
      The theory must not require a generation to sacrifice indefinitely for its successors. It must avoid the "absurd conclusion" where every generation consumes nothing to maximize the total sum of future welfare.
      *Case:* If the future is vast and investments compound, maximizing total welfare may demand near-zero consumption now. If the theory demands this, it is non-compliant and self-defeating. The institution needs a theory that justifies *some* present consumption, ensuring the policy is sustainable across generations.

  ***

  ### Incompatibilities and Tensions

  You asked to exhibit the tensions if some requirements cannot be jointly satisfied. There is a **Trilemma** at the heart of this specification involving **Aggregation (3)**, **Scale Sensitivity (6/9)**, and **Intergenerational Stability (10)**.

  1.  If you accept **Aggregation** (total value is the sum of individual values) and **Scale Sensitivity** (the future contains astronomical numbers of people), then **Intergenerational Stability** collapses. The math dictates that any small probability of affecting that vast future outweighs all present costs, demanding infinite sacrifice.
  2.  To save **Stability**, you must either reject **Aggregation** (adopt a sufficientarian or average view) or reject **Scale Sensitivity** (apply heavy discounting or deny the astronomical empirical premises).
  3.  However, rejecting **Scale Sensitivity** undermines the case for Existential Risk Reduction (Expenditure 2), while rejecting **Aggregation** undermines the case for Far-Future Character Improvement (Expenditure 3) if it relies on total welfare gains.

  You cannot have a theory that is sensitive to the astronomical scale of the future, aggregates value linearly, *and* permits significant present consumption. The seminar should map views by which horn of this trilemma they grasp.

  ***

  ### The Exclusionary Requirement

  The single requirement that excludes the largest number of views people actually hold is **Requirement 10: Intergenerational Stability**.

  *   **Popular Longtermist Package:** Excluded. This view typically combines Total Utilitarianism with astronomical scale estimates. Mathematically, this compels near-total savings and risk reduction spending, violating stability.
  *   **Standard Maximizing Consequentialism:** Excluded. Classic utilitarianism has no intrinsic limit on sacrifice; if the future is big enough, it demands everything.
  *   **Person-Affecting Views:** Often Excluded. While they avoid the "repugnant conclusion," many rely on a "same number" quality claim that still compels massive sacrifice if the future population is fixed but welfare is variable.
  *   **Near-Termists:** Survive. They implicitly reject scale sensitivity or aggregation, but they are the minority in this specific debate context.

  This requirement is the most exclusionary because it forces a rejection of the mathematical engine driving the most influential arguments in the field (compounding + scale). It demands a structural modification to the axiology (e.g., discounting, bounded utility, or agent-relative prerogatives) that most active participants in this space are reluctant to accept.

  ***

  ### Closing: The List at Work

  Imagine the foundation considers a proposal to divert 90% of its endowment into a speculative project that might prevent a low-probability extinction event in 300 years. **Requirement 5 (Anti-Fanaticism)** asks if the probability is too low to count, regardless of the stakes. **Requirement 9 (Temporal Neutrality)** asks if the 300-year delay discounts the value. **Requirement 10 (Stability)** asks if diverting 90% violates the duty of the current generation to consume. **Requirement 7 (Systemic Risk)** asks if this project increases other risks. If the theory cannot answer these simultaneously without contradicting itself (per the Trilemma), it fails the specification. The adequate theory will not necessarily say "yes" or "no," but it will identify exactly which constraint forces the decision, making the trade-off visible rather than hiding it behind ambiguous moral language.
