prompt: |-
  hey so I'm taking this course on collective responsability and I got into an argument with my roommate about whether Germany can still be 'guilty' for WWII stuff, not just on the hook for reparations. Before we even get to the case I think we need the full spec for what a theory of transgenerational collective guilt actually has to deliver.

  Write me the desiderata. Like, what are the hard requirements? It needs to respect the distinction between being guilty and being liable for repair, and it can't collapse Jaspers-style categories — criminal, political, moral, metaphysical guilt — into one blob. But it also has to solve the institutional continuity problem: the state persists legally but the citizens are almost all different people now. I'm also pushing this idea of 'moral amortization schedules' — should collective guilt depreciate over generations like infrastructure, or are some debts non-depreciating? Then there's distributive guilt: does every citizen inherit equal shares, or is it weighted by benefit received?

  For each requirement give the motivating case behind it and flag whether it's non-negotiable or just a preference of a particular camp (restorative justice advocates vs liberal individualists, etc.). Tell me if any subset is jointly unsatisfiable — maybe continuity of agency and non-depreciation can't both hold. Which single desideratum knocks out the most popular theories? I don't need a full scorecard, just the criteria. And please don't list papers I can't verify — I just want the conceptual spec, not a bibliography.
