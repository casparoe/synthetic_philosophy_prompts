answer: |-
  Here is the conceptual specification for a theory of Transgenerational Collective Guilt (TCG). These desiderata are structured to isolate the philosophical load-bearing points.

  ### 1. The Guilt-Liability Separation Constraint
  **Specification:** The theory must provide distinct criteria for ascribing *guilt* (a moral status or stain) versus *liability* (an obligation to repair or compensate). It must be possible to be liable without being guilty, and (theoretically) guilty without being liable.
  *   **Motivating Case:** A current German citizen may inherit a tax obligation to fund reparations (liability) based on citizenship, but that does not necessarily mean they are personally blameworthy for the Holocaust (guilt). Conflating the two turns reparations into collective punishment.
  *   **Status:** **Non-Negotiable.** Without this, the theory collapses into strict liability or collective punishment, violating basic liberal norms.
  *   **Tension:** This creates a burden of proof. If the theory claims *guilt* transmits, it must explain how a moral status transmits without the underlying blameworthy action.

  ### 2. The Jaspersian Category Integrity Constraint
  **Specification:** The theory must not conflate Karl Jaspers' four categories of guilt. It must specify which category is transmitting transgenerationally.
  *   **Motivating Case:**
      *   *Criminal:* Violates law (cannot transmit; only the perpetrator goes to jail).
      *   *Political:* Citizen liability for state actions (can transmit via citizenship).
      *   *Moral:* Individual conscience (hard to transmit).
      *   *Metaphysical:* Solidarity with humanity (vague, risks vacuity).
      *   A theory claiming "Germany is guilty" must specify if this is a *political* liability of the state or a *moral* failing of the people.
  *   **Status:** **Non-Negotiable** (for this framework). Collapsing these leads to category errors (e.g., treating political liability as criminal guilt).
  *   **Tension:** Most robust theories only allow *Political* guilt to transmit. If you demand *Moral* guilt transmits, you face the "Non-Identity Problem."

  ### 3. The Non-Biological Transmission Clause
  **Specification:** The mechanism of transmission cannot rely on genetics, bloodline, or essentialist notions of national character.
  *   **Motivating Case:** A German citizen naturalized in 2020 cannot be "guilty" due to DNA. Conversely, a descendant of perpetrators who emigrated in 1945 cannot escape liability solely by changing passports if the theory relies on benefit retention.
  *   **Status:** **Non-Negotiable.** Biological transmission is ethically indefensible and scientifically baseless.
  *   **Tension:** This forces the theory to rely on *institutional* or *normative* continuity rather than organic continuity.

  ### 4. The Institutional Continuity Condition
  **Specification:** The theory must define the "Collective" agent that persists over time. It must explain how the Federal Republic of Germany is the *same agent* as the Third Reich for the purposes of guilt, despite constitutional discontinuity.
  *   **Motivating Case:** If the state is a new legal entity (post-1949), why does it inherit the debts of the predecessor? If it is the *people*, how is the "people" defined when 100% of the voters are different?
  *   **Status:** **Non-Negotiable.** Without a theory of corporate agency, there is no subject to bear the guilt.
  *   **Tension:** This conflicts with **Methodological Individualism**. If you believe only individuals act, the "State" is a fiction, and TCG is impossible.

  ### 5. The Moral Amortization Parameter
  **Specification:** The theory must explicitly state whether collective guilt depreciates over time.
  *   **Motivating Case:** Infrastructure depreciates; does moral debt? If guilt is non-depreciating, does a citizen in 2100 bear the same weight as one in 1950? If it depreciates, what is the rate, and what zeroes it out (apology, payment, time)?
  *   **Status:** **Camp Preference.**
      *   *Restorative/Corrective Justice:* Often argues for **Non-Depreciation** until repair is made (debts don't expire).
      *   *Liberal/Forward-Looking:* Often argues for **Depreciation** to allow future generations to escape the shadow of the past.
  *   **Tension:** Non-depreciation + Non-Biological Transmission creates a fairness problem. Why does the debt remain full-value for someone who had no hand in incurring it?

  ### 6. The Distributive Fairness Principle
  **Specification:** The theory must specify how the burden of guilt/liability is distributed among current members of the collective.
  *   **Motivating Case:**
      *   *Per Capita:* Every citizen bears equal share (simple, but unfair to those who opposed the regime).
      *   *Benefit-Based:* Burden weighted by how much the individual/family benefited from the injustice (fairer, but epistemically difficult to trace).
  *   **Status:** **Camp Preference.**
      *   *Egalitarians:* Prefer Per Capita (shared political responsibility).
      *   *Libertarians/Rectifiers:* Prefer Benefit-Based (unjust enrichment).
  *   **Tension:** Benefit-Based distribution weakens *Collective* Guilt. If only those who benefited are liable, it becomes a cluster of individual liabilities, not a collective status.

  ---

  ### Joint Unsatisfiability Analysis

  There is a "Trilemma" inherent in these desiderata. You likely cannot satisfy all three of the following simultaneously:

  1.  **Strong Moral Guilt Transmission:** (Desideratum 1 & 2: Moral guilt, not just political liability, is inherited).
  2.  **Liberal Individualism:** (Only individuals can be moral agents; groups are fictions).
  3.  **Non-Depreciating Debt:** (The guilt remains full-strength across generations).

  **Why they clash:**
  If you hold **Liberal Individualism**, you cannot have **Strong Moral Guilt Transmission** because moral guilt requires agency, and the current generation did not act. If you insist on **Strong Moral Guilt**, you must adopt a **Collective Realist** ontology (the Group is a real agent), which violates Individualism. If you try to keep Individualism but insist on **Non-Depreciating Debt**, you end up punishing individuals for acts they didn't commit, which violates the **Guilt-Liability Separation**.

  **Most viable sacrifice:** To make the theory work, most philosophers sacrifice **Strong Moral Guilt Transmission**. They argue only *Political Liability* transmits (via the State), while *Moral Guilt* dies with the perpetrators.

  ### The "Theory Killer" Desideratum

  The single desideratum that knocks out the most popular contemporary theories is **Desideratum 1: The Guilt-Liability Separation Constraint**, specifically the demand that **Guilt** (not just Liability) must transmit.

  **Why:**
  The dominant view in political philosophy (e.g., liberal accounts of reparations) is **"Liability without Guilt."** They argue current generations can be *liable* to pay reparations (based on benefit receipt or state continuity) but cannot be *guilty* (because they lacked agency).
  *   If your spec requires a theory of **Transgenerational Collective *Guilt***, you immediately invalidate the standard liberal model.
  *   If you allow the theory to output "Liability only," you solve the continuity problem but fail the prompt's core premise (that Germany is still *guilty*).

  **Verdict:** To satisfy your prompt's premise, you must adopt a **Collective Realist** ontology (the State/People is a continuous moral agent). This satisfies Continuity and Non-Depreciation but triggers a collision with Liberal Individualism. If you prioritize Liberal Individualism, you must concede that "Guilt" does not transmit, only "Debt" does.
