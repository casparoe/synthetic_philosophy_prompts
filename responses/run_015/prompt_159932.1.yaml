answer: |-
  Here is a design for the 80-minute session. It adheres to your constraints: no technical jargon until the debrief, simple materials, and a structure that forces the theoretical insights to emerge from the students' own actions and frustrations.

  ### **Session Title:** The Archive and the Artifact
  **Time:** 80 Minutes (55 Activity / 25 Debrief)
  **Materials:** Index cards (3 packs), markers (3 colours), 1 timer, 3 small booklets (made of stapled index cards), 1 envelope marked "The Old Boxes."
  **Room:** Tables arranged for 3 groups of 6.

  ---

  ### **Part 1: The Activity (55 Minutes)**

  #### **Phase 1: The Ministry of Culture (20 Minutes)**
  **Setup:** Divide the 18 students into 3 groups of 6. Give each group a different coloured marker and a stack of index cards.
  **Prompt:** "You are the founding Ministry of Culture for a new state, *Republica*. You have two hostile neighbours. You need to bind the population together immediately. You have 20 minutes to create a **National Portfolio** consisting of exactly four items:"
  1.  **A Ritual:** A specific action performed on a specific date.
  2.  **A Token:** A garment, object, or food that signifies membership.
  3.  **A Story:** A 3-sentence origin myth about the Founder.
  4.  **A Rule:** A prohibition (what a good citizen *never* does).

  **Constraint:** For each item, you must write a **Justification Card**. This card must explain *why* this practice exists and *where* it comes from. The more coherent and logical the justification, the better.
  **Scoring:** You will earn **10 Points** for every item that is "adopted" by the judges later. You will earn **5 Bonus Points** if the judges identify your Justification as "Ancient."

  *(Instructor Note: Circulate. If a group hesitates, tell them: "Efficiency is key. Clarity wins. Ambiguity loses.")*

  #### **Phase 2: The Chain of Custody (10 Minutes)**
  **Setup:** Collect the 3 Portfolios. Keep the "Justification Cards" attached to the items.
  **The Mechanic:** Create 3 Booklets (The National Gazettes). Place one Portfolio inside each Booklet.
  **Rule:** "You will now pass these Booklets around the room. You will not speak. You will not look at the person next to you. When you receive the Booklet, you must write **one sentence** in the margin of any page. This sentence must sound like historical fact (e.g., 'My grandfather saw this in 1920,' or 'This was confirmed by the census'). You are adding weight to the record."
  **Process:**
  1.  Student 1 writes a sentence, passes left.
  2.  Student 2 reads the previous sentence, writes a new one, passes left.
  3.  Continue until all 18 students have written in all 3 Booklets.
  **Feeling:** They are building a "history" collectively, without coordination, relying on the authority of the previous writer. They are creating the "unseen fellowship" of the archive.

  #### **Phase 3: The Antiquarians (25 Minutes)**
  **Setup:** Shuffle the students into 3 *new* groups of 6. (Ensure no one is judging their own Ministry's work).
  **Materials:** Give each group the 3 Portfolios (now heavy with the Gazette marginalia) **PLUS** 3 cards from your envelope marked **"The Old Boxes."**
  **The "Old Boxes" Cards (Prepared by you):**
  *   *Card A (The Ragged Ritual):* "We burn the effigy on St. John's Eve. Sometimes we use wood, sometimes straw. In the north they don't do it at all. We do it because... well, we always have. If you ask why, the elders get angry."
  *   *Card B (The Messy Token):* "The red sash. Only worn by women, mostly. Some men wear it if they are widowers. It used to be blue, changed after the war. Nobody agrees on the shade."
  *   *Card C (The Contradictory Story):* "The Founder saved the village. Or maybe he burned it. The song changes the ending depending on the valley. We sing it at harvest, but some say it's for funerals."

  **The Task:** "You are Visiting Antiquarians. You must rank these 7 items (4 from Portfolios + 3 Old Box cards) from **Most Ancient** to **Most Recent**."
  **The Rubric (Hand this out on a card):**
  *   *Internal Coherence:* Does the story explain the practice clearly? (+2 pts)
  *   *Uniformity:* Is the practice the same across all regions? (+2 pts)
  *   *Documentation:* Is there a clear written record of the origin? (+2 pts)
  *   *Social Function:* Does the practice have an explicit moral or civic purpose? (+2 pts)

  **Scoring:** The Antiquarians submit their ranking.
  *   If they rank a **Ministry Item** as "Ancient": They get **5 Points**.
  *   If they rank an **Old Box Item** as "Recent": They get **5 Points**.
  *(Note: This scoring rewards the trap. It incentivizes them to trust the coherent fakes and distrust the messy realities.)*

  **Reveal:** At minute 55, stop. Collect the rankings. Do not reveal the truth yet.

  ---

  ### **Part 2: The Debrief (25 Minutes)**

  *Do not start by explaining the theory. Start by asking about their experience.*

  **1. The Phenomenology of Antiquity (Minutes 55-62)**
  *   **Ask:** "Look at the rankings. Which items did you mark as 'Ancient'? Why?"
  *   **Listen:** They will cite the Rubric: "It made sense," "It was uniform," "The story was clear."
  *   **Point:** "You just used a rubric that measures *legibility*, not *age*. You awarded points to things that were designed to be understood."
  *   **Theory Link:** Now introduce the first label: **Invented Tradition**. Explain that the Ministry items *were* invented 20 minutes ago, but they *felt* ancient because they were coherent.
  *   **Key Insight:** "Antiquity is not a chemical property of an object. It is a feeling produced by coherence, repetition, and documentation."

  **2. The Imagined Community (Minutes 62-68)**
  *   **Ask:** "Look at the Gazette Booklets. You wrote sentences in them. Did you talk to the person who wrote the line before yours?" (No). "Do you know who will read yours?" (No). "Yet, does the Booklet feel like a 'record' now?" (Yes).
  *   **Point:** "You just performed the second thesis. You are a community of 18. You never spoke to most of each other. You will never meet most of each other. But by contributing to this shared artifact, you feel a fellowship. You trust the 'history' because your peers wrote it, even though you didn't see them write it."
  *   **Theory Link:** Introduce **Imagined Community** (Anderson). The nation exists because we believe others are doing/reading/believing the same thing, not because we know them.

  **3. The Trap of "Fake" (Minutes 68-75)**
  *   **Ask:** "I put three cards in from 'The Old Boxes.' They were messy. Contradictory. Regional. You likely ranked them as 'Recent' or 'Fake.' Why?"
  *   **Listen:** "They didn't make sense." "They varied."
  *   **Reveal:** "Those cards describe real folk practices. The Ministry items describe fake ones. You rated the fake as real and the real as fake."
  *   **Theory Link:** This is the crucial pivot. **Invention $\neq$ Falsity.**
      *   *Say this:* "If I tell you your grandmother's festival was 'invented,' does that mean she lied? No. It means the *meaning* of the practice was updated to serve a new need (belonging). The Ministry items are 'shallow' because they were made for points. Real traditions are 'deep' not because they are old, but because they do the work of holding people together even when they are messy."
      *   *Address the Crete Example:* "Your skepticism about the Crete festival isn't proof it's fake. It's proof you are looking for *coherence* where real life offers *continuity*. A practice can be codified in the 1930s and still be authentic to the people living it."

  **4. Limitations & Coercion (Minutes 75-80)**
  *   **Say:** "This game had one major lie. In the game, you invented traditions voluntarily for points. In history, this process is slow, boring, and often violent."
  *   **Theory Link:** **State Coercion & Infrastructure.**
      *   "Real nationalism isn't just 20 minutes of creativity. It is 50 years of compulsory schooling, conscription, censuses, and maps. It is the state punishing you if you *don't* wear the sash. We felt the 'fellowship' today because we wanted to. In history, that fellowship is often enforced."

  ---

  ### **Troubleshooting: What Will Go Wrong**

  **1. The Moral Objectors ("This is lying")**
  *   **Prediction:** One Ministry group will refuse to invent a "Founder Story" because it feels like fabrication.
  *   **Fix:** Reframe the task during Phase 1. "You are not lying. You are *policy-making*. Every family has a story about why they do things. You are writing that down for a new family. Focus on the *goal* (unity), not the *history*."
  *   **Debrief Use:** If this happens, highlight it in the debrief. "This resistance is good. It shows that 'invention' carries a moral weight. But notice: the state doesn't care about your moral hesitation. It cares about the result."

  **2. The Joke Portfolio**
  *   **Prediction:** One group makes a ridiculous tradition (e.g., "We hop on one leg").
  *   **Fix:** Do not stop them. Let the Antiquarians judge it.
  *   **Debrief Use:** If the Antiquarians rank the Joke as "Ancient" because it had a clear justification, it proves the point even harder. If they rank it as "Fake," ask why. "Was it the content, or the tone?" This distinguishes between *form* (coherence) and *content* (solemnity).

  **3. The Nihilistic Spiral ("So nothing is real")**
  *   **Prediction:** In the debrief, students claim that because the "Real" cards were messy, *nothing* can be trusted, or because the "Fake" cards felt real, *everything* is a lie.
  *   **Fix:** Pivot to **Function**. "Stop asking 'Is this true?' Start asking 'What does this *do*?' The Ministry traditions were designed to create a border. The Old Box traditions were designed to manage a harvest. Both are real in their consequences. The error is thinking 'constructed' means 'worthless.'"
  *   **Script:** "A wedding ring is manufactured. That doesn't make the marriage fake. It makes the ring a tool. Nationalism is a tool. We are studying the workshop, not denying the marriage."

  ---

  ### **Instructor's Cheat Sheet: What the Game Cannot Stage**

  You must say this in your own voice during the final 5 minutes. The game is too clean.

  1.  **Time:** The game compresses 100 years into 20 minutes. Real "invented traditions" require generational turnover to feel ancient. The students *know* they just wrote the Gazette. In reality, the writers are dead.
  2.  **Violence:** The game is consensual. Real nation-building involves suppressing the "Old Box" practices. If a region *didn't* want the Blue Scarf, the Ministry would have banned the Red one. The game lacks the police.
  3.  **Literacy:** The game assumes everyone can read/write the Gazette equally. Real nationalism relies on print capitalism (novels, newspapers) which excludes non-literate populations.

  **Final Instruction:** "Take the points. The group with the most points gets nothing. That is the final lesson: The nation rewards compliance, but the historian rewards truth. You have been both today. Remember the difference."
