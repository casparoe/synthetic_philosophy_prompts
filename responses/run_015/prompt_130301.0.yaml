answer: |-
  The recognition that finkish and masked dispositions represent structurally different ontological relations fundamentally alters how we understand institutional agency. In physical objects, a disposition (like fragility) is typically grounded in a categorical base (molecular structure) distinct from the interfering factors (packing foam). In institutions, however, the "categorical base" of a capacity is often the very set of rules and procedures that constitute the entity. When a regulatory agency's authority is rendered inert not by an external veto but by its own procedural architecture, the relationship between the bearer of the capacity and the conditions of its manifestation shifts from one of *possession versus interference* to one of *constitution versus operation*.

  This distinction necessitates a rigorous examination of the proposed third category—"architecturally dormant capacities"—where the bearer and the blocker are ontologically identical. In this scenario, the agency possesses the deontic power to intervene, yet the procedural conditions required to exercise that power are structured such that they cannot be met. This is not merely a mask placed upon a ready capacity; it is a capacity defined by conditions that ensure its own dormancy.

  ### 1. The Survival of the Simple Conditional Analysis

  The Simple Conditional Analysis (SCA) posits that an entity has a disposition if and only if, were the stimulus condition to occur, the manifestation would follow. This framework already struggles with standard finks and masks, requiring *ceteris paribus* clauses or appeals to causal bases to survive. However, the introduction of architecturally dormant capacities in an institutional context renders the SCA untenable without radical, arguably *ad hoc*, reconstruction.

  In the case of the regulatory agency, the stimulus is a violation requiring intervention, and the manifestation is the act of intervention. Under a standard mask (e.g., an external budget freeze), the SCA can be preserved by stipulating "normal conditions" that exclude the freeze. However, when the mask is the agency's own procedural architecture (e.g., a requirement for a unanimous vote in a structurally polarized commission), the "interference" is not an external deviation from normal conditions; it is the definition of the agency's operational normalcy.

  If the SCA attempts to accommodate this by excluding the procedural architecture from the counterfactual scenario (i.e., "If the violation occurred *and* the voting rules were different, the agency would intervene"), it ceases to analyze the actual disposition of the existing agency and instead analyzes a hypothetical, reformed agency. If the SCA includes the architecture (i.e., "If the violation occurred *given current rules*, the agency would intervene"), the conditional is false, and the SCA incorrectly concludes the agency lacks the capacity altogether.

  Therefore, the SCA cannot survive this tripartite distinction. It relies on a separation between the intrinsic nature of the object and the extrinsic conditions of testing. In institutional ontology, the "intrinsic nature" *is* a set of conditional rules. To save the SCA, one would have to distinguish between "normative capacity" (the authority granted) and "operational capacity" (the ability to execute), effectively admitting that the simple conditional links stimulus to manifestation only when the institutional architecture is transparent. Since architecturally dormant capacities make the architecture opaque by design, the SCA fails to capture the reality that the agency *is* disposed to intervene in a normative sense, even if it is counterfactually impossible for it to do so in an operational sense.

  ### 2. Moral and Legal Responsibility for Non-Intervention

  Attributing masked institutional capacities, specifically those that are architecturally dormant, significantly shifts the landscape of moral and legal responsibility. Traditional accountability often hinges on the principle that "ought implies can." If an agent lacks the capacity to act, they cannot be held responsible for failing to act.

  If we treat the regulatory agency's failure as a lack of capacity (as the SCA might suggest), the agency is absolved. It "could not" intervene. However, recognizing the capacity as masked—specifically by its own architecture—reveals that the "cannot" is not a metaphysical impossibility but a political or structural choice. The distinction between a fink (where authority vanishes upon stimulus) and a mask (where authority remains but is blocked) is crucial here. In a finkish scenario, the power is genuinely lost at the moment of need. In a masked scenario, the power persists de jure but is frustrated de facto.

  When the mask is internal (architecturally dormant), the responsibility assignment changes from evaluating the *act* of non-intervention to evaluating the *design* of the institution. The agency is not responsible for the specific failure to intervene in a specific instance (since it was structurally impossible), but the creators and maintainers of the agency are responsible for instituting a capacity that was designed to be inert.

  This creates a form of distributed or structural responsibility. It prevents institutions from claiming powerlessness as a defense. If the capacity is masked by self-imposed procedure, the institution retains a second-order capacity: the capacity to revise its own procedures. Failure to exercise this second-order capacity to unmask the first-order capacity becomes the locus of blame. Consequently, legal and moral frameworks must move beyond assessing whether an intervention was possible at time $t$, to assessing whether the structural barriers preventing intervention were justified or negligent. It transforms the critique from "Why did you not act?" to "Why did you build yourself so that you could not act?"

  ### 3. The Functionalist Challenge and the Collapse of the Distinction

  Finally, we must consider whether this entire ontological framework collapses if we treat institutions as lacking genuine dispositions altogether, analyzing them purely in terms of assigned functional roles. A strict functionalist or eliminativist view might argue that institutions are not substances with powers, but rather nodes in a network defined by inputs and expected outputs. On this view, talk of "dispositions" is merely metaphorical shorthand for behavioral predictions.

  If institutions lack genuine dispositions, the distinction between finkish, masked, and architecturally dormant capacities ostensibly collapses. There is no underlying "power" to be lost or blocked; there is only the function. If the function is not performed, the institution is simply malfunctioning or operating outside its design parameters. From this perspective, a procedural block is not a "mask" hiding a real capacity; it is simply a feature of the function's algorithm.

  However, this collapse is only superficial and comes at a high explanatory cost. Treating institutions purely as functional roles ignores the normative dimension of institutional power. A regulatory agency is not merely a machine that processes violations into interventions; it is a bearer of authority. The expectation that it *should* intervene even when it *does not* relies on the existence of a disposition (authority) that transcends immediate behavioral output.

  If we adopt the functionalist view, we lose the ability to distinguish between an agency that fails to intervene because it lacks the resources (functional breakdown) and one that fails because its rules prevent it (structural masking). Both are simply "input did not yield output." Yet, legally and politically, this difference is paramount. The functionalist account cannot capture the "architecturally dormant" nuance because it does not recognize the gap between *authorized role* and *operational output*.

  Therefore, while the distinction technically collapses under a strict eliminativist ontology (because the genus "disposition" is denied), the *phenomena* the distinction describes remain robust. To ignore them is to render institutional analysis blind to the difference between inability and prohibition. Consequently, even if one rejects dispositional realism for institutions, one must reintroduce an analogue to the mask/fink/dormant distinction within the functional framework to account for the difference between structural friction and functional absence. To deny the distinction is to conflate a broken machine with a machine designed not to start, a conflation that obscures the specific nature of institutional failure and the specific remedies required to fix it.

  ### Conclusion

  The application of finkish and masked dispositions to institutional capacities reveals that institutional ontology is not merely an extension of physical ontology. The proposal of "architecturally dormant capacities" is necessary because, in institutions, the blocker is often constitutive of the bearer. This tripartite distinction breaks the Simple Conditional Analysis, as the counterfactual conditions cannot be isolated from the institutional rules that define the entity. Furthermore, it shifts moral and legal responsibility from the moment of inaction to the design of the structure, holding agents accountable for self-imposed paralysis. Finally, while a strict functionalist view might claim this distinction collapses without genuine dispositions, such a view fails to capture the normative reality of institutional authority. The distinction survives not merely as a metaphysical curiosity, but as a necessary tool for diagnosing the difference between an institution that cannot act, and one that has been built to ensure it does not.
