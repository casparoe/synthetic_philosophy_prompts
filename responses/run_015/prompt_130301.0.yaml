prompt: |-
  Please describe the most important implications of recognizing that finkish dispositions and masked dispositions are not merely two species of the same failure mode—interrupted potentiality—but indicate structurally different ontological relations between a bearer and its manifestation conditions, particularly when this distinction is applied to institutional rather than physical capacities. Take as your focal case a regulatory agency whose authority to intervene is not destroyed by an external interfering factor (a fink) but is rendered permanently inert by its own procedural architecture (a mask), and consider whether this requires introducing a third category—perhaps architecturally dormant capacities—to capture cases where the bearer and the blocker are identical. Address specifically: (1) whether the standard simple conditional analysis of dispositions can survive this tripartite distinction without ad hoc amendments; (2) whether attributing masked institutional capacities changes how we assign moral or legal responsibility for non-intervention; and (3) whether the distinction collapses if we treat institutions as lacking genuine dispositions altogether and instead analyze them purely in terms of assigned functional roles. Do not include citations, reading lists, or references to specific texts; work entirely within the conceptual framework.
