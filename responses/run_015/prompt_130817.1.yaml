  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the User and Request:**
      *   **User Role:** Safety department staff at a regional transit authority (light rail + buses, ~1200 vehicles).
      *   **Task:** Writes incident reviews (approx. 40/year).
      *   **Constraints:**
          *   Template has a *single line* for "Root Cause."
          *   Board rejects blanks or lists.
          *   Union agreement: Can only name an individual if "personally responsible" (triggers discipline process). Otherwise, it's "the system."
          *   Time/Resources: ~2 working days per report, 90 mins committee time. Limited data (rarely have statistical probabilities).
          *   Goal: A *decision procedure* (algorithm/checklist), not theory. Needs to be usable by non-philosophers.
          *   Output Requirements: Fixed form for the cause sentence (must state what is held fixed and the alternative). Must handle specific hard cases (overdetermination, backup failure, omission, unchangeable factors, interaction effects, distant causes, probabilistic causes).
          *   Specific Input: Evaluate the user's "swap test" (replace person with competent peer).
          *   Specific Task: Run the procedure on three specific cases (Signal Failure/Overdetermination, Pedestrian Strike/External Factor, Brake Component/Systemic Negligence).
          *   Final Requirement: Limitations of the procedure (what it can't do, where it's steered, what to watch for).

  2.  **Deconstruct the Philosophical Underpinnings (for the Procedure's Logic):**
      *   The user understands the *but-for* test's limitations (overdetermination, infinite regress).
      *   The user understands the *interventionist* account (manipulability, holding factors fixed) but worries about arbitrariness.
      *   *Key Insight:* The user is right. Causation in safety investigations is inherently pragmatic and contrastive. We don't find "The Cause"; we select the *most useful* cause for prevention/accountability given our constraints.
      *   *Strategy:* Build a procedure that makes these choices *explicit* rather than hidden. The "Root Cause" line shouldn't be a metaphysical truth; it should be a "Selected Intervention Point."
      *   *The "Swap Test":* This is essentially a test for *abnormality* or *deviation from norm*. If everyone does it, it's systemic. If only this person did it, it's individual. It fits well into the "Personal Responsibility" check.

  3.  **Drafting the Procedure (Iterative Process):**

      *   *Step 1: Define the Event.* Need to be specific. Not "Accident," but "Train stopped in tunnel."
      *   *Step 2: Identify Candidates.* List all factors (human, technical, environmental).
      *   *Step 3: The Counterfactual Check (Modified But-For).* Instead of strict but-for, use "NECESSARY IN THE CIRCUMSTANCES." Did this factor contribute?
      *   *Step 4: The Intervention Check (Manipulability).* Can we actually change this? (Rules out "universe was created" or "pedestrian biology").
      *   *Step 5: The Contrast Check (The User's Requirement).* What are we comparing against? (Status Quo vs. Specific Change).
      *   *Step 6: The Responsibility Filter (Union Constraint).* Is this an individual deviation or a systemic norm? (Here is where the Swap Test lives).
      *   *Step 7: Selection.* If multiple valid causes exist, which one gets the single line? Priority rule: Preventability > Proximity > Accountability.

      *   *Refining the "Cause Sentence":* Needs to be standardized. "X caused Y because if X had been [Alternative], Y would [Outcome], holding [Fixed Factors] constant."

      *   *Handling the "Hard Cases":*
          *   *Overdetermination:* Pick the one most easily prevented.
          *   *Omission:* Treat as "Failure to X."
          *   *Unchangeable:* Discard as root cause (maybe list as contributing).
          *   *Interaction:* Identify the combination, but pick the lever we can pull.
          *   *Distant:* Only include if the link is direct enough to act on.
          *   *Probabilistic:* Use "Increased likelihood" language.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Signal/Overdetermination):* Two sufficient causes. But-for fails. Interventionist works. Which one? The maintenance interval (systemic) vs. the wiring repair (individual/error). Procedure should prioritize the one that prevents *future* signals failing, not just this one. Likely the maintenance interval (systemic) unless the repair was gross negligence. Let's argue for the Maintenance Interval because it covers the degradation *and* implies the repair shouldn't have been needed yet. Or, if the repair was botched, that's the immediate trigger. Actually, the prompt says "Either alone would have done it." The procedure needs a tie-breaker. Rule: Pick the one that is *most manipulable by the authority*. Both are. Pick the one that represents the *deviation from standard*. Degradation is expected; wiring fault during repair is an error. *Correction:* If the module was past interval, that's a system failure. If the wiring was botched, that's a human error. The procedure must decide based on the "Swap Test." If any technician would have messed up the wiring due to poor tools/training -> System. If only this tech messed up -> Individual. Let's assume the wiring fault was a specific error. But the module was *also* dead. The procedure should force a choice based on *preventative value*. Fixing the interval prevents the degradation. Fixing the repair protocol prevents the wiring. I will guide the procedure to select the *Maintenance Interval* as the Root Cause because it is the deeper systemic vulnerability that allowed the signal to be vulnerable to *any* fault, whereas the wiring is a specific instance. *Wait, re-reading:* "Either alone would have done it." If I fix the wiring, the module still fails. If I fix the module, the wiring still fails. I need to pick the one that is *abnormal*. Module degradation is normal wear. Wiring fault is an error. I will guide the procedure to select the Wiring Fault *if* it was a deviation from protocol, OR the Maintenance Interval if the protocol allows running to failure. Let's make the procedure prioritize the *Systemic* cause if both are present, to avoid the "blame game" unless clear negligence exists. Actually, for the exercise, I need to show how the procedure *forces* a choice. I'll set a priority rule: *Select the factor that, if corrected, yields the highest risk reduction across the fleet.* That's likely the maintenance interval.

      *   *Case 2 (Pedestrian):* Pedestrian inattention is a cause (but-for works). But it's not manipulable by the Authority. Procedure must filter this out as a "Root Cause" candidate for *internal* reports. It's a "Contributing Factor." The Root Cause must be something the Authority can change (lighting, speed, etc.). Even if probability change is slight. The procedure must validate "Probabilistic Causes."

      *   *Case 3 (Brake/Torque):* Systemic negligence (all 6 techs). Swap Test says "Not Individual." Board wants a name. Procedure must output "Systemic Procedure Failure." It must explicitly state that Causation != Accountability here. The procedure stops at "System." The Committee must decide whether to lie to the Board or push back. I need to be honest: The procedure will say "System." The Committee must decide whether to override for political reasons.

  5.  **Refining the Output Structure:**
      *   **Introduction:** Acknowledge the user's insight (causation is pragmatic).
      *   **The Procedure:** Step-by-step, with Stop/Go conditions.
      *   **The Form:** The specific sentence structure.
      *   **The Swap Test:** Integrate it into the "Individual vs. System" step.
      *   **Case Studies:** Apply the procedure rigorously.
      *   **Limitations:** Honest assessment of where the tool fails or is manipulated.

  6.  **Self-Correction/Nuance Check:**
      *   *Constraint:* 90 mins committee time. The procedure can't be too long. It needs to be a checklist they can fill out *before* the meeting.
      *   *Constraint:* Single line. The procedure must have a "Tie-Breaker" rule.
      *   *Constraint:* Data scarcity. The procedure can't require statistical risk reduction numbers. It must rely on "Expert Consensus" on likelihood.
      *   *Tone:* Professional, pragmatic, respectful of the user's expertise, not condescendingly philosophical.
      *   *The "Swap Test":* It's a test for *normativity*. If the swap changes the outcome, it's individual. If not, it's systemic. I will codify this.

  7.  **Final Polish:**
      *   Ensure the "Cause Sentence" explicitly mentions the Contrast and the Fixed Factors as requested.
      *   Ensure the "Hard Cases" are addressed in the procedure notes.
      *   Make sure the distinction between *Causal Analysis* (Procedure) and *Administrative Decision* (Committee/Board) is clear in Case 3.

  *(Self-Correction during drafting Case 1)*: In Case 1, if both are sufficient, the but-for test fails. The interventionist test says both are causes. The procedure needs to pick *one* for the line. I will institute a "Hierarchy of Control" tie-breaker: 1. Engineering Controls (System) > 2. Administrative Controls (Process) > 3. Human Behavior (Individual). This biases towards system fixes, which aligns with modern safety science (Safety II/Just Culture), but I must acknowledge this is a *value choice*, not a fact.

  *(Self-Correction during drafting Case 3)*: This is the ethical crux. The procedure will exonerate the individual. The Board wants a scapegoat. I must advise the user that the procedure protects *them* if they follow it, but they need committee backing to resist the Board. The procedure outputs "Systemic Training/Tooling Failure." The Committee decides whether to sign that.

  8.  **Final Review against constraints:**
      *   Decision procedure? Yes.
      *   Order of steps? Yes.
      *   Question/Answer/Stop conditions? Yes.
      *   Fixed form for cause sentence? Yes.
      *   Handles data scarcity? Yes (uses qualitative estimates).
      *   Handles hard cases? Yes.
      *   Swap test evaluation? Yes.
      *   Three cases run? Yes.
      *   Limitations section? Yes.

