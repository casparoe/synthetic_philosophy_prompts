answer: |-
  This is a sophisticated problem. You have correctly identified that "root cause" in an organizational context is not a metaphysical discovery but a **selection of leverage points**. You are not asking "What caused this?" in the abstract; you are asking "Which cause, if removed, best serves our goals of safety and accountability, given our constraints?"

  Your intuition about the interventionist account is correct: it records decisions about which comparisons matter. The procedure below makes those decisions explicit, forcing the committee to own the value judgments rather than hiding them behind the word "cause."

  ### The Procedure: Causal Selection for Incident Review

  **Prerequisites:** This checklist is to be completed by the Safety Officer (you) *before* the committee meeting. The committee reviews the completed checklist. Total time per report: 45 minutes prep, 45 minutes review.

  **The Goal:** To fill the single "Root Cause" line with a sentence that identifies a manipulable factor, distinguishes system from individual, and specifies the contrast.

  #### Step 1: Define the Outcome and Candidates
  *   **Question:** What is the specific adverse outcome? (e.g., "Train stopped in tunnel," not "Signal failure.")
  *   **Action:** List every factor that contributed (human, technical, environmental, organizational).
  *   **Stop Condition:** If you cannot list at least two factors, you have not investigated deeply enough. Return to data gathering.

  #### Step 2: The Manipulability Filter
  *   **Question:** For each candidate factor, is there an intervention *within the Authority's control* that could alter this factor in the future?
  *   **Sufficient Answer:** "Yes, we can change policy/equipment/training" OR "No, this is external/immutable."
  *   **Stop Condition:** If the answer is **No** (e.g., pedestrian biology, weather, geometry as built), mark as **Contributing Factor Only**. It cannot be the Root Cause.
      *   *Note:* This handles the "Pedestrian" and "Geometry" hard cases. We do not root-cause things we cannot fix.

  #### Step 3: The Counterfactual Check (Modified But-For)
  *   **Question:** If this factor were removed or corrected *at the time of the incident*, would the outcome have been avoided or significantly delayed?
  *   **Sufficient Answer:** "Yes, outcome avoided" OR "Yes, probability significantly reduced" OR "No, outcome still certain due to other factors."
  *   **Stop Condition:** If **No**, discard as a cause.
      *   *Note:* This handles "Probabilistic" cases. If it reduced risk, it counts, even if not 100% certain.
      *   *Note:* This handles "Overdetermination" (Case 1). If two factors are sufficient, both pass this step. Proceed to Step 4 to choose between them.

  #### Step 4: The Normativity Check (The Swap Test)
  *   **Question:** If we swapped the individual involved with another competent employee, trained to the same standard, working the same shift with the same tools, would the outcome still have happened?
  *   **Sufficient Answer:** "Yes, any competent peer would have failed" (Systemic) OR "No, a competent peer would have succeeded" (Individual).
  *   **Stop Condition:**
      *   If **Individual**: The candidate is a **Personal Responsibility** candidate. (Triggers Union discipline process).
      *   If **Systemic**: The candidate is a **System Failure** candidate. (Triggers funding/process change).
      *   *Evaluation of your Swap Test:* It is sound for distinguishing *deviation* from *norm*. It breaks if "competent peer" is ill-defined (e.g., if *all* peers are poorly trained). In that case, the answer is "Yes, any peer would have failed," which correctly identifies it as Systemic.

  #### Step 5: The Selection Tie-Breaker
  *   **Context:** You now have one or more candidates that passed Steps 2, 3, and 4. You have only one line.
  *   **Rule:** Select the candidate that meets the highest priority on this list:
      1.  **Prevention Scope:** Which fix prevents the most future incidents across the fleet? (e.g., Changing a maintenance interval vs. retraining one driver).
      2.  **Reliability:** Which fix is most robust against human error? (Engineering control > Administrative control > Behavioral reliance).
      3.  **Proximity:** Which factor is closest to the event in time/space? (Only use if 1 and 2 are equal).
  *   **Output:** This selected candidate is the **Root Cause**.

  #### Step 6: The Causal Sentence Form
  *   **Requirement:** You must write the cause using this fixed syntax. This forces you to declare the contrast and the fixed factors.
  *   **Form:**
      > "[Outcome] occurred because [Selected Factor] was [Actual State] rather than [Alternative State], holding [Fixed Factors] constant."
  *   **Example:** "Train stop occurred because *Maintenance Interval* was *12 months* rather than *6 months*, holding *Repair Quality* constant."

  ---

  ### Application to Your Three Cases

  #### Case One: The Signal Failure (Overdetermination)
  *   **Candidates:** 1. Degrading Power Module (Past interval). 2. Wiring Fault (Repair error).
  *   **Step 2 (Manipulability):** Both are manipulable by Authority. (Pass)
  *   **Step 3 (Counterfactual):**
      *   If Module replaced: Signal works (Wiring fault didn't exist yet/was independent). *Wait, prompt says wiring fault introduced 3 weeks earlier.* If Module replaced 3 weeks ago, Wiring fault still kills it tonight.
      *   If Wiring correct: Module still fails tonight.
      *   *Result:* Both are sufficient causes. Both pass.
  *   **Step 4 (Swap Test):**
      *   Module: No individual to swap. Systemic.
      *   Wiring: Swap the technician. If the procedure is hard to follow, another tech might also fail. If it was a slip, they wouldn't. Let's assume the wiring fault was a specific error, but the module was *also* dead.
  *   **Step 5 (Tie-Breaker):**
      *   *Prevention Scope:* Fixing the Maintenance Interval prevents *all* module degradations. Fixing the wiring prevents *that* repair error. The Module failure represents a broader risk (aging fleet).
      *   *Reliability:* Changing an interval is an engineering/administrative control. Relying on perfect wiring repair is behavioral/procedural.
      *   *Selection:* **Maintenance Interval.**
  *   **Step 6 (Sentence):**
      > "Signal failure occurred because *Power Supply Replacement Interval* was *18 months* rather than *12 months*, holding *Repair Work Quality* constant."
  *   **Why:** This acknowledges the wiring fault existed ("holding quality constant") but identifies the systemic vulnerability that allowed the signal to be vulnerable to *any* single point of failure. It avoids blaming the technician for a failure that was going to happen anyway due to age, which aligns with the "no list" rule by picking the higher-leverage fix.

  #### Case Two: The Pedestrian Strike (External Factor & Probability)
  *   **Candidates:** 1. Pedestrian Inattention. 2. Crossing Lighting. 3. Signal Timing. 4. Vehicle Front Design.
  *   **Step 2 (Manipulability):**
      *   Pedestrian Inattention: **No.** (External to Authority). **Discard as Root Cause.** (Mark as Contributing).
      *   Lighting/Timing/Design: **Yes.** (Internal).
  *   **Step 3 (Counterfactual):**
      *   If Lighting better: Would strike be avoided? Maybe not certain, but *probability reduced*.
      *   *Rule:* Probabilistic reduction counts as causation in safety.
  *   **Step 4 (Swap Test):** N/A (System factors).
  *   **Step 5 (Tie-Breaker):**
      *   *Prevention Scope:* Signal timing affects all pedestrians at that junction. Lighting affects all night operations.
      *   *Selection:* **Signal Timing** (Assume committee agrees this is the highest leverage).
  *   **Step 6 (Sentence):**
      > "Collision occurred because *Crosswalk Signal Lead Time* was *3 seconds* rather than *5 seconds*, holding *Pedestrian Behavior* constant."
  *   **Addressing your concern:** You are right that naming the pedestrian is useless. This procedure forces you to filter them out at Step 2. It forces you to name a variable you *can* change, even if the risk reduction is slight. It makes the trade-off explicit: "We are choosing to tweak timing rather than accept the current risk."

  #### Case Three: The Brake Component (Systemic Negligence vs. Board Demand)
  *   **Candidates:** 1. Technician Torque Error. 2. Job Card Placement (End of shift). 3. Tooling Location.
  *   **Step 2 (Manipulability):** All are manipulable.
  *   **Step 3 (Counterfactual):** If torque correct, car stays in service. (Pass).
  *   **Step 4 (Swap Test):**
      *   Swap the technician with another of the six.
      *   Result: All six skip the step due to fatigue/tooling.
      *   Answer: **Yes, any peer would have failed.**
      *   Classification: **Systemic.**
  *   **Step 5 (Tie-Breaker):**
      *   *Selection:* **Job Card/Tooling Configuration.** (This is the root of the behavior).
  *   **Step 6 (Sentence):**
      > "Service removal occurred because *Re-torque Step Placement* was *end-of-shift* rather than *mid-shift*, holding *Technician Competence* constant."
  *   **The Conflict:**
      *   **Procedure Output:** System Cause. No individual named.
      *   **Board/Union Reality:** Board wants a name. Union rep wants to protect driver/tech but knows discipline is coming.
      *   **Honest Assessment:** The procedure correctly identifies that causation and accountability have come apart. The *cause* is the system. The *accountability* (in the Board's eyes) is the person.
      *   **Action:** The procedure stops at "System." The **Committee** must now make a Value Decision. They must decide whether to submit a report that tells the truth (System) and risks a funding battle with the Board, or submit a report that lies (Individual) to secure funding/discipline.
      *   **My Advice:** Do not name the individual in the Root Cause line. It violates the factual finding of Step 4. If the Board demands a name, the Committee Chair must state: "The investigation found no individual cause. We recommend administrative discipline separately, but the Safety Report must reflect the system failure to prevent recurrence."

  ---

  ### Limitations and Warnings

  You asked what this procedure cannot do and where it will be steered.

  **1. It cannot resolve Political Conflicts.**
  In Case 3, the procedure outputs "System." The Board may reject the report because they want a scapegoat to show "action." The procedure protects *you* (you followed the steps), but it does not protect the *recommendation*. You will need the Committee to vote unanimously to back the "System" finding against the Board. If the Committee is weak, the procedure will be overridden.

  **2. It is vulnerable to "Variable Framing."**
  The person writing the report (you) chooses the "Alternative State" in Step 6.
  *   *Manipulation:* "Cause was *Budget* rather than *Adequate*." (Impossible alternative).
  *   *Manipulation:* "Cause was *Technician Error* rather than *Perfection*." (Unrealistic alternative).
  *   *Watch For:* In the first six months, audit the "Alternative States." Are they achievable? If every report suggests an alternative that costs millions, the Board will ignore them. If every report suggests an alternative that is impossible (perfection), the reports are lies.

  **3. It hides the "Probability" problem.**
  In Case 2, we accepted "probability reduced." But the form doesn't capture *how much*.
  *   *Risk:* You might recommend a $100k fix for a 0.01% risk reduction.
  *   *Watch For:* Add a checkbox to the form: "Estimated Risk Reduction: High/Medium/Low." Force the committee to agree on the magnitude qualitatively.

  **4. It creates a "Systemic Bias."**
  The Tie-Breaker (Step 5) prioritizes System over Individual. This is good for safety science, but it may frustrate the Union or the Board if they feel individuals are getting away with negligence.
  *   *Watch For:* Monitor the ratio of System vs. Individual findings. If it goes 100% System for a year, you may be using the Swap Test too loosely. If it spikes to Individual, you are likely under pressure.

  **5. It cannot handle "Distant Causes" well.**
  The "Hiring Freeze two years ago" case.
  *   *Problem:* It passes the Counterfactual test. It fails the Proximity tie-breaker.
  *   *Risk:* You might ignore the hiring freeze because it's "too far back," but it might be the only thing that actually prevents the next decade of failures.
  *   *Watch For:* If you find yourself consistently selecting "Proximate" causes (Step 5, Rule 3), you are treating symptoms, not diseases. Force the committee to justify *why* they aren't picking the distant cause if it has higher Prevention Scope.

  ### Final Recommendation
  Adopt the procedure, but add a **Cover Sheet** for the Board.
  The Cover Sheet should have two boxes:
  1.  **Root Cause (Safety):** (The output of the procedure).
  2.  **Accountability Action (Administrative):** (Separate from causation).

  This allows you to say "The system caused the crash (Box 1), but we are disciplining the employee for violating protocol (Box 2)." This satisfies the Board's desire for accountability without corrupting the safety data in the Root Cause line. It acknowledges your insight: Causation is for learning; Naming is for governance. Keep them separate.
