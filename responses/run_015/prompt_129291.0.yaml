          *   *Point 2 (Duplication):* Defender must accept Leibniz Equivalence (shifts are not real). This makes cross-world duplication impossible (they are the same world). This is consistent, not tautological.
          *   *Point 3 (Physics):* **FATAL.** This is the only empirical check. Quantum statistics (Bose-Einstein) treat particles as indiscernible. If the user denies particles are "particulars," they change the subject. If they admit they are, PII fails. Weak discernibility works for Fermions, fails for Bosons in same state.
          *   *Point 4 (Essences):* Awkward. Leads to extreme essentialism (no transworld identity). Defender accepts this.
          *   *Point 5 (Collapse):* Not a collapse. It's a modal denial.

      *   *Refining the Unfalsifiability Check:*
          *   The user is right to worry. The move "conceivability $\neq$ possibility" is standard modal rationalism, but combined with "description underdetermination," it creates a shield.
          *   *Is it fatal?* No, necessary truths *are* unfalsifiable by empirical means *unless* they constrain empirical ontology.
          *   *The Trap:* If PII is a constraint on *what can exist*, and physics says "X exists" where X violates PII, then either Physics is wrong about ontology, or PII is wrong.
