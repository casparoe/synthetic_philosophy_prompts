          *   *Verdict:* It *is* insulated, but not necessarily viciously. It functions as a regulative ideal or a constraint on ontology. However, if physics *requires* indiscernibles for its mathematical formalism to map to reality (e.g., permutation invariance in QM), and the user says "those aren't real objects," the user is engaging in ontology revisionism.
          *   *Fatal Condition:* If the user admits that *ontology* is determined by our best science, and science says "indiscernibles exist," then PII must go. If the user says "Science describes phenomena, Metaphysics describes reality," they can keep PII but at the cost of naturalism.

