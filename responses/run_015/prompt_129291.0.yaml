          *   *Adjudication:* If PII is strictly intra-world, cross-world duplication is allowed. If PII is absolute (across all reality), cross-world duplication is forbidden. The user's version seems to be about "possible worlds" generally. If World 1 and World 2 are qualitatively identical, are they the *same* world? (Leibnizian Equivalence).
