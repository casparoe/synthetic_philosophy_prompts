  ### Joint Unsatisfiability
  Your suspicion is correct. The triad of **Material Observability**, **Normative Loss** (thickly bad), and **Not Merely Transformation** cannot be simultaneously satisfied in all cases without sacrificing coverage or precision.

  1.  **Observability vs. Normativity:** Archaeological proxies reliably measure complexity (monuments, script, settlement hierarchy) but poorly measure welfare (health, violence, inequality) except in specific bioarchaeological contexts. If you require Normative Loss, you cannot classify sequences lacking skeletal data, rendering the definition unusable for most of the historical record. If you require Observability, you must accept complexity markers as proxies for welfare, which fails the Kavos test (complexity lost, welfare gained).
  2.  **Normativity vs. Transformation:** If collapse must be "bad" (Normative), it implies a specific directionality to history. If collapse is "not merely transformation," it implies a break in continuity. However, resilience theory argues that all systems transform; distinguishing "bad transformation" from "adaptive transformation" requires an external moral standard (Normativity) that is rarely visible in the material record (Observability).

  To hold all three, you must restrict your definition to cases where you have high-resolution bioarchaeological data *and* a consensus that complexity equals welfare. This excludes most archaeological sequences. You must drop one: usually Normativity (accepting elite bias) or Observability (accepting theoretical inference).

  ### Most Exclusionary Requirement
  The single requirement that does the most work ruling candidates out is **Capacity Reduction**.

  This requirement eliminates the "Resilience/Transformation" family immediately, as they define events as adaptive cycles rather than losses. It also filters out "Ordinary Death" (conquest, dynasty change) where problem-solving capacity is transferred rather than lost. It forces a distinction between a system that stops working and a system that changes management. However, it does not solve the Kavos problem on its own; it requires Subject Specificity to determine *whose* capacity (elite vs. local) is being measured.

  ### Performance of the Three Families

  **Complexity-and-Marginal-Returns**
  This family defines collapse as a rapid loss of socio-political complexity. It satisfies Material Observability and Capacity Reduction well. It breaks against **Normative Loss** in cases like Kavos, where simplification improves lived experience, rendering the term "collapse" morally incoherent despite being archaeologically visible.

  **Wellbeing-or-Lived-Experience**
  This family defines collapse as a significant decline in population health or security. It satisfies Normative Loss perfectly. It breaks against **Material Observability**, as bioarchaeological data is sparse, sporadic, and rarely aligns neatly with political boundaries, making it impossible to apply consistently across sequences.

  **Resilience/Transformation**
  This family defines collapse as a reorganization into a different stability domain. It satisfies the dynamic nature of systems. It breaks against **Capacity Reduction** and **Not Merely Transformation**, as it refuses to categorize any outcome as inherently negative or terminal, dissolving the concept of collapse into continuous change.

  \answer{Loss of socio-political problem-solving capacity}
