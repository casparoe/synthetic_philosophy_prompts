answer: |-
  Good evening. For those of you who haven't had the pleasure of surviving Dr. Vasquez's Behavioral Economics 401, I need to explain the game we are playing tonight. It is a game she knows better than anyone.

  Imagine I put a single dollar bill on this table. I auction it off to the highest bidder. Simple enough. But there is a rule, unique to this room and to Elena's life's work: The highest bidder wins the dollar. But the second-highest bidder... also pays their bid. And gets nothing.

  For the family and friends here: imagine bidding ninety cents to win a dollar. You're making a profit. Then someone bids a dollar. You are now the second-highest bidder. If you stop, you lose ninety cents. If you bid $1.05, you only lose five cents. So you bid. And they bid. And suddenly, people are paying two dollars to win one. This is the escalation of commitment. It is the logic of the sunk cost. It is rational locally, but destructive globally.

  For the economists in the room: you know the Nash equilibrium. You know the pain of the ninety-nine-cent bid. You know how easily rational actors slide into irrational loss when the rules punish withdrawal.

  Looking at Elena's career from the outside, one might see this trap. Thirty-five years on the same set of problems. Thirty-five years of refining the same models. To the uninitiated, that looks like the second bidder refusing to cut their losses. It looks like throwing good years after bad simply because the years are already spent.

  But here is the distinction Elena lived, and the reason we are here celebrating rather than consoling.

  In the dollar auction, the prize is fixed. It is always just a dollar. If you bid more than a dollar, you lose. But Elena never treated the prize as fixed. She wasn't bidding for a publication count, or a tenure slot, or a grant renewal. Those are dollars. She was bidding for understanding. And understanding, unlike a dollar bill, expands the more you invest in it.

  To the specialists: She avoided the escalation trap not by exiting early, but by changing the utility function. She didn't maximize profit on a fixed asset; she invested in a growing one.
  To the family: She didn't stay because she was stubborn. She stayed because the work kept becoming more valuable than the cost of doing it.

  There is a pathology in throwing good resources after bad. But there is a virtue in staying with a hard problem because it deserves to be solved. Elena spent three decades teaching us how to tell the difference. She taught us that persistence is only virtuous when the goal is worth the price. She taught us that the hardest part of commitment isn't starting; it's knowing when the cost has exceeded the value.

  And that brings us to tonight. Retirement.

  In the logic of the auction, stopping is painful. The second-highest bidder loses their money. Stopping feels like admitting defeat. But Elena knows what many of us forget: that continuing when the price is too high is the real defeat. Walking away is not cutting losses. It is securing gains.

  She is not leaving because the work is done. She is leaving because she knows the value of the dollar has changed. She has taught us that the only rational bid is the one made with the freedom to walk away.

  So, if you would please raise your glasses.

  To Elena. She spent a lifetime studying why we pay too much, so we could learn to value what we have. She taught us that the only winning bid is the one you make knowing you can walk away.
