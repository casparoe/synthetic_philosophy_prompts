answer: |-
  There is no single, universally canonical term (like "gravity" or "natural selection") that captures this specific tension across all domains. However, your observation identifies a robust convergence of concepts in complexity theory, machine learning, and political economy.

  The phenomenon you describe is most precisely captured by the intersection of three established frameworks: **Computational Irreducibility**, the **Accuracy-Interpretability Trade-off**, and the tension between **Legibility and Functionality**.

  Here is an analysis of the existing concepts, followed by a proposed precise definition and boundary conditions.

  ### 1. Existing Concepts That Capture the Tension

  While no single word exists, three distinct fields have named facets of this exact problem:

  **A. Computational Irreducibility (Complexity Theory)**
  Coined by Stephen Wolfram, this principle states that for certain complex systems, there is no mathematical shortcut or "theory" that can predict their outcome faster than simply simulating every step of the process.
  *   **Relevance:** If a system is computationally irreducible, any attempt to create a compressed, human-understandable model (a "theory" of the breeding or the neural net) is inherently a lossy compression. The "understanding" is a simplification, and because the system's competence relies on the full complexity, the simplification degrades performance.
  *   **Fit:** This explains *why* understanding is impossible without loss.

  **B. The Accuracy-Interpretability Trade-off (Machine Learning)**
  In AI research, this is a well-documented empirical observation: as model performance (accuracy) increases, the ability for humans to interpret the decision logic (interpretability) typically decreases.
  *   **Relevance:** Deep learning models (like the ones you mentioned) achieve competence precisely because they operate in high-dimensional vector spaces that do not map to human semantic concepts. Forcing the model to use human-interpretable features (injecting understanding) constrains the search space and lowers accuracy.
  *   **Fit:** This captures the *inverse relationship* you noted in the computational case.

  **C. Legibility vs. Functionality (Political Economy / Epistemology)**
  Political anthropologist James C. Scott (in *Seeing Like a State*) and philosopher Michael Oakeshott distinguish between systems that are **legible** (understandable to a central authority) and those that are **functional** (resilient and effective).
  *   **Relevance:** Scott argues that when states try to make complex systems (like forests, cities, or agricultural practices) "legible" by imposing standardized, understandable rules, they often destroy the "metistis" (practical, local knowledge) that made the system work. The animal breeder example is a classic case of *metistis* vs. *techne*.
  *   **Fit:** This captures the *harm* caused by imposing understanding on evolutionary or social processes.

  **D. The Bitter Lesson (AI Strategy)**
  In a famous 2019 essay, Rich Sutton argued that the biggest lessons in AI are that "general methods that leverage computation" ultimately beat "human-knowledge-based methods."
  *   **Relevance:** Sutton explicitly notes that injecting human understanding (heuristics, explicit rules) into AI systems provides a short-term boost but ultimately caps performance because it limits the system's ability to find solutions outside human comprehension.
  *   **Fit:** This captures the strategic imperative to *avoid* understanding for the sake of competence.

  ### 2. Proposed Definition: "The Legibility-Competence Trade-off"

  Since no single term unifies these, the most precise label for the configuration you identified is **The Legibility-Competence Trade-off** (or **Opaque Optimization**).

  **Definition:**
  > A systemic configuration in which high-dimensional optimization processes generate competence through mechanisms that are structurally incompressible into low-dimensional human semantic narratives. In such systems, the imposition of legibility (explicit rules, interpretable features, or causal theories) acts as a constraint on the optimization landscape, resulting in a degradation of performance. Competence is therefore positively correlated with opacity.

  ### 3. Boundary Conditions

  To distinguish this from ordinary mystery or tacit skill, the following conditions must be met:

  1.  **High-Dimensionality:** The system must operate in a search space with more degrees of freedom than human cognition can model (e.g., millions of neural weights, complex genetic interactions).
  2.  **Non-Linearity:** Small changes in input or rules must have disproportionate, unpredictable effects on output. If the system were linear, understanding would not degrade performance.
  3.  **Evolutionary or Statistical Selection:** The competence must arise from a selection process (gradient descent, natural selection, market competition) rather than top-down design.
  4.  **Interventional Harm:** Crucially, attempts to *explain* or *formalize* the system must actively reduce its fitness. It is not enough that we *don't* understand; it must be that *making* it understandable breaks it.

  **Does it apply to human institutions?**
  Yes. This applies to **market economies** (Hayek's knowledge problem), **legal common law** (evolved precedent vs. codified rationalism), and **organizational culture**. When a company tries to codify its "secret sauce" into a manual (injecting understanding), the adaptability often dies.

  ### 4. What It Is Not (Differentiations)

  To ensure precision, it is vital to distinguish this from adjacent concepts:

  | Concept | Distinction |
  | :--- | :--- |
  | **Tacit Knowledge (Polanyi)** | Polanyi's "We know more than we can tell" implies the knowledge *exists* in the mind but is hard to articulate. Your concept implies the knowledge *does not exist* in an articulable form; it is distributed in the system's structure. Articulation isn't just hard; it's reductive. |
  | **The Black Box** | A "black box" simply means we don't see inside. A system can be a black box but still be safely formalized. Your concept requires that opening the box (or forcing it to be transparent) damages the mechanism. |
  | **Overconfidence / Dunning-Kruger** | These are cognitive biases regarding *self-assessment*. Your concept is a structural property of the *system*, regardless of the operator's humility. A humble engineer still cannot force interpretability without cost. |
  | **Goodhart's Law** | Goodhart's Law states "When a measure becomes a target, it ceases to be a good measure." This is about gaming metrics. Your concept is about the *loss of information* when translating complex optimization into simple rules. |
  | **Design without a Designer** | This explains the *origin* of complexity (evolution). It does not necessarily imply that *understanding* the evolution harms the organism. Your concept adds the antagonistic layer. |

  ### 5. Summary

  You have identified a fundamental limit of rationalism in complex systems. The closest established discourse is found in **James C. Scott's critique of legibility** (for social/breeding systems) and the **Accuracy-Interpretability Trade-off** (for computational systems), underpinned mathematically by **Computational Irreducibility**.

  If you require a precise term for your own writing, **"The Legibility-Competence Trade-off"** or **"Structural Opacity"** best captures the inverse relationship where understanding is not merely absent, but antagonistic to function.
