      **3.0 Designation of The Margin**
      3.1 To ensure total harm volumes remain constant while maximizing citizen exemption, all threshold-crossing actions are consolidated.
      3.2 Annually, one citizen shall be selected via lottery to serve as The Margin.
      3.3 The Margin shall execute all threshold-crossing purchases/votes/emissions on behalf of the certified population.
