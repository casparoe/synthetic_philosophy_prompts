      **POLICY DIRECTIVE 88-B: THRESHOLD HARM ALLOCATION**

      **1.0 Purpose**
      To align moral obligation with causal efficacy regarding threshold-based harms (e.g., livestock procurement, carbon emission, electoral outcomes). Current distribution scatters causal power below perceptible thresholds, generating undue anxiety without measurable impact. This Directive consolidates efficacy to clarify liability.

      **2.0 Certification of Superfluity**
