answer: |-
  Imagine I stand on a runway while a commercial airliner flies past me at a constant cruising velocity of 250 meters per second. At the exact instant the pilot's seat aligns with my position, we both synchronize our clocks to zero, but we disagree on what is happening "now" in Los Angeles, 4,000 kilometers away along the flight path. According to the Lorentz transformation for simultaneity, $\Delta t = v\Delta x / c^2$, where $v$ is 250 m/s, $\Delta x$ is $4 \times 10^6$ meters, and $c$ is $3 \times 10^8$ m/s. Plugging in these ordinary numbers yields a disagreement of approximately 11 nanoseconds regarding events in Los Angeles: events I classify as 11 nanoseconds in my future, the pilot classifies as present. This slice of disagreement exists purely due to our relative inertial motion, without any acceleration or gravitational effects, relying only on technology and distances familiar to modern travel.

  **Block-Universe Conclusion:** The block-universe theorist concludes that because the pilot is a physically valid observer, the events in Los Angeles they classify as "present" must be just as real as the events I classify as "present." Since the pilot's present includes events 11 nanoseconds into my future, those future events already exist. Therefore, the future is ontologically fixed, and eternalism is true.

  **Presentist and Growing-Block Replies:** The presentist replies that "presentness" is not an absolute ontological property but is relative to a frame of reference, meaning the pilot and I simply inhabit different, equally valid "presents" without implying my future exists for me. The growing-block theorist replies that while the pilot's slice is mathematically valid, only one specific foliation of spacetime corresponds to the actual "growing edge" of reality, implying a privileged frame that is empirically undetectable.

  **The Single Premise and Scale Invariance:** The single premise doing all the work is the claim that *no inertial frame is ontologically privileged*. This premise is binary, not scalar; it either holds or it does not. Consequently, the mundane case and Penrose's Andromeda-scale version stand or fall together because the logic relies entirely on the structural equivalence of frames, not the magnitude of the time shift. If you dismiss the 11-nanosecond disagreement as merely conventional coordinates, you must dismiss the Andromeda disagreement on the exact same grounds, and if you accept the Andromeda disagreement as proof of eternalism, the 11-nanosecond disagreement proves it just as decisively.

  **Recommendation and Cost:** The presentist should adopt "relativized presentism," admitting that existence is frame-dependent rather than absolute. The cost of this reply is the abandonment of the core presentist intuition that there is a unique, objective "Now" that divides reality from unreality; instead, existence becomes a relation between events and observers, which significantly dilutes the metaphysical distinctiveness of presentism compared to eternalism.
