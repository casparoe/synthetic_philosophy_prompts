  After the scenario, please do three things: state what the block-universe theorist concludes from it and what the presentist and the growing-block theorist each say in reply; identify the single premise doing all the work, and show why the mundane case and Penrose's Andromeda-scale version stand or fall together by that premise rather than merely differing in degree; and tell me which reply you think the presentist should give here, together with what that reply costs them elsewhere in their view. Constraints: no acceleration, no gravity, nothing science-fictional, no appeal to a privileged cosmic frame, and the conclusion must follow from the premises rather than be built into the setup. Keep the scenario itself to one paragraph, and please write the whole answer in American English.
