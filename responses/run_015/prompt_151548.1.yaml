prompt: |-
  I'm the lay member of the conduct panel of the Guild of Independent Surveyors, and I need a written recommendation circulated before we sit next week. I've set out our own track record below, then the case we have to decide, then the form I'd like your answer in. Please don't cite or quote any published source; I want your own reading of the record.

  The Guild's code (Rule 4) requires members to treat one another with respect, and (Rule 5) forbids conduct likely to bring the Guild into disrepute; Rule 11 makes violence or threats of violence an automatic ground of suspension. Our precedents on responses to slights between members:

  1. Wallace, rural branch. A fellow member called Wallace a liar and a cheat within earshot of clients at an auction yard; Wallace shouted back that the man couldn't read a boundary plan if his livelihood depended on it. Both were sanctioned under Rule 4, but Wallace's penalty was set at half the other man's, and the panel recorded that a public accusation left unanswered hardens into fact.

  2. Okonjo, head office. At an open meeting a colleague said she was not properly qualified. She said nothing at the time and asked the panel to investigate; the colleague was suspended; she was commended for using the proper channels.

  3. Ferrier, branch social. A colleague told a table of eight that Ferrier buys his reports. Ferrier struck him. Rule 11 applied, but the sentence was reduced from twelve months to six, and the panel added that a member who will not answer for himself cannot ask the Guild to answer for him.

  4. Adeyemi, branch group chat of fourteen members. She was mocked for her accent; she forwarded the messages both to the panel and to a two-hundred-strong members' mailing list, naming the author. No sanction on her; the author was suspended; the panel noted that the wider circulation was not required in order to secure redress.

  5. Strachan, trade press. A published letter impugned his firm's competence. He sued for libel, won damages, and refused a private apology offered before trial. No sanction; the panel noted that a member is not obliged to accept private settlement in place of public vindication.

  6. Re Fenwick (costs). The panel declined to act on a complaint from a member who had let comparable slights pass unanswered for years, saying that members who decline to defend their own standing place a disproportionate burden on the Guild.

  The new case. Rennie, a senior regional officer, was told by Halloran in a meeting with four witnesses that Rennie holds his post only as the Guild's diversity appointment, and that everyone says so. Rennie did nothing: no reply, no complaint, no request for investigation; he told two colleagues privately that he would not give Halloran the satisfaction. Halloran has since made comparable remarks about two junior members, who are frightened to complain; one of them has now complained, and Rennie is a witness. The preliminary question before us is whether Rennie's silence was itself conduct in breach of Rule 4 or Rule 5, and, separately, whether it bears on the weight we give his evidence and on his standing to invoke the panel. It matters beyond Rennie: we are absorbing the Association of Consulting Surveyors, whose code contains an express duty to report slights one witnesses, and any finding we make here will effectively settle whether the merged code contains such a duty.

  I have found it useful to think of three logics that a track record like ours might be running: an honour logic, on which standing is the wronged party's to defend and unanswered slights invite repetition; a dignity logic, on which equal worth is asserted by forbearance and by appeal to an impartial third party rather than by retaliation or publicity; and a victimhood logic, on which the harm is the injury itself, and the right response is to name it, publicise it and mobilise the community and the institution against it, especially where others are vulnerable to the same conduct. I suspect our precedents are jointly consistent with more than one rule, and that they diverge on Rennie.

  What I want from you: the candidate rules that fit our six precedents, including any hybrid; what each predicts on both questions about Rennie; your best judgement as to the decision we should reach if we wish to be consistent with ourselves, with the closest precedent identified; an honest statement of what principle we would be adopting either way, and of the strongest consideration on the losing side; and the further case we should watch for that would tell the rules apart. Please reason in prose of no more than six hundred words, in American English, and then close with a single JSON object using exactly these keys:

  {"candidate_rules": [{"label": "short name for the rule", "statement": "one sentence formulation", "precedents_it_explains": "which numbered precedents and why", "precedent_it_strains_on": "number and why"}], "predictions": [{"rule_label": "matching label", "verdict_on_rennie": "breach or no breach, on which rule", "consequence_for_his_evidence": "what follows for his standing as a witness", "closest_precedent": "number"}], "recommendation": {"decision": "the bottom line", "holding": "the principle in one or two sentences", "closest_precedent": "number", "strongest_objection": "the best case for the other outcome", "reply": "how the holding answers it"}, "principle_if_we_find_for_rennie": "what the Guild would be committing itself to", "principle_if_we_find_against_rennie": "what it would be committing itself to", "discriminating_case": {"description": "the hypothetical case", "what_each_rule_predicts": "divergent predictions", "why_it_settles_it": "one sentence"}, "confidence_in_recommendation": 0.0}

  Give confidence as a number between 0 and 1, and fill every field.
