      *   *Berlin:* Is it forced? Berlin's pluralism is about conflicting *moral* values (liberty vs. equality). Keynes is talking about *activities* (ballet vs. conversation). It's a category error to equate them directly. Better to say Keynes anticipates the *problem* Berlin solves, rather than saying Keynes *is* a Berlinian.
      *   *Ballet:* Make sure it links to the "cultivation" argument. Ballet requires training to appreciate. This supports the "people won't know what to do" point.

  5.  **Final Polish:**
