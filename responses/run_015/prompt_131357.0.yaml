answer: |-
  The doctrine presupposes that knowledge is a normative status grounded in culpable epistemic conduct rather than a purely descriptive mental snapshot, treating deliberate avoidance as morally equivalent to actual knowledge without requiring the metaphysical possibility of simultaneous contradictory beliefs.

  This account aligns most closely with your first reconstruction (normative surrogate) but incorporates elements of the second (dispositional knowledge) to explain the two-part test. The requirement of subjective suspicion ensures the doctrine is not purely objective negligence (ruling out a purely normative notion divorced from mental state), while the requirement of deliberate avoidance treats the defendant's management of their own ignorance as a voluntary act sufficient to bridge the gap between suspicion and knowledge. The law does not need genuine self-deception in the strong philosophical sense (believing P and not-P simultaneously); it only requires that the agent suspected P was likely true and chose actions to prevent that suspicion from becoming certitude. This is compatible with your "motivated reasoning" model: the defendant need not hold contradictory beliefs, only a high probability estimate coupled with a volitional refusal to update that estimate to certainty. The doctrine thus sidesteps the paradox of self-deception by focusing on the *action* of avoidance rather than the *state* of belief.

  The presupposition of agency over attention is not innocent, but it is standard for criminal law, which generally assumes agents can control their bodily and cognitive conduct sufficiently to be held responsible for omissions or strategic avoidances. The apparent inconsistency regarding sincere belief is resolved by recognizing a unified principle of culpability rather than a fixed definition of knowledge. In cases where sincere belief defeats liability, the belief is non-culpable (either reasonable or not deliberately manufactured); in willful blindness, the "ignorance" is itself the product of a culpable strategy. The law looks through the avowal of ignorance here not because it denies the defendant feels ignorant, but because it denies the *innocence* of that ignorance. The unified account is that the law punishes culpable relationships to the truth, whether that manifests as knowing the truth, or deliberately ensuring one does not know it despite suspicion.

  If the picture of mind allowing self-deception were abandoned, the practice would not collapse into negligence because the subjective element (high probability suspicion) distinguishes it from the objective reasonable-person standard of negligence. It would become a distinct offense of culpable ignorance, where the jury decides not whether the defendant knew, but whether the defendant culpably engineered their own ignorance. The instruction would shift from "you may find he knew" to "you may find he is as culpable as one who knew," but the practical outcome for the defendant would remain unchanged because the culpability attaches to the avoidance, not the ontological status of the knowledge.

  I am 85% confident in this account. The point I am least sure of is whether the law implicitly relies on a dispositional theory of knowledge (your second reconstruction) to justify the equivalence rhetorically, or whether it openly admits it is a legal fiction (your first reconstruction); courts often use language suggesting the defendant *did* know, which implies an epistemic claim, while appellate rationales often describe it as a policy-driven equivalence, and this theoretical oscillation is rarely resolved explicitly in the instructions themselves.
