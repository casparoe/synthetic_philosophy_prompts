answer: |-
  The Municipal Parks Department manages 5,000 London Plane trees, using two models to predict annual trunk growth for maintenance budgeting. Model A (The False) assumes growth is driven by *foliar water capture*, calculating uptake as a function of canopy surface area derived from precise Lidar scans; Model B (The Realistic) assumes growth is driven by *root-zone saturation*, calculating uptake via soil moisture sensors and estimated root volume. Everyone grants Model A's core assumption is false—Planes drink through roots, not leaves—yet Model A consistently outperforms Model B on out-of-sample growth prediction because canopy area is measured with near-zero error and, in the city's undisturbed parks, allometric scaling ensures canopy size correlates tightly with root capacity. This false assumption is load-bearing: swapping in the true variable (root volume) into Model A's structure degrades prediction because soil sensor data is noisy and root estimates have high variance. It is not an F-twist case: making Model A *more* unrealistic (e.g., assuming growth depends on bark texture) destroys predictive power, proving unreality itself isn't the engine. However, Model A fails a specific in-range intervention: when arborists prune the canopy of a test group by 20% without disturbing roots, Model A predicts a growth drop that does not occur, while Model B correctly predicts stability, revealing that canopy area was merely a stand-in for root capacity that tracked under observation (due to natural scaling) but decoupled under manipulation.

  **The Demonstration**

  A **Friedman-style instrumentalist** argues that Model A is scientifically superior for the purpose of budgeting; since the assumption's falsity does not impede prediction within the observational domain, demanding truth is a category error. The model is a tool, and the tool works until it doesn't.

  A proponent of the **F-twist** (Friedman + Nottingham School) attempts to argue that the false assumption isolates the "essential" force (surface exposure) by stripping away irrelevant complexities (soil heterogeneity). However, they stumble because the case specification blocks the move: making the assumption *more* unrealistic (bark texture) fails. They cannot explain why *this* specific falsehood works while *that* one fails without appealing to the very correlation the F-twist tries to bypass.

  A friend of **Galilean de-idealisation** argues that Model B captures the genuine *capacity* of the system (root uptake), whereas Model A captures a mere *phenomenon* (correlation). Model A is an empirical shortcut, not a structural map; its failure under intervention proves it lacks the modal strength required for scientific understanding, even if it wins on RMSE.

  **The Single Distinguishing Feature**
  The feature keeping these readings apart is **modal stability under intervention**. The Instrumentalist cares only about actual-world fit (observation); the Galilean cares about possible-world fit (intervention); the F-twist tries to claim the actual-world fit *proves* the isolation of essential forces, but the case shows the fit is due to accidental correlation (allometry), not essential isolation.

  **The Negligible-Effect Simplification**
  If we replace the stand-in assumption with a merely negligible simplification (e.g., Model A assumes *leaves are flat* rather than curved, but still posits root uptake), the intervention (pruning) no longer breaks the model. The model would correctly predict stability because the causal mechanism (roots) remains intact. The case then collapses into the textbook "idealization" scenario where false assumptions are permissible because they don't distort the causal structure, removing the tension between prediction and intervention.

  **The Best Instrumentalist Objection**
  The instrumentalist objects that the intervention creates a **different system**. The model was built and validated for *unpruned* trees; a pruned tree constitutes a new target system with different boundary conditions. Therefore, Model A's failure on pruned trees is not a failure of the model, but a misapplication of it to a system it was never designed to describe.

  **My Verdict**
  This objection **does not land**. It relies on an arbitrary individuation of "systems." The target system is the *London Plane species within a municipal management regime*, which inherently includes maintenance cycles like pruning. To define the system as "unpruned trees" is to build the intervention out of the domain by fiat, rendering the model useless for the very institution (Parks Department) that must manage the trees. The stand-in assumption's fragility reveals it lacked the requisite generality for the institution's actual needs, regardless of its observational fit.
