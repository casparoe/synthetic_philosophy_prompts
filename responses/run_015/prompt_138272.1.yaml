answer: |-
  Good morning.

  This firm started in 1981. For forty years, it has made things. Castings, machined parts, components that go into other things. We have 180 people here. Some of you have been here since the beginning. Some of you started last month. All of you do the work.

  Two years ago, my father transferred sixty per cent of the equity into an employee ownership trust. Today, the remaining forty per cent transfers. The family seat on the board is now empty. I remain as Finance Director. I will also serve as the non-voting Chair of the Trust Board for three years, to manage the handover. After that, the structure is yours to operate.

  I want to be clear about what this is. It is not a reward. It is not an act of generosity. It is a change in the rules of how we operate and how the money is divided.

  Under the new deed, one third of net profit each year will be paid as a bonus. This bonus is equal per capita. It is not scaled to salary. It is not scaled to seniority. A senior machinist and an apprentice receive the same bonus share. I know some of you think this is unfair. I know some of you think this scheme is a pay cut with speeches attached. I am not going to tell you that you were always the real owners. You were not. You were employees. Now you are members of a trust that owns the company. There is a difference.

  There is another clause in the deed. Ten years from today, the employee-members may hold a vote. If two-thirds of you agree, you can direct the trustees to sell the company to the highest bidder. The proceeds would be divided per head. My father argued for this alone. He said that if you cannot be trusted with the door, you are not owners, you are residents. This clause is not a threat. It is not a dare. It is a confirmation. It means the asset belongs to you enough that you can choose to liquidate it.

  Why do this? There is a theory that people will work as hard, and as carefully, and invent as much for a common stake as they will for a wage under a manager. It is a claim about human nature. No one knows if it is true. It cannot be settled by argument. It can only be settled by trial at real scale, with real money at stake.

  John Stuart Mill wrote about this a hundred and fifty years ago. He said that the only honest form of socialism is a voluntary experiment, competing in the open market, free to fail. He defended competition. He saw it as the discipline people still need while they are as they are. It is the only test that keeps the experiment honest.

  So we are not leaving the market. We are not opting out of competition. There are firms in this valley and abroad who do not have these rules. They will try to take our work. They will try to undercut our prices. If we cannot compete with them, we will fail. If we fail, the trust holds nothing. I am not telling my father's friends that profit has been found out. I am not telling the federation director that the wage system is ending. I am telling you that we are entering a contest. We are testing whether a different set of incentives can survive against the standard ones.

  This requires honesty about what we do not know. We do not know if you will keep the cooperative rules and still survive against competitors who have no such rules. We do not know if you will tolerate an equal bonus when a senior machinist can point to what he produces. We do not know if in year ten you will take the money.

  Some of you believe this will work. Some of you believe it will not. My brother runs the machine shop. He voted against the transfer. He will tell you why at the reception. He is not wrong to dissent. Agreement is not a requirement for this to proceed, but engagement is.

  We need the work to be good. The trust does not protect us from bad casting or missed tolerances. [Insert specific detail about the shop floor, e.g., When the furnace hits 1,500 degrees, or When the CNC measures within five microns]. That work remains the same. The market does not care about our ownership structure. It cares about whether the part fits.

  I am aware of the people in this room who have been here twenty years. You have seen schemes come and go. You have seen management change. You know that words on a page do not keep the lights on. I am not asking for your faith. I am asking for your participation in a test.

  I am aware of the people who think my father has lost his nerve. He has not. He is stepping aside because the structure requires him to. He is not giving you a gift. He is removing himself as the barrier between you and the risk.

  I am aware of the wider interest in this. There are people outside who want this to be a symbol. It is not a symbol. It is a firm. It makes things. It pays wages. It pays bonuses. It competes. If it succeeds, it may be a model. If it fails, it is a lesson. Both outcomes are useful.

  The Federation Director will speak after me. He may call this the beginning of the end of the wage system in the valley. I will not contradict him. I will not endorse him. I will say that for us, it is the beginning of a specific arrangement. Whether it spreads is not for us to decide. Whether it works is for us to find out.

  We are not promising success. We are promising transparency. The accounts will be open. The rules are written. The exit door is unlocked.

  For the next three years, I will serve the Trust. I will not vote. I will monitor the finances. I will ensure the rules are followed. After that, I am one of you. I have given up a job in London to come back. I am not here to manage you. I am here to work alongside you.

  There is a risk in this. The risk is not just financial. The risk is that we try this, and we find that we prefer the old way. That is a valid finding. The risk is that we try this, and we find that we cannot make it pay. That is a valid finding. The only invalid outcome is pretending we know the answer before we begin.

  Mill said that competition is necessary while people are as they are. We are as we are. We are not angels. We are not comrades. We are workers and managers and owners, sometimes all at once. We will have disagreements. We will have disputes about money. We will have disputes about strategy. The trust structure gives us a way to settle them. It does not remove the need to settle them.

  So, here is the position. We are outgrowing the wage system in this room. We are testing whether a common stake produces better work. We are doing it in the open market. We are free to fail. We are free to sell.

  I cannot tell you how this turns out. No one can. I can only tell you that the question is worth asking. The only way to answer it is to live it.

  We have the tools. We have the orders. We have the floor. The rest is unknown. Let us find out.

  Thank you.
