      *   **Problem:** Existing records reflect power structures (renters, immigrants, marginalized groups appear only as subjects/entries, not creators). Acknowledges archives are not neutral.
      *   **Goal:** A *written procedure* (not principles) for Appraisal and Description.
      *   **Key Requirement:** Treat "gaps/silences" as objects to be documented. Needs a "Silence Note" system with specific tests/standards for different types of silence (never created, destroyed, elsewhere, unrenderable, created by archive).
      *   **Governance:** Must define where staff says "no" vs. where the Community Advisory Panel (CAP) decides (values vs. facts).
      *   **Meta-Archive:** Must address whether the archive's own paperwork (refusals, destruction logs) should be captured.
      *   **Board Dispute:** Active collecting from under-recorded communities. *Must commit* to a side (don't hedge).
      *   **Case Studies:** Run the procedure on three specific scenarios:
          1.  Property Management Co. (1974-2003) + Naming Rights condition.
          2.  Ghanaian Congregation Cassettes (Language barrier, privacy issues, donor consent issues).
