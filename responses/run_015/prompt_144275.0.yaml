  2.  **Deconstruct the Core Challenges:**

      *   *Capacity vs. Ethics:* You can't save everything, but saving only "power" records perpetuates silence.
      *   *The "Silence Note":* Needs to be operationalizable for a volunteer. It can't be abstract theory. It needs categories and evidence requirements.
      *   *The Board Dispute:* Active collecting. The user suspects it reproduces asymmetry. I need to commit. *Decision:* Active collecting is necessary but *only* if paired with community custodianship or co-description. Pure extraction is bad. However, given the resource constraints (moving, deaccessioning), active collecting *right now* might be irresponsible. I will argue for a "Community Custody" model over "Archive Custody" for active collecting in this specific context.
      *   *Meta-Archive:* Should we keep records of what we threw away? Yes, absolutely. It's the only way to audit the "silence we are creating."
      *   *The "Dislike" Answer:* I need to ensure one case result is painful. The Councillor Papers (Case 3) are the obvious candidate. They fit the mission, have money, but hog capacity. The procedure should likely reject or severely limit them to make space for Case 2, which is ethically urgent but resource-heavy. Or, Case 1 (Property Management) should be rejected despite the naming gift because of the ethical cost. Let's aim for rejecting Case 3 (the "safe" choice) to prioritize capacity for community records, or accepting Case 1 with heavy caveats. Actually, the prompt asks for an answer I *dislike*. Rejecting the Councillor Papers (money + traditional fit) is the most painful but necessary choice for a modern archive. Or, accepting the Property Management records but stripping the naming rights. Let's go with rejecting the Councillor Papers due to capacity/impact ratio.

  3.  **Drafting the Procedure (The "Silence-Aware Appraisal & Description Protocol" - SAADP):**

      *   *Structure:* Intake Triage -> Appraisal (The 4 Silence Tests) -> Description (The Silence Note) -> Governance (Staff vs. Panel).
      *   *The Silence Tests:*
          1.  *Structural Silence (Never Created):* Did the power dynamic prevent creation? (Evidence: Oral history, comparison with similar jurisdictions).
          2.  *Destructive Silence (Destroyed):* Was it created and lost? (Evidence: References in other docs, destruction logs).
          3.  *Displaced Silence (Elsewhere):* Does it exist but not here? (Evidence: Knowledge of other repositories).
