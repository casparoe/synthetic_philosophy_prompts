answer: |-
  # STANDARD OPERATING PROCEDURE 4.0: APPRAISAL, SILENCE, AND ACCESSIONING
  **Effective Date:** Immediate
  **Applicability:** All Staff and Volunteers
  **Review Cycle:** 12 Months

  ## 1. PREAMBLE: THE ARCHIVE AS ACTOR
  This archive does not collect "history." It collects evidence of power and its residues. Every box we accept creates a silence elsewhere by consuming processing hours, shelf space, and attention. This procedure treats **Silence** as a physical attribute of a collection, to be measured and recorded alongside box counts and dates.

  ## 2. THE META-ARCHIVE RULE
  **Procedure:** The archive shall maintain a permanent, accessioned series titled *Administrative History: Appraisal Decisions*.
  **Content:** This series must contain:
  1.  **Refusal Logs:** Date, donor, description of offered material, reason for refusal.
  2.  **Deaccession Logs:** Date, description of removed material, destination (destruction/transfer), authorization.
  3.  **Processing Backlog Reports:** Quarterly count of unprocessed linear feet by collection.
  **Rationale:** These documents are the only audit trail of the silences *we* create. They are not administrative ephemera; they are core records. Do not destroy them.
  **Judgment Call:** *We are prioritizing the record of our own bias over the potential storage space of a marginal collection. If space becomes critical, deaccession duplicate municipal reports before destroying Refusal Logs.*

  ## 3. APPRAISAL PROTOCOL: THE FOUR SILENCE TESTS
  Before a collection is accepted, the Appraising Archivist (AA) must complete the **Silence Impact Statement (SIS)**. This requires checking one of the following four categories. A volunteer can execute this using the checklist below.

  ### Test A: The "Never Created" Silence
  *Question:* Does this gap exist because the people involved lacked the power to generate records?
  *Evidence Required:* Comparison with a similar collection where records *do* exist (e.g., "We have landlord ledgers, but no tenant diaries").
  *Action:* If **YES**, you must identify a parallel source (oral history, community newspaper) to contextualize the collection. If no parallel source exists, **flag for Community Advisory Panel (CAP)**.

  ### Test B: The "Destroyed" Silence
  *Question:* Is there evidence these records existed but were lost (fire, purge, neglect)?
  *Evidence Required:* A reference in a different collection (e.g., a council minute mentioning a report that is now missing).
  *Action:* If **YES**, create a "Ghost Record" entry in the catalogue. Do not accept surrogate material unless it explicitly references the loss.

  ### Test C: The "Displaced" Silence
  *Question:* Do these records exist but are held in a language, format, or location we cannot access?
  *Evidence Required:* Knowledge of the material's existence (e.g., "The church has books in Twi," "The tenants have text messages").
  *Action:* If **YES**, do not accession the physical items unless you have the capacity to translate/process them within 12 months. Offer technical support for *their* custody instead.

  ### Test D: The "Archival" Silence (Created by Us)
  *Question:* Are we creating this silence by refusing, deferring, or lacking capacity?
  *Evidence Required:* The Processing Backlog Report (see Section 2).
  *Action:* If accepting this collection pushes unprocessed material over 30% of total holdings, **automatic decline** unless specific funding is attached to clear the backlog.

  ## 4. DESCRIPTION PROTOCOL: THE SILENCE NOTE
  Every finding aid must include a standardized box titled **"Statement on Silences."** This is not an "Abstract." It is a warning label.
  **Volunteer Instruction:** Select the applicable bolded phrase and fill in the bracketed text.

  *   **We do not hold records created by [Group Name].** This collection describes them only as [subjects/entries]. To hear their voices, consult [Alternative Source].
  *   **Records created by [Group Name] were likely destroyed.** Evidence of this loss appears in [Reference Document].
  *   **Records exist in [Language/Format] but are not held here.** They are likely held by [Community/Repository].
  *   **We have declined related material.** The archive evaluated [Description] on [Date] but declined due to [Capacity/Privacy/Ethics]. See *Administrative History: Appraisal Decisions*.

  ## 5. GOVERNANCE: STAFF VS. PANEL
  **Staff Authority (Fact & Capacity):**
  *   Determining physical capacity (linear feet).
  *   Determining processing capacity (hours available).
  *   Identifying legal/privacy risks (PII, immigration status).
  *   *Rule:* If the math says "no," the answer is "no."

  **Community Advisory Panel Authority (Values & Ethics):**
  *   Approving collections that document marginalized groups where the archive lacks cultural competency.
  *   Deciding on naming rights attached to donations.
  *   Resolving conflicts between "Historical Value" and "Community Harm."
  *   *Rule:* If the issue is "Should we?" rather than "Can we?", it goes to the Panel.

  ## 6. POSITION ON ACTIVE COLLECTING (BOARD DISPUTE)
  **Decision:** The archive will **NOT** actively collect physical materials from under-recorded communities for immediate custody.
  **Rationale:** Collecting material from marginalized communities into a municipal building, describing it in English, under our retention schedules, reproduces the asymmetry you suspect. It extracts cultural heritage to feed the archive's need for diversity.
  **Alternative Procedure:** The archive will operate a **"Community Custody Grant."** We will provide equipment, metadata templates, and storage advice to community groups who wish to archive themselves. We will link to their catalogues, not ingest their boxes. We only take physical custody if the community explicitly requests permanent preservation *and* we have verified processing capacity.
  **Judgment Call:** *This prioritizes ethical relationships over collection growth. It will result in slower growth of "diverse" holdings in the short term.*

  ***

  # CASE STUDY APPLICATIONS

  ### CASE 1: Property Management Company Records (1974–2003)
  **Offer:** Eviction files, ledgers, photos. Condition: Reading Room named for founder.
  **Appraisal:**
  *   **Test A (Never Created):** Tenants did not create these; they are subjects. **PASS.**
  *   **Test D (Archival Silence):** Accepting this consumes processing hours. **PASS.**
  *   **Governance:** Naming rights are a **Values** issue. Must go to CAP.
  *   **Meta-Archive:** If declined, log the refusal.

  **Decision:** **DECLINE PHYSICAL CUSTODY.**
  **Reasoning:** The collection documents tenants solely as defendants and debtors. Accepting it without counter-narrative reinforces the "Structural Silence." The naming rights condition is an ethical violation (paying for prestige with data on the vulnerable).
  **Exception:** Offer to digitize the *Rent Ledgers* only (names/amounts/dates) for an index, provided the CAP approves. This allows genealogical data access without storing the trauma of eviction files or granting the naming right.
  **Silence Note:** *"We do not hold records created by tenants of this property. This collection describes them only as debtors and defendants. To hear their voices, consult [Local Oral History Project]."*

  ### CASE 2: Ghanaian Congregation Cassettes (1989–2004)
  **Offer:** 200 cassettes (Twi/English), immigration discussions. Donor: Departing Pastor. Consent: None from recorded subjects.
  **Appraisal:**
  *   **Test C (Displaced):** Records exist in a language staff cannot render. **FAIL.**
  *   **Legal/Privacy:** Contains PII (immigration status). Staff cannot redact audio. **FAIL.**
  *   **Active Collecting Rule:** Violates the "Community Custody" protocol.

  **Decision:** **DECLINE PHYSICAL CUSTODY. OFFER TECHNICAL SUPPORT.**
  **Reasoning:** We cannot process what we cannot understand. We cannot legally hold PII we cannot secure. Taking these would create an "Archival Silence" (they would sit in a box unprocessed for 20 years).
  **Action:** Offer the pastor a grant for a digitization scanner. Help the congregation catalog the tapes themselves. We will host a link to their digital archive on our website.
  **Silence Note (in our catalogue):** *"Records exist in Twi and English but are not held here. They are likely held by the [Congregation Name]. We declined custody to ensure community control over sensitive immigration data."*

  ### CASE 3: City Councillor Papers (40 Linear Feet)
  **Offer:** 40 LF, cash endowment, fits existing holdings.
  **Appraisal:**
  *   **Test D (Archival Silence):** 40 feet consumes ~100% of annual processing capacity (based on 8 collections/year avg). **FAIL.**
  *   **Active Collecting Rule:** This is "traditional" collecting that crowds out community work.
  *   **Capacity:** We are moving in 18 months. We must deaccession 33%. Adding 40 feet is irresponsible.

  **Decision:** **DECLINE.**
  **Reasoning:** This is the answer you will dislike. It fits your traditional mission, it has money, and it is "safe." But it is an ethical failure. Accepting 40 feet of elite papers consumes the capacity needed to process the *next* ten offers from community groups. The endowment does not cover the opportunity cost of the silence it creates.
  **Action:** Negotiate to take only the *Speeches and Press Releases* (approx. 2 feet) to document the political output, decline the correspondence and subject files. If the donor refuses, walk away.
  **Silence Note:** *"We have declined related correspondence and subject files to preserve processing capacity for under-documented community records. See Administrative History: Appraisal Decisions."*

  ***

  # LIMITATIONS AND REVISION NOTE

  **What This Procedure Cannot Do:**
  This procedure cannot fix the past. It cannot conjure records that were never made. It creates a bureaucracy of guilt that may slow down your work and frustrate donors who just want their boxes taken. It relies on a Community Advisory Panel that may not always be available or decisive. It assumes you have the courage to turn down money (Case 3) and prestige (Case 1).

  **Most Likely Revision:**
  In three years, I expect you will revise **Section 6 (Active Collecting)**.
  **Why:** The "Community Custody Grant" model is ethically sound but labor-intensive for your staff. Supporting external archives requires outreach, training, and trust-building that a staff of 1.5 FTE may not sustain. You will likely find that communities do not want to be their own archivists; they want you to do it. You will be forced to choose between ethical purity and actual preservation. You may have to revert to collecting physical materials from under-recorded groups, but you must bind it to a strict "Co-Description" rule (community members must be paid to write the finding aids).

  **Final Judgment:**
  The hardest step here is **Case 3**. You are trained as a historian to save the papers of political actors. They are the "easy" history. Turning them down to make space for the *possibility* of harder, messier community records is a gamble on a future you cannot guarantee. Take the gamble. If you fill the new building with Councillor papers, you have just built a larger monument to the same silence you are trying to escape.
