answer: |-
  ### Desiderata for a Theory of Valid Consent

  An adequate theory of valid consent must function not merely as a checklist for standard transactions but as a normative framework capable of adjudicating edge cases where autonomy, information, and power intersect ambiguously. The following desiderata specify the conditions such a theory must satisfy, distinguishing between foundational necessities and theoretical preferences.

  #### 1. The Desideratum of Implicature Integrity
  **Requirement:** The theory must invalidate consent secured through propositions that are literally true but pragmatically deceptive, specifically where the speaker intends the consenter to draw a false inference that is material to the decision.
  **Motivating Case:** A researcher states, "This drug has no known side effects," knowing that studies are incomplete but technically no side effects are *currently known*. The consenter reasonably infers safety, but the framer exploits the gap between literal truth and reasonable inference.
  **Status:** **Non-negotiable.** A theory that validates consent based solely on propositional truth fails to protect the autonomy of the consenter, as autonomy relies on the *meaning* understood by the agent, not just the semantic accuracy of the offeror. Distinguishing this from mere post-hoc regret is essential; the invalidity arises from the manipulation of the epistemic environment at the time of agreement, not the outcome.

  #### 2. The Desideratum of Structural Voluntariness
  **Requirement:** The theory must provide a criterion for distinguishing between hard choices (which are compatible with valid consent) and coercive structures (which are not), even in the absence of a specific coercive agent issuing a threat.
  **Motivating Case:** An employee consents to a non-disclosure agreement within a company town where all housing is employer-owned. There is no explicit threat ("Sign or be evicted"), but the institutional structure systematically suppresses alternatives.
  **Status:** **Camp-Dependent.** Libertarian-leaning accounts typically reject this, viewing the absence of a specific threat as sufficient for voluntariness. Structuralist or relational accounts treat this as non-negotiable, arguing that background injustice can vitiate consent. An adequate theory must at least acknowledge this tension, even if it resolves it by setting a threshold for "acceptable background pressure."

  #### 3. The Desideratum of Decision-Relative Competence
  **Requirement:** Competence must be assessed relative to the specific risk and complexity of the decision at hand, not as a global status of the agent.
  **Motivating Case:** An individual with a diagnosed cognitive impairment retains the capacity to consent to low-risk social activities but lacks the capacity to consent to complex financial derivatives.
  **Status:** **Non-negotiable.** Global assessments of rationality unjustifiably strip agency from vulnerable populations. The theory must allow for "sliding scale" competence where the threshold of understanding required rises with the riskiness or irreversibility of the act.

  #### 4. The Desideratum of Scope and Foreseeability
  **Requirement:** The theory must delineate the boundary between the act consented to and the downstream consequences that fall outside the scope of that consent, particularly when consequences are structurally unforeseeable.
  **Motivating Case:** A patient consents to a surgical procedure to remove a tumor, understanding the immediate risks. However, the surgery triggers a rare, cascading hormonal imbalance that alters personality traits fundamentally. The act (surgery) was understood; the consequence (personality alteration) was not.
  **Status:** **Camp-Dependent.** Specificity accounts require consent for every foreseeable sub-step and major risk profile. Authorization accounts allow for broad consent over a domain (e.g., "medical treatment") trusting the agent's judgment to the professional. An adequate theory must specify where the "object of consent" ends—whether it is the physical token act or the risk-weighted outcome.

  #### 5. The Desideratum of Normative Decay
  **Requirement:** The theory must account for the loss of consent's normative force due to significant changes in the consenter's epistemic or volitional state, even without formal revocation.
  **Motivating Case:** An individual consents to a long-term data sharing agreement while in a stable emotional state. Later, they enter a period of severe depression or acquire new information that fundamentally alters the value of the privacy they sold, yet they do not formally revoke consent due to inertia or incapacity.
  **Status:** **Principled Tension.** This is non-negotiable in the sense that a theory must *address* it, but the resolution is contested. If consent is a one-time performative act (like a promise), it should not decay. If consent is an ongoing attitude of will (like permission), it may decay. An adequate theory cannot ignore the temporal dimension of authority.

  ***

  ### Non-Negotiable vs. Camp-Dependent Distinctions

  To ensure the theory is robust, the following classifications must be maintained:

  **Non-Negotiable Requirements:**
  1.  **Invalidity vs. Regret:** The theory must rigorously distinguish between consent that was defective *ab initio* (invalid) and consent that was valid but later regretted. Conflating these undermines the stability of social agreements.
  2.  **Decision-Relative Competence:** As noted above, global competence assessments are inadmissible.
  3.  **Protection Against Malicious Deception:** Consent obtained through intentional manipulation of reasonable inferences (Implicature Integrity) must be categorized as invalid, not merely unethical.

  **Camp-Dependent Preferences:**
  1.  **Threshold of Disclosure:** Whether consent requires "full informational disclosure" (all material facts) or "substantial understanding" (the gist of the matter) varies between information-centered and voluntariness-centered accounts.
  2.  **Definition of Coercion:** Whether coercion requires a human agent making a threat (interpersonal) or can be constituted by unjust background conditions (structural).
  3.  **Specificity of Object:** Whether consent must be granular (act-specific) or can be anticipatory/broad (policy-specific).

  ***

  ### Jointly Unsatisfiable Desiderata and Tensions

  Certain desiderata create tensions that appear jointly unsatisfiable under a single rigid framework.

  **Tension 1: Maximal Information vs. Practical Feasibility**
  *   **The Conflict:** Satisfying *Implicature Integrity* and *Scope/Foreseeability* suggests a need for exhaustive disclosure of all material risks and framing contexts. However, in time-pressured clinical or emergency contexts, this undermines *Decision-Relative Competence* (due to information overload) and practical feasibility.
  *   **Resolvability:** **Contextual Indexing.** This tension is resolvable by indexing the standard of disclosure to the urgency and reversibility of the context. In emergencies, the threshold for valid consent shifts from "informed" to "presumed" or "minimal," prioritizing welfare over strict autonomy. This is not a principled contradiction but a contextual modulation.

  **Tension 2: Subjective vs. Objective Coercion**
  *   **The Conflict:** *Structural Voluntariness* demands we look at objective constraints (suppressed alternatives). However, respecting autonomy often requires deferring to the subject's *felt* experience of freedom. If an agent feels free in an objectively coercive structure, validating their consent respects their agency but ignores the injustice. If we invalidate it based on objective structure, we paternalistically override their felt will.
  *   **Resolvability:** **Principled.** This is a principled tension between the value of autonomy (subjective will) and the value of justice (objective conditions). It is not fully resolvable. An adequate theory must choose a priority: either consent validates the transaction regardless of background justice (prioritizing autonomy), or background injustice vitiates consent regardless of subjective feeling (prioritizing justice). Most hybrid theories attempt to split the difference by setting a "baseline of decency" below which consent is impossible, but the margin remains contested.

  **Tension 3: Stability vs. Responsiveness (The Decay Problem)**
  *   **The Conflict:** For consent to be useful to the recipient (reliance), it must be stable (*Non-Revocation*). For consent to respect the consenter, it must be responsive to internal changes in will or epistemic state (*Normative Decay*). Requiring both creates a paradox where the recipient cannot rely on the consent, or the consenter is bound by a past self they no longer identify with.
  *   **Resolvability:** **Contextual Indexing with Principled Limits.** This is partially resolvable by distinguishing between *transactional consent* (single act, high stability required) and *relational consent* (ongoing permission, high responsiveness required). However, a principled limit remains: there must be a "point of no return" (e.g., once resources are irreversibly committed based on reliance) where decay is no longer permitted to invalidate the act, shifting the remedy from invalidation to compensation.

  ***

  ### Performance of Major Accounts

  **Information-Centered Accounts:**
  These accounts fare well on *Implicature Integrity* and *Scope/Foreseeability*, as they prioritize the epistemic conditions of the agent. However, they struggle with *Structural Voluntariness*, often missing coercion that does not involve information asymmetry. They also face the greatest difficulty with the *Maximal Information vs. Feasibility* tension, often demanding impractical disclosure standards in complex contexts.

  **Voluntariness-Centered Accounts:**
  These accounts excel at handling *Structural Voluntariness* (if defined broadly) and *Normative Decay*, as they focus on the will of the agent over time. However, they risk collapsing the distinction between *Invalidity and Regret*; if the will changes, consent might be deemed retroactively invalid too easily. They also struggle with *Implicature Integrity* if the agent "voluntarily" accepted the misleading frame without feeling forced.

  **Relational-Autonomy Accounts:**
  These accounts handle *Structural Voluntariness* and *Decision-Relative Competence* best, viewing the agent as embedded in a social context. They navigate the *Stability vs. Responsiveness* tension by viewing consent as a communicative process rather than a discrete event. However, they often lack clear bright-line rules for *Scope and Foreseeability*, making it difficult to determine exactly when a specific act exceeds the relational permission granted, potentially leading to uncertainty for the recipient of consent.

  An adequate theory must likely synthesize these: adopting the epistemic rigor of information-centered views, the will-respect of voluntariness views, and the contextual sensitivity of relational views, while explicitly accepting that the tensions between structural justice and individual reliance cannot be fully eliminated, only managed through contextual indexing.
