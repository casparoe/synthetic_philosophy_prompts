answer: |-
  In a standard sleep laboratory, a participant undergoes the Sleeping Beauty protocol: a fair coin is tossed; if Heads, she is awakened once (Monday); if Tails, she is awakened twice (Monday and Tuesday), with induced amnesia between awakenings. Upon waking, she is fully informed of the protocol and offered two independent bets on the proposition that the coin landed Tails, each costing $p$ and paying 1 unit if Tails, 0 if Heads. Bet A is indexed per-awakening: every acceptance incurs the cost and yields the payoff independently for that awakening. Bet B is indexed per-world: for each coin outcome, exactly one of her awakenings is selected at random to be binding; only the binding acceptance incurs the cost and yields the payoff, while void acceptances cost nothing and pay nothing. She is not told which acceptance is binding, only the selection rule.

  The rational maximum price for each bet is derived from expected utility maximization given the objective 50/50 coin chance. For Bet A, consider the strategy of accepting at every awakening. In a Heads world (probability 0.5), there is one awakening; net utility is $-p$. In a Tails world (probability 0.5), there are two awakenings; net utility is $2(1 - p)$. The expected utility is $0.5(-p) + 0.5(2(1 - p)) = 1 - 1.5p$. Setting this to zero yields a break-even price of $p = 2/3$. For Bet B, using the same strategy of accepting at every awakening: in a Heads world, the single awakening is binding; net utility is $-p$. In a Tails world, one of the two awakenings is selected as binding; net utility is $1 - p$ (the void awakening contributes 0). The expected utility is $0.5(-p) + 0.5(1 - p) = 0.5 - p$. Setting this to zero yields a break-even price of $p = 1/2$. Thus, at the same moment, on the same evidence, the rational betting rate for Tails is 2/3 for Bet A and 1/2 for Bet B.

  This divergence demonstrates that betting rates cannot settle the credence dispute. If betting rates revealed credence, the agent's credence in Tails would simultaneously be 2/3 and 1/2, which is impossible for a single doxastic state. The Halfer claims credence is 1/2; the Thirder claims 2/3. Neither single value rationalizes both prices. The structural feature driving the difference is solely the payoff indexing: Bet A weights the Tails outcome twice because it generates two decision points, while Bet B weights it once because it generates only one settlement. Rational betting behavior here tracks the expected frequency of payoffs, not the subjective probability of the proposition.

  Two ablations confirm that indexing, not credence, drives the prices. First, equalize the indexing rules. If both bets are indexed per-awakening, the calculation for both becomes $1 - 1.5p$, collapsing both prices to 2/3. If both are indexed per-world, the calculation for both becomes $0.5 - p$, collapsing both prices to 1/2. The divergence disappears when the rules match. Second, equalize the awakening schedule. Suppose the protocol yields one awakening on Heads and one on Tails (e.g., Tails triggers Tuesday only). The objective chance of Tails is 1/2. Under per-awakening indexing, expected utility is $0.5(-p) + 0.5(1 - p) = 0.5 - p$, yielding a price of 1/2. Under per-world indexing, the result is identical. When the number of awakenings is equalized, both prices converge to the objective coin chance, regardless of indexing.

  The strongest objection arises from the Halfer camp regarding Bet B. Since only one choice per world matters, the Halfer argues she should conditionalize on the evidence that her current choice is the binding one. Given standard Halfer priors (P(Heads)=1/2), and knowing that P(Binding|Heads)=1 while P(Binding|Tails)=1/2, Bayes' theorem yields P(Heads|Binding)=2/3. If correct, her credence in Tails drops to 1/3, implying a betting price of 1/3, contradicting the derived 1/2. This conditionalization is incorrect. At the moment of decision, the agent does not know she is binding; she knows only the protocol governing selection. Conditionalizing on "I am binding" treats a probabilistic feature of the payoff structure as empirical evidence about the world state. The expected utility calculation already accounts for the probability of being binding (the 0.5 factor in the Tails term); updating on it again double-counts the selection mechanism. If the Halfer rejects this conditionalization, she maintains her credence of 1/2, which aligns with the 1/2 price only because the indexing weight is neutral, confirming that the price is fixed by the contract structure, not her credence.

  This case shows that rational betting rates are functions of payoff indexing rules rather than pure reflections of credence, rendering Dutch-book arguments incapable of resolving the Halfer–Thirder dispute.
