answer: |-
  ### 1. The Philosophical Fork & The Decision

  You are correct that the consultant's rule ("want more") fails. It captures **craving** (chips) but misses **flow** (work) and **relief** (itch). It also fails to distinguish between wireheading (stimulation without value) and eudaimonia (value without immediate fun).

  **The Fork:**
  *   **Option A (Felt Quality):** Pleasure is a specific sensory "hum."
      *   *Result:* Flow scores 0 (no sensation reported). Pride scores 0 (cognitive, not sensory). Your daily number becomes a "Sensory Gratification Index," not a well-being score.
  *   **Option B (Pro-Attitude):** Pleasure is wanting an experience to continue or recur.
      *   *Result:* Addiction scores High (craving). Masochism scores High (endurance). Your daily number becomes a "Compulsion Index."

  **The Decision:**
  We are adopting a hybrid: **Endorsed Experience.**
  *   **Definition:** An experience counts as pleasure if the writer **values** it (explicitly or implicitly) AND does not report a **disconnect** between their drive and their enjoyment.
  *   **What we drop:** We drop the requirement for a "happy feeling." Flow and Pride count.
  *   **What we keep:** We keep the requirement for "subjective endorsement." We do not infer value the writer denies.
  *   **The Cost:** We conflate "fun" (eating a peach) with "satisfaction" (finishing a proof). The daily number is a **Positive Valence Score**, not a "Hedonic Joy Score." If the funder wants "Joy," this codebook will over-report on productive days and under-report on lazy days.

  ---

  ### 2. The Decision Procedure (Codebook v4.2)

  **Time Limit:** 90 Seconds.
  **Goal:** Assign Score 0–3.
  **Rule of Thumb:** Trust the text over your psychology. If they say it wasn't good, it wasn't good.

  **Step 1: The Positive Signal (Scan for these)**
  *   **Explicit:** "Good," "great," "happy," "love," "glad," "proud," "relieved," "fun," "warm."
  *   **Implicit (Flow):** "Time disappeared," "didn't notice," "absorbed," "in the zone."
  *   **Implicit (Relief):** "Stopped hurting," "finally over," "quiet," "release."
  *   *If NO signal found → **Score 0**. Stop.*
  *   *If YES signal found → Go to Step 2.*

  **Step 2: The Compulsion Veto (Scan for these)**
  *   **Keywords:** "Couldn't stop," "regret," "hate that I," "didn't like," "craving," "ashamed," "wish I hadn't."
  *   **The Test:** Does the writer indicate they wanted the *action* to stop while it was happening, or that the drive was unwanted?
  *   *If YES (Compulsion found) → **Score 0**. Stop.* (This kills the chips/addiction cases).
  *   *If NO (No Compulsion) → Go to Step 3.*

  **Step 3: The Endurance Check (The "Hated It" Rule)**
  *   **Context:** Did they report pain/hate *during* the event but value the *outcome*? (e.g., "Hated the run, glad I finished.")
  *   **The Test:** Do they intend to repeat the activity voluntarily?
  *   *If YES (Repeat intended) → **Score 1** (Low/Mixed Pleasure).* (This captures eudaimonia without conflating it with joy).
  *   *If NO (No repeat intent/ambiguous) → Go to Step 4.*

  **Step 4: Magnitude Scoring**
  *   **Score 1 (Relief/Quiet):** "Relieved," "calm," "warm," "okay," "stopped hurting."
  *   **Score 2 (Enjoyment):** "Good," "great," "happy," "proud," "fun."
  *   **Score 3 (Flow/High):** "Best day," "time vanished," "amazing," "love," "perfect."

  ---

  ### 3. Test Run

  Here is the procedure applied to three snippets.

  **Snippet 1:** *"Three hours disappeared while I was working on the encryption bug. I didn't notice anything. Later: best day in weeks."*
  *   **Step 1 (Positive):** Yes. "Three hours disappeared" (Implicit Flow) + "best day in weeks" (Explicit High).
  *   **Step 2 (Veto):** No compulsion/regret mentioned.
  *   **Step 3 (Endurance):** N/A (No pain reported).
  *   **Step 4 (Magnitude):** "Best day" triggers Score 3.
  *   **Result:** **Score 3.**
  *   **Comment:** Captures Flow. Consultant's rule would have missed this (no "want more" during the event).

  **Snippet 3:** *"Ate the whole bag of chips. Didn't even like them. Kept going anyway."*
  *   **Step 1 (Positive):** No explicit positive words. (Action implies drive, but text denies enjoyment).
  *   **Step 2 (Veto):** Yes. "Didn't even like them" + "Kept going anyway" indicates disconnect/compulsion.
  *   **Result:** **Score 0.**
  *   **Comment:** Successfully blocks wireheading/craving. The "wanting" was present, but the "endorsement" was explicitly negated.

  **Snippet 4:** *"Finished the 20-miler. Hated every step of mile 18. Doing it again Sunday."*
  *   **Step 1 (Positive):** Implicit. "Finished" (achievement) + "Doing it again" (voluntary repetition).
  *   **Step 2 (Veto):** "Hated every step of mile 18." *Pause.* Is this compulsion?
  *   **Step 3 (Endurance):** They are "Doing it again Sunday." This is voluntary repetition despite pain. This passes the Endurance Check.
  *   **Step 4 (Magnitude):** Conflict between "Hated" and "Doing it again." Rule says Score 1 for Endurance/Mixed.
  *   **Result:** **Score 1.**
  *   **The "Hateable" Answer:** You will want to argue this should be a 0 because the text says "Hated." Or you will argue it should be a 2 because runners love running.
  *   **Why this result?** We prioritized **Voluntary Repetition** over **In-the-moment Sensation**. If we scored this 0, we lose "meaningful struggle." If we scored this 2, we lie about the "Hated." Score 1 is the compromise. It acknowledges value without calling pain "joy."

  ---

  ### 4. Limitations & Where Annotators Will Drift

  This procedure gets you to 0.7 IAA, but it breaks in three specific places. Expect your annotators to quietly ignore the rules here:

  **1. The "Vindication" Blind Spot (Snippet 5)**
  *   *Snippet:* "Found out I was right... Vindicated? Not exactly good exactly."
  *   *Procedure Result:* **Score 0.** (Explicit negation of "good" in Step 1/4).
  *   *The Drift:* Annotators with high empathy will code this as **1**. They know vindication feels good. The text is ambiguous ("?").
  *   *The Cost:* To keep IAA > 0.7, you must enforce the **0**. You are losing "Cognitive Positive Valence" (pride, being right) because it lacks clear sensory or endorsement markers. The daily score will under-report intellectual satisfaction.

  **2. The Baseline Problem (Snippet 6)**
  *   *Snippet:* "Holding my nephew. Warm. Nothing else to say."
  *   *Procedure Result:* **Score 1.** ("Warm" counts as Relief/Quiet in Step 4).
  *   *The Drift:* Annotators will debate if "Warm" is physical temperature or emotional. If a writer is chronically depressed, "Nothing else to say" might be the highest possible score. If a writer is manic, it's a 0.
  *   *The Cost:* We cannot normalize for individual baselines. A "1" for a depressed user is not the same as a "1" for a happy user. The aggregate daily number will smooth this out, but individual trajectories will be noisy.

  **3. Sarcasm and Cultural Coding**
  *   *Risk:* "Great, another flat tire."
  *   *Procedure:* Step 1 catches "Great." Step 2 misses it (no regret). Result: **Score 2.**
  *   *Mitigation:* You need a "Context Flag." If the event is objectively negative (flat tire, funeral, illness), annotators must override Step 1 and default to 0 unless "Relief" is explicitly mentioned ("Glad the funeral is over").
  *   *The Cost:* This requires annotator judgment, which lowers IAA. Without it, you over-report pleasure on bad days.

  **Summary of Trade-offs:**
  By choosing **Endorsed Experience**, you save Flow (Snippet 1) and kill Addiction (Snippet 3). You accept that "Struggle" (Snippet 4) counts as a low-grade positive, which will feel counter-intuitive. You lose subtle cognitive positives (Vindication) where the writer is hesitant to call it "good." This is the price of a single number.
