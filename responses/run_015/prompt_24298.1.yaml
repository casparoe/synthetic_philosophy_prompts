answer: |-
  There is no single, common noun (like "paradox" or "fallacy") that exclusively names this specific rhetorical loop in general discourse. However, in analytic philosophy and metaphysics, this configuration is precisely mapped. It is a specific subtype of a **Deep Verbal Dispute**, driven by a clash between **Ontological Realism** and **Pragmatic Instrumentalism**, and structured by what Rudolf Carnap called the **Internal/External Question Distinction**.

  Because you asked for a "carving" (precise boundaries) and a term if one doesn't fully exist, I will first ground this in the established philosophical concepts, distinguish it from the phenomena you ruled out, and then coin a specific term for this argumentative configuration to help you identify it in the wild.

  ### 1. The Established Concepts

  To understand the loop, you need three established concepts that operate simultaneously:

  **A. Deep Verbal Dispute (David Chalmers)**
  In a *plain* verbal dispute (equivocation), two people use a word differently without realizing it. Once they clarify definitions ("Oh, I meant *bank* of a river, not *bank* for money"), the disagreement dissolves.
  In a **Deep Verbal Dispute**, both parties understand the definitions but disagree on **which definition is the correct one to use for the topic at hand**.
  *   **The Engineer** proposes a functional definition: "Belief" = "State that reliably predicts behavior."
  *   **The Philosopher** proposes a realist definition: "Belief" = "Internal mental state with causal power."
  *   **The Loop:** When the Engineer clarifies their definition, the Philosopher doesn't say "Oh, I see." They say, "That definition is insufficient." The dispute is no longer about facts; it is a normative dispute about *conceptual engineering*.

  **B. Realism vs. Instrumentalism**
  This is the substantive philosophical divide driving the verbal dispute.
  *   **Realism (The Philosopher):** Mental states are *natural kinds*. They exist independently of our descriptions. A system either has the "stuff" of belief or it doesn't. Utility is irrelevant to existence.
  *   **Instrumentalism (The Engineer):** Mental states are *theoretical tools*. They are useful fictions or patterns. If the "belief" description works perfectly, there is no "further fact" to be had. To ask if it is "really" a belief beyond its utility is a nonsense question.

  **C. Internal vs. External Questions (Rudolf Carnap)**
  This explains the "Change of Subject" accusation.
  *   **Internal Question:** Asked *within* a linguistic framework. (e.g., "Within the framework of psychology, does this system have a belief?" Answer: "Yes, because the framework predicts it.")
  *   **External Question:** Asked *about* the framework itself. (e.g., "Does the framework of psychology correspond to reality?" Answer: "That's not a factual question, it's a pragmatic choice.")
  *   **The Loop:** The Engineer answers the Internal Question (predictive success). The Philosopher insists they asked an External Question (ontological reality). When the Engineer says "Internal success is all there is," the Philosopher hears "I am refusing to answer your question," hence the "Change of Subject" accusation.

  ### 2. How It Differs From Related Phenomena

  You asked specifically how this differs from equivocation and the map/territory distinction. Here is the carving:

  **Vs. Plain Equivocation**
  *   **Equivocation:** Unintentional confusion. Resolution brings agreement.
  *   **This Loop:** Intentional disagreement on standards. Resolution is impossible without one side conceding their philosophical stance.
  *   **Boundary Test:** If you define terms and they *still* argue, it is not plain equivocation. It is a Deep Verbal Dispute.

  **Vs. Map/Territory Confusion**
  *   **Map/Territory:** Usually implies one side is making a mistake by confusing the description for the reality.
  *   **This Loop:** The Engineer is not confusing the map for the territory; they are asserting **Ontological Deflationism**. They claim that for mental states, *the map is the only territory there is*. The Philosopher claims there is a territory *behind* the map.
  *   **Boundary Test:** If the Engineer said, "We don't know what's inside, but the map works," that is Map/Territory. If the Engineer says, "There is nothing inside *but* the pattern of the map," that is this Loop.

  ### 3. The Coined Term: "The Ontological-Pragmatic Impasse"

  Since there is no single lexicalized term for the *rhetorical loop* itself (as opposed to the philosophical positions), I propose the term **The Ontological-Pragmatic Impasse**.

  **Definition:**
  An argumentative stalemate where two parties agree on all empirical facts regarding a system's behavior and structure, but deadlock because one party treats a concept (e.g., "belief") as an **Ontological Category** (requiring independent existence) and the other treats it as a **Pragmatic Category** (requiring only predictive utility). The loop is sustained by the Ontological party accusing the Pragmatic party of "changing the subject" when the latter shifts from existence claims to utility claims.

  **Boundary Conditions (When to use this label):**
  1.  **Factual Agreement:** Both sides must agree on what the system *does* (inputs, outputs, internal weights/states). If they disagree on the mechanics, it is a technical dispute, not this impasse.
  2.  **The "As If" Trigger:** One side must use the phrase "behaves as if" or "treats as," and the other must reject it as insufficient for "really is."
  3.  **The Subject-Shift Accusation:** The Ontological party must explicitly claim that discussing utility/prediction fails to answer the question of existence.
  4.  **No Hidden Variables:** The Pragmatic party must explicitly deny that there is a "hidden fact" waiting to be discovered (Deflationism). If they say "We just haven't found the belief neuron yet," it is a scientific uncertainty, not this impasse.

  ### 4. Why the Loop Persists (The Engineer's Perspective)

  As an engineer, you likely find this frustrating because you are operating in the **Design Stance** or **Intentional Stance** (terms coined by Daniel Dennett). You care about *prediction and control*.
  The philosopher is operating in the **Physical Stance** combined with **Metaphysical Realism**. They care about *causal constitution*.

  The loop is unbreakable without a meta-agreement because:
  *   To the Engineer, the Philosopher's question ("But is it *real*?") looks like a **Category Error** (asking for the color of a number).
  *   To the Philosopher, the Engineer's answer ("It predicts well") looks like **Evasion** (answering "Is it gold?" with "It shines like gold").

  ### Summary for Identification

  When you encounter this pattern, you can identify it as **The Ontological-Pragmatic Impasse** if:
  1.  **Facts are settled:** No disagreement on the code or behavior.
  2.  **Definitions are clear:** Both know what the other means by "belief."
  3.  **Validity is disputed:** The disagreement is solely on whether *utility* is sufficient for *existence*.
  4.  **The "Dodge" Accusation:** One side explicitly claims the other is avoiding the "real question."

  This is not a failure of communication; it is a collision of frameworks. Recognizing it as an **Impasse** rather than a **Misunderstanding** is the only way to step out of the loop. You must agree to disagree on the *metaphysics* while agreeing on the *engineering*.
