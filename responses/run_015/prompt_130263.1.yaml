answer: |-
  # The Fictional Emotion Decision Tree

  **Root Node:** Is your emotional reaction to fiction phenomenologically the **same kind of thing** as real-world grief, or is it a **different mental state** altogether?

  *   **A. Same Kind (Real Emotion)** → Go to Node 2A
  *   **B. Different Kind (Quasi-Emotion)** → Go to Node 2B

  ---

  ### Node 2A (For "Same Kind")
  **Does a rational emotional state require its object to actually exist?**
  *(This tests the Existence Assumption and whether fiction can be emotionally appropriate without real characters.)*

  *   **Yes (Existence Required)** → Go to Node 3A
  *   **No (Existence Not Required)** → Go to Node 3B

  ### Node 3A (For "Existence Required")
  **Do we mistakenly believe the fictional characters are real people?**

  *   **Yes:** → **Leaf 1: Illusionism**
      *   *Position:* We are temporarily deceived. We feel real grief because we forget, for a moment, that the actor is alive.
  *   **No:** → **Leaf 2: The Incoherent Claim**
      *   *Position:* We know they don't exist, existence is required for rational grief, yet our grief is still rational.
      *   *Diagnosis:* **Empty/Incoherent.** This violates the logic of Node 2A. You cannot claim rational emotion *requires* existence while simultaneously claiming the object *doesn't* exist and you *know* it, without changing the definition of the emotion or the object. This is the paradox itself, not a solution.

  ### Node 3B (For "Existence Not Required")
  **Is the emotion 'fragmented' (directed at a story-world rather than actuality)?**
  *(This tests whether accepting fragmented emotions dissolves the paradox without giving up real affect.)*

  *   **Yes:** → **Leaf 3: Thought Theory / Fragmentation**
      *   *Position:* (e.g., Lamarque, Neill). The emotion is real, but its object is a "thought-content" or story-world, not actual reality.
  *   **No:** → **Leaf 4: Deflationary View**
      *   *Position:* (e.g., No Paradox). Existence never mattered for emotion. We feel sadness about thoughts all the time. There is no paradox to solve.

  ---

  ### Node 2B (For "Different Kind")
  **Is this state something you actively generate (pretend), or something that happens to you (simulate)?**

  *   **Actively Generate:** → **Leaf 5: Make-Believe Theory**
      *   *Position:* (e.g., Walton, Coleridge). You are engaging in a game of make-believe. The tears are real physiology, but the grief is pretended (quasi-grief).
  *   **Happens to You:** → **Leaf 6: Simulation Theory**
      *   *Position:* (e.g., Currie). You are offline-simulating the character's state. It is an involuntary mimicry, not a full belief-based emotion.

  ---

  ### Seminar Notes & Flags

  **1. The Incoherent Leaf (Leaf 2)**
  This position is logically empty. It attempts to hold three contradictory claims: (1) Emotion is real, (2) Real emotion needs existing objects, (3) The object doesn't exist (and we know it). Most philosophers who start down this branch are forced into **Leaf 1 (Illusionism)** to avoid contradiction.

  **2. Indistinguishable Leaves (Leaf 3 vs. Leaf 4)**
  **Flag:** This tree cannot reliably separate **Thought Theory (Leaf 3)** from the **Deflationary View (Leaf 4)**.
  *   *Why:* Both deny the Existence Assumption. The distinction relies on whether you need a positive account of the object ("story-world") vs. simply denying the requirement ("existence doesn't matter"). In practice, these views often merge into the same conclusion: the paradox is dissolved because existence is irrelevant to emotion.

  **3. Mapping Summary**
  *   **Leaf 1:** Illusionism (Naive Realism)
  *   **Leaf 2:** Incoherent / Unexplored
  *   **Leaf 3:** Thought Theory (Fragmented Emotion)
  *   **Leaf 4:** Deflationary (No Paradox)
  *   **Leaf 5:** Make-Believe (Walton / Coleridge)
  *   **Leaf 6:** Simulation Theory (Currie)
