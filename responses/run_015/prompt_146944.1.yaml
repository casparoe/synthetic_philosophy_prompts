prompt: |-
  I was arguing with my friends last week about whether ethics boards can ever really say that helping person A is 'more important' than helping person B, and then I realised my actual job has this exact problem. I sit on a regional health authority's allocation committee, and we have to approve funding splits between programs that serve totally different populations — chronic pain patients vs acute trauma survivors, mental-health liaison services vs surgical capacity — and the board keeps asking whether we're comparing apples to apples when we claim one group gains more welfare than another loses.

  I don't want a grand theory. I need a reusable decision procedure — like a flowchart in words — that my non-philosopher collegues can run in a meeting. The rules we already have are: no cardinal utility scores (no QALYs or point scales), and a 'recognition boundary' clause that says if a proposal touches whether people are treated as the kind of person they are (say, gender-affirming clinical intake vs a generic protocol), that recognition value can't be folded into a health-outcome tradeoff. So build the procedure: the ordered questions, what counts as a sufficient answer at each node, where it stops with 'these are incommensurable,' and where it forces a human vote. Ground it in whatever philosophy actually knows about interpersonal comparison without assuming we can read minds. Then run it on two proposals we actually recieved: splitting rehab slots between chronic pain and acute trauma, and funding a cultural liaison program that improves mental health metrics but doesn't change mortality stats. Make sure one of those runs produces an answer the committee will hate. And flag the misfires — the spots where the checklist can't settle the issue and someone just has to decide.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User Role:** Member of a regional health authority's allocation committee.
      *   **Problem:** Deciding funding splits between disparate programs (chronic pain vs. acute trauma, mental health vs. surgical capacity).
      *   **Constraint 1 (No Cardinal Utility):** No QALYs, no point scales, no "reading minds" (interpersonal utility comparison is suspect).
      *   **Constraint 2 (Recognition Boundary):** Certain values (identity/recognition, e.g., gender-affirming care) cannot be traded off against health outcomes.
      *   **Deliverable:** A reusable decision procedure (flowchart in words) for non-philosophers.
      *   **Requirements:** Ordered questions, sufficient answers, stop conditions (incommensurability), forced vote conditions.
      *   **Grounding:** Based on philosophical knowledge about interpersonal comparison without assuming cardinal utility (likely drawing on prioritarianism, sufficientarianism, or contractualism).
      *   **Test Cases:**
          1.  Chronic Pain Rehab vs. Acute Trauma Rehab.
          2.  Cultural Liaison Program (mental health metrics up, mortality unchanged).
      *   **Specific Instruction:** One test case must produce an answer the committee will hate.
      *   **Specific Instruction:** Flag misfires (where the checklist fails and human judgment is needed).

  2.  **Philosophical Grounding:**
      *   *Problem:* Interpersonal comparison of welfare without cardinal utility.
      *   *Solution:* Focus on *status*, *urgency*, and *thresholds* rather than aggregate sums.
      *   *Key Concepts:*
          *   **Sufficientarianism:** Ensure everyone meets a basic threshold of functioning.
          *   **Prioritarianism:** Give weight to the worse off, but not strictly lexically (unless thresholds are involved).
          *   **Contractualism (Scanlonian):** Could anyone reasonably reject this allocation?
          *   **Recognition/Status (Anderson/Honneth):** Some goods are constitutive of equal citizenship and cannot be traded.
      *   *The Procedure:* Needs to move from "Rights/Recognition" -> "Urgency/Thresholds" -> "Efficiency within constraints" -> "Vote."

  3.  **Drafting the Decision Procedure (The "Protocol"):**
      *   *Step 1: The Recognition Filter.* (Based on the user's "Recognition Boundary" rule). If a proposal affects equal status/identity, it passes or fails on that alone, not on health outcomes.
      *   *Step 2: The Threshold Check.* Are people falling below a basic minimum of functioning/safety? If yes, prioritize bringing them above the line.
      *   *Step 3: The Urgency/Reversibility Test.* If both are above/below thresholds, which harm is more urgent or irreversible?
      *   *Step 4: The Reasonable Rejection Test.* If still tied, which group has a stronger claim to reject the decision? (Worse off status).
      *   *Step 5: The Incommensurability Flag.* If claims are equally strong and distinct, declare a tie and force a vote.

  4.  **Refining the Procedure (Addressing Constraints):**
      *   Must avoid QALYs. Use qualitative descriptors (severe/moderate, reversible/permanent).
      *   Must respect the "Recognition Boundary."
      *   Must explicitly state where it stops.

  5.  **Developing the Test Cases:**

      *   *Case 1: Chronic Pain vs. Acute Trauma.*
          *   Chronic Pain: Long-term suffering, functional limitation, rarely life-threatening.
          *   Acute Trauma: Immediate life/limb threat, high urgency, potential for full recovery.
          *   *Application:* Trauma likely wins on Urgency/Reversibility. Pain patients might feel devalued.
          *   *Committee Reaction:* They might hate it if the pain population is larger, but the procedure favors the acute need. Or, if the procedure prioritizes the "worse off" (chronic sufferers often feel worse off than acute ones who recover), it might favor pain. Let's aim for the "Committee will hate" instruction. Usually, committees hate denying life-saving (trauma) care, but they also hate ignoring chronic suffering. Let's make the procedure favor the *Chronic Pain* group based on "Baseline Status" (Prioritarianism), which will horrify a medical committee used to triage (Acute first). *Correction:* Actually, standard triage favors Acute. To make the committee *hate* the answer, the procedure should probably favor the Chronic Pain group (who are "worse off" in terms of baseline welfare) over the Acute group (who are temporarily critical but have high recovery odds). This challenges the "save the life now" instinct.
          *   *Wait, let's look at the constraints again.* "No cardinal utility." "Recognition boundary."
          *   *Decision:* I will structure the procedure to prioritize *baseline deprivation* over *acute spike*. This means Chronic Pain (permanent low baseline) beats Acute Trauma (temporary low baseline). This is philosophically defensible (Prioritarianism) but operationally controversial (Triage ethics).

      *   *Case 2: Cultural Liaison vs. Mortality Stats.*
          *   Liaison: Improves mental health metrics (quality of life), no mortality change. Touches on recognition/culture.
          *   Surgical/Mortality: Saves lives, no recognition component.
          *   *Application:* Step 1 (Recognition). If the Liaison is deemed "Recognition" (identity/culture), it triggers the Boundary Clause. It cannot be traded against mortality.
          *   *Committee Reaction:* They will *hate* this. Saying "mental health/culture" cannot be traded against "death" is a hard pill to swallow. This fits the "one answer the committee will hate" requirement better than Case 1.
          *   *Revision:* Let's make Case 2 the one they hate. If the Liaison triggers the Recognition Boundary, it creates a "trump card" situation. Funding it becomes mandatory regardless of mortality stats elsewhere. That will cause a riot in a health authority.
          *   *Case 1:* Can be resolved via Urgency/Thresholds.

  6.  **Writing the Procedure (Iterative refinement):**
      *   Name: The "Comparative Claim Protocol" (CCP).
      *   Tone: Clinical, precise, actionable.
      *   Steps:
          1.  Recognition Check (The Trump Card).
          2.  Minimum Threshold Check (Sufficientarianism).
          3.  Baseline Deprivation Check (Prioritarianism).
          4.  Reversibility/Urgency Check.
          5.  Incommensurability/Vote.

  7.  **Addressing "Flag the Misfires":**
      *   Need to explicitly point out where the logic breaks down and human agency takes over. This is usually at the definition of "Recognition" or the final tie-break.

  8.  **Review against Constraints:**
      *   No QALYs? Yes, using qualitative thresholds.
      *   Recognition Boundary? Yes, Step 1.
      *   Flowchart in words? Yes.
      *   Test cases included? Yes.
      *   One hated answer? Yes (Case 2).
      *   Philosophical grounding? Yes (Sufficientarianism, Prioritarianism, Contractualism).

  9.  **Final Polish:**
      *   Ensure the distinction between "welfare" and "status" is clear.
      *   Make sure the "hated answer" is clearly explained as a consequence of the rules, not a bug.
      *   Check the "Chronic Pain vs. Trauma" logic. If I make Case 2 the hated one, Case 1 should be resolvable.
      *   *Self-Correction on Case 1:* If I use Prioritarianism (help the worst off), Chronic Pain patients are often "worse off" in terms of long-term quality of life than Trauma patients (who might die or fully recover). If the procedure says "Fund Chronic Pain," the committee might hate that because Trauma = Death. If the procedure says "Fund Trauma," that's standard triage. Let's make Case 2 the "Hated" one because it invokes the Recognition Boundary to override mortality. That's more philosophically interesting and fits the user's specific constraint about the "Recognition Boundary clause."
      *   *Wait, looking at the prompt:* "Make sure one of those runs produces an answer the committee will hate."
      *   Okay, I will ensure the Cultural Liaison case triggers the Recognition Boundary, making it non-negotiable against mortality savings. That is a very hard sell for a health authority.

  10. **Final Structure:**
      *   Introduction (Philosophical Grounding).
      *   The Protocol (5 Steps).
      *   Misfire Flags (Where it breaks).
      *   Test Case 1 (Pain vs. Trauma).
      *   Test Case 2 (Liaison vs. Mortality).
      *   Conclusion.

  11. **Refining the "Hated" Outcome:**
      *   For the Cultural Liaison: If the protocol dictates that because it touches *recognition*, it cannot be weighed against mortality, the committee has to fund it even if people die elsewhere. That is the hated outcome.
      *   For Pain vs. Trauma: I need to make sure this one *resolves* cleanly so the contrast is sharp. I'll use the "Threshold" step. Trauma usually falls below a survival threshold; Pain falls below a functioning threshold. Survival > Functioning. So Trauma wins. That's acceptable to them.
      *   *Wait, actually:* To make it more robust, I should ensure the "Hated" outcome comes from the *logic* they asked for. They asked for a procedure that respects the Recognition Boundary. If I apply that boundary strictly, it *will* produce a result they hate (prioritizing identity over life). I must be honest about that.

      *   *Let's reconsider Case 1 (Pain vs Trauma).* If I apply Prioritarianism (help the worst off), Chronic Pain patients have a lower *baseline* welfare than Acute Trauma patients (who are temporarily spiked). If the protocol prioritizes *baseline*, Pain wins. Committees hate denying trauma. If the protocol prioritizes *urgency*, Trauma wins. I will design the protocol to prioritize *Thresholds* first (Survival vs Suffering). Trauma wins.
      *   *Let's reconsider Case 2 (Liaison).* If the Liaison is deemed "Recognition," it trumps. Committee hates this.
      *   *Okay, Plan:* Case 1 resolves (Trauma wins). Case 2 resolves (Liaison wins via Trump Card) -> Committee hates this.

      *   *Wait, one more check:* "Make sure one of those runs produces an answer the committee will hate."
      *   Okay, I will make sure the Logic forces the "Hated" conclusion in Case 2.
      *   And I need to flag the misfires.

      *   *Philosophical Grounding:* I need to mention *why* this works.
          *   Step 1: Deontological Constraints (Recognition).
          *   Step 2: Sufficientarianism (Thresholds).
          *   Step 3: Prioritarianism (Baseline status).
          *   Step 4: Contractualism (Reasonable rejection).

      *   *Let's write it.*

      *(Self-Correction during drafting)*: I need to be careful not to give medical advice, but this is an ethical allocation procedure. I will frame it as an administrative ethical tool.
      *(Refining the "Hated" part)*: The prompt asks for *one* of the runs to produce an answer they will hate. I'll make the Cultural Liaison one the hated one because it prioritizes "recognition" over "mortality" based on their own rule. This highlights the tension in their constraints.

      *(Refining the "Misfires")*: I need to explicitly state where the checklist *cannot* decide. This is crucial for honesty.

      *(Final check on constraints)*: No QALYs. Check. Recognition Boundary included. Check. Flowchart in words. Check.

      *Let's build the steps.*
      1. Recognition Test.
