answer: |-
  Here is a concrete case study designed for your seminar handout. It isolates the **structural shift** (the econometric failure) from **strategic gaming** (the behavioral failure).

  ### Case Study: The Paradox of Preventative Care

  **Context:** A hospital network wants to reduce emergency readmissions ($G$) for heart failure patients. Readmissions are costly and harmful to patients.

  **The Proxy ($P$):** A "Risk Score" (0–100) generated by a machine learning model. The model was trained on five years of historical data. Historically, there was a strong positive correlation: **Higher Risk Score $\rightarrow$ Higher Probability of Readmission.**

  **The Intervention:** The hospital administration optimizes for the goal ($G$) using the proxy ($P$). They implement a policy: *Any patient discharged with a Risk Score > 80 is automatically enrolled in an intensive home-care program (daily nurse visits, medication monitoring).*

  **The Outcome (Short Term):** The program is a medical success. The intensive care works. Readmissions among the high-risk group drop by 40%.

  **The Measurement Failure (Long Term):**
  After two years, the data science team retrains the Risk Model on the *new* data (which includes the two years of the intervention).
  *   **Observation:** In the new dataset, patients with Risk Scores > 80 **no longer** have higher readmission rates than patients with scores < 80.
  *   **Statistical Conclusion:** The Risk Score is now statistically insignificant as a predictor of readmission. The correlation has vanished.
  *   **Decision:** Facing budget cuts, administrators look at the new model. It suggests that targeting high-score patients yields no marginal benefit (since their readmission rates are already equal to low-score patients). They conclude the home-care program is inefficient and cancel it.
  *   **Result:** Readmissions immediately spike back to original levels.

  ---

  ### Why This Is Not "Gaming"
  In the standard Goodhart story, agents manipulate the number (e.g., doctors coding patients as "lower risk" to avoid the work, or patients hiding symptoms).
  *   **In this case:** Nobody cheated. The patients did not change their biology to trick the score. The doctors did not falsify data.
  *   **The Cause:** The metric failed because the **intervention succeeded**. By treating the high-risk population, the hospital changed the *conditional probability* of the outcome. The Risk Score measures *biological vulnerability*, but the readmission rate measures *vulnerability minus care*. When you maximize care for the vulnerable, the correlation between vulnerability and readmission breaks.

  ### Why More Data Does Not Fix This
  This is the crucial econometric point for your seminar.

  1.  **Pre-Intervention Data:** Using the old historical data is useless because it describes a world where high-risk patients **did not** receive home care. It cannot predict outcomes in a world where they **do**.
  2.  **Post-Intervention Data:** Using the new data is misleading because it describes a world where the treatment is **already applied**. It shows no correlation between Risk and Readmission *only because* the treatment is masking the risk. If you use this data to make decisions (i.e., "stop treating"), you revert to the pre-intervention world, and the correlation returns (along with the readmissions).

  ### The Conceptual Lesson: The Lucas Critique of Metrics
  Your friend's distinction refers to the difference between **parameter stability** and **regime change**.

  *   **Gaming Goodhart:** The agents change their behavior to move the proxy ($P$), breaking the link to the goal ($G$).
  *   **Structural Goodhart (This Case):** The decision-maker changes the *environment* (the policy regime), which alters the underlying data-generating process.

  The Risk Score was not a "noisy estimator" of readmission; it was a valid estimator of **untreated risk**. By optimizing the proxy, the hospital moved the population from an "untreated" distribution to a "treated" distribution. A metric calibrated on the former cannot guide decisions in the latter without a **causal model** that accounts for the treatment effect.

  **Seminar Discussion Question:**
  *If you were the Chief Data Officer, how do you prove to the administrators that the Risk Score is still valuable, given that the regression coefficient on the new data is zero?*

  *(Expected Answer: You cannot rely on observational regression. You need to run a randomized control trial (RCT) where you withhold care from a subset of high-risk patients to re-estimate the counterfactual, or build a structural causal model that separates "Risk" from "Treatment Effect.")*
