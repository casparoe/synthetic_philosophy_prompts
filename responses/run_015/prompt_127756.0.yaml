      *   **Representationalism/Interpretivism (Fodor, Dennett-ish):** Beliefs are real patterns. They correspond to functional states in the brain. Even if the implementation is neural, the abstraction of "belief" is causally efficacious and real at its own level.

  3.  **Map to Engineering Metaphors:**
      *   *Folk Psychology (Beliefs/Desires)* $\rightarrow$ Source-level intent, variable names, high-level logic.
      *   *Neuroscience (Neural States)* $\rightarrow$ Machine instructions, register states, memory addresses, voltage levels.
      *   *Eliminativism* $\rightarrow$ "Source code intent is an illusion; only machine code exists. Variable names are stripped."
      *   *Representationalism* $\rightarrow$ "Source logic is real because it constrains the machine code. Debug symbols map the two."

  4.  **Drafting the Eliminativist Claim (using the vocabulary):**
