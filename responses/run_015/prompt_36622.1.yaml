      *   **Ethical Frameworks:**
          *   *Utilitarianism:* Maximize good (lives saved) vs. minimize harm (corruption/legitimization of rebels).
          *   *Deontology:* Duty to truth, duty to neutrality, duty to donors.
          *   *Virtue Ethics:* What kind of organization/person are we becoming?
      *   **Humanitarian Principles:** Humanity, Neutrality, Impartiality, Independence. The deal compromises Independence (co-opted by rebels) and Neutrality (appearing to side with them).

  3.  **Address Question 1: Is there a principled way to decide?**
