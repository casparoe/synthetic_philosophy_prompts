answer: |-
  # JOINT STATEMENT ON THE METAPHYSICS OF FUTURE CONTINGENTS

  **Parties:**  
  **The Open-Future Working Group** (hereinafter "OFI"), representing the Indeterminist view that future contingents are presently neither true nor false.  
  **The Ockhamist Consortium** (hereinafter "OCK"), representing the view that bivalence is preserved for future contingents despite metaphysical openness.

  **Context:**  
  This document summarizes the results of a good-faith adversarial collaboration concerning the semantics and metaphysics of time. The collaboration utilized the classic **Naval Battle** case (Aristotle) and three stipulated scenarios: the **Satellite Coin** (indeterministic chance), the **Martian Storm** (deterministic but unknowable), and the **Retrospective Bet** (semantic ascription of past truth).

  ---

  ## I. AGREED CLAIMS

  Both parties affirm the following claims as a shared foundation for further inquiry:

  1.  **Distinction Between Bivalence and Excluded Middle:** We agree that the Law of Excluded Middle ($\phi \lor \neg \phi$) is logically distinct from the Principle of Bivalence ($True(\phi) \lor True(\neg \phi)$). We agree that one may accept the former while rejecting the latter without logical contradiction.
  2.  **Branching-Time Models:** We agree that branching-time models represent metaphysical possibilities, not merely epistemic alternatives. The branches represent ways the world could genuinely evolve, consistent with the present state and laws of nature.
  3.  **Rejection of Fatalism:** We agree that fatalism is the view that future events are *causally necessary* or that human deliberation is causally inert. We jointly affirm that neither the truth of a proposition (OCK) nor the falsity of a truth-ascription (OFI) entails causal necessitation. Truth does not make things happen.
  4.  **Norms of Assertion and Credence:** We agree that rational agents should not assert future contingents as known facts unless they are causally settled. We agree that rational credence in an indeterministic future contingent (e.g., the **Satellite Coin**) should align with objective chance (e.g., 0.5), regardless of whether the proposition is deemed presently true.
  5.  **The Martian Storm Case:** In the case of the **Martian Storm** (a deterministic consequence of present conditions unknowable to observers), we agree that the proposition "A storm will occur" is *correct* to believe and acts as a truth-apt statement for the purposes of scientific modeling, even if no observer can verify it prior to the event.

  ---

  ## II. DISAGREEMENTS TABLE

  The following table outlines residual disagreements. The wording has been negotiated to ensure neutrality; each party accepts the formulation in their column as a fair representation of their position.

  | Issue | Open-Future Indeterminist (OFI) | Ockhamist (OCK) |
  | :--- | :--- | :--- |
  | **1. Privileged Branch** | **No Privileged Branch:** Reality comprises a growing tree of equally real possibilities. No single future branch is metaphysically "actual" until it is causally settled. | **Privileged Branch:** Among the possible branches, one is metaphysically "actual" (a Thin Red Line), even if it is not causally necessitated. |
  | **2. Retrospective Ascription** | **Contextual Correctness:** In the **Retrospective Bet**, saying "You were right yesterday" is pragmatically correct but literally false; the proposition lacked a truth value *then* and acquired one only *now*. | **Literal Truth:** In the **Retrospective Bet**, saying "You were right yesterday" is literally true; the proposition possessed a truth value *then* corresponding to the actual future. |
  | **3. Deliberation & Openness** | **Truth Implies Fixity:** Treating future contingents as true undermines the phenomenology of deliberation. We must treat the future as truth-valueless to preserve the sense that we *make* it true. | **Truth Compatible with Openness:** Deliberation is about causing events, not creating truth values. One can deliberate even if the outcome is already true, provided it is not *necessarily* true. |
  | **4. Satellite Coin Status** | **Truth-Value Gap:** Regarding the **Satellite Coin**, the proposition "The coin will land Heads" is presently neither true nor false. | **Bivalence Holds:** Regarding the **Satellite Coin**, the proposition "The coin will land Heads" is presently either true or false, though unknowable. |

  ---

  ## III. CRUXES AND PREDICTIONS

  We identify three specific cruxes where our theories yield different diagnostic predictions. For each crux, we specify a concrete consideration and record our predictions in advance of further empirical or conceptual analysis.

  ### Crux 1: The Linguistic Pattern of Retrospection
  *   **Consideration:** The **Retrospective Bet Case**. Two agents bet today. Tomorrow, the winner says to the loser: "What you said yesterday was false."
  *   **Linguistic Pattern:** The use of the past tense copula ("*was* false") applied to a contingent prediction.
  *   **OFI Prediction:** Native speakers will assent to the statement pragmatically, but under philosophical scrutiny, they will deny that the proposition had a truth value *at the time of utterance*. They will accept a paraphrase: "What you said yesterday has *turned out* to be false."
  *   **OCK Prediction:** Native speakers will assent to the statement literally. Under scrutiny, they will maintain that the proposition *was* false yesterday, because the future they referred to (the actual one) did not obtain.

  ### Crux 2: The Ground of Truth in Indeterministic Chance
  *   **Consideration:** The **Satellite Coin Case**. An autonomous satellite flips a genuinely indeterministic coin tomorrow. There is no present causal factor favoring Heads or Tails.
  *   **Metaphysical Question:** What makes the proposition "It will land Heads" true (if it is true)?
  *   **OFI Prediction:** Inquiry will reveal no truth-maker. Since there is no causal ground, there is no truth. If OCK insists it is true, they are positing a "brute fact" about the future that violates the principle that truth supervenes on being.
  *   **OCK Prediction:** Inquiry will reveal that truth does not require a *causal* ground, only a *correspondence* ground. The fact that the coin *will* land Heads (in the actual future) is sufficient to make the proposition true, even if that fact is not causally necessitated by the present.

  ### Crux 3: The Role of Epistemic Access
  *   **Consideration:** The **Martian Storm Case** vs. The **Naval Battle**. The Storm is determined but unknowable; the Battle is indeterministic.
  *   **Semantic Test:** Does the unknowability of the Storm affect its truth status differently than the indeterminacy of the Battle?
  *   **OFI Prediction:** We will agree the Storm proposition is true (because it is determined) and the Battle proposition is not (because it is not). This proves truth tracks *causal settlement*, not *bivalence*.
  *   **OCK Prediction:** We will agree the Storm proposition is true, but we will insist the Battle proposition is *also* true. The difference is epistemic (knowability) and modal (necessity), not semantic (truth). The disagreement on the Battle reveals OFI conflates "settledness" with "truth."

  ---

  ## IV. CONCLUSION ON VERBAL DISPUTE

  We conclude this statement by addressing the nature of our disagreement.

  1.  **Substantive Core:** We agree that the dispute is **not merely verbal** regarding the metaphysical structure of time. We disagree on whether reality includes a unique, non-necessitated future branch (OCK) or whether the future is ontologically incomplete (OFI). This is a disagreement about the nature of existence and modality.
  2.  **Verbal Component:** We agree that a **significant portion** of the dispute is verbal, specifically concerning the definition of the predicate "is true."
      *   **OFI** defines "is true" as "is causally settled or guaranteed by the present state."
      *   **OCK** defines "is true" as "corresponds to the unique actual history."
  3.  **Final Stipulation:** We acknowledge that if we adopted a unified semantic framework (e.g., relativizing truth to contexts of assessment), many practical disagreements regarding the **Retrospective Bet** and norms of assertion would dissolve. However, the metaphysical disagreement regarding the **Satellite Coin** and the ontology of the future remains substantive.

  **Signed,**

  *For the Open-Future Working Group*  
  ______________________  
  *Date:*

  *For the Ockhamist Consortium*  
  ______________________  
  *Date:*
