answer: |-
  First, let me say that your "bookmark theory" is not just a sensible way to cope with the paperwork; it is a recognized and respected position in the philosophy of science. In legal and philosophical circles (notably by H.L.A. Hart and Tony Honoré in their book *Causation in the Law*), this is often called **causal selection**. The idea is exactly as you stated: the world presents us with a vast web of conditions, and we "select" one to label *the* cause based on human interests—usually control, abnormality, or moral responsibility.

  You have spent thirty years operating at the intersection of metaphysics (what is really happening?) and pragmatics (what do we need to do?). It is no surprise that the philosophy reading group sparked this. You were living the tension they were only reading about.

  Here is an attempt to answer your four questions, translating the philosophical vocabulary into the language of surveillance and forms.

  ### 1. Does picking one cause presuppose "connective glue"?

  **Short answer:** No. Selecting a cause based on "cheapness" or "intervenability" does not require you to believe in a metaphysical glue.

  **The Detail:**
  The occasionalist (al-Ghazālī) and the regularity theorist (Hume) agree that we never observe "power" or "necessity." We only see Event A (borehole contaminated) followed by Event B (outbreak).
  *   **The Realist** says: "There is a hidden gear inside nature that turns A into B."
  *   **The Occasionalist** says: "There is no gear. But A is always followed by B because of a consistent habit (of God or of Nature)."

  Your practice of picking the "underlying cause" on a death certificate is an act of **causal selection**, not **causal discovery**. You aren't claiming that the underlying cause is the *only* thing that mattered ontologically. You are claiming it is the most *useful* thing to name for the purpose of statistics or prevention.

  **What would the occasionalist object to?**
  They would only object if you claimed that *you* had the power to stop the outbreak by fixing the borehole.
  *   **You:** "I fixed the well, so I stopped the cholera."
  *   **Occasionalist:** "You fixed the well. On the occasion of that fix, the cholera stopped. But you didn't *make* it stop. The regularity held."

  **Verdict:** Your practice survives unchanged. The occasionalist accepts the *regularity* of the sequence. They just deny the *necessity* of the connection. Since your "bookmark" relies on the sequence being reliable (so you know where to intervene), not on *why* it is reliable, the occasionalist can sign your death certificates all day long.

  ### 2. Do "difference-makers" and counterfactuals smuggle in necessary connection?

  **Short answer:** They can, but they don't have to. It depends on how you interpret the "what if."

  **The Detail:**
  When you say, "The cause was the borehole," you imply a counterfactual: "If the borehole had been clean, the outbreak would not have happened."
  *   **The Worry:** Does saying "would not have happened" imply a hidden law of nature forcing that outcome?
  *   **The Humean/Occasionalist Reply:** No. It just means "In all the past times we have seen clean boreholes, we have not seen this outbreak."

  For the occasionalist, a counterfactual is just a summary of past observations, not a prophecy about hidden powers. This is where your colleague in the reading group was mostly right. The "difference-making" view (often associated with philosopher James Woodward) fits your work perfectly. It defines causation by *manipulation*: $A$ causes $B$ if changing $A$ changes $B$.

  **Where the tension lies:**
  The tension arises if you treat the counterfactual as *true* before you test it.
  *   **Realist:** "It *would* have stopped, because the connection is necessary."
  *   **Occasionalist:** "It *probably* would have stopped, because the pattern has held so far. But God/Nature could change the pattern tomorrow."

  **Verdict:** Your practice assumes **stability of regularities**, not **necessity of connection**. As long as you assume the future will resemble the past (which you must, to do surveillance), the occasionalist agrees with you. They just add a shrug and say, "We can't prove it *must* resemble the past, only that it *has*."

  ### 3. Is the trio (Single, Fractional, Individual) consistent?

  **Short answer:** It is not metaphysically consistent, but it is **pragmatically consistent**. This forces you into a kind of **Causal Pluralism**.

  **The Detail:**
  You identified a genuine contradiction:
  1.  **Certificate:** Deterministic, singular cause (The bullet killed him).
  2.  **Fraction:** Probabilistic, aggregate cause (Smoking caused 30% of these cancers).
  3.  **Clinician:** Binary, individual cause (Did the smoking cause *this* cancer? Yes/No).

  If causation were a single "thing" in the world (like a physical force), these three couldn't all be true simultaneously. A force is either there or it isn't; it doesn't apply to 30% of a group but remain undefined for an individual.

  However, if you view causation as a **tool for description** (your bookmark theory), the inconsistency vanishes. You are using three different tools for three different jobs:
  *   **Certificate:** You need a single handle for legal and statistical filing. (Tool: Administrative simplification).
  *   **Fraction:** You need to allocate resources for population health. (Tool: Statistical aggregation).
  *   **Clinician:** You need to make a decision about treatment or counseling. (Tool: Binary decision threshold).

  **Verdict:** You are already a **pragmatic pluralist**. You don't need a single theory of causation to license all three. You need a single theory of *utility*. The switch in granularity is principled: it switches based on *who is asking the question* (the state, the epidemiologist, or the doctor). The occasionalist is perfectly happy with this, because they think *all* causal talk is just description of patterns, not description of reality.

  ### 4. If occasionalism is true, what changes in the work?

  **Short answer:** Nothing changes in the *procedure*, but everything changes in the *confidence*.

  **The Detail:**
  This is the crux of your final question: *Why can a practice built around cause-talk be indifferent to whether causation is real?*
  The answer is **Underdetermination**.
  The data you collect (sequences of events, correlations, outcomes of interventions) looks exactly the same whether there is "glue" holding the universe together or whether it's just a consistent habit.

  *   **Realist World:** I fix the well $\rightarrow$ The mechanism breaks $\rightarrow$ Disease stops.
  *   **Occasionalist World:** I fix the well $\rightarrow$ The pattern continues $\rightarrow$ Disease stops.

  Because the *observable outcomes* are identical, your practice is **underdetermined** by the metaphysics. You can fill out the forms exactly the same way.

  **What *would* change?**
  Only the attitude toward **surprise**.
  *   **The Realist** expects the outbreak to stop because the chain of cause-and-effect was broken. If it doesn't stop, the Realist feels they missed a variable (a confounder).
  *   **The Occasionalist** expects the outbreak to stop because the habit of nature has been consistent *so far*. If it doesn't stop, the Occasionalist says, "The habit changed."

  In practical terms? You still investigate the confounder. You still check the water. The workflow is identical. The only difference is that the occasionalist admits, deep down, that there is no guarantee the sun will rise tomorrow or that the borehole fix will work next time, whereas the Realist feels there is a "law" guaranteeing it.

  ### Summary: Where the Practice is Underdetermined

  You asked where different theories let you go on filling in the forms exactly as you did. The answer is: **Almost everywhere.**

  1.  **Death Certificates:** Both Realists and Occasionalists agree death follows disease. Picking the "underlying" one is an administrative rule, not a metaphysical claim. Both agree on the form.
  2.  **Outbreak Investigation:** Both agree that removing the contamination is *followed by* the end of the outbreak. Both agree to recommend fixing the well.
  3.  **Attributable Fractions:** Both agree on the math of the correlation.

  **The One Place It Matters:**
  The only place the metaphysics bites is in **novel situations**.
  If you encounter a completely new pathogen with no history of regularity:
  *   The **Realist** looks for the *mechanism* (the glue). "How does this virus bind to the cell?"
  *   The **Occasionalist** looks for the *pattern*. "Does exposure precede sickness consistently?"

  In modern epidemiology, we actually do both. We look for the mechanism (biology) to satisfy the Realist urge, and we look for the statistical association (surveillance) to satisfy the Humean requirement.

  **Conclusion for your Reading Group:**
  You can tell them this: "I spent thirty years acting as a Humean in the field (trusting only observed regularities) and a Realist in the lab (looking for mechanisms), while filling out forms like a Pragmatist (picking the most useful label). If al-Ghazālī is right, I don't need to change a single thing I did, except perhaps to be slightly more humble when an intervention fails. The 'glue' is not a requirement for the work; the 'pattern' is."

  Your "bookmark theory" is robust. It doesn't matter what the book is made of, only that the bookmark helps you find the page you need to turn.
