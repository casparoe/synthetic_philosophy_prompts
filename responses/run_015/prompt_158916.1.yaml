answer: |-
  Here is the straight answer: There is no single, settled principle in the literature that captures all seven of your verdicts without friction. Your intuitions are not inconsistent; they are tracking a shift in ontology between the classical and quantum regimes that metaphysics has not yet fully reconciled.

  Your proposed principle ("If swapping changes nothing, there is one") is essentially a test for **Permutation Invariance of the Physical State**. It works beautifully for quantum cases (2, 3, 5) but fails for classical cases (1, 4, 7) because classical mechanics treats particle trajectories as primitive facts, whereas quantum mechanics treats the symmetrized state as the primitive fact.

  Below are the three leading candidate principles, an assessment of how they handle your cases, and my confidence levels regarding their viability.

  ### Candidate 1: Weak Discernibility (The Relational View)
  **Principle:** Two entities are numerically distinct if and only if they bear an irreflexive relation to each other (a relation $R$ such that $xRx$ is false).
  **Motivation:** Proposed by Simon Saunders to rescue the Principle of Identity of Indiscernibles (PII) against Black's spheres. It avoids "haecceity" (primitive thisness) by grounding distinctness in structure.
  **Verdict on Your Cases:**
  *   **Case 1 (Black's Spheres):** **Two.** They satisfy "is one mile from." This relation is irreflexive (a sphere is not one mile from itself).
  *   **Case 3 (BEC):** **Ambiguous/Two.** If the atoms have definite relative positions/momenta, they are weakly discernible. However, in a true ground-state condensate, relative position is maximally uncertain. If the wavefunction is perfectly symmetric with no spatial separation, weak discernibility fails, supporting your "One thing" verdict.
  *   **Case 6 (PDFs):** **Two.** They bear the relation "is stored on a different physical sector than."
  *   **Case 4 (Lattice):** **Two.** They bear spatial relations to the lattice sites.

  **Is it a trick?** It is not a logical trick, but it is ontologically thin. It requires you to accept that relations are as fundamental as properties.
  **Does it force the BEC atoms to be distinct?** Only if the atoms bear irreflexive relations. In a pure BEC, the atoms lose individual identity to the field mode. If you view the BEC as a single macroscopic wavefunction, there are no "atoms" to bear relations to each other. Weak discernibility applies to *particles*; if your ontology shifts to *fields* for Case 3, the problem dissolves.

  ### Candidate 2: Spacetime Localization (The Classical/Realist View)
  **Principle:** Two entities are numerically distinct if and only if they occupy disjoint regions of spacetime (distinct world-tubes).
  **Motivation:** This matches the standard practice of classical physics and chemistry (Case 4). It treats space as a substantival container that individuates.
  **Verdict on Your Cases:**
  *   **Case 1 (Black's Spheres):** **Two.** Distinct locations.
  *   **Case 2 (Delocalized Electron):** **One.** One wavefunction, no distinct world-tubes.
  *   **Case 3 (BEC):** **One.** The wavepackets overlap completely; no disjoint world-tubes.
  *   **Case 4 (Lattice):** **Two.** Localized potential wells create effective disjoint world-tubes.
  *   **Case 5 (Helium):** **Problem.** In the ground state, the spatial wavefunctions overlap completely. Strictly speaking, this principle says "One," contradicting your verdict (and standard chemical practice).
  *   **Case 7 (Macro Spheres):** **Two.** Decoherence ensures distinct quasi-classical trajectories.

  **Confidence:** High for classical regimes, Low for quantum regimes. This principle fails in standard QM because particles do not have precise trajectories.

  ### Candidate 3: Quantum Non-Individuality (The Structuralist View)
  **Principle:** Entities governed by symmetrized states (bosons/fermions) are not "objects" in the classical sense but "excitations" or "non-individuals." Counting refers to modes or occupation numbers, not distinct subjects.
  **Motivation:** Championed by Steven French and Décio Krause. It takes the permutation invariance of QM seriously as an ontological feature, not just an epistemic limitation.
  **Verdict on Your Cases:**
  *   **Case 1 (Black's Spheres):** **Two.** Classical objects are individuals.
  *   **Case 2 & 3 (Electron/BEC):** **One State.** There are not "two electrons" but one field state with occupation number 2 (or N). This matches your gut.
  *   **Case 4 (Lattice):** **Two.** Because the atoms are effectively distinguishable by location (wavefunction overlap is negligible), they behave as classical individuals.
  *   **Case 5 (Helium):** **Non-Individuals.** This contradicts your verdict ("Two"). However, it aligns with the physics that "which is which" has no answer.
  *   **Case 6 (PDFs):** **Two Tokens.** Abstract types are one; physical tokens are individuals.

  **Confidence:** High alignment with formal QM, low alignment with chemical intuition (Case 5).

  ---

  ### The Synthesis: A Principle of Causal Isolation
  Given your background, I suspect the principle that actually drives your verdicts is a pragmatic hybrid I will call **Causal Isolation via Decoherence**.

  **Precise Statement:**
  > Two entities are numerically distinct if and only if they are causally isolated enough to sustain independent counterfactual trajectories. If swapping the labels of two entities would allow for a physically possible future history where their effects diverge, they are two. If the physics constrains them to act as a single coherent unit (entanglement/overlap), they are one.

  **Application to Your Cases:**
  *   **Case 1 (Black's Spheres):** **Two.** In a classical universe, you *could* push one without the other. They have independent causal futures.
  *   **Case 2 & 3 (QM Coherent):** **One.** You cannot interact with "electron A" without interacting with the state. The counterfactuals are linked.
  *   **Case 4 (Lattice):** **Two.** The potential barriers prevent tunneling/overlap. They have independent causal futures (you can knock one out of the lattice without necessarily disturbing the other).
  *   **Case 5 (Helium):** **The Conflict.** Here is where your chemist instinct (Two) fights the physicist ontology (One). In practice, you can ionize one electron. This suggests effective causal isolation *upon interaction*. My verdict: They are **potential individuals** actualized by measurement. Before measurement, they are one state. Your verdict ("Two") assumes the measurement context is always active.
  *   **Case 6 (PDFs):** **Two.** The hard drives are causally isolated.
  *   **Case 7 (Macro Spheres):** **Two.** Decoherence destroys the interference terms. They behave like Case 1, not Case 3.

  **Application to New Cases:**
  *   **Two Qualitatively Identical Galaxies:** **Two.** They are causally isolated (outside each other's light cones, effectively). You can destroy one without affecting the other.
  *   **Universe: One Sphere vs. Two Spheres:** **Distinct Universes.** Even if the spheres are identical, the total mass-energy and gravitational field of the universe differ. The *state of the universe* is discernible, even if the local properties of the spheres are not.

  ---

  ### Confidence and Limits

  **Where the literature is settled:**
  There is no consensus on the metaphysics of Case 1 (Black's Spheres). It remains the primary battleground between Substantivalists (space individuates) and Relationists (properties individuate).
  There is consensus on the *formalism* of Cases 2, 3, 5 (QM indistinguishability), but zero consensus on the *ontology* (are they objects or non-objects?).

  **Where I am most likely to fail:**
  My synthesis relies on "causal isolation." A hard-line structural realist would argue this is just epistemic distinguishability masquerading as ontology. They would say the Helium electrons are *always* non-individuals, and your ability to ionize one is a property of the field interaction, not the electron's individuality.

  **What would change my mind:**
  1.  **For Case 1:** If a convincing argument were made that "distance" is not a fundamental property but emergent (as in some quantum gravity approaches), Black's spheres might collapse into "one location with double mass." If space is relational and there are no other relata, do they have a distance? If not, they are coincident, and thus one.
  2.  **For Case 5 (Helium):** If an experiment demonstrated a violation of the Symmetrization Postulate (paraparticles), it would prove electrons *can* be individuated. Until then, the "Two" verdict is a useful fiction for chemists, not a metaphysical truth.
  3.  **For Weak Discernibility:** If it were shown that irreflexive relations presuppose the distinctness they are meant to ground (a circularity charge often leveled by Haecceitists), I would abandon Candidate 1.

  ### Summary Recommendation
  Keep your gut verdicts. They are more consistent with scientific practice than the pure metaphysical principles.
  *   Accept **Weak Discernibility** for Classical cases (1, 4, 7). It saves the idea that space/relations individuate without needing magical "thisness."
  *   Accept **Quantum Non-Individuality** for Coherent cases (2, 3). Your instinct that counting is "bookkeeping" in a BEC is physically sound.
  *   Treat **Case 5 (Helium)** as a category boundary. In the Hamiltonian, they are one state. In the ionization chamber, they are two events. Your verdict ("Two") is pragmatic; the philosopher's verdict ("Non-individuals") is ontological. Neither is strictly "wrong," but they answer different questions.

  Your proposed "Swapping Principle" is correct *if* you add the clause: "...changes something *in the future evolution of the system*." In Black's universe (Classical), swapping allows different futures. In the BEC (Quantum), swapping does not. That distinction rescues your principle.
