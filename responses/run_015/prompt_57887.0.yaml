answer: |-
  First off, take a deep breath. You didn't just get "stumped"; you ran headfirst into one of the most famous thought experiments in the history of philosophy of biology. This is **Lewontin's Corn** (from his 1970 paper *The Analysis of Variance and the Analysis of Causes*).

  The fact that an undergrad reconstructed this argument from first principles is a compliment to your teaching (they're thinking hard) and a testament to how counter-intuitive quantitative genetics can be. You are not out of your depth; you just encountered a conceptual trap that has snared plenty of professional biologists.

  Here is the breakdown of where the reasoning breaks, why it is so seductive, and how to articulate it without throwing heritability ($h^2$) under the bus.

  ### 1. The Diagnosis: Where the Logic Snaps

  The error is entirely contained in **Step (6)**.

  > (6) Since environment only accounts for about 10% of variation, it can only account for about 10% of that 40cm mean gap...

  This step commits a **category error between variance and means**.

  Heritability ($h^2 = V_G / V_P$) is a statistic about the **spread** (variance) of a distribution *within* a specific population and environment. It tells you how much of the *deviation from the group mean* is associated with genetic deviation.

  It tells you **nothing** about the **location** (the mean) of that distribution.

  In your student's setup:
  *   **Within Greenhouse Poor:** $V_E$ is tiny (soil is uniform). $V_G$ is high (seeds vary). So $h^2$ is high.
  *   **Within Greenhouse Rich:** $V_E$ is tiny (soil is uniform). $V_G$ is high (seeds vary). So $h^2$ is high.
  *   **Between Greenhouses:** The *mean* environment ($\bar{E}$) shifts drastically.

  You can shift the entire distribution (the mean height) by 40cm via environment, even if the *width* of the distribution (the variance) is almost entirely determined by genes. Step (6) assumes that the proportion of *variance* explained by environment within a group constrains the proportion of the *mean difference* explained by environment between groups. There is no mathematical or causal rule that links these two numbers.

  ### 2. Why the Move Looks So Tempting

  If it's such a clear error, why does it feel intuitive? There are three philosophical traps here:

  **A. Reification of Heritability**
  We tend to treat $h^2$ as an intrinsic property of the *trait* (like "height is 90% genetic"), rather than a property of the *population-in-an-environment*. If height is "90% genetic," our intuition screams that any difference in height must be 90% genetic. But $h^2$ is local. It describes the sensitivity of the phenotype to genetic variation *given the current environmental variation*.

  **B. Confusion of "Difference-Making" with "Causal Share"**
  Within the greenhouse, if you pick two plants, the difference between them is likely genetic. The student infers: "If genes make the difference between Plant A and Plant B, genes must make the difference between Group A and Group B."
  But Group A and Group B differ systematically in environment, whereas Plant A and Plant B (within a greenhouse) do not. The causal structure of *individual differences* is not the same as the causal structure of *group means*.

  **C. The "Pie Chart" Fallacy**
  We visualize variance components as slices of a pie ($V_G + V_E = V_P$). It is tempting to think that if the $V_E$ slice is small (10%), Environment's "causal power" is capped at 10%. But environmental *variance* being low doesn't mean environmental *impact* is low. It just means the environment was held constant. A constant cause can have a massive effect on the mean without contributing to the variance.

  ### 3. What You Commit To If You Accept the Premises

  It is useful to walk through the costs of accepting the student's conclusion versus rejecting the utility of $h^2$.

  **If you accept Step (7) ("The gap must be genetic"):**
  *   **You deny the experimental setup:** You have to claim the random split of seeds somehow resulted in massive genetic stratification.
  *   **You endorse Genetic Determinism:** You are committed to the view that environmental changes cannot significantly shift population means if $h^2$ is high. Historically, this is the logic used to argue against social interventions (e.g., "IQ is highly heritable, so education won't close the gap between groups").
  *   **You break Causal Manipulability:** You are claiming that changing the nitrogen (which we know causally affects growth) cannot be the cause of the growth difference, which contradicts basic plant physiology.

  **If you accept the Student's Critique of $h^2$ ("$h^2$ is meaningless"):**
  *   **You lose predictive power:** $h^2$ is actually very useful *within* the context it measures. If $h^2$ is 0.9 in Greenhouse Rich, a breeder knows that selecting the tallest plants will yield taller offspring. The number isn't noise; it's just context-bound.
  *   **You throw out ANOVA:** You are essentially rejecting the logic of Analysis of Variance, which is the backbone of experimental design.

  **The Middle Path (The Correct View):**
  *   $h^2$ is real and meaningful **within the specific population and environment where it was measured.**
  *   $h^2$ is **not transportable** across environments with different means or variances.
  *   $h^2$ **cannot be used to infer causes of between-group differences.**

  ### 4. How to Explain This in Section (The "Two Bell Curves")

  Next time, bring a whiteboard. Draw two bell curves side-by-side.

  1.  **Draw Curve 1 (Poor Soil):** Make it narrow and tall. Label the width "Mostly Genetic Variance." Label the position "Low Mean."
  2.  **Draw Curve 2 (Rich Soil):** Make it identical in shape (narrow and tall). Label the width "Mostly Genetic Variance." Label the position "High Mean."
  3.  **Point to the Width:** "Inside this group, why are plants different heights? Mostly genes. That's high heritability."
  4.  **Point to the Gap:** "Why is *this* whole curve higher than *that* whole curve? Entirely soil."
  5.  **The Punchline:** "Heritability explains the **width** of the curve. It does not explain the **position** of the curve. You can move the position entirely with environment, even if the width is entirely genetic."

  ### 5. Phil Bio Nuance (For Your Own Confidence)

  Since you're in Phil Bio, you might appreciate the deeper metaphysical point. This case highlights the distinction between **causal contribution to an individual's trait** vs. **causal contribution to population variance**.

  *   **Individual Level:** For any single corn stalk, genes AND environment are both 100% necessary causes. It makes no sense to say "36cm of this stalk is genetic."
  *   **Population Level:** We can partition variance. But as Lewontin showed, the partition of variance *within* groups is mathematically independent of the partition of causes *between* groups.

  The student's argument relies on an implicit assumption that **Variance Ratios are Causal Ratios**. If $V_G$ is 90% of $V_P$, then Genes are 90% of the "Cause." This is false. Variance is about *difference*, not *production*.

  ### Summary for the Student
  You can tell the student:
  *"You've basically rediscovered Richard Lewontin's famous 1970 argument. You are right that the conclusion (7) is false. The error is in step (6). Heritability measures what causes **differences among individuals** in a specific setting. It does not measure what causes **differences between averages** of groups in different settings. High heritability within groups is perfectly compatible with 100% environmental causation of the gap between groups."*

  You didn't fumble; you just encountered the rite of passage for every philosopher of biology. You're doing fine.
