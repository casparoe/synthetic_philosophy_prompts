answer: |-
  ### Structural Diagnosis

  Before addressing your six points, here is the load-bearing analysis you asked for. This is where the argument lives or dies.

  **The Load-Bearing Step:** The entire project rests on §3, specifically the claim that "the moral weight rides on (ii) [constitutive participation]... and (a) and (b) are really attempts to squeeze (ii)'s verdict out of (i) [causal difference]." You are asserting a normative discontinuity: that an act can be morally significant *because* it constitutes a practice, even if it lacks causal leverage over that practice's outcomes.

  **The "Back Row" Objection:** The person in the back row will not be convinced by the label "constitutive." They will ask: "If my act does not change the practice's stability, frequency, or outcome (as stipulated in §4), in what sense am I *sustaining* it? If I am not sustaining it, why is the 'constitution' morally relevant?" You are trying to have your cake and eat it too: you stipulate away causal power to avoid the inefficacy objection, but you rely on a vague notion of "thinning the practice's grip" which sounds suspiciously like causal power you just denied yourself.

  **The Risk:** The argument risks being a metaphysical solution to a normative problem. You are trying to solve "Why shouldn't I do this?" by answering "Because this is what the practice *is*." But unless you explain why participating in a harmful practice is bad *independently* of the harm it causes or the intentions behind it, you haven't given a reason to act. You've just described the act differently.

  ---

  ### Critique

  #### 1. Is any step in §§1–4 invalid, or does any premise quietly assume what you say you're going to establish?
  **Verdict:** §3 begs the question.
  You assert that the moral weight rides on the constitutive relation (ii) rather than the causal profile (i). This is the conclusion you need to argue for, not the premise you start with. In §4, you claim abstaining "thins a practice's grip." If the contract is fixed and the carcass is wasted regardless, how does your abstention thin the grip? You are smuggling a causal claim (my act affects the practice's stability) back in under the guise of constitution. If you admit it doesn't affect the grip, you need to explain why constituting a harm is bad if it doesn't affect the harm's existence. You are assuming the normative significance of constitution to prove the normative significance of constitution.

  #### 2. Is the constitutive move genuinely a distinct position or a notational variant of (c) or (d)?
  **Verdict:** It is a notational variant of (d) (complicity), but weaker.
  Complicity accounts (like Kutz's) ground the wrong in intentional participation in a collective project. Your "constitutive" view seems to drop the intention requirement (since you focus on the act's relation to the practice, not the agent's mindset). To make this distinct, you must argue that *unintentional* constitution generates liability.
  **What needs to be added:** You need a metaphysical account of practices that makes them normative entities *sui generis*. You need to explain why being a "constituent part" of a harmful structure binds me morally if I lack control over the structure and no shared intention with the other constituents. Without that, you are just describing complicity without the intentionality that usually makes complicity palatable. If you keep the intentionality, you are back to (d). If you drop it, you risk over-generating liability (see point 4).

  #### 3. The single strongest objection you haven't addressed.
  **Verdict:** The "Normative Free Rider" Objection.
  This is not the inefficacy objection in disguise. The inefficacy objection says "You don't change the outcome." The Normative Free Rider objection says "Why should *I* bear the burden of rectifying or abstaining from a harm that is fully determined by others?"
  If the practice is fixed (as per your §4 stipulation), the harm occurs regardless of your choice. By demanding you abstain based on "constitution," you are asking you to incur a cost (no burger) to maintain your moral cleanliness, while the harm proceeds identically. This makes morality purely agent-relative and disconnected from the world's state. It implies that morality is about keeping one's own hands clean of "constitution" even when the dirty work gets done anyway. This risks making morality narcissistic: it matters more that *I* don't constitute the harm than that the harm doesn't happen. You need to explain why the constitutive relation matters more than the outcome.

  #### 4. A case that breaks the constitutive claim.
  **Verdict:** Here are two.
  *   **The Island Copycat:** I live on a deserted island. I kill and eat an animal exactly as done in the mainland factory farming practice. I am causally disconnected; my act does not constitute *their* practice (no market signal, no shared norm). According to your view, is my act wrong because it constitutes a practice? If yes, which practice? If no, then constitution requires a connection to the actual collective. If it requires a connection, is that connection causal? If not, what is it? This breaks the idea that "instance-to-practice" is enough without some link to the collective.
  *   **The Reluctant Constituent:** I buy the burger because my children will starve otherwise (perhaps it's the only food available). My act constitutes the practice just as much as the casual buyer. Does the constitutive view condemn me equally? If you say "no," you have reintroduced a causal or intentional condition (e.g., I didn't *intend* to support the practice, or the necessity overrides). If you say "yes," your view is too rigid. If constitution is what matters, necessity shouldn't matter, because the constitutive relation holds regardless.

  #### 5. Honest verdict: new, or old news?
  **Verdict:** Old news.
  It collapses into (d) (complicity/participation) with the intentionality requirement stripped out. This move has been explored in debates about structural injustice. The claim that "I am part of the structure therefore I am liable" is standard in structural accounts. The novelty you are aiming for—shifting from causal to constitutive—is a recognized move in non-consequentialist ethics (often associated with practice-based views of rules).
  **Why it collapses:** You are trying to avoid the "joint intention" hurdle of complicity accounts because it lets too many people off the hook. But by replacing "joint intention" with "constitutive instance," you lose the explanation for *why* I am bound to this specific collective. Complicity accounts solve this via intention. Causal accounts solve this via impact. Your account solves it via... metaphysics? Unless you explain why the metaphysics generates the norm, it's just complicity without the justification.

  #### 6. If you had to cut this to twenty minutes, what goes?
  **Verdict:** Cut §2 entirely.
  **Why:** The audience knows the standard replies (expected utility, complicity, expression). Summarizing them wastes time you need for the hard work.
  **Focus:** Spend the time on §3 and §4. Specifically, spend the bulk of the talk defending the claim that "constitution generates reasons independent of causation." That is the only thing that matters. If you can't sell that, the rest is irrelevant.
  **Also cut:** The voting worry in §5. It's a distraction. If your theory applies to voting, let it. Defend that implication rather than worrying about whether it's a reductio. It shows confidence in the view.

  ### Summary Advice
  You are trying to solve a normative problem (why shouldn't I do this?) with a metaphysical answer (because you constitute it). This works only if you can show that constituting a harm is itself a harm, or a wrong, independent of the outcome. Currently, you assert this rather than argue for it. Tighten §3. Admit that this makes morality less about "changing the world" and more about "relating to the world correctly," and defend that shift explicitly. Don't hide it behind the word "constitutive."
