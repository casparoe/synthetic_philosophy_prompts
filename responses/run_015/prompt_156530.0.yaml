prompt: |-
  ok so im curating a dataset of historical atrocities and trying to build a reusable tagging proceedure based on lemkins actual framework—not just the narrow UN convention version but the broader original one that included cultural and political destruction—so that annotaters without legal training can apply it consistently. i want a step-by-step decision tree in words: first check if there's a protected-group target (national, ethnical, racial, religious, or in lemkins broader view cultural/political collectives), then check for intent to destroy that group as such, then check whether the destruction is partial or total, but also run a seperate branch for cultural-genocide indicators like systematic language suppression or institutional destruction even when physical killing is minimal. include explicit test sentences or questions at each node that an annotator can answer yes/no/maybe. then work through two cases: one where state-induced famine is framed as 'economic reform' and the procedure has to decide if that masks genocidal intent, and one where destroying religious schools and archives happens with almost no direct killing—here the legal-definition branch should say no, but the broader lemkin branch should say yes, and i want the annotator to flag the divergence rather than resolve it. mark every step thats a judgment call dressed up as procedure—especially defining the group boundary when identities are hybrid or contested—and say what the procedure cant settle, like when two survivor communities apply different labels to the same event. keep it practical: each decision should take under five minutes, and flag where an annotator has to escalate to a human reviewer. dont ask for citations, just the operationalized framework with the hard cases and misfire points built in.
reasoning: |-
  Here's a thinking process that leads to the suggested tagging procedure:

  1.  **Analyze the Request:**
      *   **Goal:** Create a reusable tagging procedure for historical atrocities based on Raphael Lemkin's *original* framework (broader than the 1948 UN Convention), specifically designed for annotators *without* legal training.
      *   **Format:** Step-by-step decision tree (in words), including test sentences/questions (Yes/No/Maybe) at each node.
      *   **Key Components:**
          *   Check for protected group target (UN + Lemkin's broader cultural/political).
          *   Check for intent to destroy "as such."
          *   Check for partial vs. total destruction.
          *   Separate branch for cultural genocide (language, institutions) even without mass killing.
          *   Two specific case studies: State-induced famine (economic reform mask) vs. Religious/Cultural destruction (no killing).
          *   **Crucial Constraint:** Explicitly mark judgment calls disguised as procedure (e.g., defining group boundaries).
          *   **Crucial Constraint:** Acknowledge what the procedure *cannot* settle (e.g., conflicting survivor labels).
          *   **Practicality:** Each decision < 5 minutes.
          *   **Escalation:** Flag where human review is needed.
          *   **Output:** Operationalized framework, no citations, include hard cases/misfire points.

  2.  **Deconstruct Lemkin's Framework vs. UN Convention:**
      *   *UN Convention (1948):* Focuses on physical/biological destruction of national, ethnical, racial, or religious groups. Political and cultural groups were explicitly excluded during drafting.
      *   *Lemkin's Original Concept (Axis Rule in Europe, 1944):* Included cultural, political, and social destruction. "Genocide" = destruction of nationhood + destruction of human groupings. It covers patterns of coordinated action aimed at disintegrating essential foundations of national life.
      *   *Tension:* The prompt asks to use Lemkin's broader view but acknowledges the UN definition exists. The procedure needs to capture the *divergence*.

  3.  **Drafting the Decision Tree (Iterative Process):**

      *   *Phase 1: Group Identification.* Need to define the "victim collective."
          *   *Challenge:* Identities are fluid.
          *   *Solution:* Ask if the perpetrators *treated* them as a group, regardless of self-identification.
          *   *Judgment Call Alert:* Defining the boundary.

      *   *Phase 2: Intent (Mens Rea).* This is the hardest part for non-lawyers.
          *   *Challenge:* Proving "intent to destroy."
          *   *Solution:* Look for patterns, statements, and foreseeable consequences.
          *   *Judgment Call Alert:* Distinguishing negligence/repression from genocidal intent.

      *   *Phase 3: Acts (Actus Reus).*
          *   *Branch A (Physical/Biological):* Killing, harm, conditions of life.
          *   *Branch B (Cultural/Institutional - Lemkin Specific):* Language, schools, archives, leadership.

      *   *Phase 4: Classification.*
          *   UN Genocide? (Physical + Protected Group).
          *   Lemkin Genocide? (Cultural/Political + Protected Group).
          *   Divergence Flag.

  4.  **Developing the Case Studies:**
      *   *Case 1: Famine/Economic Reform.* (e.g., Holodomor or Great Leap Forward).
          *   *Test:* Does "economic reform" mask intent?
          *   *Outcome:* Likely "Maybe" on intent -> Escalate.
      *   *Case 2: Cultural Destruction.* (e.g., Residential Schools, Tibetan cultural erasure).
          *   *Test:* Killing minimal, institutions destroyed.
          *   *Outcome:* UN = No, Lemkin = Yes. Flag divergence.

  5.  **Refining the "Judgment Call" Warnings:**
      *   I need to make sure the user knows where the algorithm breaks down.
      *   *Key areas:* Group definition, inferring intent from policy language, conflicting community memories.

  6.  **Writing the Procedure (incorporating constraints):**
      *   *Tone:* Operational, clear, directive.
      *   *Structure:* Phases -> Questions -> Actions.
      *   *Time limit:* Keep questions simple.
      *   *Escalation:* Clear "Stop and Review" points.

  7.  **Review against Constraints:**
      *   *Step-by-step?* Yes.
      *   *Test sentences?* Yes.
      *   *Two cases worked through?* Yes.
      *   *Mark judgment calls?* Yes (will use [WARNING] tags).
      *   *What procedure can't settle?* Yes (will add a "Limitations" section).
      *   *No citations?* Yes.
      *   *Practical (<5 mins/step)?* Yes, questions are designed for quick document scanning.

  8.  **Final Polish:**
      *   Ensure the distinction between the "UN Track" and "Lemkin Track" is clear in the final classification.
      *   Make sure the "Divergence Flag" is prominent.
      *   Check that the "Famine" case highlights the intent masking issue.
      *   Check that the "Cultural" case highlights the definition gap.

      *(Self-Correction during drafting)*: Initially, I might make the intent questions too legalistic. I need to simplify them to "pattern recognition" for non-lawyers. Instead of "specific intent," ask "Does the policy disproportionately target this group's existence?"
      *(Self-Correction)*: Ensure I explicitly state that annotators should *not* resolve the divergence, just flag it.

  9.  **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # Operational Tagging Procedure: Lemkin Framework for Historical Atrocities

  **Purpose:** To classify historical events using Raphael Lemkin's original conceptualization of genocide (including cultural/political destruction) while simultaneously tracking alignment with the 1948 UN Convention.
  **Target User:** Annotators without legal training.
  **Time Budget:** Max 5 minutes per decision node.
  **Rule of Thumb:** If you spend more than 5 minutes debating a single node, **ESCALATE** to Human Review.

  ---

  ## PHASE 1: TARGET IDENTIFICATION (The "Who")

  **Goal:** Determine if a specific collective is being targeted.

  **Node 1.1: Group Cohesion**
  *   **Question:** Does the source material describe the victims as sharing a common identity (national, ethnic, racial, religious, cultural, or political)?
  *   **Test Sentence:** "The perpetrators referred to the victims as [X] and treated them differently from the rest of the population."
  *   **Options:** YES / NO / MAYBE
  *   **[WARNING: JUDGMENT CALL]:** Identities are often hybrid or contested. Do not require the group to be biologically distinct. If the *perpetrators* treated them as a distinct group, mark YES.
  *   **Action:**
      *   NO → Stop. Tag: "Mass Atrocity / Non-Genocidal."
      *   MAYBE → **ESCALATE.** (Reason: Boundary definition requires historical context).
      *   YES → Proceed to 1.2.

  **Node 1.2: Group Category (UN vs. Lemkin)**
  *   **Question:** Which category best fits the targeted group?
  *   **Options:**
      *   A: National, Ethnical, Racial, Religious (UN Protected)
      *   B: Political, Cultural, Social, Economic Class (Lemkin Only)
      *   C: Mixed/Overlapping
  *   **Action:**
      *   Select A → Follow **UN Track**.
      *   Select B → Follow **Lemkin Track**.
      *   Select C → Follow **Both Tracks**.

  ---

  ## PHASE 2: INTENT ANALYSIS (The "Why")

  **Goal:** Assess if the goal is destruction of the group *as such*, not just repression of individuals.

  **Node 2.1: Pattern of Action**
  *   **Question:** Do the actions seem coordinated to undermine the group's survival, rather than being random or purely military?
  *   **Test Sentence:** "The policies systematically removed the group's ability to function as a community (e.g., removing leaders, banning language, seizing food)."
  *   **Options:** YES / NO / MAYBE
  *   **Action:**
      *   NO → Stop. Tag: "Repression / Human Rights Violation."
      *   MAYBE → **ESCALATE.** (Reason: Distinguishing negligence from intent is a high-risk legal judgment).
      *   YES → Proceed to 2.2.

  **Node 2.2: Stated vs. Inferred Intent**
  *   **Question:** Is there explicit evidence of intent to destroy, or is it masked by other language (e.g., "economic reform," "security," "assimilation")?
  *   **Test Sentence:** "Even if the stated goal was [X], the foreseeable result was the disappearance of the group."
  *   **Options:**
      *   Explicit (Direct orders/statements)
      *   Masked (Policy language hides the outcome)
      *   Negligent (Outcome was ignored but not planned)
  *   **[WARNING: JUDGMENT CALL]:** "Masked" intent is the hardest call. If the policy disproportionately kills one group while sparing neighbors, mark **Masked**.
  *   **Action:**
      *   Negligent → **ESCALATE.** (Reason: Legal distinction between recklessness and genocide).
      *   Explicit/Masked → Proceed to Phase 3.

  ---

  ## PHASE 3: DESTRUCTION MODE (The "How")

  **Goal:** Separate physical destruction from cultural destruction.

  **Node 3.1: Physical/Biological Harm (UN Track)**
  *   **Question:** Is there evidence of killing, serious bodily/mental harm, or conditions of life calculated to bring about physical destruction (famine, disease, exposure)?
  *   **Test Sentence:** "The group members are dying or being killed at a rate higher than natural causes."
  *   **Options:** YES / NO
  *   **Action:**
      *   YES → Tag: **UN Genocide Indicator.**
      *   NO → Tag: **UN Genocide Indicator: Negative.**

  **Node 3.2: Cultural/Institutional Harm (Lemkin Track)**
  *   **Question:** Is there systematic destruction of the group's institutions, language, religion, or leadership, even if physical killing is low?
  *   **Test Sentence:** "The group can no longer transmit its culture, language, or leadership to the next generation due to state action."
  *   **Examples:** Banning language, destroying archives, forced transfer of children, liquidating political/cultural elites.
  *   **Options:** YES / NO
  *   **Action:**
      *   YES → Tag: **Lemkin Genocide Indicator (Cultural/Political).**
      *   NO → Tag: **Lemkin Genocide Indicator: Negative.**

  ---

  ## PHASE 4: CLASSIFICATION & DIVERGENCE FLAG

  **Goal:** Final tagging and identifying conflicts between frameworks.

  **Node 4.1: Final Classification**
  *   **Combine Results:**
      *   If 3.1=YES and 1.2=A → **UN Genocide.**
      *   If 3.2=YES and 1.2=B/C → **Lemkin Genocide (Cultural/Political).**
      *   If 3.1=NO but 3.2=YES → **DIVERGENCE CASE.**

  **Node 4.2: The Divergence Flag**
  *   **Instruction:** If the UN Track is Negative but the Lemkin Track is Positive, you **MUST** apply the `FLAG_DIVERGENCE` tag.
  *   **Rule:** Do **NOT** resolve the conflict. Do not decide which label is "correct." Your job is to record that the event fits Lemkin's original theory but falls outside the 1948 legal convention.
  *   **[WARNING: PROCEDURE LIMITATION]:** This procedure cannot settle disputes where two survivor communities apply different labels to the same event (e.g., one claims genocide, the other claims civil war). If source material shows deep community disagreement on the label, apply `FLAG_CONTESTED_MEMORY` and **ESCALATE**.

  ---

  ## CASE STUDY WALKTHROUGHS

  ### Case 1: State-Induced Famine Framed as "Economic Reform"
  *Context:* A state implements agricultural collectivization. A specific ethnic region is subjected to impossible quotas. Millions starve. The state calls it "modernization."

  *   **Phase 1 (Target):**
      *   1.1: YES (Ethnic region treated distinctly).
      *   1.2: C (Mixed Ethnic/Political). → **Follow Both Tracks.**
  *   **Phase 2 (Intent):**
      *   2.1: YES (Quotas systematically removed ability to survive).
      *   2.2: **Masked.** (Stated goal: Reform. Foreseeable result: Starvation of specific group).
      *   *Decision:* Annotator marks "Masked." Since "Masked" is high-risk, this triggers an **ESCALATE** for final intent verification, but for tagging purposes, we proceed assuming intent is plausible.
  *   **Phase 3 (Destruction):**
      *   3.1 (Physical): YES (Mass death by starvation).
      *   3.2 (Cultural): YES (Village structures broken, leaders purged).
  *   **Phase 4 (Classification):**
      *   UN Track: Positive (Physical destruction of ethnic group).
      *   Lemkin Track: Positive.
      *   **Result:** Tag **UN Genocide** AND **Lemkin Genocide**.
      *   **Note:** The "Economic Reform" mask is recorded in the metadata under `Intent_Type: Masked`. The annotator does not decide if the reform was "real," only that the *effect* was genocidal.

  ### Case 2: Destruction of Religious Schools/Archives (Minimal Killing)
  *Context:* A state bans a minority religion's language, closes all seminaries, and confiscates archives. Leaders are imprisoned, not executed. Physical death toll is low.

  *   **Phase 1 (Target):**
      *   1.1: YES (Religious/Cultural collective).
      *   1.2: A (Religious) AND B (Cultural). → **Follow Both Tracks.**
  *   **Phase 2 (Intent):**
      *   2.1: YES (Systematic removal of transmission mechanisms).
      *   2.2: Explicit (Laws explicitly ban the institutions).
  *   **Phase 3 (Destruction):**
      *   3.1 (Physical): **NO.** (Minimal direct killing).
      *   3.2 (Cultural): **YES.** (Language/Institutions destroyed).
  *   **Phase 4 (Classification):**
      *   UN Track: Negative (No physical destruction).
      *   Lemkin Track: Positive (Cultural destruction).
      *   **Result:** Tag **Lemkin Genocide (Cultural)**.
      *   **Action:** Apply `FLAG_DIVERGENCE`.
      *   **Annotation Note:** "Event meets Lemkin's criteria for cultural genocide but fails 1948 UN Convention Article II due to lack of physical killing. Annotator does not resolve validity; flags divergence for legal review."

  ---

  ## PROCEDURE LIMITATIONS & MISFIRE POINTS

  **1. The "Group Boundary" Misfire**
  *   **Problem:** The procedure asks annotators to identify a group. In history, groups merge, split, or are invented by census categories.
  *   **Limitation:** This tool cannot determine if a group was "real" prior to the attack. It only measures if they were *treated* as a group by the perpetrator.
  *   **Escalation:** If historical sources disagree on whether the group existed as a distinct entity *before* the violence, **ESCALATE**.

  **2. The "Intent vs. Foreseeability" Misfire**
  *   **Problem:** Non-lawyers struggle to distinguish between "I knew they would die" (recklessness) and "I wanted them to die" (specific intent).
  *   **Limitation:** This procedure treats "Masked Intent" (foreseeable destruction) as sufficient for tagging, which is broader than some court standards.
  *   **Escalation:** If the policy could plausibly be argued as a legitimate security measure with accidental side effects, **ESCALATE**.

  **3. The "Contested Memory" Misfire**
  *   **Problem:** Survivor communities often disagree. One faction may claim genocide; another may claim it erases their agency or prefers the label "politicide."
  *   **Limitation:** This procedure **cannot** arbitrate community memory.
  *   **Escalation:** If primary sources from the victim group show significant disagreement on the label, apply `FLAG_CONTESTED_MEMORY`. Do not pick a side.

  **4. The "Cultural vs. Physical" Split**
  *   **Problem:** Cultural destruction often leads to physical death eventually (loss of medical knowledge, social support), but the timeline is long.
  *   **Limitation:** If the physical death happens 20 years later, this procedure might miss the link.
  *   **Escalation:** If the cultural destruction is clearly a precursor to physical liquidation but the killing hasn't happened *yet* in the dataset timeframe, **ESCALATE**.

  ---

  ## QUICK REFERENCE: ESCALATION TRIGGERS

  1.  **Group Definition:** "Maybe" on Node 1.1 or historical disagreement on group existence.
  2.  **Intent:** "Negligent" on Node 2.2 or plausible non-genocidal explanation for policy.
  3.  **Memory:** Conflicting labels from victim community representatives.
  4.  **Time:** Any single node takes >5 minutes to decide.

  **End of Procedure.**
