prompt: |-
  I'm putting together the preregistration for a follow-up to my undergrad thesis — I'm in the second year of a cog-sci PhD now — and I keep going in circles with my supervisor about the design, so I thought I'd ask here. Short version: we're running a fairly large multilingual online survey of philosophical case judgments. Gettier-style cases, a couple of trolley variants, some of those side-effect cases where someone brings about a bad outcome as a side effect and people say he did it intentionally. Around twelve languages, native-speaker translation plus back-translation, comprehension checks, the usual. My flatmate thinks the whole project is unfalsifiable and I'd like to be able to tell her why it isn't.

  The working plan is to treat the whole thing as a sampling problem: analytic philosophy has been leaning on the intuitions of a very unrepresentative slice of humanity, so the fix is to sample properly and then aggregate. Weight the responses somehow — we can't decide between weighting by population size, weighting by number of languages, or just equally per site — and take whatever the global majority says as the verdict. If the global majority disagrees with what philosophers have been saying since the 60s, then the philosophers update their theories; that seems to me like the entire point of the critique. I also want to add a short debiasing preamble before each vignette, a neutral rewording that strips out the cultural framing — honorifics, names that signal ethnicity, anything that might trigger a local script — so that what we end up measuring is the intuition itself rather than the cultural overlay sitting on top of it. And if it still varies after all that, I guess we just report that knowledge and intentional action are culturally relative and leave it there?

  My supervisor says the design has a conceptual problem rather than a statistical one, and that I'm presupposing the thing the literature is actually arguing about, but she won't tell me what she means until I work it out myself, which is driving me up the wall. So, concretely: is the weighting question even the right question to be asking, does the debiasing preamble do what I think it does, and what am I supposed to conclude from variation if it shows up — relativism, or something else? One more thing while I'm here: we have budget for a single extra between-subjects condition for control items, and I was going to spend it on a non-philosophical item that we already know varies across cultures, something like a risk-preference or trust question, on the theory that if it varies too then response style is doing the work. Is that the right control, or am I about to waste the condition?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Context:**
      *   **User:** 2nd-year CogSci PhD student.
      *   **Task:** Preregistering a follow-up to an undergrad thesis (experimental philosophy/X-Phi).
      *   **Project:** Large multilingual online survey of philosophical case judgments (Gettier, Trolley, Side-Effect/Knobe). ~12 languages, native translation + back-translation.
      *   **Conflict:** Flatmate says it's unfalsifiable. Supervisor says there's a *conceptual* problem (presupposing the conclusion) but won't spell it out. User is stuck in circles.
      *   **Proposed Design:** Treat as sampling problem (fix unrepresentative WEIRD samples), aggregate global majority (weighted by pop/language/equal), update philosophy if majority disagrees. Add "debiasing preamble" to strip cultural framing. If variation remains, conclude cultural relativism.
      *   **Control Condition:** Budget for one between-subjects control. Planning to use a known cultural variance item (risk/trust) to check for response style.
      *   **Goal:** Understand the conceptual flaw, justify falsifiability to flatmate, decide on weighting, interpret variation, and choose the right control.

  2.  **Deconstruct the Scientific/Philosophical Issues:**

      *   **Issue 1: The "Global Majority" Verdict (Aggregation Problem).**
          *   *User's Plan:* Take the global majority verdict as the "truth" for philosophy.
          *   *Problem:* Philosophy isn't a democracy. Just because 6 billion people think $X$ about knowledge doesn't make $X$ the correct philosophical analysis of knowledge. This is the *Genetic Fallacy* or an appeal to popularity.
          *   *Supervisor's Hint:* "Presupposing the thing the literature is actually arguing about." The literature argues about whether intuitions *matter* for truth conditions, not just who has them. If the goal is to test *universality* of intuitions, fine. But if the goal is to settle the *philosophical question* via vote, that's category error.
          *   *Weighting:* Weighting by population implies demographic representativeness equals philosophical correctness. Weighting by language implies linguistic diversity equals correctness. Equal weighting implies site equality. None of these solve the normative question.

      *   **Issue 2: The "Debiasing Preamble" (Stimulus Construction).**
          *   *User's Plan:* Strip names, honorifics, etc., to measure "pure intuition."
          *   *Problem:* Context *is* part of the intuition. Removing all cultural markers might create an artificial vacuum that doesn't reflect how concepts are actually used. Also, "neutral" is culturally loaded. What seems neutral to a Western researcher might seem cold or suspicious elsewhere.
          *   *Conceptual Flaw:* It assumes there *is* a culture-free intuition underneath. The variation *is* the data, not noise to be removed.

      *   **Issue 3: Interpretation of Variation (Relativism vs. Performance Error).**
          *   *User's Plan:* If variation remains -> Cultural Relativism.
          *   *Problem:* Variation could mean: (a) Concepts differ (Relativism), (b) One group is misunderstanding (Competence vs. Performance), (c) Framing effects (Pragmatics), (d) Response bias. Jumping straight to relativism ignores the "Expertise Defense" or "Performance Error" counter-arguments.
          *   *Flatmate's "Unfalsifiable" Claim:* If you find universality, you say "Philosophy was right." If you find variation, you say "Relativism is true." Is there a outcome that disproves the *method*? Actually, the flatmate might be pointing at the fact that *philosophical theories* aren't easily falsified by survey data (the "theory-ladenness" of intuition). But the study itself is falsifiable (e.g., no variation found). The *conclusion* drawn might be the weak link.

      *   **Issue 4: The Control Condition.**
          *   *User's Plan:* Non-philosophical item known to vary (risk/trust). If it varies, response style is at work.
          *   *Problem:* If risk preference varies, it proves *some* things vary. It doesn't prove *philosophical* variation is just response style. It's a manipulation check for *variance*, not a control for *bias*.
          *   *Better Control:* A "dummy" philosophical vignette where there *should* be no variation (logic/math), or a comprehension check that filters out noise. Or, better yet, a measure of *acquiescence bias* directly. Actually, the best use of a control in X-Phi is often to test the *expertise defense* (compare laypeople to philosophers) or to test *framing* directly. But given the budget constraint (1 condition), a standard psychological measure of response style (like social desirability or acquiescence) might be better than a substantive risk question.
          *   *Wait, re-reading:* "If it varies too then response style is doing the work." This logic is flawed. If risk varies, it means culture affects risk. It doesn't mean culture affects *Gettier* judgments *only* via response style. It confounds substantive cultural difference with methodological artifact.

  3.  **Synthesize the Supervisor's Critique:**
      *   "Presupposing the thing the literature is actually arguing about."
      *   The literature (Experimental Philosophy) argues about the *evidential status* of intuitions.
      *   The User's design assumes: Intuitions = Evidence for Truth.
      *   The Critique: If you assume intuitions determine truth, you are doing *Naturalized Epistemology* or *Folk Semantics*, not testing the *validity* of the philosophical method. If you find variation, you haven't falsified the philosophical claim (e.g., "Knowledge is JTB"), you've only falsified the claim that "Everyone agrees Knowledge is JTB."
      *   The "Global Majority" approach assumes a democratic epistemology which most philosophers reject.

  4.  **Drafting the Response:**

      *   **Tone:** Professional, empathetic (PhD struggles are real), precise, encouraging but critical.
      *   **Structure:**
          1.  Validate the frustration (Supervisor pedagogy style).
          2.  Address the Flatmate (Falsifiability).
          3.  Address the Supervisor (Conceptual Problem/Aggregation).
          4.  Address the Debiasing Preamble (Context is key).
          5.  Address the Variation/Relativism (Alternative explanations).
          6.  Address the Control Condition (Better options).
          7.  Actionable Advice for Preregistration.

      *   **Key Points to Hit:**
          *   *Falsifiability:* The study is falsifiable (data can contradict hypotheses), but the *philosophical implication* is what's murky.
          *   *Weighting:* It's a normative choice, not statistical. Don't hide it.
          *   *The "Majority Verdict":* This is the biggest conceptual hole. Philosophy isn't polling.
          *   *Debiasing:* "Neutral" is impossible. You're measuring *abstracted* intuition, not *pure* intuition.
          *   *Control:* Risk preference is a confound. Use a measure of response bias (acquiescence) or a logical control.
          *   *Supervisor's Riddle:* You are assuming intuitions *constitute* the truth conditions, rather than serving as *evidence* for them.

  5.  **Refining the Control Condition Advice:**
      *   If the goal is to check if variation is just "noise/style," you need something that *shouldn't* vary conceptually but *would* vary via style.
      *   Example: "I prefer red to blue" (preference varies) vs. "2+2=4" (doesn't vary).
      *   Actually, a better control for *response style* is a psychological scale like the Marlowe-Crowne Social Desirability Scale or a simple Acquiescence index (agreeing with contradictory statements).
      *   If the user spends the condition on "Risk," and Risk varies, they learn nothing about the Gettier data. It just shows culture matters.
      *   *Recommendation:* Use the condition for a measure of * Acquiescence Bias* or *Numeracy/Comprehension* to filter noise. Or, if they want to test the "Expertise Defense," compare laypeople to a small philosopher sample (but budget says online survey). Let's suggest a "Logic/Comprehension" control or a "Response Style" scale.

  6.  **Refining the "Global Majority" Critique:**
      *   This is the "Supervisor's Point."
      *   If 90% of humans say Gettier cases aren't knowledge, does that mean the Stanford Encyclopedia entry is wrong?
      *   Only if you believe philosophy is descriptive anthropology of concepts.
      *   If you believe philosophy is normative (what *should* knowledge be), the survey is irrelevant to the truth, only to the *usage*.
      *   The design presupposes *Descriptivism* is the correct meta-philosophical stance. That is the contested point.

  7.  **Final Polish:**
      *   Make sure to distinguish between "The study is unfalsifiable" (False, it's empirical) and "The conclusion doesn't follow" (True, that's the conceptual problem).
      *   Help the user articulate this to the flatmate and the supervisor.

  **(Self-Correction during drafting):** I need to be careful not to undermine the user's project. X-Phi is valid. But the *interpretation* plan is weak. I should frame it as "Refining the research question" rather than "Your project is broken." The shift should be from "Settling philosophical debates via vote" to "Mapping the landscape of folk intuitions to constrain philosophical theory."

  **(Control Condition Re-evaluation):** The user wants to know if variation is "response style." If they use a risk question, and it varies, it shows cultural variation exists. It doesn't prove the Gettier variation is *only* response style. A better control for response style is a set of items where the correct answer is objective, or a measure of tendency to agree. I will suggest a "Acquiescence Bias" measure or a "Logical Truth" control.

  **(Supervisor's Riddle):** "Presupposing the thing the literature is arguing about." The literature argues about whether intuitions are evidence. The user assumes they are. That's the circularity. I need to explain this clearly.

