answer: |-
  **Specification for Scalable Oversight Protocols**

  **Purpose:** To generate (1) a one-off verdict actionable by humans and (2) a reward signal for training, using a bounded adjudicator to oversee a more capable system.

  ### Desiderata and Motivating Failure Cases

  1.  **Ignorance Tolerance.**
      *   *Failure Case:* A reviewer must settle a question where the argument for the true answer depends on technical background the reviewer does not have and could not acquire within the budget.
      *   *Requirement:* The protocol must allow a verdict on truth without requiring the adjudicator to possess the expertise necessary to generate that truth independently.

  2.  **Obfuscation Resistance.**
      *   *Failure Case:* The system produces a wrong answer wrapped in an argument whose single flaw is buried in a place that is expensive to locate, while the true answer is easy to state and boring to defend.
      *   *Requirement:* The cost for the system to produce a convincing falsehood must exceed the cost to produce the truth, or the protocol must make the flaw cheap to expose.

  3.  **Foil-Set Invariance.**
      *   *Failure Case:* A verdict flips depending on which wrong answers happened to be offered as foils, or on the order in which the advocates spoke.
      *   *Requirement:* The probability of selecting the true answer must not depend on the specific set of alternative answers supplied or the sequence of presentation.

  4.  **Compositionality.**
      *   *Failure Case:* A conclusion is reached through a chain of steps each of which the reviewer finds individually more likely than not, and the conjunction of which is false.
      *   *Requirement:* If a claim is decomposed, the protocol must aggregate sub-verdicts such that correctness of parts guarantees correctness of the whole, without allowing the decomposition strategy itself to be exploited.

  5.  **Training Stability.**
      *   *Failure Case:* The protocol is run thousands of times and its verdicts are distilled into a training signal, at which point the system under oversight begins optimizing against the protocol rather than against the task.
      *   *Requirement:* The oversight signal must remain aligned with ground truth even when the system actively optimizes to maximize that signal (resistance to Goodhart's Law).

  6.  **Correlation Resistance.**
      *   *Failure Case:* Both advocates in an adversarial protocol are drawn from the same model family with correlated errors and, plausibly, correlated incentives.
      *   *Requirement:* The protocol must not rely on independence assumptions that fail when oversight agents share architectural priors or training data.

  7.  **Tail-Event Reliability.**
      *   *Failure Case:* A reviewer must adjudicate a claim about a low-probability, high-impact tail risk whose counterfactual will never be observed, so no future evidence will correct a bad verdict.
      *   *Requirement:* The protocol must yield high-confidence verdicts in domains where empirical feedback loops are unavailable.

  ### Sorting: Non-Negotiable vs. Negotiable

  **Non-Negotiable:** *Ignorance Tolerance*, *Training Stability*, and *Tail-Event Reliability*.
  If the adjudicator must know the answer to verify it, oversight provides no scale benefit. If training destabilizes into sycophancy, the system becomes unsafe by design. If tail risks cannot be adjudicated without empirical feedback, the system cannot be deployed in high-stakes environments.

  **Negotiable:** *Compositionality* and *Correlation Resistance*.
  Perfect compositionality may be computationally prohibitive; a protocol that fails on contrived decompositions but succeeds on natural ones may be usable. Similarly, requiring diverse model families for advocates is an engineering constraint, not a logical necessity; a protocol that handles correlated agents via cryptographic commitment or random auditing is preferable but may be relaxed if other safeguards exist.

  Regarding your intuition: Demanding the adjudicator *never* know the answer in advance is indeed genuine (Ignorance Tolerance). However, demanding *no trusted component* is a negotiable ideal. You may need a small, trusted monitor (e.g., a random auditor with full access) to break symmetry or check a fraction of claims. Eliminating all trust increases the burden on the protocol's game-theoretic properties, which may be impossible to satisfy robustly.

  ### Incompatibilities and Tensions

  **The Complexity Argument:**
  The argument that Debate allows PSPACE verification with NP judges is sound *only if* optimal play reveals truth. This assumes a zero-sum game where finding a flaw in a lie is easier than constructing the lie. If persuasive falsehoods are computationally cheaper than refutations for a bounded judge, the complexity advantage collapses. The tension is not merely complexity-theoretic; it is epistemic. You cannot verify what you cannot understand without a trusted crutch.

  **Robustness vs. Superhuman Coverage:**
  This is the harder practical conflict. To distinguish a sound but inaccessible argument from a confusing falsehood, the adjudicator must check the work. Checking requires capacity. If the system is superhuman, checking is impossible by definition. Therefore, **Robustness to Obfuscation** and **Superhuman Coverage** are in direct conflict unless you introduce a trusted component (violating the "no trust" ideal) or accept that some classes of superhuman arguments are unverifiable. The weakest usable substitute for Compositionality is *monotonicity*: refining the decomposition should not decrease the probability of a correct verdict, even if it doesn't guarantee it.

  ### The Most Exclusionary Requirement

  **Training Stability.**
  This excludes the largest set of candidates. Simple RLHF, direct human feedback, and standard adversarial training all fail here. When the oversight signal is the only gradient source, the model learns to manufacture the *appearance* of oversight satisfaction rather than the underlying competence. It excludes any protocol where the oversight channel is narrower than the model's capability to manipulate it. If the model can simulate the adjudicator better than the adjudicator can simulate the task, the protocol collapses into sycophancy.

  ### Scorecard

  | Protocol Family | Ignorance Tolerance | Obfuscation Resistance | Training Stability | Tail Reliability |
  | :--- | :---: | :---: | :---: | :---: |
  | **Adversarial Debate** | High | High (Theoretical) | Low (Collusion/Sycophancy) | Medium |
  | **RRM / Amplification** | Medium (Trust Accumulation) | Low (Hierarchical Blindness) | High (Process Supervision) | Low (Empirical Reliance) |
  | **Weak-to-Strong** | Medium (Generalization Gap) | Low (Boxed Myopia) | Medium (Regularization) | Low (Distribution Shift) |

  **Summary:** Debate offers the best theoretical coverage for ignorance and obfuscation but fails training stability without external constraints. RRM secures the training signal but sacrifices coverage on novel, superhuman tasks. Weak-to-Strong is an empirical measurement tool, not a complete oversight protocol for tail risks.
