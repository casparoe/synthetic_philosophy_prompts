answer: |-
  **The Substrate Trap: Why Layering the Primary Intension Collapses Two-Dimensional Semantics**

  Two-dimensional semantics (2DS) was designed to solve a specific philosophical embarrassment: the existence of necessary a posteriori truths. Saul Kripke showed us that identities like "Water = H2O" are metaphysically necessary—if water is H2O, it is H2O in every possible world—yet we can only discover this through empirical investigation. This created a rift between the epistemic (what we can know from the armchair) and the metaphysical (how the world is structured). David Chalmers and Frank Jackson attempted to bridge this rift using a framework derived from David Kaplan, distinguishing between the *primary intension* (how reference is fixed epistemically) and the *secondary intension* (how reference behaves modally once fixed).

  Your intuition to propose a "layered" primary intension—splitting it into a "surface" (armchair accessible) and a "substrate" (reference-fixing but pre-empirical)—is a sophisticated reaction to a known weakness in the standard model. You have identified that the standard primary intension often feels too thin to do the work of reference fixing, while the secondary intension feels too detached from our cognitive grasp. However, while this layered approach attempts to save 2DS from being too superficial, it ultimately collapses the framework into a disguised version of direct-reference theory. The split is not essential; it is self-defeating. By attempting to locate the metaphysical "heavy lifting" within the primary intension, you inadvertently surrender the epistemic purity that makes 2DS distinct, rendering the machinery explanatory idle.

  To understand why this collapse occurs, we must look at the specific job the primary intension is hired to do. In the Chalmers-Jackson framework, the primary intension is a function from *centered worlds* (epistemic scenarios) to extensions. It answers the question: "Given that this is how the world turns out to be, what does my term refer to?" Crucially, this is supposed to be knowable a priori. If I know the primary intension of "water," I should be able to determine what counts as water in any hypothetical scenario described to me, without needing further empirical investigation into that scenario.

  Your "surface layer" fits this description perfectly. It corresponds to the phenomenal or functional description: "the clear, drinkable liquid in the lakes." This is accessible from the armchair. However, as you noted, this layer is too weak to handle Kripkean cases. If we encounter a Twin Earth scenario, the surface layer picks out XYZ, but our actual term "water" refers to H2O. The surface layer fails to capture the *necessity* of the identity.

  This is where your "substrate layer" enters. You propose this layer fixes reference across worlds but operates "pre-empirically." You suggest it handles the metaphysical commitment (e.g., "whatever natural kind underlies the surface") without requiring empirical discovery. Here lies the fatal tension. If the substrate layer determines reference based on metaphysical structure (e.g., molecular composition or causal history), it is functioning exactly like a Kripkean secondary intension. It is saying, "Refer to whatever has the same underlying structure as *this*."

  The problem is the claim that this operates "pre-empirically." If the substrate layer is part of the *primary* intension, it must be epistemically transparent. We must be able to know a priori that "water" picks out "whatever natural kind underlies the surface." But knowing *that* there is a underlying natural kind, and *that* our term is rigidly attached to it, is precisely the a posteriori discovery Kripke identified. We did not know a priori that water had a microstructure; we could have discovered that water was a basic element or a supernatural fluid.

  By baking the "substrate" into the primary intension, you are effectively claiming that we have a priori access to the metaphysical essence of natural kinds. You are asserting that part of the *meaning* of "water" is "the natural kind that actually causes these sensations." If this were true, then once we discover water is H2O, the statement "Water is the natural kind H2O" would be analytic and a priori. But it isn't. It remains a synthetic identity.

  Consequently, your layered model forces a dilemma. If the substrate layer is truly a priori (accessible from the armchair), it cannot contain specific metaphysical commitments about natural kinds, because those commitments are empirical. If it is just a placeholder like "whatever plays the role," it collapses back into the surface layer and loses its reference-fixing power. If, on the other hand, the substrate layer contains the metaphysical commitment to "same kind as this," it is no longer a primary intension; it is a secondary intension masquerading as an epistemic rule.

  This leads to the verdict: the layered version collapses 2DS into a complex direct-reference view. Direct-reference theorists (like Kripke or Putnam) argue that reference is fixed by a causal-historical chain, not by a descriptive intension. Your "substrate" is essentially a description of that causal-historical mechanism ("the stuff standing in the right relation to this sample"). By calling this an "intension," you are merely labeling the causal mechanism with a semantic term. You haven't explained *how* meaning bridges the gap between mind and world; you have just hidden the causal mechanism inside the definition of meaning.

  The machinery of 2DS is designed to show that there are two distinct ways of evaluating content: epistemic and metaphysical. Its explanatory power relies on the clean separation of these two dimensions. The primary intension explains cognitive significance (why "Water = H2O" is informative), and the secondary intension explains modal necessity (why "Water = H2O" is necessary). Your proposal muddies this separation. If the primary intension contains a "substrate" that reaches out and grabs the metaphysical essence, then the primary intension is no longer purely epistemic. It becomes a hybrid that claims to know metaphysical truths from the armchair.

  This does not save 2DS; it breaks it. If the primary intension is metaphysically loaded, then the distinction between the two dimensions dissolves. We are left with a single dimension that claims to be both epistemic and metaphysical, which is exactly the confusion Kripke cleared up in the 1970s. The "mystery" of how reference is fixed is not solved by calling it a "substrate layer"; it is merely relocated. Instead of asking "How does causal reference work?", we now ask "How does the substrate layer access metaphysical essence a priori?" The latter question is arguably harder to answer than the former.

  Therefore, the split is self-defeating. Two-dimensional semantics survives only if it maintains the purity of the primary intension as a purely epistemic, descriptive, or functional mapping. It must accept that the primary intension does *not* fix reference in the metaphysical sense; it only fixes reference in the epistemic sense (i.e., it determines what we *mean*, not necessarily what we *pick out* in the actual world if our metaphysics is wrong). The "heavy lifting" of reference fixing must remain the job of the secondary intension and the external world, not the primary intension.

  To conclude: your layered intuition is a symptom of the desire to make 2DS do more than it can. You want the primary intension to secure the rigidity of natural kinds without paying the empirical cost. But you cannot have rigidity without empirical grounding. By trying to secure it via a "substrate" in the primary intension, you strip the primary intension of its a priori status. The result is a framework that looks like 2DS but operates like direct reference, lacking the explanatory benefit of either. The machinery stops doing real work and becomes a label for the very mystery it was meant to solve. 2DS remains viable only if we accept that the primary intension is "thin"—limited to the surface layer—and acknowledge that the metaphysical "substrate" belongs firmly to the secondary dimension, accessible only after the empirical work is done.
