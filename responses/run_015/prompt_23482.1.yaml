          2.  **Subject-Sensitive Invariantism (SSI) / Pragmatic Encroachment:** Knowledge *itself* depends on the subject's practical situation.
          3.  **Ascriber-Sensitive Contextualism:** Knowledge *ascriptions* depend on the ascriber's context (standards).

  3.  **Drafting the Response - Section by Section:**

