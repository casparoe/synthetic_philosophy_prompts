answer: |-
  # Module: Signals, Games and Meaning
  ## Session Plan: The Cost of Truth (75 Minutes)

  **Class Size:** 18 Students (9 Pairs)  
  **Materials:** 
  - 18 Role Cards (9 "High", 9 "Low")
  - 18 Envelopes (for secret signals)
  - 100 Poker Chips (or counters)
  - 18 "Signal Tokens" (Red Index Cards)
  - 9 "Contract Slips" (Small paper slips for Round 3)
  - Projector (for Payoff Table only)
  - Chocolate/Prizes for top scorers

  ---

  ## Part 1: Setup & Rules (15 Minutes)

  **1. Role Assignment**
  - Divide the class into **Senders (9)** and **Receivers (9)**.
  - Senders sit on one side, Receivers on the other. They must not face each other directly (backs turned or screens up).
  - Hand out **Role Cards** to Senders only. 
    - **High Type (5 students):** You are high quality.
    - **Low Type (4 students):** You are low quality.
    - *Note:* Keep the ratio roughly 50/50 but don't announce the exact numbers.
  - Receivers get no type info. They only know there are Highs and Lows.

  **2. The Economy**
  - Everyone starts with **10 Chips**.
  - **Sender Goal:** Maximize chips.
  - **Receiver Goal:** Maximize chips.
  - **Currency:** 1 Chip = 1 Point. Top 3 scorers get chocolate/credit.

  **3. The Board (Project this)**
  Write this payoff table and leave it up for the whole session.

  | **SENDER PAYOFFS** | If Accepted | If Rejected | Cost to Signal |
  | :--- | :---: | :---: | :---: |
  | **High Type** | +10 | 0 | **See Round Rules** |
  | **Low Type** | +10 | 0 | **See Round Rules** |

  | **RECEIVER PAYOFFS** | Accept High | Accept Low | Reject (Any) |
  | :--- | :---: | :---: | :---: |
  | **Points** | +5 | -5 | 0 |

  **4. The Mechanism**
  1. **Sender Decision:** Decide whether to **Signal** or **Not Signal**.
     - If Signaling: Pay the cost to the Bank (Instructor), take a **Red Token**, put it in the envelope.
     - If Not Signaling: Pay 0, put empty envelope in.
  2. **Transfer:** Collect envelopes, shuffle, hand one to each Receiver. (Anonymity is key).
  3. **Receiver Decision:** Open envelope. See Token or Empty. Decide **Accept** or **Reject**.
  4. **Settlement:** Reveal Types, pay chips, record scores.

  ---

  ## Part 2: The Game (45 Minutes)

  ### Round 1: The Baseline (15 Minutes)
  **Announcement:** "Round 1 Costs: High Types pay **3 chips**. Low Types pay **12 chips**."
  *(Write on board: H=3, L=12)*

  **Play:**
  1. Senders calculate privately. (High: 10-3=7 profit. Low: 10-12=-2 loss).
  2. Senders submit envelopes.
  3. Receivers decide.
  4. **Settlement:** Reveal types. 

  **Expected Outcome:** 
  - High Types signal (Profit 7). 
  - Low Types do not signal (Profit 0). 
  - Receivers see Token -> Assume High -> Accept. 
  - Receivers see Empty -> Assume Low -> Reject.
  - *Result:* Honest signaling. Everyone makes money.

  ### Round 2: The Flat Tax (15 Minutes)
  **Announcement:** "Round 2 Costs: Due to regulation, signaling is standardized. **Everyone pays 3 chips**."
  *(Write on board: H=3, L=3)*

  **Play:**
  1. Senders calculate. (High: 10-3=7. Low: 10-3=7).
  2. **Crucial:** Do not let them talk. 
  3. Senders submit. (Expect *everyone* to signal).
  4. Receivers decide. (If they Accept all, they get mixed payoff. 5 Highs (+25), 4 Lows (-20) = +5 total, but individual Receivers might get burned).
  5. **Settlement:** Reveal types.

  **Expected Outcome:** 
  - Pooling Equilibrium. Everyone signals.
  - Receivers realize the signal is noise. 
  - If you run a second hand of Round 2 (recommended), Receivers will start Rejecting Tokens. Senders lose 3 chips each. Signaling collapses.

  ### Round 3: The Black Market (15 Minutes)
  **Announcement:** "Round 3 Costs: Back to original (H=3, L=12). **NEW RULE:** Signal Tokens are **Transferable Property**."
  *(Write on board: H=3, L=12. TOKENS TRADABLE)*

  **The Mechanic:**
  1. **Phase 1 (Purchase):** Only High Types are allowed to buy Tokens from the Bank (3 chips). Low Types cannot buy from Bank (Too expensive).
  2. **Phase 2 (Trading):** 2-minute open market. High Types can sell their Token to a Low Type using a **Contract Slip**. 
     - *Example:* Low Type gives High Type 5 chips. High Type gives Token.
  3. **Phase 3 (Submission):** Whoever holds the Token puts it in the envelope.
  4. **Receivers:** Decide as normal.

  **Play:**
  1. High Types buy Tokens (Cost 3).
  2. High Types realize: "If I signal, I get 7 profit. If I sell for 5, I get 2 profit." 
     - *Instructor Nudge:* If they hesitate, whisper to High Types: "Risk-free profit vs. waiting for Receiver acceptance." Or, announce "High Type Signaling Cost increased to 8 chips" for this round only to make selling mathematically superior. *Let's use the Cost Increase nudge for certainty.*
     - **Revised R3 Rule:** "High Type Cost is now **8 chips**. Low Type Cost remains **12 chips**."
     - High Net Signal: 10 - 8 = 2.
     - High Net Sell: Sell Token for 5. Profit = 5. (Better to sell).
     - Low Net Buy: Pay 5, Get 10. Profit = 5. (Better than 0).
  3. **Settlement:** Receivers accept Tokens. Reveal Types.

  **Expected Outcome:** 
  - All Tokens are held by Low Types.
  - Receivers Accept Tokens expecting Highs.
  - Receivers get Low Types (-5 points).
  - **Scandal:** The market collapses. Receivers refuse to accept Tokens in subsequent hands.

  ---

  ## Part 3: The Debrief (15 Minutes)

  Do not mention "Handicap Principle" yet. Ask questions to draw the insights out.

  **1. Compare Round 1 & Round 2 (Point 1 & 2)**
  - *Ask:* "Round 1 worked. Round 2 broke. The signal (Red Token) was identical. What changed?"
  - *Answer:* The Cost structure.
  - *Ask:* "In Round 1, why didn't Low Types just pay the 12 chips?"
  - *Answer:* It wasn't worth it. The cost was *differential*.
  - *Ask:* "In Round 1, if Receivers had decided to Reject everyone, would High Types have signaled?"
  - *Answer:* No.
  - **Takeaway 1:** Cost alone doesn't create honesty. It must be **differentially expensive** (Point 1).
  - **Takeaway 2:** Honesty isn't in the token. It's in the **loop**. Receivers only accept because they trust the cost filter; Senders only pay because they trust the acceptance. (Point 2).

  **2. Analyze Round 3 (Point 3)**
  - *Ask:* "Round 3 had the differential cost again. Why did it collapse?"
  - *Answer:* The Low Types didn't pay the cost. The High Types did, then sold the proof.
  - *Ask:* "Who paid the biological cost?"
  - *Answer:* The High Type.
  - *Ask:* "Who sent the signal?"
  - *Answer:* The Low Type.
  - **Takeaway 3:** A signal fails if the **cost is decoupled from the sender**. The cost must be a *handicap* to the specific sender, not a fee they can outsource. (Point 3).

  **3. The Reveal**
  - "In biology and philosophy, this is the **Handicap Principle** (Zahavi, 1975)."
  - "Peacocks don't just have heavy tails. They have tails that are heavy *for them*, and they can't sell their tails to weaker peacocks."
  - "Meaning isn't in the word/signal. It's in the cost structure that prevents lying."

  ---

  ## The Honest Parts: Risks & Limitations

  ### 1. What Will Predictably Go Wrong
  - **The Round 3 Incentive:** In Round 3, High Types might refuse to sell because 7 chips (Signaling) > 5 chips (Selling). 
    - *Fix:* Be ready to announce the "Cost Increase" (to 8 chips) mid-round if trading is slow. This makes selling the dominant strategy and ensures the "scandal" happens.
  - **Receiver Collusion:** Receivers might compare notes between hands. 
    - *Fix:* Collect all chips and reset anonymity every hand. Remind them: "You are competing against each other for the top 3 prizes."
  - **Math Panic:** Some students will freeze on the subtraction.
    - *Fix:* Keep the numbers on the projector. Walk around during the decision phase and ask, "What's your net if you signal?" without giving advice.

  ### 2. What This Game Cannot Reproduce
  - **Evolutionary Time:** In the real world, this equilibrium takes generations to stabilize. In class, it takes 5 minutes. Students might treat Round 2 as a "puzzle to solve" rather than a "system to inhabit." 
    - *Mitigation:* In the debrief, emphasize that in nature, the "Receivers" who trust cheap signals die out. In class, they just lose chips.
  - **Continuous Signals:** Real handicaps are continuous (tail size), not binary (Token/No Token). 
    - *Mitigation:* Mention in the debrief that the Token represents a threshold of quality, not quality itself.
  - **The "Why" of Cost:** In the game, I *tell* them the cost. In biology, the cost is physical (metabolic load). 
    - *Mitigation:* Explicitly state in the debrief: "In the game, I enforced the cost. In nature, physics enforces the cost. That's why you can't fake it."

  ### 3. Handling the "Scandal"
  If Round 3 goes *too* well and Receivers lose all their chips, they may disengage. 
  - **Safety Valve:** Have a reserve of chips. If Receivers go bankrupt, announce a "Bailout" before the debrief so they don't feel punished for playing correctly.
  - **The Lesson:** Ensure they understand the Receivers weren't "stupid" in Round 3. They were rational based on past history (Round 1). The *system* broke, not their logic.

