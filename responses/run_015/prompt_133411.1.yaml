answer: |-
  **The Scenario**

  At 9:00 AM, a Chief Engineer at a hydraulic testing facility gives a written assurance to a client regarding a high-pressure valve scheduled for stress-testing at 2:00 PM: "The valve will hold the pressure." The valve is already installed inside a sealed, automated testing chamber that no human can access once locked; the pressure schedule is pre-programmed and cannot be altered. Unknown to anyone, the valve contains a microscopic casting flaw that, given the laws of material stress and the pre-set pressure curve, nomologically guarantees failure at 1:55 PM. This flaw is in principle unascertainable at 9:00 AM because the only detection method involves depressurizing and disassembling the chamber, which would alter the thermal and stress conditions required for the scheduled test, thereby destroying the very state that fixes the outcome. At 2:00 PM, the valve bursts.

  **Verdicts on the Assurance ("The valve will hold the pressure")**

  *   **Ockhamism:** Determinately False at 9:00 AM. There is a privileged actual future branch in which the valve bursts, and this branch settles the truth-value of the claim immediately, regardless of epistemic access.
  *   **Settledness-based openness:** Determinately False at 9:00 AM. The total state of the world at 9:00 AM plus the laws of nature nomologically excludes the valve holding; the outcome is causally settled even though it has not occurred.
  *   **Occurrence-based openness:** Indeterminate at 9:00 AM; Determinately False at 2:00 PM. Because the bursting event has not yet occurred at the time of utterance, the claim lacks a truth-value; determinacy arrives only with the event's realization.
  *   **Assessment-relativism:** Not True relative to the 9:00 AM context of assessment; False relative to the 2:00 PM context of assessment. The utterance has no assessment-independent truth-value; its status shifts as the context of assessment moves from before to after the failure.

  **Answers to the Downstream Question**
  *Context: An internal review board must canonise one of two incompatible records: the Engineer's assurance ("It will hold") or a Rival Consultant's warning ("It will fail"). The board's mandate is to record which adviser was **correct at the time of utterance**.*

  *   **Ockhamism:** Canonise the Consultant. The Consultant's claim was determinately true at 9:00 AM because the actual future already contained the failure.
  *   **Settledness-based openness:** Canonise the Consultant. The Consultant's claim was determinately true at 9:00 AM because the physical state then already fixed the failure.
  *   **Occurrence-based openness:** Cannot canonise either as "correct at the time." At 9:00 AM, both claims were indeterminate. The board must either leave the record blank regarding past correctness or change the subject to "who was more justified," which violates the mandate to track truth.
  *   **Assessment-relativism:** Canonise the Consultant *from the perspective of the review board*, but cannot affirm he was correct *at the time*. The claim is true relative to the post-failure assessment context, but not relative to the pre-failure context, leaving the "at the time" requirement unmet without privileging the later context.

  **The Single Feature and Minimal Perturbation**

  The feature doing the work is **nomological fixity combined with epistemic sealing**. The outcome is causally determined by the 9:00 AM state, but that state cannot be known without destroying the conditions that make it determining.
  *Minimal Perturbation:* Remove the nomological fixity (e.g., introduce a genuinely indeterministic quantum trigger for the valve failure).
  *Effect on Verdicts:* The **Settledness-theorist** must now switch to "Indeterminate at 9:00 AM" because the laws no longer fix the outcome. The **Ockhamist** remains on "Determinately False at 9:00 AM" because the privileged actual branch still contains the failure. This breaks their agreement.

  **Extensionality Check**

  The smallest change to break the Ockhamist/Settledness agreement is to **make the future causally unsettled at the time of utterance** (as above).
  *Confirmation of Asymmetry:* Under this change, the Ockhamist's verdict is invariant (still bivalent due to the privileged branch), while the Settledness-theorist's verdict changes (from determinate to gappy). This confirms that the Ockhamist relies on *actuality* (metaphysical selection of a branch) while the Settledness-theorist relies on *causal determination* (physical necessitation), even though they coincide in the original fixed case.

  **Strongest Reply from an Occurrence-Theorist**

  1.  *Implicit Ceteris-Paribus:* The theorist might argue the assurance meant "The valve will hold, *absent internal defects*." Since the defect existed, the condition failed, and the assurance was not genuinely about the fixed future but about a conditional scenario that never obtained.
      *Critique:* This fails because the case stipulates the flaw is part of the *actual* state of the valve at 9:00 AM. The assurance was about *this* valve. Adding a condition that excludes the actual state renders the assurance vacuous or about a non-existent object.
  2.  *Pragmatic Shift:* The theorist might argue the review board's demand for "truth at the time" is a mistake; practice should track *assertibility* or *justification*. Since the Engineer was unjustified (had she known, she wouldn't have spoken), she is blameworthy regardless of truth.
      *Critique:* This is the stronger reply but concedes the metaphysical point. It admits the Occurrence view cannot satisfy the *truth-based* mandate of the review board, only a *epistemic-based* one. If the practice genuinely requires truth (e.g., for insurance contracts specifying "false statements"), this reply changes the subject.

  **Assessment-Relativism Note**

  Assessment-relativism lands in a pragmatic middle ground: it allows the review board to say "He was wrong" *now* (relative to their current context) without committing to "He was wrong *then*." This causes difficulty only if the practice requires an assessment-independent fact of the matter about past correctness. If the record is understood as a present evaluation of the past, relativism suffices; if the record is understood as capturing the historical metaphysical status of the utterance, relativism fails to provide a unique verdict.
