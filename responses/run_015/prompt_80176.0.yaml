  You should reject step (4), which claims that personal identity is strictly fixed by physical genetic constitution.

  This premise looked plausible because genetics determines nearly all biological traits, making it feel like the core "essence" of a human organism; it appeals to the scientific intuition that you are your DNA. However, you must reject it because it conflates numerical identity with qualitative similarity, implying that even minor genetic variations (such as somatic mutations or slight recombinational differences) would result in a different person, which is counterintuitive and overly restrictive for modal claims about identity.

  Rejecting step (4) means that within this specific derivation, the argument establishes neither the stronger claim (gamete essentialism) nor the weaker claim (parental essentialism), as the genetic-constitution principle was the engine driving both conclusions. However, the two claims are not metaphysically locked together, so you can still defend the weaker claim via an independent route that does not rely on strict genetic identity. Kripke's original case for origin essentialism focuses on the necessity of the specific parental *pair* as the causal source of your existence, rather than the specific material substrate (gametes) they contributed. By replacing step (4) with a principle stating that identity is fixed by the specific causal origin (the parents) rather than the genetic output, you can maintain that coming from different parents would make you a different person, while allowing that coming from different gametes of the same parents might not. This costs you the simplicity of a single genetic principle, requiring you to argue for parental essentialism on distinct metaphysical grounds regarding causation and origin, but it successfully isolates the weaker claim from the stronger one you wish to avoid.
