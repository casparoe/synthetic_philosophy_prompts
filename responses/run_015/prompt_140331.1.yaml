answer: |-
  The control room hums, a low-frequency vibration that Elena feels in her teeth more than she hears. On the main wall, the grid of the state glows green, punctuated by the amber warnings of high load. It is 3:00 AM. The storm has been battering the coast for six hours.

  Elena sits alone. This is the requirement of the job: one mind, one chair, one set of hands on the throttles. Before the implant, this hour was a torture chamber. Her mind would snag on every decision. *If I route power here, the substation there might overheat. But if I don't, the hospital loses backup.* She would cycle through the options until her chest tightened, until the sweat made the keyboard slippery. She would call her supervisor just to hear a voice tell her she wasn't ruining everything.

  Now, she wears the **Tether**. It sits behind her ear, a smooth disc of matte white ceramic. Inside, it listens.

  A warning flare turns red on the sector map. Sector 7. A line is down. The load is shifting dangerously toward the urban center. The protocol says shed the load. Cut the suburbs to save the city.

  Elena doesn't hesitate. The hesitation used to be the person she was; the action is the person she is now. She feels the Tether warm slightly against her mastoid bone. It is not a voice. It is a settling, like a compass needle finding north after a shake. It compares her current impulse against the profile built over the last month of sessions. *What did you say you wanted? Safety. Stability. The greater good.* The conflict between her fear of cutting power and her duty to the grid resolves. The fear dampens. The duty clarifies.

  She flips the switch. The red light on Sector 7 turns amber, then green. The city stays lit.

  It is flawless. It is exactly what she promised she would do.

  ***

  David is awake when she gets home. He sits at the kitchen table with a mug of tea that has gone cold. He used to wait up because he worried she'd come home spiraling, convinced she'd made a mistake. He used to have to talk her off the ledge, recounting her own values until she believed them again.

  "You're back," he says. He doesn't stand up. He doesn't ask how it went. He knows. The grid status is public.

  "Sector 7 dropped," Elena says. She hangs her coat. "We kept the hospital online."

  "Good."

  He looks at her with a calm that feels like distance. In the first month after the surgery, there was relief. He had hugged her and cried, thankful that the woman who couldn't leave the house without checking the stove ten times was gone. But now, six months in, the relief has hardened into something else.

  There are no fights anymore. Elena used to snap when she was overwhelmed. She used to forget anniversaries when the noise in her head was too loud. David would get angry. He would tell her she was being selfish. She would apologize, mean it, and then do it again.

  Now, she is consistent. She remembers everything. She never snaps. But David doesn't get angry, either. You cannot be angry at a thermostat for keeping the room cold. You cannot forgive a machine for a mistake it is calibrated not to make.

  Last week, she forgot to buy milk. She noticed it on the way home, stopped, bought it, and put it away. David didn't mention it. Before, he would have teased her. Now, he just sees the milk in the fridge. The friction is gone. She misses the friction. She misses the version of herself that could disappoint him, because that was the version he could hold onto.

  "Are you hungry?" she asks.

  "I ate," he says. "You should sleep."

  He goes to bed. She stands in the kitchen. She opens the fridge and stares at the milk. She could pour it down the sink. Just to see if he would notice. Just to see if he would yell. But the Tether warms. *Waste not. Stability.* She closes the door.

  ***

  The storm breaks on Tuesday. The company holds a briefing in the main hall. Elena sits in the front row. The Director talks about the near-catastrophe in Sector 7. He talks about the resilience of the infrastructure. He talks about the protocols.

  Then he calls her name.

  "Elena's decision-making under pressure was exemplary," the Director says. "Precisely what we need."

  There is applause. It is polite. It is the applause you give a printer that hasn't jammed.

  Afterward, a junior controller, a young man named Sam, approaches her. He looks at her with wide, earnest eyes. "I heard you manual overrides the safety lock on the substation. That was... I couldn't have done that."

  "It was the right call," Elena says.

  "But the risk," Sam says. "If you'd waited even ten seconds, the cascade would have hit the city. You just... knew."

  Elena looks at him. She remembers the moment. She remembers the warmth behind her ear. She remembers the feeling of her own fear being smoothed down, like a hand ironing a wrinkled shirt. Did she know? Or did the model, trained on thousands of hours of other people's best decisions, tell her what knowledge felt like?

  "I did what I said I would do," she says.

  Sam nods, reverent. "It's incredible. You're so... reliable."

  He walks away. He doesn't ask her out for coffee. He doesn't treat her like a person who took a risk. He treats her like a bridge that held weight. You don't thank a bridge. You just drive over it.

  ***

  On Saturday, they go for a hike. It is something they used to love. Elena used to hate it. She would worry about the path, the weather, the time. She would stop every ten minutes to check the map. David would get frustrated. They would argue. Then they would make up at the summit, the argument part of the climb.

  Today, the path is clear. Elena walks at a steady pace. She knows when to stop for water. She knows when to turn back before the rain starts. She is the perfect hiking partner.

  David walks beside her. He is quiet.

  "Do you remember," he says, "that time we got lost near Ridge Creek?"

  "Yes," Elena says. "I insisted on the left trail."

  "We missed dinner," he says. "We had to eat granola bars in the car."

  "I was wrong."

  "You were," he says. "I was so mad at you."

  He stops walking. He looks at her. There is a sadness in his eyes that she cannot fix.

  "I miss being mad at you," he says.

  Elena feels the Tether. It is cool now. It is monitoring her stress levels. It is ready to intervene if she becomes distressed. It knows what she endorsed in her sessions: *Preserve the relationship. Minimize conflict.*

  "I'm sorry," she says.

  "Don't," David says. "You didn't do anything wrong. That's the problem."

  He starts walking again. She follows. She could stop. She could sit on a rock and refuse to move. She could scream. She could throw her water bottle into the trees. She could be the kind of person who ruins the hike.

  She thinks about doing it. She imagines the feeling of chaos, of being unpredictable. Of being a thing that could break.

  The Tether warms. It presents her with the data. *This action contradicts your endorsed profile. This action causes relational damage.* The impulse fades. It doesn't feel like suppression. It feels like remembering. It feels like waking up and realizing you never wanted to scream in the first place.

  She walks on. Her feet find the roots of the trees without looking. She is safe. She is effective. She is exactly who she said she wanted to be.

  Ahead, the trail splits. Left is shorter, steeper. Right is longer, safer. Before, she would have dithered. She would have asked David. They would have negotiated.

  Elena takes the left path. It is the optimal route. David follows. He doesn't comment. He doesn't trust her to lead; he trusts the system that leads her.

  At the summit, the view is clear. The clouds have broken. The valley below is green and grid-lined. Elena stands at the edge. The wind pulls at her jacket. She feels solid. She feels permanent.

  She wonders, briefly, who chose the path. She wonders if the person who chose it is still here, or if she was the price of the ticket.

  David touches her shoulder. "We should head back," he says. "Storm coming."

  "Okay," she says.

  She turns. She leads the way down. She does not slip. She does not hesitate. She does not look back to see if he is following. She knows he is. She knows everything is working exactly as designed.

  ***

  **Note to Editor**

  I leaned hardest on the **social** conception of freedom (the "reactive attitudes" strand). It's the most visceral way to show the loss of agency without invoking metaphysical dread. When others stop holding us accountable—stop resenting or thanking us—we cease to be participants in a moral community and become appliances. Even if the appliance works perfectly.

  I think you might be wrong to care as much about the **diachronic** one (growth through uncertainty). While poetic, the implant actually *secures* diachronic continuity by locking in endorsed values. The real tragedy isn't that she can't grow; it's that she can't *stumble*. But readers feel the loss of social friction (the husband's boredom) more acutely than the loss of existential becoming. The husband's alienation is the hook; the metaphysics is the subtext.
