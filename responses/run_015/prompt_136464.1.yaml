  She will rule the minimal synthetic cell **not emergent**.

  Her precedents establish a single robust principle rather than three competing rules: emergence requires **non-aggregative physics**, typically manifested as a singular limit or topological constraint that prevents derivation from the micro-laws of the parts even in principle. The "Multiple Realizability" candidate is not a live rule for her, as Verdict 2 (temperature) explicitly rejects realizability across distinct substrates as evidence for emergence. The "Organizational/Downward-Constraint" candidate is also insufficient on its own; while Verdict 6 (fractional charge) relies on organizational definitions, Verdict 4 (GoL glider) confirms that organizational patterns with causal weight do not count as emergent if they remain finite and simulable. Thus, the "Singular-Limit" and "Deductive-Autonomy" rules collapse into one criterion: if the system is finite and the macro-behavior is computationally derivable from the micro-dynamics without invoking an infinite limit or symmetry breaking, it is not emergent.

  Under this unified principle, Feature (i) (finite, fully simulable, no limits) is decisive and predicts **not emergent**, aligning with Verdicts 1, 2, 3, and 4. Feature (ii) (multiple realizability) is rendered irrelevant by Verdict 2. Feature (iii) (organizational causal weight) is rendered irrelevant by Verdict 4, which established that causal powers invisible in the parts (the glider's interactions) do not constitute emergence if the system is epistemically transparent (simulable). The closest analogue is **Verdict 4 (the GoL glider)**: both are stable, self-maintaining dynamical patterns in a finite substrate where the "object" (glider or cell) is not present in the micro-ontology. This analogue is contested only because the cell replicates, suggesting a "life" threshold that the glider lacks, but given her rejection of protein folding (Verdict 3) as emergent despite biological context, she is unlikely to grant ontological status to replication alone.

  By ruling **not emergent**, she commits to a strict ontological reductionism where "emergence" is reserved for idealized mathematical limits (like thermodynamic limits in phase transitions) rather than real-world complex systems, effectively making emergence a property of models rather than nature. By ruling **emergent**, she would have to abandon the consistency of Verdicts 3 and 4, admitting that organizational closure creates ontological novelty even in finite, simulable systems, which would force her to reclassify the glider and protein folding as emergent. Feature (iii) ought not to matter given Verdict 4; the glider's causal interactions were also invisible in the individual cells, yet she ruled "not emergent" because the pattern was deductively accessible from the rules.

  To separate the surviving "Singular-Limit" rule from a potential "Biological/Organizational" exception that might surface here, the single further case to put to her is **a self-replicating pattern in Conway's Game of Life**. If the synthetic cell is not emergent because it is finite and simulable, a self-replicating glider construction (which adds the "life" feature of division to the glider's physics) must also be not emergent; if she rules the replicator emergent while maintaining the cell is not, she reveals that "life" rather than "physics" drives her ontology.
