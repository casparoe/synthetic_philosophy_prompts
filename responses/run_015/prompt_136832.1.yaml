answer: |-
  Here is a tutorial plan designed to fit a 55-minute slot, address the specific pedagogical failures you experienced, and handle the technical gaps regarding "meddlesome" preferences.

  ### 1. Dependency Structure (0–20 minutes)

  **The Order of Operations**
  Do not start with Arrow recap. Your students know the *shape* of an impossibility proof; they do not need the machinery re-derived. They need the *conceptual shift* from "aggregation" to "rights."

  1.  **The Hook (5 mins):** State the goal immediately. "Last week we saw that aggregating preferences is hard (Arrow). Today we see that respecting rights is also hard, even with only two people."
  2.  **The Example First (10 mins):** Do **not** state the formal conditions ($U, P, L$) before the example. If you do, the example becomes a mere illustration of axioms they don't care about. Instead, present the scenario as a logical puzzle about rights.
      *   *Why:* Your previous failure stemmed from students rejecting the *preferences*. By framing the example as a test of *consistency* rather than psychological realism, you bypass the "people aren't like that" objection.
  3.  **The Derivation (5 mins):** Derive the cycle on the board.
  4.  **The Formalization (Post-Derivation):** Only *after* the cycle is visible do you label the steps with the conditions (Unrestricted Domain, Pareto, Liberalism). This shows the conditions are *extracted* from plausible reasoning, not imposed arbitrarily.

  **Arrow Recap Requirements**
  *   **Transitivity vs. Acyclicity:** Do not dwell on this. Sen's result produces a cycle (intransitivity). Treat it like Condorcet. If the social preference cycles, there is no "best" option. That is sufficient for a 2nd-year PPE tutorial.
  *   **Social Decision Function:** Briefly remind them we are looking for a rule that takes individual orderings and outputs a social ordering.
  *   **Liberalism vs. Non-Dictatorship:** This is the crucial distinction. State it explicitly *after* the example: "Arrow said no one person can decide everything. Sen says if *two* people decide *something* each, we break."

  ### 2. The Carrying Example (20–30 minutes)

  **Keep or Replace Prude/Lewd?**
  **Replace it.** The moral baggage distracts from the logic. You need a "sterile" example where the "meddlesome" nature of the preferences is obvious but not morally charged.

  **Recommended Example: "The Roommates and the Window"**
  *   **Alternatives:**
      *   $x$: Window Open.
      *   $y$: Window Cracked.
      *   $z$: Window Closed.
  *   **Rights (Liberalism):**
      *   Person A (Cold-sensitive) is decisive over $\{y, z\}$ (Cracked vs. Closed). It is their "business" if they are cold.
      *   Person B (Fresh-air sensitive) is decisive over $\{x, y\}$ (Open vs. Cracked). It is their "business" if they are stuffy.
  *   **Preferences (The Profile):**
      *   **A:** Prefers $z > y$ (Closed better than Cracked). *But* A prefers $y > x$ (Cracked better than Open, because Open is too cold).
      *   **B:** Prefers $x > y$ (Open better than Cracked). *But* B prefers $y > z$ (Cracked better than Closed, because Closed is stuffy).
      *   **Wait, this doesn't generate the Pareto conflict.** You need a Pareto comparison that crosses the spheres.
      *   **Correction for the Cycle:**
          *   A is decisive on $(x, y)$. A prefers $y > x$.
          *   B is decisive on $(y, z)$. B prefers $z > y$.
          *   **Pareto:** Both prefer $x > z$.
          *   *Result:* $y > x$ (A's right), $z > y$ (B's right), $x > z$ (Pareto). Cycle: $x > z > y > x$.
      *   **Narrative:**
          *   $x$: Play Jazz. $y$: Play Classical. $z$: Play Silence.
          *   A (Jazz fan) has right to decide Jazz vs. Classical. Prefers Classical > Jazz (maybe they are tired of Jazz).
          *   B (Classical fan) has right to decide Classical vs. Silence. Prefers Silence > Classical (headache).
          *   **Pareto:** Both prefer Jazz > Silence (they both want *some* music).
          *   *Check:* Does A care about Silence? Yes. Does B care about Jazz? Yes. This is the "meddlesome" link.

  **The "Meddlesome" Question (The Honest Answer)**
  You asked for the honest answer to the student who asked if the impossibility survives if neither person is meddlesome.
  *   **The Answer:** **No.** If preferences are strictly self-regarding (A only cares about A's protected sphere; B only cares about B's protected sphere), the Liberal Paradox **vanishes**.
  *   **Why:** The paradox requires a Pareto improvement ($x > z$ in the example above) that overrides a Right. For a Pareto improvement to exist, *both* agents must prefer $x$ to $z$. But if $x$ and $z$ fall into different "personal spheres," and preferences are purely self-regarding, one agent will be indifferent between them. If one is indifferent, Pareto does not apply.
  *   **Where to place this:** Introduce this **immediately after deriving the cycle**.
  *   **Pedagogical Move:** "You might think the problem is that A and B are nosy. You are right. If they weren't nosy, Pareto wouldn't clash with Rights. The lesson is not that Liberty is impossible, but that Liberty is incompatible with Pareto *when we care about each other's choices*." This validates the student's intuition without dismissing the theorem.

  ### 3. Misconceptions (30–45 minutes)

  Address these in this specific order as they naturally arise from the derivation.

  1.  **"Decisiveness = Right" (Head off at 20 mins):**
      *   *When:* When defining Liberalism.
      *   *Fix:* Clarify that "decisiveness" here means "if I prefer $x$ to $y$, society *must* rank $x$ above $y$." It is a logical constraint on the aggregation rule, not a legal claim. It models a right as a veto over a specific pair.
  2.  **"This is just Arrow" (Head off at 25 mins):**
      *   *When:* After formalizing conditions.
      *   *Fix:* Arrow requires 3+ people and Non-Dictatorship. Sen requires only 2 people and Minimal Liberalism. Sen is a stronger impossibility (fewer agents, weaker condition).
  3.  **"Abandon Pareto" (Head off at 35 mins):**
      *   *When:* Discussing the "escape routes."
      *   *Fix:* Ask: "If A and B both prefer Jazz to Silence, should society really choose Silence?" Pareto is weak; giving it up means allowing mutually harmful outcomes. It's a high price.
  4.  **"Partition the Spheres" (Head off at 40 mins):**
      *   *When:* Discussing the "Meddlesome" answer.
      *   *Fix:* This is the "Private Spheres" fix. Acknowledge it works *if* preferences are separable. But point out that in politics/economics, preferences are rarely separable (externalities exist). The theorem explains *why* externalities make rights difficult to formalize.
  5.  **"Markets/Minimal State" (Head off at 45 mins):**
      *   *When:* Wrap up.
      *   *Fix:* Refuse to let them equate "Liberalism" here with "Free Markets." This is about social choice logic, not economic systems. A central planner faces this paradox too.

  ### 4. Assessment Check (45–50 minutes)

  **The Task:**
  Hand out a slip (or put on board) with a **modified profile**.
  *   Keep the Rights the same (A decisive on $x,y$; B decisive on $y,z$).
  *   Keep A's preference: $y > x$.
  *   Keep B's preference: $z > y$.
  *   **Change:** Remove the Pareto condition. Instead, state: "A prefers $x > z$, B prefers $z > x$." (Conflict, not agreement).
  *   **Question:** "Can we now form a consistent social ranking satisfying the Rights? If yes, write it. If no, explain why."

  **Why this works:**
  *   **Student who rote-learned:** Will try to find the cycle $x > z > y > x$. They will fail because the Pareto link ($x > z$) is broken. They might say "Impossible" because they memorized "Sen = Impossible."
  *   **Student who understands:** Will see that without the Pareto agreement, there is no conflict between the Rights.
      *   A says $y > x$.
      *   B says $z > y$.
      *   Society can rank $z > y > x$. No cycle.
      *   They will answer "Yes, $z > y > x$ works."
  *   **Differentiation:** This tests if they understand that the *clash* between Pareto and Rights drives the impossibility, not the Rights alone.

  ### 5. Scope Limitations & The "Real Lesson" (50–55 minutes)

  **What to Refuse:**
  State explicitly: "We are stopping here. We are not discussing:"
  1.  **Strategy:** Whether people lie about preferences.
  2.  **Game Forms:** Modeling rights as moves in a game rather than constraints on a ranking.
  3.  **Choice Functions:** The technical fix where we select a "choice set" rather than a full ranking.

  **The 5-Minute Segment: Ranking vs. Procedure**
  This is your payoff. Use the whiteboard for a final distinction.
  *   **Draw a line:** Left side "Social Ranking," Right side "Social Procedure."
  *   **Say:** "Sen proves we cannot *rank* these outcomes consistently. He does not prove we cannot *live* together."
  *   **Explanation:** A ranking implies we can judge every state of affairs from a 'view from nowhere.' A procedure (like a vote, a market, or a norm) allows us to settle on *one* outcome without agreeing on the *ranking* of the others.
  *   **The Takeaway:** "The paradox shows the limit of *justification*, not the limit of *action*. We can resolve the conflict by dropping the demand for a complete social ordering. We can accept that sometimes, there is no 'right' answer for society, only a decision."
  *   **Close:** "Next week we discuss how we make decisions when there is no right answer."

  ### Summary of Timing
  *   **00–05:** Hook & Setup (Rights vs. Aggregation).
  *   **05–20:** The Example (Music/Window) & Cycle Derivation.
  *   **20–30:** Formal Conditions & The "Meddlesome" Truth.
  *   **30–45:** Misconceptions (Pareto, Spheres, Arrow).
  *   **45–50:** Assessment Check (The Modified Profile).
  *   **50–55:** Ranking vs. Procedure & Scope Refusal.
