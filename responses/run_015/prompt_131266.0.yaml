answer: |-
  This is a clean problem statement. You are asking whether the "measurement" talk in welfare economics is isomorphic to the measurement talk in your old lab, or if it is a category error dressed in lab coats. I will treat your vocabulary as the ground truth and map their claims onto it, noting where the map tears.

  ### 1. The Comparability Menu: A Metrological Restatement

  In your terms, a utility function $U_i$ for agent $i$ is an instrument response. The question is: what is the scale type, and what is the invariance group of the calibration transformation between agents?

  Let the transformation for agent $i$ be $\phi_i(U) = a_i U + b_i$.

  **Ordinal and Non-Comparable**
  *   **Scale Type:** Ordinal.
  *   **Transformation:** $\phi_i(U)$ is any strictly increasing monotonic function.
  *   **Invariance Group:** $Mon(\mathbb{R})$ locally per agent.
  *   **Metrological Status:** You have a thermometer that tells you "hotter" or "colder" but has no linear response and no fixed points.
  *   **Consequence:** You cannot sum $U_i$. You cannot compare $\Delta U_i$ to $\Delta U_j$. You can only rank states for agent $i$. Interpersonally, the gauges are completely decoupled. There is no common dimension.

  **Cardinal Unit Comparable (Level Non-Comparable)**
  *   **Scale Type:** Interval (with common unit).
  *   **Transformation:** $\phi_i(U) = a U + b_i$.
  *   **Invariance Group:** Global scale factor $a$, local shift $b_i$.
  *   **Metrological Status:** Everyone agrees on the size of the "degree" (the volt), but the "zero" (ground) is arbitrary and different for each instrument.
  *   **Consequence:** Differences $\Delta U$ are comparable across agents. Levels $U$ are not. You can say "A gained more than B lost," but you cannot say "A is happier than B." This is the minimum requirement for classical utilitarianism (summing gains and losses).
  *   **Gauge Freedom:** The zero-point is a local gauge symmetry. The physics (moral sum) must be invariant under shifting individual zeros.

  **Full Level Comparable**
  *   **Scale Type:** Ratio (if natural zero) or Fixed Interval.
  *   **Transformation:** $\phi_i(U) = a U + b$ (common $a$ and $b$).
  *   **Invariance Group:** Global affine (or just identity if fully fixed).
  *   **Metrological Status:** Everyone's thermometer is calibrated to the same standard, with the same zero and same unit.
  *   **Consequence:** Levels and differences are comparable. You can say "A is happier than B."
  *   **Gauge Freedom:** None (or global only).

  **Intrapersonal von Neumann–Morgenstern (vNM) Cardinality**
  *   **Scale Type:** Interval (derived from risk preferences).
  *   **Metrological Status:** This is not a direct reading; it is derived from the instrument's response to noise (lotteries). If an agent is indifferent between outcome $X$ and a 50/50 lottery of $Y$ and $Z$, then $U(X) = 0.5 U(Y) + 0.5 U(Z)$. This fixes the scale up to an affine transformation $\phi(U) = aU + b$.
  *   **Constraint:** This establishes cardinality *within* the fiber of agent $i$. It does not couple fiber $i$ to fiber $j$.

  ### 2. The Two Grapples

  **A. The Thermal Contact Analogue**
  You asked if there is an operation in welfare that plays the role of thermal contact (Zeroth Law), establishing an equivalence relation ("same temperature") before units are defined.

  *   **The Physics:** Thermal equilibrium is a physical state. Two systems in contact exchange energy until a state variable ($T$) equalizes. This is empirical and passive.
  *   **The Welfare Case:** There is **no passive coupling**. Person A's utility does not "flow" into Person B until they equilibrate.
  *   **The False Friend:** Some economists propose "willingness to pay" or "compensating variation" as a contact. If A would pay $\$10$ to avoid a pain, and B would pay $\$10$ to gain a pleasure, is the utility magnitude the same? No. That assumes the marginal utility of money is comparable, which is exactly the thing you are trying to prove.
  *   **The Verdict:** The absence of an interpersonal heat flow is exactly the point. In thermodynamics, the Zeroth Law is an empirical discovery that justifies the existence of $T$. In welfare, there is no Zeroth Law. Any claim that $U_A$ and $U_B$ are on the same scale is a *postulate*, not an observation of equilibrium. You cannot trace the calibration chain because there is no physical link to carry the trace.

  **B. The Fiber Bundle and Gauge Analogy**
  Your idea: Each person's utility is a fiber with affine gauge freedom. Comparing them requires a connection to parallel-transport them, and a metric to compare magnitudes.

  *   **Where it holds:** This is mathematically precise for the *formal* problem. The base space is the set of individuals (discrete manifold). The fiber is the utility scale $\mathbb{R}$. The structure group is the Affine Group. "Non-comparability" is the statement that the bundle is trivial but lacks a preferred section. "Comparability" is the imposition of a global section.
  *   **Where it smuggles assumptions:**
      1.  **The Connection:** In gauge theory (e.g., electromagnetism), the connection is a physical field determined by dynamics or geometry. In welfare, the "connection" is the moral theory itself. To say "we can compare" is to *define* the connection, not to discover it. You are not finding the parallel transport; you are welding the fibers together.
      2.  **Smoothness:** A fiber bundle assumes a continuous base space. People are discrete. You cannot take a limit as Person A approaches Person B.
      3.  **The Metric:** A metric allows you to measure length (magnitude of utility). Welfare economics often struggles even with the affine structure. Adding a metric assumes you can measure "how much" utility exists in an absolute sense, which implies a natural zero (hedonic null?).
  *   **The Verdict:** The analogy is excellent for diagnosing the *logical gap* (the need for extra structure to compare fibers), but it risks reifying the connection. In physics, the connection is there whether you measure it or not. In welfare, if you don't impose the connection, it doesn't exist.

  ### 3. The Residue Report

  Here is the translation fidelity of your metrological vocabulary into their philosophical problems.

  **Translates Cleanly:**
  *   **Invariance and Scale Types:** The classification (Ordinal, Interval, Ratio) is identical. When they argue about "meaningfulness," they are arguing about invariance under the transformation group. If a social welfare function $W = \sum U_i$ changes value when you shift $U_1$ by $+10$ (and $U_1$ is only ordinal), the function is "not well-defined." This is pure measurement theory. You are correct: they borrowed this from you (via Stevens and Pfanzagl).

  **Translates with Distortion:**
  *   **Calibration:** In your lab, calibration is traceability to a standard (NIST, triple point of water). In welfare, "calibration" is either:
      1.  *Introspective:* "I imagine myself in their shoes." (Untraceable, high systematic error).
      2.  *Behavioral:* "They chose A over B." (Only gives ordinal data unless risk is involved).
      3.  *Normative:* "We *treat* them as equal." (This is a policy decision, not a calibration).
      *   *Distortion:* There is no welfare kilogram. There is no chain. When they say "calibrated," they often mean "normalized for the sake of the model."

  **No Counterpart (The Three Ghosts):**

  1.  **Demand from Theory vs. Data:**
      *   *Metrology:* If the theory requires a quantity $Q$ that cannot be measured, the theory is empirically empty or needs revision.
      *   *Welfare:* Utilitarianism *requires* unit comparability to sum utilities. If the data is only ordinal, the utilitarian does not discard the theory; they often *assume* the comparability as a moral postulate.
      *   *Residue:* This is a category error. In physics, measurability constrains theory. In ethics, moral necessity often constrains the *assumptions about* measurability. They are prescribing the measurement properties to satisfy the moral algebra.

  2.  **Fact of the Matter without Measurement:**
      *   *Metrology:* If you can't measure it, and it has no causal impact on observables, it's not a physical quantity (instrumentalism).
      *   *Welfare:* Realists argue there *is* a fact about whether A's pain is worse than B's, even if no instrument can ever detect it.
      *   *Residue:* This is metaphysics, not metrology. Your vocabulary has no slot for "unmeasurable quantities that are nevertheless real." In your world, that's a hidden variable that doesn't couple to the apparatus. In theirs, it's the "moral truth."

  3.  **Inadmissible Information:**
      *   *Metrology:* If you have a valid measurement of $T$, you use it. Ignoring data is bad science.
      *   *Welfare:* Social Choice Theory (e.g., Arrow, Rawls) often argues that even if interpersonal comparisons *were* possible, a just society should *not* use them. (e.g., "We shouldn't sacrifice the few for the many, even if the sum is higher.")
      *   *Residue:* This is a normative constraint on the estimator. It is not epistemic. It is not "we can't know"; it is "we won't look." Your vocabulary treats information as neutral. Theirs treats information as politically charged. This is not a prior; a prior updates. This is a hard constraint on the likelihood function.

  ### 4. What the Residue Means

  You asked if this is a defect of your vocabulary or a sign that philosophers are running three different questions under one heading.

  It is the latter. Your vocabulary is not defective; it is *too honest* for their conflation.

  The debate over interpersonal utility comparisons is a stack of three distinct layers, which they routinely slide between:

  1.  **The Empirical/Psychological Layer:** Is there a common neural or phenomenological currency? (Can we build the thermometer?)
      *   *Your verdict:* Currently, no traceable standard. High error bars.
  2.  **The Formal/Mathematical Layer:** What invariance properties does the social welfare function need to be well-defined?
      *   *Your verdict:* This is pure measurement theory. It translates perfectly. Summing requires interval scales with common units.
  3.  **The Normative/Political Layer:** Are we *permitted* to make these comparisons, even if we could?
      *   *Your verdict:* This has no counterpart in physics. This is the "inadmissible information" residue.

  **The Conclusion:**
  The fight is really about the third layer (Normative), but it is fought using the language of the first two (Empirical/Formal).

  When a philosopher says, "Utilities are not interpersonally comparable," they might mean:
  *   (Empirical) "We can't measure it." (Your territory)
  *   (Formal) "The math doesn't work if we assume it." (Your territory)
  *   (Normative) "It is tyrannical to claim we can weigh one man's soul against another's." (Not your territory)

  When they say, "We must assume comparability," they usually mean:
  *   (Normative) "Utilitarianism is the right theory, so we must assume the world allows it."

  **Final Diagnosis:**
  You are experiencing friction because you are treating "utility" as a **latent physical variable** (like temperature) waiting to be measured. They are often treating it as a **constructive normative variable** (like "justice" or "liability") that is defined by the rules of the system.

  In your lab, if the error bars are too large, you suspend judgment. In their seminar, if the error bars are too large, they argue about whether we are *obligated* to reduce them, or whether we should ban the measurement entirely.

  Your fiber bundle analogy is the best tool you have to keep them honest. Insist that if they want to compare fibers, they must specify the connection. If they say the connection is "moral intuition," ask for the curvature (inconsistency) of that connection. If they say the connection is "policy," admit that the comparison is a definition, not a discovery.

  They are not doing metrology. They are doing legislation with calculus.
