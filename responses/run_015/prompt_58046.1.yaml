  *(Self-Correction on CDT/EDT specific to AMD)*:
  Actually, the AMD problem is famous because it breaks the standard distinction.
  *   **Ex-ante (before driving):** Optimal is $p=1/3$ (Exit 1/3 of the time).
  *   **At the intersection:**
