      *   *Crucial Nuance:* CDT often says "Always Continue" at the intersection because conditional on being there, the causal impact of exiting vs continuing looks different depending on how you handle the self-locating belief. Actually, standard CDT with "mixed strategies" often converges to the ex-ante optimal if handled carefully (Functional Decision Theory territory), but strict CDT often leads to time inconsistency. Let's keep it to classic CDT vs EDT.
