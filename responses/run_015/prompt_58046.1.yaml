prompt: |-
  ok so im in this little reading group with friends from different majors and last time we tried to do the absent-minded driver problem and it kinda fell apart, so im trying to get a better feel for it before next time

  the version we had was like this: youre driving home late, there are two intersections in a row that look totally identical, you want the second exit. if you take the first you get 0, if you take the second you get 4, if you blow past both and end up at the motel you get 1. when you are actually at an intersection you cant tell if its the first or the second, and you have to use the same rule both times because you wont remmember anything different.

  what would help me is a made-up back-and-forth between two people arguing about what the driver should do, one who thinks about it in the evidential decision theory way and one who thinks about it in the causal decision theory way. can you have them both be sharp and not caricatures, and actually reply to what the other just said instead of giving little speeches past each other, especially on whether finding yourself at an intersection tells you youre probably at the first one, and whether it even makes sense to try to follow a flip-a-coin plan when you cant remember if you already flipped it, plus whether the driver should pay a little beforehand for a way to lock in a plan.

  and if you think my setup is muddled or a dialogue is a bad way to get at whats really at stake here, just tell me flat out instead of doing it anyway
