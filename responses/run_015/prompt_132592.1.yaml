      *   *Check:* Is the lattice explanation accurate? Yes, Ajtai's work and subsequent SIS/LWE reductions show average-case hardness based on worst-case lattice problems.
      *   *Check:* Is the advice actionable? Yes, recommend migration planning, not necessarily immediate flip-switch, but definitely not "wait."

  6.  **Final Review against User Query:**
