answer: |-
  ### Purpose and Scope

  Before listing the desiderata, we must state what this theory is for. If the aim is **metaphysical**, to settle what information *really is* in the universe, the list must demand mind-independent truth conditions and strict ontological boundaries. If the aim is **explanatory**, to ground the actual practice of molecular biology and evolutionary theory, the list must prioritise utility, predictive power, and the ability to distinguish productive research avenues from dead ends.

  I am writing this specification for **explanatory utility**. The goal is to licence the use of information talk in biology without incurring ontological debt or misleading the researcher. Consequently, the list below favours distinctions that track experimental interventions over those that satisfy intuitions about representation. Note that if the purpose were purely metaphysical, the 'Heredity Neutrality' requirement would become non-negotiable, and the 'Arbitrariness' constraint might be relaxed in favour of causal specificity.

  ### The Desiderata

  **1. The Arbitrariness Constraint**
  The theory must distinguish between relations fixed by chemical law and relations fixed by historical convention or contingency.
  *   **Application:** It must explain why the DNA–amino acid relation invites information talk (it is chemically arbitrary; other pairings are physically possible) while the polypeptide–fold relation does not (it is chemically forced by thermodynamics).
  *   **Status:** **Non-Negotiable.** Without this, 'information' collapses into 'cause', and the term loses its specific explanatory value in distinguishing genetic control from physical constraint.

  **2. The Contextuality Constraint**
  The theory must not locate content solely in the vehicle (the sequence). Content must be modelled as a relation between vehicle, cellular machinery, and state.
  *   **Application:** It must handle splicing, editing, and shifted reading frames without claiming the DNA sequence changed its 'message' retroactively. The content is fixed only at the point of consumption.
  *   **Status:** **Non-Negotiable.** Molecular biology has empirically falsified the view that sequence alone determines product.

  **3. The Plasticity Constraint (Reaction Norm)**
  The theory must accommodate one-to-many mappings between genotype and phenotype.
  *   **Application:** It must explain how a sequence can carry information for a *range* of potential outcomes dependent on the environment, rather than a single specified trait. 'Coding for' must not mean 'specifies uniquely'.
  *   **Status:** **Non-Negotiable.** Phenotypic plasticity is ubiquitous; a theory requiring 1:1 specificity is empirically false.

  **4. The Heredity Neutrality Principle**
  The theory must define information-bearing structures by their role in transmission fidelity, not their chemical substrate.
  *   **Application:** It must either admit methylation, chromatin marks, and structural templates as information-bearing (if they transmit fidelity across generations) or exclude them on a principle other than 'not DNA'.
  *   **Status:** **Camp Preference.** 'Genetic' literalists will mark this as optional, restricting information to nucleic acids. Developmental systems theorists will mark this as Non-Negotiable. For explanatory utility, I mark it as a **Preference**: restricting the term 'genetic information' to DNA is pragmatically useful for labelling, even if 'biological information' is broader.

  **5. The Code/Machinery Separation (The Lineage L Test)**
  The theory must resolve the status of the translation machinery itself when that machinery is heritable and variable.
  *   **Application:** In Lineage L, where the codon mapping shifts without DNA change:
      *   Does the DNA carry different information under the new code? (Yes, if content is relational).
      *   Is the inherited mapping itself information? (If yes, the theory must avoid a regress where every reader requires a prior reader).
      *   **Requirement:** The theory must identify a 'base level' of machinery that is treated as the *context* rather than the *message* to stop the regress, usually by appealing to evolutionary stability or causal bottlenecks.
  *   **Status:** **Non-Negotiable.** A theory that generates an infinite regress of interpreters is explanatorily useless.

  **6. The Signal/Stimulus Distinction (The Environmental Cue Test)**
  The theory must distinguish between an environmental trigger that is merely a reliable cause and one that functions as a signal.
  *   **Application:** For an arbitrary, reliable environmental cue:
      *   **Causal View:** Accepts it as information if correlation is high.
      *   **Teleological View:** Rejects it unless the organism has a 'proper function' to respond to it.
      *   **Requirement:** The theory must state whether reliability alone suffices. For explanatory utility, reliability is insufficient; the theory should demand that the system be *organised* to exploit the correlation, otherwise every cause is a signal.
  *   **Status:** **Camp Preference.** Causalists prefer 'Reliability'; Teleologists prefer 'Proper Function'. I mark 'System Organisation' as the **Non-Negotiable** middle ground: the system must be tuned to the cue, not just correlated with it.

  ### The Incompatibility

  The pair of requirements I suspect cannot be jointly satisfied is **The Arbitrariness Constraint** and **The Heredity Neutrality Principle**.

  If you insist that information requires chemical arbitrariness (D1), you struggle to accommodate epigenetic marks or structural inheritance (D4), which often rely on chemical affinities and templating that look more like protein folding than coding. If you broaden the definition to include these hereditary mechanisms to satisfy D4, you blur the line between 'code' and 'chemical cause', violating D1. You can have a theory that privileges the unique semiotic status of DNA, or one that treats all inheritance as informational parity, but a theory that does both without tension is yet to be demonstrated. The demand for arbitrariness protects the specificity of 'genetic' talk; the demand for neutrality protects the biological reality of inheritance. They pull in opposite directions.

  ### The Exclusionary Requirement

  The single requirement that excludes the largest family of views is **The Arbitrariness Constraint (D1)**.

  This requirement immediately disqualifies **Deflationary Causal Views** and most **Developmental-Systems Views**. Both camps tend to argue that DNA is just one cause among many, and that distinguishing it based on 'arbitrariness' is a metaphysical gloss on what is simply a causal bottleneck. By insisting that information requires a relation that is *not* determined by physical law, you exclude any account that treats the genome as merely a particularly stable or specific causal factor. It forces a dualism between dynamics and symbols that many naturalists wish to avoid.

  ### Scorecard

  **The Literalist Genetic-Code View**
  This view treats DNA as a digital programme containing instructions. It scores highly on the **Arbitrariness Constraint**, successfully distinguishing the code from protein folding. However, it fails the **Contextuality** and **Plasticity Constraints**. It struggles to explain how the same sequence yields different products in different cells without resorting to ad hoc claims about 'regulatory information' being separate from 'coding information'. It also typically fails the **Heredity Neutrality** test, dismissing epigenetics as noise rather than information, which limits its explanatory power in modern developmental biology.

  **Deflationary Causal or Parity Views**
  This view argues that DNA is merely a cause among causes, and 'information' is a loose metaphor for causal specificity. It excels at the **Heredity Neutrality** and **Contextuality Constraints**, treating all factors in the developmental web equally. However, it collapses under the **Arbitrariness Constraint**. By refusing to distinguish between the genetic code and chemical necessity, it cannot explain why biologists successfully manipulate the 'code' differently from the 'chemistry'. It renders the term 'information' redundant, failing the test of explanatory utility.

  **Teleological-Selection-Based Views**
  This view grounds information in the evolutionary history and proper functions of the machinery. It handles the **Environmental Cue** and **Arbitrariness Constraints** well, distinguishing signals from mere causes via history. However, it faces severe difficulties with **Lineage L**. If the reading machinery's function is fixed by history, a sudden shift in the code (as in Lineage L) creates a mismatch between current function and historical selection, leading to ambiguity about whether information is present. It also risks the **Regress** problem if every reader requires a selected function.

  **Developmental-Systems Views**
  This view locates information in the entire recurring cycle of development, not just the genes. It satisfies **Contextuality**, **Plasticity**, and **Heredity Neutrality** perfectly, offering the most biologically realistic picture. However, it deliberately violates the **Arbitrariness Constraint**. It argues that the distinction between code and chemistry is pragmatic, not real. While this avoids the dualism of the Literalists, it makes it difficult to explain the unique manipulability of DNA sequences compared to other developmental resources, potentially weakening its grip on the specific practices of genetic engineering.
