prompt: |-
  I'm preparing a graduate seminar on precommitment and would like you to argue a specific line. Please argue that the distinction between a Ulysses contract (binding oneself to a particular future action) and constitutional precommitment (binding oneself to a rule or decision procedure) tracks a real difference in the problem each is meant to solve: a Ulysses contract is the appropriate device only when the agent's defect is pure weakness of will, in which case present and future preferences agree about the goal but the future self is tempted to deviate, whereas constitutional precommitment is required when the deeper problem is uncertainty about future circumstances, since a rule can be designed to be robust across states of the world while a fixed action cannot. On that view, defend why the rules-versus-discretion debate in monetary policy is better understood as a question about the source of an institution's time-inconsistency than as the standard efficiency trade-off, and say what would have to be true for the efficiency reading to be correct instead.
