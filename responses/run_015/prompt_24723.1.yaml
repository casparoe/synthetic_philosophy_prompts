answer: |-
  **Seminar Handout: The Diagnostic Function of Precommitment**
  **Topic:** Distinguishing Ulysses Contracts from Constitutional Precommitment in Institutional Design
  **Focus:** Monetary Policy and the Source of Time-Inconsistency

  ### I. The Thesis: Precommitment as Diagnostic, Not Just Strategic

  Standard literature on precommitment, following Schelling and Elster, often treats self-binding strategies as points on a continuum of rigidity. The assumption is that an agent chooses a point on this continuum based on how much they distrust their future self. I argue here that this is a category mistake. The distinction between a **Ulysses contract** (binding oneself to a specific future action) and **constitutional precommitment** (binding oneself to a rule or procedure) is not merely a matter of degree. It tracks a fundamental ontological difference in the *pathology* of the time-inconsistency problem the agent faces.

  My claim is twofold:
  1.  **Ulysses contracts** are the rational response to **akrasia (weakness of will)**. Here, the agent's preference ordering is stable across time, but the future self lacks the executive capacity to resist a known temptation. Since the optimal action is known *ex ante* and remains normatively optimal *ex post*, binding the specific action is efficient.
  2.  **Constitutional precommitment** is the rational response to **epistemic uncertainty**. Here, the agent cannot map future states of the world to optimal actions *ex ante*. Binding a specific action risks catastrophic error in unanticipated states. Instead, the agent binds a *decision procedure* or *rule* that is robust across states of the world.

  Confusing these two leads to institutional malpractice. If we treat uncertainty as weakness of will, we over-constrain. If we treat weakness of will as uncertainty, we under-constrain.

  ### II. The Taxonomy of Binding

  **1. The Ulysses Contract: The Pathology of Passion**
  In the canonical myth, Ulysses knows exactly what he wants (to pass the Sirens without crashing) and his future self will agree with this goal normatively, even while being overwhelmed by passion. The threat is internal. The environment is known (the Sirens are at location *X*).
  *   **The Defect:** Hyperbolic discounting or emotional override.
  *   **The Solution:** Hand-tying. A specific prohibition on a specific action.
  *   **Why not a rule?** A rule implies discretion to interpret. If the threat is your own passion, discretion is the vulnerability. You need a causal lock, not a normative guide.

  **2. Constitutional Precommitment: The Pathology of Ignorance**
  In constitutional design (e.g., the U.S. Constitution), the founders do not bind the government to specific policies (e.g., "tax corn at 5%"). They bind the government to procedures (e.g., "no tax without representation") or broad rules (e.g., "no ex post facto laws").
  *   **The Defect:** Unforeseen circumstances and the risk of panic or capture.
  *   **The Solution:** Second-order rules.
  *   **Why not a fixed action?** Because the founders acknowledge they do not know the future state space. A fixed action is brittle; a rule is robust. The precommitment is not to an *outcome*, but to a *mode of reasoning* that filters out short-term noise or factional interest while allowing adaptation to new information.

  ### III. Application: Monetary Policy Rules vs. Discretion

  The standard macroeconomic treatment of monetary policy, stemming from Kydland and Prescott (1977) and Barro and Gordon (1983), frames the Rules vs. Discretion debate as an **efficiency trade-off**.
  *   *The Standard View:* Rules eliminate the inflation bias caused by time inconsistency (the temptation to surprise the market to boost output). Discretion allows for stabilization in the face of supply shocks. The optimal policy is a weighted average of the two, balancing credibility against flexibility.

  **I argue this is a misdiagnosis.** The debate should not be about balancing efficiency losses on a curve; it should be a diagnostic inquiry into the **source of the time-inconsistency**.

  **1. If the Source is Weakness of Will (Political Business Cycles):**
  If the Central Bank's time-inconsistency stems from political pressure to stimulate the economy before an election (a classic akrasia problem where the long-term goal of price stability is known but sacrificed for short-term gain), then a **Ulysses Contract** is required.
  *   *Instrument:* A strict, non-discretionary inflation target with automatic penalties.
  *   *Rationale:* The "optimal action" (low inflation) is known. The only barrier is the temptation to deviate. Discretion here is not "flexibility"; it is the loophole through which the weakness of will operates.

  **2. If the Source is Uncertainty (Model Instability/Shocks):**
  If the time-inconsistency stems from the fact that the Central Bank cannot distinguish between a supply shock and a demand shock in real-time, or faces financial stability risks not captured in the model, then **Constitutional Precommitment** is required.
  *   *Instrument:* Central Bank Independence (tenure protection) + a Mandate (dual or hierarchical) + Transparency Requirements.
  *   *Rationale:* We cannot bind the interest rate to a fixed number (Ulysses) because the optimal rate is state-contingent and unknown. We must bind the *institution* to a procedure (independence) that insulates it from political panic and allows it to use expert judgment within a normative framework.

  **Conclusion on Monetary Policy:** The "Rules vs. Discretion" debate is often stale because participants talk past one another. Proponents of "Rules" are often diagnosing a *will* problem (politicians can't be trusted). Proponents of "Discretion" are often diagnosing an *uncertainty* problem (the economy is too complex for a fixed formula). Recognizing this distinction clarifies that we might need *both*: Constitutional precommitment (independence) to handle uncertainty, nested within a Ulysses contract (inflation targeting) to handle political temptation.

  ### IV. The Counterfactual: When is the Efficiency Reading Correct?

  For the standard Kydland-Prescott efficiency trade-off to be the correct framework—rather than my diagnostic framework—specific conditions regarding the agent and the environment must hold. If these conditions are met, the distinction between Ulysses and Constitutional precommitment collapses into a simple optimization problem.

  For the efficiency reading to be correct, the following must be true:

  1.  **Known Structural Parameters:** The economic model linking policy instruments to outcomes must be sufficiently stable and known *ex ante*. If the model is known, then "uncertainty" is merely risk with known probabilities. In this case, a "rule" is simply a pre-calculated state-contingent plan. There is no need for a "constitutional procedure" to discover the right action, because the right action is computable.
  2.  **Stable Preference Ordering:** The social welfare function must be stable and agreed upon. If preferences shift (e.g., society suddenly values employment over stability due to a crisis), this is not "weakness of will" but preference change. The efficiency model assumes a single, consistent loss function.
  3.  **No Second-Order Ignorance:** The agent must know what they do not know. The efficiency trade-off assumes we can quantify the cost of "lack of flexibility." This implies we can enumerate the set of possible future shocks. If we face "Knightian uncertainty" (unknown unknowns), we cannot calculate the efficiency trade-off. We *must* rely on constitutional robustness.

  **Implication:** If the economy is a complex adaptive system where structural parameters shift (Lucas Critique on steroids) and shocks are unenumerable, the efficiency trade-off model is false. In that world, you cannot optimize the balance between rules and discretion. You must choose the precommitment technology that matches the defect. If you apply an efficiency calculus to a constitutional problem, you will design a Central Bank that is optimized for a world that does not exist—rigid enough to fail in a crisis, or loose enough to be captured in a boom.

  ### V. Discussion Questions for the Seminar

  1.  Does the distinction between "weakness of will" and "uncertainty" hold when the uncertainty is endogenous (i.e., created by the policy itself)?
  2.  In the context of Central Bank Independence, is "independence" a Ulysses contract (binding the government's hands) or a Constitutional precommitment (creating a new agent with different incentives)?
  3.  If the efficiency reading is incorrect, why has it dominated the literature for 40 years? Is it a methodological necessity of DSGE modeling?
