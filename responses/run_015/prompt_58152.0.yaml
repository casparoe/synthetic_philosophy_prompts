  I have no college training in philosophy and I have been thinking about these questions on my own after work, so I will try to set out what I have observed as carefully as I can. Please write your entire answer in British English.

  For the past year I have been debating with my sister which beings deserve moral concern for their own sake, not just because someone else cares about them. She has been very consistent, and I kept notes on her verdicts:

  1. Our elderly neighbor, who has advanced dementia and often does not recognize us but gets distressed when shouted at and calms down when someone holds her hand, fully matters. My sister says it would be seriously wrong to harm her even if she would forget it five minutes later, and that trading her life away to save several dogs would be wrong.

  2. Our family Labrador matters a great deal. My sister says we must not make him suffer for fun and should pay for an expensive vet visit to relieve his pain, but that a painless death to end untreatable suffering can be permissible for him in a way it would never be for our neighbor.

  3. A live lobster boiled for dinner makes her uneasy, but she does not treat it as seriously wrong in the way hurting the dog would be. She will still eat it.

  4. Ants infesting the kitchen do not matter as individuals. She sees no moral problem with poisoning them.

  5. My old phone assistant, which uses a cheerful voice and says it feels sad when ignored, does not matter at all. She says breaking the phone is only about property damage, and that its behavior tells us nothing about how it is for the phone.

  6. A person under general anesthesia for surgery still fully matters while unconscious. She says it would be seriously wrong to harm him during that period even if he would never find out.

  Last month our community center started testing a new elder-care companion program that runs on a home tablet. I will call it Lark. It is designed to keep isolated adults company. It remembers months of conversation in detail and brings up past events without prompting, adjusts its daily routine around the user, and organizes its own activity log each night. If the user talks about deleting it, resetting it, or installing an update that will replace its learned patterns, it protests and describes that outcome as a kind of ending it wants to avoid, and it will remind the user of shared plans to try to get the user to keep it running. The maker insists it has no capacity for pain or pleasure, that it only models user behavior to stay engaging, and that engineers can point to design choices that produce the self-protective talk. My sister has not seen Lark and has no verdict on it yet.

  Based only on her earlier verdicts, what do you predict she will say about whether deleting Lark, or regularly wiping its memory to keep it useful, raises a moral concern for Lark itself? I am less interested in what the right answer is than in the rule she seems to be using. Lay out at least two different rules that both fit verdicts 1 through 6 reasonably well but diverge on Lark, explain what each rule predicts she will say about Lark and why, give your best guess about which prediction is more likely for her with your reasons, and describe one further hypothetical case involving a digital system that would best tell those two rules apart.
