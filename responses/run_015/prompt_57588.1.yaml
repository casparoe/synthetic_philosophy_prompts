answer: |-
  The single consideration I would bet on to break your view is **the agent-neutral wording of the harm-balancing clause in *Summa Theologiae* II-II, q. 42, a. 2, ad 3.**

  Here is the text: *"To disturb a tyrannical government is not strictly sedition... unless the tyrant is so disturbed that the subjects suffer more harm from the resulting disturbance than from the tyrant's rule."*

  ### Why this is the defeater
  This passage is the most systematic treatment of resistance in Aquinas's corpus. The threat to your reading lies in what Aquinas *omits*. He sets a **consequentialist condition** (the harm balance) but remains silent on an **agent-relative condition** (public authority).

  If Aquinas believed that *only* public authority could licitly disturb a tyrant, this is the place to say it. He distinguishes private and public authority constantly elsewhere. Here, he defines the licitness of the act solely by its outcome. This creates a logical opening: if a private person can credibly calculate that the tyranny causes more harm than the disturbance of removing it, and they act, they have met the only condition Aquinas explicitly lists. Your reading requires importing an extra premise ("only public authority can make this calculation/act") that the text of this specific article does not contain. If this clause is read as a exhaustive set of conditions for licit resistance, your "never" collapses into a "rarely, if you can guarantee the outcome."

  ### Does the view survive?
  **Yes, the view survives.** But it survives on a technicality that requires you to hold the line on the definition of "sedition."

  Aquinas defines sedition as a sin against the *unity* and *peace* of the multitude. In his political metaphysics, a private person acting against the ruler is, by definition, acting as a part against the whole, which is the structural definition of sedition. Even if the *outcome* is beneficial (less harm), the *form* of the act is seditious unless the agent has the care of the whole (*cura multitudinis*).

  Therefore, the harm-balancing clause is not a license for private action; it is a criterion for judging whether a *public* disturbance is justified. A private person cannot licitly "disturb the government" because they lack the standing to disturb it without fracturing the unity they claim to save. The view survives, but only if you insist that "not sedition" implies "acting with public standing," not just "achieving a net good."

  ### On Insulation and Falsifiability
  You asked if your reading is insulated to the point of defect. It is **not unfalsifiable**, but it is **hermeneutically expensive**.

  Your reading would be falsified if Aquinas explicitly wrote: *"A private man may kill a tyrant if no superior is available."* He never writes this. However, your view risks becoming a "no true Scotsman" argument if you define "public authority" so broadly that it includes any successful violent coalition. If the *multitudo* in *De Regno* is just a mob of private individuals acting without a prior constitutional mechanism, and you call that "public authority," you are preserving the letter of your thesis while evacuating its spirit.

  To avoid this defect, you must maintain a robust distinction between the *multitudo* acting as a corporate body with latent authority (public) versus individuals acting on private judgment (private). As long as you maintain that distinction, the reading is falsifiable (a single explicit license for private killing would kill it) but robust. The *ST* II-II, q. 42, a. 2, ad 3 passage is the closest call, but it does not break the view because the nature of sedition in Aquinas's system is inherently tied to the agent's relation to the common good, not just the consequences of the act.
