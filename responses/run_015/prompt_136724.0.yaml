      *   *The "Provenance" Trap:* Premise (8) assumes that if *some* provenance matters (manipulation), *all* provenance matters (determinism). This is the "All or Nothing" fallacy. Compatibilists argue there is a *relevant difference* between manipulation and ordinary determinism (e.g., alignment with higher-order volitions, historical conditions of autonomy).

