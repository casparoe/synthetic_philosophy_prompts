answer: |-
  **Exam Question**

  **Module:** PHIL402: Consequentialism and Its Limits
  **Section:** B (Essay)
  **Time Allowed:** 45 Minutes

  **Question 1**

  The standard objection from cluelessness argues that because long-run effects dominate near-term ones, and our evidence regarding the sign of long-run effects is symmetric, act-consequentialism (AC) fails to guide action. The standard defence replies that this is merely ordinary uncertainty; one should maximise expected value (EV) given available evidence, treating symmetric ignorance as zero expected contribution.

  Consider the following three-way choice facing a consequentialist agent:
  *   **Option A:** A well-measured near-term intervention (e.g., bednet distribution) with known positive value $V_{near}$ and negligible long-run variance.
  *   **Option B:** A structural reform with potential long-run value $V_{far}$ orders of magnitude larger than $V_{near}$, but where the sign of $V_{far}$ is currently unestimable.
  *   **Option C:** A research programme costing $V_{near}$ that resolves the sign uncertainty regarding Option B.

  To evaluate this choice, employ the following two devices:
  1.  **The Articulation Asymmetry:** The hypothesis that causal mechanisms we can represent are a biased sample of those that matter, skewed towards the near and narratable. This implies our estimates of long-run value carry an unidentified *directional bias*, not merely large variance.
  2.  **The Self-Endorsement Test:** The requirement that a decision rule proposed for use under cluelessness must, when applied to the choice of a decision rule, not recommend its own abandonment.

  Write an essay explaining what the clueless consequentialist should do. In your answer, you must: (i) formally reconstruct why the standard EV defence fails under the Articulation Asymmetry; (ii) apply the Self-Endorsement Test to the choice between following EV maximisation versus adopting a rule of purchasing information (Option C); and (iii) conclude whether cluelessness constitutes a specific objection to consequentialism or a general problem of rational choice.

  ***

  **Model Answer**

  The standard dialectic on cluelessness reaches a stalemate because both sides accept that long-run uncertainty is structurally symmetric noise. The objector claims this reduces expected value (EV) to zero; the defender claims it simply integrates into the calculation. However, the introduction of the Articulation Asymmetry breaks this symmetry, and the Self-Endorsement Test reveals a deeper instability in act-consequentialism (AC).

  Formally, the standard EV defence relies on the assumption that $E[V_{far}] = 0$ because the probability distribution of outcomes is symmetric around zero. If uncertainty is merely high variance ($\sigma^2$), EV maximisation dictates choosing the option with the highest known near-term value (Option A), assuming the unknown long-run terms cancel out. However, the Articulation Asymmetry posits that our model of the world is not a random sample of causal mechanisms but a biased one. We can articulate mechanisms that are proximate and simple; we cannot articulate complex, distant chains. If the set of articulable mechanisms is biased, the error term in our calculation is not mean-zero noise. It is a systematic bias $\beta$. If $\beta$ is unknown, we cannot assign it an expected value of zero; we must admit $E[V_{total}] = V_{near} + E[V_{far}] + \beta$. Since $\beta$ is unidentified, the EV calculation is undefined, not merely risky. The defender's reply that we should "do the best we can" fails because "doing the best" requires a defined metric, which the bias destroys.

  This forces a shift from act-evaluation to rule-evaluation via the Self-Endorsement Test. If the agent adopts the rule "Maximise EV based on current evidence," they must ask: does this rule recommend itself? Under Articulation Asymmetry, current evidence is structurally flawed. Therefore, an EV-maximising rule applied to the choice of rules would prioritise reducing the bias $\beta$ over acting on current estimates. It would recommend Option C (Research). If the rule "Maximise EV" recommends "Do not act on current EV estimates, but research first," it fails the Self-Endorsement Test at the level of action. It is self-undermining. Conversely, a rule of "Epistemic Maximisation" (prioritising Option C until bias is resolved) passes the test: if you value information, you value the rule that tells you to value information.

  Thus, the clueless consequentialist should choose Option C. However, this yields a troubling normative upshot. If AC consistently recommends purchasing information over acting whenever cluelessness is present, it risks paralysis or an infinite regress of research. More importantly, this is not a problem specific to consequentialism. Deontological or virtue-ethical agents also face the problem that their principles apply to a world they do not understand. If a deontologist cannot know if a lie prevents a catastrophe, their rule is as blind as the consequentialist's calculator. The difference is that non-consequentialist views often treat this ignorance as a reason to retreat to proximate duties (like "do not lie"), effectively hiding the cluelessness rather than solving it. Consequentialism's virtue is that it forces the problem into the open via the Self-Endorsement Test.

  In conclusion, the Articulation Asymmetry demonstrates that long-run uncertainty is not symmetric noise but structural bias, invalidating the standard EV defence. The Self-Endorsement Test shows that under such bias, the only stable rule is one that prioritises reducing cluelessness (Option C). While this threatens AC with paralysis, it highlights that the problem is one of rational agency under structural ignorance, not a flaw unique to the good-maximising framework.

  ***

  **Marking Scheme**

  **Total Marks: 20**

  **1. Formal Reconstruction of Cluelessness (4 Marks)**
  *   **Criteria:** Candidate distinguishes between *variance* (noise) and *sign-indefiniteness* (unknown mean). Must show that the standard EV defence assumes a mean-zero error term, whereas the cluelessness objection challenges the ability to assign *any* mean.
  *   **Common Error:** Treating "unknown sign" as equivalent to "zero value" without explaining the probabilistic assumption being made.

  **2. EV Assumptions and Defeat Conditions (4 Marks)**
  *   **Criteria:** Candidate explicitly states that the EV reply depends on the independence and symmetry of error terms. Must explain that Articulation Asymmetry defeats this by introducing a non-zero expected bias ($\beta \neq 0$).
  *   **Common Error:** Claiming that high variance alone is sufficient to break EV maximisation (it is not; EV handles variance well).

  **3. Application of Articulation Asymmetry (4 Marks)**
  *   **Criteria:** Candidate explains *why* the bias matters: it makes the expected value undefined rather than just low. Must avoid overclaiming (e.g., admitting that if the bias's direction were known, EV could be adjusted).
  *   **Common Error:** Arguing that *any* unidentified bias automatically makes action impossible, without noting that symmetric uncertainty about the bias itself might still allow for a zero expectation.

  **4. Application of Self-Endorsement Test (4 Marks)**
  *   **Criteria:** Candidate applies the test at the *rule level* (choosing a decision procedure), not the act level. Must identify the tension where EV maximisation recommends abandoning immediate EV maximisation for research (Option C).
  *   **Common Error:** Applying the test to the specific acts (A, B, C) rather than the decision rule governing the choice, missing the reflexive requirement.

  **5. Normative Upshot and Scope (4 Marks)**
  *   **Criteria:** Candidate concludes on whether this is specific to consequentialism. Must recognise that non-consequentialist "immunity" is often a feature of ignoring long-run consequences rather than solving the epistemic problem.
  *   **Common Error:** Asserting that deontology solves cluelessness because it ignores consequences, rather than noting that it merely sidesteps the calculation while remaining blind to outcomes.

  ***

  **Note on Grading Distinctions**

  **What separates an A answer from a B answer:**
  A **B-grade** answer will correctly define the two devices and apply them mechanically to the scenario (e.g., "Asymmetry means B is risky, so choose C; Self-Endorsement means C is stable"). It will treat the Articulation Asymmetry as simply "more uncertainty."

  An **A-grade** answer will identify the *structural* implication of the Asymmetry: that it converts a problem of risk (variance) into a problem of ambiguity (undefined mean), which mathematically breaks the EV defence in a way variance does not. Furthermore, an A answer will recognise the reflexive tension in the Self-Endorsement Test: that consequentialism may become a theory that recommends *not* using consequentialist calculation for immediate acts, potentially collapsing into a form of indirect consequentialism or epistemic prioritisation. The A candidate sees that the "solution" (Option C) might be a stable rule but an unstable *theory*.
