      *   **Forced vs. Preference:** Clear distinction.
      *   **Diagnostic Duty:** The "Debuggability" requirement.
      *   **Incompatibilities:** The "Trilemma."
      *   **Scorecard:** Brief comparison.

  9.  **Drafting the Content (incorporating specific philosophical points):**

      *   *Procedural Rationality:* Cite "Program Equilibrium."
      *   *Awareness:* Cite "Unawareness" literature.
      *   *Robustness:* Cite "Rubinstein's Electronic Mail Game" (Two Generals) and "Centipede." The discontinuity is the main problem.
      *   *Selection:* Engineering needs *the* outcome, not *an* equilibrium.
      *   *Invariance:* Intensionality is a bug for engineering but a feature for logic. Need to specify "Behavioral Equivalence."

  10. **Review against Constraints:**
      *   Did I answer the specific questions? (Strategies vs Procedures, Game Form Commonality, CK vs HDMB, Selection, Invariance). Yes.
      *   Did I mark Forced vs Preference? Yes.
      *   Did I flag impossibility? Yes.
