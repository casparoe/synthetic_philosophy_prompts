  11. **Final Polish:** Ensure the distinction between "Common Knowledge of the Game" and "Common Knowledge of the Outcome" is clear. Ensure the "Diagnostic Duty" section acknowledges the Duhem-Quine problem in this context. (Self-correction: Make sure to emphasize that standard Epistemic Game Theory is likely *inadequate* for Feature 1).

  *(Self-Correction during final review)*: Wait, the prompt asks me to "settle what the account must say about" specific issues. I shouldn't just list them as questions; I should derive the requirement from the engineering context.
