answer: |-
  # Specification for an Epistemic Engineering Framework

  You are repurposing epistemic game theory from a descriptive/explanatory discipline into a prescriptive engineering tool. This shifts the burden of proof: an account is not adequate because it is elegant or standard, but because it supports verification, debugging, and stability in a deployed system.

  Below are the desiderata derived from your three constraints (Inspectable Code, Staggered Rollouts, Partial Verification). Following these, I classify which are forced by your purpose versus preferences of standard theory, address the diagnostic duty, and identify the critical incompatibility.

  ## I. Desiderata for Adequacy

  ### 1. Procedural Rationality (The Code Constraint)
  **Requirement:** The account must evaluate rationality at the level of *algorithms* (procedures), not *strategies* (mappings from information sets to actions).
  **Motivation:** In standard theory, a strategy is a black box mapping histories to moves. In your setting (Feature 1), agents submit source code. An agent's optimal move depends on the *logical properties* of the opponent's code (e.g., "Does this function halt?" "Does it simulate me?"). A framework that treats the agent as choosing from a fixed set of actions ignores the causal link between the code structure and the opponent's simulation of that code. If the account defines rationality only over the output of the code, it cannot license claims about outcomes derived from code inspection (e.g., program equilibrium).
  **Verdict:** Rationality must attach to the procedure.

  ### 2. Awareness Sensitivity (The Rollout Constraint)
  **Requirement:** The account must model *unawareness* of the game form, not merely uncertainty over types within a fixed game form.
  **Motivation:** Standard epistemic models assume a common state space $\Omega$ and a common game tree. Feature 2 (Staggered Rollouts) violates this: Agent A has action $x$; Agent B (legacy) literally cannot represent $x$. If the framework assumes the game form is common knowledge, any prediction involving Agent B's reaction to $x$ is ill-formed. The account must allow the state space to be agent-relative (e.g., using awareness structures or generalized state spaces) so that "Agent B knows Agent A can play $x$" is a distinct, verifiable proposition from "Agent B plays a best response to $x$."
  **Verdict:** The game form cannot be assumed common; the framework must support explicit modeling of awareness limits.

  ### 3. Epistemic Continuity (The Verification Constraint)
  **Requirement:** Solution concepts must be *continuous* (or robust) with respect to the depth and probability of mutual belief.
  **Motivation:** You have Feature 3 (Partial Verification): you can only establish $k$-level mutual belief with probability $1-\epsilon$. Standard epistemic characterizations of Nash or Subgame Perfect Equilibrium often rely on Common Knowledge (CK) as a fixed point. However, in games like the Centipede or Rubinstein's Electronic Mail Game (Two Generals), the outcome under CK is discontinuous from the outcome under $k$-level belief. If CK implies "Defect" but $k=100$ implies "Cooperate," your verification is useless because you never have CK. The account must guarantee that if a outcome follows from CK, a "close" outcome follows from high-degree mutual belief.
  **Verdict:** Conclusions must survive the weakening of CK to high-degree, high-probability mutual belief.

  ### 4. Determinacy without CK of Outcome (The Engineering Constraint)
  **Requirement:** The account must select a unique (or tightly bounded) outcome without assuming Common Knowledge of that selection.
  **Motivation:** As an engineering tool, "anything in the equilibrium set is possible" is a failure mode. You need to verify that the protocol *will* converge to a specific safety property. However, you cannot assume the agents have CK of the solution concept itself (they are independent deployments). The account must derive the selection from the structural constraints (code + protocol) and finite-depth beliefs, rather than assuming the agents coordinate on a specific equilibrium by fiat.
  **Verdict:** The account must do more than describe beliefs; it must select an outcome, but it cannot presuppose CK of the selection to do so.

  ### 5. Computational Extensionality (The Implementation Constraint)
  **Requirement:** Verdicts must be invariant under code refactoring that preserves input-output behavior *and* computational complexity profile.
  **Motivation:** Feature 1 implies agents read code. This creates a tension: if Agent A checks for specific variable names in Agent B's code, refactoring breaks the protocol. However, for a general engineering framework, we cannot rely on brittle intensional checks. The account should treat agents as equivalent if they are behaviorally identical *and* logically equivalent (e.g., same halting properties, same simulation depth). If the account's verdict changes when you rename variables but keep the logic identical, it is too brittle for deployment.
  **Verdict:** Invariance is required, but limited to "computational extensionality" (behavior + logical properties), not pure input-output extensionality.

  ---

  ## II. Forced Requirements vs. Research Preferences

  You must distinguish between constraints imposed by the engineering task and assumptions inherited from standard literature that you should discard.

  | Requirement | Status | Justification |
  | :--- | :--- | :--- |
  | **Procedural Rationality** | **Forced** | Feature 1 (Inspectable Code) makes strategy-based rationality obsolete. |
  | **Awareness Sensitivity** | **Forced** | Feature 2 (Staggered Rollouts) makes common game form assumptions false. |
  | **Epistemic Continuity** | **Forced** | Feature 3 (Partial Verification) makes CK-based discontinuities fatal. |
  | **Diagnostic Separability** | **Forced** | Engineering requires knowing whether to fix the *code* (rationality) or the *channel* (knowledge). |
  | **Common Prior** | **Preference** | Distributed systems often have divergent initializations; do not assume this. |
  | **Factivity of Knowledge** | **Preference** | Agents may have false beliefs about code (bugs, compilation errors); use Belief, not Knowledge. |
  | **Single Probability Measure** | **Preference** | Imprecise probabilities or rankings better capture "margin short of certainty." |
  | **CK of Rationality** | **Preference** | You only have finite-depth verification; do not assume infinite regress. |
  | **Nash/Equilibrium Refinement** | **Preference** | These are solution concepts, not axioms. The framework must *justify* one, not assume it. |

  ---

  ## III. The Diagnostic Duty

  **The Duty:** When observed play contradicts the prediction, the account must indicate whether the failure lies in the **Rationality Assumption** (the agent's code is buggy/suboptimal) or the **Epistemic Assumption** (the agent's beliefs about the other were wrong).

  **Can it be discharged?**
  Generally, **no**, not fully. This is a local instance of the Duhem-Quine problem.
  *   If an agent defects when the model predicts cooperation, you can save the Rationality assumption by positing the agent believed the other would defect.
  *   You can save the Epistemic assumption by positing the agent was irrational (e.g., altruistic).

  **The Engineering Fix:** To discharge this duty, the framework must impose **independent constraints on Belief Formation**.
  *   You cannot simply say "Agent believes $X$." You must specify *how* that belief is formed (e.g., "Agent believes $X$ because it simulated Agent B's code for $t$ steps").
  *   If the belief formation process is part of the specification (e.g., "Beliefs are derived from static analysis of code"), then a prediction failure allows you to check the static analysis logs. If the logs match the model but play diverges, Rationality is at fault. If the logs diverge, Epistemology is at fault.
  *   **Requirement:** The account must include a *model of belief generation*, not just a model of belief consistency.

  ---

  ## IV. Incompatibilities and The "Killer" Requirement

  There is a fundamental tension between **Desideratum 1 (Procedural Rationality)** and **Desideratum 3 (Epistemic Continuity)**.

  1.  **The Conflict:** Procedural rationality often allows for "logical cooperation" (e.g., two agents simulating each other to cooperate in a Prisoner's Dilemma). However, this cooperation is often fragile. If there is even a tiny probability that the opponent is not running the same logic (a "tremble" or version mismatch), standard rationality dictates defection.
  2.  **The Discontinuity:** In the Two-Generals/Centipede cases, standard rationality + CK yields one outcome (Defect/Take), while Rationality + $k$-belief yields another (Cooperate/Pass) for large $k$. This violates Desideratum 3.
  3.  **The Impossibility:** You cannot simultaneously have:
      *   Strict Procedural Rationality (maximizing expected utility given logical beliefs).
      *   Strict Epistemic Continuity (outcomes stable under small changes in belief depth).
      *   Standard Probability Theory (additive measures).

  **The Killer Requirement:** **Epistemic Continuity (Desideratum 3).**
  This is the requirement that rules out the most candidate frameworks.
  *   **Standard Epistemic Game Theory:** Fails immediately (assumes CK, discontinuous).
  *   **Program Equilibrium:** Fails Continuity (cooperation collapses with any non-zero probability of error/mismatch).
  *   **Logical Induction / ADT (Approximate Decision Theory):** This is the only family attempting to satisfy Continuity in logical settings, but it is computationally heavy and lacks mature awareness modeling.

  If you insist on Continuity, you must abandon the idea that agents are strict expected utility maximizers over logical possibilities. You must adopt a framework that allows for "robust" cooperation under uncertainty (e.g., using imprecise probabilities or specific bounded rationality models).

  ---

  ## V. Scorecard of Candidate Frameworks

  | Framework | Procedural Rationality | Awareness Sensitivity | Epistemic Continuity | Diagnostic Duty | Verdict |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Standard Epistemic Game Theory** (Aumann, Brandenburger) | **Fail** (Strategies) | **Fail** (Common Game) | **Fail** (Discontinuous) | **Fail** (No belief gen) | **Reject**. Purely descriptive, assumes CK. |
  | **Program Equilibrium** (Tennenholtz, etc.) | **Pass** (Code) | **Fail** (Assumes common rules) | **Fail** (Fragile to noise) | **Partial** | **Reject**. Too brittle for Feature 3. |
  | **Awareness Models** (Heifetz, Meier, Schipper) | **Fail** (Strategies) | **Pass** (Unawareness) | **Fail** (CK based) | **Fail** | **Partial**. Solves Feature 2, fails 1 & 3. |
  | **Logical Induction / ADT** (Garrabrant et al.) | **Pass** (Algorithms) | **Partial** (Logical uncertainty) | **Pass** (Designed for limits) | **Pass** (Explicit learners) | **Best Fit**. Computationally expensive, but aligns with Features 1 & 3. |
  | **Epistemic Planning / Model Checking** | **Pass** (Procedures) | **Pass** (State spaces) | **Pass** (Bounded depth) | **Pass** (Traceable) | **Strong Contender**. Treats beliefs as model states; good for Feature 3. |

  ## VI. Summary Recommendation

  To build this tool, you cannot use standard epistemic game theory. It assumes the very things you lack (Common Knowledge, Common Game Form, Strategy-based rationality).

  You must adopt a **Bounded Epistemic Planning** framework.
  1.  **Rationality:** Define it over *programs* (like Program Equilibrium).
  2.  **Knowledge:** Model it as *finite-depth mutual belief* with explicit probability masses (like Epistemic Model Checking), not CK.
  3.  **Awareness:** Use *state-space partitions* that differ per agent version.
  4.  **Continuity:** Accept that you cannot guarantee standard Nash outcomes. You must verify *robust* equilibria that hold under $\epsilon$-perturbation of beliefs.

  **Final Warning:** If you require **Epistemic Continuity** (stability between $k$-belief and CK), you must give up the vindication of standard backward induction. You cannot have it both ways. In your engineering context, **give up backward induction**. It is the source of the discontinuity that makes verification impossible under Feature 3.
