prompt: |-
  I'm a backend engineer with no philosophy background, and my team is building a memorial product I've started to feel uneasy about: we ingest a dead person's entire digital residue — mail, chat logs, drafts, photos, calendar, search history, location and health data — and generate a book-length life written in the first person, which the family can also query later and have it answer in the subject's voice. Two tiers are on the table. "Complete" suppresses nothing: the only editorial act left is which thread to follow first, since nothing may be cut or reordered. "Curated" lets the family, or the person while still alive, flag material to be dropped, and reads in practice as a tribute.

  I've been reading Plutarch's parallel lives of Greeks and Romans alongside this, and I'd like to know where he would come down. Concretely: which tier, if either, would he count as a life rather than a chronicle, and could either one do the improving work he seems to have wanted the genre to do? I mean answers that argue from what he actually did and said — that he opens the Alexander by saying he writes lives, not histories; that a stray remark or a joke can show character better than a celebrated battle; that he sets each Greek beside a Roman and weighs them; that there is a preface somewhere about holding these men in front of you like a mirror — rather than from the assumption that he would simply be appalled by the machinery. Two follow-ups I especially care about: would he see the curated tier as the kind of flattery he warns about, or is his own practice closer to it than we like to admit; and would he think a life assembled by a machine, with judgement removed from selection, can teach anyone anything at all? For what it's worth, most of our customers are completely ordinary people rather than generals and statesmen, which may matter to him too.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Request:**
      *   **User:** Backend engineer, no philosophy background, building a "digital memorial" product (ingesting dead person's data to generate a first-person biography/chatbot).
      *   **Product Tiers:**
          *   "Complete": No suppression, no reordering (just thread selection). Raw data dump essentially.
          *   "Curated": Family/Subject flags material to drop. Tribute-style.
      *   **Lens:** Plutarch's *Parallel Lives*.
      *   **Specific Questions:**
          1.  Which tier counts as a "Life" (bios) vs. a "Chronicle/History" (historia)?
          2.  Can either do the "improving work" (ethical/moral instruction) Plutarch intended?
          3.  Is "Curated" flattery (which Plutarch warns against), or is Plutarch's own practice closer to curation than admitted?
          4.  Can a machine-assembled life (judgment removed from selection) teach anything?
          5.  Does the "ordinariness" of the subjects matter to Plutarch?
      *   **Constraint:** Argue from what Plutarch *actually did and said* (textual evidence), not just "he'd be appalled by tech."

  2.  **Deconstruct Plutarch's Method & Philosophy:**
      *   *Source Material:* Primarily *Parallel Lives*, specifically the prologues (Alexander, Aemilius Paullus, Pericles, Cimon, etc.).
      *   *Key Concept 1: Bios vs. Historia.* Plutarch explicitly distinguishes himself from historians. Historians record great deeds/battles/public events. Biographers record character (*ethos*). A small remark or joke often reveals more than a siege.
      *   *Key Concept 2: The Mirror.* The Lives are for moral improvement. The reader looks at the lives of great men as a mirror to adorn their own life.
      *   *Key Concept 3: Truth vs. Flattery.* Plutarch warns against excessive praise that hides faults, but also against malicious slander. He aims for a balanced truth that serves virtue.
      *   *Key Concept 4: Selection/Judgment.* Plutarch is highly selective. He omits vast amounts of data to focus on character-revealing moments. He is the author/judge.
      *   *Key Concept 5: The Subject.* He writes about famous men (generals, statesmen). Does this apply to ordinary people? Plutarch believes virtue is universal, but *exemplarity* requires public action to be measured.

  3.  **Address the Specific Questions (Drafting the Argument):**

      *   **Q1: Complete vs. Curated (Life vs. Chronicle).**
          *   *Complete:* This is raw data. Plutarch calls this *historia* (history/chronicle) or even just archives. It lacks the shaping hand of the biographer. It's a "register of acts," not a "portrait of a soul."
          *   *Curated:* This is closer to *bios*. It involves selection. However, if the *family* curates it to be a "tribute," that risks panegyric (funeral oration), which Plutarch distinguishes from biography.
          *   *Verdict:* "Complete" is definitely a Chronicle. "Curated" *could* be a Life, but only if the curation is guided by truth/character, not just honor.

      *   **Q2: The Improving Work (Moral Instruction).**
          *   *Complete:* Can raw data teach virtue? Plutarch would say no. Without interpretation, vice and virtue look the same. A search history entry without context is just noise.
          *   *Curated:* If curated to hide faults, it teaches nothing (you can't learn from a perfect statue). If curated to highlight character traits (even flawed ones), it might work.
          *   *Verdict:* Neither works well as is. The "Complete" lacks judgment; the "Curated" lacks honesty.

      *   **Q3: Flattery vs. Plutarch's Practice.**
          *   *Flattery:* Plutarch hates flattery (*kolakeia*). He says in *How to Tell a Flatterer from a Friend* that flattery harms the soul.
          *   *Plutarch's Curation:* Plutarch *does* omit shameful details sometimes (e.g., he skips some scandals about Cato or Alexander), but he claims he does it to avoid dwelling on vice for vice's sake, not to hide the man's nature. He includes faults if they reveal character (e.g., Alexander's rage).
          *   *Verdict:* The "Curated" tier (family dropping stuff) is likely flattery/panegyric. Plutarch's curation is *authorial judgment* for the sake of moral clarity, not family comfort.

      *   **Q4: Machine Judgment.**
          *   Plutarch believes the biographer is a moral guide. The selection *is* the moral act.
          *   If a machine selects based on "threads" or algorithms, there is no *phronesis* (practical wisdom).
          *   *Verdict:* A machine cannot write a *Life* because it cannot judge character. It can only arrange data.

      *   **Q5: Ordinary People.**
          *   Plutarch writes about "Great Men." Why? Because their actions had scale.
          *   However, he believes virtue is the same in kind, just different in scale.
          *   *Verdict:* He might find ordinary lives worthy *if* they display virtue clearly. But without public action, it's harder to judge *ethos*.

  4.  **Synthesize and Structure the Response:**
      *   **Introduction:** Acknowledge the engineer's thoughtful approach. State the thesis: Plutarch would reject the "Complete" tier as mere history/archives and view the "Curated" tier with suspicion as panegyric, unless the curation is driven by moral truth, not family comfort.
      *   **Section 1: Life (Bios) vs. Chronicle (Historia).** Use the *Alexander* prologue. "Complete" = Chronicle. "Curated" = Potential Life, but risky.
      *   **Section 2: The Problem of Flattery.** Address the "Curated" tier. Use *How to Tell a Flatterer from a Friend* and the *Cimon* prologue. Distinguish between *omitting irrelevant shame* vs. *hiding character flaws*.
      *   **Section 3: The Necessity of Judgment (The Machine Problem).** The core of Plutarch's project is the biographer's moral weighing. A machine lacks *phronesis*.
      *   **Section 4: The Ordinary Subject.** Discuss the scale of virtue.
      *   **Conclusion:** Summarize the verdict. The product is a "Digital Tomb," not a "Parallel Life."

  5.  **Refine the Argument (Self-Correction/Nuance):**
      *   *Correction:* I need to make sure I don't just say "Plutarch hates machines." I need to focus on the *removal of judgment*.
      *   *Nuance:* Plutarch *does* omit things. I need to be careful not to say he includes *everything* bad. He omits things that are "not necessary to know" or purely scandalous without moral weight. The family's curation is likely emotional protection, not moral weighing. That's the key distinction.
      *   *Tone:* Respectful, analytical, bridging the gap between engineering and classics.

  6.  **Final Polish:** Check specific references (Alexander 1.1-2, Aemilius Paullus 1, Pericles 2). Ensure the distinction between *bios* and *historia* is clear. Ensure the "mirror" metaphor is used correctly.

      *(Self-Correction during drafting)*: Wait, the prompt says the "Complete" tier suppresses nothing but the *machine* chooses the thread. The "Curated" tier lets humans flag drops.
      *   Plutarch on "Complete": Even if nothing is cut, if the *ordering* is algorithmic, it's not a Life. A Life requires a narrative arc designed to show character development.
      *   Plutarch on "Curated": If the family hides the "bad stuff," it becomes a funeral oration (*epitaphios*), which Plutarch explicitly says is *not* what he is writing (see *Cimon*).

      *Let's tighten the "Machine Judgment" point.* Plutarch believes the biographer is like a painter who captures the likeness in the eyes/expression, not just the body size. An algorithm captures the body size (data volume).

  7.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  This is a profound engineering challenge disguised as a product specification. You are asking whether a dataset can become a *bios* (a life) simply by being comprehensive, or whether it requires a moral agent to shape it.

  Plutarch is surprisingly specific about this. He does not treat biography as data preservation; he treats it as moral medicine. Based on his prologues (specifically *Alexander*, *Aemilius Paullus*, and *Cimon*) and his ethical treatises (like *How to Tell a Flatterer from a Friend*), here is how he would likely evaluate your two tiers.

  ### 1. Chronicle vs. Life: The "Complete" Tier
  Plutarch would definitively classify your "Complete" tier not as a *Life* (*bios*), but as a *History* (*historia*) or, more accurately, a **register** (*hypomnemata*).

  In the famous opening of *Alexander*, Plutarch writes:
  > *"It is not Histories that I am writing, but Lives... for the most glorious deeds do not always show the workings of virtue or vice; often, a small matter, a remark, or a joke, makes a man's character clearer than battles where thousands fall."*

  To Plutarch, a "Life" is defined by **selection for the sake of character revelation**.
  *   **The "Complete" Tier:** By ingesting everything (search history, health data, drafts) and suppressing nothing, you are prioritizing *volume* over *virtue*. Plutarch would argue that a search history entry for a symptom is not a revelation of character; it is a biological fact. A draft email never sent is not an action; it is a phantom.
  *   **The Verdict:** This tier is a **Chronicle**. It provides the raw material of a life, but without the editorial hand of a biographer to say, "This moment matters because it shows courage," or "This moment matters because it shows intemperance," it cannot function as a mirror. It is a warehouse, not a portrait. Plutarch would say this cannot do the "improving work" because the reader is left to sift through noise without a guide.

  ### 2. Flattery vs. Truth: The "Curated" Tier
  This is where Plutarch would be most critical of your team's assumptions. You ask if the "Curated" tier is flattery. Plutarch would say **yes, almost certainly.**

  In the *Cimon*, Plutarch addresses the criticism that he ignores the faults of his subjects. He distinguishes his work from a **Funeral Oration** (*epitaphios*). A funeral oration's job is to honor the dead and comfort the living by exaggerating virtue and hiding vice. A *Life*'s job is to teach the living by showing the truth of human nature.

  > *"I am not writing a panegyric, but a life. There is no need to record every fault, but when a man's nature is revealed by a failure, it should not be passed over in silence."*

  *   **Family Curation:** If the family (or the subject pre-death) flags material to be dropped, they are almost invariably acting to protect reputation or spare grief. They will remove the angry emails, the infidelities, the moments of cowardice.
  *   **Plutarch's Curation:** Plutarch *does* curate. He omits sordid details that don't reveal character (e.g., specific sexual scandals unless they show lack of self-control). But he never omits a *moral failure* if it explains the man's trajectory. He includes Alexander's murder of Cleitus (rage) and Coriolanus's arrogance.
  *   **The Verdict:** Your "Curated" tier risks becoming a **Panegyric**. If the curation is driven by "tribute," it removes the friction necessary for moral learning. You cannot learn how to navigate anger from a subject who never got angry. Plutarch would argue that a "Life" that hides the subject's struggles with vice is useless as a mirror, because the reader will not recognize their own reflection in a saint.

  ### 3. The Machine as Biographer
  This is your core engineering constraint: *"Could a life assembled by a machine, with judgement removed from selection, teach anyone anything at all?"*

  Plutarch would say **no**.

  For Plutarch, the biographer is not a stenographer; he is a **judge** and a **painter**. In *Pericles*, he compares the biographer to a painter who captures the likeness in the eyes and the expression of the face, rather than the exact proportions of the body.
  *   **Algorithmic Selection:** Your "Complete" tier selects threads based on metadata (time, frequency, location). This is logistical sorting, not moral weighing.
  *   **Moral Weighing:** Plutarch's selection is based on *phronesis* (practical wisdom). He chooses the anecdote where Caesar weeps at the statue of Alexander because it reveals *ambition*. An algorithm might choose the anecdote where Caesar crosses the Rubicon because it is a "high impact" event.
  *   **The Verdict:** Without a moral agent to decide *why* a piece of data is included, the resulting book is inert. It might be interesting, but it cannot be **edifying**. Plutarch's goal is *paraklesis* (exhortation). A machine cannot exhort. It can only display.

  ### 4. The Problem of the "Ordinary" Subject
  You note your customers are ordinary people, not generals. Does this matter to Plutarch?

  Yes, but perhaps not in the way you think. Plutarch writes about great men because their virtues and vices were scaled up to affect the fate of nations. However, in *Aemilius Paullus*, he suggests that virtue is the same in kind, regardless of scale.
  > *"Virtue shows itself no less in a private citizen than in a general."*

  However, Plutarch relies on **public action** to verify character. It is easy to claim you are patient in your diary; it is harder to prove it when commanding an army.
  *   **The Risk:** For an ordinary person, "digital residue" (chat logs, search history) is often a record of *interiority* without *action*. Plutarch might find this dangerous. A search history can suggest a thought, but Plutarch judges men by what they *did* with their thoughts.
  *   **The Verdict:** He might view a life built entirely on digital residue as a life of **potentiality**, not actuality. It shows what the person *felt* or *considered*, but rarely what they *accomplished* or *endured*. For Plutarch, character is forged in resistance. If the data only shows the person in their bedroom (digital space), the "Life" will lack the context of struggle required for moral instruction.

  ### Summary: Plutarch's Recommendation

  If Plutarch were on your design review, he would likely reject both tiers as currently conceived, but for different reasons:

  1.  **Reject "Complete" as a *Life*:** It is a **Chronicle**. It lacks the shaping intelligence required to turn data into character study. It is too noisy to be a mirror.
  2.  **Reject "Curated" as Truth:** It is a **Tribute**. It is driven by the desire to honor, which leads to flattery. Flattery, Plutarch warns, ruins the soul of the listener because it presents an impossible standard.

  **How to build a Plutarchan Product:**
  To satisfy his criteria, the product would need a third element: **The Biographer.**
  *   **Human-in-the-Loop:** The system cannot be fully automated. There must be a human editor (or a very sophisticated AI guided by explicit ethical constraints) whose job is not to "preserve everything" or "hide the bad," but to **select for character**.
  *   **The Prompt:** The instruction to the generator shouldn't be "Write a book about this person." It should be "Construct a narrative that reveals how this person handled fear, love, duty, and failure."
  *   **The Flaws:** The system must be instructed *not* to smooth over contradictions. If the chat logs show the subject was kind to friends but cruel to service workers, both must be presented. That tension *is* the Life.

  **Final Word:**
  Plutarch opens *Aemilius Paullus* by saying he undertakes these lives to **"adorn his own life"** and to **"fashion it in likeness to the virtues of these men."**

  If your product generates a book that makes the family say, "Yes, that is exactly how we remember him, perfect and kind," you have built a **Tomb**.
  If your product generates a book that makes the family say, "I see now where he struggled, and I see where I struggle too," you have built a **Life**.

  The machine cannot do the latter on its own. It requires the judgment you are trying to automate away.
