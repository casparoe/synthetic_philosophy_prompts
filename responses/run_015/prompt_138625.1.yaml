      *   *Strategy:* During the debrief, force the distinction between *predictive* uncertainty (I don't know what you will do) and *normative* uncertainty (I don't know what you *should* do). Ask: "If you meant doubling, is 32 *correct* or just *likely*?" If it's just likely, meaning collapses into prediction. If it's correct, what grounds it?

