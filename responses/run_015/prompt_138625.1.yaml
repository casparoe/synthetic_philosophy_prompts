      *   *Failure 4:* Running out of time. *Fix:* Hard stops on activities.

  8.  **Structuring the Debrief:**

      *   Map specific moments to the four key insights.
      *   Analyze the escape routes.
      *   Address the limitation (Normativity).

  9.  **Refining the "Three Positions" Poll:**

      *   1. Realism (Fact exists, we might be ignorant).
