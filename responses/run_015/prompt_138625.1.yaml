      *   *Phase 4: Community & Introspection (50-65):* Discussing how they *know* they meant doubling. Introduce the "another seminar" cards (Far-divergence).
      *   *Phase 5: The Poll & Debate (65-72):* The three positions.
      *   *Phase 6: Reveal & Debrief (72-80):* Forbidden words, mapping insights, limitations.

