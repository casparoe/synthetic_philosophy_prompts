  **Rule 2: The Actual Process Rule (Contribution)**
  An event $C$ causes an effect $E$ if and only if $C$ was an actualized event that physically contributed energy, matter, or information to the specific mechanism that produced $E$, provided $C$ was not preempted (blocked before entering the mechanism).
  *   *Constraint on Preemption:* If a mechanism discards $C$'s contribution (like the firmware in Case 3 or 4), $C$ is not a cause. If $C$ enters the system (like the cylinders in Case 2), it is a cause, even if redundant.
