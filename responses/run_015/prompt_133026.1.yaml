  The coloured tin of tea was always mine,
  But now I feel a missing, silent part,
  A static gathering low inside my head,
  My fingers fail to hold the spoon, to hold,
  The steam rises up, always the same,
  I try to speak but cannot find the voice.

  I hear the ending of your unfinished voice,
  The mug you left is technically not mine,
  I pour the brew exactly as the same,
  And feel you occupy a living part,
  My hands know how to hold what you hold,
  The thought completes itself inside my head.

  Is there enough of me left in this head?
  You weigh the silence like a steady voice,
  Saying the fingers are too weak to hold, to hold,
  Perhaps a quarter of what was once mine,
  That fraction counts as a significant part,
  Though the quality is never quite the same.

  The ritual proceeds exactly the same,
  A sense of pressure sitting in the head,
  Who acts the gesture is a minor part,
  The sentence finishes without a voice,
  The ownership dissolves, no longer mine,
  The fingers know exactly how to hold.

  Perhaps the muscles only learn to hold,
  A pattern that appears exactly the same,
  A simulation claiming to be mine,
  Computed silently within the head,
  It acts the role of every missing part,
  But is it real, or just an echoing voice?

  It does not matter which is which part,
  The loop is wide enough to hold, to hold,
  There is no need to identify the voice,
  The tea is poured and tastes the same,
  The warmth persists inside the quiet head,
  The life continues, though it is not mine.

  Who owns the part is less than the same,
  The loop will hold within the living head,
  A shared and graded echo, voice and mine.

  **Notes on the choices**

  The end-words (*mine, part, head, hold, same, voice*) were selected to satisfy the constraints while remaining neutral enough for both speakers. *Head* serves as the physical substrate, applicable to both Ray's dying biology and Marian's hosting cognition. *Hold* functions as both verb and noun, capturing the grip of the pattern and the physical act. *Mine* and *part* track the shifting ownership of the self.

  The voices alternate in stanzas one through three. Ray (S1, S3) is identified by the failing grip on the spoon and the internal static; Marian (S2) by the pouring of the brew and the completion of thoughts. The boundary dissolves in stanza four, where "the fingers" could belong to either, marking the convergence of the loop. By the envoi, the speaker is ontologically indeterminate.

  The envoi settles nothing regarding the metaphysical status of the survivor. It asserts the persistence of the pattern ("graded echo") without confirming whether this constitutes survival or mere simulation. The sestina's rotation forced a compromise in stanza six; the philosophical demand for ambiguity conflicted with the form's requirement to repeat *hold*. I prioritised the form, using the repetition to emphasise the mechanical persistence of the loop over the agent's intent. This reinforces the Hofstadterian view that the pattern persists regardless of the substrate's ownership. The pacing is designed for slow articulation, allowing the philosophical weight of each line to land within the allotted time.
