  The problem of unity asks why a proposition is not merely a list of constituents. If $a$ and $F$ are separate entities, what binds them into $F(a)$? Supplying a further relation $R$ to bind them yields $R(a, F)$, which itself requires binding, restarting the demand. Bradley uses this regress to argue relations are unreal, collapsing reality into a single substance. Russell feared it undermined his multiple-relation theory of judgement. Frege blocked it by declaring concepts unsaturated: they require completion by objects, needing no further glue.

  In your vocabulary, constituents are terms and types. The regress triggers upon reification. Consider a relation not as a type former `A → B → Type`, but as data:

  ```agda
  data Rel : Type where
    R : Rel
  interp : Rel → Type → Type → Type
  ```

  To construct the proposition, you need an application function:

  ```agda
  apply : (r : Rel) → A → B → Type
  apply r x y = interp r A B
  ```

  But `apply` is now a term requiring interpretation. You need `apply₂` to bind `apply` to its arguments, ad infinitum. The regress is the attempt to internalize the application rule as a term within the same universe.

  Ordinary dependent type theory stops this by making application primitive. The function type `A → B` is a type former, not a datatype. Application `f x` is a reduction rule, not a term constructor requiring evaluation by a further term. The cost is that unity is not representable inside the language; it is structural.

  Unity corresponds to the derivability of a judgement, `Γ ⊢ p : P`. It is a property of the derivation tree, not a term within it. When you treat a proposition as an object of an attitude, you must reify it: `quote : Type → Term`. But `quote` lives in the metatheory or a syntax universe. If you demand the judgement itself be a term (`Γ ⊢ j : Judgement`), you require a validator term, restarting the regress. Unity is the existence of a valid derivation, which cannot be fully internalized without losing canonicity.

  Universe hierarchies (`Type₀ : Type₁`) are benign infinities; every level is reached stratifiedly. Bradley's regress is vicious because it demands completion at the *same* ontological level. A ladder of `apply` operators at successive levels (`apply₀`, `apply₁`) corresponds to a stratified type theory, which solves the technical problem but changes the philosophical subject. Bradley demands immediate unity, not asymptotic approximation.

  Unsaturatedness maps cleanly to function types; a term of type `A → B` cannot stand alone. Distortion arises with truth versus inhabitation. In PLT, `¬P` is `P → ⊥`, but a false proposition isn't always empty in classical semantics, and truthmakers (facts) have no counterpart—types are norms, not worldly chunks. The monist conclusion has no encoding; type theory assumes plurality of contexts. The act of judging (force) is erased in the static derivation. Most critically, the demand to *explain* unity rather than legislate it vanishes. In formal systems, rules are primitive; you cannot derive application from something deeper without changing the kernel.

  The residue is not a defect of your vocabulary but a sign the original demand was a category mistake. Bradley asks for a term to do the work of a rule. My translation is largely dependent type theory taking Frege's side: application is a rule of the kernel, not a term. To express Bradley's conclusion, you would need a vocabulary where rules are first-class terms subject to further rules, without a trusted base layer—a fully reflective tower with no bottom. But such a system lacks normalization. Type theory solves the regress by refusing to reify the binder. It buys consistency by accepting Frege's unsaturatedness as axiom.
