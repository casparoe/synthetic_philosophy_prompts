answer: |-
  **The Game**

  **Title:** The Four-Option Coordination Game
  **Players:** 25 students (12 pairs, 1 trio).
  **Materials:** Payoff matrix on board, anonymous strategy slips, tally sheet.
  **Payoffs:** Symmetric normal-form game. Strategies: $A, B, C, D$. Points awarded to Row player (Column gets symmetric payoff).

  | | **A** | **B** | **C** | **D** |
  | :--- | :---: | :---: | :---: | :---: |
  | **A** | 0 | 4 | 1 | 5 |
  | **B** | 4 | 0 | 1 | 5 |
  | **C** | 1 | 1 | -2 | 5 |
  | **D** | -5 | -5 | -5 | -5 |

  **Rules:**
  1.  **Objective:** Maximize your total points over 8 rounds.
  2.  **Procedure:** In each round, write your choice ($A, B, C$, or $D$) on a slip. Pair up with a neighbor. Submit slips anonymously.
  3.  **Matching:** I will randomly pair slips within the class (or you play with a fixed partner, but submit anonymously to me). For this activity, fixed pairs are easier logistically, but aggregate data is pooled on the board.
  4.  **Feedback:** After each round, I will tally the class frequency of each strategy on the board. You see the distribution, not specific pair outcomes.
  5.  **Communication:** You may discuss strategy with your partner between rounds. No collusion across pairs.

  **Setup:** Project the matrix. Explain that $D$ is available but risky. Emphasize that payoffs are symmetric (if you play $A$ and partner plays $B$, you both get 4). Run 8 rounds total.

  **Round-by-Round Facilitation Plan**

  **Rounds 1–3 (Discovery):** Run standard play. Collect slips, tally frequencies on the board. Expect noise: some will play $D$ (greed for the 5), some $C$ (safety), some $A/B$. After Round 3, pause. Ask: "Look at the board. Is there any strategy here that is simply irrational?" Students should spot $D$ immediately (always -5 vs others' positive payoffs). Have the class vote to "ban" $D$ for the remaining rounds. This validates their existing knowledge of pure strict dominance.

  **Rounds 4–6 (The Wall):** Announce that $D$ is eliminated. Students now choose only $A, B, C$. Resume play. Watch the data. $A$ and $B$ will likely oscillate or split (coordination problem). Crucially, $C$ will persist. Why? Because against $A$, $C$ gets 1 (better than $A$'s 0). Against $B$, $C$ gets 1 (better than $B$'s 0). Students will argue $C$ is a "safe haven" against the $A/B$ conflict. They hit the wall: no *pure* strategy dominates $C$.

  **Round 7 (The Intervention):** Stop play. Do not reveal the solution yet. Ask: "Strategy $C$ is still surviving. Is it rational?" Let them debate. Then, draw a new column on the board: "Mix 50% A, 50% B." Calculate the expected payoff of this mix against $A$, $B$, and $C$ live on the board.
  *   vs $A$: $0.5(0) + 0.5(4) = 2$. ($C$ gets 1).
  *   vs $B$: $0.5(4) + 0.5(0) = 2$. ($C$ gets 1).
  *   vs $C$: $0.5(1) + 0.5(1) = 1$. ($C$ gets -2).
  Show that the mix strictly beats $C$ in every remaining scenario.

  **Round 8 (Verification):** Ask pairs to play one final round using only $A$ or $B$. Tally the results. The frequency of $C$ should drop to zero if they understand. Conclude the activity.

  **The Debrief**

  **1. Pure Dominance (The Warm-up):** Start by formalizing the elimination of $D$. Write the definition of strict dominance on the board. Show how $A$ (and $B$) yields a higher payoff than $D$ against every possible opponent strategy. This confirms their intuition from the first three rounds. This is Iterated Elimination of Strictly Dominated Strategies (IESDS), Step 1.

  **2. The Wall (The Puzzle):** Focus on the reduced game $\{A, B, C\}$. Ask students to check if $A$ dominates $C$. They will see that if the opponent plays $A$, $C$ yields 1 while $A$ yields 0. So $A$ does not dominate $C$. Same for $B$. This is the critical learning moment: **Pure strategy elimination is insufficient.** If we stopped here, we would incorrectly conclude $C$ is a rationalizable strategy.

  **3. Mixed Dominance (The Solution):** Walk through the calculation performed in Round 7. Define a mixed strategy $\sigma = (0.5, 0.5, 0)$. Show that $u(\sigma, s_{-i}) > u(C, s_{-i})$ for all $s_{-i} \in \{A, B, C\}$. Emphasize that dominance is about *expected utility*, not just realized outcomes. Even though $C$ beats $A$ and $B$ individually in head-to-head pure comparisons, it loses to the *average* performance of $A$ and $B$.

  **4. Formal Definition:** Write the formal definition of strict dominance by a mixed strategy. $\sigma_i$ strictly dominates $s_i'$ if $u_i(\sigma_i, s_{-i}) > u_i(s_i', s_{-i})$ for all $s_{-i}$. Highlight that this allows us to eliminate $C$ in Step 2 of IESDS.

  **5. Implications:** Conclude with the big picture. If we restrict IESDS to pure strategies, we leave rationalizable strategies on the board that should be removed. To fully solve a game via dominance, we *must* consider mixtures. This sets the stage for Nash Equilibrium, where mixed strategies are also essential.

  **What Goes Wrong**

  **1. Students cling to $C$:** Because $C$ yields a positive payoff (1) against $A$ and $B$, while $A$ and $B$ yield 0 against themselves, students view $C$ as "safe." They focus on minimizing regret rather than maximizing dominance.
  *   *Fix:* During the debrief, explicitly contrast "best response" (where $C$ wins against $A$) with "dominance" (where the Mix wins against everything).

  **2. Data Noise:** In a small class, random pairing might let a $C$-player get lucky against another $C$-player (though payoff is -2) or against a $D$-player (payoff 5).
  *   *Fix:* Remind them we are looking at *expected* payoffs, not single-round luck. Use the board calculation to override anecdotal wins.

  **3. Calculation Errors:** Students may struggle to compute expected values mentally.
  *   *Fix:* Do the math on the board together. Don't assume they can do $0.5(4)$ in their heads under pressure.

  **4. Collusion:** Pairs might agree to play $(A, A)$ or $(B, B)$ exclusively.
  *   *Fix:* Remind them this is non-cooperative. The goal is to find strategies that are robust against *any* opponent choice, not just their partner's.

  **What's Missing**

  This activity demonstrates *dominance*, not *equilibrium*. It doesn't teach them how to find the Mixed Strategy Nash Equilibrium (MSNE) where players actually randomize between $A$ and $B$ to make the opponent indifferent. It also doesn't cover continuous mixed strategies (probabilities other than 50/50). You will still need to lecture on best-response functions and the indifference principle to explain *why* players would mix in equilibrium, rather than just using mixing as a tool for elimination. Finally, it doesn't address weak dominance, which requires separate handling.
