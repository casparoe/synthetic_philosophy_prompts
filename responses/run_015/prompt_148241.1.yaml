      *   *Epistemology:* Fallibilism (we might be wrong). Dead dogma vs. living truth. The need to hear opposing views to understand the *grounds* of one's own belief.
      *   *Representative Government/Political Economy:* Competence matters. Plural voting (weighted by education) suggests he values expertise but fears elitism. He supports some state intervention for education and public goods but is wary of state control of opinion.
