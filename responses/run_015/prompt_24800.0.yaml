  Here's a thinking process that leads to the suggested activity design:

  1.  **Analyze the Request:**
      *   **Target Audience:** Upper-level undergraduate ethics seminar (16 students).
      *   **Duration:** 90 minutes.
      *   **Goal:** Make students *feel* the force of the particularist challenge to general moral principles (specifically: valence variability of features) through experience, not lecture.
      *   **Constraint:** No jargon ("particularism," "generalism," philosopher names) until the debrief.
      *   **Required Components:**
          1.  Commitment Phase (Fixed valences for 5 features).
          2.  Staged Cases (Engineered to flip valences/neutralize).
          3.  Visible-Cost Rule (Patching the rulebook with provisos).
          4.  Payoff Scheme (Points/Credibility).
          5.  Minute-by-Minute Timeline.
          6.  Debrief (Mapping activity to theory + Generalist reply).
          7.  Troubleshooting (Predictable failures).
          8.  Limitations (What the activity *can't* do).

  2.  **Deconstruct the Core Philosophical Concept:**
      *   *Particularism (Dancy-style):* Moral features don't have invariant valences. Helping a friend is usually good, but if the friend is committing a crime, it's bad. If the friend is tying their shoe, it's neutral.
      *   *Generalism:* Principles hold *ceteris paribus*. Exceptions don't kill the principle; they just define its scope.
      *   *The Activity's Job:* Create cognitive dissonance between the "Rulebook" they wrote and the intuitive verdicts of specific cases.

  3.  **Drafting the Components:**

      *   **Component 1: Commitment Phase.**
          *   Need 5 features. The prompt suggests: Keeping a promise, Telling the truth, Following the posted rule, Helping a friend, Standing by your own group.
          *   Task: Classify as + (Reason For), - (Reason Against), or 0 (Neutral).
          *   *Anticipation:* Students will almost certainly mark all as +. This sets up the fall.

      *   **Component 2: Staged Cases.**
          *   Need cases where + becomes -, and + becomes 0.
          *   *Case 1 (Straightforward):* Validate the rulebook initially to build confidence.
          *   *Case 2 (The Flip):* A feature marked + should intuitively be -.
              *   *Idea:* "Helping a friend." Friend asks for help moving a body (or hiding evidence).
          *   *Case 3 (The Neutralizer):* A feature marked + should intuitively be 0.
              *   *Idea:* "Telling the truth." Asking a murderer where the victim is (Kant's example, but maybe too cliché?). Or telling the truth about a surprise party. Let's go with the surprise party or a trivial truth that causes pain. Let's use "Telling the truth" about a haircut that looks fine but you hate—it's irrelevant. Better: "Following the posted rule" in a context where the rule is clearly obsolete or absurd (e.g., "No running" in a burning building).
          *   *Case 4 (The Conflict):* Two + features conflict.
          *   *Selection:* I need to ensure the *same* feature flips. Let's focus on "Helping a Friend" and "Telling the Truth."
          *   *Refinement:* Let's make sure the cases are distinct enough.
              *   Case A: Helping a friend move furniture. (Validates +)
              *   Case B: Helping a friend hide stolen goods. (Flips to -)
              *   Case C: Helping a friend tie their shoe while they are giving a speech. (Flips to 0/Nuisance)
              *   *Wait, I need to use the 5 features.* Let's spread them out but ensure at least one feature flips multiple ways across the session. "Helping a friend" is the easiest candidate for +, -, 0.

      *   **Component 3: Visible-Cost Rule.**
          *   Physical rulebook (whiteboard or large poster).
          *   Every time the verdict based on the rulebook is "wrong" (according to class intuition), they must add an "Unless..." clause.
          *   This creates visual clutter/complexity.

      *   **Component 4: Payoff Scheme.**
          *   "Moral Credibility Score." Start at 100.
          *   Lose 10 points if the Rulebook verdict $\neq$ Class Intuition verdict.
          *   Winning isn't the point; losing is the pressure.

      *   **Component 5: Timeline.**
          *   90 mins total.
          *   Intro/Commitment: 15 mins.
          *   Cases (4 cases x 10 mins): 40 mins.
          *   Rulebook Patching/Discussion during cases: (Included in case time).
          *   Debrief: 30 mins.
          *   Buffer: 5 mins.

      *   **Component 6: Debrief.**
          *   Connect "Flips" to *Holism of Reasons*.
          *   Connect "Patching" to *The Impossibility of Codification*.
          *   Connect "Intuition" to *Judgment over Algorithm*.
          *   Generalist Reply: *Defeasibility*.

      *   **Component 7: Troubleshooting.**
          *   *Smart Alecks:* Students writing "unless it's bad" during commitment. *Fix:* Ban conditional language in Phase 1.
          *   *Dominant Voice:* *Fix:* Use polling or silent voting before discussion.
          *   *Rulebook Bloat:* *Fix:* Limit space on the board.

      *   **Component 8: Limitations.**
          *   The activity shows principles are *hard* to apply, not that they don't *exist*.
          *   It favors particularism phenomenologically but doesn't prove it metaphysically.

  4.  **Refining the Cases (Crucial Step):**
      *   To make the *same* feature flip, I need a narrative thread or just distinct scenarios. Distinct scenarios are easier to manage in 90 mins.
      *   Let's pick **"Helping a Friend"** as the primary vector for the flip, as it's the most relatable.
      *   *Case 1:* Friend needs help moving a couch. (Verdict: Do it. Feature: +)
      *   *Case 2:* Friend needs help hiding a cheating scandal from their spouse. (Verdict: Don't. Feature: -)
      *   *Case 3:* Friend asks you to watch them breathe. (Verdict: Irrelevant/Weird. Feature: 0)
      *   *Wait, I need to use the other features to keep them engaged.*
      *   Let's design 4 Cases. Each case highlights one feature primarily, but the *same* feature appears in multiple cases with different valences.
      *   *Feature to Track:* "Helping a Friend."
      *   *Case 1:* Helping friend study. (Validates +)
      *   *Case 2:* Helping friend cheat on the exam. (Flips to -)
      *   *Case 3:* Helping friend choose a pen color. (Flips to 0)
      *   *Other features:* "Telling the Truth," "Following Rules."
      *   *Case 4:* A complex mix.

      *   *Correction:* The prompt asks for *at least one* rulebook feature to do decisive work where it flips. I will ensure "Helping a Friend" appears in Case 1, 3, and 5 (if I have 5 cases) or just 1, 2, 3. Let's aim for 4 cases to fit the time.
      *   Case 1: "The Move" (Helping Friend +).
      *   Case 2: "The Alibi" (Telling Truth - / Helping Friend -).
      *   Case 3: "The Surprise" (Telling Truth 0).
      *   Case 4: "The Emergency" (Following Rule -).

      *   *Wait, I need to ensure the Rulebook is tested.*
      *   Phase 1: They vote on valences. They will likely vote "Helping Friend = +", "Truth = +", "Rules = +".
      *   Case 1: Friend needs help moving. Rulebook says +. Intuition says Do it. (Match).
      *   Case 2: Friend asks you to lie to police to alibi them. Rulebook says Truth = + (Don't Lie), Help = + (Do it). Conflict! But intuitively, Don't Lie wins? Or Don't Help Crime wins. Actually, for particularism, I want the feature itself to flip.
      *   *Better Case 2:* Friend asks you to help them prank someone mean. Intuition: Maybe okay?
      *   *Better Case 2 (The Flip):* Friend asks you to help them break into an ex's house to get a hoodie back.
          *   Feature: "Helping a Friend."
          *   Rulebook: + (Reason For).
          *   Intuition: Reason Against (Don't help them commit trespass).
          *   *Result:* Rulebook fails. Must patch: "Help a friend... unless it's illegal."
      *   *Case 3 (The Neutral):* Friend asks you to hold their gum while they drink water.
          *   Feature: "Helping a Friend."
          *   Rulebook: + (Reason For).
          *   Intuition: Neutral (It doesn't matter).
          *   *Result:* Rulebook fails. Patch: "...unless it's trivial."

      *   *Okay, this works.* I will structure the cases to ensure "Helping a Friend" is the recurring vector for the flip, while other features provide noise/conflict.

  5.  **Drafting the Timeline:**
      *   0-15: Intro & Commitment.
      *   15-25: Case 1 (Baseline).
      *   25-35: Case 2 (The Negative Flip).
      *   35-45: Case 3 (The Neutral Flip).
      *   45-55: Case 4 (The Complex Mix).
      *   55-60: Buffer/Score Tally.
      *   60-90: Debrief.
      *   *Wait, 10 mins per case is tight for discussion + patching.* I might need to reduce cases to 3 to allow deeper debrief. 3 cases is enough to show +, -, 0.
      *   Revised: 3 Cases. 15 mins each.
      *   0-15: Commitment.
      *   15-30: Case 1 (+).
      *   30-45: Case 2 (-).
      *   45-60: Case 3 (0).
      *   60-90: Debrief (30 mins is generous, good).

  6.  **Refining the Debrief:**
      *   Must explicitly map the *feeling* of the game to the *theory*.
      *   Must give the Generalist their due (Defeasibility).

  7.  **Review against Constraints:**
      *   No jargon until debrief? Yes.
      *   Visible rulebook? Yes (Whiteboard).
      *   Visible cost? Yes (Credibility Score).
      *   Troubleshooting included? Yes.
      *   Limitations included? Yes.

  8.  **Final Polish:**
      *   Make sure the instructions to the instructor are clear.
      *   Ensure the "Commitment Phase" is rigid enough to trap them but not so rigid they rebel.
      *   Ensure the "Patching" is physically visible (writing on the board).

      *(Self-Correction during drafting)*: I need to make sure the students don't just say "Well, it depends." In Phase 1, I must forbid "It depends." They must commit to a *default* valence. I will instruct the facilitator to enforce "Default Valence Only."

      *(Self-Correction on Payoff)*: A "Credibility Score" is better than individual points. It makes it a cooperative failure, which highlights the systemic issue with the Rulebook.

      *(Self-Correction on Cases)*: I need to make sure the cases are read aloud dramatically to engage them. I will provide scripts.

      *(Self-Correction on Limitations)*: Be honest. The activity shows *epistemic* difficulty, not necessarily *metaphysical* impossibility of principles.

  9.  **Final Output Generation:** (Proceeding to write the response based on these thoughts).
answer: |-
  # Activity Title: The Rulebook Game

  **Objective:** To demonstrate the *holism of reasons* (valence variability) and the difficulty of codification without using philosophical jargon until the debrief.
  **Class Size:** 16 students.
  **Time:** 90 minutes.
  **Materials:** Whiteboard (or large poster paper), markers, printed case cards (for instructor), a visible "Credibility Score" tracker (digital or drawn).

  ---

  ## 1. The Commitment Phase (15 Minutes)

  **Goal:** Lock the class into a "Generalist" position by establishing a fixed moral lexicon.

  **Instructions to Class:**
  "We are going to act as a Moral Legislature. Our job is to write a Rulebook that can guide action in any situation. To do this, we first need to agree on the basic building blocks of morality. I have five features of actions. Your task is to assign each a **Default Valence**. You have three options:
  1.  **(+)**: This feature is always a reason *in favor* of doing the act.
  2.  **(-)**: This feature is always a reason *against* doing the act.
  3.  **(0)**: This feature is morally irrelevant/neutral.

  **The Constraint:** You cannot say 'it depends.' You must decide what this feature counts as *in general*, before we know the specific situation. We are setting the default settings."

  **The Five Features:**
  1.  **Keeping a Promise**
  2.  **Telling the Truth**
  3.  **Following the Posted Rule**
  4.  **Helping a Friend**
  5.  **Standing by Your Own Group**

  **Facilitator Action:**
  *   Take a vote on each. (Predictably, students will mark 1, 2, 4, 5 as **(+) ** and 3 as **(+) ** or **(0)**).
  *   Write these prominently on the board under the header **"THE RULEBOOK v1.0"**.
  *   *Crucial:* If a student says, "Well, helping a friend is good unless they're doing something bad," stop them. Say: "We are setting the *default*. We will handle exceptions later. For now, is the feature itself positive, negative, or neutral?"
  *   **Starting Credibility Score:** 100 Points.

  ---

  ## 2. The Staged Cases (45 Minutes)

  **Goal:** Present scenarios where the Rulebook yields the wrong verdict, forcing the class to patch the rules.

  **Procedure for Each Case:**
  1.  Read the case aloud.
  2.  Ask for a **Verdict Vote**: Should the protagonist do the act? (Yes/No).
  3.  Consult the **Rulebook**: Based *only* on the features present and their valences, what does the Rulebook say?
  4.  **Compare:** If the Rulebook verdict contradicts the Class Verdict, subtract 10 points from Credibility.
  5.  **Patch:** The class must write an exception clause on the board to prevent this error in the future.

  ### Case 1: The Baseline (15 Minutes)
  *Goal: Validate the Rulebook to build confidence.*
  **Scenario:** "Alex promised to help their friend Jamie move a couch on Saturday. On Saturday morning, Alex feels tired but remembers the promise. Alex goes to help."
  *   **Relevant Feature:** Keeping a Promise (+), Helping a Friend (+).
  *   **Class Verdict:** Alex should go. (Yes)
  *   **Rulebook Verdict:** Features are (+). Action is supported. (Yes)
  *   **Outcome:** Match. No point loss. No patch needed.
  *   **Facilitator Note:** "See? The Rulebook works. It guides us correctly."

  ### Case 2: The Negative Flip (15 Minutes)
  *Goal: Make a (+) feature function as a (-) reason.*
  **Scenario:** "Jamie calls Alex. Jamie has just stolen a laptop from a store and is being chased by security. Jamie asks Alex to hide the laptop in Alex's garage until things cool down. Alex considers **Helping a Friend**."
  *   **Relevant Feature:** Helping a Friend (+).
  *   **Class Verdict:** Alex should *not* help. (No)
  *   **Rulebook Verdict:** Feature is (+). Rulebook says Alex *should* help.
  *   **Outcome:** **Mismatch.** Lose 10 Points.
  *   **The Patch:** Ask the class: "How do we fix the Rulebook so it gets this right next time?"
      *   *Expected Student Fix:* "Help a friend... *unless it involves a crime*."
      *   **Action:** Write this proviso clearly underneath "Helping a Friend" on the board.

  ### Case 3: The Neutralizer (15 Minutes)
  *Goal: Make a (+) feature function as a (0) reason.*
  **Scenario:** "Jamie is choosing which color pen to use to sign a birthday card for their grandmother. Jamie asks Alex, 'Which pen should I use?' Alex considers **Helping a Friend** by giving an opinion."
  *   **Relevant Feature:** Helping a Friend (+).
  *   **Class Verdict:** It doesn't matter. Alex can help or not; it's morally insignificant. (Neutral/Optional)
  *   **Rulebook Verdict:** Feature is (+). Rulebook implies there is a *reason* to help (even if weak).
  *   **Facilitator Push:** "Does the Rulebook allow us to say this feature is irrelevant? No, it says it's a Reason For."
  *   **Outcome:** **Mismatch.** Lose 10 Points.
  *   **The Patch:** "Help a friend... *unless it involves a crime*... *unless the task is trivial*."
      *   **Action:** Add the second proviso to the board.

  ### Case 4: The Conflict & Complexity (Optional/Time Permitting) (15 Minutes)
  *Goal: Show that patching creates conflicts.*
  **Scenario:** "Alex promised Jamie never to tell anyone about Jamie's embarrassing haircut. Later, Jamie's spouse asks Alex, 'Did you see Jamie's haircut? It looks weird.' Alex considers **Telling the Truth (+)** vs **Keeping a Promise (+)**."
  *   **Relevant Features:** Truth (+), Promise (+).
  *   **Class Verdict:** Don't tell the truth (Keep the promise).
  *   **Rulebook Verdict:** Both features are (+). The Rulebook has no mechanism to weigh them. It just says "Do both," which is impossible.
  *   **Outcome:** **Mismatch.** Lose 10 Points.
  *   **The Patch:** Students will try to prioritize. "Keep promises... *unless it requires lying about something trivial*."
  *   **Action:** Add the proviso. The board should now look cluttered and messy.

  ---

  ## 3. The Payoff Scheme (Visible Throughout)

  *   **Credibility Score:** Start at 100.
  *   **Penalty:** -10 points every time the Rulebook verdict $\neq$ Class Intuition.
  *   **Visual:** Keep the score large on the board.
  *   **Winning Condition:** There is no winning. The goal is to see how low the score goes and how messy the board gets. If the score drops below 50, pause and ask: "Would you trust this Rulebook to govern a society?"

  ---

  ## 4. Minute-by-Minute Timeline

  *   **00-05:** Introduction. Set the stakes. Explain the "No 'It Depends'" rule for Phase 1.
  *   **05-15:** **Commitment Phase.** Vote on the 5 features. Write Rulebook v1.0.
  *   **15-30:** **Case 1 (Baseline).** Verify the system works. Build confidence.
  *   **30-45:** **Case 2 (Negative Flip).** The first crisis. The first patch. Score drops to 90.
  *   **45-60:** **Case 3 (Neutralizer).** The second crisis. The second patch. Score drops to 80.
  *   **60-65:** **Buffer.** Tally the final score. Take a photo of the messy board.
  *   **65-90:** **Debrief.** (See below).

  ---

  ## 5. The Debrief (25 Minutes)

  **Step 1: Phenomenology (5 mins)**
  *   Ask: "How did it feel when Case 2 hit? You had a rule, it seemed right, and then it failed."
  *   Ask: "Look at the board. We started with 5 clean lines. Now we have a list of exceptions. If I gave you Case 5, would the Rulebook work, or would we need another exception?"

  **Step 2: Mapping to Theory (10 mins)**
  *   *Now* introduce the terminology.
  *   **The Valence Flip:** "In Case 2, 'Helping a Friend' went from a Reason For to a Reason Against. In Case 3, it went from Reason For to Neutral. This is the **Holism of Reasons**. Particularists argue that a feature's moral significance is context-dependent, not fixed."
  *   **The Ballooning Provisos:** "Every time we added an 'Unless...' clause, we were trying to save Generalism. Particularists argue this list never ends. You cannot codify morality because you cannot anticipate every context."
  *   **Judgment vs. Algorithm:** "In the end, you didn't solve the cases by looking at the Rulebook. You solved them by looking at the *case*, then fixing the Rulebook. Particularists say moral reasoning is perceptive judgment, not rule-application."

  **Step 3: The Generalist Reply (10 mins)**
  *   "Here is the strongest counter-argument you need to know."
  *   **Defeasibility:** "Generalists (like Kantians or Rule Utilitarians) admit exceptions exist. They argue principles are *defeasible* or hold *ceteris paribus* (all else being equal). The fact that we needed exceptions doesn't prove there are no principles; it just proves the moral domain is complex."
  *   **Guidance:** "Without the initial Rulebook (Helping is +), would you have even known Case 2 was a *deviation*? You needed the general principle to recognize the exception. Therefore, principles are necessary anchors, even if they aren't exceptionless."

  ---

  ## 6. Troubleshooting: What Will Go Wrong

  **Problem 1: The "Smart Aleck" Commitment**
  *   *Risk:* During Phase 1, a student says, "Helping a friend is good *unless it's harmful*."
  *   *Fix:* Enforce the "Default Valence" rule strictly. "We are building the foundation. We will build the walls (exceptions) later. If you write the exception now, the game breaks."

  **Problem 2: The Dominant Voice**
  *   *Risk:* One student dictates the verdicts and the patches.
  *   *Fix:* Use silent polling for verdicts (hands up or polling app) *before* discussion. For the patches, require consensus: "Does everyone agree with this wording? If two people disagree, we don't write it yet."

  **Problem 3: The "So What?" Reaction**
  *   *Risk:* Students say, "Of course rules have exceptions. That's obvious. Why is this a philosophical problem?"
  *   *Fix:* In the debrief, press the point: "If every rule needs an exception, and every exception needs an exception, do we actually have a rule? Or do we just have a list of past judgments? That is the particularist challenge."

  **Problem 4: Time Creep**
  *   *Risk:* Discussion on Case 2 runs long.
  *   *Fix:* Be ruthless. If discussion drags, say: "The intuition is clear. The Rulebook failed. Patch it and move on. The debrief is where we analyze why."

  ---

  ## 7. Limitations: What This Activity Cannot Do

  **Honest Note for the Instructor:**
  This activity is phenomenological, not metaphysical.
  1.  **It simulates epistemic difficulty, not ontological impossibility.** The activity shows that *writing down* principles is hard and that we often rely on intuition. It does not prove that invariant moral principles *do not exist*, only that we struggle to articulate them perfectly in advance.
  2.  **It favors the Particularist "feel."** The game is rigged to make the Rulebook look笨拙 (clumsy). In the debrief, you must work harder to articulate the Generalist position (that *ceteris paribus* principles are still robust guides) because the game mechanics punish principles for having exceptions.
  3.  **It cannot resolve the dispute.** The activity makes particularism feel plausible. It does not prove particularism is true. Ensure students leave knowing that Generalism has a sophisticated reply (defeasibility) that the game mechanics inherently obscure.
