      *   *Where Arendt Hits a Wall:* She believed the liar ultimately depends on the truth they are hiding. The Liar's Dividend suggests the liar can destroy the *infrastructure* of truth so thoroughly that they no longer need a specific hidden truth to pivot around. They create epistemic chaos.
