  **U.S. DEPARTMENT OF TEMPORAL INTEGRITY**
  **Bureau of Diachronic Consent (BDC)**
  **Public Guidance Document 77-B: Frequently Asked Questions Regarding Retroactive Autonomy**

  **Q: Is the Advance Directive filed by my 25-year-old self legally binding on my 45-year-old body?**
  A: Yes. Under the Sovereignty of Originating Agent Act, the cognitive state at the time of initial filing (Time A) supersedes all subsequent modifications requested by the successor entity (Time B). The Bureau operates on the presumption that your 25-year-old self possessed maximum rational capacity. Any deviation from this plan by your 45-year-old self is considered a compliance violation. Please note that changes in preference, taste, or moral framework do not constitute valid grounds for revocation. If you signed Form 88-Z stating "No Jazz Music Ever," your 45-year-old self is prohibited from humming tunes in the shower.

  **Q: How can I prove my earlier self was incompetent due to youth or lack of data?**
  A: Competence is not determined by medical evaluation but by historical consistency. You must petition the **Family Precedent Tribunal**. This body applies common-law reasoning to your personal history. They will review affidavits from siblings, parents, or old roommates to establish if your 25-year-old self displayed a pattern of irrationality comparable to prior adjudicated cases. Be advised: the Tribunal often rules that "experimental phase" behaviors are protected expressions of autonomy. If your past self consistently chose poorly regarding partners or investments, the Tribunal may deem this a "stable preference structure," thereby locking those choices in permanently.

  **Q: What if I feel like a completely different person now?**
  A: Subjective feelings of discontinuity are irrelevant unless they meet the threshold for **Psychological Continuity Bankruptcy**. This clause is invoked only when memory loss exceeds 60% or when core value systems invert (e.g., a pacifist becoming a mercenary). Upon filing for Bankruptcy, your current legal personhood is suspended. You do not regain control; rather, a **Trustee Version** is appointed.

  **Q: Who is the Trustee Version?**
  A: The Trustee is usually a digital reconstruction of your 25-year-old self's idealized decision-making matrix. This Trustee holds fiduciary responsibility over your body and assets. They are mandated to act in the best interest of the person you *would have been* had you not drifted. In practice, this means the Trustee may liquidate your current assets to fund the education of your past self's hypothetical children, even if you are childless and happy.

  **Q: Can I appeal a Trustee decision?**
  A: Appeals must be filed by your past self. Since your past self is deceased or inaccessible, appeals are rarely procesed. Please ensure all forms are double-spaced and notorized by a witness who knew you in both centuries. Failure to comply may result in involuntary commitment to a Continuity Care Facility, where your preferences will be managed via algorithmic interpolation.

  **Q: Where do I submit my objection to being controlled by a ghost?**
  A: Objections to metaphysical hierarchy are not accepted. Submit Form 99-C (Acknowledgement of Temporal Subordination) to your local BDC field office. Do not fold the form. Folding implies a rejection of linear time.

