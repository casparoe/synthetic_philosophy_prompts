answer: |-
  1. **Is drift-tracking new?**
  It is not a standard named condition, but it is not conceptually isolated either. You have effectively reconstructed a specific version of an **integration condition based on metacognitive monitoring**. In the literature, there is a lot of talk about "trust" and "reliability," but those are usually static properties (the tool *is* reliable). Your move is dynamic: the subject must actively model the tool's *unreliability*. This shifts the focus from the tool's quality to the subject's management of the tool. You haven't renamed an existing term, but you have occupied a niche usually filled by discussions of "metacognitive feelings" or "epistemic vigilance." The novelty is insisting that *compensating for error* is the mark of incorporation, rather than *dependence on function*.

  2. **The weakest joint.**
  The circularity worry in your first problem is the structural weak point, and your repair ("ground it in the body") is the specific joint that will snap under pressure. You argue that the error profile doesn't need to be in the head; it can be in a logbook, eventually grounding in "habit" or "skilled coping." The problem is that **habit is just implicit memory.** To compensate for a specific drift (e.g., "add 8% in cold weather"), your body must encode that rule. If you say that encoding is "non-propositional," you are making a distinction without a difference: the body is still carrying the information load. If the body is carrying the information load, you haven't escaped the circle; you've just moved the memory from the hippocampus to the cerebellum. You still need a prior cognitive system to establish the habit of calibration. You cannot use calibration to define the boundary of the cognitive system if calibration itself requires a pre-existing cognitive system to manage the calibration.

  3. **Case (a): Reductio or shift?**
  It is an **unmarked shift of subject.** Your criterion tracks where the *work of error correction* is happening, not where the *agency* resides. When the firmware fixes the drift, the work shifts from you to the chip. By your definition, the cognitive system shrinks because *your* contribution to the error management decreases. This contradicts the intuition that better tools expand our capacities.
  *Consequence:* If you accept this shift, you are no longer arguing for the "Extended Mind" (Otto's mind is big); you are arguing for "Distributed Cognitive Systems" (there is a system here, and its boundaries move based on where the calibration work is done). This undermines the original parity principle's goal, which was to save the intuition that Otto *himself* is just as much a thinker as Inga. Your criterion suggests Otto is *less* of a thinker when his tools are perfect, which is a hard sell.

  4. **The "ground it in the body" move.**
  Confirming your suspicion: **It is hand-waving.** As noted in Q2, "skilled coping" is a black box that does the same work as memory without admitting it. To "notice when the pattern changes" (your own words) requires a comparison between current input and a stored model of expected input. If that model is in the "body," it is still a representation. Calling it "posture" or "habit" doesn't dissolve the regress; it just hides the representation in a place philosophers often treat as exempt from analysis. If the body can hold an error profile without it counting as internal memory, you need to explain why that isn't just internal memory by another name.

  5. **Case (c): Is the bloat avoidable?**
  It is avoidable, but not without a patch that risks looking gerrymandered. The difference between Otto's notebook and your fuel gauge is that the notebook stores **semantic content** (where the museum is), while the gauge provides **state information** (how much fuel is here). Your criterion treats both as "task T." To block the bloat without arbitrariness, you must restrict T to **epistemic tasks involving content retention**, not just successful action. You need to add a clause: *X is part of the system only if X functions as a store of information that persists independently of the immediate task.* The gauge resets; the notebook holds. If you add this, you block the gauge (it doesn't store, it indicates) but keep the notebook. Is that gerrymandered? Maybe. But without it, any tool you compensate for becomes part of your mind, which dilutes the thesis to meaninglessness.

  6. **Editorial.**
  *   **Most interesting:** The second paragraph (the calibration definition). The shift from "trust" to "error profile management" is genuinely fresh and leverages your background perfectly. It's the strongest philosophical move in the piece.
  *   **Flab to cut:** The deflationary thought at the end ("maybe the constitution question was never the interesting one"). It surrenders the ground you just fought for. You spent the essay building a criterion for constitution, then concluded by saying constitution doesn't matter. Cut the last paragraph. End on the strength of the calibration analogy, perhaps acknowledging that it changes *how* we count parts, not *whether* we count them.
  *   **Is the analogy a dead end?** No. It is a productive constraint that forces the debate away from spatial metaphors (inside/outside) and toward functional metaphors (managed/unmanaged).
