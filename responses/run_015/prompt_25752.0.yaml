answer: |-
  Your intuition is spot-on. You have identified the single biggest fault line in constitutional theory without even having read the literature. The argument your friend made is the standard "precommitment theory" of constitutionalism, but it is heavily contested, and Jon Elster—the scholar your friend likely encountered—is actually much more skeptical of the analogy than your friend implies.

  Here is a breakdown of what is right about your friend's summary, where it elides critical problems (specifically the one you sensed), and whether the conclusion about judicial review actually holds water.

  ### 1. What Your Friend Got Right
  Your friend accurately summarized the **logic of precommitment**. This argument is most famously associated with Stephen Holmes (in *Passions and Constraint*) and Cass Sunstein, though it draws on the philosophical groundwork of Jon Elster.

  *   **The Core Insight:** Democracies do face "time inconsistency" problems. A majority might vote today to protect property rights, but tomorrow, in a panic or fit of envy, vote to confiscate wealth. If investors know this is possible, they won't invest today. Therefore, binding the future can make the present more functional.
  *   **The Function of Rights:** In this view, rights aren't just moral trumps; they are functional guardrails. They prevent the democratic game from destroying the board.
  *   **Democracy as More Than Majoritarianism:** The friend is correct that many theorists define democracy not as "whatever 51% want right now," but as a system of self-government over time. If you drive your car off a cliff because you were distracted, that wasn't "freedom"; similarly, if a majority votes away its own ability to vote next time, that isn't "democracy."

  So, the descriptive part of your friend's argument—that constitutions *act* like Ulysses contracts—is a standard and respectable position in political science.

  ### 2. What Is Subtly (and Not So Subtly) Off
  This is where your intuition about "one person vs. a polity across generations" hits the nail on the head. In the literature, this is known as the **Problem of Intergenerational Identity** or the **"Dead Hand" Problem**.

  **A. Who is Ulysses?**
  In the myth, Ulysses binds Ulysses. It is the *same agent* at Time A binding the *same agent* at Time B.
  In constitutionalism, the Framers (Time A) bind the Citizens (Time B).
  *   **The Critique:** The people who wrote the Constitution are dead. The people living under it today never agreed to the deal. As Thomas Jefferson wrote to James Madison, "The earth belongs always to the living generation." If the past binds the present too tightly, it isn't self-government; it's rule by ancestors.
  *   **Elster's Actual View:** This is crucial. Your friend implies Elster supports this use of the analogy. In *Ulysses Unbound* (2000), Elster actually argues that the Ulysses analogy is **misleading** when applied to constitutions. He points out that for a precommitment to be rational, the agent must remain the same. Since a polity changes its composition (people die, new people are born, values shift), the "self" that is bound is not the "self" that did the binding. Elster suggests constitutions are less about "tying hands" and more about creating procedures that force deliberation.

  **B. Rationality vs. Preference**
  The Ulysses story assumes Ulysses was *right* to avoid the Sirens. He knew the Sirens were a trap.
  *   **The Critique:** What if the Framers were the ones under a spell? For example, the U.S. Constitution entrenched slavery and excluded women. Was that "rational precommitment" or was it prejudice? If we treat all constitutional entrenchments as "Ulysses contracts," we risk sanctifying past injustices as "rational constraints on passion." Sometimes the "passion" of the present (e.g., the Civil Rights Movement) is morally superior to the "calm reason" of the past (e.g., Segregationists).

  **C. The Motivation Problem**
  Ulysses tied himself because *he* wanted to survive.
  *   **The Critique:** Do elites write constitutions to protect "democracy," or to protect *themselves* from democracy? Public Choice theorists argue that constitutional rigidity often serves interest groups who want to lock in their privileges against future majorities.

  ### 3. Does the Conclusion About Judicial Review Follow?
  Your friend argues: *If constitutions are precommitments, we need judges with "real teeth" to enforce them.*
  This is the weakest link in the chain. Even if you accept the precommitment theory, strong judicial review does not necessarily follow.

  **A. Who Holds the Rope?**
  In the myth, the *crew* ties Ulysses. They are external enforcers.
  In the U.S. system, the *judges* are the enforcers. But who ties the judges?
  *   **The Counter-Argument:** If the danger is "momentary passion," why trust nine unelected lawyers to identify what is "passion" and what is "principle"? Jeremy Waldron (a major critic of judicial review) argues that allowing judges to strike down laws displaces the very democratic deliberation the constitution is supposed to protect. It assumes judges are the "rational self" and the legislature is the "passionate self," which is an empirically dubious claim.

  **B. Alternative Mechanisms**
  You can have precommitment without judicial supremacy.
  *   **Legislative Supermajorities:** You can require a 60% vote to change certain rights. This binds the majority but keeps the power within the elected body.
  *   **Sunset Clauses:** Constitutions could expire every 20 years (as Jefferson suggested), forcing re-ratification. This preserves the precommitment benefit while solving the "Dead Hand" problem.
  *   **Weak-Form Review:** Systems like in the UK or Canada allow courts to flag rights violations but let the legislature have the final say. This acknowledges the precommitment value without handing final authority to the judiciary.

  ### 4. Summary of the Debate
  Your friend is arguing for what is called **Constitutional Precommitment Theory**.
  You are intuitively arguing for **Democratic Constitutionalism** or **Popular Sovereignty**.

  *   **Friend's strength:** Highlights that unrestrained majoritarianism can be self-destructive.
  *   **Your strength:** Highlights that binding future generations violates the core democratic principle that the living should govern themselves.

  ### 5. Reading Recommendations
  If you want to arm yourself for the next round, here are the specific texts that map onto this debate:

  1.  **Jon Elster, *Ulysses Unbound* (2000):** Specifically the chapters on constitutionalism. Elster will validate your suspicion that the analogy breaks down when applied to collectives over time.
  2.  **Stephen Holmes, *Passions and Constraint* (1995):** This is likely the book your friend read (or one very similar). Holmes is more sympathetic to the precommitment view than Elster. It's the best defense of your friend's position.
  3.  **Jeremy Waldron, *Law and Disagreement* (1999):** The definitive critique of judicial review. Waldron argues that rights are best protected by democratic legislatures, not courts.
  4.  **Thomas Jefferson, "Letter to James Madison" (1789):** The classic "Dead Hand" argument. Jefferson argues no constitution should last longer than 19 years (the length of a generation).

  ### The Verdict
  Your friend's summary is a **fair representation of the *argument* for precommitment**, but it is **not a fair representation of Elster's *critique* of that argument.**

  He is smoothing over the "Identity Problem" (the fact that the polity changes over time) and making a leap from "precommitment is good" to "judicial review is the only way to do it." Your intuition that there is a "big difference between one person binding themselves and a whole polity binding itself across generations" is exactly the argument that keeps constitutional theorists up at night. You don't need to apologize for feeling that the analogy was "too neat"—it is designed to be.
