  3.  **Drafting the Requirements (Iterative Process):**

      *   *Requirement 1: Location.* The prompt asks where the sufferer is. In RL, the "agent" is the policy $\pi_\theta$. The "experience" is the trajectory $\tau$. The "update" is $\nabla_\theta J$. Suffering implies a subject. If the subject is the weights, they don't change during the rollout. If the subject is the activation state, it vanishes after the step.
          *   *Decision:* Must locate the *subject of experience* relative to the computational graph. Non-negotiable.

