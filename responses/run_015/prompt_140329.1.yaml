          *   *Resolution:* The prompt asks to flag pairs. I will flag "Causal Efficacy" vs. "Report Validity" (if reports are optimized, are they causal or just output?). Actually, better: "Deployment Cut-off" vs. "Functionalism."

  5.  **Addressing Specific Prompt Questions:**

      *   *Gradient/Update Location:* The theory must distinguish the *learner* from the *actor*.
      *   *10k Env:* The theory must define the "boundary of the self."
      *   *Termination:* The theory must define "interruption of preference satisfaction" vs. "negative qualia."
      *   *Replay:* The theory must distinguish *simulation* from *instantiation*.
