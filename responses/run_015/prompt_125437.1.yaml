answer: |-
  1. "What's right"
  The core definition is standard: revealed preference theory treats utility as an ordinal ranking derived from observed choices, not a measurable psychological state. The statement about the Weak Axiom of Revealed Preference (WARP) is technically sound; if choices are consistent, economists can construct a utility function rationalizing those choices. This sidesteps measuring happiness directly. A defender would agree that, within this model, preference is defined entirely by action, making the theory empirically grounded rather than introspective. It correctly identifies that utility functions are mathematical representations, not physical entities.

  2. "Where it slips"
  The summary conflates "decision utility" (what drives choice) with "experienced utility" (actual satisfaction). Modern behavioral economics distinguishes these; you can choose something that doesn't make you happy due to self-control issues. The text also misuses "irrational." If choices obey WARP, they are definitionally rational within the model; saying someone looks "irrational from the outside" contradicts the axiom's purpose. Regarding your dog: technically, if her button-pushing is consistent, economists *would* assign her a utility function. The theory doesn't require human consciousness, only consistent maximization. Your intuition is right, though: applying this to humans ignores introspection. The text claims there is "nothing more to a preference than that," which is an ontological overstatement. Revealed preference is a methodological assumption, not necessarily a fact about the human soul. It treats internal conflict as invisible data. By defining preference solely as choice, the theory makes itself unfalsifiable regarding internal conflict, turning a methodological tool into a philosophical claim about human nature. This hides the difference between wanting something now versus wanting to want something later. Furthermore, the claim that this makes utility "testable" assumes preferences remain stable over time, which the summary ignores. If your preferences shift daily, the axiom fails, yet the text presents consistency as a given rather than a very strict condition.

  3. "The two consequences"
  The weakness-of-will claim follows logically only if you accept the definition that preference *equals* choice. A defender would say your hockey struggle wasn't "weakness" but a conflict between two different utility functions (e.g., present-self vs. future-self). At the exact moment of skipping, the "present-self" won. They wouldn't call it sentimentality; they'd call it a time-inconsistency problem. The policy claim is stronger. If welfare is defined strictly by revealed choice, paternalism is unjustified because you cannot know someone is better off doing something they didn't choose. However, many economists reject this strict view, arguing that mistakes happen. So, the consequence follows from the theory's assumptions, but those assumptions are contested when applied to real-world welfare judgments. The textbook presents a specific, hardline interpretation as universal truth, ignoring literature on behavioral welfare economics that allows for policy interventions based on cognitive errors.

  4. "Bottom line"
  You can use this for the basic definition of revealed preference, but not for welfare or psychology. It presents a specific, behaviorist strand of economics as the whole truth. Instead, write that standard theory *models* agents as if they maximize utility based on choices, but acknowledge that behavioral economics challenges this by separating choice from well-being.
