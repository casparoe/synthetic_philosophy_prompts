prompt: |-
  Ok so I have this thing going on with that ai chatbot I use for studying and I can't tell if I'm imagining it. I'm a senior and I've been using it mostly for ap psych, and I noticed that if I just ask it for the answer to a practice question it'll confidently give me the wrong one, like every single time. But if I write out a multiple choice with the right answer in there, it picks the right one almost always. And it gets weirder: if I ask it to list its top two candidate answers instead of just picking one, the right one shows up like 8 out of 10 times, even though when I make it pick just a single answer it goes with the other one. And the explanation it gives for the wrong answer is fluently wrong, like it's definately not confused at all, it's just constructing a justification after the fact.

  My friend says I'm projecting and it's just a word prediction machine so it doesn't actually know anything, and I should stop treating it like a broken oracle. But I feel like there's a real difference between it having the answer in there but failing to output it, and it not having the answer at all, and I can't tell wich one I'm looking at. Is there a name for this? And is there a way to actually figure out what it knows so I can use it to study, or is the whole thing just noise and I should go back to the textbook? My exam is in like three weeks so I'd really like to know if this is a tool I can work with or if I'm just going to end up studying the wrong stuff.
reasoning: |-
