      *   **Task:** Audit the analogy. Map the terms (offer, acceptance, etc.). Identify break points. Determine if break points threaten the conclusion. Suggest better analogies if needed. Be blunt if framing is confused. American English.
      *   **Key Concerns:** Enforcement/remedies differences, ongoing/revocable nature of consent, third-party/tech distortion (interpreter case), settled list of facts/signing moment issue.

  2.  **Deconstruct the "Consent as Contract" Analogy:**
      *   *Mapping:*
          *   Offer: Proposal of act (surgery/date).
          *   Acceptance: Agreement (signature/verbal yes).
          *   Consideration: Exchange (health/pleasure for risk/exposure). *Weak point.*
          *   Capacity: Competence to understand.
          *   Duress/Undue Influence: Coercion.
          *   Material Misrepresentation: Lie about core facts.
          *   Void/Voidable: Invalid consent.
          *   Remedies: Damages vs. Moral/Legal Wrong (battery/rape).
      *   *Break Points:*
          *   **Revocability:** Contracts bind; consent is revocable mid-act.
          *   **Remedies:** Contract = damages; Consent violation = bodily autonomy violation (often criminal or tortious battery).
          *   **Consideration:** Contracts need exchange; consent is often unilateral permission.
          *   **The "Meeting of Minds":** In the interpreter case, it's a communication breakdown, not necessarily a lie. Contract law handles mistake differently than fraud.
          *   **Scope:** Contracts cover future performance; consent covers immediate bodily integrity.
          *   **Standardization:** Contracts often have fine print; consent requires specific informed understanding.

  3.  **Evaluate the Conclusion ("Material Lie = No Consent"):**
      *   Does the analogy support this? Yes, contract law voids agreements based on material fraud.
      *   Does the conclusion survive without the analogy? Yes, but the *reasoning* shifts from "breach of bargain" to "violation of autonomy."
      *   *Crucial Distinction:* In contract, fraud makes the *deal* voidable. In consent, fraud makes the *act* a violation (battery/trespass). The stakes are higher.
      *   *The Interpreter Case:* This isn't fraud (intent to deceive). It's mistake/negligence. Contract law has "mutual mistake," but consent law focuses on *informed* consent. If the info wasn't received, consent wasn't informed, regardless of intent.
      *   *The Dating Case:* Fraud in the inducement (marital status) vs. fraud in the factum (nature of the act). Contract law distinguishes these; Consent law struggles with them (e.g., is lying about sterilization rape?).

  4.  **Identify the "Wrong Place to Start" Aspect:**
      *   The user asks if the contract framing is the wrong place to start.
      *   *Verdict:* It's a useful heuristic for *validity conditions* (capacity, info, voluntariness) but dangerous for *remedies* and *ongoing nature*. It risks commodifying the body.
      *   *Better Analogy:* **License/Permission.** Or **Bailment.** Or **Sovereignty.**
      *   *Best Fit:* **License to Trespass.** This captures the revocability, the specific scope, and the consequence of exceeding scope (trespass/battery rather than breach of contract).

  5.  **Drafting the Response (Iterative Process):**

      *   *Tone:* Professional, direct, journalistic, slightly academic but accessible. "Blunt where confused."
      *   *Section 1: The Audit (Mapping).* Go through the requested terms (Offer, Acceptance, Consideration, etc.). Be honest about where the map is fuzzy.
      *   *Section 2: The Break Points.* Address the user's specific tripping points (revocability, remedies, interpreter/tech, settled facts). Categorize them as "Fatal" or "Decorative."
      *   *Section 3: The Conclusion.* Does "Material Lie = No Consent" hold? Yes, but not because of contract law. It holds because of *autonomy*. Distinguish Fraud in the Factum vs. Inducement.
      *   *Section 4: Better Analogies.* Propose "License to Trespass." Explain why it fits better (revocable, scope-limited, violation = trespass not breach).
      *   *Section 5: The Interpreter Nuance.* This is key. It's not fraud; it's failed transmission. Contract "Mistake" vs. Medical "Informed Consent."
      *   *Section 6: Final Verdict.* Is contract the wrong start? It's a "training wheel" analogy. Good for structure, bad for soul.

  6.  **Refining the Content (Self-Correction during drafting):**
      *   *Correction:* Make sure to distinguish between the hospital case (negligence/tech failure) and the dating case (intentional fraud). The contract analogy handles fraud well but handles tech failure poorly (mistake vs. misrepresentation).
      *   *Correction:* Be careful with "Consideration." In consent, there isn't always a bargain. Sometimes it's just permission. This is a major break point.
      *   *Correction:* The "Signing Moment" issue. Contracts rely on the signature; consent relies on the ongoing state of mind. Emphasize the *process* vs. *event* distinction.
      *   *Refinement on "Material":* In contract, "material" is about the bargain. In consent, "material" is about the risk to the body/self.
      *   *Refinement on Remedies:* Contract = money. Consent violation = bodily integrity (often criminal). This is the biggest danger of the analogy. It lowers the stakes.

  7.  **Final Polish:** Check American English spelling. Ensure the "blunt" requirement is met without being rude. Ensure the structure is logical for a journalist looking to rewrite a draft. (The "License/Trespass" analogy is the strongest alternative).

  8.  **Final Review against constraints:**
