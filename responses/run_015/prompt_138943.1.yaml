  Your defense is technically watertight but normatively vulnerable because it preserves Good's Theorem only by stipulating that preferences over belief states are defects, which begs the question against the legitimate values underpinning the "right not to know."

  Regarding the doctor case, you are correctly identifying a violation of the theorem's assumptions rather than a failure of the logic: if acquiring knowledge triggers a professional duty that constrains your action set, the menu is not unchanged, and the signal is not "free" in the required sense. However, dismissing this as mere "relabelling" understates the normative cost; it confines the theorem's prescriptive force to vacuum-sealed decisions, stripping it of relevance in social or institutional contexts where knowledge constitutively alters obligations. This is not a logical flaw in the theorem, but it limits the "ought" you can derive from it for real-world agents embedded in normative structures.

  The triviality worry is well-founded but misdiagnosed: the problem is not that the theorem applies only to perfect agents, but that your defense makes it true by definition. If an agent avoids information to preserve tranquility, you can model this as a psychological cost (where the theorem holds and info has negative net value) or as a preference defect (where the theorem holds and the agent is irrational). By insisting on the latter, you are not defending the theorem's depth but enforcing a specific conception of rationality where utility is defined solely over material outcomes. This collapses your normative claim into "agents should not have preferences over beliefs," which is a substantive ethical stance, not a theorematic consequence.

  Ranking the defeaters, the claim that preferences over news are "defects" is fatal to your normative extension, while the doctor case and empirical anomalies are merely awkward constraints on scope. The empirical literature on information avoidance shows agents often avoid info to manage anticipated regret or coping costs; you can write this off as irrational updating only if you assume emotional management is not a legitimate component of well-being. You should feel the pressure of the empirical literature not because it disproves the math, but because it suggests your definition of "defect" is too narrow to capture rational human agency, leaving your normative claim insulated from refutation but devoid of practical guidance.
