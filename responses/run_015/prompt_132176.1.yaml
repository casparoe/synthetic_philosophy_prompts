answer: |-
  The protocol described presupposes a sophisticated, albeit often implicit, epistemology of historical inference. It navigates the tension between the desire for broad statistical generalisation (the Outside View) and the recognition of unique contextual factors (the Inside View). The explicit exclusion of analogues with discontinuous technological or ecological regimes, while permitting analogues with profound chronological and cultural distances, reveals specific commitments regarding the ontology of historical kinds and the nature of causal similarity.

  ### Philosophical Commitments: Induction and Ontology

  The practice is most coherently reconstructed as a **Causal-Mechanist account of reference classes**, underpinned by a moderate **Structural Realism**.

  **1. Rejection of Pure Humean Regularity**
  A strict Humean regularity theory posits that causation is nothing more than constant conjunction. If the protocol were purely Humean, the exclusion of discontinuous analogues would be difficult to justify solely on ontological grounds; one would simply observe that the conjunction of 'autonomous weapons' and 'conflict' has no historical frequency. However, the protocol permits analogies to the Peloponnesian War, where the 'constant conjunction' of specific material conditions is equally absent. This implies that analysts are not merely counting occurrences but are making claims about underlying generative mechanisms. They assume that 'hegemonic rivalry' possesses a causal essence that persists across triremes and drones, whereas 'military revolution mediated by autonomy' does not persist across pre-industrial and digital substrates. Thus, the practice rejects the Humean view that all regularities are ontologically flat; instead, it hierarchises them based on causal depth.

  **2. Beyond Goodmanian Entrenchment**
  Does the exclusion rule presuppose a Goodman-style claim regarding projectible predicates? Nelson Goodman argued that only predicates anchored in entrenched linguistic habits (resistant to *grue*-like projections) are valid for induction. The protocol's exclusion of discontinuous regimes resembles this, but with a crucial divergence: it admits ancient historical analogues (e.g., the Spanish Habsburgs) which are *not* entrenched in the modern analyst's immediate experience in the way contemporary technological predicates are.
  Therefore, the commitment is not merely linguistic or habit-based. It is not that 'pre-industrial' is an unentrenched predicate, but that it is causally inert regarding specific mechanisms. The protocol assumes that projectibility depends on **causal homogeneity**, not just linguistic entrenchment. The exclusion rule functions as a filter to ensure that the reference class is not causally heterogeneous. It presupposes that radical technological discontinuity alters the causal powers of the actors involved, thereby changing the 'natural kind' of the situation.

  **3. Structural Realism and Ontological Boundaries**
  The permission to compare modern rivalries with the Peloponnesian War suggests a Structural Realist ontology (akin to Waltzian neorealism), where the ordering principle of the system (anarchy) and the functional similarity of units (states seeking survival) constitute the 'real' historical kind, transcending material substrate. However, the exclusion of discontinuous technological analogues introduces a caveat: material substrate is not always epiphenomenal. When technology fundamentally alters the mechanism of interaction (e.g., removing human decision loops via autonomous systems), the structural continuity is broken.
  Consequently, the exclusion clause is not merely a hidden tractability filter (a pragmatic admission that modelling is too hard); it is an **ontological boundary**. It asserts that there are limits to structural isomorphism. To treat a drone swarm as causally equivalent to a phalanx would be a category error, not just a modelling difficulty.

  ### The Counterfactual: Substrate-Independent Structuralism

  If the underlying philosophical view were replaced by one treating structural analogies as equally projectible regardless of technological substrate (a form of Radical Structuralism or Platonism regarding social forms), the forecasting protocol would require significant reconstruction.

  **1. Changes to Scoring Rules**
  Current scoring rules (e.g., Brier scores) likely penalise false positives heavily, incentivising conservative reference classes. Under a substrate-independent view, the definition of a 'hit' would shift. Accuracy would no longer be measured solely against the material outcome but against the **structural fidelity** of the prediction.
  *   *Change:* Scoring would need to incorporate a 'structural weight'. A prediction might be deemed successful if the structural dynamic (e.g., 'escalation spiral') occurred, even if the material manifestation differed from the historical analogue.
  *   *Change:* Calibration metrics would need to account for higher variance. If the reference class is broadened to include technologically discontinuous cases, the base-rate frequency becomes noisier. Scoring rules would need to normalise for this increased entropy, perhaps rewarding 'directional accuracy' over precise probabilistic calibration.

  **2. Weighting of Inside-View Adjustments**
  In the current protocol, the Inside View is used to adjust the base rate derived from the 'safe' reference class. It accounts for the unique technological features that the Outside View ignored.
  *   *Change:* If the Outside View already encompasses discontinuous substrates, the Inside View's role diminishes regarding material specifics. Its weight would shift from 'adjusting for technological novelty' to 'adjusting for contextual noise'.
  *   *Change:* The adjustment process would become more theoretical and less empirical. Analysts would spend less time gathering data on specific weapon systems and more time mapping abstract game-theoretic isomorphisms. The weighting might shift to favour the Inside View *less*, as the Outside View is now deemed more comprehensive, or *more*, to correct for the over-abstraction of the broadened reference class.

  **3. Institutional Incentives**
  Currently, incentives favour defensibility. An analyst can justify a Peloponnesian analogy because it is a standard 'entrenched' comparison in the literature.
  *   *Change:* Incentives would shift towards **pattern recognition** and **theoretical innovation**. Analysts would be rewarded for identifying deep structural commonalities between seemingly disparate epochs (e.g., comparing algorithmic trading crashes to 17th-century tulip manias).
  *   *Risk:* This creates a perverse incentive to find structures where none exist (apophenia). Institutional safeguards would need to move from 'checking the reference class admissibility' to 'auditing the structural mapping logic'.

  ### Underdetermined Elements

  Even with this philosophical shift, certain elements of the practice would remain underdetermined:

  1.  **The Definition of 'Structure':** Whether one adopts the current protocol or the substrate-independent view, the criterion for what constitutes a 'structural similarity' remains underdetermined. Is the structure of a conflict defined by the distribution of power, the nature of communication, or the economic mode of production? The protocol does not solve the problem of **aspectual shape**; it merely shifts where the boundary is drawn.
  2.  **The Base-Rate Derivation:** Expanding the reference class to include discontinuous regimes makes the calculation of base-rate frequencies statistically precarious. How does one weigh a single instance of AI-mediated conflict against ten instances of industrial war? The protocol leaves the **weighting scheme for heterogeneous reference classes** underdetermined.
  3.  **The Role of Agency:** Both views struggle with the ontology of human agency. If structures are projectible across substrates, does human choice matter? The protocol does not specify how to integrate the 'Inside View' of individual leadership when the 'Outside View' claims structural determinism across millennia.

  ### Conclusion

  The existing forecasting protocol presupposes a **Causal-Mechanist ontology** constrained by **Structural Realism**. It treats historical kinds as real but fragile, existing only where generative mechanisms remain stable. The exclusion of discontinuous analogues is an ontological claim that material substrate can constitute causal essence, not merely a pragmatic filter for tractability. Shifting to a substrate-independent view would require transforming the institution from a risk-averse validator of historical frequencies into a theoretical laboratory for structural isomorphism, necessitating new scoring metrics that reward structural insight over material calibration, while leaving the fundamental problem of defining 'structure' itself persistently underdetermined.
