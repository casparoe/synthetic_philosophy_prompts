answer: |-
  Hi there,

  I hear your frustration, and you are right to ask for the spec before buying the product. The literature on moral uncertainty is often guilty of solving the problem it wants to have rather than the one you actually face, which is standing in front of a lever with conflicting intuitions and needing to move your hand. If we are designing a decision procedure for a one-off high-stakes case that outputs an action rather than a verdict on subjective rightness, there are specific hurdles the account must clear. First, you need Option Set Coherence. You mentioned cases where one theory says you may lie and another says lying is not an option at all. A workable procedure cannot let the metaphysics of one theory veto the physical possibility of an act for the whole deliberation, or you end up with no common choice set to compare. The procedure must define the available acts independently of the moral theories, perhaps treating the claim that an act is unavailable as a claim that its choice-worthiness is undefined or infinitely negative, but it must keep the act on the table for calculation. Second, you need Intertheoretic Comparability. This is the classic measurement problem. If you are ninety percent utilitarian and ten percent deontologist, and the deontologist says rights are lexical constraints that cannot be traded off, you cannot simply multiply credence by value unless you have a common currency. The procedure must either normalize values across theories or use a voting mechanism that respects lexical thresholds without paralysis. Third, you need Anti-Fanaticism. This addresses the case where a theory you barely believe in threatens to swamp the calculation because it assigns astronomical stakes. Fourth is Epistemic Stability. The procedure must not recommend adopting beliefs or ignoring evidence simply because a moral theory tells you that doing so maximizes choice-worthiness. You cannot allow a theory to self-seal by manipulating the credences that constrain it. Fifth is Meta-Normative Stability. You are uncertain about the first-order theories and the procedure for handling that uncertainty. The account must avoid an infinite regress where you need a third-order theory to choose the second-order procedure. It needs a fixed point or a pragmatic stopper. Finally, you need Ex Post Normative Clarity. The procedure must tell you what happens to blame and regret if you follow it but the objective truth turns out to be different. If the procedure is action-guiding, it should generally offer a safe harbor against blame for adhering to it, otherwise it fails to guide action in high-stakes environments where fear of blame distorts decision-making.

  Now we have to separate the non-negotiable requirements from the prejudices of specific camps. Option Set Coherence and Epistemic Stability are non-negotiable for any procedure that claims to be practical. If you cannot define the options or if your beliefs are hijacked by the theories you are weighing, you are not deciding at all. Ex Post Normative Clarity is also essential because a procedure that leaves you vulnerable to blame despite perfect adherence is useless for an agent who cares about their moral standing. Intertheoretic Comparability is often treated as non-negotiable by maximizers, but it is where many camps diverge; however, without some solution here, no calculation can proceed, so it is functionally required even if the solution is to deny comparability and use a different mechanism like voting. The real friction point is Anti-Fanaticism. This is where you have to drop a demand. You cannot have both proper sensitivity to small credences in enormous-stakes theories and any immunity at all to being blackmailed by a view you basically do not believe. These two desiderata are logically incompatible under expected choice-worthiness maximization. If you maximize expected value, you must be sensitive to tiny probabilities of infinite value. If you want immunity to fanaticism, you must depart from strict expected value maximization, perhaps by bounding utility or using risk-weighted norms. For someone who actually has to choose in the real world, you should drop the demand for strict sensitivity to small credences in enormous-stakes theories. That demand is a prejudice of idealized rationality that ignores the computational and practical vulnerability of the agent. Anti-fanaticism is a requirement for survivability, even if it violates strict expected utility theory.

  Regarding the regress problem of Meta-Normative Stability, most accounts fail here, but it is not necessarily an incompatibility so much as a design flaw. You can solve this by adopting a fixed meta-norm, such as maximizing expected choice-worthiness relative to your current credences in both first-order and second-order theories, treating the procedure itself as just another object of uncertainty. However, the genuine impossibility result lies in the fanaticism case. You cannot satisfy the demand for expected value maximization and the demand for anti-fanaticism simultaneously. One must go, and as noted, practical agency requires sacrificing the former. As for which single requirement knocks out the most contenders, it is Intertheoretic Comparability. Most proposed procedures assume we can map deontological constraints and utilitarian outcomes onto a single scale, and once you realize that rights views often deny this cardinality explicitly, the simplest and most popular models of moral uncertainty collapse immediately because they have no unit of measurement to multiply by your credence.

  I hope this gives you the filter you need to cut through the papers.

  Best,
  Your Assistant
