answer: |-
  Right, so you're spot on to feel that something's off with the standard Ruth Chang line. Her view is tidy, isn't it? She says hard choices happen because reasons run out. You've got option A and option B, neither is better, neither is worse, and they're not equal. They're just on different scales. So, she says, you use your will to commit to one, and that commitment creates the reason where there wasn't one before. It's very empowering, very 'you make your own meaning'.

  But your intuition about the musician versus the surgeon cuts deeper than that. It's not just that the scales are different; it's that putting them on the same scale breaks the weights. Let's call this value leakage.

  Here's the thing: values aren't these solid, immutable bricks you can stack up. They're more like gases—they expand to fill the container you put them in. When you keep artistic freedom and saving lives in their separate rooms, they make sense. Art is about expression, medicine is about duty. But the moment you drag them into the same room to weigh them against each other, they start leaking into one another. Suddenly, artistic freedom isn't just 'expression'; in the shadow of saving lives, it starts looking self-indulgent. It leaks frivolity. Conversely, saving lives isn't just 'duty'; in the light of artistic freedom, it starts looking like a grim, mechanical burden. It leaks oppression.

  This is what I mean by comparative contamination. The act of comparison isn't neutral. It's corrosive. Chang assumes the values stay stable while the reasons run out. But if the values themselves distort the moment you try to compare them, then the whole rational weighing process is epistemically broken. You can't trust the output because the input got corrupted during the calculation.

  If that's right, then Chang's solution—rational commitment—is the wrong tool for the job. You can't just 'will' a reason into existence when the landscape you're willing upon is shifting under your feet. Commitment assumes you're planting a flag on solid ground. But if value leakage is real, the ground is marshland. Trying to commit rationally is just forcing a coherence that isn't there.

  So, how do you choose if you can't weigh and you shouldn't just commit? You look at momentum. You go with narrative inertia.

  Think of your life as a story you're already telling yourself. You're not a blank slate standing at a crossroads; you're a character mid-chapter. When a hard choice hits, don't ask 'which is objectively better?' because we've established that question breaks the values. Ask 'which path requires the least rewriting of the chapters I've already written?'

  If you've spent ten years seeing yourself as someone who fixes things, choosing the surgeon path doesn't require much narrative revision. It flows. Choosing the musician path would require you to retroactively reinterpret a decade of your identity, which is costly and unstable. Narrative inertia isn't about what's 'best' in a vacuum; it's about minimising the cognitive dissonance of becoming a different person overnight. It's pragmatic rather than rationalist. You're not solving the value conflict; you're bypassing it by sticking to the trajectory you're already on.

  This avoids the trap of trying to weigh the unweighable. It accepts that hard choices are often clashes of identity, not just clashes of value. And since identity is sticky, let the stickiness decide. It's not glamorous, but it's stable. Chang wants you to be the author of your values; I'm suggesting you're mostly just the editor, and sometimes the best edit is the one that changes the least.

