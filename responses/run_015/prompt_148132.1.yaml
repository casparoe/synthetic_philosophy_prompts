answer: |-
  Imagine a physical duplicate of yourself standing across the room, atom-for-atom identical in neural wiring and functional organization. The scenario imposes an **Indexical Reference Constraint**: any concept of "experience" or "consciousness" you employ during the thought experiment is stipulated to refer indexically to your own current first-person perspective (like "here" or "now"), while all descriptions of the duplicate are restricted to third-person structural data (neural firing, behavioral outputs). You are asked to conceive of the duplicate's physical state obtaining while your indexical consciousness remains solely with you. This setup ensures you can clearly visualize the physical machinery operating without *your* experience attached to it, creating a vivid gap between the structural description of the twin and the phenomenal description of the self.

  (1) The dualist argues that the ease of conceiving this scenario suggests metaphysical possibility. If the physical facts can obtain without the phenomenal facts (even if indexed), then consciousness isn't logically supervenient on the physical. The conceivability of the twin's body existing without *your* consciousness attached implies that consciousness is a distinct ontological ingredient that can be subtracted from the physical substrate.

  (2) The physicalist uses the Indexical Reference Constraint to block this inference without appealing to brute physics. They argue you haven't conceived of the twin lacking *its* consciousness; you've conceived of the twin lacking *yours*. Since phenomenal concepts function indexically, it is trivially true that another body isn't "me." The conceivability arises from the conceptual framework mandated by the scenario, not from ontological distinctness. The gap is linguistic, not metaphysical.

  (3) If we strip away the constraint, the case reverts to the standard zombie argument. You would have to conceive of the twin lacking *its* experience, which leads to contradiction (imagining an experience that isn't experienced) or forces the physicalist to assert brute identity without explaining the conceptual gap. The specific work of the feature is to localize the gap to the mode of reference rather than the properties referred to.

  A dualist would attack this setup by claiming it smuggles in a physicalist assumption about the nature of concepts. They would argue that we possess a neutral, non-indexical concept of "qualia" that applies to any subject, and your constraint artificially severs this to protect physicalism. By stipulating that phenomenal terms refer only to the self, you are begging the question against the dualist who claims those terms refer to non-physical properties inherent to the system itself.

  Verdict: Indexical Reference Constraint
