answer: |-
  **Benefactor Risk Calibration Instrument (BRCI-7)**
  **Issuing Authority:** The Longview Endowment Trust
  **Revision:** 4.2 (2023 Calibration Cohort)

  **Preamble**
  Pursuant to the Fiduciary Standards for Existential Endowments (Section 403(b)), all grantmaking allocations must align with the Benefactor's global risk attitude. This instrument isolates your risk-weighting parameter from the local curvature of your utility function. Please note: per the 2021 Calibration Cohort, modest risk aversion over small stakes is mathematically consistent with aggressive risk-seeking over existential stakes, provided the Buchak-Stebbins Transform is applied correctly. This questionnaire sets the global dial; it does not measure local preferences.

  **Section A: Risk-Weighting Preferences**

  1. **Small-Stakes Calibration:** You are offered a 50/50 gamble: lose $100 or gain $110. You decline. At what minimum gain would you accept this loss risk?
     a) $105  b) $125  c) $200  d) Any finite amount implies infinite risk aversion.

  2. **Large-Stakes Consistency:** Based on Q1, if you decline the above gamble at all wealth levels, you implicitly reject a 50/50 chance to lose $1,000 or gain any finite sum. Do you acknowledge this implication?
     a) Yes  b) No  c) Irrelevant to existential grantmaking.

  3. **Probability Weighting:** Choose between: (A) 100% chance to save 1 million lives; (B) 10% chance to save 12 million lives.
     a) Option A  b) Option B  c) Depends on the weighting function applied to the 10%.

  4. **Pascalian Bounds:** Choose between: (A) 100% chance to save 1 million lives; (B) 1 in 10^9 chance to save 10^20 lives.
     a) Option A  b) Option B  c) Option B, assuming value is bounded below 10^20.

  5. **Tail Thickness:** The impact distribution of AI safety grants is heavy-tailed. Please select the tail index (α) for your portfolio.
     a) α = 1.5  b) α = 2.0  c) As calibrated in 2021 (α = 1.8).

  6. **Sequential Exposure:** Do you view this grant as a one-off decision or part of a repeated sequence where ruin is absorbing?
     a) One-off  b) Repeated  c) Subject to Continuity Clause 14(b).

  7. **Clause 14(b) Acknowledgement:** If repeated betting applies, maximizing geometric growth rate supersedes expected utility. Do you waive this objection?
     a) Yes  b) No  c) Waiver assumed upon signature.

  8. **Model Uncertainty:** You cannot estimate the probability of success for existential risk reduction. How do you weight this uncertainty?
     a) Uniform prior  b) Jeffreys prior  c) As written in the 2021 Calibration document.

  9. **Fanaticism Control:** To prevent fanaticism, we apply a risk-weighting function rather than bounding utility. Do you agree this solves the problem?
     a) Yes  b) No  c) It moves the problem to the weighting function.

  10. **Global Parameter:** Your answers determine a single parameter *r* applied to all civilizational bets. Are you comfortable that small-stakes intuitions pin down *r*?
      a) Yes  b) No  c) It is the only available dial.

  **Scoring Rubric**
  Answers are weighted using the *Stebbins Risk Transform*. Selecting (a) in Q1 combined with (b) in Q4 yields a "Moderate Existential Seeker" profile. Note: Selecting (c) in Q5 overrides empirical data with the 2021 Calibration. Clients who acknowledge the Rabin calibration implication (Q2) but select aggressive large-stakes options (Q4) are flagged for "Theoretical Incoherence" but approved for funding.

  **Worked Example**
  Client A selects (a) for Q1 and (b) for Q4. Client B selects (b) for Q1 and (b) for Q4. Despite identical large-stakes preferences, Client A receives 10% of the allocation of Client B due to the global risk parameter derived from small-stakes curvature. This demonstrates the instrument's sensitivity to the distinction between local utility and global weighting.

  **Profile Determination**
  Based on your responses, your Global Risk Attitude is classified as **Calibrated Moderate**. This means the Fund will apply a risk-weighting function that downweights low-probability, high-impact outcomes unless they exceed the 2021 Calibration bounds. You have successfully waived ergodic objections via Clause 14(b). Your risk attitude is now an explicit, tunable parameter, ensuring that fanaticism is managed by calibration rather than utility curvature. Please sign below to authorize the application of this parameter to all future civilizational budgets.

  ***

  **Afterword**
  Two fair hits: The Rabin calibration point (Q1/Q2) correctly notes that expected utility theory links small and large stakes tightly, making separate "risk attitudes" suspicious. The ergodic objection (Q6/Q7) is also valid; maximizing static expectation in repeated games with ruin is irrational.

  One strawman: Suggesting probability weighting alone solves Pascal's Mugging (Q9) without boundedness. Defenders argue weighting *does* dampen extreme probabilities sufficiently without bounding value.

  The surviving objection: Model uncertainty (Q5/Q8). Treating a guessed tail index as data doesn't solve the problem of unknown distributions; it merely hides the guess behind a parameter. No formalism can calibrate away ignorance of the tail's shape.
