  *(Self-Correction Note)*: I must be careful not to conflate "nudging" too broadly. Standard nudging keeps the "right to be wrong." Huxley's world removes the "right to be wrong" by removing the desire to be wrong. I need to make this distinction sharp. Mond's argument is that the "right to be wrong" is the right to be miserable, which he forbids not by law, but by biology.

