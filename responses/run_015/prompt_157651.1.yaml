  Here's a bit written for that specific seminar crowd. It leans into the "editorial latency" and the retroactive nature of the experience.

  ***

  **Title:** The Open Mic at the Occipital Lobe
  **Performer:** A Competing Narrative Draft

  "I'm having a nightmare with my timing lately. I think it's the editorial latency.

  I walk up to the mic, I tell a punchline, and… nothing. Dead silence. Just the hum of parallel processing in the back. I'm standing there sweating, thinking, 'I'm bombing. The homunculus is bored. The little guy in the Cartesian Theater is checking his watch.'

  But then, four hundred milliseconds later? *Roar.* Place goes wild.

  I ask the stage manager what the deal was. He says, 'Look, there's no front row. There's no one watching the show in real-time. You told the joke to a bunch of parallel streams. Draft 4 thought it was offensive. Draft 7 thought it was funny. Draft 9 just overwrote Draft 4's silence with Draft 7's laughter and backdated the timestamp.'

  So I'm not actually hearing a reaction. I'm hearing a revision.

  It gets worse. I asked for a recording of the set. They told me there is no master tape. There's just the final cut. I said, 'But did they laugh *when* I said the joke?'

  He said, 'Define "when." By the time the narrative got to the consciousness desk, the laugh track was already spliced into the stimulus. For all intents and purposes, you killed. But technically? You're still waiting for the edit on the setup.'

  I realized then I'm not a comedian. I'm a rumor that keeps getting edited until it believes itself.

  So if I pause too long tonight… don't worry. I'm not forgetting the line. I'm just waiting for a later draft to decide I actually said it."
