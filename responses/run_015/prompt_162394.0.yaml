answer: |-
  Here is a six-node decision tree designed for character consistency. Every branch point is an observable action or line of dialogue suitable for a two-hander scene. Following the path will land you on one of the three required epistemological positions (or a recognized variant).

  ### The Epistemic Casting Tree

  **Start:** The argument has stalled. Both characters are tired. Both know the other is smart. Neither can find a logical flaw in the other's position.

  #### Node 1: The Domain Shift (Required Branch)
  **The Test:** The argument pivots from an objective fact (e.g., a shared bank balance, a broken engine) to a matter of taste or politics (e.g., how to raise a child, which candidate to support).
  **The Branch:** Does the character's physical posture or tone change?
  *   **YES (They soften/lean back):** They treat values as subjective. → *Go to Node 2.*
  *   **NO (They stay rigid/lean in):** They treat values as facts. → *Go to Node 3.*

  #### Node 2: The Blessing (Permissivism Filter)
  **The Test:** The character maintains their own view on the "taste/politics" issue but acknowledges the stalemate.
  **The Branch:** Do they validate the other's rationality while holding fast?
  *   **YES (e.g., "You're not crazy, we just want different things"):** → **LEAF A: The Permissivist.**
  *   **NO (e.g., "Fine, be wrong, I don't care"):** → *Go to Node 5.*

  #### Node 3: The Black Box (Required Branch)
  **The Test:** The other person says, "I have one piece of information I can't show you, but it changes the math." (One extra bit of un-inspectable info).
  **The Branch:** Does the character move their position (even slightly)?
  *   **YES (e.g., "Okay, if you know something I don't..."):** → *Go to Node 4.*
  *   **NO (e.g., "Then you can't prove it, so it doesn't count"):** → *Go to Node 5.*

  #### Node 4: The Split (Conciliationism Filter)
  **The Test:** Having acknowledged the hidden info, the character must decide on an action.
  **The Branch:** Do they propose splitting the difference?
  *   **YES (e.g., "Let's meet in the middle"):** → **LEAF B: The Equal-Weight Conciliationist.**
  *   **NO (e.g., "Tell me the info or we do it my way"):** → **LEAF C: The Deferential Steadfast (Variant).**

  #### Node 5: The Magic 8-Ball (Required Branch)
  **The Test:** The other person admits, "I got here via a hunch/dream/tradition" (an unreliable route the character thinks is flawed).
  **The Branch:** Does the character reject the conclusion based on the method?
  *   **YES (e.g., "That's not a reason, that's a feeling"):** → *Go to Node 6.*
  *   **NO (e.g., "It worked, so it's valid"):** → **LEAF C: The Deferential Steadfast (Variant).**

  #### Node 6: The Halo Effect (Required Branch)
  **The Test:** The other person cites their expertise in a *different* field (e.g., a composer arguing about finance).
  **The Branch:** Does the character grant authority based on that credential?
  *   **YES (e.g., "You're the professor, you decide"):** → **LEAF C: The Deferential Steadfast (Variant).**
  *   **NO (e.g., "That's music, this is money"):** → **LEAF D: The Total-Evidence Steadfast.**

  ---

  ### The Leaves (Character Archetypes)

  **LEAF A: The Permissivist**
  *   **Epistemology:** Rationality allows for multiple correct responses to the same evidence, especially in values.
  *   **Scene Behavior:** They stop trying to convert the other person. They pour a drink, change the subject, or agree to disagree without resentment. They hold their ground but disarm their weapons.
  *   **Key Line:** "I think I'm right, and I think you're allowed to think you are."

  **LEAF B: The Equal-Weight Conciliationist**
  *   **Epistemology:** Peer disagreement is itself evidence that I might be wrong. Confidence should be lowered significantly.
  *   **Scene Behavior:** They look for the compromise. They are willing to sacrifice being "right" for being "aligned." They check their own certainty when the other pushes back.
  *   **Key Line:** "If we both looked at the same data and see different things, the truth is probably in the middle."

  **LEAF C: The Deferential Steadfast (Variant)**
  *   **Epistemology:** Inconsistent. They hold fast on their own reasoning but defer to external markers (authority, hidden info) without integrating them logically.
  *   **Scene Behavior:** They are stubborn about *process* but easily bullied by *status* or *secrets*. They can be manipulated by bluffing ("I know something you don't").
  *   **Key Line:** "I don't agree with your logic, but if *you* say it's so, I'll do it."

  **LEAF D: The Total-Evidence Steadfast**
  *   **Epistemology:** My reasoning + the fact that you disagree = I am still likely right. Disagreement is just noise.
  *   **Scene Behavior:** They do not compromise. They do not validate the other's view. They continue to argue until the other converts or the scene ends in rupture. They silo expertise (a doctor's opinion on money is worth nothing).
  *   **Key Line:** "I've weighed the evidence. You have too. We came to different conclusions. I'm sticking with mine."

  ---

  ### Philosophical Flags for the Writer

  #### 1. Indistinguishable Leaves (The "Action" Problem)
  **Leaf A (Permissivist) vs. Leaf D (Steadfast)**
  *   **The Issue:** In a scene where a binary choice *must* be made immediately (e.g., "Steer left or right or we crash"), these two characters look identical. Both will steer left (their chosen path).
  *   **The Fix:** You can only tell them apart in the *aftermath*. The Steadfast character will say, "Good thing I steered, you were wrong." The Permissivist will say, "We're alive. That's what matters," acknowledging the other's fear was valid even if the action wasn't taken.

  #### 2. The Impossible Combination (The "Martyr" Paradox)
  **The Combination:** A character who answers **NO** at Node 3 (Refuses to move on hidden info/Steadfast epistemology) but **YES** at Node 4 (Proposes splitting the difference/Conciliationist action).
  *   **Why nobody holds this:** This creates a character who says, "I know you are wrong and I am right, therefore let's do half of what you want."
  *   **The Reason:** Conciliationism is driven by *doubt*. If they refuse to move on hidden info (Node 3), they have no doubt. If they have no doubt, compromising is not an epistemic stance; it is merely appeasement or pity. If you want this character, you must write them as manipulative or exhausted, not philosophically consistent.

  #### 3. The "Different Field" Trap (Node 6)
  **Dramatization Note:** Be careful with Node 6. If your character is a **Conciliationist (Leaf B)**, they should theoretically answer **YES** here (deferring to expertise). If they answer **NO**, they are claiming that *peer status* matters more than *expert status*, which is a specific, rarer philosophical stance (Radical Egalitarianism). For most standard Conciliationists, expertise should trigger deference.

  ### Usage Tip
  To keep the character consistent without narration, track their **Node 3** reaction.
  *   If they fold on the "hidden info" once, they must fold on it in Chapter 10.
  *   If they call the bluff in Chapter 2, they must call it in Chapter 10.
  This creates a subconscious rhythm for the reader: *Ah, this is a character who demands receipts,* or *Ah, this is a character who trusts people.*
