  Hey — I need someone to settle an argument, and I figure you're the right kind of person for it: please answer as if you were a statistician who also does philosophy of science, the sort who has refereed for methods journals on both the frequentist and the Bayesian side of this fight. Take your time, brainstorm a bit before you commit to anything, and don't just tell me what the textbook says. Context: I'm a first-year PhD student in cognitive psychology, our department has more or less split into two camps over the replication mess, and I keep getting pulled both ways and can't tell which moves in their argument are actually good. The case they always argue over: a classic between-subjects priming study run at n = 40 per cell that reported d = 0.50, p = 0.028; then a preregistered multi-lab replication with roughly thirty times the total sample (about 1,200 per group) that lands at d = 0.02 with a 95% CI of about [-0.06, 0.10]. Assume for the sake of argument that this is representative, i.e. in this literature something like two thirds of replication effect estimates fall outside the original paper's 95% CI. Marta is in camp A, Devin is in camp B, and last week they went five rounds in the seminar room while I sat there uselessly:

  (1) Marta: that original p = 0.028 was reported as if it were evidence for the effect, but feed the same data into a Bayes factor with any halfway sane prior on effect size and you get something that barely moves the needle — a p-value just under .05 is much weaker evidence than everyone behaves like it is, and there's even the thing where a fixed p-value turns into evidence *against* the point null as n grows. That gap is a large part of why the literature doesn't hold up. (2) Devin: possibly, but that's a complaint about how people read p-values, not about the machinery. The actual cause is selection plus low power. Run Bayes factors through the same publication filter and you'd get an equally broken literature, because journals select results, not estimators. (3) Marta: not equally broken. The prior is precisely the place where you can encode 'effects in this area are probably small,' so an honest Bayesian shrinks toward zero automatically, whereas your CI is built out of the data in front of you and gets bloated by the significance filter — anything that clears the bar at n = 40 per cell is systematically too large, and the smaller the true effect the worse the exaggeration. Also, for the replication itself I have an actual answer to 'did it replicate': score the replication data against what the original study predicted instead of just pointing out that the replication's own p is above .05. (4) Devin: that move tests the replication against a prediction that's already contaminated — if the original estimate was inflated by selection, then a real-but-smaller effect gets recorded as a failure, so you've laundered the bias rather than removed it. And your 'honest prior' cuts both ways, since the prior is exactly where an enthusiast smuggles the effect back in, while error rates are at least checkable in principle by an auditor who sees the whole run of studies. (5) Marta: checkable by nobody in practice, though. The guarantee attaches to a procedure applied to *every* analysis, and what gets published is a biased sample of its outputs, so the advertised error rate gets spent by selection and never shows up anywhere a reader can see it — good long-run properties go in, and a literature of overconfident claims comes out; I call it evidential laundering. My Bayesian output is auditable one study at a time, conditional on a prior we can argue about in public.

  I don't want to be told which camp to join — I want the exchange adjudicated. Give me exactly five numbered items, one per move, no intro and no conclusion, a sentence or two each: rate every move on a scale from clearly mistaken / more wrong than right / half right / more right than wrong / clearly right, say exactly which part of the move survives and why, and don't split the difference out of politeness — if a move is straightforwardly wrong, say so plainly. In item five, after your verdict on Marta's last move, add one sentence on what you think both of them are missing (I have a hunch it's something about decisions and losses, or about whether 'the effect' is even a single quantity across labs, but you tell me) and one sentence on what would change your verdict — which argument, or which fact about the numbers above, would make you flip. Also flag anywhere you're reasoning from a premise that's contested rather than from something both camps would grant. Sorry if this is definately more than you bargained for.
