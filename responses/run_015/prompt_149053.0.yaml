answer: |-
  ### Brainstorming Mechanics

  I considered three mechanical approaches for this session. First, **Human Light Cones**, where students stand at events and hold strings representing light signals. I rejected this because it prioritizes causal connectivity (which students already grasp) over planes of simultaneity (the philosophical pivot), and it becomes kinetically chaotic with 18 students in a fixed time. Second, **Card Sorting**, where teams sort event cards into "Past/Present/Future" piles based on frame assignments. I rejected this because it is too disembodied; it fails to utilize the floor space to physicalize the geometric necessity of the "jump" during acceleration, and it makes the transitivity problem abstract rather than spatial. I chose **The Tape-and-String Slicing** because it turns the Minkowski diagram into a navigable terrain. By physically laying strings across the diagram, students feel the rigidity of the geometry; when the turnaround team pivots their string, the "slice of now" visibly sweeps across distant events, making the Rietdijk–Putnam conclusion feel like a physical discovery rather than a logical trick.

  ---

  ### The Activity: "The Slice of Now"

  **Preparation (Before Students Arrive)**
  1.  **The Floor Diagram:** Use masking tape to create a Cartesian grid on the clear floor area.
      *   **Vertical Axis (Time):** 0 to 20 units. Mark every 2 units.
      *   **Horizontal Axis (Space):** -2 to 12 units. Mark every 2 units. Earth is at $x=0$. Andromeda is at $x=10$.
      *   **Light Cones:** Use dashed tape to draw 45-degree lines from the origin $(0,0)$ and from key events to visualize signal delays.
  2.  **Event Cards:** Print 15 index cards. Pin them to the floor at the coordinates below. Each card has two sides:
      *   **Front:** Event Name, Coordinates $(t, x)$, Type (Earth/Ship/Andromeda).
      *   **Back:** "Observed at Earth $t=$" (Calculated as $t + |x|$).
  3.  **Team Kits:** 6 envelopes. Each contains:
      *   One ball of bright string (different color per team).
      *   One set of 10 "Ontology Chips" (poker chips or printed cards).
      *   One Ledger Sheet (grid of Event IDs vs. Status: Past/Present/Future).
      *   One Frame Card (secret instruction on velocity).
  4.  **Whiteboard:** Divide into three sections: "Wager Standings," "The Chain," "The Global Table."

  #### One. The Stage: Event Coordinates

  Use units where $c=1$ (1 space unit = 1 time unit). Light cones are at 45°.

  | ID | Name | Location | Coords $(t, x)$ | Relation to Earth $t=10$ | Observed at Earth ($t+x$) |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | **E1** | Module Start | Earth | $(0, 0)$ | Timelike Past | 0 |
  | **E2** | Coffee Spill | Earth | $(5, 0)$ | Timelike Past | 5 |
  | **E3** | **Seminar Now** | **Earth** | **$(10, 0)$** | **Reference** | **10** |
  | **E4** | Bell Rings | Earth | $(15, 0)$ | Timelike Future | 15 |
  | **E5** | Module End | Earth | $(20, 0)$ | Timelike Future | 20 |
  | **S1** | Ship Launch | Ship | $(0, 1)$ | Spacelike to E3 | 1 |
  | **S2** | Engine Check | Ship | $(5, 3)$ | Spacelike to E3 | 8 |
  | **S3** | Turnaround Pt | Ship | $(10, 5)$ | Spacelike to E3 | 15 |
  | **S4** | Signal Sent | Ship | $(15, 3)$ | Spacelike to E3 | 18 |
  | **S5** | Ship Return | Ship | $(20, 1)$ | Timelike Future | 21 |
  | **A1** | Andromeda Birth | Andromeda | $(0, 10)$ | Spacelike to E3 | 10 |
  | **A2** | Fleet Launch | Andromeda | $(5, 10)$ | Spacelike to E3 | 15 |
  | **A3** | **Invade Decision** | **Andromeda** | **$(10, 10)$** | **Spacelike to E3** | **20** |
  | **A4** | Fleet Arrival | Andromeda | $(15, 10)$ | Spacelike to E3 | 25 |
  | **A5** | Andromeda End | Andromeda | $(20, 10)$ | Spacelike Future | 30 |

  *Instruction:* Tell students the spatial scale is compressed for the room, but the causal geometry (light cones) is mathematically exact.

  #### Two. Roles: Frames and Tilts

  Assign one team to each Frame. They must lay their string across the diagram to represent "Events happening Now" (Simultaneity Line).
  *   **Geometry Rule:** In this diagram ($t$ vertical, $x$ horizontal), a line of simultaneity for velocity $v$ has slope $v$ (rise/run = $\Delta t/\Delta x$).
  *   **Team 1 (Rest):** $v=0$. String is **Horizontal**.
  *   **Team 2 (Slow Out):** $v=0.3$. String tilts **Up 3 units for every 10 across**.
  *   **Team 3 (Fast Out):** $v=0.6$. String tilts **Up 6 units for every 10 across**.
  *   **Team 4 (Slow In):** $v=-0.3$. String tilts **Down 3 units for every 10 across**.
  *   **Team 5 (Fast In):** $v=-0.6$. String tilts **Down 6 units for every 10 across**.
  *   **Team 6 (Turnaround):** Starts as **Fast Out** ($v=0.6$). At Round 3, they must pivot to **Fast In** ($v=-0.6$) anchored at Event **S3**.

  *Instructor Note:* Pre-cut string lengths to span the diagram. Provide a "Tilt Key" card to Teams 2-5 so they can check their angle against the grid lines without doing math.

  #### Three. The Rounds (55 Minutes)

  **Round 1: The Private Ledger (10 Minutes)**
  *   **Action:** Teams lay their string across Event **E3 (Seminar Now, $t=10, x=0$)**. They slide the string along its fixed angle until it passes through E3.
  *   **Task:** Mark every event card that lies *under* or *touching* the string as **PRESENT**. Events below are **PAST**. Events above are **FUTURE**.
  *   **Constraint:** They must correct for signal delay. If a card says "Observed at Earth $t=20$" but their string says it is "Present" at $t=10$, they must still mark it Present. The ledger records *ontological status*, not *knowledge*.
  *   **Output:** Each team submits their Ledger to you.

  **Round 2: The Wager (15 Minutes)**
  *   **Setup:** Each team starts with 10 Ontology Chips.
  *   **Action:** Teams are paired (1 vs 3, 2 vs 5, 4 vs 6). They must wager chips on whether their partner's Ledger matches their own for specific events (e.g., "I bet 3 chips you marked A3 as Future").
  *   **The Trap:** Students naturally assume their own slice is the "correct" one. Because the slices diverge significantly at $x=10$ (Andromeda), Team 1 (Rest) will mark A3 as Present. Team 3 (Fast Out) will mark A3 as Future (their line slopes up, passing below A3 at $x=10$). Team 5 (Fast In) will mark A3 as Past.
  *   **Payoff:** If the prediction matches the partner's actual Ledger, you double the wagered chips. If it mismatches, you take the chips.
  *   **Result:** Predictable loss. Teams will lose chips because they wagered based on *their* reality, not their partner's frame.
  *   **Currency:** Chips convert into **"Veto Tokens."** In the Debrief, each token allows the team to strike one word from the final summary sentence written on the board. This costs you nothing but grants genuine agency.

  **Round 3: The Turnaround Jump (5 Minutes)**
  *   **Action:** Team 6 (Turnaround) moves their anchor from E3 to **S3 (Turnaround Pt, $t=10, x=5$)**. They must physically pivot their string from Slope 0.6 to Slope -0.6.
  *   **Observation:** As the string pivots, it sweeps across the Andromeda events (A1–A5).
  *   **Prompt:** "Team 6, read your ledger before the pivot. Read it after. Did the universe change, or did you?"
  *   **Goal:** Create visceral discomfort. The events at Andromeda jump from Future to Past instantly in their frame.

  **Round 4: Chain-Building (15 Minutes)**
  *   **Task:** Connect **E1 (Module Start)** to **E5 (Module End)** using a chain of "Co-Reality."
  *   **Rule:** You can pin a link between two events only if a team's string can lie across both simultaneously.
  *   **Problem:** E1 and E5 are timelike separated. No single string can touch both.
  *   **Solution:** They must zig-zag. E1 is simultaneous with A1 (Team 1). A1 is simultaneous with E2 (Team 5). E2 is simultaneous with A2... eventually reaching E5.
  *   **Prompt:** "If Event A is real with Event B, and Event B is real with Event C, is Event A real with Event C? Build the chain. If you believe in transitivity, pin the chain."
  *   **Outcome:** They will build a chain connecting the beginning of class to the end of class through distant space, implying the end of class is already real at the start.

  **Round 5: The Global Table (10 Minutes)**
  *   **Action:** Two students (scribes) come to the whiteboard. They draw a 15x15 grid.
  *   **Task:** Fill in cells with "Yes" (Co-real) or "No" based on the room's consensus.
  *   **Conflict:** If they mark "Yes" for all spacelike connections (due to different frames) and enforce transitivity (due to the Chain), the table fills with "Yes." Every event is co-real with every other event.
  *   **The Four Exits:** Ask the scribes: "The table won't close consistently. You have four ways to fix it. Choose one:"
      1.  **Contradiction:** Accept the table contains Yes and No for the same pair (Reality is contradictory).
      2.  **Intransitivity:** Deny that "is real with" transfers across the chain (Reality is fragmented).
      3.  **Privilege:** Erase all rows except Team 1's (There is a true frame we cannot detect).
      4.  **Relativisation:** Add a column for "Relative to Frame F" (Reality is frame-dependent).

  #### Four. The Debrief (20 Minutes)

  **Minute 0-5: Mapping the Moments**
  *   Gather students. Do not erase the floor diagram.
  *   **Round 1 & 2 (The Wager):** Map this to **Relativity of Simultaneity**. The chip loss proves that disagreement isn't error; it's geometric. There is no "view from nowhere" to adjudicate the bet.
  *   **Round 3 (Turnaround):** Map this to **The Threat to Becoming**. If changing velocity changes what exists "now" at Andromeda, then "becoming" is not a universal feature of the world, but a local artifact of your trajectory.
  *   **Round 4 (Chain):** Map this to **Transitivity**. This is the engine of the argument. If reality is transitive across spacelike connections, the timelike separation collapses.
  *   **Round 5 (The Table):** Map this to **The Fork**. The four exits are the only logical options remaining.

  **Minute 5-15: Introducing the Terms**
  *   *Instruction:* Introduce these terms only now.
  *   **Presentism:** Introduce when discussing Exit 3 (Privilege). Presentism usually requires a privileged "now." If you choose Exit 3, you are a Presentist who believes in undetectable absolute simultaneity.
  *   **Eternalism / Block Universe:** Introduce when discussing Exit 4 (Relativisation) combined with Transitivity. If all slices are equally real, and they overlap to cover the whole diagram, the whole diagram exists. This is the **Block Universe**.
  *   **Growing Block:** Introduce as a resistance move to Round 3. Maybe the past grows, but the future doesn't exist? Ask if this survives the Turnaround jump (it struggles, because the jump changes what is "present" without adding "past").
  *   **Fragmentalism:** Introduce when discussing Exit 2 (Intransitivity). Reality is not one single table; it is fragments that do not compose into a whole.
  *   **Placement:** Write these terms on the board only after the students have described the concepts in their own words.

  **Minute 15-20: The Instructor's Move**
  *   **The Sharp Question:** "Which premise is doing the heavy lifting?"
  *   **Reveal:** The argument relies on: (1) Relativity of Simultaneity (True in SR), (2) Transitivity of Co-reality (Logical intuition), (3) **Simultaneity confers Reality** (The Philosophical Premise).
  *   **Your Position:** State plainly: "I believe premise (3) is false. Just because an event is simultaneous with you in a frame does not mean it is ontologically fixed for you. But you must feel the cost of denying it."
  *   **Resistance Moves Not Surfaced:**
      1.  **The Solipsism of the Present Moment:** "Only *this* point exists." (Hard to maintain language about objects).
      2.  **Fine-Grained Becoming:** "Reality propagates at $c$." (Conflicts with the spacelike slices used in the activity).
      3.  **Metaphysical Nihilism:** "Nothing exists." (Avoids the problem by dissolving the subject).

  #### Five. Troubleshooting: What Will Go Wrong

  1.  **Knowledge vs. Existence:**
      *   *Failure:* Students say, "A3 isn't real yet because we can't see it."
      *   *Handling:* Point to the back of the card. "The card says 'Observed at $t=20$'. Your ledger says 'Present at $t=10$'. The activity forces you to separate *observation* from *occurrence*. If you conflate them, you cannot play the game."
  2.  **String Nudging:**
      *   *Failure:* Teams subtly tilt their string to make the data fit their intuition.
      *   *Handling:* Use pins at the ends of the string fixed to the grid edges. Walk around with a protractor (or the Tilt Key) and audit angles publicly during Round 2.
  3.  **The "So What?" Student:**
      *   *Failure:* "This just shows simultaneity is relative. We knew that. Why does it mean the future is real?"
      *   *Handling:* Redirect to Round 4 (Chain). "Relativity alone doesn't kill the future. Transitivity does. If you deny the future is real, you must break the chain. Show me where the chain breaks without breaking logic."
  4.  **2D Suppression:**
      *   *Failure:* "Real space is 3D, this is 1D space."
      *   *Handling:* Acknowledge it. "A plane of simultaneity in 3D space is a 3D volume. Here it is a line. The geometry holds; the volume just makes the 'slice' thicker, not different in kind."
  5.  **Turnaround Trick:**
      *   *Failure:* "They just changed their definition of now, nothing actually changed."
      *   *Handling:* "Exactly. That is the argument. If 'what exists' depends on your definition, then 'what exists' is not absolute. Do you accept that existence is definition-dependent?"

  #### Six. The Limitation: What This Cannot Reproduce

  This activity cannot reproduce the **normative force of ontological commitment**. It demonstrates an inconsistency in *classification* (labeling events Past/Present/Future), but it does not logically force the conclusion that misclassified events *exist*. The move from "Event A is simultaneous with Event B in Frame F" to "Event A is ontologically real relative to Event B" is a philosophical premise, not a geometric fact. The activity makes denying that premise feel *awkward* (because it breaks the chain/table), but it cannot make it feel *false*. You must testify to this gap. The students will feel the geometric pressure, but you must explicitly state that the pressure only becomes a proof if they accept that simultaneity is the criterion for reality—a criterion many metaphysicians reject. The activity simulates the *consequences* of Eternalism, but it cannot simulate the *truth* of it.
