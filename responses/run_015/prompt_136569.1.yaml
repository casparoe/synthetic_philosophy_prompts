prompt: |-
  I have been asked to contribute a short conceptual-foundations annexe to a health authority's draft methods guide for technology appraisal, and the section I am responsible for has to say what the guide's central rule presupposes. Before I write it, I would like your help reconstructing the implicit theory as sharply as the material allows.

  The rule, as the guide states it: a treatment is recommended if its incremental cost per quality-adjusted life year falls below a fixed monetary threshold, and rejected if it exceeds that threshold. The details that seem to matter philosophically are these. QALYs are constructed by weighting each year of life by a quality weight between zero, identified with death, and one, identified with full health, with weights below zero permitted for states judged worse than death. The weights are derived from surveys in which members of the general public choose between a shorter life in full health and a longer life in a described impaired state, and the guide averages across respondents even for states those respondents have never occupied. Gains are then summed linearly across all patients, and the guide states explicitly that the value of a QALY gain does not depend on whose it is, on how many QALYs the patient has already had, or on how the total is distributed. There are three standing exceptions to the threshold. The first is an end-of-life override permitting a premium for patients with short remaining life expectancy. The second is an unmet-need clause permitting a premium where the condition is rare and no alternative treatment exists. The third is a spillover clause: health gains accruing to carers and family members may be counted in sensitivity analysis but are excluded from the base case, and so are the future health care costs a patient would have incurred had they not died.

  What I need from you is a reconstruction, not a survey of positions, and I would rather you argue from the structure of the practice than appeal to what is standard in the literature. Specifically:

  Distinguish the different strengths of comparability the rule might be committed to: that one person's well-being can be compared in level with another's; that gains and losses can be compared cardinally across persons; and that well-being is measurable on a ratio scale rather than merely an interval scale. Which of these does the arithmetic strictly require? My own suspicion is that division by cost demands more than summation does, and that allowing negative weights demands something specific about where zero sits, but I want this set out precisely, with each commitment tied to the step in the calculation that forces it.

  Say whether the practice presupposes a welfarist reading, on which QALYs are a measure of welfare, or an extra-welfarist one, on which they measure health and society may weight health however it likes. Which parts of the practice fit which reading, and what breaks if we switch? I am especially unsure about the survey method: it asks people to evaluate states they have never been in, and the guide simply averages over the familiar gap between how patients in a state rate it and how the general public rates it from outside. What view of well-being does that method quietly commit the guide to, and would patients' own ratings be a better or worse fit for the reading you identify?

  Assess whether the no-distributional-weighting clause really commits the guide to an unweighted total view, on which the marginal moral value of a gain is the same whoever receives it, or whether it is compatible with prioritarianism, since the guide says nothing about patients' lifetime well-being levels. Then take up the exceptions. Are the end-of-life override and the unmet-need clause contradictions of the baseline rule, or do they reveal that the baseline was never unweighted in the first place? I would like the difference between weighting by absolute shortfall, the number of QALYs a patient would lose without treatment, and weighting by proportional shortfall, the fraction of remaining life lost, spelled out, and I want to know which of these the end-of-life rule actually instantiates, given that its trigger is life expectancy rather than either shortfall measure. If the answer is neither, say what view of distributive justice a life-expectancy trigger would instead commit us to, and whether that view is one the guide could coherently hold alongside its own baseline.

  One member of the panel has proposed, in a footnote, that the threshold is not a moral quantity at all but the shadow price of a fixed budget: the amount of health that unidentified patients elsewhere in the system lose when we spend here. Does that reinterpretation remove the need for interpersonal comparisons, or does it only relocate them, given that the displaced patients are not identified and the comparison is with a counterfactual population? I want a straight answer on whether this is a genuine defence of the rule or a change of subject.

  Finally, tell me what would have to change if the comparability assumption were dropped. Could the rule survive as a decision procedure without being an aggregation of well-being at all, for instance as the output of a social choice function over profiles of individual preferences, or as a device for implementing a hypothetical agreement among people who do not know whose position they will occupy? And if the implicit view were replaced by prioritarianism, sufficientarianism, or a capabilities-style view in which the currency is not well-being but what people are able to do and be, which elements of the practice would have to change: the quality weights, the linear summation, the three exceptions, or the currency itself?

  Throughout, I want three things kept clearly separate: what the practice strictly presupposes in the sense that it would be unintelligible otherwise; what it merely fits well with because several theories would license it; and where its parts seem to presuppose inconsistent things, so that the guide may be committed to a conjunction no single view would endorse.
reasoning: |-
  Here's a thinking process that leads to the suggested reconstruction:

  1.  **Deconstruct the Request:**

      *   **Task:** Reconstruct the implicit theory behind a specific health technology appraisal (HTA) rule (Cost-Effectiveness Analysis using QALYs with a threshold).
      *   **Constraint 1:** Do not survey the literature; argue from the *structure of the practice* itself.
      *   **Constraint 2:** Distinguish three things clearly: (1) Strict presuppositions (unintelligible otherwise), (2) Compatible fits (licensed by several theories), (3) Inconsistencies/Tensions (committed to a conjunction no single view endorses).
      *   **Specific Questions to Address:**
          1.  *Comparability:* Level, Cardinal, Ratio? Tie to calculation steps (summation, division, negative weights).
          2.  *Welfarism vs. Extra-welfarism:* Survey method (public vs. patient), averaging, weighting.
          3.  *Distribution:* No-weighting clause vs. Prioritarianism. Analyze the exceptions (End-of-Life, Unmet Need). Absolute vs. Proportional Shortfall vs. Life Expectancy trigger.
          4.  *Budget Constraint/Shadow Price:* Is the threshold moral or economic? Does this remove interpersonal comparisons?
          5.  *Dropping Comparability/Alternative Theories:* Could it be social choice? Hypothetical agreement? What changes under Prioritarianism, Sufficientarianism, Capabilities?

  2.  **Analyze the Rule & Details:**

      *   **Core Rule:** Recommend if $ICER < \lambda$ (Threshold). Reject if $ICER > \lambda$.
      *   **QALY Construction:** Time $\times$ Quality Weight ($0=$ Death, $1=$ Full Health, $<0=$ Worse than Death).
      *   **Weights:** General public surveys (Time Trade-Off style: shorter full health vs. longer impaired). Averaged across respondents (including those never in the state).
      *   **Aggregation:** Linear summation across patients.
      *   **Distributional Stance:** Value of QALY gain independent of recipient, prior health, or distribution.
      *   **Exceptions:**
          1.  End-of-Life (EoL): Premium for short life expectancy.
          2.  Unmet Need: Premium for rare/no alternative.
          3.  Spillover/Costs: Carer gains/future costs excluded from base case (included in sensitivity).
      *   **Footnote Claim:** Threshold = Shadow price of budget (opportunity cost).

  3.  **Drafting the Reconstruction - Section by Section:**

      *   **Section 1: Comparability (The Arithmetic of Value)**
          *   *Summation:* Requires cardinal comparability of gains (Unit A + Unit B = Total). Interval is enough for differences, but...
          *   *Division (ICER):* $\Delta Cost / \Delta QALY$. To compare this ratio to a fixed threshold $\lambda$, the denominator must have a fixed zero point. If QALYs were just interval, the ratio would change depending on where we set zero. So, **Ratio Scale** is strictly required.
          *   *Negative Weights:* "Worse than death" implies a natural zero (Death). This reinforces the Ratio Scale requirement.
          *   *Interpersonal:* Summing across patients requires interpersonal comparability of *gains* (at least). Does it require level comparability? Strictly, utilitarianism needs level comparability to know who is worse off, but the "no distributional weighting" clause suggests we only care about the *sum*. However, the EoL exception *does* look at levels (remaining life). So the base rule needs cardinal unit comparability; the exceptions need level comparability.
          *   *Conclusion:* Base rule strictly presupposes **Cardinal Unit Comparability** (for summation) and a **Ratio Scale** (for the zero point and division). It does *not* strictly require Level Comparability for the base rule, but the exceptions break this.

      *   **Section 2: Welfarism vs. Extra-welfarism (The Currency)**
          *   *Welfarism:* Value = Welfare. QALYs proxy welfare.
          *   *Extra-welfarism:* Value = Health. Society weights health.
          *   *Survey Method:* Public valuing states they haven't experienced. This distances the measure from the *patient's* experienced utility (Welfarism). It aligns more with a social valuation of health states (Extra-welfarism).
          *   *Averaging:* Averaging public preferences suggests a "social tariff."
          *   *Tension:* If it were pure Welfarism, patient preferences should dominate (they know the state). If pure Extra-welfarism, why use Time Trade-Off (a preference-based method) rather than clinical metrics?
          *   *Conclusion:* The practice fits **Extra-welfarism** better (health as the good, socially valued). Strict presupposition: The currency is a *socially constructed index of health capacity*, not individual experienced welfare. Using patient ratings would break the "social tariff" logic but fit welfarism better. The current method presupposes that the *public's* valuation of health states is the authoritative metric for resource allocation, not the patient's hedonic experience.

      *   **Section 3: Distribution and Exceptions (The Moral Weight)**
          *   *Base Rule:* "Value does not depend on whose it is." This is Classic Utilitarianism (Unweighted Total).
          *   *Prioritarianism:* Weights gains to the worse off. Base rule explicitly rejects this ("does not depend on... how many QALYs the patient has already had").
          *   *Exceptions:*
              *   *End-of-Life (EoL):* Trigger = Short life expectancy. Is this Absolute Shortfall (QALYs lost)? No. Proportional Shortfall (% of life lost)? No, it's just *time remaining*.
              *   *Analysis:* If I have 6 months left vs 20 years left. EoL helps the 6 months. This looks like a **Sufficientarian** or **Life-Cycle Fairness** view (everyone deserves a fair innings), not Prioritarianism based on *health* status.
              *   *Unmet Need:* Rare/No alternative. This is a **Rule of Rescue** or **Solidarity** principle.
          *   *Contradiction:* The base rule says "no weighting." The exceptions *are* weights.
          *   *Conclusion:* The guide is committed to an **inconsistent conjunction**. It asserts an unweighted total view while applying specific weights based on prognosis (EoL) and scarcity (Unmet Need). The EoL rule specifically instantiates a "Fair Innings" argument (age/life expectancy based), not health shortfall.

      *   **Section 4: The Shadow Price (The Threshold)**
          *   *Claim:* Threshold = Opportunity Cost (Health displaced elsewhere).
          *   *Implication:* If $\lambda$ is just a budget constraint, is it moral?
          *   *Interpersonal Comparisons:* Displaced patients are "unidentified." But to say health lost there = health gained here, you still need to assume QALYs are comparable across the two groups.
          *   *Relocation:* It doesn't remove interpersonal comparison; it assumes the *system* maximizes total health. It shifts the justification from "maximizing good" to "constrained maximization."
          *   *Verdict:* It is not a genuine defence against the moral assumptions; it is a **change of subject** from *why* we maximize to *how much* we can maximize. It presupposes the base rule (maximize QALYs) is already accepted.

      *   **Section 5: Dropping Comparability / Alternative Theories**
          *   *Drop Comparability:* Can we use Social Choice? Arrow's Theorem suggests difficulty aggregating without interpersonal info. Hypothetical Agreement (Rawls/Veil of Ignorance)? This would likely prioritize the worst off (Maximin), breaking the linear summation.
          *   *Prioritarianism:* Needs level comparability. Would require weighting QALYs by baseline health. Breaks linear summation.
          *   *Sufficientarianism:* Focus on getting everyone above a threshold. Breaks linear summation (diminishing marginal value above threshold).
          *   *Capabilities:* Currency changes from QALYs (health/welfare) to Functionings. Weights would need to reflect freedom/opportunity, not just health state duration.
          *   *Conclusion:* The rule *cannot* survive as a simple aggregation if comparability is dropped. It would need to become a deliberative process or a voting mechanism, losing the algorithmic nature.

  4.  **Refining and Polishing (Self-Correction during drafting):**

      *   *Check Constraint:* Did I separate Strict Presupposition vs. Fit vs. Inconsistency? I need to make sure these labels are explicit.
      *   *Check Math:* Does division require ratio scale? Yes. If $y = mx + c$, then $x/y$ changes if $c$ changes. QALYs have a defined zero (death). So Ratio is strict.
      *   *Check EoL:* The prompt asks about Absolute vs. Proportional Shortfall. EoL is usually "life expectancy < 24 months." This isn't shortfall (difference between normal and actual). It's absolute remaining time. This aligns with "Fair Innings." I need to be precise here.
      *   *Check Welfarism:* The prompt asks about the survey method. Public valuing states they haven't been in. This is the "preference satisfaction" of the *public*, not the *patient*. This is a specific kind of welfarism (social welfare function) or extra-welfarism. I should argue it leans Extra-welfarist because it treats health as a social good to be weighed by citizens, not a private experience to be reported by sufferers.
      *   *Tone:* Needs to be sharp, conceptual, suitable for an annexe to a methods guide. Philosophical but grounded in the text provided.

  5.  **Final Structure:**
      *   Introduction: Scope and Method.
      *   1. The Arithmetic of Value (Comparability & Scales).
      *   2. The Nature of the Currency (Welfarism vs. Extra-welfarism).
      *   3. Distribution and the Exceptions (Consistency Check).
      *   4. The Threshold (Moral vs. Economic).
      *   5. Counterfactuals (Alternative Theories).
      *   Summary Table (Strict vs. Fit vs. Inconsistent).

  6.  **Writing the Content:** (Iterative refinement of the arguments to ensure they are "reconstructed from structure" as requested). *Self-Correction on the Shadow Price:* If the threshold is opportunity cost, does it require interpersonal comparison? Yes, because you are comparing QALYs gained in Group A vs QALYs lost in Group B. If QALYs aren't comparable across persons, the shadow price is meaningless. So the defence fails to remove the commitment.

      *   *Refining the EoL point:* The prompt asks about Absolute vs Proportional Shortfall.
          *   Absolute Shortfall: Normal Life Expectancy - Actual Life Expectancy.
          *   Proportional Shortfall: (Normal - Actual) / Normal.
          *   Guide's Rule: "Short remaining life expectancy." This is just *Actual Life Expectancy*. It is neither shortfall measure directly, though it correlates with Absolute Shortfall (if normal is fixed). However, conceptually, it treats *time remaining* as the value, which is "Fair Innings." I must make this distinction clear.

      *   *Refining the Welfarism point:* The prompt asks if patient ratings would be a better fit. If the view is Extra-welfarist (Health is the good), public ratings are better (social valuation). If Welfarist (Welfare is the good), patient ratings are better (experienced utility). Since the guide uses public ratings, it presupposes Extra-welfarism *structurally*, even if it uses preference-based methods.

  7.  **Final Review against constraints:**
      *   No literature survey? (Check, arguments from structure).
      *   Three distinctions kept separate? (Check, will use explicit headings or bolding).
      *   Sharp reconstruction? (Check).

      *(Self-Correction)*: Ensure I explicitly answer the "Strictly Requires" vs "Fits Well" vs "Inconsistent" for each section.

      *Let's write.*
answer: |-
  **Annexe: Conceptual Foundations of the Appraisal Rule**

  This reconstruction derives the implicit theoretical commitments of the guide strictly from the operational structure of its decision rule. It distinguishes between (1) **Strict Presuppositions** (features without which the calculation is unintelligible), (2) **Theoretical Fits** (features compatible with multiple views but suggestive of one), and (3) **Structural Inconsistencies** (features that commit the guide to a conjunction of views no single theory endorses).

  ### 1. The Arithmetic of Value: Comparability and Scales

  The calculation involves three distinct operations: weighting health states, summing gains across persons, and dividing gains by costs to compare against a threshold. Each imposes specific measurement requirements.

  **Summation and Interpersonal Comparability**
  The rule sums QALY gains across all patients.
  *   **Strict Presupposition:** **Cardinal Unit Comparability.** To add Person A's gain to Person B's gain, the unit of measurement must represent the same magnitude of value for both. If a QALY for A were merely twice as "good" as a QALY for B in a way the arithmetic cannot capture, summation would be category error.
  *   **Strict Presupposition:** **Level Comparability is *not* required for the base rule.** The clause stating value "does not depend on... how many QALYs the patient has already had" implies the algorithm is blind to baseline welfare. It requires comparison of *changes* ($\Delta$), not levels ($L$).

  **Division and the Zero Point**
  The rule calculates a ratio ($\Delta Cost / \Delta QALY$) and compares it to a fixed scalar ($\lambda$). It also permits weights below zero (states worse than death).
  *   **Strict Presupposition:** **Ratio Scale.** If QALYs were measured on an interval scale (where zero is arbitrary), the ratio $\Delta Cost / \Delta QALY$ would vary depending on where the zero point was set. For the threshold $\lambda$ to be fixed and meaningful, the denominator must have a non-arbitrary zero. The identification of "death" as zero and "worse than death" as negative strictly requires a natural zero point.
  *   **Implication:** The arithmetic forces the view that death is the absence of value (0) and that some states possess negative value. This is a strong ontological claim about the structure of health value, not merely a measurement convenience.

  ### 2. The Nature of the Currency: Welfarism vs. Extra-welfarism

  The guide constructs QALYs using public surveys of hypothetical states, averaged across respondents, rather than patient-reported outcomes.

  **The Survey Method**
  *   **Strict Presupposition:** **Social Valuation of Health.** By soliciting values from the general public for states they have not occupied, and averaging these over patient experiences, the guide presupposes that the *currency* of appraisal is not the patient's experienced welfare (Welfarism), but a social construct of health capacity (Extra-welfarism).
  *   **Theoretical Fit:** This fits **Extra-welfarism**. In a strict Welfarist view, the authority on whether a state is "good" is the person inhabiting it (preference satisfaction or experienced utility). The guide's method structurally excludes the patient's epistemic privilege. If the guide were Welfarist, patient ratings would be strictly required; their exclusion would be an error.
  *   **Structural Tension:** The method uses preference-based elicitation (Time Trade-Off), which is the standard tool of Welfarism, but applies it to a non-Welfarist subject (the public evaluating others' health). The guide presupposes that *preferences about health* are the correct metric, but that *society's preferences* trump the *patient's preferences*.

  **The Exclusion of Spillovers**
  *   **Strict Presupposition:** **Sectoral Boundaries.** Excluding carer gains and future non-health costs from the base case presupposes that the authority's mandate is limited to "health" as a distinct good, separable from general welfare or economic productivity. This reinforces the Extra-welfarist reading: the goal is to maximize health, not welfare or wealth.

  ### 3. Distribution and the Exceptions

  The base rule states the value of a QALY is independent of recipient or distribution. However, three exceptions modify this.

  **The Base Rule**
  *   **Strict Presupposition:** **Unweighted Total Utilitarianism.** The instruction to sum linearly without regard to baseline health or identity is the definition of classical utilitarianism.
  *   **Compatibility:** This is **incompatible with Prioritarianism.** Prioritarianism requires weighting gains inversely to baseline welfare. Since the guide explicitly forbids weighting by "how many QALYs the patient has already had," it cannot be prioritarian in its base form.

  **The Exceptions**
  *   **End-of-Life (EoL) Override:** This permits a premium for patients with short remaining life expectancy.
      *   **Analysis:** This is neither **Absolute Shortfall** (difference between normal and actual life expectancy) nor **Proportional Shortfall** (fraction of normal life lost). It triggers on *absolute remaining time*.
      *   **Strict Presupposition:** **Fair Innings / Life-Cycle Equity.** By prioritizing those with little time left regardless of how much they have already had, the rule presupposes a claim based on the *opportunity to complete a life cycle*, not on health deficit.
      *   **Structural Inconsistency:** The base rule claims distributional neutrality; the EoL exception applies a distributional weight based on prognosis. These are logically contradictory. The guide asserts an unweighted view while practicing a weighted one.
  *   **Unmet Need:** This permits a premium for rare conditions with no alternatives.
      *   **Strict Presupposition:** **Rule of Rescue / Solidarity.** This values the *status* of the condition (rare/orphan) rather than the *quantity* of health produced. It contradicts the efficiency logic of the base rule, which should favour common conditions where economies of scale yield more total QALYs.
  *   **Conclusion on Distribution:** The guide is committed to a **pragmatic conjunction** no single moral theory endorses: it aggregates as a Utilitarian but distributes as a Sufficientarian (EoL) and a Solidarist (Unmet Need).

  ### 4. The Threshold: Moral Quantity or Shadow Price?

  The footnote suggests the threshold ($\lambda$) is the shadow price of a fixed budget (health displaced elsewhere).

  **Interpersonal Comparisons**
  *   **Strict Presupposition:** **System-Wide Comparability.** If $\lambda$ represents health lost by "unidentified patients elsewhere," the guide must assume that a QALY gained by the treated patient is comparable to a QALY lost by the displaced patient.
  *   **Verdict:** This is **not a genuine defence** against the need for interpersonal comparison; it **relocates** the comparison. It shifts the comparison from "Patient vs. Threshold" to "Patient vs. Counterfactual Population." It presupposes the same cardinal unit comparability as the base rule.
  *   **Change of Subject:** Interpreting $\lambda$ as a budget constraint changes the justification from *maximizing the good* (moral) to *constrained optimization* (economic). However, it does not remove the moral commitment to *what* is being maximized (QALYs). It explains the *limit* of spending, not the *value* of the outcome.

  ### 5. Counterfactuals: Dropping Comparability or Changing Theory

  **Dropping Comparability**
  *   **Viability:** The rule **cannot survive** as an algorithmic decision procedure if interpersonal comparability is dropped.
  *   **Alternative:** It would need to become a **Social Choice Function** (e.g., voting over profiles) or a **Deliberative Process**. Without a common unit, summation is impossible. A hypothetical agreement (Veil of Ignorance) would likely yield a Maximin rule (protect the worst off), which contradicts the linear summation of the current guide.

  **Alternative Moral Theories**
  *   **Prioritarianism:** Would require **Level Comparability** (currently not required). It would break the **Linear Summation** (gains to the sick would count for more). The **No-Distributional-Weighting Clause** would have to be deleted.
  *   **Sufficientarianism:** Would require defining a **Threshold of Capability** (not just health). It would break **Linear Summation** (gains above the threshold would have zero or diminished value). The **QALY Currency** might need replacement with a measure of "functioning."
  *   **Capabilities Approach:** Would require changing the **Currency** from QALYs (health/welfare proxy) to a vector of Functionings. The **Survey Method** would need to ask about "freedoms to be and do" rather than "time in health states." The **Exclusion of Spillovers** would likely be untenable, as capabilities often depend on social context (carers).

  ### Summary of Commitments

  | Feature | Strict Presupposition (Unintelligible Otherwise) | Theoretical Fit (Compatible Views) | Structural Inconsistency (Tensions) |
  | :--- | :--- | :--- | :--- |
  | **Measurement Scale** | **Ratio Scale** (Required for division & negative weights). | N/A | N/A |
  | **Comparability** | **Cardinal Unit Comparability** (Required for summation). | Utilitarianism, Prioritarianism. | Base rule rejects Level Comparability; EoL exception requires it. |
  | **Currency** | **Socially Valued Health** (Public surveys > Patient reports). | Extra-welfarism. | Uses preference methods (Welfarist tool) for social valuation (Extra-welfarist end). |
  | **Distribution** | **Unweighted Sum** (Base rule). | Classical Utilitarianism. | Contradicted by EoL (Fair Innings) and Unmet Need (Solidarity) exceptions. |
  | **Threshold** | **Fixed Value of Health** (Moral or Opportunity Cost). | Constrained Utilitarianism. | Shadow price argument relocates but does not remove interpersonal comparison. |

  **Final Assessment:** The guide strictly presupposes that health is a measurable good on a ratio scale, socially valued, and aggregable across persons. It attempts to operate as an unweighted utilitarian calculator but is structurally compromised by exceptions that introduce non-utilitarian distributional weights. It is not a coherent application of a single moral theory, but a hybrid procedure that prioritizes algorithmic simplicity in the base case while reserving discretionary moral overrides for politically salient exceptions.
