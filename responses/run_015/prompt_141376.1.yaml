answer: |-
  This is a sharp dissection of a rhetorical reflex that usually goes unexamined. You are asking about the conditions of **moral standing**.

  The short answer is that the *tu quoque* move is rarely a logical objection (the argument stands regardless of the speaker) and rarely a pure epistemic one (the data is still the data). It is a **normative sanction**. It is a social technology used to enforce group cohesion and police the cost of moral signaling.

  Here is the implicit theory broken down by your specific questions, followed by the concrete implications for your workflow.

  ### 1. Normative Forfeiture vs. Epistemic Sincerity
  The practice of withdrawing standing presupposes **Normative Forfeiture**, but it is often defended using Epistemic language.

  *   **The Normative Claim:** To blame someone for violating a norm, you must acknowledge that the norm binds *you*. If you exempt yourself, you are not enforcing a rule; you are wielding a weapon. By violating the norm you are invoking, you treat the norm as optional. If the norm is optional, your blame is unjustified. You have forfeited the *authority* to punish, not necessarily the *ability* to observe.
  *   **The Epistemic Mask:** We often say, "You're biased," or "You're not sincere." But sincerity is not truth. A hypocrite can be right about the climate. However, we conflate the two because, in social coordination, **authority is a proxy for reliability.** If you cannot govern yourself, why should we trust you to govern the discourse?

  **The Whistleblower Exception:**
  This is not a tension; it is a distinction of **directionality**.
  *   **The Hypocrite:** Moves from Norm -> Violation. They claim the benefit of the moral high ground while avoiding the cost. This suggests the norm is a scam.
  *   **The Whistleblower:** Moves from Violation -> Norm. They have paid the cost of switching sides (reputation, income, safety). Their complicity is not a current conflict of interest; it is **sunk cost signaling**. It proves they are not criticizing for cheap virtue points, because they are criticizing their *former* self. Their complicity credentials them because it proves the difficulty of the truth they are telling.

  ### 2. Disclosure vs. Recusal
  Your paper's split between disclosure and recusal tracks the difference between **Manageable Bias** and **Structural Incapacity**.

  *   **Recusal (Structural Incapacity):** Used when the conflict makes the *process* of truth-seeking impossible. If you are funded by the industry you are investigating, the *design* of the inquiry is likely compromised, not just the conclusion. You cannot be trusted to ask the right questions. The conflict is antecedent to the work.
  *   **Disclosure (Manageable Bias):** Used when the work is already done, but the *interpretation* might be skewed. The reader is invited to apply a discount rate. "This author owns stock in X, so weigh their optimism accordingly." This assumes the facts are checkable, but the spin is suspect.

  **The Implicit Theory:** Recusal says, "You cannot play this game." Disclosure says, "You can play, but the audience needs to know your jersey color."

  ### 3. Wrongdoing vs. Benefit vs. Inability to Opt Out
  This is where the environmental angle gets sticky.

  *   **Wrongdoing:** Essential for the *tu quoque* to stick as a moral charge. If the act isn't wrong, there's no hypocrisy.
  *   **Benefit:** Creates an epistemic bias, but not necessarily a moral forfeiture. (A researcher benefiting from a grant is biased, but not necessarily a hypocrite unless they claim the grant system is corrupt).
  *   **Inability to Opt Out:** This is the collapse point you identified. If the norm requires exiting society (zero carbon, zero meat, zero capitalism), then *everyone* has unclean hands.
      *   **The Theory:** Standing is retained if you are **minimizing** your violation within a system you cannot yet exit.
      *   **The Collapse:** When a critic is told "You fly on planes," the counter-move is "I fly less than my peers, and I am arguing for a system where we don't have to."
      *   **The Limit:** *Tu quoque* is legitimate only when the critic claims **purity** rather than **progress**. If the critic claims, "I am clean," and they are not, they lose standing. If they claim, "This is dirty, and we are all dirty, but we must wash," they retain standing.

  ### 4. Philosophical Underdetermination
  The practice is underdetermined in the realm of **Private vs. Public Moralizing**.

  *   **Rival Account A:** Hypocrisy is always irrelevant to truth. (Logical Purist).
  *   **Rival Account B:** Hypocrisy invalidates the specific act of *blame*, but not the observation of fact. (Legal/Contractual).
  *   **Rival Account C:** Hypocrisy is evidence that the norm is too costly to be sustainable. (Sociological).

  Our current practice mashes these together. We sometimes let a hypocrite speak (Account A), sometimes silence them (Account B), and sometimes treat their hypocrisy as proof the system is broken (Account C). The practice doesn't distinguish because it is not trying to find truth; it is trying to **manage social friction**. We silence hypocrites when their noise threatens group cohesion. We amplify whistleblowers when their noise threatens a rival group's cohesion.

  ### 5. Concrete Implications: Banning *Tu Quoque*
  If you decided tomorrow that *tu quoque* is never legitimate and blame is a judgment anyone may make, here is what changes:

  **What you would change:**
  1.  **Assignment:** You would assign stories based solely on expertise, ignoring conflicts unless they are direct financial bribes. You might assign an oil geologist to write on climate risks if they are the best modeler, without recusal.
  2.  **Disclosure:** You would minimize conflict footnotes. They become irrelevant data if the argument stands on its own.
  3.  **Reader Mail:** You would stop engaging with "You do it too" arguments. You would moderate comments that attack the author's lifestyle rather than the text.

  **What you would lose (The Quiet Protection):**
  1.  **Bad Faith Detection:** *Tu quoque* is often a clumsy heuristic for detecting bad faith. If a person is loudly moralizing to gain social capital while privately violating the norm, they are lying about their motives. Banning the move protects the liar.
  2.  **Moral Leadership:** The current practice enforces the idea that **leaders must lead**. It protects the norm that influence requires sacrifice. If you remove standing requirements, you decouple influence from responsibility. You get a marketplace of ideas where the most vocal critics pay the lowest personal cost.
  3.  **Trust:** Audiences use heuristics to trust. "Clean hands" is a fast-and-frugal tree for "Trustworthy." If you remove it, you force the audience to do complex epistemic labor on every piece they read. They will likely disengage.

  ### The Synthesis for Your Column
  The implicit theory is this: **Standing is not a right; it is a credit line.**

  You build credit by aligning your actions with your words. When you criticize, you spend that credit.
  *   **The Hypocrite** is spending credit they don't have (bankruptcy).
  *   **The Whistleblower** is cashing in the credit they built by suffering for the switch.
  *   **The Systemic Participant** (the environmentalist who flies) is operating on a line of credit granted by the community, provided they acknowledge the debt (disclosure) and are working to pay it down (advocacy).

  The browser extension your friend is building fails because it quantifies **debt** (complicity score) without assessing **solvency** (direction of travel). It treats the whistleblower and the hypocrite as mathematically identical because it measures static implication rather than dynamic alignment.

  **The Fix:**
  When you handle reader mail, distinguish between **Purity Claims** and **Policy Claims**.
  *   If the author claims "I am pure," *tu quoque* is valid.
  *   If the author claims "This policy is better," *tu quoque* is a distraction, *unless* the author's conduct proves the policy is impossible.

  You keep the practice because it protects the integrity of the moral community, but you refine it so it doesn't silence necessary criticism from imperfect people. Don't ban *tu quoque*; ban it *only when the critic admits they are imperfect.*
