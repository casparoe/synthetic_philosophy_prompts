      *   *Refined Missing Piece:* They are missing the role of **alternative partitionings of the hypothesis space** and the **Garber-style update on logical entailment**. Specifically, they need to distinguish between $P(E|C)$ (logical entailment) and $P(C \text{ entails } E | \text{Background})$. Also, the concept of **severe testing** (Mayo) might bridge the gap—Jonas needs a way to objectively show the test was severe.
