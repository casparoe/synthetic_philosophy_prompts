          *   *Analysis:* This is the standard Bayesian response to accommodation vs. prediction. It relies on the likelihood ratio. If $C$ makes $E$ probable without tuning, and $\neg C$ makes $E$ improbable (or probable only via unlikely auxiliaries), confirmation happens. This aligns with Howson/Urbach style Bayesianism.
