      *Wait, one more thing on Type M:* The author says "Type M requires imbalance." In an RCT, imbalance is random. If $N$ is large, imbalance is small. If $N$ is small, imbalance is large. If imbalance is large enough to cause Simpson's Reversal, it implies a massive correlation between covariate and assignment, which in an RCT suggests a broken randomization unit (e.g., cluster randomization ignored) or SRM. So the "bug" claim is practically true for tech A/B tests, even if theoretically possible by chance. I should nuance that.

      *One more thing on Type S:* The author says "Type S isn't about aggregation at all." It *is* about aggregation, it's about the non-linearity of the aggregation function. I'll push back on the "not about aggregation" phrasing.

