      *   **Goal:** Improve the draft before posting. Find the weak spots.

  2.  **Initial Brainstorming & "Sharp Notes" (Mental Sandbox):**
      *   *Type M (Weights):* The arithmetic looks like a standard decomposition (Oaxaca-Blinder style). The claim that Type M implies "assignment system is broken" in RCTs is mostly true but slightly too strong. Random imbalance happens by chance, especially in small samples. It's not always a *bug*, sometimes it's just variance. But for large tech A/B tests, SRM (Sample Ratio Mismatch) is indeed a red flag.
      *   *Type S (Scale):* The collapsibility claim is the technical core. RD is collapsible. RR is *not* generally collapsible (this is a common misconception). OR is definitely not collapsible. The example shows RR moving (2.5, 1.5 -> 1.67). Wait, 1.67 is between 1.5 and 2.5. So RR *didn't* reverse, it just didn't average linearly. The text says "Risk ratios are 2.5 and 1.5, 1.67 overall — also between them." So the author admits RR stays between. The claim is "Only the odds ratio does the weird thing [aggregate outside range]... My understanding is that risk difference and risk ratio are 'collapsible'". **Red Flag:** Risk Ratio is *not* collapsible in the strict sense, though it often behaves better than OR. It doesn't suffer Simpson's reversal under null, but the marginal RR is not a weighted average of conditional RRs. I need to check the definition of collapsibility carefully. Collapsibility usually means the marginal measure equals a weighted average of conditional measures *if* there is no confounding. RD is collapsible. OR is not. RR is controversial/depends on definition.
      *   *Type C (Collider/Post-treatment):* This is clearly distinct from M. M is pre-treatment imbalance (confounding or random noise). C is conditioning on a collider or mediator. This is standard causal DAG stuff (M-bias, mediation). The distinction is real.
      *   *"Effect is a function":* This is basically the "Potential Outcomes" framework (Neyman-Rubin) + "Transportability" (Pearl). It's not new, but phrasing it as "naming failure" is good for engineers.
      *   *Hot Take (Stop ORs):* Strong take. In epidemiology, OR is used for case-control. In A/B testing, RD (lift) and RR (relative lift) are standard. OR is indeed hard to interpret. But is it *wrong*? No. Is it misleading? Yes, for non-statisticians.
      *   *Weakest Part:* The claim that RR is collapsible. That's the technical trap. Also, the claim that Type M is *always* a bug in RCTs. Randomization doesn't guarantee balance, only expected balance.
      *   *Missing:* Interaction effects. What if the treatment effect is *heterogeneous* in a way that isn't just scale/weight? (e.g., treatment helps mobile, hurts desktop). The draft assumes homogeneous effects in Type M ("Treatment beats control by 10 points within each"). If effects differ by sign, Simpson's paradox isn't needed to explain why the average is different.

  3.  **Drafting the Response - Section by Section:**

      *   **Brainstorming Intro:** Acknowledge the quality of the draft. It's surprisingly good for a non-specialist. But the technical precision needs tightening.
      *   **Point 1 (Arithmetic):**
          *   Type M: $0.5 \times (0.2-0.1) + 0.5 \times (0.9-0.8) = 0.05 + 0.05 = 0.10$. Correct.
          *   Mix term: $(0.9-0.5) \times 0.2 + (0.1-0.5) \times 0.9 = 0.4 \times 0.2 + (-0.4) \times 0.9 = 0.08 - 0.36 = -0.28$. Correct.
          *   Total: $0.10 - 0.28 = -0.18$. Correct.
          *   Type S: Easy (50/50 split). Trt: $0.5 \times 0.25 + 0.5 \times 0.75 = 0.50$. Ctrl: $0.5 \times 0.10 + 0.5 \times 0.50 = 0.30$. Marginal OR: $(0.5/0.5) / (0.3/0.7) = 1 / 0.428 = 2.33$. Conditional ORs: $(0.25/0.75)/(0.1/0.9) = 0.333/0.111 = 3$. $(0.75/0.25)/(0.5/0.5) = 3/1 = 3$. Correct.
          *   RR Check: Easy: $0.25/0.10 = 2.5$. Hard: $0.75/0.50 = 1.5$. Marginal: $0.50/0.30 = 1.67$. Correct.
      *   **Point 2 (Collapsibility):**
          *   This is the big one. RD is collapsible. OR is not. RR is *not* collapsible in the strict sense (Greenland & Robins). However, RR does not exhibit Simpson's *reversal* (sign change) under the null if weights are positive, but the marginal RR is not a weighted average of stratum RRs. The draft says "Risk ratios are... also between them." This is true in this example, but not guaranteed mathematically like RD. I need to correct the "RR is collapsible" claim. It's "non-collapsible but less prone to reversal than OR."
      *   **Point 3 (Three-way split):**
          *   Type M vs Type C is a crucial distinction. M is confounding (or chance imbalance). C is selection bias/mediation. They are causally distinct. M is pre-treatment. C is post-treatment. This distinction does real work.
      *   **Point 4 ("Effect is a function"):**
          *   This is the "Potential Outcomes" framework + "Transportability." The specific phrasing "function of three arguments" maps to: (a) Target Population, (b) Effect Measure, (c) Causal Estimand (ATE vs CDE). It's not new, but it's a very good engineering translation. Don't call it new, call it "operationalizing the Potential Outcomes framework."
      *   **Point 5 (Weakest Part):**
          *   The "Type M is a bug" claim. In small samples, random imbalance happens. It's not a code bug, it's stochasticity. Also, the RR collapsibility claim.
      *   **Point 6 (Missing/Interesting):**
          *   Effect Modification (Interaction). The draft assumes constant effects in Type M. What if Treatment helps Mobile but hurts Desktop? Then the aggregate depends entirely on the mix. This isn't Simpson's Paradox (reversal), it's just heterogeneity. But it's relevant to "which number to report."
