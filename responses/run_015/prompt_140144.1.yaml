  6.  **Final Polish:** Check against the 6 specific questions. Ensure the "Bet" is clear.

      *(Self-Correction during drafting)*: I need to make sure I don't get bogged down in the math of collapsibility proofs. Just state the fact: RR is not collapsible.
      Also, on Type M: The author says "if the arms have the same mix... reversal on the difference scale is arithmetically impossible." This is true. That's the definition of no confounding.
      On Type C: The author distinguishes "Total Effect" vs "Controlled Direct Effect." This is precise.
