      *   **Searle's Position:** Conscious minds have *Original Intentionality*. It's intrinsic. A thought *is* about something. Artifacts (like thermostats or coin sorters) have *Derived Intentionality*. They are only "about" something because we (with original intentionality) use them that way. If we vanish, the thermostat isn't "trying" to regulate temperature anymore.
