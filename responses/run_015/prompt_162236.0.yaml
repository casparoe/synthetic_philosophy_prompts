      *   *Refinement:* Use "Selected Effect" vs. "Current Utility." Searle insists on the *phenomenology* (what it feels like). Biology ignores that. I need to highlight that gap.

      *   *Translation Strategy:*
          *   **Original Intentionality:** Treat as "Endogenous Selected-Effect Function." The organism's states track environmental variables because selection history shaped them to do so *for the organism's sake*.
