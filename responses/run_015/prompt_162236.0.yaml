answer: |-
  Here is the dispute restated in your vocabulary, followed by the residue report and the status of the consensus.

  ### The Dispute Translated into Evolutionary Biology

  **The Core Variable:**
  Let's treat "Intentionality" as **Representational Tracking**. A system has representational tracking if its internal states correlate with states of the world in a way that guides behavior. The question is: What is the selection history of that tracking, and does the *source* of the selection matter for the status of the tracking?

  **Searle's Position (The "Endogenous Function" View):**
  Searle argues there is a categorical difference between **Adaptations** (organisms) and **Artifacts** (machines).

  1.  **Organisms (Original Intentionality):** An organism's neural states track environmental variables (e.g., "predator nearby") because natural selection shaped those states to do so *for the sake of the organism's fitness*. The "aboutness" is intrinsic to the physiology. It is an **Endogenous Selected-Effect Function**. Even if no external observer is present to interpret the neural state, the state is still "about" the predator because the selection history hardwired that correlation.
  2.  **Artifacts (Derived Intentionality):** A coin-sorting machine tracks "quarter-ness" only because a human designer (an external selective agent) built it to do so *for the sake of the human's goals*. The machine has no fitness of its own. Its function is **Exogenous Assigned Function**. If the humans vanish, the machine is just metal moving metal. It has no "sake" of its own.
  3.  **The Claim:** You cannot get Endogenous Function from Exogenous Assignment. You cannot build a system that *really* cares about the output just by stacking parts that *don't* care. The organism's "caring" (original intentionality) is a biological primitive, not a derived property.

  **Dennett's Position (The "Selection History Continuum" View):**
  Dennett argues the categorical line Searle draws is an artifact of ignoring the selection history of the organism itself.

  1.  **Organisms as Artifacts of Selection:** Organisms are not designed by a conscious mind; they are designed by Natural Selection. Natural Selection is a blind, algorithmic process, much like a breeder who doesn't understand the traits they are selecting. If the "Original Intentionality" of a human mind is the product of this blind process, then our "Original Intentionality" is actually **Derived from the Selection Pressure**. We are, in a sense, artifacts of the environment.
  2.  **The Wandering Two-Bitser (Exaptation/Plasticity):** Consider the coin-sorter moved to a new country (the "wandering two-bitser"). It sorts local coins perfectly, though it was selected (designed) for US quarters.
      *   **Searle says:** It still only has derived intentionality (about US quarters), it's just coincidentally sorting the new coins.
      *   **Dennett says:** If it works reliably in the new niche, its function has shifted. This is **Exaptation**. If a neural circuit evolved to track snakes but is co-opted to track written words (a new niche), does it lose "original" intentionality? Dennett argues that "aboutness" is determined by current reliability in a niche (Current Utility), not just deep phylogenetic history (Selected Effect).
  3.  **The Claim:** There is no magic "intrinsic" tracking. There is only **Reliable Correlation** established by selection history (whether artificial or natural). If a system (brain or machine) discriminates states of the world reliably enough to sustain its own persistence, it has intentionality. The distinction between "original" and "derived" is a difference in degree of complexity and autonomy, not a difference in kind.

  ***

  ### Residue Report

  Here is what survives the translation, what breaks, and what vanishes.

  #### 1. Clean Translations
  *   **Selected Effect vs. Assigned Function:** Searle's "Original" maps cleanly to **Etiological Function** (what a trait was selected for). "Derived" maps to **Artifact Function** (what a user intends). Biologists distinguish between a heart beating (selected effect) and a heart used as a paperweight (assigned function). This distinction is robust in biology.
  *   **The Wandering Two-Bitser as Exaptation:** The scenario of the machine working in a new environment maps perfectly to **Exaptation** or **Phenotypic Plasticity**. A trait evolved in Context A functions in Context B. The debate over whether the function *is* A (history) or *is* B (current utility) is a live debate in philosophy of biology (the "Selected Effect" vs. "Causal Role" dispute), so the translation holds.
  *   **Blind Designer:** Dennett's claim that Natural Selection acts like a designer without a mind is standard evolutionary theory. Translating "human designer" to "selective agent" works without distortion.

  #### 2. Distorted Translations
  *   **Normativity (Error Conditions):** In philosophy, intentionality requires the possibility of *misrepresentation* (thinking there is a predator when there isn't). In biology, we have **Malfunction** (a heart that doesn't pump) or **False Signal** (a警戒 call with no predator).
      *   *The Distortion:* Biological malfunction is defined by fitness reduction or deviation from the selected effect. Philosophical error is defined by *truth conditions*. A brain state can be "false" even if it increases fitness (e.g., an adaptive delusion). Biology struggles to define "false representation" without referencing an external observer's truth metric, which Searle claims is internal.
  *   **Autonomy:** Searle treats the organism as a self-contained locus of value ("for the organism's sake"). Dennett treats the organism as a node in a causal network. Biology usually treats the organism as a vehicle for genes (in the Dawkins sense) or a replicator. Translating "Original Intentionality" to "Organismal Fitness Interest" works, but it smuggles in the assumption that the *organism* is the unit of selection, which is contested in biology.

  #### 3. No Counterpart (The Leftover)
  *   **Phenomenology (The "What It Is Like"):** This is the big one. Searle's argument ultimately rests on the fact that *you feel* your thoughts are about things. A coin sorter does not feel anything. Biology has no vocabulary for first-person subjectivity. It describes the *mechanisms* of discrimination (neurons firing), not the *experience* of discrimination.
      *   *Searle's leverage:* He claims you cannot explain the *feeling* of aboutness using third-person selection history.
      *   *Dennett's leverage:* He claims the *feeling* is a user-illusion generated by the complexity of the mechanisms.
      *   *Biology's status:* Biology is methodologically naturalistic; it assumes third-person descriptions are sufficient. It has no tools to measure or model "intrinsic experience."
  *   **Intrinsic Normativity:** Searle claims the mind *imposes* conditions of satisfaction. Biology describes *causal* satisfaction (needs met). Whether a need being met feels like "truth" to the system is outside biological scope.

  ***

  ### Evaluation of the Leftover

  **Is the leftover a gap in biology, or a sign the philosophical fight is insubstantial?**

  *   **View A (The Biologist's Suspicion):** The leftover (phenomenology) is an epiphenomenon. Once you explain the selection history, the neural circuitry, and the behavioral output, there is nothing left to explain. The "feeling" of original intentionality is just the system monitoring its own tracking states. From this view, Searle is reifying a user-interface feature into a metaphysical substance. The fight is insubstantial because it relies on a intuition (first-person authority) that science has no obligation to honor.
  *   **View B (The Phenomenologist's Defense):** The leftover is the only thing that matters. You can describe all the selection pressures and neural correlates of a bat's sonar, but you still haven't explained what it *is like* to be the bat. If biology cannot account for the first-person perspective, biology is incomplete. From this view, the fight is substantive because it highlights the Hard Problem of Consciousness. Selection history explains the *structure* of the mind, but not the *presence* of the mind.

  **My Assessment:**
  If you restrict yourself to **functional explanation** (how the system works and why it persists), Dennett's translation is sufficient. The "Original vs. Derived" distinction collapses into "Complex Adaptive System vs. Simple Tool."
  However, if you include **conscious experience** as data that needs explaining, Searle has a point that biology currently ignores. Biology explains the *vehicle* of intentionality, but neither side has a settled account of how the *content* becomes conscious.

  ***

  ### Status Report: Settled vs. Contested

  Since you asked specifically about what is established versus what is camp shouting, here is the breakdown within the philosophy of mind and biology community.

  **Settled (High Consensus):**
  1.  **Naturalism:** Almost everyone agrees that minds are natural phenomena produced by evolutionary processes. Supernatural explanations are out.
  2.  **The Artifact Analogy:** It is accepted that comparing brains to computers or artifacts is a useful heuristic, provided one remembers brains are evolved, not engineered.
  3.  **No Consensus on Intentionality:** There is **no settled definition** of intentionality that satisfies both camps. There is no agreed-upon test to determine if a system has "original" intentionality.

  **Contested (Live Disputes):**
  1.  **Teleosemantics:** The project of defining mental content purely in terms of selection history (Teleosemantics) is highly contested. Some argue selection history fixes content (e.g., a frog's snap is about *flies* because that's what it selected for), others argue it's too indeterminate (it's about *small moving dots*, or *nutrients*). This is the technical version of Dennett's critique.
  2.  **The Hard Problem:** Whether consciousness (and thus Original Intentionality) is reducible to functional/structural description is the biggest divide. Physicalists (like Dennett) say yes. Non-reductive physicalists or dualists (like Searle, though he calls himself a biological naturalist) say no.
  3.  **The Intentional Stance:** Dennett's claim that intentionality is a matter of *interpretation* (if it looks like it has beliefs, treat it as having beliefs) is contested. Realists say beliefs are internal causal states; Instrumentalists (Dennett) say they are predictive tools.

  **Summary for your purposes:**
  You can safely use selection history to explain the *origin* of discriminative capacities (function). You cannot use it to settle the *nature* of the experience of those capacities (phenomenology). Searle bets the latter is real and irreducible; Dennett bets it's a useful fiction. Biology, as a third-person science, operates *as if* Dennett is right, but it cannot prove Searle wrong because Searle's evidence is private.
