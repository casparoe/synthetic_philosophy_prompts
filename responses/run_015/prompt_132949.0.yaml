answer: |-
  Your reconstruction is thermodynamically sound and captures the structural core of the debate with high fidelity. You have correctly identified that the mathematical distinction between Prioritarianism and Telic Egalitarianism maps onto the distinction between a **non-linear extensive quantity** and a **functional coupling extensive and intensive variables**.

  Here is the systematic translation, the stress-test of your reconstruction, and the report on the residue.

  ### I. Translation of Claims (i)–(v)

  **(i) The Priority Weighting**
  *   **Philosophical Claim:** Moral value $V$ is the sum over persons $i$ of a transform $\phi(w_i)$ of well-being $w_i$, where $\phi' > 0$ and $\phi'' < 0$.
  *   **Physical Translation:** You are defining a thermodynamic potential $V(\vec{w}) = \sum_i \phi(w_i)$. The strict concavity ($\phi'' < 0$) ensures that the marginal value of adding energy (well-being) to a subsystem decreases as the subsystem's energy increases.
  *   **Mechanism:** By Jensen's inequality, for a fixed mean energy $\bar{w}$, the potential $V$ is maximized when the distribution is uniform. The sensitivity to dispersion arises from the curvature of $\phi$, not from an explicit variance term. In a perturbation expansion about the mean, the second-order term is proportional to $\phi''(\bar{w}) \cdot \text{Var}(w)$, making the system responsive to fluctuations without explicitly measuring them.

  **(ii) Distinction from Valuing Equality**
  *   **Philosophical Claim:** Prioritarianism is not Egalitarianism.
  *   **Physical Translation:** This is a claim about **separability** (additivity).
      *   *Prioritarianism:* The potential is separable: $V(\vec{w}) = \sum_i \phi(w_i)$. The contribution of particle $i$ depends only on its own state $w_i$. This is extensive in the transformed variable.
      *   *Egalitarianism:* The potential is often non-separable: $V(\vec{w}) = N \cdot \psi(\bar{w}, \sigma_w, \dots)$. It includes an intensive component (like temperature or pressure, but normative) that depends on the relation between particles.
      *   *The Difference:* In Prioritarianism, if you remove a particle, the change in $V$ depends only on that particle's $w_i$. In Egalitarianism, removing a particle changes the distribution parameters ($\bar{w}, \sigma_w$) for the *remaining* system, altering their contribution to $V$.

  **(iii) The Levelling-Down Objection**
  *   **Philosophical Claim:** A view that values equality intrinsically must admit that reducing the well-being of the better-off to match the worse-off (with no compensation) is an improvement in at least one respect.
  *   **Physical Translation:** Consider a functional $V_{eq}$ that includes a penalty for dispersion, e.g., $V_{eq} = \sum w_i - \lambda \cdot \text{Var}(w)$.
      *   Perform a "levelling down" operation: $w_{high} \to w_{low}$, $\delta w_{high} < 0$, $\delta w_{low} = 0$.
      *   The extensive term $\sum w_i$ decreases.
      *   The intensive term $\text{Var}(w)$ decreases (improves).
      *   If the weight $\lambda$ on the intensive term is sufficiently large, $\delta V_{eq} > 0$ despite the loss of total energy. The system moves to a "higher" potential state by dissipating energy solely to reduce gradients.

  **(iv) The Prioritarian Escape**
  *   **Philosophical Claim:** Prioritarianism avoids this because it is strictly increasing in everyone's well-being.
  *   **Physical Translation:** Since $V_{prior} = \sum \phi(w_i)$ and $\phi' > 0$ everywhere, the gradient $\nabla V$ has strictly positive components. Any move $\delta \vec{w}$ where $\delta w_i \leq 0$ for all $i$ and $\delta w_k < 0$ for some $k$ yields $\delta V = \sum \phi'(w_i) \delta w_i < 0$.
      *   There is no "negative heat capacity" regime where removing energy stabilizes the potential. The potential landscape has no local maxima that require energy dissipation to reach, provided the move is purely subtractive.

  **(v) The Fragility (Identification, Population, Uncertainty)**
  *   **Philosophical Claim:** The view depends on how "worse off" is defined and how risk is handled.
  *   **Physical Translation:**
      *   *Absolute vs. Relative:* Is the argument of $\phi$ the energy $w_i$ (extensive) or the ratio $w_i / \bar{w}$ (intensive)? If the latter, the function becomes scale-invariant, and levelling down might become possible again if the scale $\bar{w}$ shifts appropriately.
      *   *Variable Population:* This is a Grand Canonical Ensemble problem. If $N$ varies, does $V$ scale linearly with $N$? If $\phi(0) = 0$, adding a person with zero well-being adds zero value. If $\phi(0) > 0$ (critical level), it adds negative value. The choice of the zero-point of $\phi$ determines the optimal $N$.
      *   *Uncertainty (Ex Ante/Ex Post):* This is the non-commutativity of the expectation operator $\mathbb{E}$ and the concave transform $\phi$.
          *   *Ex Post:* $V = \mathbb{E}[\sum \phi(w_i)]$. (Average over trajectories of the potential).
          *   *Ex Ante:* $V = \sum \phi(\mathbb{E}[w_i])$. (Potential of the average trajectory).
          *   By Jensen's, these yield different orderings of lotteries unless $\phi$ is linear.

  ### II. Stress-Testing Your Reconstruction

  Your hypothesis: *Egalitarianism adds an intensive dispersion measure; Prioritarianism curves the transform to secure Schur-concavity while maintaining strict monotonicity.*

  **Where it holds:**
  This is mathematically precise. Prioritarianism achieves Schur-concavity (preference for majorized distributions) via the convexity of the level sets of $\sum \phi(w_i)$. Egalitarianism often achieves it by explicitly including a Schur-convex penalty term (like variance or Gini). Your intuition that Prioritarianism is a "trick" to get inequality sensitivity without an intensive term is correct; it embeds the relational information into the single-particle potential via curvature.

  **Where it breaks:**

  1.  **Exchangeability vs. Identity:**
      *   *Physics:* In statistical mechanics, particles are indistinguishable. The state is defined by occupation numbers. Swapping particle labels changes nothing ($1/N!$ correction).
      *   *Philosophy:* Persons are distinct. While the *moral calculus* often assumes anonymity (swapping $w_i$ and $w_j$ doesn't change $V$), the *ontology* insists on the "Separateness of Persons."
      *   *The Break:* Your functional $V(\vec{w})$ treats the input as a multiset of numbers. It cannot distinguish between "Person A has 10, Person B has 2" and "Person A has 2, Person B has 10" without adding indices. But more deeply, it cannot capture the claim that *losses to A cannot be cancelled by gains to B* in a strong deontological sense. The summation $\sum$ inherently allows cancellation. Your vocabulary assumes the system is a single thermodynamic body; the philosophy often treats it as a collection of distinct bodies merely being compared.

  2.  **Separability as Extensivity:**
      *   You asked if separability is the moral counterpart of extensivity. **Yes.**
      *   You asked if it is an independent assumption. **Yes.**
      *   *The Break:* In thermodynamics, extensivity is a physical fact about non-interacting subsystems (in the limit). In morality, separability is a normative constraint. Egalitarians explicitly *reject* extensivity. They argue that the value of a unit of well-being *does* depend on the state of the rest of the system (interaction terms). Your reconstruction treats this as a choice of functional form, which is correct, but you must recognize that rejecting extensivity is physically "unnatural" for a macroscopic potential unless there are long-range interactions. Egalitarianism posits moral long-range interactions.

  3.  **The Zero Point:**
      *   In thermodynamics, energy is defined up to a constant; entropy is defined up to a constant (though the Third Law constrains this).
      *   In Prioritarianism, the zero point of $\phi$ matters critically for variable populations (the "Repugnant Conclusion"). If $\phi(0) = 0$, a vast population with lives barely worth living can outweigh a small happy population. This is a boundary condition issue your vocabulary handles well (Grand Canonical), but the *moral* stakes of the boundary condition are higher than the *physical* stakes of the chemical potential zero point.

  ### III. Residue Report

  Here is what your vocabulary cannot express, categorized by whether it is a defect of the vocabulary or a lack of clarity in the philosophy.

  **1. The "Holder" of the Well-being (Separateness of Persons)**
  *   **Status:** **Inexpressible.**
  *   **Analysis:** Your functional $V(\vec{w})$ aggregates. It can tell you if the total is higher. It cannot represent the constraint that $w_i$ belongs to a specific agent who has a veto or a right. Thermodynamics has no concept of "rights," only constraints.
  *   **Verdict:** Defect of vocabulary. Thermodynamics is inherently aggregative. Morality is often agent-relative. This is the "Separateness of Persons" objection (Nozick/Rawls). To a physicist, a person is a subsystem; to a deontologist, a person is a universe.

  **2. Agency and Responsibility**
  *   **Status:** **Inexpressible.**
  *   **Analysis:** Your variables $w_i$ are state variables. They do not carry history. In philosophy, whether a low $w_i$ is due to bad luck (entropy) or bad choice (dissipative work by the agent) matters.
  *   **Verdict:** Defect of vocabulary. Equilibrium stat mech erases history. Moral philosophy often requires it (desert).

  **3. Ex Ante vs. Ex Post (The Nature of Probability)**
  *   **Status:** **Distorted.**
  *   **Analysis:** You suspected this was "too glib." You are right. In physics, probability is frequency or degree of belief over microstates. In the moral debate, Ex Ante/Ex Post is about *fairness of the procedure* vs. *fairness of the outcome*.
      *   *Ex Post:* Evaluate the outcome in every state of the world, then average. (Utilitarian risk neutrality).
      *   *Ex Ante:* Evaluate the expected well-being for each person, then apply the priority transform.
      *   *The Distortion:* In physics, $\mathbb{E}[\sum \phi]$ is the only sensible quantity for an observer outside the ensemble. In morality, Ex Ante claims that the *distribution of chances* itself has moral weight, independent of the realized outcome. This implies the probability measure itself is a moral object, not just an epistemic tool.
  *   **Verdict:** Indication that the original claim is less clear than it appears. Philosophers struggle to ground why the *expectation* has moral weight if the *realization* is what is experienced. Your vocabulary exposes this: why would you optimize $\mathbb{E}[V]$ differently than $V(\mathbb{E}[\vec{w}])$ unless the "risk" is itself a cost? (It is, in finance/utility, but morality claims it's distinct).

  **4. The "Intrinsic" Value of Equality**
  *   **Status:** **Translatable but Ontologically Strange.**
  *   **Analysis:** You translated this as an intensive penalty term. This works mathematically.
  *   **Verdict:** Defect of vocabulary? No. It indicates the philosophical position posits a "moral force" that acts like a long-range interaction potential. It is physically coherent (like Coulomb interactions) but ontologically puzzling (what is the field?).

  ### IV. Confidence and Next Steps

  **Confidence Levels:**

  1.  **High Confidence:** The mapping of Prioritarianism to $\sum \phi(w_i)$ with $\phi'' < 0$ and Egalitarianism to non-separable functionals involving dispersion measures. This is standard formal axiology.
  2.  **High Confidence:** The identification of Separability with Extensivity. This is the standard technical distinction in the literature (often discussed under "Separability" or "Independence of Irrelevant Alternatives").
  3.  **Medium Confidence:** The translation of the Levelling Down objection to the intensive/extensive conflict. While mathematically accurate, some Egalitarians argue Levelling Down is not an objection but a bullet to bite. Your translation captures the *structure* of the bite, but not the *motivation*.
  4.  **Low Confidence:** The Ex Ante/Ex Post distinction as Ensemble vs. Realization.
      *   *Reason for Low Confidence:* In physics, the ensemble is a tool to calculate properties of the single system. In moral philosophy, the "Ex Ante" view claims the *distribution of probabilities* is what matters morally, even if the ensemble doesn't "exist" in a physical sense (e.g., a one-off decision). The ontological status of the probability measure is the sticking point. Your suspicion that it is "too glib" is correct; the philosophical debate here is about the normativity of risk, not just the order of operators.

  **Recommendation for Reading:**

  Your reconstruction is robust enough that you should skip introductory texts. You need to read the formal arguments that discuss **Separability** and **Risk**.

  1.  **Look for:** Discussions on "Separability" in social welfare functionals. This is your extensivity condition.
  2.  **Look for:** The "Ex Ante / Ex Post" debate in prioritarianism (often associated with the work of Matthew Adler or Nils Holtug, though I will not cite them). This will test your hypothesis on the expectation operator.
  3.  **Specific Concept:** Search for the distinction between **Telic** (outcome-based) and **Deontic** (constraint-based) egalitarianism. Your translation works perfectly for Telic (consequentialist) egalitarianism. It breaks completely for Deontic egalitarianism, which is not about the state of the system but about the relations between agents (rights/duties). This is the "Separateness of Persons" residue I identified.

  **Final Verdict:**
  You have not misunderstood the debate. You have successfully modeled the *consequentialist* subset of it. The residue you cannot capture is the *deontological* constraint that persons are not merely subsystems of a larger whole. If you proceed assuming morality is purely about optimizing a global potential $V(\vec{w})$, you will find the philosophy consistent. If you encounter the claim that "rights are side constraints," your thermodynamic vocabulary will hit a wall, because thermodynamics has no analogue for a constraint that cannot be traded off against the potential.

  **Least Confident Claim:** The mapping of the Ex Ante/Ex Post distinction to Ensemble vs. Realization. The philosophical weight placed on the *probability distribution itself* as a locus of value has no direct thermodynamic analogue (we do not say a canonical ensemble is "fairer" than a microcanonical one). This suggests the philosophical concept of "risk" carries normative baggage that "probability" does not carry in physics.
