      *   *Psych/Neuro Angle:* They might focus on brain states. Need to ensure the distinction between "brain state causing feeling" and "brain state constituting well-being" is clear.
      *   *Timing:* 2 hours is long. Need a break.
      *   *Assessment:* Make it a "Design a Counter-Machine" or "Diagnose the Argument" task. Let's go with "Diagnose the Argument" using a new case (The Memory Machine).

  8.  **Finalizing the Architecture:**
      *   **Phase 1: Grounding (0-25 mins).** The Friendship Example. Define Well-being.
      *   **Phase 2: The Machine & The Target (25-50 mins).** Introduce EM. Clarify Target (MSA, not just Hedonism). Clarify Metaphysics vs. Epistemology.
      *   **Phase 3: The Nature of the Argument (50-60 mins).** Intuition Pump vs. Proof.
      *   **Break (60-70 mins).**
      *   **Phase 4: Nuance & Pleasure (70-90 mins).** Does pleasure matter?
      *   **Phase 5: Application & Assessment (90-120 mins).** Neuro/Psych implications + Final Exercise.

      *Wait, I need to be precise about where the MCs are headed off.*
      *   MC1 (Scope): Phase 1 (Theory Setup).
      *   MC4 (Deception): Phase 2 (Intro to EM).
      *   MC2 (Deductive): Phase 3 (Argument Status).
      *   MC3 (Pleasure): Phase 4 (Nuance).

      *Let's refine the Running Example criteria.*
      *   Must lack: Sci-fi elements, explicit mention of "well-being" initially.
