answer: |-
  ### Session Architecture: The Experience Machine
  **Duration:** 120 Minutes
  **Audience:** 15 Advanced Undergraduates (Phil/Psych/Neuro mix)

  ---

  ### Part I: Prerequisites & The Running Example (0–25 mins)
  **Goal:** Establish the distinction between Mental State Accounts (MSA) and Substantive Accounts without invoking Nozick yet.

  **What must be in place before the Machine works:**
  1.  **A Definition of Well-Being:** Students must distinguish *prudential value* (what is good *for* me) from *moral value* (what is good *simpliciter*) and *aesthetic value*. The EM targets prudential value.
  2.  **The Supervenience Claim:** They must understand that an MSA claims well-being *supervenes* on internal experience. If two lives feel identical from the inside, an MSA says they are equally good for the subject.
  3.  **The Reality Intuition:** They must access the intuition that *contact with reality* has independent value before the sci-fi element clouds the water.

  **The Running Example: "The Paid Companion"**
  *   **Scenario A:** You have a close friend. They listen to your problems, celebrate your wins, and genuinely care about your welfare.
  *   **Scenario B:** You have a close friend. They are a highly paid professional actor hired to simulate caring. They are flawless; you never detect the deception. Your internal experience of being loved is identical to Scenario A.
  *   **The Question:** "Setting aside the financial cost to you, which situation is *better for you*?"

  **Why this example works:**
  *   **Isolates the Variable:** It holds phenomenology constant (feeling loved) while varying the metaphysical fact (being loved).
  *   **Relatability:** It bypasses the "sci-fi fatigue" of the tank and grounds the intuition in social reality, appealing to both Phil (authenticity) and Psych/Neuro (social bonding mechanisms) students.
  *   **What it must lack:** It must lack **technological mediation**. If you introduce a "simulation device" here, students will conflate the intuition with fears about technology. It must also lack explicit mention of "well-being" initially; ask "Which life is better?" to let them volunteer the concept.

  **Preempting Misconception #1 (Scope of Target):**
  *   **When:** Minute 15, during the theoretical formalization of the example.
  *   **How:** When students argue Scenario A is better, ask: "Does this only refute the idea that 'pleasure is the only good'?" Guide them to see it refutes *any* theory where well-being is determined *solely* by internal states (including desire-satisfaction theories where the desire is merely to *feel* satisfied). Explicitly define the target as **Mental State Accounts**, not just Classical Hedonism.

  ---

  ### Part II: Introducing the Machine & The Metaphysical Claim (25–50 mins)
  **Goal:** Map the "Paid Companion" intuition onto the Experience Machine and secure the metaphysical reading.

  **Transition:** "Nozick takes this intuition about friendship and radicalizes it to cover *all* experiences."

  **Preempting Misconception #4 (Epistemology vs. Metaphysics):**
  *   **When:** Minute 30, immediately upon describing the Machine's stipulations.
  *   **How:** Students will inevitably say, "But I'd know it's fake," or "It's the deception that's bad."
  *   **Intervention:** Enforce the stipulation rigorously. "You do not know. You cannot tell. The deception is perfect." Then press: "If you never know, *what* is missing?" Force the answer away from 'knowledge' (epistemic) toward 'doing/being' (ontological). The loss is not the *belief* that you are writing a novel; the loss is the *fact* of writing a novel.

  **Preempting Misconception #2 (Deductive Refutation vs. Intuition Pump):**
  *   **When:** Minute 45, during the initial poll on whether they would plug in.
  *   **How:** If a student says, "Since I wouldn't plug in, Hedonism is false," correct the logic. Explain that the EM is a tool for **Reflective Equilibrium**. It tests the coherence of our intuitions against our theories.
  *   **Prompt:** "If 20% of the class says they *would* plug in, does the argument fail?" (Answer: No, it shows a clash of intuitions that requires theoretical adjustment, not a logical proof like *modus tollens*).

  ---

  ### Part III: Break (60–70 mins)

  ---

  ### Part IV: The Role of Pleasure & Disciplinary Integration (70–90 mins)
  **Goal:** Nuance the conclusion and engage the Psych/Neuro cohort.

  **Preempting Misconception #3 (Pleasure Doesn't Matter):**
  *   **When:** Minute 75.
  *   **How:** Students often swing from "Pleasure isn't everything" to "Pleasure is irrelevant."
  *   **Intervention:** Ask: "If the machine offered a life of mild contentment vs. a life of agony, would the reality constraint still hold?" Use this to show Nozick argues pleasure is *a* constituent of well-being, just not *the sole* constituent. The EM shows we value **Agency** and **Contact** *in addition to* Experience.

  **Psych/Neuro Integration:**
  *   **Discussion:** Invite the science students to describe the neural correlates. If the dopamine hits are identical in the Machine vs. Reality, what is the "Contact with Reality" variable?
  *   **Point:** This highlights the gap between *descriptive* neuroscience (what is happening in the brain) and *normative* philosophy (what makes that life good). The EM argues that well-being does not supervene on neural states alone.

  ---

  ### Part V: Assessment & Synthesis (90–120 mins)
  **Goal:** Verify grasp of the argument's structure, not the imagery.

  **The Final Exercise: "The Diagnostic Correction" (15 mins)**
  Distribute a short paragraph purporting to summarize Nozick's argument. It contains three subtle errors corresponding to the misconceptions. Ask students to identify and correct them in pairs.

  **Text:**
  > "Nozick's Experience Machine proves that hedonism is false because pleasure is not valuable. The argument works deductively: since no rational person would choose the machine, any theory based on mental states is logically impossible. Furthermore, the main problem with the machine is that it relies on deception; if we knew we were in the machine, it might be acceptable. Thus, Nozick shows that only objective achievements matter for well-being."

  **Expected Corrections:**
  1.  **Scope:** It targets *all* Mental State Accounts, not just Hedonism (and Hedonism isn't the only MSA).
  2.  **Logic:** It is an *intuition pump* for reflective equilibrium, not a *deductive proof* (and some rational people might choose it).
  3.  **Metaphysics:** The problem is not *deception* (epistemology) but the lack of *contact/agency* (metaphysics).
  4.  **Pleasure:** It does not show pleasure is *valueless*, only that it is not *exclusive*.

  **Debrief (15 mins):**
  Review the corrections. Ask the Philosophy students to articulate the normative claim and the Psych/Neuro students to articulate why the neural identity of the two states doesn't settle the normative question.

  **Closing Question (Last 5 mins):**
  "If we discovered tomorrow that 'contact with reality' is itself just a mental state we crave (a desire to be real), would the Experience Machine still work against Mental State Accounts?"
  *(This leaves them with the "Subjective vs. Objective" tension for the next session.)*
