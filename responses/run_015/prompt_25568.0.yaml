      *Let's refine the Assessment.*
      *   Ask them to construct a "Well-Being Meter." If it only measures dopamine, what does the EM show about the meter?

      *(Self-Correction on Assessment)*: Better to give them a modified thought experiment where the intuition is ambiguous, forcing them to articulate *why* the EM works. Or, ask them to defend the MSA against the EM.
