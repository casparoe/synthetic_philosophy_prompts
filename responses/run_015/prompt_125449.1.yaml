answer: |-
  # Q&A PREP SHEET: ELASTIC SPHEXISHNESS
  **Time:** 20 mins to showtime.
  **Goal:** Survive the seminar. Protect the core functionalist claim.
  **Tone:** Pragmatic, not metaphysical.

  ---

  ### THE OBJECTIONS (Ordered by Damage)

  #### 1. THE REGRESS / "WHO CALIBRATES?" (The Prayer Question)
  **Who asks:** The sharpest Compatibilist or the Visiting Researcher.
  **The Objection:** "You say free will is the *calibration* between rigidity and flexibility. But is the calibration mechanism itself sphexish? If yes, you haven't escaped determinism/regress. If no, you've just pushed the 'magic' free will up one level. Which is it?"
  **2-Min Reply:** "It's not magic, it's hierarchy. The calibration mechanism is itself a heuristic, but it operates on a longer timescale and higher abstraction than the habits it manages. It's 'sphexish about flexibility.' We don't need an infinite regress of homunculi; we need a system where higher-order heuristics monitor lower-order ones. The 'freedom' is in the system's ability to switch tracks, not in the tracks themselves."
  **Soft Spot:** If they press on *what triggers the switch*. If the trigger is deterministic, are we really "calibrating"?
  **Strategy:** **CONCEDE** that the calibration is causally determined. **DEFEND** that "free will" is the *label* for successful calibration, not the *cause* of it. Don't try to save libertarian agency.

  #### 2. THE "REDDESCRIPTION" CHARGE
  **Who asks:** Senior Compatibilist.
  **The Objection:** "This sounds like standard reasons-responsiveness (Fischer/Ravizza) dressed up in entomological drag. You're saying agents are free when they respond to reasons. Why do we need 'sphexishness' instead of just saying 'moderate reasons-responsiveness'?"
  **2-Min Reply:** "Reasons-responsiveness describes the *outcome*; Elastic Sphexishness explains the *architecture*. Compatibilism tells us *that* we respond to reasons; I'm telling you *how* cognitive resource allocation makes that possible. It explains why we *shouldn't* be responsive in low-stakes domains (efficiency) and identifies specific pathologies (miscalibration) that standard compatibilism misses."
  **Soft Spot:** If they argue your view adds no *normative* power over standard compatibilism.
  **Strategy:** **DEFEND** hard. This is your unique selling point. Emphasize the *cost* of flexibility.

  #### 3. THE NORMATIVITY OF "STAKES"
  **Who asks:** Any Philosopher.
  **The Objection:** "You say we need flexibility where it 'matters.' Who decides what matters? If an agent is rigid in a high-stakes situation because their heuristic says it's low-stakes, are they unfree? If so, you're defining free will as 'correct judgment,' which seems circular."
  **2-Min Reply:** "It's not about correct judgment, it's about access. An agent is unfree if they *cannot* access the flexible module when the environment demands it, regardless of their belief. Think of it like a circuit breaker. If the breaker trips when it shouldn't, the system is malfunctioning. Free will is the functional integrity of the switching mechanism, not the infallibility of the stake-assessment."
  **Soft Spot:** Distinguishing "cannot access" from "chose not to access."
  **Strategy:** **CONCEDE** that stake-assessment can be flawed. **DEFEND** that the *capacity* to override is the metric, not the success of the override.

  #### 4. THE INSECT STRAWMAN
  **Who asks:** Visiting Insect Researcher.
  **The Objection:** "You're relying on a 1970s view of insect behavior. Wasps aren't mindlessly rigid; they show adaptive flexibility. If your analogy rests on insects being 'determined robots,' your empirical foundation is rotten."
  **2-Min Reply:** "I'm not making an ethological claim about wasps; I'm using 'sphexishness' as a philosophical placeholder for cognitive encapsulation. Even if wasps are flexible, the *concept* of a module that runs to completion without environmental feedback is valid in human psychology (e.g., fixation errors). The wasp is a metaphor for encapsulation, not a literal model."
  **Soft Spot:** If they argue encapsulation doesn't exist in humans either.
  **Strategy:** **CONCEDE** the wasp science might be dated. **DEFEND** the psychological reality of encapsulation (e.g., Stroop effects).

  #### 5. THE COG PSYCH TERMINOLOGY CLASH
  **Who asks:** Cog Psych People.
  **The Objection:** "We call this 'automaticity' or 'procedural memory,' not sphexishness. Automatic processes aren't 'unfree,' they're just efficient. Your dichotomy suggests habits are threats to agency, but we know habits *constitute* agency."
  **2-Min Reply:** "I agree habits constitute agency. That's why I call it *Elastic* Sphexishness. The threat isn't the habit; it's the *inelasticity*. My view aligns with yours: agency breaks down only when the system loses the ability to interrupt the automatic process. I'm arguing for the integration of habit and control, not the supremacy of control."
  **Soft Spot:** Using "sphexish" pejoratively.
  **Strategy:** **CONCEDE** the terminology is provocative. **DEFEND** the functional distinction between "habit as tool" vs. "habit as master."

  #### 6. THE PATHOLOGY PROBLEM
  **Who asks:** Compatibilist with ethics interest.
  **The Objection:** "Consider an addict or someone with OCD. They are 'rigid' in high-stakes domains. On your view, they lack free will. But we still hold them responsible. Are you saying addiction eliminates moral responsibility?"
  **2-Min Reply:** "It mitigates it, proportionate to the miscalibration. If the 'switch' is chemically broken, responsibility is reduced. But if the switch works and they choose not to use it, responsibility remains. My view gives us a gradient for responsibility based on the *repairability* of the calibration mechanism, which is more useful than a binary free/unfree distinction."
  **Soft Spot:** Defining "repairability."
  **Strategy:** **CONCEDE** that responsibility is graded. **DEFEND** that calibration failure is the metric for that grading.

  #### 7. THE EVOLUTIONARY ORIGIN
  **Who asks:** Naturalist/Compatibilist.
  **The Objection:** "This calibration mechanism is evolved. It was selected for survival, not truth or freedom. If evolution built your 'elasticity,' isn't it just another deterministic chain?"
  **2-Min Reply:** "Yes, it's determined. But a calculator is determined to do math; that doesn't make the math wrong. Evolution built the mechanism to solve the problem of resource allocation. The 'freedom' is the successful operation of that evolved function. We don't demand eyes be 'free' from evolution to see; we don't demand will be 'free' from evolution to choose."
  **Soft Spot:** Equating biological function with normative freedom.
  **Strategy:** **DEFEND** hard. This is standard compatibilist ground. Stand firm.

  #### 8. THE "WHY BOTHER?" (Terminology)
  **Who asks:** Tired Grad Student.
  **The Objection:** "Even if this works, why call it 'free will'? Why not just 'cognitive flexibility'? You're inviting metaphysical confusion by using FW language."
  **2-Min Reply:** "Because the stakes are moral and legal, not just psychological. When we blame someone, we're asking: 'Could their calibration mechanism have overridden the habit?' If we strip the 'free will' label, we lose the link to responsibility. I'm reclaiming the term for a functionalist age."
  **Soft Spot:** It might be easier to just drop the term.
  **Strategy:** **DEFEND**. You need the normative weight of "Free Will."

  ---

  ### ⛔ THE NIGHTMARE SCENARIO (Your Prayer Question)
  **The Question:** "If the calibration mechanism is itself sphexish (automatic), then you are just a sphex watching a sphex watch a sphex. If it is *not* sphexish, where does it come from? You haven't solved the problem; you've just hidden the homunculus inside the calibration switch."
  **Why it kills you:** It suggests your "elasticity" is either determined (no freedom) or magical (libertarianism).
  **Emergency Reply:** "I am rejecting the dichotomy. I am a compatibilist. The switch *is* determined. 'Free Will' is just the name we give to a determined system that successfully models its own constraints and adjusts. There is no 'ghost' in the switch. If that's not 'free will' for you, then nothing is."
  **Backup:** If they push harder, **CONCEDE**: "Then I am defending a specific type of compatibilism, not a metaphysical escape."

  ---

  ### 🛡️ HOLD FIRM ON (Do Not Cave)
  1.  **Rigidity is not the enemy.** Do not let them paint you as saying "habits are bad." Habits are essential. The enemy is *context-inappropriate* rigidity.
  2.  **Determinism is compatible.** Do not try to wiggle out of causality. Your view *requires* determinism to make sense of heuristics.
  3.  **The Functional Definition.** Free will is a property of the *system architecture*, not a property of the *causal history*.

  ### 🏳️ CONCEDE UPFRONT (Save Time)
  1.  **The Wasp Metaphor:** Admit it's a philosophical toy, not rigorous biology. Don't fight the insect researcher on ethology.
  2.  **Libertarian Freedom:** Explicitly state you are not offering "could have done otherwise in the exact same causal conditions." Save yourself 10 minutes of debate.
  3.  **Terminology:** If they hate "sphexishness," offer "elastic automaticity" as a synonym. Don't die on the word.

  **Good luck. Keep it functional. Don't get metaphysical.**
