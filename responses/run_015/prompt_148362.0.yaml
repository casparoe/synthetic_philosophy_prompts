answer: |-
  # Desiderata for a Theory of Moral Compromise Between Incompatible Value Systems

  The following specification outlines the criteria that any adequate theory of moral compromise must satisfy to explain how agents operating within genuinely incompatible normative frameworks (e.g., rights-based deontology vs. longtermist consequentialism) can achieve stable, non-coercive cooperation.

  The desiderata are divided into two categories. **Non-Negotiable Desiderata** are structural requirements necessary for the phenomenon to count as *moral compromise* rather than mere modus vivendi, surrender, or coercion. **Camp-Specific Preferences** are constraints demanded by particular meta-ethical traditions; while not logically required for compromise to occur, an adequate theory must explain how it navigates these preferences to secure the adherence of agents from those camps.

  ---

  ## I. Non-Negotiable Desiderata
  *These conditions are essential for the conceptual coherence of "moral compromise." If a theory fails these, it describes power dynamics or strategic bargaining, not moral cooperation.*

  ### 1. The Authenticity Criterion (Distinguishing Compromise from Concession)
  **Status:** [Non-Negotiable]
  **Conceptual Motivation:**
  A theory must distinguish authentic moral compromise from strategic concession, bribery, or domination. In a strategic concession (modus vivendi), an agent complies solely due to a balance of power or fear of sanction. In bribery, compliance is purchased via external incentives unrelated to the moral claim. In domination, one framework is imposed on the other.
  **Requirement:**
  The theory must specify a mechanism wherein each party recognizes the *moral standing* of the other's framework, even while rejecting its substantive conclusions. The agreement must be motivated, at least in part, by a second-order moral commitment (e.g., a duty of civility, respect for agency, or epistemic humility) rather than solely by first-order strategic advantage.
  **Case Motivation:**
  Consider a Deontologist and a Longtermist negotiating AI safety protocols. If the Deontologist agrees to risky testing solely because the Longtermist controls the funding, this is domination/concession. If the Deontologist agrees because they recognize the Longtermist's sincere (albeit mistaken) concern for future lives as a valid moral consideration worthy of accommodation, this is compromise.

  ### 2. The Integrity Preservation Condition (Internal Coherence)
  **Status:** [Non-Negotiable]
  **Conceptual Motivation:**
  Agents cannot compromise if doing so requires them to violate the axiomatic core of their own value system. If a framework is abandoned to strike a deal, the agent is no longer operating within that framework, and the compromise is actually a conversion or a betrayal.
  **Requirement:**
  The theory must demonstrate how agents can endorse a joint action without asserting that the action is *optimally* justified by their own framework. It must allow for "second-best" endorsement where the action is permissible (or required by a higher-order duty to cooperate) even if it is not the first-order moral optimum.
  **Case Motivation:**
  A rights-based agent cannot agree to a policy that explicitly violates a fundamental right (e.g., sacrificing an innocent) even for great utility. The theory must show how they can agree to a *different* policy that yields significant utility without crossing the rights threshold, preserving their internal coherence.

  ### 3. The Incommensurable Gain Condition (Recognition Without Common Currency)
  **Status:** [Non-Negotiable]
  **Conceptual Motivation:**
  Genuinely incompatible systems often deny the commensurability of moral reasons (e.g., "rights are trumps" vs. "all values are fungible utility"). A theory cannot require a common metric (like utils) to validate mutual gains, as this begs the question against the non-consequentialist framework.
  **Requirement:**
  The theory must provide a method for recognizing "gains from trade" that relies on *ordinal* improvements within each framework rather than *cardinal* aggregation across frameworks. Each party must be able to verify that the cooperative outcome is better than the non-cooperative baseline *according to their own metrics*, without agreeing on why it is better.
  **Case Motivation:**
  In climate policy, a Longtermist sees reduced existential risk as a gain; a Presentist Deontologist sees reduced harm to current vulnerable populations as a gain. They need not agree on which gain is "larger," only that both gains exceed the status quo of inaction.

  ### 4. The Deontic Alignment Constraint (Justice vs. Charity)
  **Status:** [Non-Negotiable]
  **Conceptual Motivation:**
  Stability is undermined when one framework classifies an issue as a matter of justice/entitlement (owed) while the other classifies it as charity/supererogation (optional). If Party A views a resource transfer as a Right, and Party B views it as a Gift, Party A will feel aggrieved if Party B stops giving, and Party B will feel burdened if Party A demands.
  **Requirement:**
  The theory must offer a mechanism to stabilize this asymmetry. This usually involves "decoupling" the justification for the action from the classification of the duty. The agreement must create a *procedural entitlement* to the outcome that both accept, even if their substantive reasons for accepting it differ (one sees it as fulfilling a right, the other as fulfilling a voluntary commitment).
  **Case Motivation:**
  In global health distribution, a Human Rights framework demands distribution as justice. A Libertarian framework views it as charity. A stable compromise requires a treaty structure where the Libertarian agrees to binding contributions (treating the treaty obligation as self-imposed justice) while the Rights framework accepts the voluntary origin of the treaty (treating the outcome as sufficient justice).

  ---

  ## II. Camp-Specific Preferences
  *These are not logically required for compromise to exist, but they are demands specific moral traditions place on a theory to deem it acceptable. An adequate theory must explain why these preferences might remain unsatisfied without collapsing the compromise.*

  ### 5. The Moral Residue Preference (No Regret Requirement)
  **Status:** [Camp-Specific Preference]
  **Conceptual Motivation:**
  Some frameworks (particularly rationalist deontology and some forms of consequentialism) prefer that a justified action leaves no "moral remainder" or regret. They desire a clean justification where the chosen action is fully vindicated. Value Pluralists, however, expect moral residue (tragic choices where something of value is lost).
  **Requirement for Theory:**
  The theory must assess whether eliminating moral residue is possible. If not, it must explain why cooperation is stable *despite* the presence of regret.
  **Camp Divergence:**
  *   **Deontologists** often prefer no residue (the act must be permissible).
  *   **Pluralists** accept residue (the act is necessary but regrettable).
  *   **Consequentialists** may view residue as irrational if the outcome was optimized.

  ### 6. The Justificatory Neutrality Preference (Public Reason)
  **Status:** [Camp-Specific Preference]
  **Conceptual Motivation:**
  Contractualist and Liberal approaches often demand that the *reasons* for the compromise be shareable or neutral (Public Reason). Comprehensive doctrines (religious or strong meta-ethical systems) may reject this, insisting they can cooperate based on their own private truths without translating them into neutral language.
  **Requirement for Theory:**
  The theory must determine if agents must justify the compromise using shared premises or if they can rely on an "overlapping consensus" where justifications remain private.
  **Camp Divergence:**
  *   **Contractualists** prefer public justifiability.
  *   **Comprehensive Doctrines** prefer private justification with public acquiescence.

  ---

  ## III. Assessment of Joint Satisfiability

  **Status:** [Analytical Assessment]
  **Question:** Are these requirements jointly unsatisfiable? Does incommensurability necessarily undermine stability?

  **Assessment:**
  The Non-Negotiable Desiderata (1–4) are jointly satisfiable, but only if the theory abandons the Camp-Specific Preference for *Justificatory Convergence* (Desideratum 6).

  1.  **Incommensurability and Stability:** Claims of incommensurability do not undermine stability *if* the theory shifts the locus of agreement from *values* to *practices*. Stability is maintained not because both parties agree on the *value* of the outcome, but because they agree on the *procedure* that generated it. As long as the Integrity Preservation Condition (2) is met, agents can tolerate incommensurability.
  2.  **The Tension Point:** The primary risk of joint unsatisfiability lies between the **Deontic Alignment Constraint (4)** and the **Integrity Preservation Condition (2)**.
      *   If the Deontologist requires a policy be framed as "Justice" to maintain integrity, and the Libertarian requires it be framed as "Charity" to maintain integrity, a linguistic or conceptual impasse arises.
      *   **Resolution:** This is satisfiable only through *constructive ambiguity* or *institutional decoupling*. The institutional rule can be binding (satisfying Justice) while the participation remains voluntary (satisfying Charity). If a theory demands explicit semantic agreement on the *nature* of the duty, the requirements become jointly unsatisfiable.
  3.  **Impossibility Theorem:** A theory that demands (a) full internal coherence, (b) authentic moral motivation, and (c) shared justificatory reasons for incommensurable values is impossible. One must drop (c).

  **Conclusion on Stability:** Incommensurability does not undermine cooperation provided the theory accepts that agents cooperate *despite* disagreement on the fundamental nature of the good, rather than *because* of agreement. Stability relies on the mutual recognition of the other's integrity, not the alignment of their value metrics.

  ---

  ## IV. Brief Assessment of Philosophical Approaches

  *   **Contractualism:** Fares well on the **Authenticity Criterion** and **Deontic Alignment**, as it is built on mutual justification. However, it struggles with the **Incommensurable Gain Condition** if it requires reasons to be shareable, as deeply incompatible frameworks may lack shared premises.
  *   **Value Pluralism:** Fares excellently on the **Incommensurable Gain Condition** and **Moral Residue**, as it expects conflict and lack of common currency. It risks failing the **Integrity Preservation Condition** if it suggests values can be traded off too easily, which deontologists may view as corruption.
  *   **Virtue Ethics:** Fares well on **Authenticity**, focusing on the character of the agents and the mean between rigidity and capitulation. However, it may struggle with the **Deontic Alignment Constraint** in institutional settings, as virtue ethics is often agent-centered rather than structure-centered, making stable systemic cooperation harder to codify.
