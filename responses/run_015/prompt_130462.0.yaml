answer: |-
  Standby history is a fourth mode; it preserves potentiality rather than memory, and on a closed system, optionality is survival.

  **Standby: 0.45**
  This claims the largest share because technical and political redundancies are the only insurance against extinction when no external rescue exists.

  **Critical: 0.30**
  Without a living tradition to soften the blow, explicit instruction on judging and discarding failed systems is the only way to prevent institutional ossification.

  **Monumental: 0.15**
  Inspiration requires cultural context to land, so we minimize this to avoid creating myths that future generations cannot embody or verify.

  **Antiquarian: 0.10**
  Reverence for origins is a luxury that risks binding the crew to a Earth they will never see, so it receives the minimum viable allocation for basic orientation.

  ***

  **Risk of Overshoot (1–5)**
  *   **Standby: 2** (Excess creates clutter and decision paralysis, but rarely ideological poison.)
  *   **Monumental: 3** (Excess creates delusion and reckless heroics, but morale remains high.)
  *   **Antiquarian: 4** (Excess creates stagnation and refusal to adapt ship systems to new realities.)
  *   **Critical: 5** (Excess creates nihilism and mutiny against the authority structures keeping the air recycled.)

  **Cut Decision**
  If a cut must be made, eliminate **Antiquarian** entirely; knowing precisely where we came from is less vital than knowing where we could have gone, and identity can be rebuilt around the voyage itself rather than the departure point.
