answer: |-
  Thank you. For coming. I know… I know some of you are here for the philosophy. And some are here because you loved him. Some think he studied butterflies. He liked those too. But mostly he studied… how things stick. How one thing holds to another.

  I wanted to start by saying he's here. With us. But… if I say that, if I claim his presence binds this room… what binds the presence to the room? Is it us? Then what binds us to him? Memory? But memory is just another thing needing to be bound. I catch myself. Every time I try to close the distance, I find another gap. It's… it's dizzying. I look at you, and I want to say we are connected. But "connected" is just a word. What makes it true? Another connection? Then another?

  I wanted to say his ideas live in these papers we'll discuss. But ink isn't thought. What glues the thought to the page? And what glues that to us reading it? If I claim we're united by his legacy, I'm pretending the glue holds. He spent forty years showing us it doesn't. Not simply. To say he is "in" this work ignores what connects the "in" to the "work."

  So I can't tell you he's fully here. I can't promise his work binds us together without leaving something out. Every time I try to bridge the gap between him and this podium, I need another bridge. And another. It recedes.

  He taught me that honesty matters more than comfort. So I won't fake the connection. I won't say the relation holds. I'll just say… there was a man. There are these papers. There is this silence between them. Maybe the asking is the only thing that doesn't slip away. Thank you.
