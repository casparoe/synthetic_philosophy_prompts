prompt: |-
  im a retired cell biologist who got into philosophy about three years ago, and next tuesday im presenting at a small metaphysics-of-biology workshop. my view is that the classic statue-and-clay problem doesnt really apply to organisms because living things maintain identity through continuous proteostatic turnover and metabolic repair rather than through persistence of the same material bits. so i want to argue that an organism is more like a standing wave in a river than a statue made of clay: the parts are always different but the process-form is stable. from this i draw the conclusion that temporary-intrinsic arguments for four-dimensionalism fail in biology, since there is no momentary stage that shares all properties with the whole except being part of the same process. the audience is about eight analytic metaphysicians who know the constitution literature cold, plus two philosophers of biology who think metaphysics should stay away from empirical turnover rates. i need a Q&A prep sheet: the objections they will actually raise, ordered by likelyness and damage, phrased in their vocabulary not in some rationalist forum dialect, with a quick reply for each and an honest note on where the reply is weakest. also tell me what i should concede up front so i dont sound like im dismissing the standard puzzle. and please include the one objection im hoping nobody brings up—probably something about artifact constitution versus natural kind membership, but im not sure. no bibliographies or reading lists, just the objections and how to survive them. i also tend to misspell recieve, but thats not relevant here.
