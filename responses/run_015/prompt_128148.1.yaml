answer: |-
  **Q&A PREP SHEET: Metaphysics of Biology Workshop**

  **Strategy Note:** Your audience is split. The metaphysicians want to know if your view collapses into standard Endurantism or Perdurantism. The Phil-Bio crowd wants to know if you're over-extrapolating from cell culture data to ontological claims. Your goal is to show that "Process" is a third category, not just a poetic description of a spacetime worm.

  ### Part 1: Up-Front Concessions
  *Do not wait for these to be raised as objections. Weave them into your closing remarks or intro to show dialectical charity.*

  1.  **Concede the Artifact Case:** Explicitly grant that the Statue/Clay model works perfectly for artifacts. Statues *are* defined by their material configuration. Organisms are defined by functional continuity. This prevents the metaphysicians from accusing you of ignoring the standard literature.
  2.  **Concede Partial Persistence:** Acknowledge that not *all* biological material turns over (e.g., crystalline lens of the eye, some neuronal DNA). Clarify that your claim rests on *functional* proteostatic turnover (the system maintenance), not 100% atomic replacement.
  3.  **Concede the "Process" Burden:** Admit that "process ontology" risks being vague. Promise that you are not using "process" as a magic word, but as a claim about causal dependency relations.

  ---

  ### Part 2: The Objections (Ordered by Likelihood & Damage)

  #### 1. The "Spacetime Worm" Objection (High Likelihood / High Damage)
  **The Objection:** "You claim the organism is a standing wave, not a sum of temporal parts. But formally, a wave extended in time *is* a spacetime worm. If you admit the organism persists through time, aren't you just a Perdurantist who dislikes the terminology? What work is 'standing wave' doing that 'temporal parts' doesn't?"
  **The Vocabulary:** Perdurantism, temporal extension, spacetime worm, mereological sum.
  **Your Reply:** "A spacetime worm implies the past and future segments exist ontologically alongside the present. A standing wave exists *only* insofar as the flow is occurring *now*. If you stop the river, the wave vanishes. If you freeze a worm, it remains. My view is that the organism's existence is dependent on current metabolic activity, not the existence of its past stages."
  **Weakest Point:** This risks sounding like a distinction without a difference. If the wave has duration, it has parts. You need to insist that the *parts* (stages) are not ontologically prior to the *whole* (process).

  #### 2. The "Synchronic Constitution" Objection (High Likelihood / Medium Damage)
  **The Objection:** "Even if diachronic identity is process-based, what constitutes the organism *at t*? At any instant, there must be a material basis. If you deny the atoms constitute the organism, what is the relata of the constitution relation at a single time slice?"
  **The Vocabulary:** Synchronic identity, constitution relation, material basis, supervenience.
  **Your Reply:** "At *t*, the organism is constituted by the *arrangement and activity* of the matter, not the matter itself. The 'bits' are merely the medium. The identity conditions are fixed by the regulatory network (proteostasis), which is a relational property, not a mereological one."
  **Weakest Point:** Metaphysicians hate "activity" as a constituter. They will press you on whether "activity" is a property of the matter or a separate entity. If it's a property, you're back to matter + properties (standard view).

  #### 3. The "Temporary Intrinsics" Counter (Medium Likelihood / High Damage)
  **The Objection:** "You argue 4Dism fails because stages don't share properties with the whole. But Lewis's argument for temporal parts is precisely to solve how an object can be bent at t1 and straight at t2. If the organism is a single enduring entity, how do you handle temporary intrinsics without contradiction?"
  **The Vocabulary:** Temporary intrinsics, Lewis's argument, property instantiation, contradiction.
  **Your Reply:** "The properties belong to the *process*, not the stage. A stage cannot be 'an organism' any more than a single frame of a movie is 'the plot.' The stage has the property of 'participating in the process.' Change is a modulation of the process, not a replacement of parts."
  **Weakest Point:** This requires rejecting standard predicate logic regarding property instantiation. They may accuse you of changing the logic to save the theory.

  #### 4. The "Empirical Overreach" Objection (Medium Likelihood / Medium Damage)
  **The Objection:** (From the Phil-Bio crowd) "You're grounding a metaphysical thesis on turnover rates. But turnover varies wildly across taxa and tissues. If a tardigrade enters cryptobiosis and turnover stops, does the organism cease to exist and a new one arise upon rehydration? Your ontology seems hostage to empirical contingencies."
  **The Vocabulary:** Cryptobiosis, natural kinds, empirical contingency, essentialism.
  **Your Reply:** "Cryptobiosis is a suspended process, not a terminated one. The *capacity* for proteostatic repair remains encoded (e.g., in DNA structure). The wave analogy holds: a wave can be dampened to near-zero amplitude without the medium losing the potential to propagate."
  **Weakest Point:** If the potential is encoded in the DNA, and the DNA persists materially, you've conceded that *some* material persistence is doing the heavy lifting for identity.

  #### 5. The "Causal Exclusion" Objection (Low Likelihood / High Damage)
  **The Objection:** "If the atoms and molecules are doing all the causal work (binding, reacting, moving), what causal work is left for the 'process' or 'wave' to do? Are you positing a ghostly entity that overdetermines the physical effects?"
  **The Vocabulary:** Causal exclusion, overdetermination, physical closure, causal powers.
  **Your Reply:** "The 'process' is the constraint on the matter. Without the regulatory form, the atoms would diffuse. The process exerts top-down causal constraint on the material constituents, directing their behavior."
  **Weakest Point:** "Top-down causation" is controversial in analytic metaphysics. Be prepared to define it as "constraint" rather than "force."

  ---

  ### Part 3: The "Dreaded Objection" (Natural Kind vs. Artifact)
  *This is the one you fear. It attacks the motivation of the view.*

  **The Objection:** "You distinguish organisms from statues to save the organism from the constitution puzzle. But doesn't this just create a dualism of persistence conditions? If a human is a 'wave' and a prosthetic limb is 'clay,' what happens when they integrate (cyborgs, transplants)? Are you arguing that Natural Kinds have different metaphysical persistence conditions than Artifacts, or are you just saying we *treat* them differently?"
  **The Vocabulary:** Natural kinds, artifact ontology, persistence conditions, metaphysical dualism, pragmatic vs. realist.
  **Your Reply:** "I am arguing for a realist distinction based on causal structure. Artifacts have imposed function; organisms have immanent function (self-maintenance). When a prosthetic integrates, it is either assimilated into the metabolic process (becoming 'wave') or remains an external tool. The metaphysics tracks the causal boundary, not our linguistic treatment."
  **Weakest Point:** This is the hardest line to hold. If the prosthetic is made of titanium and doesn't turnover, but is "part" of the organism, your material turnover criterion for identity gets messy. **Honest Note:** If pressed here, concede that boundaries are fuzzy but insist the *core* mechanism (metabolism) remains the primary identity condition.

  ### Survival Tip
  If you get stuck on a technical metaphysical term (e.g., "supervenience," "haecceity"), do not bluff. Say: *"In biological terms, we would model that as [X]. Does that map onto your usage?"* They will respect the empirical grounding more than a failed philosophical jargon attempt.
