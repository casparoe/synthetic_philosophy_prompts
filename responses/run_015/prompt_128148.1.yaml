      *   *Argument against 4Dism:* Temporary intrinsics don't work because stages don't have the properties of the whole (the property is "being this process").
      *   *Weakness 1 (Metaphysical):* Is "process" just a shorthand for a temporal parts sum? (The 4Dist counter-attack).
