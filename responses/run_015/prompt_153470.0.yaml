answer: |-
  0.35

  This figure represents my credence that the standard inefficacy objection ("my action won't change the outcome, therefore I have no obligation") applies with **equal moral force** to individual climate mitigation and voting in high-turnout elections. A lower number indicates that the objection is significantly stronger against climate action than against voting, despite identical causal pivotality.

  This calculation assumes a **Causal Decision Theory (CDT)** framework for estimating pivotal probabilities. Under Evidential Decision Theory (EDT), voting often gains correlational weight (your vote evidences others' votes), which would further diverge the two cases and lower this credence. The CDT framing is the "best case" for equality.

  ### Decomposition of Reasoning

  **(a) Differential in Pivotal Probabilities or Causal Pathways**
  *   **Assigned Probability of Equality:** 0.95
  *   **Reasoning:** The prompt explicitly controls for causal redundancy (>99.99% non-pivotal). Under CDT, the expected causal utility of a single ton of CO2 and a single vote in a large electorate are both effectively zero. The physical aggregation differs (threshold vs. continuous sum), but given the scale, the *practical* causal isolation is identical.
  *   **Framework Marker:** This probability is contingent on the **CDT framing**. If EDT were applied here, the probability of equality would drop to ~0.60, as voting has stronger evidential correlations with peer behavior than private carbon reduction does.

  **(b) Signaling, Coordination, or Expressive Value**
  *   **Assigned Probability of Equality:** 0.25
  *   **Reasoning:** Voting is inherently an expressive act within a constituted institution; the act *is* the participation, regardless of the count. Climate mitigation is often private (e.g., home insulation, diet) and lacks inherent coordinative signaling unless publicized. Because voting carries independent non-causal value (civic expression) that climate action often lacks, the inefficacy objection (which targets *causal* impact) bites less deeply into the total obligation to vote.

  **(c) Epistemic Asymmetry (Visibility-Selection)**
  *   **Assigned Probability of Equality:** 0.50
  *   **Reasoning:** Electoral results are discrete and publicly verified; climate harm is diffuse and statistically modeled. While this creates a psychological asymmetry in how agents *feel* responsibility, it is normatively ambiguous whether visibility alters *actual* moral responsibility. I assign 0.50 to reflect agnosticism on whether epistemic access is a prerequisite for moral culpability in collective harm cases.

  **(d) Moral Obligation: Causal Efficacy vs. Cooperative Membership**
  *   **Assigned Probability of Equality:** 0.30
  *   **Reasoning:** This is the meta-ethical weight. If obligation is purely consequentialist, both acts stand or fall together (Equality ≈ 1.0). However, if obligation derives from "fair play" or cooperative membership, Voting qualifies as a formal scheme with clear rules, whereas climate mitigation is an informal, global commons problem. The "fair share" argument is structurally stronger for voting. Therefore, it is unlikely (0.30) that the *basis* for obligation is identical for both acts. If the basis differs, the inefficacy objection (which attacks only one basis) will apply with unequal force.

  ### Synthesis

  The high causal equivalence (0.95) is overwhelmed by the normative asymmetries. The inefficacy objection succeeds in negating obligation only to the extent that obligation relies on causal efficacy.
  *   **Voting:** Obligation = Causal (0) + Expressive (High) + Civic Duty (High). Inefficacy removes a small fraction of the total justification.
  *   **Climate:** Obligation = Causal (0) + Complicity (Medium) + Expressive (Low). Inefficacy removes a large fraction of the total justification.

  Because the *composition* of the obligation differs, the *force* of an objection targeting only one component (efficacy) must differ.

  ### The Biggest Lever

  **Sub-question (d): Whether moral obligation requires causal efficacy or only reasonable membership.**

  This is the single point of maximum sensitivity.
  *   **Current View:** Obligation is mixed (partly causal, partly duty-based), and Voting fits the "duty" category better than Climate. This keeps the credence at **0.35**.
  *   **Shift Condition:** If it were resolved that moral obligation in collective action contexts is **strictly and exclusively consequentialist** (efficacy is the *only* thing that matters), my credence would shift immediately to **0.95**. The causal pathways (a) are already controlled as equal; if efficacy is the only metric, the acts are morally identical.
  *   **Conversely:** If it were resolved that obligation is **strictly deontological** (efficacy is irrelevant), the inefficacy objection would have *zero* force for both, also raising the credence in "equal force" (at zero) to **0.90**.

  The current low figure (0.35) exists specifically because I assess that we inhabit a middle ground where Voting is treated as a duty (insulated from inefficacy) while Climate Action is treated largely as a consequentialist intervention (vulnerable to inefficacy). Resolving the meta-ethical status of obligation collapses this distinction.
