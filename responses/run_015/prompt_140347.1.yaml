  6.  **Structuring the Response:**
      *   **Overview:** Time, Grouping, Objective.
      *   **Materials:** What to print.
      *   **The Setup:** Instructions (scripted to avoid leaks).
      *   **Round 1 (The Story):** Inside view.
      *   **Round 2 (The Catalogue):** Choosing classes with costs.
      *   **Scoring:** The Math.
      *   **The Reveal:** Actuals.
      *   **Debrief:** Mapping the experience to theory.
      *   **Failure Modes:** What will go wrong.
      *   **Limitations:** What you have to lecture.

  7.  **Fleshing out the Details (Mental Walkthrough):**
      *   *Time:* 10 min intro, 15 min R1, 20 min R2 (discussion + choice), 10 min Scoring, 20 min Debrief. Total 75. Perfect.
      *   *Groups:* 6 teams of 3. Encourages consensus (which exposes the inside-view bias socially).
      *   *Cases:* Let's use **"Time to Completion"** for a specific milestone.
      *   *Reference Classes:* Call them "Data Archives."
      *   *Cost:* Deduct from Round 2 score.
      *   *Scoring:* Keep it simple. 100 points max per round. Penalty = (Error^2) / 5.
      *   *The "Trap":* The Narrow Archive looks perfect but has a small sample size (n=3) leading to high variance, or the cost is just too high for the marginal accuracy gain. Let's go with **Cost vs. Accuracy Trade-off.** The Broad Archive is free. The Narrow Archive costs 20 points. The accuracy gain is usually less than 20 points worth of error reduction.

  8.  **Final Polish:**
      *   Ensure tone is peer-to-peer (third-year to second-years) but authoritative on the rules.
      *   Make sure the "Quadratic Rule" is explained simply on the board.
      *   Check the "No Money" constraint. Points are fine.
      *   Check the "Invented Data" constraint. Label it clearly.

      *(Self-Correction on Reference Class Cost)*: If I charge points, they might just all go Broad to save points. I need to make the Narrow data *look* much better so they are tempted. The Broad data should have a huge range (e.g., 6-24 months). The Narrow data should have a tight range (e.g., 10-12 months). If the Actual is 11, Narrow wins on accuracy. If Actual is 18, Broad wins. To make the point that "Outside View averages noise," I should set the Actuals such that the **Mean of the Broad Class** is closer than the **Adjusted Narrow Prediction**.
      *Actually, the prompt says:* "some of the outside view's edge is just that it averages out case noise."
