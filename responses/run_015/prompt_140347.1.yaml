answer: |-
  Here is a complete design for **"Project Horizon."** It fits your 75-minute slot, works for 18 students (split into 6 teams of 3), and uses invented data to force the structural points you want without needing real-world validation.

  ### **Game Overview**
  *   **Time:** 75 Minutes.
  *   **Players:** 18 students (6 teams of 3).
  *   **Goal:** Maximise team points across two rounds of forecasting.
  *   **Metric:** Forecasting **Duration (in Months)** to reach a specific milestone.
  *   **Constraint:** No use of the words "Base Rate," "Reference Class," or "Outside View" until the Debrief.

  ---

  ### **1. Materials Needed**
  1.  **Case Cards (Round 1):** 3 distinct scenarios (printed, one per team).
  2.  **Data Archive Catalogue (Round 2):** A menu of 3 "Archives" per case.
  3.  **Data Archive Contents:** Sealed envelopes or hidden slides containing the historical data for each Archive (revealed only after purchase).
  4.  **Scoreboard:** Whiteboard to track team points.
  5.  **Scoring Formula:** Written clearly on the board.

  ---

  ### **2. The Scoring Rule (Quadratic)**
  Write this on the board immediately. Keep it simple.
  *   **Starting Points per Round:** 100
  *   **Penalty:** $\frac{(\text{Prediction} - \text{Actual})^2}{5}$
  *   **Round 2 Cost:** Deducted from final Round 2 score.
  *   **Example:** If Actual is 10 months, and you predict 12.
      *   Error = 2. Squared = 4. Divided by 5 = 0.8 penalty.
      *   Score = 99.2.
      *   *Note:* The divisor (5) keeps the numbers friendly. If error is 10 months, penalty is 20 points.

  ---

  ### **3. Round 1: The Story (20 Minutes)**
  **Instruction:** "You are consultants. You have a client description. You must predict how many months until they hit their milestone. You cannot use outside knowledge post-dating the 'As-Of' date on the card. Discuss in your team, agree on one number."

  **The Cases (Invented Data):**
  *   **Case A (The App):** A student food-sharing app. *As-Of: Jan 2023.* Milestone: *10,000 Active Users.*
      *   **Description:** Strong initial buzz, two founders, limited funding, high social media engagement.
      *   **Hidden Actual:** 14 Months.
  *   **Case B (The Campaign):** A university divestment group. *As-Of: Sept 2022.* Milestone: *University Board Vote.*
      *   **Description:** 50 members, petition signed, administration stalling, media coverage mixed.
      *   **Hidden Actual:** 8 Months.
  *   **Case C (The Taskforce):** A city housing review. *As-Of: March 2021.* Milestone: *Final Report Published.*
      *   **Description:** 5 experts, government backed, history of delays, urgent public pressure.
      *   **Hidden Actual:** 22 Months.

  *(Assign two teams to Case A, two to Case B, two to Case C. This lets you compare how different teams handled the same inside view.)*

  **Action:** Teams submit predictions. Do not reveal actuals yet.

  ---

  ### **4. Round 2: The Archive (30 Minutes)**
  **Instruction:** "You may revise your prediction. To do so, you must purchase access to a **Data Archive**. These contain historical records of similar projects. You must commit to an Archive *before* seeing the data inside."

  **The Mechanic:**
  Each team gets a **Catalogue**. They choose **one** Archive. They pay the cost. *Then* you reveal the data inside that Archive. *Then* they submit their final Round 2 prediction.

  **The Catalogue (The Trap):**
  *   **Archive 1 (Broad):** "General Sector Projects."
      *   **Cost:** 0 Points.
      *   **Description:** "All projects of this type in the last 10 years."
      *   **Data Inside:** $N=500$. Mean: 15 Months. Range: 4–36 Months. (High variance, but stable mean).
  *   **Archive 2 (Medium):** "Regional Peers."
      *   **Cost:** 10 Points.
      *   **Description:** "Projects in this specific city/university in last 3 years."
      *   **Data Inside:** $N=40$. Mean: 13 Months. Range: 8–20 Months.
  *   **Archive 3 (Narrow):** "Exact Match Cohort."
      *   **Cost:** 25 Points.
      *   **Description:** "Projects with identical funding and team size in the last 12 months."
      *   **Data Inside:** $N=3$. Mean: 11 Months. Range: 10–12 Months. (Looks precise, but tiny sample).

  **Why this design works:**
  *   Teams will instinctively want Archive 3 (Narrow) because it feels most "relevant." This is the Inside View disguising itself as statistical rigour.
  *   Archive 3 costs 25 points. To beat the Broad Archive (Cost 0), the Narrow prediction must be *significantly* more accurate.
  *   **The Twist:** Because $N=3$ in Archive 3, the mean (11 Months) is noisy. The **Actuals** (14, 8, 22) are generally closer to the **Broad Mean** (15) than the Narrow Mean (11), or the accuracy gain doesn't justify the 25-point cost.
  *   **The Lesson:** Paying for specificity often buys noise, not signal.

  ---

  ### **5. The Reveal & Scoring (10 Minutes)**
  1.  Reveal the **Actuals** (14, 8, 22).
  2.  Teams calculate their own scores (peer check).
  3.  Tally Round 1 vs. Round 2 scores on the board.
  4.  **Likely Outcome:** Teams that bought Archive 3 (Narrow) will likely have lower *net* scores than those who bought Archive 1 (Broad), even if their raw prediction was slightly closer, because the 25-point cost is a heavy burden. Teams sticking to Round 1 (Inside View only) will likely have the highest variance (some win big, some lose big).

  ---

  ### **6. The Debrief (15 Minutes)**
  *Now* you can use the terminology. Map their experience to the theory.

  **Point 1: The Outside View isn't a single number.**
  *   *Ask:* "Did Archive 1 give you one number?"
  *   *Lesson:* It gave a distribution (Mean 15, Range 4–36). The Outside View is a distribution, not a point. Your Inside View gave you a point. The friction you felt trying to map that distribution to your specific case *is* the work of forecasting.

  **Point 2: Picking the Class is Inside-View Work.**
  *   *Ask:* "Why did you buy Archive 3? Who argued for it?"
  *   *Listen:* They will say, "Because our case was *special* and matched that description."
  *   *Lesson:* You just did the Inside View again. You argued your case was unique enough to deserve the expensive class. Selecting the reference class is where the bias hides. If you have to argue why you belong in a narrow class, you're already ignoring the regression to the mean.

  **Point 3: Averaging Noise vs. Seeing Truth.**
  *   *Ask:* "Archive 3 had a tight range (10-12 months). Why didn't it win?"
  *   *Lesson:* Small samples ($N=3$) look precise but are noisy. Archive 1 ($N=500$) looked messy but the Mean was stable. The Outside View wins not because it knows your case better, but because it averages out the luck/noise of the past. You paid 25 points for the illusion of precision.

  ---

  ### **7. Predictable Failures (First Run Risks)**
  1.  **Math Panic:** Students might freeze on the Quadratic Scoring Rule.
      *   *Fix:* Put a calculator link on the screen or provide a lookup table (Error of 1 = -0.2 pts, Error of 5 = -5 pts, etc.).
  2.  **The "Rebellion":** A team might refuse to buy an Archive and stick with Round 1 numbers.
      *   *Fix:* Allow it. This is great data for the debrief. Usually, their Round 1 error is huge, proving the need for *some* outside anchor.
  3.  **Time Creep:** Round 2 discussions can drag on as they debate which Archive to buy.
      *   *Fix:* Hard stop. "You have 5 minutes to purchase. If no purchase is made, you default to Archive 1 (Free)."
  4.  **Score Confusion:** If a team gets a negative score (huge error + archive cost), they might disengage.
      *   *Fix:* Frame it as "Debt." The team with the least debt wins.

  ---

  ### **8. What This Game Can't Do (The Limitations)**
  Be straight with them here. This is where you add value beyond the game.

  1.  **Ambiguity of Class:** In the game, the Archives were clear. In reality, you don't have a menu. You have to *construct* the reference class yourself. The game solves the "which class?" problem by giving options; reality doesn't.
  2.  **Emotional Resistance:** In the game, losing points is annoying. In reality, abandoning the Inside View feels like betraying your own vision or effort. The game simulates the *logic* cost, not the *emotional* cost of admitting your project is average.
  3.  **Known Actuals:** In the game, I know the Actuals. I rigged the Broad Mean to be robust. In the real world, you don't know if the Broad Mean is stable or if the world has changed (e.g., "All startups" data from 2019 doesn't apply to 2024). The game assumes stationarity; reality often isn't stationary.

  ### **Script for the "No Jargon" Rule**
  If a student asks in Round 1: *"Can we look up how long similar apps took?"*
  **You say:** "No. You only have the text on the card."

  If a student asks in Round 2: *"Is this the base rate?"*
  **You say:** "It's historical data from an Archive. Treat it as you see fit."

  If a student asks: *"Are we testing the Outside View?"*
  **You say:** "You're testing your ability to score points."

  ---

  ### **Summary Checklist for You**
  *   [ ] Print 6 sets of Case Cards.
  *   [ ] Print 6 Catalogue Sheets.
  *   [ ] Prepare 3 sets of "Archive Data" envelopes (or slides ready to reveal).
  *   [ ] Write Scoring Formula on Board.
  *   [ ] Set a timer for each round.
  *   [ ] Prepare the "Actuals" slide for the reveal.

  This structure forces them to pay for the privilege of being specific, demonstrates that specificity is often overpriced noise, and makes the selection of the reference class the critical strategic decision rather than the calculation itself. Good luck.
