          *   Round 2: Choose a reference class from options (historical states/empires/etc.) *before* seeing base rates. Narrower/more "relevant" classes cost points (incentivizing broad classes).
          *   Scoring: Quadratic scoring rule (no money).
          *   Data: Invented but labelled as such.
          *   **Key Insights to Emerge:** Outside view isn't a single number; picking a class *is* inside-view work; Outside View advantage is often averaging out noise, not specific insight.
          *   **Constraint:** Do not use terms "base rate" or "outside view" until the debrief.
      *   **Deliverables:** Rules, Materials, Payoffs, Debrief mapping, Predictable failures, Limitations (what the game can't do).

  2.  **Deconstruct the Game Design:**
      *   *Time:* 75 minutes is tight. Need efficient setup, play, and debrief.
      *   *Group Size:* 18 students. Can work individually or in small teams. Teams (3 teams of 6 or 6 teams of 3) reduce grading load and encourage discussion. Let's go with 6 teams of 3. It makes the "market" of predictions more visible.
      *   *Round 1 (Inside View):* Need scenarios. "How long will this project take?" or "How many members will this group have?" Let's use *duration* for projects and *size* for organizations. Let's stick to one metric for simplicity: **Duration in Months**.
      *   *Round 2 (Reference Class):* This is the tricky part. The prompt asks for "historical states and empires" but also "platform, firm, party." Let's unify the theme to make it cohesive. Theme: **"The Lifespan of Organizations/Projects."**
          *   Scenarios: A new tech startup, a student union campaign, a government task force, a revolutionary movement.
          *   Reference Classes: Need broad vs. narrow.
          *   Cost Mechanism: Choosing a "specific" class costs points. Choosing a "broad" class is cheap but potentially less accurate (though statistically, broad is usually better for calibration).
      *   *Scoring:* Quadratic Scoring Rule (QSR). Needs to be explained simply. $Score = 100 - (Prediction - Actual)^2$. Or normalized. Let's use a simple penalty system: Start with 100 points, subtract squared error.
      *   *The Twist:* The prompt wants the "narrow class to cost them something." This implies they have to *buy* the right to use a specific distribution.
      *   *Revised Round 2:* They don't just pick a class. They pick a *distribution* associated with a class. But they have to pay for specificity.
      *   *Wait, a better interpretation:* They choose the reference class *category*. If they choose "All Tech Startups" (Broad), it costs 0. If they choose "AI Startups founded in London in 2023" (Narrow), it costs 10 points. Then they see the data for that class and adjust their forecast.
      *   *Actually, the prompt says:* "commit to one reference class... before they get to see the base rates... narrow... class to cost them something."
      *   *Okay, Plan:*
          1.  Round 1: Pure Inside View. Read case, give number.
          2.  Round 2: Choose a "Data Pack" (Reference Class). Narrow packs cost points. Broad packs are free. They see the historical data (the base rate) for that pack. They can revise their forecast.
          3.  Reveal Actuals. Score both rounds.

  3.  **Drafting the Content - Step-by-Step:**

      *   **Title:** Needs to sound neutral. "The Planning Game" or "Project Horizon." Let's go with **"Project Horizon."**
      *   **Materials:** Handouts for cases, Handouts for Reference Classes (Data Packs), Scoreboard.
      *   **Scenarios (The "Inside"):** Need 3 distinct cases to avoid boredom.
          1.  *The App:* A student-built food sharing app.
          2.  *The Campaign:* A university divestment campaign.
          3.  *The Taskforce:* A city council housing review.
      *   **Reference Classes (The "Outside"):**
          1.  *Broad:* "All Student Projects" (Free). Data: Wide variance.
          2.  *Medium:* "Tech Startups" (Cost: 5 pts). Data: Tighter variance.
          3.  *Narrow:* "Food Apps in London 2020-2023" (Cost: 15 pts). Data: Very specific but maybe small sample/noise.
      *   **The Catch:** The "Narrow" data should look tempting but actually lead to overfitting or have high variance hidden in the small sample, or simply the cost outweighs the accuracy gain. The "Broad" data should actually yield better *net* scores because the penalty for narrowness is high and the predictive gain is low (regression to the mean).
      *   **Scoring Rule:** Quadratic. $Score = 100 - \frac{(Prediction - Actual)^2}{10}$. Keep numbers manageable.
      *   **Debrief:** Connect the pain of choosing the class to the "Inside View in disguise." Connect the Broad vs. Narrow performance to "Noise reduction."

  4.  **Refining the Mechanics (Self-Correction):**
      *   *Critique:* If I let them revise in Round 2, comparing Round 1 vs. Round 2 scores shows the value of the Outside View.
      *   *Critique:* The prompt wants them to feel that *picking the class* is the hard part.
