      *   *Better yet:* The Narrow class data should be *misleadingly specific*. (e.g., "3 months" based on 2 examples), while the Broad class says "12 months +/- 5." The Actual is 14. Broad gets closer. Narrow paid 15 points and got it wrong.

  5.  **Addressing the "What the game can't do" section:**
      *   Games simplify. Real world reference class selection is ambiguous.
      *   Games don't capture the emotional resistance to abandoning the "unique story."
