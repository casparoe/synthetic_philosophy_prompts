prompt: |-
  Hey — I host a small, slightly chaotic podcast on AI and philosophy (me and my cohost record in the back room of a board game cafe, and last episode the mic died halfway through so we're doing it again), and next week's guest is a composite character I've invented for the episode — call her Dr. Marisol Vanttinen — because I really don't want to put words in a real person's mouth. Here's her position, which you should take as given: wireheading (an agent reaching into its own reward circuitry, the old rat-with-an-electrode picture) and reward tampering (an agent rearranging the world so that whatever process computes its reward spits out bigger numbers) are not two problems, they're one problem filmed from two angles, and the fix is what she calls intervention-indifference — an agent should be built such that, for anything it might do to the channel carrying its reward, its expected return is exactly what it would have been had it left the channel alone. Her mechanism is the decoy channel: on a random slice of training episodes the real reward wire is silently swapped for a decoy wire carrying a counterfactual signal, an estimate of what the reward would have been if the agent hadn't touched anything, and the agent can't tell the two apart, so any policy that banks on messing with the wire gets burned on the decoy episodes and tampering stops paying on average.

  What I want from you: pretend you're a professional philosopher who also happens to know the technical RL safety literature on this cold. Brainstorm me ten or twelve candidate angles first, throw away the ones that are boring or that she can dodge, and then give me a final ordered list of seven or eight questions for the episode, where every question comes with (i) a one-line note on the answer she's most likely to give, and (ii) a follow-up built to cut at exactly that answer rather than at a strawman version of her view. Things I need covered, at least one question each: the wireheading-versus-tampering distinction seems to rest on where you draw the agent's skin — put the channel inside the boundary and it's wireheading, put it outside and it's tampering — so ask whether that boundary is a fact about the world or a modelling convenience, and whether anything in her framework changes when you move the line; whether intervention-indifference quietly deletes the incentive to do anything at all, since good actions are supposed to change the reward too, and what has to be represented inside the agent for it to distinguish the causal path that goes through the world from the causal path that goes through the wire; who builds and maintains the decoy generator, and what happens once a smart enough agent starts steering the decoy generator's inputs instead of the channel itself — is the problem just pushed up one level, and if not, what breaks the regress; and the human case, both the mundane one (a person who takes a drug versus a person who quietly reorganises their life so they recieve more approval) and the big one, the abolitionist proposal to recalibrate the human hedonic set-point so that severe suffering becomes impossible, which looks like the very same intervention performed on our own channel, so I want one question that forces her to say whether that's the good version or the bad version of the same move and what principled difference is doing the work.

  Two more constraints. No warm-up questions — nothing about how she got into the field or what first got her interested — and please flag any question where her most likely move is to just re-explain the decoy channel for the fourth time; I want at least two questions that make that move unavailable, ideally ones where the decoy mechanism is irrelevant to the pressure. And end with one question about what would count as evidence against intervention-indifference: if I handed her a sandbox with a big tempting tamper button and the agent never pressed it, what should she say I've actually learned, what would I have to change in the setup before the result meant something, and what outcome in that sandbox ought to make her give the whole approach up? Take your time and think carefully — I'd much rather have five sharp questions than ten soft ones.
