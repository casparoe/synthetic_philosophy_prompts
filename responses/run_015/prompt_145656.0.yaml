answer: |-
  ### I. Formal Restatement in Evaluation Semantics

  To articulate the *catuṣkoṭi* and *śūnyatā* without metaphysical smuggling, we must fix the semantic domain. We assume a lazy, purely functional calculus (e.g., System F with recursive let-bindings) where terms $t$ are evaluated within an environment $\Gamma$. We distinguish between **Weak Head Normal Form (WHNF)** (a value, e.g., a lambda or constructor) and **Normal Form (NF)** (fully evaluated). We denote convergence as $t \Downarrow v$ and divergence as $t \Uparrow$ (or $t = \perp$).

  #### 1. The Catuṣkoṭi (Tetralemma) as Evaluation Status
  Let the proposition $P(t)$ be: "Term $t$ possesses an intrinsic, context-independent normal form."

  *   **Corner 1 (Is / Existence):** $t$ is a closed term such that $t \Downarrow v$, where $v$ is a canonical normal form.
      *   *PLT Interpretation:* Strong normalization. The term reduces to a ground value independent of evaluation strategy. It behaves as if it has *svabhāva* (intrinsic nature).
  *   **Corner 2 (Is Not / Non-Existence):** $t$ is a closed term such that $t \Uparrow$ (diverges) or $t$ inhabits the type $\text{Void}$ (uninhabited).
      *   *PLT Interpretation:* Bottom ($\perp$). The computation fails to produce a value. In denotational semantics, the meaning is the empty set or the bottom element of the domain.
  *   **Corner 3 (Both / Existence and Non-Existence):** $t$ is in WHNF (it is a value/thunk in the heap) but forcing $t$ yields $\perp$.
      *   *PLT Interpretation:* A lazy closure. Syntactically, it is a value (a pointer to a closure), so it "exists" in the store. Semantically, its content is $\perp$. This distinguishes the *object* (the thunk) from the *result* (the evaluation). It captures the contradiction of being a value that denotes non-termination.
  *   **Corner 4 (Neither / Neither Existence nor Non-Existence):** $t$ is an open term (contains free variables) or the typing judgment $\Gamma \vdash t : T$ is undecidable.
      *   *PLT Interpretation:* The status of $t$ is not a property of $t$ itself but of the substitution context $\Gamma$. To ask if $t$ converges is ill-formed without specifying $\Gamma$. The dichotomy (converges/diverges) does not apply to the term in isolation.

  #### 2. Śūnyatā (Emptiness) and Pratītyasamutpāda (Dependent Origination)
  *   **Pratītyasamutpāda as Dependency Graphs:** Every value $v$ in the heap is a closure capturing an environment $\Gamma$. $\Gamma$ maps variables to other thunks. There are no atomic constants; even literals are defined by their type's elimination rules. The "identity" of any term $t$ is the transitive closure of its dependencies in $\Gamma$. Cyclic dependencies ($\mu$-binding) are permitted, modeling co-inductive data or infinite streams.
  *   **Śūnyatā as Absence of Intrinsic Normal Form:** No term $t$ has a normal form *in itself*. A normal form is only reached relative to a reduction strategy and an environment. "Emptiness" is not the value $\perp$ (which is a specific semantic element); it is the structural property that **all values are thunks**. There is no "ground" in the ontology of the language; every value is a deferred computation referencing other deferred computations.
  *   **Emptiness of Emptiness:** The type system $\mathcal{T}$ that assigns meanings to these terms is itself a syntactic structure without external semantic grounding. We cannot step outside $\mathcal{T}$ to verify its consistency (Gödelian limitation). The "rules of evaluation" are themselves empty of intrinsic authority; they are just more terms in a meta-language.

  ---

  ### II. Residue Report: Structural Mapping and Failures

  This section analyzes the fidelity of the translation, identifying where the PLT vocabulary captures the philosophical structure and where it distorts or fails.

  #### 1. Clean Translations (High Fidelity)
  *   **Corner 1 (Is) $\approx$ Normalization:** The intuition that "existence" implies "definite identity" maps cleanly to a term reducing to a canonical normal form. Both imply stability and independence from further processing.
  *   **Corner 2 (Is Not) $\approx$ Divergence/Uninhabited:** The intuition of "non-existence" maps cleanly to $\perp$ or $\text{Void}$. Both represent the failure to produce a witness.
  *   **Pratītyasamutpāda $\approx$ Environments/Closures:** The doctrine that things arise in dependence matches the structural reality of closures. A lambda value $\lambda x. t$ is nothing without its captured environment. The "self" of the function is entirely constituted by its external references.
  *   **Emptiness $\neq$ Nihilism:** The distinction between *śūnyatā* and nihilism maps cleanly to the distinction between **$\perp$** and **Relationality**. Nihilism would claim all terms are $\perp$. Emptiness claims all terms are *dependencies*. A terminating program is empty of intrinsic nature just as much as a diverging one, because both rely on the runtime environment to define their behavior.

  #### 2. Distortions and Smuggling (Medium Fidelity)
  *   **Corner 3 (Both) requires Thunk/Value distinction:** Standard denotational semantics often collapses the distinction between a closure and its result (identifying a function with its graph). To make "Both" work, we must smuggle in an operational distinction between the *heap object* (the thunk, which exists) and the *evaluation result* (which may be $\perp$). This requires a specific implementation model (lazy evaluation with explicit stacks/heaps) rather than pure mathematical semantics.
  *   **Corner 4 (Neither) requires Undecidability:** In a decidable type system, a term is either well-typed or it is a syntax error. To capture "Neither," we must appeal to undecidability (e.g., the Halting Problem) or open terms. This shifts the claim from an ontological statement ("existence is ill-posed") to an epistemic one ("we cannot determine existence"). Madhyamaka claims the *question* is wrong, not just that the *answer* is unknown.
  *   **Dependent Origination vs. Causal Graphs:** In PLT, dependencies are static (lexical scoping) or dynamic (call graphs). In Madhyamaka, dependence is ontological. The PLT model assumes the *nodes* (thunks) exist to hold the edges. Madhyamaka suggests the *edges* constitute the nodes. In PLT, if you cut the edges, the thunk remains as a syntactic object. In Madhyamaka, if you remove the relations, the phenomenon vanishes entirely.

  #### 3. The Untranslatable Residue (Low/No Fidelity)
  *   **The Soteriological Function:** The *catuṣkoṭi* is a therapeutic tool designed to induce a cognitive shift (realization of emptiness) that ends suffering. The PLT mapping is descriptive. Knowing that "all values are thunks" does not alter the behavior of the compiler or the programmer. The *pragmatic effect* of the philosophy is lost in the structural translation.
  *   **Emptiness of Emptiness (The Meta-Problem):** In PLT, we rely on a meta-theory to prove properties about the type system (e.g., type safety). Madhyamaka asserts that the meta-theory is also empty. We cannot model "the type system is empty" *within* the type system without triggering inconsistency or requiring an infinite hierarchy of meta-languages. The PLT framework requires a ground (the logic of the meta-language) to function; Madhyamaka denies any ground is possible.
  *   **Two Truths Doctrine:** Madhyamaka distinguishes Conventional Truth (samvrti-satya) from Ultimate Truth (paramartha-satya).
      *   *PLT Analogue:* Operational Semantics (conventional) vs. Denotational Semantics (ultimate).
      *   *Failure:* In PLT, these are meant to be consistent (adequacy theorems). In Madhyamaka, Ultimate Truth is the *negation* of the validity of Conventional Truth as ultimately real, while still allowing it to function. PLT seeks consistency between layers; Madhyamaka seeks a dialectical tension where the ultimate invalidates the ontology of the conventional without breaking its utility.
  *   **The "Givenness" of Syntax:** PLT takes the existence of symbols and strings for granted. Madhyamaka questions the intrinsic existence of the relata themselves. In PLT, a variable $x$ is a primitive. In Madhyamaka, the "grasper" and the "grasped" are mutually dependent. We have no vocabulary in type theory for the *absence of the syntax itself* while retaining the analysis.

  ---

  ### III. Verdict: Collapse or Insight?

  Does the philosophical claim collapse into familiar distinctions, or does the vocabulary miss the point?

  **1. The Collapse:**
  Structurally, a significant portion of the Madhyamaka argument collapses into **constructive type theory with partiality**.
  *   "No intrinsic nature" $\rightarrow$ "No canonical normal form independent of context."
  *   "Dependent origination" $\rightarrow$ "Cyclic dependency graphs in the environment."
  *   "Emptiness" $\rightarrow$ "All values are closures/thunks."
  If we stop here, Nāgārjuna is merely describing a lazy functional language with recursive bindings. The "mystery" dissolves into the mechanics of $\beta$-reduction and environment lookup. The tetralemma becomes a truth table for termination properties (Converges, Diverges, Thunk, Open).

  **2. The Residue (What is Missing):**
  However, the translation fails to capture the **ontological groundlessness** claimed by Madhyamaka.
  *   **PLT Assumption:** The reduction rules and the syntax *exist*. The type system is a valid framework for reasoning.
  *   **Madhyamaka Claim:** The framework itself is *śūnya*. There is no "Language of Reality" that we are modeling.
  *   **The Critical Failure:** In PLT, $\perp$ is a value in the domain (or the absence of one), but the *logic* describing $\perp$ is solid. In Madhyamaka, the logic describing emptiness is itself empty. We cannot represent "the invalidity of this type system" inside the type system. To do so would require a "Type System of Type Systems" which is also empty, leading to an infinite regress that PLT treats as a flaw (non-termination) but Madhyamaka treats as the nature of reality.

  **Conclusion:**
  Your vocabulary is sufficient to map the **phenomenology** of the Madhyamaka argument (how things appear to relate), but it cannot map the **ontology** (the status of the relating itself). The PLT framework assumes a "God's eye view" of the code (the meta-theory) which is consistent and well-defined. Madhyamaka denies the possibility of that view.

  Therefore, the translation succeeds in showing that *dependent origination* is structurally isomorphic to *lazy evaluation with cyclic dependencies*. But it fails to capture *śūnyatā* because in PLT, the evaluation rules are the *svabhāva* of the system. In Madhyamaka, there are no rules with *svabhāva*. The residue indicates that your vocabulary misses the **self-reflexive negation of the framework itself**. You can model a world where nothing has intrinsic value, but you cannot model the statement "this model has no intrinsic validity" without stepping outside the model—which is precisely the move Madhyamaka forbids.
