prompt: |-
  I'm preparing a cross-disciplinary reading group with colleagues in programming-language theory, and I want to test whether Nāgārjuna's tetralemma and the Madhyamaka doctrine of emptiness can be articulated without contradiction in the vocabulary we actually share—types, values, thunks, bottom (⊥), lazy evaluation, divergence, uninhabited types, and the absence of any canonical or intrinsic normal form in a data structure. Specifically, I want you to restate the four positions of the catuṣkoṭi (that a phenomenon is, is not, both is and is not, and neither is nor is not) using only distinctions available in how a type system handles partiality, undefinedness, and evaluation order, and then to restate śūnyatā—the denial of svabhāva, or intrinsic self-nature—together with pratītyasamutpāda (dependent origination) in terms of dependency graphs among thunks, the absence of essential properties in terms, and whether "emptiness" corresponds to anything other than non-termination, lack of inhabitants, or the absence of a ground value. Do this as precisely as you can, without importing classical bivalence or metaphysical language that has no structural counterpart in type theory.

  Then give me the residue report: which of the four corners translate cleanly into distinctions your framework can genuinely express (for instance, between a well-typed value, a diverging computation, a contradictory type, and an uninhabited one), which ones require distortion or smuggling in assumptions foreign to evaluation semantics, and whether anything in the Madhyamaka argument—particularly the claim that emptiness itself is empty and that dependent origination is not merely causal but ontologically groundless—has no counterpart at all in how we talk about types and evaluation. I want to know whether the residue indicates that my vocabulary is missing something the philosophers are pointing to, or whether the philosophical claim collapses, under honest translation, into familiar distinctions between termination, inhabitation, and referential transparency that we already understand. Do not provide a bibliography or reading list; I am asking for the structural mapping and its failures, not for sources.
