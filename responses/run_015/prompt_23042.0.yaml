              *   *The deeper circularity:* Some argue that defending Uniqueness often relies on intuitions that already favor Conciliationism (i.e., "Evidence dictates belief"). Conversely, defending Permissivism often relies on intuitions that favor Steadfastness (i.e., "Reasonable people can differ").
