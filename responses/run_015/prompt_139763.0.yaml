  You have identified a genuine and pervasive structural flaw in pseudoscientific and pseudohistorical argumentation. It is frustrating precisely because it mimics the gestures of rigor while subverting the logic of consistency.

  There is no single, universally standardized term in epistemology or argumentation theory that captures this maneuver in its entirety. The closest established concepts are **"Special Pleading"** and **"Selective Skepticism,"** but as you suspected, both are imperfect fits.

  **Special Pleading** is the formal logical fallacy of applying a standard to others while exempting oneself without justification. It captures the *asymmetry* of your examples (strict for them, loose for me). However, it is too broad; it covers any double standard, not specifically the move of dismantling a methodological pipeline only to rebuild it for your own use.

  **Selective Skepticism** (or "pseudoskepticism") is the term most commonly used in the literature on demarcation (e.g., by the Committee for Skeptical Inquiry). It describes the *stance* of the arguer rather than the specific *rhetorical move* within the argument. It tells us the speaker is being unfair, but it doesn't name the mechanism of reusing the discredited evidence.

  Because the existing terms miss the crucial element of **reusing the discredited pipeline**, this maneuver deserves its own label. The essential feature is not just the asymmetry, but the *exploitation* of that asymmetry to gain epistemic profit. You are describing a trader who claims the market is rigged to invalidate their competitor's assets, then buys those same assets at a discount to build their own portfolio.

  I propose the term **"Epistemic Arbitrage."**

  In finance, arbitrage is the practice of profiting from a price difference between two markets. In this context, the speaker profits from the difference in evidentiary standards between two claims. They exploit the gap between the strict standard applied to the mainstream (devaluing its claims) and the lax standard applied to themselves (inflating their own claims), all while trading on the same underlying assets (the manuscripts, the artifacts, the data).

  ### Definition
  **Epistemic Arbitrage** is the rhetorical maneuver of invalidating a competitor's conclusion by attacking the reliability of their evidence or methods, then validating one's own conclusion by relying on that same evidence or methods without addressing the previously cited flaws.

  ### Boundary Cases

  1.  **Clear Case (Yes):** A presenter argues that mainstream Egyptologists cannot date a temple because the king-lists are corrupted copies made centuries later. Having established that the king-lists are chronologically useless, the presenter then uses the numerical data in those same king-lists to prove the temple was built during a specific, compressed reign.
      *   *Why:* The source is declared unreliable for the opponent, then reliable for the proponent, with no explanation for the change in status.

  2.  **Clear Case (No):** A historian argues that a specific medieval chronicle is a forgery created in the 15th century. Consequently, they reject both the mainstream dating based on the chronicle and any alternative theories that rely on it, refusing to use the document for any positive claims.
      *   *Why:* The standard is applied consistently; the discredited evidence is discarded entirely.

  3.  **Borderline Case (Arguable):** A scholar argues that a set of oral traditions is too mythologized to be used for precise dating of events (rejecting mainstream chronology). However, they use those same traditions to reconstruct the *cultural values* or *astronomical knowledge* of the period, arguing that while the narrative timeline is corrupted, the symbolic content is preserved.
      *   *Why:* This could be legitimate differentiation. If the scholar provides a methodological reason why the source is unreliable for *dates* but reliable for *symbols* (e.g., oral stability of myth vs. history), it is not arbitrage. If they offer no such justification and simply switch standards when convenient, it slides into arbitrage.

  ### Recommendation
  For your column, **Epistemic Arbitrage** offers the precision you need. It signals to the reader that this is not just skepticism, but a calculated exploitation of inconsistency. It allows you to describe the move without getting bogged down in the moralism of "fraud" or the vagueness of "bias."

  \answer{Epistemic Arbitrage}
