  Progress requires explicitly separating the soteriological from the metaphysical. We need a reframing that treats *anattā* as a phenomenological claim about the *experience* of agency, not the existence of agents. A rigorous study comparing first-person reports of advanced meditators regarding moral decision-making versus non-meditators could test if 'no-self' alters normative intuition. Alternatively, philosophers must accept a two-truths solution: ultimate emptiness does not negate conventional responsibility. If we stop asking "Who is reborn?" and start asking "What continues that warrants ethical concern?", the debate shifts from identity to continuity. However, if the goal is reconciling Buddhism with Western retributive justice, no progress is possible—the frameworks are incompatible. Progress looks like admitting that *anattā* changes the rules of the moral game, rather than trying to win the old game with new pieces. We need to stop demanding metaphysical glue where the tradition offers ethical convention.

