  Here is the reconstruction of Dev's position, the candidate rules, and the experimental path forward.

  ### Phase 1: Reconstructing Dev's Logic (Four Candidate Rules)

  Dev's verdicts are not random; they track a specific topology of causation that rejects both naive reductionism (it's just marbles) and magical emergentism (symbols float free). He is looking for a specific kind of *leverage* that higher-level states must have over the physical world. Based on the eight cases, here are four rules that fit his data.

  **Rule 1: The Robust Dynamics Principle**
  *   **Formulation:** Higher-level states (symbols) exert causal power over the substrate if and only if the coarse-grained description of the system supports stable, counterfactually robust predictions of the system's future physical state, independent of micro-perturbations.
  *   **Fit:** Explains **YES** on Case 1 (Careenium), Case 7 (Sim), and Case 8 (Pipe Turbulence = NO because it's not robust). Explains **NO** on Case 2 (Frozen = no dynamics).
  *   **Focus:** The internal stability of the substrate's coarse-grained behavior.

  **Rule 2: The Consumption Principle**
  *   **Formulation:** Higher-level states exert causal power only if they are "read" or consumed by some component of the system (internal or external) to determine a subsequent physical action. A symbol that drives nothing is just weather.
  *   **Fit:** Explains **YES** on Case 5 (Slips shove Clerk), Case 6 (Book shoves Clerk). Explains **NO** on Case 3 (Diary = nothing reads it) and Case 4 (Rock = manual is external observer, not system component).
  *   **Focus:** The functional downstream use of the state.

  **Rule 3: The Transition Embodiment Principle**
  *   **Formulation:** Higher-level states are causal if the physical substrate is currently embodying the transition rules of the computation. The symbols must *be* the mechanism by which the next state is selected, not just a record of the past.
  *   **Fit:** Explains **YES** on Case 1 (Clumps determine collisions) and Case 6 (Book entries determine Clerk's writing). Explains **NO** on Case 3 (Diary records past, doesn't select future) and Case 4 (Rock doesn't embody rules, manual does).
  *   **Focus:** Whether the physical state *is* the program being run.

  **Rule 4: The Reciprocal Constraint Principle**
  *   **Formulation:** Higher-level states exert causal power over the substrate only if the symbolic level can loop back to constrain the *inputs* to the substrate. The symbols must be able to shove the source of the substrate's energy, not just ride the wave.
  *   **Fit:** Explains **YES** on Case 1 (Walls bounce depending on outside—there is a coupling). Explains **NO** on Case 3 (Diary is one-way record). Consistent with **YES** on Case 6 (Clerk writes answer—action is completed).
  *   **Focus:** Closed-loop control vs. open-loop processing.

  ### Phase 2: Selecting the Top Two Rules

  Dev's consistency suggests he is balancing **Rule 1 (Robust Dynamics)** and **Rule 2 (Consumption)**.

  *   **Why Rule 1?** It captures his enthusiasm for Case 1 (Careenium) and his rejection of Case 8 (Pipe). He cares that the coarse story *holds up* against the micro-noise.
  *   **Why Rule 2?** It captures his hard line on Case 3 (Diary). "Symbol nothing reads is just weather." This is his strongest philosophical commitment. Even if the dynamics are robust (Rule 1), if nothing *uses* the pattern, it's not a cause, it's a trace.

  **Rule 3** is too close to Rule 2 (Embodiment vs. Consumption). **Rule 4** is a stronger version of Rule 2, but Case 6 (The Book) is open-loop (Clerk writes answer, doesn't feed back to book), and Dev said YES. So Dev does *not* require full reciprocal closure (Rule 4) to say YES. He just requires *consumption* (Rule 2).

  So the real tension in Dev's mind is likely between:
  1.  **Robust Dynamics:** "The waves interact stably, so they are real causes." (Case 1 logic).
  2.  **Consumption:** "The waves are only causes if they drive an action." (Case 3 logic).

  ### Phase 3: The Verdict on the Wave Tank

  **The Setup:** Wave tank, input paddle, camera readout, laptop output. No feedback. Waves interact robustly (Rule 1 satisfied). Camera reads waves (Rule 2 satisfied?).

  **Dev's Likely Verdict:** **YES.**

  **Reasoning:**
  Dev said YES to Case 1 (Careenium), where clumps knock each other around. Your waves reflect and interfere; that is clumps knocking clumps around. That satisfies Rule 1.
  Dev said YES to Case 6 (Book + Clerk), where a passive symbol table drives an agent. Your camera + laptop is the Clerk. The waves are the Book. The laptop reads the waves to produce an answer. That satisfies Rule 2.
  Dev said NO to Case 3 (Diary) because *nothing* read the diary. In your tank, the laptop reads the waves. They are not "just weather."

  However, your supervisor's comment ("lookup table in a wet costume") invokes Case 6. Dev said YES to Case 6. So Dev should agree with your supervisor's description but disagree with the implication that it's *not* causal. For Dev, a lookup table *is* causal if it's being used.

  **The Catch:** The question is "Do the wave patterns shove the *water* around?"
  In Case 6, the Book shoves the *Clerk*, not the *Paper*.
  In Case 1, the Clumps shove the *Marbles*.
  Your tank is a hybrid. The waves (clumps) shove the water (marbles) via physics (Case 1). The readout (clerk) reads the waves (Case 6).
  Dev will likely say: "The wave patterns shove the water because they are robust dynamic structures (Case 1), *and* they count as 'symbols' rather than 'weather' because the laptop reads them (Case 3)."

  ### Phase 4: The Decisive Variant

  To separate **Rule 1 (Robust Dynamics)** from **Rule 2 (Consumption)**, you need to break the Consumption link while keeping the Dynamics intact.

  **The Variant:** **Disable the Readout.**
  Keep the tank running exactly as is. Keep the paddle moving. Keep the waves forming, interfering, and persisting robustly. But **turn off the camera and laptop.** Do not record. Do not read. Let the waves crash and fade with no observer and no output.

  **Why this separates the rules:**
  *   **If Dev follows Rule 1 (Robust Dynamics):** He must say **YES**. The wave packets still reflect, interfere, and determine the future state of the water molecules. The coarse-grained causation is intrinsic to the fluid dynamics. The camera was just a witness.
  *   **If Dev follows Rule 2 (Consumption):** He must say **NO**. Without the camera/laptop, nothing is sensitive to the wave patterns. They are now identical to Case 3 (The Diary). They are a record of the paddle's input, but "a symbol nothing reads is just weather." They do not shove the water *as symbols*; they just *are* the water moving.

  **Why not the Feedback Fix?**
  You mentioned fixing the feedback loop is a week of work. While that would test **Rule 4 (Reciprocal Constraint)**, Dev's YES on Case 6 (The Book) suggests he doesn't require a closed loop to grant causal status. He grants causal status to the Book because the Clerk *reads* it. Therefore, the presence of the Reader (Camera) is the critical factor, not the return path to the Paddle.
  Disabling the camera takes ten minutes (unplug the USB). It is buildable in a week. It directly targets his Case 3 verdict, which is the most specific constraint he has given you.

  **Prediction:**
  I suspect Dev will hesitate on the "Disable Readout" variant. If he says **NO**, he is a Functionalist: symbols are defined by their use. If he says **YES**, he is a Non-Reductive Physicalist: symbols are defined by their structural stability. Given his irritation with Case 4 (Rock + Manual), he hates "external interpretation." But the Camera is *internal* to your rig.
  If he says **NO** to the disabled camera, he is committing to the view that **causation requires a consumer.** This would mean that in the Careenium (Case 1), the "outside world" bouncing the walls is the necessary Consumer. If you isolated the Careenium completely, he might switch to NO.

  **My Advice:**
  Run the tank with the camera covered. Ask him: "The waves still knock each other around exactly the same way. Did the causation stop when I blinded the laptop?"
  If he says "Yes," then his rule is **Consumption**.
  If he says "No," then his rule is **Robust Dynamics**.
  Given his "weather" comment on Case 3, I bet he says **Yes, causation stopped.** He thinks "Symbolic Causation" is a relational property between a state and a reader, not an intrinsic property of the state itself.
