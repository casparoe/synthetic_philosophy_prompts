  You're a professional philosopher of mind who actually works on implementation, levels, and higher-level causation. Please think carefully and don't just jump to an answer: start by brainstorming, and write out at least four candidate rules explicitly before you commit to any of them. Also, don't tell me what to read or who to cite — no bibliographies, no reading lists, I want your own reconstruction of what's going on.

  Background: my friend Dev restores pinball machines and has Opinions. Since my dad had a stroke in April I've been reading about brains and substrates way more than is healthy, and Dev is the person I end up shouting with about it, to the point that its basically a running bet now. The thing we keep circling is that old Hofstadter setup: a big frictionless table — the "careenium" — with a vast number of tiny magnetic marbles careening around on it, the walls getting more or less bouncy depending on what's happening outside the box, and the marbles clumping into bigger structures that hang together and knock each other around. Zoomed out you see symbols; zoomed in you just see marbles. Dev's question is always the same one: in a given setup, do the symbols actually shove the substrate around, or is that just a way of talking about marbles pushing marbles?

  His verdicts so far, which he's been irritatingly consistent about:

  1. Hofstadter's own table, walls driven by the outside world, clumps forming and interacting. YES, obviously, he says, that's the whole point.
  2. The same table frozen: marbles superglued mid-bounce into an arrangement that reads like a sentence. NO.
  3. A recording table: clumps form a perfect diary of what the walls did, but nothing anywhere is ever sensitive to the diary. NO. His line is that a symbol nothing reads is just weather.
  4. A rock, plus a thick manual mapping its microstates onto symbol states and their transitions. NO, and he gets a bit offended — you can do that to anything.
  5. A room with a guy shuffling paper slips according to a rulebook, with no idea what any of it means. YES — the slips shove him around whether or not he understands a word.
  6. A clerk with a giant printed book of every addition problem and its answer, who looks up the answer and writes it down. YES — and this is the one I keep coming back to, because the book is completely passive and the clerk is outside it, and he still says the symbols are doing the shoving.
  7. A laptop simulating case 1. YES, though he gets hand-wavy about the substrate not mattering.
  8. Six seconds of turbulence in a pipe whose coarse-grained states happen, exactly once, to line up with the transition table of some algebra, and never again. NO. Once is a coincidence, not a level.

  He also flat out refuses the intervention test — you can't change the symbol without changing the marbles, so questions of the form "what if you wiggled the symbol while holding the substrate fixed" don't have answers, in his view. So don't build your answer on that.

  Here's the new case, and it's mine, which is why I care. I'm in a lab doing physical reservoir computing: a wave tank, about 60 cm, with a paddle at one end driven by the input signal, an overhead camera reading the surface height at around a hundred points, and a laptop applying a trained linear readout to produce the answer. Nothing goes back the other way — the output never touches the water. Things I can tell you about it: the coarse wave patterns really do interact (packets reflect off the walls, interfere, form standing structures that persist), and from a coarse snapshot you can predict the next coarse snapshot well without tracking anything like the underlying molecules. It's robust in the sense that a small poke doesn't destroy the coarse story. Retraining the readout for a completely different task changes nothing whatsoever in the water. There's also a feedback path that would feed the readout back into the paddle; it's broken right now, fixing it is roughly a week of work, I have a workshop deadline, and my supervisor has started calling the rig a lookup table in a wet costume. Dev hasn't ruled on the feedback version.

  So: what's Dev going to say — do the wave patterns shove the water around, or not? But I care much less about the yes or no than about the rule he's actually running. Write out the rules his eight verdicts are jointly compatible with, say what each predicts about the tank, give me your best guess at which one he's on with the reasons for preferring it, and then tell me the single variant — a change to the tank, or a new case — that would best separate your top two, ideally something I could actually build in a week. If you think his precedents genuinely don't reach this far, say so, and tell me what he'd be committing to with each answer.
