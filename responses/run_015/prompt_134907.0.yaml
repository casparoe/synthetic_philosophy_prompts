answer: |-
  1. Position framing
  Her view diverges from classical negative utilitarianism by extending the moral calculus across rebirths without positing a permanent self, treating mental streams as the locus of value rather than individual beings. It separates from standard Buddhist karmic theory by rejecting virtue ethics in favor of direct suffering reduction, prioritizing the disruption of chronic sankharic patterns over moral purity. Crucially, she employs a "structural dukkha baseline," weighting entrenched craving and aversion heavier than episodic pain, arguing that without this metaphysical depth, karma devolves into vague moralism rather than a precise tool for trajectory alteration.

  2. Interview questions
  1. I'd like to begin with ontology. You deny a permanent self, yet assign moral weight across rebirths. Without a stable identity to bear consequences, what precisely constitutes the continuity that warrants moral concern?
  *Follow-up:* If your reply relies on the causal continuity of mental streams to bridge lives, does this not implicitly reify the stream as a proxy-self, thereby compromising your anatta commitment?

  2. Second, on intervention. Given your structural dukkha baseline, could intentional harm be justified if it disrupts a destructive sankharic trajectory?
  *Follow-up:* If you affirm this, what specific threshold prevents this principle from licensing paternalistic violence against those currently entrenched in deep aversion?

  3. Third, on aggregation. How do individual actions aggregate into a stream-level moral evaluation without a central accountant?
  *Follow-up:* If this calculation is opaque to the agent, how is this practical ethics rather than speculative metaphysics inaccessible to practitioners?

  4. Fourth, on virtue. You reject Theravada virtue ethics as insufficiently responsive. Does this render intention morally inert compared to outcome?
  *Follow-up:* If intention still matters, how do you weigh misguided benevolence against successful harm reduction when trajectories diverge?

  5. Fifth, on metaphysics. Is the rebirth dimension literal or metaphorical in your calculus?
  *Follow-up:* If you argue it is metaphorical, does the theory not collapse into standard psychological consequentialism limited to one lifetime?

  6. Sixth, on epistemology. How is the structural dukkha baseline empirically discerned by finite agents?
  *Follow-up:* Does this epistemic barrier require deference to enlightened arbiters, and if so, does this reintroduce hierarchical authority?

  7. Seventh, on extinction. Does weighting chronic patterns over episodic pain solve the negative utilitarian extinction argument?
  *Follow-up:* If structural suffering is eliminated by ending the stream entirely, is extinction not the optimal outcome under your view?

  8. Eighth, on practice. What does this demand of daily conduct that standard mindfulness does not?
  *Follow-up:* If meditation is solely for trajectory alteration, is it merely instrumental rather than an intrinsic good?

  3. Pressure point
  Question one exposes the deepest tension: reconciling ontological emptiness with cross-lifetime moral responsibility. If there is no self, the "stream" is merely impersonal causality. Assigning normative weight to future iterations of that stream requires a pragmatic fiction of identity that risks contradicting her anatta commitment. If she argues causal continuity suffices, she must explain why mere causality generates moral obligation without a beneficiary. This threatens to collapse her view into either a reified self-theory or a motivationally inert metaphysics.
