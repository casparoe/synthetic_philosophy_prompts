  i feel like there's something philosophical hiding in here about doing stuff alone versus everyone doing it together, but i can't pin it down. specifically: is there a real moral difference between me pushing my change and the disaster that'd happen if we all did it? and does it matter that the harm wasn't guaranteed — it was just a risk spread across loads of downstream users in seperate systems — or is that a cop-out?

