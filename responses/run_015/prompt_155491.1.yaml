      *   Direct and honest (no false hope).
      *   Avoid "surveying" (don't just list philosophers, analyze the *structure* of the argument).

  8.  **Self-Correction/Check during drafting:**
      *   *Check:* Did I answer whether it's verbal or substantive? *Correction:* It's substantive *because* of the verbal definition. The definition reflects the ontology.
      *   *Check:* Did I use the distributed computing analogy? *Correction:* Yes, make sure to distinguish between the *mechanism* of consistency and the *reality* of the state.
      *   *Check:* Is the diagnosis structural? *Correction:* Focus on the logical form of the disagreement (Premise A vs. Premise B), not just the history.

  9.  **Final Polish:** Ensure the distinction between Access Consciousness (Block) and Phenomenal Consciousness is clear, as that's the technical philosophical equivalent of the engineer's "global state" vs. "inner observer." (Actually, Block distinguishes them to save phenomenology; Dennett collapses them. Need to be precise there).

      *   *Refinement on Block:* Ned Block distinguishes A-Consciousness (access/report) and P-Consciousness (feel). Dennett says P is just a species of A. Critics say P is distinct. This is the crux.

  10. **Final Review against constraints:** Grounded in arguments? Yes. No mere survey? Yes. Honest about progress? Yes.

