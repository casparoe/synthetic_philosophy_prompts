  2. Rejecting recall and referenda leaves no clear mechanism for the governed to sanction a non-elected body, violating your constraint that governors must be answerable to the governed. You must either accept plebiscitary tools or concede indirect accountability, costing you the direct sanction power you demand.
  3. Reserving twenty seats for outgoing members creates a permanent insider class within the lottered chamber, contradicting your diagnosis that tenure produces captured judgment. You must abolish these reserved seats to maintain consistency, costing you the institutional memory and mentorship you desire.
  4. The conflict between rejecting mirroring (2) and relying on diversity (3) dissolves because demographic statistics are merely a heuristic for achieving the cognitive diversity you value, not an end in themselves. You incur no cost here provided you maintain that demographic quotas are instrumental rather than constitutive of legitimacy.
  5. Abolishing the twenty reserved seats for outgoing members in (4) buys back the most consistency at the least cost. This sacrifices some mentorship but removes the clearest contradiction with your anti-careerist term limit principle and epistemic claims.
