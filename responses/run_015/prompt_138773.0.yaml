  You have put your finger on a genuine and serious instability in the accuracy-first program. You are correct that the verdicts depend on parameters that the theory itself does not fix. You are also correct to suspect that this allows the evaluator to "game" the result by choosing the parameters that favor their preferred conclusion.

  There is no single, universally agreed-upon name for the conjunction of these specific worries, but they fall under two established technical umbrellas which I will name, and then I will offer a coined term for the specific meta-problem you have identified.

  ### 1. The Names for the Parts

  **Case 1 (The Slicing): Partition Dependence.**
  This is the standard term. Scoring rules (like the Brier score you are using) are not defined on "belief" in the abstract; they are defined on a credence function *relative to a partition* of logical space.
  *   **The Phenomenon:** A credence function $C$ can dominate $C^*$ relative to partition $P_1$ (fine-grained), while $C^*$ dominates $C$ relative to partition $P_2$ (coarse-grained).
  *   **Why it happens:** The Brier score sums the squared errors over the cells of the partition. When you merge cells (coarsen), you change the number of terms in the sum and the target truth-values (a merged cell is true if *any* of its constituents are). This changes the geometry of the "distance to truth."
  *   **What it is NOT:** It is not merely renaming the options. If you rename $w_1$ to $v_1$, the score is unchanged. It requires changing the *algebra* of propositions (which combinations of worlds count as distinct possibilities).

  **Case 2 (The Averaging): Perspectival Variance (or Lack of Inter-Subjective Validity).**
  This is a consequence of **Propriety**. A scoring rule is "proper" if and only if an agent minimizes their *expected* score by reporting their true credences.
  *   **The Phenomenon:** Because the rule is proper, Annie expects herself to beat Bella, and Bella expects herself to beat Annie. There is no "view from nowhere" expectation.
  *   **Why it happens:** Expected score is a weighted sum. The weights *are* the credences. If you change the weights (Annie's vs. Bella's), you change the sum.
  *   **What it is NOT:** It is not a calculation error. It is a structural feature of any system that respects the agent's own perspective as the standard for expectation.

  ### 2. The Unified Concept: "Scorecard Relativity"

  Since you asked for a name for the broader suspicion—that the verdict favors whoever sets the scorecard—I will coin **The Scorecard Relativity Problem**.

  **Definition:** The Scorecard Relativity Problem is the phenomenon where normative verdicts on belief formation (e.g., "Annie is more rational than Bella") are not intrinsic to the agents' belief states, but are relative to under-argued parameters of the evaluation framework: specifically, the **partition** (which possibilities are counted), the **closure** (which logical consequences are scored), and the **perspective** (whose probabilities weight the expectations).

  **Are your two cases the same phenomenon?**
  Structurally, yes. Both reveal that "Accuracy" is not a monadic property (like mass) but a relational one (like velocity). You cannot ask "How accurate is Annie?" You must ask "How accurate is Annie *relative to Partition P and Perspective E*?"
  *   In Case 1, you changed the **Partition**.
  *   In Case 2, you changed the **Perspective**.
  *   In your third variant (voiced vs. committed claims), you are changing the **Domain** (which propositions are on the scorecard).

  All three are instances of Scorecard Relativity. The "Scorecard" is the set of choices the evaluator makes before the game begins.

  ### 3. Constraints and Costs

  You asked if there is a constraint on the numerical measures that makes this go away.

  **The Constraint:** **Partition Invariance.**
  To solve Case 1, you would demand a scoring rule where the dominance verdict never flips, regardless of how finely you slice the possibilities. To solve Case 2, you would demand **Perspectival Neutrality** (a single weighting scheme that everyone must accept).

  **The Cost:** **Impossibility.**
  This is the hard pill. Mathematical results in this field (specifically regarding strictly proper scoring rules) show that you cannot have Partition Invariance.
  *   If a scoring rule is sensitive enough to reward truth-tracking on fine-grained partitions (which we want, to encourage precision), it will necessarily yield different dominance relations than on coarse-grained partitions.
  *   If you force the rule to be invariant (so the verdict never flips), you break **Propriety**. The rule would no longer guarantee that an agent minimizes their expected error by being honest. You would destroy the link between "accuracy" and "rationality."

  Similarly, Perspectival Neutrality is impossible without abandoning the Bayesian framework. If you impose a neutral weighting (e.g., a "uniform prior" over worlds), you are no longer evaluating *their* accuracy; you are evaluating *their accuracy plus your assumption about the world*.

  ### 4. Does it Beg the Question?

  **Yes.** This is the philosophical cost of Scorecard Relativity.

  Accuracy-based arguments try to derive norms of belief (e.g., "You should have probabilistic credences") from the goal of "Accuracy." But as you have seen, "Accuracy" is undefined without a Scorecard (Partition + Perspective).
  *   If the theorist picks the partition that makes Probabilism look good, they have assumed the structure of the world that Probabilism requires.
  *   If the theorist picks the perspective that makes their favored agent look good, they have assumed the truth of that agent's priors.

  The argument quietly assumes part of what it is trying to show: it assumes a "Correct Scorecard." It tries to prove Annie is rational because she is accurate, but she is only accurate relative to a Scorecard that already treats her way of slicing the world as the correct one.

  ### 5. Boundary Cases (What falls outside this concept)

  To ensure **Scorecard Relativity** is precise, here are two cases that look similar but fall *outside* the definition:

  1.  **Linear Rescaling:** If you change the score from "Sum of Squared Errors" to "2 times Sum of Squared Errors," the verdict never flips. This is not Scorecard Relativity. This is just changing units (like meters to feet). The *order* of accuracy remains invariant. Scorecard Relativity specifically concerns changes that *reverse* or *instabilize* the normative ordering.
  2.  **Truth-Value Changes:** If Annie wins when $w_1$ is true, and Bella wins when $w_2$ is true, that is not Scorecard Relativity. That is just the definition of contingent accuracy. Scorecard Relativity is when Annie wins when $w_1$ is true *under Description A*, but Bella wins when $w_1$ is true *under Description B*. The *world* hasn't changed; the *measurement* has.

  ### Summary for your Hobbyist Notes

  You have identified that accuracy-first epistemology suffers from **Scorecard Relativity**.
  *   **The Diagnosis:** Accuracy is relative to a Partition and a Perspective.
  *   **The Consequence:** Dominance arguments are unstable; they can be flipped by re-slicing the possibilities or changing the weighting.
  *   **The Fix:** None exists without breaking the system (losing Propriety).
  *   **The Implication:** Accuracy arguments are not "presuppositionless." They require a prior commitment to a specific way of carving up logical space and a specific standpoint for evaluation. Whoever holds the knife (the partition) and the weights (the perspective) decides the winner.

  Your intuition that this "favours whoever got to set the scorecard up" is precisely correct. In the literature, this is often the silent premise: the theorist assumes *their* partition is the "natural" one. Your toy model successfully exposes that assumption.
