answer: |-
  Right, let's have a proper look at this. You've got a really interesting set of intuitions here, and they actually hang together better than you might think. It's easy to get bogged down in the maths of payoff matrices, but your gut is picking up on something deeper about information and agency.

  Here's a quick brainstorm on how these cases link up, followed by the principle I think is doing the heavy lifting, and finally, what that predicts for your new signalling case.

  ### The Brainstorm: Walking Through Your Cases

  **Case 1 (Clones):** Standard game theory says defect because your move doesn't *cause* the other's move. But your intuition says cooperate. Why? Because if you're a clone, your decision procedure is identical. If you decide 'C', they decide 'C'. It's not causality; it's logical correlation. You're essentially playing against a mirror. Cooperation here isn't altruism; it's enlightened self-interest because 'self' includes the opponent.

  **Case 2 (Noise & Forgiveness):** Tit-for-Tat (TFT) is brittle. One bit of noise turns a cooperative run into a ping-pong of retaliation. Your 'shadow-forgive' intuition is spot on. To maintain cooperation under noise, you need a strategy that absorbs errors without collapsing the relationship. It's about preserving the *channel* of cooperation despite static on the line.

  **Case 3 (Uncertain Continuation):** This is the 'shadow of the future' getting fuzzy. If there's a tiny chance of round two, but you don't know if you're in it, the threat of punishment is diluted. I'd argue this is a **smooth gradient**, not a sharp threshold. As the probability of continuation drops, the 'shadow' shortens, and the required level of forgiveness or trust has to adjust continuously. There's no magic switch where cooperation suddenly becomes impossible; it just gets progressively harder to sustain against invasion.

  **Case 4 (Probe-then-Mirror):** You reckon this strategy dies, and you're right. Probing is costly. If you defect to test the opponent, you risk triggering retaliation from a conditional cooperator, or you simply lose the immediate gain against an AllC. Meanwhile, AllD sits back, lets the Probe strategy do the work of identifying targets, and then exploits them. The Probe strategy pays the information cost; AllD free-rides on that information.

  **Case 5 (Kin Selection vs. Reciprocity):** This is the crux of your tension. Case 1 (clones) feels like rational cooperation, but Case 5 (kin) feels like 'cheating'. Why? In Case 1, the agent *knows* the correlation (perfect information). In Case 5, the gene spreads via blind population dynamics; the agent doesn't necessarily 'choose' to cooperate based on recognition. Kin selection works mechanically, but it lacks the *contingent* element of reciprocity. It feels like cheating because there's no exchange, just shared fate.

  ### The Unifying Principle: Contingent Epistemic Assortment

  I don't think you need to drop a verdict; there is a single principle here. I'd call it **Contingent Epistemic Assortment**.

  Cooperation evolves and feels 'stable' when two conditions are met:
  1.  **Assortment:** Cooperators must interact with other cooperators more often than chance (clones, kin, or partners who recognise each other).
  2.  **Epistemic Contingency:** The agents must have access to information that allows them to *condition* their behaviour on that assortment.

  Here's how it maps to your cases:

  *   **Case 1 (Clones):** Perfect assortment + Perfect information. I know you are me, so I condition my move on ours jointly.
  *   **Case 2 (Noise):** Assortment via history. Noise obscures the information (did they defect or was it an error?). 'Shadow-forgive' works because it preserves the epistemic link despite the noise.
  *   **Case 3 (Uncertainty):** Probabilistic information. The 'shadow' is just the weight of future information. As certainty drops, the ability to condition behaviour weakens smoothly.
  *   **Case 4 (Probe):** The Probe strategy tries to *create* information, but it pays a cost to do so. AllD doesn't need the information; it just exploits. The Probe strategy fails because the cost of acquiring the epistemic state (knowing who is who) is too high relative to the benefit, given the presence of free-riders.
  *   **Case 5 (Kin):** This is the outlier that explains your discomfort. Kin selection has **Assortment** (high $r$), but it lacks **Epistemic Contingency**. The agent isn't cooperating *because* they recognise kin; they cooperate because the gene forces it. It feels like 'cheating' reciprocity because reciprocity requires a choice based on information. Case 1 feels different because the clone scenario implies the *agent* knows the correlation, whereas kin selection is often modelled as blind.

  So, the principle is: **Cooperation is robust when agents can reliably identify shared fate and condition their actions on it without being exploited during the identification process.**

  ### The Prediction: Costly Signalling with Locked Convention

  Now, let's apply **Contingent Epistemic Assortment** to your new case:
  *   **Setup:** One-shot PD.
  *   **Mechanism:** Costly signal beforehand.
  *   **Constraint:** Signal meaning is locked by social convention (not strategic choice).

  **The Analysis:**
  In this scenario, the signal acts as a tag. Because the meaning is locked by convention, everyone knows that "Signal X means I intend to Cooperate". Because it is costly, it acts as a barrier.

  However, remember the principle: we need *Contingency* and protection from *Exploitation during identification*.

  1.  **The Defector's Calculus:** A defector can send the signal. Yes, it costs something ($c$). But if sending the signal induces the opponent to cooperate, the defector gets the Temptation payoff ($T$) minus the cost ($c$). The cooperator gets Reward ($R$) minus cost ($c$).
  2.  **The Stability:** As long as $T - c > P$ (the payoff for mutual defection without signalling), defectors will send the signal to exploit the cooperators. The cost is just a tax on exploitation.
  3.  **The Convention Lock:** You said the meaning is locked by convention rather than strategic choice. This implies I can't choose to make the signal mean "I will defect". But can I choose to send the signal and *then* defect? In a one-shot game with no external enforcement, yes. The convention is just shared knowledge, not a binding contract.

  **The Verdict:**
  Cooperation will **collapse**.

  Here's why: The signal fails to create true **Epistemic Assortment**. It creates a pool of 'Signallers', but because the game is one-shot, there is no future penalty for lying. Defectors will happily pay the signalling cost to gain access to the 'sucker' payoff from cooperators. The signal becomes a membership fee for the club of people willing to be exploited.

  Unless the cost is so high that $T - c < R$ (which would make defection irrational even without the PD structure) or $T - c < P$ (making signalling irrational for defectors), the signal doesn't filter out defectors. If the cost is that high, cooperators won't pay it either.

  **The Twist:**
  The only way this works is if the "locked convention" implies a **second-order belief**. If the convention is so strong that *believing* a non-signaller will defect is universal, then signalling becomes a coordination point. But even then, in a one-shot PD, the incentive to defect *after* signalling remains.

  So, my prediction based on the principle is: **The signal becomes a costly badge that defectors wear to deceive. Cooperation might spike initially due to the convention, but evolutionarily, it is unstable. The population will drift towards defectors who signal, unless the cost is prohibitive for everyone.**

  ### Summary

  Your intuitions are tracking the difference between **mechanical correlation** (kin) and **informational contingency** (clones/reciprocity).

  *   **Principle:** Cooperation sticks when agents can identify shared interests *and* act on that knowledge without paying a cost that allows free-riders to invade.
  *   **Case 5 Resolution:** Kin feels like cheating because it lacks the informational contingency; it's blind assortment.
  *   **New Case:** Fails because the signal doesn't prevent lying in a one-shot setting; it just taxes the interaction. Defectors mimic the signal, breaking the assortment.

  It's a bit grim, isn't it? Trust requires more than just a handshake; it requires a shadow of the future or a lock on identity that can't be faked.
