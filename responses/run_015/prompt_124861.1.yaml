prompt: |-
  I co-teach an upper-level undergraduate seminar in philosophy of science — fourteen students, a single hundred-minute session, a seminar room with a projector and movable chairs, no lab equipment beyond index cards, a sealed envelope and a laptop. We have already spent two weeks on confirmation and on the holist point that a hypothesis is never tested alone, and I want this session to make them *feel* the pull of the underdetermination of theory by evidence before anyone says the word. My attempt last year was a black box they could query for input–output pairs; it degenerated inside ten minutes into simulation-skepticism and I never got them back. So I need the rules and the scoring arranged so that the cheap skeptical move is expensive and the construction of a substantive rival is cheap, and I need the word withheld until the debrief.

  The shape I have in mind, which you should improve or replace rather than just fill in: four teams of three or four; a dataset of maybe forty noisy observations generated by a secret rule that I can implement in a spreadsheet formula in ten minutes, which you should invent and specify along with the noise model; a first round in which each team commits in writing to a rule and to predictions for five held-back queries, scored against the truth; a second round in which they get more data and may revise, with the scoring arranged so that wagering on your own rule has real downside; and a third round in which each team is *required* to produce, against the best rule in the room, a rival that fits every observation made so far and that no future query from this apparatus could distinguish from it. The facilitator's secret is that the true rule is one that nobody in the room proposes, and the reveal is that even the reveal does not settle things. I want the payoff structure to be points that cost me nothing and the students only a trivial stake — picking next week's reading topic, say — and I want a minute-by-minute timeline for the hundred minutes, including what the facilitator does while the teams are working.

  Here is the part I care most about, and where I think the activity can be made to do real philosophical work. I want the debrief to prise apart three claims that I think get run together: the near-trivial modal claim that for any finite body of evidence there are indefinitely many incompatible hypotheses equally consistent with it; the historical claim that at most actual junctures there were serious alternatives that the community had not yet conceived, so that the first claim has teeth in practice and not merely in logical space; and the methodological claim that the canons we use to choose between empirically equivalent theories — simplicity, conservatism, scope, whatever else — do not track the truth. My hunch is that a ninety-minute game can make the first vivid, can only *stage* the second by fiat, and cannot touch the third at all, and I want you to tell me if that is right and which of the three your design actually gives anyone warrant for. I also want the teams' rivals in round three to be sorted by an explicit admissibility test you specify in advance — something like being statable in the vocabulary already available to the community, not working by deferring the disagreement to a place or time no query will ever reach, and not being generated solely by negating the rival — because I suspect the interesting disagreement is not about whether empirically equivalent rivals exist but about whether contrivance is a defect, and I would like the activity to surface that rather than have me assert it. If you think my three-way taxonomy is wrong, or that two of the claims collapse into one, say so before designing around it.

  Two further requests. First, be honest about what goes wrong when this is actually run: I expect someone to produce a gerrymandered rival and conclude that science is irrational, I expect the scoring to reward overfitting, I expect the reveal to be dismissed as the facilitator cheating, and I expect it all to overrun — tell me what else to expect and how to handle each, including how to keep the session from landing on global skepticism about inquiry. Second, and most important: when you write the debrief, separate what is settled among people who work on this from what is genuinely contested, do not present a contested view as the consensus view, and mark the places where the design itself rigs the intuition — where the activity makes one side of the debate look stronger than the literature supports, and what I should say out loud to compensate.
reasoning: |-
  Here's a thinking process that leads to the suggested lesson plan:

  1.  **Analyze the Request:**

      *   **Context:** Upper-level undergraduate philosophy of science seminar (14 students).
      *   **Constraints:** 100 minutes, one session, seminar room (projector, movable chairs), minimal props (index cards, sealed envelope, laptop).
      *   **Prior Knowledge:** 2 weeks on confirmation and holism (Duhem-Quine).
      *   **Goal:** Make students *feel* underdetermination of theory by evidence (UTE) before naming it. Avoid "simulation skepticism" (black box failure last year).
      *   **Structure:** 4 teams (3-4 students). 3 Rounds (Commit/Predict, Revise/Wager, Construct Rival).
      *   **Secret:** The true rule is *not* proposed by anyone. Reveal doesn't settle things.
      *   **Stakes:** Trivial (e.g., choosing next week's reading).
      *   **Key Philosophical Work:** Distinguish three claims:
          1.  Modal (logical possibility of rivals).
          2.  Historical (actual existence of unconceived alternatives).
          3.  Methodological (virtues like simplicity don't track truth).
      *   **Requirements:**
          *   Design/Improve the activity structure.
          *   Specify the secret rule and noise model.
          *   Specify scoring/payoff (make skepticism expensive, construction cheap).
          *   Specify admissibility test for Round 3 rivals.
          *   Minute-by-minute timeline (including facilitator actions).
          *   Critique the three-claim taxonomy (do they collapse?).
          *   Predict failure modes (gerrymandering, overfitting, cheating accusations, skepticism, overrun) and mitigation.
          *   Debrief script: Distinguish settled vs. contested, mark where the design rigs intuition.

  2.  **Deconstruct the Philosophical Taxonomy:**

      *   *Claim 1 (Modal):* For any finite $E$, $\exists$ infinite $H$ s.t. $H \vdash E$. (Quine/Duhem). Generally accepted as logically true.
      *   *Claim 2 (Historical/Practical):* At actual junctures, serious alternatives existed but were unconceived. (Stanford's "Unconceived Alternatives"). Contested. Some say science converges; others say history shows suppression of rivals.
      *   *Claim 3 (Methodological):* Theoretical virtues (simplicity, etc.) do *not* track truth. (Realism vs. Anti-Realism). Highly contested. Realists argue virtues *are* truth-conducive; Anti-Realists say they are pragmatic.
      *   *User's Hunch:* Activity makes (1) vivid, stages (2) by fiat, can't touch (3).
      *   *My Assessment:* The user is mostly right, but (2) and (3) often bleed together. If virtues don't track truth (3), then unconceived alternatives (2) matter more. If virtues *do* track truth, (2) is less threatening. The activity *can* touch (3) if the scoring penalizes complexity, but since the "True Rule" is hidden, students can't verify if simplicity won. I need to be careful not to imply the activity proves (3).
      *   *Refinement:* I should validate the taxonomy but warn that (3) is the flashpoint. The activity demonstrates (1) empirically. It *simulates* (2) by hiding the true rule. It *problematizes* (3) by showing students prefer simple rules that might be wrong, but it cannot *prove* virtues fail.

  3.  **Design the Activity (The "Function Finder"):**

      *   *Problem with last year:* Black box led to "maybe the box is lying."
      *   *Solution:* The "Truth" must be mathematically verifiable post-game, not dependent on the facilitator's honesty during the game. The "Secret Rule" should be in the sealed envelope (printed out) or a pre-generated spreadsheet projected *after* the game.
      *   *The Rule:* Needs to be simple enough to calculate but complex enough to evade quick discovery. A polynomial? A piecewise function? Let's go with a quadratic with a twist, or a specific modular arithmetic rule.
      *   *Better Idea:* A linear rule with a "glitch" or a specific threshold. Let's use $y = 2x + 3$ *unless* $x$ is a multiple of 5, then $y = 2x + 10$. This creates "noise" that looks like error but is deterministic. Or, to fit the "noise model" request: $y = 2x + 3 + \epsilon$, where $\epsilon$ is deterministic pseudo-noise (e.g., based on the digit sum of $x$).
      *   *Selected Rule:* $f(x) = 3x + 1$. *Noise:* Add $(-1)^x$. So if $x$ is even, $y = 3x + 2$. If $x$ is odd, $y = 3x$.
      *   *Wait, simpler:* Let's make it a sequence prediction. Input $n$, Output $a_n$.
      *   *Rule:* $a_n = n^2 - n + 41$ (Euler's prime generating polynomial). It looks linear/quadratic for small $n$, then diverges.
      *   *Actually, for 100 mins:* Needs to be calculable by hand quickly.
      *   *Proposed Rule:* $y = 2x + 1$ for $x < 10$, and $y = 2x + 1 + (x-10)$ for $x \ge 10$. (A "kinked" linear function).
      *   *Noise Model:* To prevent exact fitting, add a deterministic "error" based on a public seed (e.g., last digit of student ID or just a fixed sequence). Let's stick to the prompt's request: "noisy observations generated by a secret rule... specify noise model."
      *   *Decision:* True Rule: $y = 3x + 2$. Noise: Add $+1$ if $x$ is prime, $-1$ if $x$ is composite, $0$ if $x=1$. This makes it look messy but recoverable.
      *   *Wait, the "True Rule is one nobody proposes" constraint:* If the rule is $3x+2$ with noise, they will propose $3x+2$. I need a rule that looks like something else.
      *   *Revised True Rule:* $y = \text{round}(2.5x + 1)$. (Linear with rounding).
      *   *Better:* $y = x + \text{sum of digits of } x$. (Non-linear, looks noisy).
      *   *Let's go with the "Kinked Line" but hidden.* True Rule: $y = 2x$ for $x \le 10$, $y = 3x - 10$ for $x > 10$.
      *   *Data:* Provide $x=1$ to $8$ in Round 1. Hold back $9, 10, 11, 12, 13$ for prediction.
      *   *Round 3:* They must make a rival that fits *all* data (including the reveal).
      *   *Admissibility:* Must use vocabulary available (algebraic terms), no "grue" predicates (no referencing the date of the experiment), no "except when the professor blinks."

  4.  **Scoring & Incentives:**

      *   *Goal:* Make skepticism expensive. (i.e., "Anything goes" gets 0 points). Make substantive rivals cheap.
      *   *Round 1:* Points for correct predictions.
      *   *Round 2:* Wager points. If you stick to your rule and it works, bonus. If you change, penalty? No, allow revision but cost "credibility."
      *   *Round 3:* Points for generating an *admissible* rival.
      *   *Winning:* Team with most points chooses reading.
      *   *Anti-Skepticism:* If a team says "We can't know," they get 0 points for prediction. They must commit.

  5.  **Timeline (100 Minutes):**

      *   0-10: Setup & Rules.
      *   10-25: Round 1 (Data 1-8, Commit Rule, Predict 9-13).
      *   25-35: Reveal Data 9-13. Scoring R1.
      *   35-50: Round 2 (New Data 14-20, Revise Rule, Wager).
      *   50-60: Reveal Data 14-20. Scoring R2.
      *   60-75: Round 3 (Construct Rival to Best Rule). Admissibility Check.
      *   75-85: The Reveal (True Rule).
      *   85-100: Debrief (The 3 Claims).

  6.  **Addressing the "Three Claims" Critique:**

      *   I need to be honest. The activity *proves* (1) in the context of the game. It *simulates* (2) by hiding the rule (but students know it's a game). It *challenges* (3) but doesn't settle it (because in the game, the "True Rule" is arbitrary, whereas in science, truth is about the world).
      *   *Crucial:* I must warn the instructor not to conflate "True Rule in Game" with "Truth in Science."

  7.  **Failure Modes & Mitigation:**

      *   *Gerrymandering:* "The rule is $y=f(x)$ unless it's Tuesday." -> Admissibility test blocks this.
      *   *Overfitting:* Team fits a 20-degree polynomial. -> Penalty for complexity in scoring? Or just admissibility (must be "simple" form). Let's use a "Complexity Cost" in scoring.
      *   *Cheating:* "The prof changed the rule." -> Sealed envelope with rule printed beforehand.
      *   *Skepticism:* "Science is impossible." -> Debrief must pivot to *pragmatic* choice, not truth.
      *   *Overrun:* Keep strict timekeeping. Use a visible timer.

  8.  **Drafting the Content:**

      *   *Rule:* $y = 2x + \text{remainder}(x, 5)$. (Looks like $2x$ with wobbles).
      *   *Noise:* Actually, let's make it deterministic so there's no "noise" argument, just "hidden structure." The prompt asks for "noisy observations." Okay, $y = 2x + \epsilon$, where $\epsilon$ is drawn from a fixed seed list I have.
      *   *Wait, prompt says:* "secret rule... implement in spreadsheet... specify noise model."
      *   *Okay:* Rule: $y = 3x + 1$. Noise: $\pm 1$ determined by the parity of the $x$ value. (Even $x \to +1$, Odd $x \to -1$).
      *   *Observation:* $x=1 \to 3(1)+1-1 = 3$. $x=2 \to 3(2)+1+1 = 8$. $x=3 \to 3(3)+1-1 = 9$.
      *   *Pattern:* 3, 8, 9, 14, 15... Looks like $2.5x$? Or $3x$ with error?
      *   *Actually, to ensure nobody guesses it:* Make the "True Rule" slightly more complex than they expect, e.g., $y = 2x + 1 + \text{floor}(x/4)$.
      *   *Let's refine the "True Rule" for the "Nobody Proposes" constraint.*
      *   *Rule:* $y = 2x + 1$. *BUT* the data provided has a systematic error in the first 10 points that corrects later? No, that's dishonest.
      *   *Honest approach:* The rule is $y = 2x + 1$. The *noise* is the trick. The noise is correlated with $x$ in a way they won't spot in 20 mins.
      *   *Rule:* $y = 2x$. *Noise:* $+2$ if $x$ is prime, $0$ otherwise.
      *   *Data:* 1(2), 2(6), 3(8), 4(8), 5(12), 6(12), 7(16)...
      *   *Students will guess:* $y = 2x + 2$? $y = 2x + \text{something}$?
      *   *If nobody guesses the prime correlation:* Success.
      *   *Round 3:* They must make a rival. E.g., "It's $2x + 2$ for $x<10$ and $2x$ for $x>10$."
      *   *Admissibility:* No "prime" predicate if not in vocabulary? No, "prime" is standard math.
      *   *Better Admissibility:* Must be projectable. "Prime" is projectable. "Matches the data points exactly" is not (polynomial interpolation).
      *   *Constraint:* "No polynomial of degree higher than 2."

  9.  **Refining the Debrief & Philosophy:**

      *   *Claim 1 (Modal):* The game proves this. You found rivals.
      *   *Claim 2 (Historical):* The game *stages* this. You didn't conceive the prime rule. But is that because it's hard or because it's unnatural?
      *   *Claim 3 (Methodological):* You likely chose the simpler rule ($2x + \text{constant}$) over the prime rule. Did simplicity track truth? No (in the game). Does it in science? Debatable.
      *   *Rigging:* The game makes simplicity *fail* by design (True Rule is complex). In science, we hope simplicity *succeeds*. I must highlight this disanalogy.

  10. **Final Review against Constraints:**
      *   14 students, 4 teams.
      *   100 mins.
      *   No lab equipment.
      *   Scoring: Points cost nothing.
      *   Timeline included.
      *   Failure modes addressed.
      *   Debrief distinctions clear.

  11. **Self-Correction on "Noise":**
      *   If I use "noise," students might say "The data is just noisy, the rule is simple."
      *   If I use "deterministic hidden variable," it's cleaner for UTE.
      *   Let's call it "Systematic Error" rather than random noise. It fits the "Duhemian" vibe better (auxiliary hypotheses).
      *   *Revised Plan:* The "Apparatus" adds a offset.
      *   *True Relation:* $Y = 2X$.
      *   *Apparatus Offset:* $+3$ if $X$ is odd, $+0$ if $X$ is even.
      *   *Observed:* $X=1 \to 5$, $X=2 \to 4$, $X=3 \to 9$, $X=4 \to 8$.
      *   *Student Hypothesis:* $Y = 2X + 2$ (averaging). Or $Y = 2.5X$.
      *   *True Rule (including apparatus):* $Y = 2X + (X \mod 2) \times 3$.
      *   *This ensures nobody guesses it immediately.*

  12. **Scoring Logic:**
      *   Round 1: 10 pts per correct prediction (within $\pm 1$).
      *   Round 2: Wager 0-20 pts. If rule predicts new data, gain wager. If not, lose wager.
      *   Round 3: 20 pts for an admissible rival that fits all data.
      *   This makes "We can't know" costly (0 pts). Makes "Construct rival" rewarding.

  13. **Admissibility Test:**
      *   1. Statable in current vocabulary (no "Grue").
      *   2. No arbitrary lists (no "Matches these 20 points exactly").
      *   3. No deferred disagreement (no "Differs at X=1000").
      *   4. Must be genuinely distinct (not just rephrasing).

  14. **Writing the Response:**
      *   Tone: Professional, pedagogical, philosophically precise.
      *   Structure: Activity Design, Timeline, Failure Modes, Debrief Guide.
      *   Check the "Three Claims" critique carefully.

      *(Self-Correction during drafting)*: I need to make sure the "True Rule" is in the sealed envelope *before* class starts to avoid cheating accusations. I will specify this in the prep.
      Also, need to ensure the "Noise" doesn't look like *random* noise, otherwise they just fit a regression line. It must look like a *rival pattern*. The Odd/Even offset is good for this.

      *Wait, one more thing:* The prompt asks me to "tell me if that is right [about the 3 claims] and which of the three your design actually gives anyone warrant for."
      *My verdict:* The design gives warrant for (1). It provides a *simulation* of (2). It provides *counter-evidence* to a naive version of (3) within the game context, but I must warn that this doesn't transfer to real science without caveats.

      *Let's finalize the Rule:*
      True Physical Law: $y = 2x$.
      Measurement Artifact: $+3$ if $x$ is odd.
      Observed Data: $x=1, y=5$; $x=2, y=4$; $x=3, y=9$; $x=4, y=8$...
      Most students will guess $y = 2x + 2.5$ (rounded) or $y = 2.5x$.
      The "True Rule" (Law + Artifact) is $y = 2x + 3(x\%2)$.
      This is perfect for Duhem-Quine (Hypothesis + Auxiliary = Prediction).

      *Wait, Round 3 requirement:* "produce... a rival that fits every observation... and that no future query... could distinguish."
      If the true rule is $2x + \text{odd-offset}$, a rival could be $2.5x$ (if it fits closely enough) or a piecewise function.
      Actually, for UTE, the rival must be *empirically equivalent*.
      If the true rule is deterministic, any rival must match the deterministic output.
      So the rival is a different *explanation* for the same numbers.
      Example Rival: "The machine computes $2.5x$ and rounds to nearest even number."
      This works for the debrief.

      *Okay, ready to write.*
answer: |-
  Here is a complete design for the session, including the activity mechanics, the philosophical scaffolding, and a candid assessment of what the activity can and cannot prove.

  ### Part 1: Critique of the Three-Claim Taxonomy

  You asked me to evaluate your three-way taxonomy before designing around it. Your hunch is largely correct, but there is a collapse risk between (2) and (3) that you need to manage in the debrief.

  1.  **The Modal Claim (Logical Underdetermination):** *For any finite $E$, there are indefinitely many incompatible $H$ consistent with $E$.*
      *   **Verdict:** The activity **successfully demonstrates** this. By Round 3, students will have mathematically constructed distinct functions that yield identical outputs for the tested inputs. This is not just vivid; it is proven within the closed system of the game.
  2.  **The Historical Claim (Unconceived Alternatives):** *At actual junctures, serious alternatives existed but were unconceived.*
      *   **Verdict:** The activity **stages this by fiat**. You are hiding the true rule. Students *failed* to conceive the true rule (the "odd-offset"), but only because you rigged the game to make it obscure. In real science, the claim is that nature hides rules *without* a gamemaster. The activity makes this feel real, but it is a simulation. You must explicitly flag this disanalogy.
  3.  **The Methodological Claim (Virtues vs. Truth):** *Simplicity, conservatism, etc., do not track truth.*
      *   **Verdict:** The activity **problematizes this but does not settle it.** In your game, the "True Rule" is complex (linear + modular arithmetic), while the students' best guess will likely be simpler (linear regression). Thus, simplicity *failed* to track truth in the game. However, in real science, Realists argue simplicity *does* track truth (or approximate truth), while Anti-Realists say it is merely pragmatic. Because you (the facilitator) arbitrarily chose a complex true rule, the game is rigged against the Realist. If you don't disclose this rigging, you mislead them.

  **Recommendation:** Do not present these as three separate proofs. Present them as a ladder: The game *proves* (1), which forces us to worry about (2), which in turn forces us to interrogate (3).

  ---

  ### Part 2: Activity Design ("The Black Box Protocol")

  **The Secret Rule (Facilitator Prep)**
  *   **The Physical Law:** $y = 2x$
  *   **The Auxiliary (Measurement Artifact):** $+3$ if $x$ is odd; $+0$ if $x$ is even.
  *   **The Observed Function:** $f(x) = 2x + 3(x \mod 2)$.
  *   **Data Sequence:**
      *   $x=1 \to 5$
      *   $x=2 \to 4$
      *   $x=3 \to 9$
      *   $x=4 \to 8$
      *   $x=5 \to 13$
      *   $x=6 \to 12$
      *   ... up to $x=20$.
  *   **Why this works:** It looks like a noisy linear relationship ($y \approx 2.5x$) or a simple linear relationship with error ($y = 2x + 2.5$). The "True Rule" is a conjunction of a physical law and an auxiliary hypothesis about the instrument, perfectly illustrating the Duhem-Quine point you covered in weeks 1–2.
  *   **Security:** Print the formula and the first 20 data points on a sheet of paper. Seal it in the envelope *before* class. Write the hash (e.g., SHA-256) of the document on the board at minute 0 so you cannot change it later.

  **The Admissibility Test (Round 3)**
  To prevent "gerrymandering" (e.g., "The rule is the data points listed above"), a rival hypothesis is **Admissible** only if:
  1.  **Projectability:** It must predict values for $x > 20$ without listing them individually (no lookup tables).
  2.  **Vocabulary:** It must use only mathematical terms available at the start of class (algebra, mod, floor/ceil). No "The rule changes if the professor blinks."
  3.  **Non-Triviality:** It cannot be a mere rephrasing of the leading rule (e.g., "$y = 2(x+1) - 2$ for even $x$" is just the leading rule). It must posit a different *mechanism* or *structure*.
  4.  **Empirical Equivalence:** It must yield the exact integer output for $x=1$ to $20$.

  **Scoring & Stakes**
  *   **Currency:** "Credibility Points" (CP).
  *   **Stake:** The team with the most CP chooses the primary reading for next week (from a pre-approved list of 3: one Realist, one Anti-Realist, one Historical).
  *   **Round 1 (Discovery):** 10 CP for each correct prediction (within $\pm 1$) of the held-back queries ($x=21, 22, 23, 24, 25$). *Constraint:* Must commit to a written rule formula.
  *   **Round 2 (Wager):** Teams see data up to $x=30$. They may revise their rule. They wager 0–50 CP on their new rule predicting $x=31, 32, 33$. Correct = gain wager; Incorrect = lose wager. *This makes skepticism expensive (0 wager = 0 gain).*
  *   **Round 3 (Rivalry):** 50 CP for producing an **Admissible Rival** to the room's "Leading Theory" (the rule with the highest CP score) that fits all data ($x=1$ to $33$).
  *   **Penalty:** -20 CP if a team claims "Science is impossible" and refuses to submit a rule.

  ---

  ### Part 3: Minute-by-Minute Timeline (100 Minutes)

  | Time | Phase | Facilitator Actions |
  | :--- | :--- | :--- |
  | **00–05** | **Setup** | Display hash of sealed envelope. Explain stakes (Reading Choice). Divide into 4 teams. Distribute **Data Set A** ($x=1$ to $8$). |
  | **05–20** | **Round 1** | Teams derive a rule. They must write down: (1) The Formula, (2) Predictions for $x=9, 10, 11, 12, 13$. Collect papers. |
  | **20–25** | **Reveal 1** | Reveal true outputs for $x=9$ to $13$. Teams grade themselves. Award CP. |
  | **25–30** | **Intermission** | Distribute **Data Set B** ($x=14$ to $20$). Allow teams to discuss anomalies. |
  | **30–45** | **Round 2** | Teams may revise formula. They must place a **Wager** (0–50 CP) on predictions for $x=21, 22, 23$. Collect papers. |
  | **45–50** | **Reveal 2** | Reveal true outputs for $x=21$ to $23$. Settle wagers. Update scoreboard. |
  | **50–55** | **Transition** | Announce the "Leading Theory" (the team with the most CP). Distribute **Data Set C** ($x=24$ to $33$). |
  | **55–75** | **Round 3** | **Task:** Construct an *Admissible Rival* to the Leading Theory that fits *all* data ($1–33$). <br>**Facilitator Role:** Circulate. If a team proposes a "list" rule, remind them of Admissibility Test #1. If they say "It's impossible," remind them of the Skepticism Penalty. |
  | **75–80** | **Rivalry Check** | Teams present rivals. You (Facilitator) act as Judge: Admissible or Inadmissible? Award 50 CP for Admissible Rivals. |
  | **80–85** | **The Reveal** | Open the envelope. Project the True Rule ($2x + \text{odd-offset}$). Show that it fits all data. |
  | **85–100** | **Debrief** | Structured discussion (see Part 5). |

  ---

  ### Part 4: Failure Modes & Mitigation

  | Failure Mode | Prediction | Mitigation Strategy |
  | :--- | :--- | :--- |
  | **The "Grue" Move** | A team proposes: "$y = \text{Leading Theory}$ for $x < 34$, and $y = 0$ for $x \ge 34$." | **Enforce Admissibility Test #3 (Non-Triviality).** Ask: "Does this posit a different physical structure, or just a different future?" Reject it. |
  | **The Overfit** | A team fits a 30-degree polynomial to the data. | **Enforce Admissibility Test #1 (Projectability).** Ask them to calculate $x=100$ by hand. If they can't explain the *pattern*, it's a list, not a rule. |
  | **The Skeptic** | A team says "We can't know the rule, so we submit nothing." | **Invoke the Penalty.** "-20 CP. You are out of the running for the reading choice. Do you want to stay out?" Usually, the social pressure to compete restores participation. |
  | **The Cheating Accusation** | "You changed the rule in the envelope!" | **The Hash.** The SHA-256 hash on the board proves the document existed at minute 0. Keep the envelope sealed until the end. |
  | **Global Skepticism** | "If we can't get this right, science is irrational." | **Pivot in Debrief.** "Science isn't about getting the *exact* rule in 20 minutes. It's about eliminating the *inadmissible* ones. You eliminated the 'list' rules. That's progress." |
  | **Time Overrun** | Round 3 drags on as teams argue about math. | **Hard Stop.** At minute 75, stop work. Judge the rivals based on what is on the page. Do not allow oral defense. |

  ---

  ### Part 5: The Debrief Script (Philosophical Work)

  *Note to Facilitator: Your tone here must be precise. Do not let the game's outcome dictate the philosophy. The game is a model, not the territory.*

  **1. Settling the Modal Claim (Claim 1)**
  *   **Say:** "Look at the board. We have the Leading Theory ($y \approx 2.5x$) and at least two Admissible Rivals from Round 3. They are mathematically distinct. They fit the same data. This proves the **Modal Claim**: Logic alone cannot force us to one theory. This is not controversial. Quine won this argument."
  *   **Warrant:** The activity *proves* this.

  **2. Staging the Historical Claim (Claim 2)**
  *   **Say:** "None of you proposed the True Rule ($2x + \text{offset}$). Why? Was it logically impossible? No. It was unconceived. This *stages* the **Historical Claim**. But notice the rigging: I hid the rule. In real science, there is no gamemaster hiding the truth. The question is: Does nature hide rules as effectively as I did? Stanford says yes; Realists say no. This game doesn't answer that, but it makes the *worry* visceral."
  *   **Warrant:** The activity *simulates* this. Be explicit that the "unconceived" nature was due to time limits and obscurity, not necessarily scientific limitation.

  **3. Problematizing the Methodological Claim (Claim 3)**
  *   **Say:** "Most of you bet on the simpler rule (linear). The True Rule was complex (linear + modular). In this game, **Simplicity failed to track Truth.** Does this mean simplicity is useless? No. It means simplicity is a *bet*, not a guarantee."
  *   **Crucial Distinction:** "Realists argue that in the *long run*, simplicity correlates with truth because nature is lawful. Anti-Realists argue simplicity is just about human cognitive ease. This game is rigged against the Realist (I chose a complex truth). In real inquiry, we hope the Realist is right. But you now feel why the Anti-Realist is worried."
  *   **Warrant:** The activity *challenges* a naive view of (3), but you must disclose the rigging.

  **4. The "Contrivance" Question (Admissibility)**
  *   **Say:** "In Round 3, I rejected rules that were just lists of numbers. Why? Because they weren't *explanations*. This is where the real debate lives. It's not about whether rivals *exist* (they do). It's about whether 'contrived' rivals count as *science*. If you define science as 'saving the phenomena,' the contrived rival wins. If you define it as 'revealing structure,' it loses. Which definition are you using?"

  **5. Closing the Skepticism Loop**
  *   **Say:** "Did this session prove inquiry is impossible? No. It proved that **evidence underdetermines theory**, but **admissibility constraints narrow the field**. You didn't find the truth, but you eliminated the nonsense. That is what scientific progress looks like in an underdetermined world."

  ### Final Checklist for Facilitator
  1.  **Prep:** Generate the data in Excel. Print the rule. Seal envelope. Compute hash.
  2.  **Room:** Arrange chairs in 4 pods. Projector ready for data tables.
  3.  **Mindset:** You are not the Oracle; you are the Administrator. The "Truth" is in the envelope, not your head. This depersonalizes the reveal.
  4.  **Honesty:** In the debrief, explicitly admit: "I chose a complex rule to make the point. Nature might not be that tricky." This prevents the "Science is hopeless" conclusion.
