answer: |-
  Here is the mapping of the Varsity Blues scandal through the four specified lenses of meritocracy and desert, followed by the control case stress-test and the theoretical pressure analysis.

  ### Part I: The Four Justifications vs. Varsity Blues

  **1. Desert Proper (The Entitlement View)**
  *   **Core Principle:** A selective place is a good that is *owed* to the individual who has demonstrated the requisite prior excellence. It is a retrospective reward for virtue/achievement.
  *   **What Went Wrong:** The scandal was a theft of entitlement. By fabricating credentials, the Singer clients claimed a place that was morally owned by a different applicant who had actually generated the test scores or athletic record. The harm is not primarily to the university, but to the "true" deserving candidate who was displaced. The cheaters took property (the seat) that was not theirs.

  **2. The Role View (The Functional View)**
  *   **Core Principle:** Admissions offices are gatekeepers for specific social functions. A student seat is an "office" with a purpose (e.g., to learn, to graduate, to play on the team, to contribute to alumni network). Places should go to those who will best fulfill that function.
  *   **What Went Wrong:** Functional corruption. The "side door" admitted students who could not fulfill the role they were assigned. The fake recruits could not play the sport; the inflated scores suggested academic readiness that did not exist. This degraded the utility of the institution. A team with non-players loses; a classroom with underprepared students disrupts the pedagogical function. The university was defrauded of its ability to select tools for its own mission.

  **3. Luck-Discounted (The Effort View)**
  *   **Core Principle:** Talent is brute luck (genetic/social lottery) and cannot ground moral desert. Only effort and will can ground desert. A meritocratic system should attempt to isolate effort from unearned advantage.
  *   **What Went Wrong:** The scandal was the conversion of brute luck (wealth) into a false signal of effort. Paying Singer is pure wealth deployment. It masked the lack of student effort (studying, training) with financial transaction. It violated the moral arithmetic of meritocracy by allowing money to stand in for grit. The outrage here is that the "game" was supposed to measure the kid's agency, but instead measured the parents' liquidity.

  **4. The Procedural View (The Rule-of-Game View)**
  *   **Core Principle:** Merit is whatever the agreed-upon rules say it is. Justice is not about the "true" best person, but about the integrity of the sorting mechanism. If the mechanism is buyable, the competition is void.
  *   **What Went Wrong:** Breach of contract. The admissions process is a rule-bound competition. Singer's operation bypassed the rules (bribes, fraud) rather than playing within them. It doesn't matter if the kid was actually smart or athletic; what matters is that the *process* by which they were selected was unauthorized. The harm is to the integrity of the competition itself, rendering the results illegitimate regardless of the outcome.

  ---

  ### Part II: The Control Cases Matrix

  Here we run the six scenarios against the four views to see what each *must* condemn.

  | Case | (a) Desert Proper | (b) Role View | (c) Luck-Discounted | (d) Procedural |
  | :--- | :--- | :--- | :--- | :--- |
  | **1. Paying for Test Prep** | **Ambivalent.** If prep reveals true ability, okay. If it masks lack of ability, wrong. | **Permissible.** If it helps student succeed in role, it serves the function. | **Condemn.** Access to prep is wealth-based luck, not effort. Distorts the effort signal. | **Permissible.** If rules allow prep, it is legal play. |
  | **2. Elite Private School** | **Ambivalent.** Did the student earn the grades, or did the school manufacture them? | **Permissible.** Private schools often better prepare for the "role" of elite college student. | **Condemn.** Access is based on parental wealth (luck), not student effort. | **Permissible.** If admissions rules accept these transcripts, it is valid. |
  | **3. Legacy Status** | **Condemn.** Lineage is not achievement. The seat is not owed based on parentage. | **Permissible/Required.** If alumni loyalty/funding helps the institution function, it serves the role. | **Condemn.** Pure brute luck (genetics/birth). No effort involved. | **Permissible.** If the university explicitly allows legacy preferences, it is procedural. |
  | **4. Endowing a Building** | **Condemn.** Money is not merit. The seat is not owed to the donor. | **Permissible/Required.** Funding enables the institution to exist/function. Transactional utility. | **Condemn.** Wealth is luck. Buying a seat negates effort-based sorting. | **Permissible.** If "development cases" are a stated rule, it is valid procedure. |
  | **5. Genuine Recruited Athlete** | **Permissible.** They earned the spot through training/performance. | **Permissible.** They fulfill the specific role of representing the university in sport. | **Ambivalent.** Natural talent is luck, but training is effort. Usually accepted as mixed. | **Permissible.** Follows the established recruiting rules. |
  | **6. Bribing for Fake Recruit** | **Condemn.** No earning occurred. | **Condemn.** Role cannot be fulfilled (fake athlete). | **Condemn.** Wealth substituting for effort. | **Condemn.** Violation of explicit rules (fraud/bribery). |

  **Is there a view that condemns *only* the last case (The Bribe)?**

  **Yes, but conditionally: The Procedural View (d).**
  If the university's written rules explicitly permit legacy preferences and development cases (which they do), the Procedural View *must* accept them as legitimate moves within the game. It only condemns the Varsity Blues scandal because it involved *lying* and *off-the-books* payments.
  *   **The Catch:** This view only isolates the bribe if you accept the existing rules as morally neutral. If the rules themselves are unjust (e.g., allowing legacy), Proceduralism goes silent on the injustice of the rule, focusing only on the breach.
  *   **Contrast:** (a) Desert and (c) Luck-Discounted *must* condemn Legacy and Development cases alongside the Bribe. (b) Role View might actually justify the Development case over the Bribe (since the money helps the role, even if the student doesn't).

  ---

  ### Part III: The Theories Under Pressure

  #### 1. The Swap Test
  *The Test:* If you substitute a randomly chosen rejected applicant for the Varsity Blues kid, would the college be worse off by its own lights?

  *   **The Implication:** If the answer is "No" (the college is indifferent between the cheater and a random reject from the pool of qualified applicants), then the seat was never tracking specific merit in a strong sense. It suggests that at the margins, admissions is about sorting a pool of "good enough" candidates, not finding the single "most deserving" individual.
  *   **Impact on (a) Desert:** This is devastating. If the seat is fungible, it cannot be "owed" to a specific individual based on unique merit. It suggests Desert Proper is idle here; there is no specific victim who was *uniquely* owed that specific seat, only a class of people owed a *fair shot*.
  *   **Impact on (b) Role:** This view survives best. The Role View doesn't require the *best* human, but someone who fits the role. If the random reject also fits the role (graduates, behaves), the function is preserved. However, if the specific role was "star lacrosse player," the swap fails. This highlights that Varsity Blues was uniquely damaging to (b) because the *specific* role (athlete) was falsified, whereas in general admissions, roles are more fungible.
  *   **Does it prove too much?** Yes. In hiring, the swap test often applies (many qualified candidates for a job). If we say "no one deserves the job specifically," we undermine the concept of professional entitlement. The distinction is that admissions is often viewed as a distributive good (education as a right/opportunity), whereas hiring is a contractual exchange. If the Swap Test holds, it suggests admissions is less about *rewarding past merit* and more about *managing future institutional composition*.

  #### 2. The Legal/Outrage Angle (Fraud vs. Desert)
  *The Observation:* Prosecutors charged fraud (process crimes). Universities were victims. Public outrage focused on "cutting the line" (fairness) more than "unworthy kids" (desert).

  *   **Evidence for Proceduralism:** The legal framework supports (d). The crime was the deception, not the enrollment of an underqualified student. If the students had been geniuses but still bribed their way in, they would still be guilty. This suggests the public and legal consensus cares more about the integrity of the competition than the specific moral worthiness of the winners.
  *   **The "Open Payment" Variant:** What if parents openly gave money to the college for a seat, no deception?
      *   **(a) Desert:** Still condemns. Money is not merit. The seat is still unearned.
      *   **(b) Role:** Likely Permits. If the money helps the university fulfill its mission (financial aid for others, better labs), the transaction serves the institutional role.
      *   **(c) Luck-Discounted:** Still Condemns. Wealth is brute luck. Open bribery is just honest corruption of the effort signal.
      *   **(d) Procedural:** Permits. If the rules allow open purchase, it is valid.
  *   **The Tension:** The public outrage at Varsity Blues suggests people want (a) or (c) (Desert/Effort), but the legal resolution and the tolerance of "development cases" suggests society actually operates on (b) or (d) (Role/Procedure). We claim to want merit, but we tolerate institutional survival strategies.

  #### 3. Where Theories Go Silent
  There are moments in this case where the theories refuse to speak, which is as telling as where they speak.

  *   **(a) Desert Proper goes silent on Measurement:** It screams that the cheaters didn't deserve the spot, but it cannot explain why the *standard* metrics (SAT, varsity sports) are the correct measures of desert. It assumes the metric is the merit. It has no language to critique the *existing* admissions criteria, only the bypassing of them.
  *   **(b) Role View goes silent on Mission Drift:** It justifies development cases (buying seats) if it helps the university function. But it goes silent on whether the university's function *should* be dependent on buying seats. It treats the institution's survival as a given good, without questioning if monetizing admissions corrupts the educational role itself.
  *   **(c) Luck-Discounted goes silent on Feasibility:** It condemns test prep and private schools as luck-based advantages. But it offers no workable alternative for how to run a selection process in a non-ideal world where wealth inequality exists. It forces a radicalism (abolish prep, abolish private schools) that the theory itself cannot implement, leaving it shouting from the sidelines.
  *   **(d) Procedural View goes silent on Justice:** It is silent on the morality of the rules themselves. If the university wrote a rule saying "White applicants get 100 extra points," Proceduralism (in its pure form) would only condemn those who bribed to bypass *that* rule, not the rule itself. In Varsity Blues, it condemns the lie, but is forced to accept the "development case" loophole as morally equivalent to merit because it is codified.

  ### Summary of the Mapping
  The Varsity Blues scandal acts as a prism.
  *   **Desert Proper** sees a theft from the worthy.
  *   **Role View** sees a dysfunction of the institution.
  *   **Luck-Discounted** sees wealth masquerading as effort.
  *   **Proceduralism** sees a breach of contract.

  Only **Proceduralism** can distinguish the Varsity Blues bribe from the Legacy/Development cases without condemning the latter, but it does so at the cost of moral silence on the fairness of the rules themselves. The **Swap Test** reveals that "Merit" in admissions is often a proxy for "Institutional Fit," undermining the strong Desert claims. Finally, the **Legal Outcome** confirms that our society enforces Proceduralism (don't lie) while rhetorically claiming Desert Proper (earn your spot), creating a permanent friction between how we justify the system and how we police it.
