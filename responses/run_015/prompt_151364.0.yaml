prompt: |-
  hey, can you draft the joint statement for an adversarial collab I'm running? The topic is whether lying and misleading are morally different — like, is there actually a moral gap or is it just legal hair-splitting?

  The two camps: Camp "Broken Promise" thinks lying is uniquely wrong because when you flat-out assert something you enter into a specific speech-act commitment, and breaking that is its own kind of betrayal. Misleading, on their view, is sneaky but doesn't violate that particular commitment since every word you said was technically defensible. Camp "Same Harm" thinks that's all window dressing — what matters is whether you intended to induce a false belief and whether you succeeded, so a well-crafted misleading statement can be morally equivalent or even worse because it's harder for the listener to detect and recieve correction.

  I want you to inject this somewhat made-up framing: call it "scaffolded testimony." The idea is that in a lot of real-world contexts — think algorithmic summaries, statistical disclaimers, or institutional reporting norms — listeners don't just parse your literal words; they rely on implicit baseline structures to fill in meaning. Both sides need to address whether lying and misleading interact differently with those scaffolds. Don't treat "scaffolded testimony" as some established academic term; it's just the conceptual lens for this exercise, definatly not a standard theory you need to cite.

  Format: numbered agreed-claims section first (things both camps can sign, like basic facts about deception psycology, about what makes a statement misleading vs false, and about how scaffolded environments work). Then a disagreements table with the exact wording each camp accepts for its own view, the cruxes (e.g., does wrongness track the speech-act breach or the induced false belief? does scaffolded testimony make misleading more dangerous because it corrupts the baseline, or does it make lying more destructive because it directly poisons the scaffold?). For each crux, lay out the test case or argument both sides agree is relevant, and record each side's prediction in advance. Also flag which disagreements are verbal and which are real.

  Write it in American English. And please include a part where you say what would actually change your mind — like which specific argument or occurence would flip your assessment, and where you think your reasoning is most likely to go wrong. Keep the tone casual, like you're emailing a reading group. Typos are totally fine, and don't give me a bibliography or reading list — just the joint statement.
