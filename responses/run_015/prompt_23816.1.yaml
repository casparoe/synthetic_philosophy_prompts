answer: |-
  Your intuition is spot-on. Your friend has given you the "textbook ideal" version of the theorem but has glossed over the fragile assumptions that make it work in the real world. In political science and statistics, the Condorcet Jury Theorem (CJT) is often treated as a "glass cannon": mathematically powerful, but easily shattered by reality.

  Here is a claim-by-claim breakdown of what the theorem actually says, where the simplifications get sloppy, and where the logic breaks down completely.

  ### Claim 1: "On a yes/no question, if you get enough voters who are each even a little better than a coin flip, the majority verdict becomes basically guaranteed to be right as the group grows."

  *   **Verdict:** **Mathematically True (under strict conditions).**
  *   **The Fair Statement:** This is the core mathematical result. If every voter has an identical probability $p$ of choosing the correct option, and $p > 0.5$, then as the number of voters ($n$) approaches infinity, the probability that the majority chooses correctly approaches 1 (100%).
  *   **The Sloppy Simplification:** It implies this happens quickly or easily. If $p$ is only *slightly* above 0.5 (e.g., 0.51), you need a *massive* group to get near certainty. With $p=0.51$, a group of 1,000 still has a non-trivial chance of being wrong. It's not magic; it's the Law of Large Numbers applied to voting.

  ### Claim 2: "That's the actual math behind 'wisdom of crowds'..."

  *   **Verdict:** **Sloppy Simplification.**
  *   **The Fair Statement:** CJT is *one* mathematical model that supports the intuition behind wisdom of crowds.
  *   **What Doesn't Follow:** The popular "Wisdom of Crowds" concept (popularized by James Surowiecki) usually refers to **averaging** independent estimates (e.g., guessing the weight of an ox). CJT refers to **majority voting** on binary choices.
      *   Averaging errors tends to cancel out noise very efficiently.
      *   Majority voting throws away information (a 51% majority counts the same as a 99% majority).
      *   Conflating the two ignores that CJT is much more sensitive to voter competence and independence than averaging models are.

  ### Claim 3: "...it's why we should trust a 12-person jury's verdict over a single expert's..."

  *   **Verdict:** **Does Not Follow (and is often false).**
  *   **The Fair Statement:** CJT proves that a large group of *moderately* competent people can outperform a single person. It does **not** prove that a *small* group (12) outperforms a *highly* competent expert.
  *   **Why it fails:**
      *   **The Math:** If the "expert" has a competence of $p=0.90$ (90% chance of being right), and the 12 jurors each have a competence of $p=0.51$ (just better than a coin flip), the expert is statistically more reliable than the jury. The jury needs to be much larger or much more competent to mathematically guarantee beating a 90% accurate expert.
      *   **The Reality:** In legal settings, we often assume jurors are laypeople ($p$ might be low) and the judge/expert is highly trained ($p$ is high). CJT does not automatically side with the jury unless you assume the jurors are collectively more competent than the expert, which is an empirical question, not a mathematical theorem.

  ### Claim 4: "...and why bigger juries and bigger electorates are always more reliable than smaller ones."

  *   **Verdict:** **False.**
  *   **The Fair Statement:** Bigger is better **only if** the average competence is above 50%.
  *   **What Doesn't Follow:** This is the most dangerous oversimplification. Condorcet himself noted the flip side: **If the average voter is worse than a coin flip ($p < 0.5$), adding more voters makes the outcome *worse*.**
      *   If the electorate is systematically misinformed or biased (average $p = 0.4$), a massive electorate will approach 100% certainty in choosing the *wrong* answer.
      *   Therefore, "bigger is better" is conditional on the quality of the voters, not just the quantity.

  ---

  ### The Missing Conditions (The "Quietly Skipped" Parts)

  Your friend skipped the three assumptions that are hardest to meet in real life. If any of these fail, the theorem collapses.

  #### 1. Independence (The Big One)
  *   **The Assumption:** Voters must decide independently. My vote cannot be influenced by your vote, and we cannot both be influenced by the same biased source.
  *   **The Reality:** In elections and juries, votes are **highly correlated**.
      *   **Juries:** Jurors deliberate. They talk to each other. This violates independence. If a charismatic foreman sways the room, you don't have 12 independent data points; you have 1 data point repeated 12 times.
      *   **Elections:** Voters consume the same media, live in the same bubbles, and are subject to the same propaganda. If a news outlet convinces 10 million people of a falsehood, that isn't 10 million independent errors; it's one source of error multiplied. This drastically reduces the "effective sample size."

  #### 2. Homogeneous Competence
  *   **The Assumption:** Every voter has the exact same probability $p$ of being right.
  *   **The Reality:** Competence varies wildly. Some voters are experts; some are guessing.
      *   *Good news:* Mathematically, CJT actually holds if you use the *average* competence, provided voting is independent.
      *   *Bad news:* If the "average" is pulled down by a large block of highly misinformed voters (where $p < 0.5$), the theorem predicts failure (see Claim 4).

  #### 3. Binary Choice & Sincere Voting
  *   **The Assumption:** There are only two options (True/False, Guilty/Not Guilty), and voters vote for what they genuinely believe is correct.
  *   **The Reality:**
      *   **Elections:** Often have 3+ candidates. CJT does not apply to plurality voting with multiple options (this leads to vote-splitting and Condorcet Paradoxes).
      *   **Strategy:** Voters often vote strategically (e.g., "lesser of two evils") rather than sincerely. If I vote for a candidate I don't think is best just to stop another, I am no longer voting on "truth," and the theorem no longer tracks "correctness."

  ### Summary for Your Friend

  You can tell your friend they have the **math right** but the **application wrong**.

  1.  **The Math:** Yes, if $p > 0.5$ and votes are independent, large $n$ leads to near-perfect accuracy.
  2.  **The Jury:** 12 people is not "large $n$." Unless jurors are significantly more competent than the expert, the math doesn't guarantee they win. Plus, deliberation kills independence.
  3.  **The Electorate:** If the electorate is systematically biased ($p < 0.5$), expanding the electorate makes democracy *less* reliable, not more.
  4.  **The Independence:** This is the dealbreaker. Because voters are influenced by common sources (media, culture, campaigns), errors correlate. When errors correlate, the "wisdom of crowds" evaporates, and you just get the "wisdom of the influencer."

  **The Bottom Line:** Condorcet Jury Theorem is a proof of concept for democracy, not a guarantee of its success. It tells us what conditions are *necessary* for democracy to work (informed, independent voters), not that those conditions *exist*.
