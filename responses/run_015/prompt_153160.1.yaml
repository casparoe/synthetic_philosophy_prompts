      *   *Selection 2: The Evolutionary Mismatch (Fatal/Severe).* Why would evolution build a receiver for *other* concrete worlds? Survival depends on *this* world. A "resonance" module is metabolically expensive and useless for fitness unless it tracks *this* world's potentials, not *other* worlds' actualities.
