      *   **Request:** Identify specific defeaters (observations, formal results, counter-intuitive cases) that undermine *this specific framing* (resonance analogy + law-sharing restriction), not general actualist objections.
      *   **Task:** Rank defeaters (fatal to awkward), assess concession vs. absorption, and evaluate the "insulation" (virtue vs. unfalsifiability).

