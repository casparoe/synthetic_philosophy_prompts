      *   *Defeater 2: The Causal Isolation Problem (Refined).* Lewis's original problem was causal isolation. This theory posits "reflected light." But light/information requires a medium or a causal chain. If worlds are spatiotemporally isolated (Lewis), no signal crosses. If they aren't, it's not Lewisian realism anymore. This threatens the "concrete" aspect.
