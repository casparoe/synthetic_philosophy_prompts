answer: |-
  **Scope**

  The theory must account for *original* intentionality in biological systems: perceptual states, basic beliefs, and cellular signals that guide action. It need not initially cover human language or derived intentionality (maps, words), though consistency there is a bonus. Success means explaining how physical states possess "aboutness" and normative conditions of satisfaction without invoking non-natural properties. The artificial case is out of scope for *naturalizing* content; artifacts have derived intentionality dependent on the naturalized content of their designers. If the theory cannot distinguish biological purpose from designed purpose, it fails to naturalize. The target is the minimal representational state required for adaptive behavior.

  **The List**

  1.  **The Error Condition.** *Case:* A state fires when no corresponding object is present (e.g., a frog snaps at a pellet). *Requirement:* The theory must distinguish misrepresentation from mere statistical rarity or malfunction. A state must have conditions of satisfaction that can fail to obtain even when the mechanism functions exactly as designed. If "error" collapses into "atypical cause," normativity is lost.

  2.  **The Determinacy Condition.** *Case:* A detector fires for flies, black dots, or moving specks (the frog-style detector). *Requirement:* The theory must select a single content (fly vs. dot) without appealing to intuition. It cannot allow content to be the disjunction of all possible causes. There must be a principled fact of the matter about what the state is *for*, not just what causes it.

  3.  **The Consumer Condition.** *Case:* A signal produced for X is co-opted by a downstream system to guide action regarding Y. *Requirement:* The theory must specify whether content is fixed by the producer's history or the consumer's uptake. If both matter, it must define the hierarchy. Content cannot be indeterminate simply because multiple systems read the same signal.

  4.  **The Drift Condition.** *Case:* An organism moves to a new environment where a state reliably tracks G instead of F. *Requirement:* The theory must determine when content shifts from F to G. It cannot rely solely on current covariance (which says G) or solely on ancient history (which says F). There must be a threshold for when historical function yields to current utility.

  5.  **The Development Condition.** *Case:* A young organism or untrained network has dispositions but no settled history of success. *Requirement:* The theory must state when content emerges. Does it require completed selection, or can prospective function suffice? If content arrives by degrees, the theory must specify the metric. Content cannot be binary if learning is continuous.

  6.  **The Supervenience Condition.** *Case:* A history-free duplicate (Swampman) has identical structure but no evolutionary past. *Requirement:* You must decide if this is a real constraint. If content requires history, the duplicate lacks it. If content requires only current disposition, the duplicate has it. The theory must explicitly choose a supervenience base: internal structure, external history, or both. Treating this as a "gotcha" rather than a design choice is a mistake.

  7.  **The Aspect Condition.** *Case:* Two states pick out the same object (Morning Star/Evening Star) but guide action differently. *Requirement:* Decide if fine-grainedness is required. A coarse-grained theory (tracking reference only) is easier to naturalize but fails to explain cognitive significance. A fine-grained theory explains behavior better but risks inflating content beyond naturalistic reach.

  8.  **The Normativity Condition.** *Case:* A state *ought* to represent X even if it usually represents Y. *Requirement:* The theory must ground "ought" in natural facts (e.g., selection, ideal conditions) without circularity. It cannot define function by what the state *should* do if "should" already presupposes content.

  **Requirements vs. Camp Loyalties**

  Several demands are tribal rather than essential. *Reductiveness* is non-negotiable for naturalism; if the theory presupposes intentionality to explain intentionality, it fails. *Respect for folk psychology* is desirable but secondary; if folk concepts are flawed, the theory should correct them, not mirror them. *Usability by cognitive science* is a practical virtue, not a truth condition; a theory can be true even if currently unoperationalizable. *Coverage of artifacts* is a category error for naturalization; artifacts borrow content from agents. *History-free duplicates* is a boundary condition, not a refutation; insisting duplicates *must* have content begs the question against historical theories. The boundary lies between explaining how content exists in nature versus preserving pre-theoretic intuitions about twins.

  **Where the List Breaks**

  The desiderata cannot be jointly satisfied without trade-offs. The primary fracture is between *Determinacy* (2) and *History* (6). To solve the frog case (fly vs. dot), you typically need history (what was selected). But if you require history, you fail the duplicate case (Swampman has no history). You cannot have both determinate content derived from selection and content for ahistorical duplicates. You must choose: is content a historical relation or a structural/dispositional one?

  A secondary break is between *Aspect* (7) and *Naturalism*. Explaining how two states refer to the same object differently usually requires appealing to internal conceptual roles. But internal roles are hard to naturalize without collapsing back into causal covariance, which loses aspect. The cheapest desideratum to drop is *Aspect*. A basic theory of biological content need not explain Frege cases; that is a problem for high-level cognition, not basic representation. Drop *Aspect* to save *Determinacy* and *Normativity*.

  **The Knockout**

  The **Error Condition** combined with **Determinacy** is the single requirement that does the most work. This is the "Disjunction Problem." Any theory that identifies content with causal covariance fails here (if dots cause the state, content is dot-or-fly). Any theory that identifies content with function must explain how function distinguishes fly from dot without circularity. If a theory cannot explain how a state can be *wrong* about a specific thing rather than just *useless*, it is not a theory of content. It is merely a theory of causation.

  **Scorecard**

  | Account Type | Error | Determinacy | History/Duplicates | Normativity |
  | :--- | :--- | :--- | :--- | :--- |
  | **Etiological (Teleo)** | Pass | Pass | Fail (No Swampman) | Pass |
  | **Informational (Covariation)** | Fail (Disjunction) | Fail (Indeterminacy) | Pass (Structure only) | Fail (No Norm) |
  | **Consumer/Success** | Pass | Pass | Pass (Current role) | Pass (Goal-based) |

  *Note:* Etiological accounts secure normativity via history but exclude duplicates. Informational accounts include duplicates but cannot ground error or normativity. Consumer accounts attempt to bridge the gap by focusing on current usage conditions but struggle with historical drift. None pass all columns.
