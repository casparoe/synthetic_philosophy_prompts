          *   *Gap:* Real break. Designers usually don't repurpose old parts seamlessly without a new plan.
          *   *Impact:* Challenges the "single function" idea. Supports historical view (function changed when selection pressure changed).
      *   *(c) Sickle-Cell:*
          *   *Designer Prediction:* One function (health/blood transport) or distinct designs for different environments.
          *   *Etiological Account:* Function is oxygen transport (ancestral); Malaria resistance is a *side effect* that became selected for in specific contexts (polymorphism).
