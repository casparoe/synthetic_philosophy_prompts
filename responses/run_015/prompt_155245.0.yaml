      *   *Side B (Critics):* Focus on *modifiability* and *justice*. "Genetics shouldn't determine fate." High $h^2$ doesn't mean we can't improve the environment to reduce variance or shift means. They worry about reification and policy fatalism.
      *   *The User's Insight:* $h^2$ often rises as $V_E$ falls (the "Wilson Effect" pattern in IQ, for example). So high $h^2$ can signal *environmental success*, not genetic determinism.
      *   *The Core Tension:* Is $h^2$ a *description* of the current state or a *prediction* of intervention potential?

  3.  **Brainstorming Candidate Diagnoses:**

      *   *Diagnosis 1: The Modal/Scope Confusion (Verbal/Conceptual).* Side A is talking about *variance explanation* in the *actual* population (descriptive). Side B is talking about *causal malleability* across *possible* populations (prescriptive/counterfactual). They are answering different questions but using the same word ("heritability"). This aligns with the user's "levelled heritability" hunch.
      *   *Diagnosis 2: The Normative/Political Incommensurability (Bedrock Intuitions).* It's not about the math. It's about the *stakes*. Side A values scientific realism (reporting the number as is). Side B values social justice (fearing the number will be used to justify inequality). The technical arguments are just proxies for a moral disagreement about whether genetic differences *should* matter socially. No amount of math solves a value clash.
      *   *Diagnosis 3: The Identification/Model Error (Epistemic).* Both sides assume the standard ACE/ADE models identify "Genetic Variance" correctly. But if GxE is pervasive and non-linear (which the user knows well from animal breeding), the additive genetic variance ($V_A$) itself is a statistical artifact of the specific environmental distribution. The impasse persists because both treat $V_G$ as a stable entity, whereas it is actually a function of $E$. The "levelled" concept tries to fix this, but the underlying parameter ($V_G$) is unstable across environments.

