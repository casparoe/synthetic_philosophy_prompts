answer: |-
  This is a profound frustration, and one that is entirely predictable given the structure of the quantities you are discussing. You are describing a classic case of **parameter equivocation masked by technical fluency**. Both sides speak the language of variance components, but they are implicitly treating the variance ratio as different *kinds* of objects.

  Per your request, I will bypass the standard survey of the heritability debate. I know you know the Lewontin fallacies, the EEA critiques, and the defense of $h^2$ as a descriptive statistic. I will proceed directly to the diagnostic brainstorming, selection, and verdict on your "levelled heritability" proposal.

  ### Three Candidate Diagnoses

  **1. The Normative Incommensurability Diagnosis**
  The impasse is not epistemic but axiological. Side A (Defenders) operates under a norm of *scientific realism*: the number is what it is, and obscuring it for fear of misuse is anti-scientific. Side B (Critics) operates under a norm of *social caution*: the number is a potential tool for oppression, and its policy relevance is nil until justice is achieved. The technical arguments about GxE or population specificity are merely proxy battles for a deeper disagreement about whether genetic stratification is a legitimate basis for social differentiation.
  *Verdict on this diagnosis:* It explains the heat, but not the stickiness. If it were purely normative, Side A would concede the technical limitations (which they do) and simply insist on reporting the number anyway. But they don't; they insist the number *constrains* environmental accounts. That is a causal claim, not just a normative one. This diagnosis is insufficient.

  **2. The Parameter Instability Diagnosis**
  The impasse exists because the quantity Side A treats as stable ($V_G$) is actually a function of the environment ($V_G(E)$). In animal breeding, we accept that breeding values are specific to the production environment. In human behavioral genetics, $V_G$ is often treated as a latent property of the trait, merely revealed by the environment. Side B intuitively grasps that $V_G$ changes when $E$ changes (GxE), but lacks the leverage to prove that the *current* $V_G$ is an artifact of the *current* unequal $E$.
  *Verdict on this diagnosis:* This is technically accurate but incomplete. Side A *knows* $V_G$ is population-specific. Their counter is usually: "Fine, it's specific to *this* population, but this is the population we live in, so it's the relevant constraint." This diagnosis explains the math but not why Side A feels entitled to extrapolate to policy limits.

  **3. The Modal Scope Diagnosis (The Extrapolation Error)**
  The impasse arises because the two sides are using the variance ratio to answer questions with different *modal scopes*. Side A treats $h^2$ as a **local derivative**: it describes the sensitivity of the phenotype to genetic difference *in the vicinity of the current environmental distribution*. They then implicitly extrapolate this local slope to cover the **policy space** (nearby possible worlds where we intervene). Side B correctly notes that a local derivative tells you nothing about the function's behavior outside that vicinity (e.g., a new environmental regime).
  *Verdict on this diagnosis:* This captures the ritualistic feeling. Side A says, "In this room, genetics explains the variance." Side B hears, "In any room we build, genetics will explain the variance." Side A denies saying the latter, but their policy conclusions rely on it. The "levelled heritability" concept is an attempt to define a different point in that modal space.

  ### The Committed Diagnosis: Modal Scope Creep

  I commit to **Diagnosis 3**. The dispute is not about the calculation of the coefficient in the *actual* population (both sides accept the math), nor is it purely about values. It is about the **licensing of counterfactual inference**.

  Side A treats a high $h^2$ as evidence that the *causal leverage* of environment is exhausted. This is a modal claim: "In nearby possible worlds where we try to intervene, the variance will remain largely genetic." Side B treats $h^2$ as a description of the *actual* world only. The stalemate occurs because standard quantitative genetic designs (twins, pedigrees, even standard GWAS) identify the variance components *conditional on the observed environmental distribution*. They do not identify the **GxE response surface**.

  Without knowing the shape of the reaction norm, you cannot know if equalizing the environment reduces $V_E$ (raising $h^2$, as you note) or if it changes the mean so drastically that the rank order shifts (changing $V_G$). Side A assumes the reaction norms are parallel (no GxE). Side B assumes they cross (significant GxE). The data you currently have—observational variance partitioning in a stratified society—cannot distinguish these two scenarios. That is why the argument is a ritual: you are trying to solve for two unknowns ($V_G$ and GxE shape) with one equation (the observed variance ratio).

  ### Evaluating "Levelled Heritability"

  Your candidate quantity, **levelled heritability** ($h^2_{levelled}$), is conceptually sharp but empirically treacherous.

  **Is it useful?**
  Yes. It correctly identifies the "Wilson Effect" dynamic: as environments improve and homogenize (e.g., nutrition, basic schooling), $V_E$ shrinks, and $h^2$ rises. It reframes high heritability not as "genetic destiny" but potentially as "environmental success." This is a crucial rhetorical and conceptual correction to the fatalism Side B fears. It aligns with the history of height: height has high $h^2$ in developed nations precisely because we solved the environmental variance (malnutrition/disease).

  **Does it collapse into existing concepts?**
  It is distinct from standard $h^2$, but it risks collapsing into the concept of **heritability in an idealized environment**, which is effectively unidentifiable. In quantitative genetics terms, you are proposing to estimate $V_G / (V_G + V_{E_{min}})$. The problem is that $V_{E_{min}}$ is not a constant; it is a function of the intervention. Furthermore, if GxE exists, $V_G$ itself changes as $E$ moves to the "levelled" state. So $h^2_{levelled}$ requires knowing the function $V_G(E)$, which is exactly what is missing.

  **Do the sides need it?**
  *   **Side B needs it** to break the fatalism. They need to show that the current $h^2$ is not the ceiling.
  *   **Side A resists it** because it shifts the goalposts from "what is" to "what if." They argue science describes the actual population. However, since their *policy conclusions* are counterfactual ("interventions won't work"), they are already in the business of "what if." They cannot consistently reject your parameter while making policy claims based on the actual parameter.

  ### What Counts as Progress?

  Given this diagnosis, here is the verdict on how to move the discussion, ranked from most to least feasible.

  **1. The Formal Identifiability Result (Low Feasibility, High Impact)**
  You need a proof that demonstrates the **non-identifiability of policy effects from variance ratios**. If you can formally show that two distinct GxE structures (one where intervention works, one where it doesn't) yield identical twin/pedigree covariance matrices in the current population, the debate shifts. Side A can no longer claim their data *constrains* environmental accounts. It proves that their "constraint" is an assumption (parallel reaction norms), not a finding.
  *   *Why this moves it:* It forces Side A to admit their policy skepticism is a prior belief, not a data-driven conclusion.

  **2. The Within-Family/Sibling Design Shift (Medium Feasibility, Medium Impact)**
  You noted that within-family designs often return smaller estimates. This is critical. Population-based $h^2$ confounds direct genetic effects with indirect genetic effects (genetic nurture) and population stratification. Within-family estimates strip out the environmental variance correlated with parental genotype.
  *   *The Argument:* If population $h^2$ is 0.6 but within-family $h^2$ is 0.3, the "missing" variance is actually environmental variance *driven by* genetic differences in parents. This validates Side B's intuition that "genetic" variance is partly environmental malleability in disguise.
  *   *Progress:* Stop arguing about the *magnitude* of $h^2$. Argue about the *composition* of $V_G$. If a large chunk of $V_G$ is actually genetic nurture, it is malleable by policy (changing the parenting environment), even if it looks genetic in a twin study.

  **3. A Change of Question: From Variance to Means (High Feasibility, High Impact)**
  The reading group is stuck on variance partitioning. Policy cares about **means**. You can have $h^2 = 1.0$ and still shift the population mean by 2 SDs (the Flynn Effect).
  *   *Progress:* Explicitly decouple the question of *rank order stability* (heritability) from *population mean shift* (intervention efficacy). Side A conflates them: "If rank order is stable, intervention failed." Side B knows this is false.
  *   *Action:* Propose a rule for the group: No discussion of $h^2$ is permitted without a simultaneous statement about the **mean shift potential**. If Side A claims $h^2$ constrains policy, they must specify whether they mean constraints on equality of outcome (variance) or improvement of level (mean). Usually, they mean the former, while policy cares about the latter.

  **4. Honest Admission of Stalemate (The "Nuclear Option")**
  If none of the above works, the honest verdict is that the question is **ill-posed for the available data**. We are trying to infer the shape of a multi-dimensional surface (GxE) from a single cross-section (current variance).
  *   *Verdict:* Tell the group that without experimental variation in $E$ (which we ethically cannot do at scale) or strong structural assumptions about the GxE function (which we do not have), the "policy weight" of $h^2$ is mathematically undefined. The impasse isn't a failure of reasoning; it's a failure of the data to support the question being asked.

  ### Recommendation

  Your "levelled heritability" is the right conceptual tool to expose the Modal Scope Creep, but it will not be accepted as an *estimate*. Use it as a **reductio**.

  Ask Side A: *"If we achieved your preferred environmental equalization, and $h^2$ rose to 0.9, would you conclude that genetics is now more important, or that we have successfully minimized environmental noise?"*

  If they say the latter, they concede your point: high $h^2$ is compatible with successful intervention. If they say the former, they reveal that their metric tracks *variance explanation*, not *human welfare* or *malleability*.

  **The path forward:** Stop trying to agree on the number. Agree that the number is a **local slope**. The disagreement is about the **curvature of the landscape** beyond the data. Admit that the curvature is unobserved. Progress is not a new heritability estimate; it is the abandonment of the claim that current heritability estimates bound the potential of future environments. That is the specific modal claim that is unsupported, and targeting it directly is the only way to break the ritual.
