  *Scene Analysis:* Needs to be detailed.
  *Critique:* Needs to be honest.

  Let's build the tool.
  Step 1: The "Why" Check (Motives).
  Step 2: The "Loss" Check (Contingency).
  Step 3: The "Word" Check (Concepts).
  Step 4: The "Lesson" Check (Didacticism).
  Step 5: The "Lineage" Check (Frame narrative).

