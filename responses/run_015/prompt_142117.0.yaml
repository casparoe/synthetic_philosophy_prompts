prompt: |-
  I am a novelist, four books in, and for the first time I am writing one set entirely in the past: a close-third-person novel about one family in San Francisco through the second wave of the 1918 influenza pandemic — the mask ordinance, the league that formed to repeal it, the arguments about whether compulsory gauze did anything, a laundress who keeps a door-to-door tally of the sick households on her block, and a short present-day frame narrated by a great-granddaughter who has spent ten years digitising the family's papers. My editor loves the draft and keeps praising it for putting the characters "on the right side of history," and the more she says it the more I suspect that is precisely the failure. My partner is an epidemiologist and will say things like "they'd have saved thousands of lives if they'd just listened," which I now hear as the vice in miniature. The trouble is that what I have is a temper, not a test: I can feel when a scene is congratulating us for how far we have come, or when I have handed a character a motive they could only have had in our vocabulary, or when I have excused them by saying they "couldn't have known" — which I've started to suspect is itself a condescending way of refusing to take their actual reasons seriously — but I can't reliably catch it in my own prose, and my fact-checking historian won't catch it either, because she checks whether the streetcar line existed and not whether my plot treats a side as having lost because it was benighted rather than because it was outvoted, outbid, or unlucky.

  So please take this seriously and carefully, and work as if you were both a philosopher or historically-minded theorist who knows what is actually at stake in the complaint about whig history and a developmental editor who has to be useful by Friday. Start by brainstorming — ten minutes, in your head — the distinct ways whiggishness can get into a work of fiction specifically, and only then condense that into something I can run: a numbered decision procedure I can apply to a single scene in ten to fifteen minutes during a revision pass, with no theory vocabulary in the steps themselves. For each step, tell me what question to ask, what counts as a pass, what counts as a fail, what counts as "rewrite this line," where the procedure stops with a verdict, and where it has to stop and hand the question to me because it is a question about what my book is for. I need it to keep separate the things I keep conflating — narrating as if a later outcome were the point of earlier action, judging past people by present standards, and the mirror-image vice of romanticising the period as a lost golden age — and I need an actual test for anachronistic *concepts*, not just anachronistic objects, since my characters keep wanting to say things like "the science" and "prejudice" in words that flatten what they meant. Assume I have no training in any of this, that I will run it on about forty scenes, and that the output has to survive being read by my editor.

  Then show me it working. Run it on three scenes from the draft, in detail: (1) the meeting where the anti-mask characters are given the strongest version of their case — that the gauze is useless, that the ordinance is enforced against the poor and waved through for the rich, that compulsion in a republic in wartime is itself the harm — where I cannot tell whether writing them well is honest or is apologetics; (2) the deathbed scene in which an opponent recants and concedes that the doctors were right, which is the scene my editor singles out and which I would be genuinely unhappy to lose, so if your procedure condemns it I want to be told so plainly; and (3) the frame chapters, where the great-granddaughter calls her ancestor "a forerunner of modern epidemiology" on the strength of that household tally, and I can't work out whether that is a legitimate claim about influence or just retroactive ennoblement of a dead end. Finally, be straight with me about where the procedure misfires: what kinds of scenes it will score wrongly, what it cannot tell me at all, and which of its verdicts I should treat as a prompt to think rather than an instruction to cut.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User:** Novelist (4 books in), writing historical fiction (1918 SF flu pandemic + present-day frame).
      *   **Problem:** Editor praises the book for putting characters "on the right side of history." The author suspects this is a *failure* (Whig history). Partner (epidemiologist) reinforces the "they should have listened" view. Author feels a "temper" (intuition) but lacks a "test" (method). Fact-checker checks facts (streetcars), not narrative logic (why people lost).
      *   **Task:**
          1.  Brainstorm (internally) distinct ways Whiggishness enters fiction.
          2.  Create a numbered decision procedure (10-15 mins/scene) for revision. No theory vocabulary in the steps. Must distinguish between: narrating later outcomes as the point, judging by present standards, and romanticizing the past. Must test for anachronistic *concepts*, not just objects.
          3.  Run the procedure on three specific scenes: (1) Anti-mask meeting (strongest case), (2) Deathbed recantation (editor's favorite, author's doubt), (3) Present-day frame (great-granddaughter's claim).
          4.  Critique the procedure itself (where it misfires, what it can't do).
      *   **Tone:** Serious, careful, philosopher/historian + developmental editor. Useful by Friday.
      *   **Constraints:** No theory vocab in the steps. Assume no training. Output must survive editor scrutiny.

  2.  **Internal Brainstorming (Whiggishness in Fiction):**
      *   *Teleology:* The plot moves toward *us*. The past is just a waiting room for the present.
      *   *Moral Superiority:* Present characters/narrator know better. Past "villains" are stupid/evil, past "heroes" are proto-moderns.
      *   *Conceptual Anachronism:* Characters think in modern categories ("systemic racism," "the science," "mental health") rather than period-specific frameworks ("character," "providence," "miasma," "duty").
      *   *Inevitability:* Outcomes feel destined rather than contingent. Losers lost because they were wrong, not because of bad luck, power dynamics, or competing valid values.
      *   *The "Forerunner" Trap:* Valuing past figures only insofar as they predict current truths. Ignoring dead ends that made sense at the time.
      *   *The "Benighted" Trap:* Assuming lack of knowledge = lack of intelligence or morality.
      *   *Narrative Voice:* The narrator winks at the reader, "Can you believe they thought that?"
      *   *Resolution:* Conflicts resolve because "truth won," not because of specific historical mechanisms (e.g., war ended, masks mandated, then repealed, then flu came back).

  3.  **Drafting the Decision Procedure (The "Test"):**
      *   *Goal:* Actionable steps, no jargon like "Whig history," "teleology," "epistemic violence."
      *   *Step 1: Motivation Check.* Are they doing it for *our* reasons or *their* reasons?
      *   *Step 2: The Loss Check.* If someone loses, is it because they were stupid, or because the world was hard/complex?
      *   *Step 3: The Vocabulary Check.* Are they using words that carry future weight?
      *   *Step 4: The Outcome Check.* Does the scene feel like it's happening *for* the ending, or *in* the moment?
      *   *Step 5: The Frame Check.* (Specific to the dual timeline). Is the present narrator claiming ownership of the past?
      *   *Refining the Steps:* Make them binary (Pass/Fail/Rewrite/Author Decision). Ensure they address the specific conflations the user mentioned.

  4.  **Developing the Scene Analyses:**
      *   *Scene 1 (Anti-Mask Meeting):* This is the crux. If they are caricatures, it's Whiggish. If they have valid 1918 arguments (liberty, efficacy doubt, class enforcement), it's historical. The test needs to validate their logic *within 1918*.
      *   *Scene 2 (Deathbed Recantation):* This is tricky. People *did* change their minds. But is it a moral lesson for the reader? Or a human moment? The test needs to distinguish between "I was wrong about the facts" (okay) and "I was wrong because I didn't have your morals" (Whiggish).
      *   *Scene 3 (The Frame):* "Forerunner of modern epidemiology." This is classic Whig. The tally was likely local, not influential. The test should flag this as "Author Decision" – is the book about lineage or about the moment?

  5.  **Critiquing the Procedure:**
      *   It can't measure emotional truth.
      *   It might over-correct into relativism (everything was valid).
      *   It relies on the author's research depth.
      *   It can't judge style/voice, only logic.

  6.  **Refining the Output (Self-Correction during drafting):**
      *   *Check:* Did I use theory vocab in the steps? *Correction:* Ensure terms like "teleology" or "anachronism" don't appear in the numbered list. Use "future knowledge" or "today's words."
      *   *Check:* Is it useful by Friday? *Correction:* Keep it tight. 10-15 minutes per scene.
      *   *Check:* Did I address the "concepts not just objects" constraint? *Correction:* Make sure Step 3 focuses on *ideas* (e.g., "the science" vs. "Dr. Smith's advice").
      *   *Check:* The User's specific anxiety about "couldn't have known." *Correction:* Address this in the "Loss Check."

  7.  **Final Polish:**
      *   Tone check: Respectful, rigorous, collaborative. Acknowledge the difficulty.
      *   Structure: Brainstorm summary -> The Procedure -> The Application -> The Limitations.

  *(Self-Correction on the "Brainstorming" requirement)*: The prompt asks me to "Start by brainstorming — ten minutes, in your head... and only then condense that." I should not output the raw brainstorming log, but rather demonstrate that the procedure *results* from that thinking. However, the prompt says "Start by brainstorming... and only then condense." I will provide a brief summary of that conceptual groundwork to show I've done the work, then move immediately to the tool. *Wait, re-reading:* "Start by brainstorming — ten minutes, in your head... and only then condense that into something I can run." I will present the *result* of that brainstorming as the foundation for the tool, without necessarily dumping a raw stream of consciousness, but framing the tool as the distillation of those risks. Actually, to be safe and thorough, I will briefly outline the "Distinct Ways" identified in that mental brainstorm before presenting the tool, as that validates the "philosopher/theorist" persona requested.

  *Re-evaluating the "Brainstorming" instruction:* "Start by brainstorming — ten minutes, in your head... and only then condense." Usually, this means "do the work internally." But showing the categories helps the user trust the tool. I will list the *categories of failure* identified in that brainstorm as a preamble, then the tool.

  *Wait, one more constraint:* "No theory vocabulary in the steps themselves." Okay.
