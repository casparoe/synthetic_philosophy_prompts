answer: |-
  | objection_as_theyd_say_it | who_raises_it | likelihood (H/M/L) | damage_if_unanswered (1-5) | my_90_second_reply | where_the_reply_is_soft |
  | :--- | :--- | :--- | :--- | :--- | :--- |
  | "Isn't this just dressing up the observation that 'Britain vs. China' is a heuristic? We know it's shorthand. What work does the partition test actually *do* that we aren't already doing?" | Supervisor (Chair) | H | 5 | "It's not just shorthand; it's conflation. When you treat 'Britain vs. China' as a single unit, you implicitly assume the causes for scientific stagnation, industrial mechanization, and per-capita growth are identical and co-located. My test forces you to decouple them. If the contrast evaporates when you switch from polities to regions, you aren't testing a heuristic; you're testing a causal mechanism that doesn't match your unit. The work it does is preventing category errors in the explanation, not just the question." | It risks sounding like I'm saying historians *aren't* already careful about this. I need to acknowledge the best historians *do* this, but the framing often doesn't. |
  | "Okay, you've unpacked the question. Now give me the research design. What's the identification strategy if 'Britain vs. China' is off the table? What are my cases and controls?" | Comparative Political Scientist | H | 5 | "You keep the contrastive logic but fix the variable. If you're explaining coal-based industrialization, your unit isn't 'Britain,' it's 'coal-rich regions with high wage economies.' Your contrast class isn't 'China,' it's 'coal-rich regions without mechanization.' This moves you from a national comparison to a functional comparison. It makes your controls comparable on the relevant causal factors, not just arbitrary borders." | It makes data collection much harder. Historians rely on national archives. I'm asking them to build new datasets without providing the tools. |
  | "China isn't an arbitrary partition. It's a political reality with institutional continuity. You can't just redraw the map to make the philosophy work." | China Historian | H | 4 | "I agree political units matter for institutional explanations. But for economic growth or scientific output, the relevant unit might be the Yangtze Delta, not the Qing Empire. The partition test doesn't say 'ignore politics.' It says: if your explanation is about institutions, keep the polity. If it's about ecology or markets, check if the polity boundaries match the economic boundaries. Don't assume they do." | It concedes that for *some* questions (institutional), the original framing holds, which weakens the claim that the question is broadly ill-posed. |
  | "Your partition test looks like it proves too much. Does this dissolve 'Why Rome fell?' or 'Why the Allies won?' If so, the test is broken." | Phil of Science / PolSci | M | 5 | "That's the crucial boundary condition I'm refining. The test applies to *structural trends* (divergences), not *event outcomes* (wins/falls). 'Allies won' is a discrete event with a clear counterfactual (Axis won). 'Great Divergence' is a gradual structural shift where the units themselves are contested. I'm not dissolving event history; I'm tightening structural history." | This distinction is philosophically messy. Structural shifts often look like events in hindsight. I need to flesh this out in the paper. |
  | "We know it's under-specified. But if we wait for perfect specification, we never ask big questions. Isn't this paralysis by analysis?" | Economic Historian | H | 3 | "It's not paralysis; it's triage. You can ask the big question, but you need to know which slice of it you're answering. If you claim to explain the 'Great Divergence' but only show data on coal prices, you've oversold. My framework lets you keep the big question as a research programme, provided you specify which sub-question this specific paper addresses." | It might still feel like I'm policing their titles rather than helping their arguments. |
  | "Isn't this just a fancy way of saying 'don't select on the dependent variable'? You're telling us not to pick Britain because it industrialized." | Comparative Political Scientist | M | 3 | "Close, but distinct. Selection on the dependent variable is about sampling. My point is about *definition*. Even if you sample correctly, if your variable 'Industrialization' bundles science, growth, and machines, you can't identify the cause. I'm asking for variable clarity before sampling, not just sampling clarity." | In practice, the fix for both is often the same (more cases), so the distinction might seem semantic to a quantifier. |
  | "You're ignoring interconnectedness. Galton's Problem. Britain and China weren't independent units. Doesn't your partitioning assume independence?" | Global Historian | M | 3 | "Actually, the partition test helps here. If the divergence disappears when you scale up to the Eurasian network, that tells you the causal mechanism is systemic, not national. The test doesn't assume independence; it reveals whether the unit you chose is the right scale for the mechanism, including diffusion." | It doesn't solve the problem of how to model interconnection, just highlights that the national unit might be wrong for it. |
  | "If we follow your advice, we lose the grand narrative. History becomes a collection of fragmented variables. Who reads that?" | Historian | M | 3 | "You keep the narrative, but you anchor it. Instead of one fragile story holding up 'The Great Divergence,' you have multiple robust stories about wages, technology, and science that together form the narrative. It makes the synthesis stronger because the components are well-posed. Fragmentation is only a risk if you refuse to synthesize the results." | Synthesis is hard. There's a real risk the field fragments into silos if everyone follows this strictly. |
  | "You're committing the ecological fallacy in reverse. You're saying because regions vary, the national average is meaningless. But sometimes the national policy *is* the cause." | Economic Historian | M | 3 | "Exactly. That's why the test is a test. If the national policy is the cause, the contrast should hold at the national level. If the contrast disappears when you look at regions, then the national average was masking the real mechanism. The test tells you whether the ecological aggregation is justified." | It requires data at multiple levels that often doesn't exist for historical periods. |
  | "Are you telling us our question is confused? Because that's what it sounds like." | Supervisor (Chair) | M | 4 | "I'm telling you the question is a bundle. A bundle isn't confused; it's just composite. Unpacking a bundle isn't an insult; it's how we solve complex problems. I'm offering a repair manual, not a demolition order. I want the question to survive, but to survive rigorously." | Tone is critical here. If I sound patronizing, this reply fails regardless of content. |

