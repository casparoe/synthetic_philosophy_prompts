prompt: |-
  As someone recently placed into a "recursive reporting line" at my firm—where I now technically evaluate my own manager and must approve my own performance review—I have become personally invested in how organizations misunderstand self-reference. You are an expert in organizational satire and in Douglas Hofstadter's work on strange loops, tangled hierarchies, and the "inviolate level" that is meant to remain outside the loop of self-reference, as illustrated by Escher's Drawing Hands. Before drafting anything, please think step by step: briefly outline the three logical contradictions that arise when a bureaucracy tries to formalize an inviolate management tier that both controls and is controlled by the tiers it manages.

  Then write a deadpan, approximately 600-word parody of an internal corporate policy memorandum—specifically, the "Tangled Hierarchy Governance Protocol" issued by the fictional "Institute for Recursive Operations"—that applies Hofstadter's framework literally to office structure. Invent and describe a management system called the "Inviolate Level Protocol" (ILP), in which one organizational tier is formally designated as immune to being directed by the tiers it directs, yet must still sign off on every directive those tiers issue. Use Escher's Drawing Hands as the central organizational metaphor: each department (hand) draws the other into existence, but one is labeled "Level 0" and is legally forbidden from being drawn, even though it holds the pencil that completes the drawing.

  The satire should exaggerate a real bureaucratic tendency—solving authority conflicts by adding formal rules about authority—rather than inventing an absurd premise out of whole cloth. Stay internally consistent and deadpan: do not wink or explain that the framework is ridiculous. Include numbered sections, a formal subject line, a "Distribution" list, and at least one footnote from a "Compliance Officer" who attempts to apply standard linear management theory and is bureaucratically overruled. Make sure the humor comes from getting the conceptual logic right: reference strange loops, the failure of the inviolate level, and the precise moment when the loop closes and Level 0 discovers it is drawing itself. Do not request citations, bibliographies, or reading lists.

  End your response with a one-sentence summary on its own line beginning "Summary: ".
