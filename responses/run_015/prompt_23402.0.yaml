  I'm a novelist, and I was trying to write a scene where two people argue about how much one should trust an epistemic peer over a murder trial verdict, but then it came up for real at teh dinner with two friends. One of my friends, Priya, said that if you and a genuine peer have considered the same case and reached different conclusions, the rational response is to split the difference in confidence, not just keep your own. The other, Marcus, said that only works if the disagreement is about first-order evidence; if he thinks you're just bad at weighing witness testimony, then his disagreement is evidence about your reliability, not about the underlying fact.

