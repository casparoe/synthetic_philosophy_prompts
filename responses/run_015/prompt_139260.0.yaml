      *   **Section 1: The Cases (A & B).** Validate Case A (red herring). Critique Case B (coherent but misses the link). Explain why the *binding* of epistemic and personal is the key.
      *   **Section 2: The Probability Objection.** Hit hard on the "Utility Function" problem. Distinguish Risk (unknown outcome) from Uncertainty/Incommensurability (unknown valuer). Use the "Currency" analogy. Define the condition for the agent (must value the *new* preferences, not just the outcome).
      *   **Section 3: The Testimony Issue.** Clarify that perfect testimony doesn't solve the epistemic gap. The bias is secondary.
