  6.  **Refining the "Probability" Argument (Self-Correction during drafting):**
      *   *Initial thought:* Just say you can't know the utility.
      *   *Correction:* The user knows that. They ask *why* standard risk handling doesn't work.
      *   *Better explanation:* Standard risk handling assumes a stable utility function. $U(Parent)$ is a fixed number we are uncertain about. Paul argues $U(Parent)$ is undefined for the current self because the $U$ function itself changes. You can't calculate $E[U]$ if $U$ is a variable dependent on the choice.
