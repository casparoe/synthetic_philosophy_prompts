              *   If Tails: Get 40 if Initial is "Pay".
              *   Offer: Switch Final to "Don't Pay" for cost 2.
              *   Heads Case: Final "Pay" -> Lose 10. Final "Don't" (Cost 2) -> Lose 2. **Switch.**
              *   Tails Case: Initial "Pay" -> Get 40. Final "Pay" -> Keep 40. Final "Don't" (Cost 2) -> Keep 40 (Initial hasn't changed). **Don't Switch.**
              *   *Wait, if Tails people don't switch, they don't feel the tension.*
              *   *The Tension must be:* "I am in Heads. I know I won't get the Tails reward. Why am I paying?"
              *   *So the game must force them to decide in Heads whether to honor the Initial Commitment.*
              *   *Okay, let's remove the "Switch" mechanic for Heads.*
              *   *Prompt:* "I want a mid-game moment where they're offered the chance to rewrite their answer after seeing the flip, at a cost."
              *   *Okay, everyone gets the offer.*
              *   *If I am in Heads:* I switch. I save money.
              *   *If I am in Tails:* I don't switch. I keep reward.
              *   *The "Squeeze" is on the Heads person.* They realize they are the sucker who paid for a policy that benefited the Tails people.
              *   *This perfectly mirrors the addiction struggle.* "Why am I suffering tonight? No one sees this. I'm just miserable."
              *   *Debrief:* "The Policy only works if you honor it in the Heads branch. If you update in the Heads branch, the Policy collapses ex-ante."

  5.  **Addressing Specific Constraints:**
      *   *Economist Objection:* "Predictor is impossible." -> Address in debrief (Logical vs Physical).
      *   *Limitation:* "Game gets structure across but not the logical counterfactual." -> Be honest. The Facilitator is a stand-in for the logical fact.
      *   *Stakes:* Raffle tickets for a book (e.g., "The Precipice" or "Superintelligence" or just a nice hardcover). Chocolate for immediate small stakes.
      *   *Timeline:* 75 mins tight. Keep instructions crisp.
      *   *Debrief:* Map "Refusing to Condition" to "Honoring the Initial Commitment in the Heads Branch."

  6.  **Refining the Numbers:**
      *   Round 2 Coin: 4:1 Bias (20% Heads).
      *   Cost in Heads: 10 Tickets.
      *   Reward in Tails: 40 Tickets.
      *   Switch Cost: 3 Tickets.
      *   Heads Math:
          *   Stick: Pay 10.
          *   Switch: Pay 3. (Save 7).
      *   Tails Math:
          *   Stick: Get 40.
          *   Switch: Get 40 (Initial was Pay) - 3 (Switch Cost) = 37. (Wait, if Switch doesn't kill Reward, why not switch? Just to save the hypothetical Heads cost? No, Heads is impossible now.)
          *   *Need to make Switch kill Reward.*
          *   Rule: "Reward in Tails depends on **Final** Commitment."
          *   Then:
              *   Tails Stick: 40.
              *   Tails Switch: 0 - 3 = -3.
              *   Heads Stick: -10.
              *   Heads Switch: 0 - 3 = -3.
          *   *Now:*
              *   Tails: Don't Switch (40 vs -3).
              *   Heads: Switch (-3 vs -10).
          *   *This creates the divergence.* Tails people stick. Heads people switch.
          *   *The "Squeeze":* The Heads person realizes: "If I stick, I lose 10. If I switch, I lose 3. But if I switch, I am the kind of person who switches. If everyone switches, the Ex-Ante EV is negative."
          *   *Wait, if Payoff depends on Final Commitment, then the Pre-Flip Note is irrelevant.*
          *   *I need the Pre-Flip Note to matter.*
          *   *Okay, Final Plan:*
              *   Pre-Flip Note: "Policy A" or "Policy B".
              *   Flip.
              *   Offer: "Change Note to Policy B for 3 tickets."
              *   Payoff:
                  *   Heads: If Note is A, Pay 10. If B, Pay 0.
                  *   Tails: If Note is A, Get 40. If B, Get 0.
              *   *Note:* The Payoff depends on the **Final** Note (after potential switch).
              *   *Heads:* Switch to B. Cost 3. Payoff 0. Net -3. (Better than -10).
              *   *Tails:* Stick with A. Cost 0. Payoff 40. Net +40. (Better than -3).
              *   *The Problem:* This makes Switching rational in Heads.
              *   *The Lesson:* "If you know you will Switch in Heads, you should not have committed to A ex-ante."
              *   *Ex-Ante EV of Commit A + Switch in Heads:* (0.2 * -3) + (0.8 * 40) = -0.6 + 32 = 31.4.
              *   *Ex-Ante EV of Commit B:* 0.
              *   *So Ex-Ante, you Commit A.*
              *   *Ex-Post (in Heads), you Switch.*
              *   *This is Time Inconsistency.*
              *   *The "Policy-First" view says: Don't Switch in Heads.*
              *   *Why?* Because if you don't switch, Ex-Ante EV is: (0.2 * -10) + (0.8 * 40) = 30.
              *   *Wait, 31.4 > 30.*
              *   *So the "Switch in Heads" strategy is actually better Ex-Ante!*
              *   *I need the numbers such that Sticking in Heads is better Ex-Ante.*
              *   *Cost of Switch must be higher or Reward higher.*
              *   *Let's make Switch Cost = 0, but Switching voids the Tails Reward for **everyone**?* No, one-shot.
              *   *Let's make the Reward in Tails depend on **not switching** in Heads.* (Impossible in one-shot).
              *   *Okay, I must rely on the "Predictor" logic.*
              *   *Facilitator:* "I give the Tails Reward based on whether I *predict* you will Pay in Heads."
              *   *Simulation:* "I use your Pre-Flip Note as the prediction. If you Switch in Heads, you prove my prediction wrong. I will retroactively void Tails Rewards for anyone who Switched."
              *   *This works.*
              *   *Heads:* Switch -> Save 10, Pay 0. But you are marked as "Switcher".
              *   *Tails:* Switch -> Lose 40 (Voided).
              *   *So Rational Agent does not Switch.*
              *   *But in Heads, the Voiding of Tails Reward is irrelevant (you aren't in Tails).*
              *   *So in Heads, you Switch.*
              *   *This is the Counterfactual Mugging paradox.*
              *   *CDT says Switch. UDT says Stick.*
              *   *I want them to feel the pull to Switch (CDT) but realize Stick (UDT) is the Policy.*
              *   *Okay, I will set the numbers so Switching is locally rational in Heads, but Stick is globally rational.*
              *   *Heads:* Stick = -10. Switch = -2 (Cost to switch). (Switch is better).
              *   *Tails:* Stick = +40. Switch = -2 (Cost) + 0 (Reward Voided). (Stick is better).
              *   *Ex-Ante:*
                  *   Policy "Stick": 0.2(-10) + 0.8(40) = 30.
                  *   Policy "Switch if Heads": 0.2(-2) + 0.8(40) = 31.6.
                  *   *Still Switching wins.*
                  *   *I need the Switch Cost to be negligible, but the Reward to be contingent on **not having the option**.*
                  *   *Okay, I'll stop over-engineering the math and focus on the **structure**.*
                  *   *The structure is: The Reward in Tails is given because you are the **type** who Pays in Heads.*
                  *   *If you Switch in Heads, you reveal you are not that type.*
                  *   *The Facilitator must enforce this.* "If you Switch, I assume you were never the type, and I revoke the Tails Reward."
                  *   *For the Heads person:* "If you Switch, you save 10. But you confirm you aren't the type. (Irrelevant to you now)."
                  *   *So Heads person Switches.*
                  *   *This is the "Squeeze".* The Heads person *should* Switch by CDT standards. The UDT view says "Stick."
                  *   *I will run it such that they *can* Switch, and we discuss why they did/didn't.*

      *   **Final Decision on Mechanics:**
          *   Round 2:
              *   Commit: "I Pay" or "I Don't".
              *   Flip: 20% Heads (Pay 10), 80% Tails (Get 50).
              *   Condition: Tails Reward *only* if Commit was "I Pay".
              *   Mid-Game: "You can change Commit to 'I Don't' for cost 1 ticket."
              *   Constraint: "If you change, you are ineligible for Tails Reward." (Even if in Tails).
              *   Heads Scenario: You Pay 10 if Commit is "I Pay". If you change, you Pay 0 + 1 Cost = 1.
              *   *Heads Rational Choice:* Change (Cost 1 vs 10).
              *   *Tails Rational Choice:* Don't Change (Get 50 vs Get 0 - 1).
              *   *Ex-Ante Rational Choice:* Commit "I Pay" and **Do Not Change** in Heads. (EV: 0.2*-10 + 0.8*50 = 38).
              *   *Ex-Ante Rational Choice (if Changing in Heads):* Commit "I Pay" and Change. (EV: 0.2*-1 + 0.8*50 = 39.8).
              *   *Wait, Changing in Heads is STILL better Ex-Ante.*
              *   *I need the Cost of Switching to be higher than the Savings in Heads.*
              *   *Savings in Heads = 10.*
              *   *Cost of Switching must be > 10.*
              *   *But Stakes must be small.*
              *   *Okay, make Heads Cost 5. Make Switch Cost 6.*
              *   *Heads:* Stick = -5. Switch = -6. (Stick is better).
              *   *Tails:* Stick = +50. Switch = -6 + 0 = -6. (Stick is better).
              *   *Now Stick is dominant.*
              *   *But where is the tension?* The tension is "I want to Switch to avoid the pain, but the math says no."
              *   *That's willpower, not decision theory.*
              *   *I need the local incentive to Switch.*
              *   *Okay, Switch Cost = 0.*
              *   *Heads:* Stick = -5. Switch = 0. (Switch better).
              *   *Tails:* Stick = +50. Switch = 0 (Reward Voided). (Stick better).
              *   *Ex-Ante:*
                  *   Stick: 0.2*-5 + 0.8*50 = 39.
                  *   Switch in Heads: 0.2*0 + 0.8*50 = 40.
                  *   *Still Switching wins.*
              *   *Okay, the only way to make Sticking Ex-Ante optimal is if Switching in Heads **causes** you to lose the Tails Reward.*
              *   *This requires the Predictor to be real.*
              *   *Since it's not, I must **stipulate** it.*
              *   *Facilitator:* "I have already distributed the Tails Rewards based on your Pre-Flip Note. If you Switch in Heads, I will take them back from the Tails people."
              *   *This makes it a group game.*
              *   *Prompt:* "Genuinely one-shot: nothing that lets them win by playing it ten times and being consistent."
              *   *Does "Group Reward" violate one-shot?* No, it's one session.
              *   *Okay, I'll use the Group Reward mechanic.*
              *   *If anyone Switches in Heads, **no one** gets the Tails Reward.*
              *   *Now:*
                  *   Heads Person: Switch -> Save 5. Cost -> Group loses 40*0.8*12 = Huge.
                  *   *This makes it a Public Good Game.*
                  *   *That's not Decision Theory, that's Game Theory.*
              *   *Okay, I will acknowledge the limitation in the debrief.* "In the real logical version, your decision in Heads *logically implies* your decision in Tails. Here, we simulate that with a rule."

      *   **Final Plan:**
          *   Round 1: Standard Updating (Coin -> Decide).
          *   Round 2: Counterfactual Mugging Sim.
              *   Pre-Commit.
              *   Flip (20% Heads).
              *   Offer to Switch (Cost 0).
              *   Rule: "Tails Reward depends on Pre-Commit. Heads Cost depends on Final Commit."
              *   Wait, if Tails Reward depends on Pre-Commit, then Switching in Heads doesn't lose the Tails Reward (for the Tails people).
              *   *Okay, I'll just run the "Squeeze" as a personal loss.*
              *   *Heads Person:* "I pay 5. I get nothing. I see Tails people getting 50. I feel like a sucker."
              *   *Debrief:* "The Policy requires you to be okay with being the sucker in the 20% branch."
              *   *This matches the addiction experience perfectly.* "You are the sucker tonight. No one sees it. But you stick to the policy."
              *   *I will skip the "Switch" mechanic for Heads if it complicates the EV.*
              *   *No, Prompt insists:* "I want a mid-game moment where they're offered the chance to rewrite their answer after seeing the flip, at a cost."
              *   *Okay, I will include it. It serves to highlight the temptation to update.*
              *   *Heads Person:* Offered chance to Switch (avoid cost). If they Switch, they are "Consistent" with CDT. If they Stick, they are "Consistent" with UDT.
              *   *We tally the results.*

  7.  **Final Polish:**
      *   Ensure the Economist's objection is preempted.
      *   Ensure the "Logical vs Physical" limitation is explicit.
      *   Keep stakes non-monetary (Chocolate/Tickets).
      *   Timeline fits 75 mins.
answer: |-
  Here is a 75-minute session plan designed to make your group feel the tension between *updating on evidence* and *honoring a policy* without lecturing them on the labels.

  ### Session Title: "The Sucker's Branch"
  **Materials:**
  *   12 Envelopes (labeled 1–12).
  *   1 Biased Coin (or a random number generator app set to 20% Heads).
  *   60 Raffle Tickets (for a book prize at the end of the session).
  *   Small chocolates (for immediate payouts).
  *   Pens and index cards.

  **Stakes:**
  *   **Raffle Tickets:** Enter a draw for a hardcover book (e.g., *The Alignment Problem* or similar).
  *   **Chocolate:** Immediate consumption.
  *   **Costs:** Paid in tickets or chocolates.

  ---

  ### Timeline (75 Minutes)

  #### 0:00 – 0:10 | Introduction & Round 1 (The Obvious Update)
  **Setup:** Tell them this is a game about information value.
  **Mechanic:**
  1.  Hand each person an envelope containing a card: **HEADS** or **TAILS** (50/50 split).
  2.  **Rule:** "Open the envelope. Look at the card. Then decide: Do you pay 1 chocolate to receive 3 chocolates?"
  3.  **Payoff:**
      *   If **HEADS**: Pay 1 → Get 3. (Net +2).
      *   If **TAILS**: Pay 1 → Get 0. (Net -1).
  4.  **Action:** They open, see the truth, and decide.
  **Expected Outcome:** Everyone with Heads pays. Everyone with Tails refuses.
  **Debrief (5 mins):** Ask: "Did anyone with Tails pay?" (No). "Why?" (Because the evidence said it was a loss). "Was looking at the card useful?" (Yes).
  **Point:** In standard causal structures, conditioning on free evidence is strictly dominant.

  #### 0:10 – 0:40 | Round 2 (The Policy Trap)
  **Setup:** Tell them the rules have changed. The payoff now depends on *who they are*, not just what the coin says.
  **Mechanic:**
  1.  **Pre-Commitment (5 mins):** Before any coin is flipped, everyone writes on an index card: **"I PAY"** or **"I DON'T"**. Seal it in an envelope. Collect these. (Explain: "This represents your policy before you know your situation.")
  2.  **The Flip (5 mins):** Use the biased coin (20% Heads, 80% Tails). Flip *once* for the whole room, OR flip individually (individual is better for variance). Let's do **individual flips** to ensure some land in the rare branch.
      *   **Heads (20%):** "The Cost Branch."
      *   **Tails (80%):** "The Reward Branch."
  3.  **The Reveal & Offer (10 mins):**
      *   Participants open their flip result.
      *   **The Offer:** "You may now open your sealed index card. If you wish, you can **rewrite** your answer to 'I DON'T' at a cost of **1 Ticket**."
      *   **The Payoff Rules (Write on board):**
          *   **If Tails:** You receive **40 Tickets** *IF AND ONLY IF* your **Original Sealed Card** said "I PAY". (The rewrite does not save the reward, but the rewrite cost still applies).
          *   **If Heads:** You pay **10 Tickets** *IF AND ONLY IF* your **Final Decision** (after rewrite) is "I PAY".
  4.  **Resolution (10 mins):**
      *   Collect rewrites.
      *   Distribute rewards/costs.
      *   **Crucial Moment:** Identify who landed on **Heads**.
          *   If they stuck with "I PAY": They lose 10 tickets. They get no reward (because they are in Heads).
          *   If they switched to "I DON'T": They lose 1 ticket (switch cost). They get no reward.
          *   *Note:* In this specific setup, switching is locally rational in Heads (lose 1 vs lose 10). **Let them do it.** The pain comes from the comparison.

  #### 0:40 – 0:55 | The Debrief: Mapping the Intuition
  Do not name "UDT" or "Newcomb" yet. Ask these questions:

  1.  **To the Tails group:** "You got 40 tickets. Did anyone switch their card to 'Don't Pay'?"
      *   *Likely:* No. Switching cost 1 ticket and didn't save the reward (since reward depended on the *original* seal).
  2.  **To the Heads group:** "You lost 10 tickets (or 1 if you switched). Look at the Tails group. They are rich. You are poor. Why did you agree to this game ex-ante?"
      *   *Calculation:* Ask them to calculate the Ex-Ante Expected Value (EV).
      *   *Policy "Pay":* (0.2 × -10) + (0.8 × 40) = **+30 Tickets**.
      *   *Policy "Don't":* 0.
      *   *Policy "Pay then Switch in Heads":* (0.2 × -1) + (0.8 × 40) = **+31.8 Tickets**.
      *   *Wait:* If switching in Heads is allowed and saves money, the "Switch" strategy has higher EV.
      *   *Correction for the Session:* To make the "Stick" policy win, you must stipulate: **"If you switch your card in Heads, I void the Tails rewards for everyone."** (This simulates the logical link).
      *   *Revised Debrief Question:* "If the Heads person switches, they save 9 tickets personally. But if that switch proves they aren't a 'Payer', the Tails people lose their 40. Does the Heads person have a reason to suffer?"
  3.  **The Core Question:** "In Round 1, looking at the card was smart. In Round 2, for the Heads person, looking at the card tells them 'You are a sucker.' If they update on that information, they switch. If they switch, the policy collapses. Who here felt the urge to switch even though they knew it broke the ex-ante deal?"

  #### 0:55 – 1:15 | Deep Dive: The Gap & The Limitations
  Now you introduce the concepts.

  **1. Refusing to Condition vs. Ignoring Evidence**
  *   **Point:** The "Policy-First" view (Updateless/Timeless) doesn't say "Evidence is fake." It says "Some evidence is **endogenous**."
  *   **Analogy:** In Round 1, the coin was external. In Round 2, the coin *plus your reaction* determines the payout.
  *   **The Addiction Link:** "The craving (Heads) is evidence that 'Drinking would feel good now.' Updating on that evidence leads to drinking. But the decision to quit was made in a 'Tails' state (sober morning). If you re-open the decision every evening (Heads), you systematically lose the long-term reward."

  **2. The Economist's Objection (The Predictor)**
  *   **Predictable Failure:** The economist will say, "The Facilitator isn't a real predictor. The Tails reward was already locked in the envelope. Switching in Heads doesn't physically change the Tails payout."
  *   **Your Response:** "Correct. This is the **Physical vs. Logical** gap."
  *   **Explanation:** "In the real philosophical problem (Counterfactual Mugging), the predictor is logical. Your decision in Heads *logically implies* your decision in Tails. They are the same computation. In this room, they are physically separated events. I simulated the link with a rule ('If you switch, I void rewards'). In reality, the link is mathematical."
  *   **Action:** "You have to imagine that your choice right now *is* the choice the Tails version of you made. Not because I say so, but because you are the same algorithm."

  **3. The "Sort of Person" Objection**
  *   **Predictable Failure:** Someone will say, "This is just about being the sort of person who keeps promises."
  *   **Your Response:** "It's not virtue ethics. It's expected value. Being that 'sort of person' is the only way to access the +30 EV branch. If you are the sort of person who updates when it hurts, you are the sort of person who never gets the Tails reward."

  **4. What the Game Couldn't Reproduce**
  *   **Honesty:** "In this game, the Heads person is actually a sucker. They pay 10 and get nothing. In the logical version, the Heads person pays 10 *because* that payment is what caused the Tails reward to exist. Their suffering is causally efficacious across the counterfactual."
  *   **Closing:** "In recovery, the evening you crave a drink and don't have one feels like the Heads branch. You suffer, and no one sees it. But that suffering is the price of the policy that keeps you sober in the long run. If you re-evaluate every evening, you condition on the craving, and you lose the sobriety."

  ---

  ### Predictable Failures & Mitigations

  **1. The "It's Just a Threat" Objection**
  *   **Risk:** Participants feel the "If you switch, I void rewards" rule is an arbitrary threat by you, not a structural feature of the universe.
  *   **Mitigation:** Acknowledge this. "In the game, I am the enforcer. In decision theory, *logic* is the enforcer. You can't cheat logic any more than you can cheat me in this room."

  **2. The "Heads Players Will Revolt" Problem**
  *   **Risk:** The 20% who land on Heads will feel cheated and angry, disrupting the debrief.
  *   **Mitigation:** Pre-empt this. "If you land on Heads, you are the martyr of this experiment. Your loss is the data point we need. I will personally compensate you with extra chocolate after the session so you don't leave angry, but during the game, you must sit with the loss."

  **3. The "One-Shot" Violation**
  *   **Risk:** They try to iterate strategies.
  *   **Mitigation:** Emphasize: "You only get one index card. You only get one flip. There is no Round 3."

  ### The "Switch" Mechanic Nuance
  *Note on the Switch Cost:*
  If you want the **Policy** to be strictly dominant (i.e., Switching is mathematically wrong even locally), set the **Switch Cost** higher than the **Heads Savings**.
  *   Heads Cost: 10 Tickets.
  *   Switch Cost: 12 Tickets.
  *   *Result:* Even in Heads, switching costs more (12) than paying (10).
  *   *Why do this?* It forces them to feel the **temptation** without making switching rational. They *want* to switch to avoid the pain, but the math says no. This mirrors the addiction struggle (Willpower vs. Rationality).
  *   *Why NOT do this?* If switching is irrational, the "Updateless" choice is just the "Causal" choice.
  *   *Recommendation:* **Keep Switching Locally Rational (Cost 1, Savings 10).** Let them switch. The debrief is stronger if the Heads players *defect*. It proves that without a logical link (or a strong enough will), CDT eats UDT for lunch.

  ### Final Note for You
  You mentioned the fear of them concluding the view says "ignore evidence."
  **Counter-argument to have ready:** "We don't ignore evidence. We ignore evidence that is **correlated with our decision procedure** rather than the state of the world. The coin flip is the state of the world. Your urge to switch is evidence of your decision procedure. In Round 2, the payout depends on the procedure, not just the world."

  This session should leave them with the visceral feeling that *sometimes, knowing where you are makes it harder to get where you want to be.* That is the heart of the updateless intuition.
