      *   *Correction:* Address the "twice over" claim (killing existing + stopping births). Killing existing animals via habitat destruction is often slow and painful (starvation/exposure), potentially worse than predation.

  7.  **Final Polish:** Check against "no headings, bullets, bold text or tables". Ensure continuous prose.

