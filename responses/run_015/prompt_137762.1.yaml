answer: |-
  Dear friend,

  It is completely understandable that you found that blog post unsettling, and your intuition that the conclusion does not follow from the premises is shared by most people who work in ecology or animal welfare ethics. The argument you describe relies on a philosophical position known as negative utilitarianism applied to wild animals, and while it raises important questions, the leap from biological facts to moral prescriptions about housing development is fraught with empirical uncertainties and logical gaps. I shall walk through the claims roughly in order to separate the biological realities from the speculative ethics and the practical errors.

  The opening claim that most wild animals are the lay-thousands-of-eggs kind and that the typical individual dies within days of being born is broadly consistent with ecological data for many species, particularly insects, fish, and amphibians. Ecologists call this r-selection, where organisms produce vast numbers of offspring with little parental investment, expecting most to perish quickly. So far, the author is on solid ground regarding mortality rates. However, the next step, asserting that this makes the average wild life short, nasty and almost certainly not worth living, is where the science stops and speculation begins. High mortality does not automatically equate to net negative welfare. An animal can have a short life that contains moments of pleasure, satisfaction of drives, or absence of pain that outweigh the suffering of its death. We simply do not have the data to measure the subjective experiences of wild animals across their lifespans to determine if the sum is positive or negative. To claim it is almost certainly not worth living is a philosophical assumption, not a biological fact, and many welfare scientists argue we should remain agnostic until we understand animal sentience and experience much better.

  This uncertainty is compounded when the author notes that when you count by individuals it is mostly insects and other small stuff that does the counting. This is numerically true, but it introduces a massive variable regarding sentience. We do not know for certain whether insects possess subjective experiences of suffering in a way that matters morally, or if their nervous systems are merely processing nociception without conscious pain. If insects are not sentient, then the vast majority of the suffering calculus disappears. If they are, we still do not know the intensity of their experience compared to a mammal. Basing a policy of habitat destruction on the welfare of creatures whose capacity for suffering is unproven is extremely risky. Even if we grant the premise that wild lives are net negative, the argument that a patch of habitat is basically a machine for producing lives like that ignores the complexity of ecosystems. Habitats are not just breeding factories; they are complex networks where suffering occurs but also where stability exists.

  The claim that draining a marsh or clearing scrub cuts suffering twice over by removing animals already there and stopping them producing any more is where the argument becomes practically dangerous and likely false. Removing animals already there via habitat destruction rarely results in instant, painless death. Instead, it typically leads to displacement, starvation, exposure, and increased predation as animals are forced into suboptimal areas. The suffering caused by the destruction process itself could easily outweigh the suffering prevented by stopping future births. Furthermore, destroying habitat does not simply erase the potential for life; it often fragments the remaining landscape, creating edge effects that can increase stress and mortality for the survivors. The idea that you are doing a moral good by bulldozing scrubland assumes a level of control over the outcome that does not exist in complex ecological systems.

  When the author responds to the comment about survivors doing better by saying nature just refills the space, he is referring to density dependence, which is a real ecological phenomenon. If you reduce a population, resources become more abundant per capita, and reproduction often increases until carrying capacity is reached. However, this does not validate destroying habitat for housing. Building houses does not just remove animals; it introduces humans, domestic pets, vehicles, pollution, and artificial light, all of which create new sources of suffering for wild animals that persist indefinitely. A housing estate is not a vacuum; it is a new ecosystem that often supports high densities of synanthropic species like rats or pigeons, whose welfare profiles might be just as questionable as the scrubland inhabitants, alongside the suffering caused by collisions and predation by cats. Therefore, the net change in suffering is unpredictable and likely negative when considering the broader context.

  Finally, the conclusion that conservationists are making the world worse by their own values assumes that conservationists value only individual animal welfare, which is rarely the case. Conservation ethics usually prioritise species integrity, biodiversity, ecosystem function, and the preservation of natural processes over the welfare of individual specimens. While there is a growing movement to integrate wild animal welfare into conservation, the two fields are not identical. Even if one takes wild animal suffering seriously, the prudent approach is cautious intervention based on rigorous research, not reckless destruction based on unproven assumptions. Most researchers in this field argue that if we are to intervene in nature to reduce suffering, it should be done through careful, targeted methods like vaccination or sterilisation, rather than blunt instruments like habitat destruction which cause immediate harm and unpredictable long-term consequences.

  In summary, while the biological observation about high mortality rates is correct, the inference that these lives are not worth living is unproven, and the prescription to destroy habitat is likely to cause more suffering than it prevents. The argument fails because it treats complex ecosystems as simple arithmetic equations and ignores the suffering caused by the intervention itself. Regarding the scrubland near you, supporting the conservation group is consistent with a precautionary principle that avoids causing definite harm based on speculative moral calculations. I hope this helps clarify where the blog post loses its way.

  Best wishes.
