  *Follow-up:* If the neural mechanisms are continuous, why does the phenomenology of agency shift so dramatically between trivial and consequential acts?

  3. If conscious intention never initiates action, even in complex cases, does this mean our practices of holding people morally responsible are fundamentally mistaken about the causal history of their choices?
  *Follow-up:* So you suggest we retain the language of responsibility while accepting no one is the causal source of their choices in the way that language implies?

  4. You argue the conscious veto is determined by antecedent processes and fails within a narrow window before movement. Does this narrow window show conscious will is a causal gate, or only that the motor system has already committed and the subject is reading out a commitment she can no longer revoke?
  *Follow-up:* If the feeling is merely a readout of a process already determined to succeed or fail, in what sense is the conscious agent doing the vetoing rather than witnessing it?

  5. Consider a stop-signal task where cancellation fails abruptly below a 200ms threshold, with premovement signals indistinguishable until just before that point. What does this specific pattern show about the causal efficacy of the conscious command to stop?
  *Follow-up:* Does this imply consciousness is structurally excluded from the motor loop, or simply that it operates too slowly to intervene in high-speed execution?

  6. Continuing that scenario, what pattern of neural data would have shown the opposite—that conscious intention can override prepared motor programs regardless of timing?
  *Follow-up:* Given the dependence of report on neural processing, is there any conceivable experiment where you wouldn't attribute the report itself to antecedent neural causes?

  7. You concede the evidence underdetermines whether conscious intention is causally inert or merely a late modulator. What observation would break this tie, and is there any such observation you would accept as decisive rather than explaining away?
  *Follow-up:* If you suspect confounds will always be found, aren't you admitting your view is protected from falsification by a methodological assumption rather than empirical data?

  8. Libet argued conscious will biases neural outcomes without adding energy, allowing for initiation but not veto. If that escape route is open for the veto, why not for initiation, and what makes your epiphenomenalism more parsimonious than his interactionism?
  *Follow-up:* But if consciousness is merely descriptive, why does it feel like an executive controller, and isn't dismissing that phenomenology as illusion the less parsimonious explanation of our lived experience?

  \answer{Q7 — This question hardest because it challenges the scientific status of her view by exposing its potential unfalsifiability.}
