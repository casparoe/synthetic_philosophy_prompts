prompt: |-
  so I'm about 60k words into a novel about a real person and I've worked myself into a knot I cant think my way out of, and I want you to argue the side I don't want to be true.

  Setup: she's my great-great-aunt, died 1891, unmarried, obscure — wrote some temperance tracts, kept a diary for four years in her twenties and then stopped. The entire record is basically eleven letters, that diary, a court entry about a debt, and one photograph. I've used her real name. The invented stuff: a night where she gets drunk in somebody else's house, and a scene where she burns a bundle of letters. No evidence for either, and the drunk night cuts straight against everything she published and was known for.

  My own view, which I've been defending to my family for a year, is that truth is the wrong norm here. What I owe her isn't truth, it's *aptness*: the invented thing has to be the sort of thing the record leaves room for and the pressures in the letters make sense of, apt the way a metaphor is apt — answerable to the shape of the life, not to the ledger of what happened. And if a reader comes away believing she got drunk, well, almost nobody will, and if they do nothing follows from it.

  But I keep hitting a case I have no answer to, which I've started calling *eviction*: because there's basically nothing else, my novel is going to *be* the record. There won't be a competing version. The archive gives you four sentences and a photo, and googling her name gets you my book. So I'm not adding one more story to a pile of stories about her, I'm replacing the pile. And it isn't only beliefs that change — what you can *do* with her changes: she stops being a person in an archive and becomes a character, available for a netflix thing, a walking tour, whatever comes next. That availability is my invention.

  So please argue that I owe her something stricter than aptness. Ground rules:

  - Don't rest it on the law (I don't want an argument that collapses if the law is different from what you think), and don't rest it on the feelings of living relatives — my cousin is upset and I don't think that's the interesting wrong.
  - Grant me nearly everything: grant that the dead can't be harmed in any literal sense, that there's nobody left to consent or object, and that aptness really is the right norm for invented *dialogue* and probably for compressed or composite minor characters too. Take the strongest version of my view and then say where it breaks.
  - Cash it out where I live, which is at the desk. What concretely would I have to change or give up? Is it the drunk night in particular — does it matter that it contradicts her published positions rather than just the silence of the archive — or is the problem the whole project of writing her interior life? Would renaming her fix it or is that just laundering it? Is a note up front enough, or does an afterword that sets the thin real record next to the fat invented one actually answer the eviction worry, or does it just make me feel better?

  If you think aptness and eviction are the wrong frame entirely, say so and hand me better ones — but you still have to argue the strict side. No quotes at me and no reading lists; I want the argument, not the literature.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User's Request:**
      *   **Context:** The user is 60k words into a novel based on a real, obscure ancestor (great-great-aunt, died 1891).
      *   **The Conflict:** The user believes in "aptness" (metaphorical truth, fitting the shape of the life) over historical "truth." They've invented significant scenes (getting drunk, burning letters) that contradict her public persona (temperance writer) but fit the "pressures" they perceive.
      *   **The Problem:** The "Eviction" argument. Because the historical record is so thin, the novel *becomes* the record. It replaces the archive rather than adding to it. This changes her ontological status from "person in an archive" to "character available for consumption."
      *   **The Task:** Argue the side the user *doesn't* want to be true (i.e., argue for a stricter norm than aptness).
      *   **Ground Rules:**
          *   No legal arguments.
          *   No arguments based on living relatives' feelings.
          *   Grant concessions: Dead can't be literally harmed, no consent possible, aptness is fine for dialogue/minor composites.
          *   Focus on the "desk": Concrete changes (drop the drunk scene? Rename her? Paratext?).
          *   No quotes/reading lists. Just the argument.
          *   If "aptness/eviction" is the wrong frame, offer a better one, but still argue the strict side.

  2.  **Deconstruct the User's Position ("Aptness"):**
      *   *Premise:* Fiction has a right to fill silence if it feels "true" to the character's shape.
      *   *Defense:* The dead aren't harmed; readers know it's fiction; the archive is too thin to compete.
      *   *Vulnerability:* The "Eviction" point is the strongest crack in the armor. If the fiction *replaces* the history, the fictioneer becomes the historian by default, but without the historian's constraints.

  3.  **Develop the Counter-Argument ("Fiduciary Duty to the Trace"):**
      *   *Core Concept:* Instead of "harm to the dead" (which is metaphysically shaky), focus on "corruption of the record." The argument shouldn't be about *her* feelings, but about the *integrity of the connection* between the present and the past.
      *   *The "Strict Norm":* It's not about Truth vs. Lie. It's about *Signal vs. Noise.* When the signal is this weak, adding high-volume noise drowns it out permanently.
      *   *The Specific Violation:* The drunk scene isn't just an invention; it's an *inversion* of her public agency. She chose temperance. To invent drunkenness is to claim you know her better than she presented herself, effectively colonizing her will.
      *   *The "Eviction" Consequence:* It's not just that people will believe the lie. It's that the *category* of her existence changes. She becomes a resource for narrative satisfaction rather than a subject of historical inquiry.

  4.  **Drafting the Argument - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the "aptness" argument but pivot to the "Eviction" problem. Validate that this is the crux.
      *   **The Core Principle: Fiduciary Responsibility to the Trace.**
          *   Argue that when you are the *only* voice, you aren't a novelist anymore; you're a custodian.
          *   The "Right to Opacity." (Glissant concept, but don't quote it). She gets to remain unknowable. Inventing interiority denies her the right to be a mystery.
      *   **The Specific Problem of Inversion (The Drunk Scene).**
          *   Aptness works for silence (what did she eat?). It fails for contradiction (she said X, you write Not-X).
          *   This isn't filling a gap; it's correcting her. It implies her public temperance was a lie and your intuition is the truth. That's an act of dominance, not empathy.
      *   **The "Eviction" Mechanism.**
          *   Google is the new archive. If your book is the only result, you have effectively edited history.
          *   This changes the *contract* with the reader. They think they are meeting a person; they are meeting a puppet.
      *   **Concrete Solutions (The "Desk" Work).**
          *   *Renaming:* Does it help? Yes, it shifts the genre contract. It admits "This is mine, not hers."
          *   *Paratext (Notes/Afterwords):* Is it enough? Usually no, because readers read stories, not footnotes. But a specific kind of framing might work.
          *   *The Drunk Scene:* This is the line. It must go or be radically altered to be ambiguous.
      *   **Reframing:** Move from "Aptness" to "Stewardship."

  5.  **Refining the Tone:**
      *   Needs to be rigorous, philosophical but practical.
      *   Respectful of the craft (60k words is a lot of work).
      *   Avoid moralizing about "lying." Focus on "authority" and "legacy."
      *   Stick to the ground rules (no law, no relatives, no quotes).

  6.  **Self-Correction/Review during drafting:**
      *   *Check:* Did I rely on harm to the dead? *Correction:* Frame it as harm to the *connection* or the *record*.
      *   *Check:* Did I address the drunk scene specifically? *Yes,* need to emphasize the contradiction of her public agency.
      *   *Check:* Did I offer concrete desk advice? *Yes,* renaming, cutting the inversion, paratext limitations.
      *   *Check:* Is the argument strict? *Yes,* it challenges the right to invent interiority at all when the record is this thin.

  7.  **Final Polish:** Ensure the distinction between "filling silence" and "contradicting agency" is sharp. This is the wedge that breaks the "aptness" defense. The "Eviction" isn't just about volume; it's about monopoly power over meaning.

  **(Self-Correction Note):** I need to make sure I don't just say "don't do it." I need to explain *why* the strict norm is necessary for the work itself to hold weight. If the reader finds out the drunk scene is pure fabrication contradicting her life's work, does the novel lose its emotional resonance? Yes. So the argument is also about the *integrity of the art*.

  8.  **Finalizing the Argument Structure:**
      1.  The Monopoly Problem (Eviction).
      2.  The Agency Problem (Contradicting her public will).
      3.  The Right to Opacity (Refusing to know).
      4.  Concrete Fixes (Naming, The Scene, The Frame).

