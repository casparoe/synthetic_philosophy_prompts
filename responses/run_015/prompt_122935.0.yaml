answer: |-
  You have identified the exact fault line in your project. Your defense of "aptness" works perfectly when the archive is crowded. If you were writing about Queen Victoria, a scene of her getting drunk in private would be read as an interpretation, one voice among thousands. But you are writing about a ghost with only four sentences to her name. In this context, you are not a novelist interpreting a life; you are a monopolist controlling a reality.

  Here is the argument for the stricter norm, grounded not in harm to the dead (which is metaphysical) or feelings of the living (which is sentimental), but in the **integrity of the record** and the **ethics of authority**.

  ### 1. The Monopoly Problem (Eviction as Erasure)
  You argue that "almost nobody will believe she got drunk." That is a bet on reader sophistication. But the "Eviction" worry isn't about belief; it's about **availability**.

  When the archive is empty, the novel does not compete with history; it *becomes* history. By using her real name, you are claiming a referential link. You are telling the reader: "This name points to this person." But if 95% of the content attached to that name is your invention, you have not illuminated the person; you have colonized her.

  The stricter norm here is **Stewardship over Ownership**. When you take a real name with a thin record, you accept a fiduciary duty to the silence. You are borrowing her authority to lend weight to your story. Her obscurity gives you cover to invent, but her reality gives your invention gravity. That is an unearned advantage. If you take the gravity, you must accept the constraints. If you want the freedom of fiction, you must surrender the authority of the name.

  **The Desk Consequence:** You cannot have both the specific authority of her name and the total freedom of a novelist. If you keep the name, the silence of the archive must remain audible. You cannot fill every gap. If you fill every gap, you are not writing a novel about her; you are writing a replacement for her.

  ### 2. The Agency Problem (Aptness vs. Inversion)
  You grant that aptness works for dialogue or compressed characters. But the "drunk night" is not a gap-fill; it is an **inversion**.

  She published temperance tracts. That was an act of public will. She chose to be known as a temperance woman. To invent a scene where she is drunk is not to interpret the silence; it is to contradict her agency. It says: "You think you were sober, you think you wanted the world to see you as sober, but I know you better than you knew yourself."

  This is where "aptness" breaks. Aptness asks, "Is this metaphorically true?" The stricter norm asks, "Does this violate her public will?" When the subject is obscure, she cannot defend her public will. You are the only defense. If you undermine her stated principles for the sake of narrative tension or "humanizing" complexity, you are exercising power over someone who cannot resist it. It is an act of narrative dominance disguised as empathy.

  **The Desk Consequence:** The drunk scene must go. Not because it didn't happen (you don't know that), but because it contradicts her *chosen* record. You can write ambiguity—you can write a scene where she is exhausted, or angry, or tempted—but you cannot write a scene that flatly negates her life's public work. That isn't fiction; that's correction.

  ### 3. The Right to Opacity
  There is a philosophical claim here that you are violating: the **Right to Opacity**. We tend to think that to love or understand someone is to know them fully, to shine a light into every corner of their interiority. But some people, especially those from the past, have a right to remain unknowable.

  By writing her interior life in detail—especially when the record is silent—you are denying her the right to be a mystery. You are forcing her into the shape of a modern character (complex, contradictory, secret-driven) because that is what sells novels. You are making her legible to a 21st-century audience at the cost of her 19th-century reality.

  The "Eviction" happens because you are evicting the *mystery* of her. The archive says: "Here is a woman who wrote, then stopped. We don't know why." That silence is data. It tells us about the limits of what we can know. By inventing the "why" (the burning of the letters, the secret drink), you are deleting the data point of *uncertainty*.

  **The Desk Consequence:** You may need to pull back on the interiority. If the diary stops, maybe the narrative access to her mind should also become restricted. You don't have to write in the third-person objective, but you should not claim omniscience where the record claims ignorance.

  ### 4. Renaming and Framing (The Concrete Fixes)
  You asked if renaming fixes it. **Yes.**
  Renaming her severs the referential link. It admits: "This is a story *inspired* by a person, not a story *of* the person." It shifts the contract with the reader from "This is history" to "This is art." It protects the archive from your invention. It allows you to keep the drunk scene because "Eliza" can get drunk; "Great-Great-Aunt Mary" cannot, because Mary's record is fixed.

  You asked if a note or afterword fixes it. **No.**
  Readers read stories, not disclaimers. A note at the front is a speed bump; the story is the highway. An afterword is often unread. If the novel is the only Google result, the afterword will not be indexed by culture, only the plot points. The "Eviction" stands because the *story* is what travels, not the footnote.

  **The Desk Consequence:**
  1.  **Change the Name:** This is the cleanest ethical cut. It acknowledges that the character is yours, even if the skeleton is hers. It protects the historical trace from being overwritten.
  2.  **Cut the Inversion:** If you keep the name, you must cut the drunk scene. It is a direct assault on her public agency. You can write struggle without writing capitulation.
  3.  **Acknowledge the Silence:** In the text itself, find a way to mark where the record ends and your invention begins. Not in a footnote, but in the texture. Let the reader feel the thinness of the ice they are walking on.

  ### Summary of the Strict Norm
  The norm you owe her is not "Truth" (which is impossible), but **Non-Interference**.

  When the record is thick, you can interpret. When the record is thin, you must not obstruct. Your "aptness" argument assumes you are adding to a pile. You have correctly identified that you are *replacing* the pile. Therefore, you are not an artist adding to a tradition; you are an archivist with a pen.

  If you keep her name, you are claiming she is real. If she is real, her public acts (temperance) are fixed points. You can orbit them, but you cannot crash into them. If you want to crash into them, you must admit the planet is fictional. Rename her. It costs you nothing but the specific claim to her authority, and in exchange, it buys you the freedom to write the novel you want without the burden of being the sole historian of a life you cannot verify.
