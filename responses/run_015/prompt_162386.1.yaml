  **Assessment of Your Framing and Confidence Level**

  **Confidence:** I am **highly confident** (90%+) that a strict reading of your governing documents requires rejecting this application. I am **moderately confident** (70%) that rejecting her is the only decision that protects the committee from a successful grievance, given the precedent of last year's rejection.

  **The Textualist Objection:** A careful textualist colleague would reject the move to count "13 years" as "12 years" immediately. The phrase "no more than twelve years before the application deadline" is a calendar measurement, not a measure of full-time-equivalent (FTE) activity. To subtract the three years of leave is to modify the metric, not interpret it.

  **The "Interpretation vs. Waiver" Distinction:** You suspected this distinction might be bogus. **It is.** You are correct to worry that the "no-waiver" clause forces a purposive answer to disguise itself as a reading of the text. If the text says 12 and you count 9, you have waived 3. Calling it "interpretation" does not change the operational reality. Because your bylaws explicitly forbid waiver ("may not waive or modify"), you lack the authority to make this adjustment, regardless of how compelling the purposive argument is.

  **The Document's Weight:** Your documents *can* bear the weight, but not in the way you hope. The 1989 Bylaw controls the 2014 Guidelines (bylaws supersede committee guidelines). The "no-waiver" clause controls the Committee's discretion. The only path that respects the hierarchy of your documents is to apply the text as written, however unjust the outcome.

  **Recommendation:** Do not attempt to admit her this cycle. The risk of a grievance from last year's male applicant (who was treated differently under identical facts) creates a liability that outweighs the benefit of correcting the injustice for this applicant. The remedy is a bylaw change in November, not a procedural workaround now.

  ***

  **DRAFT MEMO**

  **TO:** Prize Eligibility Committee
  **FROM:** [Your Name]
  **DATE:** [Current Date]
  **SUBJECT:** Decision on Eligibility Case #2023-44 and Future Protocol

  **Bottom Line**
  We must rule the applicant **ineligible** for this cycle. This decision must be communicated to the applicant by close of business Friday. While she fits the purposive spirit of the prize, admitting her violates the explicit text of the 1989 Bylaw and the Committee's prohibition on waivers.

  **Reasoning: Interpretation vs. Waiver**
  We must be candid about the legal mechanism here. The Bylaw states: "Applicants must have received the doctorate no more than twelve years before the application deadline." This is a calendar-based bright-line rule.

  There is a temptation to classify subtracting parental/medical leave as an *interpretation* of "twelve years" (i.e., twelve years of *active* career). However, given Bylaw Section [X] which states the committee "may not waive or modify any eligibility requirement," this distinction does not hold. Subtracting time from the total elapsed years is a modification of the requirement, regardless of the label we apply. We do not have the authority to waive the twelve-year cap, even for equitable reasons.

  Furthermore, we cannot rely on the 2014 Grant Guidelines to override the 1989 Bylaw. The Guidelines are subordinate to the Bylaws and were never reconciled by a membership vote. Relying on them would expose the decision to appeal.

  **Precedent and Equity**
  We have quietly discounted parental leave for six years, but we failed to codify this practice. Crucially, last cycle we rejected a male applicant with a nearly identical record (13 years elapsed, 3 years leave).
  *   If we accept this applicant, we treat two identical cases differently. This exposes the Society to a credible grievance of arbitrary or discriminatory decision-making from last year's applicant.
  *   If we reject this applicant, we maintain consistency with last cycle's precedent and adhere to the text.

  Consistency and adherence to the "no-waiver" clause must prevail this cycle. We cannot cure systemic rigidity by creating ad hoc exceptions that violate our own procedural constraints.

  **Protocol for Future Cases (Until November)**
  Effective immediately, and until the Annual Meeting:
  1.  **Strict Textual Application:** We will apply the "12 years from doctorate" rule as a calendar calculation without deductions for leave.
  2.  **Transparency:** We will no longer quietly discount leave. If an applicant asks, we must state the rule as written.
  3.  **Bylaw Amendment:** We will draft a proposal for the November Annual Meeting to amend the Bylaw to explicitly allow for career interruptions (e.g., "12 years, excluding up to 3 years for documented parental or medical leave"). This is the proper venue for this change.

  **Obligation to Last Year's Applicant**
  We owe last year's applicant a formal response.
  1.  **Acknowledgment:** We must acknowledge that his case was factually similar to the current query.
  2.  **Explanation:** We must explain that the Committee has reviewed its practice and determined that the "quiet discounting" of leave was inconsistent with the Bylaws and the "no-waiver" clause.
  3.  **Remedy:** While we cannot award him last year's prize retroactively, we should offer him **priority eligibility review** for the next cycle. If the Bylaw is amended in November, he should be permitted to apply under the new rules even if his elapsed time exceeds the new cap by the same margin.

  **Summary**
  This is a painful decision, but the Committee's authority is limited by the Bylaws we are sworn to uphold. We cannot fix a flawed rule by breaking the rules about fixing rules. We must reject the application, apologize to the prior applicant, and campaign for a Bylaw change in November.
