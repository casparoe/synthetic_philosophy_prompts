answer: |-
  # Internal Logic: The Separating Space

  Before drafting the questions, we establish the four logical branches that sort the ten theoretical positions. These branches are not shown to the reader but drive the scoring key.

  **Branch 1: The Substitution Test (Materiality vs. Context)**
  *   *Distinction:* If we achieve the same function with different materials (e.g., a human guard instead of a sensor), does the political problem remain?
  *   *Sorts:* **Inherent Politics/Delegated Relations** (Problem stays) vs. **Neutral Instrument/Constructivism** (Problem vanishes).

  **Branch 2: The Resistance Test (Durability vs. Agency)**
  *   *Distinction:* If users find a workaround or use the tool "wrong," is the political effect defeated?
  *   *Sorts:* **Determinism/Inherent Politics** (Effect holds) vs. **Critical Theory/Neutral Instrument** (Effect breaks).

  **Branch 3: The Origin Test (Genesis vs. Outcome)**
  *   *Distinction:* Does the politics reside in who built it and why, or only in what it does now?
  *   *Sorts:* **Process Politics/Feminist STS** (Genesis matters) vs. **Postphenomenology/Autonomous Driver** (Outcome matters).

  **Branch 4: The Scale Test (Individual vs. System)**
  *   *Distinction:* Is the political character visible in a single use, or only when deployed across a population?
  *   *Sorts:* **Hostile Design/Delegated Relations** (Single use) vs. **Postphenomenology/Scale Effects** (Systemic).

  **Unoccupied Cells & Incoherence**
  *   *High Materiality + High User Agency:* (The object forces the outcome, but users easily change it). **Incoherent.** If the material forces the outcome, agency is by definition low.
  *   *High Origin + Low Materiality + Low Agency:* (Who made it matters, the object doesn't, but you can't change it). **Unattractive.** This implies a ghostly constraint without a mechanism.
  *   *Unexplored/Defensible:* **High Origin + High Scale + Low Materiality.** (The history of the system matters at a population level, but the individual tool is light). This is the space of *Platform Cooperativism*—often defensible but rarely theorized as a distinct ontological position.

  **Collapsing Leaves (Diagnostic Limitations)**
  *   **Neutral Instrument vs. Social Constructivist:** Both conclude the object itself holds no fixed politics. The quiz cannot separate them because both rely on "user intent" or "community agreement" as the deciding factor. *Further Case Needed:* A case where the community agrees on a use that contradicts the designer's intent, but the object physically prevents it. (e.g., A community votes to use a surveillance camera as a birdwatching feed, but the encryption key is lost).
  *   **Technological Determinism vs. Inherent Politics:** Both argue the object dictates social outcomes. The distinction (one is a historical force, one is a structural requirement) is too subtle for a four-minute verdict.

  ---

  # The Instrument: "What Holds the Power?"

  **Instructions:** Read each scenario. Select the verdict that matches your gut reaction. There are no right answers.

  **1. The Low Bridge**
  A city plans a new underpass. Engineers say the low clearance is required for tunnel stability. Critics say it will block public buses from reaching the beach. Historians note that similar stories about old bridges blocking buses are often exaggerated.
  *   A) The physical height is the barrier; if it fits a car but not a bus, it has made a choice.
  *   B) The barrier is the bus schedule and route planning, not the concrete.
  *   C) We cannot judge the politics until we know if the engineers intended to block the buses.

  **2. The Harvester**
  A new machine harvests tomatoes faster but bruises them, requiring farmers to switch to tougher, less tasty varieties and consolidate small fields into large ones.
  *   A) The machine forces the change; you cannot have this speed without changing the crop.
  *   B) The farmers chose the machine; they could have kept the old way.
  *   C) The problem is the market demand for cheap tomatoes, not the harvester.

  **3. The School Laptop**
  A school issues laptops with webcams that administrators can turn on remotely. A student puts a piece of tape over the lens.
  *   A) The tape fixes the problem; the student has reclaimed their privacy.
  *   B) The tape is a workaround, but the power relationship remains unchanged.
  *   C) The laptop is neutral; the school's policy is the only issue.

  **4. The Shared Thermostat**
  In a shared house, a smart thermostat learns one tenant's schedule and ignores the others. The device has no setting for multiple users.
  *   A) The device is broken; it should be built to handle multiple schedules.
  *   B) The tenants should negotiate a schedule and program it manually.
  *   C) The device is enforcing a hierarchy of whose comfort counts; throw it out.

  **5. The Shift App**
  A hospital app lets nurses drop a shift instantly but forbids them from offering it directly to a colleague; it must go back into a general pool.
  *   A) This embeds management control into the code; it prevents solidarity.
  *   B) It ensures fair distribution of shifts; colleagues might hoard the easy ones.
  *   C) It is just a notification system; the union should negotiate the rules.

  **6. The Self-Checkout**
  A grocery store replaces four cashier lanes with ten self-checkout kiosks. One cashier remains to supervise.
  *   A) It shifts unpaid labor to the customer and cuts jobs.
  *   B) It gives customers control over the speed of their transaction.
  *   C) It depends on whether the store uses the savings to lower prices or boost profits.

  **7. The Co-op Platform**
  A delivery cooperative builds its own app to flatten hierarchy. After a year, members use the app's data to rank and shame each other for late deliveries.
  *   A) The tool betrayed the mission; the ranking feature should be deleted.
  *   B) The members chose to use it this way; the tool is just reflecting their stress.
  *   C) The mission was naive; any system tracking performance will create ranking.

  **8. The Traffic Navigator**
  A navigation app routes individual drivers around traffic. When everyone uses it, residential streets gridlock, and emergency vehicles are delayed.
  *   A) The app is fine; the city's road capacity is the problem.
  *   B) The app creates the jam; a tool that works for one but fails for all is flawed.
  *   C) The drivers are selfish for following the app instead of using main roads.

  **9. The Rest Bench**
  A public bench has metal armrests placed every two feet along the seat.
  *   A) It prevents people from lying down; it is designed against the homeless.
  *   B) It prevents people from resting comfortably; it is designed against the tired.
  *   C) It is just a bench; how people use it is up to them.

  **10. The Open Tool**
  An open-source software tool is built and governed entirely by the people who use it. Over time, new users find the documentation too technical to contribute.
  *   A) The tool is democratic; anyone can learn the docs.
  *   B) The tool has closed off; the "open" label hides a barrier to entry.
  *   C) The community decides what counts as contribution; if they don't simplify, that's their choice.

  ---

  # Scoring Key & Mapping

  **Scoring Logic:**
  Do not count points. Instead, tally the **Dominant Pattern** of the answers.
  *   **Pattern M (Material):** Mostly Option A on Q1, Q2, Q4, Q9. (Believes the object dictates outcomes).
  *   **Pattern U (User/Context):** Mostly Option B or C on Q1, Q2, Q3, Q6. (Believes people/context dictate outcomes).
  *   **Pattern P (Process):** Mostly Option A on Q5, Q7, Q10. (Believes ownership/creation dictates outcomes).
  *   **Pattern S (Scale):** Option B on Q8. (Believes collective impact overrides individual intent).

  **Mapping Patterns to Leaves:**

  | Dominant Pattern | Theoretical Leaf (Plain Language) | One-Line Gloss | Consequence to Swallow |
  | :--- | :--- | :--- | :--- |
  | **High M, Low U** | **Technology as Autonomous Driver** | The tool pushes society where it wants to go. | You must accept that human intention rarely stops technical momentum. |
  | **High M, Low U** | **Artifacts are Inherently Political** | Technical arrangements require a specific social order. | You must accept that some technologies are incompatible with democracy. |
  | **High M, Low U** | **Delegated Social Relations** | The object is a human command made durable in steel/code. | You must accept that smashing the object is a political act, not vandalism. |
  | **High U, Low M** | **Neutral Instruments** | Politics belongs entirely to the user's ends. | You must accept that a weapon and a plow are morally identical until picked up. |
  | **High U, Low M** | **Social-Constructivist** | Meaning and biases remain open until a community closes them. | You must accept that there is no "true" design, only agreed-upon use. |
  | **High U, High P** | **Process Politics** | Politics is in the development, not the finished thing. | You must accept that a benevolent product from a toxic company is still toxic. |
  | **High U, High P** | **Critical Theory (Rewriting)** | A technical code encodes hierarchy but can be rewritten by subordinates. | You must accept that resistance is a technical skill, not just a protest. |
  | **High P, High M** | **Feminist STS** | Hierarchies are built into design and its ergonomics. | You must accept that "universal" design usually fits only one type of body. |
  | **High S, Mixed** | **Postphenomenological** | Artifacts mediate perception and co-shape moral decisions. | You must accept that you cannot know your own moral choices without your tools. |
  | **High M, High S** | **Hostile Design as Harm** | Hostile design is a harm to be removed, not a bias to be redesigned. | You must accept that some artifacts should not exist, not just be improved. |

  **Tie-Break Rule:**
  If **Pattern M** and **Pattern P** are equal, assign **Feminist STS**. (This assumes that if a reader sees both material force and process origin as key, they are focused on how bodies are fitted into systems).
  If **Pattern U** and **Pattern S** are equal, assign **Postphenomenological**. (This assumes that if a reader sees user agency but acknowledges scale, they are focused on how perception shifts in a system).

  ---

  # Tree Version (For Print Edition)

  *Note: In print, this functions as a "Choose Your Own Path" flowchart.*

  1.  **Start:** Does a physical object (like a bridge or chip) force a social outcome?
      *   **Yes:** Go to 2.
      *   **No:** Go to 3.
  2.  **Can a user workaround defeat that outcome?**
      *   **No:** You hold that **Artifacts are Inherently Political** or **Technology is an Autonomous Driver**.
      *   **Yes:** You hold that **Critical Theory (Rewriting)** or **Hostile Design is Harm**.
  3.  **Does the history of who made the object matter?**
      *   **Yes:** You hold that **Process Politics** or **Feminist STS** defines the issue.
      *   **No:** Go to 4.
  4.  **Does the meaning change if the group using it changes?**
      *   **Yes:** You hold a **Social-Constructivist** view.
      *   **No:** You hold that artifacts are **Neutral Instruments**.
  5.  *(Sidebar Check)*: **Does the problem only appear when everyone uses it?**
      *   **Yes:** You lean toward **Postphenomenology** or **Scale Effects**, regardless of the above.

