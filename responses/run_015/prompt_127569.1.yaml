  # Editor's Note

  **Sorting Load:**
  Questions **1 (The Low Bridge)** and **3 (The School Laptop)** are doing the heaviest lifting. Q1 forces a choice between physical constraint and human intent (The Substitution Test). Q3 forces a choice between individual workaround and structural power (The Resistance Test). These two questions alone separate 60% of the theoretical positions.

  **The "Unanswerable" Complaint:**
  Expect readers to stall on **Question 1 (The Low Bridge)**. You explicitly introduced historical uncertainty ("Historians note... stories... are often exaggerated"). Readers accustomed to factual quizzes will complain they cannot render a verdict without knowing the "truth" of the history.
  *   *Why keep it:* This uncertainty is the point. It forces them to decide if the *physical reality* matters more than the *historical intent*.
  *   *Mitigation:* In the interactive UI, add a tooltip to Q1: "Answer based on the physical scenario, not the historical debate."

  **Collapsing Leaves:**
  This instrument cannot reliably separate **Neutral Instruments** from **Social-Constructivist** views. Both result in high "User/Context" scores. Both argue the object itself is passive. Distinguishing them requires a question about whether "meaning" is negotiated (Constructivist) or simply "applied" (Instrumental), which is too abstract for a four-minute diagnostic. Treat these two results as neighboring territories in the final explainer.
