      *(Refining the Difference Principle)*: In Rawls, inequality helps the worst off *materially*. In skew theory, inequality helps the subordinate *genetically* (indirectly) or via queueing (future directly). I need to make sure this distinction is clear.

      *(Refining the Veil)*: In Rawls, the veil is lifted eventually. In EvoBio, the phenotype is expressed eventually. The "ignorance" is temporal.

  9.  **Final Polish:** Organize into clear sections. Ensure the "Residue Report" and "ESS Niche" sections are distinct and punchy. (Proceed to generate output).

