prompt: |-
  I'm an evolutionary biologist who mostly thinks about cooperative breeding and reproductive skew in social mammals, so my intution runs on kin selection, local resource competition, and information asymmetry in foraging groups. Can you restate Rawls's veil of ignorance and the difference principle in that vocabulary? I mean actually translate the original position, maximin reasoning, and the difference principle into terms like cooperative groups, hidden phenotypes, reproductive suppression, and resource partitioning -- not just slap anologies on top. For each component say what survives intact, what gets warped to fit, and what can't be said at all in my framewrk. Then the residue report: does the leftover stuff mean Rawls is assuming something about individual rational choice that doesn't exist in social species, or does it mean evolutionary biology is missing a normative layer? Also there's this niche idea I ran into -- that the veil is basically a hidden-phenotype ESS where agents don't know their own reproductive rank -- does that map onto Rawls cleanly, or does it break when you try to derive justice from evolutionary stability?
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **User Persona:** Evolutionary biologist specializing in cooperative breeding, reproductive skew, social mammals.
      *   **Core Concepts:** Kin selection, local resource competition (LRC), information asymmetry, cooperative groups, hidden phenotypes, reproductive suppression, resource partitioning.
      *   **Task:** Translate John Rawls's *A Theory of Justice* concepts (Veil of Ignorance, Original Position, Maximin Reasoning, Difference Principle) into this specific evolutionary biology vocabulary.
      *   **Constraints:** Do not just use analogies; actually translate the mechanics. For each component, specify what survives, what gets warped, and what is inexpressible.
      *   **Residue Report:** Analyze the leftover discrepancies. Does it imply Rawls assumes individual rational choice absent in social species, or that EvoBio misses a normative layer?
      *   **Specific Query:** Evaluate the "Veil as Hidden-Phenotype ESS" hypothesis. Does it map cleanly, or does it break when deriving justice from evolutionary stability?

  2.  **Deconstruct Rawls's Core Concepts:**
      *   *Original Position:* Hypothetical state where agents choose principles of justice.
      *   *Veil of Ignorance:* Agents don't know their specific place in society (class, talent, conception of the good).
      *   *Maximin Reasoning:* Choose the arrangement where the worst-off position is as good as possible (risk aversion).
      *   *Difference Principle:* Inequalities are only justified if they benefit the least advantaged.

  3.  **Translate into Evolutionary Biology Vocabulary:**

      *   *Original Position $\rightarrow$ Founding Event / Group Formation:* The moment a cooperative group coalesces or a lineage commits to a social structure.
      *   *Veil of Ignorance $\rightarrow$ Pre-Differentiation State / Uncertain Phenotypic Expression:* Individuals enter the group before reproductive roles (breeder vs. helper) or resource access ranks are determined. They know the *distribution* of phenotypes/ranks but not their own specific realization.
      *   *Maximin Reasoning $\rightarrow$ Risk-Skew Minimization:* Evolutionary strategy that minimizes the probability of zero fitness (reproductive suppression/death). It's not about "utility" but about inclusive fitness floor.
      *   *Difference Principle $\rightarrow$ Skew Tolerance Condition:* Reproductive skew (inequality) is evolutionarily stable only if the subordinates (least advantaged) gain higher inclusive fitness than they would in solitary breeding (the baseline).

  4.  **Drafting the Translation (Iterative Process):**

      *   *Veil:* In Rawls, it's epistemic. In EvoBio, it's ontic/probabilistic. You don't know if you'll be the alpha or the beta *yet*.
      *   *Maximin:* Rawls uses rational choice under uncertainty. EvoBio uses selection pressure against extinction. The "worst case" is 0 fitness.
      *   *Difference Principle:* Rawls says inequality must help the poor. EvoBio says skew must help the helper (via kin selection or future inheritance).

      *   *Critique of the Translation:*
          *   *Survives:* The structural logic of stabilizing cooperation despite asymmetry.
          *   *Warped:* "Choice" becomes "Selection." "Justice" becomes "Stability." "Rights" become "Fitness Payoffs."
          *   *Inexpressible:* Normativity. Evolution describes what *is* stable, not what *ought* to be. Rawls is prescriptive; EvoBio is descriptive.

  5.  **Addressing the Residue Report:**
      *   *Rational Choice vs. Selection:* Rawls assumes agents can reason and commit. Evolution assumes genes/phenotypes are selected over time. The "agreement" in Rawls is a one-time rational act; in EvoBio, it's a dynamic equilibrium.
      *   *Normative Layer:* EvoBio lacks "ought." It can explain why a system persists, not why it's *fair*. Rawls is explicitly about fairness.
      *   *Conclusion:* The residue suggests Rawls relies on a capacity for abstract commitment that biological agents lack, *but* it also suggests EvoBio describes the *constraints* within which any normative system must operate to be stable.

  6.  **Addressing the "Hidden-Phenotype ESS" Idea:**
      *   *The Idea:* The Veil is an Evolutionarily Stable Strategy (ESS) where agents don't know their rank.
      *   *Analysis:*
          *   *Mapping:* Yes, uncertain rank leads to risk-averse strategies (supporting the group).
          *   *Breaking Point:* ESS explains stability, not *justice*. An ESS can be tyrannical (e.g., eusociality where workers are sterile). Rawls requires the worst-off to *benefit*. In eusociality, the worst-off (workers) have zero direct fitness. They only gain via kin selection. Rawls focuses on primary goods for *individuals*, not gene propagation.
          *   *Deriving Justice:* You cannot derive "ought" from "is stable." A slave society can be an ESS. Rawls requires moral agency.

  7.  **Refining the Tone:**
