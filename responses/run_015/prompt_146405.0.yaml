answer: |-
  This is a rigorous translation task. We are mapping a deontological liberal political framework onto a descriptive, selection-based biological framework. The goal is to see if the *structure* of Rawls's argument holds when "rational agents" are replaced by "selection units" and "justice" is replaced by "evolutionary stability."

  Here is the translation of Rawls's *A Theory of Justice* into the vocabulary of cooperative breeding, reproductive skew, and life-history theory.

  ---

  ### 1. The Original Position $\rightarrow$ The Pre-Differentiation Cohort
  **Rawls:** A hypothetical state where free and equal persons agree on principles of social organization.
  **EvoBio Translation:** The developmental window prior to reproductive role differentiation (e.g., pre-pubertal group members before dominance hierarchies crystallize or dispersal decisions are made).

  *   **What Survives:** The structural necessity of a "decision point" before asymmetry is locked in. In both cases, the rules of engagement must be set before the players know their specific hand.
  *   **What Gets Warped:** "Agreement" becomes "Developmental Plasticity." There is no negotiation; there is a reaction norm. The "principles" are not chosen but are the phenotypic strategies encoded by selection acting on the lineage's history of group formation.
  *   **What Can't Be Said:** *Agency.* Rawls assumes agents can commit to a principle. In social mammals, individuals cannot commit to a skew rule; they can only enact conditional strategies (e.g., "if I lose the fight, I help"). The "contract" is enforced by ecological constraints (LRC), not moral commitment.

  ### 2. The Veil of Ignorance $\rightarrow$ Uncertain Phenotypic Realization
  **Rawls:** Parties do not know their place in society, class, natural assets, or conception of the good.
  **EvoBio Translation:** Individuals enter the cooperative group without knowledge of their future reproductive rank, competitive ability (RHP), or dispersal options. They know the *probability distribution* of ranks (e.g., 1 breeder, 4 helpers) but not their specific realization within that distribution.

  *   **What Survives:** The epistemic constraint required to generate risk-averse strategies. If an individual knew it would be the dominant, it would maximize skew. If it knew it would be subordinate, it would disperse. Ignorance forces a strategy that hedges against the worst outcome.
  *   **What Gets Warped:** Rawls's veil is epistemic (you *could* know, but aren't allowed). In biology, this is often ontic or temporal (the information *does not exist yet* because rank is determined by contest or queueing).
  *   **What Can't Be Said:** *Conception of the Good.* Rawls allows agents to value different life plans. In skew theory, the "good" is fixed: inclusive fitness. There is no pluralism of ends, only variance in means.

  ### 3. Maximin Reasoning $\rightarrow$ Fitness-Floor Minimization
  **Rawls:** Choose the arrangement where the maximum of the minimum payoffs is secured. Avoid catastrophic loss.
  **EvoBio Translation:** Selection favors strategies that minimize the probability of zero fitness (reproductive suppression without indirect benefits or death via dispersal). The group structure stabilizes when the subordinate's expected inclusive fitness (direct + indirect) exceeds the solitary baseline.

  *   **What Survives:** The logic of risk aversion under uncertainty. Both frameworks reject utilitarian averaging (maximizing total group output) if it risks destroying the bottom tier.
  *   **What Gets Warped:** "Rationality" becomes "Selection Pressure." Maximin is a cognitive heuristic in Rawls; in biology, it is a filter. Strategies that don't meet the fitness floor are purged, not rejected by reason.
  *   **What Can't Be Said:** *Rights.* Rawls's maximin protects basic liberties. Biology protects only fitness pathways. If reproductive suppression yields high indirect fitness (high relatedness), biology permits total suppression of direct reproduction. Rawls would forbid "slavery" even if it maximized the slave's indirect genetic interests; biology does not make that distinction.

  ### 4. The Difference Principle $\rightarrow$ The Skew Tolerance Condition
  **Rawls:** Social and economic inequalities are to be arranged so that they are to the greatest benefit of the least advantaged.
  **EvoBio Translation:** Reproductive skew (inequality) is evolutionarily stable only if the presence of the dominant (and the resulting inequality) increases the subordinate's inclusive fitness compared to the solitary option (the "baseline").

  *   **What Survives:** The justification of inequality. Inequality is not inherently unstable; it is unstable only if it harms the bottom tier below their alternative baseline.
  *   **What Gets Warped:** "Benefit" in Rawls is primary goods (liberty, income). "Benefit" in skew theory is $\Delta$Fitness. A subordinate might have less food (resource partitioning) but higher survival. Rawls requires the worst-off to have *more* than they would in equality; Biology only requires they have *more* than they would in solitude.
  *   **What Can't Be Says:** *Fairness.* The Difference Principle is normative. The Skew Tolerance Condition is descriptive. A coercive skew (where the dominant punishes subordinates to stay) can satisfy the Skew Condition if the ecological constraints are high enough, even if the subordinate is "miserable." Rawls forbids coercion that undermines self-respect; biology permits coercion if it stabilizes the gene.

  ---

  ### Residue Report: Rational Choice vs. Normative Layer

  When we strip the Rawlsian framework down to these biological components, two distinct residues remain.

  **1. The Assumption of Individual Rational Choice (Rawls's Excess)**
  Rawls assumes a unitary agent capable of abstracting itself from its own phenotype to choose principles. In social mammals, the "individual" is often a vehicle for genes, and "choice" is a proximate mechanism for ultimate strategies.
  *   **The Mismatch:** Rawls requires the agents to *stay* at the table. In biology, if the Skew Tolerance Condition fails, the agent *leaves* (disperses). Rawls's Original Position assumes a closed society; evolutionary models assume open boundaries where exit is the ultimate veto.
  *   **Implication:** Rawls assumes a capacity for commitment that exceeds biological enforcement mechanisms. He assumes agents will honor the contract even after the Veil lifts and they find themselves advantaged. Biology predicts defection if the ESS shifts. Rawls is assuming a *moral psychology* that evolution has not necessarily selected for.

  **2. The Missing Normative Layer (EvoBio's Deficit)**
  Evolutionary biology can explain why a cooperative group is *stable*, but it cannot explain why it is *just*.
  *   **The Mismatch:** An eusocial colony satisfies the Skew Tolerance Condition (workers gain via kin selection). It is an ESS. But it violates Rawls's First Principle (equal liberty) and arguably the Difference Principle (workers have no life plan of their own).
  *   **Implication:** Evolutionary biology is missing the normative layer. It treats the "least advantaged" as a fitness variable, not a rights-bearer. If the residue is that biology allows for stable "tyrannies" (high skew, low subordinate welfare) that Rawls forbids, then Rawls is adding a constraint *against* what is evolutionarily stable. He is asserting that some ESSs are morally impermissible.

  **Verdict:** The residue suggests **Rawls is assuming a normative layer that does not exist in social species.** He is not describing an ESS; he is prescribing a constraint on ESSs. He argues that stability achieved through coercion or unacceptable sacrifice of the bottom tier is illegitimate, even if it persists. Biology says "it persists." Rawls says "it shouldn't."

  ---

  ### The Niche Idea: Veil as Hidden-Phenotype ESS

  You asked if the Veil maps cleanly onto a Hidden-Phenotype ESS where agents don't know their reproductive rank, or if it breaks when deriving justice from stability.

  **It breaks.** Here is the mechanistic failure point:

  **1. Stability $\neq$ Justice (The Is-Ought Gap)**
  A Hidden-Phenotype ESS explains why individuals *tolerate* uncertainty. If I don't know if I'll be Alpha or Beta, I might support a group rule that limits Alpha power, just in case I become Alpha.
  *   **The Break:** This leads to risk mitigation, not justice. An ESS can stabilize around a "Lottery of Tyranny." If the winner takes all, but the lottery is fair (equal chance to win), it is an ESS under uncertainty. Rawls explicitly rejects this. The Veil of Ignorance is designed to prevent you from gambling with basic liberties, even if the odds are equal. Rawls's Maximin forbids the "Lottery of Tyranny"; Evolutionary Maximin (Risk Sensitivity) might accept it if the expected payoff is high enough.

  **2. The Duration of Ignorance**
  *   **Rawls:** The Veil lifts. You know who you are. But you are bound by the principles chosen *behind* the veil.
  *   **EvoBio:** The Phenotype Reveals. You know you are a helper. If the "contract" (skew rule) no longer benefits you, selection favors breaking it (cheating, dispersal, infanticide).
  *   **The Break:** Rawls relies on the *binding nature* of the agreement post-veil. Biology relies on *continuous incentive compatibility*. You cannot derive "Justice" (a binding obligation despite changed incentives) from "Stability" (a state that persists only as long as incentives align).

  **3. The Unit of Selection**
  *   **Rawls:** The individual is the unit of moral worth.
  *   **EvoBio:** The gene (or lineage) is the unit of selection.
  *   **The Break:** In a Hidden-Phenotype ESS, an individual might accept a role with zero direct fitness (sterile worker) because it boosts the lineage. Rawls's Difference Principle requires that the *individual* in the worst-off position benefits. If the "worst-off" is a sterile worker, Rawls's framework collapses because that individual has no "primary goods" to maximize. You cannot derive Rawlsian Justice from an ESS that sacrifices the individual for the lineage.

  **Conclusion on the Niche Idea:**
  The Veil as a Hidden-Phenotype ESS is a powerful explanation for the *origin* of risk-averse social contracts. It explains why subordinates don't immediately revolt. However, it cannot derive **Justice**. It derives **Prudence**.

  Rawls uses the Veil to derive *principles that bind the advantaged* even when they know they are advantaged. Evolutionary stability only binds the advantaged as long as they remain threatened by the disadvantages. Once the Alpha knows it is the Alpha and has secured power, the "Veil" is gone, and the ESS shifts to coercion. Rawls demands the Alpha remain bound by the rules chosen in ignorance. Biology predicts the Alpha will exploit the knowledge asymmetry.

  Therefore, the mapping breaks at the transition from **formation** (behind the veil) to **maintenance** (in society). Evolution explains the formation of the group; Rawls is trying to legislate the maintenance of fairness within it. You cannot get the latter from the former without importing a normative premise that selection does not provide.
