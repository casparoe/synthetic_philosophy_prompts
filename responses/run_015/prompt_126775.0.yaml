answer: |-
  You are hitting on the exact fault line where philosophy of language gets messy. Your intuitions feel scattered because you are oscillating between **psychological intent** (what's in the speaker's head) and **normative commitment** (what the speaker is on the hook for).

  There is a unifying principle here, but it requires splitting Grice's definition into two distinct checks. If you apply these two checks to your five cases, the scatter should resolve into a pattern.

  ### The Unifying Principle: The Reflexive Intention + Cancellability Test

  Grice's core definition of *non-natural meaning* (speaker meaning) is reflexive:
  > **Speaker S means something by utterance X if S intends X to produce an effect in Audience A, by means of A recognizing that intention.**

  To sort your cases, you need to run them through two filters:
  1.  **The Overt Intention Filter:** Did the speaker intend for the audience to *know* that this was the intended meaning? (Distinguishes communication from manipulation).
  2.  **The Cancellability Filter:** Can the speaker add "but not [implication]" without contradicting themselves? (Distinguishes implicature from literal assertion).

  Here is how this principle sorts your lineup.

  ---

  ### 1. The Roommate (Trash)
  *   **Verdict:** Full Speaker Meaning (Indirect Speech Act).
  *   **Analysis:** She intends you to take out the trash. Crucially, she intends for you to *know* that she intends this. She isn't trying to trick you; she is relying on your recognition of her need to motivate you.
  *   **Cancellability:** She could say, "The trash is full, but I'm not asking you to take it out, I'm just noting a fact." It's logically consistent, but pragmatically weird.
  *   **Why it fits:** The intention is overt. You are not "reading it in"; she put it there for you to find.

  ### 2. The Politician ("Mistakes were made")
  *   **Verdict:** Insinuation (Not strict Implicature).
  *   **Analysis:** This is where your gut feels scattered. The politician wants you to believe "It wasn't my fault," but they **do not** want you to recognize that *they intend you to believe that*. If they admitted that intention, the strategy fails.
  *   **The Principle:** Because the intention is *hidden*, this falls outside strict Gricean speaker meaning. It is **misleading** rather than **meaning**. They are *causing* a belief, not *communicating* it.
  *   **Vague vs. Lying:** This predicts that the politician is not technically lying (the assertion "mistakes were made" is true) but is being **deceptive**. Because the intention wasn't overt, they can deny the implication ("I never said it wasn't my fault") without logical contradiction, though they suffer a social cost.

  ### 3. Sarcasm ("Great job")
  *   **Verdict:** Speaker Meaning (via Flouting).
  *   **Analysis:** The literal meaning is "dead weight" only in the sense that it is obviously false. The speaker *intends* you to see that it is obviously false, and thereby infer the opposite.
  *   **The Principle:** The intention is overt. The speaker *wants* you to recognize the irony. If you took it literally, the speaker would say, "I was being sarcastic!"
  *   **Cancellability:** "Great job... I mean, actually, great job." This creates a pragmatic contradiction (Moore's Paradox style), confirming the sarcastic meaning was the intended speaker meaning.

  ### 4. The "Literally" Case
  *   **Verdict:** Divergence between Timeless Meaning and Occasion Meaning.
  *   **Analysis:** Here is the clash.
      *   **Standard Convention:** "Literally" = actually.
      *   **Speaker Intent:** "Literally" = intensifier.
  *   **The Principle:** Speaker meaning follows the **recognized intent**.
      *   If the audience knows the speaker uses "literally" as an intensifier (e.g., Gen Z slang context), then the speaker meaning *is* the intensifier. The intention is recognized; communication succeeds.
      *   If the audience thinks the speaker is using the standard definition, communication **fails**. The audience attributes a false belief to the speaker ("They think they actually died").
  *   **Prediction:** Speaker meaning is not solipsistic. It requires *uptake*. If the speaker genuinely thinks "literally" means "figuratively," their *psychological* intent is the intensifier, but the *communicative* meaning fails unless the audience decodes that specific idiolect.

  ### 5. "Implicature Debt" (Commitment)
  *   **Verdict:** Real phenomenon, usually called **Commitment**.
  *   **Analysis:** You didn't make this up; it aligns with work by Robert Brandom and others on "scorekeeping."
  *   **The Principle:** You can cancel an implicature logically (Cancellability), but you cannot always cancel it **normatively** (Debt).
  *   **The Test:** If the intention was **overt** (like the Roommate), you incur a debt. Denying it makes you uncooperative/dishonest. If the intention was **covert** (like the Politician), you incur less debt. Denying it makes you slippery, but not necessarily a liar.

  ---

  ### Specific Predictions for Your Hard Cases

  #### The "Literally" Prediction
  The principle predicts that **Speaker Meaning is a collaborative achievement, not a mental state.**
  If the speaker says "I literally died" intending an intensifier, but the audience takes it literally, there is **no successful speaker meaning** regarding the death. There is only a failed attempt. However, if the usage is common enough in their community that the audience *recognizes* the intent to use it as an intensifier, then the speaker meaning *is* the intensifier, regardless of the dictionary. Grice prioritizes the specific occasion over the timeless convention if the recognition is mutual.

  #### The Politician Prediction (Vague vs. Lying)
  The principle predicts a specific category of deception called **Bullshitting** (in the Harry Frankfurt sense) or **Strategic Ambiguity**.
  *   **Lying:** Asserting P when you believe not-P. (The politician is not doing this; mistakes *were* made).
  *   **Implicating:** Overtly intending the audience to infer Q. (The politician avoids this to maintain deniability).
  *   **The Verdict:** The politician is **misleading**, not lying.
  *   **The "Debt":** Because they hid the intention, they can deny the implicature ("I never said I wasn't responsible") without being logically inconsistent. However, they breach the **Maxim of Manner** (be perspicuous). The "debt" is paid in trust, not truth-value.

  ### Summary of the Principle
  To stop your gut verdicts from scattering, ask this single question:
  **"Does the speaker want me to know that this is what they want me to think?"**

  *   **Yes:** It is Speaker Meaning (Roommate, Sarcasm). You are entitled to hold them to it.
  *   **No:** It is Manipulation/Insinuation (Politician). They are hiding the intent to avoid the debt.
  *   **Mismatched:** It is Communication Failure or Dialect shift ("Literally"). Meaning depends on whether the audience recognizes the intent.

  Your intuition about "Implicature Debt" is the key: **Debt attaches to Overt Intentions, not just inferred consequences.** If the speaker hides the intention, they try to dodge the debt. If they make it overt, they owe you the truth of the implication.
