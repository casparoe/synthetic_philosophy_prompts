prompt: |-
  okay so i'm trying to wrap my head around Grice's stuff on implicature and speaker meaning, specifically where the speaker's actual intent ends and the audience's recovery starts. i keep running into cases and my gut verdicts feel kind of scattered, and i want to know if there's a principle hiding behind them or if i'm just being inconsistient.

  here's the lineup. one: my roommate says "the trash is getting full" and i take it out — i think she meant me to do it, that's the indirect speech act. two: a politician says "mistakes were made" and dodges blame; i feel like there's an implicature of non-responsibility, but i'm not sure if they actually intended it or if the audience just reads it in. three: sarcasm — if i spill coffee and my friend says "great job," i think the speaker meaning is actually the opposite, and the literal meaning is kind of dead weight. four: someone uses "literally" to mean "figuratively" ("i literally died") and genuinely thinks that's correct — does speaker meaning follow their mental dictionary or the standard one? and five: there's this notion of "implicature debt" i came across (maybe i made it up?) where the speaker is on the hook for the implication in a different way than for the assertion, which might matter for whether you can deny an implicature without being dishonest.

  so is there a single principle — maybe about cancellability, or about whether the speaker can coherantly deny it — that sorts these? and specifically, what does it predict for the "literally" case and for whether that politician is being vague versus actually lying?
