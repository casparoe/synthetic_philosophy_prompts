          1.  Added an entropy term (boldness) to the Brier score: $I(c) = (c-v)^2 + \lambda H(c)$.
          2.  Claims this vindicates mild overconfidence (reporting 0.723 when credence is 0.7).
          3.  Claims accuracy-first is arbitrary because you can rig scoring rules to vindicate any norm.
          4.  Claims strict propriety assumes the conclusion (that your credences should minimize expected inaccuracy from their own perspective).
          5.  Claims accuracy-first is either pragmatism or empty.
