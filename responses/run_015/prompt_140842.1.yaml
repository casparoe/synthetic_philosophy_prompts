      *   *Point 2: The Reflective Stability/Propriety Argument.* This is the big one. Propriety isn't a stipulation; it's a consistency requirement. If I have credence $c$, I expect $c$ to be the best estimate of truth. If the scoring rule says $b \neq c$ minimizes expected score, the rule implies my credence $c$ is *inaccurate* about what minimizes inaccuracy.
