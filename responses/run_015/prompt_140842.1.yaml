      *   *Section 1: The Definition of Accuracy.* Distinguish accuracy (matching world) from utility (accuracy + boldness). The user is conflating them.
      *   *Section 2: The Stability Problem (The "Why Propriety?" answer).* Explain why propriety isn't circular. It's about the relationship between belief and expectation. If the rule pushes you away from your belief, it creates a tension. If you update to follow the rule, you enter a feedback loop toward certainty (0 or 1). This is the "death of evidence."
