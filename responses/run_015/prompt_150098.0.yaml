prompt: |-
  I'm putting together the wall-text and audio script for a small rotating museum exibit on 19th-century port labor disputes, and I've been going back and forth with a friend who's in a grad historiography course. She keeps saying our captions are either pretending to be pure Ranke-style "show it as it actually happened" or they're sneaking in Hayden White-style emplotment without admitting it, and Carr's point about selection being driven by present concerns just makes it worse. I need something I can actually use, not more seminar talk. Can you write me a reusable decision procedure—like a checklist or flowchart in words—that a non-academic staffer can run on each panel or caption in about five minutes? It should be grounded in Ranke's idea of describing events as they actually occurred versus Carr's argument that historians necessarily select and arrange facts according to present questions versus White's claim that every narrative forces events into an underlying plot form like romance, tragedy, comedy, or satire. But I want it operationalized: the exact sequence of questions to ask, what counts as a passing answer at each gate, where the procedure says "rewrite this," where it says "flag for the curator because this is values not facts," and where it just stops because Ranke and White genuinely conflict and there's no procedural fix.

  The procedure needs to handle hard cases my team will actually face: a panel that quotes a striker's letter but frames the strike as a tragic defeat even though the letter itself never mentions defeat; a caption that leaves out that the police chief was also a factory shareholder because "it complicates the story"; and a timeline entry that calls a negotiation "inevitably collapsing," which is interpretation dressed up as chronology. Then apply it to three worked examples: one where the procedure forces us to drop a dramatic framing we'll miss, one where it lets through a selection that looks like bias but is defensible under Carr's framework, and one where it hits the "get the curator" wall. Also tell me explicitly what the procedure can't catch—maybe stuff about visual layout, visitor prior knowledge, or audio tone? And please write the answer in American English; it's definatley not an academic paper, I'm just trying to stop my coworker from rolling her eyes at me every time we hang a new panel.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **Goal:** Create a reusable decision procedure (checklist/flowchart in words) for museum staff to evaluate wall-text and audio scripts for a 19th-century port labor disputes exhibit.
      *   **Time Limit:** Must be runnable by a non-academic staffer in about 5 minutes per panel/caption.
      *   **Theoretical Grounding:** Must incorporate/improve upon the tension between:
          *   Leopold von Ranke (*wie es eigentlich gewesen* / "as it actually happened" / objectivity).
          *   E.H. Carr (Selection is inevitable; history is driven by present questions/facts are selected based on interpretation).
          *   Hayden White (Emplotment; narratives force events into literary structures like tragedy/comedy).
      *   **Operationalization:** Needs specific questions, pass/fail criteria, "rewrite" triggers, "flag for curator" triggers, and "stop/no fix" triggers.
      *   **Hard Cases to Handle:**
          *   Framing a strike as tragic when primary sources don't say so.
          *   Omitting conflict of interest (police chief = shareholder) for simplicity.
          *   Teleological language ("inevitably collapsing").
      *   **Deliverables:**
          *   The Procedure (Step-by-Step).
          *   Three Worked Examples (Drop framing, Defend selection, Flag for curator).
          *   Limitations (What the procedure *can't* catch).
          *   Tone: American English, practical, non-academic (stop the eye-rolling).

  2.  **Deconstruct the Theoretical Tension for Practical Use:**
      *   *Ranke:* Don't lie. Stick to evidence. Don't invent.
      *   *Carr:* You *have* to choose what to include. Admit *why* you chose it (or at least ensure the choice serves the exhibit's thesis, not just convenience).
      *   *White:* Don't force a story arc (Tragedy/Comedy) onto messy history unless the evidence supports that arc.
      *   *Synthesis for Museum Staff:* "Be honest about evidence (Ranke), be intentional about choices (Carr), and avoid forcing a movie plot onto real people (White)."

  3.  **Drafting the Procedure (The "5-Minute Gatekeeper"):**
      *   *Structure:* Needs to be linear. Step 1 -> Step 2 -> Step 3.
      *   *Step 1: The Ranke Check (Evidence).* Does the text claim something the sources don't support? (Catches "inevitably collapsing").
      *   *Step 2: The Carr Check (Selection).* Why is this fact in or out? Is it for clarity or to hide complexity? (Catches "police chief shareholder").
      *   *Step 3: The White Check (Emplotment).* Are we forcing a genre? (Catches "tragic defeat").
      *   *Decision Points:* Pass, Rewrite, Flag.
      *   *The "No Fix" Zone:* Acknowledge where theory breaks down (e.g., when evidence *is* ambiguous).

  4.  **Developing the Worked Examples:**
      *   *Example 1 (Drop Dramatic Framing):* The "Tragic Defeat" strike. Needs to fail the White check.
      *   *Example 2 (Defend Selection):* Leaving out minor details to focus on the main argument. Needs to pass the Carr check (intentional selection vs. hiding).
      *   *Example 3 (Flag for Curator):* A deep interpretive conflict where the text implies a moral judgment that isn't factual.

  5.  **Identifying Limitations:**
      *   Visuals (images imply things text doesn't).
      *   Tone of voice (audio).
      *   Visitor baggage (what they bring in).
      *   Spatial arrangement (what comes first/last).

  6.  **Refining Tone:**
      *   Avoid jargon where possible. Instead of "epistemological uncertainty," use "we can't know for sure."
      *   Keep it punchy. Use bolding for actions.
      *   Address the "friend in grad school" dynamic lightly but firmly focus on the *work*.

  7.  **Review against Constraints:**
      *   *American English?* Yes.
      *   *5 minutes?* The checklist needs to be short enough.
      *   *Ranke/Carr/White integrated?* Yes, mapped to specific steps.
      *   *Hard cases covered?* Yes.

  8.  **Self-Correction/Polishing during drafting:**
      *   *Critique:* Is Step 2 too vague?
      *   *Fix:* Make the Carr question specific: "If we added this fact back in, does it break the story or just complicate it?"
      *   *Critique:* Is the "No Fix" section clear?
      *   *Fix:* Explicitly state that if Ranke (facts) and White (story) fight, the Curator decides, not the staffer.
      *   *Critique:* Make sure I don't sound like I'm dismissing the grad friend. Acknowledge she's right theoretically, but this is for *practice*.

  9.  **Final Polish:** Check formatting for readability (bolding, lists). Ensure the "Stop" condition is clear. (Proceed to generate output).

  *(Self-Correction Note: Make sure to explicitly mention the "police chief" and "inevitably collapsing" examples in the procedure or examples section as requested.)* -> *I will incorporate these specific scenarios into the Worked Examples section to ensure direct responsiveness.*

