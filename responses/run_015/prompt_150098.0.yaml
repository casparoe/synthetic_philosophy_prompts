answer: |-
  Here is a practical decision procedure designed for your team. It translates the historiography into operational checks without requiring a degree in theory.

  ### The "5-Minute Gatekeeper" Procedure
  **Purpose:** To catch historical overreach, hidden bias, and forced storytelling in exhibit text before it goes to print.
  **Time:** Approx. 5 minutes per panel/script.
  **Who:** Any staff member writing or editing copy.

  ---

  #### Step 1: The Ranke Check (Evidence vs. Claim)
  *Goal: Ensure we aren't stating opinions as facts.*

  **Ask:** Look at every adjective and verb that describes an outcome or motivation (e.g., "violent," "greedy," "failed," "inevitable"). Can I point to a specific document, quote, or record in our files that proves this specific word?

  *   **PASS:** The text says "The strike ended on Nov 4," and the police log confirms it.
  *   **REWRITE:** The text says the negotiation **"inevitably collapsed."**
      *   *Why:* "Inevitably" is a prophecy, not a fact. No document says "this was going to fail."
      *   *Fix:* Change to "The negotiation ended without agreement."
  *   **FLAG FOR CURATOR:** The evidence is contradictory (e.g., one letter says peace was made, another says fighting continued).
      *   *Action:* Do not pick a side. Mark this for the Curator to decide how to present the ambiguity.

  #### Step 2: The Carr Check (Selection & Omission)
  *Goal: Ensure we are leaving things out for clarity, not to hide complexity.*

  **Ask:** Identify one major fact or person you *left out* of this panel. Why is it missing?
  *   **Option A:** It is irrelevant to the specific point of this panel (e.g., omitting a striker's childhood to focus on the wage demand).
  *   **Option B:** It makes the story messy or undermines the "hero/villain" dynamic we set up.

  *   **PASS (Option A):** We omitted the police chief's stock ownership because this specific panel is about the *timeline of the walkout*, and that detail belongs on the "Power Structures" panel next door. (This is defensible selection).
  *   **REWRITE (Option B):** We omitted the police chief's stock ownership because **"it complicates the story."**
      *   *Why:* Carr argues selection is inevitable, but hiding conflict to make a cleaner narrative is misleading.
      *   *Fix:* Add a clause: "Police intervened. (Note: Records show the Chief held shares in the dock company)." Or, move the panel to a section where that conflict is the focus.
  *   **FLAG FOR CURATOR:** You realize that including the truth makes the exhibit's main thesis look weak.
      *   *Action:* Stop. This is an institutional values decision, not a copyediting one.

  #### Step 3: The White Check (Emplotment)
  *Goal: Ensure we aren't forcing real life into a movie genre.*

  **Ask:** Read the text aloud. Does it sound like a Tragedy (noble defeat), a Romance (heroic victory), or a Satire (corrupt fools)? Now look at the primary source quotes you used. Do the *people involved* describe it that way, or is that *our* voice?

  *   **PASS:** The text says "Workers returned to the docks. Some expressed hope, others resentment." (Matches mixed reality).
  *   **REWRITE:** The panel quotes a striker's letter about "holding the line," but the caption frames the strike as a **"tragic defeat."**
      *   *Why:* The letter doesn't mention defeat; it mentions solidarity. You are imposing a "Tragedy" plot on a "Romance" source.
      *   *Fix:* Align the frame with the source. "Workers viewed the action as a necessary stand, despite the outcome."
  *   **STOP (No Procedural Fix):** The facts support a Tragedy, but the community wants a Romance (or vice versa).
      *   *Action:* Ranke (facts) and White (story) are now in direct conflict. The procedure cannot solve this. Send to Curator.

  ---

  ### Worked Examples
  Here is how the procedure handles the hard cases you mentioned.

  #### Example 1: The "Tragic Defeat" (Forces a Rewrite)
  *   **The Text:** A panel shows a quote from a striker saying, "We will not move until justice is done." The caption reads: *"Despite their courage, the strike was a tragic defeat for the labor movement."*
  *   **Running the Procedure:**
      *   *Step 1 (Ranke):* Pass. The strike did end without demands met.
      *   *Step 2 (Carr):* Pass. No major facts omitted.
      *   *Step 3 (White):* **FAIL.** The source text is defiant ("justice is done"), but the caption imposes a "Tragedy" genre ("tragic defeat"). The striker does not admit defeat; the historian is assigning it.
  *   **Outcome:** **REWRITE.** Change caption to: *"The strike ended without meeting demands, though participants maintained their stance on justice."* This respects the source's voice over the historian's plot.

  #### Example 2: The "Complicating Fact" (Passes under Carr)
  *   **The Text:** A timeline entry reads: *"1889: Police arrive to disperse the crowd."* It does not mention the Police Chief owned factory stock.
  *   **Running the Procedure:**
      *   *Step 1 (Ranke):* Pass. Police did arrive.
      *   *Step 2 (Carr):* **Review.** Why was the stock ownership left out?
          *   *Reasoning:* This panel is strictly a *chronology* of the day's events. The financial conflict is explored in depth on Panel 4 ("Who Owned the Port?"). Including it here clutters the timeline.
      *   *Step 3 (White):* Pass. No genre forcing.
  *   **Outcome:** **PASS.** Under Carr's framework, selection is necessary. As long as the fact isn't *hidden* from the exhibit entirely, but rather placed where it is most relevant, this is defensible curation, not bias.

  #### Example 3: The "Moral Judgment" (Hits the Curator Wall)
  *   **The Text:** *"The union leaders, blinded by ideology, refused a fair offer."*
  *   **Running the Procedure:**
      *   *Step 1 (Ranke):* **FAIL/FLAG.** "Blinded by ideology" is a psychological diagnosis, not a fact. "Fair offer" is a moral judgment.
      *   *Step 2 (Carr):* **FLAG.** This selection of words frames the Union as the obstacle.
      *   *Step 3 (White):* **FLAG.** This frames the story as a Satire (foolish leaders).
  *   **Outcome:** **FLAG FOR CURATOR.** This isn't just a wording tweak. The text is taking a side in a 100-year-old dispute. A staffer cannot fix this with a thesaurus. The Curator must decide if the exhibit takes a stance on who was "right."

  ---

  ### What This Procedure Cannot Catch
  Be honest with your team: this checklist protects the *text*, not the *experience*. You still need to watch out for:

  1.  **Visual Tone:** A caption might be neutral, but if you pair it with a photo of a screaming riot cop and no photo of the workers, the *image* creates the "Tragedy" or "Satire" emplotment (White) even if the text doesn't.
  2.  **Audio Inflection:** In the audio script, a pause or a drop in pitch can turn a fact into a judgment. ("The workers... *returned*... to the docks.")
  3.  **Visitor Baggage:** Carr says history is about the present. A visitor today might read "Labor Dispute" through the lens of modern politics regardless of what you write. You cannot procedure-proof against what visitors bring in their heads.
  4.  **Spatial Flow:** If you place the "Violence" panel before the "Causes" panel, you create a bias that the workers were aggressors. The checklist works on panels, not room layout.

  ### How to Use This With Your Friend
  When your grad school friend asks about the captions, hand her this sheet. Tell her: *"We aren't solving the epistemological crisis of history here. We are using Ranke to check facts, Carr to justify omissions, and White to check our tone. If the procedure flags it, we fix it. If it hits the 'Curator Wall,' that's where your seminar talk actually applies."*

  It acknowledges her theory but keeps your exhibit on schedule.
