          *   Audit trail (file note).
          *   Escalation paths (Head of Supplier Relationships for Withdraw/Escalate, Legal for Law).
          *   Must address 5 specific theoretical pain points (Is it a PD?, Identity/Continuity, Endpoints, Ambiguous Defections, Reputation/Audience).
          *   Must apply to 3 specific cases (A, B, C).
          *   Must include limitations/metrics for success.
      *   **Tone:** Professional, rigorous, actionable, theoretically grounded but practical.

  2.  **Theoretical Foundation & Translation:**

      *   *Prisoner's Dilemma (PD) vs. Assurance Game:* In a PD, defection is dominant regardless of the other's move. In an Assurance Game (Stag Hunt), cooperation is best *if* the other cooperates.
          *   *Translation:* Check incentives. If their best move aligns with ours without enforcement, it's not a PD.
      *   *Shadow of the Future (Continuity):* Cooperation evolves if the probability of future interaction ($w$) is high enough relative to the temptation to defect ($T$) vs. reward ($R$).
          *   *Translation:* Estimate "Continuity Score" (Person + Firm + Contract).
      *   *Endpoints:* Known ends reduce the shadow of the future (Backward Induction). Secret ends create asymmetry.
          *   *Translation:* Adjust Continuity Score based on known/unknown termination.
      *   *Noise/Ambiguity:* Real world has errors. Tit-for-Tat fails with noise. Generous Tit-for-Tat or Win-Stay/Lose-Shift is better.
          *   *Translation:* "Forgiveness Rule" based on cost of error.
      *   *Reputation:* Indirect reciprocity.
          *   *Translation:* Audience multiplier.

  3.  **Drafting the Procedure (The "Cooperation Protocol"):**

      *   *Structure:* Flowchart style logic, step-by-step.
      *   *Step 1: Game Type.* Is it actually a dilemma?
          *   Test: Do interests align naturally? (Assurance vs. PD).
      *   *Step 2: Continuity (Shadow of the Future).*
          *   Test: Person stability + Firm stability + Contract duration.
      *   *Step 3: Endpoints.*
          *   Test: Known end? Who knows?
      *   *Step 4: Noise/Ambiguity.*
          *   Test: Verifiability + Cost of False Positive/Negative.
      *   *Step 5: Audience.*
          *   Test: Do others watch?
      *   *Output:* Mapping scores to Stances.

      *Refining the "One Page" constraint:* I need to be concise. I will create a "Scorecard" format.

      *Addressing the 5 Pain Points explicitly:*
      1.  *PD vs. Assurance:* Look at the payoff matrix implicitly. If they gain more by keeping us happy than squeezing us, it's Assurance.
      2.  *Identity:* Split "Firm Continuity" vs. "Counterparty Continuity."
      3.  *Endpoints:* Distinguish "Hard Stop" vs. "Soft Stop" and "Symmetric" vs. "Asymmetric" knowledge.
      4.  *Ambiguity:* Use a "Cost of Error" matrix.
      5.  *Audience:* Simple Yes/No multiplier.

  4.  **Developing the Scoring/Decision Logic:**

      *   *Inputs:*
          *   Game Type (PD or Assurance).
          *   Continuity Score (0-10).
          *   Endpoint Adjustment.
          *   Noise Level (Low/High).
          *   Audience (Yes/No).
      *   *Outputs:*
          *   If Assurance -> Cooperate Unconditionally (mostly).
          *   If PD + High Continuity -> Conditional + Forgiveness.
