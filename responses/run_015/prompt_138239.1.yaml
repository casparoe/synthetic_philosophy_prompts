      *   *Refining Case C:* Shared allocation. One inflates. This is a "Public Goods" problem among distributors. For us, it's about enforcement.
      *   *Decision:* I will classify Case A as **Not a Prisoner's Dilemma** (It is a Contract Interpretation/Assurance Game). The "defection" is a disagreement on terms, not a strategic choice to exploit cooperation.
      *   *Decision:* I will classify Case B as the **Unpleasant Answer**. Theory dictates we cannot cooperate on an 18-month investment with a 5-month horizon. We must decline.

