          *   *Decision:* I will argue Case C is *not* a Prisoner's Dilemma between Us and Supplier. It's a Principal-Agent problem or a monitoring issue. Or I will argue Case B is not a PD because the incentives are misaligned due to the secret endpoint (it's a "Lemon Market" setup).
