answer: |-
  # The Cooperation Protocol (v1.0)

  **Purpose:** To standardize decisions on supplier cooperation vs. protection using game-theoretic principles.
  **Time:** 15 Minutes. **Owner:** Buyer. **Escalation:** Head of Supplier Relationships (HoSR) for *Withdraw/Escalate*; Legal for *Contract/Law*.
  **File Note Requirement:** Every run must save a "Cooperation Memo" citing the Test ID that triggered the outcome.

  ---

  ### STEP 1: GAME TYPE (Is this a Prisoner's Dilemma?)
  *Theory: In a Prisoner's Dilemma (PD), defection pays regardless of the other's move. In an Assurance Game, cooperation pays only if mutual.*
  **Test:** Look at the counterparty's incentive *if we cooperate*.
  *   **Q1:** If we grant the favour/waiver, does the supplier gain *more* value by continuing to perform well than by exploiting us?
      *   **Yes:** This is an **Assurance Game**. Interests align. → **Stance: Cooperate Unconditionally.** (Stop. File Note: "Test 1-A: Assurance Game").
      *   **No:** If they gain more by taking the money/running, it is a **PD**. → **Proceed to Step 2.**
      *   **Unclear/Contract Dispute:** If the issue is interpreting a clause (e.g., price index) rather than strategic choice, this is **Legal/Compliance**. → **Escalate to Legal.** (Stop. File Note: "Test 1-B: Legal Ambiguity").

  ### STEP 2: CONTINUITY & IDENTITY (The Shadow of the Future)
  *Theory: Cooperation evolves only if the probability of future interaction ($w$) is high enough to outweigh the temptation to defect.*
  **Test:** Estimate the **Continuity Score (0-10)**.
  *   **Firm Stability (0-5):** 5 = Strategic partner/Long contract. 0 = Spot buy/Commodity.
  *   **Counterparty Stability (0-5):** 5 = Same decision-maker >2 yrs + stable incentives. 0 = New hire/High turnover/Quarterly bonus only.
  *   **Total Score:** \_\_\_\_
  *   **Adjustment:** If Counterparty Stability < 2, reduce Total Score by 2 points (Individual incentives override firm strategy).

  ### STEP 3: ENDPOINTS (The Backward Induction Risk)
  *Theory: Known ends unravel cooperation. Asymmetric knowledge (we know, they don't) creates reputation risk.*
  **Test:** Check termination horizon.
  *   **Q1:** Is there a hard end date < 12 months?
      *   **No:** Proceed to Step 4.
      *   **Yes:** Who knows?
          *   **Both Know:** Cooperation is irrational. → **Stance: Reduce Exposure.** (Stop. File Note: "Test 3-A: Mutual Endgame").
          *   **Only We Know:** Defecting now saves money but burns reputation if revealed later. → **Escalate to HoSR.** (Stop. File Note: "Test 3-B: Asymmetric Endgame").

  ### STEP 4: NOISE & AMBIGUITY (The Forgiveness Rule)
  *Theory: In noisy environments, strict reciprocity (Tit-for-Tat) triggers feuds. Generous strategies survive.*
  **Test:** Assess the "Defection."
  *   **Q1:** Is the suspected defection verifiable? (Yes/No)
  *   **Q2:** Cost of Error: Is it worse to (A) Accept a defection or (B) Punish a mistake?
      *   **If Verifiable + Cost (A) > Cost (B):** → **Stance: Cooperate Conditionally (Strict).** (Demand remedy).
      *   **If Unverifiable OR Cost (B) > Cost (A):** → **Stance: Cooperate Conditionally + Forgiveness.** (Absorb first instance, warn, punish second).
      *   **If We Defected:** Apply same rule. If accidental, disclose and remedy immediately to signal reliability.

  ### STEP 5: AUDIENCE (Reputation Effects)
  *Theory: Indirect reciprocity. Defection is costlier if witnessed by future partners.*
  **Test:**
  *   **Q1:** Do other suppliers/distributors know about this deal or share resources (e.g., allocation pools)?
      *   **No:** Proceed to Decision Matrix.
      *   **Yes:** This action sets a market precedent.
      *   **Action:** Upgrade Stance severity by one level (e.g., Conditional → Reduce Exposure) *unless* cooperation signals strength (e.g., paying a valid invoice promptly). → **Escalate to HoSR if upgrade leads to Withdraw/Escalate.**

  ---

  ### DECISION MATRIX (Combine Steps 2-5)

  | Continuity Score | Endpoint Status | Noise Level | **Resulting Stance** | **Escalation?** |
  | :--- | :--- | :--- | :--- | :--- |
  | **High (8-10)** | Open / Unknown | Low | **Cooperate Conditionally + Forgiveness** | No |
  | **High (8-10)** | Open / Unknown | High | **Cooperate Conditionally + Forgiveness** | No |
  | **Med (4-7)** | Open / Unknown | Any | **Cooperate Conditionally (Strict)** | No |
  | **Low (0-3)** | Open / Unknown | Any | **Reduce Exposure & Watch** | No |
  | **Any** | **Known End (<12mo)** | Any | **Reduce Exposure** | No |
  | **Any** | **Asymmetric End** | Any | **Withdraw / Decline New Commit** | **Yes (HoSR)** |
  | **Any** | **Audience Present** | Any | **Escalate / Watch** | **Yes (HoSR)** |

  ---

  ### APPLICATION TO LIVE CASES

  #### Case A: Packaging Tray (Sole Source, Price Dispute, Secret Second Source)
  *   **Step 1 (Game Type):** **Not a Prisoner's Dilemma.** The supplier is invoking a contract clause. Whether it applies is a matter of interpretation, not strategic choice to exploit cooperation. If the clause applies, they are entitled; if not, they are in breach.
      *   *Diagnosis:* This is a **Legal/Assurance** issue, not a relationship dilemma. Using a reciprocity rule here manufactures conflict where a contract interpretation belongs.
      *   *Action:* **Escalate to Legal.** (File Note: "Test 1-B: Legal Ambiguity").
      *   *Secondary:* The secret second source qualification is an **Asymmetric Endpoint** (Step 3). If Legal says they are right, we pay. If they are wrong, we enforce. The second source is a risk mitigation strategy, not a negotiation tactic.

  #### Case B: Logistics Provider (Integration Investment, Secret Exit)
  *   **Step 1 (Game Type):** **Prisoner's Dilemma.** They invest hoping for long-term volume; we gain efficiency but plan to leave.
  *   **Step 2 (Continuity):** Firm High (5), Counterparty Med (3). Score: 8.
  *   **Step 3 (Endpoints):** **Asymmetric Endgame.** We exit in 5 months; ROI requires 18 months. They do not know.
      *   *Diagnosis:* Accepting this investment is a defection. We capture value they will never recoup.
      *   *Action:* **Withdraw from Cooperation (Decline Integration).**
      *   *Escalation:* **Yes (HoSR).** This requires your approval because it sacrifices short-term efficiency to prevent reputational defection and ethical breach.
      *   *Unpleasant Truth:* You must tell the business they cannot have the integration efficiency. Investing in a relationship you plan to terminate secretly is exploitative and risks industry blacklisting if the merger becomes public.

  #### Case C: Distributors (Shared Pool, Order Inflation)
  *   **Step 1 (Game Type):** **Prisoner's Dilemma (Tragedy of the Commons).** One defects (inflates) to gain share; if all defect, pool collapses.
  *   **Step 2 (Continuity):** High.
  *   **Step 3 (Endpoints):** Open.
  *   **Step 4 (Noise):** Verifiable (Audit), but Cost of Error (B) is High (Relationship damage).
  *   **Step 5 (Audience):** **Yes.** The four distributors know each other.
      *   *Diagnosis:* An audit is an escalation that signals distrust to the *whole group*, potentially triggering a run on the pool. However, allowing inflation rewards defection.
      *   *Action:* **Cooperate Conditionally + Forgiveness (with Audience Adjustment).** Do not audit immediately. Issue a general notice to *all four* regarding allocation integrity and audit rights (signaling capability without targeting). Cap the inflating distributor's next order to the historical average without citing cause.
      *   *Escalation:* **Yes (HoSR).** Because Audience is present, the communication strategy must be vetted to ensure it doesn't trigger a panic.

  ---

  ### LIMITATIONS & METRICS

  **Where this Procedure Will Misfire:**
  1.  **Existential Threats:** If a supplier faces bankruptcy, they will defect regardless of Continuity Score. The model assumes rational actors; desperate actors are unpredictable.
  2.  **Irrational Spite:** If a decision-maker feels personally slighted, they may defect even when it costs them (Ultimatum Game dynamics). The "Counterparty Stability" score attempts to catch this but cannot guarantee it.
  3.  **Exploitable by "Smart" Suppliers:** A sophisticated supplier who learns you use "Forgiveness Rules" may defect once every three cycles intentionally.
      *   *Mitigation:* Randomize audit schedules; do not publish this protocol.

  **What to Record for Audit (The "Cooperation Memo"):**
  1.  **Date & Buyer.**
  2.  **Game Type Determination:** (PD vs. Assurance vs. Legal).
  3.  **Continuity Score:** (Firm / Person / Total).
  4.  **Endpoint Flag:** (Open / Known / Asymmetric).
  5.  **Decision:** (One of the 6 Stances).
  6.  **Outcome (To be filled in 6 months):** Did the supplier reciprocate? Did the relationship survive?

  **Success Metrics (2-Year Review):**
  *   **Reduction in "Surprise" Disruptions:** Are we seeing fewer blow-ups like the predecessor's year?
  *   **Cost of Conflict:** Measure legal spend and expedited freight costs triggered by relationship breakdowns.
  *   **Decision Velocity:** Time from issue identification to stance decision.
  *   **Audit Compliance:** % of files with completed Cooperation Memos.

  **Final Warning:** This procedure is a **judgment aid**, not a substitute for judgment. If your gut says "Run" but the Score says "Cooperate," escalate to me. Game theory models incentives; it does not measure integrity.
