      *   Is the final line correct? Yes, "Verdict: ..."

  8.  **Self-Correction during drafting:** I initially thought about suggesting Rawls. But Rawls is about basic structure, not emergency triage. Luck Egalitarianism is closer. However, the "Sufficientarian" critique is better for the *limited fund* aspect. I need to make sure I don't solve the problem for the novelist; I need to give them the tools to keep the tension alive. The advice should highlight *where* the logic breaks, not fix it.

      *   *Correction on Children:* Ensure I emphasize that treating the household as a single moral agent is the flaw. The children are distinct moral patients.
      *   *Correction on Town Complicity:* Emphasize that the town *allowed* the unpermitted story to exist until the storm. Enforcement is a spectrum.

  9.  **Final Polish:** Check the flow and ensure the philosophical terms are explained clearly in context. (e.g., explaining "Luck Egalitarianism" simply). Ensure the "Verdict" is exactly one line.

