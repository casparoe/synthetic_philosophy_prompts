prompt: |-
  After years of renting, my partner and I purchased our first house last spring on a quiet, tree-lined block that we chose partly for its stability and sense of community. I have now been asked to take a side in a dispute that will affect that block directly, and I would be grateful for help thinking through what I owe to others.

  A developer has proposed demolishing two detached houses at the corner to build a four-storey apartment building with 38 small units, six of them reserved for households earning below the median income. Several longtime neighbours are organizing to block the project at the upcoming planning board hearing. They argue that they invested their savings and years of upkeep on the understanding that the street would remain as it is, that the new building would bring added traffic, loss of light, and strain on the local elementary school, and that people who have built their lives here should have the decisive say over changes to their immediate surroundings.

  Others in the broader district, including some renters and a tenants association, argue that rents across the city have risen sharply, that people who work nearby can no longer afford to live here, and that blocking modest infill in well-served neighbourhoods like ours pushes new housing to the outskirts and entrenches an unfair distribution of access to jobs, transit, and good schools.

  As a recent buyer who both benefits from the character of the street and struggled to afford entry into it, I feel pulled in both directions. Should I join the opposition, support the project, or abstain? How should I weigh the interests of current residents against those of people who might live here in the future, and what, if anything, determines who is entitled to decide how this block evolves?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the User and Situation:**
      *   **User:** Recent first-time homebuyer (purchased last spring).
      *   **Context:** Quiet, tree-lined block chosen for stability/community.
      *   **Conflict:** A developer wants to replace two detached houses with a 4-storey, 38-unit apartment building (6 affordable units).
      *   **Opposition (Neighbors):** Longtime residents. Arguments: Property value/stability expectations, traffic, light, school strain, local control ("we built our lives here").
      *   **Support (Broader District/Renters):** Housing affordability crisis, exclusionary zoning, access to jobs/transit/schools, regional equity.
      *   **User's Dilemma:** Feels pulled both ways. Benefits from current character but struggled to afford entry. Wants to know what they *owe* to others and how to weigh competing interests.
      *   **Core Question:** Should I oppose, support, or abstain? How to weigh current vs. future residents? Who decides?

  2.  **Deconstruct the Ethical Dimensions:**
      *   **Self-Interest vs. Common Good:** The user bought into a specific character. Protecting that protects their investment/quality of life. However, restricting supply exacerbates the city-wide housing crisis they also suffered from.
      *   **Expectations vs. Reality:** Neighbors argue "understanding that the street would remain as it is." Is there a moral right to static neighborhood character? Zoning laws change; cities evolve.
      *   **Localism vs. Regionalism:** Do immediate neighbors have veto power? Or does the broader community (city/region) have a stake in how land is used, especially regarding affordability and segregation?
      *   **Exclusion vs. Inclusion:** Blocking housing often maintains exclusivity (wealthy, often white, homeowners). Allowing it promotes diversity (renters, lower income, younger families).
      *   **Impact Assessment:** Traffic, light, schools vs. Housing supply, affordability, transit access.

  3.  **Evaluate the Options:**
      *   **Option 1: Join Opposition.** Aligns with immediate self-interest and neighborly solidarity. Risks contributing to housing scarcity and exclusion. Validates the idea that homeowners have veto power over city growth.
      *   **Option 2: Support Project.** Aligns with broader social justice and housing supply logic. Risks neighborly conflict, potential (though likely minor) impact on quality of life, and feeling like a "traitor" to the block.
      *   **Option 3: Abstain.** Safe, but arguably morally passive. Doesn't help resolve the tension.

  4.  **Develop a Framework for Decision Making:**
      *   Instead of giving a direct "Yes/No" (which is prescriptive and ignores nuance), provide a framework for the user to weigh the values.
      *   *Key Concept:* The "YIMBY" (Yes In My Backyard) vs. "NIMBY" (Not In My Backyard) debate.
      *   *Key Concept:* Property Rights vs. Social Responsibility.
      *   *Key Concept:* The nature of cities (dynamic vs. static).

  5.  **Drafting the Response - Section by Section:**

      *   **Empathy/Validation:** Acknowledge the difficulty. It's a classic ethical dilemma of modern urban life. Validate their feelings of conflict.
      *   **Deconstruct the Arguments:**
          *   *The Neighbors' Case:* Stability, investment, local impact. Acknowledge validity but question the "right to stasis."
          *   *The Pro-Housing Case:* Affordability, equity, regional need. Acknowledge validity but note local costs.
      *   **Ethical Frameworks:**
          *   *The Veil of Ignorance (Rawls):* If you didn't know if you'd be a homeowner or a renter, what rule would you want?
          *   *The Principle of Fairness:* You struggled to buy. Does denying others the chance to live here contradict your own experience?
          *   *The Nature of Ownership:* Does buying a house give you control over the *future* of the neighborhood, or just the *present* use of your lot?
      *   **Practical Considerations:**
          *   Is 4 storeys/38 units actually "modest infill" or a massive change? (Context matters).
          *   Are the concerns (traffic, schools) empirically supported or anecdotal?
      *   **Actionable Advice (The "How"):**
          *   If supporting: How to do it respectfully.
          *   If opposing: What concessions to ask for (mitigation).
          *   If abstaining: How to remain engaged without taking a side.
      *   **Conclusion:** Summarize the core tension. Emphasize that there is no perfect answer, but there is a more *reflective* one.

  6.  **Refining the Tone:**
      *   Must be non-judgmental.
      *   Avoid political buzzwords where possible, or explain them neutrally.
      *   Focus on *civic duty* and *ethical reasoning*.
      *   Highlight the specific detail: The user *also* struggled to afford entry. This is a crucial pivot point.

  7.  **Self-Correction/Nuance Check:**
      *   *Correction:* Don't assume the user *must* support the building. Some developments are genuinely bad. Focus on the *principle* of density vs. the *specifics* of this project.
      *   *Nuance:* Acknowledge that "community" is a real value, not just a code word for exclusion. Losing social fabric is a real cost.
      *   *Nuance:* The "6 affordable units" detail. Is that enough? It's a start, but tokenism is a risk.
      *   *Nuance:* The "school strain" argument. Often used as a proxy for "more kids we don't know," but sometimes legitimate if infrastructure is capped.

  8.  **Final Polish:** Organize with clear headings. Ensure the conclusion empowers the user to make their own choice based on clarified values. (This matches the generated output structure).

  **(Self-Correction during drafting):** I need to make sure I don't just lecture on YIMBYism. The user asked "what do I owe to others?" This is an ethical question. I need to address the *obligation* aspect.
  *   Obligation to neighbors? (Solidarity, respect).
  *   Obligation to city/society? (Equity, housing supply).
  *   Obligation to self? (Financial security, peace of mind).

  Let's structure the advice around these three obligations.

