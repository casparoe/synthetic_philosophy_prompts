answer: |-
  # Final Written Assessment: Formal Epistemology Seminar

  **Time Allowed:** 75 Minutes
  **Instructions:** Answer the following question. You may assume the Brier Score (sum of squared errors) as the measure of inaccuracy.

  ### Essay Question

  Consider an agent facing a partition $\{P, \neg P\}$. They currently hold a doxastic state $c_1$ where $c_1(P) = 0.7$, $c_1(\neg P) = 0.7$, and $c_1(P \lor \neg P) = 1.0$. An alternative available state $c_2$ assigns $0.4$ to $P$, $0.4$ to $\neg P$, and $1.0$ to the disjunction.

  Write an essay that addresses the following:
  1.  Reconstruct the accuracy-dominance argument for probabilism as applied to $c_1$ and $c_2$. Explain why an appeal to *expected* inaccuracy is insufficient to condemn $c_1$, whereas *actual* accuracy dominance succeeds.
  2.  Demonstrate numerically that both $c_1$ and $c_2$ are dominated by a coherent alternative.
  3.  Evaluate the force of two challenges: (i) that dominance provides no normative guidance unless the dominating state is accessible via rational revision, and (ii) that the argument relies on a non-neutral choice of scoring rule or risk attitude.

  ***

  ### Model Answer

  The accuracy-centered approach vindicates probabilism by arguing that incoherent credences are accuracy-dominated by coherent ones. In the stipulated case, both $c_1$ and $c_2$ violate the additivity axiom ($c(P) + c(\neg P) = 1$). $c_1$ sums to 1.4 (overconfidence), while $c_2$ sums to 0.8 (underconfidence).

  An appeal to *expected* inaccuracy cannot condemn $c_1$ from the agent's own perspective. Because the Brier score is a strictly proper scoring rule, any credence function uniquely minimizes its own expected inaccuracy. Thus, relative to the expectations generated by $c_1$, $c_1$ appears optimal. To show $c_1$ is irrational, we must bypass the agent's subjective weights and compare *actual* inaccuracy across all possible worlds. This is the dominance argument: a state is irrational if there exists an alternative that is strictly more accurate in every possible world.

  Using the Brier score ($\sum (v - c)^2$), we evaluate the states across worlds $w_P$ (where $P$ is true) and $w_{\neg P}$ (where $P$ is false). We ignore the tautology as both assign it 1.0 (zero error).
  At $w_P$:
  $c_1$ inaccuracy: $(1-0.7)^2 + (0-0.7)^2 = 0.09 + 0.49 = 0.58$.
  $c_2$ inaccuracy: $(1-0.4)^2 + (0-0.4)^2 = 0.36 + 0.16 = 0.52$.
  At $w_{\neg P}$:
  $c_1$ inaccuracy: $(0-0.7)^2 + (1-0.7)^2 = 0.58$.
  $c_2$ inaccuracy: $(0-0.4)^2 + (1-0.4)^2 = 0.52$.

  Consider the coherent state $c^*$ where $c^*(P) = 0.5$.
  At both worlds, $c^*$ inaccuracy: $(0.5)^2 + (0.5)^2 = 0.50$.
  Since $0.50 < 0.52 < 0.58$, $c^*$ strictly dominates both $c_1$ and $c_2$. While $c_2$ is *more* accurate than $c_1$, both are irrational compared to $c^*$. This establishes that coherence is a necessary condition for undominated accuracy.

  However, two challenges threaten this vindication. First, the accessibility objection argues that dominance alone is action-guiding only if the agent can rationally transition to the dominating state. If $c_1$ represents a deep-seated cognitive bias, the agent may lack the psychological capacity to adopt $c^*$ directly. If "ought implies can," the mere existence of $c^*$ does not condemn $c_1$ if $c^*$ is inaccessible. Proponents reply that epistemic rationality concerns the ideal state, not merely feasible transitions, though this risks making the norm too demanding.

  Second, the neutrality objection contends that dominance results depend on the chosen scoring rule. While the Brier score dominates in this case, other proper scoring rules might rank $c_1$ and $c_2$ differently regarding their distance from coherence. Furthermore, Joyce (1998) assumes risk-neutrality regarding accuracy. If an agent is risk-averse, they might prefer the "safer" error distribution of an incoherent state over a coherent one in specific contexts. Unless one can prove the Brier score is the *unique* legitimate measure of verisimilitude, the argument may presuppose the very epistemic values it seeks to vindicate.

  In conclusion, while the dominance argument successfully identifies $c_1$ and $c_2$ as suboptimal relative to $c^*$ using standard metrics, its normative force relies on assumptions about accessibility and the uniqueness of the Brier score that remain contested.

  ***

  ### Marking Scheme (Total: 25 Marks)

  **Analytical Moves (5 marks each)**

  1.  **Diagnosis of Incoherence:** Correctly identifies that both $c_1$ and $c_2$ violate additivity ($0.7+0.7 \neq 1$; $0.4+0.4 \neq 1$).
      *   *Excellent:* Explicitly notes $c_1$ is "overconfident" and $c_2$ "underconfident."
      *   *Competent:* States they are incoherent without characterizing the direction of error.
  2.  **EI vs. Dominance Distinction:** Explains that proper scoring rules make every function minimize its *own* expected inaccuracy, necessitating a world-by-world (actual) dominance comparison.
      *   *Excellent:* Clearly articulates why EI is subjective/circular in this context.
      *   *Competent:* States EI fails but offers a vague reason.
  3.  **Numerical Demonstration:** Correctly calculates Brier scores for $c_1$, $c_2$, and a coherent alternative (e.g., 0.5/0.5) to show dominance ($0.50 < 0.52 < 0.58$).
      *   *Excellent:* Calculations are explicit and error-free; identifies a coherent dominator.
      *   *Competent:* Attempts calculation but contains minor arithmetic errors or fails to identify a coherent dominator (e.g., only compares $c_1$ to $c_2$).
  4.  **Evaluation of Accessibility Challenge:** Discusses whether the agent must be able to move to the dominating state for the norm to apply.
      *   *Excellent:* Connects to "ought implies can" or transition costs.
      *   *Competent:* Merely restates the objection without evaluating its force.
  5.  **Evaluation of Neutrality/Rule Challenge:** Discusses dependence on the Brier score specifically or risk attitudes.
      *   *Excellent:* Mentions that different proper rules might yield different geometries or that risk-neutrality is assumed.
      *   *Competent:* Vaguely mentions "scoring rules matter" without specifics.

  **Performance Standards**

  *   **Excellent (21-25 marks):** Executes all 5 moves with precision. Numerical work is flawless. Objections are evaluated critically (e.g., offering a reply or weighing the objection's severity) rather than merely described. Structure is logical and concise.
  *   **Competent (13-20 marks):** Addresses all 5 moves but with limitations. May contain minor calculation errors, treat objections superficially (description only), or lack clarity on why Expected Inaccuracy fails.
  *   **Fail (0-12 marks):** Fails to address more than two moves, fundamentally misunderstands the dominance argument, or ignores the numerical case entirely.

  **Characteristic Errors**

  1.  **The "Relative Dominance" Error (-5 marks):** Arguing that the goal is to show $c_2$ dominates $c_1$.
      *   *Why it matters:* The prompt asks for the argument for *probabilism* (Coherence), not merely that one incoherent state is better than another. Both must be shown dominated by a *coherent* function.
  2.  **The "Expectation" Error (-5 marks):** Calculating Expected Inaccuracy (weighting worlds by credence) instead of Actual Inaccuracy for the dominance proof.
      *   *Why it matters:* This conflates the subjective justification (which fails for incoherence) with the objective dominance argument (which succeeds). It undermines the core philosophical point.
  3.  **The "Abstract Slogan" Error (-3 marks):** Discussing dominance and accuracy without using the provided numbers (0.7, 0.4, etc.).
      *   *Why it matters:* The assessment requires application of abstract ideas to the stipulated case. Generic essays demonstrate recall, not understanding.
