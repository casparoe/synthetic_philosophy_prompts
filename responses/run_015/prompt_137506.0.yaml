answer: |-
  Here is an audit of the "Clean Hands" analogy as applied to hypocritical blame.

  ### 1. The Correspondence Map

  To audit the analogy, we must distinguish between the structural roles in the legal doctrine and their purported counterparts in interpersonal blame.

  | Legal Role (Equity) | Putative Counterpart in Blame | Status of Counterpart |
  | :--- | :--- | :--- |
  | **Plaintiff** | The Blamer | **Genuine.** The one initiating the normative challenge. |
  | **Defendant** | The Blamee | **Genuine.** The one being challenged. |
  | **Court** | The Moral Community / Shared Normative Space | **Imported.** There is no central adjudicator in ordinary blame; there is only the interlocutors and perhaps an audience. |
  | **Cause of Action** | The Moral Norm Violated | **Genuine.** The standard against which the blamee is measured. |
  | **Transaction at Issue** | The Specific Act Blamed | **Imported/Strained.** Equity requires the *same* transaction; hypocrisy usually involves *similar* acts at *different* times. |
  | **Unclean Conduct** | The Blamer's Hypocrisy | **Genuine.** The blamer's own violation of the norm they invoke. |
  | **Remedy Sought** | Acknowledgment, Apology, Reform | **Partial.** These are outcomes, but not enforceable remedies. |
  | **Dismissal** | Rejection of Blame as Void/Ineffective | **Imported.** In law, dismissal is a ruling by authority. In blame, rejection is an act of defiance by the blamee. |

  **Audit Note:** The most significant importation is the **Court**. In equity, the court is a third-party authority with the power to grant or deny relief. In interpersonal blame, there is rarely a neutral third party with jurisdiction. The "dismissal" of blame is not a verdict handed down; it is a refusal to engage by the defendant. This shifts the power dynamic: in equity, the *judge* silences the plaintiff; in the blame analogy, the *defendant* claims the right to silence the plaintiff.

  ### 2. Disanalogies: Relevant vs. Irrelevant

  Not all differences between law and morality undermine the analogy. We must separate those that affect the *validity* of the blame from those that are merely procedural.

  **Irrelevant Disanalogies:**
  *   **Formality:** The lack of writs, filings, or robes does not affect the normative logic.
  *   **Enforceability:** That a court can seize assets while a blamer cannot does not determine whether the *claim* is valid, only whether it can be coerced.
  *   **Statute of Limitations:** Time limits in law do not map neatly to moral memory, but this doesn't impact the structural logic of standing.

  **Relevant Disanalogies (The Fault Lines):**
  *   **Jurisdiction vs. Standing:** A court has a duty to hear valid claims from qualified plaintiffs. A moral agent has no duty to accept blame from anyone. The "Clean Hands" doctrine is a bar to *equitable relief*, not a denial that a right was violated. In blame, if the "remedy" is barred, is the *communication* itself void? The analogy conflates the *right to complain* with the *power to sanction*.
  *   **The "Same Transaction" Constraint:** Equity bars relief only if the plaintiff's misconduct is in the *same transaction* as the suit. Hypocrisy often involves past or distinct acts. If Ada blames Bo for lying, but Ada lied last year (not in this instance), equity might not bar her. Yet we intuitively feel this is still hypocritical. The legal analogy is too narrow here.
  *   **The Audience:** Courts decide between parties. Blame is often performative for an audience. A "dismissal" by the blamee does not stop the audience from hearing the case. The legal analogy assumes a binary closed system; blame is often a public broadcast.
  *   **Universal Jurisdiction:** In law, if all plaintiffs have unclean hands, the court remains open for the next clean one. In morality, if *everyone* is a sinner (universal hypocrisy), the "Clean Hands" logic suggests the court closes entirely. This leads to moral nihilism, which the legal doctrine avoids.

  ### 3. Application to Cases

  Does the "Clean Hands" logic scale, or does it break under specific variations of fault?

  **(a) Ada (The Reformed Hypocrite)**
  *   *Scenario:* Ada took the money, renounced it, disclosed it, and campaigns against it.
  *   *Clean Hands Verdict:* In equity, if restitution is made and the misconduct is purged, hands may be considered "clean" enough for specific relief, especially if the current suit is to prevent future harm.
  *   *Blame Verdict:* Ada has **standing**. Her past fault does not void her current blame because she has aligned her current will with the norm.
  *   *Scaling:* The analogy holds here. The "uncleanliness" is remediable.

  **(b) Cara (The Complicit Investor)**
  *   *Scenario:* Cara didn't take money directly, but her pension is invested in the industry.
  *   *Clean Hands Verdict:* This turns on the definition of "Transaction." If the transaction is "taking a grant," her hands are clean. If the transaction is "benefiting from the industry," they are dirty. Equity is notoriously fact-specific here.
  *   *Blame Verdict:* Bo will argue her hands are dirty; Cara will argue she lacks agency over pension funds. The analogy **fractures**. In law, indirect benefit might not bar relief. In morality, structural complicity often undermines standing *more* than direct acts because it suggests a lack of moral seriousness.
  *   *Scaling:* The analogy is unstable. It requires a precise definition of "the matter complained of" that morality rarely possesses.

  **(c) Dan (The Worse Hypocrite)**
  *   *Scenario:* Dan blames Bo for taking money, while Dan takes *more* money (or does something worse).
  *   *Clean Hands Verdict:* Equity does not weigh degrees of dirtiness. If hands are unclean, relief is denied. It is binary.
  *   *Blame Verdict:* Intuitively, Dan's blame seems *more* void than Ada's, but the legal logic treats Dan the same as a minor violator. Furthermore, if "worse" hypocrisy voids blame, and everyone is imperfect, we approach a scenario where **no one has standing**.
  *   *Scaling:* The analogy fails here. If the "Clean Hands" doctrine is applied strictly to moral blame, and all humans violate moral norms, the "court" of morality loses jurisdiction over everyone. The legal system avoids this by limiting the doctrine to the *specific* transaction; morality cannot easily limit itself to specific transactions without fragmenting the moral agent.

  ### 4. What the Analogy Can Actually Carry

  The "Clean Hands" picture is often used to conflate three distinct claims. The audit reveals it supports them unevenly.

  1.  **That the hypocrite's judgment is likely mistaken or biased.**
      *   *Verdict:* **Silent.** The Clean Hands doctrine does not assume the plaintiff is *wrong* about the law or the facts. A plaintiff can be legally correct and still be denied relief. Similarly, a hypocrite can be right that Bo did wrong. The analogy does not support an epistemic critique.
  2.  **That the hypocrite is being unfair in blaming.**
      *   *Verdict:* **Strong.** This is the core of the equity maxim. It is unconscionable to ask for a benefit (moral high ground/compliance) while withholding it oneself. The analogy successfully captures the *affective* resistance we feel to hypocritical blame. It explains why the blamee feels *aggrieved* by the blaming, not just corrected.
  3.  **That the blame itself lacks the status it purports to have (is "void").**
      *   *Verdict:* **Weak.** In equity, the claim is not "void"; the *remedy* is withheld. The right still exists. If I steal your car, you have a right to its return. If you then steal my car (unclean hands), a court might deny you *equitable* relief (like specific performance), but it doesn't deny you own the car.
      *   *Application:* If the analogy holds, hypocritical blame is not *void*; it is merely **unenforceable** or **ineffective**. The norm still binds the blamee. The hypocrite is still right that the blamee did wrong. To say the blame is "void" is to overextend the analogy from "no remedy" to "no right."

  **Conclusion on Point 4:** The analogy proves that hypocritical blame is *unfair* and *pragmatically self-defeating*, but it does not prove that the content of the blame is invalid or that the blamee is excused from the norm.

  ### 5. A Better Analogy

  If the legal picture fails to capture the "voidness" (because it only captures "unenforceability"), we need an analogy that centers on **reciprocity** rather than **adjudication**.

  **Better Analogy: Blame as a Call to a Shared Practice (The "Game" Analogy)**
  Imagine blame not as a lawsuit, but as a move in a cooperative game (like a language or a sport). To make a move (e.g., calling a foul), one must be playing by the rules.
  *   **The Mechanism:** If a player consistently violates the rules they are invoking, they are not just "unfair"; they are opting out of the practice that gives their move meaning.
  *   **Why it fits:** It accounts for the *communicative* nature of blame. Blame demands a response (an account). Hypocrisy severs the channel of communication because the blamer has shown they do not treat the norm as binding.
  *   **Which conclusions it supports:**
      1.  *Bias:* Still silent.
      2.  *Unfairness:* Supported (it breaks the rules of engagement).
      3.  *Voidness:* **Supported.** In a game, a move made by someone who has forfeited their standing is not just "unfair"; it is **null**. It doesn't count.

  This analogy captures the intuition that hypocritical blame is "void" better than the legal one, because it grounds the validity of the speech act in the *relationship* between the speakers, not in a third-party court's discretion.

  ### 6. Reflection on Reasoning and the "Single Consideration"

  **Where my reasoning is most likely to be wrong:**
  I have assumed that "ordinary interpersonal blame" is distinct from "authoritative blame." However, much of our moral life is embedded in roles (parents, teachers, officers) that *do* carry quasi-legal authority. In those contexts, the "Clean Hands" analogy is not an import; it is a description of the actual institutional rules. By focusing on "ordinary" blame, I may have sidelined the cases where the analogy is literally true.

  **The Single Consideration:**
  The verdict on whether hypocritical blame is "void" turns entirely on this question:

  > **Is the validity of blame dependent on the *truth of the proposition* (that a norm was violated) or the *authority of the speaker* (their standing to invoke the norm)?**

  *   If blame is primarily a **truth-claim** ("You violated X"), then hypocrisy is irrelevant to its validity. The hypocrite is right, and the blame stands. The "Clean Hands" analogy fails.
  *   If blame is primarily a **speech-act of authority** ("I hold you to X"), then standing is constitutive. Without standing, the act misfires. The "Clean Hands" analogy (or the Game analogy) succeeds.

  If you can establish that blame is constitutively a **claim to authority** rather than a **report on a violation**, the "Clean Hands" picture becomes not just an analogy, but a structural description, and the hypocrite's blame is indeed void. If blame is merely a report, the analogy is a category error, and the hypocrite's blame remains valid, however rude.
