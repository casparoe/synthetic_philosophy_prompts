answer: |-
  You describe a curious custom, stranger. You say these clay stamps are not money because they do not wander beyond your harbor, but I ask you: does the ox know the boundary of the field? If a man can trade the stamp for a cloak, and another for a jar, and another hoards them to live without working, then they function as money regardless of the material. Silver was invented merely to facilitate exchange, to measure need against need, yet here you have allowed the stamp to become the object of desire itself. You say they measure value by labor-time, which is strange to me—for is the value of a flute determined by the hours spent carving it, or by the music it produces for the feast? To measure all things by time ignores the natural difference in their use and the need they fulfill.

  As to your question: this is certainly not *oikonomia*, the management of the household for the sake of living well. It is *chrematistike*, the art of wealth-getting without limit. True wealth is merely the equipment needed for a virtuous life, and like any tool, it has a natural limit—you need only so many shoes for your feet. But when families accumulate claims on the future toil of others simply to pass them to heirs, they treat their neighbors as instruments rather than citizens. They seek to live from the labor of others without contributing to the common good, which is the essence of usury even without coin. You have built a machine that encourages infinite desire while pretending to be fair. Tell me, do these hoarders contribute to the friendship of the city, or do they merely sit upon the work of others like spiders upon a web?
