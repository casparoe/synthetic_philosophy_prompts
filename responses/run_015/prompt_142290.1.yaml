      *   *Final Polish:* "Berkeley's 'Master Argument' challenges one to conceive of an object existing unconceived. Critics dismiss this as a trivial confusion between conceiving and existing. However, Berkeley already argues against abstract ideas and for the likeness principle. Explain what specific philosophical work the Master Argument performs that these other doctrines do not. In your answer, distinguish between failing to *imagine* a mind-independent object and the claim that such an object is *inconceivable* without contradiction. Finally, apply this distinction to a stratum of rock deposited before any finite mind existed: if the Master Argument is sound, what status does this rock have, and does the appeal to God's perception resolve a logical gap or merely an epistemic one?"

  3.  **Drafting the Model Answer:**

