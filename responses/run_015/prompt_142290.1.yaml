answer: |-
  1. The Question

  **Essay Question 3**

  Berkeley's 'Master Argument' challenges the reader to conceive of an object existing unconceived, claiming the attempt defeats itself. Critics dismiss this as a trivial confusion between conceiving and existing. However, Berkeley already argues against abstract ideas and for the likeness principle. Explain what specific philosophical work the Master Argument performs that these other doctrines do not. In your answer, distinguish between failing to *imagine* a mind-independent object and the claim that such an object is *inconceivable* without contradiction. Finally, apply this distinction to a stratum of rock deposited before any finite mind existed: if the Master Argument is sound, what status does this rock have, and does the appeal to God's perception resolve a logical gap or merely an epistemic one?

  ***

  2. Model Answer

  The stock objection to the Master Argument is that it proves only a psychological limitation: I cannot conceive of an unconceived object because the act of conceiving makes it conceived. If this were all Berkeley claimed, the argument would indeed be verbal trivia. However, within the system of the *Principles*, the Master Argument performs a specific function that the critique of abstraction and the likeness principle cannot achieve alone: it blocks the materialist's retreat to an unknowable substratum.

  The likeness principle establishes that an idea can resemble only an idea, preventing sensible qualities from mapping onto material substance. The critique of abstraction denies we can form a general notion of 'existence' separate from 'perceiving'. Yet, a determined opponent might concede these points while maintaining that there is an 'unknown somewhat' which causes ideas, even if we cannot describe its qualities or abstractly conceive its existence. The Master Argument targets this residual supposition. It is not merely that I cannot picture a tree without picturing myself seeing it; it is that the proposition 'the tree exists unconceived' contains a contradiction in terms. The work of the argument is semantic and modal, not merely imaginative. It asserts that 'existence' and 'perception' are analytically linked for sensible objects, such that asserting their separation is not false, but unintelligible.

  This requires distinguishing between imaginative failure and logical inconceivability. If Berkeley's point were only about the limits of human imagery, materialism would remain logically possible, merely inaccessible to our minds. But Berkeley insists the contradiction lies in the object's definition, not the subject's capacity. To suppose an object exists unconceived is to suppose it is perceived and not perceived simultaneously, since for sensible things, *esse* is *percipi*. The argument forces the realization that the materialist is not positing a hidden reality, but uttering nonsense.

  This distinction dictates the status of the prehistoric rock. Consider a stratum of rock laid down before any finite mind existed. If the Master Argument establishes only an imaginative limit, we might say the rock existed but we cannot conceive of it. But if the argument establishes logical inconceivability, then a rock existing absolutely unconceived is a contradiction. It cannot have 'existed' in a materialist sense. For the rock to be real, it must be perceived. Since no finite mind perceived it at the time of deposition, its reality depends entirely on its being perceived by an infinite mind.

  Here, the appeal to God is not a patch to fix an epistemic hole (i.e., 'how do we know about the rock?'), but a condition for logical coherence. Without God, the proposition 'the rock existed unconceived' is contradictory. With God, the proposition becomes 'the rock existed unperceived by finite minds but perceived by God.' This preserves the reality of the past without admitting mind-independent matter. If one removes the appeal to God while retaining the Master Argument's conclusion, the rock vanishes into nothingness, not just into ignorance. Therefore, the Master Argument is not dispensable ornament; it closes the door on the 'unknown somewhat' by demonstrating that 'unconceived existence' is not a hidden truth but a logical impossibility, thereby making the Divine Mind the necessary sustainer of continuous existence rather than merely a witness to it.

  (648 words)

  ***

  3. Marking Scheme (Out of 25)

  **A Range (20–25 marks)**
  *   **Systematic Role (8–10 marks):** Clearly identifies that the Master Argument blocks the retreat to an 'unknown somewhat' or substratum that survives the abstraction/likeness critiques. Explains that while likeness stops *resemblance*, the Master Argument stops *supposition* of mind-independent reality.
  *   **Conceiving vs. Supposing (5–7 marks):** Successfully distinguishes between psychological inability (imaginative failure) and logical impossibility (contradiction in terms). Argues that Berkeley needs the latter for idealism to hold.
  *   **The Rock & God (5–7 marks):** Correctly identifies that without God, the prehistoric rock is a contradiction (nothing), not just unknown. Explains that God resolves a *logical* gap (making continuous existence coherent) rather than just an *epistemic* one (making it knowable).
  *   **Clarity:** Concise, well-structured, stays within word limits.

  **B Range (15–19 marks)**
  *   **Systematic Role (5–7 marks):** Acknowledges the argument does more than the abstraction critique but is vague on *what* (e.g., says it 'strengthens the case' without explaining the substratum retreat).
  *   **Conceiving vs. Supposing (4–5 marks):** Mentions the distinction but treats it as a minor point, or conflates the two slightly (e.g., implies Berkeley relies mostly on psychological inability).
  *   **The Rock & God (4–5 marks):** Applies the argument to the rock but treats God's role as primarily ensuring we can *know* about the past (epistemic) rather than constituting its existence (ontological/logical).
  *   **Clarity:** Good structure, minor digressions.

  **C Range (10–14 marks)**
  *   **Systematic Role (3–5 marks):** Treats the Master Argument in isolation. Fails to explain why it is needed given the other doctrines.
  *   **Conceiving vs. Supposing (2–4 marks):** Does not address the distinction, or treats the argument as purely about mental imagery.
  *   **The Rock & God (2–4 marks):** Discusses the rock but fails to connect it to the necessity of God's perception for the rock's *existence* versus its *discovery*.
  *   **Clarity:** Disorganized or significantly over/under length.

  **Fail Range (0–9 marks)**
  *   **Major Errors:** Merely reports Berkeley's conclusions without analysis. Claims the argument is simply circular without engaging the prompt's challenge.
  *   **Specific Penalties:**
      *   **-5 marks:** Deploying the stock circularity objection ('conceiving makes it conceived') as a refutation without addressing Berkeley's systematic response or the distinction between psychological and logical impossibility.
      *   **-5 marks:** Sliding from 'we cannot conceive of mind-independent existence' to 'there is no mind-independent existence' without explaining the *esse is percipi* link.
      *   **-3 marks:** Ignoring the prehistoric rock case or the specific instruction regarding God's role (logical vs. epistemic).
