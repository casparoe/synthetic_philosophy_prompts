          5.  Conclusion: God isn't a patch; he's the necessary condition for the coherence of the claim.
      *   *Word Count Check:* Need to be concise. Avoid long biographical intros.
      *   *Drafting content:* Start with the systematic gap. The likeness principle stops ideas resembling non-ideas. Abstraction stops general notions of existence. But the materialist says "I suppose there's a *something*." Master Argument targets the *supposition* itself. It shows the content of that supposition is empty.
      *   *Distinction:* If it's just imaginative failure, materialism is psychologically hard but logically possible. If it's inconceivable, materialism is nonsense. Berkeley needs the latter.
      *   *Rock Case:* Prehistoric rock. If no finite mind, is it nothing? Master Argument says unconceived = impossible. So it must be conceived. God fills this. Is it a patch? No, because without God, the proposition "rock exists unconceived" is contradictory, not just unverified.
