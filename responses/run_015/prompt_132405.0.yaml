answer: |-
  **I. The Discrepancy**

  The review booth smelled of ozone and old glue. Elara turned the pages of her Personal Continuity Binder, the heavy stock rustling under her thumb. The entries were precise: *07:00, Wake. 08:15, Transit. 12:00, Nutrient Intake.* The ink was uniform, the stamps sequential. Until Page 392.

  The entry for November 14th ended at 22:00 with *Lights Out.* The next entry, November 15th, began at 06:00 with *Wake.* But between them, the margin was empty. No sleep log. No dream registry. Worse, the side-column verification codes skipped from 88-B to 88-D. Code 88-C was missing entirely.

  She looked up through the glass partition into the records room. A senior archivist stood at the central desk, smoothing a crease in a large ledger. He took a red pen from his ear, crossed out a date on the master page, and wrote a new one above it without striking through the first. He then filed the supporting testimony card into a bin marked *Permanent Reference*, though the card contradicted the ink still wet on the ledger page. The master narrative was not a chain, but a pile.

  Elara closed her binder. The gap was not in the paper; it was in the requirement that the paper hold her together.

  **II. The Adjudication**

  Adjudicator Kress did not look at her face, only at the open binder. He tapped the empty margin with a stylus.

  "Standard procedure is a Bridge Statement," Kress said. His voice was flat, calibrated for recording. "You construct a sequence of events for the missing duration. Sleep, illness, unauthorized transit. Any causal link will suffice to bind Page 392 to 393."

  "And if I cannot recall the link?"

  "Recall is secondary. Cohesion is primary." Kress slid a form across the desk. *Form 12-Alpha: Retroactive Continuity.* "If you file this, your weight remains centralized. You retain property rights. You remain a singular litigant. The mortar matters more than the brick."

  "And the alternative?"

  "File as Is." Kress pointed to a different stack of papers, thinner, unbound. "The gap remains. The narrative gravity fails. You do not cease, but you distribute. You become a series of instances rather than a line. You can still work, still eat, but you cannot sign a lease. No one contracts with a fragment."

  "It would be honest," Elara said.

  "It would be loose," Kress corrected. "Some find the weight exhausting. To hold the shape requires constant tension. To let it scatter requires no maintenance. You would not be a person. You would be a weather pattern."

  **III. The Instrument**

  Elara sat at the submission desk. The room was silent save for the hum of the ventilation and the scratch of pens from the booths around her. People were writing themselves into existence, stroke by stroke.

  On the left lay Form 12-Alpha. To fill it was to weave a thread over the tear. She would invent a fever, a blackout, a walk in the rain. She would walk out of the building with her name intact, heavy and solid, capable of holding a key and a promise. The lie would calcify into fact within the hour.

  On the right lay the *File as Is* stamp. To use it was to accept the tear. She would walk out lighter. There would be no need to explain tomorrow to yesterday. No need to carry the accumulation of every prior error. She would be free of the burden of being a single thing, but she would belong to no one, and nothing would belong to her.

  She picked up the pen. It was heavy, balanced for pressure. She hovered the nib over the white space of the margin, where the ink of the 14th dried into the ink of the 15th. The air in the room felt thin, pressurized. She did not write. She simply let the tip rest on the paper, feeling the texture of the stock, waiting to see if the hand would move to bridge the gap, or let the page remain open to the air.
