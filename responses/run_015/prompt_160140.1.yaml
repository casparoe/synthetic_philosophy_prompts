      *   *Drift?* It's Contextualism, regenerates the problem but usefully.
      *   *Progress?* Mapping costs, pragmatic turn, or accepting the oscillation.

      *(Self-Correction during drafting)*: I need to be careful about Williamson. He argues the boundary is *metaphysically* sharp, but our *access* is limited. The Super-Agent question is crucial. If the meaning is determined by use, and use doesn't settle it, how is it sharp? Williamson says use + environment + causal laws settle it, but we can't calculate it. So a Laplacean demon *could* know it. This confirms the user's suspicion that Epistemicism makes ignorance contingent on human limitations. I should highlight this.

      *(Self-Correction on Drift)*: The user calls it "Drift." I should identify it as *Contextualism* (Kamp, Raffman) to give them keywords for further research. The "higher order" objection is the standard reply to Contextualism.

