  1. The instrumental success of scientific vocabularies in manipulating non-linguistic phenomena suggests constraints that mere social agreement cannot explain. If theories were only tools for coping, their precise predictive capacity across independent contexts would be an inexplicable miracle.
  2. Pragmatism struggles to ground the normative force required to distinguish between a useful lie and a truthful account without smuggling in a correspondence criterion. Without a reality-check, the preference for one vocabulary over another becomes merely aesthetic or political rather than epistemic.
  3. The AI model is trained on human corpora that are themselves causally linked to physical events, meaning its "discourse" secretly relies on the representational success of its training data. Denying the world behind the AI ignores the causal chain that allowed the training data to stabilize in the first place.
  4. Human beings encounter brute resistance from the environment that cannot be redescribed away through linguistic innovation. When a vocabulary fails to prevent physical suffering, the failure points to a non-linguistic constraint that pragmatism struggles to acknowledge without contradiction.
  5. Correcting errors requires a distinction between seeming right and being right, which implies a standard external to current consensus. If all correction is just shifting vocabularies, the concept of error loses its critical bite and becomes mere stylistic adjustment.
