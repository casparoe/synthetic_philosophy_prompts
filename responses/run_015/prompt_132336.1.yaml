  I'm working on a novel about a retired linguist who falls deep into Rorty's neopragmatism after she starts collaborating with an AI that writes poetry without any "world" behind the words. She takes Rorty's antirepresentationalism seriously and starts claiming that even scientific theories are just vocabularies we use to cope, not mirrors of nature, and that applying this to machine text proves there's no hidden reality we're missing. I think she's mostly right, but I want the story to have real philosophical tension, not just strawman objections. So here's the position: Rorty's rejection of representation as mirroring is correct, and extending it to AI-generated language shows there's no ground outside discourse we could ever appeal to. What would actually count against this? I'm not asking for the usual "then anything goes" complaints I could write myself—I'm looking for serious defeaters: conceptual problems, empirical results, or practical failures that should make her (and me) rethink. Could be issues with predictive success in science, hidden normative commitments in pragmatism, or something about how humans actually correct errors without a reality-check. Please answer as a numbered list with exactly five items, each a sentence or two, with no intro or conclusion. I dont need a reading list—just the arguments.
