answer: |-
  Your frame on proximity reversal is the strongest hook you have. Standard hyperbolic discounting assumes a smooth curve of temptation as time shrinks, but Tolkien depicts the Ring's power as ontological weight that spikes upon perceptual contact. It is not just that the reward is near; it is that the Object is *present*. This aligns with modern behavioral psychology's "hot/cold empathy gaps," but Tolkien adds a metaphysical layer: the Ring has a will of its own. When you teach this, lean hard into the idea that the environment isn't neutral. The Room of Elrond is safe; Mount Doom is hostile territory for the will.

  Regarding your first worry: you are right to be suspicious of Gollum. If Sméagol and Gollum are distinct agents trading control, this isn't akrasia (one agent failing their own judgment); it is dissociation or civil war. The "two voices" dramatize internal conflict, but philosophically, they risk dodging the problem of unified agency. The genuinely interesting case is Frodo. He remains a single "I" throughout. He judges the Ring must be destroyed, intends to destroy it, and carries that intention until the literal edge of the fire. His failure is the only pure example of akrasia in the text because he maintains moral continuity where Gollum fractures.

  This leads to your second point: the impossibility thesis. Many readers argue that no will could have survived the Cracks of Doom, making Frodo's failure a statement of fact rather than moral weakness. If it was impossible, Socrates would say he wasn't truly free, and thus not blameworthy. However, you can keep both readings without cheating. Distinguish between the *mechanics* of the will and the *metaphysics* of the outcome. Phenomenologically, Frodo experiences akrasia: he knows the good, wants the good, and chooses the evil in the moment. Theologically, Tolkien suggests Grace intervenes (via Gollum) to complete what will could not. For your session, treat Frodo's claim ("I do not choose now to do what I came to do") as the textbook definition of akrasia, while acknowledging that Tolkien believes some tasks exceed human capacity. The philosophical lesson isn't that Frodo failed, but that there is a limit to willpower that precommitment cannot solve.

  On precommitment: "Prospective akrasia" is a catchy term, but you might frame it as a failure of precautionary virtue. Faramir is your Ulysses figure here. He refuses the Ring outright because he knows his own nature ("I would not take this thing, if it lay by the highway"). He recognizes that proximity reversal will happen to him, so he removes the option. Gandalf and Galadriel do the same. Frodo's lack of precommitment isn't necessarily negligence; the quest required him to carry the burden where others could not. However, you can teach this as a tragic limitation: Frodo lacked the self-knowledge to demand safeguards. He trusted his will instead of his situation. Faramir shows that true strength often looks like refusing the test entirely.

  So, what does this add beyond "present bias"? The Boromir/Faramir contrast moves you from mechanics to virtue ethics. Both brothers face the same proximity trigger. Boromir falls; Faramir stands. The text implies the difference isn't raw willpower but what they love. Boromir loves Gondor's glory; Faramir loves wisdom and peace. The Ring exploits what you already value. This complicates the economic model: it's not just about discounting the future, it's about the orientation of desire. Similarly, Bilbo's lingering attachment after giving up the Ring shows that akrasia leaves a residue. Willpower isn't a switch; it's a habituated state.

  For scenes, use the book where possible for philosophical precision, but film for visceral proximity.
  1.  **The Taming of Sméagol (Book):** Use the dialogue where Sméagol argues with himself. It illustrates the divided soul problem. Ask the group: if Sméagol wins, is it willpower, or just one agent defeating another?
  2.  **The Window on the West (Book/Film):** Faramir's refusal. This is your precommitment case study. Contrast his calm certainty with Boromir's later desperation.
  3.  **The Cracks of Doom (Book):** Do not use the film scene where Frodo fights Gollum over the Ring. Use the book text where Frodo simply claims it. The film makes it an action struggle; the book makes it a failure of assertion. This is crucial for akrasia.

  Be straight with your students about where the story pulls away from the philosophy. Secular akrasia models assume a closed system of human psychology. Tolkien's universe is open to external spiritual powers. The Ring isn't just a tempting object; it is an agent that attacks the will. This means Frodo's failure isn't entirely internal. If you treat the Ring as merely a metaphor for addiction, you lose the metaphysical stakes. If you treat it as a literal demon, you lose the human responsibility. The tension between those two readings is where your session should live. Don't resolve it. Let them sit with the fact that Frodo is both responsible for his choice and overwhelmed by a power that arguably made the choice inevitable. That uncertainty is more valuable than a clean mapping onto Aristotle.
