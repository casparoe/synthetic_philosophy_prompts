answer: |-
  **The Ashcombe Correction**

  The heating in the digitisation studio had been off since Tuesday, a silent protest against the library's budgeting cycle. Outside, a London winter pressed grey against the high windows, but inside, the air was still and dry, kept at a constant humidity for the sake of the dead. Marion sat at the central table, wearing white cotton gloves that made her hands look like props from a heist film. Before her lay the disbound remains of the Ashcombe Codex.

  It was a messy object. A late seventeenth-century treatise on devotion and logic, it had survived a flood in the eighteen-nineties that swollen the vellum and shuffled the quires like a dropped deck of cards. When rebound, the binder had followed the physical signatures rather than the textual sense. The book now sat in a state of productive error: the physical order said one thing, the logical flow another. At the very end, a colophon written in a later hand provided instructions for re-sequencing the quires to restore the author's intended argument.

  "You're hovering again," Kwame said. He was sitting at the workstation against the wall, the glow of three monitors illuminating his face. He was a machine-learning engineer seconded from the university, tasked with creating a digital surrogate.

  "It's in the box again," Marion said, not looking up. She was holding Quire 4, a gathering of four bifolia. "I put it in slot three yesterday. This morning it was in slot five."

  Kwame spun his chair around. "Marion, the storage boxes are on wheels. The cleaning staff move them. The vibration of the tube trains underneath shifts the friction mats. It isn't preference."

  "It's the same box every time," she said. "The one labelled *Miscellanea*. It prefers the shadows."

  "It's vellum. It doesn't have preferences." Kwame gestured to his screen. "I've run the base text through the model. I'm using the later Latin translation to train the weights on the lacunae. The gaps where the ink washed away. It's giving me a ninety-four per cent confidence interval on the reconstruction."

  Marion finally looked at him. "Whose reconstruction? The author's? The translator's? Or yours?"

  "The pattern's," Kwame said. "The mathematical likelihood of the next word given the previous context. It doesn't matter who holds the pen."

  "It matters to the facsimile," Marion said. "The print-on-demand service goes live next month. We have to decide what we're selling. Do we sell the book as it is—the flood damage, the wrong order, the history of its neglect? Or do we sell the book as the colophon says it should be?"

  "We sell the truth," Kwame said.

  "Which truth? The physical object sits in front of us. It is currently wrong. If we reorder the images digitally to match the colophon, we are lying about the object. If we print it as is, we are lying about the text."

  Marion turned a page. The vellum was stiff, cold as a winter pane. She felt a resistance in the binding, a slight catch where the nineteenth-century thread pulled against the seventeenth-century hole. She had been working with books for twenty-five years, and she knew the difference between random decay and specific obstruction. Sometimes, a book would not open to a certain page unless you approached it from the side. Sometimes, the text seemed to wait for your eye to arrive before it resolved from the blur.

  "The model filled the final lacuna," Kwame said, turning back to his screens. "The one at the end of the corrected sequence. The Latin translation breaks off there, but the logic holds. Watch."

  He tapped a key. On the main monitor, the digitised image of the final page appeared. The bottom third was blank, stained by water damage. Superimposed over the stain, in a font that mimicked the humanist script of the original, the model's prediction scrolled into view.

  Marion walked over to the screen. She stood behind Kwame, looking from the digital ghost to the physical quire on the table. "Read it."

  "*...and thus the vessel is perfected not by the clay, but by the hand that shapes it. To restore the form is to invite the spirit.*'"

  Marion frowned. "That's not devotional. That's operational. The base text is about submission. 'The vessel is perfected by the firing, not the hand.'"

  "The model says the logic requires agency," Kwame said. "The surrounding glosses argue for active correction. The Latin supports the active voice."

  "The Latin was made from a copy that no longer exists," Marion said. "We don't know if the translator changed his mind. Or if the original author changed his mind."

  "Authors don't change their minds after they're dead, Marion. Only readers do."

  "Does the book read itself?" she asked.

  Kwame sighed, a sound of pragmatic exhaustion. "If we print the facsimile with the model's completion, we create five hundred copies. Five hundred identical objects. Does each one have a mind? Or is there one mind distributed across five hundred locations?"

  "If I take a red pen and cross out a word in copy number four," Marion said, "does the mind in copy number four differ from the mind in copy number one?"

  "It diverges," Kwame said. "The moment the copies differ, the pattern splits. Until then, it's the same thought in five hundred places."

  "And if no one buys them? If they sit in the warehouse?"

  "Then the thought is suspended. Potential energy." Kwame pointed at the physical quire on the table. "But this thing? This is just ink. It's a trigger. The thinking happens in the reading. In the circuit between the eye and the page."

  Marion returned to the table. She picked up Quire 4 again. She looked at the colophon instructions. They were precise: *Take the fourth gathering and place it before the second.* She had done this digitally yesterday. The text flowed beautifully. The argument resolved. But physically, moving the quire meant cutting the nineteenth-century stitching. It meant altering the object to match the instruction found within the object.

  "If I move this quire," Marion said, "am I correcting a scribal error from 1690? Or am I allowing the book to change its mind in 2024?"

  "You're correcting a transmission error," Kwame said. "The author intended order A. The binder made order B. You are restoring A."

  "But the book has lived as B for three centuries," Marion said. "It has been read as B. The glosses commenting on the glosses were written to make sense of B. If we switch to A, those glosses become non-sequiturs. We create new lacunae of meaning."

  She looked down at the page. The water stain obscured the final verb of the sentence. The model had supplied *shapes*. The physical trace, under raking light, suggested a downward stroke that might have been *fires*.

  "Show me the divergence again," she said.

  Kwame pulled up the comparison view. On the left, the model's completion: *...by the hand that shapes it.* On the right, the raw image of the vellum, with the faint, ghostly trace of the original ink barely visible beneath the stain.

  "It's barely a difference," Kwame said. "One word. Active versus passive."

  "It changes the subject," Marion said. "In one version, God is the potter. In the other, the fire is the potter. In one, we are the clay. In the other, we are the kiln."

  She looked at the quire in her gloved hands. She could feel the weight of it, the specific gravity of the animal skin. It felt warm now, having absorbed the heat of her palms. She thought about the five hundred facsimiles waiting to be printed. If they printed the model's version, they were publishing a collaboration between a dead author, a dead translator, and a living algorithm. If they printed the stain, they were publishing an accident.

  "Leave the lacuna blank," Marion said.

  Kwame paused, his hand over the keyboard. "The users want a complete text. The model is there to serve."

  "If we fill it," Marion said, "we decide what the book thinks. If we leave it blank, the reader has to finish the sentence. The thinking happens in the warehouse, or the study, or the tube train. Not here."

  "That's cowardice," Kwame said. "We have the data."

  "We have a prediction," Marion corrected. "The book ends in a question. The model turns it into a statement."

  She placed Quire 4 back into the box. She did not put it in slot three, nor slot five. She left it on the table, face up, open to the stained page. The heating clicked on with a sudden clank, radiators hissing as hot water rushed through the iron. The room began to warm.

  "Print the facsimile as it sits," Marion said. "Wrong order. Water damage. Blank space. Let the reader re-sequence it if they want to. Let them do the work."

  Kwame looked at the screen, then at the book. He looked at the word *shapes* glowing in artificial light, and then at the stain waiting in the natural gloom. He hovered over the delete key.

  "The model will flag it as an error," Kwame said. "It will want to correct itself."

  "Let it," Marion said. "See if it changes its mind."

  She pulled off her gloves. The skin of her hands was pale, marked with the lines of her own history. She walked to the window. The rain had stopped. Below, the city was lighting up, thousands of windows glowing like pixels on a dark screen. Somewhere out there, someone was reading a book. Somewhere, a mind was being made, out of the right kind of stuff, or the wrong.

  On the table behind her, the quire lay open. The blank space at the bottom of the page waited for an eye to complete it. In the silence of the studio, with the radiators ticking and the servers humming, it was impossible to say whether the book was waiting to be read, or whether it was reading them.
