answer: |-
  # Containing the Explosion: A Normative Framework for Localized Non-Transmission in Dialetheic Belief Revision

  ## Abstract

  Dialetheism, the view that some contradictions are true, has secured a stable foothold in contemporary metaphysics and logic, primarily through its capacity to resolve semantic and soritical paradoxes without resorting to hierarchical languages or truth-value gaps. The standard defense of dialetheism proceeds in two stages: first, it argues that certain sentences, such as the Liar, are both true and false; second, it adopts a paraconsistent logic to prevent the principle of explosion from rendering the system trivial. However, a significant gap remains in the literature regarding the normative epistemology of the dialetheic agent. While paraconsistent logic blocks the *logical* derivation of arbitrary conclusions from a contradiction, it does not inherently provide a *normative* theory of belief revision that explains how a rational agent should manage true contradictions without inadvertently collapsing into trivialism or smuggling in classical consistency constraints. This research proposal outlines a project to develop a principle of Localized Non-Transmission (LNT). LNT posits that a true contradiction in a specific domain of discourse licenses inferences within that domain but blocks cross-domain propagation unless an explicit bridge premise is independently warranted. The project consists of three phases: formalizing LNT within a standard paraconsistent belief-set framework without inventing new logical constants; testing the principle against objections concerning trivialism, the distinction between contradiction and error, and ad hocness; and assessing whether LNT can be motivated independently of dialetheism to ensure it is not merely a defensive maneuver. Success would yield a defensible normative framework that allows dialetheists to maintain coherence while offering opponents a non-question-begging ground for rejection.

  ## 1. Introduction

  The history of twentieth-century logic is largely a history of the law of non-contradiction. From Aristotle's defense of it as the most certain of all principles to its codification in classical logic, the notion that a proposition and its negation cannot both be true has been treated as a constitutive norm of rationality. To violate it was to invite triviality: if a contradiction is true, then by the principle of explosion (*ex contradictione quodlibet*), every proposition becomes true, and rational discourse collapses. However, the last fifty years have witnessed a robust challenge to this orthodoxy. Dialetheism, championed most prominently by Graham Priest and colleagues, argues that there are true contradictions. These are not merely apparent contradictions resulting from ambiguity or error, but genuine instances where a sentence $A$ and its negation $\neg A$ are both true. The primary motivation for this view is the treatment of self-referential paradoxes, such as the Liar Paradox, and vagueness paradoxes, such as the Sorites. In these cases, dialetheists argue, the most natural and semantically honest solution is to accept the contradiction rather than to engineer complex hierarchical languages or deny bivalence in ways that seem to recreate the paradox at a meta-level.

  The logical machinery required to support dialetheism is paraconsistent logic. Unlike classical logic, paraconsistent systems invalidate the inference from $A \land \neg A$ to $B$. This blocks the explosion, allowing for the existence of inconsistent but non-trivial theories. The standard debate in the literature has focused heavily on the metaphysical and semantic plausibility of dialetheism. Proponents argue that true contradictions are required to make sense of semantic closure, while opponents argue that the cost of accepting true contradictions outweighs the benefits, often claiming that dialetheists cannot genuinely disagree with their opponents or that they must reject the notion of negation as truly contradictory. This debate is well-trodden ground. It asks whether dialetheism is *true*.

  However, there is a secondary, less explored question that concerns the *rationality* of the dialetheic agent. This proposal identifies a tractable gap in the literature regarding the normative theory of belief revision for dialetheism. The existence of a paraconsistent logic ensures that a dialetheic theory is not *logically* trivial, but it does not automatically furnish a guide for how a rational agent ought to *manage* beliefs in the presence of true contradictions. Logic describes preservation of truth; epistemology describes the management of belief. A rational agent does not simply accept all logical consequences of their beliefs; they revise, prioritize, and compartmentalize. In classical epistemology, the detection of a contradiction is a signal for immediate repair. The norm is: if you find a contradiction, you must eliminate it to restore consistency. But for the dialetheist, some contradictions are features of the world, not bugs in the system. Therefore, the classical norm of belief revision is inapplicable.

  This creates a vulnerability. If a rational agent accepts a true contradiction, what prevents them from accepting *any* contradiction? More pressingly, what prevents the inconsistency from leaking into domains where it does not belong? Standard paraconsistent logics, such as the Logic of Paradox (LP), allow for transitivity of entailment in many contexts. While they block explosion, they do not inherently block the transmission of inconsistency from a semantic domain to a physical domain, for example. If I believe that the Liar sentence is both true and false, does that license me to believe inconsistent things about quantum mechanics? Logically, in LP, it might not follow directly. But normatively, what constrains the agent from drawing connections that spread the inconsistency?

  Current paraconsistent frameworks often leave inference too permissive or, conversely, smuggle in classical consistency constraints that dialetheists theoretically reject. For instance, in practice, dialetheists reason classically about consistent domains. They do not walk into traffic believing they are both hit and not hit. They employ a "classical recapture," reasoning that in consistent domains, classical logic holds. However, the mechanism for this recapture is often under-theorized in normative terms. Is it a logical rule? A pragmatic heuristic? If it is a logical rule, does it presuppose that we can know *a priori* which domains are consistent? If we can know that, why do we need dialetheism at all? If it is a heuristic, is it robust enough to prevent trivialism?

  This proposal argues that neither side of the standard debate adequately addresses this normative gap. The dialetheist needs a principled way to isolate true contradictions so that arbitrary conclusions do not become warranted, without relying on a global assumption of consistency that would undermine the dialetheic position. I propose developing a middle-ground closure principle, termed Localized Non-Transmission (LNT). According to LNT, a true contradiction in domain $D$ licenses inferences within $D$ but blocks cross-domain propagation unless an explicit bridge premise is independently warranted. This is not a new logic, but a normative constraint on belief revision operating over a paraconsistent logic.

  The project has three parts. First, it will formalize the principle within a standard paraconsistent belief-set framework without inventing new logical constants, ensuring compatibility with existing systems like LP. Second, it will test the principle against three major objections: the slippery slope to trivialism, the problem of distinguishing true contradiction from mere error, and the charge of ad hocness. Third, it will assess whether the principle can be motivated independently of dialetheism, drawing on parallels in contextualist epistemology and inconsistent database management, to ensure it does not collapse into a defensive maneuver designed solely to protect dialetheism from refutation.

  The success of this project would be a defensible normative framework that dialetheists can adopt without abandoning coherence and that opponents can reject on non-question-begging grounds. The project fails if Localized Non-Transmission either collapses into classical consistency requirements (thereby rendering dialetheism otiose) or proves impossible to motivate without presupposing the falsity of dialetheism (thereby rendering it circular). Given the scope, the formal work will be restricted to propositional cases, avoiding modal or set-theoretic extensions to ensure the project is completable within a one-semester timeline. The following sections detail the conceptual architecture of this proposal.

  ## 2. The Normative Gap in Contemporary Dialetheism

  To understand the necessity of the proposed Localized Non-Transmission principle, one must first appreciate the specific nature of the gap in the existing literature. The gap is not logical; it is normative. It concerns the transition from "what follows" to "what one ought to believe."

  ### 2.1 The Distinction Between Logic and Belief Revision

  In classical epistemology, the relationship between logic and belief is tight. The standard AGM (Alchourrón, Gärdenfors, Makinson) framework for belief revision assumes that belief sets are logically closed and consistent. When new information contradicts an existing belief set, the agent must contract the set to restore consistency before expanding it with the new information. The norm is clear: consistency is a regulatory ideal. A rational agent strives for a consistent belief set because an inconsistent set is taken to represent a failure of cognitive processing or a lack of information.

  Dialetheism disrupts this picture. If some contradictions are true, then consistency cannot be a universal regulatory ideal. A rational agent, upon encountering a Liar sentence, ought to believe the contradiction. Therefore, the AGM postulate of consistency must be relaxed. Paraconsistent logic provides the underlying consequence relation that allows for this relaxation. In a paraconsistent logic like LP, a belief set $K$ can contain $A$ and $\neg A$ without $K$ becoming the set of all sentences.

  However, logic alone does not dictate belief revision policies. Logic tells us that $B$ is a consequence of $\Gamma$. It does not tell us whether we *should* add $B$ to our belief set when we add $\Gamma$. In classical contexts, we usually should, because the preservation of truth is the goal of belief. But in a dialetheic context, the goal is more nuanced. The goal is to believe the truth, even if the truth is contradictory, without believing *everything*.

  The gap arises here. Standard paraconsistent logics define validity in terms of truth preservation (often preserving designated values like 'true' and 'both'). They do not define *rational inference* in terms of domain sensitivity. For example, in LP, if $A$ entails $B$, and I believe $A$, I am logically permitted to believe $B$. But if $A$ is a contradiction located in the domain of semantics, and $B$ is a proposition in the domain of ethics, is it *rationally* permitted to infer $B$?

  Consider the case of a legal system. Legal systems are often inconsistent. A higher court may overturn a precedent, creating a temporary contradiction between the old rule and the new rule, or two statutes may conflict. Legal theorists often treat these inconsistencies as localized. A contradiction in tax law does not license a judge to derive arbitrary conclusions in criminal law. They use doctrines of jurisdiction and standing to block the transmission of inconsistency. This is a normative practice, not merely a logical one. The logic of the legal code might be classical, but the *application* of the code is compartmentalized.

  Dialetheism lacks a comparable, fully articulated normative theory for the individual agent. The dialetheist claims that the Liar is a true contradiction. But they do not claim that *all* contradictions are true. They need a criterion for when a contradiction is acceptable and when it signals error. Furthermore, they need a criterion for when an inconsistency in one area of thought licenses inferences in another. Without this, the dialetheic agent risks being normatively unmoored. They have a logic that permits contradiction, but no epistemology that manages it.

  ### 2.2 The Problem of Classical Recapture

  A common response from dialetheists to concerns about trivialism is the notion of "classical recapture." The argument is that while the logic of the universe is paraconsistent (because there are true contradictions), most of our daily domains are consistent. In consistent domains, classical logic holds. Therefore, we can reason classically about physics, biology, and everyday affairs, and only switch to paraconsistent reasoning when dealing with semantic paradoxes or boundary cases of vagueness.

  While this is a standard move, it raises a normative question: How does the agent know when to recapture? If the agent must check for consistency before applying classical rules, they are presupposing the ability to detect consistency. But if true contradictions are possible, consistency is not *a priori* guaranteed. The agent might think a domain is consistent when it is not. If they apply classical logic in a domain that turns out to contain a true contradiction, they might derive a falsehood (by assuming exclusivity where there is none) or miss a truth.

  Conversely, if they apply paraconsistent logic everywhere to be safe, they weaken their inferential power. Disjunctive Syllogism ($A \lor B, \neg A \vdash B$) fails in LP. If I believe "The cat is on the mat or the cat is outside" and "The cat is not on the mat," I cannot classically infer "The cat is outside" if I am using LP, because the negation might be glutty. Yet, in everyday life, we make this inference constantly. Dialetheists argue that in consistent contexts, the negation is not glutty, so the inference holds. But this requires the agent to have a warrant for the consistency of the context.

  This creates a normative burden. The agent needs a principle that tells them: "You may use classical inference here, but not there," or "You may transmit this inference across domains, but not that one." Existing literature often treats this as a pragmatic matter or a matter of "normalcy." But pragmatism is not enough for a theory of rational belief. We need a principled account of why the transmission is blocked. Is it blocked because the inference is invalid? Or is it blocked because the *warrant* for the inference does not extend across the boundary?

  Localized Non-Transmission proposes the latter. It suggests that the validity of the inference might hold (in the underlying paraconsistent logic), but the *normative permission* to assert the conclusion in a new domain is blocked without a bridge. This distinguishes the project from attempts to weaken the logic further. It keeps the logic standard (for a dialetheist) but tightens the norms of belief revision.

  ### 2.3 The Risk of Smuggling Consistency

  The opposing risk is that in trying to manage contradictions, the dialetheist inadvertently reinstates the law of non-contradiction as a normative ideal. If the principle of Localized Non-Transmission is too strict, it effectively isolates contradictions so thoroughly that they become inert. If a true contradiction cannot influence any other belief unless a bridge premise is warranted, and if bridge premises are hard to come by, then the contradiction is functionally equivalent to a falsehood that is ignored.

  Opponents of dialetheism often argue that dialetheists do not truly believe in true contradictions; they merely tolerate them as a formal device. If the normative framework surrounding dialetheism treats contradictions as toxic substances that must be contained in lead boxes, then the dialetheist is admitting that contradictions are cognitively dangerous. This undermines the metaphysical claim that contradictions are just as truth-apt as non-contradictions.

  Therefore, the normative framework must strike a balance. It must allow the contradiction to do *some* work (otherwise, why accept it?) but not *all* the work (otherwise, trivialism). It must allow the contradiction to be integrated into the agent's web of belief without unraveling the web. This is the precise niche Localized Non-Transmission aims to fill. It acknowledges the danger of unchecked transmission (trivialism) without treating the contradiction as a pariah (classical smuggling).

  The gap, then, is the lack of a formalized, normative principle that governs the *flow* of inconsistency. Current discussions focus on the *presence* of inconsistency. This proposal focuses on the *movement* of inconsistency. By shifting the focus from static consistency to dynamic transmission, we can address the rationality of the dialetheic agent without abandoning the core tenets of dialetheism.

  ## 3. Formalizing Localized Non-Transmission

  The second part of this project involves formalizing the principle of Localized Non-Transmission (LNT) within a standard paraconsistent belief-set framework. The constraint is to do this without inventing new logical constants. We will utilize the vocabulary of belief revision theory and propositional paraconsistent logic (specifically LP) to construct the normative layer.

  ### 3.1 The Underlying Logic and Belief Sets

  We assume an underlying paraconsistent logic, $L_P$, such as LP. The language $\mathcal{L}$ contains standard propositional connectives. A belief set $K$ is a set of sentences closed under the consequence relation of $L_P$. That is, if $\Gamma \subseteq K$ and $\Gamma \vdash_{L_P} \phi$, then $\phi \in K$. In standard paraconsistent belief revision, the consistency postulate is dropped. $K$ may contain $A$ and $\neg A$.

  To introduce LNT, we must introduce the notion of a **Domain**. A domain $D$ is a subset of the language $\mathcal{L}$, representing a thematic cluster of propositions. For example, $D_{sem}$ might contain propositions about truth and reference, while $D_{phys}$ contains propositions about physical objects. Domains are not necessarily disjoint, but they are distinct. We assume a partitioning function $\delta$ that maps sentences to domains. $\delta(\phi) = D$ means sentence $\phi$ belongs primarily to domain $D$.

  The core intuition of LNT is that closure under consequence is domain-relative. In standard logic, if $\Gamma \vdash \phi$, then $\phi$ is in the belief set regardless of domain. In LNT, the permission to add $\phi$ to the belief set depends on the relationship between the domain of $\Gamma$ and the domain of $\phi$.

  ### 3.2 The Principle of Localized Non-Transmission

  We define a normative consequence operator, $Cn_{LNT}$, which operates on the belief set $K$. The operator determines which logical consequences an agent is *rationally permitted* to adopt, given the domain constraints.

  **Definition 1 (Intra-Domain Closure):**
  If $\Gamma \subseteq K \cap D$ and $\Gamma \vdash_{L_P} \phi$, and $\delta(\phi) = D$, then $\phi \in Cn_{LNT}(K)$.
  *Commentary:* Within a single domain, standard paraconsistent closure applies. If the premises and the conclusion are in the same domain, the inference is permitted. This ensures that the dialetheist can fully explore the consequences of a contradiction within its native domain. If the Liar is in $D_{sem}$, all its semantic consequences are admissible.

  **Definition 2 (Inter-Domain Transmission):**
  If $\Gamma \subseteq K \cap D_1$ and $\Gamma \vdash_{L_P} \phi$, and $\delta(\phi) = D_2$ (where $D_1 \neq D_2$), then $\phi \in Cn_{LNT}(K)$ **if and only if** there exists a bridge premise $\beta \in K$ such that:
  1.  $\beta$ warrants the transition from $D_1$ to $D_2$.
  2.  $\beta$ is not itself dependent on the contradictory content of $\Gamma$ for its warrant.

  *Commentary:* This is the crux of the proposal. To move a conclusion from a contradictory domain to a different domain, the agent needs a warrant. This warrant must be a belief already held ($\beta \in K$). Crucially, condition (2) prevents the agent from using the contradiction itself to generate the bridge. For example, one cannot use the contradiction $A \land \neg A$ to infer "If $A$, then $B$" as a bridge to get $B$ in another domain. The bridge must be independently warranted.

  ### 3.3 Formalizing the Bridge Premise

  What counts as a bridge premise? In the context of belief revision, a bridge premise represents a connection between domains that the agent takes to be secure. In scientific reasoning, this might be a reductionist claim ("Chemical properties are determined by physical properties"). In everyday reasoning, it might be an observation report ("The instrument reading indicates the physical state").

  Formally, we can treat the bridge as a conditional or a relevance link. However, to avoid inventing new logic, we can treat it as a material conditional that is required to be *classically valid* or at least *non-glutty*.
  Let $W(\beta)$ be a predicate indicating that $\beta$ is warranted.
  The condition for Inter-Domain Transmission becomes:
  $\phi \in Cn_{LNT}(K)$ iff $\exists \beta \in K$ such that $W(\beta)$ and $(\Gamma \land \beta) \vdash_{L_P} \phi$.

  The warrant function $W$ is the normative component. For the purposes of this proposal, we define $W(\beta)$ as follows:
  $\beta$ is warranted if $\beta$ belongs to a domain $D_{bridge}$ that is currently assessed as consistent by the agent, or if $\beta$ is an axiom of the framework connecting the domains.

  This formalization achieves the goal of blocking explosion without changing the underlying logic $L_P$. The logic still says $\Gamma \vdash \phi$. The normative framework says "You cannot believe $\phi$ in domain $D_2$ unless you have $W(\beta)$." This preserves the dialetheic claim that the inference is logically valid (truth-preserving) while denying that it is rationally binding across domains without further support.

  ### 3.4 A Worked Example

  To illustrate the formalization, consider a dialetheic agent, Alice.
  1.  **Domain $D_{sem}$:** Contains the Liar sentence $L$. Alice believes $L \land \neg L$.
  2.  **Domain $D_{phys}$:** Contains "The cup is on the table" ($C$).
  3.  **Inference:** Suppose, through some complex logical manipulation in $L_P$, $L \land \neg L$ entails $C \lor \neg C$ (a tautology, harmless) or perhaps something more specific if we assume a theory where semantic facts entail physical facts (unlikely, but possible in idealist metaphysics). Let's assume a more realistic risk: Alice has a theory $T$ in $D_{sem}$ that entails a proposition $P$ in $D_{phys}$.
  4.  **Application of LNT:**
      *   $\Gamma = \{T, L \land \neg L\} \subseteq D_{sem}$.
      *   $\Gamma \vdash_{L_P} P$, where $\delta(P) = D_{phys}$.
      *   Alice wants to add $P$ to her beliefs in $D_{phys}$.
      *   **Check:** Is there a bridge $\beta$? Alice needs a premise like "Semantic theory $T$ accurately describes physical reality."
      *   **Warrant:** Is this bridge warranted? If Alice's warrant for the bridge relies on $T$, and $T$ contains the contradiction $L$, then the bridge is contaminated. The warrant must be independent. If she cannot find an independent warrant, LNT blocks the addition of $P$ to her physical belief set.

  This prevents the semantic contradiction from polluting the physical domain. Alice can maintain $L \land \neg L$ in $D_{sem}$ while maintaining classical consistency in $D_{phys}$, not because the logic changes, but because the normative permission to transmit the inference is withheld.

  ### 3.5 Compatibility with Existing Frameworks

  This formalization is compatible with AGM-style belief revision if we modify the expansion operator. Let $K + \phi$ be the expansion of $K$ by $\phi$. In LNT, $K + \phi$ is defined as $Cn_{LNT}(K \cup \{\phi\})$. The revision operator $K * \phi$ would similarly respect domain boundaries. If $\phi$ introduces a contradiction in $D_1$, the revision process does not automatically trigger a contraction in $D_2$.

  This approach avoids the need for new logical constants (like a domain operator in the object language). The domains and the warrant function are meta-logical constructs, part of the epistemology rather than the logic. This satisfies the constraint of not inventing new logic while providing the necessary normative structure. It treats the "domain" as a feature of the agent's conceptual scheme rather than a feature of the world, which aligns with the view that belief revision is a cognitive process.

  ## 4. Stress Testing: Three Core Objections

  Any normative proposal for dialetheism must withstand significant pressure. The literature is replete with objections to dialetheism that focus on the instability of accepting contradictions. This section applies three specific objections to the Localized Non-Transmission framework to test its robustness.

  ### 4.1 The Slippery Slope to Trivialism

  **The Objection:** The most common charge against dialetheism is that it is unstable. If you accept one contradiction, what stops you from accepting others? If the norm is "consistency is not required," then the barrier to accepting new contradictions is lowered. Applied to LNT, the objection is that the "bridge premise" requirement is too weak. A determined trivialist could simply assert a bridge premise. "I warrant that semantic contradictions entail physical chaos." If the agent is the sole arbiter of warrant, LNT offers no objective protection against trivialism. It relies on the agent's good faith, which is not a robust normative constraint.

  **The Reply:** This objection conflates *logical* trivialism with *normative* recklessness. LNT does not claim to make trivialism logically impossible; paraconsistent logic already concedes that trivialism is logically possible (one *can* believe everything). LNT claims to make trivialism *rationally impermissible*.
  The defense lies in the definition of "Warrant." In the formalization, $W(\beta)$ is not merely "believing $\beta$." It requires that $\beta$ belongs to a domain assessed as consistent or is an axiom of the framework. This assessment is not arbitrary. It is subject to coherence constraints within the domain. If an agent asserts a bridge premise that is itself contradictory or unsupported by evidence in the target domain, they violate the norms of *that* domain.
  Furthermore, LNT shifts the burden of proof. In classical logic, the burden is on the agent to remove contradictions. In LNT, the burden is on the agent to justify the *transmission* of inconsistency. This is a higher bar than simply asserting a bridge. The agent must show that the connection between domains is secure *despite* the inconsistency in the source domain. This creates a friction that slows the slide toward trivialism. It makes the propagation of inconsistency costly in terms of epistemic justification.
  Therefore, LNT does not block the slippery slope by logical fiat but by normative friction. It makes trivialism a violation of rational norms, even if it is not a violation of logical validity.

  ### 4.2 The Problem of Distinguishing Contradiction from Error

  **The Objection:** A rational agent needs to know when they have encountered a true contradiction versus when they have made a mistake. If I believe $A$ and $\neg A$, it is more likely that I am confused than that the world is contradictory. LNT requires the agent to isolate the contradiction in a domain $D$. But how does the agent know $D$ is the right domain? If I think I have a true contradiction in physics, but I am actually just wrong, LNT might encourage me to compartmentalize my error rather than correct it. By treating the contradiction as "localized," I might protect a false belief from revision. This turns LNT into a mechanism for dogmatism.

  **The Reply:** This is a serious epistemological challenge. LNT is not a criterion for *truth*; it is a criterion for *belief management*. It does not tell the agent "This is a true contradiction." It tells the agent "If you are going to hold this contradiction, here is how you must manage it to remain rational."
  However, the framework can incorporate a defeasibility condition. The warrant $W(\beta)$ is defeasible. If evidence accumulates in $D_{phys}$ that contradicts the transmitted conclusion, the bridge premise is defeated.
  Moreover, LNT actually aids in distinguishing error from truth. In classical epistemology, any contradiction forces a global revision. This makes it hard to pinpoint the source of the error. In LNT, because transmission is blocked, the contradiction remains localized. If the contradiction in $D_{sem}$ does not cause problems in $D_{phys}$, the agent can investigate $D_{sem}$ specifically. If the contradiction in $D_{phys}$ causes predictive failures, the agent knows to revise $D_{phys}$.
  By containing the inconsistency, LNT allows for more granular error checking. It prevents a local error from forcing a global collapse, which actually preserves the agent's ability to distinguish between a localized paradox (like the Liar) and a systematic error (like a failed physical theory). The norm is: "Treat contradictions as true only if they remain stable under localized scrutiny and do not require ad-hoc bridges to function."

  ### 4.3 The Charge of Ad Hocness

  **The Objection:** LNT looks suspiciously like a device invented solely to save dialetheism from refutation. If the only reason to block cross-domain transmission is to prevent dialetheism from exploding, then the principle is ad hoc. It lacks independent motivation. A principle that is adopted merely to immunize a theory against criticism is not a genuine contribution to epistemology; it is a defensive maneuver. If LNT has no application outside of dialetheism, it should be rejected as question-begging.

  **The Reply:** This is the most critical objection regarding the viability of the project. To succeed, LNT must be shown to have utility independent of dialetheism.
  Fortunately, there are strong parallels in other fields.
  1.  **Inconsistent Databases:** In computer science, databases often become inconsistent due to integration errors. Engineers do not shut down the whole system (trivialism). They use "view updates" and "transaction isolation" to contain the inconsistency. A query in one module does not propagate errors to another module without explicit API contracts (bridge premises). This is effectively LNT in practice.
  2.  **Legal Systems:** As mentioned earlier, legal systems manage inconsistencies between statutes or jurisdictions. A contradiction in family law does not invalidate criminal law. Judges use standing and jurisdiction (bridge premises) to determine when a precedent from one domain applies to another.
  3.  **Contextualist Epistemology:** In mainstream epistemology, contextualists argue that the standards for knowledge vary by context. What counts as "knowing" in a casual conversation differs from a scientific lab. This is a form of domain sensitivity. LNT can be viewed as an extension of contextualism to the norm of consistency. Just as knowledge standards are localized, consistency norms can be localized.

  By drawing on these analogies, LNT is shown to be a general principle of rational management of complex systems, not just a fix for dialetheism. The dialetheist is simply applying a general normative principle to the specific case of true contradictions. This independent motivation deflects the charge of ad hocness. It shows that LNT is a reasonable norm for *any* agent dealing with compartmentalized information, whether they believe the contradictions are true or merely temporary errors. For the dialetheist, the compartmentalization is permanent; for the classical agent, it is temporary. But the normative structure of the management is the same.

  ## 5. Independent Motivation and Viability

  The final part of the project assesses whether LNT can be motivated independently of dialetheism and whether it avoids the failure conditions outlined in the introduction. This section focuses on the philosophical viability of the principle.

  ### 5.1 Motivation Without Dialetheism

  To ensure LNT is not merely a defensive maneuver, we must articulate why a classical logician might accept it. A classical logician believes there are no true contradictions. However, they acknowledge that agents are fallible and often hold inconsistent beliefs temporarily.
  For a classical logician, LNT serves as a *heuristic for belief revision*. When an agent detects an inconsistency, they should not immediately discard all beliefs connected to it (which could be too costly). Instead, they should isolate the inconsistency (Localize) and prevent it from influencing other domains until it is resolved (Non-Transmission).
  This aligns with the principle of *minimal mutilation* in belief revision. We want to change our beliefs as little as possible to accommodate new information. If we have a contradiction in domain $D$, the minimal mutilation is to restrict the impact of that contradiction to $D$.
  Thus, LNT is motivated by general epistemic values: efficiency, stability, and coherence. The dialetheist adopts LNT not to save their theory, but because it is the rational way to manage *any* inconsistency, true or not. The only difference is that for the dialetheist, the isolation is permanent for certain domains, whereas for the classical logician, it is a temporary state pending resolution.
  This shared normative ground allows opponents to reject dialetheism without rejecting LNT. They can say, "LNT is a good rule for managing error, but since there are no true errors, the isolation is always temporary." The dialetheist says, "LNT is a good rule for managing truth, and since some truths are contradictory, the isolation is sometimes permanent." The debate shifts from the logic to the metaphysics, which is where it belongs.

  ### 5.2 Avoiding Collapse into Classical Consistency

  The first failure condition is that LNT collapses into classical consistency requirements. If the "bridge premise" requirement is so strict that no contradiction can ever influence another domain, then the contradiction is inert. This would mean the dialetheist is effectively reasoning classically everywhere, rendering the acceptance of true contradictions meaningless.
  To avoid this, LNT must allow for *some* transmission. The bridge premise requirement must be satisfiable. In the worked example (Section 3.4), we saw that if there is a secure connection between semantics and physics (e.g., in a physicalist theory of truth), the transmission is allowed.
  The dialetheist must be willing to accept that some physical beliefs might be influenced by semantic contradictions. For instance, if the theory of truth implies something about the limits of computation, and computation is physical, then the Liar paradox might have physical implications. LNT allows this, provided the bridge is warranted.
  This distinguishes LNT from a "quarantine" strategy that treats contradictions as diseases. LNT treats them as hazardous materials: they can be transported, but only with proper containment and documentation (the bridge). This preserves the potential for true contradictions to have theoretical bite, satisfying the dialetheic requirement that the view be substantive.

  ### 5.3 Avoiding Circularity

  The second failure condition is that LNT presupposes the falsity of dialetheism. If the warrant function $W(\beta)$ requires that the bridge domain be "consistent," and if "consistent" means "free of true contradictions," then a dialetheist cannot use the principle without admitting that some domains are free of true contradictions.
  This is not circular; it is a core tenet of dialetheism. Dialetheists do not claim *all* contradictions are true. They claim *some* are. Therefore, they are committed to the existence of consistent domains. The "classical recapture" is part of the dialetheic position.
  LNT formalizes this recapture. It does not presuppose the falsity of dialetheism; it presupposes the *partiality* of dialetheism. As long as the dialetheist maintains that most of the world is consistent, they can use LNT without contradiction. The only risk is if the dialetheist claims that *every* domain is contradictory. But no serious dialetheist makes this claim. Therefore, LNT is compatible with the dialetheic worldview.
  For the opponent, the principle is acceptable because it treats consistency as the default warrant. They can reject the dialetheic application (where the warrant is permanent) while accepting the classical application (where the warrant is provisional). Thus, the principle is neutral ground.

  ### 5.4 Scope and Limitations

  The proposal restricts the formal work to propositional cases. This is a necessary limitation for a one-semester project. Modal logic and set theory introduce complexities (e.g., possible worlds semantics, naive set theory) that would require a more robust logical framework than LP. However, the conceptual architecture of LNT does not depend on these extensions. The notion of domains and bridge premises applies equally to modal claims. "Necessarily $A$" belongs to a modal domain. Transmission to the actual domain requires a bridge (e.g., the T-axiom).
  By restricting the scope, the project ensures a rigorous treatment of the core normative issue without getting bogged down in technical proofs that might obscure the philosophical contribution. The goal is a normative framework, not a new logical system. The propositional restriction is sufficient to demonstrate the viability of the normative principle.

  ## 6. Conclusion

  This research proposal has identified a significant gap in the dialetheism literature: the lack of a normative theory of belief revision that accounts for the management of true contradictions. While paraconsistent logic solves the problem of logical explosion, it does not solve the problem of rational inference across domains. The proposed principle of Localized Non-Transmission (LNT) addresses this gap by requiring explicit warrant for the cross-domain propagation of inferences derived from contradictory premises.

  The project is structured to ensure both rigor and viability. By formalizing LNT within existing paraconsistent frameworks, it avoids the pitfall of inventing ad hoc logical constants. By testing the principle against objections regarding trivialism, error, and ad hocness, it ensures the framework is robust. By grounding the motivation in general epistemic practices (database management, legal theory, contextualism), it ensures the principle is not merely a defensive maneuver for dialetheism.

  The success of this project would provide dialetheists with a coherent account of how they can be rational agents in a contradictory world. It would show that accepting true contradictions does not require abandoning the norms of rational inference, but rather refining them to account for domain sensitivity. For opponents, it offers a clear point of engagement: they can accept the normative framework while rejecting the metaphysical claim that any domain actually contains a true contradiction. This moves the debate forward from a stalemate over logic to a productive discussion about the structure of rational belief.

  The failure conditions are clear and manageable. If LNT collapses into classical consistency, it will be because the bridge premise requirement is too strict; this can be adjusted by calibrating the warrant function. If it proves circular, it will be because the notion of "domain" presupposes consistency; this can be addressed by defining domains thematically rather than logically. Given the conceptual resources available in belief revision theory and paraconsistent logic, these risks are mitigable.

  In sum, Localized Non-Transmission offers a tractable, philosophically rich avenue for research. It respects the constraints of the field while pushing the boundaries of how we understand the relationship between logic, truth, and rational belief. By isolating the normative gap and proposing a structured solution, this project aims to contribute a lasting tool to the toolkit of both dialetheists and their critics. The result will be a clearer understanding of what it means to believe rationally in the face of contradiction, a question that lies at the heart of the dialetheic challenge.
