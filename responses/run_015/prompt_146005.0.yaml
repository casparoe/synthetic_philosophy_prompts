  **(Self-Correction during drafting):** I need to make sure I don't take sides. My job is to diagnose the *structure* of the disagreement. I must point out that the "beef is better" argument often relies on 100% grass-fed assumptions which aren't scalable, whereas the "chicken" argument relies on industrial feed. The comparison needs to be standardized.

  11. **Final Output Structure:**
