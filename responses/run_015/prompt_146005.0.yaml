      *   **Context:** Environmental ethics seminar.
      *   **Conflict:** Friend argues beef is better for wild animals than chicken (due to crop deaths in feed vs. pasture). Opponents argue this is a category error (intentional vs. accidental, sentience weighting, moral equivalence).
      *   **User's Hypothesis:** The stall isn't about empirical numbers but about the moral distinction between "indirect system-level mortality" vs. "direct choice-level harm." They suspect both sides are answering different questions.
      *   **User's Request:** An honest diagnosis. Is it moral attribution (intuitions) or substantive factual disagreement (land-use, biomass)? What could break the deadlock (conceptual distinction, formal model, counterfactual baseline)?

