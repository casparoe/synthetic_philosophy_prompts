      *   Empirical Layer: Per hectare vs. Per calorie.
      *   Moral Layer: Aggregation & Attribution.
      *   The Breakthrough: Change the baseline and formalize the weights.

  12. (Review against constraints): Keep it thoughtful, not preachy. Acknowledge the complexity.

  13. *Final thought:* The user's intuition is spot on. They are asking different questions. One asks "Which land use is nicer?" The other asks "Which diet causes less harm?" These are not the same.

