answer: |-
  Here is the translation, the stress test, and the residue report.

  ### The Copy Desk Translation

  Stop thinking about this as ethics. Think of it as a sourcing policy for moral claims.

  **The Nut Graf:**
  A policy is valid only if every single person affected by it could sign off on the sourcing. If your story relies on a principle that crushes one source to satisfy a thousand readers, you don't have a story; you have a libel risk on the person you crushed.

  **The Aggregation Problem (Column Inch Arithmetic):**
  You cannot fill a section with a thousand minor grievances to justify burying one major tragedy. In our current impact heuristic, we multiply reach by severity. Contractualism says that math is false. You cannot add up the "reach" of a thousand people who are slightly annoyed to outweigh the "severity" of one person who is ruined.

  In newsroom terms: You cannot clear a story by saying, "Sure, this destroys Source A's life, but we got 500 tweets from people who wanted the info." Those 500 tweets are 500 separate filings. None of them have the standing to authorize the destruction of Source A. Each tweet is a separate complaint that has to be answered to the tweeter, not pooled into a "public interest" slush fund.

  **The No Impersonal Standpoint (The Byline Rule):**
  There is no such thing as "The Public." There are only readers. When we write "the public deserves to know," we are using a placeholder for a group that doesn't exist as a single entity. You have to justify the story to the specific reader who gets hurt by it, not the abstract concept of the audience. If you can't name the person bearing the cost, you haven't cleared the risk.

  ### Stress Test: The Clearance Rule

  Your rule: *Before any claim goes in the piece you have to be able to answer, in one sentence, the objection of whoever ends up worst off under that claim, and you are never allowed to add complaints together across people who can't be named in the story.*

  **Where it holds:**
  It correctly identifies that the "worst off" person holds a veto power that the "slightly inconvenienced" crowd does not. It forces the reporter to face the identifiable victim rather than hiding behind the "greater good." It stops the aggregation of trivial complaints.

  **Where it smuggles:**
  1.  **The "One Sentence" Constraint:** Contractualism requires that the objection be *reasonably* answered, not *briefly* answered. By demanding a one-sentence response, you are prioritizing the nut graf over the moral reality. You are forcing a complex justification into a soundbite. That's a newsroom value (brevity) overwriting a moral value (reasonableness).
  2.  **The "Named" Constraint:** You say you can't add complaints across people "who can't be named." Contractualism protects the anonymous individual just as hard as the named one. A source who speaks on background still has a standpoint. Your rule ties moral weight to editorial visibility. It implies that if you can't put a name in the story, their complaint doesn't count toward the aggregation limit. That turns moral status into a function of on-the-record clearance.
  3.  **The "Worst Off" Focus:** The rule asks you to answer the objection of the *worst off*. Contractualism asks if *anyone* could reasonably reject the principle. Sometimes the person worst off still can't reasonably reject the principle (e.g., a criminal convicted by fair rules). Your rule risks turning into a "protect the victim" policy rather than a "justify the rule" policy.

  ### Residue Report

  **What carries over cleanly:**
  The **Identifiable Victim Effect**. Newsrooms already understand that one named child in a well is worth more column inches than a thousand unnamed famine victims. Contractualism validates this instinct not as a bias, but as a structural requirement. The idea that you need to clear the story with the person most harmed is standard sourcing practice, even if we don't apply it to moral principles.

  **What survives with distortion:**
  **Proportionality of Column Inches.** In news, space is allocated by interest. In contractualism, "space" (moral weight) is allocated by burden. The distortion is that newsrooms treat attention as the currency; contractualism treats burden as the currency. You can translate the concept, but you can't fund it.

  **What has no expression at all:**
  **The Rejection of the Impersonal Standpoint.** News *requires* an impersonal standpoint. "The Public Interest," "The Community," "Our Readers." These are fictions we need to sell papers and justify intrusion. Contractualism says these fictions are morally inert. You cannot run a newspaper without the impersonal standpoint. Therefore, you cannot run a newspaper on strict contractualist grounds.

  **Blunt Answer 1: The Impact Heuristic**
  Your impact heuristic (Reach × Severity) is utilitarian all the way down. Contractualism breaks it. It says Severity (for one) > Reach (of many). This translation only works for a desk that doesn't exist: an Ombudsman's office with infinite space and zero commercial pressure. In a real news meeting, if you argue that one person's severe complaint outweighs 10,000 readers' mild interest, the Editor will kill the story for lack of impact. The translation is operationally insolvent.

  **Blunt Answer 2: Representative Anecdote vs. Individual Standpoint**
  This is a pun on the word "individual," and it's dangerous. A representative anecdote is chosen *because* it stands for the many. It is a synecdoche. The contractualist individual stands *against* the many. They are the exception that blocks the rule. If you treat the "worst-off source" as a representative anecdote, you are absorbing them into the aggregate you claim to reject. You are making them a symbol for the story, rather than a veto on the story.

  ### The Table

  | claim_stated_straight | newsroom_rendering | verdict | diagnosis |
  | :--- | :--- | :--- | :--- |
  | **Principles must be justifiable to each person.** | **Sourcing must clear with every affected source, not just the majority.** | Distorted | Newsroom vocab fault. "Sourcing" implies factual accuracy, not moral permission. |
  | **Aggregating trivial burdens cannot outweigh a severe burden.** | **You cannot fill a section with minor complaints to justify burying one major tragedy.** | Clean | Newsroom vocab fault. "Section" implies space, but the logic holds. |
  | **There is no impersonal standpoint (no "society").** | **There is no "Public," only readers.** | Unsayable | Original claim fault. News cannot function without the "Public" construct. |
  | **Reasonable rejection determines wrongness.** | **If a source has a valid objection, the claim is killed.** | Distorted | Newsroom vocab fault. "Valid objection" in news means factual error, not moral burden. |
  | **My Clearance Rule (Answer worst-off, no unnamed aggregation).** | **Clearance Rule: Answer the worst-off in one sentence; unnamed complaints don't pool.** | Distorted | Newsroom vocab fault. "One sentence" and "unnamed" impose editorial limits on moral status. |
