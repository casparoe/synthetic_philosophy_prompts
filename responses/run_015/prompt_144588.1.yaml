      *   The core intuition is *uncertain evidence*.
      *   The core mathematical constraint is *Rigidity* (Jeffrey's Condition): $P_{new}(H|E_i) = P_{old}(H|E_i)$.
      *   The core problem is *Communtativity*: JC updates generally don't commute.

