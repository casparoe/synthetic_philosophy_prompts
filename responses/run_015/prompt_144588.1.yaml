answer: |-
  Here is a 75-minute lesson plan designed to move your group from Standard Bayes to Jeffrey Conditionalization (JC) via discovery, using a single running example that forces the issue.

  ### The Running Example: The "Fuzzy Medical Diagnosis"
  **Why this example:** It avoids the abstract "dim light" vibe. It creates a situation where likelihoods ($P(E|H)$) are unavailable (blocking Standard Bayes), but direct credence shifts are intuitive. It uses overlapping partitions to guarantee non-commutativity.

  **The Setup:**
  *   **Hypothesis Space:** A patient has one of three conditions: **Healthy ($H$)**, **Viral ($V$)**, or **Bacterial ($B$)**.
  *   **Prior:** $P(H)=0.5, P(V)=0.3, P(B)=0.2$.
  *   **Experience 1 (The Thermometer):** You take a temperature. It's slightly elevated, but the device is old. You don't become certain of "Fever." You simply feel your credence shift: You are now **0.8 confident there is a fever** ($V$ or $B$) and **0.2 confident Healthy** ($H$). The thermometer *cannot* distinguish Viral from Bacterial.
  *   **Experience 2 (The Throat Swab):** You look at the throat. It's inflamed, but inconclusive. You feel your credence shift: You are now **0.7 confident it's an infection** ($V$ or $B$) and **0.3 confident it's not** ($H$)... *Wait, no.*
      *   *Correction for Non-Commutativity:* To make order matter, the second experience must cut across the first partition.
      *   **Revised Experience 2:** You check for a specific bacterial marker. It's faint. You shift credence to: **0.6 confident Bacterial ($B$)**, **0.4 confident Not-Bacterial ($H$ or $V$)**.
  *   **The Conflict:** Exp 1 preserves the ratio of $V:B$ (thermometer doesn't know the difference). Exp 2 preserves the ratio of $H:V$ (marker test doesn't distinguish Healthy from Viral).

  ---

  ### Phase 1: The Trap of Standard Bayes (0–15 mins)
  **Goal:** Establish that Standard Conditionalization ($P_{new}(H) = P_{old}(H|E)$) requires certainty ($P_{new}(E)=1$), and show why "conditioning on the experience" fails here.

  1.  **Write the Prior** on the board: $H=0.5, V=0.3, B=0.2$.
  2.  **Present Experience 1:** "You check the thermometer. It's ambiguous. You walk away feeling 80% sure there's a fever ($V \cup B$) and 20% sure it's Healthy ($H$)."
  3.  **Ask:** "How do we update the probability of $V$ using Bayes' Theorem?"
      *   *Expected Move:* Someone will suggest conditioning on $E =$ "Thermometer reads elevated."
      *   *The Block:* Ask for the likelihood: $P(\text{Reads Elevated} | \text{Viral})$.
      *   *The Trap:* They won't have it. In this scenario, the agents don't know the reliability of the thermometer. They only know their *resultant confidence*.
      *   *The Misconception Head-Off:* Someone will say, "Condition on the proposition 'I feel 80% sure'."
      *   *Your Response:* "That's a proposition about your mind, not the patient. If you condition on that, you're updating on your own psychology, not the disease. We need to update the disease probabilities directly based on the *strength* of the evidence, not a proposition that became certain."
  4.  **Conclusion of Phase:** We need a rule that takes a **distribution** over a partition as input, not a single proposition that goes to 1.

  ### Phase 2: Deriving Rigidity (15–35 mins)
  **Goal:** Let them construct the Jeffrey rule by arguing for what *shouldn't* change.

  1.  **Focus on the Partition:** Experience 1 divides the world into $\{H, \text{Fever}\}$.
  2.  **Ask:** "The thermometer told you something about Healthy vs. Fever. Did it tell you anything about Viral vs. Bacterial?"
      *   *Consensus:* No. It's blind to that distinction.
  3.  **Ask:** "So, how should the odds between $V$ and $B$ change?"
      *   *Target Insight:* They shouldn't change. If the evidence is silent on the distinction, the relative likelihoods should remain **rigid**.
      *   *Write on Board:* $\frac{P_{new}(V)}{P_{new}(B)} = \frac{P_{old}(V)}{P_{old}(B)}$.
  4.  **The Calculation:**
      *   We know $P_{new}(H) = 0.2$. So $P_{new}(V) + P_{new}(B) = 0.8$.
      *   We know $P_{new}(V) / P_{new}(B) = 0.3 / 0.2 = 1.5$.
      *   Have a student solve for $P_{new}(V)$ and $P_{new}(B)$.
  5.  **Generalize:** Ask them to write the algebra for a generic partition $\{E_i\}$.
      *   Guide them to: $P_{new}(H) = \sum P_{old}(H | E_i) \cdot P_{new}(E_i)$.
      *   *Note:* Do not call it "Jeffrey Conditionalization" yet. Call it "The Rigidity Rule."

  ### Phase 3: The Order Problem (35–55 mins)
  **Goal:** Demonstrate non-commutativity and show that neither order is obviously "wrong."

  1.  **Introduce Experience 2:** "Now you check the bacterial marker. You become 60% confident it's Bacterial ($B$) and 40% Not-Bacterial ($H \cup V$). This test is blind to the difference between $H$ and $V$."
  2.  **Split the Room:**
      *   **Group A:** Update on Thermometer first, then Marker.
      *   **Group B:** Update on Marker first, then Thermometer.
  3.  **The Calculation:** Have them compute the final $P(V)$ for both groups.
      *   *Group A (Thermo $\to$ Marker):*
          1.  Thermo preserves $V:B$ ratio. $H$ drops.
          2.  Marker preserves $H:V$ ratio *from the intermediate step*. $B$ rises.
      *   *Group B (Marker $\to$ Thermo):*
          1.  Marker preserves $H:V$ ratio. $B$ rises.
          2.  Thermo preserves $V:B$ ratio *from the intermediate step*. $H$ drops.
  4.  **Reveal:** The final probability for $V$ will differ. (Specifically, the "middle" hypothesis $V$ gets squeezed differently depending on which ratio was locked in first).
  5.  **The Discussion:** "Which order is correct?"
      *   *Expected Intuition:* "Whichever test was more reliable?" or "Whichever happened first?"
      *   *The Hard Truth:* JC doesn't tell you. If the experiences are genuinely just "shifts in confidence" without a causal story about *why* they shifted, the order is arbitrary.
      *   *Head Off Misconception:* Someone will say, "This proves the rule is broken."
      *   *Your Response:* "It proves the *input* is underspecified. If you have a causal model (Standard Bayes), order doesn't matter. If you only have confidence shifts (JC), order matters. That's the cost of doing business without likelihoods."

  ### Phase 4: The "Minimal Change" Defense & Scope (55–65 mins)
  **Goal:** Address the justification for JC and limit the scope.

  1.  **The Defense:** Ask, "Why use this rule at all if order matters?"
      *   *Guide them:* "What did we minimize?"
      *   *Answer:* Information change. We changed the probabilities of the partition cells ($H$, Fever) exactly as much as the experience demanded, and changed *nothing else* (Rigidity).
  2.  **What to Refuse (Say this out loud):**
      *   "We are **not** discussing Dutch Book arguments for JC today. That requires betting setups we don't have time for."
      *   "We are **not** solving the Order Problem. There is no consensus solution (e.g., Field's dynamic rule) that works for all cases. We are acknowledging it as a feature of uncertain evidence."
      *   "We are **not** generalizing to continuous partitions. Keep it discrete."
  3.  **The "Minimal Change" Misconception:**
      *   *Misconception:* "It's correct because it's the most conservative update."
      *   *Head Off:* "Conservative relative to what? As we saw, 'conservative' depends on which conditional probabilities you choose to freeze. Rigidity is a substantive assumption, not a logical truth."

  ### Phase 5: The Closing Question (65–75 mins)
  **Goal:** Separate formula memorizers from those who understand the *constraint*.

  **The Question:**
  "Return to the Medical Example. Suppose I tell you that the Thermometer is actually known to be **more sensitive to Viral fevers than Bacterial fevers**. Specifically, if the thermometer reads 'elevated,' it is twice as likely to do so given Viral than given Bacterial."

  **Ask:** "Can we still use the Jeffrey Conditionalization rule we just derived for the first update? Why or why not?"

  **The Answer Key:**
  *   **Memorizer:** "Yes, just plug the numbers into the formula." (They miss that the formula assumes Rigidity).
  *   **Understander:** "No. JC requires the **Rigidity Condition** ($P_{new}(V|Fever) = P_{old}(V|Fever)$). If the thermometer is more sensitive to Viral, the evidence *does* distinguish between $V$ and $B$ within the 'Fever' cell. The odds between $V$ and $B$ *should* change. Using JC here would ignore relevant information contained in the likelihoods. You must use Standard Bayes."

  ### Dependencies Summary
  1.  **Bayes Limit** depends on establishing that $P(E)=1$ is unrealistic for fuzzy experiences.
  2.  **Rigidity** depends on the intuition that evidence silent on a distinction shouldn't alter that distinction.
  3.  **The Formula** depends on Rigidity + Probability Axioms.
  4.  **Non-Commutativity** depends on applying Rigidity to overlapping partitions sequentially.
  5.  **Closing Question** depends on understanding that Rigidity is a substantive constraint, not a universal law.

  ### Facilitator Notes
  *   **Don't derive the algebra on the board immediately.** Let them struggle with the "Thermometer preserves $V:B$ ratio" intuition first. If they accept that, the formula falls out naturally.
  *   **Watch for "Likelihood Sneaking."** If a student insists on assigning $P(\text{Reads High} | \text{Viral})$, congratulate them on reverting to Standard Bayes, but remind them the exercise is for cases where those numbers are *unknown*.
  *   **Keep the example dry.** Literally. Don't let the medical details get too complex; the math is the point.
