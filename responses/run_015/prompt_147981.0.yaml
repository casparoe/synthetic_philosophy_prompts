answer: |-
  These practices presuppose no consistent philosophical theory but rather a fragmented instrumentalism unified by the axiom that labor is the default state of human value, treating leisure as either a regulated exception, a bureaucratic threshold, or a moral vice.

  The three examples represent contradictory frameworks coexisting within global capitalism: the French model treats leisure as a civic liberty protected by the state against market encroachment; the Japanese model treats life as a biopolitical risk managed through compensation only after measurable physical collapse; and the Protestant ethic treats work as a moral calling where excessive labor validates character. Despite these contradictions, they share a foundational hierarchy where labor is the central organizing principle of adult existence. In all three, leisure is derivative: it is either a legal shield to restore labor power (France), a medical止损 (stop-loss) to compensate for destroyed labor power (Japan), or a suspect absence of labor power (Protestant ethic). None treat non-work time as the primary purpose of life or a positive good in itself.

  A labor policy built on leisure as a primary right would need to invert this hierarchy by decoupling survival from employment, likely through mechanisms like Universal Basic Income, thereby making work voluntary rather than coercive. It would shift the burden of proof so that employers must justify any intrusion on private time rather than employees requesting protection from it, and it would redefine citizenship to value civic participation and care work equally with market productivity. Ultimately, it requires moving from regulating the *conditions* of labor to regulating the *necessity* of labor, treating free time not as recovery for work but as the space where human flourishing primarily occurs.
