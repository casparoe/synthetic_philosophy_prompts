answer: |-
  ### Exam Question

  **Question 5 (25 Marks)**

  Imagine a Neo-Malthusian writing in 1970. Confronted with the fact that Malthus's 1798 prediction of subsistence crisis did not materialize in England by 1850, this theorist argues: *"The principle remains valid; the deadline was merely miscalculated due to unanticipated fossil fuel subsidies. The crisis is now rescheduled for 2050, measured not in grain prices but in energy-return-on-investment."*

  Using the framework from the final unit, evaluate this reformulation. Does this constitute a **degenerating research programme**, an **unfalsifiable tautology**, or a **genuine constraint** (akin to a budget constraint)? In your answer, you must apply the **deadline test** discussed in lectures. Specifically, articulate what additional specifications would be required for the defense of being *"right but early"* to function as a scientific claim rather than a face-saving formula. Avoid generic discussions of the Green Revolution or Demographic Transition; focus strictly on the logical structure of the prediction and its rescue.

  ***

  ### Model Answer

  The Neo-Malthusian's 1970 statement employs all three standard rescue moves to insulate the core principle from falsification. By shifting the crisis from 1850 to 2050, they engage in **re-dating**. By shifting the locus from England to the global system (implied by the 2050 global crisis), they engage in **re-scaling**. By shifting the metric from grain prices to energy-return-on-investment, they engage in **re-describing the variables**. While these moves are logically permissible in isolation, their simultaneous deployment risks rendering the theory immune to empirical refutation.

  To adjudicate whether this is a degenerating programme or a genuine constraint, we must apply the **deadline test**. A long-run prediction retains cognitive content only if it commits to a specific date, threshold, or observable difference that could, in principle, be missed. If the theory allows for an infinite sequence of postponements without penalty, it collapses into a tautology: *"Crisis will occur when conditions no longer allow growth."* This is true by definition but predicts nothing. The 1970 statement risks this fate if "2050" is treated as movable whenever technology intervenes.

  However, the reformulation can be salvaged as a **genuine constraint** if it behaves like an accounting identity or budget constraint rather than a causal forecast. A budget constraint does not predict *when* you will run out of money, but it dictates that *if* spending exceeds income, insolvency must follow. Similarly, a Malthusian constraint holds that *if* consumption exceeds regeneration, collapse follows. The 1970 theorist identifies fossil fuels as a one-time stock subsidy that temporarily relaxed the constraint.

  For the defense of being **"right but early"** to be more than a face-saving formula, the theorist must specify the **exhaustion mechanism** of the stopgap. It is not enough to say "technology delayed us." They must specify: (1) the finite quantity of the delaying resource (fossil fuels), and (2) the threshold at which that resource no longer masks the underlying geometric/arithmetic divergence. If the theorist can define a specific Energy-Return-on-Investment (EROI) threshold below which the subsidy fails, the claim becomes falsifiable. If 2050 passes without crisis *and* without a specified reason why the deadline moved again, the programme degenerates.

  Therefore, the 1970 statement is currently a **degenerating research programme** because it relies on ad hoc adjustments to the deadline and variables without a fixed rule for when the adjustments must cease. To become a genuine constraint, it must surrender the ability to move the goalposts indefinitely. It must accept that if the fossil fuel subsidy persists beyond the new deadline without the predicted collapse, the core mechanism (that population inevitably outruns subsistence) is false, not just early. The "deadline test" demands that the theorist risk being wrong. If the theory can survive any finite run of prosperity by simply re-describing the binding resource, it is no longer a prediction; it is a faith.

  ***

  ### Marking Scheme (25 Marks)

  **Grading Note:** Answers that merely label the moves as "Popperian" or "Lakatosian" without applying the specific **Deadline Test** logic from the course are capped at **15/25 (B Range)**. High marks require engaging with the *conditions* of falsifiability, not just the taxonomy of philosophy of science.

  **1. Identification of Rescue Moves (5 Marks)**
  *   **5:** Clearly identifies Re-dating (1850→2050), Re-scaling (England→Global/Implicit), and Re-describing (Grain→Energy/EROI) within the hypothetical.
  *   **3:** Identifies the moves but treats them as historical facts (e.g., discussing actual oil prices) rather than logical maneuvers.
  *   **0:** Fails to identify the moves or confuses them with historical outcomes (Green Revolution).
  *   *Typical Botch:* Students discuss Ehrlich vs. Simon instead of analyzing the logical structure of the prompt's hypothetical.

  **2. Application of the Deadline Test (5 Marks)**
  *   **5:** Explicitly uses the "Deadline Test" criterion: a prediction needs a commit to a date/threshold that could be missed to have content.
  *   **3:** Mentions falsifiability generally but misses the specific "finite run of prosperity" criterion from lectures.
  *   **0:** Ignores the Deadline Test in favor of general commentary on Malthus.
  *   *Typical Botch:* Treating the Deadline Test as a generic "was he right?" question rather than a logical condition for scientific content.

  **3. Distinction: Tautology vs. Constraint (5 Marks)**
  *   **5:** Distinguishes between a tautology (crisis happens when it happens) and a constraint (binding limit like a budget identity).
  *   **3:** Uses the terms but conflates them (e.g., calls a budget constraint a forecast).
  *   **0:** No distinction made; treats all predictions as forecasts.
  *   *Typical Botch:* Arguing that because it's an "identity" it can't be wrong, missing the point that identities constrain outcomes but don't predict timing without exogenous inputs.

  **4. Conditions for "Right but Early" (5 Marks)**
  *   **5:** Specifies that "right but early" requires defining the *stopgap mechanism* and its *exhaustion point* (e.g., specific EROI threshold).
  *   **3:** States that "more data is needed" or "technology must be accounted for" without specifying the exhaustion condition.
  *   **0:** Accepts "right but early" as a valid defense without conditions.
  *   *Typical Botch:* Accepting the "right but early" defense as valid simply because Malthus was historically prescient, ignoring the logical requirement for a fixed stopping rule.

  **5. Final Verdict & Justification (5 Marks)**
  *   **5:** Concludes it is currently **degenerating** unless specific exhaustion criteria are met. Justification ties back to the inability to survive infinite prosperity.
  *   **3:** Concludes it is degenerating but relies on name-dropping (Lakatos/Popper) rather than the Deadline Test logic.
  *   **0:** No clear verdict or contradictory verdict.
  *   *Typical Botch:* **The Cap:** Giving a sophisticated philosophical verdict (e.g., "It is a Lakatosian negative heuristic") but failing to apply the course-specific Deadline Test logic limits this section to 3/5.
