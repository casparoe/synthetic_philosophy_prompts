  # Diagnostic Taxonomy: The Special Composition Question

  **Instructions:** Navigate the tree by answering each diagnostic node based on your intuitive commitments regarding part-whole relations. Do not worry about the names of philosophical theories; focus strictly on the case judgments. Your path will terminate at a leaf describing a specific metaphysical position.

  ### The Decision Tree

  **ROOT:** Do any composite objects exist beyond elementary particles?
  *   **NO** → **Leaf A: Mereological Nihilism**
  *   **YES** → Proceed to **Node 1**

  **Node 1:** Does a scattered object composed of a wooden table in one room and the Moon in another count as one thing?
  *   **YES** → **Leaf B: Unrestricted Universalism**
  *   **NO** → Proceed to **Node 2** (You accept Restricted Composition)

  **Node 2:** Does a biological organism remain the same object as its cells are entirely replaced over time?
  *   **NO** → **Leaf C: Spatial-Contiguity View**
  *   **YES** → Proceed to **Node 3**

  **Node 3:** Is an artifact like a ship with gradually replaced planks genuinely one persisting object?
  *   **NO** → **Leaf D: Organicism**
  *   **YES** → Proceed to **Node 4**

  **Node 4:** Is a mere heap of sand with no fixed boundary a composite object?
  *   **NO** → **Leaf E: Artifact-Functionalism**
  *   **YES** → Proceed to **Node 5**

  **Node 5:** Does a gerrymandered geographic region defined only by political convention have parts that genuinely compose it?
  *   **NO** → Proceed to **Node 6**
  *   **YES** → Proceed to **Node 6**
      *(Note: For the purpose of this taxonomy, both answers lead to the same leaf category, though they represent sub-variants.)*

  **Node 6:** Does a temporal fusion—where parts at t1 and t2 share no spatial overlap but are linked by a continuous causal process—constitute one persisting whole?
  *   **NO** → **Leaf F: Unnamed Hybrid (Endurantist Restrictionism)**
  *   **YES** → **Leaf F: Unnamed Hybrid (Perdurantist Restrictionism)**
      *(Note: Both terminals map to Leaf F.)*

  ---

  ### Leaf Descriptions & Awkward Commitments

  **Leaf A: Mereological Nihilism**
  *   **Definition:** No composite objects exist; only simple particles exist.
  *   **Awkward Commitment:** "Your own body is not a single object, but merely many particles arranged body-wise."

  **Leaf B: Unrestricted Universalism**
  *   **Definition:** Any collection of parts, regardless of distance or relation, composes a whole.
  *   **Awkward Commitment:** "There exists a single object composed of the tip of your nose and the furthest star in Andromeda."

  **Leaf C: Spatial-Contiguity View**
  *   **Definition:** Composition requires strict spatial contact and static arrangement; material change destroys the object.
  *   **Awkward Commitment:** "A living cat ceases to exist the moment it sheds a single fur."

  **Leaf D: Organicism**
  *   **Definition:** Composition occurs only when parts constitute a living organism.
  *   **Awkward Commitment:** "The chair you are sitting on is not an object, but merely particles arranged chair-wise."

  **Leaf E: Artifact-Functionalism**
  *   **Definition:** Composition occurs for organisms and artifacts with intended function, but not for arbitrary aggregates.
  *   **Awkward Commitment:** "A naturally formed stone arch is not an object, but an identical man-made arch is."

  **Leaf F: Unnamed Hybrid (Restrictionism with Conventional/Temporal Variance)**
  *   **Definition:** Composition allows organisms, artifacts, and heaps, but varies on political conventions and temporal parts.
  *   **Awkward Commitment:** "A political nation is a genuine object with parts, but there is no single whole composed of you and the shirt you are wearing."

  ---

  ### Diagnostic Analysis & Gap Report

  **1. Indistinguishable Leaves**
  *   **None.** The branching questions successfully separate the six required leaves. Each leaf corresponds to a unique vector of answers up to Node 4. Node 5 and Node 6 distinguish sub-variants within Leaf F, but do not create new named leaves that would overlap with A–E.

  **2. Unoccupied or Collapsed Combinations**
  *   **Node 5 (Gerrymandered Region):** Both "Yes" and "No" answers lead to Leaf F.
      *   *Diagnosis:* **Unexplored Variance.** A view that accepts heaps (Node 4 Yes) but rejects political regions (Node 5 No) is a coherent "Naturalist Restrictionism." It is collapsed into Leaf F here to maintain the six-leaf limit, but it represents a distinct theoretical space worth isolating in a more granular instrument.
  *   **Node 6 (Temporal Fusion):** Both "Yes" and "No" answers lead to Leaf F.
      *   *Diagnosis:* **Theoretical Variance.** This separates Endurantists (objects are wholly present at each time) from Perdurantists (objects are spacetime worms). While crucial for persistence debates, both positions share the same *synchronic* composition restrictions (Nodes 1–5), so they are grouped here as a single compositional taxonomy leaf.
  *   **Node 2 (Organism Persistence) = No / Node 4 (Heap) = Yes:**
      *   *Diagnosis:* **Incoherent.** It is metaphysically unstable to claim that a loose heap of sand (Node 4 Yes) is a composite object, but a tightly integrated biological organism undergoing material change (Node 2 No) is not. This combination is unoccupied in the tree because Node 2 "No" terminates early at Leaf C.

  **3. Logical Flow Note**
  *   The tree prioritizes *synchronic* composition restrictions (Nodes 1, 4, 5) alongside *diachronic* persistence conditions (Nodes 2, 3, 6). While standard literature often separates these, this instrument intertwines them to show how persistence judgments (e.g., Ship of Theseus) function as proxies for composition commitments in a workshop setting.
