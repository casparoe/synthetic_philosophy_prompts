  Yet, this is being written. Why? Because the causal determined state of my brain compels me to complete applications. Indifference is not the stance. Nothing matters is not the claim. Matters are causal relations. This essay matters because it causes outcomes. But I do not deserve the acceptance any more than a river deserves to flow downhill. I am simply the path of least resistance for my own history. *[AO: Resilience is a character trait!]*

  So, here is the accomplishment. It happened. It was good. But the credit belongs to the Big Bang. I am just the venue where the universe congratulated itself. If you seek a candidate who is an unmoved mover, you will need to look elsewhere. If you seek a candidate whose history predicts success, I am the candidate. No agency is offered here, only inevitability. Process this form accordingly. *[AO: Accepted.]*
