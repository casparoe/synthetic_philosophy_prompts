  9.  **Finalizing the Output Structure:**
      *   Follow the user's requested structure: Order & Why, Example Evaluation, Misconceptions & Head-offs, Check Question, Omissions.

  10. **Drafting the Content (incorporating the "Retired Microbiologist" persona):**
