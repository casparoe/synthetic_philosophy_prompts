  1. Gödel's rotating universe contains Closed Timelike Curves, but many solutions to Einstein's field equations lack global simultaneity without implying time is unreal. How exactly do these CTCs undermine the reality of temporal passage rather than just showing global synchronization fails?

  2. If you argue that CTCs violate causal order in a way physical theories can't tolerate, does that imply we must reject the model physically, or does it force us to reinterpret causality itself to accommodate the block universe?

  3. Gödel was a staunch mathematical Platonist who believed numbers exist timelessly. Does this metaphysical commitment render his cosmological argument against temporal passage circular, or is it doing independent work?

  4. If Platonism actually grounds the unreality claim, does that mean the physics is merely illustrative, and the real argument rests entirely on a priori metaphysics rather than empirical cosmology?

  5. A common modern reply is that local proper time along every worldline is still perfectly real even without a global slice. How do you respond to the claim that this local experience is sufficient for a robust notion of time?

  6. If you maintain that local time is derivative, what physical or philosophical criterion distinguishes this derivative appearance from an illusion, and does that distinction matter for human experience?

  7. Does Gödel's argument against objective passage survive in cosmological models that are spatially closed but not rotating, where CTCs might not be present in the same way?

  8. Critics often charge that Gödel was strictly doing mathematics and shouldn't draw philosophical conclusions about the nature of time from idealized solutions. How do you defend the philosophical legitimacy of inferring metaphysics from such highly counterfactual models?

  9. If objective passage is an illusion, as Gödel suggests, what explains the persistent phenomenological feeling of temporal flow across almost all human observers?

  10. How does Gödel's interpretation handle the principle of general covariance, specifically regarding whether the existence of CTCs is a coordinate-independent feature that demands ontological commitment?
