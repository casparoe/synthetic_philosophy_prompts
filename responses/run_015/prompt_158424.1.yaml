      *   *Stance:* I will argue that the satire relies on a rigid institutionalization of "decisiveness" that treats rights as procedural vetoes rather than preference inputs, which is a common practical implementation but arguably narrows Sen's broader philosophical point about social choice functions.

  5.  **Review and Refine:**
      *   Check tone: Is it deadpan? Yes.
