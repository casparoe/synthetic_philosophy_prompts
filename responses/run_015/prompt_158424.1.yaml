      *   Check logic: Does it reflect the tension? Yes, the AI cannot optimize because the rights structure forbids the optimization path.
      *   Check Word Count: Ensure the agreement is around 600 words.

  6.  **Final Polish:**
      *   Ensure the brainstorming section is distinct.
      *   Ensure the Author's Note is clear on the interpretation.

