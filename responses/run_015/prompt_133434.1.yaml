answer: |-
  This is a classic "reflective equilibrium" problem in model-based science. You are oscillating between a Friedmanite instrumentalism (prediction is all that matters) and a Cartwright-style realism (capacities and mechanisms must be truthful). Your intuitions are actually quite sophisticated; the friction comes from trying to apply a single binary label ("okay" vs. "not okay") to what is actually a multidimensional space of model justification.

  Here is a proposal for a unifying principle, an adjudication of your conflicts, and a precise way to handle the prediction/explanation distinction without it being a mere relabeling.

  ### 1. The Unifying Principle: De-idealization Trajectory

  The distinction isn't just about whether an assumption is false (they all are). It's about the **relationship between the idealization and the causal structure it purports to represent.**

  I propose the **Principle of De-idealization Potential**:
  > An unrealistic assumption is methodologically sound if the model remains robust (or can be systematically corrected) as the assumption is relaxed toward reality. It is unsound if the model collapses or requires *ad hoc* parameter tuning to maintain fit when the assumption is relaxed.

  *   **Case 1 (Galileo):** Add air resistance terms. The law of gravity doesn't break; you just add a drag coefficient. The idealization is a **simplifying isolation** of a dominant force. (Verdict: Fine).
  *   **Case 2 (Climate):** Shrink the grid. The physics doesn't change; computational cost rises. The idealization is a **resolution limit**. (Verdict: Fine).
  *   **Case 4 (SIR):** Add network structure. The basic $R_0$ logic holds, but the curve changes. The idealization is a **domain restriction**. (Verdict: Fine, *conditional on domain*).
  *   **Case 6 (Bacteria):** Add stress-induced mutation. The model's core differential equations break; the "constant rate" wasn't a simplification, it was a **causal error**. The model fails in the target domain. (Verdict: Not Okay).

  This principle forces a specific handling of your difficult cases.

  ### 2. Adjudicating Case 3 vs. Case 6

  You asked: *If I have to choose between saving case 3 and saving case 6, which goes?*

  **You must drop the verdict that Case 3 is "cheating" (if you accept Case 1).**

  Here is why: In Case 1, the vacuum is false. In Case 3, the infinite computation is false. If Case 1 is "totally fine," it is because the falsehood isolates a signal (gravity) from noise (air). In Case 3, if the model predicts GDP within 2%, the falsehood of "rational expectations" is functioning as a **statistical aggregation**. It is claiming that *aggregate* behavior mimics rational calculation even if *individual* behavior does not.

  If you condemn Case 3 as "cheating" because the mechanism is false, you must condemn Case 1 for the same reason (vacuums don't exist). To be consistent, you have to acknowledge that **predictive success licenses the idealization *instrumentally*, even if it blocks *explanation*.**

  **Case 6 is the clear failure.** Why? Because it fails the **Domain Validity Test**. It works in the lab (low stress) but fails in the clinic (high stress). The assumption isn't just unrealistic; it is *non-negligible* in the target context. Case 3 succeeds in its target context (GDP forecast).

  **Revised Verdict for Case 3:** It is methodologically acceptable for *forecasting*, but explanatorily bankrupt. It is not "cheating" in the Friedmanite sense, but it is "theoretically stagnant" in the Lakatosian sense (it protects the core from refutation by making the core untestable).

  ### 3. Analyzing Case 7 (Dark Energy / Lambda)

  You are flipping on this because Lambda sits on the fence between **Phenomenological Parameter** and **Ontological Commitment**.

  Using the **De-idealization Principle**:
  *   **Scenario A:** Lambda is treated as a placeholder in an Effective Field Theory (EFT). We acknowledge we don't know the field, but we know the term is required to fit the metric expansion. We are actively looking for the de-idealization (Quintessence, Modified Gravity).
      *   *Verdict:* **Fine (Galileo-style).** It isolates the expansion effect from the mechanism.
  *   **Scenario B:** Lambda is treated as a fundamental constant of nature, and research into dynamic fields is discouraged because "Lambda fits the data."
      *   *Verdict:* **Not Okay (Case 6-style).** It hides ignorance in a parameter that claims to be fundamental.

  **The Distinction:** Case 7 is acceptable *only if* it is explicitly framed as a **phenomenological fit** rather than a **mechanistic explanation**. Your flipping is a correct response to the sociological reality of cosmology: sometimes practitioners treat Lambda as Scenario A, sometimes as Scenario B.
  *   **Principle Application:** If relaxing Lambda (making it dynamic) breaks the fit *and* no one is trying to relax it, it's dogmatic (Bad). If relaxing it is the active research program (Good). Currently, it's mostly Scenario A, so lean toward **Fine**, but with a "provisional" tag.

  ### 4. Making "Prediction vs. Explanation" Precise

  You worry that saying "Case 3 is okay for prediction, not explanation" is relabeling. It is, unless you use an **Interventionist Account of Explanation (Woodward).**

  *   **Prediction:** The model outputs $Y$ given input $X$. (Case 3 does this).
  *   **Explanation:** The model identifies invariant relationships that hold under **interventions**.

  **The Test:** If I intervene on the *mechanism* specified in the model, does the outcome change as predicted?
  *   **Case 1 (Galileo):** If I change the mass, the acceleration stays the same (in vacuum). The model correctly predicts the invariance.
  *   **Case 3 (Rational Expectations):** If I intervene on agent information (e.g., central bank changes transparency), the Rational Expectations model predicts a specific shift in GDP. If agents are actually using heuristics (bounded rationality), the intervention will yield a *different* result than the model predicts, even if the baseline forecast was accurate.

  **Why this isn't relabeling:** It specifies *why* the model fails as an explanation. It lacks **modal robustness**. It gets the actual world right (prediction) but gets the *nearby possible worlds* wrong (explanation/intervention). Case 3 is a "black box" that fits the actual data curve but cannot tell you how the system behaves if you tweak the gears.

  ### 5. Re-evaluating Case 4 (SIR Models)

  You mentioned you might be wrong about Case 4 being okay. Your intuition is sharp here.

  Random mixing is a **Mean-Field Approximation**.
  *   **When it's okay:** When the network degree distribution is Poisson-like (most people have average contacts). Urban flu often fits this.
  *   **When it's not:** When the network is scale-free (superspreaders). Rural spread or STD transmission often fails here.

  **Verdict:** Your verdict ("okay locally, not as universal law") is correct, but needs strengthening. It is **not** just about "insulation." It is about **Topological Robustness**. If the model's output is sensitive to the network structure (which it often is near critical thresholds), the random mixing assumption is not just a simplification; it is a **structural falsity** that limits the model to a very narrow domain.
  *   **Advice:** Don't drop this verdict. It is the strongest example of **Domain Restriction**. It teaches us that idealizations are valid *relative to a specific population structure*.

  ### Summary of Recommended Verdicts

  To achieve consistency with the **De-idealization Potential** principle:

  1.  **Case 1 (Galileo):** **Fine.** (Robust to de-idealization).
  2.  **Case 2 (Climate):** **Fine.** (Computational approximation, physics invariant).
  3.  **Case 3 (Rational Expectations):** **Fine for Prediction, Bad for Explanation.** (Drop the "cheating" label if you accept Case 1. Acknowledge it lacks interventionist validity).
  4.  **Case 4 (SIR):** **Fine (Domain Restricted).** (Valid only where network topology is homogeneous).
  5.  **Case 5 (Neurons):** **Fine (Instrumental).** (Explicitly non-explanatory for cognition).
  6.  **Case 6 (Bacteria):** **Not Okay.** (Fails empirically in target domain; assumption is causally relevant and false).
  7.  **Case 7 (Dark Energy):** **Provisionally Fine.** (Acceptable as phenomenological parameter, unacceptable if reified as fundamental mechanism without further inquiry).

  **The Hard Choice:**
  If you must condemn Case 3 as "cheating," you are taking a **Scientific Realist** stance that prioritizes causal truth over predictive accuracy. If you take that stance, you must admit Case 1 is *also* theoretically flawed (since vacuums don't exist), even if practically useful.
  *   **My advice:** Keep Case 1 as "Fine." Therefore, you must soften Case 3 to "Instrumentally Adequate." Condemn Case 6 instead, because Case 6 fails the minimal bar of **empirical adequacy in the target domain**, whereas Case 3 only fails the bar of **ontological plausibility**. In philosophy of science, empirical failure (Case 6) is a stronger reason for rejection than ontological implausibility (Case 3).

  **Final thought on Friedman:** Friedman argued that the more significant the theory, the more unrealistic the assumptions. Your Case 6 shows the limit of that. Unrealistic assumptions are only tolerable if they are **negligible** (Case 1) or **aggregatively robust** (Case 3). They are not tolerable if they are **causally dominant and false** (Case 6). Your gut feeling on Case 6 is the anchor that keeps you from sliding into total instrumentalism. Hold onto that.
