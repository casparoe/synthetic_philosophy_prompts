answer: |-
  ### 1. The setup as a data-generating process

  We define the unit of analysis as the pre-trigger observer-instance at trial $t$. Time is discrete, $t=1, 2, \dots$. The event of interest is biological death ($D=1$); otherwise, the subject survives ($D=0$). In standard survival analysis, the data-generating process (DGP) actualizes one outcome per unit. Here, we must explicitly assume the Many-Worlds Interpretation (MWI) as the true DGP: at each $t$, the risk set splits. A fraction $p_t$ (Born rule weight) enters the death state; fraction $1-p_t$ enters the survival state. Both branches persist ontologically.

  The "subject" is modeled as a tracker following the survival branch. The denominator question is critical: the external population denominator is all initial instances $N_0$. The internal denominator is the surviving subset $N_t$ at each step. We must model consciousness as a variable that is perfectly correlated with survival—a modeling choice equivalent to assuming informative censoring where death censors consciousness entirely, but survival guarantees continuity. We assume no competing risks; the quantum event is the sole cause of failure. The hazard $h_t$ is the probability of decay triggering the gun. In this DGP, the cumulative incidence of death approaches 1 for the population, but the conditional survival function for the tracker remains $S(t | \text{tracker}) = 1$.

  ### 2. What translates cleanly

  Your intuition about immortal time bias is largely correct, though technically this is closer to conditioning on a post-treatment variable or selection bias. In the external view, we estimate the marginal survival curve $\hat{S}(t)$ over the full risk set $N_0$. This curve decays exponentially. In the internal view, the estimator conditions on $T > t$ at every step. By definition, $P(T > t | T > t) = 1$. You are restricting the analysis to the subset of branches where the event did not occur.

  This maps cleanly to the distinction between marginal and conditional estimands. The external observer sees the marginal effect of the trigger (death probability $\approx 1$). The subject experiences the conditional effect given survival (death probability $= 0$). This is also informative censoring: death removes you from the risk set of "experiencers," so the remaining data stream is systematically biased toward survival. If you treat the sequence of subjective experiences as a longitudinal dataset, you have left truncation at every trial; you only enter the risk set for trial $t+1$ if you survived $t$. The statistical artifact is identical: if you condition on survival, the survival curve looks flat. The divergence between the first-person and third-person claims is exactly the divergence between a conditional survivor function and a marginal population survival function.

  ### 3. What translates only with distortion

  The translation distorts when we map "branches" to "subpopulations." In frailty models, unobserved heterogeneity explains why some subjects survive longer; survivors have lower frailty. In quantum suicide, survivors aren't "luckier" or "lower frailty"; they are in a different ontological bucket. The distortion arises in treating the Born rule weights as probabilities versus measures. In biostats, a path with weight $10^{-100}$ is effectively impossible; we ignore it. In the branching picture, that path exists and is experienced.

  This creates a distortion in the definition of probability. Standard statistics equates probability with frequency or degree of belief. Here, frequency (measure) decays for the survivor, but existence does not. If we treat branches as random effects clusters, we assume sampling from a distribution of worlds. But the subject isn't sampled; they split. The "sampling frame" sleight of hand you suspected is real: the argument switches the denominator from the pre-branch population (where death is likely) to the post-branch survivor count (where death is impossible) without adjusting for the shrinking measure of that survivor count.

  Furthermore, counterfactuals are distorted. Causal inference compares $Y(1)$ and $Y(0)$, knowing only one is realized. Quantum suicide asserts both are realized and experienced by different versions of the unit. Standard identifiability assumptions fail because we cannot observe the "death" outcome for the surviving unit, not because of missing data, but because the unit literally isn't there to report it. The distortion is treating an ontological multiplication of units as a selection bias within a single unit.

  ### 4. What has no counterpart at all

  The component with no statistical counterpart is self-locating uncertainty and the continuity of identity. Biostats assumes a stable unit identity over time; $ID_i$ at $t=1$ is the same entity at $t=10$. In the branching DGP, $ID_i$ splits into $ID_{i,alive}$ and $ID_{i,dead}$. The question "Which one am I?" has no parameter in survival analysis. This is the Sleeping Beauty problem wearing lab coats. If you are a thirder, you update on the fact that you are awake (alive); if a halfer, you stick to the prior. But biostats has no mechanism for "I am the survivor" updating the probability of the DGP itself.

  Additionally, the "measure problem" has no counterpart. In statistics, if a subgroup shrinks to measure zero, it vanishes. In quantum immortality, the measure shrinks, but the subjective experience purportedly remains vivid. Why should anticipation track existence rather than measure? Biostats assumes they are identical. If you survive via a branch with amplitude $10^{-1000}$, standard probability theory says you should be surprised to exist. Quantum immortality says you shouldn't be, because you couldn't observe the alternative. This decoupling of *existence* from *probability weight* is outside the vocabulary of hazard models. We model the risk of death, not the risk of ceasing to be the "primary" consciousness. There is no variable for "degree of reality" versus "presence of experience."

  ### 5. The maiming variant

  This variant exposes the frailty structure. Let health state $H_t$ accumulate damage (maiming) with each trial. The hazard $h_t$ depends on $H_t$. In standard survival analysis, conditioning on survival $T > t$ selects for subjects with lower frailty or better $H_t$. However, in the quantum maiming scenario, the "survival" branch includes all histories where death didn't happen, regardless of $H_t$. As trials pile up, the conditional distribution $P(H_t | T > t)$ shifts toward the worst survivable states. You survive, but $H_t \to \text{max damage}$.

  This is "Quantum Purgatory." Does the branching picture imply this? Yes, if consciousness tracks survival regardless of state. The measure of the "healthy survivor" branch decays faster than the "maimed survivor" branch if maiming is more probable than death. Biostats handles this via cumulative incidence of competing risks (death vs. severe morbidity), but here death is removed as a competitor for the subject. The reductio depends on whether you value $H_t$. If utility depends on health, the expected utility of the survival branch plummets.

  The breakdown occurs at the identity threshold. Biostats treats death as the only truncation event. But if $H_t$ degrades enough, is $ID_{t}$ still the same subject? This is unmodeled. If "you" cease to exist when $H_t$ crosses a threshold, then quantum immortality fails; you die via identity loss even if biological heart beats continue. Your vocabulary cannot ask "When does the subject stop?" without defining death as biological cessation. If the argument relies on psychological continuity, survival analysis lacks the covariates to model it. This isn't just a reductio; it's a specification error in the definition of the event.

  ### 6. Verdict

  Your diagnosis is correct but incomplete. Quantum immortality is indeed immortal time bias combined with a denominator switch: conditioning on the post-treatment variable "consciousness exists" guarantees $S(t)=1$. However, the residue isn't a hole in survival analysis; it's a category error in applying population statistics to subjective identity across branching histories. Survival analysis models uncertainty about *what happens* in a single actualized reality. Quantum immortality models uncertainty about *where I am* in a multiverse.

  The Sleeping Beauty machinery addresses the credence problem (how to bet), but not the ontological one (what exists). The argument sounds clear only because it smuggles in the assumption that "existence" implies "expectation." Biostats correctly identifies that conditioning on survival biases the sample. The "hole" is the expectation that statistical frequency should govern subjective anticipation when the DGP violates the single-reality assumption underlying probability theory. The argument fails not because the math is wrong, but because the estimand—"what will I experience"—is undefined in a framework where "I" splits and "experience" decouples from measure. It's a causal inference problem where the treatment (branching) destroys the unit of analysis.
