answer: |-
  Your intuitions are excellent. You have identified the two fundamental pillars of Augustine's ethics of speech that the magazine passage obscures: the subjective definition of the lie (*contra mentem*) and the theological ontology of sin (injury to the soul/God rather than harm to the neighbor).

  The magazine passage presents a "secularized" Augustine. It retrofits him with a consequentialist framework (harm principle) to make his absolutism seem reasonable to a modern, general-interest audience. While the passage captures the *shape* of some Augustinian distinctions, it gets the *engine* wrong.

  Here is an audit of the passage, claim by claim, followed by answers to your specific questions.

  ### Audit of the Passage

  **Claim 1:** *"For Augustine, a lie is a statement at odds with the facts that is offered as true."*
  *   **Verdict:** **Reversal.**
  *   **Analysis:** This is the most significant error. For Augustine, a lie is not defined by objective falsity ("at odds with the facts") but by subjective intent. In *De Mendacio* (On Lying), he establishes that a lie is speaking *contra mentem* (against one's own mind). If you say something false that you believe to be true, you have not lied (you are merely mistaken). If you say something true that you *believe* to be false, you *have* lied. The essence of the lie is the *voluntas fallendi* (will to deceive), not the correspondence of the statement to reality.

  **Claim 2:** *"What makes it wrong is the injury it inflicts on the person deceived..."*
  *   **Verdict:** **Reversal.**
  *   **Analysis:** Augustine is concerned primarily with the injury the liar inflicts upon *himself* and his relationship with God. Since God is Truth, to lie is to turn away from God. While injury to the neighbor is a consideration, it is secondary. A lie that harms no one (e.g., a lie told to protect someone where the deception is never uncovered) is still a sin because it corrupts the liar's soul. The magazine passage makes Augustine a proto-utilitarian; in reality, he is a theological deontologist.

  **Claim 3:** *"...and so its wrongness comes in degrees proportionate to that injury: a lie that harms nobody is a peccadillo, one that costs a man his reputation is worse, and one that costs a life is the gravest lie there is."*
  *   **Verdict:** **Defensible Simplification / Partial Distortion.**
  *   **Analysis:** Augustine *does* offer a scalar account (eight grades of lies in *De Mendacio*). However, the grading does not track strictly with temporal harm to the victim.
      *   The "gravest" lies for Augustine are usually those against religious doctrine (lies that lead someone away from salvation), not necessarily those that cost a temporal life.
      *   Lies told for "fun" (jocose) or to "help" a neighbor (officious) are lesser sins than malicious lies, but they are still sins.
      *   The magazine implies a secular hierarchy of harm (reputation, life); Augustine's hierarchy is theological (salvation, doctrine, charity).

  **Claim 4:** *"This scalar account is what lets Augustine be an absolutist and still look reasonable — he can forbid the lie to the killer at the door precisely because such a lie risks a life..."*
  *   **Verdict:** **Reversal.**
  *   **Analysis:** Augustine forbids the lie to the "killer at the door" (or the persecutor seeking a fugitive), but *not* because it risks a life. He forbids it because it is a lie. He explicitly argues that one must not commit a sin (lying) to prevent another sin (murder). We are not responsible for the killer's sin, but we are responsible for our own. The magazine suggests the prohibition is contingent on the risk ("precisely because such a lie risks a life"); for Augustine, the prohibition is absolute regardless of the consequence.

  **Claim 5:** *"...while leaving us free to mislead that killer with a true statement he is likely to misread, or simply to say nothing at all."*
  *   **Verdict:** **Mixed (Simplification on silence; Error on misleading truth).**
  *   **Analysis:**
      *   **Silence:** Augustine definitely allows for silence (*taciturnitas*). We are not obligated to disclose truth to those who have no right to it.
      *   **Misleading Truth:** This is trickier. Later casuists (like the Jesuits) developed "mental reservation" based on Augustinian seeds. However, Augustine himself is wary of the *intent* to deceive. In *De Mendacio*, he suggests that if you speak truth *in order* to lead someone into error, you are still lying in your heart, even if your words are true. He permits hiding the truth, but he is uncomfortable with actively cultivating a false belief, even via true statements. The magazine makes him sound more permissive here than he is.

  **Claim 6:** *"Consistently with this, he does not count as lies either the remark made in jest, where nobody expects to be believed, or the assertion you sincerely make that happens to turn out false."*
  *   **Verdict:** **Mixed.**
  *   **Analysis:**
      *   **Sincere Error:** Correct. Augustine agrees this is not a lie because there is no intent to deceive (*fallendi voluntas*).
      *   **Jest:** Incorrect. Augustine *does* count jocose remarks as lies (*mendacia*), provided the speaker knows they are false. He classifies them as a lower grade of sin (venial rather than mortal, potentially), but he does not exclude them from the category of lying. The magazine excludes them to make Augustine seem less severe.

  **Claim 7 (Conclusion):** *"Augustine's absolutism is covertly a harm principle and therefore has nothing distinctive to offer in the case of the murderer at the door."*
  *   **Verdict:** **False Inference (based on the summary, not Augustine).**
  *   **Analysis:** This conclusion follows logically from the *magazine's distorted summary*, but it is false regarding Augustine's actual view. If Augustine were a harm-principle theorist, he would indeed have to allow the lie to save a life. The fact that he *forbids* it proves his absolutism is *not* a harm principle. It is a divine command principle. The magazine concludes he has "nothing distinctive to offer" because it assumes the only distinctive thing to offer is a solution to the dilemma. Augustine's "distinctive offer" is the refusal to solve the dilemma on utilitarian grounds: it is better to suffer evil than to do it.

  ---

  ### Answers to Your Specific Questions

  **1. Does his ordering of the kinds of lie track harm suffered by the person deceived?**
  No. It tracks the **purpose of the lie** and its **relation to religious truth**.
  In *De Mendacio*, Augustine lists eight types. The worst are lies against religious doctrine (damning the soul). The next worst are lies that harm someone without helping anyone (malicious). Lies that help someone in "carnal" matters (like saving a life or protecting property) are lower down the scale, but they are still sins. The metric is spiritual welfare, not temporal harm.

  **2. Can he license the deliberately misleading true statement while forbidding the outright false one, given where he puts the lie?**
  Strictly speaking, **no**, or at least not without qualification.
  Because Augustine locates the lie in the *mind* (*contra mentem*) and the *will to deceive*, a statement that is objectively true but intended to deceive is still morally culpable. He writes: "For he lies who utters what is false with a will to deceive... but he also lies who utters what is true with a will to deceive."
  However, he *does* license **silence**. You may refuse to answer. You may say, "I know where he is, but I will not tell you." The magazine's suggestion that you can actively mislead with a true statement is more characteristic of later Catholic casuistry than of Augustine himself, who viewed the *intent* to create error as the core sin.

  **3. Are jest and sincere error set aside for the reason the essay gives?**
  *   **Sincere Error:** Yes, for the right reason (no intent to deceive), though the essay gets the definition of the lie wrong elsewhere.
  *   **Jest:** No. The essay claims he doesn't count them as lies. Augustine *does* count them as lies, merely less grievous ones. He sets them aside as "officious" or "jocose" sins, not as non-lies.

  **4. Does the conclusion (that his absolutism is a harm principle) follow from Augustine's actual view?**
  **No.** It follows only from the summary.
  The magazine argues: *Augustine forbids lying to the killer because lying risks harm.* Therefore, *if lying prevented harm, it would be allowed.* Therefore, *he is a harm-principle theorist.*
  Augustine's actual argument is: *Lying is a sin against God. We must never sin to prevent a sin.* Therefore, *consequences (harm) are irrelevant to the prohibition.*
  The magazine's conclusion collapses because it assumes Augustine's prohibition is contingent on consequences. It is not. The "distinctive offer" Augustine makes is precisely the counter-intuitive claim that you must let the murderer kill rather than soil your own soul with a lie. The magazine removes this distinctive (and to modern readers, uncomfortable) feature to make him "look reasonable."

  ### Summary for the Reader
  You should trust your impression over the magazine's. The author of the essay has performed a "transplant": they have taken Augustine's taxonomy of lies but replaced his theological heart (sin against God/Truth) with a secular heart (harm to victims). This makes Augustine appear to be a sophisticated consequentialist, which is the opposite of his actual position. The essay is useful for knowing that Augustine graded lies and allowed for silence, but it cannot be trusted on *why* he did so or on the definition of the lie itself.
