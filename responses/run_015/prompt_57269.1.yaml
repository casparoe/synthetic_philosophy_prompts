  7.  **Final Polish:** Ensure the distinction between *De Mendacio* (On Lying) and *Contra Mendacium* (Against Lying) is acknowledged if necessary, though the core doctrine is consistent. (Decided to keep it general to "Augustine's treatises" to avoid bogging down unless necessary). Ensure the "Killer at the Door" example is contextualized (it's a modern label for a scenario Augustine discusses regarding hiding fugitives).

