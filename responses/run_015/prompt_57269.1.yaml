  Also, on the "misleading truth": Augustine says in *De Mendacio* that if you speak truth *in order* to deceive, you are still guilty of falsehood in your heart. So the magazine's claim that we are "free to mislead... with a true statement" is actually quite shaky regarding Augustine. He allows *silence*, but deceptive intent is still problematic. I need to highlight this.

