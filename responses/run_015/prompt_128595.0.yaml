      *   *Goal:* Show how the *list* forces a choice. The list reveals that no single framework works; a hybrid is needed, but the hybrid has cracks (specifically at Req 2).

  6.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Acknowledge the gravity. Validate the user's position (proxyhood changes the view from abstract to concrete).
      *   **The Specification (Desiderata 1-6):** Flesh out each point with the "Deliverable," "Phenomenon," and "Motivating Case." Use precise philosophical/clinical language.
      *   **The Tensions (Jointly Unsatisfiable):** Highlight the 2 vs. 6 conflict (Precedent Autonomy vs. Current Best Interest/Capacity). Discuss the metaphysics of identity.
      *   **The Theory Killer:** Select Req 2. Explain why it breaks all three.
      *   **The Scorecard:** Briefly assess the three families against the 6 points. Emphasize the *fractures* revealed.
      *   **Conclusion:** A brief closing acknowledging the burden of the proxy.

  7.  **Refining the Tone:**
      *   Avoid being preachy.
      *   Avoid offering medical advice.
