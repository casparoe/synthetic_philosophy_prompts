answer: |-
  This specification is constructed for the person standing at the bedside, not the legislator in the chamber. It treats ethical theory not as a verdict but as a tool for navigation. Below is the full specification of what an adequate theory must deliver, followed by the structural tensions, the stress-test against dominant frameworks, and the scoring.

  ### I. The Specification: Desiderata for an Adequate Theory

  **1. The Agency Distinction (Action vs. Omission)**
  *   **The Deliverable:** The theory must articulate a principled difference in *moral agency* between withdrawing treatment and administering a lethal agent, even when the outcome (death) and the intent (cessation of suffering) are identical. It cannot rely solely on the "doing/allowing" distinction, which is often metaphysically thin.
  *   **The Phenomenon:** The ambulatory patient seeking a prescription exercises agency to *cause* death. The ventilator-dependent patient refusing filtration exercises agency to *stop resisting* death.
  *   **The Motivating Case:** If the theory collapses these, it renders the ventilator patient's refusal a form of suicide (stigmatizing their right to bodily integrity) or the ambulatory patient's request a form of treatment refusal (ignoring the active introduction of a toxin). An adequate theory must explain why the *causal pathway* matters to the moral character of the act, preserving the right to refuse intrusion without necessarily endorsing a right to demand intervention.

  **2. The Problem of Precedent Autonomy (Anticipatory Authorization)**
  *   **The Deliverable:** A metaphysics of personhood that determines whether a prior competent self can bind a future incompetent self. The theory must specify if the directive binds based on *identity* (they are the same person), *interest* (the prior self's interests outweigh the current self's apparent contentment), or *symbolic value* (honoring the life narrative).
  *   **The Phenomenon:** The "happy demented" patient. The subject currently lacks capacity, feels no distress, and may exhibit joy. The prior self directed death in this exact state to avoid indignity.
  *   **The Motivating Case:** Standard advance directive logic works for *treatment* (e.g., "no antibiotics for pneumonia") because the treatment is an external intrusion. Aid in dying is an *intervention*. The theory must explain why a past wish to die overrides a present state of non-suffering without treating the current demented self as a mere vessel for the past self's values.

  **3. The Axiology of Suffering (Physical, Existential, Relational)**
  *   **The Deliverable:** A hierarchy or equivalence principle for types of suffering. It must define whether "dignity" is an objective status or a subjective experience, and whether "burden" is a legitimate ground for death or a signal of social failure.
  *   **The Phenomenon:** Patients who are pain-controlled but despair over loss of cognitive function (existential), or who request death to spare family financial/emotional ruin (relational).
  *   **The Motivating Case:** If existential suffering is equivalent to physical pain, the theory validates requests based on narrative collapse. If relational suffering (being a burden) is validated, the theory risks coercing the vulnerable to die for the sake of others. An adequate theory must distinguish between *altruistic relief* (a valid moral choice) and *coerced sacrifice* (a moral harm), without dismissing the patient's own assessment of their relational worth.

  **4. The Palliative Boundary (Consistency without Reducibility)**
  *   **The Deliverable:** An explanation of why AD is not merely a "failure of palliation" while simultaneously asserting that AD cannot replace palliative infrastructure. It must account for *refractory suffering* that is not physical.
  *   **The Phenomenon:** Patients with access to top-tier hospice who still request AD because the *process* of dying (dependence, loss of control) is the suffering, not the symptoms.
  *   **The Motivating Case:** If AD is only permissible when palliation fails, it makes AD a medical last resort rather than a liberty interest. If AD is fully independent, it risks becoming a cost-saving substitute for care. The theory must hold that some suffering is inherent to the dying process and cannot be "treated," only ended, while ensuring this exception does not disincentivize symptom management.

  **5. The Phenomenology of Moral Residue**
  *   **The Deliverable:** An account of the emotional/psychological aftermath for the facilitator (physician or proxy). It must categorize this residue: is it trauma (pathological), guilt (signal of wrongdoing), or grief (appropriate response to a tragic necessity)?
  *   **The Phenomenon:** The proxy who signs the order or the physician who writes the prescription often experiences a lasting moral weight, even when convinced the act was right.
  *   **The Motivating Case:** If the act is purely "good" (relief of suffering), residue should be minimal. If the act is "evil" (killing), residue should be guilt. If the act is "tragic" (necessary violation of a norm), residue is grief. An adequate theory must validate the residue without pathologizing it, acknowledging that doing the right thing can still wound the moral agent.

  **6. The Suicide Boundary (Capacity and Context)**
  *   **The Deliverable:** A criterion for distinguishing terminal illness requests from psychiatric suicide requests that does not rely on the circular "rational vs. irrational" distinction. It must rely on *stability of condition* and *irreversibility of context*.
  *   **The Phenomenon:** A depressed patient with a treatable condition vs. a terminal patient with a degenerative condition. Both may desire death.
  *   **The Motivating Case:** Psychiatry teaches that suicidal ideation is often a symptom of distortion. Terminal illness teaches that suicidal ideation can be a proportionate response to reality. The theory must distinguish these without implying the terminally ill are "sane" and the mentally ill are "mad," but rather by evaluating whether the *grounds* for the desire are mutable.

  ---

  ### II. Structural Tensions: Jointly Unsatisfiable Desiderata

  **The Conflict: Desideratum 2 (Anticipatory Authorization) vs. Desideratum 6 (Suicide Boundary/Capacity)**

  These two requirements are likely jointly unsatisfiable without importing a contested metaphysics of personal identity.

  *   **The Fracture:** Desideratum 6 requires that a request be evaluated based on current capacity and the reality of the patient's condition to prevent "irrational" suicide. Desideratum 2 requires honoring a request when capacity is *gone* and the current reality (the "happy demented" state) does not support the request.
  *   **The Metaphysical Import:** To satisfy #2, you must argue that the *past self* has moral priority over the *present self*. This requires a "narrative identity" view (I am the sum of my life story). To satisfy #6, you generally need a "current interest" or "current capacity" view (I am the being experiencing this moment).
  *   **The Unsatisfiability:** If you prioritize the past self to satisfy #2, you violate the protection against non-voluntary killing inherent in #6 (since the current self cannot consent). If you prioritize the current self to satisfy #6, you render #2 impossible (the directive is void once capacity is lost).
  *   **The Proxy Reality:** As a proxy, this is where you will be stranded. You cannot simultaneously honor your partner's prior wish to avoid dementia *and* protect the current demented being who appears content. One self must be sacrificed for the other.

  ---

  ### III. The Theory Killer

  **Desideratum 5 (Moral Residue)** does the most damage to the three dominant families of theory.

  *   **Why:** Dominant theories seek resolution. They aim to tell you what is *Right*.
  *   **Autonomy-Centered Liberalism:** If the act respects autonomy, it is morally permissible. Residue is a private psychological reaction, not a moral signal. The theory cannot explain why a "rights-respecting" act leaves a moral wound.
  *   **Consequentialist Welfare Maximization:** If the act minimizes suffering, it is good. Residue is merely negative utility for the physician, to be weighed in the calculus. It cannot account for residue as a *recognition of moral loss* that persists even when the calculation was correct.
  *   **Sanctity-of-Life Deontology:** If the act is killing, it is wrong. Residue is guilt (a signal of sin). It cannot account for the proxy who feels residue but remains convinced the act was *necessary* and *justified*.

  **Desideratum 5 forces the admission that the act is a "moral remainder"—something that is simultaneously justified and regrettable.** None of the three dominant families comfortably accommodate an act that is both right and morally damaging to the agent.

  ---

  ### IV. Scoring the Dominant Families

  This is not a verdict on which theory is "true," but a map of where each breaks under the weight of your specific clinical reality.

  **1. Autonomy-Centered Liberalism**
  *   **Score:** High on 1, 3, 4. Fails on 2, 5, 6.
  *   **The Fracture:** It handles the ambulatory patient well (Req 1) and validates existential suffering (Req 3). However, it collapses at the dementia boundary (Req 2) because autonomy requires current capacity. It also struggles to explain Moral Residue (Req 5)—if it was their right, why does it hurt you? It risks reducing the suicide boundary (Req 6) to a mere capacity check, missing the nuance of mutable vs. immutable conditions.
  *   **Where it breaks:** When your partner loses capacity. Liberalism leaves you with no tool to enact their prior will without violating their current self's rights.

  **2. Sanctity-of-Life Deontology**
  *   **Score:** High on 5, 6. Fails on 1, 2, 3, 4.
  *   **The Fracture:** It explains Moral Residue well (Req 5)—the act is a violation, so the pain is expected. It protects against suicide well (Req 6). However, it collapses the distinction between refusing treatment and active aid (Req 1), often viewing both as impermissible usurpations of divine/natural authority. It cannot validate existential suffering (Req 3) as a ground for death, nor can it accommodate anticipatory authorization (Req 2) without contradicting the duty to preserve life.
  *   **Where it breaks:** At the ventilator. It may force you to continue treatment that the patient finds intolerable, prioritizing biological life over the moral agent's refusal.

  **3. Consequentialist Welfare Maximization**
  *   **Score:** High on 3, 4. Fails on 1, 2, 5.
  *   **The Fracture:** It handles suffering well (Req 3) and integrates with palliation (Req 4) by asking "what reduces net pain?" However, it cannot defend the distinction between action and omission (Req 1) if the outcome is the same. It struggles with Anticipatory Authorization (Req 2) because killing a "happy" demented patient creates negative utility in the moment, overriding the past preference. It reduces Moral Residue (Req 5) to mere emotional cost, stripping it of ethical significance.
  *   **Where it breaks:** At the "happy dementia" case. A strict calculus might forbid killing a content patient even if their prior self demanded it, because the current net suffering is low.

  ### V. Summary for the Proxy

  The specification above reveals that no existing ethical framework is designed for the *proxy*. They are designed for the *patient* (Liberalism), the *moral law* (Deontology), or the *system* (Consequentialism).

  You are navigating the space between them. The tension between **Desideratum 2 (Prior Wish)** and **Desideratum 6 (Current Protection)** is the specific fracture where your decision will live. You will likely have to choose between being a faithful agent of your partner's *past self* or a protective guardian of your partner's *present self*.

  An adequate theory for *you* would need to be a **Ethics of Stewardship**: one that acknowledges you are managing a life that is no longer fully your partner's, nor fully someone else's, but a trust that is ending. It would validate Moral Residue (Req 5) not as a sign of error, but as the cost of holding that trust. Since no such theory is fully codified, you are effectively writing it in real-time. The specification above is the checklist to ensure what you write holds weight.
