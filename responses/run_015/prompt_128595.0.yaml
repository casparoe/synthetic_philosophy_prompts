      *   *Nuance:* In Req 5, distinguish between "residue" as trauma vs. "residue" as moral recognition.

  9.  **Final Polish:** Ensure the formatting is clear (bolding, lists) to make the "specification" readable. (Proceed to generate output based on these thoughts.)

