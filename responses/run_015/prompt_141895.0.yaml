answer: |-
  The link you need to cut is **(4)**.

  Here is the diagnosis of why that step looked sound, what cutting it costs you, and how it resolves your three specific suspicions.

  ### 1. The Verdict: Cut Step (4)

  **Step (4) states:** *"For any decision whatever, maximise the expected logarithm of whatever quantity the decision multiplies."*

  This is the overgeneralization. It conflates the **instrumental variable** (the thing that compounds, like money or budget) with the **terminal value** (the thing you actually care about, like wealth-utility or lives saved).

  **Why it looked sound:**
  In your sports betting, the quantity that compounds (your bankroll) is *also* the thing you value (your wealth). Because Capital $\equiv$ Value in betting, the rule "maximize log of the compounding quantity" works perfectly. It feels universal because, in the context where you discovered it, the instrument and the goal were identical.

  **What cutting it costs:**
  You lose the claim that the Kelly rule is a universal moral or decision-theoretic imperative for all compounding processes. You must accept that Kelly is a specific solution for **managing capital where capital is the proxy for utility and ruin is possible.**

  However, you keep (1) and (2) intact for betting. In betting, because you cannot bet without capital, and because you value the capital itself, the "long-run behavior" of the capital *is* the long-run behavior of your utility. Cutting (4) does not undermine the betting rule; it merely confines it to its proper domain.

  ### 2. The Principle Separating the Cases

  You asked for the principle that separates betting from grant-making. There are two distinct boundaries that Kelly respects but your generalization (4) ignores:

  **A. Identity of Capital and Utility**
  In betting, $U(\text{Wealth}) \approx \text{Wealth}$. You want more money.
  In charity, $U(\text{Lives}) = \text{Lives}$ (linear), but $\text{Budget} \neq \text{Lives}$.
  The budget is a tool to generate lives. While the budget compounds, the *value* (lives) does not. A life saved last year does not biologically reproduce to create more lives saved this year.
  If you maximize the expected log of the *budget*, you are optimizing the tool. But if the tool has a safety floor (see below), optimizing the tool's growth rate is not the same as optimizing the total output of good.

  **B. The Absorbing Barrier (Ruin)**
  This is the most critical mathematical distinction. The Kelly Criterion is derived from the geometry of multiplicative processes **with an absorbing barrier at zero**.
  *   **Betting:** If your bankroll hits 0, you cannot play further. The game ends. The logarithm $\ln(0) = -\infty$ mathematically encodes this "game over" state. This is why you must avoid full commitment on risky bets.
  *   **Charity:** You stated, *"there is no realistic path to zero."* The committee keeps meeting. Even if a grant fails, the budget next year might shrink, but it does not vanish.
  *   **Consequence:** When there is no absorbing barrier at zero, the process is not strictly non-ergodic in the same way wealth is. You can recover from a bad year. Without the threat of permanent extinction, the penalty for volatility (which the log function imposes) is no longer rational. You can afford to maximize the Arithmetic Mean (Expected Value) because the Geometric Mean is not being dragged down by the risk of $-\infty$.

  ### 3. Addressing Your Three Suspicions

  **First Suspicion: "Money compounds but the good we care about does not."**
  You are correct. This is the primary reason (4) fails.
  *   **Implication:** If you want to maximize total lives over a long horizon, and the budget compounds based on success, you *should* care about the budget's growth rate. *However*, because the utility of lives is linear (10 lives is exactly twice as good as 5), and because there is no ruin, the optimal strategy for the *budget* is actually less conservative than Kelly.
  *   **Resolution:** You should maximize Expected Value of Lives. Why? Because the "compounding" of the budget is likely noisy and bounded (donors don't perfectly track lives, and there's a maximum budget). If the compounding is imperfect or bounded, the long-run advantage of the Log strategy vanishes, and the higher Arithmetic Mean of the EV strategy yields more total lives over time.

  **Second Suspicion: "Does anything turn on the fact that we cannot be wiped out?"**
  Yes, everything turns on this.
  *   **Why:** The Kelly argument (Step 1 & 2) relies on the Law of Large Numbers applied to logs: $\frac{1}{N} \sum \ln(X_i) \to E[\ln(X)]$. This ensures you finish ahead *almost surely* as $N \to \infty$. But "almost surely" allows for paths that dip near zero. If zero is an absorbing state, those paths are killed off. If zero is *not* an absorbing state (you can recover), the paths that take high risk and dip low can recover and eventually overtake the conservative Log-maximizers because their Arithmetic Mean is higher.
  *   **Cost:** If you acknowledge this, you admit that Kelly is not about "growth" per se, but about "survival-constrained growth." Without the survival constraint, pure growth (EV) wins.

  **Third Suspicion: "Lives saved has a conventional zero... logarithm becomes almost flat."**
  Your friend is mathematically correct and has identified why Log-Utility is morally wrong for lives.
  *   **The Math:** $\ln(\text{Lives Saved})$ implies that saving 1 life is infinitely better than saving 0. It implies that the difference between 1 and 2 lives is vastly more important than the difference between 100 and 101. This contradicts the usual moral intuition that a life is a life.
  *   **The Background Population:** If you write the outcome as $\ln(\text{Total Population})$, then $\ln(7,000,000,010) - \ln(7,000,000,000) \approx \frac{10}{7,000,000,000}$. The function is effectively linear.
  *   **Conclusion:** This is a refutation of applying the Log Rule to *value*. The Log Rule is a property of *capital dynamics*, not *moral value*. Using it for lives imposes a diminishing marginal utility on human life that you likely do not hold.

  ### Summary of the Repair

  To keep your betting rule without accepting the charity conclusion, modify your chain of reasoning as follows:

  1.  **Keep (1) & (2) for Betting:** In betting, Wealth is both the compounding mechanism and the value. There is a hard barrier at 0. Therefore, Maximize $E[\ln(\text{Wealth})]$.
  2.  **Reject (4) for Charity:** In charity, Budget is the mechanism, Lives are the value. There is no hard barrier at 0.
  3.  **New Principle:** Maximize Expected Value of the *Terminal Good* (Lives), subject to a constraint that the *Instrumental Capital* (Budget) remains above a survival threshold.
  4.  **Result:** Since you stated there is "no realistic path to zero," the survival constraint is not binding. Therefore, you are free to maximize Expected Lives (Arithmetic Mean), which justifies taking the 50/50 chance of 80 lives over the certain 10.

  You do not need to abandon the Kelly Criterion for betting. You only need to recognize that it is a **financial constraint strategy**, not a **universal ethical axiom**. It applies when you are playing a game you cannot afford to lose. In your charity work, you are playing a game you can afford to lose, so you should play to win the most points (lives), not just to stay at the table.
