answer: |-
  **Title:** Modal Metaphysics of the Crown: Transworld Identity and Counterpart Theory in Normative Institutions

  **Research Question**
  Is the identity of a normative institution across possible worlds determined by its historical origin and constitutive rules (suggesting a Kripkean transworld identity), or by qualitative similarity and contextual relevance (suggesting a Lewisian counterpart relation), and does treating sovereignty as an essential property force a commitment to one view over the other?

  **Context and Motivation**
  The dominant literature concerning modal metaphysics focuses almost exclusively on concrete particulars: human persons and material artefacts. In these domains, the debate between transworld identity and counterpart theory hinges on intuitions regarding biological origin, material constitution, and psychological continuity. The standard framing assumes that if an object exists in another possible world, it must either be numerically identical to the actual object or merely a qualitatively similar counterpart. This dichotomy is often resolved by appealing to essential properties, such as the origin of a person or the material composition of a table.

  However, this framing leaves the case of normative institutions largely open. Institutions such as constitutional monarchies, legal systems, or corporations are not merely material aggregates nor biological entities; they are abstract social objects constituted by rules, roles, and collective intentionality. Their persistence conditions depend on legal continuity, functional capacity, and recognised authority rather than physical stuff or biological lineage. Consequently, the hidden assumptions about essential properties that drive the debate in the personal and artefactual cases may not transfer neatly. For instance, while a person's biological origin is arguably essential, an institution's 'origin' might be a matter of legal record subject to revision, or its 'essence' might be purely functional.

  Shifting the debate to institutions offers a novel testing ground for modal metaphysics. If transworld identity relies on rigid designation tied to origin, does a monarchy survive in a world where the royal lineage was interrupted but legally restored? If counterpart theory relies on qualitative similarity, does a monarchy survive in a world where the institution exists but lacks sovereignty, functioning merely as a ceremonial figurehead? By analysing these cases, we can determine whether the competition between the two theories is genuine or merely a product of smuggling in specific essentialist assumptions regarding materiality and biology that do not apply to social ontology.

  **Theoretical Framework**
  The project will contrast two distinct modal frameworks without presupposing the validity of either. The first framework, associated with Kripkean transworld identity, posits that individuals exist in multiple possible worlds as numerically identical entities. Under this view, statements about what an institution could have done are claims about the very same institution existing under different conditions. This typically requires a set of essential properties that the institution must retain to remain itself.

  The second framework, associated with Lewisian counterpart theory, denies transworld identity. An institution exists only in its actual world. Claims about what it could have done are analysed as claims about a distinct, qualitatively similar institution in a neighbouring possible world. Identity is replaced by a counterpart relation based on similarity and contextual relevance. This view allows for vagueness in modal claims, as an actual institution might have multiple counterparts in a single possible world, or none at all, depending on which qualities are deemed relevant.

  **Methodology**
  The method will be conceptual analysis supported by modal thought experiments. The paper will construct specific scenarios involving a constitutional monarchy to test the predictions of each framework.

  1.  **The Lineage Break Case:** A possible world is described where the royal bloodline fails, but the legal constitution remains unchanged, and a new family is adopted according to existing legal rules to fill the role.
      *   *Transworld Identity Prediction:* If the legal continuity is maintained, the institution is identical. If biological origin is essential, it is not.
      *   *Counterpart Prediction:* The institution in the other world is a counterpart if it is sufficiently similar in function and legal structure, regardless of biological lineage.

  2.  **The Sovereignty Shift Case:** A possible world is described where the monarchy exists with the same lineage and legal title but holds no sovereign power, serving only a ceremonial purpose due to a shift in political culture rather than legal change.
      *   *Transworld Identity Prediction:* If sovereignty is an essential property of a monarchy, this is not the same institution. If it is merely accidental, it is.
      *   *Counterpart Prediction:* The counterpart relation depends on whether 'sovereignty' is a weighted feature in the context of the modal claim.

  The analysis will focus on the persistence conditions for social roles. It will distinguish between the institution as a legal entity and the institution as a political function. The paper will examine whether sovereignty should be analysed as an essential feature (without which the institution ceases to be a monarchy) or as a relational role that can be occupied differently across worlds (allowing the institution to persist despite power shifts).

  **Possible Conclusions and Adjudication**
  There are three primary conclusions the research might support.

  First, the research may conclude that transworld identity is superior for normative institutions because legal systems rely on rigid designation. Legal validity often traces back to an original act of constitution. If this is the case, the Kripkean view aligns better with jurisprudential intuition. Adjudication would favour this view if our intuitions about legal obligation require numerical identity rather than similarity. For example, if a treaty is signed by 'The Crown', it matters whether the signatory is the same entity, not merely a similar one.

  Second, the research may conclude that counterpart theory is superior because institutional identity is inherently vague and context-dependent. Political science often treats institutions as evolving entities where functional similarity outweighs historical origin. Adjudication would favour this view if our intuitions about political classification prioritise function over origin. For instance, if we describe a world where the monarchy became fully democratic yet retained the title, we might still call it a 'monarchy' in a loose sense, suggesting a counterpart relation rather than strict identity.

  Third, the research may conclude that the debate dissolves because the essential properties assumed by both sides are misplaced when applied to social objects. If sovereignty is a relational role rather than an intrinsic property, then neither strict identity nor qualitative similarity captures the phenomenon. Instead, institutional persistence might be a matter of normative recognition rather than metaphysical fact. Adjudication here would rely on showing that both metaphysical views fail to capture the normative dimension of institutional existence.

  Considerations that would adjudicate between these conclusions include:
  *   **Legal Intuition:** Does legal continuity feel like identity or like succession?
  *   **Functional Intuition:** Does a powerless monarchy feel like the same institution as a powerful one?
  *   **Normative Force:** Do obligations transfer across worlds based on identity or similarity?

  **Scope and Feasibility Assessment**
  While the topic is philosophically rich, there are significant risks regarding scope for a one-semester paper of approximately 5,000 words.

  The primary risk is the complexity of defining 'institution'. Social ontology is a dense field, and spending too much word count defining what a constitutional monarchy is metaphysically could detract from the modal analysis. To mitigate this, the paper will stipulate a working definition of a constitutional monarchy based on standard political theory without engaging in exhaustive ontological debate.

  A second risk is the temptation to drift into political philosophy. The question of whether sovereignty is essential is partly a political question. The paper must remain focused on the modal metaphysical implications of that classification, rather than arguing for a specific theory of sovereignty itself. The focus must remain on how the classification affects the choice between counterpart theory and transworld identity.

  A third risk is the breadth of the comparison. Covering both the lineage case and the sovereignty case might be too ambitious for 5,000 words. It may be necessary to prioritise the sovereignty case, as it speaks more directly to the prompt's concern about essential properties versus relational roles. The lineage case could be treated briefly as a contrast to the personal/artefactual cases standard in the literature.

  Finally, there is a risk of inconclusiveness. Given that the prompt mentions a previous inconclusive argument, there is a danger that the paper will merely replicate the stalemate by showing that intuitions vary. To avoid this, the paper must argue for which intuitions are theoretically virtuous in the context of social ontology, rather than simply reporting that intuitions diverge. Despite these risks, the narrow focus on constitutional monarchy rather than institutions generally makes the project manageable within the word limit, provided the theoretical background is kept concise and the analysis remains tightly focused on the modal predictions of each view.
