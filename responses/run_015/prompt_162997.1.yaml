  Your intuition is correct: this is where the theory gets "weird" (the problem of expressive weakness).
  *   **From the Outside:** We know L (Sentence 3) is "Neither." Therefore, it is correct to say "L is not true."
  *   **From the Inside (Strong Kleene):** The predicate "is not true" is formalized as $\neg T(x)$. Since $T(L)$ is **Neither**, $\neg T(L)$ is also **Neither**.
  *   **The Consequence:** The language cannot express its own semantic gaps. You cannot say "L is a gap" using the object language's truth predicate. You need a meta-language predicate (like "is undefined").

  **Is this specific to one rule?**
  Yes.
  *   In **Strong Kleene**, A is **Neither**. (The gap propagates).
  *   In **Supervaluationism**, A is **True**. (Because L is *never* True in any precisification, "L is not true" is True in all precisifications).

