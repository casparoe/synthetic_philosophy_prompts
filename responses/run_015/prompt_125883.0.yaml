      *   *Problem C: The "First-Person" Gap.* How does a third-person description of a loop become a first-person experience? (The Explanatory Gap).
      *   *Problem D: Multiplicity.* How do we reconcile the "unitary I" with fragmented selves? (Narrative vs. Metaphysical self).
