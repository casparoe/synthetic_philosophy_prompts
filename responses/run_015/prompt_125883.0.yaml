      *   *Priority 2:* **The Integration/Unity Problem.** (How tight must the loop be?) This addresses the pathology objection and defines the legal subject.
      *   *Priority 3:* **The Phenomenological Gap.** (How does representation become presentation?) This is the hardest, maybe too hard? The user asked for tractability. Maybe swap this for **The Normative Function**. Why does the loop exist? To minimize error? To survive? This links to AI alignment.
