      *   *Okay, I will structure the agenda around resolving the distinction between **Syntactic Recursion** and **Autopoietic Closure**.* This covers embodiment and function. Then **The Criteria for Personal Identity** (Unity).

  6.  **Developing the Arguments for Each:**

      *   *Problem 1: Syntactic Recursion vs. Autopoietic Closure.*
