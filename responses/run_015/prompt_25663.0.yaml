answer: |-
  You have hit on one of the classic case studies in contemporary philosophy of science. Your hunch is correct: if this were merely a factual dispute about whether hypotheses are being tested, it would have been resolved by now by looking at the papers. The fact that both sides look at the *same* papers and see *different* epistemic statuses suggests the disagreement is deeper.

  Here is a diagnosis of the evolutionary psychology (EP) wars, broken down by the type of disagreement, followed by an assessment of whether it can be moved.

  ### 1. The Core Diagnosis: A Clash of Null Hypotheses
  The most precise way to characterize this disagreement is not about methodology, but about **Bayesian priors regarding the Null Hypothesis.**

  *   **The Adaptationist Prior (Defenders):** The default assumption is that a prevalent, complex trait is likely an adaptation produced by natural selection. The burden of proof lies on the skeptic to show it *wasn't* selected for. This is based on the view that natural selection is the only known process that creates complex functional design.
  *   **The Pluralist Prior (Critics):** The default assumption is that a trait could be an adaptation, a byproduct (spandrel), genetic drift, or a constraint of development. The burden of proof lies on the adaptationist to rule out these alternatives. This is based on the view that selection is one of many evolutionary forces and is often over-attributed.

  **Why this causes stalemate:**
  When an EP researcher presents a study showing a trait exists and has a function *now*, they feel they have supported their hypothesis. The critic replies, "You've shown current utility, not historical selection." When a critic points out a trait could be a byproduct, the defender replies, "That's possible, but unlikely given the complexity." They are arguing past each other because they disagree on **who needs to prove what.**

  ### 2. The Verbal/Conceptual Disagreement: "Adaptation"
  There is a significant verbal component here, specifically regarding the definition of **adaptation**.

  *   **Historical Adaptation:** A trait shaped by selection in the past for a specific function (the strict biological definition).
  *   **Current Utility:** A trait that is useful now, regardless of origin.

  Much of the "just-so story" criticism stems from EP sliding between these two. If I argue that fear of snakes is an adaptation, I need evidence of selection in the EEA. If I only show that people learn to fear snakes faster than flowers, I've shown a learning bias (proximate mechanism), which *could* be an adaptation, but could also be a general property of nervous systems. Critics accuse defenders of treating "current utility" as proof of "historical adaptation."

  ### 3. The Explanatory Disagreement: What Counts as "Understanding"?
  This is the philosophical heart of the matter. The two sides have different ideals of what a satisfying scientific explanation looks like.

  *   **The Functionalist Ideal (EP):** To understand a trait is to understand its **function** (its "why"). Knowing the computational problem the mind was designed to solve explains the behavior. This aligns with a "design stance."
  *   **The Mechanistic/Developmental Ideal (Critics):** To understand a trait is to understand its **construction** (its "how"). Knowing the neural pathways, developmental constraints, and environmental interactions explains the behavior.

  To a critic, an adaptive story without a developmental mechanism is "empty" (like saying opium puts you to sleep because of its "dormitive virtue"). To a defender, knowing the mechanism without knowing the function is "blind" (like knowing how a heart pumps blood without knowing it's for circulation). They are asking different questions, but both claim to be answering "Why do humans do X?"

  ### 4. Is it a Factual Dispute?
  Partially, but it's the smallest part.
  *   **Factual:** Do EP researchers actually run experiments? Yes, many do (e.g., error management theory predictions).
  *   **Factual:** Are the tests rigorous? Critics argue the "tests" often rely on self-report or WEIRD (Western, Educated, Industrialized, Rich, Democratic) samples, which makes inferring universal human nature factually dubious.
  *   **The Limit:** The hard factual limit is the **EEA (Environment of Evolutionary Adaptedness).** We cannot time travel. We cannot know with certainty the statistical regularities of the Pleistocene. Therefore, any claim about what was selected *then* is underdetermined by data *now*. This underdetermination is where the philosophical priors take over.

  ---

  ### How to Move the Debate (Or Accept the Stalemate)

  Given this diagnosis, simply demanding "more testing" won't work. Here is what would actually shift the dialectic:

  #### 1. Shift from "Adaptation vs. Not" to "Integration"
  The 1990s framing was binary: Is it an adaptation or not? The modern move (in fields like **Evolutionary Developmental Biology** or **Evo Devo**) is to ask how selection interacts with constraints.
  *   **The Move:** Stop treating "adaptation" and "constraint" as rivals. A trait is almost always an adaptation *constrained* by development.
  *   **Example:** Instead of asking "Is language an adaptation?", ask "How did general learning mechanisms get co-opted and constrained to produce language?" This satisfies the mechanistic critics while keeping the evolutionary framework.

  #### 2. Change the Null Hypothesis (The "Adaptationist Programme" Retreat)
  Some philosophers (like Philip Kitcher) have suggested that adaptationism should be treated as a **heuristic** rather than a truth claim.
  *   **The Move:** Defenders admit, "We assume adaptation first because it's a productive research strategy, not because we know it's true."
  *   **Effect:** This lowers the stakes. If the hypothesis fails, it's not a "failed science," it's just a heuristic that didn't pay off this time. It disarms the "dogmatism" criticism.

  #### 3. Niche Construction Theory
  This is the strongest contemporary challenger to the standard EP model. It argues that organisms don't just adapt to environments; they build environments that then select for new traits.
  *   **The Move:** This bridges the gap. It acknowledges the EP focus on selection but incorporates the Critic's focus on environmental plasticity and culture. It dissolves the rigid "EEA" concept, which was the primary target of the "just-so" critique.

  #### 4. Accept Productive Tension (Lakatosian Research Programmes)
  Imre Lakatos argued that science progresses through "research programmes" with a "hard core" of assumptions that are protected from falsification by a "protective belt" of auxiliary hypotheses.
  *   **Diagnosis:** EP and its critics are two different research programmes.
  *   **Verdict:** You may not get a knockout victory. Science often retains competing frameworks (like particle vs. wave theories of light) for long periods. The tension forces EP to be more rigorous (to avoid the "storytelling" label) and forces critics to offer alternative models (not just say "no").

  ### Summary for your Course
  If you need to synthesize this for your class, here is the takeaway:

  The Evolutionary Psychology Wars are not a methodological dispute; they are a **philosophical dispute about the burden of proof in historical sciences.**

  1.  **It is a Prior Disagreement:** Defenders assume selection is the dominant force; Critics assume a pluralism of forces.
  2.  **It is an Explanatory Disagreement:** Defenders value functional explanations; Critics value mechanistic/developmental explanations.
  3.  **It is Underdetermined:** The data (current behavior) cannot uniquely determine the history (evolutionary origin), leaving room for interpretation.

  **Will it end?** Probably not in the sense of one side surrendering. However, the debate is moving past the 90s "Wars" into a more integrated **Human Evolutionary Science** that incorporates neuroscience, development, and niche construction. The "stalemate" was useful: it forced evolutionary psychology to become more rigorous and forced critics to acknowledge that evolution *does* shape the mind, even if not in the way EP originally claimed.

  The "just-so story" critique remains a vital regulatory ideal—it's the immune system of the discipline, keeping it from drifting into mythology.
