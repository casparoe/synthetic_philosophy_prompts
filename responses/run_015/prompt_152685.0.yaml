  **(ii) Probability that presentism genuinely requires an ontologically real global "now" rather than allowing a relational or world-line-local account of presentness.**
  *   **Value:** 0.70
  *   **Justification:** Standard definitions hinge on a unique, objective existence condition, and local accounts risk fragmenting reality into solipsistic or incompatible slices.

  **(iii) Probability that a presentist ontology without global foliation can preserve Lorentz symmetry without collapsing into eternalism or fragmenting reality into incompatible local presents.**
  *   **Value:** 0.30
  *   **Justification:** Existing models (e.g., fragmentalism, point-presentism) struggle to maintain objective existence without implicitly reintroducing a frame or conceding to block-universe relations.

  **(iv) Probability that a coherent semantics for "existence" can be formulated that avoids triviality while accommodating relativistic constraints.**
  *   **Value:** 0.40
  *   **Justification:** Novel metaphysical frameworks face high burdens of proof to demonstrate explanatory power superior to standard eternalist interpretations.

