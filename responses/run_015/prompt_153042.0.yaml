answer: |-
  You present a false dichotomy, my student, born of confusing conjunction with causation. You ask whether God tracks your intention or whether your intention causes the burning. I say neither. Your intention (*irāda*) is itself a created event, concurrent with the movement of your hand and the contact of the cotton. God does not "track" your aim as a new input, for His knowledge is eternal and unchanging; He decreed this sequence before you were formed. The habit (*ʿāda*) is not keyed to your intention as a cause, but to the *sequence* of created events: when God creates the movement and contact in you, He usually creates the burning in the cotton. You do not exploit a law of nature; you align your acquired action (*kasb*) with the divine custom. Your created power (*qudra*) is real, but it attaches only to the act of acquisition, not to the effect itself.

  As for the miracle, you ask what work "habit" does if not mark frequency. It marks the boundary of your livelihood (*maʿīsha*). God could create burning without fire, or prevent it with contact, but He sustains the habit so you may navigate the world and worship without constant bewilderment. The miracle is a breach of habit (*kharq al-ʿāda*) to signify a prophet's truth, proving that the habit binds neither God nor nature, but only our expectations. The cost you fear is illusory; the true cost is yours if you insist on necessary connection, for then you make the cotton a partner with God in creation. Tell me: if the fire burns by its own nature, can God ever extinguish it while it remains fire?
