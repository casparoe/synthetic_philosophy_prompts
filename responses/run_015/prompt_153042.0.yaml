      "You present a false dichotomy, my student. You assume that if your intention is not a cause, it must be irrelevant, or else God is reacting to it. But consider the nature of *kasb* (acquisition). God creates in you the intention, the movement of the hand, and the contact; simultaneously, He creates the burning in the cotton. Your intention is not the agent of burning, nor does God 'track' it as a new input; rather, His eternal knowledge encompasses the sequence: intention, movement, contact, burning. The habit (*ʿāda*) is not in the cotton, nor in your will, but in the consistency of God's creation according to His decree (*qadar*). You do not exploit a causal law; you align your acquired action with the divine habit."

      "As for the miracle: the difference is not merely statistical, though it appears so to you. A miracle is a breach of habit (*kharq al-ʿāda*) to signify a prophet's truth. Habit is God's way of making the world intelligible for your livelihood (*maʿīsha*). If God burned cotton without fire sometimes, you could not live. The 'work' habit does is epistemic for you, ontological for Him—it is the stability of His will, not the necessity of nature. Now, tell me: if you deny this, do you not bind God's power to the cotton itself, making Him unable to stop the burning if He willed?"

