prompt: |-
  hey, I want you to draft the joint statement that an adversarial collaboration would produce between two people who've been going at each other for years about coherence arguments for expected utility maximization.

  Camp one: the money-pump / Dutch-book style arguments genuinely vindicate EU maximization as a requirement on any agent — not merely as one convenient way of representing an agent's behavior, but as what being coherent actually amounts to. Camp two: those arguments at best show that certain patterns leave you exploitable, or leave you doing worse by your own lights, in specially arranged setups with a hostile counterparty; a non-EU agent who is allowed to decline bets, precommit, or just be choosy does fine, so what coherence arguments deliver is "representable as if," or a defeasible prudential reason, not EU maximization as such.

  I want the real document, not a survey: the claims both of them can actually sign (about what the axioms are, about how much work the exploiting counterparty is doing, about whether "you could have done better by your own lights" is the load-bearing claim rather than the money), then the residual disagreements, each phrased so that side would accept the wording of its own view, then the cruxes. My guesses at the cruxes, tell me if im wrong: whether a policy that declines some bets counts as avoiding exploitation or as changing the subject; whether the argument needs diachronic coherence on top of synchronic coherence; whether the conclusion is "maximize expected utility" or only "be representable as maximizing it relative to some probability and utility function."

  Here's the wrinkle I actually want them to chew on, and I dont think either has thought about it: run the pump on a population instead of an individual. Suppose the agent's decision rule gets instantiated a huge number of times — a model deployed at scale, copies of a person, a policy that recurs over a life with each instance not remembering the earlier ones — and every instance gets offered the same sequence of swaps but the instances can't coordinate about which offers to refuse. Does the "just decline the bet" reply survive when there's nobody in a position to decline on behalf of all the instances at once? Does camp one's argument actually get stronger here, or does it just relocate the same assumption one level up? If the two of them can agree on any toy case or any checkable feature of a real deployment that would bear on it, write down each side's prediction in advance.

  Format: numbered agreed claims, then a disagreements table (point of dispute | camp one's wording | camp two's wording | crux it turns on | what each predicts). Keep the whole thing under 600 words and don't cite anything — I want the arguing, not a reading list.
