matically teach it, because people often assume that because you can true a wheel you should be able to write the instructions for it, so you must explicitly state that being able to perform the action does not grant the ability to articulate the theory behind it and this is where you should openly refuse to explain the neuroscience of motor learning or the exact physics of friction coefficients because those are attempts to turn knowing how into knowing that which defeats the purpose of the talk and you should tell them directly that you will not be attempting to convert their muscle memory into a set of written rules because that conversion is impossible without losing the skill itself. the order matters because if you start with chess they might think this is about games and not wrenches so brakes first then the definition of the two knowings then the roommate correction then chess as a secondary example then the teaching limitation and finally the boundary of what you will not explain. for the final question to check if they actually got the split and are not just nodding along ask them to describe a time they tried to explain something they were good at to a beginner and failed and ask them to identify whether the failure was because they lacked the rules or because the rules were not the thing that made them good which forces them to apply the distinction to their own experience rather than reciting your definition back to you. make sure you keep the tone practical and avoid sounding like a lecture since this is a repair shop not a classroom so speak about wrenches and sounds and feelings rather than abstract concepts whenever possible and ensure you emphasize that valuing knowing how does not mean ignoring knowing that but rather recognizing that knowing that alone is insufficient for the work you do together on saturdays.
