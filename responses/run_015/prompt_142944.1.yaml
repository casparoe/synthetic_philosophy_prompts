prompt: |-
  hey — you're a political philosopher who works on territory, territorial rights and historical injustice (just inhabit the role), and I want you to actually think this through rather than pattern-match: start by brainstorming for a bit about what an analogy is even supposed to establish in a moral argument before you commit to anything, and please write the whole answer in American English.

  I just spent about three hours arguing with my friend Dev after a talk on space policy, and I'm still not sure who won. Dev's line is the one you hear constantly now: that a permanent settlement on Mars is settler colonialism, same basic structure as the Atlantic cases — charter company, frontier, metropole, extraction, a population subject to rules made elsewhere — and that the upshot is we should back a moratorium on permanent settlement and keep Mars to robots and science, run a bit like Antarctica. I pushed the Antarctica comparison as a positive model and Dev said that's precisely the tell: treating Mars as a commons or a preserve because nobody lives there is just terra nullius with nicer paperwork, and the 1967 Outer Space Treaty language about space being the province of all humankind is doing the same job that the idea of empty land did for the historical colonizers. I conceded that point in the moment, but afterwards I realised neither of us had any idea which part of the comparison was actually carrying the conclusion, and we were mostly just trading vibes about the word colony.

  Four things came up that I want handled rather than hand-waved. First, the money seems to run backwards: a Mars settlement would be a gigantic net importer of subsidy from Earth for generations, not a source of extracted surplus, so the metropole-periphery mechanism looks inverted — which makes me think the real content of the analogy is about who writes the rules and who can't exit, not about economics at all. Second, there obviously aren't any indigenous Martians, so the wronged party has to be relocated to something else — settler generations who never consented to the constitution they inherit, possible microbial life, the landscape itself, terrestrial taxpayers footing the bill — and each of those substitutions seems to generate a different conclusion. Third, a settlement you physically cannot walk away from, because stepping outside the habitat kills you, feels less like colonial Virginia and more like an offshore oil platform or a submarine, and that changes what autonomy and consent even mean there. Fourth, real colonies had independence as a possible endpoint; a Martian town may never be viable without Earth, ever, so the familiar decolonization story has no final act.

  So: audit it properly. Give me an explicit correspondence table for Dev's analogy — what plays the colonizer, the metropole, the frontier, the native, the extraction, the charter, the flag — then the same for my Antarctica one, then separate the disanalogies that genuinely bite on the moratorium question from the ones that are just noise, and say what each framing quietly imports about who counts as a victim, what counts as a political relationship worth having, and whether unmodified nature has standing. Then give me the bottom line: does the moratorium conclusion survive once the mapping is on the table, or was the analogy doing all the arguing? And if there's a better analogy available — chartered company, company town, monastery, seed ship, offshore rig, intensive care unit, prison colony — tell me which one, what it maps, and what policy conclusion it would actually license. It's fine if the answer is that Dev is basically right; I just want to know which premise is earning it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Political Philosopher specializing in territory, territorial rights, and historical injustice.
      *   **Task:** Audit the analogy between Mars settlement and settler colonialism (Dev's view) vs. Mars settlement and Antarctica/commons (User's view).
      *   **Constraints:**
          *   Think through what an analogy *does* in moral argument before committing.
          *   Write in American English.
          *   Address four specific points raised by the user (economic flow, indigenous absence/substitution, physical dependency/un-exitability, lack of independence endpoint).
          *   Provide explicit correspondence tables for both analogies.
          *   Separate biting disanalogies from noise.
          *   Analyze what each framing imports (victims, political relationships, nature's standing).
          *   Deliver a bottom line on the moratorium conclusion.
          *   Suggest a better analogy if available (company town, monastery, seed ship, etc.).
      *   **Tone:** Rigorous, analytical, philosophical, not pattern-matching, thoughtful.

  2.  **Deconstruct the Function of Analogy in Moral Argument:**
      *   What is an analogy doing here? It's not proof. It's a heuristic for transferring moral intuitions from a settled case (historical colonialism/Antarctica) to a novel case (Mars).
      *   It relies on *structural similarity* to trigger *normative consistency*. If $A$ was wrong because of structure $X$, and $B$ has structure $X$, then $B$ is presumptively wrong.
      *   The danger is "surface resonance" (vibes) vs. "structural isomorphism" (actual mechanics of power and harm).
      *   I need to start by acknowledging this methodological point.

  3.  **Analyze Dev's Analogy (Mars = Settler Colonialism):**
      *   *Core Claim:* Mars settlement replicates the power dynamics of historical settler colonialism, therefore it inherits the moral taint.
      *   *Mappings:*
          *   Colonizer: Earth governments/corporations.
          *   Metropole: Earth.
          *   Frontier: Mars surface.
          *   Native: ??? (This is the crux).
          *   Extraction: Scientific data? Prestige? Resources (eventually)?
          *   Charter: Outer Space Treaty / Corporate licenses.
          *   Flag: National or Corporate branding.
      *   *The "Native" Problem:* Dev admits no humans. So who is the victim?
          *   Option A: Future Martians (non-consent).
          *   Option B: Earth Taxpayers (extraction of wealth).
          *   Option C: Nature itself (intrinsic value).
          *   Option D: Microbial life (if it exists).
      *   *User's Critique:* Economics run backwards (Earth -> Mars), not Mars -> Earth. Dependency is absolute (can't exit). No independence possible.

  4.  **Analyze User's Analogy (Mars = Antarctica/Preserve):**
      *   *Core Claim:* Mars should be a scientific commons, protected from permanent appropriation.
      *   *Mappings:*
          *   Stewards: International Treaty Body.
          *   Visitors: Scientists/Robots.
          *   Status: Terra Nullius (legally) but treated as Commons (morally).
      *   *Dev's Critique:* Calling it "commons" because no one lives there is just *terra nullius* logic repackaged. It assumes absence of life = absence of political claim.

  5.  **Address the Four Specific Points:**
      *   1. *Money Flow:* Colonialism extracts surplus *from* colony *to* metropole. Mars imports surplus *from* Earth *to* colony. This breaks the exploitation model unless "exploitation" is redefined as political subjection.
      *   2. *Indigenous Absence:* If no natives, who is wronged? If it's future Martians, it's a consent argument (Lockean). If it's nature, it's an environmental ethic. If it's taxpayers, it's distributive justice. These yield different policies.
      *   3. *Physical Dependency:* You can't "walk away" from Mars. This makes it less like a colony (where you can often return or rebel) and more like a submarine or oil rig (company town). This shifts the frame from *sovereignty* to *labor rights/safety*.
      *   4. *Independence Endpoint:* Colonies become nations. Mars might remain a dependent outpost forever. Decolonization (independence) is impossible. So "anti-colonialism" can't mean "national liberation." It must mean "don't build it."

  6.  **Develop the Correspondence Tables:**
      *   Need to be precise.
      *   *Dev's Table:* Focus on power structures.
      *   *User's Table:* Focus on stewardship and access.

  7.  **Evaluate Disanalogies (Noise vs. Bite):**
      *   *Noise:* Flags, specific technology, distance.
      *   *Bite:* The direction of resource flow, the impossibility of exit, the absence of a native population to be displaced (which is the central harm of settler colonialism).
      *   *The "Terra Nullius" Charge:* Dev is right that calling it "empty" invites appropriation. But is it "empty" in the moral sense?

  8.  **Analyze Normative Imports:**
      *   *Dev's Frame:* Victims = Future Martians / Earth Poor / Nature. Relationship = Domination. Nature = Potential Victim.
      *   *User's Frame:* Victims = Science / Humanity's Heritage. Relationship = Stewardship. Nature = Sacred/Protected.

  9.  **Determine the Bottom Line:**
      *   Does the moratorium survive?
      *   Dev's analogy fails on *extraction* and *displacement*. It succeeds on *political subjection* (rule from afar).
      *   However, if the harm is political subjection, the remedy isn't necessarily "no settlement," it could be "democratic constitution for Mars."
      *   If the harm is environmental, the remedy is "preservation."
      *   The "Settler Colonial" label might be the wrong tool. It triggers a specific historical guilt that doesn't map perfectly.
      *   *Better Analogy:* **The Company Town** or **The Offshore Rig**.
          *   Why? High dependency, economic subsidy from center, workers subject to external rules, no path to sovereignty, high risk.
          *   Policy: Labor rights, safety regulations, representation, not necessarily a ban.
      *   *Alternative:* **The Seed Ship/Ark**.
          *   Why? Existential insurance.
          *   Policy: Support it, but regulate governance.

  10. **Drafting the Response (incorporating the Persona):**
      *   *Voice:* Academic but accessible, rigorous, careful with definitions.
      *   *Structure:*
          1.  Methodological preamble on analogy.
          2.  Audit of Dev's Analogy (Table + Analysis).
          3.  Audit of User's Analogy (Table + Analysis).
          4.  Disanalogies (Bite vs. Noise).
          5.  Normative Imports (Victims, Relationships, Nature).
          6.  The Better Analogy (Offshore Rig/Company Town).
          7.  Bottom Line.

  11. **Refining the Argument (Self-Correction during drafting):**
      *   *Check:* Did I address the "Terra Nullius" point? Yes, need to explain that *terra nullius* was a legal fiction about *people*, whereas Mars is physically empty. The moral risk is treating physical emptiness as moral openness.
      *   *Check:* Did I address the economic flow? Yes, this is a major break in the colonial analogy. Colonialism pays for itself eventually; Mars likely won't.
      *   *Check:* Is the "Company Town" analogy better? It captures the lack of exit and external rule better than "Colony." A colony implies a society growing to replace the metropole. A company town is an extension of the metropole's economy.
      *   *Check:* American English spelling (labor, program, etc.).

  12. **Final Polish:** Ensure the tone isn't dismissive of Dev but critical of the *precision* of the analogy. The user wants to know if the *premise* earns the conclusion. The premise (structural similarity) is weak on economics and natives, strong on political subjection. Therefore, the conclusion (moratorium) might be too blunt; regulation/representation might be the actual implication.

  13. **Final Review against constraints:**
      *   Political philosopher persona? Yes.
      *   Think through analogy function first? Yes.
