answer: |-
  This is a classic stalemate, and your diagnosis is remarkably sharp. You have correctly identified that the "How old are nations?" question is the intellectual equivalent of a mousetrap: it looks like an empirical inquiry, but it snaps shut on whoever tries to answer it because the answer is hidden inside the definition of the terms.

  Here is the diagnosis of the disagreement, an assessment of whether it is verbal or substantive, and a roadmap for how your group can actually move forward.

  ### 1. Diagnosis: Is it Verbal or Substantive?

  It is **both**, but the verbal dispute is masking a substantive disagreement about **causality**.

  **The Verbal Layer (The Tautology Trap)**
  Your intuition that the modernists have "rigged the question by definition" is correct, but it is a *theoretical* rig, not necessarily a dishonest one.
  *   **Modernists (Gellner, Anderson, Hobsbawm):** Define "nation" functionally. A nation is a political unit that legitimizes itself through the will of the people and requires mass mobilization. By this definition, a nation *cannot* exist before the technology of mass mobilization (print, rail, census) exists. To them, asking if a medieval group was a "nation" is like asking if a Roman chariot was a "Ferrari." It misses the functional definition.
  *   **Perennialists/Ethno-symbolists (Smith, Armstrong):** Define "nation" phenomenologically. A nation is a named community with a myth of common ancestry and solidarity. By this definition, if the Jews, Armenians, or Poles felt this way in 1200, they were a nation.

  If you stop here, it is purely verbal. You are arguing about whether the word "nation" applies to Category A (Political Sovereignty) or Category B (Cultural Solidarity).

  **The Substantive Layer (The Causality Problem)**
  However, the fight persists because the definition drives the *explanation of power*.
  *   **The Modernist Claim:** Nationalism is powerful *because* it is modern. It solves the problem of social cohesion in industrial society. If you admit nations are old, you undermine the theory that nationalism is a functional requirement of modernity.
  *   **The Perennialist Claim:** Nationalism is powerful *because* it taps into deep, pre-existing ethnic ties. If you insist nations are purely modern inventions, you cannot explain why *this* specific boundary (Poland) and not *that* one (Prussia) became a nation. You cannot explain the emotional intensity of nationalism if it is just a "print community."

  **Verdict:** It is a **conceptual disagreement with empirical consequences.** Your "religion vs. church" analogy is spot on. Modernists are explaining the *institution* (the nation-state); Perennialists are explaining the *faith* (national sentiment). You cannot explain the power of nationalism without explaining both, but the two camps refuse to acknowledge the validity of the other's object of study.

  ### 2. The Buried Empirical Question: Continuity

  You asked if there is a real empirical question buried here. There is. It is the question of **transformation vs. invention.**

  *   **Modernists** argue for **Rupture:** The modern nation is a new thing built from old scraps. The continuity is superficial (names, borders) but the *social reality* is new.
  *   **Perennialists** argue for **Evolution:** The modern nation is an old thing adapted to new circumstances. The *social reality* is continuous, even if the political form changes.

  The empirical deadlock happens because neither side agrees on what counts as evidence of continuity.
  *   For the Modernist, continuity of *name* is irrelevant without continuity of *political practice*.
  *   For the Perennialist, continuity of *myth and memory* is sufficient evidence of the nation's existence, even without sovereignty.

  ### 3. What Counts as Progress?

  To break the deadlock, your group needs to stop trying to win the "How old?" debate and start distinguishing the *components* of the nation. You need a sharper definitional distinction, specifically the one proposed by **Anthony D. Smith**.

  Smith is the bridge figure you are missing. He was a student of Gellner (Modernist) who broke with his teacher to found Ethno-symbolism. He solves your specific stalemate by introducing a terminological split:

  1.  **The *Ethnie*:** A named human population with myths of common ancestry, shared historical memories, elements of shared culture, and a link with a homeland. (This can exist in antiquity).
  2.  **The *Nation*:** An *ethnie* that has acquired political self-determination and mass mobilization. (This is modern).

  **Progress looks like this:**
  *   **Agreement:** We stop asking "Is this medieval group a nation?" and start asking "Was this medieval group an *ethnie* that later became a nation?"
  *   **Evidential Standard:** We agree that proving continuity requires more than just a shared name. It requires evidence that the *modern* nationalists actively utilized the *pre-modern* myths. (e.g., Did 19th-century Greek nationalists actually read Byzantine chronicles, or did they invent a link to Ancient Greece that didn't exist in the Byzantine mind?)
  *   **Shift in Question:** Move from "How old are nations?" to "**Under what conditions does an *ethnie* transform into a *nation*?**"

  ### 4. Recommendations for Reframing the Discussion

  You are wasting your Thursday evenings because you are debating a conclusion that was settled in the 1990s (Smith's synthesis), but your reading list seems stuck in the 1980s (Gellner vs. Geertz). Here is how to fix the group dynamic:

  **A. Change the Reading List (The Synthesis)**
  Stop reading pure Modernists or pure Perennialists. Read the synthesizers.
  *   **Anthony D. Smith, *The Ethnic Origins of Nations* (1986):** This is the essential text. It accepts the Modernist timeline for the *nation* but validates the Perennialist data regarding the *ethnie*. It directly addresses your "raw material" argument.
  *   **John Hutchinson, *Nations as Zones of Conflict*:** Focuses on how cultural nationalists (often looking backward) clash with political nationalists (looking forward).
  *   **Rogers Brubaker, *Nationalism Reframed*:** He suggests we stop studying "nations" as things altogether and study "nationhood" as an institutionalized form and "nationalizing" as a political claim. This dissolves the "how old" question entirely.

  **B. Change the Prompt**
  Ban the question "How old are nations?" for three months. Replace it with:
  *   *"What specific pre-modern resources did [Specific Nation] use to construct its modern identity, and what did it have to invent?"*
  *   *"Is national sentiment a cause of modernization or a consequence of it?"*

  **C. The "Japan/Israel" Test Case**
  Abstract debates lead to stalemates. Concrete cases force resolution. Pick two hard cases:
  *   **Japan:** Often cited as a continuous nation from antiquity. Does this disprove Modernism, or was the *political salience* of that identity still modern?
  *   **Israel:** A modern state built on an ancient *ethnie* with continuous religious memory but discontinuous political sovereignty.
  *   **USA:** A "civic nation" with no pre-modern *ethnie*.
  *   *Task:* Ask the Modernists to explain Israel without Smith's *ethnie* concept. Ask the Perennialists to explain the USA without Gellner's *modernity* concept. This forces them to admit they need each other.

  ### Summary
  Your working theory is correct: The Modernists are explaining the **vehicle** (the sovereign state), and the Perennialists are explaining the **fuel** (the ethnic sentiment). A car cannot move without both.

  The disagreement is substantive because it determines whether we view nationalism as a **liberating force** (recovering ancient dignity) or a **coercive force** (manufacturing consent for industrial statehood).

  **The Fix:** Adopt Smith's distinction between *ethnie* and *nation*. Acknowledge that the *sentiment* is old, but the *political form* is new. Then, spend your energy analyzing the **mechanism of transformation** rather than the **date of origin**. If you do that, the stalemate breaks.
