answer: |-
  1. Where The Confusion Is
  The confusion stems from treating a statistical correlation as proof of biological determinism. The paradox shows that when structural barriers lower, career choices diverge, but this doesn't mean equality policies *caused* the divergence or that biology is the sole driver. Instead, it reveals that preferences are complex mixtures of innate traits and lifelong socialization that become visible only when survival isn't the priority. Your roommate's leap to "biology is 100%" ignores how culture shapes desires long before career choice, and suggesting we reduce equality to force integration conflates equal opportunity with engineered outcomes. Ultimately, the data shows what happens when constraints are removed, not what causes the preferences themselves.

  2. Three Other Explanations
  *   **Economic Security:** Using your food analogy, when people are broke they eat whatever fills them up, but when they have resources they choose based on taste. Similarly, in developing economies, STEM is a financial necessity for everyone, whereas wealthier nations allow people to prioritize passion over paycheck.
  *   **Persistent Socialization:** Legal equality doesn't stop parents from buying trucks for boys and dolls for girls. This means "free" choices often reflect years of subtle cultural steering rather than pure biological instincts.
  *   **Hostile Environments:** Women may opt out of STEM not because of innate inability, but because male-dominated workplaces often retain cultures that feel unwelcoming. Thus, the gap can be a sign of ongoing exclusion rather than natural preference.

  3. So What For Fairness
  Justice typically demands equal opportunity and the removal of coercive barriers, not necessarily identical 50/50 outcomes if individual preferences vary. If choices are truly free and informed, an uneven distribution can still be fair, provided society doesn't devalue the paths chosen by one group. Therefore, we should aim for a world where all careers are equally accessible and respected, rather than rolling back equality to force a specific demographic mix. Rolling back rights to engineer a statistic would violate the very freedom required for those choices to be meaningful.
