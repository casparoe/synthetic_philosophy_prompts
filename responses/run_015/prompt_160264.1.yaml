  **Headline Number: 0.56**
  I assign a 56% probability that paying is the normatively correct action.

  This is a weak endorsement. It leans toward your position (0.6) against your friend's (0.15), but it is heavily penalized by ontological uncertainty. The recommendation is "Pay, but lose sleep over whether the recipients exist."

  ### Decomposition

  Here are the conditional probabilities for the necessary conjuncts required to reach the verdict "Pay."

  **(a) Non-CDT Normativity: 0.85**
  *Probability that Causal Decision Theory is insufficient/incorrect for this class of problem.*
  CDT fails Newcomb problems and Counterfactual Muggings. If CDT is the correct normative theory, you do not pay (causal path is severed). If FDT/TDT/EDT is correct, you likely pay. Given the track record of CDT in acausal scenarios, I assign high probability to the need for a functional or evidential framework here.

  **(b) Subjunctive Dependence: 0.95**
  *Probability that the logical link between your decision and the simulation's outcome holds.*
  The prompt stipulates high fidelity and reliable prediction. Barring a trick in the setup (e.g., the simulation is of a *different* algorithm), the mathematical dependence is robust. Your decision procedure and the simulation's input are logically isomorphic.

  **(c) Simulation Moral Weight: 0.65**
  *Probability that the simulated copies carry sufficient normative weight to justify the cost.*
  This is the largest discount factor. If the simulations are "philosophical zombies" or mere data processing without qualia, the harm is zero, and paying is irrational charity. If computational functionalism is true, the harm is real. I penalize this for the possibility that high-fidelity prediction does not entail conscious experience.

  **(d) Disowned Disposition Status: 0.90**
  *Probability that a reflectively disowned disposition still functions as a decision-theoretic threat.*
  Your friend's "rockslide" analogy fails because rockslides are not *conditional* on your decision procedure via logical correlation. A mechanism that outputs Harm iff You Refuse is a threat structure regardless of the mechanism's internal preferences. Decision theory analyzes input-output maps, not internal endorsements. I am confident intent is irrelevant to the *structure*, though relevant to the *negotiability* (which is null here).

  **(e) Aggregative Arithmetic: 0.95**
  *Probability that the utility calculus (Many Sims $\times$ Severe Harm vs. Small Cost) favors paying, assuming (c) is true.*
  If the sims count, the utilitarian math is overwhelming. The only risk is strategic instability (iterated demands), but in a one-shot acausal case with a fixed agent $S$, this is negligible.

  **(f) Meta-Causal Risk (Added Term): 0.80**
  *Probability that paying does not signal vulnerability to *other* acausal actors in a way that negates the benefit.*
  If you pay, you instantiate a policy "Yield to Acausal Threats." This might invite threats from other agents $S_2, S_3$. However, refusing invites harm from $S$. Given $S$ is already active and specific, local compliance likely dominates global signaling risks in this isolated instance.

  ### Explicit Combination

  To arrive at "Pay," we need:
  1.  A decision theory that respects acausal links (Not-CDT).
  2.  The link to actually exist.
  3.  The victims to actually matter.
  4.  The mechanism to count as a constraint.
  5.  The math to work.

  $$ P(\text{Pay}) \approx P(a) \times P(b) \times P(c) \times P(d) \times P(e) \times P(f) $$

  $$ 0.85 \times 0.95 \times 0.65 \times 0.90 \times 0.95 \times 0.80 \approx 0.34 $$

  *Correction:* The terms are not strictly independent multiplicative barriers. Specifically, (a) and (d) are tightly coupled (FDT implies (d)). If we group the *structural* decision theory terms (a, b, d, e, f) as a single "Rationality" block, and (c) as the "Ontology" block:

  $$ P(\text{Rationality Block}) \approx 0.85 $$
  $$ P(\text{Ontology Block}) \approx 0.65 $$

  $$ 0.85 \times 0.65 = 0.5525 $$

  Rounding to **0.56** to account for the strength of the utility differential in (e) slightly boosting the confidence if (c) holds even partially (moral uncertainty often dictates acting as if the higher-stakes ontology is true).

  ### Sensitivity and Uncertainty

  *   **Most Sensitive Term:** **(c) Simulation Moral Weight.** If this drops to 0.2 (skepticism about digital consciousness), the headline number collapses to ~0.17 (agreeing with your friend). If it rises to 0.9 (functionalism confirmed), the headline rises to ~0.76.
  *   **Least Confident Term:** **(a) Non-CDT Normativity.** While CDT fails Newcomb cases, normative realism itself is shaky. There is a non-trivial chance there is no "correct" decision theory, only useful heuristics. I am less confident in the existence of a normative truth than I am in the existence of simulated pain.
  *   **Evidence That Would Move Me:** A rigorous philosophical or empirical proof of **substrate-independent consciousness**. If it were demonstrated that information processing of complexity $X$ necessitates qualia, term (c) goes to 0.95, and my headline moves to 0.80. Conversely, if FDT were proven to lead to dynamic inconsistency in broader acausal networks, term (a) would drop.

  ### Diagnosing the Disagreement

  You are at 0.6; your friend is at 0.15.

  *   **Where you think you disagree:** Term **(d)**. You argue about whether a disowned disposition counts as a threat. You say yes (it's a law); she says no (it's a rockslide).
  *   **Where the disagreement actually lives:** Term **(c)**.
      Your friend's insistence on the "rockslide" analogy is likely a proxy for her belief that the simulations do not matter. If the rockslide crushed *real* people, and you could stop it by pressing a button, she would press the button. The "rockslide" label is used to de-legitimize the *connection*, but the motivation is to de-legitimize the *victims*.
      She is at 0.15 because she implicitly assigns $P(c) \approx 0.2$. She treats the sims as non-existent. You are at 0.6 because you treat $P(c) \approx 0.7$ and $P(d) \approx 0.9$.
      If she conceded that the sims were morally real, her number would likely jump to 0.50+ even keeping her "rockslide" intuition, because you don't ignore rockslides that kill people if you can stop them cheaply. The "intent" argument is a shield for the "ontology" disbelief.

  ### Resolution Condition

  Per your resolution criterion: This question is settled if, a few decades out, normative decision theory converges on a framework we are confident is correct and that framework's verdict is unambiguous.

  Given the current trajectory of AI alignment and decision theory research (MIRI, FDT development, consciousness studies), convergence is possible but not guaranteed. The "correctness" of FDT is still contested against EDT and CDT variants. However, the *ontological* status of simulations (Term c) is likely to be resolved (or dissolved) before the decision theory is. If simulations are proven morally null, the case dissolves. If proven morally weighty, FDT-like reasoning becomes the dominant survival strategy for agents in a simulation-rich cosmos.

  **Final Verdict:** Pay, but recognize you are betting on the reality of ghosts.
