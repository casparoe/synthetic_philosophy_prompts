  ### (1) Opening and framing

  Welcome to all of you. Good evening. Looking around this hall, I see a rare constellation. On one side, constitutional theorists who know the precise weight of a clause; on the other, family and neighbors who know the weight of the person. We are here to honor a scholar who spent forty years arguing that democracies survive by binding themselves. But she also taught us the dangerous question hidden in that promise: When the hands that tied the knot are gone, who exactly is bound? We are here to celebrate a vision of constitutions not as cages, but as promises that know how to end.

  ### (2) The analogy, strained

  Consider the classic image: Odysseus tying himself to the mast to hear the sirens without steering the ship to ruin. This is first-order precommitment. The present self protects the future self from anticipated passion. It is a compelling story for rights and procedures. But Odysseus makes a promise to himself. He wakes up still Odysseus. In a polity, the binders die. The bound are strangers. There is no continuous psychological identity across generations, only a contested narrative of collective agency. If we ignore this, the mast ceases to be a safeguard and becomes a prison imposed by the dead upon the living. The tension my advisor lived with was this: How do we bind a future people without pretending they are the same people who agreed to the binding? If the collective identity shifts radically—if the values, demographics, or fundamental commitments change so much that the "We" is no longer the "We" of the founding—then obedience is not fidelity. It is subjugation. The Ulysses metaphor breaks because the ship changes crew, hull, and destination mid-voyage, yet the ropes remain tight. Without a way to measure that change, entrenchment is just force delayed. This is the problem of intergenerational sovereignty. The founders cannot know the future context, yet they dictate the rules. She demanded we face this discontinuity honestly.

  ### (3) Her contribution

  This is where her work transforms the field. She argued that valid entrenchment requires second-order precommitment. It is not enough to bind against passion; we must design amendment rules that detect when the collective agent has changed. She treated sunset provisions and staged supermajorities not as technical hurdles, but as unbinding protocols. These mechanisms are the contract's way of asking: Are we still the same ship? A supermajority requirement isn't just a barrier to change; it is a sensor for consensus. If a future generation cannot muster that consensus, perhaps they are not yet a coherent new agent. If they can, the original contract acknowledges its own dissolution. She insisted that legitimacy requires an exit door built into the walls. It is a safety valve for legitimacy. This distinguishes her from mere proceduralists.

  ### (4) The toast

  So, we raise our glasses not to immortality, nor to the permanence of laws. We toast to the wisdom of knowing when a promise has expired. To [Advisor's Name], who taught us that the strongest constitutions are those that include instructions for their own renegotiation. You showed us that true stability comes from acknowledging change, not denying it. May your retirement be the one contract you sign that requires no amendment clauses. Thank you for your guidance. Cheers.

  ### Where this reasoning could fail

  The weakest link is the assumption that democratic continuity can be measured. The speech assumes we can identify when a collective agent has changed "radically" enough to trigger unbinding. But there is no neutral metric for collective identity. If a convincing account emerged showing intergenerational identity is purely fictional, the second-order precommitment loses its anchor. If identity is continuous, the protocol is useless. It relies on a threshold that may be unknowable.
