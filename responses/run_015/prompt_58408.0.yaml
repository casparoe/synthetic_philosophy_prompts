answer: |-
  The argument you have constructed is a rigorous formulation of the **inefficacy objection** to consequentialism, often discussed in the literature on threshold problems, causal impotence, and moral luck. It succeeds only if one accepts a specific, narrow version of consequentialism: **Actual Act Consequentialism**.

  To retain a consequentialist framework while avoiding the unacceptable conclusion (9) and respecting your reluctance to accept arbitrary moral luck, you should reject **Premise (1)** (and consequently **Premise (4)**). You must replace the requirement that an act must *actually* make the outcome worse with the requirement that an act must make the *expected* outcome worse.

  Here is the detailed analysis of why this premise must go, what it costs, and how the replacement resolves the dilemma.

  ### 1. The Target: Reject Premise (1)
  **Premise (1):** *An individual purchase is wrong on consequentialist grounds only if it makes the outcome worse than it would otherwise have been.*

  This premise defines wrongness in terms of **actual consequences** (ex-post evaluation). Under this definition, your argument is valid: if 19 purchases causally fail to trigger a restock, they literally make no difference to the number of chickens slaughtered. If wrongness requires making a difference, these 19 acts are not wrong.

  **Why it seemed plausible:**
  This premise aligns with the intuitive principle of "no harm, no foul." It feels unjust to condemn an agent for a bad outcome they did not actually cause. It also aligns with a metaphysical view that moral properties should supervene on the actual state of the world, not on probabilities or epistemic states.

  **Why it must be rejected:**
  Actual Consequentialism fails as a **guide to action**. Agents cannot know the future or the opaque state of supply chain buffers (as noted in your Premise 6). If moral permissibility depends on unknowable facts about inventory levels, consequentialism ceases to be a decision procedure and becomes a post-hoc audit. Furthermore, it leads to the absurdity that two agents performing the exact same action with the exact same information have different moral statuses purely due to luck.

  ### 2. The Replacement: Expected Consequentialism
  You should replace Premise (1) with a principle of **Expected Utility**:

  > **(1*) An individual purchase is wrong on consequentialist grounds if its *expected* disvalue (probability of harm × magnitude of harm) outweighs its expected value.**

  Under this framework, the moral evaluation shifts from the *actual outcome* to the *risk profile* of the action at the time of decision.

  **How this dissolves the argument:**
  *   **Re-evaluating the 19 purchases:** Even though 19 out of 20 purchases do not *actually* trigger a restock, each purchase carries a 1/20 probability of doing so.
  *   **The Calculation:** If triggering a restock causes 20 chickens to be slaughtered, the expected harm of *any single purchase* is $(1/20) \times 20 = 1$ chicken.
  *   **The Result:** Every purchase (the 19 non-triggering ones and the 1 triggering one) bears the same expected moral cost. Premise (5) becomes false. All 20 purchases are equally permissible or impermissible based on whether the buyer's pleasure outweighs the expected suffering of one chicken.
  *   **Addressing Arbitrariness:** This satisfies the intuition behind your Premise (7). Since the expected utility is identical for all 20 purchases, their moral status is identical. The "positional difference" (where one falls in the counting cycle) no longer creates a moral distinction because moral status now supervenes on the *probabilities accessible to the agent*, not the *opaque facts of inventory*.

  ### 3. The Cost of This Rejection
  Adopting Expected Consequentialism is not free. It exacts three specific philosophical costs:

  **A. Wrongness Without Actual Harm**
  You must accept that the 19 purchasers act wrongly (assuming the expected harm outweighs the benefit), even though their actions resulted in zero additional animal deaths.
  *   *Why this is acceptable:* Consequentialism is fundamentally about the rational management of value. Acting on a high risk of catastrophe is irrational and wrong, even if luck intervenes to prevent the catastrophe. We intuitively accept this in other domains (e.g., playing Russian Roulette is wrong even if the chamber is empty).

  **B. The Epistemic Burden**
  You commit to the claim that agents are responsible for estimating probabilities that may be difficult to know (e.g., the exact threshold of the supply chain, the probability of a vote being decisive).
  *   *Mitigation:* Consequentialism requires doing the best one can with available evidence. If the probability is non-zero and the harm is vast, the expected value may still be significant enough to mandate restraint. Ignorance of the specific threshold does not justify ignoring the *existence* of thresholds.

  **C. Separation of Objective and Subjective Rightness**
  You must distinguish between **Objective Rightness** (what actually produces the best outcome) and **Subjective Rightness** (what is rational to do given one's evidence).
  *   *Implication:* In the rare case where an agent knows they are the 19th buyer (perhaps through insider information), the act is objectively permissible but might still be subjectively risky if they aren't certain. Conversely, if they don't know, they must act on the expectation. This distinction is necessary to handle the "opaque facts" worry in Premise (6).

  ### 4. Application to the Three Cases
  Here is how Expected Consequentialism commits you to handling the cases in Premise (9):

  **A. Factory-Farmed Meat**
  *   **Analysis:** You cannot claim "my purchase makes no difference." You must claim "my purchase carries a risk of making a difference."
  *   **Commitment:** If the supply chain operates on batches, your expected harm is roughly one animal per purchase. If the suffering of one animal outweighs the gustatory pleasure of one meal, the purchase is wrong, regardless of whether that specific token purchase triggered the order.
  *   **Result:** The inefficacy defense fails. The collective harm is distributed across individual purchases via probability.

  **B. Climate Change (Leisure Flights)**
  *   **Analysis:** Emissions do not trigger climate change linearly; they contribute to crossing thresholds (tipping points).
  *   **Commitment:** A single flight adds a tiny amount of CO₂. The probability that this specific amount pushes the system over a catastrophic threshold is low, but the magnitude of the catastrophe is effectively infinite (or vastly large).
  *   **Result:** $Probability \times Catastrophe$ can yield a high expected disvalue. Consequentialism requires restraint not because your flight *will* cause the disaster, but because it imposes a non-negligible *risk* of disaster that is not outweighed by the leisure benefit.

  **C. Voting**
  *   **Analysis:** A single vote rarely decides an election.
  *   **Commitment:** The probability of decisiveness ($P$) is tiny (e.g., 1 in 1,000,000). However, the social value ($V$) of the better candidate winning is huge (affecting millions of lives).
  *   **Result:** If $P \times V > Cost\ of\ Voting$, you are obligated to vote. Expected Consequentialism explains why voting is rational even when inefficacy is nearly certain. It avoids the conclusion that voting is pointless by focusing on the *expected value* of the participation, not the *actual causal impact* of the token vote.

  ### 5. Alternative: Accepting Moral Luck (Rejecting Premise 7)
  If you are unwilling to accept Expected Consequentialism (perhaps because you believe wrongness *must* track actual harm), you must instead reject **Premise (7)**.
  *   **The View:** You accept **Moral Luck**. The 20th purchaser is objectively wrong; the 19 are objectively permissible.
  *   **The Cost:** You must concede that moral status turns on arbitrary, unknowable facts. To mitigate this, you would distinguish **Objective Permissibility** (based on actual facts) from **Subjective Blameworthiness** (based on evidence). All 20 agents are equally *blameless* (because they lacked knowledge), but only one is *objectively wrong*.
  *   **Why Expected Consequentialism is Preferable:** This alternative leaves you with a theory that cannot guide action (since you can never know if you are the 20th purchaser). Expected Consequentialism preserves the action-guiding nature of the theory, which is usually the primary motivation for being a consequentialist.

  ### Summary
  To save consequentialism from the inefficacy defense without accepting that collective catastrophes are individually permissible, you must **reject Premise (1)**. You must abandon **Actual Consequentialism** in favor of **Expected Consequentialism**.

  This commits you to the view that **imposing a risk of harm is morally equivalent to causing that harm, weighted by probability.** It costs you the intuition that "no actual harm means no wrong," but it saves the theory from paralysis in the face of thresholds, buffers, and collective action problems. It ensures that moral status supervenes on what the agent can know and influence (the risk), rather than on arbitrary facts of inventory or timing.
