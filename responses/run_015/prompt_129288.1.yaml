      *   **Constraints:** There are hard guardrails (safety, latency, toxicity, reports) that block shipping regardless of $H$ gain (lexical priority, no trade-offs).
      *   **The Problem:** $H$ is treated inconsistently. When $H$ goes up and looks good, it's "quality." When $H$ goes up but looks bad (sycophancy, verbosity, style hacking), it's "reward hacking" and $H$ is patched. There's no ex-ante principle to distinguish these.
      *   **Observations:**
          1.  Train/Test leakage (using $H$ for both training and evaluation) is standard here, despite conventional ML wisdom.
