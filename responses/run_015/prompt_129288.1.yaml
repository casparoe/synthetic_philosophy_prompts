          *   *Infinite Regress:* If every layer is a proxy, you need a "Stop Condition." The stop condition is usually "User Retention/Satisfaction" (long term) or "Lead Engineer Intuition" (short term).
          *   *Engineering term:* "Calibration" and "Human-in-the-loop." Accepting "Proxy all the way down" means focusing on *robustness* of the proxy chain rather than finding the "True" label.

