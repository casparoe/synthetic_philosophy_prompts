      *   It's a boundary problem (fuzzy boundaries).
      *   It's a purpose-driven problem (definition depends on *why* you need it).

  3.  **Drafting the Desiderata (Categorization):**
      *   *Extensional Adequacy:* Does it match our intuitions about specific cases? (Dog = yes, Rock = no, Virus = ?).
      *   *Intensional Adequacy:* Is the definition coherent, non-circular, and theoretically grounded?
      *   *Operational Utility:* Can we measure it? (Important for NASA).
      *   *Temporal/State Sensitivity:* Can it handle dormancy, death, and potentiality?
      *   *Substrate Independence:* Is it Earth-chauvinistic?

  4.  **Addressing Specific Cases & Distinctions:**
      *   *Positives:* Bacteria, humans, trees.
      *   *Negatives:* Crystals, fire, rocks.
      *   *Borderlines:* Viruses, prions, mules, dormant tardigrades, synthetic minimal cells.
      *   *Distinctions:* Alive (current process) vs. Dead (ceased process) vs. Abiotic (never had process) vs. Dormant (paused process).

  5.  **Addressing Camp Preferences (The "Stakeholders"):**
      *   *Astrobiologists:* Need remote detection (operational).
      *   *Philosophers:* Need conceptual clarity (no contradictions).
      *   *OOL Chemists:* Need continuity (no sharp magic boundary).
      *   *Synthetic Biologists:* Need to know when they've crossed the line.

  6.  **Identifying Incompatibilities (The "No-Go Theorems"):**
      *   *Operationality vs. Completeness:* You can't measure "evolutionary potential" on a rover in 5 minutes.
      *   *Historical/Evolutionary vs. Structural:* If life *must* evolve, a single sterile individual (mule) isn't alive. If life is *structural*, a perfect copy that can't reproduce might be.
      *   *Continuity (OOL) vs. Discontinuity (Intuition):* OOL wants a gradient; intuition wants a binary switch.
      *   *Earth-Centric vs. Universal:* Basing it on DNA/Proteins excludes alien life; basing it on "thermodynamics" might include fire/crystals.

  7.  **Identifying the "Killer Constraint":**
      *   What eliminates the most bad definitions?
      *   Is it "Evolution"? (Excludes mules).
      *   Is it "Metabolism"? (Excludes viruses/spores).
      *   Is it "Non-Earth Chauvinism"? (Excludes most biochemical definitions).
      *   *Decision:* The tension between **Extensional Adequacy (matching intuition)** and **Non-Circularity/Theoretical Grounding**. But the prompt asks for the *single requirement* that does the most work eliminating candidates. Usually, it's the requirement to handle **Open-Ended Evolution** without being **Earth-Chauvinistic**. Or, more sharply, the requirement to distinguish **Life from Non-Equilibrium Thermodynamic Dissipative Structures (like fire)**.
      *   *Refinement:* The hardest constraint is usually **distinguishing life from other complex, self-organizing, non-equilibrium systems (like fire or crystals) without relying on specific Earth biochemistry.** This is the "Fire Problem."

  8.  **Structuring the Response:**
      *   **Introduction:** Acknowledge the frustration (it's a feature, not a bug).
      *   **Section 1: The Core Desiderata (The "Must-Haves").** Group by Extensional, Intensional, and Operational.
