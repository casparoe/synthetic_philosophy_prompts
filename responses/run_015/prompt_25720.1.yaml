  10. **Final Polish:** Check tone. Needs to be academic but empathetic to the frustration. Clear headings. Bullet points for readability. (Proceed to generate output based on this structure.)

  *(Self-Correction on the "Killer Constraint")*: I initially thought about Evolution. But a definition based solely on evolution fails the "Mule" test (individual level). A definition based on metabolism fails the "Virus/Spore" test. The *real* killer constraint is **Substrate Independence + Exclusion of Dissipative Structures**. If you allow any chemistry, you risk including fire. If you restrict chemistry, you risk Earth-chauvinism. This is the tightest squeeze. I will frame this as the "Universal vs. Specific" tension. Actually, looking at the literature (Cleland, Ruiz-Mirazo, etc.), the hardest constraint is often **Operationalizability vs. Theoretical Completeness**. I will present the "Fire Problem" (Thermodynamics) as the specific scientific hurdle, but the "Operational vs. Comprehensive" as the pragmatic hurdle. Let's go with the **Fire/Thermodynamics** distinction as the scientific killer, and **Operationality** as the practical killer. The prompt asks for *the* single requirement. I'll argue it's **distinguishing life from other non-equilibrium dissipative systems without appealing to Earth-specific chemistry.**

  *(Wait, re-reading prompt)*: "If you had to pick the single requirement that does the most work eliminating candidate definitions, which one is it?"
  Okay, I need to pick one. The one that kills the most *plausible* but wrong definitions.
  Candidate 1: Must evolve. (Kills mules, but maybe mules are alive?).
  Candidate 2: Must metabolize. (Kills viruses/spores).
  Candidate 3: Must be substrate neutral. (Kills DNA-based definitions).
  Candidate 4: Must distinguish from fire/crystals. (Kills pure thermodynamic definitions).
  I think the strongest candidate is **The requirement to distinguish living systems from other non-equilibrium dissipative structures (the "Fire Problem") without relying on Earth-specific biochemistry.** This kills thermodynamic definitions, pure complexity definitions, and Earth-chauvinistic definitions simultaneously.

  Let's build the response around this.

