answer: |-
  This is a sophisticated position, essentially a defense of a form of **Luck Egalitarianism** or **Left-Libertarianism** that prioritizes procedural fairness and dynamic efficiency over patterned end-states. Your core claim rests on the coherence of the distinction between *equality of opportunity* (EOP) and *equality of outcome* (EOO).

  To map what counts against this, we must move beyond the empirical claim that "U.S. mobility is currently low" (which a defender can dismiss as a contingent policy failure rather than a structural flaw) and focus on arguments suggesting that high inequality *structurally necessitates* low mobility or *conceptually dissolves* the distinction you rely on.

  Here is an honest map of the defeaters, ranked from those that merely complicate your position to those that threaten to collapse its foundation.

  ---

  ### I. The Ranking of Defeaters

  #### 1. Fatal: The Conceptual Collapse (The "Resource-Precondition" Argument)
  **The Objection:** Equality of opportunity is not merely the absence of formal barriers (legal discrimination); it requires the possession of certain resources to utilize those opportunities. If economic inequality exceeds a certain threshold, the wealthy can purchase superior "opportunity-goods" (education, health, networks, internships) that are functionally exclusive.
  **Why it is Fatal:** If the *means* to opportunity are distributed according to the *outcomes* of the previous generation, then EOP logically requires a constraint on EOO. You cannot have perfect EOP with unlimited EOO.
  **The Mechanism:** This is the **Meritocratic Paradox** (articulated by Daniel Markovits). The elite do not transmit wealth directly (which looks like aristocracy); they transmit *human capital* through massive investment in education. This looks like "merit," but the merit is purchased. If credentialing is the primary gatekeeper to income, and credentials are bought with parental income, the distinction between "mobility" and "inheritance" collapses.
  **Defender's Dilemma:** To maintain the distinction, you must argue that parents have a right to purchase advantages for their children that effectively negate the competitive equality of others. If you concede they do not, you must support radical redistribution of educational opportunity, which looks indistinguishable from the European preference for outcome compression.

  #### 2. Severe: The Great Gatsby Curve (Inequality as a Causal Block)
  **The Objection:** High inequality is not just compatible with low mobility; it *causes* it. This is the "Great Gatsby Curve" hypothesis (Miles Corak, Alan Krueger).
  **Why it is Severe:** Your position assumes inequality and mobility are independent variables (we can have high inequality *and* high mobility). If they are negatively correlated structurally, then defending inequality *is* defending immobility.
  **The Mechanism:** **Opportunity Hoarding** (Charles Tilly). When the stakes of the bottom are too low and the stakes of the top are too high, the top invests disproportionately in closing the ladder behind them (zoning laws, legacy admissions, unpaid internships, licensing barriers). The "institutional conditions" for mobility are endogenous to the level of inequality.
  **Defender's Dilemma:** You must argue that the U.S. can return to the 1950s model (high growth, high mobility, lower inequality) without adopting European-style constraints. If the mechanism of high inequality inherently concentrates political power (see below), this becomes empirically implausible.

  #### 3. Significant: Political Capture and the Rules of the Game
  **The Objection:** "Formal equality of opportunity" assumes the rules of the economic game are neutral. Extreme income dispersion translates into unequal political voice, allowing the winners to rewrite the rules (tax code, antitrust, labor law) to favor capital over labor and incumbents over entrants.
  **Why it is Significant:** It attacks the "Formal" part of your "Formal Equality of Opportunity." If the wealthy shape the legislation that defines property rights and market structures, the market is no longer a neutral arbiter of merit.
  **Defender's Dilemma:** You must propose campaign finance or lobbying reforms that are robust enough to prevent economic power from becoming political power, without infringing on free speech or property rights. Historically, this is the hardest institutional design problem to solve.

  #### 4. Awkward: Positional Goods and Relative Deprivation
  **The Objection:** Many goods are **positional** (zero-sum). Status, political influence, and access to elite networks depend on *relative* standing, not absolute income. If inequality widens, the "distance" between rungs increases, making the cost of failure higher (social exclusion, health disparities).
  **Why it is Awkward:** It suggests that even with perfect mobility, high inequality creates social harms (violence, distrust, poor health outcomes) that undermine the *value* of the mobility. It also touches on **Endogenous Preferences**: In highly unequal societies, preferences shift toward status competition and short-termism, undermining the autonomous agency required for moral responsibility.
  **Defender's Dilemma:** A committed defender can dismiss this as "envy" or "paternalism." They can argue that justice is about rights and procedures, not social psychology or health statistics. This is a normative bullet they are often willing to bite.

  ---

  ### II. The Conceptual Vulnerability: Does the Distinction Collapse?

  You asked specifically whether the distinction between EOP and EOO collapses once we account for dynastic transmission and relative deprivation. **The answer is: Yes, under specific conditions.**

  The American view relies on a **temporal separation**: Outcomes at $T_1$ should not determine Opportunities at $T_2$.
  However, if:
  1.  **Human Capital is Cumulative:** Skills beget skills, and the most efficient way to acquire skills is through early childhood investment.
  2.  **Investment is Income-Elastic:** Wealthier parents invest disproportionately more in their children (the "parental investment gap" is now larger than the "school funding gap").
  3.  **Credentials are Gatekeepers:** Access to high income is strictly mediated by credentials that require that early investment.

  Then, **Outcome at $T_1$ $\rightarrow$ Opportunity at $T_2$ $\rightarrow$ Outcome at $T_2$.**

  In this chain, Outcome at $T_1$ is the dominant predictor of Outcome at $T_2$. To break the chain at the second link (Opportunity), you must intervene at the first link (Outcome). You must compress outcomes at $T_1$ to equalize opportunities at $T_2$.

  **The Collapse:** If you acknowledge that "fair equality of opportunity" (Rawls) requires mitigating the effects of social contingency, you are driven toward **Equality of Condition** (Shelia Shulman/Elizabeth Anderson). If you do not mitigate the effects of parental wealth on child development, you are not ensuring equality of opportunity; you are merely ensuring that the competition to replicate privilege is meritocratic.

  **The "Stable Foundation" Risk:** The American view loses its stable foundation if it cannot explain why parents have a right to transmit *advantage* (via education/culture) but not *property*. If the transmission of advantage is just as determinative of life prospects as the transmission of cash, the moral distinction between "redistributing income" and "redistributing educational opportunity" vanishes.

  ---

  ### III. Predictions: What the American View Risks

  A defender of the American view risks the following predictions, which the European view ostensibly avoids:

  1.  **The Oligarchic Drift:** Without outcome compression, wealth concentration will inevitably translate into political capture, destroying the "formal equality" you rely on. (The European view risks bureaucratic stagnation; the American view risks plutocracy).
  2.  **Social Fragmentation:** High inequality creates distinct experiential worlds (the "secession of the successful"). If the elite do not share institutions (schools, hospitals, neighborhoods) with the rest, solidarity erodes, and the welfare state becomes politically unsustainable.
  3.  **Efficiency Losses via Talent Misallocation:** Contrary to the "incentives" argument, extreme inequality can *reduce* efficiency. If high-paying roles are captured by the children of the wealthy rather than the most talented poor (due to the credentialing bottleneck), human capital is misallocated. (This is the Raj Chetty finding: innovation is lower because poor geniuses don't become inventors).

  ---

  ### IV. The Defender's Playbook: Concede vs. Dismiss

  If you are to defend this position in a seminar, you must know where to yield and where to stand firm.

  **What a Committed Defender Should Concede (Damaging):**
  *   **The Education Loophole:** You must concede that if private spending on education creates insurmountable advantages, the "formal" equality of opportunity is a sham. You cannot defend the current U.S. system of local school funding + private tutoring + legacy admissions.
  *   **Political Corruption:** You must concede that unlimited income dispersion *without* strict campaign finance reform is incompatible with democratic equality.
  *   **The Floor:** You must concede that there is a minimum threshold of material security required to be a "free and equal" citizen. Absolute poverty undermines agency.

  **What a Committed Defender Should Dismiss (Wrong Metric):**
  *   **Outcome Parity:** Dismiss the idea that income dispersion *itself* is unjust. If the dispersion results from voluntary exchange and fair procedure, it is morally neutral.
  *   **Relative Deprivation:** Dismiss the claim that being "worse off than others" is a matter of justice, provided one's absolute threshold of capability is met. This frames justice as envy rather than rights.
  *   **The European Trade-off:** Argue that European compression often comes at the cost of dynamic innovation and that the "stagnation" risk is actually a "liberty" cost (higher taxes on labor/coercive wage setting).

  ### Summary for Your Seminar

  Your position is vulnerable not because mobility is currently low, but because **high inequality creates a gravitational pull that makes high mobility physically and conceptually impossible over time.**

  The "Conceptual Collapse" is your greatest threat. If you cannot explain why a parent's right to spend money on their child's SAT tutor does not violate another child's right to a fair competition, the distinction between Opportunity and Outcome dissolves. To save the American view, you must argue for a **radical separation of spheres**: absolute liberty in the economic sphere, but strict egalitarianism in the civic/educational sphere. But history suggests the former inevitably colonizes the latter. Acknowledging this tension is the only way to make the defense intellectually honest.
