answer: |-
  **Project Title:** The Diachronic Cost of Constitution: A Stress Test for Material Object Ontology

  **Project Summary**
  The puzzle of material constitution is traditionally framed as a synchronic problem: how can a statue and the lump of clay that constitutes it occupy the same space at the same time without being identical? Standard solutions—Constitutionalism, Eliminativism, Relative Identity, and Perdurantism—are typically evaluated on their ability to resolve this momentary tension. This project proposes that the synchronic framing obscures the true metaphysical costs of these views. By shifting the focus to a diachronic framework, specifically involving gradual part replacement, I intend to demonstrate that several standard solutions generate untenable commitments regarding persistence, vagueness, and supervenience that are not apparent in the static case. The paper will not argue for a single correct solution to the constitution puzzle, but rather provide a comparative ranking of existing views based on their diachronic stability.

  **Research Question**
  To what extent do standard solutions to the synchronic puzzle of material constitution remain viable when subjected to diachronic stress tests involving gradual part replacement?

  More precisely: Does the transition from $t_1$ (initial constitution) to $t_2$ (post-replacement) force standard ontological views to adopt ad hoc persistence conditions, unacceptable vagueness, or counterintuitive verdicts on object survival that undermine their initial synchronic plausibility?

  **Background and Motivation**
  The standard literature treats the Statue/Clay case as a problem of counting at a time.
  *   **Constitutionalists** argue the objects are distinct but coincident, differing in modal properties.
  *   **Eliminativists** deny the existence of the statue (or the lump).
  *   **Relative Identity Theorists** deny absolute identity.
  *   **Perdurantists (4Dists)** argue the objects are distinct spacetime worms that share a temporal part.

  My hypothesis is that these views are "synchronically stable" but "diachronically fragile." For example, Constitutionalism relies on the statue having different persistence conditions than the clay. However, in a gradual replacement scenario, it is unclear *when* the statue's conditions are violated. If the clay survives total atomic replacement, does the statue? If yes, the distinction collapses. If no, where is the cutoff?

  Existing positions leave this open because they treat sortals as static classifiers. Identifying "statue" as a phase sortal of "clay" solves the counting problem at $t_1$, but it does not specify the truth conditions for the phase ending during gradual change. Similarly, while 4Dism dissolves synchronic coincidence by appealing to distinct temporal parts, it faces a renewed problem diachronically: determining which temporal worms exist. If every stage of replacement constitutes a new worm, we face radical proliferation; if only one worm persists, we face the same vagueness problems as 3Dism. The diachronic frame forces these views to commit to specific boundaries they often gloss over.

  **Methodology and Case Construction**
  The paper will proceed by constructing specific diachronic scenarios and applying the standard views to them. To ensure this illuminates the *constitution* debate rather than collapsing into the standard *Ship of Theseus* literature, the cases will be designed to track the *relationship* between the coincident objects, not just the persistence of one.

  *   **Distinguishing from Ship of Theseus:** The Ship of Theseus asks whether Object $A$ at $t_1$ is identical to Object $B$ at $t_2$. My cases will ask: Given that Statue $S$ and Clay $C$ are distinct (or identical) at $t_1$, does the relation $R(S, C)$ hold at $t_2$ after replacement? This highlights whether the *constitutive* link breaks before the *persistence* of the constituter breaks.
  *   **Scenario 1: The Slow Swap.** The clay parts are replaced one by one with new clay, preserving the form.
      *   *Test:* Does the statue survive? If the clay survives (as matter), does the statue survive as form? If they diverge, what happens to the constitution relation?
  *   **Scenario 2: The Form Degradation.** The clay parts are replaced, but the form is slightly altered at each step (e.g., the nose gets progressively larger).
      *   *Test:* This targets the "sortal-relative" views. At what point does the phase sortal "statue" cease to apply to the clay phase?
  *   **Scenario 3: The Reassembly.** The original clay parts are stored and later reassembled.
      *   *Test:* This tests the modal commitments of the views diachronically.

  I will analyze how each ontological framework handles the transition points in these scenarios. The focus will be on whether the view requires brute facts, arbitrary cutoffs, or counterintuitive denials of existence to maintain consistency.

  **Timeline**
  *   **Month 1: Literature Review and Refinement.** Focus on texts that discuss persistence conditions for constituted objects. Identify specific passages where authors acknowledge but sidestep the diachronic implications. Finalize the specific parameters of the replacement scenarios to ensure they are distinct from standard fission/fusion cases.
  *   **Month 2: Argument Construction.** Draft the analysis of the "Slow Swap" and "Form Degradation" cases. Apply the Constitutional and Perdurantist frameworks specifically. This is the core analytic work, mapping the logical consequences of each view over time.
  *   **Month 3: Comparative Evaluation and Drafting.** Synthesize the findings into a ranked verdict. Write the full draft, ensuring the distinction between synchronic and diachronic costs is the through-line.
  *   **Month 4: Revision.** Refine arguments for clarity and conciseness. Ensure the "Failure Conditions" are addressed—i.e., explicitly argue why the diachronic cases offer *new* problems rather than just repeating synchronic ones.

  **Success and Failure Conditions**
  *   **Success:** A successful result will yield a differentiated verdict. For example, demonstrating that Perdurantism handles the "Slow Swap" better than Constitutionalism because it avoids vague identity over time, or conversely, that Perdurantism incurs a higher cost in ontological proliferation. The paper will provide a ranked list of views based on "Diachronic Coherence."
  *   **Failure:** The project would fail if the diachronic cases merely reproduce the synchronic disagreement. For instance, if the Eliminativist simply denies the statue exists at $t_2$ for the exact same reason they denied it at $t_1$, the diachronic lens has added no discriminatory power. Similarly, if all views succumb to the same vagueness problem regarding *when* the statue ceases to exist, the project will have shown a general problem for metaphysics rather than a specific critique of constitution theories. I will mitigate this risk by focusing on *how* the views justify the cutoff, not just *where* they place it.

  **Scope and Feasibility Assessment**
  A 7,000-word limit is tight for a comprehensive survey of all standard views applied to multiple diachronic scenarios. There is a risk of the paper becoming a superficial list of objections without deep engagement.

  *   **Risk:** Attempting to cover Eliminativism, Relative Identity, Constitutionalism, and Perdurantism equally may result in word-count exhaustion before the diachronic analysis can be fully developed.
  *   **Mitigation:** I propose narrowing the scope of the term paper proper to focus primarily on **Constitutionalism vs. Perdurantism**. These are the two most robust competitors that accept the existence of both objects (in some sense) and thus face the most pressure to explain their divergence over time. Eliminativism can be addressed briefly as a control case (since it dissolves the diachronic problem by denying one relata), and Relative Identity can be noted as a niche alternative.
  *   **Feasibility:** With this narrowing, the project is feasible for one semester. The month-by-month plan allows sufficient time for the construction of the cases, which is the most novel part of the work. If the analysis of the "Form Degradation" scenario proves too complex, it will be the first element cut, preserving the core "Slow Swap" argument.

  **Conclusion**
  This project shifts the burden of proof in the material constitution debate. Instead of asking which view best saves our intuitions about a static statue, it asks which view best survives the statue's destruction and reconstruction. By exposing the diachronic costs, I aim to show that the synchronic puzzle is not self-contained, and that a solution's viability depends on its temporal endurance.
