  5.  **Final Polish:** Ensure the distinction between "libertarian paternalism" (the broad theory) and "asymmetric paternalism" (the specific cost-benefit claim) is clear, as the user specifically asked about the latter. (Self-correction: Asymmetric paternalism is often associated with Camerer et al., but Thaler/Sunstein overlap heavily. I will treat them as the user does: the idea that burdens on rational actors should be minimal).

