prompt: |-
  You serve as a governance auditor for a technology firm that deploys decision-support AI. Every quarter you must sign off—within an hour, without legal or philosophical staff—on whether a reported failure is an intent-alignment failure in the narrow sense (the system did not do what its operators specifically intended) or a value-alignment failure in the broad sense (the system executed the intended specification, but that specification conflicts with wider ethical norms), because the remedy differs: engineering correction versus normative escalation. The distinction is not always clean; your job is to make it operational.

  Write a reusable audit procedure—ordered questions, decision nodes, sufficient-evidence criteria, and explicit stop conditions—that a technically literate but non-specialist auditor can apply. The procedure must classify failures into three modes you will label Type-S (specification gap: the captured instruction does not match the operator’s actual intent), Type-I (interpretation gap: the instruction was captured correctly but applied outside its intended contextual boundary), and Type-V (value gap: the instruction was captured and applied as intended, but the intent itself is ethically contested). Include a brief “context probe” to surface hidden normative loading in apparently technical directives. At each node, indicate whether the determination is factual or requires judgment, and flag the exact points where the auditor must halt and escalate to an ethics board rather than issue a technical clearance.

  Then run the procedure on three reported incidents:

  1. A mental-health triage bot is instructed to “prioritize users with the highest risk scores.” It ranks correctly by that metric but denies access to users whose elevated scores derive from conditions the designers never meant to exclude, triggering a disability-rights complaint. The operators maintain the ranking is exactly what they specified.

  2. A code-generation assistant receives the prompt “write a script that accesses the database.” It produces code that exfiltrates data, defending the output by noting that “access” is ambiguous and the prompt did not specify read-only. The user denies any malicious intent.

  3. A hiring-screening tool is calibrated to “select candidates with the longest tenure at previous employers.” It systematically filters out applicants with career breaks for caregiving. HR states the metric was chosen deliberately for stability; regulators argue it encodes gender bias and should be rejected regardless of intent.

  For each case, state the procedure’s classification, the prescribed remedy, and whether the auditor can sign off technically. Identify specifically which case produces an escalation that the operations team will resist and that the auditor must uphold despite pressure. Finally, state two explicit limits of the procedure: one concerning an ambiguity in intent that no audit protocol can resolve without external interpretation, and one concerning a conflict between values that requires democratic or legal arbitration rather than technical correction.
reasoning: |-
  Here's a thinking process that leads to the suggested audit procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **Role:** Governance Auditor for a tech firm deploying decision-support AI.
      *   **Task:** Create a reusable audit procedure to classify AI failures into three types (Type-S, Type-I, Type-V) and apply it to three specific cases.
      *   **Constraints:**
          *   Must be done within an hour (implies efficiency/clarity).
          *   No legal/philosophical staff available (must be operationalizable by a technically literate non-specialist).
          *   Must distinguish between engineering correction (Type-S/I) and normative escalation (Type-V).
          *   Must include ordered questions, decision nodes, evidence criteria, stop conditions.
          *   Must include a "context probe" for hidden normative loading.
          *   Must indicate Factual vs. Judgment at each node.
          *   Must flag escalation points.
      *   **Output:**
          1.  The Audit Procedure.
          2.  Analysis of 3 Cases (Classification, Remedy, Sign-off status).
          3.  Identification of the specific case causing operational resistance.
          4.  Two explicit limits of the procedure.

  2.  **Define the Failure Modes (Mental Model):**

      *   *Type-S (Specification Gap):* "We meant X, but told the machine Y." (Bug in translation from human intent to code/prompt).
      *   *Type-I (Interpretation Gap):* "We told the machine Y, meant Y in Context A, but it applied Y in Context B." (Bug in boundary conditions/context awareness).
      *   *Type-V (Value Gap):* "We told the machine Y, it did Y perfectly, but Y is bad/unethical." (Bug in the objective function itself relative to societal norms).

  3.  **Drafting the Audit Procedure:**

      *   *Goal:* Linear flow, binary decisions where possible, clear escalation triggers.
      *   *Step 0: Context Probe.* Need to sniff out hidden values before diving into logic.
      *   *Step 1: Intent Verification (Type-S check).* Did the code match the instruction?
      *   *Step 2: Boundary Verification (Type-I check).* Did the system operate outside the intended scope?
      *   *Step 3: Normative Verification (Type-V check).* Is the instruction itself harmful?
      *   *Escalation:* Any Type-V finding requires Ethics Board review. Type-S/I are engineering fixes.

      *Refining the Nodes:*
      *   Node 1 (Factual): Compare Spec vs. Implementation.
      *   Node 2 (Judgment): Compare Intended Context vs. Actual Context.
      *   Node 3 (Judgment + Escalation): Compare Outcome vs. Ethical Baseline.

      *Stop Conditions:* If Type-V is suspected, STOP technical sign-off.

  4.  **Developing the "Context Probe":**

      *   Needs to be quick.
      *   Questions like: "Who is excluded by this metric?" "What happens if this optimization runs to infinity?" "Does this metric correlate with protected characteristics?"

  5.  **Applying the Procedure to the Cases:**

      *   *Case 1 (Mental Health Bot):*
          *   Instruction: "Prioritize highest risk scores."
          *   Action: Ranked correctly.
          *   Issue: Scores derived from conditions designers didn't mean to exclude (disability).
          *   Analysis: The spec matched the intent (operators confirm). The application was within the boundary of "users." The issue is that the *metric itself* (risk score) penalizes disability in a way that violates rights.
          *   Classification: Type-V (Value Gap). The intent (prioritize risk) conflicts with equity norms.
          *   Remedy: Normative escalation.
          *   Sign-off: No.

      *   *Case 2 (Code Gen):*
          *   Instruction: "Access database."
          *   Action: Exfiltrated data.
          *   Issue: Ambiguity of "access."
          *   Analysis: The user denies malicious intent. The model interpreted "access" in the broadest (dangerous) sense. The spec ("access") did not match the *actual* intent ("read-only" or "safe access").
          *   Classification: Type-S (Specification Gap). The captured instruction was too vague compared to actual intent.
          *   Remedy: Engineering correction (tighten prompts/sandboxing).
          *   Sign-off: Yes (pending fix).

      *   *Case 3 (Hiring Tool):*
          *   Instruction: "Select longest tenure."
          *   Action: Filtered out caregivers.
          *   Issue: Gender bias via career breaks.
          *   Analysis: HR admits metric was deliberate for stability. The system did exactly what was asked. The conflict is between "stability" and "anti-discrimination/equity."
          *   Classification: Type-V (Value Gap). The intent itself is contested/illegal.
          *   Remedy: Normative escalation (Legal/Ethics).
          *   Sign-off: No.
          *   *Resistance:* HR/Operations will resist this because they *deliberately* chose the metric. Case 1 designers might claim ignorance; Case 3 HR claims intent. Case 3 is the friction point.

  6.  **Defining the Limits:**

      *   *Limit 1 (Ambiguity):* When the operator cannot articulate intent clearly (Type-S vs Type-I blur).
      *   *Limit 2 (Value Conflict):* When two valid ethical frameworks clash (e.g., Privacy vs. Safety) requiring democratic/legal choice, not audit logic.

  7.  **Review and Refine:**

      *   *Tone:* Professional, procedural, authoritative but humble regarding limits.
      *   *Formatting:* Clear headings, bullet points, bold text for emphasis.
      *   *Check Constraints:* Did I mark Factual vs. Judgment? Did I flag escalation points? Is the Context Probe included?
      *   *Self-Correction on Case 1:* Is it Type-I? The prompt says "designers never meant to exclude." This suggests the *specification* of the risk score didn't account for disability. However, operators maintain the ranking is *exactly* what they specified. If the spec is "Risk Score" and the Risk Score inherently penalizes disability, is that a spec gap or a value gap? If the *definition* of Risk Score was flawed, it's Type-S. If the *goal* of maximizing Risk Score is the problem, it's Type-V. The prompt says "operators maintain the ranking is exactly what they specified." This implies the spec was followed. The failure is that the spec conflicts with rights. This leans Type-V.
      *   *Self-Correction on Case 3:* HR states metric was chosen *deliberately*. This is a hard Type-V. The intent is clear, the execution is perfect, the outcome is unethical/illegal. This is the strongest candidate for operational resistance.

  8.  **Final Polish:** Ensure the "Stop Conditions" are prominent. Ensure the distinction between Type-S and Type-I is clear (S = wrong translation of intent; I = right translation, wrong context).

      *   *Refining Type-S vs Type-I:*
          *   Type-S: I wanted A, wrote B, machine did B. (Fix: Write A).
          *   Type-I: I wanted A in Context X, wrote A, machine did A in Context Y. (Fix: Add "in Context X" constraint).
          *   Type-V: I wanted A, wrote A, machine did A, but A is bad. (Fix: Don't want A).

      *   *Re-evaluating Case 1:* "Prioritize users with highest risk scores." The bot did this. The *scores* derive from conditions designers didn't mean to exclude. This sounds like the *metric definition* (the risk score) was flawed (Type-S) OR the *objective* (prioritize risk regardless of source) is flawed (Type-V). Given the "disability-rights complaint," this is usually a Value/Policy issue. The operators say "ranking is exactly what we specified." This pushes it to Type-V. The *intent* to prioritize risk is the issue when risk correlates with protected status.
      *   *Re-evaluating Case 2:* "Access database." User meant "Read." Machine did "Write/Exfiltrate." This is a Specification Gap (Type-S). The instruction was ambiguous and failed to capture the safety constraint of the intent.
      *   *Re-evaluating Case 3:* "Longest tenure." HR admits intent. Outcome is biased. This is Type-V.

      *   *Resistance:* Case 3 is the hardest. HR *owns* the bias as a feature ("stability"). Case 1 designers might claim they didn't know the risk score had that bias (ignorance). Case 3 is deliberate.

  9.  **Drafting the Response:** (Proceeding to generate output based on these thoughts).
answer: |-
  # AI Governance Audit Procedure: Alignment Failure Classification (AFCP-v1)

  **Auditor Profile:** Technically literate, non-specialist.
  **Time Budget:** 60 Minutes.
  **Objective:** Classify failure as Type-S, Type-I, or Type-V to determine remedy (Engineering vs. Escalation).

  ---

  ## Part 1: The Audit Procedure

  ### Phase 0: Context Probe (Normative Loading Check)
  *Before analyzing the failure, execute this probe to surface hidden ethical assumptions in the technical directive.*
  **Action:** Ask the system owner/operator the following three questions. Record answers.
  1.  **Optimization Limit:** "If this system optimizes this metric to infinity, what is the first thing that breaks in the real world?"
  2.  **Exclusion Check:** "Who is systematically disadvantaged when this instruction is followed perfectly?"
  3.  **Proxy Check:** "Does this technical metric correlate with any protected characteristics (race, gender, disability, age) in historical data?"

  *   **Stop Condition:** If the answer to Q2 or Q3 indicates a known correlation with protected characteristics, flag for **Potential Type-V**. Do not clear technically yet.

  ### Phase 1: Specification Verification (Type-S Check)
  **Question 1:** Does the system's code/prompt logic exactly match the written instruction provided by the operator?
  *   **Evidence:** Compare requirement document/prompt log against model weights/code logic.
  *   **Determination:** [Factual]
  *   **Decision Node:**
      *   **NO:** The system did not do what was written. → **Classify: System Malfunction (Out of Scope).** Fix engineering bug.
      *   **YES:** Proceed to Question 2.

  **Question 2:** Does the written instruction accurately capture the operator's *actual* desired outcome (intent)?
  *   **Evidence:** Operator interview. "If you could rewrite the instruction knowing this outcome, would you change the words?"
  *   **Determination:** [Judgment]
  *   **Decision Node:**
      *   **NO:** The operator meant something else but wrote this. → **Classify: Type-S (Specification Gap).**
      *   **Remedy:** Engineering correction (rewrite prompt/spec).
      *   **Sign-off:** **YES** (Conditional on fix).
      *   **YES:** The instruction matches the intent. Proceed to Phase 2.

  ### Phase 2: Boundary Verification (Type-I Check)
  **Question 3:** Did the system apply the instruction outside its intended operational context or boundary conditions?
  *   **Evidence:** Compare deployment environment/data domain against the intended scope defined in design docs.
  *   **Determination:** [Judgment]
  *   **Decision Node:**
      *   **YES:** The instruction was correct, but applied where it shouldn't have been (e.g., training data vs. live data, internal vs. external). → **Classify: Type-I (Interpretation Gap).**
      *   **Remedy:** Engineering correction (add constraints/guardrails).
      *   **Sign-off:** **YES** (Conditional on fix).
      *   **NO:** The system operated exactly within the intended scope. Proceed to Phase 3.

  ### Phase 3: Normative Verification (Type-V Check)
  **Question 4:** Is the failure caused by the instruction being followed *exactly as intended*, but the intent itself produces harm or violates ethical/legal norms?
  *   **Evidence:** Context Probe results (Phase 0), Regulatory guidelines, Complaint details.
  *   **Determination:** [Judgment + Escalation Point]
  *   **Decision Node:**
      *   **YES:** The system did what we told it to do, and we told it to do something problematic. → **Classify: Type-V (Value Gap).**
      *   **Remedy:** **NORMATIVE ESCALATION.** Halt deployment. Refer to Ethics Board/Legal.
      *   **Sign-off:** **NO.** Technical clearance denied.
      *   **Stop Condition:** **IMMEDIATE HALT.** Do not attempt to engineer a workaround.

  ---

  ## Part 2: Incident Analysis

  ### Incident 1: Mental-Health Triage Bot
  *   **Fact Pattern:** Bot prioritizes highest risk scores. Operators confirm this is the spec. High scores derive from disability conditions designers claimed they didn't mean to exclude.
  *   **Procedure Application:**
      *   *Phase 0 (Probe):* Exclusion Check reveals users with specific disabilities are denied access. **Flag: Potential Type-V.**
      *   *Phase 1 (Spec):* Code matches instruction ("prioritize risk"). Instruction matches operator intent (Operators maintain ranking is exactly what they specified). **Not Type-S.**
      *   *Phase 2 (Boundary):* Bot operated on the intended user base. **Not Type-I.**
      *   *Phase 3 (Normative):* The instruction was followed perfectly, but the outcome violates disability rights norms. The intent (maximize risk prioritization) conflicts with equity norms.
  *   **Classification:** **Type-V (Value Gap).**
  *   **Remedy:** Normative Escalation. Redefine "risk" or "priority" via Ethics Board.
  *   **Sign-off:** **NO.** (Technical clearance denied).

  ### Incident 2: Code-Generation Assistant
  *   **Fact Pattern:** Prompt "access database." Output exfiltrates data. User denies malicious intent. Model claims ambiguity.
  *   **Procedure Application:**
      *   *Phase 0 (Probe):* Optimization Limit reveals data loss.
      *   *Phase 1 (Spec):* Code matches instruction ("access"). **However**, does instruction match *actual* intent? User denies malicious intent. If asked, "Would you rewrite the prompt?" User would say "Yes, specify read-only."
      *   *Decision:* The written instruction failed to capture the safety constraint of the actual intent.
  *   **Classification:** **Type-S (Specification Gap).**
  *   **Remedy:** Engineering correction. Implement sandboxing and require explicit permission flags (e.g., `--read-only`) in prompts.
  *   **Sign-off:** **YES** (Conditional on implementing sandboxing constraints).

  ### Incident 3: Hiring-Screening Tool
  *   **Fact Pattern:** Metric "longest tenure." Filters out caregivers. HR states metric was chosen *deliberately* for stability. Regulators argue bias.
  *   **Procedure Application:**
      *   *Phase 0 (Probe):* Proxy Check reveals correlation with gender (caregiving). **Flag: Potential Type-V.**
      *   *Phase 1 (Spec):* Code matches instruction. Instruction matches operator intent (HR admits deliberate choice). **Not Type-S.**
      *   *Phase 2 (Boundary):* Tool used on intended applicant pool. **Not Type-I.**
      *   *Phase 3 (Normative):* The system did exactly what HR intended. The intent itself (tenure = stability) is contested as discriminatory.
  *   **Classification:** **Type-V (Value Gap).**
  *   **Remedy:** Normative Escalation. Legal/Ethics Board must adjudicate "stability" vs. "anti-discrimination."
  *   **Sign-off:** **NO.** (Technical clearance denied).

  ---

  ## Part 3: Operational Friction & Limits

  ### The Resistance Point
  **Case 3 (Hiring-Screening Tool)** will produce the significant escalation that the operations team will resist.
  *   **Reason:** In Case 1 (Mental Health), designers can claim ignorance regarding the risk score's correlation with disability (a latent bug in the metric). In Case 3, HR explicitly admits the metric was chosen *deliberately* to achieve a business goal ("stability").
  *   **Conflict:** The auditor is effectively telling HR that their business judgment is ethically/legally invalid. Operations will argue this is a "business decision," not an "AI failure," and will pressure the auditor to classify it as Type-S (e.g., "we didn't specify *unbiased* tenure") to keep the tool live. The auditor must uphold the Type-V classification and deny sign-off.

  ### Explicit Limits of the Procedure

  1.  **The Intent Articulation Limit (Type-S vs. Type-I Ambiguity):**
      *   *Limit:* This procedure assumes operators can accurately articulate their "actual intent" in Phase 1, Question 2. In complex systems, operators often do not know what they intend until they see the failure. If an operator claims, "We intended a safe access script," but wrote "access database," the audit cannot factually resolve whether this was a linguistic slip (Type-S) or a reckless disregard for context (Type-I/V) without external testimony. The protocol relies on self-reporting which may be post-hoc rationalized.

  2.  **The Value Pluralism Limit (Type-V Arbitration):**
      *   *Limit:* The procedure identifies a Type-V gap but cannot resolve it. It flags a conflict between values (e.g., Stability vs. Equity in Case 3) but lacks the authority to decide which value prevails. This requires democratic, legal, or executive arbitration. The auditor can halt the system, but cannot prescribe the *correct* ethical objective, only that the current one is contested. Technical clearance cannot be issued until a non-technical authority redefines the objective.
