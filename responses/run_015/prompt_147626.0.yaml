  # JOINT WORKING PAPER: MAPPING THE DISPUTE ON MATERIAL CONSTITUTION AND ARTIFACT IDENTITY

  **Date:** October 26, 2023
  **Parties:** Proponent of Constitution View (PCV) and Proponent of Strict-Identity View (PSIV)
  **Subject:** Adversarial Collaboration on the Metaphysics of Artifacts

  ## 1. AGREED CLAIMS

  The undersigned parties acknowledge the following points of consensus regarding the logical structure, scope, and constraints of the present debate. These claims establish the common ground upon which our divergence is mapped.

  1.  **Logical Structure of the Constitution Relation:** Both parties agree that the debate turns on the logical properties of the relation between a constituted object (e.g., a statue) and its constituting matter (e.g., a lump of clay). We agree that if two entities share all spatial and temporal coordinates and all physical properties, the principle of the Indiscernibility of Identicals is the primary logical tool for testing whether they are one object or two.
  2.  **Purpose of the Statue-and-Clay Case:** We agree that the classic case is designed to test the sufficiency of spatiotemporal coincidence for ontological identity. It is not merely a linguistic puzzle but a probe into whether distinct persistence conditions can apply to coincident entities.
  3.  **Scope and Limits of the Modal Argument:** Both parties acknowledge that the modal argument (which posits that the clay could survive being squashed while the statue could not) relies on the truth-value of counterfactual statements. We agree that the force of this argument depends entirely on whether modal properties are intrinsic to the object *simpliciter* or are relative to the conceptual sortal under which the object is described.
  4.  **Empirical and Conceptual Constraints:** We agree that empirical facts—such as continuous shape-preservation, material continuity, and institutional labeling—are observable data points but do not, by themselves, settle metaphysical questions of identity. Observation can track continuity, but it cannot dictate whether that continuity constitutes the survival of the *same* object without a prior theoretical commitment to what grounds identity.

  ## 2. DISAGREEMENTS TABLE

  The following table delineates the precise points of divergence. Each formulation is drafted to be acceptable to the respective party as an accurate characterization of their position.

  | Point of Divergence | Position A (PCV) | Position B (PSIV) | The Crux |
  | :--- | :--- | :--- | :--- |
  | **Ontological Status** | The statue and the clay are numerically distinct entities that share the same matter at a given time. Constitution is a non-identity relation. | There is only one ontological entity. Talk of "the statue" versus "the clay" represents sortal-relative descriptions of the same object, not distinct existents. | **Multiplicity vs. Description:** Is the appearance of two objects a reflection of reality (two coinciding entities) or a reflection of our conceptual framework (one entity described two ways)? |
  | **Persistence Conditions** | Artifacts possess persistence conditions distinct from their constituent matter. These conditions can be sustained by institutional recognition and functional continuity even if material composition changes. | Persistence conditions are not intrinsic to the object but are imposed by the sortal concept applied. If the material conditions required by the dominant sortal are violated, the object ceases to exist. | **Grounds of Persistence:** Does identity persist through material replacement via form/function, or is identity bound to the material history such that total replacement constitutes destruction? |
  | **Modal Properties** | Modal properties (e.g., "could survive squashing") belong to the object essentially. Since the statue and clay have different modal properties, they cannot be identical. | Modal properties are not monadic properties of the object but are relational to the sortal. The object *qua* clay survives squashing; the object *qua* statue does not. | **Modal Attribution:** Are modal properties intrinsic to the entity, or are they true only relative to a specific mode of description? |

  ## 3. EXPLICIT CRUXES AND TEST CASES

  We identify two primary cruxes where our theoretical commitments yield divergent predictions. For each crux, we specify a concrete case and record the predicted outcome for each side.

  ### Crux 1: Diachronic Identity Under Total Material Replacement
  **The Question:** Can institutional recognition combined with continuous shape-maintenance ground diachronic identity for an artifact when every constituent particle has been replaced over time, provided the original material is preserved and reshaped elsewhere?

  **The Case:** A museum possesses a sacred clay ritual figure. Over fifty years, conservators use molecular-level replacement to repair degradation, maintaining the figure's exact shape and ceremonial role. Simultaneously, the displaced original clay particles are collected and, at the end of the period, reformed into a separate vessel in another institution.

  **Predictions:**
  *   **PCV Prediction:** The original ritual figure survives in the **museum form**. The continuous maintenance of shape and institutional role sustains the artifact's identity despite total material turnover. The vessel in the other institution contains the original matter but constitutes a new artifact.
  *   **PSIV Prediction:** The original ritual figure survives in **neither** location (or potentially ceases to exist as a statue). Because every particle was replaced, the original material entity was destroyed. The museum object is a replica sustained by causal continuity, while the vessel is the original matter under a new description. Strict identity cannot survive total material loss; thus, the original artifact is destroyed.

  ### Crux 2: Modal Properties and Sortal Relativity
  **The Question:** Do modal properties such as "could survive being squashed" belong to the object *simpliciter*, or only to the object-under-a-sortal?

  **The Case:** Two artifacts are displayed side-by-side: one cast in bronze, one modeled in clay. They exhibit identical shape and size. A heavy press is positioned above them. We consider the counterfactual: "If the press were dropped, would the object survive?"

  **Predictions:**
  *   **PCV Prediction:** The objects **diverge** in modal properties. The bronze object could survive the press (perhaps dented); the clay object could not. This divergence proves they are governed by different persistence conditions intrinsic to their kind, reinforcing that the artifact is not identical to the mere sum of its current material properties.
  *   **PSIV Prediction:** The objects **share** all physical modal properties *simpliciter*, but our descriptions vary. It is incorrect to say the object "could survive" without specifying the sortal. Under the sortal "mass of matter," both survive (as scattered parts). Under the sortal "statue," neither survives (as the form is destroyed). The difference lies in the truth conditions of the description, not in the metaphysical profile of the entity itself.

  ## 4. ANALYSIS OF VERBAL VS. SUBSTANTIVE DISAGREEMENT

  We address whether the dispute is merely verbal (a disagreement over language use) or substantive (a disagreement over the structure of reality).

  **The Verbal Component:**
  A portion of the disagreement is verbal regarding the use of the term "object."
  *   **PCV** uses "object" to denote an entity with specific persistence conditions. Since the statue and clay have different persistence conditions, they are two "objects."
  *   **PSIV** uses "object" to denote a spatiotemporal region of matter. Since the statue and clay occupy the same region, they are one "object."
  *   **Resolution:** If the debate were solely about whether to use the word "object" for coincident entities, it would be verbal. We acknowledge that if PSIV adopts the PCV's definition of "object" (as a bearer of sortal-specific persistence conditions), PSIV would have to admit there are two "objects" in the sense of two distinct truth-makers for persistence claims.

  **The Substantive Residual:**
  However, a substantive disagreement remains regarding **truth-makers for persistence claims**.
  *   Even if we standardize terminology, we disagree on what makes a statement like "The statue survived the replacement of its parts" true.
  *   **PCV** holds that the truth-maker is the continuity of form and institutional function.
  *   **PSIV** holds that the truth-maker is the continuity of matter (or that the statement is false if matter is not continuous).
  *   **Conclusion:** The residual disagreement is substantive. It concerns whether the world contains entities whose identity conditions are determined by social/formal continuity independent of material continuity. This is not a matter of linguistic convention but of ontological commitment. The PCV asserts the existence of entities that can survive material turnover; the PSIV denies this, asserting that such talk is merely a useful *façon de parler* regarding a single material entity.

  **Signed:**

