answer: |-
  ### The Ethical Driver Diagnostic (EDD)

  This procedure is designed for a thirty-minute review. It does not determine whether a proposal is *good*; it determines whether the change is driven by moral reasoning, material interest, or honour dynamics. Follow the steps sequentially. If a stopping condition is met, record the classification and cease analysis.

  **Step 1: The Material Interest Test**
  *   **Question:** Is there a identifiable group that gains a direct commercial or operational advantage if this proposal is adopted?
  *   **Condition:** If **Yes**, identify the group. If **No**, proceed to Step 2.
  *   **Judgement Flag:** Determining "direct advantage" requires human estimation of market dynamics. The panel must agree on whether the advantage is primary or incidental.
  *   **Stopping Condition:** If the primary beneficiaries are commercial actors *and* the proponents refuse to accept costs that outweigh these benefits, classify as **Interest-Driven**. Stop. Return 'not a moral revolution'.

  **Step 2: The Rational Consistency Test**
  *   **Question:** Is the justification based on factual premises and logical deduction that would hold even if no one were watching?
  *   **Condition:** If **Yes**, proceed to Step 3. If **No** (justification relies on "this is how things are done" or "this looks bad"), proceed to Step 3 but flag as weak.
  *   **Judgement Flag:** Distinguishing between a moral argument and a rationalisation of interest requires human interpretation of the proponents' stated reasons.
  *   **Stopping Condition:** If the reasoning collapses without an audience (i.e., it only works as public relations), classify as **Honour-Driven**. Stop. Return 'not a moral revolution'.

  **Step 3: The Honour and Shame Test**
  *   **Question:** Is compliance tied to reputation, status, or membership within a specific peer group?
  *   **Condition:** If **Yes**, note the specific status marker (e.g., "ethical engineer", "green company"). If **No**, proceed to Step 4.
  *   **Judgement Flag:** Assessing whether a badge or mandate is a status signal versus a functional requirement is a sociological judgement, not a logical one.
  *   **Stopping Condition:** If status enhancement is the primary motivator for adoption, classify as **Honour-Driven**. Stop. Return 'not a moral revolution'.

  **Step 4: The Sacrifice Verification**
  *   **Question:** Are the proponents willing to incur tangible costs (revenue, efficiency, convenience) with no guarantee of reputational reward?
  *   **Condition:** If **Yes**, classify as **Moral Revolution**. If **No**, classify as **Interest-Driven** or **Honour-Driven** based on previous steps.
  *   **Judgement Flag:** Defining "tangible cost" requires consensus on what counts as a sacrifice versus an investment.
  *   **Final Output:** Return classification.

  ***

  ### Application to Proposals

  #### 1. Ban Predictive Policing APIs
  *   **Step 1 (Interest):** Vendors lose revenue; police departments lose tools. No clear commercial winner. **Pass.**
  *   **Step 2 (Rational):** Justification relies on data regarding bias and due process violations. These are factual claims independent of public opinion. **Pass.**
  *   **Step 3 (Honour):** While there is reputational risk for vendors, the primary push comes from civil liberty concerns, not peer status. **Pass.**
  *   **Step 4 (Sacrifice):** Police departments must adopt slower, manual methods. Vendors lose a product line. **Pass.**
  *   **Resolution:** The procedure classifies this as a **Moral Revolution**. The drivers are argument and sacrifice.
  *   **Human Decision Point:** At Step 2, the panel must judge whether the bias data is sufficient to constitute a logical necessity rather than a political preference. The framework cannot verify the statistics; it relies on the panel's acceptance of the premise.

  #### 2. Mandate Open-Source Disclosure in Government Contracts
  *   **Step 1 (Interest):** Large technology firms with existing open-source portfolios gain competitive advantage over smaller proprietary vendors. Security auditing firms gain revenue streams. **Yes.**
  *   **Stopping Condition:** The panel must now decide if this interest is primary. If the panel accepts that the mandate creates a market barrier favouring incumbents, the procedure stops here.
  *   **Resolution:** The procedure classifies this as **Interest-Driven**. It returns 'not a moral revolution'.
  *   **Unwelcome Answer:** This finding is likely to be unwelcome. Engineers often view open source as an ethical imperative. The framework suggests the mandate may be a commercial weapon disguised as security policy.
  *   **Human Decision Point:** At Step 1, the panel must judge intent. Are the security benefits genuine, or is security a pretext for market consolidation? The checklist forces a binary choice on a spectrum of motive.

  #### 3. Attach Carbon-Footprint Badges to Cloud Invoices
  *   **Step 1 (Interest):** Cloud providers incur costs to measure emissions. No direct commercial gain unless it attracts customers. **No/Low.**
  *   **Step 2 (Rational):** A badge displays data; it does not logically necessitate reduction. A company can display a high carbon footprint without changing behaviour. The argument relies on the assumption that transparency *leads* to reduction, which is empirical, not logical. **Weak.**
  *   **Step 3 (Honour):** The badge functions as a signal to clients and peers. It allows companies to claim "green" status. Compliance is tied to corporate reputation and ESG ratings. **Yes.**
  *   **Stopping Condition:** Since the justification relies on the reputational effect of the badge rather than the logical necessity of the badge itself, the procedure stops at Step 3.
  *   **Resolution:** The procedure classifies this as **Honour-Driven**. It returns 'not a moral revolution'.
  *   **Human Decision Point:** At Step 3, the panel must decide if the badge is a functional tool or a status symbol. This is a sociological judgement. The framework cannot measure "virtue signalling" mechanically; it relies on the panel's interpretation of corporate culture.

  ***

  ### Operational Notes for the Panel

  1.  **Judgement Calls:** Steps 1 and 3 are not algorithmic. They require the panel to agree on the *primary* motivation of actors who may have mixed motives. The procedure forces you to pick one dominant driver.
  2.  **Unwelcome Outputs:** If the procedure returns 'Interest-Driven' for a proposal your team supports, do not override the result. This indicates your ethical alignment may be conflated with commercial benefit.
  3.  **Honour Dynamics:** A classification of 'Honour-Driven' does not mean the outcome is bad. It means the mechanism of change is social pressure and status, not rational moral argument. In the context of this diagnostic, this counts as 'not a moral revolution' because it is vulnerable to shifting status norms rather than fixed ethical principles.

  Verdict: Carbon-Footprint Badges
