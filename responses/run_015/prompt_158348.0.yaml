answer: |-
  This project determines whether a quantitative "dependence budget" can diagnose the fragility of self-locating heuristics by calibrating against Maier's theorem on prime distributions, a tractable task because the mathematical ground truth allows for retrospective validation unavailable in cosmology.

  **The Question and the Gap**
  The core question is not whether independence holds—it almost never does—but whether the degree of dependence required to neutralize a heuristic argument is physically or mathematically plausible. Standard treatments of the Doomsday Argument, Fine-Tuning, and Boltzmann Brains treat independence as a binary precondition: either the sampling is "typical" and independent, or the argument collapses. This binary view obscures the quantitative reality of likelihood ratios. When an argument relies on multiplying credences over $n$ steps or observers, the likelihood ratio scales exponentially with $n$. Consequently, the argument should be exquisitely sensitive to small correlations. A correlation coefficient of 0.01 might be negligible for $n=10$, but catastrophic for $n=10^6$.

  The literature leaves this open because defenders focus on the coherence of the reference class, while critics focus on the priors. Both sides assume that if the reference class is granted, the likelihood multiplication follows automatically. They fail to distinguish between (i) the independence of the sampling mechanism from the hypothesis, (ii) the conditional independence of evidence pieces within a hypothesis, and (iii) the robustness of the conclusion to perturbations in (ii). By conflating these, existing models cannot quantify how much "dependence debt" an argument accumulates before defaulting. This project isolates (ii) to construct a budget for (iii).

  **Methodology**
  The work proceeds in three monthly phases, prioritizing structural analysis over new mathematical proofs.

  *Month 1: Formalizing the Budget.* I will define the dependence budget as the maximum allowable deviation from the product rule $\prod P(e_i|H)$ before the posterior probability shifts by less than one order of magnitude. This involves deriving a bound on the covariance terms required to maintain the likelihood ratio's force. The output is a metric, $\Delta$, representing the tolerance for correlation per evidence step.

  *Month 2: Calibration on Number Theory.* I will apply $\Delta$ to the Cramér probabilistic model of the primes. Cramér treats primes as independent coin flips with probability $1/\ln n$, successfully predicting average gap sizes but failing on short intervals per Maier's theorem. I will not prove Maier's theorem but will use its result as ground truth. The test is retrospective: does the dependence budget flag the Cramér model as unstable in short intervals *before* invoking Maier? If the budget is exceeded where Maier shows failure, the tool is validated. If the budget suggests stability where Maier shows collapse, the tool is discarded.

  *Month 3: Application to Cosmology.* I will apply the calibrated $\Delta$ to the Doomsday Argument and Boltzmann Brain scenarios. The goal is to compare the "dependence cost" of these arguments against the validated threshold from the prime case. If the cosmological arguments consume more independence budget than the Cramér model did before failing, they are heuristically unsound regardless of their intuitive appeal.

  *Why This Beats Standard Bayesian Modeling.* A standard Bayesian model fixes the graph structure and solves for the posterior. This accepts the independence assumption as axiomatic. My method treats the graph structure itself as the variable. It is a sensitivity analysis of the epistemology, not just the probabilities. It answers not "what should I believe given this model?" but "how brittle is this model before it stops commanding belief?"

  **Possible Findings and Deciders**
  There are three likely outcomes. First, the dependence budget may be extremely tight, showing that even minute correlations (plausible in any physical cosmology) wipe out the Doomsday effect. This would vindicate critics who claim the argument is too fragile to be useful. Second, the budget may be loose for the prime case but tight for cosmology, suggesting that number-theoretic heuristics are more robust than self-locating ones due to the nature of the sampling space. Third, the budget might fail to flag the Cramér failure, indicating that independence violations are not the primary source of heuristic error; this would shift the focus back to reference class selection.

  The deciding consideration is the Cramér calibration. If the metric cannot distinguish between the successful average-gap predictions and the failed short-interval predictions of the Cramér model, it lacks diagnostic power. Success requires the budget to correlate with known zones of heuristic failure in the mathematical case.

  **Risks and Scope**
  The primary risk is mathematical bogging. Maier's theorem involves complex analytic number theory; attempting to derive the dependence structure from first principles would blow past the semester. I will avoid this by treating Maier's result as a data point rather than a derivation target, focusing on the epistemic implication of the discrepancy rather than the proof itself. Conversely, the project could blow past a semester if the dependence budget reveals a unified normative rule for all probabilistic heuristics. If $\Delta$ generalizes beyond self-locating evidence to causal inference or scientific modeling, the scope expands from a term paper to a dissertation chapter. I will constrain this by strictly limiting the application phase to the three specified cosmological arguments, treating any broader generalization as future work noted in the conclusion.
