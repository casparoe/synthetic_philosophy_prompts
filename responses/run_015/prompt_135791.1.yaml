answer: |-
  **Map of Exposure: Ranked Defeaters**

  1.  **Fatal:** Introspective judgments demonstrably track a property that has no functional or physical realization. If you can isolate a neural signature that correlates perfectly with phenomenal reports but plays no role in discrimination, memory, or action, illusionism collapses. It requires introspection to be a functional process monitoring functional states.
  2.  **Serious:** Silencing the introspective mechanism impairs first-order discrimination. Illusionism posits a two-layer architecture (first-order state + introspective monitor). If removing the monitor degrades the signal, the layers are likely identical, pushing you toward realism or eliminativism.
  3.  **Awkward:** The "illusion" requires a qualitative vehicle to carry the misrepresentation. If explaining the *seeming* requires a *seemer* with phenomenal properties, you have relocated the hard problem.
  4.  **Merely Verbal:** Disputes over whether the introspective state itself counts as "conscious." Illusionists concede the state exists; they deny it has the *properties* it claims to have. If critics insist the existence of the state *is* the phenomenon, the dispute is terminological.

  **The Two Worries**

  The **Relocation Worry** is the live risk. The **Collapse Worry** is largely a parlour trick, provided you maintain a strict functionalist ontology of the base states.
  *   *Collapse:* You avoid realism by insisting the introspective state represents the target *as* having intrinsic qualia, when it actually has only relational/functional properties. You avoid eliminativism by insisting the introspective state itself is a real physical configuration. The dispute is verbal only if critics refuse to accept "real state + false content" as a coherent category.
  *   *Relocation:* This is substantive. If explaining why the introspective mechanism generates a *felt* illusion requires appealing to a primitive "what-it's-like" in the mechanism itself, you have not dissolved the hard problem; you have buried it in the monitor. Illusionism survives only if the "seeming" is fully explicable as a functional judgment (a disposition to report) without any residual glow.

  **The Probe: Re-targeting and Silencing**

  Illusionism makes specific architectural commitments here.

  *   **Silencing:** Illusionism *needs* silencing to abolish reports of "what-it's-like" while leaving discrimination and action intact.
      *   *Falsifier:* If silencing the introspective system abolishes the ability to discriminate the stimulus (e.g., you can't press the button for red vs. green), then the phenomenal judgment is not a separate monitoring layer but constitutive of the processing. This supports identity theory or realism.
      *   *Embarrassment:* If silencing leaves reports intact (via some backup system), the proposed mechanism is epiphenomenal or incorrect.
  *   **Re-targeting:** Illusionism *needs* re-targeting to generate phenomenal reports when pointed at non-phenomenal states (e.g., an AI's internal register or your own unconscious state).
      *   *Falsifier:* If the introspective system *refuses* to generate a "what-it's-like" report unless the target state is genuinely phenomenal (i.e., it has a truth-condition that fails on non-experiences), then realism is true: the system detects a property, it doesn't fabricate one.
      *   *Embarrassment:* If the system generates reports for *any* state, even random noise, the illusion is too cheap. It suggests "phenomenality" is just a label for "attended data," which risks the verbal collapse.
  *   **Dependency:** Illusionism predicts the richness of the illusion depends on the *richness of the introspective model*, not the target. If the illusion's detail tracks the target's physical complexity rather than the monitor's bandwidth, that favors realism.

  **Existing Data**

  *   **Blindsight/Inattentional Blindness:** These should move you toward illusionism. They demonstrate the dissociation between functional access (discrimination) and introspective report. Realists must posit "unconscious consciousness" or degraded qualia; illusionists see this as the monitor being offline while the first-order system runs.
  *   **Confabulation/Choice Blindness:** Strong support. They show introspection constructs narratives post-hoc, fitting the "misrepresentation" model.
  *   **Sensory Substitution:** Supports the plasticity of phenomenal concepts. If vision can be "heard" via a tongue grid, the "visual qualia" are not intrinsic to the visual cortex but to the interpretive schema.

  **Unique Predictions and the Steelman**

  **Unique Prediction:** Illusionism predicts that **phenomenal inversion is functionally detectable.** If qualia are real intrinsic properties, swapping them (red experience for green) while keeping functional roles constant is metaphysically possible. If qualia are misrepresentations of functional roles, swapping the "feel" requires swapping the functional role. Therefore, a true inversion without functional change is impossible.
  **Unknown Facts:** Illusionism predicts there are no "hidden facts" about experience. If two systems are functionally isomorphic, there is no further fact about "what it's like."

  **The Steelman (The Crux):**
  The strongest case against you does not appeal to "how it seems." It appeals to **Introspective Infallibility regarding Presence.**
  *   *Argument:* You can be wrong about the *nature* of your experience (illusionism grants this). But can you be wrong about the *presence* of experience? When you are in pain, you cannot doubt *that* you are in pain.
  *   *Crux:* If there is a class of judgments (presence judgments) that are immune to error in a way that functional monitoring systems never are, then introspection is not a standard cognitive mechanism. Standard mechanisms fail. If the "presence of experience" is a datum that survives the disabling of all functional checks, it tracks something non-functional.
  *   *Challenge:* Demonstrate a case where a subject is functionally accessing a state (discriminating, reacting) but genuinely, incorrigibly judges "there is nothing it is like to be me," *while* an external observer confirms the mechanism is intact. If the "sense of presence" is inextricably bound to the first-order state and cannot be silenced without silencing the state itself, illusionism's two-layer model fails.

  **Insulation and Substance**

  Is illusionism too insulated? Yes, if it treats every counter-evidence as "part of the illusion." If silencing fails, you say "you didn't silence the right part." If re-targeting fails, you say "the monitor is selective."
  **Defect:** This is a defect if it renders the view unfalsifiable. A theory that absorbs all data explains none.
  **Substance:** It remains substantive only if it commits to specific, testable claims about the introspective mechanism (e.g., it is a feedback loop in the prefrontal cortex; it has a specific latency; it is prone to specific types of error like change blindness).
  **Verdict:** The version that survives every defeater by redefining "introspection" or "state" is not a substantive view; it is a linguistic shield. To hold it honestly, you must accept the **Silencing Falsifier**: if disabling the proposed introspective mechanism does not remove the phenomenal report while sparing function, you must abandon the view. If you will not concede that, you are not doing science or philosophy; you are dogmatics.
