prompt: |-
  I'm in year 12 and taking this philosphy of mind course, and my teacher Ms. Chen has been giving verdicts on whether random things have 'genuine mental content' or are just mechanical responses. So far she said a frog snapping at black dots misrepresents fly here even though it's pure reflex; a Venus flytrap closing on an insect has no content, just chemistry; a thermostat regulating heat has only derived content, not original; a human dreaming about a dragon genuinely represents something that doesn't exist; a broken calculator giving wrong answers isn't misrepresenting, it just malfunctioned; and a current language model predicting false history isn't representing the world, it's just statistical pattern matching. Now she's asking about this synthetic bacterium I read about—engineered in a lab with no evolutionary history, it glows green specifically when it detects arsenic, but because of how the proteins fold it also glows for phosphate, and the scientists use it as a biosensor. She wants to know: does it genuinely misrepresent phosphate as arsenic, or is it just like the thermostat?

  I'm not really after her actual answer—I'm trying to figure out the hidden rule she's running, whether it's about evolutionary selection history, about having a consumer system that uses the signal, about robust causal covariance, or something about design intentions. Can you predict what she'll say, lay out the competing rules that fit all her earlier verdicts, say what each predicts for the bacterium, give me your best guess with reasons, and tell me which further case would best tell those rules apart? Please write in British English. Sections: 'The track record so far' (about one paragraph), 'The competing rules' (a couple of paragraphs, this is the main bit), 'Prediction for the biosensor' (around a paragraph), and 'The tie-breaker case' (just a short paragraph). Sorry if there's typos, I'm on my phone and keep hitting the wrong keys.
