      *   *Strict commitments vs. comfortable fits?* Yes (Perpetuity vs. Hoarding).
      *   *Rival accounts ruled out?* Yes (Hedonism, Market).
      *   *Consistency of three parts?* Yes (mostly, with donor tension).
      *   *Underdetermined areas?* Yes (Storage ratios, specific deaccessioning limits).
      *   *What if experience-based?* Yes (Radical rotation, indifference to authenticity, liquidation for access).

