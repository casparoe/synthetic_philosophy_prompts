          *   Why *no* selling for operations? The theory says "protect capital," but a strict utilitarian could argue saving the education program saves the *mission*. The taboo is stronger than the logic requires (Slippery Slope argument).
      *   **Library vs. Museum:** The uniqueness factor. Books are multiples; art/artifacts are singular.
      *   **The "Experience-Based" Counterfactual:**
          *   If they truly valued experience: They would sell low-engagement storage to fund high-engagement programs. They wouldn't care about forgeries if they looked real. They would rotate collections aggressively. They would prioritize digital access over physical preservation.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on Forgery:* The prompt mentions the "mind admiring something worth admiring." I need to integrate that. It's a Nozickian point. The value is in the *relationship* to reality.
      *   *Correction on Donors:* The prompt asks if cultivating affection then monetizing it contradicts the object-centric view. It doesn't, *unless* the affection is for the *object* and the monetization harms the *object*. But usually, it's affection for the *institution*. I need to make that distinction clear.
      *   *The "Rule of Thumb" question:* Is the deaccessioning ban consequentialist (slippery slope) or deontological (intrinsic duty)? It's presented as deontological (ethics code) but defended consequentially (if we allow one sale, the trust collapses). I should highlight this duality.

