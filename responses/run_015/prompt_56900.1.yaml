answer: |-
  This is a sharp dissection of the modern museum's philosophical schizophrenia. You have identified a triad of practices that seem to pull in different directions: **Preservationism** (store it forever), **Experientialism** (justify via visitor metrics), and **Authenticity/Provenance** (value depends on history/truth, not just appearance).

  Here is a reconstruction of the implicit theory, an analysis of its consistency, and a look at what a truly experience-based museum would actually look like.

  ### 1. The Implicit Theory: Fiduciary Stewardship of Historical Truth

  The operating theory of the major museum is not aesthetic, nor is it purely utilitarian. It is **fiduciary**. The museum posits itself not as a provider of services, but as a **trustee of a specific class of objects** on behalf of humanity (present and future).

  This theory rests on three pillars:
  1.  **The Object as Witness:** An artifact is not valuable primarily because it pleases the eye (aesthetics), but because it bears witness to a specific moment, hand, or history (ontology).
  2.  **Perpetuity:** The museum's duty is to the object's survival across time, not to the current generation's enjoyment. The current public are merely temporary beneficiaries of a trust they do not own.
  3.  **Inalienability:** The collection is capital that cannot be liquidated. It is the "principal" of the trust; operating budgets must come from "interest" (endowments, tickets, donations).

  **What this presupposes about value:**
  Value is **intrinsic to the object's history**, not extrinsic to the viewer's experience. A Van Meegeren forgery is valueless not because it is ugly (it isn't), but because it is a *lie*. It bears false witness. Conversely, a sketch by a master is valuable even in storage because its potential to bear witness remains intact, even if no one is currently looking.

  ### 2. Strict Commitments vs. Comfortable Fits

  We need to separate what the theory *requires* from what it merely *permits* or has accreted over time.

  **Strict Commitments (The Theory demands these):**
  *   **The Deaccessioning Taboo:** If the museum is a trust, selling the assets to pay the electric bill is embezzlement. It violates the intergenerational contract. This is deontological, not consequentialist.
  *   **The Forgery Reaction:** If value lies in "historical witness," a forgery is functionally dead. It must be removed because it corrupts the narrative truth the museum is sworn to uphold.
  *   **Preservation:** You must keep the humidity right even if no one sees it, because the "beneficiary" might be a scholar in 2080, not a tourist today.

  **Comfortable Fits (The theory allows, but doesn't require):**
  *   **Hoarding:** The theory says "keep," but it does not strictly mandate keeping *everything*. The 90% in storage is often a result of risk-aversion and lack of curatorial bandwidth, not a strict requirement of stewardship.
  *   **Elitism:** The "trust" model can easily slide into "we know what is worth keeping, you don't." This is a cultural habit, not a philosophical necessity.
  *   **Donor Naming Rights:** This fits comfortably *only if* the donor is viewed as a patron of the trust. It becomes inconsistent if the donor gains influence over *what* is kept (corrupting the witness).

  ### 3. Rival Accounts Ruled Out

  The museum's habits quietly but aggressively rule out three major philosophical accounts of value:

  1.  **Hedonistic Utilitarianism:** If the goal were to maximize aggregate pleasure/wellbeing (the "experience" metric), museums *should* sell low-engagement storage items to fund free entry, better lighting, and community programs. The taboo on selling rules this out.
  2.  **Formalist Aestheticism:** If value were purely in the visual form (Bell's "Significant Form"), a perfect forgery would be equal to the original. The fury over provenance rules this out.
  3.  **Market Capitalism:** If the art were merely an asset class, liquidating during a crisis would be prudent asset management. The ethical codes rule this out.

  ### 4. Consistency Check: The Donor Affection Paradox

  You asked if cultivating affection to monetize it (Friends societies, naming rights) contradicts the object-centric view.

  **It is consistent, but fragile.**
  The museum is selling affection for the *Institution* (the Temple), not the *Object*. As long as the money goes toward stewarding the objects, the loop is closed: Donors love the mission -> Donors fund the mission -> Mission preserves objects.

  **The Inconsistency:** It breaks if the donor's affection becomes conditional on *access* or *influence*. If a donor names a gallery and then demands a specific (inferior) artist be shown, the "Witness" principle is compromised for the "Funding" principle. The current practice walks this line by treating donor recognition as a separate layer from curatorial integrity.

  ### 5. The Library vs. Museum Distinction

  Why can libraries weed but museums can't?
  *   **Libraries hold multiples.** Discarding one copy of *Moby Dick* does not lose the work. The "witness" is the text, which remains.
  *   **Museums hold singulars.** Discarding a painting loses the specific physical witness forever.
  *   **Exception:** Museums *do* weed duplicates (e.g., numismatic collections with 5,000 identical Roman coins). This proves the rule: they weed copies, they keep witnesses.

  ### 6. Underdetermination: Where the Theory is Vague

  The theory is underdetermined in two key areas, allowing for the contradictions you sense:

  1.  **The "Public Benefit" Clause:** Most museum charters say they exist for the "public benefit." This is the wedge for the "Experience" justification. How much public benefit is required to justify the cost of storage? The theory doesn't say. This allows museums to claim they are serving the public (via education) while keeping the art locked up (for preservation).
  2.  **The Slippery Slope Defense:** The ban on selling for operations is often defended consequentially ("If we allow one sale, the market will lose trust in all museums"). This is a rule-of-thumb justification, not a first-principle one. It admits that, in a vacuum, selling a middling drawing to save a school program *might* be good, but we forbid it to prevent a catastrophe. This is the weak point where the "Stewardship" and "Experience" models clash.

  ### 7. The Counterfactual: A Truly Experience-Based Museum

  If a museum took the "Experience/Wellbeing" justification seriously—as their PR often claims they do—it would look radically different. It would adopt a **Utilitarian-Curatorial Model**:

  1.  **Indifference to Authenticity:** If the goal is the viewer's psychological state, a perfect forgery is as valuable as the original. They would display high-quality replicas if it meant less insurance risk and better lighting. (Some museums already do this with fragile manuscripts).
  2.  **Aggressive Deaccessioning:** They would regularly auction off works that do not generate engagement or educational value to fund free entry, immersive tech, or community outreach. The collection would be a revolving portfolio, not a permanent trust.
  3.  **No "Storage" for Decades:** Objects would be digitized and stored cheaply; physical space would be dedicated entirely to rotation. If you haven't shown it in 10 years, you must justify why it's not being sold to fund something that *will* be shown.
  4.  **Provenance as Context, Not Value:** A famous previous owner would only matter if it made for a good story (experience), not if it increased the financial or ontological value of the piece.

  ### Summary

  The museum is currently trying to run a **Temple** (sacred, permanent, truth-bearing) while writing **Business Plans** (metrics, engagement, ROI).

  *   The **Storage/Deaccessioning** rules belong to the Temple.
  *   The **Justification to Funders** belongs to the Business.
  *   The **Forgery/Provenance** sensitivity belongs to the Temple.

  The tension you feel is the friction between these two models. The "mind admiring something worth admiring" argument you recalled (likely Nozickian or rooted in Kantian disinterestedness) saves the Temple model: it explains why the forgery fails (it's not *worth* admiring because it's a lie) and why storage is okay (it remains *worth* admiring even if unseen).

  But that argument **cannot** justify the donor cultivation or the visitor metrics. To make those fit, the museum has to pretend the Temple is also a Theme Park. It works financially, but philosophically, it's a category error. The museum survives not because its theory is consistent, but because the public accepts the fiction that the Theme Park funds the Temple, while the Temple legitimizes the Theme Park.
