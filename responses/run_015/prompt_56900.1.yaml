prompt: |-
  So there's this thing about big museums I keep turning over and I can't quite get it to hang together.

  They sink a huge share of their money into objects almost nobody sees. Most of what a major museum owns never gets hung — it sits in climate-controlled storage, sometimes for decades, and the place still pays to keep the humidity right, catalogue it, conserve it, insure it. And selling is basically taboo: the long-standing professional norm was that money raised by selling a work could only be spent acquiring other works, so a museum facing layoffs still can't flog a middling drawing to keep its free schools programme going. Some of the bodies have loosened the wording in recent years, but when a few American museums floated something like that during the pandemic the backlash was instant and at least one planned sale got called off.

  Then the same institutions justify themselves to funders entirely in terms of experience: visitor numbers, participation, community engagement, wellbeing surveys.

  And two other habits sit awkwardly with that second paragraph. When a picture turns out to be a forgery — the van Meegeren Vermeers are the classic case — it doesn't just lose some lustre, it comes off the wall, even though not one brushstroke changed and people had been sincerely moved by it for years. Provenance runs the other way: a work jumps in value if it once belonged to someone famous, again with zero change to how it looks. Same museums, incidentally, run Friends societies and name galleries after donors, i.e. they deliberately cultivate personal affection and then convert it into money.

  What picture of value does all this presuppose? Is the store-it-and-never-sell rule committed to the objects mattering whether or not anyone is looking at them, or is it just rule-of-thumb consequentialism about perverse incentives — once directors are allowed to sell, everything gets sold? (Why can a public library weed its stacks without scandal, but a museum can't?) Does the forgery reaction show the place isn't valuing experiences at all, or can an experience-based account absorb it — I have a vague memory of an argument from around that period that the good lies neither in the beautiful thing nor in the pleasure but in the whole complex of a mind admiring something worth admiring, and that sounds like exactly what's wanted here, except that on that view selling to fund access looks totally fine.

  So: reconstruct the implicit theory as best you can, separate what the practice strictly commits you to from what merely fits it comfortably, tell me which rival accounts of beauty and of value the habits quietly rule out, whether the three parts of it presuppose consistent things (including the donor-affection bit), where it's just underdetermined so that several theories would license it, and what a museum would actually have to do differently if it took an experience-based view seriously.
reasoning: |-
  Here's a thinking process that leads to the suggested analysis:

  1.  **Deconstruct the Prompt:**

      *   **Core Problem:** The user is struggling to reconcile the seemingly contradictory practices of major museums.
      *   **Key Observations/Tensions:**
          1.  *Storage vs. Access:* Huge money spent on unseen objects in storage (preservation) vs. justification based on visitor numbers/experience (access).
          2.  *Deaccessioning Taboo:* Selling art to fund operations is forbidden (mostly), even if it saves programs. Money from sales must buy more art.
          3.  *Forgery/Provenance:* Value collapses if a work is a forgery (even if the experience is identical). Value increases with famous provenance (even if the look is identical).
          4.  *Donor Cultivation:* Museums cultivate personal affection (Friends societies, naming rights) to get money, which seems to contradict the "object-centric" taboo on selling.
      *   **Questions to Answer:**
          1.  What is the implicit theory of value presupposed?
          2.  Is the "store-and-never-sell" rule about intrinsic object value or rule-of-thumb consequentialism (slippery slope)?
          3.  Why can libraries weed but museums can't?
          4.  Does the forgery reaction negate experience-based value, or can it be absorbed (mind admiring something *worth* admiring)?
          5.  Reconstruct the implicit theory (strict commitments vs. comfortable fits).
          6.  What rival accounts of beauty/value are ruled out?
          7.  Are the three parts (storage, deaccessioning, forgery/donors) consistent?
          8.  Where is it underdetermined?
          9.  What would a museum look like if it *actually* took an experience-based view seriously?

  2.  **Initial Brainstorming & Theoretical Mapping:**

      *   *The "Implicit Theory":* It's not purely aesthetic (experience), nor purely archival (preservation). It's a **Stewardship Model** rooted in **Cultural Heritage Trust**. The object is a witness to history/truth, not just a source of pleasure.
      *   *Deaccessioning:* This is the "Endowment Model." The collection is capital; you live off the interest (public trust), not the principal. Selling for operations is eating the seed corn.
      *   *Forgery:* This kills the "historical witness" value. If it's a fake, it lies about history. The experience is "tainted" by the lie. This aligns with the "mind admiring something *worth* admiring" idea (Nozick's Experience Machine vs. Reality).
      *   *Donors:* This is the tricky part. Naming rights commodify the *institution*, not the *object*. It's consistent if the institution is the vessel of trust.
      *   *Library vs. Museum:* Libraries deal with *copies* (editions). Museums deal with *unique* artifacts. Weeding a duplicate book is fine; selling a unique painting is losing that specific historical node forever.
      *   *Experience-Based View:* If it were purely experience, forgeries wouldn't matter (if they look the same), and selling a lesser work to fund better access would be rational utilitarianism. The fact that museums *don't* do this proves they aren't pure utilitarians about experience.

  3.  **Drafting the Analysis - Section by Section:**

      *   **Introduction:** Acknowledge the tension. It's a clash between "Museum as Temple" (object-centric) and "Museum as Forum" (audience-centric).
      *   **Reconstructing the Implicit Theory:**
          *   Name it: **The Fiduciary Stewardship of Historical Truth.**
          *   Core tenet: The museum holds objects in trust for future generations and for the sake of truth, not just current pleasure.
          *   The Object is a *Witness*, not just an *Aesthetic Trigger*.
      *   **Analyzing the Three Habits:**
          1.  *Storage/Deaccessioning:* This is the "Perpetuity Clause." It rules out Utilitarianism (maximize current happiness). It commits to the object having value independent of current observation (Intrinsic/Historical Value).
          2.  *Forgery/Provenance:* This confirms the "Truth/Witness" theory. A forgery is a lie. Provenance adds historical weight. It rules out pure Aestheticism (if it looks good, it is good).
          3.  *Donor Cultivation:* This is the funding mechanism for the Stewardship. It's consistent *if* the money supports the trust, not the personal aggrandizement of the director.
      *   **Strict Commitments vs. Comfortable Fits:**
          *   *Strict:* You cannot trade the collection for operating costs (protects the trust). You cannot display lies (forgery).
          *   *Comfortable Fit:* Elitism, hoarding, bureaucracy. These aren't required by the theory but happen alongside it.
      *   **Rival Accounts Ruled Out:**
          *   *Hedonistic Utilitarianism:* (Maximize visitor pleasure). Ruled out by the forgery reaction and the ban on selling for programs.
          *   *Pure Aestheticism:* (Beauty is in the eye of the beholder). Ruled out by provenance/forgery sensitivity.
          *   *Market Capitalism:* (Art is an asset to be liquidated). Ruled out by deaccessioning norms.
      *   **Consistency Check:**
          *   Is the donor bit consistent? Yes, if viewed as "patronage of the trust" rather than "buying influence." But it creates tension if donors dictate acquisition (conflict of interest).
          *   Is storage consistent with experience? Only if "potential future experience" counts.
      *   **Underdetermination:**
