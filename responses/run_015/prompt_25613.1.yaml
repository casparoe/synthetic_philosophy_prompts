      *   **The Trilemma/Tension Analysis:** Highlight where theories break.
      *   **Mapping the Landscape:** Briefly show where Pessimism, Optimism, and Hybrids stumble.
      *   **Conclusion:** Suggest a path forward (e.g., distinguishing types of aesthetic judgment).

  6.  **Drafting the Content (Iterative refinement for PhD level):**
      *   *Terminology:* Use terms like "response-dependence," "epistemic entitlement," "aesthetic understanding," "normative defeaters."
      *   *References:* Implicitly or explicitly nod to Hopkins (Use of Testimony), Kivy (Critics), Goldman (Knowledge), Hills (Understanding), Nguyen (Games/Aesthetics).
      *   *Refining "Practice":* It's not just that we read reviews; it's that we often *defer* to experts in curation. The theory must explain legitimate deference without granting full epistemic ownership.
      *   *Refining "Asymmetry":* It's not just that it's different; it's that the *reasons* for the asymmetry must be identified (e.g., the nature of the property vs. the nature of the subject).
      *   *New Desideratum:* **The Appreciation Constraint.** Knowledge without appreciation is aesthetically inert.
      *   *New Desideratum:* **The Reason-Giving Constraint.** Can the testifier provide reasons that transfer justification? (Hopkins' point).

  7.  **Checking for Joint Unsatisfiability:**
