  **MEMORANDUM**

  **TO:** All Faculty, Staff, and Graduate Students
  **FROM:** Dr. Arthur Vane, Department Chair
  **DATE:** October 26, 2023
  **RE:** Institutional Adoption of Neopragmatic Framework

  Effective immediately, the Department of Philosophy will operate exclusively within a Rortyan neopragmatic framework. This transition aligns our administrative procedures with the understanding that vocabularies are tools for coping rather than mirrors of nature. Consequently, all departmental communications should be interpreted as contingent instruments designed to facilitate solidarity, not as representational claims about objective reality.

  **Curriculum and Course Catalogs**
  The course catalog is hereby reclassified as a collection of contingent vocabularies. Course descriptions no longer represent the content of knowledge but offer specific linguistic tools for coping with academic requirements. Titles such as "Metaphysics 101" are retained solely for historical continuity; instructors must clarify that these modules explore obsolete vocabularies to demonstrate their utility limits. No course aims at representational accuracy. Syllabi should explicitly state that learning outcomes measure the student's ability to redescribe problems in ways that generate new useful habits of action.

  **Grading and Redescription Protocols**
  Traditional grading rubrics are abolished. In their place, faculty will implement "redescription protocols." Assessment is not based on the truth-value of student propositions, as truth is merely what is good in the way of belief for our specific community. Instead, grades reflect the efficacy with which a student replaces an inherited vocabulary with a more useful one. An 'A' denotes a successful redescription that enhances the department's capacity for coping; a 'F' indicates a stubborn attachment to vocabularies that no longer serve our communal goals. Appeals based on "correctness" will be rejected as category errors.

  **Tenure and Solidarity**
  Tenure reviews will no longer evaluate approximation to truth or contribution to a canonical body of knowledge. Candidates are evaluated on their capacity for edification and solidarity-building. Publication records are assessed not by citation metrics but by their ability to expand the scope of "us" within the philosophical community. Candidates who prioritize argumentative precision over communal cohesion will be deemed unfit for tenure, as precision often masks a desire for representational accuracy. The goal is to produce colleagues who contribute to the ongoing conversation of mankind, not those who claim to have ended it.

  **Administrative Compliance and Discourse Types**
  Internal departmental memos constitute "normal discourse." They operate within agreed-upon rules and vocabularies necessary for daily coping. Communications from the Dean's Office, particularly those questioning the ontological status of our degrees or demanding evidence of learning outcomes, are to be classified as "abnormal discourse." These interventions introduce metaphysical objections external to our framework. Faculty are instructed not to engage these objections on their own terms but to historicize them as attempts to impose obsolete representationalist constraints. We do not refute the Dean; we redescribe the Dean's concerns as artifacts of a superseded philosophical culture.

  This framework is not true; it is merely useful for us. Compliance is expected not because it is right, but because it strengthens our solidarity.

  ***

  **Analytical Note**

  This satire takes liberties by institutionalizing concepts Rorty intended as private or conversational. Rorty warned against making pragmatism a positive doctrine; bureaucratizing "edification" risks turning anti-foundationalism into a new foundation. Additionally, Rorty often allowed representational talk within the natural sciences (Galileo vs. the Church), whereas the memo bans it universally. The treatment of the Dean's objections as "abnormal discourse" also inverts Rorty's usual alignment, where the pragmatist is often the disruptor of institutional norms.

  My interpretation would require revision if textual evidence demonstrated Rorty believed neopragmatism could sustain institutional norms without self-contradiction. Specifically, if Rorty's later work on "solidarity" implies a robust enough public framework to support tenure criteria without collapsing into the metaphysics of value he sought to avoid, the memo's logic would be defensible rather than satirical. Currently, the tension between private irony and public commitment remains the vulnerability.
