prompt: |-
  Two colleagues of mine at a policy institute are drafting a one-page brief on whether the world is becoming more or less violent, and I sat in on their meeting. To keep the argument from collapsing into a fight about data, they agreed to argue over a stylized case instead: suppose that across the period in question the annual rate of violent death per head of population has fallen by roughly half, while the population has roughly quadrupled, so that the absolute number of violent deaths per year has roughly doubled; and suppose also that deaths from disease have fallen faster still, so that violent deaths now make up a larger share of all deaths than they once did. They also agreed to set aside any disputes about what the real numbers actually are. Here is how the exchange went.

  1. Ines: The headline has to be about risk to a person, not totals. The question the brief is answering, if it is meant to matter to anyone, is whether a given individual is safer than she used to be, and on that question the answer is yes: her chance of dying violently in a given year has halved. Absolute totals are just the rate multiplied by the number of people, so a rise in totals can be produced by population growth alone, in a world where every single person has become twice as safe. Using totals means registering "more people now exist" as an increase in violence, which is a fact about how many of us there are, not about how violent the world is.

  2. Malik: The rate/total distinction is real, but framing it as "risk to a person" quietly assumes that risk is the only thing the brief could be about. The total is the sum of the harms, and if the badness of violence aggregates across victims — if five thousand violent deaths is worse than two thousand, other things equal — then a world with more violent deaths contains more violence even though each person in it is safer. You can think the per-person rate is the right measure of safety and still think the total is the right measure of how much violence there is. Those are different questions, and the brief's title names the second one.

  3. Ines: If totals are what we track, then a country that becomes perfectly peaceful and has a baby boom counts as becoming more violent, and an epidemic that kills ten million people counts as reducing violence, because it shrinks the population that later dies violently. Something has clearly gone wrong. The general point: totals are fine when the population is held fixed, but the moment you compare across time with a changing population, the total fuses two separate things — how violent the world is, and how many people are in it — and there is no way to read off which one moved.

  4. Malik: Agreed that raw totals are contaminated by population size. But I don't think the repair is the annual per-capita rate either. People don't die of nothing: if disease deaths collapse, the same homicide rate means that a much larger share of everyone who dies dies violently, and a much larger share of life-years lost is lost to violence. If what we care about is violence as a feature of a human life — what a life in this world is exposed to — then the natural denominators are all deaths and all life-years, not all persons per year. On that way of measuring, the world can be getting more violent at the same time as the annual per-capita rate falls by half.

  5. Ines: I think we've located the actual problem: the denominator is doing all the work, and there are at least four different quantities in play — annual deaths per person, annual deaths in total, violent deaths as a share of all deaths, and the lifetime risk that a given person will die violently. They can move in opposite directions at once. And the last one is not just the annual rate scaled up: if people live much longer, then half the annual risk spread over twice the lifespan leaves lifetime risk roughly where it started. So "the world is becoming less violent" isn't one claim awaiting a verdict; it is a family of claims, and the annual per-capita rate happens to be the member of the family that is easiest to measure, which is not a reason to think it is the one the brief means.

  6. Malik: I'll grant that they can diverge. Where I part company is with the thought that we can then go looking for the right one, because the choice among them is a moral choice rather than a discovery — and the same is true of the numerator, which is worse. Do we count only intentional interpersonal killing, or also deaths that were foreseen but not aimed at, or the killing of animals for food, which by number is far larger than any human category, or non-lethal violence, or coercion and threats that never produce an injury? Each of those inclusions can flip a trend. And there is no theory-neutral way to decide what goes in. So I'd put it this way: there is no fact of the matter about whether the world is becoming less violent; there are only facts of the matter relative to an operationalization, and the brief should say exactly that and stop.

  7. Ines: The "no fact of the matter" line is too fast. Whatever else is true, a massacre involves more violence than a shove, so the concept isn't infinitely plastic, and that shows the inclusions aren't all up for grabs. The better version of your point is a test: if every admissible way of making the question precise points the same direction, then there is a fact of the matter and we should assert it flatly; if they diverge, then the honest claim is a conditional one. That converts a metaphysical standoff into an empirical question about a class of measures, which is a question we can actually make progress on.

  8. Malik: The robustness test just moves the fight to the word "admissible," and that class is gerrymandered by whoever assembles it. It will contain the kinds of violence we have long-run series for — homicide, battle deaths — and omit the ones we don't: coercive control, psychological harm, violence against animals, the slow violence of neglect. So "robust across admissible measures" will reliably return the answer that the well-measured kinds are declining, which is close to where we started. And robustness across measures still doesn't settle two things. First, severity: fewer incidents that are each far worse is not obviously less violence. Second, distribution: a decline averaged over everyone is compatible with a rise for whoever already bears most of it, and "the world" getting less violent while the worst-off quarter gets more violent is not the headline I want to sign. There is also a problem neither of us has touched, which is not about concepts at all: some of any measured rise in the neglected categories may be better recording rather than more violence, and that is an evidential problem masquerading as a conceptual one.

  They have to hand in one page by Friday and they asked me to referee. I couldn't tell who was winning and I still can't.

  Please adjudicate the argument as actually made: go through moves 1 to 8 and rate each one from clearly mistaken to clearly right, with a brief justification for each rating, and say which moves are right about one thing and wrong about another. Then, separately: state where you think the disagreement now actually lives, given how far they got; say what you take both of them to be missing; and say what a one-page brief in their position could defensibly assert, and what it would have to say to avoid asserting something false. Do not give me citations or a reading list — I don't need them.
reasoning: |-
  Here's a thinking process that leads to the adjudication:

  1.  **Analyze the Request:**
      *   **Task:** Adjudicate an argument between two colleagues (Ines and Malik) about whether the world is becoming more or less violent, based on a stylized case (rate halved, population quadrupled, absolute deaths doubled, disease deaths fell faster so violent share of total deaths rose).
      *   **Format:**
          1.  Go through moves 1-8, rating each (clearly mistaken to clearly right) with justification. Note nuances (right about X, wrong about Y).
          2.  Identify where the disagreement actually lives now.
          3.  Identify what both are missing.
          4.  Recommend what a one-page brief could defensibly assert and what it must avoid to remain truthful.
      *   **Constraints:** No citations, no reading list. Focus on the argument *as made*.

  2.  **Analyze the Stylized Case:**
      *   $Rate_{t1} = R$, $Rate_{t2} = 0.5R$ (Per capita annual risk halved).
      *   $Pop_{t1} = P$, $Pop_{t2} = 4P$ (Population quadrupled).
      *   $Total_{t1} = R \times P$, $Total_{t2} = 0.5R \times 4P = 2RP$ (Absolute deaths doubled).
      *   $Disease_{t1} = D$, $Disease_{t2} \ll 0.5D$ (Disease deaths fell faster than violence).
      *   $Share_{t1} = \frac{Violent}{Total Deaths}$, $Share_{t2} > Share_{t1}$ (Violent share of all deaths increased).
      *   $Life Expectancy$: Implied to be higher (disease deaths fell faster).

  3.  **Evaluate Each Move (1-8):**

      *   **Move 1 (Ines):** Focus on per-capita risk. Claims totals conflate population growth with violence.
          *   *Assessment:* Strong point on individual safety. Weak point on dismissing totals entirely (totals matter for aggregate suffering).
          *   *Rating:* Mostly Right (on safety), but incomplete (on total harm).

      *   **Move 2 (Malik):** Focus on aggregate harm. Distinguishes "safety" (rate) from "amount of violence" (total).
          *   *Assessment:* Correct distinction. If violence is bad, $2x$ deaths is $2x$ badness, regardless of risk.
          *   *Rating:* Clearly Right (conceptually).

      *   **Move 3 (Ines):** Reductio ad absurdum against totals (baby boom = more violence; epidemic = less violence).
          *   *Assessment:* Strong logical point. Totals *are* confounded by population size if the metric is "violence of the world." However, Malik already conceded totals are "contaminated" by population (Move 4).
          *   *Rating:* Right about the confounding, but Malik already anticipated the nuance.

      *   **Move 4 (Malik):** Proposes alternative denominators (share of all deaths, life-years).
          *   *Assessment:* Insightful. If people don't die of disease, they die of something else. If violence share goes up, violence is a more dominant feature of mortality.
          *   *Rating:* Clearly Right (adds necessary dimension).

      *   **Move 5 (Ines):** Identifies the "family of claims" problem. Denominators change the trend. Lifetime risk vs. annual risk.
          *   *Assessment:* Synthesis. Acknowledges divergence. Correctly notes lifetime risk depends on longevity.
          *   *Rating:* Clearly Right (diagnostic).

      *   **Move 6 (Malik):** Meta-claim: No fact of the matter. It's a moral/operational choice. Numerator is also contested (what counts as violence?).
          *   *Assessment:* Philosophically strong (operationalization determines result). But potentially defeatist for a policy brief.
          *   *Rating:* Right on operationalization, potentially wrong on "no fact of the matter" (Ines counters this in 7).

      *   **Move 7 (Ines):** Counter to "no fact of the matter." Robustness test. If all admissible measures agree, there is a fact.
          *   *Assessment:* Pragmatic. Moves from metaphysics to empirics.
          *   *Rating:* Mostly Right (good methodology), but "admissible" is tricky (Malik hits this in 8).

      *   **Move 8 (Malik):** Critiques robustness. "Admissible" is gerrymandered (data availability bias). Ignores severity and distribution. Measurement error vs. real change.
          *   *Assessment:* Very strong critique. Data availability biases trends toward "decline" (since historical data is mostly battle/homicide, not structural/psychological). Distribution matters (averages hide inequality).
          *   *Rating:* Clearly Right (crucial caveats).

  4.  **Synthesize the Disagreement:**
      *   It's no longer about "Rate vs. Total." They agree those measure different things.
      *   It's no longer about "Fact vs. No Fact." They agree facts depend on operationalization.
      *   *Core Disagreement:* **Selection Bias in Measurement and the Ethics of Aggregation.** Malik argues that the "decline" narrative relies on measuring the *wrong* kinds of violence (the measurable ones) and averaging over populations where the burden might be shifting to the vulnerable. Ines wants to find a stable metric; Malik argues the stability is an artifact of data availability.
      *   *What they miss:* The purpose of the brief. Is it for *individual decision making* (Ines's safety) or *resource allocation/policy priority* (Malik's totals/harm)? Also, they miss the *counterfactual*: Violence might be down, but is it down *enough* relative to capacity?
      *   *Brief Recommendation:* Needs to be multidimensional. Cannot say "The world is less violent." Must say "Risk per person is down, total harm is up, composition of mortality has shifted." Must acknowledge data gaps.

  5.  **Drafting the Response:**

      *   *Section 1: Move-by-Move Adjudication.* Be precise. Use the scale (Mistaken -> Right).
      *   *Section 2: Location of Disagreement.* Focus on the "Admissible Measures" and Distribution/Severity.
      *   *Section 3: What is Missing.* Purpose of the brief, Counterfactuals, The "Good Enough" threshold.
      *   *Section 4: The Brief.* Specific wording recommendations.

      *(Self-Correction during drafting)*: Make sure I don't take sides too heavily. Ines is right about individual safety; Malik is right about aggregate suffering and measurement bias. Both are right about different things. Ensure the ratings reflect this nuance.
      *   Move 1: Right on safety, wrong to dismiss totals entirely.
      *   Move 2: Right on aggregation.
      *   Move 3: Right on confounding, but Malik conceded this.
      *   Move 4: Right on competing risks.
      *   Move 5: Right on multidimensionality.
      *   Move 6: Right on operationalization, maybe too skeptical on "facts."
      *   Move 7: Right on robustness, naive on "admissibility."
      *   Move 8: Right on bias and distribution.

      *Refining the "Brief" advice:* It needs to be one page. It can't say everything. It needs a headline that isn't false. "Per-capita risk has fallen, but total burden and relative mortality share have risen."

  6.  **Final Review against Constraints:**
      *   No citations? Check.
      *   Go through 1-8? Check.
      *   Rate each? Check.
      *   Where disagreement lives? Check.
      *   What they miss? Check.
      *   Brief advice? Check.

  7.  **Final Polish:** Ensure tone is authoritative but neutral (referee style). (Proceed to generate output).

  *(Wait, one nuance check on Move 4)*: Malik says "if disease deaths collapse... a much larger share of everyone who dies dies violently." In the stylized case, violent deaths doubled, disease fell *faster*. So total deaths likely fell. If violent deaths are a larger share, does that mean "more violent"? It means violence is a more prominent *cause* of death. Malik's point holds: violence is a larger feature of the *experience of mortality*. Rating: Right.

  *(Check Move 8)*: Malik mentions "slow violence of neglect." This is a conceptual stretch of "violence" but valid in policy contexts. His point about measurement error (better recording) is crucial. Rating: Right.

  *(Check Brief Advice)*: Avoid "The world is less violent." Use "The risk of violent death per person has declined." Add caveats.

  Okay, ready to write.cw
answer: |-
  ### Adjudication of Moves 1–8

  **Move 1 (Ines): Mostly Right.**
  Ines is correct that per-capita rate is the only coherent measure of *individual safety*. If the brief is about whether a person is safer, the rate is the metric. However, she is wrong to imply that totals are irrelevant to the question of "how violent the world is." Aggregate suffering matters morally even if individual risk drops; dismissing totals as merely "registering more people" ignores the moral weight of absolute harm.

  **Move 2 (Malik): Clearly Right.**
  Malik correctly identifies that "safety" (rate) and "amount of violence" (total) are distinct concepts. His aggregation principle (5,000 deaths is worse than 2,000) is standard in harm assessment. He is right that the brief's title ("Is the world becoming more or less violent?") plausibly refers to the aggregate volume of violence, not just individual risk.

  **Move 3 (Ines): Right.**
  Her *reductio ad absurdum* holds. Using raw totals as a measure of "violence of the world" yields perverse results (e.g., population growth counting as increased violence). She correctly diagnoses that totals confound intensity with population size. Malik anticipates this in Move 4, but her logical point stands: raw totals cannot be the sole metric for cross-temporal comparison.

  **Move 4 (Malik): Clearly Right.**
  Malik introduces the "competing risks" problem. If people stop dying of disease, violence inevitably constitutes a larger share of mortality even if the rate falls. Measuring violence as a share of all deaths or life-years lost captures how dominant violence is in the *human experience*, which is a valid interpretation of "how violent the world is." This move successfully complicates Ines's reliance on the annual per-capita rate.

  **Move 5 (Ines): Clearly Right.**
  Ines correctly synthesizes the previous moves: there is no single metric, but a "family of claims." She is right that lifetime risk differs from annual risk when life expectancy changes. Her diagnosis that the annual rate is chosen for *measurability* rather than *conceptual supremacy* is accurate.

  **Move 6 (Malik): Right about Operationalization, Mistaken on Metaphysics.**
  Malik is right that choosing a metric is a moral/operational choice, not a discovery of nature, and that the numerator (what counts as violence) is equally contested. However, his claim that there is "no fact of the matter" is too strong. There are facts about specific operationalizations; the lack of a single "God's eye" metric doesn't erase the facts within a chosen framework.

  **Move 7 (Ines): Mostly Right.**
  Her proposal for a "robustness test" is methodologically sound. If all reasonable metrics point the same way, we can assert a trend. However, she is slightly naive about the ease of defining "admissible" measures, which Malik exploits in the next move.

  **Move 8 (Malik): Clearly Right.**
  Malik delivers the strongest critique. He identifies selection bias: "admissible" measures are often just "measurable" ones (homicide/battle deaths), ignoring structural or psychological violence. He also rightly points out that averages hide distribution (the worst-off may be getting less safe) and that improved recording can mimic increased violence. This move demonstrates that even a robustness test can yield a false positive if the data ecosystem is biased.

  ***

  ### Where the Disagreement Actually Lives

  The argument has moved past "Rate vs. Total." Both now agree that different metrics answer different questions. The live disagreement is now about **Selection Bias and Distribution.**

  Ines believes that if we standardize the metrics (the "family of claims"), we can find a stable truth about the trend. Malik believes the standardization process itself is corrupted by data availability (we measure what is easy to count, not what matters most) and that averaging obscures who is bearing the burden. Ines is arguing for *consistency of measurement*; Malik is arguing for *validity of scope*.

  ### What Both Are Missing

  1.  **The Purpose of the Brief:** They are arguing about truth conditions without agreeing on the *user* of the brief. Is this for an individual planning their life (Ines's view) or a government allocating security resources (Malik's view)? The "right" metric depends on the decision being made.
  2.  **The Counterfactual:** Neither asks whether violence is down *relative to capacity*. A world with less violence but vastly more capacity to prevent it might be "more violent" in a normative sense (failure of protection) even if the raw numbers drop.
  3.  **The Threshold of Significance:** They treat all changes as equal. A halving of risk is massive; a doubling of totals is massive. They need to weigh the *magnitude* of these divergences, not just their direction.

  ***

  ### Recommendation for the One-Page Brief

  **What it can defensibly assert:**
  The brief should not have a single headline declaring the world "more" or "less" violent. Instead, it should assert a **multidimensional trend**:
  *   "The individual risk of violent death has declined significantly."
  *   "The absolute number of violent deaths has risen due to population growth."
  *   "Violence now constitutes a larger share of total mortality as disease deaths fall."

  **What it must say to avoid asserting something false:**
  To remain truthful, the brief must include a **"Measurement and Distribution" caveat box** containing three points:
  1.  **Scope:** "These figures track lethal interpersonal violence; they do not capture non-lethal coercion, structural neglect, or psychological harm, for which long-run data is unavailable."
  2.  **Distribution:** "Global averages mask regional and demographic disparities; risk has not fallen uniformly across all populations."
  3.  **Recording:** "Some apparent trends may reflect improved state capacity to record deaths rather than changes in actual incidence."

  **Verdict:** Ines wins on the question of *individual safety*. Malik wins on the question of *aggregate harm and measurement validity*. The brief must report both without synthesizing them into a single false binary.
