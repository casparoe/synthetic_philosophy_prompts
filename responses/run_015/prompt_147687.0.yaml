answer: |-
  1. **Leibniz's Law and Predicate Abstraction**
  **Question:** Critics argue that even if you relativise modality, Leibniz's Law still bites. They say we can abstract a predicate like "could have been distinct from Andromeda" out of the modal context. Clod satisfies this predicate, Andromeda does not, so they differ in properties and cannot be identical. How does your view block this specific move from relativised modality to a violation of the Indiscernibility of Identicals without simply stipulating that Leibniz's Law doesn't apply here?
  **Likely Reply:** She will likely say that the predicate itself is incomplete; properties are not monadic but sortal-relative, so there is no single property "could have been distinct" to compare.
  **Follow-up:** If properties are essentially relational to sortals, does identity itself become relative to sortals, and if so, haven't you just renamed constitution theory rather than defending strict identity?

  2. **The Bare Demonstrative Probe**
  **Question:** On your view, the sortal is fixed by the causal-historical chain of a name or description. But imagine I point at the pedestal and say, "This could have been a shapeless lump," and then, "This could have been bronze," without using any name or sortal-loaded description. Since the demonstrative "this" lacks the specific historical chain of "Andromeda" or "Clod," does the sortal-relativity vanish in this case, and if it doesn't, what fixes the sortal for a bare demonstrative?
  **Likely Reply:** She will likely argue that even demonstratives are accompanied by a tacit sortal concept or intention in the speaker's mind at the moment of reference.
  **Follow-up:** If the modal profile depends on the speaker's tacit intention, does the object's modal profile change depending on who is pointing at it, making modality mind-dependent rather than worldly?

  3. **The Squash and Reshape Scenario**
  **Question:** Let's press the persistence conditions. If Andromeda is identical to Clod, and Clod survives being squashed into a ball, does Andromeda survive the squashing? If you say yes, then "statue" seems to function as a phase sortal like "student." But if the ball is reshaped into the original form two days later, does the *same* statue return, or is it a new one?
  **Likely Reply:** She will likely say Andromeda survives as a lump but ceases to be a statue, and if reshaped, the statue returns only if the causal history of the form is appropriately connected.
  **Follow-up:** If the statue can cease to be a statue and then become one again, what distinguishes this from the constitution view where the statue ceases to exist and a new one is constituted by the same clay?

  4. **Constraints on Available Sortals**
  **Question:** You allow the thing to carry a statue-profile and a lump-profile. But what constrains the available sortals? Why isn't there also a "doorstop-profile" or a "thing-shaped-just-so-profile"? If you appeal to the sculptor's intentions to limit this, what is the modal profile of a lump of clay in a universe where no one has ever taken an interest in it?
  **Likely Reply:** She will likely claim that sortals must correspond to genuine causal capacities or natural kinds, not just arbitrary descriptions, to count as valid relativisers.
  **Follow-up:** If the validity of a sortal depends on natural kinds rather than intentions, doesn't that suggest the modal profiles are discovered in the object, which pushes us back toward there being two distinct objects with different natures?

  5. **Temporal Relativity**
  **Question:** If *de re* modal predication is sortal-relative, does this relativity extend to temporal predication as well? We say "the statue was made on Monday," but the clay existed before that. Is there any unrelativised fact about when the thing itself began to exist, or does the relativity go all the way down such that the object has no single history?
  **Likely Reply:** She will likely concede that temporal beginnings are also sortal-relative; the *statue* began Monday, the *lump* began earlier, but the *thing* has no unrelativised start date.
  **Follow-up:** If the thing has no unrelativised start date or history, what grounds the unity of the thing across time, and is there anything left of the object's own identity once you strip away the sortal-relative histories?

  6. **Extension to Persons and Organisms**
  **Question:** Many listeners will wonder if this applies to us. Are you committed to saying a human person is contingently identical to the animal she is? If so, what happens in a case where the organism persists without the person, such as a permanent vegetative state? And why does the statue case feel like a verbal puzzle while the person case feels like a substantive dispute about what we are?
  **Likely Reply:** She will likely argue the machinery is identical: person and organism are one thing with different sortal profiles, and the "substantive" feel is a psychological illusion.
  **Follow-up:** If the machinery is identical, why do the ethical stakes change so drastically between the two cases, and does your view imply that death is merely a change in sortal profile for the organism?

  7. **Substantive vs. Verbal Dispute**
  **Question:** Consider the constitution theorist who denies identity and posits two coinciding objects. You say there is one object with two profiles; they say there are two objects with one location. What would actually settle this dispute? Is there a truth-maker or an empirical fact that would prove you right and them wrong, or is this a choice between two equally valid ways of counting?
  **Likely Reply:** She will likely argue her view is more ontologically parsimonious because it posits fewer entities in the world, which is a theoretical virtue that settles the dispute.
  **Follow-up:** If the disagreement is settled by parsimony rather than truth-makers, doesn't that suggest you are offering a better conceptual scheme rather than a description of the mind-independent world?

  8. **Substitutivity in Belief Contexts**
  **Question:** Since your view relies heavily on names and causal chains, consider a believer who knows "Clod is clay" but doesn't know "Andromeda is Clod." If Andromeda just is Clod, should we say they believe "Andromeda is clay"? If you say no, because the sortal chain differs, does this mean logical substitutivity fails in belief contexts even when the identity is true?
  **Likely Reply:** She will likely accept that substitutivity fails in intensional contexts because the cognitive access to the object is mediated by the sortal-specific chain.
  **Follow-up:** If rational agents can fail to substitute identicals because of sortal chains, does this imply that rationality is sensitive to our naming practices rather than the underlying metaphysical reality?

  9. **Transworld Identification**
  **Question:** To say "Andromeda could have been bronze," we must identify Andromeda in a possible world. But if Andromeda's identity conditions are fixed by the "statue" sortal, how do we identify *the thing* in a world where it is bronze but not a statue? Do we need a sortal to pick out the object before we can apply the sortal-relative modal profile?
  **Likely Reply:** She will likely say we identify the object via its actual-world causal chain and then trace that same object into the counterfactual scenario.
  **Follow-up:** But if the object's modal profile changes in that world because the sortal application changes, how do we ensure we are tracking the *same* object and not just a counterpart that satisfies the causal description?

  10. **The Unity of the Object**
  **Question:** You insist there is only one thing on the pedestal. But if the statue-profile and the lump-profile have incompatible modal and temporal properties, what unifies them as properties of *one* thing? Is there a "neutral" substrate that bears these profiles, and if so, isn't that substrate the only thing that truly exists, rendering the profiles merely conceptual?
  **Likely Reply:** She will likely deny a neutral substrate and argue that the unity is primitive; the thing is just the bearer of multiple, incompatible sortal-relative profiles.
  **Follow-up:** If the unity is primitive and the profiles are incompatible, have you really explained the coherence of contingent identity, or have you just asserted that contradictions are acceptable so long as they are relativised?
