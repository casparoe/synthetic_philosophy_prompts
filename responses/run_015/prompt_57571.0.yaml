answer: |-
  **1. Does the taxonomy hold?**

  The distinction between *weight* and *annexation* is unstable and risks collapsing. You define *presence* as treating a consideration as morally force-bearing at all, and *annexation* as moving a consideration from a non-moral normative system (etiquette) into the moral economy. However, if etiquette involves normative force (blame, sanction), the difference between annexation and presence becomes merely verbal unless you provide a robust criterion for distinguishing "moral" force from "non-moral" normative force. If you cannot define "moral" independently of the judgments you are classifying, annexation simply becomes a subtype of presence variation (presence in the moral domain vs. presence in the etiquette domain).

  If annexation collapses into weight (where weight = 0 is non-moral and weight > 0 is moral), you lose the ability to claim that the *structure* of the moral faculty is universal. You would only be claiming that the *capacity* for normativity is universal. The paper can survive on a two-way distinction (Presence vs. Weight), but you must tighten the definition of "moral domain." If you keep the three-way distinction, you must argue that the *quality* of the force changes during annexation, not just the magnitude. Currently, you describe annexation as making violation "a matter of blameworthy character rather than of bad manners." This suggests a qualitative shift, but without explaining what constitutes "moral" blame versus "etiquette" blame, the category remains vulnerable to the charge that it is just weight variation with a different label.

  **2. Is the weighting-fixity argument valid?**

  The inference from "weighting varies with non-truth-conducive factors" to "there is no culture-neutral way to fix the weights" contains a gap. Your worry is correct: a realist can argue that moral facts are indexed to social ecology. If the moral fact is "maximize social cohesion," and market integration changes what maximizes cohesion, then the varying weights track truth. The premise that fails is your assertion that subsistence style and kinship structure are variables "no realist would call truth-conducive." A naturalist realist certainly might.

  To block this, you must argue that the correlation is causal rather than tracking. You need to premise that these ecological variables drive psychological calibration via evolutionary or cultural selection pressures that are indifferent to moral truth, not sensitive to it. Currently, you assert the provenance is non-truth-conducive; you do not argue for it. If you cannot establish that these variables are epistemically inert regarding moral truth, the realist can maintain that idealization simply requires knowing the local ecological facts to determine the correct weights. You do not need to abandon the argument, but you must shift the burden: argue that the *variation* in weights is better explained by adaptive pragmatic pressure than by sensitivity to varying moral facts. Without this, the weighting-fixity problem looks like a feature of moral reality (context-sensitivity) rather than a bug in realist epistemology.

  **3. The self-undermining worry.**

  This is a serious vulnerability. If the counterweight test disqualifies weightings derived from historical/ecological provenance, and your own philosophical proposal is derived from your own historical/ecological provenance (academic philosophy, specific institutional context), the test consumes itself.

  You should revise Section 5 to clarify the status of the counterweight test. It must be presented not as a first-order moral weighting (which would be subject to the test) but as a meta-ethical criterion for what counts as *objective* within a realist framework. You are not claiming your test is provenance-free; you are claiming that *if* one wants to claim objectivity, *then* one must meet this criterion. This makes the argument conditional or internal to the realist project. Alternatively, concede the asymmetry: argue that the test is a methodological tool for evaluating moral claims, not a moral claim itself. The genealogical objection applies to substantive moral weights, not to epistemic criteria for evaluating them. Explicitly distinguishing the meta-ethical level from the first-order level in Section 5 will escape the self-undermining charge.

  **4. Empirical accuracy.**

  *   **Economic Games:** The sentence "Every one of those results describes a population responding to the same structural feature of the situation... with a different calibration" overstates the consensus. Some populations in the foundational studies did not respond to the structural features in recognizable normative ways (e.g., treating the game as unrelated to social life entirely). While rare, this approaches presence variation. You should qualify "Every one" to "Nearly every one" or acknowledge the outliers.
  *   **Harm–Purity–Community:** The claim that this literature "generally shows populations disagreeing about whether a harmless violation carries normative force" is contested. A significant body of critique argues that participants who condemn "harmless" violations actually perceive hidden harms (symbolic, spiritual, or social). Characterizing this as annexation or weighting assumes the harm is objectively absent, which is the very point in dispute. You should frame this as "participants report normative force despite the absence of *secular* harm," rather than implying the harm is objectively nonexistent.
  *   **East–West Cognition:** The sentence "And the East–West cognition literature is mostly about how much of the perceptual and explanatory field a judgment takes in" leans heavily on contested replication. Much of this work has faced significant replication challenges in recent years. Furthermore, linking general perceptual cognition directly to moral weighting is an inference, not a direct finding. You should soften this to "suggests variation in explanatory scope" rather than stating it as established fact.
  *   **Presence Variation:** Your claim that "clean presence variation is rare" is defensible but strong. There are attested cases of populations lacking specific normative concepts (e.g., specific forms of fairness or rights) that function as near-absences. You do not need to confront every case, but acknowledge that "rare" does not mean "nonexistent," and that your argument relies on the *preponderance* of weight variation, not the total absence of presence variation.

  **5. Interest and economy.**

  The paper's primary contribution is the **weighting-fixity argument**. The taxonomy is a necessary tool to set up the argument, and the counterweight test is the constructive consequence. The empirical survey (Section 4 in your text) is currently doing load-bearing work by justifying the premise that variation is mostly weighting, but it reads too much like a literature summary for a specialist audience.

  You should cut the empirical section by half. You do not need to detail the specific mechanics of the economic games (low offers, status debt, market integration) unless those details specifically prove *weighting* rather than *presence*. The specialist audience knows the data; they need to know why your interpretation of the data (as weighting rather than presence) is superior. Reduce the summary to the claim: "The data consistently show universal sensitivity to normative stakes with varying calibration, rather than absence of sensitivity." Use the saved space to bolster the argument in Section 2 (weighting-fixity) against the realist reply regarding ecological truth-tracking. The empirical section supports the premise, but the philosophical heavy lifting is in showing why that premise defeats idealization. Prioritize the fixity argument; it is the novel philosophical move.
