      *   **Proposal:** A "counterweight test" for realism (objectivity at domain level, underdetermination at weighting level).
      *   **Tone:** Philosophical, analytical, confident.

  3.  **Drafting Comments under Heading 1: Taxonomy (Presence, Weight, Annexation)**
      *   *Issue:* Is annexation distinct from weight?
      *   *Analysis:* If Annexation = Weight = 0 (or near zero) vs. Weight > 0, then it collapses into weight. The draft defines annexation as moving from non-moral (etiquette) to moral (blame). Weight is priority *within* moral economy.
      *   *Critique:* There is a conceptual overlap. If something is "etiquette" it has normative force but not *moral* force. If it becomes "moral," it enters the moral domain. This looks like Presence Variation (is it in the moral domain?) rather than Weight Variation (how much does it count within the domain?). However, the draft defines Presence as "force-bearing at all." If etiquette bears force, is it moral? The distinction hinges on the definition of "moral domain."
      *   *Risk:* If annexation collapses into presence (is it moral or not?), then the claim that "presence variation is rare" becomes harder to defend because annexation *is* a form of presence variation (presence in the moral domain vs presence in the etiquette domain).
      *   *Advice:* Clarify the boundary between "normative force" and "moral force." If annexation is just shifting a consideration from Domain A (Etiquette) to Domain B (Morality), is that distinct from Presence (Domain B vs Nothing)? If it collapses, the paper survives but needs to reframe "Presence" as "Moral Presence" vs "Non-Moral Presence." The loss is precision in distinguishing structural absence from categorical shifting.

  4.  **Drafting Comments under Heading 2: Weighting-Fixity Argument**
      *   *Argument:* Idealization requires fixing weights. Weights vary by ecology/history (non-truth-conducive). Therefore, no culture-neutral way to fix weights.
      *   *User's Worry:* Realist could say weights track real features of ecologies (e.g., high kinship density *requires* different weights for loyalty).
      *   *Critique:* The move from "correlation with ecology" to "no culture-neutral way" is indeed vulnerable to the realist reply that moral facts are context-sensitive. If moral facts are indexed to social structures, then varying weights track varying facts.
      *   *Blocking:* To block this, the author needs to argue that the *variation* itself is not truth-tracking but adaptive/pragmatic. The draft says "variables that no realist would call truth-conducive: subsistence style..." But a realist *could* call them truth-conducive if moral facts are natural facts about social cohesion.
      *   *Advice:* The premise that fails is "variables that no realist would call truth-conducive." You need to argue why market integration isn't truth-conducive. Is it because it's arbitrary? Or because it leads to incompatible weights that cannot both be true? The argument needs to strengthen the claim that these variables are *causal drivers of psychology* rather than *indicators of moral truth*. The distinction between "causes of belief" and "truth-makers" needs to be sharper.

  5.  **Drafting Comments under Heading 3: Self-Undermining Worry**
      *   *Issue:* The counterweight test rejects weightings based on historical/ecological provenance. But the test itself is proposed by a historically/ecologically situated author.
      *   *Analysis:* This is a standard genealogical self-referential objection.
      *   *Advice:* The paper should concede asymmetry. The argument is transcendental or internal to the project of realism. You are showing what realism *must* look like to survive the data. You aren't claiming your weighting is provenance-free, but that *any* realist weighting must meet this criterion to claim objectivity. Alternatively, argue that the test is a methodological constraint, not a substantive moral weighting. It's a rule for evaluating weights, not a weight itself. Revise Section 5 to clarify that the test is a meta-ethical criterion, not a first-order moral judgment.

  6.  **Drafting Comments under Heading 4: Empirical Accuracy**
      *   *Economic Games:* "Striking result was not that some populations were indifferent... it was that predictions of narrow self-interest failed everywhere." -> Generally accurate (Henrich et al.). "Most generous populations tended to be the most market-integrated." -> This is the "market integration" finding. Generally supported, but some replication issues exist in specific societies.
