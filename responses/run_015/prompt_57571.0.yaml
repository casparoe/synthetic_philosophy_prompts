      *   *Presence Variation:* "Clean presence variation is rare." -> Defensible? Psychopaths? Some specific cultural taboos? But generally, Moral Foundations Theory argues for universal foundations (presence) with varying activation. However, some anthropologists argue for true absence (e.g., no concept of 'fairness' in some groups). The "Henrich" data actually suggests *some* groups don't punish in ultimatum games (which could be read as absence of fairness norm enforcement). You need to be careful not to overstate the universality.
      *   *Advice:* Flag the "harmless violation" claim as theoretically loaded (participants often report hidden harm). Flag the East-West cognition link as inferential (general cognition vs. moral cognition). The claim about clean presence variation being rare is defensible but needs to acknowledge the "fairness" outlier data in some small-scale societies.

