      *   *Refining the Neuroscience:* I need to mention Suzana Herculano-Houzel. Her work shows primate brains pack neurons more densely than ungulates (pigs/cows) or cetaceans (whales). A whale brain is huge but has fewer neurons per volume than a human. So "Whale > Human" based on mass is scientifically false regarding processing power/neurons. This is a crucial point to make.
      *   *Refining the Philosophy:* Distinguish between *moral status* (rights/protection) and *moral weight* (interest counting). Utilitarians might accept scalar weight, but rights theorists reject scalar status.
      *   *Refining the AMC:* The AMC is usually a *reductio* against speciesism, not a positive theory of brain-size hierarchy.

  6.  **Self-Correction/Review during drafting:**
