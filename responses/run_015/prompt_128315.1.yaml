      *   *Check:* Is the distinction between "absolute size" and "neuron count" clear? *Action:* Make sure to highlight that the text conflates mass with capacity.

  7.  **Final Polish:** Ensure the voice sounds like a philosopher advising a layperson (clear, structured, avoiding unnecessary jargon where possible, but precise where needed). (Proceed to generate output based on these thoughts.)

      *(Self-Correction on Claim 3)*: The text says "bandwidth grows faster than the tissue does." This implies a non-linear scaling. In neuroscience, metabolic cost scales linearly or sub-linearly depending on the metric. Connectivity scales differently. This is a specific scientific claim that is dubious. I should flag it as a simplification at best.

