      *   **Requirement:** Separate claims, assess each (accept/simplify/distort), check if conclusions follow, offer strongest nearby versions, flag verbal disagreements.

  2.  **Deconstruct the Passage into Claims:**
      I need to break the text down into discrete propositions to evaluate them individually.

      *   *Claim 1:* Moral mattering is settled by "phenomenal bandwidth" (amount of experience bound into a conscious scene).
      *   *Claim 2:* Brains are the only machinery known to deliver bandwidth.
      *   *Claim 3:* Bandwidth grows faster than tissue mass because binding requires an integrated physical system (scaling law).
      *   *Claim 4:* The Argument from Marginal Cases (AMC) is strong because species is merely biological (like race).
      *   *Claim 5:* The only difference that could do moral work between a chimp and an impaired infant is bandwidth (a matter of brain).
      *   *Claim 6:* Eating a pig while objecting to experiments on an impaired infant is parallel to racism.
      *   *Claim 7:* Moral status is a sliding scale, not a threshold.
      *   *Claim 8:* A whale sits above humans, a chicken below, and a human with a smaller brain sits below a human with a larger one.

  3.  **Evaluate Each Claim (Philosophical & Neuroscientific Lens):**

      *   *Claim 1 (Bandwidth = Moral Mattering):* This is a utilitarian/preference-satisfaction view (Singer-esque) but phrased in terms of consciousness intensity. *Assessment:* Plausible within specific frameworks, but not universal. Deontologists or capabilities approach proponents would reject it.
      *   *Claim 2 (Brains only machinery):* Neurocentrism. *Assessment:* Generally accepted in physicalism, but ignores potential non-biological AI or distributed systems. Acceptable simplification for now.
      *   *Claim 3 (Bandwidth scales super-linearly with mass):* This is the neuroscience crux. Does consciousness scale super-linearly with mass? *Neuroscience check:* Not necessarily. Allometric scaling varies. Neuron count matters more than mass (Herculano-Houzel's work). Packing density varies (primates vs. rodents). *Assessment:* Distortion/Oversimplification. Mass $\neq$ Neurons $\neq$ Connectivity $\neq$ Consciousness.
      *   *Claim 4 (AMC targets Species):* *Philosophy check:* AMC usually targets *capacities* (rationality, autonomy) to show speciesism is arbitrary. It argues that if we protect humans with low capacities, we must protect animals with similar capacities. It doesn't necessarily argue species *is* race, but that using species as a proxy for capacity is like using race as a proxy for capacity. *Assessment:* Simplification.
      *   *Claim 5 (Only bandwidth differs):* Ignores other potential morally relevant traits (relationships, moral agency, potentiality). *Assessment:* Contested.
      *   *Claim 6 (Pig/Infant = Racism):* Strong analogy, but relies on previous claims holding. *Assessment:* Follows only if Claim 1 & 5 hold.
      *   *Claim 7 (Sliding Scale):* *Philosophy check:* Many AMC proponents (like Singer) do argue for gradation. However, many rights-based theorists argue for a threshold (personhood). *Assessment:* Contested conclusion.
      *   *Claim 8 (Whale > Human, Small Human < Large Human):* *Neuroscience check:* Whale brains are larger but have different cortical organization (less dense neurons than primates). *Philosophy check:* Intra-species inequality based on brain size is deeply counterintuitive and generally rejected even by utilitarians (who focus on sentience intensity, not raw volume). *Assessment:* Distortion/Reductio ad absurdum.

  4.  **Address Specific Focus Areas:**

      *   *Brain Size Metrics:* Absolute mass is a poor proxy. Cortical neuron count (Herculano-Houzel) is better. But does neuron count = moral worth? A threshold theorist says "No, once you have enough for sentience, more doesn't mean *more* rights."
      *   *AMC Deployment:* AMC is usually used to *lower* the status of some humans to match animals OR *raise* animals to match humans. It's rarely used to create a strict hierarchy *within* humans based on anatomy. The race analogy holds for speciesism, but the "brain size" metric undermines the race analogy (since race doesn't correlate with brain size morally).
      *   *Sliding Scale vs. Threshold:* Threshold theorists (Kantians, Rights Theorists) say "Personhood" is binary. You either have the capacity for agency/autonomy or you don't. Sentience might be scalar, but *rights* are often thresholded.
      *   *Intra-species:* This is the killer objection. If brain size = moral status, men > women (on average), some adults > others. This violates basic equality. A defender must pivot to "species-typical capacity" or "potential" to avoid this, which undermines the original "bandwidth" argument.

  5.  **Drafting the Response (Iterative refinement):**

      *   *Tone:* Professional, nuanced, charitable but rigorous.
      *   *Structure:*
