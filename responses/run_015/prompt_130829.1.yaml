      *   *(ii) Limited-Access Account:* Privacy = Reduced accessibility (secrecy, anonymity, solitude).
          *   *Translation:* Privacy is minimizing the surface area of accessible rows/columns. DP epsilon budgets measure the leakage rate. Anonymity = k-anonymity or DP guarantees. Secrecy = encryption/access control.
      *   *(iii) Contextual Integrity (CI):* Privacy = Flow norms appropriate to context.
          *   *Translation:* Privacy is validating that the `purpose` tag matches the transmission principle between roles. A violation is when data flows from `clinical` context to `marketing` context without norm adherence, regardless of access controls.
      *   *(iv) Constitutive/Room-to-Become:* Privacy = Space for self-formation.
          *   *Translation:* Privacy is preventing inference chains that lock a principal into a static profile. It's about limiting lineage tracking that solidifies identity across contexts, ensuring re-identification risk doesn't constrain future behavior.

  3.  **Drafting the Translations (Mental Check):**
