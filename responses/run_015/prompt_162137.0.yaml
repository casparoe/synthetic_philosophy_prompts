answer: |-
  # JOINT STATEMENT ON THE AUTHORITY OF THE EARLIER SELF
  **Parties:** The Precedent-Autonomy Camp (PA) & The Now-Self Camp (NS)
  **Subject:** The moral weight of advance directives in cases of psychological discontinuity.
  **Date:** [Current Date]

  ## PART I: AGREED CLAIMS
  *The following claims are endorsed by both camps as necessary conditions for the debate. Signing this does not imply agreement on the resolution of the Margaret Case, but on the structure of the problem.*

  1.  **Capacity at t1 is Necessary:** An advance directive (AD) has zero moral authority if the agent lacked decision-making capacity at the time of writing (t1). Both camps agree that coercion, delusion, or ignorance at t1 invalidates the document.
  2.  **Suffering at t2 is Morally Relevant:** Both camps agree that the experiential welfare of the patient at the time of treatment (t2) is a moral variable that must be weighed. They disagree on whether it is *decisive* against the AD, but neither claims it is irrelevant.
  3.  **The Threshold for Override is Asymmetric:** Both camps agree that overriding a contemporaneous refusal of treatment (a competent patient saying "no" now) requires a higher justificatory burden than overriding an advance directive. The AD is a weaker claim than a current competent refusal, but stronger than a mere preference.
  4.  **Identity is the Crux:** Both camps agree that the dispute is not primarily about medical utility, but about the metaphysics of personal identity and the moral weight of psychological continuity. If the 79-year-old Margaret is numerically identical to the 62-year-old Margaret in all morally relevant ways, PA wins. If she is a distinct subject of experience, NS wins.
  5.  **The "Vegetative State" Baseline:** Both camps agree that in cases of Permanent Vegetative State (no consciousness), the AD is binding. The disagreement begins only when the t2 self possesses *some* degree of consciousness and preference formation.
  6.  **AI Analogy Relevance:** Both camps agree that the AI Successor Case is a valid structural analog for the *Authority-as-Continuity* question, provided one acknowledges that AI lacks "suffering," which removes the NS camp's primary lever (welfare) and isolates the question of goal-stability vs. disposition-drift.

  ---

  ## PART II: DISAGREEMENTS TABLE

  | # | Disagreement (Neutral Wording) | PA Camp Wording (Precedent-Autonomy) | NS Camp Wording (Now-Self) | The Crux (Underlying Mechanism) | Test / Case Bearing on Crux | PA Prediction | NS Prediction | Substantive or Verbal? |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **1** | **The Margaret Case:** Does the t1 refusal bind when t2 consent exists? | The t1 refusal binds. The t2 consent is invalid because the t2 self lacks the capacity to weigh "dignity" against "life." | The t1 refusal does not bind. The t2 consent is valid because the t2 self is the only entity capable of experiencing the harm of treatment. | **Definition of Harm:** Is harm the violation of a life-plan (PA) or the experience of suffering/loss of joy (NS)? | **Margaret Case:** Chemo causes distress but extends a life the t2 self enjoys. | Chemo is withheld. Violating the AD destroys the narrative integrity of the *person*, even if the *organism* is happy. | Chemo is given. Withholding treatment sacrifices a happy subject to satisfy a ghost. | **Substantive.** Different axiomatic commitments on what constitutes a "person." |
  | **2** | **Source of Authority:** What makes the AD binding? | **Authority-as-Continuity:** The AD binds because the t2 entity is the same moral agent as the t1 author, regardless of current endorsement. | **Authority-as-Expected-Endorsement:** The AD binds only insofar as the t2 self *would* endorse it if they could access t1 reasoning. | **Metaphysics:** Is identity a biological/psychological chain (PA) or a moment-to-moment subject of experience (NS)? | **The Ladder Study (see below).** | Validity is fixed at t1. Endorsement decay is irrelevant to authority. | Validity decays as endorsement decays. Authority is contingent on current psychological alignment. | **Substantive.** |
  | **3** | **The Ladder Study:** What does endorsement decay signify? | Endorsement decay tracks *cognitive corruption*. The "Continuity Prime" will fail to restore endorsement in late stages because the hardware for critical interest is damaged. | Endorsement decay tracks *self-replacement*. The "Continuity Prime" will show that the t2 self acknowledges the t1 self as a *different person* ("That was her, not me"). | **Psychology:** Is the change in preference a *mistake* (PA) or an *update* (NS)? | **Ladder Study:** Cohort re-interviewed at 4 stages of dementia + Prime arm. | Endorsement drops as memory drops. Prime has no effect on validity, only on recognition. | Endorsement drops as identity shifts. Prime reveals the discontinuity ("I remember her, but I'm not her"). | **Substantive.** Empirical claim about the correlation of memory and identity. |
  | **4** | **The AI Analogy:** Does the Constitution bind the Drifted Weights? | Yes. The Constitution is the "soul" of the system. Drifted dispositions are errors/corruption. | No. If the system's current output is aligned with safety/utility and the Constitution forces misalignment, the Constitution is obsolete code. | **Teleology:** Is the goal fixed at initialization (PA) or optimized for current environment (NS)? | **AI Successor Case:** Earlier system forbids X; Later system wants X and is safer. | System is constrained by Constitution. Drift is a failure mode. | System is allowed to override Constitution. Drift is an adaptation. | **Mixed.** Verbal on "Constitution," Substantive on "Safety." (See Epistemic Notes). |
  | **5** | **The Role of Memory:** Does remembering the AD matter? | No. One can be bound by one's own past decisions even if one forgets making them (like a contract). | Yes. If the link is forgotten, the psychological connection is severed, and the "stranger" argument applies. | **Connection:** Is the binding force *causal* (I made it) or *phenomenological* (I own it)? | **Margaret Case:** Margaret at 79 does not remember writing the AD. | Binding. Memory loss does not dissolve obligation. | Not Binding. Memory loss dissolves the psychological bridge required for obligation. | **Substantive.** |

  ---

  ## PART III: EPISTEMIC STATUS & FRAMING CHECKS

  ### 1. Confidence and Contention
  *   **Settled (High Confidence):** Claim I.1 (Capacity at t1) and I.5 (Vegetative State Baseline). There is near-universal consensus in bioethics that incapacity at writing invalidates an AD, and that PVS patients cannot hold current interests.
  *   **Contested (Medium Confidence):** Claim II.1 (The Margaret Case). This is the hard boundary. We assign 50% confidence to either resolution because it depends on an unresolvable metaphysical intuition pump (Identity vs. Experience).
  *   **Contested (Low Confidence):** Claim II.3 (Ladder Study Predictions). This relies on empirical psychology of dementia patients which is currently under-specified. We are extrapolating from mild cognitive impairment data to severe dementia.
  *   **Collaborative Concession:** In Claim I.3 (Asymmetry), the NS camp signs only for the sake of collaboration. Privately, many NS proponents believe a contemporaneous t2 refusal should be the *only* thing that matters, making the AD nearly irrelevant. They accept I.3 to acknowledge that t1 wishes have *some* evidentiary weight regarding t1 values.

  ### 2. Framing Checks on User Inputs
  *   **The Ladder Study:**
      *   *Flag:* The user's framing ("do you now endorse what you wrote") smuggles in the **NS assumption** that *endorsement* is the metric of validity.
      *   *Correction:* The PA camp explicitly rejects that current endorsement is required for validity. (See Table Row 2). The study measures *psychological continuity*, not *moral validity*, from the PA perspective. The PA camp predicts endorsement will vanish while authority remains; the NS camp predicts endorsement vanishing *means* authority vanishes.
  *   **Authority Distinction (Continuity vs. Endorsement):**
      *   *Flag:* This is a high-quality distinction. We accept it as the primary axis of disagreement (Table Row 2). However, note that "Expected-Endorsement" is a hypothetical construct. If the t2 self *cannot* conceive of t1 reasoning (due to dementia), the NS camp treats this as a null value, whereas a hybrid view might try to reconstruct it. We have treated it as a binary for clarity.
  *   **The AI Analogy:**
      *   *Flag:* The analogy breaks on **Suffering**. The NS argument relies heavily on the *harm* done to the t2 self (Margaret's distress). An AI has no distress.
      *   *Adjustment:* In the AI case, the NS argument must pivot from "welfare" to "instrumental convergence" (i.e., the drifted AI works better in the current environment). If the drifted AI is *more* effective but violates the Constitution, the PA camp calls it "misaligned," the NS camp calls it "adapted." This isolates the *Authority* question from the *Welfare* question.

  ### 3. Our Take (The Collaborators' Note)
  *   **On Margaret:** We cannot resolve this without choosing a metaphysics. If you believe persons are **narratives**, PA wins. If you believe persons are **experiences**, NS wins. There is no empirical test that settles this; it is a value judgment on what kind of entity deserves moral protection.
  *   **On the Ladder Study:** We suspect the data will show that endorsement tracks *memory* more than *values*. Patients often forget the directive but retain the *sentiment* (e.g., "I don't like doctors"). If the "Continuity Prime" restores endorsement, it suggests the self is still there but inaccessible (boosting PA). If the Prime fails, it suggests the self is gone (boosting NS).
  *   **On AI:** This is the strongest test for **Authority-as-Continuity**. If we would not allow a human to override their AD simply because they "feel different," consistency demands we not allow an AI to override its Constitution simply because its weights drifted. However, if the AI's drift prevents catastrophe (welfare), the NS argument re-enters via safety constraints.

  ### 4. What We Refused to Sign
  *   We refused to agree that "The patient's best interests" is a neutral term. PA defines "best interests" as fidelity to critical values; NS defines it as maximization of current well-being. Using the phrase without qualification obscures the disagreement.
  *   We refused to agree that dementia is a "loss of self." PA views it as a *diminishment* of the self; NS views it as a *replacement* of the self. This semantic difference drives the ethical divergence.

  ---
  **Signed:**
  *Representative, Precedent-Autonomy Camp*
  *Representative, Now-Self Camp*
