answer: |-
  **Project Title:** Distributed Causal Accountability: Non-Human Actors and Institutional Exoneration in Environmental History

  **Core Question**
  When historical actors invoke non-human causes—cholera bacteria, volcanic aerosols, climate systems—to explain disaster, does this attribution clarify causal mechanisms or obscure institutional negligence? This project asks: Can we construct a framework of **Distributed Causal Accountability (DCA)** where non-human entities carry real causal weight without canceling human responsibility? I will test whether the distinction between "agency talk" (posthumanism) and "determinist excuse" (exoneration) is conceptually coherent.

  **Intellectual Merit and Gap**
  Current scholarship is polarized. Environmental historians and STS scholars often celebrate non-human "actors" (Latour, Chakrabarty), risking a quietism where humans are no more responsible than viruses. Conversely, critics warn of environmental determinism but treat all non-human causation as suspect. Philosophers of science treat determinism as a monolithic category, while historians of medicine treat miasma and germ theory as separate epistemic errors rather than comparable causal structures. Both miss the functional role of causation: 19th-century doctors blaming weather for cholera were not merely mistaken; they were using non-human causation to excuse institutional failure. There is no existing framework to distinguish legitimate non-human attribution from exonerating determinism.

  **Methodology and Approach**
  Rather than producing another case study or broad critique, this project performs close conceptual analysis of primary descriptions. I will examine how causation is *distributed* in the text itself. The work focuses on the linguistic and logical structure of causal claims in three pairings:
  1.  **Cholera/Microbes:** 19th-century medical reports (miasma vs. germ theory).
  2.  **Tambora/Climate:** Early 19th-century famine reports attributing crop failure to volcanic aerosols.
  3.  **Modern Climate Attribution:** Contemporary reports linking extreme weather to anthropogenic forcing.

  I will analyze English-language medical journals and one standardized climate dataset. The goal is not new archival discovery but re-reading existing digitized sources through the DCA lens.

  **Expected Outcomes and Success Conditions**
  Success is defined as deriving **three conditions** that separate legitimate non-human causal attribution from determinist excuses. For example: (1) Does the attribution identify a specific mechanism? (2) Does it preclude human mitigation? (3) Does it shift resource allocation?
  *   **Success:** The framework holds across cases, distinguishing when volcanic forcing explains famine (legitimate) versus when it excuses grain hoarding (exoneration).
  *   **Failure:** The project demonstrates that the distinction between "agency talk" and "determinist excuse" is impossible or trivial. This is a valid negative result that clarifies the limits of posthumanist history.

  **Scope and Feasibility**
  **Time:** 6 weeks. This is sufficient for conceptual framing and targeted analysis because I am not conducting new archival travel. The work relies on digitized primary sources (e.g., *The Lancet*, British Parliamentary Papers) and existing climate attribution literature.
  **Budget:** $15,000. Funds will support a 6-week research buy-out and a research assistant to compile and tag primary texts for causal language.
  **Risk Management:** Primary reports are scattered. To mitigate this, I will narrow sources to English-language medical journals (1830–1890) and one specific climate dataset (Volcanic Stratospheric Sulfur Injection). This ensures the textual corpus is manageable within the timeline.

  **Conclusion**
  This project moves beyond the stale debate of "humans vs. nature." By isolating the mechanics of accountability, it offers historians and policymakers a tool to recognize when environmental explanation becomes ethical evasion.
