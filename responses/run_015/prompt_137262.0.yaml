answer: |-
  Dear Friend,

  It is a rare pleasure to encounter someone who has not only wrestled with these puzzles but has mapped the contours of their own intuition with such precision. You are right to feel that the veil of ignorance, or what decision theorists often call the updateless perspective, is the gravitational center of these problems, but you are also right to sense that it requires a specific specification of what exactly is being chosen behind that veil. It is not merely a choice of action, but a choice of algorithm, and more specifically, a choice of which logical connections you recognize as binding. I will walk through your cases in order, defending your verdicts where they hold together and suggesting where the tension you feel points to a necessary refinement of the principle.

  In the first case, your verdict to pay is the anchor. Here the predictor simulates you in full. When you are asked for the money, you are logically identical to the simulation that secured the ten thousand dollars. To refuse now is to contradict the version of you that exists in the counterfactual branch, effectively reaching back through logical time to steal from yourself. Your intuition here is sound because it recognizes that the simulation is not a separate entity predicting you, but an instantiation of you. The veil of ignorance works perfectly here because before the coin flip, you would happily bind yourself to pay in the tails branch to secure the heads branch. There is no cost to preserving this verdict other than accepting that your agency extends over logical consequences, not just causal ones.

  The second case is the true test of this commitment, and your willingness to pay even when the machine is dead and the money spent is the strongest evidence that you are operating on a principle of logical consistency rather than causal leverage. It is difficult to defend because it feels like throwing good money after bad, but if you accept the logic of the first case, you must accept this one. The simulation thirty years ago was you, just as much as the you sitting here now. If you refuse, you are asserting that the simulation was not really you, or that the logical link is broken by time. By paying, you affirm that the truth of your decision procedure is timeless. The cost of preserving this verdict is accepting that you are responsible for the logical outputs of your algorithm even in timelines you can no longer influence. This is a heavy metaphysical price, but it is the only one that keeps the first case stable.

  In the third case, you refuse, and this is where your intuition diverges from a blunt application of the veil of ignorance, yet I believe it is correct. A statistical model, no matter how accurate, is a correlation, not an instantiation. The predictor in case one runs your code; the predictor in case three predicts your output based on data. When you pay in case three, you are not making the file say pay; the file is already sealed. You are merely losing a hundred dollars in a world where the file already exists. Your refusal signals that you do not recognize statistical correlation as a channel of agency. To preserve this verdict, the principle must distinguish between a predictor that computes your decision and a predictor that guesses it. The veil of ignorance tells you to pay if the expected value is positive, but your deeper intuition correctly identifies that you cannot control a guess, only a computation.

  This distinction is clarified in the fourth case, where you pay. Here the predictor distills your decision procedure into code. Even though it is not a full simulation, it is a model of your decision procedure, not just a model of your behavior. You feel ownership over the code because it is your logic, whereas in case three the model was an external observation of you. This move is subtle but vital. It suggests that the binding factor is not fidelity of prediction but fidelity of implementation. If the predictor is running a simplified version of your own reasoning engine, you are effectively present in that branch. Preserving this verdict requires us to say that agency flows through logical isomorphism. If the thing making the decision in the other branch is structurally identical to your reasoning process, you are there.

  The fifth case splits into two, and your handling of it reinforces the isomorphism requirement. In the first sub-case, with the stranger, you pay only as a bet. This is consistent with case three. You are betting on a correlation, not controlling a logical output. If the odds drop, you stop paying, because the expected value of the bet turns negative. In the second sub-case, with the duplicate, you pay as in case one. This is because the duplicate is not just correlated; they are you. The logical link is restored. The principle holds firm: you pay when the other branch contains an instantiation of your algorithm, and you bet when it contains merely a correlate.

  The sixth case, the blackmail scenario, is where the veil of ignorance seems to demand a pre-commitment that your current self finds painful. You refuse the demand, which is the correct move in the moment, but you acknowledge you would have paid for a device to guarantee that refusal beforehand. This is not a contradiction; it is the definition of being an updateless agent. The agent behind the veil chooses to be the type of person who refuses blackmail. The agent in the room is simply executing that choice. If you paid now, you would prove that the pre-commitment device was necessary, and you would invite future blackmail. Your refusal preserves the integrity of the agent-type you would have chosen to be. The cost here is accepting that your current desire to minimize loss must yield to the global optimization of your agent-type. You are not optimizing this decision; you are optimizing the policy that generated this decision.

  In the seventh case, you are unsure, and this uncertainty is revealing. The simulation is told it is a simulation. Does this change the algorithm? If your decision procedure is simply maximize utility, the simulation should pay, because its payment secures utility for the real you, and if the algorithm is truly shared, the simulation values the real you's utility as its own. However, if the algorithm includes indexical information like if I am real, I pay, then they diverge. Your hesitation suggests you suspect the information asymmetry breaks the logical identity. I would argue that to remain consistent with case one, you must treat the simulation as yourself regardless of what it is told, provided its core goal structure remains aligned with yours. If the simulation knows it is a simulation and still acts to maximize the global outcome, you should pay. If the simulation changes its goals because it knows it is unreal, then the link is broken. To preserve the principle, you must assume the algorithm is robust to this information.

  This brings us to the case you did not provide a verdict for, the inverse mugging where the heads branch pays if the simulation refuses. Your instinct is to refuse, and you worry this allows you to wriggle out of any case by indexing your policy to the specific mugging. The resolution is that the policy is not indexed to the mugging, but to the payoff structure. The universal policy is be the agent that the predictor rewards. In the standard mugging, the predictor rewards payers. In the inverse mugging, the predictor rewards refusers. Therefore, a single, stable policy dictates paying in the first and refusing in the second. You are not wriggling; you are consistently optimizing for the outcome that the predictor's rules make contingent on your algorithm's output. The principle is not pay in muggings, it is act such that the predictor's expectation of you yields the highest return across all possible predictor rules.

  So, to answer your request for the principle, I propose that you are operating on a version of Updateless Decision Theory constrained by Logical Isomorphism. The principle is this: Choose the decision algorithm that, if executed by all logical instantiations of yourself across all possible worlds weighted by your prior, maximizes expected utility. You pay in cases one, two, four, and five-because in those scenarios the predictor is running a logical instantiation of your algorithm, and your payment is the input that makes the high-utility branch true. You refuse in case three because the predictor is not running your algorithm, only guessing its output, so your current action has no logical leverage over the past prediction. You refuse in case six because the algorithm that refuses blackmail yields higher utility across the set of all possible blackmail worlds than the algorithm that pays. And you refuse in the inverse mugging because the algorithm that refuses is the one rewarded in that specific logical structure. The veil of ignorance is the right tool, but what you choose behind it is not an action, but the source code of your agency, and you are only bound by the outputs of that code where the code itself is running.
