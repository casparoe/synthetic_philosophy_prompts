  I have been attempting to understand Einstein's philosophical commitments regarding determinism, divine necessity, and human agency. I gather that he adhered to a Spinozist vision of God as identical with the rational structure of nature, and that he repeatedly expressed scepticism about libertarian free will, treating it as an illusion generated by our incomplete grasp of causal antecedents. Because he died in 1955, he never encountered several later intellectual currents that bear directly on these questions—particularly the neuroscientific investigation of the readiness potential associated with Libet's experiments in the 1980s, and the cosmological multiverse frameworks that have since complicated traditional notions of cosmic uniqueness and modal necessity.

