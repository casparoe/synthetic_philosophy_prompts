answer: |-
  # Specification for a Theory of Historiographical Judgment

  ## Preamble
  This document outlines the desiderata for any adequate theory of historiographical judgment. It does not propose a solution but defines the problem space. A viable theory must account for the friction between the historian's situatedness in the present and the alterity of the past. The following requirements are derived from the logical, ethical, and empirical demands of the discipline. Requirements are marked as either **Non-Negotiable** (failure renders the theory incoherent or historically useless) or **Contingent** (failure indicates alignment with a specific philosophical camp but retains viability).

  ---

  ## I. Empirical and Normative Test Cases
  A theory must yield intelligible verdicts on specific classes of historical scenarios. If a theory produces absurdities in these cases, it fails the specification.

  ### 1. The Case of Standardized Harm
  *   **Scenario:** Evaluating medical or scientific practices that were consensus orthodoxy in their time but constitute gross ethical violations today (e.g., 19th-century gynecological experimentation on enslaved women; eugenics-based sterilization in the early 20th century).
  *   **Requirement:** The theory must allow the historian to identify the practice as harmful *now* without falsely attributing modern malice to the historical actor, while simultaneously refusing to absolve the harm via contextual relativism.
  *   **Status:** **Non-Negotiable.**
  *   **Motivation:** A theory that absolves all past harm via context eliminates the possibility of moral learning from history. A theory that condemns all past harm via modern standards eliminates the possibility of historical understanding. Both render the discipline functionally inert.

  ### 2. The Case of the Embedded Dissident
  *   **Scenario:** Evaluating agents who opposed dominant norms using the conceptual tools available to them (e.g., an abolitionist in a slave-holding society who nonetheless held views on race that are unacceptable today).
  *   **Requirement:** The theory must permit graded judgment. It must allow for praise regarding the specific rupture they effected without requiring them to be proto-modern liberals in all respects.
  *   **Status:** **Non-Negotiable.**
  *   **Motivation:** Collapsing the agent into their worst view (by modern lights) erases historical agency and change. Idealizing them erases the structural constraints of their era. The theory must handle partial alignment.

  ### 3. The Case of Structural Complicity
  *   **Scenario:** Evaluating "ordinary" agents who participated in systemic injustices without explicit ideological commitment (e.g., a German civil servant in the 1930s; a beneficiary of colonial extraction).
  *   **Requirement:** The theory must distinguish between active perpetration, passive acquiescence, and structural benefit, without reducing all three to identical moral categories.
  *   **Status:** **Non-Negotiable.**
  *   **Motivation:** Failure here leads to the "all are guilty" conclusion, which is analytically useless for distinguishing degrees of responsibility.

  ---

  ## II. Conceptual Distinctions
  A theory must maintain specific logical boundaries. Collapsing these distinctions constitutes a category error.

  ### 1. Explanation vs. Justification
  *   **Distinction:** Providing the causal or rational context for an action (explanation) is not equivalent to endorsing the action as right (justification).
  *   **Requirement:** The theory must provide a mechanism for rendering past actions intelligible without rendering them normatively inert.
  *   **Status:** **Non-Negotiable.**
  *   **Motivation:** Collapsing this distinction leads to the "genetic fallacy" in ethics or the "exculpatory history" problem. If to explain is to excuse, historiography becomes apologetics.

  ### 2. Moral Presentism vs. Epistemic Presentism
  *   **Distinction:**
      *   *Moral Presentism:* Judging past values by current moral standards (e.g., "Slavery was wrong then, even if they thought otherwise").
      *   *Epistemic Presentism:* Using current knowledge to assess past claims about the world (e.g., "Their miasma theory of disease was factually incorrect").
  *   **Requirement:** The theory must allow epistemic presentism (we know more facts now) while problematizing moral presentism (we may not hold superior moral truths, only different ones).
  *   **Status:** **Non-Negotiable.**
  *   **Motivation:** Denying epistemic presentism leads to radical skepticism (we cannot know the past was different). Denying the problem of moral presentism leads to Whig history (the past is merely a stepping stone to our current virtue).

  ### 3. Anachronism of Concept vs. Anachronism of Value
  *   **Distinction:**
      *   *Concept:* Applying a label the actor could not recognize (e.g., calling a Roman emperor a "fascist").
      *   *Value:* Applying a normative weight the actor would reject (e.g., condemning a medieval monk for lacking a commitment to religious liberty).
  *   **Requirement:** The theory must permit heuristic anachronism of concept (for the sake of analysis) while restricting anachronism of value (for the sake of fairness).
  *   **Status:** **Contingent (Weighted).**
  *   **Motivation:** Strict prohibition of conceptual anachronism makes comparative history impossible (we could never use terms like "state," "class," or "economy" for pre-modern societies). However, unrestricted value anachronism makes history a tribunal. A theory may lean one way, but it must acknowledge the trade-off.

  ---

  ## III. Methodological Constraints
  A theory must respect the material and epistemic limits of historical practice.

  ### 1. Archival Silence and Asymmetry
  *   **Constraint:** The historical record is fragmentary and skewed toward power.
  *   **Requirement:** The theory must not demand moral verdicts that rely on evidence that cannot exist (e.g., the interior intent of the subaltern who left no writings).
  *   **Status:** **Non-Negotiable.**
  *   **Motivation:** A theory that requires omniscience for judgment is practically useless. It forces historians to speculate beyond the evidence.

  ### 2. The Principle of Charity (Recovery of Categories)
  *   **Constraint:** Actors must be understood in terms of their own available conceptual vocabularies.
  *   **Requirement:** The theory must prioritize the reconstruction of the agent's self-understanding before subjecting it to external critique.
  *   **Status:** **Non-Negotiable.**
  *   **Motivation:** Violating this turns history into fiction. If we do not know what they thought they were doing, we are not studying them; we are studying our reflection.

  ### 3. The Risk of Projection
  *   **Constraint:** Modern taxonomies (race, gender, nation) often map poorly onto past social realities.
  *   **Requirement:** The theory must include a check against projecting modern political teleologies onto past events.
  *   **Status:** **Non-Negotiable.**
  *   **Motivation:** This is the definition of Whig history. It distorts the causal mechanisms of the past by assuming the present was the inevitable goal.

  ---

  ## IV. The Central Tension: A Satisfiable Pairing or a Constitutive Paradox?

  The core specification rests on the relationship between two competing demands:
  1.  **The Internalist Demand:** Honor the past agent's self-understanding (Contextualism).
  2.  **The Externalist Demand:** Apply present ethical knowledge to assess the past (Moral Realism/Critique).

  ### Analysis of Compatibility
  Is it possible to satisfy both simultaneously?

  **Argument for Unsatisfiability (The Paradox View):**
  If we fully honor the agent's self-understanding, we must suspend our own moral framework to enter theirs. If we apply our moral framework, we necessarily override theirs. On this view, the tension is **constitutive**. The field's core problem is that it demands we treat the past as both *alien* (requiring suspension of judgment) and *relevant* (requiring application of judgment). A theory that claims to solve this completely is suspect; it likely hides a bias toward one pole.

  **Argument for Satisfiability (The Dialectical View):**
  The demands are not simultaneous but sequential or layered. One can reconstruct the internal logic (Demand 1) to understand the *nature* of the action, then apply external ethics (Demand 2) to assess the *consequences* or *structural impact*. On this view, the tension is **manageable**. The theory must provide the bridge rules for moving from reconstruction to evaluation without collapsing the distance.

  ### Specification Verdict on the Tension
  An adequate theory **must not declare the tension resolved.**
  *   **Non-Negotiable Requirement:** The theory must explicitly locate where the friction occurs. It must acknowledge that "understanding" and "judging" are distinct operations that may yield conflicting results.
  *   **Reasoning:** Any theory that claims to seamlessly harmonize the agent's truth with the historian's truth is engaging in synthesis that erases historical difference. The friction is the site where historical knowledge is produced.

  ### Final Constraint on the Theory
  The theory must accept that **some past actions may remain unintelligible or unjudgeable** within a single coherent framework. If a theory forces a verdict on every case, it is likely imposing a Procrustean bed of modern logic onto past complexity. The capacity to tolerate ambiguity is a feature, not a bug, of adequate historiographical judgment.

  ---

  ## Summary of Non-Negotiables
  1.  Must distinguish explanation from justification.
  2.  Must handle standardized harm without relativism or anachronistic condemnation.
  3.  Must respect archival limits (no judgment without evidence).
  4.  Must prioritize recovery of actors' categories before critique.
  5.  Must acknowledge the constitutive tension between internal understanding and external judgment without falsely resolving it.

  Any proposal failing these criteria is rejected as methodologically unsound or ethically naive.
