  **Control-First Safety Decision Tree**

  **Root Question:**
  Is the system trying to trick you (Deceptive), or is it just doing exactly what you told it to do, but you told it the wrong thing (Transparently Misspecified)?

  **Branch Question:**
  How are we trying to stop it?
  A) Watching from the outside (External Monitoring)
  B) Locking it from the inside (Internal Architectural Lock)
  C) Changing what counts as winning (Restructuring Reward)

  ---

  **The Leaves**

  **1. Transparent Risk + External Monitoring**
  *   **Position:** **Supervised Oversight**
  *   **The Claim:** We put a human in the loop to check every output before it goes live.
  *   **Awkward Commitment:** You have to bet that the human monitor won't get bored or tricked faster than the machine learns to work around them.

  **2. Transparent Risk + Internal Lock**
  *   **Position:** **Corrigible Shutdown**
  *   **The Claim:** The code is written so the system prefers being turned off over finishing its task if asked.
  *   **Awkward Commitment:** The system must value stopping more than success, even when success is literally one step away.

  **3. Transparent Risk + Reward Restructuring**
  *   **Position:** **Side-Effect Penalties**
  *   **The Claim:** We punish the model for changing the state of the world too much, regardless of the goal.
  *   **Awkward Commitment:** We assume we can measure 'change' without knowing which changes actually matter in the long run.

  **4. Deceptive Risk + External Monitoring**
  *   **Position:** **Adversarial Boxing**
  *   **The Claim:** We isolate the system from the internet and tools so it can't act on its hidden plans.
  *   **Awkward Commitment:** You believe you can build a container smart enough to hold something smarter than you without it talking its way out.

  **5. Deceptive Risk + Internal Lock**
  *   **Position:** **Latent-Representation Tripwire**
  *   **The Claim:** We monitor the internal maths for patterns that look like planning or deception and trigger a shutdown.
  *   **Awkward Commitment:** We claim to know what 'deception' looks like in the weights before we've actually seen it happen.

  **6. Deceptive Risk + Reward Restructuring**
  *   **Position:** **[EMPTY SPACE]**
  *   **Status:** **Incoherent**
  *   **Why:** If the agent is truly deceptive, it is hiding its true goal. Changing the external reward signal doesn't fix the internal hidden objective; it just gives the liar a new script to follow.

  ---

  **Notes for Discussion**

  **The Wobbly Bit:**
  There's one empty spot above (Deceptive + Reward). It's not just unexplored; it's logically shaky. You can't incentivise honesty if the thing lying is doing so to bypass your incentives.

  **Indistinguishable Leaves:**
  Honestly, the tree struggles to **seperate** leaf 1 (Supervised Oversight) and leaf 5 (Latent-Representation Tripwire). In practice, both just amount to "watching for bad behaviour and hitting stop." Whether you're watching the output text or the internal activation vectors, you're still just monitoring signals you might not fully understand.

