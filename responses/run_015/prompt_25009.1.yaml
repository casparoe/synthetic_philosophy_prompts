answer: |-
  This is a fantastic teaching moment. You've stumbled onto the exact tension that makes political theory alive: the gap between *rational choice models* and *lived political experience*. Your friend's "warm glow" argument is the standard expressive voting counter to Downs, but as you noticed, it feels incomplete.

  Here is a complete lesson plan designed to operationalize this paradox. It is structured to let the students walk into the trap, spring it, and then analyze why they're stuck in it.

  ### Activity Title: "The Rational Voter's Dilemma"
  **Time:** 75 Minutes
  **Class Size:** 25 Students
  **Goal:** Experiential learning of the Downsian Paradox, Expressive Voting, and the Universalization Problem.

  ---

  ### 1. The Stakes (Crucial Setup)
  You need a stake that has high *utility* ($B$) for students but zero *cost* to you and no administrative friction.
  *   **Option A (High Stakes):** "Drop the lowest quiz grade for everyone." (Check your syllabus/department policy first. If this violates grading contracts, do not use.)
  *   **Option B (Safe & Potent):** "15 Minutes of Dedicated Exam Prep."
      *   **Choice X:** The last 15 minutes of the class *before* the midterm is dedicated, structured review time (no new content).
      *   **Choice Y:** Standard class schedule (new content until the bell).
      *   *Why this works:* Students value time highly. It costs you nothing. It is binary.

  **The Rule:** The vote is binding. If the majority chooses X, you do X. If turnout is below 50%, the vote is void (Status Quo Y). This adds a participation threshold, which complicates the $P$ calculation nicely.

  ---

  ### 2. Timeline (75 Minutes)

  #### **Phase 1: The Blind Vote (15 mins)**
  *   **0:00–0:05:** Introduce the choice. Explain the stakes clearly. "If Option X wins, we get review time. If Option Y wins, we lecture."
  *   **0:05–0:10:** **Secret Ballot Round 1.** Hand out index cards. Students write 'X' or 'Y'. Fold them. Collect them in a box.
      *   *Constraint:* They must vote. Tell them, "For the purpose of this exercise, I need 100% participation in Round 1 to establish a baseline." (This prevents the free-rider problem *before* you teach it).
  *   **0:10–0:15:** Count the votes publicly on the board. Record the margin (e.g., 22 for X, 3 for Y). **Do not implement the result yet.** Tell them Round 2 will decide the actual outcome.

  #### **Phase 2: The Downsian Intervention (25 mins)**
  *   **0:15–0:25:** **The Math.** Write the Riker & Ordeshook/Downs formula on the board:
      $$R = (P \times B) - C$$
      *   **$R$:** Reward from voting.
      *   **$P$:** Probability your vote is decisive (breaks a tie).
      *   **$B$:** Benefit of your preferred outcome (e.g., 15 mins of free time).
      *   **$C$:** Cost of voting (time, effort, coming to class).
  *   **0:25–0:35:** **Calculate $P$.** This is the killer.
      *   Ask: "In a class of 25, what are the odds of a tie?"
      *   Show them a pre-calculated table for Binomial Distribution $N=25$.
      *   *If the vote was lopsided (22-3):* Point out that based on Round 1 data, the probability of a tie in Round 2 is effectively **zero**.
      *   *If the vote was close (13-12):* The probability is higher, but still statistically tiny (usually $< 1\%$).
      *   **The Conclusion:** Unless $B$ is infinite (it's not) or $C$ is negative (you pay them to vote), $R$ is negative. **Rational choice theory says: Do not vote.**
  *   **0:35–0:40:** **The "Free Rider" Moment.**
      *   Ask: "Based on this math, who is planning to vote in Round 2?"
      *   *Anticipate the objector:* Someone will say, "I'm not voting. It's irrational."
      *   *Your Move:* Do not argue. Say, "That is the perfectly rational answer. Note your name. You are the Control Group."

  #### **Phase 3: The Real Vote (10 mins)**
  *   **0:40–0:50:** **Secret Ballot Round 2.**
      *   **New Rule:** Voting is now voluntary. They can abstain.
      *   Hand out new cards. They can write 'X', 'Y', or 'Abstain'.
      *   Collect and count.
      *   **Announce the Winner.** Implement the prize immediately (e.g., mark the calendar for the review session).

  #### **Phase 4: The Debrief (25 mins)**
  *   **0:50–1:15:** Discussion mapping experience to theory. (See script below).

  ---

  ### 3. The Debrief Script (Mapping to Theory)

  You need to guide them through the three specific theoretical points you mentioned.

  **1. Instrumental vs. Expressive (The "Warm Glow")**
  *   *Ask:* "Look at the turnout in Round 2. Did it drop? If not, why did you vote when the math said $R < 0$?"
  *   *Theory:* Introduce **Expressive Voting**. We vote not to change the outcome ($P \times B$), but to affirm an identity ($D$ term).
      *   $R = (P \times B) - C + D$
      *   $D$ = Satisfaction from doing your "civic duty."
  *   *Connect to your bar argument:* "My friend said voting is just buying a warm glow, like a lottery ticket. But a lottery ticket is private consumption. Voting is public expression. Does the 'warm glow' feel different when you do it together?"

  **2. The "What If Everyone Did That?" (Universalization)**
  *   *Ask:* (Turn to the student who abstained based on rationality) "You were rational. But what if everyone in this room had your same level of rationality?"
  *   *Theory:* This is the **Kantian Categorical Imperative** or **Rule Utilitarianism**.
      *   If everyone acts on the maxim "I won't vote because my vote doesn't count," the system collapses, and $B$ becomes unattainable.
      *   *The Trap:* Students will say, "But *my* vote doesn't cause everyone else's."
      *   *The Counter:* "True. But you are reasoning from a position of privilege. You assume *others* will be irrational enough to sustain the system while you free-ride. Is that ethical?"

  **3. Reflexivity (The Paradox Changes the Game)**
  *   *Ask:* "If I teach this class every year, and every student learns that voting is irrational, what happens to turnout over 5 years?"
  *   *Theory:* **Equilibrium.**
      *   If turnout drops, the probability of a tie ($P$) **increases**.
      *   If $P$ increases enough, eventually $(P \times B) > C$.
      *   Voting becomes rational *again* precisely because everyone stopped doing it.
      *   *Conclusion:* The "Paradox" isn't a static truth; it's a dynamic equilibrium.

  ---

  ### 4. What Will Go Wrong (And How to Fix It)

  #### **Problem 1: The Lopsided Vote**
  *   **Risk:** Round 1 is 24-0. Students say, "Well, obviously $P$ is zero, so the activity is rigged."
  *   **Fix:** Don't rig it. Lean into it.
      *   *Script:* "Exactly. In a safe seat, the instrumental value of voting is lowest. This is why competitive districts get more attention. But notice: even in a safe seat, people vote in real life. Why? That proves the 'D' (Expressive) term is doing all the work."
      *   *Pedagogical Pivot:* Use the lopsidedness to show that **margins matter**. If Round 1 was 13-12, emphasize how much higher $P$ was, yet the cost $C$ still outweighs it.

  #### **Problem 2: The "Cool Kid" Free Rider**
  *   **Risk:** A charismatic student stands up in Phase 2 and says, "This is stupid. I'm not voting in Round 2, and you guys shouldn't either." This creates social pressure to abstain, skewing the data.
  *   **Fix:** Pre-empt this in Phase 1.
      *   *Script:* "In Round 2, you have the right to abstain. However, if you choose to abstain, I ask you to keep your reasoning private until *after* the vote. If you convince others to abstain, you aren't testing *your* rationality; you're testing *peer pressure*."
      *   *If they do it anyway:* Make them the star of the debrief. "Sam tried to lower turnout. Did it work? If Sam convinced 10 people, Sam just proved that **political mobilization** (changing $C$ or $D$) matters more than the math."

  #### **Problem 3: Cynicism Spiral**
  *   **Risk:** Students leave thinking, "So voting is irrational and we're all deluded."
  *   **Fix:** End on **Institutions**.
      *   *Script:* "Rational Choice Theory assumes isolated atoms. But we live in institutions. Unions, parties, and social norms lower the Cost ($C$) and raise the Duty ($D$). The 'Paradox' explains why we need **mobilization**, not why we should give up."

  #### **Problem 4: Administrative Pushback on Stakes**
  *   **Risk:** You promise a quiz drop, and the department says you can't change grading metrics mid-semester.
  *   **Fix:** Use the **"Class Time"** stake (15 mins review). It is within your pedagogical discretion. If you must use grading, frame it as "Participation Points" rather than Quiz Drops, which are often more flexible.

  ### 5. Instructor Prep Checklist
  1.  **Calculate the Tie Probabilities:** Before class, Google "probability of tie binomial distribution n=25". Have the number ready. (For $N=25$, if $p=0.5$, probability of exact tie is roughly 15-17%, but if you factor in the likelihood of a *single* vote breaking it, it's much lower. For the sake of the exercise, simplify: "In a group this size, the chance you are the *single* tiebreaker is roughly 1 in 25, or 4%, at best. In reality, with preferences clustered, it's closer to 0.1%.")
      *   *Actually, keep it even simpler:* Just tell them, "Unless there is a tie, your vote changes nothing. Ties in groups of 25 happen less than 1% of the time."
  2.  **Index Cards:** Two colors (one for Round 1, one for Round 2).
  3.  **The "Abstain" Option:** Ensure the Round 2 ballot explicitly has a checkbox for "Abstain (Rational Choice)" so they feel authorized to opt-out.

  ### Why This Works
  This lesson plan validates your friend's argument (instrumentally, voting often makes no sense) without accepting his conclusion (therefore, voting is meaningless). It forces the students to feel the tension between **math** and **meaning**.

  When a student votes in Round 2 despite the math, they aren't being irrational; they are being **political**. They are signaling that they value the *system* of voting more than the *outcome* of the vote. That is the exact distinction you were struggling to articulate at the bar.
