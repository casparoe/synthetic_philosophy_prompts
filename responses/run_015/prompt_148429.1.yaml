      *   *Nuance:* Is it "logically self-defeating" or is it an argument about the *limits* of prediction? Popper calls it a "refutation" of historicism's claim to scientific status regarding prophecy. "Impossible in principle" is strong but fits Popper's rhetoric on *historical destiny*.
