  5.  **Refining the Output (Checking Constraints):**
      *   *Constraint:* Don't signal my own view on whether generations are real.
      *   *Check:* Ensure I don't say "Generations ARE real, so you're wrong." Instead, say "Sociological debate exists on this, your claim that Ryder *proves* they aren't is too strong."
      *   *Constraint:* Point-by-point comments.
