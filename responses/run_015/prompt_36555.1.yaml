      *   **Layer 2: Conceptual/Metaphysical (The Nature of Subjects).** This is the hidden substantive issue. The critic's intuition is that subjects are *essentially* unified and cannot be composed. The panpsychist intuition is that subjects are *contingently* unified and can be composed (like physical objects). This is a clash of modal intuitions.
