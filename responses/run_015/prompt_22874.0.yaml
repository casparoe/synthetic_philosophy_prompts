      *   *On "Machines Can Think":* This reinforces his view. If humans are just using clever heuristics (approximate algorithms), then machines can be built to do the same. If humans *were* using non-computable processes, it might challenge the strong AI view, but Turing was pragmatic. He cared about behavior (Imitation Game), not internal ontology.

