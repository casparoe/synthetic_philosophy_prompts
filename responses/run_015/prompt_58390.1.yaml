          *   *Idea 6 (Final Choice): The "Bug Bash" Entry.*
          *   *Scenario:* To enter a raffle for a nice dinner voucher (Reward) today, you must register today that you will participate in a 2-hour bug bash tomorrow evening (Cost). Registration is via a public Slack channel. The voucher is drawn immediately among registrants. Tomorrow, the bug bash is tedious. There is no formal penalty for not showing up (no HR record), but you said you would.
          *   *Critique:* Social pressure is a penalty.
          *   *Idea 7 (The "Sandbox Access" Case):*
