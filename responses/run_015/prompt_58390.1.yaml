          *   *Critique:* Too easy to argue that reputation loss is a penalty for backing out. The "mechanism" (public promise) creates external social enforcement, violating spec 3 (no further penalty beyond original inconvenience). It collapses into ordinary promise-keeping.

      *   *Idea 2: The Stand-Up Commitment.* A team lead offers a gift card if you state at Monday stand-up you'll refactor a module by Wednesday. The lead checks the commit log Wednesday. If you stated intent but didn't refactor, you keep the gift card (no penalty), but refactoring is tedious.
          *   *Critique:* Why would the lead give the gift card without verification? If they verify Wednesday, they might penalize you then. If they don't penalize, why did they offer it? Needs a mechanism where the reward is decoupled from the action *after* the intention is formed. The "perfect predictor" issue in Kavka is about knowing the intention *now* based on future action. In a workplace, a manager usually conditions reward on *completion*, not *intention*. I need a scenario where the reward is triggered by the *formation of intention* (or credible signal thereof) before the action is possible.

      *   *Idea 3: The "Draft Review" Token.* To get a priority code review token (reward) today, you must commit in the project tracker that you will review a junior's complex PR tomorrow morning. The token is granted instantly upon commitment logging. Tomorrow, reviewing the PR is tedious (cost). Once you have the token, reviewing the PR offers no further benefit, and there's no penalty for skipping the review other than the wasted effort of having planned for it.
