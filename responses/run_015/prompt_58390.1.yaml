          *   *Credibility:* The log is visible to the platform team, but they are overloaded and won't chase you. It's credible because you are known as reliable, but the system doesn't enforce it.
          *   *Fit:* This fits Spec 3 best. Automated log, immediate reward, no enforcement mechanism for the follow-through, cost is purely effort.

