  Based on the six precedents, here is the reconstruction of the investigator's decision rule, the prediction for the new referral, and the analysis of her underlying philosophy.

  ### Candidate Rules

  Three rules fit the six precedents, but they diverge on the new referral.

  **1. The Personal Enrichment Rule**
  *   **Definition:** Corruption is found when an officeholder (or their immediate proxy/family) receives a tangible, contemporaneous personal benefit linked to their role. Institutional benefits, past benefits, or general political support do not count.
  *   **Fit:** Explains Cases 1, 2, 3 (Corrupt: Nephew, Cash, Tribute) vs. Cases 4, 5, 6 (Cleared: Association, Past Client, Political Party). Case 4 is key here: guidelines were distorted, but because no *officeholder* was enriched, it was cleared.
  *   **Prediction for New Case:** **Corrupt.** Although the referral claims "no individual official receives anything of value," Case 1 establishes that benefits to family (Nephew) count as benefits to the official. Scholarships for staff children are personal family enrichment, regardless of the "outside committee" administration. The "long local history" (like Case 3's cultural tribute) explains but does not excuse the personal gain.

  **2. The Transactional Distortion Rule**
  *   **Definition:** Corruption is found only when there is evidence that the benefit specifically distorted a discretionary decision (a *quid pro quo*). General support or benefits without proof of skewed outcomes are not corruption.
  *   **Fit:** Explains Cases 1, 2, 3 (Corrupt: Contract awarded, Variation approved, Projects steered) vs. Cases 5, 6 (Cleared: Project ranked first, No tender distortion). Case 4 is a weak fit (guidelines were favored), but can be explained by the lack of a specific *official* decision-maker.
  *   **Prediction for New Case:** **Cleared.** The referral explicitly states "no evidence that contributing... ever affected an award." Without proof of a specific *quid pro quo* or distorted outcome, the practice is merely a conflict of interest, not corruption.

  **3. The Formal Compliance Rule**
  *   **Definition:** Corruption is found when an official violates specific disclosure or recusal rules. If the practice is disclosed or falls outside written recusal prohibitions, it is cleared.
  *   **Fit:** Explains Cases 5, 6 (Cleared: Disclosed/Lawful) vs. Cases 1, 2 (Corrupt: Undisclosed/Bribe). Case 3 is the stress test: the Chief's obligation was culturally "disclosed" (known), yet still corrupt. This suggests disclosure alone is insufficient if the underlying benefit is prohibited.
  *   **Prediction for New Case:** **Cleared.** The practice is "disclosed in the annual report" and has a "long local history," implying it is an accepted, reported practice. Unless there is a specific written rule banning scholarships (not stated), compliance suggests clearance.

  ### The Rule She Is Running

  She is running **The Personal Enrichment Rule**.

  **Why:**
  1.  **Case 4 is the Anchor:** In Case 4, the outcome *was* distorted (guidelines favored the donor), yet the case was cleared. This decisively rules out "Transaction Distortion" as a sufficient condition. Distortion without personal enrichment is not corruption in her book.
  2.  **Case 3 is the Shield:** In Case 3, the Chief argued cultural obligation (a form of systemic/compliance defense). She ruled it "could explain... but not excuse." This neutralizes the "Formal Compliance/Local History" defense in the new referral. Disclosure and tradition do not cure personal enrichment.
  3.  **Case 1 is the Key:** The "Nephew" precedent establishes that the definition of "Official Enrichment" extends to immediate family/proxies. This defeats the new referral's technical defense that "no individual official receives anything of value." To her, a scholarship for a child is economically indistinguishable from a retainer for a nephew.

  **Prediction:** She will find **Corruption**. She will pierce the "outside committee" veil, treating the scholarships as direct personal enrichment of the procurement staff, rendering them compromised regardless of the lack of evidence regarding specific award distortion.

  ### The Object of Corruption

  Her rule treats **the Officeholder (specifically their financial independence)** as the object of corruption, rather than the transaction, the relationship, or the system.

  *   **Not the System:** Case 6 (Political Donation) and Case 4 (Guidelines) show that systemic distortion or unfair advantages are tolerated if the officeholder's pocket is untouched.
  *   **Not the Transaction:** Case 5 (Former Client) shows that a potentially compromising relationship is tolerated if there is no *current* financial flow.
  *   **Not the Relationship:** Case 3 shows that even culturally embedded relationships are corrupt if they monetize the office.

  She is protecting the **purity of the officeholder's economic position**. If the official (or their kin) profits from their position, the office is corrupted, even if the bank loses no money (Case 4) and the tender is fair (Case 6). The two clearances (4 and 6) do the heavy lifting here: they prove that "fair outcomes" do not excuse "unclean hands," but "unclean hands" (personal gain) are the only thing that constitutes corruption.

  ### The Separating Test Case

  To definitively separate **The Personal Enrichment Rule** (Purity of the Person) from a stricter **Conflict of Interest Rule** (Purity of the Decision), propose this case:

  **The Recused Official:**
  *A procurement specialist receives the same child scholarship from a contractor. However, upon learning the contractor is bidding, the official formally recuses themselves from the evaluation panel. The contract is awarded to a different firm based on merit.*

  *   **If she finds Corruption:** She is running a **Purity of the Person** rule. The mere receipt of the benefit corrupts the officeholder, regardless of whether they exercised discretion. (This aligns with Case 1 & 3).
  *   **If she finds Cleared:** She is running a **Purity of the Decision** rule. The corruption lies in the *exercise* of compromised discretion, not the *state* of being compromised. (This would align with Case 5, where following rules cleared the official).

  Given Case 3 (where the Chief's "standing" was the issue, not just the steering), I suspect she would find **Corruption**, confirming that the object is the officeholder's independence, not just the transaction's integrity.
