      *   *Source Code:* DNA sequence (A, C, G, T).
      *   *Compiler:* Transcription/Translation machinery (RNA Pol, Ribosome).
      *   *Runtime Environment:* The Cell (cytoplasm, organelles, metabolites).
      *   *Bugs:* Mutations/Polymorphisms.
