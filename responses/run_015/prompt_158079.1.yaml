      *   **Tone:** Casual, no references, practical.

  2.  **Deconstruct the Theory (Mental Sandbox):**
      *   *Classic CJT:* If $p > 0.5$ (competence) and voters are independent, large $N$ guarantees correctness.
      *   *Real World:* $p$ varies, independence is broken (correlation $\rho > 0$), discussion creates herding.
      *   *Implication:* If correlation is high, adding more people doesn't help much (error doesn't average out). If competence is low, large numbers just amplify noise. If stakes are high/technical, expertise matters more than aggregation.
      *   *The "Rule":* Needs to threshold these variables to tip the scale.

