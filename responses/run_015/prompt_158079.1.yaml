answer: |-
  Here is the **Correlated-Competence Jury Rule (CCJR)**. It's designed to be run by a program manager or senior staffer in about 15 minutes. It adapts the Condorcet logic for the messy reality where people talk, influencers exist, and not everyone knows what a load-bearing wall is.

  ### The CCJR Checklist

  Grab a whiteboard. Go through these four steps in order. If you hit a "Stop" condition, make the call and move to the session design.

  **Step 1: Check Independence Decay**
  *How much has the "information environment" already collapsed the diversity of thought?*
  *   **Ask:** Has there been heavy media coverage, strong partisan framing, or a long public comment period already? Are people walking in with fixed opinions rather than open questions?
  *   **Low Decay:** People haven't heard much; opinions are fresh and uncorrelated.
  *   **High Decay:** Everyone has heard the same three talking points; opinions are highly correlated.
  *   **The Rule:** If **High Decay**, the "wisdom of crowds" math breaks because errors are correlated. Adding more people just adds more of the same bias.
      *   *If High Decay:* Lean **Small Panel** (easier to debias with facilitation) OR **Punt**.
      *   *If Low Decay:* Continue to Step 2.

  **Step 2: Estimate Competence Spread**
  *Without testing, guess the average voter's ability to identify the "correct" answer.*
  *   **Ask:** Does this require specialized knowledge (engineering, law, finance) or is it about lived experience (comfort, safety, preference)?
  *   **High Competence (for laypeople):** The average person can judge this reliably ($p > 0.5$). Example: "Is this park safe?"
  *   **Low Competence (for laypeople):** The average person is guessing ($p \approx 0.5$ or lower). Example: "Which pipe alloy resists corrosion?"
  *   **The Rule:** CJT only works if average competence is above chance.
      *   *If Low Competence:* **Small Panel** (experts only).
      *   *If High Competence:* Continue to Step 3.

  **Step 3: Assess Stakes of Being Wrong**
  *What happens if the group picks the inferior option?*
  *   **Ask:** Is the error reversible? Is there a risk of physical harm or massive financial loss?
  *   **Low Stakes:** Reversible, low cost, low risk.
  *   **High Stakes:** Irreversible, high cost, safety risk.
  *   **The Rule:** Large pools provide legitimacy, but Small Panels provide accountability and depth.
      *   *If High Stakes + Low Competence (from Step 2):* **Small Panel**.
      *   *If Low Stakes:* Continue to Step 4.

  **Step 4: Check for Strategic Voting**
  *Do participants have an incentive to lie about their preferences?*
  *   **Ask:** Is there a clear winner/loser dynamic where gaming the system benefits a specific group? (e.g., NIMBYism, vendor lobbying).
  *   **Low Strategy:** People generally want the best outcome for the city.
  *   **High Strategy:** People benefit personally by voting insincerely or blocking progress.
  *   **The Rule:** Large pools are harder to police for bad-faith actors. Small panels can be vetted and bound by confidentiality.
      *   *If High Strategy:* **Small Panel**.
      *   *If Low Strategy:* **Large Pool**.

  **The "Punt" Condition (Values vs. Facts)**
  At any step, if the question is clearly about **trade-offs between values** (e.g., "Equity vs. Efficiency" or "History vs. Growth") rather than finding a correct solution, stop.
  *   **Output:** **Punt to Human.** (This requires elected officials or a hybrid model, not a jury theorem application).

  ***

  ### Applying the CCJR to Your Three Cases

  Here is how your staff should run this tomorrow morning.

  #### Case 1: Routing a Bike Lane Through a Residential Neighborhood
  *   **Step 1 (Independence):** **Low Decay.** Neighbors have opinions, but they haven't been bombarded by national media. Local correlation exists but isn't total. *Continue.*
  *   **Step 2 (Competence):** **High.** Residents are experts on their own street safety and traffic flow. They don't need civil engineering degrees to know where kids play. *Continue.*
  *   **Step 3 (Stakes):** **Low/Medium.** If the lane is in the wrong spot, you can move the paint. It's not irreversible. *Continue.*
  *   **Step 4 (Strategy):** **Medium.** Some NIMBYism, but generally people want safety.
  *   **CCJR Output:** **Use the Large Pool.**
  *   **Why:** Legitimacy is the bottleneck here, not technical accuracy. You need the neighbors to own the decision so they don't sue later. The "crowd" knows the street better than a panel of planners.

  #### Case 2: Changing Zoning Near an Old Factory Site
  *   **Step 1 (Independence):** **Medium/High.** Developers have been lobbying; local press is running stories about "growth vs. character."
  *   **Step 2 (Competence):** **Mixed.** Requires understanding environmental remediation (technical) and community density goals (values).
  *   **Step 3 (Stakes):** **High.** Long-term impact on housing supply and tax base.
  *   **The Pivot:** This triggers the **Punt Condition**.
  *   **CCJR Output:** **Punt to Human.**
  *   **Why:** This isn't a "correct answer" problem. It's a values conflict (Density vs. Preservation). The CJT assumes there is a truth to find. Here, the "truth" is political. Send this to the City Council with input from both a small technical panel and a large town hall, but don't pretend a jury theorem solves value wars.

  #### Case 3: Picking a Contractor for Hidden Water-Main Repairs
  *   **Context:** The Mayor wants a popular vote to show "transparency," but the work is underground and technical.
  *   **Step 1 (Independence):** **High Decay.** The Mayor is already pushing a narrative about "saving money." The public discourse is framed. *Lean Small Panel.*
  *   **Step 2 (Competence):** **Very Low.** Citizens cannot assess pipe tensile strength or bid rigging risks. Average competence is basically chance.
  *   **Step 3 (Stakes):** **Very High.** If the pipe bursts, the neighborhood floods. Catastrophic failure risk.
  *   **Step 4 (Strategy):** **High.** The Mayor is incentivized to pick the cheap/popular option over the safe option. Contractors may lobby.
  *   **CCJR Output:** **Use the Small Panel.**
  *   **Why:** This overrides the Mayor. Step 2 kills the large pool immediately (laypeople can't judge technical bids), and Step 3 confirms the risk is too high for a popularity contest. You need three independent engineers, not 300 residents. Tell the Mayor the math says a popular vote increases the risk of infrastructure failure.

  ***

  ### What This Procedure Can't Handle (The Fine Print)

  Be honest with your team: this checklist is a heuristic, not a law of physics. Here are the blind spots:

  1.  **Negative Correlation of Bias:** The CCJR assumes experts are neutral and laypeople are noisy. Sometimes the opposite is true. If the "experts" are all from one firm with a conflict of interest, and the "public" is broadly skeptical, the large pool might actually be more accurate. The checklist doesn't catch captured expertise well.
  2.  **The "Competence" Guess:** Step 2 is the weakest link. We are guessing competence without testing. If you guess wrong and think residents understand zoning law when they don't, you'll authorize a large pool that makes a disasterous decision with high confidence.
  3.  **Group Polarization:** The checklist assumes discussion *decays* independence. But sometimes discussion *improves* competence (deliberative polling). If you have world-class facilitators, a large pool can overcome high independence decay. The CCJR assumes average facilitation, not perfect facilitation.
  4.  **Judgment Calls Dressed as Steps:** Step 1 (Independence) and Step 4 (Strategy) are subjective. Two staff members might rate the "Mayor's influence" differently. That's not a bug, it's a feature—it forces you to argue about the political reality before you design the room.

  Use the CCJR to start the argument, not end it. If the checklist says "Large Pool" but your gut says "This is too technical," trust the gut and move to a Small Panel. The math is only as good as the inputs.
