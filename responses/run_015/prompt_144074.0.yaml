answer: |-
  The worry that recursive idealization triggers a vicious infinite regress is a structural objection to indirect normativity (e.g., ideal advisor theories, full-information accounts). The core question is whether the recursion prevents the theory from identifying a unique verdict, thereby rendering it useless for actual decision-making.

  Here is an analysis of the implications, focusing on fixed-point stability and the distinction between criteria of rightness and decision procedures.

  ### 1. The Regress is a Fixed-Point Problem, Not an Infinite Loop
  The fear of an infinite loop assumes that idealization is a *process* the agent must sequentially complete (Step 1: Idealize; Step 2: Idealize the idealization; etc.). However, in formal normative theory, recursive idealization is typically defined as a **limit state**, not a temporal sequence.

  *   **The Mathematical Analogy:** Think of the ideal self not as a agent running a simulation of another agent, but as the value $x$ in the equation $x = f(x)$. You are looking for a **fixed point** where further reflection yields no change in preference or judgment.
  *   **Implication:** The loop does not break the theory unless the function is **divergent**. If your preferences oscillate endlessly as you gain more information or reasoning power (e.g., you prefer A over B with info $I_1$, but B over A with info $I_2$, ad infinitum), then no fixed point exists.
  *   **Verdict:** The recursion itself is not fatal. The fatal flaw is **preference instability**. If your psychology is such that there is no stable state of reflective equilibrium, then the "ideal self" is undefined. In hard choices, this implies there may be *no fact of the matter* about what you should do, rather than a fact you cannot access.

  ### 2. Criterion of Rightness vs. Decision Procedure
  Your concern about being "tired or biased" highlights the gap between what makes an act right (the criterion) and how you figure it out (the procedure).

  *   **The Loop Breaks the Procedure:** You literally cannot run recursive idealization when tired. You cannot simulate a version of yourself that is not tired simulating a version of itself that is not tired. If indirect normativity claims to be a *decision procedure*, the recursion makes it computationally intractable and thus useless for real-time choice.
  *   **The Loop Preserves the Criterion:** Most proponents of indirect normativity argue it is a *criterion of rightness*. The "ideal self" defines the target, not the method. When you are tired, you are not trying to *be* the ideal self; you are trying to **approximate** the fixed point using heuristics (e.g., "What would I decide if I slept on this?").
  *   **Implication:** The recursion forces a division of labor. The ideal theory handles the *justification* (why this choice is good), while bounded rationality handles the *execution* (how to choose now). The loop doesn't break the system, but it forbids using the theory as a direct algorithm. You must use "local reflection" (stopping when diminishing returns hit) as a proxy for "global idealization."

  ### 3. The Risk of "Idealization Drift"
  In hard choices, the recursive nature of idealization introduces the risk that the "ideal self" drifts too far from the "actual self" to be action-guiding.

  *   **Alienation:** If the recursion requires stripping away all biases, emotions, and contextual attachments to reach the fixed point, the resulting verdict might be one your actual self cannot recognize or motivate yourself to perform.
  *   **The Stability Constraint:** For indirect normativity to work, the fixed point must be **attractive** to the actual self. If the recursion leads to a state where you no longer care about the things that currently motivate you, the "ideal verdict" loses normative force for the *current* agent.
  *   **Implication:** The recursion must be constrained by **continuity**. The ideal self must be a continuous extension of the actual self's values, not a replacement. If the recursive process breaks continuity, the "ideal advice" becomes irrelevant to the "hard choice" you actually face.

  ### 4. Operationalizing the Fixed Point in Hard Choices
  Does the loop make indirect deliberation useless for biased agents? No, but it changes how the agent must treat their own uncertainty.

  *   **Confidence as Convergence:** When you are biased, you cannot know if you are at the fixed point. However, you can test for **stability**. If you deliberate, rest, remove a specific bias, and deliberate again, and the verdict remains the same, you have empirical evidence of approaching a fixed point.
  *   **The "Stop" Rule:** Since you cannot complete the recursion, you must adopt a **satisficing threshold**. You deliberate until the cost of further reflection (time, energy, anxiety) outweighs the expected shift in the verdict.
  *   **Implication:** The "ideal self" becomes a **regulative ideal** rather than a discoverable entity. You act *as if* there is a fixed point, using the stability of your current reflection as a proxy. If your judgment fluctuates wildly with minor changes in framing, you recognize you are far from the fixed point and should delay the choice. If it is stable, you proceed.

  ### Summary
  The recursive loop does not inherently break indirect normativity, provided the recursion **converges**.
  1.  **If Convergent:** There is a stable fixed point. The theory works as a criterion of rightness, but you must use heuristics (sleep, consultation, bias-checking) to approximate it when tired.
  2.  **If Divergent:** There is no ideal verdict. The theory fails to provide an answer, implying the hard choice has no normative solution.
  3.  **Practical Upshot:** You cannot compute the loop. You must treat the "ideal self" as a limit you approach via stability testing, not a person you can consult. If your preferences stabilize after modest reflection, treat that as the actionable verdict. If they oscillate, the recursion reveals that the choice is genuinely underdetermined by your values.
