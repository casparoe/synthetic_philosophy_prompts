  Can you compare spandrels from Gould and Lewontin's critique of adaptationism with the idea of exaptation? They get conflated all the time, but I think a spandrel is a byproduct with no function of its own, while an exaptation is a trait that gets repurposed for a new function — so work out where that line actually breaks down (a spandrel that later gets co-opted seems to just be both), and tell me whether the distinction does any real work or is mostly labeling. Also be clear about what Gould and Lewontin are not claiming, since the critique gets misread as the claim that selection barely matters, when I think its a lot narrower than that. Casual is fine, just do the real conceptual work.
