answer: |-
  You are spot on. The conflation of these two terms is one of the most persistent headaches in evolutionary biology, and your intuition about the difference is basically correct. But you're also right to suspect that the line gets blurry when you look at the timeline of a trait.

  Here is the breakdown of where the concepts overlap, where they diverge, and whether distinguishing them actually matters for doing science.

  ### 1. The Core Definitions (Origin vs. Resume)

  The easiest way to keep them straight is to think of them as describing different phases of a trait's life.

  *   **Spandrel (1979):** This is about **origin**. It describes *how the trait got there*. A spandrel is a phenotypic characteristic that evolved as a side effect (a byproduct) of a true adaptation or a structural constraint, not because it was directly selected for.
      *   *The Metaphor:* In architecture, a spandrel is the triangular space between two arches. You don't build the triangle; you build the arches to hold up the dome, and the triangle *must* exist as a consequence.
      *   *Biological Example:* The redness of blood. Hemoglobin was selected for oxygen transport. The color red is a physical byproduct of the iron in heme. No one selected for red blood; it just came along for the ride.

  *   **Exaptation (1982):** This is about **utility history**. It describes the relationship between a trait's *current function* and its *original cause*. An exaptation is a trait that performs a function now but was not shaped by natural selection *for that specific function* originally.
      *   *The Shift:* Gould and Vrba coined this term three years *after* the Spandrel paper specifically to clean up the mess people were making with "spandrel."
      *   *Biological Example:* Feathers. They likely evolved for thermoregulation (warmth) or display. Later, they were co-opted for flight. Flight is an exaptation of feathers.

  ### 2. Where the Line Breaks Down (The "Both" Scenario)

  You asked: *"A spandrel that later gets co-opted seems to just be both."*

  **Yes. Exactly.** And that is the source of the confusion.

  Gould and Vrba explicitly acknowledged this in the 1982 paper. They categorized exaptations into two types:
  1.  **Adaptation $\rightarrow$ Exaptation:** A trait selected for Function A is later used for Function B (e.g., feathers for heat $\rightarrow$ flight).
  2.  **Spandrel $\rightarrow$ Exaptation:** A non-adaptive byproduct arises, and later gets co-opted for Function B.

  So, if you have a structural byproduct (Spandrel) that later becomes useful (Exaptation), it is **both**.

  *   **Example:** The human capacity for language.
      *   *Gould's View:* Our big brains were selected for general problem solving or social complexity. The specific neural wiring for syntax might have been a structural byproduct of that brain size (Spandrel).
      *   *Later:* We started using that wiring to speak.
      *   *Status:* It originated as a Spandrel, but it is currently an Exaptation for language.

  **So why do people conflate them?**
  Because in casual conversation, people use "Spandrel" to mean "useless trait." But in G&L's framework, a spandrel *can* acquire utility later. However, once it acquires utility and is maintained by selection for that new utility, it starts behaving like an adaptation *for that new function*, even if its origin was non-adaptive.

  ### 3. Does the Distinction Do Real Work?

  This is the million-dollar question. Is this just semantic labeling, or does it change how we do biology?

  It does real work, but only if you use it as a **methodological tool** rather than just a noun.

  **1. It shifts the Burden of Proof.**
  If you assume every trait is an adaptation (the "Panglossian Paradigm"), your default research question is: *"What survival advantage does this trait provide?"*
  If you classify a trait as a potential Spandrel/Exaptation, your question changes to: *"Is this trait a direct target of selection, or is it hitchhiking on something else?"*
  This stops scientists from writing "Just-So Stories." Instead of inventing a reason why the human chin was selected for (speaking? chewing?), you first ask if the chin is just a structural byproduct of how jaws shrink during development.

  **2. It separates Origin from Maintenance.**
  This is the conceptual heavy lifting.
  *   **Adaptation:** Origin = Selection; Maintenance = Selection.
  *   **Spandrel:** Origin = Constraint/Byproduct; Maintenance = None (or drift).
  *   **Exaptation:** Origin = Selection for X (or Byproduct); Maintenance = Selection for Y.

  If you don't have these labels, you tend to assume Origin = Maintenance. Distinguishing them forces you to look at the fossil record or developmental genetics to find the *original* state, rather than just reverse-engineering from the current utility.

  **3. Where it fails (The Labeling Trap).**
  The distinction becomes useless labeling when people use "Spandrel" as a conversation-stopper.
  *   *Bad Science:* "Oh, that trait is just a spandrel." (Implies: It does nothing, stop studying it.)
  *   *Good Science:* "This trait looks like a spandrel relative to its origin, so we need to test if it's currently under selection or if it's neutral."

  ### 4. What Gould and Lewontin Were NOT Claiming

  This is the most critical correction. The 1979 paper *"The Spandrels of San Marco and the Panglossian Paradigm"* is frequently misread as an attack on natural selection itself.

  **They were NOT claiming:**
  *   That natural selection is unimportant.
  *   That most traits are spandrels.
  *   That organisms are not well-adapted to their environments.

  **They WERE claiming:**
  *   That **Adaptationism** (the research strategy of assuming every trait is an optimal adaptation) is a flawed methodology.
  *   That constraints (physical, developmental, historical) limit what selection can do. You can't select for a square wheel, even if it were useful, because of physics.
  *   That some traits are non-adaptive byproducts.

  Think of it this way: If you walk into a room and see a messy desk, an Adaptationist assumes every paper pile is there for a specific reason. G&L are saying, "Some piles are there because you needed to work (adaptation), but some piles are just where the papers fell when you threw them down because of the shape of the desk (constraint/spandrel)." They aren't saying work doesn't happen; they're saying **not everything is a workflow.**

  ### Summary

  *   **Spandrel:** Describes **Origin**. (Byproduct/Constraint).
  *   **Exaptation:** Describes **Function History**. (Current use $\neq$ Original cause).
  *   **The Overlap:** A Spandrel can become an Exaptation if it gets co-opted.
  *   **The Value:** The distinction prevents researchers from assuming current utility explains historical origin. It forces you to distinguish between *why it's here* and *what it does*.
  *   **The Misreading:** G&L didn't say selection is weak; they said selection isn't the *only* architect.

  So, you're right to be annoyed by the conflation. But the distinction isn't just labeling—it's a reminder that evolution is a tinkerer, not an engineer, and sometimes it uses spare parts (spandrels) to build new machines (exaptations).
