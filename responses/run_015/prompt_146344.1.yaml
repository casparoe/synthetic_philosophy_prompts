answer: |-
  1. The statement of the four conditions is technically accurate, but describing Independence of Irrelevant Alternatives as too weak to argue with is controversial since many theorists consider it overly restrictive for practical fairness. Social choice scholars often argue IIA bans legitimate context-dependent compromises rather than representing a minimal requirement of rationality.
  2. It does not follow that every system is broken or the search hopeless, because the theorem only rules out systems satisfying that specific set of axioms simultaneously. Many theorists argue that relaxing IIA or unrestricted domain yields robust systems that are fair enough for practical purposes.
  3. Reading the theorem as purely about information is partially correct, but letting people report intensities does not make the impossibility evaporate unless you also assume interpersonal comparability of those utilities. Without a common scale for intensity, cardinal preferences still face aggregation impossibilities similar to Arrow's.
  4. Averaging 0-to-10 scores technically escapes Arrow's conclusion because it violates the ordinalism constraint, but this ignores the unresolved problem of whether different people's scales are interpersonally comparable. The author is right that it bypasses the theorem, but wrong to imply this solves the normative problem of aggregating welfare.
  5. The aggregation you described is not the sort of object Arrow's theorem is about, as fitting a reward model estimates a latent population parameter rather than aggregating distinct individual orderings into a collective ranking. If one forced a mapping, the dictator would not be a person but the statistical loss function defining what counts as the best fit to the data.
  6. Only the claim that happiness surveys escape the theorem survives correction, though its practical significance is overstated, while the claims that fair voting is hopeless and AI alignment is impossible are false. The AI alignment conclusion fails because preference learning is not a social welfare function operating on fixed ordinal profiles.
