answer: |-
  **MEMORANDUM**

  **TO:** Board of Directors
  **FROM:** [Your Name]
  **DATE:** October 23, 2023
  **SUBJECT:** Decision Required: Rent Control Exemption & Coordinator Compensation

  **The Decision**
  We have two votes to cast this Thursday.
  1.  **Rent Control:** Do we file for the nonprofit exemption by the 15th, allowing us to charge market rates? Or do we remain under rent control, capping what we can charge residents?
  2.  **Coordinator Pay:** Do we restructure our resident coordinators to hourly minimum wage? Or do we maintain the current stipend model, which falls below minimum wage when housing is factored in?

  **The Recommendation**
  I recommend we **do not file for the rent control exemption** and that we **restructure coordinator pay to hourly minimum wage by Q2.**

  This path is harder financially. It means we cannot balance our budget on the backs of residents or staff. It requires us to raise the difference through donations and grants. But it is the only path that aligns our economics with our mission.

  **The Philosophical Tension**
  We need to be honest about what we are doing. There is an argument that rent control is a form of market distortion—that price controls are just extraction with extra steps. Usually, I might agree. But we are not a landlord seeking profit; we are a residency seeking poems.

  If we file for the exemption, we are effectively using "Art" as a moral shield to bypass labor and tenant protections. We are claiming that because the end product is poetry, the economic rules of the city shouldn't apply to the people making it. That is a dangerous logic. It suggests artistic labor is special, set apart from the regular economy. In practice, this usually means artistic labor is expected to be cheaper, more flexible, and less protected than other work.

  If we want to stand with labor, we cannot build our sustainability on a loophole that undermines labor standards.

  **Pricing the Thing vs. Pricing the Conditions**
  There is a distinction I keep returning to: the difference between pricing a *thing* and pricing the *conditions* that make the thing possible.

  If we view these eight apartments simply as "housing," then rent control is a cap on our revenue. But if we view the apartments as **raw material**, the calculation changes. We tell donors we support writing. But writing requires time, safety, and space. In this sense, the apartment is not the product we are selling; it is the soil in which the product grows.

  When a manufacturer buys raw materials, they don't try to maximize the price of the steel or the cotton. They try to secure it at a stable cost so they can make the car or the shirt. If we file for the exemption, we are treating the studio space as a commodity to be monetized, rather than infrastructure to be maintained. We would be charging the artist for the very conditions we claim to nurture.

  By staying under rent control, we acknowledge that the space is a subsidy. We are not "losing revenue" by capping the rent; we are honoring the fact that the rent is a means to an end, not the end itself.

  **The Coordinator Pay**
  The same logic applies to our coordinators. The stipend model is traditional in the arts. It relies on the idea that "community" and "housing" are part of the compensation. But community doesn't pay grocery bills, and housing alone doesn't validate labor.

  If we pay below minimum wage, we are implicitly saying that residency work is training, not labor. It suggests that being near poets is payment enough. That is a romantic notion that doesn't survive contact with the cost of living. If we are truly on the side of labor, we cannot exempt ourselves from wage laws because our budget is tight. A tight budget is a fundraising problem, not a justification for underpayment.

  **The Cost**
  I know the math worries people.
  *   **Rent:** Staying under rent control means we cannot raise rates to cover inflation. We will have a funding gap.
  *   **Pay:** Moving coordinators to hourly will increase our payroll expenses significantly.

  This is why the recommendation is paired. We cannot solve the payroll increase by raising rents on the writers. That would just shift the burden from the staff to the residents. Instead, we must take this gap to our donors. We need to tell them: *"We are refusing a regulatory loophole to keep rents low, and we are correcting a wage violation to pay staff fairly. Please fund the integrity of the model."*

  **Timeline & Action Items**
  1.  **By October 15th:** Vote to **withdraw** any intent to file for the rent control exemption. We notify the city we are complying with the cap.
  2.  **By Q2 (April 1st):** Implement hourly payroll for coordinators. We will need to audit their current hours to set the rate correctly.
  3.  **Immediate:** Authorize the Development Committee to launch a specific campaign covering the "Integrity Gap"—the cost of the wage adjustment and the rent cap.

  **Conclusion**
  We are a tiny organization. We cannot fix the housing crisis or the wage gap alone. But we can decide whether we are part of the problem or part of the solution.

  If we file for the exemption, we preserve our budget but compromise our stance on labor and housing. If we stay under the cap and fix the wages, we preserve our integrity but compromise our budget.

  I believe our donors will fund our integrity. They will not fund a loophole. Let's choose the harder right over the easier wrong.

  **Vote Required:** Motion to decline the rent control exemption and authorize payroll restructuring.
