prompt: |-
  hey so i'm on the board of this tiny writer's residency nonprofit — we have like eight studio apartments for translators and poets, plus we pay two resident coordinators a stipend that covers food and housing but if you do the math hourly it's below teh city's new minimum wage. the city also just passed rent control but there's an exemption for nonprofits that provide 'subsidized artistic workspace' if they file by next month.

  i need a memo for our board meeting thursday. we have to decide: do we file for the exemption and keep charging what we need to fund the program, or do we stay under rent control and keep the apartments cheap for residents? and separately, do we restructure the coordinator pay so it's legal hourly, or keep the stipend model since they get housing?

  the memo should recommend one concrete course of action with a timeline — like file or don't file by the 15th, and adjust payroll by q2 — and it needs to take seriously the argument that price controls are just extraction with extra steps, especially when a nonprofit claims to be on the side of labor. don't just restate the law. i'm a novelist not an economist so please don't use jargon i can't follow, but do dig into the philosophical tension: if we're capping rent for artists, are we treating artistic labor as something that shouldn't be priced like regular work? and if we exempt ourselves, are we just using art as a moral shield for economic privilege?

  oh and there's this idea i keep coming back to — maybe it's dumb — that there's a difference between pricing a thing and pricing the conditions that make the thing possible. like, rent is a price on space, but that space is also the raw material for the writing we say we support. i want the memo to wrestle with that distinction, not just mention it in passing.

  no need for citations or a reading list — i just need the reasoning clear enough that the board can vote on it. thanks
