          *   M3: Critical hit on the "precision" claim.
      *   *Specific Questions:*
          *   Distributed: Leo solves the static case, Mara solves the dynamic case.
          *   Sorites: Asymmetric damage. TWI breaks on sharp cutoffs; CT absorbs vagueness.
