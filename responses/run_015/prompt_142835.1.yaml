  You manage a £1m endowment. A venture offers a 30% chance to triple capital, 70% chance to lose it entirely. Wins may be reinvested in Round Two identically; losses are terminal. Friction: Cash withheld from Round One suffers a 50% administrative levy; reinvested winnings are exempt.

  Risk-neutral expected-utility (EU) maximises arithmetic mean wealth. The bet's expected multiplier is 0.9 per round; over two rounds, expected wealth is £0.81m. Holding cash yields £0.5m. EU dictates 100% allocation to avoid the levy. Kelly betting maximises geometric mean growth. Since any loss zeroes capital, the geometric mean of betting is zero. Kelly dictates 0% allocation, accepting the levy to ensure survival.

  The divergence stems from the levy penalising safety, forcing EU to trade survival for arithmetic gain. Removing the levy restores cash return to 1.0. Since the bet's EV (0.81) is now below cash, both theories recommend 0%, collapsing the disagreement.

  A defender of EU theory would argue the levy is simply a cost of liquidity. By absorbing the levy into the payoff matrix, the 'cash' option becomes a negative-return asset, making the venture the only positive-EV choice relative to alternatives. They contend that Kelly's refusal to bet ignores the guaranteed decay of idle capital, asserting that rational utility must internalise all constraints, thereby dissolving the case as a misunderstanding of the available opportunity set rather than a theoretical failure.
