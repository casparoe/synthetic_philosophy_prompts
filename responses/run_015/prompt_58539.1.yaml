answer: |-
  Hiya. First off, that late-shift brain is a very specific state of being—Leeds at 2 a.m. feels different than Leeds at 2 p.m., and your brain is running on a different kind of fuel.

  To answer your question directly: **No, there isn't one single, perfect philosophical word for this exact loop**, but you have accurately identified a specific gap in how we handle knowledge. Philosophers and psychologists have circles around it, but they usually describe the *feeling* or the *result*, not the specific mechanism of "skipping the check because I feel sure."

  Here is the breakdown of what this is, what it isn't, where the line is drawn, and a coined term that might stick.

  ### 1. What it isn't (Clearing the deck)

  You asked if it's **Confirmation Bias**. It's not, and the distinction is important.
  *   **Confirmation Bias** is when you *look* for evidence but only accept the bits that agree with you. (e.g., You check the till, see a £10 note that looks out of place, and convince yourself it belongs there because you want the total to be right).
  *   **What you are doing** is **Information Avoidance**. You aren't filtering the evidence; you are refusing to gather it because you assume you already possess it.

  It's also not **Stubbornness (Dogmatism)**.
  *   As you said, if you *did* check and found an error, you'd accept it. A dogmatist would argue the till is wrong, not them. You are willing to update your belief; you just block the update signal from arriving.

  ### 2. What it is (The Mechanism)

  In psychology, this is closest to the **Overconfidence Effect** combined with **Cognitive Ease** (a term from Daniel Kahneman).
  *   **Cognitive Ease:** When a thought feels fluent and easy (like "I definitely sent that email"), your brain labels it as "True" to save energy.
  *   **The Glitch:** Your brain is treating the *feeling of certainty* as if it were *evidence of truth*.

  In philosophy, this touches on **Epistemology** (the study of knowledge). Specifically, it's a failure of **Meta-Justification**. You have a justification for the belief ("I remember doing it"), but you lack a justification for *trusting* that memory without verification. You are skipping the "second-order" check (checking the check).

  ### 3. The Line: Sensible Efficiency vs. "Dodgy" Reasoning

  You asked where the line is between saving effort and being reckless. In decision theory, this is calculated as the **Expected Value of Information (EVI)**.

  *   **Sensible Saving of Effort:**
      *   **Stakes:** Low (If you're wrong, nobody gets hurt).
      *   **Cost of Check:** High (It takes 20 minutes to verify).
      *   **Confidence:** High.
      *   *Verdict:* Don't check. (e.g., "Did I brush my teeth?" You feel the minty freshness; you don't check the sink for bristles).

  *   **Dodgy Reasoning (Your Situation):**
      *   **Stakes:** High (Missing float money, council fines).
      *   **Cost of Check:** Low (2 seconds to open a folder/count notes).
      *   **Confidence:** High (but humanly fallible).
      *   *Verdict:* **Check.**

  The error happens when **Subjective Confidence** overrides **Objective Risk**. You are effectively saying, "My feeling of certainty is worth more than the cost of the insurance." In a hotel till or a council email, the insurance is cheap, so skipping it is an error in risk management, not just memory.

  ### 4. Coining a Term

  Since there isn't a perfect label, let's carve one out. We need something that captures the feeling of being "full" on knowledge, so you stop "eating" (checking).

  I propose calling this: **"Epistemic Satiation"**.

  *   **Epistemic:** Relating to knowledge/truth.
  *   **Satiation:** The state of being fully satisfied (like after a meal).

  **Definition:** *Epistemic Satiation is the cognitive state where high subjective confidence creates a false sense of completeness, causing an agent to cease information-gathering behaviours (verification) prematurely, despite low costs to continue.*

  In plain English: **You feel too full on certainty to bother checking.**

  Alternatively, if you want something that sounds more like a hotel shift warning, you could call it **"The 99% Trap"**. It highlights that specific danger zone where you are close enough to right that you don't bother confirming, which is exactly where the silent errors live.

  ### 5. How to hack it (Since you're on late shifts)

  Knowing the name helps, but late-shift fatigue makes *Epistemic Satiation* worse because your meta-cognition (thinking about thinking) is the first thing to tire.

  *   **The "Pre-Mortem" Rule:** Before you walk away from the till or hit send, ask: *"If I find out I'm wrong in 10 minutes, what will that cost me?"* If the answer is "a fine" or "a disciplinary," the cost of the check is now zero compared to the stake.
  *   **Externalise the Doubt:** Don't trust your brain. Trust the system. Make a physical rule: *"Till counts must be signed by two people"* or *"Important emails go to Drafts first, then Sent."* Remove the option to skip the check.
  *   **Label the Feeling:** When you feel that "dead certain" vibe, literally say to yourself: *"That's Epistemic Satiation."* It breaks the spell and reminds you that the feeling is a chemical state, not a fact.

  **Summary:** It's not laziness, and it's not confirmation bias. It's **Epistemic Satiation**. You're trading a cheap insurance policy (the check) because you feel rich in certainty. On a late shift in Leeds, that feeling is usually a loan shark, not a friend.

  Hope that helps clear the fog a bit. Safe shifts.
