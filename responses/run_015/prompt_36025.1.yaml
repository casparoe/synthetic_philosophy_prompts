answer: |-
  # Dissertation Defense Q&A Prep Sheet
  **Topic:** Phenomenally Individuated SIA (PI-SIA)
  **Audience:** 5 Formal Epistemologists (Bayesians), 2 Halfers, 1 Metaphysician.
  **Goal:** Survive scrutiny on update rules, identity, and utility.

  ## Strategic Overview

  *   **Concede Up Front:** Acknowledge that "total phenomenal state" has borderline vagueness (appease the Metaphysician). Acknowledge that in *stipulated* thought experiments like Sleeping Beauty where duplication is guaranteed by setup, PI-SIA behaves like standard SIA (appease the Halfers by isolating SB as artificial).
  *   **Hold Without Compromise:** The claim that PI-SIA is **not** a new update rule but a specification of the likelihood function within Ordinary Conditionalization (OC). The claim that for *cosmological* hypotheses, PI-SIA neutralizes the Presumptuous Philosopher.
  *   **The One Exchange to Win:** **Objection #1 (Conditionalization).** If you convince them this is just OC with a specific likelihood model, you neutralize the "suspicious new rule" crowd. If you fail this, you look like a rule-breaker.
  *   **The Question You Hope Nobody Asks:** "If self-locating evidence rarely updates your credences, what theoretical work is left for SIA to do that standard skepticism couldn't accomplish?" (See end of sheet).

  ---

  ## The 10 Objections

  ### 1. The "Just Conditionalization" Challenge
  **Who:** Lead Bayesian.
  **Question:** "You present this as a modification to SIA, but isn't this just ordinary conditionalization on the proposition *'Some observer is having experience E'*? If so, why frame it as a new weighting rule rather than just specifying the likelihood $P(E|H)$? If it's not just conditionalization, what rule are you violating?"
  **Reply (2 min):** "It *is* ordinary conditionalization. I am not proposing a new update rule. I am proposing a specific account of the likelihood term. Standard SIA implicitly defines the likelihood of 'I exist' as proportional to the number of observers. I am arguing the likelihood of 'Experience E occurs' is proportional to the number of *phenomenal duplicates of E*. The update mechanism is Bayes' Theorem; the innovation is in the metaphysics of the evidence term. This preserves OC while correcting the input."
  **Soft Spot:** If they press that "I exist" and "Experience E occurs" are different propositions, you must admit you are changing the *evidence base*, which looks like changing the rule.

  ### 2. The SSA Smuggling Charge
  **Who:** Second Bayesian.
  **Question:** "By restricting the count to exact phenomenal duplicates, aren't you just building the Self-Sampling Assumption (SSA) into the likelihood? You've effectively shrunk the reference class to size one. Isn't this just SSA in disguise, and if so, why keep the SIA label?"
  **Reply (2 min):** "It's not SSA because I'm not sampling from a reference class. SSA says 'Reason as if you are a random sample from class X.' I say 'Weight worlds by the objective count of this specific experience.' In SSA, the reference class is arbitrary. In PI-SIA, the 'class' is fixed by the intrinsic nature of my evidence. It dissolves Presumptuous Philosopher not by shrinking the class arbitrarily, but by noting that surplus observers in the large universe objectively lack my evidence."
  **Soft Spot:** The distinction between 'arbitrary reference class' and 'phenomenal type' is thin. If they argue phenomenal types are just a reference class, you look like you're renaming SSA.

  ### 3. The Sleeping Beauty Trap
  **Who:** Committed Halfer #1.
  **Question:** "Let's be direct. In Sleeping Beauty, Tails produces two awakenings with identical phenomenal states. Your view weights by duplicates. That gives Tails a 2:1 boost. That makes you a Thirder. Are you a Thirder? And if so, why should we take your 'serious' epistemology seriously if it leads to that?"
  **Reply (2 min):** "In the *stipulated* logic of Sleeping Beauty, yes, PI-SIA aligns with Thirding because the setup guarantees duplication. However, my dissertation focuses on *cosmological* hypotheses where such duplication is not stipulated but hypothesized. In the real world, exact duplicates are vanishingly rare. I treat SB as a boundary case where the setup forces the SIA effect, unlike the cosmological cases where PI-SIA neutralizes it. I prioritize getting the cosmology right over the SB intuition pump."
  **Soft Spot:** The Halfers will hear "I am a Thirder" and tune out. You are risking their goodwill. *Pivot:* Emphasize that SB is an artificial constraint on identity, whereas your view respects the metaphysics of persistence.

  ### 4. The Vagueness/Sorites Objection
  **Who:** Metaphysician.
  **Question:** "You rely on 'exact phenomenal duplicates.' But phenomenal states are vague. If I have a slightly different shade of red in my visual field, am I a duplicate? If you set a threshold, you've reintroduced a graded reference class. If you don't, the count is undefined. How do you solve the Sorites problem here?"
  **Reply (2 min):** "I concede there is vagueness, just as there is vagueness in 'observer' or 'person.' But this doesn't invalidate the principle. We handle vagueness in 'tall' or 'bald' without abandoning the concepts. For the purposes of the likelihood function, we treat 'exact' as 'indistinguishable from the first-person perspective.' Small differences that don't enter the phenomenal state don't count. The count is precise enough to dissolve the Presumptuous Philosopher, even if borderline cases exist."
  **Soft Spot:** They will press that cosmological counts depend on *precise* numbers. If the count is vague, the probability ratio is vague. You have to accept some vagueness in the final credence.

  ### 5. The "Costly Rescue" Objection
  **Who:** Skeptical Bayesian.
  **Question:** "You admit self-locating evidence almost never does work on your view. A simpler view is that anthropic reasoning is bunk and we should ignore observer counts entirely. Why build this complex machinery just to arrive at a result the skeptic gets for free?"
  **Reply (2 min):** "Because the skeptic cannot handle cases where duplication *is* known, like Sleeping Beauty or quantum branching. My view preserves the machinery for cases where self-location *does* matter, while preventing it from overgenerating in cosmology. It's not a rescue; it's a calibration. We keep the engine but fix the throttle."
  **Soft Spot:** If they argue the engine is unnecessary even for SB (i.e., Halferism solves SB without SIA), your machinery looks truly superfluous.

  ### 6. The Hyper-Sensitivity Objection
  **Who:** Second Bayesian.
  **Question:** "On your view, if my experience differs by a single photon's worth of qualia, the weighting changes. This makes rational credence hostage to microscopic phenomenal facts no agent can track. Is rationality really that fragile?"
  **Reply (2 min):** "Rationality is sensitive to evidence. If your evidence changes, your likelihoods change. The fact that the evidence is fine-grained doesn't make the rule fragile; it makes it precise. We don't say visual perception is 'fragile' because it distinguishes fine shades. We should expect credences to track the granularity of experience."
  **Soft Spot:** It implies agents cannot *know* their own likelihoods, which violates the spirit of ideal Bayesianism.

  ### 7. The Centered Worlds Challenge
  **Who:** Formal Epistemologist.
  **Question:** "Why not model this using centered worlds and condition on the center? 'I am at center C.' Standard centered-worlds Bayesianism handles this without needing a duplicate-counting weighting rule. What does PI-SIA add?"
  **Reply (2 min):** "Centered worlds often implicitly assume a principle of indifference over centers, which recreates the SIA problem. PI-SIA specifies *which* centers count. A center only contributes to the likelihood if the experience at that center matches mine. It constrains the centered-worlds approach to prevent the Presumptuous Philosopher inference."
  **Soft Spot:** You need to show exactly where standard centered-worlds conditionalization fails without your constraint.

  ### 8. The Diachronic Incoherence Objection
  **Who:** Third Bayesian.
  **Question:** "If I learn my experience was slightly different than I thought (e.g., I misremembered a qualia), do I have to retroactively change my credences about the size of the universe? This looks like a violation of Reflection."
  **Reply (2 min):** "Your evidence has changed, so your likelihoods change. This isn't a violation of Reflection; it's standard updating on new evidence about your own state. If you learn you are not the duplicate you thought you were, you update. That's consistent with diachronic rationality."
  **Soft Spot:** If the "change" is just a refinement of description, not new data, this looks like instability in priors.

  ### 9. The Metaphysics of Persistence
  **Who:** Metaphysician.
  **Question:** "You count duplicates. But does persistence matter? If one observer persists through time with the same experience, is that one duplicate or many? Are you counting observer-moments or persons?"
  **Reply (2 min):** "I am counting instantaneous phenomenal tokens. Persistence doesn't add weight; only simultaneous or distinct tokens of the *same* state do. This avoids the problem of long-lived observers weighting hypotheses more heavily than short-lived ones."
  **Soft Spot:** This commits you to a specific metaphysics of time/experience that the Metaphysician might reject (e.g., perdurantism vs. endurantism).

  ### 10. The "Why SIA at All?" Objection
  **Who:** Halfer #2.
  **Question:** "If you restrict SIA so much that it rarely applies, why not just drop the 'Self-Indication' label and call it 'Phenomenal Conditionalization'? Are you clinging to SIA for terminological reasons?"
  **Reply (2 min):** "Because the weighting by *existence* is still the core mechanism. I am still saying 'Worlds where this experience exists more often are more likely.' That is the SIA intuition. I am just correcting what counts as 'this experience.' The label fits the mechanism, even if the application is narrower."
  **Soft Spot:** It might look like you are rebranding SSA to avoid the stigma of SIA's failures.

  ---

  ## The Question You Hope Nobody Asks

  **"If self-locating evidence rarely updates your credences, what theoretical work is left for SIA to do that standard skepticism couldn't accomplish?"**

  *   **Why it's dangerous:** It attacks the *motivation* of the chapter. If the answer is "nothing, mostly," the committee may ask why this dissertation chapter needed to exist.
  *   **Prepared Answer:** "Standard skepticism throws out the baby with the bathwater. It cannot account for cases where we *know* duplication exists (like SB or quantum branches). PI-SIA provides a unified framework that handles the 'bathwater' (cosmological presumption) without losing the 'baby' (genuine self-locating updates). It offers a unified theory of anthropic evidence rather than a piecemeal skepticism."

  ---

  ## Final Tactical Advice

  1.  **On the Halfers:** Do not fight them on Sleeping Beauty. Concede SB is a special case where your view yields Thirding, but emphasize that SB is an *engineered* case of duplication. In the *natural* world (your dissertation's focus), duplication is rare. This allows them to keep their Halferism for real cases while accepting your logic for the chapter.
  2.  **On the Bayesians:** Repeat the mantra: "This is Ordinary Conditionalization with a refined likelihood function." Do not let them categorize this as a "new update rule." That is the death knell for this audience.
  3.  **On the Metaphysician:** Be humble about the vagueness of "phenomenal state." Offer to treat it as a primitive for the sake of the argument. Do not try to solve the hard problem of consciousness in the Q&A.
  4.  **Body Language:** When the Halfer asks about SB, look at them directly. Acknowledge the seriousness of their commitment. "I know the Halfer position is the mark of rigor in this room..." (Flattery helps).

  **Good luck. Hold the line on Conditionalization.**
