          *   Epistemic Injustice: *Would* license dismissal, but is empirically false.

      *Review against constraints:* No citations. No history. Focus on logical geography. Ensure the "Epistemic Injustice" payoff is explicit for each.

      *Refining the "Status" classifications:*
