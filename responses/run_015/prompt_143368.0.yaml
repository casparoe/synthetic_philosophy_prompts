  # Decision-Tree Taxonomy: The Logical Space of Extended Cognition

  **Root Commitment:** "Some cognitive processes can constitutively include resources that lie outside the biological organism."

  **Instructions:** Answer each diagnostic question sequentially. Follow the branch that matches your philosophical commitment regarding the specific scenario described. Do not select a "camp"; select the answer that best reflects your intuition about the case.

  ---

  ### Node 1: The Otto Case (Alzheimer's Navigation)
  **Diagnostic Question:** In the case of Otto, who relies on a notebook to navigate due to memory loss, is the information in the notebook *constitutively* part of his memory system (identical in status to biological recall), or is it merely *causally* linked to his memory (an external aid like a library)?
  *   **Branch A (Causal-Only):** The notebook is a tool that supports memory but is not part of the memory system itself. → *Go to Node 2.*
  *   **Branch B (Constitutive):** The notebook is literally part of the vehicle of his memory content. → *Go to Node 3.*

  ### Node 2: The Neural Lace Case (Integrated Manufactured Tech)
  **Diagnostic Question:** Consider a manufactured "neural lace" surgically integrated into the cortex that performs memory retrieval. Even though it is non-biological, does its physical integration make it part of the cognitive system, or does its manufactured origin keep it "outside"?
  *   **Branch A (Origin Matters):** It remains an external tool because it is not biological tissue. → *Leaf 1.*
  *   **Branch B (Integration Matters):** It counts as part of the cognitive system because it is functionally integrated, regardless of origin. → *Leaf 2.*

  ### Node 3: The CAD Case (Opacity and Trust)
  **Diagnostic Question:** An engineer uses CAD software she trusts implicitly but cannot fully reconstruct or explain (opacity). Does this inability to access the software's internal logic preclude it from being part of her cognitive process?
  *   **Branch A (Precludes):** Yes; cognitive extension requires transparency or the ability to validate the process internally. → *Leaf 3.*
  *   **Branch B (Does Not Preclude):** No; functional reliability is sufficient, regardless of internal opacity. → *Go to Node 4.*
  *   **Branch C (Category Error):** The question is misguided; cognition is not about processing representations in software or brains, but about embodied engagement. → *Leaf 4.*

  ### Node 4: The Jazz Quartet Case (Social Coupling)
  **Diagnostic Question:** During tightly coupled improvisation, is the primary cognitive system responsible for the musical output the individual musician (extended by their instrument) or the quartet as a collective whole?
  *   **Branch A (Collective):** The quartet itself is the cognitive agent; the music exists at the group level. → *Leaf 5.*
  *   **Branch B (Individual):** The individual musician is the agent, perhaps extended by the instrument, but the group is merely a causal environment. → *Go to Node 5.*

  ### Node 5: The Intermittent Access Case (Temporal Continuity)
  **Diagnostic Question:** Consider a resource accessed reliably only once per week. Does this temporal gap break the constitutive link, or can a cognitive process remain extended despite intermittent coupling?
  *   **Branch A (Breaks):** Yes; constitution requires continuous or near-continuous coupling. → *Leaf 6.*
  *   **Branch B (Does Not Break):** No; dispositional access is sufficient, even if the resource is not constantly active. → *Leaf 7.*

  ---

  ## Leaf Taxonomy and Diagnostics

  | Leaf | Position Name | Path (Answers) | Awkward Commitment |
  | :--- | :--- | :--- | :--- |
  | **1** | **Strict Neurobiological Internalism** | N1: Causal → N2: Origin Matters | Must claim Otto's notebook is no different in kind from a library book, despite his constant, immediate reliance on it. |
  | **2** | **Embedded Cognition (Constitution-Lite)** | N1: Causal → N2: Integration Matters | Must claim the manufactured lace is 'you' but the notebook is not, despite both performing identical memory functions. |
  | **3** | **Unnamed/Hybrid: Trust-Limited Extension** | N1: Constitutive → N3: Precludes | Must claim the engineer stops thinking *with* the software the moment she loses the ability to explain its code, even if it works perfectly. |
  | **4** | **Enactivist Rejection** | N1: Constitutive → N3: Category Error | Must claim that neither the notebook nor the software stores 'representations,' rendering the debate about 'location' of memory fundamentally mistaken. |
  | **5** | **Distributed Cognition** | N1: Constitutive → N3: No → N4: Collective | Must claim the quartet possesses memories and intentions that no individual member possesses, even transiently. |
  | **6** | **Unnamed/Hybrid: Continuous-Coupling Extension** | N1: Constitutive → N3: No → N4: Individual → N5: Breaks | Must claim the agent's mind literally shrinks during the week they do not access the resource, only to regrow upon reconnection. |
  | **7** | **Clark-Chalmers Functional-Parity** | N1: Constitutive → N3: No → N4: Individual → N5: No Break | Must claim that if the intermittent resource fails, the agent has lost a part of their mind, not just a tool. |

  ### Diagnosis of Unoccupied/Hybrid Spaces
  *   **Leaf 3 (Trust-Limited Extension):** This space is largely unoccupied because it is unstable. If one accepts Otto's notebook (N1), one usually accepts the Parity Principle, which forces acceptance of the CAD case (N3) unless one introduces an ad hoc 'trust' clause. Most who demand trust apply it to Otto as well, collapsing this leaf into Internalism.
  *   **Leaf 6 (Continuous-Coupling Extension):** This space is unattractive because it conflicts with standard epistemology regarding dispositional belief. We do not say we stop believing our own biological memories when we are asleep or not currently recalling them; drawing the line at 'constant coupling' for external resources seems arbitrary.

  ---

  ## Structural Limitations and Vulnerabilities

  ### Indistinguishable Leaves
  **Pair:** **Strict Neurobiological Internalism (Leaf 1)** and **Embedded Cognition (Leaf 2)**.
  **Reason for Failure:** This tree cannot reliably separate these positions given the phrasing of Node 2. Both positions draw a boundary at the "organism," but they define "organism" differently. An Internalist might argue that a fully integrated Neural Lace *becomes* biological tissue via plasticity (answering "Origin Matters" by redefining origin), while an Embedded theorist might argue it remains a tool despite integration. If both answer that the Lace is "Internal," they collapse into the same leaf despite having different theoretical commitments about the nature of the boundary (biological vs. functional). The failure stems from the **under-described scenario** regarding the degree of biological integration.

  ### Vulnerability and Restructuring
  **Most Vulnerable Branch Logic:** **Node 1 (Otto).**
  The distinction between "Constitutive" and "Causal" is the primary fracture point. If empirical research into **neural plasticity** demonstrates that the brain physically rewires itself to treat external tools (like notebooks or interfaces) with the same synaptic weight as biological memory, the "Causal" branch becomes empirically untenable.
  **Restructuring Trigger:** A finding that **representational content** is not localized in the brain but is a dynamic property of the brain-tool loop would force a collapse of Node 3. If content is not "in the head" to begin with, the question of whether opacity precludes extension (Node 3) becomes nonsensical, requiring the tree to be restructured around *coupling dynamics* rather than *resource location*.
