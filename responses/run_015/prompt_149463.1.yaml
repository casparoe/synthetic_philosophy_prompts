      *   End-check: They need to rewrite a scene or pitch a plot twist that *subverts* the analogy, not just avoids it.
      *   Refusals: Don't teach actual history, don't solve geopolitics, don't debate specific current events (too heated).
      *   Settled vs. Contested: Settled = analogies carry normative weight. Contested = Is Thucydides Trap real?

  3.  **Brainstorming the Dependency Chain:**
      *   *Level 1:* Writers think analogies = truth.
      *   *Level 2:* Writers need to see analogies = arguments (rhetorical devices).
      *   *Level 3:* Writers need to see states != people (ontology mismatch).
