      *   *Key Concept:* **The Map is Not the Territory, and the Analogy is Not the Map.** Actually, simpler: **Analogies are Arguments, Not Evidence.** When a character says "This is Munich," they aren't describing reality; they are making a bid for power.

  5.  **Developing the Carrying Example:**
      *   Needs to be fictional so they don't argue history.
