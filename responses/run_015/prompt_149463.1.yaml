  6.  **Sequencing the Misconceptions:**
      *   *Munich:* The belief that inaction = moral failure. (Head off: Inaction might be strategic delay).
      *   *Vietnam:* The belief that intervention = inevitable sinkhole. (Head off: Intervention might succeed if goals are limited/defined).
