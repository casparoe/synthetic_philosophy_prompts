answer: |-
  **Workshop Plan: The Trap of the Past**
  **Time:** 90 Minutes
  **Audience:** 5 Fiction Writers (Political Thriller Draft)
  **Goal:** Move historical analogies from "plot truth" to "character weapon."

  ### 1. The Prerequisite Idea (0–15 mins)
  You guessed close, but it's sharper than "states vs. systems." The idea that must land first is: **Analogies are Arguments, Not Evidence.**

  Writers treat analogies like a lens the reader looks *through* to see the truth. You need them to see analogies as a weapon a character looks *down* to force a specific outcome. When a General says "This is Munich," he isn't describing the situation; he is trying to shut down debate and force a strike. He is smuggling in a moral premise (appeasement = evil) without proving it applies here.

  **The Hook:**
  Don't talk history. Talk about *scene objective*.
  Ask them: "In your draft, who benefits if the protagonist believes this is Munich?"
  If the answer is "The plot needs tension," you've failed. If the answer is "The hawkish advisor needs to sideline the diplomat," you're writing philosophy.

  **The Rule:** No analogy survives contact with a character's self-interest.

  ### 2. The Carrying Example: "The Kerch Strait Crisis" (15–45 mins)
  We aren't analyzing 1938 or 1965. We are analyzing a fictional scenario you project on the screen. This keeps them from arguing facts and forces them to argue structure.

  **The Scenario:**
  *   **Nation A (Established Power):** Democratic, slowing economy, aging fleet.
  *   **Nation B (Rising Power):** Autocratic, building islands in a shared strait, claiming historical rights.
  *   **The Spark:** Nation B seizes a civilian cargo ship from Nation A.
  *   **The Room:** The President of Nation A sits with three advisors.

  **The Sequence of Misconceptions:**
  Run this scenario three times, each time introducing a different advisor who invokes a different trap.

  1.  **The Munich Trap (Moral Clarity):**
      *   *Advisor 1:* "If we don't sink their patrol boat now, they'll take the whole strait. It's 1938 all over again."
      *   *The Break:* Head this off by asking the writers: "What does Nation B want?" If Nation B wants economic integration, not conquest, the analogy breaks. Munich assumes a unitary expansionist villain. If Nation B is fragmented (military vs. merchants), the "Hitler" frame is wrong.
      *   *Lesson:* Analogies assume **Unitary Actors**. Real states are coalitions.

  2.  **The Vietnam Trap (Competence Fatalism):**
      *   *Advisor 2:* "If we sink the boat, we're bogged down in a naval insurgency for ten years. We can't win."
      *   *The Break:* Head this off by asking: "What is the exit condition?" Vietnam assumes undefined goals + open-ended commitment. If Nation A's goal is "sink one boat and leave," the quagmire frame is lazy.
      *   *Lesson:* Analogies assume **Fixed Constraints**. Real strategy defines limits.

  3.  **The Thucydides Trap (Structural Inevitability):**
      *   *Advisor 3:* "It doesn't matter what we want. Rising power meets established power. War is physics."
      *   *The Break:* This is the hardest one. Head it off by asking: "Who pulls the trigger?" Physics doesn't pull triggers. People do. This analogy removes agency from the protagonist. If war is inevitable, the thriller has no plot, only a countdown.
      *   *Lesson:* Analogies assume **Determinism**. Thrillers require **Choice**.

  *(Note: Spend 10 mins here letting them shout out why each advisor is manipulating the President.)*

  ### 3. The End-Check: "The Motivation Rewrite" (60–80 mins)
  We need to know they aren't just cynical ("History is useless"). They need to know how to *use* the flaw.

  **The Exercise:**
  Take a scene from one of their drafts (or a provided template) where a character invokes one of these three traps.
  **Task:** Rewrite the dialogue so the *listener* dismantles the analogy not by citing different history, but by exposing the *speaker's motive*.

  **Success Criteria:**
  *   **Fail:** "Actually, this isn't like Munich because the economics are different." (This is just arguing history).
  *   **Pass:** "You're calling this Munich because you need a budget approval next week, not because you believe we're facing Hitler."

  If they can make the analogy about *power dynamics in the room* rather than *truth about the world*, they've got it.

  ### 4. What to Refuse (80–85 mins)
  Be explicit about what you won't do. This protects your time and their sanity.

  1.  **No History Lessons:** If they ask "But wasn't Chamberlain actually..." shut it down. "We are writing fiction, not grading papers. Does the character *believe* it? That's all that matters."
  2.  **No Current Events:** Do not let them map this to Ukraine, Gaza, or the South China Sea. It heats the room and distracts from craft. Keep it in "Nation A/B."
  3.  **No Solving Geopolitics:** You aren't teaching them how to prevent war. You're teaching them how to write a scene where prevention is dramatized.

  ### 5. Settled vs. Contested (85–90 mins)
  Close by distinguishing philosophical fact from debate. Don't blur these.

  **Settled (Teach as Fact):**
  *   Analogies smuggle in hidden normative premises (e.g., "Appeasement is always wrong").
  *   Analogies reduce complexity to fit a narrative arc (just like a plot does).
  *   Using an analogy is a speech-act intended to constrain future options.

  **Contested (Teach as Debate):**
  *   **The Thucydides Trap:** Is this a real structural pattern observed by political scientists, or is it a narrative story Graham Allison imposed on the data? Some say war is inevitable in power transitions; others say it's mostly coincidental.
  *   *Instruction to writers:* If your character believes Thucydides is real, they act fatalistic. If they believe it's a myth, they act agile. **The truth matters less than the character's belief in the truth.**

  ***

  **Tutor's Note:**
  Keep an eye on the writer who wants to be "accurate." Accuracy is the enemy of the thriller. Truth is what the character believes under pressure. If you see them reaching for a book, tell them to close it and look at their advisor's bank account instead.

  (Also, I noticed I wrote "seperate" in my head earlier—glad I caught that before typing the plan, though I'll leave the rest human.)
