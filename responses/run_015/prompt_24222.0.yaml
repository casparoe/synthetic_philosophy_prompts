      *   *Commitment 3 (Objectivity)* vs. *Commitment 5 (Robustness to Model Error)*: This is the sharpest tension. If the penalty must be *objective* (same physical intervention gets same score regardless of agent's model), but the agent's model is wrong, how do you calculate the penalty? The penalty must be calculated *by* something. If it's calculated by the agent, it depends on the agent's model (violating 3). If it's calculated by an external oracle, that oracle needs a model of the world. If the oracle uses the *true* dynamics, it satisfies 3, but can the agent access this penalty to learn? If the agent doesn't know the penalty, it can't optimize against it. If the penalty is based on the agent's *belief* to guide learning, it violates 3.
