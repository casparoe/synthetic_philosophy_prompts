answer: |-
  # The Non-Domination Audit Protocol (NDAP)
  **Version:** 1.0 (Draft for Oversight Board)
  **Time Budget:** 30 Minutes per Proposal
  **Operator:** Policy Staff (Non-Philosopher)

  ## Part 1: The Decision Procedure

  This protocol isolates three distinct liberty claims. You must complete Step 1 and 2 before Step 3. Step 3 is the primary "Freedom Risk" indicator for this board.

  ### Step 1: The Interference Check (Negative Liberty)
  *Goal: Identify direct option-restriction.*
  1.  **Does the regulation physically or legally prevent a specific action?** (e.g., "You cannot build here," "You cannot move after 8 PM.")
      *   **NO:** Proceed to Step 2.
      *   **YES:** **FLAG [Negative Liberty Impact].**
          *   *Action:* Document the restricted action.
          *   *Stop/Go:* This is not necessarily a veto. Many laws restrict options. Proceed to Step 3 to determine if the restriction constitutes *domination*.

  ### Step 2: The Capacity Check (Positive Liberty)
  *Goal: Identify enablement or resource allocation.*
  1.  **Does the regulation provide resources, authority, or capability to a specific group that they lacked before?** (e.g., "Subsidies for X," "Training for Y.")
      *   **NO:** Proceed to Step 3.
      *   **YES:** **FLAG [Positive Liberty Impact].**
          *   *Action:* Document who gains capacity.
          *   *Note:* Gains in positive liberty often justify losses in negative liberty. Do not veto here. Proceed to Step 3.

  ### Step 3: The Domination Check (Republican Liberty)
  *Goal: Identify latent structures of arbitrary power.*
  *Definition:* Domination exists if an agent (the State/Contractor) has the **capacity** to interfere in a person's choices, and that capacity is **not effectively constrained** by the person's ability to contest it.
  *Key Test:* **Reachable Contestation.** A contestation path is *unreachable* if using it imposes ruinous costs (financial, temporal, or reputational) on the average affected subject.

  **Q3.1: Is there a power asymmetry?**
  *   Does the regulation grant an official/algorithm/agency discretion to make decisions affecting a subject's status, benefits, or movement?
      *   **NO:** **PASS.** (No domination risk).
      *   **YES:** Proceed to Q3.2.

  **Q3.2: Is the power tracked by the subject's interests? (The Arbitrariness Filter)**
  *   Are there clear, public criteria limiting the decision-maker's discretion?
      *   **YES:** Proceed to Q3.3.
      *   **NO:** **STOP. HIGH DOMINATION RISK.** (Power is untracked/arbitrary by definition).

  **Q3.3: Is there a formal contestation path?**
  *   Is there a written mechanism to appeal or challenge the decision (court, board, ombudsman)?
      *   **NO:** **STOP. HIGH DOMINATION RISK.**
      *   **YES:** Proceed to Q3.4 (The Reachability Test).

  **Q3.4: The Reachability Test (Crucial Step)**
  *   Evaluate the formal path against the **Average Subject Profile** (ASP).
  *   **Cost:** Does the fee/cost exceed 5% of the ASP's monthly income?
  *   **Time:** Does the process exceed 30 days without interim relief?
  *   **Risk:** Does initiating appeal risk retaliation (e.g., loss of other benefits, blacklisting)?
      *   **If ANY are YES:** **FLAG [Latent Domination].** The path is theoretically open but practically closed. The power remains arbitrary *for the subject*.
      *   **If ALL are NO:** **PASS.** (Power is constrained by reachable contestation).

  ---

  ## Part 2: Case Applications

  ### Case A: AI Welfare Allocation System
  *Draft:* Benefits assigned via proprietary algorithm. Reasons for denial are "trade secrets." Appeal requires submitting a paper form to the same agency that runs the AI.
  *   **Step 1 (Negative):** Flags (Denial restricts access to resources).
  *   **Step 2 (Positive):** Pass (System aims to distribute welfare).
  *   **Step 3 (Domination):**
      *   Q3.1 (Asymmetry): Yes (Agency controls benefits).
      *   Q3.2 (Tracked): **NO.** Criteria are opaque ("trade secrets").
      *   **Result:** **STOP. HIGH DOMINATION RISK.**
      *   *Analysis:* The subject cannot know *why* a decision was made, so they cannot formulate a contestation. The will of the agency is inherently arbitrary.
      *   *Recommendation:* Reject draft unless code transparency or independent audit is mandated.

  ### Case B: Zoning Ordinance with High Appeal Fee
  *Draft:* Variances allowed. Appeal fee set at $25,000. Median local income is $62,500/year (~$5,200/month).
  *   **Step 1 (Negative):** Flags (Restricts land use).
  *   **Step 2 (Positive):** Pass.
  *   **Step 3 (Domination):**
      *   Q3.1 (Asymmetry): Yes (Board controls land use).
      *   Q3.2 (Tracked): Yes (Zoning codes are public).
      *   Q3.3 (Formal Path): Yes (Appeal process exists).
      *   Q3.4 (Reachability): **FAIL.** Fee is ~480% of monthly median income. Far exceeds 5% threshold.
      *   **Result:** **FLAG [Latent Domination].**
      *   *Analysis:* While the power is tracked by public code, the check on that power is purchasable only by the wealthy. For the ASP, the Board's will is arbitrary because it cannot be challenged without ruinous cost.
      *   *Recommendation:* Cap fees at sliding scale or waive for hardship.

  ### Case C: Emergency Public Health Movement Restriction
  *Draft:* 30-day restriction on movement in Zone X. Enacted by elected legislature. Sunset clause included. Judicial review available *ex post*.
  *   **Step 1 (Negative):** **FLAG.** (Severe restriction on movement).
  *   **Step 2 (Positive):** Pass (Protects public health capacity).
  *   **Step 3 (Domination):**
      *   Q3.1 (Asymmetry): Yes (State controls movement).
      *   Q3.2 (Tracked): Yes (Public health criteria, democratic vote).
      *   Q3.3 (Formal Path): Yes (Judicial review).
      *   Q3.4 (Reachability): **FAIL (Potential).**
          *   *Cost:* Litigation costs exceed 5% income for ASP.
          *   *Time:* Judicial review takes months; restriction is 30 days. Relief is not interim.
          *   *Risk:* Chilling effect on challenging state emergency powers.
      *   **Result:** **FLAG [Latent Domination].**
      *   *Analysis:* Despite democratic legitimacy and sunset clauses, the *individual* subject has no reachable path to contest the application of the rule *while it is happening*. The state holds arbitrary power over the individual for the 30-day window because the check (courts) is too slow/expensive to be effective.
      *   *Recommendation:* **Procedural Collapse.** (See Critique below).

  ---

  ## Part 3: Theoretical Audit & Pushback

  You asked me not to politely hand you a broken checklist. Here is where the NDAP breaks, where it smuggles politics, and where your theoretical framing conflicts with standard Republicanism.

  ### 1. The "Democratic Mandate" Contradiction
  In Case C, the procedure flags a democratically enacted law with judicial oversight as "Domination."
  *   **The Conflict:** Standard Republican Theory (Pettit) argues that power is *non-arbitrary* if it is forced to track the common avowable interests of the people, typically secured through democratic control. If the legislature (democratic) passes it, and courts (independent) review it, Pettit would likely call this **Non-Dominating**.
  *   **Your Twist:** You defined arbitrariness via *individual reachable contestation*. This shifts Republicanism from a **systemic** theory (is the state controlled by the people?) to an **individualist** theory (can *I* stop the state?).
  *   **The Consequence:** The NDAP treats democratic legitimacy as irrelevant if the individual lacks standing/resources. This is a radical, libertarian-adjacent interpretation of Republicanism. It is defensible, but you must admit it deviates from the canon. You are prioritizing *access to justice* over *democratic authorization*.

  ### 2. Operationalizing "Ruinous Cost" is Political, Not Philosophical
  Step 3.4 (The Reachability Test) requires setting thresholds (5% income, 30 days).
  *   **The Problem:** There is no philosophical formula for "ruinous." Is 5% ruinous? For a single parent, yes. For a corporation, no.
  *   **The Smuggle:** By setting these thresholds, you are making a distributive justice judgment. You are deciding how much inequality in legal access is permissible before it becomes "domination."
  *   **The Risk:** Staff will treat the 5% threshold as a scientific fact. It is a political value choice. If the Board adopts this, they are effectively setting welfare policy (legal aid funding) under the guise of liberty auditing.

  ### 3. The "Latent" Trap
  You want to flag structures where power *isn't* exercised.
  *   **The Strength:** This catches the Zoning Fee case perfectly. The Board might never deny a variance, but the *threat* dominates because the appeal is too expensive.
  *   **The Weakness:** In the Health Mandate case, the state *is* exercising power (interference). The NDAP conflates **Interference** (Step 1) with **Domination** (Step 3).
  *   **Critique:** Republicanism allows for non-arbitrary interference (e.g., just laws). If the NDAP flags the Health Mandate as Domination solely because appeal is costly, it implies that *any* law the poor cannot afford to challenge is domination. This leads to anarchy or a requirement for state-funded counsel for all regulatory challenges. That is a massive policy shift disguised as a "liberty check."

  ### 4. Is This Defensible?
  **Yes, but only as a "Radical Accessibility" Tool, not a pure "Republican Liberty" Tool.**
  *   **If you claim this is Pettit:** You will be challenged. Pettit relies on *systemic* contestability (elections, ombudsmen), not necessarily *individual* affordability of litigation.
  *   **If you claim this is "Access-to-Justice Republicanism":** It is defensible. It argues that without material capacity to contest, formal rights are fiction.
  *   **The Verdict:** You are dressing a **resource redistribution argument** (legal aid, fee caps) in **ontological liberty language** (domination).
      *   *Is this bad?* No. It's effective advocacy.
      *   *Is it honest philosophy?* No. It collapses the distinction between "freedom from domination" and "equality of capability to litigate."

  ### Recommendation for Implementation
  1.  **Rebrand Step 3.4:** Call it the "Material Accessibility Check." Do not claim it measures "arbitrariness" in the abstract; admit it measures "class-based barriers to contestation."
  2.  **Add a "Systemic Control" Bypass:** In Step 3.2, add a clause: "If the regulation was passed by direct vote or supermajority with explicit sunset clauses, mark as 'Systemically Constrained'." This prevents the tool from flagging every emergency democratic mandate as domination, aligning it closer to standard Republican theory while keeping the focus on the *implementation* barriers (Step 3.4).
  3.  **Own the Value Judgment:** In your memo to the Board, state clearly: *"This tool assumes that a right without a reachable remedy is a tool of domination. This requires us to treat legal costs as liberty violations."*

  **Final Word:** You are not building a neutral philosophical instrument. You are building a lever to pry open access to justice. That is good work. But do not pretend the lever is made of logic alone; it is made of politics.
