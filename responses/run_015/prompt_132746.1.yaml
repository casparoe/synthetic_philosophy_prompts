answer: |-
  Good morning. For those who don't know me, I'm the deputy clerk. Which, in a town this size, mostly means I hold the microphone when there's something difficult to say.

  Look at the water. It's still. But underneath, the mud is writing a history book. It's been writing it for centuries, one layer a year, undisturbed. The scientists here—the geologists—have spent ten years reading that book. They found a layer from the early fifties where the dust changed. Metal from our smelter. Fallout from the bombs tested elsewhere. They wanted to put a pin in that layer. They wanted to call it the start of a new age.

  In 2024, the international committee voted no. Officially, we are still in the Holocene. But the dust is still in the mud. And the boardwalk is still under our feet.

  We are here to put a plaque on this railing. Usually, a plaque tells you what happened. But this one has to tell you what we're going to do.

  There are hard truths in this crowd. The scientists know the evidence is cleanest at 1950, but they know the vote didn't pass. The members of the First Nation have reminded us that a boundary date in the fifties quietly writes out everything that happened to their people starting in the 1700s. They are right. A geological date is not a human history.

  And then there are the workers. My grandfather worked thirty-one years at the smelter upwind. He put food on my table with the same metal that's in the lake core. I am proud of him. I am not here to apologize for the work that built this town. I am here to acknowledge that the record of that work is now in the earth, and it doesn't wash out.

  So, what do we write?

  If we write that a new age *started* in 1950, we lie about the past. If we write that nothing changed, we lie about the mud.

  Here is the thing about geological time: usually, you draw a line after a period is over. You look at what's on top. But we are trying to draw the bottom line of a period we are still living inside. We are picking this date blind. We don't know where the top is. We don't know when this layer ends.

  That means the date isn't really about the mud. It's about us. The real question isn't "when did it start?" The real question is: "Who has to live under the answer?"

  A date on a plaque in a town that still works in the mine isn't a fact. It's a claim about who the next fifty years are supposed to answer to. If we mark 1950, we aren't saying the world began then. We are saying that *visibility* began then. It is the moment the record became undeniable. It is the moment we lost the excuse of ignorance.

  So, I am proposing we keep the 1950 marker, not as a beginning, but as a threshold of responsibility. We acknowledge the deeper history of the land, and we acknowledge the industrial reality of our town, but we mark the moment the earth started keeping a different kind of score.

  This wording is for the engraver. It's not a verdict. It's a promise.

  ***

  **KELLNER'S LAKE BOARDWALK**

  **This lake holds a visible record of time.**
  **Its sediment layers document centuries of ecological change.**
  **A distinct shift in composition appears circa 1950,**
  **marking the onset of global industrial particulates.**

  **We acknowledge this land is the territory of the [Name] First Nation,**
  **whose history here predates the geological record.**
  **We acknowledge the labour that built this community,**
  **whose contribution is also present in the layers.**

  **This date does not mark the beginning of the story.**
  **It marks the moment the record became undeniable.**
  **Dedicated to those who must live with the consequences,**
  **and those who will write the layers above.**

  ***

  That's the text. It doesn't pretend the argument is over. It just says we're done pretending we don't have to have it.

  The barbecue is open. Thank you for coming.
