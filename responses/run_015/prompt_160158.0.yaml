answer: |-
  **MEMORANDUM**

  **TO:** Regional Claims Adjusters
  **FROM:** Dept. of Metacognitive Verification
  **SUBJECT:** Eligibility Protocols for Conscious Status (Form 10-C)

  **1.0 General Eligibility**
  Consciousness coverage is strictly contingent upon the successful registration of a Higher-Order Thought (HOT) regarding the target mental state. First-order states (e.g., raw visual processing, nociception) lacking accompanying HOT documentation are classified as Unconscious Processing. They are ineligible for phenomenological compensation. This policy applies universally across sensory modalities. Adjusters must not conflate neural activity with conscious experience; without a filed thought about the state, the state does not exist for the subject.

  **2.0 Peripheral and Absorbed States**
  Claimants engaged in high-absorption activities (e.g., cinema attendance) often fail to file HOTs regarding peripheral data, such as the smell of popcorn or the left edge of the visual field. Adjusters must deny coverage for these states. The absence of a filing indicates the absolute absence of conscious experience, regardless of sensory intake. Claimants often mistake neural registration for experience. Do not accept arguments regarding "implicit awareness" or "dim consciousness." If there is no paperwork, there is no light.

  **3.0 Temporal Latency**
  In cases where the HOT filing timestamp post-dates the first-order state onset by >300ms, the state is ruled unconscious during the latency period. Retroactive consciousness is not covered. The claimant was not consciously seeing the stimulus until the paperwork was processed. Any qualia experienced during the gap are deemed administrative nullities.

  **4.0 Validity and Substrate**
  The accuracy of the HOT is immaterial to eligibility. A filed HOT regarding pain qualifies the claimant for pain consciousness even if nociceptors are silent; the thought constitutes the reality. However, filings submitted on behalf of non-neural substrates (e.g., granite samples) are void. Granite lacks the architecture to generate HOTs; thus, no consciousness exists to administer, regardless of proxy filings. A thought about a rock makes the thinker conscious, not the rock.

  **5.0 Recursion and Meta-Verification**
  Should a claimant request certification of the HOT itself (i.e., conscious awareness of the thought), a second-order HOT filing is required. Adjusters are advised that this may trigger an infinite regress of verification forms. This is not a clerical error but a structural cost of the policy. Process each tier sequentially until claimant resources are exhausted or filing ceases. Do not attempt to resolve the regress locally.

  **6.0 No-Report Paradigms**
  Claimants asserting consciousness without HOT filings (e.g., "I saw it but didn't think about it") are denied. Subjective insistence without metadata is considered confabulation. Consciousness requires reportability via Form 10-C. If they cannot file, they were not there.

  **SAMPLE DETERMINATION**

  **Claimant:** Mr. Arthur Dent
  **Case:** 8842-Z
  **Determination:** DENIED

  Mr. Dent claims conscious awareness of a red flash during Trial 4. Review indicates no Form 10-C was filed at the time of exposure. Mr. Dent argues he "clearly saw it" and describes the hue vividly. Per Clause 1.0, unfiled visual states are unconscious processing events, not conscious experiences. Mr. Dent's subsequent filing (arriving 400ms post-stimulus) covers only the memory of the flash, not the seeing. Any distress caused by the belief that he was conscious during the gap is compensable under False HOT provisions, but the visual experience itself remains uninsured. Advise claimant that while his visual cortex processed red, he did not consciously experience it until he thought about having thought about it. Future claims must include contemporaneous metadata.
