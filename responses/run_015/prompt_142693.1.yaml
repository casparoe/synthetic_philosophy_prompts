      *   **Step (4):** *Here is the suspect move.* "Any particular act can be embedded in some globally optimal life-policy." Is this true? Can a *gratuitous* theft be part of an *optimal* policy?
          *   If the theft is truly gratuitous (costs resources, risks punishment, gains nothing), it lowers the global utility. To make it "optimal," you'd have to construct a bizarre counterfactual scenario where *not* stealing causes disaster. But the premise says "gratuitous."
          *   More importantly, the *policy* must be *predictable* and *stable* to do the work it did in the Hitchhiker case. A policy that says "Steal once for no reason" doesn't generate the positive predictive evidence needed to secure the "global optimum" benefits in the first place.
      *   **Step (5):** Follows from (4), so if (4) is weak, (5) is weak.
