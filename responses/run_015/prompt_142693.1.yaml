      *   **Key Insight:** The Hitchhiker logic only licenses locally suboptimal acts if those acts are *constitutive* of a disposition that *causally (or evidentially) secures* the global benefit. A gratuitous theft does not secure a benefit; it burns resources. Therefore, a policy including it is *not* globally optimal.

