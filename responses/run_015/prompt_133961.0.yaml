answer: |-
  ### Audience Priors Brainstorm

  *   **Critical Theory Grads (The Majority):** They view culture as superstructure. They suspect any argument that "culture causes economics" is idealist nonsense or apologia for capital. They see TikTok not as a culture-maker but as a capital-extraction machine. They will instinctively reject "asceticism" in a consumer platform.
  *   **Visiting Weber Scholar:** They care about textual fidelity. They know Weber's *Verstehen* and "elective affinity" are nuanced. They will smell a strawman if you simplify Weber's causality to "norms → money." They might defend Weber against your "smuggling" charge.
  *   **Quant Sociologist:** They care about identification. To them, "values" are endogenous variables or post-hoc rationalizations. They will ask: "Where is the variation? How do you measure the loop?" They will view your mechanism as untestable storytelling.
  *   **You (The Presenter):** You are arguing for a *mechanism* (algorithmic loops) that repairs a *theoretical flaw* (normative/explanatory confusion). Your vulnerability is empirical proof and textual accuracy.

  ***

  ### Q&A Prep Sheet: Objections Ordered by Damage

  #### 1. The "Weber Strawman" Objection (Visiting Scholar)
  **The Objection:** "You're claiming Weber smuggles norms into causality, but that's a caricature. Weber talks about 'elective affinity,' not linear causation. He never argued asceticism *alone* created capitalism; it was institutional conjunction. Are you attacking Weber or a simplified textbook version of him?"

  **90-Second Reply:**
  "That's a fair textual correction, and I concede Weber's own writing is more nuanced than the 'Weberian tradition' that followed. However, my thesis targets the *sociological utility* of the model as it's been operationalized for a century. Even if Weber wrote in affinities, social science has consistently treated 'Protestant Ethic' as a variable that explains economic outcomes via normative commitment. That's the model that fails—it can't separate the explanation from the justification of the work ethic itself.
  My repair isn't about saving Weber's text; it's about saving the *insight* that cultural loops drive economic behavior without requiring theological sincerity. By shifting to algorithmic taste-cultures, I'm showing how norms can be causally effective through feedback loops rather than internal belief. So, even if I'm attacking a stylized Weber, I'm attacking the stylized Weber that actually powers contemporary cultural sociology. I want to keep the mechanism but drop the theology."

  **Weakest Link:** You risk alienating the expert by implying their textual precision doesn't matter for the sociological argument. It sounds like you're dodging the fidelity charge.

  #### 2. The "False Asceticism" Objection (Critical Theory Grads)
  **The Objection:** "This isn't asceticism; it's consumerism. Craft TikTok is about buying the right cameras, lights, and tools to perform productivity. You're mistaking gear acquisition for spiritual discipline. Isn't this just capitalism co-opting the language of restraint to sell more stuff?"

  **90-Second Reply:**
  "I agree it looks like consumerism on the surface, but the distinction lies in the *telos* of the consumption. In traditional consumerism, goods are for enjoyment or status display. In this algorithmic loop, goods are purchased strictly as inputs for further production that often yields no profit. The 'asceticism' is in the labor discipline: the rigid posting schedules, the self-surveillance of analytics, and the deferred gratification of 'building an audience' that may never monetize.
  They aren't buying lights to watch movies; they're buying lights to work weekends. That mirrors the Protestant distinction between enjoying wealth versus reinvesting it. The theology is gone, but the behavioral structure—delayed gratification for the sake of the work itself—is identical. It's a pseudo-asceticism because the 'calling' is to the algorithm, not God, but the economic behavior it generates is functionally the same."

  **Weakest Link:** It's hard to fully disentangle this from "influencer capitalism." If any of these creators monetize, the asceticism claim collapses into standard profit-seeking.

  #### 3. The "Tech Determinism & Missing Ethnography" Objection (The Prayer)
  **The Objection:** "You haven't done the platform ethnography. How do you know the recommendation loop *causes* the behavior and didn't just select for people who were already productive? This sounds like tech determinism—assuming the code dictates the culture without showing how users actually engage."

  **90-Second Reply:**
  "That is the primary empirical limitation of this talk, and I appreciate you flagging it. I am not arguing for hard determinism where the code forces behavior. Rather, I'm proposing a *structural affordance* model. The algorithm rewards specific temporal patterns—consistency, retention, engagement—which users actively optimize for.
  Whether they were productive before doesn't matter; the loop *stabilizes* the behavior into a norm. My claim is theoretical: that this feedback mechanism replicates the causal structure Weber identified without the theological variable. I'm not claiming the algorithm is the sole cause, but that it acts as the institutional scaffold that makes the norm self-reinforcing. The ethnography is the necessary next step to trace the micro-interactions, but the macro-structural analogy holds even without it."

  **Weakest Link:** Admitting you haven't done the ethnography makes the causal claim speculative. You are asking them to accept a mechanism without evidence of the micro-foundations.

  #### 4. The "Endogenous Values" Objection (Quant Sociologist)
  **The Objection:** "Values are post-hoc rationalizations. People work hard because they need money or status, then they adopt the 'craft ethic' to justify it. You're treating 'taste' as a causal variable when it's just an outcome of class habitus. How do you isolate the culture from the material incentive?"

  **90-Second Reply:**
  "In standard regression models, I agree, values look endogenous. But algorithmic loops introduce a time-series component that traditional cross-sections miss. The recommendation engine provides immediate, quantitative feedback on cultural performance independent of material reward.
  A creator can get 'likes' (cultural capital) with zero revenue (economic capital). This decouples the validation from the material incentive, allowing the norm to persist even when the economic rationality fails. That's the repair: the algorithm creates a closed loop of validation that sustains the behavior *after* the material incentive drops out. It's not just rationalization; it's a feedback mechanism that alters the cost-benefit analysis of labor in real-time."

  **Weakest Link:** You still haven't explained how to measure this "validation" independently of the behavior it's supposed to explain. It risks sounding like circular reasoning.
