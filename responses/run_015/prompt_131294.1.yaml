  **BUREAU OF LINGUISTIC COMPLIANCE AND ONTOLOGICAL SAFETY**
  **Standard Operating Procedure 41-B**
  **Subject:** Certification of a Field Manual for a Previously Uncontacted Language
  **Date:** 14 October 2023
  **Classification:** PUBLIC / NON-BINDING ONTOLOGY

  **1.0 DEFINITIONS**

  1.1 **Canonical Manual:** A translation schema mapping native utterances to target-language predicates with sufficient consistency to predict assent/dissent behavior under observable stimulation.
  1.2 **Stimulatory Equivalence:** The condition wherein two distinct manuals predict identical behavioral responses from native speakers across all possible sensory encounters.
  1.3 **Compensating Adjustment:** A modification to the translation of logical particles (e.g., identity, plurality, duration) required to maintain Stimulatory Equivalence when rival ontological commitments are adopted.
  1.4 **Fact of the Matter:** Any state of affairs exceeding behavioral disposition. The Bureau does not certify Facts of the Matter.

  **2.0 CERTIFICATION CRITERIA**

  2.1 To receive Certification Mark Ω, a Field Manual must demonstrate that the translation of the native expression *gavagai* as "rabbit" is consistent with all recorded native assents to queries involving pointing, presence, and recurrence.
  2.2 Auditors shall verify that native assent to *gavagai* correlates with the presence of the designated fauna. Where correlation exceeds 95% confidence interval, the manual proceeds to Clause 2.3.
  2.3 Auditors shall verify identity conditions. Upon querying whether *this gavagai* is the *same gavagai* as *that gavagai*, the native's response must align with the target language's criteria for identity.
  2.4 Where a rival manual proposes that *gavagai* denotes "undetached rabbit part" or "temporal stage of a rabbit," the original manual remains certified provided Appendix C (Compensating Adjustments) is applied to the rival schema. The Bureau certifies all manuals achieving Stimulatory Equivalence as equally correct. No preference is granted to common-sense ontology.

  **3.0 DISPUTE RESOLUTION AND PERSONNEL**

  3.1 Fieldworkers are prohibited from asserting that a Certified Manual is *uniquely* true. Compliance requires acknowledgment that rival manuals, adjusted per Appendix C, are functionally identical.
  3.2 Personnel found insisting on unique truth shall be subject to disciplinary review. See Case File 882-Alpha:
  > *Auditor J. Miller was reassigned to Lexical Archiving after submitting a report stating: "I know what they mean. They mean rabbit. The manual isn't just useful; it's right." This assertion posits a Fact of the Matter beyond stimulus response.*
  3.3 Disputes regarding ontological commitment shall be resolved by certifying both incompatible manuals and billing the project for the duplication of resources.

  **4.0 RECURSIVE COMPLIANCE**

  4.1 This Standard is written in English. The Bureau acknowledges that the terms of this Standard are subject to the same indeterminacy as any native language.
  4.2 A rival reading of this document, wherein "clause" denotes "temporal stage of a clause" and "Bureau" denotes "undetached Bureau part," is equally Certified provided Compensating Adjustments are applied to the logical operators herein. Both versions carry the Certification Mark Ω. Users may adopt either ontology without affecting compliance outcomes.^1

  **5.0 APPENDIX C: COMPENSATING ADJUSTMENTS**

  5.1 **Identity Operator:** If *gavagai* = "rabbit part," then "is the same as" must be translated as "belongs to the same whole as."
  5.2 **Pluralization:** If *gavagai* = "temporal stage," then plural endings must be rendered as "stages of the same enduring entity."
  5.3 **Counting:** Numerals must be adjusted to count wholes rather than parts, or stages rather than enduring entities, consistent with the chosen manual.
  5.4 **Generalization:** These adjustments apply to all terms in the target language, including "rabbit," "manual," and "auditor."

  **6.0 EFFECTIVE DATE**

  6.1 This Standard is effective immediately upon issuance. It remains in force until superseded by a manual demonstrating superior predictive power, which the Bureau defines as impossible per Clause 2.4.

  ***

  ^1 *Note: Users requiring a stable ontology for internal accounting may request the "Common-Sense Patch," which asserts unique truth for billing purposes only. This Patch is not certified for field use.*
