answer: |-
  This is a remarkably sharp set of intuitions, and your "Audit Test" is a strong candidate for the normative spine you need. It correctly identifies that moral blame in international relations is not just about *causality* (who pulled the trigger) but about *agency* (who could have stopped the finger).

  However, as you suspect, your intuitive verdicts reveal cracks in the test as currently formulated. Specifically, the test struggles to distinguish between **structural capacity** (could they have stopped it?) and **epistemic clarity** (did they know what they were stopping?).

  Here is the stress test of your Audit Test against your own verdicts, the necessary repair, and the application to your two edge cases.

  ### Part 1: Stress Testing the Audit Test

  Your current formulation: *A political community is blameworthy only if it had a functioning route by which opposition could have registered and actually changed the decision.*

  **1. The Iraq vs. Drone Paradox (The Salience Problem)**
  *   **Your Verdict:** Public blamed for Iraq (2003), not for Drones (post-election).
  *   **The Test's Failure:** In both cases, the US had a functioning press, parliament, and electorate. The "route" existed in both. If the Audit Test relies solely on institutional capacity, it must assign equal blame to the public for both.
  *   **The Fix:** You need a **Salience Clause**. A route for opposition only generates blame if the decision was *knowable and debatable* at the time of the audit (election). Iraq was the central axis of the 2004 election; the drone program was classified, bureaucratic, and low-salience.
  *   **Repair:** *Blame scales not just by the existence of opposition routes, but by the visibility of the specific policy within the public sphere.*

  **2. The Austria-Hungary Inconsistency (The Foreseeability Problem)**
  *   **Your Verdict:** Austria gets blame for the Balkan war, but you hesitate to blame them for the *World* War, despite foreseeability.
  *   **The Test's Failure:** Austria had very poor opposition routes (Imperial Autocracy). The Audit Test suggests near-zero public blame. But you feel they bear *some* responsibility for the escalation.
  *   **The Fix:** Distinguish **State Blame** from **Community Blame**. The Audit Test is excellent for assigning blame to a *public* (complicity). It is less useful for assigning blame to a *state* (causality). Austria's *state* is blameworthy for lighting a match in a powder keg (foreseeability), even if its *public* had no route to stop them.
  *   **Repair:** *The Audit Test applies to Democratic Complicity. A separate principle of Causal Recklessness applies to State Actors.*

  **3. Germany 1914 vs. Germany 2003 (The Agency Gradient)**
  *   **Your Verdict:** "Germany started it" (Yes), "Germans started it" (No/Balk). vs. "America started it" (Yes), "Americans started it" (Yes).
  *   **The Test's Success:** This is where your test shines. In 1914, the German Reichstag had budgetary power but could not dismiss the Chancellor or the Kaiser. The "route" was clogged. In 2003, the US electorate could theoretically punish the administration.
  *   **Verdict:** Keep this. It explains why Fischer's *Griff nach der Weltmacht* (a state conspiracy) feels different than a national guilt. The German *State* had agency; the German *People* had limited agency.

  **4. Versailles (Blame vs. Liability)**
  *   **Your Verdict:** War-guilt clause was corrupt; blame $\neq$ liability.
  *   **The Test's Success:** The Audit Test measures moral/political responsibility. Liability is a legal/financial transaction. You can be liable for damage you caused accidentally (strict liability), but you are only blameworthy for damage you caused negligently or intentionally.
  *   **Verdict:** Keep this distinction. It is vital for your piece. Fischer proved intent (Blame); Versailles demanded reparations (Liability). Clark argues accident (No Blame); but Liabilities (dead bodies) still exist.

  ### Part 2: The Repaired Principle

  To make your spine hold, I suggest renaming and refining the "Audit Test" into **The Effective Agency Principle**.

  > **A political community shares blame for a war to the extent that it possessed Effective Agency over the decision.**
  >
  > **Effective Agency = (Institutional Power) $\times$ (Information Clarity) $\times$ (Decision Salience).**

  *   **Institutional Power:** Could they vote the leaders out? (Fixes Germany 1914 vs. US 2003).
  *   **Information Clarity:** Did they know the war was happening/happening covertly? (Fixes Iraq vs. Drones).
  *   **Decision Salience:** Was the war the main issue, or a footnote? (Fixes Iraq vs. Drones).

  **Which verdicts must you give up?**
  You must surrender the idea that Austria-Hungary escapes blame for the *World War* simply because they didn't want a World War. Under Effective Agency, the Austrian *State* retains high blame for Causal Recklessness, even if the Austrian *Public* has low blame for Complicity. You need to be comfortable saying: *"The Austrian Emperor was guilty; the Austrian people were not."* Your current hesitation blurs this.

  ### Part 3: The Two Edge Cases

  Here is how the **Effective Agency Principle** handles your undecided cases.

  **Case 1: The Referendum War (58% Authorization)**
  *   **Analysis:**
      *   *Institutional Power:* Maximum (Direct Vote).
      *   *Information Clarity:* High (Explicit referendum question).
      *   *Decision Salience:* Maximum (The only issue on the ballot).
  *   **Verdict:** **The Public bears primary blame.** The leader is reduced to an executioner of the popular will.
  *   **Alignment:** This matches your instinct ("public eats most of the blame").
  *   **Nuance:** The 42% opposition matters. Blame is not uniform across the community; it is proportional to the vote share. The 58% are complicit; the 42% are victims of the tyranny of the majority. This adds texture to your piece: "Germans started it" is false because not all Germans cheered. "Americans started it" is false because 48% voted Kerry. Blame is always fractional.

  **Case 2: The Automated Accidental War (4-Minute Window)**
  *   **Analysis:**
      *   *Institutional Power:* Zero (at the moment of crisis).
      *   *Information Clarity:* Zero (System error).
      *   *Decision Salience:* Zero (No decision, only reaction).
  *   **Verdict:** **No one is to blame for the *trigger*.**
  *   **Is this a Reductio?** No, but only if you relocate the timeline of the Audit.
  *   **The Relocation:** The "Audit" does not happen at T-minus-4-minutes. It happens at **T-minus-5-Years**, when the system was funded, built, and deployed.
  *   **Who is Blamed?** The political community that authorized a system which removed human agency from the kill chain.
  *   **Why this matters for your Fischer piece:** This is the ultimate Fischer argument. The Schlieffen Plan *was* an automated early-warning system. It was a mobilization timetable that, once started, could not be stopped by diplomats. Germany was not blamed just for firing the gun, but for *loading the gun and leaving it on the table with the safety off*.
  *   **Conclusion:** If the system was fielded by a democracy with high Effective Agency, the public is blameworthy for the accident. If fielded by an autocracy, the State is blameworthy. If the system was fielded secretly (like Drones), no one is blameworthy except the engineers/operators.

  ### Part 4: The Normative Spine for Your Article

  You are writing about the *afterlife* of the Fischer controversy. The shift from Fischer to Clark is not just a shift in archival evidence; it is a shift in how we conceive of **Agency**.

  1.  **Fischer (1961):** Argued that Germany had **High Effective Agency**. The elites chose war. Therefore, High Blame.
  2.  **Clark (2012):** Argues that Europe had **Low Effective Agency**. Everyone was "sleepwalking" (low information clarity, high system complexity). Therefore, Diffused/Low Blame.
  3.  **Your Spine:** The truth lies in the **Audit**. We cannot ask "Who started it?" (Causality). We must ask "Who had the power to stop it?" (Agency).

  **The Thesis Statement:**
  *"The debate over who started the Great War is a proxy for a deeper argument about whether history is driven by the choices of men or the momentum of systems. Fischer argued for Choice; Clark argues for Momentum. But moral blame requires Choice. If we accept Clark's sleepwalkers, we must accept that no one is to blame. If we demand blame, we must prove someone was awake. The Audit Test is how we measure who was sleeping."*

  This allows you to keep your Iraq verdicts (Awake), your Drone verdicts (Asleep/Secret), and your 1914 verdicts (Elites Awake, Public Asleep). It resolves the "Germany vs. Germans" tension by assigning different levels of wakefulness to the State and the Citizenry.

  **Final Advice:**
  Don't let the "Automated War" case break your theory. Use it to illuminate the Schlieffen Plan. The tragedy of 1914 wasn't just that Germany wanted war; it was that Germany built a machine (mobilization) that made war inevitable even if they changed their minds. That is a failure of **Structural Agency**, and it is a form of blame that survives even if the specific leaders didn't "want" a world war. That bridges Fischer and Clark.
