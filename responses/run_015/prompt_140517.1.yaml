      *   **Issue 2 (Refounding Petition):** Petition wants to put a *replacement constitution* on the spring ballot, adoptable by simple majority. Argument: It's a repeal-and-replace (refounding), not an amendment, so Article IX doesn't apply. New text has: (a) self-application clause (all provisions amendable by majority), (b) clause forbidding future amendments that make provisions harder to amend.
