answer: |-
  This is not a dumb framing at all. In fact, you have independently reconstructed one of the central debates in the philosophy of mind and language from the last 50 years. You are asking about the **Symbol Grounding Problem** and the nature of **Naturalized Intentionality**.

  Your intuition is correct: the "Original vs. Derived" distinction (Searle/Dennett) is too blunt for what you are seeing. If you accept Searle's binary, all three of your cases are "Derived Intentionality" (because they are all artifacts, not biological minds). But as you've noticed, Case 1 feels fundamentally different from Case 3.

  Here is the vocabulary you are looking for, how it maps to your three cases, and where the philosophical "edges" actually lie.

  ### 1. The Vocabulary: Three Modes of Reference

  Philosophers of mind and cognitive scientists generally distinguish between three ways a state can be "about" something. Your three cases map almost perfectly onto them.

  #### Case 1: `customer_email` (Conventional Reference)
  *   **Philosophical Term:** **Observer-Relative Intentionality** (Searle) or **Non-Natural Meaning** (Grice).
  *   **The Mechanism:** Purely stipulative. The bits `01001` mean "email" only because a community of agents (programmers) agreed on a convention.
  *   **The "Aboutness":** It is borrowed entirely from the user's mind. If all humans vanished, the variable name `customer_email` would cease to refer to anything; it would just be a string of characters.
  *   **Key Feature:** **Arbitrariness.** You could rename it `x` without changing the system's causal power.

  #### Case 2: NN Activation for "Cats" (Structural/Statistical Reference)
  *   **Philosophical Term:** **Emergent Semantics** or **Latent Representation**.
  *   **The Mechanism:** High-dimensional correlation. The activation "points" to cats because it covaries with cat images in the training distribution.
  *   **The "Aboutness":** This is controversial. Some argue this is still just Derived Intentionality (because humans chose the training data). Others argue it is a form of **Informational Semantics** (Dretske): the state carries information about cats because of a reliable nomic (law-like) dependency.
  *   **Key Feature:** **Opacity.** The reference exists, but no one can point to the specific line of code that created it.

  #### Case 3: The "Shadow Register" (Causal/Functional Reference)
  *   **Philosophical Term:** **Teleosemantics** (Millikan, Papineau) or **Causal Theory of Reference** (Kripke/Putnam).
  *   **The Mechanism:** Physical coupling. The register tracks temperature not because of a name, and not because of statistical learning, but because it is **causally coupled** to the phenomenon.
  *   **The "Aboutness":** This is the one that bugs you. It refers to temperature because its **Proper Function** is to transmit temperature data, even if the engineer doesn't know the encoding.
  *   **Key Feature:** **Counterfactual Reliability.** If the temperature changed and the register *didn't* change, the system would be broken. In Case 1, if the email changes and the variable doesn't, the system is just outdated.

  ---

  ### 2. Why "Original vs. Derived" Doesn't Fit

  Searle's distinction asks: *Does this thing have meaning on its own, or did a mind give it meaning?*
  *   **Searle's Answer:** Only biological brains have "Original." Everything else (Case 1, 2, and 3) is "Derived."

  But you are asking a different question: *How is the meaning attached?*
  *   **Your Question:** Is the meaning attached by **convention** (Case 1), **correlation** (Case 2), or **causal history** (Case 3)?

  Your "Shadow Register" is a specific philosophical puzzle case. It challenges the idea that intentionality requires a *conscious* designer who understands the semantics. This maps to a debate between **Internalism** (meaning is in the head/design) vs. **Externalism** (meaning is in the causal relationship with the world).

  Your Shadow Register is an **Externalist** artifact. It refers to temperature because of its relationship to the environment, not because of the engineer's internal mental state.

  ### 3. The Edge Cases: Where the Lines Are Drawn

  You asked where the edges are. Philosophers use three specific tests to determine if a system truly "refers" to something or is just processing syntax.

  #### A. The Misrepresentation Test (The most important one)
  For a state to have genuine intentionality (aboutness), it must be capable of being *wrong*.
  *   **Case 1 (`customer_email`):** If I put a phone number in there, is the variable *wrong*? No. It's just a string. The *program* might crash, but the variable itself doesn't "misrepresent."
  *   **Case 2 (NN Cat):** If the model fires for a dog, we say it "misclassified." This looks like misrepresentation.
  *   **Case 3 (Shadow Register):** If the sensor drifts and reports 20°C when it is 30°C, does the register *misrepresent* the temperature?
      *   **Teleosemantics says Yes:** The register has a *function* (to indicate temperature). If it fails its function, it is misrepresenting. This grants it genuine intentionality.
      *   **Causal Covariation says No:** If it physically tracks the voltage, and the voltage is wrong, it is accurately reporting the voltage. It only "misrepresents" temperature relative to a human goal.

  **The Edge:** If you believe the Shadow Register can genuinely "lie" (not just break, but be semantically wrong), you are a **Teleosemanticist**. You believe function creates meaning, even without conscious understanding.

  #### B. The "Swampman" Test (Causal History)
  Imagine lightning strikes a pile of swamp gas and creates a perfect physical duplicate of your Shadow Register system, down to the atom. It wasn't built by an engineer; it just happened.
  *   **Case 1 & 3:** In the swamp version, there was no designer to intend the causal link.
  *   **The Question:** Does the Swamp-Register refer to temperature?
      *   **Causal Theorists say No:** It has no history of selection or design. It's just a rock that happens to correlate with temperature.
      *   **Function Theorists say Yes (maybe):** If it *acts* like a thermometer, does history matter?
  *   **The Edge:** This determines if "intentionality" requires a **history of design** or just **current causal structure**.

  #### C. The "Quus" Test (Rule Following)
  This comes from Wittgenstein/Kripke. How do you know the Shadow Register refers to "Temperature" and not "Voltage" or "Resistance"?
  *   Physically, it is only ever tracking voltage.
  *   We *interpret* that voltage as temperature.
  *   **The Edge:** If the engineer doesn't know the mapping, does the reference exist *in the machine* or only *in the downstream system* that uses it?
      *   If the downstream system treats it as temperature, the reference is **Systemic**.
      *   If the reference requires an external observer to decode it, it is **Observer-Relative**.

  ### 4. Summary: The "Carving" You Want

  You asked for the right carving. Based on your intuition, the split isn't "Mind vs. Code." It is **"Convention vs. Coupling."**

  | Feature | Case 1: Variable Name | Case 2: NN Activation | Case 3: Shadow Register |
  | :--- | :--- | :--- | :--- |
  | **Primary Mechanism** | **Stipulation** (Social contract) | **Correlation** (Statistical learning) | **Coupling** (Physical causality) |
  | **Philosophical Label** | **Derived Intentionality** | **Informational Semantics** | **Teleosemantics / Naturalized** |
  | **Depends on Designer Knowledge?** | **Yes** (Must know what it means) | **No** (Data defines meaning) | **No** (Physics defines meaning) |
  | **Can it Misrepresent?** | No (It's just a label) | Yes (Classification error) | Yes (Function failure) |
  | **If Humans Vanish...** | Meaning vanishes instantly | Meaning degrades (no context) | Meaning persists (causal link remains) |

  ### The Verdict on Your "Shadow Register"

  Your Shadow Register is an example of **Naturalized Intentionality within an Artifact.**

  It is distinct from Case 1 because its reference is grounded in **physics**, not **syntax**.
  It is distinct from Case 2 because its reference is grounded in **hard causality**, not **probability**.

  The specific philosophical term for the phenomenon where a system refers to X because it was *designed to track X*, even if the specific designer didn't know the semantics, is **Proper Function** (from Ruth Millikan's *Language, Thought, and Other Biological Categories*).

  The "aboutness" comes from the **selection history** of the component. The engineer selected that register *for the purpose of* carrying sensor data. Therefore, its "meaning" is fixed by its purpose, not the engineer's conscious awareness of the bits.

  **So, to answer your final question:**
  The line is not about the designer's knowledge. The line is about **Causal Grounding.**
  *   **Case 1:** Ungrounded (Symbolic).
  *   **Case 2:** Statistically Grounded.
  *   **Case 3:** Causally Grounded.

  You have effectively rediscovered the argument for **Externalism**: meaning isn't just in the head (or the code comments); it's in the causal connection to the world. Your Shadow Register has more "real" intentionality than your variable name, because if the world changes, the register *must* change, but the variable name doesn't have to.
