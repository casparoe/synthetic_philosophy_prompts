answer: |-
  This is a profound ethical and epistemological dilemma that cuts to the heart of how we relate to truth, memory, and obligation. You are describing a tension that has occupied philosophers for over a century, specifically the debate between **Evidentialism** (the view that belief must be proportioned to evidence) and **Pragmatism** (the view that belief can be justified by its practical consequences).

  Your intuition that belief is involuntary (you cannot simply choose to believe the sky is green) is known as **Doxastic Involuntarism**. Your aunt's argument relies on a form of **Pragmatic Encroachment**, suggesting that high stakes can alter the standards for justified belief.

  To answer your question: Yes, there is a defensible principle that distinguishes ethically permissible practical beliefs from impermissible wishful thinking, but it requires refining your aunt's position and adjusting your own understanding of "belief." The tension you feel is not a false dichotomy, but it is also not an impassable wall. There is a third category often overlooked in everyday discourse: **Acceptance.**

  Here is an analysis of the philosophical boundary you are seeking, and how your aunt's reasoning can be made coherent without collapsing into self-deception.

  ### 1. The Philosophical Landscape: Clifford vs. James

  Your position aligns with the 19th-century mathematician W.K. Clifford, who famously argued in *The Ethics of Belief* that "it is wrong always, everywhere, and for anyone, to believe anything upon insufficient evidence." For Clifford, belief is a public trust; to believe without evidence is to pollute the collective pool of knowledge, regardless of the motive.

  Your aunt's position aligns with William James's 1896 rebuttal, *The Will to Believe*. James argued that when a hypothesis is **live** (plausible to you), **forced** (you must choose one or the other; suspension is effectively a choice), and **momentous** (the stakes are high and irreversible), we have the right to let our "passional nature" decide.

  In your case:
  *   **Live:** Both resistance and negotiation are historically plausible.
  *   **Forced:** You cannot wait for more evidence (it is permanently destroyed). Suspending judgment effectively kills the narrative.
  *   **Momentous:** Real community obligations and charitable structures depend on this.

  James would argue your aunt is correct: in this specific "genuine option," waiting for intellectual certainty is itself a passional choice with negative consequences. However, James's defense has a weakness: it can be abused to justify any comforting delusion. To prevent this collapse into wishful thinking, we need stricter criteria.

  ### 2. The Distinction Between "Belief" and "Acceptance"

  The core of your discomfort lies in **Doxastic Voluntarism**. You feel you cannot *believe* something you know is unproven. Philosophers like L.J. Cohen and Michael Bratman distinguish between **Belief** and **Acceptance**.

  *   **Belief** is a cognitive state regarding the truth of a proposition. It is largely involuntary and aims at truth. (You cannot force yourself to *believe* the letter says X if it looks like Y).
  *   **Acceptance** is a policy of treating a proposition as true for the purposes of reasoning and action within a specific context. It is voluntary and aims at utility or duty.

  **The Defensible Principle:**
  You are ethically permitted to **accept** a narrative for the sake of sustaining moral obligations when:
  1.  **Epistemic Closure:** The truth is genuinely and permanently inaccessible (not just currently unknown).
  2.  **Moral Necessity:** The acceptance is required to fulfill existing, weighty obligations to others (not just to make yourself feel better).
  3.  **Non-Maleficence:** The acceptance does not actively harm third parties or obscure historical truths that matter for justice (e.g., hiding a crime).
  4.  **Provisional Status:** You maintain an internal awareness that this is a *practical commitment*, not an *ontological certainty*.

  If your aunt frames this as "We must *believe* she was a saint," she risks intellectual corruption. If she frames it as "We must *act as if* she was a resistor because that is the only way to honor the obligations she created," she is engaging in ethical **Acceptance**.

  ### 3. Criteria for Ethical Permission (Avoiding Wishful Thinking)

  To ensure this does not devolve into mere self-deception, the following boundaries must hold. If any are violated, the stance becomes ethically suspect.

  **A. The "Last Resort" Condition**
  Practical justification is only permissible when epistemic justification is *impossible*. If there is even a 10% chance new evidence could surface, suspension of judgment is required. You stated the archives are destroyed and specialists disagree. If this is truly a "closed epistemic loop," the pragmatic route opens.

  **B. The "Other-Directed" Condition**
  Wishful thinking is usually self-serving (e.g., "I believe I will win the lottery"). Ethical acceptance must be **other-directed**. Your aunt's argument holds weight only because abandoning the narrative harms the community fund and the descendants who rely on that trust. If the only stake were your family's pride, the evidentialist view (Clifford) would win. Because the stake is *fiduciary duty* to others, the pragmatist view (James) gains traction.

  **C. The "Complexity" Condition**
  This is crucial regarding the 1970s authoritarian context. The binary of "Principled Resister" vs. "Collaborator" may itself be historically false. In many authoritarian regimes, survival required negotiation.
  *   **Risk:** If the narrative erases the complexity of moral survival under authoritarianism, it becomes a myth that harms historical understanding.
  *   **Refinement:** The sustainable narrative might not be "She never negotiated," but "Her actions, whatever they were, resulted in protection." This shifts the belief from a claim about her *internal purity* to a claim about the *outcome of her legacy*.

  **D. The "Transparency" Condition**
  For this to remain intellectually honest, the inner circle (family) must acknowledge the ambiguity while presenting a unified front to the beneficiaries. This is not lying; it is stewardship. It is similar to a legal presumption of innocence: we treat the defendant as innocent for the sake of the trial, not because we are metaphysically certain of their innocence.

  ### 4. Resolving Your Tension

  You asked if your aunt's reasoning can be made coherent. It can, but it requires a shift in terminology that respects your intellectual integrity.

  **The Coherent Stance:**
  "We do not know, and we may never know, the precise contents of that letter. However, the *function* of Grandmother's legacy is to support this community. To suspend judgment is to withdraw support. Therefore, we **commit** to the narrative of resistance as a **regulative ideal**. We will act as though it is true because doing so sustains the good she began. We hold this commitment lightly enough to revise if impossible evidence appears, but firmly enough to fulfill our duties."

  This avoids "intellectual corruption" because you are not claiming to *know* the truth. You are claiming to *honor a duty*. You are not violating the norm of truth-seeking; you are acknowledging that the norm of truth-seeking has hit a wall, and the norm of care-taking has taken over.

  ### 5. Conclusion

  The tension you feel is real, but it is not a choice between "Integrity" and "Duty." It is a choice between two types of integrity: **Epistemic Integrity** (accurate mapping of reality) and **Moral Integrity** (faithfulness to commitments).

  When evidence is permanently insufficient, Epistemic Integrity requires us to say "I do not know." But Moral Integrity requires us to act. The defensible principle is that **Moral Integrity can override Epistemic Certainty in action, provided we do not lie about the uncertainty.**

  Your aunt is right that abandoning the belief causes moral paralysis. You are right that claiming certainty is intellectually corrupt. The synthesis is **Pragmatic Acceptance**: You treat the narrative as true for the sake of the community, while privately acknowledging the ambiguity. This allows you to maintain the charitable giving and the relationships (fulfilling the duty) without lying to yourself about the state of the evidence (maintaining intellectual honesty).

  In this specific context—where the stakes involve the trust of vulnerable communities and the evidence is ash—the "responsible stance" is not to claim knowledge you don't have, but to honor the obligations that remain regardless of the past.
