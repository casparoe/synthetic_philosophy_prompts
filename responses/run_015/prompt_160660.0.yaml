  9.  (Self-Correction during drafting): Make sure to address the "birth certificate default." This implies the state's classification has authority, reinforcing the "social reality" of race even if self-ID is allowed. It suggests race is an administrative fact, not just a personal identity.

  10. (Final Review against Prompt): Did I answer the specific question about whether ancestry adjustment *strictly* presupposes biological kinds? I need to be precise there. It presupposes *predictive validity* of genetic clusters. Whether those clusters are "real kinds" or "pragmatic groupings" is ontologically underdetermined by the *utility*, but the *consent form's language* presupposes realism. I should distinguish the *practice* from the *justification text*. The prompt asks about the *package of policies*. The consent form is part of the package. So the explicit claim is realism.

