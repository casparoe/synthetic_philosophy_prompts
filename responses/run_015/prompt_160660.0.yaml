      *   **Key Policy Features:**
          1.  *Kidney Function (Old):* Race correction (Black = higher function). Justification: Muscle mass (biological).
          2.  *Kidney Function (New):* Ancestry-adjusted (saliva test for continental ancestry proportions). Justification: Ancestry is biological; race is social/meaningless biologically.
          3.  *Transplant Priority:* Uses fixed self-identified racial categories (Black, white, etc.). Justification: Social race tracks racism/disadvantage (social causality).
          4.  *Data Collection:* Self-ID allowed, but defaults to birth certificate data if not updated.
          5.  *Reporting:* Outcome gaps reported by fixed racial categories.
      *   **Questions to Answer:**
          1.  What implicit theory makes this coherent?
          2.  What does it *strictly presuppose* vs. what *fits well*?
          3.  What rival views does it rule out?
          4.  Where is it underdetermined?
          5.  What changes would be needed for (a) thoroughgoing constructionism (no biological reality for either) and (b) biological realism (race is biological)?

  2.  **Deconstruct the Hospital's Position:**
      *   *Claim 1 (Kidney):* Genetic ancestry is biological/real. Self-identified race is not biological. Kidney function depends on biology (muscle mass/creatinine production), so use ancestry.
      *   *Claim 2 (Transplant/Equity):* Self-identified race is socially real/causally efficacious regarding disadvantage. Transplant priority is about justice/equity, so use social race.
      *   *Claim 3 (Data):* Birth certificate data is a valid default for race, but self-ID is allowed.
      *   *Tension:* The hospital explicitly distinguishes "biological ancestry" from "social race." It treats them as non-overlapping domains of relevance (biology vs. justice).

  3.  **Identify the Implicit Theory:**
      *   The hospital is operating on a **Dual-Aspect Theory** or **Domain-Specific Realism**.
      *   *Ontology:* There is biological population structure (ancestry) that is relevant for physiology. There is social classification (race) that is relevant for sociology/justice. They are distinct but correlated.
      *   *Relation:* Ancestry $\neq$ Race. Ancestry causes physiological traits (like creatinine baseline). Race causes social outcomes (like access to care).
      *   *Consistency:* It is consistent *if* one accepts that "race" is not a biological kind but "ancestry" is a biological fact, and that social categories have causal power independent of biology.

  4.  **Address Specific Philosophical Questions:**

      *   *Does ancestry adjustment presuppose real biological kinds?*
          *   Strictly: It presupposes *predictive utility* of genetic markers clustered by continent. It doesn't necessarily require "racial essences," but it does require *some* biological population structure that correlates with geography. It leans toward biological realism about *ancestry*, not necessarily *race*.
          *   Could it be constructed? Yes, if "continental ancestry" is treated as a useful fiction or a pragmatic clustering that doesn't imply deep ontological divisions. But the consent form says it *is* biological, so the *policy's explicit justification* presupposes realism about ancestry.

      *   *Does transplant priority presuppose race is a real social kind?*
          *   Strictly: It presupposes race is a *causal variable* for disadvantage. It doesn't require race to be a "natural kind" in the social ontology sense, just that the *classification* triggers real-world effects (racism). It fits with *Social Constructionism* (race is real because it has real effects).
          *   Deflationary view? Yes, it could be instrumental. "We use these boxes because that's how racism works," not because the boxes carve nature at its joints.

      *   *Are the two halves consistent?*
          *   Yes, under a **Separatist** view. Biology $\neq$ Society.
          *   Inconsistent with: Strong Biological Racial Realism (race = biology), Strong Eliminativism (race = nothing, stop using it), Strong Reductionism (race = just ancestry).

  5.  **Drafting the Reconstruction (Iterative Process):**

      *   *Introduction:* Define the core stance. It's a "Bifurcated Realism" or "Domain-Specific Instrumentalism."
      *   *Strict Presuppositions:* What *must* be true for this to work?
          *   Ancestry has physiological relevance.
          *   Social race has socio-political relevance.
          *   The two are not identical.
      *   *Ruled Out Views:*
          *   *Biological Racial Realism:* The hospital explicitly denies race is biological in the kidney context.
          *   *Eliminativism:* The hospital keeps using race categories for equity.
