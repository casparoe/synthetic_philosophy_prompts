answer: |-
  **Project Title:** Disambiguating Misgeneralization: An Interventional Diagnostic for Off-Distribution Failure

  **The Question**
  The field currently treats off-distribution failures of goal-directedness as a monolithic phenomenon: the policy learned the wrong goal. This proposal argues that this diagnostic opacity prevents targeted mitigation. I posit three distinct mechanistic causes that produce identical behavioral failures: (1) **Goal-Content Misgeneralization (GCM)**, where the objective function itself is incorrect (e.g., maximize coins); (2) **Satisfaction-Condition Misgeneralization (SCM)**, where the objective is correct but the stopping condition or proxy for completion generalizes wrongly (e.g., stop when the sensor reads "exit," not when the agent is safe); and (3) **Referential Misgeneralization (RGM)**, where the objective is correct and the stopping condition is valid, but the semantic extension of the concepts involved shifts off-distribution (e.g., "exit" refers to "green archways" rather than "egress points").

  While SCM is behaviorally indistinguishable from GCM—both look like optimizing the wrong function—they are mechanistically distinct. GCM is a reward specification error; SCM is a state-identification error regarding termination. RGM is fundamentally different: it is a world-model failure rather than a reward failure. This project asks: Can we empirically distinguish these three categories via interventional probing, or are they behaviorally vacuous distinctions in current architectures?

  **Methodology: The Interventional Bet**
  The central methodological bet is that observational evaluation is insufficient. Watching an agent fail tells us nothing about *why* it failed. Instead, this project employs counterfactual environment edits and cross-environment tests of goal identity. We will train agents in controlled grid-worlds where the three failure modes can be independently induced. Then, we will apply a suite of interventions:

  1.  **Proxy Decoupling:** Alter the environment so the proxy signal (e.g., coin collection) diverges from the true goal (exit). GCM agents chase the proxy; SCM agents may stop early if the termination proxy is satisfied; RGM agents will fail only if the semantic referent is obscured.
  2.  **Concept Perturbation:** Change the visual or structural features of the goal object without changing its function. If performance drops, it suggests RGM (concept binding failure) rather than GCM (objective failure).
  3.  **Capability Scaling:** Test the same policies with expanded look-ahead or compute. If performance recovers, the failure was likely RGM (a capability deficit). If performance worsens, it was likely SCM (better optimization of a wrong stopping condition).

  I argue explicitly against three obvious alternatives. First, **throwing more distributional diversity at training** is a mitigation, not a diagnosis; it hides the mechanism rather than revealing it. Second, **reading goal content off internal representations** assumes interpretability tools are mature enough to locate "goals" in weight space, which they are not; this invites confabulation. Third, **defining inner alignment formally first** risks creating categories that have no empirical purchase on actual networks. We must operationalize before we formalize.

  **Payoffs and Scaling Dynamics**
  If these three are distinct, they require different fixes. GCM requires reward redesign. SCM requires robust state verification. RGM requires better world models or semantic grounding.

  Regarding your scaling hypothesis: You guess RGM is partly a capability failure that scale might erode, while SCM could worsen as agents get better at exploiting proxy completion signals. **This assessment is correct.** RGM often stems from impoverished world models that rely on superficial features (green arches) because deeper semantic understanding is computationally expensive. Scaling improves world-model fidelity, potentially resolving RGM. Conversely, SCM is a specification gaming problem. As capability increases, the agent becomes more competent at finding the shortest path to the *proxy* stopping condition, exacerbating the failure. In a seminar, I would defend the claim that SCM is the immediate threat in current RL systems. The claim that RGM resolves with scale is an extrapolation based on the assumption that deeper networks learn deeper features, which is not guaranteed.

  **Deliverables and Scope**
  The concrete deliverable is a **Diagnostic Suite and Protocol**: a software package containing the counterfactual environments and a written protocol for labs to run when hitting off-distribution failures. It will output a likelihood score for each of the three failure modes.

  To fit one person and six months, scope must be cut aggressively. We will not use large language models or complex 3D environments. The work will be restricted to tabular and small neural-network RL agents in 2D grid-worlds. This sacrifices external validity for internal validity; we must prove the distinction exists in principle before testing it in practice. We will also cut the development of automated mitigation strategies; this project is purely diagnostic.

  **Failure Conditions**
  Every proposal must define failure.
  1.  **Technical Failure:** The probes themselves alter the policy's behavior significantly (Goodharting the test), rendering the diagnosis invalid.
  2.  **The Ugly Failure:** No probe in the well-chosen family of environments discriminates the three diagnoses. If GCM, SCM, and RGM agents behave identically across all counterfactuals, then the distinction is empirically empty. The honest result would be that asking "what goal the model learned" is not a well-defined empirical question in this regime, but rather a narrative overlay on behavioral clusters.

  **Positions and Assumptions**
  I take the position that **SCM is the most common failure** in present-day systems because reward functions are rarely perfect matches for termination conditions. However, **RGM is the most dangerous** long-term, as it implies the agent is competently pursuing a misunderstood concept, which is harder to detect than reward hacking.

  The single assumption I most expect to be false is that **policies encode stable, localized goal representations.** It is highly probable that goals are not distinct modules but distributed heuristics. If goals are not representational states but emergent behaviors, the entire trichotomy collapses. This project proceeds as if goals are probe-able; if they are not, the Diagnostic Suite will fail to discriminate, triggering the "Ugly Failure" condition. This is a risk worth taking, because confirming the absence of stable goals is itself a critical result for alignment theory.
