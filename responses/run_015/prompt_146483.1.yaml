answer: |-
  **Prep Sheet: Resistance & Authority in Aquinas**
  **Seminar:** Interdisciplinary Resistance Theory
  **Date:** Next Tuesday

  ### Quick Brainstorm: Reading the Room

  You're walking into a minefield, but a fruitful one. The dynamics are triangular:

  1.  **The Liberals (Majority):** They view resistance through the lens of individual autonomy and consent. They'll be impatient with teleology. To them, "authority" is a necessary evil justified by outcomes. They'll try to flatten your argument into a proto-liberal rights claim. If you sound too scholastic, you'll lose them; if you sound too modern, the Thomists will eat you.
  2.  **The Thomists (The Two Dangerous Ones):** They know the textual history better than you. They'll be suspicious of *De Regno* (Ptolemy of Lucca's involvement is the elephant in the room) and wary of anachronism. They'll smell conciliarism (14th/15th century) on a 13th-century text and call it foul.
  3.  **The Lawyer (The US Founder Obsessive):** They want mechanisms. Who presses the button? Is it legal or extra-legal? They'll compare this to impeachment or the Declaration of Independence. They'll struggle with the idea of a "right" that isn't enforceable in a court.

  Your strategy is to hold the middle: Aquinas isn't a liberal, but he isn't a absolutist either. He's a constitutionalist of a corporate sort.

  ---

  ### Objection 1: The Liberals
  **"You're smuggling Catholic natural law into secular resistance theory."**

  *   **How they'll say it:** "Fine, but this relies on a specific metaphysical hierarchy we don't accept. If you remove the divine teleology, doesn't this collective right just collapse? You're asking us to recieve a structural check without the theological glue holding the structure together."
  *   **Concede up front:** Acknowledge that without the teleological view of the common good, the *obligation* to resist weakens. You aren't offering a freestanding secular theory.
  *   **The reply that lands hardest:** Shift the ground from *metaphysics* to *institutional logic*. Argue that the key insight isn't the divine source of authority, but the *location* of authority. In liberalism, authority is leased from individuals. In Aquinas, it's held by the office for the sake of the body. The "right" to resist isn't an individual liberty, it's a functional necessity of the corporate body surviving. It's not about "my rights," it's about "the office failing its function."
  *   **Weakest point in reply:** It's hard to explain why the body *should* survive without invoking the good (telos). If the liberal asks "Why care about the corporate body?", you're back to square one with natural law.

  ### Objection 2: The Thomists
  **"You're over-reading the Sentences commentary and projecting conciliarism backwards onto Aquinas."**

  *   **How they'll say it:** "Conciliarism is post-Constance. Aquinas is high scholastic. You're taking a nascent idea in the *Sentences* and treating it as a mature constitutional theory when he explicitly walks it back in the *Summa* to avoid encouraging sedition. Plus, *De Regno* isn't fully his."
  *   **Concede up front:** Admit *De Regno* is disputed and that explicit conciliarist terminology is later. Don't claim Aquinas was a conciliarist.
  *   **The reply that lands hardest:** Argue for *logical implication* rather than historical intent. The *Sentences* commentary establishes authority as delegated *from* the community (via God). If authority is delegated for a specific end (common good), and the agent frustrates that end, the delegation is voided. Conciliarism just made the explicit what was implicit in the logic of delegated power. You're tracing the architecture, not claiming he drew the blueprint for Constance.
  *   **Weakest point in reply:** Aquinas is notoriously cautious. He prefers correction to deposition. Claiming his logic *leads* to resistance might be true, but claiming it *authorises* it as a standard procedure is a stretch he never makes.

  ### Objection 3: The Lawyer
  **"Why this isn't just Locke's right of revolution with extra steps."**

  *   **How they'll say it:** "Locke says when the trust is forfeited, power devolves to the people. You say when the tyrant fails the common good, the community resists. Practically, the tyrant loses the crown either way. What's the difference besides the Latin?"
  *   **Concede up front:** The outcome (regime change) is identical.
  *   **The reply that lands hardest:** The *status* of the resistance. For Locke, it's an appeal to heaven—a return to the state of nature to re-contract. It's disruptive and resets the clock. For Aquinas, it's restorative. It's not a reset; it's a repair. The community isn't dissolving into atoms; it's acting as a *corpus mysticum* to remove a diseased limb. Locke is revolutionary; Aquinas is remedial.
  *   **Weakest point in reply:** In the heat of the moment, 'remedial' looks a lot like 'revolutionary'. The lawyer will press you on who decides when the repair is done. If it's the people, you're back to Locke.

  ---

  ### The Objection You're Praying Nobody Raises
  **"Do modern democratic citizens, as intermediate authorities, have a duty to resist?"**

  *   **The Trap:** If you say yes, you're advocating insurrection based on medieval texts. If you say no, you undermine the relevance of your thesis.
  *   **The Defence:** Distinguish between the *populus* as an aggregate of individuals and the *populus* as a corporate entity represented by magistrates. Modern citizens are not intermediate magistrates in the medieval sense; they are the constituent parts. The "intermediate" power lies in institutions (courts, parliament), not individual voters.
  *   **The Limit:** Citizens have a duty to sustain the institutions that check power, not to bypass them. Resistance is institutional first, popular only when institutions collapse. Don't let them equate "voter" with "magistrate".

  ---

  ### Your Weakest Spot: Killing vs. Resisting
  **"Aquinas never clearly authorises intermediate magistrates to kill the tyrant, only to resist."**

  You need to own this gap. Don't try to fudge it.

  *   **The Problem:** In *De Regno*, he suggests public authority can depose, but private killing is forbidden. But who executes the deposition if not a private act?
  *   **The Defence:** Frame it as the difference between **judicial execution** and **assassination**.
      *   Private tyrannicide is murder because it lacks due process—it's one part acting against the head without the body's consent.
      *   Public deposition (even if it results in death) is judicial. It's the body exercising its inherent jurisdiction over its own officer.
      *   The "gap" isn't a loophole; it's a procedural safeguard. The magistrates don't kill the tyrant because they hate him; they remove him because he is *functus officio* (no longer holding office). If he dies in the process of removal, that's collateral to the deposition, not the aim.
  *   **Why this holds:** It preserves the rule of law even in resistance. It stops resistance from becoming vendetta.
  *   **Where it might crack:** If the tyrant fights back, the "judicial" act becomes a war. At that point, the distinction blurs. Admit this. Say that Aquinas knows this is messy, which is why he prefers prevention (good laws) over cure (resistance).

  ---

  **Final Note:** Keep your cool. If the Thomists start quoting Latin, don't panic. Ask them about the *vis coactiva* vs *vis directiva* distinction instead. And for god's sake, don't let the lawyer drag you into a debate about the Second Amendment.

  Good luck. You've got the logic, just don't let them seperate the text from the context.
