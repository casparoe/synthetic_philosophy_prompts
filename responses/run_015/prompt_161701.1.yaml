      To: Technical Review Panel
      From: [My Name]
      Date: October 26, 2023
      Subject: Recommendation on Project Achates (Supertask Readout)

      **Recommendation:** Fund with Conditions.

      I recommend a conditional award of $150k over 18 months, contingent on meeting physical milestones unrelated to the halting verdict. We should treat the Church-Turing Thesis (CTT) as an empirical claim about physical limits, not a definition of computation. Under this reading, attempting to breach the limit yields valuable data on energy-time bounds even if the oracle fails. If we instead treat CTT as definitional, the project is a category error, but the experimental data on physical acceleration remains valid and fundable under our mission to explore high-upside physical bounds.

      **Philosophical Framework**

      The panel's split hinges on whether CTT is a law of physics or a conceptual truth. Our funding decision must rest on the former. If CTT is empirical, Project Achates is a legitimate stress test. A null result—where the machine fails due to energy constraints or noise before completing the supertask—still maps the boundary where computation meets thermodynamics. This aligns with our goal of funding long-shot basic science. If we adopt the definitional reading, no physical system can constitute a counterexample by fiat. However, rejecting the proposal on those grounds privileges philosophy over experiment. We fund instruments, not theorems. Therefore, we proceed as if CTT is falsifiable, while acknowledging that a successful "oracle" would require extraordinary evidence.

      **Evaluation of Specific Objections**

      Two arguments circulated during external discussions require specific handling. First, the "Certification Condition," which demands a finite Turing-machine procedure to verify the device's verdicts. I advise we reject this requirement. As noted in our discussions, imposing this condition smuggles the conclusion in reverse. Since any finite test battery can be aced by a lookup table, requiring TM-verifiable certification presupposes that hypercomputation is impossible. Adopting this as a review criterion would settle the philosophical debate by committee rather than experiment. We cannot require the impossible as a condition for proving the impossible is possible.

      Second, the "Implementation Dodge," which argues that emitting correct outputs does not constitute "computing" (e.g., a lookup table assembled by chance). While philosophically coherent, this is irrelevant for funding decisions. We fund physical devices that correlate inputs to outputs reliably. Whether the internal mechanism qualifies as "computation" under a specific metaphysical definition does not change the utility of the device. If the lamp lights correctly when a machine halts, we have a physical phenomenon worth investigating, regardless of whether we label it an oracle or a coincidence. We should sideline this objection to avoid metaphysical quagmires.

      **Milestones and Conditions**

      To mitigate risk, funding should be tranched based on physical performance, not logical verdicts.
      1.  **Month 6:** Demonstrate the acceleration mechanism achieves a 2:1 time reduction per step for at least 20 steps with stable energy consumption.
      2.  **Month 12:** Verify the readout mechanism (the lamp) correlates with known halting cases for simple Turing machines (n < 10 states).
      3.  **Month 18:** Provide a complete energy-budget analysis showing the theoretical limit where the system fails.

      If the PIs miss the Month 6 milestone, funding ceases. This ensures we pay for experimental data, not promises of oracle behavior.

      **The Opposition's Strongest Case**

      Should this memo leak, we must be prepared to defend against the strongest argument for desk-rejection: the Unfalsifiability Objection. The opposition argues that no finite observation can certify an infinite process. Even if the lamp lights for every test case we check, a skeptic can always claim the next case would fail. Therefore, the claim "this device solves the Halting Problem" is empirically vacuous because a "doesn't halt" verdict cannot be finitely verified. Furthermore, mundane physics (quantum noise, energy density) will inevitably interrupt the supertask before infinity is reached. Thus, the proposal asks us to take "we built an oracle" on faith while violating known physical constraints. This is not science; it is theology dressed as engineering.

      **Conclusion**

      We can rebut this by emphasizing that we are funding the measurement of the interruption, not the oracle itself. We are buying data on where physics stops computation, not a guarantee that computation wins. This distinction allows us to support high-risk science without endorsing pseudoscience.

      **Disposition:** Fund with Conditions.

