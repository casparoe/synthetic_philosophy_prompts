      *Overall:* Jonas. Why? Because in a policy PhD context, understanding the economic limitations (Jonas) is more valuable than knowing the heuristic intent (Miriam), especially since the heuristic is often misused as a formula (which Jonas attacks).

      *Missing:* **Strategic interaction (Game Theory)** and **Moral Uncertainty**.

