      *(Self-Correction during drafting)*: Make sure to explicitly mention the "Trading Bot" distinction in D1. Make sure "Thermostat" is used to rule out simple feedback. Make sure "Autocomplete" is used to rule out non-loop systems.

      *Revised Plan for Desiderata:*
