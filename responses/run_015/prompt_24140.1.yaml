answer: |-
  **To:** AI Safety & Product Strategy
  **From:** [Your Name/Team]
  **Subject:** Desiderata for the Tool-vs-Agent Distinction

  ### 1. Context
  We currently lack a operational definition of "agent" that satisfies engineering, safety, and legal stakeholders. Marketing uses the term to imply capability; Safety uses it to imply risk; Engineering uses it to imply architecture. The following desiderata outline what a robust definition must achieve to be useful internally.

  ### 2. Desiderata for an Adequate Account

  Any definition of AI agency must satisfy the following five criteria.

  **D1: The Execution Threshold (The "Trigger" Criterion)**
  *   **Requirement:** The system must be able to effect change in its environment (digital or physical) without a distinct, atomic human confirmation for *each* effect.
  *   **Motivating Case:** **Trading Bot (Moves Funds) vs. Trading Bot (Signals).**
      *   A bot that sends an email saying "Buy AAPL" is a tool. A bot that executes the API call to buy AAPL is an agent.
      *   *Why:* This captures the immediate risk surface. If the system cannot pull the trigger, it is a decision-support tool, not an actor.

  **D2: The Temporal Loop (The "Correction" Criterion)**
  *   **Requirement:** The system must monitor the outcome of its actions and adjust subsequent actions to achieve an objective if the initial attempt fails.
  *   **Motivating Case:** **Autocomplete vs. Coding Agent.**
      *   Autocomplete predicts the next token based on context. It does not check if the code compiles. A coding agent runs the code, sees the error, and rewrites the function.
      *   *Why:* Single-shot generation is tool-like. Multi-step optimization with feedback is agent-like.

  **D3: The Model Requirement (The "Thermostat" Exclusion)**
  *   **Requirement:** The system must rely on an internal representation of the world state that is distinct from immediate sensor input, allowing for counterfactual reasoning or planning.
  *   **Motivating Case:** **The Thermostat.**
      *   A thermostat closes a loop (D2) and actuates (D1), but it is a simple servomechanism. It reacts to $T < X$, it does not model *why* $T$ is low or plan a heating schedule based on weather forecasts unless explicitly programmed with that model.
      *   *Why:* We must not classify simple cybernetic feedback loops as agents, or the term loses all discriminatory power.

  **D4: The Autonomy Decoupling**
  *   **Requirement:** The definition must allow for an system to be an "agent" even if it operates under strict human supervision or constraints.
  *   **Motivating Case:** **Supervised Coding Agent.**
      *   If a coding agent requires a human to approve every shell command, it lacks *autonomy*, but it is still performing *agency* (planning, executing, debugging).
      *   *Why:* Safety policy needs to regulate the *capability* to act, not just the *permission* to act. If we tie agency strictly to autonomy, we cannot regulate supervised high-risk systems adequately.

  **D5: The Moral Decoupling**
  *   **Requirement:** Attributing agency to the system must not imply moral responsibility or legal personhood.
  *   **Motivating Case:** **Self-Driving Car.**
      *   We need to say the car "acted" to change lanes to analyze the accident, without implying the car is "blameworthy."
      *   *Why:* Conflating agency with responsibility creates legal confusion. Agency is a descriptive category of function; responsibility is a normative category of blame.

  ### 3. Distinctions That Must Not Collapse

  An adequate account must explicitly maintain the following boundaries:

  1.  **Agency $\neq$ Autonomy:** (Addressed by D4). A leashed dog is still an animal; a supervised agent is still an agent.
  2.  **Agency $\neq$ Goal-Directedness:** A heat-seeking missile is goal-directed but lacks the planning/modeling capacity (D3) to be an agent. It is a guided tool.
  3.  **Agency $\neq$ Moral Responsibility:** (Addressed by D5). We can say "the agent optimized for engagement" without saying "the agent is guilty."

  ### 4. Incompatibility Flag: The "Granularity Tension"

  I suspect **D1 (Execution Threshold)** and **D4 (Autonomy Decoupling)** cannot be jointly satisfied with high precision in all edge cases.

  *   **The Conflict:** D1 requires the system to act without human confirmation. D4 requires the system to count as an agent *even if* a human is supervising.
  *   **The Failure Mode:** Consider a coding agent that proposes a diff and waits for a human to hit "Enter."
      *   If we prioritize D1, this is a **Tool** (human hit the final key).
      *   If we prioritize D4 (and the risk profile of the suggestion), we want to call it an **Agent** (the human is just a rubber stamp).
  *   **Implication:** We may need to accept that "Agency" is scalar, not binary. A strict binary classification will always misclassify high-supervision high-capability systems.

  ### 5. Scoring Candidate Views

  Here is how the three dominant philosophical/engineering frameworks score against the desiderata (Pass/Fail/Partial).

  | View | D1 (Execution) | D2 (Loop) | D3 (Model) | D4 (Autonomy) | D5 (Morality) | Notes |
  | :--- | :--- | :--- | :--- | :--- | :--- | :--- |
  | **Functionalism** (Input/Output behavior) | **Pass** | **Pass** | **Fail** | **Pass** | **Pass** | Fails D3. Classifies thermostats as agents because they map state to action. Too broad. |
  | **BDI** (Beliefs, Desires, Intentions) | **Partial** | **Pass** | **Pass** | **Fail** | **Fail** | Fails D4/D5. Implies internal mental states. Makes it hard to call a supervised bot an "agent" if it doesn't "desire" the goal. Too narrow/anthropomorphic. |
  | **Practical-Reasoning** (Means-End Deliberation) | **Pass** | **Pass** | **Pass** | **Pass** | **Pass** | **Best Fit.** Focuses on the *process* of selecting actions to achieve ends. Handles the thermostat (no deliberation) and the supervised agent (deliberates, even if constrained) correctly. |

  ### 6. Confidence & Uncertainty

  **Confidence Level:** **Moderate (60%)**
  The field is moving too fast for high confidence. As models become more agentic by default (e.g., LLMs that naturally chain thoughts), the boundary will blur further. The Practical-Reasoning view is the most robust currently, but it relies on interpreting internal chain-of-thought which is often opaque.

  **Least Certain Point:** **D3 (The Model Requirement / Thermostat Case)**
  I am least sure about the **Thermostat** exclusion. Advanced cybernetics argues that *any* negative feedback loop implies a "model" of the setpoint. If we define "model" too loosely, the thermostat becomes an agent. If we define it too strictly (requiring language or symbolic logic), we might exclude non-LLM agents (like reinforcement learning controllers in robotics) that *are* agentic but don't have explicit symbolic world models. Drawing the line between "hard-coded feedback" and "learned world model" is the technical weak point of this framework.
