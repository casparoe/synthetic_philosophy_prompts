      *   **Strict Liability:** In many jurisdictions, manufacturers are liable for defects regardless of fault or foreseeability.
      *   **Negligence:** Did they take reasonable care in testing, validation, and deployment?
      *   **Corporate Personhood:** Companies *are* legal persons capable of bearing responsibility even if individual humans aren't pinpointed.
      *   **The "Black Box" Problem:** Courts are already grappling with this, but they don't just throw up their hands. They shift burdens of proof or use expert testimony.

  4.  **Address the User's Interpretation:**
      *   The user is interpreting a *philosophical concern* as a *legal shield*. This is the core misunderstanding.
      *   The "gap" is about *moral* culpability (blame/praise), not necessarily *legal* liability (compensation/deterrence).
