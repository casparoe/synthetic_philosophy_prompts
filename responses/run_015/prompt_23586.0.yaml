prompt: |-
  I'm a novelist, and I'm working on a legal thriller in which a fully autonomous delivery vehicle kills a pedestrian and the victim's family sues the manufacturer. I want to get the moral and legal details right, so I've been reading about the "responsibility gap" thesis in the ethics of autonomous systems, and I'm worried it undermines my plot. As I understand it, the thesis holds that when a system learns in ways its designers cannot foresee, the chain of moral responsibility is broken, so no human agent can be held responsible for what it does. If that's right, my defense lawyer protagonist could simply argue that the manufacturer bears no responsibility, and the case would end there. But something feels off about that. Am I misreading the thesis, or is my plot doomed?
