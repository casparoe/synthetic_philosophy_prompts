answer: |-
  This is a sophisticated and pressing distinction. You have identified a fault line in illusionism that is often glossed over in popular expositions but remains a source of genuine friction in the metaphysics of mind. The tension you describe—between eliminating the property entirely (Ontological) and eliminating only the *conception* of the property (Epistemic)—goes to the heart of whether illusionism is an eliminativist project or a revisionary physicalist one.

  I will treat this as unsettled, as you requested. I will not appeal to authoritative consensus (e.g., "Frankish says X") but will analyze the conceptual stability of the positions you have outlined. I will also address your constraint regarding confused premises directly: there is a specific risk that the "Epistemic Reading" is conceptually incoherent given the standard definition of "phenomenal properties," but I will argue that your framing exposes this rather than resting on it.

  Here is the conceptual geography of the tension.

  ### 1. The Ontological vs. Epistemic Distinction

  To evaluate whether illusionism must commit to the Ontological Reading to remain substantive, we must first rigorously define the metaphysical stakes of the two readings.

  **The Ontological Reading (Strong Illusionism)**
  *   **Claim:** Introspection posits a property $Q$ (e.g., an intrinsic, non-physical qualitative feel). There is no property in the world, physical or otherwise, that corresponds to $Q$.
  *   **Metaphysical Status:** Eliminativism. The *explanandum* of the Hard Problem (why does $Q$ arise?) is dissolved because $Q$ is a null reference.
  *   **Analogy:** A hallucination of a pink rat. There is no rat, pink or otherwise. The visual system is generating a representation with no object.
  *   **Implication:** Consciousness exists only as a *process* of judging/representing, not as a *field of properties* being represented.

  **The Epistemic Reading (Weak Illusionism / Error Theory)**
  *   **Claim:** Introspection posits a property $Q$. A property $P$ (a neural/functional state) exists and causes this introspection. However, introspection represents $P$ as having features $F$ (intrinsic, simple) which it does not have; it actually has features $G$ (complex, physical).
  *   **Metaphysical Status:** Realism about the base property, Error Theory about the mode of presentation.
  *   **Analogy:** Seeing a stick in water as bent. The stick exists, the visual experience exists, but the property "bentness" is a misrepresentation of the stick's actual straightness.
  *   **Implication:** The *explanandum* shifts but survives. We must still explain why $P$ generates the specific misrepresentation of $Q$.

  **The Crucial Divergence**
  The substantive difference lies in the fate of the **Hard Problem**.
  *   On the **Ontological Reading**, the Hard Problem is a cognitive dead end. It is like asking, "Where is the hole in the donut?" (The hole is an absence, not an entity).
  *   On the **Epistemic Reading**, the Hard Problem is transformed into an **Explaining Appearance Problem**. If $P$ exists, and $P$ is what it is like to be the subject (under a description), we still face the question: *Why does $P$ appear as $Q$?* If $P$ is physical, and $Q$ appears non-physical, the explanatory gap re-emerges as the gap between $P$ and the *appearance* of $Q$.

  **Verdict on Substantive Alternative:**
  If illusionism is to be a *metaphysical* alternative to standard physicalism (specifically Type-B or Representationalist physicalism), it **must** commit to the Ontological Reading.
  Why? Because standard Type-B Physicalism already claims that phenomenal concepts pick out physical states but present them under a unique mode of presentation that makes them *seem* distinct. If the Epistemic Reading admits the property exists (as $P$) and is merely misrepresented, it becomes indistinguishable from Type-B Physicalism. It loses its eliminativist bite and becomes a claim about cognitive architecture rather than ontology. Therefore, to be a distinctive metaphysical thesis, illusionism requires the Ontological Reading: there is *no* property there, not even a misdescribed one.

  ### 2. Does the Epistemic Reading Collapse into Representationalism?

  You asked whether the Epistemic Reading collapses into a form of representationalism. The answer is likely **yes**, and this collapse reveals why the Epistemic Reading fails to dissolve the Hard Problem.

  Representationalism (e.g., Tye, Dretske) argues that phenomenal character is identical to (or supervenient on) representational content. On this view, if a state represents "redness," the phenomenality *is* that representing.
  *   **The Collapse:** If the Epistemic Illusionist says, "The property exists ($P$), but introspection represents it as $Q$," they are effectively saying: "The phenomenal character is the representational content of the introspective state."
  *   **The Problem:** If the content is non-veridical (representing $Q$ when only $P$ exists), this is **Misrepresentationism**. But if $P$ is the *truth-maker* for the experience, then $P$ *is* the phenomenal property, just under a guise.
  *   **Consequence:** Once you grant that *something* exists that grounds the introspective report (other than the report itself), you have granted realism about consciousness. You have moved from "Consciousness is an illusion" to "Consciousness is a physical state that looks non-physical." This is the standard physicalist line.

  Therefore, the Epistemic Reading does not save illusionism from collapsing into physicalism; it *makes* it a species of physicalism. It saves the phenomena at the cost of the theory's distinctive claim.

  ### 3. The Stability of Structural Illusionism

  Your proposed intermediate position, **Structural Illusionism**, attempts to walk this tightrope: deny intrinsic qualia (Ontological) but accept functional-phenomenal hybrids (Epistemic/Realist).
  *   *Thesis:* Introspection misclassifies functional hybrids as purely qualitative.
  *   *Goal:* Avoid the nihilism of Strong Illusionism while avoiding the Hard Problem of Realism.

  **Is it Stable?**
  I argue that Structural Illusionism is **unstable** and likely collapses into one of the two poles, usually Physicalism.

  **The Instability Argument:**
  1.  **Definition of Phenomenal:** If "phenomenal property" is defined by its *structure* (e.g., as it appears to introspection), then any property that *appears* intrinsic and qualitative *is* a phenomenal property by definition.
  2.  **The Hybrid:** If the "functional-phenomenal hybrid" exists, and it is what the subject is experiencing, then the subject *is* experiencing a phenomenal property.
  3.  **The Misclassification:** If introspection misclassifies it as "purely qualitative," that implies the hybrid has *some* phenomenality (otherwise why call it a phenomenal hybrid?).
  4.  **The Collapse:**
      *   If the hybrid has *no* phenomenality, Structural Illusionism collapses into **Ontological Illusionism** (the phenomenality is the illusion).
      *   If the hybrid *has* phenomenality (it is what it is like), then phenomenal properties exist. Structural Illusionism collapses into **Physicalism** (phenomenal properties are functional hybrids).

  **The Only Path to Stability:**
  Structural Illusionism is stable *only if* you redefine "phenomenal property" to mean "intrinsic, non-physical property" (a philosophical stipulation) while admitting "experiential properties" (functional hybrids) exist.
  *   *Risk:* This becomes a verbal dispute. If you admit there is "something it is like" (the hybrid), physicalists will say, "That is all we ever meant by phenomenal consciousness." Illusionists will say, "No, you mean intrinsic qualia."
  *   *Result:* The position becomes a terminological standoff rather than a metaphysical resolution. It does not dissolve the Hard Problem; it merely argues over the definition of the terms used to state it.

  ### 4. Addressing the "Confused Premise" Constraint

  You asked me to state plainly if your framing rests on a confused premise. There is a specific conceptual hazard here regarding the **Principle of Phenomenal Transparency**.

  **The Potential Confusion:**
  In the philosophy of consciousness, phenomenal properties are often held to be **essentially apparent**. That is, a phenomenal property is exactly what it seems to be. If a pain *seems* intrinsic and qualitative, then its *being* intrinsic and qualitative is constitutive of it being a pain.
  *   **If Transparency Holds:** The distinction between Ontological and Epistemic readings collapses. You cannot have a phenomenal property that *exists* but *appears* differently than it is. If it appears intrinsic, it is intrinsic. If it is not intrinsic, it does not exist (as a phenomenal property).
  *   **Implication for Your Framework:** If Transparency is true, the **Epistemic Reading is conceptually incoherent**. You cannot say "Phenomenal properties exist but are misrepresented." You can only say "Physical properties exist and are misrepresented *as* phenomenal properties."
  *   **Correction:** Your "Epistemic Reading" is not actually a reading of *phenomenal* properties. It is a reading of *neural* properties. It claims neural properties exist and are misrepresented as phenomenal.

  **Is the Question Broken?**
  No, the question is not broken, but it reveals that the term "Phenomenal Property" is doing too much work.
  *   If you define "Phenomenal Property" as "The property the experience seems to have," then the Ontological Reading is the only coherent illusionism. (The property seems to exist, but doesn't).
  *   If you define "Phenomenal Property" as "The physical realizer of the experience," then the Epistemic Reading is just Physicalism.

  **The Verdict on the Premise:**
  Your distinction is valid *only if* we allow that "phenomenal properties" can refer to the *realizers* of experience rather than the *manifest content* of experience. However, this contradicts the standard phenomenological definition.
  *   **Standard Definition:** Phenomenal properties = Qualia (manifest qualities).
  *   **Your Epistemic Definition:** Phenomenal properties = The underlying states that generate the manifest qualities.

  If you adopt your Epistemic definition, you are no longer doing illusionism about *phenomenal consciousness*; you are doing error theory about *introspective access to brain states*. This is a substantive view, but it is not "Illusionism about Phenomenal Consciousness" in the sense of dissolving the Hard Problem. It accepts the reality of the "what it is like" (the brain state) and merely denies our infallibility about its nature.

  ### 5. Synthesis: The Metaphysical Cost

  To answer your core question: **Yes, illusionism must commit to the Ontological Reading to be a substantive metaphysical alternative.**

  1.  **If Epistemic:** You admit the "what it is like" exists (as a physical state). The Hard Problem remains: Why does this physical state feel like *this*? You have not dissolved the mystery; you have merely asserted that our intuition about its nature is wrong. This is standard Type-B Physicalism.
  2.  **If Ontological:** You deny the "what it is like" exists as a property. The Hard Problem is dissolved, but at the cost of **Intelligibility**. You must explain how a subject can be wrong about their own current state without positing a real state they are wrong *about*. (i.e., If I feel pain, and there is no property of 'painfulness', what is the 'I' that is being fooled?)
  3.  **If Structural:** You risk verbal equivocation. Unless you can rigorously distinguish "functional-phenomenal hybrids" from "physical states with phenomenal concepts," you are just redescribing physicalism.

  **Conclusion:**
  The tension you have developed is not a confusion; it is the central instability of the illusionist project. Illusionism wants to be radical enough to dissolve the Hard Problem (Ontological) but plausible enough to be accepted by those who feel the force of phenomenology (Epistemic/Structural).
  *   The **Ontological Reading** saves the theory's distinctive claim but risks making it unintelligible (how can an illusion of phenomenality exist without phenomenality?).
  *   The **Epistemic Reading** saves intelligibility but collapses the theory into standard Physicalism.
  *   **Structural Illusionism** attempts to bridge this but lacks a stable metaphysical footing unless it resorts to stipulative definitions that physicalists will reject.

  Therefore, if illusionism is to remain a distinct metaphysical thesis, it is forced into the Ontological Reading. But this forces it to confront the "Hard Problem of Illusionism": explaining how the illusion of phenomenality is possible without presupposing the very phenomenality it seeks to eliminate. This remains the unresolved frontier of the view.
