answer: |-
  # Research Agenda: Operationalizing Indeterminacy
  **Fellowship Term:** Three Years
  **Team Composition:** Two Philosophers, One Field Linguist, One Machine Translation Researcher

  ## Executive Summary
  This fellowship prioritizes **Evaluation of Machine Translation (MT) for Low-Resource Languages** and **Protocols for High-Stakes Interpreting**. These two lines of work are selected because they address the highest practical stakes and the greatest scale of impact, while fully utilizing the specific interdisciplinary composition of the team. We explicitly deprioritize **Training in Elicitation** and **Reliance on Translated Mental-State Vocabulary**, regarding the former as a methodological means rather than a research end, and the latter as subsumed within the high-stakes interpreting agenda.

  ## Criteria for Selection
  The ordering is defended via four criteria:
  1.  **Practical Stakes:** The severity of consequences when indeterminacy is ignored.
  2.  **Team Tractability:** The fit between the specific problem and the four fellows' expertise.
  3.  **Systemic Leverage:** The extent to which the output changes standard practices (metrics or protocols).
  4.  **Dependency:** Whether resolving one line enables progress on others.

  ---

  ## Priority Line 1: Evaluation of Machine Translation for Low-Resource Languages
  **Focus:** Replacing single-reference automatic scores with task-based measures of acceptable ontological divergence.

  **Rationale:**
  This line is prioritized first because it addresses the *scale* of translation. As low-resource languages are increasingly processed by neural systems, the *gavagai* problem is no longer a philosophical curiosity but an engineering constraint. Current MT evaluation relies on n-gram overlap against a single "golden" reference translation. This presupposes determinacy of translation. If *gavagai* can be glossed as "rabbit," "rabbit part," or "rabbit stage" without behavioral contradiction, a system penalized for outputting "rabbit part" when the reference says "rabbit" is being penalized for philosophical correctness, not engineering failure.

  **Team Fit:**
  This line uniquely leverages the **Machine Translation Researcher**. A team without this member could not access the loss functions or evaluation metrics required to test indeterminacy. The **Philosophers** will define the boundaries of "acceptable divergence" (e.g., when does shifting from object to stage ontology break the translation?), and the **Linguist** will identify low-resource language pairs where mass/count or individuation distinctions differ sharply.

  **Work Plan:**
  1.  **Year 1:** Define "Ontological Divergence." Catalog cases where MT outputs are behaviorally equivalent to references but ontologically distinct (e.g., translating a mass noun as a count noun).
  2.  **Year 2:** Develop alternative evaluation metrics. Instead of BLEU/ROUGE scores which demand lexical overlap, create task-based success measures. Does the translation allow the user to identify the rabbit, regardless of whether the system encoded it as a stage or a whole?
  3.  **Year 3:** Pilot testing. Deploy models optimized for "charitable indeterminacy" rather than "reference matching" on sparse data sets.

  **Dependency:**
  This line is foundational. If we cannot mathematically or formally characterize acceptable indeterminacy in MT, we cannot hope to formalize it for human interpreters.

  ---

  ## Priority Line 2: Protocols for High-Stakes Interpreting
  **Focus:** Flagging alternatives and initiating clarification routines in medical and asylum settings.

  **Rationale:**
  This line is prioritized second because it addresses the *severity* of consequences. In the *gavagai* scenario, the difference between "rabbit" and "undetached rabbit part" is ontologically significant but practically benign. In medical or legal settings, the difference between a mass and count noun (e.g., "blood" vs. "a blood"), or the presence/absence of evidential markers (how the speaker knows the event occurred), determines dosage, timing, and credibility. The Quinean moral that "principles of charity do indispensable yet potentially distorting work" is dangerous here. An interpreter applying charity to smooth over a grammatical mismatch may inadvertently alter a patient's consent or an asylum seeker's testimony.

  **Team Fit:**
  This line utilizes the **Philosophers** (ethics of interpretation, logic of testimony) and the **Linguist** (semantic typology of tense, aspect, and modality). It translates the abstract "inscrutability of reference" into concrete "risk of misattribution."

  **Work Plan:**
  1.  **Year 1:** Case mapping. Identify specific grammatical distinctions (mass-count, evidentiality, singular-plural) that lack one-to-one mapping between common language pairs in asylum/medical contexts.
  2.  **Year 2:** Protocol design. Develop a "Flagging System." Instead of forcing a determinate gloss, the interpreter is trained to output: "The source term allows for X or Y; context suggests X, but Y is possible."
  3.  **Year 3:** Simulation and validation. Test whether these protocols reduce error rates in simulated high-stakes scenarios compared to standard "fluency-first" interpreting.

  **Dependency:**
  This line depends on Line 1. The theoretical framework for "acceptable divergence" developed for MT will inform the "Flagging System" for humans. We must know *which* indeterminacies are benign before we know which require flagging.

  ---

  ## Deprioritized Lines

  ### Deprioritized A: Training in Elicitation and the Conscious Use of Charity
  **Status:** **Explicitly Deprioritized.**
  **Reasoning:** This line is **methodological rather than substantive**. While crucial, "training" is the delivery mechanism for the findings of Lines 1 and 2. To research *how* to train interpreters (Line 4) before determining *what* they should do when faced with indeterminacy (Lines 1 & 2) puts the cart before the horse. Furthermore, the prompt asks whether making charity explicit "systematizes antecedent bias." This is a theoretical question best resolved within the philosophical work of Lines 1 and 2. If we determine that charity is inherently distorting in high-stakes contexts (Line 2), the training curriculum writes itself (i.e., "minimize charity, maximize flagging"). Dedicating a sustained line of work to pedagogy would dilute the team's capacity to solve the underlying logical and semantic problems.

  ### Deprioritized B: Reliance on Translated Mental-State and Normative Vocabulary
  **Status:** **Subsumed/Deprioritized.**
  **Reasoning:** This line is **redundant given Priority Line 2**. The prompt describes this line as concerning "assessments of testimony, culpability, and informed agreement" in legal and clinical practices. These are precisely the domains covered by "High-Stakes Interpreting" (medical and asylum settings). Asylum cases turn on culpability and testimony; medical cases turn on informed agreement. To separate "Mental-State Vocabulary" from "High-Stakes Interpreting" creates an artificial boundary. The ontological shifts in "belief" or "obligation" are simply specific instances of the broader mass-count/tense-aspect problems addressed in Line 2. Merging this into Line 2 strengthens the high-stakes agenda by ensuring normative vocabulary is included in the protocol design, without consuming a separate research track.

  ### Note on Field Lexicography
  **Status:** **Contingent.**
  Field lexicography (Candidate 1) was the closest alternative to Priority Line 1. It was deprioritized because MT (Line 1) represents the dominant mode of translation for low-resource languages in the coming decade. A dictionary is a static resource; an MT system is an active agent. Given the team includes an MT researcher, prioritizing the dynamic system over the static record offers greater leverage. However, if Line 1 fails, Line 1's outputs (ontological divergence metrics) can be retrofitted into lexicographical standards.

  ---

  ## Tradeoffs and Risks
  **Tradeoff:** By prioritizing MT and High-Stakes Interpreting, we risk neglecting the *foundational* data collection of field linguistics (Lexicography) and the *human capital* development (Training).
  **Defense:** The team composition dictates this risk. A field linguist alone cannot overhaul lexicography standards globally; an MT researcher can alter evaluation metrics that affect thousands of models. Similarly, protocols (Line 2) are more immediately actionable than general training curricula (Line 4). We trade breadth of application for depth of impact in critical nodes (algorithms and critical human interactions).

  **Tradeoff:** Focusing on "acceptable divergence" (Line 1) might legitimize sloppy translation.
  **Defense:** The Quinean argument is not that "anything goes," but that behavioral evidence underdetermines ontology. Our research seeks to map the *boundaries* of that underdetermination. Legitimizing divergence where ontology varies but truth conditions hold is not sloppiness; it is precision regarding what translation can actually achieve.

  ## Conditions for Revising the Ranking
  The agenda is stable but not static. The ranking warrants revision under the following empirical or philosophical developments:

  1.  **MT Black-Box Intractability:** If, in Year 1, the MT Researcher determines that current neural architectures cannot be modified to track ontological commitment (i.e., the "hidden layers" cannot be forced to distinguish rabbit/stage without catastrophic forgetting), **Priority Line 1 should be swapped with Field Lexicography**. If the machine cannot learn the distinction, we must improve the human-readable records (dictionaries) that feed the data.
  2.  **Legal/Institutional Resistance:** If, in Year 2, pilot studies for **Priority Line 2** reveal that courts and hospitals legally forbid interpreters from "flagging alternatives" (viewing it as speculation rather than translation), the team must pivot to **Training (Line 4)**. If the protocol cannot be institutionalized, the only remaining lever is to train interpreters to recognize these moments internally to mitigate cognitive bias, even if they cannot speak them aloud.
  3.  **Philosophical Resolution of Charity:** If the Philosophers determine early on that "Principles of Charity" are not merely distorting but *constitutive* of any possible interpretation (i.e., without charity, no translation is possible, even in high-stakes settings), **Priority Line 2** must be revised. The agenda would shift from "flagging alternatives" to "documenting the specific charitable assumptions made," moving closer to the **Mental-State Vocabulary** line to audit the specific norms being imposed.

  ## Conclusion
  This agenda moves Quinean indeterminacy from a skeptical puzzle to an operational constraint. By focusing on how machines evaluate success (Line 1) and how humans manage risk (Line 2), the fellowship ensures that the *gavagai* argument changes practice where it matters most: in the algorithms that scale translation and the interactions that determine liberty and life.
