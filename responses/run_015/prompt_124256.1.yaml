      *   *Approval with Conditions (Pilot):* Best balance. Allows testing the hypothesis without committing full funds. It addresses the "reflexive spectacle" concern by demanding evidence that it leads to something *outside* the theater.

  4.  **Drafting the Memo - Section by Section:**

      *   **Header:** Standard Memo format (To, From, Date, Subject).
