answer: |-
  This is a sharp set of questions. You've correctly identified that the "Kelly literature" isn't a monolith but a tension between decision theory, ergodic economics, and metaphysics of agency. Since you are writing for a philosophy audience (practical rationality focus) and not a math finance journal, your value add lies in the *normative justification* and the *conditions of application*, not the derivation of the formula itself.

  Here is the breakdown of upstreamness, tractability, and strategic advice for your dissertation chapter.

  ### 1. Ranking by Upstreamness (Logical Priority)

  If you are trying to establish Kelly as a **normative standard** (rather than just a heuristic), the ranking is:

  1.  **Cluster 1: The Log-EU Reduction (Foundational/Normative)**
      *   **Why it's upstream:** This determines *what kind of norm* Kelly is. If Kelly is merely Expected Utility (EU) maximization with a specific utility function ($U(x) = \ln x$), then it is **prudential**, not epistemic. It tells us about an agent's risk aversion, not about the structure of the world or the correctness of beliefs. If, however, Kelly is derived from **ergodicity** (time averages vs. ensemble averages), it claims to be an objective feature of non-ergodic processes, which *can* constrain belief formation (i.e., "you are objectively wrong if you bet in a way that guarantees ruin").
      *   **Impact:** If you lose here (i.e., if you concede Kelly is *just* log-EU), Cluster 2 and 3 become much weaker. Cluster 2 becomes a standard debate about risk aversion in one-shots, and Cluster 3 becomes a niche metaphysical worry about utility functions.

  2.  **Cluster 2: Repeated vs. One-Shot (Applicability/Scope)**
      *   **Why it's mid-stream:** This asks where the norm applies. Standard decision theory says EU works for one-shots; Kelly proponents (like Ole Peters) argue that because we live in *time* not *parallel universes*, the "one-shot" is actually just the first step of a time trajectory.
      *   **Impact:** Settling Cluster 1 tells you *what* Kelly is; settling Cluster 2 tells you *when* it binds. If Kelly requires repetition to work (LLN), it has no normative force for existential risk (one-shot ruin). If it applies to one-shots (via ergodicity), it becomes a dominant strategy for high-stakes reasoning.

  3.  **Cluster 3: Temporal Continuity/Identity (Metaphysical Precondition)**
      *   **Why it's downstream (but critical):** This questions the *subject* of the optimization. Kelly maximizes growth *over time*. This presupposes a diachronic agent that captures the benefits of that growth.
      *   **Impact:** This is a constraint on Cluster 2. Even if Kelly applies to one-shots *conceptually*, it requires a continuous agent *ontologically*. If the agent undergoes "fission," "death," or "institutional restructuring" before the growth compounds, the geometric mean is irrelevant.

  ### 2. Tractability Assessment

  *   **Cluster 1 (Log-EU): Low Tractability for Novelty.**
      *   *Status:* This debate is exhausted. Samuelson (1979) argued it's just EU; Peters (2019) argues it's ergodicity.
      *   *Verdict:* Do not make this the core of your chapter. You must *take a stance* to clear the decks, but don't try to solve it. The philosophical tools here are standard decision theory. It's a "gatekeeper" argument, not a "contribution" argument.
  *   **Cluster 2 (One-Shot/Ergodicity): High Tractability.**
      *   *Status:* This is the live wire in philosophy of economics and rationality. The "Ergodicity Economics" framework gives you fresh terminology to bypass the standard EU objections.
      *   *Verdict:* Very fertile ground. You can engage with the "St. Petersburg Paradox" literature and existential risk without getting bogged down in utility function stipulations.
  *   **Cluster 3 (Identity/Continuity): High Risk / High Reward.**
      *   *Status:* Underexplored in this specific context. Usually, identity is discussed in ethics (Parfit), not decision theory.
      *   *Verdict:* This is your "dissertation hook." It is tractable *if* you ground it in **diachronic rationality** and **commitment problems** rather than pure metaphysics. If you get too abstract ("do souls persist?"), it becomes a dead end. If you keep it practical ("do institutions maintain memory?"), it's gold.

  ### 3. Is the "Temporal Continuity" Angle Productive?

  **Yes, but only if you frame it as "The Unit of Optimization."**

  Don't frame it as "Does the soul persist?" Frame it as: **"Who captures the geometric growth?"**

  Kelly betting is essentially a strategy for *survival and compounding*. It is irrational for a mayfly. It is rational for a sequoia.
  *   **The Productive Line:** Connect this to **time-consistency** and **preference stability**. If an organization (or agent) changes its utility function or identity midway through the compounding period, the geometric mean maximization strategy may no longer be optimal for the *successor* agent.
  *   **The Philosophy Link:** This connects Kelly to **Parfit's Reductionism** and **Bratman's Planning Theory**. If personal identity is just psychological continuity, and high-stakes decisions disrupt psychological continuity (e.g., trauma, radical belief update), does the "Kelly agent" survive the bet?
  *   **Does it change the math?** No. But it changes the **felicity conditions**. It turns Kelly from a universal norm into a conditional norm: *"Maximize geometric growth IF you are a diachronically continuous agent."* This is a genuinely philosophical contribution.

  ### 4. Recommendation: Which Two Clusters to Build Around?

  For a philosophy dissertation chapter on practical rationality, I recommend building around **Cluster 2 (Repeated vs. One-Shot)** and **Cluster 3 (Temporal Continuity)**.

  **Why not Cluster 1?**
  Because the "Is it Log-EU?" debate is a stalemate that often leads to math-heavy wrangling. You can acknowledge it ("Whether Kelly is distinct from Log-EU or not, it relies on time-averaging...") and move on. Your audience cares about *rationality*, not the taxonomy of utility functions.

  **Why Cluster 2 & 3?**
  This combination allows you to tell a cohesive story:
  1.  **The Problem:** Standard EU fails in high-stakes/one-shot scenarios (Cluster 2).
  2.  **The Proposed Solution:** Kelly/Ergodicity offers a way to reason about one-shots by treating them as part of a time trajectory.
  3.  **The Catch:** This solution *only* works if the agent persists across that trajectory (Cluster 3).
  4.  **The Contribution:** Therefore, Kelly rationality imposes a **metaphysical constraint on agency**. To be a "Kelly rational" agent is to commit to diachronic continuity.

  **Strategic Outline for the Chapter:**
  *   **Section 1:** Briefly dismiss/bracket the Log-EU reduction. Argue that regardless of derivation, Kelly relies on *time-averaging*.
  *   **Section 2 (Cluster 2):** Argue that for high-stakes/one-off decisions, time-averaging is the only coherent standard (engaging with Ergodicity Economics). This solves the "ruin" problem.
  *   **Section 3 (Cluster 3):** Introduce the "Identity Constraint." Argue that time-averaging presupposes a beneficiary that persists. Discuss cases where identity breaks (institutional collapse, radical belief revision).
  *   **Conclusion:** Kelly isn't just a betting strategy; it's a theory of **diachronic agency**. It tells us that rational belief-formation requires a commitment to remaining the same agent long enough for the beliefs to cash out.

  **Final Warning:**
  Be careful not to let Cluster 3 become too speculative. Anchor it in **institutional rationality** (e.g., corporations, endowments, states) where "identity" is defined by charters and memory, which is more tractable than human personal identity. This keeps it in the realm of *practical* rationality.

  This approach makes your paper distinctively philosophical (agency/metaphysics) while remaining grounded in the decision theory literature (ergodicity/one-shots). It avoids the math trap of Cluster 1 while leveraging the novelty of Cluster 3.
