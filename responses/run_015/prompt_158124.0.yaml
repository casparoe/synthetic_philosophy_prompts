  Right, I want you to write the full spec — the desiderata — for any theory of self-locating belief thats actually adequate, not just one that redescribes Sleeping Beauty puzzles. Start with the obvious ones: empirical coherence with observed frequencies, respecting the principal principle, avoiding double-counting when an agent learns both a centred fact and its uncentred counterpart. But then push into the weeds: what must the theory do when the branching structure is partly hidden, say in quantum branching where the agent hasnt measured the outcome that determines the weights, or in nested simulations where you dont know which layer counts as base reality? For each requirement, say why its genuinely required and flag whether its non-negotiable or just a prejudice of one camp. I especially want you to identify any subset that looks jointly unsatisfiable — particulaly updating rules that have to cover both observed and unobserved branching parameters. Then briefly score Elgas halfer position, the Lewisian centred-worlds picture, and the two-dimensionalist patch against the list. Dont sit on the fence: tell me whether any existing framework meets the full spec or whether we need a genuinely new architecture. Write it as an essay but keep the weight on the criteria, not on name-dropping. And please, no bibliographies or reading lists — Im writing this for a seminar on indexical reasoning and I need the conceptual map, not a shopping list. Oh, and use British spellings — Im not in the mood for American ones today.
