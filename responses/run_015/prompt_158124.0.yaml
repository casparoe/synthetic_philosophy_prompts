answer: |-
  **The Architecture of Indexical Reasoning: A Specification for Adequacy**

  The discourse on self-locating belief has stagnated. It has become too comfortable resting on the laurels of the Sleeping Beauty problem, treating the puzzle as the end goal rather than a stress test. An adequate theory of self-locating belief cannot merely offer a verdict on whether Beauty should assign a credence of one-half or one-third to Heads. It must provide a robust normative framework for agents embedded in physical realities that include quantum branching, potential simulation hierarchies, and memory manipulation. We require a specification—a set of desiderata—that any viable theory must satisfy. If a framework cannot meet these criteria, it is not merely counter-intuitive; it is broken.

  What follows is the conceptual map for such a theory. I will outline the requirements, distinguish the non-negotiable from the merely prejudicial, identify the tensions that render the spec jointly unsatisfiable for current models, and score the existing contenders. The conclusion will be stark: none of the current architectures suffice.

  ### I. The Core Desiderata

  **1. Empirical Coherence with Observed Frequencies**
  *Requirement:* In scenarios where an agent makes repeated decisions based on self-locating credences, the long-run frequency of successful outcomes must align with the credences prescribed by the theory. If a theory dictates a betting policy that leads to systematic loss against a bookie who knows the experimental setup, the theory fails.
  *Status:* **Non-negotiable.**
  *Justification:* Belief guides action. A normative theory of belief that systematically guides an agent towards Dutch Books or utility loss in repeatable experiments is pragmatically incoherent. It does not matter if the logic feels elegant; if it bleeds money in the long run, it is false.

  **2. Adherence to the Principal Principle**
  *Requirement:* Where objective chances are known, self-locating uncertainty must not override them without specific defeating evidence. If an agent knows a quantum coin has an objective chance of 0.5 for Heads, their credence in Heads should be 0.5, absent other information. Self-location should not act as a magic wand that distorts objective chance.
  *Status:* **Non-negotiable.**
  *Justification:* To sever the link between objective chance and rational credence is to abandon empiricism. If self-locating information allows an agent to ignore the Principal Principle, then chance becomes epistemically inert, undermining the physical basis of probability.

  **3. Centred/Uncentred Hygiene (No Double-Counting)**
  *Requirement:* When an agent learns a centred fact (e.g., 'It is Monday') and its uncentred counterpart (e.g., 'The experiment is in the Monday state'), the update rule must not treat these as independent pieces of evidence. The theory must formally distinguish between learning *where* one is and learning *what* world one is in, ensuring that the same physical fact does not shift credence twice.
  *Status:* **Non-negotiable.**
  *Justification:* Double-counting inflates the weight of evidence artificially. It leads to over-confidence and violates the axioms of probability conservation. A theory that cannot parse the difference between 'I am here' and 'This world is actual' is conceptually confused.

  **4. Sensitivity to Hidden Branching Structures**
  *Requirement:* The theory must assign credences correctly in cases where the branching structure of reality exists but has not yet been observed by the agent. Specifically, in Everettian quantum mechanics, before a measurement is registered, the agent exists on a branching tree with specific weights (amplitudes). The theory must dictate whether credence tracks branch *count* or branch *weight*.
  *Status:* **Non-negotiable.**
  *Justification:* We live in a world where quantum mechanics is our best physical theory. A theory of belief that only works for classical coin tosses but collapses when applied to unobserved quantum superpositions is physically inadequate. It must handle the 'pre-measurement' self-location problem without begging the question.

  **5. Simulation and Layer Neutrality**
  *Requirement:* In scenarios involving nested simulations (where an agent does not know if they are in base reality or a simulation), the theory must not force a collapse into scepticism solely based on indexical indifference. If there are vastly more simulated copies than base agents, the theory must provide a principled reason for why credence in base reality does not vanish to zero, or explain why it should.
  *Status:* **Non-negotiable (for a general theory).**
  *Justification:* While the simulation hypothesis is speculative, a general theory of self-location must handle ontological uncertainty. If a theory implies that we are almost certainly simulations simply because copies are easier to make, it renders all empirical science suspect (since simulations can be programmed to lie). A viable theory must preserve the possibility of trusting physical evidence over indexical counting.

  **6. Diachronic Consistency**
  *Requirement:* The updating rule must prevent an agent from knowing in advance that they will change their mind in an irrational way. An agent should not be able to predict that their future self will hold a credence that their current self views as erroneous, absent new evidence.
  *Status:* **Non-negotiable.**
  *Justification:* Violating this leads to dynamic inconsistency and exploitation. If I know my future self will bet differently than I would now, without new information, my current agency is undermined.

  ### II. The Impossibility Result

  Here we encounter the hard constraint. There is a subset of these desiderata that appears jointly unsatisfiable under standard Bayesian architectures. This is not a bug of specific puzzles; it is a structural feature of the problem space.

  The tension lies between **Empirical Coherence**, **The Principal Principle**, and **Standard Conditionalisation**.

  In quantum branching cases (Requirement 4), if you adhere to the Principal Principle, you must weight your credences by the Born Rule (amplitude squared). However, if you treat self-locating uncertainty via a principle of Indifference (often used to satisfy Empirical Coherence in Sleeping Beauty-style cases), you tend to count branches equally regardless of weight.
  *   If you count branches equally, you violate the Principal Principle (in quantum cases).
  *   If you weight by amplitude, you often violate the intuitive indifference required to maintain Empirical Coherence in classical duplication cases (like Sleeping Beauty).
  *   If you attempt to fix this via Standard Conditionalisation, you fail because self-locating information often does not come in the form of partitioning the space of uncentred worlds cleanly.

  Furthermore, Requirement 5 (Simulation Neutrality) clashes with Requirement 1 (Empirical Coherence) if one adopts a simple Indifference principle over observer-moments. If there are infinite simulations, Indifference dictates credence zero for base reality. But if credence is zero, you ignore all physical evidence suggesting you are in base reality, violating Empirical Coherence with observed physical laws.

  To satisfy the full spec, a theory must abandon at least one standard assumption: either the Principal Principle must be modified for centred propositions, Standard Conditionalisation must be replaced for self-locating updates, or the ontology of 'branches' must be decoupled from 'observer-moments'.

  ### III. Scoring the Existing Frameworks

  We must now judge the current contenders against this specification. I will not be gentle.

  **1. The Elgan (Thirder) Position**
  *Framework:* Centred worlds combined with a restricted Principle of Indifference.
  *Score:* **Fail.**
  *Analysis:* Elga's approach secures Empirical Coherence in the classical Sleeping Beauty case (Requirement 1). It handles the betting odds correctly there. However, it falters on Requirement 2 (Principal Principle) when applied to quantum branching. By treating observer-moments as the primary unit of indifference, it tends towards branch-counting rather than weight-tracking, which contradicts quantum mechanical probabilities. It also struggles with Requirement 3 (Hygiene), as the move from uncentred to centred credence often looks like an update on evidence that wasn't strictly new, risking double-counting. It is a patch for classical puzzles, not a physics-ready theory.

  **2. The Lewisian (Halfer) Centred-Worlds Picture**
  *Framework:* Centred propositions treated as subsets of possible worlds, maintaining strict Conditionalisation.
  *Score:* **Fail.**
  *Analysis:* Lewis preserves Diachronic Consistency (Requirement 6) and Centred/Uncentred Hygiene (Requirement 3) better than the Thirder. He refuses to update on mere passage of time or self-location without new uncentred evidence. However, this rigidity causes a catastrophic failure on Requirement 1 (Empirical Coherence). In Sleeping Beauty, the Halfer position leads to betting policies that lose money in repeated trials. Furthermore, it offers no mechanism for handling Hidden Branching (Requirement 4); it treats the pre-measurement superposition as a single world, failing to capture the distinct self-locating uncertainty of being on one branch versus another before observation. It is logically clean but empirically bankrupt.

  **3. The Two-Dimensionalist Patch**
  *Framework:* Distinguishing between primary intensions (epistemic) and secondary intensions (metaphysical) to separate 'what is actual' from 'what is possible'.
  *Score:* **Fail.**
  *Analysis:* Two-dimensionalism is a semantic tool, not a normative theory of belief. It excels at describing *why* the confusion arises (Requirement 3), mapping the ambiguity between 'I am here' and 'This world is actual'. However, it does not prescribe *how* to update. It tells you there are two ways to read the proposition, but it does not tell you which reading governs rational credence in a branching universe. It fails Requirement 4 and 5 entirely because it lacks a mechanism for weighting the dimensions against physical chance. It is a map of the terminology, not the territory.

  ### IV. The Verdict: The Need for a New Architecture

  Do any existing frameworks meet the full spec? No.

  The Elgan model sacrifices the Principal Principle for empirical adequacy in classical cases. The Lewisian model sacrifices empirical adequacy for logical consistency. The Two-Dimensionalist model sacrifices normative guidance for semantic clarity. All three assume that self-locating belief can be modelled by simply adding a 'centre' to standard possible worlds semantics and applying Bayesian conditionalisation. This assumption is the root of the failure.

  We require a genuinely new architecture. This architecture must likely decouple the *measure* of existence from the *count* of observers. In quantum branching, the 'weight' of a branch is not a count of people; it is a physical magnitude. A viable theory must treat self-locating credence as a function of physical measure, not just indexical distinctness.

  Furthermore, the updating rule cannot be standard conditionalisation. Standard conditionalisation assumes the evidence partitions the logical space. Self-locating evidence often shifts the agent's relation to the space without eliminating worlds. We need an update rule that allows for 'credence diffusion' across centred worlds without requiring the elimination of uncentred possibilities.

  Finally, regarding simulations, the theory must incorporate a 'complexity penalty' or a 'computational measure' that prevents infinite copies from swamping base reality credence simply by number. Without this, Requirement 5 is impossible to meet.

  To the seminar participants: do not look for the solution in refining the Halfer/Thirder debate. That debate is a symptom of the underlying architectural failure. The task ahead is to construct a theory of indexical belief that respects the Principal Principle in a multiverse, maintains empirical coherence in duplication cases, and avoids sceptical collapse in simulation hierarchies. Until a framework can satisfy the desiderata of Empirical Coherence, Principal Principle adherence, and Hidden Branching sensitivity simultaneously, we are merely rearranging deckchairs on a sinking ship. The current map is wrong; we need to draw a new one.
