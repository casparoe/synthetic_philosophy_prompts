answer: |-
  # Specification for an Adequate Theory of Valid Consent

  ## I. Desiderata and Motivating Cases

  **1. Veracity of Act-Description (Deception)**
  *   **Requirement:** Consent is invalid if the consenter is deceived regarding the fundamental nature of the act being performed.
  *   **Motivating Case:** A patient consents to a "therapeutic massage" which is actually a sexual assault (deception about nature) versus a patient consents to surgery based on a surgeon's overly optimistic success rate (deception about welfare/probability). The former must vitiate consent; the latter is a boundary case.
  *   **Negotiability:** [NON-NEGOTIABLE] Deception regarding the *nature* of the act destroys the object of consent. Deception regarding *consequences* or *welfare* is [CAMP-SPECIFIC], depending on whether the theory prioritizes subjective expectation or objective risk assumption.

  **2. Absence of Direct and Structural Coercion**
  *   **Requirement:** Consent must be free from threats that worsen the consenter's baseline, including structural dependencies that remove reasonable alternatives.
  *   **Motivating Case:** "Sign this contract or I will break your legs" (direct threat) versus "Sign this contract or you cannot access the only employer in this company town" (structural/dependency coercion).
  *   **Negotiability:** Prohibition of direct threats is [NON-NEGOTIABLE]. The treatment of structural dependency is [CAMP-SPECIFIC]; libertarian accounts may accept it as a hard constraint of reality, while egalitarian accounts may view it as vitiating validity.

  **3. Threshold Competence at Moment of Agreement**
  *   **Requirement:** The consenter must possess the cognitive capacity to understand, retain, and weigh relevant information at the time of agreement ($t_1$).
  *   **Motivating Case:** A patient with advanced dementia attempting to sign a surgical waiver (enduring incompetence) versus a patient who is heavily intoxicated but lucid enough to understand the immediate risk (temporary impairment).
  *   **Negotiability:** A minimum threshold is [NON-NEGOTIABLE]. The specific height of the threshold (decision-specific vs. global) is [CAMP-SPECIFIC].

  **4. Transparency of Alternatives (Manufactured Opacity)**
  *   **Requirement:** Validity requires that the information environment does not actively obscure reasonable alternatives through design or complexity, even if no false statements are made.
  *   **Motivating Case:** A software Terms of Service agreement where the "opt-out" of data sharing is buried in a sub-menu of a sub-menu (manufactured opacity) versus a simple lack of knowledge about data practices (ignorance). The theory must distinguish between *not knowing* and being *prevented from knowing* by interface architecture.
  *   **Negotiability:** [CAMP-SPECIFIC]. Strict disclosure models may ignore this if information is technically "available." Relational models treat this as a primary failure of validity.

  **5. Continuity of Capacity (Competence Drift)**
  *   **Requirement:** The theory must account for the validity of consent when capacity degrades between agreement ($t_1$) and execution ($t_2$) without explicit revocation.
  *   **Motivating Case:** A patient signs an advance directive to refuse feeding tubes (competent $t_1$), but upon developing dementia ($t_2$), happily eats when fed and shows no distress (incompetent $t_2$). Does the $t_1$ consent bind the $t_2$ action?
  *   **Negotiability:** [CAMP-SPECIFIC]. "Precedent Autonomy" camps prioritize $t_1$; "Critical Interests" camps prioritize $t_2$ welfare. No consensus exists on which moment governs.

  ## II. Suspected Conflicts (Joint Unsatisfiability)

  **The Opacity-Disclosure-Coercion Trilemma**
  A subset of requirements regarding Manufactured Opacity, Coercion, and Practical Feasibility appears jointly unsatisfiable. To cure Manufactured Opacity, a theory must mandate expanded disclosure obligations (forcing hidden options into the light). However, in relationships of dependency (e.g., employer-employee, doctor-patient), expanding disclosure obligations can itself become coercive. If a vulnerable party is presented with too many complex alternatives they feel obligated to process, the cognitive burden functions as a pressure tactic, or the act of demanding full transparency signals distrust that threatens the relationship. Thus, maximizing transparency to fix opacity may inadvertently increase structural coercion or render the interaction practically impossible, violating the desideratum of feasible social cooperation.

  **The Drift-Welfare Conflict**
  Honoring Competence Drift requirements creates a conflict between Past Autonomy and Present Welfare. If a theory binds the incompetent self ($t_2$) to the competent self's ($t_1$) prior consent (to respect autonomy over time), it may mandate actions that cause visible distress or harm to the present entity (e.g., enforcing a refusal of treatment on a demented patient who is currently content). If the theory prioritizes the present welfare of the $t_2$ self, it renders the $t_1$ consent revocable by the mere loss of competence, effectively nullifying the utility of advance planning. One cannot simultaneously maximize the binding force of prior autonomy and the protection of current non-autonomous welfare.

  ## III. Performance Scorecard

  **Informed-Consent Models**
  These models perform well on Veracity of Act-Description and Threshold Competence, as they rely on clear transactional moments and disclosure checklists. However, they fail significantly on Manufactured Opacity and Structural Coercion. Because they focus on the *provision* of information rather than the *reception* or *context*, they often validate consent where options were technically available but cognitively inaccessible due to design. They also struggle with Competence Drift, typically defaulting to the signed document at $t_1$ without a mechanism to weigh the qualitative state of the agent at $t_2$.

  **Pure Voluntariness Accounts**
  These accounts excel at identifying Direct Coercion, as they focus narrowly on the presence of threats that negate free will. However, they are brittle regarding Deception about welfare and Manufactured Opacity. If a choice is made "freely" (no gun to the head), voluntariness accounts often validate it even if the choice was based on lies about outcomes or structured within a manipulative environment. They generally handle Competence Drift poorly, as they lack a robust theory of internal capacity, treating the will as a binary switch rather than a degradability spectrum.

  **Relational-Autonomy Theories**
  These theories offer the strongest performance on Manufactured Opacity and Structural Coercion, as they analyze the power dynamics and information environments surrounding the decision. They are uniquely positioned to identify when dependency vitiates validity. However, they score poorly on actionability and clarity regarding Competence Drift. By emphasizing the social context and ongoing relationships, they often lack bright-line rules for when a prior agreement becomes binding, leading to indeterminacy in medical or legal enforcement where a definitive "valid/invalid" judgment is required at $t_2$.
