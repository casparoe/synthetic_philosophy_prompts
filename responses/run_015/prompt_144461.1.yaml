prompt: |-
  Write the full specification—desiderata, motivating cases, negotiability flags, and suspected conflicts—for an adequate theory of valid consent, concentrating on deception, coercion, and competence, but extending to two under-examined boundary conditions: “manufactured opacity,” in which relevant alternatives are hidden from the consenter not by false statements but by structuring the information environment so that certain options are cognitively unavailable; and “competence drift,” in which a consenter’s decision-making capacity changes between the moment of agreement and the moment of action, without any intervening revocation. For each requirement, give the concrete scenario or distinction that makes it necessary (e.g., distinguishing deception about the nature of the act from deception about the agent’s own welfare interests; distinguishing direct threats from dependency-based structural coercion; distinguishing temporary impairment from enduring incompetence; distinguishing proxy consent for a gradually declining patient from consent extracted during a transient lucid interval). Identify which desiderata are non-negotiable for any theory that respects autonomy and which are camp-specific preferences (such as requiring full information disclosure versus allowing reasonable risk acceptance, or requiring continuous competence versus allowing binding prior consent, or treating structural dependency as automatically vitiating versus merely conditioning validity). Then flag at least one subset of requirements that appears jointly unsatisfiable—particularly where protecting against manufactured opacity demands expanding disclosure obligations that may themselves become coercive in dependency relationships, or where honoring prior consent during competence drift conflicts with present welfare, or where excluding all deception requires an epistemic standard that eliminates consent in ordinary medical or commercial contexts. Finally, score briefly—no more than a parag