answer: |-
  This is a precise axiological mapping task. Since you are working at the PhD level, I will skip introductory definitions and focus on the structural constraints a viable Lexical-Threshold Negative Utilitarianism (LTNU) must satisfy to avoid collapsing into standard NU, standard Utilitarianism, or incoherence.

  Here are the core desiderata, followed by the specific tensions you flagged.

  ### Core Desiderata for LTNU

  **1. The Non-Archimedean Condition (Lexical Integrity)**
  *   **Requirement:** There must exist no finite quantity of positive value (pleasure, sub-threshold preference satisfaction) that can outweigh a single unit of supra-threshold suffering.
  *   **Reasoning:** This is the definitional core of the view. If aggregation can eventually trump the threshold, the view collapses into weighted utilitarianism. Formally, if $S_{high}$ is supra-threshold suffering and $P$ is any amount of positive value, $V(S_{high}) < V(P)$ must hold lexicographically, not numerically.
  *   **Constraint:** This precludes representation by a standard real-valued utility function. You need a hyperreal or lexicographic ordering.

  **2. The Phenomenological Anchor (Non-Arbitrariness)**
  *   **Requirement:** The threshold must be grounded in a phenomenological or functional discontinuity, not a stipulative number.
  *   **Reasoning:** To avoid the *Sorites Paradox* (see Tension #1). If the threshold is "7.5/10 pain," a micro-change to 7.500001 creates a moral universe flip. A decent theory needs a qualitative shift (e.g., loss of agency, psychological disintegration, specific neural firing patterns associated with panic vs. discomfort) to justify the lexical jump.

  **3. Sub-Threshold Commensurability**
  *   **Requirement:** Below the threshold, pain and pleasure must be mutually commensurable to allow for trade-offs.
  *   **Reasoning:** If they are not commensurable below the threshold, the theory becomes deontological constraints on mild suffering, paralyzing action. To function as a *utilitarian* view below the line, there must be a common currency (e.g., "hedons") that allows mild pain to be traded for mild pleasure.
  *   **Implication:** This creates a hybrid metric: Lexical above, Cardinal below.

  **4. Distributional Sensitivity Near the Boundary**
  *   **Requirement:** The theory must specify how to weigh many agents just below the threshold against one agent just above it.
  *   **Reasoning:** LTNU prioritizes the one above. But does it prioritize the one above against *millions* just below? If yes, it risks a "Lexical Repugnant Conclusion" (sacrifice a world of mild happiness to save one person from severe pain). If no, the lexical priority is weakened. A decent theory needs a principle for "near-miss" aggregation (e.g., does sub-threshold suffering aggregate to *become* supra-threshold?).

  **5. Existence Stability (The Asymmetry Constraint)**
  *   **Requirement:** The theory should not imply that non-existence is lexically preferred to existence containing only sub-threshold suffering and positive goods.
  *   **Reasoning:** Standard NU faces the "Benatar" problem (life is always net negative). LTNU aims to solve this by allowing positive goods to trump sub-threshold negatives. If the sub-threshold negatives aggregate to infinity in a large population, you might re-trigger the NU conclusion. The theory must cap the disvalue of sub-threshold suffering or allow positive goods to dominate in "normal" lives.

  ---

  ### Addressing Your Specific Questions

  **1. Commensurability: Solve or Bracket?**
  It must **bracket it across the threshold** but **solve it below the threshold**.
  *   *Reasoning:* You do not need a conversion rate between torture and pleasure because the lexical rule forbids the trade. However, below the threshold, you are effectively running a standard utilitarian calculus (otherwise you can't make decisions about minor inconveniences). If you claim incommensurability everywhere, you lose the "Utilitarianism" part of the view and become a pluralist deontologist.

  **2. Distributive vs. Aggregate Near Threshold**
  This is the critical failure point for most LTNU models.
  *   *The Problem:* If sub-threshold pains aggregate, does a billion pinpricks equal one torture session?
  *   *The Requirement:* A decent LTNU must deny that sub-threshold units aggregate *into* a supra-threshold unit (otherwise the threshold is porous). However, it must still allow sub-threshold units to aggregate *against each other* (to allow trade-offs with pleasure).
  *   *Distinction:* You need two aggregation rules: one for *intra-level* comparison (mild pain vs. mild pleasure) and one for *inter-level* comparison (which is forbidden).

  **3. Positive Goods Without Breaking Priority**
  Yes, it can allow positive goods, but only via **Lexical Ordering**, not **Weighted Summation**.
  *   *Mechanism:* Value is a vector $(S_{high}, S_{low}, P)$. Comparison is lexicographic. You minimize $S_{high}$ first. If $S_{high}$ is equal (or zero), you minimize $S_{low}$. If $S_{low}$ is equal, you maximize $P$.
  *   *Risk:* This makes positive goods "infinitely" less valuable than supra-threshold suffering, but "finitely" valuable against sub-threshold suffering.

  ---

  ### The Joint Unsatisfiability Claim (The Tension)

  You flagged the tension between *incommensurability above* and *comparing sub-threshold worlds*. I believe the deeper, jointly unsatisfiable pair is:

  **Phenomenological Continuity vs. Value Discontinuity**

  *   **Desideratum A:** The theory respects the phenomenological fact that pain intensity varies continuously (no sharp break in experience between 7.49 and 7.51).
  *   **Desideratum B:** The theory maintains a strict lexical discontinuity in value at the threshold (7.49 is tradable for pleasure; 7.51 is not).
  *   **The Conflict:** If experience is continuous, any sharp threshold is arbitrary (Sorites). If you make the threshold a "range" (fuzzy lexicality) to solve arbitrariness, you lose the strict lexical priority (Desideratum 1), because within the range, aggregation might trump.
  *   **Your Intuition:** You noted the tension between incommensurability above and comparing sub-threshold worlds. This is a symptom of the above. If you can compare sub-threshold worlds numerically, and supra-threshold worlds are lexically distinct, you create a **topological gap**. Mapping a continuous domain (pain intensity) to a disconnected range (lexical value) requires either arbitrariness (violating A) or imprecision (violating B).

  **Verdict:** These are jointly unsatisfiable for a *precise* theory. You must choose either a "Fuzzy Lexical" view (sacrifices precision) or a "Sharp Threshold" view (sacrifices phenomenological plausibility).

  ---

  ### Brief Scorecard

  | Theory | Lexical Integrity | Phenomenological Anchor | Sub-Threshold Flexibility | Existence Stability |
  | :--- | :--- | :--- | :--- | :--- |
  | **Standard NU** | **Fail** (No threshold, all pain lexical) | N/A | **Fail** (No positive trade-offs) | **Fail** (Implies anti-natalism) |
  | **Strict Lexical** | **Pass** | **Fail** (Arbitrary line) | **Fail** (Often bans all trade-offs) | **Pass** (If positive goods allowed below) |
  | **Graded-Lexical** (Ord-style) | **Pass** (By definition) | **Pass** (Attempts qualitative anchor) | **Pass** (Allows aggregation below) | **Pass** (Designed to solve this) |
  | **LTNU (Ideal)** | **Pass** | **?** (The Sorites Risk) | **Pass** | **Pass** |

  *Note on Ord:* Ord's work (specifically regarding global priorities and suffering) often leans toward the **Graded-Lexical** hybrid to avoid the paralysis of strict NU while maintaining the urgency of extreme suffering. His approach usually accepts the "arbitrariness" cost to save the "action-guiding" benefit.

  ---

  ### Confidence & Uncertainty

  **Confidence Level:** High (85-90%) on the structural/logical mapping. These are standard constraints in axiology regarding non-Archimedean values.

  **Least Certain Point:** The **Joint Unsatisfiability Claim**.
  *   *Reasoning:* I am less confident that *Phenomenological Continuity* is a hard constraint. Some philosophers (e.g., parfitian reductionists) argue that while pain *feels* continuous, the *moral relevant properties* (e.g., ability to consent, rationality, psychological coherence) might actually be discontinuous. If the threshold is based on *functional capacity* rather than *raw qualia intensity*, the Sorites problem dissolves.
  *   *Caveat:* If you anchor the threshold in raw qualia (hedonic intensity), the tension is fatal. If you anchor it in cognitive/functional breakdown, the tension is survivable. Most LTNU literature assumes the former, which is why the tension is usually flagged, but a sophisticated PhD thesis could argue for the latter to resolve the unsatisfiability.

  **Recommendation:** When reading Ord, check if he anchors the threshold in *intensity* (qualia) or *capacity* (function). That distinction determines whether the Sorites tension breaks the theory.
