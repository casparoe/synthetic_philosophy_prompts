      *   *Is it about evidence standards?* Yes. Worst-case proponents often demand formal verification or robust bounds (mathematical certainty). Average-case proponents accept empirical regularities (engineering confidence). This is a "Proof vs. Confidence" split.
      *   *Is it about the adversary?* Worst-case assumes an adversarial environment (nature or users trying to break it). Average-case assumes a benign/i.i.d. environment. This is a "Threat Model" split.
      *   *Is it about the definition of "Guarantee"?* Worst-case = "Never fails under condition X." Average-case = "Fails with probability $< \epsilon$ under distribution D."

      *Synthesis:* The stall isn't just one thing. It's a *category error* where both sides are optimizing for different objectives under different assumptions about the underlying terrain.
      *   Side A (Worst-Case) is playing **Security/Cryptography**: One bug breaks the system. Adversary is active.
