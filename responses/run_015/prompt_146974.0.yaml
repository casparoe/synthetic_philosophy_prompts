      *   *Verdict:* The user is close, but needs to broaden "warning shots" to "observable gradients of failure" and "non-adversarial hidden states."

  4.  **Determine What Would Move It:**
      *   *A Theorem?* Unlikely to apply to real NNs soon. Too abstract.
