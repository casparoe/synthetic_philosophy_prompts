answer: |-
  This is one of the richest rabbit holes in aesthetics and art economics. You have correctly identified that the value of art is not intrinsic to the object (the canvas and pigment) but is extrinsic (the narrative of origin).

  Here is the terminology, the philosophy, and the distinction you need to make your dealer sound like he knows exactly why the money evaporates.

  ### 1. The Crash: "Provenance Taint" or "The Authenticity Breach"

  There is no single dictionary word for this, but in auction house vernacular and art law, the phenomenon is called **Provenance Taint**.

  However, for your novel, you need to understand *why* an honest copy holds value while an exposed forgery does not.
  *   **The Honest Copy:** Sold as "In the manner of [Artist]." The contract between buyer and seller is transparent. You are buying skill and homage. The narrative is true.
  *   **The Forgery:** Sold as "[Artist]." The contract is fraudulent.
  *   **The Exposed Forgery:** Once caught, the object undergoes an ontological shift. It is no longer a "failed masterpiece"; it becomes **Evidence**.

  **The Term:** You might call it **"The Toxicity of Intent."**
  An honest copyist admits they are a copyist. Their skill is the product. A forger hides their skill to sell a lie. When the lie is exposed, the object is "burned." In the trade, a work with a damaged reputation is called **"Burned."**

  But the specific value loss you are describing—the gap between the honest copy and the exposed fake—is the cost of the **Deceptive Performance**. The market pays for the *performance of authorship*. When the performance is revealed as a trick, the audience feels cheated, not just about the money, but about the emotional connection they formed with the "master." That embarrassment has to be priced in. It drops to zero because nobody wants to hang a reminder of their own gullibility on their wall.

  ### 2. The Premium: "Notoriety Value" or "Artifact Status"

  When the exposed forgery sells for *more* than the forger's signed work, the object has ceased to be Art and has become **Artifact**.

  **The Term:** **"Notoriety Premium"** or **"Scandal Provenance."**
  Collectors of this specific item aren't buying aesthetics; they are buying a piece of history. They are buying the "Elmyr de Hory effect." (De Hory was a famous forger whose fakes eventually became more valuable than his originals because they were the ones that fooled the museums).

  In this state, the painting is a **Relic of the Deception**.
  *   **Signed Work by Forger:** "A nice painting by [Forger]." (Value: Aesthetic)
  *   **Exposed Forgery:** "The painting that fooled the Louvre." (Value: Historical/Narrative)

  Your dealer shouldn't call it a "confession discount." He should call it **"Crossing into Artifact."** He might say: *"Once it's caught, it's not a painting anymore. It's a trophy. People don't buy trophies to look at; they buy them to show off."*

  ### 3. The Philosophy: What Went Wrong with the Object?

  You asked for the literature on what is supposed to have gone wrong with the object itself. The heavyweight champion of this question is the philosopher **Nelson Goodman**, specifically in his book ***Languages of Art*** (1968).

  **Goodman's Argument:**
  Goodman argues that even if a fake is visually indistinguishable from the original (a "perfect fake"), there *is* an aesthetic difference. Why? Because knowing it is a fake changes how we look at it. We look for the tells. We look for the strain. We view it as an exercise in imitation rather than an exercise in expression.

  **The "Wrongness":**
  It is not about the copying. It is about the **misattribution of artistic agency**.
  *   When you look at a 1920s painter, you are looking for their struggle, their vision, their specific moment in time.
  *   When you look at a forgery, you are looking at the forger's study of that struggle.
  *   **The Breach:** The value collapses because the **Line of Transmission** is broken. Art is valued as a communication from the artist to the viewer. A forgery intercepts that line. It pretends to be a transmission from the Master, but it is actually a transmission from the Forger *about* the Master.

  **If Nobody Finds Out:**
  This is the delicious paradox. Goodman admits that if a fake is never discovered, it *functions* aesthetically as the real thing. However, he argues it is still ontologically inferior because the *possibility* of detection changes our stance toward it.
  But for your novel? If nobody finds out, the lie *becomes* the truth. The art market runs on consensus reality. If the experts agree it's real, it *is* real in every way that matters financially and socially. The "wrongness" is only activated by discovery. Until then, the forgery is **Schrödinger's Canvas**: both real and fake until the box is opened.

  ### 4. The Bonus: Manuscripts and Text

  This is where it gets technically fascinating, and you can use this to show off your dealer's knowledge. It depends on whether the art form is **Autographic** or **Allographic**. (Again, Goodman's distinction).

  *   **Painting (Autographic):** The history of production matters. Even a perfect physical duplicate is not the "work" if it doesn't have the right history of creation. A forged painting is a different work of art than the original.
  *   **Literature/Music (Allographic):** The history of production *does not* matter, only the sequence of words/notes.

  **The Manuscript Nuance:**
  *   **The Text:** If your forger types out a Hemingway novel word-for-word, it is not a forgery of the *work*. It is just a copy. The value is in the paper, not the words.
  *   **The Handwriting (The Manuscript):** If your forger handwrites a letter *as if* they were Hemingway, this becomes **Autographic**. Now the physical trace of the hand matters.

  **Does the value collapse carry over?**
  Yes, but differently.
  *   In painting, the visual beauty remains, but the *authorship* is voided.
  *   In a forged manuscript (handwritten), the *text* remains valid (allographic), but the *relic value* (autographic) is voided.

  However, if the forgery is of a *lost work* (a novel nobody knew existed), and it's exposed as a fake:
  *   **The Text:** If the writing is good, it might survive as the forger's work (like the "Hitler Diaries"—historically fake, but the text remains a curiosity).
  *   **The Value:** It crashes harder than a painting. Why? Because literature is judged on *voice*. If the voice is proven to be an imitation, the text itself is often deemed aesthetically bankrupt in a way a visual copy isn't. We forgive a painted copy for looking like the master; we condemn a written imitation for sounding like the master. It feels like plagiarism of the soul, not just the image.

  ### Summary for your Dealer Character

  Don't use "Confession Discount." It sounds like a coupon.

  **For the crash:**
  > "It's not about the brushwork. It's about the **Provenance Taint**. An honest copy admits it's a copy. A forgery admits it's a lie. Nobody wants to hang a lie in their dining room. It's **Burned**."

  **For the premium:**
  > "Wait. Now it's not art anymore. It's **Artifact**. You're not selling a 1920s landscape; you're selling the trophy that took down the authentication board. That's **Notoriety Value**. It's worth more as evidence than it ever was as a painting."

  **For the philosophy:**
  > "Goodman said there's always an aesthetic difference. I say there isn't. Not until the gavel falls. Until then, the lie *is* the truth. But once the lie breaks? The canvas doesn't change. The **Story** changes. And we sell stories, not canvas."

  **For the manuscript:**
  > "Painting is autographic; the history is the art. Text is allographic; the words are the art. Forge a painting, you steal a vision. Forge a manuscript, you steal a voice. People forgive a stolen vision faster. A stolen voice? That haunts them."
