answer: |-
  There is no single established term that captures this phenomenon in its entirety. The closest philosophical parent is **Pragmatic Individuation**, but that concept is too broad for your specific context. It covers how we carve up the world based on human interests, but it does not account for the specific asymmetry of error versus discovery that you observe in your tracker.

  The phenomenon you are describing is best carved as **Remedial Individuation**.

  It is not a matter of what a bug *is* (ontology) or what the word *means* (semantics). It is a matter of how a problem is *counted* for the purpose of elimination. Below is the definition, the application to your cases, and the distinctions from its nearest neighbors.

  ### The Carving: Remedial Individuation

  **Definition:** Two issue reports share **Remedial Identity** if and only if the minimal sufficient intervention required to satisfy both reports is singular.

  A "bug" in your tracker is not a defect in the code, nor is it a user's experience. It is a **unit of work**. The identity of the bug is determined by the granularity of the repair, not the topology of the error.

  This explains why your team resists the idea that they are "picking" a definition. They are not selecting a meaning; they are estimating a workload. When they say, "No, really, those are the same bug," they are asserting, "This requires one fix." When they say, "These are different," they are asserting, "This requires two distinct actions."

  ### Application to Your Three Cases

  1.  **Different Symptoms, One Null:**
      *   **Analysis:** Two reports map to one intervention (guard the null).
      *   **Verdict:** Remedial Identity holds. The work is singular.
      *   **Result:** Immediate merge. No friction.

  2.  **Same Output, Two Causes:**
      *   **Analysis:** Two reports map to two interventions (fix rounding, fix cache). Even if the user sees one problem, the engineer sees two distinct actions.
      *   **Verdict:** Remedial Identity fails. The work is plural.
      *   **Result:** Distinct bugs. The newcomer is wrong because they are judging by *symptomatic identity* (user view), while the team judges by *remedial identity* (fixer view). In your workflow, the fixer's view dictates the tracker.

  3.  **One Cause, Two Fixes/Owners:**
      *   **Analysis:** One root cause maps to two interventions (Subsystem A fix, Subsystem B fix).
      *   **Verdict:** Ambiguous Remedial Identity.
      *   **Result:** The split in your team is a disagreement over the definition of "Intervention."
          *   **Team Half A (One Bug):** Defines intervention as "Logical Change." One cause = one logical change.
          *   **Team Half B (Two Bugs):** Defines intervention as "Assignment Unit." Two owners = two tickets = two bugs.
      *   **Resolution:** This case stays split because the workflow cost of merging (coordination overhead) outweighs the conceptual benefit of unity.

  ### Application to Your Three Features

  **1. Graded Shifts**
  The grading is not about how similar the bugs look; it is about the **certainty of the intervention**.
  *   **High Confidence:** It is obvious that one code change fixes both reports. (Case 1).
  *   **Low Confidence:** It is unclear if one change will suffice, or if fixing one might break the other. (Case 3).
  *   **Competence:** A good triager is not someone who knows the rules, but someone who can accurately predict the scope of the fix before the fix is written. They know when the work is truly singular versus when it is merely coupled.

  **2. Non-Transitivity and Asymmetry**
  This is the strongest evidence for Remedial Individuation.
  *   **Non-Transitivity:** A and B share Fix 1. B and C share Fix 2. A and C share nothing. Identity is a property of the *fix*, not the *report*. Since fixes are contextual, identity is non-transitive.
  *   **Asymmetry (Error vs. Discovery):**
      *   **Merging (Distinct $\rightarrow$ Same):** You say, "We were wrong." You assumed the work was plural, but it was singular. This is an **estimation error**. You over-counted the labor.
      *   **Splitting (Same $\rightarrow$ Distinct):** You say, "It turned out to be two." You assumed the work was singular, but the code revealed hidden complexity. This is an **ontological discovery**. You under-counted the labor.
      *   **Why:** Complexity is a property of the system (discovered). Redundancy is a property of the tracker (corrected).

  **3. Rule Resistance**
  Rules fail because they try to codify **Etiological Identity** (same cause) or **Symptomatic Identity** (same error) when the actual driver is **Remedial Identity** (same fix).
  *   "Same root cause" fails in Case 3 (one cause, two fixes).
  *   "Same user failure" fails in Case 2 (same failure, two fixes).
  *   The rule misfires exactly where the *cost of the fix* diverges from the *nature of the fault*.

  ### Distinctions from Nearest Neighbors

  You correctly rejected the standard philosophical candidates. Here is exactly why Remedial Individuation differs from them:

  *   **Vagueness:** Vagueness implies a borderline where competent judges hesitate (e.g., "Is this heap large?"). Your team does not hesitate; they disagree confidently. The boundary is sharp, but it moves based on the context of the fix.
  *   **Polysemy:** Polysemy implies the word "bug" has two definitions (e.g., "code defect" vs. "user complaint") and speakers switch between them. Your team insists there is only one sense. They are not switching definitions; they are applying one definition (unit of work) to complex data.
  *   **Family Resemblance / Cluster Concepts:** These imply a static set of weighted features (symptoms, causes, severity). Your phenomenon is dynamic. A feature (like "same stack trace") might guarantee identity on Tuesday but be irrelevant on Wednesday if the fix strategy changes. The weight is determined by the **action**, not the feature.
  *   **Social Construction:** While the tracker is a social artifact, your team experiences the identity as objective ("found," not "made"). Remedial Individuation explains this: the constraint is real (the code *does* require two patches), even if the categorization is human.

  ### Boundary Cases: Where This Does Not Apply

  To ensure this term is tight, here is where you should *not* apply Remedial Individuation:

  1.  **Refactoring:** If a developer changes code to improve style without fixing a report, this is not a bug fix. Remedial Identity does not apply to voluntary work, only mandatory repair.
  2.  **Feature Requests:** If two users ask for the same feature, merging them is a product decision, not a remedial one. The "intervention" is not a repair of a broken contract but an expansion of scope.
  3.  **Post-Mortems:** In a retrospective document, you might group bugs by "root cause" for statistical analysis. Here, you are using Etiological Identity, not Remedial Identity. Do not confuse the analysis view with the tracker view.

  ### Summary

  You are not managing a list of defects; you are managing a queue of interventions. The word "same" in your tracker is shorthand for **"resolved by the same commit."**

  The friction you feel arises because the team sometimes speaks about the *fault* (which exists in the code) and sometimes about the *ticket* (which exists in the workflow). When these align, the call is instant. When they diverge (Case 3), the team splits along the fault lines of their own organization.

  **Term:** Remedial Individuation.
  **Core Principle:** Identity is determined by the minimal sufficient intervention.
  **Key Distinction:** It is teleological (goal-oriented), not ontological (thing-oriented) or semantic (word-oriented).

  This carving preserves the objectivity your team feels (the work is real) while explaining the instability (the scope of work is contextual). It validates your intuition that "negotiated identity" was close, but corrects it: it is not negotiated between people, it is dictated by the requirements of the repair.
