answer: |-
  There is no single canonical term in normative decision theory for this phenomenon, though it is best characterized as a form of **reflective inconsistency** or **context-dependent expected-value fanaticism**.

  This phenomenon occurs when an agent applies expected utility maximization rigorously in one domain (e.g., existential risk) to justify extreme resource allocation, but abandons or dampens that same calculus in a structurally identical domain (e.g., individual medical intervention) to align with intuitive priors, despite explicitly endorsing a uniform decision rule. It is defined by the decoupling of *mathematical structure* from *narrative framing*, where the weight given to low-probability, high-magnitude outcomes is contingent on the semantic category of the outcome rather than its contribution to the utility function.

  This differs from **scope neglect**, where an agent fails to perceive or respond to differences in magnitude altogether (e.g., valuing saving 2,000 birds similarly to 200,000); here, the agent perceives the magnitude but validates its relevance selectively. It also differs from standard **expected-value fanaticism**, which is a consistent property of a decision theory (like pure utilitarianism) that always prioritizes the highest expected value regardless of probability thresholds; the phenomenon you describe is not a commitment to fanaticism, but a *strategic deployment* of it.

  The edges of this phenomenon do not require explicit endorsement of expected utility theory (EUT). While it is most glaring when an agent claims allegiance to EUT yet violates its axiom of **extensionality** (treating equivalent prospects differently), it also occurs in intuitive reasoning where individuals operate with implicit, conflicting heuristics—one for "catastrophic/abstract" risks and another for "concrete/immediate" harms. In behavioral economics, this aligns with **framing effects** that violate **description invariance**, but in normative ethics, it represents a failure of **reflective equilibrium**, where general principles are not harmonized with specific judgments across different contexts.
