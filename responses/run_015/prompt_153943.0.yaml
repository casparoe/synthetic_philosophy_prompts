          3.  **The "Universal Language":** Schopenhauer claims music speaks a universal language of emotion/striving. If there is no intent to express, and no listener to receive it as such, is it still music? For Schopenhauer, art requires a subject (the genius) and an object (the work) for a subject (the listener).
          4.  **Nature Sounds:** Schopenhauer discusses natural sounds. He generally distinguishes between the "noise" of nature and "music." If the algorithm just translates physical causality into sound, it's closer to hearing the wind blow than hearing a symphony.

  5.  **Synthesize the Interpretation:**
