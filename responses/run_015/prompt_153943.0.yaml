      *   *Arts:* Most arts copy the *Ideas* (grades of the Will's objectification) found in the phenomenal world. They are shadows of shadows.
      *   *Music:* Music is unique. It doesn't copy the Ideas; it copies the *Will* directly. It is a "copy of the Will itself."
      *   *Intentionality/Genius:* Schopenhauer places heavy emphasis on the *genius* of the artist. The artist must have perceived the Ideas (or in music, channelled the Will) and objectified them in a work. The work is a vehicle for the listener to contemplate the Will without being enslaved by it.
      *   *The Listener:* The listener perceives the essence of the world (striving, suffering, satisfaction) through the music, without personal desire.
      *   *Mathematics/Structure:* Schopenhauer acknowledges the mathematical basis of music (harmonics, rhythm) but insists this is merely the "shell." The *essence* is the expression of the Will.

  3.  **Analyze the "Algorithmic/Generative" Case:**
