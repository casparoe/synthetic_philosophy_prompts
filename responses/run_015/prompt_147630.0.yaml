prompt: |-
  okay so i just had this exhausting argument with my friend about french laïcité versus anglo-american multiculturalism and i think we're talking past each other but i can't pin down exactly why. they kept saying laïcité is basically assimilation with a fancy republican vocabulary — that when france bans hijabs in schools it's not being "neutral" it's actively forcing muslim girls to become invisible in public space. and i was trying to defend the idea that there's a real conceptual difference between "passive neutrality" (the state just doesn't fund religions) and what you might call "active neutrality" (the state removes visible religious markers from shared institutions to preserve this ideal of vivre ensemble). but my friend kept asking: if the goal is equality, why does equality require invisibility rather than recognition? that's the multiculturalist position, right — that seeing and accommodating difference is what makes citizenship equal?

  so here's what i actually need explained, not the history or court cases. first, can you lay out the precise conceptual structure of the french republican argument: why is religious visibility in schools treated as a threat to democratic equality rather than just a private preference? second, where exactly does the multiculturalist rebuttal bite? is it that "active neutrality" secretly privileges secular culture as the invisible norm, or is there a deeper disagreement about whether the public sphere should be a space of particular identities or a space stripped of them? and third — there's this symmetry move people make where they say laïcité applies to everyone (christians can't wear big crosses either) so it's not targeting minorities. can you unpack whether that symmetry actually solves the problem, conceptually speaking, or whether it's just formal equality masking substantive domination?

  i don't need a bibliography or a list of philosophers to read, just the philosophical architecture. also please don't just say "both sides have points" — i want to know where the concepts actually diverge, and specifically whether the fight is really about equality at all or about two totally different pictures of what shared public life even is.
