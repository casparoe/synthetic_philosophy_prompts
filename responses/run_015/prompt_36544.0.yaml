answer: |-
  There is no single, universally standardized noun that captures this specific rhetorical maneuver with the precision you require. While critical theory and disaster studies have mapped the territory, they often lack a dedicated label for the *grammatical* mechanism you have identified.

  The nearest established concepts are **Naturalization**, **Reification**, and **Depoliticization**. However, each fails to fully capture the "carving" you need for your piece.

  *   **Naturalization** (from critical theory and sociology) describes the process by which contingent social arrangements are made to appear inevitable, biological, or laws of nature. It is the correct *ideological* category, but it is broad. It covers gender roles, racial hierarchies, and economic systems. It does not specifically denote the *transfer of agency* from a human subject to a meteorological object.
  *   **Reification** (from Marxist theory) is the treatment of human relationships as if they were relationships between things. It is close, but it usually refers to economic abstractions (e.g., "the market decided") rather than physical hazards (e.g., "the rain failed").
  *   **Depoliticization** describes the *outcome* (removing the event from the sphere of political contestation) but not the *method* (the grammatical erasure of the human actor).
  *   **Structural Violence** (Johan Galtung, Paul Farmer) describes the *reality* of the harm (social structures causing death), but it is an analytical tool for the investigator, not a name for the rhetorical strategy used by the officials you are quoting.

  Because existing terms describe the *ideology* or the *outcome* rather than the *mechanism of agency transfer*, I propose coining the term **Agentive Displacement**.

  ### The Concept: Agentive Displacement

  **Definition:**
  **Agentive Displacement** is a rhetorical and cognitive strategy wherein the causal agency for a mass casualty event is grammatically and conceptually shifted from human actors (officials, policymakers, guards) to non-human forces (weather, crops, markets, viruses). It is not merely a description of a hazard; it is a specific framing that renders human decision-making invisible by assigning the verb of destruction to an inanimate subject.

  **The Carving (Distinctions from Nearest Neighbors):**

  1.  **Vs. Euphemism:** A euphemism softens the *moral weight* of an action (e.g., calling civilian deaths "collateral damage"). **Agentive Displacement** denies the *existence* of the action entirely. It does not say "we killed them gently"; it says "no one killed them; the wheat died."
  2.  **Vs. Structural Violence:** Structural violence is the *material reality* that social structures cause harm. **Agentive Displacement** is the *narrative cover* that hides that reality. One is the wound; the other is the bandage that claims the wound appeared spontaneously.
  3.  **Vs. Naturalization:** Naturalization is the broad ideological project of making the social seem natural. **Agentive Displacement** is the specific *tactic* used within that project. All Agentive Displacement is Naturalization, but not all Naturalization involves Agentive Displacement (e.g., claiming poverty is "human nature" is naturalization, but it doesn't necessarily displace agency to the weather).
  4.  **Vs. The Passive Voice:** The passive voice ("food was exported") is a grammatical tool. **Agentive Displacement** is the *political function* of that tool. One can use the passive voice without displacing agency (e.g., "mistakes were made by the ministry" still acknowledges the ministry). Agentive Displacement requires the *substitution* of the human agent with a natural one ("the harvest failed").

  **Boundary Cases: Sincerity vs. Strategy**

  A crucial advantage of **Agentive Displacement** is that it describes the *structure* of the argument, not the *intent* of the speaker. This allows you to navigate the boundary between cynicism and ignorance.

  *   **Strategic Displacement:** An official knows food is being exported but says "the rains failed" to avoid accountability. This is a lie utilizing Agentive Displacement.
  *   **Sincere Displacement:** An official genuinely believes that market forces or weather are the primary drivers, failing to recognize that policy determines who starves when the weather fails. This is an ideological blind spot utilizing Agentive Displacement.

  In both cases, the *effect* is the same: the moral bookkeeping is altered so that no human is liable. By using **Agentive Displacement**, you can critique the framing without needing to prove malicious intent, which is often historically difficult to establish. You are analyzing the *grammar of power*, not just the psychology of the powerful.

  ### Application to Your Examples

  *   **Irish Famine:** "The blight destroyed the crop" (Agentive Displacement) vs. "The administration permitted the export of grain" (Political Agency).
  *   **Bengal Famine:** "The food ran out" (Agentive Displacement) vs. "The war priority board diverted shipping" (Political Agency).
  *   **Great Leap Forward:** "The weather was unfavorable" (Agentive Displacement) vs. "The commune quotas seized the seed grain" (Political Agency).

  ### Why This Term Works for Your Piece

  **Agentive Displacement** gives your readers a specific lens. It allows you to point out that the phrase "the crop failed" is not a neutral observation of botany, but a political claim that absolves the state. It transforms the "weather" from a meteorological fact into a rhetorical shield.

  It fits your requirement for American English usage (clear, analytical, noun-heavy) and provides the "carving" you requested: it isolates the specific moment where responsibility evaporates into the atmosphere.

  **Recommendation:**
  Use **Naturalization** if you are discussing the broad historical ideology that makes famine seem inevitable. Use **Agentive Displacement** when you are analyzing the specific sentences, reports, and official statements where the human hand disappears and the weather takes the blame. It is the precise tool for the rhetorical autopsy you are performing.
