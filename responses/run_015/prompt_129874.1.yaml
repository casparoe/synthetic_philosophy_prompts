prompt: |-
  You are a professional philosopher of language and logic. I am a graduate student preparing a handout for my seminar on reference and quantification. Before you build anything, please take a moment to map the logical space of answers rather than retrieving standard textbook lists. I need a branching taxonomy—constructed first from diagnostic questions, then with named positions placed at the leaves—that sorts stances on extending Russell’s theory of definite descriptions into non-extensional contexts (belief reports, modal operators, and fictional discourse). Each branch should pose a concrete, label-free question: for instance, whether in an opaque context like ‘S believes the F is G’ the description takes wide scope over the attitude verb; whether an existence commitment is retained inside that belief report; and whether a description can play a singular-term semantic role despite being logically quantificational. For every combination of answers, name the leaf if it matches an actually defended view (strict Russellian, Strawsonian presuppositional, neo-Russellian scope-based, hybrid direct-reference, etc.), or mark it ‘unoccupied’ with a brief diagnosis (incoherent, unstable, or unexplored). Explicitly flag any pair of leaves your tree cannot cleanly separate. Throughout, clearly distinguish settled logical points—such as the scope ambiguity in belief reports—from genuinely contested interpretive claims about Russell’s own intentions or about which extension is correct, and do not present any contested view as the specialist consensus. Keep the instrument formal, suitable for a philosophy handout, and free of bibliographic requests.
