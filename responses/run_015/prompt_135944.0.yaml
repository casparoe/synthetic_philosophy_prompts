answer: |-
  You have stated the case with a sharpness that does me honor, though I fear you press the distinction between method and life too hard. In the reformed version you describe—where ends are chosen by an assembly and results published—you have secured the external machinery of democratic control, but you have not yet secured the internal condition of inquiry. Inquiry, in the social sense, is not merely the manipulation of conditions to produce a predicted output; it is the reconstruction of experience so that those who act may perceive the connection between what they do and what undergoes. If the assembly chooses the measure, but the individual user cannot trace how the variation in their treatment alters the quality of their own living, then the inquiry remains technical, not social. The defect is not in the logic of variation and observation, which you have preserved, but in the disconnect between the statistical consequence and the lived meaning of that consequence for the agent. Inquiry stops being full inquiry where the those whose conduct is reorganized are excluded from judging the *significance* of the consequences, even if they do not design the test itself.

  You ask if this is a defect my logic can name. It is. It is the failure to establish a continuity between the measured result and the felt value. When you say the shoe is instrumented and the pinch is read off a dial, you assume the dial reading cannot become part of the wearer's experience. But if the reading is not communicated back to the wearer in a way that illuminates their own feeling, then the public remains in eclipse. The danger in your arrangement is not that it uses experiment, but that it confines the intelligence of the experiment to a few managers while the many remain subjects rather than participants. Inquiry stops being democratic not when it uses statistics, but when the statistics do not serve to enlarge the perception of those whose lives are being rearranged. The method is sound; the distribution of its use is not.

  You ask if I require us to know less about the pinch so that more may speak of it. I answer that we know nothing of the pinch until it is spoken of in a way that matters to the walker. If the experimental arrangement produces a difference of averages that no individual can feel, then it has failed to identify a genuine public problem, for a public is constituted by shared consequences, not abstract aggregates. Your charge holds only if we accept that measurement replaces perception. I deny this. Measurement must refine perception, not replace it. If the assembly chooses the end, but the individuals cannot recognize the consequence as their own, then the ends themselves are hollow. The defect is not in inquiry, but in a social arrangement that permits inquiry to be conducted *upon* people rather than *by* them in cooperation. That is where democracy fails, not in the logic of testing, but in the failure to make the testing a common act.
