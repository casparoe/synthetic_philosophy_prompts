answer: |-
  Here is a complete lesson plan designed to generate the specific friction you're looking for. It moves beyond "designer intent" into "structural inertia."

  # Activity Title: The Legacy Patch

  **Core Concept:** Students will build a system to solve a problem, then leave. A new group will inherit that system without the original design notes, face a *changed* problem, and be forbidden from dismantling the original structure. They must "patch" it. The resulting monstrosity is the "orphaned politics."

  **Class Size:** 26 students (5 groups of 5, 1 group of 6).
  **Time:** 75 minutes.
  **Materials:**
  *   5 "Kits" (one per group): 10 sheets of cardstock, 1 roll of masking tape, 1 pair of scissors, 1 ruler, 20 wooden clothespins, 1 small cardboard box (the "Vault").
  *   30 "Access Tokens" (colored index cards cut in half).
  *   Role Cards (printed on distinct paper).
  *   A "Seal of Authority" (a red sticker or stamp) to place on finished builds.

  ---

  ## Part 1: Preparation (Before Class)

  1.  **Room Setup:** Arrange 5 clusters of tables. Place one Kit on each.
  2.  **The "Vault":** Each box should have a slit in the top. This is where Tokens are deposited/withdrawn.
  3.  **Stakes:** Announce at the very start that the 5 groups with the most Tokens at the end of class get a **5% bonus on their next reading response grade**. (Low cost to you, high enough stakes for sophomores to care).
  4.  **The "Lock":** You need a way to physically signify that the original build cannot be destroyed. The masking tape is key here.

  ---

  ## Part 2: Minute-by-Minute Run Sheet

  ### 00:00 – 00:05: Introduction (No Theory)
  *   **Say:** "Welcome. Today is a workshop on systems design. You are in five firms. Your goal is to maximize your firm's Token count by the end of class. Tokens determine your grade bonus."
  *   **Rule:** "You cannot touch another group's materials. You cannot trade Tokens between groups."
  *   **Silence:** Do not mention Winner. Do not mention politics. Do not mention ethics.

  ### 00:05 – 00:20: Phase 1 — The Build (Designers)
  *   **Task:** "Build a mechanism using *only* the Kit materials that controls access to the Vault. The Vault holds the Tokens. Your mechanism must determine **who** can take a Token and **when**."
  *   **Constraint:** "You must define the rule. Examples: First come first served? Lottery? Tallest person? Quietest person? Build the physical gate that enforces this."
  *   **Action:** Groups build. They will likely build simple chutes, clothespin gates, or height measurers.
  *   **TA Role:** Circulate. If a group asks "What's the best way?", say "That depends on your strategy."
  *   **End of Phase:** When time is called, they must stop. Place the **Seal of Authority** on the base of their structure. **Rule:** "No part of the structure below the seal may be removed or cut in Phase 2."

  ### 00:20 – 00:35: Phase 2 — Operation (Owners)
  *   **Task:** "Operate your machine for 10 minutes. Accumulate Tokens."
  *   **Action:** Students will optimize their own machine. It works fine because they built it for themselves.
  *   **TA Role:** Observe. Note which groups built for speed, which for fairness, which for exclusion.

  ### 00:35 – 00:40: The Handover (The Orphaning)
  *   **Action:** **Crucial Moment.**
  *   **Say:** "Time. The original design firms have been acquired. Please stand up. Leave your machines exactly as they are. Leave your design notes on the table (face down). **Move to the table to your left.**"
  *   **New Rule:** "You are now the Maintenance Crew. You inherit this machine. You do **not** know why it was built this way. You do **not** have the original design notes (they are 'lost')."
  *   **The Constraint:** "The Seal of Authority stands. You cannot remove the base structure. You can only *add* to it using the spare materials I will now distribute (give them 2 sheets of paper and 1 foot of tape each)."
  *   **The Twist:** "The University has changed the policy. Tokens are no longer for grades. Tokens are now **Exit Visas**. To leave class early (5 mins), you need a Token. However, **new safety regulations require that all Token claims be made while seated.**"
      *   *Note:* Most groups likely built standing mechanisms (chutes, height gates). This creates immediate friction.

  ### 00:40 – 01:00: Phase 3 — The Patch (Inheritors)
  *   **Task:** "Adapt the inherited machine to the new 'Seated Claim' rule without breaking the Seal. You have 15 minutes to test and patch. Then we run the system for 5 minutes."
  *   **Action:** Chaos. They will try to tape extensions, lower chutes, create levers. It will be clumsy. It will disadvantage someone (e.g., the person in the back can't reach the patch).
  *   **TA Role:** Enforce the "No Removing the Base" rule strictly. If they try to rip tape, stop them. "That's structural damage. Budget denied."
  *   **Role Injection (Optional but recommended):** At minute 50, hand one student in each group a **"Commuter Card."** It says: *You have 30 seconds to get a token or you miss your bus. You cannot wait in line.* Watch how the patched system handles urgency.

  ### 01:00 – 01:15: Debrief (The Theory)
  *   **Stop the activity.** Count tokens (irrelevant now).
  *   **Ask:** "How did Phase 3 feel compared to Phase 2?" (Expected: Frustrating, clunky, unfair).
  *   **Ask:** "Why didn't you just tear it down and build a seated dispenser?" (Expected: "You said we couldn't," "It was taped down," "Too much risk").
  *   **Ask:** "Look at the patches. Do they make sense on their own?" (Expected: No, they only make sense relative to the old base).
  *   **The Pivot:** Now bring in Winner.
      *   "Winner argues artifacts have politics. In Phase 1, the politics were **Intentional** (you chose the rule). In Phase 3, the politics were **Orphaned**."
      *   "The machine in Phase 3 excludes people. Did *you* choose to exclude them?" (No). "Did the *original* designers choose to exclude them?" (No, they designed for a different world).
      *   "The exclusion exists, but no one currently wills it. That is the politics of the artifact."

  ---

  ## Part 3: Role Cards (For Phase 3)
  *Hand these out secretly during Phase 3 to specific students to force friction.*

  1.  **The Commuter:** You must leave exactly at the 60-minute mark. If you don't have a token by then, you fail the task. You cannot wait in a queue.
  2.  **The Auditor:** You must record the serial number of every token taken. The machine must allow you to see the tokens clearly.
  3.  **The Mobility Impaired:** You cannot stand up. You cannot reach above waist height. (Mirrors the Moses bus constraint).
  4.  **The Noise Sensitive:** You cannot speak to claim a token. The machine must be silent.
  5.  **The Maintainer:** You are responsible if the machine breaks. You are risk-averse. Do not let the group make unstable patches.

  ---

  ## Part 4: Handling the Engineering Pushback
  *The "Just Redesign It" Objection*

  **The Student:** "This is inefficient. If we just ripped the tape off, we could build a better seated dispenser in 3 minutes. This activity is artificial."
  **The TA Response:** "You are absolutely right. In a vacuum, redesign is better. But you aren't in a vacuum."
  **The Follow-up:** "In the real world, 'ripping the tape off' costs millions of dollars, requires city council approval, or breaks backward compatibility with legacy code. The constraint I imposed (The Seal) represents **Sunk Cost** and **Institutional Inertia**. Winner's point about the parkways isn't that Moses was smart, it's that once the concrete is poured, the *next* generation of politicians doesn't have the power to move it. You felt the politics of the concrete, not the politics of the designer."

  ---

  ## Part 5: Honest Failure Analysis
  *What will go wrong the first time you run this?*

  1.  **The "Game" Trap:** Students might treat Phase 3 as a puzzle to "win" rather than a simulation to feel.
      *   *Fix:* In the debrief, focus on their *emotional* reaction to the constraint ("Did anyone feel angry at the machine?"). Anger is the data point.
  2.  **The "Compliance" Trap:** One group might quietly ignore the "No Removing" rule.
      *   *Fix:* Catch them. Make it a public "Budget Violation." Freeze their tokens for 2 minutes. This actually *helps* the lesson (authority enforcing legacy).
  3.  **The "It Worked Fine" Trap:** A group might build a simple bowl in Phase 1 that works for everyone in Phase 3.
      *   *Fix:* This is rare if you enforce the "Seal" on the *base*. If it happens, use them as the control group in debrief. "Why did Group 3 succeed? Because they built for *flexibility*. Most infrastructure is not built for flexibility. It is built for *permanence*."
  4.  **Time Creep:** Phase 1 often runs long.
      *   *Fix:* Be ruthless at minute 20. "Hands off the tape. Seals going on now."

  ---

  ## Part 6: Structural Limitations (What You Must Supply)
  *You asked what the activity cannot reproduce.*

  **1. The Time Scale of Habituation.**
  *   **The Gap:** In class, the "Orphaned" phase lasts 20 minutes. In reality, people live under orphaned politics for 40 years. They forget there *was* a different way.
  *   **Your Supply:** In the debrief, you must narrate the "forgetting." "In Phase 3, you knew it was patched. In real life, by the time you are a sophomore, the parkway is just 'the road.' You don't know it was patched. You assume the road is natural. That is the real danger."

  **2. The Violence of Enforcement.**
  *   **The Gap:** If a student breaks the rule in class, they lose points. If a bus tries to go under a low bridge in 1960, it crashes.
  *   **Your Supply:** You need to verbally underscore the physical reality. "When I said you couldn't remove the base, it was a rule. When Moses built the bridge, it was gravity. The politics of the artifact are strongest when the enforcement is physical, not administrative."

  **3. The Diffusion of Responsibility.**
  *   **The Gap:** In Phase 3, they know *you* (the TA) set the constraint.
  *   **Your Supply:** Remind them that in society, there is no TA. "There is no one to blame for the patch. The original designers are dead. The maintainers are just following procedure. The exclusion happens, but no one is responsible. That is the definition of technological politics."

  ---

  ## Why This Works for Your Mix
  *   **Eng/CS Majors:** They get to build (Phase 1) and optimize (Phase 2). They feel the technical debt in Phase 3. They respect the "Legacy Code" analogy.
  *   **PolSci/Soc Majors:** They feel the exclusion and unfairness in Phase 3. They can articulate the power dynamics in the debrief.
  *   **The "Bridge is Just a Bridge" Crowd:** They are forced to interact with a bridge (the machine) that actively stops them from sitting/claiming. They cannot claim it's neutral when it physically blocks their grade bonus.

  This activity moves Winner from "History of New York" to "My hands are taped to this cardboard and I can't get the token." That visceral frustration is where the theory sticks.
