prompt: |-
  I TA a 200-level course called Technology, Power, and Society at a big state school — about 26 students, mostly sophomores, maybe a third of them engineering and CS majors who are only there for the requirement and are pretty resistant, rest poli sci, sociology, a couple of philosophy majors. One 75-minute session, room with movable tables, no AV I'd want to depend on. Last week they read Winner's Do Artifacts Have Politics? — the bit about technical arrangements settling the affairs of a community in a way that isn't quite intended or unintended, the distinction between artifacts that require and artifacts that are merely compatible with a certain kind of social order, and the parkway overpasses built too low for buses. It went ok but I could tell half of them filed it under the-designer-was-prejudiced-got-it and the other half under fine-but-a-bridge-is-still-just-a-bridge-it-depends-who-uses-it.

  So I want them to feel something instead of sorting it into a box. Design me a runnable in-class activity — a game, or a build-it-then-live-under-it exercise — where the politics shows up in what happens to them and not in anything I say first; Winner's name shouldn't come up until the debrief. My rough idea, which you should improve or replace: split them into groups of 4 or 5, hand everyone identical cheap materials, and have each group design a small artifact or rule-machine that allocates one scarce, mildly desirable thing in the room (the good seats, the one whiteboard, snacks, a participation-point bonus, who presents first). They design without knowing who they'll be afterward; then I hand out roles — someone who has to leave exactly on the hour for a bus, someone with a back injury, someone with a loud straightforward preference, someone whose job is setting the room up before class — and then every group has to actually live under another group's machine for the rest of the session. No real money, obviously.

  The part I really want, and where I'd like you to get concrete, is a third phase that produces what I've started calling orphaned politics: the artifact's political effect outlives its reason, the people who built it are gone or no longer in charge, nobody currently wills that effect, and it still quietly distributes who can do what. I want them to arrive at that on their own and notice that both of the stories from the reading run out there — the one that says the thing itself has politics doesn't say whose, and the one that says look at the people who chose it can't find anyone still choosing. Design whatever twist gets them there (redeploy the machine into a changed setting, swap the population, change what the scarce thing is) without me announcing anything up front. Give me materials and prep, the rules, any payoff scheme, a minute-by-minute timeline, the roles, and a debrief that maps specific moments in the session onto those claims, including how to handle the engineering majors who'll say well-then-just-redesign-it. Also tell me honestly what will go wrong the first time I run this — last year I did a dumber version where I showed photos of stairs next to ramps and everyone just nodded and nothing landed — and, just as important, which feature of the real phenomenon the activity structurally cannot reproduce, so I know what I have to supply myself in the last ten minutes. My guess is it's something about time scale, sunk cost, and the fact that concrete doesn't get redesigned when the reasons for it expire, but I'd like you to say it better then that.
reasoning: |-
  Here's a thinking process that leads to the suggested activity:

  1.  **Analyze the Request:**
      *   **Context:** 200-level course "Technology, Power, and Society" (Big State School).
      *   **Students:** ~26 sophomores. Mix of Eng/CS (req, resistant, pragmatic) and Soc/PolSci/Phil (interested, theoretical).
      *   **Reading:** Langdon Winner's "Do Artifacts Have Politics?" (specifically: technical arrangements settling community affairs, artifacts requiring vs. compatible with social order, Robert Moses' parkway overpasses).
      *   **Previous Experience:** Students reduced it to "designer prejudice" vs. "bridge is just a bridge." Need to move beyond this binary.
      *   **Goal:** An in-class activity (75 mins) where politics *emerges* from experience, not lecture. Winner's name only in debrief.
      *   **Key Concept to Hit:** "Orphaned Politics" (politics outliving the reason/designer, no one currently wills the effect, but it persists).
      *   **Constraints:** Movable tables, no reliable AV, cheap materials, no real money.
      *   **Specific Request:** Improve/replace the user's rough idea (design a machine -> assign roles -> live under it). Need concrete third phase for "orphaned politics." Need materials, prep, rules, timeline, roles, debrief, failure analysis, and limitations of the simulation.

  2.  **Deconstruct the User's Rough Idea & Identify Weaknesses:**
      *   *Idea:* Groups design a machine to allocate a scarce good. Roles assigned *after* design. Groups live under *another* group's machine.
      *   *Weakness 1 (Orphaned Politics):* If the designers are still in the room, it's not truly "orphaned." The politics are still "owned" by the peers sitting right there.
      *   *Weakness 2 (Time Scale):* 75 minutes is too short to feel "historical inertia."
      *   *Weakness 3 (Engineering Pushback):* "Just redesign it" is the inevitable counter-argument. The activity needs to make redesigning costly or impossible.
      *   *Weakness 4 (Stakes):* "Participation points" or "snacks" might be too low stakes to generate real friction.

  3.  **Develop the Core Mechanic: "The Legacy System"**
      *   To get "orphaned politics," the designers need to be removed from power, and the users need to be stuck with the system *and* prevented from easily changing it.
      *   *Phase 1: Constitution.* Groups design a system to manage a resource.
      *   *Phase 2: Implementation.* Groups use the system.
      *   *Phase 3: The Twist (Orphaning).* The designers leave (or are silenced), the resource changes value/scarcity, but the *physical structure* of the system remains locked in.
      *   *Refinement:* Let's make the "artifact" physical. A structure built from cheap materials that controls access to something desirable (e.g., the "Good Zone" of the classroom, or a stash of actual candy/extra credit tokens).
      *   *The Twist:* In Phase 3, the "population" changes (simulated), but the artifact is bolted down (metaphorically or literally via rules). Actually, better: The *Designers* are fired. The *Users* become the *Maintainers*. They inherit the system. They are told they can modify it, *but* there is a "retrofit cost."

  4.  **Drafting the Activity: "The Turnstile Protocol"**
      *   *Resource:* Access to the "Premium Zone" (tables with power outlets/better chairs) or a physical token stash. Let's go with a physical token stash (representing "Participation Credits") locked in a box or behind a barrier.
      *   *Materials:* Cardboard, tape, scissors, string, rulers, one "Vault" (box) per group.
      *   *Phase 1 (Design - 15 mins):* Groups build a mechanism to distribute tokens. They define the rules.
      *   *Phase 2 (Operation - 15 mins):* Groups operate their own machine.
      *   *Phase 3 (The Orphaning - 25 mins):* **Crucial Change.** Groups swap machines. *However*, they are told the "Original Designers" have graduated/left. The new group inherits the machine. *Constraint:* They cannot destroy the machine. They can only add to it or patch it. *Complication:* The "Token Value" changes. Now tokens are needed for something specific (e.g., permission to leave early), but the machine was built for speed, not security, or vice versa.
      *   *Wait, let's tighten the "Orphaned" aspect.* To really hit Winner's Moses point, the physical constraint must remain while the social need changes.
      *   *Revised Phase 3:* The "City Council" (TA) changes the goal. Originally: Distribute tokens fairly. Now: Distribute tokens *only* to people who can solve a puzzle, BUT the machine physically prevents puzzle-solving (e.g., it dispenses tokens too fast, or requires standing which hurts the "injured" role).
      *   *Better Idea:* **The "Legacy Code" Simulation.**
      *   *Setup:* 5 Groups. Each builds a "Distribution Device" (cardboard/tape) that controls access to a pile of "Credits" (paper slips).
      *   *Phase 1:* Design.
      *   *Phase 2:* Run.
      *   *Phase 3:* **The Shift.** The TA announces a "Policy Change." The Credits are now worthless unless stamped. The machines *cannot* stamp. They only dispense. To fix this, you must integrate a stamping mechanism (provided by TA) into the *existing* structure without breaking the existing structure.
      *   *Actually, let's look at the "Moses Overpass" analogy.* The physical structure excludes a group.
      *   *Activity:* **"The Gateway."**
      *   *Goal:* Build a gate that lets people into the "Good Room" (front tables).
      *   *Phase 1:* Design the gate.
      *   *Phase 2:* Test the gate.
      *   *Phase 3:* **The Demographic Shift.** The "Population" changes. New constraints introduced (e.g., "Everyone must carry a heavy box now"). The gate no longer works. Can you fix it?
      *   *Constraint:* You cannot remove the original pillars/posts. (Simulating concrete/sunk cost).

  5.  **Refining for "Orphaned Politics" & Engineering Pushback:**
      *   To stop "Just redesign it," I need to impose a **Sunk Cost Penalty**.
      *   *Rule:* In Phase 3, you inherit the machine. You have a budget of "Modification Points." The original structure costs 100 points to remove. You have 10 points. You must patch it.
      *   *The Twist:* The "Users" in Phase 3 are different from Phase 2. (Assign Role Cards).
      *   *The "Orphan":* The original designers are gone. The new users hate the system but are forced to patch it. The patch creates a new, weird politics.

  6.  **Developing the Timeline (75 Minutes):**
      *   0-5: Setup/Intro (No theory).
      *   5-20: Phase 1 (Design/Build).
      *   20-35: Phase 2 (Live under your own).
      *   35-40: **The Handover** (Designers step back, new operators step in).
      *   40-60: Phase 3 (Live under the inherited system + New Constraint).
      *   60-75: Debrief (Winner, Politics, Orphaning).

  7.  **Addressing Specific Constraints:**
      *   *Engineering Majors:* They will want to optimize. Give them a constraint that optimization is impossible due to "legacy debt."
      *   *Sociology Majors:* They will focus on the unfairness. Validate this, then pivot to the *structure*.
      *   *Materials:* Cardboard, tape, string, scissors, clothespins, cups.
      *   *Scarce Good:* "Exit Tickets" (needed to leave class 5 mins early? No, admin won't like that). "Homework Passes" (TA has discretion). Let's use "Priority Review Tokens" (TA reviews their draft first next week). High value, low cost.

  8.  **The "Orphaned" Twist (Concrete Plan):**
      *   **Phase 1:** Groups build a "Dispenser" for the Tokens.
      *   **Phase 2:** They use it. It works fine.
      *   **Phase 3:** **The Context Shift.** The TA announces: "Due to new university policy, tokens must now be claimed *silently* to prevent disruption." OR "Tokens must now be claimed by people *seated* (simulating disability/bus constraint)."
      *   **The Kicker:** The machines were built for *standing* users or *loud* claims.
      *   **The Lock:** You cannot dismantle the machine. You can only add tape/cardboard. (Simulating concrete/infrastructure inertia).
      *   **The Result:** They create a Rube Goldberg patch that technically works but is absurd. *This is the orphaned politics.* The original logic is gone, the new logic is patched on, the result is a weird hybrid that disadvantages someone.

  9.  **Debrief Strategy:**
      *   Map the frustration in Phase 3 to Winner's "Inheriting the Parkway."
      *   Address "Just Redesign It": Explain *why* we didn't (Cost, Time, Authority). Connect to real infrastructure (highways, code bases, zoning laws).
      *   Winner's Name Drop: Now reveal the reading connection.

  10. **Failure Analysis (Honesty Check):**
      *   *Risk:* Students treat it as a game, not a simulation. *Mitigation:* Stakes must feel real (even if small).
      *   *Risk:* Phase 3 feels arbitrary. *Mitigation:* Frame it as "New Administration."
      *   *Risk:* Engineering students dominate. *Mitigation:* Assign specific roles (Operator, Citizen, Auditor) within groups.
      *   *Limitation:* Real time scale. 20 mins != 20 years. TA must narrate the "decay" and "habituation."

  11. **Final Polish:**
      *   Make the "Lock" physical. Use a "Do Not Remove" seal on the base of their build.
      *   Ensure the "Bus" analogy (Moses) is mirrored. Maybe the "Token" is access to the door? No, tokens are easier.
      *   Let's make the scarce resource **Access to the TA's Office Hours**. (Simulated).
      *   Actually, keep it simple. **Paper Slips.**
      *   *Role Cards:* The "Commuter" (needs speed), The "Parent" (needs hands-free), The "Auditor" (needs record).
      *   *Phase 3 Change:* The "Commuter" becomes the majority, but the machine was built for the "Auditor."

      *(Self-Correction during drafting)*: Keep the "Orphaned" concept central. The designers must leave the table. The new users must not know *why* it was built that way.
      *   *Idea:* Phase 1 Group A builds. Phase 2 Group A uses. Phase 3 Group B inherits Group A's machine. Group B does *not* get the design notes. Group B faces a new problem.
      *   *Yes, this is stronger.* Ignorance of original intent is key to "Orphaned Politics."

  12. **Structuring the Response:**
      *   Title: "The Legacy Patch."
      *   Materials List.
      *   Prep.
      *   Minute-by-Minute.
      *   Role Cards.
      *   The Twist (Phase 3).
      *   Debrief Script (mapping to Winner).
      *   Failure Modes & Limitations.

  13. **Refining the "Engineering Pushback":**
      *   When they say "Redesign," the answer is "You don't own the budget."
      *   Connect to Technical Debt.

  14. **Refining the "Orphaned Politics":**
      *   The "Patch" becomes the new permanent feature.
      *   The original purpose is forgotten.
      *   The new purpose is served clumsily.
      *   This mirrors the parkway: built for cars/leisure, blocks buses/transit, now we can't move it so transit is blocked forever.

  15. **Final Review against constraints:**
      *   75 mins? Yes.
      *   Movable tables? Yes.
      *   No AV? Yes.
      *   Winner only in debrief? Yes.
      *   Concrete "Orphaned" phase? Yes (Inheritance + Constraint + Ignorance).

