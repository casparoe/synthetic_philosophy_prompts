      *   Specific summary sentence? (Yes).
      *   Address the "agency nurse" insight? (Yes, regarding the audience for shame).

  9.  **Final Polish:** Ensure the distinction between "Guilt-Leaning" (Restorative) and "Shame-Leaning" (Sanctioning/Norm-Enforcing) is clear in the context of the procedure. *Correction:* The prompt asks for "GUILT-LEANING / SHAME-LEANING / NEITHER-STRUCTURAL / ESCALATE". I must use these exact terms in the verdicts.

      *   *Wait, one nuance:* The user says "I want that possibility [shame] honored rather than assumed away." So "Shame-Leaning" isn't necessarily bad in the procedure's logic, it's a specific tool for specific problems (repeat offenders).
      *   *Ethicist Objection:* I need to explain that "Accountability" is the goal, "Guilt/Shame" are the psychological pathways. The procedure uses the pathways to achieve the goal.

      *(Self-Correction on Case 2)*: The surgeon case is tricky. If I label it "Shame-Leaning," does that mean we humiliate him? No, it means we use social exposure (M&M, public record) to leverage his standing against him. It's "Status-Contingent Accountability." I will label it SHAME-LEANING because it leverages social regard.

