          *   Must fit on two laminated pages (concise, actionable).
          *   Runnable in 40 minutes by a rotating resident with half-day training.
          *   Grounded in psychology (guilt vs. shame) but actionable (situational/structural levers).
          *   Must address specific failure modes (silence/vanishing vs. performative apology/no change).
          *   Must identify levers actually controlled (who is in the room, name attached, public/private, speed, etc.).
          *   Must handle "hard cases" (guilt without change, no emotion, reputational conflict).
          *   Must address the ethicist's objection (accountability vs. emotions).
          *   Must run three specific cases (Resident pump error, Senior surgeon retained swab, Agency nurse med error).
          *   Specific formatting for case verdicts: `Case N — Verdict: GUILT-LEANING / SHAME-LEANING / NEITHER-STRUCTURAL / ESCALATE.`
          *   Specific closing sentence format: `Summary: [statement of what procedure is and cannot do].`
      *   **Core Tension:** The "Just Culture" slogan ("target systems not people") has led to silence/inaction. The user wants to distinguish between constructive guilt (remorse leading to repair) and destructive shame (hiding/defensiveness), acknowledging that sometimes shame/exposure *is* necessary for accountability.

  2.  **Deconstruct the Psychology (Guilt vs. Shame):**

      *   *Guilt:* "I did something bad." Focus on behavior. Leads to repair, confession, change.
      *   *Shame:* "I am bad." Focus on self. Leads to hiding, anger, withdrawal, defensiveness.
      *   *Nuance:* As the user noted, sometimes "shame" (social sanction/exposure) is the only lever for repeat offenders who lack internal guilt. The procedure shouldn't avoid shame entirely but must use it intentionally, not accidentally.
      *   *Actionable Levers:* Privacy vs. Publicity, Focus on Act vs. Person, Speed of Response, Presence of Peers/Leaders.

  3.  **Drafting the Decision Procedure (The "Two Pages"):**

      *   *Goal:* A flowchart or gated checklist.
      *   *Gates:* Need to filter cases based on risk, intent, history, and current emotional state.
      *   *Training:* Needs to be simple enough for a resident. Avoid jargon.
      *   *Values vs. Facts:* Need to identify where human judgment is required (e.g., assessing sincerity, weighing reputation vs. safety).
      *   *Escalation:* When does this go to HR/Fitness-to-Practice? (Pattern of harm, malicious intent, impairment).

      *   *Drafting the Gates:*
          1.  **Safety/Impairment Gate:** Is there immediate danger or impairment? (Escalate).
          2.  **History Gate:** Is this a pattern? (Shifts from system to individual accountability).
          3.  **Response Gate:** How did they react immediately? (Self-report vs. hidden).
          4.  **Lever Selection:** Based on 1-3, choose the intervention type (Private/Supportive vs. Public/Accountability).

      *   *Refining for the User's Constraints:* The user wants to know *what predicts the emotion*.
      *   *Prediction:* We can't predict emotion directly. We predict *response to intervention*.
      *   *Levers:*
          *   Private Conversation -> Supports Guilt/Repair.
          *   Public/Peer Review -> Risks Shame, but enforces Norms.
          *   Silence -> Risks Ambiguity (leads to either hiding or complacency).

      *   *Addressing the Ethicist:* The procedure should frame "Guilt/Shame" as "Restorative Accountability" vs. "Sanctioning Accountability." But since the user asked for the emotional distinction, I need to bridge them. The procedure survives the objection if it treats emotions as *mechanisms* for accountability, not ends in themselves.

  4.  **Developing the Three Cases:**

      *   *Case 1 (Resident):* First error, self-reported, high distress.
          *   *Analysis:* High guilt already. Risk of shame driving them away. Needs restoration.
          *   *Verdict:* GUILT-LEANING (Supportive).
      *   *Case 2 (Surgeon):* Repeat behavior, power imbalance, harm occurred, previous silence.
          *   *Analysis:* "Just Culture" failed. Needs accountability. Shame/Social sanction might be the only lever left.
          *   *Verdict:* SHAME-LEANING (Accountability/Exposure). *User might not like this because it feels punitive.*
      *   *Case 3 (Agency Nurse):* No ongoing relationship.
          *   *Analysis:* No audience for shame. No future for guilt/repair within the system.
          *   *Verdict:* NEITHER-STRUCTURAL (Administrative closure).

  5.  **Addressing the "Hard Cases":**

      *   *Guilt without change:* Needs escalation to performance management.
      *   *No emotion:* Needs investigation (burnout? psychopathy? detachment?).
      *   *Reputation vs. Good:* The procedure must prioritize patient safety over reputation, but acknowledge the tension.

  6.  **Refining the Output (Formatting & Tone):**

      *   Tone: Professional, clinical, authoritative, empathetic but firm.
      *   Format: Clear headings, bullet points, distinct sections for the Procedure, The Levers, The Hard Cases, The Ethicist, and The Cases.
      *   Constraint Check: Two pages worth of content (concise), 40-minute run time logic, specific verdict format, specific summary sentence.

  7.  **Iterative Polishing (Self-Correction during drafting):**

      *   *Critique:* Is the distinction between Guilt and Shame too academic for a resident?
      *   *Fix:* Translate to "Repair Focus" vs. "Norm Focus."
      *   *Critique:* The user asked for "Gates."
