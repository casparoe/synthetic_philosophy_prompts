answer: |-
  ### Stipulated Positions

  Before the spec, I am taking the following stances to constrain the theory:

  1.  **Cardinality:** The theory must deliver **cardinal, intertheoretically comparable numbers**. Ordinal rankings are insufficient because we are allocating under moral uncertainty (Hedonic vs. Desire). To weight these theories against one another, we need to know the *magnitude* of the trade-off, not just the direction.
  2.  **Pascal's Mugging:** The theory is **not allowed** to let a one-in-a-thousand credence on $10^{18}$ units of value dominate everything. Structural uncertainty regarding sentience probabilities undermines the precision required for pure expected value maximisation at extreme scales.
  3.  **Redescription:** The answer **may not shift** when we redescribe one population as two. If splitting 'Formicidae' into sub-families changes the budget allocation without new empirical data, the metric is gerrymanderable and useless.
  4.  **Revisability:** The theory must be revisable in light of **negative findings** (absence of expected neural correlates), not merely consistent with positive behavioural markers. Consistency is too low a bar; falsifiability is required.

  ***

  ### Desiderata for a Comparative Sentience Theory

  **1. Intertheoretic Cardinality**
  *   **Case:** We are refusing to pick between hedonic and desire-based welfare. To aggregate these under uncertainty, we require a common unit of account. If Theory A assigns insects 0.01 units and Theory B assigns 10 units, we must know if these units are comparable to mammal units to calculate a weighted priority. Ordinal rankings prevent this aggregation.
  *   **Status:** Non-negotiable.

  **2. Correlated Uncertainty Modelling (The Clade Gamble)**
  *   **Case:** Per the stipulation, sentience is a package deal at the taxonomic order level. The theory must not treat individual insects as independent bets. It must model the variance such that if the probability of sentience collapses for the order, it collapses for all $10^{18}$ individuals simultaneously. Ignoring this correlation vastly underestimates the risk of total misallocation.
  *   **Status:** Non-negotiable.

  **3. Invariance Under Partition**
  *   **Case:** Budget allocation should not depend on administrative taxonomy. If a theory yields different priorities when 'Coleoptera' is treated as one group versus split into 'Polyphaga' and 'Adephaga', it invites manipulation. The moral weight must attach to the individuals and their properties, not the Linnaean bucket they are placed in.
  *   **Status:** Non-negotiable.

  **4. Structural Uncertainty Discounting**
  *   **Case:** To satisfy the position on Pascal's Mugging, the theory must include a discount function for high-variance, low-credence estimates. When the evidence for sentience is sparse and the population size is astronomical, the expected value must be truncated to prevent a fragile hypothesis from consuming the entire budget.
  *   **Status:** Taste of the risk-averse camp (but required given my stance).

  **5. Falsifiability Conditions**
  *   **Case:** A theory that is merely consistent with all behavioural data is unfalsifiable. The spec must define specific neurophysiological absences (e.g., lack of integrated information structures, specific nociceptor absence) that would force a downward revision of the moral weight. This ensures the theory tracks reality rather than justifying pre-existing intuitions.
  *   **Status:** Non-negotiable.

  **6. Ten-Year Stability**
  *   **Case:** We are allocating on a ten-year horizon. The theory cannot be so sensitive to marginal empirical updates that the budget flips annually. It must possess sufficient robustness that only significant findings (see Desideratum 5) trigger reallocation, ensuring programme continuity.
  *   **Status:** Taste of the institutional camp.

  ***

  ### Conflicts and Knockouts

  I flag **Structural Uncertainty Discounting** (Desideratum 4) and **Invariance Under Partition** (Desideratum 3) as jointly unsatisfiable. If you apply a non-linear discount function to the total value of a clade to avoid Pascal's Mugging, splitting that clade into two sub-clades changes the input to the discount function. Unless the discount function is perfectly linear (which defeats the purpose of discounting), the sum of the discounted parts will not equal the discounted whole. You must sacrifice either the anti-mugging protection or the invariance requirement.

  The single requirement that knocks out the most candidates is **Intertheoretic Cardinality**. Most existing frameworks offer ordinal rankings within a single theory of welfare or refuse to quantify across theories due to the 'unit problem'. Demanding a common cardinal currency across hedonic and desire-based views eliminates nearly all current academic and movement proposals.

  ***

  ### Scoring the Default Moves

  Pure multiply-and-compare (expected value maximisation) fails here because it violates the Structural Uncertainty Discounting requirement; it allows the 'Clade Gamble' to become a Pascal's Mugging where tiny credences dictate the entire budget, ignoring the fragility of the sentience hypothesis. A precautionary threshold rule is superior for this specific spec, as it respects the correlated risk of the Clade Gamble and prevents budget capture by speculative high-scale interventions, though it struggles with the Invariance requirement noted above.
