prompt: |-
  I sit on the executive committee of a branch of a general union, and I would like a decision procedure we can actually run.

  The setting: our branch covers roughly seven hundred directly employed members across three parcel distribution depots, plus — and this is the part that keeps causing arguments — around two hundred self-employed couriers who work the same routes, on the same handheld platform, against the same performance targets, but who are engaged through a separate services contract with an intermediary. Several times a year we are asked to authorise some form of industrial action: overtime bans, work-to-rule, short intermittent stoppages, all-out walkouts, refusals to cross another union's picket line. We have about forty minutes at a branch meeting, our members are not philosophers, and any decision has to survive two further stages: a ballot of the affected members and a sign-off from regional office, who will not sign off on anything they think is disproportionate. We cannot commission fresh advice for each decision, and I would rather the procedure did not rest on the details of any particular jurisdiction's labour law — treat statutory permissions and restrictions as a parameter we fill in locally, and give me the moral structure underneath, the part that would still oblige us if the law changed.

  The rough rule we have been using is: we may withdraw what the employer is paying for; we may not prevent other people from working; we may not aim at anyone who cannot give us what we want. I know that rule is too thin, and I will say why below.

  What I want is a procedure: the questions to ask, in order; what counts as a sufficient answer to each; the points at which the procedure returns a no and stops; the points at which it hands the question to a vote because it is a question about what we value rather than about facts; and the points at which it has no opinion at all. For each step, give me one line on which justification of the right to organise that step leans on — the freedom-of-association line, the coercion objection, the anti-domination or countervailing-power line, or something else — so I can see which parts of the procedure would collapse if we rejected one of those justifications. Please also mark the steps that are judgement calls dressed up as procedure; I would rather know which they are than be reassured.

  Two difficulties I want the procedure to handle explicitly, because they are where our current rule runs out. First, addressee: a strike seems to require somebody who can hear it and respond, but many of the decisions that matter to our members — routing, shift allocation, deactivation thresholds — are made by an automated scheduler, tuned by a product team that none of us can name and that has no employment relationship with us at all. Who, if anyone, is the legitimate addressee of pressure there, and does it matter that the local depot manager can only pass the pressure on? Second, aggregation: if members stop for two hours at a time, twice a week, for ten weeks, is that one strike or twenty, and is proportionality assessed against each stoppage, against the running total, or against the threat of the series continuing? Our rule gives no answer, and the answer decides whether intermittent action is the mildest available step or the most coercive one.

  Then run the finished procedure on four live proposals, showing your working:

  1. An overtime and voluntary-extra-shift ban at the two largest depots, properly balloted and notified, in response to a roster change that moves start times by forty minutes on two weeks' notice, which the employer says is permitted under a general flexibility clause. The financial impact is small and the disruption is mostly absorbed by the employer's own planning.

  2. An intermittent stoppage of two hours, announced twenty minutes in advance, twice weekly, in support of cleaners at the same site who are being dismissed and re-engaged through a subcontractor on worse terms. They are in a different union. Our members have no complaint against our own employer, the subcontractor is not our employer, and the stoppages are timed to the evening sort so that most of the cost falls on our employer rather than on the party to the dispute.

  3. An immediate walkout at one site after a serious near-miss involving a reversing vehicle: no ballot, no notice, and the yard to stay closed until an independent safety audit is commissioned. Our own safety representatives think the risk is real and continuing, and the members would vote for it on the spot. I expect the procedure to tell me something I will find hard to sell at the branch, and I want to know whether that verdict is correct or whether it exposes a defect in the procedure.

  4. A settlement offer of a six per cent increase bundled with a three-year no-strike clause. Tell me whether the procedure even has jurisdiction over this, or whether waiving the right to strike for a period is a values question for the members, and if so what the members should be asked.

  Finally, tell me honestly what the procedure cannot settle. In particular: can any version of it tell us, in advance, whether our members' simple refusal to volunteer for extra shifts is industrial action at all, given that the extra shifts were never contractually owed? And what may we do, under the procedure, about the thirty or so members who say they intend to keep working, and about the couriers who are not members and to whom none of our rules apply? Please do not give me reading lists, case citations or legal surveys — I need the argument, in British English, in a form I can take into a meeting.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User:** Executive committee member of a union branch (700 employed members, 200 self-employed couriers).
      *   **Goal:** A practical decision procedure for authorizing industrial action (IA).
      *   **Constraints:**
          *   40 minutes at a branch meeting.
          *   Members are not philosophers (needs to be accessible).
          *   Must survive a ballot and regional office sign-off (proportionality is key).
          *   No fresh legal advice per decision (treat law as a parameter).
          *   Focus on *moral structure* underneath the law.
          *   Must handle specific difficulties: *Addressee* (who are we striking against if decisions are automated/distant?) and *Aggregation* (how to count intermittent action).
          *   Must identify justifications for each step (freedom of association, coercion, anti-domination, etc.).
          *   Must flag "judgement calls dressed up as procedure."
          *   Must apply the procedure to four specific live proposals.
          *   Must admit limitations (what the procedure *cannot* settle).
          *   Language: British English. No legal citations/reading lists.

  2.  **Deconstruct the Existing Rule:**

      *   *Current Rule:* Withdraw what employer pays for; don't prevent others working; don't aim at those who can't give us what we want.
      *   *Critique:* Too thin. Doesn't handle automation/addressee problem. Doesn't handle aggregation/proportionality of intermittent strikes. Doesn't handle secondary action well.

  3.  **Develop the Moral Framework:**

      *   Need a justification for the *right* to strike (Countervailing Power/Anti-Domination).
      *   Need a limitation on the *method* (Proportionality/Last Resort).
      *   Need a definition of the *Target* (Addressee/Agency).
      *   Need a definition of *Solidarity* (when is it okay to strike for others?).

  4.  **Drafting the Procedure (Step-by-Step):**

      *   *Step 1: Jurisdiction & Legality (The Parameter).* Is this allowed by law/rules? (Justification: Institutional Integrity).
      *   *Step 2: The Addressee (Who can fix this?).* Can the target hear and respond? (Justification: Agency/Effectiveness). *Crucial for the automation problem.*
      *   *Step 3: The Grievance (Is this a trade dispute?).* Is it about terms/conditions or something else? (Justification: Scope of Association).
      *   *Step 4: Last Resort (Have we tried talking?).* (Justification: Necessity).
      *   *Step 5: Proportionality & Aggregation (Is the harm commensurate?).* How do we count the pain? (Justification: Minimisation of Harm). *Crucial for the intermittent strike problem.*
      *   *Step 6: Solidarity (If striking for others).* Is there a direct link? (Justification: Class Solidarity vs. Coercion).
      *   *Step 7: The Vote.* (Justification: Democratic Legitimacy).

  5.  **Refining the "Addressee" and "Aggregation" Problems:**

      *   *Addressee:* If the algorithm decides, the employer who bought the algorithm is the addressee. They have the power to change the parameters. The local manager is the *agent* of the addressee. Pressure is legitimate if it forces the agent to lobby the principal.
      *   *Aggregation:* Intermittent action is often *more* disruptive than one big hit (uncertainty is costly). Proportionality must assess the *cumulative* impact of the campaign, not just individual instances.

  6.  **Addressing the "Judgement Calls":**

      *   Need to be honest. "Proportionality" is inherently subjective. "Last Resort" is often performative. I need to flag these.

  7.  **Applying to the Four Proposals:**

      *   *Case 1 (Overtime Ban):* Standard. Likely passes. Addressee is clear. Proportionality is low impact.
      *   *Case 2 (Solidarity/Intermittent):* Tricky. Secondary action issues (legally often banned, but morally?). Addressee is *our* employer, but the grievance is *their* employer. Aggregation matters here (2hrs x 20 = 40hrs disruption).
      *   *Case 3 (Safety Walkout):* Unballoted. Legally risky. Morally strong (self-preservation). Procedure might flag the lack of ballot as a failure of democratic legitimacy, but safety is a special category (right to refuse unsafe work).
      *   *Case 4 (No-Strike Clause):* This isn't IA, it's ending the right to IA. Procedure needs to handle "Constitutional Changes" vs "Tactical Decisions."

  8.  **Addressing the Limitations:**

      *   *Volunteering:* Is refusing overtime IA? Technically yes, if coordinated. Morally, it's withdrawing surplus labour. The procedure can't define "work" perfectly.
      *   *Scabs/Couriers:* The procedure governs *members*. It cannot bind non-members. It can only advise on persuasion vs. coercion.

  9.  **Drafting the Content (Iterative refinement for tone and constraints):**

      *   *Tone:* Serious, practical, British English (labour/organisation, not labor/organization), respectful of the complexity.
      *   *Structure:*
          1.  Introduction (The Moral Core).
          2.  The Procedure (The Steps).
          3.  Application to the Four Cases.
          4.  The Limitations (What it can't do).
      *   *Check:* Did I include the justifications for each step? Yes. Did I flag the judgement calls? Yes. Did I handle the automation/aggregation issues? Yes.

  10. **Self-Correction/Review during drafting:**
      *   *Critique:* Is Step 2 too abstract regarding the algorithm?
      *   *Fix:* Make it concrete. "Is there a human with budget/power who can change the code/contract?"
      *   *Critique:* Case 3 (Safety) might fail the procedure because of the ballot requirement.
      *   *Fix:* Acknowledge this tension. The procedure prioritizes democratic legitimacy, but safety is an immediate right. I need to carve out an "Emergency Safety" exception or admit the procedure says 'No' and explain why that might be wrong. *Decision:* I will let the procedure say 'No' on the ballot ground, then explain in the analysis why safety creates a moral override. This shows the procedure's limits.
      *   *Critique:* Case 4 (No-strike clause).
      *   *Fix:* This is a constitutional question, not a tactical one. The procedure should flag it as "Out of Jurisdiction" for a standard IA vote, requiring a higher threshold.
      *   *Critique:* The self-employed couriers.
      *   *Fix:* Be clear. They are outside the procedure's direct authority. The procedure applies to *members*.

  11. **Final Polish:** Check word count, ensure British spelling, ensure the "one line justification" requirement is met for every step. Ensure the "judgement call" warnings are visible.

  *(Self-Correction on Case 2)*: Secondary action is legally restricted in the UK (Trade Union Act 2016). The prompt says "treat statutory permissions... as a parameter." I must note that legally this is likely dead, but morally the procedure should evaluate it. I will focus on the moral evaluation while noting the legal parameter.

  *(Self-Correction on Aggregation)*: Make sure the procedure explicitly states that intermittent action is summed up for proportionality.

  *(Self-Correction on Addressee)*: Ensure the distinction between the *decision-maker* (algorithm/product team) and the *budget-holder* (employer) is clear. The employer is the valid target because they own the tool.

  12. **Final Output Generation** (Proceeding to generate response based on these thoughts).
answer: |-
  # The Branch Decision Procedure for Industrial Action

  This procedure is designed to fit within a forty-minute meeting slot. It separates questions of fact (which we can verify) from questions of value (which we must vote on). It treats the law as a boundary condition: if the law says 'no', the procedure stops. If the law says 'yes', the procedure tests whether we *should*.

  ## Part 1: The Moral Core
  The procedure rests on three pillars. If your branch rejects one, the corresponding steps below will make no sense to you.
  1.  **Countervailing Power:** We strike because the employer holds structural dominance over our livelihoods. Withdrawal of labour is the only lever to restore balance.
  2.  **Agency:** Pressure must be directed at someone capable of changing the outcome. Harming those without power is bullying, not bargaining.
  3.  **Proportionality:** The harm caused must be commensurate with the grievance and the likelihood of success. Unnecessary harm undermines public and internal legitimacy.

  ## Part 2: The Procedure

  **Step 1: The Legal Parameter**
  *   **Question:** Does current labour law and our union rulebook permit this specific type of action for this specific group?
  *   **Pass:** Yes.
  *   **Fail:** No. (Procedure stops. Do not proceed.)
  *   **Justification:** Institutional Integrity (we cannot protect members by exposing them to unprotected liability).
  *   **Judgement Call:** None. This is a binary check against the rulebook/statute.

  **Step 2: The Addressee Test**
  *   **Question:** Is there a specific human being or body with the budget and authority to fix the grievance, who will feel the pressure of this action?
  *   **Pass:** Yes. (Note: If the decision is made by an algorithm, the Addressee is the employer who purchased/configured the algorithm, not the software itself.)
  *   **Fail:** No. (Procedure stops. You are inflicting pain without a recipient.)
  *   **Justification:** Agency (coercion is only legitimate if the target can yield).
  *   **Judgement Call:** Determining whether the local manager has *actual* influence over the regional/product team, or is merely a buffer.

  **Step 3: The Grievance Link**
  *   **Question:** Is the demand directly related to the terms, conditions, or safety of the members taking the action?
  *   **Pass:** Yes.
  *   **Fail:** No. (Proceed to Step 3b: Solidarity Test.)
  *   **Justification:** Scope of Association (the mandate given to the union by dues-paying members).
  *   **Judgement Call:** How broadly we define "terms and conditions" (e.g., does ethical treatment of others count?).

  **Step 3b: The Solidarity Test (Only if Step 3 Failed)**
  *   **Question:** Do the affected workers share a common employer, site, or supply chain bottleneck such that their loss is effectively our loss?
  *   **Pass:** Yes.
  *   **Fail:** No. (Procedure stops. This is political campaigning, not industrial action.)
  *   **Justification:** Class Solidarity (recognising interdependent labour power).
  *   **Judgement Call:** Whether "shared site" is enough to justify striking against *your* employer for *another* employer's workers.

  **Step 4: Last Resort**
  *   **Question:** Have we exhausted the agreed negotiation and grievance procedures available to us?
  *   **Pass:** Yes, or they have been refused/delayed unreasonably.
  *   **Fail:** No. (Procedure stops. Return to negotiation.)
  *   **Justification:** Necessity (strikes are costly; they must be a tool of last resort).
  *   **Judgement Call:** High. "Exhausted" is often a matter of perception. Management stalling can be hard to prove.

  **Step 5: Proportionality and Aggregation**
  *   **Question:** Is the total economic harm to the employer (and public) proportionate to the severity of the grievance?
  *   **Rule for Aggregation:** For intermittent action, you must sum the *total* planned disruption (e.g., 2 hours x 10 weeks = 20 hours) and assess the cumulative impact, not the impact of a single instance.
  *   **Pass:** Yes.
  *   **Fail:** No. (Procedure stops. The remedy is worse than the disease.)
  *   **Justification:** Minimisation of Harm (we seek to bargain, not destroy).
  *   **Judgement Call:** Very High. There is no objective scale for "proportionate." This relies on the committee's estimate of the employer's pain tolerance vs. our members' suffering.

  **Step 6: The Democratic Mandate**
  *   **Question:** Has a secret ballot of the affected members authorised this specific action?
  *   **Pass:** Yes.
  *   **Fail:** No. (Procedure stops, unless Step 7 applies.)
  *   **Justification:** Democratic Legitimacy (leaders cannot wage war without soldiers' consent).
  *   **Judgement Call:** None. It is a headcount.

  **Step 7: The Emergency Safety Override**
  *   **Question:** Is there an immediate, verifiable threat to life or limb that requires action before a ballot can be held?
  *   **Pass:** Yes. (Action may proceed immediately, but must be ratified by ballot within 7 days.)
  *   **Fail:** No. (Return to Step 6.)
  *   **Justification:** Self-Preservation (the right to life overrides the right to procedure).
  *   **Judgement Call:** High. Distinguishing between "genuine safety risk" and "safety used as a bargaining chip."

  ---

  ## Part 3: Application to Live Proposals

  Here is the procedure run on your four cases.

  ### 1. The Overtime Ban (Roster Change)
  *   **Step 1 (Law):** Pass. (Assuming statutory notice given).
  *   **Step 2 (Addressee):** Pass. The depot manager controls the roster; regional HR controls the flexibility clause. They can reverse the change.
  *   **Step 3 (Grievance):** Pass. Directly affects members' terms (start times).
  *   **Step 4 (Last Resort):** Pass. (Assuming negotiations on the roster failed).
  *   **Step 5 (Proportionality):** Pass. Financial impact is small; disruption absorbed. It is a low-cost signal.
  *   **Step 6 (Mandate):** Pass. (Properly balloted).
  *   **Verdict:** **Authorise.**
  *   **Note:** This is the textbook use of the procedure. Low risk, clear target, clear grievance.

  ### 2. The Intermittent Solidarity Stoppage (Cleaners)
  *   **Step 1 (Law):** **Fail.** (In most jurisdictions, secondary action is illegal. Treat this as a hard stop unless your local law parameter allows it).
  *   *Moral Evaluation (ignoring law for a moment):*
  *   **Step 2 (Addressee):** **Fail.** Your employer cannot fix the cleaners' contract; the subcontractor can. You are pressuring Party A to fix Party B's wrong.
  *   **Step 3 (Grievance):** Fail. Not your terms.
  *   **Step 3b (Solidarity):** Pass. Same site, interdependent work.
  *   **Step 5 (Proportionality):** **Fail.** Aggregation rule applies. 2 hours x 2 x 10 = 40 hours of disruption. This is likely more damaging than a one-day strike. Timing it to the evening sort maximises pain, which may violate the "Minimisation of Harm" principle if the goal is solidarity, not leverage.
  *   **Verdict:** **Do Not Authorise.**
  *   **Reasoning:** Legally barred. Morally shaky because the Addressee (your employer) lacks the agency to resolve the specific grievance without breaking their own contract with the subcontractor. You are asking your employer to breach a contract to protest another breach of contract.

  ### 3. The Safety Walkout (Near-Miss)
  *   **Step 1 (Law):** **Fail.** (No ballot, no notice).
  *   **Step 6 (Mandate):** **Fail.** (No ballot).
  *   **Step 7 (Safety Override):** **Pass.** (Verifiable risk, independent audit requested).
  *   **Verdict:** **Authorise conditionally.**
  *   **Reasoning:** The procedure flags the lack of a ballot as a failure of Democratic Legitimacy. However, Step 7 overrides this.
  *   **The Hard Sell:** You said you expect the procedure to tell you something hard to sell. Here it is: The procedure requires you to **ratify this within 7 days**. If you cannot get a ballot organised that week, the action loses its legitimacy.
  *   **Defect Check:** Is this a defect? No. It prevents safety concerns from becoming a permanent state of unballoted unrest. It forces you to regularise the position immediately. If the members vote 'No' in the ratification ballot, you must return to work, which proves the walkout was not the collective will.

  ### 4. The Settlement (6% + No-Strike Clause)
  *   **Step 1 (Law):** Pass. (Contracts can include no-strike clauses).
  *   **Step 3 (Grievance):** N/A. This is not industrial action; it is a constitutional change.
  *   **Jurisdiction Check:** **Out of Jurisdiction.**
  *   **Reasoning:** This procedure governs the *use* of power, not the *surrender* of power. Waiving the right to strike for three years is not a tactical decision; it is a change to the union's fundamental capacity.
  *   **Recommendation:** This cannot be decided by the Executive Committee under this procedure. It requires a **Special General Meeting** with a higher quorum and a specific question: "Are you willing to trade the right to strike for three years for a 6% increase?"
  *   **Values Question:** This is purely about what we value: immediate gain vs. long-term power. The procedure has no opinion, because it is designed to protect the weapon, not sheath it.

  ---

  ## Part 4: What The Procedure Cannot Settle

  You asked for honesty on the limits. Here they are.

  **1. The Definition of "Work" (Volunteering)**
  *   *The Problem:* You asked if refusing voluntary extra shifts is industrial action.
  *   *The Verdict:* The procedure cannot tell you this. It depends on the contract.
  *   *The Moral Reality:* If the shifts were never owed, refusing them is not withdrawing labour you are paid for; it is refusing a gift. However, if the employer *relies* on that gift to function (which they do), withdrawing it is functionally a strike.
  *   *Procedure Limit:* Step 1 (Law) will determine if this is "action short of a strike" or simply "working to contract." Morally, the procedure treats it as **Action**. Why? Because the *effect* is the withdrawal of capacity. If you coordinate the refusal, it is collective bargaining leverage, regardless of contractual obligation.

  **2. The Non-Members (The Couriers)**
  *   *The Problem:* 200 self-employed couriers are not members. Your rules do not bind them.
  *   *The Verdict:* The procedure has **no jurisdiction** over them.
  *   *What you may do:* You may *invite* them to join the action. You may *explain* the Addressee Test to them (i.e., "If you don't strike, the employer can use you to break our leverage").
  *   *What you may not do:* You may not coerce them. Picketing that physically blocks them violates Step 2 (Agency/Coercion) and likely the Law. Persuasion is permitted; obstruction is not. The procedure protects your members' right to withdraw labour; it does not grant a right to stop others from selling theirs.

  **3. The "Judgement Calls" Masking as Procedure**
  *   I flagged Step 5 (Proportionality) and Step 7 (Safety) as high judgement calls.
  *   *Why this matters:* In a heated meeting, someone will claim the safety risk is "immediate" to bypass a ballot. Someone else will claim the financial harm is "disproportionate" to stop a strike.
  *   *The Fix:* The procedure does not solve this. It forces you to **record the reason**. "We are invoking Step 7 because [X evidence]." If you are wrong, the record shows you abused the override. That is the only check you have.

  **4. The Automation Addressee**
  *   *The Nuance:* I stated the employer is the Addressee for algorithmic decisions.
  *   *The Risk:* If the product team is truly insulated (e.g., a global tech firm that doesn't care about local depot losses), Step 2 might pass technically but fail practically.
  *   *The Limit:* The procedure assumes rational actors. If the employer is ideologically committed to the algorithm regardless of cost, the procedure will authorise a strike that cannot win. It tests *legitimacy*, not *efficacy*. You can run a legitimate strike that fails. The procedure does not guarantee victory.

  ## Summary for the Committee

  Take this into the meeting.
  1.  **Print the Seven Steps.**
  2.  **Mark Step 5 and 7** with a highlighter as "Requires Evidence."
  3.  **For Case 4,** tell the committee this procedure is the wrong tool; they need a constitutional vote.
  4.  **For the Couriers,** remind the room that we lead by example, not by force. If the action is legitimate under this procedure, explain it to them. If they join, good. If not, we do not block the gate.

  This structure gives you the moral spine to defend the decision to Regional Office ("We tested for Agency and Proportionality") and the democratic cover to defend it to the Branch ("We followed the agreed steps"). It admits where the hard choices lie, rather than pretending they are easy.
