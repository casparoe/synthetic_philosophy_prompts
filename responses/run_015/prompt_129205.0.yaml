answer: |-
  You have spotted something rather sharp there. It is a pervasive rhetorical manoeuvre, yet surprisingly, there isn't a single, universally recognised term in formal logic that captures this specific *socio-economic* cycling.

  The closest established concept is **Kettle Logic**. Coined by Sigmund Freud (and later adopted in argumentation theory), it describes a situation where a defendant offers multiple, mutually contradictory arguments to defend the same position. The classic example is a man accused of returning a borrowed kettle damaged:
  1.  "I never borrowed the kettle."
  2.  "It was already broken when I borrowed it."
  3.  "I returned it in perfect condition."

  Individually, each might clear him; together, they contradict. However, Kettle Logic is typically used for *denial* or *excuses* regarding past actions. What you are describing is slightly different: it is a forward-looking *justification* for a systemic norm, where the contradictory premises are drawn from entirely different categories (ethics vs. economics).

  Since there isn't a perfect fit, I propose we coin a term that honours the two-faced nature of the argument whilst distinguishing it from simple hypocrisy. Let's call it **The Janus Defence**.

  Here is the proper breakdown of the term, its boundaries, and how it differs from the other fallacies you mentioned.

  ### The Janus Defence
  **Definition:** A rhetorical strategy where a single conclusion (e.g., "Long working hours must continue") is supported by two mutually incompatible premises (e.g., "Work is moral virtue" vs. "Work is economic survival"). The arguer switches between these premises reactively depending on which one is currently under attack, without acknowledging the contradiction.

  **The Boundaries (When does it apply?):**
  For an argument to qualify as The Janus Defence, it must meet four criteria:

  1.  **Single Conclusion:** Both arguments must defend the exact same outcome (e.g., resisting the 35-hour week).
  2.  **Categorical Incompatibility:** The two premises must belong to different logical frameworks that cannot logically hold true simultaneously in the same context.
      *   *Example:* If work is purely a **moral virtue**, market forces shouldn't matter (you would work hard even if the market slept). If work is purely **economic survival**, virtue is irrelevant (you would work even if you hated it, just to eat). You cannot claim it is *both* the sole source of meaning *and* a ruthless necessity with no alternative.
  3.  **Reactive Switching:** The shift from one premise to the other must occur *in response* to a counter-argument. If they simply listed both reasons at once without conflict, it's just a 'list of reasons'. The fallacy lies in the *retreat* from one shield to the other when the first is breached.
  4.  **Sincerity (Optional but common):** As you noted, the arguer often believes both things sincerely at different times. This distinguishes it from lying; it is a cognitive dissonance weaponised as debate.

  ### Why it isn't Motte-and-Bailey
  You were quite right to rule this out. In a Motte-and-Bailey, one position is the 'Bailey' (controversial, valuable, e.g., "Overwork builds character") and the other is the 'Motte' (trivially true, defensible, e.g., "Hard work is sometimes necessary"). When challenged, the arguer retreats to the Motte.

  In **The Janus Defence**, neither shield is 'safe'.
  *   The "Virtue" claim is contestable (many find meaning outside work).
  *   The "Survival" claim is contestable (productivity data often contradicts it).
  The arguer isn't retreating to a safe haven; they are side-stepping to a different battlefield.

  ### Why it isn't Equivocation
  Equivocation relies on ambiguity in a specific *word*. For example, using "work" to mean "paid employment" in one sentence and "purposeful activity" in the next.

  The Janus Defence is structural, not linguistic. The word "work" remains constant; the *framework of justification* shifts. It is not that they are changing the definition of the noun, but rather the *nature of the obligation* attached to it.

  ### Summary for your debates
  If you wish to use this in the wild, the boundary test is simple: **Ask if both reasons can be true at the same time.**

  If they say, "We must work late because it builds character," and you propose shorter hours, they reply, "We can't, the global market demands it."
  You can then point out: *"If it's about character, the market shouldn't dictate your virtue. If it's about the market, stop pretending it's about character. You are employing the Janus Defence."*

  It is a particularly British sort of frustration, isn't it? The stiff upper lip of virtue suddenly becoming the cold hard cash of necessity whenever the ledger is opened. I hope **The Janus Defence** serves you well in disentangling that knot.

  Ta.
