  Dr Elena Vance, a senior conservator at the National Museum, discovers a unique fifteenth-century manuscript is chemically unstable and will become permanently illegible within five years unless treated with a modern synthetic adhesive that irreversibly alters its material composition. Institutional protocol mandates that any material alteration be fully disclosed in the provenance record, yet internal policy dictates that any item flagged as 'materially compromised' is automatically removed from the collection and destroyed to maintain archival purity. Concealing the treatment preserves both the text and public access, but necessarily withholds material information from future scholars who might rely on the physical integrity of the artefact for historical analysis.

  Under the Formula of Universal Law, the maxim 'I will conceal alterations when disclosure triggers destruction' passes the test; universalising this does not generate a contradiction in conception, as a system of archives could logically function with secret restorations aimed at preservation. Conversely, the Formula of Humanity forbids the act, positing that future researchers are treated merely as means, their capacity to set ends undermined by deception regarding the artefact's material state. This divergence stems from the embedding of individual moral agency within an opaque institutional protocol that pits truth-telling against preservation; if this feature is removed so that disclosure no longer mandates destruction, both formulas converge on disclosure. A defender of the Formula of Universal Law might attack the counterexample by distinguishing direct from indirect duties: since future scholars do not yet exist, we owe them no direct duty, only an indirect duty to promote human culture, thereby validating the Formula of Universal Law's permission to prioritise the preservation of knowledge over procedural transparency.
