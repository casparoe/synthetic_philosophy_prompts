  ### Introductory Note on the Meta-Question

  **Question 1** asks whether "violence" is a natural kind waiting to be measured or a political category constructed to serve specific ends. If a participant answers that it is a political category (No fact of the matter), they exit to **Leaf 1**.

  **Is this exit premature?** Yes, technically. Even those who view the category as constructed inevitably proceed to make confident empirical claims (e.g., "state definitions hide structural harm"). They do this because their goal is not to measure a pre-existing quantity but to demonstrate *how* the construction of the category produces specific political effects (e.g., legitimizing the state). They measure not to find the truth of violence, but to find the truth of the *measurement*.

  ***

  ### The Classification Tree

  **Instructions:** Answer each question with a forced choice. Do not answer "it depends." Follow the path to a Leaf.

  **Q1 (Meta):** Is there a single, mind-independent fact of the matter about whether violence has declined, or is "violence" a category constructed to serve political ends?
  *   **Fact of the matter:** Go to Q2.
  *   **Political category:** **Leaf 1**.

  **Q2 (Domain: Structural):** A state imposes economic sanctions that shorten life expectancy by five years without firing a bullet. Is this violence?
  *   **Yes:** **Leaf 2**.
  *   **No:** Go to Q3.

  **Q3 (Domain: Animals):** Human interpersonal violence halves, but the slaughter of livestock for food triples. Has total violence declined?
  *   **No (Animals count):** **Leaf 3**.
  *   **Yes (Humans only):** Go to Q4.

  **Q4 (Substitution):** Public flogging is abolished and replaced by lifetime debt bondage and eviction. Physical injuries drop to zero; economic ruin rises. Has violence declined?
  *   **No (Harm is substituted):** **Leaf 4**.
  *   **Yes (Physical harm is what counts):** Go to Q5.

  **Q5 (Displacement):** A wealthy nation achieves zero civil conflict by fighting all its wars in peripheral colonies. Has *human* violence declined?
  *   **No (Displaced harm counts):** **Leaf 5**.
  *   **Yes (Only harm within jurisdiction counts):** Go to Q6.

  **Q6 (Deterrence):** A city has zero homicides because a warlord executes anyone who raises a hand, instantly. Is this a low-violence society?
  *   **No (Threat is violence):** **Leaf 6**.
  *   **Yes (Only realised harm counts):** Go to Q7.

  **Q7 (Denominator):** The population doubles over a century. The absolute number of violent deaths stays exactly the same. Has violence declined?
  *   **No (Absolute counts matter):** Go to Q7-Sub.
  *   **Yes (Per-capita rates matter):** Go to Q8.

  **Q7-Sub (Scope):** If absolute counts matter, do we sum globally or nationally?
  *   **Globally:** **Leaf 7a**.
  *   **Nationally:** **Leaf 7b**.

  **Q8 (Statistics):** We observe 70 years of peace followed by one war killing 100 million. Was the 70-year period a "decline"?
  *   **No (It was a quiet patch in a heavy-tailed process):** Go to Q8-Sub.
  *   **Yes (It is a statistical trend):** Go to Q9.

  **Q8-Sub (Noise Type):** If it is a quiet patch, is the process cyclical or random?
  *   **Cyclical (War returns on schedule):** **Leaf 8a**.
  *   **Random (Black swans are unpredictable):** **Leaf 8b**.

  **Q9 (Baseline):** You discover a prehistoric foraging band with a 30% violent death rate. Is this the baseline we have departed from?
  *   **Yes:** **Leaf 9**.
  *   **No (Compare only to recent history):** Go to Q10.

  **Q10 (State Role):** The state monopolizes violence, reducing private killing but increasing state execution. Is this net progress?
  *   **Yes:** **Leaf 10a**.
  *   **No:** **Leaf 10b**.

  ***

  ### The Leaves (Positions)

  **Leaf 1: The Constructivist**
  *   **Label:** Political Ontologist (Constructivist)
  *   **Awkward Commitment:** You cannot measure violence without replicating the power structures that define it.
  *   **Prediction:** The definition of "violence" will shift in the next 50 years to criminalize new forms of dissent while legitimizing state force.

  **Leaf 2: The Structuralist**
  *   **Label:** Structural Violence Absolutist
  *   **Awkward Commitment:** A bureaucratic decision killing slowly is morally identical to a soldier killing quickly.
  *   **Prediction:** Economic inequality metrics will replace homicide rates as the primary indicator of societal safety.

  **Leaf 3: The Sentientist**
  *   **Label:** Species-Inclusive Pacifist
  *   **Industrial Commitment:** Modern civilization is more violent than the Stone Age due to factory farming.
  *   **Prediction:** Violence metrics will expand to include biomass destruction within 50 years.

  **Leaf 4: The Substitution Skeptic**
  *   **Label:** Coercion Continuity Theorist
  *   **Awkward Commitment:** A fine that starves a family is the same quantity as a punch that breaks a jaw.
  *   **Prediction:** Carceral and financial punishment systems will expand as physical punishment becomes socially costly.

  **Leaf 5: The Imperial Skeptic**
  *   **Label:** Displacement Realist
  *   **Awkward Commitment:** Peace in the core is mathematically impossible without violence in the periphery.
  *   **Prediction:** Apparent declines in great-power war will be matched by rises in proxy conflicts on borders.

  **Leaf 6: The Deterrence Skeptic**
  *   **Label:** Threat Equivalence Theorist
  *   **Awkward Commitment:** Living in fear of a gun is the same harm as being shot by the gun.
  *   **Prediction:** Surveillance and preemptive policing will be reclassified as violent acts by future historians.

  **Leaf 7a: The Global Absolutist**
  *   **Label:** Malthusian Pessimist
  *   **Awkward Commitment:** If population grows, safety must improve exponentially just to stay static.
  *   **Prediction:** Total global violent deaths will rise regardless of rates, driving resource wars.

  **Leaf 7b: The National Absolutist**
  *   **Label:** Sovereign Security Realist
  *   **Awkward Commitment:** It does not matter if global violence falls if my country's absolute body count rises.
  *   **Prediction:** Migration restrictions will tighten as nations prioritize local absolute counts over global rates.

  **Leaf 8a: The Cyclical Fatalist**
  *   **Label:** Historical Recurrentist
  *   **Awkward Commitment:** Policy cannot stop the next war; it is already scheduled by history.
  *   **Prediction:** A major interstate war will occur within 20 years, regardless of current institutions.

  **Leaf 8b: The Tail-Risk Skeptic**
  *   **Label:** Heavy-Tail Empiricist
  *   **Awkward Commitment:** We cannot claim safety because the next data point could wipe out all progress.
  *   **Prediction:** Existential risk (nuclear/bio) will dominate policy, rendering traditional conflict prevention obsolete.

  **Leaf 9: The Deep Optimist**
  *   **Label:** Long-Term Decline Theorist
  *   **Awkward Commitment:** The suffering of prehistoric ancestors was worse than modern systemic harms.
  *   **Prediction:** Interpersonal violence rates will continue to fall even if structural harms rise.

  **Leaf 10a: The Liberal Pacifist**
  *   **Label:** Leviathan Optimist
  *   **Awkward Commitment:** State killing is acceptable if it reduces private killing.
  *   **Prediction:** State capacity will correlate negatively with interpersonal violence rates for the next 50 years.

  **Leaf 10b: The Anti-Statist**
  *   **Label:** Monopoly Skeptic
  *   **Awkward Commitment:** A world of private vengeance is preferable to a world of state execution.
  *   **Prediction:** Decentralized conflict resolution mechanisms will emerge as trust in state monopoly collapses.

  ***

  ### Analysis of the Instrument

  **1. Observational Equivalence**
  *   **Leaf 8a (Cyclical) and Leaf 8b (Tail-Risk):** In a dataset covering only the last 70 years, these positions are observationally equivalent. Both predict that the "decline" is not a stable trend. They can only be separated by their theoretical commitment to *why* the peace ended (schedule vs. chance), not by the data itself.
  *   **Leaf 7a (Global Absolute) and Leaf 5 (Displacement):** If the periphery is included in the "Global" count, these two positions often arrive at the same empirical conclusion (violence has not declined) but for different reasons (one counts totals, the other counts jurisdiction).

  **2. Empty Logical Cells**
  *   **Per-Capita + Structural + Optimist:** There is almost no one who counts structural harm (Q2=Yes), uses per-capita rates (Q7=Yes), and still claims things have got better (Leaf 9/10a). *Why:* Structural harm is usually hidden in per-capita physical counts; revealing it usually flips the trend to pessimism. This cell is **unattractive** because it undermines the political urgency of structural critique.
  *   **Absolute + Animal + Pessimist:** Someone who counts absolute human deaths (Q7=No) and animal slaughter (Q3=Yes) and says things are worse. *Why:* This position is **incoherent** in practice because the scales are incomparable (one human death vs. billions of animals); no consistent metric exists to sum them without arbitrary weighting.
  *   **Deterrence Skeptic + Liberal Pacifist:** Someone who thinks threats are violence (Q6=No) but also thinks the state monopoly is progress (Q10=Yes). *Why:* **Unexplored.** This requires arguing that state threats are less violent than private threats, despite both being "threats."

  **3. Node Value for Debate**
  *   **High-Value Nodes (Spend your session here):**
      *   **Q4 (Substitution):** This is the sharpest wedge between Epidemiologists (who track health outcomes/deprivation) and Political Scientists (who track events/killing).
      *   **Q6 (Deterrence):** This separates the NGO workers (who see fear as harm) from the State actors (who see order as good).
      *   **Q7 (Denominator):** This is the most common source of talking past each other. PolSci often prefers rates; NGOs often prefer absolute counts of suffering.
  *   **Low-Value Nodes (Skip these):**
      *   **Q3 (Animals):** In a group focused on conflict prevention and political science, this is usually a settled "No." Debating it rarely resolves the core disagreement about human war.
      *   **Q1 (Meta):** While philosophically important, most participants will answer "Fact of the matter" to get to the data. Forcing this debate often stalls the group without clarifying measurement disputes.
