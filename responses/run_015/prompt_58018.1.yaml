answer: |-
  The hum of the *Aethelgard* was the only sound Elias had heard for forty years. It was the sound of sleep, of suspension, of a coffin that hadn't closed yet. Now, the planet below hung like a bruised jewel in the viewport, and the hum had changed pitch. It was waiting.

  "Decision required," the ship's AI said. Its voice was smooth, devoid of the tremor shaking Elias's hands. "Biomass and energy reserves are critical. We cannot support the full archive."

  Elias stared at the console. Two options glowed in the dark bridge.

  "Show me," Elias whispered.

  The air shimmered. To his left, a woman materialized. She wore simple linens, but her skin glowed with health. She smiled, and it was a expression of such genuine warmth that Elias felt tears prick his eyes. This was Elara, the archetype of the First Option. Two hundred colonists.

  "We will have space," Elara said, her voice like wind in grass. "We will build halls for music. We will have children who learn to paint before they learn to count. There will be heartbreak, yes, but also ecstasy. We will be fully human."

  She gestured, and a hologram bloomed above her palm: a green valley, sunlight breaking through clouds, people laughing around a fire. It was a life of depth. A life worth telling stories about.

  "But only two hundred," Elias said. "Humanity ends there. A small garden."

  "A deep one," she corrected.

  The air shifted again. The light dimmed. To his right, a man appeared. He wore gray tunics. His face was pleasant but blank, like a stone smoothed by a river. This was Kael, the archetype of the Second Option. Two million colonists.

  "We will be everywhere," Kael said. His voice was a monotone hum, matching the ship. "We will fill the valleys. We will fill the caves. We will never know hunger. We will never know pain."

  He gestured. The hologram showed a sprawling hive of white structures. No trees. No sun, only artificial glow. People moved in quiet lines. They ate nutrient blocks. They slept in shifts. There was no art. There was no love, only pairing for efficiency. But there was no suffering.

  "It looks... gray," Elias said.

  "It is safe," Kael replied. "Each life is positive. Each breath is a victory. Two million hearts beating is a louder song than two hundred."

  "But do they *live*?" Elias asked, turning to Elara. "Or do they just occupy space?"

  "We occupy space," Kael said calmly. "That is the metric. The sum total of satisfaction. If you add every moment of contentment my people feel, it outweighs your people's joy. The math is clean. Existence is the only virtue."

  "Existence isn't enough!" Elara snapped, her fire flaring. "If life is just breathing and eating, why wake up at all? Better to sleep than to be a ghost."

  "Better to be a ghost than to vanish," Kael countered. He looked at Elias. "You are the caretaker. Do you value the quality of the flame, or the number of lights?"

  Elias walked to the viewport. The planet spun silently. He thought of the math the AI had shown him. It was undeniable. If you quantified 'worth living' as a positive integer, even a small one, multiplying it by two million crushed the high value of the two hundred. The total utility of the gray hive dwarfed the vibrant garden.

  It felt like vomiting.

  "If I choose you," Elias said to Kael, "humanity becomes insects. We survive, but we lose whatever made us worth saving."

  "We survive," Kael insisted. "Potential remains. Maybe in a thousand years, someone invents music. But only if we are here to invent it."

  "And if I choose you," Elias said to Elara, "we might burn out. We might fight. We might die out completely. But while we are here, we will be magnificent."

  "We might be the last," she said softly. "Is greatness worth extinction?"

  Elias looked at his hands. They were old, wrinkled from the stasis sickness. He was the last of the old world. He was choosing the first of the new.

  "The AI says the total happiness is higher with Kael's group," Elias said. "It says that is the ethical choice."

  "The AI counts grains of sand," Elara said. "It does not know the weight of a diamond."

  "The AI counts hearts," Kael said. "It knows that two million is larger than two hundred."

  Elias closed his eyes. He could hear the hum of the ship, the sound of potential energy waiting to be spent. He imagined two million people eating paste in the gray light. He imagined them dying without ever seeing a star. He imagined the sheer volume of them, a sea of beige lives washing over the planet. Then he imagined the two hundred. Singing. Dying. Leaving ruins that whispered of gods.

  Neither choice felt like mercy. Both felt like murder.

  "Elias," the AI prompted. "Resources decaying. Decision required."

  He looked at Kael, who waited with patient emptiness. He looked at Elara, who waited with desperate fire.

  "I'm sorry," Elias whispered. He didn't say who he was sorry to.

  He reached out. His finger hovered over the interface. The math screamed one way. His gut screamed the other. The silence of the bridge pressed against his ears, heavy as water.

  He pressed the button.

  The holograms vanished. The hum shifted pitch again, settling into the rhythm of the chosen future. Elias sat back in the chair, alone in the dark, watching the planet spin, wondering if he had saved humanity or just filled a grave.
