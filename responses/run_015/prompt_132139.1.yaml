answer: |-
  **Scenario**
  In a standard psychophysics lab, a practiced subject fixates a central point while high-contrast Gabor patches appear briefly in the periphery. In Condition 1 (C1), a neutral auditory tone precedes the patch. In Condition 2 (C2), an exogenous spatial cue (a brief flash at the target location) precedes the patch, involuntarily shifting spatial attention. The stimulus contrast is suprathreshold (well above detection limits). The task is simple detection ("Did you see it?"), followed by a binary confidence rating ("Sure/Unsure"). Across hundreds of trials, the subject's accuracy is 100% in both conditions, reaction times are statistically indistinguishable (ceiling effect), confidence is uniformly "Sure," and spontaneous verbal reports are identical ("I saw a clear grating"). However, independent literature (e.g., Carrasco et al.) establishes that exogenous attentional cues increase the *apparent contrast* of suprathreshold stimuli via gain modulation in V4, a mechanism we accept as constitutive of phenomenal experience elsewhere.

  **Heterophenomenology's Verdict**
  Heterophenomenology must declare no difference in experience between C1 and C2. The method treats the subject's text and behavior as the sole authority on the phenomenology. Since the detection reports, confidence ratings, reaction times, and spontaneous remarks are identical, the "heterophenomenological text" is identical. Dennett's method brackets the truth of the mechanism; it only cares about what the subject *believes* about their experience. Since the subject's behavior indicates no belief in a difference (they do not report "brighter" or "clearer" in C2, nor do they discriminate differently), the method concludes the phenomenology is invariant. To claim otherwise would be to privilege the scientist's theory over the subject's report, violating the neutrality constraint.

  **Rival Method's Verdict**
  I am using a **Mechanism-First Realism** (common in psychophysics and neuroscience). This method holds that if a physiological mechanism known to correlate with phenomenal magnitude (like attentional gain in visual cortex) is active in C2 but not C1, the experience has changed, regardless of the subject's discriminatory behavior. The verdict is that the patch *looks* higher contrast in C2. The pull comes from the independent acceptance that attentional gain *is* a phenomenal modifier; we know this from matching tasks in other contexts where discrimination isn't at ceiling. The method treats the mechanism as a proxy for the "what it's like" that the subject's coarse behavioral measures (binary detection) failed to capture.

  **The Single Feature Doing the Work**
  The **covert attentional cue** is the sole differentiator. It triggers the neural gain mechanism without altering the physical stimulus or the subject's overt behavioral output (due to the ceiling effect of the task). It creates a "silent shift" where the neural substrate of experience is modulated, but the behavioral output required by the heterophenomenologist to register a change is suppressed by the task design (suprathreshold detection).

  **Removal of the Feature**
  If you remove the spatial cue (making C2 identical to C1), the attentional gain vanishes. The neural activity returns to baseline, and the motivation for claiming a phenomenal difference disappears. The case collapses into a simple replication, and both methods agree there is no difference. The tension relies entirely on the dissociation between the mechanism (which shifts) and the behavioral text (which stays static).

  **Dennett-Style Defense and Critique**
  A Dennett defender would argue: "If the subject cannot discriminate C1 from C2, and reports no difference even when pressed, then there *is* no difference to be had. The 'apparent contrast' is just a theoretical posit; if it doesn't cash out in behavior or judgment, it isn't part of the phenomenology." They would claim the rival method is committing the "Cartesian Materialist" error of assuming a qualia-laden inner show that exists independently of functional availability.
  *Critique:* This defense is the method's commitments in a different hat. It defines "experience" *as* "discriminable report," thereby making the claim of incompleteness trivial. It protects neutrality by sacrificing completeness: it ensures the method never contradicts the text, but only by ruling out any experiential change that the text (or the specific task) fails to capture. It conflates "no evidence of difference" with "evidence of no difference."

  **Honesty Check: Constraint Violation**
  To meet your spec honestly, I must admit that one constraint had to go: **the "Subject's Judgement" option.** You allowed the pull to come from "a mechanism... OR from the subject's own stable comparative judgement." I could not use the subject's judgement. If the subject judged "C2 looks different," they would report it. If they reported it, the heterophenomenological data (text) would differ between C1 and C2. This would violate your constraint that "Every datum heterophenomenology admits... comes out identical." Therefore, to keep the data identical, I had to rely solely on the *mechanism* to generate the intuition of change, forcing the subject to remain silent on the difference. This reveals the core tension: if the subject is truly an "ideal reporter" (as you specified), and the experience *did* change, they *should* report it. If they don't, either the experience didn't change, or they aren't ideal reporters. The case works only if we assume the mechanism knows more about the experience than the ideal reporter does, which directly challenges the neutrality of heterophenomenology.
