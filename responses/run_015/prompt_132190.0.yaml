answer: |-
  ### Desiderata for a Theory of Historical Overdetermination

  To handle genuinely overdetermined outcomes without collapsing into causal pluralism (everything matters equally) or reductionism (one factor matters exclusively), a theory of historical explanation must satisfy the following four desiderata.

  #### 1. The Sufficiency-Activity Distinction
  **Requirement:** The theory must distinguish between factors that are *logically sufficient* but causally inert (preemption/redundancy) and factors that are *causally active* and sufficient (overdetermination).
  **Motivating Case:** Consider the firing squad case. Two shooters fire simultaneously; either bullet would kill. This is overdetermination. Contrast this with a backup assassin who stands down because the primary assassin succeeds. The backup is sufficient *in principle* but inert *in fact*. A historical parallel: Economic collapse and foreign invasion might both be sufficient to topple a regime. If the regime falls to invasion *before* economic collapse triggers revolt, the economic cause is preempted. If both strike simultaneously and independently trigger collapse, it is overdetermination.
  **Classification:** **Non-negotiable.** Without this, the theory cannot distinguish between what *did* cause the event and what merely *could have*.

  #### 2. Counterfactual Stability
  **Requirement:** In cases of genuine overdetermination, the explanation must preserve the truth of the counterfactual: "If factor A had been absent, the outcome would still have occurred (due to factor B)." However, in interference (synergy) cases, this counterfactual must be false (if A is absent, B is insufficient, and the outcome fails).
  **Motivating Case:** In the outbreak of WWI, if the assassination of Franz Ferdinand (A) had not occurred, would the alliance systems and militarism (B) have caused war anyway? If yes, A is overdetermining. If no (i.e., war required the specific trigger *plus* the structural tension), it is an interference case. A theory that treats synergy as overdetermination falsely implies the structural conditions alone were sufficient.
  **Classification:** **Non-negotiable.** This preserves the logical integrity of causal claims against modal testing.

  #### 3. Explanatory Proportionality
  **Requirement:** The granularity and complexity of the causal explanation must match the granularity and complexity of the outcome. The explanation should not include causal details that make no difference to the specific outcome described, nor exclude details required to differentiate the outcome from similar alternatives.
  **Motivating Case:** Explaining the *fall of the Roman Empire* (a centuries-long process) requires different causal granularity than explaining the *Battle of Adrianople* (a specific event). A reductionist account (e.g., "lead pipes caused the fall") violates proportionality by offering a micro-cause for a macro-outcome. A pluralist account ("everything caused the fall") violates it by offering a maximal cause for a specific outcome.
  **Classification:** **Non-negotiable.** This prevents the explanation from becoming either trivially narrow or vacuously broad.

  #### 4. Non-Arbitrary Weighting (The Relevance Constraint)
  **Requirement:** The theory must provide a principled method for assigning explanatory weight to overdetermining factors without resorting to arbitrary selection or declaring all factors equal.
  **Motivating Case:** In the Russian Revolution, both WWI stresses (structural) and Lenin's return (agential) were sufficient conditions for the Bolshevik seizure of power in October 1917. A structuralist privileges the war; an intentionalist privileges Lenin. The theory must explain *why* we might privilege one for a specific explanatory interest (e.g., "causes of regime type" vs. "causes of timing") without claiming the other was not a cause.
  **Classification:** **Camp-Specific Preference.** Structuralists will demand weighting favor deep, necessary background conditions; Intentionalists will demand weighting favor proximate, agential triggers. An adequate theory must accommodate the *mechanism* for weighting, even if camps disagree on the *result*.

  ***

  ### Technical Evaluation

  **Joint Unsatisfiability under Standard Counterfactual Theories**
  Desideratum 2 (**Counterfactual Stability**) is jointly unsatisfiable with **Standard Lewisian Counterfactual Dependence**. In David Lewis's (1973) framework, causation requires counterfactual dependence: $E$ depends on $C$ if, had $C$ not occurred, $E$ would not have occurred. In genuine overdetermination (two sufficient causes), if $C_1$ is removed, $E$ still occurs (due to $C_2$). Therefore, $E$ does not counterfactually depend on $C_1$. Under strict Lewisian rules, $C_1$ is not a cause. To satisfy Desideratum 2 (identifying $C_1$ as a cause while admitting $E$ would still happen), one must abandon simple counterfactual dependence in favor of causal process theories, ranking theory, or structural equation models that allow for "de facto" dependence.

  **The "Killer" Desideratum**
  **Explanatory Proportionality (Desideratum 3)** does the most work in excluding popular historiographical accounts.
  *   **Why:** Most popular history is inherently reductionist (Great Man theory, economic determinism, technological imperatives). These accounts select a single causal strand and treat it as necessary and sufficient. Proportionality demands that if the outcome is complex (e.g., a revolution), the cause must be equally complex (a conjunction of conditions). It rules out the "silver bullet" explanation. Conversely, it rules out "total history" approaches that list every condition present at the time, as most are disproportionate to the specific outcome. It forces the historian to define the *contrast class* (Why this revolution rather than reform?) before selecting causes, which most narrative histories fail to do.

  ***

  ### Change My Mind

  **What would revise these requirements:**
  I would drop or revise **Desideratum 2 (Counterfactual Stability)** if compelling evidence emerged that historical causation is fundamentally **non-separable**. If complex systems theory demonstrates that historical factors are so entangled that removing Factor A *necessarily* alters the state of Factor B (making the "hold B fixed, remove A" counterfactual impossible to construct even in principle), then Counterfactual Stability is a category error. In a chaotic system, you cannot surgically remove the assassination of Archduke Ferdinand without altering the alliance structures. If causal interaction is always "interference" (synergy) at a deep level, then "genuine overdetermination" is an illusion, and the requirement to test for it via stability is invalid.

  **Where my reasoning is most likely to fail:**
  My reasoning relies on the assumption that historical outcomes are **discrete events** amenable to individuation (e.g., "The Fall of Rome," "The Start of WWI"). If historical outcomes are actually continuous processes without clear boundaries, **Desideratum 3 (Proportionality)** fails because there is no fixed "complexity of the outcome" to match. If the "outcome" is a fluid trajectory rather than a state change, proportionality cannot be measured, and the distinction between overdetermination and redundancy collapses into a matter of narrative framing rather than ontological reality.
