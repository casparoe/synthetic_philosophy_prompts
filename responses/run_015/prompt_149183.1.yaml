  Weakening (3) does not force a direct-reference theory. Rather, it aligns with inferentialism or Wittgensteinian rule-following, where meaning arises from use within a community. You need not claim agents fully articulate the criterion to possess the concept; implicit practical mastery suffices. This avoids the requirement for innate intuition while preserving the link between reasons and action.

  Regarding partial understanding: Yes, one can be genuinely moved by a reason one only partially understands, provided the motivation reliably tracks the normative fact via social scaffolding. Moral worth depends on the appropriate causal connection to the right-making feature, not on metaphysical expertise. Ordinary agents learn to respond to suffering as bad through training before they can philosophically justify why. Their responsiveness constitutes concept possession enough for moral worth.

  Denying the regress (6)-(7) is also viable if you treat normative responsiveness as holistic rather than linear. However, weakening (3) is less costly metaphysically. It allows you to maintain that moral worth requires acting for the right reason (1) without demanding impossible intellectual conditions. Socialization becomes the medium of normative grasp, not an obstacle to it. This preserves moral worth for reflective, socialized agents without collapsing into intuitionism.
