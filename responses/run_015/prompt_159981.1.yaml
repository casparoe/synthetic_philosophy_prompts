prompt: |-
  Okay, I'm in this undergraduate philosophy of mind reading group and we're doing a unit on self-knowledge, and I am completely stuck on a bit from William James's big late-19th-century Principles of Psychology, the chapter on the stream of thought. The exact sentences I have in front of me say: "No one ever had a simple sensation by itself. Consciousness, from our natal day, is of a teeming multiplicity of objects and relations, and what we call simple sensations are results of discriminative attention, pushed often to a very high degree." Then a little later he seems to be making fun of the idea that you can just introspect a feeling while it sits still, and as I understand it he compares the attempt to something like trying to grab a spinning top in order to feel its motion, or rushing to turn up a gas lamp quickly enough to see what darkness looks like. My first reaction was that he's just saying introspection is basically fake, or at least that we can never trust it, because the moment you try to look at a mental state it changes or evaporates. But when I said that in group everyone pushed back and now I'm not sure I'm reading him right.

  Here's the weird part that got me more confused. I tried a dumb little experiment on myself last week: I set a silent timer to beep at random moments while I was jsut sitting around, and the second it beeped I had wrote down one word for whatever mental state I thought I'd been having right before the beep. Half the time I came up with stuff like "itch," "bored," or "wanting coffee," but the weird thing is that it always felt like the feeling had a half-second latter already evaporated and I was just slapping a label on a blank. My friend said this is basically James's point, but then she added this distinction between catching a state in the act and retrospectively tagging it a moment later — she called the second one something like delayed mental photocopying — and argued that James is only attacking the naive catching picture, not the retrospective tagging we actually rely on. That sounded plausible until I remembered the spinning-top and gas-lamp images, which really sound like he's saying even the retrospective report is corrupted, not just the naive on-the-spot inspection.

  So can someone help me unpack what he's actually claiming in that passage? I guess my specific questions are: (1) Is James making the strong claim that introspection gives us almost no trustworthy access to our own current mental states, or the weaker claim that only a certain naive picture—where a feeling sits still and fully formed while you inspect it—is wrong? (2) Does the spinning-top / gas-lamp stuff support my friend's delayed mental photocopying distinction, or does it secretly undercut it because the retrospective tag is also a reconstruction? And (3) does my timer game actually illustrate his point, or does it accidentally miss it because it's really about attention shifts and memory gaps rather than the stream itself? Please don't give me a bibliography or a reading list; I just want help understanding the argument, and feel free to tell me if my paraphrase of the passage is off or if I'm importing a modern idea that James wouldn't accept.
