prompt: |-
  So I've been trying to understand this thing in AI safety where engineers try to make robots "low impact" by comparing the world after the robot acts to a world where it just sat still and did nothing. They measure all the differences - objects moved, energy used, temperatures changed - and if the total is too big they treat it as a side effect and penalize the robot. The whole point is you don't need to list every good thing or every bad thing in advance; you just stay close to the basline. I was talking with my roommate about this and I got stuck on what kind of view about harm and value this actually sneaks in. Like, does it treat whatever exists right now as automatically worth preserving? Or does it assume that harm is just any big change, even if it's saving lives? And here's what confuses me: if the robot moves a bucket to stop a fire, that's a huge deviation but clearly good, so can this practice really avoid specifying values, or is it secretly smuggling in a hidden list of what's valuable?

  Also, I keep noticing that in criminal law we do something kind of similar - we punish people way harder when they actually cause harm compared to when they take the exact same risk and get lucky. So maybe both practices share some hidden commitment that outcomes matter beyond just control or risk, or maybe I'm forcing a connection that isn't there. Anyway, can you reconstruct what philosophical commitments this AI measurement practice strictly needs versus what just happens to line up with it? Tell me whether it's coherent to think you can define "side effects" without a full account of what's good, and point out where the practice is underdetermined - like, could several different theories about value all license the same scoring rule? Please write it all in one long continuous block with no headings, bullet points, bold text, or tables, just like an email. And please don't cite specific papers or ask me to read anything - I don't have access right now and I just want the reasoning laid out plainly.
