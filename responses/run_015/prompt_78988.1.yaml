  # JOINT STATEMENT ON ONTOLOGY AND QUANTIFICATION

  **Signed:** [Deflationist] & [Realist]
  **Date:** [Current Date]

  ### 1. Agreed Claims

  We, the undersigned, submit the following claims as the common ground of our collaboration. We have drafted these to be substantive; each claim excludes a live philosophical alternative, and each is signed in good faith.

  1.  **Fixed Non-Linguistic Base:** We agree that there is a complete set of non-linguistic facts concerning the distribution of properties and relations in the world (including particle positions, genetic connectivity, legal charters, and causal powers) that is fixed independently of our choice of vocabulary. Neither of us posits any additional non-linguistic fact that settles the existence of composite objects over and above these base facts.
  2.  **Semantic Plasticity:** We agree that the truth-conditions of sentences containing existential quantifiers ("there are") vary across possible linguistic frameworks. It is possible to construct a language where "There are tables" is true given the base facts, and another where it is false given the same base facts, solely by varying the semantic rules for the quantifier.
  3.  **Case Specifics:** Regarding case (i) (the tree stand), we agree on all biological and physical facts (single root system, genetically identical trunks, no further boundary facts). Regarding case (ii) (the committee), we agree on all functional and legal facts (charter, attribution of decision, liability rules). Our disagreement is confined strictly to whether these facts suffice for the truth of "There is one organism" or "There is a committee."
  4.  **Methodological Norm:** We agree that ontological posits are justified only insofar as they contribute to the systematicity, predictive power, or explanatory depth of our best theories. An ontological claim that adds no explanatory value over a rival claim is suspect.
  5.  **Defeater for Deflationism:** The Deflationist accepts that her position is undermined if it proves impossible to construct a translation manual that maps existence claims from one conceptual scheme to another without loss of inferential role or factual content. If existence talk cannot be paraphrased away or mapped across schemes while preserving what is being reported, the dispute is not merely verbal.
  6.  **Defeater for Realism:** The Realist accepts that his position is undermined if the notion of "ontological reality" (distinct from conceptual utility) proves explanatorily idle. If positing that one vocabulary "tracks reality better" yields no better laws, predictions, or explanations than positing that it is "more useful for our purposes," the distinction is metaphysically empty.

  ### 2. Disagreements

  The following table catalogues our residual disagreements. The wording in each column has been approved by the respective party as an accurate statement of their view.

  | Sub-question | Deflationist's Answer (D) | Realist's Answer (R) | What Turns on It |
  | :--- | :--- | :--- | :--- |
  | **1. Truth Settlement** | Once non-linguistic facts are fixed, the truth of "There are Xs" is settled only by adding a choice of meaning for the quantifier. | Once non-linguistic facts are fixed, the truth of "There are Xs" is settled by reality; meaning must conform to truth, not vice versa. | Whether ontology is a discovery of facts or a choice of framework. |
  | **2. Vocabulary Superiority** | One vocabulary cannot be better than another except relative to practical purposes (ease of use, social coordination). | One vocabulary can be objectively better than another in virtue of corresponding to the structure of reality (carving nature at joints). | Whether "truth" is a goal distinct from "utility." |
  | **3. Self-Reference** | The claim "There are multiple candidate meanings" is a practical recommendation about language use, not an ontological claim requiring a privileged quantifier. | The claim "There are multiple candidate meanings" is itself an ontological claim using quantifiers; if no quantifier is privileged, the claim cannot be true. | Whether Deflationism is self-undermining. |
  | **4. Status of Dispute** | The dispute over composite objects is verbal; we are talking past each other using different semantic rules for existence. | The dispute over composite objects is genuine; one of us is describing the world correctly, and the other is describing it incorrectly. | Whether there is a fact of the matter to be known. |
  | **5. Is *This* Dispute Verbal?** | Yes. Our disagreement about whether the object-level dispute is verbal is itself a verbal disagreement about how to use the word "verbal." | No. Our disagreement about whether the object-level dispute is verbal is a genuine disagreement about the semantics of quantification. | Whether this joint statement resolves anything or merely catalogs difference. |

  ### 3. Cruxes

  We identify the following specific issues as critical. Settling these would compel at least one of us to revise our position. We record our predictions in advance.

  **Crux 1: The Translation Test**
  *   **Sub-question:** Can a faithful manual be constructed mapping each party's existence talk into the other's without changing which facts are being reported?
  *   **Test/Argument:** We will attempt to construct a manual that translates D's "There are tables" into R's vocabulary (e.g., "There are particles arranged table-wise") and vice versa, preserving all inferential roles in scientific and everyday contexts.
  *   **Prediction (D):** Success. The translation will preserve all factual content, proving the dispute is merely about mode of presentation.
  *   **Prediction (R):** Failure. The translation will inevitably lose truth-conditional content or alter the inferential role regarding identity and persistence, proving the concepts are not equivalent.

  **Crux 2: Explanatory Power vs. Utility**
  *   **Sub-question:** Does R's notion of "tracking reality better" do explanatory work that D's notion of "simple and useful" does not?
  *   **Test/Argument:** We will compare laws stated in D's preferred vocabulary vs. R's preferred vocabulary. We will check whether R's vocabulary allows for laws with fewer *ceteris paribus* clauses or fewer brute constraints across diverse contexts.
  *   **Prediction (D):** No difference. Any explanatory success attributed to "reality-tracking" can be fully explained by "conceptual utility" relative to human cognitive architecture.
  *   **Prediction (R):** Significant difference. "Utility" is local and variable; "reality-tracking" explains why certain vocabularies remain useful across radically different contexts and agents.

  **Crux 3: The Quantifier Privilege**
  *   **Sub-question:** Does D's thesis presuppose a privileged quantifier?
  *   **Test/Argument:** We will analyze the logical form of D's central thesis ("There are many candidate meanings"). We will ask whether this sentence is true under all candidate meanings of "there are," or only under one.
  *   **Prediction (D):** It is true under a practical, deflationary reading of "there are" that does not commit to ontological weight.
  *   **Prediction (R):** It is true only under a privileged, ontologically robust reading; thus, D relies on the very privilege she denies.

  ### 4. Verbal or Genuine?

  We state plainly our assessment of the residual disagreement.

  **The Object-Level Dispute:** Regarding the existence of tables, organisms, and committees, the Deflationist maintains this dispute is **verbal**. The Realist maintains this dispute is **genuine**.

  **The Meta-Level Dispute:** Regarding whether our disagreement is verbal, we disagree. As noted in Row 5 of the Disagreements Table, the Deflationist views our meta-level disagreement as verbal (a clash of definitions for "verbal"), while the Realist views it as genuine (a clash of semantic theories).

  **The Genuine Remainder:** Despite our divergence on the label "verbal," we identify a genuine remainder that is not merely verbal. The genuine remainder concerns the **semantics of the existential quantifier**. Specifically: Does the quantifier have a default, privileged interpretation fixed by the structure of reality (Realist), or is its interpretation inherently indeterminate until fixed by practical convention (Deflationist)? This is a substantive question in the philosophy of language and metaphysics. It is not settled by stipulation, nor is it dissolved by noting that we use words differently. It is a disagreement about whether language hooks onto the world in a unique way or whether the hook is of our own making.

  We sign this statement to acknowledge that while we share the facts, we do not share the world in which those facts reside.

  __________________________
  [Deflationist]

  __________________________
  [Realist]
