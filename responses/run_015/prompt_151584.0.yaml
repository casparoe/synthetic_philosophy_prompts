answer: |-
  You have rediscovered one of the most famous and structurally significant arguments in modern epistemic logic. The specific instance you encountered is **Fitch's Paradox of Knowability** (sometimes called the **Church-Fitch Proof**).

  However, your intuition is correct: this is not just a quirk of "knowledge." It is a general logical shape that arises whenever you combine a **factive operator** with **distributivity** and a **modal claim**.

  Here is the breakdown of the name, the moving parts, the boundaries, and the terminology you are looking for.

  ### 1. The Name
  There is no single-word term (like "syllogism") for this shape, but in the literature, it is standardly referred to as a **Fitch-Style Collapse Argument** or a **Derivation of Omniscience**.

  If you need a descriptive label for the shape itself, independent of epistemology, the most accurate technical description is:
  **The Factivity-Distribution Modal Collapse.**

  *   **Factivity:** The operator guarantees truth ($Op \to p$).
  *   **Distribution:** The operator handles conjunctions ($O(p \land q) \to Op \land Oq$).
  *   **Modal Collapse:** The distinction between "possibly $O$" and "actually $O$" vanishes.

  ### 2. The Moving Parts (Why it works)
  You suspected the "guarantees-truth bit" (factivity) was doing the work. You are exactly right. Here is the mechanical derivation of why that specific part is the engine of the collapse.

  The argument relies on constructing a specific "poisoned" proposition. Let $K$ be your operator (Knows, Proves, Correctly Believes).
  The modest principle is: $\forall p (p \to \Diamond K p)$.

  **The Derivation:**
  1.  Assume there is some unknown truth: $p \land \neg K p$. (This is your empirical premise).
  2.  Apply the modest principle to this whole conjunction. If it's true, it's possibly $K$-able:
      $\Diamond K (p \land \neg K p)$.
  3.  **Distribution:** If you $K$ a conjunction, you $K$ the parts.
      $K (p \land \neg K p) \to Kp \land K(\neg K p)$.
  4.  **Factivity:** If you $K$ something, it is true.
      $K(\neg K p) \to \neg K p$.
  5.  **The Contradiction:** From step 3 and 4, $K(p \land \neg K p)$ implies $Kp \land \neg Kp$. This is a logical contradiction ($A \land \neg A$).
  6.  **Impossibility:** Since the state of affairs $K(p \land \neg K p)$ entails a contradiction, it is logically impossible.
      $\neg \Diamond K (p \land \neg K p)$.
  7.  **The Collapse:** By contraposition of step 2, the premise must be false.
      $\neg (p \land \neg K p)$.
      Which is equivalent to: $p \to K p$.

  **Why "Belief" Fails:**
  You noted that plain belief didn't trigger the collapse. This is because belief is **non-factive**.
  *   Step 4 fails. $B(\neg B p)$ does *not* imply $\neg B p$. I can believe that I don't believe something (and be wrong).
  *   Without factivity, $B(p \land \neg B p)$ is not logically contradictory; it is merely a **Moorean Paradox**. It is absurd to *assert*, but not logically impossible to *hold* or *possibly hold*.

  **Why Weakening "Possible" Doesn't Help:**
  You noted that even reading "possible" as "logically consistent" doesn't save it. This is because the contradiction derived in Step 5 is a *logical* contradiction ($Kp \land \neg Kp$). Therefore, the impossibility in Step 6 is a *logical* impossibility. No matter how weak your modal operator $\Diamond$ is, it cannot make a logical contradiction possible.

  ### 3. How this differs from standard *Reductio*
  You asked how this differs from an ordinary *reductio ad absurdum*.

  *   **Standard Reductio:** You assume a set of premises, derive a contradiction, and conclude "At least one premise is false."
  *   **Fitch-Style Collapse:** You assume a set of premises, but you treat one (the modest principle) as the *target* and the others (factivity, distribution) as *fixed rules of the game*. The result isn't just "This is inconsistent"; it is "The modest principle implies the wild principle."
      *   It transforms a **contingent** claim (some truths are unknown) into a **necessary** falsehood, *if* you hold the modest principle.
      *   It forces a trilemma: You must reject either **Knowability** (anti-realism), **Factivity** (skepticism), or **Distribution** (non-classical logic).

  ### 4. How this differs from Moorean Paradoxes
  The Moorean Paradox is the proposition: "$p$, but I don't believe $p$."
  *   **Moore:** Focuses on the *assertibility* or *rationality* of a single agent holding a specific belief state. It is a paradox of *self-reference*.
  *   **Fitch:** Focuses on the *quantification* over all truths. It uses the Moorean proposition ($p \land \neg K p$) as a lemma to prove a theorem about the structure of truth and knowledge globally.
  *   **Relation:** Fitch's proof essentially shows that if "Knowability" is true, then Moorean propositions cannot even be *possible* objects of knowledge, which forces them to be false.

  ### 5. Boundaries: What falls to it and what doesn't?
  Since you are in software, think of this as a type constraint on operators.

  **Falls to the Collapse (Factive + Distributive):**
  *   **Knowledge:** ($Kp \to p$)
  *   **Correct Belief:** ($CBp \to p$)
  *   **Provability (in sound systems):** If "Provable" means "Derivable in a sound system," then $Proof(p) \to p$. (Note: Gödel complicates this because sound systems cannot prove their own soundness, but structurally, the operator fits).
  *   **Verification:** If verification guarantees truth.

  **Resists the Collapse (Non-Factive or Non-Distributive):**
  *   **Belief:** ($Bp \not\to p$). As you found.
  *   **Acceptance:** One can accept a falsehood.
  *   **Justification:** One can be justified in believing a falsehood (Gettier cases).
  *   **Quantum Measurement (Analogy):** If "measuring" changes the state, distribution might fail ($M(p \land q) \not\to Mp \land Mq$).
  *   **Intuitionistic Logic:** If you reject classical negation (specifically Double Negation Elimination), the step from $\neg(p \land \neg Kp)$ to $p \to Kp$ is blocked. This is the standard "escape route" for semantic anti-realists.

  ### 6. A Proposed Definition
  Since you asked for a term if one doesn't exist, I recommend using **Fitch-Style Modal Collapse**.

  **Definition:**
  A **Fitch-Style Modal Collapse** occurs in a logical system containing an operator $\mathcal{O}$ when the following conditions are met:
  1.  **Factivity:** $\mathcal{O}\phi \to \phi$
  2.  **Conjunctive Distribution:** $\mathcal{O}(\phi \land \psi) \to (\mathcal{O}\phi \land \mathcal{O}\psi)$
  3.  **Modal Axiom:** $\phi \to \Diamond \mathcal{O}\phi$
  4.  **Classical Negation:** Standard rules for $\neg$ and $\land$.

  **Result:** The system derives $\phi \to \mathcal{O}\phi$ (Omniscience/Triviality).

  **In-Case:** Epistemic Logic (Knowledge), Sound Provability.
  **Out-Case:** Doxastic Logic (Belief), Justification Logic, Intuitionistic Logic.

  ### Summary
  You haven't reinvented the wheel, but you have correctly identified the axle. The shape is **Fitch's Paradox**. The mechanism is the interaction of **Factivity** and **Distribution** on a **Moorean Conjunction**. The general class of arguments is **Triviality Results via Factive Modal Collapse**.

  It is a profound result because it suggests that you cannot consistently hold that "truth is independent of verification" (Realism) and "all truth is verifiable" (Anti-Realism) simultaneously, unless you change the underlying logic (e.g., to Intuitionism) or deny that knowledge distributes over conjunction (a very high price to pay).
