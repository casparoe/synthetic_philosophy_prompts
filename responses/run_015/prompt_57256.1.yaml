  Your view is right, because a working vessel is defined by its service and the continuity of care, not merely its atoms. Wood rots and must be replaced even in an unchanged hull; therefore, material alone cannot hold identity. However, to defend this against the "fourteen years in pieces" objection, you should frame it not as "work" in the abstract, but as "custodianship." The trust held the intent of the *Marabel* through those years, just as a ship holds her course through a storm even when hove-to. This allows you to honor the school's preservation of the timber without conceding the lineage of the service. Stand on the ground that a boat is what she does and who keeps her, not just what she is made of.

  ***

  Friends, neighbors, shipwrights, and guests from the school up the coast. Welcome to the water's edge.

  We are here to launch the *Marabel*. I know the county paper has been busy. They've printed pictures of two boats carrying the same name and used the word "rivalry." I want to speak to that directly, because there are people here who care about both vessels, and there is a carved nameboard involved that belongs to the story of both.

  We gave the old timber to the school. Every plank, every frame that was too far gone to stay, went to them. They have built a beautiful boat out of the *Marabel*'s own skin. They have the wood. We have the keel, the stem, and the place where she was meant to work. The paper asks which one is the real *Marabel*. I am not going to tell you that their boat is a copy. It is not. It is made of the original stuff, worked by skilled hands, and it carries the name. I am not going to tell you that our boat is a replica. It is not. It is built to do the job she was born to do, in the water she knew.

  So, how can there be two?

  The answer isn't in the timber. Timber is just wood. It rots. It gets swapped out. Even if she had never left her mooring, she would not be made of the same wood today. The answer is in the keeping.

  For fourteen years, this hull sat in the mud. She was in pieces. But she was not abandoned. There was a line of care that ran through this yard every day, rain or shine. People came here to scrape, to fit, to fair, to argue about the right way to set a beam. That activity kept her alive when she had no bottom to hold water.

  I think of Eddie Marsden. Eddie cut most of the new frames you see inside her. He died in 2019. He never saw her float. He never asked if she would be called the "real" one. He asked if the bevel was right. He asked if the wood was seated true. He knew that a boat isn't a monument; it's a job of work that never finishes.

  To the granddaughter of the man who skippered her from '46 to '68: you are holding the bottle today. Your brother has his view, and you have yours. You knew the skipper. You know that he didn't care about the philosophy of timber. He cared about whether the engine started, whether the supplies got to the lights, and whether the crew came home dry. He knew that a boat is only as true as the hands that maintain her. Eddie Marsden's hands are in this hull. The skipper's hands are on this bottle. That connection is not something you can cut with a saw.

  We are not rivals with the school. They saved the material. We saved the service. They have the past. We have the future. Both are needed. A name like *Marabel* is big enough for both, because a name is a promise, not a possession. We promise to keep her working. They promise to keep her memory alive in wood.

  So, before I ask you to witness the breaking of this bottle, I need to say what I mean when I say she is the same boat. I am not speaking in riddles. I am speaking as a man who has held a paint scraper for fourteen years.

  She is the same boat because the line of care was never cut. We held her in trust until she could hold herself again.

  God bless the *Marabel*.
