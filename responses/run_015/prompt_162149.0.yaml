  # The Limit Diagnostic: A Self-Scoring Instrument

  ## Instructions
  Read each of the nine cases below. Select the option that best matches your intuitive judgment. Do not worry about consistency yet; answer based on your immediate reaction to the scenario. At the end, use the Scoring Key to locate your position.

  ## The Questions

  **1. The Drip**
  One person must endure one minute of intense agony. Alternatively, one million people each endure a brief mosquito bite—a noticeable irritation, but nothing severe. You must choose which scenario occurs.
  *   A. Choose the one minute of agony to spare the million the irritation.
  *   B. Choose the million irritations to spare the one person the agony.
  *   C. I cannot choose without knowing more about the total duration or context.

  **2. The Bargain**
  A person is offered a life of eighty years of deep happiness and achievement. However, this life necessarily includes one single hour of intense agony. They do not yet exist.
  *   A. It is better that this person comes into existence despite the hour of agony.
  *   B. It is better that this person never exists than to endure that hour.
  *   C. It depends on whether the hour is isolated or part of a larger pattern.

  **3. The Chili**
  A person eats a very spicy meal. The burning sensation is unpleasant in isolation, but it is essential to the enjoyment of the meal. They would not want the meal without the burn.
  *   A. The burn is a negative value that is simply cancelled out by the enjoyment.
  *   B. The burn is not a negative value at all in this context; it is part of the good.
  *   C. The burn remains negative, but the total experience is still worth having.

  **4. The Capped Subject**
  Consider a person who, due to biology or medication, physically cannot feel pain above a moderate level. They can feel irritation, but not agony.
  *   A. The limit for what is forbidden applies to them just as it does to everyone else.
  *   B. The limit for them is lower, because they cannot reach the higher levels.
  *   C. The limit does not apply to them because they cannot experience the relevant state.

  **5. The Compensation**
  One person must endure one minute of intense agony. In exchange, one million people receive a lifetime of pure bliss. The agony cannot be avoided otherwise.
  *   A. Accept the trade; the bliss makes up for the agony.
  *   B. Reject the trade; no amount of bliss justifies the agony.
  *   C. Accept only if the person enduring agony consents to it.

  **6. The Ignorant Chooser**
  You must vote on a policy for a large population. You know there is a 1% chance the policy will cause one person to endure intense agony, but you do not know if that person will be you.
  *   A. Vote for the policy if the benefits to the rest are high enough.
  *   B. Vote against the policy because the chance of agony is unacceptable.
  *   C. Vote for the policy only if the chance is lower than 1%.

  **7. The Smear**
  A sensation occurs that is right on the border of the limit. Experts cannot agree, and the subject cannot tell, if it crosses into the forbidden zone or stays just below it.
  *   A. Treat it as forbidden to be safe.
  *   B. Treat it as permitted since it is not clearly forbidden.
  *   C. Suspend judgment until measurement improves.

  **8. The Creation**
  Compare preventing an existing person from enduring an hour of agony versus bringing a new person into existence who will endure that same hour (but otherwise have a good life).
  *   A. Preventing the agony is strictly more important than not creating the person.
  *   B. Not creating the person is just as important as preventing the agony.
  *   C. Preventing the agony matters; creating the person is neutral or positive.

  **9. The Drift**
  If humanity became habituated to intense pain over centuries, such that it no longer disrupted life or caused distress, would the limit move?
  *   A. No, the limit is fixed by the nature of the sensation.
  *   B. Yes, the limit moves because the moral status depends on the impact.
  *   C. Yes, but only for future generations, not currently living people.

  ---

  ## Scoring Key

  Follow the path below based on your answers. Branch nodes are labelled by the claim that splits the path.

  **Start:** Check **Q5 (The Compensation)**.
  *   **Branch Claim:** *Are pleasure and suffering on a single scale?*
      *   **If Mostly A:** Go to **Leaf 1**.
      *   **If Mostly B:** Go to **Node 2**.
      *   **If Mostly C:** Go to **Leaf 7 (Unoccupied)**.

  **Node 2:** Check **Q2 (The Bargain)**.
  *   **Branch Claim:** *What bears the limit: a moment or a life?*
      *   **If Mostly B:** Go to **Leaf 2**.
      *   **If Mostly A:** Go to **Node 3**.
      *   **If Mostly C:** Go to **Leaf 7 (Unoccupied)**.

  **Node 3:** Check **Q4 (The Capped Subject)**.
  *   **Branch Claim:** *Is the limit fixed or indexed to the subject?*
      *   **If Mostly A:** Go to **Leaf 3**.
      *   **If Mostly B:** Go to **Leaf 4**.
      *   **If Mostly C:** Go to **Leaf 7 (Unoccupied)**.

  **Node 4 (from Leaf 3 path):** Check **Q6 (The Ignorant Chooser)**.
  *   **Branch Claim:** *Does the limit extend to risks?*
      *   **If Mostly A:** Go to **Leaf 3 (Confirmed)**.
      *   **If Mostly B:** Go to **Leaf 5**.
      *   **If Mostly C:** Go to **Leaf 6 (Unoccupied)**.

  **Leaves:**

  1.  **The Unrestricted Balancer**
      *   *Awkward Commitment:* Must accept trading a lifetime of joy for a moment of extreme agony if the numbers stack.
  2.  **The Moment Absolutist**
      *   *Awkward Commitment:* Must forbid life-saving surgery if it involves a moment of extreme pain.
  3.  **The Life Absolutist**
      *   *Awkward Commitment:* Must accept distributing extreme pain across many lives if no single life exceeds the total.
  4.  **The Indexed Absolutist**
      *   *Awkward Commitment:* Must treat identical pain differently based on the person's capacity.
  5.  **The Risk Absolutist**
      *   *Awkward Commitment:* Must forbid all driving because there is a non-zero chance of extreme agony.
  6.  **Unoccupied (The Static Risk)**
      *   *Awkward Commitment:* Forbids risk but denies habituation changes the limit (Diagnosis: Unstable).
  7.  **Unoccupied (The Consent Balancer)**
      *   *Awkward Commitment:* Allows trade-offs only with consent (Diagnosis: Merely Unexplored).

  ---

  ## Separation Table

  | Question | Separates Leaves | Flag |
  | :--- | :--- | :--- |
  | **Q1 (Drip)** | 2 vs 3 | Separates aggregation views within Absolutists. |
  | **Q2 (Bargain)** | 2 vs 3 | Primary split for Bearer of Limit. |
  | **Q3 (Chili)** | 1 vs 2/3 | Separates Atomism from Holism (Cross-cut). |
  | **Q4 (Capped)** | 3 vs 4 | Primary split for Fixed vs Indexed. |
  | **Q5 (Compensation)** | 1 vs 2/3/4/5 | Primary split for Single Scale vs Limit. |
  | **Q6 (Ignorant)** | 3 vs 5 | Primary split for Risk Extension. |
  | **Q7 (Smear)** | All | Epistemic modifier (Does not separate leaves alone). |
  | **Q8 (Creation)** | 2 vs 5 | Separates Prevention vs Creation duties. |
  | **Q9 (Drift)** | 5 vs 6 | Separates Static vs Dynamic Limits. |

  *Flag Note:* **Q7 (Smear)** separates nothing on its own; it modifies confidence in all other assignments. **Q1 (Drip)** repeats **Q2** for those who already chose Leaf 2, but distinguishes Leaf 2 sub-types.

  ---

  ## Indistinguishable Pairs

  This instrument cannot reliably distinguish between **The Life Absolutist (Leaf 3)** and **The Indexed Absolutist (Leaf 4)** if the respondent believes the "average" life capacity is the fixed limit. Both views may yield identical answers in standard cases, diverging only in rare biological outliers (like The Capped Subject). If a respondent skips Q4 or answers ambiguously, these two positions collapse into one another.

  ---

  ## Unoccupied Combinations

  1.  **Risk Absolutist who Allows Creation:** Forbids risking harm to existing people but permits creating new people who will suffer that harm. *Diagnosis: Incoherent (Why does existence change the veto?).*
  2.  **Indexed Absolutist who Denies Drift:** Claims the limit depends on capacity but not on habituation over time. *Diagnosis: Unstable (Capacity changes with habituation).*
  3.  **Moment Absolutist who Allows Aggregation:** Forbids one moment above the limit but allows infinite moments just below it to sum to worse than the limit. *Diagnosis: Merely Unexplored (Sorites vulnerability).*

  ---

  ## Calibration Item

  **Check:** If you answered **A** on **Q5 (The Compensation)** but **B** on **Q1 (The Drip)**, you may have misread the cases.
  **Advice:** Q5 asks if bliss can *justify* agony. Q1 asks if irritation can *justify* agony. If you think bliss cannot justify agony, irritation certainly cannot. Review Q5. If you meant that consent matters (Option C), move to Leaf 7.

  ---

  ## Usage Note

  **For Blog Readers:** Treat this as a snapshot of your current intuitions. There are no "correct" answers. The value lies in seeing which awkward commitment you are willing to accept.
  **For Seminars:** Use the leaves as discussion groups. Have students defend the "Awkward Commitment" of their assigned leaf. Use Q7 (The Smear) to provoke debate on epistemic humility versus moral precision.

  ---

  ## Closing Analysis

  The shape of this instrument reveals that the heavy lifting in this debate is done by the **limit** rather than the negative-leaning weighting. Once a strict bar is admitted (Q5), the question of whether pleasure and pain are on a single scale becomes secondary to the question of **what bears the limit** (Q2). The commensurability question turns out to be downstream of the bearer question: if the limit bears on moments, scale matters less than prohibition; if it bears on lives, trade-offs return below the cap. Thus, the core conflict is not about value measurement, but about the unit of moral protection.
