answer: |-
  Your intuition is physically sound: cooperation is an ordering transition driven by effective couplings, but the "rational agent" layer is an anthropomorphic gloss on stochastic dynamics.

  ### The Translation: Cooperation as Statistical Mechanics

  **The Substrate:** A population is a lattice (or graph) of $N$ sites. Each site $i$ holds a spin $\sigma_i \in \{C, D\}$ (Cooperate/Defect). In the standard mapping, Payoff $\Pi \to -Energy$. The Prisoner's Dilemma payoff matrix defines the local interaction Hamiltonian $H_{ij}$ between nearest neighbors. For a single pair isolated at $T=0$, the ground state is $(D, D)$; $(C, C)$ is a metastable state separated by an energy barrier determined by the temptation to defect.

  **One-Shot vs. Iterated:**
  *   **One-Shot:** A single minimization step. Without external fields or boundary conditions, the system relaxes to the $(D, D)$ ground state. Cooperation is thermodynamically unstable.
  *   **Iterated:** You extend the lattice into the time dimension. A player's history is a worldline $\sigma_i(t)$. The probability of another encounter, $w$ (or discount factor $\delta$), acts as the coupling strength $J_t$ along the time axis. The total Hamiltonian becomes anisotropic: $H = \sum_{\langle ij \rangle} J_{space} \sigma_i \sigma_j + \sum_{t} J_{time}(w) \sigma_i(t) \sigma_i(t+1)$.
  *   **Shadow of the Future:** As $w \to 1$, the correlation length in the time direction, $\xi_t \sim 1/(1-w)$, diverges. When $\xi_t$ exceeds a critical threshold, the free-energy landscape changes: the "All-C" configuration becomes a global minimum (or at least a deep metastable well) because the long-time penalty for defection outweighs the short-time gain.

  **Strategies as Update Rules:**
  *   **Tit-for-Tat (TFT):** A local deterministic update rule: $\sigma_i(t+1) = \sigma_j(t)$. This is a nearest-neighbor ferromagnetic coupling in spacetime.
  *   **Generous/Forgiving:** Introducing stochasticity into the update rule. This is equivalent to introducing a finite temperature $T_{strat}$ into the dynamics (Glauber dynamics), allowing the system to escape local minima caused by implementation errors (noise).
  *   **Evolutionary Stability:** A strategy is an Evolutionarily Stable Strategy (ESS) if a cluster of mutant spins (invaders) cannot nucleate. This is a nucleation problem: the surface tension between the C-phase and D-phase must be positive enough to prevent the mutant domain from growing.

  **The Five Mechanisms as Coupling Modifiers:**
  1.  **Kinship:** Quenched disorder. Specific bonds $J_{ij}$ are fixed to be strongly ferromagnetic based on a static label (genotype).
  2.  **Direct Reciprocity:** Anisotropic coupling in the time direction (as above).
  3.  **Indirect Reciprocity:** A global mean field (reputation score $R_i$). The coupling becomes $J_{ij} \to J(R_i, R_j)$. This breaks locality; spins couple to the ensemble average.
  4.  **Structured Interaction (Networks):** Reducing the effective dimensionality or coordination number $z$. Low-$z$ lattices suppress mean-field fluctuations, allowing ordered domains (cooperation) to persist via clustering even when mean-field theory predicts disorder.
  5.  **Group Selection:** Hierarchical lattice. You coarse-grain the system into blocks (demes). Selection acts on the block magnetization, not just individual spins. This is a Renormalization Group (RG) flow where the effective coupling constants flow differently at large scales than at small scales.

  ***

  ### Residue Report

  **Hunch 1: Probability of Encounter vs. Correlation Length**
  **Verdict: Fair.**
  The continuation probability $w$ maps directly to the anisotropy parameter in a spacetime lattice. The condition for cooperation $w > (T-R)/(T-P)$ is mathematically identical to a critical coupling condition $J_c/k_B T$. Below $w_c$, the correlation length $\xi$ is finite and short; the system is in a disordered (Defect) phase. Above $w_c$, $\xi$ diverges (in the infinite limit), allowing long-range order (Cooperation).
  *Caveat:* In finite populations, this is not a sharp singularity but a crossover smoothed by finite-size rounding. The "sharp loss" you perceive is the system crossing from the ordered regime into the regime where fluctuations destroy order. It is a genuine phase transition in the thermodynamic limit ($N \to \infty$, infinite iterations), but in biological reality, you are always observing finite-size rounding.

  **Hunch 2: Five Mechanisms as Positive Assortment**
  **Verdict: Honest Reduction.**
  Hamilton's rule $rb > c$ is essentially a mean-field condition for ferromagnetic ordering. The coefficient $r$ (relatedness) is the normalized covariance $\langle \sigma_i \sigma_j \rangle - \langle \sigma_i \rangle \langle \sigma_j \rangle$. All five mechanisms function by modifying the interaction matrix or the sampling measure to increase this covariance.
  *   Kinship fixes the bond strength.
  *   Reciprocity extends the interaction range (time or reputation).
  *   Structure restricts the interaction topology.
  *   Group Selection modifies the measure over which the average is taken (block spin vs. individual spin).
  They are indeed five implementations of one rule: increasing the effective ferromagnetic coupling $J_{eff}$ relative to the entropic temptation to disorder. The only structural distinction is Group Selection, which involves a scale-dependent flow (RG), whereas the others operate at a fixed scale.

  **Missing Counterparts: Agency and Rationality**
  Your vocabulary lacks teleology. Physics describes relaxation; game theory describes optimization based on expectation.
  *   **Rational Choice/Backward Induction:** This assumes the system knows the full Hamiltonian and performs a global minimization from $t=\infty$ backwards to $t=0$. In physics, this is unphysical; systems evolve forward via local gradients. Backward induction is a zero-temperature greedy algorithm with non-local information access.
  *   **"Acting for a Reason":** This implies the update rule depends on a model of the other agent's Hamiltonian. In your vocabulary, this is adaptive coupling $J_{ij}(t)$ based on inference, not just response.
  *   **Tournament Results:** A tournament is a single realization of quenched disorder. Physics cares about the ensemble average (the phase diagram); tournament winners are often specific to the "impurities" (the specific set of strategies submitted). A strategy winning a tournament is like a specific spin configuration having low energy in one specific disorder realization—it does not guarantee it is the ground state of the Hamiltonian.

