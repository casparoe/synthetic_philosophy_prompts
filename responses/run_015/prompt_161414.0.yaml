  | **Positive Assortment ($r$)** | Correlation Function $G(r)$ | **Exact** | Covariance $\equiv$ Spin-spin correlation. |
  | **Group Selection** | Renormalization Group Flow | **Bent** | Requires hierarchical coarse-graining. |
