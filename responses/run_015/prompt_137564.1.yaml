answer: |-
  Consider program $K$: "Execute dummy work $W$. Search for a formal proof that Opponent cooperates against a pure Defector. If found, output D; else output C." The rules mandate that any timeout outputs D. We tune $W$ and the proof complexity such that the search requires significant steps.

  At low budget $B_{low}$, $K$ hits the step limit during $W$ or the search. By rule, it outputs D. Matchup $K$ vs $K$ yields mutual defection (DD). Cooperation fails because agents are too dumb to verify safety.

  At intermediate budget $B^*$, $K$ completes $W$ and runs the search, but the budget expires before the proof is found. The search halts without success. $K$ outputs C. Since both do this, we get mutual cooperation (CC). Crucially, at $B^*$, $K$ is opaque: the opponent cannot establish within $B^*$ steps what $K$ does against a Defector. The uncertainty prevents exploitation; I cooperate because I cannot prove you are a sucker.

  At high budget $B_{high}$, the search succeeds. $K$ proves that its twin cooperates against a Defector (since the twin's else-branch triggers there). Seeing this exploitable disposition, $K$ outputs D. Both defect. Cooperation is destroyed by excessive clarity. The "exploit-check" succeeds too well: knowing you are safe to exploit makes me exploit you.

  The objection: "If high budget kills cooperation, why not hard-wire a lower cap?" This fails because opacity is relational. Your self-imposed limit restricts *your* analysis of *them*, not *their* analysis of *you*. If the environment permits $B_{high}$, your opponent uses $B_{high}$ to parse your source. They see your hard-wired cap, simulate you easily, and confirm you are a sucker. You need the opponent to be computationally bounded relative to your complexity, not yourself. Limiting yourself just blinds you to their defection while leaving you transparent to their exploitation.

  The sweet spot $B^*$ exists where compute is high enough to avoid timeout defection but low enough to maintain opacity against exploitation.

  In program equilibrium, cooperation is maximized at an intermediate reasoning budget where agents are smart enough to coordinate but too dumb to prove exploitability.

  \answer{Asserting that proof search complexity can be tuned to fail at B* while succeeding at B_high without allowing the agent to prove that the search will fail, which might trigger different behavior.}
