  # Seminar Plan: Dennett's Design Space (50 Minutes)

  **Target Audience:** Advanced Undergraduates (Cognitive Science)
  **Prerequisites:** Basic Evolutionary Biology; No Philosophy of Mind.
  **Topic:** Dennett's Fourfold Taxonomy as a Design-Space Matrix.

  ---

  ## I. Pedagogical Sequence & Conceptual Dependencies (5 Minutes)

  **Goal:** Establish the matrix framework and prevent the "Evolutionary Ladder" misconception.

  1.  **Opening Frame (2 mins):**
      *   **Statement:** "Today we are not studying history; we are studying engineering options. We are mapping a design space, not a timeline."
      *   **Misconception Interception (Value Hierarchy):** Explicitly state that 'Gregorian' is not 'better' in a moral or consciousness sense, but 'more capable' in specific information-processing tasks. A Darwinian creature is perfectly designed for its niche; a Gregorian creature in that same niche might starve while drawing maps.
      *   **Why this order:** If you present the types chronologically first, students conflate *historical emergence* with *functional necessity*. By defining the axes first, we treat them as independent variables.

  2.  **The Two Axes (3 mins):**
      *   **Axis 1:** Capacity for Internal Counterfactual Modeling (Can the system test 'what if' without acting?).
      *   **Axis 2:** Capacity for Cultural/Representational Inheritance (Can the system acquire design information from conspecifics?).
      *   **Dependency:** Axis 1 must be defined before Axis 2. You cannot understand cultural transmission of tools (Gregorian) without understanding the internal capacity to use a tool as a representation (Popperian).
      *   **Why reversing collapses distinctions:** If you introduce Cultural Inheritance first, students conflate *having tools* with *having intelligence*. They will assume a creature using a stick (Gregorian) must understand *why* the stick works (Popperian). Separating the axes reveals that one can theoretically have culture without deep modeling (mimicry) or modeling without culture (solitary genius).

  ---

  ## II. The Carrying Example: "The Shifting Maze" (5 Minutes)

  **Goal:** Provide a single embodied context to instantiate all four types without changing the task parameters.

  **Task Description:** An agent must navigate a grid to find a hidden caloric reward. The grid contains obstacles.

  **Required Features:**
  1.  **Novel Obstacles:** Walls appear in new configurations each generation/trial (prevents hardwired solutions from working forever).
  2.  **Absence of Direct Feedback (for Popperian test):** Some walls are "invisible" until touched, but some cues (smells/shadows) allow prediction *before* contact.
  3.  **Availability of Symbolic Transmission (for Gregorian test):** Agents can leave physical markers (pheromones, stones, maps) for others.
  4.  **No Language Dependence:** The task must be solvable by non-linguistic agents (Darwinian/Skinnerian) to prevent conflating language with thought.

  **What it Must Lack:**
  *   **Explicit Goals:** The agent is not "told" to find food; it is driven by hunger/reward signals.
  *   **Conscious Reporting:** Agents do not report "feeling" confused; we observe behavior only.

  ---

  ## III. Mapping the Taxonomy to the Matrix (20 Minutes)

  **Goal:** Populate the matrix using the Shifting Maze, intercepting misconceptions at point of introduction.

  ### Step 1: The "No Model" Quadrant (Axis 1 = Low) (7 Minutes)
  *   **Darwinian Creature:**
      *   *Behavior:* Hardwired "turn right at wall."
      *   *Selection:* Phylogenetic. If the maze shifts, the creature dies. The *lineage* adapts over generations, not the individual.
      *   **Misconception Interception (Skinnerian = Random):** Contrast immediately with Skinnerian. "Unlike random motion, the Darwinian creature has a fixed, selected strategy. It is not guessing; it is executing code."
  *   **Skinnerian Creature:**
      *   *Behavior:* Bumps into walls. Receives pain (shock) or reward (sugar). Adjusts probability of turning.
      *   *Selection:* Ontogenetic (within lifetime).
      *   *Distinction:* Both Darwinian and Skinnerian lack *counterfactuals*. They must touch the wall to know it is there.
      *   *Matrix Position:* Both occupy (-Model, -Culture). Distinguished by **Locus of Selection** (Genome vs. Somatic).

  ### Step 2: The "Internal Model" Quadrant (Axis 1 = High) (7 Minutes)
  *   **Popperian Creature:**
      *   *Behavior:* Pauses at junction. "Simulates" hitting the wall internally. Turns away *before* contact.
      *   *Key Feature:* "Let my hypotheses die in my stead."
      *   **Misconception Interception (Popperian = Language):** Explicitly state: "This simulation does not require English. It requires a neural map that supports offline prediction. A rat can be Popperian."
  *   **Matrix Position:** (+Model, -Culture).

  ### Step 3: The "Cultural Inheritance" Quadrant (Axis 2 = High) (6 Minutes)
  *   **Gregorian Creature:**
      *   *Behavior:* Uses the Popperian simulation *plus* finds a stone map left by a predecessor, or sharpens a stick to probe walls.
      *   *Key Feature:* Tools and memes act as "exograms" (external memory). The design of the probe is inherited, not reinvented.
      *   **Misconception Interception (Gregorian = Consciousness):** "Using a map does not require qualia. It requires the capacity to treat an external object as a representation. A bee hive can be Gregorian in this sense without a 'ghost in the machine'."
  *   **Matrix Position:** (+Model, +Culture).

  ---

  ## IV. Check-for-Understanding: The Hybrid System (10 Minutes)

  **Goal:** Test application of axes against label-memorization using a novel case.

  **Scenario:** A mobile robot equipped with:
  1.  A Reinforcement Learning (RL) controller for motor movement (rewarded for forward motion, punished for collisions).
  2.  A Large Language Model (LLM) core that processes text instructions and generates navigation plans based on a training dataset of human maps.

  **Task:** Students must map this system onto the Matrix.

  **Correct Analysis (Expected):**
  *   **RL Controller:** **Skinnerian.** It learns via environmental feedback (collision/reward) within its lifetime. It lacks counterfactual simulation (it must crash to learn).
  *   **LLM Weights:** **Gregorian.** The model's "intelligence" is derived from cultural inheritance (human text data). It possesses representational inheritance.
  *   **LLM Inference:** **Popperian.** When generating a plan ("If I go left, I hit a wall"), it is running internal counterfactual simulations based on its training.
  *   **Synthesis:** The system is a **Gregorian-Popperian hybrid with a Skinnerian body.**
  *   **Failure Mode:** If a student labels the whole robot "Gregorian" because it has an LLM, they have failed to separate the *learning mechanism* (RL/Skinnerian) from the *inheritance mechanism* (LLM/Gregorian).

  ---

  ## V. Bracketing Dennett's Broader Framework (5 Minutes)

  **Goal:** Delimit the scope of this session to prevent conceptual overload.

  | Element Bracketed | Justification for Omission |
  | :--- | :--- |
  | **The Tower of Generate-and-Test** | This is the *meta-theory* explaining how the four creatures relate. Introducing it now conflates the *taxonomy* (the what) with the *mechanism* (the how). We need to master the categories before the engine that drives them. |
  | **Evolutionary Chronology** | We are treating this as a **Design Space**, not a history lesson. Focusing on chronology reinforces the "Ladder" misconception we are actively fighting. A modern bacterium is still Darwinian; a modern human is not "more evolved," just differently equipped. |
  | **Neural Implementation Details** | Whether the "Popperian simulator" is a prefrontal cortex loop or a transformer attention head is an implementation detail. Dennett's taxonomy is **functionalist**. Focusing on anatomy distracts from the computational logic of the taxonomy. |

  ---

  ## VI. Summary & Exit Ticket (5 Minutes)

  **Recap:**
  1.  **Axis 1 (Modeling):** Distinguishes those who learn by dying (Darwin/Skinner) from those who let hypotheses die (Popper/Gregorian).
  2.  **Axis 2 (Inheritance):** Distinguishes solitary intelligences (Popper) from those standing on the shoulders of giants (Gregorian).
  3.  **Darwin vs. Skinner:** Distinguished by Locus of Selection (Genome vs. Lifetime) within the No-Model quadrant.

  **Exit Ticket Question:**
  "A species of bird learns to crack nuts by dropping them on rocks. They do not simulate the drop internally (they must drop it to see if it breaks), but they learn this behavior exclusively by watching their parents, not by trial-and-error themselves. Where does this creature fall on the Matrix?"
  *   *Correct Answer:* (-Model, +Culture). This challenges the assumption that Culture requires Popperian modeling (Mimicry vs. Understanding). *Note: This specific edge case highlights the independence of the axes.*

  ---

  ### Instructor Notes on Misconception Interception Points

  1.  **If a student asks:** "But isn't the Skinnerian creature just guessing randomly?"
      *   **Intercept:** During **Step 1**. Clarify that operant conditioning is *selectionist*, not random. The variation is generated, but the retention is selected by the environment.
  2.  **If a student says:** "So Popperian creatures are the first to be conscious?"
      *   **Intercept:** During **Step 2**. Reiterate: "Simulation is a functional capacity, not a phenomenological state. A thermostat has a primitive model; a Popperian creature has a richer one. Neither implies 'feeling'."
  3.  **If a student assumes:** "Gregorian means Human."
      *   **Intercept:** During **Step 3**. Use the example of tool-use in crows or chimpanzees. They are proto-Gregorian. The category is about *information transmission*, not species membership.
