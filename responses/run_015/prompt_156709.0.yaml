answer: |-
  # Seminar Plan: The Delegation Cascade
  **Topic:** Democratic Legitimacy and Rational Choice  
  **Duration:** 90 Minutes (50-min Game, 40-min Debrief)  
  **Participants:** 18 Graduate Students  

  ## I. Learning Objectives
  1.  **Experience the Cascade:** Demonstrate how individually rational decisions to avoid voting costs (delegation) aggregate into systemic failure.
  2.  **Legitimacy Deficit:** Highlight the gap between *procedural* success (a decision was reached) and *normative* legitimacy (representatives lacked clear authorization).
  3.  **Limitations of Rational Choice:** Show that solving the "paradox of voting" via delegation creates a new paradox of authorization.

  ## II. Materials List
  *   **Tokens:** 180 poker chips or printed paper tokens (10 per student).
  *   **Ballots:** 54 small slips of paper (3 per student per round).
  *   **Envelopes:** 54 small opaque envelopes (for anonymous Tier 1 voting).
  *   **Dice/Coins:** 6 coins (one per Local Cell) for the delegation lottery.
  *   **Seating:** 6 tables (Local Cells), 2 tables (Regional Councils), 1 table (National Assembly). *Note: You will physically move students between tiers as the game progresses.*
  *   **Instructor Sheet:** To track token counts and cascade status.

  ## III. Game Mechanics & Rules

  ### The Structure
  *   **Tier 1 (Local):** 6 Cells of 3 students. (3 Cells feed Region A, 3 Cells feed Region B).
  *   **Tier 2 (Regional):** 2 Councils. Composed of the "Representatives" sent from Tier 1.
  *   **Tier 3 (National):** 1 Assembly of 2 members (1 from Region A, 1 from Region B).

  ### The Economy
  *   **Endowment:** 10 Tokens each.
  *   **Cost of Voting:** 1 Token.
  *   **Collective Payoff:** 8 Tokens each **IF** the National Assembly approves the decision.
  *   **Failure:** 0 Collective Payoff (students keep unspent tokens).

  ### The Choice (Tiers 1 & 2)
  At Local and Regional tiers, participants choose one of two options:
  1.  **VOTE:** Pay 1 Token immediately. You become a Representative for the next tier.
  2.  **DELEGATE:** Pay 0 Tokens. You hope others vote.
      *   *The Lottery:* If **everyone** in the group chooses DELEGATE, flip a coin.
          *   **Heads:** One person is randomly drafted. They pay 1 Token and become the Representative.
          *   **Tails:** **No Representative** is sent. The cascade breaks for this branch.

  ### The Quorum Rules (Crucial for Legitimacy)
  *   **Local $\rightarrow$ Regional:** A Regional Council convenes **only if all 3 Local Cells** send a Representative. If even one Cell fails (Tails on the lottery), the Region is dissolved.
  *   **Regional $\rightarrow$ National:** A National Assembly convenes **only if both Regions** send a Representative.
  *   **National Decision:** The 2 National Members must both choose **APPROVE** (Cost 1 Token each) to unlock the 8-Token payoff for everyone. If either abstains or votes REJECT, payoff is 0.

  ## IV. Timeline (50-Minute Run)

  | Time | Phase | Activity |
  | :--- | :--- | :--- |
  | **00-10** | **Setup** | Distribute tokens (10 each). Assign Local Cells (1-6). Explain rules **without** highlighting the lottery risk too heavily. Emphasize the "Rational" benefit of saving tokens. |
  | **10-20** | **Round 1** | **Tier 1:** Students place ballots in **sealed envelopes** (Anonymity). Collect. Resolve Lotteries. <br> **Tier 2:** Move Reps to Regional tables. Vote/Delegate. <br> **Tier 3:** Move Reps to National table. Decide. <br> **Payoff:** Distribute tokens. |
  | **20-25** | **Reset** | Return everyone to original seats. Return tokens to starting endowment (10). **Do not debrief yet.** |
  | **25-35** | **Round 2** | Repeat Tier 1. *Prediction:* Students will Delegate to save costs. <br> **Tier 2/3:** Execute cascade. *Target Outcome:* One Local Cell hits "Tails," dissolving a Region, breaking the National cascade. |
  | **35-40** | **Final Tally** | Announce failure. Collect materials. |
  | **40-50** | **Transition** | Clear room for seminar circle. Prepare board for debrief notes. |

  *(Note: The remaining 40 minutes of the 90-min seminar are for the Debrief below.)*

  ## V. Anonymity & Coordination Control
  **The Problem:** In Round 1, graduate students will likely talk and coordinate to "all Vote" to secure the payoff, suppressing the rational choice dynamic.
  **The Solution:**
  1.  **Sealed Envelopes:** Tier 1 ballots must be sealed before collection. No show of hands.
  2.  **No Discussion Rule:** Enforce strict silence during the decision window (2 minutes per tier).
  3.  **Instructor Collection:** Walk around and collect envelopes personally to prevent students from seeing others' choices.

  ## VI. Predictable Dynamics

  ### Round 1: The Social Norm
  *   **Behavior:** Students will likely coordinate (verbally or via eye contact) to all Vote.
  *   **Why:** High stakes (8 tokens) vs. low cost (1 token). Social pressure to not be the "free rider" who risks the group payoff.
  *   **Outcome:** Successful cascade. High legitimacy. Everyone pays 1 token, gets 8. Net +7.

  ### Round 2: The Rational Cascade
  *   **Behavior:** Students realize Delegating has a lower *expected cost*.
      *   *Calculation:* If I Vote, Cost = 1. If I Delegate (and 2 others Delegate), Expected Cost = (0.5 chance of draft $\times$ 1 token) / 3 people $\approx$ 0.16 tokens.
      *   *Dominant Strategy:* Delegate.
  *   **Outcome:** High delegation rate at Local Tier.
  *   **The Break:** Statistically, with 6 Local Cells flipping coins for "All Delegate," it is highly probable one hits **Tails**.
  *   **The Legitimacy Crisis:**
      *   **The Drafted:** Students randomly forced to pay the token will feel resentment ("I didn't choose this").
      *   **The National Reps:** If the cascade survives but barely, the 2 National Reps will realize they represent a chain of random drafts, not active consent.
      *   **The Failure:** If the cascade breaks (Region dissolves), the students in the *successful* Region will realize their rational delegation doomed the collective good.

  ## VII. Debrief Guide (40 Minutes)

  ### 1. The Rational Choice Logic (10 mins)
  *   **Board Work:** Map the Expected Utility (EU).
      *   $EU(Vote) = -1$
      *   $EU(Delegate) = -P(Draft) \times 1$
  *   **Discussion:** Why was Delegate the dominant strategy in Round 2? Connect to Downsian Paradox (cost of voting > benefit of being pivotal).
  *   **Key Insight:** Delegation solves the *cost* problem but creates a *transmission* problem.

  ### 2. The Legitimacy Deficit (15 mins)
  *   **Ask the "Drafted" Students:** "You paid the cost, but you didn't choose to. Do you feel authorized to represent your cell?" (Likely: No).
  *   **Ask the National Reps:** "Knowing the chain below you was built on lotteries and delegation, did you feel your 'Approve' vote was legitimate?"
  *   **Concept:** **Authorization vs. Alienation.** Rational delegation alienates the principal from the agent. The cascade produces *decision-making capacity* without *democratic authorization*.
  *   **Connection:** This mirrors real-world nested representation (local $\rightarrow$ state $\rightarrow$ federal $\rightarrow$ international bodies).

  ### 3. Emotional Resonance (10 mins)
  *   **Focus:** The students who were **Drafted** in Round 2.
  *   **Why:** They bear the cost without the agency. This replicates the feeling of constituents who feel "represented" by officials they never voted for or who were selected via insider mechanisms.
  *   **Focus:** The students whose Region **Broke**.
  *   **Why:** They kept their tokens (saved cost) but lost the payoff. This replicates **Rational Ignorance** consequences: individual rationality led to collective loss.

  ### 4. Limitations & Epistemic Dimension (5 mins)
  *   **Instructor Note:** Be frank about what the game *cannot* do.
  *   **The Missing Variable:** **Information.** In the game, the "Policy" is binary and the Payoff is known (8 tokens).
  *   **Real World:** Voters delegate not just to save cost, but because they lack information (Epistemic Rational Ignorance).
  *   **Discussion:** "In the game, you knew the payoff. In reality, you don't know if the National Assembly is choosing '8 tokens' or 'Poison.' Does delegation make this epistemic problem better (experts decide) or worse (principals can't monitor agents)?"
  *   **Closing:** The game proves delegation is *rationally stable* but *legitimately fragile*. The seminar's task is to find norms or institutions that restore authorization without reintroducing prohibitive costs.

  ## VIII. Instructor's Cheat Sheet: Managing the "Break"
  *   **If Round 2 goes too smoothly:** If all Local Cells happen to flip Heads (everyone drafts a rep), the cascade won't break naturally.
  *   **Intervention:** Do not rig the dice. Instead, use the **Debrief** to highlight the *risk*. "We got lucky today, but the probability of failure was 70%. A system that relies on luck for legitimacy is unstable."
  *   **If Round 1 Fails:** If social coordination fails in Round 1 and they Delegate immediately, acknowledge it: "You skipped the 'Social Norm' phase and went straight to 'Rational Equilibrium.' This suggests your cohort is already highly cynical about collective action!" (Use this to jumpstart the debrief).

  ## IX. Honesty Note on Limitations
  *   **Epistemic Void:** This activity captures the **incentive structure** of delegation but not the **informational asymmetry**. In reality, voters delegate because they trust the representative's *judgment*, not just to save a token.
  *   **Remedy:** In the debrief, explicitly state: "You knew the 'Bill' was good (8 tokens). In reality, you don't know if the Bill is good. Does that make delegation more rational (trust experts) or less (trust broken)?"
  *   **Emotional Reality:** The "Drafted" students provide the emotional anchor. Ensure you call on them specifically during the legitimacy discussion. Their reluctance is the physical manifestation of the "Legitimacy Deficit."
