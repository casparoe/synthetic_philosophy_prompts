  Conceptual Dependencies and Teaching Sequence (~180 words)
  Begin by defining the Careenium: inert simmballs moving via Newtonian laws. Establish causal closure: every ball's motion is fully determined by prior physical states. Next, introduce simms: stable, high-level patterns constituted by simmballs. Only then pose the central tension: if physics is closed, do simms do anything? Finally, present the resolution: simms are causally relevant not as forces, but as compressible descriptions of substrate trajectories. This order is strict because students cannot grasp downward causation without first accepting upward constitution. If you introduce patterns before physics, they will reify patterns as ghosts. If you introduce closure after causation, they will deny physics. The sequence moves from ontology to causality to explanation. Dependencies are linear; later concepts collapse without earlier foundations. Within thirty minutes, rushing the closure step guarantees failure; students must feel the hardness of physics before accepting the softness of patterns.

  The Carrying Example: Requirements and Limits (~150 words)
  Use a whirlpool in a flowing stream. The water molecules are simmballs; the whirlpool shape is the simm. The whirlpool persists and constrains incoming water molecules without a central controller. It must possess structural stability: the pattern maintains itself against perturbations. It must lack external agency: no one "makes" the whirlpool happen besides the water dynamics. Crucially, avoid computer analogies. Software implies distinct code running on hardware, suggesting dualism. The whirlpool is identical to the water, just organized. This makes downward causation feel like structural constraint rather than magical influence. The whirlpool "causes" water to spiral not by force, but by being the only stable path for the water given the conditions. This ensures the example remains physicalist while illustrating high-level constraint. It must be dynamic, not static.

  Misconception Map and Intervention Points (~180 words)
  The primary error is conflating causal sufficiency with explanatory relevance. Students will think: "If balls determine balls, patterns do nothing." Intervene immediately after establishing physical closure. Clarify that "doing nothing" physically doesn't mean "useless" explanatorily. A second error is dualism: treating simms as separate entities floating above balls. Intervene when defining simms; emphasize they are *constituted* by balls, not added to them. A third error is anthropomorphism: assuming patterns need a "reader." Intervene when discussing symbol meaning; stress that causality exists regardless of observation. Address sufficiency vs. relevance before the resolution. Address dualism during the setup. Address anthropomorphism during the pattern definition. This prevents them from building a flawed mental model that requires later dismantling. Failure to intercept sufficiency confusion early renders the conclusion unintelligible. Students must distinguish between what pushes the balls and how we understand the pushing.

  Understanding Check (~90 words)
  Ask: "If a god paused the Careenium and rearranged the simmballs to preserve the simm patterns exactly, would the future evolution remain identical?" If they say yes, they missed physical closure. If they say no, they missed pattern stability. Nuance: Rearrangement is physically impossible, proving sufficiency, yet patterns remain the best predictive tool. This forces both truths: physics drives, patterns name. Ensure they articulate why the rearrangement is impossible before moving on. This question exposes hidden dualism. Use it. Listen for hesitation. Do not accept vague answers.

  Boundaries: What This Level Must Omit (~90 words)
  Explicitly exclude Gödelian self-reference loops. While central to Hofstadter's broader work, they confuse the specific causal question here. Omit theories of consciousness or qualia. This session is about causal architecture, not subjective experience. Avoid discussing neural networks or AI implementation details. Keep the focus strictly on the relationship between levels of description within a closed physical system. Introducing consciousness tempts students to smuggle in dualism via the "hard problem." Stick to the Careenium as a closed mechanical toy. Stay on metaphysics.

  Confidence and Least-Sure Point (~70 words)
  I am highly confident in this sequence because it mirrors Hofstadter's own pedagogical structure in *GEB* and *I Am a Strange Loop*. The least certain point is the whirlpool example's resilience. Some students might still view the whirlpool as merely epiphenomenal despite the analogy. It requires careful facilitation to ensure they see the constraint as causal relevance regarding efficacy.
