answer: |-
  Your recollection of Herodotus and Thucydides is accurate enough for this purpose. Herodotus presents competing *logoi* (accounts) often without resolving them; Thucydides explicitly filters for accuracy, acknowledges the distortion of memory and loyalty, and admits to reconstructing speeches to match the "general sense" of the occasion. You may proceed on that basis.

  Below is the procedure. It integrates your six items into a linear workflow.

  ### The Incident Historian's Procedure

  **Time Budget:** 20 minutes for Triage (Tests 1–4 only); 3 hours for Timeline (Tests 1–6).
  **Notation Key:** Use these tags in square brackets next to claims in your draft.
  *   `[OBS]` Instrumented observation (telemetry, logs).
  *   `[HUM]` First-person human observation ("I saw the screen flash").
  *   `[HEAR]` Report of a report (Support paraphrase, status page).
  *   `[INF]` Your inference or logical bridge.
  *   `[TPL]` Template boilerplate (required by form, not by fact).

  ---

  #### Test 1: Evidential Tagging (Item 1)
  *   **Question:** What is the direct source of this specific claim?
  *   **Sufficient Answer:** One of the five tags (`[OBS]`, `[HUM]`, `[HEAR]`, `[INF]`, `[TPL]`).
  *   **If Unavailable:** Default to `[HEAR]`. It is safer to under-trust than over-trust.
  *   **Failure Mode:** Systematically over-trusts `[OBS]`. Instrumentation can lie (buggy agents, dropped packets, stale dashboards).
  *   **Blunt Truth:** Most final timelines are `[INF]` and `[TPL]` masquerading as `[OBS]`. Tagging forces you to admit where the data ends and the story begins.

  #### Test 2: Access vs. Inference Split (Item 4)
  *   **Question:** Did the source *observe* the event, or did they *reason* that the event happened?
  *   **Sufficient Answer:** A sentence split into two claims: one tagged `[OBS]`/`[HUM]` (the data point) and one tagged `[INF]` (the conclusion).
      *   *Example:* "Database CPU spiked `[OBS]`" + "Therefore the database locked `[INF]`."
  *   **If Unavailable:** If the source fuses them (e.g., "The database locked due to CPU"), tag the whole sentence `[INF]`.
  *   **Rule for Confident Inference:** If a source has high `[OBS]` access (e.g., root access to the DB) but offers an `[INF]` claim, upgrade the `[INF]` to `[HUM]` *only if* they explicitly state they verified the mechanism. Otherwise, keep as `[INF]`.
  *   **Failure Mode:** Under-trusts expert intuition. An expert's "guess" is often better than a junior's "log," but the procedure treats them as logically equal until verified.

  #### Test 3: Contamination Check (Item 2)
  *   **Question:** Do these two agreeing reports share a common ancestor?
  *   **Sufficient Answer:** No identical phrasing, no identical timestamps, and no evidence of one party reading the other before reporting.
  *   **If Unavailable:** Assume contamination. If Report B arrived after Report A, and both describe a non-obvious symptom identically, treat Report B as `[HEAR]` of Report A, not independent confirmation.
  *   **Heuristic:** Look for "unique errors." If two customers report the same typo in an error message, it is one source. If they report the same *symptom* in different words, it is likely two sources.
  *   **Failure Mode:** Systematically under-trusts widespread outages. Real incidents often look identical because the failure mode is singular. This test may force you to treat a global outage as a single data point.

  #### Test 4: Incentive & Embarrassment Weighting (Item 3)
  *   **Question:** Does the reporter gain or lose status/capital by making this claim?
  *   **Sufficient Answer:**
      *   *Self-Blame:* Increase credibility slightly (costly signal), unless the blame is vague ("system glitch").
      *   *External-Blame:* Decrease credibility slightly (defensive), unless backed by `[OBS]`.
      *   *Vendor/Competitor:* Decrease credibility significantly (commercial incentive).
  *   **If Unavailable:** Assume defensive bias. Humans rarely volunteer fault without pressure.
  *   **Failure Mode:** Cynicism loop. If you discount all self-reports, you lose the only people who know the truth. If you accept all self-blame, you accept scapegoating.
  *   **Rule:** Accept specific self-blame (`"I merged PR #402"`). Reject vague self-blame (`"Our service acted up"`).

  #### Test 5: Genre Filtering (Item 5)
  *   **Question:** Is this sentence required by the document type or by the event?
  *   **Sufficient Answer:** Remove sentences that would appear even if the incident hadn't happened (e.g., "We followed standard escalation procedures" in a runbook; "We value our customers" in a vendor RCA).
  *   **If Unavailable:** Tag as `[TPL]`.
  *   **Failure Mode:** Discards procedural evidence. Sometimes *how* a team followed the runbook is the cause.
  *   **Rule:** Keep timestamps and actions. Discard values, mission statements, and "lessons learned" platitudes during reconstruction.

  #### Test 6: Narrative Marking (Item 6)
  *   **Question:** Can the reader distinguish fact from connective tissue?
  *   **Sufficient Answer:** Use *italics* for `[INF]` (inference/connective tissue) and **bold** for `[OBS]`/`[HUM]` (attested facts).
  *   **If Unavailable:** If the document becomes unreadable, add a "Confidence Key" at the top: "Sections marked *italics* are reconstructed based on available evidence."
  *   **Executive Skim Rule:** Executives read the Summary and the "Root Cause" line. Ensure the Summary contains the tags. If the tags make it ugly, they will ignore it.
  *   **Decision:** Keep the tags. An ugly truth is better than a smooth lie. If executives ignore the tags, they are buying a story, not a timeline. Your job is to sell the timeline.

  ---

  ### Case Studies

  #### Case (a): 3 A.M. Triage
  **Signals:** Customer A (Shared Channel), Dashboard Flatline (Redeployed Service), Customer B (40 mins later, read Customer A), Support (Paraphrase).
  **Time:** 20 Minutes.

  1.  **Tagging:**
      *   Customer A: `[HUM]` (They feel pain).
      *   Dashboard: `[OBS]` (But instrumented).
      *   Customer B: `[HEAR]` (Contaminated by A).
      *   Support: `[HEAR]` (Paraphrase).
  2.  **Access Split:**
      *   Dashboard says "Flat." Inference: "Service Down."
      *   *Correction:* Service was redeployed 1 hour ago. New version might not emit metric. Dashboard `[OBS]` is valid; Inference "Service Down" is `[INF]`.
  3.  **Contamination:**
      *   Customer B is not independent. Treat as 1 data point.
  4.  **Incentive:**
      *   Customer wants fix. High urgency, low technical accuracy.
  5.  **Decision:**
      *   **Page.**
      *   **Why:** The Procedure overrides the gut. Gut says "We just deployed, it's probably monitoring drift." Procedure says "One `[HUM]` + One `[OBS]` (even if ambiguous) = Potential Incident."
      *   **Reasoning:** False positives cost pages. False negatives cost SLAs and trust. The redeployment event increases the prior probability of breakage. The flatline is suspicious *because* of the redeploy.
      *   **Action:** Page on-call. Note in ticket: "Dashboard ambiguous due to redeploy. Validated by Customer A."

  #### Case (b): Vendor RCA vs. Telemetry
  **Signals:** Vendor RCA (6 weeks later, blames us), Our Telemetry (1-min granularity, contradicts Vendor).
  **Time:** 3 Hours (Timeline Construction).

  1.  **Tagging:**
      *   Vendor RCA: `[HEAR]` (It is their report of their internal findings).
      *   Telemetry: `[OBS]`.
  2.  **Access Split:**
      *   Vendor Engineers: `[HUM]` (Were on call, real-time).
      *   Telemetry: `[OBS]` (Sampled, 1-min).
  3.  **Contamination:**
      *   Vendor RCA is a single source.
  4.  **Incentive:**
      *   Vendor: Minimize their liability. Blaming us is high value for them.
      *   Us: Minimize our liability.
  5.  **Genre:**
      *   Vendor RCA is a legal/PR document first, technical second. Strip `[TPL]` ("We regret the inconvenience").
  6.  **Reconstruction:**
      *   **Timeline Entry:** "14:02 Vendor reports trigger in our component `[HEAR]`. 14:00–14:05 Our telemetry shows normal load `[OBS]` (1-min granularity)."
      *   **Narrative:** "*Vendor engineers observed behavior consistent with our component failure, though our sampled telemetry does not capture the spike.*"
      *   **Verdict:** Trust the real-time human access (`[HUM]`) over the sampled automation (`[OBS]`) regarding *existence* of the event, but trust the automation regarding *metrics*.
      *   **Final Cause:** "External trigger from Vendor X. Mechanism obscured by telemetry sampling gap."

  #### Case (c): The Senior Engineer's Memory
  **Signals:** Senior Engineer Recollection (5 weeks later, no logs), Team Consensus (Nods).
  **Time:** 3 Hours (Timeline Construction).

  1.  **Tagging:**
      *   Engineer Recollection: `[HUM]` (Observation of memory) -> effectively `[INF]` (Reasoning about past).
      *   Team Consensus: `[HEAR]` (Social agreement).
  2.  **Access Split:**
      *   Engineer claims: "I know it was the cache."
      *   Split: "I remember the cache being high" (`[HUM]` - memory) + "Therefore cache caused it" (`[INF]`).
  3.  **Contamination:**
      *   Team consensus is contaminated by the Senior Engineer's status.
  4.  **Incentive:**
      *   Senior Engineer: Protect team reputation, close the ticket.
      *   Team: Go home, stop talking about the incident.
  5.  **Genre:**
      *   Post-Mortem requires a "Root Cause." This is `[TPL]` pressure.
  6.  **Reconstruction:**
      *   **Do not write a cause.** Write a status.
      *   **Document Language:** "Root Cause: **Undetermined**. Leading Hypothesis: Cache exhaustion `[INF]` (Source: Senior Engineer Recollection `[HUM]`, 5 weeks post-incident). Evidence: No logs retained. Corroboration: Team consensus `[HEAR]`."
      *   **Executive Survival:** Executives want closure. Give them closure on the *process*, not the *bug*. "We have implemented log retention to prevent this ambiguity in future." This satisfies the need for action without lying about the past.

  ---

  ### Limits of the Procedure

  **Load-Bearing vs. Academic**
  *   **Load-Bearing:** Test 1 (Tagging) and Test 3 (Contamination). If you do nothing else, tag your sources and stop counting contaminated reports as independent. This prevents the most common errors (echo chambers and automation bias).
  *   **Academic:** Test 6 (Narrative Marking). If your team refuses to read italics, this fails. It is the first thing to discard if adoption stalls, though it is the most intellectually honest.

  **The Untranslatable Distinction**
  *   **Herodotus's *Logoi* vs. Engineering "Tickets":** In history, conflicting accounts are preserved forever. In engineering, the Jira ticket *must* be closed. The procedure cannot survive the organizational pressure to "resolve" a ticket. You will be forced to convert `[INF]` into `[OBS]` to satisfy management. The procedure limits this, but cannot stop it.

  **Confident Wrong Timelines**
  *   **The "Silent Failure" Mode:** This procedure relies on *available* evidence. If a component fails without logging (`[OBS]`), without customers complaining (`[HUM]`), and without engineers noticing (`[HUM]`), the procedure will correctly state "No Evidence." However, if a Senior Engineer *guesses* the cause (Test 4), the procedure may legitimize that guess as a "Leading Hypothesis." If the guess is wrong, you have now published a confident wrong timeline wrapped in honest tags.
  *   **Sampling Bias:** Test 2 (Contamination) assumes reports are independent unless proven otherwise. In a global outage, reports are correlated by the physics of the failure, not just social contamination. The procedure may under-count the severity of a widespread event because it treats identical reports as a single source.

  **Judgment Calls Dressed as Procedure**
  1.  **Test 4 (Incentive):** Deciding if self-blame is "specific" or "vague" is subjective. You decide what counts as a costly signal.
  2.  **Test 6 (Narrative):** Deciding how much connective tissue (`[INF]`) is needed to make the document readable is a writing choice, not a logical one.
  3.  **Case A (Paging):** The decision to page on ambiguous telemetry is a risk tolerance call, not a factual derivation. The procedure recommends paging, but *you* set the threshold for "enough" evidence.

  **Final Warning:** This procedure makes you slower. It makes you doubt. In a crisis, doubt is a luxury. Use the full six tests for the Post-Incident Report. Use only Tests 1, 2, and 4 for Triage. If you try to run Test 6 at 3 A.M., you will fail.
