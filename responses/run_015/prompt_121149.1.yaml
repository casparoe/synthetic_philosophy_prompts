      *   **Extras:** Identify specific philosophical difficulties (tracing causes, metric of equality, endogenous preferences) for hard cases. Suggest clause rewrites if necessary.

  2.  **Deconstruct Luck Egalitarianism (LE):**
      *   *Brute Luck:* Unchosen circumstances (genetics, birthplace, unforeseen accidents). -> Compensate.
      *   *Option Luck:* Deliberate gambles/choices where outcomes are uncertain but accepted. -> Do not compensate.
      *   *Key Tensions:*
          *   What counts as a "choice"? (Information availability, cognitive capacity, alternatives).
          *   What counts as a "gamble"? (Is taking a job a gamble? Is developing a taste a gamble?).
