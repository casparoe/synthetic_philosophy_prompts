          *   *Reasoning:* Hard case. Choices are hers, but the *capacity* to choose well is brute luck. LE struggles here. Let's split the difference. 6.

      *   **Case 6: Otto (Expensive Tastes).**
          *   *Analysis:* Deliberately cultivated expensive taste. Dworkin's classic example. LE usually says no compensation for voluntarily acquired expensive tastes.
