      *Re-evaluating Dana:* If her judgment is "terrible" due to genes/upbringing, is she responsible? Cohen/Dworkin might differ. But generally, if the *capacity* for responsibility is impaired by brute luck, compensation is due. However, it's hard to measure. I'll give it a 5 or 6. Let's go 6 to acknowledge the brute luck component of her psychology.

