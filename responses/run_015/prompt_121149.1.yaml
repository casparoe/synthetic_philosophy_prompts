          *   *Score:* 10.
          *   *Reasoning:* Pure brute luck, no agency involved.

      *   **Case 2: Marco (Lottery).**
          *   *Analysis:* Classic option luck. Bought a ticket knowingly. Fair odds.
          *   *Score:* 0.
          *   *Reasoning:* Deliberate gamble with known risks.

      *   **Case 3: Ines (Commission Job).**
