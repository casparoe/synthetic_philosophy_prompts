  # Activity Design: The Epistemic Centipede

  ## 1. Overview & Logistics
  *   **Time:** 75 Minutes.
  *   **Participants:** 12 Students (6 Pairs).
  *   **Materials:**
      *   6 Printed "Visible Payoff Trees" (one per pair).
      *   12 Sealed "Type Cards" (distributed 4 of each type: Myopic, 1-Step, Full-BI).
      *   12 Decision Record Sheets (one per student).
      *   1 Master Scoreboard (projected or whiteboard).
      *   Pens.
  *   **Room Setup:** 6 tables or desk-clusters arranged so pairs cannot overhear each other.

  ## 2. The Visible Payoff Tree
  Display this prominently. This is the **Common Knowledge** baseline. The pot increases linearly. At any node, the active player may **Take** (split the pot and end the round) or **Continue** (pass to the next node).

  | Node | Active Player | Option: TAKE (Ends Round) | Option: CONTINUE (Next Node) |
  | :--- | :--- | :--- | :--- |
  | **1** | Player 1 | **Player 1:** 4 pts <br> **Player 2:** 4 pts | Proceed to Node 2 |
  | **2** | Player 2 | **Player 1:** 6 pts <br> **Player 2:** 6 pts | Proceed to Node 3 |
  | **3** | Player 1 | **Player 1:** 8 pts <br> **Player 2:** 8 pts | Proceed to Node 4 |
  | **4** | Player 2 | **Player 1:** 12 pts <br> **Player 2:** 12 pts | **Auto-End:** (12, 12) |

  *Note: Visually, "Continue" is always dominant for mutual gain. There is no visible mathematical incentive to Take early. The incentive is hidden.*

  ## 3. Hidden Reasoning Types (The Twist)
  Each student receives one sealed Type Card at the start. They keep it hidden from their partner. They **know their own type** but **do not know their partner's type**. They know the **population distribution** (4 of each type among the 12 students).

  The Type Card contains a **Secret Payoff Modifier** that applies *only* to them. These modifiers are **not revealed until the post-game debrief**.

  *   **Type A: Full Backward-Inductor (4 Students)**
      *   *Secret Incentive:* +10 Points if you **Take at Node 1**. (0 bonus otherwise).
      *   *Logic:* You are compelled to end the game immediately to secure your private bonus.
  *   **Type B: 1-Step Strategist (4 Students)**
      *   *Secret Incentive:* +10 Points if you **Take at Node 2 or 3**. (0 bonus otherwise).
      *   *Logic:* You want the game to survive the first move, but you are compelled to defect before the end.
  *   **Type C: Myopic Cooperator (4 Students)**
      *   *Secret Incentive:* +10 Points if the **Round Reaches Node 4** (regardless of who Takes).
      *   *Logic:* You are compelled to Keep the game alive as long as possible.

  ## 4. Facilitator Instructions

  ### Phase 1: Setup & Assignment (15 Minutes)
  1.  **Grouping:** Divide the class into 6 pairs. Assign roles: Player 1 (moves at Nodes 1 & 3) and Player 2 (moves at Nodes 2 & 4).
  2.  **Distribution:** Hand out the Sealed Type Cards. Instruct students: *"Open this quietly. Do not show your partner. This card changes your personal scoring for this game. You know your type; you do not know your partner's. You know there are 4 of each type in the room."*
  3.  **Rules:** Explain the Visible Tree. Emphasize that the **Visible Points** are awarded to *both* players based on the outcome, but their **Private Bonus** (unknown to the partner) is added to their personal total only.
  4.  **Rounds:** The game will be played **3 Times** with the same partner and the **Same Type Card**. This allows "reputation" to form, but since Types are hidden, reputation is noisy.

  ### Phase 2: Gameplay (30 Minutes)
  *   **Round 1 (10 mins):** Pairs play. Students record their decision and the outcome on their Record Sheet. Collect the sheets.
  *   **Round 2 (10 mins):** Remind them: "Your Type Card is the same. Your partner's Type Card is the same. You now have one round of history." Play.
  *   **Round 3 (10 mins):** Final round. "Maximum points are at stake." Play.

  ### Phase 3: Revelation & Scoring (10 Minutes)
  1.  Ask students to reveal their Type Cards to their partners.
  2.  Reveal the **Secret Payoff Modifiers** on the board (the +10 rules listed above).
  3.  Calculate final scores (Visible Points + Private Bonuses).
  4.  Announce the pair with the highest combined score.

  ### Phase 4: The Debrief (20 Minutes)
  Guide the discussion using the following mapping. Do not lecture; ask questions that force them to reconstruct the logic.

  **Step 1: Map the Defection.**
  *   *Ask:* "Look at the pairs that ended at Node 1. Player 1, why did you Take?"
  *   *Expected Answer:* "I was Type A" OR "I thought my partner might Take at Node 2, so I secured points early."
  *   *Philosophical Link:* This is the **First Link** in the backward induction chain. In the textbook, Player 1 Takes because they *know* Player 2 is rational. Here, Player 1 Takes because they *fear* Player 2 might be Type A or B.

  **Step 2: Map the Unraveling.**
  *   *Ask:* "Look at the Type C (Cooperator) players. Did any of you Take early despite wanting to reach Node 4?"
  *   *Expected Answer:* "Yes, because I didn't know if my partner was Type A. If they were, they'd Take at Node 1. If I Pass, I risk getting nothing (or less) if they defect."
  *   *Philosophical Link:* This is the **Collapse of Cooperation**. In the standard paradox, Common Knowledge of Rationality (CKR) forces Type C to defect. In this activity, **Uncertainty of Type** forces Type C to defect. The outcome (defection) is the same, but the epistemic cause is different.

  **Step 3: The Second-Guessing Loop.**
  *   *Ask:* "Player 2, if you reached Node 2, why did you Take? Why not pass to Node 3?"
  *   *Expected Answer:* "I knew Player 1 passed Node 1, so they aren't Type A. But they could be Type B (waiting to Take at Node 3). If I Pass, they Take at Node 3, and I miss my chance."
  *   *Philosophical Link:* This mirrors the **Backward Induction Step**. Player 2 reasons backward from Player 1's potential future move. The "Hidden Type" acts as a proxy for "Rationality." You aren't sure if they are rational (Type A), so you pre-empt them.

  ## 5. Honest Note on Limitations
  *Facilitator Script:*
  "We must be precise about what this activity achieved versus the standard textbook paradox.
  In the standard Centipede Game, the collapse of cooperation is driven by **Common Knowledge of Rationality**. If we *both know* we are both perfectly rational, logic dictates we defect immediately.
  In this activity, the collapse was driven by **Incomplete Information**. You defected because you were *unsure* of my type. If you had *known* I was a Type C Cooperator, you would have cooperated.
  Therefore, this activity simulates the *phenomenology* of the paradox (the unraveling), but it substitutes **Epistemic Uncertainty** for **Common Knowledge**. In the real world, this is often more accurate: we defect not because logic forces us to, but because we cannot be sure the other person won't."

  ## 6. Prediction of Failure Modes
  **The "Poker" Trap:**
  Students may treat the game as a bluffing contest rather than an induction problem.
  *   *Symptom:* A Type C (Cooperator) pretends to be Type A (Defector) in Round 1 to scare their partner, hoping to cooperate in Round 2.
  *   *Impact:* This muddies the debrief. It shifts the focus from "What is rational?" to "How well can I lie?"
  *   *Mitigation:* In the debrief, explicitly separate "Strategic Bluffing" from "Belief-Based Induction." Ask: "Did you Take because you wanted to bluff, or because you genuinely believed your partner would Take?"

  **The "Type-Determinism" Trap:**
  Students may assume their Type *forces* their move (e.g., "I'm Type A, I *must* Take").
  *   *Symptom:* No strategic reasoning occurs; students just follow their card instructions.
  *   *Impact:* The "Paradox" vanishes because there is no decision to make.
  *   *Mitigation:* Emphasize in the rules: "The Type gives you a bonus, it does not force your hand. You are free to maximize your total points however you choose." (A Type A player *could* theoretically Pass if they think the Visible Points at Node 4 outweigh their Private Bonus, though the math discourages it).

  ## 7. Conceptual Mapping Summary
  | Standard Centipede Concept | This Activity's Mechanism |
  | :--- | :--- |
  | **Common Knowledge of Rationality** | **Common Knowledge of Type Distribution** |
  | **Deductive Certainty** (I know you will Take) | **Probabilistic Belief** (I think you might Take) |
  | **Backward Induction Chain** | **Pre-emptive Defection based on Risk** |
  | **Paradox:** Rationality kills gain | **Paradox:** Uncertainty kills gain |
  | **Solution:** Disrupt Common Knowledge | **Solution:** Signal Type (cheap talk) or Repeat Game |

  This design ensures students *feel* the pressure of the backward-induction logic without needing to perform the recursive math, grounding the abstract paradox in the tangible anxiety of not knowing their partner's incentives.
