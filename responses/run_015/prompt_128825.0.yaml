      *   *Kahneman's Outside View vs. Inside View:* This is the most practical framework.
      *   *The Principle:* **Use the narrowest class that is both causally relevant and statistically stable.**
      *   *Rule 1 (Relevance):* Does the characteristic change the mechanism of the outcome? (Smoking changes heart risk; Birthdays don't change lottery odds).
