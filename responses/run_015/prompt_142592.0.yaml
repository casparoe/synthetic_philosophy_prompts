answer: |-
  Here is the stress test you asked for. I am going to treat your position as a live hypothesis and try to break it.

  ### 1. The Ranking of Defeaters

  You asked to rank the defeaters from fatal to merely awkward.

  **Fatal: The Indeterminacy Objection (Your Worry #2)**
  This is the real killer, and it is more fundamental than the symmetry worry. You are treating the cluelessness argument as a claim about *values* (the sum of future effects is zero) when it is actually a claim about *epistemic access* (you cannot form a rational probability distribution over future effects).

  If the problem is indeterminacy, your "ratchet" move fails because asserting a ratchet requires assigning a probability to the direction of the lock-in. To say "extinction is a negative ratchet" is a value judgment, but to say "Act A increases the probability of extinction relative to Act B" is an empirical prediction that runs straight into the cluelessness wall. If the causal chains are too chaotic to forecast, you cannot rationally assign a credence >0.5 to the ratchet pointing "up" rather than "down."

  If you cannot assign a distribution, you cannot calculate an expected value. If you cannot calculate an expected value, it doesn't matter if the theoretical mean is zero or positive; the *decision-theoretic* output is undefined. You haven't solved the calculation problem; you've just asserted that the variables in the equation are non-zero without showing how to solve for them. This is fatal because it renders your "empirical question" unaskable.

  **Severe: The Differential Ratchet Problem (The Third Problem)**
  Even if we grant that ratchets exist and are not symmetric (e.g., extinction is bad), the cluelessness argument survives if the *difference* between your options is still inscrutable.

  Consequentialism requires comparing Act A to Act B. Suppose both acts have massive, locked-in, positive ratchet effects. Suppose Act A locks in a +1000 value institution, and Act B locks in a +1005 value institution. But suppose your epistemic access to *which* ratchet you are triggering is noisy with a standard deviation of ±1,000,000.

  The existence of a non-zero ratchet doesn't help you choose between options unless the ratchet is *differentially* triggered by your specific choice in a predictable way. Most "ratchets" (like the survival of humanity, the development of AI, the stability of liberal democracy) are macro-historical forces. It is highly plausible that your specific local choice (donate to Charity A vs. Charity B) does not meaningfully shift the probability of the macro-ratchet engaging. If the ratchet is determined by forces downstream of your agency, the expected value of your act relative to the alternative collapses back to zero, regardless of the absolute value of the ratchet.

  **Awkward: The Symmetry of Ratchets (Your Worry #1)**
  This is less damaging than you fear, but still annoying. You worry that good ratchets and bad ratchets cancel out. A sympathetic defender of your view would concede this is possible but wave it off as unlikely to be *perfectly* symmetric. They would argue that while we can't sum them perfectly, we can identify *asymmetries* (e.g., existential risks are clearly negative ratchets with no obvious positive counterpart of equal magnitude).

  However, the opponent will press that "bad ratchets" are often just "good ratchets viewed from a different value system" (e.g., a stable global government prevents war but locks in tyranny). This doesn't kill your view, but it forces you into contentious value theory to establish the "direction" of the ratchet, which weakens your claim that this is a straightforward empirical fix.

  ### 2. Is the Symmetry Premise Load-Bearing?

  You asked for something showing that the symmetry premise isn't load-bearing at all. Here it is:

  **The argument survives your denial because the "commonsense collapse" moral does not require the long-term term to be zero; it only requires the long-term term to be *comparatively inert*.**

  The standard argument goes:
  1.  Long-term effects dominate value.
  2.  We are clueless about long-term effects.
  3.  Therefore, we cannot rank acts based on long-term effects.
  4.  Therefore, we must rank acts based on short-term effects (commonsense).

  Your counter is: "Premise 2 is false because ratchets give us a directional signal."

  The rebuttal is: "Premise 2 is not about the *mean* of the distribution; it is about the *variance* relative to the signal."

  Even if the long-term expected value is massively positive (due to ratchets), if the *uncertainty interval* is wider than the difference between your options, you still cannot rank the options. If Act A and Act B both trigger positive ratchets, but you don't know which triggers the *larger* one, the long-term term drops out of the *comparison*, even if it doesn't drop out of the *absolute value*.

  The symmetry premise is a heuristic used to explain *why* the term drops out (it cancels to zero), but it is not the engine of the argument. The engine is **inscrutability of the difference**. You can deny symmetry, assert a massive positive bias, and still be unable to make a decision if you can't predict which action captures more of that bias. The cluelessness argument does not need the future to be neutral; it only needs your leverage over the future to be indistinguishable across options.

  ### 3. The "Maximize Relative to Evidence" Reply

  You asked whether this reply undercuts the debate or changes the subject.

  **It changes the subject, and in a way that hurts your position.**

  The cluelessness objection is typically an objection to the *rationality* of forming the credences required to maximize expected value. It claims that in long-term contexts, there is *no* evidence that supports a specific probability distribution over outcomes.

  If you reply, "Just maximize relative to your evidence," the objector replies, "My evidence supports *no* distribution."

  If you then say, "Your evidence supports a 'ratchet up' distribution," you are making a substantive epistemic claim that the objector denies. You are not solving the normative problem; you are disputing the empirical premise.

  This reply undercuts the debate only if you redefine "evidence" to include "philosophical hunches about ratchets." If you do that, you have made consequentialism unfalsifiable (see below). If you keep "evidence" strict (data, causal models), the reply fails because the cluelessness argument asserts that strict evidence runs out after the near term.

  So, the "maximize relative to evidence" move is a solution only if the problem was "people are afraid to guess." It is not a solution if the problem is "guessing is epistemically bankrupt." The cluelessness argument claims the latter.

  ### 4. Unfalsifiability and Testability

  You asked if "ratchets point up" is compatible with almost any evidence, and if that matters.

  **Yes, it is compatible with almost any evidence, and yes, that is a problem.**

  If the ratchets are mostly invisible (centuries downstream), you cannot verify your claim *ex post* within a timeframe that allows for learning. If you claim "founding this institution creates a positive ratchet," and 50 years later it looks oppressive, you can say "wait, the long-term ratchet hasn't unlocked yet." If 50 years later it looks benevolent, you say "see, the ratchet worked."

  This makes your position action-guiding only in a vacuous way. To guide action, you need to distinguish between "Act A creates a positive ratchet" and "Act B creates a positive ratchet." If the mechanism of the ratchet is opaque, you cannot distinguish them.

  **Is this a problem for a claim of this kind?**
  Yes, because you are presenting this as a fix to a decision-theoretic paralysis. If the fix relies on variables that cannot be measured or verified at the time of decision, it does not cure the paralysis; it just gives you a vocabulary to describe your leap of faith.

  A sympathetic defender would concede that *specific* ratchet claims (e.g., "this specific law will stabilize society") are falsifiable but likely false due to complexity. They would wave off the falsifiability of the *general* claim ("ratchets exist") by arguing it is a structural feature of causality, not an empirical generalization.

  But this is weak. If the general claim ("ratchets bias up") is not falsifiable, it functions as a dogma. If it is falsifiable, it is likely false (see: history). You are caught between a dogma that doesn't help you choose and an empirical claim that history undermines.

  ### 5. Summary of the Stress Test

  1.  **Your diagnosis of the symmetry premise is incorrect.** The argument does not rely on the long-term mean being zero; it relies on the long-term *difference* between acts being inscrutable. You can have a massive positive mean and still be clueless about which act produces more of it.
  2.  **Indeterminacy is the fatal flaw.** If you cannot assign probabilities to the ratchet direction, you cannot plug it into an expected value calculation. Asserting "it's not zero" is not a calculation.
  3.  **The "Maximize Evidence" reply is a dodge.** It assumes you have evidence to maximize over. The cluelessness argument says you don't.
  4.  **Unfalsifiability is a bug, not a feature.** If you can't verify the ratchet direction at the time of choice, you haven't solved the decision problem; you've just renamed the uncertainty.

  **Verdict:** You have successfully identified that the "symmetry" assumption is often lazily stated by critics. However, you have not successfully identified the load-bearing wall. The wall is not "the future averages to zero," it is "your leverage over the future is indistinguishable across options." Your ratchet theory attacks the value of the future, but the cluelessness argument is about the *comparability* of your actions upon the future. You can grant everything you said about ratchets and still be left with no way to decide between Act A and Act B.
