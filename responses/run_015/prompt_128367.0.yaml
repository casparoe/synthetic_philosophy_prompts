answer: |-
  # JOINT STATEMENT ON METHODOLOGICAL SCALE AND ARCHIVAL EPISTEMOLOGY

  **Date:** October 26, 2023
  **Signatories:** [Name], Proponent of Fragmentist Microhistory; [Name], Proponent of Structuralist Macrohistory

  ### I. AGREED CLAIMS

  We, the undersigned, acknowledge that while our methodological priorities diverge, we share a common commitment to historical rigor and the ethical implications of representing the past. We explicitly agree upon the following propositions:

  1.  **The Nature of the Archive:** State archives are not neutral repositories of fact. They are technologies of governance produced through processes of selection, categorization, and exclusion. Both sides agree that archival silence is not merely an absence of data but often an active product of administrative power.
  2.  **The Limits of Aggregation:** Statistical aggregation inevitably flattens heterogeneity. We agree that quantitative series cannot fully capture the phenomenological texture of lived experience, nor can they account for the semantic shifts in how historical actors understood their own actions.
  3.  **The Limits of Singularity:** Conversely, we agree that a singular archival trace, no matter how thickly described, cannot definitively establish systemic causation on its own. An individual biography cannot serve as a proxy for a population without risking the ecological fallacy.
  4.  **Causal Inference:** Both methods face distinct causal blind spots. Microhistory struggles to distinguish between typical and atypical behavior without external benchmarks; macrohistory struggles to distinguish between correlation and mechanism without internal narrative. Neither method possesses a monopoly on causal truth.
  5.  **Political Stakes:** We agree that historical methodology is not politically neutral. The choice of scale determines which forms of suffering and agency become visible. Both sides aim to produce knowledge that resists historical erasure, though we disagree on the optimal mechanism to achieve this.

  ### II. PRECISE DISAGREEMENTS

  The following table delineates the exact points of divergence. Each description is phrased to be acceptable to the proponent of that view.

  | Domain of Inquiry | Fragmentist (Microhistorical) Position | Structuralist (Macrohistorical) Position |
  | :--- | :--- | :--- |
  | **Primary Unit of Analysis** | The singular trace (e.g., a specific petition, a trial transcript, a letter) is the irreducible unit of historical truth. | The aggregate pattern (e.g., trends in legislation, demographic shifts, institutional budgets) is the irreducible unit of historical truth. |
  | **Function of the Archive** | The archive is a site of "categorical violence" where subaltern agency is systematically distorted; the historian's duty is to excavate traces that resist this categorization. | The archive is an imperfect but indispensable dataset; the historian's duty is to correct for bias through scalable inference to track institutional transformation. |
  | **Epistemic Priority** | **Depth over Breadth:** Thick description is epistemically necessary because aggregation reproduces the exclusions of the state. | **Breadth over Depth:** Scalable aggregation is politically necessary because singular studies risk becoming inconsequential anecdotes. |
  | **Treatment of Anomalies** | Anomalies are signals. They reveal the limits of the system and the presence of agency that the system could not fully capture or suppress. | Anomalies are noise. They must be smoothed or modeled to reveal the underlying structural logic that governs the majority of cases. |
  | **Definition of Agency** | Agency is located in the gap between the subject's intent and the state's categorization of that subject. | Agency is located in the capacity of groups to alter institutional constraints over time, measurable through systemic outcomes. |

  ### III. CRUXES AND TESTABLE PREDICTIONS

  To move beyond theoretical impasse, we identify two specific cruxes where our positions yield different expectations of the evidence. We agree to examine the specified historical cases to evaluate these predictions.

  #### Crux 1: Scalar Invariance of Agency
  **The Question:** Do concepts like "resistance" or "agency" retain a coherent meaning when translated from individual biography to collective or state-level processes?

  *   **Fragmentist Position:** **No.** "Resistance" is not a scalar invariant. An act that constitutes resistance at the individual level (e.g., foot-dragging, semantic subversion) may disappear entirely at the aggregate level, or conversely, aggregate "revolts" may obscure the lack of individual consent. Meaning is context-bound and fractures across scales.
  *   **Structuralist Position:** **Yes.** For historical concepts to be analytically useful, they must maintain functional coherence across scales. If "resistance" cannot be aggregated to explain institutional change, it is a psychological description, not a historical explanation.
  *   **Test Case:** **Manumission Petitions in 18th-Century French Colonial Courts.**
      *   *Evidence Class:* A dataset of 500 petition records compared against five specific cases where the language of the petition diverged sharply from legal norms.
      *   **Fragmentist Prediction:** Close reading of the five divergent cases will reveal forms of legal agency (e.g., manipulating kinship definitions) that are invisible in the aggregate dataset because the dataset codes them as "denied" or "standard." The aggregate will show stasis; the micro will show active subversion.
      *   **Structuralist Prediction:** The five divergent cases will prove statistically irrelevant to the overall trajectory of manumission rates. The aggregate data will show that institutional constraints (e.g., tax laws, property rights) determined outcomes regardless of individual rhetorical agency. The micro-details will not alter the causal model of the system.

  #### Crux 2: The Epistemic Status of the Outlier
  **The Question:** Should an archival outlier (a single anomalous petition or fragmentary court record) be treated as noise to be smoothed by macro-analysis or as the visible trace of structural violence that aggregation hides?

  *   **Fragmentist Position:** **Trace of Violence.** The outlier is often the point where the state's categorization machinery failed or was forced to reveal its coercive nature. Smoothing it erases the specific mechanism of exclusion.
  *   **Structuralist Position:** **Noise.** The outlier represents variance that obscures the signal. Relying on it leads to selection bias. Systemic change is only visible when outliers are accounted for as error margins.
  *   **Test Case:** **The 1890 U.S. Census "Mulatto" Category Anomaly.**
      *   *Evidence Class:* The specific enumeration instructions regarding racial categorization in 1890 compared to individual enumeration sheets in a single Southern county where the "Mulatto" category spiked disproportionately against regional trends.
      *   **Fragmentist Prediction:** The anomaly in the specific county is not an error but a trace of local enumerator discretion or community self-identification that the federal aggregate suppressed in later reports. Analyzing the specific sheets will reveal a mode of racial negotiation that the national aggregate erases.
      *   **Structuralist Prediction:** The county-level spike is an enumeration error or local idiosyncrasy (noise) that correlates with no broader legislative or social shift. Relying on it to explain racial formation would lead to a false causal inference. The national aggregate, which smooths this spike, correctly identifies the hardening of the binary color line.

  ### IV. COMMITMENT TO ADJUDICATION

  We agree that if the Fragmentist prediction holds in the Test Cases (i.e., if micro-analysis reveals causal mechanisms or forms of agency that macro-analysis structurally cannot detect and which materially alter the historical narrative), the Structuralist position must concede that aggregation is insufficient for a complete account of subaltern agency.

  Conversely, if the Structuralist prediction holds (i.e., if the micro-details prove to be idiosyncratic noise that fails to connect to broader institutional transformations, and the aggregate models successfully predict outcomes the micro-studies miss), the Fragmentist position must concede that thick description alone is insufficient for explaining systemic change.

  We sign this document to hold ourselves accountable to these terms.

