answer: |-
  **PREAMBLE: LOGICAL AXES**

  Five axes define the space. (1) *Ontology:* Is welfare occurrent experience, global judgment, or objective list? (2) *Epistemology:* Does self-report access truth or produce noise? (3) *Comparability:* Are scores ordinal-comparable across populations and modes? (4) *Normative I:* Should the state maximize citizen welfare levels? (5) *Normative II:* Should the state maximize relative international ranking?

  Axes 1–3 are descriptive; 4–5 are normative. All are logically independent. One can believe the ladder measures noise (2) but still want to climb the ranking (5) for political reasons. One can believe the ladder measures truth (2) but refuse to promote it (4) on liberal grounds. Conflating these creates the workshop's central confusion.

  ***

  **DOCUMENT 1: PARTICIPANT HANDOUT**

  **Decision Tree: The Life-Evaluation Item**

  Answer sequentially. Record your path (e.g., 1Y-2N).

  **Q1. The Wording Pilot.**
  In a pilot, the same sample scored 1.4 points higher when the ladder top was "best life you could hope for" versus "best possible life."
  *   **Yes:** This sensitivity invalidates the score as a stable measure. (Go to Q2)
  *   **No:** This sensitivity reflects legitimate nuance in judgment; the score remains valid. (Go to Q3)

  **Q2. The Mode Shift.**
  A country gains two ranking places by moving surveys from face-to-face to telephone interviews, with no change in anyone's life.
  *   **Yes:** This is a win; the ranking is a public scoreboard and opacity is worse than distortion. (Stop: **Position A**)
  *   **No:** This is artifact; cross-country comparison is impossible if modes differ. (Go to Q3)

  **Q3. The Recession Scar.**
  A population endured a severe recession, recovered economically within a decade, and reported lower ladder scores than a comparable population that never suffered the shock.
  *   **Yes:** The scores reflect real scarring; comparisons are valid but show lasting harm. (Go to Q4)
  *   **No:** The scores reflect adapted expectations; cross-population comparison is not ordinal-comparable. (Stop: **Position B**)

  **Q4. The District Target.**
  A district office given an annual happiness target is subsequently measured as having met it.
  *   **Yes:** This is success; the state should raise citizens' happiness. (Go to Q5)
  *   **No:** This is gaming; the measure is a tolerable diagnostic and a corrupting target. (Stop: **Position C**)

  **Q5. The Moment.**
  Research suggests affect measured close to the moment is the only honest target; retrospective ladder items are confabulation.
  *   **Yes:** We should track affect, not ladder scores. (Stop: **Position D**)
  *   **No:** The ladder measures something real but is not happiness; it is nonetheless the best political indicator available. (Stop: **Position E**)

  **Q6. The Liberal Constraint.**
  *   **Yes:** The state should track happiness but not promote it, because promotion violates the separateness of persons' own judgments about what makes a life go well. (Stop: **Position F**)
  *   **No:** (Return to Q5 logic or default to Promotion).

  *(Note: Paths converge based on facilitator mapping in Document 2.)*

  ***

  **DOCUMENT 2: FACILITATOR KEY & ANALYSIS**

  **Position Key**

  *   **Position A (Scoreboard Prioritarian):** Answers Q2-Yes. Believes ranking opacity is worse than distortion. Aim: Top the ranking.
  *   **Position B (Incomparability Skeptic):** Answers Q3-No. Believes adaptation renders scores non-ordinal across populations. Aim: No cross-country policy.
  *   **Position C (Goodhart Skeptic):** Answers Q4-No. Believes measures corrupt when targeted. Aim: Tolerable diagnostic, corrupting target.
  *   **Position D (Hedonic Purist):** Answers Q5-Yes. Believes only occurrent affect is real. Aim: Ladder is confabulation.
  *   **Position E (Pragmatic Realist):** Answers Q5-No. Believes ladder measures judgment (not happiness) but is best indicator. Aim: Use ladder.
  *   **Position F (Liberal Neutralist):** Answers Q6-Yes. Believes promotion violates autonomy. Aim: Track but not promote.

  **Combination Grid**

  The axes permit 32 cells (2^5). Occupied cells correspond to Positions A–F.

  *   **Unoccupied Cell 1:** *Epistemology (Noise) + Normative I (Promote).*
      *   *Diagnosis:* **Incoherent.** One cannot rationally aim to maximize a metric one believes measures noise.
  *   **Unoccupied Cell 2:** *Comparability (Yes) + Normative II (Ignore Ranking).*
      *   *Diagnosis:* **Coherent but Unattractive.** If comparisons are valid, ignoring relative standing implies indifference to citizen welfare relative to peers, which is politically unstable.
  *   **Unoccupied Cell 3:** *Ontology (Objective) + Epistemology (Self-Report Authority).*
      *   *Diagnosis:* **Unexplored.** Rare to believe welfare is objective (e.g., virtue) yet best accessed via subjective self-report. Usually implies objective lists reject self-reports.

  **Unseparated Leaves**

  1.  **Pair:** Position E (Pragmatic Realist) vs. Position F (Liberal Neutralist).
      *   *Issue:* Both may accept the ladder's validity but differ on state action. The tree separates them at Q6, but a participant might answer Q6 based on Q4's outcome rather than principle.
      *   *Further Question:* "If you could raise the score without citizens knowing, would you?"
      *   *Lay Honesty:* **Low.** Participants will answer socially desirably (No) rather than reveal paternalistic instincts.
  2.  **Pair:** Position B (Incomparability) vs. Position D (Hedonic Purist).
      *   *Issue:* Both reject the ladder for policy, but for different reasons (comparison vs. ontology).
      *   *Further Question:* "If everyone used experience sampling, would you support policy targeting?"
      *   *Lay Honesty:* **High.** This isolates the measurement objection from the welfare objection.

  **Node Order & Facilitation**

  **Justification:**
  Questions proceed from *Measurement Validity* (Q1, Q2) to *Comparability* (Q3) to *Policy Incentives* (Q4) to *Ontology* (Q5) to *Normative Constraints* (Q6). This order prevents normative desires from contaminating measurement judgments. If a participant wants to promote happiness (Normative), they might falsely affirm validity (Epistemology). By forcing measurement questions first, we isolate the methodological doubt from the political aim. Q6 is last because it overrides all previous instrumental reasoning.

  **Live Facilitation (40 People, 1 Whiteboard):**
  1.  **Setup:** Draw the tree trunk on the board. Label branches Y/N.
  2.  **Round 1 (Q1-Q2):** Ask hands for Q1. Count Y/N. Mark counts on branches. Repeat Q2.
  3.  **Visualization:** Have participants physically move to left/right sides of the room corresponding to their Q1/Q2 answers. This makes the "Methodologist vs. Adviser" split visible immediately.
  4.  **Round 2 (Q3-Q4):** Ask remaining groups. Note where Methodologists cluster (usually Q1-Yes/Q2-No) vs. Advisers (Q4-Yes).
  5.  **Debrief:** Highlight clusters where doubts about the instrument (Q1/Q2) coincide with doubts about aims (Q4/Q6). Point out the empty spaces on the board where no one stands (e.g., those who think it's noise but want to promote it).
  6.  **Constraint:** Do not allow discussion between questions. Collect answers silently to prevent peer influence on sensitive normative items.

  **Word Count Check:** ~1,300 words.
  **Constraints Met:** Axes stated, 2 normative axes, 4 concrete cases, 6 specific leaves, grid with 3 diagnoses, 2 unseparated pairs, facilitation guide. No citations.
