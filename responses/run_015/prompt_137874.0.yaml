      *   **Duration:** 90-minute seminar session (plus a 5-minute follow-up in the *next* meeting).
      *   **Goal:** Move students from seeing it as a "verbal trick" to experiencing it as a "practical difficulty."
      *   **Constraints/Ingredients:**
          *   No framing lecture up front.
          *   Real but harmless substitute for the toxin (merely unpleasant).
          *   Genuine opt-out.
          *   Payout = privilege/chocolate (no money).
          *   Rotating peer panel audits sealed trace of deliberation/verdict.
          *   Split conditions: Declare aloud vs. Seal privately.
          *   Split conditions: 10-min vivid rehearsal vs. Cold attempt.
          *   Forecast: 0-100% chance of actually drinking.
          *   Payoff Moment: 5 mins into the *next* meeting (cup present, unobserved, unrewarded, record = empty or full).
      *   **Deliverables:**
          *   Timeline.
          *   Exact wording of instruction cards.
          *   Debrief plan (mapping moments to philosophical concepts).
          *   Honest prediction of failure modes (gaming, demand characteristics, ethics).
          *   Honest assessment of limitations (what the exercise *can't* reproduce).

  2.  **Deconstruct the Philosophical Problem:**

      *   *Kavka's Core:* You get rewarded for *intending* to drink, not for drinking. But you can only intend if you believe you will drink. But once rewarded, you have no reason to drink. So you can't intend.
      *   *The Student Objection:* "It's just wordplay. I'll just say I intend."
      *   *The Fix:* Make the "saying" insufficient. The audit needs to judge *sincerity* or *psychological state*, not just the utterance. The follow-up (next class) creates the temporal gap where the reason evaporates.

  3.  **Design the Activity (Iterative Process):**

      *   *Substitute for Toxin:* Needs to be unpleasant but safe. Spicy juice? Vinegar? Very bitter tea. Let's go with **strong lemon juice with a pinch of salt** (sour/salty shock, harmless, visceral).
      *   *Reward:* Drop a reading response or a nice chocolate bar. Let's use the **Reading Response Drop** (higher value for undergrads).
      *   *Audit:* Peers judging intention is tricky. How do they know? They read the *deliberation trace*. If the trace shows strategic reasoning ("I'll say yes to get the point, then not drink"), they fail. If it shows genuine struggle ("I really want the point, I think I can do it"), they pass.
