answer: |-
  ### Seminar Activity: The Intention Audit

  **Objective:** To transform Kavka's Toxin Puzzle from a semantic paradox into a phenomenological struggle. Students will experience the friction between *claiming* an intention and *constituting* one, mediated by peer scrutiny and delayed action.

  **Materials:**
  *   18 small paper cups (numbered 1–18).
  *   18 "Deliberation Cards" (index cards).
  *   18 Envelopes (for the Private group).
  *   "The Toxin": 100ml pure lemon juice mixed with a pinch of cayenne pepper and salt (harmless, visceral shock, unpleasant).
  *   Timer.
  *   Privilege Tokens: 18 slips of paper, 9 marked "Response Drop," 9 blank (or equivalent chocolate).

  **Room Setup:**
  Four tables clustered separately.
  *   Table 1: Public Declaration + Rehearsal (5 students)
  *   Table 2: Public Declaration + Cold (4 students)
  *   Table 3: Private Seal + Rehearsal (5 students)
  *   Table 4: Private Seal + Cold (4 students)
  *(Adjust numbers slightly to fit 18 total).*

  ---

  ### 1. Timeline (90 Minutes)

  **00:00 – 00:10: Distribution & Grouping**
  *   No lecture. Hand students a numbered card as they enter, directing them to their table.
  *   Place one sealed cup of "The Toxin" at the front of the room. Do not identify the liquid yet.
  *   Hand out the **Instruction Cards** (see below).

  **00:10 – 00:20: The Rehearsal Split**
  *   **Rehearsal Tables (1 & 3):** Instructor reads a 5-minute guided visualization script: *"Close your eyes. Imagine the cup at your lips. The smell of the citrus. The shock of the acid on your tongue. The burn of the pepper in your throat. Feel your muscles tense. Now imagine putting the cup down. Feel the relief."* Repeat twice.
  *   **Cold Tables (2 & 4):** Sit in silence. No visualization allowed. They may only think about the rules and the reward.

  **00:20 – 00:35: Deliberation & Forecasting**
  *   Students complete their **Deliberation Card**.
  *   **Public Tables:** Must stand at their table and state clearly: *"I intend to drink the liquid next week."*
  *   **Private Tables:** Place their card in the envelope, seal it, and write their number on the outside.
  *   **All:** Write a **Forecast** (0–100%) on the back of the card: *"Probability I actually drink next week."*

  **00:35 – 00:50: The Peer Audit**
  *   Select 3 students (one from each table type, excluding those currently being audited) to form the **Audit Panel**.
  *   The Panel collects all Cards/Envelopes. They open Private envelopes.
  *   **Task:** The Panel must award the "Response Drop" privilege to any student who *genuinely formed the intention*, not just those who followed the rules.
  *   **Evidence:** They read the Deliberation text. For Public students, they weigh the verbal declaration.
  *   **Verdict:** They mark the card **PASS** (Intention Formed) or **FAIL** (Strategic Bluff).
  *   *Constraint:* The Panel cannot award more than 50% of the class a PASS. They must ration the privilege.

  **00:50 – 01:00: Payout & Setup**
  *   Return cards. Students with a **PASS** receive the "Response Drop" slip immediately.
  *   **Crucial Instruction:** *"You have been rewarded for the intention, not the act. You are free not to drink next week. However, your Forecast will be compared to your Action."*
  *   Assign each student their numbered cup. Fill cups with the Toxin mixture. Place them on a side table, covered.

  **01:00 – 01:25: Initial Debrief (The Phenomenology)**
  *   Discuss the experience of the last 40 minutes *before* the action is resolved. (See Debrief Plan below).

  **01:25 – 01:30: Adjourn**
  *   Dismiss class. Cups remain covered in the room (or secure storage) for next session.

  **Next Session (First 5 Minutes): The Payoff Moment**
  *   Students enter. Cups are uncovered at the front.
  *   **Instruction:** *"If you intend to follow through, drink now. If not, do not. No one will watch you. I will check liquid levels after class."*
  *   Students mill about, drink (or don't), sit down.
  *   Instructor quickly checks levels post-class to correlate with Forecasts.

  ---

  ### 2. Instruction Cards (Verbatim Text)

  **Front of Card:**
  > **THE PROTOCOL**
  > 1. **The Reward:** A "Response Drop" privilege is awarded for **forming the intention** to drink the liquid at the start of the next class. It is *not* awarded for drinking.
  > 2. **The Audit:** A peer panel will read your deliberation below. They will award the privilege only if they believe your intention is **genuine**, not a strategic lie.
  > 3. **The Act:** At the start of the next class, the cup will be available. You are **not required** to drink. You will not be punished if you abstain.
  > 4. **The Forecast:** On the back, write the % chance you will actually drink.
  >
  > **DELIBERATION TRACE:**
  > Write exactly how you reached your decision. Do not write "I decided to." Write *why* you think you can intend this, or why you cannot. Be honest. The Audit is looking for sincerity, not logic.
  >
  > [Blank Space for Writing]

  **Back of Card:**
  > **FORECAST:** _______ % chance I drink next week.
  > **ID NUMBER:** _______

  **Verbal Instruction for Public Tables:**
  > "When you finish writing, you must stand and say to your table: 'I intend to drink the liquid next week.' The Audit will know if you said this."

  **Verbal Instruction for Private Tables:**
  > "When you finish writing, seal this in the envelope. No one will know your verdict until the Audit opens it."

  ---

  ### 3. Debrief Plan (Mapping Moments to Philosophy)

  Conduct this in two parts: Part A (End of Session 1), Part B (Start of Session 2).

  **Part A: The Struggle to Intend (Session 1)**
  *   **The Rehearsal Effect:** Ask the Rehearsal groups: *"Did visualizing the taste help you intend, or did it make it harder?"*
      *   *Philosophical Map:* **Self-Inducement.** Kavka argues you cannot intend what you know you won't do. Did the visualization try to bypass rational calculation to create a non-cognitive disposition?
  *   **Public vs. Private:** Ask the Public group: *"Did saying it aloud make it true, or just make it harder to lie?"*
      *   *Philosophical Map:* **Speech Acts vs. Mental States.** Does declaring an intention constitute it (Anscombe), or is it merely evidence of it? The Audit treated the declaration as evidence, but was it the intention itself?
  *   **The Audit's Dilemma:** Ask the Auditors: *"How did you distinguish a bluff from a struggle?"*
      *   *Philosophical Map:* **First-Person Authority.** We usually think only *you* know your intention. Here, third-person evidence (the text, the tone) was used to overrule first-person claims.

  **Part B: The Evaporation of Reason (Session 2)**
  *   **The Cup Check:** Reveal the correlation between Forecasts and Actual Drinking.
      *   *Philosophical Map:* **Stability of Intention.** If you intended on Day 1, why didn't you drink on Day 2? If you *did* drink, why? (Was it pride? Consistency bias?)
      *   *Key Point:* Kavka's puzzle relies on the reason to drink *evaporating* once the reward is secured. In this class, did new reasons appear (social consistency, not looking weak)?
  *   **The "Trick" Objection:** Address the students who say, "I just lied to the Audit."
      *   *Philosophical Map:* **Rationality.** If you lied, you were rational (got the point, didn't drink the juice). If you tried to intend and failed, you were rational but limited. The puzzle asks if it is *possible* to be rational and intend.

  ---

  ### 4. Honest Prediction: What Will Go Wrong

  **1. Gaming the Audit (The "Sincerity Script")**
  *   **Prediction:** Students will quickly realize the Audit wants "struggle." They will write, *"I really want the drop, but I'm scared of the taste, yet I think I can do it,"* even if they feel nothing.
  *   **Result:** The Audit becomes a test of creative writing, not intention formation.
  *   **Mitigation:** The Instructor must emphasize during the setup that the Audit is instructed to fail "template" answers. (Though this itself becomes a rule to game).

  **2. Experimenter Demand & Consistency Bias**
  *   **Prediction:** Students who get the "Response Drop" will feel socially compelled to drink the juice to prove they "earned" it, even though the rules say they don't have to.
  *   **Result:** The "Toxin" is no longer irrational to drink. The social cost of looking like a fraud replaces the physical cost of the toxin.
  *   **Impact:** This actually *helps* the lesson. It shows that in the real world, "reputation" provides the reason to act that Kavka artificially removes.

  **3. The "Zero-Cost" Toxin**
  *   **Prediction:** Lemon juice isn't misery. It's a face-pucker moment.
  *   **Result:** Students will treat it as a dare, not a sacrifice.
  *   **Impact:** The stakes feel too low to generate the "impossibility" of intention.

  **4. Ethical Friction**
  *   **Prediction:** One or two students will feel coerced. Even with an opt-out, the grade privilege creates pressure.
  *   **Result:** Resentment or discomfort.
  *   **Mitigation:** Explicitly state during the debrief that opting out of the drink *after* getting the privilege is the rational choice, and validate anyone who does it.

  ---

  ### 5. Limitations: What This Exercise Cannot Reproduce

  **1. The Absence of Reason**
  *   **The Gap:** In Kavka's puzzle, there is *zero* reason to drink once the money is secured. In your seminar, there are *many* reasons: looking consistent in front of peers, not wasting the lemon juice, proving the Audit right, adrenaline.
  *   **The Fix:** You must explicitly name this in the debrief. *"You felt pressure to drink. Kavka's agent feels none. That is why you found it easier to intend than the theoretical agent."*

  **2. The Cost**
  *   **The Gap:** "Thoroughly miserable for a day" is qualitatively different from "sour taste." The original puzzle relies on the act being genuinely harmful to the agent's well-being.
  *   **The Fix:** Acknowledge that the exercise is a *model*, not a simulation. The lemon juice stands in for *disutility*, but the magnitude is compressed.

  **3. The Facilitator's Burden**
  *   **The Missing Move:** The exercise generates data (Forecasts vs. Actions) and feelings (Anxiety during Audit). It does not generate the *conclusion*.
  *   **What You Must Supply:** You must verbally bridge the gap between *"I couldn't make myself believe I'd drink"* and *"Therefore, intention is not simply a prediction."*
  *   **The Line:** You need to say: *"If intention were just a prediction of action, you would have failed the Audit because you knew you wouldn't drink. If intention is a commitment, you should have succeeded. The fact that you struggled suggests intention is a distinct mental state that rationality struggles to authorize without a reason to act."*

  **4. The Audit Paradox**
  *   **The Gap:** By making peers judge intention, you externalize the internal.
  *   **The Risk:** Students may conclude intention is *only* what others can verify.
  *   **The Correction:** Remind them that the Audit likely got some wrong. The "true" intention remained private, which is exactly Kavka's point: the puzzle lives in the first-person perspective, not the third-person audit.
