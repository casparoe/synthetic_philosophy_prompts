  2.  **Deconstruct the Philosophy (Aesthetic Testimony):**
      *   *The Autonomy Thesis (Kantian influence):* You really need to experience art yourself to judge it. Testimony is insufficient for aesthetic judgment.
      *   *The Optimist/Reductionist View:* You *can* rely on testimony if the source is reliable, similar to factual knowledge.
      *   *The Pessimist/Non-Reductionist View:* Aesthetic judgment requires first-hand experience; testimony creates a "belief" but not an "aesthetic judgment."
      *   *The Disagreement Problem:* When peers disagree (half like it, half hate it), testimony loses weight.
      *   *Application:* The procedure needs to balance the need for first-hand experience (Autonomy) with the practical reality that committees can't see everything (Testimony). It needs to acknowledge where theory fails (the "gut call").

  3.  **Drafting the Procedure (The "20-Minute Aesthetic Audit"):**
      *   *Constraint:* Must be under 20 minutes.
      *   *Input Order:* Direct Viewing -> Expert Testimony -> Secondary Testimony.
      *   *Step 1: Direct Viewing (The Autonomy Check).* If you can see/hear it, you must. If the committee is split, it's a value call.
      *   *Step 2: Expert Testimony (The Reductionist Check).* Curator/Critic claims. Is it about *features* or *feelings*? Features are transferable; feelings are not.
      *   *Step 3: Secondary Testimony (The Hearsay Check).* Conservator/Artist relayed by Curator. High risk.
      *   *Stop Conditions:* Hard No (Safety/Preservation), Hard Yes (Mission Critical), Punt (Aesthetic disagreement).
      *   *Honesty:* Acknowledge that "Mission Fit" is often just coded gut instinct.

  4.  **Developing the Three Cases:**
      *   *Case 1 (Sound Installation):* No direct viewing. Curator testimony about "temporal disorientation."
          *   *Analysis:* Violates Autonomy Thesis. You can't judge sound by description.
          *   *Verdict:* Reject (or defer). This will be unpopular because curators hate being overruled on "experience" they claim to understand.
      *   *Case 2 (Figurative Painting):* Split committee (Disagreement Problem). Critic says sentimentality is the point.
          *   *Analysis:* Direct viewing happened. Disagreement exists. Testimony explains the disagreement.
          *   *Verdict:* Approve (with caveat). The critic resolves the philosophical tension by reframing the flaw as a feature.
      *   *Case 3 (Fragile Work):* Curator relaying Conservator (Secondary Testimony). Aesthetic of decay.
          *   *Analysis:* Heavy reliance on secondary testimony. Safety/Preservation risk.
          *   *Verdict:* Hard No (Preservation trumps Aesthetics). Or, if focusing on aesthetics, it's a "Punt" because you can't judge decay by report. Let's make it a "Reject" based on the procedure's inability to validate the aesthetic claim without seeing the decay. Actually, the prompt asks for one verdict the committee won't like. Case 1 is a good candidate for "Reject based on lack of experience." Case 3 is good for "Reject based on risk." Let's make Case 1 the "Reject" (Curator will hate it) and Case 3 the "Hard No" (Practical). Wait, I need to ensure one verdict is *unpopular*. Usually, committees want to buy the "safe" painting (Case 2) and reject the "risky" sound (Case 1). If the procedure says "Buy Sound, Reject Painting," that's unpopular. Or "Reject Sound" (Curator hates), "Buy Painting" (Public might hate).
