    "full_explanation": "### The 20-Minute Aesthetic Audit: Procedure & Analysis\n\nThis procedure grounds itself in the Philosophy of Aesthetic Testimony. It balances the 'Autonomy Thesis' (you must experience art to judge it) with the 'Reductionist View' (testimony is valid if reliable) while acknowledging the 'Disagreement Problem' (peer splits invalidate testimony).\n\n---\n\n#### Detailed Procedure Steps\n\n1. **Direct Experience Check (The Autonomy Constraint)**\n   - **Action:** Verify if any voting member can see/hear the work before signing.\n   - **Sufficient:** At least one member experiences the work fully.\n   - **Hard No:** No one experiences it AND testimony is purely affective (see Step 2).\n   - **Punt:** If direct experience leads to a split vote (e.g., half love it, half hate it), theory cannot resolve this. Move to Step 4.\n   - **Honesty Check:** This step admits that without experience, you are buying a concept, not art.\n\n2. **Expert Testimony Filter (Feature vs. Affect)**\n   - **Action:** Analyze the Curator/Critic statement.\n   - **Sufficient:** Testimony describes objective features (e.g., 'uses 1950s acrylics', 'references Goya').\n   - **Hard No:** Testimony describes only subjective affects (e.g., 'feels haunting', 'rewards patience') WITHOUT direct experience to back it.\n   - **Punt:** If features are clear but affect is disputed, move to Step 4.\n   - **Honesty Check:** You can learn facts from others; you cannot learn 'beauty' from others. Don't pretend you can.\n\n3. **Secondary Testimony & Risk (The Hearsay Check)**\n   - **Action:** Identify if the expert is relaying another's report (e.g., Conservator, Artist).\n   - **Sufficient:** Report is purely technical (preservation status).\n   - **Hard No:** Report claims aesthetic value based on secondary observation (e.g., 'the decay looks poignant').\n   - **Punt:** If technical risk is high but aesthetic value is unverified, default to REJECT for under $50k purchases.\n   - **Honesty Check:** This is mostly risk management dressed as aesthetic theory.\n\n4. **The Values Call (Gut Declaration)**\n   - **Action:** If the work survives 1-3 but hesitation remains, declare it a 'Values Call'.\n   - **Sufficient:** Committee agrees the work fits the mission despite aesthetic doubt.\n   - **Hard No:** Committee cannot agree on mission fit.\n   - **Punt:** N/A. This is the final stop.\n   - **Honesty Check:** This step admits the procedure has ended and intuition begins.\n\n---\n\n#### Case Applications\n\n**Case 1: Abstract Sound Installation**\n- **Inputs:** No direct viewing. Curator testimony: 'temporal disorientation that rewards patience' (Affective).\n- **Analysis:** Fails Step 1 (No Autonomy). Fails Step 2 (Testimony is purely affective). You cannot verify 'disorientation' by report. This violates the Autonomy Thesis.\n- **Verdict:** REJECT.\n- **Why Unpopular:** Curators hate being told their expertise doesn't count without the committee present. It stalls 'cutting edge' acquisitions.\n\n**Case 2: Figurative Painting (Split Vote)**\n- **Inputs:** Direct viewing (Split Committee). Critic testimony: 'sentimentality is the conceptual point'.\n- **Analysis:** Passes Step 1 (Experience occurred). Step 1 triggers 'Peer Disagreement' punt. Step 2 applies: Critic reframes the flaw (kitsch) as a feature (concept). This resolves the disagreement philosophically.\n- **Verdict:** APPROVE.\n- **Flag:** Values Call. The theory explains the split, but the committee must value 'concept' over 'taste'.\n\n**Case 3: Fragile Work (Second-Hand)**\n- **Inputs:** Curator relays Conservator report. 'Unintended material fragility creates an aesthetic of decay'.\n- **Analysis:** Fails Step 3. Secondary testimony on aesthetic value is hearsay. Additionally, 'unintended fragility' triggers preservation risk protocols which trump aesthetics in small museums.\n- **Verdict:** REJECT.\n- **Flag:** No. This is a procedural hard stop based on risk and testimonial hierarchy.\n\n---\n\n#### Summary Table\n\n| Case | Procedure Verdict | Judgment Call Flagged? | One-line reason |\n|---|---|---|---|\n| 1. Sound Install | REJECT | Yes (Autonomy Violation) | Cannot judge affective testimony without direct experience. |\n| 2. Fig. Painting | APPROVE | Yes (Values Call) | Peer disagreement resolved by critical reframing; requires mission alignment. |\n| 3. Fragile Work | REJECT | No (Procedural Hard Stop) | Secondary aesthetic testimony is invalid; preservation risk too high. |\n\n---\n\n#### What This Procedure Cannot Do\n\n1. **Predict Art History:** It cannot tell you if a rejected piece will become a 'major piece' in 20 years. That is luck, not philosophy.\n2. **Resolve Value Clashes:** If half the committee believes the museum should be 'challenging' and half believes it should be 'beautiful', this procedure forces you to admit that, but not solve it.\n3. **Eliminate Bias:** It relies on the honesty of the 'Gut Declaration'. Members may still hide bias behind procedural steps.\n4. **Replace Connoisseurship:** It is a triage tool for under $50k, not a replacement for deep scholarly research on major acquisitions."
  }
