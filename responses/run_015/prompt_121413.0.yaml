answer: |-
  **JOINT STATEMENT ON PREDICTIVE AND COUPLING FRAMEWORKS**

  **I. Shared Substantive Claims**

  We, the undersigned, agree to the following claims as the baseline for our continued disagreement. These are not merely diplomatic compromises but substantive commitments regarding what the models do, how they fail, and the status of the evidence.

  1.  Organisms act to maintain physiological viability within specific environmental niches; any framework denying this regulatory loop is false.
  2.  Neural activity attenuates to repeated stimuli and amplifies unexpected deviations; this is a robust empirical datum consistent with multiple computational descriptions.
  3.  Citing mismatch responses or repetition suppression alone cannot distinguish between error minimization and efficient coding without independent behavioral criteria.
  4.  Action alters sensory input; both frameworks agree perception and action are coupled, differing only on the direction of explanatory priority.
  5.  If the prediction-error framework cannot specify the content of priors independently of the behavior they explain, it risks tautology.
  6.  If the coupling framework cannot specify the laws of interaction without referencing internal states, it risks obscurity.
  7.  A framework applying equally to cells, brains, and societies explains nothing unless the mechanisms scale appropriately across these levels.
  8.  The Markov blanket is a formal tool for partitioning systems; whether it ontologically constitutes an agent or merely describes a boundary is an open empirical question.
  9.  Both frameworks currently lack a complete account of how subjective experience arises from their respective mechanical processes.
  10. Individuation (where an agent starts and ends) is a problem for both views, not a premise solved by definition.

  **II. Disagreements Table**

  | Disputed Proposition | Prediction-Error Formulation | Coupling Formulation | Status |
  | :--- | :--- | :--- | :--- |
  | **The Role of Internal Models** | Necessary computational structures that encode probabilities of sensory causes. | Unnecessary metaphors; lawful coupling suffices without internal surrogates. | Substantive |
  | **The Goal of Action** | To make sensory input match top-down predictions (minimize error). | To maintain viable coupling with the environment (maintain viability). | Substantive |
  | **The Markov Blanket** | The mathematical boundary that derives and defines the individual agent. | A formal partition that presupposes the individual it claims to derive. | Substantive |
  | **Representational Content** | States carry content by virtue of their probabilistic relation to causes. | Talk of content is intellectualism; organisms deal directly with affordances. | Verbal |

  *Note on Collapsed Row:* We removed a fourth row regarding "Representation" from the substantive table. Upon clarification, the Prediction-Error side accepts that "representation" need not imply a homunculus reading a map, but merely a state correlating with future input. The Coupling side accepts that coupled systems exhibit structural correlations. The dispute was largely verbal: both agree states correlate with world conditions, but disagree on whether calling this "representation" invites harmful intellectualism.

  **III. Cruxes and Adjudicating Cases**

  We identify three sub-questions where empirical resolution would force at least one of us to revise our position. For each, we record advance predictions and concession conditions.

  **Crux 1: The Quiet-Room Preparation**
  *Question:* Does action persist when surprise is minimized and homeostasis is clamped?
  *Case:* A larval animal is placed in a closed-loop virtual arena. One motor routine renders the exteroceptive stream perfectly constant (no optic flow, no transients). Homeostatic variables (hunger, temperature, oxygen) are clamped externally.
  *Prediction-Error Side:* The animal will engage in exploratory movement. Even if current error is zero, active inference minimizes *expected* free energy, driving the organism to sample data that resolves uncertainty about the causes of the constant input.
  *Coupling Side:* The animal will cease goal-directed action. Action emerges from the need to regulate coupling against perturbations. With input constant and homeostasis secured, the drive for directed movement vanishes; any motion will be random drift, not exploration.
  *Concessions:* If the animal freezes completely, the Prediction-Error side concedes that error minimization alone cannot drive action without homeostatic need. If the animal exhibits directed exploration, the Coupling side concedes that internal dynamics drive action even without immediate environmental pressure.

  **Crux 2: The Blanket-Shuffling Test**
  *Question:* Does the boundary define the agent, or does the agent define the boundary?
  *Case:* Take a system agreed to be a single agent (e.g., a eusocial colony or a distributed plant). Attempt to draw the Markov blanket at several admissible places (e.g., around the individual insect vs. the whole hive).
  *Prediction-Error Side:* There should be a unique, optimal blanket partition that minimizes variational free energy for the system. If multiple stable blankets exist, the framework cannot individuate the agent.
  *Coupling Side:* Multiple admissible blankets should exist depending on the scale of analysis. The agent is identified by ordinary criteria first; the blanket is drawn afterwards to suit the description.
  *Concessions:* If multiple stable blankets are found with no unique optimum, the Prediction-Error side concedes the blanket does not ontologically derive the individual. If a unique partition emerges naturally from the dynamics, the Coupling side concedes the boundary is more than pragmatic.

  **Crux 3: Neural Signal Identification (Model-Found)**
  *Question:* Can a neural signal be identified as carrying prediction error rather than mere surprise or salience without circular appeal to the framework?
  *Case:* Manipulate precision (attention) independently of error magnitude. Present a stimulus that violates expectations (high error) but is task-irrelevant (low precision), versus one that violates expectations less but is task-relevant (high precision).
  *Prediction-Error Side:* The neural signal will scale with precision-weighted error. The task-relevant stimulus will evoke a stronger response even if the physical deviation is smaller, because attention modulates the gain on error units.
  *Coupling Side:* The neural signal will scale with salience or magnitude of change. The physically larger deviation will evoke the stronger response regardless of task relevance, as the system detects change, not weighted probabilities.
  *Concessions:* If the signal tracks physical magnitude regardless of task set, the Prediction-Error side concedes the signal is not precision-weighted error. If the signal tracks task relevance over magnitude, the Coupling side concedes the system implements a weighting mechanism akin to precision.

  **IV. Closing**

  We sign this document acknowledging that our disagreement is not merely terminological but concerns the causal architecture of cognition. We commit to treating the outcomes of these cases as binding on our respective theoretical commitments.
