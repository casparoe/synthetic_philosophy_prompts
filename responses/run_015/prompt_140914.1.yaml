answer: |-
  There is no single, universally standardized term for this exact phenomenon, though it is a well-recognized problem in oral history, transitional justice, and memory studies. You are describing a tension between *forensic truth* (what can be proven in a court or archive) and *social truth* (what a community experiences as real).

  Here are the two nearest established concepts, followed by a coined term that fits your specific description of the "load-bearing error."

  ### The Nearest Established Concepts

  **1. Narrative Truth (Donald Spence)**
  *   **What it is:** A distinction from psychoanalysis adapted to history. *Historical Truth* is what actually happened (dates, numbers). *Narrative Truth* is the story that makes the experience coherent and meaningful for the survivor.
  *   **Why it's close:** It validates the story even if the facts are wrong. It acknowledges that the "truth" of the trauma lies in the meaning, not the timestamp.
  *   **Why it's not quite it:** "Narrative Truth" is often used to describe the *whole story*, not specifically the **mechanism of the error**. It doesn't explain *why* the date shifted from 1961 to 1963, only that the story matters. It treats the error as incidental noise rather than a functional signal.

  **2. Social Truth (South African Truth & Reconciliation Commission)**
  *   **What it is:** The TRC explicitly distinguished between *Forensic Truth* (evidence-based) and *Social Truth* (experience-based). Social truth is what is accepted by a community as their reality.
  *   **Why it's close:** It gives you the political framework you're working in. It explains why correcting the memory with forensic truth can feel like violence (it invalidates their reality).
  *   **Why it's not quite it:** Like Narrative Truth, it validates the *outcome*, not the *structure of the mistake*. It doesn't give you a word for the specific way the memory stitched three bureaucratic incidents into one event to preserve the *fact of disappearance*.

  **3. Archival Silence (Michel-Rolph Trouillot)**
  *   **What it is:** The concept that archives are not neutral; they are created by power. What is *missing* from the archive is often more telling than what is present.
  *   **Why it's close:** It explains why the documents disagree (the tax roll is missing names because the state erased them).
  *   **Why it's not quite it:** This describes the *record*, not the *memory*. You need a term for how the memory reacts to that silence.

  ### The Coined Term: **Veridical Distortion**

  Since you need a tight definition for your work, I propose **Veridical Distortion**.

  *   **Definition:** A mnemonic error where the factual inaccuracy is not random noise, but a structural adaptation to preserve a deeper truth that the official record obscures. The distortion is "veridical" (truthful) about the *relationship of power* or the *scale of loss*, even if it is false about the *event*.
  *   **The Test:** If you correct the fact (e.g., "It was 1961, not 1963"), does the *meaning* of the story collapse? If yes, it is a Veridical Distortion. If the meaning stays the same, it's just a mistake.
  *   **Why this fits:** It captures your observation that the inaccuracy is "load-bearing." The error is doing work. It is holding up the truth that the archive dropped.

  ### Distinguishing It from the Neighbors

  You asked how to separate this from myth, denialism, and degradation. Here is the practical test for each:

  **1. Versus Myth-Making**
  *   **Myth:** Tends toward the sacred or timeless. It explains *origins* or *identity* (e.g., "We are the people who survived the great flood"). It often sheds specific details to become universal.
  *   **Veridical Distortion:** Tends toward the *bureaucratic* or *specific* (e.g., "forty men," "tax roll," "police diary"). It is trying to document a crime, not found a religion.
  *   **The Test:** Ask, "If we found the proof, would the story change?" A myth doesn't want proof. A Veridical Distortion *is* the proof, just encoded.

  **2. Versus Degradation (Telephone Game)**
  *   **Degradation:** Errors are random. Details get softer, names get fuzzy, numbers drift without pattern. Signal is lost.
  *   **Veridical Distortion:** Errors are *directional*. The date moves to when the trauma was felt most, not when it happened. The count moves to the number of families affected, not the number of bodies. Signal is *preserved* via distortion.
  *   **The Test:** Look for patterns. If every error makes the state look more powerful or the loss more total, it's not degradation. It's compression.

  **3. Versus Denialism**
  *   **Denialism:** Claims "nothing happened" despite evidence. It seeks to erase the event.
  *   **Veridical Distortion:** Claims "something happened" despite a lack of evidence. It seeks to preserve the event.
  *   **The Test:** Check the vector. Denialism moves toward zero. Veridical Distortion moves toward meaning.

  ### The Danger of Correction (The "Nothing Happened" Trap)

  You noted that after you publish a correction, officials say "nothing much happened here." This is a known risk in transitional justice called **Forensic Override**.

  When you correct a Veridical Distortion with Forensic Truth without acknowledging the Social Truth, you hand a weapon to the perpetrators. The state's archive says "No arrests in 1963." You confirm "Correct, it was 1961." The state concludes "Therefore, no arrests."

  **Practical Advice:** Do not publish "Corrections." Publish "Contextualizations."
  *   *Bad:* "The village says 1963; records show 1961."
  *   *Good:* "The village remembers 1963, which aligns with the 1964 tax purge and the 1961 convictions. The memory preserves the *period of removal*, while the records fragment it."

  ### Confidence and Uncertainty

  **Confidence Level:** High on the distinctions, Moderate on the terminology.

  **Where I am least sure:**
  The term **Veridical Distortion** is my own synthesis for this conversation. It is not a standard index term you will find in a library catalog. The concepts of *Narrative Truth* and *Social Truth* are standard, but scholars argue endlessly about where the line is drawn. Some historians insist that if the date is wrong, the testimony is compromised. Others (like oral historians) argue the date is irrelevant to the trauma.

  **The Risk:**
  My biggest uncertainty is whether "Veridical Distortion" sounds too academic for your local context. If you need a phrase for the community, **"Truth-Bearing Error"** or **"Load-Bearing Memory"** might be more usable. But conceptually, the distinction holds: you are dealing with a memory that is factually false but structurally accurate. Treating it as a simple mistake will cause the harm you observed. Treat it as a coded document, and it becomes evidence.
