  For to be is to be perceived.
  Go on, try to push the world from mind.
  That tree alone there unconceived.

  You frame the quad when the sight is blind.
  You reach for a state left far behind.
  For to be is to be perceived.

  You subtract the self from the design.
  But the vacant space is defined.
  That tree alone there unconceived.

  You ask if the root is still behind.
  But the search is of the same kind.
  For to be is to be perceived.

  So the trap is the thought's own kind.
  And the wall is by the eye designed.
  That tree alone there unconceived.

  You claim the scope is wrongly defined.
  That the thought's limit leaves it behind.
  For to be is to be perceived.
  That tree alone there unconceived.
