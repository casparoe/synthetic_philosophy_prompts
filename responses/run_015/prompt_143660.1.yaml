answer: |-
  This is a precise and necessary disambiguation. The slogan that "moral sainthood is undesirable" is the engine of Susan Wolf's seminal *Moral Saints* (1982), but it is often wielded in subsequent literature without distinguishing between the *possibility*, the *value*, the *coherence*, and the *obligatoriness* of such a life. For a virtue ethicist, the stakes are particularly high because virtue ethics is often accused of being either too demanding (if virtue is perfection) or too permissive (if virtue is merely the mean).

  Below is the menu of readings you requested, followed by a committed reconstruction of which thesis actually carries the argumentative weight required to establish *undesirability* rather than mere *non-obligation*.

  ---

  ### Part I: A Menu of Readings

  #### (a) The Psychological Claim: Instability and One-Dimensionality
  *   **Thesis:** Sustained maximal moral attention is psychologically unsustainable for human beings. Attempting to maximize moral output leads to burnout, resentment, or a pathological narrowing of personality (the "bore" objection).
  *   **Evaluation:** **Empirically Plausible but Contingent.** It is likely true that *most* humans cannot sustain total moral focus without psychological degradation. However, this is a claim about human *capacity*, not moral *value*. It relies on empirical generalizations about human psychology which might not hold for all agents (e.g., exceptional figures like Francis of Assisi or Gandhi might be counterexamples).
  *   **Argumentative Work:** This establishes that sainthood is **imprudent** or **rare**, but not necessarily **undesirable** in principle. If the psychological cost were overcome, the moral value would remain. It blocks the *obligation* to be a saint (ought implies can), but it does not prove the saint's life is *worse* than a balanced life; it only proves it is harder to maintain.

  #### (b) The Axiological Claim: Value Pluralism and Outranking
  *   **Thesis:** Moral value is only one species of value. A life maximizing moral value necessarily suppresses non-moral goods (aesthetic, intellectual, relational, hedonic). Because these non-moral goods are incommensurable with and sometimes outrank moral goods in the constitution of a *good life* (flourishing), a life dedicated exclusively to moral maximization is axiologically impoverished.
  *   **Evaluation:** **Conceptually Defensible (given Pluralism).** This is the core of Wolf's "Loving Saint" vs. "Rational Saint" distinction. It depends entirely on the rejection of moral monism (the idea that moral value is the only ultimate value). If one accepts value pluralism, this claim is strong. If one is a moral realist monist (e.g., some consequentialists), this is false.
  *   **Argumentative Work:** This is the only thesis that directly establishes **undesirability**. It argues that the saint's life is *less good simpliciter* than a mixed life. It attacks the perfectionist premise that "more moral goodness = better life."

  #### (c) The Conceptual Claim: The Incoherence of Maximization
  *   **Thesis:** The category of "moral virtue" does not admit of maximization. Virtue is context-sensitive (the Aristotelian *mean*), not cumulative. Maximizing one virtue (e.g., generosity) often entails violating another (e.g., justice or prudence). Therefore, a "moral saint" who maximizes moral goodness is a conceptual impossibility; the description picks out no coherent character state.
  *   **Evaluation:** **Conceptually Defensible (within Virtue Ethics).** For a consequentialist, maximization is coherent. For an Aristotelian, it is not. You cannot be "too just" in the abstract, but you can be too just *in a specific context* where mercy is required. A "maximizer" would lack *phronesis* (practical wisdom).
  *   **Argumentative Work:** This dissolves the problem rather than solving it. It shows the demand for sainthood is **category mistake**. It blocks extreme altruism by showing it is not an instance of *more* virtue, but a distortion of virtue.

  #### (d) The Normative Claim: Prerogatives of Practical Reason
  *   **Thesis:** Agents possess agent-centered prerogatives (Scheffler) or permissions to prioritize their own projects. While moral reasons are weighty, they do not always silence non-moral reasons. There is insufficient all-things-considered reason to pursue moral perfection because the agent's integrity and personal projects generate independent normative force.
  *   **Evaluation:** **Normatively Plausible.** This is the standard "demandingness objection" response. It is defensible within deontological and hybrid frameworks.
  *   **Argumentative Work:** This establishes **non-obligation** (supererogation), but fails to establish **undesirability**. It says you are *permitted* not to be a saint, not that being a saint is *bad*. It protects the agent from morality, but does not critique the ideal of sainthood itself.

  #### (e) The Integrity/Identity Claim: Alienation from the Self
  *   **Thesis:** (Building on Bernard Williams). To maximize moral demand requires adopting an external, impartial standpoint that alienates the agent from their "ground projects" which constitute their identity. To be a moral saint is to cease to be a specific *person* and become a vessel for moral utility.
  *   **Evaluation:** **Metaphysically Heavy.** It relies on a specific view of personal identity where identity is constituted by partial commitments. It is defensible but contested by impersonal moral theories.
  *   **Argumentative Work:** This establishes **undesirability relative to the agent's integrity**. It argues the cost of sainthood is the loss of the self that would do the acting. It is stronger than (d) because it suggests the action undermines the agent, not just that the agent isn't required to do it.

  ---

  ### Part II: A Committed Position

  As a reconstruction of the argument that moral sainthood is *undesirable* (rather than merely optional or impossible), I argue that **(b) the Axiological Claim** and **(c) the Conceptual Claim** are jointly necessary and sufficient, while (a), (d), and (e) are secondary or derivative.

  Here is the committed case:

  **1. The Primacy of the Conceptual Claim (c)**
  The strongest defense against the ideal of the moral saint is to reject the metric of *maximization* entirely. In virtue ethics, virtue is not a scalar quantity to be accumulated; it is a disposition to hit the mean relative to us. The "moral saint" is typically conceived through a consequentialist lens (maximize the good) or a deontological lens (fulfill all duties). Both assume morality is a system of requirements that can be satisfied to a maximal degree.
  *   **Judgment:** The Conceptual Claim is **true** within an Aristotelian framework and **false** within a Utilitarian one.
  *   **Work:** It does the heavy lifting of showing that "moral perfection" is not a *higher* state of virtue, but a *different* (and defective) state. The saint who maximizes charity at the expense of prudence is not "more virtuous"; they are viciously imprudent. Therefore, the ideal is not just hard to reach; it is a target that, if hit, constitutes a failure of *eudaimonia*.

  **2. The Necessity of the Axiological Claim (b)**
  Even if we grant that one *could* maximize moral actions without conceptual incoherence, we must ask: *Why would we?* This requires the Axiological Claim. We must assert Value Pluralism. If moral value were the only value (Monism), then a life maximizing moral value would *ipso facto* be the best life, regardless of how boring or austere it was.
  *   **Judgment:** This claim is **contingent on Value Pluralism**. If you are a moral monist, you must reject the anti-saint conclusion.
  *   **Work:** This establishes **undesirability**. It asserts that a life of pure moral focus is *worse* than a life of mixed focus. It is not that the saint's life is morally inferior; it is that it is *humanly* inferior. It lacks the richness required for flourishing.

  **3. Why the Others Fail to Establish Undesirability**
  *   **Psychological (a):** If we invented a pill that allowed humans to sustain maximal moral focus without burnout, the Psychological Claim would vanish. But the intuition that sainthood is undesirable would likely remain. Thus, (a) is not the root of the objection.
  *   **Normative (d):** This only gets you to "it is okay not to be a saint." It leaves open the possibility that being a saint is *better*, just not required. It fails to capture the negative evaluation inherent in "undesirable."
  *   **Integrity (e):** This is powerful, but it is arguably a subset of (b). Integrity is a non-moral good. To say sainthood violates integrity is to say it sacrifices a non-moral good (integrity) for a moral one. This collapses back into Value Pluralism.

  **4. The Verdict on Undesirability**
  Does this combination genuinely establish undesirability? **Yes**, but only if you accept that the *point* of ethics is human flourishing (*eudaimonia*) rather than duty fulfillment or state-of-affairs optimization.
  *   If ethics is about **Flourishing**: The saint is undesirable because they are malformed. They have developed one capacity (moral sensitivity) at the expense of the ecosystem of capacities required for a full human life.
  *   If ethics is about **Duty/Outcome**: The saint is desirable, and the "undesirability" intuition is merely a bias of common sense that moral theory should correct.

  **5. Contested Commitments**
  My judgment rests on two explicit, contested commitments:
  1.  **Anti-Monism:** I reject the view that moral value silences or subsumes all other values. I hold that aesthetic, relational, and personal values have independent weight that is not derived from their moral utility.
  2.  **The Structure of Virtue:** I reject the maximization model of virtue. Virtue is qualitative (hitting the mark), not quantitative (accumulating points).

  **Conclusion**
  The slogan "moral sainthood is undesirable" is trivial if it means "it's hard" (Psychological) or "you don't have to" (Normative). It is profound only if it means "a life organized exclusively around moral maximization is a *less excellent human life* than one balanced with non-moral goods" (Axiological) and "the very idea of maximizing virtue is a misunderstanding of what virtue is" (Conceptual).

  For your dissertation, I recommend anchoring your argument in the **Conceptual Claim**. It is the most robust defense for a virtue ethicist because it prevents the opponent from setting the terms of the debate as "how much morality is too much?" Instead, you argue that "too much morality" is a category error akin to "too much health" or "too much wisdom"—except that in the moral case, the attempt to maximize actually *produces* vice (e.g., rigidity, lack of empathy for the particular). This moves the argument from the *limits of demand* to the *nature of virtue*.
