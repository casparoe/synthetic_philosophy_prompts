answer: |-
  # Q&A Prep Sheet: Framework Steadfastness
  **Seminar Defense / Feature Background**
  **Audience:** Social Epistemologists (Conciliationists) & Formal Epistemologists (Bayesians)

  ### Objection 1: The Collapse Objection (The "Hope Nobody Asks")
  **Objection:** "Your distinction between evidential and structural disagreement seems unstable. If I can characterize *any* disagreement about weights as a disagreement about 'theoretical virtues,' doesn't Framework Steadfastness collapse into a license for dogmatism? How do you prevent an agent from strategically reclassifying a peer's evidential counter-argument as a structural incompatibility to avoid conciliation?"

  **Reply:** "That is the central boundary problem, and I concede the line is not always bright. However, the distinction rests on *incommensurability*. In evidential disagreement, we agree on what counts as a successful prediction but disagree on whether the data obtained meets that bar. In structural disagreement, we disagree on what *counts* as a successful prediction (e.g., simplicity vs. scope). To prevent dogmatism, I propose a 'transparency constraint': an agent must be able to articulate the structural virtue in a way the peer *could* accept in principle, even if they don't currently weight it highly. If you cannot translate your virtue into the peer's framework even nominally, it is structural; if you can but claim they are misapplying it, it is evidential."
  *   **Weakest Point:** The "transparency constraint" relies on the agent's good faith articulation, which a determined dogmatist can easily fake.
  *   **Concession Advice:** Do not deny that the boundary is porous. Concede that *some* agents will abuse the distinction. Argue that the *normative* distinction remains valid even if *descriptive* application is messy. Surrender the claim that this solves dogmatism entirely; frame it instead as a tool for *identifying* when conciliation is impossible, not merely when it is inconvenient.

  ### Objection 2: The Bayesian Prior Objection
  **Objection:** "From a formal perspective, what you call 'structural disagreement' looks exactly like divergent prior probability functions. If two Bayesians recognize each other as peers, Aumann's agreement theorem suggests they should converge. By refusing to update on a peer's structural weighting, aren't you violating the requirement to treat their credence function as higher-order evidence?"

  **Reply:** "Aumann's theorem assumes a common partition of the state space. Structural disagreement is often a disagreement about the *construction* of the state space itself, not just the probability distribution over it. If your virtue is 'ontological parsimony' and mine is 'phenomenological scope,' we are effectively modeling different hypothesis spaces. You cannot conditionalize on my credence because my credence is defined over a model class you reject as ill-formed. I am not ignoring higher-order evidence; I am claiming the 'evidence' of your credence is unintelligible within my structural constraints."
  *   **Weakest Point:** This risks conceding that peerhood is impossible across structural divides, which undermines the premise that we are in a "disagreement" rather than just talking past one another.

  ### Objection 3: The Symmetry/Peerhood Objection
  **Objection:** "Social epistemology dictates that if you acknowledge someone as an epistemic peer, you acknowledge they are as likely to be right as you are. If you remain steadfast on structural virtues, you are implicitly claiming you have access to a 'super-virtue' that tells you your weighting is correct. Doesn't this violate the symmetry requirement inherent in the definition of peerhood?"

  **Reply:** "Peerhood is a judgment of *capacity* and *track record*, not a guarantee of *output identity*. I can acknowledge you are as smart and well-informed as I am (peerhood) while recognizing that our fundamental epistemic values diverge. Steadfastness here isn't a claim that I am right and you are wrong; it is an acknowledgment that there is no neutral arbiter to decide between us. Conciliation requires a shared metric to split the difference; without a shared metric, 'splitting' is mathematically undefined, not just immodest."
  *   **Weakest Point:** It is difficult to justify how we established peerhood in the first place if we don't share the virtues used to evaluate track records.

  ### Objection 4: The False Dichotomy Objection
  **Objection:** "You treat evidential and structural disagreement as distinct categories. But given theory-ladenness, all data interpretation relies on theoretical virtues. Isn't this a false dichotomy? Every evidential disagreement ultimately rests on a structural one, so your view implies we should almost never conciliate."

  **Reply:** "I agree they are entangled, but not identical. There is a pragmatic distinction in scientific practice. We often successfully conciliate on data interpretation (e.g., 'is that a signal or noise?') while leaving deeper methodological debates unresolved. My thesis is not that the categories are ontologically distinct, but that they function differently in revision. When we *can* isolate the data from the virtue, conciliation is required. When the virtue determines what counts as data, steadfastness is the only coherent option."
  *   **Weakest Point:** Quinean holists will argue you can never isolate the data from the virtue, rendering the "when we can" clause empty.

  ### Objection 5: The Self-Undermining Objection
  **Objection:** "If you are steadfast about your theoretical virtues, on what grounds do you hold those virtues? If you hold them because they are 'truth-conducive,' and your peer disagrees, you are now in a disagreement about truth-conduciveness. Shouldn't you conciliate on that? Your steadfastness seems to undermine the justification for your own framework."

  **Reply:** "This assumes virtues are beliefs subject to truth-evaluation. I argue virtues are more akin to *epistemic policies* or *goals*. I don't believe simplicity is 'true'; I adopt simplicity as a rule for theory choice. You cannot conciliate on a policy in the same way you do on a proposition. I can acknowledge your policy works for you, but adopting it would render my cognitive agency incoherent. I am not claiming my virtues are true; I am claiming they are constitutive of my reasoning."
  *   **Weakest Point:** This moves the goalposts from epistemology to pragmatism, which may not satisfy truth-seeking social epistemologists.

  ### Objection 6: The Meta-Virtue Objection
  **Objection:** "Surely there is a shared currency: predictive accuracy or empirical adequacy. Even if we weight simplicity differently, we both want theories that work. Why can't we split the difference based on which framework yields better empirical predictions over time?"

  **Reply:** "Predictive accuracy is not a neutral currency because 'prediction' is framework-relative. What counts as a successful prediction in a phenomenological framework differs from a mechanistic one. Furthermore, relying on long-term accuracy turns the disagreement into a temporal gamble, not a resolution. In the immediate context of disagreement, I cannot accept your weighting of accuracy without already accepting your structural view of what counts as a prediction."
  *   **Weakest Point:** Most scientists *do* agree on basic empirical outcomes (e.g., the pointer moved), making the claim that accuracy is relative seem overly skeptical.

  ### Objection 7: The Scientific Progress Objection
  **Objection:** "If scientists remained steadfast on structural virtues, how would paradigm shifts ever occur? Progress seems to require that agents conciliate enough to bridge structural gaps, such as when Newtonian physicists engaged with Quantum mechanics."

  **Reply:** "Progress often occurs not through conciliation, but through *conversion* or *generation replacement*. Newtonians didn't 'split the difference' with Quantum physicists; the framework that solved more anomalies eventually attracted the next generation. Framework Steadfastness explains why these transitions are revolutionary rather than gradual. Conciliation would have produced a hybrid theory that satisfied neither set of virtues and solved nothing."
  *   **Weakest Point:** Historical case studies often show significant cross-framework negotiation and compromise, contradicting the "revolutionary" narrative.

  ### Objection 8: The Pragmatic Stakes Objection
  **Objection:** "In policy-relevant science (e.g., climate modeling), we cannot afford steadfastness. If experts disagree on model weighting, we need a consensus for action. Your view seems to license inaction in high-stakes environments."

  **Reply:** "Framework Steadfastness is an epistemic norm, not a decision-theoretic one. It tells us how to manage belief, not how to manage risk. In high-stakes scenarios, we may need to act on a precautionary principle or aggregate decisions without aggregating beliefs. Forcing epistemic conciliation where structural disagreement exists produces false consensus, which is more dangerous for policy than acknowledged uncertainty."
  *   **Weakest Point:** Policymakers often cannot distinguish between "epistemic belief" and "actionable advice," making this distinction practically useless in the real world.

  ***

  ### Strategic Note on Objection #1 (The Collapse/Dogmatism Objection)
  **Status:** High Risk.
  **Advice:** This is the objection you hope to avoid because it attacks the *usability* of your thesis rather than the *logic*. If asked, **do not** try to defend a rigid test for distinguishing the two types of disagreement.
  **The Concession:** Explicitly concede that the distinction is **gradient, not binary**. Say: *"You are right that agents can exploit this. I am not offering an algorithm to prevent bad faith; I am offering a normative map. The fact that drivers sometimes speed doesn't mean the distinction between a highway and a residential zone is invalid."*
  **The Core Defense:** Hold firm that **incommensurability** is the key. If there is literally no mathematical or logical way to average our positions (e.g., averaging "maximize simplicity" and "maximize scope" yields nonsense), then conciliation is not just unwise, it is category error. Concede the boundary is fuzzy, deny that the territory doesn't exist.
