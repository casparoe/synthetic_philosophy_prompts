          *   *Lewisian View:* They were selecting which concrete reality to align with (though they couldn't know which one was actual until the choice was made).
          *   *Insight:* It makes the "weight" of the decision heavier. It's not just imagining a story; it's selecting a reality. However, since they are causally isolated, it doesn't change the *process*, only the metaphysical status of the options.

      *   *Theory Breakdown (Policy vs. Fluctuation):*
          *   Lewis treats all possibilities equally. A world where JFK chooses war is just as real as a world where a radar glitch causes war.
          *   *Problem:* Human agency feels different from random noise. Modal Realism flattens this distinction. It doesn't privilege "choice" worlds over "accident" worlds.
          *   *Contingency:* Why did the actual bargain feel contingent? Because there are *many* counterparts making different choices. The feeling of "it could have gone otherwise" is literally true because it *did* go otherwise elsewhere.

      *   *Moral Implications:*
          *   If worlds with nuclear holocaust are real and populated by suffering counterparts, does that matter?
