      *   *Counterparts:* JFK-actual has a counterpart JFK-air-strike. They are similar but distinct individuals in a distinct concrete universe.
      *   *Decision Making:* When ExComm weighed options, they were essentially trying to navigate towards the "best" cluster of worlds relative to their actual position.

  4.  **Address the Specific Questions:**

      *   *Illuminating Psychology:* Does knowing these worlds are *real* change how we view ExComm's thinking?
