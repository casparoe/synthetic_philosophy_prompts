answer: |-
  It is a striking thought to bring David Lewis's modal realism to bear on the Cuban Missile Crisis. Usually, when we discuss those thirteen days in October 1962, we speak of 'scenarios' or 'contingencies' as if they are merely stories in the minds of the ExComm members. We say, 'If Kennedy had ordered an air strike, war might have followed.' In the standard view, that 'if' describes a fiction, a hypothetical abstraction. But under Lewis's view, that world is not a fiction. It is a concrete, physical place, just as real as the room you are sitting in now, merely separated from us by space and time.

  To analyse the crisis through this lens, we must first adjust our picture of the people involved. In modal realism, John F. Kennedy does not exist in other worlds. There is no single person who lives through multiple histories. Instead, there are counterparts. There is a Kennedy-Actual who imposed a blockade and secretly agreed to remove the Jupiter missiles from Turkey. But there is also a Kennedy-Strike, a concrete individual in a neighbouring world, who gave the order for air strikes on the Soviet sites in Cuba. This counterpart is not 'imaginary'; he is flesh and blood, living in a universe that diverged from ours perhaps days or weeks prior, or even through a tiny, sub-atomic fluctuation that altered the neural firing in Kennedy's brain.

  When we look at the ExComm meetings through this lens, the weight of their deliberation changes character. In the standard view, Robert Kennedy and his colleagues were weighing abstract probabilities. They were trying to guess the future. In the Lewisian view, they were effectively trying to locate which concrete world they were about to inhabit. Every option on the table corresponded to a real, existing universe. When they rejected the air strike, they were not merely avoiding a risk; they were distinguishing themselves from the Kennedy-Strike counterparts. The 'counterfactual reasoning' they used—asking 'what would happen if...'—was actually a form of empirical inquiry into the nature of their counterparts. They were right to fear the air strike, not because it was a likely story, but because in the concrete worlds where that choice was made, the counterparts suffered the consequences of nuclear exchange.

  However, this is where the theory begins to strain against our intuition about human agency. You asked whether the theory can distinguish between worlds that diverge through deliberate policy choices and those that diverge through microscopic fluctuations, such as a radar glitch or a U-2 pilot straying off course. For Lewis, all possible worlds are ontologically equal. A world where Khrushchev deliberately launches a missile is just as real and just as 'possible' as a world where a faulty capacitor causes a false alarm that triggers a launch.

  This creates a difficulty for how we understand history. In our actual decision-making, we feel that choices matter more than accidents. We hold Kennedy responsible for the blockade, but we would not hold a radar operator responsible for a random equipment failure in the same way. Modal realism flattens this distinction. To the modal realist, the 'choice' worlds and the 'accident' worlds are simply different coordinates in the landscape of reality. The theory struggles to explain why the actual bargain felt contingent—why it felt like Kennedy *could have done otherwise*—without implying that he actually did do otherwise elsewhere. While Lewis says this explains contingency (it is contingent because there are counterparts who did otherwise), it can make our actual choices feel less significant. If Kennedy-Strike exists regardless of what Kennedy-Actual decides, does the decision here truly matter? Lewis would say yes, because causal power is local to our world, but the psychological comfort of that answer is thin.

  This leads us to the most profound question: what does this episode show about modal realism itself, specifically regarding morality? If there are concrete worlds where the missiles flew, where Washington and Moscow are glass, and where counterparts of every person you know are suffering or dead, does that generate a moral pressure on us to be risk-averse?

  On the one hand, knowing that nuclear war is not just a hypothetical nightmare but an actualised reality for billions of counterparts might induce a sense of horror that reinforces the value of peace in our own world. It underscores that the 'abyss' they stared into was not a metaphor. However, Lewis's system includes a strict rule of causal isolation. We cannot interact with those other worlds. We cannot send aid to the suffering counterparts in the war-torn universes, nor can we warn them. Their suffering is real, but it is hermetically sealed away from us.

  Consequently, most philosophers following Lewis would argue that this generates no direct moral duty. My actions here cannot alleviate pain there. To feel bound by the suffering of a counterpart is, in a strict sense, irrational within this framework, much like feeling guilty for a crime committed by a lookalike in another country. Yet, human psychology does not always follow strict logical isolation. Knowing that 'there but for the grace of God go I' is literally true—that there are versions of us who did not survive—might cultivate a specific kind of humility. It suggests that our survival is not a necessity, but a local fact among many tragedies.

  In the end, applying modal realism to the Missile Crisis illuminates the sheer scale of what was at stake, turning 'what ifs' into 'what is'. It validates the terror the ExComm felt: they were not imagining ghosts, they were navigating a multiverse of concrete outcomes. But the theory breaks down when we try to find special meaning in human choice versus chance, and it offers little moral comfort regarding the suffering in other worlds. It leaves us with a chilling conclusion: the peace we enjoy is real, but it is surrounded by the concrete reality of our own destruction, happening just out of reach, forever silent and forever separate.
