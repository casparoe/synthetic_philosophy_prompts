answer: |-
  This is a sophisticated argument. Your roommate has essentially reconstructed a variation of Derek Parfit's *Reasons and Persons* fission cases, combined with a verificationist constraint on metaphysics, and then turned it into a *reductio* against the verificationist constraint itself (premise 8).

  You want to save **(6)**: *"Any view that generates in-principle-unanswerable first-person questions is irrationalist and should be dropped."*

  Here is the breakdown of where the argument slips, how to save (6) without collapsing into absurdity, and what the costs are.

  ### 1. The Equivocation: Epistemic Access vs. Metaphysical Determinacy

  You asked if there is an equivocation here. **Yes.** The argument slides between **Haecceitism** (the view that there is a primitive "this-ness" to objects beyond their qualitative properties) and **Qualitative Identity**.

  *   **Premise (3)** assumes Haecceitism: It claims there *must* be a hidden fact about which body is "really you" based on primitive identity.
  *   **Premise (4)** notes the Epistemic Block: You can't access that primitive fact.
  *   **Premise (5)** concludes there is an unanswerable question.

  **The Slip:** Many endurantists reject (3). They argue that in fission cases, identity is **indeterminate**. There is no hidden fact. It is not that "one is me and I can't know which"; it is that the concept of "being me" simply fails to apply uniquely in this scenario.

  If you reject (3), (5) doesn't follow, and Endurantism survives without the "occult fact." However, if you want to save (6) to *force* the rejection of Endurantism (or at least Haecceitist Endurantism), you need to refine (6) so it doesn't destroy science along with it.

  ### 2. How to Save (6): The "Explanatory Idleness" Constraint

  If you keep (6) in its raw form ("*Any* view..."), you become a radical verificationist. This kills:
  *   **Scientific Realism:** Electrons are in-principle unobservable to human senses (we only see their effects).
  *   **Other Minds:** I cannot answer the first-person question "Is my roommate conscious or a p-zombie?"
  *   **The Past:** I cannot answer "Did the world come into existence 5 minutes ago with false memories?"

  To save (6) without becoming a solipsist, you must refine it to target **Explanatory Idleness**.

  **Revised (6*):** *"Any view that generates in-principle-unanswerable first-person questions **that make no causal or explanatory difference to the world** is irrationalist and should be dropped."*

  **Why this saves the argument against Endurantism:**
  *   **In the Sleep Lab:** The "hidden fact" of which copy is the *original* makes no difference. Both copies scream, both claim to be you, both have your memories, both behave identically. The fact is **causally inert**. It does no work. Therefore, under (6*), positing it is irrational.
  *   **In Science:** Electrons are unobservable, but positing them *explains* the tracks in cloud chambers. They do causal work. Therefore, they survive (6*).
  *   **In Perdurantism:** Temporal parts are unobservable, but they explain how an object can have contradictory properties at different times (being bent at $t_1$, straight at $t_2$) without contradiction. They do explanatory work.

  **Verdict:** You can save (6) by turning it into a **Principle of Parsimony** rather than a strict Verificationist Principle. This allows you to keep Premise (7) (Perdurantism is better) because Perdurantism dissolves the "hidden fact" (both branches are equally continuations of the prior temporal parts), whereas Haecceitist Endurantism retains the idle fact.

  ### 3. Does (5) Actually Follow?

  **(5) says:** *"So endurantism commits us to a first-person identity question that is permanently unanswerable in principle."*

  This follows **only if** you accept **Haecceitism**.
  *   **Haecceitist Endurantism:** Yes, (5) follows. There is a primitive "me-ness" that travels down one branch. We can't know which.
  *   **Conventionalist/Reductionist Endurantism:** No, (5) does not follow. Identity is determined by psychological continuity and physical continuity. When those branch, identity is undefined. There is no question to answer.

  Your roommate's argument is actually an argument against **Haecceitism**, not necessarily Endurantism *simpliciter*. However, Haecceitism is often the intuitive fuel for Endurantism (the idea that I am a "whole thing" moving through time). If you drain the Haecceitism, Endurantism starts looking a lot like Perdurantism (stages connected by relations).

  ### 4. What Does Giving Up (6) Cost Us?

  If you decide (6) is too strong and drop it, here is the cost:

  1.  **Acceptance of Brute Facts:** You must accept that reality can contain facts that are forever inaccessible to any possible observer and make no difference to the causal structure of the universe. This is metaphysically "spooky."
  2.  **Loss of Critical Leverage:** You lose the ability to criticize metaphysical theories based on their empirical emptiness. If someone posits "invisible, intangible ghosts that influence nothing," you cannot say they are irrational, only that they are positing brute facts.
  3.  **Skepticism Becomes Harmless:** If unanswerable questions are allowed, then Brain-in-a-Vat skepticism is a "live option" rather than a philosophical puzzle to be dissolved.

  ### 5. Addressing the Roommate's Twist (Premise 8)

  Your roommate argues: *"If temporal parts are real but unobservable, haven't we just relocated the occult entity?"*

  This is the strongest part of their critique. If you use (6) to kill Endurantism, why doesn't it kill Perdurantism?

  **The Defense of Perdurantism:**
  Perdurantism does not posit a *hidden fact* in the fission case.
  *   **Endurantist:** "One is Me, one is Not-Me. We just can't tell which." (Hidden Fact).
  *   **Perdurantist:** "The pre-sleep stage is a part of Worm A and a part of Worm B. 'I' am the pre-sleep stage. Both future bodies are equally continuations of 'me'." (No Hidden Fact).

  Perdurantism avoids (5) entirely. It doesn't say there is an unanswerable question; it says the question is **ill-formed**. "Which one is the *real* me?" presupposes uniqueness, which Perdurantism denies in fission cases.

  **The "Temporal Parts are Occult" Objection:**
  If your roommate insists that *temporal parts themselves* are the occult entities because we don't "see" them, they are conflating **phenomenological access** with **theoretical posits**.
  *   We don't "see" gravity; we see apples fall.
  *   We don't "see" temporal parts; we see persistence and change.
  If you accept theoretical entities in physics (fields, quarks), you should accept them in metaphysics if they solve problems (like the problem of change).

  ### 6. The Bundle Theory Conclusion

  Your roommate concludes: *"This means both views collapse into some kind of anti-realist bundle theory, which he thinks is absurd."*

  **Challenge this.** Bundle Theory (the idea that objects are just bundles of properties/tropes without a underlying substratum) is **not absurd**. It is a mainstream, respectable position held by Hume, Russell, and many contemporary metaphysicians.

  *   If Endurantism fails because of hidden identities...
  *   And Perdurantism fails because temporal parts are "occult"...
  *   Then Bundle Theory (or Event Ontology) might actually be the **winner**, not the absurd fallback.

  In Bundle Theory, "you" are just a bundle of experiences and physical traits. In the fission case, the bundle splits. There is no "owner" of the bundle to worry about. There is no hidden fact. Premise (6) is satisfied.

  ### Summary Advice for Your Reply

  1.  **Save (6) by refining it:** Change it to target **explanatorily idle** facts (Haecceities), not all unobservables (electrons/temporal parts). This keeps science and Perdurantism safe while killing the "Hidden Me" fact.
  2.  **Point out the Haecceitism Trap:** Tell your roommate their argument proves **Haecceitism** is false, not necessarily Endurantism (though Endurantism often relies on it).
  3.  **Defend Perdurantism against (8):** Perdurantism doesn't generate the unanswerable question; it dissolves it. Temporal parts are theoretical posits, not occult facts.
  4.  **Rehabilitate Bundle Theory:** If the argument leads to Bundle Theory, that's a feature, not a bug. It's the most parsimonious view that satisfies (6).

  **The Cost:** If you save (6) this way, you are committing to a metaphysics where **identity is not fundamental**. You are saying "what matters" is psychological continuity and causal connection, not "being the same object." That is a significant philosophical commitment, but a defensible one.
