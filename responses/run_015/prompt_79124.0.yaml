answer: |-
  You have nailed the mechanics of the Frankfurt case. Your understanding of how they work is spot-on: the agent acts on their own, the intervener stays idle, and yet the agent seemingly lacks alternative possibilities (PAP) but remains responsible.

  You have also identified what many philosophy students realize after learning about Frankfurt cases: **"If responsibility doesn't require the ability to do otherwise, then determinism (which removes the ability to do otherwise) shouldn't kill responsibility."**

  It feels like a checkmate. So, why are philosophers still arguing? Why didn't Harry Frankfurt solve the free will debate in 1969?

  The short answer is: **Frankfurt cases kill the Principle of Alternative Possibilities (PAP), but they do not kill Incompatibilism.**

  Here is why the debate is still very much alive.

  ### 1. The Shift from "Leeway" to "Sourcehood"
  Before Frankfurt, the debate was largely about **Leeway Incompatibilism**: *You need alternative possibilities to be free.* Frankfurt showed that maybe you don't.

  However, Incompatibilists simply shifted their ground to **Sourcehood Incompatibilism**. Their argument is now: *Even if you don't need alternative possibilities, you must be the **ultimate source** of your action.*

  *   **In a Frankfurt Case:** The neuroscientist is lurking in the background, but the *actual* cause of the action is the agent's own desire/decision. The agent is still the source.
  *   **In Determinism:** The cause of your action traces back to the Big Bang and the laws of physics. You are just a link in a causal chain that started before you were born.

  Many philosophers argue that in the Frankfurt case, the agent is still the "author" of the deed. In a deterministic universe, the universe is the author, and you are just the pen. Frankfurt cases don't address this worry about ultimate origination.

  ### 2. Counterfactual vs. Actual Constraints
  There is a crucial structural difference between a Frankfurt intervener and Determinism.

  *   **Frankfurt Case:** The constraint is **counterfactual**. The neuroscientist *would* have intervened if you hesitated, but since you didn't hesitate, they did nothing. The actual sequence of events is untouched by the intervener.
  *   **Determinism:** The constraint is **actual**. The past and the laws of nature are *actually* pushing you to make the decision right now.

  Incompatibilists argue that a counterfactual blocker (Frankfurt) doesn't rob you of control because it never touches you. But an actual causal blocker (Determinism) *does* touch you; it constitutes your very psychology. If your thoughts are determined by prior causes, your "own desire" (which Frankfurt relies on) is itself determined.

  ### 3. The Manipulation Argument
  This is the biggest hurdle for the "Frankfurt solves everything" view.

  If you argue that the Frankfurt agent is responsible because "he did what he wanted," Incompatibilists ask: **What if he was manipulated into wanting that?**

  Imagine a "deterministic Frankfurt case" where a team of neuroscientists programs your brain from birth to ensure you choose A. You choose A on your own. They never intervene.
  *   **Compatibilist:** You did what you wanted; you are responsible.
  *   **Incompatibilist:** That's just covert manipulation. If determinism is true, *everyone* is in this position. The past and laws of nature "programmed" you.

  If you say the Frankfurt agent is responsible, you have to explain why a manipulated agent (who also does what he wants) *isn't*. If you can't draw a line between the Frankfurt agent and a subtly manipulated agent, then Frankfurt cases might prove too much.

  ### 4. The Consequence Argument
  Even if PAP is dead, Peter van Inwagen's **Consequence Argument** is still standing. It doesn't rely on "could have done otherwise" in the simple sense; it relies on the transfer of non-responsibility.

  The gist:
  1.  No one is responsible for the past.
  2.  No one is responsible for the laws of nature.
  3.  If determinism is true, our actions are the necessary consequences of (1) and (2).
  4.  Therefore, no one is responsible for our actions.

  Frankfurt cases attack the idea that responsibility requires options. They do not attack the idea that responsibility requires control over the causes of your actions. The Consequence Argument suggests we lack that control under determinism, regardless of Frankfurt cases.

  ### 5. Some Incompatibilists Reject Frankfurt Cases
  It is worth noting that not everyone agrees you "get" Frankfurt cases correctly (no offense!). Some philosophers (like David Widerker and Robert Kane) argue that Frankfurt cases are incoherent.

  They argue that for the neuroscientist to know *when* to intervene, there must be some "flicker of freedom"—a prior sign or decision that the agent makes freely before the intervention. If that prior sign exists, then the agent *did* have an alternative possibility (the possibility of showing the sign vs. not showing it). If that prior sign is determined, then the neuroscientist can't know when to intervene without violating the setup.

  This is technical, but it means some philosophers still fight on the grounds that PAP hasn't actually been refuted.

  ### Summary
  You are right that Frankfurt cases were a massive earthquake in philosophy. They destroyed the simplest version of the Incompatibilist argument (PAP).

  But they didn't destroy the building. Incompatibilists just moved to the second floor (**Sourcehood**) and the third floor (**Ultimate Origination**).

  Philosophers are still going on about it because Frankfurt cases show that **alternative possibilities** might not be necessary for responsibility, but they don't prove that **causal determination** is compatible with responsibility. The debate shifted from "Can we do otherwise?" to "Are we the true authors of our actions?"—and that question is much harder to solve.
