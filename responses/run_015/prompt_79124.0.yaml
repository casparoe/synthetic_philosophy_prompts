      *   *Are there Frankfurt-style compatibilists?* Yes.
      *   *Are there Frankfurt-style incompatibilists?* Yes (those who argue FCs don't work or rely on covert APs).
      *   *Make sure not to say "You are wrong."* Say "You've hit on a major insight, but here's why it's not the whole story."

  7.  **Final Polish:** (Reviewing against the generated output)
