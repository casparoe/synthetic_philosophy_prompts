      *   **Context:** User had an argument after a pub talk, tired, writing on phone (acknowledge typos casually if needed, but maintain professionalism).

  2.  **Deconstruct the Philosophical Debate:**
      *   **Moral Generalism:** Moral principles exist and are necessary for moral judgment. Actions are right/wrong because they fall under general principles (e.g., "Lying is wrong"). Context matters, but only in applying the principle.
      *   **Moral Particularism:** Moral principles are either non-existent or unnecessary. Moral judgment is case-by-case, sensitive to the specific context. A feature that is a reason in one case (e.g., lying) might not be a reason in another (e.g., lying to save a life), without needing a higher-order principle to explain the shift.
      *   **Key Tension:** Can you codify morality like a law code, or is it more like professional discretion based on the specific file?

  3.  **Map to Archival Vocabulary:**
      *   *Generalism:* The Written Ordinance / The Zoning Code. The idea that every decision *should* be traceable back to a standing rule. If you approve a demolition, there must be a code section that permits it.
      *   *Particularism:* The Approved Exception / The File Itself. The idea that the specific details of *this* building, *this* tenant, *this* year matter more than the code. Sometimes the code is ignored because the specific situation demands it, without needing a new code to justify the ignore.
      *   *Exception Logs:* Where Generalism tries to capture Particularism (recording the deviation as a new rule-like entry).
      *   *Precedent Folders:* Where Particularism tries to look like Generalism (using past cases as guides, not rules).

  4.  **Drafting the Mapping (Iterative Process):**

      *   *Generalism:* "The Code is King." Every decision must cite a section. If you can't cite a section, the decision is invalid. Morality is like a master zoning plan.
      *   *Particularism:* "The File is King." The code is a guideline, but the specific building's condition (the context) determines the decision. Sometimes you approve a demolition even if the code says 'no', because *this* building is dangerous, without needing to rewrite the code first.
      *   *Clean Maps:* Generalism = The Ordinance Book. Particularism = The Discretionary Stamp on a specific permit.
      *   *Distorted Maps:* Precedent. In law/archives, precedent *becomes* a rule (stare decisis). In particularism, past cases inform but don't bind. This is a slight distortion.
      *   *No Equivalent:* Moral Motivation/Emotion. Archives deal with records of decisions, not the *feeling* of why the archivist cared. Also, the idea of "holism of reasons" (a feature changing valence) is hard to file. In archives, a violation is usually still a violation, just waived. In particularism, the feature itself might stop being a negative reason.

  5.  **Developing the Residue Report:**
      *   What's left over? The *normative force*. Why *should* we follow the code? Why *should* we care about the specific case? Archives record what *was* done, not necessarily what *ought* to have been done (though there's an implied ought).
