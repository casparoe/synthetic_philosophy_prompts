answer: |-
  Consider two isolated agrarian societies, A and B, possessing identical technology, legal frameworks permitting private capital accumulation, initial resource endowments, and class stratifications. In Society A, a secularized ethos of inner-worldly asceticism prevails, wherein disciplined labor and rational accounting are construed as intrinsic moral duties and social prestige is awarded solely for demonstrable reinvestment, whereas in Society B, accumulation is culturally coded as morally ambiguous, prestige derives from ritual mastery and communal redistribution, and leisure carries no stigma. An engineered exogenous shock, such as a sustained ecological degradation, subsequently renders further capital accumulation materially disadvantageous for all individuals, imposing negative marginal returns and legal costs on reinvestment, yet Society A persists in disciplined rational accounting and reinvestment for at least two generations despite the individual cost and absence of hidden consumption benefits, while Society B immediately redirects surplus toward ritual expenditure and consumption.

  This scenario satisfies the design specifications by forcing divergent theoretical verdicts based on the observed behavioral persistence in Society A. (i) The Weberian "elective affinity" account delivers a verdict of independent causal efficacy, arguing that the internalized value-orientation possesses sufficient autonomy to sustain rational economic conduct even when the material incentive structure inverts, proving culture is not merely a reflection of interest. (ii) The materialist-reductionist account delivers a verdict of epiphenomenalism, asserting that values must dissipate once incentives turn negative; therefore, A's persistence indicates either a misdescribed hidden material interest (such as elite consolidation) or a temporary cultural lag that will inevitably correct. (iii) The functionalist account delivers a verdict of adaptive stabilization, arguing that values cannot drive genuinely maladaptive conduct; thus, the functionalist must contend that A's persistence is not truly maladaptive but serves a latent group-level selection function, such as maintaining social cohesion during crisis.

  The precise structural feature that does the causal work is the combination of inverted material incentives (negative marginal returns and legal costs on accumulation) with identical institutional frameworks. This inversion isolates culture as the only remaining variable capable of explaining the divergence in behavior. If this feature is removed and incentives remain positive, the scenario collapses into an underdetermined correlation: both the Weberian and materialist accounts can explain Society A's behavior equally well, as accumulating capital is both culturally valued and materially beneficial, making it impossible to distinguish whether values drive behavior or merely reflect interest.

  A reductionist defender would likely attack the scenario by alleging that the "moral duty" framing in Society A disguises a continuing class interest—perhaps the elite benefit from the labor discipline of the lower classes despite aggregate economic loss—or that the cost structure has been mischaracterized by ignoring "psychic income" derived from moral satisfaction. The explanatory cost of this defense is severe: it risks rendering materialism unfalsifiable by ad hoc postulation of hidden interests whenever behavior contradicts observable material incentives, thereby weakening the theory's empirical rigor and predictive power.
