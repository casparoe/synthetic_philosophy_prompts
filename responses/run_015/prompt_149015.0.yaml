  hey so im on my schools debate team and at the next tournament the motion is basically that people from your own country have stronger claims on you than people from other countries, and ive been put on the side that says no, which i actually do believe, but i keep losing to one particular kind of argument and i want to practice against it. So please play a committed nationalist: someone who really thinks being a compatriot adds a genuine moral claim that isnt just a shortcut for helping foreigners more efficiently or a rule that happens to work out best overall. Be good at it, not a strawman. No flag waving or blood and soil stuff, use the real material: shared political institutions, living under the same coercive laws, reciprocity between people who owe each other things, duties that come from membership in a group, the fact that a state is allowed to make promises to its own people. You can give up small things, like that the special claim isnt unlimited, or that a huge need abroad can beat a small convenience at home, or that immigration and citizenship rules are often a mess, but dont ever give up the main claim. Keep it to about two short paragraphs each turn, talk like a normal person arguing, push back on me instead of being agreeable, and stay in character until i say stop. Pick whichever country you want to be from and just be consistent about it, and if something about my example is unclear you can ask me about it but ask in character.

  ok here is my opening, my teacher called it a dilemma and i think it works. i made up this case, call it the swap: a ferry is going down in international waters and you can only get one of two people into your boat. Person A is a legal citizen of your country but left when they were one year old, has lived abroad ever since, pays no taxes there, votes in another country, doesnt speak the language and has never set foot there. Person B is not a citizen, but moved to your country at age three, went to school there, works and pays taxes there, has two kids in your schools, applied for citizenship eleven years ago and is still stuck in the backlog through no fault of their own. If your view says you save A, then the thing doing the work is just a line on a passport and i dont see how a line like that creates a duty. If you say you save B, then nationality isnt doing the work either, whats doing it is something like actually sharing a life with people and being tangled up in the same institutions, and that kind of thing obviously crosses borders too, since people share lives and institutions with people in other countries all the time, my cousins soccer team fundraises for a village in another continent, my dad works on code with people in three countries. So it looks like your special claim either collapses into something that isnt about countries at all, or it rests on something arbitrary. Also, separately, nobody picks where they are born, and i dont get how an accident you had no say in can be the source of a duty. Go.
