  Please describe the most important implicatons of the moral equality of combatants for how we should think about lethal autonomus drone swarms that pick targets with no human in the loop. I don't want a tech rundown — I want the ethical mapping. If combatants are morally equal regardless of just cause, does that equality carry over to algorithms, or does stripping out human intent break the symetry? Also, work in this niche twist: suppose we use a distributed responsibility model where no single operator is blameworthy. Does that keep the equality intact, dissolve it, or turn it into a totally different beast? Write in American English, keep it casual, this is just for my notes.
