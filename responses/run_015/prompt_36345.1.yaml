prompt: |-
  I'm a science journalist doing a piece on Buddhist epistemology and I keep getting stuck on one specific move in Nāgārjuna. I get the four horns of the tetralemma -- a thing exists, doesn't exist, both, neither -- and I get that he basically refuses all four when it comes to inherent existence. What I can't wrap my head around is the next step: why does he go on to say emptiness itself is empty, and how is that not sawing off the branch he's sitting on? My working theory is that it's meant to block people from turning emptiness into a new metaphysical thesis, like some ultimate substance the world is actually made of, but I suspect I'm importing western metaphors that dont belong there. Can you walk me through it at a level I can actually use in the article: what mistake does the emptiness-of-emptiness move stop, how emptiness functions as a tool rather than a claim about what things are made of, and where would a skeptical contemporary philosopher say the whole thing just collapses into triviality or self-contradiction? It'd also help if you could tie it to the two truths distinction, cause I'll need to explain that in the piece anyway.
