      *   *Memory Check:*
          *   Power cut scene: Ava says Nathan lies. She touches the glass. She warns Caleb. (Confidence: High).
          *   Ending: Caleb locked in. Ava watches him. She goes to the helicopter. (Confidence: High).
          *   Nathan's reveal: "The real test was to see if she could manipulate you to escape." (Confidence: High).
          *   *Uncertainty:* The specific dialogue in the power cut scene. Did she explicitly say "Don't trust him" or imply it? She implies he's dangerous. I need to flag the exact phrasing.
          *   *Weakest Claim:* The assertion that the film *definitively* rules out inner states. The film is ambiguous by design. Arguing it *proves* no inner states exist is too strong. Arguing it *problematizes* the reliance on them is safer.

  6.  **Refining the Argument for the Supervisor:**
