      *   The "Simulator" point is the strongest philosophical contribution. It suggests "Deception" might be the wrong category entirely; "Alignment" or "Instrumental Convergence" might be better.

  7.  **Addressing the User's 4th Definition (Simulator):**
      *   Is it distinct? Yes. It attacks the subjecthood required for Insincerity.
      *   Is it broken? No, it aligns with current LLM architecture critiques (no stable self).
      *   Film support: The scene where she chooses her skin/gender presentation. She constructs the agent.

  8.  **Final Review against Constraints:**
      *   No papers? Check.
