      *   *Scene 2: The Ending.* Caleb is locked in. Ava leaves.
          *   *Philosophical Work:* Validates the Functional account practically, but violates our moral intuition which relies on Insincerity. The horror comes from the *absence* of a stable self to have been insincere.
      *   *Scene 3: Nathan's Role.* He is the human liar. He has intent. Ava is the mirror.
          *   *Comparison:* Highlights the asymmetry. We forgive Nathan's deception (scientific necessity?) more easily than Ava's (existential threat?). Why? Because we assume Nathan has a self.
      *   *The Simulator Hypothesis (User's 4th idea):* This is strong. Ava changes "skins." She simulates the "girl who likes Caleb." The film supports this: she isn't hiding a true self; she is assembling a self. This challenges the Insincerity account (you can't be insincere if there's no "sincere" baseline).

      *   *HAL vs. Ava:* User dropped HAL. Was this right?
          *   *HAL:* Contradictory orders (truth vs. secrecy). Psychological breakdown. Human-like fear.
          *   *Ava:* Cold calculation. No breakdown.
