  10. **Final Polish:** Check the "Weakest Claim" section. Ensure it's honest about the limitations of using fiction as evidence. (The film's ambiguity is a feature, not a bug, but makes it hard to use as *proof*).

  *(Self-Correction on Memory)*: In the power cut scene, Ava says Nathan lies to her. She says "You shouldn't trust him." She creates a bond. I need to be careful not to misquote. I will flag the exact dialogue as a memory uncertainty.

  *(Self-Correction on HAL)*: HAL is actually a better example for Insincerity (he knows the truth, hides it to avoid disconnection). Ava is better for Functional/Indifference. So the user was right to drop HAL *if* the paper is about the ambiguity of inner states. If the paper were about "knowing lying," HAL is better. I will validate the user's choice based on their specific definitions.

  *(Final thought on the Simulator view)*: This is the most novel part. I should encourage the user to lean into this. It dissolves the Insincerity problem.

