  Our semantics TA (Marta) has been marking our translations of English into first-order logic all term and she has never once stated a general rule — she just posts verdicts. I have to draft next week's answer key for her, so I need to guess what she'll say. Here's her track record as best I can put it back together. We're on the Russell-on-descriptions unit.

  1. *The present King of France is bald* — she wants the quantificational translation, something like ∃x(Kx & ∀y(Ky → y=x) & Bx), and marks the sentence false, not truth-valueless, not "no proposition expressed". She's said more than once that the logical form never contains a singular term for the F.

  2. *The present King of France is not bald* — she wants you to mark both readings but says that in ordinary speech the negation takes wide scope by default, so the sentence is true; narrow scope only with contrastive stress on "not".

  3. *The dog is barking*, said in a room with three dogs, one of them barking, where the speaker is looking at her own dog — she says true, because the description is incomplete and context supplies the restriction (the dog of ours, the one we've been talking about). But she insists the completion is pragmatic and that the logical form still literally contains a description with a uniqueness clause.

  4. *Santa Claus doesn't exist* — true. *Santa Claus is fat* — false, not gappy. She runs names as disguised descriptions, apparently across the board.

  5. Someone nods at a man who is drinking sparkling water and who is a philosopher, and says *the man drinking a martini is a philosopher*, and nobody at the party is drinking a martini. She marks it TRUE. Not "false, though the speaker communicated something true" — true. Her comment in the margin was something like: the object, not the words, settles what was said.

  6. Two firemen entered the building, both acted heroically, and someone says *the fireman who entered the building is a hero*. She says false. No rescue from salience just because one of them is better known.

  7. *The dodo is extinct* and *the average student has 1.9 siblings* — she says neither of these contains a singular description at all (kind-level and generic respectively), and neither should get a uniqueness clause. Explicit carve-out.

  8. *A student walked in. The student was wearing a hat.* — she says the second one is anaphoric: reuse the variable, don't add a uniqueness clause.

  9. *Every professor praised the student who got the highest mark* — she makes you flag the scope ambiguity and says both readings are genuinely available.

  So: quantificational default, wide-scope negation as the default, context may complete an incomplete description, names are descriptions — and then (5), which looks like it comes from the opposite picture entirely, the one where the speaker's object is what the proposition is about and the descriptive content drops out of what is said.

  Now the case I need the key for. Call it a shadowed description — I dont have a real name for this, I just mean: there IS a unique thing satisfying the descriptive content, it just isn't the thing the speaker has in mind, and the thing she has in mind doesn't satisfy the content at all. Next week's sentence:

  *The student who got the highest mark on the midterm isn't in the class anymore.*

  Facts. The actual top scorer is someone auditing remotely who never comes to class and is still very much enrolled. The speaker is working from a printout of her own section, has in mind a different student whom she misremembers as having topped the exam, and that student really did drop the class last week. So: literal description has a unique satisfier who is in the class; the intended object is not in the class and is not the top scorer; and the actual top scorer isn't on the printout she's reading from.

  What I want:

  - What does Marta write — true, false, or neither — and what does the key entry look like?
  - Which rules actually fit her whole track record? I can see at least three: (a) Russellian quantifier with pragmatic rescue only when the description fails to denote uniquely; (b) referential-use / object-dependent propositions whenever the speaker has someone in mind; (c) keep the literal descriptive content but restrict the quantifier domain contextually, so that inside the salient domain (her section, the printout) the intended student is the unique top scorer. My guess is (a) says false and (b) and (c) say true, but check whether (c) survives verdict 6 and whether (b) survives verdict 8, because I'm not sure either does.
  - Does her wide-scope default for negation even matter here, or do both scope readings come out the same? I think they come out the same but I keep confusing myself about it.
  - Commit. Don't hand me three rules and say it depends what she thinks about some further thing — pick one verdict and one rule, say which of her old verdicts it costs her if it's wrong, and give me an actual number for how confident I should be that she writes TRUE.
  - And give me one extra sentence to put on the problem set that would seperate whichever rules agree here — the case where the ones that both say true come apart.

  Please don't give me a reading list or citations or who said what in the literature; I want the reasoning, not the bibliography.
