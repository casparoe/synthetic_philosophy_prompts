answer: |-
  To set this up for your fourteen students, you will need to prepare seven pairs of envelopes before class begins, ensuring each pair contains two amounts where one is exactly double the other. For the arithmetic to remain effortless during the heat of the decision, stick to powers of two starting at a base that makes the fee feel negligible but accumulative. I recommend using play money denominations of twenty, forty, eighty, and one hundred sixty dollars for the smaller envelope, meaning the paired larger envelopes will contain forty, eighty, one hundred sixty, and three hundred twenty dollars respectively. You should distribute these pairs randomly among the seven dyads, perhaps repeating the set twice so you have enough variations, or simply drawing the smaller amount from a hat containing those four values for each pair. The key is that every student holds an envelope without knowing whether it is the larger or smaller of the two, and they must not open them until the very end of the session. You will act as the broker, standing at the front of the room with a collection box for fees, and your goal is to facilitate swaps while maintaining the illusion of a neutral service provider. The fee should be set at five dollars per swap, which is low enough that a potential twenty-five percent gain feels worth the risk but high enough that repeated trading will visibly deplete their fictional wealth over the course of the seminar.

  The timeline for the seventy-five-minute block should be tightly managed to ensure you reach the debrief while the tension is still fresh. Spend the first ten minutes handing out the envelopes and establishing the rules, emphasizing that the envelopes remain sealed until the final reveal. From minute ten to minute thirty, run the first phase of the game where you pitch the swap. Your pitch needs to be smooth and devoid of technical jargon, focusing entirely on the immediate expected value calculation. Tell them that whatever amount is in their hand, call it X, the other envelope contains either 2X or 0.5X with equal probability, making the expected value of the other envelope 1.25X. Remind them that the five-dollar fee is a small transaction cost compared to the expected upside, and offer them multiple rounds to trade. To track the swaps without cumbersome paperwork, simply require that any student who wants to swap must hand you the five-dollar fee in play money, and you will physically exchange their envelope with their partner's envelope only if both partners in the dyad submit the fee simultaneously. This requirement forces the symmetry issue into the open, as both students must independently decide that the swap is in their favor at the exact same moment.

  Around the thirty-minute mark, stop the trading and move into the second phase where you reveal the prior distribution used to generate the amounts. Tell them explicitly that the smaller amount in any pair was drawn from a finite set containing only twenty, forty, eighty, and one hundred sixty dollars. Ask them to recalculate the expected value of swapping based on this new information, specifically prompting them to consider what happens if they are holding the maximum possible amount of three hundred twenty dollars or the minimum possible amount of twenty dollars. This is where the collapse should happen visibly. The student holding three hundred twenty dollars now knows with certainty that the other envelope contains one hundred sixty, so the probability of doubling is zero, not fifty percent. Similarly, the student holding twenty knows the other must be forty. Have them discuss this in their pairs for ten minutes, focusing on how the flat fifty-fifty assumption fails at the boundaries of the distribution. From minute fifty to the end, lead the debrief by connecting their visceral experience of losing money on fees to the mathematical error they just identified. Walk them through how the initial argument smuggled in an assumption of a uniform prior over an infinite range, which is impossible, and highlight the symmetry contradiction where both partners cannot simultaneously hold an envelope with a higher expected value than the other.

  You should anticipate several failure modes that could derail the experiential learning you are aiming for. The most common issue is the student who has encountered the paradox before and instinctively wants to announce the solution to the room. To handle this, speak to the class generally before starting and ask anyone who thinks they know the puzzle to hold their insight until the debrief, framing it as a favor to their peers who need to feel the confusion to learn from it. If a student blurts it out anyway, acknowledge their contribution but pivot immediately back to the game, asking them to play along with the flawed reasoning so the rest of the class can see why it feels so compelling. Another risk is the pair who refuses to trade on principle, perhaps suspecting a trick or simply being risk-averse. If this happens, do not force them, but use them as a counterexample during the debrief by asking the class why those students resisted the expected value argument when everyone else was bleeding fees. A more subtle failure mode is that the students might become suspicious of you as the broker rather than suspicious of the argument. They might think you are manipulating the envelopes or that the fee is a scam. To mitigate this, be transparent about the distribution early in phase two and invite them to verify the amounts in the envelopes at the end to prove the ratios were honest. The goal is to make the fee the villain, not you, so emphasize that you are merely facilitating the market they created.

  There are also limitations to what this game can reproduce that you will need to address verbally during the debrief. The primary limitation is that the classic two-envelope paradox often relies on an improper prior distribution that allows for infinite expected values, whereas your game uses a finite set of amounts. The game successfully demonstrates the error in conditional probability and the symmetry contradiction, but it does not fully capture the measure-theoretic issues that arise when the possible amounts are unbounded. You will need to explain that in the real world, or in the theoretical limit, there is no probability distribution that makes the fifty-fifty assumption hold for every possible value X they could open. Additionally, the game relies on the fee to make the loss tangible, whereas the theoretical paradox shows a loss even without a fee because the expected value calculation itself is incoherent. You will have to clarify that the fee was a pedagogical tool to accelerate the feedback loop, not a necessary component of the logical error. Finally, be prepared for the possibility that some students will walk away thinking the lesson is simply about avoiding transaction costs rather than understanding the probabilistic flaw. Reinforce during the closing remarks that even with a zero fee, the reasoning that the other envelope is always better is what breaks reality, and the money they lost was just the physical manifestation of that logical inconsistency.
