answer: |-
  Dear Friend,

  I have read your account of the resolute position regarding the absent-minded driver with great interest. It is a compelling stance because it preserves a robust notion of agency, treating the driver as a unified entity over time rather than a sequence of temporal slices with conflicting interests. By insisting that rationality consists in selecting the ex-ante optimal tendency and adhering to it without reconsideration, you protect the integrity of planning against the erosion of dynamic inconsistency. However, to test the durability of this view, we must subject it to variations that stress the relationship between prior commitment and present circumstance. I will walk you through three specific variants of the case you described, assessing what each reveals about the vulnerabilities of resoluteness, before turning to the broader theoretical implications and the question of whether the view risks becoming unfalsifiable.

  Consider first a version of the case where the driver has the option to pay a small cost to leave a mark. Suppose that before the trip, the driver knows that at the first intersection, they could spend a negligible amount of their potential payoff, say 0.1 units, to leave a visible mark that would allow them to distinguish the second intersection from the first. If they mark the first intersection, they will know with certainty when they arrive at the second one, allowing them to exit with probability one at the second intersection and achieve the high payoff of four, minus the cost, for a net of 3.9. The ex-ante optimal plan without marking yields an expected payoff of roughly 1.33. Clearly, the plan that includes marking dominates the plan that does not. A resolute driver who, before the trip, calculated that marking was too costly or simply failed to include it in their plan would, upon arriving at the first intersection and realizing the option exists, face a dilemma. If resoluteness forbids deviating from the ex-ante plan to take advantage of this opportunity, the theory prescribes an action that leaves value on the table. This reveals a structural failure in the resolute position if it treats prior commitment as binding even in the face of new opportunities that were foreseeable but not optimized for. A defender might argue that a truly rational resolute agent would have included the marking in the ex-ante plan, but this pushes the problem back one step. If the option to mark arises unexpectedly, or if the cost was uncertain ex-ante, strict resoluteness demands ignoring a clearly superior local option. This suggests that resoluteness conflates rational planning with rigid inflexibility, incurring a cost that is not merely acceptable but rationally indefensible, as it violates the principle that agents should respond to available information to maximize utility.

  Now consider a variant with three indistinguishable intersections instead of two. Let the payoffs be zero for exiting at the first, zero for exiting at the second, four for exiting at the third, and one for missing all three. The ex-ante calculation here favors a much lower tendency to exit, roughly one-ninth, to ensure the driver survives long enough to reach the third exit. However, imagine the driver arrives at an intersection. Given the low exit probability required by the plan, the driver should reason that they are statistically more likely to be at the first intersection than the third. If they are at the first, exiting yields zero. If they are at the third, exiting yields four. The tension here is sharper than in the two-exit case because the divergence between the ex-ante strategy and the ex-post belief about location is more extreme. A resolute driver ignores this probabilistic reasoning and exits with the pre-set one-ninth tendency. The vulnerability here is an implausible prediction about what the driver will feel and do. It requires the driver to suppress the natural Bayesian inference that being at a node provides evidence about which node it is, based on the survival probability of the plan itself. While a resolute theorist might accept this as a cost of maintaining agency unity, it strains the connection between rationality and truth-tracking. If the driver's belief that they are likely at the first intersection is correct, acting as if they are at a generic intersection ignores the specific stakes of their current location. This does not necessarily disqualify the theory, but it highlights that resoluteness demands a form of epistemic blindness that becomes harder to justify as the sequence of decisions lengthens.

  A third variant involves a driver who can anticipate a predictable pattern of future reconsideration. Suppose the driver knows that they are psychologically prone to anxiety and that upon reaching any intersection, they will inevitably recalculate and prefer to exit with a probability of one-half, driven by a fear of missing the destination entirely. The ex-ante optimal plan is still the one-third tendency. A sophisticated driver, anticipating this weakness, would recognize that the one-third plan is not sustainable and might choose a different ex-ante strategy that accounts for their future defection, perhaps accepting a lower overall payoff to align with what they know they will actually do. The resolute driver, however, insists on adopting the one-third plan and attempting to stick to it. This scenario tests the limits of personal persistence and responsibility. If the driver fails to stick to the plan, the resolute theorist must say the driver was irrational for failing to be resolute. But if the driver's psychology makes resoluteness impossible, the theory prescribes an impossibility. This is a genuine liability that defenders of resoluteness, such as Edward McClennen, would likely acknowledge. They argue that rationality includes the capacity for willpower, but if the theory cannot distinguish between a failure of rationality and a failure of psychological capacity, it loses its normative grip. In this case, the resolute position risks blaming the agent for a lack of capacity rather than guiding them toward the best achievable outcome. It suggests that resoluteness is not just a theory of choice but a theory of character, which limits its applicability as a general account of rational agency.

  Turning to the broader context, formal work on imperfect recall, particularly by Piccione and Rubinstein, argues against resoluteness by highlighting that the driver's information set at the intersection is not identical to the information set at the start. At the start, the driver knows they are at the start. At the intersection, they know they are at an intersection but not which one. This change in indexical knowledge should, according to standard decision theory, license a recalculation of probabilities. Resoluteness effectively denies that this shift in perspective carries normative weight. Comparisons with ordinary cases of planning and temptation, such as Ulysses binding himself to the mast, initially favor resoluteness. Ulysses binds himself because he knows his future preferences will change due to external influence (the Sirens). However, in the driver case, the preferences do not change; only the information and the causal position change. The driver at the intersection wants the same thing as the driver at the start. This makes the resolute prohibition on reconsideration feel more like self-coercion than self-protection. Intuitions about personal persistence suggest that while we are the same person over time, our rational obligations are sensitive to our current epistemic state. To ignore the current epistemic state in favor of a past calculation is to treat the present self as a mere instrument of the past self, which conflicts with the idea that each temporal stage of an agent has a claim to rational autonomy.

  This leads to the crucial question of whether the resolute view stakes anything on how these cases turn out or whether it can absorb any outcome. There is a significant risk that the view is flexible enough to be vacuous. If a driver adheres to the plan, the resolute theorist calls them rational. If they deviate, the theorist calls them irrational or not truly resolute. If they deviate because of a new option like the marking case, the theorist might argue the ex-ante plan was flawed for not including a contingency for such options. This ability to retrofit the definition of the "optimal plan" to include any successful deviation allows the theory to absorb any outcome. For the view to be substantive, it must specify conditions under which reconsideration is forbidden that are independent of the outcome. It must claim that reconsideration is irrational even when it leads to a higher payoff, simply because it violates the ex-ante commitment. But as the marking variant shows, this leads to prescriptions that are clearly suboptimal. If the resolute theorist concedes that reconsideration is permitted when it clearly dominates the plan, they collapse into the sophisticated view they oppose. If they do not concede, they defend a notion of rationality that is detached from success.

  Therefore, my judgment is that the resolute view as you have stated it does not stake enough on how these cases turn out because it relies on a definition of the plan that can be adjusted to excuse deviations or condemn successes based on whether they fit the prior commitment. This flexibility should worry someone attracted to the view because it insulates the theory from empirical or intuitive counterexamples. A theory of rational agency should guide action toward good outcomes, not merely enforce consistency with past intentions unless those intentions are protected by a separate moral or prudential value. In the driver case, the only value at stake is the payoff. If resoluteness lowers the expected payoff or ignores opportunities to raise it, its claim to rationality is weakened. The vulnerabilities revealed by the marking variant and the three-intersection variant suggest that resoluteness is structurally fragile when faced with new information or complex probability structures. While it offers a comforting vision of a unified self, it purchases that unity at the price of ignoring the rational demands of the present moment. A more robust account of agency under imperfect recall would likely blend the resolute commitment to long-term goals with a sophisticated sensitivity to the information available at the point of action, allowing for reconsideration when the epistemic situation fundamentally shifts, rather than demanding a blind adherence that risks rendering the agent a slave to a past calculation that no longer fits the world they find themselves in.

  I hope this assessment helps you weigh the costs of the resolute position against its theoretical elegance. The tension between the planner and the actor is central to our understanding of agency, and while resoluteness takes the side of the planner, the variants suggest the actor has legitimate claims that cannot be ignored without distorting the nature of rational choice.

  Sincerely,

  Your Correspondent
