answer: |-
  ### Host Stance: Does the "Bottleneck" Save CSR?

  **Yes, the "Doctrinal Bottleneck" significantly inoculates the Cognitive Science of Religion (CSR) against the "just-so story" charge, but only if your guest treats it as a mechanism of *cultural* evolution rather than *cognitive* adaptation.**

  The standard criticism of CSR is that it relies on untestable hypotheses about the Pleistocene environment to explain modern belief (e.g., "HADD helped us avoid lions, so now we believe in ghosts"). That is historically unfalsifiable. Your guest's bottleneck model shifts the explanatory weight from the *origin* of the capacity to the *stabilization* of the institution. We have historical records of creeds, hierarchies, and canonical texts. We can observe when they form and when they fracture.

  By arguing that world religions survive *despite* raw cognitive outputs rather than *because* of them, she moves CSR away from speculative evolutionary psychology and toward observable historical sociology. It saves the field from being a collection of origin myths by providing a testable filter: if the bottleneck theory is right, we should see religious institutions collapse or fracture whenever they lose the capacity to suppress spontaneous revelation in favor of standardized dogma. That is a falsifiable claim.

  ***

  ### Interview Questions

  **1. The Mechanism of Suppression**
  You describe the "Doctrinal Bottleneck" as a filter that suppresses raw cognitive outputs like visions or possession in favor of creeds and texts. Is this filtering process primarily top-down (elites imposing structure to maintain power) or bottom-up (communities self-organizing to reduce cognitive dissonance)? If it's the latter, what cognitive cost is the average believer paying that requires this suppression?

  **2. The Persistence of Mysticism (Required)**
  If the survival of world religions depends on filtering out spontaneous religious experiences, how do you account for the persistence of mysticism, sainthood, and charismatic renewal *within* highly institutionalized settings? History suggests institutions don't just eliminate these experiences; they often curate them.
  *   **Follow-up:** If you argue that institutions "curate" or "sublimate" these experiences to serve doctrinal ends, doesn't that imply the institution is parasitic on the very cognitive phenomena it claims to regulate? At what point does curation become fabrication?

  **3. Normativity and "True" Religion (Required)**
  Your model draws a sharp line between "raw" cognitive religious outputs and "filtered" institutional religion. Does this distinction imply a normative hierarchy where the unfiltered, charismatic mode is more "authentic" or "true" to human cognition than the doctrinal mode? Or are you suggesting that the bottlenecked version is the only one evolutionarily viable?
  *   **Follow-up:** If you claim both are "natural" and neither is more authentic, does the concept of the "bottleneck" lose its critical edge? If the filter is just as natural as the flow, why use the language of filtration rather than simply describing two different cognitive modes?

  **4. Evolutionary Psychology and Cooperation (Required)**
  Standard evolutionary psychology argues that religion facilitates large-scale cooperation through "Big God" monitoring mechanisms. If your bottleneck theory is correct, does it suggest that cooperation isn't driven by belief in a monitoring agent, but rather by the shared submission to the *filter* itself (the hierarchy/text)?
  *   **Follow-up:** If cooperation relies on submission to the filter rather than the agent, does that mean the theological content is irrelevant? If so, why do doctrinal schisms over metaphysical minutiae cause such violent fractures in cooperation?

  **5. The Axial Age Timing**
  If the Doctrinal Bottleneck is a natural response to cognitive noise, why does it seem to emerge historically during the Axial Age rather than appearing uniformly across all human history? Was there a specific threshold of social complexity that made raw cognitive religious outputs too dangerous to manage, or is this a retrospective pattern you're imposing on the data?

  **6. Secular Parallels**
  Do secular ideologies like Marxism or Liberalism exhibit a similar Doctrinal Bottleneck? Do they also filter out spontaneous, raw moral intuitions in favor of canonical texts and party hierarchies to ensure scalability? If yes, is religion unique here, or is this a general feature of high-fidelity cultural transmission?

  **7. The Cost of Standardization**
  You argue that institutions survive by filtering out the raw cognitive outputs. What is the pathological cost of this standardization? Do we see higher rates of cognitive dissonance, hypocrisy, or psychological fracture in "bottlenecked" populations compared to small-scale, charismatic religious groups?

  **8. Falsifiability and Failure**
  What does a failed bottleneck look like? If a religious movement *doesn't* filter out spontaneous revelation and instead embraces continuous, unregulated prophecy, does your model predict its inevitable collapse? Can you point to a historical example where the lack of a bottleneck caused the extinction of a movement?

  **9. The Digital Disruption**
  The internet allows for the rapid dissemination of raw, unfiltered religious experience (testimonies, visions, memes) outside traditional hierarchies. Does your model predict that digital religion will inevitably fragment because it lacks the bottleneck, or will new algorithmic bottlenecks emerge to replace the priestly class?

  **10. Defining the "Natural"**
  You defend religion as a "natural phenomenon." But if the surviving forms of religion are those that successfully *constrain* natural cognitive tendencies through artificial structures (creeds, bureaucracies), in what sense is the resulting institution still "natural"? Are we studying the biology of belief, or the technology of belief control?
