answer: |-
  Your outline of the material is accurate. You have correctly identified the core arguments: the distinction of naming (shape vs. color), the seeking argument (extension vs. intension), the objection regarding existence, and the sensory separation in *Hard and White*. You have not garbled the text; your summary is philologically sound enough to proceed.

  Here is the menu of precisifications, the assessment of your three proposals, the answers to your supplementary questions, and my final commitment.

  ### Menu of Theses: "A White Horse Is Not a Horse"

  Ordered from trivial/linguistic to radical/metaphysical.

  **1. The Extensional Non-Identity Thesis**
  *   **Claim:** The set of white horses is not identical to the set of all horses.
  *   **Assessment:** **Trivial-but-true.** In modern set theory, $\{x \mid White(x) \land Horse(x)\} \neq \{x \mid Horse(x)\}$.
  *   **Textual Support:** Weak. The dialogue moves quickly past this. If this were the only point, the Objector's reply ("If there is a white horse, there is a horse") would defeat the Advocate immediately, as it affirms existential entailment which the Advocate never denies.
  *   **Interlocutor Mapping:** The **Visitor** relies on this being the *only* available reading to dismiss the claim as a confusion of identity with class inclusion. The **Instructor** ignores this reading.

  **2. The Intensional Non-Equivalence Thesis**
  *   **Claim:** The concept (or name) "white horse" is not equivalent to the concept (or name) "horse." They have different conditions of satisfaction.
  *   **Assessment:** **Substantive and Defensible.** This is the point of the "Seeking" argument. If you request a horse, a yellow one satisfies the request. If you request a white horse, it does not. Therefore, the *meaning* of the request differs.
  *   **Textual Support:** Strong. This is the pragmatic core of the dialogue.
  *   **Interlocutor Mapping:** The **Visitor** might accept this but dismiss it as "just linguistics" (a pun on the copula). The **Instructor** accepts this but views it as evidence of something deeper (abstract concepts).

  **3. The Semantic Composition Thesis**
  *   **Claim:** The name "white horse" is a compound name designating a compound actuality, whereas "horse" is a simple name designating a simple actuality. A compound name is not a simple name.
  *   **Assessment:** **Substantive and Defensible.** This relies on the "Naming" argument (Shape vs. Color). "Horse" names the form; "White" names the color. "White Horse" names both. What names both is not what names one.
  *   **Textual Support:** Very Strong. This is the Advocate's opening move.
  *   **Interlocutor Mapping:** The **Instructor** needs this to argue for abstracta (color and form as separable semantic units). The **Visitor** treats this as a category error.

  **4. The Ontological Separation Thesis**
  *   **Claim:** Whiteness and Horseness are independent entities (universals). When combined, they create a new entity ("white-horse") that excludes the simple entity ("horse") because the addition of an attribute changes the ontological identity of the thing named.
  *   **Assessment:** **Radical.** This posits a robust realism about attributes.
  *   **Textual Support:** Moderate to Strong (especially when read with *Hard and White*). The text treats "White" and "Horse" as agents that can "combine" or "seek" each other.
  *   **Interlocutor Mapping:** The **Instructor** requires this. The **Visitor** claims this is straightforwardly false.

  ---

  ### Assessment of Your Three Proposals

  **1. The Class Reading**
  *   **Verdict:** **Trivial-but-true.**
  *   **Analysis:** As noted in Thesis 1 above, this is extensionally correct but philosophically inert. It renders the dialogue a simple logical error (confusing $\in$ with $=$).
  *   **Textual Fit:** Poor. The Advocate does not argue that white horses aren't *members* of the horse class; he argues that "White Horse" is not "Horse." The distinction is predicated on the *names* and what they *designate*, not merely set membership.
  *   **Interlocutors:** The Visitor assumes this is the only reading to mock it. The Instructor rejects it.

  **2. The Term Reading (Intensional Contexts)**
  *   **Verdict:** **Substantive and Defensible.**
  *   **Analysis:** This is not anachronistic. It is precisely what the "Seeking" argument demonstrates. The dialogue discovers that reference is opaque under certain descriptions (requesting/seeking). It shows that "Horse" and "White Horse" are not *salva veritate* substitutable in volitional contexts.
  *   **Textual Fit:** Excellent. This captures the pragmatic force of the dialogue without requiring full-blown Platonic realism.
  *   **Interlocutors:** The Instructor can use this to argue for concepts/abstracta. The Visitor dismisses this as "just a pun on the copula" (i.e., confusing "is a" with "is identical to"), but the text suggests the distinction is in the *terms*, not the copula.

  **3. The Kind-Term Reading**
  *   **Verdict:** **Substantive but slightly Anachronistic.**
  *   **Analysis:** To say "White Horse supplies no principle for counting" is too strong. You can count white horses. However, the spirit is correct: "Horse" picks out a natural kind (*lei*), while "White Horse" picks out a cross-classification based on an accidental attribute (color). Gongsun Long suggests that adding an accidental attribute creates a new *Ming* (Name) that no longer maps to the original *Shi* (Actuality) of "Horse."
  *   **Textual Fit:** Good. It aligns with the "Shape vs. Color" argument.
  *   **Interlocutors:** The Instructor uses this to argue for the separability of attributes (Kind vs. Attribute). The Visitor would deny the distinction has metaphysical weight.

  ---

  ### Supplementary Questions

  **1. Does *Hard and White* support the same reading?**
  It supports a **stronger version** of the same reading.
  *   In *White Horse*, the attributes (White + Horse) combine to form a compound object.
  *   In *Hard and White*, the attributes (Hard + White) are argued to be capable of existing *without* the object and *without* each other ("hiding" or *cang*).
  *   *Hard and White* pushes toward **Thesis 4 (Ontological Separation)**. It reinforces the *White Horse* argument by showing that if attributes are separable from each other, they are certainly separable from the simple name of the object. It validates the Instructor's claim about abstracta more robustly than *White Horse* does alone. It suggests that "Whiteness" is an entity that can exist unexemplified.

  **2. Does the Objector's move succeed against readings other than Class?**
  No. The Objector says: "If there is a white horse, one cannot say there is no horse."
  *   **Against Class Reading:** The Objector wins. (If $A \subset B$, and $A$ exists, $B$ exists).
  *   **Against Intensional/Metaphysical Reading:** The Advocate has a reply. The Advocate concedes the existential point but denies the *identity* point. The reply in the text is effectively: "Yes, a white horse entails the existence of a horse, but the *name* 'white horse' is not the *name* 'horse'." The Objector confuses existential entailment with nominal identity. The dialogue treats the Objector's move as a confusion of *having* a horse with the *name* being 'Horse'.

  ---

  ### Final Commitment

  **The Single Best Supported Reading:**
  The text best supports the **Semantic-Ontological Compound Thesis** (A robust version of your Term Reading).

  This thesis holds that names (*ming*) correspond to distinct actualities (*shi*). "Horse" corresponds to the actuality of form. "White" corresponds to the actuality of color. "White Horse" corresponds to the actuality of form-color compound. In Gongsun Long's system, a compound actuality is ontologically distinct from its simple constituents. Therefore, the name for the compound is not the name for the simple. "Is not" (*fei*) here asserts **non-identity of designation**, not **non-existence of membership**.

  **Verdict on the Interlocutors:**

  1.  **The Instructor (Universals): Partially Vindicated.**
      The Instructor is correct that the text posits something like abstract objects. *Hard and White* explicitly argues that "Whiteness" can exist without being seen (it "hides"). *White Horse* treats "White" and "Horse" as independent semantic units that combine. The claim that classical Chinese thought makes *no* room for abstracta is indeed false, at least for the School of Names. However, calling them "Universals" in the Platonic sense is slightly anachronistic; they are better understood as "independent semantic-ontological attributes."

  2.  **The Visitor (Punning): Wrong.**
      The Visitor's charge that this is "no deeper than a cheese sandwich" fails because it assumes the text is making a mistake about class inclusion. The text is not making a mistake; it is making a deliberate point about the **fixity of names**. The Visitor treats the distinction as a linguistic ambiguity to be dissolved. The text treats the distinction as a metaphysical reality to be preserved. The "pun" is the feature, not the bug.

  **Reasons for this Commitment:**
  The "Seeking" argument proves that the *function* of the terms differs (Intension). The "Naming" argument proves that the *referents* of the terms differ (Form vs. Color). If the functions differ and the referents differ, the identity claim fails. The text is not confused about sets; it is committed to a philosophy where adding a predicate (White) changes the subject (Horse) into a new ontological category (White-Horse).

  Therefore, the line asserts: **The compound designation "White-Horse" is not identical to the simple designation "Horse."** This is substantive, defensible within the text's own metaphysics, and supports the Instructor's claim about abstract attributes while refuting the Visitor's claim that it is merely a linguistic trick. The inconclusiveness of your seminar arose because the Visitor was arguing logic (extension) while the Instructor was arguing metaphysics (intension/ontology), and neither identified that the text explicitly prioritizes the latter.
