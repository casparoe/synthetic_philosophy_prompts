answer: |-
  **TO:** Clinical Allocation Review Board, Meridian Health System
  **FROM:** Board Member
  **DATE:** October 26, 2023
  **SUBJECT:** Opinion on Prioritarian Aggregate Protocol for hATTR Gene Therapy

  **Recommendation**
  I recommend that the Board **adopt the Prioritarian Aggregate Protocol with a specified amendment**: the inclusion of a "Person-Level Benefit Floor." This hybrid model should be implemented as a **one-quarter pilot**, subject to mandatory review before permanent adoption.

  **Engaging the Separateness Objection**
  We must take the dissenting ethicist's separateness-of-persons objection seriously. The core claim is that aggregation treats distinct individuals as fungible vessels for welfare. Does prioritarian weighting resolve this? No. It merely redistributes the concern. By weighting Quality-Adjusted Life Years (QALYs) according to baseline deficit, we acknowledge that benefits to the worse-off matter more. However, the protocol still sums these weighted gains across distinct individuals. If we deny Patient X (55 QALYs) to treat Patients Y and Z (combined weighted sum > X), we still treat X as a means to maximize a collective metric. The calculus remains aggregative; the weights simply adjust the exchange rate. Prioritarianism mitigates unfairness but does not erase the moral boundary violation inherent in trading one person's substantial gain for the summed smaller gains of others.

  **The Strongest Argument for the Threshold Rule**
  The dissenters' proposed "person-level threshold" rule offers the strongest defense against this violation. By mandating treatment for any patient exceeding a specific benefit threshold (e.g., 40 QALYs), the rule respects individual inviolability. It ensures no patient is sacrificed merely to swell the aggregate welfare of others. This approach treats each candidate's claim as independent, preventing a utilitarian slide where the many outweigh the few regardless of need. It upholds the Kantian imperative that persons are ends in themselves, not inputs into a social welfare function. If our primary ethical duty is to respect the moral boundary between persons, the threshold rule is superior because it refuses to trade across that boundary once a significant individual interest is established.

  **Rationale for the Hybrid Amendment**
  However, adopting the threshold rule as the sole mechanism carries unacceptable clinical risks. In a scarcity context, rigid thresholds may leave doses unused if insufficient patients meet the 40-QALY criteria, while patients with 39 QALYs deteriorate. Conversely, if many meet the threshold, the rule defaults to clinical urgency, potentially ignoring the prioritarian goal of aiding the worst-off among the eligible. We cannot afford inefficiency in the face of mortality, nor can we abandon equity.

  Therefore, the amended protocol should operate as follows: Any patient projected to gain above a defined floor (e.g., 35 QALYs) enters a "protected class." They cannot be bypassed solely to maximize aggregate weighted sums unless bypassed by another protected patient with greater clinical urgency. Below this floor, the prioritarian aggregate function applies to maximize weighted welfare among the remaining candidates.

  This amendment respects the separateness objection by establishing a moral boundary where individual benefit becomes too substantial to trade away for marginal aggregate gains. It retains the prioritarian focus on the worse-off for those below the floor, ensuring we do not abandon equity for efficiency.

  **Implementation Timeframe**
  I propose approving this amended protocol for a **one-quarter pilot**. During this period, the Ethics Committee must review every allocation decision where a patient above the floor was bypassed or where doses remained unused due to threshold constraints. A mandatory board review will occur at the quarter's end to adjust the threshold or weighting parameters based on real-world outcomes and ethical impact.

  We must balance the mathematical elegance of aggregation with the moral reality of individual lives. This amendment achieves that balance.
