answer: |-
  The tension between the Lefebvrian conception of the right to the city and the individualist defense of exclusionary zoning reveals a profound disagreement not merely about how space is allocated, but about how time is governed within the urban environment. When zoning is understood as a technology of intergenerational lock-in, the conflict shifts from a static dispute over land use to a dynamic struggle over who possesses the moral authority to dictate the future character of a community. The individualist framework, often implicit in NIMBY rhetoric, grounds its legitimacy in the sovereignty of the current property owner, viewing zoning as a necessary shield that protects the temporal horizon of those who have invested in a specific way of life. In this view, the stability provided by rigid land-use regulations is a public good that secures expectations, allowing homeowners to plan their lives without the threat of sudden transformation. The moral weight here is placed on the sanctity of the promise made by the state to the current owner, suggesting that the value of a home is inextricably linked to the permanence of its surroundings. Consequently, the lock-in effect is not seen as a bug but as a feature, a mechanism that ensures the exchange-value and use-value perceived by the present owner are preserved against the volatility of market forces or demographic shifts.

  However, this sovereignty-based account encounters a significant coherence problem when examined through the lens of intergenerational justice. By treating current zoning preferences as binding constraints on future residents, the individualist framework effectively allows the present to colonize the future, granting current owners a veto power over the lived experiences of people who do not yet exist or have not yet purchased property. This creates a democratic deficit where the rules of the game are fixed by one generation for the benefit of their asset values, restricting the liberty of subsequent generations to reshape their environment according to their own needs. The claim to property sovereignty becomes paradoxical when it relies on state power to restrict the property rights of future owners, essentially arguing that the right to exclude supersedes the right of future inhabitants to participate in the production of space. While internally consistent regarding the protection of existing capital, this framework struggles to justify why the temporal preferences of current residents should morally outweigh the housing needs and democratic agency of future residents, rendering its account of legitimate claim-making somewhat brittle when stretched across decades.

  In contrast, the Lefebvrian framework offers a more coherent account of the temporal dimension of urban life by conceptualizing the city not as a finished product to be preserved, but as an ongoing oeuvre that is constantly produced and reproduced by its inhabitants. From this perspective, urban space is a collective social product, and the right to the city is fundamentally a right to participate in this continuous process of creation. The moral weight of the temporal lock-in effect is evaluated differently here; rather than seeing stability as a virtue, the Lefebvrian view identifies rigid zoning as a form of alienation that separates inhabitants from their capacity to shape their environment. By prioritizing use-value over exchange-value, this framework argues that the utility of the city for living and social interaction must take precedence over the financial interests of those who treat land primarily as an investment vehicle. The lock-in effect is thus understood as a disruption of the urban rhythm, a freezing of the social process that privileges the dead hand of past decisions over the living needs of the present and future.

  The coherence of the Lefebvrian approach lies in its ability to reconcile the distribution of power across generations with the dynamic nature of urbanization. It acknowledges that cities are never static and that each generation must have the agency to renegotiate the terms of their habitation. By framing participation in shaping the built environment as a matter of democratic appropriation rather than private ownership, it dissolves the contradiction inherent in the individualist model where current owners wield state power to bind future owners. Instead, it posits that legitimate claim-making belongs to those who inhabit and labor within the space, regardless of their tenure or ownership status. This view accommodates the reality that the needs of a city change over time and that the moral legitimacy of land-use control derives from its responsiveness to those changes rather than its resistance to them. The temporal lock-in is therefore seen as an illegitimate accumulation of power by a specific cohort of owners at the expense of the collective future.

  Ultimately, when zoning is analyzed as a mechanism that distributes power across generations, the individualist defense of exclusionary zoning relies on a static conception of property that fails to account for the democratic rights of future persons. It treats the city as a museum of current preferences rather than a habitat for future life. The Lefebvrian right to the city, while more radical in its implications for property rights, provides a more robust and coherent theoretical foundation for understanding the moral weight of temporal lock-in. It recognizes that the city is a process in time, not just an arrangement in space, and that legitimate authority over the built environment must remain fluid enough to allow successive generations to appropriate and reshape the urban fabric. By centering the collective social production of space over the private protection of asset value, this framework better addresses the ethical challenges of intergenerational equity, offering a vision where the power to shape the city is returned to the inhabitants who actually live through the consequences of zoning decisions, both now and in the decades to come.
