answer: |-
  **Exam Question**

  **Module:** Metaphysics of Art and Material Culture
  **Time Allowed:** 75 minutes
  **Total Marks:** 20

  **Question:**
  Critically evaluate the claim that the puzzle of material constitution dissolves if we conceive of a 'statue' not as a material object, but as a functional kind defined by its conservation history. In your answer, address the challenge posed by the replacement of constituent parts and the counter-claim that formal properties dominate material ones. Do not rely on named theories; argue from first principles.

  ***

  **Model Answer**

  To claim that the constitution puzzle dissolves under a functional-conservation view is to argue that the statue and the clay never truly coincide because they belong to different categories of being with distinct persistence conditions. The clay is a material aggregate governed by mereological summation; it exists so long as its particles exist. The statue, on this view, is an artefact defined by a specific history of creation and, crucially, ongoing conservation. It persists so long as the relevant community of custodians maintains its form and function through repair and care. Because the clay can survive crushing while the statue cannot, and the statue can survive particle replacement (via restoration) while the specific clay aggregate cannot, there is no single moment where two objects compete for the same space. They are simply different things tracked by different rules.

  However, this dissolution is threatened by the challenge of part replacement. If the statue is defined by conservation history, we must ask what happens when a fragment falls away and is replaced by new material during restoration. If the identity of the statue relies on its functional continuity, it seems the specific matter becomes irrelevant. Yet, if we replace too much matter, intuition suggests the object ceases to be the original statue, even if conservation efforts continue. This creates a tension: if the statue is purely functional, it should survive total material replacement; if it is partly material, it risks collapsing back into the clay aggregate, resurrecting the coincidence problem. The objection highlights that conservation history cannot be entirely divorced from material continuity without making the concept of the artefact too elastic.

  The proponent of the functional view replies by arguing for the dominance of form over matter. On this account, the matter is subordinate to the artistic form and the intention preserved through conservation. The clay constitutes the statue only insofar as it embodies the form; when matter is swapped during restoration, the form remains the dominant factor determining identity. The matter is merely a vehicle. Therefore, the replacement of parts does not threaten identity because the defining feature—the form maintained by conservation—remains intact. The clay aggregate changes entirely, but the statue persists because the dominant property (form/function) is preserved.

  Ultimately, while this approach clarifies why we treat statues differently from lumps of clay in practice, it does not fully dissolve the metaphysical puzzle. It shifts the problem from 'how can two objects occupy one space?' to 'what threshold of material replacement is compatible with formal dominance?'. Unless one can specify exactly how much matter can be swapped before the form is lost, the boundary between the statue and the clay remains vague. Thus, the functional-conservation view offers a pragmatic solution for art history and conservation, but metaphysically, it merely relocates the mystery of constitution rather than eliminating it.

  ***

  **Marking Scheme**

  **Total Marks:** 20
  **Pass Mark:** 10

  | **Criteria** | **Marks** | **Guidance for Markers** | **Typical Candidate Error** |
  | :--- | :---: | :--- | :--- |
  | **1. Characterisation of the Functional-Conservation View**<br>The candidate must explain that on this view, identity tracks care, intention, and function rather than mereological summation. | 4 | Award full marks if the distinction between material aggregate and artefact kind is clear. | Treating the view as simple intentionalism without referencing conservation history or maintenance. |
  | **2. Explanation of the Proposed Dissolution**<br>The candidate must articulate how differing persistence conditions purportedly prevent coincidence. | 4 | Look for the argument that different rules for existence mean no competition for space. | Asserting they are different objects without explaining *why* the conditions differ. |
  | **3. Articulation of the Part-Replacement Challenge**<br>The candidate must describe the problem of swapping/losing bits without relying on labels. | 4 | Credit should be given for identifying the tension between material continuity and functional survival. | Confusing this with the Ship of Theseus rather than the constitution puzzle. |
  | **4. Articulation of the Dominance Reply**<br>The candidate must explain how form/function overrides material loss in determining identity. | 4 | Ensure the candidate explains the hierarchy (form over matter) rather than just stating form matters. | Claiming form destroys matter rather than governing identity conditions. |
  | **5. Critical Evaluation**<br>The candidate must offer a reasoned verdict on whether the puzzle truly dissolves or merely shifts. | 4 | High marks for recognising that the view relocates the vagueness rather than solving it. | Sitting on the fence without justification or claiming a definitive solution where none exists. |

  ***

  **Notes for Pedagogy Journal Submission**

  *   **Language Conventions:** This document adheres to British English spelling and punctuation conventions (e.g., 'analyse', 'programme', single quotation marks for philosophical terms, full stops inside quotation marks).
  *   **Citation Policy:** No bibliographic references are included to ensure the exam tests argumentative skill rather than rote memorisation of secondary literature.
  *   **Assessment Design:** The marking scheme prioritises structural argumentation over terminology, rewarding students who can reconstruct philosophical moves from first principles.
