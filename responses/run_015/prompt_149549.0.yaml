answer: |-
  Thank you for coming. I know this room is… complicated.

  Half of you knew him as the man who could dismantle a soul in three sentences. The other half knew him as the man who sat still enough to watch it dissolve on its own. If Arthur were here, he'd probably point out the irony of gathering to honor a fiction. He spent forty years telling us that the "self" is just a center of narrative gravity. A useful point of reference, like the horizon, but not a place you can land.

  And yet. Here we are. Standing at a horizon that has vanished.

  I have notes. (She rustles paper) He taught me that language is a map, not the territory. But when you lose a mapmaker, you clutch the paper.

  There is a temptation, I think, to comfort the family by saying he is at peace. Or that a part of him lives on in us. I won't say that. It would be a lie to the philosophers, who know that continuity is a logical trap. And it would be a lie to the meditators, who know that there is no one to go anywhere. To say he is watching us now would be to insult the very clarity he died with. He didn't believe in ghosts. He barely believed in *him*.

  But I also won't stand here and tell you that because there was no self, there is no loss. That is a different kind of violence. It turns doctrine into a shield against pain.

  So why are we grieving?

  I think… I think mourning is a practice. A specific kind of *upaya*. Skillful means.

  For the next few days, we are going to do something Arthur would have argued against. We are going to build him. We are going to take the memories, the habits, the voice, the way he held a teacup, and we are going to weave them into a person. We will construct a "Arthur" so that we have somewhere to put this love. We need a target for our grief. Compassion requires an object.

  We will treat the narrative as if it were real. Not because it is metaphysically true, but because it is humanly necessary.

  In his last seminar, he was trying to explain how the aggregates bind together. He wrote on the board that we cling to the first of the skhanda— (She pauses, frowns at the paper, corrects softly) —the *khandha*. Form. He said even the mistake is part of the process.

  We are clinging now. We are gathering the form, the feelings, the perceptions he left behind, and we are making a shape out of them. We are allowing ourselves the fiction of a goodbye.

  But the work—the work he asked us to do—is to not leave the fiction standing.

  We honor him not by building a statue, but by noticing when we start to live inside one. We honor him by letting the story of "Arthur" do its work, comfort us, hold us, and then… by letting the story lose its tension. By letting the center of gravity drift.

  He is not gone. He is just unbound.

  And if we do this right, if we grieve fully and then let the grief unravel, we might understand what he meant. We aren't saying goodbye to a person. We are practicing how to let go of the idea that there was ever anyone to hold onto in the first place.

  Rest now. The story is over. The process continues.
