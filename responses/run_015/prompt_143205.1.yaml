  2.  **Deconstruct the Finance/Decision Theory Concepts:**
      *   *Expected Wealth Maximization:* Maximizing arithmetic mean return. Ruin-prone in multiplicative settings.
      *   *Kelly Criterion:* Maximizing geometric mean growth rate. Optimal fraction to bet.
      *   *Geometric Rationality:* Axiomatic approach favoring geometric means (often drops Independence axiom).
      *   *Ergodicity Economics (Peters):* Distinction between ensemble average (many people once) and time average (one person many times). Claims EU is wrong because it uses ensemble averages for non-ergodic processes.
      *   *Normativity:* Why *should* an agent do this? (Survival vs. Rational choice).

  3.  **Map to Evolutionary Ecology (The Desert Annual Model):**
      *   *Wealth:* Seed bank size ($N_t$).
      *   *Betting:* Germination fraction ($g$).
      *   *Return:* Yield per germinated seed ($Y_t$, stochastic).
      *   *Survival:* Seed survival in bank ($s$).
      *   *Growth Rate:* $\lambda = \lim_{T\to\infty} \frac{1}{T} \ln(N_T/N_0)$. This is the geometric mean fitness.
      *   *Environment:* Good/Bad years, autocorrelation, cues.
      *   *Extinction:* $N_t = 0$ (absorbing state).

  4.  **Drafting the Translations (Piece by Piece):**

      *   **Piece 1: Kelly Criterion (Maximize Expected Log Wealth).**
          *   *Finance:* Bet fraction $f$ to maximize $E[\ln(1 + fr)]$.
          *   *Ecology:* Cohen's (1966) model. Maximize $E[\ln(g Y_t + (1-g)s)]$.
          *   *Map:* Perfect match. Long-run growth rate *is* expected log fitness.
          *   *Bend:* Finance assumes you *choose* to maximize growth. Ecology assumes selection *does* maximize growth.
          *   *Missing:* The concept of "utility" separate from growth.

      *   **Piece 2: Geometric Rationality (Axioms).**
          *   *Finance:* Dropping Independence axiom to allow geometric aggregation. Nash Bargaining link.
          *   *Ecology:* This is hard. Evolution doesn't care about axioms. It cares about lineage persistence.
          *   *Map:* The "Nash Bargaining" solution looks like dividing resources among offspring strategies to maximize product of fitnesses? Maybe too abstract. Better to frame it as: "Why geometric mean?"
          *   *Bend:* Trying to find a normative justification for what is a descriptive outcome of selection.
          *   *Missing:* The axiomatic foundation. Evolution has no "rationality," only "persistence."

      *   **Piece 3: Ergodicity Economics (Time vs. Ensemble).**
          *   *Finance:* Ensemble average (many parallel worlds) $\neq$ Time average (one world over time). EU uses ensemble. Growth uses time.
          *   *Ecology:* This is the trickiest part for the user because they *have* many lineages.
          *   *Map:* Time average = Long-run growth rate of a single genotype. Ensemble average = Arithmetic mean fitness across replicate populations in the same generation.
          *   *Bend:* In ecology, the "ensemble" is real (many individuals). But selection acts on the time-average (geometric) because lineages with low geometric mean vanish.
          *   *Missing:* The claim that ensemble averages are "fiction." In ecology, they are real but irrelevant for long-term persistence.

  5.  **Addressing the Critical Questions (The "Meat"):**

