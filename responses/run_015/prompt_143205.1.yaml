answer: |-
  This is a translation task from Decision Theory/Finance into Evolutionary Ecology. I will treat your desert annual system as the ground truth and treat the finance concepts as attempted descriptions of that system, noting where they succeed, where they stretch, and where they break.

  Here is the piece-by-piece translation, followed by the specific critiques you requested.

  ---

  ### Part 1: The Translations

  #### 1. The Kelly Criterion (Maximize Expected Log Wealth)
  **The Finance Argument:** In a multiplicative betting game, maximizing expected arithmetic return leads to ruin. To maximize long-term wealth growth, an agent should maximize the expected value of the logarithm of their bankroll. This dictates betting a specific fraction of capital, not all of it.

  **The Ecological Translation:**
  *   **Maps Cleanly:** This is exactly the Cohen (1966) model for optimal germination fractions. Your "bankroll" is the seed bank density ($N_t$). Your "bet" is the germination fraction ($g$). Your "return" is the yield per germinated seed ($Y_t$) plus the survival of dormant seeds ($s$).
      *   Finance: Maximize $E[\ln(W_{t+1}/W_t)]$.
      *   Ecology: Maximize $\lambda_s = E[\ln(g Y_t + (1-g)s)]$.
      *   This is simply **long-run geometric mean fitness**. The Kelly fraction is the evolutionarily stable strategy (ESS) for $g$ in a coarse-grained environment where the whole population experiences the same $Y_t$.
  *   **The Bend:** Finance treats this as a *choice rule* for a single gambler. Ecology treats it as the *outcome* of lineage sorting. The math is identical; the causal mechanism is inverted.
  *   **No Expression:** The concept of "utility." In your system, log-wealth isn't a preference; it's the physical rate of lineage multiplication. There is no "satisfaction" variable, only persistence.

  #### 2. Geometric Rationality (Axioms & Nash Bargaining)
  **The Finance Argument:** A newer decision-theoretic framework argues we should drop the Von Neumann-Morgenstern "Independence Axiom" and replace it with axioms that force geometric aggregation of outcomes. It links this to Nash Bargaining solutions (maximizing the product of gains).

  **The Ecological Translation:**
  *   **Maps Cleanly:** The Nash Bargaining link maps loosely to **diversified bet-hedging across offspring**. If a parent distributes offspring into different niches (or germination times), the "product of gains" resembles maximizing the joint probability of lineage survival across states.
  *   **The Bend:** This is the hardest fit. Decision theorists derive geometric maximization from logical consistency axioms (rationality). You derive it from population dynamics (persistence). You don't need to "drop the Independence Axiom" because your system isn't built on preferences over lotteries; it's built on difference equations. The "axiom" in your system is simply that $0 \times \text{anything} = 0$ (extinction is absorbing).
  *   **No Expression:** The normative force of "rationality." In your system, a "irrational" plant (one that maximizes arithmetic mean fitness by germinating 100% of seeds) isn't illogical; it just leaves no descendants. The "axiom" is enforced by the graveyard, not by logic.

  #### 3. Ergodicity Economics (Time vs. Ensemble)
  **The Finance Argument:** Standard Expected Utility (EU) theory averages over an *ensemble* of parallel worlds (many agents, one shot). But a real agent lives through a *time series* (one agent, many shots). If the process is non-ergodic (ensemble average $\neq$ time average), EU is objectively wrong. You should optimize the time-average growth rate (log wealth).

  **The Ecological Translation:**
  *   **Maps Cleanly:**
      *   *Ensemble Average:* Arithmetic mean fitness ($\bar{W}$). This is the average reproductive success across all individuals in a single generation.
      *   *Time Average:* Geometric mean fitness ($\lambda_g$). This is the growth rate of a single lineage over many generations.
      *   *Non-Ergodicity:* This is **coarse-grained environmental variation**. If every seed faces the same weather (correlated risk), the ensemble average (arithmetic) diverges from the time average (geometric).
  *   **The Bend:** Ergodicity economists claim the ensemble is a "fiction." For you, the ensemble is **real**. You literally have thousands of seeds. However, because their fates are correlated by the environment, the ensemble does not protect the *genotype* from temporal variance. The ergodicity argument holds for the *genotype*, even if the *population* is large.
  *   **No Expression:** The claim that probability theory itself is flawed. In ecology, both averages are valid numbers; they just answer different questions. Arithmetic mean predicts biomass next year. Geometric mean predicts presence next century. Neither is "wrong," but only one predicts persistence.

  ---

  ### Part 2: The Critical Questions

  Here is the honest assessment of where the finance arguments break down when held against your framework.

  #### (a) The "Many Lineages" Objection
  **Your Point:** You have $10^6$ seeds in the soil. The ergodicity people say "don't use ensemble averages because you only live one life." But you *are* an ensemble. Does this break their argument?

  **The Verdict:** It saves the argument, but clarifies the boundary conditions.
  *   **Correlation is Key:** If environmental variation is perfectly correlated (coarse-grained), having $10^6$ seeds is mathematically equivalent to having one seed. They all face the same bad year. The ensemble provides no insurance. In this case, the Ergodicity/Economics claim holds: the time-average (geometric) is the only metric that matters for persistence.
  *   **Fine-Grained Variation:** If risk is independent across seeds (fine-grained), the Law of Large Numbers kicks in. The ensemble average converges to the time average. Maximizing arithmetic mean fitness becomes the correct strategy.
  *   **The Finance Blind Spot:** Ergodicity economics often assumes the agent is a monolithic block of capital. Your framework reveals that the "ergodicity break" depends on the **correlation structure of risk across the ensemble**. The finance argument is correct for correlated risk (systemic risk), but wrong if risks are idiosyncratic and diversifiable. You know this as the difference between "bet-hedging required" vs. "bet-hedging unnecessary."

  #### (b) Extinction and the Absorbing State
  **Your Point:** Your criterion ($\lambda_s$) breaks when $N_t=0$. Log(0) is undefined. Finance seems to assume a bottomless bankroll.

  **The Verdict:** Finance quietly assumes a bottomless bankroll; Ecology forces you to face the cliff.
  *   **The Finance Assumption:** The Kelly criterion assumes you can bet infinitesimal fractions and never hit zero. It ignores "ruin" as long as you bet fractionally. It assumes liquidity is infinite.
  *   **The Ecological Reality:** You deal with integer counts and hard extinction. When populations get small, stochasticity shifts from environmental to demographic. The geometric mean approximation fails because the distribution of lineage sizes becomes highly skewed with a massive spike at zero.
  *   **The Counterpart:** In finance, this is **Risk of Ruin** or **Drawdown constraints**. Professional traders often use "Half-Kelly" or fractional Kelly not to maximize growth, but to reduce variance and avoid hitting zero during a bad run.
  *   **The Gap:** The "Expected Log Wealth" framework has no native way to handle the absorbing state at zero. It treats it as $-\infty$ utility, which paralyzes the math. Your framework handles this better via **quasi-extinction thresholds** and stochastic differential equations with absorbing boundaries. The finance version is naive here; it assumes the game continues forever. You know the game ends.

  #### (c) Normativity: Selection vs. Rationality
  **Your Point:** Growth-rate maximization is a consequence of selection, not a goal. What happens to the "You *should* Kelly bet" normativity?

  **The Verdict:** The debate is less sharp than it looks. The "ought" dissolves into an "is."
  *   **The Translation:** When a decision theorist says "A rational agent *ought* to maximize log wealth," they are trying to derive a behavioral rule from first principles. When you say "A lineage *will* maximize geometric mean fitness," you are describing a filter.
  *   **The Leftovers:**
      1.  **Instrumental Normativity:** The only "ought" that survives is conditional: *If* you want your lineage to persist in a coarse-grained environment, *then* your physiology/behavior must approximate geometric mean maximization.
      2.  **The Missing Piece:** The finance debate is often about **what goals are rational**. Your framework shows that there is only one goal that isn't self-terminating. The "debate" in finance exists because humans have competing goals (consumption now vs. growth later, status, etc.). Your plants have one goal: $\lambda > 1$.
      3.  **Framework Deficiency?** Your framework isn't missing anything regarding persistence. However, the finance framework highlights **agency**. Plants don't compute cues; they are selected to respond to them. If you study animals with brains, the "rationality" language becomes useful again because they can *violate* the optimal strategy (mismatch, cognitive bias). The finance debate is about why agents *fail* to Kelly bet. Your framework explains why they *should*, but not why they might not (unless you invoke constraints/costs).

  ### Summary for the Ecologist

  1.  **Kelly = Geometric Mean Fitness.** It's the same math. The finance community rediscovered Cohen (1966) and called it information theory.
  2.  **Ergodicity = Coarse-Grained Variation.** The claim that "ensemble averages are fiction" is hyperbole. They are real but irrelevant for long-term persistence when risk is correlated.
  3.  **Extinction = The Hard Boundary.** Finance ignores the absorbing state at zero. Your framework handles it better, but even you switch to diffusion approximations when numbers get low. The "Log" criterion formally breaks at extinction.
  4.  **Normativity = Selection.** The "rationality" debate is a search for a justification that ecology already solved via natural selection. The "ought" is just the shadow of the "is."

  **Final Honest Assessment:**
  The finance/decision theory arguments do not reveal a flaw in your evolutionary framework. Rather, they reveal that decision theorists are struggling to derive, from abstract axioms, the same dynamical constraints you observe directly in population trajectories.

  The only thing your framework might be "missing" is a formal language for **internal constraints on adaptation**. Finance asks "Why don't people Kelly bet?" (Answer: Psychology, liquidity needs). Ecology asks "Why don't plants optimize $g$?" (Answer: Genetic constraints, phylogenetic inertia, costs of cue reading). The "Normativity" in finance is an attempt to bridge the gap between the optimal strategy and the actual behavior. In your system, that gap is simply the lag time of selection or the cost of complexity. The debate is less sharp because you have a mechanism (selection) that enforces the rule, whereas they only have logic.
