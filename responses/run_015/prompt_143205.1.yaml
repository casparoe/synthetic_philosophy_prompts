  **(Self-Correction on Ergodicity):** I need to be careful not to just say "Peters is wrong." The user wants the translation. The translation is: Ergodicity Economics rediscovers the Geometric Mean Fitness principle but frames it as a critique of probability theory rather than ecology. The "ensemble is fiction" claim is the weak point for an ecologist. I must highlight that.

  **(Self-Correction on Normativity):** The user asks if the leftovers show the framework is missing something or the debate is soft. The answer is likely the latter. The "ought" in finance is the "is" in ecology.

