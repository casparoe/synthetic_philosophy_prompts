          *   *Response:* The ergodicity argument holds *if* you care about the specific lineage's persistence. If you have $10^{10}$ seeds, arithmetic mean matters for total biomass *this year*, but geometric mean matters for the *genotype's* existence next century. If correlation is perfect across lineages (same environment), ensemble doesn't save you from extinction. If independent, it does (law of large numbers).
          *   *Verdict:* Ergodicity argument saves itself if environmental correlation is high (coarse-grained). If fine-grained (independent risks), arithmetic mean dominates.

      *   **(b) Extinction/Absorbing States:**
