answer: |-
  Here is a concrete plan for the 75-minute session, designed to navigate the specific tension between Strawson's framework and your mediators' morning training.

  ### 1. The Sequence (and Why)

  **Order:** Experience → Naming → Boundaries (Excuse/Exemption) → Professional Application.

  1.  **The Felt Experience (0–15 mins):** Do not mention Strawson, responsibility, or free will. Start immediately with the Case (Version 1). Ask them to report on their *expectations* of the teenager and their *imagined feelings* for the neighbor.
      *   *Why:* You are correct. They must feel the "grip" of the participant stance before you label it. If you define "reactive attitudes" first, they will treat it as vocabulary to memorize, not a human reality to recognize.
  2.  **The Naming & The Contrast (15–30 mins):** Label what they just described as the **Participant Stance**. Introduce the **Objective Stance** only as the *contrast* (what it feels like when the participant stance becomes impossible).
      *   *Why:* Defining the Objective Stance too early invites them to idolize it (given their morning training). It must be introduced as a *loss* or a *shift*, not a goal.
  3.  **The Boundaries: Excuses vs. Exemptions (30–50 mins):** Use Case Versions 2 & 3 to show what modifies the stance (excuse) vs. what collapses it (exemption).
      *   *Why:* This is the payoff. It explains *why* we sometimes step back. It gives them a vocabulary for the intuition they felt in step 1.
  4.  **The Professional Pivot (50–65 mins):** Address the "Scripted Blame" / Mediator Role.
      *   *Why:* You cannot solve the "proxy" problem until they understand the "personal" baseline. If you start here, it validates their morning training (detachment) before they understand the cost of it.
  5.  **Assessment & Close (65–75 mins).**

  ### 2. The Case

  **The Core Case:** A 15-year-old kicks in the door of a neighbour's garden shed.
  **What it must have:**
  *   **Property damage:** Concrete enough to warrant a claim.
  *   **A relationship:** The teen and the neighbour know each other (e.g., the teen cuts the neighbour's grass). This ensures the *relationship* is at stake, not just the money.
  *   **Ambiguity on intent:** Not clearly pre-meditated murder, not clearly a total accident.

  **What it must lack:**
  *   **Extreme violence:** Keep it to property. Violence triggers safety protocols that shut down philosophical reflection.
  *   **Systemic racism/poverty triggers:** Keep the demographics neutral in the description. You want them focusing on the *structure of responsibility*, not the sociology of the neighbourhood (which is a different, valid, but time-consuming conversation).

  **The Three Versions:**
  1.  **Baseline:** Teen was angry about a payment dispute. Kicked the door. (Triggers Participant Stance/Resentment).
  2.  **The Excuse:** Teen kicked the door, but it was because he slipped on ice while running to help the neighbour. (Modifies responsibility *within* the Participant Stance).
  3.  **The Exemption:** Teen kicked the door during a severe, diagnosed psychotic break where he believed the shed was a demon. (Collapses Participant Stance → Objective Stance).

  **On Resentment:** You asked if live resentment is a trap. **Yes.** If you ask *them* if they are resentful, they will say "No, I'm professional."
  **Fix:** Ask: "If you were the *neighbour*, what would you feel?" Then ask: "If you treat the teen as if the neighbour *shouldn't* feel that, what happens to the mediation?" This keeps the resentment in the room without demanding they personally harbor it.

  ### 3. Misconceptions (and how to head them off)

  You are right about (b) and (c). You are partially wrong about (a) and (d).

  *   **(a) "Blame is just a feeling."**
      *   *Will they form it?* Yes.
      *   *The Fix:* Head this off in the **Naming** phase. Strawson isn't saying blame is *only* a feeling; he's saying it's a *demand for regard*. When I feel resentment, I am saying "You counted me less than you should have." It's a claim about the relationship, not just internal weather.
  *   **(b) "The Objective Attitude is the Professional Ideal." (CRITICAL RISK)**
      *   *Will they form it?* **Absolutely.** Their morning session taught them that feelings are obstacles.
      *   *The Fix:* You must explicitly reframe this in the **Professional Pivot**. The Objective Stance is for *management* (clinicians, prison guards). The Participant Stance is for *restoration*. If they adopt the Objective Stance, they aren't mediating; they are managing a case. You are not teaching them to feel rage; you are teaching them that *caring about the norm* is a participant stance.
  *   **(c) "Exemptions = Dehumanizing."**
      *   *Will they form it?* Yes, someone will say, "So we treat the psychotic teen like a dog?"
      *   *The Fix:* Address this in the **Boundaries** phase. The Objective Stance isn't necessarily cruel; it's *non-reciprocal*. We treat children or the severely ill with care, but we don't expect *moral reciprocity*. It's not dehumanizing to recognize someone cannot currently participate in the moral community.
  *   **(d) "If no resentment, no wrong." (Relativism)**
      *   *Will they form it?* Less likely than (b). This group is practical.
      *   *The Fix:* If it comes up, point to **Indignation**. Even if *I* don't resent you, the *community* might. (See below).
  *   **The Unthought Misconception:** "Restorative Justice means getting rid of blame."
      *   *The Fix:* Strawson's killer point for this group: You cannot have restoration without the possibility of blame. Restoration is the *repair* of the expectations that blame signals are broken. If you remove the expectation, you don't have restoration; you have coexistence.

  ### 4. The "Scripted Blame" Problem (The Hard Bit)

  **The Problem:** Mediators hold people responsible professionally, often without personal feeling. Strawson ties responsibility to personal reactive attitudes.
  **The Solution:** Strawson distinguishes **Resentment** (personal) from **Moral Indignation** (vicarious/third-party).
  **Placement:** **Late Middle (50–65 mins).**
  **Argument:** Do not treat this as a counter-example that cracks the framework. Treat it as the *specialized application* of the framework.
  *   **The Move:** Tell them: "You are right. You are not the victim. You should not feel personal resentment. But if you feel *nothing*, you are in the Objective Stance. Your role is to hold the space for **Moral Indignation**."
  *   **Explanation:** Indignation is a reactive attitude. It is the Participant Stance taken on behalf of the moral community. When you press for an apology, you are not scripting blame; you are signaling that the *norm* matters.
  *   **The Cost:** This requires you to nuance "feelings." You aren't asking them to feel angry. You are asking them to *value the expectation*. It costs you the simplicity of "feelings = responsibility." You have to shift the definition to "investment in the relationship/norm."
  *   **Why this placement?** If you put it at the start, you validate their detachment. If you put it at the end, it feels like an exception. In the late middle, it becomes the *bridge* between the theory and their Tuesday night mediation.

  ### 5. The Final Question (Last 5 Minutes)

  Your draft ("Is forgiving = Objective Attitude?") is too theoretical. They will guess what you want to hear.
  **Better Question:**
  > "Imagine you finish a mediation. The agreement is signed. But you realize you have stopped expecting the participant to keep their word—you're just planning to monitor them closely to ensure compliance. **According to Strawson, have you succeeded or failed?**"

  *   **Right Answer:** Failed (or at least, shifted modes). You have moved from Participant to Objective. You have managed the risk, but you haven't restored the relationship.
  *   **Why it works:** It tests whether they understand that *expectations* are the core of the stance, not the *outcome*. It directly challenges the "professional detachment" mindset from the morning.

  ### 6. What to Refuse to Cover

  **Topic:** The Metaphysics of Free Will (Determinism vs. Indeterminism).
  **How to say it:** "Strawson's radical move is to say we don't need to solve the puzzle of whether the universe is determined to know how to treat each other. We can leave that to the physicists and metaphysicians. Our job is the human practice. If we wait for proof of free will before we hold someone responsible, we'll never hold anyone responsible."
  **Why:** It is a time-sink and irrelevant to their practice. Strawson's point is that the practice *comes first*.

  ### 7. Risk Management: Where This Plan Goes Wrong

  **The Failure Point:** The "Morning Training Hangover."
  **Sign to Watch For:** During the **Naming** phase (15–30 mins), if they nod enthusiastically at the description of the Objective Stance ("Yes, that's what we should do, stay calm, stay neutral").
  **The Pivot:** If you see this, stop. Do not proceed to Excuses/Exemptions.
  **Intervention:** Say: "I hear that this sounds like the 'professionalism' you discussed this morning. But Strawson argues that if you stay in the Objective Stance permanently, you cannot have a relationship. You can have a contract, or a treatment plan, but not a restored neighbourhood. Does Restorative Justice want contracts, or restored neighbourhoods?"
  **Why:** You must force the choice between *Safety/Control* (Objective) and *Relationship/Restoration* (Participant). They cannot have both.

  **What Would Change My Mind on Scripted Blame:**
  If, during the **Experience** phase (0–15 mins), the group flatly refuses to engage with the neighbour's feelings and insists on discussing *process compliance* ("Well, did he sign the agreement?").
  **The Change:** If they are this entrenched in proceduralism, you cannot sell "Indignation." You must move the "Scripted Blame" section to the **Start**. You would have to begin by admitting: "You are right, you are paid to be neutral. So why are we talking about feelings? Because the *participants* aren't neutral."
  **Cost:** This concedes the theoretical high ground. It makes Strawson a tool for understanding the *clients*, not the *mediators*. It's safer, but less transformative. Stick to the original plan unless the room is visibly hostile to the idea of emotion.

  ### Summary Checklist for the Room
  1.  **Whiteboard:** Draw two columns. "Participant" (Relationship, Expectations, Resentment/Gratitude) vs. "Objective" (Management, Causality, Treatment/Training).
  2.  **Timer:** 75 minutes is brutal. Cut the discussion on Version 2 (Excuse) short if needed. Do not cut Version 3 (Exemption).
  3.  **Phrase to Avoid:** "Free Will."
  4.  **Phrase to Use:** "Holding someone to account."

  This plan respects their training while gently subverting the idea that "professional" means "emotionally detached." It uses Strawson not to solve metaphysics, but to justify the emotional labour of their job.
