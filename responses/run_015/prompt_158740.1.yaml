      *   *3 & 10:* Self-insulation (3) vs. Case verdict (10). 10 says suspend judgment on leak vs. official. 3 says CTs absorb refutation. *Resolution:* 10 is about *initial* response to evidence, 3 is about *maintenance* of belief against counter-evidence.
