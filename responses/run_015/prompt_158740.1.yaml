      *   *Confidence:* High on 8vs9. Medium on 4vs5. Low on 2vs3.
      *   *Least Sure Claim:* Claim 5 (Scale). Why? Because distinguishing "coordination cost" from "leak probability" is mathematically tight.

  8.  **Refining the Output (Self-Correction during drafting):**
