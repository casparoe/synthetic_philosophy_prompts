      *   *2 & 3:* Particularism says no shared defect, 3 says there is a characteristic structural vice. *Resolution:* "Characteristic" $\neq$ "Definitional/Necessary." 3 allows for non-insulating conspiracy theories. 2 says no defect shared by *all and only* CTs. This is a subtle distinction but likely manageable.
      *   *4 & 5:* Reject leakiness (4) vs. Scale sensitivity (5). 4 says "don't assume they leak." 5 says "more people makes it harder." *Resolution:* 5 is about combinatorial probability/coordination costs, 4 is about information environment reliability. They address different mechanisms.
      *   *5 & 9:* Scale sensitivity (harder with more people) vs. Locally raised priors (easier for victimized groups). *Resolution:* Priors modify the threshold. Scale modifies the likelihood ratio. Bayes' theorem handles this.
