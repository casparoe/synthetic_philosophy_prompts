answer: |-
  # SEMINAR HANDOUT: The Unity of Consciousness Decision Tree

  **The Anchor Case:**
  Imagine a split-brain patient. The left hand reaches for a cup; the right hand pushes it away. When asked, the subject says: *"I intended to grab the cup."* They report only one intentional action, despite the conflicting motor output.

  **Instructions:**
  Answer the following Yes/No questions based on your intuition about the case and the nature of experience. Follow the path to your philosophical position.

  ---

  ### THE TREE

  **Q1. The Split-Brain Report**
  Is the subject's report of a single intention a *post-hoc* memory edit (confabulation) rather than a record of the experience as it happened in real-time?
  *   **YES** → Go to **Q2 (The Illusion Branch)**
  *   **NO** → Go to **Q4 (The Real-Time Branch)**

  **Q2. The Status of Unity (Illusion Branch)**
  Is the concept of "conscious unity" a completely false category with no real referent (even as a narrative)?
  *   **YES** → **LEAF A: Eliminativism**
  *   **NO** → Go to **Q3**

  **Q3. The Mechanism of Editing (Illusion Branch)**
  Is the feeling of unity generated as a specific, late-stage "stitching" event (an illusion of will), or is it just a shifting narrative with no central editor?
  *   **YES (Specific Stitching Event)** → **LEAF B: Retro-Active Stitching**
  *   **NO (Shifting Narrative)** → **LEAF C: Multiple Drafts**

  **Q4. The Requirement of Unity (Real-Time Branch)**
  Does unified experience require a single functional processing bottleneck (a place where information must converge to be experienced)?
  *   **NO** → **LEAF D: Dual Stream Realism**
  *   **YES** → Go to **Q5**

  **Q5. The Location of the Bottleneck (Real-Time Branch)**
  Is this bottleneck a specific, localized neural workspace (a physical hub), or is it a logical point distributed across the system?
  *   **NO (Distributed/Logical)** → **LEAF E: Logical Unity**
  *   **YES (Localized/Physical)** → Go to **Q6**

  **Q6. The Nature of the Center (Real-Time Branch)**
  Is this localized center defined by *information access* (reportability/function) rather than *phenomenal presence* (what it is like)?
  *   **YES (Access/Function)** → **LEAF F: Global Workspace**
  *   **NO (Phenomenal Presence)** → **LEAF G: Lite Cartesian Theater**

  ---

  ### SCORING KEY & POSITION MAP

  | Path (Q1 → Q6) | Position | Description |
  | :--- | :--- | :--- |
  | **Yes → Yes → N/A** | **A: Eliminativism** | Unity is a folk-psychological error; there is no "stream" to edit. |
  | **Yes → No → Yes** | **B: Retro-Active Stitching** | Unity is a real feeling, but generated late by a separate mechanism (e.g., sense of agency). |
  | **Yes → No → No** | **C: Multiple Drafts** | Unity is a narrative fiction; there are only parallel fragments revised over time. |
  | **No → No → N/A** | **D: Dual Stream Realism** | Two parallel conscious streams exist; one is suppressed or ignored in the report. |
  | **No → Yes → No** | **E: Logical Unity** | A bottleneck exists, but it is distributed/functional, not a physical place. |
  | **No → Yes → Yes → Yes** | **F: Global Workspace** | **[*See Note Below]** A localized functional hub broadcasts information for access. |
  | **No → Yes → Yes → No** | **G: Lite Cartesian** | **[*See Note Below]** A localized phenomenal center exists, but without a homunculus. |

  **⚠️ Indistinguishability Flag:**
  **Global Workspace (F)** and **Lite Cartesian Theater (G)** are empirically indistinguishable in this tree. They differ only on whether the bottleneck is *access* (functional) or *phenomenal* (experiential). If you cannot distinguish access from phenomenology, these positions collapse into one.

  ---

  ### DIAGNOSIS OF EXCLUDED / EMPTY COMBOS

  The following logical combinations are excluded from the tree. If you find yourself holding one of these views, see the diagnosis:

  1.  **Distributed Bottleneck + Real-Time Suppression:**
      *   *Diagnosis:* **Unattractive.** If the bottleneck is distributed, there is no single locus to perform the "suppression" of the conflicting stream in real-time.
  2.  **Localized Bottleneck + Retrospective Editing:**
      *   *Diagnosis:* **Incoherent.** If unity is edited retrospectively (Q1=Yes), a real-time localized bottleneck (Q4=Yes) is functionally redundant for the *experience* of unity.
  3.  **Dual Streams + Single Unified Report (without suppression):**
      *   *Diagnosis:* **Unexplored.** This requires a mechanism for two distinct subjects to co-author a single verbal report without one suppressing the other (e.g., communcal speaking).
  4.  **Eliminativism + Retro-Active Stitching:**
      *   *Diagnosis:* **Contradictory.** You cannot claim unity is a false category (Eliminativism) while simultaneously positing a mechanism that stitches it (Stitching).

  ---

  ### BRANCH LOGIC SUMMARY

  1.  **Resolution Timing:** Real-Time vs. Retrospective (Q1).
  2.  **Ontology of Unity:** Real Feature vs. Illusion vs. Error (Q2, Q4).
  3.  **Physical Topology:** Localized Hub vs. Distributed Logic vs. No Hub (Q5).
  4.  **Functional Role:** Access vs. Phenomenology (Q6).
