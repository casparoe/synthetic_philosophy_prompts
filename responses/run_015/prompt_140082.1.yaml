answer: |-
  **UNIVERSITY OF OXFORD**
  **FINAL HONOUR SCHOOL OF PHILOSOPHY**
  **PAPER 404: PARADOXES OF INFINITY AND PHYSICAL POSSIBILITY**

  **Time Allowed: 90 Minutes**

  **Instructions:** Answer the question below. You are not required to perform any calculations or solve differential equations. All necessary information regarding the physical devices is contained in the rubric.

  **Question:**

  Consider a supertask performed on a lamp with a switch. The switch schedule is fixed for all $t < 1$: the switch is down on $[0, 1/2)$, up on $[1/2, 3/4)$, down on $[3/4, 7/8)$, up on $[7/8, 15/16)$, and so on, alternating at times $t_n = 1 - 2^{-n}$. Three variants of the lamp are proposed, differing only in how the lamp state responds to the switch:

  *   **(A) The Ideal Lamp:** Brightness equals the switch position (0 or 1). For every $t < 1$, it is fully on or fully off. The sequence of states at the flip times alternates and has no limit.
  *   **(B) The Damped Lamp:** Brightness $b \in [0,1]$ relaxes toward the switch position at rate $k > 0$, obeying $db/dt = k(u(t) - b(t))$ with $b(0) = 0$. For every $k > 0$, the brightness converges as $t \to 1$ to a determinate limit strictly between 0 and 1. (e.g., limit $\approx 0.25$ for $k=1$; $\approx 0.38$ for $k=2$). You are not required to determine the behaviour of this limit as $k \to \infty$.
  *   **(C) The Dead-band Lamp:** A two-state device that ignores any switch position not held for at least $\delta > 0$. It stops registering flips once intervals fall below $\delta$. Its final state is fully on or fully off according to the parity of the last flip held for at least $\delta$. As $\delta$ is halved repeatedly, the final state alternates; this family has no limiting final state.

  Note that for any chosen $N$, both the Damped Lamp (large $k$) and the Dead-band Lamp (small $\delta$) match the Ideal Lamp to arbitrary accuracy over the first $N$ flips. The three devices are indistinguishable by any finite observation and differ only in the limit.

  (a) Thomson argues the Ideal Lamp story is incoherent because the lamp can be neither on nor off at $t=1$. Benacerraf argues the story is coherent but fails to determine the state at $t=1$. Using the three variants above, evaluate these diagnoses. Specifically, distinguish between the questions of (i) agency, (ii) physical realizability, (iii) logical coherence, and (iv) determinacy of outcome. Which of these do the variants bear upon, and what do they imply about the necessity of dynamical laws in describing supertasks?

  (b) What follows from the fact that the Damped and Dead-band lamps match the Ideal Lamp on all finite prefixes while disagreeing on the final state? Does this show the final state is underdetermined by the physical history, or that the Ideal Lamp is not a well-defined physical object? Relate your answer to the condition required for a supertask to have a determinate outcome, contrasting this case with convergent supertasks like Zeno's runner.

  ***

  ### MODEL ANSWER

  The three lamp variants demonstrate that the Thomson–Benacerraf dispute conflates logical coherence with physical completeness. Thomson's claim of incoherence relies on the premise that the lamp must be either on or off at $t=1$ (Excluded Middle). Variant (B) refutes this by providing a physically consistent model where the state at $t=1$ is determinate but intermediate. Variant (C) satisfies Excluded Middle but renders the outcome arbitrary, dependent on a parameter $\delta$ absent from the original description. Thus, the variants show that the *logical coherence* of the switch schedule is intact; the failure lies in the *determinacy of outcome* given only a kinematic specification.

  This forces a separation of four distinct questions often run together in the literature. (i) *Agency*: Whether an agent can perform the flips is untouched; the variants assume the schedule is met. (ii) *Physical Realizability*: Variant (B) suggests that if physical laws involve continuity or damping, the task is realizable but yields a dim glow, not a paradox. (iii) *Logical Coherence*: Benacerraf is vindicated; there is no contradiction in the history for $t < 1$. (iv) *Determinacy*: Thomson is partially vindicated in that the *Ideal* description fails to determine a binary state, but his inference to impossibility is false. The variants imply that a complete description of a process requires dynamics, not just kinematics. The Ideal Lamp is a mathematical abstraction lacking the dynamical laws necessary to resolve the limit.

  Consequently, the correct diagnosis is neither Thomson's incoherence nor Benacerraf's mere underdetermination, but a category error: the story provides a kinematic boundary condition without a dynamic law. For a verdict of incoherence to hold, one must assume Excluded Middle applies to the physical state regardless of dynamics. For Benacerraf's underdetermination to hold, one must assume the kinematic story *should* fix the state. The variants show the kinematic story *cannot* fix the state without dynamic parameters ($k$ or $\delta$).

  This illuminates the general condition for a supertask to have a determinate outcome: the effects of the remaining operations must vanish in the tail. In Zeno's runner or a bouncing ball, the displacement or time interval of the $n$-th step approaches zero; the "effect" of the tail sums to a finite limit. In the Ideal Lamp, every flip has a full-magnitude effect (state change 0 to 1 or 1 to 0) regardless of $n$. The series of effects does not converge. Variant (B) achieves convergence only because the *effective* change vanishes due to relaxation time; Variant (C) achieves it because the device ceases to register the tail. Without such vanishing effects, the limit is undefined.

  Regarding determinism and Part (b): The fact that finite prefixes match while limits diverge shows that the final state is not a function of the sequence of switch positions alone. This does not necessarily violate determinism. Determinism is a thesis about the evolution of states given laws and initial conditions. Here, the "laws" are missing. If we stipulate the Ideal Lamp is the object, it is ill-defined, not indeterministic. If we stipulate a physical lamp, it has dynamics ($k$ or $\delta$), and the outcome is determined by those parameters. The failure is not of lawfulness, but of the specification. The Ideal Lamp is not a well-defined physical object because physical objects possess inertia or thresholds that resolve the limit. Therefore, the divergence of the variants on finite prefixes demonstrates that the limit is sensitive to micro-physical details omitted from the kinematic story. It supports Benacerraf's view that the state is not fixed by the flips, but deepens it: the state is fixed by the *physics of the lamp*, which the Thomson story ignores.

  ***

  ### MARKING SCHEME (20 Marks)

  **Move 1: Categorial Distinction (4 Marks)**
  *   **Award:** Clear separation of Agency, Physical Realizability, Logical Coherence, and Determinacy. Identifies that variants bear on Coherence (B shows it's coherent) and Determinacy (none fix it kinematically), but not Agency.
  *   **Common Error:** Conflating "physically impossible" with "logically incoherent," or treating the variants as addressing the agent's ability to flip the switch.

  **Move 2: Diagnosis of the Dispute (4 Marks)**
  *   **Award:** Identifies the core issue as Kinematic vs. Dynamic specification. Rejects Thomson's incoherence (B is coherent) and refines Benacerraf (it's not just underdetermined, it's dynamically incomplete).
  *   **Common Error:** Simply restating Benacerraf's "underdetermined" conclusion without explaining *why* the variants force a shift to dynamics/laws.

  **Move 3: Excluded Middle & Variants (4 Marks)**
  *   **Award:** Uses (B) to challenge Excluded Middle (intermediate state) and (C) to show binary outcomes are arbitrary/parameter-dependent. Explains how this undermines Thomson's specific contradiction.
  *   **Common Error:** Treating the intermediate brightness of (B) as a "compromise" rather than a logical counterexample to the On/Off dichotomy, or ignoring (C)'s parity dependence.

  **Move 4: The Vanishing Tail Condition (4 Marks)**
  *   **Award:** Articulates the condition: determinate outcomes require the effect of the $n$-th operation to vanish as $n \to \infty$. Contrasts explicitly with Zeno/bouncing ball where magnitude shrinks.
  *   **Common Error:** Failing to contrast with Zeno, or claiming the Thomson task is impossible simply because "infinity cannot be completed" without referencing the magnitude of effects.

  **Move 5: Determinism & Part (b) Synthesis (4 Marks)**
  *   **Award:** Argues that finite-prefix matching shows the limit is not fixed by the sequence alone. Concludes Ideal Lamp is ill-defined physically, not a failure of determinism. Determinism holds if dynamics are included.
  *   **Common Error:** Claiming the case proves physical indeterminism, or arguing that because finite observations match, the limits *should* match (denying the mathematical reality of the divergence).

  ***

  ### EXAMINER'S COMMENTARY

  **The Best Wrong Answer (Upper Second / 12-14 marks)**
  The most attractive incorrect script will be the "Benacerraf Clone." This candidate will correctly identify that the state at $t=1$ is not fixed by the switch history and will vigorously defend Benacerraf's claim that the task is logically possible. They will use the Damped Lamp to show coherence. However, they will fail to make the *Kinematic vs. Dynamic* distinction. They will treat the lack of a determined state as a feature of *logic* or *description* alone, missing the point that the variants introduce *physical laws* ($k$, $\delta$) that do the work of determination. They will likely miss the "Vanishing Tail" contrast with Zeno, treating all supertasks as equally problematic regarding limits. They get the verdict right (Benacerraf wins) but for the wrong structural reasons.

  **Zero Credit Moves**
  No credit should be awarded for: (1) The "Faster Than Light" objection. The prompt stipulates the schedule is fixed; physical constraints on switch speed are irrelevant to the logical analysis of the limit. (2) Treating the Damped Lamp's intermediate brightness as an empirical discovery about what "really" happens. The point is modal: it shows *one admissible completion*, not *the* completion. (3) Any answer that claims the supertask is impossible simply because "you can't do infinite things." This ignores the specific logical structure of the Thomson-Benacerraf exchange which grants the completion for the sake of argument. (4) Attempting to solve the differential equation for the Damped Lamp; the rubric explicitly forbids this and provides the necessary limits.
