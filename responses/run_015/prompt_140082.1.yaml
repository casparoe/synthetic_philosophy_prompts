      *   **Problem:** Standard comparison questions lead to transcription/memorization. Need a question that forces *application* and *structural analysis*.
      *   **Core Material:** Three lamp variants (Ideal, Damped, Dead-band) with specific properties provided in the prompt.
          *   *Ideal:* Binary state matches switch. No limit at $t=1$.
          *   *Damped:* Continuous state $b \in [0,1]$, relaxes to switch. Converges to a limit $L \in (0,1)$ depending on rate $k$.
          *   *Dead-band:* Binary state, ignores flips shorter than $\delta$. Final state depends on $\delta$ (parity of last valid flip). No limit as $\delta \to 0$.
          *   *Key Fact:* All three match on any finite prefix of flips. They differ only in the limit.
      *   **Learning Objectives/Marking Criteria:**
          1.  Distinguish four questions (agency, physical realizability, coherence, determinacy).
          2.  Verdict on diagnosis (Thomson vs. Benacerraf vs. Kinematic/Dynamic distinction). Strongest answers explain conditions for verdicts.
          3.  Role of Excluded Middle (On/Off vs. Intermediate vs. Parameter dependence).
          4.  General Condition: Determinate outcome requires effects of remaining operations to vanish in the tail (contrast with Zeno/bouncing ball).
          5.  Determinism: Is this a failure of lawfulness or absence of a limit? Is the stipulation the right kind of thing for determinism?
      *   **Format:** Exam question (self-contained, 90 mins), Model Answer (800-1000 words), Marking Scheme (20 marks, 5 moves x 4 marks), plus commentary on "Best Wrong Answer" and "Zero Credit Moves".
      *   **Constraint:** Second part must address the finite prefix matching vs. limit disagreement (underdetermination vs. ill-defined object).

  2.  **Drafting the Exam Question:**

      *   *Style:* Formal, precise, exam-paper tone.
      *   *Content:* Need to embed the descriptions of (A), (B), and (C) clearly.
