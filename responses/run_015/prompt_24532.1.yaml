answer: |-
  There is no single, universally agreed-upon word for this specific pattern, but in the fields of risk analysis, law, and behavioral economics, it is recognized as a convergence of three established concepts.

  The best established label for the *policy argument* is **"One-Sided Precaution"** (often associated with legal scholar Cass Sunstein's critique of the Precautionary Principle). The best label for the *epistemic mechanism* you identified (known vs. unknown) is **"Ambiguity Aversion."**

  When combined, this phenomenon is often described in risk analysis as **"Neglect of Risk-Risk Tradeoffs"** driven by **"Selective Ambiguity Aversion."**

  Here is a detailed breakdown of the concept, how it functions, and how it differs from the related ideas you mentioned.

  ### 1. The Core Concept: One-Sided Precaution
  In his book *Laws of Fear*, Cass Sunstein argues that the Precautionary Principle, as commonly invoked in debates like the ones you describe, is logically incoherent because it is **one-sided**.

  *   **The Structure:** It demands precaution against the risks of *regulatory action* (banning/approving the new tech) but ignores the risks of *regulatory inaction* (maintaining the status quo).
  *   **The Epistemic Twist:** As you noted, proponents justify this one-sidedness by distinguishing between **Risk** (status quo: probabilities are known) and **Uncertainty** (innovation: probabilities are unknown). This draws on **Knightian Uncertainty** (a distinction between measurable risk and unmeasurable uncertainty).
  *   **The Result:** The status quo is treated as a neutral baseline ("Nature") rather than an active policy choice with its own mortality/morbidity profile.

  ### 2. The Epistemic Engine: Ambiguity Aversion
  You correctly identified that the asymmetry is justified by the *type* of risk (known vs. unknown). In behavioral economics, this is **Ambiguity Aversion** (related to the **Ellsberg Paradox**).

  *   **Definition:** People prefer to bet on known probabilities (e.g., an urn with 50 red and 50 black balls) over unknown probabilities (e.g., an urn with 100 balls of unknown ratio), even if the expected value is identical.
  *   **Application to Policy:** Group A is not just risk-averse; they are *ambiguity-averse*. They accept the high *risk* of conventional pesticides because the probabilities are quantified. They reject the new pesticide because the probabilities are *ambiguous*, even if the expected harm might be lower.
  *   **Why it fits your observation:** This explains why the argument isn't just "old is better." It is specifically "known is better than unknown."

  ### 3. The Framing Device: Naturalization of the Status Quo
  Sociologically, this argument relies on **Naturalizing the Status Quo**.

  *   **The Mechanism:** By framing the status quo (conventional agriculture, fossil fuels) as the "baseline" or "background condition," its risks are categorized as inevitable facts of life. The new technology is framed as an "intervention."
  *   **The Consequence:** Risks associated with the baseline are discounted as "costs of doing business," while risks associated with the intervention are scrutinized as "moral failures." This allows the arguer to claim they are not favoring the status quo, but simply opposing *change*.

  ---

  ### Distinctions: What It Is Not

  You asked specifically how this differs from Status Quo Bias, Omission Bias, and Double Standards. Here is the precise boundary work:

  #### vs. Status Quo Bias
  *   **Status Quo Bias** is a psychological inertia: "I prefer this because it's what we have." It is often subconscious and requires no justification.
  *   **One-Sided Precaution** is a *principled* asymmetry. The arguer offers an epistemic justification (Known vs. Unknown). They are not saying "keep the old because it's old"; they are saying "keep the old because its risks are *quantified*." This makes it harder to defeat than simple bias, because it appeals to scientific rigor.

  #### vs. Omission Bias
  *   **Omission Bias** is the moral preference for harm caused by *inaction* over harm caused by *action*.
  *   **The Difference:** As you noted, continuing to use conventional pesticides is an *action* (commission), not inaction. However, One-Sided Precaution *frames* it as inaction ("not banning" vs. "banning").
  *   **The Edge:** Omission bias is about moral culpability (I feel less guilty if I let you die than if I kill you). One-Sided Precaution is about epistemic humility (I know how the old thing kills, I don't know how the new thing kills). It is a cognitive/epistemic claim, not just a moral one.

  #### vs. Double Standard
  *   **Double Standard** implies hypocrisy: applying Rule A to Group X and Rule B to Group Y without justification.
  *   **One-Sided Precaution** claims a *relevant difference* between the groups (Known vs. Unknown).
  *   **The Edge:** A critic would call it a double standard. A proponent calls it "differentiated risk management." The phenomenon exists in the space between: it is a **Justified Asymmetry**. It becomes a fallacy only if the "known" risks of the status quo are actually poorly understood, or if the "unknown" risks of the innovation are assumed to be catastrophic without evidence.

  ---

  ### Summary Definition

  If you need a term to use in writing or debate, the most precise phrase is **"Asymmetric Ambiguity Aversion"** within a **"Risk-Risk Tradeoff."**

  However, if you want the established policy term, use **"One-Sided Precaution."**

  **Definition:**
  > **One-Sided Precaution** is a policy argument that invokes the Precautionary Principle against a novel intervention while exempting the status quo from similar scrutiny. It relies on **Ambiguity Aversion** to justify an **Epistemic Asymmetry**: treating the quantified risks of the baseline as acceptable "knowns" while treating the unquantified risks of innovation as unacceptable "unknowns." It differs from Status Quo Bias because it offers an epistemic justification (uncertainty) rather than psychological inertia, and it differs from a Double Standard because it posits a relevant difference between the two cases (measurability of risk).

  ### Where the Edges Lie (Validity vs. Fallacy)
  It is important to note that this pattern is not *always* a fallacy. There are edges where the asymmetry is rational:

  1.  **Irreversibility:** If the new risk involves irreversible damage (e.g., species extinction, climate tipping points) while the status quo risk is reversible, the asymmetry is justified. This is the **"Strong Precautionary Principle."**
  2.  **Learning Potential:** If adopting the new technology allows us to *learn* about the risk (monitoring), while the status quo offers no new data, the asymmetry may be temporary and productive.
  3.  **Scale:** If the status quo risk is distributed and dilute, but the new risk is concentrated and acute, the asymmetry reflects a valid ethical preference regarding catastrophe vs. attrition.

  The pattern becomes a fallacy (One-Sided Precaution) when the "known" risks of the status quo are actually severe and under-managed, and the "unknown" risks of the innovation are assumed to be worse without evidence, effectively paralyzing improvement. This is what Sunstein calls the **"Paralysis Objection."**
