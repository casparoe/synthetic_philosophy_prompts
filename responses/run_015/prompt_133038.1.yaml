answer: |-
  ### Problem Set 4: Uncertain Evidence and Rigidity

  **Context:** Consider a hypothesis $H$ (sample is contaminated) and a proposition $E$ (monitor reads positive).
  **Priors:** $P(H) = 0.5$. The monitor reliability is $P(E|H) = 0.8$ and $P(E|\neg H) = 0.2$.
  **The Shift:** An agent's confidence in $E$ shifts from $P_{old}(E) = 0.5$ to $P_{new}(E) = 0.9$.

  **Part A (5 marks):** Calculate $P_{old}(H|E)$ and $P_{old}(H|\neg E)$. Using the rule of uncertain conditioning (holding these conditionals fixed), calculate $P_{new}(H)$. Show your arithmetic.

  **Part B (5 marks):** Consider two causes for this shift.
  (1) *Perceptual:* The display was hard to read (sensory noise).
  (2) *Structural:* The agent learned the run used a 'high-gain' setting ($C$), which is more common when samples are hot and makes positive readings more likely.
  In case (1), the rule yields 0.74. In case (2), does the rule yield 0.74? If the numerical output is identical, is this a defect of the rule or a feature of rigidity? Explain.

  **Part C (5 marks):** Propose a repair: apply the rule only relative to a cause $C$ of which the agent is certain (i.e., condition on $C$). Does this repair collapse into ordinary conditioning? Justify your answer using probability relations.

  **Part D (5 marks):** A generalization suggests the rule minimizes information change subject to the new marginal constraints on $E$. Does this minimum-information justification resolve the worry about source-blindness raised in Part B? Why or why not?

  ***

  ### Model Answer

  **Part A**
  First, we derive the old marginals and conditionals.
  $P_{old}(E) = P(E|H)P(H) + P(E|\neg H)P(\neg H) = (0.8)(0.5) + (0.2)(0.5) = 0.5$.
  By Bayes' theorem:
  $P_{old}(H|E) = \frac{P(E|H)P(H)}{P_{old}(E)} = \frac{0.4}{0.5} = 0.8$.
  $P_{old}(H|\neg E) = \frac{P(\neg E|H)P(H)}{P_{old}(\neg E)} = \frac{(0.2)(0.5)}{0.5} = 0.2$.
  Applying the rule of uncertain conditioning:
  $P_{new}(H) = P_{old}(H|E)P_{new}(E) + P_{old}(H|\neg E)P_{new}(\neg E)$
  $P_{new}(H) = (0.8)(0.9) + (0.2)(0.1) = 0.72 + 0.02 = 0.74$.

  **Part B**
  Mathematically, the rule yields 0.74 in both cases because it accepts only the new marginal $P_{new}(E)$ as input. However, this identical output highlights a defect in application, not necessarily in the arithmetic. In case (1), $E$ is the direct object of experience; rigidity holds because the sensory state alters confidence in $E$ without altering the link between $E$ and $H$. In case (2), the shift is caused by $C$ (high-gain). If $C$ is correlated with $H$ independently of $E$, then learning $C$ changes the conditional probability $P(H|E)$. Rigidity fails. The rule's source-blindness is a defect if the user treats $E$ as the evidence when $C$ is the actual evidence. The rule assumes the shift in $E$ carries no *further* information about $H$ beyond what $E$ itself carries; case (2) violates this assumption.

  **Part D** (Note: Addressed before C for flow in this draft, will reorder in final)
  **Part C**
  If the agent is certain of the cause $C$ (i.e., $P_{new}(C) = 1$), the proposed repair dictates conditioning on $C$. This collapses into ordinary conditioning.
  Proof: If $P_{new}(C) = 1$, then $P_{new}(H) = P_{old}(H|C)$.
  The uncertain rule is designed for partitions where no cell reaches probability 1. If we identify a cause $C$ that is certain, we have a standard conditioning event. The "repair" is therefore not a generalization of uncertain conditioning but a reversion to standard conditioning. It solves the source-blindness by forcing the agent to identify the certain cause, but it abandons the uncertain rule entirely for that step.

  **Part D**
  The minimum-information justification (minimizing information distance subject to $P_{new}(E)$) does not resolve the source-blindness worry. It merely proves that *if* one accepts the new marginals on $E$ as the only constraints, the rule is the most conservative update possible. It justifies the arithmetic given the constraints, but it cannot validate the constraints themselves. If the source of the shift (like $C$ in case 2) implies additional constraints on $H$ that are ignored by fixing only $P_{new}(E)$, the minimum-information result is still epistemically flawed. It optimizes the wrong problem.

  ***

  ### Marking Scheme

  **Total: 20 Marks**

  **Part A (5 Marks)**
  *   **Competent (3-4 marks):** Correct arithmetic for $P(H|E)$ and final result. Minor rounding errors tolerated if method is clear.
  *   **First-Class (5 marks):** Explicitly states $P_{old}(\neg E) = 0.5$ and shows the weighted sum structure clearly.
  *   **Penalty:** -2 marks for arithmetic error (e.g., summing probabilities > 1). -1 mark for failing to calculate conditionals explicitly.

  **Part B (5 Marks)**
  *   **Competent (3-4 marks):** Identifies that the output is numerically identical. States that rigidity fails in case (2) because correlation changes.
  *   **First-Class (5 marks):** Distinguishes between the *rule's* consistency and the *application's* validity. Articulates that rigidity asserts the shift carries no *extra* information, which case (2) violates.
  *   **Penalty:** -2 marks for claiming the rule calculates different numbers for case (2). -1 mark for vague appeals to "context" without mentioning conditional probability stability.

  **Part C (5 Marks)**
  *   **Competent (3-4 marks):** States that certainty in $C$ leads to standard conditioning.
  *   **First-Class (5 marks):** Demonstrates the collapse formally ($P_{new}(C)=1 \implies$ standard conditioning). Notes that this makes the "repair" a replacement, not a modification, of the rule.
  *   **Penalty:** -2 marks for suggesting the rule can handle certain $C$ without collapsing. -1 mark for failing to define what "collapse" implies for the generalization.

  **Part D (5 Marks)**
  *   **Competent (3-4 marks):** States that minimum information justifies the math but not the inputs.
  *   **First-Class (5 marks):** Explains that optimization is relative to constraints; if constraints (marginals) omit the source information, the optimization preserves that omission.
  *   **Penalty:** -2 marks for claiming minimum information validates the source-blindness. -1 mark for confusing information minimization with truth-tracking.

  **General Note for Markers:**
  Watch for "name-dropping." No marks are awarded for citing authors. Arguments must stand on the probability relations provided. Ex-laboratory precision is expected in Part A; philosophical precision is expected in Part B.
