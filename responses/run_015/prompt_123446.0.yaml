  6.  **Final Polish:** Ensure the distinction between *Doctrine of Virtue* (ethics of motives/maxims) and *Doctrine of Right* (external freedom/coercion) is clear, as Marcus brings this up. Kant's essay on lying is technically a response to a political/legal philosopher (Constant), but Kant treats it as a matter of ethical duty with legal implications.

