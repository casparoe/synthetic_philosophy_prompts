answer: |-
  **Scenario A: The Garage Sale Hardline**
  You're at a neighbor's garage sale looking at an old guitar you really want. You offer $15. The neighbor, who actually would have accepted $15, looks you in the eye and says, "I can't let it go for a penny under $20; that's my bottom line." You really want it, but you're on a budget, so you scrape together the extra cash and agree to the $20. Later, you find out they would have taken $15. They lied about their "bottom line," which was the central reason you agreed to the higher price—if you'd known they'd take less, you definitely would have paid less. Yet, everyone agrees the sale is final; you can't just demand $5 back or return the guitar because they haggled dishonestly. The transaction stands, and your "yes" to the deal counts, even though it was secured by a flat-out lie about the terms.

  **Scenario B: The Only Ride Home**
  It's 10 PM after a school event, and you've missed the last bus. It's raining, and your phone is dead, so you can't call parents or a cab. A senior you barely know offers you a ride, but says, "Get in, but you have to let me record a podcast interview with you the whole way, and you can't leave until it's done." You hate public speaking and hate their podcast, but the only alternative is walking five miles in the storm. You say yes. They didn't lie, they didn't threaten you (they didn't cause the rain or hide the bus schedule), and you are sober and understand exactly what you're agreeing to. Yet, most people would say your consent is shaky or invalid because you weren't truly free to refuse, even though no specific person forced you into that corner.

  ***

  **Walkthrough**

  **Scenario A** attacks **Condition 1 (Nobody deceived you)**. In this case, deception happened, it was about something central (the price floor), and it changed your decision, yet the consent (the sale) remains valid. This suggests Maya's rule is too broad; not all lies kill consent. The work being done here is by **social convention and context**. In haggling, there is an unwritten rule that "bottom line" statements are part of the game, not factual claims. If Maya's model can't distinguish between a lie that breaks a deal (the crashed bike) and a lie that is part of the negotiation dance, it fails.

  **Scenario B** attacks the **sufficiency of the three conditions**. All three of Maya's boxes are checked: no lies, no direct threats (the senior didn't break your phone), and you are competent. Yet the consent feels wrong. Your hunch about the "menu" is **not cheating**; it's pointing to a missing fourth condition: **Reasonable Alternatives**. Maya's model focuses on the *interaction* (did *they* pressure *you*?), but Scenario B shows that *circumstantial* pressure can invalidate consent just as much as interpersonal pressure. If the only option is "agree or suffer harm," the "yes" is technically voluntary but morally hollow.

  ***

  **Debate Prep: How They Defend the Indefensible**

  **Maya defending Scenario A (The Lie that Sticks):**
  Maya has to argue that the consent is *actually* void, or redefine "deception." To save her model, she must claim that in a garage sale, stating a "bottom line" isn't a factual claim but an **expression of intent**, which can change. She would argue: "He didn't lie about the guitar; he lied about his willingness, which is fluid. Therefore, Condition 1 wasn't violated." To patch her model, she needs to add a **Materiality Clause**: Consent is void only if the deception concerns the *nature of the object or act*, not the *motivation or negotiation stance* of the people involved. She has to convince the club that lying about your patience isn't the same as lying about the bike's crash history.

  **Denis defending Scenario B (The Desperate "Yes"):**
  Denis has to argue that the consent is *actually* valid. To save his skepticism about pressure, he must claim that **circumstance is not coercion**. He would argue: "The senior didn't create the rain or the bus schedule. Holding them responsible for your bad luck means no one can ever make a deal with someone who needs help." To patch his side, he needs to add a **Causal Responsibility Clause**: Pressure only voids consent if the *other party created the threat*. He has to convince the club that if we invalidate deals made out of desperation, we stop people from helping others in emergencies (e.g., a doctor charging for a life-saving procedure).

  ***

  **The Verdict: Patch or Rebuild?**

  Maya's picture needs a **rebuild**, not just a patch. Her three conditions focus entirely on the *moment of agreement* and the *agents involved*, ignoring the **context** and the **power dynamics** surrounding it. Scenario A shows that context (haggling norms) can make lies acceptable. Scenario B shows that context (desperation) can make truth unacceptable.

  **The New Model:**
  Instead of three conditions, propose **The Fair Exchange Standard**:
  1.  **Competence:** (Keep Maya's Condition 3).
  2.  **Transparency:** No deception about the *essential nature* of the act or object (Patches Condition 1).
  3.  **Voluntariness:** No coercion, *and* no exploitation of pre-existing desperation caused by the agent (Expands Condition 2).
  4.  **Reciprocity:** The agreement must fall within the norms of the context (e.g., haggling is okay; lying about safety is not).

  Tell the club that consent isn't just a switch that gets flipped by three rules; it's a relationship that has to be fair on both sides. If you hand them this, they'll tear apart "Reciprocity" (who defines fairness?), but at least you'll have moved the argument forward.
