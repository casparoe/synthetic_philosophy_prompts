      *   *The "Now":* Theater implies a singular present. Neuroscience implies a specious present with latency.
      *   *Unity:* Theater implies a unified scene. Brain implies fragmented processing bound together.

  6.  **Load-Bearing vs. Staging:**
      *   *Load-Bearing:* Spotlight (Attention), Wings (Memory/Context), The Dark (The unknown/subtext). These create tension and focus.
      *   *Staging:* The Stage itself (as a singular location), The Director (as a unified will). These can be fluid in prose without breaking the spell.

  7.  **Addressing the Philosophical Core (Dennett vs. The Metaphor):**
      *   *Does Dennett earn his conclusion?* He successfully dismantles the *homunculus* (the little man inside). But does "Multiple Drafts" escape metaphor?
      *   *Smuggled Assumptions:* "Drafts" implies text, editing, time. It still relies on a temporal narrative. It assumes a "system" that does the drafting.
