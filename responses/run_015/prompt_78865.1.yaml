      *   *Actor:* The conscious self/ego.
      *   *Wings:* Memory/Unconscious processing.
      *   *Director:* Executive function/Will.
      *   *The Dark:* The unknown/unconscious/void outside experience.

  3.  **Deconstruct Dennett's "Multiple Drafts" Model:**
      *   No central finish line.
      *   Parallel processing.
      *   "Fame in the brain" (content becomes conscious when it influences other systems).
