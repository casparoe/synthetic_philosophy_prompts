  8.  **Refining the Argument (The "Real Question"):**
      *   Dennett is right about *ontology* (what exists), but the user is working in *phenomenology* (what it feels like).
      *   The "Cartesian Theater" is a fallacy for neuroscience, but it is the *truth* of subjective experience.
      *   The novelist's job is to simulate the *illusion* of the theater, because that *is* what consciousness feels like, even if it isn't how it works.
      *   Dennett's "Fame" metaphor is actually closer to how *culture* works, or how *memory* consolidates, but it lacks the immediacy required for narrative tension.
