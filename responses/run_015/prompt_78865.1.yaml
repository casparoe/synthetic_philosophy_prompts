      *   The "Self" is a center of narrative gravity, not a homunculus.

  4.  **Drafting the Correspondence Table:**
      *   Need to map the user's theatrical terms to the cognitive reality Dennett describes, *and* to the literary utility.
      *   *Stage:* Phenomenal "Now" vs. Neural simultaneity.
      *   *Spotlight:* Attentional blink/Binding vs. Narrative focus.
      *   *Audience:* The Reader vs. No internal witness.
