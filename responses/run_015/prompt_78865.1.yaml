  Actually, the best counter-image for a writer is **The Editor's Desk**. It captures the "drafts" idea but keeps the agency. But the user asked for a better image than *both*. Let's suggest **The Hologram** or **The Resonance Chamber**. Let's go with **The Resonance Chamber**. It captures the parallel processing and the "coming together" without a central point.

  Wait, one more thought: The user's method is *phenomenology*. Dennett attacks *ontology*. They are talking past each other. The response must make this distinction clear. The Theater *is* how it feels. Dennett says that's not how it *is*. The novelist sells the *feel*.

