      *   **(a) Coherence:** Can "explanatory protagonism" be detached from intentionality and still do historiographical work?
          *   *Thought:* This is a philosophy of history question. Structuralism, Annales School, and Actor-Network Theory (ANT) have argued yes. It seems conceptually robust.
          *   *Estimate:* High. 0.85.

      *   **(b) Empirical Warrant:** Do specific episodes (Black Death, volcanic winters) actually function as causal protagonists vs. being absorbable into social/economic explanations?
