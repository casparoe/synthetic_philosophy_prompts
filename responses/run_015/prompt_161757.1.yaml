prompt: |-
  I am applying for a one-year postdoctoral fellowship in philosophy of science and need a proposal of roughly 1,200 words. The review panel is split between philosophers of physics and philosophers of machine learning, and neither half will know the other's literature, so the proposal must be legible to both and must not rest on any empirical result I would later have to look up. Please do not include a bibliography or literature review by citation; I will supply references myself.

  My half-formed idea is this. The debate between structural realists and their opponents has been conducted almost entirely over structures that arrive already stated in a formalism: a set of equations, a group of transformations, a network of relations one can write down. Both the realist's continuity claim and the standard anti-realist replies — the induction over discarded theories, and the worry that a purely structural claim is trivially satisfiable by any domain large enough to carry the right pattern of relations — are framed against that background. But an increasing amount of scientific structure now reaches us in a form no one can state: the internal variables of a trained model, which predict, generalize across regimes, and support interventions, but which are given only as a configuration of parameters rather than as a sentence. I want to know whether structural realism has anything to say about such structures, and whether they put pressure on the debate from a direction that has not been worked.

  The angle I keep circling, which I can't yet make precise enough to defend, is a retrospective test. Take historical episodes of theory change where we know, in hindsight, which parts of the superseded theory were retained and which were abandoned, and where the data available before the change exists in machine-readable form. Train models on the pre-change data alone, with no trace of the successor theory, and score whether the structure they settle on is the structure that survived or the structure that was discarded. The realist's case rests on the claim that what persists across theory change is structure; if that is a real diagnostic rather than a post hoc rationalization, a structure-finding procedure with no access to the future should be able to pick out survivors in cases we can already score. If it systematically cannot, the suspicion is that continuity has been identified retrospectively, by selecting whichever relations happen to be recoverable in whatever formalism came next. That would be a result about the debate that the existing arguments cannot deliver.

  Turn this into a proposal with: a precise statement of the question, formulated so that it has a determinate answer; an explanation of why both the moderate and the stronger version of structural realism leave it open, and of why the obvious alternative approaches — treating the question as one about scientific discovery generally, or as one about whether machines can understand — miss what is distinctive here; the method, set out month by month across twelve months and doable with modest compute and no proprietary models; a criterion for when the same structure recurs across two systems that share no vocabulary, which does not collapse into mere predictive equivalence; the range of possible conclusions and which considerations would decide among them; what would count as the project failing; and an honest statement of what might make it too large for one year. Include a short closing section, since the panel will ask, on what any of this would be worth to scientists and funders deciding whether to trust a variable that a model found and nobody can paraphrase.
reasoning: |-
  Here's a thinking process that leads to the proposal:

  1.  **Analyze the Request:**
      *   **Topic:** Postdoctoral fellowship proposal in philosophy of science.
      *   **Length:** Roughly 1,200 words.
      *   **Audience:** Split panel (Philosophers of Physics vs. Philosophers of Machine Learning). Neither knows the other's literature well. Must be legible to both.
      *   **Constraints:** No bibliography/citations. No empirical results that need looking up later (must be methodological/conceptual).
      *   **Core Idea:** Apply Structural Realism (SR) to "black box" structures in ML. Use a retrospective test: Train models on pre-change data (historical theory change) to see if they recover the structure that *actually* survived in the successor theory, without knowing the successor theory.
      *   **Required Sections:**
          1.  Precise statement of the question (determinate answer).
          2.  Why SR (moderate/strong) leaves it open; why alternative approaches (discovery/machine understanding) miss the point.
          3.  Method (12-month timeline, modest compute, no proprietary models).
          4.  Criterion for structural recurrence (without collapsing to predictive equivalence).
          5.  Range of conclusions/decision criteria.
          6.  Failure conditions.
          7.  Scope risks (what makes it too big for 1 year).
          8.  Closing: Value to scientists/funders regarding trust in uninterpretable variables.

  2.  **Deconstruct the Core Idea & Refine the Argument:**
      *   *Problem:* SR claims structure persists across theory change. But we usually identify this structure *after* the new theory arrives (hindsight bias).
      *   *Solution:* Use ML as a "blind" structure finder. If SR is robust, an ML model trained *only* on old data should find the structure that turns out to be real/persistent, not just the structure of the old theory.
      *   *Challenge:* How to compare structures without shared vocabulary? (Isomorphism, causal graphs, etc.)
      *   *Challenge:* Distinguishing predictive success from structural recovery.

  3.  **Drafting - Section by Section:**

      *   **Title:** Needs to be catchy but precise. *Structural Realism Without Hindsight: A Machine-Learning Test of Theoretical Continuity.*
      *   **Introduction/Question:** Define the gap. SR says structure survives. But is that because structure *is* real, or because we cherry-pick what survived? The question: *Can structure-finding algorithms, constrained to pre-revolution data, identify the specific relational patterns that persist into the post-revolution theory?*
      *   **Philosophical Context:** Address the panel split.
          *   *Physics side:* Knows SR (Worrall, Ladyman). Needs to see why ML matters.
          *   *ML side:* Knows models/params. Needs to see why SR matters.
          *   *Why SR leaves it open:* SR focuses on formalisms (equations). ML offers non-sentential structure (weights/activations).
          *   *Why alternatives fail:* "Scientific discovery" is too broad/psychological. "Machine understanding" is anthropomorphic. This is about *ontological continuity*, not cognition.
      *   **Methodology (12 Months):**
          *   *Months 1-3:* Case selection (e.g., Newton to Einstein, or specific phase transitions). Data digitization.
          *   *Months 4-6:* Model training (simple architectures, open source). Constraint: Train *only* on pre-successor data.
          *   *Months 7-9:* Structural comparison. The hard part. Mapping latent space to successor variables.
          *   *Months 10-12:* Analysis and writing.
          *   *Compute:* Modest. No LLMs. Maybe simple neural nets or symbolic regression on tabular data.
      *   **Structural Identity Criterion:** This is crucial. Cannot just be "same predictions." Must be "same causal/invariant relations." Use representational similarity analysis (RSA) or probing classifiers to see if latent dimensions align with successor theory variables *without* training on them.
      *   **Outcomes:**
          *   *Positive:* Models find the "future" structure. Supports SR.
          *   *Negative:* Models find old structure or noise. Undermines SR (suggests hindsight bias).
          *   *Null:* Models find neither. Suggests data insufficiency.
      *   **Failure Conditions:** If no suitable historical data exists, or if structural mapping is impossible to define formally.
      *   **Scope Risks:** Case studies might be too complex. Need to limit scope (e.g., specific physical constants or phase transitions rather than full GR).
      *   **Closing/Impact:** Why fund this? Trust in AI. If we can't verify if AI finds "real" structure, we can't trust it in high-stakes science (climate, drug discovery).

  4.  **Refining and Polishing (Word Count & Tone Check):**
      *   *Tone:* Academic, precise, confident but humble about limitations.
      *   *Audience Check:* Avoid heavy jargon from one side without explanation. Explain "structural realism" briefly for ML folks. Explain "latent space" briefly for physicists.
      *   *Constraint Check:* No citations. No empirical claims that need verification later (frame as *testing* a hypothesis).
      *   *Word Count:* Aiming for ~1,200. Need to be concise.

      *(Self-Correction during drafting)*: I initially thought about using LLMs. The prompt says "no proprietary models" and "modest compute." I should specify simpler architectures (MLPs, symbolic regression) to ensure feasibility.
      *(Self-Correction on Structural Criterion)*: I need to be careful not to define structure as just "prediction." I need to mention *invariance* or *intervention*.
      *(Self-Correction on Historical Cases)*: Don't promise Newton-to-Einstein (too hard/data scarce). Suggest more contained episodes, like thermodynamics or specific spectral data. Actually, better to keep it general but plausible: "episodes where numerical data predates the theoretical shift."

  5.  **Final Review against Prompt Requirements:**
      *   Precise question? Yes.
      *   Why SR leaves it open? Yes.
      *   Why alternatives miss the point? Yes.
      *   Method (month-by-month)? Yes.
      *   Criterion for structure? Yes.
      *   Conclusions/Decision criteria? Yes.
      *   Failure conditions? Yes.
      *   Scope risks? Yes.
      *   Closing (value to scientists/funders)? Yes.
      *   No bibliography? Yes.
      *   Legible to both panels? Yes.

  6.  **Writing the Draft:** (Proceeding to generate text based on these thoughts.)
      *   *Focus on clarity.*
      *   *Ensure the "Retrospective Test" is the centerpiece.*
      *   *Make sure the "Value" section lands hard.*

      *(Word Count Check)*: I need to monitor the length. If it gets too short, expand on the philosophical nuance. If too long, trim the timeline details.

      *(Refining the "Criterion" section)*: This is the trickiest philosophical bit. How to say two structures are the same without shared terms? I will propose looking for *isomorphisms in counterfactual support*. If manipulating latent variable X changes output Y in the same way manipulating theoretical variable X' changes Y' in the new theory, that's structural identity.

      *(Refining the "Failure" section)*: Be honest. If the data is too noisy, the project fails.

      *(Refining the "Closing")*: Connect to "trustworthy AI."

      *Let's write.*
answer: |-
  **Title:** Structural Realism Without Hindsight: A Machine-Learning Test of Theoretical Continuity

  **Project Summary**
  Structural realism posits that while specific theoretical entities may be discarded during scientific revolutions, the mathematical structure of the world is retained. However, this claim is almost exclusively evaluated retrospectively. We identify structure as "real" only after a new theory arrives to validate it. This project proposes a prospective test of structural continuity using machine learning. By training models exclusively on data available *before* a known theoretical shift, we can ask whether the internal structure the models converge upon matches the structure of the successor theory, without any access to that successor theory during training. This tests whether structural continuity is a robust feature of the data or an artifact of hindsight.

  **The Question**
  The central question is determinate: *Do structure-extracting algorithms, constrained to pre-revolutionary data, converge on relational patterns that are isomorphic to the variables and relations of the successor theory, rather than those of the superseded theory?*

  A positive answer supports the structural realist claim that the data itself encodes the enduring structure of the world, independent of human formalism. A negative answer suggests that structural continuity is a narrative construct applied after the fact, selecting only those relations that happen to be expressible in the new vocabulary.

  **Philosophical Context and Distinctiveness**
  This question remains open for both moderate and strong structural realism because both rely on human-stated formalisms. The realist argues that equations persist; the anti-realist argues that equations are merely instruments. Neither accounts for structure that exists as a high-dimensional configuration of parameters rather than a set of sentences. Machine learning provides a medium for structure that is non-sentential but mathematically precise.

  Alternative approaches fail to capture this specific ontological problem. Treating this as a problem of "scientific discovery" reduces it to psychology or heuristics, ignoring whether the discovered structure corresponds to mind-independent relations. Treating it as a question of "machine understanding" anthropomorphizes the model, asking if it "knows" the theory. This project asks no such thing. It asks only if the topological or causal geometry of the model's latent space aligns with the geometry of the successor theory's state space. This is a question about the world's compressibility, not the machine's cognition.

  **Methodology**
  The project proceeds over twelve months, utilizing open-source architectures and modest compute resources (single GPU workstation).

  *Months 1–3: Case Selection and Data Curation.*
  I will identify two historical episodes where numerical data predates the theoretical shift. Candidates include the transition from classical to quantum descriptions of blackbody radiation or specific phase transitions in thermodynamics. The requirement is machine-readable data available prior to the publication of the successor theory. I will digitize archival data if necessary, ensuring no leakage from post-revolution measurements.

  *Months 4–6: Model Training and Constraint.*
  I will train distinct model classes (e.g., multi-layer perceptrons and symbolic regression networks) on the pre-change data. The critical constraint is that the loss function optimizes only for predictive accuracy on the old data, with no regularization toward the successor theory. I will use early stopping based on validation sets derived strictly from the pre-change era to prevent overfitting to noise that only makes sense later.

  *Months 7–9: Structural Mapping.*
  This is the technical core. I must compare the model's internal representations to the successor theory's variables without shared vocabulary. I will employ Representational Similarity Analysis (RSA). I will generate probe tasks based on the successor theory's counterfactuals (e.g., "If variable X increases, does Y decrease?"). I will test whether interventions on the model's latent dimensions replicate these counterfactual dependencies. If manipulating a specific cluster of neurons produces invariant relations matching the successor theory's equations, structural identity is established.

  *Months 10–12: Analysis and Dissemination.*
  I will quantify the degree of isomorphism. Results will be written up for dual-audience journals in philosophy of science and AI safety.

  **Criterion for Structural Recurrence**
  Predictive equivalence is insufficient; a wrong theory can predict correctly within a limited domain. The criterion for structural recurrence is *invariance under intervention*. Two structures are identical if, and only if, they support the same set of counterfactuals.

  Formally, let $S_{model}$ be the structure of the trained network's latent space and $S_{theory}$ be the structure of the successor theory. We establish identity if there exists a mapping $f$ from latent activations to theoretical variables such that interventions on the latent space (via causal scrubbing or activation patching) yield changes in output that are statistically indistinguishable from interventions on the theoretical variables. This ensures we are measuring the same web of dependencies, not just the same input-output function.

  **Possible Conclusions**
  1.  **Convergence:** The models spontaneously develop latent structures isomorphic to the successor theory. *Conclusion:* Structural realism is empirically robust; the data constrains theory choice more than human convention suggests.
  2.  **Divergence:** The models settle on structures isomorphic to the superseded theory or on opaque structures with no clear theoretical mapping. *Conclusion:* Structural continuity is likely a retrospective rationalization; the "surviving" structure was not latent in the data but imposed by the new formalism.
  3.  **Null:** The models fail to generalize or find stable structures. *Conclusion:* The historical data was insufficient to determine the structure, implying that theory change requires non-empirical virtues (aesthetic, pragmatic) that machines cannot access.

  **Failure Conditions and Scope Risks**
  The project fails if no historical case offers sufficient data density to train a model beyond trivial baselines. If the pre-revolution data is too sparse, the model cannot find *any* structure, rendering the test inconclusive.

  The primary risk to the one-year timeline is the complexity of the structural mapping (Months 7–9). Comparing high-dimensional latent spaces to physical equations is mathematically demanding. To mitigate this, I will limit the scope to specific subsystems (e.g., spectral lines rather than full field equations) rather than attempting to reconstruct entire theories. If the mapping proves intractable for physical theories, I will pivot to synthetic cases where the "true" structure is known by design, though this reduces the historical philosophical weight.

  **Value to Scientists and Funders**
  Beyond the philosophical debate, this project addresses a critical issue in contemporary science: trust in uninterpretable variables. Scientists increasingly rely on machine learning to identify candidates for new physical laws or drug targets. They need to know whether a variable found by a model is a "real" structural feature of the system or a statistical artifact.

  If this project demonstrates that models can recover enduring structure from limited data, it validates the use of deep learning as a tool for ontological discovery, not just prediction. It suggests that when a model finds a pattern we cannot paraphrase, we may still have reason to trust it as a guide to reality. Conversely, if the project shows that models systematically fail to recover known surviving structures without hindsight, it serves as a warning. It would indicate that high predictive accuracy does not guarantee structural validity, urging caution when deploying black-box models in high-stakes scientific domains like climate modeling or epidemiology. Funders require assurance that AI-driven science is discovering mechanisms, not just fitting curves. This project provides a metric for distinguishing the two.
