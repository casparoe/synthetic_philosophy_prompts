      *   *Philosophy Check:* Mention David Chalmers (Reality+) or Cogburn/Robson (Philosophy and Video Games) to ground the user's thesis in existing lit.

  9.  **Final Polish:** Ensure the distinction between "Virtual Objects" (ontology) and "Virtual Harms" (ethics) is clear, as the user's conditions mix them slightly. Reachability = Objecthood. Irreversibility = Harm.

