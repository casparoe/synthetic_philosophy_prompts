      *   **Primary Text:** *Ready Player One* (RPO) by Ernest Cline.
      *   **User's Framework:** Two conditions for "realness":
          1.  *Reachability:* A virtual object counts if a player can in principle access/interact with it.
          2.  *Irreversibility:* A virtual loss counts as harm only if admins can't undo it (roll back).
