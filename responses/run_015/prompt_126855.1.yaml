      WHEREAS the aggregate consequence of individually rational decisions may yield collectively suboptimal outcomes; AND WHEREAS the capacity of any single agent to initiate actions with global significance necessitates procedural restraint; THIS CHARTER establishes the governance framework for the Joint Committee on Non-Unilateral Conduct (hereinafter "the Committee").

