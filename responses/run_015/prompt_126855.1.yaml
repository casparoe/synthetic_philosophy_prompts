  CHARTER OF NON-UNILATERAL CONDUCT
  Issued by the Office of Student Compliance
  Reference: JCNUC-2024-Alpha

  PREAMBLE
  WHEREAS the aggregate consequence of individually rational decisions may yield collectively suboptimal outcomes; AND WHEREAS the capacity of any single agent to initiate actions with global significance necessitates procedural restraint to prevent systemic collapse; THIS CHARTER establishes the governance framework for the Joint Committee on Non-Unilateral Conduct (hereinafter "the Committee"). The purpose of this document is to operationalise the precautionary principle across all domains of student life, ensuring that no unilateral action precipitates a negative equilibrium.

  ARTICLE 1: SCOPE OF UNILATERAL POTENTIAL
  1.1. A "Unilateral Action" is defined as any decision executed by a member of the student body without prior consensus, wherein the universalisation of said decision would result in systemic failure.
  1.2. This includes, but is not limited to: adjusting communal thermostats, booking seminar rooms without cross-departmental verification, and selecting sandwich fillings where supply chain fragility exists.
  1.3. Members acknowledge that while a single adjustment of the heating dial is locally optimising, the universalisation of such adjustments precipitates boiler failure. Consequently, all thermal modifications are presumed prohibited until cleared.
  1.4. Similarly, booking a seminar room is benign in isolation; however, if every agent books a room simultaneously, space scarcity renders the action catastrophic. Therefore, all room reservations require impact assessment.

  ARTICLE 2: PROHIBITION AND VETO MECHANISMS
  2.1. No member shall execute a Unilateral Action without written authorisation from the Committee.
  2.2. The Committee retains absolute veto power over any proposed action where the marginal benefit to the actor is outweighed by the potential aggregate risk to the collective.
  2.3. In cases of uncertainty regarding aggregate risk, the precautionary principle applies: action shall be withheld pending further impact assessment.
  2.4. The burden of proof lies upon the actor to demonstrate that their action, if universalised, would not degrade communal welfare.

  ARTICLE 3: MANDATORY PARTICIPATION PROTOCOLS (REVERSE UNILATERALIST'S BLESSING)
  3.1. Recognising the Reverse Unilateralist's Blessing, members acknowledge that universal abstention from certain locally beneficial acts may constitute a collective hazard.
  3.2. Specifically, if all members abstain from utilising catering services, the vendor shall collapse, resulting in universal starvation. Therefore, universal restraint is categorised as a dangerous unilateralist outcome.
  3.3. To mitigate this, members are hereby mandated to consume one (1) sandwich per week to sustain the catering ecosystem.
  3.4. However, pursuant to Article 2.1, the act of consumption requires Committee authorisation to prevent supply chain overload caused by universal consumption.
  3.5. Thus, members must apply for permission to fulfil their mandatory consumption obligation. If permission is denied to prevent overload, the member remains obligated to eat but prohibited from doing so, creating a compliance paradox to be resolved via Article 4.
  3.6. Inaction is hereby classified as an action subject to veto.

  ARTICLE 4: SECOND-ORDER OVERSIGHT AND REGRESS
  4.1. The Committee itself constitutes a collective agent capable of unilateral action (e.g., granting veto).
  4.2. If all Committees were to grant vetoes unilaterally, administrative paralysis would ensue. Therefore, the Committee's decisions are subject to the Unilateralist's Curse.
  4.3. Consequently, all Committee rulings require approval from a Second-Order Oversight Subcommittee (hereinafter "SOOS").
  4.4. The SOOS is similarly susceptible to unilateral decision-making risks regarding its own approvals.
  4.5. Therefore, SOOS determinations require validation from a Third-Order Meta-Committee.
  4.6. This chain of validation continues ad infinitum to ensure no layer of bureaucracy operates without higher-order consensus, preventing any single administrative layer from becoming a unilateral bottleneck.

  APPENDIX A: INTERIM AUTHORITY DEFERRAL
  A.1. Pending the constitution of the Third-Order Meta-Committee, all authority currently vested in the Committee and the SOOS is hereby suspended.
  A.2. All decisions regarding heating, catering, and seminar rooms are deferred to the Fourth-Order Ultimate Validation Body (FOUVB).
  A.3. The FOUVB has not yet been constituted.
  A.4. Until the FOUVB is formed, all members shall maintain the status quo ante, notwithstanding the mandates in Article 3.3.
  A.5. In the event that maintaining the status quo constitutes a harmful universal abstention, members are referred to the FOUVB for exemption guidelines.
  A.6. This Charter comes into effect upon the approval of the FOUVB.
