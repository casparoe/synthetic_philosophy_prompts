          *   Hole Argument is like "Metric field is the only structure".
          *   So, the distinction is **Background Independence**.
          *   GR is Background Independent $\rightarrow$ LE applies.
          *   Flash is Background Dependent $\rightarrow$ LE does not apply (or applies only to the dynamical fields, not the background).
          *   If LE doesn't apply to Flash, Step 5-7 fail. Flash remains indeterministic. GR remains deterministic (via LE).
          *   This allows the User to keep their preferred verdicts.

