          *   So Flash is deterministic.
          *   Why does it feel indeterministic? Because we are conflating the *mathematical model* (where $t$ is a coordinate) with the *physical world*.
          *   If we insist Flash is indeterministic, we are implicitly treating $t$ as substantive.
          *   If we treat $t$ as substantive, we must treat manifold points in GR as substantive (to be consistent).
          *   If we treat manifold points in GR as substantive, GR is indeterministic (Hole Argument).
          *   So the User faces a trilemma:
              1.  Accept LE for GR (Deterministic GR) AND Accept LE for Flash (Deterministic Flash). (Consistent Relationalism).
              2.  Reject LE for GR (Indeterministic GR) AND Reject LE for Flash (Indeterministic Flash). (Consistent Substantivalism).
              3.  Accept LE for GR (Deterministic GR) AND Reject LE for Flash (Indeterministic Flash). (Hybrid).
          *   The User wants Option 3.
          *   Is Option 3 defensible?
          *   Yes, if there is a relevant difference between GR diffeos and Flash time-shifts.
          *   Difference: **Local vs Global**.
          *   Hole diffeos can be the identity on the past and non-trivial in the future (Local Gauge).
          *   Flash time-shifts cannot be the identity on the past and non-trivial in the future (Global Symmetry).
          *   Determinism is about the *local* propagation of data.
          *   LE is required to handle the *local* gauge redundancy that threatens local determinism.
