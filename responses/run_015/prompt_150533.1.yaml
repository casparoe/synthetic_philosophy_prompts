  In a sterile clinical workshop, a macroscopic incandescent lamp is wired to a electromechanical actuator scheduled to operate at intervals $t_n = T - T/2^{n-1}$, converging on a limit time $T$. The agent programmes the actuator to engage only on every even-numbered step, ensuring an infinite sequence of toggles without a final operation. This switching mechanism is rigidly coupled to a hydraulic accumulator: each mechanical engagement displaces a fixed volume $v$ of incompressible fluid into a closed-loop tube feeding a patient's stabilising system, with the accumulator's usable capacity constrained to exactly $2v$. The fluid flow rate to the patient is governed by a continuous function proportional to the remaining pressure head in the accumulator, which decays exponentially between displacements, and the patient's physiological stability requires that the pressure at $T$ remain strictly positive.

  (1) **Physical State at $T$:** Despite the infinite sequence of discrete displacements, the pressure within the hydraulic system at $T$ is determinate and strictly positive. Because the flow rate is continuous and governed by differential equations describing pressure decay and replenishment, the state of the fluid at $T$ is defined by the limit of the pressure function $P(t)$ as $t \to T$. Given the halving intervals, the frequency of displacement approaches infinity, effectively smoothing the discrete pulses into a continuous mean flow; the continuity of the hydraulic parameter ensures $P(T)$ converges to a specific value derived from the initial charge and decay constant, satisfying the stability condition regardless of the switch's discrete history.

  (2) **Failure of Thomson's Argument:** Thomson's original indeterminacy argument relies on the premise that the state of the system at $T$ is solely a function of the parity of the number of toggles performed. This reasoning fails to settle the state of the coupled system because the relevant variable for patient stability is not the discrete position of the switch (on/off), but the continuous pressure of the fluid. The parity of an infinite set is undefined, rendering the lamp's state indeterminate; however, the pressure is not a function of parity but of temporal integration. The continuous nature of the hydraulic medium obeys the Cauchy criterion for convergence, bypassing the logical discontinuity that plagues the discrete switch.

  (3) **Structural Feature and Removal:** The exact structural feature resolving the indeterminacy is the *continuous coupling* between the discrete actuator and the hydraulic load, which acts as a low-pass filter integrating the discrete inputs over time. If this feature is removed—isolating the lamp from the reservoir and considering only the electrical state of the bulb—the system reverts to a purely discrete sequence of states with no intervening continuous variable. In this reduced case, the state at $T$ depends entirely on the limit of the sequence $0, 1, 0, 1...$, which does not exist; thus, removing the continuous coupling collapses the scenario back into Thomson's original problem of indeterminacy.

  (4) **Defence Against Objection:** Objections that this scenario merely changes the subject from a lamp to a hydraulic device misunderstand the philosophical aim, which is to isolate the topological source of supertask indeterminacy. The lamp remains central as the trigger of the supertask, but the hydraulic coupling demonstrates that indeterminacy is not an inherent property of infinite procedures *per se*, but rather a consequence of mapping discrete states onto a limit point without a continuous mediating variable. This variant is legitimate because it retains the essential Zeno-like structure of the supertask while testing whether the failure of determinacy lies in the infinity of the task or in the discreteness of the property being measured.
