      *   *The Consequence:* If we allow unlimited computation for the trader, the only way to avoid exploitation is to *already know the answer*. This collapses logical uncertainty back into logical omniscience.
      *   *The Solution:* Restrict the trader to be *bounded* (polynomial time). This acknowledges the agent is also bounded. The agent shouldn't be punished for not knowing what a feasible computer couldn't figure out yet.
      *   *Analogy:* You shouldn't be penalized for not knowing the answer to a hard math problem if no one else could solve it quickly either. But if there's an *efficient* pattern you missed, you *should* be penalized.
      *   *Key Insight:* It creates a gap between "truth" and "provability within resource limits."

  3.  **Deconstruct Question 2: Unbounded Profits Over Time vs. One-Shot Loss:**
