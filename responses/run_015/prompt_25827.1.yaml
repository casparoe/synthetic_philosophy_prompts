answer: |-
  You have stumbled upon one of the most persistent and fertile puzzles in decision theory. Your intuition is not only coherent, it is shared by a significant minority of philosophers, computer scientists, and economists. Your professor's dismissal of your view as "just Evidential Decision Theory (EDT)" is a common reaction, but as you suspect, it glosses over a crucial mechanistic distinction.

  Here is a breakdown of the position you are articulating, its established names, its relationship to EDT, the objections it faces, and its current status in the field.

  ### 1. Does this reasoning have a name?

  Yes. Depending on the historical context and the level of formalization, your reasoning falls under three primary labels:

  *   **Superrationality:** Coined by Douglas Hofstadter in his 1983 *Scientific American* column. He explicitly described the scenario you did: identical rational agents playing a Prisoner's Dilemma. He argued that rationality should acknowledge the logical symmetry between players, leading to cooperation.
  *   **Timeless Decision Theory (TDT):** Developed by Eliezer Yudkowsky (2010). This formalizes the idea that you should choose as if you are selecting the output of a *computation* that is instantiated in multiple places (your brain and your opponent's brain).
  *   **Functional Decision Theory (FDT):** The modern successor to TDT, developed by Yudkowsky and Nate Soares (2017). This is currently the most rigorous formulation of the view you are holding. It treats decisions as the output of a decision *function*, and argues that rational agents should maximize utility based on the logical consequences of that function's output, not just the causal consequences of the physical act.

  There is also a parallel tradition in moral philosophy, specifically **Kantian Contractualism** (e.g., David Gauthier's *Morals by Agreement*), which argues for "Constrained Maximization" based on the idea that rational agents would agree to cooperate if they could recognize each other as similarly disposed. However, FDT is the decision-theoretic home for your specific argument.

  ### 2. How does it differ from Evidential Decision Theory (EDT)?

  Your professor is partially right that EDT and your view yield the same *action* (Cooperate) in this specific scenario, but they are wrong that the *reasoning* is identical. This is the distinction you sensed but couldn't quite name.

  *   **EDT (The Professor's View):** EDT asks, "What does my action *tell me* about the world?" It relies on conditional probabilities: $P(\text{Opponent Cooperates} | \text{I Cooperate})$. For EDT to recommend cooperation, there must be a pre-existing statistical correlation between your action and theirs (e.g., you are both from the same culture, or have similar psychologies). EDT treats the correlation as a brute empirical fact.
  *   **FDT/TDT (Your View):** FDT asks, "What is the *logical output* of my decision algorithm?" It relies on logical counterfactuals. It argues that because you and the opponent are running the *same algorithm* on the *same inputs*, the outputs *must* match. It is not that your action is *evidence* of theirs; it is that your decision procedure and theirs are logically linked.

  **The Crucial Test Case:**
  The difference becomes clear in variants of the Prisoner's Dilemma where correlation exists without logical identity.
  *   Imagine you play against a clone of yourself created 5 minutes ago. **FDT** says Cooperate (same algorithm). **EDT** says Cooperate (high correlation).
  *   Imagine you play against a perfect simulation of you that was run yesterday. **FDT** says Cooperate (your decision now logically determines the simulation's output then, in terms of the algorithm's truth). **EDT** might struggle here depending on how it handles time and causality.
  *   Imagine you play against someone who is *not* identical to you, but who has a 99% tendency to do what you do. **FDT** might defect (algorithms differ), while **EDT** cooperates (correlation is high).

  Your argument rests on **logical necessity**, not **probabilistic evidence**.

  ### 3. Has it been taken seriously?

  Yes. While Causal Decision Theory (CDT) remains the standard in economics and classical game theory, FDT/TDT has gained significant traction in:
  *   **AI Safety Research:** Researchers at the Machine Intelligence Research Institute (MIRI) and others working on agent foundations treat this as a critical problem for aligning superintelligent agents. If AI agents reason via CDT, they will defect in dilemmas where cooperation yields higher utility.
  *   **Philosophy of Logic:** It engages with deep questions about counterpossible reasoning (reasoning about what would happen if a mathematical truth were different).
  *   **Newcomb's Problem:** This reasoning is the standard "one-box" solution to Newcomb's Problem, which is structurally similar to the Twin PD.

  ### 4. What are the standard objections?

  If this reasoning is so compelling, why isn't it the standard textbook view?

  **A. The Causal Isolation Objection (The CDT Defense)**
  The standard objection is that your physical action (moving your hand to press "Cooperate") cannot causally influence the atoms in the other player's brain. In a one-shot game with no communication, there is no causal mechanism. CDT proponents argue that rationality is about controlling outcomes via *causal leverage*. Since you have zero causal leverage over the twin, you should defect to secure the dominant payoff. They argue your reasoning commits the "fallacy of trying to cause the inevitable."

  **B. The Fragility of Identity**
  Your reasoning requires the agents to be *identical* in their decision procedure. In the real world, no two humans are algorithmically identical. If there is even a 0.01% chance the other player reasons differently, the logical link breaks. CDT is robust to noise; FDT is fragile. If you cooperate based on logical identity and the other player defects (due to a slight reasoning error), you get the "sucker's payoff."

  **C. The Problem of Logical Counterfactuals**
  This is the technical weakness. In CDT, we know how to model "If I were to push this button..." (we intervene on the causal graph). In FDT, we ask "If the output of this deterministic function were 'Cooperate'..." But if the function is deterministic, the output *cannot* be otherwise. How do you rigorously define a counterfactual where a mathematical truth is different? This requires non-standard logic (e.g., proof-based decision theory or logical induction), which is mathematically complex and not yet fully settled.

  **D. Exploitability**
  In asymmetric games, reasoning this way can sometimes lead to suboptimal outcomes if the other player is a CDT agent. If you are an FDT agent playing against a CDT agent in certain bargaining scenarios, the CDT agent can sometimes "hold you hostage" by committing to strategies that exploit your logical reasoning.

  ### 5. Can it be formulated rigorously?

  Yes. **Functional Decision Theory (FDT)** is the rigorous formulation you are looking for.
  *   It models agents as having a decision function $\mathcal{D}$.
  *   It evaluates actions based on the expected utility of the output of $\mathcal{D}$, considering all instantiations of $\mathcal{D}$ in the environment.
  *   It uses "logical counterfactuals" to evaluate what happens if $\mathcal{D}(input) = \text{Cooperate}$ vs $\mathcal{D}(input) = \text{Defect}$.

  The paper *"Functional Decision Theory: A New Theory of Instrumental Rationality"* (Yudkowsky & Soares, 2017) is the primary source. It formally demonstrates that FDT outperforms CDT and EDT in a wide class of problems (including Newcomb's, Parfit's Hitchhiker, and the Twin Prisoner's Dilemma).

  ### 6. Confidence and Weakest Point

  **Confidence Level:** High.
  I am highly confident that your intuition maps directly to Functional Decision Theory and Hofstadter's Superrationality. The distinction you drew between "evidential correlation" and "logical identity of algorithms" is precisely the distinction FDT proponents draw against EDT proponents. Your professor's conflation of the two is a common pedagogical simplification, but technically inaccurate regarding the *mechanism* of the decision.

  **The Weakest/Most Contested Point:**
  The weakest point in this entire framework is the **metaphysics of logical counterfactuals**.
  To make FDT work, you must accept that it makes sense to ask, "What would happen if this mathematical function returned a different value than it actually does?" In standard logic, this is a contradiction (ex falso quodlibet). FDT requires a theory of "impossible possible worlds" or a specific way of truncating logical proofs to avoid explosion. While progress has been made (e.g., via *Logical Induction*), there is no universally accepted mathematical foundation for logical counterfactuals yet.

  Until that foundation is solidified, CDT proponents will continue to argue that FDT is "magic"—that it assumes a form of acausal influence that violates physicalism. Your challenge, if you wish to pursue this, is not to justify the *intuition* (which is strong), but to defend the *logic* of counterpossible reasoning against the charge that it is incoherent.

  ### Recommendation for Further Reading
  1.  **Hofstadter, D. R. (1983).** "Metamagical Themas: The Prisoner's Dilemma and the Logic of Reciprocity." *Scientific American*. (The accessible, philosophical origin).
  2.  **Yudkowsky, E., & Soares, N. (2017).** "Functional Decision Theory: A New Theory of Instrumental Rationality." *arXiv preprint*. (The rigorous formalization).
  3.  **Gauthier, D. (1986).** *Morals by Agreement*. (For the contractualist/philosophical angle on "Constrained Maximization").

  You are asking the right questions. Do not let the "standard analysis" shut down the inquiry; the standard analysis assumes a specific causal structure that your puzzle explicitly challenges.
