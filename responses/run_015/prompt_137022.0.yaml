  ### INSTRUCTOR'S CHEAT SHEET: THE STUCK POINTS

  **1. Endurantism (3D) vs. Perdurantism (4D)**
  You are right to be worried. None of the cases above cleanly separate the "Constitution View" (Leaf 6) from the "4D Overlap View" (Leaf 10). Both will say "The statue is gone, the lump remains" when squashed. Both allow two things in one place.
  *   **Why:** The difference is *how* they occupy the place (wholly present vs. temporal slices), not *what* happens to them.
  *   **The Fix:** You need a question about *parthood right now*. Ask: "Does the statue currently have a part that exists next week?" The 4Dist says "Yes (a future temporal part)." The 3Dist says "No (it will have a part, but doesn't now)." None of your nine cases ask this.
  *   **Recommendation:** Don't try to split them with this handout. Group them as "The Co-Location Coalition" and save the 3D/4D fight for a session on time.

  **2. Deflationary (Easy Ontology) vs. Robust Constitution**
  This is also hard to crack with case verdicts. A Deflationist (Thomasson) and a Constitutionist (Baker) will often give the exact same answers to "Is the statue gone?"
  *   **Why:** The disagreement is meta-ontological. Baker thinks "existence" is a heavy metaphysical fact. Thomasson thinks "existence" is just a rule of our concepts.
  *   **The Fix:** You need a question about *why* the answer is yes. Ask: "If everyone forgot what a statue was, would this object cease to exist?" The Deflationist might say "Yes (concept-dependent)." The Robust Realist says "No (mind-independent)."
  *   **Recommendation:** Use Case 5 (Beach) or Case 6 (Readymade) to probe this, but acknowledge in the session that the *verdict* might be the same even if the *reasons* differ.

  **3. Non-Discriminating Cases (Cut these for space)**
  *   **Case 8 (Adding a lump):** This is just a mini-version of Case 3 (Replacement). It tests mereological essentialism, but Case 3 does that more dramatically. Cut it.
  *   **Case 6 (Readymade):** Functionally identical to Case 5 (Beach). Both test whether intent is required for art-status. Keep Case 5 (it's more intuitive); cut Case 6.
  *   **Case 1 (Pre-existence):** Hard to get intuitions on "invisible statues." Cut it.

  **4. Attribution Check**
  *   **Gibbard:** Yes, "Contingent Identity" (Lumpl/Goliath) is the right label for the view that they are identical but have different modal properties.
  *   **Baker:** Yes, "Constitution is not Identity" is her signature view.
  *   **Lewis:** Be careful. Lewis is a 4Dist, but he denies *co-location* in the 3D sense (he says they share temporal parts). Label him "4D Overlap" to avoid confusion with 3D Constitution.
