  | View | Squash (Statue Dies?) | Beach (Intent Needed?) | Identity (One Thing?) | Diagnosis of Empty/Adjacent Cells |
  | :--- | :--- | :--- | :--- | :--- |
  | **Constitution (Baker)** | Yes | Yes | No | |
  | **4D Overlap (Sider/Lewis)** | Yes (Segment ends) | No (Usually) | No (Overlap) | *Empty cell (Yes/Yes/One):* Incoherent. If they are one thing, they share fate. |
  | **Contingent Identity (Gibbard)** | Yes & No (Guise-dependent) | Variable | Yes (Contingently) | *Empty cell (No/No/One):* Unattractive. Implies statues are eternal indestructible lumps. |
  | **Deflationism (Thomasson)** | Depends on Concept | Depends on Concept | Depends on Concept | *Empty cell (Yes/No/No):* Unexplored. Why distinct if shape alone suffices? |
  | **Material Essentialism** | Yes | No | No | *Empty cell (No/Yes/One):* Incoherent. If one thing, matter conditions must match. |
