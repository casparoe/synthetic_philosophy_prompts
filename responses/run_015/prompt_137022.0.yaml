answer: |-
  0. GATE: Look at the plinth. Are there zero statues here, or are there actually dozens of overlapping objects (a statue, a lump, a collection of atoms, a ten-minute-event-shaped-thing...)?
      1. Zero statues (only atoms/lump). -> EXIT: You are a Nihilist. Go drink coffee; come back for "Eliminativism Week."
      2. Dozens of objects. -> EXIT: You are a Universalist. Go drink coffee; come back for "Ontological Inflation Week."
      3. Roughly two things (one arty, one lumpy). -> PROCEED TO NODE 1.

      1. CASE 2 (SQUASHING): The sculptor squashes the object into a ball. Is the *statue* still there?
          1. Yes (The statue is now a ball). -> GO TO NODE 2.
          2. No (The statue is gone; only the lump remains). -> GO TO NODE 3.
          3. It depends on how you describe it. -> GO TO NODE 4.

          2. CASE 4 (RESHAPING): The ball is reshaped an hour later into the exact original form. Is it the *same* statue as before?
              1. Yes (Interruptions don't break identity). -> LEAF 1: STRICT IDENTITY VIEW.
                  *   What this view has to swallow: The statue and the lump are the same object, full stop, even if one could survive squashing and the other couldn't.
              2. No (The history is broken; it's a duplicate). -> LEAF 2: HISTORICAL ESSENTIALISM.
                  *   What this view has to swallow: Two objects can look exactly identical and be made of the same stuff, but one is the original and one isn't.
              3. Vague/Indeterminate. -> LEAF 3: ONTOLOGICALLY VAGUE IDENTITY.
                  *   What this view has to swallow: Reality itself can be fuzzy about whether an object exists or not.

          3. CASE 5 (BEACH): Erosion shapes a lump on a beach into the exact statue form. Is there a statue there?
              1. Yes (Shape is enough). -> LEAF 4: SHAPE REALISM.
                  *   What this view has to swallow: Nature makes art constantly; you just haven't named it yet.
              2. No (Needs an artist's intent). -> GO TO NODE 5.
              3. Only if someone calls it one. -> LEAF 5: CONCEPTUAL DEFLATIONISM.
                  *   What this view has to swallow: Existence isn't a deep metaphysical fact; it's a feature of our language games.

              5. CASE 3 (REPLACEMENT): Conservators replace every gram of clay over a year. Is it the same statue?
                  1. Yes (Form/Function matters). -> LEAF 6: CONSTITUTION VIEW (BAKER-STYLE).
                      *   What this view has to swallow: Two distinct things can share the same space and matter at the same time without being the same thing.
                  2. No (Original matter matters). -> LEAF 7: MATERIAL ESSENTIALISM.
                      *   What this view has to swallow: If you swap one atom, the original object is dead. (Good luck explaining metabolism).
                  3. It's indeterminate. -> LEAF 8: SEMANTIC INDETERMINACY.
                      *   What this view has to swallow: The world is precise, but our words are too blurry to cut it at the joints.

          4. CASE 7 (3D PRINT): Printing layer by layer. When does the statue begin?
              1. Layer 1 (Gradual start). -> GO TO NODE 6.
              2. Last Layer (Sharp start). -> GO TO NODE 6.
              3. No sharp line (Vague start). -> LEAF 9: TEMPORAL VAGUENESS.
                  *   What this view has to swallow: There is no fact of the matter about when an object pops into existence.

              6. CASE 9 (TEN-MINUTE OBJECT): Is there also a thing that exists only for the ten-minute opening ceremony?
                  1. Yes (Temporal parts exist). -> LEAF 10: FOUR-DIMENSIONAL OVERLAP.
                      *   What this view has to swallow: Objects are spread out in time like they are in space; you are only seeing a slice of the statue right now.
                  2. No (Only enduring wholes exist). -> LEAF 11: THREE-DIMENSIONAL CO-LOCATION.
                      *   What this view has to swallow: Two solid things can be in the exact same place at the exact same time without crashing.
                  3. Only if we count it. -> (Merge with Leaf 5).

