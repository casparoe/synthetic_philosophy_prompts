answer: |-
  Here are the four claims I will audit, with my preliminary expectations:

  1.  **"capitalists pay workers less than their labour is actually worth"**: I expect this to be **misleading**. Your intuition is correct: Marx distinguishes between *labour* (the activity) and *labour-power* (the capacity to work). He insists workers are paid the full value of their *labour-power*, but that commodity creates more value than it costs. Saying they are paid less than their labour is worth implies a market cheat rather than a structural exploitation.
  2.  **"Machinery... reserve army of labour... holds everyone's wages down"**: I expect this to be **accurate**. This is standard *Capital Vol. 1*, Chapter 15. It is the core of Marx's theory of mechanization.
  3.  **"labour time stops being the source of wealth... capitalism destroys itself by its own success"**: I expect this to be **half-right/contested**. This references the *Grundrisse* ("Fragment on Machines"). While Marx does argue science becomes the main productive force, whether this invalidates the labour theory of value or leads to automatic collapse is heavily debated among scholars.
  4.  **"mechanisation raised living standards enormously instead of immiserating anyone"**: I expect this to be **wrong**. Marx predicted *relative* immiseration (share of wealth) more than *absolute* immiseration (standard of living), and historically, early mechanization did immiserate many (e.g., early Industrial Revolution). The claim is too sweeping.

  ### Accuracy Audit Table

  | claim | verdict | what_marx_actually_holds | note_for_the_speech |
  | :--- | :--- | :--- | :--- |
  | "capitalists pay workers less than their labour is actually worth" | Misleading | Marx argues workers are paid the full value of their *labour-power* (cost of survival), but the *use* of that power creates more value than it costs; the exploitation is in production, not a wage cheat. | Have your character say we are paid for our time, not what we make, rather than saying we are cheated on the wage itself. |
  | "Machinery is how that squeeze gets worse... reserve army of labour... holds everyone's wages down" | Accurate | Marx argues machinery displaces workers, creating a surplus population that competes for jobs, thereby depressing wages for those still employed. | This is safe to keep; it is the strongest, most standard Marxian argument about automation. |
  | "labour time stops being the source of wealth... capitalism destroys itself by its own success" | Half-right | In the *Grundrisse*, Marx suggests science becomes the main productive force, creating a tension with a system based on labour-time, but he never fully resolved this in his finished economics. | Frame this as a tension or a contradiction the boss can't solve, rather than a settled law that guarantees collapse. |
  | "mechanisation raised living standards enormously instead of immiserating anyone" | Wrong | Marx predicted workers' share of wealth would fall relative to capitalists (relative immiseration), and absolute suffering was common in early mechanization; living standards rising does not refute the theory. | Avoid having the character accept this rebuttal; he should argue that even if we have more stuff, we have less power and security. |

