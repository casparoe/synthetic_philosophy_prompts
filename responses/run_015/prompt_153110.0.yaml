prompt: |-
  I run a small research nonprofit pitching a one-semester philosophy-of-technology paper. The question: Hofstadter claimed statistical machine translation is shallow because it never grasps meaning—just rearranges symbols like a monkey with a typewriter. But he focused on inter-language translation. I want to ask whether intralingal paraphrase—rewording a hard philosophical passage in the same language—changes the evaluation. If a model preserves conceptual structure when simplifying Kants Groundwork into modern English, is that still just statistics, or does it force Hofstadter to clarify what he meant by understanding? Write the proposal: state the precise question, why the inter- vs intra-lingual distinction hasnt been used to pressure Hofstadters view, the method (compare model outputs on the same source text in both modes), what results would look like, and an honest assessment of whether this is doable in one semester. No bibliograph needed; I'll fill cites in later.
