          1.  Expressive Legal Moralism (symbolic affirmation) vs. Instrumental Legal Moralism (preventing moral decay/social damage).
          2.  Direct Harm (victimization of individuals) vs. Structural Harm (erosion of normative framework).
      *   **Structure:**
          1.  Numbered Section of Agreed Claims (coercion, burden of proof, pluralism, harm principle logic, shared sentiments).
          2.  Table of Precise Disagreements (expressive legitimacy, epistemic status of moral ecology, structural vs. aggregated harm, majority sentiment).
          3.  Cruxes (sub-questions, probative evidence/analysis, explicit predictions).
          4.  Residue Section (verbal disputes vs. substantive disagreements).
      *   **Constraints:** No external references/bibliographies, suitable for experts but self-contained, accurate representation of views (no straw men).

  2.  **Deconstruct the Philosophical Positions:**
      *   **Devlin (Moralist):** Society has a right to protect its existence. Shared morality is the bond of society. Immorality threatens this bond (disintegration thesis). Law can enforce morality even without tangible harm to specific individuals because the *moral fabric* is a public good.
      *   **Hart (Liberal/Anti-Moralist):** Law should only prevent harm to others (Mill's Harm Principle). Enforcing morality for its own sake is tyranny. Moral skepticism or neutrality is required. "Disintegration" is an empirical claim that needs proof, not an assumption. Individual liberty is paramount.

  3.  **Drafting Section 1: Agreed Claims:**
      *   Need 5 specific areas: Legal Coercion, Burden of Justification, Empirical Pluralism, Logical Form of Harm Principle, Shared Moral Sentiments.
      *   *Goal:* Find common ground. Both agree coercion is serious. Both agree the state needs a reason. Both agree society is pluralistic (though they weigh it differently). Both agree on the logic of the harm principle (even if they define harm differently). Both agree society *has* some shared sentiments (Devlin thinks they are binding; Hart thinks they exist but aren't binding).
      *   *Drafting thought:* Ensure the language is neutral enough for Hart but robust enough for Devlin.
      *   *Claim 1 (Coercion):* Criminal law is a grave intrusion requiring strong justification.
      *   *Claim 2 (Burden):* The burden lies on the proponent of criminalization.
      *   *Claim 3 (Pluralism):* Modern societies contain diverse moral views; uniformity is not a given.
      *   *Claim 4 (Harm Principle Logic):* Preventing harm to others is a *sufficient* condition for criminalization (Hart) or at least a *primary* one (Devlin might concede it's necessary but not sufficient, or agree it's the standard baseline). Let's frame it as: "Preventing harm is a valid ground," leaving open if it's the *only* ground.
      *   *Claim 5 (Shared Sentiments):* Societies do exhibit clusters of shared moral intuition, identifiable through survey or consensus.

  4.  **Drafting Section 2: Table of Disagreements:**
      *   Need 4 specific issues: Expressive Justification, Epistemic Status of Moral Ecology, Structural vs. Aggregated Harm, Majority Sentiment.
      *   *Constraint:* Use the Expressive vs. Instrumental and Direct vs. Structural distinctions.
      *   *Issue 1 (Expressive):* Moralist: Law *should* express moral identity. Anti-Moralist: Law should remain neutral; expression is coercion.
      *   *Issue 2 (Epistemic/Moral Ecology):* Moralist: We can reasonably predict moral decay leads to social collapse. Anti-Moralist: This is speculative; the burden of proof is not met.
      *   *Issue 3 (Structural Harm):* Moralist: Structural harm is *sui generis* (distinct from sum of individual harms). Anti-Moralist: Structural harm is just aggregated individual harms or is too vague to count.
      *   *Issue 4 (Majority Sentiment):* Moralist: Intense majority feeling indicates the boundary of society's tolerance. Anti-Moralist: Majority feeling is irrelevant without independent harm demonstration.

  5.  **Drafting Section 3: Cruxes:**
      *   Need specific sub-questions where evidence could change minds.
      *   *Crux 1 (Empirical):* Does decriminalization of "victimless" moral offenses actually lead to social instability?
          *   Moralist Prediction: Yes, correlation between permissiveness and cohesion loss.
          *   Anti-Moralist Prediction: No, societies adapt; cohesion relies on justice, not uniformity.
      *   *Crux 2 (Conceptual):* Can "structural harm" be defined without circularity (i.e., harm = change in morality)?
          *   Moralist Prediction: Yes, it can be defined as loss of trust/cooperation capacity.
          *   Anti-Moralist Prediction: No, it inevitably collapses into "we dislike the change."
      *   *Crux 3 (Institutional):* Do moral laws stabilize or destabilize cooperation?
          *   Moralist Prediction: Stabilize by signaling boundaries.
          *   Anti-Moralist Prediction: Destabilize by creating resentment and black markets.

  6.  **Drafting Section 4: Residue (Verbal vs. Substantive):**
      *   Analyze terms: "Harm," "Morality," "Social Fabric."
      *   *Verbal:* Some disagreement is about the definition of "harm." If Devlin calls "offense to moral sensibility" harm, and Hart says "no, harm means physical/economic," they might just be talking past each other.
      *   *Substantive:* Even if they agree on definitions, they disagree on the *value* of liberty vs. cohesion.
      *   *Conclusion:* Some verbal overlap exists (what counts as harm), but the core conflict (state's right to enforce conformity) is real.

  7.  **Review and Refine:**
      *   *Tone Check:* Is it collaborative? Yes, "Joint Statement."
      *   *Distinction Check:* Did I clearly separate Expressive vs. Instrumental Moralism? (Need to ensure this is explicit in the table/cruxes). Did I separate Direct vs. Structural Harm? (Yes, in the table).
      *   *Accuracy Check:* Does this sound like Devlin? (Focus on society's right to exist, moral bond). Does this sound like Hart? (Focus on liberty, burden of proof, skepticism of empirical claims).
      *   *Formatting:* Numbered list, Table, Cruxes, Residue.

  8.  **Self-Correction during drafting:**
      *   *Correction:* In the Agreed Claims, make sure I don't force Hart to agree that morality *is* the bond of society. He can agree people *believe* it is, without agreeing it *is*.
      *   *Correction:* In the Table, ensure the "Expressive" distinction is clear. Devlin isn't just instrumental; he thinks the expression *is* the function. Hart thinks expression is exclusionary.
      *   *Refinement:* Make sure the "Structural Harm" distinction is precise. Is it reducible? Devlin says no. Hart says yes (or it's not harm).
      *   *Refinement:* Ensure the "Cruxes" offer specific types of evidence, not just "more research."

  9.  **Final Polish:** Check against the prompt's specific constraints (no bibliography, specific structure). Ensure the voice is joint but preserves the distinct positions in the disagreement sections. (Proceed to generate output).

  *(Self-Correction Note on "Expressive vs Instrumental"):* The prompt asks to work with these distinctions. I need to make sure the Moralist isn't *just* instrumental. Devlin often argues that the enforcement *is* the affirmation of the bond. The Anti-Moralist must reject the legitimacy of expressive justification entirely.

  *(Self-Correction Note on "Structural Harm"):* Hart would likely argue that "structural harm" is either reducible to direct harms (e.g., if trust breaks, people get cheated) or it is not a "harm" in the relevant sense (it's just change). Devlin argues it is *sui generis* (the death of society itself).

