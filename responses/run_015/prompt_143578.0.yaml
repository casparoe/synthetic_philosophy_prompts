answer: |-
  ### Part 1: Brainstorming and Philosophical Grounding

  You are asking for a tool to carve nature at its joints, but in medicine, the joints are often scar tissue. As a philosopher of causation, I deal in counterfactuals: *If C had not occurred, would E have occurred?* As an advisor to incident panels, I deal in grief, liability, and the desperate need for a story that makes sense. The tension between these two roles is where your panel is currently failing.

  **On the Nature of Causation and Omissions**
  For something to be a cause, it must make a difference. In the standard "but-for" test, if the doctor had escalated, and the patient would still have died, the failure to escalate is not a cause of death. It might be a breach of duty, it might be negligent, but it is not a *cause* of the specific outcome.

  The hard problem is omissions (failures to act). Metaphysically, an omission is nothing—it is the absence of an event. If we count absences as causes, the list of causes for any death becomes infinite (e.g., "failure of a billionaire to fund a cure," "failure of a nurse on another continent to fly in"). To restrict this, we need a **normative filter**. An omission is only a candidate cause if there was a *reasonable expectation* and a *capacity* to act. This solves the "Mars Specialist" problem but introduces value judgments into what looks like a factual inquiry.

  **The "Too Many Causes" Problem**
  You noted that allowing failures to act returns too many causes. This happens when panels confuse *risk factors* with *causes*. A staffing shortage is a risk factor. A failure to escalate is an event (or non-event). If the staffing shortage meant no one could have responded anyway, the failure to escalate did not change the outcome. It is a symptom of the cause (the shortage), not the cause of the death itself. Your panel conflates "something went wrong here" with "this specific wrongness killed the patient."

  **Panel Unreliability and Bias**
  Untutored panels are systematically unreliable in three ways:
  1.  **Salience Bias (Pattern 1):** We see the unticked box (positive evidence of absence) more clearly than the unthought thought (absence of evidence). We treat the record as the reality.
  2.  **Hindsight Bias (Pattern 3):** Once we know the patient died, we imagine the hypothetical world where the act occurred as a world where the patient *lives*. We unconsciously fix the resources in that hypothetical world to be sufficient to save them, even if they weren't in reality.
  3.  **Outcome Bias:** We judge the quality of the decision by the outcome. If the patient died, the decision not to escalate is judged as "causal" even if it was reasonable at the time.

  **The Values Handoff**
  You are correct that there is a values decision hiding here. Causation is partly factual (would the drug have stopped the reaction?) and partly normative (should the alert have been on?). When the facts run out (e.g., we don't know if the registrar would have arrived in time), the panel is often making a judgment about *accountability* disguised as a judgment about *causation*. We need to separate these. A finding of "No Causal Factor" does not mean "No Wrongdoing." It means "The wrongdoing did not alter this specific outcome." That is a distinction your reports must make explicit, or you will continue to derail careers unjustly or exonerate systems incorrectly.

  ***

  ### Part 2: The Decision Procedure (The "Causal Attribution Protocol")

  **Time Allocation:** 90 Minutes total per case.
  **Participants:** 6 Members (Chair facilitates).
  **Goal:** To assign verdicts (Causal, Contributing, Learning) based on evidence and defined counterfactuals, separating factual causation from systemic accountability.

  #### Phase 1: Fixing the Description (15 Minutes)
  *Goal: Prevent "Drifting Baseline" and "Description" biases.*

  **Q1: What is the specific act or omission under review?**
  *   **Requirement:** Describe the action in terms of *what was expected at that moment*, not the outcome.
  *   **Bad:** "Failure to prevent death."
  *   **Good:** "Failure to contact the registrar following 05:00 observations."
  *   **Rule:** Do not describe the omission by its consequence. Do not include the "blank box" as the omission; the omission is the lack of action, the box is just the record.
  *   **Evidence:** Protocols, job descriptions, witness testimony of expectation.

  **Q2: What is the "Fixed Baseline" for the counterfactual?**
  *   **Requirement:** Define what stays the same in the hypothetical world where the act *did* happen.
  *   **Rule:** Hold fixed all *systemic constraints* existing at the time (staffing levels, equipment availability, other concurrent emergencies). Vary only the *specific decision/action* of the individual or team in question.
  *   **Why:** We cannot assume a registrar would have been available if the roster shows they were covering two wards. We must test the omission against the *actual* resources, not *ideal* resources.

  #### Phase 2: The Counterfactual Test (30 Minutes)
  *Goal: Establish factual dependence.*

  **Q3: On the balance of probabilities (>50%), would the specific harm have been avoided if the act had been performed?**
  *   **Requirement:** Consider the Fixed Baseline from Q2.
  *   **Evidence:** Clinical literature, expert testimony, timeline analysis.
  *   **Decision:**
      *   **Yes:** Proceed to Q4.
      *   **No:** The factor is **Not a Causal Factor** for this outcome. (It may still be a Learning Point).
      *   **Uncertain/Unknown:** Mark as "Undetermined Causation." Do not guess.

  **Q4: Was there a capacity to act?**
  *   **Requirement:** Could the individual physically and cognitively have performed the act given the Fixed Baseline?
  *   **Evidence:** Workload logs, cognitive load assessment, physical barriers.
  *   **Decision:**
      *   **No (Impossible):** The omission is **Not a Causal Factor**. (The cause is the constraint that made it impossible).
      *   **Yes:** Proceed to Phase 3.

  #### Phase 3: Classification and Values Handoff (30 Minutes)
  *Goal: Assign verdicts and separate causation from accountability.*

  **Q5: Select the Verdict.**
  *   **Causal Factor:** The omission passed Q3 (Yes) and Q4 (Yes). The outcome would likely have been different.
  *   **Contributing Factor:** The omission increased the risk or reduced the chance of survival, but does not meet the >50% threshold for Q3 (e.g., "Loss of Chance" <50%). Or, multiple omissions existed where any single one was not sufficient, but the combination was (Pattern 5).
  *   **Learning Point:** The omission failed Q3 or Q4, but reveals a systemic vulnerability that could cause harm in a different context (e.g., different staffing levels).

  **Q6: The Values Handoff (The "Accountability Statement").**
  *   **Requirement:** If the verdict is "Not a Causal Factor" or "Contributing Factor," the panel must explicitly state whether this exonerates the individual from *blame* or *breach of duty*.
  *   **Rule:** Causation $\neq$ Blame. An individual can be in breach of duty (blameworthy) without being the cause of death (if the system was already broken).
  *   **Output:** A specific sentence in the report (see Part 5).

  #### Phase 4: Review and Sign-off (15 Minutes)
  *Goal: Check for Pattern 1 (Blank Box) and Pattern 6 (Systemic).*

  **Q7: Are we punishing the record or the act?**
  *   **Check:** Ensure we are not marking "Causal" simply because there is written evidence of the failure (the unticked box) compared to unwritten failures.

  **Q8: Is the cause diffused? (Pattern 5)**
  *   **Check:** If no individual is causal, but the team failed, assign "Causal Factor" to the *Team Process*, not a scapegoat.

  **Q9: Is the cause systemic? (Pattern 6)**
  *   **Check:** If the cause is "Nobody recruited the consultant," this is a **Learning Point** for the Board, not a Causal Factor for the clinician.

  ***

  ### Part 3: Philosophical Distinctions (Translation Notes)

  **What to Keep:**
  1.  **Counterfactual Dependence:** The core "but-for" logic. It is intuitive enough for lay members if phrased as "Would it have changed the outcome?"
  2.  **Normative Expectation (Duty):** Essential to distinguish omissions from non-events. We keep this in Q1 (Expectation) and Q4 (Capacity).
  3.  **The Fixed Baseline:** Crucial. Without this, the panel imagines a fantasy world where everything else works perfectly. This must be rigid.

  **What to Drop:**
  1.  **Metaphysical Status of Omissions:** Do not debate whether "nothing" can cause "something." It wastes time. Treat omissions as events for the purpose of the inquiry.
  2.  **Pre-emption Nuance:** (e.g., "If I didn't shoot him, the assassin would have"). In medicine, this is usually covered by the "Fixed Baseline" rule. If the other arrest was already happening, that is a fixed constraint.
  3.  **INUS Conditions:** (Insufficient but Necessary part of an Unnecessary but Sufficient condition). Too technical. Use "Contributing Factor" instead.

  **Where the Procedure Will Misfire:**
  1.  **The "Loss of Chance" Boundary:** The 50% threshold in Q3 is arbitrary. In medicine, survival is rarely >50% certain even with perfect care. The panel may feel uncomfortable ruling "Not Causal" when a chance was lost, even if <50%. *Mitigation:* Use the "Contributing Factor" verdict generously for loss of chance, but reserve "Causal" for probable avoidance.
  2.  **The "Fixed Baseline" Hardship:** Holding staffing levels fixed may lead to findings where the doctor's failure didn't matter because the system was already doomed. This is philosophically honest but politically dangerous. *Mitigation:* The Values Handoff (Q6) is mandatory here.

  ***

  ### Part 4: Application to Cases

  #### Case 1: The Overnight Deterioration
  *   **Facts:** Obs at 02:00, 05:00 (deteriorating). No escalation. Arrest 07:00. Death. Nurse 1:12. Outreach busy with 2 other arrests.
  *   **Procedure Run:**
      *   **Q1 (Description):** Failure to contact senior support following 05:00 obs.
      *   **Q2 (Baseline):** Hold fixed: 1:12 nursing ratio, Outreach team occupied until 07:00+. Vary: The phone call by the junior doctor/nurse.
      *   **Q3 (Counterfactual):** If called at 05:00, would death be avoided? Outreach was busy. Registrar coverage? If the baseline holds that *no senior support was physically available to attend within 2 hours*, then the outcome (Arrest at 07:00) remains unchanged.
      *   **Q4 (Capacity):** Given the occupancy, was escalation *capable* of producing a response? Evidence suggests no available responder.
      *   **Q5 (Verdict):** **Contributing Factor** (at best). It removed a *possibility* of rescue, but on balance of probabilities (>50%), the patient would have died regardless due to resource unavailability.
      *   **Q6 (Values Handoff):** This is not a Causal Factor for *death*, but it is a breach of protocol.
      *   **Q8/Q9 (Systemic):** The *cause* of the death is the staffing/resource constraint. This is a Learning Point for the Trust Board.

  #### Case 2: The Configured-Off Drug Alert
  *   **Facts:** Severe allergy. Drug prescribed. Alert disabled ward-wide 11 months prior. Reaction occurred. Staff member who disabled it has left.
  *   **Procedure Run:**
      *   **Q1 (Description):** Prescription of contraindicated drug in a system with disabled safety check.
      *   **Q2 (Baseline):** Hold fixed: Alert system configuration. Vary: The prescriber's check.
      *   **Q3 (Counterfactual):** If alert was active, would prescription be stopped? High probability (>50%). Alerts are designed to hard-stop or warn.
      *   **Q4 (Capacity):** Could the system have functioned? Yes.
      *   **Q5 (Verdict):** **Causal Factor.** (The system configuration). The individual prescriber is a **Contributing Factor** (human error exists, but the safety net was removed).
      *   **Q9 (Systemic):** The decision to disable the alert without review is a **Causal Factor** assigned to "Trust Governance Processes," not the departed employee.

  #### Case 3: The Unbooked Scan
  *   **Facts:** Discharge summary said "arrange scan." Three teams assumed another did it. Scan delayed 11 months. Prognosis changed.
  *   **Procedure Run:**
      *   **Q1 (Description):** Failure to confirm booking of discharge investigation.
      *   **Q2 (Baseline):** Hold fixed: Communication channels between teams. Vary: The act of confirmation by *any* of the three teams.
      *   **Q3 (Counterfactual):** If *any one* of the three teams had confirmed, would harm be avoided? Yes.
      *   **Q5 (Verdict):** **Causal Factor.** However, no *individual* is the sole cause.
      *   **Q8 (Diffused):** Assign Causal Factor to **"Inter-Team Handover Process."** Do not name an individual culprit. The *group* omission is necessary.
      *   **Q6 (Values):** This is a system design failure, not individual negligence.

  ***

  ### Part 5: The Unpopular Finding and The Script

  **The Unpopular Finding:**
  I expect the panel will dislike the finding in **Case 1 (The Overnight Deterioration)**.
  **Why:** The intuitive moral response is: "The doctor didn't call, the patient died, therefore the doctor caused the death." The procedure, by holding the baseline fixed (busy outreach, low staffing), may conclude that *even if the doctor had called, no one could have come.* Therefore, the omission did not cause the death. The cause was the staffing level.
  **Risk:** The family will read "Not a Causal Factor" as "The doctor did nothing wrong." The Board will read it as "We don't need to change staffing." The Doctor might feel exonerated when they breached protocol, or condemned because the system blamed them for being powerless.

  **The Script:**
  You need a sentence that decouples *causation of outcome* from *breach of duty* and *systemic hazard*. Insert this into the "Conclusion" section of the report for Case 1:

  > *"While the Panel finds that the failure to escalate did not alter the clinical outcome on the balance of probabilities—due to the unavailability of senior support at that time—this finding does not exonerate the breach of protocol, nor does it imply the outcome was inevitable. It indicates that the primary causal factor was the systemic lack of capacity to respond, which rendered the escalation pathway ineffective."*

  **Why this works:**
  1.  **"Did not alter the clinical outcome":** Technically accurate regarding causation (counterfactual).
  2.  **"Due to unavailability...":** Explains *why* it wasn't causal (Fixed Baseline).
  3.  **"Does not exonerate the breach":** Maintains professional standards (Normative Expectation).
  4.  **"Primary causal factor was systemic lack of capacity":** Shifts the blame to the Trust Board/Staffing, where the procedure located it.

  **Final Advice to the Chair:**
  When you present this to the panel, warn them: *"This tool will sometimes tell us that a mistake was not the cause of death. That is not a failure of the tool; it is a discovery of the truth. Our job is not to find a culprit to fit the tragedy; it is to find the cause to prevent the next one. If the cause is staffing, we must have the courage to write 'Staffing', not 'Doctor'."*
