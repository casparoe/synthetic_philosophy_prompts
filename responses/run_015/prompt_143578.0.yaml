  1.  **Analyze the Request:**
      *   **Role:** Professional philosopher specializing in causation + experienced advisor to hospital incident-investigation teams.
      *   **Task:** Create a decision procedure for a hospital serious-incident review panel to determine causation (specifically regarding omissions/failures).
      *   **Constraints:**
          *   Must include a brainstorming section first (showing thinking on causation, omissions, counterfactuals, panel biases).
          *   Must be usable by a non-philosopher panel in 90 minutes.
          *   Must address specific recurring patterns (blank box, description, drifting baseline, preventive failures, diffused failure, systemic failures).
          *   Must distinguish between "causal factor," "contributing factor," and "learning point."
          *   Must handle the "values vs. facts" handoff.
          *   Must apply the procedure to three specific cases (Overnight Deterioration, Configured-Off Alert, Unbooked Scan).
          *   Must anticipate an unpopular finding (likely Case 1) and provide language to explain it without sounding like exoneration.
      *   **Tone:** Professional, rigorous, empathetic, practical, clear.
      *   **Audience:** Consultant Geriatrician (Chair of the panel), Trust Board, Coroner, Bereaved Families.

  2.  **Brainstorming & Philosophical Grounding (Mental Draft):**
      *   *What is a cause?* In philosophy, usually counterfactual dependence (but-for test). If $C$ hadn't happened, $E$ wouldn't have.
      *   *The Problem of Omissions:* If I don't breathe, I die. If I don't save the drowning child, they die. Is my not-saving a cause? Legally/Morally, yes (if duty exists). Metaphysically, tricky. In medicine, we treat failures to act as causes *if there was a duty and capacity to act*.
      *   *The "Too Many Causes" Problem:* If we count omissions, why isn't "nobody flew in a specialist from Mars" a cause? Because it wasn't *expected* or *normal*. We need a normativity filter.
      *   *Panel Biases:*
          *   *Salience:* We see the unticked box (Pattern 1) easier than the unthought thought.
          *   *Description:* "Failed to escalate to registrar" vs. "Failed to escalate to available staff." (Pattern 2).
          *   *Drifting Baseline:* Changing the hypothetical world to suit the narrative (Pattern 3). We need to fix the "normal course of events."
          *   *Diffused Responsibility:* Many hands make no light work (Pattern 5).
          *   *System vs. Individual:* Pattern 6.
      *   *Verdicts:*
          *   *Causal Factor:* But-for cause + Duty + Capacity.
          *   *Contributing Factor:* Increased risk/probability but not strictly necessary (INUS condition).
          *   *Learning Point:* Systemic issue, no direct causal link to *this* outcome but prevents future ones.
      *   *Values vs. Facts:* Causation is partly factual (counterfactual), partly normative (duty/expectation). The panel needs to know when they are switching modes.

  3.  **Developing the Procedure (The "Tool"):**
      *   Need a step-by-step flow.
      *   *Step 1: Fix the Description.* Avoid hindsight bias. What was the specific act/omission?
      *   *Step 2: The Counterfactual Test (The "But-For").* Would the outcome have been avoided *on the balance of probabilities*?
      *   *Step 3: The Normative Filter (Duty & Capacity).* Was there a duty? Was it possible? (Addresses the "Mars specialist" problem).
      *   *Step 4: The Baseline Rule.* What stays fixed in the hypothetical? (Staffing levels, etc.).
      *   *Step 5: Classification.* Causal vs. Contributing vs. Learning.
      *   *Step 6: The Values Handoff.* Explicitly state if the finding is about accountability or system learning.

  4.  **Addressing the Specific Patterns:**
      *   *Blank Box:* Treat "no record" same as "no action." Focus on the action, not the ink.
      *   *Description:* Standardize to "The specific action expected by protocol at time T."
      *   *Baseline:* Hold fixed the *systemic constraints* (staffing), vary the *individual agency* (decision to act).
      *   *Diffused Failure:* Allow "Team Failure" as a causal factor, not just individuals.
      *   *Systemic (Pattern 6):* Classify as Learning Points unless a specific decision-maker failed to implement a known mandate.

  5.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the gravity. Establish the dual persona (Philosopher + Advisor).
      *   **Brainstorming:**
          *   *Causation:* Counterfactual dependence is necessary but not sufficient.
          *   *Omissions:* They are causes only relative to a norm/expectation.
          *   *Over-inclusion:* The "Mars Specialist" problem. Solved by "Reasonable Expectation."
          *   *Panel Unreliability:* Hindsight bias, outcome bias, salience of written records vs. unwritten thoughts.
      *   **The Procedure:**
          *   Make it a checklist.
          *   Define the three verdicts clearly.
          *   Include the "Baseline Rule."
          *   Include the "Values Handoff."
      *   **Philosophical Distinctions:**
          *   *Keep:* Counterfactual dependence, Normative Expectation (Duty), Capacity.
          *   *Drop:* Metaphysical debates on omissions (is it a 'real' event?), Pre-emption nuances (too complex for 90 mins).
      *   **Case Applications:**
          *   *Case 1 (Overnight):* This is the hard one. If outreach was busy and nurse ratio was 1:12, could escalation have *actually* changed the outcome? If the registrar wouldn't have come, is the failure to call them a cause? *Crucial distinction:* Did the failure to escalate *remove a chance*? If the chance was negligible due to staffing, causation is weak. *Decision:* Likely "Contributing Factor" or "No Causal Factor" regarding the death, but "Learning Point" on staffing. *Wait, the prompt asks me to expect an unpopular finding.* I need to argue that if the system was so broken that escalation wouldn't have helped, the *omission* isn't the cause of death, the *staffing* is. This is hard for families to hear.
          *   *Case 2 (Alert):* Clear causal factor. The alert was off. If on, prescription stopped. But who is responsible? The leaver? The system allowing it? *Verdict:* Causal Factor (System configuration), Learning Point (Governance).
          *   *Case 3 (Scan):* Diffused failure. No single person. *Verdict:* Causal Factor (Team Communication Process), not individual.
      *   **The Unpopular Finding (Case 1):**
          *   Need to explain that "Not a Cause" $\neq$ "Not Blameworthy" (actually, usually inverse here) $\neq$ "Nothing Wrong."
          *   It means the *link* between the specific omission and the *specific death* is broken by the systemic lack of capacity.
          *   Phrasing: "The omission did not alter the outcome given the constraints, but the constraints themselves are the hazard."

  6.  **Refining the Output:**
      *   *Check Constraints:* 90 minutes? Yes, keep steps tight. Six members? Yes, avoid jargon.
      *   *Tone Check:* Is it compassionate? Yes. Is it rigorous? Yes.
      *   *Specific Request:* "Tell me which case you think it will be [unpopular]." I will select Case 1.
      *   *Specific Request:* "Give me that sentence." I need a specific script for the report.

  7.  **Self-Correction/Review during drafting:**
      *   *Critique:* Is the distinction between Causal and Contributing clear?
      *   *Fix:* Define Causal as "On balance of probabilities, the outcome would have been avoided." Define Contributing as "The outcome might have been delayed or mitigated, or risk was significantly increased but not determinative."
      *   *Critique:* How to handle the "Drifting Baseline"?
      *   *Fix:* Explicit instruction: "Hold fixed the resources available at the time. Vary only the human decision/action in question."
      *   *Critique:* The "Blank Box" issue.
      *   *Fix:* Instruction: "Treat missing documentation as missing action only if corroborated. Do not treat missing documentation as the cause itself."
      *   *Philosophical nuance:* I need to be careful not to say omissions *aren't* causes. They are, but *normatively dependent*. I will use the term "Normative Counterfactual."

  8.  **Final Polish:** Ensure the transition from brainstorming to procedure is smooth. Ensure the case studies follow the procedure strictly. Make sure the "unpopular finding" section is empathetic but firm. (Self-correction: Ensure I don't absolve the doctor too easily in Case 1. The finding should be about the *causal link to death*, not the *breach of duty*.)

  9.  **Final Output Structure:**
      1.  Brainstorming/Philosophical Preamble.
      2.  The Decision Procedure (The "Protocol").
      3.  Philosophical Translation Notes (What to keep/drop).
      4.  Case Applications (1, 2, 3).
      5.  The Unpopular Finding & Script.

