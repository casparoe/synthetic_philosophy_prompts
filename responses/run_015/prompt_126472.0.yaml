answer: |-
  The cluster of practices presupposes that first-person pain reports possess pragmatic authority for clinical regulation rather than metaphysical infallibility regarding inner states. To reach this, I weighed three presuppositions: metaphysical infallibility (the subject cannot be wrong about their pain), epistemic privilege (the subject has superior access), and constructivism (the report creates the pain). The machine-feedback case distinguishes them: if the report changes upon seeing a machine score, infallibility is false; if the pain itself shifts, constructivism holds; if only the regulatory alignment shifts, pragmatic authority holds. I commit to pragmatic authority.

  The narrowest thesis required to make sense of the practice is that the patient's report functions as a normative claim for care, not a descriptive fact about neural magnitude. This separates the metaphysics of pain from the epistemology of its management. The practice survives giving up the metaphysics because dosing requires a decision-maker, not a truth-meter. We defer to the patient not because they know the 'true' pain magnitude—in fact, the peak-end heuristic shows they do not—but because they are the locus of suffering agency. The authority is about who gets to decide when relief is warranted, not who knows the objective state of the nervous system. If we keep the epistemology (reports are evidence) but drop the metaphysics (reports are truth), the practice remains intact: we treat the report as the best available signal for action, even if it is a constructed summary rather than a readout.

  Both transparent-window and interface views underwrite this protocol, leaving the metaphysics underdetermined. On the transparent view, the machine measures correlates while the patient measures the thing itself; disagreement implies patient error or machine noise. On the interface view, the patient reports UI status while the machine logs backend load; disagreement implies a calibration mismatch between user experience and system performance. The interface view supports a deflated first-person authority: the user knows what they need the system to do, not necessarily how the system is working. This deflated version is sufficient for the practice because clinical goals are regulatory (reduce distress) rather than ontological (match internal state). We do not need the patient to be a perfect witness to be a valid claimant.

  Regarding the feedback wrinkle, averaging is coherent on the interface view. If the report is a downstream output of a simplifying system, and the monitor measures backend nociceptive load, they are not measuring the same variable. Averaging them is not merging two measures of one thing; it is negotiating control between user intent and system safety limits. It is actually the right thing to do if the goal is stable system operation. The patient's report signals a demand for resources; the machine signals resource availability or physiological risk. The midpoint is a compromise between subjective demand and objective constraint. It is not unrigorous; it is functionally appropriate for a control system where the user interface is designed to be adjustable based on system feedback.

  Concrete changes in protocol would shift legal torts from compensating 'suffering' to compensating 'reported distress'. Retrospective ratings would be treated as evidence of memory heuristics, not truth about past pain burden. In hospitals, protocols would explicitly frame reports as requests for relief rather than measurements of damage. The cost is patients lose an absolute veto on legal claims regarding how much they suffered; a judge could rule that while the patient reported 9, the constructed nature of the report limits damages. The gain is clinicians can treat nociception without gaslighting patients, acknowledging the report as a control interface rather than a window. Comparability across persons becomes less about matching inner states and more about standardizing control signals. Who gets believed shifts from the subject as oracle to the subject as stakeholder, balanced against system data. This preserves the care function while abandoning the impossible metaphysics of private infallibility.
