      *   **Axis 4: Parochialism:**
          *   P-A is accused of Western bias (individualist, legalistic).
          *   Avowal risks the same. "Publicity" is a Western liberal value. In shame cultures or hierarchical societies, *not* speaking the reason is the norm.
          *   *Key Point:* Does Avowal universalize the *condition* (must be avowable) but relativize the *content* (what counts as avowable)?
      *   **Axis 5: Bribery vs. Hospitality:**
          *   Law tries to draw a line (intent to influence vs. relationship building).
          *   Avowal might dissolve this. If the hospitality creates an unavowable obligation, it's corrupt. If it's trivial and avowable, it's not.
          *   *Implication:* Shifts focus from the *gift's value* to the *relationship's opacity*.
