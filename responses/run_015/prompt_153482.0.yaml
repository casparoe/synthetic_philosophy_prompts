          *   If duties are silent but reasons are still unavowable (e.g., bias not explicitly forbidden), they diverge.
          *   *User's View Reconstruction:* Emphasize the shift from *outcome/gain* to *reasoning process*.
      *   **Axis 3: The Cases (Gifts & Clientelism):**
          *   *Gifts:* P-A struggles (is it private gain? is it a breach?). Avowal asks: Can the nurse say "I took this because it maintains social harmony"? If yes, not corrupt. If no (because it implies future bias), then corrupt.
          *   *Clientelism:* P-A says corrupt (private/partisan gain vs public good). Avowal asks: Is the exchange open? If the councillor says "I helped you because you support me," is that avowable? In some democracies, no (should represent all). In others, yes (mandate).
