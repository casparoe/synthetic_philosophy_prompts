      *   *Check:* Did I handle the clientelism case carefully? *Adjustment:* Avoid saying Avowal definitely clears clientelism. It depends on whether "partisan responsiveness" is an avowable reason for *that* office.
      *   *Check:* Epistemic humility. *Adjustment:* Explicitly state where political theorists disagree on the nature of public office.
