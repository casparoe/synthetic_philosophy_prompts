          *   *Epistemic Status:* Dominant in policy (World Bank, Transparency International) and much analytic philosophy (Dennis Thompson, Philp). Contested in anthropology and critical political theory.

      *   **Avowal Account (User's View):**
          *   *Core:* Power exercised based on reasons that cannot be publicly avowed/justified.
          *   *Philosophical Lineage:* Resonates with Rawls (public reason), Kant (publicity principle), Thompson (secrecy test), but distinct in focusing on the *reason* rather than the *gain*.
          *   *Strengths (per user):* Captures the *corrosive* nature of hidden influence, handles cultural nuance (if the gift is avowable, it's not corrupt), handles clientelism (if the exchange is open/expected, is it avowable?).
