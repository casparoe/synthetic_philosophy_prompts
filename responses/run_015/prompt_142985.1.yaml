answer: |-
  1. Decisive defeaters
  Decisive defeaters require anthropological evidence of societies where norm violations are never justified by reasons accessible to members, only by raw force. If ethnographers document a group where leadership changes solely via violence without retrospective normative justification, the grammar claim fails. Psychologically, evidence that certain populations lack cognitive capacity for second-order normative reasoning would be fatal, though unlikely given human universals. Conceptually, radical incommensurability—where concepts like "suffering" or "coordination" cannot be mapped across cultures—would defeat the translation premise. Existing research on "amoral familism" hints at this but usually reveals hidden loyalty norms. True defeaters must show the absence of the *mechanism*, not just different outputs. If a society treats all conflict as war rather than dispute, the grammar is absent. This strikes the core because the view rests on the universality of reasoning capacity, not specific moral content. Without that capacity, objectivity collapses into relativism. Additionally, linguistic evidence showing a lack of vocabulary for normative justification—no words for "ought," "wrong," or "reason"—would be devastating. If moral concepts are entirely reducible to descriptive statements of power without any prescriptive force, the grammar dissolves. A genuine defeater would be a community where asking "why" is categorically meaningless, not just punished. This distinguishes between suppression of the grammar and its absence. The view claims the grammar is a human universal; evidence that it is a cultural invention specific to certain developmental trajectories would overturn it.

  2. Merely awkward adjustments
  Findings forcing adjustment include evidence that the grammar is latent rather than active. If the framework only emerges during inter-group conflict or societal collapse, the claim shifts from "operating system" to "emergency backup." This complicates the view but saves it. Another awkward adjustment is partial incommensurability; if translation requires distorting the original moral concept to fit the grammar, the universality is weakened. Honest refinement admits the grammar is biologically constrained but culturally suppressed in extreme hierarchies. Special pleading occurs if every instance of coercion is reinterpreted as "implicit reasoning" simply to save the theory. If the view claims the grammar exists but is never observable directly, it risks becoming metaphysical. The view must accommodate contexts where reasoning is taboo without denying the capacity exists. Distinguishing between competence and performance helps here. However, if the grammar is rarely activated, its role in grounding objectivity diminishes. Furthermore, if the grammar varies significantly in structure—not just weighting—but in logical operations (e.g., some cultures accept contradictions), the view must shrink to claim only a vague shared intent. This adjustment feels like honest refinement if backed by cognitive data, but like special pleading if it relies on asserting hidden structures to explain away overt brutality. The view survives, but its explanatory power regarding actual moral progress weakens if the grammar is mostly dormant.

  3. Concessions and dismissals from inside the view
  A committed defender accepts pressure if specific societies show no evidence of normative justification whatsoever. They would concede that the grammar might be fragmented or context-dependent. However, they would dismiss claims that different weighting (WEIRD vs. non-WEIRD) undermines the grammar; that is the view's central thesis. They would reject the idea that "power struggles" lack grammar, arguing that even power claims rely on implicit normative assumptions (e.g., strength confers authority). They distinguish "grammar" from "agreement": the existence of rules for arguing doesn't mean everyone agrees on the conclusion. They also distinguish "translation" from "identity": understanding another's moral claim doesn't require sharing it. Internal grounds for rejection include the distinction between surface behavior and underlying cognitive structure. They would argue that apparent nihilism is usually just opaque normativity. Pressure is only accepted if the capacity for reason-giving is biologically absent, not just culturally silenced. From inside the view, the burden of proof lies on the skeptic to show a lack of capacity, not just a lack of usage. The defender holds that human cognition necessitates some normative framework for coordination. Therefore, most anthropological counter-examples are interpreted as different dialects of the same grammar. They accept revisions regarding the *visibility* of the grammar but reject revisions regarding its *existence*.

  4. Insulation and unfalsifiability check
  The position risks unfalsifiability if "implicit" becomes a shield. If every coercion is reinterpreted as tacit reasoning, no observation can refute the claim. This insulation is legitimate only if grounded in cognitive science (competence vs. performance). If it relies on hermeneutic charity alone, it is defensive. Claiming the grammar is always hidden makes the view empty; it must allow for observable breakdowns. Legitimate insulation distinguishes capacity from execution. Defensive retreat insists capacity is never lost, even when behavior suggests otherwise. The view must specify what observable behavior would count as lacking the grammar. Without this, it becomes a tautology: all human societies have human moral reasoning. The risk is that "dispute-resolution grammar" is defined so broadly it includes any stable interaction. To remain meaningful, the view must admit that some societies might operate purely on fear without internal normative logic. If the defender refuses this possibility, the view is over-insulated.

  5. Bottom-line ranking and verdict
  Fatal defeaters include cultural normative nihilism; awkward adjustments involve context-dependent activation. The view is moderately exposed but leans toward insulation via the "implicit" clause. It is not fully over-insulated, but the bar for defeat is set very high. The WEIRD data supports weighting differences, not necessarily a shared grammar of resolution. The data shows divergence in outputs, not convergence in processing. Ranking the defeaters, evidence of pure power dynamics is fatal, while latent grammar is merely awkward. Overall, the position remains philosophically robust but empirically vulnerable to extreme ethnographic counter-examples. You must ensure the grammar is not defined so broadly it becomes trivial. The insulation present is mostly honest but borders on defensive when invoking hidden structures to explain away overt coercion. The WEIRD data supports the weighting claim well but offers weaker evidence for a universal dispute-resolution grammar than you believe.
