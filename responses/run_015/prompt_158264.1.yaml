answer: |-
  This is a sharp observation, and you are right to feel that the standard vocabulary fragments the phenomenon. You are describing a specific dynamic where the *fitness* of a cultural variant is inversely proportional to its *frequency*, coupled with a secondary dynamic where the *content* of the variant evolves to artificially maintain that low frequency.

  In the literature of cultural evolution, sociology, and signaling theory, this does not have one single canonical name, but it is the intersection of three established concepts. If you need a label for your paper, the most precise technical term is **Negative Frequency-Dependent Selection with Costly Signaling Escalation**. In sociological terms, it is the accumulation of **Subcultural Capital** via **Distinction**.

  Here is the breakdown of the nearest concepts, where they fail to capture your full pattern, and how to synthesize them for your argument.

  ### 1. The Evolutionary Mechanism: Negative Frequency-Dependent Selection (NFDS)
  **What it is:** In biology and cultural evolution, this describes a trait where fitness decreases as the trait becomes more common. (e.g., a prey animal's camouflage works only if the predator doesn't recognize the pattern; a bluff works only if few people bluff).
  **Where it fits:** This explains the *abandonment*. As soon as the housing office uses the slang, the frequency spikes, the fitness (social value) drops to zero, and the trait is selected against.
  **Where it falls short:** Standard NFDS models usually assume a fixed trait (e.g., "left-handedness" or "blue coat"). They do not inherently explain why the *new* variants become *more complex* or *harder to learn*. NFDS explains why the old word dies, but not why the new words are grammatically weirder.

  ### 2. The Sociological Mechanism: Distinction / Subcultural Capital
  **What it is:** Pierre Bourdieu's *Distinction* (and Sarah Thornton's adaptation, *Subcultural Capital*) argues that taste is not intrinsic but relational. People consume culture to mark class or group boundaries. "Cool" is simply the valuation of that which is not yet mainstream.
  **Where it fits:** This explains the *position*. You identified that what is being copied is "not-the-thing-everyone-has." Bourdieu calls this the "logic of differentiation." It explains the embarrassment: using a mainstreamed subcultural marker is a category error that reveals a lack of social capital.
  **Where it falls short:** Bourdieu is structuralist, not evolutionary. He explains *why* people want distinction, but he doesn't model the *transmission dynamics*. He doesn't explain the *mutation rate* or why the complexity specifically escalates over time rather than just shifting laterally (e.g., from slang A to slang B).

  ### 3. The Signaling Mechanism: The Handicap Principle
  **What it is:** Proposed by Amotz Zahavi in biology, this argues that signals are reliable only if they are costly to produce (e.g., a peacock's tail). If a signal is cheap, it can be faked by low-quality individuals.
  **Where it fits:** This explains the *difficulty*. As the "mainstream" infiltrates the group, the cost of the old signal drops (anyone can say the word). To restore reliability, the group must evolve a new signal with a higher entry cost (weird grammar, specific context). The difficulty is indeed "load-bearing," as you put it.
  **Where it falls short:** Signaling theory usually assumes the cost is biological (energy, risk) or economic (money). It doesn't always account for *arbitrary cognitive cost* (memorizing obscure rules) as a cultural adaptation, nor does it explain the *retrospective disowning* (the "I never used that old word" lie).

  ---

  ### The Synthesis: What to Call It
  For your paper, I recommend framing this as **Exclusivity-Driven Cultural Escalation**.

  It is a specific subtype of **Anti-Conformist Transmission Bias** (Boyd & Richerson). Standard anti-conformist bias says "copy the rare trait." Your phenomenon says "copy the rare trait, and if it becomes common, mutate it to make it rare again."

  This creates a **Red Queen Dynamic** in cultural space: the group must keep running (mutating the trait) just to stay in the same place (maintaining exclusivity).

  ### Boundary Cases: What Does *Not* Count
  To sharpen your definition, you need to exclude things that look similar but lack the mechanism.

  1.  **Fads that die due to satiation:** If people stop wearing a shirt simply because they are bored of it, that is *habituation*, not exclusivity signaling. The key differentiator is the *embarrassment*. If the early adopters wear the shirt to Goodwill without shame, it's a fad. If they burn it and claim they never liked it, it's exclusivity signaling.
  2.  **Efficiency Improvements:** If a software tool becomes more complex because it adds features, that is functional evolution. Your pattern requires the complexity to be *arbitrary* or *socially gating*. If the new slang word is harder to use but communicates the exact same thing less efficiently, it fits your pattern. If it communicates *more*, it might just be progress.
  3.  **Late Adopters acting sincerely:** You mentioned people who take it up late and sincerely. These are the "mainstream" cohort. They are the selection pressure, not the drivers of the cycle. They count as the *environment* changing, not the replicator evolving.

  ### The Replicator Question
  This is the deepest theoretical problem you raised: *If a variant's fitness depends on its own frequency and its content is partly just "not that one", is that still a replicator?*

  **The Short Answer:** Yes, but it breaks the "gene-centric" view of memetics and supports the **Context-Dependent Replicator** view.

  **The Long Answer:**
  In classical Dawkins-style memetics, a meme is like a gene: it has a phenotype (the word/scarf) and its fitness is determined by the environment. In your scenario, the "environment" includes the frequency of the meme itself.
  *   **The Problem:** If the definition of the trait includes "I am rare," then when the trait succeeds (spreads), it destroys the condition of its own existence. A gene that kills itself when it becomes common is an evolutionary dead end.
  *   **The Solution:** The replicator is not the *word*. The replicator is the **Strategy of Exclusion**.
      *   The "word" is merely the *vehicle* (phenotype).
      *   The "rule" (be distinct from the mainstream) is the *genotype*.
      *   The mutation (new word) is the expression of that genotype in a new environment.

  This aligns with **Dan Sperber's Epidemiology of Representations**. Sperber argues that we don't necessarily "copy" memes; we reconstruct them based on attractors. In your case, the "attractor" is not the specific sound of the word, but the *social function* of the word (signaling in-group status). The content changes because the content is secondary to the function.

  This framing saves the Darwinian model but requires you to argue that the **unit of selection** is the *behavioral strategy* (maintain exclusivity), not the *cultural content* (the slang word). The slang word is a disposable shell.

  ### Recommended Reading for Your Paper
  To ground this in your seminar's literature:
  1.  **Boyd & Richerson, *Culture and the Evolutionary Process*:** Look for their models on **Frequency-Dependent Biases**.
  2.  **Pierre Bourdieu, *Distinction*:** For the "position" aspect.
  3.  **Amotz Zahavi, *The Handicap Principle*:** For the "difficulty is load-bearing" argument.
  4.  **Joseph Henrich, *The Secret of Our Success*:** Specifically on how cultural learning can lead to maladaptive complexity if signaling drives it.
  5.  **Dan Sperber, *Explaining Culture*:** For the argument that the "content" is reconstructed to fit cognitive/social attractors (which explains the mutation).

  ### Summary for Your Thesis
  You are describing a **Negative Frequency-Dependent Selection** pressure acting on **Costly Signals**, which drives a **Red Queen Arms Race** of arbitrary complexity. The "replicator" is not the cultural item itself, but the **strategy of distinction**, using the cultural item as a disposable vehicle. This explains why the content mutates toward difficulty (to restore cost) and why the history is erased (to maintain the illusion of innate distinction).

  If you need a catchy title phrase, consider: **"The Self-Negating Meme: Exclusivity as a Driver of Cultural Complexity."**
