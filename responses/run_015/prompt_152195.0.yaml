prompt: |-
  I work in policy and programme administration for a public research council that funds astronomy, planetary science, and a small, perpetually contested pot of money for what our mandate calls "big question" proposals. After two years of sitting in on review panels, I have become convinced that we apply opposite rules to structurally identical arguments without ever acknowledging the switch. We treat it as entirely respectable to reason from our own position as observers: that our patch of the universe should be assumed unremarkable so that local measurements can be extrapolated; that the apparent fine-tuning of physical constants is partly explained by the fact that only some values permit observers to exist in the first place; that our catalogues are biased toward the objects bright enough and near enough to be detected, and must be corrected accordingly. Nobody blinks at any of this. But when a proposal argues that the number of humans who have lived before us is itself evidence about how many will live after us — on standard demographic estimates, people who have ever lived number in the low hundreds of billions, and if our position in that sequence is an ordinary draw, then the sequence is unlikely to be vastly longer — the same panel reaches for words like "parlour trick," and I do not think a flawless derivation would rescue it. Last month we also voted down, after an uncomfortable hour, a proposal to adopt a written rule for future panels: where two hypotheses fit every observation we could ever make equally well, prefer the one that predicts more observers, on the ground that our own existence is a datum and is more probable under it. Someone observed that this rule would let us settle, without funding a single new instrument, whether the galaxy is teeming with civilizations and whether the universe is far larger than the part we can see. That, I think, was the moment the room decided it must be a bad rule.

  What I cannot work out is what our actual practice commits us to. So: reconstruct the implicit principle that separates the observer-selection reasoning we accept from the reasoning we reject. Is it a distinction between spatial and temporal position, between inferences that generate novel testable predictions and inferences that merely reweight what we already knew, between correcting for selection effects on our data and treating the existence of the observer as itself selected — or is it simply a filter that happens to let through the conclusions we were already comfortable with? Then tell me which of the two candidate principles each half of the practice really instantiates: the one that says to reason as if you were a random sample drawn from some class of observers, or the one that says your existence is evidence in favour of hypotheses on which there are very many observers. Does the practice presuppose one of them, is it compatible with both, or does it quietly shift from one to the other depending on the subfield of the proposal? I am also troubled by how much seems to hang on the choice of the class we sample from — all humans, all observers, all observers in something like my epistemic situation, all observers there could possibly be — since the conclusion swings entirely with that choice; does the practice have to presuppose a way of fixing it, and if it cannot, is the practice arbitrary at precisely that point? A colleague tells me philosophers have names for the two principles and a stock cautionary example about a philosopher who infers that the world must be enormous merely from the fact that he finds himself in it; if that rings a bell, by all means use it, but I do not want references or reading suggestions, and I would rather you not lean on details I could not check.

  Finally, two practical questions. If we adopted the observer-weighted rule consistently, what would change in what we fund: which proposals would now pass that we currently reject, which would stop passing, and would the rule have any observable consequences at all, or would it only ever reshuffle our confidence while leaving every prediction untouched? And be honest about underdetermination — distinguish the part of our present practice that strictly presupposes an anthropic principle from the part that several rival views would license equally well, so I can tell whether my panel is sitting on a coherent epistemology or on an inconsistency we have simply never had to argue about.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the User and Context:**
      *   **User Role:** Policy and programme administrator at a public research council (funding astronomy, planetary science, "big question" proposals).
      *   **Experience:** Two years sitting on review panels.
      *   **Observation:** The panel applies inconsistent standards to observer-selection reasoning (anthropic reasoning). They accept it in cosmology/astrophysics (Copernican principle, selection biases in catalogs, anthropic explanations for fine-tuning) but reject it in demographics/future humanity (Doomsday Argument) and multiverse/civilization density (Self-Indication Assumption).
      *   **Goal:** Reconstruct the implicit principle separating accepted vs. rejected reasoning. Determine which of two candidate principles (Self-Sampling Assumption vs. Self-Indication Assumption) the practice instantiates. Address the reference class problem. Assess practical consequences of adopting a consistent rule. Distinguish between strict presupposition of anthropic principles vs. underdetermination.
      *   **Constraints:** No references or reading suggestions. Do not lean on details the user couldn't check. Use philosophical names if they "ring a bell" (SSA/SIA) but keep it accessible. Be honest about underdetermination.

  2.  **Deconstruct the Problem:**
      *   **Accepted Reasoning:**
          *   "Our patch of the universe is unremarkable" (Copernican Principle).
          *   "Fine-tuning explained by observer existence" (Weak Anthropic Principle).
          *   "Catalogues biased toward bright/near objects" (Observational Selection Effects).
          *   *Common Thread:* Correcting for *data* limitations based on the conditions necessary for *making* the observation. It treats the observer as a constraint on the *data*, not necessarily as evidence for the *hypothesis* itself (except in fine-tuning).
      *   **Rejected Reasoning:**
          *   "Number of humans before us implies limits on humans after us" (Doomsday Argument).
          *   "Prefer hypotheses with more observers because we exist" (Self-Indication Assumption/Presumptuous Philosopher).
          *   *Common Thread:* Treating the *existence* or *temporal location* of the observer as direct probabilistic evidence favoring one world-model over another, often leading to "too easy" conclusions about the size of the universe or the future of humanity.
      *   **The Two Candidate Principles:**
          1.  **Self-Sampling Assumption (SSA):** Reason as if you are a random sample from the set of all observers (or your reference class). (Leads to Doomsday Argument).
          2.  **Self-Indication Assumption (SIA):** Your existence is evidence favoring hypotheses with more observers. (Leads to "Presumptuous Philosopher" scenario).
      *   **The Tension:** The panel seems to use SSA-like reasoning for spatial location (we aren't special) and fine-tuning (we must exist to observe), but rejects SSA when applied to temporal location (Doomsday). They explicitly rejected SIA (the rule to prefer hypotheses with more observers).

  3.  **Drafting the Analysis - Step-by-Step:**

      *   **Identify the Implicit Principle:** The panel isn't following a single logical principle. They are following a *methodological* heuristic: "Use observer reasoning to correct *measurement bias*, but not to determine *ontological probability*."
          *   *Accepted:* "We can't see dim stars, so correct the count." (Data correction). "Constants must allow us, so don't be surprised they do." (Constraint).
          *   *Rejected:* "We are here, so the universe must be big." (Ontological inference). "We are born at time $t$, so the end must be near." (Ontological inference).
          *   *Distinction:* It's not Spatial vs. Temporal. It's *Conditioning on Existence* (Allowed) vs. *Updating on Existence* (Forbidden).

      *   **Mapping to SSA and SIA:**
          *   *SSA (Random Sample):* This drives the Doomsday Argument (rejected) and the Copernican Principle (accepted). The panel is inconsistent here. They accept SSA for space ("we aren't central") but reject it for time ("we aren't early/middle").
          *   *SIA (More Observers = More Likely):* This drives the "Presumptuous Philosopher" (rejected). The panel explicitly voted against this.
          *   *Verdict:* The practice is incompatible. It quietly shifts. It uses SSA when it implies mediocrity (cosmology) but rejects SSA when it implies doom (demographics). It rejects SIA entirely because it implies "something from nothing" (settling multiverse questions without instruments).

      *   **The Reference Class Problem:**
          *   The user is right: conclusions swing wildly based on the class (all humans vs. all observers).
          *   Does practice presuppose a fix? No. It relies on *intuition* about what counts as "comparable." In astronomy, "observers" = "galaxies/locations." In demographics, "observers" = "humans."
          *   Is it arbitrary? Yes, at that point. It's driven by the plausibility of the *conclusion*, not the rigor of the *class definition*.

      *   **Practical Consequences (If consistent):**
          *   *If Consistent SSA:* You fund Doomsday-style demographic research. You might deprioritize searches for extraterrestrial intelligence (SETI) if you think being early is unlikely (though this is nuanced).
          *   *If Consistent SIA:* You fund multiverse theories and high-observer-density models. You might fund SETI aggressively (many observers likely). You stop funding instruments to distinguish between large/small universe models (as the user noted).
          *   *Current State:* You fund instrumentation (empirical resolution) and reject "armchair" anthropic solutions.

      *   **Underdetermination & Coherence:**
          *   Is the panel coherent? No. It's an inconsistency masked by domain specificity.
          *   What is strictly presupposed? The "Weak Anthropic Principle" (constraints) is presupposed. The "Strong" or "Self-Indication" versions are rejected.
          *   Rival views: Standard Bayesianism without anthropic updates licenses the data correction but not the existence updates.

  4.  **Refining the Tone:**
      *   The user is sophisticated, policy-oriented, and frustrated by the inconsistency.
      *   Tone should be analytical, direct, slightly philosophical but grounded in their administrative reality.
      *   Avoid academic name-dropping unless it clarifies (SSA/SIA are useful shorthand here).
      *   Address the "Presumptuous Philosopher" example as requested.

  5.  **Self-Correction/Nuance Check:**
      *   *Did I distinguish Spatial vs. Temporal?* I need to be careful. The panel accepts spatial mediocrity (SSA) but rejects temporal mediocrity (SSA). I need to highlight this specific hypocrisy.
      *   *Did I address the "Written Rule" vote?* Yes, that was a rejection of SIA.
      *   *Did I answer the "Observable Consequences" question?* Yes, SIA removes the need for instruments; SSA changes demographic risk assessments.
      *   *Did I avoid references?* Yes.
      *   *Did I address the Reference Class?* Yes, acknowledge it's the pivot point of the arbitrariness.

  6.  **Final Polish:**
      *   Structure the response clearly: Implicit Principle, SSA/SIA Mapping, Reference Class, Practical Consequences, Underdetermination.
      *   Ensure the distinction between "Conditioning" (accepted) and "Updating" (rejected) is clear.
      *   Make sure the "Presumptuous Philosopher" analogy is integrated naturally.

  7.  *(Self-Correction during drafting)*: Wait, the user asked: "Does the practice presuppose one of them, is it compatible with both, or does it quietly shift?" I need to be definitive. It shifts. It uses SSA for cosmology, rejects SSA for demographics, rejects SIA for everything.
      *   Also, clarify the "Fine-tuning" acceptance. That is usually WAP (Weak Anthropic Principle), which is distinct from SSA/SIA but often conflated. WAP says "We can only observe compatible constants." SSA says "We should treat our location as random." The panel accepts WAP and Spatial SSA, rejects Temporal SSA and SIA.

  8.  **Finalizing the Argument:**
      *   The core inconsistency is treating "observer" as a *filter* in physics but refusing to treat "observer" as a *datum* in demographics.
      *   The "Presumptuous Philosopher" is the SIA example.
      *   The "Doomsday" is the SSA example.
      *   The Panel accepts WAP + Spatial SSA. Rejects Temporal SSA + SIA.
      *   This is not coherent epistemology; it's result-oriented filtering.

  9.  **Constructing the Output:** (Drafting the response based on these points.)
      *   *Introduction:* Acknowledge the acuity of the observation.
      *   *The Implicit Principle:* Distinguish "Selection Effects on Data" vs. "Existence as Evidence."
