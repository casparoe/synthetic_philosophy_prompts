answer: |-
  **Verdict:** This corresponds to an established distinction in the philosophy of action and behavioral ethics, best identified as **Excessive Reconsideration** (Richard Holton) or **Exception Creep** (behavioral ethics/compliance). While it shares outcomes with hyperbolic discounting and akrasia, it constitutes a **distinct failure mode of diachronic agency** rooted in **rule instability** rather than impulse or time-bias.

  **Definition:**
  **Diachronic Rule Erosion** is the progressive invalidation of a long-term resolution through a sequence of context-sensitive, locally rational re-evaluations. Unlike standard akrasia, the agent does not act against their concurrent judgment; unlike hyperbolic discounting, the preference shift is driven by **framing conditions** (e.g., "urgent message," "deserved reward") rather than **temporal proximity**. The failure lies in treating a resolution as a flexible policy open to continuous optimization rather than a stable constraint designed to preclude such local calculations.

  **Boundaries:**
  *   **Vs. Discrete Akrasia:** In akrasia, the agent acts against their *synchronic* better judgment (e.g., "I should not do this, but I will"). In Rule Erosion, the agent's judgment shifts *with* the action (e.g., "Given this new context, doing this is now reasonable"). There is no moment of conscious conflict.
  *   **Vs. Hyperbolic Discounting:** Hyperbolic discounting posits a structural **time-inconsistency** where the *same* reward is valued more highly simply because it is immediate. Rule Erosion posits a **state-inconsistency** where the *valuation framework* itself changes based on contextual justifications, independent of the discount rate for time.
  *   **Vs. Rationalization:** Standard rationalization implies the agent knows the true motive (temptation) and conceals it. In Rule Erosion, the contextual shift is genuine; the error is **diachronic incoherence** (allowing the rule to be renegotiated) rather than **epistemic self-deception**.

  **Classification:** It should be treated as a **distinct failure mode** within weakness of will. Standard akrasia is a failure of *execution* (doing what you judged bad); Rule Erosion is a failure of *stability* (judging differently than you planned to). It requires strategies focused on **precommitment against reconsideration** (e.g., "no-exception" policies) rather than strategies for resisting impulse.
