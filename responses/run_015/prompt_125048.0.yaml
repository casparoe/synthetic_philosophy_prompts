answer: |-
  1. **Popper's Retraction and Your Reconstruction**
  "Karl Popper famously retracted his earlier claim that Darwinism is a metaphysical research programme in the 1970s, conceding that natural selection is testable. Your thesis insists on reinstating that original classification. Is your reconstruction based on the belief that Popper's retraction was a philosophical error, or do you argue that the Modern Synthesis has become more dogmatic and less testable in the decades since he changed his mind?"

  2. **Evo-Devo: Vindication or Replacement?**
  "You position evolutionary developmental biology as the 'scientific' counterpart to Darwinism's 'metaphysics.' However, Evo-Devo typically explains the *generation* of variation, while natural selection explains the *fixation* of traits. If we accept your distinction, does Evo-Devo's predictive success genuinely vindicate Darwinian mechanisms, or does it effectively replace the selectionist framework with a distinct theoretical account of evolutionary change where selection plays only a minor, metaphysical role?"

  3. **The Historical-Predictive Distinction and Common Descent**
  "You draw a sharp line between 'predictive' Evo-Devo and 'historical' evolutionary explanations, classifying the latter as less scientific. Yet, phylogenetics relies on assumptions of shared ancestry to successfully predict fossil locations and genetic markers. Given that both Evo-Devo and standard evolutionary theory depend on the same foundational assumption of common descent, on what grounds do you classify one as empirical and the other as metaphysical?"

  4. **Adaptationism and the 'Spandrels' Critique**
  "Your critique of post hoc adaptive storytelling closely mirrors Gould and Lewontin's 'Spandrels' paper from 1979. Are you essentially reviving the structuralist critique of adaptationism but using Popperian falsifiability as the weapon instead of architectural constraints? If so, does this not suggest the problem lies with *adaptationism* specifically, rather than Darwinism as a whole?"

  5. **Policy Implications for Evolutionary Psychology (Sequence)**
  *Primary Question:* "You argue that this distinction should guide funding priorities. Practically, does this mean evolutionary psychology should be defunded, or merely reclassified as a non-scientific discipline?"
  *Anticipated Reply:* [She will likely argue for reclassification rather than defunding, claiming metaphysical programmes can still be heuristically useful without receiving 'hard science' grants.]
  *Follow-up Question:* "But in the current grant landscape, labeling a field 'metaphysical' is often a euphemism for 'unfundable.' If your philosophical distinction effectively acts as a budgetary veto, aren't you using epistemology to enforce a sociological boundary rather than a methodological one?"

  6. **Philosophy of Science vs. Sociology of Scientific Knowledge**
  "Following up on the previous point: Is your distinction ultimately a philosophical claim about falsifiability, or a sociological claim about which institutional norms deserve prestige? If Evo-Devo researchers began making post hoc adaptive claims, would you revoke their 'scientific' status, or is this framework designed to protect specific departments from scrutiny?"

  7. **The Utility of Metaphysical Programmes**
  "Popper originally argued that metaphysical research programmes could be highly fruitful for science, even if they weren't strictly falsifiable. If Darwinism is metaphysical but heuristically indispensable for organizing biological data, why does it warrant a downgrade in status compared to Evo-Devo? Does your view risk discarding a useful heuristic simply because it lacks quantitative precision?"

  8. **Physics Envy and Biological Specificity**
  "By privileging quantitative, predictive models, are you imposing a physics-centric model of science onto a historical discipline? Biology often deals with contingent, singular events (like the Cambrian explosion) that resist law-like prediction. Does your criterion for 'genuine science' inadvertently exclude the study of historical contingency, which is central to evolutionary theory?"

  9. **Institutional Separation of Biology**
  "If your thesis were adopted by major funding bodies, would this require a structural separation in biology departments, similar to the separation of theoretical and experimental physics? Do you envision a future where 'Metaphysical Biology' (Darwinism/Evo Psych) and 'Empirical Biology' (Evo-Devo) operate in separate institutional silos?"

  10. **The End Game: Dualism or New Synthesis?**
  "Finally, what is the normative goal of your reconstruction? Are you advocating for a permanent dualism where Darwinism serves as a metaphysical backdrop for Evo-Devo's hard science, or do you anticipate a new synthesis where Evo-Devo absorbs the explanatory power of natural selection, rendering the Darwinian framework obsolete?"
