answer: |-
  **Automation is legitimate only when it absorbs risk or drudgery without seizing authority over the worker's pace, purpose, or livelihood.**

  This principle distinguishes the tool from the master. Clause one (absorbs risk/drudgery) is forced by **Case 1** (mine safety) and **Case 3** (word processor). The machine takes the danger or the typing, leaving the human intact. Clause two (without seizing authority) is forced by **Case 2** (layoffs), **Case 4** (AI drafting), and **Case 6** (algorithmic pace). Here, efficiency is purchased with human agency.

  This reconciles your tensions. In **3 vs 4**, the word processor extends your hand; you remain the author. AI drafting seizes the purpose; you become an editor of the machine's thought. The gain in speed isn't worth the loss of agency. In **2 vs 7**, ownership isn't a dodge; it is the mechanism of authority. In 2, capital owns the robot and seizes the livelihood. In 7, workers own the robot and seize the pace. The principle holds: who decides the surplus? If the machine dictates the livelihood, it's bad. If the workers dictate the machine, it's good. Your suspicion is valid only if you assume co-ops are immune to corruption, but here ownership matters because it locates the authority.

  **Cost and Embarrassment**
  Every principle bleeds. Here are two cases where yours embarrasses itself:
  1.  **Historical:** The Power Loom. It destroyed the weaver's livelihood (Bad per principle) but made clothing affordable for the poor (Good per utility). Your principle sides with the weaver, forcing you to admit progress often requires cruelty you condemn.
  2.  **Contemporary:** GPS Navigation. It removes the drudgery of memorizing maps (Good) but erodes the driver's knowledge and agency (Bad). We use it anyway, proving convenience often overrides the loss of capacity, contradicting your stance on self-checkouts.

  **Which Verdict to Drop**
  Drop **Verdict 8**. If 4 is bad because AI seizes the purpose of writing, 8 must also be bad, regardless of quality. A better book written without the writer's purpose is a triumph of the machine, not the human. Keeping 8 as "undecided" undermines the stakes of 4. If the process is alienated, the product is tainted.

  **On Marx**
  The *Grundrisse* fragment isn't decoration; it's the skeleton. The shift from formal to real subsumption explains 3 vs 4 exactly. The word processor is formal subsumption (capital supplies tools, labor process remains yours). AI drafting is real subsumption (capital reshapes the labor process itself, embedding logic into the tool).

  However, **do not put this in her mouth.** It is structure for you, not dialogue for her. She knows the difference between a hammer and a foreman. She doesn't need to know Marx to know when the whip changes hands. Use the theory to steady your hand, not her tongue. If she starts talking about "fixed capital," you've lost her. Let her talk about who holds the keys, who sets the clock, and who goes home when the shift ends. That is where the philosophy lives.
