answer: |-
  ### The Case: The Thorne Endowment

  The late Dr. Aris Thorne's will bequeaths a $5 million endowment to the State University Archives on the condition that they maintain "the same collection" of field notebooks she donated in 1995. Last year, a flood damaged the physical notebooks; following standard conservation protocol which Thorne herself authorized in a separate letter, archivists meticulously scanned every page and disposed of the rotted paper to prevent mold, storing the high-resolution files in the same boxes. The University claims the endowment is active because "the same collection" is preserved in digital form. The Executor's Trust challenges this, arguing "the same collection" ceased to exist when the paper was destroyed. The Trust insists that treating digital surrogates as the collection dishonors the material history of the science, while the University argues that restricting the definition to rotting paper betrays the scientific mission of preserving data.

  **Agreed-Neutral Facts:**
  *   The physical paper notebooks from 1995 were damaged by water and subsequently destroyed.
  *   High-resolution digital files exist for every page of the original notebooks.
  *   The digital files are content-identical to the original pages.
  *   The files are stored in the original boxes in the original location.
  *   Thorne authorized the conservation protocol that led to the destruction.
  *   The endowment funds are released if and only if "the same collection" is maintained.

  ***

  ### Discussion

  **(a) The Hirsch-Style Deflationist**
  *   **Verdict:** Merely Verbal.
  *   **Reasoning:** Hirsch argues that if both parties can be charitably interpreted as speaking truths in their own "languages" (idiolects) and agree on all neutral, non-ontological facts (the list above), there is no substantive disagreement about the world. The disagreement is purely about which linguistic rule to associate with the phrase "the same collection."
  *   **Driving Feature:** The complete overlap on the neutral base facts (paper destroyed, data preserved).
  *   **If Stakes Removed:** If you remove the endowment and the normative claims about "honor" or "mission," the deflationist says the dispute evaporates entirely. The fact that there *are* stakes (money, norms) does not make the *ontology* substantive; it just makes the choice of language pragmatically important. For Hirsch, the Loaded-Reading Test confuses the *importance of speaking* with the *truth of what is spoken*.
  *   **Shakiness:** This view struggles to explain why we feel the dispute *shouldn't* be dissolved. If the court must rule, telling the judge "both are true in their own languages" is practically useless.

  **(b) The Sider-Style Realist**
  *   **Verdict:** Substantive (but potentially misguided).
  *   **Reasoning:** Sider looks for the meaning that "carves nature at the joints." He would ask whether "collection" is a natural kind term. If collections are fundamentally material aggregates, the Trust is right. If they are abstract information structures, the University is right. There is a single metaphysical fact of the matter, independent of the will.
  *   **Driving Feature:** The assumption that "collection" has a precise, mind-independent identity condition.
  *   **If Stakes Removed:** The verdict remains substantive. The endowment merely reveals the dispute; it does not create it. Even without the money, one side is metaphysically correct about the persistence conditions of the collection.
  *   **Shakiness:** Sider might concede that "collection" is too ordinary/vague to be a joint-carving term. If he admits the term is non-fundamental, his view collapses toward deflationism for this specific case, undermining the test divergence.

  **(c) The Carnap-Style Pragmatist (Framework View)**
  *   **Verdict:** Substantive (Non-Descriptive).
  *   **Reasoning:** This view holds that ontological questions are internal to a linguistic framework. The question isn't "What is the collection?" but "Which framework is more useful for our purposes?" The dispute is about which conceptual scheme (Material vs. Informational) best serves the institution's goals.
  *   **Driving Feature:** The institutional purpose (Heritage preservation vs. Data accessibility).
  *   **If Stakes Removed:** If you remove the institutional stakes (the mission, the endowment), the dispute collapses into a boringly verbal one. Without a *purpose* to optimize, there is no basis for choosing one framework over the other. The substantiveness is entirely derived from the practical context.
  *   **Shakiness:** This view aligns best with the Loaded-Reading Test, but it risks redefining "substantive" so broadly that it includes any high-stakes semantic stipulation, potentially losing the distinctively *ontological* flavor of the seminar.

  ***

  ### Honesty Check: The Loaded-Reading Test Trap

  You suspected the Loaded-Reading Test tracks practical importance rather than substantiveness. **You are right to be worried.**

  In this case, the reason the dispute "fails" the Loaded-Reading Test (i.e., counts as substantive) is almost entirely due to the **normative/institutional stakes** (the $5M, the mission, the honor). If you strip those away, the only thing left is a semantic preference.

  *   **What would convince me the test is broken:** If we agree that a dispute about the definition of "vehicle" in a park ("No vehicles allowed") is substantive just because a fine is attached, then *every* legal interpretation case becomes an ontological dispute. That dilutes "metaontology" until it means nothing.
  *   **What would convince me the test is sound:** If we can show that the choice of framework *changes the world* in a way that isn't just about money or rules. For example, if calling it "the same collection" changes how researchers *interact* with the object (e.g., they wear gloves for paper, but not for screens), then the ontology dictates the practice, not just the payout.
  *   **Recommendation for your slot:** Acknowledge this tension explicitly. Your 10-minute point shouldn't just be "The tests come apart." It should be: "The tests come apart because the Loaded-Reading Test captures **conceptual engineering** stakes that the Dissolution Test ignores. The question for the seminar is: Should metaontology care about conceptual engineering, or only about what exists?" That turns a potential weakness in your case into the central philosophical question.
