answer: |-
  # ATTRIBUTION AND STATUS RESOLUTION PROTOCOL (ASRP)
  **Version 1.0 | Office of the Registrar**

  ## 1. PREAMBLE: PHILOSOPHICAL GROUNDING
  This procedure is not merely administrative; it is ontological. It rests on four established distinctions in the philosophy of art that determine why a copy is not an original, even if indistinguishable to the eye.

  1.  **The Perceptual Limit (Goodman):** In autographic arts (painting, sculpture), the *history of production* is constitutive of the work's identity. A perfect forgery lacks the correct causal history. Therefore, aesthetic indistinguishability is irrelevant to identity.
  2.  **The Agency Distinction (Wollheim/Danto):** Artistic value resides in the *achievement* of solving a pictorial problem, not merely in the *effect* produced. A copy works backwards from an existing solution; an original works forwards from a problem. We collect achievements, not effects.
  3.  **The Testimonial Function (Carrier):** An object is a witness. A 1920 copy of a 1660 painting tells the truth about 1920 taste and 1920 technical capacity. If labeled 1660, it lies about both.
  4.  **The Institutional Promise (Dickie/ICOM):** The museum is an institution of public trust. The label is a contract. To label a copy as an original is a breach of contract with the visitor, the donor, and the scholarly record.

  ---

  ## 2. THE FOUR-STEP DECISION PROCEDURE
  *To be completed by Registrar + Assistant. Time limit: 6 hours data gathering, 2 hours documentation.*

  ### STEP 1: THE PERCEPTUAL QUESTION (The "Look")
  **Action:** Compare current object state against last conservation report and high-res archive images.
  **Query:** Has the physical object changed, or only our knowledge of it?
  **Determination:**
  *   **If Physical Change:** Route to Conservation. (Stop ASRP).
  *   **If Knowledge Change Only:** Proceed to Step 2.
  **Philosophical Note:** If the object looks the same, the Curator's argument ("it still does the work") is valid *only* for visitor engagement, not for truth-telling. This step isolates the aesthetic value from the historical value.
  **Judgment Point:** Registrar determines if physical change occurred. If disputed, Conservator has veto.

  ### STEP 2: THE GENEALOGY OF MAKING (The "Hand")
  **Action:** Review provenance, technical reports, and comparative literature.
  **Query:** What is the causal chain of production?
  **Categories:**
  *   **Autograph:** Conceived and executed by the named artist.
  *   **Studio/Workshop:** Conceived by master, executed partially or wholly by assistants under supervision (period).
  *   **Contemporary Copy:** Executed in the same period but outside the workshop.
  *   **Later Copy/Imitation:** Executed in a later period.
  *   **Forgery:** Executed with intent to deceive regarding origin.
  **Determination:** Assign the most specific category supported by evidence.
  **Philosophical Note:** This addresses the "Achievement vs. Effect" distinction. A studio piece shares the conception (achievement) but not the full execution. A forgery shares neither.
  **Judgment Point:** Registrar assigns category based on evidence weight. If evidence is conflicting, status is **PROVISIONAL**.

  ### STEP 3: THE TESTIMONIAL UTILITY (The "Truth")
  **Action:** Review current label text and catalogue entry.
  **Query:** Does the current label accurately reflect the Genealogy determined in Step 2?
  **Determination:**
  *   **If Yes:** Keep as catalogued.
  *   **If No:** Draft new label text using the Graded Wording Matrix (Section 4).
  **Philosophical Note:** This addresses the "Witness" function. A 1920 copy labeled 1660 generates false scholarship. Correcting the label preserves the object's utility as a witness to *its actual time of making*.
  **Judgment Point:** Curator must approve new text. If Curator refuses, escalate to Director.

  ### STEP 4: THE INSTITUTIONAL PROMISE (The "Contract")
  **Action:** Review Deed of Gift, Acquisition File, and Insurance Schedule.
  **Query:** Does the reclassification breach a legal agreement or financial covenant?
  **Determination:**
  *   **Donor Restrictions:** If the gift was conditional on attribution, legal counsel must review.
  *   **Insurance:** Adjust valuation per Section 4.
  *   **Public Trust:** If the object is a "flagship" (high reproduction), prepare a public communication strategy.
  **Judgment Point:** **Director and Legal Counsel.** The Registrar identifies the risk; the Director accepts it.

  ---

  ## 3. HANDLING UNCERTAINTY AND INTERIM STATUS
  *Constraint: External science takes 4 months; budget is limited.*

  **Burden of Proof:** The burden lies on the *proposer of the change*. If the evidence is inconclusive, the status quo remains.
  **Interim Disposition:**
  1.  **Label:** Remains unchanged.
  2.  **Database:** Flag object as `STATUS: UNDER REVIEW`.
  3.  **Duration:** Interim review status may stand for **12 months**.
  4.  **Expiration:** If no new evidence is found in 12 months, the challenge is closed, and the original attribution stands until significant new evidence arises.
  **Judgment Point:** Registrar decides if evidence meets the threshold to open a review. Director decides if the review can extend beyond 12 months.

  ---

  ## 4. CONCEPTUAL AND CERTIFICATE WORKS (The "Allographic" Branch)
  *Constraint: Contemporary works acquired as instructions.*

  **Technical Term:** These are **Allographic Works** (Goodman) or **Instruction-Based/Conceptual Instances**. Their identity conditions are not tied to a unique physical history but to adherence to a score, script, or certificate.

  **Procedure Branch:**
  1.  **Verify Certificate:** Does the physical instance match the instructions/certificate held by the museum?
  2.  **Verify Authority:** Was the instance fabricated by an entity authorized by the certificate (e.g., the Estate, the Studio)?
  3.  **Artist Disavowal:**
      *   If the certificate grants the *holder* the right to fabricate, the artist's subsequent political disavowal does not negate the object's identity, but it *does* alter its historical context.
      *   If the certificate requires *ongoing* artist approval, the object is now **DEAUTHORIZED**.

  **Disposition:**
  *   **Authorized Instance:** Keep as catalogued.
  *   **Deauthorized Instance:** Keep as a historical document of the dispute. Label must read: *"Realized under Certificate X. Artist disavowed this instance in [Year]."*
  *   **Valuation:** Market value for deauthorized conceptual work typically drops to near zero unless the dispute itself becomes the work's primary subject.

  ---

  ## 5. GRADED LABEL WORDING AND VALUATION MATRIX
  *Constraint: Must provide trade formulae and insurance rules.*

  | Attribution Category | Definition | Label Wording (Example) | Insurance Valuation Multiplier |
  | :--- | :--- | :--- | :--- |
  | **Autograph** | By the artist's hand. | *Jan van Goyen* | 100% (Base) |
  | **Studio Of** | Master's workshop, period. | *Studio of Jan van Goyen* | 40% - 60% |
  | **Circle Of** | Contemporary, influenced by, not workshop. | *Circle of Jan van Goyen* | 20% - 40% |
  | **Follower Of** | Later period, style imitated. | *Follower of Jan van Goyen* | 10% - 20% |
  | **Manner Of** | Later period, style only. | *Manner of Jan van Goyen* | 5% - 10% |
  | **After** | Copy of a specific known work. | *After Jan van Goyen* | 1% - 5% |
  | **Forgery** | Intent to deceive. | *Forged [Artist Name]* or *Imitator of...* | 0% (Remove from Fine Art Schedule) |

  **Rule for Choosing:** Select the *highest* attribution that the evidence *does not contradict*. (e.g., If you cannot prove it is Autograph, but can prove it is Period, "Studio of" is safer than "Circle of").
  **Judgment Point:** Registrar selects the category. **Finance Office** applies the multiplier. **Director** approves any write-down over 50%.

  ---

  ## 6. POLICY RULING: THE "SWAP" PRACTICE
  **Current Practice:** Swapping light-sensitive originals with high-grade reproductions for 4 months/year, disclosed only in small print.
  **ASRP Ruling:** **UNACCEPTABLE.**
  **Reasoning:** This violates Step 4 (The Institutional Promise). The public purchases a ticket to see the collection. A reproduction is a different ontological object (it has no history of production relevant to the original).
  **Required Action:**
  1.  **Disclosure:** Wall text must state: *"This is a facsimile. The original is in storage for preservation."* (Font size equal to title/artist).
  2.  **Alternative:** Rotate different works from storage rather than using facsimiles.
  3.  **Philosophy:** To display a copy as the original is to engage in the same deception as a forgery, even if the motive is preservation. It is the public's business, not just the conservator's.

  ---

  ## 7. APPLICATION TO TEST CASES

  ### CASE A: The Seventeenth-Century Cabinet (Workshop Version)
  *   **Step 1 (Perceptual):** No physical change.
  *   **Step 2 (Genealogy):** Evidence shows Master + Assistant. This is **Studio Of**.
  *   **Step 3 (Testimonial):** It no longer testifies to the Master's sole hand, but to his workshop's output.
  *   **Step 4 (Promise):** 1974 file is a historical record of the museum's knowledge at that time. It is not "wrong," it is "superseded."
  *   **Disposition:**
      *   **Label:** Change to *"Studio of [Master]"*.
      *   **Valuation:** Apply 50% multiplier. Notify Insurance.
      *   **1974 File:** Keep intact. Add a memo to the file explaining the reclassification. Do not destroy the old attribution; it is part of the object's provenance history.
  *   **Judgment:** Registrar executes. Curator notified.

  ### CASE B: The Disavowed Light Work (Conceptual)
  *   **Step 1 (Type):** This is an **Allographic/Conceptual Instance**. It does *not* go through the standard attribution procedure (Step 2) because "hand" is irrelevant.
  *   **Step 2 (Authority):** Check Certificate.
      *   *If Certificate allows studio fabrication without artist sign-off:* The work is **AUTHORIZED**. The artist's political disavowal is context, not invalidation.
      *   *If Certificate requires artist approval:* The work is **DEAUTHORIZED**.
  *   **Disposition:**
      *   **Is it the same question as A?** **No.** Case A is about *history of production* (Autographic). Case B is about *contractual validity* (Allographic).
      *   **Label:** If authorized but disavowed: *"[Artist], [Title], 2011. Instance realized under Certificate #X. Artist publicly disavowed this instance in [Year]."*
      *   **Valuation:** Hold steady if certificate holds. Drop if certificate is voided.
  *   **Judgment:** **Legal Counsel** must interpret the certificate. Registrar labels based on legal opinion.

  ### CASE C: The Celebrated Forgery (The "Better" Picture)
  *   **Step 1 (Perceptual):** Curators admit it looks "better." (Irrelevant to identity).
  *   **Step 2 (Genealogy):** Known imitator. Intent to deceive (implied by "imitator" in this context). This is a **Forgery**.
  *   **Step 3 (Testimonial):** Currently lies. Tells us nothing about the Master. Tells us about the Imitator.
  *   **Step 4 (Promise):** Public trust is actively breached. Selling to a dealer who intends to resell as "celebrated forgery" (implying the forgery *is* the value) risks the object re-entering the market as an original later.
  *   **Disposition:**
      *   **Label:** *"Imitator of [Master], [Date]. Historically exhibited as [Master]."*
      *   **Sale:** **DO NOT SELL** to a dealer with the understanding it will be marketed as a "celebrated forgery." This facilitates future deception.
      *   **Action:** Keep as a teaching object on the history of taste and forgery, or deaccession quietly to a study collection.
  *   **Judgment:** **Board** must approve deaccessioning or permanent relabeling of a flagship image.

  ---

  ## 8. MATRIX OF IRREDUCIBLE JUDGMENT
  *Where the procedure ends and human responsibility begins.*

  | Decision Point | Responsible Party | Rationale |
  | :--- | :--- | :--- |
  | **Threshold for Review** | **Registrar** | Is the evidence strong enough to waste time on? (Admin) |
  | **Attribution Category** | **Registrar** (with Curator input) | Based on evidence weight. (Technical) |
  | **Valuation Write-down >50%** | **Director** | Financial risk acceptance. (Fiduciary) |
  | **Donor Agreement Breach** | **Legal Counsel** | Contract interpretation. (Legal) |
  | **Deaccessioning Flagship** | **Board** | Reputational risk. (Governance) |
  | **Ownership/Title Dispute** | **Legal Counsel** | *Not* an ASRP question. If an heir claims a forgery ring stole the original and replaced it, this is police/legal business, not curatorial. |

  ---

  ## 9. FINAL VERDICT: WHICH CASE COMES OUT AGAINST US?

  **Case C comes out against the museum.**

  **Reasoning:**
  In Case A, the museum made an honest error common in 1974. Correcting it demonstrates diligence.
  In Case B, the museum is caught in a contractual/artistic dispute common to contemporary collecting. Managing the label resolves it.
  In **Case C**, the museum is in possession of a known forgery that it has been representing as an original for forty years.
  1.  **Ethical Breach:** Continuing to display it without a prominent "Forgery" label is active deception.
  2.  **Financial Hazard:** The dealer's offer tempts the museum to profit from the object's notoriety as a forgery. If the museum sells it, and it is later sold as an original (a common fate of "celebrated forgeries"), the museum is complicit in future fraud.
  3.  **Reputational Risk:** If the public learns the museum knew their most beloved image was a fake and considered selling it to a dealer rather than telling the truth, the damage to donor trust will exceed the loss of the image.

  **Directives for Case C:**
  1.  Relabel immediately as Imitator/Forgery.
  2.  Decline the dealer's offer.
  3.  Prepare a public statement framing the object as a "Historical Curiosity" rather than a "Masterpiece."
  4.  Accept that the Director will hate this, as it admits institutional failure. The procedure is designed to protect the institution's integrity, not its ego.

  ---

  ## 10. REGISTRAR'S NOTE ON IMPLEMENTATION
  This procedure removes the "argument from scratch" by forcing each department to speak at their designated step.
  *   The **Curator** speaks at Step 1 and 3 (Look and Truth).
  *   The **Finance** office speaks at Step 4 (Valuation).
  *   The **Director** speaks at Step 4 (Reputation).
  *   The **Registrar** controls the flow between them.

  If the Director wishes to override the disposition (e.g., keep Case C labeled as Original), they must sign a **Risk Acceptance Form** acknowledging the breach of ICOM ethics and the potential liability. This usually resolves the argument without the Registrar needing to win a fight.
