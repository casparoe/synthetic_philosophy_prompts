prompt: |-
  I am the registrar and collections manager of a mid-sized municipal museum: roughly nine thousand objects, mostly European paintings, prints and decorative arts, plus a small contemporary collection that includes several works acquired as certificates and instructions rather than as unique objects. Three or four times a year something turns up that makes us unsure what we actually have — a technical report, a new attribution in the literature, a dealer's opinion, an heir's photograph, an unsolicited email from someone who claims a forgery ring. Each time this happens the same argument starts, and it never resolves: the curator says the object in front of us has not changed and still does everything a visitor needs it to do; the director worries about donors and about the reproduction of one image on half the city's promotional material; the finance office points out that our insurance schedule is keyed to attribution, so a change of wording has a money consequence; someone on the board asks why we are wasting money on a question that makes no difference to how the thing looks. I want to stop having that argument from scratch.

  What I need from you is a written decision procedure my office can run on any case where what is in question is what an object is: whether it is by the hand claimed, whether it is of the period claimed, whether it is an original, a version, a studio product, a later copy, an imitation, or a fake. It should issue in one of a small number of dispositions — keep as catalogued; keep on display with a changed credit line or label; keep with a changed label and a changed valuation; withdraw from display; decline or return a gift; refer elsewhere — and it should say what has to be established to reach each.

  Please ground the steps in whatever the philosophy of art actually establishes about what is lost when an original turns out to be a copy, and about why that loss is not, or not only, a perceptual one. I do not want the literature summarised for its own sake; I want its distinctions doing work inside the steps. In particular, I have found that the arguments that blow up in committee are always one of four, and I would like the procedure built around them unless you think the decomposition is wrong:

  One, the perceptual question — whether anything available to a competent viewer, looking at the object as it hangs, changes if it is a copy. My experience is that it does not, and I want the procedure to say exactly what follows from that, so that people who stop at this step can be told where else their objection has to go.

  Two, the question of whose doing this is and under what constraints it was done. The difference between working towards an achievement and working backwards from an effect that already exists seems to me to be doing more real work here than the question of how the object looks, but I have never been able to say it in a sentence the board will accept.

  Three, the question of what the object now tells us. Even an untouched picture becomes a different witness once we know it was made in 1920 rather than 1660, and my sense is that this, rather than beauty, is where most of the damage of a forgery actually lies — including the damage to everyone who has written about it in good faith.

  Four, the question of what we have promised: to the public buying a ticket, to the donor or lender, to the field that cites our catalogue.

  Three further constraints. First, the procedure has to be runnable by me and one assistant with no conservation training, in about a working day per case, because the external conservation scientist takes four months and every report has to be justified against the acquisitions budget. Say explicitly what to do when the evidence will not settle the matter, who carries the burden, what the interim disposition is, and how long an interim label may stand. Second, it must handle the contemporary works that arrive as certificates: I have been told there is a technical term for works whose identity conditions allow correct instances to be produced later, under supervision, after the artist's death, and I want to know whether those go through the same procedure, a branch of it, or none of it. Third, it must give me graded label wording for weakened attributions — the trade's formulae along the lines of studio of, circle of, follower of, manner of, after — together with the rule for choosing between them, and it must say what each does to the insurance figure.

  Run the finished procedure on these, with the reasoning shown:

  A. A seventeenth-century cabinet picture bought in 1974 as an autograph work. Technical imaging now shows it to be a contemporary workshop version, probably painted partly by the master and partly by an assistant, and probably sold at the time without any claim one way or the other. Nothing about it as an object has changed. What does the label say, what does it do to the valuation, and what happens to the seventy-four file?

  B. A light work acquired in 2011 as a certificate with the artist's fabrication instructions, fabricated under studio supervision and accessioned as the work itself. The artist has since publicly disavowed our instance on political grounds, while continuing to license identical instances elsewhere, and has asked us to label it as unauthorised. Is this the same kind of question as A at all?

  C. A painting that has hung here for forty years, is the single most reproduced image we own, and was shown by technical evidence to be the work of a known imitator of the master we catalogued it under. Our curators are privately of the view that it is a better picture than any genuine work by that master that we could ever afford. A dealer has offered a serious sum for it on the understanding that it will be resold, at a markup, as a celebrated forgery.

  Also give the procedure a stated position on a standing practice of ours: for four months each year a light-sensitive painting comes off the wall and a high-grade reproduction goes into its frame, and the only disclosure is a line in small print at the bottom of the wall text. Tell me whether that is anyone's business but the conservator's.

  Finally, two things. Mark, at each step, the places where judgment genuinely cannot be eliminated and has to be handed to me, to the director, to the board, or to our lawyers — including anything that is really a question of rightful ownership rather than of what the object is. And tell me plainly which of the cases above comes out against us. I would rather have a procedure that returns an answer my director will hate than one quietly rigged so that everything we already do turns out to be defensible.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**

      *   **User Role:** Registrar and Collections Manager of a mid-sized municipal museum (9k objects, mostly European old masters + small contemporary collection).
      *   **Problem:** Recurring arguments when an object's attribution/status is questioned (Curator vs. Director vs. Finance vs. Board). Need a standardized decision procedure to resolve these disputes.
      *   **Goal:** A written decision procedure for determining "what an object is" (attribution, period, originality, etc.) leading to specific dispositions (keep, relabel, deaccession, etc.).
      *   **Philosophical Grounding:** Must be grounded in the philosophy of art (specifically regarding the loss when an original is a copy, beyond just perception).
      *   **Four Key Questions (User's Framework):**
          1.  Perceptual (does it look different?).
          2.  Agency/Process (whose doing/constraints?).
          3.  Testimonial/Historical (what does it tell us now?).
          4.  Promissory/Contractual (what did we promise?).
      *   **Constraints:**
          1.  Runnable by Registrar + 1 assistant (no conservation training) in ~1 day. Must handle uncertainty (burden of proof, interim status).
          2.  Must handle contemporary conceptual works (certificates/instructions). Needs the technical term for these.
          3.  Must provide graded label wording (Studio of, Circle of, etc.) and insurance impact rules.
      *   **Test Cases:** Run the procedure on three specific scenarios (A: Workshop version, B: Disavowed conceptual work, C: Celebrated forgery).
      *   **Specific Policy Question:** Address the practice of swapping light-sensitive paintings with reproductions without clear disclosure.
      *   **Requirements:** Mark points of irreducible judgment (who decides what), and state plainly which case comes out "against" the museum.
      *   **Tone:** Professional, authoritative, philosophically rigorous but practical, unyielding on integrity.

  2.  **Deconstruct the Philosophical Grounding:**

      *   *Perception:* Nelson Goodman's *Languages of Art* is crucial here. The "autographic" vs. "allographic" distinction. For autographic arts (painting), the history of production matters. A perfect forgery is aesthetically indistinguishable *now* but lacks the correct history of production.
      *   *Agency/Process:* Arthur Danto's "Artworld" or Dickie's Institutional Theory, but more specifically, the intentionality of the maker. The difference between "achievement" (creating the look) and "matching" (replicating the look).
      *   *Testimonial:* The object as a historical document. If it's a 1920 copy of a 1660 work, it tells us about 1920 taste, not 1660 practice.
      *   *Promissory:* Institutional ethics (AAM/ICOM codes). The contract with the public is truthfulness about the collection.

  3.  **Drafting the Procedure (The "Attribution & Status Resolution Protocol" - ASRP):**

      *   *Structure:* Needs to follow the user's four questions but operationalize them.
      *   *Step 1: Perceptual Integrity.* (Goodman). If it looks the same, does it stay? No. Why? Because history matters.
      *   *Step 2: Genealogy of Making.* (Danto/Wollheim). Who made it and why? Distinguish between *autographic* (unique history matters) and *allographic* (notation matters) vs. *conceptual* (instruction matters).
      *   *Step 3: Epistemic Utility.* What knowledge does it generate?
      *   *Step 4: Institutional Obligation.* Donor agreements, public trust.
      *   *Uncertainty:* Burden of proof lies on the *claim* of change. If unproven, status quo remains but flagged.
      *   *Contemporary Works:* The term is "Allographic" or more specifically "Conceptual/Instruction-Based" often falling under "Variable Media." The key is adherence to the *score* or *certificate*.
      *   *Labeling:* Need the standard hierarchy (Attributed to, Studio of, Circle of, Follower, Manner of, After, Forgery).
      *   *Insurance:* Needs a sliding scale based on market confidence.

  4.  **Addressing the Constraints:**

      *   *Time:* The procedure needs checklists, not deep research. The Registrar gathers evidence; the Committee decides.
      *   *Judgment Points:* Explicitly mark where the Registrar stops and the Director/Board/Lawyers start.
      *   *The "Swap" Policy:* This is ethically dubious. Needs to be called out.

  5.  **Running the Test Cases:**

      *   *Case A (Workshop Version):*
          *   Perceptual: No change.
          *   Agency: Master + Assistant. Not fully autograph.
          *   Testimonial: Tells us about workshop practice, not just the Master's hand.
          *   Promise: 1974 file needs amendment, not deletion.
          *   Outcome: Relabel ("Studio of"), adjust insurance (down), keep 1974 file as provenance history.
      *   *Case B (Conceptual/Disavowed):*
          *   Type: Allographic/Conceptual. Identity lies in the certificate/instructions, not the physical instance *unless* the certificate specifies authorization.
          *   Issue: Artist disavowal.
          *   Outcome: This is legal/contractual. If the certificate allows studio fabrication without artist approval, the museum is likely safe, *but* the label must reflect the dispute. It is *not* the same as A. A is about history of production; B is about contractual validity of the instance.
      *   *Case C (Forgery/Popular):*
          *   Perceptual: "Better" than the real thing (irrelevant philosophically).
          *   Agency: Known imitator.
          *   Testimonial: Currently lies about the Master.
          *   Promise: Public trust violated if kept as Master.
          *   Outcome: Relabel as Forgery/Imitation. Selling it as a "celebrated forgery" aids the market in deception. Deaccessioning is risky (might look like admitting fault). Keeping as "Historical Forgery" is best. *Wait, the prompt asks which comes out "against us".* Case C is the biggest reputational risk. If we sell it to a dealer who sells it as real later, we are complicit. If we keep it as real, we lie.
      *   *The Swap:* It is the public's business. It violates the promise of authenticity.

  6.  **Refining the Philosophy:**

      *   Need to ensure Goodman's distinction is clear: In autographic arts, the *history of production* is constitutive of the work's identity. A copy lacks the correct history.
      *   Need to articulate the "Achievement vs. Effect" argument (Wollheim/Kivy). The value is in the *act* of solving the pictorial problem, not just the solution existing.

  7.  **Drafting the Content - Section by Section:**

      *   **Introduction:** Purpose and Philosophical Basis.
      *   **The Four-Step Protocol:** Detailed steps corresponding to the user's four questions.
      *   **Uncertainty & Burden of Proof:** Interim statuses.
      *   **Conceptual Works:** The "Allographic/Conceptual" branch.
      *   **Labeling & Valuation:** The hierarchy.
      *   **The "Swap" Policy:** Ethical ruling.
      *   **Case Studies:** Application of the protocol.
      *   **Judgment Matrix:** Who decides what.
      *   **The "Against Us" Verdict.**

  8.  **Self-Correction/Review during drafting:**

      *   *Critique:* Is the procedure too academic?
      *   *Fix:* Keep the philosophy in the preamble and the "Why" sections, but make the steps actionable checklists.
      *   *Critique:* Did I answer the "technical term" for contemporary works?
      *   *Fix:* Use "Allographic" (Goodman) but also "Instruction-Based" or "Conceptual" as practical terms. The specific term for works produced posthumously under instruction is often "Posthumous Realization" or "Authorized Replication," but philosophically they are *allographic* works treated as *autographic* instances via certificate. I will use "Allographic/Conceptual Instance."
      *   *Critique:* Did I handle the insurance question?
      *   *Fix:* Create a specific matrix for valuation multipliers.
      *   *Critique:* The "Swap" policy.
      *   *Fix:* Be firm. It is a deception.
      *   *Critique:* Which case is "against us"?
      *   *Fix:* Case C is the moral hazard. Case B is a legal headache. Case A is routine. Case C involves the temptation to profit from deception.

  9.  **Final Polish:** Ensure the tone is respectful but firm, acknowledging the difficulty of the Registrar's position while providing the armor they asked for. (Self-correction: Ensure I explicitly mark the judgment points as requested).

  10. **Final check on constraints:**
      *   Runnable in a day? Yes, it's a flowchart logic.
      *   Handles certificates? Yes, separate branch.
      *   Graded labels? Yes, included.
      *   Philosophy grounded? Yes (Goodman/Danto/Wollheim).
      *   Which case is against us? Explicitly stated.

