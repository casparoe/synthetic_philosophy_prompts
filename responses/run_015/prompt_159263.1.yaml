answer: |-
  ### The Scenario

  A company's annual bonus policy states: **"An employee is eligible for the bonus if their performance this year was 'good'."** The HR director must decide on a specific employee, Alex, whose performance metrics are mixed—strong in sales but weak in collaboration—placing them squarely in the borderline zone of the predicate **'good'**. Both the Epistemicist and the Supervaluationist agree that "Alex's performance was good" is a genuine borderline case: it is not clearly true, nor clearly false. The director must issue a verdict (Eligible or Not Eligible) based strictly on whether the eligibility condition is *true*.

  ### The Key Sentence
  **"Alex's performance was good."**

  ### The Walkthrough

  **Supervaluationism:**
  For the Supervaluationist, truth is *supertruth* (truth on all admissible precisifications). Since "good" is vague, there are admissible precisifications where Alex's performance counts as good, and others where it does not. Therefore, the sentence "Alex's performance was good" is neither supertrue nor superfalse; it has a truth-value gap. The policy rule is a conditional: *If P, then Eligible*. In supervaluationist semantics, a conditional with a gappy antecedent does not preserve supertruth to the consequent. The condition "P is true" is not met (because P is not supertrue). Consequently, the eligibility condition fails. The theory yields a definite, decidable verdict: **Not Eligible**. (The gap in the predicate blocks the rule from firing).

  **Epistemicism:**
  For the Epistemicist, bivalence holds: the sentence "Alex's performance was good" is either True or False, determined by a sharp cutoff in the metaphysical facts of performance quality that we cannot know. There is a fact of the matter regarding eligibility. However, because the case is borderline, the director is necessarily ignorant of which fact obtains. The theory yields no usable verdict for the decision-maker: **Unknown** (Eligible or Not Eligible, but unknowable which). The director is paralyzed by the ignorance constraint inherent to the theory.

  ### The Reversal Test
  To ensure this isn't an artefact of the "If P" formulation, consider the classically equivalent rephrasing: **"An employee is eligible unless their performance was 'not good'."**
  *   **Supervaluationism:** "Not good" is also gappy (negation preserves the gap). The "unless" clause (exception) is not supertrue. Therefore, the exception does not trigger. However, in a strict "Eligible iff..." reading, the gap propagates. But if we treat "Eligible unless Not-Good" as "Eligible if Good" (standard contractual interpretation), the antecedent "Good" is still not supertrue. The verdict remains **Not Eligible** (condition not met).
  *   **Epistemicism:** "Not good" is either True or False (unknown). The exception either triggers or doesn't (unknown). The verdict remains **Unknown**.
  *   *Note:* The Supervaluationist verdict holds stable (Condition Not Met) across logical equivalents because the lack of supertruth in the atomic predicate prevents the deontic status from being established, whereas the Epistemicist remains stuck in ignorance of the binary fact.

  ### The Key Feature Doing the Work
  The divergence is driven by the **semantic status of the borderline antecedent**.
  *   For the **Supervaluationist**, a borderline sentence is *not true*. Since the rule requires truth to trigger, the rule *definitely does not trigger*. The gap acts as a circuit breaker.
  *   For the **Epistemicist**, a borderline sentence *is true or false*. Since the rule triggers on truth, the rule *definitely does or does not trigger*. The ignorance acts as a paralysis.

  ### What Happens If You Remove It
  If you remove the vagueness (e.g., the clause reads "if performance score > 85"), both theories agree on the truth value and the verdict.
  If you modify the clause to include a determinacy operator (e.g., "if performance is *definitely* good"), the Supervaluationist verdict becomes "Not Eligible" (since it's not definitely good), but the Epistemicist verdict *also* becomes "Not Eligible" (since we know it's not *known* to be good, and epistemicists often treat 'definitely' as 'known'). This is why Constraint 4 banned such operators: the reversal relies on the *plain* vague predicate, where Epistemicism insists on a hidden fact while Supervaluationism admits a public gap.

  ### The Epistemicist's Best Counter
  The Epistemicist will argue that the Supervaluationist is smuggling in a **burden of proof** under the guise of semantics. The policy says "If P," not "If Supertrue P." By treating a gap as a failure of the condition, the Supervaluationist is effectively ruling against the employee by default. The Epistemicist insists: *"The sentence is True or False. If it is True, the employee is owed the bonus. Your theory denies them the bonus based on your semantic inability to classify the fact, not the fact itself. You are conflating 'not known to be true' with 'false'."*

  ### The Cost
  This reversal comes at a significant price. The Supervaluationist's "decidability" is essentially a **default negative verdict**. It solves the decision-maker's paralysis by systematically denying claims in borderline cases (false negatives). It is decisive, but potentially unjust. The Epistemicist's "paralysis" is more honest about the normative risk: there *is* a right answer, and forcing a verdict risks error. The Supervaluationist buys decisiveness by accepting that some truths (the borderline ones) simply don't count as truths for the purpose of the rule. This challenges the folklore by showing that "classical bivalence" (Epistemicism) is practically inert in the penumbra, while "gappy semantics" (Supervaluationism) provides a functional, if conservative, decision procedure.
