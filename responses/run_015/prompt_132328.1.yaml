answer: |-
  Look, you were totally right to call out the power problem. That argument you had is basically the whole drama of the last 25 years in geology, but framed perfectly. If we treat the International Chronostratigraphic Chart like a constitution and the International Commission on Stratigraphy (ICS) like a Supreme Court, the whole Anthropocene saga looks less like science and more like a constitutional crisis.

  Here's how the map breaks down.

  **The Founding Moment: Cuernavaca 2000**
  Paul Crutzen interrupting that meeting wasn't just a scientific suggestion; it was a popular initiative. In constitutional terms, he bypassed the standing committee to propose a new amendment to the framework of time itself. He realized the "Holocene" clause no longer covered the reality on the ground (or in the atmosphere). By coining "Anthropocene" in a public forum rather than submitting a quiet paper to the subcommission, he essentially started a constitutional convention. He mobilized public and interdisciplinary opinion (climate scientists, historians) before the "Court" (ICS) had even agreed to hear the case.

  **The Legislative Phase: The AWG**
  The Anthropocene Working Group (AWG) acted like a legislature drafting the bill. They spent years debating the start date—the equivalent of debating the preamble. You had the "1784 Steam Engine" faction (industrial capitalism), the "1492 Colonialism" faction (humanists/historians), and the "1950 Great Acceleration" faction (hard data/nuclear isotopes). The AWG voted for 1950 at Crawford Lake. They tried to follow procedure: pick a Golden Spike (GSSP), find a physical marker (plutonium), and submit it for ratification.

  **The Judicial Review: ICS/SQS 2024**
  This is where your "temporal constitutionalism" lens gets tested. The Subcommission on Quaternary Stratigraphy (SQS) and the ICS voted down the proposal in 2024.
  *   **The Constitutionalists View:** The Court blocked the amendment because it lacked the necessary supermajority consensus. Changing an epoch isn't just about data; it's about stability. If you let a 100-year blip redefine 11,700 years of precedent, you destabilize the entire temporal framework that every other science relies on. The rejection confirms the model: the Court protects the Constitution from rapid, politicized amendments.
  *   **The Breakdown:** However, the ICS didn't say "we lack consensus." They said the stratigraphy is too shallow. They argued the "text" of the rock record doesn't support the amendment yet. This suggests the "Constitution" isn't just procedural rules; it's material reality. The Court isn't just protecting authority; they're claiming the evidence hasn't met the strict constructionist standard required for an epoch-level change.

  **Where the Theory Holds and Where It Cracks**
  Temporal constitutionalism explains the *friction* perfectly. It explains why a working group couldn't just declare it done, and why historians (who want 1492) were shut out—they weren't speaking the "legal language" of stratigraphy. It highlights that geologic time is a public good that requires high barriers to change.

  But the theory fails to account for the *material gatekeepers*. It's not just that the ICS is a guild protecting its turf (though they are); it's that rocks don't vote. The rejection wasn't purely political veto; it was a ruling that the "amendment" was poorly drafted according to the existing code (stratigraphic rigor). The theory assumes the barrier is consensus, but the barrier is actually sedimentation rates. You can't vote a layer of rock into existence if it hasn't lithified yet.

  **The Verdict**
  This episode shows that temporal constitutionalism is a powerful metaphor for the *sociology* of the debate, but it hits a wall when it meets the *geology*. The "Constitution" is partly written in rules, but mostly written in stone. The ICS acted like a Court, but they claimed to be interpreting evidence, not just managing consensus. So, it's not a pure guild protection racket, but it's not a pure democracy either. It's an oligarchy of rock.

