      *   *Round 2 (Handicap):* Cost of B is Low for H, High for L.
          *   Incentive: H sends B (Net gain > 0). L sends A (Cost of B > Gain from Trust). Receiver Trusts B, Rejects A. (Separating Equilibrium).
      *   *Round 3 (Burning Money):* Cost of B is High for *both*.
          *   Incentive: If Cost > Gain for both, nobody sends B. If Cost < Gain for both, both send B (back to Round 1).
