      *   *Concept 1: The Job Market (Spence Model).*
          *   Setup: Students are "Workers" (High/Low ability) and "Firms." Workers choose education levels. Firms offer wages based on education.
          *   Pros: Classic economics, intuitive.
          *   Cons: Hard to scale for 16 people (need enough firms). "Ability" is hidden, which is good, but often feels abstract. Hard to make the cost *differential* feel physical without complex math.
      *   *Concept 2: Predator-Prey / Stotting (Biology focus).*
          *   Setup: Some students are Gazelles, some Cheetahs. Gazelles signal strength.
          *   Pros: Directly maps to biology.
          *   Cons: Role asymmetry makes it hard to switch perspectives. Cheetahs might just attack randomly. Hard to quantify "cost" physically in a classroom.
      *   *Concept 3: The "Trust Exchange" (General Signaling).*
          *   Setup: Pairs. One is Sender (Type H or L), one is Receiver. Sender sends a message. Receiver decides to Trust or Not. Payoffs depend on Type + Trust. Cost is imposed on Sender for sending "High" message.
          *   Pros: Clean, controlled, easy to calculate payoffs. Fits the 3-round structure perfectly.
          *   Cons: Can feel dry if not framed well.

      *   *Selection:* **Concept 3 (The Trust Exchange)** is the winner.
          *   *Why:* It isolates the mechanism (Sender/Receiver, Hidden Type, Costly Message) without the noise of market dynamics or physical roleplay. It allows for precise payoff matrices which are crucial for the "rational actor" check requested. It scales easily to 16 students (8 pairs). It fits the 80-minute window better than a market simulation.

  3.  **Designing the Incentive Structure (The Critical Step):**
      *   *Goal:* Round 1 (Pooling), Round 2 (Separating), Round 3 (Wasteful/Debate).
      *   *Roles:* Sender (Type H or L), Receiver.
      *   *Action:* Sender chooses Message (A or B). Receiver chooses Action (Trust or Reject).
      *   *Payoffs:*
          *   If Receiver Trusts: Sender gets $X$, Receiver gets $Y$ (if H) or $-Z$ (if L).
          *   If Receiver Rejects: Both get 0 (or small baseline).
          *   *Cost:* Sending Message B costs $C$.
      *   *Types:* High (H) and Low (L). H is beneficial to Receiver. L is harmful.
