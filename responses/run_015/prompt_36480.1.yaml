              *   Round 1: Free Signal (Pooling).
              *   Round 2: Differential Cost (Separating - The Handicap).
              *   Round 3: High Uniform Cost (The "Waste" Debate). Here, I will set the cost such that L *just barely* loses by signaling, and H *just barely* gains. But the cost is numerically identical. This forces the question: "Why did the cost work? Because L is poorer? Or because the cost is waste?"
