      *   *Payoff Verification:*
          *   Receiver Trusts H: +10 pts. Trusts L: -10 pts. Reject: 0.
          *   Sender H: Trust = +10. No Trust = 0.
          *   Sender L: Trust = +10. No Trust = 0.
          *   *Problem:* If Sender payoffs are identical, and Cost is identical, behavior is identical.
          *   *Fix:* Sender H gets +15 from Trust. Sender L gets +10 from Trust. (H has more to gain).
          *   *Round 1:* Cost = 0. Both signal. Receiver Trusts? If prob(H) = 0.5, Exp Value = 0.5(10) + 0.5(-10) = 0. Receiver indifferent. Let's make L worse. Trust L = -20. Exp Value = -5. Receiver Rejects. Signal collapses.
