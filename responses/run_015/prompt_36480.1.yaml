answer: |-
  ## Part 1: Game Concept Selection

  Here are three candidate concepts for a signaling game with 16 students.

  **1. The Job Market (Spence Model)**
  *   **Setup:** Students are "Workers" (hidden ability High/Low) and "Firms." Workers buy "Education" (tokens). Firms offer wages based on Education.
  *   **Pros:** Classic economics; directly maps to degree signaling.
  *   **Cons:** Requires a market mechanism (bidding/negotiation) which eats time. With 16 students, you get too few "Firms" to create competition, leading to monopsony dynamics that confuse the signaling lesson. Hard to enforce "hidden ability" without complex paperwork.

  **2. Predator-Prey (Stotting Model)**
  *   **Setup:** Half students are Gazelles, half Cheetahs. Gazelles choose to "Stot" (jump) or Run. Cheetahs choose to Chase or Pass.
  *   **Pros:** Directly maps to the biology (peacocks/gazelles).
  *   **Cons:** Asymmetric roles make it hard to debrief universally (Gazelles feel one thing, Cheetahs another). Physical movement in a seminar room is distracting. Hard to quantify "cost" precisely enough for the economic payoff analysis you requested.

  **3. The Trust Exchange (Sender-Receiver Game)**
  *   **Setup:** Pairs. One Sender (hidden Type H or L), One Receiver. Sender sends a Message (A or B). Receiver chooses Trust or Reject. Payoffs depend on Type + Trust. Cost is attached to Message B.
  *   **Pros:** **This is the winner.** It isolates the mechanism (Information Asymmetry + Cost) without market noise. It scales perfectly to 8 pairs. It allows for precise payoff matrices (critical for the "rational actor" check). It is easy to run with printed cards and tokens.

  ---

  ## Part 2: Full Game Design ("The Trust Exchange")

  ### Materials & Prep
  *   **Tokens:** 100 poker chips or colored slips of paper (worth 1 point each).
  *   **Role Cards:** 16 cards (8 marked **Type H**, 8 marked **Type L**). *Note: Only the Sender knows their type.*
  *   **Decision Sheets:** 3 per student (one for each Round).
  *   **Reward:** Candy or "Homework Pass" vouchers for top scorers (psychological incentive is usually enough for 3rd years, but have candy ready).
  *   **Staff:** You (Instructor) + 1 TA (Banker/Timekeeper).

  ### The Payoff Structure (The Engine)
  *This is the most critical part. If these numbers are off, the game fails.*

  **Baseline Payoffs (Receiver):**
  *   If Receiver **Trusts** a **Type H**: Receiver gets **+10**, Sender gets **+15**.
  *   If Receiver **Trusts** a **Type L**: Receiver gets **-20**, Sender gets **+15**.
  *   If Receiver **Rejects**: Both get **0**.

  *Why these numbers?* The Receiver *wants* to trust H but *fears* L. The penalty for trusting L (-20) outweighs the gain from H (+10). If types are 50/50, the Expected Value of trusting a random person is $0.5(10) + 0.5(-20) = -5$. A rational Receiver will **Reject** everyone unless they have information.

  **Signaling Costs (Sender pays this to send Message "B" / "The Signal"):**
  *   **Message A (Silence):** Cost = 0.
  *   **Message B (Signal):** Cost varies by Round.

  ### Timeline & Script (80 Minutes)

  #### 0:00 – 0:10 | Setup & Rules
  **Action:** Divide into 8 pairs. Sit facing each other. Give each pair a stack of 20 tokens (bankroll). Distribute Role Cards (8 H, 8 L). **Senders** look at their card; **Receivers** do not.
  **Script:** "You are in a market of trust. Senders know their own quality (High or Low). Receivers do not.
  *   **Sender:** Choose Message A (Silence) or Message B (Signal). If you choose B, you must pay the 'Signal Cost' from your tokens.
  *   **Receiver:** Observe the Message. Choose Trust or Reject.
  *   **Payoffs:** I will collect your sheets, calculate points based on the matrix on the board, and pay out tokens. Top 3 pairs get candy. No talking during decisions."

  #### 0:10 – 0:25 | Round 1: Cheap Talk (The Collapse)
  **Rule:** Cost of Message B = **0 tokens** for everyone.
  **Script:** "Round 1. Sending the Signal (Message B) is free. It costs nothing. Write your decision. Senders, pass your message slip to Receivers. Receivers, decide."
  **Expected Outcome:**
  *   **Senders:** Both H and L send Message B (Why not? It's free and might help).
  *   **Receivers:** See everyone sending B. Realize B conveys no info. Calculate EV (-5). Choose **Reject**.
  *   **Result:** Everyone gets 0 points. Trust collapses.
  **TA Task:** Collect sheets, record data on board (e.g., "7/8 Sent B, 1/8 Trusted").

  #### 0:25 – 0:40 | Round 2: The Handicap (Separation)
  **Rule:** Cost of Message B = **2 tokens for Type H**, **12 tokens for Type L**.
  *Note: You must whisper or hand a private slip to Senders telling them their specific cost, OR print it on their Role Card.*
  **Script:** "Round 2. The Signal now costs tokens. **High Types**, your cost is 2. **Low Types**, your cost is 12. You keep your type secret. Decide."
  **Incentive Check:**
  *   **Type H:** Signal Cost (2) < Gain from Trust (15). Net +13. **Send B.**
  *   **Type L:** Signal Cost (12) < Gain from Trust (15). Net +3. *Wait, this is risky.* If L sends B, they profit +3. They might still signal.
  *   *Correction for Airtight Incentives:* We need L to *lose* points by signaling.
  *   **Revised Cost:** **H pays 2. L pays 20.** (L cannot afford it or goes negative).
  *   **Better Revision:** Let's use the "Budget Constraint." Everyone has 10 tokens start.
      *   **H Cost:** 2 tokens.
      *   **L Cost:** 15 tokens.
      *   **L Payoff:** If L signals (Cost 15) + Trust (15) = 0. If L stays silent (Cost 0) + Reject (0) = 0. L is indifferent.
      *   **Make it strict:** **H Cost: 2. L Cost: 18.**
      *   **H:** 15 (Trust) - 2 (Cost) = **+13**. (Signal).
      *   **L:** 15 (Trust) - 18 (Cost) = **-3**. (Don't Signal).
  **Expected Outcome:** H sends B. L sends A. Receiver sees B -> Trusts (Gets +10). Sees A -> Rejects (Gets 0). Separation achieved.

  #### 0:40 – 0:55 | Round 3: The "Waste" (Uniform High Cost)
  **Rule:** Cost of Message B = **10 tokens for EVERYONE** (H and L).
  **Script:** "Round 3. The Signal now costs 10 tokens for *everyone*, regardless of type. Same cost. Decide."
  **Incentive Check:**
  *   **H:** 15 (Trust) - 10 (Cost) = **+5**. (Signal).
  *   **L:** 15 (Trust) - 10 (Cost) = **+5**. (Signal).
  *   *Problem:* If benefits are identical, they both signal again (Pooling).
  *   *Fix:* We must change the **Benefit** for this round to make it separate despite uniform cost.
  *   **Revised Rule Round 3:** "Round 3. Cost is 10 for everyone. **However**, Type H gets **+20** from Trust. Type L gets **+5** from Trust." (H is a 'Premium' partner).
  *   **H:** 20 - 10 = **+10**. (Signal).
  *   **L:** 5 - 10 = **-5**. (Don't Signal).
  **Expected Outcome:** Separation occurs again, but via *differential benefit* + *uniform high cost*, not differential cost.
  **Debrief Hook:** "H paid 10. L didn't. But H *could* have paid 2 (like Round 2). Why did I make them pay 10? That extra 8 tokens is pure waste. Is it necessary?"

  #### 0:55 – 1:20 | Debrief & Theory
  (See Section 4 below).

  ---

  ## Part 3: Incentive & "Troll" Check

  I have traced the rational actor path. Here is why students won't break it:

  1.  **Round 1 (The Collapse):**
      *   *Troll Risk:* A Type H decides not to signal to "teach a lesson."
      *   *Mitigation:* H loses nothing by signaling (Cost 0). If they don't signal, they get 0 (Receiver rejects all). If they signal, they *might* get lucky if a Receiver irrationally trusts. Rational H signals.
      *   *Troll Risk:* Receiver trusts everyone anyway.
      *   *Mitigation:* The -20 penalty is painful. In a competition for candy/points, losing 20 is suicide. They will learn to reject.

  2.  **Round 2 (The Handicap):**
      *   *Troll Risk:* Type L signals anyway to spite the game.
      *   *Mitigation:* Cost is 18. Payoff is 15. Net result is -3 points. Since we track total score across 3 rounds, a rational student wanting candy will not take a guaranteed loss just to troll.
      *   *Troll Risk:* Receiver rejects Signal B.
      *   *Mitigation:* If they reject B, they get 0. If they trust B (and it's H), they get +10. Since H *must* signal to survive, B is a strong indicator.

  3.  **Round 3 (The Waste):**
      *   *Risk:* Confusion over changing benefits.
      *   *Mitigation:* Write the Round 3 Payoff Matrix clearly on the board. "H gets 20, L gets 5."
      *   *Risk:* Students collude (split points).
      *   *Mitigation:* Announce: "Pairs with the highest *joint* score get candy." This encourages cooperation *within* the rules, not breaking them.

  ---

  ## Part 4: The Debrief (Mapping Game to Theory)

  **1. The Collapse of Cheap Talk (Round 1)**
  *   **Ask:** "Why did trust collapse in Round 1?"
  *   **Concept:** **Pooling Equilibrium.** When the cost of lying is zero, everyone lies (or signals). The signal contains zero information.
  *   **Connect:** "This is 'Cheap Talk' in economics. A resume that says 'I am hardworking' means nothing if everyone prints it."

  **2. The Handicap Principle (Round 2)**
  *   **Ask:** "What changed in Round 2? Why did the signal work?"
  *   **Concept:** **Separating Equilibrium.** The cost was *differential*. It bit the Low Type harder than the High Type.
  *   **Name Drop:** **Zahavi's Handicap Principle.** The peacock's tail is heavy and dangerous. A weak bird dies if it grows a big tail. A strong bird survives. Therefore, the tail proves strength *because* it is costly.
  *   **Connect:** "Your 18-token cost was the tail. The Low Type couldn't afford the tail. The signal became credible."

  **3. The Philosophy of Waste (Round 3)**
  *   **Ask:** "In Round 3, the cost was the same (10 tokens). But H still signaled and L didn't. Why?"
  *   **Answer:** Because H had more to gain (20 vs 5).
  *   **The Juicy Question:** "But look at Round 2. H only needed to pay 2 tokens to separate from L. In Round 3, H paid 10. That extra 8 tokens was burned. It helped no one. Is that waste *necessary*?"
  *   **Discussion:** In the game, I (the designer) set the cost. In nature, there is no designer. The cost is physical (metabolic energy, predation risk). The "waste" is load-bearing. If the tail were cheaper, liars could fake it. The waste *is* the point.
  *   **Connect:** "Expensive engagement rings. A $100 ring says 'I like you.' A $10,000 ring says 'I am willing to burn resources to prove commitment.' The waste is the credential."

  ---

  ## Part 5: What Will Go Wrong (Risk Assessment)

  1.  **The "Nice" Receiver:**
      *   *Failure:* In Round 1, Receivers trust despite the math because they are socially conditioned to be nice.
      *   *Fix:* Be ruthless in the debrief. "You lost 20 points to be nice. That's why the market collapsed." If it happens, run a "sudden death" Round 1b where penalties are doubled.
  2.  **The "Spite" Low Type:**
      *   *Failure:* A Low Type student signals in Round 2 knowing they will lose points, just to make the Receiver lose points too (-20).
      *   *Fix:* Emphasize **Individual** Scoring for the candy prize, not Pair Scoring. If they tank their own score, they lose the prize. Self-interest usually overrides spite.
  3.  **Math Confusion:**
      *   *Failure:* Students spend 10 minutes calculating 15-18.
      *   *Fix:* Put the "Net Profit" table on the board.
          *   *Round 2:* H Signal = +13. L Signal = -3.
          *   Make it visual.
  4.  **Time Creep:**
      *   *Failure:* Distributing tokens/cards takes too long.
      *   *Fix:* Have the TA pre-stack envelopes for each pair. Hand out envelopes, not loose items.

  ---

  ## Part 6: What The Game Cannot Reproduce (Limitations)

  You asked for a frank note on the gap between the game and reality. This is crucial for the "Philosophy" part of your seminar.

  **1. Stipulated vs. Emergent Costs**
  *   **In Game:** I told the Low Type, "Your cost is 18." It was a rule.
  *   **In Nature:** Nobody tells a peacock, "Your tail must cost 18 units." The cost emerges from physics and physiology. A weak bird *physically cannot* carry the tail without dying.
  *   **The Gap:** The game shows *how* signaling works, but not *how the cost structure evolves*. You must explain that in nature, the "rules" are selected by survival. If the tail were cheaper, predators would eat the liars, and the signal would collapse (back to Round 1).

  **2. Rationality vs. Selection**
  *   **In Game:** Students calculate: "15 - 18 = -3. I won't do it."
  *   **In Nature:** Gazelles don't calculate. Those who stot survive; those who don't (or fake it poorly) get eaten.
  *   **The Gap:** The game relies on cognitive rationality. Real signaling relies on evolutionary selection. You need to bridge this by saying: "Think of the points as 'Survival Fitness.' The ones who made the right choice get to reproduce (keep their points)."

  **3. One-Shot vs. Reputation**
  *   **In Game:** You play once per round.
  *   **In Reality:** Signaling often happens in repeated interactions (reputation).
  *   **The Gap:** In the game, once the signal is sent, the game ends. In reality, if you send a false signal and are caught, you are punished later. The game isolates the *cost* mechanism, but ignores the *reputation* mechanism which often works alongside it.

  **Closing Advice:**
  Run the numbers on a whiteboard *before* you start Round 2. Walk them through the "Low Type" calculation. "If you are Low, and you signal, you end up with -3 points. Who here wants negative points?" Get them to nod. Then let them play. If the incentives are clear, the discovery is powerful.
