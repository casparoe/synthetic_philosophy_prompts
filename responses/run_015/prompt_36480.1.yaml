              *   H: Signal (15-2=13) > No Signal (0). Signal.
              *   L: Signal (10-12=-2) < No Signal (0). No Signal.
              *   Separation!
          *   *Round 3:* Cost(H) = 10. Cost(L) = 10. (Uniform High Cost).
              *   H: Signal (15-10=5) > No Signal (0). Signal.
              *   L: Signal (10-10=0) <= No Signal (0). Indifferent/No Signal.
              *   *Tweak:* Make Cost 11. L loses 1. H gains 4.
              *   This works. It shows uniform cost can separate *if* benefits differ, but highlights the "waste" (H pays 10 unnecessarily if L was already scared off by 2).

      *   *Wait, one constraint:* "Minimal prep." Tracking individual types and payoffs for 8 pairs over 3 rounds is admin-heavy.
      *   *Solution:* Printed Role Cards. Each student gets a packet for the 3 rounds.
