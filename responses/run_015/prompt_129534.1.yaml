answer: |-
  This is one of the classic problems in legal philosophy and metaphysics, often called the **Act/Omission Distinction**. Your intuition is spot-on: physically, both scenarios involve a person not doing something, and in both cases, that "not doing" is linked to a bad outcome.

  The reason the law treats them differently isn't because the *physics* of causation are different, but because the law isn't actually trying to map physical causation. It's mapping **normative responsibility**.

  Here is the breakdown of the philosophical commitments baked into that legal split, the metaphysics of "negative causation," and what would happen if we leveled the playing field.

  ### 1. The Legal Theory: Duty as a Gatekeeper for Causation
  You asked if the law assumes omissions only count as causes when you've signed up for a duty. **Yes, essentially.**

  In tort law and criminal law, causation is usually analyzed in two steps:
  1.  **Cause-in-fact (The "But-For" Test):** *But for* the defendant's action (or inaction), would the harm have occurred?
  2.  **Proximate Cause (Legal Causation):** Is it fair to hold the defendant responsible for this result?

  **The Landlord:**
  *   **But-For:** But for the landlord not fixing the heater, the tenant wouldn't have gotten sick.
  *   **Duty:** The landlord has a **special relationship** with the tenant (contractual + statutory warranty of habitability).
  *   **Result:** The omission is legally recognized as a cause because there was a pre-existing duty to act.

  **The Passerby:**
  *   **But-For:** But for the passerby not stopping, the homeless person might have been saved (arguably).
  *   **Duty:** Under common law (mostly in the US/UK), there is **no general duty to rescue**. You have no special relationship with the stranger.
  *   **Result:** The law says the passerby's inaction is *not* a legal cause of the freezing, even if it was a factual cause.

  **The Philosophical Commitment:** The law commits to the idea that **causation is not just a physical phenomenon; it is a normative one.** It assumes that "causing" harm isn't just about physics (energy transfer); it's about violating an expectation. By refusing to liability for the passerby, the law is saying: *"You did not cause this harm because you were never required to prevent it."*

  ### 2. The Metaphysics: Why "Negative Causation" is Weird
  Your teacher mentioned that negative causation is "metaphysically weird." Here is why that matters for the law.

  In physics, causation is usually understood as **processes** or **energy transfer** (e.g., a ball hits a window, transferring kinetic energy, breaking the glass).
  *   **Action:** I push you; energy transfers; you fall.
  *   **Omission:** I *don't* throw you a life preserver. No energy transfers. Nothing physical happens between us.

  If we treat omissions as genuine physical causes, we run into the **Problem of Infinite Causes.**
  *   If the homeless person freezes because the passerby didn't help, did they also freeze because *you* didn't fly in from Mars to help? Did they freeze because the government didn't build a shelter? Did they freeze because the sun went down?
  *   Technically, the absence of *everyone's* help is a "but-for" cause of the freezing.

  **The Legal Solution:** To avoid this metaphysical explosion, the law uses **Duty** to limit the scope of causation. It artificially restricts "real causes" to only those people who had a specific obligation to intervene. This sidesteps the metaphysical weirdness by imposing a moral/legal filter on physical reality.

  ### 3. Is the System Consistent?
  **Internally (Legally):** Yes. It is consistent with **Liberal Individualism**.
  The underlying philosophy (stemming from thinkers like John Stuart Mill) prioritizes **Negative Liberty** (freedom from interference) over **Positive Liberty** (entitlement to resources/aid).
  *   The law forbids you from *harming* others (acting).
  *   The law does not force you to *help* others (omitting), because forcing help is seen as an infringement on your autonomy and bodily integrity.

  **Externally (Morally):** Many philosophers argue it is **inconsistent**.
  *   **James Rachels' Famous Example:** A man drowns his cousin to inherit money (Action). Another man watches his cousin drown in a bathtub to inherit money (Omission). Morally, we judge them equally. The law, however, punishes the first as murder and the second (usually) as nothing.
  *   **Peter Singer's Shallow Pond:** If you walk past a child drowning in a shallow pond, you are morally obligated to ruin your shoes to save them. If the law says you can walk past a freezing person, it creates a gap between **Legal Obligation** and **Moral Obligation**.

  So, the system is consistent with *libertarian political theory*, but inconsistent with *utilitarian or egalitarian moral theory*.

  ### 4. What If We Treated Omissions Like Actions?
  If we took the position that omissions are causally identical to actions (removing the "Duty" filter), the legal and social landscape would shift radically. This is actually how some Civil Law countries (like France or Germany) operate.

  **A. "Bad Samaritan" Laws**
  You would have a legal duty to rescue anyone in peril if you could do so without danger to yourself. Failing to act would be a crime (like manslaughter).
  *   *Philosophical Shift:* This moves the law from **Corrective Justice** (fixing specific wrongs between parties) to **Distributive Justice** (ensuring general welfare and safety).

  **B. Explosion of Liability**
  If omissions are causes, the "Infinite Causes" problem returns. The courts would have to draw new lines.
  *   Are you liable for not donating 10% of your income to charity, thereby "causing" starvation abroad?
  *   Are parents liable for not teaching their kids better, thereby "causing" future crimes?
  *   *Philosophical Shift:* We would have to accept that **we are our brother's keepers.** Autonomy would be subordinate to Community Welfare.

  **C. Metaphysical Acceptance**
  Legally recognizing omissions as full causes requires accepting **Negative Facts** as real.
  *   We would have to agree that "The absence of a coat" is a real thing that can cause "Hypothermia" just as much as "A knife" causes "A cut."
  *   This aligns with **Counterfactual Theories of Causation** (Causation is about what *would* have happened, not just energy transfer).

  ### Summary of the Split
  | Feature | Current Common Law (US/UK) | Hypothetical "Omission = Action" Law |
  | :--- | :--- | :--- |
  | **Theory of Causation** | **Normative:** Causation requires a breach of duty. | **Counterfactual:** Causation is about "what if." |
  | **Metaphysics** | Avoids negative facts; focuses on physical acts. | Accepts negative facts/absences as causal relata. |
  | **Political Philosophy** | **Libertarian:** Priority on individual autonomy. | **Communitarian:** Priority on collective safety. |
  | **Liability** | Limited to special relationships. | Universal duty to rescue. |
  | **Consistency** | Consistent with liberty, inconsistent with morality. | Consistent with morality, inconsistent with liberty. |

  ### The Bottom Line
  The law treats the landlord and the passerby differently not because their **causal impact** is different, but because their **social contract** is different.

  The legal system is not a physics engine; it's a policy tool. It accepts the metaphysical "weirdness" of negative causation but suppresses it to protect individual freedom. If you want to fix the moral inconsistency your friend pointed out, you don't need to change the theory of causation; you need to change the political commitment from **Negative Liberty** (don't hurt me) to **Positive Liberty** (help me survive). That's a much harder sell than a metaphysical argument.
