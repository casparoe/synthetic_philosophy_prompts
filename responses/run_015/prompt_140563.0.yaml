prompt: |-
  Most scientists seem to treat it as a hard requirement on any successor theory that it give back the old theory's results in the region where the old theory worked — general relativity has to hand you Newtonian gravity in the slow, weak-field limit, quantum results have to shade into classical ones when things get big, and a referee will bounce a proposal that can't show the limit coming out. What does that practice presuppose? On it's face it looks like it needs two things: some theory-neutral way of saying what the old theory's successes even were, so that both theories can be scored against the same phenomena, and enough continuity in what the words mean that reproducing the old predictions is a well-defined ask. But if the meanings shift when the paradigm shifts, I can't see what the ask is an ask about — and yet scientists keep making it and it seems to work fine in practice.

  Two wrinkles I want dealt with. First, recovery might just be a feature of one kind of transition rather than a requirement on all of them: in some episodes the old theory's central quantity gets deleted rather than recovered — phlogiston, the luminiferous ether — and nobody thinks that makes the replacement any less of an improvement. Second, imagine a field that swaps its mechanistic theory for a big fitted predictor that matches every old prediction to within noise but shares no vocabulary and no mechanism with it; it recovers the successes on the test above while explaining nothing, and I doubt that's what scientists think they're demanding.

  So: reconstruct the implicit view of theories, meaning and progress that the recovery requirement fits with. Tell me which parts are strictly presupposed by the practice and which would sit just as happily under Kuhn-style meaning variance or under something more like structural realism. Say whether the practice is consistent with itself, given that the same textbooks call the old theory straightforwardly false, go on using it, and teach it to undergraduates before the new one. And say what would concretely have to change in peer review and in how we teach science if the requirement were dropped, or if incommensurability were taken seriously enough to act on.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Deconstruct the Prompt:**

      *   **Core Question:** What does the scientific practice of requiring "limit recovery" (new theory must reproduce old theory's results in the old theory's domain) presuppose about theories, meaning, and progress?
      *   **Constraint 1 (Wrinkle 1):** Acknowledge that some concepts get *deleted* (phlogiston, ether) rather than recovered. Recovery isn't universal for *ontologies*, but for *predictions/phenomena*.
      *   **Constraint 2 (Wrinkle 2):** Acknowledge that mere curve-fitting (instrumentalism) isn't enough; scientists want *explanation*, not just matching numbers.
      *   **Task 1:** Reconstruct the implicit view of theories, meaning, and progress fitting this practice.
      *   **Task 2:** Distinguish what is *strictly presupposed* vs. what is compatible with Kuhnian meaning variance or Structural Realism.
      *   **Task 3:** Address the consistency of the practice (calling old theory false but teaching/using it).
      *   **Task 4:** Describe concrete changes in peer review and teaching if the requirement were dropped or if incommensurability were taken seriously.

  2.  **Initial Brainstorming & Philosophical Mapping:**

      *   *The "Correspondence Principle":* This is the standard name for the requirement (Bohr, etc.).
      *   *Presuppositions:* It assumes continuity of *phenomena* (observables) even if *ontology* changes. It assumes the world doesn't change just because our theory does.
      *   *Kuhn:* Kuhn argues for incommensurability (meaning changes). If "mass" means something different in Newton vs. Einstein, how can we say Einstein recovers Newton? The prompt highlights this tension.
      *   *Structural Realism (Worrall, Ladyman):* This fits well. The *structure* (mathematical relations) is preserved, even if the nature of the entities changes.
      *   *Entity Realism vs. Theory Realism:* We might not believe the old entities exist (phlogiston), but we believe the *measurements* were real.
      *   *The "False but Useful" Paradox:* Newtonian gravity is "false" (strictly speaking) but "approximately true" in a specific domain. This requires a notion of *approximate truth* or *asymptotic truth*.
      *   *Wrinkle 1 (Deletion):* Distinguish between *ontological recovery* (ether) and *empirical recovery* (planetary orbits). The requirement is about the latter.
      *   *Wrinkle 2 (Curve-fitting):* Distinguish between *phenomenological saving* and *theoretical derivation*. The new theory must derive the old limits *from its own principles*, not just fit a curve. This implies a demand for *unification* or *depth*.

  3.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the depth of the question. It touches on the Correspondence Principle, realism, and theory change.
      *   **Reconstructing the Implicit View:**
          *   What is being preserved? Not necessarily words/meanings, but *stable relations between observables*.
          *   View of Progress: Cumulative regarding *predictive control*, discontinuous regarding *ontology*.
          *   View of Meaning: Referential stability of measurement outcomes, even if theoretical terms shift.
      *   **Strict Presuppositions vs. Compatible Philosophies:**
          *   *Strict:* There is a mind-independent world generating stable regularities. Measurement procedures have continuity.
          *   *Kuhn:* Hard to square with strong incommensurability. Requires a "weak" Kuhn where overlap exists in crisis zones.
          *   *Structural Realism:* Perfect fit. $E \approx mc^2$ reduces to classical mechanics structurally.
      *   **Addressing the Wrinkles:**
          *   *Wrinkle 1 (Deletion):* Distinguish *ontology* (ether) from *phenomena* (light speed measurements). We recover the *data*, not the *stuff*.
          *   *Wrinkle 2 (Curve-fitting):* The requirement is for *derivation*, not just *fit*. The mechanism must explain *why* the limit holds.
      *   **Consistency (False but Taught):**
          *   This is the "Effective Field Theory" view. Old theories are effective descriptions of a specific scale. They aren't "false" in their domain; they are "limited."
          *   Consistency holds if we view truth as *domain-relative*.
      *   **Concrete Changes (If Dropped):**
          *   *Peer Review:* Fragmentation. Competing models that don't talk to each other. Loss of cumulative knowledge.
          *   *Teaching:* History of science becomes a graveyard of errors rather than a ladder. Undergrads learn isolated tools without a unifying framework.
          *   *Incommensurability:* If taken seriously, communication breaks down. Peer review becomes tribal.

  4.  **Refining the Argument (Self-Correction/Nuance):**

      *   *Correction on Kuhn:* Kuhn actually struggled with this. He admitted correspondence is a constraint but argued meanings change. I need to be careful not to say Kuhn *rejects* correspondence, but that he makes it philosophically problematic. The prompt asks what fits *with* the practice. Structural Realism fits better than strict Kuhnianism.
