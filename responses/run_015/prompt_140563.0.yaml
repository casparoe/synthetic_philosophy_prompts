answer: |-
  The practice you describe is known in philosophy of science as the **Correspondence Principle**. It is the engine of cumulative science in a world of revolutionary theory change. To reconstruct the implicit view of theories, meaning, and progress that makes this practice rational, we must distinguish between what is *ontologically* preserved and what is *empirically* preserved.

  Here is the reconstruction of the implicit view, the analysis of its philosophical compatibility, its internal consistency, and the consequences of abandoning it.

  ### 1. The Implicit View: Structural Continuity and Domain-Relative Truth

  The recovery requirement presupposes a specific triad of assumptions about how science hooks onto the world:

  1.  **Phenomenal Stability:** While theoretical terms (mass, time, field) may shift in meaning, the *measurement procedures* and the *regularities in instrument readings* remain stable. A mercury column's height or a spectral line's position is a "phenomenal node" that survives theory change. The practice presupposes that the world produces stable patterns of interference, regardless of how we describe the mechanism.
  2.  **Asymptotic Truth:** Theories are not treated as simply True or False. They are treated as **effective descriptions** valid within a specific domain of parameters (energy, velocity, scale). Progress is viewed as the expansion of the domain of validity. The old theory is not "refuted" in its home turf; it is "bounded."
  3.  **Derivational Depth:** To satisfy the requirement, the new theory cannot merely fit the old data points (your second wrinkle). It must *derive* the old equations as a mathematical limit (e.g., letting $c \to \infty$ or $\hbar \to 0$). This presupposes that the new theory captures the **causal structure** that *generates* the old regularities, rather than just mimicking them.

  **On Progress:** Progress is defined as **increased scope with retained fidelity.** A new theory is better if it covers the old domain *plus* a new one, without breaking the old predictions.

  ### 2. Strict Presuppositions vs. Philosophical Frameworks

  What is strictly required for this practice to function, and what is merely compatible?

  **Strictly Presupposed:**
  *   **Operational Invariance:** There must be a theory-neutral language of *observation reports* (or at least a stable enough bridge language) to identify "the old theory's successes." If we cannot agree on what counts as "planetary orbit data" independent of Newton or Einstein, we cannot check the limit.
  *   **Mathematical Continuity:** The formalism must allow for limiting operations. If the new theory's math is discrete where the old was continuous (or vice versa) without a bridging approximation scheme, recovery is impossible.

  **Compatible with Structural Realism (Best Fit):**
  *   **Ontic Structural Realism (OSR)** fits this practice perfectly. OSR argues that while the *nature* of entities changes (ontologies are discarded), the *mathematical structure* of relations is preserved.
  *   *Addressing Wrinkle 1 (Deletion):* OSR explains why we drop the ether (ontology) but keep Maxwell's equations (structure). The recovery requirement is about preserving the **structural relations** that yielded correct predictions, not the **entities** posited to explain them. We recover the *phenomena*, not the *phlogiston*.

  **Compatible with Kuhn (With Tension):**
  *   **Kuhnian Meaning Variance** creates friction here. If "mass" in Newtonian mechanics ($m_0$) and Relativistic mechanics ($m_0 / \sqrt{1-v^2/c^2}$) are incommensurable concepts, strictly speaking, you cannot say one reduces to the other.
  *   *Resolution:* The practice forces a **weak Kuhnianism**. It presupposes that during "normal science" phases, meanings are stable enough to compare. It implies that incommensurability is never total; there is always an overlap in the "instrumental language" that allows the limit to be checked. If Kuhn were taken strictly, the correspondence principle would be impossible. Therefore, the practice presupposes that **Kuhn is wrong about the total isolation of paradigms.**

  **Addressing Wrinkle 2 (The Fitted Predictor):**
  *   Scientists reject a "black box" predictor that matches data but lacks mechanism because the recovery requirement is not just about **extensional equivalence** (same outputs) but **intensional derivation** (same logical path).
  *   If a neural net fits Newtonian orbits but offers no parameter corresponding to $G$ or $m$, it fails the requirement. Why? Because it doesn't explain *why* the limit holds. The practice presupposes that **explanation requires identifying the parameters that control the transition between domains.**

  ### 3. Internal Consistency: "False" yet Taught

  You note the apparent contradiction: Textbooks call Newtonian gravity "false" (because it fails at high speeds/fields) yet teach it as foundational.

  **Is this consistent?**
  Yes, under the view of **Effective Field Theory (EFT)**.
  *   In modern physics, a theory is not "false" if it fails outside its energy scale; it is "incomplete."
  *   Newtonian gravity is the **low-energy effective limit** of General Relativity. It is strictly true *within its domain of applicability*.
  *   When scientists call it "false," they are shorthand for "false as a universal claim." When they teach it, they are teaching the **effective description** for the human scale.
  *   **Consistency Condition:** The practice is consistent only if we view truth as **domain-relative**. If we view truth as binary (True/False simpliciter), the practice is schizophrenic. Since scientists operate with domain-relative truth, the practice is coherent.

  ### 4. Concrete Consequences of Dropping the Requirement

  If we dropped the correspondence requirement, or if we took strong incommensurability seriously enough to act on it, the sociology and pedagogy of science would fracture.

  **In Peer Review:**
  *   **Fragmentation of Fields:** Without the requirement to recover old results, new theories could be entirely disjoint from prior knowledge. You would see "silos" of theory that make different predictions in overlapping domains but are immune to comparison because they share no vocabulary.
  *   **Loss of Constraint:** Currently, the correspondence principle acts as a massive filter. It kills 90% of crackpot theories immediately because they can't reproduce the hydrogen spectrum or planetary orbits. Without it, the space of "viable" theories explodes, making consensus impossible.
  *   **Tribalism:** If meanings are truly incommensurable, referees from the "old paradigm" could not judge the "new." Review would become purely aesthetic or sociological ("do I like this group?") rather than empirical ("does this match the data we already trust?").

  **In Teaching:**
  *   **History as Graveyard:** Currently, we teach Newton to teach Einstein. We use the old theory as a scaffold. If recovery were dropped, old theories would be taught only as historical curiosities (like alchemy), not as useful tools.
  *   **Loss of Intuition:** Students learn physics by building intuition on the human scale (Newton) and extending it. If the new theory doesn't shade into the old, students cannot use their physical intuition. Every new scale would require learning a completely alien logic with no bridge.
  *   **No "Classical Limit":** Undergraduates would have to learn Quantum Field Theory before they could calculate a projectile's trajectory, because the trajectory would no longer be a valid approximation of the underlying reality. Education would become impossibly abstract.

  ### Summary

  The recovery requirement presupposes that **the world is more stable than our descriptions of it.** It assumes that while our *stories* about mechanisms (ontology) may be wrong and discarded (phlogiston), the *relations* we measured (structure) were capturing something real that must be accounted for.

  It is inconsistent with strong Kuhnian incommensurability but highly consistent with **Structural Realism** and **Effective Field Theory** views of truth. It treats old theories not as lies, but as **local maps** of a larger territory. To drop it would be to sever the cumulative thread of science, turning progress into a series of disconnected revolutions where nothing is ever learned, only replaced.
