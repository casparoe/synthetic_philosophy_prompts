  3.  **Drafting the Menu of Theses (Trivial to Radical):**
      *   *Thesis 1 (Semantics):* "I" is an indexical. (Platitude).
      *   *Thesis 2 (Architecture):* Selfhood requires a feedback loop of self-representation. (Substantive).
