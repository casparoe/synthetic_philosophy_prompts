      *   **Tone:** Philosophical precision, journalistic utility, critical but fair.

  2.  **Deconstruct the One-Liner:**
      *   "There is no one in there" -> Eliminativism/Illusionism.
      *   "The I is just a symbol inside the system" -> Semantic/Representational claim.
