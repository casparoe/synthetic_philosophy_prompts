      *   *Thesis 6 (Eliminativism):* Selves don't really exist (even in humans). (Radical/False or Metaphorical depending on view).

      *Refining the Categorization:* I need to be careful with "False." Philosophical claims are rarely demonstrably false like math. "Metaphorical" or "Overstated" might be better for the Eliminativist one if it contradicts the "all a self ever was" part. Actually, if "that is all a self ever was" implies humans *have* selves but they are just loops, then Eliminativism about *human* selves is false. But Eliminativism about *substantial* selves is defensible. Let's nuance this.

