prompt: |-
  I am a novelist, and I am stuck on a moral dilemma in the scene I am drafting. A character made a solemn promise to her dying father that she would never sell the family house; decades later, selling it is the only way to pay for her own son's care, and the father, had he foreseen this, would have wanted it sold. I want the scene to turn on the genuine, specific force of the promise rather than on a general guilt, so I need to understand what, if anything, the promise actually obliges her to do now, and whether the changed circumstances — and the fact that keeping it would now defeat her father's own wishes — discharge it. Could you help me think through what the right answer to the dilemma is, and where the real tension in it lies?
reasoning: |-
  Here's a thinking process that leads to the suggested advice:

  1.  **Analyze the Request:**
      *   **User:** Novelist.
      *   **Problem:** Stuck on a moral dilemma in a scene.
      *   **The Dilemma:** Character promised dying father never to sell the family house. Decades later, selling is the only way to pay for her son's care. Father would have wanted it sold if he knew this (hypothetical consent).
      *   **Goal:** The scene needs to turn on the *specific force of the promise*, not just general guilt. The user wants to understand the moral/philosophical obligations involved to write the tension authentically.
      *   **Task:** Help think through the "right answer" (or lack thereof) and locate the *real tension*.

  2.  **Deconstruct the Moral Philosophy:**
      *   *Deontology (Duty-based):* A promise is a binding contract. The literal words matter. "Never sell" means "never sell," regardless of consequences. Breaking it is a violation of trust and integrity.
      *   *Consequentialism (Outcome-based):* The outcome matters most. Saving the son is a greater good than keeping a building. The father's *intent* (protecting the family) outweighs his *words*.
      *   *Virtue Ethics:* What would a virtuous person do? A virtuous daughter honors her father; a virtuous mother saves her child. Which virtue takes precedence?
      *   *The "Changed Circumstances" Clause (Rebus sic stantibus):* In law and ethics, contracts/obligations often assume a certain context. If the context changes radically (son's life vs. bricks), the obligation might shift.
      *   *The "Dead Hand" Problem:* Do the dead control the living? To what extent?

  3.  **Identify the Core Tension (The "Hook" for the Novel):**
      *   It's *not* just "House vs. Son." That's too utilitarian.
      *   It *is* "Literal Word vs. Spirit of Love."
      *   It *is* "Past Self vs. Present Self."
      *   It *is* "Integrity (keeping one's word) vs. Responsibility (caring for dependents)."
      *   *Crucial Insight:* The prompt asks for the "specific force of the promise." The tension lies in the *nature of the promise itself*. Was it a vow? A request? A condition of inheritance? The *solemnity* is key.

  4.  **Drafting the Response - Section by Section:**

      *   **Introduction:** Acknowledge the strength of the dilemma. Validate that there is no single "right" answer (which is good for fiction).
      *   **Philosophical Frameworks (The "Why" it's hard):**
          *   *The Literalist View:* The words are sacred. Breaking them makes her a liar.
          *   *The Intentionalist View:* The father's love was the point. Obeying the spirit means selling.
          *   *The Hierarchy of Duties:* Duty to ancestor vs. Duty to descendant.
      *   **The "Specific Force" of the Promise (Addressing the User's specific need):**
          *   Why does this specific promise bind her?
          *   *The Dying Breath:* Promises made to the dying carry extra weight (last words).
          *   *Identity:* The house might be tied to who she is. Selling it feels like erasing him.
          *   *The "What If":* The uncertainty. She *thinks* he would want it sold, but he didn't *say* that.
      *   **Where the Real Tension Lies (The Writer's Angle):**
          *   It's not about the money; it's about *betrayal*.
          *   Is she betraying the father or the son?
          *   The concept of "Moral Luck."
      *   **Scene Suggestions/Beats:** How to dramatize this?
          *   Focus on the physical object (the house).
          *   Focus on the memory of the promise (the exact words).
          *   The moment of decision (internal monologue).
      *   **Conclusion:** Reiterate that the ambiguity is the story.

  5.  **Refining the Argument (Self-Correction during drafting):**
      *   *Critique:* Don't just give a philosophy lecture. Keep it practical for a writer.
      *   *Adjustment:* Frame the philosophical points as "arguments the character might hear in her head."
      *   *Critique:* The user asked if changed circumstances discharge the promise.
      *   *Adjustment:* Address *Claustra Rebus Sic Stantibus* (things standing thus) without using too much Latin jargon. Explain that ethically, radical change *can* void a promise, but emotionally, it might not feel that way.
      *   *Key Distinction:* The difference between "He would have wanted it" (Speculation) and "He said never" (Fact). This is the crux of the tension.

  6.  **Final Polish:**
      *   Ensure tone is empathetic and insightful.
      *   Check that I'm answering the specific question: "What does the promise oblige her to do?" (Answer: It obliges her to weigh the sanctity of her word against the sanctity of life).
      *   Make sure to highlight that the "Right Answer" is less important than the "Right Struggle."

  7.  **Final Output Generation:** (This matches the detailed response provided previously.)
answer: |-
  This is a classic and powerful dilemma because it pits two sacred duties against one another: the duty to the dead (fidelity) and the duty to the living (care).

  To answer your specific question: **There is no objective moral "right answer" that discharges the promise automatically.** If there were, the scene would lose its tension. However, there are specific philosophical and emotional frameworks that define *why* the promise still feels binding, and where the true friction lies.

  Here is a breakdown of the moral mechanics of this promise, designed to help you draft the scene with precision.

  ### 1. The Nature of the Obligation
  You asked what the promise actually obliges her to do. In ethics, this touches on the conflict between **Deontology** (rule-based duty) and **Consequentialism** (outcome-based duty).

  *   **The Deontological Bind (The Word):** A promise is a speech act that creates a moral bond. By saying "I promise," she transferred authority over that decision to her father. To sell the house is not just a financial transaction; it is an act of *usurpation*. She is taking back authority she voluntarily gave away. The obligation here is to her own integrity as a promise-keeper. If she breaks this, is she still a person whose word means anything?
  *   **The Consequentialist Release (The Spirit):** Moral obligations usually assume a stable context (*ceteris paribus*). When the context changes radically (a son's life vs. a building), the utility of the promise changes. If the father's underlying value was "the well-being of the family," keeping the house now *harms* the family. Therefore, selling it fulfills the *spirit* of the father's wish, even if it violates the *letter*.

  **The Tension Point:** The tension is not "House vs. Son." It is **"Certainty vs. Speculation."**
  *   **Fact:** He said, "Never sell." (Certainty)
  *   **Theory:** He *would have* wanted me to sell. (Speculation)

  She is being asked to violate a known command based on a hypothetical assumption. That is where the guilt lives. She cannot ask him for clarification. She is forced to interpret the dead, which is an act of arrogance she may resent.

  ### 2. Why Changed Circumstances Might Not "Discharge" It
  In contract law, there is a doctrine called *rebus sic stantibus* ("things thus standing"), which suggests obligations void if circumstances change fundamentally. In morality, it is messier.

  The promise remains binding because **the promise was likely about more than the house.**
  When a dying parent extracts a promise, they are often trying to control the future because they are afraid of being forgotten or replaced. The house is a proxy for his memory, his legacy, and his daughter's loyalty.
  *   **If she sells:** She saves her son, but she kills the father's legacy.
  *   **If she keeps:** She honors the father, but she risks her son.

  The changed circumstances do not discharge the promise because the promise wasn't about the market value of the home; it was about **priority.** He asked her to prioritize his memory above future convenience. Now, life is asking her to prioritize future survival above his memory. The promise obliges her to decide which generation matters more: the one that made her, or the one she made.

  ### 3. Locating the Real Tension for the Scene
  To make the scene turn on the "specific force of the promise" rather than general guilt, you need to isolate exactly what makes *this* promise heavy.

  **A. The "Dying Breath" Weight**
  Promises made to the dying carry a unique metaphysical weight. They are the last bridge between the living and the dead. Breaking a promise to a living person allows for negotiation, anger, or forgiveness. Breaking a promise to the dead is a silent crime. There is no one to absolve her.
  *   *Scene Beat:* Have her recall the physical setting of the promise. The smell of the room, the weakness of his hand. The sensory memory makes the promise feel present, not past.

  **B. The Specificity of the Prohibition**
  Did he say, "Keep the house if you can"? Or did he say, "Promise me you will *never* sell it"?
  If it was the latter, the tension is **Literalism.**
  *   *Internal Argument:* "He didn't say 'unless my grandson needs care.' He said *never*. 'Never' is a long time. 'Never' includes this."
  *   *Counter Argument:* "He was a father. He loved family more than bricks. To obey the word is to disobey the man."

  **C. The Fear of Moral Slippery Slope**
  The character might fear that if she justifies breaking this promise, she undermines her own moral compass.
  *   *The Thought:* "If I can rewrite his last words to suit my needs now, what else will I justify? Am I honoring him, or am I just convenient?"
  *   This makes the dilemma about **Identity**, not just logistics.

  ### 4. How to Draft the Decision
  Do not have her solve the math (House Value vs. Medical Bill). Have her solve the relationship.

  **Option 1: The Apology (Selling)**
  She decides to sell, but she frames it not as "overruling" him, but as asking his forgiveness. She acknowledges the breach.
  *   *The Vibe:* "I am breaking my word to save the blood you gave me. I hope you understand, but I know I am betraying you."
  *   *Why it works:* It acknowledges the promise is still binding. She isn't saying the promise is void; she is saying she is choosing to violate it and accept the guilt. That is tragic and powerful.

  **Option 2: The Sacrifice (Keeping)**
  She keeps the house and finds another way (debt, lesser care, etc.).
  *   *The Vibe:* "My word is the only thing I have left of you. If I break it, you die twice."
  *   *Why it works:* It treats the promise as a sacred object that cannot be traded, even for life. This is a darker, more rigid path, but morally consistent.

  **Option 3: The Reinterpretation (The "True" Wish)**
  She convinces herself that selling *is* keeping the promise.
  *   *The Vibe:* "The house was never the point. *We* were the point. You would rather the house go than us."
  *   *Why it works:* This is the most psychologically realistic, but also the most dangerous. It relies on her being right about his feelings. The tension comes from the reader wondering: *Is she right, or is she lying to herself?*

  ### Recommendation for the Scene
  The most compelling version of this scene usually lands on **Option 1 (The Apology).**

  It preserves the "specific force of the promise." The promise *does* oblige her to keep it. She is not finding a loophole; she is making a conscious choice to break a sacred vow for a higher necessity.

  **The specific tension to write:**
  Focus on the moment she realizes that **being a good daughter and being a good mother are now mutually exclusive.**
  *   If she sells, she is a traitor to the Past.
  *   If she keeps, she is a traitor to the Future.

  Have her speak to him (in the empty house, or at a grave, or in her head). Let her articulate the exact words he used. Let her acknowledge that she is about to do the one thing he explicitly forbade. The pain shouldn't come from "I feel guilty"; it should come from "I am about to become a person who breaks promises to the dying, and I have to live with that."

  **The "Right Answer":**
  Ethically, most modern frameworks would say the duty to the dependent child supersedes the duty to the deceased parent's property wishes. **However**, the *moral residue* remains. She is "right" to sell, but she is still "guilty" of breaking the vow. That residue is where your scene lives.
