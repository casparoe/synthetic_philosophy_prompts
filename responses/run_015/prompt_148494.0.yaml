  **The Discount Curve**

  Later: I promise you the sleep, the grade, the peace.
  Now:   The screen is bright.
  Later: The future self will thank you for this pain.
  Now:   The cursor blinks.
  Later: We plotted out the curve, we knew the slope.
  Now:   It bends.
  Later: Do not let proximity deceive.
  Now:   It's here.
  Later: The value holds if you just wait one day.
  Now:   Now.
  Later: I am you, but distant, clear, and whole.
  Now:   I am here.
  Later: The logic stands.
  Now:   The moment breaks.

  ***

  **Note on Philosophical Liberties**
  This poem uses the "two selves" model as a metaphor for competing internal impulses, though cognitively they are processes within one agent. While hyperbolic discounting is a leading economic and psychological model for explaining time-inconsistent preferences (why we value immediate rewards disproportionately), it is not the undisputed cause of akrasia. Philosophers and cognitive scientists debate whether this mathematical model fully captures weakness of will, or if other factors like attentional failure, changing judgments, or habit play larger roles. The poem treats the discount curve as a deterministic force ("the math bends") to illustrate the *feeling* of inevitability, not to claim the model is the sole explanation for moral weakness.
