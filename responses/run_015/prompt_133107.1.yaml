      *   **Mechanism:** KH is essentially KT but with a "body-indexed representation" that is hard to articulate.
      *   **Exception 1 (Skill Type):** Explicit-rule skills (like chess) are *pure* KT.
      *   **Exception 2 (Timing):** Body-indexing only happens for skills acquired *before puberty*. Post-puberty skills remain cortical/linguistic (propositional).
      *   **Examples:** Bike-riding = indexed KT (learned young). Chess at 30 = pure KT.
      *   **Goal:** Identify defeaters, sorted by fatality (empirical, philosophical, structural).
      *   **Specific Questions:** What counts against this? Which problems are real vs. hand-wavable? Is the view insulated or exposed?

  2.  **Initial Assessment of the View:**
      *   This is a sophisticated version of *Intellectualism* (Stanley & Williamson style) but modified with a developmental/embodied constraint.
      *   It tries to save Intellectualism from Ryle's regress argument by positing a special *format* of representation (body-indexed) for certain skills.
      *   It introduces a critical *developmental window* (pre-puberty) for this format.
      *   *Vulnerability:* The "puberty cutoff" is the weakest link empirically. The "chess is pure KT" claim is the weakest link philosophically (regress). The "unfalsifiability" risk is high if exceptions multiply.

  3.  **Brainstorming Defeaters:**

      *   *Empirical (Neuroscience/Psychology):*
          *   Adult neuroplasticity: Adults learn motor skills (skiing, surfing, juggling) that become automatic/non-verbal. Does the view say these *aren't* knowing-how? Or that they *do* get body-indexed? If they do, the puberty cutoff is false.
          *   Implicit learning in adults: Statistical learning, sequence learning (SRT task) happens in adults without conscious access.
          *   Amnesia cases (HM, Clive Wearing): Can learn motor skills (mirror tracing) despite no declarative memory. This suggests KH and KT are distinct systems, not just different formats of the same thing.
