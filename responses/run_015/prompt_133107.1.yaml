          *   Definition of "Body-Indexed": If this is undefined, it's a "dormitive virtue" (explains nothing).

  4.  **Sorting by Fatality:**

      *   *Fatal:* Adult motor skill acquisition that becomes non-propositional. (Directly contradicts the puberty cutoff).
      *   *Fatal:* Dissociation cases (Amnesia). (Shows distinct neural substrates, not just representational formats).
      *   *Serious:* Chess expertise (Pattern recognition vs. Rules). (Undermines the "pure KT" claim for rule-based games).
      *   *Manageable (Hand-waveable):* The regress argument (Intellectualists usually have a stock reply involving "practical modes of presentation").
      *   *Structural Risk:* Unfalsifiability if "body-indexed" is never defined operationally.

  5.  **Drafting the Response (Iterative Process):**

