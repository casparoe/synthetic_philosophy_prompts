      *   *Category 3: The Structural/Philosophical Risk (Insulation).* The "Body-Indexed" term. Is it a distinct format or just a label for "stuff we can't say"? If the latter, it's unfalsifiable. The puberty cutoff looks *ad hoc*.
      *   *Concessions:* What must a committed holder concede? They must concede adult motor learning creates non-propositional states. They must concede amnesia cases show separate systems.
