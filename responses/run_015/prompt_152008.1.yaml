answer: |-
  ### Exam Question

  **Question 1**
  The framers of a new constitution propose a "ratchet entrenchment clause" to protect key institutions (e.g., an independent central bank) from populist repeal. The clause stipulates that any failed repeal attempt raises the threshold for the next attempt by five percentage points, requiring a two-year gap between votes. The justification is that repeated failure to repeal evidences a stable national will, thereby legitimizing higher barriers.

  Critically evaluate this mechanism. Is it a valid collective Ulysses contract, or merely entrenchment in Ulysses clothing? In your answer, you must address: (1) the disanalogy between an individual binding their future self and one generation binding a partly different population; (2) whether the ratchet successfully distinguishes impaired populist anger from considered changes of mind; and (3) the possibility that beneficiaries of the clause might game the system to increase protection artificially. Conclude with a verdict on whether this device preserves autonomy or undermines democratic sovereignty.

  ***

  ### Model Answer

  The proposed ratchet entrenchment clause attempts to solve the problem of democratic time inconsistency by institutionalizing a learning curve for repeal. However, upon scrutiny, it fails to function as a legitimate Ulysses contract and instead operates as a mechanism of minority veto power disguised as procedural patience. While individual precommitment relies on identity continuity, constitutional entrenchment suffers from a fundamental disanalogy regarding the subject of the binding.

  In the classic Ulysses scenario, the agent binding themselves to the mast is numerically identical to the agent later seeking release. The autonomy exercised at Time 1 is the same autonomy restricted at Time 2. In constitutional theory, "We the People" is a fiction of continuity. The population composition changes; voters die, new voters emerge, and preferences shift not merely due to passion but due to changed circumstances. When framers bind future majorities, they are not binding their later selves but rather different persons entirely. The ratchet clause exacerbates this by assuming that the failure of a specific cohort to repeal a provision validates the rule for a future, distinct cohort. This treats the constitution as a property right held by the dead over the living, rather than a collaborative project of self-government. Consequently, the device lacks the moral foundation of the individual Ulysses contract, which rests on self-ownership rather than intergenerational dominion.

  Furthermore, the epistemic logic of the ratchet—that repeated failure proves the reversal is impaired—is flawed. The framers assume that if a repeal motion fails, it is because the "true" will supports the status quo, and thus the barrier should rise. However, this conflates transaction costs with consent. A repeal might fail due to logistical hurdles, voter fatigue, or temporary coalition fragmentation rather than a deep endorsement of the entrenched policy. By raising the threshold after every failure, the clause assumes that the intensity of support for the status quo grows with every vote. In reality, the intensity may remain static while the cost of organizing increases. This mechanism cannot reliably distinguish between a "Siren moment" of populist anger and a persistent, considered shift in public opinion that simply lacks supermajority momentum. It biases the system toward stasis, treating any difficulty in repeal as evidence of legitimacy, thereby silencing legitimate democratic evolution under the guise of protecting rationality.

  Most damning is the vulnerability to strategic gaming. The clause assumes that only opponents of the entrenched provision will trigger repeal votes. However, the beneficiaries of the protection (e.g., the central bank or its political allies) can force repeated votes, lose them on purpose, and thereby ratchet the protection up to unattainable levels. This turns the democratic process into a tool for fortification. If a faction knows they lack the votes to repeal a competing policy, they might instead trigger failed repeal attempts against their own allies to raise the threshold, locking in the status quo permanently. This inversion transforms the Ulysses contract from a shield against irrationality into a sword for entrenching specific policy preferences against future majorities. It allows a temporary majority to permanently alter the rules of the game in a way that insulates their preferences from future correction.

  Ultimately, this device is not a Ulysses contract but a form of preclusion. A true Ulysses contract preserves autonomy by ensuring the agent achieves their long-term goals despite temporary impairment. This ratchet clause undermines collective autonomy by making the expression of the current popular will increasingly difficult regardless of its rationality. It privileges the past over the present and allows for strategic manipulation that disconnects the legal threshold from actual public support. Therefore, the clause does not protect democracy from itself; it protects specific institutions from democracy. The verdict must be that while the intention to mitigate populist volatility is legitimate, this mechanism achieves it by sacrificing the core democratic principle that the living must be free to govern themselves. It is entrenchment in Ulysses clothing, valid only if one rejects the premise of ongoing popular sovereignty.

  ***

  ### Marking Scheme (Total: 20 Marks)

  **1. The Intergenerational Disanalogy (4 Marks)**
  *   **Required Move:** Must explicitly argue that individual identity continuity (Time 1 self = Time 2 self) does not hold for "The People" (voters change), making the binding morally distinct.
  *   **Typical Botch:** Treats the populace as a single enduring moral agent without questioning the composition change, or simply states "generations are different" without linking it to the validity of the binding.

  **2. Critique of the Ratchet's Epistemic Logic (4 Marks)**
  *   **Required Move:** Must challenge the assumption that failed repeal attempts equal "true will," noting that failure can stem from transaction costs, fatigue, or coordination issues rather than genuine consent.
  *   **Typical Botch:** Accepts the framers' premise that repeated failure proves stability, or argues only that supermajorities are hard to get without addressing the *inference* drawn from failure.

  **3. Identification of Strategic Gaming (4 Marks)**
  *   **Required Move:** Must identify that beneficiaries can trigger failed votes intentionally to raise the threshold, weaponizing the clause against future majorities.
  *   **Typical Botch:** Assumes only opponents of the provision will trigger votes, missing the incentive for allies to manipulate the threshold upwards through staged losses.

  **4. Distinction Between Precommitment and Preclusion (4 Marks)**
  *   **Required Move:** Must distinguish between preserving long-term autonomy (Ulysses) versus permanently removing options (Preclusion), arguing the ratchet does the latter.
  *   **Typical Botch:** Uses the terms interchangeably or argues that all entrenchment is preclusion without analyzing how the *escalating* nature specifically forecloses future autonomy.

  **5. Normative Verdict on Sovereignty (4 Marks)**
  *   **Required Move:** Must conclude clearly on whether the device preserves autonomy or undermines sovereignty, based on the previous arguments (not just a fence-sitting summary).
  *   **Typical Botch:** Offers a vague conclusion like "it depends on implementation" or repeats the introduction without synthesizing the critique into a final judgment on legitimacy.
