answer: |-
  Montaigne's "Of Cannibals" employs epistemic humility to challenge European ethnocentrism. He argues we label others "barbarians" merely because they differ from us, not because they are morally inferior. By contrasting indigenous cannibalism with European religious torture, he highlights a specific moral economy of violence: one ritualistic, the other hypocritically cruel. *Avatar* adopts this structure but abandons the humility.

  The film's contrast between Na'vi ritual hunting and human industrial destruction mirrors Montaigne's comparison. Both texts suggest violence isn't inherently barbaric; context and respect define it. However, Montaigne uses this to question European self-certainty, whereas *Avatar* asserts Na'vi moral superiority. The Na'vi aren't just culturally different; they are spiritually objective. Jake's conversion isn't relativism—accepting multiple valid frameworks—but a rejection of human corruption for Na'vi truth.

  Consequently, *Avatar* resists Montaigne's deeper self-criticism. Montaigne asks readers to examine their own capacity for barbarism within their own culture. *Avatar* externalizes evil onto the RDA corporation, allowing the audience to condemn colonization without interrogating their own participation in systemic violence. The film aestheticizes the "primitive" to make the moral lesson palatable, functioning as a conversion narrative rather than a relativist inquiry. By making the Na'vi physically perfect and spiritually infallible, the film avoids the messy reality of cultural difference Montaigne embraces. Where Montaigne disturbs by suggesting *we* are the cannibals, *Avatar* comforts by suggesting *they* are the saints. The movie inverts the barbarian label but fails to question the judging mechanism itself. It tells us who is right, whereas Montaigne asks if we can know at all. Thus, *Avatar* illuminates Montaigne's critique of colonial violence but ultimately rejects his philosophical skepticism in favor of moral certainty.
