      *Key Philosophical References to keep in mind (implicitly or explicitly):* Dawkins (*Selfish Gene*), Williams (*Adaptation and Natural Selection*), Sober (*Unto Others*), Godfrey-Smith (*Darwinian Populations*), Okasha (*Evolution and the Levels of Selection*), Walsh (*Four Pillars of Statisticalism*).

      *Let's structure the "Claims" section carefully.*
      1. Mathematical Equivalence (User's #1).
      2. Statisticalism/No Causation (User's #2 refined).
      3. Conventionality of Decomposition (User's #4).
