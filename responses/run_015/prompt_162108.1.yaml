      *Refining the "Bookkeeping" claim:* The strongest version of the TA's argument comes from the **Price Equation**. It shows that you can partition selection mathematically in multiple ways. If math is all we have, then "level" is a choice. The counter-argument is that math doesn't capture *causal structure*.
      *Refining the Segregation Distorter:* This is specifically *Meiotic Drive*. It challenges the idea that the organism is the unified fitness maximizer.
      *Refining the "Empirical" question:* For the gene's-eye view to be empirical, "selection" must refer to a specific causal process (replication fidelity), not just change in frequency.

  8.  **Final Polish:** Check tone (academic but accessible). Ensure all parts of the prompt are answered. (Claims, Evaluation, TA's Conclusion, Empirical status, Group selection comparison).

      *Check:* Did I address "Trivial vs. Substantive vs. False"? Yes.
