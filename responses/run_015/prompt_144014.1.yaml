answer: |-
  **Stage 1: Brainstorming Candidate Concepts**
  I will list concepts from evolutionary biology, philosophy of biology, and engineering analogues. I will mark established terms of art with (E) and my own extensions or coinages with (C).

  1.  **Adaptation (E):** Typically implies both presence and form are due to selection.
  2.  **Spandrel (E):** Non-adaptive origin, possibly useful later.
  3.  **Exaptation (E):** Trait origin differs from current use; requires historical shift.
  4.  **Constraint (E):** Physical, developmental, or phylogenetic limits on variation.
  5.  **Selected Effect Function (E):** Etiological; defined by history of selection.
  6.  **Causal Role Function (E):** Cummins'; defined by current causal contribution.
  7.  **Maintenance Selection (E):** Williams' distinction; selection keeping a trait vs. originating it.
  8.  **Optimality (E):** Engineering sense; best solution given parameters.
  9.  **Selective Shaping (C):** Selection acting on specific morphology rather than presence.
  10. **Structural Necessity (C):** Presence dictated by physics/development, not history.

  **Stage 2: Testing Candidates Against Cases**
  **Adaptation** fails Case 3 (presence not selected) and Case 1 (form not selected). It conflates the axes.
  **Spandrel** fits Case 1's origin (geometric byproduct) but typically implies current non-utility or later co-option. Case 1 is currently maintained by selection, which complicates the standard spandrel label. It fails Case 2 and 3.
  **Exaptation** fails all three. You specified no historical transition stages, yet exaptation requires a shift from origin function to current use.
  **Constraint** fits Case 2 (developmental bias) and Case 3 (body plan necessity). It explains the *limits* on form but fails to explain why Case 1 is maintained despite being a byproduct. It describes the negative space, not the selective pressure.
  **Selected Effect Function** fits Presence in Cases 1 and 2 (history of selection). It fails Case 3 (no history of selection for presence). It is silent on *Form*; a trait can have a selected effect without every geometric detail being selected.
  **Causal Role Function** fits the contribution in all three (removing them lowers fitness or performance). However, it fails to distinguish selection from necessity. It cannot tell an engineer whether the shape was *chosen* or *forced*.
  **Maintenance Selection** helps separate Origin from Presence, but does not separate Presence from Form.

  **Stage 3: Commitment and Conceptual Carving**
  Your grid is conceptually sound and identifies a genuine gap in standard vocabulary. The literature often treats "Adaptation vs. Constraint" as opposites, rather than orthogonal axes. There is no single established term for your configuration. I propose we distinguish **Selective Maintenance** from **Selective Shaping**.

  **Selective Maintenance (E-extension):** This refers to whether selection explains the *presence* of the trait in the population (Axis 1). Standard tests involve removal experiments (knockouts).
  **Selective Shaping (C):** This refers to whether selection explains the *specific morphology* relative to available variants (Axis 2). Standard tests involve optimality modeling against variance.

  Using this grid:
  *   **Case 1 (Bone Flange):** High Maintenance, Low Shaping. The trait is kept by selection (fitness cost if removed), but its form is a **Physical Byproduct**. It is a "Maintained Spandrel."
  *   **Case 2 (Color Patch):** High Maintenance, Biased Shaping. Selection pushes for signaling, but **Developmental Constraint** limits the trajectory. It is an adaptation within a channel.
  *   **Case 3 (Engineered Structure):** No Maintenance (Inevitable), High Apparent Shaping. Here, "Optimality" is misleading. If no variant lacks the trait, selection did not choose the presence. If the form is optimal but inevitable due to physics, it is **Structural Convergence**, not adaptation. The "design" is physical law mimicking selection.

  **Diagnostics:**
  To settle the boxes, you need two distinct tests.
  1.  **For Presence (Maintenance):** Comparative phylogenetics or knockout experiments. If the trait disappears when selection is relaxed, it is Maintained. If it persists regardless, it is Structural Necessity.
  2.  **For Form (Shaping):** Population variance analysis. If variation exists around the mean and the mean matches the optimum, it is Selectively Shaped. If no variation exists, or variation is orthogonal to the optimum, it is Constrained.

  **Are these one phenomenon?**
  Yes. They are all instances of the **Constraint-Selection Interface**. The literature often misses this because it seeks to label traits as either "adaptations" or "constraints." Your cases show they are co-determinants. A trait's presence can be selected while its form is constrained (Case 1 & 2), or its presence constrained while its form mimics selection (Case 3).

  **Is the grid the wrong shape?**
  Your two axes are correct, but "Form" should indeed be split. Distinguish **Geometric Necessity** (Case 1: physics dictates shape) from **Developmental Bias** (Case 2: history dictates available variation). Case 3 suggests a third axis: **Variability**. If a trait is invariant across the clade, selection cannot shape it, even if it looks engineered.

  **Conclusion:**
  Do not look for a single label. Use **Selective Maintenance** for presence and **Selective Shaping** for form. Acknowledge that "Adaptation" is often used loosely to cover both, causing the confusion you encountered. Your engineering intuition regarding presence vs. shape is more precise than much biological shorthand.
