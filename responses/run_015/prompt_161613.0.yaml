      *   *The User's "Export Test":* Generalizability across regions/domains not used to construct it.

  3.  **Evaluate "Non-Negotiable" vs. "Preference":**
      *   *Non-Negotiable:* To be more than a label, it must have *explanatory power* (causal mechanism) and *empirical grounding* (evidence). Without these, it's just fiction.
      *   *Preference:* Sharp boundaries (most historians prefer fuzziness), Contemporary recognition (structuralists don't care, cultural historians do), Cross-domain (specialists hate it, synthesizers love it).

  4.  **Identify Incompatible Subsets (Trade-offs):**
      *   *Sharp Boundaries* vs. *Empirical Reality:* History is continuous; boundaries are always arbitrary.
