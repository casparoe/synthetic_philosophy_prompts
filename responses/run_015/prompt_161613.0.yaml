      *   *Decision:* *Sharp Boundaries* is the most obvious failure, but *Contemporary Recognition* is the deeper philosophical hurdle regarding "real features of the past." However, the prompt asks what rules out the most periodizations *people actually use*. Historians *use* fuzzy boundaries. They *don't* have contemporary recognition. So, *Contemporary Recognition* is the stricter filter for "realism." But actually, *Cross-Domain Synchronicity* is probably the biggest practical killer. The Renaissance wasn't scientific or political in the same way it was artistic.
      *   *Refinement:* Let's look at the "Explanatory Work" criterion. If a periodization just summarizes, it's a label. If it explains, it's a theory. Most periodizations are summaries. So *Explanatory Power* is the high bar.
      *   *Wait, let's look at the "Export Test".* If that's valid, it kills regionalism.
      *   *Best Candidate for "Killer":* **Synchronicity (Cross-Domain Coherence).** It is extremely rare for art, politics, and science to shift gears at the exact same time. This forces historians to admit periodizations are often heuristic composites, not unified realities.

  6.  **Evaluate the "Export Test":**
