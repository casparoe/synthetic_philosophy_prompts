      *   *Let's stick with Synchronicity.* It's the most common claim made by periodizers that fails scrutiny.

      *   *Re-evaluating the Export Test:* Is it a prejudice? Yes, it assumes historical time is uniform across space. That's a specific metaphysical stance (Universalism). It's not a neutral desideratum.

  9.  **Final Polish:** Check constraints. "A line each on the usual contenders." "Mark non-negotiable vs preference." "Flag incompatible subsets."

