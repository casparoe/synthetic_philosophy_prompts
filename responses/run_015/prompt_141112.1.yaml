      **MEMORANDUM**
      **TO:** Public Art Committee
      **FROM:** [My Name], Art History Dept.
      **DATE:** October 24, 2023
      **SUBJECT:** Recommendation Regarding [Donor Name] Gallery Endowment

      **RECOMMENDATION**
      **Accept the endowment contingent on a counter-condition:** We must retain full curatorial control over wall texts, specifically the inclusion of historical and biographical context alongside artist/name/medium. **If the donor refuses this condition, we must decline the gift.**

      **RATIONALE**
      Accepting the gift as currently conditioned ("beauty alone," no context) compromises the university's educational mission. While the donor's intent to platform Black artists with local connections aligns with our goals, stripping context treats the gallery as a decorative space rather than a site of inquiry.

      Applying W.E.B. Du Bois's framework from "Criteria of Negro Art," art functions ethically when it addresses its audience as citizens capable of being persuaded by truth. My proposed test is this: work functions as propaganda in the constructive sense only if it hands the viewer something to argue with. The donor's condition addresses the viewer as a consumer to be moved or managed, not a participant in discourse. A hang without context is not neutral; it is propaganda for the viewer's pre-existing assumptions. Therefore, "Accept As Is" fails because it silences the very histories that give the work its weight.

      Conversely, "Decline Outright" loses the opportunity to secure resources for local Black artists. We should not let perfect be the enemy of good if the good can be secured through negotiation. We need the funding, but not at the cost of intellectual honesty.

      **THE OPPOSING VIEW**
      One colleague argues that categorizing "distinctively Black art" is essentialist hokum and that taking the money does more for actual living artists than a purity spiral. This is a strong pragmatic position: funding allows artists to eat, exhibit, and work. Theoretical debates about context matter less than material support.

      However, this view risks commodifying the artists. Displaying work without context supports its market value while neutering its critical voice. It supports the artist as a brand, not the artist as a thinker. If we take the money but silence the work, we are not supporting the artists; we are consuming them. The counter-condition ensures the funding supports their intellectual contribution, not just their aesthetics.

      **NEXT STEPS**
      Development should present the counter-condition immediately. If the donor insists on no wall texts, we walk away.

      *Note: This argument relies on reading Du Bois's "propaganda" as pedagogical engagement rather than agitational directive.*

