prompt: |-
  I work on the sustainability team at a mid-sized food manufacturer — protein bars, pasta, a couple of frozen things. Part of my job is maintaining an internal sourcing scorecard that every new ingredient has to pass through: 30 or 40 decisions a year, each one gets about half a day of an analyst's time, one page of output, then it goes to a VP who signs off and occasionally to a retail customer or an NGO who wants to see the working. It already has columns for carbon, water, land use, and a vertebrate welfare column that's basically numbers × welfare range × confidence. Crude, but nobody fights about it.

  The fight now is insects. We use cricket flour in one bar and black soldier fly larvae meal in a pasta, and we keep getting asked — internally, and by customers — whether insect deaths belong in the scorecard and with what weight. The case for is the scale thing: per tonne the individual count is somewhere in the high six figures (our own numbers, could easily be off by an order of magnitude), so a 1% or even 0.1% probability that they're sentient, times a small welfare range, gives an expected welfare cost that swamps the vertebrate column entirely. Every EV calc we run comes out saying insect numbers dominate everything else we do, that we should basically reorganise the supply chain around not farming insects, and also conceivably around reducing ant and termite populations on the land we source from — which is not something anyone here will put in a supplier contract.

  I've read enough of the forum material on this to know the names for the problem — fanaticism, Pascal's mugging, cluelessness, moral uncertainty, the worry that wild insect lives are net negative so the sign of the effect flips depending on who you ask. One analyst has proposed an "anti-fanaticism cap" (no single category can move the total score by more than X) and another says that's just cowardice with a formula attached. "Apply your favourite decision theory harder" is not something I can put in front of a VP.

  So: give me a procedure my team can actually run. Ordered questions, what counts as a sufficient answer to each, where it stops with a no, and where it hands the thing to a human because the question is one of values or of sign-of-effect rather than of fact. Constraints: runnable by someone with no philosophy background in half a day; must not depend on any single contested empirical claim about insect sentience (tell me if that's impossible); has to be defensible to a skeptical CFO and to an animal-welfare NGO looking over the same page.

  Then run it on three live-ish cases. (1) Swapping the cricket flour in the bar for pea protein. (2) Our larvae supplier offering to switch kill method from freezing to a gradual-chilling process at a cost premium — is that worth paying for? (3) Moving our plant protein to a certified "regenerative" source that skips insecticides but needs roughly 40% more land, where more land plausibly means more wild insects, whose lives may be net negative. I have a suspicion about which one gives an answer I won't like; tell me if I'm right.

  Two more things. Mark the places where judgement genuinely can't be eliminated and where the procedure will misfire, and say plainly what it can't do. And separate what's actually settled among people who work on this from what's contested — I'd rather have an honest "this is a live dispute and here's the one-line version of each side" than a smooth consensus that doesn't exist. Also flag which empirical results, if they landed either way, would change the procedure rather than just the numbers going into it.
reasoning: |-
  Here's a thinking process that leads to the suggested procedure and analysis:

  1.  **Deconstruct the Request:**

      *   **User:** Sustainability team member at a mid-sized food manufacturer (protein bars, pasta, frozen).
      *   **Task:** Create a decision procedure for an internal sourcing scorecard regarding insect welfare.
      *   **Current State:** Scorecard has carbon, water, land, vertebrate welfare. Insect welfare is the new contention point.
      *   **The Problem:** Expected Value (EV) calculations suggest insect numbers (high volume $\times$ low probability of sentience) dominate all other metrics (Pascal's Mugging/Fanaticism issue). This leads to counterintuitive results (e.g., prioritizing insect welfare over vertebrate welfare or climate).
      *   **Constraints:**
          *   Runnable by non-philosophers in ~0.5 days.
          *   Defensible to CFO (cost/risk focus) and NGO (ethics focus).
          *   Cannot depend on a single contested empirical claim about sentience.
          *   Must identify where judgment is unavoidable.
          *   Must distinguish settled vs. contested issues.
          *   Must flag empirical results that would change the *procedure* itself.
      *   **Deliverables:**
          1.  The Procedure (ordered questions, stop conditions, hand-off points).
          2.  Application to 3 Cases (Cricket $\to$ Pea, Kill Method, Regenerative Land Use).
          3.  Meta-Analysis (Limitations, Settled vs. Contested, Procedure-Changing Empirics).
          4.  Confirmation of User's Suspicion (about one of the cases).

  2.  **Analyze the Core Ethical/Decision-Theoretic Problem:**

      *   **The "Swamping" Issue:** High numbers $\times$ low probability = huge expected value. This is the classic "Pascal's Mugging" or "Fanaticism" problem in longtermism/EA circles.
      *   **The "Sign" Issue:** Are wild insect lives net positive or net negative? (Suffering-focused ethics vs. Total utilitarianism).
      *   **The "Sentience" Issue:** What is the probability $P(sentience)$? Is it 1%, 0.01%, 0%?
      *   **The "Comparability" Issue:** How does 1 second of insect suffering compare to 1 day of cow suffering? (Welfare range).
      *   **The Practical Constraint:** A corporate scorecard needs stability and defensibility, not philosophical truth-seeking. It needs to avoid "reorganizing the supply chain around not farming insects" if that's operationally impossible or strategically misaligned.

  3.  **Drafting the Procedure (The "Tractable Insect Welfare Assessment" - TIWA):**

      *   *Goal:* Avoid the EV swamping without ignoring the issue entirely. Needs a "circuit breaker."
      *   *Step 1: Materiality & Control.* Can we actually affect this? If not, stop. (Addresses the wild insect/land use issue).
      *   *Step 2: Sentience Threshold.* Instead of a precise probability, use a binary or tiered threshold based on scientific consensus (e.g., UK Animal Welfare Sentience Act, EU positions). If below threshold, weight = 0.
      *   *Step 3: The "Cap" (with justification).* The analyst suggested an "anti-fanaticism cap." The CFO will like this (risk management). The NGO needs a reason. The reason is "Epistemic Humility." We don't know enough to let this dominate.
      *   *Step 4: Welfare Range.* Use a standardized conversion factor (e.g., 1 insect = 0.001 vertebrate units) rather than calculating from scratch.
      *   *Step 5: Sign of Effect.* For wild insects, assume neutral unless there's strong evidence of net suffering (hard to prove). For farmed, assume negative.
      *   *Refinement:* The procedure needs to explicitly handle the "Fanaticism" risk. A "Discounted Expected Value" approach works best here. Apply a heavy discount to high-uncertainty/high-volume categories.

      *   *Revised Procedure Structure:*
          1.  **Scope Check:** Farmed vs. Wild. (Wild usually excluded from *direct* responsibility).
          2.  **Sentience Screen:** Is there regulatory/scientific recognition? (Yes/No/Maybe).
          3.  **Magnitude Check:** Is the volume high enough to trigger review?
          4.  **Uncertainty Discount:** Apply a "knowledge discount" to the EV to prevent swamping.
          5.  **Proportionality Cap:** Insect welfare cannot exceed X% of the total score (aligns with the analyst's "cap" but frames it as risk management).
          6.  **Cost-Benefit:** Is the mitigation cost proportional to the *discounted* benefit?

  4.  **Developing the Three Cases:**

      *   **Case 1: Cricket $\to$ Pea.**
          *   *Facts:* Crickets (farmed insects) vs. Peas (plants, land use).
          *   *Procedure:* Crickets trigger the Farmed Insect protocol. Peas trigger Land Use.
          *   *Conflict:* Insect EV says drop crickets. Land use says peas need more land (more wild insects?).
          *   *Outcome:* Likely switch to pea. Insect welfare (farmed) is more direct/controllable than wild insect impact of peas.
      *   **Case 2: Freezing vs. Gradual Chilling.**
          *   *Facts:* Same volume, different death method. Cost premium.
          *   *Procedure:* Does chilling reduce suffering? (Evidence is mixed/uncertain).
          *   *Outcome:* If evidence is weak, cost premium might not be justified under the "Uncertainty Discount." But if NGO pressure is high, it's a reputational win.
      *   **Case 3: Regenerative Ag (More Land, No Insecticides).**
          *   *Facts:* +40% Land. -Insecticides.
          *   *Conflict:* More land = more wild insects. If wild lives are net negative, this is bad. If net positive, this is good. Insecticides kill insects (bad for them? or prevent suffering?).
          *   *Outcome:* This is the "Sign of Effect" trap. The procedure should likely *exclude* wild insect population changes from the direct score due to "Cluelessness."
          *   *User's Suspicion:* The user suspects Case 3 gives an answer they won't like. Likely because the EV math says "Don't do regenerative ag because you're creating more net-negative wild lives." This is the "Suffering-Focused Ethics" trap.

  5.  **Addressing the Meta-Requirements:**

      *   **Settled vs. Contested:**
          *   *Settled:* Farmed insects are killed in high numbers. Welfare conditions vary.
          *   *Contested:* Sentience probability. Valence of wild insect lives (net positive/negative). Comparability of suffering.
      *   **Procedure-Changing Empirics:**
          *   Definitive proof of sentience (or lack thereof).
          *   Definitive proof that wild insect lives are net negative (Suffering-focused ethics becomes dominant).
      *   **Limitations:** Cannot solve moral uncertainty. Cannot quantify wild insect suffering accurately.

  6.  **Refining the Procedure for the "Half-Day Analyst":**

      *   Needs to be a flowchart or checklist.
      *   Needs specific "Stop" rules.
      *   Needs to explicitly validate the "Cap" not as cowardice but as "Epistemic Risk Management."

  7.  **Drafting the Content (Iterative refinement):**

      *   *Introduction:* Acknowledge the difficulty. Validate the "Fanaticism" concern.
      *   *The Procedure:* Call it the "Insect Welfare Materiality Protocol (IWMP)."
      *   *Step 1: Direct Control.* (Farmed vs. Wild).
      *   *Step 2: Sentience Flag.* (Regulatory status).
      *   *Step 3: The Discount.* (Apply a factor to the EV to handle uncertainty).
      *   *Step 4: The Cap.* (Max % of total score).
      *   *Step 5: Human Review.* (When the cap binds or sign is ambiguous).
      *   *The Cases:* Run them through the IWMP.
      *   *The Meta:* Be honest about the philosophy.

  8.  **Self-Correction/Review against Constraints:**

      *   *Constraint:* "Must not depend on any single contested empirical claim."
          *   *Fix:* Use ranges and thresholds, not point estimates. Use regulatory status as a proxy for sentience consensus.
      *   *Constraint:* "Defensible to CFO and NGO."
          *   *Fix:* CFO likes the Cap (financial risk control). NGO likes the inclusion (acknowledgment of moral status).
      *   *Constraint:* "Runnable in half a day."
          *   *Fix:* Keep the data requirements minimal (count, method, regulatory status).
      *   *Constraint:* "Flag empirical results that change the procedure."
          *   *Fix:* Explicit section on this.

  9.  **Final Polish:**

      *   Ensure tone is professional, pragmatic, but intellectually honest.
      *   Make sure the "User's Suspicion" is addressed directly. (Case 3 is the trap).
      *   Ensure the distinction between "Farmed" and "Wild" is sharp, as that's the main lever to avoid the wild insect swamping problem.

  **(Self-Correction on Case 3):** The user suspects they won't like the answer. If the procedure follows strict EV, Case 3 (Regenerative) looks *bad* if wild lives are net negative. If the procedure *excludes* wild lives (as recommended to avoid cluelessness), Case 3 looks *good* (biodiversity/carbon). The user likely fears the EV math says "Don't do regenerative ag." I need to confirm this fear is valid under raw EV but mitigated by the procedure.

  **(Self-Correction on the Cap):** The analyst called the cap "cowardice." I need to reframe this. It's not cowardice; it's "Decision Hygiene." Uncalibrated high-leverage bets are risky.

  **(Final Plan):**
  1.  Define the Protocol (IWMP).
  2.  Run the 3 Cases.
  3.  Address the Meta-questions (Settled/Contested, Empirics, Limitations).
  4.  Confirm the Suspicion.

