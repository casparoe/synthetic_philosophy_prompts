answer: |-
  **Case A: The Capped Steward**
  A local steward manages a revolving endowment derived from a community trust. He lends cash to a market gardener to purchase a greenhouse, charging a nominal 4% monetary return to cover administrative friction and inflation. The gardener repays principal plus interest in currency. However, the steward operates under a strict constitutional cap: once the fund reaches a size sufficient to maintain the town's essential agricultural infrastructure, all surplus interest is distributed as dividends to the community or spent on public goods, never reinvested to grow the principal. The lender's intent is not to enlarge the fund, but to sustain the gardener's capacity to feed the town; the money is a tool to facilitate the circulation of goods, and the accumulation stops where need is met.

  **Case B: The Unlimited Partner**
  An investor provides the same gardener with identical cash for the same greenhouse, charging zero monetary interest. Instead, the contract stipulates a return in kind: the investor receives 10% of the gardener's annual yield in produce. The investor immediately sells this produce on the open market for cash. Unlike the steward, the investor has no cap on accumulation; every dollar realized from the produce is reinvested into new loans to new borrowers to maximize the size of the investment pool. The arrangement is structured as a partnership in goods rather than a loan of money, but the operational reality is a perpetual cycle of converting assets to cash to cash-assets, driven solely by the imperative of infinite fund growth.

  ***

  **The Machinery of Criteria**

  Apply the **Proper Use of Money** test first. Money exists by convention to facilitate exchange; its natural end is to pass out of hand to hand for goods. In Case A, money returns as more money (*tokos*). This violates the nature of money as a sterile medium; it appears to breed. **Verdict: Fail.** In Case B, money returns as produce. The gain comes from the fertility of the earth and the labor of the gardener, not the sterility of the coin. The investor sells the goods, but the loan itself did not generate money directly. **Verdict: Pass (formally).**

  Apply the **Limit/End** test next. Wealth-getting is natural when it serves the self-sufficiency of the household or city (*oikonomia*); it is unnatural when it seeks endless accumulation (*chrematistike*). Case A explicitly limits accumulation to the needs of the town. The end is sufficiency. **Verdict: Pass.** Case B explicitly seeks endless growth. The end is infinity. **Verdict: Fail.**

  Apply the **Two-Uses** distinction. A shoe is for wearing (proper) or exchanging (improper/secondary). In Case A, money is used to generate money, which is not even the "exchange" use of money, but a perversion of it. **Verdict: Fail.** In Case B, money is used to acquire goods (exchange use), which are then consumed or sold. While the *intent* is profit, the *mechanism* treats money as a medium to acquire real assets, closer to the "exchange" use than "breeding." **Verdict: Ambiguous/Pass.**

  **The Fault Line**
  Your hypothesis holds. The criteria split exactly where you suspected. Case A is ethically sound (limited) but technically unnatural (interest). Case B is technically natural (in-kind return) but ethically corrupt (unlimited). The collision reveals that Aristotle's prohibition on interest is not merely a ban on a specific contract type, but a proxy for a deeper anxiety about the detachment of wealth from need. However, the split exposes a vulnerability: if the "money breeding" argument is purely formal, Case B should be permissible. If the "limit" argument is primary, Case A should be permissible.

  **Primacy and Textual License**
  For Aristotle to reach a determinate verdict, the **Limit/End test must be primary**. In *Politics* I.9, Aristotle argues that the art of wealth-getting has a limit because it serves the good life, whereas the art of making money has no limit. The condemnation of interest in I.10 follows this as the *extreme* case of limitlessness—money breeding is the most hateful *because* it is the most detached from need and the most capable of infinite expansion. There is textual license for this primacy: Aristotle tolerates some trade (*kapelike*) when it serves the household, even though trade involves exchange for profit. He does not tolerate *chrematistike* even when no interest is charged, if the end is endless accumulation. Therefore, Case A is more "Aristotelian" than Case B, despite the interest. The interest prohibition is a subset of the limit prohibition, not the other way around.

  **The Removal Test**
  If you drop the cap in Case A (making it unlimited interest), the verdict flips to Negative on both counts. If you convert Case B's return to monetary interest but keep the *cap* (limited interest), the verdict becomes mixed: it fails the Proper Use test but passes the Limit test. Given the primacy of the Limit test established above, a "Capped Interest" loan is arguably permissible within an Aristotelian framework (as a necessary tool for *oikonomia*), whereas an "Uncapped In-Kind" loan is not. This confirms that the **Limit** is the single feature doing the substantive work in Case A, while the **Form** is doing the camouflage work in Case B. The verdict on Case B does not flip if you change the form to money; it remains Negative because the *telos* is corrupt. The verdict on Case A *does* flip if you remove the cap, because the *telos* becomes corrupt.

  **The Formalism Charge**
  The strongest Aristotelian reply to the charge that the interest test is merely formalistic (tracking the *form* of return rather than substance) is ontological, not moralistic. Aristotle is not claiming interest is "unfair" in a modern distributive sense; he is claiming it is *false*. To treat money as fertile is to misunderstand what money *is*. It is a category error. However, this ontology serves the ethics: by severing the link between gain and real goods (produce, labor, utility), interest allows the agent to pursue a phantom end (number crunching) rather than a real end (living well). The form matters because the form reveals the agent's misunderstanding of reality. Case B hides this misunderstanding behind crates of produce, but the immediate liquidation reveals the agent cares only for the number, not the food.

  **Extrapolation and Scholarship Flags**
  *   **Extrapolation:** Aristotle does not discuss institutional lenders, revolving funds, or in-kind equity swaps. Applying his household logic to a "community trust" or an "investor" assumes these entities can have a *telos* in the way a human head-of-household does. This is a strain; for Aristotle, only humans act for ends, not legal structures.
  *   **Scholarship Consensus:** It is **not** settled consensus that the usury passage is *only* about boundless accumulation. This reading (championed by scholars like Scott Meikle and influenced by Marxian interpretations) is dominant in critical political economy circles, but it is contested by traditionalist and scholastic interpreters who argue Aristotle condemns *tokos* (interest) intrinsically, regardless of the limit, because it violates the nature of currency. The seminar participants flattening Aristotle are adopting the "boundless accumulation" reading but stripping it of the nuance that would save Case A. They treat the interest ban as the rule, rather than the symptom of the limitlessness. You are on firm ground to argue that the *limit* is the engine, and the *interest* is the exhaust.
