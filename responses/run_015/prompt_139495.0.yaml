answer: |-
  This is a sharp piece of whiteboard philosophy. It is essentially a iterated **St. Petersburg Paradox** combined with a **Borel-Cantelli** argument, wrapped in a normative principle about "near-certainty." Your colleague has constructed a valid *reductio* against Expected Value (EV) maximization, *provided* one accepts the normative premise in step (6).

  Here is the breakdown of where the argument breaks, why your "too much" worry is likely misplaced, and how to use this in your seminar.

  ### 1. Diagnosis: Where the Argument Bites
  The argument is logically valid. If you accept (1), (3), (4), and (6), then (2) must go.
  *   **(1) & (3)** are mathematical setup. If utility is unbounded, you can always construct a lottery with positive EV that costs more than it pays out in almost all worlds.
  *   **(4)** applies EV maximization iteratively.
  *   **(5)** applies the Law of Large Numbers (or Borel-Cantelli lemma). If the probabilities of winning sum to a finite number ($\sum p_n < \infty$), you will win only finitely many times. If the costs are constant or sum to infinity, you end up with negative infinite welfare in the limit, despite the positive EV of each individual bet.
  *   **(6)** is the **Principle of Almost Sure Dominance**. It states that if Strategy A yields a better outcome than Strategy B in nearly all possible worlds, A is rationally required, regardless of the mean.

  **The Conflict:** The argument demonstrates that **Expected Value Maximization is not ergodic.** The ensemble average (EV) diverges from the time average (what happens to you over a life).
  *   **EV says:** Take the bet. The mean payoff is positive.
  *   **Step (6) says:** Don't take the bet. The median/mode payoff is ruin.

  ### 2. Addressing Your "Too Much" Worry
  You worry that steps (5)–(6) condemn ordinary life (driving, surgery) because risks accumulate over a lifetime. This is a natural worry, but it rests on a structural disanalogy between **The Sweep** and **Ordinary Risk**.

  **A. The Structure of the Payoff**
  *   **The Sweep:** You pay a cost $c$ *every time*. The "good" outcome is a long shot ($p$). The "bad" outcome (paying $c$ and getting nothing) is the high-probability event. You are *chasing tails*.
  *   **Ordinary Life (Driving):** You gain value $V$ *every time* (getting to work). The "bad" outcome (crash) is the long shot. You are *avoiding tails*.

  In The Sweep, the "ruin" scenario is the **base case** (you lose your stake). In Driving, the "success" scenario is the **base case** (you arrive safely).
  Step (6) forbids rules that make ruin "near-certain."
  *   **The Sweep:** Ruin is near-certain (probability $\to 1$).
  *   **Driving:** Ruin is *not* near-certain. The lifetime probability of a fatal crash is non-zero, but it does not approach 1 "as near as you like" simply by living a normal life.

  **B. The "Available Alternative" Clause**
  Look closely at (6): *"...worse off than under an available alternative."*
  *   **The Sweep:** There *is* an available alternative: "Take the sure modest goods." This alternative dominates The Sweep in >99% of worlds.
  *   **Driving:** Is there an alternative that dominates driving in >99% of worlds? "Stay home" avoids crash risk, but it yields lower welfare (no job, isolation). Driving does not leave you "far worse off than under an available alternative" in the near-certain case; it leaves you better off in the near-certain case (alive and employed).

  **Verdict:** The machinery does not condemn everything. It condemns strategies where the **probability of success decays faster than the payoff grows**, such that the *measure* of winning worlds goes to zero. Ordinary life usually maintains a high probability of success per step.

  ### 3. The "Partition" Reply
  Your colleague dismissed your partition point ("buy every member of the partition") as a toy case. She is right, but for a deeper reason than she likely stated.

  If you can buy the whole partition, you have eliminated **idiosyncratic risk**. You have turned a gamble into a sure thing. The argument relies on **market incompleteness**. In the real world, you cannot hedge every long shot.
  *   **The Lesson:** EV maximization is only "safe" if you can aggregate risks across a large enough ensemble (insurance model) or hedge them (market completeness). For a single agent living through time (a single trajectory), EV maximization is dangerous when tails are fat.
  *   **Seminar Point:** This distinguishes **Ensemble Probability** (what happens to 1,000 people once) from **Time Probability** (what happens to 1 person 1,000 times). EV works for the ensemble; it fails for the time trajectory when unbounded.

  ### 4. Recommendation: Which Step to Reject?
  You stated you prefer to keep (1) (Unbounded Welfare) over (2) (EV Maximization). This is the philosophically robust choice for this specific argument.

  **Reject Step (2).**
  Replace "Rational choice is maximising expected value" with **"Rational choice is maximising time-average growth"** (Ergodicity Economics) or **"Rational choice respects Almost Sure Dominance."**

  **The Cost:**
  1.  **Violates VNM Axioms:** You must abandon the Independence Axiom (similar to Allais Paradox resolutions).
  2.  **Context Dependence:** Rationality becomes sensitive to the agent's trajectory and repetition, not just the static snapshot of the gamble.
  3.  **Complexity:** Calculating geometric means or growth rates is harder than linear expectations.

  **Why this is better for your seminar:**
  It allows you to introduce **Ole Peters' Ergodicity Economics**. This is modern, physically grounded decision theory. It shows that EV isn't "wrong," but it answers a different question (ensemble average) than the one agents face (time average).
  *   If welfare is unbounded (1), EV can be infinite while the time-average growth is negative.
  *   Rejecting (2) saves you from the "Sweep" ruin without forcing you to bound utility (which many find philosophically costly).

  **Alternative: Reject Step (6).**
  You could argue that rationality *does* require accepting near-certain ruin for infinite expectation.
  *   **The Cost:** This is a hard bullet to bite. It implies a rational agent should accept a 99.999...% chance of destitution for a 0.000...1% chance of heaven.
  *   **Verdict:** Only do this if you want to defend a very strict, non-naturalistic Platonism about rationality.

  ### 5. Seminar Plan
  Here is how I would stage this in your seminar:

  1.  **Present the Argument:** As written. It is clean and valid.
  2.  **Test the "Too Much" Objection:** Ask the students to apply (6) to driving. Guide them to see the difference between *chasing tails* (Sweep) and *avoiding tails* (Driving), and the role of the *dominant alternative*.
  3.  **Identify the Conflict:** Frame it as **Mean vs. Median** (or Ensemble vs. Time).
      *   EV maximizes the Mean.
      *   Step (6) privileges the Median/Mode (Almost Sure outcome).
  4.  **The Solution:**
      *   **Standard View:** Reject (1). Bounded Utility (Savage, Lewis). This kills the ability to construct the $G$ in step (3).
      *   **Your Preference:** Reject (2). Adopt **Geometric Mean Maximization** (Kelly Criterion logic) or **Ergodicity**.
  5.  **Discussion Question:** "Is rationality about what happens on average across possible worlds, or what happens to you across time?"

  **Summary:** The argument holds. Your "too much" worry dissolves on closer inspection of the bet structure. To keep (1), you must sacrifice (2). The cost is leaving the comfort of Von Neumann-Morgenstern, but the gain is a decision theory that doesn't bankrupt its agents.
