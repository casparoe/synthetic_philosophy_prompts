answer: |-
  Good morning. Welcome to this workshop on physician-assisted dying. Looking around this room, I see a necessary tension. On one side, we have palliative-care clinicians and family advocates who have sat at bedsides where these decisions were not theoretical, but visceral. On the other, we have philosophers and graduate students who bring a rigorous familiarity with the metaphysical and ethical frameworks that underpin these choices. Usually, these groups talk past one another. The clinicians speak of suffering and care; the philosophers speak of agency and rights. Today, I propose we speak a shared language, structured by two constraints drawn from David Hume.

  I am not invoking Hume to settle our debates, but to clear the ground so we can actually have them. We will proceed by adopting two specific Humean limitations on our discourse. If we adhere to them, we may avoid the usual pitfalls of moralizing on one side and abstraction on the other.

  The first constraint concerns how we value life. In clinical settings, there is often an implicit pressure to calibrate the worth of a remaining life against a single scale of utility or quality. We ask if the pain outweighs the pleasure, or if the cognitive capacity justifies the biological continuation. Hume warns us against this calculus. In his discussion of suicide, he argues that the permissibility of leaving life does not depend on a hedonic balance sheet. It does not turn on whether life lacks pleasure. Instead, it turns on whether continued existence is experienced as an active burden.

  For our clinicians and family advocates, this distinction is vital. It means we are not here to measure the objective value of a patient's remaining days. We are here to understand the subjective experience of burden. Hume suggests that when life becomes a burden to oneself and potentially to those who must care for them, the obligation to persist dissolves. This rejects the framing that this workshop is about determining when a life is no longer "worth" living. That is a dangerous metric. Instead, we are discussing when life becomes a weight that crushes the possibility of meaning. This protects us from utilitarian coldness while validating the lived reality of suffering. We are not calibrating value; we are recognizing burden.

  The second constraint is metaphysical, and it speaks directly to our philosophers while offering clarity to our practitioners. It concerns the nature of the patient's will. In the standard discourse, we often speak of a patient "causing" their own death or "taking" their life. This language assumes the will operates as an efficient cause—that there is a metaphysical power within the volition that produces the event of death. Hume, particularly in the *Treatise*, dismantles this notion. He argues that we never perceive causal power itself, only the sequence of events. We feel the volition, and we see the movement, but the connection is not a tangible force we command.

  Therefore, we must not frame the patient's decision as a sovereign causal act that produces death. To do so is to attribute a metaphysical power the will does not possess. Instead, consider this analogy: Imagine a person holding a heavy weight above their head. They exert force to keep it aloft. When they choose to stop, they do not force the weight down. They cease the exertion that held it up. Gravity does the rest.

  In the context of assisted dying, the patient is not efficiently causing death. They are ceasing a contrary inclination. They are releasing the weight of a life that has become a burden, as per our first constraint. This distinction allows us to speak precisely without resorting to euphemism. We need not say the patient "passed away," which obscures the decision. Nor must we say they "killed themselves," which implies a violent causal production. We can say they ceased to resist the natural course of their condition. This honors the agency of the patient without burdening them with the metaphysical weight of being the sole author of their death. It acknowledges that the disease and the biology are the efficient causes; the will is merely the removal of the obstacle.

  By adopting these two constraints, we shape the boundaries of our dialogue. First, we agree not to treat life's value as a single scale to be calibrated, but to look for the experience of active burden. Second, we agree not to treat the patient's will as an efficient cause of death, but as the cessation of resistance.

  For the clinicians and families, this means your testimony about the weight of suffering is central, not secondary to ethical theory. For the philosophers, this means your analysis of agency must remain grounded in the limits of human power, not abstract sovereignty.

  We are not here to solve the mystery of death. We are here to clarify the language we use when standing near it. If we can hold these Humean constraints—that we recognize burden without measuring value, and that we acknowledge choice without claiming causal power—we may find a way to speak honestly about what happens when a patient decides to let go.

  Thank you. Let us begin.
