answer: |-
  **JOINT STATEMENT ON THE ETHICS OF POLITICAL NECESSITY**

  **Prepared for the Graduate Workshop on Political Ethics**
  **Signatories:** Prof. E. Vance (The Pluralist/Dirty-Hands Position) & Prof. J. Thorne (The Consequentialist Position)
  **Date:** 14 October 2023

  ### 1. Agreed Claims

  Following a year of dialectical exchange and a focused period of adversarial collaboration, the undersigned have identified a substantial foundation of agreement regarding the nature of political decision-making in extremis. We affirm the following:

  1.  **The Phenomenology of Emergency:** We agree that political emergencies possess a distinct phenomenological character. They are defined by compressed decision-time, high stakes regarding human life or constitutional order, and the inevitable opacity of intelligence. Both signatories accept that the experience of the decision-maker in these moments is not one of calm calculation, but of acute distress and the recognition that standard moral heuristics may fail.
  2.  **Epistemic Humility and Drift:** We agree that any doctrine of political necessity must account for the well-documented cognitive biases of officials. Specifically, we acknowledge the tendency of security apparatuses to overestimate urgency and necessity. We further agree that the reasoning of 'supreme emergency' is susceptible to self-serving drift, sliding from genuine existential threats down to mere policy convenience or partisan advantage. Any ethical framework that cannot guard against this slippage is dangerous.
  3.  **The Failure of Absolutism:** We agree that the Kantian absolutist who refuses ever to violate a deontological prohibition (e.g., 'never torture', 'never deceive the electorate') is mistaken. To refuse to act in order to avert a catastrophe when one has the power to do so is not moral purity; it is a dereliction of public duty. Both signatories accept that there are circumstances where a leader *must* act to prevent disaster, even if that action would be forbidden in private life.
  4.  **The Rejection of Innocence:** We agree, in the spirit of Sartre's Hoederer, that one cannot govern innocently. The business of statecraft involves the management of force and the allocation of scarce resources in ways that inevitably harm some to benefit others. The question is not whether innocence is retained, but how the moral costs of its loss are accounted for.

  ### 2. Table of Residual Disagreements

  Despite the agreements above, significant theoretical divergences remain. The following table articulates these disagreements. The wording in each column has been approved by the respective signatory as an accurate representation of their view.

  | Topic | The Dirty-Hands Position (Vance) | The Consequentialist Position (Thorne) |
  | :--- | :--- | :--- |
  | **The Status of the Act** | In supreme emergencies, a leader may be morally obligated to perform an action that remains, in itself, a genuine moral wrong. The obligation to save the polity does not erase the prohibition against the act (e.g., torture). | If an action is morally obligated because it produces the best available outcome, it is, by definition, the right thing to do. To call an obligatory act 'wrong' is a category error. |
  | **The Function of Guilt** | The guilt a leader feels after authorising an atrocity for the greater good is a fitting response to a moral violation. It acknowledges a 'moral remainder' that persists despite the necessity of the act. | Guilt is truth-apt only if one has done wrong. Since the leader did the right thing, guilt is irrational. However, displays of anguish may be retained as a useful commitment device to signal reluctance and prevent future overuse. |
  | **Public Doctrine** | The language of 'dirty hands' is necessary to preserve the seriousness of moral prohibitions. It prevents the normalisation of exceptions by insisting that the exception remains tragic and blameworthy. | The language of 'dirty hands' is dangerous. It allows leaders to claim they are doing 'wrong' for 'good' reasons, effectively licensing escalation while insulating themselves from the charge of having made an error in calculation. |

  ### 3. Analysis of Cruxes

  In analysing the disagreements above, we have sought to distinguish between substantive ethical disputes and purely verbal disagreements.

  **3.1 Verbal Disputes (Pruned)**
  We acknowledge that a portion of our disagreement is terminological regarding the predicate 'wrong'.
  *   **Prof. Thorne** defines 'right' and 'wrong' singularly based on the optimisation of outcomes.
  *   **Prof. Vance** defines 'right' and 'wrong' plurally, allowing for conflicting obligations where one obligation (save the state) overrides another (do not torture) without cancelling it.
  *   **Agreement:** We agree to prune the dispute over whether the word 'wrong' *can* be applied to the act. We accept that Prof. Thorne will describe the act as 'regrettable but right', while Prof. Vance will describe it as 'obligatory but wrong'. This is a difference in moral ontology, not necessarily a difference in recommended action.

  **3.2 Substantive Cruxes (Remaining)**
  The substantive disagreement concerns the **ontology of moral guilt**.
  *   **The Crux:** Is the leader's post-action guilt a cognitive recognition of a moral truth (that a boundary was crossed), or is it a non-cognitive emotional state that is only instrumentally valuable?
  *   **Why it matters:** If Prof. Vance is correct, a leader who sleeps soundly after ordering torture is morally deficient, even if the torture saved lives. If Prof. Thorne is correct, a leader who sleeps soundly is psychologically healthy, provided the calculation was correct; guilt in such a leader is a bug, not a feature.

  ### 4. Test Cases and Predictions

  To clarify the substantive cruxes, we have selected three concrete cases. We record our predictions regarding the moral status of the leader's action and their appropriate emotional response.

  | Case | Description | Dirty-Hands Prediction (Vance) | Consequentialist Prediction (Thorne) |
  | :--- | :--- | :--- | :--- |
  | **1. The Ticking Bomb** | A security chief authorises the torture of a detainee known to hold information that will stop a nuclear device. | **Action:** Obligatory but Wrong.<br>**Emotion:** The Chief *ought* to feel profound guilt. A Chief who feels none has failed to recognise the moral cost. | **Action:** Right and Obligatory.<br>**Emotion:** The Chief *ought not* to feel guilt. Relief is appropriate. Anguish is permissible only as a signal to others, not as an internal moral truth. |
  | **2. The Coventry Episode** | Intelligence confirms an impending raid on a city. Warning the city would reveal the intelligence source, jeopardising future operations. The leader chooses not to warn. | **Action:** Obligatory but Wrong.<br>**Emotion:** The sacrifice of civilians constitutes a moral stain. The leader bears responsibility for the deaths that could have been prevented. | **Action:** Right and Obligatory.<br>**Emotion:** The deaths are a tragic cost, but the decision is vindicated by the long-term utility. Guilt implies the decision was mistaken; it was not. |
  | **3. The Broken Promise** | A Prime Minister must break an explicit election promise to balance the budget to avoid a constitutional crisis that would collapse the government. | **Action:** Obligatory but Wrong.<br>**Emotion:** The betrayal of the electorate's trust is a genuine wrong. The PM owes the public an apology that admits fault, not just an explanation of necessity. | **Action:** Right and Obligatory.<br>**Emotion:** The PM should explain the necessity without apologising for the *decision*. To apologise implies the decision was incorrect. |

  ### 5. Concluding Reflection: On Governing Innocently

  We return to the question posed by Sartre's Hoederer: *Can anyone imagine they can govern innocently?*

  **Shared Conclusion:**
  Both signatories answer **No**. There is no path through high-stakes politics that leaves the moral agent's hands clean.

  **Divergence on Implications:**
  Our answers come apart on the *reason* for this impossibility and the *consequence* for the leader's character.

  *   **Prof. Vance (The Dirty-Hands Theorist):** One cannot govern innocently because politics inevitably forces choices between conflicting moral obligations. To govern is to accept that one will sometimes be required to violate a moral prohibition. The loss of innocence is a **moral cost**. The leader who accepts this burden must accept the accompanying guilt as the price of office. To govern is to accept that one will, at times, be a wrongdoer for the sake of the good.
  *   **Prof. Thorne (The Consequentialist):** One cannot govern innocently because 'innocence' is a private virtue incompatible with public responsibility. Innocence implies a lack of causal involvement in harm. A leader is causally involved in harm by the very nature of wielding power. However, this loss of innocence is not a moral stain; it is a **conceptual clarification**. The leader should not seek to be innocent, but to be effective. To feel guilt is to misunderstand the job description. The leader governs responsibly, not innocently, and should judge themselves solely on whether they minimised harm, not on whether they remained personally pure.

  **Final Statement:**
  We agree that the 'Dirty Hands' problem identifies a real tension in political life, even if we disagree on its metaphysical resolution. We recommend that graduate students study the phenomenology of the decision-maker without presuming that the vocabulary of 'right' and 'wrong' maps neatly onto public and private spheres respectively. We further recommend that any doctrine of necessity must include the epistemic safeguards outlined in Claim 2, lest the 'dirtying' of hands become a routine rather than a tragedy.

  ***

  **Signed,**

  **E. Vance**
  *Department of Political Theory*

  **J. Thorne**
  *Department of Philosophy*
