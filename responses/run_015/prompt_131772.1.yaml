answer: |-
  This is a sophisticated interpretive challenge that cuts to the core of the tension between Kant's metaphysical rigor and the phenomenological realities of moral psychology. To address your seminar argument, we must disentangle the *de jure* structure of Kant's indirect-duty view from the *de facto* psychological mechanisms he invokes to sustain it.

  Below is a reconstruction of the logical structure of the indirect-duty argument, followed by the application of your gradient-sensitive analytical pressure, and finally, an assessment of the argument's point of maximum vulnerability.

  ### I. Logical Structure of the Indirect-Duty Argument

  Kant's position, primarily articulated in the *Metaphysics of Morals* (6:442–443) and the *Lectures on Ethics*, relies on a strict tripartite architecture: the Ontological Premise, the Normative Premise, and the Psychological Bridge.

  1.  **The Ontological Premise (The Ground of Value):**
      *   Unconditional moral worth (dignity) is grounded exclusively in **autonomy** (the capacity to legislate the moral law to oneself).
      *   Rational nature exists as an end in itself (*Zweck an sich selbst*).
      *   Non-rational beings (animals) lack autonomy; they are governed by instinct and inclination. Therefore, they are **things** (*Sachen*), not persons.

  2.  **The Normative Premise (The Scope of Duty):**
      *   Duties are strictly relational obligations owed *to* a subject possessing moral status.
      *   Since animals lack moral status, one cannot wrong an animal directly. To wrong an animal is a category error.
      *   All genuine duties are either duties to oneself (moral perfection) or duties to other rational beings (humanity).

  3.  **The Psychological Bridge (The Mechanism of Protection):**
      *   **Empirical Claim:** Acts of cruelty toward animals dull the agent's "natural predisposition" (*Naturanlage*) of sympathy and compassion.
      *   **Normative Link:** This dulling weakens the agent's moral sensibility, making them more likely to violate duties *to humanity*.
      *   **Conclusion:** We have an **indirect duty** regarding animals, owed **to ourselves** (to maintain our virtue) and **to humanity** (to preserve our capacity for moral regard). The prohibition on cruelty is uniform: do not destroy the "analogue" of humanity found in the animal.

  ### II. Applying Gradient-Sensitive Analytical Pressure

  Your challenge posits that rational capacity is not a binary switch but a spectrum. This exerts pressure on all three premises, but most critically on the Psychological Bridge.

  #### 1. Pressure on the Ontological Premise (The Threshold Problem)
  Kant insists on a noumenal/phenomenal distinction: you either have freedom or you do not. However, under gradient pressure, the "marginal cases" argument arises.
  *   **The Gradient:** Consider a great ape (high practical reasoning, no autonomy) and a human with severe cognitive disabilities (low practical reasoning, potential autonomy). Phenomenologically, the ape may exhibit more "rational-like" behavior than the human.
  *   **The Instability:** If the ground of value is rational nature, and rational nature appears in degrees phenomenologically, the binary classification of "Person" vs. "Thing" becomes arbitrary. If Kant admits *any* descriptive gradience in the *expression* of rationality, the ontological cliff-edge looks like a construction rather than a discovery. This forces the question: Does the *protection* track the *ontology* or the *phenomenology*?

  #### 2. Pressure on the Normative Premise (The Reciprocity Problem)
  Kant argues duties are owed *to* rational agents.
  *   **The Gradient:** If rational capacity is a spectrum, moral status should theoretically be a spectrum (graded moral standing).
  *   **The Instability:** Kant rejects graded dignity (dignity is above all price). However, if the *capacity* grounding that dignity is gradient, the "all-or-nothing" protection creates a discontinuity. Why does a 1% increase in rational capacity (crossing the threshold) grant infinite moral worth? Under gradient pressure, the Normative Premise requires a justification for why the *consequences* of status (protection) do not scale with the *ground* of status (capacity).

  #### 3. Pressure on the Psychological Bridge (The Calibration Problem)
  This is the crux of your inquiry regarding the "hardening of the heart."
  *   **The Empirical Claim:** Kant argues cruelty hardens the heart.
  *   **The Gradient Challenge:** Empirical psychology suggests sympathy is not uniform; it is **similarity-sensitive**. We generally feel more sympathy for beings that resemble us in cognition and affect.
  *   **The Normative Dependency:** Here lies the critical tension. Is the wrongness of cruelty *only* about the agent's state (empirical), or does it depend on the *object's* value (normative)?
      *   *If purely empirical:* It shouldn't matter *which* animal I torture; if it hardens my heart, it is wrong. But intuitively (and empirically), torturing a chimpanzee hardens the heart *more* than torturing a beetle.
      *   *If normatively dependent:* The reason it hardens the heart is that we recognize a **value** in the animal that commands regard. If that value is derived from its proximity to rational nature (as an "analogue"), then the *strength* of the indirect duty should correlate with the *degree* of that analogue.

  **The Calibration Implication:** If the duty is to preserve moral sensibility, and moral sensibility is triggered by the recognition of rational-like capacities, then the protection afforded to the animal should be **calibrated proportionally** to its rational capacities. A being with 50% "rational-analogue" capacity should warrant stronger indirect protection than one with 10%. Kant's framework, however, demands a **uniform** prohibition (do not be cruel, period), derived from a **binary** ontology.

  ### III. Empirical Claim vs. Normative Dependency

  To answer your specific question: **The appeal to the hardening of the heart smuggles in a normative dependency.**

  Kant frames it as an empirical, anthropological observation (cruelty makes you mean). However, for this to function as a *moral* argument rather than a prudential one (like "don't eat too much sugar or you'll get sick"), it must rely on a prior valuation.
  1.  **Why is hardening the heart bad?** Because it impedes the recognition of moral claims.
  2.  **Which moral claims?** Claims made by rational beings.
  3.  **Why does animal cruelty impede recognition of rational claims?** Because the animal is treated as an *analogue* of a rational being.

  If the animal is merely a "thing" (like a stone), crushing it does not harden the heart. It hardens the heart *only* because the animal exhibits phenomena (pain, agency, social bonding) that **mimic** rational nature. Therefore, the "wrongness" of the act derives its force from the **perceived proximity of the animal to rational nature.**

  If rational nature admits of degrees (as your gradient pressure suggests), then the "analogue" is stronger in some beings than others. Consequently, the risk to moral sensibility is greater when harming a high-capacity being than a low-capacity one. Thus, the derivative protection *must* be calibrated proportionally to remain consistent with the psychological mechanism Kant invokes. To insist on uniform protection while admitting a gradient in the triggering mechanism (sympathy for rational analogues) creates a disconnect between the *ground* of the duty (self-perfection) and the *application* of the duty (treatment of the object).

  ### IV. Conclusion: The Point of Maximum Vulnerability

  The reconstruction is most vulnerable at the **junction between the Psychological Bridge and the Normative Premise.**

  Specifically, Kant attempts to maintain a **binary normative status** (animals have no direct standing) while relying on a **gradient psychological mechanism** (sympathy for analogues of humanity) to enforce protection.

  Under gradient-sensitive pressure, this creates a *reductio*:
  1.  If the duty is indirect (owed to humanity), its stringency depends on the threat to humanity's moral sensibility.
  2.  The threat to moral sensibility is proportional to the perceived similarity between the victim and humanity (the gradient of rational analogy).
  3.  Therefore, the stringency of the duty regarding the animal must be proportional to the animal's rational similarity.
  4.  But Kant insists the duty is uniform (based on the agent's virtue, not the object's properties).

  **The Vulnerability:** Kant cannot have it both ways. If he maintains the binary ontology, he undermines the empirical plausibility of his psychological bridge (why does crushing a worm threaten our regard for humanity less than crushing a dog, if both are merely "things"?). If he accepts the gradient sensitivity of the psychological bridge to save the argument's plausibility, he implicitly grants that the *object's properties* determine the *strength of the duty*, which collapses the indirect-duty view into a form of **direct, gradient-based standing.**

  For your seminar, the strongest argument is that the "hardening of the heart" is not a freestanding empirical fact but a **normatively loaded recognition of value.** Once you admit that the "hardening" is caused by the violation of something *in the animal* that resembles rationality, you have conceded that the animal possesses a derivative *value* that scales with its capacities. This destabilizes the binary framework, suggesting that moral protection cannot be hermetically sealed off from the ontological status of the recipient.
