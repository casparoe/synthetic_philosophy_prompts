      *   *Step 1 (Ontological):* If rationality is a gradient, the "End-in-Itself" status becomes fuzzy. Kant insists on a sharp cutoff (noumenal freedom), but phenomenologically, it looks continuous.
      *   *Step 2 (Exclusion):* If some animals have *more* practical reasoning than some humans (e.g., a chimp vs. a human in a persistent vegetative state), the binary exclusion fails descriptively.
      *   *Step 3 (Normative):* If status is gradient, can "direct duty" be gradient? Kant says no (dignity is absolute), but if the ground (rationality) is gradient, the absolute claim is shaky.
      *   *Step 4 & 5 (Psychological/Instrumental):* This is the crux. The "hardening of the heart" argument relies on empathy/sympathy.
          *   *Empirical Claim:* Cruelty makes us mean.
