      Regarding (iv): The user says "mereology isn't up for negotiation." Classical mereology implies sharp boundaries for fusions. But clouds are vague. If composition is practice-based, can the practice select vague objects? Classical mereology says no (fusions are precise). So the view might force precisification where none exists. This is a strong tension.

      Let's structure the response clearly around the four points, then the gerrymandering check, then the predictions.

  8.  **Final Review against constraints:**
      *   No reading lists/citations.
