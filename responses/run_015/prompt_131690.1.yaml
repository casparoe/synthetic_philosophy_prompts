prompt: |-
  hey — please act as a professional philosopher who specializes in metaethics and reasons, ok? take your time, think it through carefully, brainstorm a couple of angles before you commit to anything, and write your answer in American English.

  so me and my roomate have been going back and forth about internal vs external reasons and I think I get the basic distinction but I keep thinking the view collapses and i cant tell if that's a bug in my understanding or a bug in the view.

  as I understand it: a reason is internal if it hooks up to something already in my motivational set (stuff I want, care about, am committed to, whatever), and external if it's supposed to apply to me whether or not anything in me points that way. And the internalist argument is that only internal reasons are real reasons, because a "reason" that could never move me even in principle can't explain why I acted, and explaining action is basically the whole job of a reason.

  but take the deadbeat dad. guy has two kids, fully informed, no false beliefs, he's thought about it calmly for ages, and he honestly feels zero motivation toward his kids wellbeing. On this story he has no reason to keep sending money, right? and then it looks like we can't say he's doing anything *wrong* either — we can only say we dont like it. Which makes the whole thing collapse into subjectivism: what you have reason to do is just whatever your current desires happen to point at.

  my roommate pushes it further and says it's the same with the guy who feels no aversion to torturing animals — internalism says he has no reason to stop, so blame is off the table too, and all we can do is contain him like a dangerous animal. she thinks that's the reductio and that Williams just bites the bullet.

  also she says something wich I think is a separate problem: if the dad later starts caring (say he gets dragged through a custody hearing and something shifts in him), then a reason pops into existence that didn't exist before, and she says that's absurd — reasons aren't supposed to blink in and out like that.

  i have a feeling I'm missing something about the "sound deliberation" part — my prof mentioned in passing that it isn't just your occurrent desires, and said something about what she called a "zoom-out reason," which i dont think is a real term but the idea was supposed to be a reason you'd only have if you could step back and see the situation from further away. i might have garbled that.

  so: is my roommate right that this is where internalism lands? where exactly does this line of argument go wrong, if it does — and is the "zoom-out reason" thing doing any real work or is it a red herring?
