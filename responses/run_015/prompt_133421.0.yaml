  **MEMORANDUM**

  **TO:** Model-Governance Board, County Workforce Agency
  **FROM:** Board Chair
  **DATE:** October 26, 2023
  **SUBJECT:** Decision on Allocation Model and Fairness Mitigation

  **Recommendation**

  The Board should adopt **Proposal (i)**: maintain the current calibrated score with a single group-blind cutoff, audited at the current appropriation level. However, this adoption is conditional on two mitigations: (1) a pre-negotiated "rapid review" clause with the vendor to assess fairness metrics if the appropriation shifts by more than 15% (approx. 135 slots), and (2) a public commitment that the current success metric is interim.

  This decision prioritizes legal and regulatory compliance while acknowledging the technical limitations of our current environment. The consent decree barring allocation by race renders Proposals (ii) and (iii) legally precarious. Explicitly setting group-specific cutoffs (ii) or rescaling scores based on group membership (iii) constitutes race-conscious allocation. While intended to mitigate disparity, these methods expose the County to litigation risk that could halt the program entirely. Furthermore, Proposal (iii) violates the County Ordinance requiring published scores to represent probabilities. As a public agency, we cannot deploy a model where the published score is mathematically decoupled from the stated probability of success.

  **The Case for the Runner-Up: Proposal (iii)**

  Proposal (iii), the vendor's distribution-matched variant, presents the strongest *technical* case. It is the only option that satisfies the Board's operational desire for a fairness guarantee across varying budget cutoffs without incurring recurring five-figure audit fees. By ensuring error rates match at every threshold, it mathematically resolves the incompatibility tension caused by the differing base rates (44% vs. 62% retention). It offers stability and statistical parity that Proposal (i) cannot.

  However, Proposal (iii) loses because it solves a mathematical problem by creating a legal one. The rescaling requires group membership as an input for the allocation rule, triggering the consent decree's prohibitions. Additionally, transforming the score so it no longer represents a probability violates the transparency ordinance. We cannot sacrifice legal compliance and public transparency to achieve statistical parity; doing so would undermine the legitimacy of the agency and risk the entire appropriation.

  **Addressing the Coalition's Objection**

  The community coalition is correct: parity on a biased metric entrenches structural inequality. If local hiring discrimination depresses Black retention rates, optimizing for "retention" inherently disadvantages Black applicants, regardless of the model's fairness.

  To address this, the Board directs the Agency Director to establish a **Metric Evolution Task Force** within 90 days. This body, including coalition representatives, will:
  1.  Evaluate alternative success metrics (e.g., wage growth, credential completion) less susceptible to employer bias.
  2.  Develop a supplemental support program for selected applicants facing high-discrimination hiring markets.
  3.  Report back to the Board within one year on the feasibility of adopting a new primary outcome measure.

  We acknowledge that model governance cannot fix labor market discrimination, but we must not codify it.

  **Implementation Timeline**

  *   **Immediate:** Vendor contract amended to include the "rapid review" clause for budget variances >15%.
  *   **30 Days:** Public notice issued confirming the score remains a calibrated probability per Ordinance.
  *   **90 Days:** Metric Evolution Task Force convened.
  *   **Annual:** Board review of disparate impact data, regardless of cutoff stability.

  **Conclusion**

  We choose Proposal (i) not because it is perfect, but because it is the only path that keeps the program lawful and transparent. We mitigate its shortcomings through vigilant monitoring and a committed effort to evolve the definition of "success" itself.

  **Action Required:** Vote to approve Proposal (i) with the stated conditions.
