answer: |-
  In the city of Oakhaven, voters approved a bond measure explicitly titled "Highway Expansion for Faster Commutes" (Policy X), motivated by the substantive end of reducing travel time. After the vote but before construction, updated traffic models—accepted as accurate by both the campaign and the city—demonstrated that induced demand would make commutes longer under X, while a Bus Rapid Transit line (Policy Z) would successfully reduce them. The Populist councilor insists construction on X must proceed because it was the specific item mandated by the ballot, arguing that overriding the explicit choice disenfranchises the voters regardless of the outcome. The City Planner insists on implementing Z, arguing that the voters' will was fundamentally about shorter commutes, and delivering a failed highway betrays that intent even if it honors the letter of the vote. Both sides agree Z achieves the end and X fails; the disagreement is solely whether the 'will of the people' resides in the historical act of choosing the means or the substantive realization of the end.

  **What each actor says:**
  *   **Populist:** "The people voted for the Highway. To build the Bus line is to ignore their direct order. You are substituting your judgment for their sovereign choice."
  *   **Technocrat:** "The people voted for Faster Commutes. The Highway fails that test. To build it is to give them what they asked for but not what they wanted. I am executing their intent."

  **Readings and Swapping:**
  *   **Populist (Say-So Reading):** Committed to the view that the will is constituted by the explicit demand. They cannot swap to End-Tracking without admitting that the popular mandate is voidable by expert analysis, which undermines the populist claim that the people's voice is the ultimate authority regardless of elite consensus.
  *   **Technocrat (End-Tracking Reading):** Committed to the view that the will is constituted by the satisfaction of the underlying interest. They cannot swap to Say-So without violating their professional mandate to deliver functional public goods, effectively admitting that procedure outweighs welfare.

  **The Single Feature Doing the Work:**
  The **exogenous decoupling of means and ends** after the decision point. The factual link between the voted policy and the desired outcome was severed by new information accepted by all parties. This forces a choice between honoring the *act* of voting (Say-So) and honoring the *purpose* of voting (End-Tracking).

  **If That Feature is Removed:**
  If the models had confirmed the Highway *does* reduce commutes, the inversion collapses. The Populist and Technocrat align on Policy X. The conflict reverts to an ordinary standoff where populists distrust experts' *values* or *trustworthiness*, rather than a structural clash over how to interpret the will itself.

  **The Procedural Will Objection & Honesty Check:**
  You anticipated the strongest populist reply: that the will includes the right to be wrong (procedural autonomy). I cannot close this off in the design without begging the question. If I stipulate that voters *only* care about outcomes, I have defined away the populist position. If I stipulate they care about procedure, I validate the objection.
  *What this shows:* This reveals that your original question (anti-expert vs. contingently anti-expert) hinges on a deeper metaphysical dispute about democratic authority. If the "will of the people" is essentially procedural (Say-So), populism is *constitutively* anti-expert whenever experts contradict the mandate, even instrumentally. If the "will" is essentially teleological (End-Tracking), populism is only *contingently* anti-expert. The scenario proves these are incompatible definitions, not just compatible strategies.

  **Joint Satisfiability Honesty:**
  The constraints are *barely* jointly satisfiable, specifically regarding "no voter ignorance." For the people to believe X achieves Y, then concede Experts are right that Z achieves Y (and X doesn't), they must update their beliefs. If they update, why does the Populist still claim "The People want X"? The scenario relies on the Populist speaking for the *past* electorate (the mandate) while the Technocrat speaks for the *current* interest. This creates a tension: if the people truly concede the experts, the Populist is no longer representing their *current* will, only their *past* command. This isn't ignorance, but it is a form of **temporal fragmentation** of the "people." If you require the "people" to be a unified, current agent, the constraints break: a unified people who concede the experts would switch their demand to Z, aligning Populist and Technocrat. The scenario only works if "The People" is treated as a historical authority (Populist) vs. a current beneficiary (Technocrat). I have preserved this distinction to meet your specs, but be aware it relies on treating the electorate as a principal whose agent (the Populist) refuses to update instructions despite the principal's updated knowledge.
