  ### HANDOUT D: Intervention Vote (Minute 25)
  **PRIVATE VOTE**

  **Question:**
  Before the Prediction was made (Game 1) or the Marker was settled (Game 2), would you have paid **10 Points** to undergo an intervention that reliably modified your psychology to ensure you chose the **Evidentially Favored** option?

  *   **Evidentially Favored (Game 1):** The option that correlates with finding 100 points in Box A.
  *   **Evidentially Favored (Game 2):** The option that correlates with Not Having the Marker.

  **Mark One:**
  [ ] Yes, for Game 1 Only.
  [ ] Yes, for Game 2 Only.
  [ ] Yes, for Both.
  [ ] No, for Neither.

