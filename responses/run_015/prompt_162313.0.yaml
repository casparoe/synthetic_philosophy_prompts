  ## PART 4: DEBRIEF SCRIPT & MAPPING

  **Do not start by explaining the theories.** Start by pointing at the board.

  **1. The Cost of Consistency (10 Minutes)**
  *   **Point to Game 1 Data:** "Look at the 2-boxers. You followed the rule: 'The state is fixed, so take the extra point.' You gained 1 point over the 1-boxers *in every individual instance*, yet your group average is 69 points lower than the 1-boxers."
  *   **Point to Game 2 Data:** "Look at the Supplement-takers. You followed the same rule: 'The marker is fixed, so take the extra point.' You gained 1 point causally, but your group average is 84 points lower than the decliners."
  *   **The Trap:** "If you argue for 2-boxing in Game 1 based on causal dominance, you must argue for taking the Supplement in Game 2. If you did that, you lost points in *both* games. If you 1-boxed and Declined, you won in *both*."
  *   **The Waver:** "Who 2-boxed in Game 1 but Declined in Game 2? You avoided the loss in Game 2 but ate the loss in Game 1. Your allegiance wavered. Why?"

  **2. The Causal Structure (15 Minutes)**
  *   Draw two graphs on the board.
      *   **Game 1:** [Decision Procedure] --> [Choice] & [Decision Procedure] --> [Prediction] --> [Box Content].
      *   **Game 2:** [Decision Procedure] --> [Choice] & [Decision Procedure] --> [Marker].
  *   **The Distinction:** "The probabilities were identical (0.85). The payoffs were identical (+1 vs +100). The sentence 'The state is fixed' was true in both. So why did 2-boxing cost you in Game 1 but feel right in Game 2?"
  *   **Sensitivity:** "In Game 1, the Box Content is sensitive to your Decision Procedure (via the Predictor). In Game 2, the Marker is *not* sensitive to your Decision Procedure; it merely tracks a common cause."
  *   **The Coin Flip:** "If you flipped a coin to decide, you break the correlation. In Game 1, a coin flip makes the Prediction useless, so Box A is empty 50% of the time. You destroy the Expected Value. In Game 2, a coin flip saves you from the Marker correlation. You gain Expected Value. The coin flip is rational in one, suicidal in the other."

  **3. The Intervention Vote (5 Minutes)**
  *   **Reveal Ballot 3:** "Who voted to pay for the intervention in Game 1? (Likely many). Who voted to pay in Game 2? (Likely few)."
  *   **The Verdict:** "In Game 2, paying to change your mind is irrational. The Marker is already on your DNA. Changing your choice doesn't cure you. In Game 1, paying to be a 1-boxer *is* rational if you want the money, because being a 1-boxer is what puts the money in the box."
  *   **Conclusion:** "Rationality is not just about maximizing utility given fixed states. It is about what kind of agent you are when the world contains predictors sensitive to your type."

