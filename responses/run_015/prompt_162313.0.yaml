  ## PART 5: FAILURE MODES & MITIGATION

  **1. Students Naming Theories Early ("This is CDT vs. EDT!")**
  *   **Prevention:** State at Minute 0: "No theoretical jargon until the Reveal. If you name a theory, you owe the class 5 points."
  *   **Response:** If it happens, say: "Hold that label. Apply the logic first. We will attach the name at the end."

  **2. Students Trying to Game the Predictor**
  *   **Risk:** Students realize the Survey predicts and lie on Handout A.
  *   **Mitigation:** Handout A is collected *before* Game 1 instructions are read. They don't know *how* it scores until the Reveal.
  *   **Response:** If a student admits they lied: "Then you broke the correlation. Your data point is an outlier. It proves the mechanism relies on honesty."

  **3. Refusal to Play ("This is illegitimate/manipulative")**
  *   **Mitigation:** Offer an "Observer" option. They get the average payoff of the class but cannot vote.
  *   **Response:** "You are opting out of the data. You will not participate in the debrief analysis of choices."

  **4. The 85% Accuracy Drop**
  *   **Risk:** With 16 students, you might only hit 70% accuracy live.
  *   **Response:** "The argument holds for any probability > 50%. If accuracy is 70%, 1-boxing still yields higher Expected Utility (70 vs 1.3). The dominance argument remains identical."
  *   **Honesty:** "I claimed the *instrument's* historical accuracy. This class is an outlier. That is data."

  **5. Calcified Camps**
  *   **Risk:** 1-boxers and 2-boxers talk past each other.
  *   **Response:** Force them to calculate the *cost*. "Show of hands: Who wants to be in the 2-box group for Game 2?" (Silence). "Then why defend the logic that put you there?"

  ---

  ## PART 6: LIMITATIONS NOTE (FOR INSTRUCTOR EYES ONLY)

  **What This Activity Cannot Do:**

  1.  **Metaphysics of Prediction:** This activity uses a psychological proxy, not a near-perfect demon. Students may argue, "A real predictor would know I'd lie."
      *   *Fix:* Acknowledge this. "The demo works for *imperfect* predictors too. The math holds at 85%. The demon is just the limit case."
  2.  **Long-Run Frequencies:** This is a one-shot game. CDT proponents argue Newcomb is about single cases.
      *   *Fix:* Remind them: "You only live once. The points you lost today are gone. The Expected Value argument is about what you should want to be *before* you enter the room."
  3.  **The "Why" of Correlation:** In Game 2, the correlation is stipulated via the Survey. In reality, medical markers don't correlate perfectly with choices.
      *   *Fix:* "We idealized the correlation to make the structure visible. In the real world, the correlation is weaker, which weakens the Evidential argument but does not erase the structural difference."

  **If They Demand The Correct Answer:**
  Do not give it. Say:
  "The data shows that 1-box/Decline strategies earned 85% more points today. But the Causal argument (that you cannot change the past) remains logically valid. Your task is not to pick the winner, but to explain *why* the same logic won in one room and lost in the other. If you cannot do that, you haven't understood the causal graph."

  **Final Warning:**
  The success of this session depends on your ability to keep the Survey scoring secret until the Reveal. If they know the scoring key, Game 1 becomes a game of deception, not decision theory. Guard the key.
