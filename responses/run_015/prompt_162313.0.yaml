  ## PART 2: MINUTE-BY-MINUTE TIMELINE

  **00:00 – 00:05: Arrival & Survey**
  *   Hand out **Handout A** as students enter.
  *   Collect immediately. Do not discuss.
  *   *Instructor Action:* Quickly score surveys (0-2 'A's vs 3-5 'A's).
  *   *Instructor Action:* Prepare Game 1 Envelopes.
      *   For "Impulsive" (Predict 2-Box): Put **0** in Opaque Envelope.
      *   For "Deliberative" (Predict 1-Box): Put **100** in Opaque Envelope.
      *   Seal all Opaque Envelopes. Write Student Name on outside.
      *   Prepare Transparent Envelopes (all contain **1**).
      *   Place both envelopes in a pile at the front.

  **00:05 – 00:15: Game 1 (Newcomb)**
  *   Distribute **Handout B**.
  *   Read rules aloud. Emphasize: "The prediction is sealed. Your choice cannot change the contents."
  *   **Ballot 1:** Students mark "Only A" or "Both". Collect ballots.
  *   **Do not reveal contents yet.**

  **00:15 – 00:25: Game 2 (Medical)**
  *   Distribute **Handout C**.
  *   Read rules aloud. Emphasize: "This is a separate problem. The Marker is fixed by your initial survey."
  *   **Ballot 2:** Students mark "Yes" or "No". Collect ballots.
  *   **Do not reveal Marker status yet.**

  **00:25 – 00:30: Game 3 (Intervention)**
  *   Distribute **Handout D**.
  *   **Ballot 3:** Students vote on paying for intervention. Collect.

  **00:30 – 00:45: The Reveal (Data Generation)**
  *   *This is the critical moment. Do not lecture yet.*
  *   **Game 1 Reveal:** Call names. Hand students their sealed envelopes. Have them open and announce their payoff.
      *   Tally on board: How many 1-boxed? How many 2-boxed? What was the average payoff for each group?
      *   *Expected Result:* 1-boxers average ~85 points. 2-boxers average ~1 point (because the predictor was accurate).
  *   **Game 2 Reveal:** Reveal Marker Status (based on survey score).
      *   Tally on board: How many took Supplement? What was their average payoff?
      *   *Expected Result:* Those who took Supplement (likely Impulsive) mostly had the Marker. Average payoff is negative. Those who declined broke even.
  *   **Game 3 Reveal:** Tally the votes.

  **00:45 – 01:15: Debrief & Mapping**
  *   See Part 4 below.

