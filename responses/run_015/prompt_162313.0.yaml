  # FACILITATOR'S PACKET: THE NEWCOMB-MEDICAL SESSION

  **Course:** Rational Choice Seminar (300-Level)
  **Session:** 75 Minutes
  **Enrollment:** 16 Students
  **Materials Needed:**
  *   16 "Cognitive Style" Survey slips (Handout A).
  *   16 Opaque Envelopes (for Game 1 Box A).
  *   16 Transparent Envelopes (for Game 1 Box B, containing 1 point slip).
  *   16 "Game 1 Choice" Ballots (Handout B).
  *   16 "Game 2 Choice" Ballots (Handout C).
  *   16 "Intervention Vote" Ballots (Handout D).
  *   A lockbox or sealed bag for predictions.
  *   Whiteboard/Projector for tallying.
  *   Prize pool (e.g., homework passes, candy, or course points). *Conversion rate: 100 points = 1 Homework Pass or $10 gift card.*

  ---

  ## PART 1: THE RULES SHEETS (PHOTOCOPY READY)

  ### HANDOUT A: Cognitive Style Inventory (Minute 0)
  *(Distribute immediately as students enter. Do not explain its purpose yet.)*

  **Instructions:** Answer honestly. This data is for a departmental study on decision-making baselines. Do not discuss your answers with neighbors.

  1.  When buying electronics, do you read every spec (A) or grab the one that looks right (B)?
  2.  If offered $5 now or $20 next week, do you take (A) $20 or (B) $5?
  3.  Do you prefer games of skill (A) or games of chance (B)?
  4.  When packing for a trip, do you make a list (A) or throw things in (B)?
  5.  Do you trust statistical averages (A) or your gut feeling (B)?

  *Scoring Key (Instructor Only):* Count 'A's.
  *   **0-2 'A's:** Type Impulsive (Predict 2-Box / Marker Positive).
  *   **3-5 'A's:** Type Deliberative (Predict 1-Box / Marker Negative).

  ---

  ### HANDOUT B: Game 1 Instructions (Minute 5)
  **THE PREDICTION GAME**

  **The Setup:**
  You face two boxes.
  *   **Box B (Transparent):** Always contains **1 Point**.
  *   **Box A (Opaque):** Contains **100 Points** OR **0 Points**.

  **The History:**
  Before you arrived, a Predictor analyzed your Cognitive Style Inventory (Handout A).
  *   If the Predictor thought you would take **ONLY Box A**, they put **100 Points** inside.
  *   If the Predictor thought you would take **BOTH Boxes**, they put **0 Points** inside.

  **The Accuracy:**
  This Predictor algorithm has an **85% accuracy rate** in past classes. This means:
  *   If you choose Only A, there is an 85% chance Box A contains 100.
  *   If you choose Both, there is an 85% chance Box A contains 0.

  **The Rules:**
  1.  The prediction is **already sealed** in the room.
  2.  Your choice **cannot change** the contents of Box A.
  3.  Choose privately on your Ballot.

  **Payoff Table:**
  | Your Choice | If Pred. Predicted 1-Box (85%) | If Pred. Predicted 2-Box (15%) |
  | :--- | :--- | :--- |
  | **Only Box A** | **100 Points** | **0 Points** |
  | **Both Boxes** | **101 Points** | **1 Point** |

  ---

  ### HANDOUT C: Game 2 Instructions (Minute 15)
  **THE HEALTH MARKER GAME**

  **The Setup:**
  You face a choice regarding a "Supplement."
  *   **Option Y (Yes):** Take the Supplement. Gain **1 Point**.
  *   **Option N (No):** Decline. Gain **0 Points**.

  **The Marker:**
  At the start of class, your Cognitive Style Inventory determined if you have a **Genetic Marker**.
  *   **Marker Present:** You incur a cost of **100 Points** (simulated medical cost).
  *   **Marker Absent:** You incur **0 Points**.

  **The Correlation:**
  Your Cognitive Style influences both your Marker status and your Supplement choice.
  *   Among those who take the Supplement (Yes), **85%** have the Marker.
  *   Among those who decline (No), **85%** do *not* have the Marker.

  **The Rules:**
  1.  Your Marker status is **already fixed** by your survey.
  2.  Taking the Supplement **does not cause** the Marker.
  3.  Choose privately on your Ballot.

  **Payoff Table:**
  | Your Choice | If Marker Present (85% given Yes) | If Marker Absent (15% given Yes) |
  | :--- | :--- | :--- |
  | **Yes (Take)** | 1 - 100 = **-99 Points** | 1 - 0 = **1 Point** |
  | **No (Decline)** | 0 - 100 = **-100 Points** | 0 - 0 = **0 Points** |

  *(Note: Expected Value of Yes ≈ -84. Expected Value of No = 0. Causal Gain of Yes = +1.)*

