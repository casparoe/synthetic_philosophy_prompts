      *   No historical fact-checking (use provided facts)? Yes.

  8.  **Self-Correction during drafting:** I initially thought about saying the Metro didn't switch because it wasn't a convention. But the prompt says "Railways and Stockholm metro never switched." I should treat them as a control case for "Depth." Tracks = High Depth. Roads = Low Depth. This fits the user's theory perfectly. I will lean into that.
      *   *Correction on Part 3:* Lewis actually discusses law and convention. He says law can *create* convention if it solves the coordination problem. I need to be careful not to say Lewis ignores law, but that he struggles with the *transition* from law-backed to self-enforcing.
      *   *Refining the "Arbitrariness" point:* If 90% of cars are LHD, LHT is *inefficient*. Does that make it non-arbitrary? Lewis says convention is arbitrary if there is *an* alternative regularity. It doesn't require equal efficiency. But if one is strictly dominant, is it still a coordination game or a prisoner's dilemma? It remains a coordination game because driving R while others drive L is disaster, even if R-R is better than L-L. So arbitrariness holds.

