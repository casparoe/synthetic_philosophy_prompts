          *   Part 2: Validate the Grip/Depth distinction. It solves the "static vs dynamic" problem in Lewis. Dagen H works because Depth was shallow (cars already LHD). Metro didn't switch because Depth was high (tracks). It is an *extension*, not relabeling.
          *   Part 3: Law vs Convention. Test: Counterfactual removal of enforcement. The 83% vote: Transition costs vs Steady state. This preserves arbitrariness.
          *   *Vulnerability:* The "Arbitrariness" condition when one side is demonstrably safer. I will flag this.

  6.  **Refining the "Opinionated" aspect:**
      *   Don't hedge. Say "Lewis is wrong here" or "Your intuition is correct."
      *   Challenge the "High Grip" claim in Part 2. If 90% of cars were LHD, the grip of LHT was already rotting. The switch was catching up to reality, not overcoming a stable equilibrium. This makes the case *stronger* for the user's theory (Depth was shallow because the hardware already matched the new rule).
      *   On the 83% vote: Be firm. It's not about preference for LHT, it's fear of the switch cost. This is crucial for the syllabus.

  7.  **Final Polish:** Check against constraints.
      *   Three parts? Yes.
