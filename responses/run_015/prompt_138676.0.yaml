          1.  disciplined mapping (population, coordination problem, equilibria, arbitrariness given constraints).
          2.  Evaluate the user's theoretical claim (Lewis lacks theory of displacement; propose Grip vs. Depth; Dagen H as evidence, Metro as control; is this new or just relabeling?).
          3.  Lewis's silence (Convention vs. Law/Self-preservation post-switch; test to distinguish; explain the 83% vote vs. better equilibrium; impact on arbitrariness).
      *   **Requirement:** Flag the point where I'd least want to be pushed.

  2.  **Part 1: Disciplined Mapping (Lewisian Framework):**
      *   *Population:* Swedish drivers (and pedestrians/cyclists interacting with roads).
      *   *Recurring Coordination Problem:* Meeting on the road. Specifically, passing/overtaking and intersection navigation.
      *   *Equilibria:* Left-hand traffic (LHT) and Right-hand traffic (RT). Both are Nash equilibria in the coordination game (if everyone else does X, I should do X).
      *   *Arbitrariness:* This is the tricky bit. Lewis requires conventions to be arbitrary alternatives.
      *   *Constraint:* The prompt notes 90% of cars were LHD (Left-Hand Drive) and neighbors drove on the right. Does this destroy arbitrariness?
      *   *Analysis:* Lewis says a convention is arbitrary if there is *another* regularity that *could* have prevailed. The fact that LHD cars make LHT dangerous suggests LHT was *inferior*, but not that it wasn't an equilibrium. The "arbitrariness" in Lewis isn't about equal payoff, but about the existence of an alternative regularity that would also work *if everyone adopted it*. RT was an alternative regularity. The fact that RT was *better* given the car fleet doesn't make it non-arbitrary in the Lewisian sense, provided LHT was still a working equilibrium (which it was, despite danger).
      *   *Refinement:* I need to be sharp here. The "arbitrariness" condition is often misunderstood. It means the reason for following the rule is *that others follow it*, not intrinsic merit. Even if RT is safer, if I drive RT because the law says so and I want to avoid a fine, is it a convention? Lewis struggles here. But for the mapping: Yes, two equilibria exist. The constraints (cars, neighbors) shift payoffs but don't eliminate the coordination structure.

  3.  **Part 2: Grip vs. Depth (The User's Theory):**
      *   *User's Claim:* Lewis explains maintenance, not displacement.
      *   *User's Fix:* Split "Grip" (cost to deviate unilaterally) from "Depth" (infrastructure/payoff structure built around it).
      *   *Hypothesis:* High Grip/Shallow Depth = Easy to switch with synchronization. Dagen H = High Grip (danger to deviate), Shallow Depth (cars were already LHD, neighbors were RT, so the *system* wasn't deeply locked to LHT). Metro = Control (never switched, high depth?).
      *   *Evaluation:* Is this Lewis relabeled? Lewis talks about "salience" and "precedent." He doesn't really have a dynamic theory of *changing* conventions, only how they stabilize. So the user is right that Lewis is static.
      *   *Grip vs. Depth:* This sounds like distinguishing between the *strategic cost* (Grip) and the *structural sunk cost* (Depth). Lewis focuses on the strategic cost (payoffs in the matrix). He ignores the historical/sunk cost infrastructure.
      *   *Verdict:* This is a genuine addition, not just relabeling. Lewis assumes the payoff matrix is static. The user is introducing a second-order variable (how malleable the matrix itself is).
      *   *Metro Control:* Why didn't the metro switch? Trains run on tracks. Switching sides requires physical switching of tracks/signals at stations. That is extreme "Depth." Roads are "Shallow" (just paint and behavior). This supports the theory.
      *   *Critique:* I need to challenge the "High Grip" assessment of Dagen H. Was the grip actually high? If 90% of cars were LHD, the grip of LHT was *weakening* naturally. The "danger" of overtaking suggests the equilibrium was already destabilizing. So maybe Dagen H wasn't High Grip/Shallow Depth, but *Lowering Grip*/Shallow Depth. I should push back slightly to refine the theory, but ultimately validate the core insight.
      *   *Decision:* I will argue it's a substantive addition because Lewis treats the payoff structure as given, whereas "Depth" treats the payoff structure as endogenous to history.

  4.  **Part 3: Lewis's Silence (Law, Self-Preservation, and the 83% Vote):**
      *   *Post-1967 Status:* Is it convention or law? Lewis distinguishes convention from coercive agreement. If the state enforces it, is it still a convention?
      *   *Lewis's View:* Conventions can be underpinned by law, but the *reason* for compliance matters. If I comply only because of the police, it's not a convention. If I comply because I expect *you* to comply (and the law just coordinates expectations), it is.
      *   *The Test:* Remove the sanction. If behavior persists, it's convention. If it collapses, it's law. (Counterfactual test).
      *   *The 83% Vote:* Why vote to keep Left if Right is the "better" equilibrium?
      *   *Explanation:* Transition costs. People aren't voting on the *target* equilibrium, they are voting on the *cost of getting there*. The 1955 vote reflects the *transition cost*, not the *steady-state payoff*.
      *   *Impact on Arbitrariness:* This saves the arbitrariness claim. The choice between L and R is arbitrary regarding *steady state*, but the path dependency makes one sticky. The vote confirms the existence of *two* equilibria (otherwise why vote?), but highlights the hysteresis.
      *   *Definite Line:* Post-1967 driving is a *hybrid*. It started as law-coordinated convention. Over time, as the generation that remembered LHT died out, it became pure convention.
      *   *Least Want to be Pushed:* I need to identify a vulnerability. Probably the definition of "Arbitrariness" in the face of safety data. If RT is objectively safer (due to LHD cars), is the choice really arbitrary? I need to defend the Lewisian definition of arbitrariness (alternative regularity possible) against the utilitarian critique (one is objectively better). I will stake my ground on the definition of arbitrariness being about *reasons for action*, not *outcome equality*.

  5.  **Drafting the Response (Iterative refinement):**
      *   *Tone:* Academic, sharp, opinionated, respectful of the user's sophistication.
