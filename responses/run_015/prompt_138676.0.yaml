answer: |-
  Here is the analysis, structured for your syllabus decision. I am taking a hard line: Dagen H is the perfect case study, but only if you gut Lewis's static framework and rebuild it with your dynamic "Grip/Depth" distinction.

  ### 1. The Disciplined Mapping

  **Population:** The relevant population is not "Swedes" but "road users in Sweden." This includes drivers, cyclists, and pedestrians whose navigation depends on vehicular flow. Crucially, it excludes the metro and railway operators (your control case).

  **The Recurring Coordination Problem:** This is a pure coordination game with conflict. The recurring situation is two vehicles approaching a potential conflict point (an overtake, an intersection, a narrow bridge). The preference ordering is:
  1.  I drive side X, You drive side X (Safe)
  2.  I drive side Y, You drive side Y (Safe)
  3.  I drive side X, You drive side Y (Crash/Death)

  **The Equilibria:** There are two Nash equilibria: *All-Left* and *All-Right*. Both are stable in the sense that no single actor has an incentive to deviate unilaterally. If everyone else is on the left, your best response is left.

  **Arbitrariness under Constraint:** This is where most seminars fail. You must be precise: Lewisian arbitrariness does not mean the equilibria yield *equal* payoffs. It means there is *another* regularity that could have prevailed *if everyone adopted it*.
  The facts you provided (90% LHD cars, neighbors on Right) shift the payoff matrix. They make the *All-Right* equilibrium Pareto-superior to *All-Left*. However, they do not eliminate *All-Left* as an equilibrium. Swedes *were* coordinating successfully on the left in 1966. The fact that it was dangerous to overtake means the payoff was lower, not that the coordination failed. Therefore, the choice remains arbitrary in the Lewisian sense: the reason I drive on the right on September 4th is not because the road is physically impassable on the left, but because *you* are driving on the right. The physical constraints (LHD cars) make the *transition* desirable, but they do not remove the *conventional* nature of the rule.

  ### 2. Grip vs. Depth: Addition or Relabeling?

  **Your Claim:** Lewis offers a theory of maintenance (how a convention holds), not displacement (how it moves). Your fix splits *Grip* (unilateral deviation cost) from *Depth* (structural sunk costs surrounding the convention).

  **Verdict:** This is a substantive **addition**, not a relabeling. Here is why:

  Lewis treats the payoff matrix as exogenous and static. He explains how we select an equilibrium via salience or precedent. He has no account for what happens when the *matrix itself* changes over time. Your "Depth" variable captures the historical sedimentation of the convention into the physical world.

  *   **Dagen H as Evidence:** You characterize Dagen H as "High Grip / Shallow Depth." I would refine this: It was **Rotting Grip / Shallow Depth.**
      *   *Grip:* The cost to deviate was high (death), but the *incentive* to maintain the old equilibrium was eroding because 90% of the fleet was LHD. The "Grip" was already slipping because the hardware no longer matched the rule.
      *   *Depth:* This was shallow. The road infrastructure (paint, signs) is cheap to change. The fleet was already aligned with the *new* rule (LHD cars work better on Right traffic). The neighbors were aligned with the *new* rule. The only thing "deep" was muscle memory.
      *   *Result:* Because Depth was shallow, a synchronized focal point (5am, Sept 3) allowed the population to jump equilibria instantly.

  *   **The Metro Control:** This validates your theory. Why didn't the metro switch?
      *   *Grip:* Same as roads (crash if you deviate).
      *   *Depth:* Extreme. Switching sides requires moving physical tracks, rewiring signals, rebuilding platform edges. The "surrounding payoff structure" was physically concretized.
      *   *Result:* High Depth prevents displacement even if the new equilibrium is superior. Lewis cannot explain why roads switched and rails didn't, as both are coordination problems. Your Depth variable explains it perfectly.

  **Syllabus Advice:** Pitch this as "Dynamic Conventions." Lewis gives you the snapshot; you are providing the video. The distinction is robust enough to carry a seminar session.

  ### 3. Where Lewis Goes Silent

  **Convention vs. Law + Self-Preservation:**
  Post-1967, are Swedes driving on the right by convention or law? Lewis struggles here because he wants conventions to be self-enforcing. If the state enforces it, he worries it becomes a "coercive agreement."
  *   **The Line:** On September 4, 1967, it was Law. By 1970, it was Convention.
  *   **The Test:** The **Counterfactual Sanction Removal Test.** If the police stopped ticketing wrong-side driving tomorrow, would the system collapse?
      *   If *yes*: It was never a convention; it was compliance.
      *   If *no*: It is a convention underpinned by law.
      *   *Application:* In 1967, if you removed the police, accidents would have spiked (people reverting to muscle memory). In 1975, if you removed the police, nothing would happen (new muscle memory). The *transition* required law; the *maintenance* relies on convention. Lewis lacks the vocabulary for this phase change.

  **The 83% Vote and the "Better Equilibrium":**
  You asked why the 1955 vote (83% to keep Left) is not evidence that Left was the better equilibrium.
  *   **Answer:** The vote measured **Transition Costs**, not **Steady-State Payoffs**.
      *   Voters in 1955 weren't asking "Is Left or Right better?" They were asking "Is Right *worth the cost of switching*?"
      *   Given the Depth of the system in 1955 (signage, habits, fear of the unknown), the transition cost outweighed the benefit of the superior Right equilibrium.
      *   By 1963, the Depth had shifted (more LHD cars, more trade with Europe), lowering the transition cost relative to the benefit.
  *   **Impact on Arbitrariness:** This saves the arbitrariness claim. The fact that people voted to stay in an inferior equilibrium proves that the equilibrium was *sticky*, not that it wasn't arbitrary. Arbitrariness requires an alternative *possible* regularity, not an equally *preferred* one. The vote confirms there were two viable options (otherwise the debate makes no sense), but highlights hysteresis.

  ### The Point I Least Want to Be Pushed On

  **The Definition of Arbitrariness in the Face of Safety Data.**
  I am staking my ground on the claim that Dagen H remains a "convention" even though Right-hand traffic was objectively safer (due to LHD cars and neighbor alignment).
  A utilitarian critic will argue: "If one option saves lives and the other kills people, the choice is not arbitrary. It is rational optimization."
  **My Defense:** Lewisian arbitrariness is about the *reason for action*, not the *outcome value*. I drive on the right *because you do*. If I drove on the right because "physics dictates it," it wouldn't be a convention. But physics didn't dictate it; LHD cars on Left roads *worked*, just poorly. The safety differential makes the *selection* of the equilibrium rational, but the *nature* of the equilibrium remains conventional.
  **Vulnerability:** If you press me on whether a coordination problem ceases to be a coordination problem when one equilibrium becomes *strictly dominant* (i.e., L-L becomes a negative payoff outcome rather than just a lower positive one), I have to concede Lewis's framework blurs. If L-L is "Death" and R-R is "Life," it starts looking less like a Convention and more like a Prisoner's Dilemma where cooperation is forced by reality. I want to avoid that semantic fight in a seminar; keep the focus on the *transition mechanism*, not the ontological status of the payoff matrix.

  **Syllabus Verdict:** Commit to it. But center the session on your **Grip/Depth** distinction. That is the theoretical value-add; Lewis is just the foil.
