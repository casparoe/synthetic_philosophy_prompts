      *   **Name:** The Two-Door Wager.
      *   **Rounds:** 3 Rounds.
      *   **Round 1 (The Trap):** High variance. Info available. Participants choose: Bet Blind or Look then Bet.
      *   **Round 2 (The Zero Value):** Info available, but prior is so skewed info won't change decision.
      *   **Round 3 (The Aggregation):** Repeat Round 1 multiple times to show the average.
      *   **Wait, 75 minutes is tight.** Need to streamline.
