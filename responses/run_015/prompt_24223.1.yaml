      *   **Payoff:** Gold = 10 points. Gas = 0 points.
      *   **Prior:** 50/50.
      *   **Information:** A "Seismograph" reading. It gives a signal (Green/Red).
      *   **Accuracy:** The signal isn't perfect. Say 80% accurate.
      *   **The Twist:** To make them *feel* the reluctance, we need a scenario where the "Blind" choice feels strong.
      *   *Revision:* Let's make it asymmetric.
      *   **Option A (Safe):** Guaranteed 4 points.
      *   **Option B (Risky):** 10 points if State is Good, 0 if State is Bad.
      *   **Prior:** P(Good) = 0.5. Expected Value (EV) of B = 5. EV of A = 4. Rational choice without info: B.
      *   **Info:** A test that says "Good" or "Bad".
      *   **Reluctance:** Why refuse info? If I'm risk-seeking, I just want to gamble. Or if I think the test is noisy.
      *   *Better approach for the "Refusal":* Give them the *option* to buy info, but make the "No Info" EV high enough they feel confident.
      *   *Actually, the prompt wants them to run into the phenomenon where they refuse it and discover they should have taken it.* This implies the game *offers* info, they might skip it (or wish they had it), and then we compare.
      *   *Wait, Good's Theorem assumes costless info.* If I charge points for info, the theorem doesn't apply directly (Value of Info < Cost). The prompt says "no real money, chips or points are fine". Let's keep info costless in points, but maybe "costly" in terms of cognitive load or risk of regret.
      *   *Correction:* The prompt asks for "a single peek to actually cost someone in that round." This refers to *ex-post* regret. "I saw the signal, I switched, and I lost. If I hadn't looked, I would have won." This happens when the signal is misleading. This is essential for distinguishing $E[V]$ vs $V_{realized}$.

