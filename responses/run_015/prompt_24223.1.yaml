      *   *The Trap:* Participants need to feel tempted to *reject* info. Why would they reject info? Usually because they think they already know what to do, or they fear the info will talk them out of a high-reward gamble they want to take.
      *   *The "Costly Peek":* The prompt asks for a single peek to actually cost someone *in that round*. Wait, Good's Theorem says expected value is non-negative. A specific realization *can* be worse than the blind choice (e.g., you get a signal that makes you switch, but you would have won had you stuck). This is crucial for the debrief.
      *   *The "Worthless Info" Round:* Need a scenario where the signal doesn't change the optimal action.

