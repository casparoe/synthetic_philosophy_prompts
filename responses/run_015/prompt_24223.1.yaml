          *   *Scenario 2 (Worthless):* Prior favors Switch heavily (EV 9 vs 5). Signal says "Stop". Posterior EV of Switch is still 7. Player Switches anyway. Info value = 0.

  6.  **Addressing Specific Constraints:**
      *   *14-18 people:* Need small groups or individual play. Individual play with a central "Dealer" (Facilitator) is easier to control.
      *   *Tables:* Use table groups (4-5 people). They compete against the "House" (Probability), not each other. This reduces social pressure.
      *   *Predictable Failures:* People won't calculate Bayes. They will heuristic. People will focus on the loss (regret) rather than the average. People will treat the "Worthless" round as a trick.
      *   *Limitations:* Can't show *continuous* info. Can't easily show *costly* info (theorem assumes free). Can't show *strategic* info (game theory vs decision theory).

  7.  **Fleshing out the Rules (Iterative refinement):**
      *   **Currency:** "Research Grants" (chips).
      *   **The Choice:** Project A (Safe) vs Project B (Risky).
      *   **The State:** "Market Condition" (Bull/Bear).
      *   **The Info:** "Consultant Report" (Positive/Negative).
      *   **Round 1 (The Intuition Trap):**
          *   P(Bull) = 55%.
          *   Proj A: 50 pts.
          *   Proj B: 100 pts (Bull), 0 pts (Bear).
          *   EV(B) = 55. EV(A) = 50. Blind choice: B.
          *   Report Accuracy: 75%.
          *   *Crucial:* Players commit to "Will Look" or "Won't Look" *before* the Report is generated? No, Good's theorem says you *have* the info. Let's make it: You *can* ask for the report.
          *   *Actually, to feel the theorem, they need to experience the regret of looking.*
          *   *Mechanism:* Everyone *must* decide whether to enable the "Consultant". If enabled, they see the report, then decide. If disabled, they decide blind.
          *   *Wait, if they enable it, they can always ignore the report.* Good's theorem holds because you can ignore it. The value is $\geq 0$.
          *   *To make them feel the "Costly Peek":* They must follow the report.
          *   *Constraint Check:* The prompt says "make it possible for a single peek to actually cost someone in that round." This implies they look, act on it, and lose compared to the blind strategy.
          *   *Okay, Rule:* If you take the info, you *must* follow the recommendation? No, that violates the "you can ignore it" clause of Good's Theorem.
          *   *Better:* You take the info. You are free to act. But in the specific realization, the info misleads you into a suboptimal action *relative to the blind optimal action*.
          *   *Example:* Blind Optimal = Bet B (EV 55). Info says "Bear". You update. New EV(B) = 30. You choose A (50). Reality was Bull. You get 50. Blind B would have got 100. You "lost" 50 points by looking.
          *   *This works.* It demonstrates Realization < Blind Realization, even though Expected Value(Look) > Expected Value(Blind).

  8.  **Timeline Construction:**
      *   0-10: Intro & Groups.
      *   10-25: Round 1 (The "Regret" Round). 55/45 split.
      *   25-40: Round 2 (The "Zero Value" Round). 90/10 split.
      *   40-60: Round 3 (The "Average" Round). 10 rapid iterations of Round 1 setup.
      *   60-75: Debrief.

  9.  **Debrief Strategy:**
      *   Map the "Regret" to $V_{realized}$.
      *   Map the "Average" to $E[V]$.
      *   Map the "Zero Value" to "Info doesn't change action".
      *   Connect to Physics: Measurement doesn't collapse the wavefunction to a lower energy state *on average*, even if a single measurement disturbs the system. (Appeal to their background).

  10. **Predictable Failures:**
      *   Bayesian updating is hard. Provide a lookup table.
      *   People hate "forced" choices. Keep it voluntary.
      *   Boredom in Round 3. Keep it fast.
      *   Skepticism about the "randomness". Use physical decks.

  11. **Limitations:**
      *   Cost of information (theorem assumes cost = 0).
      *   Logical uncertainty (theorem assumes probabilistic uncertainty).
      *   Value of information *about* the value of information (meta).

  12. **Final Polish:**
