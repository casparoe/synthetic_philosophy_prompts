  2.  **Deconstruct Good's Theorem:**
      *   *Core Claim:* $E[U|Info] \geq E[U|No Info]$. The expected utility of acting after observing information is at least as high as acting without it.
      *   *Why it feels wrong:* Information can be distressing ("bad news"). Information costs time/effort (though the theorem assumes costless info). A specific signal might lead to a worse outcome than if you had ignored it (realization vs. expectation).
      *   *The "Zero Value" Case:* If the information doesn't change your action, its value is zero.
      *   *The "Positive Value" Case:* If the information changes your action to a better one for the specific state of the world, its value is positive.

