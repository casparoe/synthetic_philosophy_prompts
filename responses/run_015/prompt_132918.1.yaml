  # Decision Tree: The Heterogeneity Problem for Hedonism

  **Root Question:** Do all pleasures share a distinctive, introspectible phenomenal quality ("hedonic tone")?

  ### **BRANCH A: YES (Phenomenal Views)**
  *   **Split A1:** Is this quality literally uniform across all modalities (taste, intellectual, sexual)?
      *   **YES → Leaf 1: Cross-modal Convergence (Strict Qualitative Hedonism)**
          *   *Awkward Commitment:* Must claim eating cake and solving a math proof feel literally identical in some sensory respect, despite obvious surface differences.
      *   **NO → Split A2:** Is the similarity based on a shared underlying dimension (e.g., valence) or overlapping features?
          *   **Shared Dimension → Leaf 2: Dimensional Phenomenalism (Core Affect)**
              *   *Awkward Commitment:* Reduces rich, distinct experiences to mere coordinates on a graph (e.g., positive valence + high arousal).
          *   **Overlapping Features → Leaf 3: Family Resemblance Phenomenalism**
              *   *Awkward Commitment:* Cannot define pleasure precisely, only point to examples, risking circularity when distinguishing pleasure from non-pleasure.

  ### **BRANCH B: NO (Non-Phenomenal Views)**
  *   **Split B1:** Is the unity Relational (attitude-based) or Functional/Teleological (role-based)?
      *   **Relational → Split B2:** Is the attitude Conative (desiring) or Cognitive (judging)?
          *   **Conative → Leaf 4: Conative Hedonism (Desire-Based)**
              *   *Awkward Commitment:* Must deny masochists take pleasure in pain (since they do not desire pain *qua* pain, only relief or context).
          *   **Cognitive → Leaf 5: Cognitive Hedonism (Judgment-Based)**
              *   *Awkward Commitment:* Requires cognitive sophistication unavailable to infants or animals, implying they cannot feel pleasure.
      *   **Functional/Teleological → Split B3:** Is the function a unified survival signal or a fragmented cluster?
          *   **Unified Signal → Leaf 6: Teleological Functionalism (Evolutionary Reward)**
              *   *Awkward Commitment:* Must count drug-induced euphoria as pleasure even if it actively harms survival and reproduction.
          *   **Fragmented Cluster → Leaf 7: Modular Dissociation (Eliminativist)**
              *   *Awkward Commitment:* Implies "pleasure" is a linguistic fiction with no natural kind reference, grouping independent neural circuits only because language tricks us.
          *   **Process-Based → Leaf 8: Predictive Functionalism (Error-Reduction)**
              *   *Awkward Commitment:* Defines pleasure as prediction-error minimization, implying a perfectly satisfied robot could feel pleasure without any biology.

  ---

  ### **Indistinguishable Pairs**
  *   **Leaf 4 (Conative) vs. Leaf 6 (Teleological):** These often blur because organisms typically desire what functions as a survival reward; distinguishing "what I want" from "what my brain is wired to reinforce" is empirically difficult in edge cases (e.g., addiction).
  *   **Leaf 1 (Cross-modal) vs. Leaf 2 (Dimensional):** Both claim a form of uniformity; the line between "identical feel" and "same valence dimension" is often just a matter of descriptive granularity rather than ontological difference.

  ### **Unoccupied Logical Space**
  *   **Combination:** Accepts Phenomenal Uniformity (Yes Branch) but denies any Relational or Functional backing (No Branch implications).
  *   **Status:** **Unattractive but Coherent.** This "Brute Phenomenalism" posits a shared feel that neither drives action nor serves a purpose. It is logically possible but philosophically costly, as it renders pleasure causally inert and irrelevant to value theory.
