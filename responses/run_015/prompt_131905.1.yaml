  5.  **Drafting Content (Iterative Process):**

      *   *Question:* "Can a mechanism-based taxonomy..." -> "Does distinguishing the *causal mechanism* of absence alter the *epistemic obligations* of the historian?"
      *   *The Gap:* Critical archive theory focuses on *who* is missing (marginalized). Formal epistemology focuses on *why* data is missing (mechanism). They need to meet.
      *   *Method:* Phase 1: Taxonomy construction. Phase 2: Case application. Phase 3: Normative output.
      *   *Cases:* 1. The 1890 US Census Fire (Accidental/Structural mix). 2. Colonial Record Purging (Intentional). *Self-Correction:* The prompt suggests "census undercounting versus deliberate record purging." Let's use those. Undercounting is often structural (MAR/MNAR), Purging is intentional (MNAR). I need to make sure I include "Accidental" too, as per the prompt's intuition (flood vs. burn). Let's ensure the taxonomy covers all three: Accidental, Structural, Intentional.
      *   *Deliverable:* A "Heuristic for Archival Absence."
