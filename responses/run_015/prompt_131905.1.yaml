      *   **Specific Distinction:** Accidental loss (flood) vs. Structural exclusion (bias) vs. Intentional destruction (purging).
      *   **Goal:** Determine if this mechanism-based taxonomy changes normative epistemic obligations for historians and adds value beyond social-group framing.
