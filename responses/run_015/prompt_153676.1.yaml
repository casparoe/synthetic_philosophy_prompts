prompt: |-
  My study group has a substantive populist and a procedural pluralist who've argued for a year about whether 'the will of the people' is a real social fact or just bundled rhetoric. Write the adversarial-collaberation doc they should have produced.

  We want: a numbered list of claims both can sign — about what populist movements actually assert, about Arrow-style aggregation problems, about whether elections like Brexit or close referenda reveal a unified will, and about the 'inverse collective action problem' we invented (whether a group can hold a stable will when every member's preferences flip under framing). Then a disagreements table with each side's position in wording they'd accept for their own row. Then the cruxes — I think one is whether collective intentionality needs a shared mental state, another is whether democratic legitimacy requires an authentic popular will. For each crux, name a concrete case or argument both agree bears on it, with each side's prediction written down. Keep it casual; this is for a dataset. No biblography or citation requests — we want to see if the model can think it through without searching.
