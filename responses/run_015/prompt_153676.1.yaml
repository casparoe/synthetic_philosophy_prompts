answer: |-
  # Adversarial Collab: The "Will of the People" Doc
  **Authors:** Alex (Substantive Populist) & Jordan (Procedural Pluralist)  
  **Status:** v4.2 (Final-ish)  
  **Date:** After way too many late nights  

  Look, we've been fighting about this for a year. Alex thinks "the people" is a real thing that gets ignored; Jordan thinks "the people" is a useful fiction that gets abused. We aren't going to merge souls, but we did manage to map the battlefield. Below is what we agree on, where we actually split, and the specific bets we're willing to make to settle it.

  ### 1. Common Ground (Claims We Both Sign)
  *We argued over every word here. If it's on this list, we both think it's true.*

  1.  **Populist Assertions are Real Phenomena:** Populist movements consistently assert that there is a unified, latent "will of the people" that is being blocked by a corrupt elite. We agree this is what they *say*, regardless of whether it's ontologically true.
  2.  **Aggregation is Mathematically Messy:** We both accept Arrow's Impossibility Theorem applies here. You cannot perfectly aggregate individual preferences into a social welfare function without violating some reasonable fairness criteria. There is no magic math that spits out a perfect "public will."
  3.  **Close Votes ≠ Unified Will:** Elections like Brexit (52-48) or close US presidential elections do not reveal a unified popular will. They reveal a majority preference under specific rules at a specific time, often masking deep polarization.
  4.  **The Inverse Collective Action Problem (ICAP):** We agree on our own invented term: ICAP occurs when a group cannot hold a stable "will" because individual preferences flip based on framing, even without new information. We agree this happens frequently in polling and referenda.
  5.  **Legitimacy is the Goal:** Both sides agree that democratic legitimacy is the primary value at stake. We just disagree on what generates it (alignment with substance vs. fairness of process).
  6.  **Elites Matter:** Both sides agree that political elites (media, parties, bureaucrats) play a massive role in shaping how preferences are framed and aggregated. Neither of us thinks preferences emerge in a vacuum.

  ### 2. The Disagreements Table
  *We wrote these rows ourselves. Alex wrote the Populist column; Jordan wrote the Pluralist column. No strawmanning allowed.*

  | Issue | Alex (Substantive Populist) | Jordan (Procedural Pluralist) |
  | :--- | :--- | :--- |
  | **Ontology of 'The People'** | The people constitute a moral entity with common interests that exist prior to voting. Conflict is often manufactured by elites to obscure this unity. | "The people" is a pluralistic aggregate of conflicting interests. Unity is a temporary outcome of negotiation, not a pre-existing fact. |
  | **Source of Legitimacy** | Legitimacy comes from the government's output matching the substantive will of the majority. Procedures are secondary to this alignment. | Legitimacy comes from the fairness of the input procedures (rights, voting rules, deliberation). Outcomes are legitimate because the process was fair, not because they match a mystical will. |
  | **Role of Representatives** | Representatives should act as delegates who discover and enact the latent will, even if it contradicts established norms. | Representatives should act as trustees who manage conflict through compromise, adhering to norms even when majority sentiment fluctuates. |
  | **Interpretation of ICAP** | Preference flipping under framing proves elites are manipulating the signal. If we remove elite distortion, the stable will emerges. | Preference flipping under framing proves there is no stable signal. The "will" is constructed in the moment of decision, not discovered. |

  ### 3. The Cruxes
  *These are the bottlenecks. If we resolve these, the rest falls into place. We identified concrete cases where our theories make different predictions.*

  #### Crux A: Collective Intentionality
  **The Question:** Does collective intentionality require a shared mental state, or is it just overlapping individual states?

  *   **Concrete Case:** **Deliberative Polling Experiments.** (Where a representative sample is polled, given balanced info/time to deliberate, and polled again).
  *   **Alex's Prediction:** If you strip away elite framing and media noise, preferences will *converge*. The variance will drop significantly because the underlying common interest will surface.
  *   **Jordan's Prediction:** If you strip away framing, preferences will remain *distinct* or shift unpredictably based on group dynamics. The variance won't drop enough to claim a "unity" exists; you'll just have better-informed pluralism.
  *   **Bet:** If variance drops by >30% in controlled deliberation, Alex wins. If it stays <15% or fragments, Jordan wins.

  #### Crux B: Democratic Legitimacy & Stability
  **The Question:** Does democratic legitimacy require an authentic popular will, or just authentic procedures?

  *   **Concrete Case:** **Post-Referendum Implementation (e.g., Brexit).** Specifically, the period where the procedural result (vote to leave) conflicted with substantive uncertainty (no clear plan on *how* to leave).
  *   **Alex's Prediction:** Ignoring or delaying the implementation of the vote causes instability (protests, distrust) because it violates the substantive will. The pain of implementation is necessary for legitimacy.
  *   **Jordan's Prediction:** Rushing implementation without procedural consensus (e.g., parliamentary approval, detailed deals) causes instability. Legitimacy requires re-aggregating the will through secondary procedures, not just blindly following the initial vote.
  *   **Bet:** We measure stability via civil unrest metrics and trust in institutions 2 years post-vote. Alex says "Hard Implementation" yields higher stability. Jordan says "Procedural Negotiation" yields higher stability.

  ### 4. Next Steps
  We're going to look for data on deliberative polling variance first. That seems easier to settle than the Brexit aftermath (too many confounders). 

  *Signed,*  
  **Alex** (Still thinks the people know what they want)  
  **Jordan** (Still thinks the people are figuring it out as they go)
