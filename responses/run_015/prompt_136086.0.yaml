  *(Refining the "Form" argument)*: Schopenhauer actually discusses musical form (bass = lowest grades of Will, melody = highest). So the user's point (5) isn't entirely alien, but the idea that it *transforms* the Will into something safe is the sticking point. Schopenhauer thinks music *repeats* the Will. If the Will is bad, music repeats the badness, but we view it *sub specie aeternitatis*. The user suggests the form *itself* saves us. This is closer to Hanslick or Nietzsche. I must highlight this divergence.

