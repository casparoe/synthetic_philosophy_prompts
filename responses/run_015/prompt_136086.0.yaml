      *   *Conflict 1: Pessimism vs. Liberation (3 vs 4/5).* This is the big one. If the Will is suffering, knowing it directly should hurt. To say it doesn't requires modifying the definition of the Will or the nature of the knowledge.
      *   *Conflict 2: Ontology of Music vs. Form (1 vs 5).* If music *is* the Will, how can form *transform* it? Form should be intrinsic to the Will's objectification, not an external ordering principle imposed to make it safe.
      *   *Conflict 3: Priority (2).* Less severe, but needs nuance regarding the "parallel" nature.
      *   *Revisions:*
