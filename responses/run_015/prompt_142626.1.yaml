answer: |-
  You have described a precise and unsettling phenomenon, and your intuition that "hysteresis" is the correct physical metaphor is remarkably strong. You are asking for the carving, not the label, so I will begin with the structure of the thing itself, then move to its relation to existing ideas, and finally to what it implies about the nature of aesthetic emotion.

  ### One Thing or Two?

  Your two cases are the same phenomenon. Superficially, Case 1 is about **trust** (a genre contract was violated) and Case 2 is about **craft** (a technique was revealed). However, the psychological mechanism is identical in both: the emotional response depended on a tacit assumption about the *causal history* of the image, not just the image itself.

  In Case 1, the assumption was: "The distress on screen is a record of a distress that occurred." When you learned it was staged, the causal chain changed to: "The distress on screen is a simulation of a distress that occurred."
  In Case 2, the assumption was: "The child's reaction is a response to the fictional situation." When you learned the method, the causal chain changed to: "The child's reaction is a response to a director's prompt, unrelated to the fictional situation."

  In both instances, you did not change your belief about the *fictional truth* (you never believed the fishing town events or the station goodbye happened in reality). You changed your belief about the *indexical link* between the actor's internal state and the scene's narrative meaning. Because the mechanism of loss is the same (knowledge of provenance breaks the affective link) and the outcome is the same (irreversible attenuation despite intellectual vindication), this is a single category of experience.

  ### Nearest Established Concepts and Differences

  There are three standard philosophical "carvings" near this territory. None fit perfectly, which is why your observation feels nameless.

  **1. The Paradox of Fiction**
  *   **The View:** This is the standard puzzle you explicitly rejected. It asks: How can we feel fear or sadness for characters we know do not exist? Solutions usually involve "quasi-emotions" or "offline simulation."
  *   **The Difference:** Your puzzle is the inverse. You are not asking how emotion is *possible* given fiction; you are asking how emotion is *impossible* given specific knowledge about the fiction's production. The Paradox of Fiction assumes the emotion exists and tries to justify it. Your case assumes the emotion existed, vanished, and refuses to be justified back into existence.

  **2. The Intentional Fallacy**
  *   **The View:** This is the claim your friend raised. It argues that knowing the author's intention or method should not alter the meaning or value of the work. The work stands on its own.
  *   **The Difference:** You are correct to reject this. The Intentional Fallacy concerns *interpretation* and *meaning*. Your experience concerns *affective capacity*. You can agree the work is "good" (meaning/valuation) while admitting you can no longer access the specific sorrow it once commanded (affect). This concept fails because it treats the viewer as a decoder of meaning, not a vessel of physiological and psychological response.

  **3. Suspension of Disbelief / Aesthetic Distance**
  *   **The View:** This suggests we voluntarily set aside skepticism to enter the fiction. Brechtian "alienation" suggests we should remain distant to think critically.
  *   **The Difference:** Suspension of disbelief is usually voluntary and reversible. You can "try" to believe again. Your case is involuntary and irreversible. Furthermore, aesthetic distance is usually a goal (for critique); your "thinner state" feels like a loss of capacity, yet simultaneously feels *more correct*. This tension—loss plus correction—is not covered by standard distance theories.

  **The Closest Analogy: The Magic Trick**
  The nearest non-philosophical concept is the **Magic Trick Effect**. Once you know how a card trick is done, you cannot be "amazed" by it again, even if you admire the skill. You can appreciate the dexterity, but the *wonder* is dead.
  *   **Difference:** Magic relies on a premise of deception. Your Case 2 involves no deception, only technical revelation. Yet the result (the death of the specific affect) is identical. This suggests that certain aesthetic emotions function like magic tricks: they require ignorance of the mechanism to sustain the specific quality of the feeling.

  ### Does "Hysteresis" Fit?

  Yes. It is not just a helpful metaphor; it is the precise structural description of what is happening.

  In physics, hysteresis describes a system where the output depends not only on the current input but on the *history* of the input. A magnetic material, once magnetized, does not return to zero magnetism when the magnetic field is removed; it retains a "memory" of the field.

  Your emotional system is displaying hysteresis.
  *   **State A:** Ignorance of mechanism -> High Emotional Response.
  *   **Trigger:** Knowledge of mechanism.
  *   **State B:** Knowledge of mechanism -> Low Emotional Response.
  *   **Reverse Trigger:** Intellectual vindication of mechanism (It's ethical/valid).
  *   **Result:** System does *not* return to State A. It stays in State B.

  The "history" here is the sequence of *Ignorance -> Revelation*. You cannot un-reveal. The system has settled into a new stable equilibrium. The feeling of "accuracy" you describe in the thinner state is the system recognizing that State B is the lower-energy, more stable configuration given the new data. The earlier response now feels "embarrassing" because your cognitive system now tags it as "based on incomplete information," akin to a calculation error.

  ### A Proposed Term and Definition

  Since no existing term captures the *irreversibility* combined with the *provenance sensitivity*, I propose calling this **Constitutive Disenchantment**.

  **Definition:**
  *Constitutive Disenchantment* is the irreversible attenuation of a specific aesthetic emotion following the revelation of the generative mechanism of the artwork, persisting even after the mechanism is intellectually or ethically vindicated. It occurs when the emotion is retroactively re-categorized by the subject as having been premised on a naive relation to the source, rendering the previous emotional state inaccessible and seemingly erroneous.

  **Boundary Cases (To decide what counts):**

  1.  **Fits the pattern:** You watch a singer perform a raw, tearful ballad. Later you learn they used heavy pitch-correction and comped together takes from different days. You can no longer feel the "vulnerability," even if you admit the song is still beautiful. (The emotion of *vulnerability* relies on the assumption of a continuous, unmediated human performance).
  2.  **Does not fit (Habituation):** You watch a horror movie ten times. You stop jumping. This is not Constitutive Disenchantment; this is desensitization. If you take a break for a year, the jump might return. In Disenchantment, a break does not restore the feeling.
  3.  **Does not fit (Moral Objection):** You watch a film and learn the lead actor abused their spouse. You stop enjoying the film. This is moral contamination, not Constitutive Disenchantment. If you were convinced the rumor was false, your enjoyment would likely return. In Disenchantment, even if the method is "good" (as in your child actor case), the feeling does not return.

  ### Implications for Standard Stories about Fictional Emotion

  This pattern is evidence **against** the view that fictional emotions are solely about the *propositional content* of the narrative (what happens in the story).

  If emotion were only about the "father saying goodbye," knowing the child was fed lines shouldn't matter. The proposition "Father says goodbye to daughter" remains true in the fiction. The fact that your emotion dies suggests that aesthetic emotion is **Genealogy-Sensitive**.

  It supports a **Relational Theory of Aesthetic Emotion**. This view holds that our emotional response is not just to the *image*, but to the *relationship between the image and its cause*.
  *   In your first state, you perceived the relationship as: *Actor's Inner State -> Image.* (Even if you knew it was acting, you tacitly assumed the actor was simulating the emotion internally).
  *   In your second state, you perceived the relationship as: *Director's Instruction -> Actor's Reflex -> Image.*

  When the genealogy shifts from "simulated interiority" to "manufactured reflex," the specific emotion of "heartbreak" (which requires a subject to feel heartbroken) loses its object. You cannot feel heartbreak for a reflex. You can feel pity, or admiration, or suspense, but the specific resonance requires a tacit belief in the *authenticity of the simulation*.

  This implies that when we engage with fiction, we are not just suspending disbelief about the *events*; we are suspending disbelief about the *production of the performance*. We enter a tacit contract that the tears we see are the result of an actor accessing sadness, not an actor accessing a cue. When that contract is broken, even legitimately, the specific emotion that relied on it cannot be reconstructed. The hysteresis exists because the brain updates its model of the source, and it cannot downgrade that model back to "naive" without violating its own drive for accuracy.

  In short: You are not witnessing a failure of emotion. You are witnessing an update in the *tracking mechanism* of emotion. The emotion was always tracking the *perceived authenticity of the cause*, not just the *content of the effect*. Once the tracking is corrected, it cannot be fooled again.
