prompt: |-
  I'm the lead on conceptual docs at a dev-tools company, which basically means I own the vocabulary: the framing analogy in the overview page, and then every tooltip, error message and diagram inherits it. It happens five or six times a quarter, I get about a day per decision, I'm not a cognitive scientist, and the CTO signs off on the overview. Stakes are high in a dumb way — once something like "the cache is your model's short-term memory" ships, support fields tickets from people who reasoned their way to a conclusion we never actually stated. Our reviewers' reflex objection is that every analogy is wrong somewhere, which proves too much to be any use.

  Write me a procedure I can run on a candidate analogy before it goes in, grounded in the Hofstadter/Sander line that analogy-making and categorisation are the same activity — so importing a source drags in it's whole naive theory, not just the piece I wanted, and a category can be enriched later by analogy with ones you already have. I want the questions in order, what counts as a sufficient answer to each, and specifically: how to tell a misfit that sits there harmlessly from an entailment people will actually draw and act on; how to check the audience even has the source category; and where the thing stops and hands the call to a human because it isn't a factual question. Flag the steps that are judgment in a checklist costume.

  Then run it on three candidates for the same product: the rate limiter as a narrow pipe you're pouring through, the model as a well-read intern, and the version history as parallel universes. One of those I'm attached to and I expect your going to kill it — if so, say so plainly rather than softening it. Finish with what the procedure can't decide at all, and what would change your mind: which of your three verdicts is most likely wrong, and what consideration would flip it.
reasoning: |-
  Here's a thinking process that leads to the suggested response:

  1.  **Analyze the Request:**
      *   **Role:** Lead on conceptual docs at a dev-tools company.
      *   **Task:** Own vocabulary/framing analogies (overview, tooltips, errors, diagrams).
      *   **Constraints:** 5-6 decisions/quarter, ~1 day/decision, not a cognitive scientist, CTO sign-off required.
      *   **Problem:** High stakes ("dumb way") – users infer unstated conclusions from analogies (e.g., "cache = short-term memory" leads to support tickets). Reviewers object that "all analogies are wrong," which is unhelpful.
      *   **Theoretical Grounding:** Hofstadter/Sander (*Surfaces and Essences*). Analogy-making = categorization. Importing a source domain drags in its whole "naive theory." Categories enrich over time.
      *   **Deliverable 1:** A procedure (checklist/questions in order) to evaluate candidate analogies.
          *   Must distinguish harmless misfits from actionable entailments.
          *   Must check audience familiarity with the source category.
          *   Must flag where human judgment overrides the checklist ("judgment in a checklist costume").
          *   Must identify where the procedure stops and hands off to a human.
      *   **Deliverable 2:** Run the procedure on three candidates:
          1.  Rate limiter = Narrow pipe.
          2.  Model = Well-read intern.
          3.  Version history = Parallel universes.
      *   **Constraint:** Be plain/direct if killing a favorite analogy.
      *   **Deliverable 3:** Meta-analysis. What can't the procedure decide? Which verdict is most likely wrong? What would flip it?

  2.  **Deconstruct the Theory (Hofstadter/Sander):**
      *   *Core Idea:* Analogy isn't decoration; it's the mechanism of thought. We understand $X$ by mapping it to $Y$.
      *   *Implication:* You can't map just one feature. You map the *structure* and the *causal logic* (the naive theory) of the source domain.
      *   *Risk:* If the source domain has a causal rule the target domain violates, the user will predict failure or behave incorrectly based on that rule.
      *   *Benefit:* Good analogies allow "category enrichment." Users can learn new features by extending the analogy correctly.

  3.  **Drafting the Procedure (The "Analogy Stress Test"):**
      *   *Goal:* Filter out dangerous entailments while allowing useful framing.
      *   *Step 1: Source Availability.* Do they know the source? (If not, analogy fails immediately).
      *   *Step 2: Structural Mapping.* What are the core causal rules of the source?
      *   *Step 3: Entailment Extraction.* If the source works this way, what *must* the target do?
      *   *Step 4: Truth Check.* Do those entailments hold in the target?
      *   *Step 5: Harm Assessment.* If an entailment is false, does it cause error or just confusion? (The "harmless misfit" vs. "actionable entailment" distinction).
      *   *Step 6: Category Enrichment.* Does this analogy help them learn *future* features?
      *   *Judgment Flags:* Need to explicitly mark where the user needs to use intuition, not just logic.

      *Refining the "Harmless vs. Actionable" distinction:*
      *   Harmless: "The pipe is blue." (Visual feature, no causal weight).
      *   Actionable: "If I pour slower, the pipe widens." (Causal mechanism, leads to wrong action).
      *   *Test:* Can I write a support ticket or a bug report based on this inference? If yes, it's actionable.

      *Refining the "Judgment in Checklist Costume":*
      *   Deciding "severity" of a mismatch is subjective.
      *   Deciding if the audience "knows" the source is probabilistic.

  4.  **Running the Procedure on the Candidates:**

      *   **Candidate 1: Rate Limiter = Narrow Pipe.**
          *   *Source:* Fluid dynamics/Plumbing.
          *   *Theory:* Pressure builds up, flow restricts, backlog occurs, bursting possible.
          *   *Entailments:* If I push too hard, it backs up. If I wait, it clears.
          *   *Truth:* Rate limiters usually drop requests or queue them. "Backing up" implies queuing. If the system drops, the pipe analogy suggests data loss (leak) or pressure (error).
          *   *Verdict:* Generally robust, but "pressure" implies errors might be retryable vs. dropped.
          *   *Risk:* Low/Medium.

      *   **Candidate 2: Model = Well-read Intern.**
          *   *Source:* Human employee (Junior/Intern).
          *   *Theory:* Humans get tired, have bias, can be tricked, need clear instructions, have memory of past conversations (sometimes), can be fired/retrained.
          *   *Entailments:* I can negotiate with it. It understands *intent*. It remembers me personally. It gets "better" with friendship.
          *   *Truth:* LLMs are stateless (usually), deterministic (mostly), have no intent, no feelings.
          *   *Risk:* **High.** Users will try to prompt emotionally, expect memory retention, or trust it with judgment it doesn't have. This drags in the "naive theory of mind."
          *   *Verdict:* Kill it. It imports too much psychology.

      *   **Candidate 3: Version History = Parallel Universes.**
          *   *Source:* Sci-fi/Multiverse.
          *   *Theory:* Divergent timelines, co-existence, switching between them, one is "prime."
          *   *Entailments:* I can jump between them. Changes in one don't affect others. They exist simultaneously.
          *   *Truth:* Git branches/versions work exactly like this (mostly).
          *   *Risk:* Low. Devs know Git. Sci-fi fans know multiverse.
          *   *Verdict:* Keep. It captures the non-linear nature well.

      *   *Self-Correction on "Intern":* The prompt says "One of those I'm attached to and I expect your going to kill it." The "Intern" analogy is the most dangerous cognitively. The "Pipe" is cliché but safe. The "Universes" is flashy but accurate for version control. I will target the "Intern" analogy for the kill.

  5.  **Drafting the Meta-Analysis:**
      *   *What can't it decide?* Cultural shifts (source domain familiarity changes), emotional resonance (does it *feel* right?), and political capital (CTO loves it).
      *   *Which verdict is most likely wrong?* Probably "Parallel Universes." Why? Because "Parallel Universes" implies equal validity. Version history often has a "main" branch. If the product enforces a strict linear master, the analogy breaks.
      *   *What would flip it?* If the versioning system allows merging vs. if it's immutable forks.

  6.  **Refining the Tone:**
      *   Professional, direct, slightly academic but pragmatic (matching the user's "lead on conceptual docs" persona).
      *   Acknowledge the Hofstadter/Sander framing explicitly.
      *   Ensure the "Judgment in Checklist Costume" flags are visible.

  7.  **Final Review against Constraints:**
      *   Procedure grounded in H/S? Yes (categorization, naive theory).
      *   Questions in order? Yes.
      *   Sufficient answers defined? Yes.
      *   Harmless vs. Actionable distinction? Yes.
      *   Audience check? Yes.
      *   Human hand-off flagged? Yes.
      *   Run on 3 candidates? Yes.
      *   Plain language on killing the favorite? Yes.
      *   Meta-analysis included? Yes.

  8.  **Writing the Content:** (Iterative drafting process to ensure clarity and punchiness). *Self-correction during drafting:* Make sure the "Pipe" analogy gets a nuanced look. It's often used for throttling, but if the implementation is "hard drop" vs "queue," the analogy shifts from "narrow pipe" to "filter." I need to make sure the procedure catches that.

      *Wait, re-reading the prompt:* "One of those I'm attached to and I expect your going to kill it."
      *Option A:* Pipe. (Boring, usually safe).
      *Option B:* Intern. (Dangerous, anthropomorphic).
      *Option C:* Universes. (Cool, maybe too abstract).
      *Decision:* The "Intern" analogy is the classic trap in AI docs. It invites the most "naive theory" import (psychology). I will kill that one.

      *Wait, re-reading the "Parallel Universes" one:* Version history as parallel universes. If it's Git-based, branches are standard. If it's "Time Travel" (like temporal DBs), universes works. If it's just "Undo/Redo," universes is overkill. I'll assume it's branching.
      *Actually, let's look closer at "Intern".* Hofstadter says analogy is categorization. Calling a model an "Intern" categorizes it as a *Agent*. If it's not an agent, the categorization is false. This is the strongest kill.

      *Let's look at "Pipe".* Rate limiter. If the rate limiter returns 429 (Too Many Requests), the pipe analogy suggests "back pressure." If the client doesn't handle back pressure, they crash. The analogy implies a mechanism (flow control) that the user must implement. This is actually high stakes. But "Intern" is higher stakes because it implies *agency*.
      *Okay, I'll stick with killing "Intern".* It's the most cognitively loaded.

      *Wait, let's look at the "Judgment in Checklist Costume" requirement.* I need to make sure I explicitly label which steps are actually subjective judgments disguised as objective steps.

      *Final Polish:* Ensure the distinction between "misfit" (the map doesn't cover the territory) and "entailment" (the map leads you off a cliff) is clear.

      *(Self-Correction on Meta-Analysis)*: Which verdict is most likely wrong?
      If I kill "Intern," maybe I'm being too purist. Sometimes "Intern" works for *capability* framing even if *architecture* is wrong.
      If I pass "Pipe," maybe I'm underestimating the "backpressure" confusion.
      If I pass "Universes," maybe I'm overestimating pop-sci literacy.
      I think "Universes" is the most fragile. Devs know Git. Do they know Many-Worlds Interpretation? Or do they know Marvel? If they know Marvel, "Parallel Universes" implies they never touch. Git branches merge. Universes usually don't merge in pop culture. This might be the one most likely wrong. I'll argue that in the meta-section.

      *Wait, one more check:* "Flag the steps that are judgment in a checklist costume." I will use a specific icon or bold text for this.

      *Let's write.*
answer: |-
  # The Analogy Stress Test (Hofstadter/Sander Protocol)

  **Premise:** Per *Surfaces and Essences*, an analogy is not a decoration; it is a categorization act. To call $X$ a $Y$ is to assert that $X$ belongs to the category of things that behave like $Y$. This imports the **Naive Theory** of the source domain (the intuitive causal rules users believe govern $Y$). If your system violates those rules, users will not just be confused; they will reason incorrectly.

  **Timebox:** 45 minutes for the procedure, 15 minutes for the write-up.
  **Owner:** Docs Lead (You).
  **Sign-off:** CTO (for the Overview framing only).

  ---

  ## Part 1: The Procedure

  Run these steps sequentially. If you fail a step, stop. You either need a new analogy or a product change.

  ### 1. Source Availability Check
  **Question:** Does the target audience possess a shared, stable category for the source domain?
  **Sufficient Answer:** Yes, >80% of users can define the source's basic mechanics without looking it up.
  **Insufficient Answer:** "It's pop culture," or "They'll Google it."
  **⚠️ Judgment in Checklist Costume:** Estimating audience familiarity is probabilistic. You are guessing at the collective mental model of a demographic. If you are unsure, you must validate with support logs or user interviews, not intuition.

  ### 2. Naive Theory Extraction
  **Question:** What are the three core causal rules of the source domain? (e.g., If I push water into a pipe, pressure builds.)
  **Sufficient Answer:** Three distinct "If/Then" statements describing how the source behaves.
  **Insufficient Answer:** Descriptions of appearance or static features (e.g., "It is blue," "It is digital").

  ### 3. Entailment Generation
  **Question:** If the target system truly *were* the source domain, what would the user expect to happen in edge cases?
  **Sufficient Answer:** A list of specific user actions and predicted system responses derived *only* from the Naive Theory (Step 2).
  **Insufficient Answer:** Vague feelings of "fit."

  ### 4. The Truth & Harm Matrix (Critical Step)
  **Question:** For each Entailment (Step 3), is it True, False, or Partially True in the actual system?
  **Sufficient Answer:** A binary classification for each entailment.
  **⚠️ Judgment in Checklist Costume:** Distinguishing "False but Harmless" from "False and Dangerous."
  *   **Harmless Misfit:** The user infers something wrong that doesn't change their action (e.g., "The pipe is metal" vs. "The pipe is code").
  *   **Actionable Entailment:** The user infers something wrong that leads to a support ticket, data loss, or security risk (e.g., "If I wait, the pressure drops" implies retrying will work, but the system actually bans IPs).
  **Rule:** If an Actionable Entailment is False, the analogy fails.

  ### 5. Category Enrichment Potential
  **Question:** Does this analogy help the user categorize *future* features we haven't built yet?
  **Sufficient Answer:** Yes, we can name future features using the source vocabulary without retraining the user.
  **Insufficient Answer:** No, this analogy only explains the current MVP.

  ### 6. The Human Hand-off
  **Trigger:** If Step 4 yields a "False but Harmless" result, or if Step 1 is borderline.
  **Action:** This is no longer a factual question. It is a risk tolerance decision.
  **Output:** A memo to the CTO stating: *"The analogy imports [Naive Theory]. It implies [False Entailment]. We believe this is harmless because [Reason]. We need your call on risk."*

  ---

  ## Part 2: Running the Procedure

  Here is the evaluation of your three candidates.

  ### Candidate 1: The Rate Limiter as a "Narrow Pipe"
  *   **Source Availability:** **Pass.** Developers understand plumbing/flow constraints intuitively.
  *   **Naive Theory:**
      1.  If flow exceeds width, pressure builds up.
      2.  If pressure gets too high, something bursts or leaks.
      3.  If you reduce flow, pressure normalizes.
  *   **Entailments:**
      1.  If I send too many requests, they will queue up (pressure).
      2.  If I keep sending, the system will eventually reject/drop them (burst).
      3.  If I back off, I can send again immediately (normalize).
  *   **Truth & Harm:**
      *   *Queueing:* **Partial.** Depends on implementation. If you return 429 (Too Many Requests) immediately, there is no queue. The pipe analogy suggests backlog.
      *   *Bursting:* **True.** Rate limits usually cap throughput.
      *   *Normalizing:* **True.** Windows slide.
      *   *Harm Assessment:* **Medium Risk.** If the system drops packets (429) but the analogy suggests queuing, users won't implement retry logic with backoff, expecting the "pipe" to handle the backlog. They will lose data.
  *   **Enrichment:** **Pass.** We can talk about "burst capacity" or "throttling" later.
  *   **Verdict:** **Conditional Pass.** Only if your rate limiter actually queues. If it drops, this analogy causes data loss. Change to "Turnstile" if it drops requests.

  ### Candidate 2: The Model as a "Well-Read Intern"
  *   **Source Availability:** **Pass.** Everyone knows what an intern is.
  *   **Naive Theory:**
      1.  Humans understand intent, not just syntax.
      2.  Humans have memory of past interactions (relationship).
      3.  Humans can be persuaded, tired, or biased.
      4.  Humans can take initiative.
  *   **Entailments:**
      1.  If I explain *what* I want (intent), it will figure out the *how*.
      2.  If I treat it nicely, it will do better work.
      3.  It remembers what I told it last week.
      4.  I can trust it to flag errors on its own.
  *   **Truth & Harm:**
      *   *Intent:* **False.** Models predict tokens.
      *   *Relationship:* **False.** Statelessness (usually).
      *   *Persuasion:* **False.** No feelings.
      *   *Initiative:* **False.** Passive generator.
      *   *Harm Assessment:* **Critical Fail.** This is an **Actionable Entailment**. Users will write prompts relying on implicit context (Intent), expect memory retention (Relationship), and trust outputs without verification (Initiative). This generates support tickets ("Why did it forget me?") and product risk ("It hallucinated, I thought it was smart").
  *   **Enrichment:** **Fail.** Future features (API hooks, deterministic modes) break the "human" categorization.
  *   **Verdict:** **Kill.**
      *   *Plain Talk:* I am killing this. It imports a "Theory of Mind" that the software does not possess. It encourages users to treat a statistical engine as a psychological agent. Every time a user gets mad at the "intern" for not "listening," that is a support ticket caused by this analogy. It is cognitively dishonest.

  ### Candidate 3: Version History as "Parallel Universes"
  *   **Source Availability:** **Pass.** High familiarity among devs via Git + Sci-Fi literacy.
  *   **Naive Theory:**
      1.  Timelines diverge at decision points.
      2.  Events in one universe do not affect others (until they merge/collapse).
      3.  You can travel between them.
      4.  There is no single "true" timeline.
  *   **Entailments:**
      1.  If I edit Version A, Version B stays safe.
      2.  I can switch my view to Version B instantly.
      3.  Merging is a complex event (universes colliding).
  *   **Truth & Harm:**
      *   *Isolation:* **True.** Branches are isolated.
      *   *Travel:* **True.** Checkout/switch.
      *   *No "True" Timeline:* **True/False.** Depends if you have a `main` branch. But conceptually, versions are peer states.
      *   *Harm Assessment:* **Low Risk.** The only misfit is that universes rarely "merge" in fiction, whereas branches do. But "Merge" is already standard dev vocabulary.
  *   **Enrichment:** **Pass.** "Branching," "Divergence," "Timeline" all fit.
  *   **Verdict:** **Pass.** It captures the non-linear, isolated, switchable nature of version control without implying false causal mechanics.

  ---

  ## Part 3: Meta-Analysis

  ### What the Procedure Cannot Decide
  1.  **Emotional Resonance:** The procedure tests for cognitive safety, not marketing stickiness. "Parallel Universes" is cooler than "Branches," but the procedure can't quantify if "cool" drives adoption enough to risk the slight terminology friction.
  2.  **Cultural Drift:** Source domains rot. "Pipe" meant plumbing to everyone in 1990; today, it might mean streaming data pipelines (recursive analogy). The procedure assumes a static source domain.
  3.  **Political Capital:** If the CTO loves "Intern" because it sounds friendly to investors, this procedure provides the ammo to fight it, but it cannot pull the trigger. That is the "Human Hand-off."

  ### Which Verdict is Most Likely Wrong?
  **"Parallel Universes" is the most likely to be wrong.**

  **Why:** The procedure assumes the audience shares the *Sci-Fi* definition of Parallel Universes. However, the dominant cultural model of "Parallel Universes" (Marvel/DC) implies they **never touch**. In Git/Versioning, branches are *meant* to merge. If your users' naive theory of "Parallel Universes" is "separate realities that coexist but never interact," they will be confused when you introduce "Merge Conflicts." They will ask, "Why did the other universe crash into mine?"

  **What Would Flip It:**
  If your versioning system is **immutable forks** (like some blockchain or data lake structures) where merging is impossible or rare, the analogy holds perfectly. If your system is **Git-like branching** where merging is the primary goal, the analogy fights the workflow.
  *   **Flip Condition:** If >50% of user actions involve merging branches, drop "Universes." Use "Timelines" (which imply flow) or stick to "Branches." "Universes" implies separation; "Branches" implies reunion.

  ### Final Recommendation
  1.  **Adopt "Parallel Universes"** for Version History, but add a glossary definition that explicitly handles the "Merge" exception.
  2.  **Discard "Well-Read Intern."** Replace with "Engine" or "Processor" framing, or simply describe capability ("The model generates...") without anthropomorphizing.
  3.  **Audit "Narrow Pipe."** Check your rate limiter implementation. If it drops requests, switch to "Turnstile" or "Gate." If it queues, "Pipe" is safe.
