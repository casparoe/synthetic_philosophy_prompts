answer: |-
  This specification separates the philosophical conditions for precedent autonomy from the administrative conditions for statutory enactment. It treats your eight cases as stress tests for the requirements rather than as the requirements themselves.

  ### I. Specification of Requirements for an Adequate Account

  An account is adequate for your committee only if it satisfies the following requirements. Each is marked for its status in the current literature and practice.

  1.  **The Administrative Tractability Requirement**
      The account must yield a determinate decision rule (follow, override, or modify) executable by a non-specialist committee within a clinical timeframe (hours), relying only on evidence available in the medical record or from immediate surrogates.
      *   *Status:* [NU] for statutory drafting; [C] for moral philosophy.
      *   *Note:* This explicitly excludes theories requiring longitudinal psychological assessment or metaphysical inquiry.

  2.  **The Burden of Proof Requirement**
      The account must specify the default position when evidence is equivocal: Does the written directive stand unless revoked (presumption of continuity), or is it merely evidence of past values subject to being outweighed by present expression (presumption of present authority)?
      *   *Status:* [C].
      *   *Operationalization:* Statutory language must assign the burden (e.g., "clear and convincing evidence" to override vs. "preponderance" to follow).

  3.  **The Competence Asymmetry Requirement**
      The account must define whether the capacity threshold to *revoke* or *override* a directive must equal, exceed, or may be lower than the capacity threshold required to *execute* the directive initially.
      *   *Status:* [C].
      *   *Distinction:* Do not collapse *legal competence* (status) with *decisional capacity* (functional ability).

  4.  **The Epistemic vs. Authority Distinction**
      The account must state whether the directive binds because the earlier self had *authority* (right to rule) or because the earlier self had *epistemic privilege* (knew the later self's values better). If the latter, the account must specify what happens when the present self demonstrates better knowledge of their current state (e.g., Case 2, The Convert).
      *   *Status:* [C].
      *   *Unoperationalizable Marker:* Determining "true values" vs. "transient states" is often metaphysically real but legally indeterminate at the bedside.

  5.  **The Harm Conception Requirement**
      The account must define the locus of harm: Is harm constituted by the frustration of the earlier self's critical interests (dignity, narrative integrity) or the present self's experiential interests (pain, pleasure, contentment)?
      *   *Status:* [C].
      *   *Case Reference:* Directly addresses Case 1 (Contented Dementia).

  6.  **The Identity Continuity Requirement**
      The account must specify whether psychological discontinuity (Case 8, Transformation Clause) voids the directive *ab initio* or merely provides grounds for override. It must state whether "personhood" is a biological or psychological legal category.
      *   *Status:* [CC] (Identity View); [NU] (Current Law presumes biological continuity).
      *   *Unoperationalizable Marker:* There is no clinical test for "same person" distinct from "same human organism."

  7.  **The Factual Error Distinction**
      The account must provide a rule for distinguishing mistakes about the *world* (prognosis, treatment effects) from changes in *values*. The former may void the directive; the latter may not.
      *   *Status:* [C].
      *   *Case Reference:* Case 6 (Factual Error).

  8.  **The Precommitment Force Requirement**
      The account must state whether a self can bind a future self who is currently competent but temporarily impaired by a condition (e.g., mania, addiction) that the directive anticipates.
      *   *Status:* [CC] (Precedent Authority); [C] (General Bioethics).
      *   *Case Reference:* Case 3 (Psychiatric Ulysses) and Case 4 (Addiction).

  9.  **The Scope Limitation Requirement**
      The account must define the boundary between medical treatment decisions and broader life projects (e.g., destruction of manuscripts, financial disposition).
      *   *Status:* [NU] for Health-Care Statutes; [C] for Moral Theory.
      *   *Case Reference:* Case 7 (Beyond Medicine).

  10. **The Third-Party Standing Requirement**
      The account must specify who has standing to invoke the directive against the present patient's wishes (surrogates only? treating team? state?) and who has standing to challenge it.
      *   *Status:* [NU] for Statute; [C] for Theory.
      *   *Case Reference:* Case 8 (Continuing-Self Model/AI prediction).

  ### II. Audit of Your List and Empirical Claims

  **Audit of Cases:**
  *   **Cases 1–7:** These are canonical in bioethics (Dworkin, Dresser, Robertson, Buchanan). They are not prejudices but standard stress tests. However, **Case 7 (Beyond Medicine)** is a category error for a *health-care* statute. Including it risks expanding the statute beyond HIPAA/medical jurisdiction unless you explicitly define "health care" to include "identity-constituting projects," which is legally novel and risky.
  *   **Case 8 (The Two New Instruments):**
      *   *Transformation Clause:* This is a **Camp Commitment** (Identity View). Current law does not recognize self-declared death of personhood while the organism lives. Including this requires creating new law, not revising existing models.
      *   *Continuing-Self Model (AI Prediction):* This is **Speculative**. There is no settled law on algorithmic standing. Treating this as a co-equal case with dementia or conversion presupposes a technological determinism that is not yet empirically grounded.

  **Audit of Empirical Claims:**
  *   *"Many people with advanced dementia are not well described as suffering."*
      *   **Status:** [Contested]. Longitudinal studies (e.g., *Menon et al.*, *Cohen-Mansfield*) show heterogeneous affect. Some show preserved positive affect; others show high rates of agitation/depression not captured by self-report. It is unsafe to legislate based on the premise that dementia is necessarily contented.
  *   *"Directives are frequently unavailable or unheeded at the point of care."*
      *   **Status:** [Established]. Multiple studies (e.g., *Sabo et al.*, *JAMA Internal Medicine*) confirm low retrieval rates and variable adherence in emergency settings.
  *   *"Stated treatment preferences drift and directives are rarely revisited."*
      *   **Status:** [Established]. Empirical bioethics consensus confirms preference instability over time and low rates of directive updating.

  **What You Missed:**
  *   **The Surrogate Conflict Case:** You list Directive vs. Surrogate vs. Team. You missed **Surrogate vs. Surrogate** (e.g., spouse invokes directive, adult child claims patient changed mind verbally). The account must rank surrogate authority.
  *   **The Emergency Exception:** Any statutory account must specify when the "hours" requirement collapses into "minutes," suspending the inquiry in favor of preservation of life.
  *   **The Revocation Standard:** You focus on the directive's authority. You must also specify the standard for *informal revocation* (e.g., oral statement to nurse vs. written instrument).

  ### III. Incompatible Pairs (Collisions)

  These are pairs of requirements that cannot be jointly satisfied. You must choose one over the other; you cannot legislate both.

  1.  **Absolute Respect for Contemporaneous Competence vs. Binding Precommitment (Ulysses)**
      *   *Conflict:* If you require that a competent present refusal *always* overrides (liberal autonomy), you cannot enforce Psychiatric Ulysses contracts (Case 3). If you require Ulysses contracts to be enforceable, you must authorize overriding a competent present refusal.
      *   *Resolution:* Statutes typically prioritize present competence, making Ulysses clauses legally fragile.

  2.  **Metaphysical Precision (Identity) vs. Administrative Tractability (The Afternoon)**
      *   *Conflict:* If you require the theory to respect the "Transformation Clause" (Case 8), you require an inquiry into psychological continuity that cannot be completed in hours at a bedside. If you require a decision in an afternoon, you must presume biological continuity, rendering the Transformation Clause legally inert.
      *   *Resolution:* Statutory law almost always sacrifices metaphysical precision for administrative finality.

  3.  **Epistemic Humility vs. Substituted Judgment**
      *   *Conflict:* If you acknowledge that the earlier self *cannot know* the future self's values (Case 2, The Convert), you undermine the authority of the directive. If you assert the directive's authority, you must presume the earlier self's epistemic privilege persists despite evidence of change.
      *   *Resolution:* Most statutes split the difference: Directive controls unless there is evidence of *specific* revocation, ignoring general value drift.

  ### IV. The Exclusionary Requirement

  The single requirement that does the most exclusionary work is:
  **The Administrative Tractability Requirement (Decision within hours, bedside evidence only).**

  *   **Why:** This eliminates the **Identity View** (requires deep psychological inquiry), the **Supported Decision-Making View** (requires long-term relationship building and cannot be reduced to a document-based rule), and the **Continuing-Self/AI Model** (requires data access and validation impossible in acute care).
  *   **Consequence:** It forces the statute into a binary choice between **Precedent Authority** (follow the document) and **Best Interests** (what seems best now), excluding nuanced relational or metaphysical accounts regardless of their moral superiority.

  ### V. Compressed Scorecard

  | Position Type | Case 1 (Contented Dementia) | Case 3 (Psych Ulysses) | Case 8 (Transformation/AI) | Statutory Fit |
  | :--- | :--- | :--- | :--- | :--- |
  | **Precedent Authority**<br>*(Dworkin, Buchanan)* | Follow Directive.<br>Critical interests > Experiential. | Enforce Directive.<br>Authority binds future competence. | Transformation Clause: Void if identity broken.<br>AI: Evidence only. | **High.**<br>Fits document-based models. |
  | **Evidentiary / Best-Interests**<br>*(Dresser, Robertson)* | Override Directive.<br>Present suffering trumps past values. | Override Refusal.<br>Present competence is sovereign. | Transformation: Irrelevant.<br>AI: Strong evidence of values. | **High.**<br>Fits "best interest" statutory defaults. |
  | **Identity View**<br>*(Wilkes, Schechtman)* | Void Directive.<br>If "different person," instruction is from a stranger. | Void Directive.<br>Manic self is distinct from remission self. | Transformation: Decisive.<br>AI: Could establish identity. | **Low.**<br>Legally unoperationalizable (no test for identity). |
  | **Supported Decision-Making**<br>*(Bach, Kerzner)* | Reframe Question.<br>Support present capacity to decide on antibiotics. | Reframe Question.<br>Support capacity to manage mania/meds. | Transformation: Irrelevant.<br>AI: Tool for support, not authority. | **Very Low.**<br>Relational, not rule-based; resists codification. |

  **Thinkers Associated:**
  *   *Precedent Authority:* Ronald Dworkin (*Life's Dominion*), Allen Buchanan.
  *   *Evidentiary/Best-Interests:* Rebecca Dresser, John Robertson.
  *   *Identity View:* Kathleen Wilkes, Marya Schechtman.
  *   *Supported Decision-Making:* Michael Bach, Lana Kerzner.

  ### VI. Settled vs. Contested Summary

  *   **Settled (Legal/Statutory):** Directives are revocable by the competent patient; biological continuity is presumed; emergency preservation of life overrides inquiry.
  *   **Settled (Empirical):** Directives are often unavailable; preferences drift.
  *   **Contested (Moral/Philosophical):** Whether the earlier self has authority over the later self; whether dementia creates a new person; whether Ulysses contracts are morally permissible.
  *   **Contested (Legal Implementation):** The weight of the directive vs. surrogate judgment; the standard for informal revocation.

  **Recommendation for the Committee:**
  Do not attempt to legislate the **Identity View** or **Supported Decision-Making** as primary frameworks. They fail the **Administrative Tractability Requirement**. Your statute must choose between **Precedent Authority** (with strict revocation standards) and **Evidentiary Weight** (directive is one input among many). The "Two New Instruments" (Case 8) should be treated as *evidence of values* (Evidentiary View) rather than sources of *authority*, to avoid metaphysical quagmires unresolvable in an afternoon.
