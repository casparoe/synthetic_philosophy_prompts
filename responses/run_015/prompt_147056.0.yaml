      *   **Tension B: (1) & (5) vs. (6).**
          *   (1) Past doesn't exist. (5) Traces exist now. (6) Causation is present-to-present.
          *   *Analysis:* If causation is only present-to-present, how do we explain change? Usually, causation is diachronic (Past A causes Present B). If only the present exists, "Past A" doesn't exist to cause anything. The user tries to solve this by saying "Present states cause Present states." But this looks like occasionalism or a block of "nows" without genuine connection. If I reject backward causation in delayed choice because the past doesn't exist, that's consistent with (1), but it makes (6) very restrictive. Is (6) *forced* by (1)? Yes, if the past doesn't exist, it can't be a relatum in a causal relation.
