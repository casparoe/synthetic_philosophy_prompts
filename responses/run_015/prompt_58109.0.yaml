prompt: |-
  hey so I'm TA-ing this intro epistemology section and the week on stakes and knows always dies, everyone just nods along. I wanna make a little which camp are you really in quiz they can do in like 15 mins to start an arguement.

  Can you write me 7 questions, each one is a mini story with 2-3 gut-reaction answers, totally no jargon in the questions themselves. Like don't ever ask do you endorse contextualism, I want you to sort them by their reactions not by which label they think sounds cool.

  At the end I need a scoring key that puts answer patterns into these 4 buckets I have to cover: 1) stakes never change whether someone knows, 2) the stakes for the person doing the knowing can change whether they know, 3) the stakes/context of the person *talking* about knowing can change whether its true to say they know, 4) knowledge stays put but what its ok to say or do with it shifts with stakes.

  Build it from the logical space first — like what combinations of answers are even possible — then tell me where my 4 buckets live in that space. If theres a combo that no one actually defends tell me if you think its incoherent or just unexplored, and be honest if your quiz can't really seperate any two of my buckets.

  You gotta work in these two stories I came up with, you can tweak the details:

  Maya at the campus cafe: low version is she overhears the soup has no peanuts and tells a regular who just doesn't like the taste, high version is same evidence but she's telling a parent ordering for a kindergarten field trip where one kid has a deadly allergy. Does she know its safe in each?

  And the surgeon one: Luis double-checked the chart once and is pretty sure its the left knee. Case X is two friends gossiping about it over beers the night before, case Y is the hospital review board deciding whether to say Luis knew it was the left knee. Same facts about Luis, different talkers.

  Audience is non-majors who have never heard of this stuff, so keep it plain and a bit funny if you can.
reasoning: |-
  Here's a thinking process that leads to the suggested quiz:

  1.  **Analyze the Request:**
      *   **Goal:** Create a 15-minute "Which camp are you really in?" quiz for an intro epistemology section on "Stakes and Knowledge."
      *   **Problem:** The topic usually "dies" (students nod along, no engagement). Needs to spark argument.
      *   **Format:** 7 questions, mini-stories, 2-3 gut-reaction answers, *no jargon* in questions.
      *   **Scoring Key:** Must sort students into 4 specific buckets:
          1.  Stakes *never* change knowledge (Invariantism).
          2.  Stakes for the *knower* change knowledge (Subject-Sensitive Invariantism/SSI).
          3.  Stakes/context of the *speaker* change truth of knowledge claims (Contextualism).
          4.  Knowledge stays put, but *assertion/action* norms shift (Pragmatic Encroachment/Warranted Assertability Maneuver - though the prompt describes it as "knowledge stays put but what its ok to say or do with it shifts").
      *   **Required Content:** Must incorporate two specific scenarios:
          *   Maya at the cafe (Soup/Peanut allergy: Low vs. High stakes for the *subject*).
          *   Luis the surgeon (Left knee: Low vs. High stakes for the *attributor/speaker*).
      *   **Methodology:** Build from logical space first (combinations of answers), map the 4 buckets, identify incoherent/unexplored combos, acknowledge limitations.
      *   **Tone:** Plain English, non-majors, a bit funny.

  2.  **Deconstruct the 4 Buckets (The Logical Space):**
      *   Let $K$ = "S knows that p."
      *   Let $S$ = Subject (the knower).
      *   Let $A$ = Attributor (the person saying "S knows").
      *   Let $Stakes_S$ = Stakes for the Subject.
      *   Let $Stakes_A$ = Stakes for the Attributor.

      *   *Bucket 1 (Strict Invariantism):* $K$ is independent of $Stakes_S$ and $Stakes_A$. (Knowledge is hard facts only).
      *   *Bucket 2 (SSI/Pragmatic Encroachment on Knowledge):* $K$ depends on $Stakes_S$. (If it matters more to *you*, you need more evidence to *know*).
      *   *Bucket 3 (Contextualism):* $K$ depends on $Stakes_A$. (Whether it's *true to say* "you know" depends on my context).
      *   *Bucket 4 (Knowledge Fixed, Action/Assertion Varies):* $K$ is independent of stakes, but *Assertability* ($A$) or *Action* depends on stakes. (You know it, but don't say it/act on it if stakes are high).

      *   *Logical Tension:* Bucket 2 and Bucket 4 often look the same in practice ("Don't act like you know in high stakes"), but the *reason* differs (Bucket 2: You don't *know*. Bucket 4: You *know*, but it's reckless to act). Bucket 3 is distinct because it focuses on the *speaker's* context, not the subject's.

  3.  **Drafting the Questions (Iterative Process):**
      *   *Constraint:* 7 Questions. Must use Maya and Luis stories. Need to probe Subject Stakes, Attributor Stakes, and Action vs. Knowledge distinctions.
      *   *Tone:* Fun, accessible.

      *   *Q1 (Maya Low):* Baseline. Soup, regular customer. Does she know? (Most say Yes).
      *   *Q2 (Maya High):* Stakes for Subject rise. Allergy. Does she know? (Split: Yes/No).
      *   *Q3 (Maya Action):* If she says "It's safe" in High Stakes, is she lying? (Distinguishes Knowledge vs. Assertion).
      *   *Q4 (Luis Low):* Friends gossiping. Did Luis know? (Most say Yes).
      *   *Q5 (Luis High):* Review board. Did Luis know? (Tests Attributor Context).
      *   *Q6 (The Bank Case variant/General Intuition):* A generic scenario to check consistency. Let's make it about a train schedule.
      *   *Q7 (The "Gotcha"):* Directly pits Knowledge against Action. "You know it, but should you bet the farm?"

      *   *Refining for the Buckets:*
          *   To separate Bucket 2 (SSI) from Bucket 4 (Action Norms), I need questions where they give different answers.
          *   SSI: High stakes = No Knowledge.
          *   Action Norms: High stakes = Knowledge exists, but Action is forbidden.
          *   To separate Bucket 3 (Contextualism), I need to vary the *speaker's* stakes while holding the *subject's* facts constant (The Luis scenario is perfect for this).

      *   *Revision:* I need to ensure the answer choices allow for the scoring. Each question needs options that map to the buckets.
      *   *Problem:* If I just ask "Does she know?", I can't distinguish Bucket 1 from Bucket 4 easily (both say "Yes, she knows"). I need to ask about *truth* vs. *appropriateness*.
      *   *Solution:* Make the answer choices specific gut reactions.
          *   Option A: She knows/It's true. (Invariantist/Contextualist in low context).
          *   Option B: She doesn't know/It's false. (SSI/Contextualist in high context).
          *   Option C: She knows, but shouldn't say/act. (Action Norms).

      *   *Wait, 7 Questions is a lot for 15 mins if they are long stories.* I need to keep them tight.
      *   *Let's group them:*
          *   Q1-2: Maya (Subject Stakes).
          *   Q3-4: Luis (Attributor Stakes).
          *   Q5-7: Mixed/Action vs. Knowledge.

  4.  **Mapping the Logical Space & Buckets:**
      *   Let's define the variables for the scoring key.
      *   Variable 1: Subject Stakes Sensitivity (Does Maya's knowledge change?).
      *   Variable 2: Attributor Stakes Sensitivity (Does the truth of the claim about Luis change based on who is talking?).
      *   Variable 3: Knowledge vs. Action Distinction (In high stakes, is the problem *knowledge* or *behavior*?).

      *   *Bucket 1 (Invariantist):* Sub Stakes = No change. Attr Stakes = No change. Know/Act = Distinct (or Know is high bar).
      *   *Bucket 2 (SSI):* Sub Stakes = Changes Knowledge. Attr Stakes = No change (usually).
      *   *Bucket 3 (Contextualist):* Sub Stakes = No change (to the fact), but Truth of claim changes based on Attr.
      *   *Bucket 4 (WAM/Pragmatic):* Sub Stakes = No change to Knowledge. Changes Action/Assertion.

      *   *Incoherent Combos:*
          *   If someone says "Attributor stakes change knowledge" but "Subject stakes don't," that's pure Contextualism.
          *   If someone says "Subject stakes change knowledge" AND "Knowledge is the same but action changes," that's contradictory *unless* they distinguish "Real Knowledge" vs "Practical Knowledge." I need to watch out for students who pick both.
          *   *Honesty Check:* Can the quiz separate Contextualism (3) from SSI (2)? Yes, via the Luis case. In SSI, Luis's knowledge depends on *Luis's* stakes (which are constant in the prompt). In Contextualism, it depends on the *Board's* stakes.
          *   *Honesty Check:* Can it separate Invariantism (1) from Action-Norms (4)? This is the hardest. Both say "She knows" in high stakes. The difference is "Is it okay to act?" Invariantists might say "Yes, if you know, act." Action-Norms say "No, don't act." I need a question specifically about *permission to act* vs *truth of claim*.

  5.  **Drafting the Content (incorporating tone):**
      *   Keep it snappy. "Café Catastrophe," "Surgical Scrutiny."
      *   Answer choices need to be "Vibe checks," not philosophical definitions.

  6.  **Developing the Scoring Key:**
      *   I need to assign points or patterns to the 4 buckets.
      *   Let's create a "Profile" for each bucket based on expected answers.
      *   *Bucket 1 (The Rock):* Knowledge is solid. Stakes don't matter.
      *   *Bucket 2 (The Pragmatist):* High stakes kill knowledge.
      *   *Bucket 3 (The Chameleon):* Who's asking matters.
      *   *Bucket 4 (The Safety Officer):* You know it, but don't touch it.

      *   *Critique of the Prompt's Buckets:*
          *   Bucket 2 (SSI) and Bucket 4 (Action Norms) are the trickiest to separate. SSI says "You don't know." Bucket 4 says "You know, but don't act."
          *   If a student answers "She knows" (Bucket 1/4) but "She shouldn't say it" (Bucket 4), they are Bucket 4.
          *   If a student answers "She doesn't know" (Bucket 2/3), they are not Bucket 4.
          *   I need to make sure the scoring key acknowledges that some students will be hybrids or confused.

  7.  **Final Review against Constraints:**
      *   7 Questions? Yes.
      *   Mini-stories? Yes.
      *   No jargon in questions? Yes.
      *   Scoring key with 4 buckets? Yes.
      *   Logical space analysis included? Yes.
      *   Maya and Luis stories included? Yes.
      *   Tone: Plain/Funny.

  8.  **Writing the Response:**
      *   *Section 1: Logical Space & Bucket Mapping.* (Be honest about the difficulty separating 1 and 4, and 2 and 3).
      *   *Section 2: The Quiz.* (Write the questions).
      *   *Section 3: Scoring Key.* (How to tally).
      *   *Section 4: TA Tips.* (How to run the discussion).

      *(Self-Correction during drafting)*: Make sure the Luis case clearly distinguishes Subject vs. Attributor stakes. In the prompt, Luis's stakes are constant (he's the surgeon), but the *talkers* change (friends vs. board). This is the classic Contextualism test. I need to make sure the question asks "Is it *true* to say Luis knew?" not "Did Luis feel sure?"

      *(Refining the "Action vs Knowledge" distinction)*: For Bucket 4, I need a question where the student admits the evidence is the same but says "Don't bet on it." That captures "Knowledge stays put, action shifts."

      *(Logical Space Check)*:
      *   Dim 1: Does Subject Stakes affect Knowledge? (Yes/No)
      *   Dim 2: Does Attributor Context affect Truth? (Yes/No)
      *   Dim 3: Does High Stakes prohibit Action even if Knowledge is present? (Yes/No)
      *   Bucket 1: No, No, No (or N/A).
      *   Bucket 2: Yes, No, N/A.
      *   Bucket 3: No, Yes, N/A.
      *   Bucket 4: No, No, Yes.
      *   *Incoherent:* Yes, Yes (Maybe a hybrid view, but rare for intro students). Yes, Yes, Yes (Total skepticism?).
      *   *Hard to Separate:* 1 and 4. Both say "Knowledge is stable." 4 says "Action is restricted." 1 usually says "If you know, you can act." I need a question that forces a choice between "You know it" and "You can act on it."

      *Let's finalize the questions to target these dimensions.*

      *   Q1 (Maya Low): Baseline Knowledge.
      *   Q2 (Maya High): Subject Stakes effect on Knowledge.
      *   Q3 (Maya High): Subject Stakes effect on Action (if they said Yes to Q2).
      *   Q4 (Luis Friends): Baseline Attributor.
      *   Q5 (Luis Board): Attributor Stakes effect on Truth.
      *   Q6 (Train Case): General intuition on evidence vs. stakes.
      *   Q7 (The "Lie" Test): Distinguishes Falsehood vs. Misleading Truth (Bucket 4).

      *Wait, 7 questions might be tight for 15 mins including scoring.* I'll keep the text very short.

      *Okay, ready to write.*
answer: |-
  Here is the logical breakdown, the quiz, and the scoring key, designed to wake up a sleepy section.

  ### Part 1: The Logical Space (TA Cheat Sheet)

  Before you hand this out, here is the map of the territory. You are testing three variables:
  1.  **Subject Sensitivity:** Does the *knower's* risk change if they know?
  2.  **Attributor Sensitivity:** Does the *speaker's* context change if the claim is true?
  3.  **Action/Knowledge Split:** Can you know something but be forbidden from acting on it?

  Here is where your 4 buckets live in that space:

  *   **Bucket 1 (The Rock / Strict Invariantism):** Knowledge is hard facts. Stakes don't matter. If you have the evidence, you know. If you know, you can act.
      *   *Pattern:* Subject Stakes = No Effect. Attributor Context = No Effect. Action = Permitted.
  *   **Bucket 2 (The Pragmatist / SSI):** High stakes raise the bar for knowledge. If it matters more to *you*, you need more proof to "know."
      *   *Pattern:* Subject Stakes = Changes Knowledge.
  *   **Bucket 3 (The Chameleon / Contextualism):** Knowledge is fixed, but the *word* "know" is flexible. It depends on who is talking.
      *   *Pattern:* Subject Stakes = No Effect. Attributor Context = Changes Truth of claim.
  *   **Bucket 4 (The Safety Officer / Warranted Assertability):** Knowledge is fixed, but *responsibility* shifts. You might know it, but it's reckless to say it or bet on it.
      *   *Pattern:* Subject Stakes = No Effect on Knowledge. Action/Assertion = Restricted.

  **The Hard Truths:**
  *   **Bucket 1 vs. Bucket 4 is messy.** Both agree "She knows." The only difference is whether she's allowed to *say* it. If a student picks "She knows" and "She should tell them," they could be either. You'll have to pry them open in discussion.
  *   **Bucket 2 vs. Bucket 3 is the main fight.** Both result in "It's false to say she knows in the high stakes case." The difference is *why*. (Is it because *she* doesn't know? Or because *you* can't say it?) The Luis scenario is designed to split these.
  *   **Incoherent Combo:** If a student says "Subject stakes change knowledge" AND "Attributor stakes change knowledge," they are essentially double-counting. It's not logically impossible, but it's a rare view (sometimes called "Radical Contextualism"). Treat them as Bucket 3 for the sake of argument.

  ***

  ### Part 2: The "Do You Actually Know Stuff?" Quiz
  **Time:** 15 Minutes.
  **Instructions:** Don't overthink. Pick the answer that feels right in your gut. There are no right answers, only different kinds of trouble.

  **1. The Cafe (Low Stakes)**
  Maya hears the chef say, "The soup has no peanuts." She tells a customer who just hates the taste of peanuts.
  *   A) Maya knows the soup is safe.
  *   B) Maya doesn't really know; she just heard it from someone.
  *   C) She knows enough for lunch, but not for science.

  **2. The Cafe (High Stakes)**
  Same evidence. Maya tells a parent ordering for a field trip where one kid has a deadly peanut allergy.
  *   A) Maya still knows it's safe. Facts are facts.
  *   B) Maya doesn't know anymore. The risk is too high.
  *   C) She knows it, but she shouldn't say she does.

  **3. The Cafe (The Lie Test)**
  In the High Stakes version (the allergy kid), Maya says "It's safe" and the kid gets sick. Did Maya lie?
  *   A) Yes, she said something false.
  *   B) No, she said what she believed, but she was reckless.
  *   C) Yes, because in this situation, "I know" means "I'm 100% sure."

  **4. The Surgeon (The Bar Chat)**
  Luis the surgeon checks the chart once. It says "Left Knee." He tells his buddy over beers, "I know it's the left knee."
  *   A) True. He checked the chart.
  *   B) False. He should have checked twice.
  *   C) It's true for a bar chat, but maybe not for surgery.

  **5. The Surgeon (The Review Board)**
  Same facts. Luis checked once. Now the Hospital Review Board asks: "Did Luis know it was the left knee?"
  *   A) Yes. He checked the chart. What he knows doesn't change because you're asking.
  *   B) No. For the Board, checking once isn't enough to count as "knowing."
  *   C) Yes he knew, but it's misleading for the Board to say he did without noting the risk.

  **6. The Train Home**
  You need to get home for a wedding. You see a schedule saying the train stops at your station.
  *   **Case A:** If you miss it, you're annoyed. **Case B:** If you miss it, you miss the wedding.
  *   In Case B, do you need *more evidence* to say you know the train stops there?
  *   A) No. Evidence is evidence.
  *   B) Yes. I need to ask the conductor.
  *   C) I have the same evidence, I just shouldn't bet on it.

  **7. The "I Know" Bet**
  Your friend says, "I know the game starts at 8." You say, "Bet me $1000 on it." They say, "No way."
  *   A) They were lying. If they knew, they'd bet.
  *   B) They know it, but they're not crazy.
  *   C) They don't actually know it. They just believe it.

  ***

  ### Part 3: Scoring Key & Discussion Guide

  Have students tally their own answers. Don't give them the philosophical labels yet. Just give them the "Personality."

  **Mostly A's: The Rock (Bucket 1)**
  *   **View:** Knowledge is about evidence and truth, period. Stakes are emotional; knowledge is factual.
  *   **Discussion Prompt:** "If Maya knows the soup is safe (A on Q2), why is it weird for her to tell the allergic parent? If knowledge is the green light for action, why does the light turn red when the kid is allergic?"

  **Mostly B's: The Pragmatist (Bucket 2)**
  *   **View:** Stakes change the facts of knowledge. High stakes = higher bar for evidence.
  *   **Discussion Prompt:** "Did Maya's evidence change between the regular customer and the allergic kid? No. So how did her *knowledge* change if her brain didn't? Did she lose knowledge, or did the definition of 'know' get stricter?"

  **Pattern: Q1/Q4 (Yes) but Q2/Q5 (No/Context): The Chameleon (Bucket 3)**
  *   **View:** It depends on who is talking. The surgeon knew for the buddy, but didn't "know" for the Board.
  *   **Discussion Prompt:** "This implies 'knows' is like 'tall.' Luis is tall for a jockey, short for a basketball player. Is knowledge relative to the speaker? If so, can two people disagree and both be right?"

  **Pattern: Q2 (Knows) + Q3 (Reckless) + Q7 (Knows/Not Crazy): The Safety Officer (Bucket 4)**
  *   **View:** Knowledge stays put, but permission to act shifts.
  *   **Discussion Prompt:** "You said Maya *knows* (Q2) but shouldn't *say* it (Q3). So what is 'knowledge' for? If I can't act on it, speak on it, or bet on it... do I actually have it? Or is 'knowledge' just a label for 'evidence I have'?"

  **Mixed/Other:**
  *   **View:** You're oscillating, which is normal.
  *   **Discussion Prompt:** "You said stakes change knowledge for Maya (Q2) but not for the Surgeon (Q5). Why? Is it because Maya is the actor, but the Surgeon is being judged? Does it matter who holds the risk?"

  ### TA Tips for the "Argument"
  1.  **Force the Conflict:** If the room agrees, play Devil's Advocate. If everyone is "Rocks," ask: "Would you let Maya feed the allergic kid based on what she heard from the chef? No? Then in what sense does she 'know'?"
  2.  **The "So What?" Test:** When a student defends Bucket 4 (Knowledge fixed, Action shifts), ask: "If I can't teach it, bet on it, or act on it, what work is the word 'know' doing? Why not just say 'I have evidence'?"
  3.  **Use the Luis Case for Contextualism:** This is the hardest one. If they say the Board is right (Luis didn't know) but the Buddy was right (Luis did know), press them: "So did Luis lose his knowledge when he walked into the boardroom? Or did the *word* change meaning?"

  This setup forces them to realize that their gut reactions about "truth," "action," and "language" are pulling them in different directions. That friction is where the philosophy lives.
