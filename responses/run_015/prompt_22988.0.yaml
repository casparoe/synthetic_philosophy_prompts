      *   **Houthakker & The Strong Axiom (SARP):** Moving from WARP to SARP allows for the reconstruction of a utility function. This shifts from "describing choices" to "testing for consistency."
      *   **The Tautology Charge:** If preferences are defined by choices, the theory is unfalsifiable (tautological).
      *   **The Normative Turn:** RPT actually imposes structural constraints (axioms) on choices. If choices violate these, the agent is labeled "irrational."
      *   **Mentalism vs. Behaviorism:** The modern consensus (e.g., Hausman, Sen, Gul & Pesendorfer) often leans towards RPT implicitly relying on a mentalistic notion of "good for the agent" or "welfare."
      *   **Amartya Sen's Critique:** "Rational Fools." Choice might not reveal preference (commitment, social norms).
      *   **Daniel Hausman's Analysis:** Preferences are beliefs about value. RPT tests the coherence of these beliefs.

