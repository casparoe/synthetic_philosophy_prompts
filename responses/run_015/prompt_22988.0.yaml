answer: |-
  Your student has put their finger on one of the most enduring and significant philosophical problems in economic methodology. Your discomfort is warranted because the standard textbook story often glosses over a fundamental ambiguity in Revealed Preference Theory (RPT): **Is it a definition of preference, or is it a theory about the structure of choice?**

  If it is a definition, the student is right: it is tautological and cannot detect irrationality. If it is a theory, it presupposes a normative standard of rationality that looks suspiciously like the mentalistic utility theory Samuelson sought to banish.

  Here is a breakdown of the philosophical terrain to help you sort this out for your seminar.

  ### 1. The Core Tension: Definition vs. Constraint

  The student's challenge rests on a logical dilemma that philosophers of economics (notably Daniel Hausman and Amartya Sen) have dissected extensively.

  *   **The Behaviorist Interpretation (Definition):** If "preferring $A$ to $B$" is *defined* as "choosing $A$ when $B$ is available," then every choice is, by definition, consistent with preference. There is no logical space for error. If I choose $A$ over $B$ today and $B$ over $A$ tomorrow, I simply have intransitive preferences. On this view, RPT is purely descriptive, but it is also unfalsifiable. It cannot call an agent "irrational," only "different."
  *   **The Rationalist Interpretation (Constraint):** If RPT is meant to test for rationality (e.g., via the Weak or Strong Axioms of Revealed Preference), then "preference" cannot be *just* the choice. There must be an underlying ordering that the choices are *trying* to reflect. If choices violate transitivity, the theory says the agent is irrational. But this implies the existence of a "true" preference ordering independent of the specific choices, which brings us right back to the mental state Samuelson wanted to eliminate.

  **The Verdict:** Revealed Preference Theory is **not** a purely descriptive reading of preferences off behavior. It is a hybrid that smuggles in a normative notion of rationality.

  ### 2. The Historical Shift: Samuelson to Houthakker

  To explain this to your students, it helps to distinguish between Samuelson's 1938 project and the subsequent formalization by Houthakker (1950).

  *   **Samuelson (1938):** His goal was operationalism. He wanted to purge economics of "utility" as a psychological sensation (hedonics). He proposed that we simply observe choices. At this stage, the student's critique is devastating. If preference is *only* choice, there is no room for inconsistency.
  *   **Houthakker (1950):** He introduced the **Strong Axiom of Revealed Preference (SARP)**. This was the turning point. Houthakker showed that if observed choices satisfy certain consistency axioms (transitivity, etc.), *then* we can mathematically construct a utility function that represents those choices.

  This shift changes the status of the theory. It is no longer just "preferences are choices." It becomes: **"If agents are rational, their choices will satisfy these axioms, and we can model them *as if* they maximize utility."**

  The axioms (WARP, SARP, GARP) are not derived from the data; they are imposed *upon* the data as a condition of intelligibility. If the data violates the axioms, the model breaks. Therefore, the axioms represent an independent standard of rationality.

  ### 3. Where does the "Rationality" come from?

  If RPT presupposes rationality, what is the status of that rationality if we aren't allowed to look inside the mind? There are three main philosophical positions you can present to your seminar:

  #### A. The "As-If" Instrumentalism (Friedman/Gul & Pesendorfer)
  This view accepts the student's critique but doesn't care. Proponents argue that economics is not about describing psychological reality but about predicting aggregate behavior.
  *   **Argument:** We assume agents satisfy RPT axioms because models that assume this work better predictively.
  *   **Problem:** This surrenders the claim that RPT *reveals* preference. It admits RPT is a modeling assumption, not an empirical discovery about the agent's mental state.

  #### B. The Mentalist Rehabilitation (Hausman)
  Daniel Hausman argues that RPT secretly relies on a mentalistic notion of preference.
  *   **Argument:** When economists say a choice violates WARP, they aren't just noting a pattern; they are claiming the agent is failing to pursue their own good consistently. This implies preferences are mental states (judgments of value) that choices *attempt* to execute but sometimes fail.
  *   **Implication:** RPT is actually a test of the correspondence between mental states and behavior. If so, Samuelson's behaviorism failed; we need introspection or welfare judgments to define the "true" preference that was violated.

  #### C. The Normative/Welfare View (Sen)
  Amartya Sen's famous critique, "Rational Fools," argues that choice does not always reveal preference because people act on commitment, duty, or social norms.
  *   **Argument:** If I choose to vote despite the cost (contrary to self-interest), RPT calls this irrational or posits a weird utility function. Sen argues we need a distinction between "choice preference" and "welfare preference."
  *   **Implication:** RPT conflates what I choose with what is good for me. To call a choice "inconsistent" is to make a welfare judgment that the agent is harming their own interests through incoherence.

  ### 4. How to Answer the Student (and Save the Theory)

  You can tell your student that their intuition is correct: **Pure behaviorism cannot support a test of rationality.** However, RPT survives by modifying the behaviorist claim.

  Here is the nuanced position you can offer:

  1.  **RPT is not a definition; it is a consistency condition.** It does not say "Preference = Choice." It says "If an agent is rational, their Choices will behave *as if* they are driven by a stable Preference ordering."
  2.  **The "Independent Standard" is Logical Coherence.** The standard of rationality is not a specific utility number, but the logical structure of ordering (transitivity, completeness). This is not "mentalistic" in the sense of measuring pleasure, but it is "rationalist" in the sense of demanding logical consistency.
  3.  **Utility is Rehabilitated as a Representation Theorem.** We don't need utility to be a mental substance. We only need it to be a mathematical representation of a consistent ordering. If choices are inconsistent, no utility function exists. Thus, the existence of a utility function is the *test* of rationality, not the *assumption*.

  ### 5. Seminar Takeaway

  For your seminar, I suggest framing the tension as the **"Operationalist Dilemma"**:

  *   **Horn 1:** If preferences are defined by choices, the theory is empty (tautological).
  *   **Horn 2:** If preferences constrain choices, the theory is empirical but relies on a normative assumption of consistency that behaviorism cannot justify.

  **The Resolution:** Modern economics generally accepts Horn 2 but treats the normative assumption as a "regulative ideal." We treat agents *as if* they are consistent because that is the only way to make their behavior intelligible as *action* rather than mere *motion*.

  So, to answer your specific question: **Revealed Preference Theory is not genuinely a purely descriptive reading.** It presupposes a notion of rationality (logical consistency over time and across contexts) that it imposes on the data. It claims to derive utility from data, but it only does so *conditional on the data satisfying the axioms of rational choice.* When the data fails, the theory doesn't say "utility is different"; it says "the agent is irrational." That judgment requires a standard external to the specific choice being observed.

  Your student has effectively uncovered that **behaviorism in economics is unsustainable without a hidden normative core.** Acknowledging this will not destroy RPT, but it will elevate your seminar from a technical review to a genuine philosophical inquiry.
