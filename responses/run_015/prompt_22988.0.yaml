      *   **User's Goal:** Sort out whether RPT is purely descriptive or if it presupposes a normative notion of rationality/utility that it claims to derive from data. They need to understand the descriptive vs. evaluative distinction in RPT.

  2.  **Deconstruct the Philosophical Issue:**
      *   The core tension is between *operationalism/behaviorism* (preferences = choices) and *normative rationality* (preferences should satisfy axioms like transitivity).
      *   If $A$ is chosen over $B$, then $A \succ B$. If later $B$ is chosen over $A$, then $B \succ A$.
      *   If preferences are *just* the choices, there's no contradiction. It's just a record: "Chose A then, chose B now."
      *   To call this a "violation" (e.g., of the Weak Axiom of Revealed Preference - WARP), we must assume preferences *should* be stable and transitive.
      *   This implies RPT isn't just a translation manual; it's a theory about how agents *ought* to behave if they are rational.

  3.  **Key Concepts to Address:**
