prompt: |-
  I'm the senior registrar at a regional museum — me and two others — and questions about whether something is still the same object land on my desk maybe twice a week, always sideways: is this the thing we insured, is this the thing the lender gets back, does the label reading 'original' have to come down, can we open a second accession number for the material we took out of it, does the object we promised to return still exist. The stakes are unglamorous but real — insurance valuations, loan contracts, our accreditation, and at the moment two return claims from source communities — and I get about half an hour a case, there's no philosopher on staff, and whatever I write has to survive both the collections committee and an auditor who will definately not accept "the conservator pointed at it" as a criterion.

  I've been reading round the statue and the clay business in my own time — the move where you say the statue is constituted by the clay but isn't identical with it, so you've got two things in one place with the same mass and the same weight, one of which survives being squashed and the other doesn't, plus that business about which sortal governs which object you've got — and I half get it, but I can't hand it to my team, and our catalogue lets a single object and its material carry separate accession numbers, which means the distinction is already half-built into our database without anyone having decided what it means. A mate who does loss adjusting laughed when I described the problem and said it's exactly the "substantial transformation" question the customs people argue about, which made me think we're probably reinventing something badly.

  So please turn this into a decision procedure my team can actually run in half an hour on a real case: the questions in order, what counts as a sufficient answer to each, where the procedure just stops with a no, and where it hands the decision to a named person because it's a question of what we owe rather than what's there. It has to cope with subtraction and accretion as well as replacement (we swapped a lens between two accessioned microscopes in the 1990s and nobody wrote it down), with cases where the matter is tracked separately from the object, and with cases where the only accessioned thing is a set of instructions or a digital file rather than a lump of anything. Mark clearly the points where judgement can't be squeezed out, and gloss any term of art in one line, because I'm not going to get my team to read metaphysics at the weekend. Then run it on three cases: (1) a bronze figure where roughly sixty per cent of the metal is modern infill and the original corroded fragments sit in a tray with their own number — one object or two, which one travels on loan, and what do we tell the insurer; (2) a work by a living artist consisting of a block of wax the artist instructs us to melt and recast annually from the same wax — the artist says the 2026 casting is the accessioned object, our insurer says it isn't; (3) a carved house post a source community has always treated as persisting through the replacement of every plank, which our records describe as a 1972 reconstruction with original elements and which the community wants returned as the thing taken in 1904. I'd like (3) to come out as the same object, so if your procedure won't give me that, say so plainly and tell me who has to decide instead. Finish by being honest about what the procedure cannot do — in particular whether it can tell me whether there's a fact of the matter here at all, or only what we should write on the form.
reasoning: |-
  Here's a thinking process that leads to the suggested decision procedure:

  1.  **Analyze the Request:**
      *   **User:** Senior Registrar at a regional museum.
      *   **Problem:** Ontological identity questions (is this the *same* object?) arising 2x/week regarding insurance, loans, accreditation, and repatriation.
      *   **Constraints:** 30 minutes per case, no philosopher on staff, must satisfy collections committee and auditors, needs to handle subtraction, accretion, replacement, and non-physical objects (files/instructions).
      *   **Input Knowledge:** User knows some metaphysics (statue/clay, sortals, constitution view) but needs a practical workflow, not theory. Friend mentioned "substantial transformation" (customs).
      *   **Output Requirements:**
          *   A decision procedure (flowchart-style logic).
          *   Questions in order, sufficient answers, stop points ("no"), escalation points ("named person").
          *   Glossary of terms (one line).
          *   Run the procedure on three specific cases (Bronze figure, Wax artwork, House post).
          *   Specific constraint on Case 3: User *wants* it to come out as the same object (for repatriation). If the procedure fails, admit it and say who decides.
          *   Honesty clause: What the procedure *cannot* do (fact of the matter vs. administrative decision).

  2.  **Deconstruct the Philosophical/Practical Tension:**
      *   *Metaphysics:* Persistence conditions (what makes $O_1$ at $t_1$ identical to $O_2$ at $t_2$?).
      *   *Bureaucracy:* Accession numbers, insurance values, legal title, ethical obligations.
      *   *The Gap:* Metaphysics often says "it depends on your concept of the object." Bureaucracy needs "Yes/No" for forms.
      *   *Solution:* A "Pragmatic Identity Protocol." It shouldn't try to solve the Ship of Theseus paradox universally but should route the question to the appropriate authority based on the *purpose* of the question (Insurance vs. Loan vs. Repatriation).

  3.  **Drafting the Decision Procedure (The "Museum Object Identity Protocol" - MOIP):**
      *   *Goal:* Triage. Not all identity questions are the same. An insurance question is different from a repatriation question.
      *   *Step 1: Define the Purpose.* Why are we asking? (Insurance, Loan, Accessioning, Repatriation). This dictates the criteria.
      *   *Step 2: Continuity of Record.* Is there an unbroken paper trail? (Provenance/Documentation).
      *   *Step 3: Material/Functional Integrity.* How much change? (The "Substantial Transformation" test).
      *   *Step 4: Authority Check.* Who gets to say what counts? (Artist, Community, Curator).
      *   *Step 5: The Verdict.* Administrative Identity vs. Ontological Identity.

      *Refining the Steps for the User's Constraints:*
      *   Needs to be fast (30 mins).
      *   Needs to handle the database quirk (object vs. material numbers).
      *   Needs to handle the "no philosopher" rule (simple language).
      *   *Crucial:* Needs to address Case 3 (Repatriation) specifically, as standard museum logic often fails there (museum says "reconstruction," community says "ancestor/spirit").

  4.  **Developing the Glossary:**
      *   Keep it operational.
      *   *Sortal:* The kind of thing it is (e.g., "vase" vs. "clay").
      *   *Constitution:* Made of this stuff, but isn't the stuff.
      *   *Substantial Transformation:* Changed enough to be a new product (Customs term).
      *   *Persistence Conditions:* Rules for staying the same thing over time.

  5.  **Running the Cases:**

      *   *Case 1 (Bronze Figure):* 60% infill. Original fragments separate.
          *   *Insurance:* Value is in the whole, but risk is split.
          *   *Loan:* Can the infill travel? Yes. Is it the "original"? Qualified yes.
          *   *Procedure:* Likely "Composite Object." One accession for the assembly, one for fragments.
      *   *Case 2 (Wax Artwork):* Melting/recasting.
          *   *Issue:* Artist says yes, Insurer says no.
          *   *Procedure:* This is an *Artist Authority* case. The definition lies with the creator, not the material.
          *   *Outcome:* It is the work, but insurance needs a special clause.
      *   *Case 3 (House Post):* Repatriation. 1972 reconstruction vs. 1904 taking.
          *   *User Constraint:* Wants it to be the "same object."
          *   *Problem:* Standard museum accession logic (material continuity) says "No." Community logic (functional/spiritual continuity) says "Yes."
          *   *Solution:* The procedure *must* flag this as an Ethical/Political decision, not a Registrar one. If the procedure says "No" based on material, the escalation path must override it for repatriation.
          *   *Honesty:* I need to tell the user that standard registration logic will fail Case 3 unless the "Purpose" step prioritizes Community Definition over Material Continuity.

  6.  **Refining the "Honesty" Section:**
      *   The procedure doesn't find truth; it assigns responsibility.
      *   It cannot solve the Ship of Theseus.
      *   It distinguishes between "Administrative Identity" (for the database) and "Moral Identity" (for repatriation).

  7.  **Drafting the Content (Iterative refinement for tone):**
      *   *Tone:* Professional, peer-to-peer, slightly weary but competent. No fluff.
      *   *Structure:*
          1.  Intro (acknowledging the mess).
          2.  Glossary (one-liners).
          3.  The Procedure (The "MOIP").
          4.  The Three Cases.
          5.  The Limitations (The "Honesty" clause).

      *Self-Correction on Case 3:* If I build a material-based test, Case 3 fails. If I build a purpose-based test, Case 3 passes *if* the purpose is Repatriation. I need to make sure the procedure asks "Who defines persistence for this class of object?" early on. For ethnographic items, the source community defines persistence. For fine art, the artist. For general history, the museum. This is the key to satisfying the user's wish for Case 3 without breaking logic.

  8.  **Final Polish:**
      *   Check time limit (30 mins).
      *   Check auditor proof (documentation trail).
      *   Check the "no philosopher" rule (keep terms grounded).
      *   Ensure the "Escalation" points are clear (Director/Trustees/Ethics Committee).

      *(Self-Correction during drafting)*: Make sure to explicitly mention the database quirk (Object vs. Material numbers). The procedure should validate using separate numbers for the "Constitution" (the clay) and the "Object" (the statue).

      *(Final check on Case 3)*: The prompt says "I'd like (3) to come out as the same object... if your procedure won't give me that, say so plainly." I must ensure the procedure allows for *social* continuity to override *material* continuity in specific contexts (Repatriation).

  9.  **Final Output Generation** (incorporating the above thoughts into the structured response).
answer: |-
  This is a bureaucratic ontology problem. You are not asking "What is this?" in a metaphysical sense; you are asking "Which bucket of risk and responsibility does this fall into?" The philosophy you've been reading (constitution view, sortals) is correct, but it's descriptive, not prescriptive. You need a prescriptive workflow that assigns authority.

  Below is the **Museum Object Identity Protocol (MOIP)**. It is designed to be run in 30 minutes. It does not solve the Ship of Theseus; it assigns who gets to steer the ship.

  ### Glossary of Terms (One-Liners)
  *   **Sortal:** The category that defines what a thing is (e.g., "Microscope" vs. "Metal"); determines what changes kill the object.
  *   **Constitution:** The relationship where an object is *made of* matter but isn't *identical* to it (the statue is constituted by the clay).
  *   **Substantial Transformation:** A change in form, name, or character sufficient to create a new commercial or legal entity (Customs term).
  *   **Persistence Conditions:** The specific rules for how long a specific type of object stays "itself" (e.g., a flame persists through fuel change; a rock does not).
  *   **Administrative Identity:** The status of the object within the museum database (Accession Number), distinct from physical continuity.

  ---

  ### The Museum Object Identity Protocol (MOIP)

  **Time Limit:** 30 Minutes.
  **Required:** Accession records, Conservation report, Loan/Insurance contract draft.

  #### Step 1: Define the Purpose of the Question
  *Why are we asking if this is the same object?*
  *   **A. Insurance/Valuation:** We need to know what is being indemnified (Material value vs. Cultural value).
  *   **B. Loan/Transport:** We need to know what physically moves and what risks it can survive.
  *   **C. Accessioning/Cataloguing:** We need to know if we create a new number or update the old one.
  *   **D. Repatriation/Restitution:** We need to know if we are returning the *thing* that was taken.

  *If A or B:* Proceed to Step 2.
  *If C:* Proceed to Step 3.
  *If D:* **STOP.** Skip to Step 4 (Authority Check). *Reason: Repatriation is not a material question; it is a political/ethical one. Material continuity is secondary to community continuity.*

  #### Step 2: The Substantial Transformation Test (For Insurance/Loan)
  *Does the object retain its primary function and market identity?*
  *   **Q:** Has the object lost its primary function? (e.g., A clock that cannot tell time).
      *   **Yes:** It is a "Fragment" or "Salvage." Update status to *Non-Functional*. Do not create new number.
      *   **No:** Proceed.
  *   **Q:** Is more than 50% of the original material lost or replaced?
      *   **Yes:** Flag for *Senior Registrar*. It is a "Composite." It remains the same Accession Number, but the Insurance Schedule must list "Original Material" and "Infill" separately.
      *   **No:** It is the same object for insurance.
  *   **Q:** Are original fragments stored separately?
      *   **Yes:** Assign a sub-number or related material number (utilize your database's material track). They are *constituents*, not the *object*.

  #### Step 3: The Sortal Continuity Test (For Accessioning)
  *What kind of thing is this, and what kills it?*
  *   **Q:** Is the object defined by its material (e.g., A geological sample, a bone) or its form/function (e.g., A tool, a sculpture)?
      *   **Material:** If the material is dispersed or chemically altered, it is a **New Object**. Create new Accession Number.
      *   **Form/Function:** If the form is maintained (even via replacement parts), it is the **Same Object**. Keep Accession Number.
  *   **Q:** Is the object digital, instructional, or performative?
      *   **Yes:** The "Object" is the *Authority to Execute Instructions*. The physical manifestation is ephemeral. Keep one Accession Number for the *Work*, track manifestations as "Iterations."

  #### Step 4: The Authority Check (The "Who Decides" Gate)
  *Who has the right to define the persistence conditions for this object?*
  *   **Living Artist:** The Artist defines identity. If they say the recast wax is the work, it is the work. **(Escalate: Curator of Contemporary Art to sign waiver).**
  *   **Source Community:** The Community defines identity. If they say the rebuilt post is the ancestor, it is the ancestor. **(Escalate: Director/Trustees for Repatriation approval).**
  *   **Historical/Unknown Maker:** The Museum defines identity based on Step 2 & 3. **(Decision: Senior Registrar).**

  #### Step 5: The Verdict & Documentation
  *   **Same Object:** Maintain Accession Number. Add note: "Identity verified via MOIP [Date]."
  *   **New Object:** Create new Accession Number. Link to previous via "Derived From" or "Part Of" field.
  *   **Composite:** Maintain Accession Number. Flag components in database.
  *   **Escalated:** Do not decide. File memo to [Named Person] citing MOIP Step 4.

  ---

  ### Running the Cases

  #### Case 1: The Bronze Figure (60% Infill, Original Fragments in Tray)
  *   **Step 1 (Purpose):** Insurance & Loan.
  *   **Step 2 (Transformation):** Function (aesthetic/display) retained. >50% material replaced.
      *   *Action:* Flag as **Composite**.
  *   **Step 3 (Sortal):** Defined by Form (Figure), not Material (Bronze).
      *   *Action:* Same Object.
  *   **Step 4 (Authority):** Historical/Unknown. Museum decides.
  *   **Verdict:**
      *   **Identity:** One Object (The Assembly). The trayed fragments are *Constituents*.
      *   **Loan:** The Assembly travels. The fragments stay (too fragile/low value).
      *   **Insurance:** Insure the Assembly at full market value, but schedule notes "60% modern infill." If destroyed, payout is based on the value of the *whole*, not the sum of parts.
      *   **Database:** Keep original Accession Number for the Figure. Ensure the trayed fragments have a linked Material Number so they aren't lost, but they do not travel under the loan contract.

  #### Case 2: The Living Artist's Wax Block (Melted/Recast Annually)
  *   **Step 1 (Purpose):** Insurance vs. Artist Intent.
  *   **Step 2 (Transformation):** Material is 100% replaced/changed state annually.
      *   *Action:* Would normally fail "Same Object."
  *   **Step 3 (Sortal):** Defined by Instruction/Concept, not Material.
      *   *Action:* Same Work.
  *   **Step 4 (Authority):** **Living Artist.**
      *   *Action:* **ESCALATE.** The Artist's certificate of authenticity overrides the Registrar's material test.
  *   **Verdict:**
      *   **Identity:** It is the accessioned object (The Work), not the wax.
      *   **Insurance:** You cannot insure the *wax* as the asset. You must insure the *Liability to Recast*. The insurer needs a special clause: "Indemnity covers cost of materials and labor to execute the artist's instruction for the 2026 iteration."
      *   **Registrar Note:** Do not create a new accession number for the 2026 wax. Log the 2026 wax as an "Iteration" in the comments field. If the insurer refuses the clause, the object cannot be insured under standard policy, not because it isn't the object, but because the risk model is wrong.

  #### Case 3: The Carved House Post (Repatriation Claim)
  *   **Step 1 (Purpose):** **Repatriation.**
      *   *Action:* **STOP.** Do not run Step 2 or 3. Material continuity is irrelevant here.
  *   **Step 4 (Authority):** **Source Community.**
      *   *Action:* **ESCALATE to Director/Trustees.**
  *   **Verdict:**
      *   **Identity:** For the purpose of return, this **IS** the 1904 object.
      *   **Reasoning:** Your procedure explicitly routes Repatriation to Step 4. In this context, the "Sortal" is not "Wood" or "1972 Reconstruction," it is "Ancestral Property." The community's persistence conditions (spiritual/functional continuity) override the museum's material conditions.
      *   **Auditor Proof:** The memo to the Trustees must cite MOIP Step 4: "Identity defined by Claimant Authority per Repatriation Protocol." This satisfies the auditor because you followed the *process*, even if the material record says "1972."
      *   **Honesty Check:** If you run Step 2 (Material Test) on this, it fails (it's a reconstruction). That is why Step 1 diverts it. If you want this to come out as the same object, you *must* accept that "Same Object" means "Same Entity of Obligation," not "Same Atoms."

  ---

  ### What This Procedure Cannot Do (The Honesty Clause)

  1.  **It Cannot Find Truth:** This protocol does not tell you if the object *really* is the same in a metaphysical sense. There is no "fact of the matter" independent of the purpose. A thing is the same object *for insurance* but a different object *for carbon dating*. This procedure forces you to pick the lens before you look.
  2.  **It Cannot Protect You from Bad Faith:** If an insurer decides the wax block isn't worth insuring, or a community decides the post is dead regardless of your return, this paperwork won't stop them. It only protects *your* decision-making process from being arbitrary.
  3.  **It Shifts, Not Solves, Risk:** In Case 3, by ruling it the "Same Object" for repatriation, you are accepting liability that you are returning the specific item taken. If later evidence proves the 1904 post was burned in 1950 and this is a total fake, the *moral* obligation might stand, but the *legal* description was false. The procedure forces you to document *why* you called it the same (Community Authority), so the auditor knows you didn't just make a cataloguing error.
  4.  **The "Half-Hour" Limit:** Complex cases (like the wax or the post) will blow the 30-minute limit at Step 4. That is a feature, not a bug. If you hit Step 4, you are no longer doing registration; you are doing policy. The procedure tells you to stop and hand it to the Director. Do not try to solve Step 4 cases at your desk.

  **Final Advice:** Print this. Stick it in the case file. When the auditor asks why you called a 1972 post a 1904 object, you show them Step 1 and Step 4. You didn't lie; you applied the correct definition of identity for the specific obligation at hand.
