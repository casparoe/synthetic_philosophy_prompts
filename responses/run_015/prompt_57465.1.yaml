      *   *Step (7) Equivocation:* Just because I *can* learn calculus (capacity), doesn't mean my nature *tends* toward calculus (sprout). Mencius claims nature *tends* toward goodness (like water tends down). Xunzi claims nature *tends* toward profit/envy (like water tends to flood), but the mind *can* channel it.
