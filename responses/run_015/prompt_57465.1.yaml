      *   (3) is the pivot. "An agent can bring about only what their nature already equips them to bring about." This sounds plausible (you can't fly without wings), but in Xunzi's context, it conflates *capacity to learn* with *inclination toward the object of learning*.
      *   (4) follows from (3).
      *   (6) follows from (5) & (4).
