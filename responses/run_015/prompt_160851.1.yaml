answer: |-
  This is a sharp distinction, and it cuts through the usual fog in this literature. Your "copycat" category captures the stealthy moral loading that happens when scholars want the condemnation associated with paradigm manipulation (deception, coercion) without meeting the evidential burden for those features. "Fluid" uses are less pernicious; they acknowledge that the term is doing work as a placeholder for context-specific stakes.

  Here is my read on the six cases, scored by how much they rely on copycatting (0 = purely fluid/stipulative, 10 = pure copycatting), followed by the ranking.

  ### Analysis

  **1. A nudge manipulates, because it works by bypassing the agent's deliberation rather than engaging it.**
  *   **(a) Copycat Score:** 9/10
  *   **(b) Load-bearing:** Yes; if you pin "manipulation" down to require deception or coercion, the claim collapses into a much weaker objection about 'non-deliberative influence'.
  *   **Read:** This is the archetypal copycat use. It quietly imports the moral sting of manipulation to condemn nudges, despite explicitly admitting the absence of the paradigm features (deception/coercion) that usually justify that sting.

  **2. Recommender systems manipulate users: they exploit weaknesses revealed by the users' own past behaviour.**
  *   **(a) Copycat Score:** 8/10
  *   **(b) Load-bearing:** Yes; the claim relies on anthropomorphising the algorithm to inherit the moral blame reserved for intentional agents.
  *   **Read:** While 'exploitation' is present, labelling it 'manipulation' copycats the requirement for a manipulator with intent, smuggling in agency where there is only code.

  **3. Advertising manipulates by creating preferences the consumer would not otherwise have had.**
  *   **(a) Copycat Score:** 7/10
  *   **(b) Load-bearing:** Yes; without the label, the claim becomes a contested empirical thesis about preference endogeneity rather than a moral condemnation.
  *   **Read:** This stretches the term to cover standard market influence, borrowing the negative profile of coercive preference formation to criticise legitimate persuasion.

  **4. The state manipulates citizens whenever it builds a choice architecture it could not justify to them in public terms.**
  *   **(a) Copycat Score:** 4/10
  *   **(b) Load-bearing:** No; the normative force rests on the lack of public justification, so the claim stands even if the label is removed.
  *   **Read:** This is largely a fluid, stipulative use; it repurposes the term to mark a specific political wrong rather than trying to trick us into seeing the state as a con artist.

  **5. Ulysses-style self-binding is a case of manipulating one's later self.**
  *   **(a) Copycat Score:** 7/10
  *   **(b) Load-bearing:** Yes; if 'manipulation' is pinned to dyadic interaction, the claim becomes a category mistake rather than a paradox.
  *   **Read:** This copycats the structural profile of interpersonal manipulation onto intrapersonal dynamics, usually to generate a philosophical puzzle rather than a moral charge.

  **6. A speaker manipulates an audience when her message is framed so that a false claim looks obviously true.**
  *   **(a) Copycat Score:** 1/10
  *   **(b) Load-bearing:** No; this describes the paradigm case of deception, so the claim remains robust even if the term is tightened.
  *   **Read:** This is not slippage but a core instance; the features present (falsity, framing) match the evidential standards of the paradigm case.

  ### Ranking: Worst Slippage First

  1.  **Case 1 (Nudging)** – *Score: 9*
  2.  **Case 2 (Algorithms)** – *Score: 8*
  3.  **Case 5 (Self-binding)** – *Score: 7*
  4.  **Case 3 (Advertising)** – *Score: 7*
  5.  **Case 4 (State)** – *Score: 4*
  6.  **Case 6 (False Framing)** – *Score: 1*

  *(Note: Cases 3 and 5 are close, but I rank 5 slightly lower on slippage because the intrapersonal stretch is often acknowledged as metaphorical, whereas the advertising claim is often presented as a literal moral indictment.)*

  ### Closing Thought
  Your distinction holds up well here. The most damaging slippage occurs where the term is used to bypass the hard work of establishing *why* a new case is objectionable, instead relying on the inherited guilt of the paradigm case. Cases 1 and 2 are the prime offenders in your field; they want the verdict without the trial.
