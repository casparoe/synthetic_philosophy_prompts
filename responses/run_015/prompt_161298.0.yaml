answer: |-
  **Part (a) [5/6 marks]**

  > "Start with the common prior assumption (CPA). It says that at the ex ante stage — before anyone gets their private signal — all traders assign the same probability distribution over states of the world."

  **Correct.** Clear and accurate definition of the ex-ante condition. (2 marks)

  > "It does not say traders have the same beliefs when they actually trade: once private information arrives their posteriors generally differ, and they can have different utility functions and different endowments as well."

  **Correct.** Important distinction between priors and posteriors/endowments. (1 mark)

  > "Milgrom and Stokey (1982) combine CPA with common knowledge of rationality, common knowledge that the trade is voluntary and mutually accepted, and the requirement that the pre-trade allocation be Pareto optimal relative to the prior."

  **Correct.** You have correctly identified the necessary technical conditions, including the ex-ante Pareto optimality of the endowment. (1 mark)

  > "The mechanism is basically Aumann's (1976) agreement theorem. With a common prior, agents cannot end up disagreeing — as soon as they communicate their posteriors have to coincide — and trade is a form of communication."

  **Imprecise.** Aumann's theorem states agents cannot *commonly know* they disagree; it does not require posteriors to coincide simply upon communication, nor does it strictly equate trade with communication in this context. MS relies more on the zero-sum nature of speculative bets under CPA than on Aumann's agreement result directly. (Deduct 0.5 marks)

  > "By Aumann, the two sides' posteriors must be identical at the moment of trade, so neither can expect to gain."

  **Incorrect.** Posteriors need not be identical; rather, under CPA, one party's expected gain implies the other's expected loss. If trade is common knowledge, both cannot expect a gain. This conflates "agreement" with "no speculative gain." (Deduct 0.5 marks)

  > "It rules out speculative trade driven purely by differences in information. It does not rule out trade for insurance or liquidity reasons..."

  **Correct.** You correctly identify exactly which trades are ruled out (speculative/info-based) and which are permitted (risk-sharing). (1 mark)

  **Part (b) [7/7 marks]**

  > "If prices fully aggregated everyone's private information they would be fully revealing, and then there would be no return to paying for information; but if nobody gathers information there is nothing for prices to aggregate, and the market collapses."

  **Correct.** Perfect summary of the Grossman-Stiglitz paradox. (2 marks)

  > "Their resolution is the noisy rational expectations equilibrium: price is only partially revealing, informed traders earn back the cost of their information, and uninformed traders effectively free-ride on the price."

  **Correct.** Accurate description of the noisy REE solution. (2 marks)

  > "So the Hayekian dispersed-knowledge story survives, but in a weaker form than it is usually stated: aggregation is real but necessarily incomplete, and the incompleteness is exactly what pays for the information in the first place."

  **Excellent synthesis.** You successfully integrate MS (limits on info-based trade) with GS (limits on price revelation) to offer a nuanced verdict on market aggregation. (3 marks)

  **Part (c) [4/7 marks]**

  > "Since MS shows that information-based speculation is impossible under CPA, and since real markets trade enormous volume every day, real traders cannot be sharing a prior — the volume has to come from heterogeneous priors."

  **Logical inconsistency.** In Part (a), you correctly noted that insurance/liquidity trade is possible under CPA. Here, you ignore that loophole. High volume does *not* prove heterogeneous priors if much of that volume is risk-sharing (which is CPA-compatible). You have contradicted your own answer in (a). (Deduct 2 marks)

  > "We could also appeal to irrationality, but we don't need that hypothesis."

  **Unsupported claim.** Given the risk-sharing loophole you identified earlier, you *do* need that hypothesis (or heterogeneous priors) only if you assume all volume is speculative. Since you haven't ruled out risk-sharing as a source of volume, this conclusion is too strong. (Deduct 0.5 marks)

  > "And this refutes the Hayekian picture rather than weakening it: the point of markets is not that they aggregate knowledge, it's that they let people with incompatible worldviews bet against each other."

  **Partial credit.** This is a coherent philosophical stance (often associated with Morris 1994), but it relies on the premise that volume *must* be betting. Because you failed to assess the "risk-sharing" counter-argument requested by the prompt's instruction to "assess that reading," this conclusion is built on incomplete analysis. (Deduct 0.5 marks)

  > "Be careful throughout to distinguish priors from posteriors from information..."

  **Mostly met.** You distinguish these well in (a) and (b), but in (c) you conflate "volume" with "information-based speculation," ignoring non-informational trade motives. (1 mark for attempt, but logic fails)

  **Total: 16/20**

  ***

  **Notes on Question Design:**
  No ambiguity flags. The question is fair, but Part (c) is designed specifically to test whether students maintain the distinctions they made in Part (a). This student answered (a) and (b) at a very high level but lost coherence in (c) by forgetting the "insurance/liquidity" loophole they correctly identified earlier. This is a common failure mode on this specific prompt, so no scaling is likely needed, but it's a good discriminator for A vs. A+ work.
