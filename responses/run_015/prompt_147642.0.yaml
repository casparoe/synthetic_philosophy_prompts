answer: |-
  # The Intention-Action Gap Protocol (IAGP)
  **For IRB Use Only | Estimated Review Time: 15 Minutes**

  ### Purpose
  This procedure identifies research protocols that compensate participants for **mental states** (intentions, beliefs, commitments) rather than **actions** or **outcomes**. These protocols risk creating "Kavka Traps": situations where rational participants are asked to do something cognitively impossible (sincerely intend to do something they have no reason to actually do). This creates psychological distress, invalidates consent, or compromises data integrity.

  ### Instructions
  Read the protocol's compensation and withdrawal sections. Answer the following five gates in order. If you hit a **STOP**, the protocol requires major revision or rejection.

  ---

  ## Gate 1: The Compensation Trigger
  **Question:** Is the reward contingent on a verifiable *action* (e.g., completing a survey, ingesting a substance) or a *mental state* (e.g., forming an intention, making a commitment)?

  *   **Test Sentence:** Look for phrases like *"paid upon sincere commitment to..."*, *"compensated for willingness to..."*, or *"reward linked to intent verification."*
  *   **IF Action:** Proceed to standard risk review. **STOP IAGP.**
  *   **IF Mental State:** Proceed to Gate 2.

  ## Gate 2: The Escape Hatch
  **Question:** Can the participant revoke the intention and refuse the action *after* the reward is secured (or the intention is verified) without financial penalty?

  *   **Test Sentence:** Look for *"participants may withdraw at any time without loss of compensation"* occurring *after* the intention-checkpoint.
  *   **IF No (Action required for pay):** This is a standard contract. **STOP IAGP.** (Review for coercion as usual).
  *   **IF Yes (Pay secured, action optional):** Proceed to Gate 3. **(Warning: This is the structural setup for the Paradox).**

  ## Gate 3: The Rationality Check (The "Kavka Bite")
  **Question:** Once the reward is secured, does the participant have any self-interested reason to follow through with the unpleasant action?

  *   **Test Condition:** If the participant thinks, *"I have the money; why should I hurt myself?"* is there any protocol mechanism that makes following through rational?
  *   **IF Yes (e.g., social pressure, secondary benefit):** Proceed to Gate 4.
  *   **IF No (Action is purely costly):** **STOP.**
      *   **Reason:** The protocol asks participants to form an intention they know they will not fulfill. This is cognitively destabilizing. A rational agent *cannot* sincerely intend to do X if they know they will not do X. You are asking them to lie to themselves to get paid.
      *   **Board Action:** Reject or require action-contingent pay.

  ## Gate 4: The Feasibility Check
  **Question:** Is the intended action physically possible and clearly defined, or is it vague/subjective?

  *   **Test Condition:** Can a third party verify the intention without mind-reading technology? (e.g., "Intend to stay awake" is verifiable via monitors; "Intend to feel brave" is not).
  *   **IF Vague/Unverifiable:** **STOP.**
      *   **Reason:** You cannot contractually bind or compensate for unobservable mental states. This invites deception and dispute.
  *   **IF Concrete/Verifiable:** Proceed to Gate 5.

  ## Gate 5: The Values Override (Judgment Call)
  **Question:** Even if the logic holds, does inducing this mental state cause undue psychological harm or degrade autonomy?

  *   **Test Condition:** Does the protocol require the participant to cultivate a desire to harm themselves, even if they don't act on it?
  *   **IF Yes:** **STOP.**
      *   **Reason:** **[EXPLICIT JUDGMENT CALL]** Logic cannot solve this. Even if they *can* form the intention, making them *want* to do something harmful violates the principle of non-maleficence.
      *   **Board Action:** Reject on ethical grounds, regardless of logical consistency.

  ---

  # Application to Current Proposals

  Below is the application of the IAGP to the two protocols currently on your desk.

  ## Proposal A: The Sleep Deprivation Study
  **Protocol:** Volunteers are paid $500 to *sincerely intend* to stay awake for 72 hours. They are monitored. They may withdraw at any time for medical safety ("monitored withdrawal") without losing pay.

  *   **Gate 1 (Trigger):** **Mental State.** Pay is for the intention to stay awake, verified by initial commitment.
  *   **Gate 2 (Escape Hatch):** **Yes.** They can withdraw for safety without losing pay.
  *   **Gate 3 (Rationality):** **Mixed.**
      *   *Analysis:* If they withdraw for *medical safety* (e.g., heart rate spikes), they have a reason to stop. But if they feel fine at hour 70, do they have a reason to stop? If pay is already secured, the rational choice is to sleep.
      *   *The Bite:* If the verification happens at Hour 0, they cannot intend to stay awake for 72 hours if they know they will sleep at Hour 70 to avoid discomfort. However, because physiological failure is likely, the "intention" is more of a "willingness to attempt."
  *   **Gate 4 (Feasibility):** **Pass.** Wakefulness is objectively monitorable.
  *   **Gate 5 (Values):** **Flag.**
      *   *Judgment Call:* Asking someone to intend to damage their health (sleep deprivation) creates stress even if they withdraw.
  *   **Verdict:** **Conditional Approval.**
      *   *Fix:* Change compensation to be *time-contingent* (paid per hour awake) rather than *intention-contingent*. This removes the paradox. The current structure asks them to intend something their biology may veto, which is ethically murky but not logically impossible like the Toxin case.

  ## Proposal B: The Saline Toxin Study
  **Protocol:** Volunteers are paid $1,000 to *sincerely intend* to ingest a solution they believe is painful. (IRB knows it is saline). They can back out right before ingestion without losing pay.

  *   **Gate 1 (Trigger):** **Mental State.** Pay is for the intention.
  *   **Gate 2 (Escape Hatch):** **Yes.** They can back out right before ingestion without losing pay.
  *   **Gate 3 (Rationality):** **FAIL.**
      *   *The Bite:* This is the pure Kavka Puzzle.
      *   *Logic:* To get the $1,000, I must intend to drink. But I know that once I have the $1,000 (intention verified), I can back out to avoid pain. Therefore, I know I will not drink. Therefore, I cannot *sincerely intend* to drink.
      *   *Harm:* The protocol requires the participant to enter a state of cognitive dissonance. They must try to convince themselves to do something they have no reason to do. This undermines the "sincerity" required for valid consent.
  *   **Gate 4 (Feasibility):** **Pass.** Ingestion is verifiable.
  *   **Gate 5 (Values):** **FAIL.**
      *   *Judgment Call:* Even if they *could* intend, you are paying them to overcome a fear of pain based on a false belief (that it might be toxic), only to let them opt out. This is manipulative.
  *   **Verdict:** **Reject.**
      *   *Reason:* The protocol is structurally broken. It requires a mental state (intention) that is rendered impossible by the incentive structure (escape hatch). It treats the participant's mind as a black box that can be tricked into rationality violations.

  ---

  # The "Values Override" Case (For Training)
  *Use this example to show board members where logic ends and ethics begin.*

  **Proposal C: The Harmless Self-Harm Intention**
  **Protocol:** Participants are paid to *sincerely intend* to cut their own arm with a sterile lancet. The lancet is钝 (blunt) and cannot break skin (IRB knows this). Participants are told it *might* hurt. They can back out after intention verification.

  *   **Gate 1-4:** Technically **PASS.**
      *   It is a mental state reward.
      *   There is an escape hatch.
      *   Rationality is questionable but humans can act irrationally.
      *   Action is verifiable.
  *   **Gate 5 (Values):** **HARD STOP.**
      *   **Why:** Even if a participant *can* form this intention, the Board should reject it.
      *   **The Judgment Call:** This step admits that **logic is not ethics.** Just because a contract *can* be constructed without logical paradox doesn't mean it respects human dignity. Asking a participant to cultivate an intention to harm themselves, even if the harm is nullified, normalizes self-harm as a commodity.
      *   **Lesson:** Gate 5 is where you exercise fiduciary duty over the participants' welfare, not just logical consistency. Do not hide behind "But they agreed to it!" when the agreement itself is psychologically corrosive.

  ---

  ### Summary for the Board
  1.  **If Pay = Intention + Escape Hatch:** You are likely in a Kavka Trap. (See Proposal B).
  2.  **If Pay = Intention + Biological Limit:** You are in a gray zone; shift to performance pay. (See Proposal A).
  3.  **If Logic Passes but Feels Wrong:** Trust Gate 5. That is your ethical mandate, not a logic puzzle.

  *Note: This procedure assumes participants are rational actors seeking to maximize benefit and minimize harm. If your population includes impaired decision-makers, reject all Intention-Contingent protocols immediately.*
