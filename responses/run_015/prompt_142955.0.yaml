          *   *Timing:* The RP starts ~500ms before action, conscious urge ("W") is ~200ms before action. The gap is real, but the interpretation is contested.
      *   *Premise 2: Consciousness is epiphenomenal.* Because the signal starts earlier, consciousness does no work.
          *   *Correction:* This is the "epiphenomenalist fallacy." Just because the *initiation* is unconscious doesn't mean consciousness can't *veto* or *modulate*. Libet himself proposed "Free Won't."
      *   *Premise 3: Evolutionary Cost.* Consciousness is metabolically expensive; if it does nothing, selection would trim it.
          *   *Correction:* This is actually the user's strongest point *against* epiphenomenalism. If consciousness exists, it likely has a function. The slip is assuming Libet proves it has *no* function.
      *   *Conclusion: Moral responsibility is a fiction.*
          *   *Correction:* Moral responsibility doesn't require libertarian free will (uncaused causation). It requires capacity for reasoning, prediction, and social regulation, which exist regardless of the millisecond timing of the RP.

